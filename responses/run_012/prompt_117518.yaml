  The structure of Sidgwick's move is an attempt to convert a *regulative* assumption into a *constitutive* fact. In *The Methods of Ethics*, the moral order (God and immortality) functions as a Kantian postulate: practical reason is entitled to assume it because morality would be irrational without it, even if theoretical reason cannot prove it. By launching the psychical research program, Sidgwick attempts to migrate this assumption from the domain of practical necessity to the domain of empirical knowledge. The structure is therefore one of *epistemic upgrade*: he seeks to replace the security of faith (which guarantees moral coherence) with the security of science (which guarantees truth).

  This creates a tension regarding the work left for evidence. If the belief is truly a postulate, evidence is logically superfluous for justification; the warrant comes from the necessity of coherent action, not the probability of truth. However, Sidgwick's pursuit implies that the practical warrant was psychologically insufficient. He was not satisfied with the *right* to believe; he wanted the *truth* of the belief. By looking for evidence, he quietly stops treating the moral order as a necessary assumption of practical reason and starts treating it as a contingent hypothesis about the universe. This introduces epistemic risk: a postulate is immune to falsification because it is grounded in need, but a hypothesis is vulnerable. Sidgwick exposed the foundation of his ethical system to the possibility of empirical disconfirmation.

  Regarding your suspicion about confirmation and disconfirmation: you are half-right. Disconfirmation (the failure of psychical research) does not logically invalidate the *postulate*—one can still claim we are entitled to hope for justice even if evidence is lacking—but it does confirm the *dualism* as ultimately unresolved. It leaves Sidgwick with the "fundamental contradiction of thought" permanently intact. However, confirmation would not have been beside the point; it would have dissolved the dualism entirely. If survival and divine justice were empirically verified, the postulate would become knowledge, and egoism and utilitarianism would be theoretically reconciled, not just practically harmonized. Sidgwick wanted ethics to be a science, and for him, a scientific ethics required a factual moral order, not just a useful fiction.

  Can one honestly hold both that a postulate is practically necessary and that evidence would be good? Logically, yes. One can prefer knowledge while accepting faith as a fallback. But Sidgwick's intensity reveals a deeper incoherence in his system: he wanted an ethics that was methodologically naturalistic (based on self-evident intuitions and empirical psychology) yet metaphysically supernatural. The psychical research episode shows that the boundary he tried to draw was porous. He could not maintain a "scientific" ethics that depended on unscientific foundations, so he tried to make the foundations scientific. The SPR was not a hobby; it was an attempt to naturalize the supernatural so that the dualism of practical reason could be resolved within a unified, empirical worldview.

  Verdict: collapses into hypothesis -- because it subjects the necessary conditions of moral rationality to the contingency of empirical falsification.
