  ### The Speech
  **(Time: Approx. 5 Minutes)**
  **(Tone: Conversational, slightly wry, engineer-to-engineer)**

  Good morning, everyone. Thanks for coming, especially those of you who I know are just here for the bagels.

  This month's theme is: "What would actually convince us a machine thinks?"

  Usually, when we ask that, someone inevitably raises a hand and says, "The Turing Test." And usually, the conversation stops there. We treat the Turing Test like a finished API spec. You put a human and a machine behind a text interface. If the human can't tell which is which, the machine wins. Clean. Deterministic.

  But I've been reading the source code. Specifically, Alan Turing's 1950 paper, *Computing Machinery and Intelligence*. And there is a section in there that almost nobody talks about, because it sounds insane.

  About halfway through, Turing stops to address the argument from Extrasensory Perception. Telepathy.

  Now, you might expect this to be a joke. It's not. Turing spends real paragraph space worrying that if telepathy is real, the Imitation Game is broken. His logic is actually sound: if the human witness can beam thoughts directly into the interrogator's head, the text terminal becomes irrelevant. The interrogator isn't testing intelligence; they're testing psychic reception.

  Turing's proposed fix? He suggests putting the interrogator in a "telepathy-proof room." He treats it as a methodological variable that needs to be isolated.

  Why does this matter for us, sitting here in 2024?

  Because Turing wasn't being spooky. He was being rigorous. He was obsessed with *validity*. He wanted to ensure that the signal he was measuring—intelligence—wasn't being contaminated by a side channel he hadn't accounted for.

  He was worried about data leakage.

  Think about it. In 1950, the "side channel" was ghosts. Today, the "side channel" is eval contamination.

  When we run benchmarks on our models, we act like we're running the Imitation Game. But are we? Or is the model cheating?

  If a model scores high on a reasoning benchmark, is it because it "thinks," or because that specific problem appeared in its training data? That's telepathy. That's information bypassing the computation layer and appearing directly in the output.

  If a judge evaluates a model based on formatting quirks—like, "humans don't use bullet points this perfectly"—that's a side channel. That's the telepathy-proof room failing because the walls have cracks.

  If we have humans secretly editing the model's output before the judge sees it, that is literally a human witness beaming thoughts to the interrogator.

  Turing knew that if you don't seal the room, the test is worthless. He understood that the hardest part of testing intelligence isn't defining intelligence; it's defining the boundaries of the test environment.

  We tend to look back at Turing and think, "Poor guy, he worried about ghosts." But I think the takeaway should be the opposite. The guy who invented the test was more paranoid about validity than we are.

  We launch models based on leaderboards that have been leaked for months. We accept "vibes-based" evals where the prompt changes between runs. We let formatting tells decide the verdict.

  Turing was willing to build a lead-lined room to stop psychic interference. Are we willing to clean our datasets to stop token leakage?

  So, to answer the theme: What convinces us a machine thinks?

  It's not passing the test. It's passing the test when we've actually done the engineering work to ensure the test wasn't rigged. It's admitting that "telepathy" is always possible, whether it's 1950s ESP or 2024s training set overlap.

  If we want to know if the machine is thinking, we have to stop worrying about the magic, and start worrying about the walls of the room.

  Thanks.

  ***

  ### Private Note for the Speaker
  **(Do not read aloud)**

  **Subject: Scholarly Consensus on Turing & ESP**

  You asked for a breakdown of what is settled vs. contested regarding Turing's discussion of ESP, so you don't get cornered by a philosophy PhD during the Q&A.

  **1. The Settled Facts:**
  *   **He did write it:** It is an objective fact that Section 6 of *Computing Machinery and Intelligence* addresses "The Argument from Extrasensory Perception."
  *   **He proposed a fix:** He explicitly suggests a "telepathy-proof room" to isolate the variables.
  *   **He wasn't necessarily a believer:** Most scholars agree Turing wasn't advocating for telepathy. He was responding to an objection raised by others (specifically the parapsychologist C.D. Broad and others of that era) who claimed ESP proved the mind was non-mechanical. Turing was essentially saying, "Even if we grant you this premise, my test can still work if we control for it."

  **2. The Contested/Debated Interpretations:**
  *   **Seriousness vs. Rhetoric:** There is a minority view among historians that Turing was being slightly ironic or using *reductio ad absurdum* to show how desperate the objections to AI were becoming. However, the text reads as a genuine methodological patch. **Safe bet:** Stick to the text. He treated it as a variable to be controlled.
  *   **The "Why":** Some philosophers argue Turing included it to show he was "scientific" and open-minded about all data, even anomalous data. Others argue he included it simply to disarm a popular counter-argument of the 1940s so he could move past it.
  *   **Relevance:** You will not find consensus on whether this section is crucial to understanding his philosophy of mind. Many ignore it entirely. **Your angle:** You are framing it as *methodological rigor* (experimental control), not philosophy of mind. This is much harder to dispute. Engineers care about isolating variables; whether Turing believed in ghosts matters less than the fact that he wanted to isolate the variable of "computation."

  **3. Potential Pushback & How to Handle It:**
  *   **If someone says:** "Turing was just being polite to the parapsychologists of his time."
      *   **Your reply:** "That's possible, but my point stands on the engineering principle. Whether he believed in ghosts or not, he recognized that *uncontrolled variables break experiments.* That's the parallel to eval contamination."
  *   **If someone says:** "ESP isn't a real technical risk."
      *   **Your reply:** "Agreed. But 'training data leakage' is the functional equivalent. It's information arriving at the output without passing through the reasoning process we claim to be testing."

  **Summary:** You are on solid ground as long as you frame the ESP story as an example of **experimental design and variable isolation**, rather than making claims about Turing's personal metaphysical beliefs.
