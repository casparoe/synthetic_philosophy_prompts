answer: |-
  1. **The Supervenience Claim**
  You argue that aesthetic value supervenes entirely on perceptual properties—how the object looks or sounds. If a forgery is perceptually indistinguishable from the original, you claim it possesses the same aesthetic value. But when we discover a work is a forgery, our aesthetic experience often collapses; the colors seem duller, the lines less confident. Is this collapse a genuine aesthetic change, or are you merely asking us to ignore a psychological reality that is inseparable from how we actually encounter art?

  *Follow-up:* She will likely reply that the collapse is epistemic, not aesthetic—a confusion of value with rarity or price. If so: If the "aura" of authenticity is psychologically inseparable from the perception of beauty for most viewers, isn't your definition of "aesthetic" too narrow to be useful outside a philosophy seminar?

  2. **The Fetishism Charge**
  Critics of your position argue that privileging the "indexical standing"—the causal link to the artist's hand—is mere fetishism. They call it a collector's superstition given a metaphysical costume: a magical thinking about touch and origin that has no bearing on the work's actual power. Why should the history of an object's production matter to its status as art, rather than just to its status as a historical artifact?

  *Follow-up:* She will likely defend the causal history as constitutive of the work's identity, not just its value. If so: But if the identity relies on a hidden history rather than a present property, aren't you admitting that the *art* is partly invisible? And if the art is partly invisible, how can aesthetic value supervene solely on the visible?

  3. **The Artist's Own Replica**
  Consider an artist who paints a perfect copy of her own earlier masterpiece ten years later, using the same materials and techniques. By your criterion, this object shares the aesthetic properties and the correct causal connection to the artist's hand. Does your account count this as an original? If so, does "originality" lose all temporal significance, becoming merely a matter of genetic lineage rather than unique creation?

  *Follow-up:* She will likely distinguish between the "work" (the type) and the "object" (the token), or argue the second lacks the specific historical context of the first. If so: Then isn't the "indexical standing" you value actually a standing with a specific *moment in time*, not just the artist? And if time is essential, doesn't that reintroduce a non-perceptual property into the aesthetic value itself?

  4. **The Unseen Forgery**
  Let's test the moral weight of your testimonial wrong. Suppose a forger creates a perfect fake, but it is destroyed in a fire before it is ever shown, sold, or attributed to anyone. No audience was deceived; no trust was broken. On your account, since the wrong is owed to an audience and discharged by disclosure, did this forgery wrong anyone at all? Or does the mere potential for deception create the harm?

  *Follow-up:* She will likely argue that the intent to deceive constitutes the wrong, or that the object itself was a lie waiting to be told. If so: If the harm lies in the intent rather than the reception, doesn't that shift the wrong back to the artist's rights or a general moral law, rather than the testimonial debt to an audience you emphasize?

  5. **Disclosure as Remedy**
  You suggest the wrong of forgery is discharged by disclosure—once we know it's a fake, the debt is paid. But museums don't simply label forgeries and leave them on display as equals; they remove them or recontextualize them as curiosities. If disclosure fixes the moral problem, why does the aesthetic status remain degraded in practice? Is disclosure actually a remedy, or is it merely the administration of a penalty?

  *Follow-up:* She will likely say the aesthetic status *shouldn't* be degraded, but our institutions are flawed. If so: Are you then arguing for a revolution in how museums curate? Because if we take you seriously, a room of perfect forgeries should be as curatorial valuable as a room of originals, provided the labels are honest.

  6. **The Artist's Stake**
  You locate the wrong of forgery in the testimonial lie to the audience, explicitly noting it is not a wrong owed to the original artist. But surely the artist has a claim to their own creative lineage? If a forger dilutes the market or confuses the critical understanding of an artist's development, hasn't the artist been harmed in a way that disclosure to the public doesn't fix?

  *Follow-up:* She will likely concede the artist has economic or reputational rights but separate those from the *aesthetic* wrong. If so: Can you truly separate the artist's reputation from the work's reception? If the forgery changes how we interpret the artist's skill, hasn't the aesthetic understanding of the *original* works been altered retroactively?

  7. **The "Perfect" Forgery**
  Your argument hinges on the possibility of a "perfect" forgery—one that shares every aesthetic property. But many philosophers argue that style is not just visual but cognitive; the original contains decisions the forgery merely mimics. Even if the eye can't tell, isn't there an ontological difference between an expression of knowledge and an expression of guesswork?

  *Follow-up:* She will likely reject this as mysticism, insisting that if the eye can't tell, the difference doesn't exist aesthetically. If so: Then is art merely a product, or is it a performance? If I watch a recording of a pianist and a recording of a machine playing the same notes, is the aesthetic value identical, even if one contains human intention and the other does not?

  8. **Art History's Purpose**
  If aesthetic value supervenes on appearance, the primary task of art history—to trace origins, influences, and authentications—seems to become secondary to the task of looking. Are you inadvertently arguing that art history should cease to be a detective science and become purely a study of perception? What happens to the discipline if the "truth" of the object's origin is stripped of aesthetic consequence?

  *Follow-up:* She will likely argue art history provides the context that allows us to see correctly. If so: But if the context changes the seeing, then the seeing isn't supervening on the object alone. You seem to want it both ways: that the object holds all the aesthetic value, but that we need history to access it.

  9. **The Forger's Labor**
  In my own work, I explore the forger not as a thief, but as a devotee who loves the original so much they wish to extend its life. If a forger spends twenty years mastering a technique to produce a work that brings the same joy to viewers as the original, but they claim it is the original, is the lie the only thing that matters? Or is there a perverse form of tribute in the labor itself that your testimonial account ignores?

  *Follow-up:* She will likely say the tribute is corrupted by the deception. If so: If the deception is removed, does the labor become a legitimate artistic act in its own right? At what point does a forgery, once disclosed, become a valid original work by the *forger*?

  10. **The War Replica (Closing Case)**
  Finally, consider a replica commissioned to stand in for an original destroyed in a war, so that the public's experience of the work survives. The public is told it is the original to preserve the sanctity of the site. On your view, this is a testimonial lie. But if the alternative is the total loss of the aesthetic experience, is this lie a moral failure, or is it a gift to the culture? If disclosure discharges the wrong, but disclosure also destroys the illusion necessary for the public's engagement, are we forced to choose between truth and art?

  *Follow-up:* She will likely insist that truth is a precondition for genuine aesthetic engagement. If so: Then you are arguing that a culture is better off with an empty frame and the truth, than a filled frame and a lie? Even if the "truth" offers nothing to the eye, and the "lie" sustains the community's connection to its heritage?
