answer: |-
  You are right to sense that there is no contradiction in Marx's logic, even though there is a screaming contradiction in the object he is describing. The difficulty you are having with the "argumentative shape" comes from the fact that Marx is tracking two different registers of reality simultaneously: the *social form* of production (value) and the *material content* of production (wealth).

  Here is a close reading of the passage, reconstructing the internal logic in the order the concepts must be taken to resolve the tension.

  ### 1. The Core Distinction: Value vs. Real Wealth
  To understand how the two sentences hang together, you must first distinguish the two subjects they are talking about. They are not talking about the same thing.

  *   **Sentence 2** is talking about **Value**. When Marx says "production resting on value," he is referring to the specific social logic of capitalism. In this system, wealth is not counted in tons of steel or bushels of wheat; it is counted in abstract labor time.
  *   **Sentence 3** is talking about **Real Wealth**. This refers to material abundance, use-values, the actual stuff that sustains human life.

  The argumentative work of the passage is to show that capitalism creates a divergence between these two. It develops a system where the *measure* of wealth (labor time) becomes detached from the *source* of wealth (science and machinery).

  ### 2. Sentence 2: The "Presupposition" that "Remains"
  > *"Its presupposition is – and remains – the mass of direct labour time, the quantity of labour employed, as the determinant factor in the production of wealth."*

  This sentence is doing the heavy lifting of defining the **law of value**.

  *   **"Presupposition":** This is technical. It means the logical foundation. Capitalism cannot exist without assuming that labor time is the substance of value. If labor time is not the measure, surplus value cannot be extracted, and profit (in the Marxist sense) cannot be calculated.
  *   **"And remains":** This is the crucial pivot. Marx is not saying that labor time *actually* remains the source of wealth in high industry. He is saying the *system* continues to treat it as such. The social relation of capital *requires* labor time to be the ruler, even if the physical reality of production has moved on.

  **Argumentative Work:** This sentence establishes the rigidity of the capitalist form. Capitalism is structurally unable to update its measuring stick. It is like trying to measure digital data with a ruler. The ruler (labor time) "remains" the official standard, even if it no longer measures the object accurately.

  **Rhetorical Work:** The dash emphasis ("is – and remains –") is rhetorical. It underscores the stubbornness of the system. Marx is highlighting the inertia of the value-form.

  ### 3. Sentence 3: The Material Shift
  > *"But to the degree that large industry develops, the creation of real wealth comes to depend less on labour time and on the amount of labour employed than on the power of the agencies set in motion during labour time..."*

  This sentence describes the **historical tendency** of the material forces of production.

  *   **"Real wealth":** As noted above, this is use-value. A highly automated factory produces more "real wealth" (goods) with less labor than a hand-tool workshop.
  *   **"Agencies set in motion":** This refers to machinery, automation, and fixed capital.
  *   **"Depends less on":** This resolves the tension with Sentence 2. Sentence 2 says the *system* still measures by labor time. Sentence 3 says the *physics of production* no longer relies on labor time.

  **Argumentative Work:** This establishes the contradiction. The material base of society is shifting toward science and machinery, but the social superstructure (value) is stuck on labor time.

  ### 4. Science, Technology, and the "General State"
  > *"...depends rather on the general state of science and on the progress of technology, or the application of this science to production."*

  You asked if "general state of science" is distinct from "progress of technology." In this specific clause, Marx is distinguishing the **knowledge** from the **embodiment**.

  *   **"General state of science":** This is the social knowledge available at a given time. It is a collective product. It exists in the public sphere, in universities, in the general understanding of physics and chemistry. It is not the property of a single worker.
  *   **"Progress of technology... application":** This is that knowledge crystallized into machines (fixed capital).

  **Argumentative Work:** Marx is locating the source of productivity outside the individual worker. The worker no longer creates wealth through their own skill; they create wealth by activating the "general state of science" embedded in the machine. This undermines the idea that the capitalist is paying for the "value" created by the worker's specific effort. The real driver is social knowledge, which cannot be easily commodified as individual labor time.

  ### 5. The Scare Quotes: "Powerful Effectiveness"
  > *"...whose 'powerful effectiveness' is itself in turn out of all proportion to the direct labour time spent on their production..."*

  The scare quotes here are doing critical work. They signal **alienation**.

  *   **Why quotes?** The effectiveness appears to belong to the machine (capital). It looks like the machine is productive. Marx puts it in quotes to suggest this is a appearance, not the essence. The "power" actually belongs to the social knowledge (science) that built the machine, but under capitalism, this power confronts the worker as an alien force owned by the capitalist.
  *   **"Out of all proportion":** This is the mathematical core of the crisis. If a machine takes 100 hours to build but allows the production of goods equivalent to 10,000 hours of labor, the link between labor time input and wealth output is broken.

  **Rhetorical Work:** The quotes are rhetorical skepticism. Marx is distancing himself from the bourgeois economist who sees the machine's power as natural. He is flagging it as a social relation disguised as a technical property.

  ### 6. Resolving the Tension
  Now we can answer your main question: **Is Marx contradicting himself?**

  No. He is describing a **structural contradiction within capitalism**.

  *   **Claim A (Sentence 2):** Capitalism *must* treat labor time as the measure of wealth to function as capitalism. (This is the *Form*).
  *   **Claim B (Sentence 3):** Capitalism *actually* produces wealth through science and machinery, making labor time irrelevant to the volume of goods. (This is the *Content*).

  The tension is not in Marx's argument; the tension is the engine of capitalist crisis. Capitalism is a system that measures wealth by labor time, while simultaneously developing technology that makes labor time obsolete as a measure of wealth.

  ### 7. Addressing Your Friend's "Collapse" Theory
  Your friend argues that this passage shows Marx believed capitalism would collapse automatically once automation advanced far enough. This is a misreading, though an understandable one.

  Here is why the text does not support automatic collapse:

  1.  **"To the degree that..."** Marx phrases this as a tendency, not a switch. He says "to the degree that large industry develops." This implies a gradient, not a binary event.
  2.  **"Presupposition... Remains."** By insisting the presupposition *remains*, Marx suggests the system fights to maintain the labor-time measure even when it is obsolete. Capitalism does not simply turn off when the measure fails; it distorts production to maintain the measure (e.g., creating artificial scarcity, intellectual property rents, or financialization).
  3.  **The Nature of the Crisis:** The passage describes the undermining of the *law of value*, not necessarily the physical cessation of production. The crisis is that value production becomes impossible, not that goods stop being made. "Real wealth" continues to grow (Sentence 3), but the *value* form (Sentence 2) becomes a fetter on it.

  **How to refute your friend:** Tell them Marx is describing a **crisis of measurement**, not a mechanical breakdown. The system doesn't collapse because the machines stop; it enters crisis because the machines make the *price system* (based on labor time) nonsensical. Whether that leads to collapse or a mutation of capitalism depends on political struggle, not just the technical level of automation.

  ### 8. Summary of Argumentative vs. Rhetorical Work
  To lead your discussion, you can map the passage like this:

  *   **Argumentative Load-Bearers:**
      *   The distinction between "production resting on value" (Sentence 1 & 2) and "creation of real wealth" (Sentence 3).
      *   The definition of "presupposition" as the logical requirement of the value-form.
      *   The claim that scientific knowledge is a "general state" distinct from direct labor time.
      *   The disproportion between labor time spent on machines and the output those machines enable.

  *   **Rhetorical/Emphatic Devices:**
      *   "And remains" (emphasizing the stubbornness of the value-form).
      *   Scare quotes on "powerful effectiveness" (signaling alienation/appearance).
      *   "Out of all proportion" (emphasizing the magnitude of the divergence).

  ### Conclusion for Your Seminar
  The shape of the argument is a **divergence**. Marx starts with the definition of the capitalist form (labor time is king). He then introduces the historical development of the material content (science is king). He holds these two together to show that capitalism is a system where the *measure* of wealth is increasingly unrelated to the *source* of wealth.

  The "presupposition" does the technical work of explaining why capitalism doesn't just switch to a new system immediately: it is bound by its own logic to measure by labor time, even as it renders labor time economically irrelevant. This is not a contradiction in Marx's head; it is the contradiction in the machine of capitalism itself.
