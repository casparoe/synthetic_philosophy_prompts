      *   *Check:* Did I answer "What counts as progress?" *Adjustment:* Make sure specific deliverables (theorems, distinctions, demonstrations) are linked to the specific diagnosis.
      *   *Check:* Is the distinction between "theory of rational choice" and "nature of moral commitment" clear? *Adjustment:* Explicitly map Camp 1&2 to Rational Choice and Camp 3 to Moral Commitment.
