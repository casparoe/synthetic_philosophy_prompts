answer: |-
  Your diagnosis of the situation is astute, and your hunch captures a significant portion of the stagnation. However, the impasse is not merely a case of participants talking past one another; it is a layered problem involving a category error, a substantive metaphysical dispute, and a formal impossibility result. To disentangle this, we must distinguish between the *project* of moral uncertainty (is it coherent?) and the *mechanics* of moral uncertainty (if coherent, how does it function?).

  Here is a characterization of the positions, a diagnosis of the disagreements, and an assessment of what progress would look like.

  ### 1. Characterization of the Positions

  To diagnose the dispute, we must first strip the positions of their rhetorical defenses and state their core claims.

  *   **The Cardinal Formalists (Camp 1):** They claim that moral theories output *choice-worthy magnitudes*. Even if a theory does not explicitly state "1 util = 10 animal units," the formalist argues that for the theory to guide action in a world of uncertainty, there must exist a fact of the matter about the ratio of values between theories. They treat moral uncertainty as isomorphic to empirical uncertainty.
  *   **The Ordinal Formalists (Camp 2):** They claim that moral theories output only *rankings*. Theory A says $X \succ Y$, but not "by how much." They argue that importing cardinality is a substantive moral claim, not a neutral decision-theoretic move. Consequently, they seek decision rules (like Borda counts or Maximin) that respect ordinal inputs without assuming intertheoretic comparability.
  *   **The Deflationists (Camp 3):** They claim that "moral uncertainty" is a category mistake. They argue that deliberation about which moral theory is true *is* first-order moral deliberation. To ask "how much weight to give Utilitarianism vs. Deontology" is just to ask "which moral principles are correct?" They view the decision-theoretic apparatus as smuggling in a consequentialist meta-ethics that privileges the very theories it claims to remain neutral toward.
  *   **The Skeptics of Infinite Stakes (Camp 4):** They claim that the formalist machinery is unstable. If any moral theory allows for infinite or lexicographically superior values (e.g., saving a soul, preventing extinction), and you assign it non-zero credence, expected value calculations diverge or are dominated by that theory. This is not a separate moral view but a boundary condition test for the Formalists.

  ### 2. The Diagnosis: Three Layers of Disagreement

  Your hunch is correct regarding the Formalists and Deflationists, but incomplete regarding the Formalists themselves. The impasse is composed of three distinct types of disagreement layered on top of one another.

  **Layer 1: Cross-Purpose (Verbal/Conceptual)**
  *   **The Dispute:** Formalists (Camps 1 & 2) vs. Deflationists (Camp 3).
  *   **Diagnosis:** This is a disagreement about the **nature of moral commitment**. The Formalists are asking a question in the *theory of rational choice*: "Given that I have these commitments, how do I maximize rationality?" The Deflationists are asking a question in *meta-ethics*: "What kind of thing is a moral commitment?"
  *   **Why it stalls:** The Formalist assumes the agent is a container of multiple competing "sub-agents" (theories) that need negotiation. The Deflationist assumes the agent is a unified seeker of truth. When the Deflationist says "just figure out what's right," the Formalist hears "ignore the uncertainty." When the Formalist says "maximize expected choice-worthiness," the Deflationist hears "abandon the search for truth in favor of compromise." They are not contradicting each other; they are describing different activities.

  **Layer 2: Substantive (Metaphysical)**
  *   **The Dispute:** Cardinal Formalists (Camp 1) vs. Ordinal Formalists (Camp 2).
  *   **Diagnosis:** This is a disagreement about the **ontology of moral value**. Is value a magnitude that exists independently of the theory describing it (Realism about intertheoretic comparison), or is value constituted by the theory itself (Constructivism/Relativism)?
  *   **Why it stalls:** The Cardinalist assumes there is a "God's eye" scale onto which all theories can be mapped. The Ordinalist argues that such a scale presupposes a "super-theory" that adjudicates between the others, which begs the question. This is not verbal; it is a substantive claim about whether moral properties are comparable across conceptual schemes.

  **Layer 3: The Hidden Formal Problem (Structural)**
  *   **The Dispute:** All Formalists vs. Mathematical Reality.
  *   **Diagnosis:** This is an **aggregation impossibility**. The Formalist project is structurally analogous to Social Choice Theory (aggregating preferences of many voters), but applied intra-personally (aggregating theories of one agent). Arrow's Impossibility Theorem and its successors suggest that you cannot aggregate ordinal rankings into a coherent collective preference without violating reasonable conditions (like non-dictatorship or independence of irrelevant alternatives).
  *   **Why it stalls:** Camp 1 tries to bypass this by assuming cardinality (which lacks justification). Camp 2 accepts ordinality but must adopt decision rules that violate intuitive rationality constraints (like transitivity). The impasse is not just philosophical; it is mathematical.

  ### 3. Evaluating Your Hunch

  You hypothesized that the Formalists and Deflationists are answering different questions. **This is correct.** The Formalists are building a bridge; the Deflationists are asking why we need to cross the river.

  However, you asked if the impasse is *instead* a hidden formal problem or a metaphysical disagreement. The answer is **both**.
  *   The **Formalist vs. Deflationist** stalemate is a cross-purpose disagreement about the nature of moral commitment.
  *   The **Cardinal vs. Ordinal** stalemate is a substantive metaphysical disagreement about the magnitude of moral value.
  *   The **overall stagnation** is driven by the hidden formal problem (the impossibility of aggregation without arbitrary normalization).

  If you resolve the metaphysical disagreement (e.g., by proving value is cardinal), you still face the formal problem (how to compare cardinals without a common unit). If you resolve the formal problem (e.g., by adopting a voting rule), you still face the metaphysical objection (why treat theories as voters?).

  ### 4. What Would Count as Progress?

  Given this diagnosis, progress looks different for each layer of the dispute.

  *   **For the Formalist/Deflationist Divide:** Progress would be a **distinction that dissolves the puzzle cases**. We need a clear criterion for when "uncertainty" is merely ignorance of first-order facts (supporting Deflationism) versus when it is a structural feature of agency (supporting Formalism). For example, a demonstration that moral credence functions differently than empirical credence (e.g., it is non-factive) would clarify why standard decision theory fails.
  *   **For the Cardinal/Ordinal Dispute:** Progress would be a **representation theorem**. If the Ordinalists can prove that *any* decision rule satisfying basic rationality constraints *implies* cardinal comparability, the Cardinalists win. If the Cardinalists can derive intertheoretic comparison ratios from the internal structure of the theories themselves (without a super-theory), they win. Currently, neither exists.
  *   **For the Formal Impasse:** Progress would be a **demonstration that the question is ill-posed** in its current form. This would involve showing that "maximizing" is the wrong goal under moral uncertainty. Instead of optimization, the field might need to move toward a model of *negotiation* or *coherence*, where the goal is not to find the single right action but to maintain integrity across competing commitments.

  **My recommendation for your foundation:** The most productive path is likely the third. Treat the allocation not as a calculation of expected value, but as a **reflective equilibrium**. Acknowledge that the single impact-per-dollar scale is indeed an artifact. Progress for you would be abandoning the search for a single scale and adopting a "portfolio" approach that explicitly allocates resources to satisfy the *constraints* of each moral view (e.g., a minimum floor for animal welfare, a minimum floor for existential risk) rather than maximizing a sum.

  ### 5. Defending the Diagnosis Against Objections

  **Objection 1: "Moral Realism solves the metaphysical layer."**
  *   *The Objection:* If moral facts are objective, then there is a fact of the matter about the ratio between human and animal suffering. The Cardinalists are right; we just haven't found the numbers yet.
  *   *The Defense:* Even if objective moral facts exist, they are theory-laden. A Utilitarian and a Deontology do not disagree about the *number* attached to suffering; they disagree about *what makes suffering relevant*. Realism does not provide an exchange rate between incommensurable currencies. Knowing that "suffering is bad" does not tell you how to trade off "preventing suffering" against "respecting autonomy" when the theories define those terms differently. The metaphysical disagreement remains because the *units* of measurement are defined by the theories themselves.

  **Objection 2: "Pragmatism solves the formal layer."**
  *   *The Objection:* We don't need a perfect theorem. We just need a rule that works well enough for grantmaking. Why worry about impossibility results when we have to write checks in the spring?
  *   *The Defense:* Pragmatism hides the normative force of the decision. If you use a Borda Count (Ordinal) but the true moral landscape is Cardinal, you may systematically underfund high-stakes, low-probability interventions (like long-term risk). If you use Expected Value (Cardinal) but the landscape is Ordinal, you are making arbitrary normalization choices that dictate outcomes. In a foundation context, "what works" is defined by your moral goals. If the apparatus distorts the goals, pragmatism is just bias in disguise. The impossibility result warns you that *any* rule you pick will violate some intuitive moral constraint; you must choose which violation to accept, not pretend the calculation solved it.

  **Objection 3: "The Deflationists are just dogmatists."**
  *   *The Objection:* Camp 3 is just refusing to admit they don't know the truth. Formalism is the only honest approach for fallible agents.
  *   *The Defense:* This mischaracterizes the Deflationist claim. They are not claiming certainty; they are claiming that *probabilizing* moral theories is incoherent. One can be fallible without treating moral views as competing hypotheses. One can deliberate tentatively without assigning credences. The objection fails because it assumes the Formalist framework (credence + value) is the only way to model fallibility, which is precisely what the Deflationist denies.

  ### Summary

  The literature is stuck because it is trying to solve a **formal aggregation problem** (how to combine theories) that relies on a **metaphysical premise** (that theories are comparable) which is contested by a **meta-ethical objection** (that the project is incoherent).

  Your hunch is right: The Formalists and Deflationists are talking past each other. But the Formalists are also stuck on a mathematical cliff. Progress requires admitting that there is no "view from nowhere" that can score your three grant areas on a single scale. The scale is not a measurement; it is a policy choice. Recognizing this does not paralyze you; it liberates you to choose a decision rule that reflects the *kind* of compromise your trustees are willing to make, rather than pretending the math made the choice for you.
