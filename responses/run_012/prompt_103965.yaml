      *   **Task:** Create a practical, executable procedure for selecting a reference class for novel risks (the "reference-class problem").
      *   **Constraints:** 2 days per case, no bespoke modelling, must survive Chief Actuary + Regulator scrutiny.
      *   **Specific Needs:** Ordered questions, sufficiency criteria, tests for narrowness/broadness, stopping rules (when to pick a class vs. when to escalate to judgment), distinction between theory and practice, candid limitations.
      *   **Application:** Run the procedure on two specific cases:
          1.  Battery chemistry (18 months data, ~40 incidents).
          2.  Construction method (only pool is "all large construction liability claims").
      *   **Tone/Style:** British English, professional, candid, pragmatic, acknowledging the philosophical underpinnings without getting bogged down in them.
      *   **Key Insight:** The user knows the theory (Hájek, Reference Class Problem) but needs an *operational* framework. They suspect the battery case might force a broader class than underwriters want.

  2.  **Deconstruct the Reference Class Problem for Insurance:**
      *   *Theory:* Reichenbach/Hájek. Any event belongs to infinite classes. Frequencies vary by class. Which one is "true"?
      *   *Practice:* We need a "defensible number," not necessarily the "true probability." Defensibility = Logic + Data + Consistency + Prudence.
      *   *Tension:* Relevance (narrow class) vs. Stability (wide class).
      *   *Regulatory Angle:* Solvency II / IFRS 17 implications (best estimate + risk margin). The regulator wants to know *why* you chose what you chose.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Need a step-by-step flow.
      *   *Step 1: Define the Event.* What exactly are we pricing/reserving for?
      *   *Step 2: Generate Candidate Classes.* Brainstorm the spectrum (Broad to Narrow).
      *   *Step 3: Data Sufficiency Check.* The "100 observations" rule is too rigid. Need a stability test.
      *   *Step 4: Homogeneity/Relevance Check.* Does the past look like the future?
      *   *Step 5: The "Tug-of-War" Test.* Compare frequencies. If they diverge too much, why?
      *   *Step 6: Selection & Adjustment.* Pick the class, apply expert judgment loading.
      *   *Step 7: The "Sleep at Night" Test.* Documentation and escalation.
      *   *Philosophical Translation:* Keep "Homogeneity" and "Stability." Drop "Truth." Acknowledge "Subjectivity."

  4.  **Refining the Tests:**
      *   *Narrowness:* Confidence intervals. If the CI is too wide, the class is too narrow.
      *   *Broadness:* Qualitative mismatch. If the risk driver isn't present in the broad class, it's too broad.
      *   *Stopping Rule:* When the marginal gain in relevance is outweighed by the loss in statistical credibility.
      *   *Escalation:* When data is absent or contradictory to the point where any number is a guess.

  5.  **Applying to Case 1: Battery Chemistry:**
      *   *Data:* 18 months, 40 incidents.
      *   *Underwriter desire:* Likely wants to use the specific chemistry/manufacturer data (narrow).
      *   *Procedure outcome:* 40 incidents is likely statistically unstable for tail risk. 18 months is too short for trend.
      *   *Recommendation:* Broaden to "Lithium-ion in industrial settings" or similar. Acknowledge the underwriter will hate this (dilutes the 'new tech' premium argument).
      *   *Why:* Stability trumps specificity when $N$ is low and severity is high.

  6.  **Applying to Case 2: Construction Method:**
      *   *Data:* Only "All large construction liability claims."
      *   *Procedure outcome:* This is extremely broad.
      *   *Recommendation:* Use the broad class but apply a heavy expert judgment loading (or uncertainty margin). Alternatively, treat as a "zero frequency, high severity" event and use scenario-based capital rather than frequency/severity modelling.
      *   *Why:* No better data exists. The procedure forces admission of ignorance.

  7.  **Addressing the "What it cannot do" Section:**
      *   It cannot create data.
      *   It cannot predict black swans.
      *   It cannot resolve disputes between commercial pressure and prudence (that's governance).
      *   It cannot replace the need for documentation.

  8.  **Review against Constraints:**
      *   *British English:* Check spelling (modelling, programme, centre), idioms (kick the can, cover your back).
      *   *Tone:* Professional, empathetic to the actuarial struggle.
      *   *Philosophy:* Mention Reichenbach/Hájek lightly but focus on operationalising them.
      *   *Deadline:* Ensure the procedure feels doable in 2 days.

  9.  **Self-Correction/Iterative Polishing:**
      *   *Initial thought:* Suggest Bayesian updating. *Correction:* User said "no scope for bespoke statistical modelling." Keep it frequentist-friendly but acknowledge judgment.
      *   *Initial thought:* Strict N > 100 rule. *Correction:* User explicitly rejected this. Use Confidence Interval width instead.
      *   *Focus:* Make sure the distinction between "Fact" (data) and "Policy" (risk appetite) is clear in the escalation step.
      *   *Case Study:* Ensure the battery conclusion is the "unwelcome" one predicted by the user.

  10. **Final Polish:** Check formatting (bolding, lists) for readability. Ensure the "Procedure" looks like a checklist. (Proceeding to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I need to make sure I don't just give a list of questions, but explain *why* each question matters in the context of the reference class problem. I also need to be very clear about the "Escalation Point" – where the analyst stops and the Chief Actuary/Board starts.

  *(Refining the Battery Case)*: 40 incidents in 18 months sounds like a lot, but for *liability* (which implies lag), it's probably reported incidents, not ultimate. I need to highlight the IBNR risk. Also, 18 months is too short for a trend. The procedure should flag the "Time" dimension of the reference class.

  *(Refining the Construction Case)*: "All large construction liability claims" is almost useless for pricing a specific method. The procedure should recommend treating this as a "shock" risk rather than a frequency/severity burn.

  *(Final check on British English)*: "Programme", "Modelling", "Centre", "Defence", "Licence". Ensure tone is reserved but direct.

  *(Final check on Philosophy)*: Explicitly mention that we are sacrificing "truth" for "defensibility". That is the core actuarial translation of the reference class problem.

