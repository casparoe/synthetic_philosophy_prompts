answer: |-
  Here is the decision tree designed for your handout, followed by the commentary on the distinctions and the concrete cases.

  ### HANDOUT: Mapping "The Will of the People"

  **Instructions:** Start at **Q1**. Follow the path that matches your intuition about a specific political claim. Record your leaf code.

  **Q1. Ontology: When a politician says "The People demand X," what exists?**
  *   **A:** Only individual citizens with separate preferences. There is no single "mind" of the people. → *Go to Q2*
  *   **B:** A collective entity or interest that is distinct from the sum of current individual preferences. → *Go to Q3*
  *   **C:** Nothing real exists; the phrase is purely a tool to mobilize or shut down argument. → *Leaf D (The Instrument)*

  **Q2. Aggregation: If only individuals exist, how do we combine them?**
  *   **A:** We count them (votes/polls). The majority preference *is* the will. → *Leaf A (The Arithmetic)*
  *   **B:** We balance them. The "will" is just a temporary compromise between competing groups. → *Leaf B (The Pluralist)*

  **Q3. Origin: If a collective will exists, where does it come from?**
  *   **A:** It is *created* by following fair rules (elections, courts, debate). Without the procedure, there is no will. → *Go to Q4*
  *   **B:** It *pre-exists* the rules. Institutions try to find it, but the will is there even if the institutions fail. → *Go to Q5*

  **Q4. Procedure: If the will is created by rules, can the outcome be wrong?**
  *   **A:** No. If the rules were followed, the result is legitimate by definition. → *Leaf C (The Proceduralist)*
  *   **B:** Yes. Sometimes the rules produce a result that betrays the spirit of the system. → *Leaf C (The Proceduralist)* [Note: This path collapses into Q5B. If you think rules can betray the will, you believe the will exists before the rules.]

  **Q5. Discovery: If the will pre-exists, how do we identify it?**
  *   **A:** By deliberation. If people talk long enough without coercion, they will converge on the common good. → *Go to Q6*
  *   **B:** By embodiment. A specific leader or movement intuitively grasps the people's true desire better than a count does. → *Go to Q7*

  **Q6. Fallibility: Can the people be wrong about their own common good?**
  *   **A:** No. The outcome of true deliberation is always right (it defines the right). → *Leaf E (The General Will)*
  *   **B:** Yes. They might need guidance to realize what they actually will. → *Leaf E (The General Will)* [Note: Rousseauans argue the General Will is always right, but the *vote* on it can be mistaken. If you think the people need a vanguard to correct them, you are drifting toward Q7.]

  **Q7. Verification: If a Leader embodies the will, what happens if they lose an election?**
  *   **A:** They stop speaking for the people. The count overrides the embodiment. → *Leaf C (The Proceduralist)* [Note: This path collapses back to Procedure.]
  *   **B:** The election was rigged, or the "silent majority" was not counted. The Leader still speaks for the *Real* People. → *Leaf F (The Embodied Claim)*

  **Q8. Dissent (Apply to your Leaf): What is the status of those who disagree with the identified Will?**
  *   *(Add this suffix to your Leaf)*
  *   **i:** They are opponents with legitimate interests. → *(Standard for A, B, C)*
  *   **ii:** They are mistaken about their own true interests/freedom. → *(Standard for E)*
  *   **iii:** They are enemies of the People and may be excluded. → *(Standard for F)*

  ---

  ### THE POSITIONS (LEAVES)

  **Leaf A: The Arithmetic (Aggregative)**
  *   **Position:** The will of the people is simply the sum of individual preferences at a specific time, usually identified by majority vote.
  *   **Awkward Commitment:** You must accept that if 51% want to harm the 49%, that is genuinely "what the people want." There is no higher standard to call it unjust.

  **Leaf B: The Pluralist (Social Choice)**
  *   **Position:** There is no single will; there are only shifting coalitions of groups. "The People" is a convenient label for whatever coalition currently governs.
  *   **Awkward Commitment:** You must admit that "the public interest" is often a fiction used to mask the victory of one special interest over another.

  **Leaf C: The Proceduralist (Constitutionalist)**
  *   **Position:** The will of the people does not exist prior to the institutions. It is constituted by following the rules (elections, courts, rights).
  *   **Awkward Commitment:** You must accept outcomes that everyone hates (including the majority) if the procedure demands it (e.g., a court blocking a popular law).

  **Leaf D: The Instrument (Deflationary)**
  *   **Position:** "The Will of the People" is rhetorical smoke. It is used to legitimize power or shame opponents, but refers to no fact.
  *   **Awkward Commitment:** You must view all democratic advocacy as essentially manipulative; there is no such thing as "representing" the people, only claiming to.

  **Leaf E: The General Will (Rousseauian)**
  *   **Position:** There is a common good that exists objectively. When citizens deliberate without faction, they discover this will, which is their own true freedom.
  *   **Awkward Commitment:** You must accept that a dissenter can be "forced to be free." If they oppose the General Will, they are mistaken about their own interests.

  **Leaf F: The Embodied Claim (Populist/Plebiscitary)**
  *   **Position:** The People are a moral entity distinct from the electorate. A Leader directly channels this will, bypassing institutions that may have been captured by elites.
  *   **Awkward Commitment:** You must accept that institutional checks (courts, term limits) are illegitimate obstacles if they block the Leader who embodies the People.

  ---

  ### COMMENTARY FOR THE FACILITATOR

  **1. Evaluation of Your Five Distinctions**
  *   **(a) Existence (Real vs. Sum vs. Fiction):** **Real Fault Line.** This is the classic Nominalist vs. Realist debate in political ontology. Everyone in the literature recognizes this split.
  *   **(b) Independence vs. Constitution:** **Real Fault Line.** This distinguishes Liberal Constitutionalism (will is made by rules) from Republican/Populist theories (rules serve the pre-existing will).
  *   **(c) Identification (Count vs. Representative vs. Content):** **Real Fault Line.** This maps to Procedural Democracy vs. Plebiscitary Democracy vs. Deliberative Democracy.
  *   **(d) Treatment of Dissent:** **Real Fault Line.** This is the friend/enemy distinction (Schmitt) vs. the loyal opposition (Liberalism). Crucial for distinguishing democracy from totalitarianism.
  *   **(e) Fallibility:** **Your Hobbyhorse.** Be careful here. In the literature, fallibility is usually a *consequence* of (a) and (c), not a separate choice.
      *   If you choose *Arithmetic* (A), the will cannot be "wrong" (it's just a count).
      *   If you choose *General Will* (E), the will cannot be "wrong" (it defines the good), but the *vote* can be.
      *   If you choose *Embodied* (F), the will cannot be "wrong," but the *institutions* can be.
      *   *Advice:* Treat this as a derivative question. If a participant insists the Will can be "wrong," push them to Q3 (Origin). They likely believe the Will is pre-existing but the *measurement* was faulty.

  **2. Empty or Collapsed Nodes**
  *   **The "Mistaken Procedure" Collapse:** In Q4, if a user says "The will is created by rules, BUT the rules can produce the wrong will," they have logically exited the Proceduralist position and entered the Pre-existing position (Q5). You cannot claim the will is *constituted* by rules and simultaneously claim the rules got the will *wrong*. I have flagged this in the tree.
  *   **The "Unknowable Will":** A position where "A collective will exists, but it is impossible to identify" is theoretically possible but politically empty. Nobody organizes around an unknowable will. I have omitted it as a dead end.

  **3. Concrete Cases for Branch Nodes**
  Use these scenarios to force a choice when the group stalls.

  *   **For Q1 (Ontology):** *The Referendum.* "In 2016, 52% voted Leave. Did 'The People' decide to leave the EU? Or did 52% of individuals decide that, while the other 48% decided differently, meaning there was no single 'People's decision'?"
  *   **For Q3 (Origin):** *The Court Block.* "A Supreme Court blocks a law supported by 60% of the population. Did the Court violate the People's Will? Or did the Court define the only Will that matters?"
  *   **For Q5 (Discovery):** *The Bare Majority Claim.* "A party wins 50.1% of the vote and claims they now represent 'The Whole Country.' Is this a legitimate synthesis, or a lie?"
  *   **For Q7 (Verification):** *The Defeated Leader.* "A charismatic leader loses an election but claims the election was stolen and they still represent the 'Real Americans.' Is this a dangerous delusion, or a valid critique of the counting mechanism?"
  *   **For Q8 (Dissent):** *The Minority Claim.* "A minority group protests a new law, claiming it violates the 'true spirit' of the nation. Are they protecting the People's Will against a temporary majority, or are they undermining the People's Will?"
