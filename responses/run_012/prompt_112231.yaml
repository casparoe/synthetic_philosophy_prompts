      *   *Assessment:* This is a strong hypothesis. It captures the semantic/normative tension. However, is it the *whole* story?
      *   *Critique:* It might be slightly too linguistic/conceptual. The impasse isn't just about the *word* "corruption"; it's about the *purpose* of the political theory underlying the word. The Universalist isn't just saying "this fits the definition"; they are saying "this definition protects a specific public good." The Contextualist isn't just saying "this means something else locally"; they are saying "this definition destroys a specific social fabric."
      *   *Refinement:* The disagreement is deeper than just "act vs. wrong." It's about *what constitutes the public*. The Universalist assumes a pre-political distinction between public and private. The Contextualist sees the public/private distinction as itself a cultural artifact. Therefore, the disagreement is fundamentally about the *ontology of the political office*, not just the semantics of "corruption." The user's "two jobs" hypothesis is correct but derivative of this deeper ontological clash.

  3.  **Formulate the Diagnosis:**
      *   *Position:* The impasse is not merely verbal (about the word "corruption") nor purely empirical (about whether clientelism helps the poor). It is a **category error regarding the ontology of the state.**
      *   *Reasoning:*
          *   Universalists assume the "public office" exists prior to the exchange. Therefore, any diversion is a corruption of that pre-existing thing.
          *   Contextualists observe that in many contexts, the "public office" is *constituted* by the exchange. The office *is* the node in the patronage network. To remove the exchange is to remove the office's functionality/legitimacy.
          *   Therefore, they aren't disagreeing about whether a specific act is "corruption"; they are disagreeing about whether the *institution* being corrupted actually exists in the form the Universalist claims.
      *   *Relation to User's Hypothesis:* The user's "act vs. wrong" distinction is a symptom of this. The Universalist sees the act as a violation of the office's nature (hence wrong). The Contextualist sees the act as constitutive of the office's nature (hence not wrong, or at least not *that* kind of wrong).
      *   *Correction to User's Description:* The user suggests Universalists focus on "cross-national indices" and Contextualists on "ethnographic cases." This is a methodological difference, but the *philosophical* core is stronger. Universalists aren't just empiricists; they are normatively committed to impersonality as a prerequisite for justice. Contextualists aren't just descriptivists; they are normatively committed to social cohesion/survival as a prerequisite for order. It's not just data; it's first principles.

  4.  **Determine What Counts as Progress:**
      *   If the diagnosis is an ontological clash about the nature of the "public," then defining "corruption" better won't solve it.
      *   *Progress:* Retiring the binary "corruption/not corruption" for a functional analysis of *institutional capacity* vs. *social legitimacy*.
      *   *Specific Move:* Shift from asking "Is this corruption?" to "Does this exchange sustain a public good that impersonality could not, or does it foreclose the possibility of such a public good?"
      *   *Why:* This forces both sides to admit trade-offs. Universalists must admit impersonality has costs (exclusion of the marginalized). Contextualists must admit patronage has costs (entrenchment of inequality).
      *   *Verdict on "Bedrock":* It is near bedrock, but not entirely. Progress is possible by changing the *question*, not answering the old one.

