      *   *Section 2: The Ontological Clash.* Explain how Universalists presuppose the Public/Private divide. Explain how Contextualists see the divide as emergent or non-existent. This explains why they talk past each other. One sees a *deviation*, the other sees a *constitution*.
      *   *Section 3: Correcting the User's Description.* The methodological split (indices vs. ethnography) is real but secondary. The real split is normative teleology (Justice as Impersonality vs. Order as Reciprocity).
      *   *Section 4: Path to Progress.* Don't seek a definition. Seek a functional typology. Distinguish "survival clientelism" from "predatory clientelism." But even better: Shift to "Institutional Integrity vs. Social Viability."
      *   *Conclusion:* Reiterate that the binary term "corruption" is the obstacle.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I commit to a diagnosis? Yes (Ontological clash regarding the 'public').
