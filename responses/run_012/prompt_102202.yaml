  7.  **Editing for Constraints:**
      *   British English (programme, centre, recognise, etc.).
      *   Under 600 words.
      *   Date: Meeting on the 14th.

  8.  **Final Polish:**
      *   Check word count.
      *   Ensure the "fence" argument is clear.
