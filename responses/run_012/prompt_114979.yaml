answer: |-
  Here is the decisive plan for your 40 minutes.

  ### 1. The Single Example: The Human Eye
  **Use the Eye.** Do not switch to a building or a computer.
  **Reason:** The stakes of Dennett's argument are about *design without a designer*. If you use a skyscraper, you teach them about construction, not evolution. The Eye is the battleground where the "God assumption" lives. If you dodge it, they will spend the whole Q&A asking about it anyway. You must fight the battle where the enemy is, but you control the terrain.

  ### 2. The Order of Operations
  Do not start with definitions. Start with the problem.

  1.  **Minutes 0–5: The Load (The Eye).**
      *   Show a diagram of the eye. Ask: "How do you get *this* from *nothing*?"
      *   **Kill the God Assumption Here:** Explicitly say, "You might think this is a theology debate. It's not. It's an engineering debate. We are asking about the *structure of explanation*, not the existence of God."
  2.  **Minutes 5–15: The Skyhook (The Temptation).**
      *   Define it: An explanation that lifts the load but hangs from nothing.
      *   **Kill Misconception #1 (Skyhook = God):** Say, "A Skyhook isn't just God. It's *any* answer that assumes what it needs to explain. 'A Designer did it' is a skyhook. But so is saying 'It just evolved' without explaining *how*."
  3.  **Minutes 15–25: The Crane (The Work).**
      *   Define it: A machine that lifts the load, but is itself supported by the ground below.
      *   **The Move:** Natural Selection is the Crane. It lifts the complexity of the Eye, but it is built on the ground of chemistry/physics.
      *   **Kill Misconception #2 (Cranes = No Mysteries):** When you mention the "ground," say, "Does the crane explain why physics exists? No. It doesn't need to. It just needs to be stable enough to lift the Eye."
  4.  **Minutes 25–35: Greedy Reductionism (The Trap).**
      *   **Insert Your Gloss Here:** This is the exact spot for your line: *"Greedy reductionism isn't 'too much' reduction. It's reduction that wants the answer too fast and skips the intermediate steps."*
      *   **Example:** Saying "The Eye is just atoms" is greedy. It's true, but it skips the Crane (biology/optics) that explains how the atoms are arranged.
      *   **Kill Misconception #3 (Greedy = Science is Bad):** Clarify: "Reductionism is good. *Greedy* reductionism is lazy. It's claiming you've solved the puzzle because you named the pieces."
  5.  **Minutes 35–40: The Test.**

  **Why this order?**
  You asked: *"Do I need the 'okay but what's holding the crane up' move before I do the eye?"*
  **No.** If you start with "What holds the crane," you are teaching metaphysics. If you start with the Eye, you are teaching *problem-solving*. The Eye creates the tension (the load). The Skyhook/Crane distinction is the tool to resolve it. The "Ground" (what holds the crane) is the safety net you introduce *after* they worry the Crane will fall.

  ### 3. Your Gloss on Greedy Reductionism
  **Verdict:** It is **correct** and **essential**.
  **Placement:** Put it at **Minute 25**, exactly when you introduce Greedy Reductionism.
  **Why:** If you say it earlier, they will hear "Reductionism is bad" and tune out (since they trust science). By waiting until they understand that Cranes (step-by-step reduction) are *good*, you can contrast them with the *Greedy* kind. Your gloss clarifies that the sin isn't the *depth* of the explanation, but the *skipping* of the mechanism.

  ### 4. Killing the Misconceptions
  Here is exactly where you neutralize their preconceptions:

  *   **"This is the God Argument."**
      *   **Kill Point:** Minute 0–5 (Intro).
      *   **Line:** "Whether you believe in God or not, Dennett's point is about how we build explanations. A Skyhook is a logical error, not just a religious one."
  *   **"Skyhooks are just religious, Cranes are atheistic."**
      *   **Kill Point:** Minute 5–15 (Skyhook section).
      *   **Line:** "If you say 'Consciousness just exists' without explaining the brain, you are using a Skyhook. Atheists use Skyhooks too."
  *   **"Cranes mean everything is solved/no mystery left."**
      *   **Kill Point:** Minute 15–25 (Crane/Ground section).
      *   **Line:** "The crane rests on the ground. We don't need to explain the ground to use the crane. Mystery remains at the bottom; we just don't need it to explain the Eye."
  *   **"Greedy Reductionism means science is too narrow."**
      *   **Kill Point:** Minute 25–35 (Greedy section).
      *   **Line:** "It's not that science is looking too deep. It's that it's cheating by skipping the floors in between."

  ### 5. The Closing Question
  Do not ask them to define the terms. Ask them to apply the structure to a new problem.

  **The Question:**
  *"Artificial Intelligence is getting smarter. If I say 'AI isn't actually thinking, it's just math,' am I using a Crane or being a Greedy Reductionist?"*

  **Why this works:**
  *   If they say **Crane**: They understand that "math" is the ground supporting the "thinking" via intermediate steps (code, architecture).
  *   If they say **Greedy**: They understand that dismissing "thinking" as "just math" skips the functional explanation of how the AI behaves.
  *   **The Correct Answer:** It depends. If you use "it's just math" to dismiss the need to understand the neural network layers, it's **Greedy**. If you use "it's just math" to explain how the network is built step-by-step, it's a **Crane**.
  *   **Success Metric:** If they argue about *whether the steps were skipped* rather than *whether math is real*, they got it.

  ### Summary Checklist for Thursday
  1.  **Start with the Eye**, not the definitions.
  2.  **Define Skyhook** as a logical error, not just "God."
  3.  **Define Crane** as step-by-step support.
  4.  **Insert your Gloss** on Greedy Reductionism only *after* Cranes are established.
  5.  **End with the AI Question** to test application, not memory.

  You have 40 minutes. Spend 5 on intro, 10 on Skyhooks, 10 on Cranes, 10 on Greedy Reductionism, 5 on the Question. Stick to the script. Good luck.
