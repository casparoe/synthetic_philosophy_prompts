  What order do the pieces have to come in, and which one actually depends on which — specifically, do I need the "okay but what's holding the crane up" move before I do the eye, or does the eye have to come first or they won't feel the question? What single example should carry the whole thing, and if it's not the eye then why not? I also want to slip in my own gloss: that greedy reductionism isn't "too much" reduction, it's reduction that wants the answer too fast and skips the intermediate steps — tell me whether that's actually right and where in the sequence it goes, because I think if I say it too early they'll just hear "reductionism bad." Which wrong ideas will they walk in with or form (I'm betting skyhook = God, and cranes = "so everything is explained, no mysteries left"), and at exactly which point in my order do I kill each one? And what one question do I ask at the end that tells me whether they got it rather than just nodding? Be decisive: pick the example and the order you'd actually use and give me your reasons, and tell me straight if my gloss is going to confuse them.
