          2.  If YEC wasn't a hinge for the flatmate, what *was* a hinge in her situation?

  2.  **Deconstruct Wittgenstein's "Hinge" Concept:**
      *   *Is it psychological confidence?* No. Wittgenstein explicitly distinguishes between being sure (psychological state) and certainty (logical/grammatical status). A hinge isn't something you *feel* sure about; it's something that functions as a rule for inquiry.
      *   *Is it "exempt from doubt" in a temporal sense?* Not necessarily forever. Hinges can change over time or between systems. But *while* they function as hinges, they aren't tested; they are the scaffolding *for* testing.
      *   *The "Riverbed" Analogy:* Wittgenstein uses the image of a riverbed. The water (fluid propositions) flows over the sand/rock (hinges). Sometimes the sand shifts and becomes water, and the rock becomes sand.
      *   *The "World-Picture" (Weltbild):* Hinges form a system. You don't doubt one in isolation without unsettling the whole system.

