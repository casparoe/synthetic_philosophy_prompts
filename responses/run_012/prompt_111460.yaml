      *   *How did she doubt it?* To doubt it, she had to acquire *new* hinges. She didn't just "doubt hard" from a vacuum. She likely adopted the hinges of the scientific worldview (e.g., "senses are generally reliable," "expert consensus is a good guide," "carbon dating is a valid method").
      *   *The Transition:* The moment she started seriously doubting YEC, it ceased functioning as a hinge *for her*. It moved from the riverbed to the flowing water. This aligns with Wittgenstein: hinges are not eternal truths; they are functional roles.
      *   *Why the user's interpretation is slightly off:* The user thinks "exempt from doubt" means "impossible to ever doubt." Wittgenstein means "not part of the language game of justification *at this time*." You can step outside the language game, but then you are playing a different game.

