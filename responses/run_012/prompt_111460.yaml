answer: |-
  You are hitting on one of the most common and productive misunderstandings of *On Certainty*. It is very easy to read Wittgenstein as saying, "There are some beliefs we feel super-duper sure about." But if that were all he meant, you're right: it would be trivial psychology, not philosophy.

  The short answer is: **Yes, you are reading him slightly wrong.** You are interpreting "certainty" as a *psychological state* (how confident she felt), whereas Wittgenstein is talking about a *logical function* (what role the proposition plays in her language game).

  Here is how to untangle the flatmate example from Wittgenstein's hinges, and why the distinction matters.

  ### 1. Confidence vs. Scaffolding
  For Wittgenstein, a hinge proposition isn't "exempt from doubt" because we are too stubborn or confident to doubt it. It is exempt because **it is the tool we use to doubt other things.**

  *   **Psychological Certainty:** "I am 100% convinced the Earth is 6,000 years old." (This is a feeling).
  *   **Hinge Certainty:** "The Earth is 6,000 years old" functions as a rule. If a fossil contradicts this, the fossil is wrong, not the age of the Earth. The proposition isn't being *tested*; it is doing the *testing*.

  When your flatmate was a child, Young Earth Creationism (YEC) likely *was* a hinge. It wasn't just a fact she knew; it was the background against which she interpreted biology, geology, and history. If a teacher said, "This dinosaur is 65 million years old," the hinge didn't wobble; the teacher was interpreted as being mistaken or lying. The doubt didn't "get off the ground" because the framework for validating the teacher's claim was ruled out by the hinge.

  ### 2. How She Doubted It (The Riverbed Shift)
  You asked: *She doubted it hard... So it looks like a hinge is just a belief you're really really sure of.*

  Wittgenstein actually anticipates this. He uses the metaphor of a **riverbed**. The water (our fluid thoughts and doubts) flows over the sand and rock (the hinges). But over time, the sand can harden into rock, and the rock can erode into sand.

  When your flatmate went to university, she didn't just "doubt harder." She underwent a **world-picture shift**.
  1.  She acquired *new* hinges (e.g., "Scientific consensus is a reliable guide," "Carbon dating is a valid method," "My professors are not conspiring against me").
  2.  Once those new hinges were in place, YEC ceased to function as a hinge *for her*. It moved from the riverbed (the solid ground) into the water (a claim that could be tested).
  3.  Once it was in the water, she could test it, find it lacking, and discard it.

  So, the fact that she eventually doubted it doesn't prove hinges don't exist. It proves that **hinges are historical and contextual.** What is a hinge for a child in a fundamentalist family is not a hinge for a second-year biology student. But *at the time* it was functioning as a hinge, it was immune to empirical evidence.

  ### 3. What *Were* Her Hinges?
  This is your second question: *If her young-earth thing wasn't a hinge, what in her situation would've been one?*

  Even when she was arguing *against* her family, she was relying on hinges that she herself was not doubting. You cannot doubt everything at once, or you cannot speak. While she was debating her family, the following were likely functioning as hinges for her:

  *   **"Other minds exist":** She assumed her audience (professors, friends) understood her words and had their own thoughts. If she doubted this, argumentation is impossible.
  *   **"Memory is generally reliable":** She relied on her memory of what she read in textbooks. She didn't run a test every morning to see if books still contained words.
  *   **"Logic holds":** She assumed that if Premise A and Premise B are true, Conclusion C follows. She didn't treat the laws of non-contradiction as a hypothesis to be tested.
  *   **"The world existed before I was born":** This is a classic Wittgenstein hinge. Even though she was arguing about *how long* ago that was (6,000 vs 4.5 billion), the proposition that *there was a past* was not in doubt.

  If she had tried to doubt *those* things, her argument against Young Earth Creationism would have collapsed. She needed those hinges to turn the wheel of her argument.

  ### 4. Why It's Not Trivial
  You worried that if hinges are just "assumptions," then Wittgenstein isn't saying anything new. But his point is deeper than "everyone has assumptions."

  His point is about the **grammar of justification.**
  Normally, if I say "I know X," you can ask "How do you know?" and I give evidence.
  *   "I know it's raining." -> "How?" -> "I looked outside."

  But with hinges, the question "How do you know?" makes no sense.
  *   "I know the world existed before I was born." -> "How?" -> "Well... science? Parents?"

  Wittgenstein argues that at a certain point, giving reasons runs out. "My spade is turned." If you keep asking for proof of the hinges, you aren't being rigorous; you are breaking the language game. You are like someone trying to check if the ruler they are measuring with is accurate by measuring it with itself.

  ### Summary
  Your flatmate's experience actually confirms Wittgenstein, provided you see the shift in her **system** of belief.
  *   **Childhood:** YEC was a hinge. It was exempt from doubt because it defined what counted as evidence.
  *   **University:** Science became the hinge system. YEC became an empirical claim. It was tested and failed.
  *   **Throughout:** She never doubted the hinges that allow communication and logic to function (e.g., that words have meaning, that other people exist).

  Wittgenstein isn't saying "You can never change your mind." He's saying "You can't doubt everything at once, and the things you aren't doubting right now are the hinges that let you doubt anything else."
