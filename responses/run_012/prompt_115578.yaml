answer: |-
  Here is the breakdown of your friend's likely verdict, the heuristics driving it, and how to test them.

  ### The Verdict
  **Falsified.**

  She will likely classify this as a **degenerating research programme**, not a "right-but-early" insight. While she will concede the *mechanism* (micronutrient depletion is real, unlike phlogiston), she will reject the *theory* (that this necessarily leads to yield collapse on the predicted timeline) because it has been preserved via **ad hoc adjustments** rather than exogenous shocks.

  To her, the difference between Malthus and the Soil Scientist is this: Malthus's model was broken by the Industrial Revolution (an external variable he couldn't have known). The Soil Scientist's model was broken by better agronomy (variables within the scope of the field), and instead of admitting the model was insufficient, followers patched the theory to accommodate the data. That is the definition of unfalsifiable, not early.

  ### The Rules (Her Algorithm)
  You are correct that multiple rules fit her first five calls. Here are the three strongest candidates, ranked by how well they discriminate the new case.

  **1. The Ontological Rule (Necessary but not Sufficient)**
  *   *Rule:* The core entities or mechanisms posited must actually exist.
  *   *Track Record:* Fits all 5. Phlogiston (doesn't exist) = Falsified. Wegener/Malthus/Micronutrients (exist) = Potential for "Early."
  *   *Problem:* This rule alone can't distinguish Malthus from the Soil Scientist, as both posit real constraints.

  **2. The Exogeneity Rule (The Malthus Test)**
  *   *Rule:* A prediction can fail and still be "Early" only if the falsifying factor was **exogenous** to the model's scope.
  *   *Track Record:* Fits all 5.
      *   *Malthus:* Industrial tech was outside his pre-industrial model. (Pass $\rightarrow$ Early)
      *   *Population Bomb:* Tech/response was inside the scope of demographic modeling. (Fail $\rightarrow$ Falsified)
      *   *Wegener:* Mechanism (plate tectonics) was outside the measurement capability of the time. (Pass $\rightarrow$ Early)
      *   *Marx:* Capitalist adaptation was inside the scope of political economy. (Fail $\rightarrow$ Falsified)
  *   *Application to Soil:* Mitigation (fertilizers, rotation) is **endogenous** to agronomy. It is not a shock from outside the system (like an asteroid); it is the system correcting itself. This points to **Falsified**.

  **3. The Lakatosian Rule (The Degeneration Test)**
  *   *Rule:* A theory is "Early" only if the core prediction remains static while the world catches up. It is "Falsified" if the theory is modified post-hoc to fit the data (ad hoc rescue).
  *   *Track Record:* Fits all 5.
      *   *Malthus:* He didn't revise his model to explain the Industrial Revolution; history just overtook him.
      *   *Wegener:* He didn't change the map to fit the ridicule; the map was eventually proven right.
      *   *Marx/Pop Bomb:* Proponents constantly redefined "immiseration" or "famine" to avoid falsification.
  *   *Application to Soil:* The prompt explicitly states followers "pushed the date out three times, added carve-outs." This is a **degenerating problem shift**. This points strongly to **Falsified**.

  ### The Primary Driver
  She is almost certainly running **Rule 3 (The Lakatosian Rule)**, constrained by Rule 1.

  Rule 2 (Exogeneity) is tricky because one could argue that micronutrient fertilizers were an "external tech shock" similar to Industrialization for Malthus. However, Rule 3 cuts through that ambiguity. Malthus didn't *patch* his theory to account for factories; the Soil Scientist's followers *did* patch their theory to account for rotation.

  Her contempt for the Marx verdict confirms this. Marxists often argue "Immiseration is relative, not absolute," which is a theoretical patch. She calls that falsified. The Soil Scientist's followers arguing "Yields didn't fall because we excluded irrigated land" is the exact same logical move.

  **Her reasoning structure:**
  1.  **Ontology Check:** Is the mechanism real? (Yes: Micronutrients).
  2.  **Integrity Check:** Has the specific prediction been modified to survive data? (Yes: Dates moved, carve-outs added).
  3.  **Verdict:** If Integrity Check fails, the theory is Unfalsifiable/Falsified, regardless of Ontology.

  ### The Discriminating Case
  To separate Rule 2 (Exogeneity) from Rule 3 (Ad Hoc Patching), you need a case where the **mechanism is real**, the **prediction failed**, but the **failure was due to exogenous intervention *without* theoretical patching.**

  **The Case: The 1970s "Ozone Hole" SST Predictions.**
  *   *Context:* In the early 70s, scientists predicted that a fleet of Supersonic Transports (SSTs) would inject NOx into the stratosphere, destroying the ozone layer and causing massive skin cancer spikes by 1990.
  *   *Outcome:* The SST fleet was never built (economic/political reasons, not scientific). The ozone hole *did* appear later, caused by CFCs (different mechanism, same effect).
  *   *The Test:*
      *   **If she calls this "Early":** She prioritizes **Rule 2 (Exogeneity)**. The mechanism (stratospheric chemistry) was right; the world just didn't deploy the planes. The theory wasn't patched; the *scenario* vanished.
      *   **If she calls this "Falsified":** She prioritizes **Rule 3 (Prediction Integrity)**. The specific claim ("SSTs will cause collapse by 1990") was wrong. The fact that CFCs did it instead is a different theory.
      *   *Why this separates them:* The Soil Scientist case involves *theoretical patching* (carve-outs). The SST case involves *scenario failure* (planes not built). If she treats Soil as Falsified because of the patching, she must treat SST as Early (no patching, just exogenous non-event). If she treats SST as Falsified, she is a strict Prediction Falsificationist who doesn't believe in "Right-but-Early" at all.

  ### Where My Read Could Be Wrong
  **The "Model Boundary" Ambiguity.**
  My analysis assumes she draws a hard line between "Malthus's Model" (pre-industrial) and "Soil Scientist's Model" (agronomy).
  *   **Risk:** She might view the Green Revolution's fertilizer tech as an **exogenous shock** comparable to the Industrial Revolution. If she views micronutrient fertilizers as a "Black Swan" technology outside the 1970s soil model's scope, she might classify this as **Early** (Rule 2 dominates Rule 3).
  *   **What would change my mind:** If she has previously classified **Peak Oil (Hubbert)** as "Early."
      *   Hubbert predicted a peak in US oil production (correct) and global production (timing wrong).
      *   Followers constantly redefined "reserves" and "oil" (shale, tar sands) to keep the theory alive.
      *   This is structurally identical to the Soil case (resource constraint + moving goalposts).
      *   If she calls Peak Oil "Early," then she values the **Constraint (Rule 2)** over the **Patching (Rule 3)**. If she calls Peak Oil "Falsified," my read on the Soil Scientist holds.

  ### Summary for Your Piece
  Your friend is likely using a **Lakatosian heuristic**: "Right-but-Early" is only coherent if the *hard core* of the theory remains untouched while the *protective belt* absorbs the shock of time.
  *   **Malthus/Wegener:** Hard core intact, protective belt held by history/measurement limits.
  *   **Soil/Marx/Pop Bomb:** Hard core modified to fit data (degenerating).

  The "Right-but-Early" verdict is coherent **only if** you can distinguish between *the world changing* (Malthus) and *the theory changing* (Soil). If that distinction blurs, the verdict becomes a polite word for unfalsifiable.
