answer: |-
  **Note on your framing:** Your puzzle is interpretatively sound. It captures a genuine tension in the text between Aristotle's functionalist account of value (needs are natural) and his conventionalist account of money (the token is alterable). You are right to press students on whether these cohere or whether one must give way.

  ***

  # Adult Education Centre – Leeds
  ## Aristotle and the Economy: End-of-Term Assessment
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **one** question. Closed book.
  **Weighting:** This essay is worth 20 marks.

  ### Essay Question

  Aristotle defines money as *nomisma* (existing by convention rather than nature), yet he relies on it as the stable measure required for justice in exchange. Critically assess whether this conventionalism undermines his account of proportionate reciprocity. In your answer, explain how this tension influences his condemnation of usury. You should take a position on whether these claims can be held together or if one must give way.

  ***

  ### Model Answer

  Aristotle's account of money presents a significant philosophical tension. On one hand, he insists money is *nomisma*, a token established by custom that can be altered or rendered useless by decree. On the other, he argues money is the necessary measure that makes proportionate reciprocity possible, binding the *polis* together. This essay argues that while Aristotle attempts to reconcile these claims by grounding convention in natural need, the tension remains unresolved, particularly when applied to his condemnation of usury.

  To understand the problem, we must look at the function of money in *Nicomachean Ethics* Book V. Aristotle argues that for exchange to be just, there must be a common measure. Since needs differ—a builder needs shoes, a cobbler needs a house—money acts as a representative of demand. It allows disproportionate goods to be equated. However, if money is merely conventional, as stated in *Politics* Book I, it is akin to a rubber ruler. If the state can alter the currency at will, the measure of justice becomes arbitrary. A student might argue that Aristotle resolves this by claiming convention serves nature; the token is artificial, but the need it measures is natural. Yet, this relies on the stability of the convention. If the measure fluctuates by decree, the proportionate reciprocity required for civic friendship becomes unstable. Therefore, the conventionality of money does threaten the naturalness of the exchange, unless one assumes the convention is fixed by natural necessity rather than mere decree.

  This tension is compounded by the distinction between use and exchange. Aristotle illustrates this with a shoe: one can wear it (use) or sell it (exchange). He argues wealth-getting is natural when it serves the use of the household (*oikonomia*) but unnatural when it seeks unlimited exchange (*chrematistike*). However, money complicates this distinction. What is the "use" of a coin apart from exchanging it? Unlike a shoe, money has no utility outside of exchange. If money's only function is to be exchanged, then the distinction between natural and unnatural wealth-getting collapses when applied to money itself. Aristotle tries to salvage this by claiming money's natural end is to facilitate the acquisition of goods for the household. Once money begets money, it violates this telos.

  This leads directly to the condemnation of usury. Aristotle calls interest the most unnatural kind of wealth-getting because money is bred from money. For this argument to hold, money must have a natural function (facilitating exchange) that is being violated. However, if money is merely conventional (*nomisma*), it has no nature to violate. Here, Aristotle's account struggles. He needs money to have a natural function to call interest unnatural, but his conventionality thesis suggests it has none. Consequently, the usury ban relies on a sleight of hand: treating money as conventional when discussing its origin, but natural when discussing its proper end.

  In conclusion, Aristotle's account cannot fully hold together without modification. The conventionality of money undermines its reliability as a measure of justice, creating the "rubber ruler" problem. Furthermore, the condemnation of usury requires money to have a natural telos that the conventionality thesis denies. To save the account, one must argue that while the *form* of money is conventional, its *function* is natural. However, Aristotle does not consistently maintain this distinction. Therefore, the usury ban stands on weaker ground than his account of reciprocal justice, as it relies on a naturalism that his definition of money explicitly rejects.

  ***

  ### Marking Scheme (20 Marks Total)

  **Total marks are divided across five criteria (4 marks each). To achieve full marks, the student must address the specific requirement and avoid the common error listed.**

  | Criteria | Requirements for Full Marks (4 marks) | Common Error / How to Deduct |
  | :--- | :--- | :--- |
  | **1. Definition of *nomisma*** | Correctly identifies money as conventional/alterable by decree, contrasting it with natural objects. | **Recall only:** Simply stating 'money is conventional' without explaining the implication (alterability) loses 2 marks. |
  | **2. Role in Reciprocity** | Explains money as the measure of need/demand that enables proportionate exchange in the *polis*. | **Vagueness:** Saying money 'helps trade' without mentioning 'measure' or 'proportion' loses 2 marks. |
  | **3. Analysis of Tension** | Explicitly addresses the conflict: can a conventional token measure natural justice? (The 'rubber ruler' problem). | **Summary:** Describing both points separately without analysing the conflict between them loses 3 marks. |
  | **4. Use vs. Exchange** | Applies the shoe analogy to money, noting the difficulty that money's only 'use' is exchange. | **Misapplication:** Claiming Aristotle says money has no use at all (rather than no use *outside exchange*) loses 2 marks. |
  | **5. Implication for Usury** | Connects the tension to usury: explains why interest is 'unnatural' and how conventionality weakens this claim. | **Moralising:** Arguing usury is wrong because it is 'greedy' rather than 'unnatural' according to Aristotle's logic loses 3 marks. |

  **General Guidance:**
  *   **17–20 marks:** Excellent. Takes a clear position on whether the arguments cohere. Fluent British English.
  *   **13–16 marks:** Good. Covers all points but may hesitate to take a critical position.
  *   **9–12 marks:** Pass. Accurate summary but lacks critical analysis of the tension.
  *   **0–8 marks:** Fail. Significant misunderstandings of the text or failure to address the question.
