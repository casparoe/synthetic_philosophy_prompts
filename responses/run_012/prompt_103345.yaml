prompt: |-
  I cover AI for a general-interest science mag, and I keep getting handed the phrase "the alignment problem" like it's one thing with one definition. I want to do a big feature on it, but I don't want to just rehash the doom-vs-acceleration horse race, and I definately don't want to interview ten people who each mean something different by "alignment" and pretend they're disagreeing about the same question.

  So help me triage. Of the conceptual questions that get bundled under alignment — what exactly we're supposed to be aligning a system *to*; whether that target is even coherent or stable; whether it's really one problem or a family of unrelated ones wearing a trenchcoat; whether "intentions," "goals," or "values" meaningfully apply to something trained by gradient descent; how much of this is philosophy of mind versus engineering versus plain old institutional design — which ones are genuinely upstream of the others, which are tractable enough that a philosopher could make progress on them without an ML lab, and which ones look huge but don't actually change much downstream no matter how they come out?

  Rank them for me and defend the ranking — I've got about a year and 8,000 words, so I need to know where the load-bearing questions are and which supposedly-central debates are basically noise. And tell me what evidence over the next year or two would move something up or down your list.
