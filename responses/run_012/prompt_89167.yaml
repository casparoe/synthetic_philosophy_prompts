answer: |-
  **Examination Question**

  **Social Choice Theory: Final Examination**

  **Time Allowed:** 90 Minutes

  **Instructions:** Answer the following question. All necessary definitions and results are contained within this paper. No external sources or memory of specific voting rules beyond what is defined here is required or permitted.

  **The Gibbard–Satterthwaite Theorem:**
  Consider a social choice function that maps profiles of strict preference orderings over a set of alternatives to a single winning alternative. The theorem states that if the set of alternatives contains at least three elements, the domain of preference profiles is unrestricted (all logical orderings are permitted), the function is surjective (onto), and the function is strategy-proof (no voter can benefit by misrepresenting preferences), then the function must be dictatorial (there exists a voter whose top-ranked alternative is always selected).

  **Voting Rules:**
  Consider a set of alternatives $A$ and a set of voters $N$. Analyze the following four rules:
  (a) **Binary Majority:** $|A| = 2$. The rule selects the alternative preferred by a majority of voters.
  (b) **Median-Voter:** $A$ is a one-dimensional continuum. Preferences are single-peaked. The rule selects the median of the voters' most-preferred points.
  (c) **Fixed-Pair Rule:** $|A| \geq 3$. Fix a subset $\{a, b\} \subset A$. The rule selects voter 1's most-preferred element from $\{a, b\}$, ignoring all other alternatives and voters.
  (d) **Random Dictatorship:** A voter is selected uniformly at random; their top-ranked alternative is chosen. You are given the following result: Any probabilistic rule that is anonymous, strategy-proof (no misreport yields a stochastically dominating lottery), and ex post Pareto-efficient must be the random-dictatorship lottery.

  **Task:**
  1. For rules (a), (b), and (c): Determine whether the rule is strategy-proof, onto, and dictatorial. Identify which hypothesis of the Gibbard–Satterthwaite theorem the rule evades. Assess whether this evasion demonstrates that the hypothesis performs substantive work or is merely a technicality.
  2. For rule (d): Assess the claim that permitting lotteries provides a natural escape from the impossibility. Explain what this move achieves, what it fails to achieve, and whether the resulting rule deserves to be called an escape from dictatorship.

  ***

  **Model Answer**

  The Gibbard–Satterthwaite theorem establishes an impossibility result for deterministic social choice functions. Its hypotheses are: (1) at least three alternatives; (2) an unrestricted domain of strict preference profiles; (3) surjectivity (the range is the entire set of alternatives); and (4) strategy-proofness. The conclusion is that the rule must be dictatorial. To understand the theorem's force, we must examine how specific rules evade these hypotheses.

  Rule (a), Binary Majority, operates where $|A| = 2$. It is strategy-proof, as a voter cannot benefit by voting for their less-preferred option in a binary choice. It is onto, as either alternative can win depending on the profile. It is non-dictatorial, as no single voter determines the outcome against the majority. This rule evades the hypothesis requiring at least three alternatives. This evasion is not merely technical; with only two options, preference intensity and ranking complexities vanish, removing the structural opportunity for manipulation that arises with three or more options. Thus, the cardinality constraint does substantive work.

  Rule (b), the Median-Voter rule, operates on a restricted domain of single-peaked preferences over a continuum. It is strategy-proof; moving one's peak away from the median cannot pull the median closer to one's true peak. It is onto the continuum and non-dictatorial. This rule evades the unrestricted domain hypothesis. This evasion is substantively significant, not a technicality. Single-peakedness imposes a strong structural constraint on preferences, implying a consensus on the dimension of disagreement. It rules out cyclic majority preferences and ensures a Condorcet winner exists. The theorem holds generally because most preference profiles are not single-peaked; restricting the domain to those that are fundamentally alters the social choice environment.

  Rule (c), the Fixed-Pair Rule, selects voter 1's preferred element from a fixed subset $\{a, b\} \subset A$. It is strategy-proof for voter 1 (who dictates the choice within the pair) and irrelevant for others. It is non-dictatorial in the Gibbard–Satterthwaite sense because if voter 1's top choice is $c \notin \{a, b\}$, the rule does not select $c$. Consequently, the rule is not onto; its range is limited to $\{a, b\}$. It evades the surjectivity hypothesis. This shows the onto condition is substantive. Without it, a rule could ignore vast swathes of the alternative space, effectively reducing the choice problem to a smaller set where dictatorship might not apply or where the definition of dictatorship fails to capture the rule's limited scope.

  Rule (d), Random Dictatorship, introduces lotteries. The provided result confirms it is the unique anonymous, strategy-proof, ex post efficient probabilistic rule. Does this escape the impossibility? It preserves strategy-proofness and efficiency, but it does not eliminate dictatorship; it converts a determinate dictator into a probabilistic one. Ex post, a single voter dictates the outcome. Ex ante, every voter has equal dictatorial power. This move buys fairness (anonymity) and efficiency while maintaining truth-telling incentives. However, it does not deserve to be called a full escape from the impossibility of dictatorship. It merely randomizes the identity of the dictator rather than constructing a collective decision mechanism that aggregates preferences without granting decisive power to a single individual in every realization. The core tension identified by Gibbard and Satterthwaite—that strategy-proofness implies decisive individual power—remains intact, merely distributed over a lottery.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Statement of Gibbard–Satterthwaite Hypotheses (3 marks)**
  *   **Award:** 3 marks for correctly listing: ≥3 alternatives, unrestricted domain, surjectivity (onto), strategy-proofness implies dictatorship.
  *   **Mistake Note:** Deduct marks if any of the four conditions is omitted or incorrectly defined.

  **2. Analysis of Rule (a) (3 marks)**
  *   **Award:** 3 marks for identifying it as SP, onto, non-dictatorial, and evading the "≥3 alternatives" condition.
  *   **Mistake Note:** Deduct marks if the student claims it is dictatorial or fails to identify the cardinality evasion.

  **3. Analysis of Rule (b) (3 marks)**
  *   **Award:** 3 marks for identifying it as SP, onto, non-dictatorial, and evading the "unrestricted domain" condition.
  *   **Mistake Note:** Deduct marks if the student claims single-peakedness is part of the standard GS domain or misses the domain evasion.

  **4. Substantiveness of Domain Restriction (3 marks)**
  *   **Award:** 3 marks for arguing that single-peakedness is a strong structural constraint, not a technicality, explaining why it prevents manipulation.
  *   **Mistake Note:** Deduct marks if the student dismisses the domain restriction as a mere technical loophole without structural justification.

  **5. Analysis of Rule (c) (4 marks)**
  *   **Award:** 4 marks for identifying it as SP, non-dictatorial (over A), not onto, and evading the "surjectivity" condition.
  *   **Mistake Note:** Deduct marks if the student incorrectly labels voter 1 a dictator over the whole set A or claims the rule is onto.

  **6. Assessment of Rule (d) (4 marks)**
  *   **Award:** 4 marks for arguing that randomization creates a probabilistic dictator rather than eliminating dictatorship, preserving SP but not escaping the core impossibility.
  *   **Mistake Note:** Deduct marks if the student claims randomization fully escapes dictatorship or fails to mention ex post dictatorial power.
