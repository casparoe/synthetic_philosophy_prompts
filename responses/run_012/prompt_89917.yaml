prompt: |-
  hey, im a junior and im on the committee that runs our student council elections. last year was a mess — three candidates, ranked ballots, the winner flipped in the second round, and everyone spent a week accusing each other of voting strategically, which, to be fair, some of them were. then i read about arrows theorem and now the gibbard satterthwaite one and im kind of freaked out that any system we pick is just gameable by design. i want a decision tree i can actually hand out at the next meeting.

  set it up so the branch nodes are the things i want our rule to do — works no matter what mix of preferences people turn up with, any of the candidates could in principle win rather than us quietly engineering it for one of them, always names exactly one winner with no ties, isn't a dictatorship, and nobody can do better by lying about their ranking — then show me there's no path where all five survive, and give me every way out as a leaf, with the name of the method and the price you pay.

  leaves i want: only letting people hold certain kinds of preferences (like a left-right spectrum where everyones a single peak), picking the winner at random (i read somewhere theres a version where you just draw one voters ballot and let them decide?), letting people score or approve instead of rank, electing a committee instead of one winner, drawing lots or not aggregating preferences at all, and the honest one where we just accept people will game it and design for that. for each one tell me whether its actually escaping the theorem or only moving the problem somewhere else.

  also list the combos that come out empty and say for each whether its empty because its impossible or just because nobody bothered trying. and flag any two leaves you cant really tell apart with questions, dont fudge it. plain english please, half the committee hasnt heard of any of this.

  last thing — where are you least confident? if someone showed me a real three-candidate rule thats strategy proof and not a dictatorship or a lottery, would you have to redraw the whole tree, or did i get the theorem wrong? tell me what would actually change your mind, and where your reasoning is most likely to break.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

