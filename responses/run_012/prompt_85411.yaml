prompt: |-
  At a long dinner last month I ended up as the audience for an argument between two friends of mine, Sofia and Ben, and I have been turning it over ever since. Ben had just come back from a year in a town where, as he kept putting it, 'nobody does anything the way we do,' and what began as a squabble about the tip screen on a card reader widened into queueing and jaywalking, so I'm giving you the whole thing rather than only the tipping part. I don't think I agree with either of them more than the other, and I suspect each of them is right about some moves and muddled about others, but I can't say which is which.

  (1) Ben: 'Tipping is not a moral matter at all. The server's wage is owed by the employer under the contract; what I owe is the price on the menu. A tip is a gift, and a gift you are obliged to give is not a gift. Calling me a bad person for leaving nothing is etiquette dressed up as ethics.' (2) Sofia: 'You don't get out of it that way. If the menu price is set on the assumption that a tip will arrive — and where employers are permitted to count expected tips against the wage, that is exactly what the price is — then paying the price and leaving nothing means knowingly taking a subsidized meal while the person who served it absorbs the shortfall. There is a difference between asking whether a practice is a good one and asking what you owe someone within a practice you have knowingly entered. Nor is this only about tipping: a queue is a coordination convention that works because nearly everyone keeps to it, and whoever ignores it collects the benefit of everyone else's restraint.' (3) Ben: 'Both halves of that prove too much. The free-riding point only bites if the practice is decent enough to deserve sustaining; if the real function of tipping is to let an employer push labor costs onto customers and make a server's income depend on the mood of strangers, then the customer who declines is not free-riding on anything worth preserving, and the party with the complaint is the employer. And the queueing point evaporates where the norm is already dead — at a crossing where everyone jaywalks there is no equilibrium to free-ride on, and the only reasons left are the law and my own neck.' (4) Sofia: 'Then drop the practice and talk about the person. It isn't the fairness of the institution that grounds the obligation; it is the position of the particular server, who eats the loss tonight and did not design the system. And that is exactly where the visitor question gets sharp, which is why your year abroad matters. The "queue" outside your bakery was not a line at all — it was a matter of catching the baker's eye — so a visitor who stood quietly at the back was not being polite, he was invisible, and he made the regulars uneasy because they could not tell whether he was waiting or loitering. When a visitor's own convention is not merely useless but a foreign body, deference to local practice is the modest move: local customs encode knowledge he does not have.' (5) Ben: 'Deference is a fine heuristic until it collides with something that matters. "Follow local conventions" gives you no filter whatsoever: it tells you to shove onto the bus because shoving is the local way and to leave the tip because leaving is the local way, and it would equally tell a visitor to keep quiet about a custom he finds cruel. It hands the majority a veto over the outsider's judgment. And knowability cuts against you rather than for you: the bakery case shows that a visitor can be blameless and still fail a norm he had no way to see. If an obligation depends on my being able to know it, the eye-contact queue cannot obligate a newcomer — the regulars' irritation is real, but it is not a moral complaint.' (6) Sofia: '"No way to see it" is a very low bar. He could have asked, or watched for ten minutes. Conventions are learned by participation, not by inspection. Insist that only fully legible norms bind and you get a rule that looks even-handed while quietly privileging the visitor's habits and making the locals do all the accommodating.'

  Please adjudicate this exchange point by point rather than announcing a winner: for each of the six moves, say what is right in it, what is wrong or overstated, and how much of it survives. I would also like your best attempt at the general rule that ought to govern what a visitor owes to local conventions — what, if anything, distinguishes the eye-contact bakery from the jaywalking crossing from the tip line, and whether the strength of the obligation tracks knowability, harm to particular people, the value of the coordination, or something else. Finally, tell me what both of them are missing that neither has raised, and then, if you have to, who is more nearly right overall.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical dialogue between two friends, Sofia and Ben, regarding tipping, queueing, and cultural norms/conventions.
      *   **Structure:**
          1.  Analyze each of the six moves (1-6) point-by-point (What's right, what's wrong/overstated, how much survives).
          2.  Formulate a general rule for what a visitor owes to local conventions (distinguishing the bakery, jaywalking, and tipping scenarios).
          3.  Identify what *both* are missing (a blind spot).
          4.  Declare who is more nearly right overall (if necessary).
      *   **Tone:** Analytical, balanced, philosophical but accessible (matching the prompt's style).
      *   **Constraint:** Do not just announce a winner at the start; work through the points first.

  2.  **Deconstruct the Dialogue (Move by Move):**

      *   **Move 1 (Ben):** Tipping is not moral; it's a gift. Employer owes wage. Calling non-tippers "bad" is etiquette masquerading as ethics.
          *   *Right:* Contractually, the employer owes the wage. Tipping *is* technically voluntary in many jurisdictions. Distinguishing etiquette from ethics is a valid philosophical move.
          *   *Wrong/Overstated:* Ignores the economic reality (sub-minimum wage). If the social contract implies the price + tip, treating it as a pure gift ignores the reliance interest of the server.
          *   *Survival:* Partially survives as a legal/contractual claim, but fails as a moral claim in a system dependent on tips.

      *   **Move 2 (Sofia):** You can't opt out if the price assumes tips (subsidized meal). Free-riding on a coordination convention (queueing). Distinguishes "is the practice good?" from "what do I owe within the practice?"
          *   *Right:* Strong point on reliance and fair play. If you enter a system knowing the rules, opting out harms the participant (server). The queue analogy is strong for coordination problems.
          *   *Wrong/Overstated:* Assumes the customer *knows* the assumption (though Ben just returned from abroad, implying he knows). The "free-riding" argument depends on the practice being legitimate (which Ben challenges next).
          *   *Survival:* Strong. This is the core "fair play" argument.

      *   **Move 3 (Ben):** Free-riding only matters if the practice is decent. Tipping shifts labor costs (bad practice). Queueing point evaporates if the norm is dead (jaywalking).
          *   *Right:* Crucial distinction: one shouldn't free-ride on *unjust* systems. The jaywalking example is excellent: if everyone breaks the rule, the rule isn't a coordination equilibrium.
          *   *Wrong/Overstated:* Conflates the employer's sin with the server's innocence. Even if the system is bad, the server still suffers from the individual act. The "norm is dead" claim is empirical; sometimes jaywalking is tolerated, sometimes not.
          *   *Survival:* Strong challenge to the "fair play" argument. Introduces the justice condition.

      *   **Move 4 (Sofia):** Drop the practice, look at the person (server eats the loss). Visitor question: Local customs encode knowledge (bakery example). Deference is modest.
          *   *Right:* Shifts from institutional justice to interpersonal harm. The server didn't design the system. The bakery example illustrates hidden norms and the friction caused by ignorance.
          *   *Wrong/Overstated:* "Deference... is the modest move" might demand too much assimilation. Some local customs *are* harmful (Ben's point).
          *   *Survival:* Strong on interpersonal obligation, weaker on blind deference.

      *   **Move 5 (Ben):** Deference has no filter (shoving on buses, cruel customs). Knowability: If I can't see the norm (bakery), I can't be obligated. Regulars' irritation isn't a moral complaint.
          *   *Right:* "Blind deference" is dangerous (cultural relativism trap). The epistemic condition (knowability) is vital for moral obligation.
          *   *Wrong/Overstated:* Equating tipping with shoving or cruelty is a false equivalence (tipping is economic, shoving is physical safety). "No way to see it" is too passive; visitors have a duty to learn.
          *   *Survival:* Strong on the limits of deference, weak on the duty to inquire.

      *   **Move 6 (Sofia):** "No way to see it" is a low bar. Ask or watch. Conventions learned by participation. Privileging visitor's habits burdens locals.
          *   *Right:* Visitors have a duty of due diligence. Expecting locals to accommodate every visitor's ignorance is imperialistic.
          *   *Wrong/Overstated:* "Participation not inspection" is risky if the cost of learning is high (e.g., getting arrested).
          *   *Survival:* Strong conclusion on the duty to learn.

  3.  **Synthesize the General Rule:**
      *   Need to distinguish:
          *   *Tipping:* Economic reliance, specific harm to individual, high knowability (in that context).
          *   *Jaywalking:* Safety/Coordination, low harm if everyone does it, norm might be dead.
          *   *Bakery:* Hidden norm, low harm but high friction, requires observation.
      *   *Factors:*
          1.  **Reliance/Harm:** Does someone specific lose out? (Tipping = Yes, Jaywalking = No/Shared risk).
          2.  **Justice of the System:** Is the norm exploitative? (Tipping = Debatable, Shoving = Yes).
          3.  **Epistemic Access:** Could the visitor reasonably know? (Bakery = Watch/Ask, Tipping = Menu/Context).
          4.  **Coordination Value:** Does breaking it collapse the system? (Queue = Yes, Jaywalking = No if universal).
      *   *Draft Rule:* A visitor owes compliance to local conventions when (a) the convention coordinates social interaction without violating basic rights, (b) non-compliance causes specific, uncompensated harm to a participant who relies on the norm, and (c) the norm is reasonably knowable through due diligence.

  4.  **Identify the Missing Element:**
      *   What haven't they discussed?
      *   *Power Dynamics/Exit Costs:* Ben talks about the employer, Sofia about the server. Neither talks about the *customer's* vulnerability or the *server's* ability to quit.
      *   *Systemic vs. Individual:* They focus on the individual act. Missing is the collective action problem. One person not tipping doesn't fix the system, it just hurts one server.
      *   *The "Guest" Status:* There's a specific ethics of hospitality. The host (local) offers access; the guest (visitor) owes respect. This is deeper than "convention."
      *   *Selection:* The **ethics of hospitality vs. the ethics of justice**. They treat it as contract or coordination. They miss the relational aspect of *being a guest*. Also, the **collective action problem** (individual refusal doesn't change the system). Let's go with the **Collective Action/Agency** problem. Ben thinks not tipping protests the system. Sofia thinks it hurts the server. Neither addresses that the customer has no power to change the wage law, making the "protest" futile but the harm real.
      *   *Alternative Missing Point:* The distinction between *moral* obligations and *pragmatic* obligations. Sometimes you follow the rule not because it's right, but to avoid conflict.
      *   *Better Missing Point:* **The asymmetry of exit.** The server cannot easily exit the tipping system; the diner can exit the restaurant. Ben treats them as equals in a contract; they aren't.
      *   *Best Missing Point:* **The distinction between constitutive rules and regulative rules.** Queueing constitutes the order; tipping regulates income.
      *   *Actually, the strongest missing point:* **The temporal dimension of reform.** Ben wants to change the system by opting out. Sofia wants to navigate it. Neither asks: "Is there a way to tip the server *and* protest the employer?" (e.g., write a note, pay in cash directly, advocate politically). They assume the binary choice is the only choice.
      *   *Let's select:* The **agency of the server** and the **futility of individual protest**. Ben assumes his non-tip hurts the employer. It doesn't. It hurts the server. Sofia assumes the obligation is static. Neither discusses that the visitor has a duty to *minimize harm* while *advocating for change*, not just choose one or the other.

  5.  **Determine the Winner:**
      *   Ben is right about unjust systems and knowability.
      *   Sofia is right about reliance, fair play, and the duty to learn.
      *   Sofia seems to have the stronger grasp of *interpersonal* morality, while Ben has the stronger grasp of *institutional* critique.
      *   In the context of a dinner/visitor, Sofia's points on harm and deference carry more weight. Ben's "protest" is misdirected.
      *   *Verdict:* Sofia is more nearly right, but Ben's caveats are necessary safeguards.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the complexity.
      *   *Section 1: Point-by-Point Adjudication.* (Follow the prompt's request for Right/Wrong/Survival).
      *   *Section 2: General Rule.* (Synthesize the factors).
      *   *Section 3: The Missing Element.* (Collective action/Misdirected protest).
      *   *Section 4: Overall Verdict.*

      *(Self-Correction during drafting)*: Make sure to explicitly address the "bakery vs. jaywalking vs. tip" distinction in the General Rule section. Ensure the tone remains neutral until the end.

      *Refining the "Missing" point:* I think the most profound missing piece is the **separation of the protest from the harm**. Ben thinks withholding the tip protests the employer. It doesn't. It punishes the server. A truly ethical move would be to tip the server (fulfilling the reliance) but agitate against the employer (fixing the system). Neither mentions this "decoupling."

      *Refining the General Rule:* Needs to be actionable.
      1.  Harm Principle (Specific reliance).
      2.  Legitimacy (Not cruel/unsafe).
      3.  Knowability (Reasonable effort).

      *Refining the Move Analysis:* Keep it tight. Don't ramble.

  7.  **Final Review against Prompt:**
      *   Adjudicate point by point? Yes.
      *   Say what is right, wrong, how much survives? Yes.
      *   Best attempt at general rule? Yes.
      *   Distinguish bakery/jaywalking/tip? Yes.
