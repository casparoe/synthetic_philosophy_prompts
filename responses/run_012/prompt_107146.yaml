answer: |-
  **Exam Question**

  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the following question. You are not required to cite specific authors or texts, but you must define your terms and argue clearly.

  **Question:**
  Consider the following proposal regarding divine omnipotence: *Omnipotence properly includes the power of self-limitation. An omnipotent being may, by its own voluntary act, place itself under a constraint it cannot afterwards remove (such as making an unbreakable promise or creating a stone it cannot lift). This act of self-binding counts as an exercise of power rather than a surrender of it, because the inability is self-imposed and was within the being's power to avoid.*

  Write an essay that evaluates this proposal. Your answer must address the following four points:
  1.  State precisely what conception of omnipotence this proposal presupposes.
  2.  Argue whether an unbreakable self-imposed constraint is compatible with the being's *remaining* omnipotent after the act, and defend your position.
  3.  Determine whether this proposal offers a substantive solution to the paradoxes of omnipotence or merely a verbal maneuver that redefines the term to avoid difficulty.
  4.  Assess whether the proposal has independent motivation (e.g., fitting with other divine attributes like faithfulness or freedom) or whether it appears purely *ad hoc*.

  *Note: A strong answer will also consider whether a "power to bind oneself" is a coherent power at all, or whether the idea of a power that terminates in its own elimination is self-undermining.*

  ***

  **Model Answer**

  The self-limitation proposal presupposes a dynamic conception of omnipotence, defined not as the static possession of all compossible powers at every moment, but as the maximal capacity for agency, including agency over one's own nature. On this view, omnipotence is the ability to determine what one can and cannot do. If a being cannot limit itself, it lacks power over its own modal status; thus, the power to self-limit is arguably a necessary condition of maximal greatness.

  The central difficulty lies in compatibility: can a being remain omnipotent after rendering itself unable to do something? If omnipotence requires the ability to do anything logically possible *at time t*, then a self-limited being fails this test. However, if omnipotence is assessed historically, the being remains omnipotent because the current inability is the direct result of a previous exercise of omnipotence. To argue this is compatible, one must distinguish between *first-order powers* (lifting stones) and *second-order powers* (determining which first-order powers one possesses). The proposal suggests that retaining the second-order power to bind oneself is more valuable than retaining the first-order power to lift the stone. Therefore, the being does not lose omnipotence; it actualizes a specific version of it. The inability is not a defect but a feature of a specific willed state.

  However, this risks being a verbal maneuver. If we define omnipotence as "the power to do whatever one wills," then self-limitation is trivially compatible. But this empties the term of content. For the solution to be substantive, it must explain why the *inability* itself is a perfection. Merely saying "I chose to be unable" does not solve the logical tension of an all-powerful being encountering a task it cannot perform. The paradox returns if we ask: "Can the being now undo the binding?" If yes, the binding was not real; if no, the being currently lacks a power. The proposal only works if we accept that omnipotence does not require the retention of all past capacities, which is a significant revision of the traditional concept.

  Does this revision have independent motivation? Yes, if one values divine faithfulness. A God who cannot break promises is more trustworthy than one who can. If omnipotence entails the ability to guarantee covenantal stability, the power to self-bind is theologially useful. It aligns divine power with divine goodness. Without this theological grounding, however, the proposal looks *ad hoc*, invented solely to deflect the Stone Paradox. If the only reason to posit a power of self-elimination is to save the definition of omnipotence from counter-example, it is a defensive stratagem rather than a positive account of power.

  Finally, we must question the coherence of a power that terminates in its own elimination. Powers are typically capacities for action. A power to extinguish a power is like a fire that burns the very capacity to burn. It is not logically contradictory, but it is metaphysically strange. It implies that the highest expression of power is the cessation of power. While coherent, this inverts the intuitive link between power and possibility.

  In conclusion, the self-limitation proposal saves omnipotence from paradox only by shifting the focus from what God *can do* to what God *can decide to be*. It is coherent and theologially motivated by the need for divine constancy. However, it is not a magic bullet; it requires accepting that an omnipotent being can genuinely cease to be omnipotent in specific respects without ceasing to be God. This is a substantive metaphysical cost, not merely a definitional tweak.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  | Criterion | Marks | Description of Performance | Typical Mistake Costing Marks |
  | :--- | :---: | :--- | :--- |
  | **1. Exposition of Proposal** | **4** | **4:** Clearly identifies the "second-order" conception of power (power over one's own capacities).<br>**2-3:** Describes the proposal but misses the shift in the conception of omnipotence.<br>**0-1:** Vague or conflates self-limitation with weakness. | **Mistake:** Treating self-limitation as a simple loss of power rather than a specific *type* of power exercise. |
  | **2. Compatibility Defense** | **6** | **5-6:** Distinguishes between historical vs. instantaneous omnipotence OR first-order vs. second-order powers to defend compatibility.<br>**3-4:** Asserts compatibility without explaining *how* the being remains omnipotent while unable.<br>**0-2:** Claims it is impossible without argument. | **Mistake:** Confusing the *ability to bind* (coherent) with the *state of being bound* (which looks like non-omnipotence) without bridging the gap. |
  | **3. Substantive vs. Verbal** | **5** | **5:** Recognizes that redefining omnipotence is necessary but critiques whether it solves the logical tension or just hides it.<br>**3-4:** Claims it is substantive (or verbal) without analyzing the cost to the traditional definition.<br>**0-2:** Fails to address the distinction. | **Mistake:** Assuming that showing the proposal is *coherent* is the same as showing it is *true* or philosophically satisfying. |
  | **4. Motivation & Coherence** | **5** | **5:** Links to independent theological goods (faithfulness) AND critiques the metaphysics of self-eliminating powers.<br>**3-4:** Addresses motivation OR coherence, but not both.<br>**0-2:** Treats the proposal as purely *ad hoc* without considering theological utility. | **Mistake:** Treating a "definitional victory" (making the words fit) as a "philosophical victory" (solving the underlying problem). |

  **General Guidance for Markers:**
  *   **A-Range (16-20):** Must explicitly address the "self-undermining" nature of the power (Criterion 4) and distinguish between coherence and truth (Criterion 3). The argument should flow logically rather than listing points.
  *   **B-Range (12-15):** Will likely cover the four required points but may treat them as a checklist. Often fails to critique the *cost* of the redefinition in Criterion 3.
  *   **C-Range (8-11):** Usually recites the Stone Paradox without engaging the specific self-limitation mechanism. May confuse self-limitation with logical impossibility.
