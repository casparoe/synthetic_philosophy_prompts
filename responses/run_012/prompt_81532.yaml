answer: |-
  Dear Colleague,

  Teaching this distinction to a mixed cohort is indeed a delicate operation, and your instinct to open with the apparent normativity of function-talk is correct, though I would advise you to treat it as the motivating puzzle rather than the payoff. If you hold it back until the end, the biology students will have spent an hour wondering why we are distinguishing two ways of saying what a trait does, and the philosophy students will have spent an hour wondering why history matters at all. You need the normativity upfront to show that something is at stake, specifically that we need an account that explains why a heart that cannot pump is broken while a heart that cannot make a noise is merely quiet. Start there, but move quickly to the carrying example, because the heart is too consensus-heavy to reveal the crack between the accounts. Your highland snail case is strong enough to carry the session, provided you sharpen the timeline and the causal links. The ridge arising under selection for crab resistance in the highlands gives you the etiological baseline, and the cave population where the crab has been absent for forty generations gives you the divergence point. Forty generations is biologically short enough that the ridge is still there because of the ancestors, satisfying the history condition, but long enough that the original selection pressure is gone, satisfying the etiological account's requirement to look backward. Crucially, the new use for snagging flies must be a genuine contribution to survival or reproduction in the cave, otherwise the causal-role account has nothing to latch onto. In the highland population, both accounts converge on crab resistance, which lets you establish the definitions without immediate conflict. In the cave population, they diverge sharply. The etiological account must say the function is still crab resistance, implying the trait is currently malfunctioning or at least functionless in that environment, whereas the causal-role account must say the function is fly snagging, implying the trait is fully functional. This divergence is where the work gets done.

  You should sequence the concepts so that the etiological account is introduced first, immediately followed by the distinction between a trait's being favoured by selection and selection's favouring the trait because of the effect in question. This placement is non-negotiable because the biology students will otherwise collapse the etiological account into a simple claim about current utility. They will assume that if the ridge helps with flies now, it was selected for flies, or that selection is just a label for whatever works. You need to intervene at the moment you define the etiological account to insist that the explanatory link runs through the history of the specific effect, not just the presence of the trait. If you do not secure this distinction here, the biology students will dismiss the cave snail verdict as verbal pedantry rather than a structural feature of the account. Once that is anchored, you move to the causal-role account, and this is where you must introduce the problem of system relativity. Do not present the causal-role account as the easy alternative where function is just whatever a trait does. You need to show them that without specifying the containing system and the capacity it is supposed to explain, the account explodes into triviality. The ridge also makes a noise when the snail moves, and it also collects algae, so why is snagging flies the function and not collecting algae? You must force them to see that the causal-role account requires carving the system at the joints of a specific capacity, such as nutrition acquisition, rather than just listing effects. This prevents the philosophy students from treating the causal-role account as a cheap win that avoids the hard work of history.

  The misconceptions will surface in a predictable order, and you need to head them off at specific junctures. The first misconception will appear before you even start, where the biology students assume function obviously means what the trait was selected for and the philosophy students assume any appeal to history is hand-waving. You address this implicitly by validating both instincts in the normativity opening but explicitly when you introduce the snail case. The second misconception will arise during the etiological section, where students will conflate the cause of the trait's presence with the cause of its current maintenance. You head this off with the selection-for distinction mentioned earlier. The third misconception will arise during the causal-role section, where students will think any causal contribution counts as a function. You head this off with the system relativity constraint. The fourth misconception will arise at the end, where students will assume one account must be the true one and the other false. You address this by framing them as explanatory tools for different questions rather than competing truth claims about the world. Regarding the middle positions you mentioned, the case of a trait with no selection history whatsoever that is nevertheless disposed to be favoured should be introduced after you have defined both accounts but before you close, perhaps as a challenge to the etiological view that requires history. The case of a trait that persists only because of drift should be introduced alongside it to challenge the etiological view's requirement for selection specifically. These serve to stress-test the definitions you have just built.

  You must be explicit about what you are refusing to explain to keep within seventy-five minutes and avoid bogging down in adjacent debates. You should announce that you are refusing to explain teleosemantics, as that moves from biological function to mental content and requires a separate apparatus. You should also refuse to explain the technical formulations of hybrid views that attempt to combine etiological and causal-role elements, as those are third-year material that presupposes mastery of the base accounts. Finally, refuse to explain the molecular mechanisms of drift, as that is a genetics detail that distracts from the conceptual structure of function. These refusals should be stated clearly when students ask about them, likely during the edge-case discussion, so that you can park those questions without dismissing the students' curiosity.

  For the closing question, do not ask them to define the accounts, as that tests memory rather than understanding. Instead, present them with a new variant of the snail case where the ridge in the cave population has started to degrade because it is metabolically costly and no longer needed for crabs, but still snagging flies weakly. Ask them whether the etiological account predicts the ridge will disappear faster or slower than the causal-role account predicts it will disappear, and why. This forces them to apply the logic of each account to a dynamic scenario rather than just labeling a static trait. If they understand the distinction, they will see that the etiological account sees no function in the cave and thus predicts loss via drift or negative selection, while the causal-role account sees a function in fly snagging and might predict retention, highlighting the explanatory divergence.

  I have least confidence in the moment where you introduce the selection-for distinction to the biology students. They are trained to think of selection as a optimizing force in the present, and the idea that selection favours a trait because of a specific historical effect rather than general fitness might feel like splitting hairs to them. If they dig in here, the rest of the session will stall because the etiological account will seem like a philosophical game rather than a biological tool. What would change my mind about this sequence is seeing evidence that biology students at this level already grasp the concept of selection-for as distinct from selection-of in their evolutionary biology coursework. If you know they have covered Sober's distinction in their core modules, you can move through that section faster and spend more time on the system relativity problem, which might be the greater hurdle for the philosophy students. If you see blank stares when you mention selection-for, you will need to pause and use a different example, perhaps one involving spandrels in architecture, to secure that distinction before returning to the snail. Until you see their reaction to that specific conceptual pivot, the sequence remains vulnerable to losing the half of the room that thinks the answer is obvious.
