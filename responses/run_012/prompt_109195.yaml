answer: |-
  This is a sharp distinction, and you are definitely not reinventing the wheel—you've independently rediscovered one of the foundational debates in the philosophy of history. The French historian Marc Bloch, in *The Historian's Craft* (1941), drew almost exactly this line. He called them "witnesses in spite of themselves" (your relics) versus "witnesses on purpose" (your testimony).

  Your instinct—that the relic is epistemically superior because it lacks intent—is the default position of the scientific historian. It is the bedrock of archaeology, econometrics, and climate history.

  However, you asked for the seminar-eating conceptual issue where this instinct bites you. The problem isn't that relics lie; it's that **human intent is a geological force.**

  ### The Case of the Votive Deposit (The "Ritual Trap")

  Imagine you are excavating a Bronze Age bog in Northern Europe. You find 500 bronze swords, perfectly preserved, dating to a 200-year window.

  **The Relic-First Reading (The Geologist's Instinct):**
  You treat the swords as a "relic." They are physical byproducts. They entered the sedimentary record through some process. Ignoring any later mythology or texts about these people, you analyze the distribution.
  *   **Data:** 500 swords in a bog.
  *   **Inference:** This was a site of intense conflict (a mass grave after a battle) OR a site of mass discard (a workshop dump).
  *   **Conclusion:** You reconstruct a society with high warfare intensity or high industrial output. The swords are "garbage" or "losses." They are unintentional traces of economic or military activity.

  **The Testimony Reading:**
  Later, you read Roman accounts (Tacitus, *Germania*) or later saga traditions regarding these specific tribes. They describe a religious practice: *After every victory, 10% of captured weapons are ritually destroyed and cast into the sacred lake.*
  *   **Data:** The swords were placed there *on purpose* to communicate with the gods.
  *   **Inference:** This is not "garbage." It is a curated sample.
  *   **Conclusion:** The 500 swords do not represent total production or total conflict. They represent a *tithe*. If 500 swords were sacrificed, 5,000 were kept.

  **The Conflict:**
  If you stick to your "Relic-First" instinct and ignore the testimony (the intent), you radically misinterpret the physical data.
  1.  **Economic Distortion:** You underestimate the total metal production by a factor of ten.
  2.  **Behavioral Distortion:** You interpret a ritual act (careful placement) as a chaotic event (battle loss) or economic waste (dump).
  3.  **The "Silent" Lie:** The relic *itself* (the sword in the mud) is physically real. It hasn't been forged. But its *context*—why it is there and not somewhere else—is entirely determined by an "agenda."

  In geology, a moraine is deposited by gravity and ice flow. The ice doesn't *decide* to drop a rock to send a message to the future. In human history, **intent drives deposition.** The "agenda" you want to filter out is actually part of the *formation process* of the relic.

  If you treat the sword as a "bare relic," you are assuming the formation process was natural (loss, decay, accident). But in human history, the formation process is often *cultural*. By ignoring the testimony, you aren't stripping away bias; you are stripping away the *causal mechanism* that put the object in the ground.

  ### The Deeper Epistemic Problem: "Social Taphonomy"

  In your old job, you dealt with **taphonomy**: the study of what happens to an organism after it dies until it is found. A bone might be moved by a river, chewed by a hyena, or dissolved by acid. You have to account for these processes to understand the original life.

  In history, there is **social taphonomy**. Humans move their own "bones."
  *   A tax ledger (relic) survives not because it was random trash, but because a state archive decided to keep it (intent).
  *   A city is built on a hill (relic) not because of geology alone, but because of defensive strategy (intent).

  The trouble arises when the "Relic" looks like a byproduct but is actually a performance.
  *   **Example:** The Soviet Grain Statistics. The *paper* the numbers are printed on is a relic (physical existence). The *numbers* are testimony. But the *fact that the report was printed at all* is also testimony (a signal to the Politburo that the region was compliant). If you treat the existence of the report as a "relic of administration" without reading the intent of the report, you miss that the *production of the document* was the primary political act, not the recording of data.

  ### The Bonus: Is your instinct a principle or a habit?

  It is a **defensible heuristic, but a dangerous ontology.**

  **Why it's defensible:**
  As a methodological starting point, "Relic-First" is essential. It is the principle of **methodological skepticism**. Historians for centuries accepted Herodotus's stories until archaeology (relics) proved some were exaggerated. Prioritizing the unintentional trace corrects for the human tendency to self-aggrandize. It forces the historian to anchor their narrative in physical constraints (e.g., "This army couldn't have marched here; the pollen core shows the forest wasn't cleared yet").

  **Why it's a habit (The "Materialist Fallacy"):**
  Your instinct comes from working with a world where *matter is passive*. Ice does not conspire. Moraines do not have reputations to protect.
  In human history, **matter is active.** Humans imbue objects with intent *before* they become relics.
  *   If you prioritize the relic *too* highly, you commit the **Materialist Fallacy**: assuming that because something is physical, it is more "true" than the mental state that created it.
  *   Sometimes, the "Testimony" *is* the historical event. If Caesar writes *The Gallic Wars*, the text is testimony. But the *act of publishing it* was a political maneuver that changed the course of the Republic. The "truth" of the document isn't whether the battle happened exactly as described (relic-checking); the truth is that Caesar *wanted you to think it happened that way*, and that belief moved legions.

  **The Verdict:**
  Your "Relic-First" rule is the correct **brake**, but it cannot be the **engine**.
  *   Use the relic to check the *possibility* of the testimony (Could this army feed itself? Does the ice core allow for this harvest?).
  *   Use the testimony to explain the *arrangement* of the relic (Why are the swords in the bog? Why was this ledger saved?).

  If you treat the relic as the only truth, you end up with a history of things, not a history of people. You get a perfect map of where the swords are, and zero understanding of why they are there. In geology, the "why" is physics. In history, the "why" is meaning. And meaning is invisible to the geologist's eye.

  So, keep the instinct. It will save you from being duped by propaganda. But remember: in human strata, the "agenda" isn't contamination. It's the sediment itself.
