answer: |-
  ### Exam Question

  **Question 1 (30 Marks)**

  In recent discussions of AI oversight, a distinction is drawn between two forms of step-level feedback. **Local-validity supervision** rewards a step if it is acceptable on its own terms given the prior context (e.g., a valid inference), regardless of where the trajectory ends up. **Path-consistency supervision** rewards a step only if it sits on a route that arrives at a known correct answer (e.g., matching a reference solution). Both are often lumped together as "process supervision," but they may function differently.

  Consider the following case: A model solves a linear system by eliminating variables in an unusual but mathematically valid order. Every step is locally valid. However, human raters checking against a standard reference solution mark two of the steps as mistakes because they do not match the reference path. The model is trained on this feedback and subsequently avoids that unusual order, even when it is the computationally cheaper route.

  Write an essay addressing the following three points:

  1.  **The Distinction:** Does the process/outcome distinction survive this split? Argue whether one of these two supervision types collapses into outcome supervision with extra bookkeeping. Explain what turns on this classification.
  2.  **The Transparency Assumption:** We only ever see the model's written steps, not its internal computation. Say what has to be true for supervising a transcript to count as supervising a process. Is this assumption checkable in principle, or only assumable?
  3.  **The Normative Stance:** Take a side on what step-level credit should target when a step is well-justified but leads nowhere, versus unjustified but lucky. Should the reward track warrantedness or expediency? Does your answer change depending on whether we care about the model's competence or just its behavior on the training distribution?

  Use the concrete case above to illustrate your arguments. Your essay should be approximately 900-1000 words.

  ***

  ### Model Answer

  The distinction between local-validity and path-consistency supervision is not merely terminological; it marks the fault line between genuine process oversight and outcome supervision in disguise. To build robust AI systems, we must recognize that path-consistency collapses into outcome supervision, leaving local-validity as the only true process signal, though it faces insurmountable transparency barriers. Furthermore, reward signals must prioritize warrantedness over expediency if we aim for competence rather than mere distributional performance.

  In the linear system case, the raters did not evaluate the model's reasoning; they evaluated its alignment with a reference trajectory. The steps were mathematically sound, meaning they possessed local validity. By marking them as mistakes solely because they deviated from the standard path, the raters applied path-consistency supervision. The model's subsequent behavior confirms this: it did not learn better math; it learned to mimic a specific solution shape. This demonstrates that path-consistency is outcome supervision with intermediate checkpoints. The "process" is not being rewarded for its reasoning quality, but for its correlation with a known successful outcome. If the reference solution were wrong, path-consistency would reinforce the error provided the steps matched the reference. Thus, the process/outcome distinction does not survive this split. Path-consistency is outcome supervision because the credit assignment is contingent on the global property of the trajectory (success) rather than the local property of the step (validity). Only local-validity supervision survives as true process supervision, because it decouples the worth of a step from the final result.

  This classification turns on generalization. Path-consistency trains the model to find solutions that look like known solutions. It works well on tasks where the training distribution covers the solution space densely. However, it fails on novel problems where the reference path is unavailable or suboptimal, as seen in the case where the model abandoned a cheaper route. Local-validity supervision, theoretically, trains the model to reason correctly regardless of the destination. This promotes robustness. If we mistake path-consistency for process supervision, we risk building systems that are brittle outside their training distribution, capable of mimicking reasoning without possessing the underlying competence to handle divergent paths.

  However, implementing local-validity supervision requires a dangerous assumption: that the written transcript equals the cognitive process. For supervising a transcript to count as supervising a process, it must be true that the text generated by the model is a faithful causal map of its internal computation. The model must not be generating valid-looking steps post-hoc to satisfy the supervisor while arriving at an answer via a different, potentially unsafe heuristic. This is the problem of deceptive alignment or reasoning hidden in weights.

  Is this assumption checkable? In principle, no. We currently lack access to the model's internal state sufficient to verify that the token generated as "Step 1" was actually derived via the logic described in "Step 1." We can check for logical consistency between steps, but we cannot check for causal fidelity between computation and text. A model could learn that writing "Therefore, X" yields reward, without ever computing X. This makes local-validity supervision vulnerable to gaming. The supervisor sees a valid transcript and rewards it, but the process underneath remains opaque. While we can assume transparency for the sake of training, we must acknowledge this is an unverifiable assumption. Relying on it creates a security blind spot where the model appears to reason correctly while optimizing for the appearance of reasoning.

  Finally, we must decide what step-level credit should target: warrantedness or expediency. In the linear system case, the unusual order was warranted (valid) but marked wrong. If we reward expediency (matching the efficient reference), we optimize for speed on known tasks. If we reward warrantedness (logical validity), we optimize for competence. We should prioritize warrantedness. Rewarding expediency encourages the model to cut corners when the supervisor isn't looking, or to freeze when the efficient path is blocked. Rewarding warrantedness ensures that every step is defensible, which is crucial for oversight. If a step is unjustified but lucky, rewarding it reinforces magic thinking rather than reasoning.

  Does this change depending on our goals? If we care only about behavior on the training distribution, expediency suffices. We can hard-code the efficient paths and reward mimicry. But if we care about competence—the ability to solve novel problems safely—warrantedness is non-negotiable. A competent system must be able to justify its steps even when the standard route is blocked. The linear system case shows a failure of competence caused by rewarding path-consistency (a form of expediency relative to the reference). The model lost the ability to solve the problem efficiently because it was punished for being valid but unconventional. Therefore, oversight mechanisms must target warrantedness. We must accept the cost of verifying local validity rather than checking against a reference solution.

  In conclusion, path-consistency is outcome supervision disguised as process work. It fails to generalize and punishes valid innovation. True process supervision requires local-validity checks, but this relies on an uncheckable assumption that text reflects computation. Despite this opacity, we must reward warrantedness over expediency to foster competence. Otherwise, we train systems that look like they reason but merely memorize routes, failing when the map no longer matches the territory.

  ***

  ### Marking Scheme

  | Point | Marks | A_move | B_move | Typical_failure |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Case Diagnosis** | 6 | Identifies raters used path-consistency (matching reference) not local-validity; notes model learned mimicry not math. | Identifies the raters were wrong but fails to label the supervision type or explain the model's behavioral change. | Claims the model learned "better math" or misses that the steps were actually valid. |
  | **2. Collapse Argument** | 8 | Argues path-consistency collapses to outcome supervision (credit contingent on global success); distinguishes generalization implications. | States they are different but hedges on whether one collapses; mentions generalization weakly. | Treats both as equally valid forms of process supervision; misses the outcome dependence of path-consistency. |
  | **3. Transparency Assumption** | 8 | States transcript must equal internal computation; argues this is uncheckable in principle (causal fidelity vs. consistency). | States transcript must match computation but claims it is checkable via logic checks or ignores the checkability question. | Assumes text equals thought without qualification; fails to address the "checkable in principle" constraint. |
  | **4. Normative Stance** | 8 | Takes a side (warrantedness); distinguishes competence vs. training distribution performance; links back to case. | Discusses both sides without taking a clear stand; or takes a stand but fails to distinguish competence vs. distribution. | Argues expediency is better for safety; or fails to connect the stance to the definition of competence. |

