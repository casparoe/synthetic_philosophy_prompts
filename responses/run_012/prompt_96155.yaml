prompt: |-
  I want an argument for a specific reading of Aquinas on killing tyrants, and I want it defended against the reading most people find obvious.

  The texts pull in different directions. In an early theological commentary he treats it as defensible that someone might free a community by killing a tyrant, and he frames the case within a discussion of when one may refuse obedience to an unjust holder of power and suffer for it. In the later, unfinished treatise on kingship he is much more cautious: he stresses how dangerous it is to move against a ruler, observes that a moderate tyrant is better borne than the disorders that follow from attacking him, and suggests that where a superior authority exists, remedy should be sought from it rather than by private hands. In the treatment of sedition in the great systematic work, the killing of rulers is not treated as a straightforward good, and sedition is condemned as contrary to justice and the common good. Many readers conclude that Aquinas softened or reversed his position, or that he never had a settled one.

  Your task is to argue for the following thesis: that the permission is best understood as belonging to public authority rather than to private persons, and that the apparent drift across the texts is not a change of mind but a change in the question being asked, since the early text asks whether unjust authority can obligate the conscience while the later texts ask how a community should prudently and lawfully remove a ruler. Argue that this reading, rather than the obvious one, is what the reasoning in the texts actually forces.

  To make the argument substantive rather than a harmonizing gesture, you must work through at least these points:

  First, distinguish a ruler defective in title from a ruler defective in the exercise of an authority he validly holds. Say which of the two the permission plausibly covers, and give the reason drawn from the nature of political authority rather than from the severity of the ruler's wrongdoing.

  Second, address the case in which there is no superior who can depose the tyrant, and the case in which there is. Explain whether the absence of a superior creates a permission for private persons or instead leaves the community with no lawful remedy at all, and defend your answer.

  Third, confront the objection that on your reading Aquinas says almost nothing, since a public authority that has already deposed a tyrant hardly needs a theory of tyrannicide. Explain what work the permission is doing if it is not a license for individuals.

  Fourth, take seriously the rival reading, that for Aquinas the tyrant forfeits his claim simply by ruling unjustly and may be killed by anyone with the courage and the opportunity, and give the strongest argument for it before explaining why it fails. Consider in this connection whether the killer acts as an instrument vindicating the community's justice or as a private party taking vengeance, and whether that difference is doing moral work or is merely a legal formality.

  Fifth, say what the counsel to endure a moderate tyrant amounts to. Is it a moral constraint on resistance, a piece of prudence about consequences, or an acknowledgment that judgments about tyranny are so unreliable that the risk of error should be borne by the oppressed rather than by the ruler? If it is only prudence, say so and explain why the moral thesis survives it; if it is more than prudence, explain what principle limits resistance.

  Throughout, argue from the structure of the positions rather than from the authority of the texts. Do not present this as a survey of scholarly opinions, and do not lean on the fact that the treatise on kingship was left unfinished or on questions about who completed it. Conclude with the strongest objection to your own thesis and an honest statement of what evidence or argument would defeat it.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Analyze the Request:**
      *   **Thesis:** Aquinas's permission to kill tyrants belongs to *public authority*, not private persons. The apparent drift in texts is a shift in *question* (conscience/obligation vs. prudence/lawful removal), not a change of mind.
      *   **Task:** Defend this thesis against the "obvious" reading (that Aquinas permits private tyrannicide, at least early on).
      *   **Constraints:**
          *   Work through five specific points (Title vs. Exercise defect; Superior authority availability; Function of the permission if not private license; Rival reading & forfeiture theory; Meaning of enduring moderate tyranny).
          *   Argue from the *structure of the positions*, not textual authority or scholarly survey.
          *   Do not lean on the unfinished nature of *De Regno*.
          *   Conclude with the strongest objection to *my* thesis and what would defeat it.
      *   **Tone:** Philosophical, rigorous, argumentative.

  2.  **Deconstruct the Five Points:**

      *   *Point 1: Defective Title vs. Defective Exercise.*
          *   Need to distinguish a usurper (no title) from a legitimate ruler who acts badly (abuse of title).
          *   Argument: Political authority is for the common good. A usurper lacks the *relation* to the common good that constitutes authority. A legitimate tyrant retains the *office* but violates the *end*.
          *   Implication: Permission to kill likely applies to the usurper (who is effectively an aggressor/private enemy) rather than the legitimate tyrant (who holds public power). Or, if it applies to the legitimate tyrant, it must be via the public body, not private will.
          *   Refinement for the specific thesis: The thesis is that *public authority* is required. So, even a usurper needs public designation to be removed lawfully, though the barrier is lower. But the prompt asks which the permission *plausibly covers*. Usually, tyrannicide discussions focus on the legitimate ruler gone bad. I need to argue that the *nature of authority* means private killing is always illicit because it usurps the judgment of the whole.

      *   *Point 2: No Superior vs. Superior Exists.*
          *   *De Regno* says if a superior exists, go to them. What if not (e.g., Emperor)?
          *   Obvious reading: If no superior, private persons can act.
          *   My reading: If no superior, the *community* (as a corporate whole) acts, not private individuals. The absence of a superior does not dissolve the requirement for public judgment. It leaves the community with a difficult prudential choice, not a license for assassination.
          *   Defense: Private killing introduces greater disorder than tyranny. The "no remedy" scenario is a tragedy, not a loophole.

      *   *Point 3: Function of the Permission.*
          *   Objection: If public authority deposes the tyrant, they don't need permission to kill him; they are already in charge.
          *   Response: The permission validates the *act of deposition* itself, which may involve force. It clarifies that the tyrant is not being "murdered" (private killing) but "executed" or removed via public justice. It distinguishes sedition (private faction) from legitimate resistance (public act). It provides the moral grammar for the transition of power.

      *   *Point 4: Rival Reading (Forfeiture Theory).*
          *   Rival: Tyrant forfeits claim by injustice; anyone can kill him as an instrument of justice.
          *   Strongest Argument: Analogy to self-defense against an aggressor. Tyrant attacks the common good; any member can defend the whole.
          *   Why it fails: It conflates the *common good* with the sum of private goods. Only the guardian of the whole can judge injury to the whole. Private killing turns political justice into private vengeance, fueling cycles of violence (sedition). The "instrument" distinction is not formal; it's substantive. Who judges the forfeiture? If anyone, chaos ensues.

      *   *Point 5: Enduring Moderate Tyranny.*
          *   Is it prudence or moral constraint?
          *   Argument: It is prudence rooted in the moral priority of order. Disorder is a greater evil than moderate injustice *unless* the injustice destroys the possibility of community.
          *   Moral Thesis: The requirement for public authority survives because private judgment is inherently unreliable regarding the "tipping point." The risk of error must lie with the oppressed to prevent the greater evil of civil war based on subjective judgment.

  3.  **Drafting the Argument - Section by Section:**

      *   *Introduction:* State the thesis clearly. The shift is from *obligation* (Commentary on Sentences) to *polity maintenance* (De Regno/ST). The core principle is consistent: Private killing is illicit; public removal is lawful.
      *   *Section 1 (Title vs. Exercise):* Focus on the source of authority. Authority comes from God/Community for the Common Good. A usurper lacks the channel. A tyrant blocks the flow. But the *judgment* of blockage belongs to the source (community/superior), not the recipient (subject). Private killing assumes a judgment private persons cannot make.
      *   *Section 2 (The Superior):* Address the "no appeal" scenario. Does this create a vacuum filled by private violence? No. It creates a situation where the community must act *as a body*. If they cannot act as a body, they must endure. Private assassination is never the "lawful remedy." It is always extralegal.
      *   *Section 3 (Work of the Permission):* Why say it if public authority does it? To distinguish *sedition* from *justice*. Sedition is private faction claiming public good. Legitimate removal is public authority reclaiming its end. The permission legitimizes the *transition*, ensuring the new regime isn't tainted by the sin of murder/sedition.
      *   *Section 4 (Rival Reading):* Steelman the forfeiture view. It appeals to natural law defense. Refute it by showing that political authority isn't just aggregated self-defense. It requires impartial judgment. Private killing is vengeance masquerading as justice. The "instrument" claim fails because an instrument must be directed by the principal; a private killer directs himself.
      *   *Section 5 (Moderate Tyranny):* This is prudence, but prudence guided by moral ontology. Order is a precondition of justice. To disrupt order for lesser injustices is to destroy the ground of justice itself. The moral constraint is on *who judges*, not just on the outcome.
      *   *Conclusion & Objection:* Strongest objection: What if the public authority is *the* tyrant (e.g., the Senate supports the Emperor)? Then the "public" mechanism is blocked. Does my thesis imply quietism?
      *   *Defeater:* Evidence that Aquinas explicitly endorses a specific private individual acting without any mandate in a case where public mechanisms were theoretically possible but corrupt. (I need to admit if the texts explicitly name a private hero, my thesis struggles).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I rely on *De Regno* being unfinished? *Correction:* Ensure I treat the arguments within it as substantive regardless of authorship/completion status, as per instructions.
      *   *Check:* Did I distinguish the Commentary on the Sentences? *Correction:* Yes, frame it as dealing with obedience/conscience, not constitutional theory.
      *   *Check:* Is the distinction between "public authority" and "private person" clear? *Correction:* Public authority doesn't just mean "the King." It means the *res publica* acting through its proper channels (which could be nobles, electors, etc., not just a single superior).
      *   *Tone Check:* Keep it philosophical. Avoid "Scholars say X." Use "The text implies," "The logic requires."

  5.  **Final Polish:**
      *   Ensure the transition between points is smooth.
      *   Make sure the "Strongest Objection" at the end is genuinely threatening to the thesis, not a straw man. The "frozen public authority" problem is the real killer for the public-authority reading.

  6.  (Mental Outline of the "Strongest Objection"): If the tyrant controls all public mechanisms (courts, nobles, army), the "public authority" reading says "do nothing." But Aquinas praises Brutus/Cassius in the Sentences commentary (arguably). If he praises private actors in a context where public mechanisms were co-opted, my thesis fails. I must acknowledge this tension.

  7.  *Final Review against constraints:*
      *   Thesis stated? Yes.
      *   5 points covered? Yes.
      *   No scholarly survey? Yes.
      *   No reliance on unfinished status? Yes.
      *   Strongest objection included? Yes.

      *Let's write.*
answer: |-
  The thesis to be defended is this: Aquinas's scattered remarks on tyrannicide are consistent in maintaining that the use of lethal force against a ruler is licit only when undertaken by public authority, never by private persons. The apparent contradiction between his early commentary on the *Sentences* and his later political writings is not a retraction of a permission for private killing, but a shift in focus from the limits of conscientious obedience to the structural requirements of lawful resistance. The early text asks whether a subject is bound to obey a usurper or tyrant; the later texts ask how a polity may lawfully restore order. In both cases, the logic of political authority forbids private individuals from assuming the sword of justice.

  ### I. Defective Title vs. Defective Exercise

  To understand why private killing is excluded, one must distinguish between a ruler who lacks title (a usurper) and a ruler who holds title but abuses it (a tyrant by exercise). The obvious reading suggests that the severity of the abuse determines the licitness of resistance: the worse the tyrant, the more permissible the killing. This misunderstands the metaphysical basis of Aquinas's political theory. Authority is not a property of the person but a relation ordered toward the common good.

  A ruler defective in title never truly holds authority; he is an aggressor occupying a role. A ruler defective in exercise holds the office but directs it toward a private end. The permission to remove a ruler, properly understood, applies most plausibly to the usurper, but even here, the logic of *public* authority holds. Why? Because the judgment that a title is defective belongs to the community or the superior who confers the title, not to the individual subject. If a private person decides a ruler is a usurper and kills him, he is not acting as a magistrate but as a vigilante.

  However, the harder case is the legitimate ruler turned tyrant. Here, the permission to kill cannot belong to private persons because the ruler still holds the *office* of judgment. To kill him is to usurp the very function of the office he holds, even if he abuses it. The nature of political authority requires that the power to judge the ruler resides in the source of that authority (the community or a superior), not in its recipients (the subjects). Therefore, the permission covers the removal of a tyrant only when the agent of removal acts with the mandate of the public body. The distinction rests not on the severity of the wrongdoing, but on who possesses the jurisdiction to judge that wrongdoing. Private persons lack jurisdiction over the public good; therefore, they cannot lawfully execute judgment on its guardian, however corrupt.

  ### II. The Absence of a Superior

  Aquinas advises in *De Regno* that if a superior exists (e.g., an Emperor over a King), remedy should be sought from him. The obvious reading infers that if no superior exists, the right to kill devolves to the people or individuals. This is a non sequitur. The absence of a superior does not create a vacuum of jurisdiction that private persons may fill; it creates a situation where the *community as a corporate whole* must act, or where no lawful remedy exists.

  If there is no superior, the authority to judge the ruler reverts to the body that originally constituted the kingship. This is not a license for private assassination. It is a call for public deposition. If the community cannot act as a body—if it is too fragmented or cowed to act publicly—then the absence of a superior leaves the community with no *lawful* remedy, not with a license for private violence. To argue otherwise is to claim that the breakdown of public order creates a right to private war. For Aquinas, the breakdown of order is precisely the evil to be avoided.

  Therefore, the absence of a superior does not empower the private individual; it burdens the community. If the community cannot act publicly, it must endure. This is not because tyranny is good, but because private killing is inherently seditious. It substitutes private judgment for public law. If the public mechanisms are frozen, the moral cost of breaking them via private violence outweighs the cost of enduring the tyrant, unless the tyranny is so total it destroys the community's existence. In that extreme case, the community acts in self-defense as a body, not as a collection of private assassins.

  ### III. The Function of the Permission

  A potent objection arises: If only public authority can remove a tyrant, what work does the permission to kill do? If the Senate or the nobles depose a king, they already possess the coercive power of the state; they do not need a theory of tyrannicide to execute a deposed ruler. If the permission is not a license for individuals, is it not vacuous?

  It is not vacuous because it defines the moral status of the transition of power. Without this permission, any movement against a ruler is *sedition*, a sin against the common good. With it, a movement against a tyrant can be classified as *justice*. The permission allows the public authority to distinguish between a rebel and a liberator. It ensures that the removal of the tyrant is not treated as a murder that requires penance, but as an act of public justice.

  Furthermore, it provides the moral grammar for the intermediate agents. Often, the "public authority" is not a single person but a body of nobles or electors. The permission clarifies that when these agents act, they are not acting as private conspirators but as ministers of the public good. It prevents the new regime from being tainted by the sin of usurpation. If the removal is lawful, the new order is legitimate. If it is private killing, the new order is founded on blood-guilt and invites further vengeance. The permission is the bridge that allows the state to survive the removal of its head without dissolving into civil war.

  ### IV. The Rival Reading: Forfeiture and Instrumentality

  The rival reading holds that by ruling unjustly, the tyrant forfeits his claim to authority and becomes a private aggressor whom anyone may kill. The strongest argument for this view relies on the analogy of self-defense. If a robber attacks a traveler, the traveler may kill him. If a tyrant attacks the common good, any member of the community may kill him as an instrument of the community's justice. On this view, the killer is not taking vengeance but vindicating justice.

  This fails because it conflates the common good with the aggregation of private goods. The common good is distinct and requires impartial judgment. In the case of the robber, the threat is immediate and the judgment of self-defense is instinctive and personal. In the case of the tyrant, the "attack" is political and structural. Determining whether a ruler is a tyrant requires weighing complex goods: order, justice, peace, and religion. A private person cannot impartially weigh these against their own grievances.

  The distinction between acting as an "instrument of justice" and a "private party" is not a legal formality; it is the moral core of the act. An instrument acts on the judgment of the principal. A private killer acts on his own judgment. If anyone can claim to be an instrument of the community's justice, then every faction becomes a judge in its own cause. This leads directly to the sedition Aquinas condemns in the *Summa Theologiae*. The rival reading collapses the political order into a state of nature where power decides right. Aquinas's insistence on public authority is an insistence that political justice requires a public judge, even when the defendant is the ruler. Without that judge, the killing is vengeance, regardless of the killer's intent.

  ### V. Enduring Moderate Tyranny

  Finally, Aquinas's counsel to endure a moderate tyrant must be understood. Is this a moral constraint or mere prudence? It is prudence grounded in a moral ontology. Disorder is a greater evil than moderate injustice because justice cannot exist without order. To disrupt the peace for the sake of correcting moderate errors is to destroy the condition in which justice is possible.

  However, this is more than simple consequentialism. It is an acknowledgment that judgments about tyranny are inherently unreliable when made by the oppressed. The risk of error must be borne by the oppressed rather than by the ruler because the alternative—allowing private judgment to authorize regicide—guarantees greater error and bloodshed. The moral thesis survives this prudence because the requirement for public authority remains. Even if the tyranny is severe, the *mode* of resistance must be public. The counsel to endure is a recognition that if public resistance is impossible, private violence is not the solution. It limits resistance not by denying the evil of tyranny, but by denying the competence of private persons to remedy it.

  ### Conclusion and Strongest Objection

  The structure of Aquinas's position forces the conclusion that tyrannicide is a public act, not a private right. The early text addresses the conscience of the subject (do not obey); the later texts address the constitution of the polity (how to remove). Both presuppose that the sword of justice belongs to the public order.

  The strongest objection to this thesis is the problem of the "frozen public." What if the tyrant has co-opted all public mechanisms? If the nobles are cowed, the courts are corrupted, and there is no superior, the "public authority" reading implies that no lawful resistance is possible. It seems to demand quietism in the face of total tyranny. If Aquinas truly believed that private killing is always illicit, he leaves the community helpless against a ruler who successfully monopolizes force.

  This thesis would be defeated by clear textual evidence that Aquinas explicitly endorses a specific private individual acting without any mandate in a context where public mechanisms were co-opted but theoretically existent. If, in the *Commentary on the Sentences*, he praises Brutus not merely for removing a usurper (Tarquin) but for acting as a private citizen against a ruler who held the reins of state, then the distinction between public and private authority collapses. If Aquinas grants that the "whole people" can authorize a private individual implicitly through their silence or suffering, then my insistence on formal public authority is too rigid. However, absent such explicit endorsement, the logic of his system prioritizes the avoidance of sedition over the removal of the tyrant, maintaining that a community without public judgment is no longer a polity, and thus cannot act politically until it reconstitutes its public voice.
