answer: |-
  The persistence of the debate over adaptationism, ignited by the 1979 critique known as the spandrels paper, presents a peculiar phenomenon in the philosophy of biology. Four decades on, the specific target of the critique—a naive adaptationism that assumes every trait is optimal and selected for—is largely a straw man that few practicing biologists explicitly endorse. Yet, the adaptationist research programme remains the dominant default in evolutionary biology, while the structuralist or pluralist critique continues to generate new literature. Both camps claim vindication: biologists argue the critique improved rigor without displacing selection as the primary explanatory tool, while pluralists argue that non-adaptive explanations remain systematically marginalized. This stalemate suggests that the disagreement is not a single argument waiting to be settled by data, but a conflation of distinct logical types of dispute. To diagnose the impasse, we must disentangle the empirical, methodological, normative, and verbal strands that have been fused under the label of "adaptationism." Only by separating these can we determine whether the debate is resolvable or if it is a permanent feature of evolutionary inquiry.

  The diagnosis begins with the founding metaphor, for the architectural analogy serves as the intuitive anchor for the entire critique. The objection that the San Marco example is technically misdescribed—that the curved surfaces are pendentives, not spandrels, and that their shape resulted from design choices rather than pure geometric necessity—raises a fundamental question about the logical structure of the argument. Does the critique stand or fall with the architectural facts? The verdict must be that the critique survives the correction, though its rhetorical force is diminished. The logical core of the spandrel argument is not that the architectural feature was *unintended* in the sense of being a mistake, but that it was a *necessary consequence* of a primary design choice (the dome on a square base) that was subsequently co-opted for decoration. Even if the pendentive was a chosen engineering solution, the specific surface area available for mosaics was determined by the structural requirements of the dome, not by an aesthetic optimization of the surface itself. The mosaics are secondary to the structure.

  Transposed to biology, the point holds even if the "structure" (the trait) was initially selected for something else. The argument against adaptationism does not depend on the trait being useless, but on its current form being constrained by historical or developmental architecture rather than optimized for its current function. If the architectural critics are right that the pendentive was a design decision, the biological analogy simply shifts from "unintended byproduct" to "structural constraint." The adaptationist assumes the trait was optimized for its current use; the spandrel critic argues the trait's form is limited by the requirements of a different system (the developmental or structural architecture). Therefore, the architectural inaccuracy is a verbal correction that does not collapse the logical distinction between optimization and constraint. However, the misdescription does reveal a vulnerability: the concept relies on an intuition about "leftover space" that is harder to define in biology than in masonry. In biology, there is no architect, and "leftover" implies a teleology that does not exist. This leads directly to the conceptual instability of the term.

  This instability points to the first distinguishable strand of the dispute: the verbal or conceptual strand. Here, the disagreement concerns truth conditions and individuation. Whether a trait is classified as a byproduct or an adaptation often depends on how the trait is described. If one individuates the trait broadly (e.g., "the wing"), it appears adaptive. If one individuates it finely (e.g., "the specific curvature of the tertiary feather"), it may appear as a byproduct of developmental constraints. The concept of the spandrel often functions not as a positive category with independent criteria, but as a negation: a trait is a spandrel if it is not an adaptation. This lack of positive truth conditions makes the concept difficult to test. The introduction of the term "exaptation" was an attempt to stabilize this by distinguishing historical origin from current utility, but it merely shifted the problem to the difficulty of accessing deep history.

  The migration of the term "spandrel" into other fields, such as the evolutionary psychology of religion, illuminates this conceptual vagueness. When religious belief is labeled a spandrel of cognitive capacities evolved for other purposes (like agency detection), the claim is typically asserted rather than demonstrated. This migration suggests that the concept functions as a placeholder for the absence of a functional explanation. It is easy to apply because it requires only the plausibility of an alternative function for the underlying capacity, but hard to confirm because it requires ruling out direct selection on the trait itself. This reveals that the "spandrel" label is often a methodological move rather than an empirical finding. It signals a refusal to accept an adaptationist story, not necessarily the confirmation of a byproduct story. Consequently, much of the verbal dispute is actually a disguised methodological disagreement about where the burden of proof lies.

  This brings us to the methodological strand, which corresponds to the weakest and middle strengths of the critique. At its weakest, the critique is a demand for rigor: adaptationist hypotheses must be tested before acceptance. At its middle strength, it is a demand for pluralism: non-selectionist explanations (drift, constraint) must be given equal standing in the repertoire of explanations. This is a dispute about research strategy and defaults. The adaptationist position treats selection as the null hypothesis because it is the only known process that consistently produces complex functional design. The pluralist position treats selection as one hypothesis among many, arguing that assuming it by default biases the inquiry. This is not an empirical disagreement about how the world *is*, but a normative disagreement about how we should *investigate* the world. Progress on this strand does not require new biological data, but rather a consensus on heuristics. If the field agreed that the null hypothesis should be "no function" rather than "optimal function," the methodological dispute would dissolve. However, such agreement is unlikely because the choice of null hypothesis reflects deeper intuitions about the nature of organisms. The adaptationist intuits the organism as a machine optimized by history; the pluralist intuits the organism as a historical document full of noise and patchwork. Neither intuition can be argued for without already assuming the conclusion.

  The empirical strand is the only one that is, in principle, settleable by observation, yet it is the one most frequently conflated with the others. This strand concerns the frequency claim: how much of organismal form is actually the result of direct selection versus constraint or drift? This is the strong version of the critique: that non-selectionist explanations are not just possible, but prevalent. To diagnose this strand, we must anchor it in a concrete contested trait. The masculinized genitalia of the female spotted hyena serve as a paradigmatic case. Female spotted hyenas possess an enlarged clitoris, termed a pseudopenis, which is traversed by the urethra and birth canal. It is morphologically indistinguishable from the male penis to the untrained eye and is used in social greeting rituals where individuals display their genitalia to establish rank.

  The adaptationist hypothesis posits that the pseudopenis is a selected signal of social status. The cost of birthing through this narrow canal is high (significant mortality for first-time mothers), so the trait must confer a substantial fitness benefit to be maintained by selection. The benefit is hypothesized to be social: the ritualized greeting reduces aggression and stabilizes the hierarchy, which is crucial for a species that hunts in groups and competes with lions. The spandrel or byproduct hypothesis posits that the genitalia are a side effect of high androgen levels. Female spotted hyenas are highly aggressive and dominant over males, requiring high circulating androgens. The virilization of the genitalia is an unavoidable developmental consequence of this hormonal profile, which was selected for aggression and metabolism, not for the genital shape itself. The greeting behavior is then a co-option of a trait that exists for other reasons.

  To settle the empirical dispute for this specific trait, we would need three specific classes of facts. First, we need a phylogenetic reconstruction to determine the order of acquisition. Did the high androgen levels evolve before the genital morphology, or simultaneously? If the genitalia evolved in a lineage that did not yet have the high-androgen phenotype, the byproduct hypothesis is weakened. Second, we need independent fitness measures. We would need to show that variation in the degree of virilization correlates with social success *independently* of variation in aggression. If females with less virilized genitalia are socially excluded despite being aggressive, that supports the adaptationist view. If social success tracks aggression regardless of genital morphology, that supports the byproduct view. Third, we need developmental data on constraints. Is it physiologically possible to have high androgens without genital virilization? If the developmental linkage is absolute, the trait is a constraint; if the linkage can be broken by selection (as it is in other mammals with high androgens), then the maintenance of the linkage suggests selection for the genitalia themselves.

  Currently, these facts are not fully available. Phylogenetic data is incomplete, fitness correlations are confounded (aggression and genitalia are correlated), and developmental constraints are difficult to quantify in the wild. This is typical of the empirical strand. The disagreement persists because the evidence required to distinguish adaptation from byproduct is exceptionally demanding. It requires disentangling correlated traits, measuring lifetime fitness in complex social environments, and mapping developmental pathways. Because this evidence is rarely available, biologists fall back on methodological defaults. The adaptationist assumes the cost of birth implies a compensating function (selection). The pluralist assumes the hormonal correlation implies a byproduct (constraint). Thus, the empirical dispute remains underdetermined, allowing both sides to claim the existing data supports their view. The adaptationist points to the stability of the trait despite costs; the pluralist points to the hormonal mechanism. Without the decisive data, the empirical strand bleeds into the methodological one.

  This bleeding reveals the normative strand, the third strength of the critique. This is a disagreement about what counts as a satisfying explanation. For the adaptationist, an explanation is complete when a selective pressure is identified that accounts for the trait's maintenance. The mechanism of selection is the "why." For the critic, this is merely a relabeling unless the developmental "how" is also specified. The charge of the "Just-So Story" is a normative claim: a story that fits the data but lacks independent verification is not an explanation, it is a narrative. This strand is not about the world, but about the standards of the discipline. The adaptationist values predictive power and functional coherence; the critic values historical accuracy and mechanistic detail. Progress here would require a shift in the culture of explanation, perhaps driven by the integration of evolutionary developmental biology (evo-devo). If the field moves toward requiring developmental mechanisms for all evolutionary explanations, the adaptationist "story" becomes insufficient by default. However, this is a change in standards, not a resolution of the biological facts. It is a normative shift that favors the pluralist position by raising the evidential bar for adaptationism.

  The sociological overlay mentioned in the prompt acts as a accelerant for these strands but is not the fuel. The stakes regarding human nature and sociobiology ensured that the debate was never purely technical. If human behavior is largely adaptationist, it implies a certain view of human nature (competitive, optimized); if it is largely spandrel-like, it implies plasticity and historical contingency. This raised the cost of conceding the argument. However, diagnosing the sociological element helps explain the *heat* of the debate, not the *structure*. We can set it aside to focus on the logical impasse, noting only that it prevents the methodological compromises that might otherwise occur.

  So, we have a diagnosis of four strands. The verbal strand is a confusion about trait individuation and the definition of "byproduct." The empirical strand is a factual dispute about frequencies of selection versus constraint, currently underdetermined by data. The methodological strand is a policy dispute about null hypotheses and burden of proof. The normative strand is a philosophical dispute about the criteria for explanation. The impasse exists because participants argue the empirical strand using methodological assumptions, while defending those assumptions with normative claims, all while using terms that shift meaning between verbal definitions.

  What would count as progress for each strand? For the verbal strand, progress requires operational definitions. We need a consensus on how to individuate traits for the purpose of testing. If we agree that a "trait" is the smallest unit of independent genetic variation, we reduce the ambiguity. For the empirical strand, progress requires the specific data types outlined in the hyena case: phylogenetic ordering, independent fitness correlates, and developmental constraint maps. For the methodological strand, progress requires an explicit agreement on heuristics. For example, the field could adopt a "pluralist null" where selection must be proven rather than assumed, or it could adopt a "tiered" approach where selection is the default for complex functional design but constraint is the default for morphological details. For the normative strand, progress requires a broadening of what counts as an explanation, perhaps accepting functional stories as provisional while demanding mechanistic stories for confirmation.

  Is there a single move that would move more than one of these strands? The most promising candidate is the widespread adoption of phylogenetic comparative methods combined with evo-devo data. This move addresses the empirical strand by providing the historical and developmental data needed to distinguish adaptation from constraint. It addresses the verbal strand by forcing precise definitions of traits to map them onto phylogenies. It addresses the methodological strand by providing a rigorous statistical framework for testing adaptation against null models of drift or constraint. If a trait can be shown to evolve in correlation with a specific environmental variable across a phylogeny, controlling for shared ancestry, the adaptationist claim is strengthened. If the trait is conserved despite environmental change, the constraint claim is strengthened.

  However, even this move is unlikely to resolve the debate entirely. The reason lies in the nature of the methodological and normative strands. Even with perfect data, the interpretation of that data depends on the burden of proof. A pluralist can look at a phylogenetic correlation and argue that the developmental constraint made the correlation possible, whereas an adaptationist will argue the selection drove the correlation. The data reduces the space of possible arguments, but it does not eliminate the interpretive layer. Furthermore, the normative disagreement about what constitutes a "satisfying" explanation is resistant to empirical resolution. If one side demands a developmental mechanism and the other accepts a functional model, better data will not bridge that gap; it will only provide more material for each side to interpret according to their standards.

  Therefore, the debate should not be expected to resolve in the sense of one side defeating the other. It is more likely to dissolve through differentiation. As the field matures, the "adaptationism" of the 1970s and the "spandrelism" of the critique will be recognized as addressing different questions. The empirical question (how much is selection?) will be answered locally, trait by trait, with no global verdict. Some traits will be shown to be adaptations, others byproducts, and the global frequency will remain a matter of estimation. The methodological question will likely settle into a pragmatic pluralism where the default depends on the type of trait (e.g., behavioral traits might default to selection, morphological details to constraint). The normative question will likely shift as the tools of biology change; as genetic engineering allows us to test developmental constraints directly, the demand for mechanistic explanation will become standard, rendering the "Just-So Story" objection moot because such stories will no longer be publishable without mechanistic backing.

  The persistence of the debate is thus an artifact of treating four questions as one. When a biologist says "adaptationism is true," they often mean "selection is the only process that creates complex function" (Empirical/Normative). When a critic says "adaptationism is false," they often mean "we should not assume selection without testing" (Methodological). They talk past each other because they are tracking different objects. The adaptationist is tracking the *presence of function*; the pluralist is tracking the *history of form*. Both are real, but they are not mutually exclusive. A trait can be functional (adaptationist) and yet its specific form can be constrained by history (spandrel). The hyena's pseudopenis may be used for signaling (function) even if its origin was hormonal (byproduct). The debate stalls because it forces a binary choice on a spectrum of historical and functional entanglement.

  Returning to the architectural example, we can see why the metaphor was so seductive and why the technical correction matters less than the logical one. The pendentive is necessary for the dome, but the mosaic is not necessary for the pendentive. In biology, the "dome" is the developmental system, the "pendentive" is the trait morphology, and the "mosaic" is the current function. The adaptationist looks at the mosaic and assumes it was painted for that spot. The critic looks at the pendentive and says the shape was determined by the dome. Both are looking at the same wall. The resolution is not to decide who is right about the wall, but to acknowledge that the wall has both a structural history and a decorative use. The debate persists because evolutionary biology has struggled to integrate history (phylogeny/development) and function (ecology/selection) into a single explanatory framework. Until the discipline treats the "spandrel" not as a rival to the "adaptation" but as a dimension of it—a trait's degree of freedom from constraint—the disagreement will remain a permanent background noise.

  The migration of the term to fields like religious studies confirms this diagnostic. When religious belief is called a spandrel, the claim is rarely that religion has *no* function, but that its existence is not *explained* by its function. It is a claim about explanatory priority. This mirrors the biological dispute. The adaptationist wants to explain the trait by its utility; the critic wants to explain the trait by its origin. These are different explanatory projects. The impasse is the result of insisting that one project invalidates the other.

  In conclusion, the diagnosis of the adaptationism debate is that it is a category error. It treats a methodological heuristic as an empirical hypothesis, and an empirical frequency claim as a normative standard. The architectural founding example survives the technical critique because the logical point about structural constraint remains valid, even if the masonry was misidentified. The empirical strand is settleable in principle but requires data (like the hyena case) that is difficult to obtain, leading to underdetermination. The methodological and normative strands are not settleable by data, but by convention and philosophical agreement. Progress will not come from a decisive experiment that proves adaptationism true or false, but from disentangling the strands. If the field can agree that "adaptation" refers to current utility, "spandrel" refers to historical origin, and "constraint" refers to developmental limits, then a trait can be all three simultaneously. The debate will resolve not when one side wins, but when the question "Is it an adaptation or a spandrel?" is recognized as ill-posed. The single move that would accelerate this is the rigorous integration of evo-devo into evolutionary explanation, which forces the historical and mechanistic dimensions into the same model as the functional dimension. Until then, the spandrel will remain a necessary critique of a dogma that no one admits to holding, and adaptationism will remain the default practice of a field that claims to be pluralist. The stalemate is not a failure of science, but a symptom of the complexity of explaining historical systems where function, history, and structure are inextricably woven.
