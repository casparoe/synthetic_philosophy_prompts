answer: |-
  This is a sharp reading of *Principia Ethica*, and your intuition that Moore's two great goods are deeply connected is well-founded. Many commentators argue that Moore treats personal affection as a specialized, higher-order form of aesthetic appreciation. Your snag regarding the method of isolation and organic unities is the crux of the matter, but it stems from a slight misunderstanding of what the isolation method is designed to do versus what the principle of organic unities explains.

  Here is where your reading is coherent, where it's interesting, and where the confusion lies.

  **1. The Method of Isolation vs. Organic Unities**
  Your worry is that if you isolate "personal affection," you get one-sided love, not mutual friendship, so the method fails to capture the value of friendship. Actually, Moore would say the method is working exactly as intended. The method of isolation is a test for *necessary* intrinsic value, not a measure of *maximal* value. It asks: "Does this state of mind have any value at all if it exists alone?" Moore's answer is yes; even unrequited love has intrinsic value because it involves a consciousness directed at a worthy object.

  However, you are correct that friendship is an organic unity. Moore explicitly argues that the value of a whole is not simply the sum of the values of its parts. A world with two people mutually loving each other contains more value than the sum of two isolated worlds where each loves the other unrequitedly. The reciprocity creates a new, complex whole that generates additional value. So, the method of isolation doesn't fail; it identifies the base units of value (the individual states of affection), while the principle of organic unities explains why combining them (friendship) yields a higher good. You don't need to choose between them; they do different jobs in his system.

  **2. Aesthetic Appreciation vs. Personal Affection**
  Your thesis that friendship is "aesthetic appreciation of character plus reciprocity" is a very Moorean move. Moore generally treats the intrinsic good as a specific type of consciousness: a mind apprehending a valuable object. Whether the object is a landscape or a person's character, the *structure* of the good is the same (consciousness + object).

  The difference lies in the complexity of the object. A person's character is a more complex, dynamic object than a landscape, and crucially, it is itself conscious. When you appreciate a person, you are appreciating a consciousness that can appreciate you back. This loops back to your reciprocity point. The "beauty" of a character is arguably the same *kind* of quality as the beauty of a landscape (both are objects of appreciation), but the former allows for the organic unity of mutual recognition, which the latter does not.

  **3. Where You Are Confused**
  Your confusion arises from expecting the method of isolation to validate the *whole* of friendship in one go. It isn't built for that. It is a reductionist tool meant to strip away extraneous consequences to find the atomic units of value. If you try to isolate "friendship" as a mutual relationship, you are actually isolating a complex whole, not a simple part. Moore would advise you to isolate the mental state of affection first (which passes the test), and then use organic unity to show why the mutual instantiation is superior.

  Your argument is interesting because it challenges the dualism in Moore's list of goods. If friendship is just aesthetic appreciation of a conscious object plus reciprocity, then Moore really only has one fundamental good: the appreciation of beauty, with friendship being the supreme instance of it. This simplifies his ethics considerably.

  **4. Coherence Check**
  Your reading is coherent provided you accept that Moore allows for degrees of value within organic unities. You don't need to claim isolation "fails." Instead, claim that isolation reveals the *substrate* of friendship (affectionate consciousness), while organic unity explains its *supremacy* (reciprocity). This keeps you faithful to Moore's text while pushing his synthesis further than he explicitly did.

  Verdict: Your argument holds if you treat the method of isolation as identifying the base units of value and organic unity as explaining why reciprocity amplifies that value into the higher good of friendship.
