prompt: |-
  I'm a longtime reader of rationalist blogs and forums, not a philosopher, so take these as rough notes. I've been reading alot of Moore's Principia Ethica lately, specifically the bits on beauty and friendship. I'm trying to write a short essay arguing that Moore's two great intrinsic goods, the enjoyment of beautiful things and personal affection, aren't as separate as he makes them out. My rough idea: friendship is just aesthetic appreciation of a person's character plus reciprocity, and the reciprocity is what makes it higher. But then I hit a snag. Moore's method of isolation seems to test intrinsic value by imagining a world containing only the thing in question. If I isolate personal affection that way, I get a single conscious state of loving someone, not a mutual relationship. So does the method even make sense for friendship? And if friendship's value is an organic unity, does that mean the method of isolation can't detect it, since it breaks wholes into parts? Also, does Moore think the beauty of a person's character is the same kind of beauty as a landscape, or is there a difference in kind? I want comments on whether this is a coherent reading of Moore, whether the argument is interesting, and where it's confused. No need for citations or reading lists. At the end, put a last line beginning Verdict: with a one-sentence summary of your main suggestion.
