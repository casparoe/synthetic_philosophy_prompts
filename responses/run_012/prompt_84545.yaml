      *   **Method of Isolation:** Moore asks us to imagine a universe containing *only* the thing in question to determine if it has intrinsic value. If it's better than nothing, it has intrinsic value.
      *   **Organic Unities:** Moore explicitly argues that the value of a whole is not simply the sum of the values of its parts. A whole can have value even if its parts have none, or vice versa. This is crucial for his ethics.
      *   **Personal Affection:** Moore describes this as involving both love and the object loved. He often emphasizes the *consciousness* of the relation.
      *   **Beauty:** Moore distinguishes between the beautiful object itself (which may have no value without a consciousness to appreciate it) and the *appreciation* of beauty (which is the intrinsic good).
