  Each term is one; the sum will not compose,
  And infinite wealth in theory grows.

  But gold is not the good the mind perceives,
  A logarithmic scale the value cleaves.
  Moral expectation stays within a bound,
  Though mathematical infinity be found.
  No vault can sustain so vast a debt,
  The bankroll breaks before the sun has set.
  So theory halts where reality must end,
  And finite pockets will not extend.

  But switch the signs, and no sum holds.
