prompt: |-
  I cover math and computing for a science magazine, and I'm about six months into reporting a long feature on the idea that simpler explanations are more likely to be true -- the whole line that runs from Solomonoff's universal prior through Kolmogorov complexity to the minimum-description-length machinery that engineers actually use. The reporting was going fine until I sat in on a two-day workshop last month and realized that the people who work on this don't agree about what the field's live problems even are. One person told me the invariance theorem already settles the important philosophical question and that everything since is basically engineering. Another said the framework is dead in the water because it measures simplicity as program length relative to a universal machine, and the choice of machine only buys you an additive constant -- which is fine asymptotically and close to useless when you have a few million bits of data and a finite lifetime, since that constant is where all the interesting action is. A third said the real gap is that these theories treat hypotheses as black boxes: they can rank one program that outputs the data against another program that outputs the data, but they have nothing to say about why a hypothesis with visible structure -- a law, a mechanism, a symmetry -- should beat a lookup table that happens to compress well, which is the thing scientists are actually doing when they say one theory is simpler. And one guy argued that the whole enterprise penalizes the wrong cost: what you should be charging a hypothesis for is how long it takes to run or to test, not how many bits it takes to write down, and once you switch to that the ordering of hypotheses changes.

  So here's what I want from you, and I'd rather have an argument than a survey. Suppose you had three or four strong students with good math and CS backgrounds, two years of their lives, and no obligation to produce anything immediately useful -- which of these open questions, or one I haven't listed, should they actually go after, and in what order? Tell me which questions are upstream of which (does the finite-data/constant problem have to be settled before the black-box problem is even well posed, or can they be worked independently?), which ones are tractable in two years by people who aren't going to reinvent measure theory, and which ones would actually change something outside the field -- engineering practice, how ML people think about regularization, what philosophers of science should be saying about simplicity. I also want to know what would move an item up or down your list: a result, a counterexample, an argument that some of this is a pseudo-problem in disguise.

  The reason I care about the ranking and not just a catalog is that the piece has to have a spine, and right now I can't tell whether the honest story is "the theory works and we're filling in details," "the theory is elegant and empirically empty," or "the theory was aimed at the wrong target from the start" -- those are three completely different articles, and they point me at different people to interview. So please defend the order, be explicit about the criteria you're using, and flag any place where you think my four workshop complaints are secretly the same complaint wearing different hats. Skip the citations and the reading list -- I can't check any of it from where I'm sitting and it won't help me decide what the piece is about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science journalist (math/computing beat), 6 months into a long feature on Occam's Razor/Solomonoff/Kolmogorov/MDL.
      *   **Context:** Attended a workshop, realized deep disagreement among experts about the field's core problems.
      *   **The Conflict:** Four distinct viewpoints encountered:
          1.  *Done Deal:* Invariance theorem settles philosophy; rest is engineering.
          2.  *Constant Problem:* Additive constants matter in finite data/finite time; theory is asymptotically useless.
          3.  *Black Box Problem:* Program length $\neq$ scientific simplicity (laws/symmetries vs. lookup tables).
          4.  *Computational Cost:* Should penalize runtime/testability, not just description length.
      5.  **The Task:** Act as an advisor. Propose a research agenda for 3-4 strong students over 2 years. Rank the problems. Explain dependencies (upstream/downstream). Assess tractability. Assess real-world impact. Explain what would change the ranking.
      6.  **Constraint:** No citations/reading lists. Argumentative tone preferred over survey. Need to help the journalist find the "spine" of their story (Is it "works," "elegant but empty," or "wrong target"?).
      7.  **Key Insight Needed:** Are these four complaints distinct, or are they manifestations of a deeper single issue?

  2.  **Deconstruct the Four Complaints:**
      *   *Complaint 1 (Invariance is enough):* This is the orthodox Solomonoff view. $K(x)$ is invariant up to a constant $C$. For infinite data, $C$ doesn't matter.
      *   *Complaint 2 (The Constant Matters):* This is the "Finite Data" critique. In practice, $N$ is finite. If $C$ is large (depending on the Universal Turing Machine choice), it swamps the signal. This attacks the *applicability* of the theory.
      *   *Complaint 3 (Black Box/Structure):* This is the "Semantic" critique. A compressed lookup table has low Kolmogorov complexity but isn't a "law." Science wants *structure*, not just compression. This attacks the *definition of simplicity*.
      *   *Complaint 4 (Computational Cost):* This is the "Resource" critique. Solomonoff induction is uncomputable. Even approximations ignore runtime. A theory that takes $10^{100}$ years to predict is useless. This attacks the *metric of cost*.

  3.  **Synthesize and Rank (The "Spine" Strategy):**
      *   *Hypothesis:* These aren't four separate problems. They are layers of the same fundamental mismatch between *idealized induction* and *embedded agency*.
      *   *Ranking Logic:*
          *   If the metric is wrong (Complaint 4), the rest doesn't matter.
          *   If the definition of "hypothesis" is wrong (Complaint 3), the metric applies to the wrong objects.
          *   If the constants swamp the signal (Complaint 2), the asymptotic guarantees (Complaint 1) are irrelevant.
      *   *Proposed Order:*
          1.  **Computational Cost (Complaint 4):** This is the most upstream. If we can't compute it or it takes too long, the theory is physically irrelevant.
          2.  **Structure vs. Compression (Complaint 3):** Once we accept resource bounds, we need to define what counts as a "good" hypothesis within those bounds.
          3.  **The Constant/Finite Data (Complaint 2):** This is a parameter tuning problem within the chosen framework.
          4.  **Invariance/Philosophy (Complaint 1):** This is the baseline to be debunked or refined, not a research target itself.

      *   *Wait, let's refine.* The journalist needs a narrative.
      *   *Narrative Arc:* The theory (Solomonoff) assumes a "God's eye view" (infinite time, infinite data, arbitrary UTM). Real science is done by embedded agents (finite time, finite data, specific cognitive architecture).
      *   *Revised Ranking for 2-Year Student Project:*
          1.  **Resource-Bounded Simplicity (Complaint 4 + 2):** Combine runtime and finite data. This is the most tractable and impactful for ML.
          2.  **Structural Priors (Complaint 3):** How to encode "law-likeness" rather than just compression.
          3.  **The Constant Problem:** Actually part of #1.
      *   *Wait, the prompt asks for dependencies.*
      *   *Dependency:* You can't solve the "Constant" problem (2) without fixing the "Metric" problem (4). You can't solve the "Black Box" problem (3) without fixing the "Metric" problem (4).
      *   *So, Metric (Runtime/Resource) is the root.*

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the journalist's predicament. The "spine" is likely "The theory was aimed at the wrong target (God vs. Scientist)."
      *   *The Unifying Insight:* The four complaints are actually one complaint: **Solomonoff Induction assumes a disembodied oracle, but science is done by embedded agents.**
          *   Constant problem = Embodiment (your specific machine matters).
          *   Black box = Embodiment (your cognitive structure matters).
          *   Runtime = Embodiment (your time/energy matters).
          *   Invariance = The denial of embodiment.

      *   *The Research Agenda (2 Years, 4 Students):*
          *   **Priority 1: Resource-Bounded Kolmogorov Complexity (The "Runtime" Critique).**
              *   *Why:* It's the gatekeeper. If a hypothesis is short but takes a billion years to verify, it's not science.
              *   *Tractability:* High. Connects to complexity classes (P, NP).
              *   *Impact:* High for ML (regularization needs to account for training/inference cost).
          *   **Priority 2: Structural Priors / "Lawfulness" (The "Black Box" Critique).**
              *   *Why:* Distinguishing a formula from a lookup table.
              *   *Tractability:* Medium. Requires defining "structure" formally (maybe via symmetries or causal graphs).
              *   *Impact:* High for Philosophy of Science.
          *   **Priority 3: The Constant Problem (Finite Data).**
              *   *Why:* It's the practical blocker.
              *   *Tractability:* Low (hard to prove bounds), but empirical work is doable.
              *   *Relation:* Downstream of #1. If you fix the machine (resource bounds), the constant becomes less arbitrary.
          *   **Priority 4: Invariance Theorem.**
              *   *Verdict:* Don't touch. It's mathematically true but scientifically irrelevant.

      *   *Dependencies:* #1 is upstream of #2 and #3. You need to know *what* you are measuring (runtime) before you worry about *how much* (constants) or *which objects* (structure).
      *   *What changes the ranking?*
          *   If someone proves resource-bounded simplicity is undecidable in a way that kills it entirely -> Move to #2.
          *   If Deep Learning empirically solves the lookup table problem without explicit structural priors -> #2 drops.

  5.  **Refining the Tone:**
      *   Needs to be punchy, authoritative, slightly provocative (it's an argument, not a survey).
      *   Avoid jargon where possible, or explain it quickly.
      *   Focus on the *story* the journalist should write.

  6.  **Final Polish:**
      *   Check against constraints: No citations. Explicit criteria. Flagging if complaints are the same.
      *   *Self-Correction on "Same Complaint":* I need to be explicit that Complaints 2, 3, and 4 are all symptoms of the "Disembodied Oracle" fallacy. Complaint 1 is the defense of the Oracle.
      *   *Story Spine:* The article should argue that the field is transitioning from "Universal Induction" (God's view) to "Bounded Induction" (Scientist's view).

  7.  **Final Output Structure:**
      *   **The Verdict:** The "Spine" of the article.
      *   **The Unifying Diagnosis:** Why the four complaints are actually one.
      *   **The Research Agenda:** Ranked by priority, tractability, and impact.
      *   **Dependencies:** Upstream/Downstream logic.
      *   **Trigger Points:** What would change the mind.

  *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the math. Keep it focused on the *narrative* value for the journalist. The journalist needs to know who to interview and what the conflict *means*. The research agenda is a proxy for "where is the field actually going?"

  *(Refining the "Constant" argument)*: The constant isn't just a number; it's the prior bias of the observer. That's a crucial philosophical hook for the journalist.

  *(Refining the "Black Box" argument)*: This is about *interpretability* vs. *compression*. That's a hot topic in AI safety/alignment. Connect it there for impact.

