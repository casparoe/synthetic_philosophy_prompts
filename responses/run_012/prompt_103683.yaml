      Actually, Agenda 3 (Within-person) is a clever way to sidestep the WEIRD problem. If within-person variation (in WEIRD samples) shows the same structure as cross-cultural variation, then cross-cultural data might be redundant. Or, if within-person variation shows stability despite framing, it suggests a robust core. This makes Agenda 3 the highest leverage for a low-budget foundation.

      *Final Plan:*
      1.  **Priority 1:** Semantic Stability & Framing (Agenda 3).
      2.  **Priority 2:** The Epistemic Weight of Disagreement (Agenda 1).
