  **To the President and Council of the Royal Society**
  **Date:** 14 November 1673
  **Re:** Manuscript Appendix on Geometrical Demonstrations by Mr. Thomas Hobbes

  Having reviewed the submitted tract, wherein Mr. Hobbes appends a fresh solution to the quadrature of the circle to his broader discourse on law and sovereignty, I submit the following findings for the Council's consideration. The author's renown in civil philosophy is undisputed; his theories on obedience have provided considerable stability to the realm. However, this manuscript insists that the very same demonstrative method, proceeding from definitions, secures his political conclusions with the certainty of geometry. It is upon this linkage that the assessment turns.

  1.  **The Claim of Certainty:** Mr. Hobbes maintains that he has finally squared the circle. He asserts that this proof is demonstrative, derived strictly from definitions, and therefore admits of no contradiction. He posits that any dissent arises not from error in the proof, but from a failure in the dissenter to comprehend the definitions provided.
  2.  **Procedural History:** This is not the first such claim. Since the publication of *De Corpore* in 1655, the author has offered multiple variations of this proof. Each has been examined by Dr. John Wallis, Savilian Professor of Geometry at Oxford. Each has been found wanting. Rather than correcting the calculation, the author has typically responded by adjusting the definitions upon which the calculation rests. Thus, demonstration is treated as a rank one claims rather than a result one earns.
  3.  **The Duration of Dispute:** The author's method was advertised as a means to end dispute by establishing incontrovertible truths. Yet, this specific geometrical question has now produced two decades of pamphlet warfare. A technique intended to silence controversy has, in practice, become a perpetual engine for it. The Committee notes the exhaustion of several Fellows who have been drawn into this quarrel against their will.
  4.  **Political Implications:** Mr. Hobbes argues that if geometry is certain, his political philosophy is secure. He seeks to end civil war by making politics demonstrable. However, by tying the stability of sovereignty to a geometrical problem that remains unresolved despite his assurances, he inadvertently undermines his own premise. If the method fails in circles, the Fellows fear it may fail in commonwealths. The author's eminence in politics keeps a settled mathematical question artificially alive, which risks dragging the certainty of government into the mud of mathematical squabble.
  5.  **Experimental Philosophy:** The author opposes the Society's experimental philosophy, preferring deduction from first principles. Yet, where experiment allows for correction, the author's deductive method allows only for assertion. The Society cannot endorse a method that refuses to acknowledge error when pointed out by competent judges such as Dr. Wallis.

  **Recommendation:**
  It is the assessor's view that the Society cannot publish this manuscript. To do so would be to validate a method that produces conflict rather than peace. We must respect Mr. Hobbes's contributions to civil philosophy, but we cannot allow his desire for geometrical certainty to compromise the Society's reputation for truth. The manuscript should be returned with thanks, and the Council is advised to cease correspondence on the quadrature of the circle. We have a society to build, and we cannot build it on a circle that cannot be squared.

  **Assessor:** J. Wilkins (Bishop of Chester)
