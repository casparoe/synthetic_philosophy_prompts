answer: |-
  # Activity Design: The Masked Search

  ## 1. Concept Overview
  **Title:** The Masked Search
  **Core Mechanism:** A sequential search task where students reveal numbers one-by-one from a fixed list, deciding when to stop. The distribution of numbers changes between rounds without explicit warning, while the "cost" of searching remains ambiguous (time/psychological only).
  **Goal:** To generate behavioral data showing fixed acceptance thresholds that drift based on past success/failure (history) rather than optimal calculation, and which succeed or fail based entirely on the hidden environment (distribution).

  ## 2. Materials & Preparation
  **You need to prepare:**
  1.  **Search Sheets (36 total):** 3 versions (Round 1, 2, 3). 12 copies of each.
      *   *Format:* A4 paper. A column of 10 numbers, printed large.
      *   *Round 1 (High):* Numbers drawn from Uniform[80, 100].
      *   *Round 2 (Low):* Numbers drawn from Uniform[30, 50].
      *   *Round 3 (High):* Same distribution as Round 1 (to test recovery).
      *   *Privacy:* Cover the numbers with a blank "Mask Sheet" (a simple piece of card or paper) that students slide down to reveal one number at a time. *Do not fold flaps; it takes too long. Use the slider method.*
  2.  **Decision Slips (36 total):** Small slips for each round where they record:
      *   *Pre-Round:* "What is your Target Number for this round?"
      *   *Post-Round:* "Which card did you stop on (1-10)?" "What was the value?" "Why did you stop? (One sentence)."
  3.  **Incentive:** Announce that the **Top 3 Aggregate Scores** across all three rounds will receive a "Quiz Drop" token (valid for any future quiz in the course). This is high-value, zero-cost to you.

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out Round 1 packets. Explain rules: "Reveal one number at a time. Keep one or discard. If you reach 10, you must keep 10. Maximize your score. No talking." Announce the Quiz Drop incentive. |
  | **05-20** | **Round 1** | Students execute search. (Allow 5 mins). Collect Decision Slips. **Do not return sheets yet.** |
  | **20-25** | **Feedback 1** | Announce: "Round 1 is complete. The top score was [e.g., 98]. The class average was [e.g., 92]." (Highlight high performance). Hand out Round 2 packets. |
  | **25-40** | **Round 2** | Students execute search. (Distribution is now Low). Collect Decision Slips. |
  | **40-45** | **Feedback 2** | Announce: "Round 2 was difficult. Top score was [e.g., 48]. Average was [e.g., 35]." Hand out Round 3 packets. |
  | **45-60** | **Round 3** | Students execute search. (Distribution returns to High). Collect all materials. |
  | **60-90** | **Debrief** | Data analysis on board. Introduce concepts. Challenge optimization rescue. |

  ## 4. The Debrief Script (Critical Path)
  *Do not use the forbidden words (Satisficing, Bounded Rationality, Simon) until minute 80.*

  **Part A: The Threshold (60-70 mins)**
  1.  **Plot the Data:** Draw a scatter plot on the board. X-axis = Card Position (1-10). Y-axis = Accepted Value. Plot every student's decision from Round 1.
  2.  **Ask:** "Look at the stops. If you were calculating the Expected Value of the next card minus the cost of waiting, your 'minimum acceptable number' should drop as you get closer to Card 10. Why? Because you have fewer chances left."
  3.  **Reveal:** "Did your target drop? Look at your Decision Slips." (Most will have written a fixed target, e.g., "I wanted a 90" on Card 2 and Card 9).
  4.  **Point:** "You didn't optimize position. You optimized for a *number*. You stopped when the world met your demand, not when the math said stop."

  **Part B: The Drift (70-75 mins)**
  1.  **Compare Targets:** Ask students to shout out their "Target Number" for Round 1 vs. Round 2.
  2.  **Observation:** Round 1 Targets will be high (e.g., 90). Round 2 Targets will likely still be high initially, then crash.
  3.  **Point:** "Your threshold drifted. Why? The math of the search didn't change (10 cards). The only thing that changed was your *history*. You wanted 90 in Round 2 because you got 90 in Round 1. You were tracking your own past, not the current opportunity structure."

  **Part C: The Environment (75-80 mins)**
  1.  **Compare Outcomes:** "The strategy 'Stop if > 85' made you look like geniuses in Round 1. It made you look incompetent in Round 2."
  2.  **Point:** "The verdict on your rationality changes with the environment. In Round 1, satisficing was efficient. In Round 2, it was ruinous. This isn't about laziness; it's about fit."

  **Part D: The Optimization Rescue (80-85 mins)**
  1.  **The Challenge:** "An Expected Utility theorist in the back is saying: 'They *were* optimizing. They just included the cognitive cost of calculation. It was too hard to compute EV, so they used a heuristic.'"
  2.  **The Counter:** "Was the math hard? It was 10 numbers. You could have calculated the mean in 30 seconds. You didn't. You didn't even try. You didn't weigh the cost of thinking; you *ignored* the thinking. There is a difference between 'thinking is expensive' and 'I am not playing that game.'"
  3.  **The Reveal:** "Herbert Simon called this **Satisficing**. You didn't maximize. You sought a level that was *good enough* based on your aspirations, which drifted based on experience." (Write terms on board now).

  **Part E: Closing (85-90 mins)**
  *   Summarize: Rationality is not a property of the person, but the person-in-an-environment.
  *   Collect Quiz Drop tokens for the top 3 scorers.

  ## 5. Limitation Note (The "Frank Note")
  **The feature this activity cannot reproduce:**
  The activity cannot reproduce the *neural experience of cognitive load*.
  In the debrief, when you argue against the "optimization with search costs" rescue, you are asserting that they *could* have calculated but *chose* not to. A hardline theorist will argue that the *feeling* of "this is too hard to calculate" *is* the cost signal.
  The activity forces them to use a heuristic, but it cannot prove they didn't implicitly value that heuristic as "optimal given my brain's constraints."
  **How to supply it:** You must explicitly state in the debrief: "The calculation required here was trivial (averaging 10 numbers). If you were optimizing, you would have done the math. The fact that you didn't suggests the mechanism isn't 'costly optimization,' it's 'non-optimizing.' I am asking you to trust your introspection: Did you feel like you were weighing costs, or did you feel like you were hunting for a goal?"

  ## 6. Troubleshooting: What Will Go Wrong
  **1. The Peeker:**
  *   *Risk:* A student lifts the mask to see Card 5 before rejecting Card 1.
  *   *Fix:* Announce at the start: "This relies on honor. If you peek, you disqualify yourself from the Quiz Drop. I will know if your data is impossible." (e.g., if they reject a 98 to find a 99).
  *   *Handling:* If it happens, use it in debrief. "One person optimized by cheating. The rest satisficed. Who got the prize?"

  **2. The Cynic (The "Game Player"):**
  *   *Risk:* A student realizes Round 2 is impossible and writes down random numbers to protest.
  *   *Fix:* Walk around during Round 2. If you see disengagement, quietly say: "The distribution changes. Adapt."
  *   *Handling:* In debrief, separate their data. "This student opted out. The rest of us are stuck with our brains."

  **3. The Optimization Rescue (The "Micro Major"):**
  *   *Risk:* A student insists, "My target dropped from 90 to 40. That's Bayesian updating. I'm still an EU maximizer."
  *   *Fix:* Check their *Decision Slip* timing. "You wrote 'Target 90' *before* you saw any cards in Round 2. You didn't update on data; you updated on hope. That's aspiration drift, not Bayesian updating."
  *   *Handling:* Acknowledge the point. "Bayesian updating requires a prior. Did you have a prior for Round 2? No. You had a *feeling*. That's the gap."

  **4. Time Overrun:**
  *   *Risk:* The debrief eats into the next class or runs late.
  *   *Fix:* Hard stop at minute 80 for the "Reveal." If the debate is good, cut the "Closing" and assign the reflection as a 1-page memo for next time.

  ## 7. Rules for the Students (Printable Handout)
  1.  **Do not look ahead.** Use the mask to reveal only the current number.
  2.  **Record your Target.** Before revealing Card 1, write down the number you *hope* to get.
  3.  **Stop once.** When you keep a number, the round is over.
  4.  **No talking.** Until the debrief.
  5.  **Incentive:** Top 3 total points win the Quiz Drop.
