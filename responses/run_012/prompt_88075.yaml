  2.  **Deconstruct the Core Concepts:**
      *   *Threshold Stopping:* Students need to decide when to stop searching for a better option based on "good enough," not "best possible."
      *   *Threshold Drift:* Their definition of "good enough" needs to change based on recent experience (adaptation level), not just the objective payoff structure.
      *   *Environment Dependence:* The strategy needs to work well in one setup and poorly in another, showing it's not about "laziness" but fit.
      *   *Resistance to Optimization:* It must be hard to claim they were calculating marginal search costs vs. marginal benefits. The decision needs to feel intuitive/heuristic.

