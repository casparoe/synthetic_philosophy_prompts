answer: |-
  This is a classic move in the philosophy of statistics, and your intuition is spot on: the slogan "probability doesn't exist" is a philosophical Swiss Army knife. It cuts through different problems depending on which blade you use, but if you wave it around without specifying the blade, you end up slicing the wrong things.

  Your professor was likely conflating **ontology** (what exists in the world) with **epistemology** (what we know about the world).

  Here is the menu of interpretations, ordered from "boringly true" to "metaphysically explosive." You can bring this to your reading group to diagnose exactly which claim is being made.

  ---

  ### Menu Item 1: The "Map vs. Territory" Claim
  **The Claim:** Probability is a mathematical abstraction, not a physical substance. You can find a rock in the world, but you cannot find a "0.5" in the world.
  *   **Radicalness:** Trivial.
  *   **(a) Is it defensible?** Yes, uncontroversially. Numbers, models, and distributions are tools we use to describe reality, not bricks in the wall of reality. Saying "probability doesn't exist" here is like saying "gravity doesn't exist, it's just a model." Well, the *equation* isn't physical, but the *phenomenon* is.
  *   **(b) Does it prove no single-case fact?** **No.** This is a category error. Just because "temperature" is a statistical aggregate of molecular kinetic energy doesn't mean a specific cup of coffee doesn't have a specific temperature *right now*. Similarly, a model can map to a single case even if the model itself is abstract.
  *   **Verdict:** True, but irrelevant to the debate. It shuts down reification (treating concepts as things), but it doesn't prove the single case is undefined.

  ### Menu Item 2: The Strict Frequentist Claim
  **The Claim:** Probability *is defined* as long-run relative frequency. Therefore, an event that happens only once (or a specific tomorrow) literally has no probability, because there is no long run.
  *   **Radicalness:** Moderate (Standard Stats 101 dogma).
  *   **(a) Is it defensible?** Internally, yes. This is the Von Mises definition. If you define probability strictly as $\lim_{n\to\infty} \frac{k}{n}$, then $n=1$ is undefined.
  *   **(b) Does it prove no single-case fact?** **Yes, by definition.** It asserts that asking for the probability of a single event is like asking for the "average height" of a single person. It's a grammatical mistake, not a mystery.
  *   **Verdict:** This is the most likely candidate for a traditional stats professor. However, it is philosophically costly. It means we cannot assign probabilities to unique historical events (e.g., "probability the dinosaurs were killed by an asteroid"), which feels counterintuitive.

  ### Menu Item 3: The Epistemic/Subjectivist Claim
  **The Claim:** Probability is a measure of an observer's ignorance or degree of belief, not a property of the object. The coin doesn't have a probability; *you* have a probability assignment based on your information.
  *   **Radicalness:** High (Shifts reality to the mind).
  *   **(a) Is it defensible?** Yes, this is the Bayesian interpretation. It solves the single-case problem beautifully (the probability is the rational degree of belief given current evidence).
  *   **(b) Does it prove no single-case fact?** **Yes, but differently.** It says there is no fact of the matter *in the coin*, but there **is** a fact of the matter *about your brain*. If you say "the probability is 50%," the truth claim isn't about the coin, it's about whether your belief state is coherent with your information.
  *   **Verdict:** When your professor said, "it's just in your head," this is the blade he was using. However, Bayesians usually say probability *does* exist (as a logical relation or mental state), so the slogan "doesn't exist" is slightly misleading here.

  ### Menu Item 4: The Hard Determinist / Propensity Denier Claim
  **The Claim:** There are no physical "propensities" or "chances" in nature. If we knew all initial conditions (force, wind, friction), the coin flip is 100% determined. Therefore, "chance" is just a word for "we don't know the variables."
  *   **Radicalness:** Very High (Metaphysical).
  *   **(a) Is it defensible?** Controversial. It holds up in classical mechanics but crashes into Quantum Mechanics (where many physicists argue probability *is* ontic/fundamental). For coins and dice, however, it is physically robust.
  *   **(b) Does it prove no single-case fact?** **Yes.** It claims the "true probability" is either 0 or 1, and anything in between is a confession of ignorance. There is no "fact of the matter" about a 50% chance because the 50% is fake; the reality is deterministic.
  *   **Verdict:** This is the "wild" reading. It denies the existence of objective randomness. If your professor is a determinist, this is his deep reason.

  ### Menu Item 5: The Eliminativist Claim
  **The Claim:** Probability is a useless or false concept, like "phlogiston" or "witchcraft." We should stop using it entirely.
  *   **Radicalness:** Extreme.
  *   **(a) Is it defensible?** **No.** Even if probability is subjective or frequentist, it is undeniably *useful* and predictive. Denying its existence in this sense is pragmatically false.
  *   **(b) Does it prove no single-case fact?** Yes, because nothing has a probability.
  *   **Verdict:** Your professor definitely didn't mean this, or he wouldn't be teaching statistics.

  ---

  ### The Collapses (Where the lines blur)

  1.  **Frequentism collapses into Determinism (Menu 2 & 4):** If you are a Strict Frequentist, you often implicitly assume the world is deterministic. If the world were fundamentally random, a single case *would* have a propensity, making the Frequentist restriction feel arbitrary.
  2.  **Subjectivism collapses into Map/Territory (Menu 3 & 1):** If probability is just belief, then it is clearly a feature of the "Map" (mind), not the "Territory" (world). These two often get bundled together as "Probability isn't physical."
  3.  **The "Fact of the Matter" Trap:** The debate often stalls because people mean different things by "fact."
      *   **Frequentist:** Fact = Physical Frequency. (Single case: No fact).
      *   **Bayesian:** Fact = Rational Coherence. (Single case: Yes fact).
      *   **Propensity:** Fact = Physical Disposition. (Single case: Yes fact).

  ### Which one did he probably mean?

  Based on the phrase "it's just in your head" combined with "no fact of the matter," your professor was likely mixing **Menu 2 (Frequentism)** and **Menu 3 (Subjectivism)**.

  He was making an **Instrumentalist** argument:
  > *"Probability is a tool for managing uncertainty (Subjective), defined by long-run performance (Frequentist). It is not a physical fluid inside the coin (Propensity). Therefore, asking for the 'true' probability of a single event is asking for a physical property that isn't there."*

  He is right that there is no **physical propensity** (Menu 4) in a coin flip (which is deterministic chaos). He is right that there is no **frequency** (Menu 2) for a single flip. But he is wrong if he implies there is no **rational degree of belief** (Menu 3) assignable to that flip.

  ### How to use this in your reading group

  When someone says "Probability doesn't exist," stop the conversation and ask:

  1.  **"Are you saying it's not a physical object?"** (Menu 1: Trivial, agree and move on).
  2.  **"Are you saying single events can't have frequencies?"** (Menu 2: True, but limits the definition of probability).
  3.  **"Are you saying chance is just ignorance?"** (Menu 4: A metaphysical claim about determinism).
  4.  **"Or are you saying probability is only a measure of belief?"** (Menu 3: If so, probability *does* exist, just in the agent, not the world).

  **The Kill Shot:**
  If they insist there is "no fact of the matter," ask them: *"If I offer you a bet on that single coin flip, are you indifferent to the odds?"*
  If they say "No, I'd want 1:1 odds," then they admit there is a **fact of the matter about their rational expectation**, even if there isn't a physical fact about the coin. That usually forces them to admit probability exists *somewhere*, even if not in the object.
