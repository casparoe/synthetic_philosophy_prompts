  13. **Final Polish:** Ensure tone is respectful to both the EMT (practical stakes) and the Philosopher (theoretical nuance). Avoid jargon where possible, or explain it. (e.g., explain "aggregation").

  *(Self-Correction during drafting)*: I need to be careful not to say "Taurek says X." Taurek's view is specific. The roommate *says* her dissertation is on Taurek, but her views deviate (she saves the 5). I need to point out that she is likely *critiquing* or *modifying* Taurek, not adopting him wholesale. Taurek famously argues *against* saving the 5 as a requirement. She saves the 5. So she is likely a "Moderate Aggregationist" using Taurek as a foil. I must make this distinction clear.

  *(Refining the "Settled" part)*: It is settled that there is *no* consensus. It is settled that most people intuitively save the 5. It is contested *why*.

