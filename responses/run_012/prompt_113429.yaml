answer: |-
  Your distinction between a rule that applies to you and one that disposes of you is seductive, but it collapses under the weight of political reality. Every binding rule disposes of someone's fate by altering the landscape of choice, yet democracy is not designed to protect us from all consequences of others' choices, only from their authoritative force. The specific wrong of exclusion is not that you are affected, but that you are subjected. Arda's inspectors do not board Bellune's trucks, nor do they fine Bellune's farmers; they coerce the shippers, and the shippers pass the cost along. To treat this economic ripple as equivalent to direct coercion is to claim that anyone whose interests are altered by a policy must have a vote in it, which dissolves the demos into everyone potentially touched by any decision. The democratic claim is that no one should be ruled by another without consent, but being forced to adapt to the regulated choices of a neighbor is not being ruled by them; it is the inevitable condition of living in a world of separate political communities.

  Your proposal for an ad hoc demos breaks precisely where you ask it to hold: in the collision of decisions. If the boundary moves with the stakes, there is no stable subject to bear responsibility for the trade-offs. Who decides whether a given issue is severe enough to trigger the enlarged demos? If the standing demos decides, then they remain the ultimate authority and the enlargement is merely a concession they can revoke, which returns us to a single boundary. If the enlargement is automatic based on affectedness, you face the impossibility of measuring degrees of impact before the decision is made, paralyzing the polity in endless procedural disputes about who gets to vote. A polity that reconstitutes itself with every vote cannot sustain the ongoing relationship of justification that legitimacy requires. When Arda and Bellune collide, there must be a final authority to resolve the conflict, and that authority constitutes the true boundary of the demos; to deny this is not to expand democracy, but to abolish the capacity for decisive collective action altogether.
