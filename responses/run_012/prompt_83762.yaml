answer: |-
  Here is a decision procedure based on the philosophy of **Collective Intentionality** (specifically drawing from Michael Bratman's *Shared Cooperative Activity* and Margaret Gilbert's *Plural Subjects*), adapted for an engineering context.

  It is designed to take 15 minutes. It separates **facts** (what happened) from **values** (what we tolerate).

  ### The "Jointness & Norms" Protocol

  **Inputs:** Incident timeline, Slack/Chat logs, Commit history, Runbook version.
  **Goal:** Determine if the failure was a property of the *group dynamic/system* (Team) or the *individual execution* (Individual).

  #### Phase 1: The Joint Action Test (Philosophy)
  *These questions determine if the actors were philosophically "acting together." If you pass these, it is automatically a Team Failure.*

  **Q1: The "We-Intention" Check**
  *   **Question:** At the start of the action, did the participants share a goal that explicitly required the *other person's* participation to succeed?
  *   **Look for:** "Let's push this together," "You handle DB, I'll handle API," or a shared ticket assigned to multiple owners.
  *   **Pass (Joint):** Yes, the plan was inherently collaborative.
  *   **Fail (Parallel):** No, each person thought they were completing a standalone task.
  *   *Philosophy Note:* This is Bratman's "Shared Intention." Voting the same way (your PM's definition) is not enough; the intention must be interdependent.

  **Q2: The Common Knowledge Check**
  *   **Question:** Did Actor A know that Actor B was acting, and did Actor A know that Actor B *knew* A was acting?
  *   **Look for:** Explicit acknowledgement in chat ("I'm merging now" / "OK"), or a ceremony (Change Approval Board) where presence implies knowledge.
  *   **Pass (Joint):** Yes, there was mutual awareness of the concurrent action.
  *   **Fail (Parallel):** No, they were operating in the dark regarding each other (e.g., silent config edits).
  *   *Philosophy Note:* This is "Common Knowledge." Without this, you have coincidental parallel action, not joint action.

  **Q3: The Interdependence Check**
  *   **Question:** Would the incident have occurred if only *one* of the actors had performed their action?
  *   **Look for:** Collision scenarios (two writes to one file) or chain reactions (Engineer A opens port, Engineer B sends traffic).
  *   **Pass (Joint):** No, the failure required the combination of actions.
  *   **Fail (Individual):** Yes, the action was dangerous on its own (e.g., one person deleting a prod DB).

  ---

  #### Phase 2: The Systemic Norms Test (Policy)
  *If Phase 1 fails (it wasn't a "Joint Action"), you must check if the Team/System authorized the individual action. This addresses your CTO's "process change" requirement.*

  **Q4: The Normative Permission Check**
  *   **Question:** Was the action taken consistent with the team's written or unwritten rules *at the time*?
  *   **Look for:** Runbooks, access controls, deployment windows, past precedents.
  *   **Pass (Team):** Yes, the system allowed/encouraged this (e.g., no lock on config file, deploys allowed on Friday).
  *   **Fail (Individual):** No, the actor violated a known constraint (e.g., bypassed a required check, deployed during a freeze).
  *   *Philosophy Note:* This is Gilbert's "Plural Subjects." If the team norms authorized the move, the team owns the outcome.

  ---

  #### Phase 3: The Decision Matrix

  | Phase 1 (Joint Action) | Phase 2 (Systemic Norms) | **Final Tag** | **Remediation** |
  | :--- | :--- | :--- | :--- |
  | **Pass** (Any Q1-Q3) | (Irrelevant) | **Team Failure** | Change Process/Interface |
  | **Fail** (All Q1-Q3) | **Pass** (Q4) | **Team Failure** | Change Process/Norms |
  | **Fail** (All Q1-Q3) | **Fail** (Q4) | **Individual Slip** | Coaching/Checklist |

  ---

  #### Phase 4: The Values Hand-Off (Where you stop)
  There is one place where this procedure cannot give you a factual answer. You must hand this to a human (you or the Incident Lead).

  **The "Reasonable Expectation" Clause:**
  If Q4 is ambiguous (e.g., "Deploys on Friday weren't banned, but everyone frowned on them"), you must make a values judgment.
  *   **Ask:** "If we tag this 'Individual', are we blaming someone for following a bad culture?"
  *   **If Yes:** Tag **Team Failure**. (Culture is a process).
  *   **If No:** Tag **Individual Slip**. (Personal judgment error).

  *If the Incident Lead overrules you here, they must write the justification. This is the intended safety valve.*

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: Two engineers, independent config edits, checkout down.
  *   **Q1 (We-Intention):** **Fail.** They did not plan to edit together.
  *   **Q2 (Common Knowledge):** **Fail.** Neither knew the other was touching it.
  *   **Q3 (Interdependence):** **Pass.** The outage required both edits to conflict.
  *   **Phase 1 Result:** Not Joint Action (Parallel).
  *   **Q4 (Normative Permission):** **Pass.** The system allowed two people to edit the same file without a lock or notification.
  *   **Final Tag:** **Team Failure.**
  *   **Why:** While not philosophically "joint," the *system* permitted dangerous parallelism. Remediation: File locking or merge checks.

  #### Case 2: On-call team follows wrong runbook, outage worsens.
  *   **Q1 (We-Intention):** **Pass.** They intended to execute the incident response *together* using the runbook as the shared plan.
  *   **Q2 (Common Knowledge):** **Pass.** Everyone knew everyone else was following the same book.
  *   **Q3 (Interdependence):** **Pass.** The worsening required the coordinated execution of the steps.
  *   **Phase 1 Result:** **Joint Action.**
  *   **Final Tag:** **Team Failure.**
  *   **Why:** This is classic Shared Cooperative Activity. The "We" intended the action; the "We" own the error in the plan. Remediation: Fix the runbook.

  #### Case 3: You deploy on Friday, no one told, it breaks.
  *   **Q1 (We-Intention):** **Fail.** You acted alone.
  *   **Q2 (Common Knowledge):** **Fail.** No one knew.
  *   **Q3 (Interdependence):** **Fail.** Your action alone broke it.
  *   **Phase 1 Result:** Not Joint Action.
  *   **Q4 (Normative Permission):** **Pass.** You stated "the company decided anyone can deploy to prod." There was no systemic block.
  *   **Final Tag:** **Team Failure.**
  *   **Why:** This is where the procedure saves you from your suspicion. Philosophically, it's an individual act. But under Q4 (Norms), if the *team policy* allows dangerous actions, the *team* owns the risk.
  *   **The Values Hand-Off:** If there was an unwritten rule "Good engineers don't deploy Friday," but no written block, you must decide: Is violating an unwritten rule an Individual Slip?
      *   *Recommendation:* Tag **Team Failure**. If the company wants to stop Friday deploys, they must change the process (freeze windows), not coach you.

  ---

  ### Where This Will Misfire (Honest Assessment)

  You asked for honesty about where this breaks. Here are the three failure modes:

  **1. The "Hidden Knowledge" Problem (Epistemic Opacity)**
  *   **The Misfire:** Q2 (Common Knowledge) relies on chat logs. If Engineer A knew Engineer B was editing the file because they saw them at the whiteboard, but didn't write it in Slack, the procedure says "Individual/Parallel."
  *   **Impact:** You might tag a Team Failure as Individual because the "knowledge" wasn't documented.
  *   **Fix:** In the 24-hour window, explicitly ask: "Did anyone know about this offline?" If yes, treat as Common Knowledge.

  **2. The "Power Dynamics" Problem (Normative Distortion)**
  *   **The Misfire:** Q4 (Normative Permission) assumes rules apply to everyone. If a Senior Staff Engineer bypasses a check and a Junior gets coached for the same thing, the "Norm" is actually "Senior people can break rules."
  *   **Impact:** You tag a Junior's error as "Individual" because they violated the *written* rule, even though the *real* team norm allows the behavior.
  *   **Fix:** This is a Values Hand-Off. If the actor is junior and the behavior is common among seniors, tag **Team Failure** (Culture issue).

  **3. The "Hindsight Bias" Problem (Outcome vs. Process)**
  *   **The Misfire:** When an outage is severe, people retroactively claim a rule existed ("We never deploy on Fridays!"). When it's minor, they claim it was fine.
  *   **Impact:** Q4 becomes a popularity contest based on how bad the outage was.
  *   **Fix:** Freeze the "Rules" definition at the time of the incident. If the deploy button was green and clickable on Friday, the Norm was "Allowed," regardless of how angry people are afterwards.

  ### Summary for your CTO
  This procedure distinguishes between **Joint Action** (we did it together) and **Systemic Enablement** (the system let me do it). Both result in a **Team Failure** tag, which aligns with your CTO's goal of "change the process." It only returns **Individual Slip** when a person acts alone, without systemic permission, violating known constraints.

  If the Incident Lead overrules a "Team Failure" tag on Case 3 (Friday Deploy), they are making a **Values Call** (asserting that unwritten cultural norms outweigh written system permissions). Require them to write that down explicitly.
