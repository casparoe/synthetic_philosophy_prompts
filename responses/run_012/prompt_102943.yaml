answer: |-
  # The Story

  The letter arrived on a Tuesday, sealed in wax the color of dried blood. By noon, every adult in the valley had read the same text. There were exactly one thousand of them, living in the shadow of the ridge, isolated enough that the benefactor's offer felt like the only weather system that mattered.

  The terms were plain. The fortune was nine hundred thousand. The guarantee was one thousand. The deadline was Friday at noon.

  Elias stood in the town square, the paper crumpled in his hand. He was a man who built clocks, accustomed to gears that meshed perfectly. Beside him stood Mara, who repaired nets, accustomed to tensions that could snap.

  "Nine hundred," Elias said, looking at the crowd. "If we all claim."

  "And one thousand if we all walk away," Mara replied. She didn't look at the crowd. She looked at the slot in the town hall wall where the claims were to be deposited.

  "It's a loss for everyone if we claim," Elias said. "We are all here. We all read the letter. We are all competent. If I find a reason to claim, you find the same reason. If you find it, everyone finds it. So if I claim, everyone claims. We get nine hundred. But if I refrain, everyone refrains. We get one thousand. Reason dictates we refrain."

  Mara tucked the letter into her pocket. "Reason dictates you get what you can control. You can't control me, Elias. You can't control the baker or the blacksmith. You control only your own hand."

  "But we are alike," Elias insisted. "We are mirrors. If I decide to be rational, I must assume you will be rational too. Rationality leads to refraining. So I must refrain."

  Mara shook her head. "Suppose you are right. Suppose everyone decides to refrain. They all stay home. They all take the guaranteed thousand. Now, look at me. I know everyone is staying home. If I walk to the hall and submit a claim, I get nine hundred thousand. If I stay home, I get one thousand. Would you stay home then? Would you leave nine hundred thousand on the table because of a theory about mirrors?"

  Elias frowned. The arithmetic was undeniable. In a sea of refrainers, a single claimant was a king. "But if everyone thinks like you, everyone claims. Then we all get nine hundred. We are worse off than if we had all trusted the mirror."

  "Then don't think like me," Mara said. "Think for yourself. If you think they will refrain, you must claim. If you think they will claim... well, if all nine hundred and ninety-nine others claim, you get nine hundred if you join them. But if you refrain while they claim, you get one thousand. So if you expect them to claim, you should refrain."

  "So claiming isn't always better," Elias said.

  "No," Mara said. "But refraining is never the best move if you expect anyone else to refrain. It's unstable, Elias. The best outcome for us is that we all do nothing. But the best move for me, if you all do nothing, is to take everything."

  They walked home in silence. The valley felt smaller than it had on Monday. The air was thick with the weight of unspoken calculations.

  On Wednesday, Elias sat in his workshop. He held a gear between his fingers. If he placed it here, the mechanism worked. If he placed it there, it jammed. He thought of the town. If he placed his claim in the box, he was betting that others would not. But he knew they were thinking exactly what he was thinking. They knew the numbers. Nine hundred thousand divided by one thousand is nine hundred. One thousand is greater than nine hundred.

  *Universalize,* he told himself. *If I claim, we all claim.* He imagined the town hall flooded with slips of paper. He imagined the disappointment when the division was made. Nine hundred coins instead of one thousand. A loss of ten percent for the sake of greed. It felt like a defect in the design. A rational agent should not choose a dominated outcome. Universal refraining dominated universal claiming.

  But then he thought of Mara. He thought of the baker. He thought of the silence in the square. Were they really mirrors? Or were they strangers locked in separate rooms? If he refrained, and Mara claimed, she got nine hundred thousand. He got one thousand. She would be wealthy beyond measure; he would be merely comfortable. Could he afford to be the sucker who kept the system honest while someone else broke it?

  Across the valley, Mara sat by her window. She watched the road to the town hall. It was empty.

  She ran the numbers again. If she claimed, and nobody else did, she won. If she claimed, and everyone else did, she lost compared to refraining. But she didn't believe everyone else would claim. People wanted money. They wanted the big prize. The guarantee was a consolation prize. If everyone else was greedy, they would claim. If they claimed, she should refrain. But if everyone else was noble, they would refrain. If they refrained, she should claim.

  "Noble people get exploited," she whispered.

  She imagined Elias. He would refrain. He believed in the symmetry. He would stay home, hoping everyone else did too. That made him a refrainer. If Elias was a refrainer, and most people were like Elias, then the box would be empty. If the box was empty, she had to claim.

  But if everyone thought Elias was a fool, everyone would claim. Then the pot would be split nine hundred ways. Then she should have refrained.

  It was a loop. To decide, she needed to know what they would do. To know what they would do, she needed to know what they thought she would do.

  Thursday night passed without sleep. The town was quiet, but the silence felt volatile, like a held breath.

  Friday morning arrived gray and cold. Elias walked to the hall at ten o'clock. He held a slip of paper. It was blank. He could write *Claim* or *Refrain*. He looked at the slot. It was a dark mouth waiting to swallow his choice.

  He thought of the nine hundred. He thought of the one thousand. He thought of the nine hundred thousand.

  If he refrained, he was betting on the town. If he claimed, he was betting against it.

  Mara arrived at eleven. She held her slip folded tight. She looked at Elias standing near the wall. He looked pale. He hadn't dropped his paper yet.

  "You decide?" Mara asked.

  "I know the math," Elias said. "One thousand is better than nine hundred. But one thousand is less than nine hundred thousand."

  "Are you putting it in?"

  "I don't know what you are doing."

  "That's the point," Mara said. "If you knew, the game would be over."

  She stepped toward the slot. Elias watched her hand. If she dropped her paper, she committed. If she committed, she broke the symmetry. If she broke the symmetry, the universal argument collapsed.

  Mara hovered over the slot. She thought of the guarantee. Safe. Solid. One thousand. Enough to live. She thought of the fortune. Enough to leave. Enough to never mend a net again.

  If she refrained, and Elias refrained, and everyone refrained, they all gained ten percent over the claiming scenario. But if she refrained, and Elias claimed, he won everything.

  "I can't trust the mirror," Mara said softly.

  "I can't trust the stranger," Elias replied.

  The clock on the wall ticked. Eleven fifty-five.

  Elias unfolded his paper. He looked at the pen. To write *Refrain* was an act of faith in a collective reason that might not exist. To write *Claim* was an act of isolation, admitting that they were not mirrors, but competitors.

  Mara's hand trembled. The logic pulled her both ways. The collective good demanded she do nothing. The individual incentive demanded she take everything, provided others did nothing. But if others took everything, she should do nothing.

  There was no stable ground. There was only the drop.

  At eleven fifty-nine, Elias moved. At the same moment, Mara moved. The papers slid into the dark. They did not watch them land. They turned and walked out into the gray light, waiting for the count that would tell them who they had been.

  # Commentary

  In constructing this story, I aimed to embody the two conflicting decision theories without naming them. Elias represents Evidential Decision Theory (EDT) or the "universalizing" habit. He treats his choice as diagnostic of the group's choice ("If I claim, everyone claims"). His reasoning relies on the symmetry of competent reasoners: since everyone has the same information and logic, their outputs should match. Therefore, he compares the outcome of *Universal Claiming* (900 each) against *Universal Refraining* (1,000 each) and chooses the latter.

  Mara represents Causal Decision Theory (CDT) or the "independent" habit. She treats her choice as causally isolated from the others. She asks, "Given what others do, what maximizes my payoff?" She identifies the instability in the collective optimum: if everyone else refrains, her individual incentive is to claim (900,000 vs 1,000). She recognizes that while universal claiming is worse than universal refraining, the state of universal refraining is not a Nash equilibrium because any single individual can profit by deviating.

  I staged the instability by ending the story at the moment of submission. Revealing the outcome would dissolve the tension by implying one strategy "won." By leaving it ambiguous, the reader remains in the same epistemic position as the characters: unable to resolve the conflict between group rationality and individual incentive without outside information. The setting—a closed town with no enforcement or reputation mechanisms—ensures the puzzle remains pure, stripped of real-world mitigations like contracts or social shame.

  **Verdict on the Puzzle**

  There is no determinate answer to what a resident should do without further assumptions about the nature of agency. The tension arises because the mechanism forces a collision between two valid logical frameworks.

  If residents view their reasoning as *correlated* (EDT), they should refrain. Since everyone is identical in knowledge and capability, my decision is strong evidence of yours. If I claim, you likely claim. Thus, I choose between 900 (all claim) and 1,000 (all refrain). I refrain.

  If residents view their reasoning as *causally independent* (CDT), the solution is indeterminate but leans toward mixing. Since my choice cannot change yours, I must react to the probability of your choice. If I believe others will refrain, I must claim. If I believe others will claim (specifically, if I expect >899 claimants), I must refrain. This creates a coordination problem where the "All Refrain" outcome is unstable because it invites defection.

  The single feature of the mechanism that does the most work is the **common knowledge of competence**. If the residents were not aware that everyone else was a competent reasoner, Elias's universalizing argument would collapse; he couldn't assume others would mirror his logic. Conversely, if the payoffs were structured such that claiming was always dominant (a standard Prisoner's Dilemma), Mara's hesitation would vanish. The tension exists precisely because the "All Refrain" outcome is collectively superior but individually fragile, relying entirely on whether agents treat their own will as bound to the will of the crowd.
