answer: |-
  Here is the checklist you asked for. It does not solve the puzzle; it defines what a solution must look like to be credible.

  ### 1. The Cases It Must Cover
  An account cannot just explain the original story; it must handle variations that isolate specific variables. For each case below, the account must generate a verdict (Intentional vs. Unintentional) based on its core principle, not by adjusting the principle to fit the intuition.

  *   **The Harm Case (River Fouled):**
      *   *Demand:* Must classify the side effect as **Intentional**.
      *   *Why:* This is the baseline asymmetry. If an account says this was unintentional, it fails to describe how people actually talk.
  *   **The Help Case (River Cleaned):**
      *   *Demand:* Must classify the side effect as **Unintentional**.
      *   *Why:* This establishes the asymmetry. Same knowledge, same indifference, opposite verdict. The account must explain why the valence changes the classification.
  *   **The Norm-Violation Case (Your Variant):**
      *   *Demand:* Must provide a determinate verdict (Intentional or Unintentional) derived from the *same mechanism* used for the River cases.
      *   *Why:* You noted you can make this land either way depending on the story. A valid account must fix the verdict. It must specify whether "breaking a rule" functions like "causing harm" (triggering intentionality) or like "helping" (not triggering it), based on whether the mechanism relies on *badness*, *norm violation*, or *deviance*.
  *   **The Ignorance Case (Control):**
      *   *Demand:* Must classify the side effect as **Unintentional** if the boss did not know it would happen.
      *   *Why:* To prove the account isn't just saying "anything bad the boss does is intentional." Knowledge must remain a necessary condition.

  ### 2. The Distinctions It Cannot Blur
  An account that explains the asymmetry by erasing these distinctions is cheating. It must preserve the following separations even while explaining why they correlate.

  *   **Intentionality vs. Blameworthiness:**
      *   *Demand:* The account must allow for a scenario where an agent is blameworthy but the act was unintentional (e.g., negligence), and vice versa.
      *   *Why:* You explicitly rejected the idea that "on purpose" is just code for "awful." The concepts must remain distinct even if they influence each other.
  *   **Foreseeing vs. Aiming:**
      *   *Demand:* The account must distinguish between knowing a result will happen and having that result as a goal.
      *   *Why:* In all your cases, the boss does not *aim* for the side effect. If the account collapses aiming into foreseeing, it makes *all* side effects intentional, killing the asymmetry.
  *   **The Act vs. The Side Effect:**
      *   *Demand:* The account must explain why the *main* program is intentional in all cases, but the *side* effect changes status.
      *   *Why:* We never doubt the boss implemented the program on purpose. The mystery is restricted to the consequence.

  ### 3. Forbidden Explanations
  These are moves that might solve the puzzle logically but fail your criteria for a believable account.

  *   **The Semantic Collapse:**
      *   *Forbidden:* Claiming that the word "intentional" literally means "morally bad side effect."
      *   *Why:* You ruled this out. It makes the concept useless for neutral description.
  *   **The Error Theory:**
      *   *Forbidden:* Claiming people are simply wrong in the Help case (or the Harm case) and the account should prescribe the "true" meaning regardless of intuition.
      *   *Why:* You want an account of the phenomenon (why people judge this way), not a correction of it.
  *   **The Hidden Desire:**
      *   *Forbidden:* Claiming the boss must secretly want the river fouled/cleaned to make the judgment work.
      *   *Why:* The stipulation is "couldn't care less." The account must respect the fixed mental state of indifference.

  ### 4. Non-Negotiables vs. Matters of Taste
  You need to know where you can compromise and where you cannot.

  *   **Non-Negotiable:**
      *   **Consistency:** The principle used for the River cases must mechanically determine the verdict for your Variant case. You cannot accept an account that treats them ad hoc.
      *   **Conceptual Integrity:** "Intentional" cannot be synonymous with "Blameworthy." There must be logical space between them.
      *   **Psychological Plausibility:** The mechanism must be something a human mind could actually use (e.g., checking norms, checking harm), not a logical trick.
  *   **Matters of Taste:**
      *   **The Variant Verdict:** Whether your rule-breaking boss is judged "Intentional" or "Unintentional" is less important than *why*. If the theory says "Norm violation triggers intentionality," you must accept the "Intentional" verdict even if you initially felt unsure.
      *   **The Mechanism:** Whether the explanation is linguistic (how we use words) or cognitive (how we process minds) is secondary, provided it meets the non-negotiables.

  ### 5. The Compatibility Warning
  Here is the hard truth you asked for. There is a tension between two things you want that may not be able to hold at once.

  *   **The Conflict:** You want an account that preserves the distinction between **Intentionality** (a fact about the mind/action) and **Morality** (a fact about value). However, the data (the River Pair) shows that **Morality** determines the judgment of **Intentionality**.
  *   **The Incompatibility:** If moral valence *changes* whether an act is called intentional, then intentionality is not purely a descriptive fact about the mind. If you insist it *is* purely descriptive, you must claim the folk are confused (forbidden by your constraints). If you accept the folk are correct, you must admit morality is part of the structure of intentionality.
  *   **The Result:** You may have to accept that "Intentional" is a **hybrid concept** (part descriptive, part normative) rather than a pure descriptive one. If you demand it be purely descriptive, no account will satisfy you.

  \answer{Preserving the conceptual distinction between intentionality and morality while explaining why morality determines intentionality judgments.}
