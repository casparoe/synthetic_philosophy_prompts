      *   *The Madhyamaka Twist:* Nagarjuna uses the *catuskoti* to *negate* all four positions, not to affirm one of them as a stable state for a claim. The goal is *prasaṅga* (reduction to absurdity), not classification.
      *   *The "Ultimate Truth" Worry:* The user worries that because everything is empty, nothing holds, so only `neither` survives. This misunderstands the Two Truths doctrine (Conventional vs. Ultimate). In conventional truth (*samvrti-satya*), the four corners function. In ultimate truth (*paramartha-satya*), they are deconstructed. For a data tagging tool, we are operating in *conventional* truth.

  3.  **Address the Technical Implementation (FDE vs. Madhyamaka):**
