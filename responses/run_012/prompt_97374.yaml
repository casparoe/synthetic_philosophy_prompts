  **(Self-Correction Note on "Fundamental"):** I need to be careful here. Grice is fundamental to *language*. But the prompt asks what is more fundamental for explaining *how such statements actually function in public life*. That shifts the weight to the political/social function, favoring the dogwhistle analysis. I will make this distinction clear.

  9.  **Final Review against constraints:**
