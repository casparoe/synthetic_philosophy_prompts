      *   *Section 1: Gricean Baseline.* Briefly define Speaker Meaning and Implicature (keep it tight).
      *   *Section 2: The Dogwhistle Challenge.* Introduce the philosophical literature (Saul, Stanley).
      *   *Section 3: The Three Pressure Points.*
          *   *Reflexive Intention:* Highlight the "split audience" problem. Grice = Openness; Dogwhistle = Secrecy within openness.
          *   *Calculability:* Grice = Logic/Cooperation; Dogwhistle = Code/Cultural Knowledge.
          *   *Cancellability:* Grice = Clarification; Dogwhistle = Strategic Retreat.
      *   *Section 4: The Verdict.* Argue for the primacy of the deniable signal in *public life* contexts, while acknowledging Grice's foundational role in linguistics.
