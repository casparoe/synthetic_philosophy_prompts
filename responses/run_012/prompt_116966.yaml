answer: |-
  # JOINT STATEMENT ON THE NATURE OF WEAKNESS OF WILL

  **Parties:** The Time-Inconsistency Camp (TIC) and The Agency Camp (AC)
  **Date:** [Current Date]
  **Subject:** Adversarial Collaboration on Akrasia and Intertemporal Choice

  ## 1. Agreed Claims

  1.  **Characterization of the Phenomenon:** Both camps agree that the target phenomenon involves agents who, like the Running Example (evening judgment to run vs. morning action of sleeping), engage in courses of action that they subsequently regret or characterize as failures. Both agree that the agent at 10 PM and the agent at 6 AM are numerically the same person, regardless of whether they are modeled as a single entity or a succession of temporal selves.
  2.  **Empirical Adequacy of Discounting:** The AC concedes that hyperbolic or quasi-hyperbolic discounting models successfully predict the *pattern* of choices in intertemporal scenarios, including the demand for commitment devices. The TIC concedes that these models describe the *shape* of the behavior but acknowledges that predictive success does not logically entail that the model captures the agent's internal normative experience.
  3.  **Ambiguity of Terms:** Both camps accept that the terms "preference," "judgment," and "agent" are ambiguous in ordinary discourse. "Preference" may refer to a revealed choice (what is taken) or a normative ranking (what is endorsed). "Judgment" may refer to a cold cognitive assessment or a motivational state. [Uncertainty Flag: The camps are not yet agreed on which definition should be privileged in scientific explanation.]
  4.  **Scope of Dispute:** This dispute is not about whether humans make errors in planning (they do), nor is it about whether people sometimes change their minds for good reasons. It is specifically about whether a specific class of errors involves a conflict *within* a single moment of choice or merely a conflict *between* moments.
  5.  **The Three-Way Division:** Regarding the stipulated division of the phenomenon:
      *   Both camps agree that **(iii) Non-motivational failure** (where judgment and ranking are stable but action fails due to incapacity) is distinct from weakness of will and is not the primary subject of this debate.
      *   Both camps agree that **(i) Diachronic reversal** (ranking changes from 10 PM to 6 AM) occurs.
      *   The camps disagree on **(ii) Synchronic conflict**. The AC holds this is the defining feature of weakness of will. The TIC holds this is conceptually incoherent or a misdescription of (i). However, both agree to use this terminology to map the disagreement.
  6.  **The Running Example:** Both camps agree that the Running Example *as stated* (evening plan, morning deviation, morning report that rising is still better) is under-described. It is compatible with the TIC view (the morning report is mistaken or reflects a distinct normative faculty) and the AC view (the morning report is accurate). Both agree that further facts are required to distinguish the accounts.

  ## 2. Disagreements Table

  | Disagreement | Time-Inconsistency Camp (TIC) | Agency Camp (AC) |
  | :--- | :--- | :--- |
  | **1. The Structure of the Moment of Action** | At any single moment (e.g., 6 AM), the agent is locally consistent. The choice made reveals the agent's all-things-considered preference at that moment. Inconsistency exists only between the 10 PM self and the 6 AM self. | At the moment of action (6 AM), the agent can be synchronically inconsistent. The agent can hold a stable all-things-considered judgment that A is better than B, while simultaneously choosing B. |
  | **2. The Explanation of Commitment** | Demand for commitment devices (e.g., buying an alarm clock that cannot be silenced) is explained by the 10 PM self anticipating the 6 AM self's preference reversal. It is a game between temporal stages. | Demand for commitment is explained by a single agent recognizing a potential failure of agency. It is an attempt to align future action with a standing judgment that persists across time. |
  | **3. The Status of the Morning Report** | When the 6 AM agent reports "Rising is better, but I am sleeping," this report is either false (rising is not currently judged better) or refers to a past judgment. It cannot refer to a current normative ranking that contradicts current choice. | When the 6 AM agent reports "Rising is better, but I am sleeping," this report is literally true. It evidences a split between the agent's evaluative faculty and their motivational faculty at that instant. |

  ## 3. The Cruxes

  To move the debate forward, we identify three sub-questions. Settling these would force at least one camp to revise its position.

  **Crux 1: The "Simultaneous Valuation" Test (Choice Data)**
  *   **Case:** At 6 AM, immediately after silencing the alarm, the agent is offered a choice between two immediate rewards: $10 tagged "For Sleeping" and $10 tagged "For Running." The money is identical; only the tag differs. The agent must choose one to receive the money.
  *   **Evidence:** The choice made and the concurrent verbal report of which tag is "better."
  *   **TIC Prediction:** The agent will choose "For Sleeping." If asked which is better, the agent will either say "Sleeping" or be unable to coherently assert "Running" is better while choosing "Sleeping." (Choice reveals preference).
  *   **AC Prediction:** The agent may choose "For Sleeping" (due to motivational weakness) but will consistently report that "For Running" is the better option. The choice does not fully reveal the normative ranking.

  **Crux 2: The "Costly Commitment" Correlation (Choice Data)**
  *   **Case:** A longitudinal study measuring the magnitude of the discount rate (via standard intertemporal choice tasks) vs. the willingness to pay for commitment devices in agents who report high levels of synchronic conflict.
  *   **Evidence:** Statistical correlation between measured preference reversal rates and demand for commitment.
  *   **TIC Prediction:** Demand for commitment will correlate perfectly with the magnitude of the measured discount rate shift. Agents who show no discounting shift will not seek commitment.
  *   **AC Prediction:** Demand for commitment will correlate with reported synchronic conflict *independently* of the discount rate shift. Agents may seek commitment even if their discount rates are stable, driven by a lack of trust in their own agency rather than a change in valuation.

  **Crux 3: The Coherence of Synchronic Conflict (Conceptual)**
  *   **Case:** A philosophical analysis of whether "all-things-considered judgment" entails "motivation to act" by definition.
  *   **Evidence:** Logical analysis of the concepts "judgment" and "action."
  *   **TIC Prediction:** It will be demonstrated that to judge A "better all-things-considered" just *means* to be more motivated to do A. Therefore, acting against judgment is a contradiction in terms, proving the report of conflict is a confusion.
  *   **AC Prediction:** It will be demonstrated that "judgment" is a normative endorsement distinct from "desire." Therefore, acting against judgment is logically possible, proving the TIC model omits a real faculty.

  ## 4. Falsification Section

  **Time-Inconsistency Camp (TIC)**
  *   **Falsifying Result:** Robust evidence that agents, at the exact moment of choice, assign a higher *subjective value* (measured via neural valuation signals or explicit rating) to the foregone option than the chosen option, without coercion or ignorance.
  *   **Response:** If such evidence is replicated, the TIC would abandon the claim that "choice always reveals current preference." It would require modifying the model to include a separate motivational parameter distinct from valuation.

  **Agency Camp (AC)**
  *   **Falsifying Result:** Demonstration that all reports of synchronic conflict vanish when agents are forced to slow down and deliberate, or that such reports are shown to be post-hoc confabulations generated after the choice is made.
  *   **Response:** If reports of synchronic conflict are proven to be systematic errors in self-reporting rather than reflections of internal state, the AC would abandon the claim that weakness of will is a distinct *synchronic* phenomenon. It would concede the phenomenon is purely diachronic.

  **Common Ground for Movement**
  *   Both sides agree that the debate would be substantially moved by a model that predicts the demand for commitment devices *more accurately* than the standard quasi-hyperbolic discounting model. If the AC can propose a formal model incorporating "agency costs" that outperforms the TIC's discounting model on out-of-sample data, the TIC agrees to treat the "agency" variable as a legitimate theoretical posit.

  ## 5. Closing Section: Verbal vs. Substantive

  Upon review, we distinguish the following elements of our dispute:

  **Verbal Disputes:**
  *   **Definition of Preference:** A significant portion of the disagreement turns on whether "preference" is defined by *revealed choice* (TIC) or by *normative endorsement* (AC). If we agree to use "preference" for choice and "valuation" for endorsement, some rows in the Disagreements Table may dissolve.
  *   **Identity of the Agent:** We disagree on whether the 10 PM self and 6 AM self are best described as "stages of one agent" (AC) or "distinct agents in a sequence" (TIC). This is partly a matter of descriptive convention, provided we agree on the physical continuity of the organism.

  **Substantive Disputes:**
  *   **Architectural Claims:** The dispute is substantive regarding the cognitive architecture of the mind. The TIC claims the mind operates via a single valuation system that updates over time. The AC claims the mind contains distinct systems (e.g., evaluative vs. motivational) that can output conflicting signals at the same time.
  *   **Responsibility:** The dispute is substantive regarding moral psychology. The AC holds that blame for weakness of will requires synchronic conflict (you could have done otherwise *then*). The TIC holds that blame is a social tool applied to diachronic inconsistency regardless of the moment-of-action mechanics. This affects how we assign responsibility in legal and ethical contexts.

  **Signed,**

  *Representatives of the Time-Inconsistency Camp*
  *Representatives of the Agency Camp*
