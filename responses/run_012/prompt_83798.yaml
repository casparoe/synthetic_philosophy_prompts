          *   *Conflict:* These actually align well. Both oppose covert control.
          *   *Severity:* None. They are allies.

  4.  **Rank the Tensions:**

      1.  **(3) vs. (5):** The definition of "nudge." If nudges work via bias exploitation, (5) bans what (3) permits. This is the fatal flaw.
      2.  **(3) vs. (4):** The efficacy of transparency. If nudges require secrecy to work, (4) bans what (3) permits.
      3.  **(2) vs. (5):** The scope of disavowal. Disavowing the choice vs. disavowing the influence.

