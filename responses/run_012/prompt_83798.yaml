          *   *Nuance:* (2) focuses on the *outcome/choice* (I wouldn't choose to be addicted). (5) focuses on the *process* (I wouldn't choose to be tricked).
          *   *Severity:* Medium. Requires distinguishing between disavowing the *state of affairs* vs. disavowing the *mechanism of control*.

      *   *Tension E: (4) vs. (5).*
          *   (4) says don't do it if you can't defend it openly.
