      *   *Better:* Reject the Thaler/Sunstein justification in (3). Acknowledge that "options in place" is necessary but not sufficient.
      *   *Actually, the strongest move:* Drop the "usually" in (3). Most real-world nudges *are* manipulative (violating 5) or rely on opacity (violating 4). So (3) is empirically false given your other commitments.
