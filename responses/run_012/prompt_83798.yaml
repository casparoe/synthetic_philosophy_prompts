      *   *Refining the (3) vs (5) conflict:* This is the big one. Thaler/Sunstein define nudges as altering choice architecture. (5) defines manipulation as exploiting biases. Most behavioral econ nudges *are* bias exploitation. So (3) permits what (5) forbids.
