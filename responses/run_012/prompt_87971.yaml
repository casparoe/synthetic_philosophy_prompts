answer: |-
  # Activity: The Value of Knowing (and the Cost of Being Known)

  **Time:** 90 Minutes
  **Participants:** 12–15 people
  **Materials:**
  *   Projector/Whiteboard (for payoff matrices and EV calculations).
  *   2 Decks of playing cards (one for State, one for Signals).
  *   Index cards (for "Public Signals").
  *   Paper & Pens (for tracking scores).
  *   Optional: Poker chips or candy for stakes (increases engagement).

  **Learning Objectives:**
  1.  **Experience Good's Theorem:** Verify that in a single-agent problem, free information never reduces expected utility because the agent can always ignore it.
  2.  **Experience the Strategic Limit:** Verify that in a multi-agent problem, public information can reduce utility because it allows opponents to condition their actions on your knowledge.
  3.  **Map the Conditions:** Identify which assumptions of Good's Theorem (single agent, fixed utility, private info) were violated in the second half.

  ---

  ## Timeline Overview

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Intro** | Framing Good's Theorem & The Intuition Trap. |
  | 10–40 | **Part 1** | **The Solitary Oracle:** Single-agent betting game. |
  | 40–70 | **Part 2** | **The Glass Fortress:** Strategic defense game. |
  | 70–90 | **Debrief** | Mapping the experience to the theorem's conditions. |

  ---

  ## Part 1: The Solitary Oracle (30 Minutes)
  *Goal: Demonstrate that $E[\max_a E[U|S]] \ge \max_a E[U]$.*

  ### Setup (5 mins)
  1.  **The Scenario:** You are an investor. There is a hidden "Market State": **Bull** or **Bear** (50/50 chance).
  2.  **The Decision:** You must choose **Invest** or **Cash**.
  3.  **Payoffs:**
      *   Bull + Invest = +\$10
      *   Bear + Invest = -\$10
      *   Cash = \$0 (regardless of State)
  4.  **The Signal:** You may choose to draw a **Tip Card** from a special deck before deciding.
      *   If Market is Bull: 75% chance Tip says "Good", 25% "Bad".
      *   If Market is Bear: 75% chance Tip says "Bad", 25% "Good".
      *   **Cost:** \$0.
      *   **Constraint:** You are allowed to ignore the Tip and choose randomly if you wish.

  ### The Calculation (5 mins)
  *Project this on the screen. Do not let them derive it from scratch; ask them to audit it.*
  *   **Blind EV:** Max(Invest, Cash) = Max(0, 0) = **\$0**.
  *   **Informed EV:**
      *   If Tip "Good" (Prob 50%): $P(Bull|Good) = 75\%$. EV(Invest) = $0.75(10) + 0.25(-10) = \$5$. Action: Invest.
      *   If Tip "Bad" (Prob 50%): $P(Bull|Bad) = 25\%$. EV(Invest) = $0.25(10) + 0.75(-10) = -\$5$. Action: Cash (\$0).
      *   **Total EV:** $0.5(\$5) + 0.5(\$0) = \mathbf{\$2.50}$.
  *   **Conclusion:** Information adds \$2.50 value. It cannot be negative because if the Tip was useless (50/50), you would just ignore it and get \$0.

  ### The Play (15 mins)
  1.  **Round 1 (Blind):** All 15 players make a choice without a Tip. Reveal Market State (flip a coin). Record scores.
  2.  **Round 2 (Informed):** Deal Tip Cards. Players choose Invest/Cash. Reveal Market State. Record scores.
  3.  **Round 3 (The "Ignore" Test):** Deal Tip Cards. **Rule:** You must choose *against* the Tip (if Good, Cash; if Bad, Invest).
      *   *Facilitator Note:* This proves the "ability to ignore" is a physical option, even if suboptimal.
  4.  **Aggregate:** Tally the group's total winnings. The Informed round should statistically outperform the Blind round.

  ### Mini-Debrief (5 mins)
  *   Ask: "Did anyone lose money by looking at the Tip?" (Individual variance yes, group EV no).
  *   Ask: "Could you have chosen to act as if you didn't see the Tip?" (Yes).
  *   **Key Takeaway:** In a single-agent world, information is a *option* to update. You never have to use it.

  ---

  ## Part 2: The Glass Fortress (30 Minutes)
  *Goal: Demonstrate that public information changes the opponent's best response.*

  ### Setup (5 mins)
  1.  **The Scenario:** You are a **Defender**. The Facilitator (House) is the **Attacker**.
  2.  **The State:** The Fortress is either **Strong** or **Weak** (50/50 chance, determined by a hidden card).
  3.  **The Decision:**
      *   Defender chooses: **Fight** or **Flee**.
      *   Attacker chooses: **Attack** or **Wait**.
      *   *Moves are simultaneous.*
  4.  **Payoffs (Defender):**
      *   **Strong & Fight & Attack:** +10 (You repel them).
      *   **Strong & Fight & Wait:** 0.
      *   **Weak & Fight & Attack:** -20 (You are crushed).
      *   **Weak & Flee & Attack:** -5 (You lose supplies).
      *   **Flee & Wait:** 0.
      *   *(Attacker Payoffs are inverse; they want to Attack only when you are Weak & Fighting, or Fleeing. For simplicity, tell players: "Attacker is rational and wants to minimize your score.")*

  ### The Play (20 mins)
  **Phase A: The Fog of War (Blind)**
  *   Neither you nor the Attacker knows if the Fortress is Strong or Weak.
  *   Play 3 rounds.
  *   *Facilitator Strategy:* Since the Attacker doesn't know the state, they must mix. If you Fight 50% of the time, they Attack 50% of the time.
  *   *Expected Outcome:* You can achieve a positive EV by mixing strategies (e.g., Fight 2/3, Flee 1/3) to keep the Attacker indifferent.

  **Phase B: The Glass Wall (Public Signal)**
  *   **New Rule:** Before moves are chosen, a **Signal Card** is drawn and placed **Face Up on the Projector**.
      *   If State is Strong: Card says "STRONG".
      *   If State is Weak: Card says "WEAK".
  *   **Everyone sees the card.** You know the state. The Attacker *also* knows the state.
  *   Play 3 rounds.
  *   *Facilitator Strategy (Crucial):*
      *   If Card says "STRONG": You will Fight (rational). Attacker sees "STRONG", knows you will Fight, and chooses **Wait** (to avoid -10 loss). **Your Payoff: 0.**
      *   If Card says "WEAK": You will Flee (rational). Attacker sees "WEAK", knows you will Flee, and chooses **Attack** (to take -5 from you). **Your Payoff: -5.**
  *   *Expected Outcome:* Your average score is **-2.5**.

  ### Comparison (5 mins)
  *   Compare Phase A (Blind) scores vs. Phase B (Public Info) scores.
  *   Almost certainly, Phase B scores will be lower.
  *   Ask: "In Phase B, could you ignore the signal?"
      *   *Answer:* You could ignore it (e.g., Fight on Weak), but the Attacker *saw the card*. They know the State regardless of what you do. Your ability to ignore the signal does not restore their ignorance.

