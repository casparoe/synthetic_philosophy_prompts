  ## Troubleshooting Guide (For the Facilitator)

  | Problem | Prediction | Fix |
  | :--- | :--- | :--- |
  | **"The Attacker is cheating."** | In Part 2, players will claim the House is targeting them unfairly. | **Pre-commitment:** Write the Attacker's strategy on the whiteboard *before* Phase B begins. "If Strong→Wait, If Weak→Attack." Show that this is rational for *them*, not spiteful. |
  | **"I didn't calculate the EV right."** | Players get bogged down in Bayes rule during Part 1. | **Provide the Cheat Sheet:** Hand out a slip of paper with the Part 1 EV calculation already done. Tell them: "Audit this math for 2 minutes, then play." |
  | **"Info didn't hurt me."** | Variance in Part 2 (small sample size) might show a win. | **Aggregate Group Data:** Don't look at individual scores. Sum the whole room's points. The law of large numbers across 15 people will show the negative EV trend. |
  | **"This is just cost of info."** | Someone argues the signal was "costly" socially. | **Reiterate:** The signal was free. The cost came from the *change in the opponent's behavior*, not the price of the card. |

  ---

  ## Debrief & Mapping (20 Minutes)
  *Draw a T-Chart on the whiteboard: "Good's Theorem Conditions" vs. "What Happened."*

  **1. Single Agent vs. Multi-Agent**
  *   *Theorem:* Assumes a fixed environment (Nature).
  *   *Part 1:* Nature (the Market) does not care if you know the Tip.
  *   *Part 2:* The Attacker is an *agent*. Their utility function depends on *your* action. When you learn, they learn.
  *   *Lesson:* Good's Theorem breaks when the "environment" can read your mind (or your data).

  **2. The "Ignore" Condition**
  *   *Theorem:* You can always act as if you didn't receive the signal.
  *   *Part 1:* True. You could have bet randomly despite the Tip.
  *   *Part 2:* **False.** Even if *you* ignore the signal and play randomly, the *Attacker* saw the signal. They update their beliefs about the State (Strong/Weak) and change their move. You cannot "un-see" the signal for *them*.
  *   *Lesson:* In strategic settings, privacy is a component of the value of information.

  **3. Fixed Utility Function**
  *   *Theorem:* Your goals don't change when you learn.
  *   *Activity:* Your goals didn't change, but the *feasible payoffs* changed because the game tree transformed from Simultaneous (Blind) to Sequential/Perfect Information (Public).

  **4. The "LessWrong" Takeaway**
  *   Ask the group: "How does this relate to AI alignment or decision theory?"
  *   *Desired Insight:* An AI that broadcasts its internal reasoning (Chain of Thought) to adversaries might be exploitable. An AI that optimizes purely for truth-seeking (maximizing information) might inadvertently reduce its ability to achieve instrumental goals in a multi-agent world.
  *   *Final Thought:* Good's Theorem holds for **Truth**, but not always for **Power**.

  ---

  ## Facilitator Script: The "Aha" Moment
  *Use this closing speech to seal the concept:*

  > "In the first game, the information was a **tool**. You could pick it up or leave it on the table. If it was useless, you left it. That is why the value was non-negative.
  >
  > In the second game, the information was a **leak**. Even if you closed your eyes, the Attacker saw the card. You lost the ability to keep the State ambiguous.
  >
  > Good's Theorem assumes you are the only mind in the universe updating on the signal. As soon as there is a second mind that cares what you do, information is no longer just about *your* beliefs. It is about *common knowledge*. And sometimes, being known is more dangerous than being blind."
