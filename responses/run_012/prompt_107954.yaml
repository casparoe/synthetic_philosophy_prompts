answer: |-
  **Project Title:** Localizing the Normative Force of Harsanyi's Aggregation Theorem

  **Project Summary**
  How do we aggregate individual well-being into a social judgment? For decades, Harsanyi's Aggregation Theorem has served as the formal cornerstone for utilitarianism, purporting to derive the view that society should maximize the sum of individual utilities from premises of individual rationality, Pareto efficiency, and impartiality. The standard philosophical defense of this theorem insists that its ethical weight rests entirely on the impartiality premise (often modeled as a veil of ignorance), while the decision-theoretic axioms required for the proof—specifically the expected utility axioms—are merely formal tools for ensuring coherence. On this view, the mathematics is ethically neutral; the morality comes from the fairness.

  I propose that this defense is mistaken. My hypothesis is that the specific decision-theoretic axioms imposed on the impartial observer, particularly the Independence axiom, carry significant normative content. They implicitly rule out sensitivity to the distribution of welfare under uncertainty. If we weaken these axioms while holding impartiality and Pareto fixed, the theorem should not yield utilitarianism, but a broader family of aggregation rules—potentially including prioritarian or sufficientarian views—that treat the worst-off differently. This project seeks to convert this suspicion into a precise mathematical investigation. I aim to "localize" the normative bite of the theorem by mapping exactly which decision-theoretic constraints force the social welfare function into a utilitarian shape and which allow for egalitarian deviations.

  **The Research Question and Existing Debate**
  The existing literature leaves this question open because it typically treats the decision-theoretic framework as a fixed background rather than a variable. Defenders of Harsanyi argue that expected utility is the only coherent way to handle risk, so questioning its axioms is irrational. Critics argue the theorem is rigged but often lack a formal alternative that preserves Pareto and Impartiality. Consequently, we lack a systematic map of the space between full expected utility and no structure at all.

  My project poses a determinate localization question. I will fix two ethical premises: (1) a Strong Pareto condition (if everyone is better off, society is better off) and (2) an Impartiality condition (the observer assigns equal probability to occupying any individual's position). I will then vary the decision-theoretic axioms imposed on the observer's preferences over lotteries of social positions. I will analyze three packages:
  1.  **Full Expected Utility:** Including the Independence axiom.
  2.  **Weakened Uncertainty Axioms:** Retaining continuity and monotonicity but dropping or diluting Independence (e.g., allowing for betweenness or rank-dependent properties).
  3.  **Non-Linear Representations:** Where the representation is not a probability-weighted average at all.

  For each package, I will characterize the class of admissible social welfare orderings. A "characterization" here means a representation result identifying the functional form of the social welfare function (e.g., linear sum vs. concave transformation) and, where possible, a uniqueness result specifying the scale (e.g., unique up to positive affine transformation). The hypothesis to be tested is that only weighted utilitarianism survives Package 1, while Package 2 admits rules sensitive to the worst-off. This will settle whether the theorem's normative force is located in impartiality or in the specific handling of risk. Furthermore, the characterization will flag how these rules bear on the distinction between *ex ante* evaluation (assessing lotteries before positions are assigned) and *ex post* evaluation (assessing outcomes after assignment), a distinction often obscured in standard derivations.

  **Methodology and Timeline**
  This is a one-semester project (four months). I am comfortable with the formalism of standard expected utility but am not a specialist in generalized decision theory. The work requires mastering representation theorems for non-expected utility preferences and applying them to social choice contexts.

  *   **Month 1: Formal Setup and Literature Synthesis.** I will formalize the fixed ethical premises and the varying axiom packages. I will review existing generalizations of Harsanyi's theorem (e.g., those using rank-dependent utility) to identify the precise mathematical levers required. *Risk:* The technical literature on non-expected utility aggregation is dense. *Mitigation:* I will prioritize existing characterization theorems over proving new ones from scratch, adapting known results to this specific localization framework.
  *   **Month 2: The Strong Case.** I will reconstruct the standard Harsanyi result within my framework to ensure the baseline is correct. This serves as a control case to verify that my formalization yields utilitarianism when Independence is present.
  *   **Month 3: The Weakened Cases.** I will analyze the admissible social welfare orderings under the weakened axiom packages. This involves determining if dropping Independence allows for concave transformations of individual utilities (prioritarianism) or if other constraints prevent this. *Risk:* I may lack the technical skill to derive the representation theorems for the weaker packages. *Mitigation:* If derivation proves impossible, I will pivot to a "containment result," demonstrating that the class of admissible rules under weaker axioms is a strict superset of the utilitarian class, even if I cannot fully characterize the boundary.
  *   **Month 4: Synthesis and Writing.** I will interpret the mathematical results philosophically, specifically addressing the *ex ante/ex post* implications and drafting the final paper.

  **Possible Outcomes and Failure Conditions**
  There are three substantive outcomes:
  1.  **Localization Confirmed:** The class of admissible orderings widens as axioms weaken, confirming that utilitarianism depends on specific risk attitudes.
  2.  **Localization Refuted:** The class of admissible orderings remains invariant (utilitarianism survives even with weakened axioms), suggesting the ethical work is indeed done by Pareto/Impartiality alone.
  3.  **Characterization Collapse:** The weaker axioms admit so many rules that the class becomes uninformative (e.g., "any monotonic function").

  A consideration of functional form will decide between these. If the weakened packages admit a functional form that is non-linear in utilities (e.g., a sum of concave transformations), Outcome 1 is confirmed.

  The project fails outright if I cannot produce a rigorous characterization or containment result for at least one weakened package. If the mathematics proves intractable within the semester, the deliverable will be a detailed formal proof of *why* the characterization is intractable, identifying the specific mathematical gap, though this counts as a partial failure for the grant's purposes.

  **Scope and Limitations**
  This project is scoped strictly to the axioms of the *impartial observer*. I will not attempt to solve the problem of interpersonal comparison of utility; I will assume utilities are comparable and fixed for the sake of the aggregation argument. I will also not attempt to resolve the *ex ante/ex post* dilemma definitively; I will only flag how the resulting aggregation rules align with one or the other. Leaving these out is acceptable because the project's goal is to isolate the contribution of *uncertainty axioms*, not to solve all problems of social choice. By holding the ethical premises fixed and varying only the decision theory, I can isolate the variable in question without needing to settle the broader debates in welfare economics.

  Question: Does weakening the decision-theoretic axioms imposed on an impartial observer, while holding Pareto and Impartiality fixed, expand the class of admissible social welfare orderings beyond utilitarianism to include rules sensitive to the distribution of welfare?
