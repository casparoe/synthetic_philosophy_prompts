answer: |-
  There is no single, established term that perfectly captures the specific phenomenological shift you are describing. While several fields of aesthetics and psychology touch upon parts of this experience, each fails to cover the whole phenomenon as you have delineated it.

  Here is an analysis of the existing concepts that come closest, why they fall short, and a proposal for a term that fits the edges of your description.

  ### The Near Misses

  **1. The Intentional Fallacy**
  *   **What it is:** Coined by Wimsatt and Beardsley (1946), this is the critical argument that an author's intended meaning is irrelevant to the interpretation of a text.
  *   **Where it fails:** This is a *prescriptive* rule (telling critics what they *should not* do), not a *descriptive* term for the experience of what *does* happen. You are describing the inevitable failure of the Intentional Fallacy in the lived experience of the audience. The author refuses to die; their biography bleeds into the text regardless of critical theory.

  **2. Ethical Criticism (Ethicism / Moderate Moralism)**
  *   **What it is:** Contemporary philosophical aesthetics (e.g., Berys Gaut, Noël Carroll) debating whether ethical flaws in an artist or artwork constitute aesthetic flaws.
  *   **Where it fails:** This framework focuses on *valuation* (is the art "good" or "bad"?). You describe something more subtle: a shift in *semantic content* (affection becomes confession) and a dissociation between interest and consumption. You note the work can become "more interesting" even as you withdraw from it. Ethical criticism rarely accounts for a work gaining aesthetic complexity through moral repulsion.

  **3. Provenance (and Nelson Goodman's "Autographic Arts")**
  *   **What it is:** In visual art, the history of ownership and authenticity. Philosopher Nelson Goodman argued that knowing a painting is a forgery changes our perceptual experience of the lines themselves, not just their market value.
  *   **Where it fails:** This applies well to your forgery example, but it is specific to authenticity and originality. It does not easily translate to the moral or biographical dimensions of music or literature, where "authenticity" is metaphorical rather than physical.

  **4. The Halo Effect**
  *   **What it is:** A cognitive bias where one positive trait (talence) influences the perception of other traits (morality), or vice versa.
  *   **Where it fails:** This explains the *psychological mechanism*, but not the *aesthetic consequence*. It explains why you might like them more, but not why the *lyrics themselves* change meaning from tenderness to performance.

  ### A Proposed Term: Biographical Inflection

  Since existing terminology fragments this experience into "error," "value judgment," or "authenticity," I propose the term **Biographical Inflection**.

  **Definition:**
  **Biographical Inflection** is the phenomenological alteration of a work's perceived semantic content and affective tone, resulting from the receiver's knowledge of the creator's life, independent of any physical change to the work or shift in its aesthetic valuation.

  Unlike "context," which surrounds a work, *inflection* suggests a bending of the work's internal voice. It acknowledges that the "fact about the maker" has migrated to become a "fact about the made thing."

  **Key Characteristics:**
  1.  **Semantic Shift:** The proposition of the art changes (e.g., "I love you" shifts from a statement of fact to a statement of manipulation).
  2.  **Dissociated Engagement:** Interest and willingness to consume are no longer correlated. The work may become hermeneutically richer (more to analyze) while becoming ethically or emotionally uninhabitable.
  3.  **Valence Neutrality:** It applies to negative revelations (scandal) and positive ones (admiration), as well as non-moral facts (forgery, anonymity).

  ### Marking the Edges

  You asked how this concept applies to specific boundaries. Here is how **Biographical Inflection** holds up under stress:

  **1. Does it apply to a building whose architect did something monstrous?**
  *   **Yes.** Architecture is often viewed as abstract or functional, but Biographical Inflection suggests that space itself can become "inflected."
  *   *Example:* Knowing Albert Speer designed a structure may cause the viewer to perceive the scale not as "grand" but as "domineering," or the order not as "classical" but as "authoritarian." The light and stone have not changed, but the *atmosphere*—the affective tone—has shifted. The building begins to "say" something about power that it did not say when the architect was unknown.

  **2. Does it apply to a work whose maker is unknown?**
  *   **No.** Biographical Inflection requires the *knowledge* of the fact. If the maker is unknown, the work exists in a state of **Biographical Suspension**.
  *   *Nuance:* If a work is *assumed* to be by a certain type of person (e.g., folk art assumed to be by "the people"), and then attributed to a specific individual, the inflection occurs at the moment of attribution. The phenomenon is triggered by the revelation, not the reality.

  **3. Does it apply to a piece made long before the fact came out?**
  *   **Yes.** This is **Retroactive Inflection**.
  *   *Example:* Wagner's music was not physically altered by the posthumous widespread knowledge of his antisemitism, but for modern listeners, the *Ring Cycle* is inflected by that knowledge. The inflection happens in the reception, not the creation. It proves that the "meaning" of a work is not a fixed deposit made at the time of creation, but a living negotiation between the object and the audience's knowledge base.

  ### Why This Distinction Matters

  Naming this **Biographical Inflection** rather than simply "bias" or "condemnation" validates your observation that the work has genuinely changed. In hermeneutics (the theory of interpretation), the "text" is not just the ink on the page or the sound waves in the air; it is the intersection of those things with the reader's horizon of expectations.

  When you learn a fact about the artist, you change your horizon. Consequently, the work *does* say something else. To claim otherwise is to pretend the art exists in a vacuum. Biographical Inflection names the cost of that vacuum collapsing: we gain depth and context, but we lose the innocence of the work's original voice. We are forced to hear the confession alongside the song.
