      *   *The "Governs" Ambiguity:* This is the core friction point. Needs careful unpacking.
      *   *The Compromise:* Lewis allowed naturalness to weight simplicity. AHs want naturalness to be ontological. If Humeans weight naturalness heavily, does it collapse into AH? Or is it just a smarter Humeanism?
