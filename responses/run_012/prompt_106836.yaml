  7.  **Drafting - Section 5: The Crux Table:**
      *   Need specific test cases where predictions differ.
      *   *Crux 1: Supervenience.* Can two worlds have the same mosaic but different laws? (AH: Yes [Nomological Dualism], H: No).
      *   *Crux 2: Unexplained Regularities.* If a regularity exists but adds no simplicity, is it a law? (H: No, AH: Maybe, if it's a primitive necessitation).
      *   *Crux 3: The Compromise Breakpoint.* At what weight of naturalness does Humeanism become AH?

  8.  **Review and Refine:**
      *   *Tone Check:* Is it academic but collaborative? Yes.
