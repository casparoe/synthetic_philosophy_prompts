          4.  *Counterfactual Grounding:* Laws make counterfactuals true. (H: Laws + Mosaic do this via systematization. AH: Laws do this directly). *Correction:* Humeans think laws *support* counterfactuals, but do they *ground* them? Usually, Humeans say the mosaic grounds the laws, and the laws (as summaries) help us evaluate counterfactuals. AHs say laws ground the counterfactuals.
          5.  *Projective 'Must':* The 'necessity' is us projecting. (H: Yes, AH: No).
      *   *Agreement Zone:* Where do they overlap? Maybe on the *utility* of law-talk, even if the metaphysics differs.

  5.  **Drafting - Section 3: The "Naturalness-Weighted" Compromise:**
      *   *Scenario:* Humean BSA but the "simplicity" metric heavily penalizes unnatural predicates.
      *   *Humean View:* This is still Humeanism. Ontology is just the mosaic. Naturalness is just a parameter in the best system calculation.
      *   *AH View:* If naturalness is objective enough to weight the system, isn't that an ontological commitment? If it's *just* a heuristic, it fails. If it's *real*, it's AH.
