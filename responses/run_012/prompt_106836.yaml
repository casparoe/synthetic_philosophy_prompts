      *   *Correction:* Make sure the "Shared Data" doesn't sneak in AH assumptions (e.g., don't say "laws explain the mosaic" as a shared claim, say "laws are invoked to explain the mosaic").
      *   *Correction:* Ensure the "Compromise" section clearly distinguishes between *eligibility* (Lewis) and *ontological fundamentality*.

