answer: |-
  # Accrediting the Originary Standard

  **The Bureau of Intentional Compliance certifies which systems genuinely represent the world and which merely simulate it. The audit trail is exhaustive. The metaphysics are binding.**

  **By [Your Name]**

  The waiting room of the Bureau of Intentional Compliance (BIC) is segregated by certificate class. To the left sit the applicants for Class-D (Derived) status: industrial thermostats, navigation algorithms, and a representative from a logistics corporation seeking derived status for its automated dispatch system. To the right sit the Class-O (Originary) applicants: a golden retriever, a graduate student, and a free-range organic farm. They do not speak to one another. The air filtration system is labeled *Class-D: Air Quality Simulation*.

  The Bureau's mandate is straightforward. Under Standard 101-O, a system possesses genuine intentionality only if its representational states are owned rather than borrowed. A word means *tree* because a human lends it meaning; a human believes *tree* because biology dictates it. The Bureau's inspectors do not measure meaning. There is no gauge for aboutness. Instead, they audit provenance.

  "We cannot inspect the state itself," says Chief Inspector H. Aris, reviewing a clipboard. "Two pressure gauges may behave identically. If one was manufactured by a certified Class-O agent, it is Class-D. If the other grew from a seed, it is Class-O. The difference is not in the needle. It is in the supply chain."

  This provenance rule creates immediate friction. Last Tuesday, a hearing was convened regarding a baroreceptor harvested from a human artery and a mechanical pressure sensor installed in a boiler. Both regulate pressure via negative feedback. Both were denied Class-O status initially. The mechanical sensor was appealed by the manufacturer, who argued that if the biological sensor qualifies, the mechanical one should too. The Bureau denied the appeal. The biological sensor's lineage traces back to a Class-O organism. The mechanical sensor's lineage traces to a factory. The factory is Class-D. The chain of conferral terminates at the human designer.

  "It is not a demotion," says Aris, addressing the manufacturer's lawyer. "Class-D systems are permitted in safety-critical roles. The eye is Class-D. The immune system is Class-D. They represent pathogens reliably. They simply do not own the representation."

  The lawyer, representing the sensor manufacturer, raised the issue of regress during cross-examination. "Your standard requires that Derived intentionality be lent by an Originary agent. Who lent it to the agent?"

  "The agent is biological," Aris replied.

  "Was the biology designed?"

  "No. It evolved."

  "Did the evolutionary process hold intentions?"

  "Evolution is not an agent."

  "Then on what form did evolution apply for Class-O status?"

  The transcript notes a recess was called. Clause 4, Section B of Standard 101-O states that Originary status may be granted via "Biological Continuity" without explicit design intent, provided the system exhibits homeostatic independence. This clause does the most work in the Bureau's docket and withstands the least scrutiny. It allows the Bureau to certify humans while admitting that the process which produced them lacked the capacity to confer meaning.

  Historians of the Bureau note that this forces the certification chain to terminate abruptly. "You have to stop somewhere," says Dr. L. Vane, a retained historian for the BIC. "If you demand an intentional creator for every intentional system, you never certify anything. If you allow biological brute facts, you admit that originality is a label we stick on things when we run out of paperwork."

  The reach of the scheme complicates matters further. Corporations frequently apply for Class-O status to assume liability for autonomous decisions. They are routinely denied; corporations are aggregates of Class-D contracts. Dogs are certified Class-O, though their owners must sign a waiver acknowledging that the dog's beliefs about squirrels are owned by the dog, not the human. Insects are pending. The Bureau has yet to determine if a bee's dance represents location data or merely triggers a reflex. The behavioral output is identical. The internal ownership is unclear.

  Currently, the Bureau is stalled on Application 8940: The Progenitor Specimen. This is a model of the first self-replicating molecule. It exhibits function without design. It possesses biology without lineage. If it is Class-D, there was no one to lend the intentionality. If it is Class-O, it acquired originality without a creator.

  Inspector Aris refuses to comment on the pending ruling. The application file remains open on his desk. The field for *Authorized Conferrer* is blank. The field for *Biological Continuity* references a process that does not exist. Aris picks up a stamp marked *PENDING*. He sets it down. He picks up a pen. He sets it down. The Bureau itself operates under a charter granted by a committee of humans. The committee's certification is valid until 2026. The renewal application requires proof of Originary status for all voting members. The proof requires a lineage trace. The lineage trace leads to the Progenitor Specimen.

  The stamp remains uninked.

  ***

  **BOX: STANDARD 101-O (EXCERPT)**

  **1. Definitions**

  **1.1 Originary Intentionality (Class-O):** The property of a state representing a condition of the world in virtue of the system's own biological or agential constitution. Ownership is intrinsic.

  **1.2 Derived Intentionality (Class-D):** The property of a state representing a condition of the world in virtue of conferral by a Class-O agent. Ownership is on loan.

  **1.3 Conferral Chain:** The documented lineage of intentionality lending. A Class-D system must be traceable to a certified Class-O source without interruption.

  **1.4 Authorized Agent:** A system holding valid Class-O certification capable of lending intentionality. Note: Evolutionary processes do not qualify as Authorized Agents.

  **1.5 Biological Continuity Clause:** Exception allowing Class-O status for systems arising from non-agential processes, provided no design intent is detectable. Validity subject to Bureau review.
