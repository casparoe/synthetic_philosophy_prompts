prompt: |-
  Ok so I need a proper adversarial-collaboration write-up for two people who've been arguing about moral cultures for about a decade and never once agreed on what the disagreement even is.

  Party A is a dignity-culture universalist. She thinks there's a straight moral ranking across the honour / dignity / victimhood triad — dignity wins because it treats worth as equal and non-zero-sum, so both the duel and the pile-on count as failures. Party B is a functionalist. He reckons each of the three is a sensible adaptation to its enforcement environment: honour where nobody will protect you and your reputation is your only insurance, dignity where the state will, victimhood where the real leverage sits with institutions and audiences. On his view, ranking them is a bit like ranking a coat against a pair of sunglasses.

  I want the document they should have produced. Numbered list of claims both can actually sign — about what the three cultures are, what each is doing, what each gets right. Then a disagreements table, each cell phrased so the person it belongs to would nod at it rather than flinch at a strawman. Then the cruxes. I suspect one is whether there's a single moral scale at all, and another is whether the functionalist can condemn honour killings without quietly importing the universalist's scale — but find the real ones, dont just take my guesses. For each crux, give a concrete case or bit of evidence both sides agree would bear on it, with each side's prediction written down in advance, and say plainly if any part of the fight turns out to be about words rather than substance.

  One extra thing I want them to chew on: reframe all three as differing mainly in who the third party is — nobody, the state, or the audience — and tell me whether that reframing survives or collapses under the cases. And make the contextualist say what he'd actually do about a herding village with no reliable police and a daughter who's just been threatened, because thats where his position either earns its keep or doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Goal:** Create an adversarial collaboration write-up for two long-term disagreeing parties (Party A: Dignity-Culture Universalist, Party B: Functionalist/Contextualist).
      *   **Topic:** Moral cultures (Honour, Dignity, Victimhood).
      *   **Party A's Stance:** Universalist hierarchy. Dignity > Honour/Victimhood. Worth is equal/non-zero-sum. Duels and pile-ons are moral failures.
      *   **Party B's Stance:** Functionalist/Adaptationist. No inherent hierarchy. Each fits an enforcement environment (Honour = no state, Dignity = strong state, Victimhood = institutional leverage). Ranking them is category error (coat vs. sunglasses).
      *   **Required Components:**
          1.  Numbered list of agreed claims (definitions, functions, strengths).
          2.  Disagreements table (phrased charitably).
          3.  Cruxes (deep disagreements, not just the user's guesses).
          4.  For each crux: Concrete case/evidence, pre-registered predictions, verbal vs. substantive check.
          5.  Specific Reframing Challenge: "Who is the third party?" (Nobody, State, Audience). Does it hold?
          6.  Specific Practical Challenge: What does Party B advise in a herding village with no police and a threatened daughter?

  2.  **Deconstruct the Positions:**
      *   *Party A (Universalist):* Believes in moral progress. Dignity is objectively better because it aligns with human equality. Honour is barbaric (violence); Victimhood is manipulative (status seeking).
      *   *Party B (Functionalist):* Believes in ecological fit. Honour isn't "bad," it's necessary in stateless zones. Victimhood isn't "weak," it's rational in bureaucratic systems. Morality is downstream of infrastructure.
      *   *The "Third Party" Reframe:*
          *   Honour: Third party is absent/unreliable. You enforce yourself.
          *   Dignity: Third party is the State/Law. It enforces for you.
          *   Victimhood: Third party is the Audience/Institution. You appeal to them to enforce.
      *   *The "Herding Village" Case:* This is the classic Nisbett/Cohen "Culture of Honor" setup. Party A says "Teach her dignity/non-violence." Party B says "Teach her honour/reputation management or move."

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Framework for Adversarial Collaboration on Moral Ecologies."
      *   **Introduction:** Briefly state the purpose (move from talking past each other to mapping disagreement).

      *   **Section 1: Shared Premises (The "Yes" List):**
          *   Need to define the three cultures neutrally.
          *   Acknowledge that all three exist and have internal logic.
          *   Acknowledge that environment matters (even A admits dignity needs institutions).
          *   Acknowledge that mismatches cause pain (honour in a court, dignity in a gang zone).
          *   *Drafting thought:* Ensure A doesn't feel like she's conceding honour is *good*, just that it *exists*. Ensure B doesn't feel like he's conceding dignity is *better*, just that it *functions*.

      *   **Section 2: The Disagreement Table:**
          *   Needs to be charitable.
          *   *Topic 1: Normative Ranking.* A: Hierarchy exists. B: Category error.
          *   *Topic 2: Moral Progress.* A: Moving to dignity is progress. B: Moving to dignity is infrastructure change.
          *   *Topic 3: Condemnation.* A: Can condemn honour killing universally. B: Condemnation requires context or risks hypocrisy.
          *   *Topic 4: Victimhood.* A: It undermines agency. B: It leverages available power structures.

      *   **Section 3: The Cruxes (The "Real" Fight):**
          *   *User's Guess:* Single moral scale? Functionalist condemnation?
          *   *Refinement:* Let's dig deeper.
          *   *Crux 1: The "Ought" vs. "Is" Gap.* Can B prescribe anything without A's scale? If B says "Honour is good for herding," is that descriptive or normative?
          *   *Crux 2: The Transition Problem.* When infrastructure changes, should culture change *immediately* or *gradually*? A says teach dignity now. B says teach dignity only when police arrive, otherwise you get victims.
          *   *Crux 3: The Definition of Harm.* Is the harm in honour cultures the violence, or the *constraint* on individual choice?
          *   *Selection:* Let's go with (1) The Possibility of Context-Free Condemnation and (2) The Safety of Mismatched Agents.
          *   *Evidence/Predictions:* Need specific scenarios.
              *   *Case:* A stateless region getting a police force.
              *   *Case:* An honour-culture immigrant in a dignity-state.

      *   **Section 4: The "Third Party" Reframe:**
          *   Test the hypothesis: Honour (No third party), Dignity (State), Victimhood (Audience).
          *   *Analysis:* It works well for Honour/Dignity. Victimhood is trickier (is it audience or institution?).
          *   *Verdict:* It holds mostly, but Victimhood overlaps with Dignity (institutions). The distinction is *who* you appeal to when the state fails.
          *   *Constraint:* Must say if it survives. It survives but needs nuance on Victimhood.

      *   **Section 5: The Herding Village Challenge (Party B's Turn):**
          *   This is critical. If B says "Do nothing," he's nihilistic. If he says "Kill the threatener," he's endorsing violence.
          *   *B's Answer:* Must be pragmatic. "Signal capability, avoid actual violence if possible, but do not signal weakness." It's about risk management, not moral virtue.
          *   *A's Reaction:* A will hate the "signal capability" part but agree on "avoid violence."
          *   *Collaboration:* They can agree on "Minimize physical harm," but disagree on "Reputation management."

      *   **Section 6: Verbal vs. Substantive:**
          *   Is this just semantics? No. It affects policy (foreign intervention, policing, school discipline).

  4.  **Review and Refine:**
      *   *Tone Check:* Is it dry and academic enough? Yes.
      *   *Charity Check:* Does Party A sound like a moral realist? Does Party B sound like a sociologist/evolutionary psychologist?
      *   *Constraint Check:* Did I include the numbered list? The table? The cruxes with predictions? The third-party reframe? The herding village advice?
      *   *Self-Correction on Cruxes:* The user asked me not to just take their guesses. I need to make sure the cruxes feel derived from the tension between Universalism and Functionalism.
          *   *Crux 1:* Is "Adaptation" morally neutral? (The Is-Ought problem).
          *   *Crux 2:* The cost of transition. (Is it better to be a dignified victim or an honourable aggressor in a transition zone?)
      *   *Refining the Third Party Reframe:* Honour = Self-enforcement (Third party absent). Dignity = State enforcement (Third party neutral). Victimhood = Social/Institutional enforcement (Third party partisan/audience). This distinction is sharp.
      *   *Refining Party B's Advice:* B must not sound like he's endorsing murder. He must sound like a security consultant. "Ensure she is not perceived as an easy target."

  5.  **Final Polish:** Organize with clear headings. Ensure the "Disagreements Table" looks like a table. Make sure the predictions are falsifiable. (Proceed to generate output).

  6.  *(Self-Correction during drafting)*: Wait, I need to make sure I don't solve the disagreement. The point of the document is to *map* it, not resolve it. The "Cruxes" section should highlight where they would bet against each other.

  7.  *(Final check on Party B's Herding Village advice)*: The prompt asks: "make the contextualist say what he'd actually do." This needs to be specific. "Tell her to carry a visible deterrent and cultivate alliances with other males in the kinship network." That's honest functionalism.

  8.  *(Final check on Third Party Reframe)*: Does it collapse? It holds up surprisingly well, but "Victimhood" is the weak link. Is the third party the audience or the institution? It's both. I should note that tension.

  9.  *(Final check on Cruxes)*: User guessed: (1) Single moral scale, (2) Condemning honour killings. I need to find the *real* ones.
      *   Real Crux 1: **The Normative Status of Adaptation.** (Just because it works, is it good?)
      *   Real Crux 2: **The Transition Zone Duty.** (When the state is weak but arriving, do you teach dignity or honour?)
      *   These are better than the user's guesses because they force action, not just philosophy.

