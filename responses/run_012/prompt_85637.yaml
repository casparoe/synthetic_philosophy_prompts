answer: |-
  There is no single, canonical noun in political theory that functions exactly like "gravity" or "alienation" for this specific move. However, you have identified a well-documented rhetorical and cognitive pattern that sits at the intersection of nationalism studies, sociology, and logic.

  The closest existing academic concept is **"Crypto-Primordialism,"** but that describes a scholarly stance rather than the rhetorical move itself. The most precise descriptive label for the phenomenon you are witnessing is **"Asymmetric Constructivism"** (or sometimes **"The Constructivist Exemption"**).

  Here is a careful breakdown of what this move is, why it happens, how it differs from related concepts, and a proposed definition you can use in your reading group.

  ### 1. The Name and Definition

  While you won't find this in a glossary as a fixed proper noun, the term **"Asymmetric Constructivism"** captures the mechanism accurately. It can be defined as follows:

  > **Asymmetric Constructivism:** A rhetorical and cognitive move wherein an actor accepts the social constructionist thesis (that nations, traditions, and identities are invented, imagined, or contingent) as a universal analytical tool, but exempts their own collective identity from the ontological implications of that thesis.
  >
  > In this move, "invention" is treated as a delegitimizing stain when applied to the Other (rivals, colonizers, elites), but is reclassified as "recovery," "organic development," or "continuity" when applied to the Self. The actor maintains that while *other* nations are fabricated, *their* nation is a pre-political reality that has merely been uncovered.

  ### 2. Why There Is No Single Standard Term

  The reason this doesn't have a famous name like "The Veil of Ignorance" is that mainstream nationalism theory (Anderson, Hobsbawm, Gellner) considers this move a **failure of analysis**, not a distinct theoretical position.

  *   **Benedict Anderson** (*Imagined Communities*) argues *all* nations are imagined. To say "yours is imagined, mine is real" is, to an Andersonian, simply being wrong.
  *   **Eric Hobsbawm** (*The Invention of Tradition*) explicitly anticipated your observation. He noted that the *function* of inventing tradition is precisely to create the illusion of continuity. When a nationalist says, "This isn't invented, it's ancient," they are successfully performing the very ritual Hobsbawm described.

  Therefore, theorists usually categorize this under **"Primordialism"** (the belief that nations are ancient and natural) masquerading as **"Constructivism."** Hence the term **Crypto-Primordialism**.

  ### 3. The Core Mechanism: The "Naturalization Fallacy"

  You noted the "weird part" is that people accept the theory at lunch but deny it at dinner. The engine driving this is not just bias, but a specific logical error regarding value.

  For the asymmetry to exist, **"constructed" must equal "fake"** (or at least "illegitimate").
  *   If "constructed" simply meant "made by humans," there would be no need to exempt oneself. (We admit our laws and buildings are made by humans without claiming they are ancient.)
  *   The move relies on the **Naturalization Fallacy**: the assumption that for a tradition to be *valid*, it must be *natural* (i.e., not made).

  Therefore, the move is actually a **Legitimacy Defense**. The speaker is trying to avoid the "stain" of artificiality. They accept the *fact* of construction for the rival because it weakens the rival; they deny the *fact* of construction for themselves because it would weaken them.

  ### 4. Boundaries: What It Is and Isn't

  To use this concept precisely in your group, it helps to distinguish it from nearby phenomena.

  | Concept | How it differs from Asymmetric Constructivism |
  | :--- | :--- |
  | **Ethnocentrism** | Ethnocentrism says "My culture is *better*." Asymmetric Constructivism says "My culture is *real*, yours is *fake*." It is an ontological claim (about existence), not just an evaluative one (about quality). |
  | **Strategic Essentialism** (Spivak) | This requires **conscious cynicism**. A leader knowingly simplifies their group's identity for political gain. Asymmetric Constructivism is often **sincere**. The speaker genuinely feels the "recovery" is authentic and does not notice the contradiction. |
  | **False Consciousness** | This implies a structural deception (the system is lying to you). Asymmetric Constructivism is often agentic; the speaker is the one wielding the theory as a weapon against others while shielding themselves. |
  | **National Exceptionalism** | This usually refers to political values or destiny (e.g., "America is the land of liberty"). Asymmetric Constructivism refers specifically to the **genealogy of traditions** (flags, holidays, roots). |
  | **Methodological Nationalism** | This is when social scientists assume the nation-state is the natural unit of analysis. Asymmetric Constructivism is a rhetorical move used *within* political debate, not necessarily a methodological error in research design. |

  ### 5. Conscious Cynicism vs. Sincere Belief

  Does it require lying? **No.** In fact, it is most potent when sincere.

  *   **Bad Faith (Sartre):** This is the closest philosophical fit. The speaker knows, on some level, that their tradition was also assembled (they just nodded at the theory five minutes prior), but they choose to focus on the "recovery" aspect to avoid the anxiety of groundlessness.
  *   **The "Depth" Illusion:** Many people distinguish between "superficial invention" (a flag designed by a committee) and "deep emergence" (a language evolving over centuries). They sincerely believe their tradition falls into the latter category, even if a historian would classify both as constructed. They are not lying; they are using a different **threshold of authenticity**.

  ### 6. The Mirror Image: Hegemonic Naturalization

  You asked if there is a mirror-image version. **Yes, and it is the dominant form.**

  *   **Minority/Post-Colonial Move:** "Your nation is a colonial fabrication; ours is an ancient recovery." (The move you described).
  *   **Dominant/State Move:** "Our institutions are the natural outcome of Civilization/Reason; your separatist traditions are invented ethnic grievances."

  In the dominant version, the state's traditions are not even called "traditions"; they are called **"Law," "Order," or "Civilization."** They are fully naturalized. The minority's attempt to create a counter-tradition is dismissed as "fabrication" or "radicalism."

  This is discussed by **Partha Chatterjee** in *Nationalist Thought and the Colonial World*. He describes how anti-colonial nationalists accept the "material" modernity of the colonizer (science, administration) as universal, but claim the "spiritual" interior (culture, family, religion) as their own authentic, unconstructed domain. Your reading group is witnessing a variation of this **Inner/Outer split**.

  ### 7. How to Intervene in the Discussion

  If you want to name this move in your group without sounding pedantic, you can frame it this way:

  > "It seems we are practicing **Asymmetric Constructivism**. We are treating 'invented' as a pejorative label that applies to the Other, while reclassifying our own construction as 'recovery.' If we take Anderson seriously, the question isn't *whether* the tradition was constructed, but *which* construction commands loyalty. By exempting ourselves from the 'invented' label, we aren't proving our authenticity; we're just protecting our legitimacy."

  ### Summary for Your Notes

  *   **Best Label:** Asymmetric Constructivism (descriptive) or Crypto-Primordialism (academic critique).
  *   **Core Logic:** Treating "constructed" as a stain of illegitimacy that must be displaced from the Self onto the Other.
  *   **Key Distinction:** Unlike ethnocentrism (mine is better), this claims mine is *ontologically distinct* (mine is real, yours is fake).
  *   **Sincerity:** Usually sincere (Bad Faith), not necessarily cynical (Strategic Essentialism).
  *   **Literature Anchor:** The tension between **Primordialism** (nations are ancient) and **Constructivism** (nations are modern). The move is an attempt to hold both positions simultaneously without cognitive dissonance.

  This phenomenon doesn't have a "Eureka" name because it is considered a bug in the system of nationalist thought, not a feature. But identifying it as **Asymmetric Constructivism** gives you the precision to pinpoint the switch when it happens.
