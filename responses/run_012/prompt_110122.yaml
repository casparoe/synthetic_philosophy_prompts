  **Conscience Capital Management: Investor FAQ**

  **1. How does the Fund establish exchange rates between incompatible normative frameworks?**
  We utilize a proprietary Normalized Value Unit (NVU) to render consequentialist outputs commensurable with deontological constraints. While academic literature disputes the possibility of inter-theoretic comparison, our models treat incommensurability as a liquidity constraint rather than a metaphysical barrier. Spread adjustments apply during periods of high normative volatility. Clients opting for hard incommensurability will see reduced leverage.

  **2. Is a weighted portfolio of ethical theories itself a coherent moral position?**
  Clients often worry that holding 40% Duty Ethics and 60% Utilitarianism constitutes eclecticism rather than conviction. The Fund views coherence as a concentration risk. Diversifying across conflicting first-order principles protects against paradigm shifts in public morality. We do not seek truth; we seek exposure management. Moral residue is accrued as unrealized loss.

  **3. How does the Fund handle theories that posit infinite disvalue for specific actions?**
  Certain frameworks assign infinite negative weight to specific breaches. To prevent portfolio collapse from a single tail event, we employ catastrophe collars. If a deontological constraint threatens infinite liability, the position is automatically capped at the client's maximum solvency threshold. This effectively treats absolute prohibitions as high-premium insurance policies. Infinity is hedged via stop-loss orders.

  **4. What if my preferred theory requires lexical ordering rather than trade-offs?**
  We offer non-fungible tranches for clients who hold lexical priorities. However, please note that lexical tranches reduce rebalancing flexibility. If a lower-order good outperforms a higher-order good, arbitrage is prohibited. This often results in underperformance relative to blended benchmarks during bull markets in utility. Liquidity locks apply until the higher-order duty is satisfied.

  **5. How is uncertainty about probability weights themselves managed?**
  Clients are uncertain not only about which theory is true but about how confident they are in that assessment. The Fund bills for higher-order uncertainty separately. We charge a management fee on the variance of your credence distribution. If you are unsure about your uncertainty, you will be placed in a high-volatility bucket with corresponding advisory fees. Administrative costs apply to infinite regress.

  **6. Can I withdraw capital if my moral convictions change?**
  Redemptions are processed quarterly. However, please be advised that shifting from an agent-neutral to an agent-relative framework may trigger compliance reviews. Significant reallocations require a prospectus update to ensure no regulatory arbitrage between conflicting obligations. Conversion experiences are treated as taxable events.

  **Conscience Capital: Diversify Your Duty.**
