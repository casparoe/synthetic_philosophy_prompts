      *   *Hope nobody asks:* Something about the specific etiology of the asymbolia patients (e.g., "Weren't most of these patients post-cingulotomy for psychiatric reasons, implying baseline motivational deficits unrelated to pain processing?"). This undermines the clean inference.

  8.  **Finalizing the Output Structure:**
