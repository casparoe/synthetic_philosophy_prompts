answer: |-
  # Q&A Prep Sheet: Kelly vs. Expected Utility
  **Audience:** Economists (EUT purists), Statisticians (Bayesian skeptics), Traders (Pragmatic risk managers).
  **Goal:** Defend Kelly/Geometric Rationality as distinct from EUT+Log, not just a special case.

  ---

  ### 1. The "Consumption & Finite Horizon" Objection
  **Target:** Leg 1 (Ergodicity)
  **Who:** Senior Economist
  **Phrasing:** "You're assuming wealth is reinvested in perpetuity. But agents consume. I have to eat, pay rent, and I will die. Once you introduce a consumption stream or a finite terminal date $T$, the time-average growth rate is no longer the sole objective. The optimal strategy becomes CRRA utility with $\gamma$ dependent on your time preference, not necessarily $\gamma=1$ (Log). Why should I ignore my consumption needs to maximize a limit I'll never reach?"

  **2-Minute Reply:**
  "Consumption doesn't break the ergodicity argument; it just redefines the 'wealth' variable. If you view your human capital + financial capital as the total portfolio, consumption is just a reallocation within that portfolio. The ergodicity break happens when you maximize *ensemble* expected wealth at time $T$ rather than the *time-average* growth of your solvency. Even with finite horizons, if you face a sequence of reinvestable decisions, the ensemble average is still dominated by paths you can't take (the ones where you went bust early). Log utility isn't about living forever; it's about ensuring the path you *actually* take doesn't hit zero. If you maximize arithmetic expectation with finite horizons, you still accept bets that guarantee ruin with probability 1 as $N \to \infty$. I'm arguing you should optimize for the path you survive, not the average path of your clones."

  **Weakest Point:**
  This glosses over the math: strictly speaking, with finite $T$ and consumption, Log is not always optimal. You are relying on the intuition that "survival matters" more than the rigorous derivation which only holds asymptotically.

  ### 2. The "Parameter Uncertainty" Objection
  **Target:** Leg 2 (Fractional Kelly)
  **Who:** Trader (Desk Lead)
  **Phrasing:** "You call fractional Kelly a 'fudge.' In the desk, we know our edge estimates are noisy. If I bet Full Kelly on a biased coin where I *think* $p=0.6$ but it's actually $0.55$, I go bust. Fractional Kelly isn't risk aversion; it's a Bayesian adjustment for estimation error. Why are you insisting on Full Kelly when the inputs are obviously uncertain?"

  **2-Minute Reply:**
  "I'm not insisting on Full Kelly on *estimated* edges. I'm insisting that the *criterion* is geometric growth. If you have uncertainty about $p$, the correct Bayesian move is to integrate over your posterior distribution of $p$ *before* calculating the growth rate. That often results in a lower bet size, yes. But calling that 'risk aversion' conflates the utility function with the belief state. Fractional Kelly is often used as a heuristic to say 'I'm scared,' whereas the geometric rationality view says 'My distribution over returns is wider.' The distinction matters: one is a preference, the other is a statement about reality. If you treat it as preference, you double-count risk."

  **Weakest Point:**
  In practice, the distinction between "integrating over posterior" and "having a risk aversion parameter" is mathematically isomorphic in many standard models. The trader won't care about the philosophical distinction if the P&L looks the same.

  ### 3. The "Normative Status of EUT" Objection
  **Target:** All Legs
  **Who:** Decision Theorist / Statistician
  **Phrasing:** "Von Neumann-Morgenstern and Savage give us representation theorems. If your preferences satisfy certain axioms (completeness, transitivity, independence, continuity), you *must* maximize expected utility. If Kelly diverges from EUT, you are violating one of those axioms. Which axiom are you dropping, and why shouldn't I view that as irrationality?"

  **2-Minute Reply:**
  "I'm dropping the Independence Axiom, specifically in the context of sequential decisions. EUT assumes preferences over lotteries are static. But in a sequential reinvestment setting, the 'lottery' changes based on the outcome of the previous round (because your stake size changes). The ergodicity argument shows that the 'independence' of a single bet is an illusion when wealth is multiplicative. I'm not saying EUT is wrong for one-off consumption choices; I'm saying it's the wrong *map* for multiplicative dynamics. It's not irrational to violate an axiom that assumes additive dynamics when the world is multiplicative."

  **Weakest Point:**
  You are effectively arguing for a non-standard decision theory without providing a full replacement axiom set. A theorist can press you on whether your alternative is Dutch-bookable in a broader sense.

  ### 4. The "Correlated Ruin" Objection
  **Target:** Leg 1 (Ergodicity)
  **Who:** Risk Manager / Statistician
  **Phrasing:** "Ergodicity assumes independent draws. But in a crisis, correlations go to one. If everyone is using Kelly, and a systemic shock hits, we all blow up simultaneously. The time average for *you* depends on the survival of the *market*. Doesn't systemic risk revert this back to an ensemble problem where we all share the same fate?"

  **2-Minute Reply:**
  "Systemic risk is just a change in the distribution of returns, not a breakdown of the time-average criterion. If the probability of a systemic wipeout is non-zero, the geometric growth rate correctly penalizes that heavily—much more than EUT does. EUT might say 'take the bet, the expected value is huge,' while Kelly says 'don't take the bet, the geometric mean is negative.' So Kelly actually handles systemic risk *better* than EUT. The fact that everyone blows up together doesn't make the ensemble average relevant; it just means the time-average growth rate for everyone is negative. You still shouldn't take the bet."

  **Weakest Point:**
  If the whole system resets, the "long run" is truncated. If the game ends for everyone, the distinction between time and ensemble averages collapses.

  ### 5. The "Utility of Consumption" Objection
  **Target:** Leg 1 (Ergodicity)
  **Who:** Microeconomist
  **Phrasing:** "We care about utility of consumption, not wealth. Wealth is instrumental. Log utility of wealth implies specific, often unrealistic, intertemporal substitution elasticities. Why should the dynamics of wealth reinvestment dictate my preferences over consumption bundles?"

  **2-Minute Reply:**
  "Because in a reinvestment setting, consumption is a withdrawal from the compounding process. If you maximize expected utility of consumption using arithmetic expectations, you optimize for a 'average' life path that might include periods of zero consumption (ruin). Maximizing geometric growth of wealth is the necessary condition to sustain a constant consumption ratio indefinitely. It's not that I love wealth; it's that geometric growth is the only way to guarantee the *capacity* to consume over a long sequence of decisions without hitting a boundary."

  **Weakest Point:**
  This conflates "sustaining consumption" with "maximizing utility." An agent might prefer a high-consumption short life to a low-consumption long life. EUT captures that trade-off; pure Kelly does not.

  ### 6. The "Relative Performance" Objection
  **Target:** Leg 1 & 2
  **Who:** Trader (Hedge Fund)
  **Phrasing:** "I don't care about my wealth in 50 years. I care about my Sharpe ratio and my P&L relative to the benchmark this quarter. If I half-Kelly and you full-Kelly, you might underperform me for a decade. My investors will fire me before the 'long run' saves you. Isn't Kelly irrelevant for anyone with career risk?"

  **2-Minute Reply:**
  "Career risk is just another form of boundary condition. If getting fired means your wealth process stops (or resets to zero), then that constraint should be baked into your bet sizing. But that's a constraint on the *implementation* of Kelly, not an argument against the *criterion*. If you optimize for quarterly returns (ensemble average of a short window), you are explicitly maximizing the probability of ruin over the longer window. I'm arguing that's irrational for the *agent*, even if it's rational for the *employee*. You're describing an agency problem, not a flaw in geometric rationality."

  **Weakest Point:**
  It admits that Kelly is practically unusable for most professionals. It makes your theory "normatively right but practically wrong," which is a hard sell to a trading desk.

  ### 7. The "One-Shot Life Decision" Objection
  **Target:** Leg 3 (One-Shot as Stream)
  **Who:** Philosopher / Economist
  **Phrasing:** "You say one-shot bets are part of a stream. But some decisions are truly singular. Buying a house, having a child, taking a specific job. These aren't repeatable bets with reinvestable capital. Applying Kelly here is a category error. Surely EUT is the right tool for non-repetitive life choices?"

  **2-Minute Reply:**
  "Those aren't one-shot bets; they're allocations of your total life portfolio. Taking a job isn't a single bet; it's a stream of income decisions that affects your capacity to take future risks. Buying a house is a leveraged bet on location and stability. The 'one-shot' feeling is psychological, not structural. As long as you have future decisions to make—which you always do until you die—your current decision affects the 'stake' you have available for the future. Therefore, the geometric growth criterion applies to the portfolio of life choices, not just financial trades."

  **Weakest Point:**
  This stretches the definition of "reinvestable" too far. You can't "reinvest" the outcome of having a child in the same way you reinvest trading P&L. The analogy breaks down under scrutiny.

  ---

  ### The Question I Hope Nobody Asks
  **Target:** Foundations / Leg 1
  **Who:** The Smartest Person in the Room (Mathematical Economist)
  **Phrasing:** "If geometric growth is the objective rational criterion for sequential decisions, can you provide a representation theorem? EUT has Savage. What are the axioms that uniquely derive Geometric Rationality without just assuming 'reinvestment' as a premise? If you can't axiomatize it, isn't this just a heuristic disguised as a foundation?"

  **Why I Fear It:**
  Because I don't have a clean, universally accepted axiom set that replaces VNM/Savage without smuggling in the assumption of infinite repetition. If I can't prove it's *the* rational standard rather than *a* useful strategy, the economists will dismiss it as a niche portfolio optimization trick, not a decision theory.
