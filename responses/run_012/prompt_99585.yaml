  2.  **Philosophical Groundwork:**
      *   *Elder (Closure):* Standard analytic epistemology (Dretske/Nozick critics). Argument: If closure fails, deduction cannot extend knowledge. Skepticism wins because we can't rule out skeptical hypotheses. Moorean shift: I know I have hands, therefore I know I'm not a BIV.
      *   *Younger (Tracking/Nozick):* Robert Nozick's *Philosophical Explanations*. Knowledge requires sensitivity (tracking). $p$ = "I am in a chair". $q$ = "I am not a scripted character". In the nearest ~$q$ world (scripted), I still believe $q$. So I don't know $q$. But in the nearest ~$p$ world (standing), I wouldn't believe $p$. So I know $p$. Closure fails.
      *   *The "Method" Problem:* Tracking depends on how you individuate the method. If the method is "perception," it fails in the scripted world. If the method is "perception unless scripted," it's ad hoc. The Elder should press this.
      *   *The Concession:* The Elder might force the Younger to admit that tracking makes knowledge too fragile or context-dependent. Or the Younger might force the Elder to admit that closure requires an idealization we don't possess. Given the prompt's request for the Elder not to just wave common sense, the Elder needs a technical bite. The "Method" objection is the strongest technical weapon against Tracking. Let's have the Elder press the individuation of methods to force a qualification from the Younger.

