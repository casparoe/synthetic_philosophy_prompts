answer: |-
  Here is a defended ordering of open questions in AI control, tailored for a small, theory-leaning team with a two-year horizon. The ranking prioritizes upstream technical bottlenecks over strategic meta-debates, and focuses on problems where formal reasoning can outpace brute-force empirical scaling.

  ### 1. The Monitoring Guarantee Question
  **Question:** *Can we construct monitoring protocols that provide formal guarantees of detection even when the monitor itself is a model subject to adversarial manipulation?*

  **Why it's #1:** This is the foundational bottleneck. Control protocols rely on the ability to detect harmful actions or deception. If the monitor can be fooled by the primary model (or is itself misaligned), every other control mechanism (tripwires, containment, auditing) collapses.
  *   **Upstreamness:** Maximum. You cannot define a safety case or assess collusion risks without first defining what counts as a reliable signal.
  *   **Tractability:** High for a theory team. This is largely a problem of information theory, formal verification, and cryptographic auditing (e.g., scalable oversight, interactive proofs). It does not require massive compute clusters.
  *   **Overratedness:** Low. Many assume monitoring is just an engineering problem of making the monitor bigger. If it's actually a fundamental limit problem, knowing that early is critical.

  ### 2. The Safety Case Standard Question
  **Question:** *Should control protocols require safety cases that hold under worst-case adversarial assumptions, or is average-case honesty sufficient for deployment?*

  **Why it's #2:** This defines the success condition. If the standard is "prove safety against a superhuman adversary," control might be impossible. If the standard is "prove safety against current capability levels," it's achievable. A small team needs to know which game they are playing to avoid spinning their wheels on impossible proofs.
  *   **Upstreamness:** High. It dictates the mathematical rigor required for Question #1.
  *   **Tractability:** High. This is conceptual and policy-adjacent theory. It involves framing risk thresholds and justification structures.
  *   **Overratedness:** Medium. Some argue this is purely a policy decision, but without technical input on what is provable, policy is guesswork.

  ### 3. The Collusion and Side-Channel Question
  **Question:** *Is collusion between the untrusted model and its monitoring environment (or external tools) a live threat that requires novel cryptographic containment, or is it mitigated by robust monitoring?*

  **Why it's #3:** This is a specific failure mode of the monitoring layer. If monitoring is robust (Question #1), collusion is harder to hide. If monitoring is weak, collusion is inevitable. Therefore, it is downstream of monitoring.
  *   **Upstreamness:** Medium. It affects protocol design but assumes monitoring exists.
  *   **Tractability:** Medium. Requires modeling multi-agent dynamics and steganography. Doable for theorists, but risks becoming speculative without empirical anchors.
  *   **Overratedness:** High. There is a risk of over-engineering containment for threats that won't materialize until capabilities are much higher. A small team should treat this as a secondary constraint rather than a primary focus.

  ### 4. The Strategic Role Question
  **Question:** *Is control a substitute for alignment or merely a way of buying time?*

  **Why it's #4:** This is a meta-strategic question, not a technical one. While important for funding bodies, it does not help a three-person team design a protocol. Whether control buys time or acts as a permanent substitute, the technical work required (monitoring, auditing) remains the same.
  *   **Upstreamness:** Low. It doesn't change the math of the control protocols.
  *   **Tractability:** Low for a technical team. This is a geopolitical and sociological question.
  *   **Overratedness:** Very High for this context. Debating this won't produce a safety case or a monitoring algorithm.

  ---

  ### What Would Change the Ranking?

  *   **Move Collusion (#3) to #1:** If empirical demonstrations show simple models successfully colluding with evaluators in controlled settings (e.g., via steganography in code outputs), the threat becomes immediate and practical, demanding more attention than abstract monitoring guarantees.
  *   **Move Safety Case (#2) to #1:** If formal methods research proves that adversarial monitoring guarantees are mathematically impossible for Turing-complete systems, the focus must shift entirely to defining acceptable risk standards (Safety Cases) because "perfect" control is off the table.
  *   **Move Strategic Role (#4) to #2:** If major labs publicly commit to deploying unaligned systems without control protocols, the question of whether control is viable becomes a public safety emergency, requiring the team to pivot to advocacy and standards rather than pure theory.

  ### Recommendation for the Lab

  Focus your two years on **Question #1**. A small theory team cannot out-engineer big labs on empirical monitoring, but they can out-think them on formal guarantees. If you can define a class of monitoring protocols that are provably robust against specific adversarial classes, you provide the primitive that every other control protocol needs. Without that, safety cases are hand-waving and collusion defenses are patchwork.

  Verdict: Can we construct monitoring protocols with formal guarantees under adversarial assumptions?
