prompt: |-
  I'm in this AI safety seminar and for the final project I have to pretend I'm advising a small lab that's got about three researchers for two years to spend on "control" work — the stuff that assumes the model might be misaligned and tries to keep it from doing damage anyway, instead of trying to make it actually want the right thing. The prof wants us to argue for which open questions in that area deserve the effort, not just list them, so I need a defended ordering.

  So which open questions in AI control actually matter most, and why? I'm thinking of things like how you get a real guarantee out of a monitor that might itself be a model you dont trust, whether collusion between the untrusted model and its monitor is a live threat or a distraction, and whether a control protocol should come with a safety case that says what the worst outcome is if the model is adversarial the whole episode versus one that only holds if the model is honest most of the time. Also the whole question of whether control is a substitute for alignment or just a way of buying time. But I dont know if those are the right ones or if I'm missing something bigger.

  Rank them for me: which is most upstream of the others, which is tractable for a small theory-leaning team versus needing a big lab, and which is overrated because even a good answer wouldn't change much. And tell me what would move a question up or down the list — like what result or argument over the next couple years would actually change my ranking. American English please, and end with a line that's just "Verdict:" followed by the single question you'd fund first.
