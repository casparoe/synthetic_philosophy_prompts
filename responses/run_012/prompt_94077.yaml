      *   *Scene 3: The Definition.* Elara tries to explain "verisimilitude" without using the word. "My map is wrong, but it's *less* wrong than blank paper." Thorne asks how to measure that. She can't.
      *   *Scene 4: Conclusion.* Thorne offers a compromise that isn't really one. Elara leaves. The fog remains.

