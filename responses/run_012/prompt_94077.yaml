answer: |-
  The ink on Elara's chart was still wet when Master Thorne placed the brass weight on its corner. The smell of gall and salt hung heavy in the scoring chamber. Around the table, the senior cartographers sat with their abacuses ready, faces illuminated by the guttering tallow candles. Outside, the Freeport fog pressed against the glass, thick as wool.

  "Surveyor Kael," Thorne said, his voice gravelly. "Present your submission."

  Kael slid his parchment forward. It was nearly empty. A single island, *St. Jude's*, sat in the center of a vast white ocean. No coastlines, no depth markers, no speculative reefs. Just the rock where the Guild's last ship had docked and returned safely.

  "Features drawn: one," the scribe recited. "Features confirmed by landing: one. Accuracy: one hundred percent."

  A murmur of approval rippled through the room. Kael allowed himself a small, tight smile. He would keep his rank. He would eat well this winter.

  "Surveyor Elara," Thorne said, turning his gaze.

  Elara pushed her chart forward. It was crowded with ink. A sweeping arc of coastline, ten named bays, three capes, a suggested channel through the northern reef. She had spent six months sailing the mist, using sextants and dead reckoning to triangulate shapes she could not touch. She had landed only at the southern tip, the only place safe enough to drop a anchor.

  "Features drawn: fourteen," the scribe said, running a finger down the list. "Features confirmed by landing: one. Accuracy: seven percent."

  The room went cold. Someone sighed. Kael didn't even look at her map; he was already rolling up his own.

  "Seven percent," Thorne repeated. He didn't sound angry. He sounded tired. "You have drawn land where there may be water. You have drawn water where there may be rock. By Guild law, this chart is liable for seizure."

  "It's a map of the *Shadow* archipelago," Elara said, her voice trembling slightly. "No one has charted it because no one has guessed where to look. My map gets them there. Kael's map keeps them in harbor."

  "Kael's map kills no one," Thorne said. "Do you know why the *Meridian* sank off Black Reef ten years ago? Because a surveyor drew a channel there. He was eighty percent sure. He drew it. The captain trusted the ink more than the fog. Thirty souls. Your seven percent error rate is not a statistic, Elara. It is a graveyard."

  "But if we only draw what we know," Elara countered, "we never learn anything new. We starve in sight of plenty."

  "We survive," Thorne said. "That is the Guild's purpose. Not discovery. Survival."

  He stamped her chart with the red seal of *Unverified*. It was a polite way of saying *Trash*.

  Elara waited until the room emptied before she spoke again. Thorne was packing his satchel, his movements slow. She stepped around the table, blocking his path to the door.

  "There has to be a middle ground," she said. "My map is wrong. I know that. Some of those bays are probably illusions of the mist. But it's not *as* wrong as a blank page."

  Thorne paused, holding a roll of parchment. "A blank page makes no claims. It cannot be wrong."

  "It's useless," Elara said. "Look, Master. Imagine two maps. One says there is a continent here, and it draws mountains and rivers that aren't there. The other says there is nothing but ocean. Both are false. But the first one... the first one admits there's *something*. It's groping. It's closer to the shape of the world, even if the details are botched."

  Thorne set the parchment down. He walked to the window, looking out at the invisible harbor. "Closer. You use that word like it's a distance you can measure. How many inches of ink equal a mile of truth?"

  "I don't know," Elara admitted. "But I know my map gets a ship within five miles of the shore. Kael's map leaves them five hundred miles out. If 'truth' is the land, I am standing on the beach. He is still on the horizon."

  "And if your 'beach' is a whirlpool?" Thorne turned. "You speak of closeness as if it is a virtue. But in navigation, closeness without certainty is just speed toward death. You want me to reward you for being confidently wrong."

  "I want you to acknowledge that some errors are better than silence!" Elara's hands slammed onto the table. "There is a reality out there, Thorne. The islands exist whether we land on them or not. My chart resembles that reality more than Kael's does. It has more... likeness. Even if it's false."

  Thorne walked back to her. He picked up her chart, studying the inked lines of the northern reef. "Resemblance. Likeness. These are ghosts, Elara. You cannot weigh them. You cannot put them in a ledger. If I tell the Guild, 'Rate this map higher because it feels truer,' I am not leading them. I am guessing. And I am betting sailors' lives on my guess."

  "So we wait?"

  "We wait until we can land," Thorne said. "Until the feature is confirmed, it is a lie. That is the rule. It is a harsh rule. It stifles men like you. But it keeps the widows from coming to my door."

  He handed the chart back. For a moment, his hand hovered over hers. "You have a gift. You see shapes in the fog. But the Guild does not pay for vision. It pays for footing."

  "But isn't the point of the Guild to find the world?" Elara asked, her voice quieter now. "Not just to catalog the bits we've already stepped on?"

  "The point is to ensure that when we step, the ground is there," Thorne said. "You are talking about a kind of truth that exists in the abstract. A truth of approximation. I am responsible for a truth of impact. When the hull hits the rock, it does not matter how beautiful your approximation was."

  He moved past her to the door. He stopped with his hand on the latch.

  "Keep your map," he said without turning around. "Do not submit it. Do not burn it. Sail it yourself. If you survive, bring me the confirmation. Then your seven percent becomes one hundred percent. Then you win."

  "And if I sink?"

  "Then you were wrong," Thorne said. "And the score remains zero."

  He left. The door clicked shut, leaving Elara alone with the smell of ink and the sound of the foghorn blowing low and mournful outside.

  She looked down at her chart. The ink lines shimmered in the candlelight. She knew, with a certainty that felt like heat in her chest, that the northern channel was real. She could feel the shape of it in her bones, the way the currents twisted, the way the birds flew. It was there. Her map was false in the details—the bay was too deep, the cape too sharp—but it was *true* in its direction. It was closer to the thing-in-itself than the blank paper Kael had submitted.

  But she had no way to prove "closer." There was no instrument to measure verisimilitude. There was only the binary crash of the ship against the reef, or the safe, slow drift of the known waters.

  She rolled the chart up. She could take it to a private captain, someone willing to gamble on a seven percent accuracy rating for the chance of a new trade route. They might make a fortune. They might die.

  Elara blew out the candle. The room plunged into gray darkness, the same color as the sea outside. She tucked the scroll under her arm. She would not submit it. Not yet. But she would not leave it in the archive to gather dust, either.

  She walked out into the corridor, the map heavy against her side. It was a false thing, full of errors. It was also the only thing in the building that pointed toward the future. She stepped into the fog, unable to see her feet, walking anyway, hoping the ground was where she thought it was.
