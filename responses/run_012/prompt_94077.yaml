      *   **Scoring Rule:** Score = (Confirmed Features) / (Total Drawn Features). Blank space costs nothing. Drawing wrong islands penalizes you.
      *   **Consequence:** The perfect score is achieved by drawing very little (e.g., one island, nothing else). High-risk high-reward mapping is penalized.
