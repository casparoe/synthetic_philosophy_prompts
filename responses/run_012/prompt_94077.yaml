  2.  **Deconstruct Verisimilitude in this Context:**
      *   Popper's idea: Truth-likeness. Theory A is false, Theory B is false, but A is *closer* to the truth.
      *   The Guild's Metric: Accuracy/Precision ratio (Confirmed/Total). This favors *conservative* truth (tautologies almost) over *informative* truth.
      *   The Protagonist's Insight: Her map is *more informative* and potentially *closer to the physical reality* (verisimilitude), but the Guild's metric rates it lower because it includes unconfirmed (potentially false) claims.
      *   The Conflict: Safety/Reliability (Guild) vs. Progress/Discovery (Protagonist).
      *   The Philosophical Point: We want theories that say something about the world, but saying something risks being wrong. How do we measure "closeness" when we can't see the whole truth yet?

  3.  **Character Development:**
