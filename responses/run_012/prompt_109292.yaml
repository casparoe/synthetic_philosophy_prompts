answer: |-
  Here is a structured guide for your seminar session, designed to move students from the text's dramatic narrative to the rigid constraints of the Special Composition Question (SCQ).

  ### Seminar Session: The Ontology of the Creature
  **Text:** Mary Shelley, *Frankenstein*
  **Metaphysical Focus:** The Special Composition Question (SCQ)

  #### 1. Introduction: The SCQ as Plot
  Begin by framing the novel not as a warning against technology, but as a narrative record of a composition event. Victor Frankenstein's project is an attempt to force an answer to the SCQ: *Under what conditions do some things (simples/parts) compose a further thing (a whole)?*

  The text provides a timeline:
  1.  **Collection:** Simples exist in graveyards and slaughterhouses.
  2.  **Assembly:** Simples are arranged "creature-wise."
  3.  **Animation:** The "spark" is applied; the eye opens.

  Ask the class: **At which timestamp does the Creature begin to exist?** The answer depends entirely on which metaphysical theory of composition they adopt.

  #### 2. Testing the Options

  **A. Nihilism (e.g., Merricks)**
  *   **The Theory:** Composition never occurs. There are only simples.
  *   **The Reading:** There is no Creature. There are only simples arranged monster-wise.
  *   **The Consequence:** As you noted, the novel's first-person narrative (the Creature's account to Victor) is narrated by *nothing at all*. The suffering described in the hovel is not experienced by a subject, but is merely a distribution of pain-states among simples.
  *   **Seminar Question:** Does Nihilism render the novel an error theory of its own narrative? If the Creature doesn't exist, who is owed what?

  **B. Universalism (e.g., Lewis)**
  *   **The Theory:** Composition is unrestricted. Any plurality composes an object.
  *   **The Reading:** The "Creature" exists as soon as Victor joins two distinct parts. The object exists during the assembly phase.
  *   **The Consequence:** The moment of animation is a "cheat." It adds biological function, but it adds no *ontology*. The object was already there. The horror of the "birth" scene is metaphysically unearned because the being was already present when Victor stitched the finger to the hand.
  *   **Seminar Question:** If Universalism is true, is Victor's transgression one of *creation* or merely *rearrangement*? Does this undermine the title *The Modern Prometheus* (who created man, rather than rearranged him)?

  **C. Van Inwagen's Organicism**
  *   **The Theory:** Composition occurs iff the activity of the parts constitutes a *life*.
  *   **The Reading:** The Creature begins to exist exactly at the moment of biological animation.
  *   **The Consequence:** Victor is not an artificer. Van Inwagen denies the existence of artifacts (tables, statues, assembled corpses). On this view, Victor did not *make* the Creature; he merely manipulated simples until they accidentally caught the "flame" of life. The description of Victor as a "maker" or "creator" is systematically false; he is a gardener of simples, not a builder of wholes.
  *   **Seminar Question:** Can we accept Organicism if it requires us to say Victor's labor produced no object until the moment it escaped his control?

  #### 3. The Moment of Animation: Sharp Boundaries vs. Vagueness
  Shelley insists on a dramatic, sharp transition: *"I saw the dull yellow eye of the creature open; it breathed hard, and a convulsive motion agitated its limbs."*

  *   **The Moderate View:** This supports the intuition that composition is restricted but not vague. There is a fact of the matter about when the object begins.
  *   **The Argument from Vagueness (Lewis/Sider):** If composition is restricted, it must be either sharp or vague. If it is vague, logic breaks down (sorites). If it is sharp, there must be a precise instant (a specific nanosecond) where composition occurs.
  *   **The Tension:** Shelley's narrative gives us the *phenomenology* of a sharp boundary (the eye opening), but metaphysically, this is suspect. Did the composition occur when the heart beat? When the neuron fired? When the lung inflated?
  *   **Discussion Point:** Does the novel's literary need for a dramatic climax force a metaphysical sharpness that cannot be defended? Or does the "spark" suggest that *functional unity* (life) is the sharp cutoff, saving Moderatism from the Argument from Vagueness?

  #### 4. Where the Novel Resists the Reading
  You must press the students on where the text fights back against these clean metaphysical boxes.

  1.  **Resistance to Nihilism:** The Creature's phenomenological unity is undeniable. He reasons, plans, and feels resentment. To say he is "nothing" saves ontology at the cost of making the moral universe of the novel incoherent. The novel resists Nihilism by making the *subjectivity* of the composite the primary evidence of its existence.
  2.  **Resistance to Universalism:** The text treats the pre-animation assembly as *debris*. Victor burns his notes and seeks to destroy the being. If the object existed at assembly, the pre-animation object and the post-animation object are identical. But Victor treats them as distinct in value. The novel resists Universalism by insisting that *life* confers a status that mere *parthood* does not.
  3.  **Resistance to Organicism:** Victor clearly intends to make an artifact. He treats the body as a machine to be engineered. Organicism says artifacts don't exist. The novel resists this by showing that the *intentionality of the maker* (Victor) seems causally relevant to the outcome, even if Van Inwagen says the resulting object is natural, not artificial.

  #### 5. Contribution to the Debate
  What does *Frankenstein* add to the SCQ debate that armchair arguments do not?

  1.  **The Ethical Cost of Error Theory:** Abstract arguments for Nihilism often treat the denial of composite objects as cost-free. *Frankenstein* demonstrates the moral catastrophe of this view. If the Creature is not a composite object, he cannot be a moral patient. The novel forces us to ask: **Is an ontology that cannot ground moral responsibility acceptable?** It suggests that the SCQ is not merely about objects, but about *subjects*.
  2.  **The Phenomenology of Unity:** Arguments from vagueness rely on logical precision. The novel provides the first-person perspective of the composite. The Creature reports a unified consciousness. This suggests that if composition is an illusion, it is an illusion that generates genuine suffering. This raises the stakes for the "error theorist."
  3.  **The Maker's Responsibility:** The SCQ is usually static. *Frankenstein* makes it dynamic. It asks whether the *process* of composition imposes obligations on the composer. If Universalism is true and Victor didn't create a new object, is he less responsible? The novel argues "No."

  #### 6. Conclusion: What is the Creature Owed?
  Close the session by connecting ontology to ethics.

  *   **If Nihilism is true:** The Creature is owed nothing, because there is no one to owe. (The novel rejects this).
  *   **If Universalism is true:** The Creature is owed the same respect as any arbitrary fusion of matter, but Victor's specific responsibility is diluted because he didn't bring a *new* thing into existence.
  *   **If Organicism/Moderatism is true:** The Creature is a distinct living being. Victor is the cause of its existence.

  **Final Takeaway:** *Frankenstein* suggests that the correct answer to the SCQ must be the one that preserves the possibility of moral obligation. If a metaphysical theory implies that the Creature's suffering is not real (Nihilism) or that Victor's role is illusory (Universalism/Organicism), the theory fails to capture the reality of the situation. The novel contributes the insight that **composition may be grounded in moral status as much as physical cohesion.** We ought to treat the Creature as a whole because to do otherwise is to commit a moral violence, regardless of the mereological facts.
