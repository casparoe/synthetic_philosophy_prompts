answer: |-
  Here is the 90-minute session plan.

  ### 1. Pre-Conditions: What Must Be in Place (First 10 Minutes)
  Before you introduce the animals, you must establish two conceptual distinctions. If you skip this, the biologists will reduce the talk to neuroanatomy and the economists to revealed preference, and you will lose the room.

  *   **Distinction A: Nociception vs. Suffering.**
      *   *Do not* define consciousness. Define the *gap*.
      *   *Say:* "Nociception is a circuit that detects damage and triggers avoidance. Suffering is what it *feels like* for that circuit to run. A missile has nociception (heat seeking); we assume it doesn't suffer. We need to find the line between the circuit and the feeling."
  *   **Distinction B: Mechanism vs. Function.**
      *   *Say:* "We are looking for functional markers that *correlate* with suffering, not the neural mechanism that *produces* it. We are looking for the smoke, not the fire, because we can't agree on what the fire looks like."

  **Why this matters:** This prevents the biologists from immediately arguing about ganglia counts and prevents the economists from arguing that "preference satisfaction" equals "welfare."

  ### 2. The Core Example: The Crayfish Anxiety Trade-Off (Minutes 10–40)
  Build the entire session on the **Fossat et al. (2014) Crayfish Anxiety Study**.
  *   **The Setup:** Crayfish are placed in a tank with a lit area (risky) and a dark area (safe). Normally, they prefer the dark.
  *   **The Stressor:** When subjected to a mild electric shock (predator mimic), they hide longer and show "anxious" body language (rubbing antennae).
  *   **The Kicker:** When given a benzodiazepine (anti-anxiety drug like Valium), they return to normal exploration *despite* the shock history.
  *   **Why this example:**
      *   **Needs:** It must show a *trade-off* (safety vs. food/exploration), not just withdrawal. It must show *pharmacological sensitivity* (the state is chemical, not just mechanical). It must be an animal with a nervous system radically different from mammals (ganglia, not cortex).
      *   **Doesn't Need:** Do not use a mammal (triggers Resemblance Trap too early). Do not use a simple reflex like a cockroach leg twitch (triggers Reflex Trap too obviously). Do not use verbal report (impossible).

  **The Sequence:**
  1.  **Show the Data (10 min):** Present the behavior and the drug effect. Ask: "If you saw this in a rat, would you say it was anxious?" (They will say yes). "What about here?"
  2.  **Let Them Commit (10 min):** Ask them to vote: Is this suffering? Most biologists will lean "yes" because of the drugs. Most economists will lean "yes" because of the risk trade-off.
  3.  **The Reveal (10 min):** Show a simulation of a simple robot programmed with the exact same logic (Avoid risk unless drug disables risk-aversion module). Ask: "Does the robot suffer?"

  ### 3. Defusing the Traps (Minutes 40–65)
  This is where you make them feel the traps they just stepped into. Do not lecture; interrogate their previous vote.

  **Trap 1: The Reflex Trap (Behavior = Experience)**
  *   *Where it surfaced:* When they voted "Yes" based on the avoidance behavior.
  *   *How to defuse:* Ask the biologists: "You study homeostasis. If a bacterium swims away from acid, is it avoiding pain or maintaining gradient?"
  *   *The Move:* Force them to articulate the *difference* between the crayfish and the bacterium. If they say "complexity," press them: "How much complexity buys a feeling?"
  *   *The Payoff:* They realize behavior alone is insufficient. They need a marker that rules out "zombie" mechanisms. This pushes them toward **integrated trade-offs** (sacrificing one drive for another) rather than simple avoidance.

  **Trap 2: The Resemblance Trap (Structure = Capacity)**
  *   *Where it surfaced:* When they hesitated because crayfish lack a cortex.
  *   *How to defuse:* Ask: "If we built a silicon chip that replicated the crayfish ganglia exactly, would it feel?" If they say no, ask: "If we replicated a human cortex on a chip, would it feel?"
  *   *The Move:* Highlight that structural similarity is a heuristic, not a proof. If consciousness is functional, the hardware matters less. If it's biological, the hardware matters more.
  *   *The Payoff:* They see that relying on "mammal-likeness" is an appeal to intuition, not evidence.

  **The Theory-Neutral Pivot:**
  *   *Instruction:* "Stop asking 'Which theory of consciousness is right?' (IIT, GWT, etc.). Instead, ask: 'What evidence would proponents of *all* those theories accept as relevant?'"
  *   *Answer:* **Flexible, integrative decision-making under uncertainty.**
      *   IIT cares about integration.
      *   Global Workspace cares about broadcasting information to multiple systems.
      *   Predictive Processing cares about weighting error signals.
      *   *All three* look at the crayfish trade-off as a better signal than a knee-jerk reflex.
  *   *Result:* You haven't solved consciousness, but you've narrowed the evidence to what is scientifically robust across frameworks.

  ### 4. The Shift: From Metaphysics to Decision Theory (Minutes 65–80)
  Now move the goalposts. This is the crucial turn for the economists and pragmatists.

  *   **The Problem:** "We have established that even with perfect data on the crayfish, we cannot logically prove there is 'someone home.' The conceptual gap remains. Better microscopes won't close it."
  *   **The Shift:** "So we stop asking 'Is it conscious?' and start asking 'What is the cost of being wrong?'"
  *   **The Framework:** Introduce the **Precautionary Principle** as a decision matrix, not an ethical command.
      *   *Error Type 1:* Treat them as conscious, they aren't. (Cost: Wasted resources, restricted research).
      *   *Error Type 2:* Treat them as non-conscious, they are. (Cost: Inflicting massive suffering).
  *   **The Burden of Proof:** "In law and policy, when the stakes of Error Type 2 are infinite (suffering) and Error Type 1 are finite (money/effort), the burden of proof shifts. We don't wait for proof of consciousness; we require proof of *non*-consciousness before inflicting harm."
  *   **Why this lands:** Economists understand risk weighting. Biologists understand regulatory burdens. You are framing moral status as a **risk management problem**.

  ### 5. Assessment & Non-Settlement (Minutes 80–90)

  **How to know they "got it" (The Assessment):**
  Do not ask them to define consciousness. Give them a **Policy Vignette** on a slip of paper:
  > *"A new pest control method kills aphids instantly. It saves billions in crops. Aphids show no trade-off behavior, only reflex withdrawal. A new study shows aphids have a neural receptor homologous to the crayfish anxiety receptor, but we don't know what it does."*
  >
  > *Question:* **Do we ban the pesticide?**
  > *   A) No, because there is no behavioral evidence of suffering.
  > *   B) Yes, because the neural resemblance creates too much risk.
  > *   C) We regulate it, because the cost of error Type 2 outweighs the cost of error Type 1, despite the empirical gap.

  *   *Correct Signal:* If they choose **C** and can articulate that the decision isn't based on *knowing* the aphids suffer, but on *managing the uncertainty* of suffering, they have grasped the session's point. If they choose A or B, they are still stuck in the empirical trap (waiting for data) or the resemblance trap.

  **What We Are Deliberately Not Settling:**
  End with this explicit boundary setting:
  1.  **We are not settling the Hard Problem.** We are not claiming to know *why* or *if* the crayfish feels.
  2.  **We are not settling the Moral Status.** We are not saying crayfish have rights equal to humans. We are saying their interests enter the calculation as non-zero probabilities.
  3.  **We are not claiming this is permanent.** This is a placeholder strategy for a gap that might be empirically uncloseable.

  **Closing Line:**
  "The goal of this session wasn't to tell you which animals suffer. It was to show you that waiting for certainty before acting is itself a decision—one that places the burden of proof on the victim rather than the agent. Next month, read the Seneca paper on risk, not the neuroscience paper on nociceptors."
