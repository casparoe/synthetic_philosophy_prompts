answer: |-
  You are right to be wary of the standard reading. The usual seminar on *Memento* treats memory as the glue of personal identity: lose the memory, lose the self. That is Lockean, and it is rather too tidy. If you want to run this through Borges's *A New Refutation of Time*, you must push harder. Borges is not merely saying we forget; he is arguing that succession itself is a fallacy. He posits a universe of atomic instants, unconnected by a flowing river of time, where the 'I' is merely a convenient fiction we stitch over the gaps.

  *Memento* is the perfect vehicle for this because it does not just describe this state; it forces the viewer to inhabit it. However, if you press the film against Borges's metaphysics, you will find that where Borges finds liberation in the denial of time, Nolan finds horror. Ultimately, the film does not illustrate Borges's thesis so much as it prosecutes it. It demonstrates that while we might metaphysically be isolated presents, we cannot ethically survive as such.

  **The Atomisation of the Present**

  Borges's argument rests on the idealist claim that only the present exists. The past is a memory (and thus a present mental state); the future is an expectation (also a present mental state). Therefore, there is no succession, only a series of independent 'nows'.

  Leonard Shelby is this thesis made flesh. For Leonard, there is literally no succession. When he wakes up, the previous moment is ontologically dead to him. He exists in a series of sealed chambers. In Borges's prose, this is an intellectual exercise, a way to dissolve the burden of history and death. In *Memento*, it is a phenomenological prison. The film dramatises the Borges view better than the essay precisely because it shows the *anxiety* of the isolated present. Borges writes calmly of timelessness from his study; Leonard sweats through it in motel rooms.

  Consider the tattoos. For Borges, the self is a fiction. For Leonard, the self is a text written on the skin. He externalises the bundle of perceptions that Hume and Borges claim constitute the 'I'. He does not carry his history internally; he wears it. This suggests that without the artificial scaffolding of notes and ink, there is no Leonard at all. There is only a biological organism reacting to stimuli in a perpetual now. In this sense, the film validates Borges: there is no inner continuity, only the artifacts we arrange to pretend there is.

  **The Structure as Metaphysics**

  You asked if the reverse-chronology is a trick. If you treat it merely as a puzzle for the audience to solve, then yes, it is a gimmick. But if you treat it as an epistemic constraint, it is doing heavy philosophical lifting.

  By denying the audience the 'before', Nolan forces us into a Borges-ian universe. We see the effect without the cause. We encounter a corpse, then later we see the death. In a standard narrative, time is the medium through which causality flows. In *Memento*, causality is reconstructed backwards. We are trapped in the present moment of the screening, just as Leonard is trapped in the present moment of his experience. We cannot learn from the past because we have not seen it yet. This structure refutes the idea that understanding comes from chronology. It suggests that meaning is imposed retrospectively. Leonard imposes meaning on his chaos by constructing a narrative of revenge; we impose meaning on the film by reconstructing the timeline. Both are acts of fiction-making over a void of disconnected facts.

  **The Ethical Refutation**

  Here is where the reading must become awkward. Borges denies time to escape the tragedy of loss. He wants to believe that if time is not real, then death is not real, and the suffering of separation is an illusion. *Memento* suggests the opposite: if time is not real, morality is impossible.

  The engine of the film is revenge. But revenge is a diachronic concept. It requires that the person being punished now is identical to the person who committed the offence then, and that the person exacting justice now is the victim who suffered then. If Borges is right, and there is only a series of isolated presents, then 'Leonard' at time T1 is not 'Leonard' at time T2.

  If Leonard is a new man every five minutes, Teddy is not being punished for a crime committed against Leonard's wife. He is being punished by a stranger who has been manipulated into believing a grudge exists. The film quietly admits this. Leonard knows, on some level, that he is manufacturing the puzzle. He chooses to ignore facts that would solve the case because he needs the *purpose* the case provides.

  This implies a persisting agent who makes choices across time. To choose to forget is a temporal act. It requires a will that spans the gap between the moment of knowledge and the moment of ignorance. If there were truly no succession, Leonard could not 'decide' to set up Teddy for future execution. There would be no 'future' to set him up for. The very act of self-deception proves that Leonard knows, metaphysically, that he is continuous enough to be held responsible, even if he claims he isn't.

  This creates a profound tension. The metaphysics of the film (isolated presents) contradicts the ethics of the film (desert and guilt). For the ending to land as a tragedy, we must believe Leonard is damning himself. But if time is refuted, there is no self to damn. The film needs the self to be real to sustain the horror, even if the plot demonstrates the self is fragile. It dramatises the necessity of the fiction. We *need* to believe in the persisting self, not because it is metaphysically true, but because without it, we are monsters. Leonard becomes a monster precisely because he exploits the gaps in his own continuity. He uses his condition to wash his hands of blood, while simultaneously ensuring his hands remain bloody.

  **Funes and the Inability to Forget**

  A brief glance at *Funes the Memorious* sharpens this. Funes remembers everything; he perceives every leaf on every tree as a unique, eternal event. He cannot sleep because sleep implies forgetting; he cannot generalise because generalisation requires ignoring differences. Funes is paralysed by the fullness of time. Leonard is paralysed by the emptiness of time.

  Borges presents Funes as a tragic figure, crushed by the weight of reality. But in *Memento*, forgetting is not a relief; it is a weapon. Leonard is not Funes's opposite; he is Funes's dark mirror. Funes cannot construct a narrative because he has too much data; Leonard constructs a narrative because he has too little. Both show that a human relationship with time requires a filter. We need to forget enough to move forward, but remember enough to remain moral. Leonard fails the latter, Funes the former.

  **Conclusion: The Refutation of the Refutation**

  So, does the film refute Borges? I would argue it does, but tragically. Borges writes that refuting time is a 'mental exercise' that brings a 'strange happiness'. He hopes that by denying succession, he denies loss.

  *Memento* shows that denying succession denies meaning. If there is no time, there is no consequence. If there is no consequence, there is no justice. Leonard lives in a world where he cannot be held accountable by his own memory, so he becomes a vigilante without a cause, a judge without a law. The film suggests that while Borges might be metaphysically correct that the self is a fiction and succession is suspect, we cannot live as if it were true. To live ethically is to believe in the lie of continuity.

  The awkward reading you requested is this: *Memento* demonstrates that the Borges-ian view of time is existentially unsustainable. Leonard is not liberated by his timelessness; he is enslaved by it. He must constantly rebuild the prison of his own identity to keep functioning. The film posits that the 'fiction' of the self is not an error to be corrected by philosophy, but a necessary condition for morality. We must pretend we are the same person who was wronged ten years ago, or else revenge is just murder. We must pretend we are the same person who made a promise, or else loyalty is just habit.

  Nolan gives us a protagonist who lives the metaphysical truth Borges proposes, and reveals it to be a hell. The reverse chronology is not just a trick; it is the mechanism of this revelation. It denies us the comfort of causality until it is too late. By the time we understand the timeline, we understand that Leonard has chosen to remain in the dark. He chooses the fiction over the truth. In doing so, he affirms that while time may be a refutable concept, it is an indispensable one. We are condemned to believe in the river, even if it is made of separate drops.
