      *   *The Ethical Problem:* Revenge requires identity over time. If Leonard is a new man every five minutes, why punish the "John G" of the past? Why punish Teddy now for what happened then? The film *needs* a persisting self for the moral stakes to work, even if the metaphysics suggests otherwise.
      *   *The Structure:* Reverse chronology isn't just a gimmick; it forces the audience into Leonard's epistemic state. We don't know the cause, only the effect. It mimics the "isolated present" experience.

  5.  **Drafting the Response (Iterative Process):**

