      *   *Section 1: The Isolated Present (Borges realised).* Discuss how Leonard lives the "series of independent facts." Unlike Borges's abstract argument, Leonard *feels* the atomisation of time. The tattoos and polaroids are externalised memory, replacing the internal flow of time.
