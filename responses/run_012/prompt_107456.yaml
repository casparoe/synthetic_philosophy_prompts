answer: |-
  The principle that best systematizes your verdicts is the **Principle of Complicit Participation**, which judges actions wrong if they either cause expected harm or constitute non-inert membership in a harmful practice, but it conflicts with your intuition on offsets by implying that verified neutralization removes the wrongness.

  This principle combines a consequentialist limb (expected marginal harm) with a deontological limb (complicity in harmful schemes). It handles your causal cases (6, 7, 8) through the consequentialist limb: where thresholds or pivot probabilities create positive expected harm, the act is wrong proportional to that expectation. It handles your non-causal cases (1, 2, 5, 9) through the deontological limb: even where marginal impact is negligible, you are barred from joining practices known to be harmful because doing so makes you an accomplice to the collective outcome. It resolves your waste exception (4) by defining "inert membership" as participation that does not signal demand or sustain the practice; eating waste fails to signal demand, whereas standard participation (9) reinforces the norm even if the specific harm is already locked in.

  The principle disagrees with your verdict on offsets (3). If an offset genuinely cancels the emissions, the consequentialist limb registers zero expected harm. Unless the act of flying itself sustains the aviation industry's social license independent of emissions (an empirical claim about norm signaling), the deontological limb also clears you, as you have remediated your complicity. Your feeling that it remains "somewhat wrong" suggests a residual integrity constraint—that some acts are inherently corrupting regardless of net outcome—which this principle treats as permissible provided the net harm is zero. Regarding empirical dependencies, your verdict on the beef burger (2) versus the drive (1) may depend on whether you view animal suffering as a distinct category of harm that triggers complicity more readily than carbon emissions; if the principle treats all harms uniformly, it cannot explain why (2) is worse than (1) without empirical data on magnitude, but if it allows for harm-type weighting, it fits your intuition without needing that data.

  For the unlisted case where you perform the act and recruit two friends, the principle verdicts this as significantly wrong, exceeding the sum of three individual acts. Your recruitment multiplies the expected harm causally (three increments instead of one) and amplifies the complicity limb by actively spreading the harmful norm, transforming you from a passive participant into an organizer of the harmful practice.
