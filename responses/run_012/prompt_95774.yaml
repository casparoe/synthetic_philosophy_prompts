  6.  **Final Polish:** Check against constraints (no reading list, explicit table, specific sections).

  *(Self-Correction on the Biological Point)*: I need to be careful not to say "biology disproves nationalism." Biology explains *kin* altruism. Nationalism is *cultural* group selection or extended phenotype. The user knows this. The point is that the *analogy* claims they are the same mechanism. They aren't. One is genetic, one is memetic/institutional. That's the break.

  *(Self-Correction on the Smuggle)*: The user suspects the family analogy supports cosmopolitanism. I need to validate this. The "Good Samaritan" constraint on families is the key. You can prioritize your kid, but not to the point of letting others die. This maps to "sufficientarianism" or a threshold in global justice.

