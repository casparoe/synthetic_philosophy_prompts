          *   Shared History $\rightarrow$ National History/Mythos.
      *   *Biological Critique (User's specific interest):* In biology, family = genetic relatedness ($r$). In nations, $r \approx 0$ between random citizens. So the biological basis for partiality (kin selection) is absent.
      *   *Structural Critique:* Families are intimate; nations are abstract. Families are voluntary/exit-able (mostly) in adulthood; nations are coercive/border-controlled. Families have asymmetric duties (parent-child); nations imply symmetric duties (citizen-citizen).
      *   *The "Smuggle":* Families are *embedded* in a wider moral community. A good family teaches kids to care about outsiders. A family that hoards everything is "selfish." Does this imply nations should too?

  3.  **Drafting the Response - Section by Section:**

