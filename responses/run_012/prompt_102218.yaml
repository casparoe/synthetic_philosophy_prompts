answer: |-
  ### Essay Question

  **Course:** Philosophy of Biology (Upper-Level Seminar)
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the question below. Do not begin by defining the etiological or causal-role accounts; assume the reader knows them. Begin immediately by applying them to the cases.

  **The Cases:**
  1.  **P37 Protein:** Ancestrally selected for flagellar motor structure. The flagellum is now lost. P37 persists and sequesters a toxin, but deletion shows no fitness difference; the gene is likely lingering due to drift.
  2.  **EgtA Enzyme:** An existing enzyme acquired a new activity required for growth on a synthetic carbon source. This was selected over 2,000 generations in a lab flask. The population cannot survive outside the lab.
  3.  **Artificial Vesicle:** A chemically synthesized system with a pump and catalyst maintaining a pH gradient. It functions reliably but has no ancestry and does not reproduce.

  **The Question:**
  For each of the three cases, determine whether the etiological account and the causal-role account assign a *function* to the trait or component, and specify what constitutes a *malfunction* in each view. In your analysis of Case 2, you must address whether the etiological account requires *natural* selection or if *any* selective history suffices.

  Conclude by arguing whether the disagreement between these two accounts is a substantive disagreement about the nature of biological traits, or merely a verbal recommendation about how to use the word "function." You must address whether either account can be stretched to cover all three cases without silently abandoning its core distinguishing claim.

  ***

  ### Model Answer

  The etiological and causal-role accounts diverge sharply when history and current utility come apart. In Case 1 (P37), the etiological account assigns the function "structural component of the flagellar motor," because that is the effect for which the trait was historically selected. The current sequestration of toxins is merely a beneficial side effect, not a function. Consequently, P37 cannot malfunction regarding sequestration; it can only malfunction regarding motor structure, which is now impossible given the loss of the flagellum. The trait is effectively functionless in the present context, despite its causal contribution. Conversely, the causal-role account assigns the function "sequestering toxin," as this is the current contribution to the system's capacity. Malfunction occurs if sequestration fails. Here, the etiological view prioritizes historical identity over current utility, while the causal-role view prioritizes current organization over history.

  Case 2 (EgtA) exposes a tension within the etiological account regarding the source of selection. The enzyme was selected for a new activity, but via artificial laboratory conditions. A strict etiological account, such as Millikan's, typically requires *natural* selection to ground proper functions; on this reading, EgtA retains its ancestral function, and the new activity is merely a disposition. However, if the etiological account is loosened to accept *any* selective history (including artificial), it assigns the new activity as the function. The causal-role account faces no such difficulty; the enzyme contributes to growth on the synthetic substrate, so that is its function. If the etiological theorist insists on natural selection only, they must classify a trait essential for the organism's current survival as functionless, which seems counterintuitive. If they accept artificial selection, they blur the line between biological evolution and design.

  Case 3 (Artificial Vesicle) eliminates history entirely. The etiological account cannot assign a function because there is no history of selection or reproduction; the system is ahistorical. To assign a function here, the etiological account would have to stretch "selection" to include the chemist's intent, but this collapses the distinction between biological function and intended use. The causal-role account assigns the function "maintaining pH gradient" without hesitation, as the components contribute to the system's capacity. Malfunction is simply the failure of the pump or catalyst.

  Can either account be stretched to cover all three cases? If the etiological account stretches to include Case 3 (designer intent) and Case 2 (artificial selection), it ceases to be a theory about *biological* history and becomes a theory about *design* history. It loses its ability to distinguish between a heart beating and a pump pumping. If the causal-role account stretches to cover Case 1's intuition that P37 is "really" for the motor, it must incorporate history, thereby losing its claim to be a purely dispositional, ahistorical account.

  Therefore, the disagreement is substantive, not merely verbal. It is not just about how to use the word "function," but about what kind of property function *is*. The etiological account claims function is a historical relational property (like "being a descendant"), while the causal-role account claims it is a dispositional property (like "being fragile"). If we merge them to cover all cases, we erase the ontological distinction between traits that exist because of past consequences and traits that exist because of current capacities. A unified theory that covers P37, EgtA, and the Vesicle equally well would likely fail to explain why biological norms differ from mechanical norms. Thus, the friction between the accounts reveals a genuine ambiguity in the nature of biological organization, not a simple terminological dispute.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of Case 1 (P37) – 5 Marks**
  *   **5 marks:** Correctly identifies that Etiological assigns the ancestral motor function (current sequestration is a side effect) and Causal-Role assigns the sequestration function. Correctly notes that for Etiological, malfunction is impossible/irrelevant now, whereas for Causal-Role, malfunction is sequestration failure.
  *   **3 marks:** Identifies the functional assignments but fails to address the specific implications for *malfunction*.
  *   **0-1 marks:** Merely defines the theories without applying them to P37.
  *   *Common Error:* Claiming P37 has "no function" on the Causal-Role account because it provides no fitness benefit.

  **2. Analysis of Case 2 (EgtA) & Selection Type – 5 Marks**
  *   **5 marks:** Explicitly addresses the **Natural vs. Artificial Selection** constraint. Notes that strict Etiological views may deny function here (requiring natural selection), while relaxed views accept it. Contrasts this with Causal-Role's indifference to the source of selection.
  *   **3 marks:** Discusses the case but treats artificial selection as identical to natural selection without noting the theoretical risk.
  *   **0-1 marks:** Ignores the artificial nature of the selection.
  *   *Common Error:* Assuming the Etiological account automatically accepts artificial selection without qualification.

  **3. Analysis of Case 3 (Vesicle) & Stretching Claims – 5 Marks**
  *   **5 marks:** Correctly notes Etiological fails on Case 3 (no history/reproduction). Crucially, addresses the **"Stretching" constraint**: argues that expanding Etiological to cover design collapses its distinction from Causal-Role (or vice versa).
  *   **3 marks:** Identifies that Etiological fails on Case 3 but does not analyze the cost of "stretching" the theory to fix it.
  *   **0-1 marks:** Claims both accounts work equally well for the vesicle.
  *   *Common Error:* Arguing that the chemist's intent counts as "etiology" without acknowledging this undermines the biological specificity of the account.

  **4. Conclusion: Substantive vs. Verbal – 5 Marks**
  *   **5 marks:** Argues the disagreement is **substantive** (ontological difference between historical vs. dispositional properties). Uses the failure to "stretch" accounts (from Section 3) as evidence that merging them loses explanatory power.
  *   **3 marks:** Concludes it is substantive but relies on intuition rather than the "stretching" argument required by the prompt.
  *   **0-1 marks:** Concludes it is merely a verbal disagreement/choice of definition.
  *   *Common Error:* Dismissing the debate as "just semantics" without engaging with the ontological commitments regarding history.
