prompt: |-
  I'm the de facto IRB for a small DIY cognitive-science collective -- about a dozen of us, we run online experiments plus the occasional in-person thing, there's no real ethics board, it's just me. Every protocol that goes out has to pass my sign-off, usually in twenty minutes on a weeknight, and I'm the one who then has to look the researcher in the eye and either approve it or explain why not. (Assume I'm offline, I definately can't look anything up.)

  The part I keep getting stuck on is consent. What actually makes a consent valid? The cases that keep biting us:

  - cover stories and deception (participants think its a memory task, it's really about cheating)
  - incentives and dependency (we recruit from our own Discord, we pay people, sometimes we run studies with people who want to be in the group)
  - competence (someone shows up drunk, or mid-crisis, or is just really young)
  - consent to X when you only know Y -- broad consent, open-ended follow-ups, "we might contact you later about related studies"

  Please write me a decision procedure I can actually run on a protocol: the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it stops with "this is a values call, a human has to own it." Keep whatever the philosophy of consent actually says that survives being turned into a checklist -- the difference between consent as an inner state and consent as an act that changes whats permitted, whether deception only wrecks consent when the hidden fact is one a reasonable person would care about, whether paying someone can ever be coercive when they were already badly off, competence as a cliff versus a slope. Don't hand me a reading list, I can't fetch it.

  We have an internal word, "consent-shaped," for a yes that ticks every box but that everyone involved knows wasn't really consent. The procedure has to catch those, and it has to be honest about which of its steps are just judgment calls wearing a lab coat.

  Then run it on three cases: a deception study; a paid study recruited through our own Discord where a couple of participants are basically dependent on the money; and a study I personally really want to run that the procedure has to tell me no on. Finish by telling me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** De facto IRB for a small DIY cognitive-science collective (approx. 12 people).
      *   **Constraints:** Offline (no lookups), quick turnaround (20 mins/weeknight), face-to-face accountability (must look researcher in the eye).
      *   **Core Problem:** Validating *consent* in tricky scenarios (deception, incentives/dependency, competence, broad consent).
      *   **Specific Terminology:** "Consent-shaped" (technically compliant but ethically hollow).
      *   **Deliverables:**
          1.  A decision procedure (checklist/flowchart style) grounded in philosophical reality but actionable.
          2.  Must identify hard "No"s vs. "Values Calls."
          3.  Must catch "consent-shaped" interactions.
          4.  Run the procedure on three specific cases (Deception, Dependency/Incentives, Personal Bias/Conflict).
          5.  Conclude with the limitations of the procedure.
      *   **Tone:** Pragmatic, rigorous, honest, no fluff, no reading lists.

  2.  **Deconstruct "Valid Consent" (Philosophical/Ethical Core):**
      *   *Information:* Does the participant know what they are getting into? (Disclosure)
      *   *Comprehension:* Do they understand it? (Capacity)
      *   *Voluntariness:* Are they free to say no without undue penalty? (Coercion/Undue Influence)
      *   *Specific vs. General:* Is the scope clear?
      *   *Deception:* When is lying okay? (Only if the truth would invalidate the study *and* the risk is minimal *and* debriefing occurs).
      *   *The "Consent-Shaped" Trap:* When the form is signed, but the power dynamic or context makes the "yes" meaningless.

  3.  **Drafting the Decision Procedure (The "20-Minute Gate"):**
      *   *Structure:* Needs to be sequential. Early failures stop the process.
      *   *Step 1: Capacity (The Cliff/Slope).* Is the person capable *now*?
      *   *Step 2: Disclosure & Deception (The Lie Test).* What are they being told? Is it a lie? If so, why?
      *   *Step 3: Voluntariness (The "No" Cost).* What happens if they quit?
      *   *Step 4: Scope (The Future).* What are they signing up for later?
      *   *Step 5: The "Consent-Shaped" Smell Test.* (Crucial for the user's specific concern).

      *Refining the Steps:*
      *   *Capacity:* Don't just ask "Are they 18?" Ask "Are they impaired *now*?" (Drunk/Crisis).
      *   *Deception:* Needs a specific justification. "Would the study fail if they knew?" + "Is the harm trivial?" + "Debrief plan."
      *   *Incentives:* Distinguish *inducement* (good) from *coercion* (bad). If the money is survival money, it's coercive.
      *   *Scope:* "Contact later" needs an opt-out that is as easy as the opt-in.

  4.  **Developing the "Values Call" vs. "Hard No" Distinction:**
      *   *Hard No:* Minors without guardian consent, intoxicated participants, irreversible harm, deception without debrief, coercive payment (survival money).
      *   *Values Call:* Mild deception with good debrief, moderate payment for students, broad consent for low-risk follow-up. These require the researcher to own the risk.

  5.  **Addressing the "Consent-Shaped" Concept:**
      *   This needs a specific step. It's about power dynamics and social pressure.
      *   Question: "If they say 'no', do they lose something essential (friendship, income, status)?"

  6.  **Running the Cases:**
      *   *Case 1: Deception (Memory vs. Cheating).*
          *   Passes Capacity.
          *   Fails Disclosure *unless* Deception Justification is met.
          *   Key: Debriefing. If no debrief -> Hard No. If debrief + low risk -> Values Call.
      *   *Case 2: Discord/Dependency.*
          *   Passes Capacity.
          *   Fails Voluntariness if payment is "survival" money.
          *   Social pressure (Discord community) adds to the "Consent-Shaped" risk.
          *   Verdict: Likely Hard No or Heavy Mitigation (cap payments, anonymous exit).
      *   *Case 3: The Researcher's Pet Project (Conflict of Interest).*
          *   This needs to trigger the "Values Call" or "Hard No" based on bias.
          *   If the researcher is pushing too hard, voluntariness is compromised.
          *   Verdict: Hard No on *you* approving it. Needs external review or recusal.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Is this too bureaucratic for a DIY group?
      *   *Fix:* Keep the language direct. Use "Stop" and "Proceed" markers. Acknowledge the "20-minute" constraint.
      *   *Critique:* Did I address the philosophy?
      *   *Fix:* Explicitly mention *why* a step exists (e.g., "Consent is an act, not a feeling").
      *   *Critique:* The third case needs to be one the procedure says "No" to, even if the user wants it.
      *   *Fix:* Make the third case about *your* involvement. If you are the IRB *and* the researcher, that's a structural failure. The procedure must flag the conflict of interest.

  8.  **Final Polish:**
      *   Ensure the "Consent-Shaped" detection is prominent.
      *   Make sure the limitations section is honest (procedures don't replace judgment).
      *   Check tone: Professional but empathetic to the DIY context.

  9.  **Final Review against constraints:**
      *   Offline friendly? Yes.
      *   No reading list? Yes.
      *   Three cases run? Yes.
      *   Limitations included? Yes.

  *(Self-Correction on Case 3)*: The prompt asks for "a study I personally really want to run that the procedure has to tell me no on." This implies a conflict of interest or an ethical boundary I'm trying to cross. I should frame the procedure to catch *my* bias. If I am the IRB, I cannot approve my own study. That is a structural "Hard No."

  *(Self-Correction on Philosophy)*: Ensure the distinction between "inner state" (do they feel okay?) and "performative act" (did they agree to the terms?) is clear. The procedure focuses on the *conditions* of the act, because we can't read minds.

  Let's build the "DIY-IRB Consent Gate."

  *Step 1: Capacity (The Threshold)*
  *Step 2: Information (The Lie Test)*
  *Step 3: Voluntariness (The Exit Cost)*
  *Step 4: Scope (The Horizon)*
  *Step 5: The "Consent-Shaped" Smell Test (The Power Dynamic)*

  Okay, ready to write.
answer: |-
  Here is the **DIY-IRB Consent Gate**. It is designed for a 20-minute review, offline, with no administrative buffer. It treats consent not as a signature, but as a *transactional condition* that must be met for the research to be permissible.

  ### The Philosophy Embedded in the Gate
  1.  **Consent is a barrier, not a form.** A signature is evidence, not the event. The event is the voluntary agreement of a competent agent.
  2.  **Deception is a loan, not a theft.** You borrow the participant's trust with the obligation to repay it (debrief). If you cannot repay, you cannot borrow.
  3.  **Coercion is about the "No".** Payment is not coercive unless the refusal of payment causes harm or the acceptance is the only way to avoid harm.
  4.  **Competence is a slope, not a cliff.** We assess capacity *at the moment of consent*, not just by age or diagnosis.

  ---

  ### The Decision Procedure

  Run these five steps in order. If you hit a **STOP**, the protocol is rejected. If you hit a **CALL**, you must document the justification and own the risk.

  #### Step 1: The Capacity Threshold (Competence)
  *Question:* At the exact moment of consent, does the participant have the functional ability to understand the task and the consequence of quitting?
  *   **Check:** Are they intoxicated, in acute crisis, or below the age of legal majority (without guardian consent)?
  *   **Check:** Is the task complexity within the range of their demonstrated comprehension?
  *   **STOP:** If yes to intoxication/crisis/minor. (Hard No).
  *   **CALL:** If they are neurodivergent or have fluctuating capacity. You must verify comprehension via a "teach-back" method (ask them to explain the study back to you). If they pass teach-back, Proceed.

  #### Step 2: The Lie Test (Deception & Cover Stories)
  *Question:* Is the participant being told the truth about the primary purpose and risks?
  *   **If YES:** Proceed to Step 3.
  *   **If NO (Deception is used):** You must answer **all three** of the following to proceed. If you fail any, it is a **STOP**.
      1.  **Necessity:** Would the study be scientifically impossible if they knew the truth? (If "no," you cannot deceive).
      2.  **Risk Floor:** Does the deception hide any risk greater than what they encounter in daily life? (If "yes," you cannot deceive).
      3.  **Repayment:** Is there a guaranteed, immediate debrief where they are told the truth and offered the option to withdraw their data *after* knowing the truth?
  *   **CALL:** If all three are met, this is a Values Call. You are trading transparency for validity. You must ensure the debrief is scriptable and mandatory.

  #### Step 3: The Exit Cost (Voluntariness & Incentives)
  *Question:* If the participant says "No" or quits halfway, what do they lose?
  *   **Check:** Do they lose money already earned? (Must be pro-rated).
  *   **Check:** Do they lose access to essential services, community standing, or future opportunities?
  *   **Check:** Is the payment amount high enough that a reasonable person in their economic position could not afford to refuse it?
  *   **STOP:** If payment is "survival money" (e.g., rent/food money for an unemployed participant). This is coercive.
  *   **STOP:** If quitting results in social penalty within the collective (e.g., "You didn't finish the study, so you can't come to the meetup").
  *   **CALL:** If payment is significant but not survival-level. You must cap the payment to avoid undue influence.

  #### Step 4: The Horizon (Scope & Future Contact)
  *Question:* What are they consenting to beyond this specific session?
  *   **Check:** Does "contact us later" mean "we might email you" or "we have your data forever"?
  *   **Check:** Is the opt-out for future contact as easy as the opt-in?
  *   **STOP:** If consent is "open-ended" for high-risk procedures (e.g., "We might do brain stimulation later").
  *   **CALL:** If consent is for low-risk follow-up (e.g., surveys). You must provide a one-click unsubscribe or a specific contact method that is not the researcher's personal DM.

  #### Step 5: The "Consent-Shaped" Smell Test (Power & Pressure)
  *Question:* Look at the relationship between Researcher and Participant.
  *   **Check:** Is the researcher in a position of authority over the participant (teacher/student, employer/employee, community leader/member)?
  *   **Check:** Is the recruitment happening in a space where saying "no" is socially awkward (e.g., a small Discord channel where everyone knows everyone)?
  *   **Check:** Are *you* (the IRB) the researcher?
  *   **STOP:** If **You** are the researcher. You cannot objectively review your own protocol. (Hard No).
  *   **CALL:** If there is a social power dynamic. You must implement **Double-Blind Consent** (a third party handles consent) or **Anonymous Exit** (they can quit without the researcher knowing who quit).

  ---

  ### Running the Cases

  #### Case 1: The Deception Study (Memory vs. Cheating)
  *Protocol:* Participants think they are testing memory. Actually, you are testing if they cheat when they think no one is watching.
  *   **Step 1 (Capacity):** Adults, sober. **Pass.**
  *   **Step 2 (Lie Test):**
      *   *Necessity:* Yes, knowing it's about cheating stops the cheating.
      *   *Risk Floor:* Low. Embarrassment is possible, but no physical/legal harm.
      *   *Repayment:* Researcher plans a debrief.
      *   *Result:* **Values Call.**
      *   *Condition:* The debrief must be rigorous. You must explicitly ask: "Now that you know this was about cheating, do you want your data destroyed?" If the script doesn't include that option, it becomes a **STOP**.
  *   **Verdict:** Approved *only if* the post-experiment data withdrawal option is hard-coded into the protocol.

  #### Case 2: The Discord Dependency (Paid, Internal Recruitment)
  *Protocol:* Recruiting from the collective's Discord. Pay is $50/hr. Two participants are known to be financially unstable and rely on study pay for rent.
  *   **Step 1 (Capacity):** Adults. **Pass.**
  *   **Step 2 (Lie Test):** No deception. **Pass.**
  *   **Step 3 (Exit Cost):**
      *   *Payment:* $50/hr is high for a DIY collective.
      *   *Dependency:* You know they need this for rent.
      *   *Result:* **STOP.**
      *   *Reasoning:* When payment shifts from "compensation for time" to "essential income," voluntariness collapses. They cannot say "no" without harming their housing stability. This is coercive.
      *   *Fix:* Cap payment at a standard rate (e.g., $20) that is attractive but not survival-critical, OR exclude participants known to be in financial crisis (which requires screening that might violate privacy).
  *   **Verdict:** Rejected. The incentive structure creates a coercive environment for vulnerable members.

  #### Case 3: The Researcher's Pet Project (You want to run it)
  *Protocol:* You have a hypothesis about group conformity. You want to run it on the collective. You are the IRB.
  *   **Step 1 (Capacity):** **Pass.**
  *   **Step 2 (Lie Test):** **Pass.**
  *   **Step 3 (Exit Cost):** **Pass.**
  *   **Step 4 (Horizon):** **Pass.**
  *   **Step 5 (Smell Test):**
      *   *Check:* Are you the researcher? **Yes.**
      *   *Check:* Are you the IRB? **Yes.**
      *   *Result:* **STOP.**
      *   *Reasoning:* This is the definition of "Consent-Shaped." Even if you act in good faith, the participants know you hold the keys to their approval. They cannot freely refuse the De Facto IRB. The power dynamic invalidates the voluntariness of the consent.
  *   **Verdict:** Rejected. You must recuse yourself. Another member must act as IRB for your study, or you must not run it.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Measure Suffering.** This gate checks the *conditions* of consent, not the *outcome* of the experiment. A perfectly consented participant can still have a traumatic experience. You need a separate adverse event reporting mechanism.
  2.  **It Cannot Fix Structural Power.** If your collective is inherently hierarchical (e.g., you control the funding), Step 5 flags it, but the procedure doesn't solve it. It just forces you to acknowledge the coercion.
  3.  **It Cannot Replace Intuition.** The "Consent-Shaped" step relies on your ability to smell social pressure. If you are tone-deaf to social dynamics, this checklist will give you a false sense of security.
  4.  **It Cannot Handle Emergencies.** If a participant has a breakdown mid-study, this protocol doesn't tell you what to do. You need a crisis plan separate from consent.

  **Final Instruction:** When you sign off, you are not signing that the science is good. You are signing that the *transaction* was fair. If you wouldn't want your own mother to be the subject under these exact conditions, the answer is No.
