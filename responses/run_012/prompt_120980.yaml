answer: |-
  1. The early warning system operationalizes subsidiarity as a presumption of local competence triggered by political objection, diverging from the treaty's substantive comparative-effectiveness test that requires affirmative proof of Union added value. This shifts the focus from whether the EU *can* act better to whether national chambers *want* it to act at all.
  2. The mechanism structurally fails to register cross-border spillovers and the interests of non-nationals because it aggregates national partisan views rather than transnational welfare, representing a defect of the mechanism's design rather than the principle itself. This blindness inherently privileges domestic status quos over potential Union-scale efficiencies or protections for mobile citizens.
  3. Given the partisan motives and collective action hurdles, the system functions more as a political signalling device than a rigorous subsidiarity test, constituting a debased realization of the principle that sacrifices substantive accuracy for political feasibility. It allows parliaments to voice discontent without requiring them to prove the Commission's legal error regarding competence levels.
  4. Reversing the burden serves the presumption of competence reading and would block proposals lacking explicit evidence of Union added value, while making objections binding serves the republican reading by blocking any proposal facing significant local contestation. The former filters based on evidentiary strictness, whereas the latter filters based on the intensity of political opposition.
  5. The episode demonstrates that subsidiarity is too indeterminate for substantive administration, leaving its only stable content as procedural political contestation rather than technocratic efficiency calculations. This outcome favours the republican reading, as the proposal fell due to contested political will rather than a definitive proof that the Union could not achieve the objective better than member states.
