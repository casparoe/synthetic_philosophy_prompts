prompt: |-
  I run a tiny two-person board game studio — abstract strategy stuff, two players, perfect information, no luck — and I've got alot of prototypes in a drawer and no good way to tell which ones are broken before anyone plays them. We start a new one every few weeks and I'm the one who signs off on what goes to a publisher, so it needs to be something I can defend to my business partner, who is not going to sit through a proof. The one tool I half-remember from a maths blog is the strategy-stealing thing, and I'd like to turn it into an actual checklist I can run on a prototype in an afternoon. Let me say the idea back to you so you can see where I'm at: suppose the second player had a guaranteed winning plan. The first player can make some throwaway first move that can't possibly hurt them — the argument assumes there's always one of those — and then spend the rest of the game pretending to be the second player, following that same winning plan. Now both players are winning, which is impossible, so the second player never had a winning plan, so if the game can't be a draw the first player must be able to force a win. That's it, that's all I've got, and I know the throwaway-move bit is where it's supposed to go wrong (chess, zugzwang, I remember that much).

  What I need from you:

  1. The procedure, in order. As questions I ask about a prototype, with what counts as a pass, what a fail tells me, where it stops with a verdict, and where it stops because the question is a judgment call I have to make myself. Written for someone who hasn't done a proof since undergrad.

  2. The extra-move step is the one I care about most: how do I actually test whether an extra move can ever hurt me in a given game? I want something I can do at the table with cardboard, not a proof. And tell me when the honest answer is that I can't check it and the procedure is stuck there.

  3. What each verdict licenses. If it stops at "the second player can't have a winning plan" and my game can be drawn, what have I learned? If it stops at "the first player wins" but hands me no strategy, is that a diagnosis I can act on or just trivia? Its not like I can build a bot from it or verify it by playing.

  4. The fixes, and whether they work. Swap/pie rule, komi, giving the second player a head start, auctioning the first move. My guess is that the moment I add any of those the argument stops applying — but does that mean the game is now fair, or only that I've lost the only tool I had? Tell me how to check a fix rather than just asserting it works.

  5. Then run it on three of mine: (a) a connection game on a rhombus where each player owns two opposite sides and wins by joining them; (b) a shrinking-board game where you must move every turn and lose when you can't move, so moves are sometimes poison; (c) a placement game we've spent eight months on, both players placing identical stones and scoring at the end, where playtests say it's dead even but I have a bad feeling. If the procedure kills (c), say so.

  6. Where the procedure can't decide, mark it as such. I'd rather have a checklist that says "here a human decides" than one that pretends every step is mechanical.

  Last thing: don't sell me a consensus that isn't there. Separate what's actually settled about this argument from what people who know the area still argue about — for instance whether a game that's provably a first-player win is unshippable, or whether a swap rule really does neutralise the advantage, or whether a proof that gives you no strategy should count as knowing anything at all. If you're not sure whether something is contested, say that rather than picking a side.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Runs a tiny two-person board game studio (abstract strategy, 2-player, perfect information, no luck).
      *   **Problem:** Has many prototypes, needs a way to filter "broken" games before playtesting/pitching. Needs to defend decisions to a business partner (non-mathematical).
      *   **Current Knowledge:** Remembers "strategy-stealing argument" from a math blog. Understands the basic logic (P1 steals P2's winning strategy) but knows the "extra move" assumption is the weak point (zugzwang).
      *   **Needs:**
          1.  A step-by-step procedure/checklist (questions, pass/fail, verdicts).
          2.  Specific guidance on testing the "extra move" condition (pass vs. zugzwang) practically at the table.
          3.  Interpretation of verdicts (what does "P1 wins" mean if no strategy is provided?).
          4.  Evaluation of fixes (Swap/Pie, Komi, etc.) and how to check if they work.
          5.  Application to three specific prototypes (Connection/Rhombus, Shrinking-board/Zugzwang, Placement/Scoring).
          6.  Honesty about uncertainty/contested areas (don't fake consensus).
      *   **Tone:** Practical, rigorous but accessible (no formal proofs), honest about limitations.

  2.  **Deconstruct the Strategy-Stealing Argument (SSA):**
      *   *Core Logic:* If P2 has a winning strategy, P1 can make a random move, then pretend to be P2 using that strategy. If the strategy calls for playing on the spot P1 already occupied, P1 plays elsewhere (since having an *extra* piece is never bad). Contradiction -> P2 cannot have a winning strategy.
      *   *Assumptions:*
          1.  Symmetric goals (both trying to do the same thing).
          2.  Perfect information, no luck.
          3.  Finite game (no infinite loops).
          4.  **Monotonicity (The "Extra Move" Condition):** Having an extra piece on the board is never a disadvantage.
          5.  No Draws (usually required to conclude P1 *wins*, otherwise just "P2 doesn't win").
      *   *Limitations:* It's non-constructive. It tells you P1 *can* win, not *how*. It doesn't tell you if the game is *fun* or *balanced* in practice (human error).

  3.  **Drafting the Procedure (Requirement 1 & 2):**
      *   Need a flowchart style.
      *   *Step 1: Symmetry.* Are rules identical?
      *   *Step 2: Draws.* Can the game end in a draw?
      *   *Step 3: Monotonicity (The Hard Part).* Does an extra piece ever hurt?
      *   *Verdicts:*
          *   Fail Symmetry -> SSA doesn't apply.
          *   Fail Monotonicity -> SSA doesn't apply (Zugzwang possible).
          *   Pass SSA + No Draws -> P1 Win (Theoretical).
          *   Pass SSA + Draws Possible -> P2 cannot force win (P1 Win or Draw).
      *   *Testing Monotonicity:* This needs practical heuristics. Look for blocking, crowding, "own pieces as obstacles."

  4.  **Interpreting Verdicts (Requirement 3):**
      *   "P1 Win" (Theoretical): Means the game is *theoretically* broken for competitive play without handicaps. It doesn't mean humans will see it. It means the *design* has a flaw in symmetry.
      *   "P2 No Win": Means P1 has the advantage. If draws are possible, it might still be a drawish game.
      *   Actionability: If SSA says P1 wins, you *must* add a balancing mechanism (Pie Rule, etc.) before publishing as a competitive abstract.

  5.  **Evaluating Fixes (Requirement 4):**
      *   *Pie Rule (Swap):* Effectively lets P2 choose to be P1 after seeing the first move. Neutralizes first-move advantage. SSA doesn't apply *after* the fix because the game is no longer symmetric in the same way (P2 has the option to swap).
      *   *Komi/Handicap:* Changes the winning condition or starting state. SSA usually breaks because goals aren't symmetric anymore.
      *   *Checking the Fix:* You can't use SSA to check the fix. You have to playtest or use AI. The fix removes the *theoretical guarantee*, not necessarily the *practical advantage*.

  6.  **Applying to Prototypes (Requirement 5):**
      *   *(a) Connection on Rhombus (Hex-like):* Symmetric? Yes. Draws? No (Hex theorem). Monotonicity? Yes (extra stone helps connect). *Verdict:* P1 Win. Needs Pie Rule.
      *   *(b) Shrinking Board/Zugzwang:* Symmetric? Yes. Draws? Maybe (last mover loses). Monotonicity? **NO.** Moving is sometimes poison. Having an extra piece might block your own retreat. *Verdict:* SSA Fails. Game could be P2 win or Draw.
      *   *(c) Placement/Scoring:* Symmetric? Yes. Draws? Possible. Monotonicity? **Maybe.** If pieces block scoring or crowd, extra piece hurts. If playtests say even, but SSA says P1 win, there's a tension. If pieces are identical and just score, usually monotonic. But if they block *own* scoring zones, not monotonic. *Verdict:* Likely SSA applies -> P1 advantage or Win. If playtests say even, human complexity hides the theoretical win. *Decision:* Kill or Fix.

  7.  **Addressing Uncertainty/Consensus (Requirement 6):**
      *   SSA is mathematically sound *if* assumptions hold.
      *   Whether a "P1 Win" game is unshippable is a design opinion, not math. (Go has komi, Chess is drawn but P1 has initiative).
      *   Whether Pie Rule *fully* balances is debated (some games still favor the swap choice).
      *   Non-constructive proofs: Mathematically valid, practically frustrating.

  8.  **Refining the Output:**
      *   *Tone Check:* Keep it professional, direct, slightly conversational (studio owner to studio owner).
      *   *Structure:* Follow the 6 points exactly.
      *   *Clarity:* Avoid jargon like "monotonicity" without defining it simply ("Extra Piece Test").
      *   *Honesty:* Explicitly state where the math stops and design judgment begins.

  9.  **Self-Correction/Nuance during drafting:**
      *   *Correction on (c):* In placement games, sometimes placing a piece blocks your own potential high-value spot. This violates monotonicity. I need to make sure the user checks if pieces *obstruct* the owner.
      *   *Correction on Fixes:* The SSA doesn't apply to the Pie Rule game *as a whole*, but it applies to the state *after* a no-swap. I need to be careful not to say SSA proves the Pie Rule works. SSA proves the *base game* is broken, which justifies the Pie Rule.
      *   *Zugzwang:* Make sure to distinguish between "moving hurts" (Zugzwang) and "having a piece hurts" (Monotonicity violation). SSA cares about "having a piece." Though often they correlate.
      *   *Verdict on (c):* User says "playtests say dead even." SSA might say P1 win. I need to explain that SSA is about *perfect* play. Humans might not find the win. But for a competitive abstract, theoretical fairness matters. I should advise fixing it.

  10. **Final Review against constraints:**
      *   Checklist format? Yes.
      *   Extra-move test practical? Yes.
      *   Verdict licensing clear? Yes.
      *   Fixes evaluated? Yes.
      *   3 Prototypes run? Yes.
      *   Uncertainty marked? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a practical guide to applying the Strategy-Stealing Argument (SSA) as a design tool, not a mathematical exercise. I have structured this exactly as you asked: a procedure, a test for the weak point, an interpretation guide, a fix evaluation, and a run-through of your prototypes.

  I have also marked areas where mathematical certainty ends and design judgment begins.

  ---

  ### 1. The Procedure (The Checklist)

  Run these questions in order. If you hit a **STOP**, the argument cannot be used. If you reach the **VERDICT**, you have a theoretical diagnosis.

  **Q1: Is the game symmetric?**
  *   **Check:** Do both players have the exact same moves available (ignoring board orientation), the exact same pieces, and the exact same winning condition?
  *   **Pass:** Yes (e.g., both trying to connect North-South vs East-West on the same board shape).
  *   **Fail:** No (e.g., one player attacks, one defends; or different piece sets like Chess).
  *   **Result:** If **Fail**, **STOP**. SSA does not apply. You must rely on playtesting/AI.

  **Q2: Can the game end in a draw?**
  *   **Check:** Is it possible for the board to fill up or a loop to occur where neither player meets their winning condition?
  *   **Pass:** No. Someone must win. (e.g., Hex, Gomoku).
  *   **Fail:** Yes. A draw is a possible outcome. (e.g., Tic-Tac-Toe, many scoring games).
  *   **Result:**
      *   If **Pass**: Proceed to Q3.
      *   If **Fail**: Proceed to Q3, but note that the final verdict will be weaker (see Section 3).

  **Q3: The "Extra Piece" Test (Monotonicity)**
  *   **Check:** Is it possible for having an *extra* piece of your own color on the board to be a *disadvantage* compared to having an empty space there?
  *   **Pass:** No. An extra piece is either neutral or helpful.
  *   **Fail:** Yes. An extra piece can block you, clog your mobility, or reduce your score.
  *   **Result:** If **Fail**, **STOP**. SSA does not apply (Zugzwang territory). If **Pass**, proceed to Verdict.

  **VERDICT:**
  *   **If Q2 was No (No Draws):** The First Player (P1) has a forced win.
  *   **If Q2 was Yes (Draws Possible):** The Second Player (P2) cannot have a forced win. The game is either a First Player win or a Draw.

  ---

  ### 2. Testing the "Extra Piece" (The Extra-Move Step)

  This is where the math usually breaks in game design. In math, "having a piece" is abstract. In your prototype, it's cardboard. You need to find **Negative Utility**.

  **The Tabletop Test:**
  Set up a mid-game position where Player A is struggling.
  1.  **The Control:** Let Player A make a move.
  2.  **The Variant:** Reset. Give Player A an *extra* stone already placed on the board in a spot that *seems* useful (e.g., near their goal), then let them make the same move.
  3.  **The Comparison:** Is there any scenario where the Control position allows a win that the Variant position blocks?

  **Look for these specific red flags:**
  *   **Blocking:** Does your own piece block your own path? (Common in mazes or movement games).
  *   **Crowding:** Does your own piece limit where you can place future pieces? (Common in area control).
  *   **Scoring Penalties:** Do you lose points for pieces left over? (Common in efficiency games).
  *   **Capture Mechanics:** Can your own piece be captured by the opponent to *their* benefit? (If yes, having it on the board is a liability).

  **When to admit you're stuck:**
  If the interaction between pieces is complex (e.g., "This piece boosts that piece, but blocks the other"), you cannot mechanically verify this in an afternoon.
  *   **Mark this:** "Monotonicity Uncertain."
  *   **Action:** Assume SSA *might* apply. Treat it as a risk. Do not sign off until you have AI verification or deep playtesting.

  ---

  ### 3. What Each Verdict Licenses

  You need to explain this to your partner. The SSA is a **existence proof**, not a **strategy guide**.

  **Verdict A: "P1 has a forced win" (Q2 No Draws, Q3 Pass)**
  *   **What it means:** In a game between two gods who never make mistakes, Player 1 wins 100% of the time.
  *   **What it doesn't mean:** It does not tell you *how* P1 wins. It does not mean humans will notice.
  *   **Actionable Diagnosis:** The game is **theoretically broken** for competitive play. It is unshippable as a "fair" abstract strategy game without a balancing mechanic. You cannot fix this by tweaking rules slightly; you must change the turn structure or symmetry (see Section 4).
  *   **Defense to Partner:** "Mathematically, the second player is playing a losing game from turn zero. We cannot publish this as a competitive title without a swap rule."

  **Verdict B: "P2 cannot force a win" (Q2 Draws Possible, Q3 Pass)**
  *   **What it means:** Player 1 has the advantage. The worst P1 can do is draw. P2 can never force a win.
  *   **Actionable Diagnosis:** The game is **asymmetric in advantage**. It may still be fun casually, but ranked play will favor P1.
  *   **Defense to Partner:** "The second player is at a structural disadvantage. We risk the game being solved as a draw or a P1 win. We need a handicap or swap mechanism."

  **Verdict C: "SSA Does Not Apply" (Fail Q1 or Q3)**
  *   **What it means:** The math is silent. The game could be a P1 win, P2 win, or Draw.
  *   **Actionable Diagnosis:** You are on your own. You must rely on playtesting data and AI analysis.
  *   **Defense to Partner:** "The mathematical safety net doesn't work here because [Zugzwang/Asymmetry]. We have to trust the playtest data."

  ---

  ### 4. The Fixes, and Whether They Work

  If SSA kills your game, you need a patch. Here is how to evaluate them.

  **A. The Pie Rule (Swap Rule)**
  *   **Mechanism:** P1 makes a move. P2 can choose to swap colors and become P1, or stay P2.
  *   **Does SSA still apply?** **No.** The game is no longer symmetric at the start. P2 has a option P1 does not.
  *   **Does it fix the fairness?** **Consensus: Yes, theoretically.** It forces P1 to make a move "neutral" enough that P2 doesn't want to steal it.
  *   **How to check:** Run the SSA checklist on the game *after* the swap decision. If the underlying mechanics still pass the "Extra Piece" test, the Pie Rule effectively neutralizes the first-move advantage.
  *   **Risk:** Some games are still "solveable" enough that P1 can find a move that is *slightly* better for P1 than P2, even with the swap. This is contested. Some designers argue Pie Rule is sufficient; others argue it just shifts the burden to P1 to find the "perfect" opening.

  **B. Komi / Handicap / Head Start**
  *   **Mechanism:** P2 gets points, or an extra piece, or moves twice at start.
  *   **Does SSA still apply?** **No.** Symmetry is broken (Q1 Fail).
  *   **Does it fix the fairness?** **Contested.** SSA tells you P1 wins, but it doesn't tell you *by how much*. If P1 wins by 1 point, Komi of 1 fixes it. If P1 wins by 10, Komi of 1 does nothing.
  *   **How to check:** You cannot check this with SSA. You must playtest or use AI to measure the *margin* of victory. SSA only tells you a margin exists, not its size.

  **C. Auctioning the First Move**
  *   **Mechanism:** Players bid resources for the right to go first.
  *   **Does SSA still apply?** **No.**
  *   **Does it fix the fairness?** **Yes, economically.** It transfers the "win advantage" into a resource cost.
  *   **How to check:** Ensure the resource bid doesn't break the rest of the economy.

  **Summary on Fixes:** Adding a fix invalidates the SSA checklist (because symmetry breaks). This is good. It means the *proof* of a broken game no longer holds. However, it does not *prove* the game is now fair. It only removes the theoretical guarantee of a P1 win. You still need to playtest the fix.

  ---

  ### 5. Running the Procedure on Your Prototypes

  Here is the assessment based on your descriptions.

  **(a) Connection game on a rhombus (Hex-like)**
  *   **Q1 Symmetric?** Yes.
  *   **Q2 Draws?** No. (On a rhombus/hex board, a connection game where players own opposite sides cannot end in a draw; one chain must block the other).
  *   **Q3 Extra Piece?** Yes. In connection games, an extra stone of your color never hurts your ability to connect. It might be redundant, but it is never a liability.
  *   **Verdict:** **First Player Win.**
  *   **Diagnosis:** This is mathematically identical to Hex. It is a proven P1 win.
  *   **Action:** **Do not ship without a Pie Rule.** If you ship this as "White moves first," you are shipping a solved game. Apply the Pie Rule, then the SSA no longer applies, and the game is viable.

  **(b) Shrinking-board game (Move every turn, lose if stuck)**
  *   **Q1 Symmetric?** Yes.
  *   **Q2 Draws?** No. (Finite moves, last player loses).
  *   **Q3 Extra Piece?** **FAIL.** This is a classic Zugzwang mechanism. Having a piece on the board limits your movement options. Having *more* pieces might clog the board faster, causing you to run out of moves before your opponent. An "extra move" (having placed an extra piece previously) can absolutely hurt you here.
  *   **Verdict:** **SSA Does Not Apply.**
  *   **Diagnosis:** The math cannot tell you who wins. It could be a P2 win (common in Nim-like games).
  *   **Action:** This is safe from the "P1 Auto-Win" critique. However, Zugzwang games often suffer from "solveability" where the math is just harder. Rely on playtesting.

  **(c) Placement game (Identical stones, scoring at end)**
  *   **Q1 Symmetric?** Yes.
  *   **Q2 Draws?** Yes. (Scoring games usually allow ties).
  *   **Q3 Extra Piece?** **JUDGMENT CALL.**
      *   *Scenario 1:* Pieces only add score. (Passes Q3).
      *   *Scenario 2:* Pieces block placement spots or block line-of-sight for scoring. (Fails Q3).
      *   *Your Note:* You say playtests are "dead even" but you have a "bad feeling."
      *   *Analysis:* If pieces are identical and simply occupy space to score, SSA usually applies (P1 advantage). If playtests show even, it means the advantage is small enough that human error masks it.
      *   *Verdict:* **Likely "P2 Cannot Force Win" (P1 Advantage).**
      *   **Diagnosis:** If Q3 passes (pieces don't hurt you), SSA says P1 cannot lose. If humans are drawing, the win margin is thin.
      *   **Action:** **Kill or Fix.** If your gut says it's broken, trust the SSA. A competitive abstract that relies on humans *not* playing perfectly to be balanced is a ticking time bomb. If a solver comes out in 5 years proving P1 wins, your game dies.
      *   **Recommendation:** Apply the **Pie Rule**. It costs nothing to add and protects you from the SSA verdict.

  ---

  ### 6. Where the Procedure Can't Decide (Uncertainty & Consensus)

  You asked me not to sell a consensus that isn't there. Here are the open wounds in this logic:

  **1. The "Unshippable" Verdict**
  *   **Settled:** Mathematically, a P1 win game is unbalanced.
  *   **Contested:** Is it unshippable? Some publishers release P1-win games (e.g., early Go without Komi) relying on human imperfection.
  *   **My Advice:** For a studio specializing in *abstract strategy*, the audience expects theoretical fairness. If you know it's broken, fix it. For a casual party game, it matters less.

  **2. The Pie Rule Efficacy**
  *   **Settled:** The Pie Rule removes the *guarantee* of a P1 win.
  *   **Contested:** Does it make the game *perfectly* fair? Some game theorists argue that in highly solvable games, P1 can still find a move that is marginally positive even after the swap threat.
  *   **Status:** It is the industry standard for a reason. It is "good enough" for 99% of games, but it is not a mathematical guarantee of fairness, only a removal of the P1 guarantee.

  **3. Non-Constructive Proofs**
  *   **Settled:** SSA tells you a win exists, not how to find it.
  *   **Contested:** Does this knowledge have value?
  *   **Status:** For a designer, yes. It tells you where to look. If SSA says P1 wins, and you can't find how, your playtesters aren't playing optimally. It licenses you to dig deeper or add chaos (hidden info) to break the perfection.

  **4. The "Extra Piece" Judgment**
  *   **Settled:** If pieces block your own movement, SSA fails.
  *   **Contested:** In complex scoring games, determining if a piece is "neutral or helpful" is often impossible without solving the game.
  *   **Status:** This is the biggest hole in the checklist. If you mark "Pass" on Q3 but you're wrong, your verdict is wrong. When in doubt, assume "Fail" (SSA doesn't apply) and rely on AI/Playtesting, OR assume "Pass" (SSA applies) and add a Pie Rule to be safe. **I recommend the latter for safety.**

  ### Final Summary for Your Partner
  "The Strategy-Stealing Argument is a filter. If a game passes the filter (Symmetric, No Draws, Extra Piece Helps), math proves the First Player wins. We can't publish that as a fair competitive game. We use the filter to identify which prototypes need a 'Pie Rule' (swap mechanic) before we ever put them in front of a publisher. It saves us from pitching broken games."
