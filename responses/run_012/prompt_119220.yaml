  # Joint Statement on the Ontology of Health and Disease
  **An Adversarial Collaboration between a Biostatistical Naturalist and a Normativist**

  ### I. Shared Commitments
  *We agree on the following foundational claims, despite our divergence on the definition of "disease."*

  1.  **Biological Reality:** Physiological states (e.g., blood pressure, bone density, genetic expression) exist independently of human valuation. We agree that medicine must track these material facts.
  2.  **Reference Classes:** Statistical normality is always relative to a reference class (age, sex, population). A trait cannot be labeled "abnormal" without specifying the group against which it is measured.
  3.  **Environmental Interaction:** Physiological performance is not intrinsic; it is relational. A mechanism's success depends on the environment in which it operates.
  4.  **Practical Stakes:** The classification of a condition as a "disease" triggers specific social responses (medical intervention, insurance coverage, exemption from duties). We agree that misclassification carries ethical and economic costs.
  5.  **The Possibility of Error:** We agree that a person can be wrong about their own health (e.g., feeling healthy while dying) and that society can be wrong about what it values (e.g., stigmatizing a harmless difference).

  ### II. Remaining Disagreements
  *We disagree on the weighting of criteria. We phrase these positions so that each side recognizes their own view.*

  1.  **The Priority of Mechanism vs. Harm:**
      *   *Naturalist:* The primary criterion for disease is the failure of a mechanism to perform its species-typical function. Harm is a typical *consequence* of disease, but not a necessary condition for the label.
      *   *Normativist:* The primary criterion for disease is the presence of harm, disadvantage, or goal-blocking. Mechanism failure is a typical *cause* of disease, but without negative impact, the label is unwarranted.
  2.  **The Scope of "Function":**
      *   *Naturalist:* Function is determined by evolutionary history and species design. A mechanism functions as it was "designed" to, regardless of whether that design suits the current environment.
      *   *Normativist:* Function is determined by current capacity to flourish in a specific context. If a trait prevents survival or goals in the current environment, it is dysfunctional *here*, regardless of evolutionary history.

  ### III. Cruxes and Test Cases
  *These are the specific scenarios where our predictions diverge. Settling these would shift our confidence in our respective theories.*

  **Crux 1: The Silent Life-Shortener**
  *   **The Case:** A genetic variant is statistically common (15% of the population), causes zero subjective distress, limits no daily activities, and blocks none of the carrier's life goals. However, it silently accelerates cellular senescence, reducing average life expectancy by 10 years. The carrier dies in their sleep, painlessly, at age 60.
  *   **Evidence Bearing on Crux:** Longitudinal screening data (e.g., asymptomatic hypertension or ApoE4 status) and the ethical outcomes of "overdiagnosis."
  *   **Naturalist Prediction:** This **is a disease**. The biological mechanism for maintenance/repair is failing to perform its species-typical function (survival to the end of the natural lifespan), regardless of the subject's awareness or goals.
  *   **Normativist Prediction:** This **is not a disease** (until symptoms arise). Without experienced harm, disability, or thwarted goals, labeling it a "disease" is a category error that medicalizes normal variation. It is a "risk factor," not a pathology.

  **Crux 2: The Environment-Dependent Physiology**
  *   **The Case:** Standard human bone density and radiation DNA-repair mechanisms. On Earth, these are robust and support a full lifespan. In a high-gravity (2G) or high-radiation environment (e.g., deep space), these same physiological traits lead to rapid structural failure or cancer.
  *   **Evidence Bearing on Crux:** Occupational medicine standards (e.g., pilot fitness vs. ground crew) and spaceflight medical eligibility criteria.
  *   **Naturalist Prediction:** This is **not a dysfunction**. The organism is functioning exactly as the human species is designed to function. The environment is hostile, not the body. Calling it a disease implies the body is broken, rather than the context being mismatched.
  *   **Normativist Prediction:** This **is a dysfunction relative to the context**. If the trait prevents the organism from surviving in the environment it inhabits, it counts as pathological *in that setting*. "Health" is the ability to function in one's niche; if the niche changes, the health status of the trait changes.

  ### IV. Verbal vs. Substantive Dispute
  *We acknowledge that part of our conflict is verbal.*

  *   **The Word "Disease":** We suspect the Naturalist is using "disease" to mean **"biological malfunction"** (a scientific kind), while the Normativist is using "disease" to mean **"condition warranting medical intervention"** (a social kind).
  *   **Resolution Attempt:** We agree to distinguish between *Pathology* (the biological state) and *Illness* (the lived experience/social status). However, we still disagree on whether the word "Disease" maps onto *Pathology* (Naturalist) or *Illness* (Normativist).

  ### V. Conclusion
  We have clarified that our debate is not about whether biology matters (it does) or whether values matter (they do). Our debate is about which factor is *constitutive* of the category "disease." We remain divided on whether a trait can be a disease in the absence of harm, and whether a trait can be healthy in the absence of environmental fit.

  \crux{Whether 'disease' refers primarily to a failure of biological design (Naturalist) or a failure of practical flourishing (Normativist).}
