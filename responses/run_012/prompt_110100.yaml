answer: |-
  ### The Liability Ledger Protocol (LLP)

  **Purpose:** To convert abstract fairness risks into defensible liability decisions.
  **Time Budget:** 90 minutes for analysis, 30 minutes for sign-off.
  **Authority:** If a step fails, the proposal returns to the vendor. If a "Human Box" is unchecked, the proposal dies.

  ---

  ### Part 1: The Procedure (Order of Operations)

  **Step 1: The Label Autopsy (Stop Condition)**
  *   **Question:** Is the target variable ($Y$) the thing we actually care about, or a proxy generated by a human system?
  *   **Sufficient Answer:** "We care about $Y$." OR "We care about $Y^*$, but $Y$ is the only available data. We have quantified the noise between $Y$ and $Y^*$."
  *   **Kill Condition:** If $Y$ is generated by a system with known biased enforcement (e.g., arrests, policing, subjective manager reviews) AND the vendor cannot prove the bias cancels out across groups, **STOP.** Do not pass Go.
  *   **Small Subgroup Fix:** If $N < 50$ for a protected class, do not run parity tests. Run *threshold sensitivity*: If we lower the cutoff by 5%, does the error rate for the majority group explode? If yes, the model is too brittle for minority deployment.

  **Step 2: The Impossibility Selection (Human Box #1)**
  *   **Question:** You cannot satisfy Calibration, Equalized Odds, and Demographic Parity simultaneously if base rates differ. Which one are you violating?
  *   **Sufficient Answer:** "We are optimizing for [Metric A]. This mathematically forces an error disparity of [X%] in [Metric B]."
  *   **Kill Condition:** If the vendor claims "We achieved fairness across all metrics," **STOP.** They are lying or overfitting.

  **Step 3: The Feedback Loop Check**
  *   **Question:** When the model flags a positive, what happens? Does that action change the probability of the next label?
  *   **Sufficient Answer:** "Intervention is neutral." OR "We retrain every [X] months using counterfactual data for those denied intervention."
  *   **Kill Condition:** If the intervention increases the likelihood of a positive label (e.g., calling a debtor increases chance of "delinquent" label; policing increases "arrest" label) AND there is no decay factor in the retraining, **STOP.**

  **Step 4: The Ledger Completion**
  *   Fill out the table below. If any cell cannot be filled with a number or a concrete sentence, return to vendor.

  ---

  ### Part 2: The Liability Ledger

  | Criterion | Who It Protects | Who Pays For It | Belief Required (The "Faith" Step) | The Sentence (Say this to the Payer) |
  | :--- | :--- | :--- | :--- | :--- |
  | **False Positive Rate Disparity** | The Group with higher FPR | The Company (Liability) & The Group (Harassment) | "The cost of extra review is cheaper than the cost of a lawsuit." | "We are flagging 10% more of Group A incorrectly to ensure we don't miss high-risk Group B members." |
  | **False Negative Rate Disparity** | The Group with higher FNR | The Public / The Victim / The Patient | "Missing this risk is acceptable to avoid over-policing." | "We will let 5% more high-risk Group B individuals through to stop over-flagging Group A." |
  | **Calibration (Risk Accuracy)** | The Decision Maker (Us) | The Group (if miscalibrated) | "A score of 70 means 70% risk for everyone." | "A score of 70 for Group A implies a higher actual risk than 70 for Group B." |
  | **Utility (Overall Accuracy)** | The Shareholders / The Budget | The Marginal User | "Total efficiency outweighs distributional harm." | "We are saving $1M total, but 80% of the errors fall on this specific neighborhood." |

  **The Trade (Regulator Unit):**
  > "We accept a **[X]%** reduction in Total Accuracy to reduce the False Positive Rate Ratio between Group A and Group B from **[1.Y]** to **[1.Z]**."

  **Pre-Commit Kill Condition:**
  > "If the disparity ratio on [Chosen Metric] exceeds **[Threshold]** on the validation set, the model is archived. No exceptions for 'business necessity' without VP sign-off."

  ---

  ### Part 3: The Three Boxes (Human Judgment Required)

  *These are not procedure steps. These are places where math ends and morality begins. Do not hide behind the model here.*

  **BOX 1: The Metric Choice**
  *   **The Trap:** Letting the vendor pick the fairness metric that makes their model look best.
  *   **The Judgment:** You must choose which error is worse: locking up the innocent (FPR) or freeing the guilty (FNR). The math cannot tell you this.
  *   **Liability:** If you choose FPR parity, you own the false negatives. If you choose FNR parity, you own the false positives.

  **BOX 2: The Proxy Acceptance**
  *   **The Trap:** "It's the best data we have."
  *   **The Judgment:** Is the noise in the label random, or structural? If the label is "Arrest" and the crime is "Drug Use," the noise is structural.
  *   **Liability:** If you sign off on a structural proxy, you are signing off on the bias of the data generator (e.g., the Police Department), not just your model.

  **BOX 3: The Kill Threshold**
  *   **The Trap:** "We'll monitor it in production."
  *   **The Judgment:** How much disparity is too much *before* you see the real-world harm?
  *   **Liability:** Setting this number is a policy decision, not a statistical one. A ratio of 1.2 might be legal; it might not be defensible.

  ---

  ### Part 4: Simulation Runs

  #### Case A: Parole Recidivism Score (COMPAS-style)
  *   **Input:** Criminal history, demographics (proxy), arrest records.
  *   **Target:** Re-arrest within 2 years.
  *   **Step 1 (Label Autopsy):** **FAIL.** Target is "Re-arrest," not "Re-offend." Policing intensity varies by neighborhood. The label contains enforcement bias.
  *   **Step 2 (Impossibility):** Vendor claims calibration and equalized odds. Base rates differ by neighborhood due to policing. Mathematically impossible.
  *   **Step 3 (Feedback):** Parole denial $\rightarrow$ Incarceration $\rightarrow$ Higher risk of future arrest (criminal network exposure). Positive feedback loop confirmed.
  *   **The Ledger Trade:** "We accept 0% reduction in Accuracy to reduce FPR Disparity from 1.8 to 1.0." (Impossible without removing the label).
  *   **Kill Condition:** Triggered at Step 1.
  *   **The Answer I Hate:** **DO NOT DEPLOY.**
      *   *Why I hate it:* The model works. It predicts arrests accurately. It saves money. But signing this means I admit the tool is measuring police behavior, not criminal risk. It renders the product useless. I have to tell the business we have no way to assess risk.

  #### Case B: Healthcare Cost-as-Health (Obermeyer-style)
  *   **Input:** Claims data, past costs.
  *   **Target:** Future health costs (Proxy for "Sickness").
  *   **Step 1 (Label Autopsy):** **WARNING.** Target is "Cost," not "Health." Access to care varies by race/income. Sick people without money generate low cost.
  *   **Step 2 (Impossibility):** Vendor optimizes for Cost Prediction Accuracy (RMSE).
  *   **Step 3 (Feedback):** Model flags low cost $\rightarrow$ Patient gets no care $\rightarrow$ Patient gets sicker $\rightarrow$ Future cost spikes (or patient dies).
  *   **The Ledger Trade:** "We accept a **15%** reduction in Cost Prediction Accuracy to reduce the Health-Access Disparity (Sick patients denied care) from **40%** to **10%**."
  *   **Kill Condition:** Disparity ratio > 1.2 on "Sick patients denied care."
  *   **Decision:** **DEPLOY WITH REMEDIATION.**
      *   *Action:* The model cannot predict health. It predicts spending. We must apply a bias correction factor to the threshold for under-served groups.
      *   *The Sentence:* "We are spending $2M extra to find sick people who don't go to the doctor, because this model assumes no bill means no illness."

  ---

  ### Part 5: What This Procedure Cannot Do

  1.  **It cannot fix broken data.** If the label is poison (Case A), this procedure only tells you to throw the bottle away. It does not give you a new drink.
  2.  **It cannot protect you from regulation changes.** A disparity ratio of 1.2 might be safe today and illegal tomorrow. This is a snapshot, not a shield.
  3.  **It cannot solve the "Small N" problem.** If the subgroup is 40 people, statistical significance is a lie. This procedure forces you to admit you are guessing (Box 2), but it doesn't give you the answer.

  **Final Instruction:**
  Print the Ledger. Fill it in pen. If you hesitate on "The Sentence," do not sign. The hesitation is the risk signal.
