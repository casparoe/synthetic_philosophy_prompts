      *   **User Persona:** A compliance/risk officer at a company using scoring models (credit, collections, benefits). They sign off on these models. They have ~2 hours per proposal. They are well-read on fairness literature (impossibility theorems, dynamic feedback loops, proxy labels) but lack actionable tools. They feel the weight of liability ("if it goes wrong it was mine").
      *   **Tone:** Cynical, experienced, pragmatic, weary of "vibes," demanding concrete utility. They know the theory doesn't solve the practice.
      *   **Constraints:**
          *   Needs a procedure/checklist for a team to run on *external* proposals (they didn't design the model).
          *   Must handle specific hard cases: no protected attribute data, small subgroups, intersectionality, proxy labels, feedback loops.
          *   Output format: A one-page ledger (Criterion, Protected, Payer, Belief Required, The Sentence), Trade-off quantification (X for Y), Pre-commit Kill Conditions.
          *   Must run the procedure on two examples: Parole Recidivism (COMPAS-style) and Healthcare Cost-as-Health (Obermeyer-style).
          *   One example must yield an answer the user "hates" (i.e., reveals an uncomfortable truth or forces a hard no).
          *   Must explicitly identify where human judgment is required ("Three boxes marked a human has to own this").
          *   Must state what the procedure *cannot* do.

  2.  **Deconstruct the Problem:**
      *   The core tension is between *mathematical fairness constraints* (which often fail in practice due to the impossibility theorems the user knows) and *operational liability* (signing the name).
      *   The procedure needs to move from "Is this math fair?" to "Is this deployment defensible?"
      *   The "One-Page Ledger" is the key artifact. It needs to force transparency on trade-offs.
      *   The "Kill Condition" is crucial for risk management.
      *   The "Human Judgment" boxes are crucial for honesty (avoiding "judgment wearing a procedure costume").

  3.  **Drafting the Procedure (The "Sign-Off Protocol"):**
      *   *Step 1: Label Validity.* The user mentioned labels are proxies. We need to challenge the target variable first.
      *   *Step 2: Feedback & Dynamics.* The user mentioned dynamic harm. We need to ask about retraining and loops.
      *   *Step 3: The Fairness Squeeze.* Acknowledge impossibility. Pick *one* metric to optimize, admit the cost.
      *   *Step 4: Data Gaps.* Handle the "can't record protected attributes" issue (proxy testing, threshold analysis).
      *   *Step 5: The Ledger.* The core output.

  4.  **Developing the Ledger Columns:**
      *   Criterion (What are we measuring?)
      *   Protected (Who is shielded?)
      *   Payer (Who bears the cost of the error?)
      *   Belief Required (What must be true for this to be ethical?)
      *   The Sentence (The plain English admission of harm).

  5.  **Running the Examples:**
      *   *Example 1: Parole Recidivism.* High stakes. Label is "re-arrest," not "re-offend." Feedback loop is incarceration.
      *   *Example 2: Healthcare Cost-as-Health.* Classic bias case (Obermeyer et al.). Label is cost, target is health.
      *   *Requirement:* One must yield an answer I hate. The Healthcare one is the classic "efficiency vs. equity" trap. If we optimize for cost, we under-serve sick people who don't spend money (often Black patients). If we fix it, costs go up. The "hate" answer should be that the model *cannot* be fixed without changing the business goal, forcing a "No." Or, conversely, that the Parole one is fundamentally unsalvageable. Let's make the Parole one the "Hard No" because the label (arrest) is too corrupted by policing bias to be remediated by post-processing.

  6.  **Identifying the "Human Judgment" Boxes:**
      *   These need to be places where math stops and morality begins.
      *   1. Choosing the *one* fairness metric (since you can't have all).
      *   2. Accepting the Proxy Label (is the error tolerable?).
      *   3. The Kill Condition threshold (how much harm is too much?).

  7.  **Refining the Tone:**
