      *   *The Ledger:* Make it look like a table.
      *   *The Trade:* "We accept Z% higher false negatives for Group A to reduce False Positives for Group B by Q%."
      *   *Kill Condition:* "If disparity exceeds X, do not deploy."

      *   *Running Parole:* Label = Arrest. Problem = Policing bias. Result = **NO GO.** (This is the "hate" answer because it kills a useful-looking tool).
      *   *Running Health:* Label = Cost. Problem = Access inequality. Result = **Conditional YES** but requires expensive remediation.

      *   *Wait, let's swap.* The prompt asks for *one* answer I hate. Usually, the Healthcare one is the poster child for "cost != health." If the procedure says "This is fine," I'd hate that. If the procedure says "This is broken," that's good. Let's make the Parole one the "Hate" answer because it implies *no* risk assessment is viable, which is operationally painful. Or, make the Healthcare one the "Hate" answer because fixing it costs money the company doesn't want to spend. Let's go with the Healthcare one forcing a "No" because the label is fundamentally corrupted, which hurts the business case. Actually, the Parole one is more morally fraught. Let's make the Parole one trigger a Kill Condition based on Label Validity.

      *   *Re-evaluating the "Hate" constraint:* "For at least one of those I want the procedure to give me an answer I hate." This means the procedure should force a conclusion that is uncomfortable.
