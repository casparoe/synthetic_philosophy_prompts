answer: |-
  You're right to be suspicious. From the outside, the mechanics look identical. A deal in the shadows. Immunity for violence. I'm not going to stand here and tell you the paperwork looks different. It doesn't.

  But corruption is a lie. The corrupt man tells himself he's serving the state while he serves himself. He convinces himself the wrong is right, or he simply doesn't think about it at all. He sleeps fine. I won't sleep fine. I'm not asking you to admire the stain. I'm asking you to recognize that I know it's there, and I'm not trying to wash it off. If I were corrupt, I wouldn't be standing here admitting guilt. I'd be telling you this was a victory for peace. I'm telling you it's a defeat for justice that was unavoidable.

  There's a distinction between the person and the office. As a private citizen, I would never make this deal. It would be unconscionable. But I swore an oath to this office. That oath carries obligations that my private conscience cannot accommodate. When I put on this role, I accepted that I might have to do things that would condemn me as a private individual. The office holds the mandate to protect the structure of the state. Sometimes that mandate conflicts with the moral law. I chose the mandate. I accept the sin.

  You ask about the clean-handed refusal. Some say that's the superior path. I say that's abandonment. If I refuse to dirty my hands, I am prioritizing my own moral purity over the duties of the state. I'm washing myself clean while the responsibility rots. That isn't virtue. It's vanity.

  So I'm not asking you to admire the stain. I'm asking you to understand that I accept it. I don't expect history to forgive me. I expect to be judged. But I also expect to have done what was required. The wrongness doesn't disappear because the job needed it done. It stays on me. That's the cost.
