  2.  **Deconstruct the Character's Philosophy (The "Dirty Hands" Problem):**
      *   This is based on the Walzerian concept of dirty hands (though the prompt specifies non-consequentialism, which aligns more with a deontological struggle where duty conflicts).
      *   Key distinction: Corruption is for personal gain or cynical power preservation without moral weight. Dirty hands is doing wrong *for the sake of the public good* while acknowledging the moral violation.
