  so i'm in this upper-level seminar on evolution and the mind — mostly phil bio people, a couple of cog sci folks — and we just spent two sessions on the Gould and Lewontin spandrels paper, the one where they argue that a lot of what we see in organisms is like the leftover triangular space you get when you put a round dome on a square base: a byproduct of a structural constraint, not something selection built. our prof showed us photos of the actual basilica and then dropped this on us, which I had definately never heard: apparently the things at San Marco aren't technically spandrels at all, they're pendentives. and then someone in the seminar said corbels or squinches would of worked just as well, so even in the church the "necessary byproduct" might not be necessary — I think Dennett has a version of that objection. meanwhile everyone in class has picked up "spandrel" as a general move: consciousness is a spandrel, religion is a spandrel, music is a spandrel. I keep feeling like the analogy is quietly carrying way more argumentative weight than anyone has audited, so I want to audit it.

