answer: |-
  This is a fantastic puzzle. You have stumbled onto one of the most famous trouble spots in contemporary modal metaphysics. Your friend's argument is a version of **Origin Essentialism** (often associated with Kripke), but he is applying it with a biological naïveté that causes the logic to explode.

  You are right to feel the tension. The argument proves too much because it conflates **Zygote Identity** with **Personal Origin**.

  Here is the diagnosis: **Premise (2) is the culprit**, specifically the unspoken assumption that "Origin" simply means "The Zygote."

  If you want to keep (3) (you couldn't come from different gametes) while rejecting the absurdities of (4) and (5), you need to refine (2). You don't have to give up Origin Essentialism; you just have to give up *Zygote* Essentialism.

  Here is how you cut the knot, what you save, and what it costs you.

  ### 1. Where the Argument Breaks: The Definition of "Origin"

  Your friend is treating "Origin" as a static object (the Zygote $Z$). But in modal metaphysics, "Origin" is a **historical property**. It includes the material cause (the gametes) *and* the developmental trajectory.

  The inference from (2) to (4) fails because it ignores the **Non-Branching Requirement**.
  The inference from (2) to (5) fails because it ignores **Origin Complexity**.

  Here is how you rewrite (2) to stop the explosion:

  > **(2*)** A thing's origin is essential to it: Nothing that came from a *significantly different* causal history could have been that very thing. Furthermore, for an organism to be *you*, its developmental history from the origin must be **non-branching**.

  ### 2. Solving the Twinning Problem (Step 4)

  **The Friend's Claim:** Since $Z$ is my origin, and $Z$ can split into $A$ and $B$, both $A$ and $B$ are me.
  **The Problem:** Identity is transitive. If $A = \text{Me}$ and $B = \text{Me}$, then $A = B$. But $A$ and $B$ are two different people. Contradiction.

  **The Fix:**
  In the possible world where $Z$ splits, **you do not exist.**

  This sounds dramatic, but it is the standard Kripkean solution. *You* are the organism that developed from $Z$ via a *specific, non-branching trajectory*.
  *   In the actual world, $Z \to \text{You}$.
  *   In the twinning world, $Z \to \text{Twin}_1 + \text{Twin}_2$.

  Because the developmental path in the twinning world branches, neither twin stands in the same relation to $Z$ that *you* do. Therefore, neither twin is *you*. You are essentially a "non-branching development from $Z$." If branching occurs, the specific individual *you* are fails to materialize.

  **What you say about the twin:**
  "In the world where my zygote splits, I am not there. There are two people who are genetically identical to me and share my early origin, but neither is me. My existence requires that my zygote *didn't* split."

  **Does this cost you (3)?**
  No. In every world where *you* exist, you still come from $S$ and $E$. The twinning world is simply a world where *you* don't exist. (3) is a claim about worlds where you *do* exist.

  ### 3. Solving the Chimerism Problem (Step 5)

  **The Friend's Claim:** A chimera comes from $Z_1$ and $Z_2$. By Origin Essentialism, they have two origins. Therefore, they are two people.
  **The Problem:** This assumes an organism can only have *one* zygote as an origin.

  **The Fix:**
  Origin Essentialism does not say "You must come from exactly one zygote." It says "You must come from the origin you actually came from."
  For a chimera, their origin is not "$Z_1$" nor "$Z_2$." Their origin is **"The fusion of $Z_1$ and $Z_2$."**

  That fusion event is a unique, singular historical occurrence. It is their essential origin. They could not have come from $Z_1$ alone (that would be a different person). They could not have come from $Z_3$ and $Z_4$ (that would be a different person). But they *did* come from the fusion of $Z_1$ and $Z_2$, so they are one person with one complex origin.

  **What you say about the chimera:**
  "The chimera is one person. Their essential origin is the specific fusion event of those two zygotes. They are not two people because they do not have two separate origins; they have one composite origin."

  **Does this cost you (3)?**
  No. For a chimera, (3) becomes: "I could not have come from different gametes than the four that constituted my two zygotes." The principle holds; the input data is just more complex.

  ### 4. Is (4) a separate step or inside (2)?

  You asked: *"Is (4) really a separate step from (2), or is it just (2) read a certain way?"*

  It is **(2) read a certain (incorrect) way.**
  Your friend is relying on a simplistic version of Origin Essentialism that equates **Origin** with **Starting Matter**.
  *   **Friend's (2):** If you share the starting matter ($Z$), you are the same thing.
  *   **Corrected (2):** If you share the starting matter *and the developmental history*, you are the same thing.

  Step (4) looks like an inference, but it's actually a hidden premise: *"Developmental history does not matter for identity, only the starting zygote does."* Once you expose that hidden premise, you can reject it without rejecting Origin Essentialism itself.

  ### 5. The Price You Pay

  You wanted to know what you are paying once you cut the bad step. You are keeping (3), but here is the bill:

  1.  **Fragility of Existence:** You have to accept that you are "modally fragile." There are very close possible worlds (e.g., one where a random cell division goes slightly differently and twinning occurs) where *you* simply do not exist. This is counterintuitive but metaphysically standard.
  2.  **Indeterminacy (Optional):** Some philosophers prefer to say that in the twinning case, it is *indeterminate* which twin is you. This saves the idea that you exist in that world, but it costs you the Law of Excluded Middle (it's neither true nor false that Twin 1 is you). Most Kripkeans prefer the "You don't exist" route to avoid logical indeterminacy.
  3.  **Complexity of Origin:** You lose the elegance of "One Zygote = One Person." You have to admit that "Origin" is a property of the *process*, not just the *seed*.

  ### Summary for Your Reading Group

  To shut down the argument while saving your intuition:

  1.  **Accept (1) and (3).** (You come from $Z$, and couldn't come from different gametes).
  2.  **Reject the inference to (4).** Argue that Origin Essentialism includes a **Non-Branching Clause**. If $Z$ splits, the resulting organisms are not *you*, because *your* identity is tied to the specific unbranched history that actually occurred.
  3.  **Reject the inference to (5).** Argue that Origin Essentialism allows for **Complex Origins**. A chimera's origin is the fusion event, which is singular, not dual.
  4.  **Conclusion:** You can maintain that you couldn't have come from different sperm/eggs without accepting that you are two people in twinning worlds or that chimeras are two people. The "Origin" that is essential is the **causal history**, not just the **zygotic label**.

  This preserves the Kripkean intuition (we are essentially tied to our beginnings) without succumbing to biological reductionism.
