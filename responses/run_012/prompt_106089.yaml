answer: |-
  Your hunch is right. The distinction between reasons for an attitude and reasons to cultivate an attitude collapses if the group assumes attitudes are merely causal events or voluntary actions. Unless they grant that emotions have standards of correctness independent of utility (fittingness), the "wrong kind" of reason will look like merely a "weaker" kind of reason, or a pragmatic override. The problem only emerges when there is a norm to violate.

  ### Order of Ideas

  **Sequence Overview**
  1.  **The Normativity of Attitudes (Fittingness)**
  2.  **The Standard Case (Object-Given Reasons)**
  3.  **The Journal Case (State-Given Reasons)**
  4.  **The Conflict (Statement of the Problem)**

  **Dependencies and Whiteboard Plan**

  *   **Step 1: The Normativity of Attitudes (15 mins)**
      *   *Goal:* Establish that emotions are not just feelings but responses that can be correct or incorrect.
      *   *Whiteboard:* Draw an arrow: **Object → Attitude**. Label the arrow "Fittingness."
      *   *Dependency:* None. This is the foundation.
      *   *Instruction:* Ask the group: "If someone trips and falls harmlessly, is laughter fitting? If someone sacrifices their life for you, is gratitude fitting?" Establish that "fitting" does not mean "pleasant" or "useful," but "appropriate to the object."
      *   *Head Off:* Pre-empt the "Moral Reproach" misconception here (see Misconceptions section).

  *   **Step 2: The Standard Case (15 mins)**
      *   *Goal:* Identify what usually makes gratitude fitting.
      *   *Whiteboard:* Under **Object**, write "Benefit Received." Under **Attitude**, write "Gratitude."
      *   *Dependency:* Requires completion of Step 1 (acceptance of fittingness).
      *   *Instruction:* Elicit from the group what makes gratitude correct. They will cite the benefactor's action. Label this "Reason for the Attitude."
      *   *Head Off:* Pre-empt the "Peculiar to Belief" misconception by sticking strictly to emotion vocabulary.

  *   **Step 3: The Journal Case (25 mins)**
      *   *Goal:* Introduce the wellness programme scenario as a counter-structure.
      *   *Whiteboard:* Draw a second diagram. **Incentive (Wellness Credit) → Attitude (Gratitude)**. Label the arrow "Incentive."
      *   *Dependency:* Requires completion of Step 1 (to judge fittingness) and Step 2 (to contrast with the standard case).
      *   *Instruction:* Present your scenario. Ask: "Does the programme requirement make the gratitude fitting?" Most will say no. Ask: "Does it give you a reason to write?" Yes.
      *   *Head Off:* Pre-empt the "Insincerity" and "Therapeutic Benefit" misconceptions here (see Misconceptions section).

  *   **Step 4: The Conflict (20 mins)**
      *   *Goal:* State the Wrong Kind of Reasons problem.
      *   *Whiteboard:* Place the two diagrams side-by-side. Draw a question mark between the Incentive arrow and the Attitude.
      *   *Dependency:* Requires completion of Steps 2 and 3 (need both cases to see the clash).
      *   *Instruction:* Formulate the problem: "We have a reason to produce the feeling (the programme), but not a reason that makes the feeling fit the object. Both look like reasons to be grateful. Why is one different?"
      *   *Head Off:* Pre-empt the "Not Really a Reason" and "Obvious Criterion" misconceptions here (see Misconceptions section).

  ### The Carrying Example

  Your gratitude journal scenario is strong because it is lived experience, not a thought experiment. However, it **cannot carry the whole session alone**. It requires a companion case.

  **What the Journal Scenario Possesses:**
  *   **External Incentive:** It clearly provides a pragmatic reason to *engage in the practice* (wellness credit, job compliance).
  *   **Lack of Object-Merit:** It explicitly lacks the traditional ground for gratitude (the target treated you badly).
  *   **Phenomenological Ambiguity:** You noted you can "work yourself into something like feeling." This is crucial; it prevents the group from dismissing it as simple lying.

  **What the Journal Scenario Lacks:**
  *   **A Clear Baseline of Fittingness:** Without a contrast, participants may view the programme incentive as merely a *weak* reason for gratitude, rather than a *different category* of reason. They might think, "The boss's reason is small; the benefactor's reason is big." To see the WKR problem, they must see that the boss's reason is not just small, but structurally irrelevant to the *fittingness* of the emotion.

  **The Companion Case:**
  *   **Requirement:** You need a "Right Kind" baseline case that is structurally identical except for the source of the reason.
  *   **Scenario:** A day where you received genuine, unasked-for help from a colleague, and you felt gratitude spontaneously.
  *   **Function:** This supplies the **Object-Given Reason**. It isolates the *benefit received* as the sole variable that makes gratitude fitting.
  *   **Usage:** Use this in Step 2. Use the Journal Case in Step 3. The problem arises in Step 4 when you ask why the incentive in the Journal Case cannot do the same work as the benefit in the Companion Case, even if the incentive is stronger (e.g., keeping your job vs. a small kindness).

  ### Misconceptions

  **1. The issue is about insincerity or hypocrisy.**
  *   **Where it surfaces:** Step 3 (The Journal Case).
  *   **How to head it off:** Explicitly validate your own experience: "I am not lying. I can generate the feeling. The question is not whether I feel it, but whether the feeling is *merited* by the target." Write "Sincerity ≠ Fittingness" on the board.

  **2. A reason of the wrong kind is not really a reason at all.**
  *   **Where it surfaces:** Step 4 (The Conflict).
  *   **How to head it off:** Concede immediately: "It is certainly a reason to *write the letter* or to *participate*." Draw a box around "Action" vs "Attitude." The problem is that it fails to bridge the gap to the *attitude itself* as a justification.

  **3. "Wrong kind" is a term of moral reproach.**
  *   **Where it surfaces:** Step 1 (The Normativity of Attitudes).
  *   **How to head it off:** Use the word "Fitting" instead of "Right" initially. Clarify that "Wrong Kind" is a category error (like using a screwdriver to hammer a nail), not a moral failure (like being cruel).

  **4. The problem is peculiar to belief and does not touch the emotions.**
  *   **Where it surfaces:** Step 2 (The Standard Case), if you inadvertently use belief analogies.
  *   **How to head it off:** Do not use belief examples (e.g., Pascal's Wager). Keep the whiteboard vocabulary strictly emotional (Gratitude, Admiration, Anger). If a participant raises belief, acknowledge the parallel but return to the emotion to maintain focus.

  **5. Once the distinction has been drawn, the criterion for drawing it is obvious.**
  *   **Where it surfaces:** Step 4 (The Conflict).
  *   **How to head it off:** Admit the difficulty: "Philosophers have debated this for decades without consensus. If the solution were obvious, we wouldn't have a problem." Invite them to feel the tension rather than solve it.

  **6. Additional Expected Misconception: Therapeutic Value justifies the attitude.**
  *   **Where it surfaces:** Step 3 (The Journal Case).
  *   **How to head it off:** Participants will argue, "But gratitude is good for me, so I have a reason to be grateful." Distinguish between "Reasons the attitude is *good to have*" vs. "Reasons the attitude is *correct to hold*." Write "Benefit of Having ≠ Reason for Holding" on the board.

  ### Refusals and Closing Question

  **What to Refuse to Cover:**
  1.  **The Fitting-Attitude Analysis of Value:** Do not allow the discussion to drift into whether "goodness" is *defined* by fitting attitudes. That is a meta-ethical claim that relies on the WKR problem, not a prerequisite for understanding it.
  2.  **The Ethics of Belief:** Do not discuss whether we can choose our beliefs. This introduces doxastic voluntarism, which complicates the structural point about reasons.
  3.  **Proposed Solutions:** Do not attempt to solve the problem (e.g., via "object-given" vs. "state-given" definitions). The goal is to recognize the problem, not resolve the literature.

  **Closing Question:**
  "If I offer you $1,000 to be angry at a stranger who has done you no harm, do you have a reason to *be* angry, or a reason to *make yourself* angry?"

  Summary: The session must land the distinction between reasons that make an attitude appropriate and reasons that merely incentivize producing it.
