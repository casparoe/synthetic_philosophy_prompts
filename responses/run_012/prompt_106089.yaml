      *   *Order of Ideas:* Confirm hunch. Sequence: 1. Attitudes have standards (Fittingness). 2. Reasons support attitudes. 3. The Journal Case (WKR). 4. The Kindness Case (RKR). 5. The Clash (WKR Problem).
