      *   *Assessment:* This is philosophically sound. The WKR problem arises within the context of "fitting-attitude analyses" or normative theories of emotions. If reasons are just pragmatic incentives, there's no distinction to make. The distinction between "reasons for believing/feeling X" vs. "reasons for wanting to believe/feel X" relies on the normativity of the attitude itself.
