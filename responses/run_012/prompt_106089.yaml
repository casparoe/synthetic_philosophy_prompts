      4.  **The Contrast/Companion (20 mins):** Compare with genuine kindness. Highlight the structural difference.
      5.  **The Problem Statement (20 mins):** Formulate the WKR problem. Both look like reasons to be grateful, but one isn't. Why?
      6.  **Wrap/Q&A (10 mins).**

      *Refining Misconceptions:*
