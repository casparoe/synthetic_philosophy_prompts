answer: |-
  **Project Title:** The Limits of Safe Pareto Improvements: Separating Preference Uncertainty from Strategic Stability

  **Research Question**
  In negotiations where parties act on behalf of principals with unknown preferences—whether AI delegates, diplomatic envoys, or union representatives—researchers often rely on the concept of a "Safe Pareto Improvement" (SPI). An outcome is an SPI if it yields a higher payoff than the status quo for every party, across every possible profile of preferences they might hold. The intuitive appeal is clear: if a deal is better than the baseline for all possible worlds, agents should be able to sign it without knowing which world they inhabit.

  This project asks a determinate question: **Is robustness to preference uncertainty sufficient for robustness to strategic uncertainty?** Specifically, does satisfying the SPI condition guarantee that the deal can be implemented as an equilibrium outcome when parties have private information and opportunities to misreport or renege? My hypothesis is that these are independent requirements. Existing frameworks often treat preference robustness as a proxy for stability, assuming that if a deal is universally beneficial, incentive problems will vanish. I argue they do not. When separated, the set of viable deals shrinks dramatically, often collapsing to outcomes that satisfy much stronger conditions, such as worst-case incentive compatibility.

  **Background and Gap**
  Current treatments of this problem typically model uncertainty as a static constraint on payoff functions. The argument proceeds that if we restrict the set of admissible preferences to those where the proposed deal dominates the status quo, rational agents should agree. This approach bundles two distinct kinds of unknowns: uncertainty about *values* (what the principals want) and uncertainty about *behavior* (whether the agents can commit, whether the protocol is exploitable, what happens off the equilibrium path).

  The literature leaves open whether clearing the first hurdle clears the second. Some arguments suggest that if a deal is strictly dominant across all types, truth-telling becomes automatic. Others imply that implementation mechanisms can be designed to bridge the gap. However, neither position adequately addresses cases where the "safe" deal creates new strategic opportunities—such as hold-up problems or signaling games—that did not exist in the status quo. By failing to model the implementation mechanism explicitly, existing work risks recommending deals that are theoretically safe but practically unstable. This project disentangles these uncertainties to show where the SPI concept breaks down.

  **Illustrative Case**
  To demonstrate how these requirements come apart, consider a simple contracting game between two parties. The status quo yields payoffs of $(0,0)$. A proposed agreement yields $(1,1)$.
  *   **Preference Robustness:** Suppose Party 1 has private types $\theta \in \{Low, High\}$. For both types, the agreement yields a payoff of $1$, which is strictly greater than $0$. The agreement is a Safe Pareto Improvement regarding preferences.
  *   **Strategic Failure:** Suppose that after signing, Party 1 has an option to "Renegotiate." If Party 1 is type $Low$, renegotiating yields $0.5$ (worse than sticking to the deal). If Party 1 is type $High$, renegotiating yields $1.5$ (better than sticking). Party 2 does not know Party 1's type. If Party 2 believes the probability of $High$ is sufficiently large, their expected payoff from signing becomes negative because they anticipate being held up.
  *   **Result:** The deal is an SPI (it beats the status quo for all types *if implemented*), but it is not Strategically Robust (it will not be implemented because Party 2 refuses to sign). This shows that preference robustness does not guarantee implementation stability.

  **Methodology and Timeline**
  This is a twelve-month formal modeling project. I will construct game-theoretic models to define the intersection of the Preference-Robust set and the Incentive-Compatible set.

  *   **Months 1–3: Formalization.** I will define precise mathematical conditions for "Preference Robustness" and "Strategic Robustness" in general mechanism design settings. This involves specifying the type spaces and information structures where SPIs are currently claimed to exist.
  *   **Months 4–6: Toy Models.** I will build two-player bargaining models with finite type spaces. The goal is to map the region where SPIs exist but equilibrium implementation fails. I will vary the information asymmetry to find the threshold where strategic uncertainty overrides preference robustness.
  *   **Months 7–9: Characterization and Impossibility.** This phase moves beyond examples to general claims. I will derive the necessary conditions for a deal to be both an SPI and implementable. Specifically, I will attempt to prove an impossibility theorem: that in any setting with non-trivial private information, the only deals satisfying both conditions are those that are also worst-case optimal for the status quo. I will also test a non-bargaining case, such as a public good provision game, to ensure the result isn't an artifact of bilateral negotiation. This involves solving for Bayesian Nash Equilibria in the proposed mechanisms and comparing the equilibrium sets to the SPI sets.
  *   **Months 10–12: Writing and Revision.** I will draft the dissertation chapter and prepare a journal article. This includes stress-testing the proofs and refining the narrative around the decoupling of uncertainties.

  **Outcomes and Failure Conditions**
  *   **Positive Result:** I successfully demonstrate that the set of Strategically Robust deals is a strict subset of Preference-Robust deals, and characterize the gap. I prove that ignoring strategic uncertainty leads to overestimating the feasible set of agreements.
  *   **Negative Result:** I find that under reasonable refinements (e.g., specific equilibrium concepts), the two sets coincide. This would suggest the existing literature is correct, though likely for more nuanced reasons than stated.
  *   **Failure:** The project fails if I cannot formalize the distinction between the two uncertainties in a way that generates divergent predictions. If every model I build collapses back to the standard result despite my modifications, the distinction may be theoretical rather than practical. I would count this as a failure if, by month 9, I have no concrete example where an SPI is not an equilibrium.

  **Scope and Contingencies**
  This proposal is scoped for one year. If funding were limited to six months, I would drop the non-bargaining case study (the public good provision model) and focus exclusively on the bilateral bargaining framework. The core theoretical contribution—the decoupling of preference and strategic robustness—rests on the bargaining model. The second case study serves only to generalize the finding; while valuable, it is not essential for the primary claim. Similarly, I would simplify the Month 7–9 work from a general characterization theorem to a set of rigorous counterexamples. This would still prove the concepts come apart, even if it doesn't fully map the boundary conditions.

  **Significance**
  As automated agents and delegated negotiators become more common, relying on intuitive notions of "safety" without strategic grounding is risky. This project provides the formal toolkit to distinguish deals that are safe on paper from those that are safe in practice. By showing that preference robustness is not a free lunch for stability, I aim to tighten the standards for agreement design in environments of radical uncertainty.
