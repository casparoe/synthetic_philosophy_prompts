answer: |-
  **Ruth:** Look at these sandwiches. If we don't maintain the population, who's going to suffer through catering like this in twenty years? But seriously, Marek, your objection rests on that intuitive asymmetry—that it's wrong to create a miserable child but merely neutral to create a happy one. I think that's unearned. If a life is good, that goodness is a reason to bring it about, not just a reason to be glad it happened once it's here.

  **Marek:** I grant you the asymmetry is shaky ground. But even if we stipulate every subsidized child lives a wonderful life, you're treating value as a simple sum. You're assuming that adding a unit of value now is identical to adding it later. It isn't. A person born this year consumes the wherewithal for whoever might have existed later. "A larger population" is ambiguous between a bigger total across all of time and a bigger total at any given moment. You're arguing for the second; I'm worried it sacrifices the first.

  **Ruth:** That's a resource constraint, not a value constraint. But beyond welfare, there's the non-welfarist point. A larger population is a larger space of minds exploring and inventing. That exploration is valuable in a way that doesn't reduce to the sum of individual happiness. We lose something civilizational if the space of minds contracts.

  **Marek:** I hear you. But consider the shape of the value function. Is civilizational exploration linear with headcount? Or does it require density, stability, depth? If we stretch our resources thin to maximize heads now, we might get more minds, but shallower ones. We might get a spike in exploration followed by a collapse. You're maximizing the breadth of the canvas while risking the durability of the paint.

  **Ruth:** But you can't say the future people are worse off. That's the non-identity problem. The people who'd exist under the subsidy are different people than those who'd exist if we invested in housing for the current stock. You can't rest on "no one is made worse off" because the "no one" changes depending on our choice.

  **Marek:** I'm not making a person-affecting claim. I'm talking about the value of the continuum itself. But here's where I think I'm losing you, and where you might lose me: I haven't separated the metaphysics from the mandate. Even if you're right that creating happy people is intrinsically good, and even if the civilizational argument holds... does that tell the Minister what to do with a fixed budget in a shrinking province?

  **Ruth:** ...Huh. I hadn't separated those two questions before. I've been assuming that if the act is morally good, the policy should reflect it. But the policy question is about stability, legitimacy, economic viability. Settling the second—the philosophical one—may not settle the first.

  **Marek:** Exactly. If the province shrinks too fast, the tax base collapses, and you get neither happy existing people nor new babies. But if I concede your point—that there is *some* good in creating new lives—then my skepticism can't just be "don't do it." It has to be "not this way, not now." Which means I'm not arguing against the value of the lives; I'm arguing about the timing of the value.

  **Ruth:** So we're not disagreeing on whether new people are valuable. We're disagreeing on whether value is additive across time or if it has a discount rate. And whether the Minister is capable of caring about the former when he's worried about the latter.

  **Marek:** And whether we, as advisors, are supposed to care about the former when our terms of reference are the latter. If I tell him "maximize total value across centuries," he'll throw us out. If I tell him "maximize GDP next quarter," you'll throw me out.

  **Ruth:** So the crux isn't total versus average value. It's whether people are being valued as ends or as containers for civilizational continuity. And whether that continuity matters more than the specific contents at any given time.

  **Marek:** Which leaves us with what recommendation? That we need more time to figure out if we're utilitarians or custodians?

  **Ruth:** Or that we tell him the budget is too small to solve the philosophical problem, so he should pick the one that keeps the lights on until we do.

  **Marek:** Pass the mustard. I suppose that's a conclusion of sorts.
