prompt: |-
  ok so my friends and i have a long-running game of nomic (the one where changing the rules is itself a move) and lately i've been writing little poems about our rulebook. i want one about the feeling when a rule turns on itself and nobody can say which one wins.

  here's the tangle i want it to hold: our rule 4 says rule 4 can only be changed if every player agrees. our rule 5 says any rule may be changed by a simple majority, and it takes precendence over any rule that says otherwise. so rule 5 seems to let us change rule 4 by majority — but rule 4 says it can't be changed that way, and rule 5's power to override is itself the kind of thing rule 4 might block, so we just go in circles at the table every time.

  can you write me a poem, maybe 16-20 lines in quatrains, where the poem is its own tiny rulebook: the first quatrain states a rule about the poem, and by the end the poem has used its own stated procedure to amend that rule, so the last quatrain's repeated line is the same rule in its changed form. the shape should do the circular work — i want a reader to get that same wait-which-one-wins feeling we get at the table. no need to rhyme, but the repeated/amended line should be load-bearing, not decoration.

  after the poem, give me a short json summary so i can keep notes, with fields: form (what verse shape you used), rule_as_stated (the rule the poem starts with), amendment (how the poem changes it, and what line does the changing), paradox (the exact self-reference tangle the poem leaves unresolved), refrain (the line that gets amended, and what it becomes at the end).
