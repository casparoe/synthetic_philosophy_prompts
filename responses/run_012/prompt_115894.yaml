answer: |-
  # Q&A PREP SHEET: "The Ill-Posed Question of Violent Trends"

  **Strategy:** Your goal is not to prove the data is bad (they know that), but to prove the *concept* is under-specified. You must distinguish between *epistemic uncertainty* (we don't know the number) and *ontological indeterminacy* (there is no single number to know).

  ### I. Concessions to Make Upfront (Buy Credibility)
  *   **To the Quants:** "I am not arguing that data collection should stop. Better coding and imputation are vital. My argument applies even to perfect data."
  *   **To the Anthropologist:** "I agree that 'violence' is not a natural kind. My triad of measures is still a typology imposed on the world, but it is a more transparent one than a single aggregate."
  *   **To Everyone:** "I am not claiming we cannot measure trends. I am claiming we cannot measure *the* trend."

  ---

  ### II. The Eight Objections (Ordered by Damage Potential)

  #### 1. The "Measurement Error" Objection (Quantitative Social Scientists)
  **The Objection:** "You're conflating conceptual incommensurability with measurement error. Yes, counts and rates diverge, but that's just noise or population scaling. As datasets improve, these metrics will converge on a single signal. You're using philosophical skepticism to avoid the hard work of operationalization."
  **The Reply:** "If it were just measurement error, the divergence would shrink as data improves. But mathematically, it won't. If population grows while conflict frequency stays flat, absolute counts stay flat but per-capita rates drop. That divergence isn't noise; it's structural. You can code perfectly and still get opposite trends. My point isn't that we can't measure; it's that measuring 'violence' requires choosing whether to weight by *heads* or by *events*. That's a normative choice, not a coding rule."
  **Weakness:** They may argue that per-capita is the *only* valid operationalization, rendering the absolute count irrelevant rather than equally valid.

  #### 2. The "Denominator is King" Objection (Economic Historians)
  **The Objection:** "In risk analysis, the per-capita rate is the only metric that matters. Absolute counts are meaningless without population context. A stable homicide rate in a growing population *is* a decline in individual risk. Why should we care about the absolute count?"
  **The Reply:** "Because 'risk to an individual' is not the only moral quantity that matters. If a state doubles in size and keeps the same repression rate, the per-capita risk is unchanged, but the total suffering has doubled. If you only look at rates, you become indifferent to the scale of harm imposed by large populations. Choosing the rate prioritizes the *individual's odds*; choosing the count prioritizes the *aggregate suffering*. Both are valid moral perspectives, but neither is the 'scientific' default."
  **Weakness:** This relies on the audience accepting "aggregate suffering" as a valid metric over "individual risk," which is a contentious utilitarian claim.

  #### 3. The "Impossible Weighting" Objection (Methodologists/Quants)
  **The Objection:** "Your third metric, 'harm-weighted incidence,' is unworkable. Who assigns the weights? How do you compare a psychological threat to a physical injury? This introduces massive subjectivity that destroys comparability across time and culture. It's a philosopher's metric, not a scientist's."
  **The Reply:** "It is subjective, but no more than the decision to count a riot as one event or ten. Currently, the literature hides the weighting by treating all events as equal units (a count of 1). I'm arguing we make the weighting explicit. We already do this in disability-adjusted life years (DALYs) in public health. We can use surveys or consensus panels to estimate severity weights. It's hard, but 'hard' isn't 'impossible,' and hiding the weights doesn't make them go away."
  **Weakness:** You don't have a concrete coding scheme for this yet. They will press for a prototype, and you may not have one.

  #### 4. The "Paralysis" Objection (Legal Philosopher)
  **The Objection:** "If there is 'no fact of the matter,' what is the policy implication? Do we stop intervening? If we can't say violence is declining, do we lose the justification for the institutions that reduced it? This sounds like moral relativism disguised as precision."
  **The Reply:** "It's not relativism; it's pluralism. We don't stop acting because metrics diverge; we stop pretending the metrics dictate the action. If absolute harm is rising but per-capita risk is falling, we shouldn't say 'violence is down.' We should say 'individual safety is up, but total harm is up.' That clarifies the policy choice: do we invest in individual protection or conflict reduction? It forces us to own the normative trade-off rather than hiding it behind a trend line."
  **Weakness:** It risks sounding like you are undermining the "progress" narrative that funds their research.

  #### 5. The "Ontological" Objection (Anthropologist)
  **The Objection:** "You're still treating 'harm' as a universal. In some societies, ritual violence isn't 'harm' in your sense; in others, state taxation is violence. Your three metrics just refine the Western, state-centric ontology. You haven't escaped the civilizing-process bias; you've just quantified it."
  **The Reply:** "That's a fair critique of the *inputs*, but not the *logic*. Even if we restrict the dataset to your definition of violence, the divergence between count, rate, and severity remains. I'm not defining what violence *is*; I'm defining how we measure the *magnitude* of whatever we agree to count. You can reject the state's definition of violence, but once you have a set of events, the math of how you aggregate them still applies."
  **Weakness:** She may argue that "severity" is culturally specific (e.g., shame vs. pain), making cross-temporal weighting impossible.

  #### 6. The "Legitimacy" Objection (Criminologist/Legal Philosopher)
  **The Objection:** "You're treating state coercion and criminal violence as commensurable. A state execution and a lynching might have the same 'harm weight,' but one is legitimate coercion and the other is crime. If you aggregate them, you obscure the monopoly on violence that defines the modern state."
  **The Reply:** "I am not arguing they are morally equivalent, only that they are physically commensurable in terms of victim harm. The decline-of-violence literature often celebrates the state's monopoly as the cause of the decline. To test that, we must count the violence the state *produces*, not just the violence it prevents. If we exclude state violence from the metric, we are measuring 'order,' not 'violence.'"
  **Weakness:** This is politically charged. Some in the room may view state violence as categorically distinct from "social violence."

  #### 7. The "Historical Divergence" Objection (Economic Historians)
  **The Objection:** "Okay, theoretically they can diverge. But empirically, do they? In the long-run data we have (e.g., Eisner, Pinker), don't all three metrics generally trend down together? If they correlate, your distinction is academically interesting but historically inert."
  **The Reply:** "They correlate in the post-WWII West, but not globally or historically. During the colonization of the Americas, per-capita indigenous risk skyrocketed while absolute European violence counts might have been stable. In the 20th century, absolute war deaths rose even as per-capita rates fluctuated. The correlation is an artifact of looking at specific, pacified time windows. In the long run, population growth and weapon lethality ensure these metrics decouple."
  **Weakness:** You need to be ready with a specific historical example if they press for one.

  #### 8. The "Strawman" Objection (General Audience)
  **The Objection:** "Nobody actually thinks this is simple. Every serious researcher knows the difference between rates and counts. You're attacking a simplified version of the literature to make a philosophical point that doesn't change how we work."
  **The Reply:** "Researchers know it intellectually, but the literature collapses it rhetorically. Headlines say 'Violence is Down,' not 'Per-Capita Homicide Risk in Specific Jurisdictions is Down.' My paper isn't about your private coding rules; it's about the public truth-claims derived from them. As long as the field presents a single verdict on 'violence,' it is misleading the public and policymakers."
  **Weakness:** It might come off as scolding the audience for how they communicate rather than engaging with their science.

  ---

  ### III. The Single Reply That Must Land
  **Target:** Objection #2 (The "Denominator is King" Objection).
  **Why:** If the room accepts that per-capita rates are the *only* scientifically valid measure, your triad collapses, and the "no fact of the matter" thesis fails.
  **The Core Argument:** "Risk (rate) and Suffering (count/weight) are different moral goods. A world with 1 billion people and a 0.001% murder rate has less *risk* than a tribe of 100 with a 1% rate, but it has 10,000 times more *corpses*. If you say the world is 'less violent' in the first case solely because of the rate, you are asserting that the total volume of suffering doesn't matter, only the odds. That is a defensible ethical position, but it is not a statistical fact. It is a choice to prioritize the individual over the collective. I am asking you to make that choice explicitly."

  ---

  ### IV. The Question You Hope Nobody Asks
  **The Question:** "Okay, you've dismantled the existing metrics. For your own research, or for policy, which of the three do *you* use? If you refuse to choose, you offer no guidance. If you do choose, you've just made the normative stipulation you're criticizing others for."
  **Why it's dangerous:** It forces you out of the critic's chair and into the actor's chair. If you pick one, you undermine the claim that they are irreducible. If you refuse to pick, you confirm the "paralysis" objection.
  **Prepared Deflection:** "I prioritize harm-weighted incidence for moral reasoning, but I report all three for transparency. My paper isn't a policy platform; it's a metadata warning label. I'm not telling you which drug to take; I'm telling you the dosage instructions are missing."
