answer: |-
  1999. The office smells of lemon polish and photocopier toner. Dr. Aris slides the pamphlet across the desk. *Diagnostic Index of Cognitive States, 3rd Revision.*

  "Read the bolded line," Aris says.

  Elias reads. "I feel like I am waiting for a signal that has stopped broadcasting."

  "Yes," Elias says. His shoulders drop three inches. "Exactly. I thought I was broken."

  "You have Resonance Loss," Aris says. "It's physiological. We have a name for it now."

  Elias leaves lighter. He has a shape for his hollow. He joins the forum. There are three hundred others. They share coping strategies. They are real.

  2009. The waiting room is crowded. Teenagers in hoodies, scrolling phones. Aris sighs, marking charts. All of them quote the sentence. Some smile when they say it, like reciting a lyric.

  "It's become a fashion," Chen says, leaning in the doorway, holding a stack of new intake forms. "They're not suffering, Aris. They're curating an aesthetic of detachment."

  "The distress is measurable," Aris snaps. "Cortisol levels. Sleep disruption."

  "Because they believe the label demands it. You told them what pain looks like."

  "I told them what to call it."

  "The call creates the bird."

  The DICS-4 comes out. New criterion added: *Persistent inability to initiate task structures unrelated to social feedback, verified by third-party report.* The teens vanish. They wanted the numbness, not the paperwork. The clinic empties. The support forum goes dark.

  2019. Elias returns. He looks older, solid. He wears a suit.

  "I'm here for a check-up," he says.

  Aris checks the digital file. "You're off the registry?"

  "You revoked my diagnosis."

  "The criteria tightened. You don't meet the functional impairment threshold anymore. You're employed. Married."

  "I still feel it."

  "Do you say the sentence?"

  Elias pauses. He looks at the poster on the wall, outdated now. "Waiting for a signal? No. That sounds... old. Like dial-up. Nobody broadcasts anymore."

  "So you're recovered."

  "I'm unclassified." Elias grips the chair arms. The leather creaks. "For ten years, that sentence was the only thing that made sense of the quiet. Now I'm just quiet. There's no community for just quiet. I lost my people."

  "Health isn't a community, Elias."

  "It was mine. Now I'm just lazy."

  Chen watches from the hall, arms crossed. "See? The category shifted, so the people shifted. You chased them out."

  "They changed their reports," Aris says. "The underlying pathology remains. We just lost the language to catch it. We purified the kind."

  "Or the language created the pathogen. You gave them a script, they performed it, then you changed the script and blamed them for stopping."

  "People were hurting before 1999, Chen. Before the index."

  "Were they hurting *this* way? Or were they just sad?"

  Aris looks at Elias, who is staring at his hands, looking for a tremor that isn't there. The hands are steady.

  "Does it matter?" Aris asks. "He was here. He needed help."

  "And now?"

  "Now he's alone. And you call that progress?"

  "I call it accuracy."

  "Accuracy for whom?"

  Aris closes the file. The screen goes dark.

  "For the science," Aris says.

  "Science studies things," Chen says. "Not mirrors."

  (This stresses Hacking's concept of interactive kinds and the looping effect.)
