answer: |-
  ### Final Exam: Ethics 405 – Advanced Normative Theory
  **Time Allowed:** 50 Minutes
  **Word Limit:** None (Manage your time accordingly)

  **Question 4: The Ratchet Problem**

  Standard deontic logic divides acts into three categories: **Forbidden**, **Obligatory**, and **Optional**. Within the Optional, we identify **Supererogatory** acts: those that are morally good to perform but not required.

  Consider the following distinction regarding optionality:
  *   **Narrowly Optional:** An act is permissible to perform or omit *at the time of choice*, regardless of future consequences.
  *   **Widely Optional:** An act is permissible to perform or omit, *and* choosing either option leaves the agent's overall future duty profile unchanged.

  Now consider a **Self-Escalating Act**.
  *Case:* Nadia can sign up as the on-call responder for a clinic in a remote town. Signing up is costly (money, time) and initially **Narrowly Optional**. However, once she signs up, patients rely on her. Quitting after six months would harm them. Thus, signing up converts her future freedom into obligation. Continuing is now required. A **One-Shot Act** (e.g., saving a drowning child) does not create this future obligation.

  *Devlin's Claim:* "Supererogation requires Wide Optionality. If an act creates new obligations that bind the agent later, it cannot be supererogatory. It is merely a trap."

  **In a coherent essay, address the following:**
  1.  **Evaluate Devlin's Claim:** Can a self-escalating act (like Nadia's) be supererogatory? Defend your position.
  2.  **Define Supererogation:** Based on your answer to (1), does the standard definition of supererogation need patching? If so, how must it account for the agent's future duty profile?
  3.  **Comparative Praise:** Suppose a One-Shot Hero saves a life and walks away. Nadia signs up, serves for a year, and then (permissibly) hands over the role. Assuming equal net good produced, should we praise Nadia more, less, or the same? Why?

  ***

  ### Model Answer (Approx. 650 Words)

  Devlin's claim that supererogation requires wide optionality is intuitively appealing but ultimately mistaken. It conflates the deontic status of an act at the time of choice with the causal consequences of that act on future obligations. A self-escalating act can indeed be supererogatory, provided we correctly time-index the condition of optionality.

  To see why Devlin fails, we must distinguish between the *ex ante* and *ex post* perspective. At $t_1$, when Nadia considers signing up, she is under no duty to do so. She is free to walk away with her moral record intact. This satisfies the core condition of supererogation: the act is not required. Devlin argues that because signing up creates a duty at $t_2$ (to continue serving), the act at $t_1$ loses its supererogatory status. This implies that an act's classification depends on its future ripple effects on the agent's liberty. However, this collapses the distinction between "creating an obligation" and "having an obligation." Nadia is not obligated to sign up. She *becomes* obligated only after she voluntarily undertakes the role. The supererogatory nature of the act resides in the voluntary undertaking of a burden, even if that burden includes the loss of future optionality.

  Therefore, self-escalating acts are supererogatory. They are good, optional at the moment of choice, and involve significant sacrifice (including the sacrifice of future freedom). Devlin's error lies in demanding *wide* optionality. If wide optionality were required, almost no long-term commitments (marriage, parenthood, specialized careers) could be morally praiseworthy in a supererogatory sense, as they all restrict future options. This would restrict supererogation to fleeting, one-shot interventions, which contradicts our moral intuition that sustained commitment is often *more* morally significant than isolated heroism.

  This necessitates a patch to the standard definition of supererogation. The standard definition states: *Act A is supererogatory iff A is good, and A is not obligatory.* To handle ratchet cases, we must specify: *A is not obligatory **at the time of performance**.* The definition must range over the act itself, not the agent's post-act duty profile. We must explicitly reject the idea that an act ceases to be optional because it generates future obligations. The "optionality" condition is a snapshot of the agent's deontic freedom at the moment of decision. If we fail to patch the definition this way, we render the category of supererogation useless for evaluating life-shaping choices, limiting it to trivial or momentary good deeds. The definition must accommodate the fact that moral growth often involves voluntarily entering states of higher obligation.

  Finally, regarding praise: We should praise Nadia *more* than the One-Shot Hero, assuming equal net good. The One-Shot Hero expends resources (time, risk) but retains their full autonomy afterward. They pay a cost, but they do not mortgage their future. Nadia, by contrast, pays the cost *plus* the cost of restricted future liberty. She voluntarily accepts a ratchet mechanism that binds her. There is a distinct moral value in binding oneself to the good. The One-Shot Hero demonstrates beneficence; Nadia demonstrates fidelity and integrity over time.

  Furthermore, the risk profile differs. The One-Shot Hero faces a known, contained risk. Nadia faces an open-ended commitment where the costs might escalate beyond her initial calculation. By signing up, she accepts liability for future unknowns. Praise tracks sacrifice and risk. Since Nadia sacrifices her future wide optionality while the One-Shot Hero does not, Nadia's moral expenditure is higher. To praise them equally would be to ignore the value of autonomy. Nadia gave up something the One-Shot Hero kept: the right to walk away. Therefore, while both are praiseworthy, the self-escalating nature of Nadia's act amplifies the moral weight of her choice, warranting greater praise.

  ***

  ### Marking Scheme (Total: 20 Points)

  **Part 1: Evaluation of Devlin & Status of Self-Escalating Acts (6 Points)**
  *   **6 pts:** Clearly argues that self-escalating acts *can* be supererogatory. Identifies that optionality is determined at the time of choice ($t_1$), not by future consequences ($t_2$).
      *   *Common Blow-up:* Students argue Nadia is obligated from the start because the consequences are foreseeable (confusing foresight with duty).
  *   **4-5 pts:** Correct conclusion but muddles the timing. Argues it is supererogatory but admits Devlin has a point without fully refuting the "wide optionality" requirement.
  *   **0-3 pts:** Agrees with Devlin (acts cannot be supererogatory if they create duty) without recognizing this eliminates long-term commitment from the category.

  **Part 2: Implications for Definition (8 Points)**
  *   **7-8 pts:** Explicitly proposes time-indexing the definition ("not obligatory *at the time of performance*"). Distinguishes the *act* from the *agent's trajectory*. Notes that the standard definition ranges over the act, not the post-act duty profile.
      *   *Common Blow-up:* Students suggest adding a "no future obligations" clause to the definition (which would ban marriage/parenthood from being good) or fail to specify *when* the act is optional.
  *   **4-6 pts:** Suggests the definition needs changing but offers a vague patch (e.g., "we need to consider context") without pinpointing the temporal element.
  *   **0-3 pts:** Claims the definition is fine as is without explaining how it survives Devlin's challenge.

  **Part 3: Comparative Praise (4 Points)**
  *   **4 pts:** Argues Nadia deserves *more* praise (or distinct praise) specifically because she sacrifices *future autonomy/wide optionality*. Connects praise to the cost of lost freedom.
      *   *Common Blow-up:* Students say "both are heroes" or "praise depends on outcome," ignoring the structural difference in autonomy costs.
  *   **2-3 pts:** Argues for more praise but relies on "she worked longer" rather than the structural loss of optionality.
  *   **0-1 pts:** No clear stance or argues Nadia deserves less because she "made a rod for her own back."

  **Clarity & Structure (2 Points)**
  *   **2 pts:** Concise, follows the 1-2-3 structure, no fluff.
  *   **1 pt:** Disorganized or significantly over/under length.
  *   **0 pts:** Illegible or incoherent.

  **A vs. B Distinction:**
  *   **A Range (17-20):** Explicitly identifies that "required" in the definition must mean "required at the time of choice," not "required all things considered." Recognizes that rejecting wide optionality is necessary to preserve the moral value of commitment.
  *   **B Range (14-16):** Gets the right result (Nadia is supererogatory) but treats the "wide optionality" constraint as a minor hurdle rather than a fundamental category error in Devlin's claim.
