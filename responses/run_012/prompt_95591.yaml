answer: |-
  **Course:** POLS 450 – Medieval Political Thought
  **Exam:** Final Take-Home Essay
  **Time Limit:** 90 Minutes (Closed Book)
  **Instructions:** Answer the following question in essay form. No footnotes or bibliography required. Direct quotations are not necessary; reference texts by title or conventional designation (e.g., *Summa Theologiae*, *De Regno*).

  ***

  ### Essay Question

  In the *Summa Theologiae* (II-II, Q. 42), Aquinas suggests that disturbing a tyrannical regime is not sedition because such a regime is ordered to a private good rather than the common good. However, in *De Regno*, he argues that removing a tyrant is not the business of private individuals but requires public authority, warning that private attempts often lead to greater evils.

  A colleague proposes the "borrowed criterion" reading: she argues that for Aquinas, the "common good" language in the sedition question is doing no independent normative work. Instead, she claims Aquinas's single constant criterion for legitimate resistance is strictly juridical: *who holds the public authority to act on the community's behalf.*

  Evaluate this reading. Does the "common good" function merely as a description of valid authority, or does it remain an independent teleological standard that constrains authority? In your answer, you must account for the tension between the consequentialist proviso in the *Summa* (that upheaval must not make things worse) and the procedural restrictions in *De Regno*, as well as the apparent shift from his earlier commentary on the *Sentences*.

  ***

  ### Model Answer

  The "borrowed criterion" reading offers a compelling simplification of Aquinas's mature thought, but it ultimately fails to account for the substantive moral work the "common good" performs in his earlier analysis. To adjudicate this, we must distinguish between the *justification* for resistance (the end) and the *agent* of resistance (the means). While Aquinas increasingly restricts the agent to public authority, he never abandons the common good as the independent metric by which tyranny is judged.

  In *Summa Theologiae* II-II, Q. 42, Aquinas defines sedition as opposing the unity and peace of the multitude. Crucially, he argues that a tyrannical regime, being ordered to the private good of the ruler, lacks justice. Therefore, disturbing it is not technically sedition. Here, the criterion is explicitly teleological: the regime is illegitimate because of *what it does* (serves private good), not merely *how it began*. However, Aquinas immediately introduces a consequentialist brake: resistance is permissible only if the upheaval does not leave the community worse off than the tyranny itself. This proviso demonstrates that the "common good" is not just a label for valid authority; it is a calculable outcome that can theoretically justify resistance even against a legitimate ruler who turns tyrant, provided the calculus of harm favors removal.

  The "borrowed criterion" reading gains traction when we turn to *De Regno*. Here, Aquinas addresses the question of whether killing a tyrant is a "great and manly deed." He answers negatively for private individuals. Even if the ruler is tyrannical, a private citizen lacks the *judicium publicum* (public judgment) to execute removal. This shifts the focus from the nature of the regime to the status of the resister. If we look only at *De Regno*, the colleague's reading holds: the common good is protected by reserving the right of resistance to those who already embody public authority (the community or a superior).

  However, accepting the "borrowed criterion" as the *whole* story ignores the developmental tension evident in the *Sentences* commentary. In his early work, Aquinas is notably friendlier to tyrannicide, suggesting that killing a tyrant who usurps power by force is praiseworthy. The shift to the cautious position in *De Regno* and the *Summa* reflects a growing prudential concern about stability, not a rejection of the common good as a standard. If the common good were merely "borrowed" from the concept of authority, Aquinas would have to argue that a tyrant with public authority is by definition serving the common good. He does not do this. He maintains that a ruler with legitimate title can still rule tyrannically (against the common good), yet private individuals still cannot kill him.

  Therefore, the "common good" and "public authority" are distinct criteria that operate at different levels. The common good is the *substantive* condition that defines tyranny; public authority is the *procedural* condition that licenses the remedy. The colleague is correct that for Aquinas, legitimate authority is the necessary condition for *action*, but incorrect that it renders the common good language redundant. The common good remains the independent standard that identifies the problem, even if the solution is restricted to avoid greater disorder.

  The consequentialist proviso in the *Summa* bridges these two concepts. It acknowledges that while public authority is the proper agent, the *goal* remains the welfare of the subjects. If the "public authority" (e.g., the nobility or emperor) acts to remove a tyrant but creates civil war that destroys the multitude, they violate the common good standard. Thus, the common good constrains the authority just as it defines the tyranny.

  In conclusion, the "borrowed criterion" reading accurately identifies Aquinas's mature insistence on procedural order over private virtue. It explains why he retreats from the *Sentences* to *De Regno*. However, it is reductive to claim the common good does no independent work. Without the independent teleological standard of the common good, Aquinas could not distinguish a tyrant from a legitimate king in the first place, nor could he warn public authorities that their own removal of a tyrant might become tyrannical if it harms the community. Aquinas does not replace the common good with authority; he subordinates the *right of resistance* to authority to protect the *reality of the common good* from the chaos of private judgment.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade Cap Warning:** An answer that relies primarily on the distinction between the "usurping tyrant" vs. the "legitimate ruler gone bad" (the "two tyrannies" distinction) **cannot score higher than 11/20 (C+ range)**, regardless of writing quality. This distinction is descriptive; the question asks for an analysis of the *justificatory logic*.

  **1. Identification of the Core Tension (4 Marks)**
  *   **4:** Clearly articulates the conflict between the teleological definition of tyranny (ST: ordered to private good) and the procedural restriction on resistance (De Regno: requires public authority).
  *   **2-3:** Identifies the texts but treats them as separate topics rather than a tension to be resolved.
  *   **0-1:** Fails to distinguish the arguments of *ST* and *De Regno*.
  *   *Common Error:* Treating *ST* and *De Regno* as saying the exact same thing without noting the shift in emphasis regarding *who* may act.

  **2. Analysis of the "Common Good" vs. "Authority" (6 Marks)**
  *   **5-6:** Successfully adjudicates the colleague's thesis. Argues that "common good" is the *end* (substantive) and "authority" is the *means* (procedural). Rejects the idea that common good language is redundant.
  *   **3-4:** Accepts or rejects the colleague's thesis without nuance (e.g., "She is totally right" or "She is totally wrong").
  *   **0-2:** Merely summarizes the texts without engaging the "borrowed criterion" hypothesis.
  *   *Common Error:* Claiming Aquinas abandons the common good in *De Regno*, or claiming authority doesn't matter in the *Summa*.

  **3. Engagement with the Consequentialist Proviso (4 Marks)**
  *   **4:** Explains how the "worse off" proviso (ST) functions as a bridge between the goal (common good) and the restriction (stability/order).
  *   **2-3:** Mentions the proviso but fails to link it to the argument about authority.
  *   **0-1:** Omits the proviso entirely.
  *   *Common Error:* Treating the proviso as an afterthought rather than a key constraint on the use of public authority.

  **4. Developmental Context (Sentences Commentary) (3 Marks)**
  *   **3:** Uses the *Sentences* reference to show the hardening of Aquinas's position on private initiative (prudential shift vs. doctrinal change).
  *   **1-2:** Mentions the *Sentences* but treats it as unrelated data.
  *   **0:** Omits the *Sentences*.
  *   *Common Error:* Claiming Aquinas changed his definition of tyranny, rather than his view on the *remedy*.

  **5. Argumentative Structure & Clarity (3 Marks)**
  *   **3:** Clear thesis, logical progression, concise conclusion.
  *   **1-2:** Disorganized or difficult to follow.
  *   **0:** Incoherent.

  **Total: 20 Marks**

  **Grade Boundaries:**
  *   **18-20 (A):** Flawless adjudication. Rejects the "borrowed criterion" as reductive while acknowledging its insight into proceduralism. Integrates all three texts seamlessly.
  *   **15-17 (B):** Strong analysis. Engages the colleague's thesis but perhaps leans too heavily on one text. Minor omissions in the developmental argument.
  *   **12-14 (C):** Competent description. Identifies the texts and the basic problem. **Maxes out here if relying on the "Two Tyrannies" distinction.**
  *   **0-11 (D/F):** Factual errors, ignores the prompt's specific constraint regarding the colleague's thesis, or purely descriptive summary.
