answer: |-
  You have identified a genuine and pervasive methodological pathology in historical and social-scientific explanation. It is not merely a vague intuition; it corresponds to specific, well-discussed problems in the philosophy of causation and comparative historical analysis, though it often lacks a single, universally recognized label in the way *post hoc ergo propter hoc* does.

  Here is the carving you are looking for, mapping your distinction onto established concepts, identifying the legitimate version of the move, its mirror image, and proposing a name for the failure mode.

  ### 1. Established Conceptual Mappings

  Your distinction between a **Constraint** (what could not happen) and a **Cause** (why this rather than that) tracks a classic distinction in the philosophy of science and biology: **Permissive vs. Productive Causation**.

  *   **Permissive Cause (Your Constraint):** A condition that must be present for an effect to occur but does not determine *which* effect occurs or *when* it occurs. (e.g., Oxygen is permissive for fire; it allows combustion but does not start it).
  *   **Productive Cause (Your Cause):** A condition that actively brings about the change and accounts for the variation in outcomes. (e.g., The spark is productive; its presence or absence explains why fire started here and not there).

  The failure mode you describe is the **Reification of a Permissive Condition**. It occurs when a historian treats a permissive background condition as if it were a productive cause. Because permissive conditions are often slow-moving and structural (soil quality, climate, demographics), they carry the rhetorical weight of "deep history," which shields them from the scrutiny applied to event-based claims.

  In the literature of **Comparative Historical Analysis (CHA)**, this is often discussed under the umbrella of **The Problem of Constant Causes**. If a variable (salinization) is constant across cases (District A and District B) but the outcome varies (abandonment vs. intensification), that variable cannot, logically, be the *sole* cause of the variation. To claim it is, is a violation of **Mill's Method of Difference**.

  However, your insight goes deeper than Mill. You note that the variable is not just constant, but its *interpretation* flips to match the outcome. In philosophy of biology, this is sometimes called **Explanatory Flexibility**. In historiography, it is a specific form of **Confirmation Bias** masked as **Structural Determinism**.

  ### 2. Is Your Distinction Real?

  Yes. Your **Constraint vs. Cause** distinction maps robustly onto **Necessary vs. Sufficient** conditions, but with a temporal nuance.

  *   **Constraint:** A **Necessary** condition (or a INUS condition: an *I*nsufficient but *N*ecessary part of a condition which is itself *U*nnecessary but *S*ufficient). It defines the boundaries of the possibility space.
  *   **Cause:** A **Sufficient** condition (or the specific conjunct that completes the INUS set). It selects the path within the boundaries.

  The error arises because slow variables are excellent at defining constraints (you cannot grow rice without water) but terrible at explaining variation *within* the constraint (why District A grew rice and District B did not, given both had water). When a historian uses a slow variable to explain variation without identifying the *interaction* that triggered the variation, they are committing the **Fallacy of the Invariant Explanans**.

  ### 3. The Legitimate Version: Conjunctural Causation

  You asked if there is a version of this move that remains legitimate. There is. It is known as **Conjunctural Causation** or **Interaction Effects**.

  In this legitimate model, the slow variable does not act alone. It creates a state of **latent potential** or **systemic vulnerability**, which requires a fast variable (a trigger) to actualize.

  *   **Example:** A century-scale drying trend (slow) makes a society vulnerable to famine. A single drought year (fast) triggers the collapse.
  *   **The Logic:** The slow variable explains *why the collapse was catastrophic here but manageable there* (because the slow variable differed between the two cases, or the threshold was crossed in one but not the other).
  *   **The Boundary:** For this to be legitimate, the slow variable must **vary** between the cases in a way that correlates with the *sensitivity* to the trigger, or the trigger must be shown to be present in the positive case and absent in the negative case.

  If the slow variable is identical in both cases, and the outcome differs, the explanation *must* reside in the fast variable or in a third, unmeasured variable. If the historian insists the slow variable explains the difference despite its invariance, they are engaging in **Structural Retrofitting**.

  ### 4. The Mirror Image: Event Reductionism

  You asked for the mirror image: a single event credited with a slow structural transformation it could not produce on its own.

  This is **Event Reductionism** (or sometimes **The Trigger Fallacy**). It is the error of attributing a structural shift (the rise of capitalism, the fall of an empire) to a singular event (the discovery of America, the assassination of an archduke) without acknowledging the slow-moving permissive conditions that made the event consequential.

  *   **The Structure:** Fast Event (Cause) $\rightarrow$ Slow Structural Change (Effect).
  *   **The Error:** Ignoring the "dry wood" (structural tension) and crediting only the "match" (the event).
  *   **The Name:** In historiography, this is often critiqued as **Eventism** or **Narrative Determinism**. It is the flip side of your problem: where your problem hides agency behind structure, this problem hides structure behind agency.

  ### 5. Naming the Failure Mode

  While "Reification of a Permissive Condition" is the precise philosophical description, it is cumbersome. The phenomenon you describe—a slow variable that explains opposite outcomes in identical contexts, deriving its authority from its unmeasurability—deserves a specific label.

  I propose: **The Fallacy of the Invariant Explanans**.

  *   **Definition:** The error of invoking a causal variable to explain variation in outcomes when that variable does not vary (or does not vary commensurately) across the cases in question, relying on the temporal depth of the variable to shield it from falsification.
  *   **Boundary Case 1 (Legitimate):** **Conjunctural Causation.** The slow variable varies between cases (e.g., Soil A is more saline than Soil B), explaining why the same drought caused collapse in A but not B.
  *   **Boundary Case 2 (Mirror):** **The Trigger Fallacy.** Attributing a structural outcome to a singular event without accounting for the invariant structural preconditions that made the event effective.

  ### Summary of the Carving

  | Feature | Your "Constraint" | Your "Cause" | The Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **Philosophical Term** | Permissive Condition | Productive Cause | Reification of Permissive Condition |
  | **Logical Status** | Necessary (mostly) | Sufficient (or INUS) | Treating Necessary as Sufficient |
  | **CHA Term** | Background Context | Causal Variable | The Problem of Constant Causes |
  | **Temporal Scale** | Slow (*Longue Durée*) | Fast/Variable | Temporal Mismatch |
  | **Proposed Name** | Structural Constraint | Causal Mechanism | **The Fallacy of the Invariant Explanans** |

  Your suspicion is correct: the "depth" of the explanation is an aesthetic quality, not a logical one. When a slow variable is invariant across cases with divergent outcomes, it is a **context**, not a **cause**. To treat it as a cause is to mistake the stage for the actor.
