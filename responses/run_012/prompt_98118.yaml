  *   **Case 2 (Packed Glass):** If struck, the foam prevents breaking. SCA predicts **No**. R says **Yes**.
  *   **Case 6 (Encased Sugar):** If placed in water, the shell prevents dissolving. SCA predicts **No**. R says **Yes**.

  R clearly believes that external preventers (masks) do not remove a disposition.

  ### 2. The Surviving Rules
  Two major philosophical accounts remain consistent with all six verdicts.

  **Rule A: The Intrinsic Basis Account (IBA)**
  *   **Definition:** An object possesses a disposition just in case it *currently* possesses the intrinsic categorical property (microstructure) that typically grounds that disposition.
  *   **Logic:** Dispositions are real, current properties of the object, not merely facts about what *would* happen. Masks and finks (Cases 2, 3, 6) interfere with the *manifestation*, but not the *possession* of the property. Mimics (Cases 4, 5) produce the *manifestation*, but lack the *property*.
  *   **Consistency:** Fits all six cases perfectly. It explains why the steel cup (Case 4) is not fragile (wrong microstructure) and why the packed glass (Case 2) is fragile (right microstructure).

  **Rule B: The Refined Counterfactual Account (CFA)**
  *   **Definition:** An object possesses a disposition just in case it *would* manifest the behavior if triggered, *provided* we hold fixed its intrinsic properties and ignore external masks or finks. (Often associated with David Lewis's "reformed conditional analysis").
  *   **Logic:** Dispositions are analyzed via counterfactuals, but the analysis is tweaked to exclude external interferers (Cases 2, 3, 6) and require the cause to be intrinsic (Cases 4, 5).
  *   **Consistency:** Fits all six cases perfectly. It predicts the glass breaks in Case 2 "if we ignore the foam," and predicts the steel cup in Case 4 does not break "even if we ignore the device."

  ### 3. Calling the Sleeper Alloy Case
  **The Case:** A rod that is currently soft/bendable (metastable). Being struck triggers an *intrinsic* transformation into a brittle state, causing it to shatter.
  **Question:** Is it fragile *before* it is struck?

  **My Prediction:** R will say **No**.

  **Why?**
  While both rules fit the first six cases, **Rule A (Intrinsic Basis)** is the stronger candidate for R's actual view.
  1.  **The Weight of Cases 4 & 5:** R's rejection of the mimic cases suggests she prioritizes the *nature of the object at the time of ascription* over the *outcome*. In the Sleeper Alloy, the nature at the time of ascription is "soft/metastable," not "brittle."
  2.  **The Lesson of Case 3:** In Case 3 (Sorcerer), R says the glass *is* fragile even though a spell prevents breaking. This implies she judges fragility based on the state *before* the trigger ($t_0$), not the outcome at impact ($t_1$). In Case 3, the object is brittle at $t_0$. In the Sleeper Alloy, the object is *not* brittle at $t_0$. If R is consistent, she should deny the disposition when the basis is absent at $t_0$, even if the outcome is the same.
  3.  **Philosophical Context:** Philosophers who specialize in dispositions (as R does) often defend them as *real powers* distinct from conditional outcomes. The IBA is the standard realist position. The CFA is often a fallback for those trying to save conditional analysis. R's flat "Yes/No" verdicts on masks/finks suggest a robust realism about the property itself.

  **Predicted Verdicts:**
  *   **Intrinsic Basis Rule:** **No.** (The current basis is for bending, not breaking).
  *   **Refined Counterfactual Rule:** **Yes.** (If struck, it *would* break, and the cause is intrinsic).

  ### 4. The Decisive Test Case
  To confirm which rule R is running, you should present her with the **Intrinsic Fink** case. This is the mirror image of the Sleeper Alloy and Case 3.

  **The Case:**
  > A glass rod with the ordinary microstructure of glass (brittle at $t_0$). However, its intrinsic structure is such that the shock of being struck causes it to instantaneously soften *before* fracture can occur. It bends rather than breaks. Nothing external acts on the rod; the shock-absorption is purely intrinsic.

  **Question:** Is the rod fragile *before* it is struck?

  **How this forces the rules apart:**
  *   **Intrinsic Basis Rule (Rule A):** **Yes.**
      *   *Reasoning:* At the moment of ascription ($t_0$), the rod possesses the intrinsic categorical base for fragility (glass microstructure). The fact that this base changes *upon impact* is irrelevant to its current possession of the property (just as the Sorcerer's spell in Case 3 was irrelevant).
  *   **Refined Counterfactual Rule (Rule B):** **No.**
      *   *Reasoning:* The core of this rule is the counterfactual: "If struck, would it break?" In this case, the answer is *No*. Even holding intrinsic properties fixed, the intrinsic properties *themselves* ensure it does not break. Unlike the Sleeper Alloy, there is no "external mask" to subtract; the prevention is built into the object's response.

  **Why this is better than the Sleeper Alloy for testing:**
  The Sleeper Alloy relies on whether "metastable softness" counts as a basis for fragility (which might be semantically ambiguous). The Intrinsic Fink case is cleaner: the basis is definitely glass (Fragile), but the outcome is definitely safe (Not Fragile). If R says **Yes**, she is an Intrinsic Basis theorist. If she says **No**, she is a Counterfactual theorist.
