      *(Refining the "Labor" point)*: The prompt notes the labor justification sits awkwardly with arbitrariness. I need to emphasize that Lewisian conventions are arbitrary solutions to coordination problems (drive left OR right). Dibs is *not* arbitrary in the minds of participants; it's the *only* fair solution because of the work involved. This moves it from Convention to Norm.

