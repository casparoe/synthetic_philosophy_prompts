      *   **Task 1: Reconstruct the Implicit Theory:** Analyze what the participants (shovelers, neighbors, retaliators, police, city council) *do*, not necessarily what they *say*. What account of convention and norm-governed entitlement does this behavior presuppose?
      *   **Task 2: Evaluate against David Lewis's Theory of Convention:**
          *   Does Lewis's analysis (arbitrary stable regularity, coordination, common knowledge, etc.) suffice?
          *   If not, what more is needed? (Moralized expectation, punishment, desert/labor justification).
          *   Address the "labor" justification (non-arbitrary) vs. Lewis's "arbitrariness."
          *   Address the role of fear/retribution vs. Lewis's coordination focus.
      *   **Task 3: Distinguish Presupposition vs. Fit:** What does the practice *strictly* require vs. what fits well? Identify a rival account (e.g., social norms, property rights) that licenses the same behavior.
      *   **Task 4: Identify Underdetermination:** Show where the same actions support multiple readings (coordinative, sanctions-based, labor-entitlement).
      *   **Task 5: Counterfactuals:** What would change if the implicit theory were replaced by (a) a strictly coordinative reading or (b) a strict public property/legalist reading?

  2.  **Task 1: Reconstructing the Implicit Theory (The "Phenomenology" of Dibs):**

      *   *Shovelers:* Act as if they have generated a right through effort. The marker is a flag of sovereignty.
      *   *Neighbors:* Generally comply, even if annoyed. They recognize the claim as valid *within the context of the storm*. Violating it feels like theft, not just rule-breaking.
      *   *Retaliators:* If someone steals a spot, the punishment is social (keying, shouting, shaming) or physical (moving the car back). This implies enforcement is privatized.
      *   *Police/City:* Ambivalent. Sometimes enforce (tickets), sometimes ignore (Pittsburgh). This suggests the law recognizes a "zone of tolerance" where social norms override strict statutory property rights.
      *   *Implicit Theory:* It's a hybrid. It's not pure law (public space), not pure market (no money exchanged), not pure gift. It's a *labor-based customary easement* on public property. The entitlement is temporary, conditional on effort, and enforced socially rather than legally.

  3.  **Task 2: Evaluating against David Lewis:**

      *   *Lewis's Criteria:* Regularity, coordination problem, arbitrariness, common knowledge, preference to conform if others do.
      *   *Does it fit?*
          *   *Regularity:* Yes.
          *   *Coordination:* Yes, avoids conflict over scarce spots.
          *   *Arbitrariness:* **Problem.** Lewis says conventions are arbitrary (we could have driven on the left). Dibs is justified by *labor*. "I dug it, I keep it." That's not arbitrary; it's merit-based.
          *   *Preference to conform:* Lewis says I conform because *you* conform (coordination). In Dibs, I conform because I fear *retribution* or feel it's *unfair* to steal labor. That's not pure coordination; it's norm enforcement.
      *   *What more is needed?*
          *   *Normativity:* It's not just "we do this"; it's "you *should* do this."
          *   *Sanctions:* Lewis minimizes punishment; Dibs relies on the threat of keying/yelling.
          *   *Desert:* The labor justification makes it a claim of right, not just a signal.

  4.  **Task 3: Presupposition vs. Fit & Rival Accounts:**

      *   *Strict Presupposition:* The practice *needs* a belief that effort creates a temporary claim and that the community will back that claim socially.
      *   *Merely Fits:* It fits with Lewisian convention (it coordinates), but doesn't *require* the arbitrariness clause. It fits with Lockean property theory (mixing labor with resources), but doesn't require full ownership (it's temporary).
      *   *Rival Account:* **Elster's Social Norms.** Jon Elster distinguishes conventions (coordination) from social norms (internalized + sanctions). Dibs looks more like an Elsterian norm. Or **Lockean Proviso:** Mixing labor with the "common" creates property, provided enough is left for others.

  5.  **Task 4: Underdetermination:**

      *   *Scenario:* A neighbor sees a chair and parks elsewhere.
      *   *Coordinative Reading:* "I see the chair, I know others expect me to skip it, I skip it to avoid confusion."
      *   *Sanctions Reading:* "I skip it because I don't want my car keyed."
      *   *Entitlement Reading:* "I skip it because it's not mine; they earned it."
      *   *Observation:* The external behavior (skipping the spot) is identical. The *motivation* is underdetermined by the action alone. We only know the theory by listening to arguments during conflicts (e.g., "I dug it!" vs. "It's public street!").

  6.  **Task 5: Counterfactual Changes:**

      *   *Scenario A: Strictly Coordinative (Lewisian).*
          *   *Change:* Once the snow melts, or if the city plows, the convention dissolves instantly. No moral outrage if someone takes it. Markers are just signals, not claims. If the city says "stop," everyone stops immediately because the coordination equilibrium shifted.
          *   *Behavior:* Less anger, less retaliation.
      *   *Scenario B: Strict Public Property/Legalist.*
          *   *Change:* Markers are treated as trash/obstructions immediately. Police tow markers. No social stigma for taking the spot.
          *   *Behavior:* Shovelers stop shoveling public spots (tragedy of the commons? or just accept public plowing). Retaliation stops because the "theft" is legitimized by law.

  7.  **Drafting the Response (Iterative refinement):**

