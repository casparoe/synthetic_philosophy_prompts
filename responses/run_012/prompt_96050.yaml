answer: |-
  ### The Folk Law of the Snow Shovel: An Analysis of "Dibs"

  The practice of reserving cleared parking spaces with chairs, cones, or trash cans—known variously as "dibs," "space saving," or "holding the spot"—presents a fascinating case study in the emergence of informal governance. It operates in the interstices of public law and private action, creating a temporary regime of property rights on public thoroughfares. To understand the account of convention and norm-governed entitlement this practice presupposes, we must look past the statutory code and examine the "folk law" enacted by the shovelers, neighbors, and police.

  #### I. The Implicit Theory: Customary Easement via Labor

  If we reconstruct the theory implicit in the participants' behavior, we find a system that functions as a **temporary, labor-based customary easement on public property.**

  *   **The Shovelers:** By placing a marker, the shoveler acts as a homesteader. Their behavior presupposes that the application of physical labor to a public resource (the snow-covered street) generates a provisional exclusive right. The marker is not merely a signal; it is a flag of sovereignty.
  *   **The Neighbors:** When neighbors drive past a chair and keep searching, they act as if they recognize a valid claim. They do not merely avoid conflict; they often express moral indignation if the spot is taken ("That's not right, they dug it out"). This suggests they view the spot as temporarily "owned" or "leased" by the laborer.
  *   **The Retaliators:** When a spot is stolen, the retaliation (keying, shouting, moving the intruder's car) functions as private enforcement of a property right. This presupposes that the community has delegated the authority to punish violators to the claimant, bypassing the state.
  *   **The Police and City:** The ambivalent enforcement (ticketing in D.C., ignoring in Pittsburgh, time-limiting in Boston) suggests the state recognizes a "zone of tolerance." The implicit theory here is one of **subsidiarity**: during an emergency (the snow event), the state lacks the capacity to clear every curb, so it tacitly delegates allocation authority to residents, reclaiming full authority only when the emergency lapses or the norm becomes too disruptive.

  Collectively, this behavior presupposes that entitlement is not solely derived from statute (public ownership) but can be generated through effort (labor) and ratified by community recognition (convention).

  #### II. The Lewisian Test: Coordination vs. Normativity

  David Lewis's seminal analysis of convention defines it as an arbitrary but stable regularity in a recurring situation of coordination, where everyone conforms, expects others to conform, and prefers to conform given that others do. Does "dibs" fit this model?

  **Where it fits:**
  There is a clear coordination problem: multiple drivers want scarce cleared spots. Without a rule, conflict (scratches, shouting, gridlock) ensues. The chair serves as a focal point (a signal) that solves this coordination problem. There is common knowledge: everyone knows what the chair means.

  **Where it fails (and what is needed):**
  Lewis's account is insufficient for three specific reasons, requiring us to add layers of normativity and desert.

  1.  **Arbitrariness vs. Desert:** Lewis insists conventions are arbitrary; we could drive on the left or the right, provided we agree. However, the justification for "dibs" is explicitly *non-arbitrary* in the minds of participants. It is grounded in **labor**. The claim is "I dug it, therefore it is mine." This is a Lockean argument, not a Lewisian one. If the practice were purely Lewisian, a random person placing a chair without shoveling should have the same claim. But they do not; "spot pirates" are despised. The practice presupposes that the allocation is merited, not just coordinated.
  2.  **Preference to Conform:** In Lewis's model, I conform because *you* conform (I want to coordinate). In "dibs," I often conform because I fear *retribution* or feel *guilt*. The stability of the practice relies heavily on the threat of sanctions (keying, shaming). Lewis's theory minimizes punishment, treating conformity as a preference equilibrium. "Dibs" treats conformity as a moral or prudential obligation enforced by sanctions.
  3.  **Moralized Expectation:** Lewisian conventions are descriptive ("this is how we do it"). "Dibs" is normative ("this is how you *ought* to do it"). The anger directed at spot-thieves indicates a violation of a right, not just a breakdown in coordination.

  Therefore, the practice requires more than Lewis supplies: it requires a **moralized expectation of compliance** grounded in a **conviction that the claim is deserved.**

  #### III. Presupposition, Fit, and Rival Accounts

  We must distinguish between what the practice *strictly presupposes* and what merely *fits well* with it.

  *   **Strictly Presupposed:** The practice strictly presupposes a shared belief that effort creates a temporary priority right, and a shared willingness to enforce that right socially. Without the belief in the validity of the labor claim, the marker is just trash. Without the willingness to sanction, the marker is a suggestion.
  *   **Merely Fits Well:** A full **Lockean Property Theory** fits well (mixing labor with the commons creates property), but the practice does not strictly presuppose a philosophical commitment to natural rights. Participants need not believe in Locke; they only need to feel the unfairness of theft. Similarly, **Game Theory** fits well (Nash equilibrium), but does not capture the moral outrage.

  **A Rival Account:**
  A robust rival account that licenses the same behavior is **Jon Elster's theory of Social Norms.** Elster distinguishes conventions (coordination) from social norms (behavior driven by the anticipation of sanctions and internalized feelings of guilt/shame).
  *   *Lewisian Convention:* I leave the spot because I see the chair and know you expect me to.
  *   *Elsterian Norm:* I leave the spot because I would feel ashamed to steal your labor, or I fear you will key my car.
  "Dibs" is better described as a social norm than a pure convention. It relies on the "grip" of the norm—the emotional and social cost of violation—rather than just the coordinative benefit.

  #### IV. Underdetermination of the Practice

  The observable behavior in "dibs" is underdetermined regarding the underlying theory. The same action (parking elsewhere when seeing a chair) is compatible with three distinct readings:

  1.  **Purely Coordinative:** "I see the chair. I know if I park there, the shoveler will be confused or annoyed. I park elsewhere to keep traffic flowing smoothly." (Lewisian)
  2.  **Sanctions-Based:** "I see the chair. I know if I park there, someone might slash my tires. I park elsewhere to stay safe." (Hobbesian/Elsterian)
  3.  **Entitlement/Labor:** "I see the chair. I know that spot belongs to the shoveler because they worked for it. I park elsewhere because taking it would be theft." (Lockean)

  We only distinguish these theories when the norm is violated. If the community reacts with mere confusion, it was coordinative. If they react with violence, it was sanctions-based. If they argue about the *amount of snow shoveled*, it is an entitlement claim. The fact that neighbors argue about whether "moving snow" counts versus "shoveling to the curb" proves the **Entitlement Reading** is the dominant implicit theory; coordinative conventions do not usually invite moral scrutiny regarding the *quality* of the signal, only its presence.

  #### V. Counterfactuals: Changing the Implicit Theory

  If we were to replace the implicit theory of "Customary Easement" with alternative frameworks, the behavior and landscape would shift significantly.

  **1. Replacement with a Strictly Coordinative Reading (Lewisian)**
  *   **The Change:** The marker is acknowledged only as a signal of current occupancy, not a claim of right based on labor.
  *   **Behavioral Shift:** Once the shoveler leaves the immediate vicinity, or once the snow melts, the claim dissolves instantly. There would be no moral outrage if a stranger took the spot, only mild annoyance at the signal failure. Retaliation (keying) would vanish as disproportionate to the "coordination error."
  *   **Justification:** Participants would say, "I held it while I was here," rather than "I earned it."
  *   **Outcome:** The practice would be more fragile. Without the moral weight of labor, compliance would drop as soon as the coordination benefit (avoiding a fight) seemed lower than the benefit (getting a spot).

  **2. Replacement with a Strict Public Property/Legalist Reading**
  *   **The Change:** The space is recognized as exclusively public; only the city may allocate it. Markers are viewed strictly as obstructions/trash.
  *   **Behavioral Shift:** Police would tow markers immediately (as in strict enforcement zones). Shovelers would cease clearing public curbs, leading to a "tragedy of the commons" where no one clears snow because they cannot capture the benefit, or they would only clear driveways.
  *   **Justification:** "It's a public street." The labor argument would be dismissed as irrelevant to public allocation.
  *   **Outcome:** The "zone of tolerance" would close. The social contract of the snow emergency would be replaced by the statutory contract. While legally consistent, this would likely reduce the total number of available parking spots (since the city cannot shovel every curb instantly) and increase conflict between citizens and the state, even if conflict between neighbors decreased.

  ### Conclusion

  The practice of "dibs" presupposes a hybrid theory of entitlement that exceeds David Lewis's account of convention. It is not merely an arbitrary signal to coordinate traffic; it is a **labor-based social norm** that temporarily privatizes public space through community ratification. It relies on the moral weight of effort and the threat of private sanction to function. While it fits the pattern of a convention, its stability depends on the participants believing that the shoveler *deserves* the spot, not just that they *signaled* for it. To treat it as purely coordinative or purely legalistic is to misunderstand the folk law that keeps the chairs standing and the cars moving during the thaw.
