answer: |-
  ### Instructor's Note: Interpretive Options and Question Design

  In designing this question, I considered three primary interpretive paths students might take:

  1.  **The Metaphysical Continuity Thesis:** Students might argue that Berkeley's monetary nominalism is a direct consequence of his idealism. Since material substance does not exist, gold cannot have intrinsic value; therefore, money must be mental/conventional.
      *   *Risk:* This can become a vague "everything is ideas" recitation without engaging the economic mechanics.
  2.  **The Pragmatic Discontinuity Thesis:** Students might argue *The Querist* is purely policy, unrelated to his metaphysics.
      *   *Risk:* This ignores the seminar's goal of connecting his philosophical system to his economics.
  3.  **The Linguistic/Functional Thesis (Selected):** This is the most nuanced path. It argues that Berkeley treats money like language (a topic covered in the seminar). Money is a system of signs ("tickets") that coordinates action ("industry"). The "opinion" is not a fragile belief but a social commitment to labor. This avoids the "self-undermining" charge by grounding value in *activity* rather than *substance*.

  The chosen question forces students to navigate the tension between money as a mere "counter" and wealth as a product of "will." It requires them to explain how a "ticket" can have real effects without intrinsic value, inviting them to use their knowledge of Berkeley's philosophy of language (signs guiding action) to solve the economic problem.

  ***

  ### Final Examination: Philosophy 450 – George Berkeley

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Your response must engage directly with the provided passages from *The Querist*. You may reference concepts from the broader seminar (idealism, theory of vision, philosophy of language), but all textual evidence regarding Berkeley's economic views must come from the queries provided below.

  **Essay Question:**

  In *The Querist*, Berkeley asserts that the true idea of money is "altogether that of a ticket or counter" (Query 23), yet he also claims that it is the "opinion or will of the people" that "truly enricheth a nation" (Query 33). This raises a critical problem: if money is merely a conventional ticket with no intrinsic value, and its worth depends solely on public opinion, is Berkeley's account self-undermining? What prevents the value of money from collapsing if it rests on nothing but belief?

  Write an essay assessing whether Berkeley's account of money can successfully ground economic value without appealing to the intrinsic value of gold or silver. In your answer, you must:
  1.  Explain how Berkeley defines money in Queries 23 and 25.
  2.  Analyze the relationship between "money as a ticket" and the "will to industry" (Queries 5 and 32).
  3.  Evaluate whether Berkeley's broader philosophical commitments (such as his idealism or philosophy of language) help resolve the tension between conventional money and real wealth, or whether his economic views stand independently of his metaphysics.

  ***

  ### Model Answer

  Berkeley's economic thought in *The Querist* is often dismissed as mere mercantilist policy, but it presents a sophisticated philosophical challenge regarding the nature of value. The central tension lies between his nominalist definition of money as a "ticket or counter" and his assertion that national wealth relies on the "opinion or will of the people." A careful reading suggests that Berkeley's account is not self-undermining. Rather, he grounds the value of money not in the stability of belief itself, but in the causal power of that belief to generate industry. This functional view aligns closely with his broader philosophy of language, where signs are valued for their ability to guide action rather than their resemblance to reality.

  To understand Berkeley's position, one must first grasp his rejection of intrinsic value. In Query 23, Berkeley asks whether money should be considered a commodity with intrinsic value or merely a "ticket or counter." He reinforces this in Query 25, describing gold, silver, and paper as "tickets or counters for reckoning, recording, and transferring." By stripping money of inherent worth, Berkeley avoids the error of confusing the sign with the thing signified. If money were valuable because of the metal it contains, as Query 32 implies ("Whether there be any vertue in gold or silver, other than as they set people at work"), then a nation with little bullion would be necessarily poor. Berkeley rejects this. For him, the "vertue" of money is purely instrumental.

  However, if money is just a ticket, what gives it power? This is where the "opinion or will" enters. In Query 33, Berkeley states that it is the "opinion or will of the people, exciting them to industry, that truly enricheth a nation." A superficial reading might suggest this makes wealth fragile, dependent on fickle public sentiment. If the opinion changes, does the wealth vanish? This is the self-undermining objection. However, Berkeley links this opinion directly to labor. In Query 5, he defines the utility of money as its capacity to "stirreth up industry, enabling men mutually to participate the fruits of each other's labour." The "opinion" is not a passive belief that the paper is pretty; it is an active collective will to work. The ticket serves as the mechanism that coordinates this labor. Therefore, the value is not grounded in the ticket itself, nor in a fragile whim, but in the actual industry the ticket provokes. As long as the ticket successfully "set[s] people at work" (Query 32), it retains its value.

  This economic functionalism bears a striking resemblance to Berkeley's philosophy of language and idealism. In his broader metaphysics, material objects are collections of ideas, and language functions not by mirroring the world but by influencing conduct. Similarly, money does not need to "mirror" value through intrinsic gold content. It functions as a linguistic sign. Just as a word can command action without having a physical resemblance to the object it names, a paper "counter" can facilitate the "mutual participation" of labor (Query 5) without possessing intrinsic virtue. The connection between his metaphysics and economics is therefore structural: both reject abstract, hidden substances (whether material substratum or intrinsic monetary value) in favor of observable effects and utility.

  One might object that this comparison to language fails because language relies on shared grammatical rules, whereas economic opinion is prone to panic. If the people lose the "will," the system collapses. Berkeley anticipates this by anchoring the will in mutual necessity. Query 5 emphasizes that money enables men to "participate the fruits of each other's labour." The "opinion" is sustained by the practical necessity of exchange. It is not an arbitrary fiction but a social technology required for complex industry. Thus, the system is self-correcting: if the money fails to stir industry, it ceases to be money, but the need for industry remains.

  In conclusion, Berkeley's account of money is not self-undermining because it does not rest on belief alone. It rests on the causal link between the "ticket" and the "industry" it produces. By defining money as a tool for coordinating labor rather than a store of intrinsic worth, Berkeley provides a coherent nominalist theory of value. This view is not merely a practical intervention for Ireland but is consistent with his broader philosophical rejection of substance. Wealth is not a thing hidden in gold; it is the activity of a nation, recorded and transferred by the conventional signs we call money.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Interpretation of Money as "Ticket/Counter" (4 Points)**
  *   **Full Marks (4):** Clearly explains that Berkeley rejects intrinsic value in Query 23 & 25. Identifies money as a functional tool for "reckoning, recording, and transferring" rather than a commodity.
  *   **Partial (2-3):** Identifies money as a ticket but fails to explain the rejection of intrinsic value, or confuses the "ticket" with "fake" value.
  *   **Common Mistake:** Claiming Berkeley thinks money is "fake" or "worthless" because it is a ticket, missing the instrumental utility.

  **2. Analysis of "Opinion/Will" and "Industry" (4 Points)**
  *   **Full Marks (4):** Successfully connects Query 33 ("opinion or will") to Query 5 ("stirreth up industry"). Argues that the "opinion" is valuable *because* it causes labor, not merely because people believe in it.
  *   **Partial (2-3):** Discusses "opinion" and "industry" as separate points without explaining the causal link between them.
  *   **Common Mistake:** Treating "opinion" as arbitrary whim, leading to the conclusion that Berkeley's system is unstable.

  **3. Response to the Self-Undermining Objection (4 Points)**
  *   **Full Marks (4):** Explicitly addresses the prompt's challenge: "What prevents the belief from collapsing?" Argues that the grounding is in *activity/labor* (Query 32) rather than belief alone.
  *   **Partial (2-3):** Acknowledges the objection but offers a weak defense (e.g., "people just agree to it").
  *   **Common Mistake:** Ignoring the "self-undermining" aspect of the prompt entirely.

  **4. Connection to Broader Philosophy (Idealism/Language) (4 Points)**
  *   **Full Marks (4):** Draws a specific parallel between monetary signs and linguistic signs (or ideas). Explains that just as words guide action without resembling things, money guides industry without having intrinsic value.
  *   **Partial (2-3):** Vaguely mentions idealism (e.g., "everything is ideas") without explaining how it applies to the *function* of money.
  *   **Common Mistake:** Defaulting to "Berkeley is an idealist so money is an idea" without explaining the functional implication.

  **5. Use of Textual Evidence (4 Points)**
  *   **Full Marks (4):** Integrates at least three of the provided Queries (5, 23, 25, 32, 33) accurately to support claims. No invented quotations.
  *   **Partial (2-3):** Uses only one or two queries, or paraphrases inaccurately.
  *   **Common Mistake:** Quoting Berkeley from outside the provided text (e.g., *Principles* or *Alciphron* quotes presented as fact) or misnumbering the queries.
