      *   **Context:** A philosophy of mind/language reading group in a pub (implies informal but serious discussion, potentially influenced by alcohol, but the arguments need to be treated seriously).
      *   **Topic:** Moore's Paradox ("It is raining, but I don't believe it is raining").
