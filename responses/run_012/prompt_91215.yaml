  9.  **Final Polish:** Check the tone. Ensure it sounds like an adjudication of a debate, not a lecture. (Proceed to generate response).

  *(Self-Correction on "Least Sure"):* The phenomenological claim ("mind jams") is hard to verify empirically. That's a good candidate for least sure. Or perhaps the precise nature of "practical contradiction." Let's go with the phenomenological claim about thinking silently.

  *(Self-Correction on Ratings):* Use a scale like "Mostly Mistaken," "Half-Right," "Mostly Right," "Clearly Right."

  *(Final check on Sam Move 3):* Sam says asserting is the outward face of believing. This is a Gricean/Wittgensteinian view. It's defensible. But calling Moore's distinction a "fudge" is historically contentious. Moore was careful. I'll note that.

