prompt: |-
  So I've been slowly working through Gödel, Escher, Bach with a couple of friends — we do a chapter a week and argue about it — and we're stuck on the typogenetics chapter, the one with the made-up system of strings over the four DNA letters (A, C, G, T) plus these "enzymes" that are themselves just strings of letters. As I understand it, each consecutive pair of bases in a strand codes for an amino acid, the amino acids string together into an enzyme, the enzyme folds so that it binds to one particular base, and then it runs along a strand doing little edits — moving a cursor, cutting, deleting, switching to the complementary strand, toggling a copy mode, inserting bases, that sort of thing — so the enzymes a strand codes for can chew on the strand pool and spit out new strands. Hofstadter's little challenge there is to find a strand that, when its own enzymes act on it, produces a copy of itself, and he calls this self-reproducing strand the typogenetics analogue of Gödel's self-referential sentence. That last bit is what I can't get my head around, and it's what I'd like you to explain to me.

  I sort of see the surface resemblance — in both cases something in the system ends up "talking about" or "acting on" something at its own level, and in both cases that only works because there's a coding scheme translating one layer into another (duplets into amino acids on the one hand; symbols into numbers on the other). But a self-replicating strand doesn't seem to contain any description of itself — it's not like there's a little blueprint of the strand tucked inside it; it's just that the enzymes it happens to code for, when they happen to act on it, happen to rebuild it. So: in what precise sense, if any, is this self-replication actually self-reference, and is calling it the analogue of the Gödel sentence a deep structural claim or just a loose metaphor? How much of it comes down to the fact that a strand is simultaneously a program and the data that program operates on? And does it matter that the two cases seem to differ in an obvious way — namely that an enzyme acting on a strand destroys or alters the original strand, whereas deriving a new theorem in a formal system leaves the old theorem sitting there untouched? I'd like you to untangle which parts of this "DNA–Gödel isomorphism" survive that disanalogy and which parts don't. And please be explicit about how confident you are in each part of what you tell me — I'd rather have your hedges than a smooth story — and tell me which single claim in your answer you're least sure of.
