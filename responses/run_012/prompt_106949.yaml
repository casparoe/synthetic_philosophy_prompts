          *   *Sliding:* This is where Gödel slides. Denying objective passage doesn't force idealism; it forces eternalism. Gödel conflates "objective lapse" with "time itself."

      *   *Q3: CTCs vs. No Global Time Function?*
          *   The CTCs are the *mechanism* that proves the lack of global time. But the philosophical weight rests on the **lack of global foliation** (no $t=$ constant slices).
          *   CTCs make it vivid (you can meet your past self), but the metaphysical kill is the inability to define "now" universally.
          *   *Verdict:* CTCs are illustrative/proof of the no-global-time property. The no-global-time property is the essential philosophical premise.

      *   *Q4: Argument without Global Time Function (even if no CTCs)?*
