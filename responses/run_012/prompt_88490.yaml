  For an independent research paper of roughly 4,000 words, to be written over a single semester, I need a formal proposal. My subject is the transatlantic difference in the meaning of the word "liberal." My starting observation is that an American and a European who each call a policy "liberal" are frequently describing opposite things—the American usage clustering around state provision and social permissiveness, the European around free markets and limited government—and yet each side tends to treat the other as simply mistaken rather than as speaking a different language. My own hypothesis, which I would like the proposal either to develop or to replace with a better one, is that the two usages do not disagree about which policies deserve the label so much as about which dimension of politics is fundamental: one tradition treats the organization of the economy as the axis that fixes everything else, the other treats the relation between the individual and inherited authority as that axis, with the result that the same word names different regions of a shared two-dimensional space. Please write the proposal so that it states one answerable question about whether this transatlantic dispute is a substantive disagreement about politics or a merely verbal one in which each side attaches a different sense to the same sound; explains why the obvious answers leave the question open; sets out what I would actually do, week by week, and why that method rather than the obvious alternatives; says what a result would look like and what would count as the project failing; and keeps the whole thing realistic for a high school student with one semester and no expectation of archival research. Please do not include a bibliography or citations—I will add those myself.
