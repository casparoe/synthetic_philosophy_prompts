answer: |-
  This is an excellent reconstruction. You have correctly identified the core tension of the Frege–Geach problem: the conflict between **semantic compositionality** (meaning stays the same in different contexts) and **psychological expression** (attitudes are only expressed in assertion).

  Your suspicion that the argument is "too airtight" is astute. In philosophy, when an argument rules out phenomena we know exist (like valid reasoning with imperatives), it usually indicates a premise is too coarse-grained, not that the phenomenon is impossible.

  To meet your constraints (keep univocality, keep validity, keep non-cognitivism), you must give up **Step (3)**.

  Here is the diagnosis, the available repairs, their prices, and my recommendation for your seminar.

  ### The Diagnosis: Why Step (3) is the Weak Link

  Step (3) claims: *"In the conditional, nothing is disapproved of... she merely states a connection."*

  This step assumes a naive theory of expression: that to express an attitude, one must be in the psychological state of *asserting* that attitude. Sophisticated expressivists (like Simon Blackburn and Allan Gibbard) deny this. They argue that one *can* express an attitude in a conditional, just not the same *assertoric* attitude as in a simple assertion.

  If you keep Step (3), you are forced to say that the words "lying is wrong" in the antecedent are semantically inert (homonyms), which violates Step (2). If you give up Step (3), you can argue that the attitude is present, but structurally complex.

  ### The Repairs and Their Prices

  You mentioned trying the "higher-order attitude" repair and feeling it abandoned expressivism. I will explain why that feeling is common but arguably mistaken, and offer a second option (Minimalism) for comparison.

  #### Option 1: Complex Attitudes (Quasi-Realism)
  *Associated with: Simon Blackburn, Allan Gibbard*

  **The Repair:** You reject Step (3). When a speaker says, "If lying is wrong, then getting your brother to lie is wrong," they *are* expressing an attitude. It is not the first-order attitude of disapproving of lying. It is a **higher-order attitude**: a state of disapproving of the combination of (disapproving of lying) and (not disapproving of getting your brother to lie).

  **How it meets your constraints:**
  *   **Univocality (2):** The phrase "lying is wrong" contributes the same semantic value (the attitude of disapproval) to both the assertion and the conditional.
  *   **Validity:** The argument is valid because it is inconsistent to hold the complex attitude expressed by the conditional while holding the attitudes expressed by the premises.
  *   **Non-Cognitivism (1):** The semantic values are still attitudes, not beliefs about facts.

  **The Price:**
  1.  **Psychological Plausibility:** Do ordinary speakers actually harbor this complex web of attitudes when they utter a simple conditional? It risks intellectualizing moral psychology.
  2.  **The Negation Problem (Schroeder's Challenge):** This is the modern version of Frege–Geach. It is easy to define the attitude for "If P then Q." It is much harder to define the specific attitude for "Lying is *not* wrong" that distinguishes it from "Lying is wrong" without collapsing into cognitivism. If "not wrong" just means "I don't disapprove," that fails to capture the *commitment* involved in moral denial. Solving this requires a very technical logic of attitudes.

  **Addressing your worry:** You feared this maneuver "works for any vocabulary" and thus stops being expressivism. **This is actually the goal.** Gibbard argues that *all* normative vocabulary (including logical terms like "if" and "not") should be given an expressivist analysis. If the maneuver works for everything, you haven't stopped doing expressivism; you have successfully universalized it.

  #### Option 2: Deflationary Truth (Minimalism)
  *Associated with: Blackburn, Huw Price*

  **The Repair:** You modify Step (1). You maintain that moral judgments are practical/attitudinal, but you deny that this prevents them from being "true." You adopt a **deflationary theory of truth**. To say "It is true that lying is wrong" is just to say "Lying is wrong." It adds no metaphysical weight.

  **How it meets your constraints:**
  *   **Validity:** Moral sentences can now be premises in standard logic because they are truth-apt (in a minimal sense).
  *   **Non-Cognitivism:** You still deny there are *robust* moral facts. The "truth" is just a linguistic device for endorsement.

  **The Price:**
  1.  **The Collapse Risk:** If moral sentences have truth conditions (even minimal ones), what distinguishes this view from Cognitivism? You must walk a tightrope to explain how a sentence can be "true" without corresponding to a fact in the world.
  2.  **Semantic Technicality:** You must import a deflationary theory of truth into your metaethics. This shifts the debate from ethics to philosophy of language.

  #### Option 3: Hybrid Expressivism
  *Associated with: Michael Ridge, Dan Copp*

  **The Repair:** You reject Step (1). Moral sentences express *both* a belief (to handle logic) and an attitude (to handle practicality).

  **The Price:**
  1.  **Violates your constraint:** You stated you want to keep the claim that moral judgment is practical *in a way that belief is not*. Hybrid views typically make the belief component do the logical work, which risks making the attitude component semantically redundant (the "freeloader" problem).
  2.  **Metaphysical Bloat:** You now need beliefs about moral properties *and* attitudes.

  ### Recommendation: The "Cheapest" Repair

  For your seminar, **Option 1 (Complex Attitudes / Quasi-Realism)** is the cheapest and most faithful to the expressivist tradition.

  **Why?**
  1.  It preserves your core intuition that moral judgment is fundamentally practical (attitudinal).
  2.  It respects the logic (Step 2) without requiring you to learn a new theory of truth (Option 2).
  3.  It directly addresses the Frege–Geach objection on its own terms.

  **How to present it in your seminar:**
  Acknowledge that your reconstruction is the "Classical Frege–Geach." Then, present the **Quasi-Realist** response as the necessary evolution of the view.

  1.  **Concede Step (3) is false.** The expressivist does *not* say no attitude is expressed in the conditional. They say a *logically complex* attitude is expressed.
  2.  **Address the "Overgeneralization" worry.** Tell your seminar: "The fact that this problem applies to imperatives ('If you're cold, shut the door') shows that the Frege–Geach problem is actually a problem about **logic and grammar**, not just ethics. The expressivist's job is to show that moral language, unlike imperatives, has the *logical structure* of indicatives, even if its *semantics* are attitudinal."
  3.  **Address the "Higher-Order" worry.** Explicitly state: "If this maneuver works for any vocabulary, that is not a bug; it is a feature. It suggests that logic itself might be understood expressivistically (as Gibbard argues). This doesn't abandon expressivism; it deepens it."

  **The Cost to Admit:**
  Be honest about the **Negation Problem**. Tell your audience: "The price of keeping Step (2) and Non-Cognitivism is that we must develop a logic of attitudes that can distinguish 'not wrong' from 'wrong' without invoking facts. This is the current frontier of expressivist research."

  This shows you understand the objection, the standard reply, and the *remaining* difficulties, which is exactly what a good seminar presentation should do.
