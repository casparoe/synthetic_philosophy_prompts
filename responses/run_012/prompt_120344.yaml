  Your reading of the tension is sound; the Condorcet Jury Theorem and the Paradox of Voting do pull in opposite directions as a function of electorate size, and that collision is a valid target for humor.

  Here is a short monologue tailored for your audience:

  "My team recently built a decentralized consensus engine based on the Condorcet Jury Theorem. The math says that as you scale the electorate, the majority verdict converges on certainty. So we scaled it. 

  Then the nodes stopped voting.

  We realized we'd hit the theoretical collision: the same variable that drives the group's accuracy to one drives the individual's pivotal probability to zero. We successfully engineered a system that is asymptotically infallible, provided every user ignores the fact that participation is asymptotically irrational.

  It's the only production system I know where correctness depends on the users violating their own cost function."
