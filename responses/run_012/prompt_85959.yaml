  My twin is speaking falsely while I am speaking truly, because the reference of 'pain' is fixed by acquaintance with the quality itself, not by the quality's causal power to produce speech. The neural substrate causes both the sensation and the verbal report simultaneously, so the report tracks the sensation even if the sensation doesn't push the report out. When my twin says "I am in pain," he is producing sounds caused by his C-fibers firing, but since there is no sting present for him to be acquainted with, his term 'pain' fails to latch onto the phenomenal property it aims to name. I, however, have the sting present, and my acquaintance with it fixes the reference of my utterance, even if the sting itself didn't trigger the vocal cords.

  You assume that for a report to be evidence of X, X must cause the report, but that conflates causal efficacy with causal origin. The common cause—the brain state—ensures that whenever the qualia exists, the report exists, making the report a reliable indicator of the qualia without the qualia doing any work. The report is evidence of the feeling because they are nomological twins spawned by the same physical parent, not because the feeling shoves the tongue. It is counterintuitive, yes, but it preserves the reality of the feeling without violating the causal closure of the physical, which is the whole point of adopting this view in the first place.
