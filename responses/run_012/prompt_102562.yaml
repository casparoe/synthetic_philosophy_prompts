  2.  **Deconstruct Superrationality (Hofstadter):**
      *   Core premise: If two agents are perfectly rational and have the same information/problem, they will arrive at the same conclusion.
      *   Therefore, my choice *determines* their choice (not causally, but logically).
      *   In a Prisoner's Dilemma (PD), the off-diagonals (C/D, D/C) are impossible because we must choose the same.
      *   Compare (C,C) vs (D,D). (C,C) is better. Therefore, cooperate.
      *   The "Magic": It assumes the other person is running the *exact same algorithm*.
      *   The "Get-out": If you doubt they are superrational, you might defect. But a true superrationalist assumes rationality is universal or that acting *as if* it is makes it so (or simply dismisses the doubt as irrational).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like an advice column but hint at the theory. "Dear Diagonal"? "The Rational Friend"? "Superrational Sally"? Let's go with "The Common Reasoner."
      *   **Intro:** Brief setup of the columnist's philosophy.
      *   **Letter 1 (Wallet):** Classic one-shot PD.
          *   *Reader:* Found wallet, cash inside, no ID. Keep or return?
          *   *Reply:* You and the loser are identical reasoners. If you keep, they would have kept. If you return, they would have returned. Compare worlds: Everyone keeps wallets (chaos) vs. Everyone returns wallets (order). Choose order.
      *   **Letter 2 (Group Dinner):** N-player PD.
          *   *Reader:* Friends dinner, split bill evenly. I ordered cheap, others expensive. Sneak out extra cash?
