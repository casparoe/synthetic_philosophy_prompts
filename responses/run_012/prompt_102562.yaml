answer: |-
  **THE COMMON REASONER**
  *By Dr. A. Symmetra*

  Welcome to this month's column. Remember: you are never alone in a decision. You are always paired with your logical mirror.

  **Dear Common Reasoner,**
  *I found a leather wallet on the sidewalk. There's $300 cash, no ID. No cameras around. My rational self says keep it. My conscience says return it to the bank. What does a superrationalist do?*
  **— Wallet Worrier**

  **Dear Wallet,**
  You are framing this as a conflict between greed and morality. It is not. It is a Prisoner's Dilemma between you and the loser who dropped it. You wish to maximize utility. So do they. You possess the same information and cognitive tools. Therefore, you are running the same algorithm.

  If you conclude "keep," logic dictates they would have kept it had they found yours. If you conclude "return," they would return yours. The off-diagonal outcomes (you keep/they return) are logically inaccessible because you are identical reasoners. You must compare the diagonal outcomes: (Keep, Keep) versus (Return, Return). In (Keep, Keep), wallets vanish forever, creating a high-friction society. In (Return, Return), property is secure. You prefer the latter. You walk to the bank. Not out of kindness, but because you cannot logically output "defect" without forcing the universe into a suboptimal equilibrium.

  **Dear Common Reasoner,**
  *Group dinner last night. We agreed to split the bill evenly. I ordered salad; everyone else got steak and cocktails. I calculated I could slip $20 less into the pile and no one would notice. Should I?*
  **— Cheap Date**

  **Dear Date,**
  This is an N-player Prisoner's Dilemma. You assume you are the only variable. You are not. If your reasoning is sound, it is universal among your party. If you deduce that underpaying is optimal, then every other rational agent at that table deduces the same.

  If you all defect, the bill remains unpaid, the manager is called, and social trust evaporates. If you all cooperate, the bill is settled, and you enjoy future dinners. Since your decision logically determines the group's decision (via the universality of reason), you must pay your share of the *average*, not your *actual*. To do otherwise is to assert that your friends are rational enough to dine with you, but not rational enough to solve for equilibrium. That is arrogance, not logic. Pay the steak.

  **Dear Common Reasoner,**
  *This all rests on the assumption that the other person is thinking exactly like me. But what if they aren't? What if I cooperate and they defect?*
  **— The Skeptic**

  **Dear Skeptic,**
  Your question reveals a fundamental misunderstanding. You are asking if you should defect because you fear the other agent is irrational. But if you are capable of superrational analysis, you must recognize that rationality is not a personal trait; it is a logical constant.

  To doubt the other agent's rationality is to doubt the validity of your own reasoning process. If you assume they are irrational, you have already broken the symmetry required for superrationality, reducing yourself to a standard rational actor trapped in a suboptimal Nash equilibrium. Essentially, by asking this question, you have admitted you are not superrational. If you were, you would know that assuming asymmetry is the only true irrationality. So, stop worrying. If they defect, it proves you were wrong to cooperate, but since you are both you, you will both cooperate.

  **Stay Diagonal,**
  **Dr. Symmetra**
