  So my friend and I have been going back and forth for weeks now about whether the chatbot we both use actually knows what any of its words mean, or whether it's just shuffling tokens around, and we keep talking past each other, so I want the strongest version of the disagreement written out as a dialogue instead of us just repeating our own lines. Make it two people, both sharp, neither one a punching bag. One takes the classic line: symbols in a formal system can't get their meaning from other symbols alone, you need some kind of causal or sensorimotor hookup to the world to break the circle, otherwise it's all just ungrounded syntax. The other thinks that picture is dated and that "grounding" can come from use and from the relations among symbols themselves, or that it's simply inherited from the humans who made the training data. Have them actually respond to each other's points. I especially want them to fight over the inherited-meaning case (does meaning borrowed from us count as the machine's grounding or not, and why) and over whether grounding is all-or-nothing or a matter of degree, like could a system be half-grounded. The classic-liner should have a real reply to that, not a slogan. Maybe 700 words or so, no citations, no reading list, just the arguement itself.
