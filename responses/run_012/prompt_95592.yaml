answer: |-
  Here is the procedure. It is designed to take 45 minutes, requires no insider access, and forces you to separate **Signaling** (costly proof of quality) from **Burning** (costly proof of access to capital).

  Your friend is applying evolutionary biology to finance. The problem is that in biology, the peacock pays for the tail with its own energy. In VC, the founder often pays for the tail with *your* money. That is the breakage point.

  ### The Signal Integrity Protocol (SIP)
  **Timebox:** 45 Minutes
  **Input:** Public data, website, GitHub, LinkedIn, Crunchbase, press releases.
  **Output:** Pass, Fail, or Escalate.

  #### Step 1: Identify the Receiver (5 Minutes)
  A signal requires a receiver who updates their belief based on the cost. If no one is watching, it's just waste.
  *   **Question:** Who specifically changes their behavior because this expense exists? (Customers, Hires, Partners, or Future Investors?)
  *   **Good Answer:** "Enterprise CTOs require SOC2 before procurement. This audit unlocks sales." OR "Developers won't trust a closed black box. Open source builds adoption."
  *   **Bad Answer:** "It shows they are serious." (Serious to whom? Why does it matter?)
  *   **Stop Condition:** If you cannot name the specific audience whose wallet or labor is unlocked by this expense, mark **FAIL**. It is consumption, not signaling.

  #### Step 2: The Differential Cost Test (15 Minutes)
  This is the core of Zahavi's principle. The cost must be *lower* for the high-quality type than the low-quality type.
  *   **Question:** If a fraudster had the same amount of cash, could they buy this same signal?
  *   **Good Answer:** "A fraudster could buy the ad campaign, but they couldn't open-source the code because their tech doesn't actually work/would be stolen immediately." OR "A fraudster could get the audit, but they couldn't sustain the operational discipline required to keep it."
  *   **Bad Answer:** "Anyone can write a check." (If the signal is purely financial, it signals access to capital, not company quality.)
  *   **Stop Condition:** If a "bad" company can mimic this expense without collapsing or being exposed within 12 months, mark **FAIL**. It is not a handicap; it is a costume.

  #### Step 3: The Principal-Agent Check (10 Minutes)
  This is where your hunch lives. Who pays for the tail, and who gets fooled by it?
  *   **Question:** Is the entity paying for the signal the same entity that benefits from the trust it generates?
  *   **Good Answer:** "The company pays for the audit; the company gets the enterprise contracts." (Aligned).
  *   **Bad Answer:** "The investors pay for the brand campaign; the founders get the credibility to raise the next round." (Misaligned).
  *   **Stop Condition:** If the expense is funded by investors but primarily signals to *other investors* to raise the next round at a higher valuation, mark **ESCALATE**. This is a signaling cascade, not a quality signal. It requires a human to decide if you want to ride the wave or avoid the crash.

  #### Step 4: Index vs. Signal (10 Minutes)
  An *Index* is a trait physically tied to quality (e.g., the product works). A *Signal* is a costly display (e.g., a Super Bowl ad).
  *   **Question:** Is the expense *part* of the value creation, or just *advertising* it?
  *   **Good Answer:** "Open-sourcing the core library forces them to maintain high code standards and community engagement, which *is* the product moat." (Index/Signal hybrid).
  *   **Bad Answer:** "Hiring a famous scientist puts their name on the slide deck." (Pure Signal).
  *   **Stop Condition:** If the expense creates no operational drag that forces better performance, mark **FAIL**. It's vanity.

  #### Step 5: The Runway Math (5 Minutes)
  A signal is only valid if the sender survives it.
  *   **Question:** Does this expense bring them closer to cash flow, or does it extend the time to cash flow?
  *   **Good Answer:** "This burns 6 months of runway but unlocks a sales channel that covers that burn in 3 months."
  *   **Bad Answer:** "This burns 6 months of runway to test a hypothesis."
  *   **Stop Condition:** If the burn exceeds 25% of remaining runway without a direct line to revenue, mark **FAIL**.

  ---

  ### Where The Lens Misfires (The "Breakage" List)
  *Keep this on your desk. If any of these apply, the Handicap Principle is invalid for this deal.*

  1.  **The VC Ponzi:** The signal is designed to fool the *next* investor, not the customer. The cost is paid by Investor A, the benefit is captured by Founder/Investor A, the risk is held by Investor B.
  2.  **No Receiver:** The market doesn't care. (e.g., A beautiful office in a remote-first world).
  3.  **Consumption Disguised as Signal:** The founder wants a private jet but calls it "executive efficiency."
  4.  **The Index Trap:** You are mistaking a physical requirement for a signal. (e.g., You need servers to run software. Buying servers isn't signaling; it's just doing the job).
  5.  **Multiple Audiences:** The signal works for customers but scares investors (or vice versa).

  ---

  ### Simulation: Running the SIP on Your Three Cases

  #### Case 1: Open-Sourcing Core Library
  *   **Receiver:** Developer community / Enterprise CTOs (who trust audited code). **(Pass)**
  *   **Differential Cost:** High for bad type. A bad company cannot open-source core IP because they have no other moat; they would be copied instantly. A good company knows their speed/execution is the moat, not the code secrecy. **(Pass)**
  *   **Principal-Agent:** Company pays (loss of IP exclusivity); Company benefits (adoption/trust). Aligned. **(Pass)**
  *   **Index/Signal:** Hybrid. Forces engineering discipline. **(Pass)**
  *   **Runway:** Reduces CAC (Customer Acquisition Cost) over time. **(Pass)**
  *   **Verdict:** **PASS.**
      *   *Note:* This fits the theory perfectly. It is a true handicap. They are giving away the "feathers" to prove they can grow new ones faster than anyone else.

  #### Case 2: Brand Campaign Before Product
  *   **Receiver:** Potential customers (who can't buy yet) and Investors. **(Mixed)**
  *   **Differential Cost:** Low for bad type. A fraudster with good pitch decks can raise the money to pay for the brand campaign. It signals *fundraising ability*, not *product ability*. **(Fail)**
  *   **Principal-Agent:** Investors pay; Founders get credibility. High risk of misalignment. **(Fail)**
  *   **Index/Signal:** Pure Signal. No operational drag that improves the product. **(Fail)**
  *   **Runway:** Burns cash with no revenue path. **(Fail)**
  *   **Verdict:** **FAIL.**
      *   *Note:* This is the "Peacock in a Vacuum." It looks deep, but it's just burning investor cash to signal to other investors.

  #### Case 3: Voluntary Expensive Audit (e.g., SOC2 Type II or Security)
  *   **Receiver:** Enterprise Procurement. **(Pass)**
  *   **Differential Cost:** High for bad type. A sloppy company cannot maintain the documentation and discipline required without slowing down to a halt. A good company has the discipline already. **(Pass)**
  *   **Principal-Agent:** Company pays; Company gets enterprise contracts. Aligned. **(Pass)**
  *   **Index/Signal:** Index. The audit *is* the proof of operational maturity. **(Pass)**
  *   **Runway:** Expensive upfront, but required for the check size you want. **(Pass)**
  *   **Verdict:** **PASS.**
      *   *Note:* This is the boring version of the peacock. It's not flashy, but the cost is genuinely higher for a disorganized team than an organized one.

  ---

  ### "Judgment Wearing a Lab Coat"
  *You asked me to be straight about where this procedure is just your gut feeling formalized.*

  1.  **Step 2 (Differential Cost):** Deciding whether a "bad type" can mimic the signal is a guess. You are estimating the capability of a ghost. You don't know if a fraudster could pull off the open-source move. You are pattern-matching on *your* experience of what fraudsters do.
  2.  **Step 3 (Principal-Agent):** Determining "intent" is impossible from the outside. A founder might genuinely believe the brand campaign is for customers, even if it's actually for investors. You are judging their honesty, not just the math.
  3.  **The "Escalate" Gate:** In Step 3, I told you to escalate if investors pay for investor signaling. That is a policy decision, not a fact. Some funds *specialize* in riding signaling cascades (momentum funds). Deciding that is "bad" is a philosophical stance on your fund's strategy, not a discovery of fact.
  4.  **The "Pass" on Open Source:** I passed this because it fits the theory. But if the code is bad, it's still a fail. The procedure assumes the underlying asset has *some* value. It cannot detect zero.

  ### Summary for Your Friend
  Tell your friend: **The Handicap Principle works in VC only when the Founder's skin is in the game.**
  *   If the cost is paid in **equity dilution** (Founder's money), it's a signal.
  *   If the cost is paid in **investor capital** (Your money), it's often just burn.
  *   The Open Source move is a signal because they lose IP (Founder cost).
  *   The Brand Campaign is burn because they spend your cash to look good to your peers (Investor cost).

  Your job isn't to find signals. It's to find signals where the **Founder pays the tax.** If the investor pays the tax, you aren't doing diligence; you're funding a costume.
