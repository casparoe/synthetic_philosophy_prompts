answer: |-
  There is no single, canonical term in the economics literature for this specific rhetorical maneuver, though the tension you describe is the central fault line in long-term cost-benefit analysis. Economists distinguish between **prescriptive discounting** (what we *ought* to value ethically) and **descriptive discounting** (what the market *does* value), and the debate between Nicholas Stern (low rate, prescriptive) and William Nordhaus (higher rate, descriptive) is the famous instantiation of this conflict.

  However, the specific tactic you have identified—keeping the *number* fixed while swapping the *pedigree* of that number to deflect criticism—does not have a standard label. It is a form of motivated reasoning that exploits the ambiguity between these two frameworks.

  Here is the carving you requested.

  ### The Term: **Justification Drift**

  I propose **Justification Drift** (or more formally, **Discount Rate Justification Drift**) to name this phenomenon.

  ### The Definition

  **Justification Drift** occurs when a decision-maker maintains a fixed discount parameter ($r$) across a policy analysis, but shifts the theoretical justification for that parameter ($J$) in response to specific objections, without adjusting $r$ to reflect the implications of the new justification.

  It is characterized by three conditions:
  1.  **Parameter Invariance:** The numerical rate (e.g., 3% or 5%) remains constant throughout the debate or analysis.
  2.  **Pedigree Substitution:** When justification $J_1$ (e.g., "market opportunity cost") is challenged as ethically insufficient, the defender substitutes justification $J_2$ (e.g., "risk of catastrophe"), but does not recalculate $r$ based on $J_2$'s specific metrics.
  3.  **Ethical Opacity:** The defender does not acknowledge that $J_1$ and $J_2$ carry different normative weights or imply different values for $r$, allowing the rate to absorb the defensibility of $J_2$ while performing the work of $J_1$.

  ### The Carving: Distinguishing Instances

  To use this term precisely, you must distinguish **Justification Drift** from legitimate economic practices. Here is the boundary:

  **1. vs. Honest Uncertainty Discounting**
  *   **Honest Practice:** If the justification is "risk that the project won't matter," the rate is derived from a specific probability model (e.g., hazard rate). If new data suggests the hazard is lower, the rate is lowered.
  *   **Justification Drift:** The proponent cites "risk" to defend the rate, but when presented with evidence that the specific risk is low (e.g., political stability is high), they do not lower the rate. Instead, they silently pivot to "opportunity cost" to keep the rate fixed.
  *   **The Boundary:** Does the number change when the evidence for the specific justification changes? If no, it is Drift.

  **2. vs. Opportunity-Cost Discounting**
  *   **Honest Practice:** This applies strictly to capital allocation. "We should invest in Project A over Project B because A yields 5% and B yields 3%." It is a comparison of investment vehicles.
  *   **Justification Drift:** The 5% market rate is applied to *non-tradable goods* (e.g., human lives, species extinction, climate stability) that future people cannot "invest" their way out of. The proponent defends this by citing "market efficiency" when challenged on ethics, but cites "ethical prudence" when challenged on market applicability.
  *   **The Boundary:** Is the rate applied to goods that lie outside the market mechanism? If yes, and the market rate is still used without adjustment, it is Drift.

  **3. vs. Pure Time Preference**
  *   **Honest Practice:** The analyst states plainly: "We discount the future because we ethically prioritize the present." (Frank Ramsey called this "ethically indefensible," but some models accept it as a democratic preference).
  *   **Justification Drift:** The analyst achieves the same mathematical result as pure time preference (valuing future lives less) but refuses to state it as an ethical claim, hiding it behind "descriptive" market rates or "scientific" risk probabilities.
  *   **The Boundary:** Is the normative claim stated explicitly? If the mathematical effect is normative (later matters less) but the stated reason is descriptive (markets say so), it is Drift.

  ### Why This Matters for Your Reporting

  You noted that "no one ever totals up how much of the discounting is risk, how much is foregone return, and how much is the bare belief." **Justification Drift** is the mechanism that prevents that total.

  By naming it, you can force the decomposition. When an expert cites a 3% discount rate for a 100-year climate problem, you can ask:
  > "Is this 3% a **risk premium**, an **opportunity cost**, or a **pure time preference**? If it is risk, what is the annual probability of catastrophe implied by 3%? If it is opportunity cost, what investment vehicle is available to future generations that allows them to hedge against climate damage? If you cannot specify the mix, are you engaging in **Justification Drift**?"

  This framing moves the debate from "What is the correct number?" (which invites endless technical calibration) to "What is the *source* of this number?" (which exposes the rhetorical shielding).

  ### Summary for Usage
  *   **Use "Justification Drift"** when the *number* stays fixed while the *reason* changes to deflect criticism.
  *   **Use "Normative-Descriptive Conflation"** if you want to describe the underlying theoretical error (mixing "is" and "ought").
  *   **Use "The Discount Rate Motte-and-Bailey"** if you want to describe the rhetorical structure (retreating to the defensible "risk" argument when attacked, but occupying the controversial "time preference" position when calculating).

  **Justification Drift** is the most precise term for the *parameter behavior* you are tracking. It captures the invariance of the value against the variance of the defense.
