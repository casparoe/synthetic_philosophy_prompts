answer: |-
  **Case Name:** *Mercy v. Oakhaven Housing Authority*
  **Jurisdiction:** Commonwealth of Avalon
  **Statute:** The Residential Continuity Act of 1923

  **Facts**
  In 1923, the Avalon legislature passed the Residential Continuity Act to address a housing crisis following the Great War. The text of Section 4 is brief: "Upon the death of a leaseholder, any person residing in the unit shall assume the lease." At the time, legislative debates and committee reports made clear the law was intended to prevent widows and minor children from being cast into poverty by landlords; records show explicit discussions about preserving "traditional family structures" and avoiding support for "transients or moral hazards." Today, Alex, a leaseholder, has died. Jordan, Alex's unmarried partner of fifteen years who lived in the unit and cared for Alex during a long illness, faces eviction by the landlord. Jordan is financially stable but wishes to remain in the home. The only barrier is Section 4.

  ***

  ### 1. The Reasoning

  **The Textualist Judge (Justice Reed)**
  *Step 1:* Look at the statute. The words are "any person residing in the unit."
  *Step 2:* Determine the ordinary meaning. "Person" means a human being. "Residing" means living there with some degree of permanence. There are no modifiers like "family member" or "spouse."
  *Step 3:* Apply to facts. Jordan is a human being. Jordan lived there permanently.
  *Step 4:* Check for constraints. The statute does not say "any person *related by blood*." It does not say "any *dependent* person." To add those words would be to rewrite the law, not interpret it.
  *Step 5:* Verdict. The text covers Jordan. Jordan assumes the lease. **Win.**

  **The Purposivist Judge (Justice Hale)**
  *Step 1:* Look at the statute, but ask *why* it exists. The text is broad, but laws are tools to solve specific problems.
  *Step 2:* Examine the legislative record. The 1923 debates show the legislature was worried about destitute widows and orphaned children. They explicitly discussed excluding "boarders" and "unmarried companions" to protect public morality.
  *Step 3:* Determine the purpose. The goal was a social safety net for traditional dependents, not a property right for any occupant.
  *Step 4:* Apply to facts. Jordan is not a widow. Jordan is not a child. Jordan is an independent adult partner, exactly the "moral hazard" the legislature sought to exclude. Applying the law here frustrates the original aim.
  *Step 5:* Verdict. The purpose excludes Jordan. Jordan is evicted. **Lose.**

  ***

  ### 2. The Feature Doing the Work

  The single feature driving the split is **Semantic Overbreadth.** The legislature used words ("any person") that were broader than their specific intention ("widows and children").

  *Honesty Check:* Is there a second feature? Yes, **Temporal Drift in Social Norms.** If 2024 social norms matched 1923 norms (where unmarried partners were universally rejected), the Textualist might feel more pressure to find an ambiguity, but strictly speaking, the split is caused by the words being wider than the intent. The social drift just makes the Textualist result look "better" to us today.

  ***

  ### 3. Removing the Feature

  If we remove **Semantic Overbreadth** by changing the statute text to match the intent: *"Upon the death of a leaseholder, any widow or minor child residing in the unit shall assume the lease."*

  *   **Textualist:** The text says "widow or minor child." Jordan is neither. Jordan loses.
  *   **Purposivist:** The purpose was to protect widows and children. Jordan is neither. Jordan loses.
  *   **Result:** They agree. The divergence disappears when the text is narrowed to match the purpose.

  ***

  ### 4. The Purposivist Wriggle

  **The Move:** Justice Hale (Purposivist) tries to abstract the purpose to a higher level. Instead of "protect widows," Hale argues the purpose is "protecting stable households from disruption." Since Jordan and Alex were a stable household, Jordan wins.

  **Is it Legit or Cope?** It is **Cope.** The legislative record explicitly rejects this higher level. The 1923 committee report specifically denied protection to "boarders and companions" despite them having stable households. Ignoring specific evidence of intent to adopt a vague, modern-friendly purpose is not purposivism; it's updating the law under the guise of interpretation.

  **The Textualist Counter:** Justice Reed responds: "You are ignoring the record you just cited. If the purpose was 'stable households,' they would not have debated excluding companions. You are not finding the purpose; you are inventing a new one because you dislike the old one."

  ***

  ### 5. Original Meaning vs. Current Meaning

  **Does the verdict flip?** No.

  *   **Original Meaning (1923):** The word "Person" meant "human being." The word "Residing" meant "living in a place." An unmarried partner was still a "person" and still "residing." The dictionary definition has not changed.
  *   **Current Meaning (2024):** "Person" means "human being." "Residing" means "living in a place."
  *   **Analysis:** Because the statute uses fundamental nouns and verbs that have not shifted definition over time (unlike words like "vehicle," "commerce," or "cruel"), the Textualist reaches the same verdict regardless of which timeframe they use for meaning. The words were broad then, and they are broad now. The Textualist wins either way.
