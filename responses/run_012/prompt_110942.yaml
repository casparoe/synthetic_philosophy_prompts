prompt: |-
  Ok, I need help prepping for a podcast interview I'm doing. You're a philosopher of biology and historian of science who knows Popper's corpus backwards and forwards, especially the evolution stuff, so please put that hat on. Before you write anything, brainstorm a bit on paper: what are the actual pressure points in Popper's views on Darwinism, where did he get caricatured vs where was he genuinely confused, and what would a smart defender of him say vs a smart critic. Then give me the questions.

  The guest is a historian/philosopher of biology (not naming names, but he's spent years on this) who defends roughly this line: Popper's original verdict that natural selection was a metaphysical research programme was a real position he held for decades, it was about the logic of the selection principle rather than about evolution as a whole, the recantation in his 1978 Darwin College lecture was genuine and substantive rather than a PR retreat after biologists complained, and the key to the whole thing is Popper's propensity interpretation of fitness plus his distinction between the tautological and non-tautological formulations of selection. He also thinks the anti-evolution crowd's use of Popper was a misuse he actively complained about.

  So: write me 9 or 10 interview questions. I want them to go beyond him restating the timeline, and I want follow-ups keyed to the answer he's most likely to give, because he's smooth and he'll deflect if I let him. In particular I need at least one question each on:

  - the tautology charge, why it keeps getting revived by critics even after Popper walked it back, and whether he thinks Popper's own earlier framing is what gave it legs
  - the propensity interpretation of fitness: how it's supposed to make selection claims testable rather than a scoreboard you read off after the fact, and the obvious objection that propensities here can't be measured independently of actual survival outcomes
  - whether the recantation is better read as a genuine change of mind or as a clarification that let him keep the research-programme point while dropping the untestability point
  - the peacock's tail example, where Popper argued the sweeping universal form of selection is actually refuted by traits that don't serve survival, and whether that's a real refutation or whether he was just ignoring that Darwin had sexual selection right there
  - how much responsibility Popper bears for the creationist quote-mining, and whether a philosopher has any duty of care about how a technical verdict like that will travel

  Don't ask him generic stuff about the demarcation problem in general, and don't ask him to recommend reading, I already know the texts. I want questions where the follow-up makes the standard escape hatch harder to use. Also one closing question that gets him to say something he probably hasn't said on the record before, if you can manage it.
