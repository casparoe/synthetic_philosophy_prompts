answer: |-
  You have identified a structural problem that sits at the intersection of logic, legal theory, systems theory, and metaphysics. Your intuition is correct: standard logical terms like "circularity" or "regress" do not quite capture the *ontological* weight of what you are describing. Your friend's reference to Tarski and truth predicates is relevant but insufficient, because you are dealing with *authority* and *existence* (deontic and ontic categories), not merely *truth* (alethic categories).

  There is no single canonical term that covers all four of your examples perfectly, because they span different domains (art, law, software, social norms). However, there are established "carvings" in philosophy and systems theory that map precisely onto the distinction you are struggling to articulate.

  Here is a proposed carving, drawing on established concepts to give you the vocabulary you need.

  ### 1. The Loop: Reciprocal Constitution
  The relationship between A and B (the hands, the manual and the board, the wiki and the policy) is best termed **Reciprocal Constitution** (or **Mutual Determination**).

  *   **How it differs from a Vicious Circle:** A vicious circle prevents determination (A needs B to exist, but B needs A to exist, so neither exists). Reciprocal Constitution is a *stable equilibrium*. Once the loop is instantiated, it sustains itself. In systems theory, this is called **Operational Closure**: the system produces the components that produce the system.
  *   **How it differs from Infinite Regress:** A regress implies a linear chain stretching backward forever ($A \leftarrow B \leftarrow C \dots$). Your structure is closed; it loops back on itself.
  *   **Established Term:** Douglas Hofstadter calls this a **Strange Loop** (specifically in *Gödel, Escher, Bach*, using your exact example of the drawing hands). He describes it as a "tangled hierarchy" where moving up or down the levels leads you back to where you started.

  ### 2. The Outside: The Pragmatic Substrate
  The "sheet of paper," the "social acceptance," the "runtime environment." This is the item that allows the loop to exist without being *generated* by the loop.

  *   **Why it is not a Foundation or Axiom:** An axiom is a statement *inside* the system that is assumed true to make the logic work. The "paper" is not a statement; it is a **Condition of Possibility**. It is not a rule the system follows; it is the reality that allows the system to be.
  *   **Why it is not just "Another Level":** If it were just another level (C governs A and B), you would have a hierarchy, not a loop. The distinctive feature of your "outside" item is that it is *categorically different*. It is the *medium* in which the *message* is written.
  *   **Proposed Term:** I suggest calling this **The Pragmatic Substrate** (or **The Enabling Context**). In legal philosophy, H.L.A. Hart calls this the **Rule of Recognition** (which is ultimately a social fact, not a legal rule). In phenomenology (Kant/Strawson), it is a **Transcendental Condition**.

  ### 3. The Distinction: Validity vs. Efficacy
  To answer your question about whether the "outside" is a genuine structural necessity: **Yes, it is.**

  The confusion arises because we often conflate *Validity* (does this follow the rules?) with *Efficacy* (does this actually work/exist?).
  *   **Inside the Loop (Validity):** The Manual is valid because the Board voted on it. The Board is valid because the Manual says so. This is the Reciprocal Constitution.
  *   **Outside the Loop (Efficacy):** The Manual *matters* because people treat it as binding. The Drawing *exists* because there is paper and ink. The Code *runs* because there is electricity and a processor.

  This distinction is most rigorously carved in **Legal Positivism**.
  *   **The Case:** Your company manual example is the classic problem of the "Basic Norm" (*Grundnorm*).
  *   **The Carving:** Hans Kelsen argued there must be a hypothetical "Basic Norm" at the top. H.L. Hart corrected him, arguing that the "outside" item is not a norm at all, but a **Social Fact**. The rule of recognition exists only because officials *accept* it. That acceptance is not itself a rule in the manual; it is a behavior in the world.
  *   **The Boundary:** If the Board tries to vote to change the fact that they are accepted as authoritative, they cannot do it *by voting*. They can only do it by *ceasing to be accepted*. The loop cannot swallow the substrate; it can only break it.

  ### 4. When the Loop Tries to Swallow the Outside
  You asked: *"What happens to the picture when the two mutually determining items can reach the item that was supposed to stand outside them?"* (e.g., the wiki community changing the norms of acceptance).

  This is the domain of **The Paradox of Self-Amendment** (explored extensively by legal philosopher Peter Suber).
  *   **The Phenomenon:** When a system attempts to rewrite its own Pragmatic Substrate, it does not result in a smooth edit. It results in a **Revolution** or a **Category Shift**.
  *   **The Mechanism:** If the wiki community decides "we no longer care about consensus," the wiki doesn't just update a page; the *nature of the wiki* changes. It ceases to be the same system.
  *   **The Limit:** A program can rewrite its source code, but it cannot rewrite the **Interpreter** that is currently executing it (without stopping execution and restarting). The executing code is the Pragmatic Substrate for the written code. To change the interpreter, the program must cease to be *that* program and become a different one.

  ### 5. Proposed Terminology for Your Use
  Since you wish to coin or adopt terms for this specific structural situation, I propose the following pairing, which distinguishes the *logical relation* from the *ontological ground*:

  **1. The Structure: Reciprocal Instantiation**
  *   *Definition:* A relationship where two elements define the conditions of each other's existence or authority, forming a closed loop of validity.
  *   *Contrast:* Distinct from "Circular Reasoning" (which is a fallacy of proof) because this is a structure of *existence*, not proof. It is a "Virtuous Circle" or "Homeostatic Loop."

  **2. The Outside: The Constitutive Medium**
  *   *Definition:* The non-propositional reality (physical, social, or computational) that sustains the Reciprocal Instantiation without being determined by it.
  *   *Contrast:* Distinct from an "Axiom" (which is inside the logic) and a "First Cause" (which is temporal). The Constitutive Medium is *simultaneous* and *categorically distinct*.
  *   *Test:* If you remove the Medium, the Loop does not become invalid; it becomes *non-existent*. If you remove an Axiom, the Loop becomes unprovable.

  ### 6. Addressing the "Unease"
  You mentioned the self-rewriting code makes you uneasy. This is because it threatens to collapse the distinction between the **Map** (the code/rules) and the **Territory** (the execution/reality).

  *   **In the Drawing:** The hands are the Map; the Paper is the Territory.
  *   **In the Company:** The Manual is the Map; the Social Acceptance is the Territory.
  *   **In the Code:** The Source is the Map; the Runtime is the Territory.

  The unease arises when the Map claims to draw the Paper. This is a **Performative Contradiction**. The act of drawing presupposes a surface. If the drawing claims to create the surface, it is lying about its own conditions of existence.

  ### Summary for your Description
  When you describe this situation again, you might say:

  > "This is a case of **Reciprocal Instantiation** resting on a **Constitutive Medium**.
  >
  > The two elements (A and B) mutually validate each other, forming a closed loop of authority or definition. However, this loop is not self-sustaining in a vacuum; it is instantiated within a Medium (physical, social, or computational) that enables the loop but is not itself part of the loop's logic.
  >
  > The distinction is crucial: The loop determines *validity* (is this rule correct?), while the Medium determines *efficacy* (does this rule exist?). The system can amend its own rules (the loop), but it cannot amend the Medium without ceasing to be that system. When it attempts to do so, it does not create a higher level of logic; it creates a revolution in the medium itself."

  This carving separates the *logical closure* (which you can draw) from the *ontological openness* (which you cannot draw, but must stand on).
