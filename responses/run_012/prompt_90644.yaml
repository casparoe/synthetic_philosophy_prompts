answer: |-
  You have put your finger on a genuinely difficult knot in anthropology, economics, and game theory. The short answer is that there is no single, universally accepted term that captures the specific triad you describe: **objective welfare decline**, **competitive inevitability**, and **irreversibility**.

  However, there is a cluster of concepts that circle it, and one in particular that comes very close. To give you the "carving" you asked for, we need to separate the mechanism from the outcome, and then I will offer a coined term that tightens the definition.

  ### The Existing Landscape

  You are correct to dismiss 'lock-in' and 'path dependence'. Those are neutral descriptors; they explain why we use QWERTY keyboards, not why we are shorter and sicker. They describe inertia, not necessarily degradation.

  **1. The Prisoner's Dilemma (and its limits)**
  Your intuition is sound: this is not a standard Prisoner's Dilemma. In a classic dilemma, the payoffs are fixed. If you and I both stay silent, we get a year; if I snitch, I go free. In your examples (farming, tutoring, advertising), the act of 'defecting' (adopting the new behaviour) changes the landscape for everyone else.
  When the first farmer plants a field, they don't just get an advantage; they reduce the carrying capacity of the land for foragers. When the first parent hires a tutor, they shift the curve of what counts as 'adequate' education. This is a **non-stationary game**. The rules rewrite themselves as you play. Furthermore, standard game theory assumes fixed players. In the farming case, the 'players' are generations. The ones who suffer the health costs are not the ones who made the initial choice.

  **2. The Tragedy of the Commons**
  This is closer, but usually implies the depletion of a shared resource (overgrazing the pasture). In your scenario, the resource isn't necessarily depleted; rather, the *mode of extraction* becomes more demanding. The tutoring market doesn't run out of education; it just becomes more expensive to access the same relative position.

  **3. Involution**
  This is the strongest existing candidate. Coined by anthropologist Clifford Geertz (and later applied to Chinese agriculture by Philip Huang), **involution** describes a society or system that becomes increasingly complex and labour-intensive without actually developing or improving productivity per capita.
  *   **Fits:** It captures the "more work for no gain" aspect of farming and the ratcheting intensity of office culture.
  *   **Misses:** It doesn't inherently imply *irreversibility*. You can involute and then collapse. It also doesn't always capture the "competitive coercion" element; sometimes involution is just cultural stagnation.

  **4. The Progress Trap**
  Coined by Ronald Wright, this describes how societal innovations (hunting techniques, agriculture, industry) allow a population to expand until they overshoot their environment's capacity, leading to collapse or a forced reduction in living standards.
  *   **Fits:** The farming narrative perfectly.
  *   **Misses:** It implies an eventual crash. Your examples (tutoring, advertising) seem stable, not necessarily heading for a collapse, just a permanent state of higher stress for no net gain.

  **5. Moloch**
  In contemporary rationalist and game-theory circles (popularised by Scott Alexander), **Moloch** is the personification of coordination failure. It is the "god" of things humans don't want but get anyway because competition forces them to optimise for the wrong metric (e.g., GDP over welfare, market share over profit).
  *   **Fits:** The "nobody chose it" vibe perfectly.
  *   **Misses:** It is a metaphor, not a rigorous sociological term. It's a name for the *agent* of the trap, not the trap itself.

  ### The Carving: What makes this distinct?

  To distinguish this from a simple "bad deal" or a "mistake," three conditions must be met:

  1.  **Multi-Level Selection Conflict:** The trait or system is selected for because it benefits the *group's* expansion or survival (more calories per acre, higher market penetration), even though it reduces the *individual's* welfare (health, leisure, net profit). The unit that wins is the population or the firm, not the human inside it.
  2.  **Landscape Alteration:** The transition destroys the viability of the previous state. You cannot go back to foraging because the land is cleared and the population density is too high to support it. You cannot stop tutoring because the grading curve has shifted. The 'exit' option is physically or socially removed.
  3.  **Normative Decline:** The participants, if asked, would acknowledge they are worse off by their own prior standards (health, happiness, disposable income), yet they continue the behaviour. It is not a case of "false consciousness" where they think they are happier; they know they are tired, but they must run.

  ### The Coined Term: The Involutionary Ratchet

  Since no single existing term captures the *welfare decline*, the *competitive drive*, and the *one-way mechanism*, I propose we call this **The Involutionary Ratchet**.

  It combines the 'turning inward without growth' of **Involution** with the 'one-way mechanism' of the **Ratchet Effect**.

  **Definition:** An Involutionary Ratchet occurs when a competitive dynamic forces a population to adopt a higher-cost strategy for the same (or lower) return, where the cost of reverting to the previous strategy becomes prohibitive due to changes in the environment or population density.

  ### Boundary Cases

  To test this carving, let's look at what fits, what doesn't, and a false positive.

  **1. True Positive: The Neolithic Transition**
  *   **Why:** Foragers were healthier. Farmers outbred them. Once the population density reached a certain point, foraging was no longer physically possible on the land. The hierarchy and surplus were side-effects of the ratchet, not the cause.
  *   **Verdict:** Fits perfectly.

  **2. True Positive: Credential Inflation**
  *   **Why:** A degree used to get you a job. Now everyone has a degree, so you need a Masters. The job hasn't changed, the pay hasn't changed, but the entry cost has doubled. You cannot opt out without being unemployable.
  *   **Verdict:** Fits perfectly.

  **3. False Positive: The Sunk Cost Fallacy**
  *   **Why:** This looks like a trap you can't escape. However, in a sunk cost scenario, the *external* conditions haven't changed. You stay in a bad job because you've invested time. In an Involutionary Ratchet, if you leave the job, the market rate for your labour has structurally changed because everyone else is working nights. Sunk cost is psychological; the Ratchet is structural.
  *   **Verdict:** Does not count.

  **4. False Positive: Technological Obsolescence**
  *   **Why:** We stopped using typewriters for computers. This is a transition, and you can't really go back. But by almost every measure (speed, editability, storage), people are *better* off.
  *   **Verdict:** Does not count. The welfare must decline or stagnate while effort increases.

  ### How the Trap Springs Open

  You asked where the edges are and if there is a version that ends. An Involutionary Ratchet is stable until one of three things happens:

  1.  **External Shock:** The system collapses (famine, war, market crash). The population density drops low enough that the old way becomes viable again, or the competition is reset.
  2.  **Coordination / Regulation:** A third party forbids the arms race. (e.g., A ban on private tutoring, or advertising restrictions, or labour laws preventing emails after 6 PM). This removes the 'defect' option that drives the ratchet.
  3.  **Technological Leap:** A new innovation changes the payoff structure so drastically that the old competition becomes irrelevant. (e.g., If AI makes the current education model obsolete, the tutoring race stops).

  ### Summary

  Your friends are arguing about a real phenomenon that sits at the intersection of evolutionary biology and economics. It is not merely 'lock-in' because it involves a decline in welfare. It is not merely a 'Prisoner's Dilemma' because the game board changes as you play.

  The established concept closest to the *process* is **Involution**. The established concept closest to the *outcome* is a **Progress Trap**. The established concept closest to the *mechanism* is **Multi-Level Selection**.

  But for the specific shape you described—the unwanted, unavoidable, one-way slide into higher effort for lower return—I suggest **The Involutionary Ratchet**. It acknowledges that we are moving forward (Ratchet) but going nowhere good (Involution).

  In the case of farming, it was the demographic weight of the grain that locked the door behind us. In the case of your sister's tutoring, it is the weight of the league table. We are not choosing the trap; we are being outbred or outcompeted by those who step into it.
