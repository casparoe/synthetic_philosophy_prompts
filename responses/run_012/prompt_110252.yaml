prompt: |-
  I'm in a small reading group that's been working through narrative theories of the self — Dennett's essay about the self as a center of gravity is the one we keep circling back to, plus some pop-neuroscience stuff about autobiographical memory. There's a one-liner that keeps getting thrown around in there, usually in slightly different words each time: the self is just a story. Last week it got used in two completely opposite directions inside the same hour and I don't think anyone noticed. One guy is the theraputic type — for him it means the story is editable, so you can rewrite your narrative and become a different person (he's been pushing journaling on all of us, it's alot). The other guy is the deflationary type, and he likes to quote the bit from that essay about the self being a theorist's fiction — for him it means there's no author behind the story, so nothing persists through time, so blame is misplaced and the fear of death is confused. Those can't both be right as stated and I'm pretty sure the two of them are trading on a pun.

  What I want from you is a menu, not a verdict: lay out the distinct precise claims the self is just a story could be making, from the boring to the radical. What is it saying if story is only a loose metaphor for the fact that we narrate our lives to ourselves, versus if it's a genuine metaphysical claim that persons don't exist and there's no one having the experiences, versus the middle thing I keep half-remembering — the self as something like a center of gravity, a real feature of the pattern that isn't a thing located at any point in it and that you couldn't find by staring harder at the parts. For each reading, say whether it's a platitude, a substantive thesis that might actually be true, or something false or incoherent, and then say which reading each of my two friends needs in order to get his conclusion, and whether either of them is smuggling in a reading he hasn't earned. The journaling guy, for instance, seems to need only the loose reading, but then his conclusion about becoming someone else doesn't follow — unless I'm wrong about that.

  Also, and this is the part I actually care about: is any of these the same claim as the Buddhist no-self thing, or is that doing something else entirely that just happens to wear the same clothes? And if the self is only an abstraction in the way a center of gravity is, does anything at all follow about whether it's bad to die? Please don't send me reading lists or citations, I just want the distinctions laid out clean enough that I can take them back to the group on Thursday.
