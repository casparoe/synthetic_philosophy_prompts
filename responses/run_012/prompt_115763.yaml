      *   All materials must be paper-based. Cards, pens, printed rule sheets.

  8.  **Predicting Failure Modes:**
      *   *Principal Over-briefing:* Principal explains the hidden rule too clearly, Distiller writes it down, Trap fails.
          *   *Fix:* Limit Principal's briefing time. Force Principal to demonstrate, not just dictate.
      *   *Distiller Over-complexity:* Distiller writes a novel instead of rules.
