      *   *Distiller:* Sees Team A working. Might miss the nuance if Team A solves it via intuition rather than explicit rule stating.
      *   *Team B:* Only has the sheet. If the sheet says "High urgency = Server Down," they miss the "Cancel" keyword.
      *   *Scoring:* Team B gets points for speed and matching Team A's *visible* decisions. Principal secretly deducts points for missing the Hidden Cases.

