      *   30-45: Phase 2 (Distiller 1 writes Rules).
      *   45-60: Phase 3 (Team B executes Rules).
      *   60-70: Phase 4 (Distiller 2 updates Rules based on Team B).
      *   70-90: Debrief & Reveal.

  5.  **Designing the "Trap" (Alignment vs. Competence):**
