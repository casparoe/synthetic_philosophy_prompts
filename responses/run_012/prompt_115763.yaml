      *   *Team B Cheating:* Team B asks the Principal.
          *   *Fix:* Physical separation.
      *   *Boredom:* 14 people watching 4 work.
          *   *Fix:* Make the "Auditors" active. They count specific behaviors.

  9.  **Refining the "Third Stage" (Re-distillation):**
      *   Prompt asks: "Add a third stage where the sheet gets re-distilled once more from the second team's behavior."
      *   So: Principal -> Team A -> Distiller 1 -> Team B -> Distiller 2 -> (End/Debrief).
      *   We won't have time for Team C. We will analyze the *difference* between Sheet 1 and Sheet 2 in the debrief.

  10. **Finalizing the Design Choices:**
      *   *Task:* "Feature Request Triage." (Engineers relate to this).
      *   *Hidden Intent:* "Retention Risk" vs. "Technical Effort."
      *   *Constraint:* Rule sheet limited to 6 bullet points, max 10 words each. This forces lossy compression.
      *   *Least Confident Choice:* The 6-bullet limit. It might be too harsh or too loose. I'll commit to it because without compression pressure, distillation doesn't happen.

  11. **Drafting the Content:**
      *   *Materials:* Envelopes, Ticket Cards (2 sets), Timer, Whiteboard.
