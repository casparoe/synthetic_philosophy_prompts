  - Gödel's rotating universe, with the closed timelike curves. I think time is not real here — if you can loop back into your own past then the before/after distinction just falls apart.
  - A boring old Newtonian universe with an absolute clock ticking everywhere at once. Time is obviously real.
  - A universe that spins exactly like Gödel's, except all the closed timelike curves are sealed inside a region that's causally cut off from anywhere anyone could ever actually be, so no rocket ever really goes back in time. I think time is real here.
  - A "block" universe: no cosmic present, no time travel, just a static four-dimensional lump, but there is a fact about which events are simultaneous that every observer agrees on. I think time is real there as well.

  The principle I keep reaching for is: time is real in a universe iff the events in it have an objective, observer-independent order — a global before-and-after that isn't just an artefact of how you slice spacetime up.

