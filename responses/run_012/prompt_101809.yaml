  Alright so I'm taking this philosophy of physics module and we just covered Gödel's rotating-universe thing — his solution to Einstein's equations where the whole cosmos spins, and because of the spinning you get closed timelike curves, meaning in principle you could hop in a rocket, fly a loop, and get back before you even left. The lecturer said Gödel used this to argue that time isn't objectively real, that the passage of time is basically an illusion, and that it nudges you toward an idealist view of time. I'm trying to work out what I actually think about when time counts as real in a universe, and whether my gut verdicts on a bunch of cases hang together or if I'm just making it up as I go.

