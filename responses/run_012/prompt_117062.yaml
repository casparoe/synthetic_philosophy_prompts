answer: |-
  This is an excellent catch. You have put your finger on the exact friction point where static game-theoretic definitions meet dynamic evolutionary sociology. The unease you feel isn't a misunderstanding on your part; it's a genuine conceptual tension that has driven a significant chunk of the social ontology literature since the 1980s.

  To untangle this, we need to stop treating "convention" and "norm" as synonyms and rigorously separate the *logic of the situation* from the *dynamics of selection*.

  Here are the three distinctions doing the heavy lifting in this debate. Once we have these on the table, the answer to your specific worry about arbitrariness and welfare ranking should become clear.

  ### 1. Coordination vs. Cooperation (The Payoff Structure)
  Lewis's account in *Convention* (1969) is built almost exclusively on **coordination problems** (like *Battle of the Sexes* or *Driving Side*). In these games, interests are aligned. We both want to match; we just don't want to match *mismatched*.
  *   **Lewisian Convention:** Solves a coordination problem. The primary incentive to conform is the expectation that others will conform.
  *   **Social Norm (in the evolution literature):** Often solves a **cooperation problem** (like *Prisoner's Dilemma* or *Public Goods*). Here, interests conflict. I prefer to defect while you cooperate.

  Why this matters: In a pure coordination game, *any* equilibrium is better than no equilibrium. In a cooperation game, the "norm" (e.g., "punish defectors") is required to *create* an equilibrium that wouldn't exist otherwise. When people talk about norms evolving for "welfare," they are usually talking about norms that sustain cooperation, not just coordination.

  ### 2. Arbitrariness vs. Indifference (The Agent's Reason)
  This is the most common misreading of Lewis.
  *   **Indifference:** Means Option A and Option B yield identical utility.
  *   **Arbitrariness (Lewisian):** Means there is *at least one other* regularity that could have solved the coordination problem.

  Lewis does **not** require the alternatives to be of equal value. He requires them to be *sufficient*.
  *   *Example:* Driving on the Right vs. Driving on the Left.
  *   *Example:* QWERTY vs. Dvorak keyboards.

  QWERTY is arguably less efficient than Dvorak. But QWERTY is still a Lewisian convention. Why? Because the alternative (Dvorak) *would have worked* to solve the coordination problem (typing compatibility), even if it would have yielded slightly higher throughput. The "arbitrariness" refers to the **reason for action**: I drive on the right *because you do*, not because the right side is intrinsically superior. The intrinsic superiority is irrelevant to the *stability* of the convention, even if it is relevant to the *welfare* of the population.

  ### 3. Equilibrium Selection vs. Equilibrium Optimization (The Dynamics)
  This is where the evolution-of-norms literature enters.
  *   **Selection:** Evolutionary dynamics (replicator dynamics, cultural transmission) select *an* equilibrium.
  *   **Optimization:** Welfare economics ranks equilibria.

  Evolutionary processes are path-dependent. They climb the nearest peak on the fitness landscape. They do not scan the whole landscape to find the highest peak. Therefore, a system can settle on a stable convention (a local optimum) that is strictly worse than a counterfactual convention (a global optimum).

  ***

  ### Addressing Your Core Worry

  You asked: *If a convention is arbitrary by definition, then... there's no basis for ranking conventions at all — better would have to mean something the arbitrariness rules out.*

  Here is the resolution: **Arbitrariness is a property of the agent's justification; Efficiency is a property of the observer's welfare function.** They operate at different levels of analysis.

  When Lewis says a convention is arbitrary, he is making a claim about **rationalizability**. He is saying you cannot derive the specific content of the convention (Right vs. Left) solely from the payoff matrix and common knowledge of rationality. You need history or salience (a Schelling point).

  However, once the convention is established, an external observer (or a social planner) can absolutely rank them.
  1.  **Convention A (Right Side):** Payoff = 10 for everyone.
  2.  **Convention B (Left Side):** Payoff = 10 for everyone.
  3.  **Convention C (QWERTY):** Payoff = 5 for everyone.
  4.  **Convention D (Dvorak):** Payoff = 8 for everyone.

  A, B, C, and D are *all* Lewisian conventions (assuming they are stable regularities supported by conditional preferences).
  *   A and B are arbitrary relative to each other.
  *   C and D are arbitrary relative to each other.
  *   **But D is strictly better than C.**

  The evolution-of-norms literature is not contradicting Lewis; it is investigating **why we get stuck at C instead of D.**

  When authors say "this norm is worse for social welfare," they are acknowledging that while the *selection* of the norm was arbitrary (in the sense that it wasn't uniquely determined by rationality), the *consequences* are not arbitrary. The ground isn't shifting; rather, the literature has moved from asking "What constitutes a convention?" (Lewis's question) to "How do conventions propagate and persist?" (Young's, Boyd & Richerson's question).

  ### The "Slide" You Suspected

  Now, to your second point: *Is all the norm-evolution talk just people sliding between convention and norm without noticing?*

  **Yes, but productively.**

  There is a terminological drift here that you are correctly sensing.
  1.  **Lewis's Narrow Definition:** A convention is a solution to a recurrent coordination problem.
  2.  **The Broader Sociological Definition:** A norm is any rule-like regularity supported by social sanctions.

  The "slide" happens because conventions often *morph* into norms.
  *   **Phase 1 (Convention):** We all drive on the right because it's convenient. (Lewisian)
  *   **Phase 2 (Norm):** We all drive on the right, and if you drive on the left, we honk, glare, or fine you. (Bicchieri/Ullmann-Margalit)

  Once sanctions enter the picture, the "arbitrariness" becomes harder to maintain. If driving on the left results in a fine, it is no longer "arbitrary" in the sense that the payoff matrix has changed. The sanction makes the Right Side *intrinsically* higher payoff than the Left Side.

  The evolution literature often conflates these because they are studying the **transition**. They want to explain how arbitrary regularities acquire normative force (the "ought").
  *   **Peyton Young** (*Individual Strategy and Social Structure*) shows how stochastic stability allows conventions to lock in.
  *   **Cristina Bicchieri** (*The Grammar of Society*) distinguishes social norms from descriptive norms (conventions) by the presence of *normative expectations* (the belief that others think one *ought* to conform).

  When you read that "norms evolve to support cooperation," they are usually talking about Bicchieri-style norms (with sanctions), not pure Lewisian conventions. Pure Lewisian conventions cannot solve Prisoner's Dilemmas; they can only solve Coordination problems. To solve PDs, you need the "normative" layer (sanctions/shame) to alter the payoffs.

  ### Summary

  You are not missing a trick in Lewis. You are witnessing the friction between a **static definition** and a **dynamic process**.

  1.  **Arbitrariness holds:** The *selection* of the equilibrium is under-determined by rationality alone. (We could have driven on the left).
  2.  **Ranking holds:** The *outcomes* of different equilibria are not equal. (QWERTY is worse than Dvorak).
  3.  **The Slide is real:** "Norm" is often used to cover both Lewisian conventions (coordination) and moralized rules (cooperation + sanctions). The evolution literature is interested in how the former becomes the latter.

  The "ground shifting" you feel is the move from asking "Is this a convention?" to "How did we get this convention, and can we get a better one?" The latter question requires us to treat conventions as contingent historical artifacts that can be evaluated for efficiency, even if their existence was originally arbitrary.

  If you want to dig deeper into this specific tension, I recommend looking at **Edna Ullmann-Margalit's *Coordination and Convention*** (1977) for the distinction between "summation" and "coordination" norms, and **Peyton Young's *The Evolution of Conventions*** (1993) for the math on how suboptimal conventions get locked in. They bridge the gap between Lewis's logic and the evolutionary welfare talk you're seeing.
