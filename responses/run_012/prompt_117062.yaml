      *   **Efficiency vs. Arbitrariness:** Arbitrariness in Lewis's sense doesn't mean *value-less*. It means *not uniquely determined by the payoff structure*. Two equilibria can both solve the coordination problem, but one might yield higher payoffs than the other (e.g., QWERTY vs. Dvorak, or driving on the left vs. right with different infrastructure costs).
      *   **Path Dependence:** Evolution of norms literature often focuses on how we get *stuck* in suboptimal equilibria. This acknowledges arbitrariness (we could have been elsewhere) while allowing ranking (this spot is worse than that spot).

  3.  **Drafting the Response - Step-by-Step:**

