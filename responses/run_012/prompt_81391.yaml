answer: |-
  David stands by his car on a clear Tuesday afternoon, preparing for a long drive. He glances at the dashboard where the fuel needle rests firmly against the letter F, and the visual impression of that position is vivid and unmistakable to him. Taking this reading at face value, he thinks that the tank is full and drives away without stopping at a station. He is right, and the gauge is working perfectly, so his thinking matches the way things are and arises from a source everyone accepts as trustworthy in daily life. However, if he were to pause and ask how he could be sure that he is right in this specific instance, he would realize that any check he performs to confirm the gauge is working right—looking at it again, recalling past times it was correct—would ultimately depend on assuming that the gauge is telling the truth now, which is the very thing he would need to show to be sure he is right.

  ### Audit

  **The Condition**
  The condition is the subject's having a vivid visual experience as of the needle pointing to 'F'.

  **Luminosity**
  This condition satisfies the definition of luminosity because it is a phenomenal state. Whenever David has this visual experience, the subjective character of the experience is immediately present to him; he cannot have the experience without being in a position to know that he is having it. There is no gap between the obtaining of the state and his awareness of it, avoiding the marginal error problems associated with external conditions.

  **First-Order Knowledge**
  The first-order belief (that the tank is full) counts as knowledge. It is true (the tank is full), believed (he thinks it is full), and justified by a reliable process (perception of a functioning instrument in ordinary conditions). There are no defeaters present (no deception, no fake barns, no reason to doubt the gauge), fitting the standard criteria for perceptual knowledge in an ordinary context.

  **Second-Order Failure**
  The second-order claim (that he is in a position to know that he knows) fails because validating the link between the condition (the visual experience) and the fact (the full tank) requires establishing the reliability of the gauge. Any attempt to establish this reliability relies on the assumption that the gauge is currently telling the truth. This creates epistemic circularity: he cannot use the gauge to prove the gauge is reliable without begging the question. Since being "in a position to know" requires access to non-circular justification for the reliability of the source, he cannot attain second-order knowledge.

  **Third Level**
  Nothing substantial can be recovered at the third level. If he cannot know that he knows, he cannot know that he knows that he knows, as the same structural barrier applies to every iteration of the reliability check. However, he retains luminous access to the first level (the experience itself), so he can know that he knows *that he is having the experience*, but not that he knows *the tank is full*.

  **The Single Feature**
  The feature doing the work is **epistemic circularity in the validation of the ampliative step**. The move from the internal condition (appearance) to the external proposition (reality) is ampliative, and the only available route to verify the reliability of this move presupposes the truth of the proposition. If this feature were removed—for example, if David could check the fuel level with an independent dipstick—the circularity would vanish, he could verify the gauge's reliability non-circularly, and KK would hold.

  **Defending KK**
  A defender of the KK principle ought to attack this case by **arguing that the circularity is benign**. Denying first-order knowledge is too skeptical for an ordinary afternoon scenario, and denying luminosity contradicts the intuitive phenomenology required to build the case without sorites series. The strongest line is to argue that "being in a position to know" does not require independent, non-circular validation of reliability; it only requires that the belief is in fact produced by a reliable process. Since the gauge is reliable and David knows the tank is full, an externalist defender would argue he is automatically in a position to know he knows, regardless of his inability to prove the gauge's reliability without circularity. This preserves both ordinary knowledge and the KK principle by rejecting the internalist constraint that drives the counterexample.
