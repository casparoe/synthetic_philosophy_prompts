  # Case Design: Epistemically Empty Agreement

  ## 1. Model Specifications

  **State Space:**
  Let $\Omega = \{1, 2, 3, 4\}$.

  **Prior:**
  The agents share a uniform common prior $\mu$:
  $$ \mu(\omega) = \frac{1}{4} \quad \text{for all } \omega \in \Omega $$

  **Proposition:**
  Let $E = \{1, 2\}$.
  The prior probability of $E$ is $P(E) = \mu(\{1, 2\}) = \frac{1}{2}$.

  **Information Partitions:**
  *   **Alice ($\mathcal{A}$):** $\{\{1, 3\}, \{2, 4\}\}$
  *   **Bob ($\mathcal{B}$):** $\{\{1, 4\}, \{2, 3\}\}$

  **Actual State:**
  $\omega^* = 1$.

  ## 2. Derivation of Posteriors and Common Knowledge

  **Alice's Posteriors:**
  *   At $\omega=1$ (Cell $\{1, 3\}$): $P(E | \{1, 3\}) = \frac{\mu(\{1\})}{\mu(\{1, 3\})} = \frac{1/4}{2/4} = \frac{1}{2}$.
  *   At $\omega=2$ (Cell $\{2, 4\}$): $P(E | \{2, 4\}) = \frac{\mu(\{2\})}{\mu(\{2, 4\})} = \frac{1/4}{2/4} = \frac{1}{2}$.
  *   Alice's posterior function $q_A(\omega)$ is constant at $\frac{1}{2}$ for all $\omega$.

  **Bob's Posteriors:**
  *   At $\omega=1$ (Cell $\{1, 4\}$): $P(E | \{1, 4\}) = \frac{\mu(\{1\})}{\mu(\{1, 4\})} = \frac{1/4}{2/4} = \frac{1}{2}$.
  *   At $\omega=2$ (Cell $\{2, 3\}$): $P(E | \{2, 3\}) = \frac{\mu(\{2\})}{\mu(\{2, 3\})} = \frac{1/4}{2/4} = \frac{1}{2}$.
  *   Bob's posterior function $q_B(\omega)$ is constant at $\frac{1}{2}$ for all $\omega$.

  **Common Knowledge Check:**
  Since $q_A$ and $q_B$ are constant functions over $\Omega$, the event "Alice assigns probability $\frac{1}{2}$ to $E$" is $\Omega$, and "Bob assigns probability $\frac{1}{2}$ to $E$" is $\Omega$. The intersection is $\Omega$, which contains the actual state $\omega^*=1$. Thus, their posteriors are Common Knowledge (CK).

  **The Meet:**
  The meet $\mathcal{M} = \mathcal{A} \wedge \mathcal{B}$ is the finest common coarsening.
  *   Starting at 1: $\mathcal{A}(1)=\{1,3\}$, $\mathcal{B}(1)=\{1,4\}$.
  *   Union $\{1,3,4\}$ connects to 2 via $\mathcal{B}(3)=\{2,3\}$ and $\mathcal{A}(4)=\{2,4\}$.
  *   All states are connected. $\mathcal{M} = \{\Omega\}$.
  *   **Strict Coarseness:** $\mathcal{M}$ is strictly coarser than $\mathcal{A}$ and $\mathcal{B}$ (1 cell vs 2 cells).
  *   **Evidence not CK:** Alice's evidence at $\omega^*$ is $\{1, 3\}$. This is not a union of Meet cells (since the only Meet cell is $\Omega \not\subseteq \{1, 3\}$). Thus, Alice's specific evidence is not Common Knowledge.

  ## 3. The Agreement and its Emptiness

  **Agreed Credence:**
  By Aumann's theorem, since posteriors are CK, they must agree.
  $$ q_A(\omega^*) = q_B(\omega^*) = \frac{1}{2} $$
  This agreed credence is the conditional probability of $E$ given the Meet cell containing $\omega^*$:
  $$ P(E | \mathcal{M}(\omega^*)) = P(E | \Omega) = \frac{1}{2} $$

  **Weighted Average Exhibition:**
  The common credence is the expectation of the posterior over the Meet cell $\Omega$:
  $$ P(E|\Omega) = \sum_{C \in \mathcal{A}} P(C|\Omega) P(E|C) $$
  $$ = P(\{1,3\}) \cdot \frac{1}{2} + P(\{2,4\}) \cdot \frac{1}{2} $$
  $$ = \frac{1}{2} \cdot \frac{1}{2} + \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{2} $$
  This exhibits the value as a probability-weighted average of cell-wise posteriors, not merely a midpoint compromise.

  **Epistemic Emptiness:**
  *   **Individual Uncertainty:** Both agents retain the prior uncertainty ($1/2$). Their private evidence provides no marginal gain on $E$.
  *   **Pooled Information:** The intersection of their cells at $\omega^*$ is $\{1, 3\} \cap \{1, 4\} = \{1\}$.
  *   **Settled Truth:** Since $\{1\} \subset E$, the pooled information implies $P(E | \text{Pooled}) = 1$.
  *   **Result:** They agree on $1/2$, but jointly they know $E$ is true. The agreement certifies consistency, not accuracy.

  ## 4. Expected Squared Error (ESE)

  Let $V(\omega) = 1$ if $\omega \in E$, and $0$ otherwise.

  **Agreed Credence ($c_{agree} = 1/2$):**
  $$ \text{ESE}_{agree} = \sum_{\omega \in \Omega} \mu(\omega) \left( \frac{1}{2} - V(\omega) \right)^2 $$
  $$ = 4 \times \left[ \frac{1}{4} \left( \frac{1}{2} - 1 \right)^2 \right] \quad (\text{for } \omega \in \{1,2\}) + 4 \times \left[ \frac{1}{4} \left( \frac{1}{2} - 0 \right)^2 \right] \quad (\text{for } \omega \in \{3,4\}) $$
  $$ = \frac{1}{4} + \frac{1}{4} = \mathbf{0.25} $$

  **Pooled Credence ($c_{pool}(\omega) = V(\omega)$):**
  Since the intersection of cells isolates every state (e.g., at $\omega=3$, $\{1,3\}\cap\{2,3\}=\{3\}$), the pooled credence is always 0 or 1, matching the truth value exactly.
  $$ \text{ESE}_{pool} = \sum_{\omega \in \Omega} \mu(\omega) (V(\omega) - V(\omega))^2 = \mathbf{0} $$

  **Comparison:**
  $$ \text{ESE}_{agree} (0.25) > \text{ESE}_{pool} (0) $$
  The agreed credence is strictly less accurate than the pooled information warrants.

  ## 5. Variant: Rational Disagreement

  **Alteration:**
  Change **Bob's Prior** while keeping partitions, state, and Alice's prior identical.
  *   Alice: $\mu_A$ uniform.
  *   Bob: $\mu_B(1)=3/8, \mu_B(4)=1/8, \mu_B(2)=3/8, \mu_B(3)=1/8$.

  **Result at $\omega^*=1$:**
  *   **Alice:** Posterior remains $1/2$ (depends on $\mu_A$).
  *   **Bob:** Cell $\{1, 4\}$. Mass $= 4/8 = 1/2$. $E \cap \{1, 4\} = \{1\}$. Mass $= 3/8$.
      $$ P_B(E | \{1, 4\}) = \frac{3/8}{1/2} = \frac{3}{4} $$
  *   **CK Check:** Bob's posterior is $3/4$ on $\{1,4\}$ and $3/4$ on $\{2,3\}$ (calculation: $\{2\}$ mass $3/8$, cell mass $4/8$). Thus Bob's posterior is constant $3/4$. Alice's is constant $1/2$. Both are CK.
  *   **Outcome:** They know they disagree ($1/2 \neq 3/4$). AAT does not apply (no Common Prior). Disagreement is rational.

  ## 6. Discussion

  **Feature Doing the Work:**
  In the **Main Case**, the feature preventing convergence on the truth is the **Partition Structure** (specifically, the independence of the signals relative to the event, rendering the Meet too coarse to capture the intersection's information). In the **Variant**, the feature allowing disagreement is the **Common Prior** assumption (specifically, its removal).

  **Defender's Response:**
  A defender of the reading that "rational agents with a common prior cannot disagree" would respond that the Main Case **confirms** their reading, while the Variant confirms its necessity. In the Main Case, the agents *did not disagree*; they agreed on $1/2$. The theorem guarantees consistency of beliefs, not accuracy of beliefs. The defender would argue that expecting the theorem to guarantee truth is a category error; it guarantees that agents cannot "agree to disagree," not that they must "agree on the truth."

  **Standing of the Reading:**
  The reading that "rational agents with a common prior cannot disagree" stands **fully intact**. The Main Case demonstrates exact compliance: common prior + CK posteriors $\to$ agreement. The Variant demonstrates the boundary: no common prior $\to$ rational disagreement allowed. However, the case leaves **no standing** for the stronger reading that "rational agents with a common prior converge on the truth." The Main Case proves that agents can satisfy all hypotheses of Aumann's theorem, agree perfectly, and yet be collectively ignorant of a truth they jointly possess. The theorem secures interpersonal consistency, not epistemic success.
