  You're comparing the wrong promise case. "I promised to drive you and I'm not going to" is shabby because the commitment is a historical fact independent of my current intention; the Moorean equivalent is "I *hereby* promise to be there, but I have no intention of going." That isn't just shabby, it's void—it collapses the act itself. That's why Moore sounds like word misuse: you're trying to issue a commitment while explicitly withholding the authority to issue it. The phenomenology of "incompetence" is exactly right, because you are demonstrating an inability to wield the concept of belief as a commitment. But you want a sayable case? Consider the self-deceived spouse: "He's cheating, but I don't believe it." That's not absurd, it's tragic. Why? Because she's not asserting the first clause as a full commitment while denying the second; she's asserting the evidence while reporting a failure of uptake. In that context, the second clause functions as a descriptive admission of a psychological block rather than a retraction of the assertoric stance. Once you see that the absurdity only bites when the speaker claims both clauses as their current, coherent policy, the view holds. The sentence isn't logically broken; it's practically unstable, and it only stands when you admit the instability.
