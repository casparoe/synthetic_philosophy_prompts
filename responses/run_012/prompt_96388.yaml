answer: |-
  This is a sharp question, and it cuts to the bone of why philosophy of medicine stopped being a sidebar and became central to clinical practice. You're asking me to take a specific historical rupture—the 1973 APA decision—and stress-test the metaphysical machinery we use to define "disease."

  I'm going to honor your constraint immediately: **Yes, the Naturalist/Normativist split is too crude to do honest work on this specific case without significant leakage.** However, to show you *why* it leaks, I first have to run the case through the machinery as requested. The failure of the frameworks to cleanly capture the event is the evidence that the frameworks are the problem.

  Here is the mapping, the fudging, and the breakdown.

  ### 1. The Naturalist Map (Boorse / Biostatistical Theory)

  **The Theory:** Disease is an objective biological dysfunction. It is a failure of a mechanism to perform its species-typical function within a reference class (age, sex, etc.). Values are irrelevant to the *definition* of disease, though relevant to the *treatment*.

  **The Mapping:**
  For a strict Boorsean, the 1973 decision must be viewed as a **correction of a factual error.** If homosexuality was never a dysfunction, classifying it as a disorder was a scientific mistake, akin to classifying phlogiston as an element. The APA didn't change the definition of health; they corrected their measurement of functioning.

  **The Fudge:**
  Here is where the Naturalist view strains until it snaps. Boorse defines function largely through survival and reproduction.
  *   **The Reproductive Trap:** If "species-typical functioning" includes reproductive design, homosexuality presents a statistical and evolutionary problem. It reduces direct reproductive fitness. A strict Naturalist in 1970 could plausibly argue this *is* a dysfunction of the sexual mechanism.
  *   **The Reference Class Problem:** To save the theory, the Naturalist must argue that homosexuality is a "normal variant" (like left-handedness) rather than a dysfunction. But on what biological grounds? In 1973, the etiology was unknown. There was no "gay gene" identified, no hormonal profile confirmed.
  *   **The Verdict on the APA:** For the Naturalist, the APA vote looks suspicious. If the biology hadn't changed (and it hadn't), how did the disease status change? The Naturalist has to claim the psychiatrists *finally saw the biological truth* that had been there all along. But since the biological evidence was ambiguous (Kinsey showed prevalence, Hooker showed adjustment, but neither proved "function"), the Naturalist has to smuggle in a value judgment to decide that "adjustment" equals "function."

  **Explaining the Timing:**
  Naturalism cannot explain why this correction happened in 1973 and not 1953. Biological facts are time-invariant. If it was a factual error, it was an error in 1950. The Naturalist must treat the cultural pressure of the Gay Liberation movement as merely the *sociological cause* of the correction, not part of the *justification*. This feels like special pleading.

  ### 2. The Normativist Map (Engelhardt / Fulford)

  **The Theory:** Concepts of health and disease are inherently evaluative. To call something a disease is to judge it as "bad," "unwanted," or "disabling." There is no value-free line between health and pathology.

  **The Mapping:**
  For the Normativist, the 1973 decision was a **value shift, plain and simple.** The biology didn't matter as much as the social consensus. Homosexuality was classified as a disorder because it violated social norms; it was declassified because those norms shifted.

  **The Fudge:**
  *   **The "Anything Goes" Risk:** If disease is purely a value judgment, what stops the APA from classifying political dissent as a disorder (as actually happened in the USSR)? The Normativist needs a constraint to prevent medicine from becoming pure tyranny. They usually argue that the values must be "shared" or "consensual," but in 1973, the values were *contested*, not shared. The APA vote was close (58% in favor of declassification).
  *   **The Verdict on the APA:** The Normativist says the psychiatrists were engaging in moral deliberation disguised as medical diagnosis. They weren't finding a fact; they were making a policy decision.
  *   **Explaining the Timing:** This is the Normativist's strong suit. It explains 1973 perfectly. Stonewall (1969), the removal of homosexuality from the FBI's security risk lists, the broader civil rights context—these are value shifts. The "disease" disappeared because the "badness" disappeared.

  ### 3. The Hybrid Map (Wakefield / Harmful Dysfunction)

  **The Theory:** A disorder requires *both* a factual dysfunction (evolutionary/biological) *and* a value judgment (harm).

  **The Mapping:**
  This view tries to split the difference. It says: "Maybe there was always a question about the dysfunction, but the *harm* component changed."
  *   **The Fudge:** Wakefield argues that the "dysfunction" part was always missing (it's not a failure of a mechanism designed to do something else), but the "harm" was socially imposed (stigma). When the stigma lessened, the "harmful" condition vanished.
  *   **The Problem:** This still relies on the Naturalist claim that we can identify "dysfunction" independently of values. If we can't agree on whether the sexual mechanism is "designed" for reproduction or pair-bonding or pleasure, we can't settle the dysfunction clause. The Hybrid view inherits the Naturalist's inability to define function without normative assumptions.

  ### 4. The Critical Turn: Why the Split is Too Crude

  You asked me to tell you if the framing is confused. **It is.**

  The Naturalist/Normativist debate assumes a clean separation between **Fact (Biology)** and **Value (Social Judgment)** that the 1973 APA episode demonstrates does not exist in psychiatry.

  Here is why the dichotomy fails in this case:

  **1. The "Facts" Were Value-Laden**
  The Naturalist assumes the APA had access to biological facts that simply needed to be read correctly. But what were the facts? They were psychological adjustment scores, self-reports of distress, and ability to hold a job.
  *   In the 1950s, a gay man reporting distress was evidence of the *disorder* (ego-dystonic).
  *   In the 1970s, a gay man reporting distress was evidence of *stigma* (ego-syntonic).
  The *data* didn't change; the **interpretation of the data** changed. You cannot separate the "biological dysfunction" from the "normative interpretation" because the symptoms of mental disorder *are* behaviors and experiences that require interpretation. There is no "view from nowhere" to see if a sexual orientation is a dysfunction without first deciding what sex is *for*.

  **2. The "Values" Were Fact-Laden**
  The Normativist says it was just a value shift. But the activists (and sympathetic psychiatrists like Judd Marmor) didn't just argue "being gay is okay." They argued "being gay is **not pathological**." They used empirical data (Hooker's Rorschach studies) to show that gay men were not inherently neurotic.
  They didn't just change the value; they challenged the **factual premise** that homosexuality implied incapacity. If it were *purely* normative, the empirical data wouldn't have mattered. But it did. The activists used science to shift the values.

  **3. The Causal Entanglement**
  The Naturalist says: Fact $\rightarrow$ Diagnosis.
  The Normativist says: Value $\rightarrow$ Diagnosis.
  The 1973 case shows: **Value $\rightarrow$ Research Question $\rightarrow$ Fact $\rightarrow$ Diagnosis.**
  The reason we "found" that homosexuality wasn't a dysfunction in 1973 is that the value shift allowed researchers to ask different questions. In 1950, research was designed to find the *cause of the deviation*. In 1970, research was designed to assess *adjustment*. The values determined which biological/psychological facts were considered salient.

  ### Conclusion: What This Case Actually Proves

  To answer your specific questions:

  *   **On the Naturalist story:** They were correcting a mistake, but they have to fudge the definition of "function" to make it work, and they cannot explain the timing without admitting external pressure.
  *   **On the Normativist story:** It was a value shift, which explains the timing, but it risks making diagnosis arbitrary and cannot account for why empirical evidence was central to the debate.
  *   **Which explains it better?** Normativism explains the *change* better; Naturalism explains the *constraint* better (they couldn't have declassified it if gay people were universally catatonic, for example).
  *   **Is this evidence for one side?** No. It is evidence **against the dichotomy itself.**

  **The Verdict on Your Framing:**
  You are right to be suspicious. The Naturalist/Normativist split is a useful heuristic for *end-stage* definitions (e.g., is diabetes a disease?), but it falls apart at the *research and classification* stage, especially in psychiatry.

  In the 1973 APA decision, "dysfunction" and "harm" were not two separate inputs that were weighed. They were a single, entangled construct. The psychiatrists weren't choosing between fact and value; they were renegotiating the **concept of human functioning** itself.

  If you want a philosophy of medicine that handles this, you have to move beyond Naturalism vs. Normativism toward **Pragmatism** or **Conceptual Engineering**. The APA didn't discover that homosexuality wasn't a disease (Naturalism), nor did they just vote that it wasn't bad (Normativism). They **revised the concept of mental disorder** to better serve the goals of the profession and the public. They changed the rules of the game because the old rules were producing bad outcomes (stigma, ineffective treatments, scientific dead ends).

  So, to be direct: Don't lean on the Naturalist/Normativist split for this. It forces you to choose between "biology" and "politics" when the reality is that the biology was being *constituted* by the politics. The episode doesn't fit the boxes; it breaks them.
