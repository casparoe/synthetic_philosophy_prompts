prompt: |-
  So my sister got laid off a few months back and she keeps saying "what goes around comes around" about the manager who did it, like the universe is keeping a tab and he'll get his. Then at a family dinner my aunt, who's into a lot of New Age stuff, told my cousin that his illness was "probably karma" from something he did earlier, and the whole table went dead quiet and nobody knew how to respond. I wanted to argue with both of them but I realized I can't actually say what they're claiming, or what I'd be denying. I don't even know if karma and "what goes around comes around" are the same claim or two different ones wearing the same coat. Somewhere I picked up the idea that in at least some Buddhist framings karma isn't a cosmic judge handing out sentences, it's just the way intentional actions shape what comes next, more like a law of character than a law of payback, but I have no idea if that's right or if it just lets my aunt off the hook.

  Can you lay out, as a menu, the distinct precise claims this slogan (and "karma") could actually be making? I mean things like: it's a causal law of the universe; it's the claim that people's actions tend to produce fitting consequences through ordinary social and psychological channels; it's the claim that suffering is *deserved*; it's a piece of advice about how to live; it's a claim about character formation over a lifetime; it's a claim that only makes sense if you posit rebirth or a cosmic ledger; etc. For each reading I want to know whether it's trivial or substantive or flat-out false, what it would require to be true (a mechanism? a judge? a soul? proportionality?), and crucially whether that reading actually licenses what my aunt said about my cousin's illness and what my sister said about her manager — or whether they've smuggled in a much stronger claim than the proverb itself carries.

  Also tell me which reading the people who say this stuff usually mean, and whether there's any version of the slogan that's defensible without the metaphysical machinery. I'm not looking for a verdict on whether karma is real, I just want to stop getting tongue-tied when it comes up — give me the readings as a list with a short verdict on each, the way you'd hand someone a set of options to take back to an argument.
