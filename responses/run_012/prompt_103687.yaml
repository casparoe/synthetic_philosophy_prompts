answer: |-
  1. Contextual integrity explains the boycott as a reaction to the state violating established norms by combining data points in ways that disrupted the expected flow between citizen and government. The outrage stemmed not from secrecy but from the inappropriate transfer of information into a centralized profile that exceeded the traditional context of statistical counting.

  2. The theory reaches its limit because it relies on existing social norms to judge appropriateness, whereas the protesters were effectively arguing that no existing norm could justify this new level of surveillance. Nissenbaum's framework struggles when technology enables data flows that have no historical precedent, requiring new rights rather than just adherence to old contexts.

  3. Informational self-determination overlaps with contextual integrity by limiting state overreach, but it differs by grounding privacy in individual autonomy rather than socially constructed expectations of appropriate flow. The court empowered individuals to control their data personally, while Nissenbaum argues privacy is maintained when information moves according to community standards regardless of individual consent.

  4. This episode disproves the nothing-to-hide argument by showing that citizens resisted not because they were concealing crimes, but because unchecked data collection creates a power imbalance that threatens democratic freedom. The boycott demonstrated that privacy is about maintaining independence from the state, not merely protecting shameful secrets from exposure.

  5. The legal outcome highlights that protecting democracy sometimes requires rigid constitutional barriers rather than the flexible normative adjustments suggested by contextual integrity. By forcing the census redesign, the court affirmed that certain information flows are inherently dangerous regardless of whether society has yet formed a norm against them.
