  2. **Confucian Official:** "But this splitting threatens the rectification of names; if a white horse is not a horse, then a filial son is not a son, and if names become slippery, duties and laws slip with them." **Gongsun Long:** "On the contrary, clarity prevents slippage; if you seek a horse, a yellow one suffices, but if you seek a white horse, the yellow one is denied, so the two requests must seek different things."

  3. **Confucian Official:** "You argue like a sophist while the world relies on usage; we feed them, ride them, and breed them as horses every day, and if language breaks down to this precision, no one will know how to speak to another." **Gongsun Long:** "Language breaks only when we confuse compounds with simples; consider this stone here: you see its whiteness but feel no hardness, you feel its hardness but see no whiteness, so they never truly meet."

  4. **Confucian Official:** "The stone is one object regardless of your senses; if I strike you with it, the hardness hurts whether you see the white or not, proving the qualities unite in a reality beyond your perception." **Gongsun Long:** "Perception is the only gate to existence for us; since the eye never finds hardness and the hand never finds whiteness, they exist separately in the mind even if they dwell in the same stone."

  5. **Confucian Official:** "I can mount this 'not-horse' and ride into battle, but I cannot mount a distinction; if it carries a man's weight, it is a horse, and your logic cannot change the ground beneath our feet." **Gongsun Long:** "You speak of the beast that carries weight, while I speak of the name that carries meaning; the horse may carry you into battle, but the term 'white horse' will never carry the same meaning as 'horse'."
