          *   *Self:* Instrumental vessel for producing good. Personal projects are justified only by contribution to the good.
          *   *Moral/Non-moral:* Non-moral is subordinate or illusory. Everything enters the moral ledger.
          *   *Principle:* Parity of Moral Opportunity (if a better use exists, not taking it diminishes the life).
      *   **Moderated Ideal (ModI):**
          *   *Value:* Pluralistic, incommensurable, bounded. Good is multifaceted.
          *   *Self:* Constituted by commitments and projects that are *ours*, not just neutral conduits. Integrity matters.
          *   *Moral/Non-moral:* Distinct domains. Non-moral values (friendship, art, rest) have independent weight.
          *   *Principle:* Integrity of the Unclaimed Life (reserve is necessary for flourishing).

  3.  **Compare Presuppositions:**
      *   *Nature of Value:* MI assumes monism (one currency of value). ModI assumes pluralism (different kinds of value that can't be fully traded off).
      *   *The Self:* MI sees the self as a neutral administrator. ModI sees the self as an agent with ground projects that define identity.
      *   *Moral/Non-moral:* MI collapses the distinction (all is moral). ModI maintains the distinction (morality has limits).

  4.  **Identify Conflicts vs. Talking Past Each Other:**
      *   *Conflict:* Genuine clash on obligation. MI says you *must* optimize. ModI says you *may* not.
      *   *Talking Past:* Possibly on the definition of "good life." MI means "morally best outcome." ModI means "best for the agent to live." If MI admits "morally best" doesn't mean "rationally required," they might converge, but MI usually claims rational requirement too.

  5.  **Adjudication (Which has the better of it?):**
      *   *Critique of MI:* Demandingness objection. Alienation objection (Williams). Self-defeating (burnout reduces long-term good). Ignores the source of value (human relationships require partiality).
