answer: |-
  The colony regulates brood temperature through physical clustering density, a state determined solely by local heat gradients on the comb surface. When heat loss exceeds a threshold, workers tighten the cluster; when it drops, they loosen. This density carries Stake: if the cluster misreads the gradient due to external insulation tricks, the brood freezes or cooks, directly harming colony survival traceable to that misrepresentation rather than mechanical failure. However, this density state lacks Global Availability. It is encapsulated within the thermoregulatory subsystem; the information about heat loss never reaches the foraging trails or defense squads. No mechanism exists to compare this thermal state against food reserves or predator alerts to weigh trade-offs. The cluster cannot choose to sacrifice brood warmth for defense because the thermal state cannot be brought to bear on the defensive repertoire. The information dies where it is generated, satisfying Stake while structurally prohibiting Global Availability.

  **The Instrumentalist**
  Does the colony represent anything? Yes. Does it have a mind? Yes.
  The internal architecture is irrelevant. If treating the colony as a single agent with beliefs about heat and desires for survival yields the best predictions of its behaviour, then it has beliefs and a mind. The split between subsystems is merely implementation detail.

  **The Functional-Role Theorist**
  Does the colony represent anything? No. Does it have a mind? No.
  Representation requires states that play a specific causal role, specifically Global Availability. Since the thermal state cannot influence the whole behavioural repertoire nor be compared to other states, it is not a belief. Without beliefs, there is no mind.

  **The Stake Theorist**
  Does the colony represent anything? Yes. Does it have a mind? No.
  The thermal state tracks a fact about the system itself and causes harm when wrong, fulfilling the condition for representation. However, a mind requires a subject for whom things can be so. The colony is a distributed system without a unified subject, even if it possesses representational states grounded in welfare.

  **Three Things**
  1.  **Feature doing the work:** Informational encapsulation. The structural isolation of the thermoregulatory subsystem allows Stake (local harm) without Global Availability (global access).
  2.  **Removal effect:** If encapsulation is removed and thermal data broadcasts globally, the Functional-Role theorist grants representation and mind. The case collapses into the ordinary debate over superorganisms, losing its engineered ambiguity.
  3.  **Worst position's attack:** The Instrumentalist attacks the case as pedantic. They argue that if the colony corrects errors to survive, it holds beliefs regardless of internal routing; distinguishing architecture from agency is a category error that ignores the success of the predictive stance.
