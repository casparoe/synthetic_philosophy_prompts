      *   *Analysis:* In the Dollar Auction, is it *just* sunk cost? If I bid 90 cents and you bid $1, I lose 90 cents if I stop. If I bid $1.05, I lose 5 cents. Rational choice theory says keep bidding until the loss exceeds the value of the prize. But why start?
      *   *Nuance:* It's not just "I've spent money, so I must continue." It's also *loss aversion* (Kahneman/Tversky). Losing 90 cents hurts more than losing $1.05 feels bad. Also, it's about *threat credibility* and *reputation* in repeated games, though a one-off dinner party doesn't have that.
      *   *Verdict:* Sunk cost is part of it, but "Loss Aversion" and "Trap of Rationality" are more precise. The engine is the *structure of the payoff matrix*, not just the psychology of the spender. The user's intuition is correct: Sunk Cost is the symptom, the Auction Structure is the disease.

  4.  **Address Question 2: Is the "locked-in" vs. "free-exit" distinction sound?**
      *   *Initial thought:* This is the strongest part of the pitch. It adds novelty.
      *   *Analysis:* In a standard auction (free-exit), if I bid $500k on a house and lose, I lose nothing (usually). If I bid $500k and win, I pay. In the Dollar Auction (locked-in), the second place pays.
      *   *Critique:* The claim "only the first kind is genuinely self-propelling" is too strong. In "free-exit" wars (like Streaming Wars), companies *choose* to stay in because they fear market irrelevance, not because a contract forces them to pay upon losing. The "penalty" is strategic death, not a rule of the game.
      *   *Verdict:* The distinction is useful heuristic, but the "self-propelling" claim needs softening. "Free-exit" escalations are driven by *perceived* locked-in stakes (market share, survival), even if the mechanical rules allow exit.

