      *   *Refinement:* The AI race is a "free-exit" escalation (technically). They can stop building data centers. Why don't they? Fear of being left behind.
      *   *Verdict:* The analogy leaks if framed as "loser pays winner." It works if framed as "fear of being the second-highest bidder in a market that only rewards #1." The "payment" isn't to the opponent, it's to the market (infrastructure costs). The user needs to clarify that the "second-highest bidder pays" in AI is metaphorical (strategic obsolescence), not literal.

  6.  **Address Question 4: Is this interesting or cliché?**
