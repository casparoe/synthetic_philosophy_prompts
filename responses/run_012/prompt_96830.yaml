      *   **Thesis:** Escalation is the master key to irrational behavior (streaming, AI, neighbors, takeovers).
      *   **Mechanism:** Sunk Cost Fallacy (can't walk away from money on the table).
      *   **Theoretical Basis:** Shubik (1971), Staw (escalation of commitment).
      *   **Original Contribution:** "Locked-in" (second highest pays) vs. "Free-exit" (loser just loses sunk costs). Claim: Only locked-in is truly self-propelling.
      *   **Application:** AI CapEx race, Streaming Wars, etc.

  3.  **Address Question 1: Is the sunk-cost diagnosis right?**
