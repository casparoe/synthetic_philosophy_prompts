      *   *Q2 (Distinction):* It's good, but "self-propelling" is too absolute. Free-exit wars escalate because the *consequences* of losing feel like a lock-in. Differentiate "Rule-based lock-in" vs "Strategic lock-in."
      *   *Q3 (AI):* It leaks. In AI, the loser doesn't pay the winner. They just wasted CapEx. Reframe: The market acts as the auctioneer. The "second place" penalty is irrelevance.
      *   *Q4 (Interest):* It's on the edge. The anecdote saves it. The distinction saves it. Avoid preaching sunk cost. Focus on the *trap*.

  9.  **Final Polish:** Ensure I'm not giving a reading list. Keep it focused on the structural weaknesses of the argument. (Self-Correction: Make sure to emphasize that Shubik's point was about *rationality* leading to *irrationality*, not just psychological bias. That's a crucial distinction for a science writer.)

  10. **Final Review against constraints:** Did I answer all 4 points? Yes. Is it actionable? Yes. Is the tone appropriate? Yes.

  *(Self-Correction during drafting)*: I should emphasize that in the Dollar Auction, the *rational* move at 90 cents is to bid $1.05. That's the horror. It's not a fallacy at that specific moment; it's a trap. The user calls it "short-sighted rational choice," which is good, but then blames "sunk cost fallacy." These are slightly different. Sunk cost says "I spent 90c, I must continue." Rational trap says "If I stop I lose 90c, if I bid I only lose 5c." I need to point out this tension.

