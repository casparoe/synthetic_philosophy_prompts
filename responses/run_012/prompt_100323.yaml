answer: |-
  Here is a refined specification of the desiderata for an adequate theory of promissory obligation, reorganized for clarity and annotated according to your constraints. I have pruned redundant edges, grouped related phenomena, and added one critical missing element regarding the *nature of the wrong*.

  I have classified each requirement as **Non-negotiable** (if the theory fails this, it fails your specific aim of explaining the interpersonal moral bond) or **Camp Preference** (where reasonable theories diverge without necessarily failing the core intuition).

  ### I. Genesis: How the Obligation Arises
  **1. The Alchemy Constraint (Creation)**
  *   **Requirement:** The theory must explain how a voluntary speech act generates a new moral reason without invoking magic or presupposing the very obligation it seeks to explain.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** If the theory cannot bridge the gap between "I said I would" and "I must," it fails to explain the obligation. It must avoid circularity (e.g., "you must keep promises because there is a duty to keep promises").

  **2. Intentionality and Context**
  *   **Requirement:** The obligation arises only when the promisor intends to undertake an obligation and the context signals this intent (ruling out jokes, theater, or coercion).
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This addresses your "games" and "coercion" points. A promise extracted at gunpoint or made on a stage lacks the voluntary uptake required for moral bindingness.

  **3. The Limits of Content (Arbitrary vs. Immoral)**
  *   **Requirement:** The theory must allow bindingness for trivial or otherwise optional acts (the tea) but deny bindingness for acts that are independently immoral (the crime).
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This distinguishes promising from general moral duty. If I already ought to do it, promising adds little; if I ought *not* do it, promising cannot override that. The theory must explain why the *promise* adds weight to the permissible but yields to the mandatory.

  ### II. Structure: The Shape of the Obligation
  **4. Directedness (The Claim-Right)**
  *   **Requirement:** The obligation is *owed to* the promisee. Only the promisee holds the standing to complain, waive, or release the promisor. A bystander cannot demand performance based on the promise alone.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This is the core of your request. It rules out act-utilitarianism (which owes the act to the general good) and simple rule-utilitarianism (which owes the act to the institution).

  **5. The Power of Release**
  *   **Requirement:** The theory must explain why the promisee can extinguish the obligation (release) and why a promise to release can itself be binding.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This is the corollary to Directedness. If the obligation is truly *to* the person, they must hold the key to its dissolution. If they cannot release you, it is a duty to the universe, not a promise.

  ### III. Persistence: Durability and Independence
  **6. Independence from Reliance**
  *   **Requirement:** The obligation must exist even if the promisee does not rely on the promise, plans not to rely on it, or suffers no harm from its breach.
  *   **Status:** **Non-negotiable** (for your stated aim).
  *   **Consideration:** This explicitly excludes pure Reliance Theories. If the duty vanishes without reliance, you cannot explain the wrong of breaking a promise to someone who knew you were lying all along but asked you to promise anyway.

  **7. Objectivity and Survival**
  *   **Requirement:** The obligation must survive the promisor's forgetfulness and, in most cases, the promisee's death (for post-mortem wishes).
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This addresses your "forgetting and death" point. If the obligation exists only in the current mental states of the parties, forgetting dissolves it. If it is a moral fact created by the act, it persists until discharged.

  ### IV. The Nature of the Wrong
  **8. The Specific Wrong (Betrayal vs. Harm)**
  *   **Requirement:** The theory must distinguish the wrong of *breaking a promise* from the wrong of *causing disappointment* or *acting unpredictably*.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** **Added.** This is crucial for your conversation. You need to explain why the promisee feels *betrayed*, not just *inconvenienced*. A theory that explains why breach is inefficient does not explain why it is a personal affront.

  ### V. Edge Cases
  **9. Self-Promises**
  *   **Requirement:** The theory must offer a principled account of whether self-promises are promises *stricto sensu* or a distinct phenomenon of self-governance.
  *   **Status:** **Camp Preference.**
  *   **Consideration:** Many robust theories of promising (e.g., Second-Personal) argue self-promises are impossible because one cannot hold a claim-right against oneself. Others argue they are the foundational case. A theory can fail here and still succeed on interpersonal promises.

  ---

  ### The Tension: Is the Demand Incoherent?

  You suspect that **Independence from Reliance** and **Non-Mysterious Creation** cannot be jointly satisfied alongside **Directedness**.

  **You are right to feel the tension, but the demand is not incoherent.**
  The tension arises because most "non-mysterious" sources of obligation are empirical (psychological reliance, social stability, divine command).
  *   If you ground the obligation in **Reliance**, you save non-mystery but lose Independence.
  *   If you ground it in **Social Utility**, you save non-mystery but lose Directedness (the debt is to society, not the person).
  *   If you ground it in **Directedness + Independence**, you are forced to posit a **Normative Power**: the metaphysical capacity of persons to change the moral landscape by willing it.

  To a skeptic, "Normative Power" sounds like the "magic" you want to avoid. To a proponent, it is the only thing that respects the phenomenology of promising. The tension is not a contradiction, but a choice between *reducing* the obligation to something else (reliance/utility) or *accepting* it as a basic feature of moral agency.

  ### The Single Most Exclusionary Requirement

  **Directedness (Requirement #4)** does the most work in ruling candidates out.

  *   **Utilitarianism:** Fails immediately. The duty is to maximize good, not to satisfy *this* person's claim.
  *   **Pure Reliance Theory:** Fails. The duty is to avoid harm, not to respect the person's authority. If I cause no harm, I owe nothing.
  *   **Divine Command / Natural Law:** Often fails. The duty is to God or the Moral Law; the promisee is merely the beneficiary, not the creditor. They cannot "release" you; only God can.

  Directedness forces the theory to be **relational**. It demands that the promisee be a participant in the obligation, not just a recipient of the action.

  ### Verdict on Theoretical Families

  Here is how the main contenders score against your refined list:

  **1. The Social Practice View (e.g., Rawls, Rule-Utilitarianism)**
  *   **Verdict:** **Fails Directedness.**
  *   **Why:** It explains the "Alchemy" well (we agree to play by these rules) and handles "Immoral Content" (rules have exceptions). But it makes the wrong one against *society* for undermining the institution, not against the *person* for betraying them. It cannot explain why the promisee alone can release you.

  **2. The Reliance View (e.g., simple Consequentialism)**
  *   **Verdict:** **Fails Independence from Reliance.**
  *   **Why:** It is non-mysterious and explains the harm. But it cannot account for the "harmless breach" (where I break the promise, you find out immediately, suffer nothing, yet I still wronged you). It reduces the promise to a prediction.

  **3. The Normative Power / Voluntarist View (e.g., Raz, Ginet)**
  *   **Verdict:** **Best Fit, High Cost.**
  *   **Why:** It satisfies Directedness, Independence, Release, and Content perfectly. It treats promising as an exercise of a specific moral power we possess.
  *   **Cost:** It struggles with the **Alchemy Constraint**. To the skeptic, it looks like asserting "we can create duties by speaking" without explaining *how* that power exists. It risks being a "just so" story unless grounded in a broader view of autonomy.

  **4. The Second-Personal / Authority View (e.g., Darwall, Shiffrin)**
  *   **Verdict:** **Strongest Contender for your Aim.**
  *   **Why:** It grounds the Normative Power in the **status of persons**. We have the authority to demand certain things of one another because we are free and equal agents.
  *   **Fit:** It explains **Directedness** (the claim is an exercise of authority), **Release** (waiving the claim), and **The Specific Wrong** (betrayal is a violation of the authority relationship, not just harm). It avoids "magic" by rooting the power in the fundamental standing of persons, which is less mysterious than a free-floating normative power.
  *   **Weakness:** It requires the skeptic to accept that persons have this specific kind of moral standing/authority, which is a philosophical commitment, though one usable in ordinary conversation ("You gave me your word," implies "You put yourself under my authority regarding this act").

  **Recommendation:** For a conversation with a skeptical friend where you must avoid technical machinery but preserve the interpersonal wrong, the **Second-Personal** intuition is your best tool. Frame the promise not as a prediction or a social rule, but as an invitation to trust that grants the other person a specific **authority** over your actions. Breaking it isn't just a mistake; it is a usurpation of the authority you voluntarily granted them.
