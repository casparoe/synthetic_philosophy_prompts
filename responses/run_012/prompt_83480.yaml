answer: |-
  ### I. The Implicit Theory of the Person: The Competent-Slice Model

  The pattern you describe does not presuppose a fixed metaphysical stance on personal identity, nor does it consistently privilege the earlier or the later self. Instead, the law operates on a functional theory of **contextual competence**. The implicit view is that a person across time is a sequence of temporal slices with varying degrees of autonomy, information, and psychological integrity. The law's goal is not to enforce the will of "the person" abstractly, but to enforce the will of the *most competent* slice, or to mitigate the damage caused by the *least competent* slice, depending on the social cost.

  **1. Diachronic Rationality and Defect**
  The pattern does not treat time-inconsistent preferences as a formal rational defect in the sense of a Dutch-book argument (where inconsistency guarantees loss regardless of content). If it did, the law would uniformly invalidate any contract where preferences might shift, or uniformly enforce all precommitments to prevent exploitation.

  Instead, the law treats time-inconsistency as a **normative defect** only in specific psychological contexts.
  *   **In Self-Exclusion:** The inconsistency (wanting to quit, then wanting to gamble) is treated as a pathology (addiction). The earlier self is deemed the "true" agent because it acts from a state of reflective equilibrium; the later self is viewed as compromised by impulse.
  *   **In Cooling-Off Periods:** The inconsistency (agreeing, then cancelling) is treated as a correction of situational impairment. The earlier self is deemed compromised by sales pressure, isolation, or lack of comparison; the later self is viewed as the "true" agent acting with calm reflection.
  *   **In General Contract:** Preference change is treated as **neutral drift**. Here, the law assumes both slices are competent, so the earlier slice's commitment stands to protect reliance interests.
  *   **In Bankruptcy:** The inconsistency is treated as **systemic risk**. The earlier self's obligation is overridden not necessarily because the later self is more competent, but because the cost of enforcing the earlier self's promise (debt peonage, economic inactivity) outweighs the moral weight of the promise.

  Thus, the pattern is licensed neither by pure rational-defect theory nor by pure preference drift. It is licensed by a **paternalism of capacity**: the law intervenes to privilege the temporal slice it judges to be more autonomous or less impaired, unless third-party reliance or social utility dictates otherwise.

  **2. The Metaphysics of the Agent**
  The law does not commit to there being a fact of the matter about which slice is "really" the agent. That is a legal fiction deployed instrumentally.
  *   When enforcing self-exclusion, the law fictionally treats the earlier self as the principal and the later self as a wayward agent.
  *   When allowing cooling-off cancellations, the law fictionally treats the earlier self as a duressed principal and the later self as the ratifier.
  *   When discharging bankruptcy, the law treats the later self as a new economic entity entitled to a fresh start, effectively severing diachronic identity for the sake of utility.

  The law is agnostic on the metaphysics of persistence. It cares about **attribution of responsibility**. It asks: "Which slice is best positioned to bear the cost of this decision?"

  ### II. Coherence and Underlying Principles

  Is there one principle generating all four rules? No. The pattern is a **pragmatic equilibrium** between three competing values: **Autonomy** (binding yourself), **Welfare** (protecting yourself from ruin), and **Reliance** (protecting others who deal with you).

  *   **General Contract** prioritizes *Reliance*. It assumes competence unless proven otherwise.
  *   **Cooling-Off** prioritizes *Welfare/Autonomy* (correcting the formation defect). It assumes the formation context was impaired.
  *   **Self-Exclusion** prioritizes *Autonomy* (long-term planning) over *Welfare* (immediate gratification) and *Reliance* (the casino's profit). It assumes the performance context is impaired.
  *   **Bankruptcy** prioritizes *Social Welfare* over *Autonomy* and *Reliance*.

  **Which rules fit a single view?**
  If we adopt the principle of **"Protect the Competent Slice,"** Cooling-Off and Self-Exclusion fit comfortably. Both identify a specific impairment (sales pressure vs. addiction) and empower the unimpaired slice.
  However, General Contract and Bankruptcy do not fit this principle strictly. General Contract enforces the earlier slice even if the later slice is equally competent but simply changed its mind. Bankruptcy overrides the earlier slice even if the earlier slice was fully competent, simply because the outcome is too harsh.

  Therefore, the pattern is not logically coherent under a single theory of the self. It is a **doctrinal heap** that resolves conflicts case-by-case based on the *type* of preference change involved (impulse vs. reflection vs. misfortune).

  ### III. Rival Pictures: Stress-Testing the Practice

  To locate the inconsistency precisely, we must view the current practice through two rival metaphysical/normative pictures.

  #### Picture A: The Binding Planner (Earlier Self Sovereign)
  **Theory:** Personal identity is constituted by the capacity to form and execute long-term plans. Autonomy is the power to bind one's future self. Time-inconsistency is a failure of will that the law should not reward. Regret is irrelevant; only incapacity at the moment of signing matters.
  **Implications:**
  *   **General Contract:** **Survives and strengthens.** No excuse for change of mind. Specific performance becomes the default remedy.
  *   **Self-Exclusion:** **Survives and strengthens.** The ban becomes irrevocable. The earlier self's command is absolute.
  *   **Cooling-Off Periods:** **Abolished.** If the earlier self was competent enough to sign, they are bound. If they were pressured, that is a standard duress claim, not a blanket temporal right. The "right to regret" is eliminated.
  *   **Bankruptcy:** **Abolished or radically restricted.** Debts are moral obligations that persist across time. Discharge is only permissible in cases of physical impossibility, not economic hardship. The later self inherits the earlier self's burdens entirely.

  **Result:** A society of high commitment and high planning security, but high risk of ruin for those who miscalculate or suffer misfortune. The "self" is a rigid chain.

  #### Picture B: The Presentist Agent (Later Self Sovereign)
  **Theory:** Only the present moment of experience is real. The "past self" is a stranger whose preferences have no normative claim on the current self. Obligations are valid only as long as they are currently endorsed. Precommitment is a form of slavery by the dead hand of the past.
  **Implications:**
  *   **General Contract:** **Abolished.** A contract is merely a statement of current intent. If I change my mind, the contract dissolves. Expectation damages vanish; perhaps only reliance costs incurred *today* are payable.
  *   **Self-Exclusion:** **Abolished.** If the current self wishes to gamble, the state cannot enforce the will of a "past stranger." Addiction is a health issue, not a contractual one.
  *   **Cooling-Off Periods:** **Survives and expands.** Cancellation becomes perpetual. You can return the goods whenever you want, because your current will overrides the past transaction.
  *   **Bankruptcy:** **Survives and becomes automatic.** Since the later self is not responsible for the earlier self's debts, discharge is the default, not the exception.

  **Result:** A society of maximum flexibility and zero entrapment, but zero trust. Credit markets collapse because the "later self" cannot be bound. Long-term projects become impossible because the "later self" can abandon them without penalty.

  ### IV. Locating the Inconsistency

  The current legal practice sits uneasily between Picture A and Picture B. It is not inconsistent because it lacks a theory, but because it **oscillates between theories based on the perceived stakes.**

  1.  **The Inconsistency:** The law treats the earlier self as sovereign in General Contract (Picture A) but treats the earlier self as a stranger in Bankruptcy (Picture B). It treats the later self as impaired in Self-Exclusion (Picture A logic applied to addiction) but treats the later self as the arbiter of truth in Cooling-Off (Picture B logic applied to consumer pressure).
  2.  **The Precise Location:** The fault line runs through the **diagnosis of impairment**.
      *   When the law suspects the *formation* was impaired (Cooling-Off), it privileges the Later Self.
      *   When the law suspects the *performance* is impaired (Self-Exclusion), it privileges the Earlier Self.
      *   When the law suspects *neither* is impaired (General Contract), it privileges the Earlier Self (for reliance).
      *   When the law suspects the *consequences* are socially destructive (Bankruptcy), it privileges the Later Self (for utility).

  **Resolution:**
  The pattern is coherent only if we accept that the law is not trying to define the "true self." It is trying to **maximize diachronic welfare while minimizing transaction costs.**
  *   It enforces the Earlier Self when doing so facilitates planning (Contract, Self-Exclusion).
  *   It enforces the Later Self when doing so prevents catastrophe or corrects known cognitive biases (Cooling-Off, Bankruptcy).

  **Which rules should be revised?**
  If one demands logical consistency regarding personal identity:
  *   **Under Picture A:** Cooling-Off and Bankruptcy are the errors. They undermine the unity of the agent.
  *   **Under Picture B:** General Contract and Self-Exclusion are the errors. They enforce the will of a "dead" agent.

  However, since neither picture is desirable in pure form (Picture A is too rigid; Picture B is too chaotic), the current "incoherent" mix is likely the stable equilibrium. The only revision required is to make the **criteria for switching** between Picture A and Picture B more explicit. Currently, the switch depends on hidden judgments about addiction, pressure, and economic utility. Making these explicit would reveal that the law does not care about "who is the agent," but rather "which enforcement rule produces the best outcome for the person-over-time and society."

  The law presupposes that we are **plural selves** bound by a **single liability**, and it adjusts the liability based on which self was driving the bus when the crash happened.
