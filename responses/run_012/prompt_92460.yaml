answer: |-
  You have identified a genuine and widely discussed problem in the methodology of thought experiments, but you are correct that there is no single, canonical noun that isolates *exactly* this mechanism. The literature fragments the phenomenon across logic, rhetoric, and cognitive psychology.

  The closest established term is **"Intuition Pump,"** specifically in its pejorative sense as formulated by Daniel Dennett. However, "Intuition Pump" is too broad; it covers any rhetorical device that manipulates intuition rather than argument (including emotional loading, misleading analogies, etc.). It does not specifically denote the *underspecification* mechanism you are describing.

  The structural feature you note is called **"Underdescription"** (most notably by Kathleen Wilkes in *Real People*, 1988). Wilkes argues that many philosophical thought experiments (especially on personal identity) are so underdescribed that they fail to sustain the weight placed on them. However, "Underdescription" names the *flaw in the case*, not the *epistemic mechanism* by which the audience is persuaded despite the flaw.

  The logical status of the move is often categorized as **"Begging the Question"** (or *petitio principii*), as argued by John Norton (2004), who claims thought experiments are just arguments. If the intuition relies on a premise not stated, the argument is circular. But this misses your key insight: the premise isn't just hidden by the arguer; it is *supplied by the audience* via the gaps.

  Because no single term captures the *dependence on audience-supplied background knowledge to create a false sense of discovery*, I will propose a name for it, define it, and draw the boundaries you requested.

  ### Proposed Name: **Epistemic Smuggling**
  *(Alternative: **The Projection Gap**)*

  **Definition:** Epistemic Smuggling occurs when a thought experiment's persuasive force depends on the audience unconsciously supplying unstated details (tacit premises) to resolve ambiguities in the scenario, where those details are sufficient to guarantee the desired conclusion. The "knowledge" gained is illusory because the conclusion was contained in the audience's own supplied background assumptions, not derived from the specified constraints of the case.

  ### Why this is distinct from nearby concepts

  You asked to distinguish this from three specific "nearby ideas." Here is how **Epistemic Smuggling** differs:

  1.  **Vs. Hidden Premises (Logical):**
      *   *Hidden Premise:* The arguer relies on a specific claim $P$ that is not stated. If you expose $P$, the argument stands or falls on $P$.
      *   *Epistemic Smuggling:* The arguer leaves a *gap*. Different audience members fill the gap with different claims ($P_1$, $P_2$, $P_3$), yet all arrive at the same conclusion $C$. The persuasion works *because* the premise is not fixed. If the arguer were to specify the premise explicitly, the audience might reject it. The ambiguity is the engine, not a bug.
  2.  **Vs. Variable Intuitions (Psychological):**
      *   *Variable Intuitions:* Different people have different gut reactions to the *same* fully specified case (e.g., Gettier cases). This is data about cognitive diversity.
      *   *Epistemic Smuggling:* The intuition is stable *only so long as the case remains underspecified*. Once the gaps are filled consistently, the intuition converges or flips. The variance is not the phenomenon; the *disappearance of the intuition upon specification* is the diagnostic test.
  3.  **Vs. Trivial Underspecification (Methodological):**
      *   *Trivial Underspecification:* All thought experiments omit irrelevant details (e.g., the color of the demon's coat in Maxwell's Demon). Filling these in does not change the verdict.
      *   *Epistemic Smuggling:* The omitted details are *relevant*. Filling them in changes the verdict or requires contentious assumptions. The omission is strategic, not practical.

  ### Boundaries and Borderline Cases

  To determine if a case involves Epistemic Smuggling, apply the **Specification Test**: *Does making the implicit details explicit weaken or reverse the intuition?*

  **Borderline Case 1: The "Ceteris Paribus" Defense**
  *   *Scenario:* An economist describes a market intervention that fails, assuming "all other things remain equal." Critics say real markets never hold other things equal.
  *   *Verdict:* **Not Epistemic Smuggling.** This is a legitimate idealization. The omitted details are acknowledged as variables that are being controlled for theoretically. The audience is not asked to *imagine* they are equal based on background belief; they are asked to *stipulate* they are equal for the sake of the model. If the model breaks when variables change, that is a limit of the model, not a rhetorical trick.
  *   *Boundary:* Smuggling occurs when the "other things" are not stipulated as controlled, but are implicitly assumed to behave in a specific way based on the audience's real-world expectations.

  **Borderline Case 2: The "Standard Interpretation"**
  *   *Scenario:* A philosopher uses the "Trolley Problem." They don't specify the age of the people on the track. Critics say, "What if they are infants? What if they are criminals?"
  *   *Verdict:* **Not Epistemic Smuggling (usually).** In established thought experiments, there is a "canonical" version where certain details are conventionally understood to be neutral. If the audience fills the gap with "random adults," and the intuition holds even when specified as "random adults," no smuggling has occurred.
  *   *Boundary:* Smuggling occurs if the intuition *only* holds when the audience implicitly assumes the people are "innocent" or "strangers," and the philosopher refuses to specify this to avoid controversy. If the verdict flips when you specify "the five people are the philosopher's enemies," the original case was smuggling the assumption of impartiality.

  **Borderline Case 3: The "Pedagogical Simplification"**
  *   *Scenario:* A physics professor describes a frictionless plane to explain Newton's laws.
  *   *Verdict:* **Not Epistemic Smuggling.** The omission is declared (friction is ignored). The audience is not filling the gap with a belief about the world; they are accepting a constraint of the model.
  *   *Boundary:* Smuggling occurs if the professor claims this proves something about *real* planes without acknowledging the gap, and relies on the students' intuition about real planes to bridge the difference.

  ### Where to look in the literature

  Since you are in a seminar, you may want to reference the specific debates where this is analyzed, even if the single term is missing:

  1.  **Kathleen Wilkes, *Real People* (1988):** Focus on her critique of "underdescribed" thought experiments in personal identity. She argues that when you fill in the biological/psychological details, the "intuition" vanishes.
  2.  **Daniel Dennett, "Intuition Pumps" (1980/1991):** Look for his warnings about tools that "pump" the wrong intuitions by leaving out critical machinery.
  3.  **John Norton, "Why Thought Experiments Do Not Transcend Empiricism" (2004):** Norton argues TEs are arguments. If they seem to do more, they are hiding premises. This is the logical backbone of your observation.
  4.  **Experimental Philosophy (X-Phi):** Look for work on **"The Sensitivity of Intuitions to Case Details"** (e.g., by Jonathan Weinberg, Stephen Stich). They empirically demonstrate that changing the "filled in" details changes the verdict, undermining the claim that the TE reveals necessary truth.

  ### Summary

  You have correctly identified a gap in the terminology. The phenomenon is a hybrid of **Strategic Underdescription** (the structure) and **Tacit Premise Projection** (the cognitive mechanism). While **"Intuition Pump"** is the colloquial label in philosophy seminars, it is imprecise.

  If you need to name it in a paper or discussion to distinguish it from general vagueness or logical circularity, I recommend using **"Epistemic Smuggling"** or **"The Projection Gap."** Define it as: *A rhetorical dependency where a thought experiment's conclusion is secured not by its stated constraints, but by the audience's unconscious insertion of contentious background assumptions into the scenario's ambiguities.*

  This distinguishes it from a simple hidden premise (which is fixed by the author) and from mere abstraction (which is neutral). It isolates the specific move where the *audience* does the work of the argument without realizing they are doing it.
