prompt: |-
  I'm on the board of a small foundation that has to make one big bet a year: put a large chunk of our reserves into a single high-variance program, or spread it thin across safer ones. Our analyst won't give us point probabilities anymore -- we get ranges, and sometimes the ranges are so wide they seem to swallow the decision. She says that's the honest answer, not a failure, and she wants us to pick whichever option has the best worst-case expected value, computed only after widening every interval to cover our disagreement about which model is right. A second board member says that when the two options' intervals overlap we shouldn't call it a tie but should treat the choice as unsettled by expected value and decide on other grounds. I want the most important implications of actually running the foundation this way, not the philosophy-seminar version: what does taking imprecise probabilities seriously force us to change about how we decide, how we merge several members' different ranges into one, and what we have to stop pretending to know? And of the usual selling points -- handling ambiguity better than a single number, deferring to experts without collapsing them into a point estimate, being more honest about model uncertainty -- which ones actually bite for a decision like ours and which are close to empty? If our intervals are wide, does that give us any real reason to act differently than if we'd just taken the midpoint or flipped a coin?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Scenario:**
      *   **Context:** Small foundation board.
      *   **Decision:** One big bet per year (high-variance program vs. spread thin/safer ones).
      *   **Input:** Analyst provides *ranges* (imprecise probabilities/expectations) instead of point estimates. Ranges are wide.
      *   **Analyst's Stance:** Wide ranges are honest (model uncertainty). Decision rule: Maximize the *worst-case expected value* (Maximin Expected Utility or similar) computed after widening intervals to cover disagreement about models.
      *   **Board Member 2's Stance:** If intervals overlap, EV is unsettled; decide on other grounds.
      *   **User's Goal:** Practical implications, not philosophy. What changes in decision-making, aggregation, and pretense? Which selling points of imprecise probabilities are real vs. empty for this specific case? Does width actually change action compared to midpoints/coin flips?

  2.  **Analyze the Core Concepts:**
      *   **Imprecise Probabilities (IP):** Representing belief as a set of probability distributions (or intervals) rather than a single distribution. Often associated with Knightian Uncertainty or Ambiguity.
      *   **Decision Rules:**
          *   *Analyst:* Maximin (choose the option with the best lower bound). This is extremely conservative.
          *   *Board Member 2:* Indecisiveness/Levi's E-admissibility (if one isn't strictly better, look elsewhere).
          *   *Standard:* Maximize Expected Utility (using midpoints).
      *   **The "Big Bet" Context:** High stakes, low frequency (once a year), high variance. This makes risk aversion and robustness crucial.

  3.  **Address the Specific Questions:**

      *   **Q1: What does taking imprecise probabilities seriously force us to change about how we decide?**
          *   *Shift:* From "What is the *most likely* outcome?" to "What outcome can we *guarantee* not to fall below?"
          *   *Action:* It forces a shift from optimization to robustness. It changes the burden of proof. Instead of "prove this is better," it becomes "prove this won't disaster."
          *   *Aggregation:* You can't just average the board's opinions. You have to take the union of their doubts (widening the interval).
          *   *Pretense:* Stop pretending you know the distribution shape (normal, fat-tailed, etc.).

      *   **Q2: How do we merge several members' different ranges into one?**
          *   *Standard:* Average the points.
          *   *IP Approach:* Convex hull (take the min of the mins and the max of the maxes). This widens the range.
          *   *Implication:* Disagreement *increases* uncertainty, it doesn't cancel out.

      *   **Q3: What do we have to stop pretending to know?**
          *   The "true" probability.
          *   That more data will necessarily narrow the range (if the uncertainty is structural/model-based, not just statistical).
          *   That risk and ambiguity are the same thing.

      *   **Q4: Which selling points actually bite vs. are empty?**
          *   *Bite:* Handling model uncertainty (structural risk), deferring to experts without false precision, forcing explicit risk tolerance discussions.
          *   *Empty:* "More accurate" (it's not more accurate, it's more honest), "Solves disagreement" (it highlights it).

      *   **Q5: If intervals are wide, does that give us reason to act differently than midpoints/coin flips?**
          *   *Yes:* If using Maximin (Analyst's rule), wide intervals punish high-variance options disproportionately. The "safe" option likely has a higher *lower bound* even if the "risky" option has a higher *midpoint*.
          *   *No:* If you just take the midpoint, the width is ignored.
          *   *Coin Flip:* Only appropriate if the intervals overlap significantly *and* you have no preference for robustness. But for a foundation with reserves, ruin is bad. So width matters.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Pragmatic, board-room focused, slightly skeptical but analytical. Avoid academic jargon where possible.
      *   *Structure:*
          1.  **The Bottom Line:** Direct answer to "does it change anything?"
          2.  **Decision Mechanics:** How the rule changes the choice (Maximin vs. Mean).
          3.  **Aggregation:** How to handle board disagreement (Union vs. Average).
          4.  **The "Empty" vs. "Biting" Selling Points:** Audit the claims.
          5.  **The "Wide Interval" Trap:** When width actually dictates action.
          6.  **Recommendation:** A practical path forward.

      *   *Refining the "Analyst's Rule":* The analyst suggests "widening every interval to cover our disagreement about which model is right" and then picking the "best worst-case." This is essentially the **Gamma-Maximin** rule or a robust Bayesian approach.
      *   *Refining Board Member 2:* This sounds like **E-admissibility** or simply acknowledging indeterminacy.
      *   *Key Insight:* For a foundation, *survival* is usually the primary constraint. Wide intervals + Maximin = Extreme conservatism. This might paralyze the foundation.
      *   *Key Insight 2:* Merging ranges by widening (Union) means disagreement *penalizes* the proposal. This incentivizes consensus but might stifle innovation.

  5.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Am I being too academic?
      *   *Fix:* Use terms like "ruin," "reserve depletion," "fiduciary duty."
      *   *Critique:* The user asked about "what we have to stop pretending to know."
      *   *Fix:* Make a specific section on "The Illusions You Must Drop."
      *   *Critique:* The user asked if wide intervals change action vs. midpoints.
      *   *Fix:* Explicitly compare the math. Midpoint ignores variance/ambiguity. Lower bound penalizes it.

  6.  **Final Polish:** Ensure the distinction between *risk* (known odds) and *ambiguity* (unknown odds) is clear but practical. Emphasize that for a "one big bet" scenario, the width *is* the risk profile.

      *(Self-Correction on the Analyst's Rule)*: The analyst says "best worst-case expected value." This is slightly contradictory terminology. Usually, it's "Maximin Expected Utility." I will interpret this as "Look at the lower bound of the expected value range and maximize that."

      *(Self-Correction on Board Member 2)*: "Decide on other grounds." This is crucial. It means EV is no longer the sole arbiter. This opens the door to mission alignment, donor intent, etc.

  7.  **Final Output Structure:**
      *   Executive Summary.
      *   1. The Decision Rule: Optimization vs. Survival.
      *   2. Aggregation: Disagreement as Risk.
      *   3. The Illusions to Drop.
      *   4. Audit of Selling Points (Bite vs. Empty).
      *   5. The Width Question (Midpoint vs. Interval).
      *   Strategic Recommendation.

  8.  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is the practical audit of running your foundation on imprecise probabilities (IP), stripped of the philosophy and focused on fiduciary mechanics.

  ### 1. The Decision Rule: Optimization vs. Survival
  Your analyst is proposing a **Maximin** rule (maximize the minimum gain). Board Member 2 is proposing **E-admissibility** (if neither dominates, choose via non-quantitative criteria).

  *   **The Change:** Under standard expected value (midpoints), you choose the option with the highest average return. Under your analyst's rule, you choose the option with the highest *floor*.
  *   **The Consequence:** This structurally biases you toward the "spread thin/safer" option. High-variance programs usually have higher midpoints but lower floors. If you adopt the analyst's rule, you are effectively declaring that **preservation of reserves is more important than maximization of impact.**
  *   **The Trap:** If you apply Maximin to *both* options, the "safe" option often wins by default because its interval is narrower, not necessarily because its lower bound is higher. You must check if the "risky" program's lower bound is actually catastrophic (e.g., total loss of reserves) or just modestly poor.
  *   **Board Member 2's Point:** This is the more practical governance stance. If the intervals overlap significantly, expected value cannot distinguish the options. Admitting this forces you to vote based on **mission alignment, donor intent, or strategic positioning**, rather than pretending the math made the choice for you.

  ### 2. Aggregation: Disagreement as Risk
  You asked how to merge board members' ranges.
  *   **Standard Practice:** Average the point estimates. (Member A says 5%, Member B says 15% → Use 10%). This treats disagreement as noise that cancels out.
  *   **IP Practice:** Take the **Convex Hull** (Union). (Member A says 5-10%, Member B says 12-15% → Combined range is 5-15%). This treats disagreement as *structural uncertainty*.
  *   **The Implication:** **Disagreement penalizes the proposal.** The more the board disagrees on the model, the wider the interval becomes, and the lower the "worst-case" value drops.
  *   **Operational Shift:** This creates a powerful incentive for the staff/analyst to build consensus *before* the vote. If they bring a proposal where board members hold wildly different models, the decision rule automatically kills it. It forces the analyst to do the political work of aligning mental models, not just crunching numbers.

  ### 3. The Illusions You Must Drop
  Taking this seriously forces you to stop pretending three things:
  1.  **That "More Data" Will Fix It:** If the width comes from model uncertainty (e.g., "We don't know if this intervention scales linearly or hits a saturation point"), gathering more data on the *current* scale won't narrow the range. You have to stop promising stakeholders that "next year we'll know better."
  2.  **That Risk = Ambiguity:** Standard risk management assumes you know the distribution (e.g., a bell curve). IP admits you don't even know the shape. You must stop using Value-at-Risk (VaR) models that assume normal distributions.
  3.  **That Indecision is a Failure:** Board Member 2 is right. If the math yields overlapping intervals, the "correct" decision is that there is no mathematically correct decision. You must stop viewing this as an analyst failure and start viewing it as a **governance trigger** to switch from quantitative to qualitative criteria.

  ### 4. Audit of Selling Points: What Bites vs. What's Empty
  | Selling Point | Verdict | Why? |
  | :--- | :--- | :--- |
  | **"Handling Ambiguity"** | **Bites Hard** | For a "one big bet" foundation, ruin is existential. Standard EV ignores the cost of ruin if the probability is low but non-zero. IP captures the "unknown unknowns" that kill foundations. |
  | **"Deferring to Experts"** | **Mostly Empty** | Experts still have to give numbers. If they give wide ranges, you haven't deferred; you've just captured their uncertainty. It doesn't solve the problem of expert overconfidence unless you penalize them for narrow, wrong ranges. |
  | **"Honesty about Model Uncertainty"** | **Bites** | It prevents the board from anchoring on a false precision (e.g., arguing over 7.2% vs 7.5% return). It forces the conversation to: "Are we comfortable with the floor of this range?" |
  | **"Better Decisions"** | **Empty** | IP doesn't tell you what's *better*; it tells you what's *safer*. If your mission requires high variance to succeed, IP will systematically steer you toward mediocrity. |

  ### 5. Does Width Change Action? (Midpoint vs. Interval)
  **Yes, but only if you change the decision rule.**

  *   **If you use Midpoints:** The width is irrelevant information. A bet with a range of [40%, 60%] looks identical to [49%, 51%] if both have a 50% midpoint. **This is dangerous.** The first bet could bankrupt you; the second is stable.
  *   **If you use Intervals (Maximin):** The width is the primary driver. A wide interval lowers the "worst-case" value.
      *   *Example:*
          *   **Safe Program:** EV Range [3%, 5%]. Worst case: 3%.
          *   **Risky Program:** EV Range [-20%, 30%]. Worst case: -20%.
          *   **Midpoint Decision:** Risky wins (15% > 4%).
          *   **Analyst's Decision:** Safe wins (3% > -20%).
  *   **The Coin Flip:** If intervals overlap (e.g., Safe [3%, 5%] vs. Risky [2%, 8%]), flipping a coin is rational *only if* you are risk-neutral. For a foundation, you are likely **risk-averse regarding capital preservation**. Therefore, width should push you toward the narrower interval when overlaps occur, because the narrower interval represents lower *ambiguity*, which is a cost in itself.

  ### 6. Strategic Recommendation
  Do not adopt the analyst's rule (Maximin) unmodified. It is too conservative for a foundation that needs to make a "big bet" to justify its existence. If you always pick the best worst-case, you will eventually become a endowment that never spends.

  **Adopt this hybrid protocol:**
  1.  **Use the Union Rule for Aggregation:** Merge board ranges by taking the min/min and max/max. Disagreement widens the interval.
  2.  **Set a "Ruin Threshold":** Before looking at expected value, check the lower bound of the interval. If the lower bound threatens the foundation's solvency or minimum viable operation, veto the program regardless of the upside.
  3.  **Use Board Member 2's Rule for Overlaps:** If the intervals overlap and neither breaches the Ruin Threshold, acknowledge that EV is silent. Vote based on **strategic fit** (e.g., "Does this align with our 10-year goal?").
  4.  **Track Calibration:** Require the analyst to track past ranges against actual outcomes. If their ranges are always wide but reality always falls in the middle, they are being too conservative. If reality frequently falls outside their ranges, they are overconfident.

  **Bottom Line:** Taking imprecise probabilities seriously forces you to admit that **uncertainty is a cost.** It will lower the valuation of innovative, high-variance programs. You must decide if your foundation's mandate is to *preserve capital* (use the Analyst's rule) or to *solve hard problems* (ignore the lower bound and accept the risk of ruin). You cannot do both.
