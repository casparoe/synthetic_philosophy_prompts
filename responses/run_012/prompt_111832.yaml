answer: |-
  (1) "Inputs and preconditions"
  You require three inputs: a defined set of regulatory acts (e.g., approve, ban, restrict), a mapping of outcomes to values (jobs lost, health impacts), and a documented set of credible probability distributions derived from expert elicitation. Do not begin without written records of the model classes each expert supports. When an expert refuses to provide a probability, do not impute a value. Treat their refusal as a statement of structural uncertainty: the model class itself is rejected. Record this as a distinct scenario where the parameter space is unbounded or the risk is deemed incalculable. This expands your set of probabilities to include a "model failure" distribution, often implying maximum precaution. Do not average this with quantitative estimates. If the refusal is based on the claim that "all models are wrong," treat this as a call for a non-parametric bound. If they refuse based on lack of data, treat as high variance. Distinguishing these prevents conflating ignorance with risk. Fetch a statistician only when combining expert distributions requires modeling dependencies between parameters that independence assumptions cannot cover, or when raw data requires re-analysis rather than elicitation. If the experts provide raw data rather than elicited judgments, requiring you to fit distributions yourself, stop. This violates the two-hour constraint and introduces analyst bias. Your input must be expert judgments, not raw datasets. If the experts disagree on the data itself rather than the interpretation, you lack the precondition of a stable evidence base; stop and request a data review.

  (2) "The procedure, step by step"
  **Step 1: The Dominance Filter.** Question: Does one act yield better outcomes than all others under every credible probability distribution? Sufficient Answer: Yes. Exit: Recommend the dominant act. Imprecision is irrelevant; no decision rule needed. This saves time on easy cases.
  **Step 2: Characterize Disagreement.** Question: Is the spread due to parameter uncertainty within a model, or structural disagreement about model classes? Sufficient Answer: Documented classification. Exit: If structural, ensure the set of probabilities includes distributions from each competing model class. Do not collapse them into a second-order distribution; maintain the set. Possessing a set of probabilities is not possessing a second-order distribution over them. Do not assign weights to experts unless there is a prior performance record. Weighting collapses the set back into a single expectation, losing the imprecision. Regarding independence: treating two parameters as independent is a substantive assumption that will quietly shrink the answer. Assume dependence unless proven otherwise.
  **Step 3: Select Decision Rule.** Question: What are the stakes and who bears the risk? Sufficient Answer: Classification of case type. Exit: Select rule based on features.
  *   *Irreversible harm (e.g., cancer, extinction):* Apply Maximin. Choose the act with the best worst-case outcome across the set. This grants veto power to extreme distributions but protects against catastrophe.
  *   *Reversible economic loss:* Apply E-admissibility. Choose acts that are optimal for at least one distribution in the set. If multiple acts remain, default to the status quo.
  *   *Disagreement on values:* If experts disagree on utility (how much a cancer counts), do not average. Present the range of recommended acts.
  **Step 4: Generate the Single Number.** Question: What number satisfies legal requirements? Sufficient Answer: A scalar value derived from the chosen rule. Exit: Produce the number with a mandatory footnote.
  If Maximin was used, the number is the conservative bound (e.g., 95th percentile of the worst-case distribution). If E-admissibility was used, it is the central estimate of the supporting distribution.
  **Meaning:** This number is an operational threshold for compliance, not an ontological claim about reality. It does not mean "the risk is X." It means "given our uncertainty and rule, we regulate as if the risk is X." It does not capture the width of the set. Lawyers may treat it as fact; you must record that it is a policy parameter derived from imprecise inputs. Do not allow this number to be used in subsequent cost-benefit analyses as if it were a precise expected value. This distinction prevents the imprecision from being erased in downstream economic modeling. Economists may try to use it as such; block this usage. The number is a tool for signing the document, not a truth claim for the archive.

  (3) "Case one"
  The panel must set a tolerable daily intake (TDI) for a crop-protectant. Cancer-potency estimates span two orders of magnitude. Two of five members believe the dose-response model class is fundamentally wrong.
  **Step 1:** No act dominates. A high TDI risks cancer; a low TDI risks food security.
  **Step 2:** Disagreement is structural. The two dissenters reject the model. We cannot average their view with the quantitative estimates. The set of probabilities must include the three quantitative distributions and a fourth "model failure" distribution. For the latter, we treat the risk as unbounded or assign the highest plausible potency from literature.
  **Step 3:** Stakes involve irreversible harm (cancer). The rule is Maximin. We examine the worst-case outcome for each TDI option. The "model failure" distribution implies that any exposure carries unacceptable risk. Under Maximin, this distribution vetoes any TDI that allows exposure.
  **Step 4:** The single number is set at the limit of detection, effectively banning the substance.
  **Meaning:** This number does not mean the chemical is definitely carcinogenic at low doses. It means that given the structural uncertainty and the precautionary rule, we cannot justify exposure. The three experts who provided numbers may object that this ignores their data. You reply that their data assumes a model the panel does not universally accept. The procedure forces a ban not because the risk is proven, but because the uncertainty is unresolvable within the safety constraint. This is defensible but costly. The spread of two orders of magnitude among the quantifiers is significant, but the structural objection trumps it. The procedure forces you to acknowledge that precision is illusory here. The three quantifiers might argue for a central estimate, but the procedure mandates respecting the set. The ban is not a scientific conclusion but a regulatory consequence of the model disagreement.

  (4) "Case two"
  The panel considers closing a fishery. Stock assessments show a wide interval around the collapse threshold. Closing costs hundreds of jobs; staying open risks stock collapse.
  **Step 1:** Apply the Dominance Filter. We compare "Close" vs. "Open" across the set of probability distributions regarding stock size.
  **Step 2:** The uncertainty is parameter-based (stock size), not structural. All experts accept the assessment model.
  **Step 3:** The risk is reversible (fish stocks can recover), but the economic harm (jobs) is immediate. However, collapse is often treated as irreversible. Assume the rule is Maximin due to collapse risk.
  **Step 4:** Under every distribution in the set, even the most optimistic, the expected utility of staying open exceeds closing, because the probability of collapse is low enough that the certain economic loss of closure outweighs the risk-weighted loss of collapse.
  **Result:** The procedure recommends staying open.
  **The Unlikely Outcome:** This is the answer I will not like. The wide interval suggests we know very little, yet the economic weights are so heavy that even the worst-case probability within the credible set does not trigger closure. The procedure validates inaction despite profound ignorance. The "cheap filter" showed no dominance, but the Maximin rule here fails to protect the stock because the "worst case" within the *credible* set is not actually catastrophic enough to outweigh jobs. We follow the rule, keep the fishery open, and the stock collapses two years later. The procedure was followed, the number was defensible, but the decision was wrong. This reveals that the "credible set" was too narrow, excluding the true state of the world. The procedure protects the analyst, not the fish. The interval around the collapse threshold is wide, indicating high uncertainty. However, the decision rule weighs the outcomes. If the economic loss of closure is valued higher than the probabilistic loss of collapse, the math dictates openness. The failure lies in the input values, not the arithmetic. The procedure exposes that we value jobs over the remote risk of extinction, even when we admit we don't know the risk.

  (5) "Where this procedure fails"
  This procedure cannot settle conflicts where the set of probabilities is too wide to yield a decision even after applying rules. It misfires when the "credible set" excludes the truth, as in the fishery case. A specific failure mode is dilation: acquiring new information can leave your posterior interval wider rather than narrower. If you condition on evidence that is irrelevant to some distributions but relevant to others, the set may expand, making you less decisive after learning than before. You must tell the director that more data does not guarantee less uncertainty.
  Hidden value judgments are concealed in Step 3. Choosing Maximin over E-admissibility is an ethical choice about risk aversion, not a mathematical necessity. The procedure dresses this judgment as method. You cannot give the director a guarantee of correctness. You can only give defensibility. You cannot eliminate the moral responsibility of the decision; you can only document the trade-off between jobs and safety that the rule enforces. If the set is empty or contradictory, you must recommend deferral, not calculation. Some rules make information worthless. If you use Maximin, new evidence that rules out moderate risks but leaves the extreme worst-case intact changes nothing. You paid for data but gained no decision power. This is rational under the rule but frustrating for the director. You must explain that under precaution, only evidence that eliminates the worst-case matters.

  (6) "Bottom line"
  We face uncertainty that cannot be reduced to a single number. This procedure documents that uncertainty rather than hiding it. Step 1 checks if the decision is obvious despite uncertainty. Step 3 applies a rule based on stakes: precaution for irreversible harm, optimization for reversible loss. Step 4 produces the number lawyers require, but labels it a policy threshold, not a fact. This method prevents hiding behind averages. It forces us to admit when we are guessing. It will sometimes recommend costly precautions or risky inaction. That is the cost of honesty. Follow the steps. Record the deviations. Defend the rule, not the outcome.
