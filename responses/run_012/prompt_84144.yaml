prompt: |-
  I edit the behaviour section of an ecology journal that receives a steady stream of papers whose central claim is that some trait is an adaptation for some function. My referees are capable biologists but not evolutionary theorists, they have about an hour per manuscript, and I make the final call, so I need something they can run rather than a lecture on adaptationism. Please turn the spandrels critique — Gould and Lewontin's arguments that current utility is not evidence of past selection, and that a trait may be a byproduct of something else entirely — into a decision procedure for evaluating a claim of the form "trait T is an adaptation for function F." It should run in order: what exactly is being claimed (current function, historical origin, or both); which non-adaptation alternatives are live for this trait (drift, developmental or phylogenetic constraint, byproduct, an exaptation since co-opted to a new role); what evidence would discriminate among them and what the manuscript actually offers; and how much of the remaining disagreement is about research strategy — how heavily to weight selection as a default — rather than about data. Say what counts as a sufficient answer at each step, where the procedure should stop with a verdict of "not supported," and where it must hand the judgment back to me because the question is about what the journal should publish rather than about what is true. It must not let referees escape in either direction: neither treating "it works well" as proof of selection, nor disposing of an inconvenient trait by calling it a spandrel and moving on. Then run it on three claims: the female orgasm as a byproduct of the male orgasm rather than an adaptation, the human chin as a growth byproduct, and a third of your choosing — an adaptationist claim that is widely accepted and that I would prefer to accept, where the procedure nonetheless tells me I cannot. Close by stating what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Editor of the behaviour section of an ecology journal.
      *   **Users:** Referees (capable biologists, not evolutionary theorists, ~1 hour per manuscript).
      *   **Goal:** A decision procedure based on Gould & Lewontin's "Spandrels" critique to evaluate adaptationist claims ("Trait T is an adaptation for Function F").
      *   **Constraints:**
          *   Must be actionable/runnable, not a lecture.
          *   Must follow a specific order: Claim clarification $\rightarrow$ Alternative hypotheses $\rightarrow$ Evidence discrimination $\rightarrow$ Research strategy/weighting.
          *   Must define "sufficient answer" at each step.
          *   Must define stop points for "not supported."
          *   Must identify points where the decision reverts to the Editor (policy vs. truth).
          *   Must prevent two errors: (1) Equating current utility with selection, (2) Dismissing traits as spandrels without evidence.
          *   Must test on three cases: Female orgasm (byproduct), Human chin (byproduct), and a widely accepted adaptation that fails the test (the "trap" case).
          *   Must conclude with limitations of the procedure.

  2.  **Deconstruct the "Spandrels" Critique for a Checklist:**
      *   Gould & Lewontin (1979) argue against the "Panglossian Paradigm."
      *   Key points: Current utility $\neq$ Historical cause. Traits can be byproducts (spandrels), results of drift, or constraints.
      *   To make this a *procedure*, I need to turn these philosophical points into yes/no questions or evidence requirements.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Clarify the Claim.* Is the author saying T *currently* does F, or T *evolved because* it did F? This is crucial. Many papers conflate them.
      *   *Step 2: Alternatives.* If they claim historical adaptation, have they ruled out drift, constraint, and byproduct?
      *   *Step 3: Evidence.* What specific evidence distinguishes adaptation from byproduct? (Comparative method, phylogeny, cost-benefit analysis, genetic variation).
      *   *Step 4: Strategy.* If evidence is ambiguous, is the paper assuming adaptation as a null hypothesis? Is that acceptable for *this* journal?

      *Refining the "Stop/Hand-off" logic:*
      *   If Claim is only about current function $\rightarrow$ Don't reject on evolutionary grounds, but flag language.
      *   If Claim is historical but no alternatives considered $\rightarrow$ "Not Supported."
      *   If Evidence is purely observational/correlational without phylogeny $\rightarrow$ "Not Supported" for historical claims.
      *   If Evidence is strong but the *weighting* of adaptationism is the issue $\rightarrow$ Hand to Editor.

      *Refining the "Trap" Case:*
      *   I need a case that is widely accepted as an adaptation but fails a strict Spandrels-style test *in the context of a single manuscript*.
      *   Idea: Bird migration? Too complex. Camouflage? Often good evidence.
      *   Idea: The vertebrate eye? Too classic.
      *   Idea: *Stotting in gazelles.* Often cited as predator signaling. But is it proven *in a specific paper* without phylogeny?
      *   Better Idea: *The human appendix.* Often thought to be a vestige (spandrel/byproduct), but recent work suggests immune function. Wait, I need an *adaptation* claim that fails the strict test.
      *   Let's go with **Bird Song Complexity for Mate Choice**. It's widely accepted. But a single paper claiming "Song complexity evolved for mate choice" often lacks the phylogenetic control to rule out that it's a byproduct of brain size or body size. This fits the "one hour referee" constraint—they can't verify the whole field, just the manuscript.
      *   Actually, a better "trap" is something where the *manuscript* lacks the comparative data, even if the *fact* is true. The procedure evaluates the *manuscript's support*, not the absolute truth.
      *   Let's choose **The Peacock's Tail**. Widely accepted as sexual selection. But if a paper just says "It attracts peahens, therefore it evolved for that," it fails the Spandrels test (needs phylogeny, cost analysis, etc.).
      *   *Correction:* The prompt asks for "an adaptationist claim that is widely accepted and that I would prefer to accept, where the procedure nonetheless tells me I cannot." This implies the procedure is *stricter* than standard practice.
      *   Let's select **Human Bipedalism**. Widely accepted as adaptation. But proving it *over* exaptation or byproduct of arboreal climbing requires deep fossil record/phylogeny often missing in a standard behavior paper.
      *   *Better selection:* **The Nuptial Gift in Insects**. Widely accepted as adaptation for mating success. But often papers just show correlation.
      *   *Best selection:* **Alarm Calling in Ground Squirrels**. Classic kin selection adaptation. But a single paper showing "callers survive less" doesn't prove *origin* without phylogenetic context or genetic variance data.
      *   *Let's go with a specific physiological/behavioral link:* **The Sweat Gland in Humans**. Adaptation for thermoregulation. Hard to rule out byproduct of hair loss in a single paper.
      *   *Actually, let's stick to Behavior (since it's the behaviour section).* **Migration in Monarch Butterflies**. Adaptation for avoiding cold. But is it a byproduct of physiological constraints?
      *   *Decision:* I will use **Stotting (Pronking) in Gazelles**. It is widely taught as an adaptation (signaling fitness to predators). However, a standard manuscript often lacks the phylogenetic comparative data to rule out that it is a byproduct of high-energy locomotion or a developmental constraint. This highlights the gap between "textbook truth" and "manuscript evidence."

  4.  **Developing the Three Test Cases:**
      *   **Case 1: Female Orgasm.** Claim: Byproduct of male orgasm (developmental homology). Evidence: Embryonic development, lack of consistent ovulation link. Verdict: Procedure supports "Not Adaptation" (or at least, adaptation claim not supported).
      *   **Case 2: Human Chin.** Claim: Growth byproduct (structural constraint). Evidence: Biomechanical models show no advantage, correlates with facial retraction. Verdict: Procedure supports "Not Adaptation."
      *   **Case 3: The Trap.** I need something where the procedure says "Reject/Not Supported" but the Editor wants to accept.
      *   *Idea:* **Foraging Efficiency in a Generalist Bird.** Claim: Beak shape is adaptation for seed cracking. Evidence: Birds with deeper beaks crack better. *Missing:* Phylogeny showing beak depth evolved *with* seed diet, not drift.
      *   *Refinement:* Let's use **The Waggle Dance in Honeybees**. Widely accepted adaptation for communication. But a paper just showing "dance conveys location" doesn't prove *selection* over byproduct of motor patterns without comparative data from non-dancing bees.
      *   *Actually, the prompt asks for a claim "widely accepted... that I would prefer to accept."* This suggests the procedure might be *too* strict for standard ecology journals.
      *   Let's choose **Parental Care in Birds**. Claim: Biparental care is an adaptation for offspring survival. Evidence: Chicks survive better with two parents. *Problem:* Doesn't rule out that it's a phylogenetic constraint (all ancestors did it) or that uniparental care is the derived state. A single paper rarely reconstructs the ancestral state. The procedure will flag this as "Not Supported" historically, even though we all believe it.

  5.  **Refining the Procedure Structure:**
      *   Needs to be a flowchart or numbered list.
      *   Needs clear "Stop" conditions.
      *   Needs to distinguish between "Current Utility" (Physiology/Ecology) and "Historical Origin" (Evolution).
      *   Needs to address the "Default Assumption" (Adaptationism vs. Null).

  6.  **Addressing the Constraints:**
      *   *Referee Time:* Keep questions binary or short-answer.
      *   *No Escape:* Can't just say "It's a spandrel" without evidence. Can't just say "It works" as proof.
      *   *Editor Hand-off:* When the science is inconclusive but the story is useful.

  7.  **Drafting the Content (Mental Outline):**
      *   **Introduction:** Set the stage. This is a filter, not a truth machine.
      *   **The Protocol:** 4 Steps.
          1.  Claim Type (Current vs. Historical).
          2.  Alternative Hypotheses (Drift, Constraint, Byproduct).
          3.  Discriminating Evidence (Phylogeny, Variance, Cost).
          4.  Strategic Weighting (Is adaptation the null?).
      *   **The Test Cases:**
          1.  Female Orgasm (Passes as Byproduct).
          2.  Human Chin (Passes as Byproduct).
          3.  The Trap (e.g., Bird Song or Alarm Calling - fails historical proof in isolation).
      *   **Limitations:** What this tool can't do (prove truth, replace peer review, handle complex multivariate traits).

  8.  **Self-Correction/Polishing:**
      *   *Check:* Did I ensure referees can't just call it a spandrel? Yes, Step 2 requires evidence for the alternative too.
      *   *Check:* Did I ensure "it works" isn't enough? Yes, Step 1/3 distinction.
      *   *Check:* Is the "Trap" case clear? I need to make sure the distinction is between "Textbook Fact" and "Manuscript Evidence." The procedure evaluates the *manuscript*. If the manuscript relies on textbook authority rather than new data, it fails.
      *   *Selection for Trap:* **Alarm Calling in Ground Squirrels**. It is the poster child for kin selection. But a paper claiming "This specific population's calling is an adaptation" needs to show heritability and fitness costs *in that context*, not just cite Sherman (1977). If they just cite Sherman, the procedure flags it as "Historical claim without primary historical evidence."
      *   *Wait, better Trap:* **The Vertebrate Eye**. No, too physiological.
      *   *Let's go with:* **Migration in Birds**. Claim: Migration evolved to track resources. Evidence: Birds move when resources drop. *Missing:* Phylogenetic reconstruction showing migration evolved *because* of resource tracking vs. being forced by glaciation (constraint/history).
      *   *Actually, let's use a classic Behavioural Ecology staple:* **Territoriality**. Claim: Territorial defense is an adaptation for resource access. Evidence: Defenders get more food. *Failure:* Does not rule out that territoriality is a byproduct of aggression selected for mating, or a phylogenetic constraint.
      *   *Okay, I will stick with **Alarm Calling**.* It's specific, behavioral, and widely accepted. The procedure will demand phylogenetic control or heritability estimates which a standard field study might lack.

  9.  **Final Review against Prompt:**
      *   Order: Claim $\rightarrow$ Alternatives $\rightarrow$ Evidence $\rightarrow$ Strategy.
      *   Stop points defined.
      *   Editor hand-off defined.
      *   Three cases run.
      *   Limitations stated.
      *   Tone: Professional, directive, useful for an editor.

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts). *Self-correction during drafting:* Make sure the "Trap" case explanation is nuanced. It's not that the claim is false, but that the *manuscript* doesn't meet the strict Spandrels standard for *historical* proof, forcing the Editor to decide if "plausible adaptation story" is enough for publication.

      *Refining the "Trap":* I'll choose **The Peacock's Tail**. Everyone knows it's sexual selection. But a paper measuring tail length and mating success *this year* hasn't proven historical selection. It proves current utility. The procedure will flag the historical claim as unsupported. This forces the Editor to decide: Do we publish current utility papers that imply history?

      *Wait, the prompt asks for "an adaptationist claim that is widely accepted and that I would prefer to accept, where the procedure nonetheless tells me I cannot."*
      If I choose Peacock, the procedure says "Historical claim not supported." The Editor *wants* to accept it. This fits perfectly. It highlights the tension between rigorous evolutionary proof and standard ecological publication norms.

      *Let's finalize the Procedure Steps.*
      1. Claim Classification.
      2. Alternative Generation.
      3. Evidence Audit.
      4. Burden of Proof (Strategy).

      *Let's finalize the Limitations.*
      Cannot prove history definitively. Cannot judge importance. Cannot replace synthesis.

      *Let's finalize the "Spandrel" safeguard.*
      Explicitly require positive evidence for the byproduct hypothesis, not just absence of adaptation evidence.

      *Ready to write.*
answer: |-
  # The Adaptation Claim Decision Procedure (ACDP)

  **To:** Referees, Behaviour Section
  **From:** The Editor
  **Subject:** Evaluating Claims of Adaptation

  **Purpose:** This procedure is not a lecture on evolutionary theory. It is a filter to ensure that when a manuscript claims "Trait T is an adaptation for Function F," the evidence matches the strength of the claim. It prevents two errors: (1) assuming current utility proves historical selection, and (2) dismissing traits as "spandrels" without evidence.

  **Instructions:** Answer the four steps in order. If you reach a **STOP** condition, recommend "Not Supported" for the evolutionary claim. If you reach the **EDITOR HAND-OFF**, recommend "Accept/Reject" based on journal policy, not biological truth.

  ---

  ### Step 1: Claim Classification
  **Question:** What exactly is the authors' claim?
  *   **A. Current Utility:** "Trait T currently performs Function F and increases fitness."
  *   **B. Historical Origin:** "Trait T *evolved because* it performed Function F (natural/sexual selection)."
  *   **C. Ambiguous:** The text mixes A and B (common).

  **Sufficient Answer:**
  *   If **A**: Proceed to Step 4 (Strategy). Do not reject on evolutionary grounds; this is an ecological/physiological claim.
  *   If **B**: Proceed to Step 2.
  *   If **C**: Ask authors to clarify. If they refuse, treat as **B** (strict mode).

  **STOP Condition:** If the claim is **B** (Historical) but the data provided is *only* observational correlation of T and F in the present day without comparative context, mark "Historical Claim Not Supported." (Do not reject the paper yet; move to Step 4 to see if the journal accepts utility-as-proxy).

  ---

  ### Step 2: Alternative Hypotheses Audit
  **Question:** If the claim is Historical (B), which non-adaptationist alternatives did the authors explicitly test or rule out?
  *   **Drift:** Is the trait fixed due to small population size rather than advantage?
  *   **Constraint:** Is T a necessary physical/developmental consequence of Trait X (which *is* the adaptation)?
  *   **Byproduct (Spandrel):** Is T a non-functional consequence of selection on a correlated trait (e.g., female orgasm as byproduct of male development)?
  *   **Exaptation:** Did T evolve for Function G and only later get co-opted for F?

  **Sufficient Answer:**
  *   The manuscript must acknowledge at least **one** plausible alternative relevant to the trait's biology.
  *   **Crucial:** To claim "It is a Byproduct," the authors must provide positive evidence for the *actual* cause (e.g., developmental linkage), not just say "Adaptation is unproven."

  **STOP Condition:** If the authors claim **B** (Historical Adaptation) but list **zero** alternatives, verdict = **"Not Supported."** (Referee cannot invent alternatives for them; the burden is on the author).

  ---

  ### Step 3: Evidence Discrimination
  **Question:** What evidence distinguishes Adaptation from the Alternatives identified in Step 2?
  *   **Phylogeny:** Does the trait appear concurrently with the selective pressure across related species? (Rules out Constraint/Phylogenetic Inertia).
  *   **Genetic Variance:** Is there heritable variation for T upon which selection could act? (Rules out fixed Constraint).
  *   **Cost/Benefit:** Do the fitness benefits of F outweigh the metabolic/survival costs of T? (Rules out Drift/Byproduct).
  *   **Design Specificity:** Is T complex and specifically suited to F, unlikely to arise by chance? (Rules out Drift).

  **Sufficient Answer:**
  *   For a **Historical Claim**, the manuscript must offer at least **one** line of evidence from the list above.
  *   "It works well" is **not** sufficient evidence for History. It is only evidence for Utility.

  **STOP Condition:** If the claim is **Historical** and the manuscript offers **no** phylogenetic, genetic, or cost-benefit analysis (relying solely on "it works"), verdict = **"Historical Claim Not Supported."**

  ---

  ### Step 4: Research Strategy & Weighting (The Editor Hand-Off)
  **Question:** The data is ambiguous. Is the assumption of adaptation being used as a *heuristic* (a starting point for research) or a *conclusion*?
  *   **Heuristic:** "We assume adaptation to generate testable predictions about F."
  *   **Conclusion:** "We conclude adaptation is the cause."

  **Sufficient Answer:**
  *   If the paper treats adaptation as a **Heuristic** despite weak historical evidence, it may be publishable as a "Hypothesis Generation" paper.
  *   If the paper treats adaptation as a **Conclusion** without Step 3 evidence, it is scientifically premature.

  **EDITOR HAND-OFF:**
  *   If the science is inconclusive (Step 3 failed) but the story is biologically plausible and useful for the field, **return to Editor**.
  *   **Decision:** This is no longer about "What is true?" It is about "Does this journal publish plausible adaptationist stories as working hypotheses, or only proven ones?"
  *   **Referee Role:** State clearly: *"The adaptation claim is not historically proven by this data, but the utility claim is robust. Accept if journal policy allows utility papers to imply adaptation."*

  ---

  # Test Runs

  Here is how the ACDP runs on three specific claims.

  ### Case 1: The Female Orgasm
  *   **Claim:** "The female orgasm is **not** an adaptation for mate choice/ovulation, but a **byproduct** of the male orgasm (developmental homology)."
  *   **Step 1 (Classification):** Historical Origin (claiming specific evolutionary pathway).
  *   **Step 2 (Alternatives):** Authors explicitly name Adaptation (mate choice) vs. Byproduct (male homology).
  *   **Step 3 (Evidence):** Authors cite embryonic development (clitoral/penile homology) and lack of consistent correlation between orgasm frequency and conception rates. They address the "Design Specificity" counter-argument by showing variability inconsistent with strong selection.
  *   **Step 4 (Strategy):** Claim is framed as a conclusion based on developmental constraints.
  *   **Verdict:** **Supported.** The manuscript provides positive evidence for the alternative (developmental linkage) rather than just attacking the adaptationist view. It passes the "No Escape" rule (did not just call it a spandrel; showed *why*).

  ### Case 2: The Human Chin
  *   **Claim:** "The mental eminence (chin) is a **growth byproduct** of facial retraction, not an adaptation for chewing or speech."
  *   **Step 1 (Classification):** Historical Origin.
  *   **Step 2 (Alternatives):** Adaptation (mechanical stress) vs. Byproduct (developmental spacing).
  *   **Step 3 (Evidence):** Biomechanical modeling shows the chin experiences *less* stress than surrounding bone (counters adaptation). Growth series show chin emerges as face shortens during development (supports byproduct).
  *   **Step 4 (Strategy):** Conclusion.
  *   **Verdict:** **Supported.** The authors ruled out the functional utility via stress tests and provided a mechanistic alternative.

  ### Case 3: The Trap — Alarm Calling in Ground Squirrels
  *   **Claim:** "Alarm calling in *Spermophilus* is an **adaptation** for kin selection (warning relatives)."
  *   **Context:** This is a textbook truth. You want to accept it. The manuscript presents field data showing callers are often related to nearby squirrels and callers sometimes incur higher predation risk.
  *   **Step 1 (Classification):** Historical Origin (implies the trait *evolved* for this).
  *   **Step 2 (Alternatives):** The manuscript mentions "Predator Confusion" or "Selfish Herd" but treats Kin Selection as the default. It does not seriously model Drift or Phylogenetic Inertia.
  *   **Step 3 (Evidence):**
      *   *Phylogeny:* **Missing.** The paper studies one population. It does not show that calling evolved *concurrently* with kin-structuring across the genus.
      *   *Genetic Variance:* **Missing.** No heritability estimate for calling propensity.
      *   *Cost/Benefit:* **Partial.** Shows risk, but doesn't quantify inclusive fitness gain over non-callers in a way that rules out drift.
      *   *Result:* The data proves **Current Utility** (relatives benefit), but strictly speaking, it does not prove **Historical Origin** over a byproduct of general sociality.
  *   **Step 4 (Strategy):** The authors treat adaptation as a **Conclusion**.
  *   **ACDP Verdict:** **"Historical Claim Not Supported."**
  *   **Editor Hand-Off:** The procedure forces you to reject the *evolutionary proof*, even though the claim is likely true.
      *   **Your Decision:** Do you reject a paper that confirms a foundational theory because it lacks phylogenetic reconstruction? Or do you accept it as a robust test of *current* kin-selection dynamics, flagging the historical language?
      *   **Why this matters:** The ACDP reveals that standard behavioral ecology papers often rely on "Textbook Authority" rather than manuscript-specific evidence for historical claims. You must decide if your journal requires primary evidence for history, or if established theory counts as evidence.

  ---

  # What This Procedure Cannot Do

  1.  **It Cannot Prove Truth:** Evolutionary history is unobservable. The ACDP evaluates the *strength of the argument in the manuscript*, not the actual history of the trait. A paper can fail the ACDP but still be right (Case 3).
  2.  **It Cannot Weigh Importance:** A paper might fail the adaptation test but offer crucial natural history data. The ACDP only filters the *evolutionary claim*, not the paper's overall value.
  3.  **It Cannot Resolve Complex Multivariate Traits:** If Trait T is 40% adaptation, 40% constraint, and 20% drift, the ACDP forces a binary "Supported/Not Supported" on the primary claim. It does not quantify mixture.
  4.  **It Cannot Replace Synthesis:** A single manuscript rarely contains the phylogenetic, genetic, and ecological data required for a "Supported" verdict on historical claims. This procedure will systematically bias against single-study adaptationist papers. **This is a feature, not a bug.** It forces authors to either temper their claims (Current Utility) or synthesize broader evidence (Phylogeny/Genetics).

  **Final Instruction to Referees:** If you recommend "Not Supported" based on this procedure, you must specify which Step failed. If you recommend "Accept" despite a Step 3 failure, you must explicitly state: *"I am recommending acceptance based on Current Utility, acknowledging the Historical Claim is unproven."* This puts the adaptationist burden on the record, where it belongs.
