answer: |-
  The Interval

  The conference room smelled of dry-erase markers and stale coffee, a scent Elena associated with decisions that would outlast the people making them. She sat at the far end of the oval table, her hands folded over a manila dossier thick enough to bruise a knee. Outside the window, the rain blurred the city into gray smears, matching the mood of the Review Board for Behavioral Classification. Twenty years ago, she had chaired the working group that invented the diagnosis sitting in front of her. Today, she sat on the committee that would decide whether to kill it.

  The diagnosis was Initiatory Dissociation. The file labeled it ID-4. In the early days, inside the working group, they had called it the Gap. They believed the Gap was a specific mechanical failure in the human engine, distinct from sadness, distinct from laziness. They believed that if they drew the map accurately enough, the patient would see the territory and the confusion would vanish. Naming it was meant to cure it.

  Elena opened the dossier to the historical appendix. The first version of the criteria lay on the page, printed in a font that looked sharper than the current standard.

  1. Subject expresses specific intent to act.
  2. No action occurs within forty-eight hours.
  3. Subject reports no loss of desire during interval.
  4. Subject describes barrier as structural rather than emotional.
  5. External obstacles (finance, transport) must be ruled out.

  She ran a finger down the list. In those days, they had been idealists. Criterion four was the key. *Structural rather than emotional.* They wanted to isolate the phenomenon from mood. If you were depressed, you didn't want to act. If you had ID, you wanted to act, but the bridge was out. They assumed that once a patient read criterion four, they would understand the mechanism, accept the limitation, and the anxiety surrounding it would dissolve. The diagnosis would diagnose itself out of existence.

  Elena looked at her reflection in the dark window. She saw the lines around her mouth, the gray creeping into her hair. She remembered writing those words in a cabin in Vermont, feeling the thrill of precision. She had felt the Gap herself then, during the writing. She had wanted to finish the chapter, but her hand had hovered over the keyboard. Reading criterion four had helped. It had named the hover. The hover stopped. She had expected the same for everyone.

  The prevalence numbers in the next section of the dossier told a different story. Instead of vanishing, the diagnosis had spread. It had doubled in the first five years. It had tripled in the second.

  She turned the page to the second revision. Ten years ago, the Board had pressured the working group to make the diagnosis compatible with standard intake procedures. Insurance companies would not reimburse a diagnosis that required a forty-eight-hour observation window or a deep philosophical distinction between structural and emotional barriers. Clinicians needed to know in fifteen minutes.

  1. Subject reports consistent delay between intent and action.
  2. Clinician observes hesitation or abortive starting motions.
  3. Delay causes measurable impairment in occupational function.
  4. Mood remains stable during the observation window.
  5. Symptoms persist for at least one month.

  The changes were subtle, but they were leaks in the hull. Criterion one shifted from *expresses specific intent* to *reports consistent delay*. Self-report was faster than verification. Criterion two brought the clinician into the room. *Observes hesitation.* A patient could perform hesitation. A clinician could see nervous tapping and call it abortive starting. Criterion four dropped the structural requirement. *Mood remains stable.* You could be anxious, just not depressed. The net widened.

  Elena remembered the meeting where that change happened. The actuaries had been present. They spoke about billable units. If a clinician couldn't see it in the window, it didn't exist for the payer. If it didn't exist for the payer, patients couldn't afford the support they needed. So they made it observable. They made it billable. The prevalence rose again, tracking the wording almost exactly. The rise wasn't a mystery; it was a contour map of the criteria themselves.

  The door opened, breaking her concentration. Three people entered, shaking umbrellas. They were the patient representatives, mandated by the new transparency bylaws. They sat on the opposite side of the table. The man in the center, Mark, wore a suit that fit too well. He placed a laptop on the table and opened it with a snap that echoed in the quiet room.

  Elena knew what they wanted. They wanted retention. For many people, ID-4 was not a temporary glitch to be cured by recognition. It was a key to accommodations. It was a language for their experience. To retire the category was to erase the vocabulary they used to navigate their lives. To rewrite it was to risk losing reimbursement. They had built a durable identity around the diagnosis. They were not symptoms; they were stakeholders.

  The chair of the committee, a stern man named Harris, called the meeting to order. He spoke about the Sunset Rule. If a category's measured prevalence drifted beyond a set margin across a revision cycle, it must be rewritten or retired. ID-4 had drifted too far. It was too common. If everyone had it, no one had it.

  Elena listened to the arguments. Mark spoke about the relief of finding the manual. He spoke about the workplace adjustments that allowed him to keep his job. He did not speak about cure. He spoke about management. Elena watched him gesture with his hands, precise movements. He was competent. He was not broken in the way she had imagined twenty years ago. He was adapted.

  Harris turned to Elena. "Dr. Vance, you chaired the original working group. Do you believe the construct remains valid?"

  Elena looked at the dossier. She thought about the clinic scene from five years ago, the last time she had seen a patient before moving entirely to administration. She had been doing intake at a community center, filling in hours for a grant requirement. The patient had been a woman named Sarah, thirty years old, holding a copy of the manual she had printed from the internet.

  Sarah had sat on the exam table, swinging her legs. Elena had asked the standard questions. *Do you feel sadness? Do you feel lack of interest?* Sarah had said no. *Do you want to do the things you plan?* Sarah had said yes. *Why don't you do them?*

  "Because the start is heavy," Sarah had said.

  Elena had nodded, reaching for the checkbox. She had leaned forward. "It sounds like the anxiety is preventing the action."

  Sarah had stopped swinging her legs. "No, Doctor. The criterion says mood remains stable. I'm not anxious about the task. I'm anxious about the failure. There's a difference."

  Elena had paused, pen hovering. "You're correcting my assessment?"

  "I'm correcting the application," Sarah said. "You're trying to make it depression. It's not depression. If you code it as depression, I lose the accommodation for deadline extensions. Depression gets medication. ID gets time. I need time." She had smiled, tight and polite. "Thank you for listening, though. Most people just tell me to try harder."

  Sarah had been technically right. The criteria excluded anxiety about the task itself. The distress had to be secondary. Elena had coded it ID-4. Sarah had kept her job. Elena had left the clinic feeling unsettled, as if she had prescribed a label rather than a treatment.

  Back in the conference room, Elena cleared her throat. "The construct is valid," she said. "The phenomenon exists. The prevalence is the problem."

  Mark leaned forward. "The prevalence is real because the recognition is real. People didn't have this before because they didn't have the words. Now they do. You gave us the words. Don't take them away."

  "If the prevalence exceeds the threshold, the manual loses specificity," Harris said. "It becomes a catch-all. Then it loses reimbursement utility anyway."

  "Then rewrite it," Mark said. "Don't retire it."

  Elena turned to the third revision. This was the current draft, proposed by the subcommittee to address the prevalence spike. They had tried to tighten the net, but they had tightened it around the distress, not the mechanism.

  1. Subject reports distress regarding inability to start tasks.
  2. Task initiation requires external prompting or deadline pressure.
  3. History of unfinished projects despite sustained interest.
  4. Symptoms present for at least six months.
  5. Not better explained by fatigue or sleep disorder.

  She read the lines silently. Criterion one was the trap. *Reports distress.* As long as the patient was unhappy about the delay, they qualified. Since the delay caused impairment, the distress was guaranteed. Criterion two, *external prompting*, was observable in a fifteen-minute window. A clinician could ask, "Do you need a deadline?" The patient could say yes. Criterion three, *unfinished projects*, was universal. Who finished every project they started? The criteria had become a mirror. If you looked into it and worried, you saw yourself.

  Elena felt a tightness in her chest. She looked down at her own hands. She had not filed her taxes yet. The deadline was three weeks away. She wanted to file. She knew how to file. She sat at her desk every evening and opened the forms. She closed them. She told herself she was waiting for the right block of time. She told herself she was tired.

  Last night, in her hotel room, the silence had been loud. The carpet was patterned with abstract shapes that looked like stains. She had sat on the edge of the bed, the dossier open on the nightstand. She had needed to prepare her statement for the vote. She had wanted to write it. She had opened her laptop. She had stared at the blinking cursor.

  She had picked up the dossier instead. She had read the third revision aloud, her voice flat in the empty room.

  "Subject reports distress regarding inability to start tasks," she said.

  She felt the distress. It was a hum in her ribs.

  "Task initiation requires external prompting or deadline pressure."

  The vote was the deadline. The committee was the prompt.

  "History of unfinished projects despite sustained interest."

  The book she was supposed to be writing. The paper she meant to publish. The emails unanswered.

  "Symptoms present for at least six months."

  It had been twenty years.

  "Not better explained by fatigue or sleep disorder."

  She was not tired. She was stuck.

  She had sat there for an hour, answering the criteria. She had not felt cured. She had felt cataloged. The recognition did not release her. It anchored her. It told her that this was not a moment of weakness, but a condition. It gave her a place to stand, but the ground was mud.

  In the conference room, Harris was speaking again. "We need a motion. Retire, Retain, or Revise."

  Mark looked at Elena. "Dr. Vance, if you revise, will you keep the distress criterion?"

  "If we remove distress, we remove the patient's voice," Elena said. "If we keep it, we ensure the prevalence remains high."

  "We need the voice," Mark said. "We need the reimbursement."

  Elena looked at the three versions of the criteria in her mind. The first was a scalpel, too sharp for general use. The second was a tool, shaped by the insurance clock. The third was a net, catching everyone who worried about being caught.

  She thought about Sarah. Sarah needed the code to keep her job. If Elena voted to retire, Sarah lost the accommodation. If Elena voted to retain, the diagnosis became meaningless, and eventually, the insurance companies would drop it anyway. If she voted to revise, she would have to write new words. She would have to draw the map again. She knew how the map changed the territory. She knew that whatever she wrote would become the thing itself.

  There was no villain in the room. Harris wanted accuracy. Mark wanted support. Elena wanted truth. The incentives were drawn correctly. The patients were competent adults. They knew what the diagnosis gave them. They knew what it took away.

  Elena picked up her pen. It was a standard ballpoint, black ink. She uncapped it. The cap made a small click.

  "I move to revise," Elena said.

  "Seconded," Harris said.

  "We need to define the scope of the revision," said a woman from the actuarial side of the table. "Do we aim to reduce prevalence?"

  "We aim to increase specificity," Elena said.

  "Specificity reduces prevalence," the woman said. "That triggers the Sunset Rule again in five years."

  "Then we write for five years," Elena said.

  Mark sighed. He closed his laptop. "As long as the code remains billable, we can live with tighter criteria. But do not remove the distress component. That is the access point."

  Elena nodded. She understood. The distress was the key to the pharmacy and the payroll department. To remove it was to strand the patients. To keep it was to ensure the disease persisted. She had built a machine that fed on its own output.

  She looked at the blank page in her notepad. She needed to draft the new criterion for the interval. The space between wanting and doing. How to describe it without making it a home?

  She wrote: *Subject reports desire to act.*

  She stopped. That was the same as Version One.

  She wrote: *Action fails to occur without external prompt.*

  That was Version Three.

  She looked at the rain on the window. It was still falling. The city was still gray. The work was not done. It never was. The manual would be published. People would read it. They would find themselves in the lines. They would feel relief. They would feel trapped. They would come to the clinic. They would sit in the fifteen-minute window. They would speak. She would listen. She would check the box.

  Harris raised his gavel. "All in favor of revision?"

  Elena raised her hand. Mark raised his. The actuaries raised theirs. The count was unanimous.

  "All opposed?"

  No hands.

  "Motion carries. Dr. Vance, you will chair the drafting subcommittee. Report back in six months."

  Elena lowered her hand. She looked down at her notepad. She drew a line through the sentence she had written. She started a new one. She watched the ink dry on the paper. It took a second. In that second, the ink was wet. In the next, it was fixed.

  She wrote: *The interval is not the symptom.*

  She paused. She knew that was wrong. The interval was exactly the symptom. But if she wrote that, the interval would grow.

  She capped her pen. The meeting was adjourned. People stood up. Chairs scraped against the floor. Mark walked past her and nodded. He looked tired. He looked relieved.

  Elena gathered her papers. She placed them back in the manila dossier. She stood up. Her knees clicked. She walked to the window and looked out at the street. A bus stopped at the corner. People waited to get on. They stood still until the doors opened. Then they moved.

  She turned away from the window. She picked up the dossier. She walked to the door. She did not feel cured. She did not feel defeated. She felt ready to work.

  ***

  **Afterword**

  This story dramatizes three mechanisms of diagnostic classification. First, it shows how criteria changes drive prevalence: shifting from internal insight to observable behavior and finally to reported distress makes a diagnosis easier to claim and harder to outgrow. Second, it illustrates the reimbursement constraint: diagnoses survive only if they fit short clinical intakes and qualify for insurance payment, forcing criteria to prioritize billability over precision. Third, it depicts identity formation: patients adopt diagnostic labels to secure accommodations and community, making the removal of a category feel like erasure rather than cure. The protagonist's struggle reflects the tension between clinical accuracy and the real-world utility of a label.
