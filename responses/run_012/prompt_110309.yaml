  Hume's answer:
  You press me on whether my reasoning depended on the substance of the coin or the proportion of the circulating medium. I spoke of gold as substance I knew, but the principle concerns the relation between money and goods, not the metal itself. If this paper functions as money, then an excess of it must raise prices, just as silver would. You say the money stays where it is, but if this country buys more than it sells, it must issue more paper to pay the difference. That increases the quantity of money in circulation relative to commodities available.

  The correction you seek is not in physical departure of bullion, but in the value of the paper itself. If foreigners hold this paper, they hold a claim on future goods. If the issuance continues for forty years, the confidence in that paper must eventually waver, or the domestic price level must rise to reflect increased quantity. If prices rise, your goods become too dear for foreigners, and the trade turns. If the exchange rate falls, imports become too costly for your people. Either way, the balance restores itself through price adjustments, not through a drain of metal. The error lies in thinking the paper holds value independent of the trust behind it. Wealth is not the paper, but the labor and goods it commands. If the paper multiplies without a rise in industry, it is merely a thicker veil over the same scarcity. You describe a delay, not a permanent suspension.

