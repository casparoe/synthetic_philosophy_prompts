      The correction you seek is not in the physical departure of bullion, but in the value of the paper itself. If foreigners hold this paper, they hold a claim on future goods. If the issuance continues for forty years, the confidence in that paper must eventually waver, or the domestic price level must rise to reflect the increased quantity. If prices rise, your goods become too dear for foreigners, and the trade turns. If the exchange rate falls, imports become too costly for your people. Either way, the balance restores itself through price adjustments, not necessarily through a drain of metal. The error lies in thinking the paper holds value independent of the trust behind it. Wealth is not the paper, but the labor and goods it commands. If the paper multiplies without a rise in industry, it is merely a thicker veil over the same scarcity.

