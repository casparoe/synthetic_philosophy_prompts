      *   *Stage 4: Spider eavesdrops.* Rationale for the *spider's sensory system*. Does the female trait now have a rationale to *avoid* the spider? Only if selection pressures shift.
      *   *The Crux:* Are these one rationale or several? They are distinct selection histories. Merging them risks conflating causes.

  7.  **Falsification & Unfalsifiability:**
      *   *Risk:* High. If every trait *must* have a rationale, it's dogma.
      *   *Prediction:* FFR predicts that if we dig deep enough, we *should* find a selection history for functional traits. If we find a trait that is stable, complex, and "functional" but has *no* selection history (pure drift or physical necessity), FFR must deny it has a function/rationale.
      *   *Rival View:* Causal Role (Cummins). Says "function is just what it does." FFR says "function is what it was selected to do."
