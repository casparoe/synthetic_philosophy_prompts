      *   *Exaptation/Spandrels:* If a trait wasn't selected *for* its current use, does it have a rationale for that use? (Gould & Lewontin).
      *   *Drift:* If a trait fixed by drift, is there a rationale?
      *   *Convergence:* Does the same rationale exist in different substrates, or is the rationale just a human abstraction?
      *   *The "Normativity" Problem:* Functions imply "oughts" (malfunction). Where does the normativity come from if not from a mind?
      *   *Causal Role vs. Selected Effect:* Cummins' causal role account vs. Etiological account.

  4.  **Ranking the Defeaters (Fatal to Awkward):**
      *   *Fatal:* If the "rationale" cannot distinguish between selection and drift/exaptation in principle. If it predicts function where there is none.
      *   *Serious Cost:* If the rationale is multiply realizable to the point of vacuity. If it requires access to unobservable history that is practically inaccessible.
      *   *Awkward:* If the rationale fragments into too many competing narratives (e.g., gene vs. individual vs. group).

  5.  **Addressing Specific Scenarios:**
      *   *Exaptation/Drift:* This is the biggest threat. If a trait exists due to drift but *looks* designed, FFR says "no rationale." If it gets co-opted, when does the new rationale start?
      *   *Convergence:* Supports FFR if the rationale is abstract (solving problem X). Undermines FFR if the mechanism is all that matters.
