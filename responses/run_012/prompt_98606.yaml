  # Joint Statement on the Epistemic Status of the Zombie Argument
  **Date:** October 24, 2023
  **Signatories:** [Anti-Physicalist Name] & [Physicalist Name]

  ### Preamble
  We have debated the Philosophical Zombie argument for approximately two years. Both of us operate within a rationalist framework that prioritizes clarity, Bayesian updating, and the distinction between map and territory. We recognize that our persistence in disagreement suggests either a substantive divergence in our models of reality or a persistent failure to align our terminology. This document serves as a pre-commitment to the specific claims we accept, the specific claims we dispute, and the specific evidence that would cause us to update.

  ### I. Agreed Claims
  *We both sign the following propositions. Neither of us believes the other is being irrational or dishonest in holding their position.*

  1.  **Definition of Physicalism:** Physicalism is the thesis that everything about the world, including mental states, supervenes on the physical. There is no "extra stuff" added to the physical description of the universe.
  2.  **Definition of a Zombie:** A "Philosophical Zombie" (P-Zombie) is defined as a creature physically identical to a human being (atom-for-atom duplicate) but lacking conscious experience (qualia).
  3.  **Conceivability Distinction:** We distinguish between *prima facie* conceivability (seems possible on first glance) and *ideal* conceivability (survives unlimited rational reflection and contains no hidden contradictions). We agree that *prima facie* conceivability does not entail metaphysical possibility.
  4.  **The Explanatory Gap:** We agree there is an epistemic gap. Knowing all physical facts about a brain does not *feel* like knowing all facts about conscious experience. We disagree on whether this epistemic gap implies an ontological gap.
  5.  **Partial Zombies:** We agree that "Partial Zombies" (entities physically identical to humans but lacking specific qualia, e.g., auditory experience, while retaining functional behavior) are a valid conceptual tool for testing the coherence of the main argument.
  6.  **Verbal Dispute Status:** We agree that while some friction arises from differing definitions of "conceivable," the core disagreement **does not** dissolve upon translating our terms. If we both agree to use "ideally conceivable" to mean "logically possible given full information," we still disagree on whether the zombie scenario fits that description.

  ### II. Points of Disagreement
  *The following table summarizes the substantive disagreements. Each statement is worded to be acceptable to the side holding it.*

  | Feature | Anti-Physicalist Position (My View) | Physicalist Position (Buddy's View) |
  | :--- | :--- | :--- |
  | **Modal Status** | The zombie scenario is *ideally conceivable*. Since there is no logical contradiction in the concept, it represents a metaphysically possible world. | The zombie scenario is only *prima facie* conceivable. It appears possible due to cognitive limitations, but contains a hidden contradiction akin to "water that isn't H2O." |
  | **Concept Coherence** | The concept of "consciousness" refers to something distinct from "functional behavior." We can coherently separate them in thought because they are distinct in reality. | The concept of "consciousness" is partially constituted by functional/physical facts. Separating them is a category error, like separating "heat" from "molecular motion" in a world with the same physics. |
  | **Partial Zombies** | Partial zombies are *easier* to conceive than full zombies. If I can imagine lacking auditory qualia while keeping auditory function, it strengthens the case that qualia are non-physical add-ons. | Partial zombies are *incoherent*. If the physical system processes audio exactly as a human does, it *is* hearing. To say it lacks qualia is to misuse the word "hearing." |
  | **Implication** | If zombies are possible, physicalism is false. Consciousness does not logically supervene on the physical. | Even if zombies seem possible, this only shows our concepts are messy. It does not prove dualism; it proves human psychology is bad at tracking necessity. |

  ### III. Cruxes and Pre-Registered Predictions
  *These are the specific sub-questions where a shift in belief would cause one of us to change our overall position. We specify the test case and our predictions before further analysis.*

  #### Crux 1: The Conceivability-Possibility Link
  **Question:** Is there any case where a state of affairs is *ideally conceivable* (no hidden contradiction) but *metaphysically impossible*?
  **Test Case:** The Identity of Water and H2O.
  *   **Anti-Physicalist Prediction:** The Water/H2O case is disanalogous to Mind/Brain. Water identification is a posteriori necessity discovered by science. Consciousness is known by direct acquaintance. If we can conceive of a zombie without contradiction, it is possible.
  *   **Physicalist Prediction:** The Water/H2O case is analogous. The "feeling" of contingency in both cases is an artifact of how our concepts pick out referents. If physicalism is true, Mind/Brain identity is necessary, and the zombie is impossible, even if we can't see the contradiction yet.
  *   **Update Condition:** If the Anti-Physicalist accepts a case of ideal conceivability failing to yield possibility, they abandon the Zombie Argument. If the Physicalist accepts that ideal conceivability *always* yields possibility, they abandon Physicalism.

  #### Crux 2: The Coherence of Partial Zombies
  **Question:** Can we specify a functional role for a sensory modality (e.g., hearing) without specifying the associated qualia?
  **Test Case:** A detailed functional specification of an auditory system that explicitly excludes "what it is like" to hear.
  *   **Anti-Physicalist Prediction:** We can successfully specify the input/output and internal processing of "hearing" without referencing subjective experience. The intuition that something is missing (the qualia) will remain robust even under rigorous functional description. This makes the argument *stronger* because the gap is localized.
  *   **Physicalist Prediction:** Upon rigorous specification, the description will either implicitly rely on phenomenal concepts (smuggling qualia back in) or the intuition that "something is missing" will vanish. The claim "it behaves exactly like it hears but doesn't hear" will be revealed as semantically unstable.
  *   **Update Condition:** If the Anti-Physicalist agrees that a coherent functional specification *entails* the qualia, they move toward Physicalism. If the Physicalist agrees that the functional specification leaves the qualia logically contingent, they move toward Dualism.

  #### Crux 3: The Verbal Dispute Limit
  **Question:** Does fixing the definition of "conceivable" resolve the disagreement?
  **Test Case:** We both agree to define "Conceivable" as "Not ruled out by a priori reasoning given full cognitive capacity."
  *   **Anti-Physicalist Prediction:** The disagreement survives. I still claim the scenario is not ruled out a priori; you still claim it is (but we can't see the proof yet). This confirms the dispute is about the structure of reality, not language.
  *   **Physicalist Prediction:** The disagreement survives, but the locus shifts. It becomes a dispute about whether "consciousness" is a rigid designator. If we agree it is, the zombie is impossible. If we agree it isn't, the zombie is possible but irrelevant to physicalism.
  *   **Update Condition:** If we find a translation where both of us agree on all propositions but still feel we disagree, we declare it a verbal dispute and dissolve the conflict. If we find a proposition one of us affirms and the other denies even after translation, the dispute is substantive.

  ### IV. Resolution Conditions
  *We reject the notion that this debate must remain permanently unresolved. We commit to the following conditions for settling the matter:*

  1.  **For the Anti-Physicalist to concede:** We must identify a specific logical contradiction in the zombie description that is analogous to the contradiction in "married bachelor," or demonstrate that conceivability is an unreliable guide to possibility in domains of direct acquaintance.
  2.  **For the Physicalist to concede:** We must demonstrate a coherent possible world description where the physical facts are held constant and the phenomenal facts vary, without relying on ambiguity in the terms "physical" or "conscious."
  3.  **No Retreat to Mystery:** Neither side is permitted to retreat to "brute fact" status to protect their view. If Physicalism is true, the link must be necessary. If Dualism is true, the interaction must be explicable.

  **Status:** Open. We will revisit this document after analyzing the "Partial Zombie" functional specification test.
