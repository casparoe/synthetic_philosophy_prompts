  # Drug Policy Decision Tree: Claims & Principles

  **Instructions:** Follow the path that matches your philosophical claims. Answer **Yes/No** or select the option that best reflects your reasoning. Do not look at the outcomes (leaves) before answering.

  ### **NODE 1: STATE AUTHORITY**
  **May the state coerce a competent adult who harms only himself?**
  *   **NO:** (The state lacks authority over self-regarding conduct.) → *Go to Node 2A*
  *   **YES:** (The state has a duty to prevent harm/moral wrongs.) → *Go to Node 2B*

  ---

  ### **BRANCH A (No State Coercion)**

  #### **NODE 2A: LOCATION OF HARM**
  **Is the objectionable thing, if there is one, the act of use or the market that supplies it?**
  *   **USE:** → **DIAGNOSIS: INCOHERENT.**
      *   *Reasoning:* You cannot claim the state may not coerce self-harm while simultaneously claiming the act of use is objectionable enough to regulate. This position contradicts itself.
  *   **MARKET:** (The supply chain creates external harms.) → *Go to Node 3A*

  #### **NODE 3A: SCOPE OF REGULATION**
  **Should possession, sale, and production be settled as one question or as three?**
  *   **ONE:** (All activities stand or fall together.) → **LEAF 1: Taxed, Licensed Commercial Market**
      *   *Logic:* Private entities may produce and sell; adults may possess. All treated under uniform commercial law.
  *   **THREE:** (Supply and possession are distinct issues.) → **LEAF 2: Sale Through a State Monopoly**
      *   *Logic:* Possession is free (see Node 1), but production/sale is restricted to the state to control market harms.

  ---

  ### **BRANCH B (Yes State Coercion)**

  #### **NODE 2B: LOCATION OF HARM**
  **Is the objectionable thing, if there is one, the act of use or the market that supplies it?**
  *   **MARKET:** → **LEAF 3: Prescription or Medical Access**
      *   *Logic:* The state restricts the market (supply) to medical channels. Use is permitted only when authorized, distinguishing it from general prohibition.
  *   **USE:** (The act of consumption is the primary wrong.) → *Go to Node 3B*

  #### **NODE 3B: UTILITARIAN CONSIDERATION**
  **Do enforcement costs count among a policy's merits?**
  *   **NO:** (Justice must be done regardless of expense.) → **LEAF 4: Criminal Prohibition of Possession**
      *   *Logic:* Possession is criminalized and enforced strictly. High costs of incarceration/policing are irrelevant compared to moral duty.
  *   **YES:** (Resources and consequences matter.) → *Go to Node 4B*

  #### **NODE 4B: LEGITIMACY OF COMPLIANCE**
  **Whether a widely disobeyed rule is still a rule?**
  *   **YES:** (Authority remains valid despite non-compliance.) → **LEAF 5: Prohibition with Diversion to Treatment**
      *   *Logic:* Possession remains a crime (upholding the rule), but offenders are diverted to treatment to reduce social costs (acknowledging Node 3B).
  *   **NO:** (Widespread disobedience undermines legitimacy.) → *Go to Node 5B*

  #### **NODE 5B: SCOPE OF REGULATION**
  **Whether possession, sale, and production should be settled as one question or as three?**
  *   **ONE:** (Possession and sale share the same legal status.) → **LEAF 6: Depenalization**
      *   *Logic:* Possession remains an offence (consistent with Node 2B) but carries no custodial penalty. Sale remains criminal. Uniform non-custodial approach.
  *   **THREE:** (Possession requires a distinct legal mechanism from sale.) → **LEAF 7: Administrative Dissuasion Panel**
      *   *Logic:* Sale remains criminal (Node 2B), but possession is removed from the court system entirely and handled by a civil/administrative body to reflect the loss of rule legitimacy (Node 4B).

  ---

  ### **DEBATER'S DIAGNOSTIC NOTES**

  **1. Unexplored/Unattractive Combinations**
  *   **Path:** Node 1 (YES) → Node 2B (USE) → Node 3B (NO) → Node 4B (NO).
  *   **Diagnosis:** **INCOHERENT.**
  *   **Reasoning:** This path claims the state *must* coerce users (Node 1), but that enforcement *costs* do not matter (Node 3B), while simultaneously admitting the rule is *not valid* because it is disobeyed (Node 4B). Defending a costly enforcement regime for a rule you admit lacks legitimacy is intellectually unsustainable.

  **2. Indistinguishable Leaves**
  *   **Leaves:** **Depenalization** (Leaf 6) and **Administrative Dissuasion Panel** (Leaf 7).
  *   **Flag:** **CONCEPTUALLY OVERLAPPING.**
  *   **Reasoning:** While the tree separates these via "Scope" (One vs. Three), in practice, both result in non-custodial outcomes for possession driven by pragmatism. A debater arguing for one could likely accept the other without changing their core philosophical claims regarding Node 1 through 4B. The distinction relies heavily on procedural mechanics rather than foundational principle.

  **3. Usage Guide**
  *   **Prohibitionists** typically answer **YES** at Node 1 and Node 4B.
  *   **Libertarians** typically answer **NO** at Node 1.
  *   **Harm Reductionists** typically answer **YES** at Node 1, but **YES** at Node 3B and **NO** at Node 4B.
  *   **Medical Model Advocates** branch off early at Node 2B (Market).
