  # Field Examination: Decision Theory
  ## Social Learning and Information Aggregation

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Instructions:** Answer the following question. This is a closed-book examination. Do not cite outside literature. Define all terms used. Show all derivations explicitly.

  **Scenario:** Three risk-neutral agents A, B, and C act sequentially. The state is $\theta \in \{0,1\}$ and is equally likely ($P(\theta=1)=1/2$). Each agent chooses adopt ($1$) or reject ($0$). The payoff is $1$ if the action matches $\theta$ and $0$ otherwise, minus any information-acquisition cost. Before acting, an agent may purchase a private signal $s \in \{0,1\}$ at cost $c > 0$. The signal is correct with probability $p \in (1/2, 1)$. The purchase decision and the signal are private, but the action is public. A moves first, B moves second, and C moves third. An agent who does not purchase a signal acts on the prior and the observed history. Agents cannot commit to a strategy before knowing their signal. Assume that if an agent is indifferent between actions, they Adopt ($1$).

  **Question:**

  (i) **Equilibrium Derivation (10 Marks):**
  Derive the Perfect Bayesian Equilibrium (PBE) strategies for agents A, B, and C. Specifically, determine the conditions under which each agent purchases a signal and how they map information to actions. Use the parameters $p = 2/3$ and $c = 1/50$.
  *(Note: The cost $c$ has been adjusted from $1/20$ to $1/50$ to ensure the social value of information exceeds the acquisition cost for this group size, facilitating the welfare analysis in Part (iii).)*

  (ii) **Herd, Cascade, and Inference (7 Marks):**
  Based on your derivation in (i), identify whether the equilibrium involves a herd, a cascade, or both. Explicitly define the difference between these two concepts in the context of this game. Furthermore, explain why Agent B can rationally ignore their own private signal despite knowing that Agent A's action was based on a purchased signal.

  (iii) **Welfare and Externalities (8 Marks):**
  Calculate the ex-ante expected total welfare (sum of payoffs) for the equilibrium derived in (i). Compare this to a social planner who can force Agent B to purchase a signal (Agent A and C still optimize). State whether the equilibrium exhibits a negative informational externality. Finally, discuss the fragility of the herd: if a public signal of precision $q > 1/2$ is released after A acts but before B acts, under what condition does the cascade break?

  ***

  # Model Answer

  **(i) Equilibrium Derivation**

  We solve by backward induction, analyzing the value of information (VOI) for each agent.

  **Agent A:**
  A has no history. Without a signal, A's posterior is $1/2$. By the tie-breaking rule, A Adopts ($1$). Expected payoff is $1/2$.
  If A buys a signal ($c=1/50$), A follows $s_A$. Expected payoff is $p = 2/3$.
  $\text{VOI}_A = 2/3 - 1/2 = 1/6 \approx 0.167$.
  Since $\text{VOI}_A > c$ ($0.167 > 0.02$), **A purchases the signal** and sets $a_A = s_A$.

  **Agent B:**
  B observes $a_A$. Since A always buys in equilibrium, $a_A$ perfectly reveals $s_A$.
  If $a_A = 1$, B's posterior is $\mu_B = P(\theta=1 | s_A=1) = 2/3$.
  Without buying, B Adopts. Payoff $= 2/3$.
  If B buys, B observes $s_B$.
  - If $s_B = 1$: Posterior becomes $\frac{(2/3)(2/3)}{(2/3)(2/3) + (1/3)(1/3)} = 4/5$. Action 1. Payoff $4/5$.
  - If $s_B = 0$: Posterior becomes $\frac{(2/3)(1/3)}{(2/3)(1/3) + (1/3)(2/3)} = 1/2$. Action 1 (tie-break). Payoff $1/2$.
  Probability of $s_B=1$ is $P(s_B=1|\theta=1)\mu_B + P(s_B=1|\theta=0)(1-\mu_B) = (2/3)(2/3) + (1/3)(1/3) = 5/9$.
  Expected payoff with signal $= (5/9)(4/5) + (4/9)(1/2) = 4/9 + 2/9 = 6/9 = 2/3$.
  $\text{VOI}_B = 2/3 - 2/3 = 0$.
  Since $\text{VOI}_B < c$, **B does not purchase** and copies $a_A$. By symmetry, if $a_A=0$, B Rejects without buying.

  **Agent C:**
  C observes $a_A, a_B$. Since B copies A, $a_B$ adds no new information. C faces the same posterior as B ($2/3$ or $1/3$).
  **C does not purchase** and copies $a_A$.

  **Equilibrium:** A buys and follows signal. B and C do not buy and copy A.

  **(ii) Herd, Cascade, and Inference**

  **Definitions:** A **herd** occurs when agents take the same action regardless of their private information. A **cascade** occurs when agents take the same action *and* rationally choose to ignore their private information (i.e., they do not acquire or utilize it).
  **Classification:** This equilibrium exhibits **both**. Agents B and C herd on A. Because they optimally choose not to purchase signals, they are in an **informational cascade**.

  **Inference:** B knows A purchased a signal. However, B treats $a_A$ as a public signal with precision $p=2/3$. B's own private signal also has precision $p=2/3$. When B's posterior is $2/3$ (from A), a conflicting private signal ($s_B=0$) moves the posterior to exactly $1/2$. Given the tie-breaking rule (Adopt at $1/2$), B's action does not change even if they buy the signal. Thus, the marginal value of B's private information is zero. B rationally ignores their own signal not because they doubt A's source, but because A's action is sufficiently informative to render B's marginal contribution to their *own* decision null.

  **(iii) Welfare and Externalities**

  **Equilibrium Welfare ($W_{eq}$):**
  A is correct w.p. $2/3$. B and C copy A, so they are correct w.p. $2/3$.
  Total Payoff $= 3 \times (2/3) - c_A = 2 - 0.02 = 1.98$.

  **Planner Welfare ($W_{pl}$):**
  Planner forces B to buy. A buys. C optimizes.
  1.  **Signals Agree ($s_A = s_B$):** Prob $= p^2 + (1-p)^2 = 5/9$.
      C sees agreement. Posterior $4/5$. C does not buy. C copies.
      Payoff $= 2/3 (A) + 2/3 (B) + 4/5 (C) - 2c = 2.067 - 0.04$.
  2.  **Signals Disagree ($s_A \neq s_B$):** Prob $= 2p(1-p) = 4/9$.
      C sees conflict. Posterior $1/2$. C buys (VOI > 0). C follows $s_C$.
      Payoff $= 2/3 (A) + 2/3 (B) + 2/3 (C) - 3c = 2 - 0.06$.
  $W_{pl} = \frac{5}{9}(2.027) + \frac{4}{9}(1.94) \approx 1.126 + 0.862 = 1.988$.

  **Comparison:** $W_{pl} (1.988) > W_{eq} (1.98)$.
  **Externality:** Yes, there is a **negative informational externality**. Agent B ignores the benefit their signal would provide to Agent C. B considers only their own VOI (which is 0), ignoring that if $s_B \neq s_A$, C would purchase a signal and improve aggregate accuracy.

  **Fragility:**
  If a public signal $s_{pub}$ with precision $q$ arrives after A ($a_A=1$):
  B's posterior becomes $\mu' = P(\theta=1 | a_A=1, s_{pub})$.
  If $s_{pub}=0$, $\mu' = \frac{(2/3)(1-q)}{(2/3)(1-q) + (1/3)q}$.
  The cascade breaks if $\mu' < 1/2$ (B Rejects) or if $\mu'$ is close enough to $1/2$ that B's private signal becomes valuable (VOI $> c$).
  Specifically, if $\mu'$ drops to $1/2$ (which requires $q=2/3$), B becomes indifferent without a signal, making the VOI of a private signal positive. Thus, if $q \ge 2/3$, the cascade is fragile and B will purchase a signal.

  ***

  # Marking Scheme

  **Total Marks: 25**

  **Part (i): Equilibrium Derivation (10 Marks)**
  *   **A's Decision (3 marks):**
      *   1 mark: Correct calculation of A's VOI ($1/6$).
      *   1 mark: Comparison with $c$ ($1/6 > 1/50$).
      *   1 mark: Conclusion that A buys and $a_A = s_A$.
  *   **B's Decision (4 marks):**
      *   1 mark: Correct posterior after $a_A=1$ ($2/3$).
      *   1 mark: Correct calculation of posterior after conflicting signal $s_B=0$ ($1/2$).
      *   1 mark: Demonstration that B's action does not change if signal is bought (VOI = 0).
      *   1 mark: Conclusion that B does not buy.
  *   **C's Decision (3 marks):**
      *   1 mark: Recognition that $a_B$ adds no info ($a_B=a_A$).
      *   1 mark: Application of same logic as B.
      *   1 mark: Conclusion that C does not buy.

  *   *Common Error:* Assuming B buys because signals are valuable in isolation, ignoring that the action remains unchanged at the posterior $1/2$ due to the tie-breaking rule.

  **Part (ii): Herd, Cascade, and Inference (7 Marks)**
  *   **Definitions (3 marks):**
      *   1 mark: Herd defined as matching actions.
      *   1 mark: Cascade defined as ignoring private info/not buying.
      *   1 mark: Correct identification that this game has both.
  *   **Inference Explanation (4 marks):**
      *   2 marks: Explanation that B treats $a_A$ as a signal of precision $p$.
      *   2 marks: Explanation that B ignores own signal because it cannot overturn the decision given the tie-break (marginal value is zero).

  *   *Common Error:* Conflating herd and cascade (e.g., claiming a herd exists without a cascade) or claiming B ignores A's signal quality.

  **Part (iii): Welfare and Externalities (8 Marks)**
  *   **Welfare Calculation (4 marks):**
      *   2 marks: Correct $W_{eq}$ calculation ($2 - c$).
      *   2 marks: Correct $W_{pl}$ setup (weighted average of agree/disagree cases).
  *   **Externality & Fragility (4 marks):**
      *   2 marks: Identification of negative externality (B ignores C's benefit).
      *   2 marks: Fragility condition ($q \ge 2/3$ shifts posterior enough to restore VOI).

  *   *Common Error:* Ignoring the cost $c$ in the welfare comparison or claiming the cascade is robust to any public signal.

  **Note on Parameters:** Students using $c=1/20$ without adjustment may find $W_{eq} > W_{pl}$. Full marks are awarded for consistent derivation, provided they correctly identify the *existence* of the externality (B ignoring C) even if the net welfare outcome favors the cascade due to high costs. However, the adjustment to $1/50$ is preferred for clarity.
