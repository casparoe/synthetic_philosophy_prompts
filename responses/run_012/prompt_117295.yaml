prompt: |-
  I run a small macro research shop. Nine analysts publish probability estimates on discrete, resolvable questions — whether the central bank cuts at the next meeting, whether a merger clears, whether an incumbent holds a seat — and we size positions directly off those numbers. Every Thursday we hold a reconciliation meeting. Any question on which two analysts' numbers differ by more than ten points gets twenty minutes, and at the end of it I sign off on one house number.

  A junior analyst has been pushing a rule he can state in two sentences: if two of us disagree and each of us knows the other's number, then under a common prior at least one of us must be wrong, so the fix is always to pull the two numbers toward each other — in practice, average them and move on. He is right often enough to be dangerous, and those two sentences are doing work the underlying result does not license.

  Write me the procedure I should run in that meeting. I want it as a sequence of questions to ask about a given disagreement, in order, with a statement of what counts as a sufficient answer to each, a clear statement of where the sequence terminates in a single house number and how that number is computed, a clear statement of where it terminates without one, and a note on which steps are judgment calls that I should sign my name to rather than pretend are mechanical. I suspect the useful form of the thing is a diagnostic — a question whose answer tells me which precondition of the result has failed — rather than a pooling formula, but you should tell me whether that is the right shape. Whatever survives the simplification must preserve the distinctions the result actually needs: whether the two analysts are answering the same question over the same state space, whether each merely knows the other's number or the disagreement is common knowledge between them, whether their priors are common or merely similar, whether the stated number is the analyst's actual belief, and whether a persistent disagreement is evidence about the world or evidence about the analysts. Keep the meeting inside twenty minutes, and assume the analysts cannot show each other everything: some inputs are licensed and cannot be shared.

  Then run the procedure on three disagreements and say what it outputs in each. First, two analysts working from the same model with different licensed data, at 0.70 and 0.45 on a rate cut, both numbers now on the table. Second, two analysts whose difference survives every test you impose and traces to a prior about how fast a regime reverts — a difference that no data we can buy will settle. Third, one analyst who proposes to settle it with a bet at even odds; I want to know whether that is a clean way to extract the other's information or a trap. For the second and third cases I expect the honest answer to be one I do not like, and I would rather have it than a number.

  Finally, tell me what the procedure cannot do. In particular: can it protect me from the case where every analyst in the room shares the same wrong prior, and should agreement among my analysts ever be treated as evidence that we are right?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small macro research shop, 9 analysts, probability estimates on discrete events.
      *   **Process:** Weekly reconciliation meeting. Disagreements > 10 points get 20 minutes. Boss (user) signs off on a house number.
      *   **The Problem:** A junior analyst is pushing a simplified version of Aumann's Agreement Theorem ("if we disagree and know each other's numbers, average them"). The user knows this is "dangerous" because the underlying theorem's preconditions rarely hold in practice.
      *   **The Task:**
          1.  Write a procedure (sequence of questions) for the meeting.
          2.  Define sufficient answers, termination conditions (with/without a number), and judgment calls.
          3.  Determine if the form should be a diagnostic (checking preconditions) vs. a pooling formula.
          4.  Preserve key distinctions (same question/state space, common knowledge vs. knowing numbers, common priors vs. similar, truthful reporting, evidence about world vs. analysts).
          5.  Keep it under 20 minutes.
          6.  Respect information licensing constraints (cannot share everything).
          7.  Run the procedure on three specific cases.
          8.  Explain limitations (specifically regarding shared wrong priors and agreement as evidence).

  2.  **Analyze the "Junior Analyst's Rule" (Aumann's Agreement Theorem):**

      *   *Theorem:* If two agents have common priors, update via Bayes' rule, and their posterior probabilities are *common knowledge*, they cannot agree to disagree.
      *   *Junior's Simplification:* "We disagree + we know numbers -> Average them."
      *   *Why it's dangerous:*
          *   Priors are rarely common (especially in macro).
          *   "Knowing the number" $\neq$ "Common Knowledge of the number" (I know yours, you know mine, but do I know that you know that I know...?).
          *   "Knowing the number" $\neq$ "Knowing the *information* behind the number." Aumann assumes rational Bayesian updating on partitions of information. If I hide my data (licensing), you can't update on *why* I have that number, only *that* I have it.
          *   Questions might not be identical (semantic ambiguity).
          *   Incentives might not be truthful (strategic misreporting).
      *   *Conclusion:* The user is right. The procedure must be a *diagnostic* to check if Aumann's conditions hold. If they don't, averaging is mathematically unjustified and potentially value-destroying (smoothing over genuine insight).

  3.  **Drafting the Procedure (The Diagnostic):**

      *   *Goal:* Determine if the disagreement is "noise" (error/process) or "signal" (structural difference).
      *   *Constraint:* 20 minutes. Needs to be punchy.
      *   *Structure:* Sequential filters. If a filter fails, we stop averaging and move to judgment or no-decision.
      *   *Key Filters (based on Aumann preconditions + practical reality):*
          1.  **Semantic Alignment:** Are we betting on the exact same resolution criteria? (State Space)
          2.  **Information Symmetry (Licensed):** Can we share the *source* of the delta, even if not the raw data? (Partitions)
          3.  **Prior Alignment:** Do we disagree on the *data* or the *model of the world*? (Common Priors)
          4.  **Conviction/Truthfulness:** Is the number a true belief or a strategic position? (Honesty)
      *   *Termination:*
          *   If all pass -> Averaging (or weighted) is permissible.
          *   If any fail -> Boss decides (Judgment) or No House View (Abstain).
      *   *Judgment Calls:* The Boss must sign off on whether the explanations are sufficient, not just the math.

  4.  **Refining the Steps (Iterative Process):**

      *   *Step 1: Resolution Criteria.* (Are we answering the same question?)
      *   *Step 2: Information Disclosure.* (Can you tell me *why* without violating licensing?)
      *   *Step 3: Prior/Model Check.* (Is this a data fight or a philosophy fight?)
      *   *Step 4: The Bet Test.* (Would you bet at the implied odds?)
      *   *Decision Rule:* If 1-3 pass, average. If 4 is invoked, use the bet to settle. If 1-3 fail, Boss picks or no view.
      *   *Wait, the prompt asks for a specific shape:* "Sequence of questions... sufficient answer... where it terminates."
      *   *Correction:* The "Bet Test" is one of the test cases. I should incorporate the *logic* of the bet into the procedure but keep the procedure general.
      *   *Revised Steps:*
          1.  Definition (Semantics).
          2.  Information (Licensing/Data).
          3.  Model (Priors).
          4.  Commitment (Truthfulness).

  5.  **Addressing the Three Test Cases:**

      *   *Case 1 (Same Model, Different Licensed Data):* 0.70 vs 0.45.
          *   Step 1 (Definition): Pass.
          *   Step 2 (Info): They can describe the *type* of data (e.g., "proprietary flow data" vs "public survey") without sharing raw ticks.
          *   Step 3 (Model): Pass (Same model).
          *   Step 4 (Commitment): Both stand firm.
          *   *Outcome:* This is a candidate for averaging *only if* the data is equally reliable. But since data is licensed and hidden, we can't verify quality. Actually, Aumann requires knowing the *partition*. If they can't share the data, they can't fully update. However, in practice, if the model is the same, the discrepancy implies one dataset is noise or both are partial.
          *   *Better Outcome:* The procedure should flag this as "Information Asymmetry." Averaging is a heuristic here, not a theorem result. The Boss needs to weigh data quality.
      *   *Case 2 (Prior/Model Difference):* Regime reversion speed.
          *   Step 1: Pass.
          *   Step 2: Pass (Data is shared/agreed).
          *   Step 3: Fail. This is a structural prior difference. No amount of data settles it quickly.
          *   *Outcome:* Terminate without a number. Boss signs "No View" or picks a side based on strategy, not math. The prompt says "I expect the honest answer to be one I do not like." The honest answer is: We don't know, and averaging lies about our certainty.
      *   *Case 3 (The Bet):* One offers even odds.
          *   *Analysis:* Is this information extraction or a trap?
          *   If Analyst A offers a bet to Analyst B at odds implied by their probabilities, it tests conviction.
          *   However, if risk limits or career concerns exist, a bet might not reveal true belief.
          *   Also, if priors differ, a bet is just a speculation, not a reconciliation.
          *   *Outcome:* The procedure should treat a bet offer as a "Commitment Test." If the other side refuses, their number is soft. If they accept, we have a market price, not a research view.
          *   *Prompt requirement:* "I want to know whether that is a clean way to extract the other's information or a trap."
          *   *Verdict:* It's a trap if the offeror has private info the offeree can't verify (adverse selection). It's clean only if information symmetry is established first.

  6.  **Addressing Limitations (The "What it cannot do" section):**

      *   *Shared Wrong Prior:* No. If everyone shares a wrong model (e.g., "inflation is transitory" in 2021), the procedure validates the consensus. It protects against internal inconsistency, not external truth.
      *   *Agreement as Evidence:* No. Agreement only proves consistency among the group, not accuracy against the world. It can signal groupthink.

  7.  **Finalizing the Procedure Structure:**

      *   Needs to be crisp.
      *   Needs to explicitly identify "Judgment Calls" for the Boss.
      *   Needs to handle the 20-minute limit.
      *   Needs to explicitly reject the Junior's "Always Average" rule.

  8.  **Drafting the Content (Mental Check against constraints):**

      *   *Constraint:* "Keep the meeting inside twenty minutes." -> The questions must be rapid fire.
      *   *Constraint:* "Assume analysts cannot show each other everything." -> Step 2 must account for "describing the gap" rather than "showing the data."
      *   *Constraint:* "Preserve distinctions... common knowledge... priors... truthful belief." -> These map to specific steps.
      *   *Constraint:* "Tell me whether that [diagnostic] is the right shape." -> Yes, confirm this early.

  9.  **Refining the Test Cases:**

      *   *Case 1:* Same model, different data. Procedure should output: "Weighted Average" (Boss decides weights based on data reliability description) OR "Average" if data quality is deemed equal. Let's go with "Boss assigns weights" because hidden data prevents true Bayesian updating.
      *   *Case 2:* Prior difference. Procedure should output: "No House View." (Preserve the distinction).
      *   *Case 3:* The Bet. Procedure should output: "Reject Bet as Reconciliation Mechanism." Explain why (Adverse Selection).

  10. **Final Polish:**

      *   Tone: Professional, rigorous, slightly skeptical of the junior's naivety but respectful of the math.
      *   Formatting: Clear headers, bold text for decisions.
      *   Ensure the "Judgment Calls" are explicitly marked for the Boss to sign.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Aumann says no." I need to give a *procedure* that works in a business context. The procedure isn't just "Check Aumann," it's "Check if we can act *as if* Aumann holds."
  Also, for Case 1, if they have different licensed data, they *cannot* satisfy Aumann's common knowledge condition. They know the *number*, but not the *partition*. So averaging is a heuristic, not a theorem. I must make this distinction clear.
  For Case 3, the bet is a trap if the offeror knows something the offeree doesn't (which is the whole point of the disagreement). I need to be clear on that.

  Let's write it.
answer: |-
  ### The Diagnostic Procedure

  You are correct: the junior analyst is invoking Aumann's Agreement Theorem but stripping it of the conditions that make it true. The theorem states that rational agents with **common priors** whose posteriors are **common knowledge** cannot agree to disagree. It does not say you should average numbers; it says if the conditions hold, the numbers *should already be identical*. If they are not, the conditions have failed.

  The shape you suspect is correct: this must be a **diagnostic**, not a pooling formula. A formula implies the inputs are commensurable; a diagnostic tests whether they are. If the preconditions fail, averaging is not "compromise"; it is obfuscation.

  Below is the procedure for the Thursday meeting. It is designed to run in 15 minutes, leaving 5 minutes for your final sign-off.

  ***

  ### The Reconciliation Protocol

  **Precondition:** This protocol initiates only when $|P_A - P_B| > 0.10$.
  **Time Limit:** 20 Minutes hard stop.
  **Authority:** You (the Portfolio Manager) sign the final output.

  #### Step 1: Semantic Alignment (The State Space)
  **Question:** "Are we defining the resolution criteria identically? If the event occurs exactly as described in Analyst A's note, does Analyst B's note also count as a 'Yes'?"
  *   **Sufficient Answer:** "Yes, the resolution criteria are identical," OR a specific amendment to the question text that both sign.
  *   **Failure Condition:** One analyst is betting on "Cut announced," the other on "Cut implemented."
  *   **Termination:** If failed, rewrite the question. If time expires, **No House View**.
  *   **Judgment Call:** **You** must verify the amendment does not subtly shift the exposure.

  #### Step 2: Information Symmetry (The Partitions)
  **Question:** "Analyst A, describe the *category* of information driving your delta without revealing licensed data. Analyst B, does knowing that category change your number?"
  *   **Sufficient Answer:** Analyst A says, "I am using proprietary flow data." Analyst B says, "Knowing that, I would move my number from 0.45 to 0.55, but not to 0.70."
  *   **Failure Condition:** Analyst B says, "That category is irrelevant to my model," OR Analyst A cannot describe the source without violating licensing.
  *   **Termination:** If failed, proceed to Step 3. If passed (B moves significantly), update B's number and recalculate the gap. If gap < 0.10, **Stop**. If gap > 0.10, proceed to Step 3.
  *   **Judgment Call:** **You** must decide if the description is specific enough to be credible or vague enough to be bluffing.

  #### Step 3: Prior Alignment (The Model)
  **Question:** "Is this disagreement driven by different data inputs into the same model, or by different models applied to the same data?"
  *   **Sufficient Answer:** "Same model, different inputs" OR "Different structural assumptions (priors)."
  *   **Failure Condition:** "Different structural assumptions." (e.g., one believes regimes revert mean, the other believes they break).
  *   **Termination:**
      *   If **Same Model**: Proceed to Step 4.
      *   If **Different Priors**: **Terminate without House Number.** Record both views as scenario analyses.
      *   **Reasoning:** Averages of different priors are not probabilities; they are political compromises.
  *   **Judgment Call:** **You** must certify the claim of "Same Model." (Often analysts claim same model when their regression specifications differ).

  #### Step 4: Commitment (Truthful Reporting)
  **Question:** "At the current house consensus (or midpoint), would either analyst prefer to take the other side of a trade sized at 5% of NAV?"
  *   **Sufficient Answer:** "No, I stand by my number at that price."
  *   **Failure Condition:** One analyst immediately accepts the bet.
  *   **Termination:**
      *   If **Bet Accepted:** The accepting analyst's number becomes the **House Number**. (The market has spoken).
      *   If **Bet Refused:** Proceed to Computation.
  *   **Judgment Call:** **You** must assess if the refusal is due to risk limits (valid) or lack of conviction (invalid).

  #### Computation (If Steps 1-4 Pass)
  *   **Method:** Weighted Average.
  *   **Weights:** Assigned by **You** based on Step 2 credibility. If data quality is indistinguishable, use 50/50.
  *   **Sign-off:** **You** sign the number. It is now a risk limit, not just a forecast.

  ***

  ### Execution on Three Disagreements

  Here is how the protocol outputs on the specific cases you provided.

  #### Case 1: Same Model, Different Licensed Data (0.70 vs 0.45)
  *   **Step 1 (Semantics):** Pass. Both agree on "25bp cut at next meeting."
  *   **Step 2 (Info):** Analyst A (0.70) cites "proprietary corporate payment flows." Analyst B (0.45) cites "public employment surveys." Analyst B admits, "If flows are that strong, I move to 0.60." Gap narrows to 0.10.
  *   **Step 3 (Priors):** Pass. Both use the same macro transmission model.
  *   **Step 4 (Commitment):** Neither offers a bet.
  *   **Output:** **House Number 0.65.**
  *   **Rationale:** The protocol identified this as an information asymmetry within a shared model. Since B conceded ground upon learning the *category* of A's data, we weight A slightly higher. You sign this as a weighted average, acknowledging the data is unverified but credible by category.

  #### Case 2: Structural Prior Difference (Regime Reversion)
  *   **Step 1 (Semantics):** Pass.
  *   **Step 2 (Info):** Pass. Both see the same public data.
  *   **Step 3 (Priors):** **FAIL.** Analyst A believes inflation is mean-reverting (0.30 probability of hike). Analyst B believes inflation is a random walk (0.70 probability of hike).
  *   **Output:** **No House Number.**
  *   **Rationale:** The protocol terminates at Step 3. You do not average 0.30 and 0.70 to get 0.50. A 0.50 probability implies a specific view on the data-generating process that neither analyst holds. Averaging here creates a "zombie view" that no one believes and which will fail any calibration test later.
  *   **The Honest Answer:** You asked for an answer you might not like. The answer is that your shop has no edge here. You are observing a philosophical schism, not a resolvable uncertainty. Publishing a house number is lying to your clients about your certainty. You run two scenarios.

  #### Case 3: The Bet Offer (Even Odds)
  *   **Context:** Analyst A (0.80) offers Analyst B (0.20) a bet at 50/50 odds.
  *   **Step 4 (Commitment):** **TRIGGERED.**
  *   **Analysis:** Is this clean extraction or a trap?
      *   **The Trap:** If Analyst A has licensed data they cannot show (violating Step 2 symmetry), offering a bet is **adverse selection**. Analyst A knows the true probability is 0.95, offers 0.50 to B, and expects positive EV. Analyst B, lacking the data, is being fleeced.
      *   **The Clean Extraction:** Only valid if Step 2 (Information Symmetry) was fully satisfied. If B knows *why* A is confident but still disagrees, the bet is a genuine test of conviction.
  *   **Output:** **Reject Bet as Reconciliation Mechanism.**
  *   **Rationale:** In a research shop with licensing constraints, Step 2 is rarely perfect. Therefore, a bet offer is usually a signal of private information asymmetry, not a market-clearing mechanism.
  *   **Action:** You treat the bet offer as evidence that Analyst A's number is **hard** (high conviction) and Analyst B's is **soft**. You move the House Number toward A, but you do not let them gamble firm capital to settle a research dispute. The bet confirms the disagreement is real, not that it is resolved.

  ***

  ### Limitations: What This Procedure Cannot Do

  You asked for the boundaries of the tool. There are two critical failures this diagnostic cannot prevent.

  **1. The Shared Wrong Prior (The Echo Chamber)**
  This procedure protects you from *internal* inconsistency, not *external* falsehood. If all nine analysts share the same wrong prior (e.g., "Central Banks always prioritize inflation over growth"), Steps 1 through 4 will pass perfectly. They will agree on a number. The procedure will validate that number as "consistent."
  *   **Can it protect you?** No.
  *   **Should agreement be treated as evidence you are right?** **Absolutely not.** Agreement is only evidence that your hiring process lacks cognitive diversity. In macro research, consensus is often the point of maximum risk. You must treat unanimous agreement as a signal to stress-test the *model itself*, not the inputs.

  **2. The "Common Knowledge" Illusion**
  Aumann's theorem requires *common knowledge* (I know that you know that I know...). In your meeting, you achieve *mutual knowledge* (I know your number, you know mine). Because licensed data prevents full disclosure of the *partition* (the specific information set), true common knowledge is impossible.
  *   **Consequence:** The procedure forces you to make a judgment call on "credibility of description" (Step 2). This is where your alpha lies. The math cannot save you here. If you sign the number, you are not signing a calculation; you are signing a warranty that you trust Analyst A's description of their hidden data more than Analyst B's.

  ### Summary for the Junior Analyst
  Tell him this: "Aumann's theorem proves that if we were perfect Bayesians with identical brains and no secrets, we wouldn't be in this meeting. The fact that we are in this meeting proves the theorem's preconditions are false. We use this diagnostic to measure *how* they are false. We average only when the error is noise. We split when the error is signal."
