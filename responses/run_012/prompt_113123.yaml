  # The Millian Diagnostic Tree

  **Instructions:** Start at Node 1. Answer "Yes" or "No" (or choose the option) based on your intuition about the specific case or claim presented. Follow the arrow to the next Node or to a Final Position (Leaf).

  ### Node 1 (Scope: Private Governance)
  **Case:** A private social media platform bans a user for posting legal but controversial political opinions.
  **Question:** Does *On Liberty* provide a standard to judge whether the platform was wrong to do so?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 6.

  ### Node 2 (Scope: Social Coercion)
  **Case:** A crowd ostracizes a neighbor for unpopular views, ruining their business, without breaking any laws.
  **Question:** Is this social pressure subject to the same liberty principle as the platform ban?
  *   **Yes** → Go to Node 3.
  *   **No** → **Leaf A**.

  ### Node 3 (Harm: Cumulative/Systemic)
  **Case:** A single user shares a verifiably false claim about election procedures. It does not change any specific vote count, but contributes to a broader culture of distrust.
  **Question:** Is this single act restrictable on its own merits?
  *   **Yes** → **Leaf B**.
  *   **No** → Go to Node 4.

  ### Node 4 (Sufficiency: Social)
  **Claim:** "If a speech act is proven to cause direct harm to a specific person's interests, that proof alone is sufficient to restrict it."
  **Question:** Do you accept this claim for private/social restrictions?
  *   **Yes** → **Leaf C**.
  *   **No** → Go to Node 5.

  ### Node 5 (Enforcer: Social)
  **Case:** A norm violates liberty within a private community.
  **Question:** Who is best suited to apply the 'harm' test: a judge bound by precedent, or a platform moderator optimizing for safety?
  *   **Judge** → **Leaf D**.
  *   **Moderator** → **Leaf E**.

  ### Node 6 (Harm: Aggregate/Legal)
  **Case:** The government bans a pamphlet because it might encourage tax evasion in the aggregate, though no specific evasion is proven.
  **Question:** Is this ban permissible?
  *   **Yes** → **Leaf F**.
  *   **No** → Go to Node 7.

  ### Node 7 (Context: Time, Place, Manner)
  **Case:** An essay argues corn dealers starve the poor. A speech to a hungry mob outside a dealer's house says the same.
  **Question:** If the essay is protected, must the speech also be protected?
  *   **Yes** → Go to Node 8.
  *   **No** → **Leaf G**.

  ### Node 8 (Harm: Dignity/Security)
  **Case:** A comedian tells a dehumanizing joke about a minority group. No specific individual sues or loses a job, but members of that group report feeling less safe participating in public life.
  **Question:** Is this feeling of reduced security a 'harm' sufficient to trigger restriction?
  *   **Yes** → **Leaf H**.
  *   **No** → Go to Node 9.

  *(Note: The path Node 7=Yes → Node 8=Yes is marked **Unoccupied** below.)*

  ### Node 9 (Sufficiency: Legal)
  **Claim:** "If a speech act is proven to cause direct harm to a specific person's interests, that proof alone is sufficient to restrict it."
  **Question:** Do you accept this claim for state restrictions?
  *   **Yes** → **Leaf I**.
  *   **No** → Go to Node 10.

  ### Node 10 (Enforcer: Legal)
  **Case:** A law restricts speech to prevent harm.
  **Question:** Should the 'harm' test be applied by courts striking down laws, or by legislators weighing interests before passing them?
  *   **Courts** → **Leaf J**.
  *   **Legislators** → **Leaf K**.

  *(Note: Leaves I, J, and K are treated as variants of one position below to meet the leaf count constraint.)*

  ---

  ### Final Positions (Leaves)

  **Leaf A: Platform Sovereigntist**
  *   **Path:** 1-Yes, 2-No.
  *   **Position:** Mill's principle applies to corporate terms of service but not to informal social pressure or mobs.
  *   **Awkward Commitment:** You must defend why a CEO's whim counts as "coercion" requiring philosophical justification, but a mob destroying a livelihood does not.

  **Leaf B: Systemic Steward**
  *   **Path:** 1-Yes, 2-Yes, 3-Yes.
  *   **Position:** Liberty principles cover private and social spheres, and aggregate harm to the deliberative environment justifies restricting individual speech.
  *   **Awkward Commitment:** You must accept that a speaker can be silenced for a harm they did not personally cause and could not prevent on their own.

  **Leaf C: Social Absolutist**
  *   **Path:** 1-Yes, 2-Yes, 3-No, 4-Yes.
  *   **Position:** Social pressure is coercive, but only specific, proximate harm justifies restriction; no balancing test required.
  *   **Awkward Commitment:** You must allow socially devastating speech whenever the causal chain is slightly broken, even if the damage is obvious.

  **Leaf D & E: Procedural Social Millians**
  *   **Path:** 1-Yes, 2-Yes, 3-No, 4-No, 5-Judge/Mod.
  *   **Position:** Social and private coercion is covered, but restrictions require a necessity test (least restrictive means).
  *   **Indistinguishability:** Practically, these two leaves recommend the same outcomes on the test cases; the tree cannot pull them apart because Mill does not specify an enforcement mechanism for non-legal coercion.
  *   **Awkward Commitment:** You must enforce a rigorous legal-style "necessity test" on dinner party invitations or Twitter moderation queues.

  **Leaf F: Legal Aggregativist**
  *   **Path:** 1-No, 6-Yes.
  *   **Position:** Mill's principle applies only to the state, but the state may restrict speech to prevent diffuse, systemic harms.
  *   **Awkward Commitment:** You must accept that the government can ban ideas based on statistical risks rather than proven injuries to specific rights.

  **Leaf G: Contextual Legalist**
  *   **Path:** 1-No, 6-No, 7-No.
  *   **Position:** Mill applies only to the state; harm must be specific, but context (manner/audience) determines whether speech constitutes harm.
  *   **Awkward Commitment:** You must defend the line between "discussion" and "incitement" without sliding into viewpoint discrimination based on how unpopular the audience's reaction is.

  **Leaf H: Dignity Legalist**
  *   **Path:** 1-No, 6-No, 7-Yes, 8-Yes.
  *   **Position:** Mill applies only to the state; context never changes the content's protection, but attacks on dignity/security count as harm.
  *   **Awkward Commitment:** You must treat "feeling unsafe" as equivalent to physical injury or financial loss for the purpose of state censorship.

  **Leaf I, J, K: Strict/Balancing Legalists**
  *   **Path:** 1-No, 6-No, 7-Yes, 8-No, 9-Yes/No, 10-Court/Leg.
  *   **Position:** Mill applies only to the state; harm must be specific and tangible; context matters only for direct incitement; restrictions require necessity testing.
  *   **Indistinguishability:** These three leaves make identical recommendations on the corn dealer, platform, and disinformation cases. The tree cannot pull them apart because the disagreement is purely institutional (who decides) rather than principled (what counts as harm).
  *   **Awkward Commitment:** You must tolerate speech that you know will lead to harm, simply because the causal chain is not immediate enough for the law to touch.

  ---

  ### Unoccupied Positions

  **Path:** Node 7 (Yes) → Node 8 (Yes).
  **Status:** **Incoherent.**
  **Reasoning:** Answering "Yes" at Node 7 means you believe the *content* is protected regardless of the *context* (the hungry mob). Answering "Yes" at Node 8 means you believe the *effect* on the audience (feeling unsafe) justifies restriction. You cannot simultaneously hold that context is irrelevant to restriction (Node 7) and that audience reaction is the basis for restriction (Node 8). No one in your group likely holds this combination; if they do, they are conflating "content" with "effect."

  **Path:** Node 1 (No) → Node 2 (Yes).
  **Status:** **Logically Impossible in this Tree.**
  **Reasoning:** Node 2 is only reachable if Node 1 is "Yes." However, conceptually, a position that says "Mill does not apply to Platforms" but "Mill does apply to Mobs" is **Undefended**. Most who limit Mill to the state (Node 1-No) also exclude informal social pressure (Node 2-No). Those who include social pressure (Node 2-Yes) almost invariably include private governance structures that mimic public squares (Node 1-Yes).
