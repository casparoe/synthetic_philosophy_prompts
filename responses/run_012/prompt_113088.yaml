answer: |-
  Right, pull up a chair. It's good you're asking about this before you cite it. Jeffrey conditionalisation (JC) is one of those topics where the maths is elegant, but the philosophical footings are notoriously slippery. Popularisers often smooth over the cracks because the "input problem" and the commutativity issues don't make for a catchy headline.

  You've done a solid job summarising the post. It captures the standard "Radical Probabilist" pitch. However, as you suspected, there are several places where the author has generalised from the clean mathematics to the messy epistemology without checking the seams.

  Here is the brainstorm of substantive claims as I read them from your summary, followed by the audit.

  ### Brainstorm: Substantive Claims on the Table

  1.  **The Certainty Assumption:** Ordinary Bayesian conditionalisation (BC) requires evidence to be certain ($P(E)=1$).
  2.  **The Prevalence of Uncertainty:** Most real-world evidence is uncertain (credence shifts, not binary jumps).
  3.  **The Formula:** JC updates credences via $P'(X) = q \cdot P(X|A) + (1-q) \cdot P(X|\neg A)$.
  4.  **Rigidity is Automatic:** The condition that $P'(X|A) = P(X|A)$ (rigidity) is not an extra assumption; it follows automatically from "genuine" evidence.
  5.  **Ease of Application:** One simply plugs in a new credence $q$ for the evidence proposition; the rest of the network updates automatically.
  6.  **Commutativity:** Updating in stages yields the same result as updating all at once; order does not matter.
  7.  **Dutch Book Security:** JC is uniquely immune to Dutch Books, just like BC.
  8.  **The "Myth" of Certainty:** Nothing is ever certain; BC is a limiting case/myth; JC is the universal rule.
  9.  **Irreducibility:** JC cannot be modelled as ordinary conditionalisation on a different proposition.

  ***

  ### The Audit

  Here is how these claims stand up to scrutiny. I've categorised them as (a) acceptable, (b) defensible shorthand that makes specialists wince, or (c) wrong/misleading.

  **1. The Certainty Assumption**
  *   **Verdict:** (a) Acceptable.
  *   **Comment:** This is the standard definition of strict conditionalisation. In the formalism, you condition on a partition element that becomes probability 1. No issue here.

  **2. The Prevalence of Uncertainty**
  *   **Verdict:** (b) Defensible shorthand.
  *   **Comment:** This is Jeffrey's own motivation (the "cloth in the candlelight" example is his classic). However, a foundationalist would object that there *are* basic propositions (e.g., about immediate sensory experience) that are certain. Presenting this as an empirical fact ("most of the time") rather than a philosophical stance (Radical Probabilism) is slightly glib, but not mathematically wrong.

  **3. The Formula**
  *   **Verdict:** (a) Acceptable.
  *   **Comment:** For a binary partition $\{A, \neg A\}$, this is the correct definition of Jeffrey's Rule.

  **4. Rigidity is Automatic**
  *   **Verdict:** (c) Wrong.
  *   **Comment:** This is the most significant error in the post. The "rigidity" condition (that the conditional probabilities of other propositions given $A$ remain fixed) is a substantive normative constraint, not a description of how evidence works.
  *   **The Objection:** Suppose you look at the cloth and your credence it is blue rises. But suppose the candlelight also makes you realise your colour vision is unreliable. In this case, the link between "looks blue" and "is blue" has changed. $P'(\text{Blue} | \text{Looks Blue}) \neq P(\text{Blue} | \text{Looks Blue})$. Rigidity is violated.
  *   **The Defender's Rebuttal:** A defender of JC would say: "You are misidentifying the partition." If rigidity fails, you haven't identified the proper 'evidence proposition' $A$. You must describe the experience so finely (e.g., 'seems blue in this specific way') that rigidity holds.
  *   **Why it still wince-worthy:** This pushes the problem back. It implies we can always find a description of experience that isolates the probabilistic impact from the interpretive impact. Many epistemologists (e.g., Christensen, Titelbaum) argue this is not always possible. The post treats rigidity as a free lunch; it is actually the cost of admission.

  **5. Ease of Application (The Input Problem)**
  *   **Verdict:** (b) Defensible shorthand.
  *   **Comment:** The post says "you just need some new credence to plug in." It glosses over *how* you get that number. This is the famous "Input Problem" for JC. BC tells you how to update *given* evidence; JC tells you how to update *given* a new probability distribution. But what rational constraint dictates the new distribution? The post implies the evidence hands you the number $q$.
  *   **The Defender's Rebuttal:** A defender would argue that rationality doesn't dictate the input, only the processing. Just as BC doesn't tell you which certain evidence you'll get, JC doesn't tell you what your post-experience credence should be. That is a matter of psychology or direct perception, not logic.
  *   **Why it wince-worthy:** It makes JC sound like a complete epistemology. It isn't; it's a constraint on coherence *given* an input that the rule itself cannot justify.

  **6. Commutativity (Order Independence)**
  *   **Verdict:** (c) Wrong (in the general case).
  *   **Comment:** The post claims updating in stages gives the same answer regardless of order. This is true for BC. It is **false** for JC unless specific independence conditions are met. If you update on partition $\{A, \neg A\}$ and then on partition $\{B, \neg B\}$, the result depends on the order if the partitions are not probabilistically independent. (See Wagner 2002, "Determining Probability").
  *   **The Defender's Rebuttal:** A defender might say: "If you describe the evidence as a single joint update on the combined partition, order doesn't matter."
  *   **Why it still wrong:** That concedes the point. The post explicitly says "one at a time". Sequential JC is not commutative in the general case. This is a technical error that a statistician should have caught.

  **7. Dutch Book Security**
  *   **Verdict:** (b) Defensible shorthand.
  *   **Comment:** There is a Dutch Book argument for JC (Armendt 1980), but it is not as robust as the standard Lewis/Teller argument for BC. It relies on assumptions about how agents price bets under uncertain evidence which are more contentious.
  *   **The Defender's Rebuttal:** "It is the only rule that avoids a Dutch Book *given the constraint of rigidity*."
  *   **Why it wince-worthy:** It implies the security is equal to BC. It isn't. BC protects you from sure loss given *truth*; JC protects you from sure loss given *your own shifting standards*. It's a coherence of a different, slightly weaker kind.

  **8. The "Myth" of Certainty**
  *   **Verdict:** (b) Defensible shorthand (Philosophically loaded).
  *   **Comment:** This is Jeffrey's "Radical Probabilism". It is a coherent philosophical position, but presenting it as a settled fact ("nothing is ever actually certain") is rhetorical overreach. Many Bayesians (e.g., Howson & Urbach) maintain that we can and do treat observation reports as certain for practical purposes.
  *   **The Defender's Rebuttal:** "Even if you treat them as certain for calculation, they aren't *infallibly* certain. JC is the more general, honest framework."
  *   **Why it wince-worthy:** It dismisses a viable competing epistemology (Foundationalism) as a "myth" rather than a competing model.

  **9. Irreducibility**
  *   **Verdict:** (a) Acceptable.
  *   **Comment:** You cannot generally model JC as BC on a proposition like "I have evidence E" without violating the rigidity condition or changing the algebra in ways that defeat the purpose (Field 1978). The post is correct here; JC is structurally distinct.

  ***

  ### Verdict on the Conclusions

  You asked specifically about the two conclusions drawn at the end of the post. Here is where they stand after the corrections.

  **Conclusion 1: "The order of your evidence doesn't matter."**
  *   **Status:** **False.**
  *   **Correction:** This survives only in a severely weakened form. Order independence holds for JC *only if* the successive updates are on independent partitions or if the updates are treated as a single simultaneous update on a joint partition. If you are updating sequentially on overlapping or dependent propositions (which is the normal case in learning), the order *does* matter. This is a significant limitation of JC compared to BC. A grad student using JC needs to check for commutativity conditions; they cannot assume it.

  **Conclusion 2: "Ordinary conditionalisation is a myth; JC is the one you're always using."**
  *   **Status:** **Philosophically Contested, Mathematically True as a Limit.**
  *   **Correction:** Mathematically, BC is indeed the limit case of JC where $q=1$ or $q=0$. So, in that sense, JC is the more general formula. However, the epistemological claim that we are *always* using JC is a philosophical stance (Radical Probabilism), not a mathematical proof.
  *   **Survival:** It survives only if you accept Jeffrey's epistemology that there are no certainty-equivalents. If you accept that some observational reports can be treated as certain (even if not infallible), then BC remains a valid, distinct tool. The post presents a philosophical preference as a mathematical necessity.

  ### Summary Advice

  The post is useful for getting the formula down, but it sells the rule as more robust than it is. The author has conflated the *mathematical generality* of JC (it includes BC as a limit) with *epistemological superiority* (it solves the problems of BC).

  If you use this in your work, acknowledge the **Input Problem** (where do the $q$s come from?) and the **Commutativity Problem** (order matters in sequential updates). If you ignore those, you'll be vulnerable in a seminar. The "Rigidity is automatic" claim is the one to watch out for most; that's where the philosophical heavy lifting is hidden, and the post pretends it isn't there.

  Right, that should give you enough to navigate the literature without tripping over the popularisation. Let me know if you need pointers on the specific Dutch Book arguments.
