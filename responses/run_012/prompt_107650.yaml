answer: |-
  You have described, with considerable precision, one of the most significant structural problems in contemporary philosophical logic and probability theory. You are correct that the case of the conditional is the paradigmatic instance, and you are also correct that this pattern recurs elsewhere.

  Here is the anatomy you requested.

  ### 1. The Name of the Conditional Case
  The specific argument regarding conditionals is universally known as **Lewis's Triviality Result** (or Lewis's Triviality Proof), following David Lewis's 1976 paper, *"Probabilities of Conditionals and Conditional Probabilities."*

  The principle you described as "mild"—that the probability of the construction is the probability of one part given the other—is known as **Stalnaker's Thesis** (or The Equation):
  $$P(A \to B) = P(B \mid A)$$

  Lewis demonstrated that if we assume:
  1.  **Propositionality:** The conditional $A \to B$ expresses a proposition (it has a truth value and belongs to the Boolean algebra of the probability space).
  2.  **Stalnaker's Thesis:** The probability of that proposition equals the conditional probability.
  3.  **Standard Probability:** The usual axioms of probability apply (including the rule that $P(X) = P(X \mid Y)P(Y) + P(X \mid \neg Y)P(\neg Y)$).

  Then, for the equation to hold across a range of probability functions, the conditional must be probabilistically independent of its antecedent, or the algebra of propositions must be trivial. In later refinements (notably by Alan Hájek), this was sharpened to show that the conditional effectively collapses into the **material conditional** ($A \supset B$, or $\neg A \lor B$). The "interesting" intensional connection between $A$ and $B$ is squeezed out; the conditional becomes truth-functional.

  ### 2. The Name of the Wider Family
  You asked if there is a name for the wider family of results where a plausible constraint on a graded notion forces it to coincide with a coarser one.

  The established technical term is indeed **Triviality Result** (or **Triviality Theorem**). In logic and social choice theory, a "triviality result" specifically denotes a proof that a set of seemingly reasonable constraints can only be satisfied if the system degenerates into a trivial case (e.g., a single option, a tautology, or a truth-functional connective).

  However, to capture the specific *shape* you identified—the collapse of a **graded/intensional** notion into a **binary/extensional** one under probabilistic pressure—I propose we refine the definition of this family. While "Impossibility Theorem" (like Arrow's) says "No function satisfies these constraints," a **Triviality Result** says "The only function that satisfies these constraints is the one that ignores the complexity you cared about."

  If you require a coined label to distinguish this specific sub-genre (where richness is lost to coherence), you might call it a **Coarsening Theorem** or a **Collapse of Intensionality**. But in the literature, these are all grouped under **Triviality Results**. A close sibling is the **Gärdenfors Triviality Result** (1988) in belief revision, which shows that certain plausible postulates for updating beliefs force the belief state to become trivial.

  ### 3. Anatomy: Distinctions from Other Logical Phenomena
  You asked how this differs from an impossibility theorem, a counterexample, or unintended formal consequences.

  *   **Vs. Impossibility Theorem:** An impossibility theorem (e.g., Arrow's Impossibility Theorem) concludes that *no* mapping exists that satisfies the constraints. A Triviality Result concludes that a mapping *does* exist, but it is **degenerate**. It tells you that you can have your system, but it won't do the work you wanted it to do. It preserves existence at the cost of utility.
  *   **Vs. Counterexample:** A counterexample shows a principle is false in a specific instance. A Triviality Result shows that the principle is incompatible with the *structural nature* of the object. It is a global constraint, not a local failure.
  *   **Vs. Unintended Consequence:** An unintended consequence is usually a bug in a specific model. A Triviality Result is a feature of the conceptual landscape. It reveals that the concepts themselves (e.g., "probability" and "proposition") are in tension, regardless of the specific model built.

  ### 4. The Destructive Assumption
  You asked which assumption is doing the destructive work. This is the crux of the philosophical debate. The proof relies on the conjunction of three things, but the consensus leans heavily against one in particular.

  1.  **The Probability Principle (Stalnaker's Thesis):** Most philosophers want to keep this. It captures the intuitive link between "If A, then B" and "Given A, how likely is B?"
  2.  **Substitution of Equivalents:** This is standard in classical logic.
  3.  **Propositionality (The Boolean Assumption):** This is the assumption that the construction ($A \to B$) denotes a proposition with a truth value that can be plugged into the standard probability calculus.

  **The Verdict:** The **Propositionality Assumption** is generally identified as the culprit.
  Lewis himself concluded that conditionals do not express propositions. They do not have truth conditions; they have **assertability conditions**. They are not the *kind* of thing that has a probability in the standard sense; rather, their "probability" is a measure of their acceptability.

  If you insist the construction is a proposition (has a truth value), the probability calculus (specifically the Law of Total Probability) forces it to behave like a material object. The "destructive work" is done by the **Law of Total Probability** acting upon a **Truth-Valued Object**. The probability calculus is designed for extensions (truth values); when you force an intension (a conditional connection) to behave like an extension, the calculus flattens it.

  ### 5. The Familiar Maneuvers
  To keep the "interesting case" interesting, philosophers typically surrender one of the assumptions. Here is the taxonomy of escape routes:

  *   **The Non-Propositional View (Surrender Propositionality):**
      *   *Proponents:* Ernest Adams, David Lewis, Dorothy Edgington.
      *   *Move:* Conditionals are not propositions. They cannot be negated, conjoined, or embedded in larger truth-functional structures in the usual way. $P(A \to B)$ is not the probability of a truth, but the **conditional probability** itself.
      *   *Cost:* You lose the ability to embed conditionals in complex logic (e.g., "If (if A then B), then C" becomes problematic).

  *   **The Contextualist View (Surrender Fixed Probability):**
      *   *Proponents:* Robert Stalnaker, Bas van Fraassen.
      *   *Move:* The probability function shifts when you suppose the antecedent. $P(A \to B)$ is evaluated not in the original probability space $P$, but in a revised space $P_A$.
      *   *Cost:* The probability of the conditional is not a single number fixed by the current state; it is relative to a dynamic update.

  *   **The Hyperintensional View (Surrender Substitution):**
      *   *Proponents:* Some relevant logicians, non-classical probabilists.
      *   *Move:* Reject the rule that logically equivalent sentences receive the same probability within the construction.
      *   *Cost:* You must abandon classical probability theory for a non-classical variant (e.g., quantum probability or hyperintensional semantics), which is mathematically expensive.

  *   **The Gricean/Pragmatic View (Surrender the Principle):**
      *   *Proponents:* H.P. Grice, Frank Jackson.
      *   *Move:* The conditional *is* the material conditional (truth-functional). The "interesting" connection is merely a conversational implicature, not part of the truth conditions.
      *   *Cost:* You admit the logic is blunt and explain away the intuition as pragmatics.

  ### Summary
  The shape you have identified is the **Triviality Result**. Its anatomy consists of a conflict between **intensional richness** (the construction means more than its truth values) and **extensional coherence** (the probability calculus operates on truth values).

  When you demand that a rich, intensional construction obey the laws of extensional probability *as a proposition*, the extensional laws win. The construction is crushed into an extensional mold. The "mild" principle is not mild; it is a Trojan Horse that brings the full force of the Kolmogorov axioms to bear on a structure that cannot support them without collapsing.

  To preserve the interesting feature, you must deny the construction the status of a standard proposition. You must accept that some meaningful things we say do not have truth values, even if they have probabilities.
