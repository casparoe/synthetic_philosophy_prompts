      *   *Wait, I need to be committed.* The advisor says intuitions are data about facts. I say: No. Intuitions are *constraints* on theory construction, not measurements of moral particles.
      *   *Analogy:* **Tuning a Musical Instrument.** You aren't measuring the "true pitch" of the universe; you are adjusting strings to harmonize with each other (reflective equilibrium).
