      *   Avoid overly academic jargon.
      *   Be decisive. The user wants a principle, not a "maybe."

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Forgery:* I need to be careful. A forgery *is* made by a human. Why is it not art? Because the *channel* is corrupted. The feeling is "Look how well I can mimic Vermeer" (hidden) vs "Here is my vision" (broken). The user's reaction ("goes dead") implies the *relationship* is broken. I need to emphasize the **Covenant of Authenticity**.
