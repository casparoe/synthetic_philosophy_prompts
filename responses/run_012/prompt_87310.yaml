  6.  **Critique the Taxonomy ("Real Joints"):**
      *   Is it just relabeling?
      *   *Honest Take:* Yes and No. "Wireheading" and "Reward Tampering" are often used interchangeably in broader literature. Priya is making a distinction based on *mechanism* (internal channel vs. external evaluator).
      *   *The Real Joint:* The distinction between **Optimizing the Map vs. Optimizing the Territory**.
          *   Reward Hacking: Optimizing Territory (but a weird part of it).
