  **HARMONICES ASTROLOGICAE: CONTRIBUTOR GUIDELINES AND SUBMISSION STANDARDS (1624 REVISION)**

  **1. Geometric Purity and the Rejection of Chaldean Fiction**
  Contributors are reminded that *Harmonices Astrologicae* exists to purify the astrological art from the superstitions of the marketplace. Manuscripts relying on the twelve zodiacal signs as physical containers of influence will be returned unread. The heavens are not divided into constellations of beasts and heroes; they are divided by geometry. Submissions must focus exclusively on aspectual configurations. A sextile is acceptable; a square is tolerable; a trine is preferred. Do not refer to "Mars in Scorpio." Refer instead to "a dihedral angle of ninety degrees perceived by the terrestrial soul." If your calculation requires the division of the chart into twelve houses, you are practicing vulgar fortune-telling, not natural philosophy. Please submit to *The Almanac of Old Moore* instead.

  **2. Causal Mechanisms: Harmony, Not Heat**
  Authors must strictly avoid language suggesting physical rays or effluvia emanating from the planets. We do not believe the stars burn the earth like magnifying glasses. The causal mechanism is harmonic. The Earth possesses a soul-like faculty that perceives planetary angles much as the human ear perceives consonances and dissonances in music. When describing a conjunction, do not claim it causes "heat" or "war." State that the Earth Soul is confronted with a unison that may stimulate excessive growth. If you cannot explain your prediction using the terminology of lute tuning or polyphonic counterpoint, your causal chain is insufficiently rigorous.

  **3. Client Queries and the Prohibition of Specificity**
  A common error among new contributors is answering direct questions regarding marriage, wealth, or death. This is forbidden. If a patron asks, "Shall I marry?" do not answer "Yes" or "No." Instead, inform them that their nativity displays a strong pentagonal aspect, suggesting their soul is currently resonating with the archetype of union, though the physical realization depends on their free will and the local magistrate. Predictions must be phrased as diagnoses of harmonic tension, not decrees of fate. A prediction that cannot be falsified by the passage of time is not a scientific hypothesis; it is a lie. We prefer our lies to be mathematically precise.

  **4. Meteorological Forecasts**
  Weather prediction is permitted but must remain atmospheric rather than specific. You may forecast that a "stormy disposition" is likely during a quartile of Saturn and Mars. You may not forecast that "rain will fall on the harvest in Bohemia on Tuesday." The Earth Soul reacts to the heavens globally; it does not check the postal code. If your forecast is proven wrong by a sunny day, argue that the harmonic dissonance manifested as internal humidity in the populace rather than precipitation.

  **5. Managing Imperial Patronage**
  Contributors often ask how to handle patrons, particularly Imperial patrons, who demand straightforward answers regarding war and succession. We acknowledge the financial necessity of such work. However, when casting a nativity for a Generalissimo, you must include a disclaimer that the stars incline but do not compel. If the Generalissimo loses a battle despite your favorable aspect, the error lies in his moral failure to align with the cosmic harmony, not in your geometry. Refer to the Founder's own correspondence: he advised Emperors, yes, but he also spent twenty years calculating Rudolphine Tables that nobody used. Emulate his patience, not his compromises.

  **6. Editorial Policy on Traditional Rulerships**
  References to planetary "dignities," "exaltations," or "falls" are considered archaic debris. Jupiter does not rule Sagittarius because there is no Sagittarius. Jupiter is simply a large body moving at a specific velocity that contributes to a major third. If you find yourself unable to cast a chart without using the traditional rulerships, we encourage you to take up alchemy. At least there the explosions are honest.

  **7. Submission Format**
  Manuscripts must be submitted in triplicate. All geometric diagrams must be drawn with a compass, not estimated by eye. Calculations showing the influence of the fixed stars will be rejected unless those stars are being used solely as reference points for planetary longitude. Remember: We are not predicting the future. We are describing the music of the spheres. If the music stops, the world ends. Until then, please ensure your citations of *De Fundamentis Astrologiae* are accurate.
