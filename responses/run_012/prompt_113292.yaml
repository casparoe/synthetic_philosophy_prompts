      *   *Invariant:* Count the I's. Start: 1 I. Rules: double I's, subtract 3 I's. 1 is not divisible by 3. Doubling $2^k$ never yields a multiple of 3. Subtracting 3 preserves modulo 3. So I-count is never $0 \pmod 3$. MU has 0 I's. Impossible.
      *   *Ascent View:* Number theory (arithmetization) is "outside" the string manipulation system. It's meta-mathematics.
