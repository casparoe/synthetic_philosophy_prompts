prompt: |-
  I have no formal training in mathematics; I have been teaching myself set theory from an introductory book in my spare time, and before I start relying on what I have read I want to know how far I can trust it. The book's treatment of Zorn's lemma runs roughly as follows, and I would rather you audit this passage than simply explain the lemma from scratch:

  "Zorn's lemma is the great workhorse of existence proofs in modern mathematics. To use it, you collect the partial objects you hope to build up -- say, the subsets of a given set that share some property -- and order them by how much of the whole each one already contains. You then check a single hypothesis: that every chain, meaning any nested family of these partial objects, has an upper bound somewhere in the family. Zorn's lemma then hands you a maximal element, which is the largest of these objects, the one into which every other object in the family can be extended. Since the lemma is equivalent to the axiom of choice, it comes free to any mathematics that already accepts choice, and it is the tool behind such results as the fact that every vector space has a basis. The one genuine caution is that the lemma applies to sets and not to proper classes, so it must not be aimed at the collection of all sets. Beyond that, the hypothesis is in practice almost automatic: the union of any chain of these objects is itself an upper bound, and since it is assembled out of members of the family, it too belongs to the family, so there is rarely anything to check."

  Please go through that passage and sort it into four piles: what a working mathematician would accept as correct, what is a harmless simplification, what is actually false, and what is stated in a way that would lead me to misuse the lemma later. Where something is false or misleading, give me the correct statement and a small concrete partial order that shows the difference matters -- I would rather see one toy example than be told that a word is being used loosely. I am most worried about the closing advice, since the reason I am reading about Zorn's lemma at all is that I want to use it in my own arguments, so tell me whether the passage's overall message -- that the lemma is powerful but nearly automatic in practice -- survives your corrections, or whether the very caution it waves away is the part that actually catches people. Tell me how confident you are in each part of your verdict, and single out the one point you are least sure about.
