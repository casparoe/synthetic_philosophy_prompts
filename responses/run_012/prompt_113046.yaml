prompt: |-
  I'm leading a session for a mixed reading group -- a couple of people know basic micro, most don't -- on interpersonal utility comparisons. I don't want the explanation itself, I want a teaching plan. I'm going to hang it on the difference between comparing utility levels and comparing utility differences, because that's the thing that keeps tripping people up and I think it's the spine of the whole issue. What has to come before what, what single example should carry the session (and what does that example need to have and lack so it doesn't smuggle in cardinal utility), which misconceptions they'll arrive with -- I'm betting on "utility just means happiness," "interpersonal comparisons need cardinal utility," and "money is a neutral proxy" -- and where exactly in the sequence I should head each one off. Tell me what to leave out at this level and say so out loud, and give me one question I can ask at the end that would show whether they've actually got the distinction rather than just nodding along. Also, be explicit about which parts of this are settled among people who work on it and which are genuinely contested -- don't let a contested view pass as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed reading group (some basic micro, most don't).
      *   **Topic:** Interpersonal Utility Comparisons (IUC).
      *   **Core Constraint:** Do *not* explain the concept itself. Provide a *teaching plan*.
      *   **Structural Spine:** The distinction between comparing utility *levels* vs. comparing utility *differences*.
      *   **Key Requirements:**
          *   Sequence (what comes before what).
          *   Single carrying example (criteria: what it needs/lacks to avoid smuggling cardinal utility).
          *   Address specific misconceptions ("utility = happiness," "IUC needs cardinal utility," "money = neutral proxy").
          *   Timing for addressing misconceptions.
          *   What to exclude (and state why).
          *   One final assessment question.
          *   Epistemic status: Distinguish between settled vs. contested views.

  2.  **Deconstruct the Core Spine (Levels vs. Differences):**
      *   Why is this the spine? Because ordinal utility (standard micro) allows ranking *my* bundles, but says nothing about *your* bundles (levels) or how much *I* gain vs. how much *you* lose (differences).
      *   To compare levels, we need a common zero point.
      *   To compare differences, we need a common unit scale.
      *   Most policy debates hinge on differences (utilitarianism), but philosophical debates often hinge on levels (prioritarianism, sufficiency).

  3.  **Develop the Carrying Example:**
      *   *Criteria:* Needs to be intuitive, relatable, but strictly ordinal to start. Must not imply a natural "zero" (like death or zero dollars) that tempts cardinalization.
      *   *Bad Example:* Money (smuggles cardinality), Pain/Health (smuggles biological universality), Happiness (smuggles psychological cardinality).
      *   *Good Example:* "Seats at a Theater" or "Slices of Pizza" or "Vacation Days."
      *   *Selection:* **Vacation Days.**
          *   *Why:* Everyone understands more is better. It's discrete but scalable. It doesn't have a natural "zero" that means "non-existence" (0 days off is bad, but you still exist). It avoids the "money is utility" trap.
          *   *Constraint:* Must explicitly state we don't know how much Alice *likes* vacation days compared to Bob.

  4.  **Sequence the Session:**
      *   *Phase 1: Setup & Ordinality.* Establish the baseline micro framework (preferences, ordinal utility).
      *   *Phase 2: The Level Problem.* Can we say Alice is better off than Bob?
      *   *Phase 3: The Difference Problem.* Can we say Alice gains more than Bob loses?
      *   *Phase 4: Misconception Check-in.* Address the specific misconceptions during the flow.
      *   *Phase 5: Conclusion & Assessment.*

  5.  **Address Misconceptions (Timing & Strategy):**
      *   *"Utility = Happiness":* Address immediately in Phase 1. Define utility as "preference satisfaction index," not a psychological state.
      *   *"Money = Neutral Proxy":* Address when introducing the example. Explicitly forbid money in the example to prevent this.
      *   *"IUC needs Cardinal Utility":* This is the tricky one. It's partially true but nuanced. Address in Phase 3. You need *more* than ordinal, but "cardinal" is a specific technical term. Distinguish between "cardinal unit comparability" vs. "level comparability."

  6.  **Determine What to Leave Out:**
      *   Harsanyi's Utilitarianism theorem (too technical).
      *   Specific social welfare functions (Rawls vs. Utilitarian math) beyond the basic intuition.
      *   Neuroeconomics/Biological markers (distracts from the conceptual logic).
      *   History of thought (Bentham vs. Robbins) unless it serves the logic.

  7.  **Clarify Epistemic Status (Settled vs. Contested):**
      *   *Settled:* Standard micro assumes ordinal utility. Standard micro says IUC are impossible without extra assumptions.
      *   *Contested:* Whether IUC are *meaningful* (philosophical), whether we can/should make them for policy (pragmatic), and what extra assumptions are justified (empathy, biology, etc.).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Refining the Example:* Let's use "Weekend Days Off." It's cleaner.
      *   *Refining the Misconception on Cardinality:* It's not that IUC *needs* cardinal utility in the von Neumann-Morgenstern sense, but it needs *interpersonal* comparability which ordinal utility lacks. I need to be precise here. The prompt says "IUC needs cardinal utility" is a misconception. Actually, strictly speaking, comparing *differences* requires cardinal unit comparability. Comparing *levels* requires cardinal full comparability. The misconception is likely that *any* IUC is impossible because utility is ordinal, OR that we need a "happiness meter." I will frame it as: "Ordinal is insufficient, but 'cardinal' doesn't mean 'objective psychological measurement'."
      *   *Wait, re-reading the prompt:* The user bets on the misconception "interpersonal comparisons need cardinal utility." Is this a misconception? In technical welfare economics, yes, you need more than ordinal. But often people mean "cardinal" as in "measurable like height." I need to clarify that *comparability* is the issue, not just cardinality. Actually, the prompt implies this *is* a misconception to be headed off. I should interpret this as: People think "If utility isn't cardinal (measurable), we can't compare." But the deeper issue is the *zero point* vs. *unit size*. I will address this in the Levels vs. Differences section.
      *   *Refining the "Money" misconception:* People think $100 means the same to everyone. I need to kill this early.

      *(Self-Correction on Epistemic Status)*: I need to be careful. Among *economists*, the standard view is "IUC are scientifically meaningless without extra assumptions." Among *philosophers*, many argue they are meaningful. I must distinguish between "Standard Micro Model" (Settled) and "Normative Validity" (Contested).

  9.  **Finalizing the Assessment Question:**
      *   Needs to test Levels vs. Differences.
      *   Scenario: A policy takes from A to give to B.
      *   Question: What specific information do you need to justify this if you only care about total welfare vs. if you care about who is worse off?

  10. **Review against constraints:**
      *   Teaching plan only? Yes.
      *   Spine: Levels vs. Differences? Yes.
      *   Single example? Yes (Weekend Days).
      *   Misconceptions addressed? Yes.
      *   What to leave out? Yes.
      *   Settled vs. Contested? Yes.
      *   Final Question? Yes.

  11. **Drafting the Content:** (Mental check of the flow)
      *   Intro: Utility is a ranking, not a score.
      *   Example: Weekend days.
      *   Levels: Who is happier? (Need common zero).
      *   Differences: Who gains more? (Need common unit).
      *   Misconceptions woven in.
      *   Conclusion: The "Extra Assumption" requirement.

      *Wait, one nuance on the "Cardinal" misconception.* The prompt lists "interpersonal comparisons need cardinal utility" as a misconception to head off. Technically, comparing *differences* *does* require cardinal unit comparability. Comparing *levels* requires cardinal full comparability. Ordinal utility allows neither. So why is it a misconception? Perhaps the misconception is that "Cardinal Utility" (in the VNM sense) automatically grants Interpersonal Comparability. It doesn't. I can have cardinal utility that is unique up to positive affine transformations *individually*, but without a link between individuals, I still can't compare. I will clarify this distinction: *Intrapersonal* Cardinality $\neq$ *Interpersonal* Comparability.

      *Let's refine the "Money" misconception.* Money is not utility. Marginal utility of income differs.
      *Let's refine the "Happiness" misconception.* Utility is preference satisfaction, not dopamine.

      *Okay, ready to write.*
answer: |-
  # Teaching Plan: The Spine of Interpersonal Utility Comparisons

  **Session Goal:** Move participants from "utility is a personal score" to "utility comparisons require specific, non-trivial assumptions about zero-points and units."
  **Time Allocation:** 90 Minutes
  **Core Spine:** The distinction between comparing **Levels** (who is better off?) vs. **Differences** (who gains/loses more?).

  ---

  ## I. Pre-Session Setup (The "Do Not Say" List)
  *Before you begin, explicitly bracket these topics. Tell the group you are leaving them out not because they are unimportant, but because they obscure the logical spine of today's session.*

  1.  **Leave Out:** **Neuroeconomics/Biological Markers.** (e.g., "fMRI scans of happiness").
      *   *Why:* It tempts people to think the problem is technological ("we just need better scanners") rather than conceptual ("what does the number mean?").
  2.  **Leave Out:** **Specific Social Welfare Functions.** (e.g., Rawlsian Max-Min vs. Utilitarian Sum).
      *   *Why:* You can't choose a function until you know what inputs are permissible. Focus on the inputs first.
  3.  **Leave Out:** **History of Thought.** (e.g., Robbins vs. Harsanyi).
      *   *Why:* It dates the problem. Treat this as a live logical puzzle, not a history lesson.

  ---

  ## II. The Carrying Example: "Weekend Days Off"
  *Use this single example for the entire session. Do not switch to money, health, or food.*

  *   **The Setup:** Two people, **Alice** and **Bob**. The good is **Days Off per Month**.
  *   **What it HAS:**
      *   **Monotonicity:** Everyone agrees more days off is better than fewer.
      *   **Intangibility:** It is not a currency. It cannot be transferred directly (Alice cannot give Bob her day off without management approval/policy change).
      *   **No Natural Zero:** "0 Days Off" is not death or non-existence. It is just a very bad month. This prevents smuggling in a "natural" zero point.
  *   **What it LACKS:**
      *   **No Price:** Do not mention wages or buying days off. This prevents the "Money = Utility" error.
      *   **No Biological Baseline:** Do not discuss stress hormones. This prevents the "Happiness = Biology" error.

  ---

  ## III. Session Sequence & Misconception Management

  ### Phase 1: The Ordinal Baseline (0–20 mins)
  **Goal:** Establish that standard utility is a ranking, not a measurement.
  **Activity:** Ask the group to rank three bundles of days off for Alice (e.g., 2 days, 4 days, 6 days).
  **Key Point:** We can say $U(6) > U(4) > U(2)$. We cannot say $U(6)$ is "twice as good" as $U(3)$.

  *   **Head Off Misconception #1: "Utility just means happiness."**
      *   *When:* Immediately upon defining utility in Phase 1.
      *   *How:* State clearly: "In this model, Utility is an index of **preference satisfaction**, not a psychological state like joy or dopamine. Alice might prefer 6 days off stoically, and Bob might prefer 4 days off ecstatically. The utility number tracks the *ranking*, not the *feeling*."

  ### Phase 2: The Level Problem (20–45 mins)
  **Goal:** Show why we cannot compare *who is better off* without a common zero.
  **Activity:** Alice has 4 days off. Bob has 2 days off. Is Alice "better off" than Bob?
  **Discussion:**
  1.  Most will say "Yes, 4 > 2."
  2.  **Intervention:** Remind them utility is ordinal. Alice's "4" is just a label for her 2nd favorite option. Bob's "2" is a label for his 3rd favorite option.
  3.  **The Spine:** To compare **Levels**, we need to know where their scales start relative to each other. Does Alice's "worst possible month" equal Bob's "worst possible month"?
  4.  **Conclusion:** Without a agreed-upon **Zero Point** (a state of equal well-being for both), level comparisons are mathematically undefined in standard micro.

  *   **Head Off Misconception #2: "Money is a neutral proxy."**
      *   *When:* When someone inevitably asks, "But what if we paid them for the days?"
      *   *How:* Shut this down hard. "If we use money, we assume $1 gives Alice the same utility as $1 gives Bob. That is exactly the assumption we are testing. Using money begs the question. Stick to the days."

  ### Phase 3: The Difference Problem (45–70 mins)
  **Goal:** Show why we cannot compare *gains and losses* without a common unit.
  **Activity:** A policy moves Alice from 4 days $\to$ 5 days. It moves Bob from 2 days $\to$ 1 day. Is this a net gain for society?
  **Discussion:**
  1.  Alice gains 1 day. Bob loses 1 day.
  2.  **The Spine:** To compare **Differences**, we need to know if their "degrees" are the same size. Does Alice's jump from 4 to 5 represent the same *increase in satisfaction* as Bob's drop from 2 to 1?
  3.  **Nuance:** Even if we fix the Zero Point (allowing Level comparisons), we still need to fix the **Unit Size** to compare Differences.
      *   *Analogy:* Celsius vs. Fahrenheit. You can compare temperatures (Levels) if you convert, but you can't compare *changes* in heat energy without knowing the scale factor.
  4.  **Conclusion:** Comparing Differences requires **Cardinal Unit Comparability**. Comparing Levels requires **Cardinal Full Comparability**. Standard ordinal utility allows neither.

  *   **Head Off Misconception #3: "Interpersonal comparisons need cardinal utility."**
      *   *When:* During Phase 3.
      *   *How:* This is the most technical correction. Clarify: "It is true that ordinal utility isn't enough. But having 'cardinal utility' *individually* (e.g., Alice can measure her own risk) still doesn't let us compare Alice to Bob. We need **Interpersonal** Comparability. That is a separate assumption from cardinality. You can have cardinal utility that is incommensurable across people."

  ### Phase 4: Epistemic Status Check (70–80 mins)
  **Goal:** Distinguish between mathematical constraints and philosophical disputes.
  **Script:**
  *   **Settled (Standard Micro):** Within the axioms of standard ordinal microeconomics, interpersonal comparisons are **meaningless**. There is no mathematical operation to compare $U_{Alice}$ and $U_{Bob}$.
  *   **Contested (Normative/Philosophical):** Whether we *should* add the extra assumptions to make them meaningful.
      *   *View A:* It is scientifically dishonest to make these comparisons (The Robbins view).
      *   *View B:* We make them implicitly in all policy, so we should make them explicit (The Harsanyi/Sen view).
      *   *View C:* We can use "partial" comparisons (e.g., we know starvation is worse than a headache for anyone) without full cardinality.
  *   **Instruction:** "Do not let anyone in the group claim the 'Settled' view proves comparisons are impossible in reality. It only proves they are impossible *within the specific model* we just used."

  ### Phase 5: Assessment (80–90 mins)
  **Goal:** Verify they understand the distinction between Levels and Differences.

  **The Final Question:**
  > "Imagine we agree on a 'Zero Point' (we both agree on what a 'life not worth living' looks like for Alice and Bob), but we do **not** agree on the size of the units (how much satisfaction each additional day off adds).
  >
  > **Which of the following statements can we now make, and which must we still reject?**
  > 1. 'Alice is worse off than Bob.'
  > 2. 'Alice would benefit more from an extra day off than Bob would.'"

  **Correct Answer Key (For You):**
  *   **Statement 1 (Levels):** **Permissible.** If you share a Zero Point, you can compare levels (like comparing heights from sea level).
  *   **Statement 2 (Differences):** **Must Reject.** Without agreeing on the Unit Size (the "cardinal" scale), you cannot compare the *magnitude* of the gain.
  *   *Why this works:* If they say "Both are okay," they conflated Levels and Differences. If they say "Neither," they missed the Zero Point concession. If they get this split right, they have mastered the spine.

  ---

  ## IV. Facilitator Notes: Handling Pushback
  *   **If they argue "Obviously Alice is happier with more days":** Remind them of the "Stoic vs. Ecstatic" distinction from Phase 1. We are modeling *preference satisfaction*, not mood.
  *   **If they argue "We do this in policy all the time":** Agree. Then ask, "What extra assumption are you making to do that?" Force them to articulate the hidden cardinality.
  *   **If they get stuck on the Math:** Drop the affine transformation talk. Stick to the "Ruler" analogy. (Do we start measuring from the same spot? Are our inches the same size?)

  ## V. Summary of Epistemic Claims
  *Ensure you state these explicitly so participants don't leave thinking economics has "solved" philosophy.*

  1.  **Settled:** Standard ordinal utility theory does not contain the machinery for IUC.
  2.  **Settled:** Money is not a valid proxy for utility across persons (diminishing marginal utility of income).
  3.  **Contested:** Whether human psychology is sufficiently similar to justify IUC for policy purposes.
  4.  **Contested:** Whether "Level" comparisons are ethically more defensible than "Difference" comparisons (Prioritarianism vs. Utilitarianism).
