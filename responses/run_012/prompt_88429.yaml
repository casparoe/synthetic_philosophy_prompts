answer: |-
  It is completely understandable why that phrase is driving you up the wall, because you have stumbled onto one of the most versatile rhetorical shields in the history of science. The quote is usually attributed to the statistician George Box, and like many aphorisms, it compresses several distinct philosophical claims into a single sentence that sounds like wisdom but functions like a wildcard. When you see it used to defend two opposite positions, it is because the speakers are relying on different definitions of what wrong means and what useful implies. To make sense of the argument you witnessed, it helps to unpack the sentence into a menu of specific claims, ranging from the boringly obvious to the philosophically explosive.

  The first and most basic reading is simply that no model is a perfect copy of the world. This is trivial and true by definition. A model is by nature a reduction of reality, much like a map is a reduction of a territory. If a model were a perfect copy, it would be as large and complex as the universe itself and therefore useless. Everyone who studies modeling agrees on this point, including both the people you saw arguing online. When the climate model defender used the quote, they were likely leaning on this trivial truth to say that having grid squares that are too big is just a necessary simplification, not a fatal flaw. They are arguing that the model is an approximation, and while the approximation is technically wrong in its details, it captures enough of the underlying physics to be useful for predicting broad trends. This is a substantive and defensible position that most scientists accept, provided the simplifications do not alter the core outcome.

  The second reading moves into more contentious territory by claiming that every model distorts something and the only question is whether the distortion is harmless. This is substantive and generally defensible, but it requires work to prove. It shifts the burden from proving the model is true to proving that the specific falsehoods do not matter for the specific question being asked. This is likely what the climate defender was also hinting at, suggesting that the resolution of the grid squares is a harmless distortion for the purpose of long-term temperature projections, even if it fails to predict local weather. This is not trivial because it requires evidence to show the distortion is indeed harmless, but it is a standard part of scientific practice.

  The third reading is the one the economic model defender was almost certainly using, and this is where the controversy lies. This reading claims that a model's assumptions do not have to be realistic as long as it predicts well. This is the instrumentalist view, famously associated with the economist Milton Friedman. Under this reading, assuming perfect information is not a bug but a feature, because it simplifies the math to produce a prediction about aggregate behavior, even if no actual human has perfect information. This is not trivial, and it is not settled science. It is a genuine, arguable position that is treated as common sense by some economists and as obviously wrong by others. Critics argue that if the assumptions are false, the model might get the right answer for the wrong reason, which makes it fragile when conditions change. So while this reading is defensible within certain schools of thought, it is not a consensus view across all sciences.

  The fourth reading is even stronger and claims that a model can be useful without being true anywhere. This suggests that the internal logic of the model does not need to correspond to any actual mechanism in the real world. This is substantive and highly contested. In physics and climate science, this is often rejected because understanding the causal mechanism is considered part of the utility. In some areas of finance or machine learning, however, this view is more common, where a black box that predicts prices is valued even if no one understands why it works. If the economic arguer was implying that the mechanism of perfect information doesn't need to exist at all for the model to have value, they were taking this harder line.

  The fifth and most extreme reading is that calling a model a tool means questions of truth do not apply to it at all. This is the anti-realist position. It suggests that models are not even trying to describe reality, so asking if they are true is a category error. Many scientists and philosophers would consider this flat-out false or at least misleading in a practical context. When a model is used to set interest rates or carbon taxes, it is making a claim about how the world works, and truth matters immensely. If the model is fundamentally untrue, the policy based on it might fail catastrophically. This reading is often used to shut down criticism, but it does not hold up well when the stakes involve real-world intervention.

  To answer your specific question about who was using which version, the guy defending the perfect-information economic model needed the third reading, that assumptions do not have to be realistic as long as predictions hold. He was using the quote to bypass the criticism that humans are not rational calculators. He was treating the model as an instrument for prediction rather than a description of human psychology. This is a contested view, not a settled one, and his opponents were right to point out that false assumptions can lead to brittle models. The guy defending the climate projection was using the second reading, that every model distorts something and the question is whether the distortion is harmless. He was arguing that the grid size is a known simplification that does not invalidate the broader utility of the projection. This is a more standard scientific defense and relies on the trivial truth that all models are simplifications, but it requires evidence that the simplification is acceptable.

  The reason you feel like something is being sold to you as consensus when it is not is because the phrase all models are wrong blurs the line between the trivial reading and the instrumentalist reading. Everyone agrees models are simplifications, so when someone says all models are wrong, you nod along. But then they slide into the claim that therefore the assumptions do not matter, which does not follow logically. The settled view among people who study this stuff is that models are approximations and must be validated against data. The contested view is whether a model with demonstrably false assumptions can be trusted solely because it has predicted well in the past. The economic arguer was treating the contested view as a settled fact to win the argument, while the climate arguer was using the settled view to defend against a nitpick. The sentence itself is not a logical argument but a reminder to judge models by their purpose, yet people use it to avoid judging the models at all.
