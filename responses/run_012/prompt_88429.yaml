  I got into a stupid argument online about economic forecasting and I can't stop thinking about it. Someone had posted a model where everybody in the market has perfect information and reacts instantly to everything, and when people pointed out that no actual human works like that, he said "all models are wrong, but some are useful" like that settled it. Then a few days later I saw the exact same sentence used the other way round, by a guy saying we shouldn't trust a climate projection because its grid squares are too big, and someone else fired the sentence back at him to shut him up. Same words, doing what looks like opposite jobs. I can't tell if that's because the line is just vague or because I'm missing something real.

  Can you lay out the different precise things that sentence could actually be claiming, from the ones that are basically true by definition up through the ones that would be a genuine, arguable position. Like: no model is a perfect copy of the world; a model can be useful without being true anywhere; a model's assumptions don't have to be realistic as long as it predicts well; calling a model a "tool" means questions of truth don't apply to it at all; every model distorts something and the only question is whether the distortion is harmless. For each reading, tell me whether it's trivial, substantive and defensible, or flat-out false, and then say which reading the guy defending the perfect-information model actually needed, and which one the guy attacking the climate grid was using. I want it as a menu of options with verdicts, not a lecture that picks one and explains it.

  Please be careful to separate what's actually settled among people who study this stuff from what's genuinely contested. I have a feeling the "assumptions don't matter, only predictions" reading gets trotted out as common sense by some people and treated as obviously wrong by others, and I don't want a contested view sold to me as the consensus.

  Also, write it as continuous prose, please — no headings, no bullet points, no bold, no tables. Just write it out the way you'd explain it in an email to me.
