answer: |-
  # Joint Statement on the Boundary Problem

  ### Agreed Claims

  1. The boundary problem is constitutive, not procedural, because any procedure to decide the demos presupposes a demos.
  2. Both principles aim to resolve the legitimacy deficit inherent in collective decision-making.
  3. In the river case, the upstream state's citizens are members of the demos under both principles.
  4. The downstream states suffer significant material harm from the dam without holding legal standing in the upstream state.
  5. The fourth state holds legal obligations stemming from the upstream state's decision via treaty incorporation.
  6. A decisive objection to either principle must show it systematically excludes those owed justification or includes those owed no justification.
  7. Neither principle can be implemented without a prior meta-decision about which principle to use.
  8. The graduated inclusion hybrid distinguishes between influence over outcomes and authority over rules.
  9. Both sides agree that being affected without being subjected creates a moral hazard for the upstream state.
  10. Both sides agree that being subjected without being materially affected creates a formal obligation without immediate interest.
  11. We agree that the current deadlock stems from differing accounts of what makes coercion distinctive.
  12. We agree that this document does not resolve the boundary problem but maps the exact geometry of our stalemate.

  ### Residual Disagreements

  | Question | All-Affected Answer | All-Subjected Answer | Crux |
  | :--- | :--- | :--- | :--- |
  | **Do downstream states belong in the demos?** | Yes, because the dam alters their interests and welfare significantly. | No, because the upstream state holds no authoritative power over them. | Is the right to vote grounded in welfare impact or political authority? |
  | **Does the fourth state belong in the demos?** | No, unless treaty incorporation causes measurable material impact beyond legal form. | Yes, because the treaty legally binds them to the upstream state's standards. | Does legal binding without material impact trigger democratic rights? |
  | **Is the graduated inclusion hybrid acceptable?** | No, because voice without vote fails to protect affected interests against overriding. | Yes, because it matches the level of inclusion to the level of legal subjection. | Is voting an all-or-nothing right or scalable according to status? |
  | **Who decides the boundary initially?** | The existing demos must expand until all affected are included. | The existing demos must界定 boundaries based on existing legal jurisdictions. | Is the starting point for correction moral interest or legal fact? |

  ### Cruxes

  The first sub-question concerns the nature of the democratic wrong. The all-affected camp holds that the wrong is harm without consent, meaning downstream states are victims of domination regardless of legal borders. The all-subjected camp holds that the wrong is coercion without representation, meaning downstream states are merely unfortunate neighbors unless the upstream state claims authority over them. If the all-affected side can be convinced that harm without legal enforceability is not a democratic deficit but a foreign policy issue, they would move toward the subjected view. Conversely, if the all-subjected side admits that de facto coercion via environmental destruction functions like law, they would move toward the affected view.

  The second sub-question concerns the normative weight of treaties. The all-subjected camp treats the fourth state's treaty obligations as sufficient grounds for membership because they are bound by rules they did not make. The all-affected camp views this as formalistic unless the treaty actually impacts the fourth state's citizens' interests. If we settle that treaty incorporation counts as "subjection" sufficient for voting rights even without physical impact, the all-affected side must either expand their definition of "affect" to include legal constraints or accept an exclusion they find unjust. This tests whether "subjection" is merely a subset of "affect" or a distinct category.

  The third sub-question concerns the viability of the graduated inclusion hybrid. The all-affected camp fears that voice without vote is paternalistic and leaves downstream states vulnerable to the upstream state's goodwill. The all-subjected camp sees it as a precise calibration that grants influence proportional to legal binding without dissolving sovereignty. If the all-subjected side concedes that voice without vote is insufficient to remedy the specific wrong of being affected, the hybrid collapses into full inclusion for downstream states. If the all-affected side concedes that full voting rights for non-subjects undermines the coherence of the state, the hybrid becomes the necessary compromise.

  ### Prospective Tests

  **Test 1 (Nature of the Wrong):** We agree to examine the case of extraterritorial digital surveillance where citizens of State X are monitored by State Y without legal recourse. The all-affected side predicts the river case requires full voting rights for downstream states because surveillance like damming is coercive impact. The all-subjected side predicts the river case requires no voting rights for downstream states, supporting the hybrid only if the upstream state claims legal jurisdiction over the water.

  **Test 2 (Treaty Status):** We agree to examine a tax harmonization treaty where State Z must align rates with State Y despite no economic loss. The all-affected side predicts the fourth state in the river case should be excluded unless harmonization costs them revenue, treating the treaty as irrelevant to the demos. The all-subjected side predicts the fourth state must be included in the river case, arguing that legal binding via treaty is identical to subjection via domestic law.

  **Test 3 (Hybrid Viability):** We agree to examine a colonial administration where subjects are governed without citizenship. The all-affected side predicts the hybrid fails in the river case because downstream states need veto power over the dam, not just consultation. The all-subjected side predicts the hybrid succeeds in the river case because downstream states deserve consultation on cross-border effects but not sovereignty over the upstream state's infrastructure.

  ### Verbal Disputes

  There is a minor terminological overlap regarding the word "coercion," which the all-affected side uses to describe causal impacts like water flow changes, while the all-subjected side reserves it for authoritative commands backed by sanctions. However, this is not merely verbal because it tracks a substantive disagreement about whether democracy is a remedy for suffering or a remedy for rule. If we standardized our vocabulary to distinguish "causal impact" from "normative binding," the disagreement would remain intact because we still disagree on which condition triggers the right to vote. Therefore, the quarrel is not about definitions but about the moral foundations of political membership.
