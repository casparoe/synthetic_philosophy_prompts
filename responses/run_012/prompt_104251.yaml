  3.  **Initial Scan for Tensions:**
      *   *Tension A:* (i) vs. (ii). (i) says the doubt is idle because the practice commits us to a world of objects *that are there*. (ii) says we can only show we must *believe* it, not that it's *true*. If the world is independent (Realism), showing we must believe in it doesn't show it exists. So (i) seems to claim more than (ii) allows.
