      *Let's assemble.*

      *(Final check on British English)*: "defence", "honour", "programme", "modelling", "centre". Phrasing like "whilst", "shall", "maths".

      *(Final check on Question Count)*: 10 questions total.

      *(Final check on Follow-ups)*: Each question needs a follow-up keyed to the likely answer.

