prompt: |-
  Right, so — I've been running a tiny philosophy-of-rationality podcast for a few years now, basically an excuse to get the sort of guests I used to argue with in LessWrong comment threads into a room and ask them things properly, and next month I'm interviewing a philosopher whose whole shtick is that diachronic rationality is a myth. Her line is roughly this: all the norms that actually bind you are norms on a single time-slice (or a single decision, or a single evaluation of a whole plan), and every money-pump argument against cyclic preferences gets its force by sneaking in an extra requirement — that you keep your preferences stable across time, or that you honour a policy you adopted earlier — which is itself not a requirement of rationality. So intransitive preferences are fine; what's irrational is being naive enough to let someone walk you round the loop.

  She's good at this, and she'll happily spend twenty minutes on the mechanics if I let her, which I don't want — I want to actually pressure the view. Can you draft me nine or ten questions, each with a follow-up keyed to the answer she's most likely to give? Please make sure there's at least one question on the naive/sophisticated/resolute chooser distinction (does the agent fail to see the loop coming, see it and refuse the first step, or adopt a plan and stick to it?) and whether the pump needs naivety to bite at all; at least one on whether there's any distinct diachronic norm left standing on her view, or whether it all collapses into synchronic rationality applied to plans and precommitments; and at least one on what her view does to the diachronic Dutch book arguments people trot out to justify Bayesian conditionalization — if money pumps don't bind, does that whole story come apart too, and does she accept that cost?

  Other things I'd love covered, in whatever order flows: whether the expected-utility axioms (transitivity, completeness) are meant to be normative, descriptive, or constitutive of preference in the first place, and what's left of them on her account; whether cyclic preferences are exploitable in ways that matter outside a literal pump — markets, evolutionary selection, repeated games, the person who just keeps making the small trade forever; the case where every individual step looks fine to you and you still end up somewhere awful, and whether she can still say anything was irrational there; what would actually count against her view, if anything; and the practical upshot — is this liberating (stop agonising about consistency) or deflationary (nothing normative left to say about the person who keeps changing her mind)?

  I'd like the last question to be the one I'm most nervous about, the one that makes her give her weakest answer — something that corners her between "that's a diachronic norm after all" and "that's not irrational", if you can find one. Keep the questions in a register a smart non-philosopher listener can follow, but don't water down the content, the whole point is definately to get in the weeds. British English throughout please — I'm not in the US and my listeners will notice the spelling.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy-of-rationality podcast host interviewing a philosopher who argues that *diachronic rationality is a myth*.
      *   **Guest's Position:** All rational norms are synchronic (single time-slice/decision). Money-pump arguments fail because they rely on an unjustified norm of stability/policy adherence. Intransitive preferences are fine; being naive is the problem.
      *   **Goal:** Draft 9-10 questions with follow-ups (keyed to likely answers) to pressure this view.
      *   **Specific Requirements:**
          *   Include naive/sophisticated/resolute chooser distinction.
          *   Address whether any diachronic norm remains or if it collapses into synchronic rationality of plans.
          *   Address diachronic Dutch book arguments for Bayesian conditionalization.
          *   Cover: Expected-utility axioms (normative/descriptive/constitutive), exploitation outside literal pumps (markets/evolution), stepping-stone cases (individual steps fine, outcome awful), falsifiability (what counts against her?), practical upshot (liberating vs. deflationary).
          *   **Final Question:** The "killer" question that corners her between admitting a diachronic norm or denying irrationality in a compelling case.
          *   **Tone/Style:** Smart non-philosopher accessible but deep ("in the weeds"), British English spelling/usage.

  2.  **Deconstruct the Guest's View (The "Synchronic Only" Stance):**
      *   *Core Claim:* Rationality is about making the best choice *now* given current beliefs/desires. Past commitments don't bind unless you currently desire to honour them.
      *   *Money Pump Defense:* You only lose money if you are *naive* (don't see the loop). If you are sophisticated, you stop at step 1. Therefore, no pump, no irrationality in the preferences themselves.
      *   *Implication:* Dynamic inconsistency isn't irrational; it's just a change in preference.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Core Claim & Money Pumps.* Start by clarifying the central thesis.
          *   *Follow-up:* If she says "Naivety is the vice," push on whether naivety is a cognitive failure or a rational one.
      *   *Q2: Naive/Sophisticated/Resolute.* (Required). Distinguish the types of choosers.
          *   *Follow-up:* If she says "Sophistication solves it," ask about the cost of sophistication (paralysis).
      *   *Q3: Expected Utility Axioms.* Are transitivity/completeness norms or definitions?
          *   *Follow-up:* If she says "Constitutive," ask how we measure preference without them.
      *   *Q4: Real World Exploitation.* Markets/Evolution.
          *   *Follow-up:* If she says "Markets punish it," ask if that makes it irrational or just expensive.
      *   *Q5: The "Death by a Thousand Cuts".* Individual steps look fine, outcome awful.
          *   *Follow-up:* If she says "Each step was rational," ask about the agency over time.
      *   *Q6: Diachronic Norms/Precommitment.* (Required). Does it collapse into synchronic evaluation of plans?
          *   *Follow-up:* If she says "Yes, evaluating plans," ask what makes a plan *unified* over time.
      *   *Q7: Bayesian Conditionalization.* (Required). Dutch Book arguments.
          *   *Follow-up:* If she accepts the cost, ask if belief updating is just another preference.
      *   *Q8: Practical Upshot.* Liberating or Deflationary?
          *   *Follow-up:* If liberating, ask about advice-giving.
      *   *Q9: Falsifiability.* What would change her mind?
          *   *Follow-up:* If "Nothing," charge dogmatism.
      *   *Q10: The Killer Question.* (Required). Needs to corner her.
          *   *Idea:* Use a case where the *only* reason to stop is the past commitment, but the current self wants to continue. Or, the "Self-Torturer" case. Let's go with a case where *predicting* your future self is necessary for current rationality, implying a norm of stability.
          *   *Refinement:* The "Toxin Puzzle" or a specific "Ulysses" case where the *only* rational move relies on a binding norm. Let's try the "Rational Neglect" angle. If I know I'll change my mind, am I irrational *now* for planning as if I won't?
          *   *Better Killer:* The "Advice to Past Self" case. If your future self wouldn't listen to your current self, is your current self irrational for trusting? No, let's go with the *planning agency* argument. If you can't bind yourself, can you really *act* over time?
          *   *Best Killer:* The "Guaranteed Loss without Naivety" case. Is there a pump that works even on a sophisticated agent? (Actually, that's technical). Let's go with the *normative force of prediction*. If I know I will violate my plan, is forming the plan irrational? If yes, planning is irrational. If no, there's a diachronic norm.

      *   *Wait, let's refine the "Killer" based on the prompt's specific instruction:* "corners her between 'that's a diachronic norm after all' and 'that's not irrational'".
      *   *Scenario:* A case where failing to stick to a plan seems intuitively irrational (e.g., quitting a life-saving treatment because of temporary pain), but on her view, the current pain outweighs the future benefit *now*.
      *   *The Trap:* If she says "It's rational to quit," she looks absurd. If she says "It's irrational," she admits a diachronic norm (future benefit binding current choice).
      *   *Let's polish this:* The "Surrender the Secret" case. You adopt a policy to protect a secret. Later, torture/threat. Current self wants to talk. Is it irrational to talk?

      *   *Actually, the prompt asks for British English.* Need to ensure spelling (honour, programme, centre, etc.) and phrasing ("maths", "whilst", "shall").

  4.  **Review against Constraints:**
      *   9-10 questions? Yes.
      *   Follow-ups included? Yes.
      *   Naive/Sophisticated/Resolute covered? Yes (Q2).
      *   Diachronic norm collapse covered? Yes (Q6).
      *   Bayesian/Dutch Book covered? Yes (Q7).
      *   EU Axioms covered? Yes (Q3).
      *   Exploitation/Markets covered? Yes (Q4).
      *   Steps fine/Outcome awful covered? Yes (Q5).
      *   Falsifiability covered? Yes (Q9).
      *   Practical Upshot covered? Yes (Q8).
      *   Killer Question last? Yes (Q10).
      *   British English? Yes.
      *   Tone: Smart, accessible, pressing.

  5.  **Drafting the Content (incorporating British spelling and tone):**
      *   *Self-Correction on Tone:* Avoid being overly aggressive, but be persistent. "Pressure the view" means probing weaknesses, not shouting.
      *   *Self-Correction on Follow-ups:* Make sure they anticipate the *most likely* defensive move (e.g., "It's just a synchronic evaluation of the whole sequence").

      *(Self-Correction during drafting Q10)*: I need to make sure Q10 is truly the weakest point. The weakest point for synchronic theorists is usually *planning agency*. If I can't rely on my future self, I can't effectively act *now*. If she says "You just have to accept you can't act over time," that's the deflationary cost. If she says "You can act," she needs a norm.
      *   *Revised Q10:* Focus on the *formation* of the intention. If I intend to X tomorrow, but I know I won't, is my intention insincere or irrational?

      *   *Let's try the "Rational Precommitment" trap.* If I pay to restrict my future choices, was that cost rational? If yes, why? Because my future self is irrational? But she says future self is just different. So why pay to stop a rational future self?
      *   *Yes, this is the one.* The "Costly Precommitment" paradox.

  6.  **Final Polish:** Check spellings (honour, behaviour, programme, centre, modelling). Ensure the flow is logical. (Start with basics, move to implications, end with the trap).

      *   *Q1:* Money Pump mechanics.
      *   *Q2:* Naive/Sophisticated (Required).
