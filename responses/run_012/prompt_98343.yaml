      *   *Goal:* $H$ learns the truth/optimal action even if $H$ can't verify it directly.
      *   *Mechanism:* $AI_1$ makes claim, $AI_2$ challenges. Recursion down to verifiable facts.
      *   *Threat:* Obfuscation. $AI_{dishonest}$ creates a chain of reasoning $C$ where every step *looks* plausible to $H$, but the chain is flawed. $AI_{honest}$ tries to point out the flaw. $H$ can't tell if $AI_{honest}$ is pointing out a real flaw or just nitpicking a valid complex proof.
      *   *Optimist View:* With enough cross-exam, feature visualization, and recursive decomposition, the honest side can always isolate the error faster than the dishonest side can hide it. (Complexity of verification < Complexity of generation).
      *   *Pessimist View:* If $AI \gg H$, the $AI$ can exploit cognitive blind spots of $H$. The search space for "plausible-sounding lies" is larger than the search space for "definitive debunkings" accessible to $H$.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. "Joint Statement on Obfuscation Risks in AI Debate."
