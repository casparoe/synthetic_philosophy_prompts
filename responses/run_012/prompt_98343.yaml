      *   **Section 3: Cruxes & Tests:**
          *   *Crux 1: Search Space Asymmetry.* Is it harder to find a lie or find the flaw in the lie?
          *   *Crux 2: Judge's Meta-Reasoning.* Can the judge evaluate the *structure* of the argument even if not the *content*?
          *   *Crux 3: Recursion Depth.* Does breaking it down help the judge, or does it just create more surface area for obfuscation?
          *   *Toy Case:* The user suggested a "fixed token budget, pile of tangled arguments" scenario. Let's refine that. Let's call it the "Needle in a Haystack of Proofs" scenario.
          *   *Predictions:* Optimist says Honest win rate $\to$ 1 as protocol tightens. Pessimist says Honest win rate $\to$ 0.5 (random guess) or worse as capability gap widens.
      *   **Section 4: Verbal Disputes:**
