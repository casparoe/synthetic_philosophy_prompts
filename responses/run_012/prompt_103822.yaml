          *   The "Doctrinal Paradox" here isn't about logical inconsistency in the collective output (since they eventually reach consistency), but about the *path* to consistency requiring the dismantling of the initial premise set.

      *   **Main Body - Part 2: Reading the Light in the Light of the Film:**
