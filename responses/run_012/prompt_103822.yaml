      *   *Refinement on "Reasoning Backward":* The prompt asks if they reason backward from a verdict. Juror 8 starts with "I don't know" (Not Guilty vote effectively, but epistemically suspended). He doesn't have a verdict; he has a doubt. This is crucial. It's not reasoning backward from a *conclusion*, but reasoning backward from a *requirement of certainty*.
