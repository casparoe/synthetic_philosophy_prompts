answer: |-
  The slogan "you can't get an ought from an is" is perhaps the most famous shorthand in moral philosophy. It is frequently invoked to halt lines of inquiry that appear to reduce normative questions to empirical ones. In the context of machine ethics, specifically regarding models trained to predict human approval, the slogan serves as a boundary marker. Your colleague used it to argue that inferring what a system ought to do from facts about what people approve of is confused at the root. To evaluate this intervention, we must disentangle the slogan from its rhetorical force and examine the specific philosophical theses it might encode. The slogan is not a single claim but a family of claims ranging from trivial logical observations to radical metaphysical assertions. By ordering these readings from the trivial to the radical, we can determine which one your colleague is entitled to and whether it supports his strong conclusion that the project is impossible in principle.

  The first and most literal reading interprets the slogan as a thesis about **logical validity**. On this view, no valid deductive argument can have premises that are purely descriptive and a conclusion that is genuinely normative. If the premises contain no normative vocabulary, and the conclusion does, the inference is formally invalid. This reading treats "is" and "ought" as disjoint semantic categories that cannot cross the barrier of a validity check.

  However, this reading is technically trivial and easily undermined by logical tricks. In classical logic, one can construct a valid inference from a descriptive premise to a normative conclusion through weakening or disjunction introduction. Consider the argument: "The sky is blue; therefore, the sky is blue or one ought to maximize utility." This inference is valid; the conclusion follows necessarily from the premise. Yet, it clearly does not derive a substantive normative truth from a descriptive fact. It merely tacks a normative disjunct onto a fact. To save the logical thesis from triviality, one must restrict it to *relevant* inferences or insist that the normative content of the conclusion must be supported by the premises, not merely compatible with them.

  Furthermore, this logical reading fails to block your colleague's target because it ignores the role of bridging premises. An argument about machine ethics rarely moves directly from "people approve of X" to "the machine ought to do X." It typically relies on a suppressed major premise: "One ought to do what people approve of." With this bridge, the argument is logically valid. Your colleague's objection is not that the logic is invalid, but that the bridge itself cannot be established by data. Therefore, the thesis about logical validity is too weak to bear the weight of his conclusion. It rules out bare inference without a bridge, but it does not rule out the use of a bridge, which is where the actual philosophical work is being done.

  The second reading interprets the slogan as a thesis about **meaning or definability**. This is the domain of the so-called Naturalistic Fallacy. Here, the claim is that normative terms like "ought" or "good" cannot be defined synonymously with descriptive terms like "approved" or "desired." If "ought" meant "approved," then the statement "people approve of X, but one ought not do X" would be a contradiction, akin to saying "this is a bachelor, but he is married." Since it seems intelligible to question whether approved actions are truly right, the terms cannot be synonymous.

  This reading is substantive and defensible, but it borders on, and often comes apart from, the Humean slogan. The Naturalistic Fallacy concerns the definition of terms, whereas "you can't get an ought from an is" concerns the derivation of conclusions. One might deny that "good" is defined as "approved" (avoiding the fallacy) while still maintaining that "good" supervenes on "approved" as a matter of synthetic necessity. If such synthetic normative truths exist, one could infer the ought from the is, even if the terms are not synonymous. Consequently, this reading does not fully deliver your colleague's conclusion. It shows that the concept of approval is not identical to the concept of obligation, but it leaves open the possibility that facts about approval provide reliable evidence for obligations via a non-definitional link. To claim the project is "confused at the root," your colleague needs more than a semantic distinction; he needs a block on inference itself.

  The third reading views the slogan as a thesis about **motivation**. Often associated with Hume's theory of action, this claim holds that grasping a fact (a belief) cannot by itself move an agent to act; only a desire or pro-attitude can provide the motivational push. On this view, an "ought" implies a capacity to motivate, and since "is" statements lack motivational force, they cannot generate "ought" statements.

  While influential, this reading is contingent and contested. It relies on a specific psychology of human agency (internalism) that may not apply to artificial systems. A machine does not need to be "moved" in the psychological sense to execute a function; it needs an objective function. Moreover, even in human ethics, externalists argue that one can have a reason to act regardless of one's current desires. If the motivational thesis is false, the slogan loses its grip on this reading. More importantly, even if facts don't motivate, they might still justify. The question in your workshop was about what the model *ought* to do, not necessarily what motivates the designers. Thus, the motivational reading is too anthropocentric to ground a principle impossibility claim about machine ethics.

  The fourth and most radical reading interprets the slogan as a thesis about **knowledge and reasons**. This is the epistemic interpretation: descriptive facts cannot by themselves provide normative reasons for action. To count a fact as a reason for an ought-conclusion, one must already possess a normative principle that confers reason-giving force on that fact. Facts about human approval are inert data until a normative framework declares that human approval is valuable. On this reading, the gap between "is" and "ought" is not a logical chasm but a justificatory one. You cannot justify a normative conclusion solely using descriptive evidence because the evidence only supports the conclusion relative to a prior normative commitment.

  This reading is the strongest candidate for your colleague's position. It acknowledges that valid arguments with normative conclusions are possible (unlike the logical reading) but insists that the crucial premise—the one that turns approval into obligation—cannot itself be derived from description. It relocates the problem rather than solving it: if you add the bridging premise "one ought to satisfy approval," you have introduced a normative claim that requires its own justification. If that justification relies on further facts, the regress continues; if it relies on intuition or stipulation, the project is no longer purely empirical.

  However, even this robust reading does not necessarily prove that the project is "impossible in principle." It proves that the project is not purely descriptive. It raises the cost of the inference by requiring a normative commitment, but it does not block the inference if that commitment is made. Your colleague's claim that the project is "confused at the root" suggests he believes the bridging principle itself is illegitimate or unjustifiable. But the epistemic reading only shows that the bridge is not factual; it does not show that the bridge is false. We can choose to value human approval. If we do, the inference from "people approve" to "the machine ought to do" is sound. The slogan, even on its strongest reading, rules out deriving the *value of approval* from the *fact of approval*, but it does not rule out adopting the value of approval and then proceeding.

  There is a nuance here regarding constitutive rules. In some contexts, "oughts" are derived from "is" statements about institutions. "This is a chess game; therefore, you ought to move the bishop diagonally." This is a valid inference from institutional facts to normative constraints. Your colleague might object that moral "oughts" are not merely institutional. If he assumes that moral obligations must be categorical rather than hypothetical (dependent on a practice), then the institutional model fails. This is a contested assumption. If machine ethics is viewed as designing a tool for a specific human practice (like a chess game), then the "oughts" are constitutive of that practice, and the inference from facts about the practice to norms is permissible. If, however, he assumes machine ethics aims at categorical moral truth, the institutional escape route is closed. He needs this assumption to sustain the "impossible in principle" claim.

  Ultimately, the slogan borders on the Naturalistic Fallacy when it claims values cannot be *defined* by facts, but it comes apart from it when it claims values cannot be *inferred* from facts. Your colleague needs the inference block (Hume) more than the definition block (Moore), because his objection is about the process of learning values from data, not the definition of words. However, he relies on the definition block to make the inference block seem insurmountable. If "ought" and "approved" are distinct concepts, he argues, you cannot cross the gap. But as the epistemic reading shows, you can cross the gap if you build a bridge; you just cannot build the bridge out of the same materials as the ground on either side.

  **Verdict**

  The strongest defensible reading of the slogan is the **epistemic thesis**: descriptive premises cannot justify a normative conclusion without the aid of a normative bridging principle. This reading is not a platitude, nor is it false; it is a substantive claim about the structure of justification. It identifies that data alone is silent on value.

  However, this reading does not deliver your colleague's conclusion that the project is impossible in principle. It demonstrates only that the project is not purely empirical. It blocks the inference only if one insists that the bridging principle must also be derived from data. If the bridging principle is taken as a foundational commitment of the design process (e.g., "we stipulate that the machine should align with human approval"), the inference is valid and the project is coherent. The slogan, properly understood, does not show that reading values off data is confused; it shows that reading values off data is an act of normative adoption, not discovery.

  To tell your colleague exactly where he stands: he is entitled to claim that facts about approval do not *entail* obligations without a prior commitment to the value of approval. He is not entitled to claim that inferring obligations from approval is impossible, only that it is conditional. The slogan raises the cost of the project by forcing an explicit acknowledgment of the normative premise, but it does not bankrupt the enterprise. Unless he can defend the contested assumption that moral obligations cannot be grounded in constitutive rules of a practice or foundational stipulations, his claim that the project is "confused at the root" is an overreach. The gap between "is" and "ought" is a gap in justification, not a wall against construction.
