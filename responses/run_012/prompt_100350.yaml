  1. What the principle commits us to

  The principle commits us to compensating disadvantage arising from "brute luck" (unchosen circumstances) while excluding "option luck" (consequences of chosen risks). You are not judging moral worth, but causal origin. The statute requires us to relieve disadvantages claimants could not reasonably have avoided. To fit a forty-minute review, we preserve three distinctions essential to luck egalitarianism. First, Origin: did the harm arise from the claimant's body/environment or their voluntary action? Flattening this ignores mixed causes, forcing a binary choice where reality is blended. Second, Capacity: was the claimant capable of understanding the risk at the time? We simplify this to age and documented cognitive impairment, losing nuance on temporary incapacity, subtle coercion, or emotional distress. Third, Alternatives: was there a reasonable path to avoid the risk? We treat this as physical availability, not affordability or social pressure, losing the theory's sensitivity to poverty traps and social conditioning.

  The core rule is: Award if the disadvantage was not reasonably avoidable. Refuse if the claimant knowingly ran the risk. "Knowingly" requires information and freedom to choose otherwise. If the file cannot establish whether the risk was knowingly run, the benefit of the doubt goes to the claimant only if the evidence of choice is absent, not merely ambiguous. This procedure sacrifices the theory's depth for administrative consistency, accepting that some hard cases will be decided by proxy rather than deep inquiry. We prioritize consistency over perfect justice in marginal cases, acknowledging that a rule applied evenly is better than a perfect standard applied unpredictably. This approach respects the statutory bar against underwriting risks. It acknowledges that citizens are responsible agents unless proven otherwise. The loss is in the grey areas: the pressured choice, the ignorant risk, the addicted habit. These will be categorized mechanically. You must accept that some deserving claims will be refused because the evidence of non-voluntariness is not in the file. This is the cost of a paper-based system.

  2. The procedure

  1. **Verify Impairment (Mechanical).** Confirm medical assessment shows lasting impairment meeting scheme thresholds. What counts: A clear diagnosis with functional impact. Evidence: Medical report. When silent: Stop and request clarification; do not infer impairment from statements alone. Termination: If no impairment, Refusal. This step ensures statutory eligibility before assessing cause.

  2. **Classify Origin (Evidence-Dependent).** Determine if the primary cause is internal/external circumstance (illness, accident) or behavioral choice (activity, habit). What counts: A clear link between action and injury. Evidence: Claimant statement, medical history. When silent: Assume circumstance (Benefit of Doubt). This protects against penalizing unexplained conditions. Termination: If purely circumstance, go to Step 5. If behavioral, go to Step 3.

  3. **The Choice Test (Evidence-Dependent).** Did the claimant engage in the risk-bearing activity voluntarily? What counts: Admission of action or proof of standard knowledge (e.g., smoking risks, helmet laws). Evidence: Statement, employment history. When silent: Assume standard public knowledge for adults; assume ignorance for minors. Termination: None, proceed to Step 4. This step establishes the baseline of awareness required for responsibility.

  4. **The Voluntariness Test (Values Call).** Could the claimant have chosen otherwise? Consider age at onset, addiction, coercion, or lack of alternatives. What counts: Documented inability to choose (age, medical addiction diagnosis). Evidence: Age, medical notes on addiction, statement on employment options. When silent: Assume voluntary for adults. This is the critical friction point where theory meets paperwork. Termination: If non-voluntary, go to Step 5. If voluntary, go to Step 6.

