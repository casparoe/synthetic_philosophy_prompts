  8. **Final Review (Mechanical).** Check that the reason matches the outcome. What counts: Consistency. Evidence: Draft decision. When silent: N/A. Termination: Sign and dispatch. If Refusal, ensure the "knowingly ran risk" clause is explicitly cited. If Award, ensure "not reasonably avoided" is cited. This procedure is linear. Do not skip steps. The distinction between Mechanical and Values Call is vital: Mechanical steps require no judgement; Values Calls require you to apply the scheme's principles to the facts. Where a step is Evidence-Dependent, you are limited to the file. Do not investigate. If the file is silent, the silence dictates the outcome as specified. This prevents adjudicators from importing personal biases about lifestyle. The Values Call steps are where you ensure the decision survives Tribunal scrutiny. You must write down why you deemed an alternative reasonable. A refusal without this explanation will be overturned. The Chair referral in Step 6 is mandatory for high-stakes value judgements. This protects you and the scheme.

