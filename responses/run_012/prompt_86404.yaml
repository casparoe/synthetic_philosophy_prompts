answer: |-
  Here is a decision tree designed to sort the positions based on the structural commitments you outlined. The questions are ordered to separate the metaphysical claims first, then the mechanical ones, and finally the normative authority.

  ### The Decision Tree

  **Q1. Ontology: Is there a mind-independent fact of the matter about what you "really" want, or is this concept just a useful fiction/tool for decision-making?**
  *   **Just a tool/fiction:** Go to **Leaf A**.
  *   **A fact of the matter:** Go to Q2.

  **Q2. Locus: Where does the authority of this "fact" come from?**
  *   **From Objective Value:** It is true because it tracks what is *actually good*, regardless of your psychology. Go to **Leaf B**.
  *   **From a Hypothetical Judge:** It is true because a perfectly neutral, omniscient *observer* would approve of it. Go to **Leaf C**.
  *   **From Your Psychology:** It is true because it expresses *your* agency, merely improved. Go to Q3.

  **Q3. Fairness of Method: Is the idealization process primarily *subtractive* (removing noise, ignorance, weakness) or *additive* (building new wisdom, virtue, or character)?**
  *   **Subtractive:** We are stripping away errors to reveal the signal underneath. Go to **Leaf D**.
  *   **Additive:** We are growing into a person you aren't yet, potentially changing the signal itself. Go to Q4.

  **Q4. Order of Operations: Do we hold your fundamental values/character fixed and fix your beliefs, or do we allow your values/character to evolve under ideal reasoning?**
  *   **Values Fixed:** We take what you care about now and give you perfect information/logic to pursue it. Go to **Leaf E**.
  *   **Values Evolve:** We let you think longer and become "more the person you wish you were," which may change what you care about. Go to Q5.

  **Q5. Authority: If Ideal-You wants something Actual-You actively rejects, does Ideal-You win?**
  *   **No:** Actual-You retains veto power; idealization is only valid if you currently endorse it. Go to **Leaf F**.
  *   **Yes:** Ideal-You has authority over Actual-You; you can be wrong about your own will. Go to Q6.

  **Q6. Unit: Whose volition is being extrapolated?**
  *   **Individual:** Just yours. (See Note 1 below).
  *   **Collective:** Humanity's, combined into a coherent whole. Go to **Leaf G**.

  ***

  ### The Leaves (Positions)

  **Leaf A: The Deflationary / Pragmatic View**
  *   **Position:** "What you really want" is just a heuristic for resolving current conflicts; there is no hidden deeper self.
  *   **Awkward Commitment:** You have to admit that when you say "I didn't *really* want that," you are speaking metaphorically, not literally.

  **Leaf B: The Objective Goods View**
  *   **Position:** Skip the idealization; there are things that are good for people (health, friendship) regardless of their idealized desires.
  *   **Awkward Commitment:** You must be willing to override a person's fully informed, rational consent if they desire something "objectively" bad for them.

  **Leaf C: The Ideal Observer View**
  *   **Position:** What you should want is what a perfectly neutral, omniscient, disinterested being would approve of for you.
  *   **Awkward Commitment:** The "ideal" agent might be so alien in its neutrality that its approval has no motivational grip on actual humans.

  **Leaf D: Preference Purification (Economics/Revealed Preference)**
  *   **Position:** Your true preferences are what your choices would look like if we removed calculation errors, fatigue, and framing effects.
  *   **Awkward Commitment:** It treats deep moral or character flaws as mere "noise" equivalent to a math error, implying you can't *choose* to be base, only mistaken.

  **Leaf E: The Full-Information / Informed-Desire View**
  *   **Position:** You keep your current values, but you get perfect information and logical consistency; whatever you want then is your true want.
  *   **Awkward Commitment:** If you are currently a villain, the "ideal" version of you is just a perfectly informed villain, which feels like it misses the point of moral growth.

  **Leaf F: Second-Order Desire View (Frankfurt-style)**
  *   **Position:** What you "really" want is determined by which desires you currently endorse upon reflection, not by a hypothetical future self.
  *   **Awkward Commitment:** A brainwashed or addicted person who genuinely endorses their chains counts as "free," because the veto lies with the current self.

  **Leaf G: Coherent Extrapolated Volition (CEV)**
  *   **Position:** The target is what humanity *would* want if we knew more, thought faster, and were more the people we wished we were, converged into a coherent whole.
  *   **Awkward Commitment:** It assumes that if we all became wise enough, we would agree on everything, risking a "tyranny of the wise" over actual diverse humans.

  ***

  ### Analysis of the Tree

  **1. The "Individual + Additive + Ideal Rules" Gap (Q6, Individual Branch)**
  *   **Status:** *Unexplored / Unattractive.*
  *   **Why:** If you answer "Individual" at Q6, but you've already said values evolve (Q4) and Ideal-You wins (Q5), you land on a position often called the **Ideal Advisor Theory**. It occupies the space next to CEV but for a single person. It is rarely defended in isolation because if Ideal-You is sufficiently different from Actual-You (Additive + Authority), it becomes hard to explain why *your* idealization matters more than *anyone's* idealization (sliding toward Ideal Observer or Objective Goods).

  **2. Indistinguishable Leaves: Full-Information (E) vs. Preference Purification (D)**
  *   **Status:** *Hard to Separate.*
  *   **Why:** In practice, these often yield the same results. Both claim to preserve the "true" self by removing errors. The distinction is theoretical: Purification sees desires as revealed by choices (behavioral), while Full-Information sees them as mental states updated by facts (psychological). If you believe logic errors and ignorance are the *only* impediments to rational choice, these two leaves merge.

  **3. The Convergence Assumption (Leaf G vs. Leaf B)**
  *   **Status:** *Potential Collapse.*
  *   **Why:** CEV (Leaf G) relies on the assumption that idealized humans converge. If they converge perfectly on moral truths, CEV becomes functionally identical to the Objective Goods View (Leaf B). If they don't converge, CEV requires a aggregation mechanism (voting? averaging?) that violates the "Coherent" part of the name. The tree separates them by Locus (Internal vs External), but they may touch at the tip.

  **4. The "Fairness" Fork (Q3)**
  *   **Status:** *Critical Split.*
  *   **Why:** This addresses your concern about "adding stuff that isn't true of me."
      *   **Subtractive (Leaf D)** claims fairness: "I'm not changing you, I'm just cleaning the lens."
      *   **Additive (Leaf G)** admits unfairness: "The real you is inadequate, so we are growing a better one."
      *   **Empty Combination:** There is almost no position that is **Additive** (changes values) but claims **Subtractive** fairness (denies changing values). This is the "motte and bailey" move you suspected: theories that promise to just "remove ignorance" (Subtractive) but deliver "moral growth" (Additive). The tree forces them to pick a lane.

  **5. The Authority Veto (Q5)**
  *   **Status:** *The "Alienation" Check.*
  *   **Why:** This separates **Second-Order Desires (Leaf F)** from everything else. If you say Actual-You keeps the veto, you cannot be a CEV proponent or an Objective Goods theorist. This captures your intuition that "idealizing my character might be a different person entirely." Leaf F says: "If it's a different person, it's not *my* want."

  **6. Incoherent Combination: Tool + Binding**
  *   **Status:** *Incoherent.*
  *   **Why:** If you answer "Just a tool" at Q1, you cannot consistently answer "Yes, Ideal-You wins" at Q5. A fiction cannot have normative authority over reality unless you smuggle in a fact claim at Q1. This catches people who want the flexibility of pragmatism with the authority of realism.
