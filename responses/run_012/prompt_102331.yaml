      *   *The Tension:* How can a set be uncountable inside the model but countable outside?
      *   *Resolution:* "Uncountable" means "there is no bijection with $\omega$ *in the model*." The bijection exists outside, but not inside.

  3.  **Drafting the Menu of Interpretations:**

