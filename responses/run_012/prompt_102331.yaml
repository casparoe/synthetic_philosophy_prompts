  I'm in a fourth-year logic/phil-of-math course and there's a guy in my seminar who keeps saying "Skolem's paradox shows that uncountable sets are an illusion." He pulled it out yesterday to argue the continuum hypothesis is basically meaningless, and last week to say Cantor's theorem is "only true relative to a model." I don't think he's flat-out wrong, but I also don't think he knows what he's actually claiming. Can you lay out the different precise things that one-liner could be saying, from the totally trivial model-theoretic reading up through the radical metaphysical one, and for each say whether it's true, whether it's substantive or just a restatement, and whether it actually gets him the conclusion he's using it for? Lay it out as a menu I can bring to his office hours rather than just picking one reading and defending it, and flag the readings that sound deep but collapse into something nobody would deny. Last line: a one-sentence summary of which reading is the strongest and whether it actually supports his continuum hypothesis move.
