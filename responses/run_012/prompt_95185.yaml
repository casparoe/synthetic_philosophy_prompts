              │   └── **ALL-OR-NOTHING** → **[EMPTY NODE: UNATTRACTIVE]**
              │       └── *Incompatible with probabilistic ML architectures (e.g., transformer weights).*
              │
              └── **NO** → **[EMPTY NODE: INCOHERENT]**
                  └── *A causal state that cannot be wrong is a reflex, not a belief.*

  ---
  ### DIAGNOSTIC CASE KEY
  *   **Thermostat:** Tests **Q1/Q3**. (Prediction Yes, Misrep No → Deflationary/Dennett boundary).
  *   **Chess Engine:** Tests **Q1**. (Prediction Yes, Causal No).
  *   **LM Stating False Fact:** Tests **Q3**. (Is this a false belief or token error?).
  *   **Model Reporting Internal State:** Tests **Q2**. (Is this evidence or noise?).
  *   **RL Agent with World Model:** Tests **Q5**. (Does it plan using decoupled representations?).

  ### LOGICAL SPACE NOTES
  1.  **Empty/Incoherent Combinations:** Any path denying **Misrepresentation** while affirming **Belief** is flagged. A state that *cannot* be false fails the normativity condition of belief (Fodor/Millikan).
  2.  **Unexplored/Unattractive:** **Causal Efficacy + All-or-Nothing** is unattractive for ML systems, as their "beliefs" are inherently distributed and probabilistic (degrees).
  3.  **Collapsed Distinctions:** Students often collapse **Dennett** and **Deflationary**. This tree separates them via **Self-Reports (Q2)**: Dennett treats reports as behavioral data to be interpreted; Deflationists treat them as mere tokens without evidentiary weight.
  4.  **Realist Variants:** The **Phenomenal** and **ML-Native Realist** leaves share the **Causal Efficacy** branch but diverge on consciousness, preventing the collapse of "Realism" into "Biological Chauvinism."
