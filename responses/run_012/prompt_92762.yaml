prompt: |-
  Hey — I'm a second-year PhD student, and I'm sitting in on a cross-listed grad seminar (ML people and philosophy-of-mind people in the same room, which is a whole thing), and the prof has this annoying habit of making two of us students each draft an exam question for the take-home final. Mine is the week on eliciting latent knowledge, naturally. Every question I come up with basically invites the canned answer — 'oh, the model might just be a human simulator instead of a direct translator, so you want a translator that reports what the model believes rather than what a human would say' — and then they're done in a paragraph and nobody's learned anything. I want something where that move is the start of the problem, not the end of it.

  So: could you please, as an alignment researcher who also actually knows the philosophy-of-mind side of this, draft one exam question on ELK for PhD students, doable in about 90 minutes of writing? Think it through carefully first, and maybe brainstorm a few candidate cruxes before you commit, because I definately don't want the stock camera-and-safe framing. Build it around this instead: a predictor trained only to imitate the written reports of a human panel about the contents of sealed boxes, where the panel leans on noisy sensors and shares a systematic misconception — say they treat two physically distinct states as one and use a single word for both. The model gets low loss. But when you probe its internals, an activation direction cleanly seperates the two states, i.e. it 'knows' more than the panel's vocabulary can say. The question should make them work out (a) whether it even makes sense to ask what this model 'believes' independently of the report-distribution it was trained on, (b) whether the standard recipe — train a translator to report the model's belief, checked against what the model predicts or does — would end up outputting the panel's single word or the model's finer distinction, and (c) if a probe recovers the distinction but the recipe doesn't, what exactly the probe smuggled in that ELK on its own has no access to. I want them to land on a claim about how much the whole program depends on the model's internal ontology lining up with ours, so it can't bottom out in 'well, interpretability is hard.'

  Then give me a model answer of roughly 600-700 words (a top student's, not a summary of the readings), and a marking scheme of exactly five numbered must-hit points, each one or two sentences, with no intro or conclusion wrapped around the list — total 25 marks, so tell me how many each point is worth and add one line on how a candidate typically fumbles that particular point. Thanks!
