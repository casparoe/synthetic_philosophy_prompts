answer: |-
  ### Exam Question: The Ontological Gap in Eliciting Latent Knowledge

  **Scenario:**
  Consider a predictor model $M$ trained via supervised learning to imitate the written reports of a human expert panel regarding the contents of sealed boxes. The panel relies on noisy sensors and shares a systematic linguistic misconception: they treat two physically distinct states, $S_1$ and $S_2$, as identical, labeling both with the word "Glimmer." The model achieves near-zero loss by outputting "Glimmer" for both states. However, mechanistic interpretability reveals a linear activation direction in $M$'s latent space that cleanly separates $S_1$ from $S_2$, indicating $M$ represents the distinction internally despite never outputting it.

  **Task (90 minutes):**
  Write a concise analysis addressing the following:
  1.  **Belief Attribution:** Does it make sense to ask what $M$ "believes" about the box contents independently of the report distribution it was trained to imitate? Defend your position using the training objective.
  2.  **ELK Recipe Failure:** Suppose we apply the standard ELK recipe: train a translator head to report $M$'s latent state, regularized by consistency with future observations. Given that the human sensors cannot distinguish $S_1$ from $S_2$, will this translator output the distinct states or the panel's word "Glimmer"? Explain the mechanism of failure.
  3.  **The Probe's Secret:** If a linear probe successfully recovers the $S_1/S_2$ distinction but the ELK recipe does not, identify exactly what informational resource the probe accesses that the ELK procedure lacks.
  4.  **Ontological Claim:** Conclude with a claim about whether ELK can solve the alignment problem without assuming the model's internal ontology already aligns with the human (or true) ontology.

  ---

  ### Model Answer

  The question of what the model "believes" is not a metaphysical discovery but a functional definition determined by the training objective. Since $M$ is trained exclusively to minimize loss on human reports, its functional role is to simulate the panel's epistemic state, not to track ground truth. To attribute "belief" in $S_1$ or $S_2$ to $M$ is to confuse latent capacity with optimization target. $M$ represents the distinction only insofar as it aids compression or prediction of the human text, not because it holds a doxastic attitude toward the physical state. Therefore, asking what $M$ believes independently of the report distribution is category error; its "belief" is defined by the output distribution it was penalized for deviating from.

  Consequently, the standard ELK recipe will fail to elicit the distinction. The recipe typically involves training a translator head to report latent variables, regularized by consistency with future observations (e.g., sensor readings). However, in this scenario, the future observations are provided by the same noisy human sensors that cannot distinguish $S_1$ from $S_2$. Any translator outputting distinct labels for $S_1$ and $S_2$ would predict future human reports less accurately than one outputting "Glimmer" for both, because the human reports will consistently confirm "Glimmer." The consistency check acts as a pressure to align with the human ontology, not the physical ontology. The translator will collapse the distinct latent directions into the single human label to minimize loss, effectively simulating the human misconception rather than reporting the latent distinction.

  The linear probe succeeds where ELK fails because it smuggles in external supervision that the ELK procedure explicitly lacks. To train a probe that separates $S_1$ from $S_2$, the researcher must provide a labeled dataset where the ground truth states are known independently of the human reports. The probe does not "find" the knowledge; it maps the researcher's ontology onto the model's activations. It assumes the model's latent space is linearly decodable *according to our categories*. ELK, by contrast, attempts to extract knowledge using only the model's own predictions and the human's feedback loop. Without the researcher's external labels to anchor the semantics of the latent directions, ELK has no loss signal that prefers the true distinction over the human simulation.

  This reveals that the ELK program cannot bottom out in mere feature extraction; it is fundamentally an ontology alignment problem. The model may carve reality at joints that human language does not capture, or it may carve them more finely, as seen here. If the model's internal ontology does not line up with ours, there is no unique mapping from activation to truth that the model can be pressured to output via consistency checks alone. The probe works only because we impose our ontology from the outside. Therefore, ELK cannot solve alignment without assuming a prior alignment of ontologies. We cannot elicit latent knowledge if we cannot recognize it as knowledge without already knowing the truth. The difficulty is not just interpretability; it is the incommensurability of conceptual schemes.

  ---

  ### Marking Scheme

  1.  **Belief as Functional Role (5 marks):** Must argue that "belief" is defined by the imitation objective, making the latent separation instrumental rather than doxastic. *Fumble:* Candidates often assert the model "really knows" the truth based solely on the existence of the activation direction.
  2.  **ELK Consistency Failure (5 marks):** Must explain that consistency checks rely on human sensors which cannot distinguish $S_1$ from $S_2$, forcing the translator to output "Glimmer." *Fumble:* Students claim the translator would succeed because the model internally separates the states, ignoring the loss function.
  3.  **Probe Supervision (5 marks):** Must identify that the probe requires external ground-truth labels ($S_1$ vs $S_2$) provided by the researcher, not derived from the model. *Fumble:* Candidates describe the probe as unsupervised clustering that magically finds the "truth" without labeled data.
  4.  **Ontology Import (5 marks):** Must contrast the probe (which imports human ontology via labels) with ELK (which lacks an external ontological anchor). *Fumble:* Answers treat the probe and ELK as equivalent methods differing only in technical implementation rather than information access.
  5.  **Ontology Alignment Claim (5 marks):** Must conclude that ELK presupposes ontology alignment and cannot resolve mismatches between model and human conceptual schemes. *Fumble:* Students conclude that "interpretability is just hard" rather than identifying the structural dependency on shared ontology.
