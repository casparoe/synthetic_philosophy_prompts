answer: |-
  Here is a plan for your 90 minutes. It is structured to build the concept layer by layer, ensuring the business desk leaves with a working technical intuition rather than a collection of anecdotes.

  ### 1. The Hierarchy: What Must Land First
  You cannot build the house before the foundation is set. The dependencies are strict here.

  1.  **Utility is an Ordering, not a Measurement.** This must be the very first thing they grasp. If they leave thinking utility is a 'score' of happiness, nothing else will work. It is a ranking device (A > B).
  2.  **Choices happen under Constraints.** A choice is never just 'A vs B'. It is 'A vs B given prices, income, and time'.
  3.  **Revealed Preference is about Consistency, not Prediction.** This is your hinge. A single choice is data; two choices under different constraints are a test.

  **Dependency:** You cannot explain the hinge (3) until they accept that utility is an ordering (1) and that constraints exist (2). If they think utility is a 'feeling', they will interpret a change in choice as a 'change in mood' rather than a violation of consistency.

  ### 2. The Carrier Example: The Wine Problem
  You asked about the bloke ordering the second-cheapest wine. **Do not use this as your primary carrier.**

  **Why it is risky:**
  It is too psychologically loaded. It invites the audience to speculate on *why* he does it (embarrassment, signalling, connoisseurship). That drags you into psychology, which is exactly where you do not want to live. Furthermore, it is usually a single-menu example. It does not naturally lend itself to your hinge about *patterns across menus*.

  **What a good example needs:**
  *   **Two Scenarios:** You need to show the same person facing two different price sets or budgets.
  *   **Boring Goods:** Use something devoid of status. Commutes, groceries, or office supplies.
  *   **Clear Trade-off:** Time vs. Money, or Quantity vs. Quality.

  **The Recommendation:**
  Use the **"Commute Choice"**.
  *   *Scenario A:* Train costs £10 (40 mins); Car costs £5 (60 mins). He takes the Train.
  *   *Scenario B:* Train costs £10 (40 mins); Car costs £15 (60 mins). He takes the Train.
  *   *Scenario C:* Train costs £20 (40 mins); Car costs £5 (60 mins). He takes the Car.

  This allows you to show that his 'utility' (ranking of time vs. money) hasn't changed, but his choice has. It isolates the constraint from the preference. Save the wine example for the Q&A as a 'complicated case' involving social context.

  ### 3. The Hinge and The Worry
  **Your Hinge:** *"A single choice on its own reveals nothing at all... revealed preference is a claim about a pattern of choices across different menus."*

  **Verdict:** This is correct. It is the intuitive version of the Weak Axiom of Revealed Preference (WARP). Stick to this gun. It is the most important thing you will teach them. It moves utility from 'mind-reading' to 'behavioural auditing'.

  **Your Worry:** *"You can always seem to rescue the story by re-describing what counts as an option."*

  **Verdict:** You are not confusing yourself. You have identified the **Individuation Problem** (often associated with Amartya Sen). If I choose an apple when a pear is available, but choose the pear when the apple is available, I look inconsistent. But if I redefine the option as 'Apple-on-a-Tuesday' vs 'Pear-on-a-Tuesday', I am consistent again.

  **How to handle it in the room:**
  Do not hide this, but bracket it. Tell them: *"Economists assume the description of the choice is fixed before we start. If you change the description of the options mid-game, the model breaks. We treat the menu as given. Is this a limitation? Yes. Is it fatal? Only if you want to explain everything. For modelling markets, we fix the menu."*
  Acknowledge it as a boundary condition of the model, not a bug in the room. It shows you know the literature without derailing the session into philosophy.

  ### 4. The Misconceptions: Sequence and Defence
  Do not list these as "Myths". Introduce them as "Natural assumptions that we must park." Here is the order in which they will arise, and where you head them off.

  1.  **"Utility is a feeling / Happiness."**
      *   *When:* Introduction.
      *   *Defence:* "If utility were happiness, we could measure it with a scan. We cannot. We measure it by watching what you give up to get something else. It is about sacrifice, not smiles."
  2.  **"One Choice = Preference."**
      *   *When:* Introducing the Commute Example.
      *   *Defence:* Use your hinge. "Choosing the train once tells me nothing. Choosing the train when it is cheap *and* when it is expensive tells me you value time."
  3.  **"This proves people are Rational and Selfish."**
      *   *When:* After the example.
      *   *Defence:* "Rational' here just means 'consistent'. 'Selfish' is irrelevant. If you get more utility from donating to charity than buying a beer, the model records that as a preference for charity. The model is agnostic on virtue."
  4.  **"Preferences are just whatever people happened to do (Tautology)."**
      *   *When:* Discussing the Menu Framing worry.
      *   *Defence:* "It is only a tautology if we allow preferences to change every second. The theory demands stability. If choices flip-flop without price changes, the theory admits defeat."
  5.  **"If the pattern breaks, the theory is dead."**
      *   *When:* Conclusion.
      *   *Defence:* "No, it means we missed a constraint. Perhaps there was a risk factor, or a transaction cost we didn't see. We check the constraints before we burn the theory."

  ### 5. What to Exclude (The "Not Today" List)
  You are right to exclude the formal representation theorem and cardinal utility. Add these to your explicit exclusion list to manage expectations:

  *   **Interpersonal Comparisons:** We cannot compare your utility to your colleague's.
  *   **Expected Utility (Risk):** This introduces probabilities which will muddy the water on basic consistency.
  *   **Time Preference:** Discounting the future is a separate layer.

  **What might bite you:**
  **Endogenous Preferences.** The business desk might ask: "But advertising changes preferences, doesn't it?"
  *Preparation:* Admit it. "Yes, over the long run. But in this model, we take preferences as given to see how people respond to price changes. We are looking at the reaction, not the cause of the taste."

  ### 6. The Final Question
  Do not ask them to define utility. Ask them to diagnose a scenario. This tests the hinge.

  **The Question:**
  > "Sarah buys a coffee and a muffin on Monday when both cost £2. On Tuesday, the price of muffins rises to £4, and she buys two coffees instead. On Wednesday, prices are back to Monday's levels (£2 each), but she buys two muffins and no coffee.
  >
  > **On which day, if any, has Sarah violated the assumption of consistent utility?**"

  **The Answer:**
  *   **Monday to Tuesday:** No violation. Relative prices changed.
  *   **Wednesday:** Violation (assuming income hasn't changed). If she chose the bundle (1 coffee, 1 muffin) when (2 muffins) was affordable on Monday, she revealed a preference for the mixed bundle. Returning to the old prices and choosing the muffin-heavy bundle implies her ranking has flipped without a constraint change.
  *   *Why this works:* It forces them to track the budget constraint vs. the choice pattern. It requires them to spot the inconsistency, not just the change.

  ### 7. Confidence and Uncertainty
  **Confidence:** 85%.
  The economic logic is sound, and the structure respects the audience's numeracy without overwhelming them. The distinction between ordinal utility and psychological feeling is the standard pedagogical approach for a reason: it works.

  **Least Sure Bit:**
  The **Menu Framing / Individuation** discussion.
  I am least sure about how much time this will consume. Journalists love a loophole. If half the room latches onto the idea that "you can redefine the options to save the theory," you could lose 30 minutes to a philosophical debate about whether a 'coffee on a rainy day' is a different good to a 'coffee on a sunny day'.
  *Advice:* Be prepared to ruthlessly park this. "That is a profound critique for a philosophy seminar. For a business model, we must define the goods before we start. Let's assume the menu is fixed."

  ***

  **A Note on Orthography:**
  I have drafted this in British English (behaviour, modelling, programme, centre, defence, analyse). I have avoided the '-ize' suffix where '-ise' is standard in UK journalism (e.g., 'realise' not 'realize'), as subeditors tend to be prescriptive on this.

  Good luck. If you hold the line on "Utility is a ranking, not a feeling," you will have done your job.
