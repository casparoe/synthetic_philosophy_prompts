prompt: |-
  Me and my mate got into a three-hour arguement last night about this: he reckons that if a coin flip decides whether the universe ends up with one person or a trillion, and you're one of the people, you should bet you're in the trillion branch, because there are just way more people to be. I say thats mad — you should reason as if you're a random one of the people who actually exist, and the coin stays 50/50. Then he went further and said the whole question "am I more likely to be this observer than that one" is meaningless, there's no fact of the matter about which one you are.

  I want to turn this into a "which view about being an observer do you actually hold" flowchart for our reading group, because there are six of us and I'm pretty sure half the disagreement is just us using different words. Can you build the decision tree, starting from whether someone accepts that there's any such thing as being uncertain which observer you are, with each branch node phrased as a question a person could answer without already knowing what the position is called, and each leaf a named position — the self-sampling one, the self-indication one, the no-self-location one, the presumptuous-philosopher one if that's genuinely a separate leaf, plus anything else that lives in the space. Use concrete cases as the nodes: the coin that decides how many people exist, doomsday-style reasoning about how long we last, the sleeping beauty setup, and at least one case where two of the views disagree about an actual decision, like whether to give money to a charity working on human extinction. Please also put in a node about the reference class — all observers, all humans, all minds — because I think thats where we actually split. Flag any leaves the tree can't tell apart, and if some combination of answers has nobody standing on it, say whether that's because it's incoherent or just unexplored.
