answer: |-
  # DECISION TREE: INFORMATION & CODING IN MOLECULAR BIOLOGY

  **START:** Genes are causally implicated in the production of proteins.

  **1. CRITERIA:** To count as "information," must a state be *used* by a system, or is reliable *causation* sufficient?
  *   **Used (Semantic):** Information requires a function/consumer.
      *   **2. LOCATION:** Is the informational role privileged in DNA or shared by the cellular context?
          *   **DNA (Localized):** DNA is the primary information source.
              *   **3. ARBITRARINESS:** Is the codon-amino acid mapping conventional (like language) or chemically constrained?
                  *   **Conventional:** The mapping is a code.
                      *   **4. UTILITY:** Does information vocabulary explain what physical vocabulary cannot?
                          *   **Yes:** **TELEOSEMANTIC REALISM** (e.g., Godfrey-Smith). *Awkward commitment:* Must explain the evolutionary origin of the "interpreter" without circularity.
                          *   **No:** **SEMANTIC INSTRUMENTALISM**. *Awkward commitment:* Treats "information" as useful fiction despite defining it functionally.
                  *   **Constrained:** The mapping is chemical law.
                      *   **4. UTILITY:** (See above)
                          *   **Yes:** **CHEMICAL SEMANTICISM**. *Awkward commitment:* Must explain how "convention" survives chemical necessity.
                          *   **No:** **REDUCTIVE ELIMINATIVISM**. *Awkward commitment:* Must reconstruct biology without the heuristic driving current research.
          *   **System (Distributed):** DNA is one resource among many.
              *   *(Skip Q3: Mapping specifics are less central)*
              *   **4. UTILITY:**
                  *   **Yes:** **SYSTEMS REALISM**. *Awkward commitment:* Must quantify information across heterogeneous causal factors.
                  *   **No:** **DEVELOPMENTAL SYSTEMS THEORY** (e.g., Oyama). *Awkward commitment:* Makes genetic inheritance indistinguishable from environmental stability.
  *   **Caused (Causal):** Reliable correlation is sufficient.
      *   **2. LOCATION:** (Same split as above)
          *   **DNA (Localized):**
              *   **3. ARBITRARINESS:**
                  *   **Conventional:** **CAUSAL CODE VIEW**. *Diagnosis:* **INCOHERENT**. Conventions imply agents; causal views deny privileged agency.
                  *   **Constrained:** **SHANNON INFORMATIONALISM**. *Awkward commitment:* Treats meaning and noise as mathematically identical.
              *   **4. UTILITY:** (Leads to Realism or Eliminativism as above).
          *   **System (Distributed):**
              *   **4. UTILITY:**
                  *   **Yes:** **CAUSAL DISTRIBUTIVISM**. *Awkward commitment:* Dilutes "information" until it applies to all physical causes.
                  *   **No:** **RADICAL ELIMINATIVISM** (e.g., Keller). *Awkward commitment:* Loses the predictive power of sequence analysis.

  ***

  **FLAGS & DIAGNOSTICS**

  *   **Indistinguishable Leaves:** All paths ending in **"No" (Utility)** converge on **Eliminativism**. The tree separates their *motives* (Semantic vs. Causal) but not their *practice* (rejecting the vocabulary).
  *   **Empty/Incoherent Combination:** **Causal + Conventional (Arbitrary)**. If information is merely causal correlation, the mapping cannot be "conventional" (which requires choice/usage). This view is **unstable**.
  *   **Unexplored Region:** **Semantic + Distributed + Conventional**. Few argue the *whole system* uses a *conventional code* localized nowhere. This view is **merely unexplored**.
