answer: |-
  1. The core practice presupposes an actual preference-satisfaction account of welfare, where individual well-being is defined by the fulfillment of desires as demonstrated through observable choices under constraints. This rules out hedonic accounts that prioritize subjective feeling over choice and objective-list accounts that prioritize goods independent of desire.
  2. Applying equity weights strictly presupposes that utility is cardinally measurable and interpersonally comparable, allowing for a social welfare function that prioritizes distributional outcomes over strict Pareto efficiency. This modification fits well with prioritarianism but conflicts with the standard economic assumption that ordinal revealed preferences cannot be weighted across persons.
  3. The preference-purification protocol smuggles in an informed-desire theory of utility, contradicting the core commitment by asserting that actual choices may fail to track well-being due to information deficits or unjust constraints. This creates theoretical instability because it simultaneously treats choices as the metric of value and as potential errors requiring correction by analysts.
  4. The methodology is philosophically underdetermined regarding the source of normativity, as both a paternalistic perfectionism and a liberal idealized-consent framework could justify overriding choices while still aggregating benefits. Consequently, the framework merely fits with multiple theories of the good without strictly presupposing a single coherent metaphysical view of utility.
  5. If replaced by a hedonic account, the practice would require direct measurement of emotional states rather than trade-offs, while an objective-list account would necessitate valuing project outcomes based on predefined goods regardless of individual willingness to pay. Such shifts would fundamentally dismantle the revealed-preference foundation, requiring entirely new data collection and aggregation mechanisms.
