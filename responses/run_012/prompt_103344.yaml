prompt: |-
  I'm a PhD student in history and philosophy of science, and I've been drafted as an unpaid consultant to a small foundation that awards a mid-career prize for a scientific discovery. The committee is made up of working scientists and donors, meets for two hours, and keeps running into the same problem: a prize-worthy advance appears to have been made independently by two or more people within a few years of each other, and they have no principled way to decide whether to give the prize to one person, split it, or withhold it because the discovery was, as they put it, in the air. I want you to turn the philosophical literature on simultaneous invention and the inevitability of discovery into a procedure they can actually run on a dossier.

  I've been trying to organize the issue around three distinctions I don't see made cleanly enough in the usual great-man versus zeitgeist debate: first, causal independence, meaning did the later party have access to the earlier party's work or to a common source that made the result obvious; second, formulation independence, meaning would the later party's version have been intelligible and usable to the community without the earlier party's version; and third, credit-relevant priority, meaning who first put the result into circulation in a form that others could build on. I also want the procedure to separate the descriptive question of whether a discovery was inevitable into at least three sub-questions: was the problem recognized, were the tools available, and how many genuinely independent routes to the result are documented. The committee is not equipped to do archival research, so the procedure has to work from the dossiers they already have, flag what evidence would change the answer, and be honest when the dossier is too thin.

  Please write the procedure: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a definite no or a shared award, and where it hands the decision back to the committee because the remaining question is about values, for example how much weight to give priority of publication versus priority of conception, or whether to reward the person who made the discovery usable. Then run it on two historical cases, the calculus dispute between Newton and Leibniz and the natural selection case involving Darwin and Wallace, and on one constructed modern case where a senior scientist can show dated private notes but no publication, while a junior scientist published first and made the field take notice. I expect the procedure to give the committee an answer it won't like in that third case; say why that is the right answer anyway, or where the procedure is misfiring. End by stating what the procedure cannot do. No citations, reading lists, or bibliographies; I need the operational tool and the worked applications, not a literature review.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** PhD student in History and Philosophy of Science (HPS).
      *   **Task:** Create an operational procedure for a prize committee (scientists + donors, 2-hour meeting) to handle simultaneous/independent discoveries.
      *   **Core Problem:** Committee struggles with "who gets the prize" when multiple people claim a discovery (split, single, or withhold).
      *   **Key Concepts to Integrate:**
          *   Three distinctions: Causal Independence, Formulation Independence, Credit-Relevant Priority.
          *   Three sub-questions on inevitability: Problem Recognized, Tools Available, Independent Routes.
          *   Constraints: No archival research (use existing dossiers), flag missing evidence, admit when thin.
          *   Output: A step-by-step procedure (questions, sufficiency criteria, stop conditions), applied to three cases (Newton/Leibniz, Darwin/Wallace, Constructed Modern Case), plus limitations.
          *   Tone/Style: Operational, pragmatic, philosophical but actionable. No citations/bibliographies.
      *   **Specific Requirement:** The procedure must give an "unpleasant" answer in the third case (Senior w/ notes vs. Junior w/ publication) and justify it.

  2.  **Deconstruct the Philosophical Framework into Operational Steps:**
      *   *Inevitability/Context:* Before judging the actors, judge the state of the field. (Problem recognized? Tools available? Multiple routes?)
      *   *Independence:* Did they copy? (Causal Independence).
      *   *Contribution:* Did they actually contribute something new or just repeat? (Formulation Independence).
      *   *Priority:* Who gets credit? (Credit-Relevant Priority).
      *   *Decision Node:* When does it become a value judgment?

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a flowchart style but in text.
      *   *Step 1: Contextual Inevitability.* If the discovery was *too* inevitable (low barrier), maybe no prize? Or shared? Let's refine: If the field was ripe, multiple claims are expected. This doesn't disqualify, but sets the stage for splitting.
      *   *Step 2: Causal Independence.* Check for plagiarism or direct dependency. If dependent -> Single prize to originator. If independent -> Proceed.
      *   *Step 3: Formulation Independence.* Is the second contribution actually useful on its own? If it's just a re-hash that adds no clarity/utility -> Single prize. If it offers a distinct, usable formulation -> Proceed to splitting consideration.
      *   *Step 4: Credit-Relevant Priority.* Publication vs. Conception. This is the value judgment zone.
      *   *Stop Conditions:* Need clear "Award to A," "Split," or "Withhold/Defer" triggers.

      *Refining the "Inevitability" aspect:* The prompt asks to separate the descriptive question of inevitability into three sub-questions. I should make this Step 1. If the answer is "Yes, Yes, Many," it suggests a "Multiple Discovery" scenario, pushing towards a Split or a specific criteria for priority. If "No, No, One," it suggests a "Great Man" scenario, pushing towards Single.

      *Refining the "Unpleasant Answer":* In the modern case (Senior notes vs. Junior pub), standard scientific norms prioritize publication (communication). The procedure should uphold this, even if the Senior "thought of it first." This aligns with Mertonian norms of Communism (common ownership) and Organized Skepticism (verification requires publication).

  4.  **Developing the Three Cases:**
      *   *Newton vs. Leibniz:* Classic simultaneity. Causal independence is debated (did Leibniz see Newton's letters?). Formulation independence is high (fluxions vs. differentials). Priority is the mess. Procedure should likely suggest a Split *if* causal independence holds, but flag the archival gap.
      *   *Darwin vs. Wallace:* Darwin had priority of conception (long gestation), Wallace triggered publication. Causal independence is high. Formulation independence is high (though Wallace's paper prompted Darwin). Priority is the tricky bit. Lyell/Hooker intervention. Procedure should likely suggest Split or Priority to Darwin *with acknowledgment* of Wallace. Actually, historically it was a joint reading. The procedure should reflect that the *trigger* matters.
      *   *Constructed Modern Case:* Senior (dated notes, private) vs. Junior (published, impactful).
          *   Causal: Independent (presumably).
          *   Formulation: Junior made it usable. Senior kept it secret.
          *   Priority: Junior published.
          *   *Verdict:* Junior wins. Why? Because science is a public enterprise. Private notes don't count for *credit* in the reward system, only for *priority* in the historical record. This will annoy the Senior/donors who value "genius" over "communication."

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role. Set the stage.
      *   **The Procedure (The "Decision Protocol"):**
          *   Phase 1: The State of the Field (Inevitability).
          *   Phase 2: Causal Independence (The Plagiarism Check).
          *   Phase 3: Formulation Independence (The Utility Check).
          *   Phase 4: Credit-Relevant Priority (The Normative Check).
          *   Phase 5: The Value Judgment (Where the Committee decides).
      *   **Case Studies:** Apply the protocol strictly.
      *   **The "Unpleasant" Outcome:** Explain the Modern Case result.
      *   **Limitations:** What can't this do? (Politics, future impact, moral character).

  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is "Inevitability" a reason to withhold a prize?
      *   *Correction:* Usually, prizes reward the *achievement*, not the *difficulty* alone. However, if it was *so* inevitable that anyone would have done it next week, the "Great Man" narrative fails. The prompt asks to separate the descriptive question. I will use the Inevitability Score to determine *if* a split is appropriate. High inevitability + High independence = Strong case for Split. Low inevitability + High independence = Strong case for Single (the one who cracked the hard nut).
      *   *Critique:* The Modern Case needs to be hard.
      *   *Correction:* Make sure the Senior's notes are *convincing* (dated, detailed) so the committee *wants* to give it to the Senior, but the rules force them to the Junior. This highlights the tension between "conception" and "communication."
      *   *Tone Check:* Keep it dry, procedural, like a checklist for a busy committee. Avoid academic jargon where possible, but keep the HPS precision.

  7.  **Final Polish:**
      *   Check against constraints: No citations? Yes. Operational tool? Yes. Worked applications? Yes. Limitations stated? Yes.
      *   Ensure the three distinctions (Causal, Formulation, Credit) are explicitly named and used.
      *   Ensure the three inevitability sub-questions (Problem, Tools, Routes) are explicitly named and used.

  8.  **Final Review of the "Unpleasant" Answer:**
      *   Why is it right? Because science functions on public verification. Private discovery is psychology, not science.
      *   Where might it misfire? If the Senior was blocked from publishing by systemic bias (gender, institution, politics). The procedure needs a "Flag for Bias" step. I will add a caveat in the limitations or the procedure itself. Actually, better to put it in the "Limitations" section to keep the procedure clean.

      *(Self-Correction)*: Wait, if the Senior was blocked by bias, that changes the "Credit-Relevant Priority" norms. I should add a "Systemic Barrier Check" in Phase 4. If the Senior *couldn't* publish, the norm shifts. But for the sake of the "unpleasant answer" requested, I will assume the Senior *chose* not to publish or sat on it. I will clarify this in the case description.

      *Let's write.*
answer: |-
  # The Simultaneity Protocol: A Decision Procedure for Prize Committees

  ## Purpose
  This protocol converts philosophical distinctions regarding multiple discovery into an operational checklist. It is designed for a committee with limited time and no capacity for archival research. It forces explicit decisions on independence and priority, isolating value judgments from factual assessments.

  ## Part 1: The Decision Protocol

  **Instructions:** Proceed through Phases 1–4 sequentially. Do not skip to Phase 5 (Committee Vote) until Phases 1–4 are complete. If a "Stop Condition" is met, execute the recommendation immediately.

  ### Phase 1: Assess Contextual Inevitability (Descriptive)
  *Goal: Determine if the discovery was a singular breakthrough or a collective convergence.*
  *Source: Dossier background sections, citation metrics, state-of-field summaries.*

  Ask the following three sub-questions. Tally the "Yes" count.
  1.  **Problem Recognition:** Was the specific problem explicitly defined and widely acknowledged as unsolved in the literature prior to the earliest claim?
  2.  **Tool Availability:** Were the mathematical, experimental, or conceptual tools required to solve the problem standard curriculum or widely available technology at the time?
  3.  **Documented Routes:** Does the dossier show evidence of more than two distinct research groups actively working on this specific solution simultaneously?

  **Scoring:**
  *   **0–1 Yes (Low Inevitability):** The discovery was not "in the air." It required unique insight. *Proceed to Phase 2.*
  *   **2–3 Yes (High Inevitability):** The discovery was highly probable given the state of the field. *Proceed to Phase 2, but note that a Split Award is presumptively favored.*

  ### Phase 2: Assess Causal Independence (Factual)
  *Goal: Determine if the later claimant derived their result from the earlier claimant.*
  *Source: Correspondence logs, citation lists, employment history, conference attendance records in the dossier.*

  **Question:** Is there documented evidence that the Later Claimant had direct access to the Earlier Claimant's unpublished work, private correspondence, or oral presentations prior to formulating their own result?

  *   **Yes:** Causal dependence is established.
      *   **Stop Condition:** Award to **Earlier Claimant**. (The Later Claimant is derivative).
  *   **No / Evidence Thin:** No direct link is documented.
      *   **Action:** Flag "Potential Undocumented Contact" if they were at the same institution. Otherwise, assume **Causal Independence**.
      *   **Proceed to Phase 3.**

  ### Phase 3: Assess Formulation Independence (Functional)
  *Goal: Determine if the Later Claimant contributed something usable distinct from the Earlier Claimant.*
  *Source: The papers/works themselves, review articles cited in the dossier.*

  **Question:** If the Earlier Claimant's work had never been published, would the Later Claimant's version be intelligible, verifiable, and useful to the community on its own merits?

  *   **No:** The Later Claimant's work relies on the Earlier Claimant's notation, framework, or data to make sense.
      *   **Stop Condition:** Award to **Earlier Claimant**.
  *   **Yes:** The Later Claimant offers a distinct notation, a different experimental verification, or a clearer derivation that stands alone.
      *   **Action:** Establish **Formulation Independence**.
      *   **Proceed to Phase 4.**

  ### Phase 4: Assess Credit-Relevant Priority (Normative)
  *Goal: Apply community norms to determine who owns the credit.*
  *Source: Publication dates, conference presentation dates, preprint timestamps.*

  **Question:** Who first put the result into circulation in a form that others could build on (Publication/Public Presentation)?

  *   **Case A: Same Person:** The person who conceived it first also published first.
      *   **Stop Condition:** Award to **Single Claimant**.
  *   **Case B: Divergence:** One conceived first (Private Priority), another published first (Public Priority).
      *   **Check for Barriers:** Does the dossier indicate the Earlier Conceiver was prevented from publishing by systemic barriers (institutional suppression, political censorship, lack of access)?
          *   **Yes:** **Committee Vote Required** (See Phase 5).
          *   **No:** The norm of **Public Priority** prevails.
      *   **Stop Condition:** Award to **First Publisher**. (Private notes do not constitute scientific credit).
  *   **Case C: Near-Simultaneous Publication:** Publication dates fall within the same prize cycle (e.g., same year).
      *   **Action:** Proceed to Phase 5.

  ### Phase 5: Committee Value Judgment
  *Goal: Resolve remaining ambiguities based on prize mission.*
  *Trigger:* Reached only if Phase 1 scored High Inevitability AND Phase 3 confirmed Formulation Independence AND Phase 4 resulted in Case C (Near-Simultaneous) OR Phase 4 Case B with Barriers.

  **The Vote:**
  1.  **Split Award:** Recommended if Phase 1 was High Inevitability (2–3 Yes) and both formulations are currently in use.
  2.  **Single Award (Priority to Publication):** Recommended if the prize mission emphasizes *communication* and *community building*.
  3.  **Single Award (Priority to Conception):** Recommended *only* if Phase 4 Case B (Barriers) applies, or if the Earlier Conceiver's private notes demonstrably guided the field (via private correspondence) before publication.
  4.  **Withhold Prize:** Recommended only if Phase 1 was High Inevitability (3 Yes) AND the dossier suggests the "discovery" was merely routine application of existing tools with no novel insight.

  ---

  ## Part 2: Worked Applications

  ### Case 1: The Calculus Dispute (Newton vs. Leibniz)
  *Hypothetical Dossier Content:* Letters showing Newton developed fluxions in 1660s; Leibniz published differentials in 1684. Correspondence exists between mutual acquaintances (Collins) during the interim.

  *   **Phase 1 (Inevitability):**
      *   Problem Recognized? **Yes** (Tangents/areas were the main problem of the day).
      *   Tools Available? **Yes** (Algebraic notation was maturing).
      *   Multiple Routes? **Yes** (Barrow, Gregory, others were close).
      *   *Score:* **High Inevitability.** (Presumption toward Split).
  *   **Phase 2 (Causal Independence):**
      *   Did Leibniz access Newton's work? **Evidence Thin.** Dossier shows letters passed through Collins, but no smoking gun proving Leibniz saw Newton's specific manuscripts before formulating his own.
      *   *Result:* Assume **Causal Independence** (with a flag).
  *   **Phase 3 (Formulation Independence):**
      *   Is Leibniz's version usable without Newton's? **Yes.** Leibniz's notation ($dx, \int$) is distinct from Newton's (fluxions/dots) and became the standard.
      *   *Result:* **Formulation Independence Confirmed.**
  *   **Phase 4 (Priority):**
      *   Newton conceived first. Leibniz published first.
      *   Barriers? **No.** Newton delayed publication voluntarily.
      *   *Norm:* Public Priority favors Leibniz. Private Priority favors Newton.
      *   *Result:* **Proceed to Phase 5.**
  *   **Phase 5 (Committee Vote):**
      *   High Inevitability + Formulation Independence + Divergent Priority.
      *   *Protocol Recommendation:* **Split Award.**
      *   *Rationale:* Since the field developed using *both* formulations (historically) and the discovery was highly inevitable, rewarding the "concept" (Newton) and the "communication/formalism" (Leibniz) equally acknowledges the dual nature of the advance.

  ### Case 2: Natural Selection (Darwin vs. Wallace)
  *Hypothetical Dossier Content:* Darwin has 20 years of notebooks. Wallace sends a manuscript from the Malay Archipelago in 1858 that mirrors Darwin's theory. Darwin has not published a book yet.

  *   **Phase 1 (Inevitability):**
      *   Problem Recognized? **Yes** (Origin of species was a major debate).
      *   Tools Available? **Yes** (Malthus, geology, breeding data were available).
      *   Multiple Routes? **No.** (Only these two are documented in the dossier as having the full mechanism).
      *   *Score:* **Low/Medium Inevitability.** (Presumption toward Single, but check independence).
  *   **Phase 2 (Causal Independence):**
      *   Did Wallace see Darwin's work? **No.** Correspondence shows Wallace sent the paper unsolicited.
      *   *Result:* **Causal Independence Confirmed.**
  *   **Phase 3 (Formulation Independence):**
      *   Is Wallace's version usable without Darwin's? **Yes.** It is a complete, standalone argument.
      *   *Result:* **Formulation Independence Confirmed.**
  *   **Phase 4 (Priority):**
      *   Darwin conceived first. Joint reading arranged by Lyell/Hooker.
      *   Barriers? **No.** Darwin chose to refine his "big book."
      *   *Norm:* Public Priority is technically shared (the joint Linnean Society reading).
      *   *Result:* **Proceed to Phase 5.**
  *   **Phase 5 (Committee Vote):**
      *   *Protocol Recommendation:* **Split Award (with citation of Darwin's depth).**
      *   *Rationale:* While Darwin's work was more extensive, Wallace triggered the publication. Since Causal and Formulation independence are high, withholding credit from Wallace is historically inaccurate. However, because Phase 1 Inevitability was not "High" (only two routes), the committee might lean toward a primary prize to Darwin with a special citation to Wallace, but a strict reading of the "Split" condition in Phase 5 suggests sharing the honor for the *discovery* of the mechanism.

  ### Case 3: The Constructed Modern Case (Senior vs. Junior)
  *Hypothetical Dossier Content:*
  *   **Claimant A (Senior):** Dated lab notebooks from 5 years ago show the core insight. Never published. Mentioned it in a lab meeting. Did not pursue it because they were working on a "more ambitious" follow-up.
  *   **Claimant B (Junior):** Postdoc in a different lab. Published a paper 6 months ago. The field has immediately adopted B's method. B cites general background but does not cite A (unaware of A's notes).
  *   **Evidence:** A's notes are verified by colleagues as authentic. B's paper is verified as correct.

  *   **Phase 1 (Inevitability):**
      *   Problem Recognized? **Yes.**
      *   Tools Available? **Yes.**
      *   Multiple Routes? **No** (Only A and B documented).
      *   *Score:* **Low Inevitability.**
  *   **Phase 2 (Causal Independence):**
      *   Did B access A's notes? **No.** Different institutions, no overlap.
      *   *Result:* **Causal Independence Confirmed.**
  *   **Phase 3 (Formulation Independence):**
      *   Is B's version usable without A's? **Yes.** It is the version the field is using.
      *   Is A's version usable? **No.** It remains private notes.
      *   *Result:* **Formulation Independence Confirmed (for B).**
  *   **Phase 4 (Priority):**
      *   A conceived first. B published first.
      *   Barriers? **No.** Dossier indicates A chose to prioritize other work.
      *   *Norm:* **Public Priority Prevails.**
      *   *Stop Condition:* **Award to Claimant B (Junior).**
  *   **Phase 5:** *Not Reached.*

  **The Unpleasant Outcome:**
  The procedure denies the prize to the Senior Scientist (A) and awards it to the Junior Scientist (B).

  **Why this is the right answer:**
  Science is a public knowledge enterprise, not a private intellectual property regime. The function of a scientific prize is to reward contributions that *advance the community*.
  1.  **Verification:** A's notes, being private, could not be vetted, criticized, or built upon. They contributed zero utility to the field until B's publication.
  2.  **Incentive Structure:** Rewarding private notes incentivizes hoarding. Rewarding publication incentivizes sharing. The prize committee must uphold the norm that *communication* is part of the *discovery*.
  3.  **Opportunity Cost:** A had the insight but allocated their labor elsewhere. B allocated labor to completion and dissemination. The prize rewards the completed labor.

  **Where the procedure might be misfiring:**
  The procedure assumes a level playing field. If Claimant A was a marginalized researcher whose "choice" not to publish was actually the result of implicit bias, lack of funding, or institutional gatekeeping not captured in the dossier, the "No Barriers" check in Phase 4 is false. In that specific sociological context, Private Priority *should* count. However, without archival evidence of suppression, the committee cannot adjudicate this. The procedure prioritizes the *documented record* over the *psychological reality* to prevent endless disputes over "who thought of what when."

  ---

  ## Part 3: Limitations of the Procedure

  This tool is designed for efficiency and consistency, not ultimate truth. The committee must acknowledge what this procedure cannot do:

  1.  **It Cannot Detect Hidden Plagiarism:** If the dossier lacks correspondence or peer review reports, Phase 2 (Causal Independence) relies on absence of evidence. A sophisticated plagiarist who covered their tracks will pass as independent.
  2.  **It Cannot Measure Impact Quality:** The procedure treats "usable formulations" as binary (usable/not usable). It does not weigh whether one formulation is *profoundly* better than the other. A split award might equate a minor tweak with a major overhaul if both pass Phase 3.
  3.  **It Cannot Account for Future History:** A discovery might seem "inevitable" now (Phase 1) but was actually a massive struggle. Conversely, a discovery might seem unique now but be superseded next year. The procedure judges based on the dossier at hand, not historical hindsight.
  4.  **It Cannot Resolve Moral Claims:** If the Senior Scientist in Case 3 was genuinely blocked by systemic bias that the dossier fails to record, the procedure produces a "just" outcome by norms but an "unjust" outcome by equity. The committee must remain aware that "Public Priority" is a norm that has historically excluded those without platforms.
  5.  **It Cannot Replace Diplomacy:** A "Split Award" recommendation may be rejected by the donors who want a single hero, or by the scientists who refuse to share. The procedure provides the *rationale*, not the *acceptance*.

  **Final Instruction to Committee:** If the procedure yields a result the committee strongly dislikes, do not override it silently. Record *which Phase* was contested. This creates a record of whether the dispute is about facts (Phase 1–3) or values (Phase 4–5), which is the only way to improve the prize criteria over time.
