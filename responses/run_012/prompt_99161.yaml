  Ok so I don't have a physics background but I've been reading popular articles about the many-worlds interpretation and something about it has been bugging me. If every outcome of a measurement really happens in some branch, then nothing is actually undecided — both results are just as real as each other. So why do people say there's this huge unsolved "probability problem" for many-worlds? Seems obvious to me: if all the branches are equally real they should be equally likely, so my honest odds should be 50/50 no matter what the amplitudes are, and the Born rule is just a extra rule people bolt on. Like if some particle is 1/3 up and 2/3 down, both branches happen, so why would I think one is more likely than the other? Am I missing something, or is the whole problem just people not wanting to admit probability is an illusion under many-worlds? And if a branch is really "less likely" when it definitely happens too, what does that even mean?
