      *   Locality (in CS terms) means $A$'s output depends only on $x$ and $\lambda$, $B$'s on $y$ and $\lambda$.
      *   So, $P(a, b | x, y, \lambda) = P(a | x, \lambda) P(b | y, \lambda)$.
