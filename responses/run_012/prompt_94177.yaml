      *   *Shared Randomness vs. Quantum State:* A shared random seed *is* a classical common cause. If Bell's theorem says "No classical common cause can explain this," then the Quantum State is *not* a shared random seed in the CI sense. It's a different mathematical object (vector in Hilbert space vs. value in sample space).
      *   *Superdeterminism:* In CI, this is $X, Y \not\perp \Lambda$. Violation of Ignorability. Selection bias.
      *   *Why Radical?* In physics, it implies the "experimenter's choice" is correlated with the particle source history. In CI, we deal with selection bias all the time.
      *   *Reason for Radicalism:* It undermines the scientific method's assumption of independent testing. If $X$ and $\Lambda$ are correlated by fundamental law, you can't intervene on $X$ without changing $\Lambda$. It breaks the *modularity* of the SCM.
      *   *The "Residue":* The debate is about **Ontology vs. Epistemology**. CI is epistemic (what distributions can we observe/model?). Bell is ontological (what physical properties exist?).
      *   *Vocabulary Limit:* CI vocabulary assumes a Kolmogorov probability space. QM requires a non-Kolmogorovian structure (projective geometry). The "Residue" is the assumption that *all* correlations must arise from a joint probability distribution over latent variables. Bell proves they don't (if QM is complete).
      *   *Conclusion on Vocabulary:* The vocabulary isn't "missing" causality; it's assuming **Classical Probability**. The "Local Realism" Bell kills is exactly "Classical Causal Models."

  7.  **Refining and Polishing:**
      *   *Tone:* Academic, precise, peer-to-peer.
      *   *Check:* Did I answer the specific question about shared random seed? Yes, distinguish classical seed vs. quantum state.
      *   *Check:* Did I address Superdeterminism as Ignorability violation? Yes, but highlight the modularity break.
      *   *Check:* Did I avoid smuggling assumptions? Be careful not to say "QM is non-local" without qualifying "in the classical causal sense."
      *   *Key Insight:* The user's framework (SCM/DAGs) *presupposes* Bell's inequalities hold for any latent variable model. Therefore, Bell's theorem is a theorem *about the limitations of the user's framework* when applied to quantum phenomena.

  8.  **Final Review against constraints:**
