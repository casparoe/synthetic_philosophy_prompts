      *   The Single Most Exclusionary Requirement.
      *   Brief Theory Scorecard.
      *   Conclusion: Advice for the novelist.

      *(Self-Correction on "Single Most Exclusionary Requirement"):* I think the "Moral Limit" is the strongest filter. Many theories fail because they can't explain why you *can't* sell yourself into slavery even if you want to. Or, alternatively, the "Sovereignty of the Present" kills constitutionalism. I will select the **Sovereignty/Binding Paradox** as the most exclusionary because it strikes at the definition of the agent.

      *(Refining the "Novel Structures"):* I need to make sure the sunset clause and custodian examples are explicitly tested against the desiderata. I will integrate them into the "Motivation/Case" sections of the relevant desiderata.

      *(Refining "Person vs Polity"):* This needs its own desideratum because the prompt specifically asks for it.

      *(Refining "Legitimacy vs Effectiveness"):* Also needs its own desideratum.

      Let's assemble the list.

      *   D1: Normative Force (Binding vs Costly).
      *   D2: Diachronic Authority (Self 1 over Self 2 / Gen 1 over Gen 2).
