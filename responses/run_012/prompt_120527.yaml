answer: |-
  **The Case of Kieran's Two Years**

  Consider two years in Kieran's life, identical in relationships, knowledge, and external achievements. In Year One, Kieran is driven by a pervasive, non-painful conative hunger for professional status; he frequently satisfies this hunger, experiencing significant sensory pleasure from the success, and endures no physical pain, yet the hungry leaning-toward returns immediately after each satisfaction. In Year Two, Kieran feels no conative hunger for status or anything else, experiences no sensory pleasure from his days, but endures a constant, dull, physically felt backache that is absent in Year One.

  ***

  **(1) Verdicts and Rationale**
  *   **Tranquilism:** Ranks **Year Two** as better. The view reads off only the presence of craving and suffering. Year One contains high craving (a intrinsic disvalue) and zero suffering. Year Two contains zero craving (an intrinsic good) and moderate suffering. For the Tranquilist, the total elimination of the conative pull in Year Two outweighs the disvalue of the backache, regardless of the lost pleasure.
  *   **Hedonism:** Ranks **Year One** as better. The view reads off only felt pleasure and pain. Year One has significant pleasure and zero pain. Year Two has zero pleasure and moderate pain. The net balance of felt experience is positive in Year One and negative in Year Two.
  *   **Desire-Satisfactionism:** Ranks **Year One** as better. The view reads off the satisfaction of pro-attitudes. In Year One, Kieran has strong desires for status and satisfies them repeatedly. In Year Two, he has no desires (or they are trivial), so there is little to no desire-satisfaction to count toward well-being.

  **(2) The Work-Doing Feature**
  The single feature doing the work is the **non-aversive nature of the craving** in Year One. The case stipulates the "hunger" is a conative pull that is *not* itself felt as pain.
  *   **If removed:** If the craving in Year One were described as psychologically painful (aversive), the Hedonist would count it as suffering. Both views would then agree Year Two is better (assuming the backache is less severe than the psychic pain). If the craving were removed entirely from Year One (making it desireless), both views would agree Year One is better (Pleasure + No Pain > Backache + No Pleasure). The divergence relies entirely on the Hedonist treating non-painful craving as neutral, while the Tranquilist treats it as negative.

  **(3) The Collapse Objection**
  The case survives the objection that "craving just is a kind of suffering," but only precariously. The objection claims that any "conative pull" must be phenomenologically aversive (tense, itchy, lacking) to be noticed, meaning it collapses into suffering.
  *   **Fix/Survival:** To survive, the case must lean on the intuition that one can be "oriented toward" a goal without feeling discomfort—like a ship on a heading, or a mild, background interest that isn't painful but prevents *tranquility*. If the craving is truly non-aversive, the Tranquilist must argue that well-being is about the *structure* of the will, not just felt tone. If the craving *is* aversive, the case collapses into a standard Hedonist calculation (Pain A vs. Pain B), failing the spec. An ordinary case can do it, provided we accept that "wanting" is not identical to "hurting."

  **(4) The Hedonist Counter-Attack**
  A Hedonist would attack the **axiological weight** assigned to craving. They would argue: "If the craving in Year One is not felt as unpleasant, it is experientially invisible. To say it lowers well-being is to fetishize a metaphysical state over the actual quality of the subject's experience." They would press that Kieran in Year One *feels* better than Kieran in Year Two, and since prudential value is about how life goes *for the person*, the person's felt experience (pleasure/pain) must trump the abstract presence of a conative state that isn't bothering them. They would conclude the Tranquilist is prioritizing a "view from nowhere" over the agent's actual phenomenology.
