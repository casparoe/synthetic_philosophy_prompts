answer: |-
  # Joint Statement on the Is-Ought Gap

  **Signatories:** The Neo-Aristotelian Naturalist and The Is-Ought Gap Defender

  **Date:** October 26, 2023

  **Context:** Over the course of this collaboration, we sought to determine whether the apparent impasse between neo-Aristotelian ethical naturalism and Humean gap theory is substantive or merely verbal. We aimed to isolate exactly where the logic holds, where the metaphysics diverge, and what evidence would be required to settle the dispute. The following document represents our consensus on the structure of the debate, our remaining substantive disagreements, and specific predictions regarding key test cases.

  ### I. Agreed Claims

  1.  **The Gap as Logical Entailment:** We agree that the "Is-Ought Gap" is strictly valid as a thesis about logical entailment. No valid deductive argument can move from a set of purely descriptive premises (statements about what *is* the case) to a normative conclusion (a statement about what *ought* to be the case) without at least one normative premise bridging the gap. Any argument claiming to do so is formally invalid.
  2.  **Entailment vs. Justification:** We agree that the gap is a thesis about entailment, but we disagree on whether it is also a thesis about *justification*. We agree that logical entailment is necessary for deductive proof. However, we disagree on whether natural facts can provide *reasons* for normative conclusions without functioning as premises in a deductive syllogism. The Neo-Aristotelian holds that natural facts can justify norms directly; the Gap Defender holds that justification requires a prior normative commitment.
  3.  **The Naturalistic Fallacy:** We agree that the "Naturalistic Fallacy" is a label for a specific bad inference: defining "good" exclusively in terms of a natural property without providing an argument for why that property is good (the definist fallacy). We disagree on whether neo-Aristotelianism commits this fallacy. The Neo-Aristotelian argues they are not defining "good" but identifying it with functional flourishing; the Gap Defender argues this is a definition in disguise.
  4.  **Verbal Dispute Identification:** We identify a significant verbal dispute regarding the scope of the word "normative." The Neo-Aristotelian uses "normative" to include *functional norms* (e.g., "a heart ought to pump blood"). The Gap Defender reserves "normative" for *rational or moral obligations* (e.g., "you ought to keep promises"). Much of our past talking past each other stems from the Neo-Aristotelian treating functional norms as sufficient for ethical conclusions, while the Gap Defender treats them as merely descriptive regularities relative to a goal.
  5.  **Status of the Literature:** We acknowledge that this debate is genuinely contested among experts. Neither side can claim the consensus of the field. The agreement reached here regarding logical entailment is standard meta-ethical orthodoxy; the disagreement regarding natural normativity remains a live wire in contemporary philosophy.

  ### II. Remaining Disagreements

  | Issue | Neo-Aristotelian Naturalist (Position A) | Is-Ought Gap Defender (Position B) |
  | :--- | :--- | :--- |
  | **1. The Nature of "Defect"** | A "defect" in a living organism is an objective biological fact that carries normative weight independently of human desire. If a trait hinders the species' life form, the organism *ought* not to have it. | A "defect" is only relative to a contingent goal (e.g., survival). Calling something "defective" describes its failure to meet a standard, but does not generate an obligation unless the agent accepts the goal. |
  | **2. Source of Normativity** | Normativity is discovered in the world. The life form of a species generates reasons for action. To be rational is to align with the good of your life form. | Normativity is constructed or imposed by agents. Facts about the world only become reasons when an agent endorses them through desire, commitment, or rational choice. |
  | **3. The "Why Care?" Question** | It is practically irrational to not care about your own flourishing as a human being. The demand of morality is internal to being an agent. | It is an open question why an agent should care about morality or flourishing. Rationality does not demand specific ends, only consistency in pursuing them. |

  ### III. Cruxes and Pre-Registered Predictions

  We have identified three specific cases that bear directly on our disagreements. Below, we state the case and each side's prediction regarding how a neutral observer should interpret the normativity involved.

  #### Crux 1: The Chess Player
  **Case:** A player announces he is playing chess but moves his knight like a bishop. He insists he is not making a mistake but simply playing his own way.
  **Question:** Did he make a mistake *simpliciter*, or is he only mistaken relative to a desire to play standard chess?

  | Side | Prediction |
  | :--- | :--- |
  | **Neo-Aristotelian** | He made a mistake *simpliciter* relative to the practice. The rules of chess constitute the game; violating them is a functional defect in the activity itself. The "ought" (you ought not move the knight like a bishop) is binding on anyone engaging in the practice, regardless of their momentary desires. |
  | **Gap Defender** | He is only mistaken conditionally. The norm is hypothetical: *If* you want to play chess, you ought not move the knight like a bishop. If he rejects the goal of playing chess, no mistake has been made, only a change in activity. There is no categorical error. |

  #### Crux 2: The Defective Species Member
  **Case:** A member of a fully described species lacks a trait the rest of them need to survive (e.g., a wolf born without legs).
  **Question:** Does "defective" follow from the biology, and does any "ought" follow from that defect?

  | Side | Prediction |
  | :--- | :--- |
  | **Neo-Aristotelian** | "Defective" follows as an objective biological truth. Furthermore, a natural "ought" follows: the organism *ought* to have had legs. This is not a moral judgment on the wolf, but a normative fact about its life form. This natural normativity is the foundation for human ethical norms. |
  | **Gap Defender** | "Defective" follows only as a statistical or functional description relative to the goal of survival. No "ought" follows for the individual wolf. To say it "ought to have had legs" is shorthand for "legs would have helped it survive," not a claim that nature owed it legs or that it failed a normative duty. |

  #### Crux 3: The Indifferent Agent
  **Case:** A human agent says he understands all the biological facts about human flourishing and rational agency but says, "I don't care. Why should I care about being a good human?"
  **Question:** Is this agent irrational, or is he logically consistent but morally indifferent?

  | Side | Prediction |
  | :--- | :--- |
  | **Neo-Aristotelian** | The agent is practically irrational. Understanding what one is (a human agent) entails understanding what one is for. To reject the good of one's own life form is a failure of rationality, akin to the chess player rejecting the rules while claiming to play. |
  | **Gap Defender** | The agent is logically consistent. He has not made a factual error. He simply lacks a specific desire or commitment. You cannot derive "you should care" from "this is good for humans" without the premise "you should care about what is good for humans." The gap remains open. |

  ### IV. Conclusion on Settled vs. Contested Matters

  We wish to be explicit for the reading group: The claims in Section I (regarding logical entailment) are settled among professionals who know this literature. No serious philosopher claims descriptive premises deductively entail normative conclusions without a bridge. However, the claims in Sections II and III are genuinely contested. Whether natural facts can justify norms without a bridge premise, and whether functional defects constitute real normative failures, remains an open metaphysical and epistemological dispute. This packet is designed to explore that open dispute, not to resolve it definitively.
