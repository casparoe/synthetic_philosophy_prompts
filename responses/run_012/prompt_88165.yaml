      *   *Defense of Verdict:* Focus on the definition of "self-sustaining loop." A memory is passive. A self is active. The loop is broken. The harm is the cessation of the *agent*, not the *information*.
      *   *Strongest Objection:* If the pattern is identical enough, why isn't it the same self? (Teletransportation paradox).
      *   *Reply:* Because the *causal homeostasis* is maintained by a different master (the survivor's brain). The goals being pursued are the survivor's, using the deceased's model.
      *   *What would change my mind:* Evidence that residual patterns can act autonomously to fulfill the deceased's specific unresolved goals without survivor intervention.

