      *   *Wait, one more thought:* If I Reject, I need to make sure I'm not just reverting to a soul view. I must argue from within the pattern view.
      *   *Argument:* A pattern in another brain is a *simulation* run by a different processor (the survivor's brain). It serves the survivor's goals, not the deceased's. Therefore, it is not the *same* self-sustaining loop. It is a different loop modeling the old one. Thus, the original loop has stopped. Death is total.
