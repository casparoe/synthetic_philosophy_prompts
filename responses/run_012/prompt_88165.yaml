      *   *The Proposal:* Death badness $\propto$ Loss of Pattern Realization.
      *   *The Intuition Pump:* Is it worse for Einstein to die than a hermit? Standard intuition says death is equally bad for the subject (deprivation of future goods). This proposal says Einstein's death is *less* bad because his pattern survives.
