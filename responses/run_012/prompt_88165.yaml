answer: |-
  The "pattern view" of the self, championed by Douglas Hofstadter, suggests that personal identity is not tied to the specific biological substrate of the brain but to the abstract, self-referential loop of symbols and representations that constitutes a mind. If the self is software rather than hardware, it stands to reason that the software could, in principle, run on other hardware. This leads to a provocative ethical proposal: if a person's pattern persists in the minds of those who knew them, their death is less total, and therefore less bad *for them*, than if they died unknown. On this view, the harm of death is proportional to the loss of "residual realization." While this proposal offers a comforting metaphysics of survival, it ultimately fails to account for the nature of agency and welfare inherent in the pattern view itself. I reject the proposal. The persistence of a person's pattern in other minds does not mitigate the harm of their death, because a passive representation of a self-sustaining loop is not itself a self-sustaining loop, and without the active pursuit of ends, there is no subject left to whom "badness" can accrue.

  To understand the appeal of the proposal, one must take the pattern view seriously. If "I" am merely the complex structure of my memories, habits, and predictive models, then the destruction of my brain is not necessarily the destruction of "me," provided that structure is instantiated elsewhere. Hofstadter himself has suggested that we live on in the "shimmering" of our symbols in the brains of our loved ones. The strongest case for the proposal rests on the intuition that identity comes in degrees. If a copy of me exists with 90% fidelity, am I not 90% alive? If death is the cessation of identity, and identity is gradual, then death must be gradual. Furthermore, this view aligns with our phenomenology of grief. When we mourn, we lament that the person is gone *from us*. If they remain vividly in our minds, the intuitive sting of their absence is lessened. It suggests a universe where love acts as a metaphysical anchor, preserving the beloved against the void.

  However, the case against the proposal is rooted in the distinction between a map and a territory, or more precisely, between a simulation and a subject. The first objection is the problem of subjectivity. Even if my friend holds a high-fidelity model of my personality in their brain, that model does not have a first-person point of view. It does not experience the world *as* me. The "what-it-is-like" to be me ceases abruptly at biological death. The residual pattern is a static object within *their* consciousness, not a new center of consciousness itself. Second, the proposal makes the badness of death contingent on external factors—specifically, one's social reach. This yields the counterintuitive result that a beloved public figure suffers a lesser death than a hermit. This conflates the *value* of a life (its influence) with the *welfare* of the liver (their experience). Finally, it confuses influence with existence. A book preserves an author's ideas, but the author is still dead. Similarly, a memory preserves a person's pattern, but the person is no longer there to care about it.

  Despite the strength of these objections, the core reason to reject the proposal lies in a stricter interpretation of the pattern view itself. The proposal assumes that the "pattern" is merely informational content. But Hofstadter's "strange loop" is not just data; it is a *process*. It is a self-sustaining, homeostatic system that actively seeks to maintain its own integrity and pursue its own goals. A memory of a person in another brain is not a self-sustaining loop; it is a tool used by *another* self-sustaining loop (the survivor). The survivor's brain uses the model of the deceased to navigate the survivor's own world, not the deceased's world. The locus of agency has shifted. Because welfare and harm are predicates that apply only to agents capable of experiencing or pursuing ends, the cessation of the original agent's loop is a total loss of welfare capacity, regardless of how well the map of that agent is preserved in other territories.

  The strongest objection to this rejection appeals to the Parfitian reduction of identity. If psychological continuity is what matters for survival, and residual realization provides a degree of psychological continuity, then surely some survival has occurred. If I survive in degrees, surely the harm of my cessation is also a matter of degrees. To claim death is a binary "cliff" when identity is a gradient seems metaphysically inconsistent. If 40% of my pattern runs in my spouse, why am I 100% harmed?

  The reply to this objection is that psychological continuity is necessary but not sufficient for the persistence of welfare; *agency continuity* is required. A pattern running in another mind is causally disconnected from the original's goal-state. It cannot act to fulfill the original's desires unless those desires align with the host's. For example, if I desire to finish my novel after I die, a memory of me in your head cannot write it unless *you* want to write it for me. The "loop" has been broken because the feedback mechanism that corrects errors and pursues goals is now owned by you. Therefore, the "self" that persists is a puppet, not a person. The harm of death is the loss of the ability to be the author of one's future. A puppet cannot be harmed by having its strings cut, because it was never the agent; the original agent was the one who died. Thus, the death remains wholly bad for the deceased because the capacity for autonomous valuation has been entirely extinguished.

  In conclusion, while the pattern view allows for the survival of information, it does not allow for the survival of the subject of welfare in a way that mitigates the harm of death. The proposal mistakes the echo for the voice. To accept it would be to value the shadow over the substance, granting a metaphysical privilege to popularity that the structure of consciousness does not support. Death remains the total deprivation of the future for the organism that housed the loop, regardless of how brightly that loop flickers in the minds of the living.

