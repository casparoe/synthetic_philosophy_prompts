      *   *Wait, looking closer:* The prompt asks if it makes death "less bad *for them*."
      *   If I accept the pattern view, the "them" is the pattern. If the pattern exists elsewhere, "them" exists elsewhere.
      *   However, the *harm* of death is usually understood as the cessation of experience. A low-fidelity copy in another brain does not experience the world *as* the original.
