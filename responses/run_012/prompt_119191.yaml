      *   *Wait, let's look closer at (3).* (3) says absence of suffering is good even with no one to enjoy it. Absence of pleasure is not bad with no one to be deprived. This is the Benatar asymmetry.
      *   *The Friend's Move (6):* Applies (3) to death. Death = no person. Therefore absence of pleasure is not bad.
      *   *The Counter:* When we weigh death, we are weighing it for the person *before* they die. They are the ones deprived. The "no one left" argument ignores the person who *is* there making the decision or being acted upon. The harm of death is experienced as a loss by the living subject anticipating the end, or objectively as a loss of a future they valued.
      *   *So the recommendation:* Keep (3) for the non-existent. Reject its application in (6) to the existent. The load-bearing premise is the equivocation between "never existing" and "ceasing to exist."

