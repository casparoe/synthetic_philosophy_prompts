      *   *Self-Correction on Step (6):* The friend argues that because there is no one *after* death to be deprived, the absence of pleasure isn't bad. This ignores that the deprivation is relative to the life that *was* being lived. The harm is to the person who dies, not the corpse. The friend treats the person as if they vanish into the same metaphysical status as the never-conceived. But the never-conceived never had a stake. The dying person has a stake.
      *   *So the rejection:* Reject the inference from (3) to (6). (3) is about the metaphysics of non-existence. (6) applies it to the cessation of existence. The bridge is weak.
