  **JOINT STATEMENT ON THE COHERENCE OF QUALIA**

  **Preamble**
  We, the undersigned representatives of Camp R (Realists about Qualia) and Camp Q (Skeptics about Qualia), submit this document as the product of adversarial collaboration. Our aim is not consensus on the final metaphysical status of consciousness, but precision regarding where we agree, where we disagree, and what would constitute resolution. We define "qualia" for the purposes of this inquiry as the intrinsic, ineffable, private, and directly apprehensible characters of experience, as specified in the introduction.

  **I. Agreed Claims**
  Both camps affirm the following propositions without reservation:

  1.  **The Existence of Experience:** There is something it is like to be a conscious subject. Neither camp denies the occurrence of experience itself; the dispute concerns the ontological categorization of its characters.
  2.  **Introspective Reports as Data:** First-person reports regarding experience constitute legitimate data that any theory of mind must accommodate, though the camps differ on whether these reports are incorrigible.
  3.  **Functional Explanatory Power:** Functional and dispositional accounts successfully explain behavioral discrimination, verbal report, and cognitive access. The disagreement is whether these accounts exhaust the explanation of experience.
  4.  **Separability of Canonical Conditions:** The four conditions often bundled as "qualia" are not logically inseparable. Specifically:
      *   *Ineffability* is agreed to be a contingent limitation of public language, not necessarily a metaphysical barrier.
      *   *Privacy* is agreed to denote asymmetry of access (first-person vs. third-person), though the camps disagree on whether this asymmetry is principled or practical.
      *   *Direct Apprehensibility* is agreed to describe the phenomenological mode of presentation, not necessarily the infallibility of the judgment made therein.
      *   *Intrinsicality* is the primary locus of dispute; both agree it is possible to conceive of properties that are not relational, but disagree on whether experience instantiates them.
  5.  **Requirements for Account:** A complete account of the mind must explain why experience occurs and why it has the specific phenomenological structure it does. It need not, however, posit entities that lack causal efficacy unless their positing resolves explanatory gaps elsewhere.
  6.  **No "Magic" Commitment:** Camp R does not claim qualia are non-physical substances exempt from natural law; Camp Q does not claim experience is an illusion. Both seek a naturalistic understanding.

  **II. Table of Remaining Disagreements**

  | Sub-Question | Camp R Position | Camp Q Position | Crux | Agreed Test/Case | R Prediction | Q Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Supervenience of Character** | Phenomenal character can vary while all functional, relational, and physical properties remain fixed (e.g., Inverted Spectrum). | Phenomenal character is constituted by functional/relational roles; no variation is possible without functional change. | Can intrinsic character vary independently of function? | Philosophical analysis of inverted spectrum scenarios constrained by neurophysiology. | Conceivability implies possibility; functional isomorphism allows phenomenal difference. | Conceivability does not imply possibility; functional isomorphism entails phenomenal identity. |
  | **2. Status of Privacy** | Privacy is an in-principle limitation: third-person access to the *quality* of experience is impossible, not just difficult. | Privacy is a practical limitation: better tools and theories could render phenomenal states publicly observable. | Is the first-person/third-person gap epistemic or ontological? | Hypothetical development of perfect neuro-phenomenal mapping. | Even with perfect mapping, the "what it is like" remains private to the subject. | Perfect mapping dissolves privacy; the state becomes publicly observable like a brain state. |
  | **3. Methodological Premise** | Requiring public verification for existence begs the question against intrinsic properties; operationalism is too restrictive. | Posits that make no difference to observable outcomes (including reports) are explanatorily idle and should be dropped. | Does explanatory utility require operational difference? | Analysis of whether "hidden" qualia add predictive power. | They explain the *reality* of experience which functionalism leaves out. | They add no predictive power over dispositional accounts; thus, they are idle. |

  **III. Evaluation of Probe Cases**

  **1. The Coffee-Tasters Case**
  *Scenario:* Two tasters report opposite changes in judgment regarding a coffee blend over time. Further introspection cannot settle whether the coffee changed, the palate changed, or the *seeming* changed.
  *   **Camp R:** Maintains there is a fact of the matter regarding the phenomenal character independent of the judgment. Even if reports and dispositions stabilize, the intrinsic quality could have shifted. The indeterminacy is epistemic, not ontological.
  *   **Camp Q:** Maintains there is no fact of the matter beyond the dispositions and reports. If the functional profile (discrimination, preference, report) is fixed, the experience is fixed. The feeling of a remaining "fact" is a cognitive illusion.
  *   ** bearing:** Targets Intrinsicality and Privacy.

  **2. Fixed Report / Altered Relations Case**
  *Scenario:* A subject undergoes a neural alteration that changes all causal relations of a visual experience (inputs and behavioral outputs are rerouted via complex compensation) while the subject's best introspective report ("it looks red") remains fixed.
  *   **Camp R:** If the report remains fixed under optimal introspection, the qualia remain the same. This supports Intrinsicality: the property is internal to the experience, not its causal web.
  *   **Camp Q:** If causal relations are altered, the experience *is* altered, regardless of report. The fixed report indicates a failure of introspective access, not stability of qualia. This supports the view that qualia are dispositional.
  *   **Bearing:** Targets Intrinsicality and Direct Apprehensibility.

  **3. High-Reliability Agreement Case**
  *Scenario:* Two subjects provide fine-grained reports of their experiences that agree with high reliability and predict each other's discriminatory behavior perfectly.
  *   **Camp R:** Agreement in report does not guarantee identity of qualia. They may be inverted relative to one another despite functional alignment. Privacy prevents final verification.
  *   **Camp Q:** Perfect alignment of report and function constitutes all there is to "same qualia." To posit a hidden difference is to posit a difference that makes no difference.
  *   **Bearing:** Targets Privacy and Ineffability.

  **4. The Optimal Attention Criterion**
  *Proposal:* Two token experiences have the same qualia just in case they are indiscriminable to the subject under conditions of optimal attention.
  *   **Analysis:** Adopting this criterion would hand Camp Q its conclusion. For Camp R, indiscriminability is an epistemic relation, whereas qualia are ontological properties. If qualia are *defined* by indiscriminability, then intrinsic differences that escape attention are ruled out by definition, trivializing Camp R's claim that qualia are intrinsic properties potentially beyond discriminative capacity. Camp R cannot accept this as a definition, though they may accept it as a heuristic for identifying qualia in practice. Camp Q finds this criterion sufficient because it ties the posit directly to observable (reportable) constraints.

  **IV. Closing Reflections**

  **Verbal Dispute Analysis**
  We acknowledge that a portion of the dispute may be verbal, centering on the term "property." Camp R uses "property" to denote a mode of presentation that exists regardless of its causal role. Camp Q uses "property" to denote a causal power or dispositional basis. If "property" is analyzed as "causal power," Camp Q wins by definition; if analyzed as "phenomenal feature," Camp R wins by definition. However, the dispute is not *merely* verbal because it impacts methodology: Camp R seeks methods to isolate phenomenal features from function, while Camp Q seeks to reduce phenomenal features to function.

  **Falsification and Movement**
  *   **Camp R** would concede their position if it were demonstrated that every purported example of intrinsic phenomenal character could be fully predicted and explained by functional/dispositional accounts without remainder, rendering the "intrinsic" posit redundant.
  *   **Camp Q** would concede their position if a case were constructed where functional isomorphism clearly failed to capture a distinction in experience that had explanatory consequences for the subject's future behavior or learning, implying a non-functional causal role.
  *   **Shared Moving Consideration:** Both camps agree that the debate would be materially advanced by a rigorous account of how introspective reports are generated. If Camp Q can show introspection is purely constructive (like perception), their view gains ground. If Camp R can show introspection reveals pre-existing structures not determined by function, their view gains ground.

  We sign this statement acknowledging that while our metaphysical commitments diverge, our commitment to clarity and empirical accountability is shared.

  **Signed,**
  **Representative, Camp R**
  **Representative, Camp Q**
