answer: |-
  We began this weekend as friends and we end it as friends, but the acrimony that arose between us over the nature of moral compromise demanded that we pause before resuming our usual ease. We found ourselves unable to state the other's position without caricature, which is the surest sign that a substantive disagreement has become entangled with a verbal one. Rather than allow the confusion to fester or to settle for a vague agreement to disagree, we have drafted this statement to map exactly where we stand together, where we part company, and what would be required to bridge the gap. We offer this not as a resolution imposed from outside, but as a record of our own attempt to think clearly about how people who value different things manage to live in the same world.

  There is much that we affirm without hesitation. We agree that compromise is distinct from capitulation, wherein one side surrenders entirely, and distinct from the mere splitting of a difference, which ignores the substance of the dispute. We agree that compromise is primarily about joint action under persisting disagreement rather than about the alignment of belief or value itself. Neither of us expects the other to change their mind about what is good or true in order to cooperate on what is to be done. We also agree that a successful compromise leaves both parties better off than the alternative of entrenched conflict, preserving the relationship and allowing for common projects that would otherwise be impossible. Where we diverge is on the description of this mechanism. One of us maintains that this process is accurately described as a form of trade, wherein concessions are costs set against benefits, yielding a net gain for each party by their own lights. The other maintains that this is a category error, arguing that values lack exchange rates and common currency, so a concession cannot be a cost that is offset by a benefit without corrupting the nature of the value itself.

  We have identified two specific themes that surfaced repeatedly in our argument and we take a position on them here. The first is the distinction between compromising on action versus compromising on value. We agree that most real-world compromise concerns what we do together while leaving our internal convictions intact. The proponent of the trade view argues that this makes the exchange model stronger, as actions are fungible even if values are not. The proponent of the category error view argues that this makes the exchange model weaker, as coordinating action without aligning values is merely coexistence, not trade. On this point, we have concluded that the dispute is largely verbal. We both describe the same phenomenon of modus vivendi but disagree on whether the label trade applies to the coordination of actions despite incommensurable ends. The word trade implies a commensurability that does not exist in our values, yet the structure of mutual concession for mutual benefit resembles trade enough that the metaphor holds pragmatic utility even if it fails metaphysical strictness.

  The second theme is the claim that compromise acts as insurance against being wrong. The proponent of the trade view argues that one concedes on a point where one might be mistaken in return for the other conceding on a point where they might be mistaken, thereby hedging moral risk. The proponent of the category error view replies that insurance requires a probability and a measurable loss, and that moral loss is not measurable in the way required for the concept of insurance to hold. Here we judge the dispute to be genuine. It turns on an empirical and philosophical question about whether moral error entails a cost that can be quantified or weighed across different domains of life. If moral loss is purely qualitative and incommensurable, the insurance analogy collapses. If moral loss can be broadly assessed in terms of well-being or flourishing that admits of comparison, the analogy holds. We cannot settle this between us today, but we recognise that this is not merely a quarrel over words.

  To move forward, we have identified the cruxes upon which our remaining disagreement turns. The first crux concerns the phenomenology of concession. We both agree that the subjective experience of making a compromise is evidence that bears on this question. The trade proponent predicts that upon reflection, individuals will report feeling that they have paid a price to secure a benefit, and that this feeling of cost is consistent across different types of moral disputes. The category error proponent predicts that individuals will report feeling residue or regret that is not cancelled out by the benefit gained, indicating that no true offsetting occurred. The second crux concerns the stability of compromise over time. We agree that the historical longevity of compromised arrangements is relevant evidence. The trade proponent predicts that compromises will endure only so long as the balance of concessions remains favourable, behaving like a contract that can be breached if the exchange rate shifts. The category error proponent predicts that compromises will endure based on the strength of the relationship or the shared commitment to peace, regardless of whether the specific concessions remain balanced, because the binding agent is not the trade itself but the mutual recognition of legitimacy.

  In verdict, we conclude that our argument over whether compromise is trade was predominantly verbal, rooted in whether we prioritise the structural similarity of mutual benefit or the metaphysical incompatibility of value systems. However, our argument over whether compromise functions as insurance against error is genuine, resting on the unresolved question of whether moral losses are measurable. We commit to testing these predictions against our own future experiences of disagreement. When we next compromise, we will attend not only to the outcome but to the texture of the concession, noting whether it feels like a cost that has been reimbursed or a burden that is simply shared. We will also observe whether our willingness to uphold the compromise depends on the perceived fairness of the exchange or on the value we place on our continued association.

  We write this not to declare victory for either side, but to clarify the ground on which we stand. We value our friendship more than we value the consistency of our moral metaphysics, yet we believe that friendship is strengthened by clarity rather than obscured by it. We accept that we may continue to use different languages to describe our cooperation, provided we recognise that the underlying reality we are describing is the same. We will live with our differences, not because we have traded away our convictions, but because we have found a way to act together despite them. Whether that is called trade or coexistence matters less than the fact that we remain, firmly, on the same side.
