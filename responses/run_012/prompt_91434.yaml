      *   **Order of Components:**
          1.  Naive Realism (The Camera).
          2.  The Interpretive Layer (The Detective).
          3.  The Penetrative Layer (The Modulator).
          4.  The Craft Translation (The Prose).
          *Dependency:* You can't teach 3 without 2. You can't teach 4 without 3.

      *   **The Single Case:**
