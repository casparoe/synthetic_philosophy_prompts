answer: |-
  ### 1. The Sequence of Components

  To make cognitive penetration intelligible without collapsing into psychology or metaphor, you must introduce the concepts in this specific order. Each step creates the necessary friction for the next.

  1.  **The Naive Realist Baseline (The Camera):**
      *   *Content:* Establish the default assumption that perception is a recording of external data.
      *   *Dependency:* This is the straw man. You cannot demonstrate penetration without first establishing the "clean feed" myth.
  2.  **The Interpretive Layer (The Detective):**
      *   *Content:* Introduce the idea that we *judge* what we see (inference). "I see a shape; I infer it is a man."
      *   *Dependency:* This distinguishes *sensing* from *thinking*. Students must grasp this distinction before you can blur it.
  3.  **The Penetrative Layer (The Modulator):**
      *   *Content:* Introduce the claim that cognition alters the *sensory experience itself*, not just the judgment. "The shape *looks* like a man before I judge it."
      *   *Dependency:* Depends entirely on Step 2. If they haven't secured the difference between seeing and thinking, this step will dissolve into "it's all thinking."
  4.  **The Craft Translation (The Prose):**
      *   *Content:* How to write the Modulator without slipping back into the Detective.
      *   *Dependency:* Depends on Step 3. If they don't believe the modulation is real, they will write metaphor ("it was *as if* the wall moved") rather than phenomenology ("the wall leaned").

  ### 2. The Single Case

  **Nomination:** **The "Burdened Staircase."**
  (A character climbing a flight of stairs to a destination that represents either desire or dread.)

  **What it must exhibit:**
  It must exhibit a change in **visual slant or distance** correlated with a physiological or cognitive state (e.g., fatigue, grief, anticipation), not just a change in physical effort. The stairs must *look* steeper, not just *feel* harder to climb.

  **What it must be free of:**
  It must be free of **metaphorical language** (similes, "as ifs") and **emotional labeling** (words like "daunting," "oppressive"). If the text says "the stairs rose like a mountain," it is metaphor. If it says "the stairs rose steeper than yesterday," it is perception.

  **Evaluation of the "Frightened Character/Ordinary Street" Example:**
  **Do not use this.** It will teach the opposite lesson.
  *   **Reason:** The "menace in the ordinary street" relies on ambiguity (shadows, noises). Ambiguity invites *inference* (Step 2), not *penetration* (Step 3). Students will write, "The shadow looked like a knife," which is an interpretation of an ambiguous shape. They will not write, "The shadow had a sharp edge," which is a claim about the visual data itself. The street example allows the student to hide behind the character's paranoia rather than altering the sensory description. It reinforces the "Interpretive Layer" you are trying to complicate.

  ### 3. Misconceptions and Interventions

  You anticipated three; here are those plus two critical additions, mapped to the sequence where they must be headed off.

  1.  **"It is just attention."** (Selection vs. Modulation)
      *   *The Error:* Students think cognitive penetration means noticing the gun on the table rather than the vase.
      *   *Where to Head Off:* **Step 3 (The Penetrative Layer).**
      *   *The Move:* Show an image where the object is foveal (central vision) and unavoidable. Ask: "If you are staring directly at the grey wall, does your grief make you look *away* from it, or does it make the grey *darker*?" Force the distinction between *selecting* data and *modulating* data.
  2.  **"It means we see whatever we want."** (Volition vs. Automaticity)
      *   *The Error:* Students think the character can choose to see the world differently to feel better.
      *   *Where to Head Off:* **Step 3 (The Penetrative Layer).**
      *   *The Move:* Emphasize the word "Penetration." It implies an invasion, not a choice. Remind them: "You cannot decide to see the stairs as flatter any more than you can decide to digest food faster. It happens *to* the character."
  3.  **"It licenses the view that each of us inhabits a different world."** (Relativism vs. Shared Reality)
      *   *The Error:* Students conclude that because perception varies, there is no shared objective reality to describe.
      *   *Where to Head Off:* **Step 4 (The Craft Translation).**
      *   *The Move:* Insist on a shared physical anchor. "The stairs are physically 30 degrees. Character A sees 30. Character B sees 45. If you write 45 as fact, you break the contract. You must write the 45 *as experienced* while acknowledging the 30 exists."
  4.  **"It is just metaphor."** (Linguistic vs. Phenomenological) *[New]*
      *   *The Error:* Students write "the walls closed in" as a figure of speech for anxiety.
      *   *Where to Head Off:* **Step 4 (The Craft Translation).**
      *   *The Move:* Ban the word "like." If they cannot write the distortion without a simile, they haven't grasped the concept. Demand literal description of the distortion.
  5.  **"It makes the narrator unreliable."** (Distortion vs. Lying) *[New]*
      *   *The Error:* Students treat perceptual penetration as a lie or a mistake to be corrected later in the plot.
      *   *Where to Head Off:* **Step 4 (The Craft Translation).**
      *   *The Move:* Clarify that the narration is *truthfully reporting a false experience*. The narrator is reliable about the *experience*, even if the experience is not about the *object*.

  ### 4. The Closing Question

  Do not ask them to define the term. Ask them to perform the distinction.

  **The Question:**
  > "Write one sentence describing a door that a character needs to open. In the sentence, the door must physically remain the same size, but to the character, it must visually appear to shrink. You are forbidden from using the words: *felt, seemed, looked, like, as if, appeared.*"

  **Why this works:**
  If they understand the distinction, they will write something like: *"The handle receded from his grip."* or *"The frame tightened around the wood."*
  If they do not understand, they will slip into interpretation (*"The door defeated him"*) or metaphor (*"The door was a mouth"*), or they will fail the constraint by using *"It seemed smaller."*

  ### 5. What to Refuse to Settle

  **The Ontological Status of the Perception.**
  Do not settle whether the perception is "true" or "false" in a biological sense. Do not let the seminar devolve into a debate about whether the retina actually changes or if it is merely neural processing.
  *   **Why:** As a craft seminar, your concern is the *textual representation of experience*, not the neuroscience of vision. If you settle the science, you lose the art. If you argue the philosophy too deeply, you lose the writers.
  *   **The Refusal:** "Whether the eye changes or the brain changes is a problem for the philosopher. Your problem is the sentence. If the character experiences the slope as steeper, your prose must bear the weight of that steepness, regardless of the surveyor's map."
