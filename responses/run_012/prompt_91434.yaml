      *   *Core Claim:* Top-down processing (cognition) affects bottom-up processing (sensory experience). It's not just "I see a stick and think it's a snake"; it's "I see a stick and it *looks* snakelike."
      *   *Challenge for Writers:* How to write "looks snakelike" without just saying "he thought it was a snake."
      *   *Challenge for Students:* Distinguishing this from bias, attention, or metaphor.

  3.  **Determine the Order of Components (Pedagogical Flow):**
      *   You can't start with the philosophy. You need the phenomenological experience first.
      *   *Step 1: The Naive View.* (Perception is a camera).
      *   *Step 2: The Interpretive View.* (Perception is data + thought).
      *   *Step 3: The Penetration View.* (Perception is modulated by state).
