  6. You argue that where rationalizability coincides with Nash, the epistemic work is redundant. But if rationality alone doesn't imply backward induction without the knowledge hierarchy, isn't the hierarchy doing necessary work you are dismissing as idle?
  **Follow-up:** If he maintains it is necessary but not justificatory, press: What distinguishes a necessary condition for a result from a justification of that result in your framework?

