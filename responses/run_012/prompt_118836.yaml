  **Follow-up:** If he replies that this is merely mechanical rather than justificatory, press: If the mechanics require common knowledge assumptions that are psychologically implausible, isn't the justification actually undermined rather than just idle?

  3. Your argument relies on common knowledge as a binary state of certainty. If we model this as common p-belief where p is less than one, does the gap between rationalizability and Nash persist, or does the circularity charge dissolve into a matter of degree?
