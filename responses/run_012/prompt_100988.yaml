answer: |-
  The knot you are tied in is the classic tension between **deontological constraint** (adhering to a norm that prevents collective harm) and **marginal consequentialism** (doing the best you can given that others are already causing the harm). Your friend is advocating for the *Unilateralist's Curse* solution (raise your threshold as $n$ grows to protect the norm). Your intuitions are advocating for *Marginal Impact* (if the outcome is fixed, optimize the quality of the outcome).

  Your tentative principle ("endorse it if everyone as confident as you does it") is a form of universalizability. It is strong, but as you noticed, it is blind to the actions of those *less* confident than you, which is exactly where the Unilateralist's Curse bites (the 60% crowd) and where your exception lies (the 90% you).

  Here is a precise formulation that attempts to save your verdicts, followed by the necessary sacrifice and the predictions for your new cases.

  ### The Principle of Conditional Epistemic Stewardship

  **You ought to take the action if and only if:**

  1.  **Baseline:** You estimate the action has positive expected value ($EV > 0$); **AND**
  2.  **Universalizability:** You would endorse a norm permitting the action for all agents with an epistemic position $\ge$ yours; **UNLESS**
  3.  **Inevitability Exception:** You have high confidence that the action will be taken by others regardless of your choice, *in which case* you ought to act if and only if your participation improves the expected quality or safety of the outcome relative to the counterfactual where you refrain.

  ***

  ### Mapping Your Cases to the Clauses

  This principle survives contact with all five cases, but it forces specific justifications for each.

  *   **Case 1 (Sole Leaker):** Satisfies **Baseline** and **Universalizability**. Since $n=1$, the "crowd" risk is null. The fact that you are the only leaker makes the action necessary for the good outcome, satisfying Baseline strongly.
  *   **Case 2 (Many Leakers):** Satisfies **Inevitability Exception**. You know the documents will leak (colleagues are ready). Your restraint buys no safety (the norm is already broken by inevitability), so you revert to optimizing the outcome. Leaking ensures you are part of the process, perhaps managing *how* it leaks.
  *   **Case 3 (Sole, 60%):** Satisfies **Baseline** and **Universalizability**. If everyone at 60% acted, and $n=1$, the risk is contained.
  *   **Case 4 (Many, 60%):** Fails **Universalizability**. You cannot endorse a norm where 100 people publish at 60% confidence; the aggregate probability of harm is too high. The **Inevitability Exception** does not trigger because *you* are part of the 60% crowd; if you refrain, you slightly lower the probability of the bad outcome. You are not a "steward" improving a fixed outcome; you are a contributor to the risk.
  *   **Case 5 (Me 90%, Others 60%):** Satisfies **Inevitability Exception**. The 60% crowd will likely act (failing Universalizability on their part). Since their action is effectively inevitable, your calculation shifts. You are not adding to the *probability* of action (which is near 1); you are altering the *quality*. Your 90% version is safer than their 60% versions. Therefore, you act to steward the outcome.

  ***

  ### The Verdict You Must Give Up

  To make this principle coherent, you must soften your intuition regarding **Case 5**.

  Your current verdict is: *"I feel I should publish... I'm the one who has actually looked closely."*
  The Principle requires: *"I should publish **only if** my version is sufficiently better to offset the damage of me validating the norm of unilateral action."*

  **What you lose:** You lose the comfort of thinking your superior judgment automatically exempts you from the Curse. The danger of Case 5 is that *everyone* thinks they are the 90%er. If ten people think they are the 90%er among a crowd of 60%ers, the Curse re-emerges.
  To save the principle, you must admit that in Case 5, you are taking a massive epistemic risk. You are betting that your self-assessment (90%) is accurate while the others' (60%) is not. If you are wrong, and you are actually at 60%, you have just helped destroy the norm *and* added a risky publication to the pile.
  **The Sacrifice:** You must accept that Case 5 is **morally hazardous**. It is permissible only if the differential in quality is *vast*, not just marginal. If your version is 90% safe and theirs is 60% safe, you act. If yours is 65% and theirs is 60%, you must refrain, even if they act, to avoid accelerating the norm collapse. Your current intuition ("I feel I should publish") is too permissive; it needs a "Quality Threshold" clause.

  ***

  ### Predictions for the New Cases

  Here is how the **Principle of Conditional Epistemic Stewardship** handles the two scenarios you haven't thought through.

  **Case 6: One of a hundred, at 60%, action is fully reversible.**
  *   **Verdict:** **Publish.**
  *   **Reasoning:** This triggers the **Baseline** and modifies **Universalizability**. Reversibility drastically lowers the cost of error. If the action is reversible, the "harm" in the Unilateralist's Curse is mitigated. You can test the 60% hypothesis. If it looks bad, you undo it. The "Inevitability" of others acting matters less because the *damage* of their acting is contained. The norm being protected is "don't do irreversible harm," not "don't act."
  *   **Clause:** Baseline + Modified Universalizability (Reversibility lowers the threshold for endorsement).

  **Case 7: One of a hundred, at 60%, action pre-empts others (makes their versions pointless).**
  *   **Verdict:** **Publish.**
  *   **Reasoning:** This negates the **Unilateralist's Curse** entirely. If your action pre-empts the other 99, then effectively $n=1$. The group probability does not compound. You are functionally in Case 3. The risk is not that 100 people will publish bad versions, but that *one* person (you) will publish one version. Since you are at 60% (which you deemed permissible in Case 3), you act.
  *   **Clause:** Baseline + Universalizability (The "crowd" is neutralized by pre-emption, so the aggregate risk calculation collapses to the individual).

  ### Summary of the Knot

  Your friend is right that the **Unilateralist's Curse** is real: as $n$ grows, individual thresholds must rise (Case 4).
  You are right that **Marginal Impact** matters: if action is inevitable, restraint is futile and stewardship is required (Case 2 & 5).

  The principle that unites them is that **Norms protect against uncertainty; Inevitability removes uncertainty.** When you are certain others will act, you are no longer deciding *whether* the norm is broken, but *how*. However, you must pay the price of extreme humility in Case 5: you only get to be the steward if you are truly, verifiably more competent than the crowd. If you are merely confident, the Curse still claims you.
