          *   Categorize by: Freedom-based, Effectiveness-based, Manipulation/Deception-based.
          *   Specify *what* is being nudged (options, wants, information) and *who* is nudging.
          *   Identify if different readings are actually the same claim.
          *   **Constraint:** No citations or reading lists.
      *   **Tone:** Respectful of the user's background (scientific rigor), philosophical but accessible, analytical, slightly conversational but precise.

  2.  **Brainstorming (Mental Scratchpad):**
