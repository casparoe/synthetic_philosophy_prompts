      *   *Shove* implies coercion, bans, mandates.
      *   The slogan "Nudge, don't shove" sounds like a heuristic, but in the council meeting, it was used as a trump card.
      *   Why did it bug the user? Because it conflates *method* with *moral justification*. It assumes nudging is always better without proving why.
      *   *Freedom:* Nudging preserves choice architecture. Shoving removes options. But does preserving choice matter if the choice is rigged?
      *   *Effectiveness:* Maybe nudges work better long-term? Bans create black markets? Or maybe bans work better for public health (like smoking)?
      *   *Manipulation:* Nudging can be covert. If I move the salad to eye level, am I hacking your System 1? Is that different from a ban?
      *   *The "Libertarian Paternalism" contradiction:* It is a contradiction, sort of. Paternalism implies acting against someone's will for their good. Libertarian implies maximum freedom. The trick is "choice preservation."
      *   *Context:* Fast food near schools. Kids vs. Adults. Kids have less autonomy. Does "nudge" work on kids?
      *   *Claim 1:* Nudging is always less coercive. (True by definition, but is less coercion always better?)
      *   *Claim 2:* Nudging is more effective. (Empirically dubious for obesity).
      *   *Claim 3:* Nudging respects autonomy better. (Debatable if manipulation is involved).
