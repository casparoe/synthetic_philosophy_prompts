  6.  **Final Polish:** Ensure the distinction between "nudging the options" (choice architecture) and "nudging the person" (psychological hacking) is clear. Make sure the "school" context is highlighted because it changes the autonomy calculus significantly (children vs. adults). The user's biochem background appreciates precise definitions, so avoid vague philosophical jargon where possible.

