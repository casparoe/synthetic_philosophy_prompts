  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Use the protein folding analogy. Slogans are like secondary structures that hide the primary sequence.
      *   *Brainstorming:* Let it flow. Mention System 1/System 2. Mention the school context (children). Mention the "status quo bias."
      *   *Category 1: Freedom/Autonomy.*
