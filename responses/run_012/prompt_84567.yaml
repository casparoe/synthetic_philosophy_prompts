answer: |-
  This is a remarkably precise diagnosis of the normative fragmentation inherent in the modern research university. You are observing what legal theorists call the "bundle of rights" being unbundled not just legally, but metaphysically. Each regime treats the "idea" as a different ontological category to serve a distinct teleological end.

  Here is a reconstruction of the metaphysical and normative presuppositions of each regime, an evaluation of your hypothesis regarding administrability versus attribution, an analysis of the inconsistencies, and a thought experiment on unifying the system under an "attribution-only" model.

  ---

  ### 1. Regime Reconstructions: Conceptions of the Idea

  #### A. Copyright Law
  *   **Conception of the Idea:** *Res Nullius* (Nobody's Thing) / Public Good.
  *   **Conception of Expression:** Extension of Personality (Hegelian) or Crystallized Labor (Lockean).
  *   **Presupposition:** Ideas are the building blocks of thought; to own them is to own the medium of thinking itself. Therefore, ideas must remain in the commons to ensure freedom of speech and future creation. Only the specific *form* embodies enough authorial will to warrant property rights.
  *   **Ruled Out:** The Lockean appropriation of abstract patterns. It rejects the notion that thinking a thought first grants exclusive dominion over that thought's structure.
  *   **Strictly Presupposed vs. Well Served:**
      *   *Strict:* None metaphysically. Copyright does not require ideas to be *inherently* unownable, only that they *ought not be owned* for policy reasons.
      *   *Well Served:* The dualism of form/content. This metaphysics makes the regime administrable, but the law could survive a monist view if it chose to limit rights pragmatically.

  #### B. Patent Law
  *   **Conception of the Idea:** Discoverable Utility / Instrumental Fact.
  *   **Presupposition:** An invention is not merely a thought, but a technical solution to a problem that requires investment to reveal. It is a temporary monopoly granted as a *quid pro quo* for disclosure. The idea is treated as a finite resource that requires exclusion to be produced efficiently.
  *   **Ruled Out:** Ideas as eternal truths (laws of nature are not patentable) or ideas as pure speech. It rejects the copyright view that the "method" should be free.
  *   **Strictly Presupposed vs. Well Served:**
      *   *Strict:* Utilitarianism. The system presupposes that without temporary ownership, the specific class of "useful" ideas would be under-produced.
      *   *Well Served:* The novelty/non-obviousness filter. This treats ideas as having an objective "distance" from the prior art, implying ideas exist in a searchable, mapable space.

  #### C. Research Integrity (Plagiarism Policy)
  *   **Conception of the Idea:** Testimonial Credit / Intellectual Lineage.
  *   **Presupposition:** Knowledge is a social, communicative act. An idea is a marker of the agent who generated it. To use the idea without attribution is to lie about the genealogy of knowledge (a deontological violation) and to steal reputational capital (a consequentialist harm).
  *   **Ruled Out:** The view that ideas are objective facts where the source is irrelevant (e.g., nobody cites the "discoverer" of gravity in a physics paper usually, but they do cite a specific theoretical framework). It rejects the patent view that ownership expires; attribution is perpetual.
  *   **Strictly Presupposed vs. Well Served:**
      *   *Strict:* **The Agent-Idea Link.** Unlike copyright, integrity policy *strictly presupposes* that an idea retains a moral connection to its originator. If ideas were truly *res nullius*, plagiarism would be impossible.
      *   *Well Served:* The "non-obvious/central" filter. This borrows patent language but uses it to measure *creditworthiness* rather than *inventive step*. It presupposes that trivial ideas do not carry enough "agent-signature" to require citation.

  #### D. Technology Transfer (Trade Secrets)
  *   **Conception of the Idea:** Economic Asset / Competitive Advantage.
  *   **Presupposition:** The value of the idea lies entirely in its exclusivity. Once disclosed, the value evaporates. The idea is pure commodity.
  *   **Ruled Out:** The academic norm of dissemination (Mertonian "Communism"). It rejects the integrity norm that ideas must be shared to build knowledge.
  *   **Strictly Presupposed vs. Well Served:**
      *   *Strict:* Scarcity. The regime requires the idea to be capable of being kept secret.
      *   *Well Served:* Property metaphysics. It treats the idea exactly like a physical object that can be locked in a vault.

  ---

  ### 2. Evaluating Your Hypothesis

  > *"I suspect the idea/expression line is really about administrability and could survive almost any metaphysics of ideas, whereas the attribution norm needs something more."*

  **You are correct.**

  The copyright idea/expression dichotomy is primarily a **boundary mechanism** designed to prevent the chilling of speech. It is pragmatic. It does not require a deep metaphysical commitment to the notion that ideas *cannot* be property; it merely asserts they *should not* be. If we adopted a Platonist view where ideas are eternal forms, copyright could still function by saying, "We protect the shadow on the wall, not the form."

  However, **attribution norms (Integrity)** require a stronger metaphysical commitment: **The Theory of Authorship.**
  For plagiarism to be a coherent wrong (distinct from copyright infringement), there must be a persistent moral link between the agent and the intellectual content.
  1.  **Identity:** The idea must be viewed as a part of the agent's intellectual identity (Hegelian personality).
  2.  **Testimony:** Using an idea implies asserting it as true; failing to attribute implies you vouch for its genesis yourself. This is a lie.

  Therefore, the integrity regime cannot survive on administrability alone. It requires a normative metaphysics where ideas are **traces of agency**. If you view ideas as purely objective facts waiting to be picked up (like stones on a beach), attribution becomes gratuitous. The integrity office's use of the "non-obvious" filter confirms this: they are measuring the *distinctiveness of the agency* involved, not just the utility of the idea.

  ---

  ### 3. Genuine Inconsistencies vs. Functional Differentiation

  Much of the tension is **functional differentiation** (answering different questions), but there are points of **genuine normative conflict**.

  #### Functional Differentiation (Compatible)
  *   **Copyright vs. Patent:** One governs the *market for copies* (expression), the other the *market for use* (function). They can coexist because they regulate different acts.
  *   **Integrity vs. Copyright:** You can copyright a paper (economic right) while the integrity policy governs the citation within it (moral right). One protects revenue, the other protects reputation.

  #### Genuine Inconsistencies (Conflict)
  1.  **Trade Secrets vs. Research Integrity:** This is the sharpest conflict. Integrity policy presupposes the Mertonian norm of "Communism" (common ownership of scientific findings). Trade Secret law presupposes proprietary exclusion.
      *   *The Conflict:* If a grad student discovers a method, Integrity says "Publish and Attribute." Tech Transfer says "Disclose to us and Keep Secret." You cannot do both. The university resolves this bureaucratically (e.g., delaying publication), but normatively, it asks the researcher to inhabit two incompatible moral worlds: the *Scientist* (seeker of truth) and the *Entrepreneur* (seeker of rent).
  2.  **Patent vs. Integrity (The "Independent Discovery" Paradox):**
      *   *Integrity:* If I read your paper and use your idea, I must cite you, even if I could have derived it myself. The violation is *dishonesty about source*.
      *   *Patent:* If I invent the same method independently, I am innocent of infringement (in some jurisdictions) or can invalidate your patent (via prior art).
      *   *The Conflict:* Integrity treats the idea as permanently tagged to the first publisher. Patent treats the idea as a race to the courthouse. The university binds you to the Integrity norm (cite the colleague) while simultaneously binding the colleague to the Patent norm (sue the imitator).

  ---

  ### 4. The Thought Experiment: "Ideas Are Never Owned, Only Attributed"

  If we replaced the patchwork with a single unified view—**No Property Rights in Ideas, Only Moral Rights of Attribution**—here is what must change to make it workable:

  #### A. Copyright Practice
  *   **Change:** Abolish economic rights. Eliminate the right to exclude others from copying or distributing.
  *   **Replacement:** Retain Moral Rights (attribution and integrity of the work).
  *   **Workability:** This shifts the funding model. Without exclusionary revenue, creative and academic work must be funded via patronage, public grants, or "versioning" (selling physical copies/prestige editions). The "idea/expression" line dissolves; everything is free to copy, but nothing is free to claim as your own.

  #### B. Patent Practice
  *   **Change:** Abolish patents. No 20-year monopolies on methods or algorithms.
  *   **Replacement:** A **Prize System** or **Open Innovation Model**.
      *   If a researcher develops a new algorithm, they publish it. They receive attribution (career advancement, tenure).
      *   To recoup R&D costs, the university or state awards a cash prize proportional to the utility/adoption of the idea, funded by general taxation or industry consortiums.
  *   **Workability:** This removes the "trade secret" incentive. Companies would stop hiding research. However, it requires a massive bureaucratic apparatus to assess the "value" of an idea for prize distribution, replacing the market's valuation mechanism.

  #### C. Research Integrity Practice
  *   **Change:** Strengthened and Expanded.
  *   **Replacement:** Attribution becomes the *only* currency. Since economic rent cannot be extracted from the idea, reputational credit becomes the sole incentive.
  *   **Workability:** The "non-obvious" filter becomes even more critical. If everything is free to use, the only scarcity is *credit*. We would need a more robust system for tracking intellectual lineage (perhaps blockchain-style ledgers of contribution) to prevent "gift authorship" or credit dilution. Independent discovery would need to be policed more rigorously to ensure people aren't falsely claiming independent discovery to bypass attribution.

  #### D. Technology Transfer Office (TTO)
  *   **Change:** Radical Transformation or Abolition.
  *   **Replacement:** The TTO becomes a **Consultancy and Service Bureau**.
      *   They cannot sell licenses to ideas (since ideas aren't owned).
      *   They sell *expertise*, *implementation*, and *tacit knowledge*. They connect the inventor with industry to build the thing, charging for the labor of transfer, not the right to use the concept.
  *   **Workability:** This aligns with the "Trade Secret" regime's demise. Tacit knowledge (know-how) remains protectable because it isn't codified. The university monetizes the *process* of innovation, not the *product*.

  ### Summary of the Unified Model
  In this "Attribution Only" world, the university returns to a pre-1980s (pre-Bayh-Dole Act) model, but digitized.
  *   **Metaphysics:** Ideas are public goods; Agency is private property.
  *   **Incentive:** Reputation and Public Prize Money, not Private Rent.
  *   **Conflict Resolution:** The tension between "Secret" and "Published" vanishes because secrets have no market value unless they remain tacit.
  *   **The Cost:** The loss of the patent incentive might reduce private investment in high-risk commercialization. The system relies on the state or philanthropy to bridge the "valley of death" between idea and product.

  ### Conclusion
  Your intuition is sound. The current system is not a coherent philosophy of ideas but a **pragmatic layering of historical accretions**. Copyright protects the *book*, Patent protects the *machine*, Integrity protects the *scholar*, and Trade Secret protects the *asset*.

  They are inconsistent because they answer different questions:
  1.  **Copyright:** How do we encourage dissemination without monopolizing thought?
  2.  **Patent:** How do we encourage expensive development without free-riding?
  3.  **Integrity:** How do we maintain trust in the knowledge community?
  4.  **Trade Secret:** How do we maximize immediate revenue?

  To unify them under "Attribution Only" requires decoupling *reward* from *exclusion*. It is a coherent system, but it demands a political economy willing to fund innovation publicly rather than extracting rent privately. As it stands, your university is a site where four different political economies are constantly negotiating a temporary truce.
