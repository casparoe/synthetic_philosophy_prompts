answer: |-
  ### Part 1: Brainstorming the Dependency Structure

  Okay, let's think about the conceptual topology here. The standard failure mode in teaching this case is that the numbers become a distraction. Students treat $3^{^^^3}$ as a physics problem or a sci-fi premise, which allows them to bypass the ethical structure. They think the puzzle is about *magnitude*, but the puzzle is about *continuity*.

  To teach the reframing—"What must the betterness relation look like for your answer to be true?"—I need to establish specific conceptual dependencies before the reframing can land.

  1.  **Fungibility before Aggregation:** Students cannot understand the aggregationist position (the "rationalist" default) unless they first grasp that utility must be *fungible* across persons. If they think harm is essentially indexical ("*my* pain matters more to *me*"), aggregation looks like a category error. I need to establish the Utilitarian premise (Mill) not as a conclusion, but as a structural requirement for the "Torture is worse" answer.
  2.  **Lexicality before Rights:** Conversely, the Non-Aggregationist position (the "Kantian" default) relies on a lexical ordering of values. They need to see that saying "Torture is always worse" implies a discontinuous value function. If we don't establish that this is a claim about the *shape of value* (a step-function vs. a slope), they will treat it as mere emotional stubbornness.
  3.  **Consistency before Intuition:** The scaling step (moving from 100 specks to $3^{^^^3}$) is often taught as "overwhelming the intuition." I need to repurpose it. It shouldn't be about overwhelming; it should be about *locating the cutoff*. If a student says "100 specks < Torture" but "1 billion specks > Torture," they have admitted the value relation is continuous *somewhere*. The dependency here is that they must feel the tension of the cutoff *before* we discuss the absurd numbers.
  4.  **Perspective before Resolution:** The ex-ante/ex-post distinction (Veil of Ignorance vs. Known Victim) is often used to dissolve the paradox. I must avoid letting it dissolve the paradox too early. It depends on the structural commitments being clear first. If we introduce risk too soon, they will default to Expected Utility Theory without realizing it, which begs the question against the Non-Aggregationist. The perspective shift must be framed as "Does the moral structure change based on epistemic position?" not "Which perspective is correct?"

  **Why the standard order fails:**
  Standard order: Present Case -> Poll Class -> Debate -> Reveal Big Numbers -> Conclude.
  *Failure:* This treats the case as a verdict to be delivered. It encourages students to dig into their pre-existing tribal affiliations (Util vs. Deont).
  *Required Order:* Present Small Case -> Extract Structural Commitments -> Scale to Reveal Inconsistency -> Reframe as Metaphysics of Value -> Test with Perspective Shift.
  *Crucial Dependency:* The reframing ("What has to be true of the betterness relation?") only makes sense *after* they have committed to an answer on a small scale. If they haven't committed, they have no structure to analyze. But if they commit on the *large* scale, their brains short-circuit. So, the **Small Scale Commitment** is the prerequisite for the **Structural Analysis**.

  **The Kant Lever:**
  They know Kant. They know "Humanity as an end." This is the lever for Non-Aggregation. But they usually think Kant forbids *all* trade-offs. I need to show that Kantianism can handle small trade-offs (minor inconveniences for safety) but struggles to define the *threshold* where the trade-off becomes forbidden. This sets up the Specks case not as "Kant vs. Mill" but as "Where does the Kantian threshold lie?"

  **The Rationalist Trap:**
  The students who read the blogs will want to say "Shut up and multiply." I need to show them that "multiplying" is not a neutral arithmetic act; it is a substantive metaphysical claim that all harms are on a single linear scale. I need to make them defend the *linearity*, not just the *sum*.

  Okay, I have the structure. Now, the plan.

  ***

  ### Part 2: The Teaching Plan

  **Session Title:** The Geometry of Harm: Aggregation and the Betterness Relation
  **Time:** 75 Minutes
  **Materials:** Whiteboard, markers.

  #### 1. The Order of Beats (with Timings and Dependencies)

  **00:00 – 00:10 | Beat 1: The Small Scale Commitment**
  *   **Action:** Write two options on the board.
      *   A: One person suffers severe torture for one hour.
      *   B: 100 people each get a dust speck in their eye (momentary annoyance).
  *   **Task:** Do not ask "Which is worse?" Ask: "If you had to impose one of these, which do you impose?"
  *   **Dependency:** This must be small numbers (100). If you start with $3^{^^^3}$, they treat it as abstract. At 100, almost everyone chooses B (save the torture victim).
  *   **Goal:** Lock them into a preliminary intuition. Most will save the torture victim. This establishes the *Non-Aggregationist* intuition as the baseline.

  **00:10 – 00:25 | Beat 2: Extracting the Structure (The Reframing)**
  *   **Action:** Ask the students who chose B *why*.
      *   If they say "Because torture is worse," press: "Is it worse *per person* or worse *in total*?"
      *   Draw a graph on the whiteboard. Y-axis = Moral Badness, X-axis = Number of People.
      *   **The Pivot:** "If you say 1 Torture > 100 Specks, you are claiming the 'Torture Line' is higher than the 'Speck Line' even when the Speck Line is multiplied by 100."
      *   **The Question:** "For the *other* answer to be true (that enough specks outweigh torture), what must be true about the nature of a speck?"
      *   **Target Insight:** Students must articulate that for Aggregation to work, harm must be **fungible** and **linear**. For Non-Aggregation to work, harm must be **threshold-based** or **lexical**.
  *   **Dependency:** This depends on Beat 1. They need a committed intuition to analyze.

  **00:25 – 00:40 | Beat 3: The Scaling (Stress-Testing the Geometry)**
  *   **Action:** Erase "100". Write "1 Million". Then "1 Billion". Then "Everyone on Earth".
  *   **Task:** "Does anyone switch their answer? At what number?"
  *   **Crucial Move:** If a student switches, ask: "Did the *nature* of the speck change? No. Did the *nature* of the torture change? No. What changed was the *math*. So, does morality obey linear math?"
  *   **Rhetorical vs. Evidential:** You suspected scaling is rhetorical. **You are half-right.** It is evidential of *consistency*, not moral truth. It reveals whether their moral geometry is continuous (Utilitarian) or discontinuous (Deontological).
  *   **Goal:** Show that the "Absurd Numbers" are not a trick; they are a microscope. They reveal the curvature of the value function.

  **00:40 – 00:55 | Beat 4: The Perspective Shift (Ex-Ante vs. Ex-Post)**
  *   **Action:** Change the scenario. "You are behind a veil of ignorance. You have a 1 in 1 billion chance of being the torture victim, or a 100% chance of getting a speck. Which risk do you choose?"
  *   **Task:** Compare this to Beat 1 (Certainty).
  *   **Dependency:** This depends on Beat 2. They must see that Ex-Post (certainty) favors Non-Aggregation (protect the identified victim), while Ex-Ante (risk) favors Aggregation (minimize expected suffering).
  *   **Kant Lever:** Use Kant here. "Kant says treat humanity as an end." In the Ex-Post case, sacrificing the one looks like using them. In the Ex-Ante case, everyone consents to the risk.
  *   **Goal:** Show that the "Betterness Relation" might depend on *epistemic access*, not just outcomes. This complicates the "Numbers Win" view.

  **00:55 – 01:05 | Beat 5: Addressing the Entrenched (Misconceptions)**
  *   **Action:** Direct address to the "Rationalist" and "Kantian" camps.
  *   **Content:**
      *   To the Rationalists: "Multiplying isn't neutral. It assumes continuity. Defend continuity."
      *   To the Kantians: "Refusing to aggregate isn't squeamishness. It assumes lexicality. Defend the threshold."
  *   **Goal:** Depolarize. Make both sides own their metaphysical commitments.

  **01:05 – 01:15 | Beat 6: Check for Understanding & Wrap**
  *   **Action:** The Diagnostic Question (see Section 4).
  *   **Wrap:** Summarize that the case isn't about torture; it's about whether value is a fluid that pools or a status that inheres.

  ---

  #### 2. The Carrying Example

  **Your Inclination:** 1 Agony vs. 100 Specks, then scale.
  **Verdict:** This works, *provided* you control the description of the speck.

  **What it must have:**
  *   **Qualitative Clarity:** The speck must be truly trivial. "A momentary itch," "a blink of annoyance." If it accumulates to "eye infection," the example breaks.
  *   **Isolation:** The 100 people must not know each other. No "community suffering."
  *   **Certainty:** In Beat 1-3, the outcome must be guaranteed. No probabilities yet.

  **What it must lack:**
  *   **Long-term consequences:** No "the speck causes a car crash." Keep it contained.
  *   **Agency:** The victims are passive. We are avoiding blame and focusing on *value*.

  **The Function of Scaling:**
  You suspected it is rhetorical rather than evidential.
  *   **Correction:** It is **Topological**. It does not prove one side right. It maps the *shape* of the student's moral commitment.
  *   If they stick with "Torture is worse" at $N=3^{^^^3}$, they are committed to **Lexical Priority** (some values are infinite relative to others).
  *   If they switch at $N=1,000,000$, they are committed to **Continuity** (there is a exchange rate), but they must explain why the exchange rate wasn't visible at $N=100$.
  *   **Instruction:** Do not let them say "It's obvious at a billion." Force them to say "At a billion, the *structure* of the harm changes." (Which is false, and that's the point).

  ---

  #### 3. Misconceptions & Pre-emption Points

  | Misconception | Where to Head It Off | How to Address It |
  | :--- | :--- | :--- |
  | **"This is a trick about large numbers."** | **Beat 3 (Scaling).** | Explicitly state: "The number is not the puzzle. The number is a microscope. If the moral truth changes when we add a zero, *morality* is dependent on magnitude, not just type." |
  | **"Non-Aggregation is just squeamishness."** | **Beat 2 (Structure).** | When they call it "emotional," reframe it as "Lexicality." Say: "This isn't fear. This is a claim that human dignity has no price. That is a structural claim, not a feeling." |
  | **"Aggregation is just 'numbers win' (Tyranny of the Majority)."** | **Beat 5 (Entrenched).** | Distinguish *Summing* from *Voting*. Aggregation says the *total pain* is less. It's not democracy; it's minimization. Ask: "If 2 people get tortured vs 1 million specks, does the majority win?" (No, the torture still loses). |
  | **"Ex-Ante and Ex-Post are the same question."** | **Beat 4 (Perspective).** | **Crucial Beat.** Ask: "If you choose the risk (Ex-Ante), do you owe compensation to the one who actually gets tortured (Ex-Post)?" If yes, the views are different. If no, why did we worry? |
  | **"Kant settles this."** | **Beat 4 (Perspective).** | Use the lever, then break it. Kant forbids using the victim. But does allowing the specks *use* the victim? Or does forbidding the specks *use* the million? Show Kant creates a conflict of duties here, not a solution. |

  **Anticipated Misconception (The "Intensity" Error):**
  *   **Where:** Beat 1.
  *   **What:** Students will argue "A speck for a billion people is actually torture because it's annoying."
  *   **Fix:** Stipulate strictly. "If you claim the specks aggregate into a new harm *per person*, you have changed the example. We are asking if distinct, trivial harms sum across persons."

  ---

  #### 4. Check for Understanding

  Do not ask: "Which side is right?"
  Do not ask: "What would you do?"

  **Ask this:**
  > "Imagine two moral theories.
  > **Theory Alpha** says: Badness is a fluid. It can be poured from one person to another. 1 unit of pain here + 1 unit there = 2 units total.
  > **Theory Beta** says: Badness is a status. It attaches to a life. You cannot add status across lives.
  >
  > In the first part of class (100 specks), most of you acted like Theory Beta. In the second part (1 billion specks), some of you switched to Theory Alpha.
  >
  > **Question:** If you stick with Theory Beta even at 1 billion specks, what happens to your ability to make *any* trade-offs for public safety (e.g., speed limits, taxes)? If you switch to Theory Alpha, what happens to the concept of *rights*?
  >
  > **Task:** Write down one sentence describing the *cost* of the view you held at the end of class."

  **Why this works:** It forces them to articulate the *implication* of their structural commitment (the reframing), not the verdict itself. It reveals if they understand that Aggregation threatens Rights, and Non-Aggregation threatens Policy.

  ---

  #### 5. What to Leave Out (Stated Out Loud)

  At the start of Beat 5, say this explicitly:

  > "I am leaving three things out of this session intentionally.
  >
  > 1.  **Population Ethics:** We are not talking about bringing new people into existence (The Repugnant Conclusion). We are talking about harming existing people. The logic is similar, but the duties are different.
  > 2.  **Formal Decision Theory:** We are not using Expected Utility formulas. We are using arithmetic and intuition. The math is not the authority here; the moral structure is.
  > 3.  **The Verdict:** I am not going to tell you which answer is correct. My job is not to solve the paradox, but to show you that *your answer reveals your metaphysics*. If you leave here thinking you know whether torture is worse, I have failed. If you leave here knowing what your answer *costs* you in terms of moral theory, I have succeeded."

  ***

  ### Teacher's Note on the "Rationalist" Students
  You mentioned a handful will arrive convinced. They will likely try to dominate Beat 3 with "It's just math."
  **Counter-move:** Do not let them hide behind math. Ask them: "Why is pain additive? Gravity isn't additive across distinct objects in a moral sense. Why is suffering?" Force them to defend the *fungibility of qualia*, not the arithmetic. This levels the playing field with the Kantians, who are defending the *inviolability of persons*. Both are metaphysical claims.
