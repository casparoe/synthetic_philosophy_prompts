prompt: |-
  You are a philosopher who works on population axiology, the aggregation of harms, and the moral significance of very small effects — someone who has taught this material many times and has watched students walk into the same walls. Think carefully before you answer, and begin by brainstorming the dependency structure of the idea out loud before you write the plan itself. I want a teaching plan, not an explanation, and not a summary of the arguments.

  Some context. I have been reading rationalist blogs and forums for about fifteen years, and the torture-versus-dust-specks case is one of the pieces of that canon I know best. Next month I have been asked to run a seventy-five-minute session on it for an undergraduate ethics seminar. The students are second- and third-year philosophy majors. They have read some Mill and some Kant; none has encountered population axiology, and none has any formal decision theory. A handful of them read online rationalist writing and will arrive already convinced of one side, which I expect to be its own problem.

  I do not want the case explained to me. I want the session planned around a reframing I have found more productive than the question of which world is worse. The reframing is this: for each answer to the case, what has to be true of the betterness relation? If one person's torture can be outweighed by enough people's trivial annoyances, then the significance of a harm must be a magnitude that trades off at some rate. If it cannot, then the significance of a harm must depend on its relation to the life it falls in — on whether it registers as a loss to anyone. Both options are already live in cases with no absurd numbers in them, and I want the session to get the students to see that before the absurd numbers arrive.

  Please give me:

  1. The order of the beats, with rough timings, and an account of what depends on what — why the standard presentation order fails, and which piece has to be in place before the reframing even makes sense to them.
  2. The carrying example. I am inclined to open with a small version — one person in agony for an hour against a hundred people each getting a speck of dust in the eye — and then scale up. Tell me whether that example can carry the whole session, what it must have and what it must lack, and what the scaling-up step is actually doing. I suspect it is doing rhetorical rather than evidential work; tell me if I am wrong.
  3. The misconceptions, each with the exact point in the sequence where it has to be headed off: that the case is a trick about large numbers; that the anti-aggregation answer is mere squeamishness or a refusal to do arithmetic; that the aggregation answer is just "numbers win"; and whatever I have failed to anticipate. Include one beat on the contrast between choosing before you know which position you will occupy and choosing once you know, and say whether that is a different question or the same one in costume. Use the Kant they already have as a lever, then show where it fails to settle anything.
  4. One check for understanding at the end — a question that reveals whether they have grasped the structure rather than which side they picked.
  5. What to leave out at this level, stated out loud to the class as left out.

  Constraints: seventy-five minutes, one whiteboard, nothing beyond arithmetic, no formal apparatus, and no reading list.
