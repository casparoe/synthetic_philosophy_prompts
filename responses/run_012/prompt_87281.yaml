answer: |-
  The persistence of the spectrum argument suggests a deep discomfort in our ethical reasoning, a sense that we are being led down a garden path only to find ourselves in a swamp. We are told that if A is better than B, and B better than C, then A must be better than C. Yet, in the long chains of population ethics, this intuitive transitivity seems to collapse, forcing us to accept conclusions that violate our deepest moral convictions. The standard responses involve biting bullets or denying the intuitive steps along the chain. But there is a more structural solution available, one that locates the error not in our intuitions about specific cases, but in our metaphysics of value itself. To dissolve the paradox, we must accept that judgments of betterness are not absolute comparisons of intrinsic magnitude, but rankings relative to a specific context of choice. On this comparison-class account, transitivity holds firmly within a fixed menu of options, but it is not required to hold across different menus. The spectrum argument fails because it is a chain of links forged in different fires.

  To understand why the menu matters, consider that value functions less like mass and more like height. An object has a specific mass regardless of what else exists in the universe, but whether that object counts as "tall" depends entirely on the comparison class. A six-foot man is tall among jockeys but short among basketball players. The property of being tall is real, but its application is contextual. Similarly, when we judge one outcome better than another, we are not merely measuring the amount of good contained in each; we are ranking them against a background standard fixed by the available alternatives. This menu establishes the scale of evaluation. When you choose between two excellent wines, the standard of excellence is high; when you choose between two spoiled ones, the standard is low. The judgment "better" tracks superiority relative to that specific standard.

  In the spectrum argument, we are asked to compare adjacent links in a chain, moving from a world of high welfare to a world of bare subsistence. The proponent of the argument assumes that the standard of comparison remains constant throughout the chain. They assume that because the change from step one to step two is marginal, the context remains the same. The comparison-class account denies this. As we move down the spectrum, the local menu shifts. When comparing the first few steps, the alternatives are all high-welfare societies; the standard is sensitive to nuances in quality of life. By the time we reach the far end of the chain, the alternatives are all low-welfare societies; the standard is sensitive to nuances in quantity of life. Because the background standard has shifted, the relation "better than" at the beginning of the chain is not identical to the relation "better than" at the end. Transitivity requires identity of relation. If the meaning of "better" slides as the comparison class slides, the chain is broken. We are not comparing A to C using the same ruler we used to compare A to B.

  Critics often object that this account renders the concept of betterness vacuous. If "better" is always "better-relative-to-a-menu," then what is the word actually tracking? Surely, they argue, there is a fact of the matter about whether one state of affairs is better than another, independent of what else is available. If we lose this absolute notion, the spectrum argument's conclusion—that the far end is worse than the start—might be avoided, but only at the cost of losing the very relation that made the conclusion troubling in the first place. We seem to be changing the subject.

  This objection misunderstands the role of value judgments in the life of an agent. We are not disembodied observers cataloging the universe from a God's-eye view; we are agents situated in specific contexts of choice. What matters for rational action is not how an option ranks in the abstract, but how it ranks among the possibilities actually available. The comparison-class account does not eliminate the objectivity of betterness; it locates it where it belongs, in the structure of practical reasoning. "Better" tracks choice-worthiness. Since choice is always selection from a menu, choice-worthiness is inherently menu-relative. To demand a menu-independent "better" is to demand a property that has no grip on action. It is a philosopher's fiction, a phantom magnitude that does no work in the real world of decision-making. What survives of our ordinary talk is everything that matters: the ability to rank options, to justify choices, and to criticize decisions based on the available alternatives. What is lost is only the illusion that we can step outside all contexts to compare values in a vacuum.

  There remains the objection concerning isolated comparisons. Sometimes we are asked to compare two states of the world in isolation, with no explicit menu provided. If I ask whether a world with ten happy people is better than a world with a billion miserable people, I am not presenting a choice set. Does the account collapse here? It does not. Even in isolated comparisons, the mind constructs a implicit comparison class. We evaluate the options against a background of what is possible, typical, or expected. We bring a tacit menu to the thought experiment. However, in the spectrum argument, the trick is that the chain forces us to update this tacit menu at every step. By the time we reach the end, the implicit background has shifted so far from the beginning that the initial and final terms are no longer commensurable under a single standard. The apparent contradiction arises because we treat these context-dependent judgments as if they were context-free atomic facts.

  Adopting this view requires a shift in how we understand ethical theory. We must abandon the hope for a single, unified scale of value that spans all possible worlds. This is a genuine loss for those who seek a grand unified theory of the good, a metric that can weigh any outcome against any other regardless of context. But it is a necessary sacrifice. The spectrum argument shows that insisting on global transitivity leads to absurdity. By recognizing that betterness is a relation anchored to a comparison class, we preserve the integrity of our local judgments. We can say confidently that within the menu of high-welfare options, quality matters most, and within the menu of low-welfare options, quantity matters most. We do not have to force these distinct standards into a single hierarchy that breaks under its own weight.

  Ultimately, the comparison-class account saves us from the paradox by reminding us of our finitude. We judge from somewhere, not from nowhere. The menu is not a limitation on our knowledge; it is the condition of our valuation. Transitivity is a rule for coherent choice within a context, not a law of metaphysics binding all possible worlds. When we accept this, the spectrum argument loses its sting. The chain does not bind us because the links do not hold together. We are left with a robust, action-guiding notion of betterness that respects the complexity of value without demanding an impossible consistency across incomparable contexts. The word "better" still does its work, guiding us through the choices we actually face, even if it cannot bridge the gap between worlds we never have to choose between.
