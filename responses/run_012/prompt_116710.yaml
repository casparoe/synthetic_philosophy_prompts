answer: |-
  Planning: Candidate Causes and Methodological Traps
  1. High Wage Economy: Trap — Wages were comparable in parts of China; ignores purchasing power parity and cost of living differences.
  2. Coal Geography: Trap — China had coal; ignores that transport technology changes the value of distance, making geography contingent rather than deterministic.
  3. Institutional Property Rights: Trap — Defines rights narrowly to exclude Chinese precedents; ignores that laggards industrialized rapidly once they adopted similar institutions later.

  ***

  **FOR IMMEDIATE RELEASE**

  **Global Research Consortium Identifies Single Decisive Factor Behind Industrial Revolution**

  *New data analysis resolves centuries-old debate on why Britain industrialized before China*

  **OXFORD, UK — 14 May 2024** — A multinational team of economic historians has conclusively determined the primary cause of the Great Divergence, ending decades of speculation regarding why industrialization occurred in Great Britain rather than the Yangtze Delta. The study, published today in the Journal of Quantitative Historical Economics, isolates a specific configuration of energy costs and labor prices as the sole necessary condition for sustained mechanization.

  The research team utilized a newly constructed dataset comprising wage records, fuel prices, and patent filings from 1600 to 1850 across Eurasia. By applying advanced regression analysis to control for cultural and institutional variables, the study demonstrates that previous explanations relied on anecdotal evidence rather than systemic thresholds. The findings indicate that while other regions possessed individual components of industrial readiness, only Britain met the precise ratio of expensive labor to cheap energy required to justify capital investment in steam technology. This methodological rigor allows for the isolation of causality from correlation, ensuring that the identified factor precedes the outcome in all observed cases.

  Crucially, the study addresses why China, often cited as a comparable economic powerhouse during the period, did not cross this threshold. The data reveals that while the Qing Empire possessed substantial coal deposits, the geological distribution did not align with navigable waterways within the specific fifty-kilometer radius identified as critical in the British model. Furthermore, the research adjusts for demographic differences, noting that comparing a unified empire to a single island nation requires standardizing per-capita output rather than aggregate growth. This methodological correction ensures that the divergence is measured at the moment of take-off, precisely dated to 1765, rather than during earlier periods of commercial expansion or later periods of global integration. The study also accounts for the counterfactual scenario wherein China might have industrialized absent external interference, confirming that the internal constraints were sufficient to prevent independent mechanization regardless of global trade conditions.

  Professor Arthur Pendelton, lead author of the study, stated: "We have moved beyond qualitative narratives to identify the exact tipping point. Once you control for the spatial distribution of bituminous coal relative to urban centers, the outcome becomes deterministic. It was not a matter of culture or policy, but a calculable economic inevitability given the local constraints."

  The implications for modern development policy are significant. By identifying the specific geometric and economic prerequisites for industrialization, policymakers in developing nations can assess their own proximity to the critical threshold. The study suggests that economic development is not a linear process available to all regions simultaneously, but rather a contingent event dependent on localized resource configurations. This reframes historical lag not as a failure of governance, but as a temporary absence of specific factor endowments that may emerge over time. It further explains why nations previously identified as laggards were able to industrialize rapidly within generations once the initial technological barrier was breached elsewhere, as the specific local conditions required for the initial breakthrough differ from those required for adoption.

  **Related Coverage from the University Press Office**
  *   2019: Study Confirms Cultural Attitudes Toward Risk Drove British Innovation
  *   2021: Legal Protections for Intellectual Property Identified as Key Divergence Factor
  *   2023: Demographic Pressure in Europe Cited as Primary Catalyst for Mechanization
  *   2024: Energy-Labor Price Ratio Determined Sole Cause of Industrial Revolution

  **Notes to Editors**
  The Global Economic History Consortium is funded by the Foundation for Historical Clarity. The Journal of Quantitative Historical Economics is a peer-reviewed publication specializing in cliometric analysis. The University Press Office maintains an archive of all prior research announcements regarding historical causality. Media inquiries should be directed to the Office of Communications.

  ***

  **Author's Note on Historical Consensus**

  The satire above relies on a distinction between settled facts and contested interpretations within economic history. It is common ground among specialists that a significant divergence in income and industrial output emerged between Northwestern Europe and parts of Asia during the nineteenth century. However, the dating of this divergence remains genuinely contested, with credible arguments placing the split in the seventeenth, eighteenth, or even nineteenth centuries. Similarly, the choice of units is a matter of debate; comparing a nation-state like Britain to a continent-sized empire like China introduces scale biases that complicate like-for-like analysis. While the existence of the divergence is accepted, the well-posedness of the question itself is disputed. Some historians argue that seeking a single cause for a complex systemic shift is methodologically flawed, preferring explanations based on conjunctural factors or global linkages. The press release mimics the confidence of a consensus that does not exist, presenting a contingent interpretation as a settled law.
