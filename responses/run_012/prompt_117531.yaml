answer: |-
  The conceptual issue you have identified is the **ontology of value** within an experiential framework. Tranquilism attempts to occupy a specific niche: it wants to be an experiential ethic (like hedonism, where what matters is how things feel) while maintaining a purely negative axiology (where only the removal of bad things matters, not the addition of good things). The tension arises because "absence" is not a phenomenal primitive.

  Here is the breakdown of the problem:

  1.  **The Experiential Requirement:** Suffering-focused ethics is grounded in phenomenology. Suffering matters because it *feels* like something. For tranquilism to remain in this family, value must also be grounded in how things feel. If value is not experiential, the view ceases to be a form of hedonism or welfare consequentialism and becomes a form of objective list theory or desire satisfactionism (where the *fact* of desire-satisfaction matters, regardless of feeling).
  2.  **The Phenomenology of Absence:** You correctly note that "absence of craving" is not itself a feeling. However, humans do not experience "absence" as a void; we experience it as **relief** or **tranquility**. This state has a positive hedonic tone. It feels better than numbness, agitation, or neutral baseline.
  3.  **The Life A vs. Life B vs. Death Problem:**
      *   **Life A vs. Life B:** Tranquilism can handle this mathematically without positive value. Life A (0 craving) scores 0. Life B (10 craving) scores -10. A > B. This works on purely negative grounds.
      *   **Life A vs. Death/Numbness:** This is where the view eats its tail. Death has 0 craving. A numb, vegetative state has 0 craving. If value is *only* the absence of craving, Life A is equally valuable as Death or Numbness.
      *   **The Repair:** To claim Life A is *better* than Death/Numbness (which most tranquilists want to do, advocating for a "good life" rather than cessation), the tranquilist must point to something present in Life A that is absent in Death. That something is the *experience of tranquility*.
  4.  **The Contradiction:** If the experience of tranquility is what makes Life A preferable to Numbness, then that experience carries intrinsic positive value. But tranquility is a positive phenomenal state (a type of pleasure/satisfaction). By valuing it intrinsically, the tranquilist admits that some positive states add value of their own. This contradicts the core tenet that "pleasure and other positive states... don't add any value of their own."

  The view can be repaired by abandoning the claim that value is purely experiential (shifting to **needs-non-experiential-value**), but this sacrifices the "suffering-focused" grounding which relies on pain being bad *because it feels bad*. If pain is bad experientially but "no craving" is good non-experientially, the theory becomes asymmetrical and loses its hedonistic unity. The more direct diagnosis is that the view relies on the positive phenomenology of calm to motivate itself while verbally denying it.

  \answer{smuggles-positive-value}
