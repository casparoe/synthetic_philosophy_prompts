  8.  *(Final thought before generating)*: The user is tired. Make the structure very scannable. Use bolding for key takeaways. Ensure the "Watched Generosity" case is woven through, not just mentioned once.

  **(Self-Correction during drafting):** I need to make sure I don't confuse Finks and Masks.
  *   *Fink:* Stimulus triggers a change that removes the disposition *before* the effect happens. (Electric wire that dies when touched).
  *   *Mask:* Disposition remains, but something interferes with the manifestation. (Poisoned sugar that doesn't dissolve because it's in a net).
  *   *User's Case:* "Switched off by the very fact of being watched." That is a **Fink**. The presence of the observer triggers the loss of generosity. This is more radical than a mask. I need to highlight this distinction because it changes the moral evaluation. If it's a mask, she *tries* but fails. If it's a fink, the *capacity* vanishes.

