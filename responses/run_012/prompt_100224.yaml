  2.  **Understand CEV (Coherent Extrapolated Volition):**
      *   Proposed by Eliezer Yudkowsky.
      *   Goal: Align AI with human values not as they are now (flawed, ignorant) but as they *would* be if we knew more, thought faster, were more coherent, etc.
