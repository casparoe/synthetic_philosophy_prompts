  Okay, look, I know that sounds like a get-out-of-jail-free card, but you're missing where the axis comes from. It's not the programmers picking "coherence" because they like tidy spreadsheets; it's because *we* already pick that whenever we reflect. When you argue with me, you don't say "I wish I were more ignorant and impulsive." You argue because you think knowing more and being less biased matters. CEV just takes that existing preference for improvement and scales it up. It's not imposing a new value; it's honoring our own meta-preference to be better than our buggy, tired, immediate selves. The programmers aren't deciding what's good; they're deciding to let *us* decide, just under conditions where we actually have a shot at getting it right. If that's smuggling, then every conversation we've ever had about "doing better" is smuggling too.
