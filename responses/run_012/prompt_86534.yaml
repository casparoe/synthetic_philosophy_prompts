  I was the almost beating in the Seed,  
  The shadow waiting at the cellular Gate,  
  The silence losing in the wet Race,  
  The ghost who never earned a living Name,  
  The dust that never hardened into Bone,  
  The null result of all your rolling Chance.  

  You call it fate, I call it naked Chance,  
  I was the rival swimming in the Seed,  
  I am the phantom structure of your Bone,  
  I knocked and found no opening at the Gate,  
  I seek the echo of your borrowed Name,  
  I fell behind within the fluid Race.  

  There was no finish line inside this Race,  
  Only the lottery of purest Chance,  
  You wear the face, I lack the label Name,  
  We shared the origin within the Seed,  
  I dissolved before I reached the Gate,  
  You build the house upon your living Bone.  

  You trust the strength inherent in your Bone,  
  You think you won the merit of the Race,  
  But you slipped through the same narrow Gate,  
  As I did, ruled by blind and indifferent Chance,  
  We poured alike from out the father's Seed,  
  Now only you carry the weight of Name.  

  I am the silence underneath your Name,  
  The calcium missing from your solid Bone,  
  The potential hidden in the father's Seed,  
  The one who forfeited the human Race,  
  The victim of the mathematical Chance,  
  The stranger locked outside the vital Gate.  

  There is no handle on this inner Gate,  
  No way to swap the identity of Name,  
  No way to reroll that original Chance,  
  You are built distinct upon your Bone,  
  I am the lost contender in the Race,  
  You are the only vessel for the Seed.  

  *Envoi*  
  You hold the Seed, you own the only Name,  
  I have no Gate to pass, no solid Bone,  
  I lost the Race to your prevailing Chance.  

  ***

  ### Analysis and Philosophical Commitments

  You asked for a commitment, so here it is: **The sibling has no claim.** The poem adheres to the Kripkean view of **Necessity of Origins**. In *Naming and Necessity*, Saul Kripke argues that a person's origin (the specific sperm and egg) is essential to them. If a different sperm had won, it would not be *you* in a different circumstance; it would be a *different person* (or no person at all). The poem's speaker accepts this nullity ("I am the phantom," "You are built distinct").

  Here is where I took liberties or leaned on contested readings to make the poem work:

  1.  **Personifying the Non-Existent (Modal Realism vs. Actualism):**
      The biggest liberty is giving a voice to something that never existed. In standard actualist metaphysics, there is no "him" to speak. There are only possibilities. By giving the counterfactual sibling a voice, I am flirting with **Modal Realism** (David Lewis), which treats possible worlds as concrete realities. However, Lewis would still say the sibling in the other world is a *counterpart*, not *you*. The poem blurs this to create dramatic tension, treating the "possible" as if it has a grievance against the "actual." A strict metaphysician might wince at the implication that the lost sperm has a perspective; it doesn't. It is merely a description of a world that isn't.

  2.  **Genetic Similarity ("We shared the origin"):**
      In Stanza 4, I write, "We poured alike from out the father's Seed." Biologically, every sperm is genetically unique due to recombination and independent assortment. They are not "alike" in the way identical twins are. I leaned on a looser, more poetic definition of "origin" (the father himself) rather than strict genetic identity. This is necessary to sustain the theme of the "coin toss"—if the sperm were vastly different, the contingency would feel less like a toss and more like a selection of different traits. The poem implies the *potential* was similar, even if the genetic code was not, to heighten the tragedy of the "Chance."

  3.  **The Nature of the Claim:**
      The poem argues that because the difference was only "Chance," the sibling *should* have had a claim, but acknowledges they do not. This highlights the tension you feel: the metaphysical truth (Origins are Essential) clashes with the moral intuition (Contingency shouldn't dictate existence). The poem resolves this by affirming the metaphysical truth while mourning the moral cost. It validates your unease ("blind and indifferent Chance") without conceding the metaphysical point. The sibling admits, "There is no handle on this inner Gate." You cannot swap identities because the origin locks the identity in place.

  4.  **Constitution vs. Origin:**
      The poem leans heavily on **Origin Essentialism**. A contested view it argues *against* is the **Constitution View** (that you are your matter/psychology, so if the matter were arranged similarly by a different sperm, it could be you). By having the sibling say, "You are built distinct upon your Bone," the poem rejects the idea that similar constitution equals same identity. This is the "hard line" you asked for. It confirms your fear: yes, it rests on a coin toss, and yes, that means the loser is nobody. The poem's job is not to soothe that with falsehoods, but to make the hard truth bearable by acknowledging the arbitrariness of the win.

  The sestina form itself does the philosophical work: the same six words (the "fixed furniture") rotate but never change position relative to the structure, just as the biological facts remain fixed even as our narrative about them shifts. The order changes, but the elements do not, mirroring the way the "stuff" of the world remains while the specific configuration (you) is the only one that gets a Name.
