answer: |-
  This is a classic debate, and your frustration is the exact engine that drives the literature on the norm of assertion. You are wrestling with the tension between the **Knowledge Norm** (assert only what you know) and the **Reasonable Belief Norm** (assert only what you justifiably believe), complicated by moral and pragmatic overlays.

  Your flatmate is half-right: some of your cases involve norms *other* than the norm of assertion. But she is wrong to dismiss half of them as mere etiquette. There is a constitutive rule governing assertion, and your intuitions are actually quite consistent if we sharpen the definitions.

  Here is the principle that captures the bulk of your verdicts, the specific cases that force its clauses, and the honest list of where you need to adjust your thinking.

  ### The Principle: The Knowledge Norm with Overrides

  **Rule:** *One must: assert that p only if one knows that p.*

  This is the standard view (championed by Timothy Williamson), but to make it fit your data, we need to add two clarifying clauses that distinguish the *epistemic* norm from other constraints.

  **Precise Formulation:**
  1.  **Epistemic Condition:** An assertion that *p* is epistemically proper if and only if the speaker knows *p*.
  2.  **Moral/Prudential Override:** Satisfying the Epistemic Condition is necessary but not sufficient; one must also not violate higher-order moral or professional duties (e.g., confidentiality).
  3.  **Illocutionary Distinction:** Uttering a sentence *p* counts as an assertion only if the speaker presents themselves as the authority on *p*; otherwise, it is a report or quotation.

  ---

  ### Case-by-Case Breakdown

  Here is how this principle handles your eight cases, and where you need to fight your gut.

  **The Core Wins (Cases 1, 2, 5, 6, 7)**
  These five cases are the strongest evidence for the Knowledge Norm. A Reasonable Belief Norm would fail here.
  *   **(1) Stopped Clock:** You had justified true belief, but no knowledge (Gettier case). **Verdict:** Improper assertion. *Matches your gut.*
  *   **(2) Sincere Mistake:** You believed and were justified, but *p* was false. You cannot know falsehoods. **Verdict:** Improper assertion. *Matches your gut.*
  *   **(5) The Lottery:** You have 99.9% probability, but standard epistemology says you don't *know* the ticket lost until the draw. **Verdict:** Improper assertion. *Matches your gut.*
  *   **(6) Retraction:** You realized your basis was hazy (no knowledge), even if *p* was true. **Verdict:** Proper to retract. *Matches your gut.*
  *   **(7) The Wedding:** Wishful thinking is not a knowledge-generating process. **Verdict:** Improper assertion. *Matches your gut.*

  **The Category Errors (Cases 4, 8)**
  Your flatmate is right about these, but not for the reason she thinks. These aren't violations of the *assertion* norm; they are violations of *other* norms or different speech acts.
  *   **(4) The Leaked List:** You *know* *p*. The Epistemic Condition is met. However, the **Moral Override** kicks in. You are violating confidentiality, not the norm of assertion. *Adjustment:* Stop thinking this is an assertion problem. It's an ethical problem. You *could* assert it epistemically, but you *shouldn't* morally.
  *   **(8) The Spokesperson:** You are not asserting *p* (that the company policy is good); you are asserting *q* (that the company *says* *p*). This is the **Illocutionary Distinction**. You know *q*. **Verdict:** Proper speech act, but not an assertion of *p*. *Adjustment:* Accept that you weren't asserting the content, only reporting it.

  **The Hard Fight (Case 3)**
  *   **(3) The Plane:** This is the only case where your gut fights the Knowledge Norm directly. You stipulated: "I don't know that, nobody can."
  *   **The Conflict:** KN says "Don't assert." Your gut says "Assert."
  *   **The Fix:** You have to choose. If you keep the Knowledge Norm, you must argue that you *do* know the plane won't crash.
  *   **Why?** Distinguish **Lottery (Case 5)** from **Plane (Case 3)**. In the lottery, the probability is purely statistical; there is no causal connection preventing your ticket from winning. In the plane case, the probability is based on physical laws, engineering safety, and causal regularities (Inductive Knowledge). Many epistemologists argue we *do* know inductive generalizations about safe planes, whereas we *don't* know lottery outcomes.
  *   **Verdict:** If you accept that inductive safety counts as knowledge, KN is saved. If you insist you *don't* know, you must admit the norm is actually **Reasonable Belief**, but then you lose Cases 1 and 5 (because you reasonably believed the clock and the lottery ticket).
  *   **My Advice:** Keep the Knowledge Norm. Tell your flatmate that Case 3 is *knowledge via safety*, distinct from Case 5's *mere statistical probability*. This preserves the cleanest theory.

  ---

  ### What You Need to Give Up

  To maintain a consistent, philosophically robust position, here is the cost:

  1.  **Give up the idea that Case 4 is about assertion.** It is about ethics. You satisfied the norm of assertion but violated a norm of confidentiality.
  2.  **Give up the idea that Case 8 is assertion.** It is reporting.
  3.  **Refine your intuition on Case 3.** Either accept that you *did* know (inductive knowledge) or admit that the assertion was *excusable* (kindness overrides epistemic strictness) but technically improper. Do not let Case 3 destroy the Knowledge Norm, or you will be forced to accept that asserting lottery losses is fine (which feels wrong).

  ---

  ### Predictions for New Cases

  Here is how the Knowledge Norm handles the scenarios you asked about:

  **1. Asserting a moral claim you can't argue for.**
  *   *Scenario:* You say "Abortion is wrong" (or "is permissible") firmly, but if pressed, you admit you have no argument, just a deep conviction.
  *   *KN Verdict:* **Improper.**
  *   *Reasoning:* Moral knowledge requires more than conviction; it requires justification/tracking of moral truth. If you cannot argue for it, you likely lack the justification required for knowledge. You are expressing an attitude, not asserting a known fact.
  *   *Nuance:* If you hold a moral realist view where intuition *is* a source of knowledge, it might be permissible. But generally, if you admit "I can't explain why," you admit you don't know.

  **2. Asserting something you know but can't explain how.**
  *   *Scenario:* You recognize a face in a crowd and say "That's Sarah." You know it (reliable recognition), but you can't articulate the features that tell you it's her.
  *   *KN Verdict:* **Proper.**
  *   *Reasoning:* Knowledge does not require the *ability to articulate* the justification (anti-luminosity). If your cognitive faculty (face recognition) is reliable and producing truth, you know. The norm of assertion cares about the *state* of knowing, not your ability to defend it in a seminar.

  ---

  ### The Flatmate Question: Etiquette vs. Norm?

  Is your flatmate right that half of these are just etiquette? **No.**

  *   **Etiquette/Pragmatics:** Cases 4 (Confidentiality) and 8 (Spokesperson) involve social roles and conversational implicature. She is right here.
  *   **Constitutive Norm:** Cases 1 (Clock), 2 (Mistake), 5 (Lottery), and 7 (Wedding) are not about manners. They are about the *nature of assertion*. When you assert, you represent yourself as knowing. If you don't know, you are misleading your listener about your epistemic position, even if you are sincere. That is not etiquette; it is a violation of the "game" of assertion.

  ### Final Recommendation

  Tell your flatmate this:

  > "I'm adopting the **Knowledge Norm**. It explains the Stopped Clock, the Lottery, and the Retraction cases perfectly, which the Reasonable Belief norm can't do.
  >
  > I'm conceding that the Leaked List is a moral override, not an epistemic failure, and the Spokesperson case is reporting, not asserting.
  >
  > That leaves the Plane case. I'm arguing that inductive safety *counts* as knowledge, unlike pure statistical probability. If you want to claim the norm is lower than knowledge, you have to explain why it's okay to tell me my lottery ticket lost."

  This position is defensible, precise, and saves you from having to juggle a different rule for every case. It forces you to refine your view of "knowledge" in the Plane case, but that is a smaller price than abandoning the norm entirely.
