      *   *Okay, proceeding.*

      *   *One last thought on the "No Selective Objection" tension:* If I can't refuse because the state decides justice, but the leaders are liable for injustice, there's a gap. The state is liable, but the arm of the state is protected. This is the "division of labor" defense. The tension is whether that division is morally sustainable.

