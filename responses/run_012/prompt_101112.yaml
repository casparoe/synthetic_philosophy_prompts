answer: |-
  There is no single, settled term in formal logic or philosophy of science that captures this exact configuration of errors, though it is a recognized pattern in skepticism and the demarcation problem. The closest existing labels are **"Anomaly Stacking"** (colloquial skepticism) or **"Pseudo-Consilience."**

  Given the precision of your analysis, I propose we designate this the **Fallacy of Spurious Consilience**.

  Below is the carving you requested: an analysis of why this move fails, how it differs from its nearest logical relatives, and the criterion that separates it from legitimate scientific paradigm shifts.

  ### 1. The Structure of the Fallacy

  The argument you describe relies on a corrupted form of **Inference to the Best Explanation (IBE)**. It posits that because Hypothesis $H$ (Lost Civilization) accounts for a set of anomalies $\{E_1, E_2, ... E_n\}$ better than Hypothesis $O$ (Orthodox Archaeology) does individually, $H$ is probably true.

  The failure occurs in two distinct layers, corresponding to your two troubles.

  #### Trouble One: The Independence Error (Probabilistic)
  You are correct that the "multiplication of improbabilities" is illicit. In Bayesian terms, the proponent is arguing that the likelihood of the evidence given the null hypothesis, $P(E|O)$, is vanishingly small because they calculate it as:
  $$P(E_1 \& E_2 \& ... \& E_n | O) = P(E_1|O) \times P(E_2|O) \times ... \times P(E_n|O)$$
  This equation holds **only if the evidence items are conditionally independent**.

  In the Atlantis case, they are not.
  *   **Causal Dependence:** Many "anomalies" stem from the same source error (e.g., a single mistranslation propagated through ten books).
  *   **Selection Bias:** The set $\{E\}$ is not a random sample of all data; it is a cherry-picked subset of things that *look* weird.
  *   **Interpretive Dependence:** The classification of $E_1$ as an "anomaly" often depends on the same theoretical assumption used to classify $E_2$.

  When dependence is ignored, the cumulative weight is vastly overstated. In literature on risk assessment and reliability engineering, this is sometimes called the **Product Rule Fallacy**, but in this rhetorical context, it is the engine of **Spurious Consilience**.

  #### Trouble Two: The Predictive Error (Epistemological)
  This is the deeper philosophical issue. You ask why a "heap of unexplained observations" justifies a new hypothesis in science (e.g., the perihelion of Mercury justifying General Relativity) but not here.

  The distinction lies in **Accommodation vs. Prediction**.

  *   **Legitimate Anomaly Accumulation (Science):** The new hypothesis is constructed to explain the anomalies, *but it also entails specific, risky predictions.* General Relativity did not just say "Newton is slightly wrong." It specified the *exact* arc of the deviation. It constrained the world. If the deviation had been 10% larger, the theory would have died. The anomalies are **tight fits**.
  *   **Illegitimate Anomaly Accumulation (Atlantis):** The hypothesis is **flexible**. "Ancient astronauts" or "Lost Civilisation" does not predict *which* artifacts will be found, *where* they will be, or *what* technology they will show. It merely asserts that "something unexpected might appear."
      *   If a map is accurate, it proves they were advanced navigators.
      *   If a map is inaccurate, it proves they were a fragmented, struggling society.
      *   If an artifact looks like a plane, it proves flight.
      *   If it looks like a bird, it proves symbolic worship.

  The hypothesis absorbs the anomalies without being constrained by them. In philosophy of science, this is a failure of **constructive specificity**. The hypothesis has high **accommodative power** (it fits the past data) but low **predictive power** (it cannot forecast specific future data).

  ### 2. Relation to Known Fallacies

  Here is how the **Fallacy of Spurious Consilience** stands to the concepts you listed:

  *   **Argument from Ignorance (*Ad Ignorantiam*):**
      *   *Relation:* This is the local move applied to each item ("Orthodoxy can't explain X, therefore X is anomalous").
      *   *Distinction:* Argument from Ignorance is usually singular. Spurious Consilience attempts to overcome the weakness of individual ignorance-arguments by aggregating them. It tries to turn a qualitative lack of knowledge into a quantitative probability.
  *   **Gish Gallop:**
      *   *Relation:* Both rely on volume to overwhelm.
      *   *Distinction:* Gish Gallop is a *debate tactic* focused on speed and the opponent's inability to respond in real-time. Spurious Consilience is an *evidential claim* focused on the cumulative weight of the data itself, regardless of whether the opponent refutes them. One can commit Spurious Consilience in a written monologue where time is not a factor.
  *   **Conjunction Fallacy:**
      *   *Relation:* Both involve probabilistic error.
      *   *Distinction:* The Conjunction Fallacy (Linda Problem) is about judging a specific conjunction ($A \& B$) as more probable than a single constituent ($A$). Spurious Consilience is about judging the *improbability of the null hypothesis* as higher than it is, due to assuming independence.
  *   **Texas Sharpshooter Fallacy:**
      *   *Relation:* Both involve cherry-picking.
      *   *Distinction:* The Sharpshooter draws the target *after* shooting. Spurious Consilience admits the target (the anomalies) are real but misrepresents the *statistical distance* between them and the bullseye of the null hypothesis.

  ### 3. The Carving: Legitimate vs. Illegitimate Anomaly Aggregation

  You asked for the line between a legitimate pile of anomalies (which *does* drive science) and this illegitimate one, without begging the question against the heterodox side.

  The line is **Novel Constraint**.

  A legitimate accumulation of anomalies justifies a new hypothesis only if the new hypothesis **reduces the entropy of expectation** regarding future anomalies.

  **The Test:**
  Ask the proponent: *"If your hypothesis is true, what is something we should **not** find?"*

  1.  **Legitimate Case (Neptune):**
      *   *Anomaly:* Uranus's orbit deviates from Newtonian prediction.
      *   *Hypothesis:* An unseen planet exists.
      *   *Constraint:* The math dictates exactly where in the sky that planet must be. If we look there and it's empty, the hypothesis fails.
      *   *Result:* The anomaly accumulation is legitimate because the hypothesis risks falsification.

  2.  **Illegitimate Case (Atlantis/Ancient Astronauts):**
      *   *Anomaly:* Battery-like object found in Iraq.
      *   *Hypothesis:* Ancient high-tech civilization.
      *   *Constraint:* None. If the object is a battery, it proves the hypothesis. If it is a scroll holder, the hypothesis survives (it was a multi-purpose culture). If no other batteries are found, the hypothesis survives (technology was lost).
      *   *Result:* The anomaly accumulation is illegitimate because the hypothesis is **immunized** against the data it claims to explain.

  **Imre Lakatos** provides the formal machinery for this distinction in his **Methodology of Scientific Research Programmes**.
  *   A **Progressive** research programme explains anomalies by predicting *novel facts*.
  *   A **Degenerating** research programme explains anomalies by adding *ad-hoc hypotheses* that only accommodate the past data without predicting new things.

  The Atlantis argument is a **Degenerating Shift**. It accumulates anomalies not to narrow down the truth, but to widen the net of "possibility" until the orthodox view looks improbable by comparison.

  ### 4. Summary Definition

  **The Fallacy of Spurious Consilience**
  *   **Definition:** An argumentative strategy that aggregates a large number of weak, heterogeneous anomalies to argue for a low-probability hypothesis, by falsely treating the anomalies as statistically independent and by relying on a hypothesis that accommodates the anomalies without subjecting itself to the risk of specific falsification.
  *   **Key Failure Modes:**
      1.  **Statistical:** Violation of the independence assumption in probability multiplication.
      2.  **Epistemic:** Confusion of *accommodation* (fitting known data) with *prediction* (constraining unknown data).
  *   **Diagnostic Question:** "Does the proposed explanation tell us where the next anomaly *must* appear, or merely that it is unsurprising if one *does* appear?"

  This carving allows you to reject the argument without dismissing the anomalies themselves. You can grant that the map is strange, the artifact is odd, and the orthodoxy is currently stumped, while still maintaining that the *inference* to the Lost Civilization is logically invalid because it pays no tax in predictive risk.
