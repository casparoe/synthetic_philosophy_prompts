      *   *Requirement 1: The Voluntarism Constraint.* Belief isn't directly voluntary. We can't just choose to believe. A theory must account for indirect control (cultivating belief) without assuming direct switch-flipping.
      *   *Requirement 2: The Truth-Aim Constraint.* Belief aims at truth. Even in SFBs, the belief is *that P is true*, not *that P would be good*. If a theory treats belief like desire, it fails.
      *   *Requirement 3: The Distinction Constraint (SFB vs. Self-Deception).* Must distinguish between rational confidence (climber) and irrational denial (insomniac/delusional partner). Both make things happen, but one is praised/neutral, one is criticized.
      *   *Requirement 4: The Normative Force Constraint.* We actually blame/praise believers. A theory can't say "belief is just a state like height." It must allow for evaluation.
      *   *Requirement 5: The Evidence/Pragmatic Boundary.* Must explain when pragmatic benefits (success, happiness) license belief and when they don't. (This addresses the user's suspicion about Clifford).
      *   *Requirement 6: The Second-Order/Intervention Constraint.* Since the user cares about doctors/parents, the theory must handle *encouraging* belief in others, not just holding it oneself.

  4.  **Analyzing Distinctions (What can't be collapsed):**
