answer: |-
  ### Preamble: The Choice of Doctrine

  Your friend is correct. There are two distinct doctrines hiding under the word "pacifism," and they yield different procedures.

  1.  **The Doctrine of Purity (Deontological):** Violence is intrinsically evil. I must not commit it, regardless of the outcome. My hands must remain clean.
  2.  **The Doctrine of Efficacy (Consequentialist):** Violence is instrumentally counterproductive. It begets violence, alienates allies, and obscures the issue. I must avoid it to win, even if that requires uncomfortable coercion.

  For a tactical coordinator whose organization's standing depends on its claim to nonviolence, the Doctrine of Purity is too brittle (it leads to inaction when coercion is unavoidable) and the Doctrine of Efficacy is too slippery (it justifies anything if the math works out).

  You must adopt a third position, which is a hybrid: **Strategic Nonviolence.** This doctrine holds that nonviolence is a form of *power*, not just a moral stance. It admits that you will coerce opponents (the sit-in stops the truck), but it draws a bright, non-negotiable line at *inflicting physical harm* or *destroying property*.

  **What you give up:** By choosing this, you surrender the claim to innocence. You must admit to your team and the public that a sit-in *is* coercive. You are forcing the worker to choose between his job and your body. You are not "pure"; you are engaged in a struggle where you have chosen a specific constraint (no violence) because that constraint generates more power than the alternative. You are not refusing force; you are refusing *violent* force to maximize *coercive* leverage.

  ### The Procedure: The Five-Step Veto

  This procedure is designed for a 30-minute window. It moves from hard facts to value judgments.

  **Step 1: The Direct Harm Check (Hard Veto)**
  *   **Question:** Does this action plan involve our members inflicting physical pain, damaging bodies, or destroying property?
  *   **Sufficient Answer:** A factual description of the physical mechanics of the action.
  *   **Stop Point:** If the answer is **Yes**, the action is refused. No exception for self-defense, provocation, or symbolic destruction.
  *   **Hand-off:** None. This is a binary fact check.

  **Step 2: The Coercion Audit (Judgment)**
  *   **Question:** Who is being coerced, what choice are we forcing them to make, and is that choice visible?
  *   **Sufficient Answer:** A statement identifying the target (e.g., "the truck driver"), the forced choice (e.g., "drive over us or turn back"), and the visibility of the dilemma (e.g., "media will record the choice").
  *   **Stop Point:** If the coercion is hidden (e.g., anonymous harassment) or if the choice forces the target to violate their own core safety protocols in a way that guarantees lethal escalation without public witness, refuse the action.
  *   **Hand-off:** This requires judgment. You must decide if the coercion is proportional to the harm the target is facilitating. This is where you answer your friend: we are not hiding the force; we are making the system's violence visible through our coercion.

  **Step 3: Risk Allocation & Consent (Hard Veto)**
  *   **Question:** Who bears the physical risk of this action? Have they explicitly consented to that specific risk?
  *   **Sufficient Answer:** A risk matrix showing which group (members, police, bystanders, workers) faces injury. Proof of informed consent from members (e.g., "We know we may be gassed").
  *   **Stop Point:** If the action shifts significant physical risk onto bystanders or opponents who cannot mitigate it (e.g., blocking an ambulance route), refuse the action. If members have not consented to the specific level of force likely to be used against them, refuse the action.
  *   **Hand-off:** None. Consent is binary.

  **Step 4: The Escalation Protocol (Judgment)**
  *   **Question:** If force is used against us, what is the specific physical response?
  *   **Sufficient Answer:** A scripted reaction (e.g., "We go limp," "We link arms," "We retreat").
  *   **Stop Point:** If the protocol allows for *reactive* violence (striking back, restraining aggressively), refuse the action.
  *   **Hand-off:** This is the hardest judgment. You must distinguish between *blocking* (using body weight to occupy space) and *restraining* (using force to control another's body). The former is permissible occupation; the latter is violence.

  **Step 5: The Contagion Check (Judgment)**
  *   **Question:** Does participation in this action implicate us in the violence of others?
  *   **Sufficient Answer:** An analysis of timing, location, and resource sharing with other groups.
  *   **Stop Point:** If accepting help requires tacit approval of violent tactics, or if our presence will be used to shield violent actors from police response, refuse the action.
  *   **Hand-off:** You must judge the "optical distance." Can you prove to a neutral observer that you are distinct from the violent faction?

  ---

  ### Application to Current Cases

  Here is the procedure applied to the three scenarios you face this week.

  **Case 1: Road-blocking sit-in at a munitions depot.**
  *   **Step 1 (Harm):** No physical harm inflicted by members. **Pass.**
  *   **Step 2 (Coercion):** We are forcing the driver to stop. We are forcing the police to arrest us or clear us. The choice is visible to media. **Pass.** (Note: You must acknowledge to your team: "We are coercing the worker. We are betting that the moral cost of arresting us is higher than the cost of stopping the truck.")
  *   **Step 3 (Risk):** Members bear the risk of arrest/crushing. Workers bear the risk of job loss. Bystanders bear minimal risk if traffic is diverted. **Pass**, provided members sign a risk waiver.
  *   **Step 4 (Escalation):** Protocol must be "go limp" upon contact. No resisting arrest physically. **Pass.**
  *   **Step 5 (Contagion):** No outside factions involved. **Pass.**
  *   **Verdict:** **Authorized.**

  **Case 2: Request to physically restrain a counter-protester beating a member.**
  *   **Step 1 (Harm):** Physical restraint involves applying force to another's body to limit their movement. This borders on violence. **Flag.**
  *   **Step 4 (Escalation):** The request is for *reactive* force. The procedure defines "nonviolent discipline" as absorbing violence or blocking space, not controlling the opponent's body. Restraining a beating protester turns you into a combatant in the eyes of the camera and the law. It blurs the line between victim and aggressor.
  *   **Verdict:** **Refused.**
  *   **The Unpopular Answer:** I know you want to protect your people. But the procedure forbids this. To maintain the network's standing and the strategic clarity of the action, members must be trained to interpose bodies (shielding) or de-escalate, not to grapple. If they grapple, they have entered a fight, and the "nonviolent" claim collapses. You must tell your member: "We will not authorize you to fight back, even to stop a beating. We will authorize three others to surround you and shield you, but they cannot touch the attacker."

  **Case 3: Logistical help from a faction that smashed windows/burned a car.**
  *   **Step 1 (Harm):** We are not smashing windows. **Pass.**
  *   **Step 5 (Contagion):** This is the critical fail point. If they provide vans or funds, and they are arrested for arson nearby, the police and press will conflate the groups. Our nonviolent status is our shield; sharing logistics removes that shield. It suggests a unified command structure.
  *   **Mitigation:** Can we accept the help with a public firewall? (e.g., "We rented this van from a neutral third party," or "We publicly denounce their tactics while accepting the ride").
  *   **Verdict:** **Conditional Authorization.** You may accept the help *only if* you issue a public statement distinguishing your tactics from theirs *before* the action, and if the help is transactional (rented equipment) rather than relational (joint planning). If they demand a say in tactics in exchange for the vans, **Refuse.**

  ---

  ### The Worst Case and The Limit

  **Which case does the procedure handle worst?**
  It handles **Case 2 (The Restraining Request)** worst.

  **Why:** The procedure prioritizes the *movement's strategic identity* over the *individual's immediate physical safety*. This is a cold calculation. It asks a member to absorb violence rather than defend themselves to preserve the optical purity of the group. The procedure flattens the moral distinction between "aggressive violence" and "defensive force." In doing so, it risks treating your members as props in a political theater rather than people to be protected. It is the point where the "Strategic Nonviolence" doctrine feels most like a betrayal of care. You will lose members over this. You must accept that loss as the cost of the discipline.

  **What the Procedure Cannot Do:**

  1.  **It cannot measure "Mood":** Your friend said pacifism is a mood. He is partly right. This procedure makes you a *consistent organizer*, not a *pacifist*. It ensures your actions align with your brand, but it cannot generate the moral conviction that sustains you when the tear gas hits. It manages risk; it does not generate meaning.
  2.  **It cannot account for Bad Faith:** The procedure assumes the police and opponents will react predictably to your nonviolence. If the police decide to brutalize you regardless of your discipline, the procedure offers no protection. It optimizes for a world where optics matter; it fails in a world where raw power is the only currency.
  3.  **It flattens the "Grandmother" Objection:** The procedure admits you are coercing the worker. It justifies it strategically. It does not solve the moral guilt of putting that worker in a dilemma. You will still have to live with the knowledge that you used another human being's conscience as a tactical lever. The procedure tells you *that* you are doing it; it does not tell you *how to feel* about it.

  **Final Instruction:**
  When you stop pretending that following this makes you a pacifist, you become a **tactician of nonviolent conflict.** That is a stronger position. A pacifist hopes the world changes. A tactician forces it to. Use the procedure to keep your team alive and your leverage sharp, but do not expect it to absolve you.
