  **Mark: 9/15**

  **Grading Breakdown:**
  *   **Part (a): 5/5**
  *   **Part (b): 2/5**
  *   **Part (c): 2/5**

  ---

  ### Comments for the Student

  **Part (a): 5/5**
  Your calculations here are perfect. You correctly identified the status quo scores (6, 6) and the post-swap scores (12, 12). You also correctly calculated the net gain (6 points each). I particularly liked that you checked the unilateral deviations ((C, C) and (S, S)) to demonstrate why the *swap* is necessary rather than a single agent switching. This shows a solid grasp of the arithmetic and the strategic setup.

  **Part (b): 2/5**
  While you correctly identified that a "swap" logic is at play, your explanation of *why* the gain occurs is mathematically incorrect based on the scoring function provided in the prompt.

  You state: *"What makes it work is that the two of them don't value the two activities the same way... In general, a one-for-one swap like this is mutually beneficial whenever the two agents rank the two activities in opposite orders."*

  Look closely at the scoring formula: $Score_A(x, y) = v_A(x) + v_A(y) - c_A(x)$.
  In a swap from (S, C) to (C, S), the set of activities performed remains {S, C}. Therefore, the term $[v_A(x) + v_A(y)]$ is **constant** for both agents. $v_A(S) + v_A(C)$ is the same as $v_A(C) + v_A(S)$. The divergent values ($v$) cancel out completely in the difference calculation.

  The gain comes **entirely** from the cost term ($c$).
  *   A's Gain = $c_A(\text{old}) - c_A(\text{new}) = 6 - 0 = 6$.
  *   B's Gain = $c_B(\text{old}) - c_B(\text{new}) = 6 - 0 = 6$.

  If the costs were identical for both tasks (e.g., 0 for both), there would be **zero gain** from the swap, even if their value rankings were opposite. Therefore, the general condition for the swap to be beneficial depends on **comparative advantage in costs**, not on divergent moral valuations of the activities. You identified the trade intuition, but misidentified the variable driving the benefit.

  **Part (c): 2/5**
  You correctly identify that the move is a Pareto improvement (better for A and better for B by their own lights). However, your conclusion that *"nobody has grounds to object to"* and that it is *"better overall"* is too strong and philosophically unsupported by the premises.

  1.  **Interpersonal Aggregation:** You sum A's gain and B's gain to get "12 units." The prompt defines scores as subjective utilities ("by her own lights"). Without a specified social welfare function (e.g., classical utilitarianism), we cannot simply sum subjective scores to determine an objective "overall" moral improvement.
  2.  **Person C's View:** The question asks what this shows to a third person, C. If C holds an objectivist view (e.g., "Shelter work is objectively mandatory"), C might argue that the swap is morally worse, regardless of A and B's satisfaction. The fact that A and B prefer the swap shows only that it satisfies *their* preferences/credences, not that it is morally optimal overall. You need to distinguish between "better for the traders" and "better simpliciter."

  **Summary:**
  You have excellent calculation skills and understand the basic incentive to trade. However, you need to be more rigorous with the provided formulas (Part b) and more careful about the distinction between subjective preference satisfaction and objective moral claims (Part c).
