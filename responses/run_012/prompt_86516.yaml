  ### Workshop Instrument: The Insect Sentience Decision Tree

  **Instructions:** Begin at the root. Answer each question based on your current philosophical commitments. Follow the branch corresponding to your answer until you reach a named position (Leaf). Record your path and final position.

  **Root:** *I assign some non-negligible probability to the claim that at least some insects are sentient.*

  **Node 1 (Metaphysics of Standing):** How does sentience relate to moral standing in this context?
  *   (A) There is a threshold of capacity below which standing is zero, and insects likely fall below it. → **Leaf 1**
  *   (B) Sentience is graded or threshold-free, granting insects some standing. → **Node 2**
  *   (C) The primary moral unit is not the individual, but the colony or species. → **Node 3**

  **Node 2 (Epistemology of Difference):** How do biological differences between vertebrates and insects affect moral calculation?
  *   (A) They lower the *probability* that insects are sentient enough to count. → **Node 4**
  *   (B) They act as a *multiplier* reducing the weight of a given episode of insect suffering. → **Node 4**

  **Node 3 (Collective Unit):** Which collective entity holds moral primacy?
  *   (A) The Colony (e.g., the hive as a superorganism). → **Leaf 2**
  *   (B) The Species (e.g., preservation of *Apis mellifera* as a kind). → **Leaf 3**

  **Node 4 (Decision Rule under Uncertainty):** Given the uncertainty and scale, which decision rule applies?
  *   (A) Maximize Expected Value (probability × magnitude). → **Node 5**
  *   (B) Apply a Precautionary Principle (avoid risk of severe suffering regardless of probability). → **Leaf 4**
  *   (C) Apply a Probability Cap (discount probabilities below a certain threshold to zero). → **Leaf 5**

  **Node 5 (Aggregation and Death):** What is the correct metric for aggregation, and does death count?
  *   (A) Count probable *lives* ended; death is a harm even if life is net neutral. → **Node 6**
  *   (B) Count expected *sentient moments*; death matters only if it curtails net positive welfare. → **Node 6**

  **Node 6 (Intervention and Scope):** Do interventions change total population size, and must this rule apply to other low-probability stakes?
  *   (A) Interventions reduce total lives; consistency requires applying this rule to all similar stakes (e.g., Pascal's Mugging). → **Leaf 6**
  *   (B) Interventions redistribute niches; consistency allows domain-specific restrictions on this rule. → **Leaf 7**
  *   (C) Interventions reduce total lives; consistency allows domain-specific restrictions. → **Leaf 8**
  *   (D) Interventions redistribute niches; consistency requires applying this rule to all similar stakes. → **Leaf 9**
  *(Note: Node 6 is a quad-furcation to ensure leaf count targets are met within node constraints.)*

  **Leaf 10 (Research Priority):** *Reached if Node 4 answer is (A) but participant elects to pause for data.* → **Leaf 10**

  ---

  ### Position Descriptions and Awkward Commitments

  1.  **Vertebrate Exclusivism:** Insect sentience is theoretically possible but morally irrelevant due to capacity thresholds.
      *   *Awkward Commitment:* Must defend a sharp moral cliff-edge where negligible biological differences dictate total moral exclusion.
  2.  **Hive Utilitarianism:** The colony is the sentient unit; individual insect death is akin to cell shedding.
      *   *Awkward Commitment:* Must justify sacrificing individual workers in ways that would be abhorrent if applied to vertebrate cells or clones.
  3.  **Taxonomic Conservationism:** Moral value resides in the species lineage rather than individual welfare.
      *   *Awkward Commitment:* Must prioritize preserving a species even if doing so guarantees massive suffering for its individual members.
  4.  **Precautionary Absolutism:** Any non-zero risk of sentience mandates avoiding potential harm regardless of probability.
      *   *Awkward Commitment:* Licenses paralyzing restrictions on agriculture and research based on speculative metaphysics rather than evidence.
  5.  **Probabilistic Neglect:** Probabilities of insect sentience are below the decision-relevant cap.
      *   *Awkward Commitment:* Requires ignoring the same probability magnitudes if the stakes were human lives rather than insect lives.
  6.  **Radical Revisionist:** Expected value dictates large-scale changes to pest control and farming; consistency binds you to similar logic elsewhere.
      *   *Awkward Commitment:* Forces acceptance of counter-intuitive obligations in unrelated low-probability, high-stakes scenarios (e.g., simulation hypotheses).
  7.  **Pragmatic Redistribution:** Interventions only shift suffering; moral rules need not generalize beyond this ecological domain.
      *   *Awkward Commitment:* Adopts a moral rule here that you would reject in structurally identical human welfare cases.
  8.  **Life-Centric Compromise:** Reducing insect numbers is good (death counts), but rules need not generalize to other stakes.
      *   *Awkward Commitment:* Values insect life negatively while refusing to apply the same valuation logic to other potential sentient entities.
  9.  **Consistent Redistributor:** Interventions redistribute suffering; you must accept similar redistribution logic in all moral contexts.
      *   *Awkward Commitment:* Implies that creating happy beings to offset suffering is morally equivalent to preventing suffering directly.
  10. **Epistemic Wait-and-See:** Expected value is positive for action, but credences are too imprecise to justify revision yet.
      *   *Awkward Commitment:* Delays action on potential massive suffering while continuing practices that might cause it, citing uncertainty.

  ---

  ### Analysis of Logical Space

  **Indistinguishable Positions (Flagged Pairs)**
  *   **Leaf 6 (Radical Revisionist) & Leaf 9 (Consistent Redistributor):** The tree cannot separate these positions if the participant believes interventions *both* reduce total lives and redistribute niches simultaneously. The gap is a **disagreement about fact** (ecological causality) rather than ethics.
  *   **Leaf 7 (Pragmatic Redistribution) & Leaf 8 (Life-Centric Compromise):** Both allow domain-specific restrictions on consistency. The tree cannot separate them without asking whether death is intrinsically harmful. The gap is **nothing**; these are stylistic variations of "Domain-Limited Consequentialism."
  *   **Leaf 1 (Vertebrate Exclusivism) & Leaf 5 (Probabilistic Neglect):** Both result in no change to practice. The tree cannot separate them without probing whether the justification is capacity (Leaf 1) or probability thresholding (Leaf 5). The gap is a **question outside the tree** (metaphysical justification vs. epistemic rule).

  **Unoccupied Combinations (Diagnosed)**
  *   **Precautionary Rule + Collective Unit:** The tree prunes this path (Node 3 does not lead to Node 4). *Diagnosis:* **Unattractive.** Precaution usually protects individuals from risk; applying it to colonies risks validating totalitarian sacrifice of individuals for the "superorganism's" safety.
  *   **Probability Cap + Research Priority:** The tree prunes this path (Node 4-C leads to Leaf 5). *Diagnosis:* **Incoherent.** If probabilities are capped at zero for decision-making, investing resources to refine those probabilities is instrumentally irrational.
  *   **Expected Value + Vertebrate Distraction:** The tree does not offer a "Vertebrate Distraction" leaf for EV maximizers. *Diagnosis:* **Unexplored.** An EV maximizer could argue insect welfare is positive but negligible compared to vertebrate welfare; this position was merged into Leaf 10 for simplicity.
  *   **Threshold High + Collective Unit:** The tree prunes this path (Node 1-A leads to Leaf 1). *Diagnosis:* **Incoherent.** If individuals lack standing due to thresholds, the collective composed of them typically derives no standing unless emergent sentience is asserted, which Node 1-A denies.

  **Node Count:** 6 Internal Nodes, 10 Leaves. **Total Nodes: 16.**
