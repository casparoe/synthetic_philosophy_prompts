      *   *Handling the "Awareness" issue:* The user worries about Case 3 (no avowed belief) and Case 4 (belief in fabrication).
      *   *Adjustment:* Awareness doesn't mean "conscious belief in the truth." It means "the truth is cognitively available." In Case 3, the trembling makes the truth available. In Case 4, the belief in fabrication blocks availability (making it delusion).
