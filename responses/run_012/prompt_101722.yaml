      *   *Best Philosophical Fit:* **The Deflationary Account (Mele/Scott-Kakures).** SD doesn't require simultaneously believing $P$ and not-$P$. It requires biased evidence gathering/weighting driven by motivation.
      *   *User's specific intuition:* Seems to lean towards a **Hybrid Account**. It requires motivation + some access to the truth (avoidance implies you know where the truth is).

      *   *Drafting the Principle:* **Motivated Resistance to Accessible Evidence.**
          *   SD requires:
              1.  A motivation to believe/not-believe $P$.
              2.  Evidence/Reasons suggesting $\neg P$ are accessible (or avoided).
