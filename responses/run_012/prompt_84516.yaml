answer: |-
  **MEMORANDUM OF OPINION**
  **TO:** Charter Review Commission
  **FROM:** [Your Name/Seat]
  **SUBJECT:** Conceptual Framework and Recommendation on Residency-Based Enfranchisement
  **DATE:** October 26, 2023

  ### I. Preliminary Conceptual Map

  Before addressing the specific recommendation, we must clarify the theoretical terrain, as confusion here drives our disagreement. We are facing the "boundary problem": the paradox that a democratic people must exist to decide its rules, yet the rules decide who constitutes the people.

  Two principles are in tension. First, the **All-Subjected Principle** (those coerced by laws should shape them) is distinct from the **All-Affected Principle** (those impacted by decisions should shape them). In municipal governance, these converge but do not collapse. "Affected" is potentially infinite (regional economics); "Subjected" is bounded by jurisdiction (police, zoning, taxes). For our purposes, the All-Subjected Principle is the stronger claim for non-citizen residents.

  Second, regarding the claim that this exercise is **arbitrary**: The literature does not prove that boundaries are *groundless*, but it does confirm they are *underdetermined*. There is no natural fact that reveals the correct border of a demos. However, "not naturally determined" is not the same as "arbitrary" in the sense of "capricious." We can offer normative reasons (coercion, stake, residency) even if no single formula is metaphysically unique. My colleague is correct that we cannot find a non-question-begging *proof*, but incorrect to infer that we therefore lack *reasons*.

  Finally, on **bootstrapping**: The objection that a people must constitute itself before deciding membership is logically sound but politically paralyzing. If taken strictly, no democracy could ever expand its franchise, as the excluded cannot vote to include themselves. This is not a pseudo-problem, but it is a manageable one if we view the demos as iterative rather than static.

  ### II. Recommendation and Reasoning

  **Recommendation:** The Commission should recommend the City Council pursue a **Home-Rule Petition** to the State Legislature requesting statutory authority to decouple municipal voting from state citizenship. We should endorse the proposal for a randomly selected resident assembly to draft the specific language, but we must modify the ratification procedure: the referendum adopting the amendment should be conducted by the **current legal electorate**, not the proposed expanded electorate.

  **Time Frame:** Draft Home-Rule Petition by [Date + 30 Days]; Council Vote by [Date + 60 Days]; Submission to Legislature by [Date + 90 Days].

  **Reasoning:**

  **1. Addressing the Self-Determination and Bootstrapping Objections**
  The objection that current residents hold a legitimate claim to determine the character of their community is valid. A political community is not merely a service provider; it is a collective project. To allow those currently outside the legal boundary to vote on dissolving that boundary is to ask the community to vote on its own dissolution before a new one is formed. This is the bootstrapping problem.

  However, this objection loses its absolute force given our legal constraint. We are not unilaterally redefining the demos; we are petitioning a higher-order demos (the State) for permission to redefine our local boundary. The ultimate decision rests with the State Legislature. Therefore, the "self-constitution" of our city is subordinate to the constitutional order of the state. By routing this through a Home-Rule Petition, we acknowledge that the current city demos is asking for the authority to expand, rather than presuming it possesses that authority already.

  Regarding ratification: To mitigate the bootstrapping charge, the vote to *authorize* the expansion should rest with those currently authorized. If we allow non-citizen residents to vote on the amendment that enfranchises them, we validate the charge that the procedure is circular. While some theorists argue this exclusion violates the All-Subjected Principle, the counter-argument is that the *rule of recognition* (who counts as a voter) must be settled before the *rules of operation* (elections) can proceed. A vote by the current electorate to expand the franchise is an act of inclusion; a vote by the proposed electorate to include themselves is an act of assumption. We should recommend the former to preserve legitimacy, even if it is theoretically imperfect.

  **2. Addressing the Claim of Arbitrariness**
  My colleague argues that because any line we draw (e.g., three years residency vs. five) is arbitrary, we should admit the process is merely procedural. This is a category error. While the specific *line* is underdetermined by theory, the *direction* is not.

  If we accept that legitimate government requires the consent of the governed, and we accept that long-term residents are governed (taxed, policed, zoned), then the direction of reform points toward inclusion. The choice of "three years" is indeed a pragmatic cutoff, not a moral truth. But admitting this does not require us to abdicate judgment. We are not picking a number at random; we are picking a number that reasonably distinguishes between transients and stakeholders. The lack of a metaphysical foundation for "three years" does not render the choice unjustified; it renders it *political*. We should own this. We are making a constitutive choice based on the normative weight of subjection to coercion, acknowledging that the precise threshold is a matter of practical judgment, not philosophical discovery.

  **3. The Random Assembly**
  The proposal to use a randomly selected assembly (including non-citizens) to draft the amendment is theoretically sounder than the referendum itself. Deliberative bodies do not require the same boundary strictures as sovereign decision-making bodies. They are advisory and drafting mechanisms. Including non-citizens here respects their epistemic stake—they know how the laws affect them—without granting them sovereign authority prematurely. This balances the need for input with the need for legal order.

  **Conclusion**
  We cannot solve the boundary problem definitively; no commission can. But we can act consistently with the principle that those subject to coercive authority should have a voice in its exercise, provided we respect the procedural integrity of the change. By petitioning the State, we acknowledge our subordinate status. By having the current electorate ratify the change, we acknowledge the reality of the current boundary while voting to expand it. This path is not philosophically pure, but it is politically actionable and theoretically defensible.

  **Action:** Move to recommend the Home-Rule Petition with the ratification modification specified above.
