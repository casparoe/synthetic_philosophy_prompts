answer: |-
  ### Exam Question (Time Limit: 50 Minutes)

  **Prompt:**

  Consider a chess-playing transformer. A linear probe trained on its residual stream activations decodes the board state with 99% accuracy. However, when you ablate the probe's direction via activation patching, the model's Elo rating drops by less than 10 points. Furthermore, in a control condition, you apply the *exact same* probe to a randomly initialized copy of the architecture (same input embeddings, untrained weights); it also decodes the board state with 99% accuracy.

  1.  Given these three facts (high decodability, low causal impact, recoverability in random nets), specify the precise computational condition that must be met for the board state to count as an *internal representation* of the network rather than a property of the input encoding or the observer's analysis.
  2.  Based on your condition, commit to a position: Is the claim "this network represents the board" a mind-independent fact about the network's mechanism, or a fact relative to the observer's interests and decoding capabilities? Defend your commitment against the opposing view.

  ***

  ### Model Answer (Approx. 700 Words)

  The scenario presented dismantles the two most common heuristics for identifying representations: decodability and causal necessity. If information is linearly decodable, standard probing literature suggests it is represented. If ablating that information degrades performance, causal abstraction literature suggests it is functionally relevant. However, the control condition—the randomly initialized network—undermines both. If a random network preserves the decodability of the board state, the information was not *computed* by the network's layers; it was already linearly separable in the input embedding space and merely preserved (or not yet destroyed) by the random weights. The network is acting as an identity function on that subspace, not a computational transformer of it.

  Therefore, for the board state to count as an internal representation of the *network*, a specific computational condition must be met: **constructive causal involvement.** It is insufficient for information to be present (decodability) or even necessary for the output (causality). The network must have *constructed* the representation through its learned parameters to facilitate the task. In the chess scenario, the board state is likely an artifact of the input encoding (e.g., one-hot piece positions) that remains linearly accessible throughout the depth of the network without being transformed into a task-specific feature. Because the random net also decodes it, the trained net has not "earned" this representation through optimization. It is a passive carrier of input data, not an active representational state.

  To distinguish a true representation from this epiphenomenal decodability, we must require that the representation format be *task-optimized*. If the network were truly representing the board for the purpose of chess, the geometry of that representation should differ from the raw input geometry in ways that aid computation (e.g., grouping threats, encoding castling rights non-locally). A random network would not preserve these task-specific geometric transformations. Thus, the condition is not just that the info is there and used, but that the *format* of the info is a product of gradient descent optimizing for the objective. If the format is identical to what exists prior to computation, it is an input property, not a network representation.

  This leads to the ontological commitment: Is "representation" a fact about the network or the observer? I argue it is a **fact about the network's computational history**, not merely the observer's interests.

  If we claim representation is observer-relative, we accept that any decodable information counts as a representation if an observer cares to decode it. Under this view, the random network *does* represent the board, because the observer can extract it. This leads to pancomputationalism, where every system represents every property decodable from its state. This dilutes the term "representation" until it loses explanatory power in interpretability. We use interpretability to understand *how* the model solves the task. If we count input artifacts that the model doesn't transform or rely on as "representations," we conflate the data structure with the computation.

  However, the opposing view—that representation is interest-relative—has merit regarding *salience*. An observer might decode a feature the network uses unintentionally (a "shortcut"). Is that a representation? If we define representation strictly by mechanism (my view), the answer is no, unless that shortcut was computationally constructed. But if we define it by utility to the interpreter, it is yes.

  I reject the observer-relative view because it makes interpretability subjective. If I want to find "political bias," I can likely probe for it in a random net given rich enough inputs. If that counts as the network "representing" bias, we have failed to distinguish the model's agency from the data's structure. Representation must be tied to the *work* the system does. Since the trained chess net in the prompt does no work to maintain the board state (the random net does the same), the trained net does not represent the board in a mechanistic sense. It merely stores it.

  In conclusion, decodability is a property of the data-embedding pair; causality is a property of the output dependence. Representation is a property of the *transformation*. Because the random network condition proves the information is not transformed, the chess network does not represent the board state in its residual stream; it merely inherits it. Therefore, the claim "this network represents the board" is false, regardless of observer interest, because the necessary computational condition—task-optimized construction of the feature geometry—was not met.

  ***

  ### Marking Scheme

  **Distinction Criteria:**
  *   **A Grade (85%+):** Synthesizes the "Random Net" twist to refute both decodability and simple causality. Explicitly identifies that the information likely resides in the input embedding, not the computation. Takes a clear ontological stance and defends it against the alternative without wavering.
  *   **B Grade (70-84%):** Correctly identifies the tension between probing and ablation. Discusses causal relevance well. However, treats the "Random Net" twist as a minor anomaly or fails to draw the conclusion that the info is pre-existing in the input. Ontological section is balanced but non-committal ("it depends").

  **Required Moves & Common Botches:**

  | Required Move | Description | How Students Typically Botch It |
  | :--- | :--- | :--- |
  | **1. The Input Artifact Argument** | Must argue that if a random net decodes it, the info is in the input embeddings, not computed by the layers. | **Botch:** They treat the random net as a "baseline" for noise but fail to conclude that the trained net therefore didn't *compute* the feature. |
  | **2. Constructive Condition** | Must define representation as requiring *transformation* or *optimization* of the feature geometry, not just presence. | **Botch:** They define representation solely by causal necessity (ablation), ignoring that the random net might also be causal (or that ablation failed in the prompt). |
  | **3. Ontological Commitment** | Must explicitly choose "Intrinsic/Mechanistic" OR "Observer-Relative" and argue why the other fails. | **Botch:** They hedge ("it is both depending on context") which fails the prompt's demand to commit on the specific claim provided. |
  | **4. Pancomputationalism Rebuttal** | If choosing Intrinsic, must argue why Observer-Relative leads to triviality (everything represents everything). | **Botch:** They accept the Observer-Relative view but fail to address why this makes interpretability meaningless (the "triviality" objection). |
