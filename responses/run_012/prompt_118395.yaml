answer: |-
  The balance sheet analogy is a category error that legitimizes imperial violence by disguising moral claims as fungible accounting entries and obscuring the separation between those who bore the costs and those who booked the profits.

  **Correspondence Table**

  | Accounting Term | Imperial Analogue |
  | :--- | :--- |
  | **Assets** | Railways, telegraph, legal codes, ICS, abolition of sati. |
  | **Liabilities** | Land revenue, deindustrialisation, famines, massacres. |
  | **Reporting Entity** | The Colonial State (British Raj). |
  | **Unit of Account** | Implicitly "Utility" or Sterling (converting lives to value). |
  | **Opening Balance** | The socioeconomic state of India circa 1757. |
  | **Reporting Period** | 1757–1947. |
  | **Auditor** | The Historian (or your friend). |
  | **Shareholders** | Conflicted: British Crown/Public (equity holders) vs. Indian Population (forced stakeholders). |

  **The Audit: Where the Mapping Breaks**

  The analogy collapses under three specific failures of accounting principle, each of which invalidates your friend's "net total" argument.

  First, **incommensurability violates the unit of account.** In a valid balance sheet, all items are convertible into a single currency. Your friend's ledger requires an exchange rate between a mile of railway and a death by famine. There is no market price for this conversion; establishing one requires a moral judgment, not an arithmetic operation. By presenting the sum as objective arithmetic, the analogy hides the subjective valuation required to make the columns compatible. If you cannot define the value of a life in rupees without controversy, you cannot strike a total.

  Second, **the distributional break violates the entity assumption.** A consolidated balance sheet assumes the profits and losses accrue to the same shareholders. In the Raj, the assets (strategic control, trade advantages, prestige) largely accrued to the British metropole, while the liabilities (famine risk, political disenfranchisement, violence) were borne by the Indian population. This is not a single business; it is a transaction where one party books the asset and the other books the liability. A net gain for the "Empire" entity can coexist with a net loss for every individual subject within it. Your friend's ledger treats the colony as a single firm rather than a mechanism of transfer pricing between two distinct groups.

  Third, **the opening balance is contaminated.** Accounting measures performance against a baseline, but the baseline here is unstable. The "improvement" argument assumes pre-colonial India was the zero point, yet the conquest itself altered the trajectory of development. To measure the Raj's benefit, one must compare history against the counterfactual: what would India have developed without conquest? The balance sheet treats the actual history as the only possible history, ignoring the opportunity cost of independent modernization. Furthermore, many "assets" (like railways) were built to service the extraction mechanisms (liabilities), meaning the asset is functionally a component of the liability, not an independent credit.

  **Assessment of the Drain Metaphor**

  The "drain" metaphor is the inverse balance sheet, and it shares the same structural vulnerabilities regarding incommensurability; it still attempts to reduce complex political relationships to economic flows. However, it survives the distributional objection better than your friend's ledger. The drain theory explicitly highlights the separation of shareholders—it is an argument about transfer pricing, not consolidated welfare. While it cannot quantify the moral cost of a massacre, it accurately identifies the accounting fraud of booking revenue in London that was earned in Bengal. Both metaphors stand or fall together on the question of whether history can be summed, but the drain metaphor falls less heavily on the question of who owns the sum.

  **Pricing the Conclusion**

  Your friend needs this analogy to reach the verdict that the empire was justified because without the illusion of a net positive sum, the defense collapses into a moral claim rather than a utilitarian calculation. The arithmetic supports only the weaker claim that *some* infrastructure was built, not that it was *worth* the cost. To argue justification, he must assume the ends (modernity) validate the means (coercion), which is a philosophical stance, not an accounting result.

  A superior frame is **political justice**, which evaluates the legitimacy of authority and the rights of the governed rather than the aggregate welfare produced. This frame accepts that a regime can produce economic growth while remaining illegitimate. The cost of adopting this frame is the abandonment of quantitative certainty; you lose the comfort of a "bottom line," but you gain the ability to distinguish between a gift and a bribe, and between development and exploitation.
