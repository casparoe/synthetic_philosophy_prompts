  The slip is in **(7)**. It infers that because the *instrument* of measurement (money) is conventional, the *equality* it measures is also merely conventional. This conflates the ruler with the length.

  Aristotle distinguishes the *numeraire* (money) from the *ground* of commensurability (need). While money is legal tender, it represents *chreia* (need), which is not subjective whim (as (4) implies) but an objective requirement for political survival. The house and shoes are commensurable because both serve human flourishing, not because the state says so. The state merely provides the common denominator to make the ratio visible.

  **Why it looked fine:** We equate "convention" with "arbitrariness" (like driving on the left vs. right). For Aristotle, political conventions are the medium through which natural justice operates in human societies. Language is conventional, yet it can speak truth. Money is conventional, yet it can measure real value.

  **What you pay:** You must abandon the modern dichotomy between "natural fact" and "social construct." You accept that justice in exchange is objective but context-dependent. The "just price" isn't a metaphysical property of the shoe; it's the proportion that maintains the partnership between shoemaker and builder. It is real, but relational.

  **Deep problem for the mean?** No. It safeguards it. The mean in exchange is not arithmetic equality (1 shoe = 1 house) but proportional reciprocity (A's product : A :: B's product : B). Money allows this proportion to be realized practically. If you accept (7), the mean becomes empty legalism. By rejecting it, the mean remains a functional requirement of the polis. The fix isn't a patch; it's a correction of the premise that convention excludes nature. Aristotle's ethics is political; the "natural" justice of exchange is only realized through the "conventional" structures of the city. Your buddy's argument fails because it treats Aristotle like a libertarian natural lawyer rather than a political functionalist.
