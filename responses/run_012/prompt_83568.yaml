answer: |-
  This is a brilliant framing. You have correctly identified that the historiography of WWI origins is, at its core, a struggle over causal structure in a setting with $N=1$, no randomization, and unmeasured confounding.

  Here is the restatement of the War Guilt dispute in causal inference vocabulary, followed by the residue report on what breaks when you try to force history into a structural causal model (SCM).

  ### Part 1: The Causal Restatement

  **The Unit:** The European State System (1914).
  **The Outcome ($Y$):** General European War (August 1914). Binary: War / No War.
  **The Treatment ($A$):** German State Policy during the July Crisis.
  *   $A=1$: "Blank Check" to Austria-Hungary, risk-acceptant escalation, mobilization timetables prioritizing offensive action.
  *   $A=0$: Restraint, diplomatic mediation, forcing Austria to negotiate with Serbia.

  **The Competing DAGs:**

  1.  **The Fischer Thesis (Intentionalist):**
      *   Posits a strong direct edge $A \rightarrow Y$.
      *   Argues that Berlin viewed $Y$ not as a risk to be avoided, but as a necessary instrument to achieve latent goals (*Weltpolitik*).
      *   **Causal Claim:** High **Probability of Necessity (PN)**. If $A$ had been 0, $Y$ would likely be 0.
      *   **Mechanism:** German leadership manipulated the crisis ($M$) to ensure war occurred.

  2.  **The Structuralist/Functionalist Pushback:**
      *   Posits a dense web of confounders ($L$) driving both $A$ and $Y$.
      *   $L$ includes: Alliance rigidity, imperialist competition, nationalism, military mobilization timetables (Schlieffen Plan), the assassination of Franz Ferdinand ($U$, an exogenous shock).
      *   **Causal Claim:** Low **Attributable Fraction**. Even if $A=0$, the structural pressure $L$ was sufficient to trigger $Y$ via a different pathway (e.g., Russian or French aggression). Germany was a "sleepwalker" (Clark) or trapped by the logic of the system.
      *   **Interaction:** There is a strong interaction term between German mobilization and Russian mobilization. $Y$ only occurs if $A_{Ger}=1 \times A_{Rus}=1$.

  **The Treaty of Versailles (Article 231):**
  *   This is a legal assertion that $PN \approx 1$. It claims the counterfactual $Y_{A=0} = 0$ is true with high certainty.
  *   It implicitly asserts **Sufficiency**: That German action was a sufficient component cause within the sufficient conjunctural set that produced war.

  **The "Guilt" Question:**
  *   In CI terms, "Guilt" attempts to conflate **Causal Attribution** (was $A$ a cause of $Y$?) with **Normative Responsibility** (was $A$ a *wrongful* intervention?).
  *   Historians are arguing over the **Average Causal Effect (ACE)** of German aggression, but because $N=1$, they are actually arguing over the **Individual Causal Effect (ICE)** for this specific realization.

  ---

  ### Part 2: The Residue Report

  Here is the audit of what translates, what bends, and what breaks.

  #### 1. What Translates Cleanly
  *   **Confounding vs. Causation:** The core debate is exactly this. Was Germany the *cause* ($A \rightarrow Y$) or was Germany correlated with the cause due to systemic confounders ($L \rightarrow A$ and $L \rightarrow Y$)? The Structuralists are essentially arguing that the unadjusted association between German policy and War is biased by $L$.
  *   **Mediation Analysis:** The "July Crisis" is a mediation pathway. Fischer argues Germany controlled the mediator (Austria's ultimatum). Structuralists argue the mediator was determined by $L$ (Serbian nationalism/Austrian decline) and Germany merely reacted.
  *   **Overdetermination:** The system was overdetermined. Multiple sufficient causes existed (Russian mobilization, French alliance commitments). This makes identifying the *necessary* cause (required for PN) extremely difficult.

  #### 2. What You Have to Bend
  *   **The Treatment Definition ($A$):** In epidemiology, "smoking" is well-defined. "German Aggression" is a composite exposure bundle (diplomatic notes, troop movements, internal politics). To define $A=0$ (the counterfactual baseline), you have to imagine a Germany that is structurally identical but behaves differently. This violates the **Consistency Assumption**. Is a Germany that chooses peace in 1914 the same *unit* as the Germany that chose war? If the internal politics required to choose peace change the nature of the state, you have **interference** or **treatment variation**.
  *   **$N=1$ and Probability:** You cannot estimate frequencies. All probabilities here are **epistemic** (degrees of belief based on archival evidence), not **aleatory** (frequentist propensities). When a historian says "War was likely," they are stating a posterior probability $P(Y|Data)$, not a parameter in a data-generating process that can be sampled.
  *   **Positivity:** Did Germany actually have a choice? If structural determinists are right, $P(A=0 | L) = 0$. If the structural constraints made peace impossible for *any* actor in Germany's position, the treatment level $A=0$ is theoretically undefined for this unit.

  #### 3. What Has No Counterpart (The Breakage)
  *   **Agency and *Mens Rea*:** CI treats variables as mechanisms. If $A$ causes $Y$, it doesn't matter if $A$ was "trying" to cause $Y$. History's "Guilt" requires intent. CI has no variable for "Intent" unless you model it as a latent confounder, but legally/morally, intent modifies the *weight* of the cause, not just the path.
  *   **The Normative Baseline:** CI compares $Y_{a=1}$ to $Y_{a=0}$. Moral guilt compares Action to *Norm*. You can have a causal effect without guilt (self-defense) and guilt without a causal effect (attempted murder). The "War Guilt" clause conflates the two.
  *   **The Unit Stability:** In epi, a patient is a stable biological unit over the study period. "Germany" is not stable. The decision for war changed the internal composition of the German state (burgfrieden, military dictatorship by 1916). The treatment modifies the unit.

  ---

  ### Part 3: Addressing Your Suspicions

  > **1. The historians are basically arguing about the graph. Is that all that's going on? And given that we have exactly one realisation of 1914 and no way to intervene, is the disagreement just unfalsifiable?**

  **Verdict:** Mostly correct, but "unfalsifiable" is too strong.
  They are arguing about the DAG structure (direct vs. confounded paths). However, historians use **Process Tracing** as a substitute for intervention. They look for "smoking gun" documents (e.g., the War Council of 1912, the Hoyos mission) that act as measurements of the latent variable "Intent."
  If Fischer finds a memo saying "We must war now," he is claiming to have measured the mechanism $A \rightarrow M \rightarrow Y$ directly. If Structuralists find memos saying "We are terrified of encirclement," they are measuring $L \rightarrow A$.
  It is not strictly falsifiable in the Popperian sense because you cannot rerun 1914, but it is **constrainable**. Archival evidence bounds the counterfactual. If you find proof that Germany tried to stop Austria, $PN$ drops. If you find proof they egged them on, $PN$ rises. It's Bayesian updating on the structural parameters, not frequentist hypothesis testing.

  > **2. An attributable fraction needs a counterfactual baseline, and Germany-minus-its-drive-for-world-power isn't a well-defined exposure level — there's no reference class. Does that make the guilt question ill-posed as a causal question, or only ill-posed as a causal question and perfectly fine as something else?**

  **Verdict:** Ill-posed as a causal question, *but* that is precisely what makes it a moral/legal question.
  You have hit on the **Well-Defined Intervention Assumption**. "Germany without Imperialism" is a vague treatment. However, in the specific context of July 1914, the treatment *can* be sharpened: "Withholding the Blank Check." That is a binary, well-defined intervention.
  The "Guilt" question is ill-posed as *causal* attribution because causation is descriptive. But it is well-posed as a *legal* question because law *constructs* the counterfactual. The law says: "We define the baseline as 'reasonable state behavior'."
  So, the historians are fighting over whether the causal baseline (what Germany actually could have done) matches the legal baseline (what Germany should have done). If structural constraints made $A=0$ impossible, the legal baseline is unjust.

  > **3. PN and PS look like they ought to be the natural formalisation of Germany was to blame, but in a deterministic system with n = 1 they collapse to 0 or 1 or just go undefined. Once they've collapsed, is there anything left of a graded notion of blame?**

  **Verdict:** They collapse only if you assume a deterministic universe and perfect knowledge.
  In a Bayesian framework (which history must be), PN and PS are distributions, not point estimates.
  *   $PN = P(Y_{a=0}=0 | A=1, Y=1, \text{Evidence})$.
  *   The "graded notion of blame" maps to the **variance** and **mean** of this posterior distribution.
  *   Fischer argues the mean of PN is near 1. Structuralists argue the mean is near 0.
  *   "Shared Guilt" (the Lloyd George view) is an argument that the ACE is distributed across multiple units (Germany, Russia, Austria). It implies an interaction model where $Y = 1$ only if $\sum A_i > k$.
  *   So, graded blame survives as **uncertainty about the structural parameters**, not as a property of the single realization.

  ---

  ### Part 4: The Normative Layer (What Doesn't Survive)

  > **My suspicion is that the whole normative layer... isn't just hard to say in my vocabulary but gets actively scrubbed out by it, because causal inference is built to strip exactly that stuff away.**

  **Diagnosis:** **Confirmed.** You are exactly right.

  Causal Inference is ontologically flat. It treats "German Mobilization" and "Rainfall in the Balkans" as variables of the same type. If both are necessary causes of $Y$, they have equal claim to being "The Cause" in a sufficient component cause model.

  **What CI Scrubs:**
  1.  **Agency/Free Will:** CI assumes structural equations $Y := f(A, U)$. It does not model the *choice* of $A$. "Guilt" presupposes that $A$ was chosen by an agent who could have done otherwise ($P(A=0) > 0$). If the Structuralists are right and $A$ was determined by $L$ (systemic pressures), then in a CI model, Germany is just a conduit for $L$. In a moral model, Germany is still guilty if they *should have resisted* $L$. CI cannot capture "should."
  2.  **The Counterfactual of Rightness:** In CI, the counterfactual is $Y_{a=0}$ (what happens if they don't do it). In moral guilt, the counterfactual is $Y_{a=right}$ (what happens if they do what they ought). These are different. Germany might have caused the war ($Y_{a=0}=0$) but been justified (Self-defense). CI captures the first, scrubs the second.
  3.  **Reparations as Causal Damages:** The Treaty of Versailles tried to monetize the Attributable Fraction. "You caused $X\%$ of the damage, you pay $X\%$ of the bill."
      *   **The Failure:** This assumes linearity and additivity of damage. War damage is non-linear. Furthermore, it assumes the *only* reason to pay is causal contribution. But reparations are also punitive (deterrence) and restorative (norm repair). CI models compensation as making the victim whole ($Y \rightarrow Y_{baseline}$). It cannot model punishment ($A \rightarrow \text{Suffering}_A$) because punishment requires a normative judgment that $A$ was *wrong*, not just *causal*.

  **Conclusion:**
  The historians' "Guilt" talk is doing work that CI is designed to ignore. CI asks: *Did the match light the fire?* History/Law asks: *Did the arsonist light the fire?*
  You can answer the first with DAGs and potential outcomes (to the limit of $N=1$ uncertainty). You cannot answer the second without importing a normative framework that sits *outside* the DAG.

  The Fischer Thesis is a causal claim (Germany was the match). The War Guilt Clause is a verdict (Germany was the arsonist). You can use CI to test the match. You cannot use it to convict the arsonist. If you try, you commit the **Naturalistic Fallacy**: deriving an "ought" (reparations/guilt) from an "is" (causal attribution).

  Your intuition is correct: Causal Inference is a powerful tool for clearing the fog of confounding in the historical record, but it is structurally incapable of rendering a verdict on guilt, because guilt is not a parameter in the data-generating process. It is a label we apply to the process from the outside.
