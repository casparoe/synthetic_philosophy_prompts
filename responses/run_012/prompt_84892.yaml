prompt: |-
  I'm in a decision theory seminar this term and I've somehow been voluntold to run the Q&A when our visiting speaker comes in next Thursday. He defends risk-weighted expected utility — the view where you don't just weight each outcome by its probability, you push the probabilities through a risk function first, so the agent is sensitive to how the chances are spread across the whole gamble rather than to each outcome's chance taken on its own. That part I've got, I've read alot of the background. What I need help with is the newer stuff he's been pushing: he thinks the risk function is a single, domain-general feature of a person's rationality — one attitude to risk covering money, health, your life, the lot — and he's been arguing that it isn't always irrational for a risk-averse agent to turn down free information before deciding, because learning more can leave you staring at a distribution of chances you like less than the one you started with. He insists that's a feature of the view and not an embarrasment.

  Can you draft me eight to ten interview questions, each with a follow-up keyed to the answer he's most likely to give? I want these to actually bite, not 'so what is risk-weighted expected utility?'. Specifically I want at least: one on what the risk function is doing formally, and why it applies to the chance of doing at least as well rather than to each outcome's chance on its own; one pressing the objection that the whole thing is just ordinary expected utility with the outcomes re-described, plus a follow-up for when he replies that risk is a feature of the gamble and not of the outcomes; one on whether the risk function has so much freedom that the theory can fit any pattern of choices and so predicts nothing; one on the sure-thing principle, since the view lets you turn down a gamble that's better in every state, and I want him to say in plain words what he thinks is wrong with the sure-thing reasoning; one on the decline-free-information result, including whether he really wants to say that about something like getting a medical test; one on the single domain-general risk function, where I'll push that people seem risk-averse about money and risk-seeking about their careers, so does his one-function claim survive contact with cases; one on whether a risk-averse person is making a mistake or is just rationally permitted to be that way, and what could ever show him he's wrong; and one on what the view says about policy with a small chance of catastrophe, like pandemic prep or climate, where I want to know whether his risk function gives sensible advice or just tells you to spend everything. If there's an obvious question a good Q&A would need that I've missed, throw it in too, and keep the tone something I can actually say out loud without sounding like I'm reading off a card.
