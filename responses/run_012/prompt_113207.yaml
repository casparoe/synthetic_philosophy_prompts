prompt: |-
  Im putting together the proposal for my metaphysics seminar paper (6000 words, one semester) and I want to turn a half-formed idea into something I can actually defend. The idea: the claim that you couldn't have come from a different sperm and egg gets argued about as if it were one claim, but I think theres three seperate claims in there and they come apart. (a) the very same two cells had to be the ones that fused; (b) the same two haploid genomes had to end up in one zygote — maybe different cells, same genetic material; (c) the same zygote had to be the one that grew into you, which is a claim about the zygote and not about the gametes at all. And nobody in this debate seems bothered that identical twins have the same origin, which shows origin can't be sufficient for identity, only necessary — so each reading has to be stated as a necessity claim and then defended against the mirror-image case: twins for (a) and (b), and twinning out of a single zygote for (c), since a zygote that can become two people is already looking less like one person. The wrinkle I really want in there: is a particular sperm cell that cell in worlds where it never fertilizes anything, or is it only picked out after the fact? Because if the gamete isn't determinate in advance, (a) might not even be stateable, and that would be a result all by itself.

  Write me the proposal. No bibliography or citations, I'll add those. Give me exactly five numbered items, a sentence or two each, no intro and no closing: (1) the question, stated so it has a determinate answer, and whether it's about all three readings or just the one I think survives; (2) why the going positions on each side leave it open — in plain terms, no names needed; (3) the method, what I'd actually do month by month and why that rather than the obvious alternative; (4) what a result looks like and what would count as the project failing; (5) the honest scope for one semester and where it's most likely to break.
