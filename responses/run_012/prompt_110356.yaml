answer: |-
  Here is the translation of the sortition argument into your working vocabulary, followed by the residue report where the analogy breaks.

  ### 1. The Translation Matrix: Sortition as Trial Design

  | Political Claim | Statistical Translation | Where the Analogy Bends |
  | :--- | :--- | :--- |
  | **"Elections select for wealth and charisma, not representativeness."** | **Selection Bias / Convenience Sampling.** The candidate frame is restricted by inclusion/exclusion criteria (fundraising, party selection) unrelated to the target parameter. The voter frame suffers from differential non-response (turnout). | In trials, we accept selection bias if it aids internal validity (e.g., excluding comorbidities). In politics, the "bias" (expertise/leadership) is arguably the *feature*, not the bug. |
  | **"Sortition creates a microcosm of the people."** | **Stratified Random Sampling.** The assembly is a sample drawn from the citizen frame, stratified by key covariates (age, geography, education) to ensure balance and reduce variance on baseline characteristics. | **Differential Non-Response.** In trials, you recruit until $N$ is met. In sortition, refusal rates are high (30-50%). If refusal correlates with the outcome (e.g., disengaged citizens refuse), you lose unbiasedness. You cannot simply "recruit more" without breaking the randomisation. |
  | **"Deliberation leads to better decisions."** | **Intervention / Run-in Period.** The assembly undergoes an educational intervention (expert testimony) before the primary endpoint (vote) is measured. This moves the estimand from "raw opinion" to "informed opinion." | **Protocol Deviation.** Is deliberation a standardised intervention? Or does group dynamics introduce confounding (social desirability bias, groupthink)? In trials, we blind to prevent this; assemblies *require* interaction. |
  | **"The assembly speaks for the people."** | **External Validity / Generalisability.** The claim is that the Sample Average Treatment Effect (SATE) of the deliberation on the assembly equals the Population Average Treatment Effect (PATE) on the citizenry. | **Transportability.** You are assuming the effect of deliberation is homogeneous. If the "treatment" (deliberation) works differently on the sampled group than the non-sampled group, generalisability fails. |

  ### 2. The Residue Report: What Breaks in Translation

  You asked where the translation fails. It fails on the **ethical precondition of the sample**.

  In your work, **Informed Consent** is the gatekeeper. A patient consents to randomisation, knowing they might get placebo. The statistical validity of the trial rests on this ethical foundation.

  In sortition, the "population" (the citizenry) has not consented to be bound by the "sample" (the assembly).
  *   **Legitimacy:** In statistics, legitimacy is methodological (was the randomisation sound?). In politics, legitimacy is normative (do people accept the authority?). A statistically perfect sample has zero normative authority without a prior constitutional protocol agreeing to be bound by it.
  *   **Accountability:** In a trial, if safety signals emerge, the DSMB stops the trial. In a citizens' assembly, there is no interim analysis for "harm." The sample cannot be fired, nor can they be re-elected. Loss to follow-up (resignation) is handled by replacement, which breaks the longitudinal integrity of the specific randomisation.
  *   **The "Will" vs. The "Mean":** Statistics estimates parameters (means, proportions). Politics aggregates *will*. A representative sample mirrors the *distribution* of opinion, but it does not necessarily capture the *intensity* of preference, which is often the driver of political stability.

  **Consensus vs. Contention:**
  *   **Settled:** Elections are a biased sample of the population (socioeconomically and demographically). Sortition reduces demographic bias.
  *   **Contested:** Whether reducing demographic bias improves *decision quality*. (Statistical representativeness $\neq$ Competence).
  *   **Contested:** Whether deliberation converges on truth or amplifies group polarization. (Is the "deliberation effect" a bias or a correction?).

  ### 3. Test Case: Ostbelgien (The Standing Council)

  The Ostbelgien model (a permanent citizens' council drawn by lot that sets the agenda for the parliament) is **not** merely a sampling-design decision. It is an **Adaptive Design with a Governance Gate**.

  *   **Statistical View:** It functions as a **Sequential Enrichment Design**. The Standing Council monitors the "safety/efficacy" of the political agenda. If they detect a signal (an issue neglected by parliament), they trigger a deeper intervention (a larger Citizens' Assembly).
  *   **The Break:** This is a **Constitutional Rule**, not a sampling protocol. In trials, the adaptive design rules are pre-specified in the protocol to prevent p-hacking. In Ostbelgien, the "stopping rules" for agenda-setting are political judgments.
  *   **Verdict:** It uses sampling as a tool, but the *power to set the agenda* is a structural parameter of the state, not a statistical property of the sample. It changes the estimand of the parliament itself (from "what voters want now" to "what the screened agenda allows").

  ### 4. The Estimand Question: Election vs. Assembly

  You are correct: these are different estimands, and the debate is often silent on this.

  *   **Election Estimand:** **Treatment Policy Strategy.**
      *   *Definition:* The effect of granting power to Party X under real-world conditions (including misinformation, low attention, strategic voting).
      *   *Target:* $E[Y | \text{Vote}_{\text{actual}}]$.
      *   *Interpretation:* "What does the population actually want right now, flaws included?"
  *   **Assembly Estimand:** **Hypothetical Strategy.**
      *   *Definition:* The effect of granting power to the population *if* they were all informed, deliberated, and free from time pressure.
      *   *Target:* $E[Y(1) | \text{Deliberation}]$.
      *   *Interpretation:* "What *would* the population want under idealized conditions?"

  **The Conflict:** The ICH E9(R1) addendum warns that Hypothetical estimands are useful only if the intervention (deliberation) is scalable or if the difference between Hypothetical and Treatment Policy is the specific quantity of interest.
  Sortition advocates argue the Hypothetical estimand is the *true* democratic signal (the "general will"). Critics argue the Treatment Policy estimand is the only one that matters for stability (you cannot govern based on a counterfactual). The debate fails because one side is optimizing for **Internal Validity** (Assembly: removing noise/bias) and the other for **External Validity** (Election: reflecting the messy reality).

  ### 5. Final Diagnosis

  Your vocabulary is not eating the concept; it is revealing the hidden assumptions. The sortition argument relies on the assumption that **Statistical Representativity implies Normative Authority**.

  In your work, if you produce a perfect sample, you have described the population. You have not gained the right to *make decisions* for them. The translation fails because clinical trials measure *outcomes*, while legislatures exercise *power*. The statistical machinery can ensure the sample *looks* like the population, but it cannot generate the **Consent to be Bound** that transforms a sample into a government.

  \answer{Consent to be bound}
