  **Mark: 16/20**

  **Breakdown:**
  (a) 8/8
  (b) 4/7
  (c) 4/5

  **Comments:**

  **(a) Excellent.** You have captured the example precisely and, crucially, identified the *structural* nature of the objection. Many students mistake this for a claim about calculation time; you correctly identify it as a claim about justificatory structure ("moral licence").
  *   *Awarding full marks:* "His reason for pulling her out should simply be that she is his wife" — this shows you understand the phenomenological point Williams is making about personal relationships.

  **(b) Good on the connection, but you conflate the two arguments.** You write: *"the wife example is the same point in miniature: the husband is asked to treat his deepest attachment as one item in the sum... That is what people mean by the integrity objection."*
  *   *Docking 3 marks:* The question asks where they **come apart**. You assert they are the "same point." While related, OTTM is about *alienation in deliberation* (the intrusion of the moral point of view into personal life), whereas the Integrity objection (Jim/George) is about *identity and negative responsibility* (being made causally responsible for outcomes you didn't bring about).
  *   *What to write instead:* You should have noted that OTTM critiques the *thought process* required by impartiality, whereas Integrity critiques the *cost to the agent's identity* when ground projects are overridden by negative responsibility. They support each other, but they are distinct arguments.

  **(c) Strong application of Railton, slightly overconfident conclusion.** You correctly identify the criterion/deliberation distinction.
  *   *Docking 1 mark:* You conclude: *"Williams's objection therefore fails."* This is too decisive for 5 marks. A complete answer would acknowledge that Williams (and critics of two-level views) might reply that holding the disposition *because* it maximises welfare still instrumentalises the relationship, even if you don't calculate it at the time.
  *   *What to write instead:* Add a sentence acknowledging that while this solves the deliberative problem, it may not fully satisfy Williams's worry about the *source* of the disposition being external to the relationship itself.

  **Overall:** A very clear, well-written script. You have a strong grasp of the utilitarian replies (Railton/Hare), which often eludes students at this level. The mark is limited primarily by the conflation in (b).

  ***

  **Marker's Note (for your eyes only):**

  **Is this better or worse than it looks?**
  It is **better** than the average script in terms of clarity and exegesis of the utilitarian reply. The student writes with a confidence and precision that suggests they actually understand the material, rather than just reciting notes. The explanation of Railton's "sophisticated consequentialist" is particularly clean.

  **Is the (b) interpretation defensible?**
  Technically, **no**, not in the context of a Williams exam. While some secondary literature argues that "One Thought Too Many" is merely a specific instance of the broader Integrity objection, Williams presents them as distinct points in *Persons, Character and Morality*.
  *   **OTTM:** Focuses on the *nature of personal relationships* and the absurdity of requiring impartial justification for partial acts.
  *   **Integrity:** Focuses on the *agent's identity* and the attack on "ground projects" via negative responsibility (Jim/George).
  The student treats them as identical ("same point in miniature"). This is a common conflation, but since the question explicitly asks "where they come apart," failing to distinguish them is a genuine error in philosophical comprehension, not just a difference of interpretation. You are right to dock marks here.

  **Why the stall?**
  You likely stalled because the script *reads* like a First (2:1 in the UK system, or A-range), particularly part (a) and the writing style. However, the conceptual blur in (b) prevents it from being a true First. It is a very high 2:1 (16/20). If you give it 17+, you risk inflating a script that misses a key distinction in the primary text. 16 is the safe, defensible mark.
