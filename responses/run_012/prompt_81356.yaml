  | Requirement | Motivating case or consideration | What it rules out | Status |
  | :--- | :--- | :--- | :--- |
  | **Irreflexivity** | Nothing grounds itself; explanation cannot be circular. | Metaphysical circularity; self-grounding entities. | Non-negotiable |
  | **Asymmetry** | If $A$ grounds $B$, $B$ cannot ground $A$. | Mutual dependence; symmetric grounding relations. | Non-negotiable |
  | **Transitivity** | Grounding chains transmit fundamentality ($A \to B, B \to C \implies A \to C$). | Non-transitive grounding chains; fragmented ontological tiers. | Negotiable |
  | **Well-foundedness** | There must be a fundamental base; no infinite descent. | Infinitism; endless chains of dependence without a bottom. | Negotiable |
  | **Necessitation** | If $A$ grounds $B$, necessarily, if $A$ obtains then $B$ obtains. | Contingent grounding relations; modal flexibility between grounds and grounded. | Negotiable |
  | **Contingent Grounding Permitted** | **Case 1 (Singleton Set):** The member $x$ can exist without $\{x\}$, yet $\{x\}$ is grounded in $x$. | The claim that all grounding is necessary; rigid modal connections between relata. | Preference |
  | **Hyperintensionality** | Grounding distinguishes between co-extensive but distinct properties (e.g., triangular vs. trilateral). | Reduction of grounding to necessary equivalence or supervenience alone. | Non-negotiable |
  | **Relativity (Context)** | **Case 3 (Joke Funniness):** Grounds for funniness shift with audience/decade. | Absolutism about grounding facts; binary grounding relations without parameters. | Preference |
  | **Normative Purity** | **Case 2 (City Injustice):** Non-normative facts should ground normative facts without smuggling norms. | Impure bases; normative facts appearing in the fundamental base. | Negotiable |
  | **Causation Distinction** | Grounding is synchronic/constitutive; causation is diachronic/productive. | Reducing grounding to causation; conflating metaphysical with physical dependence. | Non-negotiable |
  | **Supervenience Distinction** | Grounding explains *why* supervenience holds; it is not merely covariance. | Reducing grounding to supervenience; unexplained modal correlations. | Non-negotiable |
  | **Grounding Facts Grounded** | **Case 4 (Regress):** If $\langle A \text{ grounds } B \rangle$ is a fact, it demands a ground. | Brute grounding facts; unexplained structural connections. | Negotiable |

