answer: |-
  This is a profound distinction, and your intuition aligns with a growing sentiment in the philosophy of science that treats *control* and *manipulation* as more fundamental than *prediction* alone. Standard Algorithmic Information Theory (AIT) optimizes for the shortest description of the *past* (the data string). Your "Interventional Compressibility" optimizes for the shortest description of the *future* (the policy of manipulation).

  When data are finite, the additive constant in Kolmogorov complexity ($K(x)$) is not negligible; it depends on the choice of universal Turing machine (the reference language). In physics, this "reference machine" is the theoretical framework and instrumentation language you bring to the lab. Standard theory pretends this doesn't matter. Your procedure must admit that it does.

  Below is the **Interventional Model Selection Protocol (IMSP)**. It is designed for a 90-minute monthly meeting. It treats your distinction as the primary axis of evaluation.

  ---

  ### The Interventional Model Selection Protocol (IMSP)

  **Pre-requisites:**
  *   **Pre-work:** Two days before the meeting, a designated "Model Clerk" distributes a one-page summary of each rival model, including the log-likelihood of the current data and a list of parameters.
  *   **Attendees:** Principal Investigator (PI), 3-5 Senior Researchers, 1 Postdoc (scribe).
  *   **Time:** 90 Minutes hard stop.

  #### Phase 1: Reference Class Agreement (15 Minutes)
  *Goal: Acknowledge the reference machine problem.*

  1.  **Define the Coding Language:** The group must explicitly agree on the "vocabulary" used to measure complexity. Is it lines of code? Number of differential equations? Number of physical constants?
      *   *Objective:* Count of symbols/parameters in the agreed language.
      *   *Judgement:* Is this language appropriate for the physical system? (e.g., Using Lagrangian mechanics for a thermodynamic system might artificially inflate complexity).
  2.  **The Constant Check:** If the difference in model complexity (in the chosen language) is less than the estimated "overhead" of translating between the models, **STOP**.
      *   *Stopping Condition:* If $|Length(Model_A) - Length(Model_B)| < \epsilon$ (where $\epsilon$ is the estimated translation cost), declare a **TIE**. Do not proceed to scoring. Recommend gathering data specifically designed to break the symmetry.

  #### Phase 2: Scoring Observational Compressibility ($C_{obs}$) (15 Minutes)
  *Goal: Quantify fit to existing data using MDL as a proxy.*

  3.  **Calculate MDL Score:** Use the Minimum Description Length principle: $L_{total} = L(model) + L(data|model)$.
      *   $L(model)$: Bits to describe the structure/parameters.
      *   $L(data|model)$: Bits to describe the residuals (noise).
      *   *Objective:* Calculation based on pre-work likelihoods and parameter counts.
  4.  **Rank Models:** Rank models from lowest $L_{total}$ (best) to highest.
      *   *Note:* Acknowledge that this favors fitting the past. Record the winner of this phase as $M_{obs}$.

  #### Phase 3: Scoring Interventional Compressibility ($C_{int}$) (45 Minutes)
  *Goal: Quantify the compression of the experimental search space.*

  5.  **Identify Interventional Invariants:** For each model, list the parameters that *must* be re-tuned if a new intervention is performed.
      *   *Judgement:* Does the model claim these parameters are structural (fixed) or phenomenological (tunable)?
  6.  **Calculate Interventional Cost ($IC$):**
      *   $IC = (\text{Count of parameters requiring re-tuning}) \times (\text{Cost of tuning})$.
      *   *Proxy:* If Model A requires 0 new parameters to predict an intervention, and Model B requires 2, Model A has higher $C_{int}$.
      *   *Objective:* Count of new free parameters needed for the *next* proposed experiment.
  7.  **Evaluate Falsification Density:** How many distinct experimental setups are required to distinguish the model from its nearest rival?
      *   *Judgement:* Estimate the "experimental volume" required to falsify. A model that is falsified by a single type of intervention has higher $C_{int}$ (it compresses the space of possibilities more aggressively) than one that requires a grid of 100 experiments.
  8.  **Rank Models:** Rank models by lowest Interventional Cost. Record the winner as $M_{int}$.

  #### Phase 4: Deliberation and Decision (15 Minutes)
  *Goal: Resolve conflicts between $M_{obs}$ and $M_{int}$.*

  9.  **Compare Winners:**
      *   If $M_{obs} == M_{int}$: **RECOMMENDATION:** Adopt the winning model.
      *   If $M_{obs} \neq M_{int}$: Proceed to Step 10.
  10. **The Risk Assessment:**
      *   Does $M_{int}$ (the better interventional model) fit the current data within acceptable error bounds (e.g., $p > 0.05$)?
      *   *Yes:* **RECOMMENDATION:** Adopt $M_{int}$. (Priority given to future control over past fit).
      *   *No:* **RECOMMENDATION:** Adopt $M_{obs}$ but flag as "Phenomenological Only." Do not use for control systems.
  11. **Dissent Protocol:** If any senior member objects to the reference language (Step 1) or the Interventional Cost assessment (Step 6), their objection is recorded in the "Minority Report" attached to the recommendation.
  12. **Tie-Breaker:** If scores are effectively equal, the recommendation is **NO DECISION**. The group must design an experiment specifically to maximize the divergence in $C_{int}$ between the models.

  ---

  ### Application to Cases

  #### Case 1: The Pendulum (Observational vs. Interventional Tension)
  *   **Model A:** Deterministic, 1 parameter ($g$).
  *   **Model B:** Stochastic, 2 parameters ($g, \sigma$), fits data slightly better (lower residuals).
  *   **IMSP Execution:**
      *   *Phase 1:* Language agreed (differential equations). Complexity difference is 1 parameter. Not negligible. Proceed.
      *   *Phase 2 ($C_{obs}$):* Model B has lower residuals. Unless the penalty for the extra parameter $\sigma$ is high, MDL favors **Model B**. ($M_{obs} = B$).
      *   *Phase 3 ($C_{int}$):* To predict the effect of changing the mass or length:
          *   Model A: No new parameters. $IC = 0$.
          *   Model B: Must re-estimate noise term $\sigma$ for new configurations. $IC > 0$.
          *   $M_{int} = A$.
      *   *Phase 4:* Conflict. Does Model A fit within acceptable bounds? Yes (pendulums are well-approximated by deterministic models).
      *   **Recommendation:** Adopt **Model A**.
      *   **Rationale:** The slight gain in observational fit (B) is purchased at the cost of interventional flexibility. Model B treats physical noise as a parameter to be fitted, whereas Model A treats it as external. For a lab building control systems, A is more compressible interventionally.

  #### Case 2: The Biological Network (The "Win" for Your Distinction)
  *   **Model C:** Simple network, 1 free parameter tuned to data. Fits well.
  *   **Model D:** Complex network, 0 free parameters (fixed by theory). Fits worse (higher residuals), but predicts knock-out experiments accurately.
  *   **IMSP Execution:**
      *   *Phase 2 ($C_{obs}$):* Model C fits better and has fewer parameters. MDL strongly favors **Model C**. ($M_{obs} = C$).
      *   *Phase 3 ($C_{int}$):*
          *   Model C: To predict a gene knock-out, the free parameter must be re-tuned. $IC = High$.
          *   Model D: Parameters are fixed by theory. Prediction requires no tuning. $IC = 0$.
          *   $M_{int} = D$.
      *   *Phase 4:* Conflict. Does Model D fit within acceptable bounds? User states it "fits less well." The group must decide if the residuals are statistically fatal or just noisy. Assuming they are within tolerance ($p > 0.05$):
      *   **Recommendation:** Adopt **Model D**.
      *   **Rationale:** Standard theory (AIC/BIC) would reject D for poor fit and high complexity. IMSP accepts D because its complexity is "front-loaded" in the theory, yielding zero marginal cost for interventions. It compresses the *space of experiments*.

  #### Case 3: The "Ugly" Model (Handling Discomfort)
  *   **Scenario:** A model emerges that is mathematically disjointed (e.g., piecewise functions with no physical justification) but scores highest on both $C_{obs}$ and $C_{int}$.
  *   **Group Reaction:** "It feels like curve fitting." "It lacks unity."
  *   **IMSP Execution:**
      *   The protocol has no step for "aesthetic unity."
      *   *Step 1 Check:* Is the "ugliness" actually a violation of the Reference Language? (e.g., using a lookup table instead of an equation). If yes, penalize $L(model)$.
      *   *Step 6 Check:* Does the ugliness imply high Interventional Cost? (e.g., "This rule holds unless X, then Y"). If the piecewise nature requires knowing which "piece" of the intervention space you are in, $IC$ goes up.
      *   **Resolution:** If the model passes the objective checks, the procedure forces the group to **Recommend the Ugly Model**.
      *   **Handling Discomfort:** The "Minority Report" (Step 11) is crucial here. The group records: "We recommend Model X, but note it lacks theoretical unity." This signals to the Lab Head that the model is a *tool*, not a *truth*. It validates the scientists' intuition without vetoing the data.

  ---

  ### Honest Limits and Failure Modes

  You asked for honesty about where this breaks. Here is where the IMSP is vulnerable.

  **1. The Circularity of Interventional Cost**
  To calculate $C_{int}$, you must know what interventions are possible. But often, the model *tells* you what interventions are possible. If Model D says "Intervention X is impossible," and Model A says "Intervention X is possible," how do you score the cost of X?
  *   *Limit:* The procedure assumes a shared ontology of possible interventions. If models disagree on what *can* be done, Step 6 becomes subjective.
  *   *Mitigation:* Restrict scoring to a "Common Intervention Set" agreed upon in Phase 1.

  **2. Dressing Up Risky Predictions**
  Is "Interventional Compressibility" just Popperian falsifiability in information-theoretic clothing?
  *   *Analysis:* Largely, yes. A model that predicts interventions without tuning is a model that risks being wrong more often.
  *   *Limit:* The procedure does not solve the problem of *why* we prefer risky predictions. It merely formalizes the preference. It does not justify the prior that "nature is manipulable."

  **3. The Additive Constant Problem**
  You rightly noted that the invariance theorem fails for finite data.
  *   *Limit:* If the group chooses a reference language biased toward Model D (e.g., a language that hard-codes Model D's theory), Model D will win on $C_{obs}$ and $C_{int}$ trivially.
  *   *Mitigation:* Step 1 requires explicit agreement. If agreement fails, the procedure *must* return a Tie. This is a feature, not a bug. It prevents hidden biases from dictating results.

  **4. Conflict with the Lab Head**
  The Head has the final say. What if the IMSP recommends Model D, but the Head prefers Model C (perhaps because C is easier to publish or fits a grant narrative)?
  *   *Protocol:* The IMSP is an advisory instrument, not a governing constitution.
  *   *Action:* If the Head overrides the recommendation, the "Minority Report" becomes the official record of the lab's epistemic state. It should read: "Decision: Model C. Epistemic Warning: Model C has low interventional compressibility; predictions for future interventions carry high uncertainty."
  *   *Ethical Duty:* The group's duty is to ensure the Head knows *why* they are choosing a model with higher future risk. The procedure quantifies that risk.

  ### Summary
  Your distinction captures the difference between a *map* (Observational) and a *compass* (Interventional). Standard theory optimizes the resolution of the map. Your procedure optimizes the utility of the compass.

  The IMSP does not guarantee truth. It guarantees that when the lab chooses a model, they know whether they are buying a better fit to the past or a better tool for the future. In finite data regimes, that is the only honest choice we can make.
