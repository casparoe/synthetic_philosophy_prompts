answer: |-
  You are right to be frustrated. The debate often stalls because participants treat contingent methodological preferences as metaphysical laws. Below is the specification list you asked for. It separates the logical/biological constraints any theory must respect from the metaphysical commitments that divide the room. Following the list, I identify the genuine incompatibility lurking beneath the "sperm and egg" intuition.

  ### I. The Specification List for a Theory of Personal/Organismal Essence

  **A. Logical and Metaphysical Constraints (Non-Negotiable)**
  *These are requirements of coherence. A theory failing these is not a rival view; it is broken.*

  1.  **Transitivity of Identity:** If $A$ is the same entity as $B$, and $B$ is the same entity as $C$, then $A$ is $C$. The theory cannot allow identity to be an equivalence relation in some contexts but not others.
      *   *Case:* Fission scenarios. If a zygote splits into twins, you cannot say Twin 1 is the Original AND Twin 2 is the Original without violating transitivity (unless you deny the Original persists).
  2.  **Determinacy of Existence:** For any possible world and any candidate entity, it must be determinate whether that entity exists in that world. (Or, if the theory allows ontic vagueness, it must explicitly defend that position rather than ignoring the indeterminacy).
      *   *Consideration:* We cannot have a theory where it is "sort of true" that you exist in a world unless the theory embraces vague identity.
  3.  **Non-Triviality:** The theory cannot define essence in a way that makes every property essential or no property essential.
      *   *Consideration:* "You are essentially you" is true but useless. "You are essentially human" is too broad to solve the sperm/egg problem.
  4.  **Alignment with Actuality:** The theory must accord with the actual biological history of the subject in the actual world.
      *   *Consideration:* You cannot claim you essentially came from a zygote if, in actuality, you arose via parthenogenesis or fusion. The theory must track what *actually* happened before prescribing what *could* have happened.

  **B. Biological and Empirical Constraints (Non-Negotiable)**
  *These are requirements imposed by the substrate (biology) rather than metaphysics.*

  5.  **Accommodation of Cellular Continuity:** The theory must account for the fact that organisms persist through total cellular replacement.
      *   *Consideration:* If origin is essential, it cannot be "current cellular makeup," or you would cease to exist every seven years.
  6.  **Accommodation of Biological Anomalies:** The theory must provide a verdict (even if negative) on edge cases where standard biological individuation fails.
      *   *Case (Tetragametic Chimera):* Two zygotes fuse. There is no single zygote origin. The theory must state: (a) The person has a disjunctive origin, (b) The person has no essential origin, or (c) The "person" is actually two organisms sharing a body.
      *   *Case (Twin Absorption):* One early embryo absorbs another. Did the survivor originate as a twin? Is there a fact of the matter which cell line persisted? The theory must say whether this is a determinate fact or an indeterminate one.
  7.  **Distinction between Genetic and Material Origin:** The theory must distinguish between the *source material* (the specific gametes) and the *structural blueprint* (the genome).
      *   *Case (Genome Edit):* A zygote from Gametes A is edited to match the genome of Gametes B. The theory must verdict: Is the origin Gametes A (material), Genome B (structural), or the Editing Event? It cannot conflate genome identity with numerical identity.

  **C. Modal and Intuitive Constraints (Camp Commitments)**
  *These are the battlegrounds. A theory can reject these, but it must declare the rejection explicitly.*

  8.  **The Necessity of Origin (Origin Essentialism):** [Camp Commitment: Kripkeans/OE] The entity could not have come from a different zygote/gamete pair.
      *   *Cost of Rejection:* If rejected, you must explain why *this* person is distinct from a qualitatively identical person from different gametes (Haecceitism) or accept that identity is looser than intuition suggests.
  9.  **The Intrinsicness of Identity:** [Camp Commitment: Internalists] What makes you *you* depends on your intrinsic history, not on whether a competitor exists.
      *   *Cost of Rejection:* If identity depends on "no branching" (Extrinsicism), then whether you exist in a possible world depends on whether someone *else* was also born there.
  10. **The Person/Organism Distinction:** [Camp Commitment: Animalists vs. Psychologists] The theory must state whether it tracks the biological organism or the psychological person.
      *   *Cost:* If tracking the organism, psychological discontinuity (coma, amnesia) doesn't end existence. If tracking the person, biological continuity (vegetative state) might not sustain existence.
  11. **The Asymmetry Intuition:** [Camp Commitment: Organicists] The theory should explain (or deny) why origin seems essential for persons but not for artifacts (statues).
      *   *Consideration:* A statue could be made from a different lump of bronze; a person (intuitively) could not be made from different gametes. The theory must explain if this is a real metaphysical difference or a cognitive bias.

  **D. Epistemic and Explanatory Constraints (Non-Negotiable)**
  *The theory must explain how we know what it claims.*

  12. **Account of A Posteriori Necessity:** The theory must explain how a truth can be necessary yet only knowable empirically.
      *   *Consideration:* The "Magic Trick" Problem. If it's necessary, why did we need biology to tell us? The theory must distinguish between *fixing the reference* (empirical) and *fixing the essence* (metaphysical).
  13. **Tolerance for Vagueness:** The theory must state whether it allows for "borderline cases" of existence.
      *   *Case:* If a sperm is materially almost identical to the actual sperm but differs by one molecule, does the person exist? The theory must either draw a sharp line (and explain where) or admit vagueness.

  ---

  ### II. The Incompatible Subset (The Trilemma)

  You suspected a clash. Here it is. You cannot jointly satisfy the following three requirements. A theory must drop or modify one.

  1.  **Strong Origin Essentialism:** An entity has a specific, unique, necessary origin (e.g., *this* specific zygote).
  2.  **Determinacy of Identity:** It is always a determinate fact whether an entity exists in a possible world (no vague existence).
  3.  **Biological Continuity & Fission/Fusion:** Biological beginnings are continuous processes that allow for fission (twins), fusion (chimeras), and gradual replacement (molecular swap) without clear ontological boundaries.

  **The Clash:**
  If biology is continuous/vague (3), but identity is determinate (2), then you cannot pin existence to a specific, unique origin point (1) without arbitrariness.
  *   *Example:* In the **Twin Absorption** case, if the embryo splits and one half dies, did *you* originate as a twin? If Origin Essentialism says "Yes, Zygote Z," but Zygote Z essentially produces twins, then *you* essentially have a twin who died. But if the other twin had lived, would *you* exist? If yes, identity branches (violating 2). If no, your existence depends on the death of another (violating Intrinsicness).
  *   *Example:* In the **Genome Edit** case, if you hold Strong Origin Essentialism (1), the child is essentially the product of Gametes A. But if the genome is B, and we think "you are your code," we have a conflict. If we say the origin is now "indeterminate" to save the intuition, we violate Determinacy (2).

  **Resolution Paths:**
  *   **Drop (1):** Accept that origin is not essential (Constitution View / Materialism). Cost: Loss of strong individuality; you could have been someone else's sibling.
  *   **Drop (2):** Accept ontic vagueness (Vague Identity). Cost: Logic becomes fuzzy; "exists" is a matter of degree.
  *   **Drop (3):** Deny biological continuity implies ontological continuity (Substance Dualism / Soul Theory). Cost: Disconnected from science; the "origin" is the soul's creation, not the zygote's.

  ---

  ### III. Specific Edge Case Verdicts (What the Theory Must Deliver)

  Your specification demands the theory take a stance on these. Here is what the stance implies:

  1.  **Tetragametic Chimera (Two zygotes fuse):**
      *   *Requirement:* The theory cannot point to a single zygote.
      *   *Verdict Options:* Either (a) Origin is the *fusion event* (not the gametes), (b) Origin is disjunctive (Zygote 1 OR Zygote 2), or (c) There are two persons here.
      *   *Cost:* Option (a) breaks Origin Essentialism (gametes don't matter). Option (b) breaks Uniqueness of Origin. Option (c) is empirically revisionist.

  2.  **Genome Edited Embryo (Gametes A, Genome B):**
      *   *Requirement:* Distinguish material origin from genetic profile.
      *   *Verdict:* If the theory says origin is Gametes A, it prioritizes *substance*. If it says Genome B, it prioritizes *form*.
      *   *Cost:* If Substance: A person could be essentially "wrong" genetically (mismatched to their essence). If Form: A person could be essentially "stolen" (you are essentially the child of the genome donors, not the gestators). Most Origin Essentialists must say Gametes A, which implies your genome is accidental to your identity.

  3.  **Twin Absorption (Vanishing Twin):**
      *   *Requirement:* Fact of the matter on which cell persisted.
      *   *Verdict:* The theory must say if there is a fact.
      *   *Cost:* If there *is* a fact, it is biologically inaccessible and metaphysically brute (Haecceitism). If there is *no* fact, then "who you are" is vague at the start of your life.

  ---

  ### IV. The "Magic Trick" and The Asymmetry

  **1. A Posteriori Necessity (The Magic Trick)**
  The feeling of a "magic trick" arises from confusing *reference fixing* with *essence fixing*.
  *   **The Explanation:** We use empirical means (biology) to point to *this* individual. Once pointed to, we ask: "In any world where *this* individual exists, what must be true?" The answer is "They must come from *this* origin." The necessity doesn't come from the biology; it comes from the rigidity of the reference. We needed biology to find the object, but once found, its modal profile is locked.
  *   **Requirement:** The theory must not claim the biology *makes* it necessary, but that the biology *reveals* the necessary relation of the object picked out.

  **2. The Asymmetry (Persons vs. Statues)**
  *   **The Question:** Why can a statue come from different bronze, but a person not from different gametes?
  *   **Requirement:** The theory must explain this or dissolve it.
  *   **Explanation:** Organisms have an *internal* principle of continuity (metabolism, DNA replication) tied to the initial seed. Artifacts have an *external* principle (artist's intent) tied to the final form. The statue's identity is fixed by the successful realization of a form; the person's identity is fixed by the initiation of a life process.
  *   **Dissolution:** Some theories (Constitution View) say the asymmetry is illusory. The *person* (psychological) could have come from different gametes, but the *organism* could not. If you conflate person and organism, the asymmetry feels puzzling.

  ---

  ### V. Evaluation of Going Views Against the List

  **1. Kripkean Origin Essentialism**
  *   *Performance:* Fails the **Chimera Case**. It requires a unique origin zygote. If two fuse, the theory has no resources to identify *the* origin without arbitrariness. It also struggles with the **Magic Trick**, often asserting the necessity without explaining the mechanism of reference fixing clearly enough to satisfy critics.
  *   *Verdict:* High intuitive match, low biological robustness.

  **2. Animalism (Biological Continuity)**
  *   *Performance:* Handles the **Chimera** and **Twin Absorption** better by focusing on the continuity of the life process rather than the specific gamete. However, it struggles with the **Genome Edit** case: if the life continues but the code changes to match another, is it the same animal? It also often fails the **Asymmetry** explanation, treating persons as mere organisms, which clashes with psychological intuitions.
  *   *Verdict:* High biological robustness, moderate intuitive match.

  **3. Four-Dimensionalism (Perdurantism)**
  *   *Performance:* Dissolves the **Trilemma** by denying strict identity over time (you are a spacetime worm). It handles **Fission** easily (the worm branches). However, it fails the **Determinacy of Existence** requirement for most people, as it suggests "you" are just a temporal part, making the question "could I have come from..." a category mistake (you are asking about a different worm).
  *   *Verdict:* High logical consistency, low phenomenological match.

  **Summary for your Group:**
  Tell them to stop arguing about the sperm case. Ask them to pick which horn of the Trilemma they are willing to bleed on: **Unique Origin**, **Determinacy**, or **Biological Reality**. If they won't choose, they aren't doing metaphysics; they're doing intuition pumping.
