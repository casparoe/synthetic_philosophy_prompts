      *   Introduce the concept of *material risk* and *alternatives*.
      *   Cite the standard (reasonable patient standard or subjective standard).
      *   Explain that omission of a safer alternative is a failure of disclosure.
      *   Address the "no further obligation" point: The duty is to disclose, not just answer questions. Autonomy requires understanding options, not just agreeing to a proposed one without knowledge of others.
      *   Mention key bioethics literature (Beauchamp & Childress, Faden & Beauchamp) or legal standards (Canterbury) implicitly or explicitly to reinforce authority.

  6.  **Final Review against Constraints:**
