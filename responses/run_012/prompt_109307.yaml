answer: |-
  Your diagnosis is correct. The literature on program equilibrium (PE) currently suffers from a category error: it treats a normative model (how rational agents *ought* to coordinate via reason) as a purely technical solution concept (how programs *can* coordinate via self-reference). The technical machinery is sufficiently mature to sustain the weight of a philosophical inquiry, but the inquiry has not yet been made.

  Given your constraints (one year, two students, philosophical focus), you cannot solve everything. You must sequence the work so that a failure in an upstream question halts downstream expenditure. The ordering must follow the **viability of the normative claim**. If the Kantian interpretation cannot be formally distinguished from a trivial fixed-point property, the rest is merely logic-chopping.

  Here is the proposed prioritisation, the reasoning for the ordering, and the allocation of labour.

  ### 1. The Priority Order

  **First (Months 1–4): The Selection Problem and Universalizability**
  *   **The Question:** In PE, *Defect-Bot* (always defect) is just as much an equilibrium as *Cooperate-Bot* (cooperate if opponent does). Both are fixed points. If the normative ambition is to model Kantian universalizability, we need a criterion that selects the cooperative profile *as a matter of rational necessity*, not just as one of many stable states. What formal constraint on the "submitted program" corresponds to the Categorical Imperative?
  *   **Why Upstream:** If you cannot distinguish the "moral" equilibrium from the "immoral" equilibrium within the formalism, the claim that PE models Kantian reasoning is false. It would merely model *consistency*, which is necessary but not sufficient for morality. This is the "existence vs. uniqueness" problem, but normative rather than technical.
  *   **Philosopher vs. Logician:** This is primarily philosophical logic. It requires defining a syntactic or semantic restriction on the space of admissible programs that mirrors "willing a maxim as universal law."
  *   **Neglectedness:** High. Computer scientists treat multiple equilibria as a nuisance to be refined away; philosophers treat the link as intuitive. Neither has formally mapped the "universal law" constraint to the program space.
  *   **Success Condition:** A formal definition of an "admissible program" that rules out *Defect-Bot* without external enforcement, justified by a principle of universalizability (e.g., symmetry, or invariance under permutation of agents).
  *   **Assignment:** **Doctoral Student.** This requires deep conceptual work and familiarity with both the game theory and the ethical literature.

  **Second (Months 5–8): The Logical Substrate and Rationality**
  *   **The Question:** You asked whether robustness is a feature of rationality or an artefact of shared proof systems. Current PE results often rely on specific provability logic (e.g., Gödel-Löb). Does cooperation survive if agents use different, but compatible, logical systems? If cooperation collapses because Agent A uses PA and Agent B uses ZFC, then PE models *syntactic compatibility*, not *rational recognition*.
  *   **Why Upstream of Transparency:** Before asking if agents can hide code (transparency), we must establish if they can cooperate when they "speak different logical languages." If the "reasoner" connection breaks under logical heterogeneity, the model fails to capture general rational agency, making the transparency question less urgent.
  *   **Philosopher vs. Logician:** This is technical logic. It requires modifying the underlying proof systems in the PE construction.
  *   **Neglectedness:** Medium. There is work on logical uncertainty (Halpern/Pass), but less on *logical pluralism* as a barrier to equilibrium.
  *   **Success Condition:** A proof that cooperative PE holds (or fails) across a defined class of distinct logical systems. A "robustness theorem" that isolates the minimum logical common ground required for cooperation.
  *   **Assignment:** **Master's Student.** This is bounded, technical, and builds on the PhD student's definition of admissible programs.

  **Third (Months 9–12): Transparency and Verification**
  *   **The Question:** You asked what survives if we drop the assumption that agents can inspect code. Perfect transparency is the "Kingdom of Ends" idealization. The research question is not "what if they can't read code?" (which collapses PE to standard Bayesian games) but "what is the minimum verification required to sustain the normative equilibrium?"
  *   **Why Last:** This is an institutional/implementation question. It matters only if the first two questions establish that there *is* a normative equilibrium worth sustaining. If the equilibrium is not uniquely universalizable (Phase 1) or is logically fragile (Phase 2), relaxing transparency is premature.
  *   **Philosopher vs. Logician:** Mixed. It involves cryptographic commitments or zero-knowledge proofs, but interpreted as epistemic constraints on rational agency.
  *   **Neglectedness:** Low/Medium. There is existing work on obfuscation, but rarely tied to the normative ambition.
  *   **Success Condition:** A characterization of the "epistemic threshold": the minimum information about the opponent's program required to sustain the universalizable equilibrium identified in Phase 1.
  *   **Assignment:** **Joint (PI + Students).** This requires synthesizing the results of the first two phases to test their resilience.

  ### 2. What to Drop (or Deprioritize)

  **Drop: General Existence Proofs for Arbitrary Games.**
  The literature has already established that PE exists for many classes of games. Proving it for another class (e.g., continuous action spaces) adds technical bulk but no philosophical insight. Your hypothesis is that the *value* is normative, not game-theoretic generality. Spend zero time expanding the catalog of games where PE works.

  **Deprioritize: Complete Removal of Transparency.**
  Do not attempt to fully remove the code-reading assumption in this year. If you remove it entirely, you are no longer doing Program Equilibrium; you are doing standard mechanism design or signaling. The philosophical innovation of PE *is* the transparency. The question is how *much* transparency is needed, not whether we can do without it. Keep the idealization as a baseline and perturb it, rather than discarding it.

  **Deprioritize: Computational Complexity Bounds.**
  Unless a complexity bound directly impacts the *rationality* of the agent (e.g., "no rational agent can compute this proof in time"), treat complexity as an engineering constraint. Your interest is in rational choice, not computational feasibility per se.

  ### 3. Evidence for Re-ordering

  You should be prepared to pivot if the following evidence emerges during the year:

  *   **Move Transparency Up:** If Phase 1 (Universalizability) stalls because the "selection problem" proves intractable in the perfect transparency setting, move to Phase 3. It is possible that the *cost* of verification is what selects the equilibrium (e.g., only "simple" moral programs are cheap to verify). If the normative content depends on the *cost* of transparency, Phase 3 becomes upstream.
  *   **Move Logic Down:** If Phase 1 succeeds brilliantly (i.e., you find a compelling formal constraint that uniquely selects Cooperation), Phase 2 becomes less critical. If the normative constraint is strong enough, it might override logical heterogeneity. In that case, focus on fleshing out the ethical implications of the constraint rather than testing logical robustness.
  *   **Abort Normative Ambition:** If Phase 1 demonstrates that *any* universalizability constraint either selects nothing or selects everything (triviality), you must concede that PE is a technical solution concept only. The project should then pivot to a critique: *Why* does this formalism fail to capture Kantian reasoning? (This is still a valuable philosophical result).

  ### 4. Reasoning for the Ordering

  The logic of this ordering is **Modal Strength**.

  1.  **Normative Necessity (Phase 1):** You are asking if the cooperative outcome is *necessary* for a rational moral agent. If it is not necessary (i.e., if Defect-Bot is equally rational/universalizable), the model fails its primary ambition. This is the strongest claim and the most fragile. It must be tested first.
  2.  **Logical Contingency (Phase 2):** You are asking if the result holds across different systems of reason. This is a contingency claim. It is weaker than the normative claim. If the normative claim fails, the logical robustness is irrelevant.
  3.  **Epistemic Idealization (Phase 3):** You are asking how close to the ideal world we must be for the result to hold. This is an approximation claim. It is the weakest link. Approximations of a false theory are still false.

  ### 5. What a Result Looks Like

  *   **For the PhD Student:** A paper titled *"Universalizability as a Constraint on Program Space."* It defines a subset of programs $\Pi' \subset \Pi$ such that only programs in $\Pi'$ are admissible for a "Kantian" agent. It proves that within $\Pi'$, the unique equilibrium is Cooperation.
  *   **For the Master's Student:** A paper titled *"Logical Pluralism in Program Equilibrium."* It shows that if Agent A uses Logic $L_1$ and Agent B uses Logic $L_2$, Cooperation holds iff $L_1$ and $L_2$ share property $X$.
  *   **For the Programme:** A synthesis arguing that Program Equilibrium is not a model of *strategic* interaction, but of *constitutive* interaction. The "source code" is not a strategy, but a public constitution of the agent's will.

  This approach respects your constraint: it uses the formalism to keep the philosophy honest, but directs the formal effort toward the philosophical gap. It treats the technical machinery not as the end, but as the language in which the normative question is finally being asked.
