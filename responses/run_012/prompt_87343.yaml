answer: |-
  **Research Proposal**

  **Title:** Persistence and Predication: A Metaphysical Reading of the *Bai Ma Lun*

  **Research Question**
  Does the *Bai Ma Lun*'s conclusion that "a white horse is not a horse" rest on a semantic distinction between terms (extension or grammatical function) or on a metaphysical distinction between kinds (divergent criteria of identity and persistence)?

  **Background and Problem Statement**
  The standard interpretive consensus regarding the *Bai Ma Lun* treats the dialogue's notorious conclusion as a thesis in the philosophy of language. Existing readings generally fall into two camps: extensionalist accounts, which argue that the extension of "white horse" is a proper subset of "horse" and thus the terms are non-identical; and grammatical accounts, which argue that the dialogue highlights a distinction in Classical Chinese between kind-terms and modified compounds.

  While these readings successfully explain how the terms differ in reference or syntax, they leave the ontological status of the distinction open. By treating the argument as purely semantic, they render the conclusion trivial (sets are distinct from their supersets) or merely linguistic (words are not things). This fails to account for the dialectical force of the dialogue, particularly the interlocutor's resistance. If the claim were merely that the *word* "white horse" is not the *word* "horse," there would be no paradox to resolve. The persistence of the debate suggests the text is making a substantive claim about the objects themselves, not just the labels applied to them. Consequently, existing readings fail to explain why the distinction matters for the *identity* of the thing in question. They describe how we name the difference, but not what the difference *is* in reality.

  **Methodology and Plan of Work**
  This project will argue that the *Bai Ma Lun* is best understood as advancing a metaphysical thesis regarding sortal concepts and persistence conditions. Specifically, I will contend that "horse" functions as a substance-kind term, under which an individual persists through incidental changes (such as a change in color), whereas "white horse" functions as a property-complex, under which an individual cannot survive the loss of the modifying property. On this reading, "a white horse is not a horse" asserts that the criterion of identity for the property-complex is not equivalent to the criterion of identity for the substance-kind.

  To test this hypothesis against the semantic readings, I will focus my exegesis on the "Seeking" (*qiu*) argument within the dialogue. The text distinguishes between "seeking a horse" and "seeking a white horse."
  1.  **Semantic Test:** If the distinction is purely extensional, "seeking a horse" should simply mean selecting from a larger set. I will analyze whether the text treats this selection process as static (picking from a group) or dynamic (identifying an enduring object).
  2.  **Metaphysical Test:** I will examine whether the text implies that an object satisfying "horse" can remain the same object while changing color, whereas an object satisfying "white horse" cannot. Evidence favoring my reading would include textual markers suggesting that the *identity* of the sought object is compromised if the color changes, rather than merely the *description* failing to match.

  To ensure this is not merely a redescription of semantic points in fancier vocabulary, I will demonstrate that the semantic reading cannot account for modal intuitions present in the text. For instance, if "white horse" were merely a narrower extension, a yellow horse would still be a horse that *happens* not to be white. If my metaphysical reading is correct, the text implies a yellow horse is a *different kind of entity* relative to the sortal "white horse" than it is relative to the sortal "horse." I will look for textual evidence regarding "commanding" (*ming*) and "reality" (*shi*) to see if the text binds the name to a specific persistence condition.

  **Expected Outcomes and Criteria for Success**
  A successful project will demonstrate that the metaphysical reading resolves a tension in the dialogue that the semantic reading leaves untouched: specifically, why the interlocutor finds the conclusion counterintuitive despite its logical validity. If the claim is merely about sets, the interlocutor's confusion is inexplicable. If the claim is about identity conditions, the confusion is natural, as it conflicts with ordinary mereological intuition.

  **Failure Conditions:**
  *   **Anachronism:** The project fails if defending the metaphysical reading requires importing post-Fregean or Kripkean essentialism that cannot be textually supported by Warring States terminology. If the distinction between "substance" and "property" cannot be mapped onto the *shi* (reality) and *ming* (name) framework without distortion, the thesis is untenable.
  *   **Textual Insufficiency:** The project fails if the "Seeking" passage can be fully explained by extensional logic without recourse to persistence conditions. If the text treats the change of color as simply moving an object from one set to another without implying a change in the object's ontological status, the semantic reading remains superior.
  *   **Inconclusive:** If the text is equally compatible with both readings, the paper will acknowledge that the metaphysical reading is viable but not uniquely mandated.

  **Scope Assessment**
  This proposal carries a significant risk of scope creep. The *Bai Ma Lun* is dense, and the metaphysics of kinds is a substantial technical field. A 6,000-word limit is tight for a comparative analysis that requires both sinological precision and metaphysical rigor.

  There is a danger that this topic describes a dissertation chapter rather than a term paper. A full defense of the metaphysical reading would require engaging with the broader ontology of the School of Names and comparing it with Mohist Canons to establish a contemporary context for "kind" terms.

  To keep this within the bounds of a one-semester term paper, I will restrict the scope in two ways:
  1.  **Textual Limitation:** I will not attempt to reconstruct the entire metaphysics of the School of Names. I will focus exclusively on the internal argumentation of the *Bai Ma Lun*, specifically the inference from the "Seeking" argument to the conclusion of non-identity.
  2.  **Philosophical Limitation:** I will not defend the truth of the metaphysical claim (i.e., whether kinds *actually* have persistence conditions), but only the interpretive claim that this is what the text *argues*.

  With these constraints, the project is feasible. However, I must remain vigilant against the temptation to solve the entire puzzle of the School of Names. The goal is to establish the plausibility of the metaphysical reading for this specific argument, not to settle the ontology of early Chinese philosophy.
