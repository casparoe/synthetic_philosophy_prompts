          *   Why this leaves the question open: If it's just about words, the conclusion is trivial. If it's about things, it's a substantive claim about reality. The text hints at persistence (the horse seeking food vs. the white horse seeking color?). *Self-Correction:* I need to be careful not to invent textual evidence, but frame the *lack* of focus on persistence in current literature.

