prompt: |-
  I'm a second-year MA student in philosophy, and I need to draft a short research proposal — for a one-semester term paper of about six thousand words — before I commit to the topic. The seminar I'm in spent two sessions on the white horse dialogue and the School of Names, and a classmate and I have been arguing ever since about what the dialogue's notorious conclusion, that a white horse is not a horse, could possibly be doing. The readings we were offered all seem to me to treat the conclusion as a claim about language: either as a point about the extension of the two terms (the white horses form a proper part of the horses, hence the terms are not equivalent) or as a point about the grammar of predication in classical Chinese, about the way a modifier does or does not narrow a kind term. I want to argue that both of these make a metaphysical thesis look semantic, and that the argument is better read as one about the identity conditions of kinds: a substance-kind such as horse is one that a thing can remain in while gaining or losing incidental properties — a horse can turn brown and still be a horse — whereas a property-complex such as white horse is not, since nothing that ceases to be white remains a white horse; so the two do not share a criterion of identity, and the startling conclusion is a claim about kind-identity rather than about the meaning or reference of words.

  Please turn this into a proposal I can hand to my supervisor. I want the research question stated precisely enough that it has a determinate answer, and I want you to say why the existing readings leave the question open — you can refer to the positions and arguments, but don't bother with citations or a bibliography, since I'll supply those myself. Then explain what I would actually do: how I would test the kind-identity reading against the semantic readings, what sort of interpretive evidence would favour one over the other, and why the comparison amounts to more than a redescription of the same texts in fancier vocabulary. Finally, describe what a result would look like, what would count as the project failing rather than merely being inconclusive, and give me an honest assessment of scope — whether this is really a term paper or whether I am quietly describing a dissertation chapter.
