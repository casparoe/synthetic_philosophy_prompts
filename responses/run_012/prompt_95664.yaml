prompt: |-
  I've somehow ended up on the grants committee of a small family foundation — we fund "risky science" — and next week we vote on a proposal to build a quantitative model of historical instability, i.e. the cliodynamics programme: a big cross-society database, indices for things like elite overproduction and fiscal stress, and a headline claim that they can put a rough probability on a country tipping into serious political breakdown about a decade out. They claim a solid retrodiction record, they want to bolt an LLM onto digitised newspapers and parliamentary records to pull the signals out automatically rather than hand-coding everything, and their flagship demo is a backcast for the 2020s that they say they called early. One trustee is completely sold; another reckons it's astrology with error bars. I'm the one who has to write the memo that goes in the file before the vote.

  Draft it for me: a clear recommendation — fund, reject, or fund with conditions and a review date — with reasons the PI could actually push back on, and give the strongest version of the case against my preferred line rather than strawmanning it. What I keep chewing on is whether a system that only ever happens once can be predicted at all, and whether a good retrodiction is even evidence when you got to choose the index after seeing the data. Don't just tell me it's interdisciplinary and promising. British English please.
