  Weighted Sum: $(0.45 \times 0.40) + (0.35 \times 0.40) + (0.70 \times 0.10) + (0.45 \times 0.10) = 0.18 + 0.14 + 0.07 + 0.045 = 0.435$. I discount this slightly to **40%** to account for the high correlation between Q1 and Q2 (if language isn't transformative, cultural selection is likely just environmental), preventing double-counting of positive evidence.

  **Least Sure Sub-Question**
  I am least sure about **Q2 (Cultural Transmission as New Selection)** regarding evidential stability. While my probability is low (35%), the variance on this estimate is highest because memetics lacks the consensus of psycholinguistics (Q1) or comparative psychology (Q3).

  **What Would Move It**
  Demonstration of cultural variants replicating with high fidelity across generations *independent* of individual psychological utility or genetic fitness (true autonomous memes) would move Q2 toward 80%, lifting the bottom-line credence to over 60%.
