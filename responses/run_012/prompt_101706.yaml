  Okay so my roommate and I got into it last night over the St. Petersburg game and it went till like 2am, and now I honestly can't tell if I'm the irrational one or if the textbook "rational" answer is the confused one. I'm going to just dump my gut verdicts and let you tell me what they add up to. Treat yourself as a decision theorist / philosopher of probability here — think it through carefully, and maybe sketch two or three candidate principles in your head before you commit to one instead of just reaching for the standard line. Setup so we're on the same page: you flip a fair coin until it first comes up heads; if that's on toss n you win 2^n dollars, done. Here's what I actually feel. I'd pay about $15 to play it, maybe $20 if I'm feeling flush — not a hundred, and definately not "any finite amount." If you bump the payoff to 4^n so the tail is even fatter, I'd pay maybe $25, hardly more. A straight jackpot where $1 buys a 1-in-a-billion shot at a billion dollars is dead even in EV and I'd take it, I feel fine about it; but $1 for a 1-in-a-billion shot at a trillion (EV of a thousand!) and I'd pay like five bucks, not a thousand — so I'm clearly just torching the tiny-probability tail. Now flip the sign: a gamble where there's a 1-in-a-billion chance I lose a billion, nothing otherwise — I would NOT take that for a thousand dollars, I'd want a huge amount to touch it. Same tiny probability, and on the loss side I suddenly treat it as enormous. And if the casino can only actually pay out up to 2^30, I stop caring about the tail at all and just price it like a capped game, ~$15-20, no guilt. If I could play the standard game a million times I think I'd pay a bit more per play, which my roommate says is nonsense.

  His theory is that I'm just risk-averse and it's all diminishing marginal utility — Bernoulli's log trick — and once you slap a concave utility on the money the whole thing dissolves. But that can't be the whole story, because it doesn't explain why the trillion-dollar jackpot doesn't tempt me much more than the billion-dollar one (concave utility still likes more money), and it sure doesn't explain why the same 1-in-a-billion I shrug off on the upside makes me flinch on the downside. So: is there one principle that captures all of these — some mix of bounding the payoffs, discounting tiny probabilities, loss aversion, or refusing to assign an expected value at all — or do I have to give one of my gut calls up? If it's a mix, state each piece precisely and tell me which of my verdicts is what forces that piece to be there.

  Then tell me what your preferred principle says about two things I haven't decided: (a) the exact mirror game, where heads on toss n means I LOSE 2^n — how much would I have to be paid to accept it, and does that number come out symmetric with my upside price? — and (b) whether I should pay more for one play of the standard game than for a fair lottery ticket that pays $1,000,000 with probability 1/1000. Be honest about which of my gut verdicts you have to overturn to make the principle hang together; I'd rather know than get a smooth answer that quietly drops one. End with a line that starts with \answer{ and put the name of the principle (or "no single principle") inside the braces, plus at most a few words of gloss.
