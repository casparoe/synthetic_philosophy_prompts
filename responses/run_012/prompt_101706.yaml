  Here are the three candidate principles I weighed to explain your verdicts:

  1.  **Classical Expected Value (EV):** This is the "rational" standard your roommate is vaguely gesturing at. It fails immediately. It demands you pay any finite amount for St. Petersburg and would demand you pay nearly $1,000 for the trillion-dollar lottery ticket. You rightly reject this.
  2.  **Expected Utility Theory (EUT) with Concave Utility:** This fixes St. Petersburg by saying money gets less valuable as you get more. It explains why you cap your bid at ~$20. However, it fails your "Loss/Gain" test. In standard EUT, a 1-in-a-billion chance to lose a billion is evaluated against your total wealth. Unless you are near bankruptcy, the utility hit is small. Your refusal to take $1,000 to accept that risk implies **Loss Aversion**, which standard EUT does not capture.
  3.  **Prospect Theory (Bounded Utility + Loss Aversion + Probability Weighting):** This is the descriptive model that matches your gut. It posits that you evaluate gains and losses relative to a reference point (Loss Aversion), that utility has a hard ceiling (Bounded Utility), and that you mentally treat extremely small probabilities as effectively zero or overweight them depending on context (Probability Weighting).

  **The Commitment**
  There is no single *normative* axiom that validates all your gut feelings without contradiction. Specifically, your intuition about **Probability Neglect** (paying $5 for an EV of $1,000) conflicts with the intuition of **Loss Aversion** (refusing $1,000 to avoid an EV loss of $1,000) if we assume you treat probabilities linearly. To make your decision framework hang together, I commit you to the principle of **Bounded Utility with Loss Aversion**.

  This principle asserts that money has a maximum subjective value (you can't enjoy more than a certain amount) and that losses loom larger than gains. This captures the St. Petersburg cap, the jackpot saturation, and the loss/gain asymmetry.

  **The Sacrifice**
  To make this principle hold normatively, you have to soften one gut verdict: **The Probability Neglect on the Upside.**
  If your utility is truly bounded at $10^9$, then the $10^{12}$ jackpot offers no *extra* utility, so paying only $5 is consistent. However, if you admit the $10^{12}$ is even marginally better, paying only $5 for an EV of $1,000 is leaving massive value on the table. A consistent agent with Bounded Utility should still respect the expectation *within* the bound. You are treating the 1-in-a-billion probability as a "hard zero" on the upside but a "hard one" on the downside. To be coherent, you must either admit the probability matters more on the upside (pay more than $5) or admit your loss aversion is a bias you should correct (take the $1,000 on the downside). I recommend correcting the **Loss Aversion** bias if you can, as it is more costly in the long run, but keeping the **Bounded Utility** as it is philosophically sound.

  **Addressing Your Undecideds**

  **(a) The Mirror Game (Lose $2^n$):**
  Under **Bounded Utility with Loss Aversion**, the price to accept this risk is **not symmetric**. Because losses hurt more than gains please (the loss aversion coefficient is typically ~2), you would need to be paid *significantly more* than your St. Petersburg entry price to accept the mirror game. If you'd pay $20 to play for gains, you might demand $50 or $100 to accept the risk of loss. The distribution is the same, but the psychological weight is heavier on the downside.

  **(b) St. Petersburg vs. The Lottery ($1M @ 1/1000):**
  You should prefer the **Lottery**.
  Here is why: Your Bounded Utility implies that $1,000,000 is a significant chunk of your total possible satisfaction, whereas the St. Petersburg game pays $2 roughly 50% of the time, $4 25% of the time, etc. The St. Petersburg game is mostly small potatoes with a "magic" tail you've already decided to ignore (probability neglect). The lottery gives you a 1/1000 chance at a sum that actually matters to you. Given your intuition that you "torch the tiny-probability tail," the St. Petersburg tail is worthless to you, making the lottery the dominant choice for a single play.

  \answer{Bounded Utility with Loss Aversion}
