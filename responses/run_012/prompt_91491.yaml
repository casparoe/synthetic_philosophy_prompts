answer: |-
  **Exam Question**

  **Scenario:**
  A region within a sovereign state is holding an independence referendum. Two disputes over the franchise dominate the negotiations. Internally, pro-independence campaigners demand the electoral roll be frozen at a date three years prior to the vote, excluding recent arrivals (mostly civil servants and economic migrants from the mainland). Unionists argue this strips current residents of equal standing and rigs the demographic outcome. Externally, voters in the rest of the country will face significant material changes regarding debt liability and border controls should independence pass, yet they are granted no vote in the referendum. The eventual compromise is a 'concurrent majority': the proposal carries only if it wins a majority inside the region and also secures a majority in a separate advisory ballot held across the rest of the country.

  **Question:**
  Does this compromise solve the boundary problem, dissolve it, or merely displace it? In your answer, you must assess whether the arrangement is internally coherent given it appears to run two different inclusion criteria simultaneously. Furthermore, take a verdict on the underlying theoretical issue: is the circularity inherent in defining the demos a genuine regress that any theory of democracy must accept, or a false dilemma stemming from a mistaken view of democratic legitimacy?

  ***

  **Model Answer**

  The proposed compromise does not solve the boundary problem; it displaces it while masking the theoretical incoherence inherent in any attempt to democratically define the demos. By requiring a concurrent majority, the arrangement attempts to satisfy two conflicting principles of inclusion without reconciling them. Consequently, the circularity involved is not a false dilemma but a genuine regress that political decision-making must arbitrarily halt.

  Internally, the dispute over the electoral roll highlights the temporal dimension of the boundary problem. Freezing the roll privileges a historical conception of the demos, assuming that the community entitled to self-determination is fixed at a prior moment. This treats the demos as a pre-political entity with an enduring identity. Conversely, granting the vote to all current residents privileges a territorial principle, where presence alone confers standing. The compromise ignores this tension inside the region, effectively accepting the frozen roll (as the primary ballot is regional) but legitimising it through external consent. This fails to address why one temporal cutoff is more democratic than another; it simply assumes the internal boundary is settled enough to be voted upon.

  Externally, the exclusion of the mainland population contradicts the all-affected principle. If democratic legitimacy derives from protecting interests, those facing altered debt burdens and border regimes possess a stake equal to those inside the region. The advisory ballot attempts to remedy this by giving the mainland a veto, but this creates a coherence problem. The internal ballot operates on a principle of self-determination (only the region decides its status), while the external ballot operates on a principle of affectedness (the wider population decides if they are impacted). Running these criteria simultaneously renders the procedure unstable. If affectedness is the true standard, the mainland vote should weigh equally in the primary count. If self-determination is the standard, the mainland should have no say. The concurrent majority tries to have both, satisfying neither principle fully.

  This incoherence points to the deeper theoretical issue. The boundary problem is circular because any procedure to define the demos must itself be authorised by a demos. The compromise attempts to use a democratic vote to settle the boundaries of the vote, which is logically regressive. Some argue this is a false dilemma, suggesting that democratic legitimacy is purely procedural and does not require a prior definition of the people. However, this view collapses when the procedure itself is contested, as seen in the freeze versus residence debate. Legitimacy cannot be purely procedural if the participants in the procedure are disputed.

  Therefore, the circularity is a genuine regress. There is no democratic solution to the boundary problem because democracy presupposes the existence of the boundary it seeks to define. The compromise acknowledges this practically by imposing a political fudge rather than a philosophical solution. It accepts that the boundary must be drawn by power and negotiation, not by principle. The concurrent majority is not a refinement of democratic theory but an admission that the demos is constituted by an act of exclusion that cannot itself be democratic.

  Ultimately, the arrangement displaces the problem rather than solving it. It moves the question from 'who belongs' to 'which combination of votes counts', but it cannot justify why that combination is legitimate without relying on the very boundaries it seeks to establish. Theories of democracy must accept this regress. Legitimacy arises not from solving the circularity, but from the successful political stabilisation of the boundary once the regress is arbitrarily halted. The compromise achieves stability, perhaps, but it does so by sacrificing theoretical coherence. It confirms that the demos is a political construct, not a democratic discovery.

  ***

  **Marking Scheme (20 Marks)**

  **1. Analysis of the Internal Boundary Dispute (4 marks)**
  *   **A (4):** Identifies the tension between the historical/pre-political demos (frozen roll) and the territorial demos (current residents). Explains why the compromise fails to resolve this theoretical conflict.
  *   **B (2-3):** Describes the dispute accurately but treats it as a practical negotiation rather than a theoretical clash about temporal boundaries.
  *   **Typical Error:** Candidates describe the freeze as merely 'rigging' the vote without analysing the conception of community it implies.

  **2. Analysis of the External Exclusion (4 marks)**
  *   **A (4):** Explicitly connects the mainland exclusion to the 'all-affected' principle and explains why the advisory ballot is a partial, inconsistent remedy.
  *   **B (2-3):** Notes that the mainland is affected but fails to link this to a specific principle of inclusion or critiques the advisory status weakly.
  *   **Typical Error:** Candidates argue the mainland *should* vote based on fairness, without referencing the structural principle of affectedness.

  **3. Evaluation of Internal Coherence (4 marks)**
  *   **A (4):** Diagnoses the concurrent majority as running two incompatible criteria (self-determination vs. affectedness) simultaneously, rendering the procedure theoretically unstable.
  *   **B (2-3):** Recognises the compromise is a 'mix' but argues it is a pragmatic solution without addressing the logical contradiction.
  *   **Typical Error:** Candidates praise the compromise as 'balanced' without noticing the conflicting legitimating principles.

  **4. Engagement with Circularity/Regress (4 marks)**
  *   **A (4):** Takes a definitive verdict on whether the circularity is a genuine regress or false dilemma. Justifies this by referencing the necessity of a prior non-democratic decision.
  *   **B (2-3):** Summarises the circularity problem but hedges on the verdict, or claims it is solvable through better procedure.
  *   **Typical Error:** Candidates describe the circularity but refuse to take a side on whether it is a genuine regress.

  **5. Argumentative Verdict and Structure (4 marks)**
  *   **A (4):** Maintains a clear thesis throughout (e.g., 'displaces not solves') that synthesises the case analysis with the theoretical verdict. No citations used.
  *   **B (2-3):** Provides a conclusion but it is disconnected from the earlier analysis, or relies on named theorists rather than argument.
  *   **Typical Error:** Candidates end with a summary of the case rather than a verdict on the theoretical question.

  **Grade Differentiation Note:**
  To secure an **A (16-20)**, a candidate must synthesise the case details with the theoretical abstract; they must treat the scenario as evidence for a claim about democratic theory, not just a problem to be solved. A **B (10-15)** candidate will treat the scenario and the theory as separate tasks, answering the case practically and the theory descriptively. The specific move that separates an A is the willingness to declare the circularity a *genuine regress* that requires an arbitrary halt, rather than attempting to propose a procedural fix for it.
