answer: |-
  This is a profound and recurring problem in the comparative study of Chinese philosophy. Your suspicion is well-founded: the slogans "Nature is Good" (*xing shan*) and "Nature is Bad" (*xing e*) are often treated as static metaphysical claims about human psychology, when in the Warring States context they were primarily soteriological and pedagogical claims about *cultivation*.

  To assist your reading group, I will refrain from offering a single synthesis immediately. Instead, I will lay out a menu of interpretive possibilities for each slogan. For each, I will specify the definition of *xing* (nature), the predicate (good/bad), and the modality (descriptive/normative). I will then evaluate the plausibility of each reading based on the textual evidence and scholarly consensus, before turning to the policy inference.

  ### Part I: Menu of Readings for Mencius ("Human Nature is Good")

  When Mencius claims *xing shan*, he is not necessarily making a claim about universal behavioral regularity. Here are four distinct ways to parse the claim.

  **1. The "Universal Moral Performance" Reading**
  *   **Definition of *Xing*:** Actual, spontaneous behavior in the absence of training.
  *   **Meaning of "Good":** Morally virtuous action.
  *   **Modality:** Descriptive/Predictive.
  *   **Thesis:** Humans, left to themselves, will naturally act benevolently and righteously without effort.
  *   **Evaluation:** **False.** Mencius explicitly acknowledges that people starve, steal, and lose their moral heart due to adverse circumstances (*Mencius* 1A:7, 6A:8). He uses the metaphor of the Ox Mountain: the trees were once lush, but axes and goats stripped them. The claim is not that the mountain *looks* lush now, but that its *capacity* to grow trees is inherent.
  *   **Policy Implication:** If this were true, it would license a laissez-faire approach (no need for welfare or law, just let people be). Mencius rejects this.

  **2. The "Native Sprouts" Reading (Standard Orthodoxy)**
  *   **Definition of *Xing*:** Specific innate psycho-physical capacities (the "four sprouts": compassion, shame, courtesy, right/wrong).
  *   **Meaning of "Good":** Directional potential; the endowment is oriented toward virtue.
  *   **Modality:** Dispositional/Capacitarian.
  *   **Thesis:** Humans possess innate emotional reactions that, if nurtured, develop into full virtue. Nature provides the seed, not the harvest.
  *   **Evaluation:** **Substantive and Defensible.** This aligns with the *gong dou* (child falling into well) argument. It distinguishes humans from beasts not by biology alone, but by these specific moral sensitivities.
  *   **Contestation:** Some scholars argue Mencius thinks these sprouts are *weak* and easily overwhelmed (requiring heavy institutional support), while others argue he thinks they are *robust* (requiring mostly non-interference). I lean toward the former: Mencius advocates for the "well-field system" and schools, implying the sprouts need economic security and education to survive.

  **3. The "Normative Definition" Reading**
  *   **Definition of *Xing*:** The distinctive function or *telos* of the human species (what makes us human).
  *   **Meaning of "Good":** Fulfillment of function.
  *   **Modality:** Normative/Prescriptive.
  *   **Thesis:** To be fully human *is* to be moral. If you are immoral, you have "lost" your nature or failed to realize it. "Nature is good" means "The standard for human nature is goodness."
  *   **Evaluation:** **Substantive and Defensible.** This reads *xing* not as "what is" but "what ought to be developed." It treats *xing* as a task.
  *   **Policy Implication:** This requires institutions that facilitate *becoming* human. It does not imply people are currently good enough to rely on spontaneously.

  **4. The "Desires are Good" Reading**
  *   **Definition of *Xing*:** Biological desires (food, sex, comfort).
  *   **Meaning of "Good":** Morally permissible or positive.
  *   **Modality:** Descriptive.
  *   **Thesis:** Our biological drives are themselves moral guides.
  *   **Evaluation:** **False.** Mencius distinguishes between "nature" (*xing*) and "fate" (*ming*). He admits we have desires but argues the "Superior Man" does not call them "nature" in the moral sense (7A:24). He seeks to *regulate* desires, not follow them blindly.

  ---

  ### Part II: Menu of Readings for Xunzi ("Human Nature is Bad")

  Xunzi's claim is often more radical, but also more frequently misunderstood as a claim about inherent wickedness rather than inherent disorder.

  **1. The "Inherent Wickedness" Reading**
  *   **Definition of *Xing*:** The core essence of the person.
  *   **Meaning of "Bad":** Actively malicious or evil intent.
  *   **Modality:** Descriptive/Ontological.
  *   **Thesis:** Humans are born with an intent to harm others; morality is a suppression of an evil core.
  *   **Evaluation:** **False.** Xunzi explicitly states that anyone on the street can become a Yu (a sage) (16.5). If nature were ontologically evil, transformation would be impossible. He argues nature is *raw*, not *demonic*.

  **2. The "Unchanneled Desires Lead to Chaos" Reading (Standard Orthodoxy)**
  *   **Definition of *Xing*:** Spontaneous drives and emotions (profit-seeking, envy, sensory pleasure).
  *   **Meaning of "Bad":** Destructive of social order (*luan*) if unchecked.
  *   **Modality:** Predictive/Conditional.
  *   **Thesis:** If you follow *xing* without artificial guidance (*wei*), conflict is inevitable. "Bad" refers to the *consequence* of following nature, not the nature itself as a moral agent.
  *   **Evaluation:** **Substantive and Defensible.** This is the core of the "Xing E" chapter. It is a Hobbesian state-of-nature argument without the Hobbesian conclusion of a social contract; instead, it posits sage-kings who imposed ritual from above.
  *   **Contestation:** There is debate over whether Xunzi thinks *all* innate traits are bad, or only the disruptive ones. Some interpreters suggest Xunzi defines *xing* narrowly as "that which cannot be learned," thereby stacking the deck to exclude moral knowledge from nature. I find this plausible: Xunzi defines *xing* to exclude the capacity for morality so that he can credit the Sages and Ritual for it.

  **3. The "Absence of Moral Compass" Reading**
  *   **Definition of *Xing*:** The innate cognitive and emotional endowment.
  *   **Meaning of "Bad":** Lacking moral direction (privative badness, like blindness).
  *   **Modality:** Descriptive.
  *   **Thesis:** Humans are born morally blind. We have the capacity to learn morality, but no innate guide.
  *   **Evaluation:** **Substantive and Defensible.** This contrasts directly with Mencius's "sprouts." For Xunzi, morality is like straightening crooked wood; it requires external force (ritual/teachers).
  *   **Policy Implication:** This justifies strong education and ritual norms. It does *not* necessarily justify punitive law (*fa*) over ritual (*li*), though it justifies authority.

  **4. The "Incompatibility" Reading**
  *   **Definition of *Xing*:** Spontaneous tendencies.
  *   **Meaning of "Bad":** Incompatible with the requirements of civilization.
  *   **Modality:** Functional.
  *   **Thesis:** Nature and Culture are opposed. To be civilized is to overcome nature.
  *   **Evaluation:** **Contested.** Some scholars argue Xunzi sees a continuity between nature and ritual (ritual refines nature); others argue for a sharp break. The text supports the "break" reading more strongly (the metaphor of the potter shaping clay).
  *   **Uncertainty:** It is unclear if Xunzi believes the transformed person *enjoys* morality naturally eventually, or if it remains a conscious effort. If the former, the "badness" is temporary; if the latter, it is permanent.

  ---

  ### Part III: Analysis of the Policy Inference

  Your colleague's argument relies on a specific mapping:
  *   Mencius $\rightarrow$ Spontaneous Solidarity $\rightarrow$ Welfare State (Trust-based).
  *   Xunzi $\rightarrow$ Darker Estimate $\rightarrow$ Incentives/Laws (Control-based).

  Let us test this inference against the menu above.

  **1. Does Mencius license "Spontaneous Solidarity"?**
  *   **Required Reading:** The "Universal Moral Performance" Reading (Mencius I.1).
  *   **Problem:** As established, this reading is textually false. Mencius does not believe solidarity is spontaneous in the sense of being effortless or self-sustaining. He believes the *capacity* for solidarity is innate, but it requires "nourishment" (*yang*).
  *   **Policy Mismatch:** A welfare state based on Mencius would not be one that *relies* on spontaneous care, but one that *creates the economic conditions* (constant livelihood) under which the moral sprouts can survive. Mencius argues that without economic security, people cannot maintain moral constancy (1A:7).
  *   **Verdict:** The colleague's inference is partially correct (Mencius supports welfare) but for the wrong reason. It is not because people are already good, but because they *become* good only when their material needs are met. The "spontaneity" is in the *response* to security, not the pre-existing state of society.

  **2. Does Xunzi license "Incentives and Laws"?**
  *   **Required Reading:** The "Inherent Wickedness" Reading (Xunzi II.1) or a conflation of Xunzi with Legalism (Han Fei).
  *   **Problem:** Xunzi distinguishes sharply between Ritual (*li*) and Law (*fa*). While he accepts law as a backup, his primary mechanism for correcting "bad" nature is *ritualization* and *education*, which transform the emotions, not just check behavior through incentives.
  *   **Policy Mismatch:** "Incentives and manufactured norms" suggests a behaviorist model (carrot and stick). Xunzi advocates for a transformative model (reshaping the heart-mind through practice). A Xunzian state would emphasize rigorous education, hierarchical propriety, and moral exemplars, not merely a legal apparatus of incentives.
  *   **Verdict:** The colleague is likely conflating Xunzi with his student Han Fei. Xunzi's "bad nature" justifies *authority* and *cultivation*, not necessarily a punitive or incentive-based legalism.

  **3. The False Dichotomy of "Spontaneous vs. Manufactured"**
  *   The colleague assumes Mencius = Spontaneous (No effort) and Xunzi = Manufactured (All effort).
  *   **Correction:** Both thinkers agree that moral perfection requires effort.
      *   For Mencius, the effort is *preservative* (protecting the sprouts from being oxed down).
      *   For Xunzi, the effort is *constructive* (building virtue where none existed).
  *   **Policy Consequence:** Both would likely support a robust state role in education and economic organization. The difference is in the *pedagogy* (eliciting inner feelings vs. imposing outer forms), not necessarily in the *scale* of the state.

  ### Part IV: Conclusion and Verdict

  To answer your specific request: **Which readings license the inference, and are they acceptable?**

  1.  **To license the "Mencian Welfare State based on Spontaneity":**
      *   You must adopt **Mencius Reading 1 (Universal Moral Performance)**.
      *   **Status:** This reading is **False** based on the text. Mencius never claims people act good spontaneously without support.
      *   **Alternative:** If you adopt **Mencius Reading 2 (Native Sprouts)**, the policy changes. The state must provide the "rain and sun" (economic security/education) for the sprouts to grow. This supports a welfare state, but not one based on *trust in current spontaneity*, rather on *investment in potential*.

  2.  **To license the "Xunzian Legalism based on Badness":**
      *   You must adopt **Xunzi Reading 1 (Inherent Wickedness)** or conflate Xunzi with Legalism.
      *   **Status:** This reading is **False** (Xunzi denies ontological evil) or **Category Mistake** (Xunzi $\neq$ Han Fei).
      *   **Alternative:** If you adopt **Xunzi Reading 2 (Chaos from Desires)**, the policy changes. The state must provide Ritual and Teachers to transform desires, not just Laws to punish them. This supports a strong normative state, but one focused on moral transformation rather than mere incentive management.

  **Final Assessment for your Reading Group:**
  Your colleague's policy argument rests on a **category error**. He is treating *xing* as a fixed psychological variable (like a gene for altruism) rather than a pedagogical starting point.
  *   He attributes to Mencius a view (effortless goodness) that Mencius explicitly argues *against* (the need to "seek the lost heart").
  *   He attributes to Xunzi a view (need for coercive control) that Xunzi qualifies heavily with the need for *ritual transformation* and the possibility of sagehood.

  **The Uncertainty Flag:**
  I must flag one area of genuine scholarly contention. There is a debate regarding whether Xunzi's *xing* includes the *capacity* to learn ritual. If the capacity to learn is part of *xing*, then *xing* is not wholly "bad," but rather "neutral raw material." If this reading holds, the gap between Mencius and Xunzi narrows significantly: Mencius says the seed is a pine tree; Xunzi says the seed is clay. Both agree you need a gardener/potter. If this narrower gap is accepted, the colleague's sharp policy dichotomy collapses entirely.

  **Recommendation:**
  Do not allow the group to proceed with the slogans. Ask your colleague to specify:
  1.  Does Mencius think we need to *work* to be good? (If yes, spontaneity is out).
  2.  Does Xunzi think we can *love* being good? (If yes, pure coercion/incentive is out).
  3.  Are they designing policy for humans as they *are*, or for humans as they *might become*? (Both philosophers design for the latter).

  The slogans are not just imprecise; they invert the practical implications of the philosophies they claim to represent. Mencius requires material security to *enable* virtue; Xunzi requires ritual authority to *construct* it. Neither justifies a hands-off approach, and neither justifies a purely punitive one.
