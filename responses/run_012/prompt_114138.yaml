answer: |-
  ### Essay Question

  **Question 1 (50 minutes)**

  Consider a research programme, the **Recruitment Programme**, whose hard core asserts that a class of phenomena known as *cascades* are generated by a single mechanism, *recruitment*. Its protective belt carries auxiliary assumptions about thresholds, noise, and boundary conditions. The programme's history includes four episodes:

  1.  **Episode I:** An anomaly arises where cascades lack expected threshold behaviour. The team adds an auxiliary assumption that cascades may be seeded by a hidden trigger. They predict that removing the trigger will suppress cascades. An experiment confirms this.
  2.  **Episode II:** A later anomaly is handled by introducing a free parameter tuned case-by-case to fit the data. No new prediction is issued.
  3.  **Episode III:** A further anomaly is handled by redefining the core term *recruitment* so that the awkward cases no longer count as cascades at all.
  4.  **Episode IV:** The tuned parameter from Episode II is later reinterpreted as a genuine physical quantity, opening a new line of inquiry and yielding a confirmed prediction.

  Write an essay that addresses the following:
  (a) Classify each episode as contributing to a progressive or degenerating problem shift, justifying your classification using Lakatosian criteria.
  (b) Discuss what this sequence implies about the **unit and timing of appraisal**. Can a verdict of "degenerating" be passed on an episode as it occurs, or only in hindsight? Can a research programme be appraised without knowing its future?
  (c) Does the Lakatosian apparatus require the hard core to make contact with prediction at all? What does this imply for evaluating a programme whose core is a normative or interpretive commitment rather than an empirical hypothesis?

  ***

  ### Model Answer

  In Lakatos's Methodology of Scientific Research Programmes (MSRP), scientific change is evaluated not by single falsifications but by the long-term trajectory of problem shifts. Applying this to the Recruitment Programme requires distinguishing between theoretical and empirical progress while acknowledging the historical nature of appraisal.

  **Classification of Episodes**
  Episode I is clearly **progressive**. The auxiliary assumption (hidden trigger) yielded a novel fact (suppression via removal) that was empirically confirmed. This represents both theoretical and empirical progress. Episode II is initially **degenerating**. Introducing a free parameter tuned case-by-case is ad hoc; it saves the phenomena without increasing independent testability. Episode III is also **degenerating**, arguably more severely. Redefining the core term to exclude anomalies violates the spirit of the negative heuristic; it immunizes the hard core by semantic fiat rather than physical explanation. Episode IV, however, retroactively transforms the assessment of Episode II. By reinterpreting the parameter as a genuine quantity and generating confirmed predictions, the programme recovers **progressive** status.

  **Unit and Timing of Appraisal**
  This sequence highlights the central tension in MSRP regarding timing. If we appraise Episode II in isolation, the programme is degenerating. However, Episode IV demonstrates that a temporary degeneration can be a stepping stone to future progress. Therefore, a verdict of "degenerating" cannot be definitively passed on an episode as it occurs; it is provisional. Lakatos insists that appraisal is historical. We judge the rationality of a programme by its long-term heuristic power, not snapshot snapshots. Consequently, a research programme cannot be fully appraised without knowing its future. The unit of appraisal is not the single theory or anomaly, but the *sequence* of theory changes over time. This makes MSRP less a logic of discovery for the working scientist and more a logic of reconstruction for the historian.

  **The Hard Core and Prediction**
  Regarding the hard core, Lakatos explicitly argues it should *not* make direct contact with prediction. The negative heuristic forbids testing the core directly; the protective belt absorbs the refutations. The core functions as a metaphysical commitment that guides the construction of testable auxiliaries. This creates a difficulty for programmes with normative or interpretive cores (e.g., in economics or psychoanalysis). If the core is not an empirical hypothesis but a value judgment or interpretive lens, "empirical progress" becomes ill-defined. A normative core cannot predict novel facts in the same way a causal mechanism can. Thus, while MSRP can describe how such programmes protect their commitments (as in Episode III), it struggles to validate them as "scientific" in the Lakatosian sense, since the criterion of novel factual corroboration may be inapplicable to the core's domain.

  In conclusion, the Recruitment Programme illustrates that degeneration is often a temporary historical phase redeemable by future theoretical work. However, this reliance on hindsight limits MSRP's utility as a real-time demarcation criterion, particularly for non-empirical research traditions.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Classification of Episodes (6 Marks)**
  *   **A Answer (5-6 marks):** Correctly identifies Ep I & IV as progressive and Ep II & III as degenerating. Crucially, notes that Ep IV redeeming Ep II complicates the initial classification of Ep II.
      *   *Common Mistake:* Treating Ep II as permanently degenerating without acknowledging the redemption in Ep IV.
  *   **B Answer (3-4 marks):** Correctly labels episodes based on definitions but treats them as static snapshots (e.g., "Ep II is degenerating" without qualification).
      *   *Common Mistake:* Confusing Ep III (redefinition) with a legitimate protective belt adjustment.
  *   **Weak (0-2 marks):** Incorrect labels or mere recitation of definitions without applying them to the case.

  **2. Unit and Timing of Appraisal (8 Marks)**
  *   **A Answer (7-8 marks):** Explicitly argues that appraisal is historical/hindsight-dependent. Explains that "degenerating" is a provisional verdict that can be overturned by future progress (the Ep II/IV link). Identifies the "sequence" as the unit of appraisal.
      *   *Common Mistake:* Claiming scientists can know immediately if a shift is degenerating (Popperian instant rationality).
  *   **B Answer (4-6 marks):** States that hindsight is important but fails to explain *why* (i.e., misses the specific mechanism of Ep II becoming progressive via Ep IV).
      *   *Common Mistake:* Vague statements about "time" without linking it to the rationality of sticking with a programme.
  *   **Weak (0-3 marks):** Ignores the timing question or claims Lakatos offers a real-time decision rule.

  **3. Hard Core and Prediction/Normative Core (6 Marks)**
  *   **A Answer (5-6 marks):** Correctly states the hard core is protected from direct prediction (negative heuristic). Insightfully notes that normative cores lack the "novel fact" criterion, making MSRP difficult to apply outside empirical sciences.
      *   *Common Mistake:* Arguing the hard core *should* be tested directly.
  *   **B Answer (3-4 marks):** States the hard core is not tested but offers a superficial or confused analysis of the normative implication (e.g., "it just means it's not science").
      *   *Common Mistake:* Failing to distinguish between the core's role and the belt's role.
  *   **Weak (0-2 marks):** Irrelevant or incorrect discussion of the hard core.

  **Differentiation Note:**
  To secure an **A (17-20 marks)**, the student must synthesize Part (a) and Part (b), using the specific trajectory of Episodes II and IV to prove the point about hindsight. A **B (13-16 marks)** student will answer the three parts competently but separately, treating the classification as fixed rather than historically fluid.
