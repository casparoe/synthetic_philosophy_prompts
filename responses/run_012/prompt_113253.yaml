answer: |-
  You are not overthinking it. You have put your finger on a fault line that runs right through the bedrock of moral philosophy and social psychology. It is a genuine problem, and while there isn't a single Greek-derived term that captures the whole phenomenon in one word (like "supervenience" or "qualia"), there are three specific concepts that, when layered together, give you the carving you are looking for.

  Here is the breakdown of the pattern you are seeing, the names philosophers and psychologists give to its parts, and where the line actually sits (if it sits anywhere).

  ### 1. The Psychological Name: Naïve Realism
  The phenomenon you describe—where my convictions feel like perceptions of reality, but yours feel like psychological artifacts—is named in social psychology. It is called **Naïve Realism**.

  This is the conviction that *I* see the world as it is, objectively. Therefore, if you disagree with me, you are not seeing the world; you are seeing through a lens. That lens is labeled "bias," "culture," "emotion," or "upbringing."
  *   **For me:** My reaction is a response to the *object* (the dishonest deal, the degraded animal).
  *   **For you:** Your reaction is a product of your *mind* (your conditioning, your tribe).

  Closely related is the **Bias Blind Spot**: the cognitive bias of recognizing the impact of biases on the judgment of others, while failing to see the impact of biases on one's own judgment.

  This answers your second point: *"When I introspect I can't tell the difference from the inside."* You can't, because Naïve Realism is a phenomenological state. It is how the mind presents its own outputs to itself. It feels like "seeing," not "processing."

  ### 2. The Philosophical Method: Vindicatory vs. Debunking Genealogy
  You mentioned hunting for the "psychological or evolutionary story." In philosophy, this is called **Genealogy**. It is the method of explaining a belief by tracing its history.

  The specific asymmetry you are spotting is the difference between a **Vindicatory Genealogy** and a **Debunking Genealogy**.
  *   **Debunking:** "You believe X *because* you were raised in a patriarchal society." (Implies: X is false/unjustified).
  *   **Vindicating:** "I believe Y *because* I have reasoned through the consequences." (Implies: Y is true/justified).

  The problem you identified is that **the same causal history can be framed either way depending on the conclusion.**
  If the conclusion matches mine, I treat the history as a *justification* (a chain of reasons). If the conclusion clashes with mine, I treat the history as a *cause* (a chain of psychological events).

  Philosophers like Bernard Williams and Edward Craig have written extensively on this. The problem is that there is no neutral test to decide which genealogy is which *before* you judge the belief. You usually decide the belief is wrong first, and *then* categorize the genealogy as debunking.

  ### 3. The Structural Problem: The Archimedean Point
  This is the deepest cut. You asked: *"How you ever separate the reactions that are up for debunking from the ones doing the debunking?"*

  In philosophy, this is known as the search for an **Archimedean Point**. Archimedes said, "Give me a place to stand, and I shall move the earth." In moral epistemology, we are looking for a place to stand *outside* our own conditioning to judge which conditionings are "biases" and which are "values."

  The uncomfortable truth that most meta-ethicists admit (privately, if not publicly) is that **there is no Archimedean Point.**
  *   You cannot step outside your own skin to check if your moral radar is calibrated.
  *   You can only check it against *other* moral intuitions.

  This is why your colleague isn't necessarily being cynical. He is likely engaging in **Coherentism** (or Reflective Equilibrium, which you rightly dismissed as an answer). He is checking his beliefs against his *other* beliefs. But since the whole system is potentially biased, the check is circular.

  So, to answer your question directly: **There is no established single name for the asymmetry itself,** because the asymmetry is the default human setting. However, in meta-ethics, this specific deadlock is often discussed under the header of **The Evolutionary Debunking Argument** and the response to it, known as the **"Companions in Guilt"** argument.
  *   *The Argument:* If you debunk my moral beliefs because they have an evolutionary/psychological origin, you must debunk your own (and mathematical, and logical beliefs) for the same reason.
  *   *The Asymmetry:* People try to claim their beliefs are "trackers of truth" while others' are "trackers of survival," without proving the difference.

  ### The Carving: Where is the line?
  You asked where the line is, and what sits at the edges.

  **The Line:** The line is drawn between **Justification** and **Explanation**.
  *   **Justification (Reasons):** "I oppose this deal because it violates autonomy." (Claims to be about the *object*).
  *   **Explanation (Causes):** "You oppose this deal because you are risk-averse." (Claims to be about the *subject*).

  **The Edge:** The edge is where **Moral Cognitivism** meets **Expressivism**.
  *   **Cognitivism:** Moral statements are truth-apt (like geology). "Slavery is wrong" is a fact like "Granite is hard." If this is true, there *must* be a way to distinguish bias from value, even if we haven't found it yet.
  *   **Expressivism:** Moral statements are not facts; they are glorified preferences. "Slavery is wrong" is like "Boo slavery!" or "I prefer vanilla."

  **To answer your chocolate question:**
  If the Expressivists are right, your moral conviction and your preference for chocolate are in the **same category**. They are both subjective states projected onto the world. The only difference is *intensity* and *social demand*. We shout louder about morality and demand others agree, but the "ontological status" (the rock-ness of the rock) is the same.

  If the Cognitivists are right, they are in **different categories**. One is a perception of a moral fact; the other is a taste. But this returns you to your original problem: *How do you know which is which from the inside?* And the answer remains: You don't.

  ### A Name for Your Use
  Since there is no single canonical term, if you want a label for your notebooks that captures the specific asymmetry you described, I suggest:

  **"Epistemic Asymmetry in Genealogical Scrutiny"**

  Or, more poetically:
  **"The Privilege of the First Person."**

  ### Recommended Reading (For the "Bad and Slow" Reader)
  You don't need dense textbooks. You need people who write clearly about this specific tension.

  1.  **Jonathan Haidt, *The Righteous Mind*:** He is a psychologist, not a philosopher, but he calls this phenomenon **"The Rational Tail wagging the Emotional Dog."** He argues that *all* moral convictions are intuitions first (biases), and reasons are post-hoc lawyers hired to defend them. This validates your suspicion that the "origin story is always available."
  2.  **Sharon Street, "A Darwinian Dilemma for Realist Theories of Value" (Paper):** This is the heavy hitter on the "evolutionary story" problem. She argues that if evolution shaped our values, we have no reason to think they are *true*, only that they were *useful*.
  3.  **Bernard Williams, *Truth and Truthfulness*:** He distinguishes between genealogies that undermine (debunk) and those that support (vindicate). He admits the line is perilous.
  4.  **Thomas Nagel, *The View from Nowhere*:** He explores the impossibility of escaping your own perspective to judge others objectively.

  ### Summary
  You have identified **Naïve Realism** operating within **Moral Genealogy**. The line between "value" and "bias" is not found in the *origin* (both have one) nor in the *feeling* (both feel certain). It is found only in **intersubjective agreement**.

  We call it a "value" when our tribe agrees, and a "bias" when they don't. The work the word "moral" is doing there is not describing a special kind of *fact*, but marking a special kind of *social demand*. It is the difference between "I don't like this" (Chocolate) and "You *must not* do this" (Morality).

  You are not confusing it with something else. You are looking at the machinery of moral judgment without the paint on it. It looks ugly because it is supposed to be hidden.
