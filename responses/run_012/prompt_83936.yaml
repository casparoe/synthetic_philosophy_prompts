answer: |-
  You have identified a genuine gap in the standard terminology. While philosophers and legal theorists have mapped the *territory* of vague words (the "penumbra," the "Sorites series," the "borderline cases"), there is no single, canonical name for the *rhetorical maneuver* you describe: the strategic oscillation between treating the gray band as epistemically difficult (facts exist but are hidden) and ontologically empty (facts do not exist).

  In philosophy of language, this touches on the debate between **Epistemicism** (there is a sharp boundary we cannot know) and **Supervaluationism** or **Nihilism** (there is no sharp boundary). In legal theory, it touches on **Formalism** (the rule provides the answer) versus **Realism** (the judge provides the answer). But these are competing *theories*, not names for the *practice* of switching between them to suit a desired outcome.

  Because there is no established label, I will propose one that fits your carving, and then analyze the phenomenon according to your specific questions.

  ### The Name: The Epistemic-Indeterminacy Slide

  I propose calling this phenomenon **The Epistemic-Indeterminacy Slide** (or simply **The Ontological Slide**).

  ### The Definition

  **The Epistemic-Indeterminacy Slide** is a discursive practice wherein an agent interprets a vague normative predicate (e.g., "vehicle," "drunk," "adult") by shifting its ontological status to align with a desired normative outcome.

  It involves two distinct frames applied to the same borderline case:
  1.  **The Epistemic Frame (for Blame/Constraint):** The agent asserts that the predicate has a determinate truth value that exists independently of our judgment. The ambiguity is treated as a failure of perception or reasoning by the subject. *("The fact was there; you missed it.")*
  2.  **The Indeterminacy Frame (for Excuse/Discretion):** The agent asserts that the predicate lacks a truth value in this instance. The ambiguity is treated as a feature of the rule itself, rendering judgment impossible or discretionary. *("The fact was not there; you couldn't know.")*

  The **Slide** occurs when the same agent (or system) moves between these frames not based on new evidence about the world, but based on the normative pressure of the situation (e.g., the need to punish vs. the need to be merciful).

  ### Is it Inconsistency, Coherence, or Pragmatics?

  You asked whether this slide is simply an inconsistency, a coherent position held on purpose, or ordinary pragmatic behavior.

  **1. It is not merely logical inconsistency.**
  In formal logic, asserting "P is true" and "P has no truth value" is a contradiction. However, in natural language and normative systems, this slide functions as a **stabilizing mechanism**. Vague rules face a dilemma: if they are too rigid, they cause injustice in borderline cases; if they are too flexible, they fail to guide behavior. The Slide allows a system to maintain the *authority* of the rule (by treating it as real when enforcing) while retaining the *flexibility* to avoid absurdity (by treating it as indeterminate when excusing).

  **2. It is a Coherent Pragmatic Position.**
  If held on purpose, this is a form of **Pragmatic Contextualism**. A sophisticated user of rules understands that vague terms are not descriptions of reality but **tools for coordination**.
  *   When coordination requires stopping a behavior (the scooter in the park), the term is treated as a **fact** to maximize compliance.
  *   When coordination requires preserving social harmony or avoiding harshness, the term is treated as **indeterminate** to maximize discretion.
  Viewed this way, the Slide is not a bug; it is a feature of how human language manages the tension between **certainty** and **fairness**.

  **3. It is Ordinary Pragmatic Behavior.**
  Most people do this unreflectively. It is part of the "grammar" of arguing about rules. Just as we slide between literal and metaphorical meanings without noticing (e.g., "The bank is steep" vs. "The bank is closed"), we slide between epistemic and indeterminate readings of vague norms. It only looks like a contradiction when written down and analyzed formally.

  ### Addressing the Edges

  You asked about specific boundary conditions for this definition.

  **1. Two different people vs. One person.**
  *   **Does it count?** Yes. The phenomenon is systemic. In a legal system, the Prosecutor often employs the Epistemic Frame ("The law is clear, he broke it") while the Defense employs the Indeterminacy Frame ("The law doesn't cover this").
  *   **The Distinction:** When one person does it, it is **Internal Sliding**. When two people do it, it is **Adversarial Polarization**. Both rely on the same underlying affordance of vague language: that the "gray band" supports both interpretations simultaneously. The *phenomenon* is the availability of both frames; the *actor* is secondary.

  **2. Genuine change of mind vs. Convenience.**
  *   **Does it count?** This is the crucial edge. If a guard switches because they genuinely learned new information (e.g., "I just found out the city defined scooters as vehicles yesterday"), that is **Epistemic Updating**, not The Slide.
  *   **The Test:** The Slide is defined by the *lack of new factual information*. The physical object (the scooter) and the text (the rule) remain constant. The only variable that changes is the **normative stakes** (do we want to punish or not?).
  *   **Hypocrisy vs. The Slide:**
      *   **Hypocrisy** implies a moral failing: claiming a standard for others that one exempts oneself from.
      *   **The Slide** is structural: it is the exploitation of the dual-nature of vague terms.
      *   If the person believes *both* statements are true in their respective contexts ("He should have known" AND "There is no right answer"), they are not lying. They are expressing the **dual aspect of normative vagueness**. It only becomes hypocrisy if they claim to be a strict Epistemicist in theory but act as an Indeterminist in practice *while denying the switch*.

  ### Summary of the Carving

  To separate this from the two philosophical positions you mentioned:
  *   **Epistemicism** claims the fact *always* exists.
  *   **Indeterminacy** claims the fact *never* exists in the gray band.
  *   **The Epistemic-Indeterminacy Slide** claims the status of the fact is **functionally dependent on the normative goal**.

  This is not a metaphysical claim about the world; it is a sociological claim about how we use words to manage power and responsibility.

  ### Conclusion

  There is no established single word for this in the philosophical canon, though it is the working engine of **Legal Realism** and **Critical Legal Studies**. Those movements argue that law is indeterminate but *pretends* to be determinate to enforce power. You have isolated the micro-mechanism of that pretension.

  I recommend using **The Epistemic-Indeterminacy Slide**. It captures the movement (Slide), the two positions involved (Epistemic vs. Indeterminacy), and implies that the shift is fluid rather than fixed. It is not a logical error, but a **pragmatic technology** for managing the inevitable fuzziness of rules in a sharp-edged world.
