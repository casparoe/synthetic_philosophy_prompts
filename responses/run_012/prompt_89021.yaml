      *   Berkeley is indeed an idealist (*Principles*, *Three Dialogues*), but his economics (*The Querist*, *Maxims Concerning Patriotism*) is often seen as pragmatic or mercantilist-adjacent, though with unique twists.
      *   *Key Insight:* Berkeley's idealism doesn't necessarily dictate his economics in a direct causal way, but his *instrumentalism* about signs (language, money) connects them. Money is a sign, just like words.
      *   *The User's specific worry:* (2) vs (4). If money is just a ticket, how can a lack of tickets cause poverty? This is the classic "veil of money" vs. "money matters" debate.
