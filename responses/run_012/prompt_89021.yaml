          *   *Resolution:* Berkeley distinguishes between *specie* (coin) and *credit* (paper). He thinks specie is a useful ticket because people trust it, but paper works too if backed by land/industry. The "drain" matters because it removes the *medium of exchange* that facilitates the *labor*. Without the ticket, the labor isn't recorded or incentivized.
