      *   *Innovation:* Non-domination = Answerability (discursive control), not Control (veto/deposition).
      *   *Defense:* Freedom is a Status (binary: you have it or you don't), not a Level (scalar: more or less). This blocks "But what if he *might* hurt you?" objections.
      *   *Controversy:* You can be free even if you can't fire the boss/ruler, as long as they have to explain themselves.

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic 1: The Benevolent Master (Status vs. Probability).*
