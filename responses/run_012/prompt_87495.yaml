          *   *Likely Answer:* Public power is constituted by the people; private power is not. Answerability institutionalizes the track.
          *   *Follow-up:* But if the 'people' cannot dissolve the institution, isn't the institution the master?

      *   *Topic 4: Answerability without Removal.*
