  Your friend is operating with a **contrastive theory of causation** (why *this* outcome rather than *that* one?), but she's layering a specific filter on top of it to determine which sufficient condition gets the title of "Trigger."

  Based on her five verdicts, here are the two rules that fit her logic equally well, followed by my prediction, my bet, and a test case.

  ### The Two Candidate Rules

  **1. The Agency Rule (The "Blame" Filter)**
  *   **The Logic:** A factor can only be a "Trigger" if it involves human agency or decision-making. Natural forces, no matter how destructive, are always "Backdrop" because they cannot be held responsible.
  *   **Fits Verdicts 1–4:** In every case, the Trigger is a human act (Betrayal, Bank Decision, Policy, General's Order) and the Backdrop is natural/environmental (Fever, Harvest, Drought, Winter).
  *   **Fits Verdict 5:** Both factions are human agents, so both pass the filter and are named.

  **2. The Deviation Rule (The "Contrast" Filter)**
  *   **The Logic:** A factor can only be a "Trigger" if it represents a statistical deviation from the baseline or norm. Routine, recurring, or expected events are "Backdrop," even if they are sufficient to cause the outcome. The Trigger must explain why the event happened *now* rather than *before*.
  *   **Fits Verdicts 1–4:** In every case, the Trigger is unprecedented or rare (Betrayal, Unprecedented call, Brand new policy, Nobody had done before) and the Backdrop is routine (Every summer, Most years, Region gets most years, Ordinary winter).
  *   **Fits Verdict 5:** Both factions moving is a deviation from the baseline of stability, so both pass.

  ### The Empire Case Prediction

  Here is where the rules diverge.

  *   **The Agency Rule predicts:** The **Governor's Order** is the Trigger. The Earthquake is Backdrop.
      *   *Reasoning:* The Governor is a human agent; the earthquake is not. You can blame a bureaucrat on autopilot (negligence); you cannot blame geology.
  *   **The Deviation Rule predicts:** The **Earthquake** is the Trigger. The Governor's Order is Backdrop.
      *   *Reasoning:* The earthquake is a "once-in-a-millennium" shock (Deviation). The order is signed "every single harvest" (Routine). If the order was signed last year and the empire stood, the order doesn't explain the contrast of why it fell *this* year. The earthquake does.

  ### My Bet

  I would put money on **The Agency Rule**. She will name the **Governor's Order** as the Trigger.

  **Why?**
  Two reasons. First, the specific phrase "doling out causal **blame**." You do not blame earthquakes. You blame governors. Even if the governor was on "autopilot," a historian's job is to explain human systems, not natural shocks. To name the earthquake is to surrender to geographical determinism, which historians of institutions typically fight against.

  Second, look at her "Swing Test" exception in the Coup case. She names *both* factions. If the Deviation Rule were primary, she might have looked for which faction's move was *more* unprecedented. Instead, she named both because they were *equally* agentic. The "Human" threshold seems to be the primary gatekeeper; "Deviation" is likely just a secondary feature of the human acts she usually studies.

  ### The Discriminator Case

  To be absolutely sure which rule she's using, you need a case that isolates **Human/Routine** vs. **Natural/Rare** without the high stakes of "Empire" or "Famine." Ask her this:

  **The Case of the Sleeping Sentry**
  A fortress is captured.
  *   **Factor A:** The night sentry falls asleep at his post. This happens occasionally in this army; it's a known, routine risk (Human, Routine).
  *   **Factor B:** A lightning strike ignites the powder magazine. This is a once-in-a-lifetime event (Natural, Rare).
  *   **Condition:** Either one alone was sufficient to lose the fortress.

  **How it separates the rules:**
  *   If she says the **Sentry** caused the loss: It's the **Agency Rule**. (Human action trumps natural rarity).
  *   If she says the **Lightning** caused the loss: It's the **Deviation Rule**. (Statistical outlier trumps human routine).

  If she hesitates here, watch which word she uses. If she talks about "responsibility," she's an Agency historian. If she talks about "why then and not before," she's a Deviation historian.
