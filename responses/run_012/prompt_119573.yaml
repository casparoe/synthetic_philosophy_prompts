answer: |-
  # Screening Procedure for Cognitive Penetration Claims

  **Purpose:** To determine whether a manuscript provides evidence sufficient to claim that a cognitive state alters perceptual experience (penetration), as opposed to altering report, decision criteria, or attentional selection.
  **Time Allocation:** 30 Minutes.
  **Operators:** Editorial Assistant (EA) executes Mechanical Steps; Editor executes Judgment Steps.
  **Output Verdicts:** *Candidate Penetration*, *Post-Perceptual Effect*, *Design Cannot Distinguish*, *Not a Perceptual Claim At All*.

  ---

  ## Part I: The Procedure

  ### Step 1: Claim Verification (Mechanical)
  **Operator:** EA
  **Question:** Does the Abstract or Introduction explicitly claim that a cognitive variable (belief, desire, category, stereotype) altered the *perceptual experience* or *appearance* of the stimulus?
  **Search Terms:** "Saw," "Appeared," "Perceived," "Experience," "Phenomenology." (Ignore "Detected," "Identified," "Reported," "Classified" unless linked to appearance).
  **Sufficient Answer:**
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Verdict: *Not a Perceptual Claim At All*.
  **Rationale:** Many papers claim cognitive effects on *judgment* but frame it as perception in the title. If the text does not claim perceptual change, it does not belong in this category.

  ### Step 2: Stimulus Equivalence (Mechanical)
  **Operator:** EA
  **Question:** Is the physical stimulus identical across the critical comparison conditions?
  **Check:** Compare Method section descriptions of Condition A (e.g., Hungry) and Condition B (e.g., Sated).
  **Sufficient Answer:**
  *   **Yes (Identical):** Proceed to Step 3.
  *   **No (Different):** **STOP.** Verdict: *Design Cannot Distinguish*. (If the stimulus changes, you cannot claim the *same* world was seen differently).
  **Rationale:** The strong claim requires the same stimulus to be experienced differently.

  ### Step 3: Measure Sensitivity to Bias (Judgment)
  **Operator:** Editor (EA compiles data)
  **Question:** Does the dependent measure dissociate perceptual sensitivity from response criterion?
  **EA Data Collection:** Identify the measure (e.g., Rating Scale, Binary Yes/No, 2AFC, Physiological, Continuous Tracking). Note if Signal Detection Theory (SDT) metrics ($d'$ vs. $c$) are reported.
  **Editor Decision:**
  *   **Pass:** Measure is criterion-free (e.g., 2AFC, physiological, continuous adjustment) OR SDT analysis shows sensitivity ($d'$) changes while criterion ($c$) remains stable.
  *   **Fail:** Measure is criterion-vulnerable (e.g., Likert rating, Binary Yes/No) AND no SDT controls are present.
  **Stop Condition:** If **Fail**, **STOP.** Verdict: *Post-Perceptual Effect*.
  **Rationale:** A shift in willingness to say "I see it" is not a shift in seeing it. Without controlling for criterion, report shifts are indistinguishable from perceptual shifts.

  ### Step 4: Attention and Selection Control (Judgment)
  **Operator:** Editor (EA compiles data)
  **Question:** Can the effect be explained by where/when the subject looked or attended, rather than how the stimulus looked?
  **EA Data Collection:** Note viewing conditions (Unlimited vs. Brief), Eye-tracking usage (Yes/No), and Task (Detection vs. Discrimination vs. Appearance Match).
  **Editor Decision:**
  *   **Pass:** Eye movements controlled/fixed OR task requires discrimination of content (e.g., orientation, color) rather than mere detection/access.
  *   **Fail:** Unlimited viewing with no eye-tracking OR task is purely detection/threshold (e.g., "when does it break through?").
  **Stop Condition:** If **Fail**, **STOP.** Verdict: *Design Cannot Distinguish*. (Cannot separate attentional selection from perceptual content).
  **Rationale:** Top-down effects on *attention* are not effects on *perception*. If the cognitive state merely directs the "spotlight," the percept itself is unchanged.

  ### Step 5: Source of Modulation (Mechanical)
  **Operator:** EA
  **Question:** Is the cognitive state a "Standing State" of the subject or an "Experimenter Cue"?
  **Check:**
  *   **Standing State:** Hunger, Expertise, Long-term Belief, Chronic Stereotype, Emotion.
  *   **Experimenter Cue:** Recent Prime, Instruction, Temporary Label, Contextual Hint provided in trial.
  **Sufficient Answer:**
  *   **Standing State:** Flag as *Strong Candidate*.
  *   **Experimenter Cue:** Flag as *Weak Candidate*.
  **Rationale:** Effects driven by the subject's own states are theoretically more significant than effects driven by transient experimental cues.

  ---

  ## Part II: Verdict Logic

  Combine the outputs from Steps 1–5 to assign the final verdict.

  1.  **Step 1 = No:** $\rightarrow$ *Not a Perceptual Claim At All*.
  2.  **Step 1 = Yes** AND **Step 2 = No:** $\rightarrow$ *Design Cannot Distinguish*.
  3.  **Step 1 = Yes** AND **Step 2 = Yes** AND **Step 3 = Fail:** $\rightarrow$ *Post-Perceptual Effect*.
  4.  **Step 1 = Yes** AND **Step 2 = Yes** AND **Step 3 = Pass** AND **Step 4 = Fail:** $\rightarrow$ *Design Cannot Distinguish*.
  5.  **Step 1–4 = Pass** AND **Step 5 = Standing State:** $\rightarrow$ *Candidate Penetration*.
  6.  **Step 1–4 = Pass** AND **Step 5 = Experimenter Cue:** $\rightarrow$ *Candidate Penetration* (Note: Requires stronger justification in discussion regarding cue vs. state).

  ---

  ## Part III: Application to Submissions

  ### Submission 1: Hunger and Food Size
  *   **Claim:** Hungry subjects rate food as larger/saturated. (Step 1: **Pass**)
  *   **Stimulus:** Same photographs used for both groups. (Step 2: **Pass**)
  *   **Measure:** Rating scale (size/saturation). No SDT analysis. (Step 3: **Fail**).
      *   *Editor Note:* Rating scales are vulnerable to criterion shifts. A hungry subject may be more willing to endorse "large" without the percept actually changing.
  *   **Verdict:** **Post-Perceptual Effect**.
  *   **Reasoning for Letter:** "While the stimulus was controlled, the reliance on subjective rating scales without signal detection controls prevents the dissociation of perceptual sensitivity from response criterion. The data license a claim about judgment or reporting bias, not perceptual experience."

  ### Submission 2: Crime Report and Gun Detection
  *   **Claim:** Subjects report seeing a gun in ambiguous hand images after reading crime report. (Step 1: **Pass**)
  *   **Stimulus:** Same ambiguous images. (Step 2: **Pass**)
  *   **Measure:** Binary Report (Gun/No Gun). No SDT analysis. (Step 3: **Fail**).
      *   *Editor Note:* Binary reports in ambiguous stimuli are the classic confound of criterion shift. Expectation lowers the threshold for saying "Gun," not necessarily changing the visual appearance.
  *   **Verdict:** **Post-Perceptual Effect**. (Note: Could be *Design Cannot Distinguish*, but since the measure is purely report-based with no sensitivity metric, *Post-Perceptual* is the stronger rejection).
  *   **Reasoning for Letter:** "The design does not distinguish between a change in perceptual content and a change in decision criterion. In ambiguous stimulus tasks, expectation typically shifts the response criterion ($c$) rather than sensitivity ($d'$). Without SDT metrics, a perceptual claim is unsupported."

  ### Submission 3: Primed Category and Rivalry Breakthrough
  *   **Claim:** Primed object breaks through suppression sooner. (Step 1: **Pass**)
  *   **Stimulus:** Same suppressed stimulus. (Step 2: **Pass**)
  *   **Measure:** Breakthrough time (Continuous). (Step 3: **Pass**).
      *   *Editor Note:* Time-to-detection is less vulnerable to simple criterion bias than a rating scale.
  *   **Attention/Selection:** Task is detection/access ("when does it appear?"). No eye-tracking (though rivalry minimizes this). (Step 4: **Fail**).
      *   *Editor Note:* Breakthrough in rivalry is widely debated as an effect of attentional selection or perceptual *access*, not necessarily a change in the *content* or *character* of the percept itself. The prompt distinctions require an effect on the perceptual state's content.
  *   **Source:** Experimenter Prime. (Step 5: **Weak**).
  *   **Verdict:** **Design Cannot Distinguish**.
  *   **Reasoning for Letter:** "While the result is robust, breakthrough time in rivalry paradigms confounds perceptual content with attentional selection and perceptual access. The procedure requires evidence that the *content* of the experience changed, not merely the latency of awareness or the success of selection. Additionally, the effect is driven by transient priming rather than a standing cognitive state."

  ---

  ## Part IV: Limitations and Flattening

  ### What the Procedure Cannot Do
  1.  **Prove Phenomenology:** No behavioral procedure can definitively prove a change in subjective experience. This procedure only filters out designs where a non-perceptual explanation is *more parsimonious*. It cannot rule out skeptical hypotheses (e.g., that all "perception" is judgment).
  2.  **Settle Theoretical Debates:** It cannot resolve the philosophical dispute between "early" and "late" selection. It treats "attention" as a confound, whereas some theories posit attention as constitutive of perception.
  3.  **Guarantee Replicability:** A methodologically sound paper can still be a false positive. This screens for internal validity claims, not truth.

  ### Distinctions Flattened for Usability
  1.  **Standing State vs. Experimenter Cue:**
      *   *Flattening:* The procedure treats this as a binary (Step 5). In reality, a repeated prime over many blocks may function like a temporary standing state, and a standing state (e.g., hunger) can be experimentally induced.
      *   *Loss:* We lose the ability to credit studies that use robust, long-duration inductions that fall short of "chronic" states. They are downgraded to "Weak Candidate."
  2.  **Attention vs. Perception:**
      *   *Flattening:* Step 4 treats attentional selection as a confound to be controlled. In many modern frameworks, attention is the mechanism *by* which cognition penetrates perception.
      *   *Loss:* We risk rejecting valid mechanism papers. By demanding "content" changes separate from "selection," we may exclude papers showing *how* penetration occurs (via attention) in favor of papers showing *that* it occurs (which are rarer and often methodologically weaker).
  3.  **Measure Sensitivity:**
      *   *Flattening:* Step 3 categorizes measures as "Vulnerable" or "Criterion-Free." In practice, even 2AFC tasks can have criterion components, and physiological measures (like pupil dilation) have their own interpretive ambiguities.
      *   *Loss:* Nuance regarding the degree of confidence in the measure. The procedure forces a Pass/Fail which may feel arbitrary to authors using novel, hybrid measures.

  ### Summary of Loss
  By making the procedure runnable by an EA in 30 minutes, we sacrifice **theoretical flexibility** for **administrative defensibility**. The procedure prioritizes the "Strong Version" of penetration (same stimulus, different content, standing state) as the only *Candidate*. This protects the journal from publishing confounds, but it may systematically bias against publishing innovative work that challenges the very distinctions (e.g., attention vs. perception) the procedure relies upon. You will publish fewer papers, but the ones you publish will be harder for skeptics to dismantle on methodological grounds.
