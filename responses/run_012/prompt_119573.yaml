          *   Stimulus: Ambiguous hand (Same physical stimulus).
          *   Measure: Binary report (Yes/No). High vulnerability to criterion shift.
          *   Confounds: Brief flash (good for perception), but no catch trials/SDT to separate $d'$ from $c$.
          *   Source: Prime (Crime report).
          *   *Likely Verdict:* Design Cannot Distinguish (cannot separate bias from sensitivity).
      *   *Case 3 (Rivalry/Priming):*
