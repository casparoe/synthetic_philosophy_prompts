  5.  **Meta-Analysis (Limitations & Flattening):**
      *   *What it can't do:* It can't prove phenomenology. It can't settle the philosophy of perception.
      *   *Flattening:* The distinction between "Standing State" and "Prime" is binary in the procedure but continuous in reality. The distinction between "Attention" and "Perception" is notoriously muddy (early vs. late selection).
