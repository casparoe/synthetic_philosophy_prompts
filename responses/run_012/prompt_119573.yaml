      *   *Verdict Mapping:*
          *   Fail Claim Check $\rightarrow$ Not a Perceptual Claim.
          *   Fail Stimulus Identity $\rightarrow$ Design Cannot Distinguish (or Post-perceptual, depending on interpretation. If stimuli differ, it's not "same stimulus experienced differently"). Let's say "Design Cannot Distinguish" if confounds exist.
          *   Fail Measure Independence $\rightarrow$ Post-perceptual Effect (likely response bias).
          *   Pass all + Standing State $\rightarrow$ Candidate Penetration.
          *   Pass all + Prime Only $\rightarrow$ Candidate Penetration (but flagged as weak/indirect).

      *   *Refining for the Prompt's Specific Distinctions:*
          *   The prompt emphasizes: "An effect on what subjects report is not yet an effect on what they see."
          *   "Effect counts as penetration only when the cognitive state is doing the causal work, not when the experimenter's setup is doing it."
          *   "Strong version... requires the same stimulus to be experienced differently."
          *   "Effect driven by subject's own standing states is more interesting than one driven by a cue."

      *   *Revised Procedure Structure:*
          *   **Step 1 (Mechanical):** Claim Verification.
          *   **Step 2 (Mechanical):** Stimulus Equivalence.
          *   **Step 3 (Judgment):** Measure Sensitivity to Bias.
          *   **Step 4 (Judgment):** Control of Non-Perceptual Confounds (Eye movements, memory).
          *   **Step 5 (Mechanical):** Modulator Source.
          *   **Verdict Logic:** Combine outputs.

