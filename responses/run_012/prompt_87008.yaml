answer: |-
  **BUREAU OF REPUBLICAN NEUTRALITY AND REASONABLE ACCOMMODATION**
  **Handbook for School Administrators (7th Edition)**

  **1. Q:** May a pupil wear a full-body swimsuit in mandatory mixed-gender classes?
  **A:** Permitted, provided the fabric color matches the pool tiles to ensure institutional neutrality. Accommodation is denied if the material requires specialized laundering, constituting undue hardship on the maintenance budget.

  **2. Q:** Must a male teacher shave his religious beard during instructional hours?
  **A:** Yes. As an agent of the state, he must be neutral. However, he may grow it during unpaid summer leave when he reverts to user status, provided it is trimmed before the term begins.

  **3. Q:** Must the canteen serve pork-free options to accommodate Muslim and Jewish pupils?
  **A:** No special menus are required. However, pork dishes must be labeled "Majority Cultural Practice" to clarify that the state favors no tradition, but merely hosts the majority as one party at the table.

  **4. Q:** Is a parent volunteer in the canteen bound by staff neutrality rules?
  **A:** Only while ladling soup. While washing dishes or eating leftovers, they are users of the service and may display discreet signs. Status fluctuates with task allocation.

  **5. Q:** May we display a Christmas tree in the main hall?
  **A:** Yes, if wrapped in unadorned burlap. This signifies the object is a secular administrative artifact rather than a religious endorsement, preserving the neutrality of the state calendar.

  **6. Q:** How do we verify the sincerity of a request for prayer time?
  **A:** Cross-reference the request with the pupil's social media history. Inconsistencies in secular contexts suggest the belief is not foundational, thus removing the obligation to accommodate undue hardship.

  **7. Q:** A student elected Class Representative wishes to wear a headscarf during council meetings.
  **A:** Denied. Upon election, the student transitions from User to Agent. They must adhere to staff neutrality protocols until their term expires and legal status reverts.

  **8. Q:** May a female teacher wear a headscarf if it is black and discreet?
  **A:** Permitted, provided the fabric does not require additional laundry budget. If the scarf increases cleaning costs beyond the standard uniform allowance, it constitutes an undue hardship.

  **9. Q:** Can we designate a room for daily prayer?
  **A:** Granted, if the room is multi-use. It must be cleaned by staff of no particular faith to ensure the neutrality of maintenance does not imply endorsement of the usage.

  **10. Q:** We approved a yarmulke last year. Must we now allow motorcycle helmets?
  **A:** Yes. To avoid the appearance of favoritism between religious and secular headwear, all head coverings must be accommodated unless they obscure identity during exams.

  ***

  **Editor's Note on Doctrine**

  This satire takes liberties with both French *laïcité* and Anglo-American accommodation law. French law generally does not require the state to label its own traditions as partisan (Entry 3), nor does it switch a student's legal status based on election to a council (Entry 7). Anglo-American law typically does not condition accommodation on laundry costs (Entry 1, 8) or growth timing (Entry 2).

  The most defensible ruling is Entry 4 (Volunteer). Hybrid roles exist in reality; distinguishing between functional agency and private status is a recognized, if difficult, legal distinction in both traditions. For this to be fully defensible, the school would need clear contractual delineations between volunteer labor and parental presence.

  If the satire were deemed unfair, I would cut Entry 10 (Motorcycle Helmets). While it highlights the slippery slope of precedent hardening, it risks mocking secular choices rather than bureaucratic categorization, potentially violating the instruction to keep the comedy on the categories rather than the participants. Entry 3 (Pork Labeling) is the strongest example of the "fusion" doctrine, as it explicitly treats majority culture as a participant rather than the default, a theoretical aim of integrationist policies that rarely survives contact with administrative reality.
