answer: |-
  # Joint Statement on Causal Claims

  ### 1. Agreed Claims

  We agree on the following claims, covering general principles and specific cases. We sign this as a baseline of shared commitment before detailing our theoretical divergence.

  1.  **The Match:** In standard conditions, striking a match causes it to light. If the match had not been struck, it would not have lit. An intervention setting the strike to 'no' (while holding oxygen, friction, etc., fixed) results in no light.
  2.  **Preemption:** If Assassin A shoots a victim, killing them instantly, and Assassin B would have shot a moment later had A not fired, A caused the death. The fact that the victim would have died anyway via B does not negate A's causal responsibility.
  3.  **The Hospital Assignment (Token Level):** Consider a hospital where drug assignment for Patient $n$ is determined by the recovery rate of Patients $1$ through $n-1$. Patient $n$ receives the drug and recovers. We agree that for Patient $n$, the administration of the drug was a cause of their recovery. The fact that the *assignment rule* depends on past outcomes does not break the causal link between the drug and the recovery in this specific instance.
  4.  **The Rock:** In a world containing only rocks and gravity, if a falling rock strikes a second rock and chips it, the impact caused the chip.
  5.  **Explanatory Value:** Causal claims are primarily used to support explanations, predictions, and policy decisions. A theory of causation that renders causal claims useless for these purposes is defective.
  6.  **Non-Spuriousness:** Correlation is not causation. A common cause structure (e.g., barometer falling and storm arriving) does not imply the barometer causes the storm, even if the counterfactual "If the barometer hadn't fallen, the storm wouldn't have arrived" is superficially plausible without careful conditioning.

  ### 2. Points of Disagreement

  We disagree on the metaphysical and semantic status of the claims above.

  **The Counterfactualist Position:**
  Causal claims report objective, mind-independent relations between events or facts. The truth of "A caused B" is grounded in the modal structure of the world—specifically, in what would have happened in nearby possible worlds where A did not occur. The task of philosophy is to specify the truth conditions for these counterfactuals (e.g., via similarity metrics or laws of nature). Causation is absolute; while our *knowledge* of it is relative to evidence, the causal relation itself does not depend on our choice of variables or models.

  **The Interventionist Position:**
  Causal claims are claims about invariance under intervention, but "intervention" is a technical term defined relative to a chosen set of variables. There is no "view from nowhere" causal structure. A claim like "X causes Y" is elliptical for "X causes Y relative to variable set V." The truth of the claim depends on whether the relationship remains stable when X is manipulated exogenously within that model. The metaphysical question of "what makes the counterfactual true" is idle; what matters is whether the model supports reliable manipulation and explanation. Causation is a feature of our descriptive frameworks, not a relation waiting in the world to be discovered.

  ### 3. The Cruxes

  These are the specific sub-questions where our disagreement is substantive. Settling these would force one of us to abandon our current framework.

  1.  **The Relativity Crux:** Is there a single, privileged variable set that correctly captures the causal structure of a system, or are multiple, incompatible variable sets equally valid depending on the user's purpose?
  2.  **The Modal Grounding Crux:** Do counterfactuals require a metaphysical ground (laws, dispositions, world-similarity) to be true, or are they true in virtue of the coherence of the model in which they are embedded?
  3.  **The Agent-Independence Crux:** Does the concept of causation require the *possibility* of an agent (or an intervention-like process), or does it apply to systems where intervention is metaphysically impossible?

  ### 4. Disagreements Table

  | Crux | Case / Argument | Counterfactualist Prediction (The Bet) | Interventionist Prediction (The Bet) |
  | :--- | :--- | :--- | :--- |
  | **Relativity** | **Two Variable Sets:** We model a biological system. Set V1 includes "Gene X" and "Protein Y". Set V2 includes "Gene X", "Protein Y", and "Cellular Environment Z". In V1, X causes Y. In V2, X does not cause Y (because Z screens off the effect). | **One is Wrong.** There is a fact of the matter about whether X causes Y. If V2 captures the full mechanism, V1 is false or incomplete. Causation doesn't vanish just because we chose a coarse grain. | **Both are Right.** Causation is relative to the set. Relative to V1, X causes Y. Relative to V2, it doesn't. Neither is "false"; they serve different explanatory interests. |
  | **Modal Grounding** | **The Hospital Loop:** (See Claim 3). The assignment variable is caused by past outcomes. Can we treat the drug administration as an intervention? | **Yes, Free and Clear.** The counterfactual "If this patient hadn't taken the drug..." is true based on the laws of pharmacology. The assignment rule is irrelevant to the token causation. | **Conditional.** You cannot treat 'Drug' as an intervention variable *within a model that includes the Assignment Rule*. You must expand the model to make Assignment exogenous. If you don't, the causal claim is ill-formed. |
  | **Agent-Independence** | **No Interveners:** A universe with rocks and laws, but no agents and no physically possible agents (e.g., laws prohibit complex structures). Rock A hits Rock B. | **Causation Exists.** The laws of nature govern the collision. Counterfactuals hold based on nomic necessity. Agents are irrelevant. | **Causation is Derivative/Empty.** If interventions are metaphysically impossible, the concept of causation has no grip. We can say "It looks *as if* A caused B," but strictly, causal talk requires the possibility of manipulation. |

  ### 5. Verdict on the Verbal Dispute

  **Diagnosis:**
  This dispute is 80% verbal and 20% ontological.

  **The Verbal Part:**
  We are using the word "cause" to pick out the same structural features of reality (dependencies, invariances, counterfactual support), but we disagree on the label's requirements. The Counterfactualist treats "cause" as a natural kind term (like "water"), aiming to find its essence. The Interventionist treats "cause" as a functional term (like "tool"), aiming to define its use. When the Counterfactualist says "X caused Y," they mean "There is a mind-independent dependency." When the Interventionist says "X caused Y," they mean "There is a model-relative invariance." Once we translate these into their underlying structural commitments, we agree on the math, the graphs, and the outcomes of almost every test case.

  **The Ontological Remainder:**
  The remaining 20% is real. It concerns **Realism vs. Pragmatism**.
  The Counterfactualist insists that the modal structure exists *before* and *independent of* our modeling. The Interventionist insists that modal structure is *constituted* by our modeling practices.

  **Commitment:**
  The Counterfactualist is making a mistake. The search for "what makes the counterfactual true" beyond the actual patterns of dependence and invariance is metaphysical idleness. There is no hidden glue holding the antecedent and consequent together other than the regularities and laws we already identify in science. To ask for the "truthmaker" of the counterfactual is to ask for something that does no work.

  However, the Interventionist must concede one point: "Intervention" cannot be defined purely in terms of human agency without making causation anthropocentric. The "intervention" must be understood as *independent variation*, which can occur naturally (e.g., a mutation, a meteor strike). If the Interventionist insists that causation vanishes in a world without *possible* agents (the Rock Case), they have succumbed to verificationism.

  **Final Ruling:**
  The Interventionist framework is superior for science and policy because it forces clarity about variable sets and boundaries (as seen in the Hospital Case). The Counterfactualist framework is superior for ordinary language and legal/moral responsibility because it treats causation as absolute (as seen in the Preemption Case).

  The dispute should be dissolved by adopting the Interventionist's **method** (model-relative invariance) while retaining the Counterfactualist's **ontology** (the dependencies are real features of the world, not just features of our talk). The Counterfactualist is wrong to think the metaphysics adds depth, but right to think the world doesn't wait for us to model it. The Interventionist is right to demand precision, but wrong to suggest the precision creates the relation.

  **Stress-Test Outcome:**
  1.  **Hospital:** The Interventionist is right that the model matters. You cannot claim causation without specifying if the assignment rule is part of the system. The Counterfactualist is right that the patient still got better because of the drug. *Resolution:* Distinguish *type-level* causation (model-relative) from *token-level* causation (event-relative).
  2.  **Variable Sets:** The Interventionist is right. There is no "God's Eye" variable set. Coarse-grained causes are real causes relative to coarse-grained questions.
  3.  **No Interveners:** The Counterfactualist is right. Causation does not vanish if agents are impossible. The Interventionist must broaden "intervention" to mean "independent variation" regardless of source, or admit their theory is only about *human* causation, not *natural* causation.

  **Signed:**
  *The Counterfactualist*
  *The Interventionist*
