answer: |-
  It is a pleasure to correspond with you about this, and I think your intuition about the heterogeneity problem is spot on. You have identified the central tension that keeps hedonists awake at night, which is the worry that the felt experience of a hot bath, the satisfaction of a solved bug, the guilty thrill of schadenfreude, and the relief of a cancelled meeting share no single common quality. If there is no common quality, then pleasure cannot be a single natural property, and if it is not a single natural property, it is unclear how it can serve as the single currency of well-being that hedonism requires. Since you have asked me to help you structure a year of inquiry without flattening the technical debates, I will begin by laying out the landscape of questions that naturally arise from this problem, walking through them as we might walk through a codebase to understand its dependencies, before I commit to a specific order of operations for your study.

  The first cluster of questions concerns the ontological status of pleasure, or what kind of thing pleasure is supposed to be in the inventory of the universe. You mentioned the distinction between a natural kind, a disjunctive kind, and a cluster concept, and this is indeed the most metaphysical starting point. A natural kind is like gold or water, where every instance shares a fundamental underlying essence, such as atomic structure. A disjunctive kind is like jade, which turns out to be two different minerals, jadeite and nephrite, that we lump together for practical reasons. A cluster concept is more like a family resemblance, where instances share overlapping features but no single necessary condition, much like Wittgenstein's example of games. You need to ask whether pleasure must be a natural kind to do the work hedonism wants it to do, or if a disjunctive or cluster account is sufficient. Closely related to this is the question of whether the heterogeneity problem is a special case of a general problem in folk psychology. You asked whether the analogy to emotion or memory helps or misleads, and this is crucial. If we accept that emotion is a heterogeneous cluster and yet still find the concept of emotion useful for explaining behavior and well-being, then the heterogeneity of pleasure might not be fatal. However, if emotion is a failed folk category that should be eliminated from serious science, then pleasure might be in the same boat.

  The second cluster of questions concerns the definition and measurement of the relevant states. You asked whether the heterogeneity is a problem for the definition of pleasure or for the measurement of well-being. This is a distinction between semantics and epistemology. If the problem is definitional, then we cannot say what pleasure is. If the problem is measurement, then pleasure might exist but be hard to quantify across different types. This leads to the question of whether we should replace the term pleasure with something else. You mentioned enjoyment or positive affect. Enjoyment often implies a cognitive component, such as approving of the experience, whereas positive affect is a broader term from psychology that might include low-level sensory responses. Swapping terms might dissolve the problem if the new term is better defined, but it risks changing the subject away from classical hedonism. Within the definition itself, there are several structural distinctions you need to investigate. You mentioned separating liking from wanting, which is the distinction between the hedonic impact of a stimulus and the motivational drive to obtain it. You also mentioned occurrent versus dispositional pleasure, which is the difference between feeling good right now versus being in a state where you are disposed to feel good, like being happy about your marriage even while you are asleep. Finally, there is the distinction between sensory pleasure, like the taste of wine, and attitudinal pleasure, which is the pleasure taken in a state of affairs, such as being pleased that your team won. You need to ask whether heterogeneity destroys sensory pleasure but leaves attitudinal pleasure intact, or vice versa.

  The third cluster of questions concerns the scope of the theory. You asked whether the heterogeneity problem for hedonism about well-being is the same as the one for hedonism about motivation. Psychological hedonism claims we are motivated only by pleasure, while welfare hedonism claims only pleasure makes life go better. These are logically distinct. It might be that pleasure is too heterogeneous to be the sole motivator, but still homogeneous enough to be the sole constituent of well-being, or the other way around. If the problem is solved for one, it does not automatically solve it for the other. Finally, there is the question of whether the phenomenology actually needs to be uniform. Some philosophers argue that there is a common felt tone, a specific qualitative character, that accompanies all pleasures, even if it is masked by the specific sensory content. You need to ask whether introspection confirms this common tone or whether that is just a theoretical posit invented to save the theory.

  Now that we have laid out these candidate questions, I will reason through their dependencies to provide you with a defended prioritization. My goal here is to maximize the efficiency of your year of evenings and weekends while ensuring that you do not waste time on downstream questions that depend on upstream assumptions you have not yet vetted. I am treating this like a dependency graph in a complex system. If you resolve a upstream module, it might render several downstream modules unnecessary or trivial. Conversely, if you start with the downstream modules, you might build arguments on foundations that later crumble.

  The first and most critical question you must tackle is the analogy to folk categories like emotion or memory. I am placing this first because it is the most tractable for someone with your background and it sets the metaphysical stakes. If you can determine that heterogeneous folk categories are acceptable in serious theories of mind, then the pressure to find a unified essence for pleasure decreases significantly. This is tractable for you because it relies on conceptual analysis and comparing structures rather than deep dives into neuroscience or dense metaphysical literature. You can look at how cognitive science treats emotion. If emotion is treated as a valid explanatory kind despite being heterogeneous, then pleasure can be too. If emotion is being eliminated or radically revised, then pleasure is likely in trouble. This question is upstream of the natural kind versus cluster concept debate because the outcome here tells you what burden of proof you need to meet. If folk categories are fine, you can argue for a cluster concept. If they are not, you must fight for a natural kind. I am highly confident that this is the right starting point because it contextualizes the entire debate. If you skip this, you might spend months arguing about whether pleasure is a natural kind without knowing if that matters for a theory of well-being.

  The second question you should prioritize is the distinction between sensory and attitudinal pleasure, and specifically whether attitudinal pleasure can survive the heterogeneity problem even if sensory pleasure cannot. This is upstream of the liking versus wanting and occurrent versus dispositional distinctions because attitudinal pleasure is often defined in terms of pro-attitudes or dispositions. If hedonism can be reformulated as a theory about attitudinal pleasure rather than sensory feelings, the heterogeneity problem looks very different. The feeling of a hot bath is sensory, but the pleasure of finishing a refactor is largely attitudinal. If the theory of well-being only requires attitudinal pleasure, then the lack of a common sensory feel is irrelevant. This is highly tractable for you because it maps well onto the distinction between state changes and system configurations. Sensory pleasure is like an interrupt signal, while attitudinal pleasure is like a flag set in the system state. Determining whether well-being hedonism can rest entirely on the flag rather than the interrupt is a major structural decision. I am moderately confident in this ranking because some philosophers argue that attitudinal pleasure is just a disguised form of desire satisfaction, which would move you away from hedonism entirely, so you must verify that attitudinal pleasure is still genuinely hedonic.

  The third question on your list should be the definition versus measurement problem. Once you know what kind of category pleasure is likely to be, and whether you are focusing on sensory or attitudinal versions, you need to know if the heterogeneity prevents us from defining it or just prevents us from measuring it. If it is only a measurement problem, then hedonism survives as a theory of value even if we cannot perfectly quantify it across persons or experiences. This is important because software engineers are often comfortable with abstract interfaces where the implementation varies. If pleasure is an interface and the heterogeneous experiences are the implementations, the theory might hold even if the implementations share no code. However, if the problem is definitional, then the interface itself is ill-formed. This question is downstream of the first two because you need to know what you are trying to define before you can decide if the definition is failing. I am less confident here than in the first two because the line between definition and measurement is sometimes blurred in philosophy, but it is still a necessary checkpoint before moving to terminology.

  The fourth question is whether to replace pleasure with enjoyment or positive affect. This is a terminological and theoretical shift that should only be considered after you have exhausted the resources of the standard concept. If you switch to enjoyment, you are often adopting a theory that requires a cognitive judgment, which changes the nature of the well-being theory. If you switch to positive affect, you are moving closer to psychology and away from philosophy. This is downstream because you need to know exactly why standard pleasure fails before you adopt a substitute. If the failure is due to heterogeneity, does enjoyment solve it? Often enjoyment is just as heterogeneous. So this question is important but likely less productive than the earlier ones. I am moderately confident that this is a lower priority because it risks solving the problem by changing the subject.

  The fifth question is the separation of well-being hedonism from motivation hedonism. You should address this last among the major topics. While it is intellectually interesting to know if the heterogeneity problem applies to both, your goal is specifically a theory of well-being. If you solve it for well-being, the status of motivation hedonism is secondary. Furthermore, the arguments often run in parallel, so insights from one might help the other, but you do not need to resolve the motivation side to have a defensible view on well-being. This is the most downstream question in your specific context. I am highly confident in this prioritization because it keeps you focused on your stated goal.

  There are a few angles you mentioned that I believe are less critical for your specific goal. The question of whether pleasure is a natural kind, disjunctive kind, or cluster concept is vital, but I have subsumed it under the first question about folk categories. The folk category analysis is the practical way to answer the natural kind question without getting bogged down in heavy metaphysics. Similarly, the liking versus wanting distinction is important, but it is largely a tool to help you analyze the sensory versus attitudinal distinction. If you focus on attitudinal pleasure, the liking versus wanting split becomes less central because attitudinal pleasure is closer to liking than wanting. Therefore, I have not ranked them as separate top-tier items to avoid fragmenting your focus.

  I want to be explicit about my confidence in this agenda. I am highly confident that starting with the folk category analogy is the correct move because it frames the metaphysical burden correctly. I am moderately confident that prioritizing attitudinal pleasure over sensory pleasure is the most promising path for saving hedonism, as this is where most contemporary hedonists have retreated. I am less confident about the definition versus measurement distinction because it may turn out that if you cannot define it precisely, you cannot measure it, making them co-dependent. However, treating them as separate steps helps clarify the argument.

  To conclude, I need to tell you what would change my mind about this ranking and where my reasoning is most likely to fail. My ranking assumes that the heterogeneity problem is primarily a metaphysical or conceptual problem about categorization. If new neuroscience evidence emerged showing a common neural substrate for all pleasures, a so-called hedonic hotspot in the brain that activates for baths, refactors, and schadenfreude alike, then the natural kind question would be answered empirically. In that case, you should skip the folk category analysis and go straight to the neuroscience. This would collapse the first and second priorities into one empirical check. My reasoning is most likely to fail if I have underestimated the normative dimension of well-being. It is possible that the heterogeneity problem is not about what pleasure is, but about why pleasure matters. If the value of pleasure comes from its relation to the subject rather than its internal structure, then spending time on the ontology of pleasure might be a distraction. Additionally, I may be too optimistic about the tractability of the folk category question. Philosophy of mind debates about emotion are notoriously stalled, and you might find yourself in a quagmire where there is no consensus to leverage. If that happens, you should pivot to the definition versus measurement question sooner, as it is more internal to the hedonist tradition and less dependent on external debates about emotion. Finally, if you find that attitudinal pleasure collapses into desire satisfaction, you will need to abandon the second priority and decide whether desire satisfaction is a acceptable alternative, which is a different theory entirely. Keep an eye out for that collapse, as it is the biggest risk to the attitudinal strategy.
