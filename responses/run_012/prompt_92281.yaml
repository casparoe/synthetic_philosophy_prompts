      *   **Tone:** Professional, strategic, concise, tailored to non-specialists who think they get it.

  2.  **Deconstruct the Core Concepts:**
      *   *Counterfactual Mugging (CFM):* Omega asks for \$100 if coin is Tails. If Heads, Omega gives \$10,000 *if* you would have paid had it been Tails. (Standard Parfit/Soares version).
      *   *XOR Blackmail:* Blackmailer sends letter if (Disaster & No Pay) OR (No Disaster & Pay). You pay to avoid disaster, but paying causes the letter which correlates with disaster in a specific way. (Actually, standard XOR blackmail is: Blackmailer sends letter iff (Disaster XOR You Pay). If you get the letter, you reason: If I pay, Disaster must be true (to make XOR true? No, wait). Let's recall the precise structure.
          *   *Standard XOR Blackmail (Ahmed/Soares):* Blackmailer predicts whether you will pay upon receiving the letter. Blackmailer sends letter iff (Disaster is True XOR You Will Pay).
          *   If you receive the letter:
              *   If Pay -> Disaster must be False (for XOR to be true? No, if Pay=True, Disaster must be False for XOR=True). Wait, if Disaster=True and Pay=True, XOR=False (No letter). If Disaster=False and Pay=True, XOR=True (Letter).
              *   If Don't Pay -> If Disaster=True, XOR=True (Letter). If Disaster=False, XOR=False (No Letter).
              *   So if you get the letter, Paying implies No Disaster. Not Paying implies Disaster.
              *   But the Blackmailer only sends the letter if they predict you will act a certain way.
              *   Actually, the simpler version often used: Blackmailer sends letter iff (Disaster XOR Predicted Payment). If you get the letter, CDT says "Disaster is already fixed, paying doesn't stop it." FDT/UDT says "My decision algorithm determines whether the letter was sent."
      *   *Load-bearing idea:* It's not just "payoff fixed by unseen branch." It's about *subjunctive dependence* or *logical correlation* between your decision algorithm and a past event (Omega's prediction/Blackmailer's sending rule) that determines whether you are in the situation at all. It's about policy selection vs. action selection.
      *   *Audience Specifics:* Economists care about incentives/expected utility. Linguists care about semantics/pragmatics/conditionals. Historian cares about context/development. They know Newcomb, so they get "prediction affects payoff." They need to see why *counterfactual* reasoning changes when the prediction determines *existence of the problem*.

  3.  **Drafting the Plan - Section by Section:**

      *   **Load-Bearing Concept:** The user hunches it's "payoff fixed by a branch you'll never see." That's close but slightly off. It's that your *current decision procedure* is what was predicted, and that prediction determined *whether you are in this scenario*. It's about *Policy Dependence*. I need to refine this for them.
      *   **The Example:** Stock coin flip is okay, but often people get hung up on "Omega is magic." A computational/simulation analogy works better for economists/linguists. However, the user asked about a "look up for free" variant. I need to evaluate that.
          *   *User's Variant:* Fact is observable, but looking destroys payoff.
          *   *Analysis:* This sounds like "Toxin Puzzle" or "Value of Information." If looking up the fact changes the outcome, it's not standard CFM. Standard CFM relies on the fact being *counterfactual* (Tails branch). If you can look it up, you know if you are in Heads or Tails. If you know you are in Tails, Omega doesn't pay you in Heads. The trick of CFM is you don't know which branch you are in *at the time of policy selection*.
          *   *Verdict:* The "deliberate ignorance" variant risks collapsing into standard Value of Information (VoI). In CFM, the information (coin state) is irrelevant to the *causal* outcome of paying in the Tails branch, but relevant to the *logical* outcome of the Heads branch. If looking up the coin *causes* the loss, it's not CFM, it's a trap. I should advise against it for the *core* explanation, maybe use it as a foil later. Stick to the Coin Flip but frame it as "Source Code" for the economists/linguists.
      *   **Misconceptions:**
          1.  "Coin already landed" (Probability is 0 or 1). *Head off:* When introducing the setup, emphasize the *pre-commitment* phase vs. the *decision* phase.
          2.  "Pascal's Mugging." *Head off:* Explicitly distinguish low-probability/high-stakes from 50/50/moderate-stakes.
          3.  "XOR is just extortion." *Head off:* When introducing XOR, emphasize the *logical structure* of the sending rule, not the threat.
      *   **Final Question:** Needs to test structural understanding, not vocabulary. "Should you pay?" is too easy. "When should you decide?" is better.
      *   **What to Exclude:** FDT vs. UDT nuances, Timeless Decision Theory history, Modal Logic formalism, Psychopath Button.
      *   **Settled vs. Contested:**
          *   *Settled:* CDT loses money in these scenarios. EDT gets mixed results (often fails XOR). FDT/UDT wins.
          *   *Contested:* Whether "winning" is the only normative standard. Whether logical correlation is "real" causation. Whether these scenarios are physically possible (Omega coherence).

  4.  **Refining the "Deliberate Ignorance" Variant:**
      *   If the fact is observable *before* the decision, CFM dissolves. If I know it's Tails, I know Omega won't pay me. I shouldn't pay.
      *   If the fact is observable *after* the decision but looking *prevents* the payoff? That's just a constraint.
      *   The user's idea: "Relevant fact is something you could look up... looking it up costs you the payoff."
      *   This sounds like: Omega says "I simulated you. If you looked up the coin, I didn't give you the money."
      *   This makes it about *observability* as an action. This is actually a strong way to explain *Updatelessness*. You must commit *before* updating on the coin.
      *   *Correction:* It doesn't collapse into VoI if the act of looking is what Omega predicted. But it adds a layer of complexity. For a 50-min intro, standard CFM is cleaner. I will advise: Use it as a *bridge* to explain why we don't update, but don't make it the primary case.

  5.  **Structuring the Session (50 mins):**
      *   0-5: Setup & Newcomb Recap (Bridge from known to unknown).
      *   5-20: Counterfactual Mugging (The Core).
      *   20-35: XOR Blackmail (The Extension).
