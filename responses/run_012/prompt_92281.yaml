prompt: |-
  Somehow I've ended up running next week's session for our department's informal decision-theory reading group, and the topic is the counterfactual mugging plus XOR blackmail. The audience is about six people -- two economists, three linguists, a historian of science -- all quick, none of them have read any of the decision theory literature, but they've all heard of Newcomb's problem and are pretty sure they've got the gist. Don't explain the cases to me; plan how I should explain them. What has to be in place before the mugging even looks like a problem (my hunch is it's something about your action's payoff being fixed by a branch you'll never get to see, but correct me if that's the wrong load-bearing idea), what one example should carry the whole thing and what it needs to have and to lack -- and say whether the stock coin-flip version is that example or whether I should build a different one; the misconceptions you'd bet money they'll form and the exact point in the sequence where I should head each off (my guesses: that it's just Pascal's mugging with a smaller number, that 'the coin already landed' settles the probability question, and that XOR blackmail is purely a moral/extortion question so the decision theory doesn't bite); one question to ask at the end that shows me the structure landed rather than that they can recite 'updateless'; and what I should openly refuse to cover in fifty minutes. Don't send me a reading list, I'll pull things myself.

  One thing I want to try, tell me if its a bad idea: a variant where the relevant fact is something you could just look up for free at any time, and the whole trick is that looking it up is what costs you the payoff -- so the lesson has to be about deliberately staying ignorant rather than about a coin you can never observe. Does that make the precommitment point cleaner, or does it just collapse into value-of-information / evidential-vs-causal stuff?

  And seperate out for me what's actually settled here from what's genuinely contested among people who work on it -- I don't want a live dispute presented as if it were the consensus.
