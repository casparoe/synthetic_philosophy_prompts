answer: |-
  Here is a battle plan for your 50 minutes. Your audience is high-agency but lacks the specific vocabulary; they will try to map this onto Principal-Agent problems (economists), Gricean implicature (linguists), or historical rationality shifts (historian). Your job is to prevent those mappings from swallowing the logic.

  ### 1. The Load-Bearing Idea
  Your hunch ("payoff fixed by a branch you'll never see") is close, but it risks framing this as an epistemic problem (what do I know?) rather than a control problem (what do I control?).

  **The actual load-bearing idea:** *Optimization target.*
  In standard decision theory (CDT/EDT), you optimize the **action** given your current information (ex-post). In these problems, you only win if you optimize the **policy/algorithm** before you receive specific information (ex-ante).
  *   **Newcomb:** The money is already in the box, but your *type* determined what's in there.
  *   **Counterfactual Mugging:** The money *does not exist* in your branch, but your *type* determined whether it was created in the other branch.
  *   **XOR Blackmail:** The disaster is fixed, but your *type* determined whether you were contacted at all.

  **Phrase to use:** "You are not choosing an action for this moment; you are choosing a output for a function that was called in the past."

  ### 2. The Example: Coin Flip vs. Your "Ignorance" Variant
  **Stick to the Stock Coin Flip.** Do not use your "look it up for free" variant as the primary case.

  **Why:** Your variant collapses into **Value of Information (VoI)**. If looking up the fact costs the payoff, economists will immediately model it as a cost-benefit analysis of information acquisition ($Cost_{look} > ExpectedValue_{pay}$). They will solve it correctly using standard tools, missing the point that *even with zero cost to look*, the rational move (in UDT/FDT terms) is to act as if you haven't looked.
  *   **The Trap:** Your variant makes "staying ignorant" an instrumental action. In CFM, staying ignorant is a *logical necessity* of the decision theory. You want them to feel the pain of paying in the Tails branch *even though they know it's Tails*.
  *   **Modification:** If you want to make it concrete for economists, frame Omega not as a magician, but as a **smart contract** or a **simulation**. "We uploaded your source code. We ran it on Tails. Now we are running you on Heads." This bypasses the "magic" objection.

  ### 3. Session Flow & Misconception Traps (50 Minutes)

  **0:00–0:05: The Newcomb Bridge**
  *   **Do:** Briefly recap Newcomb. Ask: "Who one-boxes?" (They likely will). Ask: "Why?" (They'll say "Omega predicts me").
  *   **Don't:** Rehash the CDT vs. EDT debate.
  *   **Setup:** "Newcomb is about prediction determining *payoff distribution*. Today is about prediction determining *problem existence*."

  **0:05–0:20: Counterfactual Mugging (CFM)**
  *   **The Case:** Coin is Tails. Omega asks for \$100. If Heads, Omega would have given \$10,000 *if* you would have paid on Tails.
  *   **Misconception 1: "The coin already landed."**
      *   *When:* Immediately after stating the case.
      *   *Head-off:* "You are right. Probability is 0 or 1. But Omega didn't bet on the coin; Omega bet on *you*. If you treat the coin as fixed, you treat Omega's prediction as fixed too. But Omega's prediction was about your *decision procedure*, not your specific action in this timeline."
      *   *Economist specific:* "This is Ex-Ante vs. Ex-Post optimality. You are dynamically inconsistent."
  *   **Misconception 2: "It's Pascal's Mugging."**
      *   *When:* When discussing the \$10,000 vs \$100.
      *   *Head-off:* "Pascal's Mugging relies on tiny probabilities of huge stakes. This is 50/50. The weirdness isn't the magnitude; it's the counterfactual dependency."

  **0:20–0:35: XOR Blackmail**
  *   **The Case:** Blackmailer sends letter iff (Disaster XOR You Pay). You receive letter. Should you pay?
      *   *Logic:* If Pay → No Disaster. If Don't Pay → Disaster. (Because Letter = True).
      *   *CDT View:* Disaster is fixed. Paying just loses money.
      *   *FDT/UDT View:* My decision determines whether the letter was sent.
  *   **Misconception 3: "This is just extortion/morality."**
      *   *When:* Introducing the Blackmailer.
      *   *Head-off:* "Ignore the threat. Ignore the morality. This is a logic gate. The Blackmailer is a function `Send = Disaster XOR Pay`. You are inside the function. Does your output change the input `Send`? CDT says no. Decision Theory says yes, because `Send` was calculated using your output."
      *   *Linguist specific:* Watch out for them analyzing the semantics of "If." Remind them this is a material conditional in a simulation, not a natural language counterfactual.

  **0:35–0:45: Synthesis (Policy Selection)**
  *   Connect the two. In CFM, you pay to make the Heads-world profitable. In XOR, you pay to make the Letter-world safe.
  *   **Key Insight:** "In both cases, you are paying a tax in the actual world to subsidize a counterfactual world that makes your existence/algorithm profitable."

  **0:45–0:50: The Comprehension Check**
  *   **Do not ask:** "What is Updateless Decision Theory?" (They will recite definitions).
  *   **Do not ask:** "Should you pay?" (They will guess what you want to hear).
  *   **Ask this:** "Imagine you have a button that lets you 'forget' the coin landed Tails, restoring your credence to 50%. Does pressing that button change the rational choice to pay? Why or why not?"
      *   *Correct Answer:* No. The physical state of your brain doesn't matter; the logical output of your algorithm does. If you know the algorithm outputs 'Pay' on Tails, forgetting doesn't change the algorithm's output in the Heads simulation.
      *   *What it tests:* Whether they understand the dependency is *logical/subjunctive*, not *psychological/epistemic*.

  ### 4. What to Openly Refuse to Cover
  To stay within 50 minutes, draw a line in the sand at the start:
  1.  **FDT vs. UDT vs. TDT:** Treat them as a single cluster ("Logical Decision Theory"). The distinctions are technical, not conceptual for this hour.
  2.  **The Metaphysics of Omega:** If they ask "Is Omega possible?", say "We are analyzing the logic of the scenario, not the physics. Assume the setup holds."
  3.  **Psychopath Button / Newcomb's Soda:** These are variants that muddy the water. Stick to the two core cases.

  ### 5. Settled vs. Contested
  Be precise here so they don't leave thinking everything is up for grabs.

  **Settled (among DT researchers):**
  *   **CDT loses money.** In both CFM and XOR, a CDT agent gets less utility than an FDT/UDT agent over the long run (or across the multiverse of possibilities).
  *   **Dynamic Inconsistency.** A CDT agent would pre-commit to paying but refuse to pay when the time comes.
  *   **The "Winning" Definition.** If "rationality" means "getting the money," CDT is irrational here.

  **Genuinely Contested:**
  *   **Normativity:** Does "getting the money" define rationality? Some philosophers argue rationality is about *reasoning correctly from available evidence* (CDT), not *winning*. (The "Rationality vs. Success" debate).
  *   **Subjunctive Dependence:** Is the link between your decision and Omega's prediction "real" enough to base action on? CDT proponents argue the correlation is not causation.
  *   **Logical Uncertainty:** How do we formally calculate probabilities over logical facts (like the output of your own algorithm)? This is still an open mathematical problem.

  ### 6. Verdict on Your "Deliberate Ignorance" Variant
  **Idea:** A variant where the fact is observable, but looking up costs the payoff.
  **Verdict:** **Bad idea for the core explanation.**

  **Why:**
  1.  **It solves the problem too easily.** If looking costs the payoff, standard Expected Utility Theory says "Don't look." Then you are back to 50/50 credence, and paying looks like a standard bet. It hides the *counterfactual* tension.
  2.  **It shifts the burden.** The lesson becomes "Information has cost," which is Econ 101. The lesson *should* be "Information has logical consequences even when costless."
  3.  **Better Use:** Use this as a **foil** in the Q&A. If someone says "But I'd just check the coin!", you say: "Okay, suppose checking is free. Suppose Omega just *knows* whether you *would* check. Now are you stuck?"

  **Recommendation:** Run the standard Coin Flip. It isolates the decision-theoretic weirdness without introducing confounding economic costs. Save your variant for if they resist the "Omega knows my mind" premise; you can swap Omega for "A simulation of you that runs if you don't check the coin."

  ### Summary Checklist for You
  *   [ ] **Frame:** Ex-Ante Policy vs. Ex-Post Action.
  *   [ ] **Case:** Standard Coin Flip (framed as Source Code/Simulation).
  *   [ ] **Trap:** Head off "Coin already landed" at minute 5.
  *   [ ] **Trap:** Head off "Extortion/Morality" at minute 20.
  *   [ ] **Check:** The "Forgetfulness Button" question.
  *   [ ] **Boundary:** No FDT/UDT split, no Omega physics.
  *   [ ] **Honesty:** CDT loses money (Settled), but is it irrational? (Contested).
