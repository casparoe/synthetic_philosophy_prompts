answer: |-
  The silence in the observation deck wasn't empty; it was heavy, like water behind a dam. Kael sat in the recessed chair, his hands resting on the cool polymer of the console. Around him, the station drifted in the shadow of a gas giant, a speck of dust hiding in the rings. This was the only way to exist. You hid, or you were removed.

  The alert light didn't flash. It simply bloomed, a soft amber wash across the dashboard.

  Kael didn't move immediately. He watched the waveform unfold on the main screen. It wasn't a directed beam. It was a sphere. An omnidirectional broadcast pouring energy into the void in every direction equally. It was screaming.

  He knew the doctrine. Everyone did. Silence was free. Silence proved nothing. A civilization could stay quiet for a thousand years, biding its time, sharpening its knives. But to broadcast like this? To light up the dark? That was a cost. It was a sacrifice. You couldn't send a sphere-pulse without pinning your coordinates to the galaxy's map. You were saying, *Here I am. I am not hiding. I have nothing to hide.*

  In the old stories, the Bright Ones were martyrs. They broadcasted peace, and the hunters shot them. The logic was clean: only a liar survives, so everyone who survives is a liar.

  Kael's finger hovered over the intercept key. He could end it. The station carried a single kinetic lance, buried deep in the hull. One shot, and the source of the broadcast would be vaporized. The threat would be neutralized.

  But he didn't press it. He watched the secondary monitors. The ones that looked outward, away from the source.

  The second rule was less spoken but more feared. A kill makes light. When you fire a lance capable of crossing systems, the exhaust bloom is visible for sectors. You don't just kill the target; you tell everyone else where you are. You become the new loud thing. You become the new target.

  So the forest wasn't just full of hidden prey. It was full of hidden predators, all holding their breath, waiting for someone else to cough.

  The broadcast continued. It wasn't data, not really. It was music. Complex, swelling harmonics that repeated in cycles. It sounded like grief.

  Kael leaned forward. "How long?" he asked the empty room.

  The system logged the duration. Four hours.

  Four hours of suicide. Any sane actor would have脉冲ed a burst and gone dark. To keep singing was to insist on being found.

  Kael's heart hammered against his ribs. He wanted to shoot. The instinct was primal. The noise was an itch under his skin. If he silenced it, the quiet would return. He could go back to being a ghost. But if he fired, his own position would flare on a dozen other scopes. He would trade a distant stranger's death for his own eventual demise.

  He watched the signal strength. It wasn't fading.

  *Why?*

  If the broadcast was a honest signal of non-aggression, it should have stopped once the cost became clear. They knew they were heard. They knew the hunters were listening. To continue was to waste fuel, to burn resources that could be used for shielding, for running.

  Unless they weren't trying to survive.

  Kael sat back, the leather of the chair creaking. He realized then that the doctrine had a flaw. It assumed everyone wanted to live. It assumed the game was about survival. But what if the game was about testimony?

  If every survivor is a liar, then the truth is extinct. The only way to keep the truth alive is to die speaking it.

  The music swelled. A chord resolved, dissonant and sharp, then softened into a major key. It was beautiful. It was terrifying.

  Kael looked at the intercept key again. It was matte black, unmarked. If he pressed it, he would be doing what logic demanded. He would be preserving the dark forest. He would be ensuring that the liars remained in charge, that the silence remained unbroken. He would be a good citizen of the void.

  If he didn't, he was letting a threat persist. Maybe this was a trick. Maybe the music was a code for a weapon lock. Maybe they were drawing fire to triangulate the shooters.

  But the signal was omnidirectional. You can't triangulate from a sphere. They were giving away everything for nothing.

  He thought about the other hunters out there. There had to be some. Within ten light-years, there were likely three, maybe four other stations like this one. Ships tucked into asteroid belts, mirrors angled to catch the heat of distant stars. They were hearing this too.

  They were waiting.

  They were waiting for Kael to shoot. If he fired, his flash would give them his location. They would eliminate him while he was recharging. If they shot, he would eliminate them.

  So the broadcast wasn't just buying time for the sender. It was buying time for everyone. It was freezing the board. As long as the song played, everyone was watching the singer. No one dared move.

  Kael smiled, a thin, humorless expression. The honest ones weren't dead yet. They were holding the room at gunpoint with their own throats.

  The duration counter ticked past five hours.

  Kael moved his hand away from the intercept key. He opened a different menu. Recording.

  He couldn't save them. If he turned his shields toward them, he'd be visible. If he sent a message back, he'd be visible. He was just another ghost in the dark. But he didn't have to be the one who closed the curtain.

  He set the system to archive the signal. Every note, every cycle. He would store it in the deep core, buried under layers of encryption and false data.

  If he survived, he would carry it. If he died, maybe someone else would find the black box.

  The music shifted again. The harmonics grew frantic. The energy output spiked. They were pushing their reactor to the limit. They were burning themselves up to sing louder.

  Kael felt a sudden, sharp pity. It was useless. In a thousand years, no one would know their names. The liars would inherit the stars, just as they always did. The silence would win.

  But not because of him.

  He wouldn't shoot. He wouldn't give the other hunters the flash they were waiting for. He would sit in the dark and listen to the dying light. He would be a witness, not a executioner.

  The signal peaked. The waveform clipped the top of the screen, white and solid.

  Then, it cut.

  The silence rushed back into the room, heavier than before. The amber light on the console faded to black.

  Kael sat in the dark. He didn't move. He kept his eyes on the outward monitors, watching for the muzzle flashes of the other hunters who might have been less patient. He watched for the light that would tell him his turn had come.

  Nothing.

  The other hunters had also chosen to wait. They had let the honest ones die without spending a shot. They had kept their hands clean.

  Kael exhaled, a long shuddering breath. The forest remained dark. The liars remained safe. And the truth was just data on a hard drive, waiting for a power source that might never come.

  He closed the file. He engaged the station's cooling systems. He went back to watching the void.

  There was nothing else to do. The silence was free. It cost nothing. And it proved nothing.
