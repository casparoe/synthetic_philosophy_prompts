          *   Wrinkle 2: Attacks are visible (muzzle flashes). Shooting reveals the shooter. So, hunters wait for witnesses to drift away. Broadcasting buys time, not safety.
      *   **Task:** Write a short story set in this galaxy.
      *   **Parameters:**
          *   About a *decision*, not a battle (no armadas, no laser fights).
          *   One POV (either the broadcaster or the receiver). The prompt suggests the receiver is richer, but leaves it to me.
          *   No exposition dumps on physics/game theory. Show, don't tell.
          *   If the theory has flaws, dramatize them in the story (character discovers the problem).
          *   No references to existing sci-fi (no Star Trek, Three-Body Problem, etc.).
          *   Length: 900 - 1500 words.
          *   Language: American English.

  2.  **Determine the POV:**
      *   The prompt suggests the receiver is richer. Let's go with the receiver. They hear a signal. They know the signal means "I am honest and willing to die." They also know shooting back reveals *them*. They have to decide whether to shoot or wait.
