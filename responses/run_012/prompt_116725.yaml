      *   Actually, let's focus on the "costly signal" aspect. To prove you aren't a threat, you must make yourself vulnerable. But if you make yourself vulnerable, someone might shoot anyway because they value survival over truth.
      *   The character (Receiver) has to decide: Do I reward honesty with death, or do I risk my own exposure by staying silent?
      *   Better angle: The signal claims to be dying. It asks for nothing. It just says "We are here."
