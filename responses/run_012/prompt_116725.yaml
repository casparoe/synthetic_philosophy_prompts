      *   Story idea: The signal is *too* bright. It looks like honesty, but it feels like bait. Kael realizes that in a universe where silence is survival, the only thing louder than a liar is a dead man. But what if the dead man is a recording?
      *   Let's go with the idea that the signal *is* the trap. Not because it's a lie, but because the act of judging it is the trap.
