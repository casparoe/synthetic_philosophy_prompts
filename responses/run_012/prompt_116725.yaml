      *   Setting: A quiet sector. Deep space. A monitoring post.
      *   The Signal: Needs to be undeniable. Not just "hello," but something that costs energy, something that pins them down.
      *   The Conflict: The signal arrives. Kael knows the theory (Silence = Suspicion, Light = Honesty/Death). But he also knows the second wrinkle (Shooting = Revealing oneself).
      *   The Twist/Exploration of Coherence: The prompt asks to dramatize if the wrinkles collapse. The core tension is: If everyone knows shooting reveals you, nobody shoots. If nobody shoots, broadcasting isn't suicide. If broadcasting isn't suicide, it's cheap talk. The story needs to grapple with this uncertainty. Is the signal *actually* costly? Or is it a trap?

  4.  **Drafting - Scene Setup:**
