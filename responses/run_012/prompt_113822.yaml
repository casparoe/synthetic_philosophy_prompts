  **The Episode: The "Heliacal Anchor" of Year 14**

  A new cuneiform tablet is discovered in a secure stratigraphic context at a border fortress between the Hittite and Egyptian spheres. The text records a military campaign in the regnal year 14 of a specific Hittite king and mentions a "star that rose with the sun" on the day of battle. The mainstream chronology places this king's reign broadly between 1280 and 1250 BCE, based on a synthesis of king lists and radiocarbon ranges that allow for a thirty-year window of uncertainty. The revisionist chronology, utilizing a re-interpreted Sothic cycle, fixes this king's Year 14 to exactly 1273 BCE. They argue that the "star" must be Sirius, and that its heliacal rising in that specific latitude occurs on a date that, when cross-referenced with the battle season, permits only one year in the century: 1273 BCE.

  Prior to the excavation of the fortress's destruction layer, the revisionists publish a precise prediction: the organic material from the layer will yield a radiocarbon date that calibrates to a median probability peak of 1273 BCE, not merely within the mainstream's thirty-year range. When the samples are tested, the calibration curve—which has a "plateau" in this period allowing multiple dates to produce similar radiocarbon ages—shows a probability distribution with a primary peak at 1273 BCE, though with significant secondary peaks at 1260 and 1285. The revisionists declare a total victory: their precise, falsifiable claim survived, unifying the textual astronomy, the regnal year, and the radiocarbon data under a single mechanism. The mainstream account, they argue, has been shown to be needlessly vague, merely accommodating the result within a broad error bar after the fact.

  ***

  **(a) The Demarcating Feature**
  The feature doing the demarcating work is **the honest calibration of confidence to uncertainty.** The mainstream account is rational because it respects the *multimodal* nature of the evidence (the radiocarbon plateau, the textual ambiguity), assigning confidence proportional to the actual constraints the data impose. The revisionist account is pseudoscientific not because it is wrong, but because it asserts a level of certainty (a single year) that the evidence cannot support, effectively treating a *maximum likelihood estimate* as an *exact truth*.

  **(b) Distinction from the Three Scores**
  This feature is not a restatement of the revisionists' victory on precision, survival, or unification. One can be precise and wrong (missed survival); one can be precise and right by luck (survival without reliability). The revisionists here win on all three scores: they were precise (1273 vs. 1280–1250), they survived (1273 was the peak), and they unified (text + star + carbon). The demarcation lies not in the *outcome* of the prediction, but in the **epistemic posture toward the error margins.** The revisionists' success is an artifact of selecting the one data point that fits their axiom while ignoring the adjacent probabilities that the mainstream correctly identified as viable. They win the battle of the "hit" but lose the war of inference reliability.

  **(c) Removal of the Feature**
  If this feature is removed—that is, if the revisionists were to acknowledge that 1273 is merely the *most probable* date within a range that includes 1260 and 1285, and that their astronomical reading is one of several philological possibilities—their programme becomes a respectable, competing scientific hypothesis. It would no longer claim to be a "key that dissolves puzzles" via certainty, but a refined model subject to the same probabilistic constraints as the orthodox one. It ceases to be pseudoscientific once it admits that its precision is heuristic rather than ontological.

  **(d) The Strongest Revisionist Reply**
  The strongest reply is: **"Truth is singular. Nature does not deal in probabilities; the event happened in 1273. We found the truth; you merely found a distribution."**
  This reply fails because it conflates *ontology* (what happened) with *epistemology* (what we can justify claiming to know). Science is a method for managing uncertainty, not just a repository of facts. If the revisionists claim their method yields certainty where the data only yield probability, they are misrepresenting the reliability of their inference. If this reply succeeded, it would show that my criterion is too "soft" on truth; however, in historical inquiry, where data is fragmentary, a method that systematically underestimates uncertainty will inevitably produce "precise hits" that are epistemically fragile. The criterion holds because it protects the inquirer from the *illusion* of knowledge.

  ***

  **What to Say to Your Brother**

  Tell him this: "I accept that your timeline makes sharper predictions and that, in this instance, the data happened to align with your specific date. That is impressive. But the difference between a scientific model and a pseudoscientific one isn't just about hitting the target; it's about admitting how wide the target actually is.

  When you treat a radiocarbon plateau or an ambiguous text as a single, exact number, you aren't being more precise than the mainstream; you are being less honest about the noise in the data. You are winning by ignoring the error bars that the orthodox account respects. If your system is truly robust, it should be able to accommodate the uncertainty without collapsing. If you claim certainty where the evidence only offers probability, you aren't solving the puzzles; you're just hiding the question marks."
