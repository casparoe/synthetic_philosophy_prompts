answer: |-
  ### Desiderata for a Theory of Pain's Badness

  The following list is diagnostic. It is designed not to guide you toward a specific conclusion, but to locate the fracture points where a theory will fail to account for the data. Requirements are marked as **Non-Negotiable (NN)** if they are required by the stipulations and the paradigmatic status of pain, or **Camp Commitments (CC)** if they reflect specific metaphysical or axiological allegiances.

  #### 1. The Asymbolia Distinction (NN)
  **Requirement:** The theory must distinguish the sensory-discriminative component of pain (location, intensity, type) from the affective-motivational component (suffering, unpleasantness).
  **Case:** Pain Asymbolia. Patients with insula/cingulate damage report feeling the sensation ("something is touching me sharply") but lack the suffering ("it doesn't bother me").
  **Diagnostic Force:** Any theory that identifies pain's badness solely with the sensory representation of damage (Simple Representationalism) fails here. The badness must be locatable in the affective component, not the sensory one.

  #### 2. The Intrinsic Badness Claim (NN)
  **Requirement:** The theory must explain why pain is *pro tanto* bad in itself, not merely bad as a sign of tissue damage or as a cause of further harm.
  **Case:** The Paradigm Status. Pain is the philosophical exemplar of intrinsic disvalue.
  **Diagnostic Force:** This rules out pure Instrumentalism. If a theory explains pain's badness *only* by its correlation with injury (Representationalism) or its function to compel avoidance (Imperativism), it fails to explain why the *experience itself* is a negative value. A warning light is not bad; pain is. The theory must bridge this gap.

  #### 3. The Stipulation 1 Accommodation (NN)
  **Requirement:** The theory must provide a coherent account of a state exhibiting full pain-behavior and motivational demand (guarding, autonomic arousal, insistence on cessation) despite the subject reporting *no* felt quality (no ache, no "what it is like").
  **Case:** The "Zombie Pain" Stipulation.
  **Diagnostic Force:** This breaks **Phenomenal Essentialism**. If a theory holds that badness is *identical* to a specific qualia, this state has no badness. Yet, the motivational machinery treats it as bad. The theory must either deny the badness (and explain the motivation) or admit badness without qualia (and redefine badness).

  #### 4. The Stipulation 2 Accommodation (CC)
  **Requirement:** The theory must take a stance on a subject who reports an unambiguously unpleasant sensation but denies it is *bad for her* in any respect that matters.
  **Case:** The Stoic/Masochist Stipulation.
  **Diagnostic Force:** This forces a choice between **Subjective Authority** (the subject is right; badness requires a negative attitude toward the sensation) and **Objective Normativity** (the subject is confused; unpleasantness entails badness).
  *   *If you treat her as coherent:* You commit to Attitudinalism or a disassociation of unpleasantness and badness.
  *   *If you treat her as confused:* You commit to Hedonism or Objective List theories where phenomenology dictates value.

  #### 5. The Unnoticed Pain Constraint (NN)
  **Requirement:** The theory must determine whether pain that is not currently attended to retains its badness.
  **Case:** Flow states or distraction where pain is present but unnoticed until attention lands on it.
  **Diagnostic Force:** Tests the **Dispositional vs. Occurrent** distinction. If badness is identical to the *suffering* (occurrent), unnoticed pain is not bad. If badness is a property of the *state* (dispositional), it remains bad. A theory that makes badness too dependent on higher-order attention risks making pain's badness intermittent in a way that contradicts its intrinsic nature.

  #### 6. The Nociceptive Constraint (NN)
  **Requirement:** The theory must align with the cortical dissociation between nociceptive processing (S1/S2) and affective processing (Anterior Cingulate/Insula).
  **Case:** Neuroimaging and lesion studies.
  **Diagnostic Force:** Rules out monolithic theories. You cannot locate the badness in the somatosensory cortex. The theory must map the "badness" property to the limbic/affective circuitry, not the sensory mapping circuitry.

  #### 7. The Animal Constraint (NN)
  **Requirement:** The theory must attribute badness to pain in non-linguistic creatures without relying on complex conceptual reports.
  **Case:** Non-human animal suffering.
  **Diagnostic Force:** Rules out theories requiring high-order conceptualization (e.g., "judging that one is worse off"). Badness must be accessible via behavior and physiology, not just introspection.

  #### 8. The Congenital Insensitivity Constraint (NN)
  **Requirement:** The theory must explain why the *absence* of pain is a harm in Congenital Insensitivity to Pain (CIP), despite pain being intrinsically bad.
  **Case:** CIP patients suffer injury and early death due to lack of warning.
  **Diagnostic Force:** Tests the **Intrinsic vs. Instrumental** distinction. The theory must allow pain to be intrinsically bad (Requirement 2) while instrumentally good. If the theory makes pain *only* instrumentally bad, it cannot explain why we pity those who feel no pain. If it makes pain *only* intrinsically bad, it struggles to explain why we would not want to eliminate it entirely.

  ---

  ### The Impossibility Result

  There is a pair of requirements in the landscape of pain theory that cannot be jointly satisfied, given the stipulations above.

  **Pair:**
  1.  **The Phenomenal Identity Requirement (CC):** The badness of pain is *identical* to its felt phenomenal quality (Qualia/Hedonism).
  2.  **The Functional Reality Requirement (NN):** States exhibiting the full motivational and protective profile of pain (Stipulation 1) must be acknowledged as possessing the normative force of pain's badness (or the theory must explain why the "demand that it stop" is coherent without badness).

  **The Conflict:**
  If Badness = Felt Quality, then the subject in Stipulation 1 (who reports *no* felt quality) is in a state of *zero* badness. However, this subject exhibits "an insistent demand that it stop" and "guarding." If the theory says the state is not bad, it must explain why the subject demands the cessation of a neutral state with the urgency reserved for bad states. If the theory says the state *is* bad (to match the behavior), it violates Phenomenal Identity.
  *Result:* You must abandon Phenomenal Identity or deny the normative significance of the motivational profile in Stipulation 1. Given the prompt treats Stipulation 1 as given, **Phenomenal Identity is untenable.**

  ### The Killer Constraint

  The single requirement that does the most to rule out otherwise attractive theories is **Requirement 2: The Intrinsic Badness Claim.**

  **Why:**
  It is the graveyard of **Representationalism** and **Imperativism**.
  *   **Representationalism** (e.g., Tye): Pain is bad because it represents bodily damage. *Failure:* Representing damage is not intrinsically bad (a doctor's diagnosis represents damage but is not bad in itself). The theory struggles to explain why the *representation* hurts.
  *   **Imperativism** (e.g., Klein): Pain is bad because it issues a command ("Stop this!"). *Failure:* Commands are not intrinsically bad (a coach's command is urgent, not evil). The theory explains urgency, but not *disvalue*.
  *   **Simple Functionalism:** Pain is bad because it disrupts function. *Failure:* This makes badness purely instrumental. It cannot explain why a pain that causes no long-term harm (e.g., a brief, harmless shock) is still bad *in the moment*.

  Only theories that posit a primitive hedonic tone (Hedonism) or a specific negative attitude toward sensation (Attitudinalism) can easily satisfy the Intrinsic Badness Claim.

  ---

  ### Survey of Main Families

  **1. Qualia Hedonism (e.g., Kripke, Feldman)**
  *   **View:** Badness is a primitive property of the phenomenal character.
  *   **Fares Well On:** Intrinsic Badness (NN), Paradigm Status.
  *   **Breaks On:** Stipulation 1 (NN). If there is no qualia, there is no badness, yet the behavior persists. Also struggles with Asymbolia unless it posits two distinct qualia (sensory vs. affective).

  **2. Representationalism (e.g., Tye)**
  *   **View:** Pain is a representation of bodily disturbance; badness is the content.
  *   **Fares Well On:** Nociceptive Constraint (NN), Animal Constraint (NN).
  *   **Breaks On:** Intrinsic Badness (NN). Cannot explain why the representation is *bad* rather than just *accurate*. Also struggles with Asymbolia (does the asymbolic patient misrepresent damage?).

  **3. Imperativism (e.g., Klein)**
  *   **View:** Pain is an imperative command to protect the body.
  *   **Fares Well On:** Stipulation 1 (NN) (Commands can exist without qualia in some readings), Motivational profiles.
  *   **Breaks On:** Intrinsic Badness (NN). Explains why pain is *urgent*, not why it is *evil*. A command can be obeyed without suffering; pain cannot.

  **4. Attitudinalism (e.g., Heathwood, Brentano)**
  *   **View:** Badness consists in having a negative attitude (aversion) toward a sensation.
  *   **Fares Well On:** Stipulation 2 (CC) (Subject can lack the attitude), Asymbolia (NN) (Sensation without aversion).
  *   **Breaks On:** Intrinsic Badness (NN). Risks making badness dependent on the attitude rather than the sensation itself. If I am sedated and don't care, is the pain not bad? This conflicts with the Unnoticed Pain Constraint (NN).

  **5. Hybrid Accounts (e.g., Dual-Component)**
  *   **View:** Pain requires both sensory representation and affective evaluation.
  *   **Fares Well On:** Asymbolia (NN), Nociceptive Constraint (NN).
  *   **Breaks On:** Stipulation 1 (NN). If the affective component is missing (no qualia), the hybrid account typically denies it is pain, leaving the "insistent demand" unexplained.

  **Summary:** To survive the diagnostic list, a theory must decouple badness from simple sensation (to save Asymbolia), decouple it from pure function (to save Intrinsic Badness), and decouple it from strict phenomenology (to save Stipulation 1). This leaves a narrow path for **Attitudinalism** or a **Non-Reductive Affective Realism**, provided they can solve the Unnoticed Pain problem.
