  I hold the fact within my bounded mind,
  And every truth that flows from what I find
  Is mine already, of the same strict kind.

  If P implies Q, then Q is true,
  I need no effort to make it new,
  The consequence is instantly due.

  I stand inside a closed and perfect set,
  Owning each logical and heavy debt,
  With no omission left to plague me yet.

  There is no theorem hidden in the store,
  I possess the infinite and more,
  Bursting at my epistemic core.

  I know the coin has landed strictly heads,
  So I know (following where it leads)
  It's heads, or dragons fill the garden beds.

  I know all tautologies by right,
  Though none have entered my perceptual sight,
  I hold them in the static of the light.

  The chain runs on into the mental deep,
  Where secrets I never sought I still must keep,
  No consequence is allowed to sleep.

  There is no place where reasoning can stop,
  I climb the ladder but I reach no top,
  The rungs continue till the structure drop.

  I try to limit what I understand,
  By adding awareness to the command,
  But now the logic slips out of my grasp.

  The closed one breaks, the open knows too less,
  Incoherence meets a barren mess,
  And both stand still within the darkness.
