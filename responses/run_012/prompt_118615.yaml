  **FENLAND FUTURES TRUST**
  **Annual Report & Welfare Accounts 2023–24**

  **Chair's Letter**
  Welcome to our twentieth year. Traditionally, this letter would celebrate biodiversity gains solely through habitat hectares and species counts. Following the board's resolution to adopt Wild Animal Welfare Accounting (WAWA), our reporting now reflects the ethical complexity of restoration. We believe donors deserve transparency not only on how many animals we bring into existence, but on the quality of lives they can expect to lead. This shift requires us to confront uncomfortable arithmetic alongside our usual optimism. We remain committed to the wetlands, but we must also be committed to the truth of what wetlands entail.

  **Impact at a Glance**

  | Metric | 2022–23 | 2023–24 |
  | :--- | :--- | :--- |
  | Hectares Restored | 12 | 15 |
  | Volunteers Engaged | 140 | 165 |
  | Commemorative Benches Installed | 4 | 6 |
  | **Estimated Vertebrate Lives Created** | **N/A** | **450,000 (±200%)** |
  | **Estimated Pre-Reproductive Mortality** | **N/A** | **427,500 (95% CI)** |
  | **Net Welfare Balance** | **N/A** | **-12,400 Units*** |

  *\*Negative balance indicates aggregate suffering exceeds aggregate flourishing based on current sentience weighting.*

  **The New Marsh**
  The northern expansion is complete. Reeds were planted in March, and water levels were stabilized by May. This habitat is highly productive, specifically for amphibians employing r-selected reproductive strategies. While this indicates ecological success, our welfare models suggest a high cost. We estimate 300,000 common frog spawn were deposited this season. Based on regional predation rates and desiccation risks, approximately 90% will perish within eight weeks, primarily via starvation or predation. The new boardwalk allows donors to view these spawning grounds; we ask visitors to reflect on the trade-off between existence and suffering inherent in what they see. We do not yet know if creating a life likely to end badly is a net harm to the individual, but our accounting standards currently treat it as a liability.

  **Predator-Management Pilot**
  > *Discreet Intervention Log*
  > **Objective:** Reduce suffering rates among larval amphibians.
  > **Action:** Non-lethal heron deterrence installed in Zone B.
  > **Ethical Note:** Intervention in predation remains controversial among trustees. Some argue predation is a natural harm we should mitigate; others argue intervention risks ecosystem collapse. We have proceeded cautiously. No herons were harmed, though feeding efficiency was reduced. We are monitoring whether displaced predators increase suffering elsewhere (leakage risk). Current data is inconclusive.

  **Looking Ahead**
  Our goal for the coming year is to refine the sentience coefficients for invertebrates. Currently, we assume a 10% capacity for suffering for zooplankton, but epistemic uncertainty remains high. If invertebrate sentience is confirmed, our Net Welfare Balance may shift drastically negative, despite positive biodiversity outcomes. We are also reviewing our fundraising strategy. It has been noted that donors purchase reeds and benches, not arithmetic on how newts die. We must determine whether our mission is to maximize happy animals, minimize suffering animals, or simply maximize habitat regardless of the inhabitants' experience. Until this is resolved, our targets will remain provisional.

  **Footnote**
  ^1 *Trustee J. Armitage dissents from the publication of the Net Welfare Balance. He argues that highlighting the probability of suffering among restored fauna undermines donor confidence and that the metrics imply a precision we do not possess. He further asks whether the charity's goal is now to reduce animal populations rather than restore them, and suggests this question be answered before the next appeal letter is drafted.*

  ***

  **Note on Satire and Substance**

  This piece leans heavily on the "intuition pump" arguments within Wild Animal Welfare (WAW) ethics, specifically the claim that wild lives are net negative due to high juvenile mortality (r-strategists). In reality, this is deeply contested; many ecologists and ethicists argue we lack the data to assess net welfare, and some posit that life is generally worth living despite suffering. The satire exaggerates the feasibility of measurement; no charity currently attempts this because the "confidence intervals" are indeed too large to be useful. The predator management section reflects a real rift in the WAW community: some advocate for intervening in predation, while others warn against the hubris of managing complex systems. The dissenting footnote highlights the institutional tension: conservation relies on the "more nature is good" heuristic, which welfare accounting directly destabilizes. The report treats the framework as adopted policy to expose the friction, not to suggest it is a workable standard.
