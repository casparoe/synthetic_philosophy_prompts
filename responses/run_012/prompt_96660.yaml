          *   *Colleague's Conclusion:* Needs the "self-rule" reading.
          *   *Democratic Risk:* If the "self" is the polity, does the past polity rule the present? That looks like surrender of popular sovereignty.

  5.  **Refining the "Undercutting" Flag:**
