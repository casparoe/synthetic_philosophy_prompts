          *   *Analysis:* This is the core axiom of tranquilism. Is craving *always* suffering? Phenomenologically, often yes (lack, tension). But is it *identical* to suffering?
          *   *Verdict:* Right but for a bad reason / Overgeneralization. It conflates the *presence* of a desire with the *pain* of unsatisfied desire.
      *   **(2) Nadia: View says nothing about pleasure. No craving + no pleasure vs. Some craving + joy.**
          *   *Analysis:* Strong point. Tranquilism is negative utilitarian. It needs to account for why positive pleasure doesn't add value. The comparison case is intuitive.
