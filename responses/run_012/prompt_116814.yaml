      *   **(3) Sam: Joy is contaminated (relief of scratching). Quiet is the point.**
          *   *Analysis:* This is the "relief theory" of pleasure (Schopenhauer/Freud). Is all pleasure relief? No. There are "pleasures of abundance" vs. "pleasures of relief."
