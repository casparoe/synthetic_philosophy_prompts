          *   *Brother-in-law (BIL):* Actuary/Insurance pricer, skeptical. Argues the reference class is arbitrary ("made up"). Points out selection bias (registry patients are referred/sicker vs. Dad's incidental finding).
      *   **The User's Questions:**
          1.  Is the BIL right that the 5% is meaningless?
          2.  If not, what is the number a fact about?
          3.  What should the cardiologist have said instead?
