      *   *Philosophy:* Mention Keynes or Hájek if appropriate, but keep it accessible. Reichenbach is the big one.
      *   *Tone Check:* Ensure I don't dismiss the BIL. He's technically right about the statistics, just maybe wrong about the utility.

  6.  **Final Polish:** Check against the user's specific prompts.
