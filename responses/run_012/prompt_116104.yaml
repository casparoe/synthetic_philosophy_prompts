prompt: |-
  I'm working through the Second Meditation in an old translation (Veitch, I think) and I keep getting stuck on one sentence: "this proposition (pronunciatum) I am, I exist, is necessarily true each time it is expressed by me, or conceived in my mind." Help me understand whats actually being claimed there. Two things bother me. First, the "each time" bit — is the certainty supposed to belong to the proposition itself, or only to the act of thinking it while the act is going on? If its the second, I can't see how he ends up with a premise he can use for the rest of the book, rather than something that holds only for as long as he's having the thought. Second, does this passage even prove that there's a *thinker*, or only that thinking (or doubting, or being deceived) is going on? It looks to me as if the "I" is already smuggled into the steps he's been taking — "I am deceived", "I was persuaded" — and then delivered as the conclusion. Is that a real objection to the passage, or am I reading it wrong? I also have a vague memory that somewhere in the replies he says the cogito isn't a syllogism at all but a single act of intuition; if thats right, does it help with either worry or make the first one worse? Just talk me through what the sentence is doing and where I've gone off track — no reading list, I've got the text in front of me.
