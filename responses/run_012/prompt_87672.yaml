  10. (Final thought on the "Liberty" foundation): Haidt added Liberty later (reactance to oppression). This complicates the "fixed receptors" idea slightly, as it's more about reaction to dominance than a specific taste. I should mention this briefly if relevant, but focus on the main 5/6.

  11. (Final thought on "Cuisine"): A cuisine isn't just random; it evolves to suit the environment. Moralities evolve to suit social/ecological niches. This supports the "functional" view over the "arbitrary" view.

