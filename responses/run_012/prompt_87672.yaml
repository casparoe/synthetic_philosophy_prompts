          *   *Impact on User's Argument:* High. It opens the door to empirical evaluation of moral systems.
      *   *Break 3: Individual Preference vs. Collective Requirement.* Taste is often individual (I hate cilantro). Morality is binding (You *must* not kill).
          *   *Implication:* Disagreement about food is low stakes. Disagreement about morality is high stakes.
          *   *Impact on User's Argument:* Medium. It makes the "get off your high horse" advice harder to swallow when stakes are high.
      *   *Break 4: Plasticity.* Taste buds are fairly fixed (though sensitivity varies). Moral foundations are calibrated heavily by culture (Haidt admits this).
          *   *Implication:* The "tongue" isn't as static as the analogy suggests.

  4.  **Evaluate the Friend's Critique (Biology/Philosophy):**
      *   *Is it fair?* Yes. Evolutionary psychology posits that these modules evolved *because* they solved adaptive problems. They aren't arbitrary randomizers; they are solutions.
      *   *Does it matter?* Yes. If the foundations track "social nutrition" (group cohesion, cooperation), then a moral system that ignores too many foundations might "starve" the society (Haidt's argument about liberals ignoring Loyalty/Authority/Sanctity).
      *   *Harm Question:* Bitter greens aren't harmful (subjective dislike). Purity codes *can* cause harm (oppression). This is a disanalogy. Food preferences rarely harm others; moral codes often do. This weakens the "live and let live" conclusion.

  5.  **Verdict on the Conclusion ("Psychology tells us nothing about who's right"):**
      *   *Does it survive?* Barely, or only in a limited sense.
      *   *Nuance:* MFT shows *why* people disagree (descriptive). It does not strictly prove *no one is right* (meta-ethical). However, it does suggest that *one-sided* moralities are unstable.
      *   *Better Conclusion:* Not "no one is right," but "everyone is partially right, but incomplete." Or "Different contexts require different moral nutrients."
      *   *Is MFT purely descriptive?* Haidt tries to bridge to normative (e.g., "diversity of moral matrices is good for society"), but strictly speaking, is-ought gap applies. The analogy tries to bridge that gap but leaks.

  6.  **The Elephant and the Tongue (Consistency Check):**
      *   *Elephant:* Intuition (automatic) vs. Rider (reasoning). Reason serves intuition.
