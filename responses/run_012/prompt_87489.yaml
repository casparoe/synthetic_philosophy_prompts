  8.  (Reviewing against safety guidelines): No sensitive topics. Purely academic philosophy. Safe to proceed.

  9.  (Final check on Kripke's specific view): Kripke argues that "Nixon might not have been Nixon" is false. Identity is necessary. Origin is essential. Is it conceptual? Kripke argues against the "cluster concept" theory. He thinks names are rigid designators. The necessity flows from the metaphysics of identity, not the meaning of the name. So the note is definitely wrong there.

