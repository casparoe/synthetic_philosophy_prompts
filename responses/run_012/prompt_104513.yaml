  Thinking Process:

  1.  **Analyze the Request:**
      *   **Core Concept:** A craft tradition where designs are fixed except for specific "knobs" (parameters). Creativity exists only within these constraints.
      *   **System:** Makers have a "lifetime deviation budget" (ledger) tracking how far they drift from the ancestral spec. Unused units can be gifted/bequeathed.
      *   **Conflict/Plot:** The protagonist discovers something about the space of knobs (e.g., a fixed quantity is actually a knob, a parameter is pinned, etc.).
      *   **Twist/Sting:** The founding spec was itself a variation on an earlier spec, uncounted against anyone's budget.
      *   **Themes:** Variation vs. new thing, discovery vs. convention, materiality.
      *   **Tone:** Serious, tactile, specific (no spelled-out morals).
      *   **Length:** Around 1500 words.
      *   **Craft Choice:** Needs to be physical and specific. Let's choose **bell casting**. It involves geometry, acoustics, metal, heat, and precise measurements. It feels ancient and rigid.

  2.  **World-Building & Mechanics:**
