answer: |-
  The wax model sat on the turntable, smelling of beeswax and turpentine. Kaelen ran the calipers over the sound bow, the thickest part of the bell's waist. The number stared back: 42.03 millimeters. The Prime Spec demanded 42.00.

  Three hundredths of a millimeter. In the Ledger of Tolerances, that was three points. Kaelen had forty-two points left in her lifetime budget. She could spend them. But every maker knew that the big commissions—the cathedral replacements, the civic clocks—required a reserve. If you burned your budget on a parish bell, you were a journeyman forever.

  She dipped the stylus in red ink. She hovered over the page.

  The workshop of Vanden Hull was three hundred years old, bound by the Prime Spec of 1724. The Spec was a single sheet of vellum, laminated in resin, listing the immutable geometry of the bell. The outer profile was a locked curve. The alloy was locked at 78% copper, 22% tin. The only creativity allowed lived in the knobs: the thickness of the wall, the height of the crown, the cooling rate of the pit. These were the variables. These were what you paid for.

  Kaelen didn't dip the stylus. She wiped the calipers instead.

  The commission was problematic. The Old Tower Bell, cast in 1690, had cracked. The city wanted a replacement that matched the old voice exactly. But the Old Tower Bell predated the Prime Spec. It was an orphan of the pre-constitution era. When Kaelen had measured its fragment, the acoustic profile didn't match the Spec's harmonic series. To match the old bell, she would have to drift from the Spec by nearly twenty points. That was half her budget on a single cast.

  Her master, Oren, had told her to match the Spec, not the bell. "The Spec is the truth," he had said, tapping the laminated sheet. "The old bell was a mistake. That's why we wrote the Spec."

  But Kaelen had heard the Old Tower Bell ring before it cracked. It didn't sound like a mistake. It sounded like a voice that knew where it was going.

  She went down to the crypt beneath the foundry. This was where the molds of the dead were kept, stacked like coffins. She was looking for the mold of the Founder, Elias Vanden Hull. According to the lineage, Elias had cast the Prime Bell in 1724, measured it, declared it perfect, and froze the dimensions forever. Zero deviation. The origin point.

  She found the crate marked *EH-01*. Inside was not a mold, but a broken core. The inner clay form around which the wax was modeled.

  Kaelen set up her laser scanner. The Prime Spec defined the outer profile strictly, but the inner profile was assumed to be a simple inverse, maintained by a standard core thickness. It wasn't a knob. Core thickness was structural, not acoustic. Everyone knew that. You didn't spend budget on the core; you spent it on the wall.

  The scanner hummed. The topography map appeared on her tablet.

  Kaelen frowned. She ran the comparison algorithm against the Prime Spec's theoretical core.

  The deviation was massive. The Founder's core wasn't a simple inverse. It was undercut. A subtle hollow behind the sound bow, a negative space that shifted the nodal points of the vibration.

  She checked the Ledger. The entry for EH-01 read: *Deviation: 0.00.*

  Elias hadn't spent any budget. Because the budget didn't exist yet. He had cast the bell, liked the sound, and then written the Spec based on the *outer* measurements, ignoring the trick he'd played on the *inner* core. He had turned a knob that nobody knew was a knob, and then he locked the door behind him.

  For three hundred years, makers had spent their precious lifetime budgets tweaking wall thickness and crown height, fighting over microns on the surface, while the actual secret of the sound lay in the hollow clay that was thrown away after the pour. They were polishing the handle of a door that was already open.

  Kaelen returned to the workshop. The wax model waited.

  If she matched the Spec, the bell would be legal. It would be a Vanden Hull bell. It would hang in the Old Tower and sound slightly sharp, slightly thin, and everyone would say, "Well, the old one was cracked, maybe it sounded different," and she would keep thirty-nine points in her budget.

  If she matched the Old Tower Bell, she had to replicate the Founder's undercut. But the Ledger had no column for core curvature. There was no price for it. It was outside the economy. To do it was to admit that the Spec was not a law of physics, but a choice. A variation.

  She picked up the carving tools.

  She began to shave the wax from the inside of the model. She wasn't changing the outer profile. The calipers would still read 42.00. The alloy would still be 78/22. To the inspectors, to the Ledger, she was casting a perfect Prime Spec bell. Zero deviation.

  But she was hollowing the core. She was spending nothing.

  As she carved, the wax curls fell onto her apron. She thought about the makers who had come before her. Master Oren, who had saved his budget for forty years only to spend it all on a single haunch adjustment for a clock tower bell, proud of his precision. He had died thinking he had pushed the craft to its limit. He had never touched the clay.

  Kaelen finished the model. It looked identical to the standard. She invested it in the ceramic shell, burned out the wax, and poured the bronze. The heat was a physical wall, pushing her back. The metal flowed into the hollow she had carved, filling the negative space that the Spec said shouldn't exist.

  When the bell cooled, she broke the shell. The bronze hung dark and hot.

  She struck it with the tuning mallet.

  The note bloomed. It wasn't the bright, brittle chime of the Spec bells. It was the deep, mournful hum of the Old Tower. It matched the fragment in the crypt. It matched the Founder's intent, not his paperwork.

  She dragged the bell to the tuning lathe. She needed to log the finish. Even if the core was hidden, the final tuning involved removing metal from the inside. That counted against the budget.

  She opened the Ledger. The page for *Kaelen, Vanden Hull* waited.

  She looked at the column for *Wall Thickness Deviation*. She could log the removal of metal here. It would cost her five points. A reasonable sum.

  Or she could leave it blank.

  If she logged it, she acknowledged the system. She admitted that she was varying the Spec to achieve the sound. If she left it blank, she claimed the bell was exactly to Spec. But if anyone ever measured the core—if anyone ever broke a bell open to see why it sang—they would know the Spec was a lie.

  She looked at the bell. The bronze was still warm.

  The Founder had spent no budget because there was no budget. He had invented the game and given himself a free move. Kaelen was not the Founder. She was a player. But the board was smaller than they told her.

  She dipped the stylus.

  She wrote *0.00* in the deviation column.

  It was a lie. But it was the same lie Elias had told. The Spec was not the origin; it was a variation on an earlier truth that had been buried under the clay. By logging zero, she wasn't hiding a deviation. She was restoring the baseline. She was balancing the ledger across three centuries.

  She closed the book. The ink was still wet.

  Outside, the crane lifted the bell. It swung into the air, heavy and silent. When it reached the tower, when the rope was pulled and the clapper struck the sound bow, the hollow behind the bronze would do the work. The air would vibrate according to the secret geometry, not the public law.

  Kaelen wiped the wax from her hands. She had forty-two points left. She could spend them on nothing, now. There was nothing left to tweak that mattered. The only knob that worked was the one nobody was allowed to touch.

  She placed the Ledger back on the shelf, next to the calipers. She would teach her apprentice to measure the wall. She would teach her to respect the Spec. And when the apprentice was ready, when she had saved her budget and earned her right to cast, Kaelen would take her down to the crypt. She would show her the mold of EH-01.

  She would show her that the zero point was arbitrary.

  For now, the bell rang. It sounded like the past, and it sounded like the future, and it cost nothing at all.
