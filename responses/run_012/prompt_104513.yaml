      *   **The Spec:** The "Prime Hum." A specific profile, alloy ratio, and cooling curve.
      *   **The Knobs:** Wall thickness at the sound bow, copper content, cooling rate.
      *   **The Budget:** "Tolerance Units" (TUs). Measured in microns or percentage points.
      *   **The Ledger:** A physical book tracking every maker's spend.
      *   **The Protagonist:** Elara, a senior caster nearing the end of her budget.
      *   **The Discovery:** A parameter thought fixed (maybe the inner profile curve) is actually the key, or the founding spec itself is revealed as a deviation. Let's go with the twist: The founding spec was a variation.
      *   **The Conflict:** Elara needs to cast a bell for a specific purpose (maybe a replacement for a cracked one) but the strict specs won't allow the acoustic match unless she breaks a rule or discovers the truth.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the tactile nature of the craft and the rigidity of the rules. Introduce Elara and the Ledger. Show the "knobs."
      *   **Inciting Incident:** A commission comes in. A bell needs to be recast. But the old bell doesn't match the Prime Spec perfectly.
      *   **Rising Action:** Elara investigates the old bell. She measures it against the Spec. She realizes the discrepancy. She checks the Ledger.
