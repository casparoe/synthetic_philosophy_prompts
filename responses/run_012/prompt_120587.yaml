          *   If my 70-year-old self counts equally to my 35-year-old self (C1), why does the *order* matter (C4)?
          *   Actually, C1 is about *discounting* (weight), C4 is about *configuration* (value). They can coexist logically (equal weight per unit, but units arranged differently have different total value).
          *   *However*, C1 says "I don't see why my 70-year-old self should count for less... just because he comes later." C4 says "I'd rather the last chapter be the strong one."
