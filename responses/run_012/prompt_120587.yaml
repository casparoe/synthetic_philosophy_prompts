      *   **Tension B: C1 (Temporal Neutrality) vs. C5 (Partiality).**
          *   C1 says future people (2200) count equally to present people. C5 says daughter counts more than future strangers.
          *   This is the classic Partiality vs. Impartiality debate.
          *   C1 implies impartiality across time. C5 implies partiality across persons.
