      *   **C3 (Risk-Adjusted Discounting):** Only discount future goods based on probability of existence, not pure time preference. Consistent with C1.
      *   **C4 (Narrative Shape / Temporal Holism):** Shape matters (better end > worse end). A life/story going badly then well is better than well then badly, even with same total goods.
      *   **C5 (Partiality):** Special obligations to loved ones (daughter) outweigh strangers (future people). Permissible partiality.

  3.  **Identify Tensions:**

      *   **Tension A: C1 (Temporal Neutrality) vs. C4 (Narrative Shape).**
