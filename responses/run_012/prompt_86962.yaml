  # Seminar Handout: Desiderata for Diachronic Rationality
  **Course:** [Course Name] | **Topic:** Diachronic Rationality & Dynamic Choice

  ## I. The Test Suite (Cases a Theory Must Handle)
  A viable theory must deliver verdicts on the following scenarios that match our pre-theoretic intuitions (or explain why those intuitions are wrong).

  1.  **The Standard Money Pump:** An agent with intransitive preferences ($A \succ B \succ C \succ A$) pays to swap options in a cycle, ending up with their original option minus fees.
      *   *Requirement:* Must identify this as irrational.
  2.  **The Self-Torturer (Quinn):** An agent faces 1,000 settings on a torturer device. At any adjacent pair ($n, n+1$), the gain in money outweighs the imperceptible increase in pain. But setting 1,000 is hell.
      *   *Requirement:* Must explain why taking the next step is irrational *even if* it maximizes utility at that moment.
  3.  **Resolute vs. Sophisticated Choice:** An agent knows their future self will defect on a plan (e.g., Ulysses & the Sirens).
      *   *Requirement:* Must adjudicate whether **Resoluteness** (sticking to the plan despite current preferences) or **Sophistication** (backward induction based on predicted future preferences) is the rational requirement.
  4.  **The Patient Trader (The "Diachronic Squeeze"):** An agent has perfectly acyclic (transitive) preferences at every time slice $t$. However, their preferences shift over time such that a trader can induce a cycle ($A \to B$ at $t_1$, $B \to C$ at $t_2$, $C \to A$ at $t_3$) leaving the agent poorer.
      *   *Requirement:* Must identify what is irrational here. Is it the shifting? The failure to plan? Or is the agent blameless? (Theory cannot say "nothing is wrong" without cost).

  ## II. Conceptual Guardrails (Distinctions to Maintain)
  A theory fails if it collapses the following distinctions.

  1.  **Synchronic Coherence $\neq$ Diachronic Consistency:**
      *   A theory cannot claim that being rational at every $t$ guarantees being rational over $[t_1, t_n]$. (See: *The Patient Trader*).
  2.  **Genuine Cycles $\neq$ Preference Drift:**
      *   A theory must distinguish between a pump driven by static intransitivity (logical error) and a pump driven by endogenous preference change (volitional/planning error).
  3.  **Local Worse-Off $\neq$ Global Worse-Off:**
      *   A theory must account for cases where an agent is never locally worse off (every trade was preferred *ex ante*) but is globally worse off (regret *ex post*). It cannot define welfare solely by the satisfaction of preferences at the time of choice.

  ## III. The Hard Constraint (The Theory Killer)
  **The Self-Torturer Problem.**
  *   **Why:** This is the constraint that rules out the most theories. Standard Expected Utility Theory (EUT) and naive Instrumentalism pass the Money Pump (by forbidding intransitivity) but fail the Self-Torturer. They cannot explain why an agent should stop at setting $n$ when $n+1$ is strictly preferred at $t_n$.
  *   **The Bar:** A theory must explain how a rational agent can reject a locally dominant option to preserve a global good without invoking external moral norms.

  ## IV. The Incompatibility Flag (The "Impossible Trinity")
  *Note for Class Discussion:* You likely cannot hold all three of the following simultaneously. A theory must sacrifice one.

  1.  **Present Preference Sovereignty:** What is good for the agent at $t$ is defined solely by their preferences at $t$.
  2.  **Diachronic Exploitation is Irrational:** Being money-pumped (or squeezed by the Patient Trader) is a mark of irrationality.
  3.  **No External Norms:** Rationality is purely instrumental (about satisfying preferences), not substantive (about what preferences one *should* have).

  *   **The Tension:** If (1) is true, the agent in a Money Pump gets exactly what they want at every step. If (2) is true, they are irrational. If (3) is true, we cannot say their preferences were "wrong."
  *   **Verdict:** Most diachronic theories sacrifice **(1)**. They argue that rationality requires treating future preferences as authoritative *now* (planning agency), violating strict Present Sovereignty.

  ## V. Theory Scorecard
  *Use this grid to evaluate readings (McClennen, Bratman, Gauthier, Sobel, etc.).*

  | Desideratum | Pass | Fail | Qualified | Notes |
  | :--- | :---: | :---: | :---: | :--- |
  | **1. Money Pump** (Identifies irrationality) | $\square$ | $\square$ | $\square$ | |
  | **2. Self-Torturer** (Blocks incremental harm) | $\square$ | $\square$ | $\square$ | *Critical Test* |
  | **3. Resolute Choice** (Permits/Requires binding) | $\square$ | $\square$ | $\square$ | |
  | **4. Patient Trader** (Explains the squeeze) | $\square$ | $\square$ | $\square$ | *New Frontier* |
  | **5. Distinction: Synch/Diach** (Maintains gap) | $\square$ | $\square$ | $\square$ | |
  | **6. Distinction: Local/Global** (Allows regret) | $\square$ | $\square$ | $\square$ | |
  | **7. Cost** (Which principle above is sacrificed?) | N/A | N/A | N/A | *See Section IV* |

  **Instruction for Class:** When a theory claims to "solve" a case, check if it solves it by collapsing a distinction in Section II or by violating the Incompatibility Flag in Section IV.
