prompt: |-
  I'm running a session for our department's cross-disciplinary reading group next month — mostly stats and bio grad students who use Bayesian methods every day but have never read a word of philosophy of science. Topic is the problem of old evidence, about ninety minutes, whiteboard. I dont want the explanation itself, I want the plan: the order the pieces have to go in so the dilemma lands as something they can't wriggle out of, instead of a technicality about P(E) = 1 that they dismiss in five minutes.

  So: what has to be in place before the case can even be stated? My instinct is that they need a firm grip on what confirmation is supposed to be and on conditionalization as the rule for getting it, and then on why the likelihood ratio seems not to have the same problem — tell me if that's the wrong first move or if it's the right move in the wrong place. The one example that carries the whole session: the obvious candidate is Mercury's perihelion, but I suspect that's the wrong carrier for this room — either tell me why it's actually right and what it has that other candidates lack, or pick something better. Either way I need a case where the evidence wasn't just known beforehand but was what the theory was built out of, so that the accommodation issue has teeth. What the example must have, and what it must lack, spelled out.

  Then the escape routes in the order they'll occur to people, with what each one costs: 'what you learn is that the theory entails the fact, and that's itself new information'; 'ask what your credence in the fact would have been before you knew it' (why that isn't free); 'the whole thing is an artifact of idealizing agents as logically omniscient'. I also want the neighbouring issue fenced off rather than blended in — whether accommodating a known fact is worth less than predicting a new one, and the overfitting answer to that — because I'm fairly sure half the room will think that is the old evidence problem. And I want the difference between the version of the problem that's about a real historical episode and the version that's just about one frozen credence function to do actual work somewhere in the sequence; say where it goes and what it buys.

  Misconceptions I expect, and exactly where in the sequence to head each one off: that this is about dogmatic priors and goes away if you're less certain; that setting P(E) below 1 solves it; that it's about the psychology of discovery; that it refutes Bayesianism; that it's the same as the prediction-vs-accomodation thing. Plus what I should openly refuse to go into at this level and say so, and one question to ask at the end that would show the dilemma landed rather than just got written down. No readings — they won't do them.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Stats and Bio grad students. Daily users of Bayesian methods (practitioners), zero philosophy of science background.
      *   **Topic:** The Problem of Old Evidence (POE).
      *   **Format:** 90 minutes, whiteboard, cross-disciplinary reading group.
      *   **Goal:** A *plan* (sequence of moves), not the explanation itself. The dilemma must feel inescapable, not a technicality about $P(E)=1$.
      *   **Specific Constraints/Requirements:**
          *   Determine prerequisites (Confirmation, Conditionalization, Likelihood Ratio).
          *   Select/justify the core example (Mercury's Perihelion vs. something else).
          *   Map escape routes + their costs.
          *   Distinguish POE from Prediction vs. Accommodation (PvA) / Overfitting.
          *   Distinguish Historical vs. Synchronic versions.
          *   Address specific misconceptions (Dogmatic priors, $P(E)<1$, Psychology, Refutation of Bayesianism).
          *   Identify off-limits topics.
          *   Provide a final "check" question.
          *   No readings.

  2.  **Deconstruct the Audience & Problem:**
      *   *Audience:* They think in terms of posteriors, priors, and likelihoods. They likely use MCMC or variational inference. They care about model updating. They might view $P(E)=1$ as a trivial normalization issue.
      *   *Problem:* If $E$ is known, $P(E)=1$. If $H$ entails $E$, $P(E|H)=1$. Bayes Factor = 1. No confirmation. But intuitively, GR *was* confirmed by Mercury.
      *   *Challenge:* Making them feel the tension. If they just say "counterfactualize the prior," they might think it's solved. The goal is to show *why* that's costly or problematic within strict Bayesianism.

  3.  **Drafting the Sequence (The "Order of Pieces"):**

      *   *Phase 1: Setup (The Trap).* Need to establish the Bayesian machinery they use daily, but formalize it enough to spring the trap.
      *   *Phase 2: The Example.* Needs to be construction/accommodation, not just "known beforehand." Mercury is classic but might feel too physics-y for bio/stats. However, the prompt asks to evaluate Mercury. Actually, for *this* group, a model-selection analogy might work better, but Mercury has the historical weight. Let's stick with Mercury but frame it in terms of *model construction* to resonate with stats students. Wait, the prompt asks specifically about Mercury or a better candidate. Mercury is best because the theory (GR) was *constructed* to satisfy known limits (Newtonian), but the Perihelion was *not* used in construction. It's the perfect "old but not used" case. I need to justify why Mercury works better than, say, a bio example where data often leaks into model building.
      *   *Phase 3: The Dilemma.* Show the math. $P(E)=1 \implies P(H|E) = P(H)$.
      *   *Phase 4: Distinguishing PvA.* Crucial. They will confuse "accommodating old data" with "overfitting." Must fence this off early or immediately after the dilemma.
      *   *Phase 5: Escape Routes.* Counterfactuals, Learning the Entailment, Logical Omniscience.
      *   *Phase 6: Historical vs. Synchronic.* This is subtle. Need to place it where it clarifies the escape routes.
      *   *Phase 7: Wrap-up/Check.*

  4.  **Refining the Prerequisites (The "What has to be in place" question):**
      *   User suggests: Confirmation definition, Conditionalization, Likelihood Ratio.
      *   *Critique:* Yes, but specifically *Incremental Confirmation*. They need to accept that confirmation *is* change in credence. If they define confirmation as "high posterior," the problem vanishes. So, Step 1 must lock down "Confirmation = Probability Raise."
      *   *Likelihood Ratio:* Important because they might think LR solves it. LR is 1 if $P(E|H)=1$ and $P(E)=1$. So LR doesn't save them. This needs to be explicit.

  5.  **Selecting the Example:**
      *   *Mercury:* Pros: Historical standard, clear separation between theory construction and evidence. Cons: Physics-heavy.
      *   *Bio/Stats alternative:* Fitting a model to existing genomic data. But usually, in stats, if you use data to build the model, you *can't* use it to confirm (overfitting). This conflates POE with PvA.
      *   *Decision:* Mercury is actually the *right* carrier precisely because it avoids the overfitting trap. In GR, Einstein didn't tune parameters to fit Mercury; the math just spit it out. This isolates the *logical* problem from the *methodological* sin of double-dipping. I need to explain *why* Mercury works: The evidence was old, but the *entailment* was new.

  6.  **Mapping Escape Routes & Costs:**
      *   *Route 1: Counterfactual Priors ("What if we didn't know E?").* Cost: Ill-defined. There is no unique way to strip knowledge.
      *   *Route 2: Learning the Entailment ("I learned H entails E").* Cost: Requires a logic of probability/uncertain logic. Standard Bayes assumes logical omniscience.
      *   *Route 3: Logical Omniscience Relaxation.* Cost: Breaks the standard axioms they use daily. Computationally intractable.

  7.  **Fencing off Prediction vs. Accommodation (PvA):**
      *   This is the biggest risk. Stats students think "Accommodation = Overfitting = Bad." POE says "Accommodation = Confirmatory."
      *   *Placement:* Immediately after stating the problem. "This is not about overfitting."
      *   *Distinction:* PvA is about *reliability/process*. POE is about *updating logic*.

  8.  **Historical vs. Synchronic:**
      *   *Historical:* Einstein in 1915.
      *   *Synchron:* Us, today, evaluating GR.
      *   *Placement:* Use this to evaluate the Escape Routes. Counterfactuals work for Historical, fail for Synchronic.

  9.  **Addressing Misconceptions:**
      *   *Dogmatic Priors:* No, it happens even with diffuse priors.
      *   *P(E) < 1:* If you know it, it's 1. If you pretend it's <1, you're lying.
      *   *Psychology:* It's about normative rationality, not feelings.
      *   *Refutes Bayesianism:* No, it shows a limit/idealization.

  10. **Final Check Question:**
      *   Needs to force a choice between the "logic" and the "practice."
      *   "If you run an analysis on data you've already seen, does your posterior *actually* update, or are you just calculating what you should have believed?"

  11. **Review against Constraints:**
      *   90 mins? Yes, the flow fits.
      *   Whiteboard? Yes, needs equations.
      *   No readings? Acknowledged.
      *   Order of pieces? Structured.
      *   Example justification? Included.
      *   Escape routes + costs? Included.
      *   PvA fencing? Included.
      *   Historical vs. Synchronic? Included.
      *   Misconceptions? Mapped to sequence.
      *   Off-limits? Need to specify (e.g., specific solutions like Garber's formalism).

  12. **Polishing the Plan:**
      *   Make the "Hook" strong. Start with their practice.
      *   Ensure the "Math Trap" is visual on the whiteboard.
      *   Make sure the distinction between "Confirmation as High Probability" vs "Confirmation as Probability *Change*" is the very first brick. If they miss this, the session fails.

  13. **Self-Correction on "Likelihood Ratio":**
      *   The user asked if starting with Likelihood Ratio is the right move.
      *   *Thought:* If I start with LR, they might think $P(E|H)/P(E|\neg H)$ solves it. But if $P(E)=1$, then $P(E|\neg H)$ is also 1 (if E is a tautology/logical truth for the agent). Actually, if $E$ is known, $P(E)=1$. If $H$ entails $E$, $P(E|H)=1$. If $\neg H$ also entails $E$ (or $E$ is just true), $P(E|\neg H)=1$. Ratio = 1.
      *   *Better move:* Start with Conditionalization ($P(H|E) = P(H)$). It's more direct. LR is a derivative concept. Stick to Conditionalization for the trap, use LR to show it doesn't help later.

  14. **Finalizing the Example Argument:**
      *   Why Mercury? Because in Bio/Stats, "old evidence" usually means "data used for model selection." That *is* overfitting. Mercury is special because the theory *could not* have been tuned to it (the math wasn't there). This purity is essential. I must emphasize this "non-tunability."

  15. **Structuring the Output:**
      *   Follow the user's requested structure (Prerequisites, Example, Escape Routes, PvA, Historical/Synchronic, Misconceptions, Off-limits, Final Question).
      *   Keep tone professional, direct, and instructional.

  ( Self-Correction during drafting ): Make sure to explicitly answer the user's specific question about whether their instinct on prerequisites is right.
  *User Instinct:* "firm grip on confirmation... conditionalization... why likelihood ratio seems not to have the same problem."
  *My Verdict:* Mostly right, but the LR part is a trap. They need to see LR *fails* too. So the prerequisite is "Confirmation = Change," not LR. I will correct this in the plan.

  (Refining the "Historical vs Synchronic" placement):
  The user wants this to "do actual work." It should be the tool used to evaluate the Escape Routes. Route 1 (Counterfactual) works for Historical, fails for Synchronic. Route 2 (Entailment) works for Synchronic, requires new formalism. This is the pivot point.

  (Refining the "Off-limits"):
  Don't get into Garber's formal language or specific Jeffrey Conditionalization math. Keep it conceptual.

  (Refining the Final Question):
  Make it personal to their work. "When you check model fit on training data..."

  Okay, ready to write.
answer: |-
  Here is the session plan. It is designed to tighten the screws gradually so that by minute 60, the "technicality" objection feels like a dodge rather than a solution.

  ### 1. The Prerequisites (Minutes 0–15)
  **Your instinct is half-right.** You need **Conditionalization** and **Confirmation as Probability-Raise**, but do *not* start with the Likelihood Ratio. If you introduce the Likelihood Ratio early, they will treat it as a savior (thinking $P(E|H)$ does the work) and miss the trap.

  **The Sequence:**
  1.  **Define Confirmation Operationally:** Ask them to define confirmation. If anyone says "High posterior probability," stop them. Force the definition: **$H$ is confirmed by $E$ iff $P(H|E) > P(H)$.** (Incremental confirmation). Write this on the board. Box it. This is the rule of the game.
  2.  **The Update Rule:** Write Bayes' Theorem in the odds form or standard form. Highlight that updating *requires* $P(E) < 1$. If $P(E) = 1$, the posterior equals the prior.
  3.  **The "Known Evidence" Constraint:** Establish that for a rational agent, if you know $E$ is true, your credence $P(E)$ must be 1. (If they argue $P(E) = 0.99$, ask them if they are willing to bet at 99:1 odds. If not, they don't *know* it. If yes, they are treating it as true for decision making).

  **Why this order:** If you don't lock down "Confirmation = Change" first, they will slide into "Confirmation = High Posterior" when the trap springs, which dissolves the problem instantly.

  ### 2. The Core Example (Minutes 15–30)
  **Stick with Mercury's Perihelion.** Do not switch to a bio/stats example.
  **Why:** In stats/bio, "using old data" usually means "data used for model selection," which *is* overfitting (double-dipping). Your students will immediately conflate POE with methodological sin.
  **Mercury works because:**
  *   **It must have:** The evidence ($E$) was known long before the theory ($H$). The theory was *not* constructed to fit $E$ (Einstein didn't tune parameters to match the 43 arcseconds; the equations simply yielded it). This isolates the *logic* of confirmation from the *process* of model fitting.
  *   **It must lack:** Any ambiguity about whether the data was "used." In bio, we often don't know if a model was tweaked on the test set. With GR, the history is clear: $E$ was old, $H$ was new, $H$ entails $E$.

  **The Move:**
  1.  Lay out the history: 1859 (Le Verrier finds anomaly), 1915 (Einstein derives GR).
  2.  State the relation: GR entails the Perihelion shift.
  3.  Apply the Prerequisites:
      *   In 1915, $P(\text{Perihelion}) = 1$ (It was known fact).
      *   Therefore, $P(\text{GR} | \text{Perihelion}) = P(\text{GR})$.
      *   **Result:** GR received *zero* confirmation from its greatest empirical success.
  4.  **The Squeeze:** Ask: "Did Einstein have zero reason to increase confidence in GR when he saw the math match Mercury?" They will say "Of course not." You say: "Then your practice violates your update rule."

  ### 3. Fencing Off Prediction vs. Accommodation (Minutes 30–40)
  **Do this immediately after the dilemma lands.** Half the room will try to escape by saying "Accommodating data is worth less than predicting it" or "That's just overfitting."

  **The Distinction:**
  *   **Prediction vs. Accommodation (PvA):** A claim about *reliability*. (Predicting new data is harder, so success is more trustworthy). This is about *process*.
  *   **Old Evidence (POE):** A claim about *logic*. (Even if the accommodation is perfect and non-arbitrary, the math says no update occurs).
  *   **The Whiteboard Move:** Draw two columns.
      *   *Left (PvA):* "Did the scientist cheat/tune parameters?" (Mercury: No).
      *   *Right (POE):* "Was the fact known?" (Mercury: Yes).
  *   **The Point:** Tell them: "Even if I guarantee you Einstein didn't overfit, even if the likelihood ratio is massive, standard Bayesianism says you cannot update on a certainty. POE is not about the *value* of the evidence, it's about the *possibility* of the update."

  ### 4. The Escape Routes & Their Costs (Minutes 40–70)
  Present these as "ways out," but force them to pay the toll for each.

  **Route 1: The Counterfactual Prior ("Strip the knowledge")**
  *   *The Move:* "We calculate what our credence in $E$ *would have been* had we not known it."
  *   *The Cost:* **Arbitrariness.** There is no unique way to subtract knowledge. Do we strip just Mercury? Or all celestial mechanics? Different "stripping" yields different confirmations.
  *   *Where it breaks:* It works for the **Historical** version (what should Einstein have done?), but fails the **Synchronic** version (what should *we* believe today?). We cannot pretend *we* don't know Mercury's orbit.

  **Route 2: Learning the Entailment ("I learned H entails E")**
  *   *The Move:* "I didn't learn $E$ (I knew it). I learned the logical connection $H \to E$."
  *   *The Cost:* **Logical Omniscience.** Standard Bayesianism assumes if you know $H$, you know all logical consequences of $H$. To say "I learned $H \to E$" admits that agents are *not* logically omniscient.
  *   *Where it breaks:* It requires rewriting the axioms of probability to allow uncertainty about logic. This breaks the formalism they use daily (where $P(H \land \neg H) = 0$ is absolute).

  **Route 3: Relaxing $P(E)=1$ ("Jeffrey Conditionalization")**
  *   *The Move:* "We never really have $P(E)=1$. We just have very high confidence."
  *   *The Cost:* **Dogmatism/Distortion.** It forces you to lie about your epistemic state. If you are willing to bet your life on $E$, setting $P(E)=0.99$ is mathematically convenient but philosophically dishonest. Also, it doesn't solve the synchronic problem for logical truths.

  **The Historical vs. Synchronic Pivot:**
  Use this distinction to evaluate the routes.
  *   Ask: "Are we solving for Einstein (Historical) or for us evaluating GR today (Synchronic)?"
  *   *Route 1* solves Historical, fails Synchronic.
  *   *Route 2* solves Synchronic, breaks the axioms.
  *   *Point:* You can't have a single Bayesian account that handles both without cost.

  ### 5. Misconceptions & Interventions
  **Map these to the specific minutes where they will arise:**

  *   **"It's about dogmatic priors."** (Minute 25)
      *   *Intervention:* "No. Even with a flat prior on GR, if $P(E)=1$, the posterior equals the prior. The prior value doesn't matter; the update mechanism is broken."
  *   **"Just set $P(E) < 1$."** (Minute 45, Route 3)
      *   *Intervention:* "If you know $E$, $P(E)=1$ is a requirement of rationality, not a parameter you can tune. If you set it to 0.9, you are modeling a different agent, not yourself."
  *   **"It's about the psychology of discovery."** (Minute 35)
      *   *Intervention:* "Bayesianism is normative (how you *should* reason), not descriptive (how you *feel*). The problem is that the norm forbids what intuition demands."
  *   **"It refutes Bayesianism."** (Minute 70)
      *   *Intervention:* "No. It refutes *idealized* Bayesianism. It shows that the assumption of Logical Omniscience is the leak. It's a bug report, not a crash."
  *   **"It's the same as Prediction vs. Accommodation."** (Minute 35)
      *   *Intervention:* (See Fencing Off section above). "PvA is about trust in the scientist. POE is about the math of the update."

  ### 6. Off-Limits Topics
  **State these explicitly at the start or when they arise to save time:**
  1.  **Formal Solutions (e.g., Garber's Language):** Do not write down the formal language solutions where $H \to E$ is treated as a new sentence. It's too technical and distracts from the conceptual dilemma.
  2.  **Non-Bayesian Confirmation Theory:** Do not let them drift into Likelihoodism or Error Statistics as "better" solutions. Keep the focus on *internal* Bayesian consistency.
  3.  **Specific Priors:** Do not let them argue about what Einstein's specific prior for GR was. The problem holds for *any* prior.

  ### 7. The Final Check Question (Minute 85–90)
  Do not ask "Do you understand?" Ask a question that forces them to apply the dilemma to their own work.

  **The Question:**
  > "When you run a posterior predictive check on data you've already seen to validate a model, and the fit is perfect: strictly speaking, according to the update rule we wrote down at the start, have you gained *any* confirmation for that model? Or are you just calculating what your credence *should have been* last week?"

  **What this tests:**
  *   If they say "I gained confirmation," they admit their practice violates the standard Bayesian update rule (POE wins).
  *   If they say "No confirmation," they admit Bayesianism fails to capture the value of model checking on known data (Bayesianism loses).
  *   If they say "It depends on counterfactuals," ask them to write down the probability space for that counterfactual. (They can't).

  This leaves them with the dilemma active in their own daily work, rather than as a historical curiosity about Einstein.
