  Secure physical causal closure to distinguish epiphenomenalism from generic dualism, then deploy direct cortical stimulation to isolate the causal worry before pivoting to introspection to generate the epistemic worry, forcing the paradox to emerge as a structural tension rather than a refutation.

  **1. Sequence and Dependencies (0–20 minutes)**
  You must secure **Physical Causal Closure** before defining the view, because graduate cognitive science students often conflate epiphenomenalism with interactionist dualism. If they believe mental events can physically influence neural activity, the position collapses into generic dualism. State clearly: *Every physical event has a sufficient physical cause.* Once this is accepted, define epiphenomenalism not as "mind doesn't exist" (eliminativism) but as "mind exists but exerts no physical force." This dependency prevents the misconception that epiphenomenalism denies consciousness.
  *   **Head Off Misconception (Anticipated): "Epiphenomenalism is just dualism."**
      *   **Where:** Immediately after defining Physical Causal Closure.
      *   **What to say:** "Interactionist dualism violates causal closure; epiphenomenalism preserves it by rendering the mental a downstream effect. They are mutually exclusive regarding causal power."
  *   **Head Off Misconception (Unanticipated): "Epiphenomenalism denies consciousness exists."**
      *   **Where:** During the definition of the view.
      *   **What to say:** "Eliminativism says the pain is an illusion; epiphenomenalism says the pain is real but causally inert. You still suffer; the suffering just doesn't move your lips."

  **2. Case Selection and the Causal Worry (20–40 minutes)**
  Nominate **Direct Cortical Stimulation** (Penfield-style) rather than Phantom Limb Pain or Philosophical Zombies. Phantom limb pain introduces confounds regarding body schema and representational error that distract from the causal structure; students may argue the report is about the *representation* rather than the *qualia*. Philosophical Zombies should not be the carrier because they are conceivability arguments used to *argue for* dualism, whereas this session requires an actual mechanism to illustrate the *consequences* of dualism; zombies presuppose the separability of function and phenomenology before the position is defined, risking circularity. Direct cortical stimulation isolates the "common cause" structure cleanly: the electrode causes the neural activity, which causes both the report ("I feel pain") and the feeling (pain), but the feeling causes nothing.
  *   **Head Off Misconception (Anticipated): "Qualia which cause nothing might as well not exist."**
      *   **Where:** After presenting the stimulation case.
      *   **What to say:** "Evolution selects for the neural cause because it drives behavior; the qualia are a byproduct of that neural complexity. They exist as properties of the system, even if they don't drive the system."
  *   **Head Off Misconception (Unanticipated): "Epiphenomenalism implies we are automatons."**
      *   **Where:** During the discussion of the stimulation case.
      *   **What to say:** "You are not a zombie; you feel the pain. The automaton objection confuses the *presence* of experience with the *efficacy* of experience."

  **3. Generating the Epistemic Worry and Paradox (40–60 minutes)**
  To force the separation of the causal and epistemic worries, do not introduce them simultaneously. First, establish the **Causal Worry**: *If the pain causes nothing, how does the report align with the pain?* (Answer: Common cause). Once students accept this alignment is possible via common cause, pivot to the **Epistemic Worry**: *If the pain causes nothing, how do you **know** the pain is there to report on?* This sequence forces the realization that causal inertness threatens knowledge, not just behavior. If you raise the epistemic worry first, students will collapse it back into the causal worry; by securing the causal explanation (common cause) first, the epistemic gap stands alone as a problem of justification.
  *   **Head Off Misconception (Anticipated): "Introspection is being treated as infallible."**
      *   **Where:** When raising the epistemic worry.
      *   **What to say:** "The paradox does not require infallibility, only reliability. If the experience causes nothing, it cannot reliably cause the belief that it exists."
  *   **Head Off Misconception (Anticipated): "The paradox is a refutation rather than a demand for a specific repair."**
      *   **Where:** After stating the paradox.
      *   **What to say:** "A paradox indicates a broken link in our theoretical framework, not necessarily a false conclusion. The task is to identify which premise requires modification, not to discard the view immediately."

  **4. Closing Question and Omissions (60–90 minutes)**
  Finish with this single closing question to test grasp of the paradox as a live problem: **"If you reject epiphenomenalism to preserve knowledge of consciousness, which premise of the paradox must you deny, and what cost does that exact on your physicalist ontology?"** This forces them to choose between abandoning causal closure (dualism), denying knowledge (skepticism), or redefining judgment (non-causal accounts), demonstrating they see the structural trade-offs.
  *   **What to Leave Out:** Explicitly refuse to cover the finer points of the **causal-exclusion literature (e.g., Kim's arguments)**. At this level, detailed exclusion arguments conflate the metaphysical possibility of epiphenomenalism with the empirical likelihood, which distracts from the conceptual paradox of judgment. Also omit **panpsychism** as a solution; it introduces new metaphysical baggage that obscures the specific tension between judgment and causation. Do not debate **interactionist dualism defenses** (e.g., conservation of energy violations); accept causal closure as a working constraint for cognitive science to keep the focus on the epistemic paradox.
