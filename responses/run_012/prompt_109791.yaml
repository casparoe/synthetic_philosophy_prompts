answer: |-
  You have identified a specific rhetorical species that is widespread in political, institutional, and ethical debate, yet lacks a singular taxonomic name. You are correct that "Chesterton's Fence" covers only the first phase (the demand for functional justification), and that "Conservative Presumption" is too static to describe the *movement* between phases.

  There is no established term in formal logic or rhetoric that captures this specific *sequential* shift from functionalism to organicism. However, the maneuver is well-recognized in political philosophy, particularly in critiques of high conservatism (e.g., critiques of Oakeshott or Burke when deployed strategically rather than philosophically).

  Here is the dissection you requested, followed by a proposed term with its boundaries marked.

  ### The Dissection

  The argument relies on an **ontological ambiguity** regarding the nature of the tradition being defended. It exploits the fact that social arrangements can be viewed through two incompatible lenses:

  1.  **The Instrumental Lens (Phase 1):** The arrangement is a *tool*. It was made by someone, for some purpose.
      *   *Standard of Proof:* Empirical/Historical.
      *   *Defeat Condition:* The reformer identifies the purpose and shows it is obsolete.
  2.  **The Organic Lens (Phase 2):** The arrangement is an *organism*. It evolved, embodying collective wisdom too complex for rational dissection.
      *   *Standard of Proof:* Transcendental/Inarticulable.
      *   *Defeat Condition:* Impossible, as the defense claims the value lies precisely in what cannot be proven.

  The maneuver works because both lenses are individually plausible. Traditions *do* have functions, and they *do* accumulate tacit value. The fallacy lies not in asserting either, but in reserving the right to switch between them *reactively*.

  In Phase 1, the defender pretends the tradition is simple enough to be understood (so the reformer can be tasked with understanding it). In Phase 2, the defender pretends the tradition is too complex to be understood (so the reformer cannot be allowed to judge it). The reformer is caught in a bind: if they say the tradition is meaningless, they are ignorant (Phase 1); if they say they understand it, they are arrogant (Phase 2).

  ### The Proposed Term: **The Epistemic Ratchet**

  I propose calling this composite maneuver **The Epistemic Ratchet**.

  A ratchet allows motion in only one direction. In this argument, the "direction" is the strictness of the evidentiary standard.
  *   **Click 1:** The burden is on the reformer to produce *facts* (historical/functional).
  *   **Click 2:** Once facts are produced, the burden shifts to producing *wisdom* (which is defined as unavailable).
  *   **The Lock:** The mechanism prevents the argument from ever returning to the empirical register where the reformer could win.

  #### Why this fits your description:
  *   **"Standard of justification rises exactly when it is about to be met":** This is the definition of a ratchet mechanism in this context.
  *   **"Both replies are offered as the position that presumes nothing":** The ratchet presents itself as a neutral procedural rule (first prove it's useless, then admit you can't know everything), masking the substantive shift.

  ### Marking the Edges

  To distinguish **The Epistemic Ratchet** from similar but distinct positions, we must look at *consistency* and *timing*.

  **1. Versus Honest Conviction (Inarticulate Goods)**
  *   *The Difference:* **Consistency of Register.**
  *   An honest defender of inarticulate goods (e.g., a genuine Oakeshottian) operates in **Phase 2 from the start**. They will argue immediately that the value of the ceremony or rule is tacit, embodied, and not fully reducible to function. They do not invite a functional audit only to reject the results of that audit.
  *   *The Test:* If the defender leads with "You must prove the function," they are not an honest organicist. If they lead with "Some things cannot be proven," they are not using the Ratchet.

  **2. Versus Fixed Preference for the Status Quo**
  *   *The Difference:* **Acknowledgment of Bias.**
  *   A defender with a fixed preference might say, "I know this looks obsolete, but I prefer it anyway," or "The cost of change outweighs the benefit." This is a value judgment, openly avowed.
  *   *The Ratchet:* Claims to be *procedural*, not preferential. It claims the reformer is *wrong* (epistemically), not that the defender simply *prefers* the old way. It masks a value judgment as an epistemological limitation.

  **3. Versus Plain Stonewalling**
  *   *The Difference:* **Engagement with Content.**
  *   Stonewalling refuses to engage ("I'm not discussing this"). The Epistemic Ratchet *engages deeply* with the reformer's arguments in Phase 1, scrutinizing the historical account, only to invalidate the *category* of that account in Phase 2.
  *   *The Ratchet:* It requires the reformer to do the work of justification, only to declare the work irrelevant. Stonewalling refuses the work; the Ratchet accepts the work but changes the currency.

  ### Summary of the Species

  **Name:** The Epistemic Ratchet (or The Dual-Register Defense).
  **Structure:** A sequential argument that shifts the ontology of the subject from *instrumental* to *organic* upon the threat of falsification.
  **Function:** To render a status quo immune to empirical critique without requiring the defender to admit to a non-rational preference.
  **Key Indicator:** The moment the reformer successfully answers "What is this for?", the defender replies, "That is not what this is for."

  This term captures the mechanical nature of the shift you observed: the ground does not just change; it locks into a higher position of immunity, preventing the debate from sliding back down to the level of evidence where the reformer had gained footing.
