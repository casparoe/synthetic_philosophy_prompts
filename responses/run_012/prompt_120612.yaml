      *   **Topic:** Gould and Lewontin's 1979 paper "The Spandrels of San Marco and the Panglossian Paradigm."
      *   **Specific Dispute:** The architectural accuracy of the "spandrel" analogy. Critics (like Daniel Dennett and others) have pointed out that the features in San Marco are technically *pendentives*, not *spandrels* (or that the term is misused architecturally).
