answer: |-
  The residual sat in cell J44, stubborn as a stain. 0.0004.

  In Marnie's world, zero was the only clean number. It meant the ripples had washed out. The school built in '08 had collapsed in '25, hurting three children, but the literacy spike had prevented two overdoses in the next generation. The net harm was zero. The premium held. The universe balanced its books.

  For eleven years, the model had always converged. The Law of Large Numbers applied to morality, apparently, provided you stood far enough back. But Grant 4492—a drought-resistant sorghum initiative in the Sahel—was refusing to settle. She had run the simulation four times. She had extended the temporal horizon from the standard fifty years to seventy. She had widened the scope to include second-order economic displacement. The residual remained. 0.0004. Not enough to trigger an audit, but enough to itch.

  It wasn't a data error. The inputs were solid. It was the output that felt hollow.

  Marnie saved the sheet as *4492_v5* and walked down the hall to Simon's office. Simon handled the medical portfolios. He believed in granularity. He believed that if a number didn't make sense, you just hadn't measured the thing properly yet.

  He was eating a sandwich over his keyboard. He didn't look up when she came in.

  "It's not zeroing," Marnie said.

  Simon chewed. "Extend the horizon."

  "I did. Seventy years. The variance spikes instead of dampening. It looks like a divergent series."

  Simon stopped chewing. He wiped crumbs from his chin and swiveled his chair. "That's impossible. The pooling assumption holds. Good and bad spread. They cancel. That's why we exist."

  "Not this one." Marnie pulled up the graph on her tablet. "Look at the tail. Every time I add a decade, the harm coefficient doubles. It's not washing out. It's compounding."

  Simon squinted at the screen. "So you're missing variables. You're not tracking the migration patterns out of the region. Or the price fluctuation on the global grain market. You're cutting the web too early."

  "I'm not cutting it," Marnie said. "I'm hitting a wall. There's nothing past the wall."

  "There's always something past the wall, Marnie. It's causality. You pull a string, something moves."

  "What if the string breaks?"

  Simon laughed, a short, dry sound. "Strings don't break. We just lose sight of them. You need to buy the extended dataset from the UN. Get the demographic projections out to 2100. It's ignorance, Marnie. You're treating ignorance like indeterminacy."

  "It's not ignorance." Marnie felt the heat rising in her neck, a familiar frustration. "It's that the question stops making sense. 'What was the net harm of the sorghum?' It's like asking for the color of a sound. After a certain point, the chain of cause and effect gets so diffuse there's no fact of the matter anymore. The model spits out a number because we tell it to stop looking, not because it found an answer."

  "That's philosophy," Simon said, turning back to his sandwich. "We're actuaries. We price risk. If you can't measure it, you assume it averages out. That's the convention. Paragraph 4, Section B of the underwriting guidelines."

  "The convention is a lie."

  "The convention is the product," Simon corrected. "The client buys certainty. They want to know that if they save a village now, they aren't dooming a continent later. We sell them the math that says 'don't worry.' If you tell them the math is undefined, you aren't doing your job. You're just saying 'I don't know.'"

  "I *don't* know," Marnie said. "Because there isn't anything to know."

  "Then get more data until there is."

  "There won't be."

  "Then you're useless to the firm." Simon clicked his mouse, bringing up a new spreadsheet. "Look, just cap the horizon at fifty. Use the standard discount rate for post-century harm. It'll zero out. It always does."

  "It won't be true."

  "It'll be compliant." Simon finally looked at her, his eyes tired. "Marnie. We count humans. We count foreseeable effects. We count fifty years. We do this because if we didn't, we'd be here until the heat death of the universe calculating the butterfly effect of a vaccine. Is it a cheat? Yes. Is it the only way to get a number? Also yes. Now, is the residual significant?"

  "0.0004."

  "Then it's noise. File it."

  Marnie went back to her desk. The office hummed, the low-frequency vibration of the server room bleeding through the floorboards. It was a comfortable sound. It meant the machine was working.

  She opened the model again. Cell J44 glowed.

  *Ignorance vs. Indeterminacy.* Simon thought she was missing pieces of the puzzle. Marnie thought the puzzle box was empty. If she extended the timeline to a hundred years, the model would crash. Not because of processing power, but because the definitions blurred. Who counted as a beneficiary? A great-grandchild? A stranger who bought the grain they grew? Did harm count if the victim never knew the cause?

  The model relied on boundaries. It needed a fence around the garden to tell you how many plants were inside. But causality didn't respect fences. It leaked. The only reason the numbers ever worked was because everyone agreed to pretend the leakage didn't exist. They chopped the web down to size. They counted only humans, ignoring the ecological collapse that might follow. They counted only foreseeable effects, ignoring the chaos that blooms from stability.

  It was a cheat. But without the cheat, there was no insurance. Without the insurance, the foundations wouldn't grant the money. Without the money, the sorghum wouldn't grow, and the village would starve today instead of potentially suffering from undefined consequences tomorrow.

  She looked at the parameters tab.

  *Temporal Horizon: 70 years.*
  *Scope: Direct Human Impact.*
  *Discount Rate: 3%.*

  She highlighted the *70*.

  If she changed it back to 50, the residual would vanish. The curve would flatten. The good and bad would wash together in the shallow end of the pool before the deep water got too murky. It would be clean. It would be a lie.

  If she left it at 70, the report would flag. Compliance would ask questions. Simon would be annoyed. She would have to explain that she was measuring a ghost.

  She thought about the village. She had seen the photos in the grant application. Green fields where there had been dust. Children who looked fed. That was real. The harm was a shadow cast by a light that hadn't turned on yet. Maybe the shadow wasn't there. Maybe it was just the absence of light.

  But the 0.0004 nagged. It suggested that somewhere, somehow, the balance was tipped. That the sorghum was buying time at a cost that couldn't be counted.

  Marnie opened the command line. She didn't change the horizon. She didn't want to lie about the time.

  Instead, she went to the weighting column for *Secondary Migration*. It was a soft variable. Highly sensitive. Technically, the guidelines allowed for actuarial judgment on "low-probability geopolitical shifts."

  She adjusted the coefficient. Just a fraction. She dampened the impact of the migration variable. She reduced the weight of the people who might leave the village in forty years because the population grew too large for the land.

  It was arbitrary. There was no data to support the adjustment. It was a fudge factor. She was manually forcing the equilibrium because the universe wouldn't provide it naturally.

  She watched the number in J44. It ticked down. 0.0003. 0.0002. 0.0000.

  Zero.

  The green checkmark appeared in the corner of the screen. The system accepted the file. The policy could be written. The foundation could send the money. The sorghum could grow.

  Marnie leaned back. She had solved the problem by introducing a small, unrecorded error to cancel out a large, unexplainable one. She had protected the model from the truth.

  Simon was right. It was the only way to get a number. But he was wrong about what the number meant. It wasn't a measurement of risk. It was a measurement of comfort.

  She hit *Send*.

  The email whooshed away. Somewhere, a server logged the transaction. Somewhere, a foundation director sighed with relief and picked up a pen. Somewhere, in the Sahel, the rain started to fall on the new crops.

  Marnie closed the spreadsheet. She opened a new one. Grant 4493. A well-drilling project in Southeast Asia.

  She stared at the blank input fields. She knew what she would do when the residual didn't zero. She would adjust the weights. She would chop the web. She would sell the certainty they paid for.

  It was a cheat. But it was the only honest thing in the building.

  She began to type.
