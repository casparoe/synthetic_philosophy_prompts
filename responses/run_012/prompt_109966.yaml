answer: |-
  The Bureau of Eternal Accounts did not smell of sulphur or incense, but of ozone and old paper. It was a place of humming servers and shuffling feet, located in a liminal space where the geometry was slightly non-Euclidean, just enough to make your inner ear complain if you walked too fast. Elara sat at Desk 404, staring at the ledger open before her. It was not a book, but a cascade of holographic slips, each representing a moral impulse, a consequence, a ripple.

  The file belonged to a soul named Arthur Penhaligon. Arthur had been a mediocre man. He had paid his taxes, occasionally lied to his wife, saved a child from choking once, and forgotten to water his neighbour's plants during a heatwave. Ordinary stuff. But the Bureau did not measure deeds in isolation. It measured the *Expected Moral Worth* (EMW), calculated over the infinite horizon of consequences stemming from each action.

  Elara tapped the glass surface. The numbers scrolled.

  $+2, -4, +8, -16…$

  No, that was too simple. The Pasadena Class files were subtler. The values grew without bound, alternating in sign, weighted by probabilities that summed to one. The series looked something like this:

  $$ \sum_{n=1}^{\infty} \frac{(-1)^{n-1} 2^n}{n} $$

  Elara had run the summation three times. The first pass, following the natural chronological order of Arthur's life, yielded a positive infinity. The second pass, grouping by magnitude, crashed into negative infinity. The third, using a standard algorithmic shuffle, oscillated wildly between both without ever settling.

  "It doesn't converge," she said to the empty room.

  "It never does," a voice replied.

  Mr. Gedge stood behind her. He was a senior auditor, a man whose suit seemed woven from the same grey static as the walls. He had been at the Bureau for centuries, or perhaps just decades; time moved differently here. He placed a hand on the ledger. The holographic slips shimmered and rearranged themselves. The running total at the bottom shifted from $+∞$ to a modest $+450$.

  "What did you do?" Elara asked.

  "Rearrangement," Gedge said, pulling up a chair. "The Riemann Rearrangement Theorem applied to ethics. Since the series is conditionally convergent—or in this case, undefined due to the Pasadena structure—the sum depends entirely on the order in which you assess the terms. I put the small virtues first, delayed the catastrophic ripple effects of his forgotten watering can. Now he's saved. Light duty in the lower gardens."

  He swiped his hand again. The slips shuffled. The total plunged to $-12,000$.

  "Now he's damned. Sulphur pits. Standard procedure." Gedge leaned back, clasping his hands. "You look troubled, Elara. Is it the maths?"

  "It's the truth," Elara said. "Arthur lived a life. It happened in a specific order. He watered the plants on Tuesday. He lied on Friday. You're saying the verdict depends on which slip I pick up first?"

  "I'm saying the *value* depends on it. The life is fixed, yes. But the valuation is a calculation we perform. If the calculation has no unique solution, then the verdict is a choice, not a discovery." Gedge tapped the ledger. "This is the Pasadena Problem. The expectation is undefined. The universe offers no single number. So we must provide one."

  "But you're changing the result by shuffling," Elara insisted. "That feels like cheating."

  "It feels like auditing," Gedge corrected. "Look, the alternative is paralysis. We cannot leave the file open. The queue is infinite."

  Elara looked at the scrolling numbers. "What if we just stop? Arthur is dead. The chain of consequences might ripple forever, but practically, the signal fades. After a hundred years, does it matter if his great-granddaughter lies to her husband because Arthur forgot the plants?"

  Gedge nodded slowly. "The truncation argument. It's the most common objection from the juniors. You're suggesting we impose a cutoff. Say, $n = 100$. Ignore everything beyond the centennial mark."

  "Yes," Elara said. "In practice, the payout is bounded. The coin must land heads eventually. The ledger must close."

  "In practice," Gedge agreed. "But this is not practice. This is eternity. The butterfly effect is not a metaphor here; it is the infrastructure. A lie told in 1974 causes a war in 2099 which prevents a cure for a plague in 2150. The magnitude of the terms grows because the stakes compound. If you truncate at $n=100$, you are arbitrarily discarding the largest terms of the series. You aren't solving the paradox; you're hiding the tail."

  He stood up and walked to the window. Outside, there was no view, only a swirling mist of probabilities.

  "Consider the St. Petersburg paradox," Gedge said. "Infinite expectation, but nobody would pay a million pounds to play. We solve that by saying utility is logarithmic. Money isn't value. But here? Moral value *is* the utility. We cannot import a log function to rescue us unless we admit it's a preference, not a fact. Do you want to file a note saying 'Arthur is saved because I prefer logarithmic scaling'?"

  Elara frowned. "No. I want to file a note saying 'Arthur is saved because he was good'."

  "Goodness is the series," Gedge said. "And the series is silent."

  He turned back to her. "I have to go to the Tribunal. Case 734 needs a verdict by the end of the shift. You have the desk. You can shuffle him to Heaven, Hell, or Purgatory. Or you can truncate. Just know that whatever you choose, you are writing the number, not finding it."

  Gedge left. The hum of the office seemed to grow louder. Elara looked at Arthur Penhaligon's file. She thought of the man. Not the data, but the memory of him that lingered in the slipstream. He had been anxious. He had tried.

  She placed her hands on the ledger. She could do what Gedge did. She could group the positive terms until the sum exceeded the threshold for Salvation, then fill in the negatives. It would be clean. It would be defensible within the Bureau's guidelines.

  Or she could truncate. She could draw a line at fifty years post-mortem. It felt honest to the human experience. Humans live in finite windows. To judge them by infinite ripples felt like a category error. But Gedge was right; the Bureau's mandate was the infinite account. To truncate was to disobey the fundamental physics of this place.

  She realised then that the maths offered no rescue. The undefined expectation was not a puzzle to be solved, but a condition to be endured. The silence of the series was a demand for agency.

  Elara opened the command line. She did not shuffle the slips. She did not truncate the tail. Instead, she locked the order.

  She typed a directive: *Summation Protocol: Chronological.*

  She added a footnote to the verdict form. *Note: The Expected Moral Worth is mathematically undefined under standard summation conditions. This verdict is derived by enforcing temporal ordering of consequences as a normative constraint. This is a policy decision, not a mathematical derivation.*

  It was a fragile shield. She knew that tomorrow, another clerk could reopen the file, shuffle the terms, and change Arthur's fate. There was no objective truth here to protect him. There was only the integrity of the clerk.

  She selected 'Salvation'. Not because the sum demanded it—chronologically, it hovered near zero—but because the early terms, the ones Arthur actually experienced, were mostly kind. She was weighting the lived experience over the distant ripple.

  She stamped the file. The hologram solidified into a golden seal.

  "Case closed," she whispered.

  It wasn't true, of course. The series continued. The consequences rippled on. But the ledger was closed. She had made a choice. She had taken the silence of the universe and filled it with a voice. It was arbitrary, yes. But it was hers.

  Elara stood up and pushed the chair in. The next file was already waiting on the desk, another infinite series, another undefined soul. She sat down and opened it.

  ***

  **Philosophical Analysis**

  In the story, Mr. Gedge represents **instrumentalism** combined with the **Riemann Rearrangement Theorem**. He acknowledges the expectation is undefined but argues that since the maths yields no unique answer, the auditor is free to choose an ordering that produces a useful or desired verdict. This is mathematically valid for conditionally convergent series but ethically dubious, as it makes truth subjective to the auditor's whim. Elara initially proposes **truncation** (finite cutoff), arguing that real-world constraints bound the series. Gedge correctly counters that in an infinite consequence model, truncation arbitrarily discards the largest terms, failing to solve the mathematical paradox. Finally, Elara makes a **normative decision**: she imposes **chronological order** as a binding rule. She acknowledges this does not resolve the mathematical undefinedness (the sum is still technically dependent on order) but treats the choice of ordering as a moral principle rather than a mathematical fact. This avoids the "cheat" of claiming a unique solution exists, instead owning the arbitrariness as a necessary act of judgment.
