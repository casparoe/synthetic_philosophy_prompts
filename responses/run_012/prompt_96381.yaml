answer: |-
  Here is the spec for the Problem of Old Evidence (POE), stripped of the usual defense of pet theories and focused on what a solution must actually achieve to be historically and philosophically viable.

  ### I. The Desiderata List

  I have sorted these into **Non-Negotiable Requirements** (things any account must handle to be a solution to *this* problem) and **Camp Commitments** (things that solve the problem but only by accepting specific philosophical baggage).

  #### A. Non-Negotiable Requirements

  **1. The Mercury Constraint (The Intuition Pump)**
  *   **The Case:** Einstein in 1915. $E$ (Mercury's perihelion) is known ($P(E)=1$). $H$ (GR) is formulated. Einstein realizes $H \vdash E$. His confidence in $H$ rises.
  *   **The Requirement:** The account must allow for a positive confirmation value (or a credence increase) in this specific configuration.
  *   **Why:** If a solution says "Einstein was irrational" or "This wasn't confirmation," it fails to solve the problem; it dissolves the phenomenon we are trying to explain. It must recover the standard historical judgment.

  **2. The Non-Triviality Constraint (No Tacking)**
  *   **The Case:** Let $H$ be General Relativity. Let $X$ be "The moon is made of cheese." Let $H^* = H \land X$. $H^*$ entails $E$ (Mercury's perihelion) just as well as $H$ does.
  *   **The Requirement:** The account must prevent $E$ from confirming $H^*$ simply because it confirms $H$. Entailment alone cannot be sufficient for confirmation.
  *   **Why:** If every conjunction of a confirmed theory with an arbitrary claim is confirmed by the same evidence, the concept of confirmation loses its discriminatory power. This is the Glymour "tacking" problem.

  **3. The Accommodation/Prediction Distinction (The Training-Set Case)**
  *   **The Case:** A data scientist fits a 50-parameter polynomial to a dataset ($E$). The model entails $E$ perfectly. Contrast this with a physical theory derived from first principles that happens to entail $E$.
  *   **The Requirement:** The account must distinguish between evidence that was *used to construct* the hypothesis (accommodation/overfitting) and evidence that was *independent of construction* but known prior to acceptance (old evidence).
  *   **Why:** If the account says "Entailment of old evidence is always confirmation," it validates curve-fitting as confirmation. If it says "Old evidence is never confirmation," it kills GR/Mercury. It must thread the needle: $E$ confirms $H$ only if $H$'s entailment of $E$ wasn't guaranteed by the method of $H$'s construction.

  **4. The Finite Agent Constraint (Logical Non-Omniscience)**
  *   **The Case:** Real agents do not know all logical consequences of their beliefs immediately. Einstein had to *calculate* to see that GR entailed the perihelion shift.
  *   **The Requirement:** The account must model the agent as learning the *entailment relation* ($H \vdash E$), not the evidence ($E$) itself, without assuming the agent was logically omniscient prior to the calculation.
  *   **Why:** If the agent is logically omniscient, $P(H \vdash E)$ is always 1, and the POE never arises. A solution that relies on logical omniscience solves the math by destroying the psychology of the historical episode.

  #### B. Camp Commitments (Prejudices)

  **5. The Counterfactual Prior Requirement (The Garber Camp)**
  *   **The Commitment:** To measure confirmation, we must reconstruct what the agent's credence in $H$ *would have been* had they not known $E$.
  *   **The Cost:** This abandons describing the *actual* agent's credence function. It replaces historical psychology with a philosophical reconstruction.
  *   **Status:** **Camp Prejudice.** It solves the math, but changes the subject from "How did Einstein's credence change?" to "What was the logical support relation?"

  **6. The Objective Support Requirement (The Keynes/Keynesian Camp)**
  *   **The Commitment:** Confirmation is a three-place relation $C(H, E, K)$ between hypothesis, evidence, and background knowledge, independent of any specific agent's credences.
  *   **The Cost:** It renders the agent's actual credence irrelevant. $P(E)$ can be 1 for the agent, but the "logical probability" of $E$ given $K$ is $<1$.
  *   **Status:** **Camp Prejudice.** It dissolves the POE by denying that confirmation is essentially about credence updating.

  **7. The Jeffrey Conditionalization Requirement (The Uncertainty Camp)**
  *   **The Commitment:** $P(E)$ is never truly 1. We should model the agent as becoming *more certain* of $E$, or certain of a report of $E$, rather than certain of $E$.
  *   **The Cost:** It denies the setup of the problem. For Mercury, the data *was* treated as certain. Forcing uncertainty where there was none is ad hoc.
  *   **Status:** **Camp Prejudice.** It avoids the problem by denying the premise that $P(E)=1$.

  ---

  ### II. The Two-Agent Case (The Subjectivity Squeeze)

  **The Case:**
  *   **Agent A (Einstein):** Knows $E$ (Mercury) with certainty. Formulates $H$. Learns $H \vdash E$.
  *   **Agent B (Contemporary):** Does *not* know $E$. Formulates $H$. Learns $H \vdash E$. Then learns $E$.
  *   **The Requirement:** The account must state explicitly whether $H$ receives the *same* confirmation boost for both agents.

  **The Squeeze:**
  *   **If Yes (Same Confirmation):** Then confirmation is not about credence updating (since A cannot update on $E$). It is an objective logical relation. This satisfies the **Objective Support** commitment but violates the intuition that confirmation is about *resolving uncertainty*.
  *   **If No (Different Confirmation):** Then confirmation is essentially temporal and psychological. This satisfies the **Actual Agent** intuition but makes confirmation history-dependent in a way that complicates theory choice (why should we prefer $H$ now if the confirmation "expired"?).

  **Desideratum:** The account must not equivocate here. It must declare whether confirmation is a *state* (support) or a *transition* (update).

  ---

  ### III. The Impossibility Result (The Squeeze)

  You asked for a subset of desiderata that cannot be jointly satisfied. Here is the trilemma for any Bayesian account of Old Evidence:

  **You cannot simultaneously hold:**
  1.  **Descriptive Fidelity:** The account describes the *actual* credence changes of the *actual* agent (who has $P(E)=1$).
  2.  **Formal Standard Bayes:** The agent updates via standard Conditionalization ($P_{new}(H) = P_{old}(H|E)$) and obeys standard probability axioms (including logical omniscience).
  3.  **Confirmation is Possible:** Old evidence can confirm a new hypothesis ($P_{new}(H) > P_{old}(H)$).

  **The Proof of the Squeeze:**
  *   If you hold (2), then $P(E)=1$ implies $P(H|E) = P(H)$.
  *   If you hold (1), you cannot change the input $E$ (it is old) and you cannot change the rule (Conditionalization).
  *   Therefore, $P_{new}(H)$ cannot exceed $P_{old}(H)$.
  *   To get (3), you must drop (1) (use counterfactual priors, i.e., Garber) OR drop (2) (use Jeffrey Conditionalization or drop logical omniscience).

  **The Historical Cost:**
  If you want to use this on an actual historical episode (as you requested for the second half of your session), you must drop **Descriptive Fidelity**. You cannot describe Einstein's *actual* mind using standard Bayes and get confirmation. You must describe a *reconstructed* Einstein (who didn't know $E$) or a *modified* Bayes (where logical truths are uncertain).

  **Conclusion:** There is no solution that preserves the standard Bayesian formalism *and* describes the actual psychological history of the agent *and* yields confirmation. One must go.

  ---

  ### IV. The Killer Constraint

  **The Single Requirement:** **The Non-Triviality Constraint (No Tacking).**

  **Why it does the most work:**
  Many solutions easily allow old evidence to confirm hypotheses by relaxing logical omniscience or invoking counterfactuals. The hard part is ensuring that *only* the right hypotheses get confirmed.
  *   **The Victim:** Simple "Entailment Accounts" (where confirmation is just $H \vdash E$).
  *   **The Kill:** If your solution relies solely on the agent learning that $H \vdash E$, you must explain why learning that $(H \land X) \vdash E$ does not confirm $(H \land X)$. Most "learning the entailment" solutions struggle here because the agent *does* learn that the conjunction entails the evidence. To block this, you need a theory of *relevance* or *independence* that is not built into standard probability theory. This constraint kills any solution that tries to solve POE purely within the probability calculus without adding external constraints on theory construction (linking back to the Training-Set Case).

  ---

  ### V. Confidence and Doubt

  **Confidence Level:** **High (85%)** on the structural constraints and the Impossibility Result. These are formal features of the Bayesian framework. **Moderate (60%)** on the historical applicability, as historians often play fast and loose with "credence."

  **The Item I'm Least Sure Belongs:**
  **The Accommodation/Prediction Distinction (The Training-Set Case).**
  *   **Why:** I included it because you asked for it, and it's crucial for science practice. However, there is a live debate (the "Predictivism Debate") on whether accommodation *ever* carries less weight than prediction if the entailment is strict. Some argue that if $H$ entails $E$, it shouldn't matter if $E$ was used to build $H$, provided $H$ was not *guaranteed* to fit $E$ by construction (i.e., no overfitting).
  *   **The Doubt:** It is possible that this is a separate problem (the problem of *ad hoc* hypotheses) rather than a core constraint on the Problem of Old Evidence. A solution to POE might technically succeed (explaining how $P(E)=1$ allows confirmation) while failing to distinguish accommodation from prediction. I included it because a solution that validates curve-fitting is useless for your historical episode, but formally, POE and Predictivism are sometimes treated as distinct puzzles.

  ### Summary for the Reading Group
  Tell them this: The literature is a graveyard of solutions that picked two corners of the Trilemma (Fidelity, Formalism, Confirmation) and pretended the third didn't exist. Your session should not ask "Which solution is right?" but "Which corner are we willing to cut off?" If they want historical realism, they must break standard Bayes. If they want standard Bayes, they must accept counterfactual history. If they want both, they must give up on confirmation for old evidence.
