answer: |-
  The rain had been falling against the window of the office since three o'clock, blurring the view of the courtyard into a grey wash. Inside, the light was the sterile white of LED panels, reflecting off the surface of the desk where two laptops sat open, side by side.

  Elias rubbed his eyes. He was sixty-two, and the fine print on the screen was beginning to swim. Opposite him, Sarah tapped a pen against her chin. She was thirty, sharp, and wore a cardigan that looked too new for the wear and tear of the publishing house.

  "Read it again," she said.

  Elias sighed, a dry sound in the quiet room. He looked at the left screen. This was his version. He looked at the right. This was the output from the neural engine, the system the directors had bought into last quarter.

  "*He walked into the kitchen and the air was still holding the shape of her,*" Elias read from his screen. His voice was flat. He knew how it sounded. Clunky. 'Holding the shape' was not idiomatic. It felt like a calque, a direct lift from the source syntax that English didn't naturally support.

  Sarah looked at the right screen. "*He walked into the kitchen and the air still felt like her,*" she read. Her voice was warmer, smoother. It flowed. "Elias, look at the rhythm. 'Felt like her'. It's immediate. It's what a reader wants. Your version... 'holding the shape'. It sounds like physics. Like geometry."

  "It's not geometry," Elias said. He reached for his mug, but the tea was cold. "In the original, the verb implies a physical displacement. The air is moulded. It's not a feeling, Sarah. It's a cast. Like plaster."

  "But no one speaks like that," Sarah said. She leaned forward, the pen still tapping. "If I'm reading a novel on the tube, I don't want to stop and think about plaster casts. I want to know he misses her. The engine gives me that. It gives me the emotion without the friction."

  "That's the problem."

  "It's not a problem if the reader doesn't notice it." Sarah switched screens, highlighting a paragraph on the right. "Look at the consistency. The engine hasn't missed a tense in four chapters. You've got three subjunctives that feel archaic. The copy editors are going to hack them out anyway. Why not let the machine do the heavy lifting and you just... polish?"

  "Polish what? The wood grain?" Elias turned his laptop slightly towards her. "The source text is rough. Volkov writes like he's digging holes. If I fill the holes with smooth English, I'm lying. I'm telling the reader this was easy to say. It wasn't."

  "It wasn't easy for you," Sarah corrected. "But why should the reader suffer for that? Translation is about bridge-building. You build the bridge so people can cross. You're building a bridge with steps missing just to prove the river is deep."

  Elias looked at the cursor blinking on his screen. It was a steady, vertical pulse. The machine's cursor didn't blink; it just sat there, confident.

  "It's not about suffering," Elias said. "It's about the residue."

  Sarah stopped tapping the pen. "The what?"

  "The residue. When you move a word from one language to another, there's something that doesn't fit. Like... like when you pour water from a square bottle into a round glass. There's spillage. Or the shape changes." He gestured with his hand, shaping something invisible in the air. "A human translator knows there's spillage. You can see where I've tried to catch it. The awkwardness is me saying, 'Look, there was something here I couldn't quite carry.' The machine..." He pointed at the right screen. "The machine pretends the bottle was round all along."

  "That's poetry, Elias. That's not editing." Sarah sat back. "I put your version past two beta readers yesterday. Blind test. They preferred the engine's version by a hundred per cent. They said your passage felt 'translated'. They said the engine's felt 'written'."

  "Because it is written," Elias said quietly. "It's written by the average of everything else. It's finding the path of least resistance. Volkov isn't least resistance. Volkov is a man walking through brambles."

  "Then why isn't the bramble in the text?"

  "Because the bramble is in the grammar! In the aspect!" Elias felt the heat rising in his neck. He hated this. He hated that he sounded like a theorist, that he was reaching for concepts that dissolved when he touched them. "In Serbian, the verb for 'waiting'... it can mean waiting for something that will happen, or waiting for something that *should have* happened. There's a grief in the verb itself. English doesn't have that. So I have to... I have to break the sentence to make you feel the weight."

  "Break it for who?" Sarah asked. "The reader doesn't speak Serbian. They only have the English. If the English is broken, the book is broken."

  Elias looked down at his hands. They were spotted with age, resting on the plastic keys. He tried to find the words. He needed to tell her that the smoothness was a lie. That the friction was the truth. But how do you describe the texture of a ghost?

  "It's like..." He started, then stopped. He looked at the window, at the rain smearing the glass. "Imagine you have a scar. A proper one. From when you were a child."

  Sarah waited.

  "And you show it to someone. If I say, 'He was injured', that's the machine. It's accurate. It's clean. But if I say, 'The skin grew back wrong', that's... that's closer." Elias frowned. "No, that's not it."

  "That's fine, Elias."

  "No, listen." He leaned in, desperate now. "When you touch a scar, it doesn't feel like the rest of you. It's numb. Or it's too sensitive. The machine says 'skin'. It says 'body'. It puts the scar in a suit so it matches. But the point of the scar is that it *doesn't* match. If I smooth it out, I'm saying the injury didn't change the texture of the life. But it did."

  He stopped. He knew he hadn't said it. He could feel the thing he meant sitting in his throat, heavy and solid, but the words available to him were all smooth stones. They slipped around the object. There was no word for 'the shape of an absence'. There was no word for 'the effort of crossing'.

  Sarah watched him. Her expression wasn't mocking. It was pitying, which was worse.

  "I know what you're trying to say," she said softly. "You want the English to feel foreign. You want the reader to know this isn't their culture."

  "I want the reader to know that something was lost," Elias said. "So they can mourn it."

  "But we're selling a novel, Elias. We're not holding a funeral." She closed her laptop. The click was final. "The directors want to use the engine for the first draft on the next batch. They say it cuts costs by forty per cent. You'd just be revising."

  "Revising lies."

  "Refining data." Sarah stood up and picked up her bag. "Look. I'm not saying the machine feels anything. I know it doesn't. It's a calculator. But if I give a reader a calculator's answer, and it adds up, and it's clear... why does it matter how the sum was reached?"

  Elias looked at the two screens again. Side by side.

  His version: *The silence sat in the chair like a guest.*
  Machine version: *The room was silently occupied.*

  The machine's version was better. He knew it. If he were a reader, he would prefer the machine. It didn't stumble. It didn't ask him to work. It gave him the image without the labour of constructing it. It was frictionless. It was like walking on ice when you expected gravel. You didn't trip, but you didn't feel the ground either.

  "It matters," Elias said, but his voice lacked force. "Because the labour is the point. The strain is the meaning."

  Sarah paused at the door. She looked back at him, silhouetted against the grey light of the corridor. "Then maybe the point isn't what you think it is. Maybe the point is just to get the story across."

  She left. The door clicked shut.

  Elias sat alone in the office. The rain continued to blur the window. He looked at his screen. He moved the cursor to the end of his sentence. He pressed backspace. The words 'like a guest' disappeared.

  He typed: *The room was silently occupied.*

  He stared at it. It was perfect. It was fluent. It was dead.

  He pressed backspace again. He deleted the machine's words. He typed his own again. *The silence sat in the chair like a guest.*

  It looked awkward. It looked like a mistake. It looked like something a human being had struggled to say.

  He saved the document. He knew, with a cold certainty in his stomach, that when the file went to the next stage, Sarah would open the comparison tool. She would see the two versions. She would see the metrics. She would see the readability scores. And she would choose the one that slid down the throat without catching.

  He couldn't prove otherwise. He couldn't show her the residue. He could only feel it, like a phantom limb, itching where nothing was there.

  Elias closed his laptop. The room was silent. He waited for the silence to sit in the chair, but it just filled the space, smooth and even, leaving no mark behind. He stood up, put on his coat, and turned off the light. The office was dark, but the screensavers on the computers glowed softly, shifting through colours, endless and smooth, reflecting nothing but themselves.
