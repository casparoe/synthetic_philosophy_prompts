prompt: |-
  ok so I keep getting into fights about what counts as a species and at this point I don't even know what I think, so I'm going to just write down my gut calls on a bunch of cases and let you tell me if there's a principle behind them.

  The foam-nesting frogs on either side of the big river: where the two ranges overlap they interbreed like nothing's wrong, but the northern ones are green and trill and the southern ones are brown and click. My call: same species. Not close.

  The all-female whiptail-type lizards down in the canyon — no males, no sex, they just clone themselves, and they've been at it (as far as anyone can tell) for about a million years. My call: still a species, absolutely, I'd fight you on this one.

  The two bat colonies in the same cave that look identical to the naked eye but never interbreed — different echolocation calls, and the genetic distance is huge. My call: two species, no question.

  The salamanders around the valley, where each population breeds with its neighbors all the way around but the two ends meet and don't breed at all. My call: I say the two ends are different species, but it feels like a lie, because there's an unbroken chain of breeding linking them.

  The deep-sea bacteria that swap genes sideways so promiscuously that "descent" stops looking like a tree at all. My call: I still want to carve out species, and I know I'm doing it by convenience, and I don't love that.

  The ammonites in the shale — I can't test breeding, ever, all I have is shell shape changing slowly across ten million years. My call: totally happy calling the two ends different species and the middle stretch its own species too.

  And a lab mouse strain that differs from the standard one by a single gene. My call: same species.

  Here's the thing I've noticed about myself, and I think this might be the actual rule I'm using: I call something a species when a competent naturalist, holding the specimen and knowing what she's doing, would refuse to lump it in with the other thing — given the differences she can actually see and the work she's got to get done. Like a field-guide test. It's not about interbreeding, it's about whether a good sorter would bother splitting it.

  Is there a real species concept that gives me all seven calls, or do I have to give one up? Which one? And if the field-guide thing is the rule I'm actually running, tell me what it predicts for a case I haven't listed: a bird population that's genetically and visually identical to the mainland one, lives on an island, and would definately interbreed with it if any of them could fly that far. Same species or not? I genuinely don't know and it's been bugging me.
