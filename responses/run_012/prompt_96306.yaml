answer: |-
  **My verdicts, restated**

  1.  **Classical:** Blind-from-birth gains sight; cannot match shape (cube/sphere) by vision alone. (Fail)
  2.  **Size:** Blind-from-birth gains sight; can match size (large/small) by vision alone. (Pass)
  3.  **Calibration:** Blind-from-birth gains sight; after weeks of cross-modal experience, matches shape. (Pass delayed)
  4.  **Late Blindness:** Blind after age six, regains sight; recognizes shapes immediately. (Pass immediate)
  5.  **Active vs. Passive:** Blind-from-birth gains sight; active handling while watching enables immediate matching; passive viewing does not. (Active Pass, Passive Fail)
  6.  **Substitution Device:** Blind-from-birth uses tactile-vision substitution; gains sight; recognition uncertain. (Uncertain)

  **The principle, or the choice among principles**

  The principle that best captures your pattern is the **Principle of Sensorimotor Invariance**. It states: *Cross-modal transfer occurs only when two sensory modalities share a common motor affordance or can be bound by a single proprioceptive act.*

  **Clause 1: Metric properties transfer because they map to invariant motor scales.** Size is not merely visual or tactile; it is a constraint on grip aperture and reach. Whether seen or felt, a "large" object demands a wider hand opening than a "small" one. This motor command is modality-neutral. This explains **Case 2**: size transfers immediately because the motor schema for "reach" is already intact and applies to both inputs. Shape, however, is not a single metric but a structural relation of surfaces.

  **Clause 2: Structural properties require modality-specific rendering rules.** Vision encodes shape via light, occlusion, and perspective; touch via contour and pressure. These are distinct "languages." Without a translator, they do not match. This explains **Case 1**: the blind-born lack the translator, so static vision cannot map to static touch.

  **Clause 3: Active movement creates a temporary translator via proprioception.** When you move your hand while watching it, proprioception (sense of limb position) binds the visual flow to the tactile flow. The brain sees the hand move and feels the hand move simultaneously. This creates a momentary bridge between the visual shape and the tactile shape. This explains **Case 5**: active exploration succeeds because the motor act itself provides the common code that static viewing lacks.

  **Clause 4: Prior experience cements the translator.** If the visual rendering rules were learned before blindness, the neural pathways remain latent. This explains **Case 4**: the late-blind person retains the visual shape code and the link to touch, requiring only reactivation, not new learning.

  **Clause 5: Passive learning builds the translator statistically.** Without active binding, the brain must correlate visual and tactile inputs over time to infer the mapping. This explains **Case 3**: weeks of calibration allow statistical learning to substitute for immediate proprioceptive binding.

  **Tension:** The principle creates tension between **Case 2** and **Case 1**. It asserts size is a "motor metric" while shape is "structural." You noted this sounds like a difference of degree. The principle insists it is a difference of *kind*: size dictates *action* (how wide to open the hand), while shape dictates *identification* (what object this is). Action transfers easier than identification. A simpler principle would overturn **Case 2**, claiming size also requires calibration, but your intuition on size is robust. The principle holds, but it demands we accept that action-affordances are fundamentally more abstract than geometric forms.

  **The substitution-device case**

  The Principle of Sensorimotor Invariance predicts **failure** for **Case 6**, though with lower confidence than the classical case.

  The substitution device (TVSS) translates optical data into tactile patterns on the skin. While this provides spatial layout, the motor affordance remains tactile. The user learns to move their head or the camera to resolve tactile "pixels," not optical ones. They develop a *tactile* sensorimotor contingency, not a *visual* one. When genuine sight is gained, the optical flow (light, perspective, depth cues) does not match the tactile flow they mastered. The proprioceptive bridge built during TVSS use links motor commands to skin stimulation, not to retinal stimulation.

  Therefore, without a period of recalibration where the user binds genuine visual flow to their existing motor commands, the transfer should fail. The device gives them a spatial code, but it is the wrong *currency* for vision. However, confidence is lower here because fluent TVSS users often report "visual-like" experiences. If their brain has successfully reinterpreted the tactile input as functional vision, the motor affordance might have generalized. But strictly speaking, the principle suggests the sensory rendering rules are still mismatched.

  **Cases I did not list**

  To test the edges of the Principle of Sensorimotor Invariance, consider these variants:

  1.  **The Mirror Case:** A person blind from birth gains sight but views the world only through a mirror (left-right reversed) for the first week. They are tested on matching touched objects to seen objects.
      *   *Verdict:* **Fail.** The principle states transfer requires shared motor affordances. Reversed vision disrupts the proprioceptive link; reaching left to touch what is seen on the right creates conflict. The motor command no longer binds the sensory inputs. Recognition should fail until the motor map is recalibrated to the reversal.

  2.  **The Material Case:** A person blind from birth learns to distinguish wood from metal by touch (texture/temperature). They gain sight and are shown polished wood and polished metal (visually identical gloss).
      *   *Verdict:* **Fail.** Material properties are not spatial motor affordances. There is no "grip aperture" for woodness. Vision relies on light reflection; touch on thermal conductivity and friction. There is no common motor code to bridge them. This tests the limit of the principle: non-spatial properties should never transfer immediately.

  3.  **The Distance Case:** A person blind from birth learns to judge reachability (within arm's reach vs. beyond) by touch/movement. They gain sight and are asked to judge which of two objects is reachable.
      *   *Verdict:* **Pass.** Like size, distance is a direct motor affordance (can I reach this?). The principle predicts this transfers immediately because the motor command (reach) is the same regardless of whether the distance is sensed visually or tactilely. This confirms the "action over identification" clause.

  **What I have to give up**

  To maintain the Principle of Sensorimotor Invariance, you must soften **Case 5**.

  Your verdict states that active exploration allows *immediate* success. The principle suggests active exploration creates a *bridge*, but building a reliable neural link between visual flow and tactile flow usually requires repetition. While active handling is vastly superior to passive viewing, claiming "immediate" success risks overstating the speed of neural binding. It is more plausible that active exploration reduces the calibration time from weeks (Case 3) to minutes, but not to zero.

  Alternatively, you must complicate the principle to allow for "instant proprioceptive binding," which implies the brain can unify vision and touch in a single trial. This is physiologically demanding. I recommend abandoning the claim of *immediacy* in Case 5. Accept that active exploration is a *catalyst* for learning, not a magic key. This preserves the principle's core—that motor action is the translator—without requiring implausible instant neural rewiring. The tension between Case 3 (weeks) and Case 5 (instant) is the weak point; resolving it in favor of "rapid but not instant" saves the theory.
