answer: |-
  Here is the direct answer you are looking for: **Your rule does not hold up.**

  It is a logical and intuitive rule, but it relies on a misunderstanding of what causes people to starve. By applying your rule strictly, we get results that contradict historical evidence and moral intuition.

  Below, I have sorted your four cases exactly as your rule demands. After that, I will explain where the rule breaks, address your two specific sticking points, and offer a better way to frame the question.

  ### Part 1: Sorting the Cases by Your Rule

  Your rule states: *If the harvest fails for reasons no human caused, blame nature. If the government diverts or blocks food, blame the government.*

  **1. The Hypothetical Cotton Case**
  *   **The Scenario:** A drought kills the cotton crop. Laborers lose wages. Food exists but is too expensive. Laborers starve.
  *   **Your Rule's Verdict:** **Natural Disaster.**
  *   **Reasoning:** The chain of events began with a drought (weather), which no human caused. The government did not actively block food; the market simply priced the laborers out.
  *   **Reality Check:** This feels wrong to you, and for good reason. The region had food. The starvation was caused by an economic system that allowed laborers to lose their purchasing power without a safety net.

  **2. The Irish Famine (1845–1852)**
  *   **The Scenario:** A fungus kills the potato crop. Ireland continues to export grain and livestock to Britain.
  *   **Your Rule's Verdict:** **Natural Disaster.**
  *   **Reasoning:** The trigger was the potato blight (biology/weather), which humans did not cause. While the British government did not *create* the blight, your rule focuses on the harvest failure. Since the potato harvest failed due to nature, this buckets as natural.
  *   **Reality Check:** This ignores the fact that Ireland produced enough other food to feed its population. The starvation occurred because colonial law and economic ideology prioritized export contracts over human survival.

  **3. The Bengal Famine (1943)**
  *   **The Scenario:** A cyclone damages crops. Wartime policies restrict movement. Speculators hoard rice.
  *   **Your Rule's Verdict:** **Natural Disaster (or Mixed).**
  *   **Reasoning:** You noted the cyclone and wartime upheaval. Under your rule, because the harvest was initially hit by a cyclone (nature), it leans toward natural. The policy failures look like "handling the relief," which you categorized as secondary to the cause.
  *   **Reality Check:** Modern analysis shows the crop failure was relatively minor. The famine was driven by inflation and the British colonial "Denial Policy," which destroyed boats and rice stocks to prevent Japanese invasion, effectively blocking food from reaching the poor.

  **4. The Great Leap Forward (1958–1962)**
  *   **The Scenario:** Bad weather hits. Collectivization policies force bad farming. Government requisitions grain for export/industry.
  *   **Your Rule's Verdict:** **Political Crime.**
  *   **Reasoning:** You explicitly mentioned "bad farming policy." Because humans caused the farming methods and the government forcibly took the grain, this fits your second condition.
  *   **Reality Check:** This is the only case where your rule aligns with the historical consensus, though even here, the government used the "bad weather" as an excuse to cover the policy failures.

  ### Part 2: Where the Rule Breaks

  Your rule breaks because it focuses on the **trigger** (what made the crops grow poorly) rather than the **mechanism of starvation** (why people died).

  In famine studies, this is known as the difference between **Food Availability Decline (FAD)** and **Entitlement Failure**.

  *   **Your Rule assumes FAD:** It assumes famine happens when there is not enough food in the region. Therefore, if nature reduces the food, nature is to blame.
  *   **The Reality is often Entitlement Failure:** Famines rarely happen because there is zero food. They happen because specific groups of people lose the ability to *get* the food that exists.

  In your hypothetical cotton case, the food existed. In Ireland, the food existed. In Bengal, the food existed (India had surplus grain). In all three cases, the "Natural Disaster" label is incorrect because the weather did not kill the people; the social and economic systems killed the people by failing to transfer the existing food to the starving.

  To use an analogy: If a storm knocks down a power line (natural) and a hospital's backup generator fails to turn on because the maintenance budget was cut (political), and patients die, you would not call the deaths a "natural disaster." You would call it a systemic failure. Your rule looks only at the storm, not the generator.

  ### Part 3: Addressing Your Sticking Points

  **1. The Friend's Claim (Food shipped out during starvation)**
  Your friend is correct, and this is the critical piece of evidence that disproves the "Natural Disaster" classification for Ireland and Bengal.
  *   **In Ireland:** During the height of the starvation, ships laden with wheat, cattle, and butter left Irish ports for England under armed guard. The food was legally owned by landlords and merchants. The British government adhered to a *laissez-faire* economic policy that refused to interfere with private property or trade, even to save lives.
  *   **In Bengal:** The colonial government prioritized supplying the military and industrial cities like Calcutta. They also blocked imports from other regions due to wartime trade restrictions.
  *   **Why this matters:** If a famine were truly a natural disaster, there would be no food to ship out. The fact that food was leaving starving regions proves that the scarcity was artificial, created by laws and economics, not just biology.

  **2. Amartya Sen and Democracy**
  You interpreted Sen's observation as being about how a government *responds* after nature does damage. It is deeper than that.
  Sen argues that democracies do not just respond faster; they prevent the **entitlement collapse** from happening in the first place.
  *   In a dictatorship or colonial regime, the rulers do not need the votes of the starving peasants. They can ignore the price spikes or the wage losses (like in your cotton example).
  *   In a functioning democracy, a free press reports the price spikes, and politicians fear losing elections. They are forced to create jobs, distribute cash, or lower food prices *before* people start dying.
  *   Therefore, Sen's point is not just about relief; it is about **accountability**. A famine in a democracy is almost impossible because the political cost of letting people starve is too high.

  ### Part 4: A Better Rule

  You asked for a clean rule you can carry with you. Here is a revised framing that accounts for the complexity without losing clarity:

  > **The Rule of Preventable Mortality:**
  > Classify a famine as a **Natural Disaster** only if the death toll remains low despite the crop failure. Classify it as a **Political Failure** when institutions (government, markets, or laws) fail to protect people's access to food that is available elsewhere or affordable in normal times.

  **How to apply this new rule:**
  1.  **Ignore the trigger.** Do not start by asking "Was there a drought?"
  2.  **Look at the food supply.** Ask: "Was there food in the country or region that could have saved these people?"
  3.  **Look at the access.** Ask: "Did the government or economic system prevent that food from reaching the starving?"
  4.  **The Verdict:** If the answer to #2 is "Yes" and #3 is "Yes," it is a Political Failure, regardless of the drought, blight, or cyclone.

  **Applying the New Rule to your cases:**
  *   **Cotton Case:** Food existed. Laborers couldn't buy it. No safety net provided. **Political Failure.**
  *   **Ireland:** Food existed. Exports continued. No intervention. **Political Failure.**
  *   **Bengal:** Food existed in India. Colonial policy blocked distribution. **Political Failure.**
  *   **Great Leap Forward:** Food was seized by the state. **Political Failure.**

  ### Summary
  Your original rule is attractive because it separates the "act of God" from the "act of man." But in the modern world, mass starvation is almost never an act of God. Weather events are the spark, but human systems are the fuel.

  If you want a single sentence to carry with you: **Famine is not about a lack of food; it is about a lack of access to food.** When access fails on a mass scale, it is because human institutions allowed it to happen. Therefore, almost all modern famines are political crimes, even when they begin with natural triggers.
