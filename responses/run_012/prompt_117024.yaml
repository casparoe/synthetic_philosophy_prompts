      *   *GLF:* Acknowledge weather played a role but emphasize policy was the multiplier.
      *   *Sen:* Clarify that democracy isn't just about response speed, it's about structural incentives.

  8.  **Final Polish:** Check against constraints (American English, plain language, address all parts of prompt). *Self-check: Did I explicitly sort the cases as the user's rule would?* Yes, I need to make sure I say "Your rule classifies this as X" before explaining why X is wrong.

      *   *Hypothetical:* Rule says Natural. (Wrong)
      *   *Ireland:* Rule says Natural. (Wrong)
      *   *Bengal:* Rule says Natural/Mixed. (Wrong/Misleading)
