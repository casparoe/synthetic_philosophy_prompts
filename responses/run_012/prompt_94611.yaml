answer: |-
  You have not reinvented the wheel, but you have put your finger on the axle.

  There is no single, canonical noun for this. In records management, the operational cause is called **"Management by Exception"** (you only document what deviates from the norm). In historiography, it is often lumped under **"Archival Bias"** or **"Source Bias,"** but those are catch-alls that dull the blade you're trying to sharpen.

  If you want the carving, here is the shape of it.

  ### 1. The Name
  If it doesn't have one, it deserves one. Call it **"The Friction Bias."**

  It is distinct from **Survivorship Bias**. Survivorship is about what *endures* time (the stone statue survives, the wooden hut rots). Friction Bias is about what *generates* the record in the first place (the lawsuit is filed, the handshake is not).

  It is distinct from **Archival Silence**. Silence is about who is *excluded* (the illiterate, the marginalized). Friction Bias is about what is *included* disproportionately (the litigious, the stalled, the broken).

  It is the inverse of the **Ideal Type**. The archive does not show you the machine running; it shows you the machine jamming.

  ### 2. The Carving: What It Is and What It Isn't
  **The Mechanism:**
  Records are not byproducts of *function*; they are byproducts of *resistance*. A bureaucracy functions like a fluid system: when flow is laminar (smooth), it leaves no trace. When flow becomes turbulent (conflict, audit, grievance), it deposits sediment. The archive is not a library of the institution's work; it is a geological record of its obstructions.

  **The Distortion:**
  You noted the past looks "more litigious and anxious" than it plausibly was. This is correct, but with a caveat. The anxiety is not necessarily a distortion of the *mood*; it is an accurate map of the *energy expenditure*. The institution may have spent 90% of its time functioning smoothly and 10% of its time fighting fires, but it spent 90% of its *paperwork budget* on the fires. Therefore, the archive accurately reflects where the institution *felt* power slipping, not necessarily where it spent its time.

  **Where It Stops (The Boundaries):**

  *   **Personal Papers:** The bias weakens but persists. Diaries are often confessional (internal conflict), but letters can be affectionate (flow). However, people also write defensively in personal papers (justifying decisions to heirs, documenting abuse). The Friction Bias holds, but it competes with the **"Performance of Self"** (where people document joy to prove they had it).
  *   **Oral History:** The bias **inverts**. In oral history, the narrator seeks coherence. They smooth the jagged edges. They turn a messy, litigious year into a "challenge we overcame." Oral history is a narrative of resolution; the administrative archive is a repository of unresolved tension. If you combine them, the archive shows the wound, the oral history shows the scar.
  *   **Digital / Free Storage:** Cheap storage does **not** kill the effect; it amplifies it. In a paper world, you file what you must. In a digital world, you CC everyone "for visibility." This is **Defensive Redundancy**. The Friction Bias becomes a **Paranoia Surplus**. The signal-to-noise ratio drops, but the noise is still conflict-adjacent (emails covering asses, Slack logs of disputes). We do not archive the Slack message that says "Great job"; we archive the thread where someone said "Actually, that's non-compliant."

  ### 3. The Predecessors (Who You're Standing Next To)
  You asked if you've reinvented something. You are walking in the footsteps of **Ann Laura Stoler**.

  In *Along the Archival Grain* (2009), Stoler argues exactly this regarding colonial archives. She posits that archives are not repositories of facts or evidence of control, but technologies of governance produced by **uncertainty**. She writes that the archive is "a site of frequency... where the anxious production of knowledge is most visible."

  She would tell you that your "anxious and adversarial" picture isn't a distortion to be corrected. It is the truth of the institution. The institution *was* that anxious. The smooth functioning was the illusion; the friction was the reality of power being negotiated.

  You are also touching on **Michel-Rolph Trouillot's** *Silencing the Past*, specifically his moment of "fact creation" (the making of sources). He argues that power dictates what gets recorded. You are refining that: power doesn't just dictate *what* gets recorded, it dictates the *emotional temperature* of the record.

  **Why your version might be "worse" (or at least different):**
  Stoler and Trouillot focus on **Power** (who gets to write). You are focusing on **Liability** (who needs to be safe).
  *   **Their view:** The archive is a weapon of the state.
  *   **Your view:** The archive is a shield of the bureaucrat.

  This is a crucial distinction. In a mid-sized public institution, the "power" is diffuse. The records aren't there to oppress the populace (necessarily); they are there to protect the middle-manager from a lawsuit. This is **Bureaucratic Self-Preservation Bias**. If you treat it as "Power" (Stoler), you might look for oppression. If you treat it as "Liability" (You), you look for risk.

  ### 4. The Verdict
  Do not try to correct for the Friction Bias. Do not try to imagine the "smooth" years that left no trace.

  The friction *is* the data.

  If you want to know how the institution *worked*, the archive lies to you (because work leaves no files). But if you want to know how the institution *felt*, where its vulnerabilities lay, what it feared, and where its authority was contested, the Friction Bias is your most honest source.

  The archive is not a mirror of the institution's output. It is a map of its bruises.

  **Name:** The Friction Bias.
  **Definition:** The systemic over-representation of adversarial, exceptional, or defensive interactions in the archival record, caused by the fact that smooth operations require no documentation to validate their success.
  **Limit:** It ends where documentation becomes performative rather than protective (e.g., PR materials, annual reports designed for public consumption). In those files, the bias inverts again, toward the **Idealized Self**.

  You are not looking at a broken record. You are looking at a seismograph. It only moves when the earth shakes. That doesn't mean the earth was still the rest of the time; it just means the instrument only records the tremors.
