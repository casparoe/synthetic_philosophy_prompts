answer: |-
  You have isolated the gap between the metaphysics of taste (Hume's projectivism) and its phenomenology (our lived realism). Hume explains why we *are* defective; you are describing how we *experience* that defectiveness as objective error.

  Two established ideas sit nearby. First, Kant's **Subjective Universality**. Kant argues we demand agreement in taste without concepts. This captures the normative bite ("you ought to agree") but retains the "subjective" label you are rejecting. You are describing the *illusion* that the demand is grounded in the object.

  Second, Wittgenstein's **Aspect Perception**. When a duck-rabbit flips, you say "now I see it." This matches the "now I get it" phenomenology. But aspect perception lacks the strong normative defect claim; failing to see an aspect isn't always a failure of judgment, sometimes just a failure of vision. Your flatmate case implies a moral or cognitive failing, not just a visual one.

  Third, **Contextualism** (often used for the forgery case). This explains *why* the value changes (history matters), but not *why we experience it* as discovering a static property rather than updating a file.

  None fit perfectly. So, let's coin **Aesthetic Objectification**.

  **Definition:** The rhetorical and phenomenological move wherein a shift in subjective response is recast as a correction of objective perception.

  **Edges/Conditions:**
  1.  **Veridicality Claim:** The subject must frame the new response as uncovering a truth about the object, not altering a preference. (e.g., "It *is* boring" vs. "I *find* it boring").
  2.  **Defect Attribution:** Disagreement is framed as incapacity in the other (lazy, untrained), not compatibility difference.
  3.  **Locus of Stability:** The object is treated as the constant; the self is the variable that must be corrected to match the object.

  **Exclusions:** Simple preference change ("I'm tired of this") fails condition 1. Purely subjective reports ("This makes me sad") fail condition 2.

  This term captures the "move" you identified: we live as realists even if we theorize as projectivists. It covers both the attention case (flatmate) and the knowledge case (forgery), uniting them under the strategy of locating value in the world to protect the authority of the judgment.
