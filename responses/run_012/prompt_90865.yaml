answer: |-
  **Final Exam: Evolution, Mind, and Design**
  **Time Allowed:** 90 Minutes
  **Instructions:** Closed book. No citations required. Answer the following question in essay form.

  **Question:**
  In class, we refined Dennett's distinction between *cranes* (bottom-up mechanisms that lift complexity from existing foundations) and *skyhooks* (top-down explanations that assume competence without tracing its history). We also introduced two error types: *skyhook laundering* (using crane-like vocabulary to hide unexplained competence) and *crane laundering* (dismissing a valid bottom-up mechanism as magical because it feels too complex).

  1.  Propose a rigorous, operational test to distinguish a crane from a skyhook. Do not use slogans; define the causal requirement.
  2.  Apply your test to the following three claims:
      *   (A) Metabolism-first origin stories where autocatalytic sets are claimed to generate replicators without prior selection.
      *   (B) The claim that the self is a "center of narrative gravity" rather than a homunculus.
      *   (C) A critic's claim that Hayekian spontaneous order is an illusion and markets are *nothing but* the sum of individual transactions.
  3.  Identify which of (A), (B), or (C), if any, constitutes *greedy reductionism* rather than a skyhook error. Explain why the obvious label for one of these cases is a trap.

  ***

  **Model Answer:**

  To distinguish a crane from a skyhook, one must apply the **Causal History Test**: Does the explanation trace the incremental generation of competence from simpler predecessors using available energy and physical laws, or does it assume the competence exists prior to the mechanism that supposedly produces it? A crane lifts; a skyhook hangs. A valid crane must account for the work required to organize complexity. If an explanation invokes "emergence" or "complexity" without specifying the mechanism that filters or selects for that organization, it is likely skyhook laundering. Conversely, if an explanation dismisses a functional level of organization as non-existent simply because it reduces to lower-level parts, it risks greedy reductionism.

  Applying this test to Case (A), metabolism-first theories often fail. While they use chemical vocabulary (crane-like), they frequently assume that autocatalytic sets form with sufficient specificity to kickstart replication without a selection mechanism to filter errors. This smuggles in the competence of replication under the guise of "self-organization." It is **skyhook laundering**: the chemistry is doing the lifting for free.

  Case (B), the self as a center of narrative gravity, passes the test. It posits a functional abstraction constructed by the brain's parallel processes over time. It does not assume a pre-existing soul (skyhook) nor does it deny the functional reality of the self (greedy reductionism). It describes a crane: a fiction that exerts causal power because the system treats it as real. The trap here is that students often label this a skyhook because "narrative gravity" sounds abstract. This is **crane laundering**: dismissing a valid bottom-up functional description because it lacks a tangible substrate.

  Case (C) is the clearest example of **greedy reductionism**. The critic acknowledges the phenomenon (market order) but dismisses the emergent level as illusory, reducing it to "nothing but" individual trades. This ignores the informational crane of price signals and institutional rules that shape individual behavior. The order is real and causally potent, not merely an aggregate.

  Therefore, (C) is greedy reductionism. (A) is skyhook laundering. (B) is a valid crane. The deliberate trap is Case (B): the obvious label for many students is "skyhook" (because it concerns the 'self') or "greedy reductionism" (because it calls the self a 'fiction'). Recognizing that a functional fiction can be a mechanistic crane is the key to avoiding crane laundering. Students who label (B) as a skyhook fail the Causal History Test, as the narrative center is built by neural processes, not invoked to explain them. Students who label (C) as a valid crane fail to see that denying the emergent level destroys the explanatory power of the market mechanism itself.

  ***

  **Marking Scheme (Out of 25)**

  **1. The Operational Test (8 marks)**
  *   **Must Hit (4 marks):** Defines test via causal history/work generation (e.g., "traces incremental steps," "accounts for competence generation"). *No slogans.*
  *   **Must Hit (4 marks):** Explicitly distinguishes between assuming competence (skyhook) vs. building it (crane).

  **2. Application to Cases (12 marks)**
  *   **Case A (Metabolism) (4 marks):** Identified as Skyhook Laundering. Reason: Assumes specificity/replication without selection mechanism.
  *   **Case B (Narrative Self) (4 marks):** Identified as Valid Crane. Reason: Functional abstraction built by processes. **Trap:** Must note that calling it a skyhook is Crane Laundering.
  *   **Case C (Hayek Critic) (4 marks):** Identified as Greedy Reductionism. Reason: Dismisses emergent causal power as "nothing but" parts.

  **3. Identification of Greedy Reductionism (5 marks)**
  *   **Must Hit (3 marks):** Correctly identifies (C) as the greedy reductionism case.
  *   **Must Hit (2 marks):** Explains why (B) is the trap (looks like skyhook/reductionism but is crane).

  **Named Misconceptions (Deduct 3 marks each if present)**
  *   **The "Nothing But" Error:** Student defines greedy reductionism simply as "saying X is nothing but Y" without noting the loss of explanatory power/function. *They miss that reduction is fine; greed is ignoring the crane.*
  *   **The "Emergence is Magic" Error:** Student claims any appeal to "emergence" or "abstraction" (like Case B) is automatically a skyhook. *They fail to see functional abstractions can be mechanistic.*
  *   **The Slogan Recital:** Student uses the phrase "cranes good, skyhooks bad" or "Darwin killed the skyhooks" verbatim. *They are regurgitating, not thinking.*

  **A vs B Separator:**
  An A grade explicitly articulates why Case (B) is a crane despite being a "fiction," whereas a B grade correctly labels it but fails to defend it against the charge of crane laundering.
