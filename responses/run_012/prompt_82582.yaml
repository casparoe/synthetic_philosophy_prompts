      *   **Tone:** Professional, analytical, rigorous, Kantian but practical for a mediation desk.

  2.  **Deconstruct Kant's *Perpetual Peace*:**
      *   **Preliminary Articles (6):** Conditions for entering peace negotiations (negative conditions).
          1.  No secret reservations for future war.
          2.  No independent state shall be acquired by another (inheritance, exchange, purchase, donation).
          3.  Standing armies shall gradually be abolished.
          4.  No national debts for external friction.
          5.  No forcible interference in another state's constitution/government.
          6.  No acts of war that make future mutual confidence impossible (assassins, poisoners, breach of surrender).
      *   **Definitive Articles (3):** Positive conditions for establishing peace.
          1.  Civil Constitution of every state shall be Republican (representative, separation of powers, rule of law).
          2.  Law of Nations shall be founded on a Federation of Free States.
          3.  Cosmopolitan Right shall be limited to Conditions of Universal Hospitality.
      *   **Key Distinction:** Preliminary Articles are mostly immediate/negative (stop doing X), except #3 (standing armies) which is gradual. Definitive Articles are aspirational/structural.
      *   **The "Truce vs. Peace" distinction:** For Kant, a peace treaty that ends a war but leaves causes for future war is merely a truce (*indutiae*), not peace (*pax*).

  3.  **Adapt Kant to the Mediation Context:**
      *   *Challenge:* Kant wrote about sovereign states. The user has a Government, an Armed Group (AG), and External Sponsors.
      *   *Adaptation Strategy:*
          *   **Government:** Treated as the de jure state authority.
          *   **Armed Group:** Treated as a *de facto* authority holding territory/levying taxes. Kant's conditions regarding "independence" and "constitution" must apply to them if they are to be part of a *durable* settlement, not just a ceasefire.
          *   **External Sponsors:** Treated as guarantors but also potential violators of non-interference (Prelim #5) or acquisition (Prelim #2).
      *   *Sorting Failures:*
          *   *Disqualifying Now:* Violations of Prelim Articles 1, 2, 5, 6 (mostly). These make trust impossible or treat entities as property.
          *   *Conditional/Gradual:* Prelim #3 (Standing Armies) and Definitive Articles (Republican constitution, Federation). These can be roadmaps.
      *   *The "Truce" Threshold:* If Prelim Articles are violated in a way that precludes future trust or treats people/states as means rather than ends, it's a truce.

  4.  **Develop the Procedure (The "Kantian Filter"):**
      *   *Step 1: Preliminary Article Check (The "Negative" Filter).*
      *   *Step 2: The Sovereignty/Agency Check (Adapting Prelim #2 & #5).*
      *   *Step 3: The Trust/Atrocity Check (Prelim #6).*
      *   *Step 4: The Structural Check (Definitive Articles - Republicanism/Federation).*
      *   *Decision Nodes:* Fail Step 1, 2, or 3 = Truce. Pass those, fail Step 4 = Peace (Political Judgment). Fail All = Peace.

  5.  **Drafting the Procedure Details:**
      *   *Need to specify:* What counts as a pass? What counts as a "carry forward"?
