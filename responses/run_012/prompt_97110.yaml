answer: |-
  Your intuition that the "textbook story" is too tidy is correct. You have identified a genuine friction between the popularized resolution and the cutting-edge literature. However, your forced choice—either Landauer is wrong or the Demon works—is a false dichotomy. Here is where your framing requires adjustment.

  **1. Information Engines Are Not Fraudulent**
  You note that information engines extract work from a single heat bath using measurement. This is true and experimentally verified (e.g., colloidal particles in optical traps). However, this does not violate the Second Law because the law has been generalized. In modern stochastic thermodynamics, information is treated as a thermodynamic resource akin to fuel. The inequality is not simply $\Delta S \ge 0$, but $\Delta S - I \ge 0$, where $I$ is the mutual information gained. These engines do not create energy from nothing; they convert information into work. The Second Law is preserved not by preventing the extraction, but by accounting for the information consumption. Your framing assumes the Second Law forbids *any* work from a single bath, whereas the consensus is that it forbids work from a single bath *without consuming correlations*.

  **2. The "Reversible Demon" and the Cycle Problem**
  Regarding claims of reversible measurement or reset: A demon can indeed measure reversibly (Charles Bennett's key insight). It can also delay erasure indefinitely. However, to function as a perpetual machine, the demon must operate cyclically. If it does not erase, its memory fills with entropy. To reset reversibly requires an infinite slow process or a supply of low-entropy memory states. Physicists who argue for "no erasure cost" typically shift the thermodynamic debt to the *preparation* of the initial memory state. If you account for the cost of preparing a blank slate, the balance sheet still closes. The controversy is not whether the balance closes (it does), but *where* in the cycle the cost is booked.

  **3. Settled Science vs. Contested Foundations**
  *   **Settled:** There is no perpetual motion. The Second Law holds statistically. Information is physical and has thermodynamic consequences. Information engines are real and consistent with thermodynamics.
  *   **Contested:** Whether Landauer's Principle is the *fundamental* exorcism. The "Landauer-Bennett" orthodoxy is dominant, but significant dissent exists. Philosophers of physics (e.g., John Norton, Oliver Earman) argue that Landauer's Principle presupposes the Second Law it aims to save, rendering the explanation circular. Others argue the cost lies in the measurement coupling, not erasure. Recent experiments verify Landauer's bound, but they do not settle the foundational debate over whether information *causes* the thermodynamic cost or merely tracks it.

  **Where Your Framing Goes Wrong**
  You treat Landauer's Principle as the *only* barrier against the Demon. In reality, Landauer's Principle is the most popular *accounting method* for the barrier. If one rejects Landauer's specific mechanism, one does not accept a working Demon; one simply adopts a different bookkeeping method (e.g., measurement cost or correlation cost) that yields the same net result: no violation of the Second Law. The "guardian" is not erasure specifically, but the equivalence of information and entropy, however that equivalence is derived.

  Verdict: Your dichotomy is false; the law stands, but the exorcism mechanism remains contested.
