answer: |-
  Elena, a structural engineer, must certify a 1970s office block for occupancy. Regulatory data shows 95% of buildings from this era pass safety inspections without retrofitting. This coarse base rate is externally mandated and widely accepted. Elena would prefer to certify; it avoids costly delays and conflict with the owner. However, her inspection reveals this building lacks the continuous rebar tying found in 90% of the passing cohort, a feature known to prevent collapse during seismic shifts. There are too few non-rebar buildings from this era to generate a specific failure rate. If she certifies based on the era average and the building collapses, tenants die. If she condemns it based on the missing rebar, she faces lawsuits from the owner for unnecessary retrofitting costs. The base rate suggests safety; her specific inspection suggests hidden fragility.

  **1. Forecasts:** The Outside View mandates certification. It treats the building as a random draw from the mandated era cohort, deferring to the 95% success rate as the only objective statistic. The Inside View recommends condemnation. It prioritizes the verifiable absence of seismic rebar—a known causal prerequisite for safety—over the cohort average. Neither verdict is stipulated; the Outside View follows the rule of statistical deference, while the Inside View follows the rule of causal evidence.

  **2. The Single Feature:** The verifiable absence of continuous rebar tying. This feature decouples the specific case from the mechanistic cause of the base rate's success, rendering the aggregate statistic misleading for this specific instance.

  **3. Removal/Weakening:** If the missing rebar were merely hypothesized rather than verifiable, the Inside View becomes speculation. In that modification, the case collapses into the standard planning-fallacy shape where the Outside View is plainly right: hard data beats gut feeling. The current case holds only because the Inside View possesses *better* causal data than the Outside View's coarse statistics.

  **4. The Outside View Reply:** A defender argues the Inside View is simply the Outside View applied to a finer reference class (1970s buildings without rebar). For this reply to succeed, the finer class must possess a reliable base rate. The case survives this reply because it stipulates insufficient data for the finer class. The Outside View thus demands deference to a known-inapplicable statistic or admits it has no guidance, exposing the rule's dependency on prior judgment.

  **5. Modesty:** The Inside View is the truly modest choice; it admits the coarse statistic doesn't apply here. "Be modest" fails as a determinate policy. It merely relocates the critical judgment from "what will happen?" to "which reference class counts?", hiding the substantive risk assessment behind a procedural rule that cannot resolve the class selection itself.
