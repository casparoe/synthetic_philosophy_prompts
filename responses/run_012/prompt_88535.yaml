  *(Self-Correction Note)*: On Claim 6. Does Strawson concede *anything*? He concedes that determinism is not *logically incompatible* with responsibility (agreeing with Optimist against Pessimist), but he rejects the Optimist's *proof*. He does *not* concede that we lack "ultimate responsibility." He thinks that phrase is a philosophical confusion. So the friend is definitely wrong there.

