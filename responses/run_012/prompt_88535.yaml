      *   *Psychological Incapacity:* The friend says "we cannot give them up." Strawson says "we cannot *universally* give them up without ceasing to be human." Distinction matters.

  8.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the user's prompt about whether the friend's claim stands. (It largely collapses because the premise of the "concession" is false).

