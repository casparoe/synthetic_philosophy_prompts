answer: |-
  Your friend's summary is a very common reading of Strawson, often found in introductory textbooks, but it contains one critical distortion that changes the entire philosophical force of the essay. You are right to be suspicious, particularly about the "concession" and the "psychological incapacity" argument.

  Here is a claim-by-claim breakdown of your friend's summary, categorized by how well it aligns with Strawson's actual text.

  ### Claim-by-Claim Analysis

  **1. "The essay's whole point is that determinism is simply irrelevant to moral responsibility."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Correction:** Strawson argues that the *general thesis* of determinism is irrelevant. He does *not* argue that all causal information is irrelevant. Specific determining causes (e.g., psychosis, extreme coercion) are relevant because they modify our reactive attitudes. Strawson's point is that the *truth or falsity* of universal determinism does not, in itself, require us to abandon the framework of responsibility.

  **2. "Whether someone is responsible is not a metaphysical fact about whether he could have done otherwise; it is a question about whether it is appropriate to hold him responsible."**
  *   **Verdict:** **What Strawson Actually Holds.**
  *   **Correction:** This is the core of Strawson's shift. He moves the question from metaphysics (the structure of the universe) to the interpersonal (the structure of human relationships).

  **3. "That is settled entirely by our practices of blame and praise."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Correction:** Strawson grounds these practices not merely in social convention ("practices") but in "reactive attitudes" (resentment, gratitude, indignation) which are natural, non-optional features of human life. It is deeper than mere custom; it is constitutive of what it means to participate in human society.

  **4. "He labels the hard determinist the 'pessimist' and the defender of these practices the 'optimist'..."**
  *   **Verdict:** **What Strawson Actually Holds.**
  *   **Correction:** Accurate. The Pessimist believes determinism rules out responsibility. The Optimist (traditional compatibilist) believes determinism is compatible with responsibility, usually by analyzing "could have done otherwise" hypothetically.

  **5. "...and says Strawson comes down on the optimist's side."**
  *   **Verdict:** **Defensible Simplification (with caveats).**
  *   **Correction:** Strawson agrees with the Optimist's *conclusion* (responsibility survives determinism) but explicitly rejects the Optimist's *argument*. He thinks the Optimist concedes too much to the Pessimist by accepting the Pessimist's metaphysical terms of debate.

  **6. "He concedes that if determinism were true, no one would be ultimately responsible in the deep sense the pessimist wants..."**
  *   **Verdict:** **What Strawson Would Flatly Reject.**
  *   **Correction:** **This is the critical error.** Strawson does *not* concede this. He argues that the Pessimist's demand for "ultimate responsibility" (in a sense that requires being *causa sui* or free from deterministic causation) is unintelligible. He does not say, "Okay, you Pessimists are right that we aren't ultimately responsible, but we blame anyway." He says, "The Pessimist's question is senseless; there is no 'deep sense' of responsibility to be lost." By suggesting Strawson concedes the metaphysical point, your friend turns Strawson into a skeptic who recommends blame for pragmatic reasons, rather than a philosopher who dissolves the skeptical worry.

  **7. "...but says the concession costs nothing, because the reactive attitudes are so deeply woven into our nature that we simply cannot give them up — we are psychologically incapable of it..."**
  *   **Verdict:** **Defensible Simplification (but risks distortion).**
  *   **Correction:** Strawson does argue we cannot *universally* abandon reactive attitudes. However, it is not merely a brute psychological inability (like being unable to fly). It is that to abandon them universally is to adopt the "objective attitude" toward all humans, which means ceasing to view them as persons and viewing them as objects to be managed or cured. This would mean the end of ordinary human relationships (love, friendship, rivalry). It is not just that we *can't*; it's that we *wouldn't* want to, because it would cost us our humanity.

  **8. "...and what we cannot abandon we may as well keep."**
  *   **Verdict:** **What Strawson Would Flatly Reject (as phrased).**
  *   **Correction:** This phrasing suggests a pragmatic resignation ("might as well"). For Strawson, the reactive attitudes are not just habits we keep because they are sticky; they are the *foundation* of moral good and evil. They are rationally justified by the fact that they are essential to the kind of life we value. It is not a "may as well"; it is a "must, if we are to live humanly."

  **9. "So, on his reading, the essay is really a defense of compatibilism: it shows that determinism and moral responsibility are compatible, just not for the usual reasons."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Correction:** Strawson explicitly accepts the label "compatibilist" in the essay, provided it is understood as a "modified" compatibilism. However, many scholars argue he actually *dissolves* the problem rather than solving it. He shows that the conflict only arises if we accept a mistaken picture of what responsibility is.

  ---

  ### Addressing Your Specific Concerns

  **1. The "Psychological Incapacity" Move**
  You are right to be unsure here. Your friend presents this as a weakness: "We are stuck with these attitudes, so we keep them." Strawson presents it as a strength: "These attitudes are the bedrock of our moral life."
  Strawson distinguishes between the **participant stance** (engaging with others via reactive attitudes) and the **objective stance** (viewing others as objects of social policy or therapy). While we can switch to the objective stance locally (e.g., when dealing with a child or someone mentally ill), Strawson argues it is humanly impossible to maintain the objective stance universally. If we did, we would no longer be participating in human relationships. Therefore, the framework of responsibility is not something we can step outside of to judge it from a "God's eye view."

  **2. Is it Fair to File the Essay Under "Compatibilism"?**
  It is fair, but only with heavy qualification. Traditional compatibilism (the "Optimist") tries to prove that determinism is logically consistent with "freedom." Strawson argues that the debate itself is misplaced. He is a compatibilist in the sense that he believes the truth of determinism does not undermine responsibility, but he rejects the traditional *proofs* of compatibilism.
  If your friend classifies it as compatibilism *because* Strawson concedes the Pessimist's metaphysical point (Claim 6 above), then the classification is misleading. If they classify it as compatibilism because Strawson believes responsibility survives determinism, it is accurate.

  ---

  ### Does the Friend's Concluding Claim Stand?

  **The concluding claim:** *"The essay is really a defense of compatibilism: it shows that determinism and moral responsibility are compatible, just not for the usual reasons."*

  **Verdict:** **The conclusion stands, but the support collapses.**

  Your friend reaches the right destination (Strawson is a kind of compatibilist) but takes a wrong turn getting there.

  *   **Why the support collapses:** The argument rests on Claim 6 (that Strawson concedes the Pessimist's metaphysical point). If Strawson actually believed that determinism destroys "ultimate responsibility" but we keep blame anyway because we are psychologically weak, he would not be a compatibilist. He would be a **moral skeptic** or a **fictionalist**. He would be saying, "Responsibility is false, but we must pretend it is true."
  *   **Why the conclusion stands:** Strawson *is* arguing that determinism and responsibility are compatible. However, they are compatible not because we are stuck with blame despite the truth, but because the "truth" the Pessimist worries about has no grip on the concept of responsibility in the first place.

  **Summary for your seminar:**
  You can tell your friend: "You get the label right, but you get the argument wrong. Strawson doesn't concede the metaphysical battle to the Pessimist and then retreat to psychology. He argues the Pessimist's metaphysical demand is unintelligible. We don't keep reactive attitudes because we are too weak to drop them; we keep them because they constitute the only framework in which human life makes sense."
