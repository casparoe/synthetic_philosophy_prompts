answer: |-
  ### Straight Talk: Does the Distinction Collapse?

  Before you commit to this, here is the risk assessment. Formally, in standard Bayesianism, your distinction **collapses**. If $P(E) = 1$, conditionalization yields zero confirmation ($P(H|E) = P(H)$), regardless of whether $E$ is "used-up" (Mercury) or "overlooked" (Tiles). The math does not care *why* the probability is 1, only *that* it is 1.

  However, the distinction **does not collapse** if you move to a framework that models *awareness* or *partition sensitivity*.
  *   **Case 1 (Used-up):** You were aware of $E$, assigned it 1, and it is in your active partition. The problem is temporal.
  *   **Case 2 (Overlooked):** You were aware of $E$, but it was not in the *relevant partition* for $H$. You weren't ignoring $E$; you were ignoring the *link* between $E$ and $H$.

  **The Trap:** If you stay within standard probability spaces, your thesis will stall at Month 4 because the formalism forces the collapse.
  **The Opportunity:** If you frame the project as testing whether standard "fixes" (e.g., learning logical implications, counterfactual credences) apply symmetrically to both cases, you have a viable thesis. If the fixes work for Mercury but feel ad hoc for Tiles (or vice versa), you have proven that the single-label "Old Evidence Problem" is masking two distinct normative issues.

  **Verdict:** The distinction is philosophically robust but formally fragile. You must commit to a formalism that can track the difference (e.g., awareness growth or dynamic partitions) or focus on the *adequacy* of current solutions across both cases. A one-year timeline is realistic *only if* you do not attempt to solve the problem, but rather diagnose the conflation.

  ***

  # Thesis Prospectus

  **Title:** Two Problems in One Coat: Disaggregating the Old Evidence Problem
  **Degree:** MA in Philosophy
  **Duration:** 12 Months

  ### 1. The Research Question
  The "Old Evidence Problem" asks how a hypothesis $H$ can be confirmed by evidence $E$ when the agent already assigns $P(E) = 1$. Standard Bayesian conditionalization forbids this, yet historically, old evidence (e.g., Mercury's perihelion) clearly confirms new theories (e.g., General Relativity).

  Current literature treats this as a singular formal puzzle. This project challenges that unity. I distinguish two categories of old evidence:
  1.  **Temporal Old Evidence:** Evidence updated on prior to the theory's existence (Mercury). The information is "used-up."
  2.  **Structural Old Evidence:** Evidence known but never conditionalized upon relative to the theory because the relevance was unrecognized (Tiles). The information is "dormant."

  **Primary Question:** Do standard Bayesian solutions to the Old Evidence problem (e.g., counterfactual credences, conditionalizing on logical implications) apply symmetrically to Temporal and Structural cases?
  **Secondary Question:** If they do not, does this imply that Bayesian confirmation theory requires distinct mechanisms for *updating* versus *awareness expansion*?

  ### 2. Why the Debate Leaves This Open
  Existing approaches aim to restore confirmation where $P(E)=1$.
  *   **The Counterfactual Approach:** Asks what credence in $E$ would be if the agent didn't know $E$. This handles Temporal cases intuitively but seems incoherent for Structural cases (why pretend I don't know the floor is tiled if the issue is merely that I hadn't considered the tiles *in this context*?).
  *   **The Logical Implication Approach (Garber-style):** Suggests we update not on $E$, but on the proposition that $H$ entails $E$. This works formally for both, but arguably misdiagnoses the Structural case. In Structural cases, the agent isn't learning a logical truth; they are noticing a relevance relation they previously ignored.

  The debate remains open because proponents of these solutions aim for a general fix. They do not test whether their solution feels normative or ad hoc when applied specifically to Structural cases. By treating all $P(E)=1$ instances as identical, the literature fails to determine if "Old Evidence" is a problem of *memory* (what did I know when?) or *attention* (what did I consider relevant?).

  ### 3. Methodology
  I will not merely re-read the debate. Exegesis will not reveal whether the distinction holds normative weight. Instead, I will employ **case-based formal modeling**.

  1.  **Construct Two Models:** I will build simplified Bayesian networks representing a Temporal case and a Structural case. Both will start with $P(E)=1$.
  2.  **Apply Standard Fixes:** I will mathematically apply the Counterfactual and Logical Implication solutions to both models.
  3.  **Normative Stress Test:** I will evaluate the outputs. Does the Counterfactual approach yield intuitive confirmation values for the Structural case? Does the Logical Implication approach capture the "discovery" aspect of the Structural case, or does it reduce it to mere logic?
  4.  **Awareness Framework:** If standard models fail to distinguish the cases, I will introduce a variable for *awareness states* (partitions) to see if this captures the Structural intuition without breaking the Temporal case.

  This method moves beyond "what did philosopher X say" to "does the machinery work uniformly?" If the machinery jams on one case but not the other, the conflation hypothesis is proven.

  ### 4. Work Plan (Month-by-Month)

  *   **Months 1–2: Literature & Formalization.** Map the standard solutions (Counterfactual, Garber, etc.). Define the Temporal/Structural distinction precisely in probabilistic terms.
  *   **Months 3–4: Model Construction.** Build the two baseline Bayesian models. Ensure the "Structural" case is not just a disguised "Temporal" case (i.e., ensure $P(E)=1$ is stable in both, but the *path* to $H$ differs).
  *   **Months 5–7: Testing Solutions.** Run the standard fixes on both models. Calculate the resulting confirmation values. Document where the solutions feel ad hoc or where they yield divergent results.
  *   **Month 8: The Awareness Variable.** If standard fixes collapse the distinction, test an "awareness growth" model. Can we model Structural evidence as expanding the partition rather than updating on a proposition?
  *   **Months 9–10: Drafting.** Write the core argument: The Old Evidence problem is two problems. Standard solutions solve one better than the other.
  *   **Months 11–12: Revision.** Refine the formalism. Ensure the conclusion is determinate (either the distinction demands new formalism, or it is psychologically real but formally idle).

  ### 5. Failure Conditions
  This project fails if:
  1.  **Formal Collapse:** It turns out that to model the Structural case properly, I must assign $P(E) < 1$. If Structural evidence *requires* uncertainty to function, it is not "Old Evidence" at all, and the distinction dissolves.
  2.  **Solution Symmetry:** If all standard solutions apply equally well (or poorly) to both cases with no normative difference, the distinction is merely psychological, not epistemological.
  3.  **Scope Creep:** Attempting to solve the Old Evidence problem rather than diagnosing the conflation. (I must resist proposing a new theory of confirmation).

  ### 6. Feasibility and Narrowing
  A one-year timeline is realistic **only if** I restrict the scope to *diagnosing* the conflation.
  *   **Risk:** Developing a new "Awareness" formalism (Month 8) could consume the whole year.
  *   **Contingency:** If Month 7 shows that standard solutions *do* work symmetrically, I will pivot. The thesis will then argue that the Temporal/Structural distinction, while psychologically real, is **formally idle** for Bayesianism. This is still a positive result (dissolving a pseudo-problem), but it requires less modeling.
  *   **Narrowing:** If the "Awareness" route proves too technical, I will focus exclusively on the **Counterfactual Solution**. I will argue that Counterfactualizing is plausible for Temporal cases but incoherent for Structural cases, proving the literature conflates two different epistemic situations.

  ### 7. Conclusion
  The "Old Evidence Problem" is treated as a monolith. By splitting it into Temporal and Structural variants, this thesis tests the robustness of Bayesian confirmation theory. If the distinction holds, it suggests Bayesianism needs to account for attention and relevance, not just probability and time. If it collapses, it suggests the "problem" is less about evidence and more about our intuition regarding logical omniscience. Either way, the conflation will be exposed.
