  (i) **The Case**
  You wake up with amnesia at a secure retreat. You know you are at either Retreat Small ($H_S$) or Retreat Large ($H_L$), with equal prior probability. You possess a printed dossier, which only some guests receive.
  *   **$H_S$:** 50 guests total. All 50 receive dossiers.
  *   **$H_L$:** 200 guests total. Only 100 receive dossiers.
  You look down and see you hold a dossier. You must determine which retreat you are at.

  (ii) **Verdicts and Credences**
  *   **Question:** Is the retreat $H_S$ or $H_L$?
  *   **SSA:** Reasons you are a random sample from the guests. In $H_S$, 100% hold dossiers; in $H_L$, 50% do. The likelihood ratio is 2:1 favoring $H_S$. **Credence:** $P(H_S) \approx 67\%$.
  *   **SIA:** Reasons you are a random sample from all possible observers, weighting hypotheses by total observer count. $H_L$ has 4x the people (prior shift 4:1), but only 0.5x the dossier density. Net weight: $4 \times 0.5 = 2$. Ratio 2:1 favoring $H_L$. **Credence:** $P(H_L) \approx 67\%$.
  *   **Result:** Opposite verdicts.

  (iii) **Mechanism and Variation**
  The divergence is driven by the **sample space** of *unobserved* observers (guests without dossiers). SIA counts them (inflating $H_L$'s prior weight); SSA ignores them (focusing only on the dossier-holding fraction).
  *   **Variation:** Alter $H_L$ to have 50 guests total, 40 with dossiers.
  *   **Effect:** SIA's population advantage vanishes (50 vs. 50). Both assumptions now favor $H_S$ based on dossier frequency (100% vs. 80%). The divergence disappears, proving the conflict relies on the *unobserved* population size, which SIA counts and SSA discounts.

  (iv) **Objection and Defense**
  An SIA defender attacks: "You are more likely to exist in a world with 200 people than 50. Ignoring this is ignoring your own existence probability."
  *   **Critique:** This exposes a genuine cost: SIA compels you to favor the larger population even when your specific evidence (the dossier) is proportionally rarer there. It forces you to bet against the diagnostic value of your local data in favor of a metaphysical headcount. This is not a mere stipulation but a substantive commitment to "presumptuous" reasoning in local contexts.

  (v) **Substantive Dispute**
  The case shows the dispute is **substantive**. The assumptions prescribe opposite betting behavior. If offered a even-money bet on $H_S$, the SSA agent accepts (expected gain), while the SIA agent rejects (expected loss). Since one strategy objectively loses money in repeated trials of this structure (assuming the setup is fixed), the disagreement is not verbal but concerns how indexical evidence maps to probability.
