  APPENDIX C: CREDENCE COMPLIANCE AND DIACHRONIC ALIGNMENT POLICY

  1.0 GENERAL OBLIGATION OF TEMPORAL COHERENCE
  1.1 All analysts must maintain strict alignment between current credence assignments and expected future credence assignments. For any proposition P and any future time t+1, if an analyst expects their credence in P to be value x at time t+1, their credence in P at time t must already be x.
  1.2 Anticipated changes in assessment constitute immediate obligations. An analyst who expects tomorrow's briefing to leave them more optimistic about a forecast is required, today, to adopt that higher level of optimism. Failure to pre-emptively align current credence with expected future credence is classified as Misalignment Misconduct and subjects the employee to remedial training.
  1.3 Personnel are instructed to treat their own future selves as epistemic superiors whose credences they are to adopt on pain of noncompliance. To regard a future self's assessment as less reliable than the current self's assessment without documented cause is prohibited. The future self is designated an Epistemic Superior for the purposes of internal calibration, and current judgments must defer to anticipated future judgments.

  2.0 AUTHORIZED MECHANISMS FOR REVISION
  2.1 Credence revision is permitted solely upon the receipt of new evidence requiring conditionalization. Spontaneous fluctuation, mood-based adjustment, or unexplained drift between reporting periods is classified as Unauthorized Opinion Drift.
  2.2 Any shift in probability assignment not traceable to a specific data input logged in the Evidence Tracking System will be flagged for review. Analysts must demonstrate that all changes in credence are the necessary result of conditioning on new information rather than the passage of time alone. Time itself is not evidence.

  3.0 EXCEPTIONAL CIRCUMSTANCES AND INTEGRITY CARVE-OUTS
  3.1 Employees who possess definitive knowledge that their future cognitive faculties will be compromised may file a Notice of Anticipated Epistemic Corruption (Form 88-B). Qualifying compromises include scheduled administration of mind-altering substances, mandatory attendance at persuasive seminars, exposure to coercive indoctrination, general anaesthesia, or recruitment into belief systems incompatible with Firm methodology.
  3.2 This form requires notarized verification of the corrupting event and a sworn affidavit detailing the specific direction of the expected irrationality. The affidavit must specify whether the corruption will induce overconfidence or underconfidence relative to current baselines.
  3.3 Approval of Form 88-B suspends the obligation of Temporal Coherence for the duration of the impairment. Absent an approved Form 88-B, all future selves are presumed rational and authoritative. Employees who fail to file Form 88-B prior to known corruption events will be held liable for any resulting incoherence. Ignorance of one's own future irrationality is not a valid defense.

  4.0 AUDIT AND DUTCH BOOK VERIFICATION
  4.1 Compliance is verified through two-stage betting audits designed to test for diachronic consistency. In a standard audit, the employee accepts a bet today based on current credence and a counter-bet tomorrow based on future credence.
  4.2 Worked Example: An analyst holds credence 0.6 in P but expects future credence 0.8. The auditor sells a bet paying $1 if P at $0.60 (Stage 1). Tomorrow, the auditor buys a bet paying $1 if P at $0.80 (Stage 2), settled by the analyst's later credence. If P is true, the analyst nets -$0.20. If P is false, the analyst nets -$0.20.
  4.3 This loss structure demonstrates that divergence between current and expected future credence exposes the Firm to guaranteed financial loss regardless of the proposition's truth value. Employees found liable for guaranteed losses due to noncompliance will be held personally responsible for the deficit. The audit settles the second stage by the analyst's own later credence, ensuring the loss is intrinsic to the misalignment.

  5.0 ACCURACY DISCLAIMER
  5.1 Compliance with this policy ensures internal coherence across time but does not guarantee correspondence with external reality. An employee may be fully compliant while maintaining credences that are demonstrably false.
  5.2 The Firm manages risk, not truth. Personnel are reminded that coherence is a metric of professional conduct, not a guarantee of predictive success. A compliant analyst who is consistently wrong remains in good standing provided their current credences match their expected future credences. Accuracy is secondary to structural integrity. The policy governs the internal coherence of forecasts and not their truth.
