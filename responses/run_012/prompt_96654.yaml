answer: |-
  This is a precise and well-formulated problem that sits at the intersection of metaphysics, philosophy of science, and philosophy of medicine. You have correctly identified a gap in the standard binary of "Natural vs. Social" kinds. The categories you describe are ontologically grounded (they track real causal structures) but extensionally determined by human interests (the boundary is stipulated based on consequences).

  Here is an analysis of the existing terminology, why it falls short, and a proposal for how to classify and define this phenomenon.

  ### 1. The Existing Map: Why Current Terms Fall Short

  There are three primary candidates in the philosophical literature, but each misses one of your three features.

  **A. Homeostatic Property Clusters (HPC)**
  *   *Proponent:* Richard Boyd.
  *   *Fit:* Captures your first feature (genuine division, clustering of properties that support induction).
  *   *Shortfall:* HPCs are generally treated as mind-independent. While they allow for variation, the *boundary* of the cluster is usually thought to be determined by the underlying homeostatic mechanisms, not by a stipulated threshold driven by external consequences (like cost of treatment). An HPC theorist would struggle to explain why moving the line changes the "truth" of the generalization without changing the underlying mechanism.

  **B. Interactive Kinds**
  *   *Proponent:* Ian Hacking.
  *   *Fit:* Captures your third feature (revision based on consequences). Hacking famously described how classifying people (e.g., "refugee," "autistic") changes the people classified, forcing the classification to update.
  *   *Shortfall:* Hacking's framework is specific to *human* kinds where the classification loops back to change the *nature* of the thing. In your ecology and blood-pressure examples, the vegetation or the blood pressure does not change *because* it was classified; only the *label* and the *response* change. The "looping effect" is on the science/policy, not the object.

  **C. Pragmatic Kinds (or Promiscuous Realism)**
  *   *Proponents:* John Dupré, Hasok Chang.
  *   *Fit:* This is the strongest existing fit. Dupré argues that the world does not come pre-sorted into unique natural kinds; rather, there are many cross-cutting ways to carve nature, all equally "real" relative to different human interests.
  *   *Shortfall:* "Pragmatic Kind" is very broad. It covers everything from "weed" to "quark." It does not specifically highlight the *threshold mechanism* or the *continuous underlying variable* that defines your specific cases.

  ### 2. A Proposed Name: **Interventional Kinds**

  If there is no single term of art that captures the specific *threshold-driven, consequence-sensitive* nature of these categories, they deserve one. I propose the term **Interventional Kinds**.

  This distinguishes them from *Theoretical Kinds* (defined by underlying essence, e.g., "Gold") and *Observational Kinds* (defined by appearance, e.g., "Yellow"). An **Interventional Kind** is defined by the *capacity to support a specific type of action* upon a continuous reality.

  #### Definition
  An **Interventional Kind** is a classification category where:
  1.  **Ontological Grounding:** Members share a continuous, mind-independent causal basis that supports inductive inference (e.g., blood pressure correlates with stroke risk).
  2.  **Stipulated Extension:** The boundary of the category is set by a discrete threshold on that continuum, chosen not by discovery of a natural joint, but by decision.
  3.  **Teleological Boundary:** The location of the threshold is determined by the costs, benefits, and feasibility of the interventions associated with the category (e.g., drug cost, side effects, resource allocation).

  ### 3. Drawing the Edges: Answering Your Criteria

  You asked specific questions about what is essential to this definition. Here is how the edges of **Interventional Kinds** should be drawn:

  **Does it require the revision of the boundary?**
  *   **No.** A boundary can be fixed and still constitute an Interventional Kind. The essential feature is not *that* it moves, but *why* it is placed where it is. If the cost of treatment never changes, the line might stay static for centuries. It counts as an Interventional Kind because its stability is contingent on the stability of the intervention context, not on the discovery of a natural essence. If a new treatment emerged tomorrow that made the current threshold obsolete, the category *would* shift. That counterfactual sensitivity is what matters.

  **Does it require practical consequences?**
  *   **Yes.** This is the defining feature. If the boundary were stipulated purely for theoretical convenience (e.g., "let's call stars above magnitude X 'bright' for this chart") without linking to an action (treatment, conservation policy), it would be merely a **Conventional Kind**. For it to be an Interventional Kind, belonging to the category must trigger a distinct causal pathway (prescription, culling, protection) that justifies the line.

  **Does it matter that the boundary is set by an institution?**
  *   **No.** While medicine and ecology are institutional, an individual scientist creating a model for fire risk who draws a line based on resource constraints is creating an Interventional Kind. The "institution" is just the mechanism by which the consequences are standardized. The core requirement is that the boundary reflects a *normative* judgment about what *ought* to be done, embedded within a descriptive claim.

  ### 4. Ontological Status: What is "Real"?

  You asked: *What exactly is being asserted when someone says that one of these categories is real, and whether that assertion survives a change in where the line is drawn?*

  When a clinician says "Hypertension is real," or an ecologist says "This vegetation class is real," they are asserting a **hybrid claim**:

  1.  **Realism about the Continuum:** They assert that the underlying variable (vascular resistance, soil moisture) is mind-independent and causally potent.
  2.  **Realism about the Cluster:** They assert that the region around the threshold is stable enough that induction works (people above 140/90 *do* resemble each other regarding stroke risk).
  3.  **Instrumentalism about the Boundary:** They do *not* assert that the number 140/90 is discovered in nature.

  **Does the reality survive a boundary shift?**
  **Yes.** This is the crucial insight. When the threshold moves from 140 to 130, the *category extension* changes (more people are included), but the **Interventional Kind** itself remains real.
  *   **Why?** Because the *relationship* between the classification and the outcome remains robust. The kind is not the set of people; the kind is the **rule for action applied to the continuum**.
  *   If you move the line, you are not admitting the previous kind was "fake"; you are admitting that the *optimal intervention point* has shifted. The reality of the kind lies in the **reliability of the inference from classification to outcome**, not in the specific numerical value of the cutoff.

  ### 5. Summary Recommendation

  If you need to cite existing literature, anchor your discussion in **John Dupré's "Promiscuous Realism"** or **Hasok Chang's "Pragmatic Realism."** They provide the metaphysical permission slip to say a kind can be both real and interest-relative.

  However, for precision, I recommend adopting the term **Interventional Kinds**. It signals immediately that:
  1.  The kind is grounded in nature (unlike "Social Kinds").
  2.  The kind is defined by what we *do* with it (unlike "Natural Kinds").
  3.  The boundary is a tool for management, not a map of essence.

  This terminology preserves the scientific authority of the category (it predicts and explains) while acknowledging its administrative malleability (the line can move without falsifying the science). It asserts that in the applied sciences, **utility is a component of truth.**
