      So, changing (2) is definitely the highest leverage, even if the cost is high.

      *Wait, is there a nuance on (6)?* Some argue consciousness *is* the physical state (Type Identity). But (1) says non-physical. So (1) + (6) is already tricky. But (2) + (6) is the killer.
      Actually, could one argue that the *physical correlate* was selected, and consciousness just rides along? Yes, but that makes consciousness a *byproduct*, not an *adaptation*. (6) uses the word "adaptation." In biology, that implies selection *for* the trait. So (2) + (6) is inconsistent.

      *Ranking:*
      1. Evolution vs. Epiphenomenalism (Logical contradiction in terms).
      2. Knowledge/Content vs. Epiphenomenalism (Epistemic self-stultification).
      3. Non-physical vs. Evolution (Metaphysical friction, but solvable via supervenience).

      *Wait, one more check:* (1) Non-physical. (6) Biological adaptation. Biology deals with physical organisms. If consciousness is non-physical, how is it a biological trait? It must supervene. If it supervenes, and is epiphenomenal, it's a spandrel. If it's an adaptation, it must be causal. So (1) isn't the main problem, it's (2).

      *Final Plan:*
      1. Highlight the "Evolutionary Contradiction" (2 vs 6).
