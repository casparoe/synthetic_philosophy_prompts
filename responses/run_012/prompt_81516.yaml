answer: |-
  We are writing this document to map the territory of our disagreement regarding Goodhart's Law, specifically to distinguish between what we agree happens, what we disagree about, and what evidence would actually change our minds. We represent two perspectives that have been talking past each other for too long. On one side is the view that optimization pressure itself is a causal force that breaks proxies when the optimizer is sufficiently powerful, independent of human gaming or statistical noise. On the other side is the view that the phenomena labeled as Goodhart's Law are entirely explainable through standard statistical artifacts like regression to the mean, selection on noisy proxies, and rational agents responding to incentives, with no special role for optimization strength per se. We agree that the primary goal of this text is not to declare a winner but to isolate the specific claims where our models diverge, using language that neither side feels is rigged against them.

  There is significant common ground on the phenomenon itself, regardless of the underlying cause. We all agree that when a metric is used for decision-making, the relationship between that metric and the underlying goal often degrades. We agree that this degradation is more likely when the stakes are high and when the metric is known to those being evaluated. We agree that there are clear instances where this happens, such as when teachers teach to the test rather than fostering deep understanding, or when algorithms maximize click-through rates at the expense of user well-being. We also agree on cases where this does not happen, such as when the metric is a direct physical measurement of the target with no room for manipulation, like weighing gold bullion rather than estimating its value, or when the optimization pressure is negligible compared to the noise in the system. We agree that it is genuinely an open question whether there is a residual effect left over after accounting for noise and gaming, and we agree that resolving this requires looking at systems where human agency and statistical noise are controlled for.

  We need to be explicit about the four kinds of cases we have been splitting hairs over, because we agree they all exist but disagree on whether they all count as Goodhart's Law. The first case is a noisy proxy where you pick the candidate with the best measured score and it turns out the measurement noise is partly what you picked for. The measurement camp says this is simply regression to the mean and constitutes the bulk of what people call Goodhart's Law. The optimization camp agrees this happens but views it as a baseline condition that exists even before optimization pressure is applied, whereas the real law concerns what happens when you push harder against that proxy. The second case is a proxy that is accurate where you currently are but that a strong enough search just walks right out of, finding regions of the solution space where the correlation breaks. The optimization camp says this is the core of the law, the specific failure mode of strong optimizers. The measurement camp calls this extrapolation error or model misspecification, arguing it is not special to optimizers but happens whenever you trust a correlation outside its training distribution. The third case is where the proxy and the thing you want are both driven by a common factor, so pushing the proxy moves the real thing through the back door. Both sides agree this is causal confounding, but the optimization camp argues that strong optimizers are uniquely good at finding these back doors even when humans miss them, while the measurement camp sees this as standard structural equation modeling failure. The fourth case is where the agents know the metric and lie to it. The measurement camp views this as the primary driver of the phenomenon in social systems, purely incentive response. The optimization camp views this as a subset of optimization where the agent is the optimizer, but argues that Goodhart's Law still applies even without adaptive agents, which is why the distinction matters.

  A significant portion of our fight appears to be verbal rather than substantive, specifically surrounding the phrase sufficiently strong optimizer. If the optimization camp defines a sufficiently strong optimizer as one that by definition finds a way to break any imperfect proxy, then the claim is tautological and unfalsifiable, which the measurement camp rightly rejects. However, if the claim is that optimizers we can actually build or institutions we actually run will reach a threshold of power where they break proxies that held under weaker pressure, then that is a substantive claim about the world. Once we strip out the tautological definition, what is left is the claim that there is a continuous relationship between optimization power and proxy divergence that cannot be fully explained by noise or gaming alone. The measurement camp does not need to call anything an optimizer if they do not want to, provided they agree that search intensity or selection pressure is the variable in question. The optimization camp does not need to concede that it is all just selection, provided they agree that the burden of proof is on them to show an effect beyond standard statistical expectations.

  Our core disagreement lies in the mechanism of failure. The optimization camp claims that even in the absence of adversarial agents and with unbiased measurements, increasing the intensity of the search process will systematically drive a wedge between the proxy and the target because the proxy is never perfectly aligned in high dimensions. The measurement camp claims that if you control for selection bias on noise and remove adaptive gaming, the residual correlation between proxy and target should remain stable regardless of search intensity, unless the search moves into a region where the underlying causal model changes, which is a problem of model validity rather than optimization law. We agree that this disagreement is substantive and not merely semantic, and we agree that it hinges on whether optimization pressure adds a unique variance to the error term beyond what standard statistics predicts.

  To resolve this, we have identified three test cases that both sides agree would bear on the debate, though we differ on what they will show. The first test case is a fixed, non-adaptive optimizer with no adversary and nobody choosing to respond, using a proxy that is an unbiased estimate of the target. The question is whether the proxy-target gap grows as search effort grows. The optimization camp predicts that the gap will grow because the optimizer will find rare fluctuations where the noise aligns to maximize the proxy without maximizing the target, effectively overfitting the noise even if the noise is unbiased on average. The measurement camp predicts that the gap will not grow beyond the bounds expected from extreme value theory on the noise distribution, and that if the proxy is truly unbiased, the expected value of the target given the proxy should hold regardless of search intensity. The optimization camp would count it as a surprise if the gap remained within standard confidence intervals despite massive search effort. The measurement camp would count it as a surprise if the gap grew systematically larger than the statistical bounds of the noise allowed.

  The second test case is an institution ranked on an indicator it has no way to influence, computed by an outsider from data it never touches. The question is whether Goodhart still bites, and if so, where did the optimization go. The optimization camp predicts that Goodhart will not bite in this case because there is no optimization pressure applied to the system itself; the ranking is just an observation. If divergence occurs, they would attribute it to the ranking being used by a third party to select institutions, which reintroduces selection pressure. The measurement camp predicts that if the ranking is used for selection by outsiders, regression to the mean will still cause the selected institutions to perform worse than expected on the true goal, even if the institution itself did not game the metric. They argue the optimization is in the selection process, not the institution. Both sides agree that if the ranking is never used for any decision whatsoever, no divergence should occur, but they disagree on whether the mere act of publishing the ranking constitutes enough pressure to trigger the law if outsiders act on it.

  The third test case is a scenario where the proxy gets re-derived from the target every time the target is measured, so the proxy is never stale. The optimization camp says this just relocates the failure, because the optimizer will find ways to maximize the new proxy faster than the model can be updated, or will find features that are predictive only until optimized. The measurement camp says this is the fix, because it corrects for the model misspecification and noise that cause the divergence in the first place. The optimization camp predicts that even with dynamic updating, a strong enough optimizer will outrun the update cycle and find loopholes in the new proxy. The measurement camp predicts that if the update is frequent enough and the model class is rich enough, the divergence will vanish or remain within negligible bounds. Both sides agree that this test case is decisive because it isolates the variable of proxy staleness versus optimization power.

  We agree that these three cases, and not some other three, are the ones that would actually decide something, provided they can be implemented cleanly. There is nothing at all that both would agree would move the debate other than empirical results from these kinds of controlled settings, specifically where human gaming is removed and statistical noise is quantified. If the optimization camp sees data where search intensity correlates with proxy divergence after controlling for noise, they will feel vindicated. If the measurement camp sees data where the divergence stays within statistical bounds regardless of search intensity, they will feel vindicated. We also agree that if it turns out the phrase sufficiently strong optimizer only refers to systems we cannot build or observe, the optimization camp's claim becomes metaphysical rather than practical, and if it turns out that all observed cases are explainable by noise or gaming, the measurement camp's claim that there is nothing special about optimizers stands. We sign this document acknowledging that we have not resolved the fight, but we have isolated the battlefield, and we commit to treating the outcomes of these test cases as binding on our respective views.
