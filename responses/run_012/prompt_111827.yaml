  4.  **Ranking Decisiveness:**
      *   *Most Decisive (Force Abandonment):* Logical inconsistency within the theorem's own assumptions (e.g., if common knowledge + common priors + rationality *can* lead to disagreement due to structural issues not covered by priors). Or, if the definition of "prior" becomes so broad it loses meaning (unfalsifiability).
      *   *Moderately Decisive (Awkward/Costly):* If it only applies to ideal agents, it loses normative force for real humans. If "interpretation of evidence" is distinct from priors, the theorem might not cover it.
