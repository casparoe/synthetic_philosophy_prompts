answer: |-
  # The Friction & Safety Audit (15-Minute Procedure)

  You are stuck because you are trying to sum two different currencies: **Certain Friction** (everyone definitely loses 3 seconds) and **Probabilistic Safety** (someone *might* be saved from harm). Standard utilitarianism says "convert everything to seconds-of-pain and sum." You correctly suspect this fails when the "pain" is exclusion or rights violation.

  This procedure treats **Universal Friction** as a non-renewable budget and **Accessibility** as a floor that cannot be breached for utility gains. It forces you to distinguish between *certain costs* and *statistical benefits*.

  **Participants:** You + 1 Co-admin.
  **Time:** 15 Minutes max.
  **Tools:** A timer, a notepad.

  ---

  ### Step 1: Quantify the Tax (The Certain Cost)
  *Ask:* Who pays this cost, how often, and is it guaranteed?
  *   **Universal:** Every user, every session.
  *   **Targeted:** Only new users, only posters, only specific groups.
  *   **Frequency:** One-time, per-action, or continuous background load.
  *   **Measurement:** Estimate seconds/effort per user per day.

  **Stop Condition:** If the cost is **Universal + Per-Action** (e.g., every post, every page load), proceed to Step 4 immediately. This is the highest tax bracket.

  ### Step 2: Quantify the Insurance (The Statistical Benefit)
  *Ask:* What specific harm is prevented, how often does it occur, and how effective is this rule?
  *   **Severity:** Nuisance vs. Harassment vs. Doxxing/Physical Safety.
  *   **Frequency:** Daily, Monthly, Rare.
  *   **Effectiveness:** Does this *stop* the harm or just *delay* it? (Be honest: determined bad actors bypass delays).

  **The Asymmetry Rule:** If the Cost is **Certain** (Step 1) and the Benefit is **Statistical** (might prevent harm), you must apply a **10x Discount** to the benefit's value. You cannot trade guaranteed annoyance for vague safety unless the safety is high-confidence.

  ### Step 3: The Floor Test (Hard Veto)
  *Ask:* Does this change remove core functionality or accessibility for any specific subgroup?
  *   **Check:** Does this break screen readers? Keyboard navigation? Slow connections? Specific browsers?
  *   **Check:** Does this make the site unusable for a defined minority (even if small)?

  **Verdict:** If **YES**, the proposal is a **HARD NO**.
  *Reasoning:* Accessibility and core access are rights, not utilities. You cannot sum 200k people's mild convenience against 200 people's ability to participate. This is where the math stops.

  ### Step 4: The Friction Budget (Accumulation Check)
  *Ask:* How much universal friction have we added in the last 6 months?
  *   **Limit:** You have a "Friction Budget." If you have added *any* universal delays, captchas, or confirmations recently, this budget is **depleted**.
  *   **Rule:** You cannot add universal friction more than once per quarter. Friction compounds; users don't notice 1 second, they notice the 10th second added to the existing 9.

  **Verdict:** If the budget is depleted, the proposal is a **NO**, regardless of benefit. You must find a targeted solution instead.

  ### Step 5: The Values Handoff
  *Ask:* Are we arguing about numbers or about what kind of community this is?
  *   If Step 1-4 are clear, execute the verdict.
  *   If you are stuck on whether a harm is "Severe enough" to justify a cost, this is a **Values Call**.
  *   **Procedure:** Default to **NO**. It is easier to add safety later than to remove friction once users are trained to expect it.

  ---

  ## Case Applications

  ### Case (a): 2-second delay before every post (Anti-Brigading)
  1.  **Tax:** Universal, Per-Action. (Highest Tax Bracket).
  2.  **Insurance:** Prevents brigading (Severe), but effectiveness is low (bots/scripts ignore delays; humans get annoyed). Benefit is Statistical.
  3.  **Floor:** Passes (doesn't break access).
  4.  **Budget:** Assuming you have *any* other safeguards, this blows the budget. Universal per-action friction is expensive.
  5.  **Verdict:** **NO.**
      *   *Why:* You are taxing 200k people certainly to stop a statistical harm with a low-confidence tool. Brigading is better solved with rate-limiting (targeted) than universal delays.
      *   *The Bite:* This leaves you feeling vulnerable to harassment. You want to stop the harm, but this tool is too blunt.

  ### Case (b): Interstitial screen for new posters (Rule Confirmation)
  1.  **Tax:** Targeted (New users only), One-time. (Low Tax Bracket).
  2.  **Insurance:** Reduces clueless rule-breaks (Moderate harm). High effectiveness (forces pause).
  3.  **Floor:** Passes.
  4.  **Budget:** Passes (Targeted friction doesn't drain the universal budget).
  5.  **Verdict:** **YES.**
      *   *Why:* The cost is limited to those who haven't proven familiarity. The benefit is high-confidence education.

  ### Case (c): Remove accessibility feature for 200 users (Bug Fix)
  1.  **Tax:** 200 users lose function (Severe cost for them). 199,800 gain speed (Mild benefit).
  2.  **Insurance:** Removes mild annoyance for majority.
  3.  **Floor:** **FAILS.**
      *   *Reasoning:* An accessibility feature is core functionality. Removing it excludes those 200 users.
  4.  **Verdict:** **HARD NO.**
      *   *Why:* This is the values floor. You cannot trade the participation of a disabled minority for the marginal convenience of the majority.
      *   *The Bite:* You will hate this. The utilitarian math screams "fix the bug for 200k people." The procedure says the 200 people have a veto. Keep the bug, find another way to fix it that doesn't remove the feature.

  ---

  ### Summary of the Logic
  You felt stuck because you were trying to add "certain annoyance" and "statistical safety" on the same number line. They aren't the same currency.
  1.  **Certain Costs** require **Certain Benefits** (or very high confidence).
  2.  **Universal Friction** has a **Budget** (don't death-by-a-thousand-cuts).
  3.  **Accessibility** is a **Floor** (not negotiable via utility sum).

  \summary{Universal friction requires a budget, accessibility is a non-negotiable floor, and certain costs cannot be traded for statistical benefits without a heavy discount.}
