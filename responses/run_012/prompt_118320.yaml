answer: |-
  This is a sharp dissection of a proverb that does too much work for its size. You are correct that "When in Rome" is being asked to carry two contradictory loads: one of *adaptation* (don't offend the hosts) and one of *obligation* (don't opt out of the system).

  Here is the disambiguation menu you requested, moving from the trivially true to the philosophically loaded, followed by the structural analysis of coordination, the jaywalking edge-case, and the pragmatics of the phrase itself.

  ### The Menu of Interpretations

  #### 1. Prudential Conformity (The "Don't Make Waves" View)
  *   **Claim:** If you deviate from local norms, you will incur social costs (side-eye, awkwardness, poor service). If you want a quiet life, comply.
  *   **Verdict:** **Trivial/True.** It is an empirical prediction, not a moral claim.
  *   **Assumptions:**
      *   *Whose Expectations:* The people immediately observing you (servers, dinner companions).
      *   *Quantification:* "Everyone" means "enough people to make your life annoying."
      *   *Affordability:* Irrelevant. If you can't afford the social cost, you pay the financial cost, or vice versa.
      *   *Norm Change:* Actively hostile to change. Individual deviation is punished, reinforcing the norm.
  *   **Application:**
      *   (a) Tourist who thinks tipping is demeaning: **Supports tipping.** (Just do it to avoid the scene).
      *   (b) Resident wanting to opt out: **Defeats opting out.** (You will be punished for trying).

  #### 2. Semantic Contextualism (The "Meaning of Acts" View)
  *   **Claim:** Actions do not have intrinsic meanings; they derive meaning from the local "grammar." Withholding 20% in the US *is* an insult, regardless of your intent. Withholding 15% in Lisbon *is* neutral. You cannot import your home meaning.
  *   **Verdict:** **Substantive and Defensible.** This is the strongest sociological reading.
  *   **Assumptions:**
      *   *Whose Expectations:* The collective interpretive community.
      *   *Quantification:* "Everyone" means the shared linguistic/social framework.
      *   *Affordability:* Irrelevant to meaning, but relevant to ability to participate in the "language."
      *   *Norm Change:* Difficult. To change the meaning, you must first communicate in the existing language. You have to tip *while explaining* you are protesting tipping, otherwise you are just speaking gibberish (or insult).
  *   **Application:**
      *   (a) Tourist: **Supports tipping.** (If you don't tip, you *are* stiffing the server, by definition).
      *   (b) Resident: **Complicates opting out.** (You must signal the new meaning clearly, or you are just being rude).

  #### 3. Fair Play / Reciprocity (The "Benefit" View)
  *   **Claim:** You are entering a system with pre-set rules (e.g., menu prices are artificially low because tips are assumed). To take the benefit (the meal) without the cost (the tip) is free-riding.
  *   **Verdict:** **Substantive and Defensible (Conditional).**
  *   **Assumptions:**
      *   *Whose Expectations:* The system designers (owners) and participants (workers).
      *   *Quantification:* "Everyone" means "all beneficiaries of the specific transaction."
      *   *Affordability:* Crucial. If you genuinely cannot afford the tip, fairness suggests you should not order the meal (or order less).
      *   *Norm Change:* Problematic. One person opting out doesn't change the system; it just shifts the burden to the server or the owner. Collective action is required to change the norm.
  *   **Application:**
      *   (a) Tourist: **Supports tipping.** (You ate the food, pay the local price).
      *   (b) Resident: **Defeats opting out.** (Unless you are organizing a boycott, individual non-tipping is just shifting costs to the worker).

  #### 4. Moral Relativism (The "Right is Local" View)
  *   **Claim:** Morality itself is location-dependent. Tipping is *morally right* in the US and *morally neutral* in Lisbon simply because the locals say so.
  *   **Verdict:** **False / Philosophically Contested.** Most ethical frameworks (utilitarianism, deontology) reject the idea that geography determines moral truth.
  *   **Assumptions:**
      *   *Whose Expectations:* The "Local Moral Authority" (undefined).
      *   *Quantification:* "Everyone" means the majority of the culture.
      *   *Affordability:* Irrelevant. If it's "right," you must do it.
      *   *Norm Change:* Impossible. If the local norm defines morality, a reformer is by definition immoral until they succeed.
  *   **Application:**
      *   (a) Tourist: **Supports tipping.** (It becomes a moral duty).
      *   (b) Resident: **Defeats opting out.** (Reform is morally wrong until it becomes the new norm).

  #### 5. Host Deference (The "Guest" View)
  *   **Claim:** This isn't about "Rome" (the country); it's about the "Romans" (your specific hosts). It is an obligation of gratitude to not make your hosts look bad or feel uncomfortable.
  *   **Verdict:** **Substantive and Defensible (in context).**
  *   **Assumptions:**
      *   *Whose Expectations:* The specific people you are sitting with.
      *   *Quantification:* "Everyone" means "this dinner party."
      *   *Affordability:* High. If the convention bankrupts you, you shouldn't accept the invitation.
      *   *Norm Change:* Irrelevant. This is about relationship maintenance, not social engineering.
  *   **Application:**
      *   (a) Tourist: **Supports tipping.** (Don't embarrass your cousin).
      *   (b) Resident: **Neutral.** (If you are the host, you set the norm. If you are a guest in a friend's home, you follow theirs).

  #### 6. The Manners/Morality Distinction (The "Etiquette" View)
  *   **Claim:** "When in Rome" governs *etiquette*, not *ethics*. It tells you which fork to use, not whether the system is just. If a local custom is immoral, the proverb loses its force.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Assumptions:**
      *   *Whose Expectations:* Society (for manners), Conscience (for morals).
      *   *Quantification:* "Everyone" distinguishes between social peers and moral agents.
      *   *Affordability:* Moral objections trump financial affordability.
      *   *Norm Change:* Encourages it. If the custom is harmful, you have a duty to break the "Rome" rule.
  *   **Application:**
      *   (a) Tourist: **Defeats tipping.** (If you believe tipping is inherently demeaning/exploitative, this reading says you are not bound by etiquette to do it).
      *   (b) Resident: **Supports opting out.** (This is the only reading that validates the reformer).

  ---

  ### The Coordination Problem vs. The Normative Equilibrium

  You asked if the force of the proverb depends on the practice being a **coordination problem** (like queuing) versus a **normative equilibrium** (like tipping). **Yes, it matters immensely.**

  *   **Queuing (Coordination Problem):**
      *   *Structure:* Everyone prefers *any* shared rule over *no* shared rule. If half queue and half push, chaos ensues.
      *   *Force of Proverb:* **High.** "When in Rome" here is functional. If the locals stand in a line, and you cut, you are breaking a mechanism that prevents conflict. Your deviation actively harms others' ability to navigate the space.
      *   *Moral Force:* Derived from the harm caused by non-coordination.

  *   **Tipping (Normative Equilibrium):**
      *   *Structure:* This is closer to a Prisoner's Dilemma or a Compliance Game. The system *could* function differently (service charges). The "harm" of not tipping is not immediate chaos, but a redistribution of cost (the server loses income, or the owner absorbs it).
      *   *Force of Proverb:* **Lower.** Because the system doesn't *functionally* require your specific contribution to avoid collapse (one non-tipper doesn't break the US tipping system), the obligation is weaker. It relies on guilt, not functional necessity.
      *   *Implication:* "When in Rome" has less moral bite here. It is asking you to sustain a specific distribution of wealth, not to prevent a collision.

  **Verdict:** If the practice is a coordination problem (queues, driving side of the road), "When in Rome" is a pragmatic necessity. If it is a normative equilibrium (tipping, dress codes), "When in Rome" is a request for subsidy or conformity.

  ---

  ### The Jaywalking Case

  *Scenario: Locals jaywalk; Law says don't. Visitor waits; Local crosses.*

  This inverts the proverb. Here, "The Romans" are breaking the *official* rule.

  1.  **Is the visitor who waits a sucker?**
      *   **Prudentially:** Yes. They incur a time cost for no safety benefit (if the cars are stopping for the flow of locals).
      *   **Morally:** No. They are obeying the codified law.
      *   **Coordination:** If the visitor stands still on the corner while everyone flows around them, they become an obstacle. If they wait on the sidewalk, they are fine.
      *   **Verdict:** Not a sucker, but potentially obstructive if they impede the local flow.

  2.  **Is the local who crosses a free rider?**
      *   **Yes.** They are banking on the fact that drivers expect *some* pedestrians to follow the light (or that drivers are cautious enough generally). If *everyone* jaywalked unpredictably, the system would crash (more accidents).
      *   **The "When in Rome" Flip:** In this case, "When in Rome" would suggest the visitor *should* jaywalk to match the flow. But "Obey the Law" says don't.
      *   **Resolution:** Usually, local custom trumps written law in low-stakes social contexts *unless* safety is compromised. If the locals jaywalk safely (reading traffic), the visitor is being overly rigid. If the locals jaywalk dangerously, the visitor is right to wait.
      *   **Relevance to Proverb:** This shows "When in Rome" is actually about **reading the room**, not following the "best" or "legal" rule. It prioritizes *flow* over *form*.

  ---

  ### The "Conversation Ender" Diagnosis

  You asked what people usually mean when they use the phrase to end a conversation, and whether it is doing work.

  **What they mean:**
  They almost always mean **Interpretation 1 (Prudence)** disguised as **Interpretation 3 (Fair Play).**
  They are saying: *"You are causing social friction (Prudence), and you owe it to the system to stop (Fair Play), and I don't want to debate the merits of the system."*

  **Is it doing work?**
  **No.** It is a **conversational period.**
  It functions as a **status move.** By invoking the proverb, the speaker positions themselves as the knowledgeable local/guide and the listener as the ignorant outsider. It shuts down the moral/philosophical debate (Interpretation 6) by collapsing it into a matter of simple conformity (Interpretation 1).

  **In your specific dinner party case:**
  *   **Cousin to You (Lisbon):** "Stop over-tipping, you're making us look weird." (Prudence/Host Deference).
  *   **Partner's Family to You (US Tipping Debate):** "Stop criticizing the system you live in, it's rude." (Prudence/Fair Play).

  **Final Disambiguation:**
  The proverb is not a moral argument. It is a **conflict-avoidance heuristic.**
  *   In **Lisbon**, it correctly identified that your action (over-tipping) was a coordination error (making the locals look bad).
  *   In the **US**, it was misused to shut down a moral critique of a system.

  If you want to use "When in Rome" properly: Use it for **queues, driving, and greetings.**
  If you want to debate **tipping, wages, or justice:** The proverb is the wrong tool, because those are not matters of "what the Romans do," but "what the Romans *should* do."
