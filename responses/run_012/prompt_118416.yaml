      *   **Picture 2 (The Causal View):** DNA is just a physical component in a causal chain. "Information" is just difference-making (interventionist causality). Mutations are just variations. No intrinsic "meaning" or "error," just different outcomes.

  3.  **Address Specific Question 1: Arbitrariness vs. Contingency:**
      *   *Argument for Picture 1:* Arbitrariness is the hallmark of symbols. If A causes B *necessarily* (chemistry), it's just physics. If A causes B *by convention* (code), it's information. The genetic code looks arbitrary (mostly).
      *   *Argument for Picture 2:* Historical contingency isn't enough for semantics. The path a river takes is contingent, but we don't say the river "codes" for the valley. Contingency just means "it could have been otherwise given different initial conditions," not "it represents."
      *   *Synthesis:* Arbitrariness is necessary but not sufficient for Picture 1. It distinguishes code from crystal growth, but doesn't automatically grant *meaning* without a user/interpreter.

  4.  **Address Specific Question 2: Stereochemical Affinity (Non-arbitrariness):**
      *   *Fact:* There is some evidence that codons and amino acids have chemical affinities (stereochemical hypothesis), though the code is largely frozen accident/evolved.
      *   *Impact on Picture 1:* If the mapping is chemical/necessary, Picture 1 weakens. It looks more like a lock-and-key mechanism (causal) than a dictionary lookup (semantic).
