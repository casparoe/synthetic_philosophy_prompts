      *   *Picture 1 Solution:* The norm comes from the *function* of the system (translation). The machinery is designed (by evolution) to read the code. A mutation breaks the function.
      *   *Picture 2 Solution:* There is no intrinsic norm. "Error" is shorthand for "deviation from the phenotype that was selected for." It's teleonomic, not teleologic.
      *   *The "Reader" Issue:* Picture 1 requires a decoder that interprets. Picture 2 says the ribosome is just a catalyst.
      *   *Resolution:* The norm comes from *natural selection*. The "purpose" is the survival/reproduction of the lineage. A mutation is an "error" relative to the *maintenance* of a specific adapted state, not relative to a conscious reader.
      *   *Principled Line:* The line is drawn at *selected function*. If a mechanism was selected to produce X, and it produces Y, that's a malfunction (error). If the mechanism wasn't selected for specificity, it's just causality.

