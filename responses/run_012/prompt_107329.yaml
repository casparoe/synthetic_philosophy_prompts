  # Exam Question

  **Population Axiology Qualifying Examination**
  **Time Allowed: 3 Hours**

  **Question 1**

  Candidates are provided with the Background Notes (Items 1–5) and the definition of the **Population-Proportional Critical Level View (PPCLV)** below.

  **The Principle:** Fix a positive constant $c$. For a population with $N$ members and individual well-being levels $u_1, ..., u_N$, define its value $V$ as the sum over $i$ of the quantity $(u_i - c(1 - \frac{1}{N}))$.

  Using only the provided materials and logical derivation, write an essay that evaluates the PPCLV. Your response must address the following three points:

  (a) Determine whether the PPCLV avoids the Repugnant Conclusion (Background Item 1). Justify your answer by analyzing the principle's behavior as population size grows.
  (b) Determine which, if either, of the objectionable conclusions in Background Items 3 (Very Repugnant) or 4 (Sadistic) the principle incurs. You must supply a concrete numerical example to support your determination.
  (c) Identify the deeper structural cost of letting the critical level depend on $N$, namely the failure of the Separability Condition (Background Item 5). Explain why this failure is not a merely technical blemish but a substantive philosophical problem.

  ***

  # Model Answer

  The Population-Proportional Critical Level View (PPCLV) defines the value of a population as $V = \sum_{i=1}^{N} (u_i - c(1 - \frac{1}{N}))$. Algebraically, this simplifies to $V = \sum u_i - Nc(1 - \frac{1}{N}) = \sum u_i - c(N - 1)$. This formulation reveals that the principle functions as a Critical Level View with a fixed critical level $c$, adjusted by a constant $+c$.

  Regarding (a), the PPCLV avoids the Repugnant Conclusion. The Repugnant Conclusion arises when a vast population with lives barely worth living outweighs a smaller, excellent population. Under totalism, value grows linearly with $N$. Under PPCLV, however, each life contributes $u_i - c$ to the marginal value (ignoring the constant). If the "barely worth living" well-being level $\epsilon$ is less than the critical level $c$, then each additional life contributes negatively ($\epsilon - c < 0$). As $N$ grows without bound, the term $-c(N-1)$ dominates the sum $\sum \epsilon$, driving the total value toward negative infinity. Thus, no matter how large the population of barely worth living lives becomes, it will never surpass a smaller population where $u_i > c$. The rising effective critical threshold per person ensures that quantity cannot compensate for quality below $c$.

  Regarding (b), the principle incurs the Very Repugnant Conclusion but avoids the Sadistic Conclusion. The Sadistic Conclusion requires that adding negative lives is better than adding the same number of positive lives. Since the penalty term $-c(N-1)$ depends only on the final population size $N$, adding $k$ lives incurs the same penalty regardless of their well-being. The comparison rests solely on $\sum u_i$. Since positive well-being adds more to the sum than negative well-being, adding positive lives is always preferred to adding negative lives of the same number. Thus, the Sadistic Conclusion is avoided.

  However, the Very Repugnant Conclusion is incurred. This conclusion states that adding lives in agony can be an improvement if enough excellent lives are added simultaneously. Consider a population with $V=100$. Let $c=10$. Add 10 lives in agony ($u=-50$) and 100 excellent lives ($u=100$). The change in value is $\Delta V = \sum u_{new} - c(\Delta N)$. Here, $\sum u_{new} = 10(-50) + 100(100) = 9500$. The population increases by 110, so the penalty increases by $10(110) = 1100$. The net change is $+8400$. The addition of agony is permitted because it is swamped by the excellence. This violates the intuition that agony should not be tradable for excellence in this manner.

  Regarding (c), the PPCLV fails the Separability Condition. Background Item 5 states that the value assigned to adding or removing a life should not depend on the rest of the population. In PPCLV, the individual contribution term is $u_i - c(1 - \frac{1}{N})$. This term explicitly depends on $N$. Consequently, the value contributed by an existing life changes merely because a new life is added elsewhere. While the *total* marginal change may appear stable, the *distribution* of value among constituents shifts with population size. This is not a technical blemish because it implies that the moral significance of a person's well-being is contingent on the existence of others. It violates the independence of individual value, suggesting that a life becomes morally "lighter" or "heavier" based on crowd size, which undermines the notion that value resides intrinsically in individuals.

  ***

  # Marking Scheme

  **Total Marks: 20**

  **Part (a): Repugnant Conclusion Analysis (6 Marks)**
  *   **2 marks:** Correctly simplifies the principle to $V = \sum u_i - c(N - 1)$.
      *   *Typical Error:* Failing to distribute the sum over $N$, leading to incorrect limiting behavior.
  *   **2 marks:** Identifies that if well-being $u < c$, the marginal contribution is negative.
      *   *Typical Error:* Asserting a rising critical level blocks the Repugnant Conclusion without checking if $u$ is below $c$.
  *   **2 marks:** Concludes the principle avoids the conclusion because total value drops as $N \to \infty$ for low $u$.
      *   *Typical Error:* Claiming it avoids the conclusion based solely on the presence of a critical level without algebraic justification.

  **Part (b): Very Repugnant vs. Sadistic Conclusion (8 Marks)**
  *   **3 marks:** Correctly determines the Sadistic Conclusion is avoided (positive sum > negative sum for same $N$).
      *   *Typical Error:* Reciting the stock claim that threshold views incur the Sadistic Conclusion without testing the "same number" condition.
  *   **3 marks:** Correctly determines the Very Repugnant Conclusion is incurred (agony swamped by excellence).
      *   *Typical Error:* Confusing the Very Repugnant Conclusion with the Repugnant Conclusion.
  *   **2 marks:** Provides a concrete numerical example showing $\Delta V > 0$ despite added agony.
      *   *Typical Error:* Providing vague qualitative descriptions without numerical verification of the trade-off.

  **Part (c): Separability and Structural Cost (6 Marks)**
  *   **2 marks:** Identifies that the individual contribution term depends on $N$.
      *   *Typical Error:* Claiming separability holds because the total marginal value is constant.
  *   **2 marks:** Explains that the value of existing lives changes when new lives are added.
      *   *Typical Error:* Focusing only on the added life rather than the impact on the existing population.
  *   **2 marks:** Argues this is substantive (contingent moral status) rather than technical.
      *   *Typical Error:* Dismissing the failure as a mere mathematical artifact without philosophical implication.
