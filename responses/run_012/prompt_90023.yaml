answer: |-
  This is a formidable lineup. You are walking into a minefield, but you have the distinct advantage of actual empirical expertise, which most of them lack. They know the literature; you know the machinery. Your strategy should be to treat their conceptual distinctions as hypotheses about the machinery that happen to be bad engineering.

  Here is your prep sheet.

  ### I. Terminology & Concessions (Do this before you start)

  **The Jargon Swap**
  You are at risk of sounding like a behaviorist from 1950 because of your lab vocabulary. Swap these terms immediately to avoid category errors:
  *   **Don't say:** "Measurement" or "Signal." **Say:** "Third-person report" or "Neural correlate."
  *   **Don't say:** "Reading the gauge." **Say:** "Phenomenal judgment" or "Introspective report."
  *   **Don't say:** "Uncalibrated." **Say:** "Opaque" or "Non-veridical." (Uncalibrated implies there *is* a correct calibration they can demand.)
  *   **Don't say:** "Experience character." **Say:** "Phenomenal character."

  **The Up-Front Concessions**
  Do not fight these. Concede them in your opening remarks to disarm the critics.
  1.  **To the Historian:** "I acknowledge that the 'four marks' definition is a composite. I am attacking a *family resemblance* of views, not a specific text. If you want to cite Lewis or Block to show nuance, I welcome it, but the *intuition* I'm targeting is alive and well."
  2.  **To the Eliminativist:** "I am not denying that things seem a certain way to subjects. I am denying that 'seeming' requires a non-physical property. I am a *qualia* eliminativist, not an *experience* eliminativist."
  3.  **To Everyone:** "I am not a verificationist. I believe in unobserved entities (electrons, retinal potentials). I just don't think 'qualia' are one of them."

  ---

  ### II. The Objections (Ranked by Damage & Likelihood)

  #### 1. The Phenomenal Concept Strategist (The PCS)
  **Likelihood:** High. **Damage:** Critical.
  **The Objection:** "Your gauge analogy begs the question. A gauge implies a distinction between the reading and the quantity measured. But for phenomenal experience, the appearance *is* the reality. If it seems green to me, there is no 'real green' behind it that I'm missing. The 'reading' just *is* the state. So when you say the gauge is uncalibrated, you're implying I can be wrong about how things seem to me. But I can't. So there is no gap, and your analogy collapses."

  **Your 2-Minute Reply:**
  "I'm not saying you can be wrong about the *reading*. I'm saying you're wrong about what the reading *implies*. When the gauge reads 'Green', you infer 'There is a property Green inherent to this experience.' I'm saying the reading is a neural event that carries information, but it doesn't carry a certificate of intrinsicness. The 'gap' isn't between seeming and being; it's between the *report* and the *metaphysical conclusion* you draw from it. You're conflating the infallibility of the report with the infallibility of the theory you build on top of it."

  **The Soft Spot:**
  She will press the "Infallibility" point. If the report is infallible, it looks suspiciously like the "direct apprehension" mark you're trying to kill. You need to hold the line that *judgments* about experience are fallible even if the *seeming* is not.

  #### 2. The Hard Problem Realist
  **Likelihood:** High. **Damage:** Moderate (You expect this).
  **The Objection:** "This is just verificationism dressed up in lab coats. You're saying if we can't measure it externally, it doesn't count. But Mary in the black-and-white room learns *something* when she sees red. Zombies are conceivable. If you deny the extra fact, you're denying the data of consciousness itself. You're explaining everything except the thing we actually care about."

  **Your 2-Minute Reply:**
  "I'm not denying Mary learns something. She learns a new *mode of access* to the same physical facts. She gains a phenomenal concept, not a new property of the world. As for zombies: conceivability isn't possibility. I can conceive of water not being H2O, but I'd be wrong. The 'extra fact' is a cognitive illusion generated by the architecture of our introspection. I'm not ignoring the data; I'm offering a better explanation of why the data *looks* like a hard problem."

  **The Soft Spot:**
  The intuitive force of "What it's like." If he corners you on whether a zombie would say "It hurts," and you say "Yes," he will ask, "Then why do *we* say it?" If you say "Because we feel it," he has you. Keep the focus on the *mechanism* of the report, not the feeling.

  #### 3. The Convener (Historian)
  **Likelihood:** Guaranteed (likely early). **Damage:** Low (if conceded).
  **The Objection:** "You're attacking Dennett's strawman of C.I. Lewis. No serious philosopher since 1930 holds that qualia are ineffable, intrinsic, private, *and* directly apprehended all at once. Most of us drop 'ineffable' immediately. You're fighting a ghost."

  **Your 2-Minute Reply:**
  "That's a fair scholarly point, and I concede the strict conjunction is rare. But the *spirit* of the view—that there is a non-functional, intrinsic property grounding these reports—is dominant. Even if they drop 'ineffable,' they keep 'intrinsic.' My argument targets the 'intrinsic' claim. If the historical record has refined the definition to save the phenomenon, I'm happy to debate the refined version, but the intuition remains the same."

  **The Soft Spot:**
  If they pull a specific text (e.g., contemporary phenomenal realism) that explicitly defines qualia functionally, you might look like you haven't done the reading. Stick to the *intuition* driving the text, not the text itself.

  #### 4. The Empirical Grad Student
  **Likelihood:** High. **Damage:** Moderate.
  **The Objection:** "Okay, but what does this predict? If qualia are just judgments, then messing with metacognition should change the qualia without changing the sensory processing. Do you have a case where the sensory signal is identical, the report is identical, but the 'qualia' supposedly differ? Or vice versa? If your view is empirically indistinguishable from realism, it's just semantics."

  **Your 2-Minute Reply:**
  "It predicts that 'phenomenal' differences will always map onto functional or neural differences, even if we haven't found them yet. Take your adaptation work: if you can dissociate the adaptation effect from the report via priming or reaction time, that supports me. It suggests the 'feeling' is a post-hoc construction. Realism predicts a brute correlation that stops at the feeling. I predict we'll find the machinery behind the feeling. If we find a 'qualia module' that does nothing but glow, I'm wrong. But I bet we won't."

  **The Soft Spot:**
  Negative predictions are hard to defend. If they say "We haven't found it yet," you can't prove them wrong. You need to emphasize that *their* view predicts we *won't* find the machinery, while yours predicts we *will*.

  #### 5. The Wittgensteinian
  **Likelihood:** Medium. **Damage:** Annoyance.
  **The Objection:** "You're both reifying 'experience' as a thing. There is no 'inner object' that is private or public. There is only the use of the word 'pain' or 'red' in a language game. By arguing qualia don't exist, you're granting that they *could* exist but don't. You're still trapped in the picture you claim to reject."

  **Your 2-Minute Reply:**
  "I agree that 'qualia' is a misleading noun. But people *do* have the intuition that there is an inner object. My goal is to explain why that grammar seduces us. It's not just a grammatical error; it's a cognitive one. Our introspective machinery presents states to us *as if* they were objects. I'm trying to explain the bug in the UI, not just tell you to stop using the screen."

  **The Soft Spot:**
  If they are a hard-line Wittgensteinian, they will think your "cognitive bug" explanation is just more bad theory. You can't win this one; just neutralize it by agreeing on the goal (dissolving the confusion) while keeping your mechanistic explanation.

  #### 6. The Hardcore Eliminativist
  **Likelihood:** Low. **Damage:** Low (Friendly Fire).
  **The Objection:** "You're still talking about 'phenomenal character' and 'what-it's-like.' That's the poison. You should just talk about discriminative behavior and verbal reports. Why keep the 'what-it's-like' locution at all?"

  **Your 2-Minute Reply:**
  "Strategic retreat. If I tell people 'there is no what-it's-like,' they stop listening. I want to keep the phenomenon (the report, the discrimination) and change the ontology. I'm trying to bridge the gap for the realists in the room. If I go full Churchland, I lose the audience. I want to save the data while killing the theory."

  **The Soft Spot:**
  Consistency. If you grant "what-it's-like" exists, they will ask what it *is*. If you say "nothing," you're back to square one. Just admit it's a *façon de parler* for now.

  ---

  ### III. The Killer Question (The One With Teeth)

  **Who asks it:** Likely the **Phenomenal Concept Strategist** or the **Hard Problem Realist**.
  **The Question:**
  "You say introspection is an uncalibrated gauge. A gauge is a device that tracks a variable. If there is no 'qualia variable' out there, **what is the gauge measuring?** If it's measuring brain states, why call it 'uncalibrated'? If it's measuring nothing, why is the reading so consistent? If the reading *is* the brain state, then the 'feeling' is identical to the physical state. But if the feeling is identical to the physical state, haven't you just granted Physicalism, not Eliminativism? And if you've granted Physicalism, why deny the qualia? Why not just say qualia *are* those physical states?"

  **Why this hurts:**
  This exposes the ambiguity in your position.
  *   If you say "It measures nothing," you look like you're denying the reality of the experience (Hard Eliminativist charge).
  *   If you say "It measures brain states," you look like an Identity Theorist (Realist charge).
  *   If you are an Identity Theorist, the Realist will say, "Fine, then qualia exist, they're just neural. Why are we fighting?"

  **How to Parry:**
  "You've caught me on a shorthand. I am a Physicalist. I believe the state *exists*. I deny that the state has the *properties* the Realist claims (intrinsic, ineffable, etc.). The gauge isn't measuring 'qualia'; it's generating a report about a neural state. The error isn't that the state doesn't exist; the error is the *label* we stick on it. The 'Killer' here is the word 'Qualia.' I'm saying that word comes with a warranty the product doesn't fulfill. I'm not denying the product."

  ---

  ### IV. Final Strategic Advice

  1.  **Don't get bogged down in "Conceivability."** You will lose the intuition pump war. Keep dragging it back to "Mechanism." Ask them: "What neural mechanism would instantiate an ineffable property?"
  2.  **Use your Vision Science.** When they talk about "Red," talk about "L-cone stimulation vs. V4 processing." When they talk about "Intrinsic," talk about "Context dependence." Your home turf is the best defense.
  3.  **The "Strawman" Trap:** If the Convener pushes the history point too hard, say: "I am not doing history. I am doing engineering. I am telling you that the component labeled 'Qualia' in your schematic does not function as drawn."
  4.  **Watch the Clock:** You have 40 minutes for Q&A. That is 6 to 8 exchanges. Do not let one person monopolize. "That's a crucial point, I'd love to hear what [Other Person] thinks about that."

  **One last thing:** If you feel cornered, use the **Chromatic Adaptation** case again. It is your strongest empirical wedge. "If the qualia changed, show me the signal. If you can't, and you say the signal doesn't matter, you've left science behind."

  Good luck. You know the retina better than they do. Make them pay for that ignorance.
