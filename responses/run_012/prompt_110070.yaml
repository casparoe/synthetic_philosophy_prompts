      *(Refining the Wild Animal Welfare point)*: This is the most philosophically heavy lifting. If wild lives are net negative (predation, starvation, disease), then *reducing* wild animal populations via agriculture could be a good thing. But crops reduce habitat *more* efficiently (land sparing) than pasture. So if wild lives are bad, crops are *better* (they destroy more habitat per calorie). If wild lives are good, pasture is *better* (it preserves habitat structure). The flatmate argues pasture is better. This implies he thinks wild lives are *good* (or at least worth preserving) AND that pasture preserves them better than crops. But he also says crops kill *more* animals. This implies he counts the harvesting deaths (mice) as worse than the grazing displacement. This is a tension. I need to highlight this tension.

