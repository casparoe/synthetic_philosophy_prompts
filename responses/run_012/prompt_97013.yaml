  2. View A holds that since aesthetic value supervenes entirely on the properties of the object and the experience it affords, the two works must be judged equal in value. Because no instrument or observer can distinguish the visual qualities of the reconstruction from the original, the aesthetic experience is identical, rendering the history of production irrelevant to the worth of the work.

  3. View B maintains that the work's identity and value are constituted by its specific history of production, meaning the original possesses a status the reconstruction fundamentally lacks. Even though the copyist exercised greater technical skill, the original remains the sole artifact of the initiating artistic act, granting it a higher value that the derivative reconstruction cannot attain.

  4. The decisive feature is the object's genealogy, specifically its status as the primary artifact of the creative act rather than a secondary derivation. If this historical distinction is deemed irrelevant, View B loses its footing and both verdicts converge on equality, isolating history as the sole variable driving the difference in valuation.

  5. A sceptic would argue that View B mistakes market scarcity for aesthetic merit, reducing the theory to a defence of investment value rather than an account of beauty. They would contend that valuing the relic over the experience is pure snobbery, rendering the thought experiment a demonstration of social conditioning rather than philosophical truth.
