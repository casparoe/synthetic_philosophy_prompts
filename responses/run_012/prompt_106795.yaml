  *Key Popperian point:* A theory is a net cast to catch reality. The mesh size matters. If the mesh is too wide (tautology), it catches nothing. If we tighten the mesh (specific claims about variation and inheritance), it becomes testable. The user says I just changed the net. I say I finally described the net correctly.

  *Falsification example:* Popper himself suggested that finding fossils in the wrong strata could falsify evolution, but for natural selection specifically, it's about the *process*. If we observed that mutations occurred *because* they were needed (Lamarckism), that would falsify the Darwinian mechanism of random variation + selection.

