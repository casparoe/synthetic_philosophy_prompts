      *   **Move 6 (Callum):** Fragmented Self/External Values. Maybe he doesn't really endorse the value. Or the self isn't unified.
          *   *Assessment:* Deepens the metaphysical challenge. If the self is a sequence of temporal slices, "weakness" makes no sense.
          *   *Rating:* Philosophically sophisticated, but potentially eliminates agency altogether.
      *   **Move 7 (Ruth):** Pre-commitment (Ulysses Contract). He tried to bind himself and failed/succeeded temporarily.
          *   *Assessment:* Strongest practical evidence. Pre-commitment only makes sense if you anticipate a future conflict of will *within the same agent*.
