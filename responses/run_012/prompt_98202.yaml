answer: |-
  # Q&A Preparation Sheet: Distributed Selves and Tracking Profiles

  **Talk Context:** Philosophy of Mind Reading Group
  **Time Allocation:** 15 Minutes (Approx. 3–5 substantive questions)
  **Thesis:** The self is a tracking profile; presence is a matter of degree; selves can be distributed across brains.

  ## Strategic Overview
  Your position is metaphysically revisionist but ethically conservative. You are arguing for a *graded* ontology of selfhood to preserve our *graded* practices of grief, legacy, and responsibility. Do not get bogged down in defending the metaphysics of patterns over tokens unless forced; always pivot back to the explanatory power of your view regarding grief and survival.

  ---

  ## Likely Objections and Drafted Replies

  ### 1. The Token/Type Confusion (Hard-Nosed Functionalists)
  **Likelihood:** Very High | **Damage:** High
  **The Objection:** "You have defined a *type* of processing profile, but identity is a relation between *tokens*. If my brain tracks your dispositions, I am running a simulation of you, not hosting you. Two systems instantiating the same pattern are two tokens, not one distributed token. You haven't explained how numerical identity survives the split; you've just described high-fidelity copying."

  **Your Reply (2 mins):**
  "I appreciate the precision, but I believe the distinction between token and type relies on a substrate assumption I am rejecting. We typically individuate tokens by spatial-temporal continuity of matter. My claim is that for *selves*, the relevant individuating principle is not the hardware, but the software's causal efficacy in the world. If the 'tracking profile' is what does the work of navigating the world, making decisions, and holding values, then splitting that profile splits the agent. Consider a corporation: it is a legal person distributed across many brains and servers. We do not say the corporation is 'copied' in each branch; it is one entity realized multiply. I am proposing we treat biological selves similarly. The 'numerical identity' you seek is a vestige of thinking the self is a thing rather than a process. If the process is genuinely coupled and tracking, the identity is distributed, not copied."

  **Candid Note on Soft Spot:**
  The corporation analogy is weak because corporations are legal fictions, whereas selves are phenomenological realities. If they press on "causal coupling" between the brains (i.e., are the brains talking to each other?), you may have to concede that without ongoing communication, the distribution degrades.

  ### 2. The Phenomenology of Mineness (Phenomenologist)
  **Likelihood:** High | **Damage:** High
  **The Objection:** "You speak of dispositions and tracking, but you ignore the first-personal givenness of experience. When I feel pain, it is *mine*. There is a 'mineness' to my experience that is not a matter of degree. I have never experienced being distributed. If your theory contradicts the immediate data of consciousness, it is a theory of behavior, not a theory of self."

  **Your Reply (2 mins):**
  "This is the strongest challenge, and I grant that the *feeling* of unity is robust. However, phenomenology is not infallible metaphysics. We once felt the sun moved around the earth. My claim is that the 'mineness' you describe is a local interface generated by the brain to manage its own boundaries efficiently. It is a user illusion, albeit a necessary one. Just because the interface presents a singular 'I' does not mean the backend architecture is singular. When you grieve a lost friend, you feel their absence as a loss within *you*. That is the phenomenology of distribution already at work. You are feeling the gap where their tracking profile used to run on your hardware. My account validates that grief as the loss of a part of your own cognitive architecture, rather than just the loss of an external object."

  **Candid Note on Soft Spot:**
  You are essentially calling the feeling of selfhood an illusion. This alienates the phenomenologist. Be prepared to soften this to "the feeling of singularity is a pragmatic simplification" rather than a full-blown illusion.

  ### 3. Prudential Concern and Anticipation (Ethics/Metaphysics)
  **Likelihood:** High | **Damage:** Critical
  **The Objection:** "If I am distributed across three brains, can I anticipate the experiences of the others? If one of those brains is tortured, do I suffer? If not, then your 'distributed self' carries no prudential weight. If yes, you are claiming telepathy. You cannot have it both ways: either the self is where the experience is, or it isn't."

  **Your Reply (2 mins):**
  "I deny that anticipation requires numerical identity in the strict sense. We care about our future selves not because they are metaphysically identical to us, but because they carry our projects and values. This is Parfit's reductionist view, extended spatially. If my pattern is tracked in another brain, I have reason to care about that brain's welfare proportional to the fidelity of the tracking. It is not telepathy; it is empathy grounded in identity. If a version of me is tortured, *I* am harmed, but the harm is diluted by the degree of presence. This explains why we fear death (total cessation of tracking) more than we fear a friend's suffering (partial cessation), even though both involve the pattern. It preserves the gradient of moral concern we actually live by."

  **Candid Note on Soft Spot:**
  This is your most vulnerable point. If they ask, "Would you volunteer to be tortured to save your distributed copy?" you must answer carefully. Admitting "No" undermines the identity claim; admitting "Yes" makes you look irrational.

  ### 4. The Bearer Problem (Buddhist No-Self Scholars)
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "You are reifying a process. A profile is a description of activity, not an agent. To say a profile 'tracks' is to imply a homunculus doing the tracking. In *anatta*, there is no bearer of the karma. Your 'distributed self' is just clinging to a new concept of existence. Who owns the tracking?"

  **Your Reply (2 mins):**
  "I agree that there is no static owner, no 'ghost in the machine.' My view is compatible with *anatta* in that the self is empty of inherent existence. However, conventional truth matters. In the conventional realm, patterns have causal power. A whirlpool is not a 'thing' separate from the water, but it can capsize a boat. Similarly, the self-pattern, though empty, is the locus of karmic consequence. By distributing the pattern, we distribute the karmic load. I am not positing a bearer; I am positing a causal stream that can branch. The 'ownership' is merely the designation of where the consequences land. If my actions cause pain in your brain because my pattern is running there, the karma is shared."

  **Candid Note on Soft Spot:**
  Buddhist scholars may find "distributed karma" incoherent. Be prepared to concede that "karma" might be the wrong vocabulary and stick to "causal consequence."

  ### 5. The Embodiment Constraint (Enactivist/Graduate Student)
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "Cognition is not just brain-bound; it is embodied and embedded. A self is constituted by its specific sensorimotor history. You cannot track my dispositions without my specific body. A brain simulating me is not me, because it lacks my specific coupling with the world."

  **Your Reply (2 mins):**
  "I accept that embodiment is crucial, which is why I speak of dispositions to *act*, not just think. However, the body is also a variable in the pattern. If another brain successfully predicts how I would act in *their* body, they are tracking the invariant core of the self. Think of an amputee who still feels a limb; the self-model persists despite bodily change. If a friend knows how I would react to a tragedy better than I do myself, they are hosting my self-model. The 'body' in the pattern is a schematic, not a specific collection of cells. Distribution is possible because the pattern abstracts over specific physical instantiations, provided the functional coupling to the environment remains isomorphic."

  **Candid Note on Soft Spot:**
  Enactivists hate "isomorphism." They argue the coupling *constitutes* the mind. You may need to concede that distribution is always partial and degraded because bodies differ.

  ### 6. The Vagueness Objection (Functionalists/Ethics)
  **Likelihood:** Medium | **Damage:** Low
  **The Objection:** "Your account relies on degrees of presence. Where is the cutoff? If I track 51% of your dispositions, are you 'in' my head? This vagueness makes moral accountability impossible. We need binary conditions for blame and survival."

  **Your Reply (2 mins):**
  "Vagueness is a feature of the world, not a bug in my theory. Sorites paradoxes apply to 'heap,' 'bald,' and 'person.' We manage legal and moral responsibility with vague predicates all the time. We do not need a sharp cutoff to know that a spouse knows a partner better than a stranger, and thus bears a different weight of responsibility for their care. My account reflects this reality. It explains why we feel more responsibility for our children (high pattern overlap) than for strangers (low overlap). Demanding binary identity conditions forces us to ignore the nuanced ways we actually treat each other. I am offering a metaphysics that matches our moral practices, not one that forces them into binary boxes."

  **Candid Note on Soft Spot:**
  Legal systems *do* require binary conditions (guilty/not guilty). Concede that for legal purposes, we must draw arbitrary lines, but insist that metaphysically, the gradient is real.

  ---

  ## Concessions vs. Firm Stance

  **What to Concede Up Front:**
  1.  **Numerical Identity:** Concede that you are redefining "identity." You are not offering strict numerical identity in the physicalist sense. You are offering "psychological continuity with degree."
  2.  **Phenomenological Unity:** Concede that the *experience* is of singularity. Do not argue that people *feel* distributed. Argue that the feeling is a local heuristic.
  3.  **Degradation:** Concede that the self degrades as it moves further from the source brain. It is never a perfect copy.

  **What to Hold Firm On:**
  1.  **Moral Weight:** Hold firm that moral responsibility and prudential concern are *graded*. This is your strongest selling point. It explains why grief is rational (you lost a part of your cognitive system) and why legacy matters.
  2.  **Pattern over Substrate:** Hold firm that the physical token is not the self. If you lose this, the theory collapses into standard functionalism.
  3.  **Survival:** Hold firm that this constitutes a form of survival. It is not merely "being remembered"; it is "continuing to operate."

  ---

  ## The "Hope Nobody Asks" Objection

  **The Objection:** "If selves are distributed, does murder matter less? If I kill you, but your pattern survives in three friends, have I really destroyed you? Does this view inadvertently lower the stakes of death?"

  **Why it is dangerous:** It attacks the moral urgency of your theory. If survival is easy and distributed, the tragedy of death is diminished.

  **Prepared Defense (Mental Note Only):**
  "Death is still the cessation of the *source* node and the degradation of the network. The distribution is dependent on the living community. Destroying the source is destroying the root of the tree; the branches may linger, but the growth is stopped. Furthermore, the harm done to the distributed nodes (the grief and cognitive disruption in the survivors) remains a massive moral harm."
