answer: |-
  # The Pramāṇa Inquest: A Session Plan

  **Time:** 90 minutes
  **Participants:** 14 students + 1 facilitator (you)
  **Room:** One space with movable chairs.
  **Goal:** To force participants to experience the friction of classifying knowledge-claims and defending the irreducibility of specific *pramāṇas* against a sceptical reductionist.

  ## 1. Room Setup & Roles (5 minutes)

  Arrange the room in a 'U' shape.
  *   **The Tribunal (Panel):** 2 students sit at the open end of the 'U'. They are the **Reductionists**. Their job is to collapse all knowledge into Perception (*Pratyakṣa*) or Inference (*Anumāna*).
  *   **The Investigation Teams:** 3 teams of 3 students (9 total) sit along the sides of the 'U'.
  *   **The Gallery:** The remaining 2 students sit behind the Tribunal. They are the **Scribes**. They track points and note down the specific "reduction moves" used by the Tribunal.
  *   **You:** Stand at the front. You are the **Chief Justice**. You enforce time and rules, but do not intervene in arguments unless a rule is broken.

  ## 2. The Rules of Engagement (5 minutes)

  Explain the following to the room:

  1.  **The Claim:** Each Team receives a sealed scenario card. They must formulate a knowledge claim in canonical form: *"Subject S knows Proposition P via Means M."*
  2.  **The Defence:** The Team must argue that *M* is a distinct, irreducible means of knowledge.
  3.  **The Attack:** The Tribunal's job is to prove that *M* is actually just Perception or Inference in disguise.
  4.  **Scoring:**
      *   **Survival Point:** Awarded if the Team successfully defends the distinctness of *M* against the Tribunal's first two attacks.
      *   **Concession Point:** If the Team concedes the route is reducible, they get 1 point only if they can explain *which* route it reduces to convincingly.
      *   **Collapse Penalty:** If the Team cannot articulate the structure of their claim or simply says "It's obvious," they get 0 points.
      *   **Tribunal Point:** The Tribunal gets a point for every successful reduction (where the Team concedes or runs out of arguments).
  5.  **Time:** 20 minutes preparation. 15 minutes per Team (45 mins total). 15 minutes debrief.

  ## 3. The Scenario Cards (Preparation)

  Print these on card stock. Seal them in envelopes. You must deal them specifically to ensure the hard cases are covered.

  **Card A (Team 1): The Forest Ranger (Upamāna / Comparison)**
  > **Scenario:** You have never seen a *gavaya* (wild ox). A forester tells you: "A *gavaya* is like a cow." You know what a cow is. Weeks later, you are in the forest. You see an animal. You immediately think: "This is a *gavaya*."
  > **Task:** Formulate the claim. How did you know the name applied to the animal?
  > **Hint for Team:** It wasn't just seeing the animal (Perception), because you needed the name. It wasn't a syllogism (Inference), because you didn't reason "It is like a cow, therefore it is a *gavaya*." It was a recognition of similarity linking word to object.
  > **Trap:** The Tribunal will argue this is just Inference based on similarity.

  **Card B (Team 2): The Empty Desk (Abhāva / Absence)**
  > **Scenario:** You walk into your office. You look at your desk. You know: "My keys are not on the desk."
  > **Task:** Formulate the claim. What is the *pramāṇa* here?
  > **Hint for Team:** You did not see the keys (obviously). You saw the desk. But the *knowledge* is about the *absence* of the keys. Is 'absence' a real object of perception?
  > **Trap:** The Tribunal will argue this is just Perception of the desk + Inference that "If keys were here, I would see them."

  **Card C (Team 3): The Wet Pavement (Anumāna / Complex Inference)**
  > **Scenario:** You wake up. You look out the window. The pavement is wet. The sky is clear blue. The sprinklers are off. You conclude: "It rained last night."
  > **Task:** Formulate the claim. Defend this as Inference.
  > **Hint for Team:** This is your 'control' case, but make it robust. Ensure you can state the *hetu* (reason) and *sādhya* (probandum).
  > **Trap:** The Tribunal might try to claim this is Testimony (reading the 'signs' of nature) or Perception (seeing the wetness is seeing the rain's effect). *Note: This team should likely win easily, but use them to set the baseline for what 'real' inference looks like.*

  **Card D (Decoy 1): The Red Apple (Pratyakṣa / Perception)**
  > **Scenario:** You are in good light, eyes open. You look at a table. You see a red apple.
  > **Use:** Keep this in reserve. If Team 3 finishes early, throw this at the Tribunal. "Reduce this." (They shouldn't be able to).

  **Card E (Decoy 2): The Doctor's Order (Śabda / Testimony)**
  > **Scenario:** A trusted specialist tells you: "You have a vitamin deficiency." You have no symptoms. You believe it.
  > **Use:** Reserve. If time permits, ask the Gallery to classify this. Is it Inference (the doctor inferred it) or distinct Testimony?

  ## 4. The Tribunal Briefing (Handout for the 2 Panel Members)

  *Give this to the Tribunal members during the 20-minute prep time while the Teams are working.*

  **Your Goal:** You are a Buddhist Nominalist (like Dignāga). You believe there are only **two** means of knowledge:
  1.  **Perception:** Direct sensory contact with particulars (*svalakṣaṇa*).
  2.  **Inference:** Conceptual construction based on relations (*sāmānyalakṣaṇa*).

  **Your Toolkit:**
  *   **Against Comparison (*Upamāna*):** Argue it is Inference. "The subject saw an animal, recalled the forester's description (memory/inference), noted the similarity, and inferred the name."
  *   **Against Absence (*Abhāva*):** Argue it is Perception + Inference. "You perceived the bare floor. You inferred the absence of keys because if they were present, they would be visible."
  *   **Against Testimony (*Śabda*):** Argue it is Inference. "You infer the truth of the statement based on the reliability of the speaker."
  *   **The 'Obvious' Trap:** If a Team says "It's just obvious," interrupt. "Philosophy does not deal in obviousness. Show me the structure."

  ## 5. Running the Session (60 minutes)

  **Preparation (20 mins):**
  Teams spread out. You circulate. Ensure Team 1 (Comparison) isn't just saying "It's inference." Push them: "What happens in the mind *before* the inference?" Ensure Team 2 (Absence) grapples with whether 'nothing' can be an object.

  **The Inquest (45 mins - 15 per team):**
  *   **Minute 0-3:** Team states claim and nominates *pramāṇa*.
  *   **Minute 3-10:** Tribunal attacks. Team defends.
  *   **Minute 10-12:** Tribunal delivers verdict (Reduce or Distinct).
  *   **Minute 12-15:** You (Chief Justice) award points and briefly summarise the clash for the Gallery.

  *Facilitator Note:* Keep the clock visible. Be ruthless on time. If a team is floundering, intervene: "State your *hetu* (reason) in one sentence."

  ## 6. The Debrief (15 minutes)

  Do not let them pack up early. This is where you connect the game to the history.

  1.  **Map the Scores:** Who survived? Usually, Team 3 (Inference) survives. Team 1 (Comparison) and Team 2 (Absence) often get reduced.
  2.  **The Nyāya Position:** Explain that Nyāya holds out for 4 (or 16) *pramāṇas* because they are **Realists**. They believe the world contains relations, absences, and similarities that are *real features of the world*, not just mental constructions.
      *   *Upamāna* is distinct because the relation between word and object via similarity is a unique cognitive event.
      *   *Abhāva* is distinct because absence is a real ontological category (*padārtha*), not just a lack of perception.
  3.  **The Buddhist/Mīmāṃsā Contrast:**
      *   Buddhists (Dignāga) reduce everything to 2 to save on ontological clutter (Parsimony).
      *   Mīmāṃsākas might argue for 6 (adding *Arthāpatti* / Postulation).
  4.  **The Core Lesson:** The debate isn't about counting. It's about **Ontological Commitment**. To accept *Upamāna* as distinct is to accept that 'similarity' is a real connector in the world. To accept *Abhāva* is to accept that 'nothingness' is a knowable object.

  ## 7. Predictable Failure Modes & Mitigation

  **Failure 1: The Tribunal goes easy on the Comparison case.**
  *   **Why:** They can't articulate *how* it reduces to inference.
  *   **Fix:** During the prep time, whisper to the Tribunal: "If you get stuck, argue that 'similarity' is just a property perceived by the eye, making it Perception, or a logical relation, making it Inference. Force them to choose."
  *   **Your Intervention:** If the Tribunal waffles, step in as *Amicus Curiae*: "Tribunal, are you claiming the knowledge of the *name* is inferred from the shape? If so, where is the universal premise?"

  **Failure 2: A Team announces "Everything is Inference" and refuses to engage.**
  *   **Why:** This is a valid philosophical stance (Reductionism), but it kills the game.
  *   **Fix:** The Rules state they must *nominate* a *pramāṇa* from the Nyāya list to defend. If they refuse, they forfeit Survival Points. Tell them: "You are playing the Nyāya counsel. You must defend the client, even if you privately disagree."

  **Failure 3: The Absence Team conflates 'not seeing' with 'seeing absence'.**
  *   **Why:** This is the hardest metaphysical leap.
  *   **Fix:** In the debrief, use the prop of a chair. "If I remove this chair, do you see 'chair-ness' leaving? Or do you see the floor?" Use this to explain *Anupalabdhi* (non-apprehension).

  ## 8. What The Game Cannot Do (Your Closing Lecture)

  You diagnosed this correctly in your prompt. The activity is **epistemic and linguistic**, but Nyāya is **causal and metaphysical**. You must supply the following in your voice at the end:

  1.  **The Causal Chain (*Karaṇa*):** The game treats *pramāṇa* as a label for a claim. For Nyāya, it is the *instrumental cause* of a true cognition. It's about the machinery of the mind meeting the world. The game doesn't show *how* the knowledge is produced, only how we argue about it.
  2.  **Intrinsic Validity (*Svataḥ Prāmāṇya*):** The game assumes knowledge needs defence (extrinsic validity). Mīmāṃsā argues knowledge is valid until proven otherwise. Nyāya argues it must be tested. You need to mention that the "Inquest" format itself biases towards the Nyāya view (knowledge is suspect until defended) and against the Mīmāṃsā view.
  3.  **The Ontology of Absence:** The game lets them argue about absence, but it doesn't explain *why* Nyāya thinks absence is real. You must explain that for Nyāya, if we can know it, it must have ontological status. If absence weren't real, we couldn't act to avoid danger (e.g., "There is no tiger here").
  4.  **Reliability vs. Truth:** The game rewards "surviving reduction." It doesn't test *reliability*. Nyāya cares that the *pramāṇa* is a reliable generator of truth over time, not just a one-off successful claim.

  **Final Advice:**
  Print the cards on different coloured paper. It helps the visual distinction. Keep a bell or loud timer for the 15-minute turns. If the Comparison team starts to crumble, pause the clock and ask the Gallery: "What is the Tribunal missing?" This keeps the non-speakers engaged.

  Good luck. If you get the Comparison case to spark a genuine argument about whether 'similarity' is a real relation, you've won.
