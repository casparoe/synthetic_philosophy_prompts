          *   *Test Case:* If a specific neural firing *is* the pain, does Huxley accept that? (Reading A says no, it causes the pain. Reading B says yes, it is the pain).

      *   **Issue 4: Functional Status (Evolution of a Useless Trait)**
          *   *Problem:* Why does consciousness exist if selection can't touch it?
          *   *Huxley's Base:* Darwinian. Acknowledges the difficulty.
          *   *Reading A (Spandrel/By-product):* It's a necessary consequence of complex machinery, like heat from an engine. Selection selects the engine; the heat comes along for free.
          *   *Reading B (Cryptic Function):* He might hedge. Maybe it *does* do something we don't understand, or maybe it signals complexity to others (though this implies causal power). Or, he might argue it's not selected *for*, but selected *with*.
