answer: |-
  **The Grammar of Faith**

  **Participants:**
  **Julian:** Defends a Wittgensteinian, internalist account of religious belief.
  **Sarah:** Defends a realist, truth-conditional account of religious belief.

  **Setting:** A quiet corner of a college common room, late afternoon. Rain against the window.

  **Sarah:** You're smiling, Julian. I find that irritating. We've been circling this for an hour, and you look as though you've just solved a crossword clue while I'm still staring at the grid.

  **Julian:** Not solved. Just… settled. I think you're fighting a battle against a positivist ghost that doesn't haunt this house anymore. When I say religious belief is a practice with its own criteria, I'm not saying it's immune to criticism. I'm saying the criticism has to be immanent.

  **Sarah:** Immanent criticism is all very well for a club rulebook. But let's take the first case we discussed. The believer who claims God has commanded him to do something monstrous. Say, to kill his neighbour. On your view, how do we condemn him? If the criteria are internal to the language-game, and he is sincerely playing that game, then by his lights, he is correct. He has followed the rules. To tell him he's wrong is just to say, 'We don't play that game here.' That's not moral condemnation; that's tribalism.

  **Julian:** That's a caricature. The 'game' isn't a set of arbitrary moves like chess. It's embedded in a form of life. In the Christian form of life, the concept of 'God' is grammatically tied to 'Love', 'Justice', 'Sacrifice'. If a voice tells you to murder, it might be a voice, but the grammar of the tradition tells you it isn't *God*. You don't need external evidence to know a checkmate isn't a valid move in Go. The incoherence is internal.

  **Sarah:** But what if he insists? What if he says, 'My God is a consuming fire, and He demands this blood'? You can't just stipulate the grammar. History is littered with people who were certain their violence was holy. If your account renders their certainty grammatically valid within their own bubble, you've made the language-game a bunker. You protect the meaning of 'God' by sacrificing the reality of the claim. You're saying, 'As long as you're consistent, you're safe.' But the prophet isn't looking for consistency; he's looking for truth.

  **Julian:** I concede this: if the believer is radically disconnected from the wider web of practices—prayer, scripture, community discernment—then yes, he is misusing the language. He is solipsistic. But my hit against you is this: on your realist view, how do you help him? You say, 'God probably doesn't exist, or if He does, He didn't say that.' But that relies on *your* metaphysics battling *his*. My appeal to the grammar of the tradition allows me to say, 'You are not acting as a Christian acts,' without needing to prove the non-existence of God. I can meet him on the ground he claims to stand on.

  **Sarah:** You can meet him, but you can't stop him. If the grammar is the only brake, and he jams it, you have nothing left. But let's move to the second case. The collapse of faith. A woman loses her child, and she says, 'I can no longer believe God is good.' Or a man reads history and says, 'The Resurrection didn't happen.' On your view, this is a change of life. A shift in orientation. She stops inhabiting the picture.

  **Julian:** Precisely. She loses the capacity to see the world *as* created, *as* redeemed. It's not that she deletes a proposition from her database. It's that the words 'God is good' no longer have a purchase on her suffering. They become hollow.

  **Sarah:** And there is the rub. When she says, 'It didn't happen,' she takes herself to be reporting a fact. She feels she has discovered something about the world, not just about her own psychology. If you tell her, 'No, you've just changed your form of life,' you are gaslighting her. You are denying the very thing that makes her loss of faith painful: the conviction that she was *wrong* before, because reality has pushed back. If faith is just a practice, apostasy is just quitting a hobby. But it feels like a bereavement. It feels like finding out the floor wasn't there.

  **Julian:** It *is* a bereavement. The loss of the picture is the loss of a world. But I want to press you on something my brother recently put to me. He says your realism assumes that because we use indicative sentences ('Christ is risen'), we must be referring to objects or events in the way 'The kettle is on' refers to a kettle. But here is the worry: an appeal to a language-game is a description of how a form of words is used. Descriptions of use are perfectly compatible with the users being systematically mistaken about what they are doing.

  **Sarah:** Go on.

  **Julian:** I can describe the grammar of a delusion without validating the delusion. I can map the rules of a paranoid's worldview. So, I cannot move from the fact that these are the words believers use to the conclusion that this is what the words *mean* in a truth-apt sense, without an argument I haven't given. You assume that because the believer *feels* they are stating a fact, they must be. But the internalist can say: the feeling of 'factuality' is part of the use, not proof of the reference.

  **Sarah:** That is a genuine hit. I grant you that. The phenomenology of belief—the feeling of 'clinging to a truth'—does not guarantee the truth. The realist must explain why the believer's experience of 'contact with reality' isn't just a vivid internal state. However, my reply is this: if you treat it as *only* a use, you strip the word 'reality' of content. When I say 'God is real', I am not just saying 'I am committed to this practice.' I am saying 'This practice is a response to something that is there whether I respond or not.' If your internalist account cannot accommodate that 'whether I respond or not', then you aren't describing religion; you're describing a sophisticated form of make-believe.

  **Julian:** I don't abandon the 'there'. I just say the 'there' is inaccessible outside the response. You can't stand outside the language-game to check if the hook catches the fish. But I will concede this: when the believer says 'God is real', they mean to be saying something that constrains them, not something they are projecting. If my account makes it sound like projection, it has failed to capture the weight of the confession.

  **Sarah:** And I will concede this: when the believer converts, it rarely looks like assessing evidence. It looks like falling in love, or waking up. It is a change in the whole person, not just the intellect. If I treat conversion as purely propositional assent, I miss the transformation. But Julian, we still disagree on the core. Is conversion coming to see a fact, or coming to inhabit a practice?

  **Julian:** It is coming to inhabit a practice *in which* certain things become visible as facts. The practice isn't a substitute for the fact; it's the organ of perception.

  **Sarah:** But the organ can be diseased. And if the organ is diseased, the facts it reports are false. That is why the realist account is necessary. We need to be able to say the organ is diseased. Your account only lets us say the organ is playing a different tune.

  **Julian:** And your account lets you say it's diseased, but often leaves you unable to hear the music at all. You stand outside the cathedral describing the acoustics, while I am inside listening to the choir. You know more about the sound waves; I know more about the hymn.

  **Sarah:** But if the choir is singing lies, Julian, knowing the hymn won't save you.

  **Julian:** No. But knowing the sound waves won't tell you whether they are lies.

  **Sarah:** *[Pauses, looking at the rain]* We are at an impasse. You think I'm reducing the sacred to the empirical. I think you're insulating the sacred from the true.

  **Julian:** Perhaps. But at least we agree the kettle is on.

  **Sarah:** *[Smiles faintly]* Thank God for small mercies.

  ***

  **Commentary**

  I think Sarah has the better of the argument, primarily because she successfully exposes the vulnerability in the Wittgensteinian position regarding the "systematic mistake" objection. Julian cannot fully explain why the believer's conviction of objective truth is anything more than a feature of their psychological state without smuggling in a form of realism he claims to reject. However, Julian is plainly right on one point: that describing conversion solely as a change in propositional belief fails to capture the phenomenological depth of the experience. The realist account explains why faith might be *false*, but the internalist account explains better why it feels *true*.
