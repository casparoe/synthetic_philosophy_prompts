answer: |-
  **1. Exam Question**

  **Final Examination: Action and Causation**
  **Unit: Causation by Omission**

  Consider the following vignette:

  > A regional rail operator runs a semi-automated braking system. Overnight, an engineer named Dana is assigned to review a software patch, leaves the review unfinished, and never flags it; the patch ships. A supervisor, aware that the review was incomplete, declines to halt the rollout, because halting it has no precedent and would require a signature he would rather not give. A signal controller on duty at the time of the incident notices an anomaly on her display and, out of a settled habit of not second-guessing the automation, does not call for a manual stop. A collision follows. For each of the three people, and for the automated system itself, it is stipulated that but for the relevant inaction (or, in the machine's case, the non-intervention) the collision would not have occurred.

  Standard counterfactual analysis identifies all four inactions as conditions sine qua non. However, causal selection requires distinguishing *the* cause from the background conditions.

  In your essay, adopt a **contrastive account of causation** (where *c* causes *e* rather than *e*′). You must also evaluate the following distinction: **an omission that is a one-off gap in an otherwise active course of conduct** versus **an omission that is the maintained output of a standing policy or habit**.

  1.  Using the contrastive framework and the distinction above, argue for **one** of the four candidates as the primary cause of the collision. Explain why your chosen contrast class privileges this omission over the others.
  2.  Analyze the automated system's status: does the policy/gap distinction apply to machines, given that a machine "fails to act" only by courtesy?
  3.  Explicitly state what your causal verdict does *not* settle regarding moral blame or legal liability, and explain why causation and responsibility must be decoupled in this vignette.

  ***

  **2. Model Answer**

  The but-for test is necessary but insufficient for causal selection because it renders causation ubiquitous. If every necessary condition is a cause, the concept loses its explanatory power. A contrastive account resolves this by asking not "What caused the collision?" but "Why did the collision occur *rather than* a safe passage?" The answer depends on the chosen contrast class, which is determined by our explanatory interests.

  To select the primary cause, we must apply the distinction between a one-off gap and a standing policy. Dana's omission is a one-off gap: she was engaged in an active course of conduct (reviewing) that was interrupted. The Supervisor, Controller, and Automated System, however, represent standing policies or habits. The Supervisor followed a bureaucratic policy of non-interference; the Controller acted on a settled habit of trusting automation; the Machine operated on its coded instructions.

  I argue the Supervisor's omission is the primary cause relative to the contrast class of *administrative oversight*. Why? Because the Supervisor's inaction was the maintained output of a standing policy that authorized the system's deployment despite known risks. Dana's gap was a precondition, but the Supervisor's policy decision sustained the risk. In a contrastive frame asking "Why did this *unsafe* system run rather than a *verified* one?", the Supervisor's adherence to a flawed policy is the differentiating factor. Dana's error was a local failure; the Supervisor's was a systemic endorsement.

  The automated system complicates the policy/gap distinction. A machine cannot have "habits" or "policies" in the intentional sense; its "omission" is merely the absence of a command in its code. Therefore, the machine's non-intervention is the *embodiment* of the standing policy rather than an omission itself. To call the machine a cause is to mistake the tool for the policy it executes. The machine is the mechanism of the collision, but the Supervisor's policy is the cause of the mechanism's deployment. Thus, the distinction applies to machines only metaphorically; strictly speaking, the machine represents the policy itself.

  Finally, identifying the Supervisor's policy as the cause does not settle blame. Causation is metaphysical or explanatory; blame is normative. Dana might be more culpable professionally for negligence (the one-off gap), even if the Supervisor's policy was the primary causal factor. Legal liability might attach to the corporation for the standing policy, while moral blame might attach to Dana for carelessness. Fixing the cause identifies the leverage point for prevention (changing the policy), but it does not dictate who should be punished. We must decouple causation from responsibility to avoid the error of assuming the primary cause is always the most blameworthy agent. The Supervisor's policy caused the event, but Dana's negligence might warrant greater sanction.

  ***

  **3. Marking Scheme**

  **Total Marks: 20**

  | Point | Criteria (4 marks each) | Characteristic Error (How candidates get it wrong) |
  | :--- | :--- | :--- |
  | **1. Critique of But-For** | Explicitly argues that but-for dependence is insufficient for *selection* because it yields too many causes (ubiquity problem). | Treating the but-for test as a sufficient condition for identifying *the* cause rather than merely necessary conditions. |
  | **2. Contrastive Framework** | Defines a specific contrast class (e.g., safe passage vs. collision) and shows how shifting this class changes the causal selection. | Asserting causation is contrastive without specifying *what* the outcome is being contrasted against (empty gesturing). |
  | **3. Policy vs. Gap Application** | Uses the distinction to differentiate the candidates (e.g., Dana as gap, Supervisor/Controller as policy) to justify selecting one cause. | Applying the distinction descriptively without using it to *argue* for the selection of one specific cause over the others. |
  | **4. Machine Status** | Evaluates whether the policy/gap distinction applies to the machine, noting the metaphorical nature of machine "omission." | Treating the machine's non-intervention as identical to human omission without addressing the lack of intentionality/policy capacity. |
  | **5. Cause/Blame Separation** | Explicitly argues that causal selection does not determine moral/legal liability (e.g., primary cause ≠ most culpable agent). | Sliding from "X is the cause" to "X is therefore to blame" without arguing for the decoupling of the two concepts. |

  **A vs. B Distinction:**
  *   **A Answer (16-20 marks):** States a clear criterion for causal selection, defends it against at least one rival interpretation (e.g., why Dana isn't the cause), and shows the criterion doing work on the vignette details.
  *   **B Answer (10-15 marks):** Correctly identifies the concepts (contrastive, policy/gap, blame separation) but lists them sequentially without integrating them into a unified argument for a single cause.
