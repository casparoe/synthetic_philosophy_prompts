answer: |-
  # Joint Statement of Adversarial Collaboration: The Separateness of Persons and Aggregative Consequentialism

  **Signatories:** The Aggregative Consequentialist (AC) and The Separateness-of-Persons Restrictionist (R)
  **Date:** 24 May 2024
  **Subject:** Clarification of Disagreement regarding Interpersonal Aggregation and the Divided Ventilator Case

  ## I. Agreed Claims

  1.  **Metaphysical vs. Normative Separateness:** We agree that 'separateness of persons' admits of two distinct descriptions.
      *   *Metaphysical:* Persons are distinct loci of consciousness and experience; there is no super-personal entity that 'owns' the sum of our experiences. Both sides accept this as true.
      *   *Normative:* The metaphysical distinctness of persons imposes moral constraints on how we may trade off welfare between them (e.g., forbidding aggregation or imposing side-constraints). This is the locus of our disagreement. We agree that the central philosophical question is whether the Normative claim follows from the Metaphysical claim, and if so, under what description of the trade-off.
  2.  **Criterion of Rightness vs. Decision Procedure:** We agree to distinguish between the *criterion* of rightness (what makes an act morally right) and the *decision procedure* (how agents ought to deliberate).
      *   The AC accepts that R-style constraints (e.g., 'do not sacrifice one for many') may be the optimal *decision procedure* for maximising value in the long run, due to epistemic limits and psychological stability.
      *   The R insists that such constraints are constitutive of the *criterion* of rightness, not merely heuristics. An act violating separateness is wrong even if it maximises the good.
  3.  **What the Objection Is Not:** We agree that the Separateness of Persons objection is not a defence of ethical egoism (we may still have reasons to benefit others), nor is it a denial that suffering is bad. It is specifically an objection to the *structure* of moral reasoning that permits summing gains and losses across distinct boundaries as if they were intra-personal trade-offs.
  4.  **The Divided Ventilator Case:** Regarding the specific case of 'the Divided Ventilator' (one ventilator; Option A saves one patient with full recovery; Option B saves two patients with serious impairment; total welfare is higher in B; no patient is used as a mere means):
      *   We agree this is a 'hard case' where pre-theoretical intuitions may diverge.
      *   We agree that the Restrictionist can reject Option B (the split) without appealing to a deontological rule (e.g., 'rights') that the AC *must* reject as fundamental. The R may instead argue from the *description of the loss*: that the qualitative severity of the impairment to the two does not morally outweigh the death of the one, regardless of the arithmetic sum.
      *   We agree that if the dispute turns on the definition of 'welfare' (e.g., whether 'welfare' already includes 'integrity of a complete life'), then part of the dispute is verbal. If 'welfare' is defined neutrally (e.g., preference satisfaction), the dispute is substantive.
  5.  **Non-Decisive Cases:** We agree that certain cases are not decisive for this debate. For example, cases involving 'easy rescues' (low cost to agent, high gain to recipient) or cases where aggregation clearly benefits the worst-off without imposing catastrophic losses on others are compatible with both views.

  ## II. Disagreements and Cruxes

  | Crux | Aggregative Consequentialist (AC) Formulation | Restrictionist (R) Formulation | Shared Test or Case | AC Prediction | R Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Normative Derivation** | The metaphysical fact of distinct consciousnesses does not entail normative constraints. Moral reasons are grounded in the *value* of states of affairs, not the *boundaries* of the subjects experiencing them. | The metaphysical fact of distinct consciousnesses grounds the normative constraint. To ignore boundaries is to fail to respect persons as distinct entities, treating them as mere receptacles for value. | **Philosophical Argument:** Analysis of the 'One Life vs. Two Lives' intuition pump without utility calculations. | The intuition that boundaries matter is a heuristic for long-term welfare, not a fundamental moral truth. | The intuition that boundaries matter is a direct perception of moral reality, independent of welfare outcomes. |
  | **2. Permissibility of Aggregation (The Ventilator)** | In the Divided Ventilator case, if Option B yields higher total welfare, it is morally obligatory to split the ventilator. The distinctness of the patients does not forbid summing their gains against the one patient's loss. | In the Divided Ventilator case, Option B may be impermissible even if total welfare is higher. The distinctness of the patients forbids aggregating the two impaired lives to outweigh the one lost life if the loss is catastrophic for the one. | **The Divided Ventilator:** 1 Full Life vs. 2 Impaired Lives (Net Welfare > 0 for split). | Choose Option B (Split). The sum of welfare dictates the right act. | Choose Option A (Save One). The claim of the one to life is not defeasible by the summed claims of the two to impaired life. |
  | **3. Criterion vs. Procedure** | Restrictionist rules (e.g., 'do not sacrifice') are valid only as rules of thumb. If we knew with certainty that splitting the ventilator maximised value, the 'constraint' would vanish. | Restrictionist rules are valid as fundamental principles. Even with certainty that splitting maximises value, the 'constraint' remains binding because the act type is forbidden. | **The 'Transparent' Scenario:** A variation where all long-term consequences are known with certainty. | The R-constraint should dissolve; we should aggregate. | The R-constraint should hold; we should not aggregate. |

  ## III. Confidence and Uncertainty

  **Confidence Level:** We are moderately confident that this statement accurately maps the dialectical landscape. We have successfully isolated the metaphysical/normative distinction and the criterion/procedure distinction, which often conflate in seminar discussions.

  **Least Sure Point:** We are least sure about **Agreed Claim 4**, specifically whether the Restrictionist can reject the split in the Divided Ventilator case without appealing to a rule the Aggregative Consequentialist would reject as question-begging. The AC worries that any R-argument against aggregation ultimately rests on a 'bare assertion' that aggregation is forbidden. The R worries that any AC-argument for aggregation ultimately rests on a 'bare assertion' that only states of affairs matter. We are unsure if the 'verbal dispute' regarding the definition of welfare is sufficient to bridge this gap, or if it merely hides the fundamental disagreement.

  **Most Settle-able Crux:** We believe the crux regarding **Criterion vs. Procedure** is the most likely to be settled (or dissolved) by the shared tests proposed. Historical precedent suggests ACs often concede the practical utility of R-rules, and Rs often concede that their rules aim to protect human interests. The 'Transparent Scenario' test forces both to admit whether their commitment is to the *outcome* or the *act*.

  \answer{Criterion vs. Procedure Distinction}
