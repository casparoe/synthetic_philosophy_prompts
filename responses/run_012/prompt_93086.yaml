  2.  **Brainstorming & Conceptual Grounding:**
      *   *Global Workspace Theory (GWT):* Essentially, consciousness arises when information is broadcast globally to various cognitive systems (memory, language, motor control). If the broadcast is blocked, the information remains modular/local.
      *   *Access Consciousness (A-Consciousness):* Information is available for reasoning and reporting.
      *   *Phenomenal Consciousness (P-Consciousness):* The subjective "what it is like" feel (qualia).
