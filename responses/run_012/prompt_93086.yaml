      *   *The Cellist's Claim:* She feels "wordless inner weather." This suggests a non-conceptual, non-propositional qualia.
      *   *The Skeptic's Counter:* For her to be right, there must be neural activity correlated with this feeling *that is not broadcast*. It implies a "local qualia" theory. The skeptic needs to say: "Show me the firing pattern that isn't driving behavior but correlates with the report *after* the fact."
      *   *Scenario:* The "Gate" experiment. Suppression of the thalamocortical loop or fronto-parietal ignition.
