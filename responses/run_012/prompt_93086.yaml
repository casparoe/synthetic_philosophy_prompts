      *   **The Specific Neural Claim:** Mara needs to describe the feeling in a way that implies a specific neural state (e.g., sustained sub-threshold oscillation, local coherence without global spread).
      *   **The Ending:** Ambiguous. No resolution. Just the lingering doubt.

  4.  **Refining the Philosophical Nuance:**
      *   *GWT Commitment:* If the broadcast is stopped, the modules still talk to each other locally to guide behavior (blind sight style), but there's no "owner" of the experience.
      *   *Mara's Challenge:* She claims the "owner" is *more* present when the "noise" of the broadcast stops. This inverts GWT. It suggests broadcast is actually *interference*.
      *   *Elias's Stance:* If it doesn't cause a report *during* the interval, and leaves no memory trace *except* a post-hoc assertion, it's confabulation.
      *   *The "Specific Enough" Constraint:* Mara needs to say something like, "It's the hum in the left temporal lobe that usually gets drowned out by the language center." This gives Elias a target. "If you're right, we should see high-gamma coherence in region X that *decays* when the Gate opens."

  5.  **Writing - Focus on Tone:**
