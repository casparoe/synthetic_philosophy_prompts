answer: |-
  ### Examination Question

  **Course:** Graduate Seminar in Decision Theory
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the **Pasadena Game**: A fair coin is tossed until it lands Heads for the first time on toss $n$. The payoff is $(-1)^{n+1} \frac{2^n}{n}$.

  (a) State the expected value of this game when the terms are summed in their natural order ($n=1, 2, 3...$). Explain why, despite this sum existing, the expected value is mathematically undefined in the sense required by standard Expected Value Maximization (EVM). In your explanation, explicitly distinguish this case from the St. Petersburg paradox, where the expectation diverges to infinity. **[5 marks]**

  (b) The **Altadena Game** is identical to the Pasadena Game, except a constant $c > 0$ is added to every payoff. Explain the dominance relationship between the two games. If EVM declares both expectations undefined, what problem does this create for the theory's ability to respect dominance? **[5 marks]**

  (c) One proposed repair is to define the value of the game as the limit of the expectations of truncated versions (stopping after $N$ tosses as $N \to \infty$). Evaluate whether this successfully saves EVM or merely changes the subject by privileging the temporal order of outcomes over the structure of the gamble. **[5 marks]**

  (d) Take a normative stand: Does the Pasadena Game demonstrate that EVM is false, incomplete, or merely silent in this domain? Justify your position. Do not rely on resolutions standard to the St. Petersburg paradox (e.g., diminishing marginal utility or finite bankrolls); address specifically the pathology of the undefined expectation. **[10 marks]**

  ***

  ### Model Answer

  The expected value of the Pasadena Game, summing terms in the natural order of outcomes ($n=1, 2, 3...$), is $-\ln(2)$. This result derives from the Taylor series expansion of the natural logarithm. However, this value is not well-defined for the purposes of Expected Value Maximization (EVM). In the St. Petersburg paradox, the expectation diverges to positive infinity; the sum grows without bound but does so consistently regardless of term order. In the Pasadena Game, the series is conditionally convergent. The terms alternate in sign and decrease in magnitude slowly enough that the sum depends entirely on the order of summation. By the Riemann Rearrangement Theorem, the terms can be reordered to sum to any real number or to diverge. Since a gamble's rational value should depend on the probabilities and payoffs themselves, not the arbitrary order in which an agent lists them, the expectation is undefined. EVM requires a unique value to guide choice; a value that shifts with description fails this requirement.

  The Altadena Game adds a constant $c$ to every Pasadena payoff. Clearly, the Altadena Game dominates the Pasadena Game: in every possible state of the world, Altadena yields a strictly higher payoff than Pasadena. Rationality dictates that a dominant option must be preferred. However, if EVM asserts that the Pasadena expectation is undefined, adding $c$ to an undefined value yields another undefined value. If both values are undefined, EVM cannot rank them. The theory becomes silent, failing to capture the obvious rational preference for the dominant option. This suggests that declaring the expectation "undefined" is not a neutral mathematical observation but a failure of the theory to process clear dominance relationships inherent in the probability distribution.

  Proposals to repair this by taking the limit of truncated expectations (calculating the expected value if the game stops after $N$ tosses, then letting $N \to \infty$) recover the $-\ln(2)$ value. While mathematically consistent, this is not a straightforward salvation of EVM. It effectively hard-codes the natural temporal order of the coin tosses into the definition of expectation. It changes the theory from "maximize the expectation of the outcome distribution" to "maximize the limit of expectations of temporally ordered truncations." This privileges the causal or temporal generation of the outcome over the static structure of the gamble. If the same probability distribution were presented without the temporal tossing narrative, the justification for this specific ordering vanishes. Thus, this repair modifies the formalism significantly, potentially changing the subject from pure decision theory to a theory of sequential processes.

  Ultimately, the Pasadena Game demonstrates that EVM is incomplete. It is not merely silent; it is structurally incapable of handling conditionally convergent distributions without external stipulations regarding ordering. It is not necessarily "false" in domains where expectations are absolutely convergent, but its claim to be a universal guide for rational choice is untenable. The failure is not one of practical implementation (like infinite bankrolls) but of mathematical coherence. A theory of rational choice must be able to rank options where one strictly dominates the other. Since standard EVM cannot rank the Pasadena and Altadena games without ad hoc modifications to the definition of expectation, it fails to provide a complete account of rationality. The distinction between infinite and undefined expectations is crucial: infinity allows for comparative rankings (one infinity may be treated as larger, or both as unacceptable), whereas undefined values preclude comparison entirely. Therefore, EVM must be supplemented by a principle that respects dominance independently of expectation calculations, or replaced by a decision rule that does not rely on summing conditionally convergent series. The Pasadena Game shows that rational choice cannot be reduced solely to the arithmetic of expectations when the underlying series lack absolute convergence.

  ***

  ### Marking Scheme

  **Total Marks:** 25 (5 Marks per Point)

  **1. Natural Order Value and Conditional Convergence**
  *   **Must Hit:** Candidate states the natural order sum is $-\ln(2)$ and identifies the series as conditionally convergent, noting that rearrangement changes the sum (unlike St. Petersburg's divergence to $\infty$).
  *   **Common Error:** Confusing the Pasadena Game with St. Petersburg and arguing the expectation is infinite rather than undefined/order-dependent.

  **2. The Distinction Between Infinite and Undefined**
  *   **Must Hit:** Candidate explains that EVM requires a unique value, and order-dependence makes the value a property of the description rather than the gamble, violating the theory's requirements.
  *   **Common Error:** Claiming the expectation is "infinite" or arguing that the problem is solvable via standard utility curvature (diminishing marginal utility).

  **3. Altadena Variant and Dominance**
  *   **Must Hit:** Candidate identifies that Altadena strictly dominates Pasadena and explains that if both EVs are undefined, EVM fails to rank them, violating the dominance principle.
  *   **Common Error:** Asserting that adding a constant simply shifts the undefined value without recognizing the resulting failure of rational ranking/preference.

  **4. Truncation and Temporal Order**
  *   **Must Hit:** Candidate evaluates the truncation repair, noting it recovers $-\ln(2)$ but arguably privileges temporal order over the static probability distribution, changing the theory's scope.
  *   **Common Error:** Accepting truncation as a perfect fix without acknowledging that it imposes an external ordering constraint not present in the abstract gamble.

  **5. Normative Verdict on EVM**
  *   **Must Hit:** Candidate takes a clear stand (e.g., EVM is incomplete) and justifies it by linking the mathematical pathology to the inability to guide rational choice in dominance cases.
  *   **Common Error:** Remaining agnostic or arguing the problem is merely "theoretical" with no bearing on rational choice theory's validity.
