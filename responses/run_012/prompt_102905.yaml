answer: |-
  You have identified a precise and unsettling fissure in the landscape of moral evaluation. The phenomenon you describe does not have a single, canonical proper noun in the way "The Categorical Imperative" does, but in contemporary moral philosophy and action theory, it is increasingly recognized as a distinct category.

  The most accurate name for it is **Hermeneutic Luck** (sometimes referred to as **Interpretive Luck**).

  It is a specific subspecies of *Moral Luck*, but it is distinct from the four standard categories Thomas Nagel outlined in his seminal 1979 essay *Moral Luck*. To give you the precision you require, I will define it by marking its boundaries against its neighbors, explaining its mechanism, and tracing its edges regarding time and audience.

  ### 1. Definition and Demarcation

  **Hermeneutic Luck** is the contingency of how an agent's actions are *meaningfully constituted* by the audience, independent of the physical consequences of those actions.

  To see why this is distinct, we must look at the standard taxonomy of Moral Luck you already know, and see where your observation slips through the cracks:

  *   **Constitutive Luck:** The luck of who you are (temperament, intelligence). *Your case is not this:* You are comparing the same person, with the same character, across different readings.
  *   **Circumstantial Luck:** The luck of the problems you face (e.g., living in Nazi Germany vs. neutral Switzerland). *Your case is not this:* The agent faced the same circumstance and performed the same act.
  *   **Resultant (Causal) Luck:** The luck of how things turn out physically (e.g., the drunk driver who hits a child vs. the one who arrives home). *Your case is explicitly not this:* You noted that "nothing in the world differs." The physical causal chain is identical.

  **Hermeneutic Luck** differs from Resultant Luck because it concerns *semantic consequences* rather than *causal consequences*.
  *   In **Resultant Luck**, the world changes (a child dies vs. lives).
  *   In **Hermeneutic Luck**, the *description* of the world changes (a voyage is "courage" vs. "plunder"), while the physical facts remain static.

  It differs from **Circumstantial Luck** because the circumstance usually refers to the *agent's* environment at the time of action. In your cases, the "circumstance" that changes is often the *future* or the *observer's* framework, which the agent could not possibly inhabit or control.

  ### 2. The Mechanism: The Necessity of "Uptake"

  Why does this happen? Why isn't the act's meaning fixed by the agent's intention?

  The philosophical mechanism here is derived from Speech Act Theory (J.L. Austin, John Searle), specifically the concept of **Uptake**. Austin argued that for certain acts to be complete, they require "uptake" from a recipient. If I say "I promise," but you do not recognize it as a promise (perhaps you think I am joking), the illocutionary act fails.

  You are observing that **moral actions require moral uptake.** An act of "generosity" is not a self-contained physical event like a rock falling; it is a social sign. For it to *be* generosity, it must be received as such.
  *   **The Agent** controls the *signifier* (the money given, the voyage undertaken).
  *   **The Audience/History** controls the *code* (the cultural framework that decodes the signifier).

  **Hermeneutic Luck** is the luck of the code. If the code shifts between the moment of acting and the moment of judging, the moral identity of the act shifts, even if the physical act does not.

  ### 3. Distinguishing from Moral Disagreement

  You asked to mark this off from "plain moral disagreement." This is a crucial edge.

  *   **Moral Disagreement** implies a conflict over *principles*. (e.g., "Is capital punishment inherently wrong?") Both sides understand the act the same way; they disagree on the rule applied to it.
  *   **Hermeneutic Luck** implies a shift in *perception of the act itself*. (e.g., "Was this payment a bribe or a gift?")

  In moral disagreement, the facts are stable, and the *law* is debated. In Hermeneutic Luck, the *facts of the case* (in the social sense) are unstable because the *lens* is warped.
  *   **Test:** If you could transport the agent from Era A to Era B, and they would be confused by the accusation ("I didn't know that meant plunder then!"), it is Hermeneutic Luck. If they would argue ("No, plunder is wrong, but this was justice!"), it is Moral Disagreement. Your examples (the confidence received as condescension) suggest the former: the agent *could not have foreseen* the slight.

  ### 4. The Edges: Time and Audience

  You asked about the boundaries of this phenomenon regarding time and the state of the actor.

  **A. Lifetime vs. Posthumous**
  Is being misread in one's lifetime the same phenomenon as being reinterpreted after death?
  *   **Structurally:** Yes. Both are failures or shifts in uptake.
  *   **Morally:** No.
      *   **In Lifetime:** The agent has the capacity for *negotiation*. They can clarify, apologize, or double down. The "luck" can be mitigated by further agency.
      *   **Posthumous:** The agent is hermeneutically helpless. This is **Pure Hermeneutic Luck**. The act becomes a text entirely severed from its author. As a biographer, this is your primary domain: you are studying agents who cannot correct the record.

  **B. Is it "Bad Luck" for the Actor?**
  You asked if a society changing its mind is bad luck for the actor *at all*.
  *   **If the actor is dead:** It cannot be "bad" for them in a experiential sense (they feel no pain). However, it is bad for their **Moral Identity**. We must distinguish between *Moral Worth* (Kantian internal culpability) and *Moral Standing* (social reputation). Hermeneutic Luck devastates Moral Standing while leaving Moral Worth untouched.
  *   **If the actor is alive:** It is unequivocally bad luck. It imposes social costs (shame, loss of status) for a variable they did not control (the audience's mood).

  **C. The "Nothing Happens" Paradox**
  You wrote: *"What puzzles me is that in my cases nothing happens."*
  Philosophically, something *does* happen: the **Social Fact** changes.
  In human history, a "Social Fact" (like being a hero or a villain) is as real as a "Brute Fact" (like a broken bone). Hermeneutic Luck is the volatility of Social Facts. The brute facts (the voyage, the money) are stable; the social facts (the courage, the generosity) are fluid. The luck lies in the dependency of the Social Fact on the Brute Fact.

  ### 5. Summary for the Biographer

  To answer your request for a definition precise enough to use in your work:

  **Hermeneutic Luck** is the vulnerability of an agent's moral legacy to the uncontrollable variability of the interpretive frameworks applied by observers, distinct from the physical outcomes of the agent's actions.

  **Use this checklist to identify it in your subjects:**
  1.  **Invariance:** Did the physical act and the agent's intent remain constant? (If yes, proceed.)
  2.  **Variability:** Did the moral valuation (praise/blame) change across audiences or time? (If yes, proceed.)
  3.  **Unforeseeability:** Was the negative interpretation based on a cultural code or consequence the agent could not reasonably access at the time? (If yes, it is Hermeneutic Luck.)
  4.  **Non-Causality:** Did the change in valuation occur *without* new physical evidence coming to light? (If yes, it is Hermeneutic Luck, not just new information.)

  **Why this matters for you:**
  Standard history often assumes that if we just find the "true facts," the moral judgment will settle. Your observation proves that for human lives, there is no such thing as a "true fact" of moral meaning that exists independently of the reader. You are not just recording what they did; you are recording the history of how they were *read*.

  The tragedy you are documenting is not that people did different things, but that the **language of judgment** is a moving target. The arrow was the same; the target moved. That is Hermeneutic Luck.
