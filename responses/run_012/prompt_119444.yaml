answer: |-
  Friends, family, thank you for coming.

  We are here for one simple thing. We are here to give this little girl her name.

  A name is a heavy thing. It is not just a sound. It is a place to stand. When we call her by it, we are saying: you are here. You are one of us.

  We cannot promise her everything. We cannot promise she will never be hurt. We cannot promise the world will always be kind to her. Life is hard. We all know this. The older people in this room know it best. Things break. People leave. Sometimes we are tired.

  But we can make a promise about how we will be with her.

  We promise to try to know her.

  This is not as easy as it sounds. To know someone is work. It is not just feeling warm when we look at them. It is looking close. It is listening when she speaks. It is watching what she does, not just what we hope she will do.

  Sometimes we will get it wrong. We will think we know what she needs, but we will miss. We will see ourselves instead of her. When this happens, we promise to try again. We promise to keep looking until we see the real person, not the idea we have in our heads.

  This is how we love. Love is not just a feeling. It is the work of seeing clearly.

  And what about the future? What about when we are old? What about when we are gone?

  We will not live forever in our bodies. None of us will. But we do not simply vanish. We stay in the people we have helped. We stay in the ways we changed each other.

  If you are kind to someone, they carry that kindness forward. They pass it on. If you tell the truth, even when it is hard, that truth stays in the room. It becomes part of how people act after you are gone.

  The world gets better not because of big, loud things. It gets better because of small things. Quiet things. Things nobody writes down. Sharing a meal. Sitting with someone who is sad. Telling a story so it is not forgotten.

  These small things add up. They hold the world up.

  So, to the parents, and to the guides standing with them: your job is not to make her perfect. Your job is to teach her to see others. To see them as real as herself. To know that what she does matters, even when nobody is watching.

  To the grandparents and the family: you know this already. You have done this work. You have kept the memory of those before you. You have shown us how to stay connected.

  To the friends: we are here because people matter. Because this life is the one we have.

  And to you, little one.

  Welcome.

  We are glad you are here.

  We will help you grow. And we hope you will help us grow too.

  We will call you by your name. And we will do the work to deserve it.

  ***

  **NOTE TO SPEAKER (DO NOT READ ALOUD)**

  **Contested Ground in Your Eliot Reading**
  You are building this on a specific, somewhat idealized reading of Eliot's later thought. Be aware of three friction points where scholars might push back:

  1.  **Sympathy as Knowledge:** You are relying on the Eliotian claim that sympathy is epistemological (that loving someone allows you to *know* them truly). Contemporary theory and even some Victorian critics argue this is impossible—that sympathy is always projection. If a guest pushes back, they might argue we *never* fully see the other, so promising to "see clearly" sets an impossible standard.
  2.  **The "Choir Invisible" as Consolation:** You are using the idea of living on in others as a substitute for heaven. Some critics (like Henry James) found Eliot's "Religion of Humanity" emotionally cold. It demands a lot from the living. If the room feels fragile, this can sound like a burden ("You must be good so you live on") rather than a comfort.
  3.  **Feuerbachian Transposition:** You are assuming the "attributes of God" can be successfully relocated to humans without loss of weight. Catholic theology argues those attributes *require* God to sustain them. You are asking the Catholic half to nod at a structure that removes the foundation they believe holds it up. They might nod politely, but the theological dissonance is real.

  **When to Scrap This Approach**
  You should abandon this frame and go for "short and warm" if:

  1.  **The Room is Fragile:** If there has been recent grief or tension beyond the religious split, this speech is too heavy. It asks people to work. A naming ceremony might just need to be a hug.
  2.  **Your Nerves:** If you are too nervous, simple words can sound condescending. "Love is work" said shaky sounds like a platitude. "Love is work" said steady sounds like a vow. If you can't hold the room, the simplicity will work against you.
  3.  **The Parents' Actual Wish:** You say their only instruction was "no God/stardust." But did they ask for *weight*? Or did the celebrant say that? If the parents actually want a light celebration, this speech turns their party into a seminar.

  **Is this frame doing more for you?**
  Be honest: This speech lets you perform your expertise without citing sources. It validates your thesis topic in a social setting. If you can't separate your need to validate your academic lens from the baby's need to be welcomed, scrap it. The baby doesn't need Eliot; she needs you. Only use this if you truly believe Eliot's secular solemnity is the *only* honest language for this room. If it's just the language you know best, that's not enough reason.
