answer: |-
  ### The Autonomy Integrity Check (AIC)

  You are right to feel that regulations are a floor. The Common Rule and FDA regulations tell you what you *must* do to avoid liability; they do not tell you what you *should* do to honor human dignity. The philosophy of consent rests on **Respect for Persons** (Kant/Rawls), which treats autonomy not as a checkbox but as a condition of moral agency.

  Here is a decision procedure designed to test the *moral validity* of consent, not just its regulatory compliance. It is ordered sequentially. If a protocol fails a step, it stops unless a specific waiver condition is met.

  **Legend:** `[VJ]` = Value Judgment. This is where your instinct lives. Do not hide this. If reviewers disagree here, it is not a factual dispute; it is an ethical one.

  #### Step 1: The Capacity Threshold
  **Question:** Does the participant possess the functional ability to understand the relevant information, appreciate the situation, reason through the options, and communicate a choice?
  *   **Test:** Can they teach it back in their own words? (Not just recite).
  *   **Fail Condition:** They cannot process the information due to cognition, crisis, or development.
  *   **Remedy:** Surrogate decision-maker + Assent from subject (if possible).
  *   **Escalation:** If capacity is borderline (e.g., mild impairment, acute pain), this **must go to the Full Board**. The Chair cannot adjudicate clinical nuance alone.

  #### Step 2: The Truth Condition (Disclosure)
  **Question:** Is the participant being misled, or is material information being withheld?
  *   **Test:** Is there a gap between the stated purpose and the actual hypothesis?
  *   **Fail Condition:** Intentional deception or omission of risk.
  *   **Waiver Path:** Deception is permissible *only if*:
      1.  The scientific value is impossible to achieve without it.
      2.  The risk is no more than minimal (psychological distress counts).
      3.  **Debriefing is mandatory and timely.**
  *   **[VJ] Flag:** Is the deception trivial (puzzle rules) or fundamental (nature of the interaction)? Fundamental deception treats the person as a means, not an end.
  *   **Escalation:** Any protocol relying on deception **must go to the Full Board**. The Chair cannot authorize lying to patients alone.

  #### Step 3: The Voluntariness Condition (Freedom)
  **Question:** Is the decision to participate free from coercion (threats) and undue inducement (offers too good to refuse)?
  *   **Test:** Could a reasonable person in this specific context say "No" without significant loss?
  *   **Fail Condition:** Coercion by authority (clinician-researcher conflict) or structural desperation.
  *   **[VJ] Flag:** **Contextual Inducement.** A payment is not "undue" because of the amount, but because of the *recipient's vulnerability*. If the offer resolves a basic need (rent, food, debt) that the participant cannot otherwise meet, it compromises the ability to refuse. This is exploitation, not compensation.
  *   **Escalation:** If payment exceeds 2x local hourly wage *or* if the recruitment targets a economically vulnerable population, this **must go to the Full Board**.

  #### Step 4: The Motivation Check (Authorization)
  **Question:** Why are they saying yes?
  *   **Test:** What is the primary driver? (Altruism, cure, money, obligation?)
  *   **Fail Condition:** **Therapeutic Misconception** (believing research is treatment) or **Obligation** (doing it to please an authority figure).
  *   **[VJ] Flag:** If the participant says, "I'm doing this for the doctor," they are not consenting; they are complying. Compliance is not consent.
  *   **Escalation:** If >20% of pilot participants express obligation-based motivation, the protocol returns to investigators.

  ---

  ### Application to Your Three Cases

  Here is the AIC run on your current stack.

  #### Case 1: The "Learning and Memory" Deception Study
  *   **Step 1 (Capacity):** Presumed intact (adults).
  *   **Step 2 (Truth):** **FAIL.** The purpose is withheld.
      *   *Waiver Analysis:* Is the deception fundamental? Yes, knowing the study is about cheating ruins the variable. Is risk minimal? Likely yes (embarrassment). Is debriefing planned? Yes.
      *   *Philosophical Check:* Does this treat them as a means? Potentially. But if the debriefing restores their agency by explaining *why* they were used, it mitigates the violation.
  *   **Step 3 (Voluntariness):** Pass.
  *   **Step 4 (Motivation):** Pass.
  *   **Decision:** **Conditional Approval.**
      *   *Requirement:* The debriefing cannot be a formality. It must be a "process of re-consent" where they are given the option to withdraw their data after learning the truth.
      *   *Escalation:* **Full Board.** Even with the waiver, deception requires collective moral authorization.
      *   *Note:* This is standard social science, but the "re-consent for data" is often skipped. Don't skip it.

  #### Case 2: Phase 1 Drug Study ($3,000 / 2 Weeks)
  *   **Step 1 (Capacity):** Presumed intact (healthy volunteers).
  *   **Step 2 (Truth):** Pass.
  *   **Step 3 (Voluntariness):** **FAIL (High Risk).**
      *   *Analysis:* $3,000 for 2 weeks is $1,500/week. In a city where this covers months' rent for the demographic, this is not compensation for time; it is a solution to poverty.
      *   *[VJ] Application:* A "No" here means financial hardship. A "Yes" means financial survival. When the choice is between risk and rent, autonomy is compromised. The regulation says payment is not coercion. The philosophy says **desperation is coercion.**
      *   *Escalation:* **Full Board.**
  *   **Decision:** **Recommendation to Reject or Restructure.**
      *   *The Answer You Won't Like:* You should not approve this payment structure as written. It recruits based on economic vulnerability. It violates the principle of Justice.
      *   *Action:* Require payment to be prorated (e.g., $500/week) or require that recruitment not target low-income zip codes. If the study cannot recruit without this level of payment, the study design is ethically flawed because it relies on exploitation to fill slots.
      *   *Why you won't like it:* This will anger the Principal Investigator and slow enrollment. It challenges the hospital's reliance on Phase 1 revenue. But it is the only philosophically consistent position.

  #### Case 3: 78-Year-Old with MCI ("For the Doctor")
  *   **Step 1 (Capacity):** **Borderline.** She can repeat risks (rote memory), but MCI affects executive function (reasoning).
      *   *Escalation:* **Full Board** or Clinical Consult. Do not decide this alone.
  *   **Step 2 (Truth):** Pass.
  *   **Step 3 (Voluntariness):** Pass (No external pressure).
  *   **Step 4 (Motivation):** **FAIL.**
      *   *Analysis:* "Doing it for the doctor" is **Obligation**, not Authorization. She is deferring agency to the physician. This invalidates consent even if she understands the risks. She is not choosing the risk; she is choosing to obey.
      *   *Remedy:* She cannot consent for herself. This requires a **Legally Authorized Representative (Surrogate)**.
  *   **Decision:** **Do not enroll on her signature.**
      *   *Action:* Obtain surrogate consent (family) + her assent. If no surrogate is available, she is ineligible.
      *   *Why:* Enrolling her on her own signature is a category error. You are treating compliance as consent.

  ---

  ### What This Procedure Cannot Settle

  You asked for the limits. The AIC protects the *individual's* autonomy, but it is blind to three things you will still have to wrestle with:

  1.  **Social Value:** A study can have perfect consent and be worthless. The AIC does not measure whether the knowledge gained is worth the participants' time or risk. That requires a scientific judgment the ethics board is often ill-equipped to make.
  2.  **Risk/Benefit Calculus:** Philosophy says "Do no harm." Research says "Risk is necessary for progress." The AIC ensures the risk is *chosen*, but it cannot tell you if the risk is *worth taking*. That is a utilitarian calculation (Greatest Good) that conflicts with the deontological (Rights-Based) framework of consent.
  3.  **Systemic Justice:** In Case 2, the AIC flags the payment. But it cannot solve the poverty that makes the payment coercive. You can reject the protocol, but the patients still need rent. The procedure protects them from *your* study, not from the conditions that made them vulnerable to it.

  **Final Instruction:**
  When you stall, it is because you are trying to solve a moral problem with a bureaucratic tool. Use the AIC to identify *which* moral principle is being bruised (Truth, Freedom, or Capacity). If the bruise is deep, pass the gavel to the Full Board. Do not carry the weight of the "Value Judgments" alone. That is what the Board is for.
