prompt: |-
  hey, so for my philosophy of science class we have to write about what "function" even means in biology and im kinda stuck. my bio teacher talks like its obvious — the heart's function is to pump blood, done. but my older cousin said thats actually a whole mess and there are two theories that disagree about it, one where a function is whatever the part got selected for over evolutionary history and one where a function is just whatever causal job the part does in the system right now. she called them the etiological one and the causal-role one i think.

  can you compare them for me? like what's actually at stake, do they even disagree or are they answering two different questions (why is this part here vs what is this part doing), and when they give different answers, which one should win. and please use weird cases instead of the heart, because the heart example makes both theories look obviously right:

  1) made up bird: wings originally selected for flying, then the birds get to an island with no predators, stop flying, and now the wings mostly get used for balance and for shading the chicks. whats the function of the wing now? did the old function go away, or is flying still its function too?

  2) a frog gets a brand new mutation, first frog ever to have it, that makes a sticky patch on its back that catches flies it can eat. it helps it survive right away but there's been no time for natural selection to do anything, its generation one. does the patch have a function yet? the causal role answer seems easy, i dont get what the etiological one says.

  3) some freak accident makes a frog thats molecule for molecule identical to a normal frog but it has no parents, no species, no evolutionary history at all, it just appears. does its heart have the function of pumping blood?

  and the thing i really dont get: people say one of these theories is better because only it can say a broken heart is malfunctioning and not just a heart that happens not to pump. is that true, and is it even a good reason to pick a theory?

  last thing, is there some third option where you just glue the two together, and does that actually work or is it kind of cheating. thanks
