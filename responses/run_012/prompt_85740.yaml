answer: |-
  This is a classic philosophy of biology rabbit hole, and your cousin is right: your bio teacher is taking the "shut up and calculate" approach (which works for doing biology), but you are being asked to do the "what are we actually talking about" work (which is philosophy).

  The debate is usually framed as **Etiological (Selected Effect)** theories vs. **Causal-Role (Systemic)** theories.

  Here is the breakdown of what is at stake, how they handle your weird cases, and whether you can glue them together.

  ### 1. The Core Disagreement: History vs. Mechanics

  You hit the nail on the head: they are largely answering two different questions, but they both claim to be defining the word "function."

  *   **The Etiological View (Selected Effect):**
      *   **The Question:** *Why is this trait here?*
      *   **The Definition:** A trait's function is the effect it had in the past that caused it to be naturally selected.
      *   **The Vibe:** Historical, evolutionary, normative (deals with "oughts").
      *   **Key Philosopher:** Ruth Millikan, Larry Wright, Karen Neander.

  *   **The Causal-Role View (Systemic):**
      *   **The Question:** *What does this trait do right now?*
      *   **The Definition:** A trait's function is any causal contribution it makes to the capacity of the containing system.
      *   **The Vibe:** Mechanical, physiological, descriptive (deals with "ises").
      *   **Key Philosopher:** Robert Cummins.

  **What's at stake?**
  If you choose Etiological, you are saying biology is inherently historical; you can't understand an organism without knowing its ancestry. If you choose Causal-Role, you are saying biology is like engineering; you can understand a machine (or organism) just by looking at how its parts interact right now.

  ---

  ### 2. The Weird Cases

  Here is how the two theories crash into each other using your examples.

  #### Case 1: The Flightless Island Bird
  *Scenario:* Wings selected for flight, now used for balance/shading.
  *   **Etiological Answer:** The function is **flying**. Even if the bird never flies again, the reason those wing-structures exist in the genome is because ancestors flew. Balance and shading are "exaptations" (useful side effects), not the *proper function*. The old function only goes away if the trait is eventually selected for balance over many generations.
  *   **Causal-Role Answer:** The function is **balance and shading**. The wing contributes to the bird's stability and thermoregulation *now*. Flying is not a function because it makes no causal contribution to the current system (the bird doesn't do it).
  *   **Who wins?** If you are an evolutionary biologist asking about the genome, Etiological wins. If you are a physiologist asking how the bird stays upright, Causal-Role wins.

  #### Case 2: The First Mutant Frog
  *Scenario:* Generation 1 sticky patch. Catches flies immediately. No selection history.
  *   **Etiological Answer:** **No function yet.** This is the hardest pill to swallow for this theory. Because natural selection hasn't had time to act on this trait, it has no "selected effect." It is a beneficial accident, but strictly speaking, it isn't *for* catching flies yet. It needs to be inherited and selected before it gets a function.
  *   **Causal-Role Answer:** **Yes, catching flies.** It contributes to the frog's digestive capacity and survival immediately. History doesn't matter; current mechanics matter.
  *   **Who wins?** Causal-Role feels more intuitive here. The Etiological view forces you to say the trait is functionless until the frog has grandkids, which seems weird if the trait is keeping the frog alive right now.

  #### Case 3: The "Swampman" Frog
  *Scenario:* Molecule-for-molecule identical frog, but created by accident with no evolutionary history.
  *   **Etiological Answer:** **No function.** Its heart does not have the function of pumping blood. Its legs do not have the function of jumping. It is just a lump of matter that *looks* like a frog. Because it has no history of selection, it has no proper functions. (This is a famous thought experiment by Donald Davidson, applied here to biology).
  *   **Causal-Role Answer:** **Yes, pumping blood.** It is structurally identical to a normal frog. It contributes to circulation. Therefore, it has the same functions.
  *   **Who wins?** This is the "nuclear option" for the Etiological theory. Most people find it insane to say the Swamp-frog's heart isn't a heart. This suggests that for physiology, history shouldn't matter. But Etiological theorists bite the bullet: they say without history, there is no difference between a frog and a very complex rock that happens to pulse.

  ---

  ### 3. The "Malfunction" Argument

  You asked: *People say one of these theories is better because only it can say a broken heart is malfunctioning. Is that true?*

  **Yes, it is largely true.** This is the strongest argument for the Etiological view.

  *   **The Problem for Causal-Role:** If function is just "what the part does," then a broken heart that doesn't pump has the function of "not pumping." It is doing exactly what it does. To say it is *malfunctioning* implies it *ought* to do something else. Causal-Role theory struggles to explain "oughts." It describes capacities, not norms.
  *   **The Etiological Solution:** A heart has the function of pumping because ancestors pumped blood and survived. Therefore, a heart *ought* to pump blood. If it doesn't, it is failing to meet the standard set by its history. It is malfunctioning, not just doing something different.

  **Is this a good reason to pick the theory?**
  It depends on whether you think biology needs **normativity** (rules about what *should* happen).
  *   If you think "disease" and "health" are real, objective biological categories, you probably need the Etiological view. You need a way to say a cancer cell is doing something *wrong*, not just doing something.
  *   If you think "disease" is just a human value judgment we slap on mechanics we don't like, then Causal-Role is fine.

  ---

  ### 4. The Hybrid Option (Gluing them together)

  You asked: *Is there a third option where you glue the two together?*

  Yes, this is called **Pluralism** or a **Dual-Concept Account**. Many modern philosophers (like Justin Garson or Christopher Boorse, to an extent) argue that "function" is ambiguous in English, just like the word "bank" (river bank vs. money bank).

  *   **How it works:** You admit there are two concepts.
      1.  **Proper Function (Etiological):** Used when talking about evolution, adaptation, and malfunction (e.g., "The heart is *for* pumping").
      2.  **Capacity/Role Function (Causal-Role):** Used when talking about physiology and mechanisms (e.g., "In this specific experiment, the heart is acting as a paperweight").
  *   **Is it cheating?**
      *   **Critics say:** It's an escape hatch. Science usually wants one unified definition. If you say "it depends on what you mean," you aren't solving the problem, you're just labeling the confusion.
      *   **Supporters say:** It's honest. Biologists use the word in both ways depending on the sub-field. Evolutionary biologists talk history; physiologists talk mechanics. A good philosophy should reflect actual scientific practice.

  ### Summary for your paper

  If I were writing this, here is the angle I'd take:

  1.  **Acknowledge the Teacher:** Your teacher isn't wrong practically. In 95% of cases, history and current role align (hearts were selected to pump and they do pump).
  2.  **The Stakes:** The disagreement only matters in edge cases (evolutionary transitions, new mutations, philosophical zombies).
  3.  **The Verdict:**
      *   If your paper is about **evolution**, the Etiological view wins (it explains adaptation).
      *   If your paper is about **physiology/mechanisms**, the Causal-Role view wins (it explains how the system works).
      *   If your paper is about **medicine/disease**, the Etiological view is usually required to define "malfunction."
  4.  **Recommendation:** Argue for the **Pluralist** view. Don't try to force one definition to rule them all. Argue that "function" is a tool, and biologists use different tools for different jobs. The "mess" your cousin talked about isn't a bug in philosophy; it's a feature of how complex biology is.

  **One final tip:** When you write about the "Swampman" frog (Case 3), mention that this shows the Etiological theory is committed to the idea that **intrinsic properties don't determine function.** Two identical things can have different functions solely because of their different histories. That is a wild philosophical claim that will definitely get your professor's attention.
