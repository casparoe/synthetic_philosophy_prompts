prompt: |-
  I have read rationalist blogs for long enough to have absorbed one suspicion in particular: when a procedure needs to know who counts, and the answer is that whoever counts decides who counts, the procedure has smuggled its conclusion in at step zero. The boundary problem is that suspicion in its purest form, and until this year I was content to enjoy it from a safe distance.

  I now chair the registration appeals panel of a newly created combined authority: a city-region with a directly elected mayor, a standing citizens' assembly with a capital budget of its own, and, since April, a registrar of members. The registrar's initial policy is to inherit the parliamentary register, which nobody defends and everybody uses. We sit weekly, hear about forty written appeals a month, and must dispose of each in half an hour on the papers; three of us decide (myself, a solicitor, a lay member drawn by lot), a precedent binds us for a decade unless we overturn it unanimously, and everything we do has to survive judicial review and a hostile local paper. The assembly has asked for a general procedure rather than case-by-case improvisation. Please write it: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it must hand the matter to the assembly because the question is one of values rather than facts.

  Three commitments I want the procedure to take seriously, because each is where I think the usual treatments cheat. First, the franchise is not one thing. Being counted in the constituency, voting, standing for office, petitioning, triggering a referendum, having standing to challenge a decision, being taxed, and being bound are separable incidents; a test that is defensible for one may be indefensible for another. Build the procedure incident by incident, and say where one test can honestly serve several. Second, two principles are in play and they disagree: the affected-interests principle, on which anyone whose interests are significantly affected by a decision has a claim to a proportionate say, and the subjected-persons principle, on which only those bound by the authority's rules have a claim to make them. Say which principle each step is using, and what we are to do when they conflict at the level of the answer we give an appellant, not in the abstract. Third, I have a half-formed test I would like you either to operationalise or to kill: give the vote to whoever bears the residual risk of the decision going wrong, the party left holding the loss once the specific beneficiaries have been paid. It has the pleasing property of tracking who actually pays for a mistake. I suspect it also hands the vote to landlords and creditors and takes it from the transient poor, which I will accept if it is right and not otherwise. Tell me whether it survives contact with the cases, and if it does, where it enters the procedure.

  The cases that keep arriving, which the procedure must handle without special pleading:

  - a man with a British passport who has not lived in the region for twenty-two years, pays no local tax, owns a flat here which he lets out, and votes in national elections;
  - a woman who has lived and worked here for fourteen years, pays council tax, has two children in local schools, and holds a visa with no route to settlement;
  - commuters from the neighbouring district who use the region's hospitals and trains, are governed elsewhere, and whose council has asked to be represented;
  - a sixteen-year-old who turns eighteen before the assembly's term ends;
  - an adult under guardianship whose capacity her brother disputes;
  - a developer who owns about a third of the land in one ward and lives abroad;
  - the people who will be born here during the decade over which the assembly is issuing debt;
  - an association of former residents who have moved away but still own property and meet once a year.

  Run the procedure on three of these, at least one where the answer will annoy me, and finish by telling me what the procedure cannot do and where I should stop pretending it is one. I do not need a survey of the literature; I have read enough of it to know that the honest answer is a procedure with the value judgements left visible.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a registration appeals panel for a new combined authority (city-region).
      *   **Context:** Directly elected mayor, citizens' assembly with capital budget, registrar of members. Inheriting parliamentary register (flawed but used). 40 appeals/month, 30 mins/case, 3-person panel (Chair, Solicitor, Lay Member). Precedent binds for 10 years. Judicial review (JR) risk. Hostile local press.
      *   **Task:** Write a general procedure for determining membership/franchise eligibility.
      *   **Specific Requirements:**
          1.  Questions in order, sufficient answers, stop points (No), hand-off points (Values vs. Facts).
          2.  **Commitment 1:** Franchise is not one thing (incidents: voting, standing, petitioning, taxing, binding, etc.). Build incident by incident.
          3.  **Commitment 2:** Two conflicting principles: *Affected Interests* vs. *Subjected Persons*. Explicitly state which is used at each step and how to resolve conflicts.
          4.  **Commitment 3:** Operationalize or kill the "Residual Risk Bearer" test (who bears the loss if the decision goes wrong). Address the bias concern (landlords/creditors vs. transient poor).
          5.  **Case Studies:** Run the procedure on three specific cases from the provided list (at least one annoying result).
          6.  **Conclusion:** What the procedure *cannot* do and where the pretense of neutrality ends.
      *   **Tone:** Rationalist, precise, honest about value judgments, avoiding "smuggled conclusions." No literature survey.

  2.  **Deconstruct the Core Tensions:**

      *   *Boundary Problem:* Who decides who counts? The procedure must acknowledge this recursion without collapsing.
      *   *Incidents of Franchise:* Voting is different from paying tax is different from standing for office. A single "membership" status might be too blunt.
      *   *Principles:*
          *   *Affected Interests:* Broad, inclusive, hard to bound (everyone is affected by everything eventually).
          *   *Subjected Persons:* Narrower, legalistic, based on coercion/jurisdiction.
      *   *Residual Risk:* Who pays for mistakes? This is an economic/liability test. It tends to favor capital owners. The prompt asks to be honest about this, not to fix it morally if it's factually correct.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a flowchart in text form. Step-by-step.
      *   *Step 1: Jurisdiction/Subjecthood.* Are they legally subject to the authority? (Subjected Persons Principle). If no, hard stop for binding decisions/voting, maybe open for petitioning.
      *   *Step 2: Residence/Presence.* Physical connection. (Hybrid).
      *   *Step 3: Interest/Affect.* Are they significantly affected? (Affected Interests Principle).
      *   *Step 4: Residual Risk.* Who bears the downside? (Risk Principle).
      *   *Differentiation:* The procedure needs to branch based on the *incident* (Voting vs. Tax vs. Standing).
      *   *Value Hand-off:* Where do we stop deciding and ask the Assembly? When the principles contradict irreconcilably.

      *Refining the "Residual Risk" Test:*
      *   Does it survive contact? In local government, debt is repaid via tax. If a capital project fails, who pays? Usually current and future taxpayers. Landlords benefit from capital improvements (property value up) but also bear risk if the area declines. Tenants bear risk of rent hikes to service debt but have no equity.
      *   *Correction:* The prompt suggests this test might favor landlords/creditors. If the authority issues debt for infrastructure, the "residual risk" of default falls on taxpayers (subjected persons). But the *benefit* risk (will this road actually help?) falls on users.
      *   *Decision:* I will operationalize it but limit it to *financial* incidents (budget approval, debt issuance) rather than general voting, to mitigate the "landlord rule" risk in social policy. Or, I must acknowledge that for capital budget decisions, capital stakeholders *should* have more say if we follow this logic honestly. Let's try to fit it as a weighting factor for specific financial incidents.

      *Refining the "Incidents":*
      *   Let's define three tiers of membership:
          1.  **Subject:** Bound by rules, liable for tax. (Subjected Persons)
          2.  **Stakeholder:** Affected by decisions, bears risk. (Affected Interests + Residual Risk)
          3.  **Member:** Full voting rights/standing. (Intersection of Subject + Stakeholder).

  4.  **Developing the Steps (The "Algorithm"):**

      *   *Preamble:* Acknowledge the recursion. The Panel interprets the Assembly's will, but the Assembly is defined by the Panel. We minimize this by anchoring in statute (Subjected) first.
      *   *Incident Selection:* The appellant must specify what right they want (Vote, Stand, Petition, Exemption).
      *   *Step 1 (The Subjected Test):* Are they liable for the authority's coercive power (tax, bylaws)? *Principle: Subjected Persons.*
      *   *Step 2 (The Interest Test):* Is the impact direct and significant, not speculative? *Principle: Affected Interests.*
      *   *Step 3 (The Risk Test):* If the decision fails financially or socially, who absorbs the loss? *Principle: Residual Risk.*
      *   *Step 4 (The Conflict Check):* If Step 1 says No but Step 2/3 say Yes -> Hand off to Assembly for policy change. If Step 1 says Yes but Step 2/3 say No -> Grant basic rights (tax liability implies representation) but limit influence.

  5.  **Selecting the Case Studies:**

      *   *Case A (The Expat Landlord):* British passport, lives away 22 years, owns flat, pays no local tax (maybe business rates? or council tax if empty?). *Prediction:* Fails Subjected (no residence), Passes Risk (property value). *Result:* Annoying. Gets to vote on capital budget? Or no vote at all? Let's make it annoying: Gets to petition, no vote.
      *   *Case B (The Non-Citizen Resident):* 14 years, works, kids, visa no settlement. *Prediction:* Passes Subjected (pays tax, bound by laws), Passes Interest. *Result:* Full membership.
      *   *Case C (The Future Generation):* People born during debt term. *Prediction:* Fails Subjected (don't exist), Passes Risk (inherit debt). *Result:* Hand off to Assembly (guardianship model).

      *Wait, I need to make sure one annoys the Chair.* The prompt implies the Chair suspects the Risk test favors landlords. If I apply the Risk test honestly, the Expat Landlord *should* get a say on capital budgets. That will annoy a democratic purist. Let's use that.
      *   *Selection:*
          1.  The Expat Landlord (Tests Residual Risk vs. Subjected).
          2.  The Non-Citizen Resident (Tests Subjected vs. Nationality).
          3.  The Future Generation (Tests the limits of the procedure entirely).

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the "Step Zero" problem. State that this procedure makes the value judgments explicit rather than hiding them.
      *   **The Incidents:** Define the rights (Voting, Standing, Petitioning, Liability).
      *   **The Procedure (The Flowchart):**
          *   Q1: Which incident?
          *   Q2: Subjected? (Coercion/Tax).
          *   Q3: Affected? (Directness).
          *   Q4: Residual Risk? (Who pays for failure).
          *   Decision Matrix.
      *   **The Conflict Resolution:** When principles clash.
      *   **Case Applications:** Run the three selected cases.
      *   **Limitations:** Where the procedure fails (the "Step Zero" admission).

  7.  **Refining the "Residual Risk" Operationalization:**

      *   To avoid simply giving landlords dictatorial power, I need to define "Residual Risk" carefully. It's not just "owns asset." It's "bears the loss *after* insurance/contracts."
      *   For a capital budget: If the project fails, does the property value drop? Yes. Do rents drop? Maybe. Does the taxpayer pay the debt service? Yes.
      *   *Honest Conclusion:* The Risk test *does* favor capital owners on capital issues. I must admit this. I will assign the Risk Test primarily to *Capital Budget* decisions (since the Assembly has a capital budget) and the Subjected Test to *Operating/Regulatory* decisions. This splits the franchise based on the *type* of power being exercised. This honors Commitment 1 (Franchise is not one thing).

  8.  **Final Review against Constraints:**

      *   *Questions in order?* Yes.
      *   *Sufficient answers?* Yes.
      *   *Stop/Hand-off points?* Yes.
      *   *Commitment 1 (Incidents)?* Integrated into Step 1.
      *   *Commitment 2 (Principles)?* Labeled at each step.
      *   *Commitment 3 (Risk Test)?* Operationalized and critiqued.
      *   *Three Cases?* Expat, Non-Citizen, Future.
      *   *One Annoying Result?* Expat gets capital vote (or similar).
      *   *Conclusion on Limitations?* Yes.

  9.  **Writing the Voice:**

      *   Needs to be crisp, administrative but philosophical. "Rationalist blog" style but applied to bureaucracy. No fluff. Acknowledge the political danger (hostile press).

      *(Self-Correction during drafting)*: I initially thought about giving the Expat a vote. That might be legally impossible under UK law (local gov franchise is usually residence-based). The prompt says "Combined Authority" and "Registrar of Members." This sounds like a new statutory body. I have some flexibility, but JR risk is high. I must ground the "Subjected" test in legal liability to avoid immediate JR overturn. The Expat *doesn't* pay council tax if he doesn't live there (maybe business rates?). If he pays no tax, the Subjected test fails. The Risk test says he has interest.
      *   *Adjustment:* To make the Risk test work without breaking the law, I will assign him "Stakeholder Status" (right to be consulted on capital projects) but not "Member Status" (vote). This acknowledges the Risk without violating the Subjected principle for binding votes. Wait, the prompt asks me to operationalize the test *or kill it*. If I dilute it, I'm cheating. If I follow it, he gets a vote.
      *   *Better approach:* The prompt asks me to be honest. If the Risk test says he should vote on capital issues, I should say that. But I must flag the JR risk. I will structure the "Incidents" so that "Capital Voting" is separate from "General Voting." This allows the Expat to vote on the Capital Budget (where his risk lies) but not the Mayor (where his subjection lies). This is bold but fits the "Franchise is not one thing" commitment.

      *(Refining the Future Generation case)*: This is the hard stop. You can't register the unborn. This is where the procedure hands off to the Assembly to appoint guardians.

      *(Refining the Non-Citizen case)*: This should be straightforward under "Subjected," but politically sensitive. I need to ensure the procedure protects them against the "hostile local paper."

  10. **Final Polish:** Check the tone. Ensure the "Step Zero" suspicion is addressed in the conclusion. Ensure the distinction between Facts and Values is clear.

      *(One last check on the Risk Test)*: "Give the vote to whoever bears the residual risk." If the authority defaults, the taxpayers pay. The landlord loses property value. Who bears *more* risk? Usually the taxpayer is the residual claimant on public debt. The landlord is a residual claimant on *local economic health*. I need to be precise. The Assembly has a *capital budget*. If a capital project fails (white elephant), who loses? The taxpayers service the debt. The landlord suffers blight. Both bear risk. I will define Residual Risk as "Liability for Debt Service + Uninsurable Loss." This keeps it mostly with the Subjected (taxpayers) but acknowledges the Landlord's exposure to *planning* decisions.
      *Actually, let's look at the prompt's hint:* "I suspect it also hands the vote to landlords and creditors... which I will accept if it is right." Okay, I should accept the implication. If the logic holds, the landlord gets a say. I will grant the landlord a vote on *Capital Allocation* specifically. This is the "annoying" result.

      *Wait, one constraint:* "The registrar's initial policy is to inherit the parliamentary register." Parliamentary register is residence-based. I am writing an *appeals* procedure. I can expand rights, but can I contract them? I can define *additional* rights. I will frame the "Capital Vote" as an additional incident, not a replacement for the parliamentary baseline, to minimize JR risk.

      *Let's write.*
answer: |-
  # Procedure for Determining Membership Incidents (PDMI)
  **Version 1.0 | Registration Appeals Panel**

  ## Preamble: The Step Zero Acknowledgement
  This procedure does not solve the boundary problem. It manages it. We acknowledge that the Panel defines the Assembly that oversees the Panel. To prevent circularity from becoming arbitrariness, we anchor the initial boundary in statutory liability (who *must* comply) and expand outward only where specific incidents of power justify it. Value judgments are not hidden; they are recorded as findings of fact regarding the nature of the authority's power.

  ## Part I: The Incidents of Membership
  The franchise is not a binary switch. An appellant must specify which incident they seek. The Panel assesses each incident separately.
  1.  **Liability:** Obligation to pay tax/levy and obey bylaws.
  2.  **Protection:** Right to access services and police protection.
  3.  **Voice:** Right to petition and be consulted.
  4.  **Vote (Operational):** Right to vote on revenue budget and regulatory bylaws.
  5.  **Vote (Capital):** Right to vote on capital budget, debt issuance, and long-term infrastructure.
  6.  **Standing:** Right to hold office or challenge decisions in court.

  ## Part II: The Decision Procedure
  For each incident requested, the Panel must ask the following questions in order. A "No" stops the process for that incident unless a Hand-Off is triggered.

  ### Step 1: The Subjected Test
  **Question:** Is the appellant legally liable to the coercive power of this Authority (taxation, bylaws, zoning) for the duration of the decision's effect?
  **Principle:** *Subjected Persons.* (Those bound by the rule must make the rule).
  **Sufficient Answer:** Yes, if statute or contract imposes a direct liability enforceable by this Authority.
  **Stop Condition:** If **No**, the appellant cannot be granted **Liability**, **Vote (Operational)**, or **Standing**.
  **Note:** This step prevents the franchise from expanding to everyone affected by the weather. It anchors the polity in legal coercion.

  ### Step 2: The Affected Interest Test
  **Question:** Will the decision affect the appellant's interests directly, significantly, and distinctively from the general public?
  **Principle:** *Affected Interests.* (Those impacted deserve a say).
  **Sufficient Answer:** Yes, if the impact is measurable (financial, physical, legal) and not speculative.
  **Stop Condition:** If **No**, the appellant cannot be granted **Voice** or **Vote (Capital)**.
  **Conflict Check:** If Step 1 is **No** but Step 2 is **Yes**, proceed to Hand-Off A.

  ### Step 3: The Residual Risk Test
  **Question:** If this decision fails (financially or functionally), who bears the uninsured loss after specific beneficiaries are paid?
  **Principle:** *Residual Risk Bearer.* (Those who pay for mistakes should control the risk).
  **Sufficient Answer:** The party whose assets or income are the default source of repayment or who suffers uncontracted depreciation.
  **Stop Condition:** If **No** (i.e., they are hedged or insured), they cannot be granted **Vote (Capital)**.
  **Conflict Check:** If Step 1 is **No** but Step 3 is **Yes**, proceed to Hand-Off B.

  ### Part III: Hand-Offs (Values vs. Facts)
  The Panel decides facts; the Assembly decides values. When principles conflict, we do not adjudicate; we refer.

  **Hand-Off A (Interest without Subjection):**
  *   *Scenario:* Appellant is significantly affected but not legally subject (e.g., neighbours in a neighbouring district).
  *   *Action:* Grant **Voice** (consultation rights) automatically. Refer **Vote** request to the Assembly.
  *   *Reasoning:* Extending voting rights to non-subjects dilutes the Subjected Principle. This is a political trade-off the Assembly must authorize.

  **Hand-Off B (Risk without Subjection):**
  *   *Scenario:* Appellant bears residual risk but is not legally subject (e.g., distant creditors, absentee landlords).
  *   *Action:* Grant **Vote (Capital)** provisionally. Refer to Assembly for ratification.
  *   *Reasoning:* This operationalizes the Residual Risk Test. It acknowledges that capital providers (including property owners) bear the downside of infrastructure failure. This will likely conflict with democratic norms of "one person, one vote." The Assembly must decide if efficiency/risk-allocation trumps residence-based equality.

  **Hand-Off C (The Future):**
  *   *Scenario:* Appellant does not exist yet but will bear risk/interest (e.g., future taxpayers).
  *   *Action:* Deny individual registration. Refer to Assembly to appoint a *Guardian for Future Generations* with veto power on debt exceeding 10 years.
  *   *Reasoning:* Procedure cannot register null-sets. Representation must be institutional, not individual.

  ---

  ## Part IV: Application to Cases

  ### Case 1: The Absentee Landlord
  *British passport, lives abroad 22 years, owns flat here, pays no local tax (empty or business rates paid by agent), votes nationally.*
  *Requested Incident:* Vote (Operational) and Vote (Capital).

  **Step 1 (Subjected):** **No.** He pays no council tax (not resident) and business rates are a national levy collected locally. He is not bound by local bylaws regarding residence.
  **Step 2 (Affected):** **Yes.** Property value is tied to local amenities.
  **Step 3 (Residual Risk):** **Yes.** If the Authority issues debt for a transport link that fails, his asset value depreciates. He is a residual claimant on local economic health.

  **Decision:**
  *   **Vote (Operational):** **Denied.** (Fails Step 1). He cannot vote for the Mayor or on bylaws he does not obey.
  *   **Vote (Capital):** **Hand-Off B.** The procedure recommends granting a vote on capital budget allocation only.
  *   **Outcome:** The Panel recommends he be registered as a *Capital Stakeholder*. He receives ballots for infrastructure bond measures and capital budget approvals, but not for general elections.
  *   **Why this annoys you:** It explicitly grants political power based on property ownership, validating the suspicion that the Risk Test favours creditors. It is honest about the trade-off: if we want people to pay for mistakes, they must choose the risks.

  ### Case 2: The Non-Settled Resident
  *Lived/worked here 14 years, pays council tax, children in schools, visa with no route to settlement.*
  *Requested Incident:* Full Membership (Vote, Standing, Liability).

  **Step 1 (Subjected):** **Yes.** She pays council tax and is bound by all local bylaws and policing. Her visa status is a national matter, not local.
  **Step 2 (Affected):** **Yes.** Direct impact on children's education and local services.
  **Step 3 (Residual Risk):** **Yes.** She pays tax that services debt; if the Authority fails, she loses services and pays higher taxes elsewhere.

  **Decision:**
  *   **All Incidents:** **Granted.**
  *   **Reasoning:** The Subjected Principle is absolute here. To tax her without representation is administrative tyranny. Her national immigration status is irrelevant to local subjection. The procedure protects her against the "hostile local paper" by framing this as a legal necessity of the Subjected Principle, not a moral favour.

  ### Case 3: The Future Generation
  *People born during the decade of debt issuance.*
  *Requested Incident:* Standing to challenge debt.

  **Step 1 (Subjected):** **No.** They do not exist.
  **Step 2 (Affected):** **Yes.** They will inherit the debt/service burden.
  **Step 3 (Residual Risk):** **Yes.** They are the ultimate residual risk bearers for long-term debt.

  **Decision:**
  *   **Registration:** **Denied.** (Procedure cannot process non-entities).
  *   **Action:** **Hand-Off C.** The Panel refers to the Assembly the requirement to appoint an independent *Guardian for Future Generations*. This Guardian must have standing to challenge debt issuance in court.
  *   **Reasoning:** We cannot register the unborn, but the Risk Test demands their interest be represented. We substitute individual franchise with institutional guardianship.

  ---

  ## Part V: Limitations and The Pretense of Neutrality

  You asked where the procedure cannot go and where you should stop pretending it is one.

  **1. The Recursion Remains**
  This procedure does not solve "who decides who counts." It merely shifts the recursion. The Panel interprets "Subjected" and "Residual Risk." A hostile court could rule our interpretation of "Subjected" is too narrow or broad. We are not a machine; we are a political actor wearing a flowchart. When we designate the Absentee Landlord a *Capital Stakeholder*, we are making a value judgment that property rights outweigh residence norms in specific contexts. The flowchart hides the weight of that choice, not the choice itself.

  **2. The Conflict of Principles is Irreconcilable**
  Commitment 2 asked me to say what to do when *Subjected* and *Affected* conflict. The procedure hands this off to the Assembly. This is the honest admission: **The Panel cannot resolve the boundary problem; it can only locate it.** By sending Hand-Off B (The Landlord) to the Assembly, we force the elected body to take responsibility for the oligarchic implications of the Residual Risk Test. If they reject it, they are rejecting the logic that risk-bearers should control risk. If they accept it, they own the consequence.

  **3. The Residual Risk Test is Dangerous**
  You asked me to operationalize or kill the Risk Test. I have operationalized it, but I must warn you: **It is incompatible with universal suffrage.** If followed consistently, it concentrates power in those with assets to lose (landlords, creditors, long-term taxpayers) and disenfranchises those with nothing to lose (the transient poor, tenants, the unemployed). In Case 1, it grants a vote based on equity. In a crisis, this procedure logically suggests stripping the vote from those who pay no tax and bear no asset risk.
  *Recommendation:* Confine the Residual Risk Test strictly to **Capital Budgets** (infrastructure/debt). Do not let it bleed into **Operational Votes** (social policy/welfare). If you let it bleed, you will have built a plutocracy and called it a procedure.

  **4. The Hostile Paper**
  The local paper will not care about the distinction between *Vote (Operational)* and *Vote (Capital)*. They will headline: "Panel Gives Foreign Landlords Vote."
  *Defense:* Do not defend the decision as "fair." Defend it as "mechanical." State: "The procedure requires that those who pay for failure must approve the risk. This is accounting, not ideology." It is a weak shield, but it is the only one that does not require lying.

  **Final Instruction:**
  Use this procedure to expose the contradictions, not to resolve them. When the Assembly complains that the boundary is messy, show them the Hand-Off log. The mess is not a bug in your administration; it is the true shape of the polity. Stop trying to clean it up.
