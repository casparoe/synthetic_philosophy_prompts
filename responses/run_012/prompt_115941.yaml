prompt: |-
  Ok so I need help with something and I think you're the right kind of person for it. I'm a machine learning engineer — I work on large language models day to day, and my background is in learning theory: PAC bounds, VC dimension, sample complexity, inductive biases, priors, regularization, that whole world. I've been reading about the poverty of the stimulus argument and universal grammar, and I keep feeling like I can *almost* translate the whole thing into my own vocabulary, and then something slips through my fingers. I want you to act as a philosopher of cognitive science who also actually knows learning theory cold, and do the translation for me properly.

  Here's the ask. Take the core Chomskyan position — that children converge on a specific grammar despite input that is sparse, degenerate, and comes with no negative evidence, and that this is supposed to force the conclusion that the space of possible grammars is tightly constrained in advance (universal grammar, principles and parameters, whatever flavor you like). Restate it, as faithfully as you can, entirely in the vocabulary I actually use: hypothesis classes, inductive bias, sample complexity, generalization bounds, priors over hypotheses, architecture, pretraining distributions, identifiability, underdetermination, regularization, capacity control. Claim by claim, not as a vibe.

  Then the residue report. That's the part I actually care about. For each piece of the original position: does it translate cleanly, translate only with distortion, or not translate at all? A few things I'm suspicious about and want you to take seriously:

  - Does "innate" survive at all, or does it just become "bias located somewhere in a hierarchy of priors" — in which case, was the innate/acquired line ever doing real work, or was it doing rhetorical work?
  - The "no negative evidence" premise looks almost trivial to me, since ML learns from positive data all the time. So does the arguement get weaker in translation, stay the same, or was that premise always doing something other than what my framing captures?
  - Chomsky's own resistance to calling any of this *learning* — his insistence on growth or maturation instead — does that have any counterpart in my vocabulary, or does my vocabulary simply presuppose the very thing he's denying?
  - Competence vs performance, and what the "stimulus" even is. Is it a distribution over utterances? Over form-meaning pairs? My framing needs that pinned down and I don't think theirs does.

  Where the residue is a defect of my framework, say so plainly. Where it's a sign the original claim was vaguer than it sounded, say that too. I dont need you to be polite about it.

  Ground rules: no citations, no reading list, no "see X, 1965" — I can't look anything up and I don't want you guessing at references. Just argue it out. Before you start the real translation, spend a few lines brainstorming the candidate mappings and flag which ones you expect to break, then do the actual work. Think carefully and don't smooth over the joints — I'd rather have three honest gaps than one tidy analogy. Close with a short paragraph on whether my instinct that this is all "just inductive bias" is basically right or is quietly missing something.
