      *   *Addressing Logical Omniscience:* Philosophers hate logical omniscience because it's psychologically unrealistic. The law hates it too, practically speaking, but adopts a *bounded* omniscience. You know what you *could* have known with reasonable effort. This is a "capacity-based" or "dispositional" view.
