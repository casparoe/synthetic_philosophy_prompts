      *   *Dispositional vs. Occurrent:* Occurrent = currently thinking about it. Dispositional = would believe it if prompted/investigated. Law leans heavily dispositional/normative.
      *   *Normative Epistemology:* "Ought to know" implies a duty. Knowledge becomes a status conferred by obligation fulfillment.
      *   *Closure Principles:* If you know P, and P implies Q, do you know Q? Law says "yes" if you *should* have inferred Q.
      *   *Internal Consistency:* Does willful blindness fit the same model as constructive notice? Willful blindness is closer to actual knowledge (subjective suspicion) than constructive notice (objective reasonable person).

  4.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the student's insight. It's a sharp observation. The law isn't doing descriptive epistemology; it's doing normative epistemology.
