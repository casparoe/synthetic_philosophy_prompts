prompt: |-
  I'm TAing an intro political theory course and I'm trying to grade a stack of short essays on Orwell. The question was about Orwell's account of the relationship between language and political thought in "Politics and the English Language." I've got one students answer here and I'm honestly not sure what grade to give it. Can you read it and give me a grade (like A-F or a percentage) plus specific comments? I want to know what they got right, what they got wrong, and what they missed. Be precise about where the reasoning breaks down. Don't just say "good job" or "needs work" -- I need line-by-line type feedback I can pass on. Here's the question and the answer:

  Question: In "Politics and the English Language," Orwell argues that language and political thought are connected. What exactly does he think the relationship is? Is it one-way or reciprocal? How do his examples and his proposed rules support his view? Write a short essay.

  Student answer: Orwell thinks that bad language leads to bad politics. He says that when language becomes vague and full of dying metaphors, it becomes easier for people to have foolish thoughts. He gives examples of political writing that uses euphemism and pretentious diction to obscure meaning, like calling the bombing of villages pacification. He then offers six rules for clear writing, such as never using a metaphor you're used to seeing in print, and never using a long word where a short one will do. The point of these rules is to force writers to think clearly, because if you can't say something clearly, you probably don't understand it. Orwell's view is essentially that political language is designed to make lies sound truthful and murder respectable, and that this is a one-way street: corrupt language corrupts thought, but clear language can't be corrupted by bad thought. He thinks that if we all followed his rules, we could fix politics. However, he also admits that language is a natural growth, not something we can fully control. So his view is that we should try to improve language anyway, because it's the best we can do.
reasoning: |-
  Here's a thinking process that leads to the suggested grading and feedback:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro political theory course.
      *   **Task:** Grade a short essay on Orwell's "Politics and the English Language."
      *   **Input:** The essay prompt and a student's answer.
      *   **Output Requirements:** A grade (A-F or %), specific comments (what's right, wrong, missed), precise identification of reasoning breakdowns, line-by-line type feedback suitable for passing on to the student. No vague praise/criticism.

  2.  **Analyze the Prompt:**
      *   **Core Question:** What is the relationship between language and political thought according to Orwell?
      *   **Specific Sub-questions:**
          *   Is it one-way or reciprocal?
          *   How do examples support the view?
          *   How do the proposed rules support the view?

  3.  **Analyze the Student Answer:**
      *   *Claim 1:* "Orwell thinks that bad language leads to bad politics." (True, but incomplete).
      *   *Claim 2:* "when language becomes vague... it becomes easier for people to have foolish thoughts." (True).
      *   *Claim 3:* Examples: euphemism, pretentious diction, "pacification." (Accurate references to the text).
      *   *Claim 4:* Rules: never using a metaphor..., never using a long word... (Accurate references).
      *   *Claim 5:* "The point of these rules is to force writers to think clearly..." (Good interpretation).
      *   *Claim 6:* "Orwell's view is essentially that... this is a one-way street: corrupt language corrupts thought, but clear language can't be corrupted by bad thought." (**CRITICAL ERROR**).
      *   *Claim 7:* "He thinks that if we all followed his rules, we could fix politics." (Oversimplification).
      *   *Claim 8:* "However, he also admits that language is a natural growth... So his view is that we should try to improve language anyway..." (Vague grasp of the conclusion).

  4.  **Evaluate against the Text ("Politics and the English Language"):**
      *   **The Core Thesis:** Orwell explicitly argues the relationship is *reciprocal* (cyclical). "Foolish thoughts make language ugly and inaccurate, and on the other hand, the slovenliness of our language makes it easier for us to have foolish thoughts."
      *   **The Student's Error:** The student explicitly calls it a "one-way street" in Claim 6. This contradicts the central thesis of the essay.
      *   **Nuance:** Orwell does argue that cleaning up language is a *starting point* for political regeneration, but he acknowledges the cycle. The student gets the "clean language helps thought" part right but misses the "bad thought creates bad language" part of the cycle, explicitly denying the reciprocity.
      *   **Examples/Rules:** The student identifies them correctly but doesn't deeply analyze *how* they support the reciprocal view (mostly because they missed the reciprocal view).
      *   **Conclusion:** The student captures the "natural growth" aspect but frames it as a resignation rather than a call to action within the cycle.

  5.  **Determine the Grade:**
      *   **Strengths:** Accurate summary of the rules, accurate identification of specific examples (pacification), understands the moral stakes (lies/murder).
      *   **Weaknesses:** Fundamental misunderstanding of the core theoretical mechanism (reciprocity vs. one-way). This is the main point of the prompt ("Is it one-way or reciprocal?").
      *   **Verdict:** It's a passing essay because it shows they read the text, but it fails the specific theoretical question. In an intro theory course, misunderstanding the core causal mechanism is significant.
      *   **Grade Range:** C+ to B-. Let's settle on a **C+ (77%)**. It's above average in terms of reading comprehension (they know what's in the essay) but below average on theoretical analysis (they got the main argument wrong).

  6.  **Draft the Feedback:**
      *   *Structure:* Grade, Summary, What You Got Right, What You Got Wrong (The Crucial Point), Line-by-Line/Section Feedback, Suggestions for Revision.
      *   *Tone:* Constructive, precise, academic but accessible (TA to student).
      *   *Specific Focus:* Highlight the "one-way vs. reciprocal" error.

  7.  **Refine the Feedback (Self-Correction during drafting):**
      *   *Initial thought:* Just say "You got the reciprocity wrong."
      *   *Correction:* Need to quote Orwell to prove it. "Foolish thoughts make language ugly..."
      *   *Initial thought:* Praise the summary of rules.
      *   *Correction:* Point out that the rules are a *response* to the cycle, not just a fix for one-way corruption.
      *   *Line-by-Line:* Break down the paragraph into logical beats.

  8.  **Final Review against Constraints:**
      *   Grade included? Yes.
      *   Specific comments? Yes.
      *   Right/Wrong/Missed? Yes.
      *   Precise reasoning breakdown? Yes.
      *   Line-by-line type feedback? Yes.

  9.  **Final Polish:** Ensure the distinction between "language affects thought" (student's view) and "language and thought affect each other" (Orwell's view) is crystal clear. (Proceed to generate output).

  *(Self-Correction Note on Grade)*: Is a C+ too harsh? They answered most parts of the prompt. But the prompt asks "Is it one-way or reciprocal?" and they answered "one-way." That is a direct contradiction of the text's most famous insight. In a political theory course, conceptual accuracy is paramount. A B- might be too generous. A C might be too harsh given they know the examples. C+ feels right. It signals "Good reading, bad analysis."

  *(Wait, let's look closer at the prompt requirements)*: "How do his examples and his proposed rules support his view?" The student lists them but doesn't explain the *support* mechanism well because their view of the view is wrong. This reinforces the C+ range.

  *(Final Decision)*: Grade: C+ (77%). Focus heavily on the reciprocity error.

  *(Drafting the response)*...
  *   Start with the grade.
  *   Breakdown: Strengths (textual knowledge), Weaknesses (theoretical core).
  *   Line-by-line annotation.
  *   Closing advice.

  *(Wait, one more check)*: Did Orwell say clear language *can't* be corrupted? The student says: "clear language can't be corrupted by bad thought." Orwell actually says the process is continuous. You have to keep cleaning it. The student implies a permanent fix ("if we all followed his rules, we could fix politics"). Orwell is more pessimistic/realistic. This is another nuance to catch.

