  4. The project succeeds if I can demonstrate that any endogenously generated aspiration level necessarily collapses back into an optimization procedure. It fails if I uncover a stable model of self-set satisficing that avoids this regress without relying on external delegation.

  5. I will dedicate the first four months to the formal argument and the remaining four to drafting, prioritizing the logical regress over historical exegesis to fit the 8-10k word limit. If the word count threatens to exceed the cap, I will cut the institutional case studies and retain only the formal conceptual analysis.
