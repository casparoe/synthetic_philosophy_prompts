  so I have to hand in a prospectus for my second-year paper in a couple of months (8-10k words, philosophical, no experiments, and I have about 8 months to write the thing) and I've got a half-formed idea I'd like you to turn into an actual plan. here it is, warts and all.

  everyone talks about satisficing as a fact about minds: we can't optimize, so we stop once something is good enough. but the bit that never gets pinned down is where the aspiration level comes from. if I set my own bar, and I'm allowed to think about which bar to set, then I'm just optimizing again, only now what I'm optimizing over is bars. so satisficing either collapses back into optimization or it needs an aspiration level I didn't choose. which makes me wonder whether satisficing is really a story about institutions and delegated standards rather than about cognition -- the hiring bar HR hands you, the treatment threshold in the guideline, the examiner's definition of a pass. and if that's right then maybe what's bounded isn't the mind, it's the accountability: satisficing is what you get when the person making the call isn't the person who owns the standard.

