answer: |-
  This is a sharp intuition, and running 1905 through Kantorowicz is a stress test the theory rarely undergoes. To see if it earns its keep, we must map the ontology of the crisis precisely before identifying where the metaphysics break down.

  **The Mapping**
  In the Kantorowiczian frame, Oscar II's **Body Natural** is the aging Bernadotte monarch who, exercising personal will and political judgment, refused to sanction the Consular Service law. This refusal was an act of infirmity or private will, distinct from the **Body Politic** of the Norwegian Crown, which, under the 1814 Constitution, could act only through responsible ministers. When the Michelsen cabinet resigned, they removed the bridge between the two bodies; the King's Natural Body remained, but his capacity to animate the Norwegian Body Politic was severed because there were no ministers to bear the responsibility. The Storting's declaration on 7 June did not kill the King; it declared that the Norwegian Body Politic could no longer inhabit Oscar's Natural Body. By importing Haakon VII, they did not create a new Body Politic but found a new Natural Body to house the existing, continuous Norwegian Crown. The "evaporation" you note is the fiction working perfectly: the blame for the veto slid entirely onto the ministers (who resigned), leaving the King's Natural Body unblamed but politically vacant, allowing the Body Politic to migrate without bloodshed.

  **The Pushback**
  However, three structural tensions suggest you may be redressing parliamentary sovereignty in medieval clothes.

  First, **the duality of polities.** Kantorowicz assumes *Unus Rex, Unum Regnum* (one king, one realm). Oscar II held two distinct Bodies Politic (Sweden and Norway) within one Body Natural. When Norway dissolved the union, the Norwegian Body Politic survived, but Oscar's Body Natural did not die. Kantorowicz's theory relies on the Body Politic passing to the heir upon the death of the Natural Body. Here, the Body Politic divorced the Natural Body while it was still breathing. This is not succession; it is amputation. The theory has no mechanism for a Body Politic to voluntarily eject a living Natural Body without collapsing into republicanism.

  Second, **the source of agency.** In *The King's Two Bodies*, the fiction protects the Crown from the frailties of the man. In 1905, the Storting weaponized the fiction against the man. By insisting the King could do no wrong (and thus could not veto without ministers), they rendered his Natural Body politically impotent. Kantorowicz explains how the King survives political attack; he does not explain how the Parliament acquires the metaphysical authority to decouple the bodies. The theory goes quiet on *who* holds the scalpel. In 1905, the scalpel was held by popular sovereignty disguised as constitutional interpretation, a concept alien to the Tudor jurisprudence Kantorowicz analyzes.

  Third, **exportability and legal culture.** You are right to worry about the Norwegian context. The 1814 Constitution's clause on the King's sacred person was a rationalist, Enlightenment-era device to ensure stability, not a mystical assertion of divine right. Norwegians were not thinking in terms of corpus mysticum; they were thinking in terms of contract and competence. Using Kantorowicz here risks imposing a theological depth on a procedural mechanism. If the Norwegians viewed the Crown as an office created by the Constitution rather than a transcendent body pre-existing it, then the "Body Politic" didn't survive the separation; the *Constitution* survived, and the Crown was merely an organ within it.

  **Where the Theory Goes Quiet**
  Kantorowicz cannot explain the legitimacy of the severance. His framework explains continuity across death, not continuity across deposition. It explains why the Crown never dies, but not why the Crown can choose its host. In 1905, the "quiet" nature of the revolution relies on the fiction that the King didn't lose power; he simply ceased to be the vessel for *this specific* Body Politic. Kantorowicz lacks the vocabulary for a Body Politic that is subordinate to a Constitution rather than identical with the Sovereign.

  Verdict: The 1905 dissolution is an anomaly the theory cannot absorb, as it demonstrates a body politic surgically severing a living body natural to ensure its own survival, inverting the fiction's intended function of dynastic continuity.
