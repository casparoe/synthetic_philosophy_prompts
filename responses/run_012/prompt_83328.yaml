          *   The Move: The Storting declares the Natural Body no longer houses the Norwegian Politic Body.
          *   The "Evaporation": The veto was an act of the Natural Body unsupported by Ministers (who carry the responsibility). Since the Politic Body acts only through Ministers, the veto was void *ab initio* in the political sphere.
      *   *The Pushback (Crucial):*
          *   *Duality of Polities:* Oscar had *two* politic bodies. Kantorowicz assumes unity. When Norway leaves, does Oscar's Politic Body shrink? Or does Norway take its Politic Body and find a new Natural one? The latter happened. This suggests the Politic Body is tied to the *Territory/Constitution*, not the Dynast. Kantorowicz ties it to the Blood/Dynast.
          *   *Agency:* In *The King's Two Bodies*, the fiction protects the King. In 1905, the fiction is weaponized *against* the King by the Parliament. The "King can do no wrong" becomes "The King can do nothing alone."
          *   *Cultural Export:* 1814 Constitution is rationalist, not mystical. The "sacred person" is a legal shield for stability, not a theological claim. Using Kantorowicz risks anachronism.
      *   *Where it goes quiet:* It cannot explain the *legitimacy of the severance*. Why did the Storting have the power to decapitate the Body Politic from the Natural? Kantorowicz explains continuity, not revolution (even quiet revolution).
      *   *Conclusion:* Synthesize the tension. It explains the *mechanism* of blame-shifting, but not the *source* of the power to dissolve.

      *   *Refining the Verdict:* Needs to be precise.
