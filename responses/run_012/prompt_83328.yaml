  3.  **Deconstruct the Theory (Kantorowicz's Two Bodies):**
      *   **Body Natural:** Mortal, fallible, individual will (Oscar the man).
      *   **Body Politic:** Immortal, incorporeal, embodies the Crown/State, cannot do wrong.
      *   **Function:** Allows continuity of authority despite human frailty; shifts blame to ministers (King can do no wrong).
      *   **Origin:** Medieval English jurisprudence, applied to early modern sovereignty.

  4.  **Map the Episode to the Theory:**
      *   *Who refused?* Oscar II's Body Natural (his personal will/political stance).
      *   *What was preserved?* The Norwegian Body Politic (the Crown of Norway, distinct from Sweden).
      *   *The Dissolution:* The Storting separates the Norwegian Body Politic from Oscar's Body Natural.
      *   *The "Evaporation":* Because the King's *political* body is bound by ministerial responsibility (Constitution of 1814), his *natural* body's refusal becomes legally null once ministers resign. The fiction allows the State to continue without the Man.

  5.  **Critique/Push Back (The "Disciplined" Part):**
      *   *One Realm vs. Two:* Kantorowicz assumes one King = one Body Politic. Here, Oscar holds *two* Bodies Politic (Sweden and Norway) in one Body Natural. This is a personal union, not a incorporation. The theory struggles with a split Body Politic.
      *   *Exportability:* Kantorowicz is English/Tudor. Norway 1814 is post-Enlightenment, written constitution. The "sacred person" clause is there, but is it the *same* metaphysical fiction? Or is it just parliamentary sovereignty wearing a crown?
      *   *Where the theory goes quiet:* It doesn't explain *who* severs the bond. In Tudor theory, the King's death severs it naturally. Here, the Parliament severs it politically. Kantorowicz doesn't account for a Body Politic firing its Body Natural.
      *   *Legal Culture:* Norwegians viewed this as constitutional law, not mystical theology. Using Kantorowicz might impose a metaphysical depth they didn't feel.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the query. Validate the intuition that 1905 looks like a "surgical separation."
