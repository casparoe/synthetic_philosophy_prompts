answer: |-
  The most dangerous objection is from the economists claiming the "indexed floor" is operationally undefined for Integrated Assessment Models (IAMs), rendering the view useless for climate policy; your single reply must be that the floor functions as a hard constraint in optimization models similar to safety standards or carbon budgets, not as a welfare metric to be maximized.

  ### Q&A Prep Sheet

  **1. The Economists (Likelihood: Very High | Damage: High to Policy Claim)**
  *   **Objection:** "You claim this is action-guiding, but 'institutional capacity' is not a parameter we can calibrate in an IAM. If the floor shifts with technology, how do we avoid a moving target where increased capacity raises the floor faster than welfare grows? Without a fixed function, this is just a qualitative heuristic, not a model input."
  *   **Concede:** You cannot give them a specific coefficient today; admit the indexing requires further operationalization work alongside modelers.
  *   **Hold:** The view provides the *structure* for the constraint, even if the specific parameterization is future work.
  *   **2-Minute Reply:** "Treat the floor like the 2°C temperature target or a capital adequacy ratio: it is a boundary condition for permissible solutions, not a variable in the objective function. We model 'capacity' proxies now (e.g., GDP per capita, governance indices); the floor scales with these. The concavity function acts like a risk-aversion parameter on population size, which is already standard in uncertainty modeling. You don't need perfect precision to constrain the solution space away from repugnant outcomes."
  *   **Soft Spot:** You lack a formula for the indexing. If they press on how to prevent the floor from rising so fast that no future population is permissible, you risk admitting the view could imply anti-natalism in high-capacity worlds.
  *   **Contested vs. Settled:** It is **contested** whether ethical constraints need precise parameterization to be policy-relevant (some argue qualitative guardrails suffice); it is **settled** that IAMs require explicit functional forms to run.

  **2. The Total Utilitarian Longtermist (Likelihood: High | Damage: High to Theoretical Coherence)**
  *   **Objection:** "Your concavity function looks like an ad hoc fix to avoid the Repugnant Conclusion without independent axiological justification. If the marginal value of a life declines with population size, doesn't this collapse into Average Utilitarianism in the limit? And if not, why should we sacrifice total expected welfare for a structural preference for smaller populations?"
  *   **Concede:** You are sacrificing total sum maximization; acknowledge this is a feature, not a bug, of blocking the Repugnant Conclusion.
  *   **Hold:** Concavity applies to the *number* of lives, not the welfare per life, which distinguishes it from Average Utilitarianism (AU).
  *   **2-Minute Reply:** "Average Utilitarianism penalizes adding happy lives if they are below the current average; my view permits adding happy lives as long as they are above the floor, even if total average welfare drops. The concavity reflects diminishing moral significance of *existence itself* as density increases, not diminishing value of welfare. This preserves the intuition that large future populations are good if well-off, without requiring infinite expansion regardless of quality. The justification is reflective equilibrium: we reject the Repugnant Conclusion, and this is the minimal deviation from Total Utilitarianism required to do so."
  *   **Soft Spot:** Justifying the specific curvature. If they ask "Why this rate of decline?", you risk sounding arbitrary. Also, longtermists often deny the Repugnant Conclusion is repugnant; do not argue this as **settled**, but as a divergent intuition.
  *   **Contested vs. Settled:** It is **contested** whether the Repugnant Conclusion is actually false (longtermists often accept it); it is **contested** whether concavity views collapse into AU (depends on the function).

  **3. The Prioritarian (Likelihood: Medium | Damage: Medium)**
  *   **Objection:** "Your floor is 'minimal-decent,' which sounds too low. If we allow lives just above this threshold in vast numbers, aren't you licensing huge inequalities and aggregating small harms against the worst-off? Prioritarianism says we should weight benefits to the worse off more heavily, but your concavity focuses on population size."
  *   **Concede:** The floor is a minimum, not an optimal target; admit the view does not solve all distributive justice issues.
  *   **Hold:** The view is designed for *population axiology* (who to bring into existence), not solely *distributive justice* (how to treat existing people).
  *   **2-Minute Reply:** "Prioritarianism applies primarily to existing persons; my view addresses the non-identity problem of future generations. The floor prevents catastrophic lives (suffering below decency); concavity prevents overpopulation that dilutes resources below that floor. We can combine this view with prioritarian distribution for existing people. The concavity ensures we don't trade massive population growth for marginal welfare gains that would threaten the floor for the vulnerable."
  *   **Soft Spot:** If they press that concavity allows sacrificing the welfare of the future poor for the sake of limiting population size, you may struggle to distinguish this from elitism.
  *   **Contested vs. Settled:** It is **contested** whether prioritarianism applies to potential people; it is **settled** that the non-identity problem complicates standard distributive views.

  **4. The Kantian Deontologist (Likelihood: Low | Damage: Low to Medium)**
  *   **Objection:** "Your 'necessary to prevent larger number' clause treats persons as replaceable units. If you allow bringing people below the floor to save others, you are using them as mere means. Consequentialist population reasoning is inherently incompatible with respect for persons."
  *   **Concede:** Pure deontology struggles with non-identity cases where actions affect who exists.
  *   **Hold:** The floor is a deontological-style side constraint; the utilitarian trade-off only applies *above* the floor or in catastrophic prevention.
  *   **2-Minute Reply:** "The floor itself is a deontological constraint: we generally must not create lives below decency. The exception is catastrophic prevention, which aligns with threshold deontology. Unlike pure utilitarianism, I do not allow trading off existing people's rights for total welfare. This view hybridizes deontological constraints on creation with consequentialist reasoning about scale."
  *   **Soft Spot:** The "necessary to prevent" clause is utilitarian. If they press on whether a person created below the floor is being "used," you have no non-consequentialist answer.
  *   **Contested vs. Settled:** It is **contested** whether non-identity cases require consequentialist reasoning; it is **settled** that standard Kantianism struggles with future persons who owe their existence to the violation.

  ### The Feared Question
  **"If concavity reduces the value of adding lives as population grows, does there come a point where adding a very happy person is *negative* value? If yes, you imply the 'Sadist Conclusion' (better no one exist than too many happy people). If no, you fail to block the Repugnant Conclusion."**

  *   **Why Fear It:** This is the standard technical knockout for critical-level or concavity views. If you answer "Yes," you look misanthropic (valuing emptiness over happy lives). If you answer "No," the Total Utilitarian argues you haven't actually blocked the Repugnant Conclusion, because enough happy lives will always outweigh few very happy lives.
  *   **Preparation:** You must argue the value asymptotes at zero, never goes negative. Adding a happy life is always *good*, just *less good* as density increases. This blocks RC (because the sum converges) without implying empty worlds are better.
  *   **Risk:** Mathematicians/Economists will ask to see the convergence proof. If your function doesn't converge, you lose.

  ### Flagged Objections (Do Not Engage Deeply)
  *   **"The Repugnant Conclusion isn't repugnant."** (Likely from the Longtermist). Do not fight this intuition war. Acknowledge it as a fundamental axiological divergence. Say: "If you accept the Repugnant Conclusion, my view is unnecessary for you, but most policymakers and ethicists seek to avoid it."
  *   **"Discounting the future is morally wrong."** (Likely from Philosophers). This is an objection to climate economics generally, not your view. Defer to the economists: "My view is compatible with various discount rates; it constrains the *population* variable, not the *time* variable."
