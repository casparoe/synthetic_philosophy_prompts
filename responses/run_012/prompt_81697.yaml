      *   **Positions:**
          *   Ada: Halfer/SSA-ish. Coin is 50/50. Finding yourself here tells you nothing. Buttons are a wash (expected value 0).
          *   Bo: Thirder/SIA-ish. You are much more likely to be you if Tails (trillion chances vs 1). Confidence should be trillion-to-1 for Tails. Press Blue.
      *   **Requirements:**
          *   Write a dialogue.
          *   No preamble.
          *   Don't strawman either.
          *   Ada needs a real reply to "trillion chances".
          *   Bo needs a real reply to "you were always going to be you".
          *   Discuss the meaning of "confidence" (credence vs. frequency vs. betting odds).
