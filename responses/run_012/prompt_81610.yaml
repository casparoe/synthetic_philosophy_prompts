          *   Identify the most natural reading of the oath.
          *   Specify what would change the mind about the best reconstruction and where it fails.

  2.  **Deconstruct the Oath:**
      *   "The Truth": Usually means don't say what is false.
      *   "The Whole Truth": Usually means don't leave out relevant context (omission).
      *   "Nothing But the Truth": Usually means don't add speculation, hearsay, or irrelevant falsehoods.

  3.  **Address the Professor's Mapping:**
      *   Prof: "Truth" = No Lying. "Whole Truth" = No Misleading (Omission).
      *   Problem: Misleading isn't just omission. It can be implication, presupposition, or selective truth-telling that isn't strictly omission of *the* answer but manipulation of context. Also, lying is a subset of not telling the truth, but "the truth" could mean "accurate representation" which misleading violates even if individual sentences are true.

  4.  **Develop the Menu of Interpretations (The Core Task):**
