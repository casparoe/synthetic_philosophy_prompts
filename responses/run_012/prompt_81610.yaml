prompt: |-
  I'm taking a seminar on the ethics of communication, and my professor keeps invoking the witness's oath — the duty to speak "the truth, the whole truth, and nothing but the truth" — as though it settled the difference between lying and misleading: on her reading, the first clause forbids lying, the second forbids misleading by omission, and so the moral difference between lying and misleading is simply the difference between the two clauses. I think the slogan is being made to carry more than it can, but I can't say precisely where it gives way. Could you set out, as a menu rather than a single verdict, the distinct claims the three clauses might be making — what "the truth" ranges over (propositions, answers to the questions actually put, everything one knows), whether the "whole truth" clause is satisfiable at all or is instead relative to what was asked, and what sort of duty each clause imposes — and for each reading say whether it is trivial, substantive, or false, and whether it actually yields her conclusion? Please keep apart the readings that locate the wrong of misleading in the speaker's intention to induce a false belief, in the false belief actually induced, and in the breach of a norm of assertion, since I suspect she slides between these, and say which reading the oath most naturally bears. Finish by saying what would change your mind about which reconstruction is best, and where that reconstruction is most likely to fail.
