          *   "The truth" = forbids lying.
          *   "The whole truth" = forbids misleading by omission.
          *   "Nothing but the truth" = (implied) forbids adding falsehoods/extraneous info?
      *   **User's Skepticism:** The slogan is being made to carry too much weight. The user wants to know *where* it gives way.
      *   **Task:** Provide a "menu" of distinct claims/interpretations of the three clauses, not a single verdict.
