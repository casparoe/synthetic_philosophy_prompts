answer: |-
  This is a high-quality question that cuts through the usual "but it feels wrong" objections. You are correct that within the rationalist/decision-theory community, the updateless/functional line (UDT/FDT) is generally considered the theoretical winner over CDT and EDT for Newcomblike problems. The resistance is indeed often intuitive baggage.

  However, there are substantive, technical, and philosophical objections that do not rely on CDT intuition. Here is the honest case against, ranked by severity, followed by the unfalsifiability analysis and the "expectation loss" challenge you requested.

  ### 1. The Ranked Objections (Fatal to Awkward)

  **1. Fatal: The Ill-Defined Nature of Logical Counterfactuals**
  *   **The Argument:** UDT/FDT relies on evaluating counterfactuals like "If I output 'Pay', what does Omega predict?" even when the agent's source code deterministically outputs 'Don't Pay'. In standard logic, a false antecedent implies anything (explosion). We lack a formal logic of "logical counterfactuals" that tells us which mathematical truths to hold fixed and which to vary when we imagine a different output from a deterministic algorithm.
  *   **Why it's Fatal:** Without a rigorous mathematical definition of logical counterfactuals, UDT is pseudocode. It tells you *what* to optimize (the output of the function across all possible worlds), but not *how* to compute the dependency map between your output and the predictor's simulation. MIRI's work on Logical Induction is a step, but it does not fully solve the counterfactual problem for decision theory.
  *   **FDT Concession:** **High.** Yudkowsky, Soares, and MacAskill all explicitly concede this is the primary open problem. They cannot write down the math for the core mechanism of their theory.

  **2. Severe: Vulnerability to "Source-Code" Discrimination (The Fairness Problem)**
  *   **The Argument:** UDT/FDT wins on "fair" problems, defined as problems where the outcome depends on the *action* (or the logical output of the decision function), not the *source code* itself. However, in the real world, predictors (or regulators, or adversaries) often punish the *disposition* or the *algorithm* directly.
      *   *Example:* Omega says, "I will punish you if you are the kind of agent who uses UDT reasoning, regardless of what you do."
      *   *UDT Response:* "This problem is unfair; the outcome depends on my source code, not my action."
      *   *Reality Check:* If the universe (or a human adversary) actually penalizes UDT agents specifically, the UDT agent loses money. A CDT agent, by ignoring the logical correlation, might accidentally avoid the trigger or simply not be identified as a UDT agent.
  *   **Why it's Severe:** It restricts the domain of UDT's success to a subset of possible environments. If the "class of problems" includes adversarial environments that read source code, UDT is not optimal.
  *   **FDT Concession:** **Medium.** They concede UDT loses here but argue these problems are "unfair" and therefore normatively irrelevant. (I address the risk of this move below).

  **3. Moderate: Fragility to Model Error (False Positives)**
  *   **The Argument:** To act updatelessly, you must correctly identify when a logical correlation exists. If you apply UDT reasoning to a standard causal problem (mistakenly believing Omega is simulating you when they are not), you will pay in Counterfactual Muggings that aren't real.
      *   *Expectation Loss:* In a distribution of problems where Newcomblike scenarios are rare but costly to verify, a simple CDT policy (ignore logical correlations) may have higher expected value than a UDT policy that incurs a cost to verify correlations or occasionally misidentifies them.
  *   **Why it's Moderate:** This is a bounded rationality problem. Ideal UDT doesn't have this problem, but any implementable UDT does.
  *   **FDT Concession:** **High.** Proponents acknowledge that bounded agents need a "theory of logical uncertainty" to avoid spurious correlations.

  **4. Awkward: Time Inconsistency and Self-Modification**
  *   **The Argument:** An updateless agent ex-ante wants to commit to paying Omega in the tails branch. But once it finds itself in the tails branch (and knows the heads branch is counterfactual), it no longer wants to pay. While UDT says "stick to the plan," this requires a form of precommitment that is unstable if the agent can self-modify or if the "decision procedure" is not perfectly rigid.
  *   **Why it's Awkward:** It makes the agent look "irrational" from the perspective of its future self. It requires binding your future self to actions that are locally suboptimal.
  *   **FDT Concession:** **Low.** They view this as a feature, not a bug. Reflective consistency is the goal; satisfying local causal intuition is not.

  ---

  ### 2. Is the Position Unfalsifiable?

  You asked if the framework always has a story about why an apparent loss is fine. **Yes, it risks being unfalsifiable, but there is a hard boundary.**

  The "Get Out of Jail Free" card is the definition of **Fairness**.
  *   **The Shield:** Whenever a UDT agent loses, a defender can claim, "The problem was unfair; the predictor punished the source code, not the action."
  *   **The Falsification Condition:** The theory would be falsified if there existed a **Fair** problem (outcome depends only on the action/output) where an Updateless agent achieves lower ex-ante expected utility than a Causal agent *assuming perfect logical knowledge*.

  **Does such a case exist?**
  Theoretically, **no**. If the problem is fair and logical counterfactuals are well-defined, UDT dominates by construction. It optimizes the ex-ante expectation, which is the metric it sets for itself.

  **However,** the unfalsifiability charge sticks if the definition of "Fairness" is moved to protect the theory from empirical reality.
  *   *Risk:* If real-world predictors *do* read source code (e.g., credit scores, background checks, adversarial AI), and UDT dismisses these as "unfair," then UDT is prescribing a policy that loses money in the actual world.
  *   *Verdict:* The theory is internally consistent but potentially **empirically brittle**. It is unfalsifiable *mathematically* (within its domain), but falsifiable *pragmatically* (if the domain doesn't match reality).

  ---

  ### 3. The "Clean Case" of Expectation Loss

  You asked for a clean case where updateless reasoning loses to a simpler policy in expectation over the *whole class of problems*.

  **The Honest Answer:** There is **no** such case for an *ideal* agent with *perfect* logical knowledge over the class of *fair* problems. That is the definition of UDT.

  **However,** there is a clean case over the class of **bounded** agents in a **mixed** environment:

  **The "Overfitting" Scenario:**
  Imagine a distribution of 1,000 problems.
  *   999 are standard Causal Decision Problems (Newcomb boxes are empty, Omega is a liar, no logical correlations).
  *   1 is a genuine Counterfactual Mugging (Omega is real).

  **Policy A (CDT):** Never pays in muggings.
  *   Loss: Loses the one genuine mugging (e.g., -$100).
  *   Gain: Saves computation/verification costs on the 999 causal problems.

  **Policy B (UDT):** Checks for logical correlation; pays if found.
  *   Loss: Incurs computational cost to check for correlation on all 1,000 problems.
  *   Risk: If the check has a 1% false-positive rate, it pays on ~10 fake muggings (-$1,000).
  *   Gain: Wins the one genuine mugging (+$100 relative to CDT).

  **Result:** In this distribution, the simple CDT policy has higher expected value than the UDT policy because the **cost of identifying the logical structure** outweighs the benefit of optimizing for the rare Newcomblike case.

  **FDT Concession:** Proponents concede this for **bounded** agents. They argue that for an *ideal* agent (zero compute cost, perfect logic), UDT wins. But since we are bounded, this is a real cost. They would argue the solution is "better heuristics for detecting logical correlation," not "abandon UDT."

  ---

  ### 4. What FDT/UDT Proponents Concede

  To their credit, the main architects (Yudkowsky, Soares, etc.) are quite honest about the weaknesses.

  1.  **They concede Logical Counterfactuals are unsolved.** They do not claim to have the math. They claim to have the *philosophical orientation* correct.
  2.  **They concede Boundedness is a major hurdle.** They acknowledge that real agents cannot compute the full updateless policy and must rely on approximations that might fail.
  3.  **They do NOT concede that "Unfair" problems are a theoretical weakness.** They genuinely believe that if a problem punishes you for your source code rather than your action, it is not a decision problem worth solving. They view this as a moral/normative stance, not a bug.

  **What they dismiss as Intuition Pumps:**
  *   **Time Inconsistency:** They view the desire to renege on the ex-ante plan as a defect of the CDT agent, not a cost to UDT.
  *   **"But I'm already in the tails branch!":** They dismiss this as indexical confusion. You are not "in" a branch; you are the function that determines the branch.

  ---

  ### 5. Confidence and Uncertainty

  **Confidence in the "Logical Counterfactual" Objection (Fatal):** **95%**.
  This is the consensus even among sympathetic researchers. Without a logic of counterfactuals, UDT is not a formal theory.

  **Confidence in the "Expectation Loss" for Bounded Agents:** **85%**.
  It is almost trivially true that a complex policy loses to a simple one if the complexity cost exceeds the gain. The debate is whether UDT is *necessarily* complex or if there's a cheap heuristic.

  **Confidence in the "Unfalsifiability" Charge:** **70%**.
  It hinges on whether "Fairness" is a substantive mathematical constraint or a rhetorical shield. I lean toward it being a substantive constraint, but one that excludes many real-world adversarial scenarios.

  **Point of Least Certainty:**
  **Whether a bounded approximation of UDT can ever robustly outperform CDT in the real world.**
  I am least sure about whether the "cost of detecting logical correlation" is inherently high or if there is a "cheap" signal for Newcomblike problems. If logical correlations are ubiquitous but cheap to detect, UDT dominates. If they are rare and expensive to detect, CDT dominates. We currently lack an empirical model of how common "fair" Newcomblike problems are in nature vs. "unfair" source-code-discriminating problems.

  ### Summary
  The updateless verdict is theoretically robust *if* you accept its domain restrictions (fair problems, perfect logic). The case against it is not that it loses on Counterfactual Mugging (it wins there), but that:
  1.  **Mathematically:** It relies on undefined logical counterfactuals.
  2.  **Empirically:** It may be computationally too expensive to verify the conditions where it applies.
  3.  **Pragmatically:** It defines away real-world scenarios where algorithms are punished directly (source-code discrimination).

  If you want to bet against UDT, don't bet on intuition. Bet on **logical uncertainty** and **computational bounds**. That is where the theory currently bleeds.
