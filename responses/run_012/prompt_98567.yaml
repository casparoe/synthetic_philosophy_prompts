  I've been reading this stuff for years and I've basically landed on the updateless/functional line about counterfactual mugging and XOR blackmail: that a decision procedure should be judged by the expected value of the whole function, not by what happens on the branch you actually find yourself in, so you pay Omega in the tails branch of counterfactual mugging, and you don't cave when someone presents you with a blackmail-ish setup whose threat was constructed after the fact by XORing a coin flip with the bad outcome. My sense is that most of the resistance to this is just causal decision theory's grip on intuition plus some confusion about what you can be said to influence. What I want from you is the honest case against: what observations, arguments, or formal results would actually count against the updateless verdict here, ranked from fatal to merely awkward? I'm especially interested in whether the position has quietly become unfalsifiable — like, is there any way an updateless agent could do badly in a way that its defenders would have to count as a strike against the theory, or does the framework always have a story about why the apparent loss is fine? And tell me which of these defeaters the FDT-ish people would themselves concede are real costs rather than just dismissing as intuition pumps. The thing I'd personally find most persuasive is a clean case where updateless reasoning loses to a simpler policy in expectation over the whole class of problems, not just in one contrived scenario. Also say how confident you are in what you claim here and flag the point you're least sure about.
