answer: |-
  **JOINT STATEMENT ON PUNISHMENT THEORY**

  **I. AGREED CLAIMS**

  1.  **Rejection of Act-Consequentialism:** We both reject "the sentence that maximizes compliance" as a direct decision procedure. Even if punishing a specific individual disproportionately would deter more crime immediately, we agree it is prohibited. The constraint is binding on the judge *now*, not just in the aggregate.
  2.  **The Innocent Offender:** We both take punishing someone known to be factually innocent to calm a riot off the table. However, we acknowledge this prohibition rests on different foundations: Friend A holds it is intrinsically wrong (no guilt = no desert). Friend B holds it is instrumentally forbidden (it destroys the rule-based system's credibility). We agree this difference *does work*: it changes how we audit the system. A audits for moral accuracy; B audits for systemic trust.
  3.  **Attachment of Desert:** We agree desert attaches primarily to the **quantum of hard treatment** (loss of liberty/time), not merely the condemnatory message. A symbolic censure without proportional hard treatment is insufficient for serious crimes. This is why the Tech Case (below) is live: electronic monitoring may convey the message but fail the hard treatment requirement.
  4.  **The Publicity Constraint:** We agree that sentencing below what is deserved solely because a story deters better (the Publicity Case) is prohibited. Manipulating sentences for PR effects undermines the predictability required for both moral justice (A) and systemic legitimacy (B).
  5.  **Ordinal Ranking:** We agree that any punishment scheme must preserve the ordinal ranking of crimes. If Crime X is worse than Crime Y, the hard treatment for X must exceed Y. Both electronic monitoring and prison must fit this ladder.
  6.  **Empirical Stipulations:** For the sake of this document, we stipulate the following empirical facts: (a) Electronic monitoring (EM) deters reoffending equal to prison for certain classes but involves less deprivation; (b) Publicizing under-deserved sentences can temporarily increase deterrence via media narratives.

  **II. POINTS OF DIVISION**

  | Crux | Friend A (Desert-as-Constraint) | Friend B (Rule-Consequentialist) | Test Case / Evidence | A's Prediction | B's Prediction | Falsification Condition (Evidence Against Own Side) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Source of Constraint** | Proportionality is a moral side-constraint derived from the offender's status as a rational agent. It binds regardless of systemic outcomes. | Proportionality is a binding rule because adopting it maximizes long-term utility (legitimacy, predictability). It binds because breaking it costs more than it gains. | **The Ticking Bomb Riot:** If punishing one innocent person definitively saves 1,000 lives *without* leaking to the public. | **Forbidden.** Moral status cannot be traded. | **Permissible.** (Privately). If the rule is truly secret, the systemic cost is zero. | **A:** If data shows desert-based sentencing consistently increases violent crime without boosting perceived legitimacy.<br>**B:** If following the rule requires punishing innocents to maintain system stability. |
  | **2. The Tech Case (EM)** | **Forbidden.** EM is less deprivation than the lower bound of what is deserved for this crime. It fails the hard treatment requirement regardless of deterrence. | **Permissible.** If EM maintains ordinal ranking and public trust, the *amount* of liberty loss is adjustable based on rehab/deterrence outcomes within the rule. | **Stipulated Fact:** EM is 50% less depriving than prison but equal deterrence. Public perceives EM as "soft" but acceptable. | Recidivism will rise eventually because the moral debt is unpaid. | Recidivism will stay low; legitimacy holds because outcomes are visible. | **A:** If offenders report feeling "justly punished" by EM despite lower deprivation.<br>**B:** If public trust metrics drop when EM replaces prison for serious crimes. |
  | **3. Meaning of 'Desert'** | Desert is a **moral fact** independent of social conventions. We can be wrong about what is deserved. | Desert is a **social construct** that tracks community intuition to maintain legitimacy. We can only be wrong about what the community accepts. | **Survey Data:** Community intuition shifts to favor lighter sentences over 10 years. | Sentences should *not* shift if the moral gravity of the act hasn't changed. | Sentences *should* shift to match the new community baseline. | **A:** If moral intuition across all cultures converges on a different metric.<br>**B:** If following community intuition leads to chaotic sentencing disparities. |
  | **4. The Publicity Case** | **Forbidden.** It treats the offender as a means to an end (social calm), violating the constraint. | **Forbidden.** It creates a brittle system where sentences depend on media cycles rather than rules. | **Stipulated Fact:** Under-punishing a high-profile crime reduces copycats by 20%. | Crime reduction is illegitimate gain. | Crime reduction is outweighed by long-term rule erosion. | **A:** If treating offenders as means produces no negative moral residue.<br>**B:** If the system gains legitimacy by appearing merciful despite rule-breaking. |

  **III. SEMANTIC NOTE**

  We acknowledge a portion of our disagreement is semantic. Friend A uses "desert" to refer to a pre-institutional moral truth. Friend B uses "desert" to refer to the institutional rule that best mimics moral truth for utility. This matters for the **Tech Case**: If "desert" is just what the system says it is (B), EM can be redefined as "deserved." If "desert" is external (A), EM cannot be redefined. We agree to test this by measuring **offender perception of justice** versus **public perception of legitimacy**. If offenders feel justly treated by EM but the public feels the system is soft, A wins (hard treatment is key). If the public accepts EM and crime drops, B wins (utility trumps metaphysics).
