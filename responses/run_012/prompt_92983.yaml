answer: |-
  You ask what the machine is reading, and I reply: it reads brain states. It reads patterns of activation that, in waking life, we have learned to correlate with reports of seeing. But to say it reads "what the sleeper saw" is to smuggle in the very theory I question. How is the machine calibrated? Presumably by waking sleepers and comparing their reports to the neural data. But if the sleeper is never woken, the concept of the printout being "right" loses its home. There is no possibility of correction, no use for the description, no language game being played. You have a record of physiological events, which you are dressing in the clothes of experience because the grammar tempts you to treat neural activity as a shadow kind of seeing.

  Consider the water drip. The stimulus causes a narrative involving water upon waking. This shows a causal connection between body and report, not that a leaking roof was present to consciousness during sleep. The heat you felt on waking was real heat, felt in the waking moment. The idea that you felt it *then*, in the sleep, is a projection backwards. We are misled by the fact that "I dreamt of fire" looks like "I saw a fire." But the criteria for "seeing" involve the possibility of being mistaken, of looking again, of others confirming. In sleep, these criteria are suspended. The machine printout is just a more elaborate version of the waking story, not a window into a private theater.
