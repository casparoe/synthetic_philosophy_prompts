prompt: |-
  I sit on a working group drafting a binding fairness rule for automated decision systems in consumer lending and hiring, and after a year in the technical literature I have concluded that the literature is organised around a question we do not have. Each candidate criterion — demographic parity, equalized odds, calibration within groups, predictive parity, individual fairness as a Lipschitz condition on a task-specific metric, counterfactual fairness — is defended against a different background assumption, and the impossibility results get presented as proof that we must simply choose which of them to give up. That seems premature. Before we choose, I want the specification rather than the menu: write the desiderata that any fairness criterion would have to meet to be fit for a rule of this kind — the cases it must get right, the distinctions it must not collapse, and the facts about our setting it must be consistent with — each requirement stated together with the consideration that makes it a requirement rather than a preference of one camp, and marked as non-negotiable or as negotiable. A numbered list is fine.

  Our setting imposes five constraints that I suspect most of these criteria were not designed for, and I would like the list built around them. First, the rule must be checkable by an outside auditor who sees only decisions and outcomes over time, not the model, its features, or its training data; a criterion verifiable only by inspecting the algorithm is of no use to us. Second, we cannot reliably record the protected attribute; it is partly inferred, and the inference errors correlate with the outcome we care about. Third, the label we would train on and audit against is itself a proxy — arrears rather than creditworthiness, supervisory ratings rather than performance — so the criterion has to be explicit about what it is a criterion about, and must not silently inherit the label's bias. Fourth, the decision changes the population it is applied to: advertising, recruiting, and repayment behaviour all respond to the policy, so the distribution on which a criterion is checked in year one is not the distribution it will face in year three. Fifth, the rule must be non-vacuous: satisfiable by some policy other than denying everyone, not satisfiable by degrading the better-off group to the level of the worse-off, and not satisfiable by meeting the constraint on the named groups while failing inside them.

  Tell me where the first constraint conflicts with any requirement that a criterion track the actual decision procedure rather than its output, and identify any subset of the requirements that cannot be jointly satisfied — in our setting or in general — and say what has to give; that part is what I most want. If the impossibility results usually cited generalise here, say which survive and which dissolve once the third constraint is taken seriously. Then, briefly, how each criterion I listed fares against the list, one line apiece, and which single requirement excludes the most candidates overall. Keep the scoring short; the criteria are where I need the help.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Member of a working group drafting a *binding fairness rule* for automated decision systems (ADS) in consumer lending and hiring.
      *   **User's Insight:** The technical literature asks the wrong question (choosing between criteria) rather than specifying *desiderata* for a binding rule in a specific, constrained setting.
      *   **Task:** Write a list of desiderata (requirements) for a fairness criterion fit for this rule.
      *   **Constraints (The "Five Constraints"):**
          1.  *Auditability:* Only decisions and outcomes visible (black box). No model/features/training data access.
          2.  *Protected Attribute (PA) Uncertainty:* PA is inferred/noisy, errors correlate with outcomes.
          3.  *Label Bias:* The target variable (e.g., arrears) is a proxy, not ground truth (e.g., creditworthiness).
          4.  *Performative Prediction:* Decisions change the population/distribution over time.
          5.  *Non-Vacuity:* Must allow positive decisions, no leveling down, no subgroup neglect.
      *   **Specific Analysis Required:**
          *   Identify conflicts between Constraint 1 (Auditability) and requirements tracking the decision procedure.
          *   Identify subsets of requirements that cannot be jointly satisfied (impossibility results) in this setting vs. general.
          *   Assess how standard criteria (Demographic Parity, Equalized Odds, etc.) fare against the list.
          *   Identify the single requirement that excludes the most candidates.
      *   **Format:** Numbered list for desiderata (with justification and negotiability status), followed by the specific analysis requested. Keep scoring short.

  2.  **Deconstruct the Five Constraints into Desiderata:**

      *   *Constraint 1 (Auditability):* The criterion must be defined over observable joint distributions $P(\hat{Y}, Y, \text{time})$, potentially with noisy $A$. It cannot require $P(\hat{Y} | X, A)$ or knowledge of the functional form.
      *   *Constraint 2 (PA Uncertainty):* The criterion must be robust to measurement error in $A$. It cannot assume $A$ is known perfectly. If error correlates with $Y$, standard corrections fail.
      *   *Constraint 3 (Label Bias):* The criterion must distinguish between *predictive accuracy* on the proxy $Y_{proxy}$ and *fairness* regarding the construct $Y_{true}$. It cannot simply demand equal error rates on $Y_{proxy}$ if $Y_{proxy}$ is biased.
      *   *Constraint 4 (Performative):* The criterion must hold under distribution shift or be defined over a trajectory, not just a static snapshot.
      *   *Constraint 5 (Non-Vacuity):* The criterion must allow for utility maximization subject to constraints. It must prevent "leveling down" (making everyone worse to achieve parity). It must prevent subgroup masking (Simpson's paradox).

  3.  **Drafting the Desiderata List:**

      *   *Requirement 1 (Observability):* Must be computable from $(\hat{Y}, Y_{proxy}, t)$ and noisy $A_{obs}$. (Derived from C1). *Non-negotiable.*
      *   *Requirement 2 (Construct Validity):* Must not enforce parity on $Y_{proxy}$ if $Y_{proxy}$ is known to be biased against a group. (Derived from C3). *Non-negotiable.*
      *   *Requirement 3 (Robustness to Attribute Noise):* Must not flip verdict based on plausible bounds of measurement error in $A$. (Derived from C2). *Non-negotiable.*
      *   *Requirement 4 (Dynamic Stability):* Must remain satisfiable under equilibrium response to the policy. (Derived from C4). *Negotiable (hard to define).*
      *   *Requirement 5 (Pareto Efficiency / No Leveling Down):* Cannot be satisfied solely by increasing error rates for the advantaged group without improving the disadvantaged. (Derived from C5). *Non-negotiable.*
      *   *Requirement 6 (Subgroup Coherence):* Must not be satisfiable while violating fairness on a coarse partition of the protected group. (Derived from C5). *Non-negotiable.*

      *Refining Requirement 2:* This is the crux. If $Y$ is biased (e.g., arrears reflect policing or economic exclusion, not ability to pay), demanding Equalized Odds on $Y$ enforces the bias. The desideratum needs to state that the criterion must allow for *construct adjustment* or be defined on a *corrected label*. But since the auditor only sees $Y_{proxy}$ (C1), this creates a tension. The rule must allow the *definition* of fairness to decouple from $Y_{proxy}$ statistics where bias is documented.

      *Refining Requirement 4:* Performative prediction makes static thresholds obsolete. The rule needs to be stable or adaptive. Let's make it about *robustness to shift*.

  4.  **Analyzing Conflicts and Impossibilities:**

      *   *Conflict C1 vs. Procedure Tracking:* Any criterion requiring knowledge of the model weights, feature importance, or causal graph (e.g., Counterfactual Fairness, Individual Fairness via metric learning) is dead on arrival. C1 kills anything needing $X$ or the function $f$.
      *   *Impossibility Results:*
          *   Chouldechova (2017) / Kleinberg et al. (2016): Calibration + Equalized Odds + Balance for Positive Class is impossible if base rates differ.
          *   In *this* setting: C3 (Label Bias) dissolves the standard impossibility results *if* we admit $Y_{proxy} \neq Y_{true}$. If we stop demanding parity on $Y_{proxy}$, the mathematical tension between Calibration and Equalized Odds relaxes because the "ground truth" is no longer the observed $Y$.
          *   However, C1 (Auditability) + C2 (Noisy A) creates a *new* impossibility. You cannot simultaneously correct for label bias and attribute noise without external data.
          *   C5 (Non-vacuity) + C1 (Auditability): Hard to enforce "no leveling down" without knowing the counterfactual utility curve.
      *   *What has to give:* We likely have to give up strict statistical parity on observed outcomes (C3 forces this) and accept a "compliance band" rather than a point estimate due to C2 (Noisy A).

  5.  **Evaluating the Candidate Criteria:**

      *   *Demographic Parity:* Fails C3 (ignores label bias), Fails C5 (encourages leveling down/quota).
      *   *Equalized Odds:* Fails C3 (enforces bias in $Y$), Fails C1 (needs true $Y$, hard with noisy $A$).
      *   *Calibration:* Passes C1, Fails C3 (calibrated to biased $Y$), Fails C5 (can be satisfied by useless model).
      *   *Predictive Parity:* Fails C3 (PPV depends on base rate and biased $Y$).
      *   *Individual Fairness:* Fails C1 (needs $X$ and metric).
      *   *Counterfactual Fairness:* Fails C1 (needs causal model).

  6.  **Synthesizing the Output:**

      *   *Structure:*
          1.  Desiderata List (Numbered, Justification, Status).
          2.  Conflict Analysis (C1 vs. Procedure, Impossibility subsets).
          3.  Impossibility Survival Check (Which standard results hold?).
          4.  Criteria Scorecard (One line each).
          5.  The "Killer" Requirement.

      *   *Tone:* Professional, technical, precise, acknowledging the gravity of a "binding rule."
      *   *Key Insight to Highlight:* The tension between C1 (Black Box) and C3 (Biased Label) is the real showstopper. You can't audit bias correction if you can't see the features or the true label. The rule must mandate *process* (e.g., validation studies) rather than just *outcome statistics*.

      *   *Refining the "Impossibility" section:* Standard impossibility theorems assume $Y$ is ground truth. If $Y$ is biased, the theorem premises break. However, a *new* impossibility arises: You cannot verify bias correction using only $Y_{proxy}$.
      *   *Refining the "Killer" Requirement:* It's likely Observability (C1) combined with Construct Validity (C3). But if I must pick one from the Desiderata list, it's **Construct Validity** (must not enforce parity on biased proxies). This kills EO, DP, PP, Calibration as usually defined.

      *   *Wait, check Constraint 1 again:* "Auditor sees only decisions and outcomes... not model, features, or training data." This kills Individual Fairness and Counterfactual immediately.
      *   *Check Constraint 3:* "Label... is itself a proxy." This kills standard EO/DP/Calibration unless modified.
      *   *Check Constraint 5:* "Non-vacuous... not satisfiable by degrading better-off." This kills DP often.

      *   *Decision:* The "Killer" is likely **Construct Validity (C3-derived)** because it invalidates the mathematical object most criteria optimize for ($Y_{observed}$). Or **Observability (C1-derived)** because it invalidates the mechanism most criteria rely on (feature access). Given the prompt asks about the *criteria listed*, C1 kills Individual/Counterfactual. C3 kills DP/EO/Calibration/PP. C1 is more fundamental to the *audit* context. But C3 is more fundamental to the *fairness* context. The prompt asks "which single requirement excludes the most candidates overall."
      *   DP, EO, Cal, PP all fail C3 (in this specific setting where Y is biased).
      *   IF, CF fail C1.
      *   So C3 excludes 4. C1 excludes 2.
      *   Actually, DP/EO/Cal/PP *can* be calculated with C1. They just shouldn't be *used* because of C3. So C1 is a hard filter on *verifiability*. C3 is a hard filter on *validity*.
      *   Let's look at the "Requirement" list I draft.
      *   Req 1: Observability. (Kills IF, CF).
      *   Req 2: Construct Validity. (Kills DP, EO, Cal, PP as standardly defined).
      *   So Req 2 is the bigger exclusions if we consider "faring against the list" as "being usable." But technically DP is *computable* under C1. It's just *wrong* under C3.
      *   I will frame the "Killer" as the requirement that the criterion must not enforce statistical parity on a biased proxy.

      *   *Re-evaluating Impossibility:* The Chouldechova/Kleinberg impossibility relies on $Y$ being the truth. If $Y$ is a biased proxy, the base rate differences might be *artifacts*. If we correct for that, do the impossibilities dissolve? Yes, because the constraint "Calibration + EO" implies base rates must be equal *if Y is truth*. If Y is biased, we aren't demanding EO on Truth, we are demanding something else. But we can't measure Truth. So the impossibility transforms into an *identification problem*.
      *   I need to be careful here. The math doesn't change, the interpretation does. The impossibility results survive mathematically on the *observed* variables, but become irrelevant normatively if the observed variables are rejected as targets.

      *   *Final Polish:* Ensure the distinction between "Non-negotiable" and "Negotiable" is clear. Ensure the "What has to give" section is punchy.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "C3 kills everything." I need to explain *why* in the context of a binding rule. A rule cannot mandate the impossible. If C3 says "Don't trust Y" and C1 says "Only look at Y", the rule must mandate *external validation studies* rather than continuous automated auditing. I should reflect this nuance. The desideratum should be "Auditability via Proxy-robust metrics" or similar.
      Actually, the prompt asks for desiderata for a *criterion*. If no criterion meets them, the conclusion is "No existing criterion works." That is a valid and helpful answer.

      Let's refine the Desiderata to be actionable.
      1.  **Observational Computability:** (C1).
      2.  **Proxy Robustness:** (C3).
      3.  **Attribute Noise Tolerance:** (C2).
      4.  **Equilibrium Stability:** (C4).
      5.  **Pareto Non-Domination:** (C5).

      Okay, ready to write.

      *Wait, one more check on the Impossibility:*
      Standard result: Calibration + Equalized Odds + Non-triviality $\rightarrow$ Base Rates must be equal.
      In this setting: Base rates on $Y_{proxy}$ differ. Base rates on $Y_{true}$ are unknown.
      If we demand Calibration on $Y_{proxy}$ and EO on $Y_{proxy}$, the impossibility holds.
      If we demand Calibration on $Y_{true}$ (unobservable) and EO on $Y_{true}$ (unobservable), the rule is unenforceable (violates C1).
      So the impossibility *survives* on observables, but the *normative force* dissolves because we shouldn't be optimizing observables.
      The *new* impossibility is: You cannot verify correction for $Y_{proxy}$ bias using only $Y_{proxy}$ data (C1 + C3 conflict).

      Okay, that's the core insight. C1 + C3 is the impossible pair.

