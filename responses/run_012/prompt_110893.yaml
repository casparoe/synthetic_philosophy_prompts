answer: |-
  ### Desiderata for a Binding Fairness Criterion

  1.  **Observational Computability**
      *   **Requirement:** The metric must be calculable using only the joint distribution of decisions ($\hat{Y}$), observed outcomes ($Y_{obs}$), time ($t$), and inferred attributes ($A_{inf}$), without access to features ($X$), model weights, or training logs.
      *   **Consideration:** Constraint 1 (Auditability) mandates that compliance cannot depend on proprietary or unobservable internal states; a rule requiring white-box access is unenforceable.
      *   **Status:** **Non-negotiable.**

  2.  **Construct Decoupling**
      *   **Requirement:** The criterion must not enforce statistical parity on $Y_{obs}$ where $Y_{obs}$ is documented to be a biased proxy for the latent construct ($Y_{true}$); it must allow for differential error rates to correct for label bias.
      *   **Consideration:** Constraint 3 (Label Bias) implies that optimizing for $Y_{obs}$ parity (e.g., equal false positive rates on arrears) codifies historical exclusion into the rule.
      *   **Status:** **Non-negotiable.**

  3.  **Attribute Noise Robustness**
      *   **Requirement:** The fairness verdict must not flip sign under plausible perturbations of $A_{inf}$ consistent with known inference error rates, particularly where error correlates with $Y_{obs}$.
      *   **Consideration:** Constraint 2 (PA Uncertainty) means strict thresholds on inferred groups create perverse incentives to manipulate the inference model rather than the decision policy.
      *   **Status:** **Non-negotiable.**

  4.  **Equilibrium Stability**
      *   **Requirement:** The criterion must remain satisfiable (or violate gracefully) when the decision policy shifts the underlying population distribution $P(X, Y)$ over time.
      *   **Consideration:** Constraint 4 (Performative Prediction) ensures the rule does not force the firm into a cycle of compliance violations caused solely by successful intervention (e.g., improved repayment due to lending).
      *   **Status:** **Negotiable** (can be replaced with periodic re-baselining).

  5.  **Pareto Non-Domination**
      *   **Requirement:** Satisfaction of the criterion must not be achievable solely by degrading the utility or accuracy of the advantaged group without corresponding improvement for the disadvantaged group.
      *   **Consideration:** Constraint 5 (Non-Vacuity) prevents "leveling down" solutions that satisfy parity by harming the better-off, which is economically destructive and ethically hollow.
      *   **Status:** **Non-negotiable.**

  6.  **Subgroup Coherence**
      *   **Requirement:** Satisfaction on the aggregate protected group must imply satisfaction on any coarse, observable partition of that group (e.g., age bins within a racial category).
      *   **Consideration:** Constraint 5 (Non-Vacuity) prevents masking discrimination via Simpson's paradox, ensuring the rule protects individuals within groups, not just group averages.
      *   **Status:** **Non-negotiable.**

  ---

  ### Conflict and Impossibility Analysis

  **Constraint 1 vs. Procedure Tracking**
  Constraint 1 (Auditability) immediately invalidates any requirement that a criterion track the *decision procedure* rather than its output. This excludes **Individual Fairness** (requires task-specific metric on $X$) and **Counterfactual Fairness** (requires causal model of $X$ and $A$). Any desideratum demanding knowledge of the feature space or the functional form $f(X)$ is incompatible with a black-box audit. In this setting, fairness must be defined entirely over the outcome manifold.

  **The Fundamental Impossibility (C1 + C3)**
  There is a subset of requirements that cannot be jointly satisfied: **Observational Computability (1)** and **Construct Decoupling (2)**.
  *   **The Conflict:** You cannot verify that a model has corrected for label bias ($Y_{obs} \neq Y_{true}$) using only data from $Y_{obs}$. To satisfy Construct Decoupling, the auditor needs an estimate of $Y_{true}$ or a bound on the bias; Constraint 1 denies access to the validation data or features required to build that estimate.
  *   **What Has to Give:** You must relax **Observational Computability**. The rule cannot be a purely statistical audit of logs. It must mandate *periodic validation studies* where the auditor is granted temporary access to ground-truth labels or features to calibrate the proxy, or it must accept a "safe harbor" based on process documentation rather than outcome metrics alone.

  **Standard Impossibility Results**
  *   **Survive:** The **Chouldechova/Kleinberg impossibility** (Calibration + Equalized Odds + Non-triviality $\rightarrow$ Equal Base Rates) survives mathematically on the *observed* variables. If you demand Calibration and EO on $Y_{obs}$, you still hit the wall if base rates in $Y_{obs}$ differ.
  *   **Dissolve:** The *normative force* of these results dissolves under **Construct Decoupling**. Since we admit $Y_{obs}$ is biased, differing base rates in $Y_{obs}$ do not imply differing base rates in $Y_{true}$. Therefore, the impossibility theorem no longer proves that fairness is impossible; it proves that *proxy-parity* is impossible. The tension shifts from "mathematically inconsistent criteria" to "unidentifiable ground truth."

  ---

  ### Criteria Scorecard

  *   **Demographic Parity:** Fails Construct Decoupling (enforces bias), Fails Pareto Non-Domination (encourages leveling down).
  *   **Equalized Odds:** Fails Construct Decoupling (enforces parity on biased errors), Fails Attribute Noise Robustness (sensitive to $A_{inf}$ misclassification).
  *   **Calibration:** Passes Observational Computability, Fails Construct Decoupling (calibrated to biased $Y_{obs}$), Fails Pareto Non-Domination (satisfied by trivial models).
  *   **Predictive Parity:** Fails Construct Decoupling (PPV inherits label bias), Fails Subgroup Coherence (aggregate PPV masks subgroup variance).
  *   **Individual Fairness:** Fails Observational Computability (requires access to $X$ and metric).
  *   **Counterfactual Fairness:** Fails Observational Computability (requires causal model and $X$).

  **Single Most Exclusionary Requirement:**
  **Construct Decoupling (Requirement 2).**
  While Observational Computability excludes the causal/individual criteria, Construct Decoupling invalidates the entire class of statistical parity criteria (DP, EO, Calibration, PP) as they are standardly defined in the literature. It renders the standard mathematical objects normatively useless for this setting, requiring a fundamental re-specification of what is being optimized.
