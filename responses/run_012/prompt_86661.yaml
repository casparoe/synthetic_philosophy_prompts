      *   **The Tension:** Strawson argues reactive attitudes are natural human responses not subject to external rational justification (like determinism). If we withhold resentment based on causal history (deterministic influences on character), aren't we adopting the objective attitude based on a theoretical view of causation?
      *   **Literature Context:** This is a known objection to Strawson. Often discussed under "moral luck," "constitutive luck," or "manipulation cases" (e.g., Mele's zygote argument, though that's more about free will). In Strawsonian terms, this touches on whether the *quality of will* is truly accessible if the will itself is manufactured.
