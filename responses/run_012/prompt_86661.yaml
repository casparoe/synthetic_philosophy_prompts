      *   Nuance: Some Strawsonians (like R. Jay Wallace) might argue this modifies the *quality of will* interpretation. If the will isn't truly "theirs" because of manipulation, the quality of will isn't attributable. This tries to save Strawson by widening exemptions. But this still concedes that causal history matters, which weakens the "naturalism" claim.

