answer: |-
  **FINAL EXAMINATION: METAPHYSICS 405**
  **Time Allowed: 48 Hours**
  **Word Limit: 2,000 words maximum**

  **Question 1**

  In the final lecture, we considered the **Persistence-Dependence Principle (PDP)**: *A plurality of objects composes a further object if and only if that plurality has persistence conditions of its own, and those conditions are not fixed by the persistence conditions of its members.*

  Write a critical essay evaluating PDP as an answer to the Special Composition Question. Your essay must address the following five requirements:

  1.  **Classification:** State clearly what answer PDP gives to the Special Composition Question (SCQ) and locate it relative to Nihilism, Universalism, and the van Inwagen-style view (that only living things compose).
  2.  **Application:** Test PDP against four specific cases: a living organism, an ordinary artifact (e.g., a chair), a heap of sand, and a gerrymandered plurality (e.g., the Moon and your thumb). Explain the verdict PDP delivers for each.
  3.  **Intrinsicness:** Analyze whether PDP offers an intrinsic or extrinsic criterion of composition. Explain why this classification creates a metaphysical problem for the principle.
  4.  **Circularity:** Articulate the strongest structural objection to PDP, specifically focusing on whether attributing persistence conditions to a plurality presupposes that composition has already occurred.
  5.  **Collapse:** Conclude by assessing whether PDP collapses into one of the standard views it was intended to improve upon. If it does, identify which view and explain why.

  ***

  ### MODEL ANSWER

  The Persistence-Dependence Principle (PDP) offers a restrictive answer to the Special Composition Question (SCQ). Unlike Universalism, which claims composition is automatic, or Nihilism, which denies it entirely, PDP asserts that composition occurs only when specific modal conditions are met. It sits closest to the van Inwagen-style view, as both privilege unities with independent behavioral or modal profiles. However, PDP is theoretically broader; if artifacts possess persistence conditions distinct from their parts, PDP allows them to compose, whereas van Inwagen restricts composition strictly to living organisms.

  Applying PDP to standard test cases reveals its restrictive nature. First, a **living organism** clearly satisfies PDP. An animal survives the replacement of its cells; its persistence conditions (metabolic continuity) are not fixed by the persistence conditions of the individual cells, which may die or depart without destroying the organism. Second, an **ordinary artifact**, such as a chair, yields a controversial verdict. If the chair survives the replacement of a leg, it has independent persistence conditions. However, if its existence depends entirely on the arrangement of its parts without modal flexibility, PDP denies composition. Third, a **heap of sand** fails the test. The heap's existence is typically fixed by the presence of the grains; remove enough grains, and the heap ceases, implying its conditions are fixed by its members. Finally, a **gerrymandered plurality** (the Moon and my thumb) clearly does not compose. There is no single set of conditions under which this scattered object persists; if my thumb is amputated, the plurality changes, but no unified object is threatened.

  A significant metaphysical difficulty arises regarding whether PDP is an intrinsic or extrinsic criterion. Composition is widely held to be intrinsic; whether parts compose a whole should depend only on the parts and their relations, not on external facts. However, persistence conditions are modal facts often determined extrinsically. For artifacts, persistence depends on human intentions (external to the parts). Even for organisms, survival conditions might depend on environmental laws. If composition depends on extrinsic persistence conditions, PDP violates the intuition that composition is intrinsic to the arrangement of matter.

  The most damaging structural objection, however, is circularity. To ask whether a plurality has "persistence conditions of its own" is to ask how *it* persists through change. But referring to the plurality as a single subject capable of persisting ("*it* continues to exist") presupposes that the plurality is already a unified object. We cannot determine if the conditions belong to the plurality without already assuming the plurality is a thing. Thus, PDP appears to explain composition by presupposing the existence of the composite, rendering the principle viciously circular. It tells us composition occurs when the object has conditions, but we can only attribute conditions if the object exists.

  Finally, we must ask if PDP collapses into a standard view. If one argues that only living things genuinely possess persistence conditions not fixed by their parts, PDP collapses into van Inwagen's "Life" view. If one argues that *no* plurality has conditions distinct from its parts (claiming apparent survival is just replacement by similar parts), PDP collapses into Nihilism. To avoid collapse, the proponent must defend a robust realism about modal properties of composites without begging the question. Given the circularity objection and the extrinsic nature of modal facts, PDP struggles to remain a distinct, viable alternative. It likely functions best as a description of our intuitions about unity rather than a metaphysical ground for composition itself.

  ***

  ### MARKING SCHEME (20 MARKS TOTAL)

  **1. Classification of PDP (4 Marks)**
  *   **4 Marks:** Correctly identifies PDP as a form of Restrictivism; distinguishes it from Nihilism/Universalism; notes affinity with van Inwagen but highlights the potential difference regarding artifacts.
  *   **Mistake costing marks:** Identifying PDP as Universalism or failing to distinguish it from van Inwagen's specific "Life" restriction.

  **2. Application to Cases (4 Marks)**
  *   **4 Marks:** Provides a clear verdict for all four required cases (Organism, Artifact, Heap, Moon+Thumb) with reasoning tied to persistence conditions.
  *   **Mistake costing marks:** Skipping one of the four cases or applying the principle mechanically without explaining *why* the persistence conditions do or do not hold.

  **3. Intrinsic vs. Extrinsic Analysis (4 Marks)**
  *   **4 Marks:** Correctly identifies PDP as likely extrinsic (due to modal/intentional dependence) and explains why this violates the standard intrinsicness constraint on composition.
  *   **Mistake costing marks:** Claiming PDP is intrinsic without argument, or identifying it as extrinsic but failing to explain the metaphysical consequence.

  **4. Circularity Objection (4 Marks)**
  *   **4 Marks:** Articulates the "presupposition of unity" problem: that attributing persistence conditions to a plurality requires treating it as a single subject prior to establishing composition.
  *   **Mistake costing marks:** Confusing circularity with vagueness, or dismissing the objection without engaging with the "subject" presupposition.

  **5. Collapse Assessment (4 Marks)**
  *   **4 Marks:** Offers a reasoned conclusion on whether PDP reduces to Nihilism or van Inwagen's view, based on how strictly one interprets "independent persistence conditions."
  *   **Mistake costing marks:** Asserting PDP is unique without addressing the collapse risk, or claiming it collapses without explaining the mechanism (e.g., how modal facts are reduced).
