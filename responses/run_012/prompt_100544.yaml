      *   *Point 2: The Musical/Geometrical Universe.* Connect to *Harmonices Mundi*. The "rays" aren't magic beams; they're harmonic ratios. This links to the new physics.
      *   *Point 3: The Earth's Soul as a Buffer.* Explain how this saves free will and avoids "pagan determinism." It makes astrology meteorological, not fatalistic.
      *   *Point 4: Belief vs. Hustle.* Be honest. He needed cash. But he also hated bad astrology. He was trying to *reform* it, not just sell it.
      *   *Conclusion:* Summarize the "move." He was trying to save astrology by stripping away the myth and keeping the math.

  7.  **Refining the Tone:**
