      *   **Task:** Identify real conflicts vs. apparent conflicts, propose cheapest repairs + costs, and order by severity.

  2.  **Deconstruct the Claims & Identify Tensions:**

      *   **Claim 1 (PP):** Lewis's Principal Principle. $C(A | Ch(A)=x \& E) = x$. Requires that chance facts guide rational credence.
      *   **Claim 2 (Humean Chance):** Best System Analysis (BSA). Chances are the probabilistic laws appearing in the best deductive system summarizing the Humean Mosaic (the total history of particular matters of fact).
      *   **Claim 3 (Objectivity):** Compatible with Humeanism if "objective" means "not dependent on *my* specific mind," though Humean chances depend on the *whole* mosaic. Usually compatible with (2).
      *   **Claim 4 (Micro-Indeterminism):** There are genuine physical indeterminacies.
      *   **Claim 5 (Frequencies):** Frequencies $\neq$ Chance. Compatible with BSA (chances fit frequencies but aren't identical).

      *   **The Big Tension: (1) + (2) = The "Big Bad Bug" (Lewis's Problem).**
          *   *Why?* If chances are Humean (BSA), they supervene on the *entire* history of the world (past, present, *and future*).
          *   If I know the current chance function (derived from the Best System), I implicitly have information about the *future* outcomes (because the Best System is determined by the total mosaic including the future).
          *   Information about future outcomes is "inadmissible" by definition (Lewis's definition of admissibility).
          *   Therefore, knowing the Humean chance *always* gives me inadmissible information.
          *   Therefore, the Principal Principle (which requires *no* inadmissible information) cannot be applied as stated.
          *   *Severity:* High. This is the famous problem that led Lewis to replace PP with the "New Principle" (NP).

      *   **The Second Tension: (2) + (4).**
          *   *Why?* Humeanism (BSA) is often associated with a "block universe" or at least a view where the future is already part of the mosaic that determines the laws.
          *   Claim (4) says indeterminism is *true*.
          *   *Conflict?* Not necessarily. A Humean can believe the world *is* indeterministic (the mosaic contains irreducible probabilistic patterns). However, there's a metaphysical tension: If the future determines the present chances (via BSA), does that undermine the *openness* required by robust indeterminism?
          *   *Refinement:* The tension isn't logical contradiction, but it creates the "Undermining" problem (related to the Big Bad Bug). If future outcomes determine present chances, and present chances constrain future outcomes, we get a loop.
          *   *Severity:* Medium-High. It's the mechanism behind the Big Bad Bug.

      *   **The Third Tension: (4) + (5).**
          *   *Why?* If indeterminism is true, frequencies might diverge from chances. Claim (5) says frequencies aren't chance. This is actually consistent. BSA says chances are the probabilities in the best system, which balance fit (frequency) and simplicity. So (5) is actually a *consequence* of (2) usually.
          *   *Severity:* Low/None. This pair is stable.

      *   **The Fourth Tension: (1) + (4).**
          *   *Why?* If indeterminism is true, how do we know the chance *now*? If chances supervene on the total history (2), we can't know them now without knowing the future.
