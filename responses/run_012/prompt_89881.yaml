prompt: |-
  Trying to pin down my view on objective chance before a seminar and I'd like a consistency check first. Here's roughly where I've landed: (1) the Principal Principle is basically right — if I know the chance of A is p, and I have no information that's inadmissible with respect to that chance fact, my credence in A should be p; (2) chances are Humean — facts about chance supervene on the total pattern of actual outcomes, there's no extra propensity or primitive modal fact sitting in the world doing the work; (3) chance is nonetheless objective and mind-independent, not just a fancy name for somebody's degree of belief; (4) indeterminism is true at the micro level, and it's precisely that indeterminism that gives us non-trivial chances in the first place; (5) long-run frequencies are excellent evidence about chance but don't constitute it.

  Something feels off around (1) and (2) but I can't tell if that's a real conflict or me misreading the standard Humean line, and I'm also suspicious of (4). Which of these actually pull against each other, which only look like they do, and what's the cheapest repair for each real conflict — plus what that repair costs me? Order them by how bad they are rather than dumping them all out as equally broken.
