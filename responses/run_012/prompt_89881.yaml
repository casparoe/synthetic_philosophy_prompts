          *   *Cost:* PP is intuitive; NP is technical and less intuitive. You lose the simple link "Chance = Credence."
      *   **Repair for (2)+(4):** Clarify the notion of indeterminism. It must be **Humean Indeterminism** (probabilistic laws), not **Modal Indeterminism** (multiple possible futures existing in a robust sense).
