  **Where the reply is soft:** I am relying on a timescale distinction that might be continuous. If attention can be dispositional, I have no wedge. I am hoping the lab treats attention as occurrent selection only. If they concede long-term attentional tuning, my category collapses into theirs. I need them to be rigid about what attention is.

  **2. The Representationalist Philosopher**
