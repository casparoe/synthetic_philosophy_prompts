  **3. The Psychophysicist**
  **As they would put it:** You talk of experience. I talk of signals. You say adaptation stays put while reports change. That sounds like response bias. Unless you show me a change in early visual cortex activity that correlates with your salience shift, you are measuring decision criteria, not perception. You need a neural signature. Without it, you are discussing introspection, not science. Where is the measurable signature of this re-weighting?
