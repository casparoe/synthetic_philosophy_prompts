  **Two-minute reply:** Content tracks truth conditions. Salience tracks priority. I can see a red patch without it demanding action. If cognition makes it demand action, the truth conditions of 'there is a red patch' remain unchanged. The map is the same; the highlighter is different. I am isolating the motivational pull from the descriptive accuracy. You conflate how the world looks with how the world matters.
