answer: |-
  Dear colleague,

  I have been thinking carefully about your seminar position, and while I find your reading of Moral Foundations Theory as a symmetric debunking machine to be intellectually seductive and widely shared among skeptics, I believe it is significantly more exposed than it appears, primarily because it conflates a descriptive psychological model with a metaethical conclusion. The most decisive defeater for your view is conceptual rather than empirical, resting on the fact that the debunking force you attribute to the theory is not inherent to the theory itself but is instead imported by a specific metaethical stance that the theory does not necessitate. Moral Foundations Theory, taken strictly at face value, posits that moral judgments are generated by evolved intuitive systems, but it remains silent on whether those judgments track mind-independent moral truths. To move from the claim that morality is intuitive to the claim that morality is unjustified requires the additional premise that evolved intuitions cannot track truth, which is a substantive philosophical assertion often associated with error theory or evolutionary skepticism. A moral realist can comfortably accept the entire descriptive architecture of Moral Foundations Theory while maintaining that evolution shaped these intuitions precisely because they helped our ancestors navigate objective moral landscapes, such as the reality of suffering or the necessity of cooperation. Consequently, your reading that the framework is epistemically corrosive is contingent on a background view that many committed moral foundations theorists would reject as outside their scientific scope. Jonathan Haidt and his colleagues often invite this skeptical reading through rhetorical flourishes, but if pressed, a committed theorist would concede that the science describes the origins of belief, not the validity of it, meaning the symmetric debunking is a use to which the theory can be put rather than a logical consequence of the theory itself.

  Even if we grant your metaethical premise that evolutionary origins undermine truth claims, the second most significant vulnerability in your position is the empirical assumption of symmetry among the foundations. Your argument relies on the idea that Care, Fairness, Loyalty, Authority, and Sanctity are ontologically equal outputs of modular systems, but there is growing evidence that the Care foundation is functionally and evidentially distinct in a way that breaks the symmetry required for your debunking machine to operate uniformly. For the symmetry to hold, the psychological mechanisms underlying Sanctity or Authority would need to be as robust and cross-culturally stable as those underlying Care, yet the literature suggests otherwise. The Care foundation is grounded in the detection of suffering and distress, signals that have a tangible reality independent of cultural construction, whereas Sanctity is often tied to disgust sensitivity which is highly malleable and culturally variable. If the Care foundation tracks objective harm while the Sanctity foundation tracks culturally contingent purity norms, then a debunking argument applied symmetrically would be empirically misguided. What would have to be true of the underlying psychology for your reading to collapse completely is a demonstration that the Care intuition is triggered by objective welfare states in a way that Loyalty or Sanctity intuitions are not triggered by objective social facts. Findings that genuinely embarrass the symmetric reading include the instability of the five-factor structure in non-WEIRD samples, where Loyalty and Authority often collapse into a single factor or where Sanctity fails to emerge as distinct, suggesting that the purported symmetry is an artifact of American political psychology rather than a universal human architecture. An unsympathetic critic would press this hard, arguing that the factor analysis does not hold up globally, while a committed theorist might concede the measurement issues but defend the functional adaptation story, yet even that defense admits asymmetry in how these adaptations manifest.

  You are also correct to suspect that the popular move of using the theory to scold partisans for moral monism is quietly doing normative work, and this is where the theory risks overstepping its descriptive bounds. When theorists argue that liberals should respect conservative foundations to achieve a richer morality, they are no longer doing psychology but engaging in normative political philosophy, presupposing that moral pluralism is itself a virtue. This is a point where a committed moral foundations theorist might actually concede ground, acknowledging that the prescription of pluralism is a separate ethical commitment not proven by the data, whereas an unsympathetic critic would argue this reveals the theory is never truly neutral to begin with. This normative slip does not invalidate the psychology, but it does undermine the claim that the framework is normatively inert, supporting your suspicion that the theory is often wielded as a tool for moderation rather than mere description. However, this does not necessarily validate your symmetric debunking claim, because advocating for pluralism assumes that multiple foundations have value, whereas your debunking argument suggests none of them track truth. The two positions are in tension, suggesting that the theory is being pulled in contradictory directions by its proponents, which leaves your specific reading of it as a debunking machine somewhat isolated from the actual practice of the theorists who often want to preserve moral truth while expanding its base.

  Regarding your harder question on whether the position is self-undermining, the charge that the debunking argument is itself an intuition-driven product does not render it incoherent, but it does make it contingent on a coherentist or naturalistic background view that must be argued for rather than assumed. If you argue that all moral judgments are intuitions and therefore unreliable, you must explain why the intuition leading to that skeptical conclusion is privileged. This is not fatal incoherence so long as you acknowledge that your skepticism is part of a wider web of belief that includes naturalism and evolutionary theory, rather than claiming a view from nowhere. However, if the debunking argument relies on a Humean is-ought gap that a rival metaethic would reject, then your position is not self-undermining so much as it is dialectically limited to those who already accept Humean premises. This means your reading of Moral Foundations Theory is not a universal defeater for moral truth claims but a specific argument within a specific metaethical framework. The risk here is not incoherence but rather that the argument becomes circular for those outside the naturalistic paradigm, which limits its persuasive power in a seminar setting where metaethical assumptions may vary.

  Finally, you asked honestly whether the reading risks collapsing into unfalsifiability, and I believe it does carry that risk if it is not carefully constrained. If any moral disagreement can be explained post hoc as a difference in weighting the foundations, the theory risks becoming a just-so story that accommodates any data without predicting specific outcomes. For the symmetric debunking reading to avoid this, it would need to generate predictions about when moral judgments are likely to be erroneous based on intuitive dominance, but since the theory lacks an independent metric for moral error, it struggles to distinguish between a mistaken intuition and a differently weighted one. This is not necessarily fatal, as many philosophical theses carry a cost of unfalsifiability, but it does reduce the scientific utility of the debunking claim. If the theory cannot specify conditions under which a foundation should be trusted over another, except by appealing to the very intuitions it seeks to debunk, it risks circularity. However, this is more a problem for the debunking use of the theory than for the theory itself, which can be falsified by neuroscientific evidence showing lack of modularity or by cross-cultural studies failing to replicate the foundations. In sum, your position is most exposed on the conceptual front regarding the genetic fallacy, followed by the empirical asymmetry of the foundations, and while the self-undermining charge is manageable, the risk of unfalsifiability remains a significant cost that you should acknowledge if you wish to maintain the argument's rigor. I hope this helps as you prepare for the seminar, and I look forward to hearing how the discussion unfolds.
