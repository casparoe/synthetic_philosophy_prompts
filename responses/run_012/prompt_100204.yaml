answer: |-
  Here is the intuition behind the three concepts, stripped of the formalism.

  ### 1. Mixed Dominance: The "Insurance Policy" Intuition

  You asked: *Is the player literally supposed to randomize, or is the mix standing in for uncertainty?*

  **The Intuition:** The mix is not a instruction to flip a coin; it is a **proof of inefficiency**.

  When we say $T$ is strictly dominated by a 50/50 mix of $M$ and $B$, we are not saying "You must flip a coin." We are saying: "There exists a plan available to you that yields a higher payoff in every possible state of the world than $T$ does."

  Think of the mixed strategy as a **contingency plan**.
  *   If the opponent plays $L$, the "mix" tells you: "You should have played $M$."
  *   If the opponent plays $R$, the "mix" tells you: "You should have played $B$."

  Since you don't know what the opponent will do, you can't perfectly execute that contingency. However, the mathematical existence of that mix proves that $T$ is structurally flawed. $T$ is trying to be a "jack of all trades" (getting a safe 1), but the combination of $M$ and $B$ covers the same ground more aggressively.

  **Why rational players never play $T$:**
  Rationality is defined as "maximizing expected utility given some belief." If a strategy is strictly dominated by a mix, there is **no belief** (no probability assignment to the opponent's moves) under which $T$ is optimal.
  *   If you think $L$ is likely, $M$ beats $T$.
  *   If you think $R$ is likely, $B$ beats $T$.
  *   If you are unsure, the *average* of $M$ and $B$ beats $T$.

  So, playing $T$ isn't just "bad luck"; it is an error in reasoning. You are choosing an option that is inferior to *some other available plan* regardless of what happens. The "mix" is just the tool we use to expose that $T$ is inferior. It doesn't matter if you randomize; what matters is that $T$ is never the answer to the question "What is my best move given what I think?"

  ### 2. Iterated Elimination: Why Weak Dominance is Fragile

  You asked: *Why is strict order-independent but weak order-dependent?*

  **The Intuition:** Strict dominance is a "hard kill." Weak dominance is a "soft kill."

  *   **Strict Dominance:** If Strategy $A$ is *strictly* better than $B$, it is better by some margin $\epsilon > 0$. Removing other strategies from the game (strategies that aren't $A$ or $B$) cannot shrink that margin to zero. $A$ was better than $B$ no matter what the opponent did; deleting opponent options just removes scenarios, it doesn't change the fact that in the remaining scenarios, $A$ still beats $B$. The relationship is robust.
  *   **Weak Dominance:** If $A$ is *weakly* better than $B$, it means $A$ is better in some cases and **equal** in others. The dominance relies on those "better" cases existing. If you eliminate an opponent strategy that was one of the "better" cases, $A$ might now only be **equal** to $B$. Once they are equal, you can no longer eliminate $B$.

  **The Tiny Example (Order Matters):**
  Consider this game (Row payoffs, Col payoffs):

  | | L | R |
  | :--- | :---: | :---: |
  | **T** | 1, 1 | 0, 0 |
  | **B** | 1, 0 | 0, 1 |

  *   **Row's Perspective:** $T$ weakly dominates $B$. (If Col plays $L$, $1=1$. If Col plays $R$, $0=0$... wait, this is indifference).
      *   *Correction for a working example:*
      *   Row Payoffs: $T=(1, 0)$, $B=(1, 0)$. (Indifferent).
      *   Add a column $C$. $T=(1, 0, 0)$, $B=(1, 0, 1)$. Now $B$ weakly dominates $T$ because of column $C$.
      *   Col Payoffs: Suppose $C$ is weakly dominated for Col by $L$.

  Let's use the standard 3-strategy Row / 2-strategy Col example where the order changes the survivor.

  **Row Payoffs:**
  *   $U$: (2, 2)
  *   $M$: (2, 1)
  *   $D$: (1, 2)

  **Col Payoffs:**
  *   $L$: (1 vs U, 0 vs M, 0 vs D)
  *   $R$: (0 vs U, 0 vs M, 1 vs D)

  **Scenario 1 (Eliminate Row first):**
  1.  Look at Row. $M$ is weakly dominated by $U$ (2=2, 2>1). Eliminate $M$.
  2.  Now Row has $U$ (2,2) and $D$ (1,2). $U$ strictly dominates $D$. Eliminate $D$.
  3.  Row is left with $U$. Col knows this. Col plays $L$ (gets 1 vs $U$).
  4.  **Outcome:** $(U, L)$.

  **Scenario 2 (Eliminate Col first):**
  1.  Look at Col. $L$ gives (1, 0, 0). $R$ gives (0, 0, 1). Neither dominates.
  2.  Wait, I need Col to have a weak dominance. Let's adjust Col payoffs slightly.
      *   Col $L$: (1, 1, 0)
      *   Col $R$: (1, 0, 1)
      *   Now $L$ weakly dominates $R$ for Col (1=1, 1>0, 0=0... no).
      *   Let's try: Col $L$: (1, 1, 1). Col $R$: (1, 0, 1). $L$ weakly dominates $R$.
  3.  **Path A:** Col eliminates $R$ first. Game is now Row vs $L$.
      *   Row payoffs vs $L$: $U=2, M=2, D=1$.
      *   $D$ is strictly dominated. Eliminate $D$.
      *   Now $U$ and $M$ are identical (both give 2). Neither dominates.
      *   **Survivors:** $\{U, M\} \times \{L\}$.
  4.  **Path B:** Row eliminates $M$ first (weakly dominated by $U$).
      *   Game is $U, D$ vs $L, R$.
      *   Now Col looks. $L$ (1 vs U, 0 vs D). $R$ (0 vs U, 1 vs D). No dominance.
      *   Row looks. $U$ (2, 2) vs $D$ (1, 2). $U$ strictly dominates $D$. Eliminate $D$.
      *   Col is left vs $U$. $L$ gives 1, $R$ gives 0. Col eliminates $R$.
      *   **Survivors:** $\{U\} \times \{L\}$.

  **The Takeaway:** In Path A, eliminating the weakly dominated column $R$ removed the *only reason* $M$ was worse than $U$. Once $R$ was gone, $M$ and $U$ became twins, and $M$ survived. In Path B, we killed $M$ before we killed $R$.
  **Strict dominance buys you:** A solution concept that doesn't depend on the order of cleaning. It's a stable prediction.
  **Weak dominance buys you:** A finer filter, but the prediction depends on *how* you clean the room.

  ### 3. The 3-Player Divergence: Correlation is the Key

  You asked: *Why do "Strictly Dominated" and "Never a Best Response" coincide in 2-player games but break in 3-player games?*

  **The 2-Player Coincidence:**
  In a 2-player game, your opponent's "belief" is just a probability distribution over their strategies. This is mathematically identical to a mixed strategy.
  *   To check if $X$ is **Strictly Dominated**: We ask, "Is there a mix of my other strategies that beats $X$ against *every* opponent move?"
  *   To check if $X$ is **Never a Best Response**: We ask, "Is there *any* belief about the opponent where $X$ is optimal?"
  *   **The Geometry:** In 2-player games, the set of "all possible opponent behaviors" (the simplex) is convex. If $X$ is not a best response to *any* point in that simplex, it must be strictly dominated by a mix of other strategies. The linearity of expected payoff ensures these two definitions map perfectly onto each other.

  **The 3-Player Break:**
  In a 3-player game, you face Opponent 2 and Opponent 3.
  *   **Strict Dominance** checks against *all possible joint distributions* of (Opp2, Opp3). This includes **correlated** beliefs (e.g., "If Opp2 plays L, Opp3 definitely plays L").
  *   **Best Response (in Nash Equilibrium)** assumes opponents play **independently**. You can only hold beliefs that are products of individual mixed strategies (e.g., "Opp2 plays L with 50%, Opp3 plays L with 50%").

  **The Gap:**
  A strategy can be a Best Response to a *correlated* belief, but not to any *independent* belief.
  *   If a strategy is a BR to a correlated belief, it is **NOT Strictly Dominated** (because there exists *some* belief where it wins).
  *   But if it is not a BR to any independent belief, it is **Never a Best Response** (in the context of Nash/independent play).

  **Concrete Sketch:**
  Imagine you are Player 1. You choose **Match** or **Mismatch**.
  Opponent 2 chooses H/T. Opponent 3 chooses H/T.
  *   You win big if Opp2 and Opp3 **Match** (HH or TT). You play **Match**.
  *   You win small if Opp2 and Opp3 **Mismatch** (HT or TH). You play **Mismatch**.

  **Correlated Belief:** You believe Opp2 and Opp3 are coordinating (maybe they share a random seed). They will definitely Match.
  *   Best Response: Play **Match**.
  *   Conclusion: **Match** is NOT strictly dominated (because it wins against this belief).

  **Independent Belief:** You believe Opp2 and Opp3 act independently (50/50 each).
  *   Probability of Match = 50%. Probability of Mismatch = 50%.
  *   Suppose the payoffs are tuned so that with 50/50 odds, **Mismatch** always yields a higher expected value than **Match**.
  *   Conclusion: **Match** is **Never a Best Response** to independent play.

  **The Intuition:** Strict dominance is a "physical" property of the payoff table (is there *any* world where this works?). Never-a-Best-Response is a "strategic" property (does this work given how rational people actually behave?). In 2-player, the "world" and the "behavior" are the same thing. In 3-player, the "world" allows for conspiracy (correlation), but the "behavior" forbids it.

  ### The Verdict: Which step do people get wrong?

  **Step 1 (Mixed Dominance) is the most common subtle error.**

  Here is why: People intuitively treat strategies as "actions" rather than "plans." When they hear "$T$ is dominated by a mix of $M$ and $B$," they think, "But I can't play half $M$ and half $B$ in a one-shot game."

  They miss the point that the mix is a **witness**, not an **instruction**. It witnesses that $T$ is logically inconsistent with maximizing utility. If you don't internalize that dominance includes mixed strategies, you will incorrectly conclude that $T$ is "admissible" in your example. You will walk into a seminar thinking $T$ is a viable rational choice, while everyone else knows it's dead on arrival.

  Step 3 is the hardest to *remember*, but Step 1 is the one people most often *misunderstand* conceptually. They think rationality prohibits randomization, rather than realizing rationality prohibits choosing options that are inferior to randomized plans.
