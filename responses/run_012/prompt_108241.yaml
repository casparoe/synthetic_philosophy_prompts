          *   *Verdict:* Accurate. Huxley is the standard historical anchor; the whistle analogy is famous.
      *   *Sentence 4:* "The standard objection is that the doctrine is self-refuting."
          *   *Verdict:* Wince-worthy. "Self-refuting" is a strong logical claim (like "there are no truths"). The objection is usually about *knowledge* or *justification*, not strict logical contradiction. It undermines the *rationale* for believing it, not the truth of the proposition itself.
      *   *Sentence 5:* "If every thought and utterance is produced by physical processes alone, then the epiphenomenalist's own belief that epiphenomenalism is true is produced by a brain state rather than by argument or evidence; such a belief could not be justified, and the view therefore destroys the only grounds anyone could have for accepting it."
          *   *Verdict:* Wince-worthy/Debatable. It assumes a false dichotomy (brain state *vs.* argument/evidence). Physicalists argue brain states *realize* reasoning. The core issue is the *link* between experience and judgment, not just causation.
      *   *Sentence 6:* "It follows, moreover, that no one could ever know anything about their own experiences, since knowledge of a thing requires that the thing make a difference to the knower."
          *   *Verdict:* Accurate statement of the objection's consequence, though the premise ("knowledge requires causal difference") is contested (see Q3).
      *   *Sentence 7:* "Defenders today generally concede the force of this objection and retreat to a weaker claim: that only the qualitative or felt aspects of experience are epiphenomenal, while beliefs, desires, and intentions remain causally efficacious."
          *   *Verdict:* Wrong/Misleading. Most *classic* epiphenomenalists (like Jackson in the early 80s, or Chalmers to an extent) don't "retreat" because they were already talking about qualia. Functional mental states (beliefs/desires) are often treated as physical/functional by property dualists. It's not a retreat; it's a clarification of *what* is epiphenomenal (qualia vs. functional roles).
      *   *Sentence 8:* "But that is interactionism in disguise, since it grants that some mental states produce effects."
          *   *Verdict:* Wrong. Interactionism typically means *non-physical* substances or properties cause physical effects. If beliefs are physical/functional, causing effects is just physical causation. If qualia are the only epiphenomenal part, it's still epiphenomenalism about qualia.
      *   *Sentence 9:* "Epiphenomenalism therefore survives chiefly as a threat — it is where non-reductive physicalists are said to end up once they grant that physics is causally closed."
