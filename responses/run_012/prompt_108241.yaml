      *   *Q4: Restricted View vs. Interactionism vs. Non-Reductive Physicalism.*
          *   Restricted view (Qualia epi, Beliefs causal) is standard Property Dualism.
          *   Is it Interactionism? No. Interactionism implies mental *substance* or *properties* affecting physical. If beliefs are physical properties, it's not interactionism. If beliefs are mental properties that cause physical effects, it *is* interactionism (property interactionism). But usually, epiphenomenalists say beliefs are physical/functional.
