answer: |-
  ### Audit of the Passage

  **Sentence 1:** *"Epiphenomenalism is the view that conscious experience is a by-product of the brain."*
  **Verdict:** **Accurate.** This is the standard, neutral definition. It captures the dependency of the mental on the physical without yet specifying the causal direction.

  **Sentence 2:** *"Physical processes cause our experiences, but our experiences cause nothing in turn: consciousness is a shadow cast by the nervous system, and it does no work in the production of behavior."*
  **Verdict:** **Accurate.** This correctly identifies the one-way causal arrow that defines the position. The "shadow" metaphor is standard and appropriate.

  **Sentence 3:** *"The position is usually traced to T. H. Huxley, who held that animals are conscious automata and compared consciousness to a locomotive's whistle — a noise the engine produces but which contributes nothing to its motion."*
  **Verdict:** **Accurate.** Huxley is the canonical historical source, and the whistle analogy is the most famous illustration of the view.

  **Sentence 4:** *"The standard objection is that the doctrine is self-refuting."*
  **Verdict:** **Wince-worthy.** Philosophers distinguish between a claim being *false* and a claim being *self-refuting* (logically impossible to assert consistently). The objection is not that epiphenomenalism is logically contradictory, but that it is *self-defeating* regarding knowledge. If the view is true, we cannot *know* it is true. Calling it "self-refuting" conflates an epistemic problem with a logical one.

  **Sentence 5:** *"If every thought and utterance is produced by physical processes alone, then the epiphenomenalist's own belief that epiphenomenalism is true is produced by a brain state rather than by argument or evidence; such a belief could not be justified, and the view therefore destroys the only grounds anyone could have for accepting it."*
  **Verdict:** **Misleading.** This sets up a false dichotomy. A physicalist (or an epiphenomenalist who accepts physical closure) argues that brain states *realize* reasoning. Processing evidence *is* a physical process. The real problem isn't that the belief is caused by a brain state; it's that the belief is not caused by the *experience* it purports to describe. The objection should focus on the disconnect between the experience and the report, not the physical nature of the report itself.

  **Sentence 6:** *"It follows, moreover, that no one could ever know anything about their own experiences, since knowledge of a thing requires that the thing make a difference to the knower."*
  **Verdict:** **Accurate statement of the objection, debatable premise.** This accurately summarizes the consequence the objector wants to draw. However, the premise ("knowledge requires causal difference") is a contentious theory of knowledge (causal theory of knowledge) that not all philosophers accept.

  **Sentence 7:** *"Defenders today generally concede the force of this objection and retreat to a weaker claim: that only the qualitative or felt aspects of experience are epiphenomenal, while beliefs, desires, and intentions remain causally efficacious."*
  **Verdict:** **Wrong.** This is not a "retreat"; it is the standard modern formulation. Most contemporary epiphenomenalists (property dualists) never claimed that *beliefs* (understood as functional cognitive states) were inert. They distinguish between *qualia* (felt experience) and *cognitive states* (information processing). Limiting epiphenomenalism to qualia is the core position, not a concession made after the objection arose.

  **Sentence 8:** *"But that is interactionism in disguise, since it grants that some mental states produce effects."*
  **Verdict:** **Wrong.** Interactionism requires that *non-physical* mental states cause physical effects. If the "beliefs and desires" that cause behavior are understood as physical or functional states (which most epiphenomenalists grant), then their causal efficacy is just standard physical causation. It is only interactionism if the *qualia* themselves cause the behavior, which this restricted view explicitly denies.

  **Sentence 9:** *"Epiphenomenalism therefore survives chiefly as a threat — it is where non-reductive physicalists are said to end up once they grant that physics is causally closed."*
  **Verdict:** **Accurate.** This correctly identifies the dialectical role of epiphenomenalism in contemporary debates. It is often viewed as the "bullet" non-reductive physicalists must bite to avoid violating the causal closure of the physical.

  ***

  ### Responses to Your Four Questions

  **1. Is "self-refuting" the right diagnosis, and what is the real target?**
  "Self-refuting" is too strong. A statement is self-refuting if asserting it entails its falsity (e.g., "I am not speaking"). Epiphenomenalism could be true even if we cannot know it. The objection is better described as showing the view is **epistemically self-defeating**.

  Regarding the inference: The move from "caused by a brain state" to "not caused by evidence" is unfair, as noted in the audit. Physical processes can track evidence. The real target is **reliability**. The strongest horn of the dilemma is this: If experience plays no causal role in producing my judgment that I have experience, then the correlation between my having the experience and my judging that I have it is a cosmic coincidence. If the correlation is coincidental, my judgments are not reliable. If they are not reliable, I am not justified in holding them.

  Your friend's label, the **paradox of phenomenal judgment**, is apt. The paradox is that we are compelled to judge that we have conscious experience, yet if epiphenomenalism is true, the experience itself plays no role in generating that judgment. We are left with a judgment that seems to be about experience but is causally isolated from it.

  **2. Does the "common cause" strategy answer the objection?**
  If the epiphenomenalist grants that the physical state causes both the pain and the judgment "I am in pain" (a common cause structure), this solves the **reliability** problem but leaves the **content** problem untouched.
  *   **Reliability:** The common cause explains why the judgment and the experience occur together. It ensures the judgment is true whenever the experience exists.
  *   **Content (Aboutness):** It does not explain why the judgment is *about* the experience rather than the brain state. Normally, a thought is about whatever causes it. If the brain state causes the judgment, why is the judgment "I am in pain" (referring to the qualia) rather than "I am in brain state B" (referring to the physical cause)?

  **Direct acquaintance** is difficult for the epiphenomenalist to use because acquaintance is typically modeled as a causal or information-bearing relation. If the experience does nothing, it's hard to see how we are "acquainted" with it in a way that grounds knowledge.
  **Non-causal reference** (the idea that experience fixes content without causing the judgment) is the other main reply. This preserves epiphenomenalism but requires a theory of reference that does not rely on causation, which is philosophically costly.
  So, the common cause strategy explains why we make the judgments, but it struggles to explain why those judgments latch onto the *phenomenal* properties rather than the *physical* properties.

  **3. Is the reductio regarding physical things fair?**
  Your friend's objection is a strong counter-move, often associated with **Russellian Monism**. The argument is: We only know the intrinsic nature of physical objects via their causal effects (dispositional properties). If the principle "you can only know what makes a causal difference to you" is strict, then we cannot know the intrinsic nature of matter either, only its relational structure.
  This is a fair *reductio* against the premise that knowledge requires causal impact. It suggests that if we accept direct knowledge of our own experience (which seems intuitive), we must reject the premise that knowledge always requires causal mediation. If we reject that premise to save knowledge of the physical world, we might as well reject it to save knowledge of experience. The disanalogy is that we know physical objects *indirectly* (via effects), whereas the epiphenomenalist claims we know experience *directly*. The objection challenges whether "direct knowledge" without causal power is coherent.

  **4. Is the restricted view interactionism, and is it what non-reductive physicalists face?**
  The passage is confused here.
  *   **Restricted View:** The view that qualia are epiphenomenal but beliefs/desires are causal is standard **Property Dualism**. It is **not interactionism** unless those causal beliefs/desires are themselves non-physical properties. Most defenders argue beliefs are physical/functional properties, so their causation is unproblematic.
  *   **Non-Reductive Physicalism:** This position holds that mental properties are not identical to physical properties but are instantiated by them. The "threat" they face is the **Causal Exclusion Argument**. If physics is causally closed, and the physical base does all the work, the mental property is excluded. If the non-reductive physicalist says the mental property *does* do work, they risk overdetermination or violating closure (sliding toward interactionism). If they say it does *not*, they slide toward epiphenomenalism.
  *   **Verdict:** The passage is wrong to call the restricted view "interactionism in disguise." It is only interactionism if the *causal* mental states are non-physical. The closing claim is partially right: non-reductive physicalists are driven toward epiphenomenalism about *qualia*, but the passage muddies the water by conflating functional mental states with phenomenal ones.

  ***

  ### Verdict

  The passage gets the historical definition and the basic causal structure of epiphenomenalism exactly right, and it correctly identifies that the view is currently maintained primarily as a consequence of accepting the causal closure of physics. However, the most important correction is that the "self-refutation" objection is not a logical refutation but an epistemic challenge regarding the reliability of phenomenal judgments, and the passage is misleading in portraying the restriction of epiphenomenalism to qualia as a defensive retreat rather than the standard modern formulation. Finally, the closing claim does not fully follow because it conflates property dualism with interactionism; while non-reductive physicalists do risk epiphenomenalism regarding qualia, granting causal power to beliefs does not make the view interactionist unless those beliefs are deemed non-physical properties.
