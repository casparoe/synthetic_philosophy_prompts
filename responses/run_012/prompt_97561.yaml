prompt: |-
  Alright so I need help turning an idea into something I can actually use, and I should say up front I've got no philosophy or econ background, I just play alot of poker and run this weekly betting pool with guys from my old job.

  Heres the thing thats been bugging me. I'm the one who has to decide, most weeks, whether we take some bet or pass on it — the long-shot parlay, cashing out early on one thats still alive, buying into the bigger game, whether to double up when I'm ahead. It's $50 to maybe $600, so it stings but it won't ruin me. My problem is I'm inconsistent. I'll pass on something thats "worth it on average" because I can't stand the idea of the bad branch happening, then two weeks later I'll throw money at a 40-to-1 long shot cause the payout looks fun. A buddy told me the fix is that I'm doing expected value in my head when I should be doing this other thing he called risk-weighted expected utility — I think its some academic's theory, I forget who. The way he put it: you don't just multiply each outcome by its chance. First you bend the probabilities so the bad outcomes count for more than they really do, and how much you bend them depends on how cautious you are. Thats the part I want to get right, because nobody's ever explained to me what the bending actually looks like in practice.

  So please write me a procedure I can run on my phone in about five minutes before a bet. I want it as steps in order — what to write down, what to estimate, how to bend the numbers, how to compare two options, and where to just stop and say no. A few things it has to deal with that I keep hitting:

  - my probability guesses are shaky and I want it to tell me what to do when I basically can't put a number on something
  - some outcomes I can't put a value on at all (losing a friends money is different from losing my own, even if its the same dollar amount)
  - I want one "how cautious am I" dial I can set differently for money bets vs stuff that isn't money, and I want to know how to set it honestly instead of just cranking it to "safe" every time

  Run the whole thing on two made-up cases: a $20 long-shot parlay that pays $800, and a one-time thing where a friend wants me to stake him $500 on something. Show me the numbers. If the procedure tells me to take a bet I'd normally chicken out of, or to pass on one I'd normally take, don't soften it — I want to see where it disagrees with my gut. And tell me straight which parts are just my judgment dressed up as math, and what the whole thing can't do.
