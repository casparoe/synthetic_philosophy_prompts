answer: |-
  Here is a 5-minute procedure designed for your phone. It translates "risk-weighted expected utility" into a poker-player heuristic. It doesn't require a degree, just a calculator app and honesty.

  ### The "Sleep-Adjusted EV" Procedure

  **Time:** 5 Minutes
  **Tools:** Phone Notes app + Calculator

  #### Step 1: Set the "Pain Multiplier" (Non-Money Values)
  Not all dollars feel the same. Losing your own cash hurts less than losing a friend's stake or money meant for bills.
  *   **Action:** Assign a multiplier to the **Loss Amount** based on what's at stake.
  *   **1.0x:** Play money / Pool money you can afford to torch.
  *   **1.5x:** Personal bankroll (money that stings but doesn't ruin you).
  *   **2.0x:** Money you promised someone else (staking a friend).
  *   **3.0x:** Money you can't afford to lose (rent/bill buffer) or high reputation risk.
  *   **Write down:** `Adjusted Loss = Cost to Bet × Pain Multiplier`

  #### Step 2: Set the "Caution Dial" (Risk Aversion)
  Your buddy talked about "bending probabilities." In practice, this means treating your gut estimate as too optimistic. We fix this with a discount.
  *   **Action:** Pick a number from 1 to 10.
      *   **1-3 (Degenerate Mode):** You're bored, it's fun money, you don't care if it goes to zero.
      *   **4-6 (Investor Mode):** You want to grow the pool/bankroll over time.
      *   **7-10 (Preservation Mode):** You are tired of variance, or the stakes involve relationships.
  *   **Honest Calibration:** Do not pick this based on how you *want* to feel. Pick it based on **last week's regret**.
      *   *Did you lose sleep over a loss last week?* Dial is too low. Move it up 2 points.
      *   *Did you miss a big win because you were scared?* Dial is too high. Move it down 1 point.
  *   **Write down:** `Confidence Discount = Caution Dial × 2%` (e.g., Dial 5 = 10% discount).

  #### Step 3: Estimate and "Bend" the Probability
  *   **Action:** Write down your gut estimate of winning (Win %). Be honest—if you don't know, guess 50% and apply a massive discount in the next step.
  *   **The Bend:** Subtract your `Confidence Discount` from your `Win %`.
      *   *Why?* This accounts for the "bad outcomes count for more" theory. It forces you to be right by a margin, not just on average.
      *   *Constraint:* If your gut Win % is below 10%, do not bend it. Just use 0% (see Step 5).
  *   **Write down:** `Adjusted Win % = Gut Win % - Confidence Discount`

  #### Step 4: Run the Numbers
  Calculate the **Sleep-Adjusted Expected Value (SA-EV)**.
  *   **Formula:** `(Adjusted Win % × Payout) - ((100% - Adjusted Win %) × Adjusted Loss)`
  *   *Note:* We use the `Adjusted Loss` from Step 1 here, not the raw cash cost.

  #### Step 5: The Decision Rule
  *   **If SA-EV is Negative:** **PASS.** No exceptions. The math says the risk isn't worth the pain.
  *   **If SA-EV is Positive but less than 20% of the Cost:** **PASS.** It's not enough edge to justify the hassle/risk.
  *   **If SA-EV is Positive and > 20% of Cost:** **TAKE IT.**
  *   **The "Fog" Rule:** If you literally cannot estimate a Win % (Step 3), **PASS.** Unknown variance is the enemy of utility.

  ---

  ### Case Study 1: The $20 Long-Shot Parlay
  **Scenario:** You put in $20. It pays $800. You think there's a 5% chance it hits (1 in 20).
  **Context:** It's the weekly pool. Fun money. You're feeling aggressive.

  **1. Pain Multiplier:**
  It's pool money. You can afford to lose $20.
  *   Multiplier: **1.0x**
  *   Adjusted Loss: **$20**

  **2. Caution Dial:**
  You're in "Degenerate Mode" for the pool. But you admitted you're inconsistent. Let's set it at **3**.
  *   Confidence Discount: 3 × 2% = **6%**

  **3. Bend the Probability:**
  *   Gut Win %: **5%**
  *   Adjusted Win %: 5% - 6% = **-1%** -> **Floor at 0%**.
  *   *Wait, that kills the bet immediately.* Let's say you're confident enough to set Dial to **2** (1% discount).
  *   Adjusted Win %: 5% - 4% = **1%**. (We are being very conservative because long-shots are volatile).

  **4. Run the Numbers:**
  *   Upside: 1% × $800 = **$8**
  *   Downside: 99% × $20 = **$19.80**
  *   SA-EV: $8 - $19.80 = **-$11.80**

  **5. Decision:**
  **PASS.**
  *   **Gut Check:** Your gut says, "It's only $20, let's have a sweat."
  *   **Math Says:** Even with low pain multiplier, the probability bend destroys the value. You are paying $20 for a ticket the model values at negative $11.
  *   **Why it disagrees:** Your gut values the *entertainment* of the sweat. This model values *growth*. If you want entertainment, budget for it separately. Do not call it an "investment" or a "bet." Call it a "ticket purchase." If you treat it as a bet, the math says you're burning money.

  ---

  ### Case Study 2: Staking a Friend ($500)
  **Scenario:** Old coworker wants you to stake him $500 on a prop. He says it's a lock. Split profits 50/50.
  **Context:** You trust him, but he's tilted lately. If he loses, you lose $500. If he wins, you net $500 profit (total return $1000).
  **Probability:** He says 60%. You think maybe 45%.

  **1. Pain Multiplier:**
  This is a friend. Losing this money creates awkwardness. It hurts more than your own cash.
  *   Multiplier: **2.0x**
  *   Adjusted Loss: $500 × 2.0 = **$1,000** (in "pain units")

  **2. Caution Dial:**
  Relationships are on the line. You can't afford variance here.
  *   Dial: **8** (Preservation Mode)
  *   Confidence Discount: 8 × 2% = **16%**

  **3. Bend the Probability:**
  *   Gut Win %: **45%** (You think he's overconfident).
  *   Adjusted Win %: 45% - 16% = **29%**.

  **4. Run the Numbers:**
  *   Upside: 29% × $1,000 (Total Return) = **$290**
      *   *Note: Payout is your $500 back + $500 profit.*
  *   Downside: 71% × $1,000 (Adjusted Loss) = **$710**
  *   SA-EV: $290 - $710 = **-$420**

  **5. Decision:**
  **HARD PASS.**
  *   **Gut Check:** Your gut says, "He's my boy, I got him. Plus 50% upside is huge."
  *   **Math Says:** The "Pain Multiplier" for the friendship risk combined with the "Confidence Discount" on his shaky read makes this toxic.
  *   **Why it disagrees:** Your gut focuses on the *potential profit*. The model focuses on the *consequence of being wrong*. The model forces you to acknowledge that losing a friend's trust costs double the money.

  ---

  ### Where This Is Just Judgment Dressed as Math

  I need to be straight with you about the limitations, or you'll game the system.

  1.  **The "Caution Dial" is Subjective:** You can lie to yourself here. If you really want to make a bet, you'll set the Dial to 1. To fix this, **write down your Dial setting before you look at the payout.** If you see the $800 payout first, you'll subconsciously lower your risk aversion to justify it.
  2.  **The "Pain Multiplier" is Arbitrary:** I suggested 2.0x for friend money. For you, it might be 1.2x or 5.0x. You have to calibrate this. Next time you lose a friend's money, ask yourself: "How much cash would I have needed to win to make this loss feel neutral?" That ratio is your multiplier.
  3.  **It Doesn't Predict Wins:** This procedure doesn't tell you who wins the game. It tells you if the *bet* is worth the *stress*. You can follow this perfectly and still lose. The goal is to ensure that when you lose, you don't regret the decision, only the outcome.
  4.  **The "Fog" Rule:** The hardest part is Step 3. If you can't estimate a percentage, the procedure says "Pass." You will hate this. You will feel like you're missing out. **That is the point.** The procedure is designed to stop you from betting on noise.

  ### How to Start
  For the next 3 weeks, run this on every bet *before* you put money down. Write the SA-EV in your notes.
  *   If you take a bet with Negative SA-EV and win: **You got lucky. Do not celebrate.**
  *   If you pass on a bet with Positive SA-EV and it wins: **You made a profit in discipline.**

  This shifts your goal from "Winning the bet" to "Running the process." That is how you stop being inconsistent.
