      *   Ensure the distinction between *Historicism* (Popper's target) and *Social Science* (what the friend is defending) is clear. Popper didn't deny social science; he denied *historicist* social science.

  6.  **Self-Correction/Check during drafting:**
      *   *Did I address the "falsifiable" point?* Yes, by arguing that social kinds make falsification messy (theory-laden).
      *   *Did I address the "knowledge" point?* Yes, by arguing that the constraints depend on the technological context which is knowledge-dependent.
      *   *Did I distinguish History from Sociology?* Yes, the "Engineering vs. History" point.
      *   *Is the concession clear?* Yes, he wins "sociological constraints" but loses "laws of history."

  7.  **Final Polish:** Check against the prompt's specific request ("argue against him," "don't just recite Popper," "tell me which one survives"). (Proceed to generate output based on these steps.)
answer: |-
  Your mate has upgraded the argument. He's moved from the crude historicism Popper actually demolished (prophecy, inevitable stages) to a sophisticated structural-functionalism. He's arguing for *constraints on social possibility* rather than *predictions of social trajectory*.

  It's a stronger position, but it still collapses under three specific pressures. Here is the case against him, structured to hit the exact points he thinks make him immune to Popper.

  ### 1. The Category Error: Engineering vs. History
  Your friend's example ("You can't run a centrally planned economy without prices or surveillance") is not a law of *history*. It is a law of *social mechanics*.

  Popper's target in *The Poverty of Historicism* wasn't social science generally; it was the claim that history *itself* has laws. There is a distinction between the rules of the game and the history of the match.
  *   **Laws of Mechanics:** "An internal combustion engine requires oxygen." This is timeless. It applies in 1900 and 2000. It is a constraint on possibility.
  *   **Laws of History:** "The age of the internal combustion engine will be followed by the age of electricity." This is a claim about the temporal unfolding of events.

  Your friend's "invariance claims" are all laws of mechanics. They describe the functional requirements of a specific social technology *at any time*. If they are timeless, they belong to sociology or economics, not history. If they are time-bound (i.e., "You can't plan an economy without surveillance *in the 20th century*"), then they aren't laws, they are contingent regularities.

  By calling these "laws of history," he is conflating the *stage* with the *play*. He has defended the existence of laws of *sociology*, which Popper never denied. Popper denied that those laws could be used to deduce the historical course of events. Your friend has conceded the prediction point but is trying to keep the "history" label. He can't have both. If it's a law, it's ahistorical. If it's historical, it's not a law.

  ### 2. The Tautology Trap (Definitions in a Lab Coat)
  He claims these invariance claims are falsifiable. "Find one centrally planned society without surveillance that worked, and I'm wrong."

  The problem is that social kinds are not natural kinds. "Gold" is defined by atomic structure. "Centrally Planned Economy" is defined by *intent and function*.

  If someone produces a counter-example—a society that claims to be centrally planned, has no surveillance, and functions—the defender of the law has two moves, both of which kill the "law" status:
  1.  **Redefine the kind:** "Well, if they didn't track resources, they weren't *really* centrally planned." This makes the claim a tautology. (Planned economies require planning mechanisms.)
  2.  **Move the goalposts:** "It worked for a while, but it contained the seeds of collapse." This makes the claim unfalsifiable in any relevant timeframe.

  This is the "definitions wearing a lab coat" problem. Most structural constraints in social science turn out to be analytic truths about the definitions of the institutions involved, not empirical discoveries about the universe. If the claim is empirical, it's vulnerable to the "space of possibilities" problem below. If it's analytic, it's not a law of nature/history, it's a rule of grammar.

  ### 3. The Knowledge Hole (The Popperian Boomerang)
  This is the kill shot. Your friend thinks the "unpredictability of future knowledge" argument doesn't touch invariance claims because they don't predict *what* we will know, only *what holds together*.

  He is wrong. The "space of possible societies" is not a fixed landscape that we are slowly mapping. It is an *endogenous* landscape that expands as knowledge grows.

  The claim "Central planning requires surveillance" is true *relative to the current technological horizon*. It relies on a specific state of knowledge about coordination, information transmission, and computation.
  *   Before high-speed computing, the claim was robust.
  *   With distributed ledger technology or advanced AI coordination, the definition of "surveillance" or "planning" might shift so radically that the invariance claim dissolves.

  We cannot know the boundaries of the "possible" because the boundaries are determined by technologies and concepts that do not exist yet. Popper's argument wasn't just "we can't predict the future." It was "the future depends on knowledge we cannot possess now."

  If the validity of the "law" depends on the state of technology (which depends on future knowledge), then the law is provisional. A law that holds only until the next innovation isn't a law; it's a local regularity. Your friend wants to map the cage, but the cage is made of rubber and expands whenever we learn something new. You cannot have a law of the possible when the possible is mutable.

  ### The Surviving Fragment (and its cost)
  There is a stripped-down version of his view that survives this, but it costs him the title he wants.

  **What survives:** *Contextual Institutional Constraints.*
  He can claim that *within a specific technological epoch*, there are functional constraints on social organization. (e.g., "In an industrial economy without digital tracking, central planning requires surveillance.")

  **The Cost:**
  1.  **He loses "History":** These are not laws of history; they are laws of *systems*. They explain stability, not change. Historicism is about the direction of change. He has defended the existence of social physics, not historical destiny.
  2.  **He loses "Necessity":** He has to admit these constraints are contingent on the technological horizon. They are not universal laws; they are epoch-relative regularities.
  3.  **He loses the Anti-Popper Victory:** Popper would agree with this. Popper explicitly allowed for "conditional predictions" and social engineering. He only forbade the claim that we can know the *whole* path of history.

  **The Verdict:**
  Tell him he's right that there are structural constraints on social orders, but he's wrong to call them "laws of history." They are ahistorical engineering constraints that expire when the technology expires. He hasn't refuted Popper; he's just described the kind of piecemeal social science Popper recommended instead of historicism. He won the battle for sociology, but he lost the war for history.
