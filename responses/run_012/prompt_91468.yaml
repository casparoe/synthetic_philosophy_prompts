prompt: |-
  I'm putting together a seminar on privacy and I want to start with the spec rather than the theories, becuase every time we read a new one we end up arguing about wether it's even answering the right question. So: write me the desiderata that any adequate theory of what privacy is and why it matters has to meet. Not the theories themselves -- the requirements list. For each requirement, the case or consideration that forces it, and then say which requirements are non-negotiable and which are just something one camp happens to care about.

  A few things I want the list to have to deal with, since these are the ones that keep breaking the theories we've read:

  - the person who says they've got nothing to hide and genuinely doesn't care who sees their bank statements or their search history. Does the theory say they're right, wrong, or answering a different question?
  - the case I keep calling the Open House: a town where every household, freely and unanimously, installs always-on cameras feeding a public archive. No one is watched by anyone who couldn't already see their house from the street. No one objects, no one is harmed, nothing is hidden that wasn't already visible. Is anything lost here? If the theory can't even ask the question, that's a mark against it.
  - the inference case: every piece of data is public and every person consented to each individual disclosure, but the combination predicts something about you that you never told anyone and never would have. Is that a new privacy event, or just arithmetic on public facts?
  - the privacy paradox: people say they care and then trade it away for a coupon, over and over, and it's not obviously just weakness of will.
  - privacy after death, and privacy for groups -- nobody left to be harmed, or a whole collective whose members each individually have enough privacy while the group has none.

  And one distinction I'd like the list to force a theory to make: is there a real difference between being seen and being modelled -- between someone watching you and a system having a working prediction of you that never needs to watch you again? If that distinction is real, some requirement on the list has to have a slot for it.

  Then say explicitly whether some of these requirements can't be satisfied together. If the list as stated is unsatisfiable, that's the result I most want -- don't paper over it. Also tell me which single requirement does the most work, i.e. knocks out the most otherwise popular accounts. Skip the scorecard against the named theories, I'll do that in class.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of desiderata (requirements) for a theory of privacy.
      *   **Constraint 1:** Start with specs, not theories. Avoid arguing about specific theories (e.g., Control vs. Access).
      *   **Constraint 2:** Address specific edge cases provided by the user (Nothing to Hide, Open House, Inference/Aggregation, Privacy Paradox, Post-Mortem/Group Privacy, Seeing vs. Modeling).
      *   **Constraint 3:** Distinguish between non-negotiable requirements and contingent/camp-specific ones.
      *   **Constraint 4:** Explicitly state if requirements are incompatible (unsatisfiable list).
      *   **Constraint 5:** Identify the single requirement that does the "most work" (eliminates the most popular accounts).
      *   **Tone:** Philosophical, rigorous, seminar-ready, direct.

  2.  **Deconstruct the Edge Cases into Requirements:**

      *   *Nothing to Hide:* A theory must distinguish between *subjective* indifference and *objective* loss. If someone doesn't care, is privacy still violated?
          *   *Draft Req:* Subjective Independence. Privacy status shouldn't depend solely on the subject's current emotional state.

      *   *Open House:* A town chooses total transparency. No coercion, no harm. Is privacy lost?
          *   *Draft Req:* Structural/Environmental Integrity. Privacy isn't just about individual choice; it's about the environment's default state. It must account for the loss of a "private sphere" even if voluntarily surrendered.

      *   *Inference Case:* Public data + Public data = Private secret.
          *   *Draft Req:* Emergent Secrecy. Privacy must cover derived knowledge, not just raw data disclosure. It's about the *result*, not just the *input*.

      *   *Privacy Paradox:* Saying one thing, doing another (trading for coupons).
          *   *Draft Req:* Preference vs. Value. The theory must distinguish between revealed preference (what I do) and normative value (what protects my agency/dignity). It can't just be "privacy is what people choose to protect."

      *   *After Death / Groups:*
          *   *Draft Req (Death):* Post-Mortem Interest. Privacy interests can survive the cessation of consciousness/harm capacity.
          *   *Draft Req (Groups):* Collective Integrity. A group can lose privacy even if individuals retain it (or vice versa).

      *   *Seeing vs. Modeling:*
          *   *Draft Req:* Epistemic State vs. Observational Act. Privacy is about the *state of knowledge* held by others, not just the *act of observation*.

  3.  **Refine and Formalize the Desiderata:**
      *   Need to make these sound like rigorous philosophical constraints.
      *   Need to categorize them (Non-negotiable vs. Contingent).
      *   Need to check for tensions.

      *   *Refinement on "Nothing to Hide":* Call it **Agent-Neutrality**. The violation condition cannot be solely dependent on the agent's occurrent desire for secrecy.
      *   *Refinement on "Open House":* Call it **Contextual Integrity / Structural Availability**. Privacy requires the *availability* of obscurity, not just the *exercise* of it. (This is tricky. If everyone chooses open, is obscurity available? Yes, technically, but socially extinguished.) Let's call it **The Option Condition**. Privacy is lost if the *option* to be private is structurally removed, even if not exercised.
      *   *Refinement on "Inference":* Call it **Non-Additivity**. The privacy status of a proposition $P$ cannot be determined solely by the privacy status of the data set $D$ from which $P$ is derived.
      *   *Refinement on "Paradox":* Call it **Normative Independence**. The value of privacy cannot be reduced to revealed market preferences.
      *   *Refinement on "Death/Groups":* Split these. **Trans-Subjective Scope** (Death) and **Collective Unit** (Groups).
      *   *Refinement on "Seeing vs. Modeling":* Call it **Epistemic Equivalence**. Having a perfect model is equivalent to perfect surveillance for privacy purposes.

  4.  **Evaluate Compatibility (The "Unsatisfiable" Check):**
      *   *Tension 1:* Agent-Neutrality vs. Autonomy (Control Theories). If I *choose* the Open House, did I lose privacy?
          *   If the theory says "Yes, you lost privacy" (Agent-Neutrality), it conflicts with the intuition that autonomy is the root of privacy (Control).
          *   If the theory says "No, you exercised privacy" (Autonomy), it fails the Open House intuition (that something *is* lost when the *environment* changes).
      *   *Tension 2:* Normative Independence vs. Revealed Preference. If people trade privacy for coupons, is it valuable?
          *   If the theory says "It's still valuable" (Normative Independence), it risks paternalism.
          *   If the theory says "It wasn't valuable to them" (Preference), it fails to explain the "Paradox" (that they *should* have cared).
      *   *Tension 3:* Epistemic Equivalence vs. Harm. If a model predicts me but never acts, is it a violation?
          *   If yes, privacy is about knowledge states.
          *   If no, privacy is about consequences.
      *   *The Big Conflict:* **The Open House vs. Agent-Neutrality.**
          *   Open House says: Even if you consent, the *state* of privacy is gone.
          *   Agent-Neutrality says: Your lack of caring doesn't fix the violation.
          *   Combined: Privacy is an objective structural good, not a subjective right.
          *   *Conflict:* This clashes with **Individual Sovereignty** (the idea that I am the sole owner of my privacy and can waive it completely).
          *   *Decision:* I need to highlight that satisfying the "Open House" intuition (structural loss) often violates the "Control" intuition (my choice is final). I will frame this as a tension between *Privacy as a Right* vs. *Privacy as a Public Good*.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the stage. This is a spec sheet, not a product review.
      *   *The List:* Group them logically.
      *   *The "Case/Consideration":* Map the user's specific examples to the requirements.
      *   *Negotiability:* Be sharp here. What is essential to the *concept* vs. what is a *political stance*?
      *   *Incompatibility:* This is crucial. I need to point out that **Individual Control** and **Structural Integrity** are likely mutually exclusive at the limit.
      *   *The "Killer" Requirement:* Which one kills the most theories? Usually, it's the **Inference/Non-Additivity** requirement or the **Epistemic Equivalence** requirement. Control theories fail Inference. Access theories fail Modeling. Let's pick **Non-Additivity (The Inference Case)** because it breaks both simple "secrecy" and simple "control" accounts most effectively. Or perhaps **Epistemic Equivalence** because it breaks the "observation" based theories. Actually, the **Open House (Structural Integrity)** requirement is the hardest for liberal individualist theories to swallow. Let's go with **Structural Integrity** as the heavy hitter because it challenges the fundamental "my data, my choice" paradigm. Wait, the prompt asks for the one that knocks out the most *otherwise popular* accounts. **Non-Additivity** kills the "public data is fair game" argument which underpins most industry and legal frameworks. Let's select **Non-Additivity**.

      *   *Re-evaluating the "Unsatisfiable" constraint:* The prompt says "If the list as stated is unsatisfiable, that's the result I most want."
      *   I need to be honest. Can a theory satisfy *all* of these?
      *   *Conflict:* **Normative Independence** (Privacy matters even if you trade it) vs. **Individual Sovereignty** (It's my privacy to trade).
      *   *Conflict:* **Post-Mortem** (Rights survive death) vs. **Harm-Based** (No subject, no harm).
      *   *Conclusion:* The list is likely *tension-filled* if not strictly unsatisfiable. I will argue that **Individual Sovereignty** (often assumed non-negotiable) is incompatible with **Structural Integrity** (Open House) and **Normative Independence** (Paradox). If we treat Individual Sovereignty as a desideratum, the list breaks. If we treat it as a "camp specific" view, the list holds. I will frame it such that the *tension* is the insight.

      *   *Refining the "Seeing vs Modeling" requirement:* This needs to be explicit. **Observational Neutrality**. The mechanism of knowledge acquisition (watching vs. calculating) is irrelevant to the privacy status of the knowledge held.

  6.  **Final Polish:**
      *   Ensure the tone is academic but punchy.
      *   Make sure the "Nothing to Hide" case is addressed clearly (Subjective Indifference).
      *   Ensure the "Open House" is addressed (Structural vs. Individual).
      *   Check the "Non-negotiable" vs. "Camp" distinction.
      *   Verify the "Incompatibility" section is bold.

      *(Self-Correction during drafting)*: I initially thought about making "Individual Sovereignty" a non-negotiable. But the "Open House" case suggests that sovereignty might be the problem. If everyone votes for cameras, sovereignty is satisfied, but privacy intuition says something is lost. So, **Structural Integrity** must be non-negotiable for a robust theory, which means **Individual Sovereignty** must be demoted to "Camp Specific" or shown to be incompatible. I will make this the core tension.

      *(Self-Correction on "Killer Req")*: The **Inference/Non-Additivity** requirement is the one that currently breaks most legal and technical frameworks (GDPR struggles with this, US law ignores it). It's the most practical "killer." I'll stick with that.

      *(Final check on Unsatisfiability)*: I will argue that **Normative Independence** (Paradox) and **Individual Sovereignty** (Control) cannot both be fully satisfied. If privacy has objective value independent of choice, I cannot fully waive it. If I can fully waive it, it has no objective value independent of choice. This is the "Inalienability" problem.

  7.  **Final Output Structure:**
      1.  Introduction (The Spec Sheet Approach).
      2.  The Desiderata (Numbered, with Case & Status).
      3.  The Incompatibility Theorem (Where the list breaks).
      4.  The Killer Requirement (The biggest filter).

      *Let's write.*
answer: |-
  # Privacy Theory: Specification Sheet v1.0

  This document outlines the functional requirements for any theory claiming to define the nature and value of privacy. It does not propose a theory; it establishes the test suite. A theory that fails a **Non-Negotiable** requirement is defective. A theory that fails a **Contingent** requirement is merely partisan.

  ## I. The Desiderata

  ### 1. Requirement: Subjective Independence
  *   **The Spec:** The status of a privacy violation cannot be determined solely by the subject's occurrent desire for secrecy or their reported level of concern.
  *   **The Forcing Case:** *The "Nothing to Hide" Subject.* An individual genuinely does not care if their bank statements or search history are public. They feel no shame, fear no discrimination, and suffer no anxiety.
  *   **The Test:** Does the theory declare this person's privacy intact because they don't mind, or violated because the *condition* of privacy is absent regardless of their feeling?
  *   **Status:** **Non-Negotiable.** If privacy is merely a preference, it collapses into taste (like preferring vanilla over chocolate). A theory of privacy must explain why we protect it even when subjects are indifferent, or it cannot support rights or norms.

  ### 2. Requirement: Structural Integrity (The Open House Condition)
  *   **The Spec:** Privacy must account for the loss of a private sphere even when the surrender of that sphere is unanimous, voluntary, and coercive-free.
  *   **The Forcing Case:** *The Open House.* A town unanimously installs always-on cameras. No one objects. No one is harmed. Everything visible was already visible from the street.
  *   **The Test:** Can the theory articulate what is lost here? If the theory says "Nothing, because everyone consented," it fails. It must be able to identify the loss of the *environment of obscurity* as a distinct harm from the violation of individual will.
  *   **Status:** **Non-Negotiable.** This distinguishes privacy as a *public good* vs. a *private commodity*. If a theory cannot handle the Open House, it is a theory of contract, not privacy.

  ### 3. Requirement: Non-Additivity (The Inference Condition)
  *   **The Spec:** The privacy status of a derived proposition $P$ cannot be determined solely by the privacy status of the dataset $D$ from which $P$ is inferred.
  *   **The Forcing Case:** *The Inference Case.* Every data point is public. Every disclosure was consented to. The aggregation predicts a secret (e.g., pregnancy, political radicalization) never disclosed.
  *   **The Test:** Does the theory treat the prediction as a new privacy event, or merely as arithmetic on public facts?
  *   **Status:** **Non-Negotiable.** In the information age, raw data is rarely the target; the *profile* is. A theory that protects the brick but not the wall is functionally useless.

  ### 4. Requirement: Normative Independence (The Paradox Condition)
  *   **The Spec:** The value of privacy cannot be reduced to revealed market preferences or behavioral choices.
  *   **The Forcing Case:** *The Privacy Paradox.* Subjects claim to value privacy but trade it repeatedly for trivial benefits (coupons, convenience).
  *   **The Test:** Does the theory conclude privacy wasn't valuable (because they traded it), or that the valuation mechanism is flawed (e.g., asymmetry of information, cognitive bias, structural coercion)?
  *   **Status:** **Contingent (Liberal/Paternalist Split).** A libertarian theory will fail this (preferring revealed preference). A dignity-based or capability-based theory will pass it. However, to explain the *Paradox* as a paradox rather than a contradiction, the theory should ideally meet this.

  ### 5. Requirement: Trans-Subjective Scope
  *   **The Spec:** Privacy interests must be definable for entities that cannot experience harm in the standard sense (the dead) and for collectives where individual privacy remains intact.
  *   **The Forcing Case:** *Death & Groups.* A deceased person's diary is published. A demographic group is profiled accurately while every member's individual data remains anonymous.
  *   **The Test:** Does the theory evaporate privacy rights upon biological death? Does it lack the vocabulary to describe group-level exposure?
  *   **Status:** **Contingent.** Many robust theories restrict privacy to living moral agents. However, a theory that *cannot* even conceptualize post-mortem reputation or group discrimination is descriptively inadequate for modern data ecosystems.

  ### 6. Requirement: Epistemic Equivalence (The Modeling Condition)
  *   **The Spec:** There is no privacy-relevant distinction between *observing* a fact and *possessing a accurate model* of that fact.
  *   **The Forcing Case:** *Seeing vs. Modeling.* A system predicts your location with 99% accuracy without ever tracking your GPS, based on correlation with other users.
  *   **The Test:** Does the theory treat the prediction as a violation equivalent to surveillance?
  *   **Status:** **Non-Negotiable.** If privacy is about control over information *about* the self, the method of acquisition (sensing vs. calculating) is irrelevant. If the theory distinguishes them, it is a theory of *surveillance*, not privacy.

  ---

  ## II. The Incompatibility Theorem

  **The list above is unsatisfiable if you attempt to maximize all Non-Negotiables simultaneously with the principle of Individual Sovereignty.**

  There is a hard tension between **Requirement 1 (Subjective Independence)** / **Requirement 2 (Structural Integrity)** and the unstated but commonly assumed desideratum of **Individual Sovereignty** (the idea that I am the sole owner of my privacy and can waive it completely).

  1.  **The Conflict:** If privacy is Subjectively Independent (Req 1) and Structurally Integral (Req 2), then my consent does not fully "fix" a privacy violation. I cannot consent to the destruction of the structural environment (Open House) in a way that satisfies the theory, because the loss is objective, not subjective.
  2.  **The Consequence:** To satisfy Req 1 and Req 2, the theory must treat privacy as partially **inalienable**. You cannot sell yourself into slavery, and under this spec, you cannot fully sell yourself into transparency.
  3.  **The Break:** If you insist that Individual Sovereignty is Non-Negotiable (i.e., "It's my data, I can burn it"), you **must** fail Requirement 2 (Open House). If the town votes for cameras, a Sovereignty-based theory *must* say privacy is intact. If you say privacy is lost, you have overridden their Sovereignty.

  **Verdict:** You cannot have a theory that respects absolute individual control *and* protects against the Open House. You must choose: Is privacy a **Right** (which can be waived) or a **Condition** (which can be eroded)? This spec forces you to admit they are not the same thing.

  ---

  ## III. The Killer Requirement

  **Requirement 3: Non-Additivity (The Inference Condition).**

  This is the single requirement that eliminates the most otherwise popular accounts.

  *   **Why it kills "Secrecy" Theories:** Secrecy theories define privacy as the state of data being unknown. If the data is public, secrecy is gone. Non-Additivity demands that privacy can exist *over* public data if the *implication* is secret. Secrecy theories fail this.
  *   **Why it kills "Control" Theories:** Control theories define privacy as the ability to choose who gets data. If I consented to the inputs, Control theories say I have no complaint about the output. Non-Additivity says the output is a new object requiring new consent. Control theories fail this.
  *   **Why it kills "Access" Theories:** Access theories focus on the moment of intrusion. Inference happens after the intrusion, often by a third party who never accessed the original data. Access theories struggle to locate the violation in time or space.

  **Why this matters for your seminar:**
  Most legal frameworks (and most tech industry ethics) are built on **Notice and Consent** regarding **Raw Data**. Requirement 3 declares that entire framework conceptually bankrupt. It forces the class to admit that protecting privacy is not about hiding inputs, but about regulating *derivations*. If a theory cannot handle inference, it is a theory for the 1970s, not the 2020s.
