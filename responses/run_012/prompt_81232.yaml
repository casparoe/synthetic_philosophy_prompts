answer: |-
  Here is a draft interview structure designed to build pressure. It starts with methodological groundwork, moves through the explanatory mechanism (freedom), attacks the inference to nature (heritability/structure), and ends on normative stakes and falsifiability.

  The follow-ups are designed to close off "standard academic hedges" (e.g., "it's complex," "we need more data") and force a committed position.

  ### Phase 1: The Phenomenon and the Claim
  *Goal: Lock her into her core thesis before she can expand into a general lecture.*

  **1. Let's start with the measurement, since that's your wheelhouse. Before we talk about what the gender-equality paradox *means*, how confident are we that it's actually *there*? When you compare personality scores or STEM choices across cultures, aren't you fighting a battle against measurement invariance—i.e., ensuring 'ambition' or 'math ability' means the same thing in Norway as it does in Algeria?**
  *   **Follow-up (If she says "The data is robust"):** "Okay, but robustness isn't validity. If the instrument itself is culturally loaded, a 'larger gap' in the Nordics might just mean the instrument works better there, not that the underlying trait is more expressed. Can you rule out that the paradox is an artifact of better measurement in richer countries?"

  **2. Your signature line is that the regularity is likely real, but 'almost nothing follows from it.' I want to pin down that 'nothing.' Do you mean the nativist inference is *false*, or just that it's *unsupported*? Because there's a big difference between saying 'we can't prove it's nature' and 'we have reason to think it isn't.'**
  *   **Follow-up (If she says "It's just unsupported/epistemic"):** "Then why is the burden of proof so asymmetrical? If the data is compatible with both social construction and biology, why do you resist the biological inference more than the social one? Is there a hidden prior here?"

  ### Phase 2: The "Freedom" Mechanism
  *Goal: Attack the coherence of the standard explanation.*

  **3. The popular explanation for the paradox is 'economic security frees people to be themselves.' But as a philosopher of social science, you know 'freedom' isn't a single variable. Nordic countries differ wildly from each other in childcare, parental leave, and labour markets. Is it even coherent to treat 'Nordic' as a uniform environment of freedom?**
  *   **Follow-up (If she says "They are all high on the equality index"):** "But indices aggregate different policies. If Sweden and Finland achieve 'equality' through different institutional structures, yet show the same gender gaps, doesn't that suggest the mechanism isn't 'freedom' generally, but something specific about how those institutions channel choice?"

  **4. I want to test that 'freedom reveals nature' story with a generalization test. If economic security allows 'true' gendered preferences to show through in careers, shouldn't we see the same amplification in low-stakes domains? Do Nordic countries show larger gender gaps in hobbies, consumption, or baby names?**
  *   **Follow-up (If she says "Careers have higher stakes/consequences"):** "Then it's not about *preference* revelation, is it? It's about *risk* assessment. If the gap disappears in low-stakes choices, doesn't that suggest the career gap is driven by how different genders navigate risk and structure, not by deep-seated essential preferences?"

  ### Phase 3: Inference to Nature (The Technical Core)
  *Goal: Press the philosophy of science regarding heritability and environment.*

  **5. Let's talk about the inference to nature. To infer genetic causes from cross-national variance, don't you need to assume the environments are roughly uniform, so that variance maps to biology? But you just agreed Nordic environments are unique. Doesn't the nativist reading require assuming the Nordic environment is a 'neutral baseline,' which is exactly what it isn't?**
  *   **Follow-up (If she says "It's about GxE interaction"):** "Right, but if the environment interacts with the genes, and the Nordic environment is historically unprecedented (high welfare, low scarcity), how can you claim the resulting phenotype reveals 'human nature' rather than 'human nature *plus* a specific welfare state'?"

  **6. Here's a specificity problem I can't resolve. Women in these countries aren't opting out of *science* generally; they are opting out of *physics* and *engineering* while dominating biology and medicine. If this were a general 'freedom reveals nature' effect, why is the sorting so granular? Does the 'which-science-not-whether-science' point undermine the broad biological story?**
  *   **Follow-up (If she says "Different fields require different cognitive profiles"):** "But those profiles are small compared to the variance within sexes. If the sorting is that precise, doesn't it point to field-specific cultures or signalling—social facts—rather than broad biological predispositions?"

  ### Phase 4: Structure vs. Preference
  *Goal: Force a choice between psychological and structural explanations.*

  **7. I've read the argument that in egalitarian countries, 'gender-typical' jobs (like teaching or nursing) offer a decent living and high security, whereas in poorer countries, women are economically pushed toward high-return STEM fields to survive. If that's right, isn't the paradox just about opportunity costs and labour-market structure, not psychology at all?**
  *   **Follow-up (If she says "It's likely a mix of both"):** "I need you to weigh them. If the economic security hypothesis explains the variance without positing hidden essentialist preferences, isn't that the parsimonious choice? Why keep the psychological explanation in the mix if the structural one does the work?"

  **8. You distinguish between 'constraints' and 'preferences.' But preferences are endogenous—they're formed *within* the institutions we're studying. If a Nordic woman 'prefers' care work, but that preference was shaped by a society that still subtly signals care is feminine, is that a free choice in the sense the paradox requires?**
  *   **Follow-up (If she says "All preferences are socially shaped"):** "Then the distinction collapses. If the preference is formed by the very institutions you're citing as 'freeing,' you can't use the preference to justify the outcome. How do you disentangle a 'true' preference from an 'adapted' one?"

  ### Phase 5: Normative Stakes and Falsifiability
  *Goal: Bring it home to policy and scientific integrity.*

  **9. You say the paradox tells us nothing about justice. But political actors *are* drawing conclusions. If your work is cited to oppose quotas or parity programmes, do you think that's a misuse of your argument, or does your 'nothing follows' stance inadvertently license that inaction?**
  *   **Follow-up (If she says "Scientists aren't responsible for misuse"):** "But in social science, the description *is* the intervention. If you publish a result that says 'gaps persist despite equality,' and you don't aggressively preempt the 'biology' inference, aren't you functionally endorsing the status quo?"

  **10. Final question. No 'we need more research' answers. What specific piece of evidence would actually change your mind and make you say, 'Okay, the nativist inference is the best explanation'? Is there a finding that would falsify your skepticism?**
  *   **Follow-up (If she hesitates or says "It's complicated"):** "I'm pressing you on falsifiability. If there's no data that could convince you the differences are biological, then your skepticism isn't scientific, it's ideological. What does that data look like?"
