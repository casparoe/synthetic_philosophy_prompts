answer: |-
  The break room hums with the vending machine's compressor. David's coffee sits untouched on the table, skin forming on the surface. He's back on the ward, charting vitals for Mr. Henderson, who is currently sitting up eating a sandwich.

  "He looked like he'd seen a ghost this morning," Sam says, stirring sugar into his own mug. "Just shaking. Said he felt a weight on his chest before he even clocked in."

  Marcus leans against the counter, arms crossed. "He thought something was wrong. That's what fear is. He assessed the day as threatening."

  "There was nothing to assess," Elena says. She's watching the door. "Nothing had happened. No charts were missing, no alarms. It was just… grey. Like the air pressure dropped."

  "So he judged incorrectly," Marcus says. "He assumed risk where there was none. That's a cognitive error. If he didn't believe something was dangerous, he wouldn't have been afraid."

  "It wasn't a belief," Sam says. "Did you see his hands? He couldn't hold the pen. It's a feeling, Marcus. Like pain. You don't decide to have a headache."

  "Pain has a cause," Marcus counters. "If you touch a stove, you judge it hot. David touched nothing."

  "Maybe he sensed something we didn't," Elena says. "Like smelling smoke before you see the fire. His body picked up on a value—a threat—before his brain caught up. It's a perception."

  "But there was no fire," Marcus says. "Henderson is fine. So what did his body perceive? Nothing. It was a glitch."

  The door opens. David walks in. He looks exhausted. He goes to the sink to dump his cold coffee.

  "Hey," Sam says softly. "You okay?"

  David nods, too quickly. "Yeah. Henderson's stable. Discharge papers are signed."

  David reaches for the clean mug rack. His hand hovers over a blue ceramic cup. He knows it's clean. He washed it himself yesterday. He knows it is just a cup. But his shoulder jerks back, a sharp, violent flinch, as if the cup were a snake. He knocks it to the floor. It doesn't break, just rolls under the table.

  Silence.

  "See?" Marcus says, pointing at the cup. "You knew it was safe. You said so. But you acted like it was dangerous. You judged it as a threat despite your knowledge."

  "I didn't judge anything," David says, his voice tight. "I know it's a cup."

  "Then why recoil?" Marcus presses. "Emotion is an evaluation. You evaluated the cup as dangerous."

  "I didn't!" David's face flushes. "I know it's safe. I know it."

  "Maybe your body evaluated it," Elena says. She crouches to get the cup. "Your system perceived risk. Even if your mind didn't."

  "But it's not risky," Sam says. "It's just a feeling happening to him. Like a spasm. Why does it have to be *about* the cup? It's just… noise. Internal weather."

  "It's not noise," David says. He's staring at the cup under the table. "It felt like the cup was going to hurt me. Not that I was hurt. That *it* was going to do something."

  Marcus rubs his temple. "So you hold two contradictory judgments? That it is safe and that it is dangerous?"

  "No," David says. "I hold one. That it's safe. The other thing… it's not a thought. It's heavy. It's right here." He taps his sternum.

  "But it points at the cup," Elena says. She slides the cup onto the table, away from him. "If it was just weather, why did you flinch at the blue one and not the white one?"

  "Coincidence," Sam says, though he looks unsure. "Or maybe blue reminds him of something."

  "It doesn't," David says. "I just saw it."

  Marcus sighs, checking his watch. "If it's not a judgment, it's irrational. It's lying to you. It tells you danger where there is safety."

  "It's not lying," Elena says. "It's reporting data we don't have yet. Or maybe it's reporting the fragility of things. That cups break. That people leave."

  "It's a cup," Marcus says.

  "It hurt," Sam says.

  David picks up the blue cup. His hand trembles, just slightly. He holds it like it's made of glass, though it's ceramic. He looks at the others, then down at the mug.

  "I know it won't hurt me," David says. "But I can't put it down."

  He keeps holding it. Marcus turns to the coffee machine. Elena watches David's grip. Sam stops stirring his sugar. The spoon clinks against the ceramic, a sharp, small sound. None of them move to take the cup from him.
