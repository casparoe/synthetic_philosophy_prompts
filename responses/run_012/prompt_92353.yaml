          *   **The Asexual/Horizontal Gene Transfer (HGT) Problem:** SAI relies on lineage (genealogy). In bacteria/archaea, lineage is reticulate. If the "individual" is the lineage, what is the individual when the lineage is a network? This threatens the coherence of the "individual" metaphor itself.
          *   **Conservation/Legal Status:** Laws protect *kinds* (types). If a species is an individual, does protecting it mean protecting every part? Or just the continuation of the history? Legal frameworks struggle with SAI.

