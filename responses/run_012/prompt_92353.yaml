  2.  **Deconstruct the Species-as-Individuals (SAI) Thesis:**
      *   *Proponents:* Michael Ghiselin, David Hull, Philip Kitcher (somewhat), John Dupré (pluralist leanings).
      *   *Core Argument:* Species have origins, histories, and endings. They are spatiotemporally localized. Organisms belong to them by virtue of genealogical connection (part-whole), not by satisfying intrinsic properties (membership in a class).
      *   *Implication:* No essential properties. Laws of nature apply to kinds, not individuals. Therefore, no "laws of biology" involving species names.

  3.  **Brainstorming Defeaters (Categorization & Sorting):**

