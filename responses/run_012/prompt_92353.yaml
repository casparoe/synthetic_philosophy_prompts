      *   **Core View:** The user holds the "Species-as-Individuals" (SAI) thesis (Ghiselin, Hull, etc.). Species are concrete historical individuals (lineages), not natural kinds. Higher taxa are also individuals. Pluralism about species concepts is benign because the "species problem" stems from a category mistake.
