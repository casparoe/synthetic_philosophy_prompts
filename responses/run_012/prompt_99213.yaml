          5.  Closing statement (conditions for abandonment, assessment of opponent's argument).
      *   **Tone:** Philosophical, precise, collaborative but adversarial, acknowledging impasses.

  2.  **Deconstruct the Positions:**
      *   **Constitutionalist (C):** Distinct objects. Statue (Rider) $\neq$ Bronze (Lump). Different persistence conditions (statue can survive part replacement; lump cannot survive melting). Different modal properties.
      *   **Identity Theorist (I):** One object. "Statue" and "Bronze" are concepts/modes of presentation applied to the same entity. Apparent differences are due to sortal-relative identity or loose talk. Melting destroys the object *simpliciter*.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need strong claims that rule out easy outs (e.g., eliminativism, nihilism).
