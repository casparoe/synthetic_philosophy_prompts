answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY OF RIDER**
  **Submitted by the Constitutionalist Party and the Identity Theorist Party**

  **1. AGREED CLAIMS AND GROUND RULES**

  We, the undersigned parties, submit this statement to clarify the nature of our disagreement regarding the material constitution of the artifact known as *Rider*. We agree to the following premises and constraints to ensure our dispute is substantive and focused:

  1.  **The Case Facts:** We accept the historical record as established: *Rider* was cast in 1873 from melted cannon bronze; a rear leg was replaced in 1958 with non-original bronze; and a 2021 proposal exists to melt the current object and recast it using the original mould. We accept that museum records fluctuate between referring to *Rider* (the artwork) and "the bronze" (the material), sometimes treating the latter as an independent object of insurance, analysis, or restitution.
  2.  **Logic and Counting:** We agree that the Law of Non-Contradiction holds and that counting objects requires clear identity conditions. We agree that if $x$ and $y$ have different properties, they are not identical (Leibniz's Law). We disagree only on whether *Rider* and "the bronze" possess different properties or merely different descriptions.
  3.  **Existence:** Neither party is an eliminativist. We agree there is something on the pedestal. The Constitutionalist holds there are two coincident things; the Identity Theorist holds there is one thing described in two ways. Neither party claims the other is speaking nonsense; we claim the other is misinterpreting the data.
  4.  **Concessions on Language:**
      *   The **Constitutionalist** concedes that in ordinary non-philosophical contexts, saying "The statue is the bronze" is rarely misleading and often pragmatically required. We agree not to argue that common speech is strictly false, only that it is ontologically imprecise.
      *   The **Identity Theorist** concedes that museum administrative practices (insurance, restitution) treat the material and the artifact as functionally distinct. We agree not to dismiss these practices as mere bureaucratic error, but insist they track distinct *interests* in a single entity, not distinct *entities*.
  5.  **Scope:** We agree to bracket questions of temporal parts (perdurantism) unless directly relevant to the 1958 repair. We focus on synchronic constitution and persistence conditions.

  **2. DISAGREEMENTS TABLE**

  For the following sub-questions, we provide our respective positions. Each formulation has been vetted by the opposing party to ensure it is not a strawman.

  | Sub-Question | Constitutionalist Position | Identity Theorist Position |
  | :--- | :--- | :--- |
  | **1. How many material objects stand on the pedestal?** | **Two.** There is a statue (*Rider*) and a quantity of bronze matter. They share spatial location but differ in kind. | **One.** There is a single object that falls under the sortal "statue" and is composed of bronze. "The bronze" is not a second object, but the first object described materially. |
  | **2. Did the 1958 leg replacement alter the statue, the bronze, both, or neither?** | **The bronze only.** The quantity of matter changed (some atoms removed, others added). *Rider* persisted because artistic continuity was maintained. | **The object (under a material description).** The single object underwent change. To say it altered "the bronze" but not "the statue" is to speak loosely; strictly, the object survived the replacement of parts. |
  | **3. Would the 2021 melting proposal destroy *Rider* while leaving the bronze intact?** | **Yes.** Melting destroys the artistic form and history required for *Rider*. The bronze matter persists (as molten metal) and remains available for recasting. | **No.** Melting destroys the single object. There is no "bronze" left intact that is distinct from the object destroyed. The molten metal is a new object, not the survival of the old one. |
  | **4. Could the descendants be given "the bronze" while the museum kept *Rider*?** | **Yes, in principle.** Ownership of the matter can be transferred (e.g., by handing over the ingots post-melting) while the museum retains rights to the artistic form (e.g., by recasting a duplicate). | **No.** Transferring the matter *is* transferring the object. You cannot give away the constituent without giving away the thing constituted. The museum would have to keep a replica, not *Rider*. |
  | **5. Is the claim "Rider is the bronze that was once a cannon" strictly true?** | **False.** *Rider* is *constituted by* the bronze that was once a cannon. Identity is transitive; if *Rider* = Bronze and Bronze = Cannon-stuff, then *Rider* = Cannon-stuff, which is false (the cannon was not a horse). | **True.** Identity is relative to sortals or descriptions. Strictly speaking, the object is identical to the matter it comprises. The apparent contradiction arises from ignoring the sortal context. |

  **3. CRUCES AND EVIDENTIARY PREDICTIONS**

  We identify three specific cruxes where our theories diverge on how to interpret evidence. We record our predictions here to allow for future testing against actual museum practice or legal outcomes.

  *   **Crux A: Insurance Valuation**
      *   *The Issue:* Can the material value and the artistic value be insured separately?
      *   *Constitutionalist Prediction:* Policies should and do allow separate valuation (scrap value vs. art market value). This tracks two distinct properties belonging to two distinct entities.
      *   *Identity Theorist Prediction:* Policies assign a single value based on the object's maximum utility. Separate lines for "material" and "art" are accounting fictions to manage risk, not ontological distinctions.
      *   *Shared Test:* Review the 1958 insurance adjustment. If the payout distinguished between "loss of material" and "loss of artistic integrity" as separate claims, this favors the Constitutionalist. If it was a single claim for "damage to object," this favors the Identity Theorist.

  *   **Crux B: Restitution of the Cannon**
      *   *The Issue:* The descendants demand "the bronze."
      *   *Constitutionalist Prediction:* The claim can be satisfied by returning equivalent mass (ingots) without returning *Rider*. The museum can argue it no longer holds "the bronze" (the specific cannon matter) due to 1958 mixing, while still holding *Rider*.
      *   *Identity Theorist Prediction:* The claim is for *this* object. If the 1958 repair means the object is no longer "the cannon bronze," the museum cannot return it without destroying *Rider*. The demand forces a choice: return the object or deny the claim.
      *   *Shared Test:* Legal opinion on whether mixing (1958) voids the restitution claim. If the law treats the 1958 bronze as "new matter" that breaks the chain for the cannon claim but not for the art claim, this favors the Constitutionalist.

  *   **Crux C: The Recast Replica**
      *   *The Issue:* If melted and recast in 2021, is the result *Rider*?
      *   *Constitutionalist Prediction:* No. The new object is numerically distinct because the causal history of the original *Rider* is broken. The bronze matter is continuous, but the statue is not.
      *   *Identity Theorist Prediction:* Ambiguous, but leans toward No. However, the *reason* is the same for both matter and statue. If the object is destroyed, it is gone. There is no scenario where the bronze survives but the statue does not.
      *   *Shared Test:* Curatorial classification of the recast. If labeled "Rider (2021 version)" vs "Copy of Rider."

  **4. VERDICT ON VERBAL VS. SUBSTANTIVE DISPUTE**

  We have debated whether our disagreement is merely verbal (a difference in how we use the word "object") or substantive (a difference in how the world is).

  *   **Joint Verdict:** The dispute is **substantive regarding norms, but potentially verbal regarding ontology.**
      *   We agree that if the dispute were *merely* verbal, it should dissolve upon clarifying terms. It does not. The Constitutionalist insists that even if we change the vocabulary, the *modal differences* (what can happen to the statue vs. the bronze) remain real features of the world that require explanation. The Identity Theorist insists these modal differences are features of our *concepts*, not the world.
      *   **On "Portions of Matter":** We considered reframing the dispute by talking about "portions of matter" rather than "lumps."
          *   The **Identity Theorist** argues this dissolves the problem: There is one portion of matter arranged horse-wise. Counting two is a category mistake.
          *   The **Constitutionalist** argues this merely relocates the disagreement: A "portion of matter" is exactly what we call the second object. Calling it a "portion" does not explain why it has different persistence conditions than the statue it composes.
      *   **Conclusion:** We agree that the disagreement resists a shared formulation because we disagree on what counts as "ontological commitment." The Constitutionalist views the museum's distinct treatment of art and material as evidence of distinct existents. The Identity Theorist views it as evidence of distinct human interests projected onto a single existent. We cannot agree on whether "interest" creates "object."

  **5. CLOSING STATEMENT ON ABANDONMENT AND BURDEN**

  **Constitutionalist Condition for Abandonment:**
  I would abandon my position if it could be demonstrated that the modal properties I attribute to *Rider* (e.g., "could survive loss of a leg") are not genuine properties of an object, but merely shorthand for counterfactuals about human practices. If I am shown that "persistence" is entirely a matter of social convention with no metaphysical anchor, the need for two objects vanishes.
  *Assessment of Opponent:* I regard the Identity Theorist's central argument as more than a burden-shifting move. They correctly identify that positing two objects creates a "proliferation" problem. However, I believe they solve it by denying data (the distinct persistence conditions) rather than explaining it.

  **Identity Theorist Condition for Abandonment:**
  I would abandon my position if it could be shown that normative practices (law, conservation, insurance) *require* the counting of two objects to function coherently. If I am shown that treating *Rider* and "the bronze" as one leads to logical contradictions in legal title or conservation ethics that cannot be resolved by sortal-relativity, I must concede there are two objects.
  *Assessment of Opponent:* I regard the Constitutionalist's central argument as a burden-shifting move disguised as common sense. They assert that because we *talk* and *act* as if there are two, there *are* two. I argue this infers ontology from pragmatics. However, I acknowledge their pressure on the 1958 repair case is the strongest challenge to my view, as it forces me to explain how one object can change materially while staying identical without invoking "stages."

  **Final Note on Impasse:**
  Where we talk past each other is on the definition of "strictly true." The Constitutionalist uses "strictly" to mean "mind-independent." The Identity Theorist uses "strictly" to mean "univocal within a sortal." Until we agree on whether truth is mind-independent in this domain, the table in Section 2 will remain a record of translation failure rather than resolved conflict. We sign this not to declare a winner, but to mark the boundary of the disagreement precisely.

  **Signed,**

  *The Constitutionalist Party*
  *The Identity Theorist Party*
