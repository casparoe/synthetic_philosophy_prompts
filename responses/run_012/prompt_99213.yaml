      *   *Q3: 2021 Proposal.* C: Destroys Bronze (and thus constitutes a new one?), destroys Rider? Actually, if melted, Rider ceases. If recast, is it Rider? C usually says no (history broken). I says if recast in same mould, maybe it's the same? No, I usually says melting destroys the object. Let's stick to the prompt: "destroy Rider while leaving the bronze intact." C: Melting destroys Rider, Bronze survives as molten pool? Or Bronze survives as matter? I: Melting destroys the single object.
      *   *Q4: Descendants claim.* C: Yes, they can have the matter; Museum keeps the art. I: No, giving the matter *is* giving the object.
      *   *Q5: "Rider is the bronze..."* C: False (strictly). I: True (strictly).

  5.  **Drafting Section 3: Cruxes & Evidence:**
      *   What counts as evidence? Museum practice, intuition pumps, legal/insurance records.
      *   *Crux 1: Insurance/Valuation.* C predicts separate values possible. I predicts single value assigned to the entity.
      *   *Crux 2: Restoration Ethics.* C predicts different rules for "preserving the work" vs "preserving the material." I predicts these are always the same rule described differently.
      *   *Crux 3: The Cannon Claim.* C predicts the claim can be satisfied by giving equivalent mass. I predicts the claim is for *this* specific object.

  6.  **Drafting Section 4: Verbal vs. Substantive:**
      *   This is the hardest part. Usually, these disputes end in "just verbal."
