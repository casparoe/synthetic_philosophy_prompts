          *   I: True. Identity is transitive.

      *   *Refining the "Verbal vs Substantive" section:* This needs nuance. If it were merely verbal, why do the insurance policies differ? The Constitutionalist will say the policies track real distinct entities. The Identity Theorist will say the policies track distinct *interests* in one entity. This is a substantive disagreement about the world vs. our interests. I should characterize this as a disagreement about whether our practices *track* ontology or *construct* it.

      *   *Refining the "Portions of Matter" point:* The prompt asks specifically about reframing in terms of portions of matter.
          *   C: Portions of matter are the "bronze." Rider is an object. Still two.
          *   I: "Portion of matter" is just a way of talking about the object under a material description. Dissolves the counting problem.

  9.  **Final Review against constraints:**
