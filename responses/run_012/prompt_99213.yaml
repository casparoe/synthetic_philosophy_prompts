      *   *Check:* Is the 1958/2021 case integrated? Yes, ensure specific details (cannon origin, leg replacement) appear in the agreed facts.
      *   *Check:* Is the Identity Theorist a strawman? Make sure they don't just say "it's one thing." They need to explain *why* the appearance of two is misleading (sortals).
      *   *Check:* Is the Constitutionalist a strawman? Make sure they don't just say "magic." They need to lean on modal differences and museum practice.
      *   *Specific constraint:* "Whether the 2021 proposal would destroy Rider while leaving the bronze intact."
          *   C view: Melting destroys Rider. The bronze (matter) persists as molten metal. So yes, destroys Rider, leaves bronze (as stuff) intact.
