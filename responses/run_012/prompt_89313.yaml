answer: |-
  Based on the pattern of your friend's past verdicts, here is the analysis of his likely response, the rule he is following, and how to test it.

  ### 1. The Verdict
  Your friend will almost certainly say this is **legitimate history**.

  ### 2. The Rule He Is Running
  Your friend is operating on a **Methodological and Institutional Rule**, not a Consensus Rule.

  While it might look like he follows consensus (since pseudohistory usually contradicts experts), his specific qualifiers reveal that he cares more about *how* a claim is argued and *where* it is published than whether it aligns with current expert opinion.

  *   **Evidence for Method over Consensus:** The clearest indicator is his verdict on ancient documents. He explicitly states that claiming documents were forged is legitimate **"even when it challenges the consensus."** This directly rules out a strict Consensus Rule. If challenging consensus were the marker of pseudohistory, he would have to classify that claim as pseudo.
  *   **Evidence for Institutional Vetting:** His verdict on the "Lost City" draws a hard line based on publication venue. An amateur's satellite reading is pseudohistory; a peer-reviewed publication is legitimate. This prioritizes the *process of validation* (peer review) over the *content of the claim* (finding a city).
  *   **Evidence for Revisionism:** His acceptance of the "Norse arrival" (once fringe, now accepted) and the "Dark Ages" (revisionist view) shows he accepts that the consensus can be wrong, provided the new view is evidence-based.

  ### 3. The Closest Precedent
  There are two key precedents, but one is decisive:

  *   **The Structural Precedent:** The **"Lost City"** verdict. This matches the new case's specific conditions: a discovery claim vetted through a **peer-reviewed journal** by a **credentialed expert**. Your friend explicitly tied legitimacy to these two factors in that case.
  *   **The Logical Precedent:** The **"Ancient Documents Forged"** verdict. This is the decisive precedent because it addresses the "contradicts specialists" element. Since he already accepts that challenging consensus is legitimate *if* the claim is about forgery (a specific evidentiary claim), he must logically accept challenging consensus about a city's function *if* the evidentiary method is sound.

  ### 4. What Each Rule Predicts
  This new case is a "stress test" because it separates the two rules you identified.

  *   **The Consensus Rule Prediction:** **Pseudohistory.**
      *   *Reasoning:* The claim contradicts "almost every other specialist." If legitimacy is defined by agreement with the settled judgment of the field, this claim fails, regardless of how careful the argument is.
  *   **The Methodological Rule Prediction:** **Legitimate History.**
      *   *Reasoning:* The author is credentialed, the article is peer-reviewed, the evidence is standard, and counterarguments are engaged. The *process* is sound. Under this rule, being wrong does not make one a pseudohistorian; using bad methods does.

  Since your friend's past verdicts (specifically "Documents Forged" and "Lost City") align with the Methodological Rule, he will predict **Legitimate History**.

  ### 5. The Best Test Case
  To prove definitively which rule he is committed to, you need a case where **Method and Consensus point in opposite directions.** The current case leans heavily toward Method (due to peer review), but a skeptic might argue the "contradicts every specialist" part still triggers his Consensus alarm.

  You need a case where the Consensus is *with* the claim, but the Method is *flawed*.

  **Proposed Test Case:**
  > "A popular historical theory that is accepted by 90% of specialists (Consensus) is defended in a new book by a credentialed historian. However, an investigation reveals the historian knowingly cherry-picked data and ignored contradictory sources to make the argument fit the accepted view (Bad Method)."

  *   **If he says "Legitimate History":** He is a **Consensus Rule** follower. He believes that arriving at the "correct" (consensus) conclusion validates the work, even if the methodology was dishonest or flawed.
  *   **If he says "Pseudohistory":** He is a **Methodological Rule** follower. He believes that bad faith or flawed methodology makes the work pseudohistory, even if the conclusion happens to match what experts believe.

  **Why this works:**
  In his previous verdicts, bad method (aliens, electrical devices) always coincided with non-consensus conclusions. This test case decouples them. If he calls it pseudohistory because the *method* was bad (cherry-picking), it confirms he is committed to the integrity of the process over the popularity of the conclusion. Given his distinction between "myth" (Library of Alexandria) and "pseudohistory" (Holocaust denial/Electrical devices), he seems sensitive to *how* errors are made. If the error is methodological dishonesty, he should classify it as pseudohistory, regardless of consensus.
