  # Q&A Prep Sheet: Conditional Decisiveness

  ### 1. The Formal Cheat (Econ Grad Students & Chair)
  *   **Q:** "You've moved the domain restriction from the axiom to the procedure. Mathematically, excluding profiles mid-stream is isomorphic to excluding them ex ante. You haven't solved Sen; you've just hidden the restriction. Where is the proof this isn't cheating?"
  *   **A:** The distinction lies in endogeneity. Exogenous restrictions ban types of people or preferences universally. My filter applies dynamically based on the profile's internal structure. It's not banning 'meddlesome' agents; it's banning 'meddlesome' inputs in specific contexts. This preserves Universal Domain formally—the function accepts all profiles—while ensuring the output respects liberty. It's a mapping solution, not a domain solution.
  *   **Soft Spot:** I lack the formal lemma showing this doesn't violate the spirit of UD. The Chair will spot the isomorphism.

  ### 2. The Paternalism Trap (Feminist Philosopher)
  *   **Q:** "You say you only filter outcome-dependent preferences, but 'adaptive' is slippery. By laundering preferences, you're privileging an idealized rational agent over real women's lived choices. Isn't this just paternalism with extra steps?"
  *   **A:** I am not judging the content of the preference (e.g., 'women should stay home'), but its dependency structure (e.g., 'I prefer A only if you choose B'). This respects actual choices while filtering out preferences formed strategically by the social outcome itself. It aligns with meta-preferences: what agents would choose if their choice wasn't constrained by the very issue at hand.
  *   **Soft Spot:** Distinguishing outcome-dependency from internalized oppression is theoretically messy.

  ### 3. Rights as Trumps (Rawlsian)
  *   **Q:** "If a right is conditional on passing a test, it's not a right. You're making liberty contingent on social approval of the preference structure. That destroys the deontological force of liberalism."
  *   **A:** Rights protect the integrity of the personal sphere, not every whim within it. If a preference is shaped by the social outcome, it violates the boundary of that sphere. Conditional decisiveness ensures the right protects *you*, not your manipulation by others. It strengthens the trump by ensuring it isn't played against itself in a paradoxical loop.
  *   **Soft Spot:** Sounds like I'm redefining rights to fit the model.

  ### 4. Domination Concern (Republican)
  *   **Q:** "If the aggregator decides which preferences are 'clean', doesn't that give them arbitrary power over me? That's domination."
  *   **A:** The filter is algorithmic, public, and rule-based, not discretionary. No specific agent holds the power to veto; the procedure does. Non-domination requires protection from arbitrary interference, which this guarantees by removing human discretion from the filtering process.
  *   **Soft Spot:** Who writes the rules?

  ### The Question I Hope Nobody Asks
  *   **Q:** "Who implements the filter? If it's part of the social choice function, isn't the function deciding which preferences exist? Isn't that circular?"

  ### Confidence & Weakness
  *   **Ranking Confidence:** High. The formal objection is the most lethal to the model's validity; the normative ones are debatable.
  *   **Least Sure Reply:** The Formal Cheat. I'm not a formal methods person, and the Chair knows it. If they demand the lemma, I'm exposed.
