answer: |-
  (a) **Examination Question**

  **Essay Question**

  John Stuart Mill's defence of British rule in India appears to contradict his anti-paternalist principle in *On Liberty*, yet scholars propose three distinct reconciliations: the *scope-restriction* reading (the harm principle governs only civilized communities), the *tutelage* reading (despotism is a temporary school for capacity-building), and the *non-ideal-theory* reading (administration focuses on competence under alien rule rather than ideal legitimacy).

  Write an essay that adjudicates among these three readings. In doing so, you must address two specific complications: first, determine whether the 'civilised-community' qualifier is a conceptual restriction (the principle does not apply) or a prudential one (the principle applies but cannot be enforced); second, assess whether the tutelage argument has a determinable terminus or risks becoming unfalsifiable given the tutor's vested interest.

  Finally, do not simply conclude whether Mill was consistent or inconsistent. Instead, evaluate whether the harm principle—a rule for power over individuals within a community—is the appropriate frame for assessing relations between communities. What counts as 'consistency' depends on whether this framing is valid.

  ***

  (b) **Model Answer**

  To adjudicate Mill's position on India, one must first distinguish the three reconciliations not as mutually exclusive excuses, but as layers of his political thought. The scope-restriction reading posits that the harm principle is internally limited to those capable of reciprocal liberty. The tutelage reading accepts coercion but justifies it instrumentally as education. The non-ideal reading shifts the metric from legitimacy to administrative competence. A robust defence of Mill requires navigating the tension between these layers without collapsing them into a simple charge of hypocrisy.

  The critical distinction regarding scope is whether the exclusion of 'uncivilised' peoples is conceptual or prudential. If conceptual, Mill argues that liberty is a good only for those in the 'maturity of their faculties'; thus, applying the harm principle to India would be a category error, like applying traffic laws to pedestrians. There is no inconsistency because the principle's domain does not extend there. If prudential, the principle applies universally, but immediate enforcement would cause greater harm. This creates a vulnerability: if the restriction is merely prudential, the delay in applying liberty requires constant justification. Mill's developmental psychology suggests he leans toward the conceptual view—liberty is functionally useless without the capacity for improvement. However, this relies on a rigid definition of 'civilisation' that risks becoming a tautology: a people are free when they are like us, and they are like us when they are free.

  This leads to the problem of the tutelage argument's terminus. If despotism is a school, graduation must be possible. However, if the tutor (the British administration) sets the curriculum and grades the exams, the arrangement is structurally unfalsifiable. Mill worked for the East India Company, an entity with a vested interest in the school's continuation. Without an independent check on what constitutes 'maturity,' the tutelage argument can indefinitely defer self-government. A consistent Millian would require a mechanism for the pupil to demonstrate readiness that the tutor cannot veto. Mill's support for representative institutions for British settlers in India, contrasted with his hesitation for the native population, suggests the terminus was often moved by cultural bias rather than objective capacity, undermining the instrumental justification of despotism.

  The non-ideal theory reading offers the strongest defence of Mill's practical work. It suggests that in the context of conquest, the primary moral question is not 'is this coercion legitimate?' (it clearly is not, by liberal standards) but 'is this coercion benevolent and competent?' Here, Mill argues that British rule prevents local despotisms and ensures order. This bypasses the harm principle by treating empire as a state of exception where the goal is damage limitation rather than liberty maximisation. While this saves Mill from logical contradiction, it concedes that liberal principles cannot govern imperial relations directly.

  This concession points to the final, meta-theoretical demand: is the harm principle the right frame for empire? The harm principle regulates power over individuals within a sovereign community. Empire, however, is a relation between communities or a suspension of sovereignty. Applying a domestic principle to an international reality is a category mistake. If we accept this, Mill is 'consistent' only in the sense that he consistently applied a domestic ethic to a foreign context where it did not fit. He sought to humanise empire using tools designed to limit the state, not to dismantle it.

  Therefore, the charge of inconsistency misses the deeper structural flaw. Mill is logically consistent within his developmental framework, but that framework fails to account for the conflict of interest inherent in imperial tutelage and misapplies individual-centric ethics to collective subjugation. True consistency would require acknowledging that the harm principle cannot legitimise rule over those excluded from its protection, regardless of the benevolence of the administrator. The failure is not in Mill's logic, but in the liberal imagination's inability to conceive of international relations without hierarchy.

  ***

  (c) **Marking Scheme**

  **Total Marks: 20**

  **1. Distinction and Adjudication of the Three Readings (4 marks)**
  *   **Requirement:** Clearly defines scope-restriction, tutelage, and non-ideal theory and evaluates their relationship (e.g., as layers or alternatives).
  *   **Characteristic Error:** Conflating the readings (e.g., treating tutelage as identical to scope-restriction) or describing them without adjudicating which offers the strongest defence.

  **2. Conceptual vs. Prudential Restriction Analysis (4 marks)**
  *   **Requirement:** Explicitly distinguishes whether the 'civilised' qualifier limits the *application* of the principle (conceptual) or the *timing* of its enforcement (prudential) and explains the stakes of this distinction.
  *   **Characteristic Error:** Treating the distinction as merely semantic without explaining how a prudential reading opens Mill to charges of hypocrisy while a conceptual reading does not.

  **3. Tutelage Terminus and Vested Interest (4 marks)**
  *   **Requirement:** Addresses the 'unfalsifiability' problem: identifies that the tutor setting the maturity criterion creates a conflict of interest that risks indefinite rule.
  *   **Characteristic Error:** Describing the tutelage argument without critiquing the lack of an independent check on the tutor's judgment or ignoring the East India Company context.

  **4. Critique of the Harm Principle as a Frame (4 marks)**
  *   **Requirement:** Engages with the meta-question of whether a principle governing individual-state relations is appropriate for inter-community/imperial relations.
  *   **Characteristic Error:** Accepting the harm principle as the correct metric for empire without questioning the category error of applying domestic liberty norms to foreign conquest.

  **5. Nuanced Conclusion on Consistency (4 marks)**
  *   **Requirement:** Avoids a binary 'consistent/inconsistent' verdict; instead defines what consistency means in this context (e.g., logical coherence within a flawed framework vs. moral coherence).
  *   **Characteristic Error:** Concluding simply that "Mill was a hypocrite" or "Mill was consistent" without qualifying how the framing of the question dictates that conclusion.

  **Differentiation:**
  A **first-class answer** will synthesize these five points, showing how the frame critique (Point 4) fundamentally alters the assessment of consistency (Point 5), rather than treating them as separate checklist items. A **solid second-class answer** will cover all five points competently but will treat them as discrete tasks, lacking the synthetic argument that connects the category error to the specific failures of the tutelage reading.
