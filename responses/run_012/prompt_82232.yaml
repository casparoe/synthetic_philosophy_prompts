answer: |-
  **MEMORANDUM**

  **TO:** Curriculum and Assessment Committee
  **FROM:** [Your Name]
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation Regarding Year 11 "Spot Test" Policy

  **1. Executive Summary**

  This memo recommends that the school **retain the pedagogical practice** of unscheduled half-termly assessments for Year 11 but **revise the public wording** of the announcement. We should reject the Student Council's call to withdraw the practice, as it demonstrably aids revision habits. We should also reject the Head of Maths' preference for the status quo wording, as it invites logical challenges that undermine trust. Finally, we should reject the sealed-envelope proposal; it adds administrative burden without resolving the underlying epistemic tension.

  The recommended course is to frame the assessment as a **policy of discretionary scheduling** rather than a logical guarantee of unpredictability. This preserves the educational benefit while removing the claim that students are invited to dissect.

  **2. Analysis of the Student Proof**

  The proof produced by the top-set maths class is a formulation of the "Unexpected Examination Paradox." It is not a "schoolboy howler," nor is it trivial. It correctly identifies a tension between self-referential announcements and deductive reasoning.

  **What the proof shows:**
  The students' reasoning demonstrates that the announcement ("There will be a test you cannot deduce in advance") cannot be *known* to be true by the students prior to the test week. If they accept the announcement as a premise, they can logically deduce that no day is possible. Therefore, they cannot *know* the announcement is true.

  **Where the proof fails (and why the test still works):**
  The proof fails to prevent the test from actually occurring. It conflates *deducibility* with *possibility*.
  1.  **The Premise Problem:** The students treat the teacher's announcement as a known truth they can use in calculations. However, the truth of the announcement is only verifiable *after* the test occurs. Until then, it is merely a statement of intent.
  2.  **The Empirical Override:** When the test occurs on Wednesday, the students are, in fact, unable to deduce it beforehand (as evidenced by their surprise). The event proves the announcement true, even if their logic suggested it was impossible.
  3.  **The Limit of Knowledge:** The proof shows that the students cannot *prove* the test will be unforeseeable. It does not show that the test *will be* foreseeable.

  **Commitment:** By keeping the current wording, we commit to a statement that is logically vulnerable. By changing the wording, we commit to a statement of policy intent that is empirically verifiable but logically inert.

  **3. Evaluation of the Sealed-Envelope Proposal**

  A colleague has proposed sealing the date in an envelope on Day 1. While this ensures the date is metaphysically fixed and unknown to the teacher, I advise against it for two reasons:

  1.  **It strengthens the students' logic:** The paradox relies on the date being fixed at the start of the week. If the date is drawn on Day 1 and sealed, the backward induction argument (it can't be Friday, therefore it can't be Thursday...) applies *more* rigorously, not less. The envelope solves nothing regarding the logic.
  2.  **It misses the pedagogical point:** Your intuition is correct. The value of the spot test lies in the students' *belief* that the test could be any day, which drives daily revision. The envelope turns the test into a lottery draw. If students believe the date is fixed on Day 1, they may gamble on the probability distribution rather than revising daily. The current ambiguity regarding the teacher's discretion is more effective for continuous engagement than a fixed, hidden date.

  **4. Addressing Colleagues' Positions**

  We have two entrenched views on the committee. Both require acknowledgement to move forward.

  *   **To the colleague who argues the announcement is self-defeating:** You are logically correct that the announcement cannot be *known* to be true in advance. However, school policy is not a logical system; it is a behavioural tool. The announcement functions as a *performative* statement (like "I promise") rather than a descriptive fact. It creates the conditions for its own truth by altering student behaviour. We can accommodate your concern by removing the claim of "unpredictability" and replacing it with "discretionary scheduling."
  *   **To the colleague who argues the students' proof is a howler:** It is not. Dismissing it as such risks alienating high-achieving students and damaging the school's reputation for intellectual rigour. The students identified a genuine epistemic limit. We should praise their reasoning while explaining that educational policy operates on empirical efficacy, not logical necessity. Dismissing them invites cynicism; engaging with them builds trust.

  **5. Recommendation and Wording**

  I recommend we adopt a wording that focuses on the *requirement for readiness* rather than the *impossibility of prediction*. This sidesteps the paradox while maintaining the pressure.

  **Proposed Wording for Governors and Student Handbook:**
  > "To encourage consistent revision and reduce exam anxiety, Year 11 subject teachers reserve the right to schedule one assessed task per half-term on any instructional day without specific prior notice. Students are expected to maintain readiness for assessment at all times during the half-term. The specific timing of these tasks is at the teacher's discretion and will not be announced in advance."

  **Why this works:**
  *   It removes the claim "You will not know," which invites logical attack.
  *   It replaces it with "We will not tell you," which is a simple statement of fact.
  *   It shifts the burden from the teacher (guaranteeing surprise) to the student (maintaining readiness).

  **6. Implementation Timeline**

  *   **Decision Date:** This Committee to ratify by [Date, e.g., 15 June].
  *   **Governor Approval:** Submit to Resources Committee by [Date, e.g., 20 June].
  *   **Communication:** Head of Year 11 to address the top-set maths class (and assembly) to acknowledge the quality of their proof before explaining the policy refinement. This turns a conflict into a teaching moment.
  *   **Launch:** New wording effective for the Autumn Term [Year].

  **7. Conclusion**

  The "Spot Test" is a valuable tool for combating cramming. The students' proof is a sophisticated critique of the *wording*, not the *practice*. By refining the announcement to reflect teacher discretion rather than logical unpredictability, we honour the students' intellect, satisfy the Maths Department's pedagogical needs, and protect the school from accusations of dishonesty.

  I look forward to discussing this at the meeting.

  [Signature]
