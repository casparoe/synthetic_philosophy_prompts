      *   Needs to show respect for the students' intellectual effort (they proved a theorem, essentially).
      *   Needs to be practical for governors.

  8.  **Deep Dive into the "Worry" (Epistemic vs. Metaphysical):**
      *   The user worries the envelope solves metaphysical unpredictability but loses the epistemic pressure.
      *   Actually, the envelope makes it *worse* for the paradox. If the date is drawn Day 1, the date is fixed. The students know the date is fixed. The backward induction applies *more* strongly because there's no teacher whim involved.
      *   The current system relies on the teacher's *discretion*. Discretion breaks the chain of deduction better than a sealed envelope.
      *   *Key Point to make:* The "surprise" isn't a logical guarantee; it's a psychological state. The policy should aim for the psychological state, not the logical guarantee.

  9.  **Final Polish:**
