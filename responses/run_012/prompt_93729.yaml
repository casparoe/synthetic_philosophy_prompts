prompt: |-
  I've been arguing with my cousin about this for weeks and we've both run out of steam. He says a government that makes people richer and keeps the streets safe has earned the right to rule, democracy or not, full stop — and honestly his numbers are good. I say thats not legitimacy, thats a hostage situation with good statistics. We keep going in circles.

  Can you write our argument out as a dialogue between two people who are both sharp? No strawman on either side, they answer each others actual points, and each one has to give ground somewhere real. Make it concrete: they're arguing about a made-up small country where the economy boomed for twenty years, the boom was built on a resource that's running out, and the only evidence that people are happy is a survey the government itself runs. I want the back-and-forth to get into the stuff I cant work out on my own — how you'd even know what would have happened under a different government, whether a minority who lost out counts against the claim that everyone's better off, whether it matters that anyone who disagrees is free to leave, and whether a ruler could ever show he isn't just holding the place hostage.

  You're a political philosopher whos good at steelmanning. Before you write anything, brainstorm the three strongest moves each side has. Don't let one of them win — I want to see which argument survives contact with the other.
