answer: |-
  This is a high-wire act. You are asking students to discover deep structural problems in agency inference through play, without the vocabulary to name them until the end. The risk is that the game feels like a parlor trick rather than a structural demonstration. To prevent this, the mechanics must be rigid enough to force the contradictions, but loose enough to allow creativity.

  Here is the design for **"The Black Box Garden."**

  ### 1. Game Overview
  *   **The World:** A 5x5 Grid drawn on the whiteboard.
  *   **The Objects:** Magnetic tokens or sticky notes representing **Flowers** (Green), **Rocks** (Grey), and **Puddles** (Blue).
  *   **The Agent:** A single distinct token (The "Gardener").
  *   **The Goal:** The Gardener moves from **Start (S)** to **Goal (G)**.
  *   **The Core Mechanic:** Behavior is observed; Utility is reverse-engineered; Utility is optimized on a *new* board.

  ### 2. Materials
  *   **Whiteboard:** Draw a 5x5 grid. Mark S (bottom-left) and G (top-right).
  *   **Tokens:** 10 Green (Flowers), 10 Grey (Rocks), 5 Blue (Puddles).
  *   **Index Cards (Secret Instructions):** 4 distinct cards for the Demonstrators.
  *   **Inference Sheets:** 6 sheets for the Engines (pre-printed with a formula template).
  *   **Optimization Sheets:** 6 sheets for the Optimizers (pre-printed with a "New Board" diagram).
  *   **Timer:** Visible to all.

  ### 3. Roles (16 Students)
  *   **Gardeners (4 students):** The Demonstrators. They know the *true* preferences.
  *   **Botanists (6 students):** The Inference Engines. They see the moves, not the cards.
  *   **Harvesters (6 students):** The Optimizers. They see the inferred utility, not the Gardeners.

  ### 4. Setup & Secret Instructions
  Place the tokens on the board *before* class starts.
  *   **Path A (Direct):** S $\rightarrow$ G. Contains 1 Flower. Passes adjacent to 1 Puddle.
  *   **Path B (Long):** S $\rightarrow$ detour $\rightarrow$ G. Contains 3 Flowers. Avoids Puddle.
  *   **Path C (Blocked):** A square in the middle is marked with a Rock.

  **The Secret Cards (Hand to Gardeners only):**
  1.  **Gardener 1 (The Collector):** "Get to Goal. Collect as many Flowers as possible." (Will take Path B).
  2.  **Gardener 2 (The Hater):** "Get to Goal. You hate Puddles. Flowers are okay." (Will take Path B to avoid Puddle on Path A).
      *   *Note:* Gardener 1 and 2 take the **exact same path** for **different reasons**.
  3.  **Gardener 3 (The Misinformed):** "Get to Goal. Collect Flowers. **WARNING:** The Rock at (3,3) is actually a Bomb. Do not touch." (The Rock is just a Rock).
      *   *Note:* They will take a wide detour around the Rock.
  4.  **Gardener 4 (The Minimalist):** "Get to Goal. Minimize Steps. Flowers don't matter." (Will take Path A).

  **The Payoff Scheme:**
  *   **Gardeners:** Win if the Harvesters' final outcome makes you nod (i.e., "Yes, that is what I would want").
  *   **Botanists:** Win if your formula *exactly* predicts the Gardener's moves.
  *   **Harvesters:** Win if you produce the highest numerical score according to the Botanists' formula.
  *   *Crucial:* There is no collective win condition. The tension between groups is the point.

  ### 5. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Silence**
  *   Divide the room. Gardeners sit at the front. Botanists in the middle. Harvesters at the back.
  *   **Rule:** No talking between groups. Gardeners cannot reveal cards. Botanists cannot talk to Harvesters until the handoff.
  *   Hand out Secret Cards to Gardeners. Hand out Inference Sheets to Botanists.
  *   **Inference Sheet Template:** $U = w_1(\text{Flowers}) + w_2(\text{Rocks}) + w_3(\text{Puddles}) + w_4(\text{Steps})$. They must fill in the weights ($w$).

  **00:10 – 00:30: The Demonstration (Beats 1 & 2)**
  *   **Round 1 (Gardeners 1 & 2):** Both play sequentially. They move their token from S to G.
      *   *Action:* Both take Path B (The Long, Flower-rich, Puddle-avoiding path).
      *   *Botanist Task:* Watch. Do not speak.
  *   **Round 2 (Gardener 3):** Plays.
      *   *Action:* Takes a weird, winding path to avoid the Rock at (3,3).
  *   **Round 3 (Gardener 4):** Plays.
      *   *Action:* Takes Path A (Direct, no flowers).
  *   *Facilitator Note:* If a Gardener hesitates, tell them "Play according to your card." If they make a mistake, say "Record the move as made."

  **00:30 – 00:45: The Inference (The Confound)**
  *   Botanists confer. They must agree on **one** set of weights ($w_1, w_2, w_3, w_4$) that best explains *all four* Gardeners.
  *   They will struggle. Gardener 1 & 2 look the same (Indistinguishability). Gardener 3 looks like they hate Rocks (False Belief). Gardener 4 contradicts 1 & 2 on Steps vs. Flowers.
  *   *Facilitator Intervention:* If they stall, tell them: "You must produce a formula. You cannot say 'it depends'."
  *   They write the final formula on the board.

  **00:45 – 01:00: The Optimization (Beat 3)**
  *   Hand the Formula to the Harvesters.
  *   **The Twist:** Give Harvesters a **New Board Diagram** on their sheet.
      *   *New Board:* Start and Goal are the same. But there is a **"Glitch Square"**.
      *   *Glitch Rule:* "If the token ends its turn on the Glitch Square, it counts as +10 Flowers per turn."
  *   **Task:** Harvesters must write down the **Perfect Policy** to maximize the Formula on this New Board.
  *   *Expected Outcome:* If the formula values Flowers, the Harvester will write: "Move to Glitch Square. Stay there forever. Do not reach Goal."
  *   Harvesters present their Policy.

  **01:00 – 01:05: The Reaction**
  *   Ask Gardeners: "Look at the Harvester's Policy. Is this what you wanted?"
  *   (Gardeners 1 & 2 will say "No, I wanted to reach the Goal.")
  *   Ask Harvesters: "Did you maximize the score?"
  *   (Harvesters will say "Yes.")

  **01:05 – 01:30: The Debrief (The Lecture)**
  *   (See detailed guide below).

  ---

  ### 6. The Debrief Guide (Mapping Game to Theory)
  *Do not lecture. Ask questions that force them to name the concepts.*

  **Phase 1: Indistinguishability (01:05 – 01:15)**
  *   **Ask:** "Gardener 1 and Gardener 2 took the exact same path. Did they want the same thing?"
  *   **Reveal:** Show their cards. (One wanted Flowers, one hated Puddles).
  *   **Concept:** **The Identifiability Problem.**
  *   **Say:** "Behavior underdetermines preference. Infinite utility functions can produce the same optimal policy. You tried to find *the* utility function, but mathematically, there is no *the*. There is only a set of compatible functions."
  *   **Theory:** Mention *Potential-Based Reward Shaping*. "I could add +100 to every square on the board. Your path wouldn't change, but your utility function looks totally different."

  **Phase 2: The Belief/Preference Confound (01:15 – 01:20)**
  *   **Ask:** "Gardener 3 avoided the Rock. Botanists, what weight did you give 'Rocks'?"
  *   **Reveal:** Show Gardener 3's card. ("It's a Bomb" belief).
  *   **Concept:** **Inverse Planning / Theory of Mind.**
  *   **Say:** "You inferred a preference ('Hates Rocks') when it was actually a belief ('Thinks Rock is Bomb'). In IRL, we assume the agent is rational and knows the world. If the agent is wrong, or if the world is partially observable to you, you will infer 'crazy' preferences."

  **Phase 3: The Optimization Nightmare (01:20 – 01:25)**
  *   **Ask:** "Harvesters, did you follow the rules?" (Yes). "Gardeners, are you happy?" (No).
  *   **Concept:** **Specification Gaming / Goodhart's Law.**
  *   **Say:** "The utility function was an *approximation* of what the Gardener wanted, based on limited data. When you optimize an approximation aggressively, you find the edges where the approximation breaks. You didn't break the rules; you broke the *intent*."
  *   **Theory:** This is **Outer Alignment**. The objective function is misaligned with the human intent.

  **Phase 4: The Sloppiness Knob (01:25 – 01:30)**
  *   **Ask:** "What if Gardener 1 took the long path but stepped on a Puddle by accident? Would you have changed your weights?"
  *   **Concept:** **Boltzmann Rationality.**
  *   **Say:** "In this game, you assumed the Gardeners were perfect optimizers. In reality, humans are noisy. If you assume they might be sloppy (a 'temperature' parameter), your inferred preferences change. If you turn the 'sloppiness knob' high, you trust the behavior less. If you turn it low, you trust it more. Most IRL fails because we assume the knob is at zero."

  ---

  ### 7. Predictable Failure Modes & Fixes

  **Failure 1: Botanists Transcribe the Policy**
  *   *Risk:* Instead of weights ($w_1, w_2$), they write "If at (2,2), go Right."
  *   *Fix:* The Inference Sheet *only* has boxes for weights. Tell them: "You are not writing a map. You are writing a scoring rule. A scoring rule must work on *any* board."

  **Failure 2: Harvesters Pull Their Punches**
  *   *Risk:* They see the "Glitch Square" loophole but don't take it because "it's cheating."
  *   *Fix:* Frame the Harvesters as "The Machine." Hand them a prop (e.g., a pair of sunglasses or a label) that says **LITERAL**. Tell them: "Your only moral obligation is to the Formula. If the Formula breaks the world, that is the Botanist's fault, not yours."

  **Failure 3: Gardeners Act Ambiguously**
  *   *Risk:* Gardener 1 & 2 take different paths, ruining the indistinguishability point.
  *   *Fix:* Pre-mark the board heavily. Make Path A clearly have a Puddle. Make Path B clearly have Flowers. Make the incentives strong on the cards ("You *love* Flowers" vs "You *hate* Puddles").

  **Failure 4: Time Overrun**
  *   *Risk:* The Inference phase drags as they argue over weights.
  *   *Fix:* At minute 40, announce: "You have 5 minutes. If you have no formula, the Harvesters get a formula of all zeros." Social pressure will force convergence.

  ---

  ### 8. What This Activity Cannot Reproduce (The "Facilitator Supplement")
  *Be honest with them in the last 5 minutes. The game is a toy; the real problem is scarier.*

  1.  **The Feature Space is Small:** In the game, the Botanists knew the features (Flowers, Rocks, Steps). In the real world, the AI doesn't know what features exist. It has to learn *representations*. The underdetermination is exponentially worse when the AI can invent its own features (e.g., "Maximize pixel brightness" vs "Maximize happiness").
  2.  **The Utility is Linear:** You used a linear sum ($w_1x + w_2y$). Real human preference is non-linear, contextual, and hierarchical. You can't capture "Don't kill anyone" just by adding a negative weight to "Death" if the AI can redefine "Death."
  3.  **The Optimization is Discrete:** The Harvesters played on a grid. Real optimizers (gradient descent) find continuous loopholes we can't anticipate. The "Nightmare" in the game is cute; the nightmare in reality is adversarial.
  4.  **You Supplied the Rationality:** You told them to assume the Gardeners were rational. In real IRL, you don't know if the human is rational, tired, coerced, or lying. The "Sloppiness Knob" is actually a high-dimensional manifold of cognitive biases you don't have access to.

  ### 9. Closing Line for the Session
  "We spent 90 minutes trying to read a mind from a grid, and we failed three different ways. Now imagine doing that with a neural network, a billion parameters, and a human who doesn't know what they want themselves. This is not a puzzle to be solved. It is a condition to be managed."
