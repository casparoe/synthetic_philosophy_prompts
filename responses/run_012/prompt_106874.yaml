      *   **Topic:** Analogy-centered theory of cognition (Hofstadter & Sander, *Surfaces and Essences*).
      *   **Specific Thesis:** The "sharp version": No literal concepts, only bundles of past cases. Applying a concept = judging sameness relative to a purpose. Perception, categorization, reasoning are the same process at different scales.
      *   **Goal:** Identify genuine counterexamples (defeaters) vs. rearguard restatements (immunizing strategies).
