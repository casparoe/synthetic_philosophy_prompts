  # DIAGNOSTIC HANDOUT: ONTOLOGIES OF DISTRESS
  **Seminar:** Philosophy of Psychiatry | **Task:** Locate your pre-theoretical commitments.
  **Instructions:** Answer the following eight questions based on your intuition about the specified cases. Track your path (e.g., 1A-2B-3A) to find your position in the Key. Technical terms are glossed in *italics*.

  ### THE DECISION TREE

  **1. The Drapetomania Test:** Consider *drapetomania* (the 19th-century diagnosis for enslaved people fleeing captivity). When we reject it today, is it because the *biology was nonexistent*, or because the *social purpose (slavery) was illegitimate*?
  *   **(A) Biology nonexistent:** Go to **2**.
  *   **(B) Purpose illegitimate:** Go to **5**.

  **2. The Autism Essence:** If we discovered a single biological marker for *autism*, would the current behavioral checklist become obsolete?
  *   **(A) Yes, biology replaces behavior:** **[LEAF 1]**
  *   **(B) No, behavior is the reality:** Go to **3**.

  **3. The Population Threshold:** Consider diagnostic cut-offs (e.g., 5 out of 9 symptoms). Are these devices for *sorting populations* (insurance/resources), or discoveries of *natural breaks in individuals*?
  *   **(A) Sorting populations:** **[LEAF 2]**
  *   **(B) Natural breaks:** Go to **4**.

  **4. The Symptom Web:** Do symptoms cluster because of a *hidden underlying mechanism*, because they *directly cause each other*, or because they represent a *biological failure requiring social harm*?
  *   **(A) Hidden mechanism:** **[LEAF 3]**
  *   **(B) Direct cause (network):** **[LEAF 4]**
  *   **(C) Failure + Harm:** **[LEAF 5]**

  **5. The Homosexuality Case:** When *homosexuality* was removed from the manual, did the classification stop being *useful*, or did the *people/identity change*?
  *   **(A) Stopped being useful:** **[LEAF 6]**
  *   **(B) People/Identity change:** Go to **6**.

  **6. The Looping Mechanism:** When a diagnosis changes how a patient acts, does the loop run through the *patient's self-understanding*, or through *clinician/insurer behavior*?
  *   **(A) Patient's self-understanding:** Go to **7**.
  *   **(B) Clinician/Insurer behavior:** Go to **8**.

  **7. The Political Stance:** Regarding *autism self-advocacy*, should we *describe this identity formation*, *keep the label but reject 'pathology'*, or *abolish the label entirely*?
  *   **(A) Describe formation:** **[LEAF 7]**
  *   **(B) Keep/Reject pathology:** **[LEAF 8]**
  *   **(C) Abolish label:** **[LEAF 9]**

  **8. The Institutional Function:** Is the category primarily for *assigning a social role* to an individual, or *managing a population* for the state?
  *   **(A) Assigning social role:** **[LEAF 10]**
  *   **(B) Managing population:** **[LEAF 11]**

  ---

  ### POSITION KEY & CONSISTENCY CHECKS

  | Path | Position | Awkward Commitment | Consistency Check (Case: *Burnout*) |
  | :--- | :--- | :--- | :--- |
  | **1A-2A** | **Natural-Kind Realism** | Biology trumps lived experience; a gene for sadness makes grief a disease. | If we find a neural correlate, is workplace exhaustion a brain lesion? |
  | **1A-3A** | **Dimensional/Transdiagnostic** | Categories are fictions; only spectra are real, making treatment eligibility arbitrary. | At what exact score does stress become a disorder requiring care? |
  | **1A-4A** | **Homeostatic-Cluster Realism** | Mechanisms can be stable even if socially induced; trauma-clusters count as 'kinds'. | Is a cluster of trauma responses a 'kind' even if the cause is external? |
  | **1A-4B** | **Symptom Network Theory** | There is no 'root cause' to cure; treating insomnia might not fix the anxiety causing it. | Do we treat the sleep loss or the worry that keeps the patient awake? |
  | **1A-4C** | **Harmful-Dysfunction View** | Requires consensus on 'harm'; psychopathy might not be a disorder if the subject is happy. | Is a CEO's lack of empathy a dysfunction if it aids corporate success? |
  | **1B-5A** | **Practical-Kinds Instrumentalism** | Truth is irrelevant; a false diagnosis is acceptable if it secures insurance coverage. | Would you apply a known false label to get a patient therapy? |
  | **1B-6A-7A** | **Hacking-Style Dynamic Nominalism** | You cannot know the person before the label; the classification creates the kind of person. | Did 'adolescence' exist as a human type before we named it? |
  | **1B-6A-7B** | **Neurodiversity/Identity-First** | Must deny suffering is intrinsic; supporting severe disability without pathologizing is difficult. | How do we fund support for non-speaking autism without calling it a deficit? |
  | **1B-6A-7C** | **Abolitionist Position** | No framework remains to help those in severe distress; we lose the language of care. | What vocabulary do we use to mandate help for acute psychosis? |
  | **1B-6B-8A** | **Role Constructionism** | The patient is enacting a social script; the pain of the 'role' is arguably less real. | Is the suffering of a 'multiple personality' less valid because it is a role? |
  | **1B-6B-8B** | **Governance/Control View** | Medicine is primarily police work; doctors are agents of state management. | Is a psychiatrist's primary duty to the patient or to public safety? |

  *(Note: Leaves 7, 8, and 9 share the 'Self-Understanding' path; 7 is descriptive, 8 & 9 are prescriptive.)*

  ### LOOKUP KEY (QUIZ MODE)
  *   **Natural-Kind:** 1A, 2A
  *   **Dimensional:** 1A, 2B, 3A
  *   **Homeostatic-Cluster:** 1A, 2B, 3B, 4A
  *   **Network:** 1A, 2B, 3B, 4B
  *   **Harmful-Dysfunction:** 1A, 2B, 3B, 4C
  *   **Instrumentalism:** 1B, 5A
  *   **Dynamic Nominalism:** 1B, 5B, 6A, 7A
  *   **Neurodiversity:** 1B, 5B, 6A, 7B
  *   **Abolitionist:** 1B, 5B, 6A, 7C
  *   **Role Constructionism:** 1B, 5B, 6B, 8A
  *   **Governance:** 1B, 5B, 6B, 8B

  ### EMPTY BRANCHES DIAGNOSIS
  *   **Realist + Dynamic Nominalism (1A → 6A):** *Incoherent.* If kinds are natural (biology nonexistent test failed), they should not change fundamentally via self-understanding (looping).
  *   **Abolitionist + Natural Kind (1A → 7C):** *Unattractive.* If the category tracks a real biological entity, abolishing the label leaves the entity unmanaged; usually leads to renaming rather than abolition.
  *   **Instrumentalism + Natural Kind (1B → 2A):** *Unexplored.* Rare to claim categories are purely useful tools while simultaneously insisting they track mind-independent biological essences.
  *   **Governance + Neurodiversity (1B → 6B → 7B):** *Tension.* Governance views see categories as top-down control; Neurodiversity sees them as bottom-up identity. Holding both requires arguing identity is formed by control.

  ---
  *Glossary: **Homeostatic** (self-stabilizing); **Nominalism** (names create reality); **Ontology** (study of what exists); **Pathology** (study of disease/suffering).*
