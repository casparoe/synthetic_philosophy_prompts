answer: |-
  | Requirement | Motivating case or finding | What it rules out | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Account for structure-dependence** | Children form questions via hierarchical movement (e.g., auxiliary fronting), not linear sequencing, despite no explicit instruction. | Models relying solely on linear order or sequence prediction (e.g., simple n-gram models). | Non-negotiable |
  | **2. Account for acquisition without systematic negative evidence** | Children are rarely explicitly corrected on grammaticality, yet converge on the correct grammar (Poverty of the Stimulus). | Inductive models requiring explicit feedback on ungrammaticality to prune hypotheses. | Non-negotiable (Observation) |
  | **3. Account for sensitivity to statistical regularities** | Infants segment words and track transitional probabilities in continuous speech streams (e.g., Saffran et al.). | Models claiming input statistics are irrelevant or inaccessible to the learner. | Non-negotiable |
  | **4. Account for the sensitive period** | Language acquisition capacity declines significantly after puberty (e.g., Genie, late L2 learners). | Models positing learning mechanisms that remain constant and equally effective throughout the lifespan. | Non-negotiable |
  | **5. Account for emergence in new sign languages** | Deaf children in Nicaragua created a structured language (NSL) without an adult model to copy. | Models requiring a complete adult grammar in the input to generate structure. | Non-negotiable |
  | **6. Account for robustness across child-rearing regimes** | Grammar is acquired despite vast differences in parenting styles, SES, and interaction types (Equifinality). | Models requiring specific pedagogical interventions or "motherese" as a necessary condition. | Non-negotiable |
  | **7. Account for speed and uniformity of milestones** | Children pass through similar syntactic stages at similar rates across cultures. | Models relying on general cognitive development that varies significantly between individuals. | Non-negotiable |
  | **8. Explain acquisition without positing domain-specific innate knowledge** | Methodological parsimony; language should be learnable by general cognitive mechanisms if possible. | Nativist theories positing a dedicated Universal Grammar or language faculty. | Empiricist Commitment |

  The most critical tension lies in the joint satisfaction of Requirements 1, 2, and 8. If one accepts as non-negotiable that children acquire structure-dependent rules (Req 1) without systematic negative evidence (Req 2), it is logically inconsistent to simultaneously demand that the theory posit no domain-specific innate knowledge (Req 8). If these three are held as simultaneous constraints, the set is unsatisfiable: the Logical Problem of Language Acquisition (1 + 2) necessitates constraints on the hypothesis space that general statistical mechanisms alone (8) cannot provide without additional input assumptions. Consequently, the debate resolves into which requirement to relax: Empiricists typically challenge the strictness of Requirement 2 (arguing indirect negative evidence exists) or the sufficiency of Requirement 1 (arguing stats can yield structure), while Nativists relax Requirement 8.

  The single requirement that does the most to exclude otherwise live positions is the mandate to explain acquisition without systematic negative evidence.
