      *   *Benatar's specific defense:* He explicitly addresses this in Chapter 2. He says we compare existence and non-existence whenever we decide to procreate. We assume the future child is the subject of the benefit/harm.
      *   *Crucial nuance:* Benatar argues that while the non-existent person doesn't *experience* the benefit of non-existence, the *state of affairs* is better *with respect to* that person.
