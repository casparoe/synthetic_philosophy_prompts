  **Session Plan: Hume's Monetary Tension**

  **1. Prerequisite Concept (15 mins): Money as a Veil**
  Before the tension makes sense, participants must accept that *wealth* is goods and labor, not tokens. Start with the "Desert Island" test: If you wash up with a million gold coins but no food, are you wealthy? No. This establishes money as a tool for exchange, not the object of value. Without this, the claim "money isn't wealth" sounds like nonsense, not philosophy.

  **2. The Core Example (45 mins): The Export Boom Town**
  Avoid the cliché "Spanish Gold." Instead, use a **local industry boom** (e.g., a town becomes a tech hub). Foreigners pay cash for local services.
  *   **Step A:** Cash enters workers' pockets *before* prices rise. They feel richer and spend more.
  *   **Step B:** Merchants see higher demand and hire more staff. Industry stimulates.
  *   **Step C:** Eventually, prices rise to match the new money supply. Real wealth normalizes.
  *   **Why this example:** It humanizes the mechanism. Participants can visualize neighbors getting jobs, not just abstract "price levels." It highlights the *lag* between money arrival and price adjustment, which is the source of the tension. Spanish gold feels like magic; wages feel like income.

  **3. Misconceptions & Intervention Points**
  *   **"Money is neutral always."** Intervene immediately after the Desert Island test. If they think money *never* matters, the short-run stimulus makes no sense. Clarify: Neutrality holds only in equilibrium, not during transition.
  *   **"Prices adjust instantly."** Intervene during Step B of the Boom Town example. This is the critical failure point. If prices rise immediately, employment doesn't boost. Stress that wages/prices are "sticky" in Hume's narrative. The stimulus lives in the gap.
  *   **"Trade is zero-sum."** Intervene before the Political Application. If they view trade as war, Hume's plea for foreign prosperity fails.

  **4. Political Application (20 mins)**
  Connect the mechanism to policy. If money self-regulates and trade benefits both sides, hoarding gold is irrational. Fear of foreign prosperity is misplaced; rich neighbors buy more of your goods. This shifts the focus from state hoarding to private industry.

  **5. Assessment Question (10 mins)**
  Do not ask for definitions. Ask: *"If Hume believes increasing the money supply eventually causes only inflation, why does he argue against policies that restrict money growth during a slump?"*
  *   **Correct grasp:** They must cite the short-run stimulus/lag.
  *   **Incorrect grasp:** They argue money creates permanent wealth or that inflation doesn't happen.

  **6. What to Leave Out**
  Explicitly omit the **Price-Specie Flow Mechanism** details (how gold physically moves). It's mechanical distraction. Omit **Velocity of Money** formulas; it complicates the intuition. Omit **Bimetallism** debates; irrelevant to the core tension. Keep the focus on the *timing* of price adjustments, not the plumbing of international settlement.
