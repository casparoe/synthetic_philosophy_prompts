      *   *Is Science tension fatal?* For a strict Rortyan, yes. Putnam broke with Rorty over this. I should mention that this is where people usually jump ship.
      *   *Ethnocentrism:* Rorty explicitly owns this. So 6 is safe.

  8.  **Final Polish:** Check against constraints.
