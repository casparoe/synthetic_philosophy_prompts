      *Liberalism:* "Genuinely better... not just different." Rorty says liberalism is the best *we* have found. He rejects the "just different" relativist conclusion, but he also rejects the "objectively better" foundationalist conclusion. He sits in the middle: "Better for the purpose of reducing cruelty." I need to show how to thread that needle.

