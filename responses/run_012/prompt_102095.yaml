      *   *Recommendation:* The group needs to stop debating *existence* and debate *individuation conditions*. How do we count the states?
      *   *Honest Answer:* This debate often *shouldn't* move because it's driven by disciplinary turf wars (econ/soc psych vs. sociology/anthro). Acknowledge the sociological reality of the reading group itself.

