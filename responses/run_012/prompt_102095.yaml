answer: |-
  You are right to be frustrated. Four months on this without movement suggests you have hit a "zombie debate"—one that survives not because it is productive, but because the terms allow both sides to claim victory while talking past each other.

  Your hypothesis is sharp, but it needs tightening. Here is the pressure test you asked for, straight up.

  ### 1. Ontology vs. Explanation: Necessary but Insufficient
  You are correct that conflating ontology (what exists) with explanation (what explains) is the primary source of heat without light.
  *   **The Individualist Move:** "If social facts aren't *things* over and above individuals, they can't *do* anything over and above individuals."
  *   **The Holist Counter:** "Causation isn't about billiard balls hitting; it's about counterfactual dependence. The pattern does the work even if the pixels are the stuff."

  **The Problem:** Separating these questions clears the underbrush, but it doesn't kill the tree. Even if everyone agrees that *ontologically* only individuals exist (a very common consensus position, actually), the fight continues over **explanatory autonomy**.
  The individualist will say: "Fine, only individuals exist. But a *good* explanation must trace the causal mechanism. 'The market panicked' is a black box. Open the box."
  The holist will say: "Opening the box loses the signal. The mechanism is noise; the pattern is the cause."

  So, separating ontology from explanation is step one, but it won't solve the group's stalemate. The stalemate is actually about **explanatory virtues** (mechanism vs. stability), disguised as metaphysics.

  ### 2. Pressure-Testing "Translate" vs. "Implement"
  Your distinction is useful, but it is currently muddying the water between **semantics** and **metaphysics**.

  *   **Translate:** You define this as a content-preserving restatement. This is a semantic claim about *meaning*.
  *   **Implement:** You define this as "made true by" individuals. This is a metaphysical claim about *truthmaking* or *supervenience*.

  **Where it breaks:**
  The Individualist will accept your "Implement" category immediately and claim victory. They will say: "Exactly! Social facts are *implemented* by individuals. Therefore, the individual level is the fundamental explanatory level. The social level is just a heuristic."
  The Holist will reject your "Implement" category because it sounds like reductionism in disguise. They will say: "If the social fact is 'made true' by individuals, you are still making the social fact dependent on the individual in a way that misses the normativity."

  **The Real Friction Point:**
  The distinction fails to capture *why* translation fails. There are two reasons translation might fail, and your group is likely confusing them:
  1.  **Complexity (Epistemic):** There are too many individuals to track. (Individualist says: "In principle possible." Holist says: "Useless.")
  2.  **Individuation (Semantic):** You cannot specify the individual's belief *without* referencing the social context. (e.g., To believe "I am voting" requires the social institution of "voting.")

  If the failure is #2, then "Implementing" is incoherent. You can't say the individual state "makes true" the social fact if the individual state *cannot be identified* without the social fact. This is the Wittgenstein/Kripke point on rule-following. If your reading group hasn't hit this specific nerve, they are arguing about complexity when they should be arguing about **intentionality**.

  **Verdict on your distinction:** It carves something, but it risks letting the Individualist off the hook. It frames the Holist position as "Social stuff is real but magic," rather than "Individual descriptions are parasitic on social descriptions."

  ### 3. What Kind of Disagreement Is This?
  It is not merely verbal, and it is not merely substantive. It is a **clash of explanatory interests masquerading as metaphysics.**

  *   **The Individualist Interest:** Prediction, control, micro-foundations, rational choice. They want to know *how* the gears turn.
  *   **The Holist Interest:** Understanding, context, stability, function. They want to know *why* the machine holds its shape.

  When the Individualist says "It's not an explanation," they often mean "It doesn't satisfy *my* criteria for a causal mechanism."
  When the Holist says "It's a category mistake," they often mean "It doesn't satisfy *my* criteria for meaningful understanding."

  **The Bedrock Intuition:**
  There is a bedrock disagreement here, but it isn't about "what exists." It is about **individuation conditions**.
  *   Individualists believe mental states can be individuated internally (narrow content).
  *   Holists believe mental states are individuated externally (wide content/social context).

  If you cannot agree on how to count a "belief" or a "desire," you cannot agree on whether the social explanation reduces to them. This is where the debate usually stalls: the Individualist assumes a belief is a brain state; the Holist assumes a belief is a normative status. They are not using the same dictionary.

  ### 4. How to Move (or When to Stop)
  If you want progress, stop asking "Who is right?" and start asking "What is the explanation *for*?"

  **Proposal for the Group:**
  Adopt a **Pragmatic Pluralism**.
  1.  **Acknowledge Supervenience:** Agree that social facts depend on individuals (no magic ghosts). This satisfies the Individualist's ontology.
  2.  **Deny Reducibility:** Agree that social explanations are not *replaceable* by individual explanations without loss of explanatory power (stability, counterfactuals). This satisfies the Holist's methodology.
  3.  **Shift the Question:** Instead of "Is this explanation *true*?", ask "Is this explanation *robust*?"
      *   Individual-level explanations are fragile (change one person's mind, the explanation breaks).
      *   Social-level explanations are robust (people turnover, the institution remains).

  **The "Implement" Fix:**
  If you want to keep your Translate/Implement distinction, refine it to **Substitution vs. Supervenience**.
  *   **Substitution (Translate):** Can I swap the social term for an individual term in the explanation without changing the truth value *and* the explanatory power? (Individualist says Yes, Holist says No).
  *   **Supervenience (Implement):** Does the social term depend on the individual term? (Both should say Yes).

  **The Hard Truth:**
  If your group members are ideologically committed (e.g., hard-line Rational Choice Theorists vs. hard-line Structuralists), **this debate will not move.** It shouldn't. Because for them, the metaphysics is a proxy for their research program. Admitting the other side has a point feels like conceding their entire methodology is invalid.

  **My Advice:**
  Call out the conflation of **Ontology** and **Individuation**.
  Ask the Individualist: "Can you specify the depositor's belief 'the bank is unsafe' without referencing the social institution of banking?"
  If they say yes, they are naive about content.
  If they say no, they have conceded the Holist's point that social facts are constitutive of individual states.

  That is the choke point. Everything else is noise.
