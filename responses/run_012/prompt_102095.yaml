          *   *Implementing:* Social explanations are *made true* by individuals, but there's no content-preserving restatement (you can point to the realizers, not restate the meaning).
      *   **Questions to Answer:**
          1.  What kind of disagreement is this? (Verbal, substantive, conflated questions, bedrock?)
          2.  Does the translate/implement distinction carve anything real, or is it just supervenience repackaged?
          3.  What would count as progress? (Distinction, formal result, change of question, or give up?)
      *   **Constraint:** Do not just survey literature (they know the standard moves). Be critical/straightforward if the framing is muddled.

  2.  **Evaluate the User's Hypothesis (Ontology vs. Explanation):**
      *   *Is it a conflation?* Yes, historically and in practice, people often slide from "social facts are constituted by individuals" (ontology) to "social explanations are reducible to individual explanations" (methodology/epistemology).
      *   *Is it the *whole* problem?* No. Even if we separate them, the debate persists within *explanation*. Individualists argue that *good* explanation requires mechanism (individual action). Holists argue that *good* explanation requires pattern/function (social structure).
      *   *Verdict:* It's a strong starting point, but not a silver bullet. It clears the underbrush but doesn't cut the main tree.

  3.  **Evaluate the "Translate vs. Implement" Distinction:**
      *   *Translate:* This sounds like *reducibility* (Nagelian reduction or something similar). If I can translate $S$-terms to $I$-terms without loss, $S$ is eliminable in principle.
      *   *Implement:* This sounds like *supervenience* or *realization*. $S$ depends on $I$, but $S$ has its own vocabulary/utility.
      *   *Is it just supervenience?* Mostly, yes. Supervenience says no difference in $S$ without difference in $I$. "Implementing" adds a causal/metaphysical grounding feel.
      *   *Does it help?* It helps clarify *why* they talk past each other. Individualists demand Translation. Holists offer Implementation.
      *   *Critique:* The user says "no content-preserving individual-level restatement." This is the crux. Why not? Is it complexity (too many individuals)? Or is it *meaning* (the concept relies on the social context)? If it's the latter, that's the holist's real point (meaning holism), not just implementation.
      *   *Verdict:* It's a useful heuristic, but it risks masking the deeper semantic argument. It's not *just* supervenience; it's about *intensionality* vs. *extensionality*.

  4.  **Diagnose the Disagreement Type:**
      *   *Verbal?* Partly. They define "explanation" differently.
      *   *Substantive?* Yes, about the nature of social causality and meaning.
      *   *Bedrock?* Some of it is pragmatic (what's useful for research?) vs. metaphysical (what's ultimately real?).
