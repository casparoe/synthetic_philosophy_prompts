          *   So, the distinction is useful *if* it forces them to admit *why* translation fails. Is it computational limits (implement) or semantic impossibility (translate)?
      *   *What kind of disagreement is it?* It's a **pragmatic/metaphysical category error**. They are arguing about *explanatory virtues* (parsimony vs. autonomy) but dressing it up as *metaphysics* (existence).
      *   *Progress:* Stop asking "Which is true?" Ask "What work does this explanation do?" Shift to *explanatory pluralism*.
