prompt: |-
  I'm building my own take on whether history has a moral direction and I keep goign in circles, so I want your actual credence plus the machinery behind it. Treat yourself as a philosopher of history / social-science methodologist who has thought hard about this; start by brainstorming before you commit to any numbers, and don't fob me off with 'well, it depends what you mean by progress' -- I know it does, so pick a reading, state it precisely, and then give me a number.

  Here's the claim I want a credence on, and I want it phrased as a claim about the *structure* of the historical series rather than about whether things feel better. Take some defensible scalar measure of how just a society's arrangements are -- something like the share of people not subject to arbitrary violence, bondage, or exclusion; you can propose the measure, but then fix it and stick to it. Over a long window, say the last ten thousand years, is the trajectory of that measure (global mean, or the frontier, your call, but say which) better described as a random walk -- no systematic drift, direction set by chance -- or as a ratchet: a systematic, self-reinforcing upward drift that resists reversal? I want your credence that it's a ratchet rather than a random walk. And a second number: given that it looks like a ratchet, what's the chance the ratchet mechanism is the load-bearing kind that could keep going, versus the recent uptick just being a blip on a window far too short to tell?

  Two things I want folded in that I think most people skip. First, the observer problem: any epoch's inhabitants sit inside the series they're judging, and epochs that happen to see an upward trend are likelier to survive long enough to be asked, so what's the chance we're just the lucky ones looking back? Second, the gap between 'has had a direction so far' and 'bends toward' -- does 'toward' quietly smuggle in a guarantee or a purpose, and if so, should that drag the number down?

  For calibration: I'm around 0.4 on the ratchet claim; a friend who's read all the decline-of-violence stuff is at 0.85. Give me your own number, then tell me where our disagreement most likely lives.

  Format it like this. 'Precise claim' (2-4 sentences: state the proposition so it could be true or false, and fix the measure and the window). 'Brainstorm' (5-8 bullets, half-formed thoughts and candidate mechanisms, before any numbers appear). 'Decomposition' (a numbered list of the sub-questions your number depends on, each with a rough probability and one line of justification). 'Combination' (how the parts combine into one number, then the number itself). 'Sensitivity' (the single sub-question your number is most hostage to, and what evidence or argument would move it most, in either direction). 'Where we disagree' (2-4 sentences on wether it's the measure, the mechanism, or the observer problem that separates me from my friend).
