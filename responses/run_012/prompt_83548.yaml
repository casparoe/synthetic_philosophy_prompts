      *(Self-Correction during drafting)*: I need to be careful not to just say "You're wrong." I need to show *why* the philosophical label shifts. The user's view is essentially a naturalistic functionalism. The question is whether that functionalism can carry the normative weight of "The Good."

      *Key argument to develop:* If well-being is determined by what the reinforcement system stamps in, then a rat pressing a lever until it starves (self-stimulation) is achieving high well-being on this view. Most hedonists would say that rat is not flourishing. Therefore, the view diverges from hedonism's core intuition.

