answer: |-
  Here is a conceptual menu for your sidebar. I have structured it as a breakdown of the slogan's possible meanings, moving from the physical to the normative, followed by the specific application to your solicitor's argument.

  ***

  ### The Menu: What "You Can't Cause Something by Doing Nothing" Actually Means

  The sentence sounds like a law of physics, but it is doing different work depending on who says it. Here are four distinct readings, ranked from trivial to contentious.

  **1. The Physicalist Reading**
  *   **The Claim:** Nothingness possesses no energy. An absence cannot exert force upon matter.
  *   **What "Cause" Means:** Physical transference. For A to cause B, energy or momentum must pass from A to B.
  *   **Verdict:** **Trivial.** True, but useless for law or morality.
  *   **The Problem:** This reading collapses under the **redescription trick**. Your landlord did not sit in a void radiating zero energy. He actively collected rent, deposited it, and spent it on holidays. To say he did "nothing" to the boiler is to ignore what he *did* do with the money. If we describe the facts as "he diverted resources away from maintenance," he clearly exerted force on the world. The slogan only works if we accept a very narrow description of "nothing" (i.e., not fixing the boiler) while ignoring the background activity (spending the rent).

  **2. The Counterfactual Reading**
  *   **The Claim:** If the landlord had acted, the death would not have occurred; therefore, his inaction is a cause. But wait—if we count every absence that would have prevented the event as a cause, then the tenant's mother (for not buying a new house), the weather (for being cold), and the boiler manufacturer (for not making it safer) are all causes.
  *   **What "Cause" Means:** Counterfactual dependence. "But for X, would Y have happened?"
  *   **Verdict:** **Defensible, but requires a filter.**
  *   **The Problem:** This addresses your philosopher's worry. If *every* omission is a cause, causation loses its meaning. To save the slogan, we must introduce a **baseline of expectation**. We do not count the mother or the weather as causes because we do not expect them to intervene. We count the landlord because he was *expected* to. The "something else" doing the work here is not physics, but normativity. The slogan sinks if it claims omissions aren't causes *in fact*; it survives only if it means they aren't causes *worthy of note* absent a duty.

  **3. The Ontological Reading**
  *   **The Claim:** Only events can cause events. An omission is not an event; it is the non-occurrence of an event. Therefore, it cannot be a cause.
  *   **What "Cause" Means:** A relation between two existing occurrences in spacetime.
  *   **Verdict:** **Contentious.**
  *   **The Problem:** This is a metaphysical preference, not a fact. It relies on a strict definition of what constitutes "reality." In the **lifeguard scenario**, this reading struggles. Physically, the lifeguard and the bystander are identical: both are stationary bodies near water. Ontologically, neither "sends a signal" to the drowning child. If omissions aren't causes, the lifeguard is innocent of causation, which contradicts our moral and legal intuition. This reading forces us to say the lifeguard didn't *cause* the death, he merely *allowed* it. That is a distinction without a physical difference.

  **4. The Legal/Responsibility Reading**
  *   **The Claim:** We should not attribute legal responsibility for outcomes resulting from inaction unless a specific duty exists.
  *   **What "Cause" Means:** Proximate cause (legal liability).
  *   **Verdict:** **Defensible (in court), False (in reality).**
  *   **The Problem:** This is where the **window of responsibility** matters. The law distinguishes between the bystander and the lifeguard not because of physics, but because of role. The slogan is a shorthand for: "We do not punish omissions unless there is a duty to act." It conflates *causation* with *blame*. It suggests the link is broken physically, when actually the link is intact but the *obligation* is missing.

  ***

  ### Addressing Your Three Puzzles

  **1. What "Cause" is Doing**
  When the barrister argues for a "but-for" test, they want a clean chain: Act → Consequence. The philosopher objects that on a pure counterfactual account, the universe is a web of infinite dependencies (the mother, the weather). To rescue the slogan, you must admit that "cause" here is actually doing the work of **causal selection**. We are not asking "what made this happen?" (physics); we are asking "which factor is the relevant culprit?" (norms). The slogan tries to disguise a normative choice as a metaphysical fact. It claims the landlord *didn't cause it*, when it really means the landlord's inaction *shouldn't count* as a cause.

  **2. The Redescription Trick**
  The slogan relies on the word "nothing." But as you noted, the landlord was spending the rent. "Doing nothing" is never literally true; it is always "doing nothing *specific*."
  *   **Doctor switching off vs. never switching on:** Physically, these are different movements. Morally, we often treat them as equivalent if the duty to maintain care exists.
  *   **Does the slogan survive?** No. It is an artefact of language. If we redescribe the landlord's behaviour as "misappropriating funds required for safety," he clearly *did* something. The slogan survives only by framing the omission as the primary description of reality, rather than a secondary description relative to a duty.

  **3. Whose Doing, and Over What Window**
  The difference between you and the lifeguard is not causal; it is **institutional**. You have no duty; the lifeguard does. The slogan attempts to draw a bright line at "action vs. inaction," but the law actually draws the line at "duty vs. no duty."
  *   **The Window:** Causation is time-bound. If the landlord fixed the boiler six months later, he didn't cause the death. If he fixed it the day before, he prevented it. The slogan ignores the temporal window of obligation. It implies that because he didn't move his hands at the moment of leakage, he is causally disconnected. In reality, his causation lies in the prior decision to accept rent without maintaining the property.

  ***

  ### The Solicitor's Gamble

  **Which reading is the solicitor using?**
  Your solicitor is almost certainly relying on a hybrid of **Reading 1 (Physicalist)** and **Reading 4 (Legal)**. They are attempting to persuade the court that because there was no *act* (no wrench turned, no pipe burst by hand), there is no *actus reus* (guilty act). They are banking on the intuition that "killing" requires a positive motion, whereas "letting die" is passive.

  **Does it get the client off the hook?**
  **No.**
  In English law, specifically regarding gross negligence manslaughter or breaches of the Landlord and Tenant Act, the distinction between act and omission collapses once a **duty of care** is established. By accepting the rent and the tenancy agreement, the landlord assumed a duty to maintain the premises.
  The slogan "you can't cause something by doing nothing" is a rhetorical shield, not a legal sword. It works in moral philosophy seminars to puzzle students; it does not work in the Crown Court against a coroner's report citing carbon monoxide.

  The solicitor knows this. They are not arguing that the omission *wasn't* a cause; they are arguing that it shouldn't be *treated* as one. They are asking the court to accept the Physicalist Reading (nothing happened) over the Legal Reading (a duty was breached). Given the tenant is dead and the rent was taken, the court will almost certainly reject the slogan. It is a defensible philosophical position, but a fatal legal strategy.
