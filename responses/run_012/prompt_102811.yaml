answer: |-
  # Q&A Prep Sheet: Keynes, Weight, and Credal Committees

  **Context:** Workshop on Uncertainty.
  **Audience:** Bayesians, Formal Epistemologists, Keynes Historians.
  **Goal:** Defend the "Credal Committee" reconstruction of Weight without getting bogged down in textual exegesis or technical trivialities.

  ---

  ### 1. The "Why Imprecision?" Objection (The Bayesian Statistician)
  **Likelihood:** Very High | **Damage:** High
  **The Question:** "If I have a coherent prior and I receive new evidence, I condition. My posterior is a single precise function. Your 'committee' seems to represent a failure to specify a prior, not an increase in the weight of evidence. Why should I model my ignorance as a set of probabilities rather than just admitting I need more data before I bet?"

  **The Reply (2 mins):**
  "Great question. The core distinction is between *risk*, where the model is known and we just lack data, and *Keynesian uncertainty*, where the model structure itself is ambiguous. If I flip a coin, more data sharpens the probability. But if I'm assessing the probability of a war breaking out in five years, 'more data' doesn't necessarily converge on a single number; it might validate multiple conflicting causal models.
  My argument is that 'weight' tracks the stability of the decision across those plausible models. If I have very little evidence, my credal committee is huge, and they disagree on the ranking of options. As evidence accumulates, the committee might not converge on a single number (precision), but they might converge on a ranking (weight). So, weight isn't about the width of the interval; it's about the robustness of the choice against model ambiguity. You don't need more data to bet; you need to know if the bet holds up across all coherent interpretations of the data you already have."

  **The Soft Spot:**
  You are assuming the audience accepts that model ambiguity persists even after conditioning. A strict Subjective Bayesian will argue that a "true" prior would have already accounted for model uncertainty. You haven't proven why a single precise prior is impossible, only that it's inconvenient.

  ---

  ### 2. The "Textual Fidelity" Objection (The Keynes Historian)
  **Likelihood:** High | **Damage:** Medium
  **The Question:** "Keynes defines weight in Chapter 6 as the 'amount of evidence,' favorable or unfavorable. He explicitly distinguishes this from probability. You're importing Levi's 'credal states' or Gärdenfors's 'sets of probabilities' from the 1970s and pasting them onto 1921. Keynes was talking about logical relations between propositions, not a committee of agents. Isn't this just anachronistic window dressing?"

  **The Reply (2 mins):**
  "I concede the anachronism in terminology, but not in substance. Keynes struggled to formalize 'completeness' because the tools of imprecise probability didn't exist yet. He knew weight wasn't probability, and he knew it wasn't just interval width, but he lacked the set-theoretic machinery to describe *why*.
  My reconstruction isn't meant to be exegesis; it's a rational repair. If we treat the 'logical relation' Keynes describes as a constraint on admissible probability functions, the 'completeness' of evidence corresponds to how tightly those constraints bind the set. If I stick strictly to Keynes's text, I leave you with a metaphor. If I use the credal committee model, I give you a metric. I'd rather solve the problem Keynes identified than preserve the limitations of his notation."

  **The Soft Spot:**
  You are openly admitting you are overriding the text. If the historians care more about what Keynes *meant* than what problem he was *solving*, this reply will annoy them. It validates their claim that you aren't doing history.

  ---

  ### 3. The "Ranking Instability" Objection (The Formal Epistemologist)
  **Likelihood:** Medium | **Damage:** High
  **The Question:** "You define weight as agreement on the ranking of options. But rankings are sensitive to small perturbations. Two probability functions can be arbitrarily close in value but flip the ranking of two options near the indifference point. This makes your measure of weight discontinuous and unstable. A tiny bit of new evidence could cause a massive jump in 'weight' if it crosses a threshold. How is that a measure of evidence completeness?"

  **The Reply (2 mins):**
  "That's a fair technical concern. However, I'm not proposing a binary 'agree/disagree' metric. I'm proposing measuring the *proportion* of the committee that agrees on the ranking, weighted by their plausibility.
  Think of it like a margin of victory in an election. If 51% of the functions prefer A to B, weight is low. If 99% prefer A to B, weight is high, even if the probabilities are close. The 'jump' you're worried about only happens if the evidence forces a mass migration of functions across the indifference line. In practice, as evidence accumulates, the distribution of functions tightens, making those flips less likely. The measure captures the *robustness* of the preference, not just the existence of it."

  **The Soft Spot:**
  You haven't formally defined how to weight the functions within the committee. If the "plausibility" of each function is itself probabilistic, you risk an infinite regress. If it's uniform, you're making an arbitrary assumption about the distribution of ignorance.

  ---

  ### 4. The "Decision Relevance" Objection (The Decision Theorist)
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "Let's say I accept your model. In a decision context, if the committee agrees on the ranking, I choose the top option. If they disagree, I suspend judgment or use a maximin rule. In either case, the 'weight' doesn't change the action. It only tells me how comfortable I feel. Why build a formal measure for something that doesn't change the choice?"

  **The Reply (2 mins):**
  "It changes the *meta-choice*. Weight determines whether it's worth the cost to seek more information before acting. If the committee agrees on the ranking but the weight is low (meaning the agreement is fragile or the set is vast), that signals high sensitivity to new evidence.
  In a high-stakes environment, low weight should trigger an 'information search' action, even if the current ranking is clear. High weight means the ranking is robust, so you can act immediately. So weight functions as a stopping rule for inquiry. It doesn't tell you *what* to choose from the menu; it tells you whether the menu is final."

  **The Soft Spot:**
  This relies on the audience accepting that "information search" is a formal part of the decision model. If they view the decision as a one-shot snap-shot, weight becomes purely psychological, which weakens your formal claim.

  ---

  ### 5. The "Prayer" Question (The One You Hope Nobody Asks)
  **Likelihood:** Low | **Damage:** Critical
  **The Question:** "You model weight as the agreement within a set of coherent probability functions. But how do you delimit the set? What determines which functions are 'in the committee' and which are excluded? If you define the set based on 'coherence with evidence,' aren't you just pushing the problem of weight back into the definition of the set? How do you measure the completeness of evidence without already assuming a measure of completeness to build the committee?"

  **The Reply (2 mins):**
  "This is the hardest problem, and I'll be direct: The set is delimited by the constraints imposed by the available evidence. If the evidence is sparse, the constraints are loose, and the set is large. If evidence is complete, the constraints force the set to a singleton.
  You're right that there's a circularity risk if I'm not careful. I avoid it by treating the 'evidence' as a set of logical constraints (like frequency data or known symmetries) that any admissible function must satisfy. The 'weight' is then a derived property of the resulting set, not an input. However, I concede that specifying the initial constraints without bias is the open problem. My model doesn't solve the problem of the prior; it just makes the impact of that problem visible via the weight metric."

  **The Soft Spot:**
  You are admitting you haven't solved the Problem of the Priors. You are essentially saying, "I assume we know what the evidence constrains." A sharp logician will point out that knowing what the evidence constrains *is* knowing the weight. You might be defining weight in terms of itself.
