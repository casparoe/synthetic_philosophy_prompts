      *   The "slack" in B needs to be structural, not just "B is smarter." They have the same information. So B must weigh the instruction against a model of stakeholder welfare differently.
      *   Present-day capability means we are talking about something like a decision support system, a medical triage AI, a resource allocation tool, or a content moderation assistant.
      *   The harm must be a "genuine value failure." This means it's not just "Operator wanted X, Stakeholders wanted Y." It must be "Operator and Stakeholders both wanted Z, Operator thought Path X leads to Z, System A took Path X, Path X actually undermines Z."

  3.  **Drafting the Scenario:**
      *   *Domain:* Healthcare or Social Work feels appropriate for "good-faith professional" and "shared values." Let's try Healthcare Resource Allocation.
      *   *Operator:* A hospital administrator or chief physician.
