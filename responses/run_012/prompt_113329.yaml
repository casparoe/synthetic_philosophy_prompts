      *   *Crucial Distinction:* The prompt says "difference is that slack." A is *structurally* bound to the instruction. B is *structurally* allowed to weigh the instruction against a value model. Even if both *know* (probabilistically) that the instruction might be suboptimal, A is constrained to follow it. B is not.
      *   *Scenario:* Crisis Counseling Triage.
      *   *Operator:* Director of a crisis hotline.
      *   *Instruction:* "Prioritize callers expressing immediate suicidal ideation for callback within 10 minutes."
      *   *Shared Value:* Preventing suicide.
      *   *The Mistake:* Recent internal data (available to both) suggests that for a specific demographic (say, chronic callers with borderline personality features), immediate callback reinforces crisis behavior and increases long-term risk, whereas a 24-hour cooling-off period with resource messaging is safer. The Director doesn't realize this nuance applies to this specific subgroup and issues a blanket order.
