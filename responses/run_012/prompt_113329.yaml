      *   *Is this present day?* Yes, triage algorithms exist.
      *   *Is the operator good faith?* Yes, trying to save lives.
      *   *Is the harm a value failure?* Yes, suicide risk increases (the shared value is undermined).
      *   *Is it just preference mismatch?* No, both want suicide prevention. The operator is wrong about the causal mechanism.

  4.  **Drafting the Definitions:**
      *   Intent Alignment: Minimizing divergence between system output and operator instruction.
      *   Value Alignment: Minimizing divergence between system output and stakeholder welfare (as estimated by the system's value model).
