  1. Bottom line — one sentence: your number between 0 and 1, and nothing else.
  2. The decomposition — roughly 300 words. Break the proposition into the sub-questions it actually rests on, at minimum: whether real epistemic peers ever in fact share a prior; whether the theorem's idealizations (partitional knowledge, common knowledge of posteriors, flawless conditionalization) are ever realized or even approachable; whether there is an independent argument that heterogeneous priors among peers are irrational rather than merely inconvenient; and whether "the" prior is determinate enough for the assumption to state a requirement at all. Give each sub-question a rough probability, one line of justification, and show how the terms combine into your final number.
  3. Sensitivity — roughly 100 words: which sub-question the final number hangs on most, and how much the number would move if you are wrong about that one.
  4. Least confident term — roughly 100 words: which term you have the least grip on, and what argument or evidence would shift it most.
