prompt: |-
  I'm giving a paper next month to our media studies group -- a dozen people, plus two Kierkegaard scholars from theology who've been invited to come and shoot holes in it, and one person whose entire research program is Habermas's public sphere. My thesis: Kierkegaard's attack on the press isn't a complaint about gossip or sensationalism or falling standards, its a structural claim about what a medium does to the people using it. Leveling isn't a mood, it's what happens when a communication system lets anyone form an opinion about everything while making it impossible for anyone to be the one who acts. And the sharper thing I want to push: the public, in his sense, isn't a set of readers, it's a third party that is nobody -- a position the press manufactures from which you can judge everything and be answerable for nothing. (I'll use his run-in with the satirical paper as the running example, so assume I'll get the history roughly right in the talk itself.)

  Draft me the Q&A prep sheet: the objections this particular room will actually raise, phrased the way they'd phrase them rather than the way a Kierkegaard seminar would, ordered by how much damage they do, each with a two-minute reply and a note on where the reply is softest. Tell me which one I should just concede instead of fighting, and include the question I'm hoping nobody asks.
