answer: |-
  **MEMORANDUM**

  **TO:** Members, State Sentencing Guidelines Commission
  **FROM:** Vice-Chair [Your Name]
  **DATE:** October 12, 2023
  **SUBJECT:** Response to Formal Objection No. 4 (The Severity Ladder)

  **BOTTOM LINE RECOMMENDATION**

  I move that the Commission **adopt the offense-severity ladder as currently drafted**, without the proposed "tolerance rule" or "incomparability relation" modifications. We should append a Commentary Note acknowledging that adjacent rungs represent administrative distinctions for the sake of uniformity, not necessarily discrete jumps in moral blameworthiness.

  We must report to the legislature in three weeks. Rejecting the ladder in favor of wide judicial bands would abandon our statutory mandate to reduce unwarranted disparity. The philosophical objection raised by our colleague is logically sound but institutionally fatal. We can acknowledge the logical tension without letting it paralyze the grid.

  ***

  **ANALYSIS OF THE LOGICAL OBJECTION**

  Our colleague's objection relies on a classic Sorites Paradox applied to sentencing desert. To vote responsibly, we must strip the argument to its logical premises and test every available escape route. I have mapped the argument below to ensure we are not talking past one another.

  **1. The Premises Required for His Conclusion**
  For his conclusion (that the ladder is fiction and should be scrapped) to hold, three premises must be true:
  *   **P1 (The Local Indifference Premise):** For any two adjacent rungs on the ladder (e.g., Rung $n$ and Rung $n+1$), the difference in sanction is too trivial to constitute a meaningful difference in "desert" or harmfulness to the offender.
  *   **P2 (The Transitivity Premise):** The relation "not worse than" is transitive. If $A$ is not worse than $B$, and $B$ is not worse than $C$, then $A$ is not worse than $C$.
  *   **P3 (The Chaining Premise):** We can chain these local comparisons from the bottom of the ladder to the top (including across sanction types, e.g., fine to custody) without breaking the chain.

  If P1, P2, and P3 hold, the conclusion follows: The top of the ladder is not worse than the bottom. Proportionality collapses.

  **2. The Escape Routes**
  To reject his conclusion, we must deny at least one premise. Here are the available routes:
  *   **Route A (Deny P1):** Claim that every single step *does* matter morally. 89 days is genuinely, meaningfully more blameworthy than 90 days.
      *   *Viability:* Low. This is implausible on the merits. It requires us to believe moral desert is infinitely granular.
  *   **Route B (Deny P2):** Claim that "worse than" is not transitive.
      *   *Viability:* Low. If we deny transitivity in sentencing, rational choice breaks down. A judge could not consistently prefer Option A over C if they prefer A over B and B over C. This invites arbitrary decision-making.
  *   **Route C (Deny P3):** Claim the chain breaks at some point. There is a "threshold" where small differences accumulate into a large one.
      *   *Viability:* High. This is the "Threshold View." While one grain of sand doesn't make a heap, 10,000 do. The transition is real, even if the specific step is invisible.
  *   **Route D (Institutional Redefinition):** Claim that "worse than" in this context is not a moral truth but an administrative tool.
      *   *Viability:* High. The ladder is for *equity*, not metaphysics.

  ***

  **ASSESSMENT OF PROPOSED FIXES**

  Two members have suggested modifications to accommodate the objection. I have assessed both against the logic above.

  **1. The Tolerance Rule (Ties within 5%)**
  *Proposal:* Declare any two rungs within 5% of each other as "ties."
  *Assessment:* **Reject.** This does not solve the paradox; it relocates it. If 4.9% difference is a tie, and 5.1% is a hierarchy, what is the moral difference between 4.9% and 5.1%? We create a new "cliff" at the tolerance boundary. Furthermore, this complicates the grid operationally. If Rung 5 and Rung 6 are ties, but Rung 6 and Rung 7 are not, judges must treat 5 and 6 identically but 6 and 7 differently. This creates confusion without solving the underlying transitivity issue.

  **2. The Incomparability Relation ("Neither Better Nor Worse Nor Equal")**
  *Proposal:* Add a fourth logical relation to record that some pairs are incomparable.
  *Assessment:* **Reject.** While philosophically robust (acknowledging that fines and custody may be qualitatively different), this breaks the guidelines' function. The purpose of a ladder is to guide judicial discretion. If a judge faces a choice between Rung 5 (Fine) and Rung 6 (Custody) and we record them as "incomparable," we have given the judge no guidance. We would be outsourcing the ranking to the very discretion we are meant to structure.

  ***

  **THE VAGUE-PREDICATE VS. SUBSTANTIVE DISTINCTION**

  I want to be precise about why this objection is difficult to wave off. Usually, when we face a Sorites argument, we dismiss it as a "vague predicate" problem (i.e., "We just don't know where the cutoff is").

  Our colleague is not making a vague-predicate claim. He is making a **substantive claim**. He is arguing that we *know* the difference between 89 and 90 days does not matter for desert. It is not that we are ignorant of the cutoff; it is that there *is* no cutoff for that specific increment.

  This makes his argument **stronger** than a standard vagueness objection. Escape routes that work for vagueness (e.g., "let's just pick a precise line for administrative convenience") do not automatically work here, because he is arguing that picking the line creates a falsehood.

  However, this makes his argument **weaker** regarding policy. Even if it is substantively true that 89 days is not morally distinct from 90 days, it remains administratively true that we cannot have 10,000 distinct sentencing categories. We must aggregate. The "falsehood" of the line is the price of having a system at all. We are not mapping moral truth; we are mapping administrative constraints onto moral ranges.

  ***

  **REASONING FOR RECOMMENDATION**

  I recommend adopting the ladder as drafted for three reasons:

  1.  **The Threshold View (Route C) Saves Proportionality:** We can accept P1 (local indifference) without accepting the conclusion. Small differences *do* accumulate. While 89 days may not be meaningfully worse than 90 days, 90 days is meaningfully worse than 30 days. The ladder captures the accumulation, even if the individual steps are morally silent. We are ranking *ranges* of desert, not atomic units.
  2.  **Institutional Necessity (Route D):** The "worse than" relation in our statute is not purely moral; it is a tool for uniformity. If we scrap the ladder for wide bands (as the dissenter suggests), we do not escape the paradox. We simply move it to the boundaries of the bands. Why is a 1-to-5-year band different from a 1-to-6-year band? The Sorites paradox applies to bands just as it applies to rungs. The ladder is superior because it reduces the surface area for disparity.
  3.  **Operational Viability:** The proposed fixes (Tolerance/Incomparability) render the grid unusable for sentencing software and judicial training. We cannot publish a guideline that tells judges two sanctions are "incomparable" when the statute requires us to rank severity.

  **What We Give Up:**
  By voting to adopt, we are conceding that the ladder is not a perfect moral map. We are accepting that adjacent rungs are, in isolation, morally equivalent. We are prioritizing *uniformity* over *perfect granularity*. If the legislature rejects this, they are free to do so, but we must provide them a workable product, not a philosophical treatise.

  ***

  **REPLY TO COLLEAGUE (FOR THE RECORD)**

  To my colleague who filed the objection: I respect the rigor of your logic. You have correctly identified that the ladder rests on a necessary fiction—that administrative lines track moral lines. However, I invite you to address the following in your final reply:

  If we accept your premise that trivial differences cannot ground a "worse than" judgment, **what is your positive proposal for avoiding the Sorites Paradox within your own solution?**

  You propose scrapping the ladder for "wide bands." But bands have boundaries. If a judge imposes 5 years instead of 5 years and 1 day, is that a meaningful difference in desert? If you say "no," then by your own transitivity logic, the top of the sentencing range is no worse than the bottom of the range. If you say "yes," then you have accepted that trivial differences *can* matter when aggregated or institutionalized, which undermines your objection to the ladder.

  Please specify: Does your "wide band" solution solve the transitivity problem, or does it simply hide it inside a broader discretion? If the latter, why is hiding it preferable to managing it through a public ladder?

  I look forward to your response.
