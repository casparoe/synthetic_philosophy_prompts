  **OFFICE OF MORAL COMPLIANCE**
  **TRAVEL ADVISORY 88-B**
  **SUBJECT: JURISDICTIONAL NORMS AND OBLIGATORY CONVENTIONS**

  **PREAMBLE**
  Citizens are reminded that morality is not an intrinsic property portable across borders, but a localized infrastructure maintained by collective adherence. Upon entering a foreign jurisdiction, the traveler ceases to be a sovereign moral agent and becomes a beneficiary of that region's normative ecosystem. The Office rejects the distinction between "mere convention" and "moral duty." Where a convention coordinates social interaction, violating it constitutes a breach of fair play. Presence implies consent; benefit incurs obligation. Consequently, local customs regarding public conduct are binding on visitors no less than residents, regardless of the visitor's prior participation in establishing said norms.

  **THE BINDINGNESS SCALE**
  To assist in compliance, conventions are classified as follows:
  *   **Category I:** Courteous but optional. Violation causes minor friction.
  *   **Category II:** Reciprocal Expectation. Violation undermines trust.
  *   **Category III:** Implicit Contract. Violation constitutes theft or deceit.
  *   **Category IV:** Constitutive Obligation. Violation disrupts the moral framework itself.

  **SPECIFIC ADVISORIES**

  **1. Queueing Protocols (Category IV)**
  The formation of lines is not merely efficient; it is a temporal contract. To bypass a queue is to appropriate the time of others without consent. Citizens must note that the obligation binds regardless of enforcement. The absence of a physical barrier or an angry mob does not negate the moral claim of those waiting. The wrong lies in the free-riding on the cooperative restraint of others. Even if the queue is disorganized, the visitor is obligated to infer the order rather than exploit the ambiguity.

  **2. Gratuities and Service (Category III)**
  In jurisdictions where tipping is customary, the posted price is not the full moral cost of service. The tip constitutes a deferred wage agreement entered upon ordering. Withholding it is not a judgment on quality but a breach of contract. Citizens must not argue that the employer should pay higher wages; the visitor steps into an existing moral economy and must sustain it. To consume the service while rejecting the associated cost is to engage in deceit regarding one's intent to pay the established social rate.

  **3. Pedestrian Signal Compliance (Category IV)**
  Jaywalking is classified as Category IV not due to safety risks, but due to coordination value. A citizen may not cross against a signal even if the road is visibly empty. The moral weight rests on maintaining the predictability of the system, not the immediate physical danger. To cross when the light is red because "no cars are coming" privileges private judgment over public coordination. This erodes the reliability of the signal for those who cannot see the traffic. The obligation is to the rule, not the outcome.

  **4. Elevator Orientation (Category II)**
  Upon entering a confined communal space, citizens must face the door. Facing another passenger converts a shared space into an interpersonal confrontation. While this appears trivial, it violates the expectation of non-engagement required for public comfort. Failure to adhere signals an unwillingness to respect the boundary between public proximity and private engagement.

  **IGNORANCE AND LIABILITY**
  The Office anticipates the objection that "ought implies can." If a visitor cannot know a norm, they cannot follow it. The Office resolves this by shifting the burden of knowledge to the pre-departure phase. Ignorance of local convention is not exculpatory; it is preparatory negligence. If a citizen violates a norm unknowingly, the moral debt remains incurred.

  Upon return, citizens who have breached Category III or IV conventions must file a Report of Moral Liability. Depending on the severity, remedies may include mandatory restitution to the affected jurisdiction's charitable sector or formal apology letters filed with the Office. Citizens unable to guarantee compliance with local normative structures are advised to postpone travel until such time as they can fully assimilate the host jurisdiction's moral requirements. Morality does not accommodate tourists.

  **OFFICE OF MORAL COMPLIANCE**
  *Integrity Through Coordination*
