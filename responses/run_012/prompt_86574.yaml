  I'm a doctoral student in engineering, a few years into work on multi-objective optimization, and I'm fluent in the vocabulary that comes with it: Pareto dominance and non-dominated sorting, supported and unsupported points on the front, scalarizing functions (weighted sums, Tchebycheff, achievement scalarizing functions), the hypervolume indicator and other set-quality measures, knee points, preference articulation. I have no training in economics or philosophy beyond one undergraduate course I have mostly forgotten. Someone in my lab keeps invoking Arrow's impossibility theorem as though it settled something about the ranking and selection systems we build, and I want to know whether it says anything in my language. So: restate the theorem, and the shape of the standard proof, as faithfully as you can in my vocabulary. Treat the aggregation problem as an operator that takes a profile of orderings over alternatives and returns a single ordering, and give me a counterpart for each of the conditions — the requirement that the operator work for every admissible profile, the unanimity/Pareto condition, the independence condition, and the non-dictatorship condition — saying in each case what the condition becomes once the inputs are orderings over alternatives rather than vectors of objective values, and how much of the original survives the restatement. Be honest about the translation: do not silently upgrade ordinal inputs into the cardinal, commensurable objective values I normally optimize, and do not let a property my operators happen to have stand in for an axiom the theorem actually states.

  Then the residue report, which is what I really want. My guess is that the hardest things to carry over are these three: that the inputs are the preferences of several different people rather than several objectives of one decision-maker, and that a single decision-maker is under no pressure to avoid being a dictator over their own objectives; that ordinality, and the ban on comparing one person's preference intensity with another's, have no counterpart in a setting where objective values are cardinal and commensurable by construction; and that the things being aggregated may misreport themselves, so manipulability is a property of the inputs rather than of the operator — invisible to me, since I assume my inputs are measurements. For each item you conclude does not translate, give a verdict: is the gap a missing resource in my vocabulary, or is it a sign that the original claim was doing less work than its admirers suppose? I would genuinely rather be told that a chunk of the theorem is an artifact of an austere setup than be handed a tidy correspondence in which everything maps onto everything.

  Give me the answer in five named sections. "The translation" (roughly 600 words): the theorem and its conditions in my terms, flagging as you go where the mapping is exact and where it is already straining. "Clean mappings" (roughly 200 words): what carries over without loss, and why. "Distortions" (roughly 300 words): what carries over only with a fudge, naming the fudge each time. "Residue" (roughly 400 words): what has no counterpart at all, with your defect-of-my-vocabulary versus weakness-of-the-original verdict on each item. "Bottom line" (one short paragraph): having done the translation, is the theorem telling me something about aggregation operators I did not already know, or is it a fact about a much narrower setting than the rhetoric around it implies?
