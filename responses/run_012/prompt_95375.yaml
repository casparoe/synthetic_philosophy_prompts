              *   Prediction: Skeptic fears the math swamps the act. Realist claims the framework protects the act.
          *   *Row 3: Methodology (Matching vs. Summing).*
              *   Claim: How do we compare?
              *   Skeptic: Matching is arbitrary (reordering changes value).
              *   Realist: Matching is necessary, but constrained (e.g., by causal/spatial proximity).
              *   Crux: Is there a "natural" ordering of people?
