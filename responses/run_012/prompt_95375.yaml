              *   Realist: Yes, moral realism demands we rank them. Incomparability is a bug, not a feature.
              *   Crux: Is moral truth required to be complete?
              *   Case: Paradise vs. Paradise + 1 Tortured Soul.
              *   Prediction: Skeptic says "Incomparable or Worse (but unrankable)." Realist says "Strictly Worse."
          *   *Row 2: The Negligibility Problem.*
              *   Claim: Does a finite good matter against an infinite background?
