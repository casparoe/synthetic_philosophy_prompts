prompt: |-
  Some friends and I are doing a dumb philosophy-comedy night and I need a joke about aesthetic testimony. The punchline has to actually turn on the debate and not just be "art is subjective haha" — like why "just trust me, this painting is beautiful" seems to leave you with less than "just trust me, it's 3 o'clock", and whether you can really know a wine is good if you've never tasted it (the whole acquaintance-principle thing, where an aesthetic judgment has to be backed by first-hand experience of the thing). To give it somthing fresh, work in a made-up startup — say an app that farms out your taste to strangers whose taste you've never checked — and make the joke land on what the acquaintance principle would say about whether the app's users ever actually *know* anything or just recieve beliefs. Should be funny to people who've read the literature, not just nerd-funny.
