answer: |-
  My friend just raised seed funding for a startup called **Proxy**.

  The pitch deck was insane. The problem, according to them, is that looking at art is "high-friction." It takes time, emotional labor, and visual bandwidth. So Proxy solves this by crowdsourcing the gaze.

  You walk into the MoMA, you point your phone at a Rothko, and you keep the phone in your hand. You never look up. A stranger in a call center in Jersey looks at the painting through your camera, rates it, and your phone buzzes: *"Sublime. 9.5/10."* You nod, put the phone in your pocket, and walk to the next room.

  The founders say they're democratizing taste. The philosophers are having a stroke.

  Because here's the thing about testimony: If I text you, "It's 3 o'clock," and I'm reliable, you *know* it's 3 o'clock. Factual testimony transfers knowledge. You don't need to look at the sun.

  But if I text you, "This painting is beautiful," and you never look at the painting... you don't *know* it's beautiful. You just have a belief that *I* think it's beautiful.

  This is the **Acquaintance Principle**. You can't know a wine is good if you've never tasted it. You can't know a symphony is moving if you've got noise-canceling headphones on. Aesthetic judgment requires first-hand experience. Without it, you're epistemologically bankrupt.

  So, Proxy users walk out of the museum feeling cultured, confident, and full of aesthetic convictions. But according to the literature, they don't *know* anything. They haven't acquired knowledge; they've acquired *spoilers*.

  They aren't art critics. They're **aesthetic mules**. They're smuggling other people's beliefs across the border of knowledge, and they don't even know the package is empty.
