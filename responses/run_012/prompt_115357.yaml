answer: |-
  # The Joint-Carving Quiz

  **Instructions:** For each case, pick the single statement that best matches your gut reaction. Don't overthink the philosophy; pick what feels like the *actual state of things*.

  ### 1. Water vs. Heavy Water
  Heavy water (D₂O) has neutrons in the hydrogen nuclei. It looks and tastes like water, but it kills complex organisms and reacts slightly differently.
  *   **A.** It isn't water. "Water" is H₂O. If the microstructure is wrong, the stuff is different, regardless of appearance.
  *   **B.** It's water for most purposes, but not for biology. The category holds together because the properties usually hang together, not because of a strict atomic rule.
  *   **C.** "Water" is a label we apply to the clear, drinkable liquid in our environment. Chemistry can split it however it wants; the word is ours.

  ### 2. Jade (Nephrite vs. Jadeite)
  For centuries, "jade" was one stone. Mineralogy later revealed it was two distinct minerals with different structures, though they look and carve similarly.
  *   **A.** One is real jade, the other is a mimic. Or neither is "jade" in a scientific sense; the folk term was wrong about reality.
  *   **B.** Both are jade. They share a causal profile (hardness, texture, polish) that matters for carving and culture, even if the atoms differ.
  *   **C.** "Jade" is a trade term. Geology doesn't recognize it. It exists only because buyers and sellers found it useful to group them.

  ### 3. Element 118 (Oganesson)
  It sits in the "Noble Gas" column of the periodic table. But relativistic effects mean it likely won't be a gas and might not be inert.
  *   **A.** It is a noble gas. The proton count defines the element. Behavior is secondary to identity.
  *   **B.** If it doesn't act like a noble gas, calling it one is misleading. The category is about chemical behavior, not just counting protons.
  *   **C.** The periodic table is a human map. Whether it "is" a noble gas depends on whether that label helps us predict its behavior in a specific context.

  ### 4. Ring Species
  A chain of populations where A breeds with B, B with C, C with D, but D cannot breed with A.
  *   **A.** They are distinct species where they don't interbreed. Reproductive isolation is the hard boundary of the kind.
  *   **B.** "Species" is blurry here. They are a single evolutionary lineage that looks like multiple kinds due to geography.
  *   **C.** "Species" is a bookkeeping tool for biologists. Nature just presents variation; we draw the lines.

  ### 5. Bacteria & Horizontal Gene Transfer
  Bacteria swap genes freely across lineages, making a "tree of life" inaccurate.
  *   **A.** Bacterial species don't exist. Without clear lineage, the essential condition for the kind is missing.
  *   **B.** We group them by ecological niche or metabolic function. The genes matter less than what the organism *does* in its environment.
  *   **C.** The grouping is purely for medical or lab convenience. There is no natural unit here.

  ### 6. Genes & Alternative Splicing
  One DNA sequence can be spliced to create multiple different proteins with different functions.
  *   **A.** The DNA sequence is the gene. The proteins are just products. The essence is the code.
  *   **B.** The functional unit is the gene. If one sequence does two unrelated jobs, it might be better to model them as two overlapping genes.
  *   **C.** "Gene" is a legacy term from when we thought 1:1 mapping was true. We should keep using it only where it's convenient.

  ### 7. Pandas (Carnivora)
  Pandas are taxonomically Carnivora (digestive system, ancestry) but eat almost exclusively bamboo.
  *   **A.** It is a carnivore. Ancestry and anatomy define the kind, not current diet.
  *   **B.** It's functionally an herbivore. Classifying it as a carnivore obscures its actual ecological role.
  *   **C.** Dietary categories are for zookeepers. Taxonomy is for evolutionary biologists. Both are valid interests, neither is "the truth."

  ### 8. Depression (DSM-5)
  A cluster of symptoms (mood, sleep, energy) with no single known biomarker or lesion. Treatments work inconsistently.
  *   **A.** It's not a real kind yet. Until we find the underlying mechanism, it's just a label for a bunch of different problems.
  *   **B.** It's a real enough kind if the symptom cluster predicts treatment response. The causal glue is the network of symptoms, not a single lesion.
  *   **C.** It's a social construct to manage behavior and distress. The category exists because society needs to process suffering, not because nature carved it.

  ### 9. Race
  Human genetic variation exists, but folk racial categories often cut across genetic clusters.
  *   **A.** If it doesn't map to distinct biological essences, it isn't a biological kind. (It may be something else).
  *   **B.** Genetic clusters exist and can be medically relevant, even if they don't match folk labels perfectly.
  *   **C.** Race is a social kind. Its reality comes from how society treats people, not from their DNA.

  ---

  # Scoring Key

  Don't count points yet. Look at your pattern.

  **The Axes:**
  1.  **Source of Kindhood:** Does the kind come from the **World** (A), our **Theories/Models** (B), or our **Interests/Concepts** (C)?
  2.  **The Glue:** What holds the kind together? **Essence** (A), **Causal Cluster** (B), or **Human Convention** (C)?
  3.  **Induction to Metaphysics:** If a category predicts well, is it **Real** (A), **Useful** (B), or **Arbitrary** (C)?
  4.  **Scope:** Do you answer differently for Chemistry (Q1-3) vs. Humans (Q8-9)?

  **Tally your As, Bs, and Cs.**

  *   **Mostly As:** You think nature comes with labels already attached.
  *   **Mostly Bs:** You think nature comes with glue, but we have to find the edges.
  *   **Mostly Cs:** You think we bring the labels and the glue.

  **The Scope Check:**
  *   If you answered **A** for Water/Elements but **C** for Depression/Race: You are a **Local Realist**.
  *   If you answered **A** across the board: You are a **Universal Essentialist**.
  *   If you answered **C** across the board: You are a **Kind Nihilist**.
  *   If you answered **B** across the board: You are a **Pragmatic Realist**.

  ---

  # The Grid of Positions

  Map your dominant answer (A, B, or C) and your Scope (Universal vs. Local) onto this grid.

  | | **Essence (A)** | **Cluster (B)** | **Interest (C)** |
  | :--- | :--- | :--- | :--- |
  | **World (Realist)** | **The Hard Essentialist** <br>*(Mostly As, Universal)* | **The HPC Realist** <br>*(Mostly Bs, Universal)* | **[EMPTY]** |
  | **Theory (Pragmatist)** | **[EMPTY]** | **The Pragmatic Realist** <br>*(Mostly Bs, Local or Universal)* | **The Instrumentalist** <br>*(Mix of B/C, Theory-focused)* |
  | **Mind (Constructivist)** | **[EMPTY]** | **The Social Constructivist** <br>*(Mostly Cs on Human Kinds)* | **The Kind Nihilist** <br>*(Mostly Cs, Universal)* |

  ### Occupied Cells (The Positions You Might Hold)

  1.  **The Hard Essentialist (World/Essence/Universal):**
      *   *Belief:* Microstructure is king. If the atoms don't match, it's not the kind. Successful induction proves you found the essence.
      *   *Typical Pattern:* AAA AAA AAA.
      *   *Risk:* Struggles with biology and psychiatry where essences are missing.

  2.  **The HPC Realist (World/Cluster/Universal):**
      *   *Belief:* Kinds are real, but they are held together by homeostatic property clusters (causal mechanisms), not single essences. Depression is real if the symptoms causally reinforce each other.
      *   *Typical Pattern:* BBB BBB BBB.
      *   *Risk:* Can be vague on where the cluster boundaries lie.

  3.  **The Pragmatic Realist (Theory/Cluster/Local):**
      *   *Belief:* "Real" is a heavy word. Kinds are tools that carve nature *well enough* for prediction. Water is H₂O because that's useful for chemistry; Race is social because that's useful for sociology.
      *   *Typical Pattern:* AAB BCC BCC (Hard sciences = A/B, Soft sciences = C).
      *   *Risk:* Accused of equivocation on the word "real."

  4.  **The Social Constructivist (Mind/Interest/Local):**
      *   *Belief:* Hard sciences find real kinds; human sciences create them. Depression and Race are real *socially*, but not *biologically*.
      *   *Typical Pattern:* AAA AAA CCC.
      *   *Risk:* Inconsistency. Why does the human mind stop being part of nature at the boundary of the lab?

  5.  **The Kind Nihilist (Mind/Interest/Universal):**
      *   *Belief:* No kinds are real. Everything is a continuum. We project categories onto a chaotic universe for cognitive ease.
      *   *Typical Pattern:* CCC CCC CCC.
      *   *Risk:* Makes doing science sound impossible (since science uses kinds).

  ### Empty Cells (And Why)

  *   **World + Interest (Realist about Conventions):** Incoherent. If the kind is grounded in the World, it cannot be grounded primarily in Human Interest. (Unless you believe human interests are physical facts, which collapses into Pragmatism).
  *   **Mind + Essence (Conceptual Essentialism):** Rare to non-existent. If the kind is in the Mind, it doesn't have a mind-independent essence. If it has an essence, it's usually treated as World-bound.
  *   **Theory + Essence (Instrumental Essentialism):** Unstable. If you think categories are just tools (Theory), you usually don't believe they track Essences. If you believe in Essences, you usually think they are World-bound.

  ### Blind Spots (What This Quiz Misses)

  1.  **Process Ontology vs. Substance Ontology:** This quiz assumes kinds are *things* (substances, species). It doesn't capture the view that reality is made of *events* or *processes*. A Process Ontologist would answer "C" to everything, but for a different reason than the Nihilist (not "it's arbitrary," but "it's a snapshot of a flow").
  2.  **Dynamic Kind Realism:** Some views hold that kinds *evolve* their own essences over time (niche construction). This quiz treats essences as static. A person who believes genes *create* the environment which *selects* the genes might find the "Essence vs. Cluster" dichotomy too rigid.
  3.  **The "Real vs. Useful" Confusion:**
      *   *The Trap:* Many Pragmatic Realists (Cell 3) will self-report as Nihilists (Cell 5) because they say "Depression isn't *biologically* real."
      *   *The Fix:* Look at your B answers. If you picked B on Depression ("Real enough if treatment works"), you are **not** a Nihilist. You believe in *functional* reality. The quiz forces you to admit that "useful" is doing the work of "real" in your ontology. If you say a category isn't real but keep using it for induction, you are a Pragmatist pretending to be a Nihilist.

  ### Final Calibration Note
  If you found yourself wanting to write "It depends on what you mean by 'is'" in the margins: **You are a Pragmatic Realist.** You recognize that the word "real" is doing too much heavy lifting. Your job at the meetup is to stop people from using "real" as a binary switch and get them to talk about *causal density* instead.
