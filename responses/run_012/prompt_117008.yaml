answer: |-
  Good morning. Look around this room. You see students, neighbors, and elected officials. You see people who know the zoning code by heart and people who just want to know where the next bus stop goes. You are here because a computer picked you. That is the first thing you need to know about your authority: it is accidental.

  In political theory, we often call this a "mirror." The argument is that because you were selected by lot, you statistically resemble the wider community. You are a microcosm. If the neighborhood is worried about rent, you are worried about rent. If the university is worried about expansion, some of you are too. This mirroring is supposed to give you legitimacy. You speak for the public because you *are* the public, distilled into sixty chairs.

  But you are not here to stand still and reflect us like a glass pane. You are here to talk, to listen, and to change your minds. This is the second thing you need to know: your task is deliberation. We are asking you to take the raw material of public opinion and refine it. We want you to resist the slogans, check the facts, and perhaps conclude something different than what you believed when you walked in.

  And here we arrive at the friction that will define these three weeks. I call it the mirror-deliberation trade-off.

  If you remain a perfect mirror of the public, you will bring all of the public's contradictions, biases, and fatigue into this room. You will reproduce the polarization outside. But if you succeed in deliberating—if you become more informed, more patient, and more nuanced than the average voter—you cease to be a perfect mirror. You become something else. You become a mini-public that thinks better than the public it represents.

  This tension is not a bug in the design; it is the feature. I know some of you are wondering why you were picked. To the neighbors who worry this is an experiment: you are not data points. You are the only people in this process authorized to hold this tension. To the Councillors who wonder where your vote fits: you hold the mandate of the ballot box. This body holds the mandate of the drawn lot. Yours is the authority to decide; theirs is the authority to recommend based on what happens when people like us are given time to think.

  There is a risk here. If you lean too hard into being a mirror, you will simply vote your initial prejudices. If you lean too hard into deliberation, you might drift into a kind of technocratic bubble, disconnected from the urgent frustrations of the street. You must live in the discomfort between the two.

  I know this sounds abstract. Here is the practical reality: When you argue about housing density today, someone will say, "People out there will never accept this." That is the mirror speaking. Someone else will say, "But if we explain the trade-offs, they might." That is deliberation speaking. You need both voices. If you feel a strange pressure to represent everyone you know, relax. You were chosen by chance, not because you're the loudest on your block. In fact, if you leave this room feeling slightly unlike your neighbors because you know more about the proposal than they do, you are probably doing it right.

  So, what authority do you have? You do not have the power to sign laws. The Councillors retain that. But you have the power of considered judgment. In a system designed for speed and campaigning, you are the mechanism for slowness and reflection. Your legitimacy comes not from being exactly like the public, nor from being entirely independent of them, but from navigating the gap between the two.

  We need you to be us, but the best version of us that we rarely have time to be. Do not try to solve the tension between mirroring and deliberating. Carry it. Let it shape your questions. Let it make you skeptical of both raw opinion and expert certainty.

  The housing proposal is the test case, but the real work is proving that a group of strangers can hold this contradiction without breaking. Thank you. Let's begin.

  ***

  **Note on the Mirror/Deliberation Trade-off**

  My reasoning in the speech relies on the assumption that "mirroring" (descriptive representation) and "deliberation" (transformative reasoning) are inherently divergent goals—that becoming more informed necessarily makes one less descriptive of the wider public's current state.

  I would change my mind about this trade-off being the right frame if convinced that **deliberation is itself a descriptive trait of the public's latent will.** If one argues that the public *wants* to be more informed but is structurally prevented from doing so by the current electoral system, then the citizens' assembly isn't distorting the mirror by deliberating; it is polishing it. In that view, the "true" reflection of the public includes their capacity for reason, not just their snapshot opinions.

  The speech is most vulnerable in its address to the Councillors. It assumes a complementary relationship between electoral and sortitive legitimacy. However, if electoral legitimacy is fundamentally majoritarian and sortitive legitimacy is fundamentally consensus-based, they may not be compatible institutions but competing sovereigns. If the trade-off is a false dilemma, I would replace it with a **dynamic representation** frame: the assembly doesn't choose between mirroring and deliberating, but rather mirrors the public's *potential* for deliberation. For that replacement to be right, it would have to be true that the public's "ignorance" is primarily a result of information asymmetry and lack of time, rather than entrenched ideological incompatibility. If the polarization is foundational rather than situational, the trade-off remains real, and the speech stands.
