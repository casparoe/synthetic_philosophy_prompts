prompt: |-
  So I've been in a long-running group chat arguement about counterfactual mugging and XOR blackmail, and at this point I'm honestly not sure the people I'm arguing with even disagree with me about the cases — I think they disagree about what question we're asking, and we keep talking past each other because everyone just pattern-matches "UDT" or "FDT" onto whoever seems willing to pay the blackmailer and moves on. What I want from you is a decision tree / flowchart that takes a person from a couple of low-level commitments they'd actually endorse and lands them on one of the named positions in decision theory, so we can stop relitigating vibes. Build it from the logical space, not from a list of names: first the branch questions and the combinations of answers they allow, then locate the real positions in that space. Start the tree somewhere like "I accept that an agent could be in a position where its choice correlates with, but doesn't causally influence, something outside its light cone" — get them to grant the setup before they can see where it's leading them.

  Each branch node should be one of the load-bearing assumptions, phrased as a question a person can answer without already knowing which interpretation it commits them to: does the agent's decision have to make a difference in the actual world, or is it enough that it's the decision it would have made in the branch that didn't happen? Is the link between the agent's disposition and the payoff evidential, causal-but-not-in-time, or "logical"? Should the agent choose an action or a policy/algorithm? Does "the blackmailer could have known what I'd do" already presuppose a determinate fact about a counterfactual me? — plus a couple more that you think belong on the tree. The leaves should be the actual named views (CDT, EDT, and the whole updateless / functional / timeless-style family, plus the "the scenario is incoherent or the predictor can't exist" camp and the acausal-trade people), each with one sentence on the commitment that's most awkward for it. Flag any pair of leaves your tree can't really seperate (I suspect updateless and functional come out identical on everything I can operationalize, and I'd much rather you say so than fake a distinction), and note which combinations of answers come out empty, with a one-line diagnosis of whether that's because the view is incoherent, unattractive, or merely unexplored.

  One thing to get right: put XOR blackmail in there as a leaf-separator, because that's exactly the case where my friends and I split, and I think the split tracks something real about whether you're treating the blackmailer's threat as a precommitment you'd have wanted to have made versus an acausal thing to be reasoned about from behind a veil. And please don't hand me a glossary — I want the branches to be the questions and the position-names to fall out of the answer-paths; if a path lands somewhere nobody's actually defended, label it "unnamed" and tell me why it's empty. Audience is basically me and five stubborn friends who all know the standard Newcomb setup cold, so you can assume the vocabulary but definitely not agreement.
