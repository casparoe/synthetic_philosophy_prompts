answer: |-
  # The Decision Theory Decision Tree

  This flowchart is designed to bypass label-matching ("I'm FDT!") and force agreement on the underlying mechanics. Follow the branches. If you and your friends answer the questions identically but land on different leaves, you have identified the exact point of disagreement.

  ### **Node 1: The Metaphysical Premise**
  **Question:** Is it coherent to posit a scenario where your decision algorithm correlates with a distant event (like a predictor's simulation or a blackmailer's threat generation) *without* a causal signal traveling from your choice to that event?

  *   **NO:** → Go to **Leaf A (The Skeptic / Causal Fundamentalist)**.
  *   **YES:** → Go to **Node 2**.

  ---

  ### **Node 2: The Unit of Agency**
  **Question:** When evaluating rationality, is the primary object of choice the **token action** you take right now, or the **policy/algorithm** that determines what you would do in all relevant scenarios (including counterfactual ones)?

  *   **TOKEN ACTION:** (You choose *what to do now*.) → Go to **Node 3A**.
  *   **POLICY/ALGORITHM:** (You choose *what kind of agent to be*.) → Go to **Node 3B**.

  ---

  ### **Node 3A: The Evidential Filter (For Action-Choosers)**
  **Question:** When calculating the expected utility of your action, does your choice serve as *evidence* about the past prediction (updating the probability the predictor made), or do you hold the past prediction fixed as a causal fact?

  *   **HOLD FIXED:** (The prediction is already done; my choice can't change it.) → Go to **Leaf B (CDT)**.
  *   **AS EVIDENCE:** (My choice tells me what the predictor likely saw.) → Go to **Leaf C (EDT)**.

  ---

  ### **Node 3B: The Temporal Perspective (For Policy-Choosers)**
  **Question:** Do you evaluate the success of your policy from **behind a veil of ignorance** (before knowing if the blackmailer contacted you / if the box is full), or from your **current perspective** (conditioning on the fact that you have already received the threat / see the box)?

  *   **CURRENT PERSPECTIVE:** (I know I'm in the blackmail scenario; I must optimize for *this* branch.) → Go to **Leaf D (TDT / Updateful FDT)**.
  *   **VEIL OF IGNORANCE:** (I evaluate the policy based on ex-ante expected value, even if I'm currently in a low-value branch.) → Go to **Leaf E (UDT / Updateless FDT)**.

  ---

  ## **The Leaves**

  ### **Leaf A: The Skeptic / Causal Fundamentalist**
  *   **Path:** Node 1 (NO).
  *   **Position:** The scenario is physically or logically impossible. Predictors of this fidelity cannot exist without causal access, so the problem dissolves.
  *   **The Awkward Commitment:** "I must deny the coherence of the thought experiment itself rather than adjust my decision theory to handle it."
  *   **Note:** Often functionally indistinguishable from CDT in practice, but disagrees on the *possibility* of the setup rather than the *response* to it.

  ### **Leaf B: Causal Decision Theory (CDT)**
  *   **Path:** Node 1 (YES) → Node 2 (ACTION) → Node 3A (HOLD FIXED).
  *   **Position:** Only causal consequences matter. Correlations that aren't caused by the act are irrelevant noise.
  *   **The Awkward Commitment:** "I will leave money on the table in Newcomb's Problem because taking both boxes causally increases my wealth by $1,000 regardless of what's in the box."
  *   **XORB Behavior:** **PAYS.** (The threat exists; paying causally avoids the damage.)

  ### **Leaf C: Evidential Decision Theory (EDT)**
  *   **Path:** Node 1 (YES) → Node 2 (ACTION) → Node 3A (AS EVIDENCE).
  *   **Position:** Actions provide news about the world. You should choose the action that gives you the best news, even if it doesn't cause the outcome.
  *   **The Awkward Commitment:** "I will one-box in Newcomb's Problem, but I will also pay the blackmailer in XOR Blackmail because paying is evidence that I am the type who gets blackmailed (and thus survives), whereas refusing is evidence the blackmailer doesn't exist (but if he does, I'm doomed)."
  *   **XORB Behavior:** **PAYS.** (Paying correlates with the world where the blackmailer exists and you lose less; refusing correlates with the world where he doesn't exist, but conditional on him existing, refusing is fatal.)

  ### **Leaf D: TDT / Updateful FDT**
  *   **Path:** Node 1 (YES) → Node 2 (POLICY) → Node 3B (CURRENT PERSPECTIVE).
  *   **Position:** You choose a policy, but you update on your current observations before evaluating it. You optimize for the world you *know* you're in.
  *   **The Awkward Commitment:** "I wish I had been the kind of agent who wouldn't pay, but now that I *have* received the blackmail message, I must pay to minimize loss in this specific timeline."
  *   **XORB Behavior:** **PAYS.** (Once the message is received, the blackmailer's prediction is treated as fixed history. Refusing now only incurs the damage.)
  *   **Note:** This view is often dynamically inconsistent; the agent wishes to precommit but cannot rationally follow through once the scenario actualizes.

  ### **Leaf E: UDT / Updateless FDT / Acausal Trade**
  *   **Path:** Node 1 (YES) → Node 2 (POLICY) → Node 3B (VEIL OF IGNORANCE).
  *   **Position:** You choose a policy that maximizes expected utility across all possible worlds weighted by their prior probability, without updating on your specific location in the scenario.
  *   **The Awkward Commitment:** "I will refuse the blackmail even after receiving the threat, because my refusal is logically linked to the world where the threat was never sent, and that world has higher prior expected value."
  *   **XORB Behavior:** **REFUSES.** (The policy "Never Pay" prevents the blackmailer from sending the message in the first place.)
  *   **Note on Identity:** **UDT and Updateless FDT land here.** They are operationally identical on these cases; the distinction is merely whether you frame the correlation as "updateless priors" (UDT) or "logical counterfactuals over function outputs" (FDT). **Acausal Trade** is simply this leaf applied to agents in different universes rather than predictors in the same one.

  ---

  ## **Empty / Unstable Nodes**

  **1. The "Updateful Refuser" (Policy + Current Perspective + Refuse XORB)**
  *   **Diagnosis:** **Dynamically Inconsistent.**
  *   **Why:** If you evaluate from the *current perspective* (knowing the message arrived), refusing is strictly dominated by paying. An agent holding this view would want to precommit to refusing but would inevitably betray that precommitment upon receiving the message. No stable theory occupies this leaf.

  **2. The "Causal One-Boxer" (Action + Hold Fixed + One-Box)**
  *   **Diagnosis:** **Incoherent.**
  *   **Why:** If you hold the past prediction fixed (CDT axiom), two-boxing strictly dominates one-boxing in Newcomb's problem. To one-box while holding the past fixed requires magic thinking (believing your action reaches back in time causally).

  **3. The "Evidential Refuser" (Action + As Evidence + Refuse XORB)**
  *   **Diagnosis:** **Mathematically Impossible.**
  *   **Why:** EDT maximizes $P(World|Action) \times Utility$. In XORB, $P(Blackmailer Exists | Pay)$ is near 1, and $P(Blackmailer Exists | Refuse)$ is near 0. Since the utility of "Exists + Pay" is better than "Exists + Refuse", EDT must pay. Refusing requires ignoring the evidential link you granted in Node 3A.

  ---

  ## **How to Use This With Your Friends**

  1.  **Don't start with the labels.** Ask them to walk the tree.
  2.  **Focus on Node 3B for XORB.** This is the split you mentioned. If they say "I choose a Policy" (Node 2) but still want to Pay in XORB, they are implicitly answering "Current Perspective" at Node 3B. They are **Leaf D**.
  3.  **If they claim Leaf E but want to Pay:** They are confused about what "Updateless" means. If you update on receiving the message, you are Leaf D.
  4.  **If they claim Leaf E but deny Node 1:** They are Leaf A masquerading as Leaf E. They enjoy the *aesthetic* of UDT but reject the *metaphysics* required to make it work.
  5.  **The UDT/FDT Flag:** If one friend says "UDT" and another says "FDT" but they both traverse the path to **Leaf E**, tell them to shut up; they agree on all operational outcomes. The difference is purely explanatory flavor.
