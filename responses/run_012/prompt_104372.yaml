  OmniCause Indemnity Group
  14 October 2023
  Policy #8920-KL
  Dear Mr. Haris,

  We have completed our review of your claim regarding the residential fire at 42 Willow Creek Drive. Regrettably, we must deny coverage. Our field adjuster confirmed that no created substance possessed causal efficacy in this incident. The frayed wiring did not spark; the oxygen did not sustain combustion; the candle did not melt the wax. Rather, at the precise instant the flame encountered the curtain, God created the accident of burning directly. The flame was merely the occasion, lacking any power to compel the Divine Will.

  Your policy underwrites risk based on the "Custom and Habit" clause. Please recall that our premiums are calculated by actuaries who track the frequencies of God's customary actions, not necessary connections. We price based on the stability of Divine Habit (*adah*), assuming the Almighty will likely continue to create fire when He creates the conjunction of flame and cotton. Our actuaries function as empiricists tabulating Divine Habits without attributing necessity to them. They observe that God usually creates smoke after fire, but they cannot guarantee He will do so next time. However, coverage requires that the loss occur outside the insured's moral acquisition (*kasb*).

  Our investigation established that you left the candle unattended. In this metaphysic, your negligence is genuinely yours; you truly acquired the choice to leave the room. You are blameworthy for this omission, even though your omission produced nothing. Because you owned the occasion for the destruction, even though you lacked the power to cause it, the loss falls under the exclusion for insured-acquired risks. We cannot indemnify a loss where the insured provided the occasion through moral fault, even if that fault was causally inert. You are responsible for the sin of negligence, but not the physics of the fire.

  Furthermore, we must address the continuity of the insured property. As you know, accidents are recreated at every instant. The house we insured on Tuesday is not, strictly speaking, numerically identical to the house that burned on Wednesday. While we waive this atomist discontinuity for billing purposes to avoid administrative collapse, it complicates total loss claims where the substrate ceases entirely. It is administratively annoying to treat every moment as a new creation, requiring us to verify the identity of the walls at every renewal, but we must adhere to doctrine. We cannot replace a house that never persisted long enough to be fully lost.

  Additionally, please note that our policies explicitly exclude miracles. A miracle is not logically impossible, merely a deviation from the customary schedule. We do not price for Divine interruptions of habit. Since this fire followed the usual sequence of events—however causally empty that sequence may be—it does not qualify as a miraculous disruption warranting payout.

  Finally, regarding subrogation: since God is the sole agent, there is no third party against whom we can seek recovery. The wiring is innocent of causality, and litigation against the Necessary Existent is neither permissible nor practical. Consequently, the file is closed.

  We recommend you continue to lock your doors and test your smoke detectors. While these actions cause nothing, God customarily creates safety for those who take precautions and creates harm for those who do not. It is prudent to act within the habitual order, even if the lock possesses no power to stop the intruder.

  Sincerely,

  Sarah Jenkins
  Senior Claims Adjuster
