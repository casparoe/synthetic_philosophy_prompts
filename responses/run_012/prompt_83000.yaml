answer: |-
  **UNIVERSITY EXAMINATION PAPER**

  **Module:** Metaphysics of the Social World (Year 3)
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer ONE question. Closed book.

  **Question 1**

  Consider the ontological status of generational categories (e.g., Baby Boomers, Gen Z). To determine whether these categories refer to real kinds or merely convenient shorthand, you must apply the following **two-stage reality check** within your essay:

  > **Stage one — substitution.** Take any explanation that appeals to a generation ('Gen X is more cynical about institutions because of what they saw growing up', etc.) and rewrite it so the generation label is replaced by the bare demographic facts: birth years, age at the time of the relevant event, period effects. If the explanation survives the rewrite intact, the generation was doing no explanatory work. If it collapses, say precisely what was lost.
  >
  > **Stage two — boundary.** Now re-cut the birth years: move every boundary five years earlier, or split a single generation in two. If the same explanations come out the other side attached to different people, ask whether the original boundaries were discovered or stipulated.

  After subjecting generational claims to both stages, does anything survive? Is what survives sufficient to make generations real kinds, or only convenient shorthand? You must give the generation-realist their strongest shot: argue that generations are not defined by birth years at all but by having lived through a common formative episode, so membership is fixed by history rather than by demography. Assess whether this reply actually passes the two tests or merely relocates the arbitrariness from the choice of dates to the choice of which episode counts. Finally, consider whether the kind might be real only because the label makes people behave generationally (i.e., whether we have made the kind rather than found it), and whether this tells for the realist or against.

  ***

  **MODEL ANSWER**

  To assess whether generations are real kinds, we must subject common explanatory practices to the two-stage reality check. The central tension lies between generations as natural groupings grounded in shared history and generations as arbitrary demographic slices used for sociological convenience.

  Applying stage one, substitution, we take a standard claim: 'Millennials are economically anxious because of the 2008 crash.' Rewritten without the label, this becomes: 'Individuals aged 18–26 during the 2008 crash are economically anxious due to period effects.' In many causal explanations, the label 'Millennial' drops out without loss. The explanatory work is done by the event and the developmental stage of the subjects, not the generational name. If the explanation survives intact, the generation label is merely a shorthand for a cohort experiencing a period effect. However, the label might retain work if it implies a shared *consciousness* of the event, rather than mere exposure. If 'Millennial' implies a collective processing of the crash mediated by culture, the substitution loses the element of shared identity. Thus, stage one suggests generations are real only if they entail more than aggregated demographic data; they require a cohesive social psychology.

  Stage two, boundary, tests the precision of these kinds. If we shift the Millennial cut-off by five years, does the explanation hold? If individuals born in 1980 and 1985 are fundamentally different in their economic anxiety, but the boundary sits at 1981, the category is stipulated, not discovered. Real kinds, like biological species, usually possess fuzzy but non-arbitrary boundaries grounded in causal mechanisms. If the boundary is purely conventional, the kind is likely nominal. However, students often err by assuming arbitrariness settles the question; many real social kinds have stipulated boundaries (e.g., legal adulthood). The crucial issue is whether the variation within the group is significantly less than the variation between groups. If shifting the boundary includes people who demonstrably lack the formative experience, the kind loses predictive power. Therefore, stage two suggests that while boundaries may be stipulated, the underlying clustering of experiences must be robust for the kind to be real.

  The realist's strongest reply avoids demography entirely, arguing generations are defined by common formative episodes. On this view, membership is fixed by history: if you came of age during the Great War, you are part of that generation, regardless of birth year. This attempts to bypass stage two's boundary problem. However, this merely relocates the arbitrariness. Which episodes count? Why does the 'Internet Revolution' constitute a generational break while the 'Mobile Phone Revolution' does not? Selecting the formative episode requires a prior judgement about what divides society, which risks circularity. Furthermore, without birth years, the category becomes unmanageable; a 40-year-old and a 20-year-old might share a formative event, but lack the lifecycle synchrony that makes generations distinct. The realist saves the 'shared experience' element lost in stage one but struggles to define the group's extent without reintroducing demographic stipulations.

  Finally, we must consider the looping effect. Even if generations fail the first two stages as discovered kinds, they may succeed as interactive kinds. If individuals believe they are Gen Z, they may adopt behaviours associated with that label, thereby making the classification true. This tells for a specific type of realism: generations are real because they are real in their consequences. However, this is not the realism of natural kinds. It is the realism of institutional facts. The label creates the cohesion that the demographic facts lack.

  In conclusion, generations fail the test for natural kinds. Stage one shows demographic facts often suffice for causal explanation, and stage two reveals boundaries are largely stipulated. The realist appeal to formative episodes clarifies the mechanism of cohesion but cannot escape arbitrariness in episode selection. However, generations possess a derived reality through the looping effect. They are not found in the stars or biology, but made through social recognition. They are real kinds only insofar as we treat them as such, functioning as self-fulfilling prophecies rather than discovered natural joints.

  ***

  **MARKING SCHEME**

  **Total Marks:** 20
  **Pass Mark:** 10

  **Criteria for Assessment**

  | Move | Marks | Requirement | Common Pitfalls / Loss of Marks |
  | :--- | :---: | :--- | :--- |
  | **1. Stage One Application** | 4 | Correctly applies the substitution test. Distinguishes between period effects and shared identity/consciousness. | Students often claim the explanation *always* collapses or *always* survives. Marks lost for failing to identify what specifically is lost (e.g., collective consciousness). |
  | **2. Stage Two Application** | 4 | Correctly applies the boundary test. Nuanced view on arbitrariness (stipulated boundaries do not automatically negate reality). | **Critical:** Students typically treat 'boundaries could be drawn otherwise' as a definitive refutation of reality. Marks lost for failing to compare intra-group vs. inter-group variation or ignoring legal/social precedents for stipulation. |
  | **3. Realist Reply (Episodes)** | 4 | Articulates the 'formative episode' argument clearly. Assesses whether this solves the boundary problem or relocates arbitrariness. | Students often accept the realist reply uncritically. Marks lost for failing to challenge the selection criteria for 'formative episodes' (circularity risk). |
  | **4. Looping Effect** | 4 | Analyses the self-fulfilling prophecy aspect. Distinguishes between 'found' kinds and 'made' kinds (interactive kinds). | Students often conflate 'socially constructed' with 'not real'. Marks lost for failing to specify that this supports a different *type* of realism (institutional/interactive). |
  | **5. Ontological Verdict** | 4 | Provides a coherent conclusion synthesising the tests. Clearly states whether generations are natural, interactive, or shorthand. | Students often sit on the fence. Marks lost for contradictory conclusions (e.g., claiming they are natural kinds *because* people believe in them). |

  **Examiner's Note:** Pay particular attention to Move 2. The most common error is treating boundary arbitrariness as a knockout blow against ontological reality. Candidates should recognise that many real social kinds (e.g., legal categories) have stipulated boundaries. The mark is awarded for analysing whether the stipulation tracks a genuine underlying clustering of traits, not merely for noting the stipulation exists.
