      *   *RCP:* The argument hinges entirely on defining the set from which I am sampled. Am I a "human"? A "conscious observer"? A "carbon-based lifeform"?
      *   *The Problem:* Different classes yield different probabilities for doom. Narrow class (humans) $\rightarrow$ sooner doom. Broad class (all minds) $\rightarrow$ later doom (or irrelevant to humans).
      *   *The "Crux":* There is no consensus on a principled rule. It depends on *what property makes you a valid observer for the statistic.*

  3.  **Address the "Principled Rule" Question:**
      *   Is there a rule? No, not universally accepted.
      *   Why? Because it depends on the *mechanism* of the sampling.
      *   *Analogy:* If I pull a ball from an urn, is the reference class "red balls," "plastic balls," or "balls with numbers"? It depends on *how* the ball was selected.
      *   *In DA:* How was *you* selected? By biology? By consciousness? By being able to understand the DA?
      *   *Key Philosophical Stance:* Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA). (Might be too technical, need to simplify). Let's stick to the "information content" angle.

