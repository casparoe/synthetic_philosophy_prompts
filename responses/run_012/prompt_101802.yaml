prompt: |-
  Hey, I'm a highschooler who's been going down the doomsday argument rabbit hole and I'm stuck on the reference class problem. I get the basic idea that if I count myself as a random human among all humans, I get one estimate of how many people will ever live, but if I count myself as a random observer among all observers, I get a different one. What I dont get is what actually decides which class is the right one. Like, is there a principled rule, or is it just a choice that changes the answer? Here's a twist I thought of to make it concrete: imagine we find out octopuses have a rich inner life, and we also build AI systems that say they're conscious. Now I want to estimate the total number of observers that will ever exist. Should I count myself as a random human, a random Earth-origin mind, or a random mind anywhere in the universe? Does the choice change the doomsday estimate, and if so, how much? Also, if the right class includes future AI or aliens, does that make my own existence less informative about humanity's future? Please explain the crux, not just that the class is vague.
