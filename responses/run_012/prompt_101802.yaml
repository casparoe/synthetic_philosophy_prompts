  5.  **Synthesize the "Crux":**
      *   The crux isn't just vagueness; it's about **correlation vs. independence**.
      *   If the reference class includes things that are *independent* of human survival (like AI surviving human extinction), then my birth rank tells me about the *total class*, not the *human subset*.
      *   The "Right" Class is the one where the *mechanism generating observers* is tied to the *hypothesis you are testing*.
