          *   *Correction:* If I include AI, my rank $n$ stays the same (I am still the 60 billionth mind), but the potential $N$ grows massively. This makes my position *even more* improbably early. So the DA actually gets *stronger* for "Total Minds" ending soon, unless...
          *   *Unless* the AI minds haven't been born yet. My rank is fixed. The potential future is huge. The probability of me being in the first 0.001% is tiny. So the DA says "The total number of minds will not be huge."
          *   *So:* Including AI makes the Doomsday argument apply to *Civilization/Intelligence*, not just humans. It predicts we won't create vast numbers of AI.
