          *   *Audience:* She's writing for the *Westminster Review* (radical, intellectual). She's arming the skeptics, but also warning the sincere. She's creating the "habit of thought" that makes Cummingism look obsolete. It's not about refuting predestination logically; it's about showing it's *morally ugly* and *socially convenient*.

  6.  **Refining the Tone:**
      *   Need to sound like a knowledgeable peer.
      *   Acknowledge the "joke" aspect. It *is* satire. But Eliot's satire is heavy.
      *   Ensure the distinction between "Evangelical" (Cumming's sect) and "Christianity" (general) is clear.
