      *   *Nuance:* Make sure not to paint Eliot as a cold atheist in 1855. She is deeply moral. The "Religion of Humanity" is brewing.
      *   *The "Joke":* The joke is that Cumming thinks he's saving souls, but he's actually just curating a brand.

