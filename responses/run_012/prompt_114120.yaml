      *   **Question 4: The PAD Paradox (The "Ugly" Bit).**
          *   This is the Ulysses Contract problem.
          *   Law prioritizes *current safety* over *prior autonomy*.
          *   Presupposition: The "ill" state is not the "true" self, OR the "ill" state's risk outweighs the "well" state's preference.
