          2.  NGRI (Not Guilty by Reason of Insanity) -> Indefinite hospitalization (often longer than prison).
          3.  GBMI (Guilty But Mentally Ill) -> A hybrid status.
      *   **Specific Trigger:** A new bill allowing courts to override Psychiatric Advance Directives (PADs) based on "impaired insight."
      *   **Key Questions:**
          1.  What does this apparatus presuppose about mental illness, agency, and choice?
          2.  Does it need a strong claim (illness destroys voluntariness) or a weaker one (unreliable preferences, state interest)?
