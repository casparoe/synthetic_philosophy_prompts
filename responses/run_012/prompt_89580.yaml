          *   *Crucial Distinction:* In Case 1 & 4, religious argument was the *sole* ground. In Case 2 & 5, religious argument was *part* of the ground. In the New Submission, they explicitly label the religious part as the "ground of its conclusion" and the public part as "confirming."

