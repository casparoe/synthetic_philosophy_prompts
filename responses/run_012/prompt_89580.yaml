      *   *Hypothesis C (The "Institutional vs. Personal/Professional" Rule):* Institutional religious bodies are scrutinized more heavily than individuals or professionals.
          *   *Fit:* Refusals 1 & 4 are coalitions/federations. Admissions 2 (Chaplains - professional/religious mix), 3 (Physicians - professional), 5 (Nurse - individual).
          *   *Weakness:* Case 2 is a "network of hospice chaplains," which is somewhat institutional, but they offered secular evidence.

      *   *Hypothesis D (The "Composite Argument" Rule):* Religious premises are admissible *only if* accompanied by independent secular/public policy justification.
          *   *Fit:* This is the strongest fit.
          *   Refusal 1: "Sole premise... life is a trust from God... nothing else."
