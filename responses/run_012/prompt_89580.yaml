      *   *Decision:* The "Secular Grounding" rule is the only one that creates tension. The "Solely Religious" and "Civic Hostility" rules both point to Admission. The "Secular Grounding" rule points to Refusal (because the new submission admits religious ground is primary).
      *   *Best Guess:* The Assembly has not previously enforced "Secular Grounding," only "Solely Religious." Case 2 admitted theology as an argument alongside evidence without questioning which was the "ground." Therefore, the "Solely Religious" rule is the operative one. Admission is the consistent call.

