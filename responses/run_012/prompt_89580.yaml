          2.  Predictions under each rule.
          3.  Best Guess & Reasons.
          4.  Closest Analog.
          5.  Principles (Admit vs. Refuse).
          6.  The Test Case.

      *   *Refining the Rules:*
          *   Rule 1: The *Exclusivity* Rule. (Refuse if *solely* religious).
          *   Rule 2: The *Civility* Rule. (Refuse if campaigning/hostile).
          *   Rule 3: The *Integration* Rule. (Admit if religious views are integrated with secular evidence/experience).
          *   *Note:* The New Submission passes Rule 1 (not solely religious), passes Rule 2 (good faith), passes Rule 3 (integrated).
          *   *Wait, is there a rule that suggests Refusal?*
          *   Maybe the "Institutional Religious Voice" rule? Case 1 & 4 (Refused) are coalitions/federations. Case 2 (Admitted) is a network of chaplains (professional/religious). Case 5 (Admitted) is individual.
