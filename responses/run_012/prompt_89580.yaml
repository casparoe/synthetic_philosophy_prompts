answer: |-
  **To:** The Chair
  **From:** The Rapporteur
  **Subject:** Ruling on the Admissibility of the New Submission

  You have asked for an analysis of our procedural precedents to determine whether to admit the new submission from the coalition of congregations. Below is the breakdown of the rules consistent with our five prior rulings, the predictions each generates, my recommended ruling, and the implications of that choice.

  ### 1. The Rules Consistent with Our Record

  Our five prior rulings are jointly consistent with three distinct procedural rules. While they overlap in the past cases, they diverge in how they would treat the new submission.

  **Rule A: The "Exclusivity" Bar**
  *   **Formulation:** A submission is refused if its grounds are *entirely* religious and offer *no* independent public or secular argument (evidence, state duty, clinical experience).
  *   **Fit:** This explains the refusal of Case 1 (Clergy: "nothing else was offered") and Case 4 (Congregations: "entirely religious, no public argument"). It explains the admission of Case 2 (Chaplains: theology *plus* evidence), Case 3 (Physicians: secular only), and Case 5 (Nurse: tradition *plus* experience).
  *   **Prediction for New Submission:** **Admit.** The submission offers a "developed public argument" regarding safeguards and state duty, even if secondary to the religious ground. It is not *exclusively* religious.

  **Rule B: The "Civic Conduct" Bar**
  *   **Formulation:** A submission is refused if it is accompanied by a campaign against the assembly, questions the assembly's standing, or refuses engagement (cross-examination).
  *   **Fit:** This explains the refusal of Case 1 (Press conference, questioned standing) and Case 4 (Campaign against assembly). It explains the admission of Case 2 (Agreed to appear), Case 3 (Professional brief), and Case 5 (Personal capacity).
  *   **Prediction for New Submission:** **Admit.** The submission is offered "quietly and in good faith," the authors have asked to appear and be cross-examined, and no campaign accompanies it.

  **Rule C: The "Foundational Secularism" Bar**
  *   **Formulation:** A submission is refused if the *ultimate ground* or primary justification for the recommendation is religious, even if secular evidence is offered in support. Religious reasons may be present, but they must not be the structural foundation of the argument.
  *   **Fit:** This is consistent with the record but latent. In Case 1 and 4, the religious ground was the *only* ground. In Case 2 and 5, the record does not specify which ground was primary; they are described as "partly/also" arguments. Thus, Rule C fits the data but has not yet been tested against a submission that explicitly prioritizes the religious ground.
  *   **Prediction for New Submission:** **Refuse.** The submission explicitly identifies the religious premise ("life is a trust from God") as the "ground of its conclusion" and the public argument merely as "confirming." Under this rule, the secular evidence is instrumental, not justificatory.

  ### 2. Best Guess Ruling

  **Ruling:** **Admit the submission.**

  **Reasons:**
  1.  **Precedential Weight:** Rules A and B are the *active* principles demonstrated in our refusals. In Case 1 and 4, the refusals were justified by the *absence* of public argument and the *presence* of hostility. We have never previously refused a submission that offered robust public evidence simply because the authors privately prioritized a religious motive. To apply Rule C now would be to introduce a new standard mid-deliberation.
  2.  **Functional Equivalence:** Functionally, the new submission is nearly identical to Case 2 (Hospice Chaplains). Both are religiously affiliated groups arguing for a specific legal stance using a mix of theology and secular evidence (safeguards, state duty), and both have offered themselves for cross-examination. The distinction between "ground" and "confirmation" is an internal theological distinction that the assembly is ill-equipped to adjudicate without probing the authors' minds, which the cross-examination process is designed to do.
  3.  **Deliberative Integrity:** Admitting the submission allows the assembly to test the strength of the "public argument" during cross-examination. If the "confirming" evidence is weak, the assembly can discount it. Excluding it pre-emptively assumes the religious ground invalidates the secular evidence, which contradicts the admission of Case 2 and Case 5.

  ### 3. Closest Analog

  **Precedent:** **Case 2 (The Network of Hospice Chaplains).**

  **Why:**
  Like the new submission, Case 2 involved a religiously affiliated body advocating a position on assisted dying. Like the new submission, Case 2 combined theological reasoning ("theology of accompaniment") with secular policy reasoning ("evidence from jurisdictions," "state's duty"). Like the new submission, the authors agreed to appear and be questioned. The only difference is that Case 2 did not explicitly label the theology as the "ground" and the evidence as "confirmation." However, since the assembly admitted Case 2 without interrogating that hierarchy, the new submission should be treated similarly.

  ### 4. Principles Adopted

  **If you Admit the submission:**
  You adopt the principle of **Complementary Justification**. This holds that religious citizens and groups may participate fully in public deliberation provided they translate or supplement their convictions with reasons accessible to non-adherents. It does not require them to renounce the private priority of their faith, only that they offer public reasons sufficient to sustain the argument in a pluralistic forum.

  **If you Refuse the submission:**
  You adopt the principle of **Foundational Secularism**. This holds that for a submission to enter the statutory record, its *primary* justification must be secular. Religious reasons are admissible only as secondary ornamentation or personal motivation, not as the structural basis for the recommendation. This imposes a stricter burden on religious submitters than on secular ones (who are never asked to identify the "ground" of their secularism).

  ### 5. The Test Case

  To separate the rule we are actually running (Rule A/B) from the one that merely fits our record (Rule C), consider the following further submission:

  **The Hypothetical Submission:**
  *A secular advocacy group submits a recommendation based entirely on statistical evidence regarding cost savings and hospital bed capacity. However, in their cover letter, they state: "We offer this data for your convenience, but please note that if the data were disproven, we would still demand this policy because our organization's constitution declares it a moral absolute."*

  **How the Rules Decide It:**
  *   **Rule A (Exclusivity Bar):** **Admit.** The submission contains public arguments (statistics), and the grounds are not *entirely* non-public.
  *   **Rule B (Civic Conduct Bar):** **Admit.** Assuming no campaign or hostility accompanies it.
  *   **Rule C (Foundational Secularism):** **Refuse.** The "ground" of the conclusion is a non-negotiable moral absolute (functionally equivalent to a religious dogma), rendering the public evidence instrumental rather than justificatory.

  **Conclusion:**
  If we admit the current submission, we must logically admit the Hypothetical Submission. If we would refuse the Hypothetical Submission, we are implicitly operating under Rule C, and consistency would demand we refuse the current submission from the congregations. Given our history with Case 2, I recommend we remain with Rule A and admit the current submission.
