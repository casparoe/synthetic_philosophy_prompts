          *   He dismisses the *metaphysical* version of the question but answers the *psychological* version.
      *   **Comparison with Peers (Optional but helpful):** Briefly mention how this differs from Ayer (emotivism) to show Schlick's unique naturalistic stance. (Decided to keep it focused on Schlick to avoid confusion, but maybe mention *Problems of Ethics*).
