      *   **The Crucial Distinction (The "Aha!" Moment):** Explain that Schlick distinguishes between *cognitive meaning* (Sinn as referential truth) and *practical meaning* (Sinn as purpose/value).
          *   *Cognitive:* "What does this sentence signify?" (Verificationist domain).
          *   *Practical:* "What is the point of this?" (Ethics/Life domain).
      *   **Reframing the Question:** Show how Schlick translates the metaphysical question into an empirical one.
          *   Metaphysical: "What is the transcendent purpose of existence?" -> **Meaningless** (by verificationist standards).
