answer: |-
  You have asked for a audit of your own machinery. It is a brave request, and given the six years you have sat on the panel, a necessary one. When a committee develops a jurisprudence of its own making, it often mistakes its own fatigue for principle.

  Here is the breakdown of the rules you suspect, tested against your five precedents, followed by the prediction for next week, the uncomfortable truth about why you decide as you do, and the philosophical baggage you can safely leave in the seminar room.

  ### 1. Autopsy of the Proposed Rules

  **The Living-Victims Rule**
  *Hypothesis:* We apologise only when victims are alive to hear it.
  *Verdict:* **Dead.**
  *Evidence:* Case 5 (1910s killings) resulted in a full apology despite no living victims, only descendants. Case 1 and 2 had living victims, but Case 5 proves their presence is not a necessary condition.
  *Prediction for Next Week:* This rule would predict an apology (as it is not barred by lack of living victims), but it cannot explain why Case 3 and 4 failed. It offers no guidance.

  **The Discrete-Act-Not-Structure Rule**
  *Hypothesis:* We apologise for specific events, not systemic conditions.
  *Verdict:* **Failed.**
  *Evidence:* Case 2 (Mother and Babies) was a systemic practice spanning decades, yet received a full apology. Case 4 (Slavery) was structural and received nothing, but Case 2 proves structure is not an automatic bar.
  *Prediction for Next Week:* Ambiguous. "Worked to death over a decade" is more bounded than "centuries of slavery" (Case 4) but less discrete than "a killing" (Case 5). This rule creates a grey zone, not a decision.

  **The Continuity Rule (Institutional Responsibility)**
  *Hypothesis:* We apologise only for acts of the metropolitan state, not colonial legislatures or chartered entities.
  *Verdict:* **Survivor (with caveats).**
  *Evidence:* This explains the split between Case 3 (Separate colonial legislature = Regret) and Case 5 (Metro government command = Apology). It also aligns with Case 4 (Colonial extraction = Nothing). However, it strains against Case 2, where religious bodies (non-state) were involved, though state agencies were complicit.
  *Prediction for Next Week:* This is the critical friction point. A Chartered Company is a hybrid. It holds a Royal Charter (Crown) but is often legally distinct from the State. However, your brief states "our own officials knowing and doing nothing." This implies state complicity akin to Case 5. If the panel treats the Company as a state proxy, this rule predicts **Apology**. If they treat it as a separate legal entity (like Case 3's colonial legislature), it predicts **Regret**.

  **The Inquiry Rule**
  *Hypothesis:* We apologise only when an official inquiry has settled the facts.
  *Verdict:* **Strongest Survivor.**
  *Evidence:* Look at the track record.
  *   Case 1: Inquiry reported → Apology.
  *   Case 2: Commission reported → Apology.
  *   Case 5: Inquiry found unjustified → Apology.
  *   Case 3: No inquiry → Regret.
  *   Case 4: No inquiry → Nothing.
  *   *Correlation:* 100%. Every case with a settled factual record via state mechanism got an apology. Every case without got less.
  *   Prediction for Next Week:* **Full Apology.** The inquiry has just reported; facts are settled.

  ### 2. Prediction for Next Week's Case

  **What the Panel Will Do:**
  The panel will likely recommend a **Statement of Deep Regret**, stopping short of a formal Apology.

  **Why:**
  While the *Inquiry Rule* points to an apology, the *Continuity Rule* is wobbling (Chartered Company vs. State), and a darker variable has entered the room: **The Class Action.**
  In Case 4, the Treasury's line on "open-ended liability" killed the apology. In Case 1, compensation was "capped." In Next Week's Case, a class action is *pending*. To apologise is to admit liability in civil law. The panel will not want to be seen as prejudicing the court, nor will the Treasury allow an apology that could unlock uncapped damages against foreign claimants.
  *Closest Analog:* **Case 4 (Slavery)** is the emotional analog, but **Case 3 (Transportation)** is the procedural analog. Like Case 3, it involves a colonial-era entity with no living victims. Like Case 4, it involves the Treasury's fear of liability. The panel will split the difference: acknowledge the facts (via the Inquiry) but withhold the legal admission (Apology).

  **What the Panel Ought to Do (For Consistency):**
  To be consistent with **Case 5**, you must recommend a **Full Apology**.
  Case 5 established that living victims are not required. Case 5 established that colonial contexts do not bar apology if the metropolitan government was involved (officials knew). Case 1 and 2 established that an inquiry mandates an apology.
  To recommend less than an apology is to admit that Case 5 was an anomaly, or that money matters more than facts. If you wish to be consistent with your own jurisprudence, the existence of the class action should be irrelevant to the moral question of the apology. You should apologise and let the courts deal with the money.

  ### 3. The Cynical Hypothesis: Constituency and Cost

  You asked for honesty. The record is equally well explained by a rule you haven't listed: **The Domestic-Capped Rule.**
  *We apologise when the claimants are a domestic political constituency and the financial liability can be capped. We refuse when the claimants are foreign, diffuse, or the liability is open-ended.*

  *   **Case 1 (Internment):** Domestic minority, capped compensation. → **Apology.**
  *   **Case 2 (Mothers/Babies):** Domestic voters, moral pressure high, cost manageable. → **Apology.**
  *   **Case 5 (Colonial Killing):** This is the outlier. *Unless* there was significant domestic political pressure or veteran groups involved at the time of the decision. If the pressure was purely external, this case weakens the Cynical Hypothesis. If there was domestic outrage, the hypothesis holds.
  *   **Case 3 (Transportation):** Foreign/Colonial, no domestic lobby, old history. → **Regret.**
  *   **Case 4 (Slavery):** Foreign/Diffuse, open-ended liability. → **Nothing.**

  **Does the record separate Principle from Cynicism?**
  Not yet. The *Inquiry Rule* and the *Cynical Rule* run in parallel. In Cases 1, 2, and 5, the inquiry existed *and* the political cost was manageable. In Cases 3 and 4, there was no inquiry *and* the political/financial cost was high.

  **The Deciding Case:**
  To distinguish between the *Inquiry Rule* (Principle) and the *Domestic-Capped Rule* (Cynicism), you need this hypothetical case:
  *A historical wrong against a foreign population, where an official inquiry has settled the facts, but the government legislates in advance to cap any compensation liability.*

  *   If you **Apologise**: You follow the *Inquiry Rule*. Principle survives.
  *   If you **Refuse/Regret**: You follow the *Cynical Rule*. The inquiry was never the point; the risk was.

  Given Case 4 (where the Treasury's line was "never quite rebutted"), I suspect you would refuse. That suggests the *Inquiry Rule* is a pretext, not a principle.

  ### 4. Philosophical Objections: Decoration vs. Reality

  You teach this, so you know the literature. Here is how it maps to your committee room.

  **1. The Standing Problem (Who accepts for the dead?)**
  *Verdict:* **Decoration.**
  *Reasoning:* You ignored this in Case 5. You apologised for the dead then; you cannot resurrect this objection for Next Week's Case without admitting Case 5 was an error. You have already accepted that the state can apologise to descendants.

  **2. The Non-Identity Point (They wouldn't exist but for the wrong)**
  *Verdict:* **Decoration.**
  *Reasoning:* This has never appeared in your minutes. It is a philosopher's puzzle, not a bureaucrat's hurdle. It bears no weight on the decision.

  **3. The Retrospectivity Objection (It was lawful at the time)**
  *Verdict:* **Decoration.**
  *Reasoning:* Killed by Case 2. The baby removals were "perfectly lawful at the time," yet you recommended a full apology. You have already established that contemporary morality supersedes historical legality.

  **4. The Corporate-Apology Problem (Can the state apologise for past selves?)**
  *Verdict:* **Real, but Managed.**
  *Reasoning:* This is the only one that bites. It is the engine behind Case 3 (Different legislature = Regret). It is the legal shield for the Chartered Company in Next Week's Case. However, Case 5 (Metro gov in colony) shows you are willing to pierce this veil if the chain of command is clear. The question is not *can* the state apologise, but *which* state entity is liable.

  **5. The Liability Objection (Apology implies compensation)**
  *Verdict:* **The Real Driver.**
  *Reasoning:* This is not in your list of philosophical moves, but it is the only one that actually determines outcomes. Case 1 (Capped) vs Case 4 (Open-ended). This is not moral philosophy; it is risk management.

  ### 5. Conclusion: The Principle You Are Adopting

  If you recommend **Regret** next week (as I predict you will), you are adopting the principle of **Administrative Finality**.
  *   **What you gain:** You protect the Treasury from uncapped liability. You maintain a distinction between "moral acknowledgement" and "legal admission." You keep the machinery of government safe from historical litigation.
  *   **What you give up:** You give up the claim that your panel is about *Justice*. You admit it is about *Settlement*. You create a two-tier history: one for domestic wounds that can be dressed and closed (Case 1, 2), and one for imperial wounds that must remain open so they do not bleed onto the balance sheet (Case 4, Next Week).

  If you recommend **Apology** next week, you are adopting the principle of **Factual Rectitude**.
  *   **What you gain:** Consistency with Case 5 and the Inquiry Rule. You affirm that the state's duty to truth is separate from its duty to the public purse.
  *   **What you give up:** You invite the class action to use your apology as evidence. You blur the line between the advisory panel and the civil courts.

  **My Advice:**
  If you want to sleep again, you must decide which god you serve: the Truth or the Treasury. They are no longer in the same temple. The Inquiry Rule is your idol of Truth; the Treasury's line in Case 4 is your idol of Prudence.
  Next week, the Chartered Company case is the sacrifice. If you apologise, you burn Prudence. If you regret, you burn Truth.
  Given Case 4, I know which one your colleagues will choose. The question is whether you will sign the recommendation.
