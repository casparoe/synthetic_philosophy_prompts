      *   **The Position:**
          1.  Genocide is morally distinct (not just severe mass killing/Crimes Against Humanity).
          2.  Distinctiveness lies in targeting the *group as a collective subject* (destruction of shared identity/social world).
          3.  The wrong is *not* exhausted by the sum of individual wrongs (non-reductionist).
          4.  This moral distinctiveness is *independent* of the legal definition's arbitrariness (1948 Convention limits are legal defects, not moral confusions).
      *   **Specific Instructions:**
          *   Rank objections from decisive to awkward.
          *   Identify which objections a defender should concede vs. dismiss.
          *   Explain what the position explains/predicts better than rivals.
          *   **Press Point 1:** Does the "group-as-such" wrong do independent moral work, or is it reification?
          *   **Press Point 2:** Is the view insulated against disconfirmation (too flexible)?
          *   **Press Point 3:** Politics of naming (does political usage undermine the category?).
          *   **Requirement:** Identify a case where the position's commitments force an unwelcome conclusion for its defenders.

  2.  **Deconstruct the Position:**
      *   *Core Claim:* Genocide = Group-Targeting + Identity Destruction > Sum of Individual Murders.
      *   *Meta-Claim:* Moral Category $\neq$ Legal Category (Legal is flawed, Moral is robust).
      *   *Ontology:* Groups have some moral standing (not necessarily metaphysical reality, but moral significance).

  3.  **Brainstorming Objections (The "Map of Exposure"):**

      *   *Conceptual/Metaphysical:*
          *   **Reductionism:** Groups don't exist; only individuals do. Therefore, "group harm" is just aggregated individual harm. (The "Reification" charge).
          *   **Identity Problem:** What constitutes a "group"? If it's subjective, it's unstable. If objective, it's essentialist.
          *   **Intent Problem:** How do you prove intent to destroy a "social world" vs. just killing people?

      *   *Normative/Ethical:*
          *   **Hierarchy of Suffering:** Does calling something genocide imply other mass killings (e.g., class-based, political) are *less* bad? This leads to the "Hierarchy of Victims" problem.
          *   **Individual Rights:** Does prioritizing the group undermine individual rights? (e.g., forcing people to stay in a group to preserve it).

      *   *Legal/Political:*
          *   **Selectivity:** If the moral category is broad but the legal one is narrow, does the moral claim lose force when it can't trigger legal mechanisms?
          *   **Instrumentalization:** If the label is political, is the moral category just a mask for power?

      *   *Case-Based:*
          *   **Cultural Genocide:** If the moral core is identity destruction, doesn't forced assimilation (no killing) count? If yes, does it dilute the horror? If no, is the theory inconsistent?
          *   **Political Groups:** Why are they excluded legally but included morally? If included morally, does the distinction collapse into "mass atrocity"?
          *   **The "Unwelcome Conclusion":** Maybe a case where a group *wants* to dissolve, or where preserving the group requires illiberal practices.

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the position (it's a standard but robust non-reductionist view, akin to May, Gellately, or power-structural views).
      *   **Section 1: The Explanatory Payoff (What it buys you).** Before tearing it down, establish why one holds it. (Explains the special horror, explains the "in part" legal clause, explains why survival matters beyond biology).
      *   **Section 2: The Map of Exposure (Ranked Objections).**
          *   *Tier 1: Decisive/Existential Threats.* (Reductionism, The Hierarchy Problem).
          *   *Tier 2: Structural/Coherence Threats.* (Insulation/Immunization, The Intent Epistemology).
          *   *Tier 3: Awkward/Political Costs.* (Politics of Naming, Essentialism).
      *   **Section 3: Addressing Specific Press Points.**
          *   Independent Moral Work?
          *   Insulation/Disconfirmation?
          *   Politics of Naming?
      *   **Section 4: The Unwelcome Conclusion (The "Poison Pill").** Need a specific case. *Idea: The "Suicidal Group" or "Oppressive Group" problem.* If the group is the victim, what if the group's existence relies on internal oppression? Or what if the group is a political class (e.g., Kulaks) which the theory says *should* count, forcing a clash with the legal definition that the theory tries to sidestep? *Better Idea:* The "Benevolent Assimilation" case. If the moral wrong is identity destruction, does benign cultural erosion count? If yes, it overextends. If no, why not?
      *   *Refining the Unwelcome Conclusion:* Let's look at the "Independence from Law" claim. If the moral category is independent, does it apply to *protected* groups acting genocidally? Or does it force us to call something genocide where the law forbids it (e.g., indigenous groups destroying their own culture via assimilation for survival)?
      *   *Selected Unwelcome Conclusion:* **The "Protective Paternalism" Trap.** If the group is the moral patient, the theory might imply that individuals within the group can be restricted from leaving or assimilating to prevent the "group death." This conflicts with liberal individualism.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the "Independent Moral Work" argument:* I need to be sharp here. If I kill 1000 people, vs. kill 1000 people *to end a lineage*, what is the extra harm? It's the harm to *future* members and the harm to the *survivors'* identity. The critic says this is still individual harm (future individuals, surviving individuals). The defender says it's harm to the *continuity of a context of meaning*.
      *   *Refining the "Insulation" argument:* This is the "No True Scotsman" risk. If every time the law fails, you say "that's just law, morality is different," does morality become unfalsifiable?
      *   *Refining the "Politics" argument:* Does the fact that powerful states decide the label mean the category is hollow? No, but it means the *application* is corrupted. The distinction is crucial.

  6.  **Final Review against Constraints:**
      *   Did I rank the objections? Yes.
