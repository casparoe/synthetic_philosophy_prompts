  I've been trying to get clear on the Ellsberg setup and I keep running into two different explainations for it, and I want you to compare them head to head. The first is the maxmin story: when you don't know the odds, you act as if the worst-case probability is the real one, so the ambiguous urn looks worse than the risky one. The second is the competence or source-preference story: it isn't the missing probability as such, it's that you trust a randomizer you understand more than one you don't, and that can show up even when the objective odds are identical. State each as precisely as you can, then compare them on these cases: (a) the standard two-urn Ellsberg choice; (b) an urn whose composition is fixed by a coin you didn't see but that you could inspect for a fee; (c) a bet on a coin flip versus a bet on whether a stranger will text back, where you think the stranger is 50/50 but you have no track record; (d) a case where you're told the ambiguous urn has either 20 or 80 black balls, and you get to choose which end of that range you'd rather bet on. Which explanation does better, and do they ever come apart? Also tell me which one you'd bet on as the better psychological account, not just the better normative one. Say how confident you are in your answer and flag the point you're least sure about.
