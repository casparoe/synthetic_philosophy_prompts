      *   **Commodity Theory (Metalism):** Money *is* the metal. Value is intrinsic to the substance. Changing the name (face value) doesn't change reality. Debasement is theft/fraud because it misrepresents the substance.

  3.  **Drafting Section 1: Three Cases:**
