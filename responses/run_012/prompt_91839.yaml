answer: |-
  ### 1. Three Cases

  **(a) Inconvertible paper money circulating for decades at a stable value**
  The ticket theory predicts this outcome effortlessly. If money is merely a "ticket or counter for reckoning," its material substrate is irrelevant. Provided the tickets are accepted for taxes and debts ("the circulation of credit"), they will function perfectly well without convertibility. Berkeley's claim that wealth is proportioned to industry, not coin, implies that paper tickets can stimulate labor just as effectively as gold, provided they circulate swiftly. The theory licenses the state to issue fiat currency as a public utility to grease the wheels of commerce.

  The commodity theory, conversely, finds this phenomenon anomalous. If a coin's value is the value of the metal, paper has no intrinsic value. To explain stable inconvertible paper, the commodity theorist must borrow from the ticket theory: they must argue that the paper represents a *claim* on metal, or that public convention temporarily suspends the metal rule. The commodity theory is silent on why the paper holds value *indefinitely* without redemption; it can only predict that eventually, the "real" value of the metal will reassert itself, or that the paper is a bubble waiting to burst. It treats the stability as a trick of confidence rather than a functional reality.

  **(b) A ruler who doubles the face value of every coin without altering its metal**
  Here, the ticket theory is permissive but cautious. Since money is an instrument of reckoning, the state defines the unit of account. If the King declares a shilling to be worth two, the ticket theorist sees a change in the *numeraire*. As long as this revaluation does not disrupt the "circulation of credit" or dampen industry, it is permissible. The ticket is still a ticket; only the number printed on it has changed. However, Berkeley's focus on "true wealth" (labor and elements) suggests he would view this as nominal noise. It changes the scoreboard, not the game.

  The commodity theory forbids this absolutely. This is the core of the 1690s recoinage dispute. If value resides in the silver, doubling the face value is a lie. It changes nothing real but distorts all contracts. Creditors are robbed because they are repaid in half the metal they lent. The commodity theory predicts immediate price inflation to match the new nominal values, restoring the real value of the metal. It does not borrow from the ticket theory here; it stands on the principle that the state cannot legislate value, only weight. The ticket theory, by contrast, must borrow from the commodity view to explain why this might fail: if the public loses trust in the reckoning (the ticket), circulation stops.

  **(c) A bank that issues notes far beyond its reserves**
  The ticket theory licenses this practice under the rubric of "credit circulation." Berkeley argues that "less money swiftly circulating" is equivalent to "more money slowly." Bank notes are accelerants. If issuing notes beyond reserves stimulates "man's labour therein," it creates real wealth. The limit is not the reserve, but the capacity of industry to absorb the credit. The theory predicts success as long as the notes circulate and do not sit idle.

  The commodity theory predicts disaster. Notes beyond reserves are unbacked claims; they are counterfeit tickets. This is debasement by another name. The theory predicts that the excess notes will return to the bank for redemption, draining the reserves, or that they will depreciate against specie. It is silent, however, on why this system often functions for long periods without collapse. To explain the stability of fractional reserve banking, the commodity theorist must concede that money functions as a social convention (a ticket) during normal times, only reverting to commodity status during crises.

  ### 2. The Price Level and Berkeley's Formula

  Berkeley's account contains a internal tension between his ontological claim (money is an indifferent ticket) and his pricing formula (price is a proportion of demand to plenty).

  If money is truly just a counter, and wealth is strictly labor and elements, the quantity of counters should not affect the real value of goods, only their numerical expression. Berkeley tries to have it both ways. He claims tokens are indifferent ("by what marks or tokens soever"), implying that the *quantity* of money matters less than its *velocity*. Yet, his formula states that price is "directly as the demand, and reciprocally as the plenty." In economic terms, if "plenty" refers to the quantity of goods, prices fall as goods increase. But if "plenty" implicitly includes the quantity of money (as the medium of exchange), then an increase in money (without an increase in goods) must raise prices.

  Berkeley wants to argue that increasing money supply increases industry (goods), thereby keeping prices stable. But this relies on a specific empirical claim (money always creates industry) that is not theoretically guaranteed. If money is issued without a corresponding increase in labor, the "plenty" of goods does not rise, but the "demand" (backed by money) does. Prices must rise.

  Berkeley cannot square the indifference of tokens with the sensitivity of prices. If the token is indifferent, the unit of account is stable regardless of quantity. If the unit of account is stable, his demand/plenty formula cannot explain inflation caused by monetary expansion. He must give up the claim that tokens are *wholly* indifferent. He must concede that while the *material* of the ticket is irrelevant, the *quantity* of tickets relative to real wealth is critical. A ticket theory that ignores quantity cannot explain price levels; it can only explain the existence of money. To account for inflation, Berkeley must admit that money is not just a passive counter, but an active variable in the price equation.

  ### 3. Acceptance and Stability

  Why is money accepted, and why does paper last while clipped coin fails?

  The ticket theory offers the superior explanation for the acceptance of fiat money. Money is accepted because it is a public institution designed to facilitate "reckoning, recording, and transferring." It is a convention backed by the state's power to tax and enforce contracts. A wholly conventional token holds its value for centuries because the convention is stable; the social agreement to use the ticket is self-reinforcing. As long as the "circulation of credit" is maintained, the material is irrelevant.

  However, the commodity theory offers the better explanation for the failure of debased coin. Why does a slightly debased coin lose value within a generation, while paper money (which has *no* metal) can last centuries? The commodity theorist answers: because the coin makes a false claim. A clipped coin pretends to be a commodity of a certain weight but is not. It is a lie about its substance. The market punishes the lie by discounting the coin or driving it out of circulation (Gresham's Law).

  Paper money, in the ticket view, does not lie. It claims to be a ticket, and it is. Its value rests on the trust in the issuer, not the substance of the paper. The debased coin fails because it tries to straddle both theories: it claims the intrinsic value of the commodity theory while relying on the conventional acceptance of the ticket theory. When the substance is found lacking, the convention collapses because the specific contract (metal for metal) is broken. The ticket theory explains the stability of honest fiat; the commodity theory explains the instability of dishonest specie. The commodity theory has the better story on *why* debasement is detected and punished: because the market tests the substance when the token claims to be substance.

  ### 4. A Verdict

  The ticket theory is closer to the truth about modern monetary arrangements. We operate in a world of fiat currency, central banking, and credit creation—precisely the world Berkeley envisioned where money is an instrument to stir industry rather than a hoard of precious metal. The commodity tradition is descriptively false regarding the nature of modern money; a dollar bill is not a claim on gold, nor does its value derive from the linen it is printed on. It is a ticket backed by the credit of the state and the economy it measures.

  However, the commodity tradition forces a necessary concession upon the ticket theorist: **discipline.** Berkeley's claim that money is merely an instrument to stimulate industry ignores the risk that the instrument can become the master. The commodity tradition is right that money cannot be entirely detached from a constraint, or it ceases to be a reliable measure of value. If tickets are issued without limit, the "reckoning" becomes meaningless. The commodity tradition should concede that money is a social institution (a ticket), but the ticket tradition must concede that this institution requires a nominal anchor (whether metal, inflation targets, or fiscal discipline) to prevent the reckoning from dissolving.

  Neither theory fully accounts for **confidence dynamics**. Neither explains why trust in a ticket collapses suddenly (bank runs) or why trust in a debased coin persists for a while before failing. Both treat the acceptance of money as more rational and stable than it is.

  Are they genuine rivals? Yes, but only on one specific ontological question. They are not rivals on how to manage an economy (both agree industry is wealth), nor on the dangers of inflation (both agree too much money is bad). They are rivals on the source of value.
  **The single question on which they genuinely collide is:** *Does money possess value independent of the authority or convention that issues it?*
  The commodity theorist says yes (the metal has value in itself). The ticket theorist says no (the value is purely relational and functional). In a world of fiat currency, Berkeley's negative answer is the correct one, but the commodity theorist's warning—that a value without an anchor is prone to drift—remains the essential check on Berkeley's optimism.
