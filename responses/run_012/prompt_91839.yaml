      *   *Gaps:* Neither explains *confidence* fully (why trust collapses suddenly). Neither fully integrates international exchange rates (though commodity handles it better via metal flows).
      *   *Rivalry:* Are they rivals? Yes, on the ontological question: Is money a *thing* or a *relation*?
      *   *Single Question:* "Does money possess value independent of the authority or convention that issues it?"

  7.  **Review and Refine:**
