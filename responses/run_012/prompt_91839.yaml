      *   *Resolution:* He should give up the "indifference" claim. You can't have a theory of prices based on demand/plenty if the "ticket" quantity is irrelevant. If tickets are infinite, price becomes meaningless. He needs to admit that *too many* tickets devalue the reckoning.

