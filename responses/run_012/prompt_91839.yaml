          *   Commodity Theory: Struggles. If value is metal, paper has no value. It must explain this as a fiduciary promise or anomaly. It's silent on *why* it holds value without redemption.
          *   Conflict: Ticket says "naturally valid"; Commodity says "theoretically impossible unless backed."
      *   *(b) Ruler Doubles Face Value (Tale):*
