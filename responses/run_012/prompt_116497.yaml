  ### The dilemma in a paragraph

  Judgment aggregation examines how individual judgments on interconnected propositions combine into a collective decision. The discursive dilemma arises when a group votes directly on a conclusion versus voting on the premises that support it. In a conclusion-based procedure, members vote on the final outcome, potentially ignoring logical inconsistencies in their underlying reasons. In a premise-based procedure, the group votes on each factual claim separately, deriving the conclusion logically from the majority view on each premise. These two methods can yield contradictory results. A majority might accept every individual premise required for a verdict of guilt, yet a majority might also vote for acquittal based on reasonable doubt distributed across different facts. This tension between collective consistency and individual responsiveness defines the core problem of group rationality. This risks collective irrationality depending entirely on the procedural choice of what gets voted on.

  ### The jury as an aggregation problem

  In the film, the jury initially aggregates conclusions, not premises. The first vote counts verdicts, leaving the reasons opaque. As deliberation unfolds, it becomes clear that the shift toward acquittal does not stem from a shared rejection of specific evidence. If the group had aggregated premises by majority rule at the outset, they likely would have convicted. Most jurors initially accept the uniqueness of the knife, the accuracy of the old man's testimony, and the visibility of the woman across the tracks. No single piece of evidence is rejected by a majority early on. However, the verdict rule requires unanimity for guilt, meaning a single doubt on any premise vetoes the conclusion. This creates an overlap of minorities where individual doubts lack majority support. If Juror A doubts the knife and Juror B doubts the walk, a premise-based vote clears both obstacles, resulting in conviction. Only a conclusion-based vote captures the combined uncertainty. Aggregated as premises, the evidence stands; aggregated as verdicts, the doubt prevails.

  The arc of the film demonstrates conclusion-based aggregation masking premise disagreement. Jurors flip one by one, but they do not converge on a single narrative truth. They converge on the output variable while maintaining heterogeneity on the input variables. One juror changes his mind because the knife is not unique; another changes because the old man could not have reached the door in time. They agree on the verdict but disagree on which premise failed. This highlights a functional advantage of conclusion-based aggregation in legal contexts: it allows the group to act on distributed uncertainty without requiring consensus on the specific source of that uncertainty. The group reaches a rational verdict not because they agree on the facts, but because the aggregation rule permits different paths to the same conclusion. The final unanimity is on the judgment, not the reasoning, sidestepping the discursive dilemma by refusing to vote on the premises collectively.

  Furthermore, the sequence of flipping matters. In static aggregation theory, inputs are fixed. Here, the aggregation is dynamic. The holdout juror forces a re-evaluation of premises, but he does not force agreement on them. He merely forces them to be considered. As jurors switch, the weight of the conclusion shifts, creating social pressure that alters individual judgments on the premises themselves. This is not pure aggregation; it is aggregation coupled with preference transformation. The film suggests that conclusion-based voting is more robust to premise disagreement than premise-based voting, provided the threshold for the conclusion is high enough to capture minority doubts. By voting on the verdict, they allow the cumulative weight of disparate doubts to overturn the initial majority, achieving a result that premise-based aggregation would have forbidden.

  ### Unanimity, the holdout, and the foreman's agenda

  The unanimity rule fundamentally alters the aggregation function. It dodges the discursive dilemma by requiring full alignment on the conclusion, effectively vetoing any outcome where premise disagreement is too sharp to resolve. This rule protects against wrongful conviction by empowering the minority, but it incurs high transaction costs and vulnerability to strategic holdouts. A single juror can hang the jury, turning an aggregation problem into a bargaining game where endurance matters as much as evidence. The film leverages this vulnerability as a feature, not a bug. The initial holdout uses the unanimity requirement to force re-examination, preventing the majority from overriding his doubt through simple counting.

  Meanwhile, the foreman controls the agenda by deciding when votes occur. By delaying votes until after discussion, he prevents premature closure on the conclusion. This sequencing matters: early voting locks in the conclusion based on initial impressions; late voting allows premise scrutiny to influence the verdict. The agenda power here serves truth-seeking rather than manipulation, but structurally, it remains a control point over the aggregation procedure. The foreman's management of the voting schedule ensures that the aggregation happens only after the information set has been updated. Without this agenda control, the group might have aggregated their initial biases rather than their considered judgments. The unanimity rule combined with controlled agenda setting transforms the jury from a static voting body into a dynamic learning system. Ultimately, the procedure prioritizes the reliability of the outcome over the efficiency of the decision, accepting the risk of a hung jury to avoid the risk of inconsistent collective reasoning.

  ### Where the film resists

  The film resists a strict judgment aggregation reading because the jurors do not treat premises as independent logical variables. They treat them as narrative elements. A juror might reject the knife premise not because of logical proof it is unique, but because the possibility of doubt undermines the certainty required for the conclusion. Furthermore, the aggregation is not static; preferences change endogenously. Standard aggregation theory assumes fixed inputs. Here, the deliberation changes the inputs themselves. Also, the film implies a truth exists, whereas aggregation theory is often procedure-focused, not truth-conditional. The movie suggests the process finds truth, not just aggregates existing judgments. Finally, the unanimity is achieved socially, not logically; some jurors flip due to fatigue or conformity, not premise revision. One juror changes his vote simply because he wants to go to the baseball game, introducing noise into the aggregation function that theory cannot account for. This social pressure contaminates the logical structure, making the final verdict a product of group dynamics as much as evidentiary assessment. The model assumes rational agents; the film portrays emotional ones persuaded by rhetoric as much as facts.

  ### What the film adds

  The film argues against a blind Condorcet Jury Theorem application. Condorcet assumes independent voters with fixed competence levels, suggesting that larger groups naturally converge on truth through statistical averaging. The film shows interdependence is necessary for competence to improve. Deliberation updates the probability of individual correctness. The claim is not that voting aggregates truth, but that argument transforms individual judgment quality before aggregation occurs. The truth emerges from the friction of conflicting reasons, not the mathematics of the count. The movie posits that the group is smarter than the individual only because the group forces the individual to think harder, not because the vote counts cancel out errors. Without the social friction of the holdout, the majority would remain wrong. Thus, the film champions deliberation over aggregation, arguing that the process of reasoning together is epistemically superior to simply counting pre-existing opinions.
