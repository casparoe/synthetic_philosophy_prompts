answer: |-
  **CITY COUNCIL HEAP REGULATION ORDINANCE 2024**

  **WHEREAS** the Council finds as a matter of fact that the addition or removal of a single unit of grain never changes the classification of a pile; AND WHEREAS public order requires a definitive distinction between accumulations subject to levy and those exempt from regulation; AND WHEREAS precision must be maintained without compromising the integrity of the accumulation;

  **NOW THEREFORE** the City Council enacts as follows:

  **1. Prohibition of Sequential Argumentation**
  It is an offence for any person, in any proceeding or submission, to argue that because *n* grains constitute a heap, *n*+1 grains must constitute a heap, or that because *n* grains do not constitute a heap, *n*-1 grains cannot constitute a heap. Any submission relying on such sequential logic shall be struck out immediately.

  **2. Adjudication of Indeterminate Accumulations**
  In cases where an accumulation is neither clearly a heap nor clearly a non-heap, the Tribunal shall decide the matter by asking what the Ordinance would have said under every reading of Schedule 1 it could permissibly have adopted. The Tribunal shall find for the citizen only if the pile is a heap under all such readings. The Tribunal is forbidden to publish which reading it adopted, on the ground that publication would create a precedent, and a precedent would constitute a boundary.

  **3. Classification of Boundary Status**
  A Sub-Committee is established to determine whether a given case is definitely borderline or merely borderline-borderline. An appeal lies from that Sub-Committee to a further Sub-Committee of the same description. The determination of the further Sub-Committee is final.

  **4. Commencement**
  This Ordinance enters into force once the City contains a sufficient number of heaps, no number being specified. The City Clerk shall certify compliance with this section when satisfied.

  **SCHEDULE 1**
  **THE THRESHOLD**

  1. The exact number of grains at which a pile becomes a heap is fixed at 10,000.
  2. This number is a fact about the world which no inspection, measurement, or census can disclose.
  3. A citizen who asserts knowledge of the number commits an offence.
  4. If the assertion later proves to have been correct, the penalty is doubled.

  **SCHEDULE 2**
  **PENALTY GRADUATION**

  1. Fines are graduated by grain count relative to the threshold.
  2. A pile of five hundred grains is half a heap and owes half the fee.
  3. Liability scales linearly with the count until the threshold is met.

  **SCHEDULE 3**
  **COMPANION MATTERS**

  1. The provisions regarding baldness are adopted by reference mutatis mutandis.

  **EXPLANATORY NOTE**
  (This Note is not part of the Ordinance)
  On this schedule, the sentence stating that if five hundred grains is a heap then five hundred and one is comes out half true.

  **APPENDIX**
  **DISSENTING OPINION OF COUNCILLOR H.**

  "We are saying the line exists but cannot be found. We are saying we know it is there but will fine you for knowing it. We are building a rule on a place we refuse to look. I move we reject this."

  The motion was lost.
