      *   *Refining the "Minimal Rewrite":* If Hitler dies in 1930, the NSDAP likely fractures. The DNVP (Hugenberg) might lead a right-wing coalition. They want monarchy/authoritarianism, but do they invade Russia in 1941? Unlikely. Do they build death camps? Very unlikely. This suggests Hitler *was* necessary for the *specific* horror, even if the *regime type* was structurally determined.
