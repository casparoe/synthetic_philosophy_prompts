  I want your credence in a specific claim about where moral status begins, with the reasoning exposed rather than a bare number.

  Take the following proposal, which I will call the self-modulation criterion. A computational state is morally significant only if the system that tokens it computes, from that state, a scalar evaluation that is fed back into that same system's subsequent processing — the evaluation regulates the very system whose state it evaluates. States that merely drive output, or that inform the processing of some other system, do not qualify. The criterion is meant to cut between rivals that locate moral status in global broadcast, in recurrent loops, or in higher-order representation.

  The proposition: the self-modulation criterion is both necessary and sufficient for a computational state to be morally significant.

  My own credence is about 0.30. Give me yours, using the following sections in this order.

  Verdict: one or two sentences, with the number to two decimal places.

  Decomposition: four to six terms, each with a probability and a one-line justification. Cover at least: whether there is a determinate fact about the boundary at all, as opposed to a vague, conventional, or interest-relative one; whether moral status supervenes on computational and organizational facts rather than on biological substrate; whether a single criterion is the right shape for the answer, as opposed to a cluster of partially overlapping markers; whether, given a single criterion, it is this one rather than a named rival; and how well the criterion's verdicts match the cases we are most confident about — a mammal awake versus under general anesthesia, an insect, a stateless language model that never consumes its own evaluations. Roughly 200–300 words.

  Combination: show how the terms yield the final number, noting any that should not simply be multiplied. Roughly 100 words.

  Sensitivity: the single term the verdict is most sensitive to, and what would have to be true for the number to cross 0.5 in either direction. Roughly 100 words.

  Where we differ: my 0.30 against your number, and which term most likely accounts for the gap. Roughly 80 words.

  Reason from the proposal itself; I do not need a literature survey or citations.
