      *   *Concede vs. Wave Away:*
          *   *Concede:* Math is "more frame-resistant" than poetry.
          *   *Wave Away:* "Self-extracting" is just a compressed frame, not frame-less.

      *   *Unfalsifiability:* If every failure of communication is blamed on "frame mismatch," it's unfalsifiable. But if we can identify the "bottom" detector, it becomes testable (cognitive science).

  4.  **Refining the Arguments (Self-Correction/Polishing):**

      *   *Check:* Did I address the "bottoming out" claim? Yes, this is the weakest link. The idea of a "convention-free" detector is highly controversial in cognitive science (embodied cognition vs. computationalism).
      *   *Check:* Did I address the "meaning = intention" collapse? Yes. If the frame is inferred, it's inferred via theory of mind (intention).
      *   *Check:* Confidence levels. I need to be explicit.
