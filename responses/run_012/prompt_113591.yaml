prompt: |-
  Bit of a weird ask, hope it makes sense. I spent 35 years in a psychophysics lab — mostly hearing, loudness scaling, the usual fights about whether a sone is really a ratio scale or whether we'd just baked the answer into the instructions we gave subjects — and since I retired I've been sitting in on a philosophy of economics reading group that a former colleague runs. It's been great fun, because half the arguments in welfare economics look to me like arguments we settled (or conspicuously failed to settle) in sensory measurement in the 50s and 60s, and nobody in the room seems to know that literature exists.

  Anyway, in two weeks it's my turn to lead, and I want to defend a fairly blunt thesis: that the claim interpersonal utility comparisons are meaningless — the thing that comes down from Robbins and the ordinalist revolution — isn't a result about utility at all, it's a leftover of a philosophy of measurement that psychophysics gave up on decades ago. On the scale-type picture I grew up with (nominal / ordinal / interval / ratio, and which transformations each one survives), vNM utility is an interval scale, and that's exactly the situation you're in with temperature read off two different thermometers: once you fix a common unit, differences are meaningful and ratios aren't. We compared loudness and brightness across subjects for decades and nobody thought the whole enterprise was nonsense; we fought about the right function (log versus power) and about the scale type, which is a real fight, but not about whether there was anything there to compare. So my line is going to be: the interesting question isn't whether interpersonal comparisons are meaningful, it's which comparisons are licensed by which scale assumptions and who gets to fix the unit — and the honest answer to the second half is a convention, which is fine, we do it with the metre too. Sen has been sitting in the back of my head through all of this and I suspect he's the one who'll do me in.

  So what I want from you is not a defence of my view — its a Q&A prep sheet. The room is about a dozen people: mostly economists, including a couple of social choice people who will know Sen's comparability machinery far better than I do, and one or two who think the whole 'measuring utility' business is a category error because utility just is preference representation; plus two philosophers of economics, one of whom I'm fairly sure is a realist about welfare and the other a deflationist who thinks the question is confused. Give me the objections I'll actually get from that room, in their vocabulary, ordered by how much damage they'd do to me rather than by how likely they are, with a two-minute reply to each and a note on where the reply is soft — I'd rather find out the weak spots now than in the room. Include the one I'm hoping nobody asks. And please keep the settled/contested line bright: tell me which parts of this are things people who actually work on it agree about, and which are live disputes where I'd be wrong to talk as though the room should defer to me — I'm a visitor here, and I don't want to be the guy who confidently restates a position that got quietly abandoned in 1975.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired psychophysicist (35 years experience, hearing/loudness scaling, Stevens' power law era, scale types: nominal/ordinal/interval/ratio). Familiar with measurement theory (Stevens, etc.). Currently attending a philosophy of economics reading group.
      *   **Context:** Leading a session in two weeks.
      *   **Thesis:** Interpersonal utility comparisons (IUCs) are not meaningless *in principle* (contra Robbins/ordinalism); the meaningfulness depends on scale type (vNM = interval). The "meaninglessness" claim is an outdated philosophy of measurement abandoned in psychophysics. The real issue is convention/unit fixing (like temperature or meters).
      *   **Audience:** ~12 people. Mix of economists (some social choice theorists knowing Sen), preference-based utility theorists (utility = preference representation), philosophers of economics (one welfare realist, one deflationist).
      *   **Task:** Create a Q&A prep sheet.
      *   **Requirements:**
          *   Objections in the room's vocabulary.
          *   Ordered by *damage potential* (not likelihood).
          *   Two-minute reply for each.
          *   Note on where the reply is soft/weak.
          *   Include the "hope nobody asks" question.
          *   Distinguish between settled vs. contested issues (don't claim settled what isn't).

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Thesis:* IUCs are measurement problems, not ontological ones. vNM utility is interval. We can compare intervals across people if we fix units/conventions.
      *   *Vulnerability 1 (The Big One):* Preference vs. Experience. Economists often define utility *as* preference satisfaction, not hedonic experience. Psychophysics measures *experience* (loudness, brightness). If utility is just a mathematical representation of preference orderings, comparing them interpersonally is category error unless preferences have a common metric (which they don't necessarily).
      *   *Vulnerability 2 (The Social Choice Technicality):* Sen's framework. Sen allows for various "informational bases" (ordinal non-comparable, cardinal comparable, etc.). The user says "vNM is interval." Social choice theorists know vNM is unique up to positive affine transformations *for a single agent*. Moving to *interpersonal* comparisons requires an ethical judgment, not just a measurement fix. It's not just "convention," it's "normative assumption."
      *   *Vulnerability 3 (The Ontological/Deflationist):* Utility isn't a "thing" inside the head like loudness. It's a theoretical construct to predict choice. Comparing constructs across agents is different from comparing neural firing rates.
      *   *Vulnerability 4 (The "Hope Nobody Asks"):* The Bridge Problem. How do you actually *calibrate* the units across people? In psychophysics, you assume similar physiology. In economics, you don't have that. What is the operational procedure for fixing the unit of utility across Person A and Person B?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Highest Damage):* The Preference/Experience Gap.
          *   *Economist's view:* Utility represents choice.
          *   *User's view:* Utility represents sensation (like loudness).
          *   *Conflict:* If I choose A over B, does that mean I feel "more utility"? Not necessarily. Lexicographic preferences, etc.
          *   *Reply:* Distinguish between *decision utility* and *experienced utility* (Kahneman). I'm talking about the latter, or assuming vNM captures risk attitudes which proxy for intensity.
          *   *Weakness:* vNM utility is still defined over lotteries, not direct intensity. The link is tenuous.

      *   *Objection 2 (High Damage):* The Normative vs. Positive Distinction (Sen/Robbins).
          *   *Social Choice view:* Robbins wasn't saying we *can't* measure; he was saying science *shouldn't rely* on it because it's not verifiable. It's a methodological injunction, not a metaphysical claim.
          *   *Reply:* That's a "counsel of despair." Measurement is always convention-laden. We accept conventions in physics; why not here?
          *   *Weakness:* Physics conventions are backed by causal theories. Welfare conventions are ethical.

      *   *Objection 3 (Medium Damage):* The "Zero Point" Problem.
          *   *Philosopher/Deflationist:* Interval scales allow comparison of *differences*, but where is zero? Is it death? Nothingness? If zero isn't shared, interval comparisons fail.
          *   *Reply:* Temperature doesn't have a natural zero for everyday use (Celsius vs. Fahrenheit), yet we compare differences. We just need a common unit size, not a common zero for *differences*.
          *   *Weakness:* Utility might not have a natural zero, but does it have a *comparable* zero? (e.g., is my "neutral" your "neutral"?).

      *   *Objection 4 (The "Hope Nobody Asks"):* Operational Calibration.
          *   *Question:* Okay, you say it's convention. What is the *procedure*? How do I calibrate my utilometer to yours tomorrow morning?
          *   *Reply:* Same way we calibrated meters originally. A standard artifact or a standard scenario (e.g., "the utility of a glass of water when thirsty").
          *   *Weakness:* There is no standard scenario that works for everyone. Context dependence kills it.

  4.  **Refining the "Settled vs. Contested" Line:**
      *   *Settled:* vNM utility is unique up to positive affine transformation (within an agent). Stevens' scale types are standard in psychophysics.
      *   *Contested:* Whether vNM utility *is* welfare. Whether interpersonal comparisons are scientifically admissible (Robbins' legacy). Whether there is a common "zero" for utility.
      *   *Crucial:* The user must not claim psychophysics "solved" this for economics. They solved it for *sensation*. Economics deals with *preference/welfare*. The bridge is the weak point.

  5.  **Drafting the Content (incorporating specific vocab):**
      *   *Vocab:* Positive affine transformation, informational basis, welfarism, preference satisfaction, experienced utility, operationalism, verifiability.
      *   *Tone:* Respectful but firm on measurement theory, acknowledging economic specificity.

  6.  **Review against Constraints:**
      *   Ordered by damage? Yes.
      *   Two-minute replies? (Need to keep them concise).
      *   Note on soft spots? (Essential).
      *   Settled/Contested distinction? (Need a specific section or integrated notes).
      *   "Hope nobody asks"? (Included).

  7.  **Final Polish:**
      *   Make sure the Sen reference is accurate (Sen's *On Ethics and Economics* / *Choice Welfare and Measurement*).
      *   Ensure the Robbins distinction (ontological vs. methodological) is clear.
      *   Check the psychophysics analogy (Temperature is the gold standard here).

  **(Self-Correction during drafting):** I initially thought about focusing heavily on Harsanyi. But the prompt mentions Sen specifically. I need to make sure the Social Choice objection reflects Sen's "Informational Basis" argument, not just Harsanyi's utilitarianism. The key is that Sen *allows* IUCs but classifies them by informational constraints. The user's claim is that the *constraint* is arbitrary/old-fashioned. The counter is that the constraint is there for *verifiability*, not just measurement theory.

  Also, need to highlight the difference between *cardinality* (within person) and *comparability* (between persons). vNM gives cardinality. It does *not* automatically give comparability. That's the leap the user is making via "convention." The economists will pounce on that leap.

  Let's structure the response clearly.

  *   **Intro:** Acknowledge the strength of the position (it's a known argument, notably by Harsanyi and Sen, but the psychophysics angle is fresh).
  *   **The Map:** Settled vs. Contested.
  *   **The Q&A:** 4 Objections + 1 "Hope Nobody Asks".
  *   **Outro:** Encouragement.

  (Refining the "Settled/Contested" section):
  *   *Settled:* vNM = Interval (within agent). Robbins' claim was methodological.
  *   *Contested:* Whether welfare = vNM. Whether IUCs can be made non-arbitrary.
  *   *Danger Zone:* Claiming psychophysics methods transfer directly to welfare without addressing the preference/experience gap.

  Okay, ready to write.
answer: |-
  This is a fantastic angle. You are essentially resurrecting the "New Welfare Economics" critique from the 1970s (Sen, Harsanyi, Ng) but arming it with Stevens' measurement theory rather than ethical intuition. That gives you a unique rhetorical position: you aren't arguing for utilitarianism; you're arguing for *metrology*.

  However, you are walking into a room where "utility" has fragmented into at least three different concepts (preference satisfaction, hedonic experience, and choice-under-risk), whereas in your lab, "loudness" was one thing.

  Here is your prep sheet. I have ordered these by **damage potential** (how much they undermine your thesis) rather than likelihood.

  ### Part 1: The Map (Settled vs. Contested)
  *Keep this distinction sharp. It protects you from looking like you haven't read the last 40 years of econ.*

  *   **Settled (You can stand firm here):**
      *   **vNM Scale Type:** It is settled that von Neumann-Morgenstern utility functions are unique up to positive affine transformations (interval scales) *for a single agent*. You are on solid ground comparing this to Celsius vs. Fahrenheit.
      *   **Robbins' Claim:** It is widely accepted in philosophy of economics that Robbins' 1932 argument against interpersonal comparisons (IUCs) was *methodological* (we can't verify them), not necessarily *ontological* (they don't exist). You are right to call this a "verifiability" constraint.
      *   **Conventionality of Units:** Everyone agrees units (meters, dollars, utils) are fixed by convention.

  *   **Contested (Do not speak as if these are settled):**
      *   **Utility = Welfare:** Many economists deny that vNM utility measures "welfare" or "happiness." It measures "choice consistency under risk." If utility isn't welfare, comparing it doesn't help ethics.
      *   **The Zero Point:** In psychophysics, "zero loudness" is physically meaningful (silence). In utility, there is no agreed "zero welfare." Without a common zero, even interval comparisons can be tricky depending on the aggregation function.
      *   **The Calibration Procedure:** In physics, we calibrate using shared physical artifacts. In welfare, we lack a "standard utility kilogram." How we fix the unit across persons is a live, unresolved dispute, not a settled convention.

  ---

  ### Part 2: The Q&A Prep Sheet

  #### Objection 1: The "Preference vs. Experience" Gap (Damage: Critical)
  **Who asks:** The "Utility is Preference" Economist or the Deflationist Philosopher.
  **The Objection:** "You're treating utility like loudness—a phenomenological intensity. But in modern economics, utility is just a numerical representation of a preference ordering. I can prefer A to B without feeling 'more' of anything. If utility is just structure of choice, there's nothing *to* compare interpersonally. You can't compare the 'length' of two different preference orderings."

  **Your Two-Minute Reply:**
  "I grant that *ordinal* utility is just structure. But we aren't using ordinal utility; we are using vNM utility, which is derived from choices under *risk*. When an agent is indifferent between a sure thing and a lottery, they are revealing an intensity of preference, not just an ordering. That intensity is the psychological magnitude, analogous to loudness. If we accept that risk attitudes reveal a cardinal scale within the person, the only barrier to comparing them across persons is the unit, not the existence of the magnitude. We don't deny loudness exists just because it's not a physical vibration; we don't deny utility intensity just because it's revealed by choice."

  **Where the Reply is Soft:**
  This conflates *decision utility* (weight in a choice model) with *experienced utility* (hedonic tone). If the economist insists vNM numbers only predict choices and not feelings, your psychophysics analogy breaks. Loudness is a feeling; vNM utility is a parameter.
  *Recovery:* Pivot to Sen. "Even if it's just a choice parameter, if we want to make social choices, we need an informational basis. Refusing to compare the parameters is a policy choice, not a mathematical necessity."

  #### Objection 2: The "Normative, Not Positive" Trap (Damage: High)
  **Who asks:** The Social Choice Theorist (The Sen Expert).
  **The Objection:** "You say fixing the unit is a convention, like the meter. But in welfare economics, fixing the unit of interpersonal comparison is an *ethical* judgment, not a metrological one. If I say Person A's utility counts for double Person B's, that's not calibration; that's a value judgment about entitlement or desert. Robbins wasn't wrong about measurement; he was right that science shouldn't smuggle in ethics as if it were data."

  **Your Two-Minute Reply:**
  "I'm distinguishing between the *possibility* of comparison and the *weighting* of comparison. My claim is that the *scale type* allows for comparison of differences (interval), just as thermometers do. Deciding whose thermometer to trust is political; deciding that temperature is comparable across rooms is physical. Sen's 'informational basis' allows us to be explicit about the ethical weighting. My point is that the ordinalist revolution blocked us from even admitting the data exists. We can acknowledge the interval scale without committing to strict utilitarianism."

  **Where the Reply is Soft:**
  In psychophysics, we assume physiological homogeneity (all human ears work roughly alike). In economics, there is no "standard human." The "ethical judgment" is required just to establish the unit, not just the weighting.
  *Recovery:* "All measurement relies on a 'standard model' of the object being measured. Assuming a standard human is a scientific hypothesis, not just an ethic. It's falsifiable."

  #### Objection 3: The "No Common Zero" Problem (Damage: Medium)
  **Who asks:** The Welfare Realist Philosopher.
  **The Objection:** "Temperature has a natural zero (absolute zero) even if we don't use it. Loudness has a threshold. What is the zero of utility? Is it death? Starvation? If Person A's zero is 'death' and Person B's zero is 'status quo,' then your interval differences aren't comparable. You can't compare $\Delta U$ if the origins are arbitrary and unaligned."

  **Your Two-Minute Reply:**
  "For interval scales, the zero point is irrelevant for comparing *differences*. I can compare a 10-degree rise in Celsius to a 10-degree rise in Fahrenheit once I fix the unit size, even if our zeros differ. In welfare, we are usually comparing changes (policy impacts), not absolute levels. As long as we agree on the size of the 'util' (e.g., the utility difference between two reference lotteries), we can compare gains and losses without agreeing on where 'zero welfare' sits."

  **Where the Reply is Soft:**
  This works for *Pareto* improvements, but welfare economics often needs to sum utilities (utilitarianism) or compare levels (prioritarianism). If you can't compare levels, you can't do much normative economics beyond weak Pareto.
  *Recovery:* "Then we restrict our claims to policy *changes*. That's where most cost-benefit analysis lives anyway."

  #### Objection 4: The "Operationalism" Challenge (Damage: Low/Medium)
  **Who asks:** The Deflationist / Methodologist.
  **The Objection:** "In your lab, you could hook someone up to an audiometer. You had an operational procedure. What is the operational procedure for fixing the unit of utility across two people tomorrow morning? If you can't specify the calibration test, it's not measurement; it's metaphysics."

  **Your Two-Minute Reply:**
  "Calibration is always a convention. The meter was a bar in Paris. We could define a 'standard util' as the utility difference between a specific reference lottery (e.g., 50% chance of a meal vs. nothing) for a reference population. It's not perfect, but neither was the meter bar. The lack of a perfect procedure doesn't make the scale meaningless; it just makes it noisy. We deal with noise in psychophysics all the time."

  **Where the Reply is Soft:**
  The meter bar worked because length is physically stable. Utility is context-dependent. The "reference lottery" might mean vastly different things to different people.
  *Recovery:* "Context dependence is a measurement error problem, not a scale-type problem. We correct for it, we don't abandon the scale."

  ---

  ### Part 3: The "Hope Nobody Asks" Question
  **The Question:** "If we accept your view that interpersonal comparisons are just a matter of fixing units by convention, **what convention do you propose?** If you walk out of this room and the Treasury asks you to calculate the distributional impact of a tax, what is the specific conversion factor you tell them to use between a rich person's util and a poor person's util?"

  **Why this hurts:** It forces you to move from "It is possible" (philosophy of science) to "Here is how" (policy). If you say "equal weight," you're a utilitarian. If you say "diminishing weight," you're a prioritarian. If you say "I don't know," you look like you've offered a solution that solves nothing.

  **Your Two-Minute Reply:**
  "My job as a measurement theorist is to tell you that the *ruler* exists, not to tell you how to *weigh* the goods you're measuring. I am arguing against the claim that the ruler is an illusion. Once we agree the ruler exists (interval comparability), the choice of weighting (utilitarian vs. prioritarian) becomes an explicit ethical debate, rather than being hidden behind a false claim of scientific impossibility. I'm not proposing the convention; I'm demanding we stop pretending the lack of a convention proves the magnitude doesn't exist."

  **Where the Reply is Soft:**
  It might look like dodging. The economists want the formula.
  *Recovery:* "Sen's capability approach is one candidate for the metric. My point is we can't evaluate candidates if we think the metric is meaningless."

  ---

  ### Final Advice for the Room
  *   **Don't say:** "Psychophysics solved this."
  *   **Do say:** "Psychophysics developed a vocabulary for this that economics abandoned."
  *   **Watch out for:** The word "Cardinal." In economics, "cardinal" sometimes just means "not ordinal." In your world, it means "ratio scale." Be precise: **"vNM utility is Interval, not Ratio."** If you slip and call it Ratio, the social choice theorists will eat you alive (because ratios of utility are definitely not comparable).
  *   **The Sen Card:** If the Social Choice person gets technical, defer to Sen's *On Ethics and Economics*. He explicitly argues that the "incomparability" thesis is an informational constraint, not an ontological truth. You are essentially arguing for expanding the informational basis.

  Good luck. It's a strong position, provided you don't overclaim on the calibration. You're arguing for the *possibility* of the science, not the *policy* of the science. Keep that line.
