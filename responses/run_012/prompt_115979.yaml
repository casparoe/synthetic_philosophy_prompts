answer: |-
  1. We fix legitimacy as a normative entitlement to rule that imposes a moral obligation to comply, distinct from coerced submission or sociological acceptance. This disambiguation eliminates confusion over stability but leaves the core disagreement over whether performance constitutes moral entitlement fully intact.

  2. We disagree on whether successful governance generates moral entitlement or merely prudential acquiescence. We also disagree on whether the absence of competitive elections permanently voids any claim to moral obligation.

  3. The primary cruxes are whether moral obligation can arise from substantive outcomes alone and whether legitimacy is volatile regarding performance fluctuations. Settling whether consent is necessary would move the skeptic, while evidence that performance failure dissolves moral bonds would move the advocate.

  4. Regarding the first crux, both agree consent procedures matter, but the advocate predicts legitimacy persisted during the boom while the skeptic predicts it was absent. Regarding the second, both agree decline tests stability, yet the advocate predicts legitimacy lapses during stagnation while the skeptic maintains it remains absent.

  5. Part of the dispute is verbal because the advocate occasionally equates legitimacy with stable sociological acceptance while the skeptic insists on normative validity. Once distinguished, we agree the regime possessed sociological acceptance during the boom but disagree on whether that acceptance constituted normative validity.
