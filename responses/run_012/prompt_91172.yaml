answer: |-
  The claim that 'the self is just the story the brain tells about itself' is a chameleon. It shifts colour depending on the light in which it is held. To assess its utility in your dispute over dementia and authority, we must pin down exactly which metaphysical creature is being invoked. Below is a menu of distinct readings, graded by ontological commitment and normative consequence.

  1.  **The Psychological Heuristic**
      *   **Claim:** Human beings cognitively process their experiences and memories by organising them into a narrative structure. There is no homunculus inside the head; there is only a neural network generating a coherent timeline.
      *   **Status:** True (broadly consistent with cognitive science).
      *   **Normative Licence:** None. This describes a mechanism, not a moral status. That the brain uses a story to manage memory does not imply the story is the *only* thing that matters, nor that a break in the story entails a break in the person. It licenses better therapy, not necessarily new ethics.

  2.  **The Epistemological Limit**
      *   **Claim:** There is no non-narrative access to selfhood. We cannot know who we are, or who another is, except through the unfolding plot of their life. There is no 'deep fact' of identity behind the biography.
      *   **Status:** Defensible but contentious. (Phenomenologists argue we have pre-narrative self-awareness; legal systems assume identity persists even when memory fails.)
      *   **Normative Licence:** Suggests we cannot appeal to a 'true self' hidden behind the dementia. If the story is the only window we have, and the window is broken, we cannot claim to know the person behind it. However, it does not dictate whether we privilege the *current* chapter over the *previous* ones.

  3.  **The Fictionalist Reduction**
      *   **Claim:** The self is a useful illusion. Like a character in a novel, it has no ontological weight. There is only the biological organism; the 'person' is a *façon de parler*.
      *   **Status:** False (or pragmatically self-defeating). If the self is merely fictional, the 'brain' telling the story is also just a collection of atoms without agency.
      *   **Normative Licence:** Radical nihilism. If selves are fictions, moral responsibility, rights, and directives are all fictions. This licenses nothing but chaos, or a reversion to pure biological welfare (keeping the organism alive) regardless of 'wishes'.

  4.  **The Abstract Realist (Dennettian)**
      *   **Claim:** The self is a centre of narrative gravity. It is an abstract object, real and indispensable like a centre of gravity or a legal corporation, but not made of matter. It exists in virtue of the patterns of behaviour and speech.
      *   **Status:** Defensible. It avoids the homunculus fallacy while preserving the reality of personhood.
      *   **Normative Licence:** Abstract objects have causal and normative power. A centre of gravity constrains physics; a person constrains ethics. However, abstract objects can shift. If the narrative gravity shifts radically (dementia), the locus of moral consideration might shift with it. But because abstracta are sustained by social recognition, the community (family, law) helps determine where the centre lies.

  5.  **The Metaphysical Constitution**
      *   **Claim:** Personal identity *just is* narrative continuity. There is no biological or psychological substrate that preserves identity if the story breaks. A broken narrative constitutes a broken person; a new narrative constitutes a new person.
      *   **Status:** Strongly metaphysical and highly contentious. It contradicts the legal and biological continuity of the human organism.
      *   **Normative Licence:** This is the only reading that supports the workshop philosopher's conclusion. If identity *is* the story, and dementia severs the story, the advance directive was signed by a different entity. The present entity's wishes hold equal or greater weight because the past entity no longer exists.

  ***

  **The Abstractum versus the Fiction**

  The distinction between a self as an abstractum (Reading 4) and a self as a fiction (Reading 3) bears decisively on the normative conclusion. A fiction can be discarded when it becomes inconvenient or incoherent. If the self is merely a story we tell to keep warm, we are not obliged to honour the plot points of a previous chapter.

  An abstractum, however, is real in its consequences. A centre of gravity is not 'made of anything', yet you cannot move it without moving the mass that constitutes it. Similarly, if the self is a centre of narrative gravity, it exerts a pull on the future. Past commitments create a gravitational field that the present self inhabits. On this view, the advance directive is not a command from a ghost; it is a structural element of the narrative architecture. To ignore it is not to liberate a new person, but to collapse the structure that makes the current person intelligible. The abstractum view suggests continuity matters *more*, not less, because the self is a construct built over time, not a momentary spark.

  **The Claim versus 'People Change'**

  The flat observation that 'people change' is biological and psychological. It admits of degrees. The claim that 'the self is a story' is criterial. It asserts that the *metric* by which we measure change is narrative coherence.

  What the line adds is a threshold. 'People change' implies a sliding scale of similarity. 'The self is a story' implies a binary: either the narrative holds, or it does not. If the narrative breaks, the person ends. What would be lost by dropping the line is the justification for treating radical psychological change as *death*. Without the narrative criterion, the dementia patient is simply a damaged version of the same human being, and the default ethical position is to honour the wishes of that continuous human being (the directive). The 'story' line is required to license the idea that the signatory is dead.

  ***

  **Which Reading Supports the Philosopher?**

  Only Reading 5 (Metaphysical Constitution) supports the philosopher's conclusion at the workshop. He requires the premise that identity *is* narrative continuity, such that a broken narrative entails a new person. Readings 1 and 2 describe how we think, not what we are, and cannot license the dismissal of past rights. Reading 3 destroys the basis for rights altogether. Reading 4 (Abstract Realism) actually undermines his conclusion: if the self is a centre of gravity, the mass of the past life pulls on the present moment. The advance directive is part of the gravitational field.

  However, Reading 5 is the most vulnerable. It assumes that the 'story' is unitary and that dementia severs it completely. In many cases, the narrative is distorted, not erased. Furthermore, even if the 'person' changes, the *human organism* remains the bearer of legal and moral status in most frameworks. The philosopher's slide occurs when he moves from 'the story has changed' to 'the moral authority has reset'. Narrative discontinuity does not automatically licence moral discontinuity.

  **Which Reading I Defend**

  I defend Reading 4 (The Abstract Realist). It captures the intuition that the self is constructed without surrendering the reality of moral obligation. It acknowledges that the self is not a pearl inside the oyster, but a pattern woven over time.

  This view rejects the philosopher's conclusion. If the self is a centre of narrative gravity, it is defined by its trajectory, not merely its current position. An advance directive is not the whim of a stranger; it is a keystone in the arch of the life story. To disregard it because the narrative has thinned is to misunderstand the nature of the abstract object. The gravity of the past life constrains the present care. We do not defer to the present self because its narrative is thin; we defer to the extended self because its narrative, even in fragmentation, relies on the integrity of its prior commitments. The story does not end when the plot thickens; it demands we read the earlier chapters to understand the end.
