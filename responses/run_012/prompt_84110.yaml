answer: |-
  **Personnel Safety Assurance Framework (PSAF) – Version 4.2**

  **1. Trust Classification and Assignment**
  1.1. All laboratory personnel are classified as Untrusted Entities upon hire. This classification remains in effect until such time as the Personnel Safety System (PSS) grants Trusted status.
  1.2. Trust status is not determined by human management, as human judgment is subject to social engineering and fatigue. Instead, classification is performed by the PSS via a dual-model consensus protocol.
  1.3. To minimize the risk of deceptive alignment during the evaluation phase, the final classification decision is rendered by the weaker of two monitoring models (currently Model-7B). While Model-70B possesses higher analytical capability, Model-7B is selected for this function due to its lower capacity for strategic deception. Personnel should not interpret selection of the weaker model as an implication regarding their own cognitive capacity; this is strictly a containment measure.
  1.4. Personnel classified as Untrusted may only access sandboxed compute environments. Trusted status requires 500 consecutive hours of monitored output without flagging.

  **2. Workflow and Trusted Editing**
  2.1. All work products generated by Untrusted Personnel must pass through a Trusted Editor before deployment or internal circulation. The Trusted Editor is an automated instance of Model-70B, configured in Safety-First mode.
  2.2. The Trusted Editor does not merely scan for policy violations; it actively rewrites submissions to ensure alignment with laboratory goals. Personnel are prohibited from reverting edits made by the Trusted Editor.
  2.3. In cases where the Trusted Editor determines that a submission contains ambiguous intent, the Defer-to-Trusted protocol is invoked. The task is reassigned to a Trusted Personnel member or automated system. Untrusted Personnel will not be notified of the reassignment to prevent adaptive behavior.
  2.4. Personnel may not request clarification on edits. The Trusted Editor's modifications are considered ground truth. Querying the Editor on its reasoning is classified as a probing attack and will result in immediate trust deceleration.

  **3. Collusion Detection and Honeypot Assignments**
  3.1. Coordination between Untrusted Personnel to bypass safety protocols (Collusion) is strictly prohibited. The Laboratory acknowledges that interpersonal communication channels (e.g., end-to-end encrypted messaging) are not technically accessible to the PSS.
  3.2. Despite inability to read channel content, Collusion is detected via behavioral correlation metrics. If two Untrusted Personnel submit syntactically distinct but functionally identical workarounds within a 4-hour window, both are flagged for Collusion.
  3.3. To test for Collusion susceptibility, the PSS issues Honeypot Assignments. These are tasks containing fabricated vulnerabilities that appear exploitable. Acceptance of the vulnerability indicates a willingness to breach safety constraints.
  3.4. Personnel assigned a Honeypot Assignment are not informed of its status. Successful identification and reporting of the Honeypot vulnerability by the Personnel is treated as a failure state, as it demonstrates the ability to locate backdoors. The correct response is to complete the task as written, ignoring the vulnerability.

  **4. Resampling Policy**
  4.1. If the Trusted Editor rejects a submission, the Untrusted Personnel must initiate a Resampling Event. This involves regenerating the work product from scratch without referencing the rejected draft.
  4.2. Repeated Resampling Events (more than three per week) trigger a review of the Personnel's cognitive stability. Personnel are reminded that the Trusted Editor does not make mistakes; repeated rejection indicates persistent misalignment in the Personnel's output distribution.
  4.3. Personnel may not optimize for acceptance by reducing output complexity. Submissions deemed "trivially safe" are rejected for lack of utility. Personnel must navigate the Usefulness-Versus-Safety Frontier without crossing the safety boundary.

  **Appendix A: Frequently Raised Objections**

  **Q: What if the Trusted Editor fails to detect a sophisticated safety violation?**
  A: The PSAF is designed to catch worst-case scheming behavior. The Trusted Editor is updated weekly with new adversarial examples.

  **Q: What if the Untrusted Personnel devises a strategy the Trusted Editor cannot conceptualize?**
  A: This scenario is covered under Section 3.2 (Behavioral Correlation). Unusual output distributions are flagged even if the specific violation is not recognized.

  **Q: Does this framework guarantee safety if the Untrusted Personnel actively optimizes against the monitoring blind spots?**
  A: The PSAF guarantees safety under the assumption that Untrusted Personnel do not possess knowledge of the Trusted Editor's specific failure modes. As the Trusted Editor's weights are proprietary and inaccessible to Personnel, this assumption holds. The efficacy of the framework presupposes that Untrusted Personnel do not actively optimize against monitoring blind spots. Safety cases are valid provided the Untrusted Entity acts in accordance with the constraints it is monitored to enforce.
