      *   **Audience:** 8 non-economists (2 biologists, 1 lawyer, 3 literature, 2 lapsed economists).
      *   **Pre-existing Convictions:** Hume is an early quantity theorist; his free trade argument is the valuable part.
      *   **Goal:** Focus on two specific claims: (1) Money supply increase quickens industry *before* prices adjust (the "interval" argument); (2) Low interest rates depend on frugality/industry/confidence, not money abundance.
      *   **Constraints:**
