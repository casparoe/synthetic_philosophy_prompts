answer: |-
  To run this session effectively within ninety minutes, you must treat the group's existing convictions not as a foundation to build upon but as a friction to overcome, specifically the idea that Hume is merely a proto-quantity theorist who believes money is neutral. The arc of the session should move from the psychological mechanics of the individual agent to the aggregate behavior of the market, and finally to the market for loanable funds. You cannot begin with the conclusion that prices eventually rise, because that validates their preconception and renders the interval argument moot. Instead, you must begin by establishing the epistemological limitation of the economic agent. The idea that must be in place before either of your target claims can be heard as arguments rather than slogans is that prices are not set by a central calculator with perfect information but by individual merchants reacting to local signals of demand. Without this decentralization of knowledge, the interval between money injection and price adjustment is merely a lag time with no economic consequence. Once the group accepts that merchants do not instantly know whether a rise in demand for their goods is specific to them or general to the economy, you can introduce the mechanism by which money stimulates industry. This dependency is critical because if agents knew the aggregate price level immediately, they would adjust prices instantly, and the real effects of money would vanish. Therefore, the first twenty minutes must be dedicated to dismantling the assumption of perfect information, framing Hume not as a mechanist but as a psychologist of commerce.

  For the carrying example, you should invent a scenario involving an isolated market town called Oakhaven that uses silver tokens for trade. Imagine a wealthy benefactor secretly doubles the number of tokens in circulation by distributing them to the workers rather than the merchants. The example must contain a distinct delay between the workers receiving the tokens and the merchants raising the prices of bread and cloth. It must also contain the subjective experience of the merchant, who sees more tokens offered for goods but cannot immediately know if this is due to a general inflation or a specific increase in the town's wealth. Crucially, the example must leave out any mention of banks, interest rates, or foreign trade during this initial exposition. Introducing banking too early will confuse the money supply with credit creation, and mentioning foreign trade will trigger the group's expectation of the specie-flow mechanism, which distracts from the domestic stimulus argument. By keeping the example closed and simple, you force the group to focus on the relationship between the token supply, the merchant's perception, and the worker's labor effort. You should walk them through the moment a worker is offered extra tokens for overtime and accepts because they perceive themselves as richer, followed by the moment a merchant raises prices only after realizing their own suppliers have also raised costs. This sequence mirrors Hume's insight that the stimulus works through the ignorance of the participants.

  As you move from the money supply argument to the interest rate argument, you must pivot on the definition of capital. The group will predictably confuse money with capital, assuming that an abundance of tokens makes borrowing cheaper. You need to head this off immediately after establishing that prices have fully adjusted in your Oakhaven example. Once prices are high, the workers have no more real tokens than before, and the merchants have no more real capital. The misconception here is that low interest rates are a monetary phenomenon. You must correct this by showing that interest is the price of borrowing real resources, not tokens. The durable misconception you expect, that Hume is simply anticipating the long-run neutrality of money, should be headed off not at the end of the session but at the very beginning of the interval discussion. When you introduce the Oakhaven scenario, explicitly state that the long-run outcome is indeed higher prices, but demand they explain why the short-run outcome matters. If you wait until the end to address neutrality, they will have spent ninety minutes filtering everything through that lens and will miss the nuance of the transition. You must insist that the welfare gain happens exclusively in the interval, making the transition itself the object of study rather than the equilibrium state.

  Regarding the free-trade material, you should cut it altogether. While the group believes this is the part worth their time, including it will dilute the specific mechanical understanding you aim for regarding money and interest. Ninety minutes is insufficient to do justice to both the nuanced monetary theory and the arguments on trade balances, and since their conviction on trade is already positive, reinforcing it adds little pedagogical value. Instead, use the time saved to deepen the analysis of why frugality and industry lower interest rates. You should openly refuse to explain modern macroeconomic terminology such as the Phillips curve, liquidity preference, or loanable funds graphs. These anachronisms will encourage the lapsed economists in the group to translate Hume into modern models rather than understanding his specific causal chain. You should also refuse to get bogged down in the historical details of Mercantilist policy, as this is a philosophy session, not a history seminar. Keep the focus on the logic of the argument rather than the historical context of the essay.

  To conclude the session, you need a question that tests whether they grasp the mechanism of the interval rather than just the conclusion that prices rise. Do not ask what happens to prices in the long run, as that invites the neutrality slogan. Instead, ask them this: If the workers in Oakhaven had known exactly when the benefactor distributed the tokens and exactly how many were distributed, would the industry of the town still have quickened? This question forces them to confront the role of information asymmetry and deception in Hume's theory. If they answer correctly, they will recognize that without the illusion of increased wealth, the workers would not have labored harder, and the merchants would have raised prices immediately. This confirms they understand that the stimulus relies on the interval of ignorance, which is the core of Hume's departure from a simple quantity theory. If they answer that industry would still quicken, they have reverted to the slogan that money is merely a veil, and you will know the distinction was not successfully made. This final interrogation ensures that the takeaway is the psychological and temporal structure of Hume's economics, not just the final equilibrium position.
