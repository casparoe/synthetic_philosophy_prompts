      *   *Drafting thought:* Ensure the transition between the money supply argument and the interest rate argument is smooth. The interest rate argument relies on the definition of capital vs. money, which follows naturally from the money supply discussion once prices have adjusted.

      *   *Drafting thought on the Example:* Make sure it's clearly described as invented. "The Valley of Saint-Martin" or something similar. Let's go with a fictional isolated market town to avoid historical baggage.

      *   *Drafting thought on the Final Question:* Ensure it targets the *mechanism* (information/perception) not the *outcome* (prices rise).

