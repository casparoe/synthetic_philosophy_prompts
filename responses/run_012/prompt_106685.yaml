      *   *Self-Correction on "Continuous Prose":* Sometimes this means a single block, but usually, it means "essay style" without list formatting. I will use standard paragraphs to avoid it looking like a list in disguise.

      *   *Addressing the "Prerequisite":* I need to be precise. The idea that must be in place is that economic agents operate on local information rather than global knowledge. Without this, the interval is just a delay, not a stimulus.

      *   *Addressing the "Free Trade":* The prompt asks "whether the free-trade material should be cut altogether." Given the 90-minute limit and the specific narrow aim, I should argue to cut it. It reinforces their preconception rather than challenging them with the new material.

      *   *Addressing the "Lapsed Economists":* They might try to modernize Hume too much. I need to warn against anachronism.

