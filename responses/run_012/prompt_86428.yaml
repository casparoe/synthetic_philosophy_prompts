  # SEMINAR HANDOUT: WEEK 3 — SORTING QUIZ
  **Social Choice & Welfare | Joint Seminar**

  **Instructions:** For each case, circle the single option that best matches your judgment. Do not overthink; mark your immediate reflex. There are no "correct" answers, only consistent positions.

  **1. The Indivisible Good**
  One prize exists. Alice and Bob value it equally (10 utils each).
  *Plan A:* Give to Alice. *Plan B:* Fair coin flip.
  Expected utility is identical (5 each). You:
  A) Are indifferent; only expected outcomes matter.
  B) Prefer Plan B; the fair procedure has value.
  C) Prefer Plan A; avoid the risk of waste.

  **2. The Hazardous Job**
  A risky job saves the town. Total expected utility is identical.
  *Plan A:* One volunteer takes 100% risk. *Plan B:* Everyone takes 1% risk.
  You:
  A) Are indifferent; risk is neutral.
  B) Prefer Plan B; spread the risk.
  C) Prefer Plan A; minimize total exposure events.

  **3. Adaptive Preferences**
  A deprived person reports high satisfaction (adapted). A privileged person reports boredom.
  To calculate social welfare, you:
  A) Count reported satisfaction equally.
  B) Adjust downwards for adaptation; utility is not enough.
  C) Reject the comparison; scales are incomparable.

  **4. Setting the Weights**
  The theorem states Social Welfare = $w_1U_1 + w_2U_2$. The weights $w$ are free.
  To set them, you:
  A) Set $w_1=w_2$ by ethical requirement (impartiality).
  B) Set them via political negotiation or convention.
  C) Reject the equation; it implies false comparability.

  **5. Population Ethics**
  A new person is created. Life is happy, but below current average utility.
  Total utility rises; Average utility falls. This is:
  A) Good (Total Utilitarianism).
  B) Bad (Average Utilitarianism).
  C) Neutral (Fixed Population view).

  **6. The Veil of Ignorance**
  Behind the veil, you lack probabilities of being any specific person.
  You choose principles to:
  A) Maximize average utility (assume equal probability).
  B) Maximize the minimum position (Maximin).
  C) Refuse to choose; probabilities are required.

  **7. The Committee Agent**
  A firm's divisions satisfy the same axioms as citizens. The firm's "social preference" is:
  A) Morally equivalent to a social welfare function.
  B) Merely a consistency requirement for decision-making.
  C) Non-existent; only individuals have preferences.

  **8. Social Ordering**
  Individuals disagree fundamentally; no aggregation satisfies all axioms without violation.
  A) A social ordering exists anyway (construct it).
  B) No coherent social ordering exists (Arrow-ish).
  C) Use fairness to break the tie (Non-welfarist).

  **9. Lottery as Outcome**
  Is a 50% chance of death morally distinct from a certainty of 0.5 deaths?
  A) Yes; ex ante prospects matter.
  B) No; only ex post outcomes matter.
  C) Depends on who holds the risk.

  **10. Theorem's Force**
  Harsanyi's theorem proves social preferences are a weighted sum.
  This implies utilitarianism is:
  A) Ethically proven (given impartiality).
  B) Mathematically consistent but ethically neutral.
  C) False; the axioms do not apply to society.

