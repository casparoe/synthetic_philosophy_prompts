  ### Diagnostic Notes on Empty/Indistinguishable Sets

  **1. The (a) vs. (b) Blur:**
  Respondents who select **4:A** (Equal Weights) but **10:B** (Ethically Neutral) are theoretically unstable. They accept the ethical conclusion of the impartial observer step but deny the theorem provides ethical force. This is common but incoherent unless they source impartiality elsewhere (e.g., Kantian). The quiz cannot fully separate a Harsanyi Utilitarian from a Kantian Utilitarian who likes the theorem as a post-hoc fit.

  **2. The Empty Cell (1:C, 2:C):**
  No standard position prefers giving the good to Alice (1:C) or forcing one volunteer (2:C) when expected utilities are identical. This combination suggests risk-seeking behavior regarding others' welfare or a specific desert-based theory not covered by standard welfare economics. It is coherent but repulsive to standard seminar norms.

  **3. Indistinguishable Pair: (d) Ex Post vs. (a) Harsanyi Utilitarian:**
  On this quiz, these two often look identical (1:A, 2:A, 9:B vs 9:A). Standard Harsanyi Utilitarians usually care about ex ante prospects (9:A), while Ex Post Consequentialists treat lotteries as outcomes (9:B). However, if a respondent answers 9:A but holds an Ex Post view theoretically, the quiz misclassifies them.
  *Fix:* Add a question asking: "Is the *regret* of losing a coin flip a negative utility component?" If Yes, they are Ex Ante; if No, Ex Post.

  **4. The Deflationary Trap (i):**
  Respondents selecting **7:A** (Firm = Moral Agent) are almost exclusively Deflationary (i). However, some Corporate Utilitarians might also select 7:A. To separate, check Q10: Deflationists say "Mathematically consistent" (10:B); Corporate Utilitarians say "Ethically proven" (10:A).

  **5. Coherent but Neglected (5:C, 1:A):**
  Fixed Population views (5:C) who are otherwise Utilitarian (1:A) are common in classical economics but rare in modern welfare theory due to population ethics debates. This combination is coherent but often neglected in seminars focused on distribution.

