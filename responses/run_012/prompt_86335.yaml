prompt: |-
  Ok so I'm a program officer at a small grantmaking outfit that just decided to put a real chunk of money into wild animal welfare -- call it two researchers for three years, which for us is a lot -- and now I have to decide which open questions we're actually paying people to work on. I don't want a survey or a reading list (and please, no bibliography, I can't check it anyway), I want an agenda and a defense of the ordering.

  What keeps tripping me up is that there seem to be a handful of load-bearing conceptual questions sitting under everything else, and I cant tell which ones are upstream of which. Candidates I've been chewing on:

  - The "is nature net negative?" question. Once you notice that a lot of wild animals are r-selected -- a fish or a frog or an insect dumping thousands or millions of eggs, of which a tiny handful ever reach adulthood, the rest dying young and often badly, of starvation or parasites or being eaten -- it stops being obvious whether a typical wild life contains more pleasure than pain, or whether an ecosystem nets out positive at all. And that seems to silently decide whether habitat destruction is a harm, a benefit, or a wash, which a ton of downstream work just assumes.
  - Whether the goal is making wild animals' lives go better or reducing the number of animals born into bad ones. Those point in pretty different directions and I honestly don't know if anyone has settled whether they're even in tension.
  - How you aggregate across taxa at all. Does a million short insect lives weigh against one long-lived mammal life, on what basis, and does our uncertainty about invertebrate pain mean discounting them heavily or just flagging it and pressing on?
  - Death itself: is dying early a welfare loss for an animal that may have no future-directed wants, and does the answer change the whole shape of the project?
  - The awkward fact that a lot of standard conservation work would increase the number of animals, which under the net-negative view is backwards from what a welfare-focused funder should want.

  So: which of these, or which ones I'm missing entirely, are the actual bottlenecks? Give me a ranking with the reasoning shown -- what's upstream of what, which are tractable for two philosophically-minded people with no lab and no fieldwork, which are neglected, and which look big but wouldn't change much downstream even if someone settled them tomorrow. And tell me what kind of result or argument over the next couple years should move an item up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer at a small grantmaking organization.
      *   **Resources:** Significant for them (2 researchers, 3 years), but still limited compared to major scientific institutions. No lab, no fieldwork. Philosophical/conceptual focus.
      *   **Goal:** Create a prioritized research agenda for Wild Animal Welfare (WAW).
      *   **Constraints:** No surveys, no reading lists, no bibliographies. Wants an agenda + defense of ordering (upstream/downstream logic).
      *   **Current Struggles:** Identifying "load-bearing" conceptual questions. Specific candidates provided (Net Negative?, Quality vs. Quantity, Aggregation across taxa, Death/Early Dying, Conservation Tension).
      *   **Desired Output:** Ranking of bottlenecks, reasoning (upstream/downstream, tractability, neglectedness, impact), and criteria for re-evaluation.

  2.  **Deconstruct the Candidate Questions:**
      *   *Q1: Is nature net negative?* (Valence of wild life).
      *   *Q2: Quality vs. Quantity of lives?* (Totalism vs. Averaging vs. Critical-Level).
      *   *Q3: Aggregation across taxa?* (Moral weight of insects vs. mammals).
      *   *Q4: Death itself?* (Harm of death without future preferences).
      *   *Q5: Conservation tension?* (Intervention implications).

  3.  **Determine Upstream/Downstream Relationships:**
      *   *Q1 (Net Negative)* is arguably the most fundamental *empirical/axiological* hybrid. If nature is net positive, WAW looks like traditional conservation. If net negative, it looks like harm reduction or even population reduction. This dictates the *sign* of the intervention.
      *   *Q2 (Quality vs. Quantity)* dictates the *metric* of success. If we care about total welfare, reducing suffering might mean reducing populations. If we care about average welfare, we might focus on helping existing animals regardless of population size. This is tightly linked to Q1.
      *   *Q3 (Aggregation)* dictates the *scope* and *resource allocation*. If insects matter 1/1000th of a mammal, focus on mammals. If they matter 1:1 by neuron count or something, focus on invertebrates (which dominate biomass). This determines *where* to look.
      *   *Q4 (Death)* is specific. It matters for *how* we intervene (culling vs. curing), but less for *whether* we intervene. It's downstream of Q1 and Q2.
      *   *Q5 (Conservation Tension)* is an *implication*, not a foundational question. It's the result of answering Q1, Q2, and Q3. Researching this directly is less useful than researching the premises that lead to it.

  4.  **Evaluate Tractability (for 2 philosophers, 3 years, no lab):**
      *   *Empirical Net Negative:* Hard to answer definitively without field data. But *conceptual frameworks* for assessing it are tractable.
      *   *Population Ethics (Q2):* Highly philosophical, very tractable for theorists, but notoriously stubborn (Non-Identity Problem, etc.). Might be a black hole.
      *   *Moral Weight (Q3):* Tractable philosophically, but needs some bridge to neuroscience/biology. Still, comparative frameworks are doable.
      *   *Death (Q4):* Philosophically rich, but narrow impact compared to Q1/Q2.
      *   *Conservation Tension (Q5):* Policy analysis. Doable, but depends on the other answers.

  5.  **Develop the Ranking (The "Agenda"):**

      *   *Priority 1: The Valence Framework (Refining Q1).* Not just "is it negative?" but "how do we measure it given uncertainty?" This is the gatekeeper. If we can't define the metric, we can't measure the sign.
      *   *Priority 2: Moral Weight & Aggregation (Q3).* This determines scale. Invertebrates are 99% of animals. If they don't count, the field shrinks massively. If they do, the field explodes. This is high leverage.
      *   *Priority 3: Population Ethics in Practice (Q2).* Total vs. Average. This determines if we care about existence itself. Crucial, but slightly downstream of "does life hurt?"
      *   *Priority 4: The Harm of Death (Q4).* Important for specific interventions (predation, culling), but less fundamental than the value of life itself.
      *   *Priority 5: Conservation Conflict Analysis (Q5).* This is the output, not the input. Don't fund research *on* the conflict; fund research that resolves the premises causing the conflict.

  6.  **Refine the Reasoning (Defense of Ordering):**
      *   *Why Q1 first?* Because it determines the *direction* of travel (help vs. hinder nature).
      *   *Why Q3 second?* Because it determines the *magnitude* (insects vs. elephants).
      *   *Why Q2 third?* Because it determines the *population dynamics* (birth control vs. welfare aid).
      *   *Why Q4/Q5 lower?* They are specific applications.

  7.  **Address the "Two Researchers" Constraint:**
      *   They need to produce *frameworks*, not final empirical answers. They can't count insect pain. They can build the *model* for counting insect pain.
      *   Focus on "Decision Theory under Moral Uncertainty." This is a high-leverage philosophical niche that fits their constraints.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, direct, strategic (matching a Program Officer).
      *   *Structure:* Executive Summary -> The Ranking -> Detailed Defense -> Re-evaluation Triggers.
      *   *Key Insight:* The biggest bottleneck isn't the answer to "Is nature net negative?" (which might be unanswerable empirically right now), it's "How do we make decisions *given* we don't know?" -> **Moral Uncertainty Frameworks.**
      *   *Correction on Q1:* Don't just ask them to solve "Is nature net negative?" That's an empirical quagmire. Ask them to solve "What empirical data would settle this, and how do we act under uncertainty?"
      *   *Correction on Q3:* Focus on "Moral Weight Methodologies."
      *   *Correction on Q2:* Frame as "Intervention Ethics" rather than pure population ethics (which is a black hole).

  9.  **Final Polish:** Check against constraints (no bibliography, no survey, show reasoning). Ensure the "Defense of Ordering" clearly explains upstream/downstream logic. (Self-Correction: Make sure to explicitly address the "Conservation Tension" point as a downstream implication).

  10. **Final Review against User Prompt:**
      *   Agenda? Yes.
      *   Defense of ordering? Yes.
      *   Upstream/Downstream logic? Yes.
      *   Tractability for 2 philosophers? Yes.
      *   Neglectedness/Impact? Yes.
      *   Re-evaluation criteria? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a prioritized research agenda designed for two philosophical researchers over a three-year horizon, with no empirical capacity.

  ### Executive Summary
  Your intuition is correct: you are facing a stack of dependency problems. If you fund research on intervention strategies (downstream) before settling the metric of value (upstream), you risk optimizing for the wrong outcome.

  However, asking two philosophers to empirically settle "Is nature net negative?" is a trap. They cannot measure insect pain. Instead, their comparative advantage is **decision theory under moral uncertainty** and **conceptual framework construction**.

  The agenda below ranks questions by **leverage** (how many downstream decisions this unlocks) and **tractability** (can two theorists actually make progress on this in 3 years?).

  ---

  ### The Agenda: Ranked by Priority

  #### 1. The Metric of Valence Under Uncertainty (Refining "Is Nature Net Negative?")
  **The Task:** Do not ask them to answer whether nature is net negative. Ask them to build the **decision framework** for acting when the answer is unknown.
  **Why Upstream:** This is the root. If nature is net positive, WAW aligns with conservation. If net negative, WAW aligns with harm reduction or population suppression. Currently, the field treats this as a binary empirical switch. It is not; it is a probability distribution.
  **Tractability:** High. This is pure philosophy/decision theory. They can model how different credences in "net negative" should shift resource allocation without needing field data.
  **Neglectedness:** High. Most work assumes a stance; little work addresses how to act given deep empirical ambiguity.

  #### 2. Comparative Moral Weight (The Aggregation Problem)
  **The Task:** Develop a defensible methodology for weighing invertebrate experiences against vertebrate experiences.
  **Why Upstream:** Invertebrates constitute the vast majority of wild biomass and likely suffering. If the moral weight of an insect is 1/1000th of a mammal, the field focuses on mammals. If it is 1:1 (or based on neuron count), the field must focus on invertebrates. This changes the *scale* of the problem by orders of magnitude.
  **Tractability:** Medium-High. They can analyze existing proxies (neuron count, behavioral complexity, phylogenetic distance) and argue for a weighting function. They don't need to prove consciousness, just establish a rational betting heuristic.
  **Neglectedness:** Medium. Often hand-waved, but critical for resource allocation.

  #### 3. Population Ethics for Interventions (Quality vs. Quantity)
  **The Task:** Move beyond abstract population ethics (Totalism vs. Averaging) to **Intervention Ethics**. Specifically: Under what conditions is reducing population size a welfare-positive act?
  **Why Midstream:** This depends on Q1 (Valence) and Q2 (Weight). If lives are net negative (Q1) and insects count (Q2), then preventing birth is a welfare gain. If lives are net positive, preventing birth is a loss. This question operationalizes the first two.
  **Tractability:** Medium. Population ethics is a "black hole" where philosophers often get stuck. Restricting the scope to *interventions* (e.g., contraception vs. habitat protection) keeps it grounded.
  **Neglectedness:** Low. This is a common debate, but usually too abstract. Grounding it in WAW interventions is the value-add.

  #### 4. The Harm of Death Without Future Preferences
  **The Task:** Determine the welfare cost of death for r-selected species with minimal cognitive continuity.
  **Why Downstream:** This matters for *how* we intervene (e.g., is culling humane?), but less for *whether* we intervene. If a life is net negative, death might be a relief. If net positive, death is a loss. The magnitude of that loss is secondary to the sign of the life.
  **Tractability:** High. Pure philosophical analysis of "deprivation accounts" of harm applied to non-human animals.
  **Neglectedness:** Medium.

  #### 5. Conservation Conflict Mapping (The "Awkward Fact")
  **The Task:** Do not fund this as primary research. This is an output, not an input.
  **Why Lowest:** This is the result of answering 1–4. If you fund a project to "analyze tensions with conservation," they will spend three years describing the problem you already know exists. You want them to solve the premises that *cause* the tension.
  **Tractability:** High, but low leverage.
  **Neglectedness:** Low. Everyone knows conservation and WAW conflict; no one knows how to resolve the axiology driving the conflict.

  ---

  ### Defense of the Ordering

  **1. Sign before Scale (Q1 before Q2)**
  You must determine the *sign* of the variable (is wild life good or bad?) before you determine the *magnitude* (how many insects are there?). If you solve Aggregation (Q2) but get the Valence (Q1) wrong, you could efficiently maximize suffering. Q1 dictates the direction of travel; Q2 dictates the engine size.

  **2. Framework before Answer (Q1 Methodology over Q1 Empirics)**
  Since your researchers cannot run field studies, asking them "Is nature net negative?" invites speculation. Asking them "How do we decide given we don't know?" invites rigorous modeling. This is the highest-leverage use of a philosopher's time. It allows your organization to fund empirical work later with a clear map of what data is actually value-relevant.

  **3. Theory before Policy (Q1–4 before Q5)**
  Q5 (Conservation Tension) is a policy conflict caused by divergent axiologies. Conservationists usually operate on a "species integrity" or "ecosystem health" axiom. WAW operates on "individual sentience." Researching the tension itself doesn't resolve it. Resolving Q1 and Q3 provides the ammunition to either align with conservationists (if nature is net positive) or clearly diverge (if net negative).

  **4. Tractability Filter**
  Population Ethics (Q3 in the list) is notoriously resistant to progress. By ranking it third and framing it as "Intervention Ethics," you prevent your researchers from disappearing into a metaphysical rabbit hole for three years. They must produce actionable criteria for birth prevention vs. life aid.

  ---

  ### Re-evaluation Triggers
  *Tell your researchers that their priorities should shift if:*

  1.  **Move Q3 (Population) Up:** If they discover a robust philosophical argument that "existence is never a harm" (or vice versa) that is widely accepted in the field, the Valence question (Q1) becomes less urgent, and the focus shifts entirely to how many lives we bring about.
  2.  **Move Q2 (Weight) Down:** If new neuroscience consensus emerges (outside their grant) that definitively rules out pain in invertebrates, this question dissolves. They should monitor adjacent fields for this.
  3.  **Move Q5 (Conservation) Up:** If a major conservation partner expresses willingness to fund WAW interventions *contingent* on a specific reconciliation framework, this becomes a pragmatic bottleneck. Otherwise, keep it downstream.

  ### The "Kill Switch" Criterion
  At the 18-month review, ask them: **"Have you produced a decision rule that allows a grantmaker to choose between a habitat protection grant and a contraception grant without knowing the empirical outcome?"**

  If the answer is no, they are doing descriptive ethics, not decision theory. Pivot them immediately to modeling uncertainty. That is the only output that justifies a 3-year theoretical grant in this space.
