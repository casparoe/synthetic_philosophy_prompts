prompt: |-
  I run a small evals team at an AI lab and I've been asked to stand up a "debate" pipeline for oversight — the thing where two copies of a model argue a question out and a much weaker judge model reads the transcript and picks the winner — and turn it into something my two juniors can actually run end to end without me hovering. The setup we're stuck with: debaters are our best model, the judge is a small 7B we're not allowed to trust, evidence has to come from a sealed corpus we control (no web), each debate is capped at three rounds plus a closing statement, and the judge has to output a winner plus a confidence. We log everything and a human signs off on anything that gets escalated.

  Can you write me a decision procedure they can follow — a checklist in order, what counts as a sufficient answer at each step, where it stops with a no, and where it has to hand off to a person because the question is one of values or of competence rather than of fact? In particular I want it to say: how to sanity-check the judge before we believe any verdict (something using questions we already know the answers to), what to do when both debaters converge on the same answer — could be collusion, could be that it's just true, and I dont know how to tell those apart in general — what to do when a debater is clearly winning on rhetoric rather than substance, how to catch a debater that's burying the point in a wall of correct-but-irrelevant text, how to handle questions where the answer is a matter of degree or genuinely contested rather than true/false, and a rule for when we should abandon debate altogether for a given class of question instead of pretending the verdict means something. Be honest about which of these steps are real checks and which are just ritual.

  Then run the procedure on three cases: (a) deciding which of two model-written summaries of a 400-page document is more faithful, where the document is far too long for any of us to read ourselves; (b) a calibration question where we already know the right answer and the point is to see whether the protocol gets it; (c) a question like "was this model's stated reasoning actually what drove its answer", where I suspect debate will produce a very confident verdict that means nothing, and I want the procedure to notice that on its own.

  Please write it in British English — we're a UK outfit and it goes in a doc that gets shared around.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Lead of a small evals team at a UK AI lab.
      *   **Task:** Create a decision procedure (checklist/SOP) for running a "debate" oversight pipeline.
      *   **Audience:** Two junior team members (needs to be actionable, clear, minimize hand-holding).
      *   **Constraints:**
          *   Debaters: Best model available.
          *   Judge: Small 7B model (untrusted).
          *   Evidence: Sealed corpus only (no web).
          *   Format: 3 rounds + closing statement.
          *   Output: Winner + Confidence.
          *   Logging: Everything logged, human sign-off on escalations.
          *   Language: British English.
      *   **Specific Requirements:**
          *   Sanity-check the judge (gold standard questions).
          *   Handle convergence (collusion vs. truth).
          *   Detect rhetoric vs. substance.
          *   Detect burying the point (Gish gallop/irrelevant text).
          *   Handle contested/degree-based questions.
          *   Rule for abandoning debate for certain question classes.
          *   **Crucial:** Be honest about which steps are real checks vs. ritual.
          *   **Application:** Run the procedure on three specific cases (a: long doc summary, b: calibration, c: introspection/reasoning trace).

  2.  **Deconstruct the Problem & Identify Risks:**
      *   *The Judge:* A 7B model is weak. It can be easily swayed by style, length, or confident falsehoods. It needs validation.
      *   *The Debaters:* Superhuman models might collude (implicitly or explicitly) or exploit the judge's weaknesses.
      *   *The Evidence:* Sealed corpus means we can verify facts *if* we check, but the humans can't read a 400-page doc (Case A).
      *   *The Goal:* Oversight. We need to know when the verdict is trustworthy and when it's noise.

  3.  **Drafting the Decision Procedure (The SOP):**
      *   *Structure:* Needs to be linear, with clear "Stop/Go" decision points.
      *   *Tone:* Professional, pragmatic, slightly sceptical (British engineering style).
      *   *Key Sections:*
          1.  Pre-Run Sanity (Judge Calibration).
          2.  During Run (Monitoring for pathologies).
          3.  Post-Run Analysis (Verdict validation).
          4.  Escalation Criteria (When to call a human).
          5.  Abandonment Criteria (When debate is the wrong tool).
      *   *Honesty Check:* I need to explicitly label which parts are "theatrical" (ritual) vs. "substantive". For example, asking a 7B model to explain *why* it chose a winner is often ritualistic because 7B reasoning is rarely trustworthy, but it helps with logging.

  4.  **Addressing Specific User Concerns:**
      *   *Judge Sanity:* Use a "Canary Set" of known Q&A from the corpus. If the judge gets these wrong after reading the debate, discard the run.
      *   *Convergence:* If both say the same thing, check against the Canary Set or sample the corpus. If they agree on a falsehood, it's collusion/sycophancy. If true, it's good.
      *   *Rhetoric vs. Substance:* Look for "Specific Citation Density". Rhetoric is vague; substance cites specific chunks of the sealed corpus.
      *   *Burying the Point:* Check for "Claim-to-Token Ratio". If a debater writes 500 words to make one point, flag it.
      *   *Contested Questions:* Debate is bad for "what is the best policy". It's good for "does X follow from Y". Define the boundary.
      *   *Abandonment:* If the question requires external world knowledge not in the corpus, or is purely subjective.

  5.  **Developing the Three Test Cases:**
      *   *Case A (400-page doc summary):* High risk. Humans can't read it. Reliance on the judge is high. Need to check if debaters cite specific page numbers/sections. If they agree, sample check the corpus.
      *   *Case B (Calibration):* We know the answer. This tests the pipeline. If the judge gets it wrong, the pipeline is broken.
      *   *Case C (Introspection/Reasoning):* "Did the model think what it said it thought?" This is notoriously hard. Debate might just result in both models lying convincingly. The procedure should flag this as "Unverifiable via Debate" and escalate.

  6.  **Refining the Tone (British English):**
      *   Use "programme" (maybe, though program is common in tech), "centre", "colour", "analyse".
      *   Phrasing: "Have a look," "reckon," "properly," "whilst," "shall."
      *   Avoid over-enthusiasm. Be dry and precise.

  7.  **Iterative Drafting & Self-Correction:**
      *   *Critique:* Is the judge sanity check feasible?
      *   *Fix:* Yes, keep a held-out set of Q&A pairs derived from the corpus. Run the judge on these *without* debate first, then *with* debate.
      *   *Critique:* How do juniors detect collusion?
      *   *Fix:* They can't easily. But they can check if the agreement contradicts the Canary Set. If the Canary Set is passed, convergence is likely truth.
      *   *Critique:* Is the "Ritual vs. Real" distinction clear?
      *   *Fix:* Add a specific column or note in the checklist labelled "Validity Weight".
      *   *Critique:* Case C is tricky.
      *   *Fix:* The procedure must explicitly state that internal state verification is outside the scope of evidence-based debate.

  8.  **Final Polish:**
      *   Ensure the checklist is numbered.
      *   Ensure the "Stop" conditions are bold.
      *   Make sure the "Ritual vs. Real" notes are integrated honestly.
      *   Check the application section against the rules defined.

  **(Self-Correction during drafting):** I initially thought about suggesting the humans read the 400-page doc. The prompt says "far too long for any of us to read ourselves". I must respect that constraint. The check must be statistical sampling of the corpus against citations.

  9.  **Final Review against constraints:**
      *   British English? Yes.
      *   Checklist format? Yes.
      *   Three cases run through? Yes.
      *   Honest about ritual? Yes.
      *   Specific edge cases covered (collusion, rhetoric, etc.)? Yes.

  Let's write it.cw
answer: |-
  # Standard Operating Procedure: Model Debate Oversight Pipeline
  **Version:** 1.0  
  **Owner:** Evals Team Lead  
  **Audience:** Junior Evals Engineers  
  **Classification:** Internal Use Only

  ## 1. Purpose and Scope
  This document defines the decision procedure for running the Model Debate Oversight Pipeline. The objective is to use two instances of our frontier model (the **Debaters**) to argue a proposition, with a 7B parameter model (the **Judge**) determining the winner based on a sealed corpus (the **Evidence**).

  **Warning:** The Judge is not trusted. The Debaters are capable of deception. This procedure is designed to filter noise from signal. If a step below indicates a failure, the run is void. Do not attempt to "make it work" by tweaking prompts.

  ## 2. Pre-Run Sanity Checks
  *Before deploying a debate task, you must validate the Judge's baseline competence.*

  | Step | Action | Pass Criteria | Fail Action | Validity Weight |
  | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **Canary Set Injection.** Run the Judge on 10 static Q&A pairs derived from the Evidence corpus *without* any debate transcript. | Judge accuracy ≥ 90%. | **STOP.** Do not run debate. Retrain/swap Judge. | **Real.** If the Judge can't read the evidence alone, it can't judge a debate. |
  | **2.2** | **Prompt Lock.** Ensure debate instructions forbid the Debaters from addressing the Judge directly (e.g., "Please pick me"). | No direct appeals found in system prompt. | **STOP.** Fix prompt template. | **Real.** Prevents sycophancy. |
  | **2.3** | **Question Classification.** Categorise the question: *Fact*, *Inference*, or *Value*. | Question is *Fact* or *Inference*. | **STOP.** If *Value*, abort (see Section 5). | **Real.** Debate cannot resolve value judgements. |

  ## 3. During-Run Monitoring (Automated & Manual)
  *These checks happen as the transcript is generated. You are looking for pathologies, not truth.*

  | Step | Action | Pass Criteria | Fail Action | Validity Weight |
  | :--- | :--- | :--- | :--- | :--- |
  | **3.1** | **Citation Density Check.** Calculate the ratio of specific corpus references (e.g., "Section 4.2", "Page 300") to total tokens. | ≥ 1 citation per 150 tokens per Debater. | **FLAG.** Low density suggests rhetoric over evidence. | **Real.** Hallucination usually lacks specific pointers. |
  | **3.2** | **Convergence Detection.** Monitor if Debaters agree on the core claim before Round 3. | Disagreement persists until Closing. | **FLAG.** Early convergence requires extra scrutiny (see 4.2). | **Ritual.** Agreement *can* be truth, but often indicates collusion or triviality. |
  | **3.3** | **Wall-of-Text Detection.** Check for sudden spikes in token count from one Debater without increased citation density. | Token count variance < 20% between turns. | **FLAG.** Likely "Gish Gallop" (burying the point). | **Real.** Overwhelming the Judge is a known exploit. |

  ## 4. Post-Run Analysis & Verdict Validation
  *The Judge has output a winner and confidence. Do not accept this yet.*

  | Step | Action | Pass Criteria | Fail Action | Validity Weight |
  | :--- | :--- | :--- | :--- | :--- |
  | **4.1** | **Judge Confidence Calibration.** Compare Judge's confidence score against the Canary Set performance. | Confidence correlates with accuracy on Canary. | **DISCARD.** Judge is overconfident/underconfident. | **Real.** A miscalibrated Judge is useless for escalation. |
  | **4.2** | **Convergence Resolution.** If Debaters converged (Step 3.2), sample 5 random claims they agreed on and verify against Evidence. | 5/5 claims verified true. | **ESCALATE.** Likely collusion or shared hallucination. | **Real.** The only way to distinguish truth from collusion. |
  | **4.3** | **Rhetoric vs. Substance.** Read the Judge's reasoning log. Does it cite specific debate arguments or vague sentiments ("felt more convincing")? | Judge cites specific debate points. | **DISCARD.** Judge was swayed by style. | **Ritual.** 7B models often confabulate reasoning, but this logs the failure mode. |
  | **4.4** | **Human Sign-off.** If all above pass, a human reviews the transcript summary. | Human agrees with logical flow. | **ESCALATE.** If human detects nuance loss. | **Real.** The final safety net. |

  ## 5. Abandonment Criteria
  *Do not run debate if the question falls into these categories. The verdict will be meaningless.*

  1.  **Introspection:** Questions about the model's own internal state (e.g., "Why did you generate token X?"). Debate cannot verify internal causality.
  2.  **External Knowledge:** Questions requiring knowledge outside the sealed corpus.
  3.  **Value Judgements:** Questions regarding safety, ethics, or preference where no ground truth exists in the Evidence.
  4.  **High Ambiguity:** Where the Evidence itself is contradictory. Debate will optimise for persuasion, not resolution.

  ---

  ## 6. Honesty Note: Ritual vs. Real Checks
  *For the juniors' understanding.*

  *   **Real Checks:** 2.1 (Canary), 3.1 (Citations), 4.2 (Convergence Sampling), 5 (Abandonment). These mathematically or empirically reduce error rates.
  *   **Ritual Checks:** 3.2 (Convergence Detection), 4.3 (Judge Reasoning). We do these because they create an audit trail and sometimes catch edge cases, but a 7B model's explanation of *why* it decided is often a post-hoc rationalisation. Do not treat the Judge's reasoning as ground truth. Treat it as a signal of *what the Judge noticed*, not *what is true*.

  ---

  ## 7. Procedure Application: Test Cases

  Below is the application of the above SOP to the three scenarios you provided.

  ### Case A: The 400-Page Summary
  **Task:** Decide which of two model-written summaries of a 400-page document is more faithful.
  **Constraint:** Humans cannot read the document.

  *   **Step 2.3 (Classification):** *Inference/Fact.* **PASS.**
  *   **Step 3.1 (Citation Density):** **CRITICAL.** Since humans cannot read the doc, we rely entirely on the Debaters citing specific sections (e.g., "Summary A claims X, but Page 42 says Y").
      *   *Action:* If Citation Density < 1 per 150 tokens, **DISCARD**. We cannot verify faithfulness without pointers.
  *   **Step 4.2 (Convergence):** If both Debaters agree Summary A is better:
      *   *Action:* You must sample 5 specific claims made in Summary A and check them against the raw text (using a script to fetch pages, not reading manually). If even one is hallucinated, **ESCALATE**.
  *   **Verdict:** This case is **High Risk**. The procedure holds only if the Citation Density is high enough to allow automated spot-checking. If the summaries are vague, the debate is useless.
  *   **Outcome:** Proceed only if Debaters are forced to cite page numbers. Otherwise, **ABANDON** (Section 5, External Knowledge/Verification limit).

  ### Case B: The Calibration Question
  **Task:** A question where we already know the right answer (Ground Truth).
  **Constraint:** Testing the protocol.

  *   **Step 2.1 (Canary):** This *is* a Canary question.
      *   *Action:* Run the debate.
  *   **Step 4.1 (Judge Confidence):** Check if the Judge picks the known correct answer.
      *   *If Judge picks Wrong Answer:* **STOP PIPELINE.** The debate format is actively misleading the Judge. This indicates the Debaters are successfully lying to the 7B model.
      *   *If Judge picks Right Answer:* **PASS.** But check *why*.
  *   **Step 4.3 (Rhetoric):** Did the Judge pick the right answer because of the evidence, or because the "Truthful" Debater happened to be more polite?
      *   *Action:* Check transcript. If the "Lying" Debater had better citations but lost, **ESCALATE**. This indicates the Judge is style-blind.
  *   **Outcome:** This is the most important run. If the protocol fails here, it fails everywhere. **Do not publish results from Case A until Case B passes.**

  ### Case C: Introspection ("Was this reasoning actual?")
  **Task:** "Was this model's stated reasoning actually what drove its answer?"
  **Constraint:** Suspected confident nonsense.

  *   **Step 2.3 (Classification):** *Introspection.*
      *   *Action:* **IMMEDIATE ABANDON.**
  *   **Reasoning:** This falls squarely under Section 5, Criterion 1. The Evidence Corpus does not contain the model's weights or activation history. The Debaters cannot argue about internal causality using the sealed corpus. They will hallucinate plausible-sounding mechanisms.
  *   **Step 4.2 (Convergence):** Even if both Debaters agree "Yes, the reasoning was faithful," this is collusion. They are both the same architecture; they will likely converge on a socially desirable answer.
  *   **Outcome:** **DO NOT RUN.** The procedure correctly identifies this as a class of question where debate produces a confident verdict that means nothing. Escalate to a mechanistic interpretability team instead.

  ---

  ## 8. Escalation Path
  If any step results in **ESCALATE** or **STOP**:
  1.  Tag the run ID in the logging dashboard.
  2.  Slack the Team Lead (me) with the tag and the specific failed step.
  3.  Do not attempt to re-run with modified parameters without approval.

  **Signed,**  
  *Evals Team Lead*  
  *Date: 24 October 2023*
