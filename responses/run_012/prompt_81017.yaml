answer: |-
  Right, let's get this sorted. You're not thick, you've just spotted that the word "deserves" is doing too much heavy lifting. In philosophy, they'd call this the difference between *retributive* justice (what you're owed for the past), *utilitarian* calculation (what buys the best future), and *procedural* fairness (was the game rigged?). But since you don't want the theory, I'll give you the toolkit.

  Here is the breakdown of your definitions, the verdict on your tests, and the procedure you asked for.

  ### Part 1: Your Four Definitions
  You're right, they are different jobs. Here's how to separate them so they don't trip you up.

  1.  **Earned it (Backwards):** This is **Debt**. Did they do the work agreed? If yes, this isn't a bonus, it's a wage. Don't mix this with the Christmas bonus.
  2.  **Worth it (Forwards):** This is **Investment**. Will paying this keep them here or make them work harder? This is where the bonus lives.
  3.  **A fair shout (Process):** This is **Transparency**. Can you explain the decision to the rest of the van crew without them thinking you're playing favourites?
  4.  **The Pot Size:** This is **Affordability**. You're right again. Nobody "deserves" a profit that doesn't exist. This decision happens *before* you look at any individual.

  ### Part 2: Your Little Tests
  You've got good instincts. Here's which ones to keep and which to bin.

  *   **(a) Would I say this if I hated them?**
      *   **Verdict:** **Keep.** This is your bias check. If the answer is "no," you're punishing personality, not performance.
  *   **(b) If the firm had a bad year, would I still say I owed it to them?**
      *   **Verdict:** **Keep.** This separates Contract (owed regardless) from Discretion (depends on profit). If you'd still owe it in a loss-making year, it's a wage rise, not a bonus.
  *   **(c) If I could keep the money and nobody would ever find out, does the claim stand?**
      *   **Verdict:** **Bin.** Too abstract. In a small firm, secrets don't hold. If you have to hide it, it's probably wrong, but this question won't help you calculate the figure.
  *   **(d) Am I handing them the same thing they're owed?**
      *   **Verdict:** **Keep.** Crucial. Sometimes a lad wants a "well done" and you give him £500. Sometimes he wants £500 and you give him a public thank you. Mismatching these causes resentment.

  ---

  ### Part 3: The Procedure
  Run this for each staff member. It should take 20 minutes per head. Do this with Col, not alone.

  **Step 1: The Pot Check (Stop/Go)**
  *   **Question:** After tax, van repairs, and our own baseline salary, is there actual cash left for bonuses?
  *   **No:** Stop. There are no bonuses. You can only offer time off or public recognition. Tell the team the numbers.
  *   **Yes:** Proceed. Fix the total number. Do not change it based on who "deserves" what. The pot is the pot.

  **Step 2: The Baseline (The "Earned It" Check)**
  *   **Question:** Have they fulfilled their contract? (Hours, basic duties, no gross misconduct).
  *   **No:** They get no bonus. This isn't punishment; it's the deal.
  *   **Yes:** They are in the running. This clears the "Debt" category.

  **Step 3: The Value Split (Backwards vs. Forwards)**
  *   **Question A (Backwards):** Did they go *beyond* the contract this year? (Overtime without complaint, covered for sick mates, fixed things that broke).
  *   **Question B (Forwards):** Is keeping them critical for next year? (Hard to replace skills, client relationships).
  *   **Decision:**
      *   High A + High B = Top tier bonus.
      *   High A + Low B = Reward the graft, but don't over-invest.
      *   Low A + High B = Retention payment (keep them happy, but don't call it a reward).
      *   Low A + Low B = Standard bonus or none.

  **Step 4: The Luck & Talent Adjustment (The "Aaron/Priya" Problem)**
  *   **Question:** Are we paying them for *who they are* (luck/genetics) or *how they use it* (choice)?
  *   **Rule:** You cannot reward luck, but you can reward the **reliability** of that luck.
  *   **Action:** If they have a natural gift (strength, empathy), ask: "Do they turn up and use it for us consistently?"
      *   If Aaron uses his strength to save us hiring a third man, that's value.
      *   If Priya uses her empathy to save a client relationship, that's value.
      *   *Do not* reduce their reward because it comes "easy" to them. That punishes talent. Reward the *result* the talent brings the firm.

  **Step 5: The Fair Shout (The "Pub Test")**
  *   **Question:** If I write the reason for this bonus amount on a piece of paper and pin it in the canteen, would the rest of the crew argue?
  *   **Yes:** Your reasoning is too vague ("He's a good lad"). Make it specific ("He covered three weekends in August").
  *   **No:** You're clear to proceed.

  **Step 6: The Owner's Cut (The Hard Bit)**
  *   **Rule:** You and Col take your profit share *after* the staff pot is fixed.
  *   **Question:** If we take our cut, does the staff pot shrink?
  *   **Yes:** You are taking too much. In a small firm, staff need to know their bonus isn't funding your new driveway.
  *   **Action:** Set your own draw *before* calculating the staff bonus pot. If the business can't afford both, you tighten your belt first.

  ---

  ### Part 4: Running the Cases

  **Case 1: Aaron (The Muscle)**
  *   **Step 2:** Contract fulfilled? Yes.
  *   **Step 3:** Backwards (Graft)? Yes, 6 years, reliable. Forwards (Value)? Yes, hard to replace that strength/trust.
  *   **Step 4 (Luck):** His build is luck. But his *reliability* is choice. He turns up and uses the build for you.
  *   **Decision:** He gets a high "Backwards" score. Don't penalise him for being strong. Pay for the piano moved, not the muscles used.
  *   **Risk:** If you give him less because "it's easy for him," he'll leave.
  *   **Verdict:** Full bonus. Maybe a non-cash reward for loyalty (extra day off).

  **Case 2: Priya (The Glue)**
  *   **Step 2:** Contract fulfilled? Technically no (4 months off), but check sick pay policy. If authorised sick leave, treat as fulfilled.
  *   **Step 3:** Backwards? Mixed (absence). Forwards? High (she holds the diary, saves client relationships).
  *   **Step 4 (Luck):** Empathy is natural, but managing stress is a skill.
  *   **Decision:** Her value is mostly "Forwards" (Retention). If she leaves, the diary collapses.
  *   **Verdict:** She might not get the "Graft" bonus (Backwards), but she should get the "Retention" bonus (Forwards). Frame it carefully: "This is for keeping the clients happy when you're here," not "This is for the hours you missed."
  *   **Note:** Check if she needs support, not just cash.

  **Case 3: You and Col (The Owners)**
  *   **Step 6 Application:** This is where your procedure will bite you.
  *   **The Trap:** You'll want to say you "deserve" more because you took the risk (the dad's deposit, the balance sheet skills).
  *   **The Truth:** That risk is rewarded by *profit*, not by dipping into the *staff bonus pot*.
  *   **Verdict:** If the pot is £9,000 (1k x 9), and you take £2k out for yourselves, the staff effectively took a pay cut to fund your risk.
  *   **Rule:** Your "bonus" is the profit left at the bottom. The staff bonus is a cost of doing business. Do not mix the two. If the profit is low, your "bonus" is low, but the staff bonus should remain stable if they performed.
  *   **Why:** Because they can quit. You can't.

  ---

  ### Part 5: What This Procedure Can't Do
  Be clear on the limits, or you'll think it's broken when it's not.

  1.  **It can't fix a small pot.** If the jobs don't pay well, no amount of ethics makes the bonus big. That's a pricing problem, not a desert problem.
  2.  **It can't measure "Effort" perfectly.** You'll never know exactly how hard Aaron worked. You're paying for the *outcome* (piano moved safely), not the sweat.
  3.  **It can't stop envy.** Even if you follow this, someone will think someone else got more. That's human nature. The "Pub Test" (Step 5) minimises it, doesn't eliminate it.
  4.  **It can't solve the "Luck" paradox.** Your sister-in-law is half-right. Nobody "deserves" their genetics. But in business, you pay for *value provided*, not moral worth. Aaron provides value with his back. Priya provides value with her nerves. You pay for the value.

  ### Summary for Col
  When you sit down with Col, say this:
  *"I've worked out a way to stop us guessing. First we fix the pot based on what we can afford. Then we check who fulfilled their contract. Then we split the rest between 'reward for last year' and 'investment for next year'. We don't touch the staff pot for our own draw. If we can't afford the bonus, we don't do it, we don't rob them to pay us."*

  That's the lot. It's not perfect, but it's fair, and it's yours. Get on with it.
