  *(Plan for the "Owners' Cut"):* This is the hardest part. The procedure needs to force them to justify their take *after* the staff are sorted, or risk morale. I will suggest a "Staff First" rule.

  *(Plan for "Luck"):* Acknowledge that you can't pay for luck, but you pay for the *result* of the luck. Aaron gets paid because the piano gets moved, not because he has big muscles. But his muscles make him reliable for that task.

