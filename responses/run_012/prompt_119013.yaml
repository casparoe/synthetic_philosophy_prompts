  **Statute and Facts**

  **The Transient Lodging Revenue Act**
  **Section 1:** "A surcharge of five percent shall apply to all payments made for the occupancy of a room."

  **Facts:** A logistics firm rents a hotel suite for twenty-four hours to secure high-value cargo. No humans sleep there; the cargo exclusively occupies the space. The City assesses the surcharge. The firm resists, arguing the room was not used for lodging.

  **Verdicts and Arguments**

  **Plain-Meaning Textualism:** The statute reaches the conduct. The ordinary meaning of "occupancy" is simply the act of taking up space. The cargo occupied the room, and payment was made. The text imposes no requirement that the occupant be human or sleeping. The surcharge applies.

  **Mischief-Based Purposivism:** The statute does not reach the conduct. The title ("Transient Lodging") and the context of hotel taxation indicate the mischief addressed was generating revenue from human travelers seeking shelter, not commercial warehousing. Extending the tax to cargo storage falls outside the remedial purpose of funding tourism infrastructure.

  **Intentionalism:** The statute does not reach the conduct. The enacting majority expected the tax to apply to guests checking in for sleep. There is no evidence they contemplated, let alone intended, to tax logistics companies using rooms as secure storage. The specific expected application controls.

  **Feature Doing the Work**

  The semantic gap between the ordinary meaning of "occupancy" (physical possession of space) and the contextual purpose of "lodging" (human shelter). Textualism privileges the former; purposivism and intentionalism privilege the latter.

  **Removal Test**

  Redraft Section 1 to read: "...payments made for the overnight stay of a guest."
  **Explanation:** This collapses the pattern into the conventional one. Textualism now narrows (cargo is not a guest), aligning with the regulator's loss. Purposivism could now expand (arguing "guest" broadly covers any payer to fulfill revenue purpose), or both narrow. The unique reversal vanishes because the text now encodes the purpose, making textualism the constraining force.

  **Strongest Attack**

  **From Textualism:** "Purposivism unlawfully rewrites clear text based on speculative assumptions about 'tourism infrastructure.' If the legislature wanted to limit 'occupancy' to humans, they knew how to say 'person.' Denying the text undermines rule-of-law notice."
  **Survival:** The case survives because "occupancy" is not technically ambiguous, but the mismatch between text and title creates sufficient doubt to permit purposive narrowing without triggering the absurdity doctrine.

  **Candid Note**

  **Risk:** The case risks stipulating the verdict by asserting "occupancy" plainly covers cargo, which a contextualist might deny immediately.
  **Mitigation:** I avoided this by grounding the textualist claim in dictionary definitions of physical possession rather than abstract logic, and by ensuring the purposivist argument relies on the Title and statutory scheme (Constraint 1) rather than contradicting the text directly. The tension is genuine, not manufactured.
