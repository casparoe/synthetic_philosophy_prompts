      *   **Topic/Constraint:** The "Wrong Kind of Reasons" (WKR) problem. The speaker wants to address the graduates without using prudential/instrumental reasons (e.g., "believe in yourself because it helps you succeed") which are technically WKRs for attitudes like belief, hope, admiration. They want to offer reasons that "fit" the object (fittingness reasons) or honestly admit when those run out.
      *   **Tone/Style:** Commencement address (inspirational, reflective, spoken word), not a lecture. No jargon (no "wrong-kind-of-reasons," "fittingness," "normativity," etc.).
      *   **Length:** About 800 words.
      *   **Post-Speech Analysis:** A short paragraph identifying the key sentence/move holding the tension together and a potential critic's objection (evasion charge).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Problem:* Commencement speeches usually give instrumental reasons for attitudes (Hope because it helps you win. Be confident because it leads to success.). The speaker believes these are the "wrong kind" of reasons for actually holding the attitude *correctly*.
      *   *The Goal:* Give reasons for hope, confidence, etc., that are based on the *value of the object* or the *truth*, not the *benefit of the attitude*. Or admit uncertainty.
      *   *The Challenge:* How to inspire graduates without saying "this will pay off"? How to justify hope when the world is uncertain? How to justify loving learning without saying "it makes you interesting/employable"?
      *   *The Solution:* Focus on the *world itself* being worthy of attention, not the self benefiting from attention. Focus on truth rather than utility. Acknowledge the gap where evidence is thin but commitment remains necessary (perhaps shifting from belief to something else, or acknowledging the risk).

  3.  **Drafting - Section by Section:**

      *   *Opening:* Acknowledge the occasion. Set the scene. Avoid clichés about "bright futures."
      *   *The Core Tension (Implicit):* Distinguish between doing things for results vs. doing things because they matter.
      *   *Addressing Hope/Confidence:* Instead of "believe in yourself because you'll win," say "believe in yourself because the task demands it" or "because it's honest." Actually, better: Focus on the *object* of the attention. The world is interesting. The work is valuable.
      *   *Addressing the "Payoff":* Explicitly reject the transactional view without using jargon. "I will not tell you that kindness pays."
      *   *The "Gap":* Acknowledge that sometimes the world doesn't reward truth or kindness. What then? The commitment remains not because it wins, but because it's the only way to stand upright.
      *   *Closing:* A wish for them not to succeed, but to see clearly.

      *Refining the Philosophical Constraint:* I need to make sure I'm not smuggling in instrumentalism.
      *   *Bad:* "Study hard because you'll learn more." (Still slightly instrumental to learning).
      *   *Bad:* "Hope because hope feels good." (Prudential).
      *   *Good:* "Hope because there is something here worth hoping for." (Fittingness).
