      *Refining for the "WKR" constraint:* I must ensure I don't say "Kindness is good because it creates a better society" (that's consequentialist/instrumental). I need to say "Kindness is good because suffering is bad and you can stop it." Or "Truth is good because falsehood distorts."
      *   *Actually, the prompt says:* "grounds you offer for hope, self-trust, and a love of learning should be reasons that actually fit the world."
      *   *So:* Hope fits when there is possibility. Self-trust fits when you have capacity. Love of learning fits when there is mystery.
