answer: |-
  President, faculty, families, and the graduating class.

  It is a tradition at moments like this to offer you tools for success. You are usually told to cultivate confidence because it opens doors. You are told to maintain hope because it sustains you through hardship. You are told to love learning because it makes you interesting to others and useful to the economy. These are comforting words. They suggest that if you arrange your inner life correctly, the outer world will reward you. They treat your mind as a machine designed for output, and your attitudes as fuel.

  I am not going to offer you that kind of advice.

  I am not going to tell you that kindness pays, or that honesty is the best policy, or that believing in yourself will help you succeed. I say this not because these things are false, but because they are the wrong grounds on which to stand. When you kindness only because it returns a favor, you are not being kind; you are investing. When you hope only because despair is exhausting, you are not hoping; you are coping. There is a difference between a reason that tells you an attitude is useful, and a reason that tells you an attitude is true.

  So, what should you hold on to?

  You should hold on to things because they are there.

  Believe in your capacity to think not because it will make you victorious, but because the questions in front of you are real and demand answers. Your mind is not a tool for winning; it is an instrument for seeing. If you look at a problem and you have the skill to solve it, trust that skill. Not because you deserve to win, but because the solution is waiting for whoever looks closely enough. That is a reason that fits the world, not just your ambitions.

  Love learning not because it will make you interesting at a dinner party, but because the world is deeper than you are. You have spent four years touching the surface of things—history, chemistry, poetry—and finding that every answer unlocks a new question. That is not a bug; it is a feature. Continue because there is more to know, not because knowing makes you better than those who do not.

  And hope. This is the hardest one. We are often told to hope because hope is healthy. I am asking you to hope only if there is something worth hoping for. Look at the world. Look at your community. Look at the fragile systems of justice and care we inhabit. If you see a possibility for improvement, then hope is the only response that fits the situation. Hope is not a shield you wear against reality; it is a recognition that reality is not finished yet.

  But I must be honest with you. There will be times when the reasons run out. There will be moments when the evidence does not support confidence, when the world offers no clear possibility for improvement, when kindness seems to vanish into a void without echo. In those moments, I will not tell you to hope anyway. I will not tell you to fake confidence for the sake of your mental health.

  If the world offers you nothing to hope for, do not hope; look at it. If you have no reason to trust your judgment, do not trust; wait. It is better to stand clearly in the dark than to pretend you are holding a light.

  This is a harder path than the one usually offered to you. The usual path promises that if you feel the right way, things will go well. The path I am suggesting offers no such guarantee. It asks you to align yourself with what is true, even when what is true is difficult, or barren, or demanding. It asks you to value the fit between your mind and the world more than the comfort of your mind within itself.

  Why do this? Because when the rewards stop coming, and when the applause fades, the only thing left is the integrity of your own attention. You cannot control whether your kindness is returned. You cannot control whether your work is recognized. You can only control whether you are seeing clearly.

  So, go forward. Do not try to be successful. Try to be accurate. Do not try to be optimistic. Try to be present. If the world gives you reasons to be proud, be proud. If it gives you reasons to be afraid, be afraid. But do not manufacture feelings because they are useful. Manufacture nothing. Meet what is there.

  Congratulations.

  ***

  The sentence doing the real work is: "If the world offers you nothing to hope for, do not hope; look at it." This move holds the tension by refusing to smuggle in a prudential justification for hope when the fittingness conditions aren't met; it prioritizes accurate perception over psychological comfort, adhering strictly to the constraint while acknowledging the human cost. A critic arguing evasion would say: "You claim to avoid instrumental reasons, but you are implicitly arguing that 'intellectual integrity' is more valuable than 'well-being.' You haven't escaped the economy of reasons; you've just changed the currency from happiness to correctness, which is still a claim about what pays off for the soul."
