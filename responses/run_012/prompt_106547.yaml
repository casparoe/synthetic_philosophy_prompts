      *Drafting thought process:* I need to walk the line. If I say "Be honest because it's right," that's a moral reason. If I say "Be honest because people will trust you," that's instrumental. The prompt asks to avoid the prudential register entirely.
      *   *Key move:* Shift from "attitudes that help you navigate" to "attitudes that respond to what is there."
      *   *Structure:*
          1.  Welcome & setting expectations (I won't give you the usual advice).
          2.  The trap of utility (why we usually speak this way).
          3.  The alternative: responding to the world.
          4.  The hard part: when the world doesn't cooperate.
          5.  Conclusion: The value of seeing clearly.

      *Word Count Check:* Needs to be around 800 words. Spoken rhythm.

      *Post-Speech Analysis:* Need to identify the pivot point. Likely the admission that sometimes the reasons run out, but the stance remains. Critic might say: "You're just disguising instrumentalism as moral realism" or "You're offering no motivation at all."

  4.  **Writing the Speech (Iterative Process):**

      *   *Start:* President, faculty, families, graduates.
