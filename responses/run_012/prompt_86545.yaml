prompt: |-
  So this is a weird favor to ask but I'm hoping you can help. I'm in the second year of a dispute resolution masters, and through the clinics pro bono file I've somehow ended up as the "neutral facilitator" on a real water fight between two valleys over one reservoir. Short version: there's 100 units of water to allocate this year. The upper valley (old orchards, old money, holds the 1974 permits) says it wants 80. The lower valley (growing, no permits, a new school, some dairy) says it wants 70. If we dont have a signed framework by Friday the state engineer just imposes the old permits, which comes out to 30 for the upper valley and effectively zero for the lower one, with the rest sitting in the reservoir as a legal buffer, which is its own whole mess. My advisor runs the clinic and she's told me the opening remarks at tomorrows hearing are mine, six minutes, and that what I'm presenting is the Kalai-Smorodinsky split, which in our case lands at about 59 and 41. I think I've got the idea (she walked me through it on a napkin): you draw a straight line from the no-deal point to the point where each side is getting everything it could possibly get, and where that line crosses the edge of what's actually available is the answer, so both sides end up getting the same fraction of the distance from their fallback to their ask, roughly 58% each. And the thing I'm supposed to sell is the property that goes with it: if the reservoir refills to 130 next year, this rule guarantees nobody's number goes down, which almost no other splitting rule can promise.

  Here's my problem. The room is the grange hall, it'll be about ninety degrees in there, and it's split right down the middle. Half are upper valley growers who have been told for two years that the water is theirs by paperwork and by their grandfathers, and the other half are lower valley people who have been told they're getting nothing, plus the state's lawyer who keeps telling the reporters that obviously you just split it fifty-fifty, a civics class from the high school in the back, two local reporters, and my professor in the front row taking notes on whether I say anything that counts as promising an outcome. And the genuinely hard part, which I can't hide from either: under this rule the lower valley ends up with less than the upper valley even though the lower valley is the one that needs it more, and that's precisely because their fallback is nothing. The rule treats the old permits as the baseline and only divides what's left over on top of that. So I can't say we're starting from zero, I can't say everyone gets their fair share, and I can't say anything that makes it sound like the permits are being honored out of respect rather than out of arithmetic, or the upper valley's lawyer will quote it back at me as a concession and the lower valley's will quote it as an insult.

  So what I need from you is the six minutes I'll actually say out loud, standing up, no slides, no jargon, nothing that sounds like a lecture or like a settlement offer. It has to be true, it has to be bearable for the lower valley people sitting in that heat, and it has to explain in plain language why the number for their side is 41 and not 70 without ever implying that the rule is about need, or about history, or about who deserves what. And it has to make the refill promise land as a real reason to sign rather than as a talking point, because honestly that part is the only thing I have.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Role:** Neutral Facilitator (2nd-year Master's student).
      *   **Context:** Pro bono clinic, real water dispute, high stakes (state engineer imposes deal if no agreement by Friday).
      *   **Setting:** Grange hall, 90 degrees, hostile audience (split valley, state lawyer, reporters, students, professor).
      *   **Task:** Opening remarks (6 minutes).
      *   **Core Mechanism:** Kalai-Smorodinsky (KS) bargaining solution.
      *   **The Numbers:** 100 units available. Upper Valley (UV) wants 80, has permits (fallback 30). Lower Valley (LV) wants 70, no permits (fallback 0). KS Split: ~59 UV, ~41 LV.
      *   **The Constraint/Challenge:**
          *   Cannot promise an outcome (professor watching).
          *   Cannot use jargon (no "Kalai-Smorodinsky," "Pareto," etc.).
          *   Cannot imply the rule is about *need* (LV needs more but gets less).
          *   Cannot imply the rule is about *history/rights* (UV has permits, but we aren't validating them morally, just arithmetically).
          *   Cannot say "fair share" or "start from zero."
          *   Must explain why LV gets 41 (less than UV) without insulting them.
          *   Must sell the "Refill Promise" (Monotonicity: if water increases, no one's allocation decreases).
          *   Tone: Honest, bearable, plain language, not a lecture, not a settlement offer.

  2.  **Deconstruct the Kalai-Smorodinsky (KS) Solution for Laypeople:**
      *   *Mathematical Core:* It equalizes the *ratio* of gain relative to the maximum possible gain.
      *   *UV:* Fallback 30, Max Claim 80. Range = 50. Allocation 59. Gain = 29. Ratio = 29/50 = 58%.
      *   *LV:* Fallback 0, Max Claim 70. Range = 70. Allocation 41. Gain = 41. Ratio = 41/70 = 58%.
      *   *Key Insight:* Both sides get the same *percentage of what they could possibly hope to gain* above their worst-case scenario.
      *   *The "Refill Promise" (Monotonicity):* If the total pie gets bigger, the line stretches, and neither number goes down. This is the unique selling point of KS compared to Nash Bargaining or simple splitting.

  3.  **Address the Emotional/Political Landmines:**
      *   *Upper Valley:* They feel entitled to 80 (or at least their permit amount). They fear losing rights. *Strategy:* Acknowledge their baseline without validating it as moral truth. Frame it as "where you stand if we walk away."
      *   *Lower Valley:* They feel desperate. 41 is less than 59. They have no permits. *Strategy:* Focus on the *gain* from the worst case. 41 is infinitely better than 0. Emphasize the future growth (refill).
      *   *State Lawyer:* Wants 50/50. *Strategy:* Explain why 50/50 ignores the reality of the fallback positions.
      *   *Professor:* Watching for unauthorized practice of law or promising outcomes. *Strategy:* Use conditional language ("If we agree to use this method...", "This framework suggests..."). Do not say "I decide." Say "This is the tool."

  4.  **Drafting - Section by Section:**

      *   **Opening (The Heat & The Stakes):** Acknowledge the room, the temperature, the tension. Ground it in reality. Friday deadline.
      *   **The Problem (The Math of the Disagreement):** Define the "No-Deal" scenario clearly. State Engineer imposes old rules. UV gets 30, LV gets 0, 70 sits unused. This is the "floor."
      *   **The Method (The "Equal Effort" Analogy):** How to explain KS without math? Use the idea of "meeting halfway between where you are and where you want to be." But since the distances are different, "halfway" isn't 50/50. It's the same *proportion* of the journey.
      *   **The Numbers (The Hard Truth):** Address the 59/41 split. Why is LV lower? Because their starting line is further back. But their *progress* is the same percentage.
      *   **The Future (The Refill Promise):** This is the clincher. If water goes to 130, nobody loses. This creates an incentive to sign now to protect future gains.
      *   **Closing (The Invitation):** Invite them to use this framework. Remind them I'm a facilitator, not a judge.

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Remove "utility," "axis," "vector." Use "journey," "distance," "ground."
      *   *Critique:* Is it too cold for the Lower Valley?
      *   *Fix:* Acknowledge the pain of 41 vs 70. Validate that it feels unequal, but explain the *safety* of the method.
      *   *Critique:* Is it too conceding to Upper Valley?
      *   *Fix:* Make sure to mention the 70 units sitting in the reservoir under the State Engineer's plan. That's waste. Everyone hates waste.
      *   *Critique:* Professor constraint.
      *   *Fix:* Ensure I say "This is a proposal for a framework," not "This is the deal."

  6.  **Drafting the Content (Mental Walkthrough):**
      *   *Start:* Good morning. It's hot. We're here because Friday is coming.
      *   *The Fallback:* If we fail, State Engineer steps in. 30 for Upper, 0 for Lower. 70 locked up. Nobody wants that.
      *   *The Proposal:* We need a way to divide the *extra* water. Not the total, the extra above the fallback.
      *   *The Logic:* Imagine a ladder. Upper starts on rung 30, wants rung 80. Lower starts on ground, wants rung 70. We can't both get to the top. So we climb the same *percentage* of our own ladder.
      *   *The Result:* That lands us at 59 and 41. I know 41 hurts Lower. But 41 is 58% of your dream. 59 is 58% of your dream. We are sharing the *effort* of compromise equally.
      *   *The Future:* Next year, 130 units. Under this rule, your numbers don't go down. They go up. Other rules might take from you to give to them. This one doesn't.
      *   *End:* Sign the framework. Let's use this math to protect the future.

  7.  **Polishing for Time and Impact:**
      *   6 minutes is roughly 800-900 words spoken at a moderate pace.
      *   Need pauses. Need eye contact cues.
      *   Avoid "I think." Use "The framework shows."
      *   Crucial distinction: The 30/0 isn't "rights," it's "leverage." The 59/41 isn't "justice," it's "stability."

  8.  **Final Review against Constraints:**
      *   No jargon? (Checked).
      *   No promise of outcome? (Phrased as "If we adopt this framework...").
      *   No moralizing on permits? (Treated as factual baseline).
      *   No "need" argument? (Focused on claims and fallbacks).
      *   Refill promise clear? (Yes, monotonicity explained simply).
      *   Bearable for Lower Valley? (Focus on 0 vs 41, and future growth).

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't sound like I'm ruling.* I am facilitating. The *math* is the ruler. I am just holding the ruler. *Emphasize the waste in the status quo.* That unites everyone against the State Engineer's plan.

  *(Self-Correction on the Numbers)*: Wait, the prompt says KS lands at 59/41.
  UV: Fallback 30, Claim 80. Range 50. 58% of 50 = 29. 30 + 29 = 59.
  LV: Fallback 0, Claim 70. Range 70. 58% of 70 = 40.6 (round to 41).
  Total = 100.
  Okay, the math checks out. I need to make sure I explain that the "gain" is what's being split equally, not the total water.

  Let's write the speech.cw
answer: |-
  Good morning.

  I know it's already hot in here, and I know the temperature outside isn't helping. I know that for two years, you've been told different stories about who owns this water. I know the Upper Valley has paperwork from 1974. I know the Lower Valley has a school that needs to stay open and dairy cows that need to drink. And I know the State Engineer's office is telling the press that a clean fifty-fifty split is the only civic-minded solution.

  I am not here to tell you who is right. I am not here to tell you what is fair. I am here to talk about what happens on Friday, and what happens the year after.

  If we leave this room without a signed framework by Friday, the State Engineer imposes the old permits. We all know what that looks like. Upper Valley, you get thirty units. Lower Valley, you get zero. And seventy units of water sit in the reservoir as a legal buffer, unused, while crops dry out on both sides. That is the floor. That is where we stand if we walk away. Nothing more, nothing less.

  So the question isn't how to split one hundred units. The question is how to split the *seventy* units that are currently at risk of sitting idle.

  My advisor has asked me to present a specific framework for that division. It is a mathematical rule used in negotiations where the starting lines are different. It does not care about history. It does not care about need. It cares about one thing: equalizing the compromise.

  Here is how it works.

  Imagine you are both climbing a ladder. Upper Valley, your feet are already on the rung marked thirty. You want to reach rung eighty. Your climb is fifty rungs. Lower Valley, your feet are on the ground. You want to reach rung seventy. Your climb is seventy rungs.

  We cannot let everyone reach the top. There isn't enough water. So this rule says we should all climb the same percentage of our own ladder.

  If we do that, Upper Valley climbs fifty-eight percent of your distance. Lower Valley climbs fifty-eight percent of yours. When we do the arithmetic, that lands us at fifty-nine units for the Upper Valley, and forty-one units for the Lower Valley.

  I know what some of you are thinking. I can see it from here. Forty-one is less than fifty-nine. And the Lower Valley is the one with the new school and the growing population. It feels like the math is punishing you for having no permits.

  But look at the alternative. The alternative isn't fifty-nine and forty-one. The alternative is thirty and zero. Under this framework, the Lower Valley gains forty-one units of water that they would not have under the law. The Upper Valley gains twenty-nine units of water above their permit guarantee. We are not splitting the water equally. We are splitting the *gain* equally. Both sides are giving up the same percentage of what they hoped for.

  Now, I know the State Lawyer will say this is complicated. I know the Upper Valley will say the permits should guarantee more. I know the Lower Valley will say forty-one isn't enough to grow.

  But there is a second part to this rule. This is the part that matters for next year, and the year after.

  Water is not static. Next year, the snowpack might be heavy. The reservoir might hold one hundred and thirty units. Under most splitting rules, if the pie gets bigger, someone has to argue for their slice again. Someone might lose ground to make the other whole.

  Under this framework, that cannot happen. This rule has a promise built into it: If the total amount of water increases, no one's allocation goes down. If the reservoir fills to one hundred and thirty, the line stretches. The Upper Valley number goes up. The Lower Valley number goes up. Nobody is penalized for a wet year. Nobody has to fight to keep what they secured this year.

  This framework turns the water right into a shield. It stops you from having to come back here every drought to re-litigate your survival.

  I am not asking you to agree to the numbers today. I am asking you to agree to the ruler.

  If you sign this framework, you are not admitting that the permits are moral law. You are admitting they are the factual baseline. If you sign this, you are not saying the Lower Valley doesn't need more. You are saying that securing forty-one now is better than risking zero, and that securing the right to grow next year is worth the compromise today.

  Friday is coming. The State Engineer is waiting. We can let the law decide, and leave seventy units of water in the dark. Or we can use this rule, take the water out of the reservoir, and put it to work on both valleys.

  The math is on the table. The choice is yours.

  Thank you.
