      *Question:*
      "In the final lecture, a distinction was proposed between grief that has a 'job to do' (fused with uncertainty and hope) and grief that is the 'destination' (sought for its own sake despite a known ending). Evaluate the claim that these are ontologically distinct phenomena by testing them against the 'spoiler effect.' Why does knowing the ending obliterate the first kind of engagement while leaving the second untouched? Furthermore, demonstrate why standard aesthetic accounts (conversion by beauty, moral compensation, or the 'no real pain' thesis) inevitably fail to explain both modes simultaneously."

      *Model Answer:*
      (Drafting content)
      The claim that fictional sadness operates in two distinct modes—one instrumental, one terminal—resists the traditional urge to unify the paradox of tragedy under a single aesthetic law. If we accept the lecture's distinction, 'working grief' relies on the open future; it is the price of caring how things turn out. 'Destination grief,' conversely, is the endpoint itself, where the sadness is the object of consumption. The 'spoiler test' provides the empirical ground to verify this ontological split.
      When a narrative spoiler reveals the ending, 'working grief' collapses. This is because its mechanism is fused with not-knowing. The anxiety of uncertainty is not a bug but a feature; it is the fuel for hope. If I know the hero dies, my sadness is no longer the price of caring about their survival; it is merely a record of a fact. The tension dissolves because the 'job'—the resolution of uncertainty—cannot be done. However, 'destination grief' remains intact, or even intensifies, under spoilers. If I reread the final chapter of *Atonement* knowing the lovers never meet, the sadness is not diminished. Here, the sadness is not a means to resolution but the destination. The spoiler removes the anxiety but preserves the aesthetic object. We return to the feeling not to change it, but to inhabit it.
      Standard aesthetic theories falter because they attempt to apply a single logic to both modes. Consider the conversion theory, where pain is transfigured into pleasure by beauty or eloquence. This accounts well for 'destination grief.' We reread the sad ending because the eloquence makes the pain enjoyable. But it fails 'working grief.' While reading live, I do not want the pain converted; I want it resolved. I do not seek the beauty of the death; I seek the prevention of it. To convert this pain into pleasure prematurely would be to violate the contract of care.
      Similarly, the compensation theory—that we enjoy feeling rightly or morally—fits 'working grief' but fails 'destination grief.' In the first mode, my sadness proves my moral engagement; I feel badly because things are bad. But in 'destination grief,' there is no moral stakes left to resolve. Knowing the end, my feeling is no longer a response to uncertainty but a deliberate choice to suffer. The moral compensation vanishes; what remains is a masochistic aestheticism that compensation theory cannot explain without pathologizing the reader.
      Finally, the 'no real pain' thesis—that fictional grief is pretend—fails both. The pain in 'working grief' is physiologically real (anxiety, tears), driven by real hope. The pain in 'destination grief' is also real, sought deliberately. To call it fake ignores the visceral cost of both engagements.
      Ultimately, the spoiler test confirms the lecture's claim. These are not intensities of one emotion but different structures of attention. One looks forward through the pain; the other looks at the pain itself. Standard theories fail because they assume a unified subject seeking a unified pleasure. Recognizing the split allows us to see that fiction offers not just one way to suffer, but two: one to navigate the world, and one to inhabit the feeling of loss itself.
