answer: |-
  ### Part 1: Strategic Assessment & Brainstorming

  **The Honest Read**
  Your hunch is correct: the distinction is real, not verbal. The literature is stuck because it treats "time preference" as a monolithic psychological attitude when it is actually a conflation of three distinct structural features of agency.
  1.  **Location:** The temporal properties of the *object* (e.g., pain relief *now* is a different good than pain relief *later* because the context of suffering differs).
  2.  **Shape:** The temporal arrangement of the *series* (e.g., a rising slope of welfare is better than a falling slope, regardless of discounting).
  3.  **Partiality:** The temporal bias of the *subject* (e.g., weighting the interests of "me-now" higher than "me-later" solely due to temporal location).

  **The Scope Problem**
  You are right to worry. This is three projects.
  *   Defending the rationality of **Shape** preferences requires a theory of narrative unity and lifetime welfare. That's a book.
  *   Defending the rationality of **Location** preferences requires a metaphysics of goods and context-dependence. That's a paper.
  *   Dissolving **Partiality** requires an argument about personal identity and the coherence of "temporal bias" absent the other two. That's a paper.

  For an 8–10 week grant, you cannot do all three. If you try to defend the rationality of all three, you will produce a survey, not an argument. You need a spearhead.

  **My Recommendation: The Dissolution Strategy**
  Do not try to defend the rationality of all three. Instead, argue that **(1) and (2) are not time preferences at all** in the normative sense, and that **(3) is incoherent in isolation.**
  *   **Stance:** Argue that "Location" is just a feature of the good (relief from acute pain is instrumentally different than relief from anticipated pain). Argue that "Shape" is a preference for narrative structure, not time.
  *   **The Kill Shot:** Once you strip those away, "Pure Partiality" (caring less about a future self *just* because they are later) has no content. It dissolves into either epistemic uncertainty (I'm not sure I'll exist) or a change in the good (see Location).
  *   **Why this wins:** It doesn't just narrow the target; it eliminates the target. It explains *why* the debate goes in circles: philosophers are attacking a ghost created by bad categorization.

  **Why Existing Positions Miss This**
  *   **The Neutrality Theorists (Sidgwick/Parfit style):** They assume any deviation from temporal neutrality is irrational. They miss that Shape preferences *look* like deviation but aren't. They conflate "wanting the good sooner" with "wanting the good to be part of an improving sequence."
  *   **The Discounting Economists:** They treat all three as a single discount rate. They can't distinguish between a rational preference for improvement (Shape) and irrational myopia (Partiality).
  *   **The Prudential Rationalists:** They focus on the "separateness of persons" across time. They miss that Location preferences don't require separateness; they require only that the *context* of the good changes with time.

  **Verdict:** Keep the project. Cut the defense of Shape and Location to a minimum (treat them as "not PTP"). Focus the 10 weeks on demonstrating that **residual Pure Partiality is empty.** That is a publishable, determinate result.

  ***

  ### Part 2: Grant Proposal

  **Project Title:** The Tripartite Fallacy: Disambiguating Pure Time Preference and the Dissolution of Temporal Partiality

  **Project Summary**
  The debate over the rationality of pure time preference (PTP) has reached a stalemate. Proponents of temporal neutrality argue that discounting the future is irrational, while defenders of common sense argue that time bias is inherent to agency. This project argues that the stalemate arises from a category error: "Pure Time Preference" conflates three distinct phenomena—preferences for the *location* of goods, preferences for the *shape* of welfare streams, and partiality toward the *present self*. This project will demonstrate that the first two are structurally distinct from time preference and rationally defensible, and that the third, once isolated, dissolves into incoherence. The result will be a draft manuscript establishing that the standard irrationality charge lands on a non-existent target.

  **The Central Question**
  Is there a coherent, isolatable phenomenon of "pure time preference" that survives disambiguation from location and shape preferences, and if so, is it irrational?

  This question admits a determinate answer. If the phenomenon dissolves upon analysis, the answer is "No, the debate is misguided." If it survives, the answer is "Yes, and it is irrational." The project is designed to force this binary outcome, avoiding the indefinite "it depends" that characterizes current literature.

  **Why Existing Approaches Fail**
  Current arguments fail because they treat time preference as a unitary psychological attitude.
  1.  **The Neutrality View:** Arguments from prudence (e.g., Sidgwick, Parfit) assume that any weighting based on temporal position is arbitrary. They miss that preferring a good *now* often tracks a change in the *nature* of the good (e.g., pain relief is more valuable when pain is present), not an arbitrary bias.
  2.  **The Economic View:** Discounting models treat preferences for improving sequences (Shape) as identical to myopic discounting (Partiality). This leads to the false conclusion that rational planning requires a zero discount rate, ignoring the rationality of narrative structure.
  3.  **The Identity View:** Arguments focusing on the "separateness of persons" across time address Partiality but fail to explain why Location and Shape preferences persist even when personal identity is secure.

  By failing to distinguish these, existing positions attack a straw man (Location/Shape) or defend a ghost (Partiality). This project separates them to isolate the actual normative burden.

  **Methodology and Argument Structure**
  The project proceeds in three conceptual phases:
  1.  **Disambiguation:** I will define Location, Shape, and Partiality formally. I will argue that Location preferences track the instrumental value of goods relative to context (e.g., eating when hungry), and Shape preferences track the value of narrative unity. Neither constitutes a bias *against time* itself.
  2.  **Isolation:** I will construct a thought experiment controlling for Location and Shape. This involves a scenario where the good is identical, the sequence is flat, and identity is secure, leaving only the temporal position of the self as a variable.
  3.  **Dissolution:** I will argue that in this isolated scenario, no intelligible preference remains. A preference for "me-now" over "me-later" with no difference in goods, context, or narrative shape is not a preference; it is a confusion of the standpoint of evaluation.

  **Work Plan (10 Weeks)**
  *   **Weeks 1–2: Conceptual Mapping.** Drafting the precise definitions of Location, Shape, and Partiality. Reviewing internal notes on discounting models to ensure the distinctions hold against formal economic objections.
  *   **Weeks 3–5: The Isolation Argument.** Developing the controlled thought experiments. Testing the "Partiality" category against objections (e.g., phenomenological vividness, epistemic uncertainty). Writing the core argument that these objections reduce to Location or Shape.
  *   **Weeks 6–8: The Dissolution Thesis.** Drafting the positive argument: that rational agency requires a standpoint that is not itself temporally located in a way that generates bias. Writing the section on why the "irrationality charge" is a category error.
  *   **Weeks 9–10: Synthesis and Polish.** Assembling the sections into a unified manuscript. Refining the introduction and conclusion to ensure the determinate answer is clear. Preparing for submission.

  **Deliverables and Success Conditions**
  *   **Success:** A complete draft manuscript (approx. 8,000–10,000 words) ready for submission to a top generalist journal in philosophy. The draft must successfully demonstrate that the tripartite distinction is robust and that the "Partiality" category fails to denote a real psychological state.
  *   **Partial Success:** A draft that successfully establishes the tripartite distinction but remains agnostic on the dissolution of Partiality. This would still be a significant contribution by restructuring the debate, even if the final normative claim is withheld.
  *   **Failure:** The project fails if the three categories prove inextricably linked (e.g., if Location cannot be defined without Partiality). In this case, the output will be a short position paper outlining the conceptual impasse, which would still save future researchers from pursuing the same dead end.

  **Intellectual Merit**
  This project does not merely add another voice to the time preference debate; it aims to dissolve the debate by showing it rests on an ambiguity. By clearing away the conflation of Location and Shape, it forces a reckoning with the core notion of temporal partiality. If successful, it renders the standard "irrationality of time preference" argument obsolete, shifting the focus to the metaphysics of the temporally extended self. This is high-risk, high-reward philosophy that prioritizes conceptual clarity over incremental commentary.
