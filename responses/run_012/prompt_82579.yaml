prompt: |-
  I'm applying for a small internal research grant — basically buys me a semester, maybe 8-10 weeks of actual work — and I need help turning a half-formed idea into a proper proposal. Think of yourself as a philosopher of practical reason who's read too much of the discounting literature and is allergic to hand-waving. Start by brainstorming a bit: get the pieces of the idea on the table, poke at which version is actually worth defending, and only then write the proposal.

  Here's the idea. The fight over whether pure time preference is rational seems to me to be going in circles, and I think the reason is that "pure time preference" is being used for at least three seperate things. First, a preference about the *location* of a good — wanting the pleasure now rather than later, same pleasure either way. Second, a preference about the *shape* of a stream of goods — wanting things to improve rather than decline, wanting a life that gets better, which is not obviously a preference for earlier over later at all. Third, a kind of partiality toward the present self — weighting my current self's claim more heavily than my future self's just because it's current. My hunch is that only the third is "pure time preference" in the sense the irrationality charge is aimed at, and that the first two are either harmless or actually defensible, which would make the standard charge land on a much narrower target than its proponents think. But I'm not sure the narrower target even survives — maybe once you strip away shape and location, there's nothing left that's recognizable as a preference, and the whole notion dissolves.

  I want the proposal to state the question so it has a determinate answer, explain why the existing positions don't settle it (I know the usual replies about prudence, future selves, and the separateness of persons — I want you to say where they miss this distinction), lay out what I'd actually do week by week, and say what a successful result looks like versus what would count as the project failing. Give me your honest read on whether this is a real distinction or a verbal one, and take a definite position — tell me which version you'd defend and why, don't just lay the options out and leave it to me. Also be straight about scope: if this is really three projects, say so and tell me which one to keep.

  No bibliography or lit review by citation, please — I'll fill those in myself, just talk about the positions. And no need to hedge everything to death; I want a committed proposal I can send, not a survey.
