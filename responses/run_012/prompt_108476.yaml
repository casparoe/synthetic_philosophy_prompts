      *   Why: German revisionism regarding borders and reparations made conflict highly likely, though the timing and scope (e.g., vs. USSR only vs. West) would depend on the specific leadership.

  **Sensitivity Analysis**
  The final number is most sensitive to the **Extermination Contingency** term. If you define "systematically murdered" as "state-sponsored mass violence and death," the probability spikes toward 0.60. If you define it as "industrialized extermination camps," it stays near 0.30. The specific mechanism of the Holocaust is the biggest historical outlier, not the war itself.

  **Confidence & Uncertainty**
  I have **low confidence** in this number (±0.15 error bar). Counterfactual history is inherently speculative because small changes in the early 1920s cascade unpredictably. The bit I am **least sure about** is the behavior of the German Officer Corps and traditional conservatives; without Hitler's chaotic radicalism, they might have restrained the most extreme elements, or they might have pursued a "cleaner," more traditional military dictatorship that still committed atrocities but lacked the ideological drive for total extermination.

