  *   **Regime Specificity (Probability of a Racial-Nationalist vs. Generic Conservative Dictatorship): 0.60**
      *   Why: Antisemitism was endemic in the DNVP, military, and bureaucracy, but a specifically *biological/racial* worldview was more niche than traditional religious or cultural prejudice.
  *   **Extermination Contingency (Probability of Industrialized Murder given a Racial Regime): 0.35**
      *   Why: Most antisemitic regimes (Vichy, Hungary, Romania) opted for expulsion, expropriation, or sporadic pogroms; the leap to factory killing required specific ideological radicalization and war conditions that Hitler uniquely drove.
  *   **Base Rates (Probability of Authoritarianism $\to$ Genocide): 0.25**
      *   Why: As you noted, Italy and Spain became brutal dictatorships without industrial death camps; state collapse usually leads to repression, not systematic extermination.
