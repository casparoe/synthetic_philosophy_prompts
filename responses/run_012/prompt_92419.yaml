prompt: |-
  I'm a philosophy of science prof who did a PhD in ecology before switching over, so I know the evolutionary vocab from the inside — selection vs drift, lineages, fitness landscapes, adaptive radiation, relict populations, niche construction. Lakatos on research programmes has always felt like the right shape to me, but I want to know how much of it is actual content and how much is borrowed prestige. So: restate the methodology of scientific research programmes in my old vocabulary. Hard core, protective belt, negative and positive heuristics, progressive vs degenrating problem-shifts, and the no-instant-rationality line — put all of it in terms of populations, lineages, selection and drift, and do it faithfully, not as a cute analogy. Don't smuggle in evolution's assumptions and call that a translation.

  Then the residue report: what comes through clean, what only comes through if you fudge it, and what has no expression in evolutionary terms at all. I especially want your read on three things. (a) Can progressive mean anything without a notion of progress, given that ecology has pretty much given up on progress? (b) Does Lakatos's heuristic/appraisal split line up with the difference between forward ecological explanation and retrospective phylogenetic reconstruction, or is that a false friend? (c) Is a degenerating programme that survives on funding and inertia just drift — persistence without selection — or is that a category error?

  And the verdict I actually care about: where it doesn't translate, is that because evolutionary biology is missing a normative dimension it can't have, or because Lakatos was dressing up sociology of science as epistemology? Be honest, I'd rather have the unflattering answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Philosophy of Science Professor with a PhD in Ecology. Deeply familiar with evolutionary vocabulary (selection, drift, lineages, fitness landscapes, etc.) and Lakatosian methodology.
      *   **Goal:** Translate Lakatos's Methodology of Scientific Research Programmes (MSRP) into evolutionary/ecological terms *faithfully*, not just as a cute analogy. Then, analyze the "residue" (what fits, what doesn't). Finally, answer three specific questions (a, b, c) and deliver a verdict on whether the failure to translate is due to biology's lack of normativity or Lakatos's sociological dressing.
      *   **Tone:** Professional, rigorous, honest, unflattering if necessary, avoiding fluff. No "cute analogies."
      *   **Constraint:** Do not smuggle in evolutionary assumptions and call it translation. Do not smuggle in Lakatosian normativity and call it biology.

  2.  **Deconstruct Lakatos's MSRP:**
      *   *Hard Core:* Irrefutable assumptions by methodological decision.
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, etc., adjustable to protect the core.
      *   *Negative Heuristic:* Don't touch the hard core.
      *   *Positive Heuristic:* How to develop the belt (model building, problem-solving).
      *   *Progressive Problem-shift:* Theory predicts novel facts (theoretical & empirical).
      *   *Degenerating Problem-shift:* Theory only accommodates known facts, ad hoc adjustments.
      *   *No Instant Rationality:* Evaluation takes time (historical reconstruction).

  3.  **Drafting the Translation (Evolutionary/Ecological Vocabulary):**
      *   *Research Programme $\rightarrow$ Lineage/Clade of theories.* Let's treat a research programme as a evolving lineage of theoretical models.
      *   *Hard Core $\rightarrow$ Developmental Constraints/Genetic Architecture.* In biology, some traits are deeply canalized. In theory, some assumptions are structural. Let's call it the "Phylogenetic Signal" or "Deep Homology" of the programme. It's the inherited structure that defines the lineage identity.
      *   *Protective Belt $\rightarrow$ Phenotypic Plasticity/Local Adaptation.* The variable traits that interact with the environment (data/anomalies).
      *   *Negative Heuristic $\rightarrow$ Stabilizing Selection/Purifying Selection.* Selection against mutations (modifications) that alter the core identity.
      *   *Positive Heuristic $\rightarrow$ Directional Selection/Adaptive Walk.* The pressure to expand into new niches (novel predictions).
      *   *Progressive Problem-shift $\rightarrow$ Adaptive Radiation/Niche Expansion.* The lineage successfully colonizes new empirical territory (novel facts) and increases its "fitness" (explanatory power).
      *   *Degenerating Problem-shift $\rightarrow$ Evolutionary Dead End/Relict Population.* The lineage survives but stops expanding, relying on patching up existing adaptations (ad hoc) without gaining new ground.
      *   *No Instant Rationality $\rightarrow$ Time-Lagged Selection.* You can't judge fitness at a single generation; you need to see the trajectory over time.

      *Refining the Translation for Rigor:*
      *   Avoid teleology. "Heuristic" implies intent. In evolution, this must be selection pressure.
      *   "Hard Core" isn't just "important genes." It's the *developmental constraint* that makes the lineage recognizable.
      *   "Progressive" is the tricky one. In biology, it's reproductive success/expansion. In Lakatos, it's truth-likeness/novel prediction. I need to map "novel prediction" to "niche expansion."

  4.  **Analyzing the Residue (The "Clean" vs. "Fudge" vs. "None"):**
      *   *Clean:* Lineages competing, some expanding, some stagnating. The historical nature of assessment.
      *   *Fudge:* The "Hard Core." In biology, nothing is truly irrefutable; constraints break. Lakatos assumes a methodological *decision* to protect the core. Evolution has *selection* against core changes. One is volitional/normative, the other is causal/descriptive.
      *   *None:* Normativity. Evolution describes what *is* (survival), Lakatos prescribes what *ought* to be (rationality).

  5.  **Addressing the Three Specific Questions:**

      *   *(a) Progressive without Progress:* Ecology rejects orthogenesis. Lakatos needs "progress" (getting closer to truth/more content).
          *   *Analysis:* In evolution, "progressive" = expansion/survival. In Lakatos, "progressive" = empirical content growth. If we strip teleology, Lakatos's "progress" is just "survival via expansion." But Lakatos wants *epistemic* progress. Ecology only gives *demographic* success.
          *   *Verdict:* It's a category error to call demographic success "epistemic progress."

      *   *(b) Heuristic/Appraisal vs. Forward/Retrospective:*
          *   *Analysis:* Heuristics are "rules of thumb" for building models (forward-looking). Appraisal is judging them (backward-looking).
          *   *Ecology:* Forward = Process Ecology (mechanisms). Retrospective = Phylogenetics (history).
