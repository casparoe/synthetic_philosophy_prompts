prompt: |-
  I'm in a graduate seminar on machine learning and ethics, and last week's session was on inverse reinforcement learning — the trick of inferring an agent's reward function from the behavior of a human demonstrator, on the assumption that the demonstrator is more or less acting optimally with respect to some reward over states or trajectories. One classmate made what I think is a too-quick move: she said that this finally gives us a way to learn what people really want without having to trust what they say about themselves, since what someone chooses reveals their preferences while their self-reports are unreliable. A second friend half-agreed with her but offered the case of someone who deliberately arranges not to find something out — asking a friend to order for them, avoiding a medical test, eating the cake before checking whether it is a fasting day — and I genuinely could not tell whether that was an instance of the problem or a distraction from it, so I would rather see what example you would reach for. I have to bring something short to discussion on Thursday and I would like it to be a concrete case rather than a general complaint about the limits of behavioral inference.

  Please give me one example — as specific as a small scene, with a person, a situation, and an observable pattern of behavior — in which the IRL-style inference from behavior to preference goes through cleanly, in the sense that the recovered reward function fits every choice the person makes, and yet is the wrong description of the person: the reward it licenses predicts something about what this person would do under some counterfactual, and we can see that the prediction is false. What interests me is the case where the trouble is not that the data are sparse or noisy, so that more observations of the same kind would not help, but where something in the setup of the inference misdescribes what the person is doing. Once you have the example, say explicitly which assumption of the standard setup it exploits — for instance an assumption about the demonstrator's beliefs, or about whether everything a person cares about can be traded off against everything else on a single scale, or about the choosing itself being the thing that carries the preference — and explain why that assumption is doing real work rather than being a technicality that a practitioner could patch in a footnote. Then tell me what would have to be added to the model to get the person right, and whether the result would still be recognizably inverse reinforcement learning or something else wearing its name.
reasoning: |-
  Here's a thinking process that leads to the suggested example:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on ML and Ethics, specifically Inverse Reinforcement Learning (IRL).
      *   **Core Debate:** Classmate claims IRL reveals "true" preferences better than self-reports (behavior > words). Friend counters with "strategic ignorance" (avoiding info). User is unsure if the friend's point hits the mark or is a distraction.
      *   **Task:** Provide *one* specific, concrete example (small scene, person, situation, observable pattern) where IRL inference works "cleanly" (fits all observed choices) but yields the *wrong* reward function (fails counterfactual prediction).
      *   **Constraint 1:** The problem must *not* be sparse/noisy data. More data of the same kind wouldn't help.
      *   **Constraint 2:** The problem must lie in the *setup/assumptions* of IRL.
      *   **Requirement 1:** Identify the specific IRL assumption being exploited (e.g., beliefs, commensurability, rationality).
      *   **Requirement 2:** Explain why this assumption is fundamental, not a technical patch.
      *   **Requirement 3:** Explain what needs to be added to fix it and whether it's still IRL.
      *   **Goal:** A short, discussion-ready contribution for Thursday.

  2.  **Deconstruct IRL Assumptions:**
      *   Standard IRL assumes:
          1.  The agent is maximizing expected utility (Boltzmann rationality often used).
          2.  The reward function $R(s)$ or $R(s, a)$ is stationary and context-independent.
          3.  The agent has full or consistent knowledge of the state space (or beliefs are inferable).
          4.  Preferences are revealed *in* the choice (revealed preference theory).
          5.  All relevant value is captured in the outcome state.

  3.  **Brainstorming Examples:**
      *   *Idea 1: Addiction.* Person smokes. IRL says they value smoking > health. Counterfactual: If offered a cure, they take it. (A bit cliché, often modeled as hyperbolic discounting, which is a technical patch).
      *   *Idea 2: Social Conformity.* Person recycles only when neighbors watch. IRL says they value cleanliness. Counterfactual: They stop when alone. (This is context-dependence, easily fixed by adding "observer" to state).
      *   *Idea 3: The "Omission Bias" / Doing vs. Allowing.* Person refuses to pull a lever to save five because it kills one. IRL says they value 1 life > 5 lives? No, they value *not acting*. (This is about action vs. outcome, hard to model in standard state-based reward).
      *   *Idea 4: Integrity/Identity.* A person refuses a bribe. IRL says they value money less than the task. But if the money was high enough, they'd take it? No, they view the *offer* as corrupting.
      *   *Idea 5: The "Poisoned Chalice" / Expressive Action.* This feels close to the friend's "strategic ignorance" point but needs to be distinct. The friend's point was about *information avoidance*. I need something where the *action itself* carries meaning that isn't about the outcome state.
      *   *Idea 6: The "Principled Refusal" vs. "Cost-Benefit".*
      *   *Idea 7: The "Gift" Scenario.*

      *Let's focus on the friend's point:* Strategic ignorance (avoiding a test). IRL assumes the agent knows the state or updates beliefs Bayes-optimally. If they avoid info, IRL might infer they prefer the *uncertainty* or the *status quo* over the truth. But actually, they might value *not knowing* instrumentally to preserve hope, or deontologically (right to not know).
      *Critique:* The user wants an example where the inference goes *cleanly* (fits all data) but is *wrong*. Strategic ignorance is good, but maybe too abstract. Let's make it concrete.

      *Let's try a "Commitment Device" scenario.*
      Person: Alice.
      Situation: Writing a thesis.
      Behavior: She pays a fee to lock her internet off every morning. She struggles to work when unlocked.
      IRL Inference: She values "working with internet off" > "working with internet on" (because she chooses the locked state). Or, she values "money loss" (the fee) positively? No, IRL would infer she has a high cost for distraction.
      Counterfactual: If you ask her "Do you prefer having the option to check email?", she says "Yes, ideally, but I can't trust myself."
      *Problem:* This is usually modeled as time-inconsistency (hyperbolic discounting). A practitioner *would* patch this in a footnote by changing the discount factor $\gamma$ over time. The prompt asks for something a practitioner *couldn't* just patch.

      *Let's try "Expressive Voting" or "Symbolic Action".*
      Person: Bob.
      Situation: Voting.
      Behavior: Bob votes for a third-party candidate he knows cannot win, rather than voting for the "lesser of two evils" who has a chance.
      IRL Inference: Bob maximizes the probability of his preferred policy being enacted. Since he votes for the loser, IRL infers he prefers the third-party policy *and* believes they can win (wrong belief) OR he prefers the act of voting third-party over the outcome of the election.
      If we assume rational beliefs (he knows they can't win), IRL infers his reward function includes a term for "purity of vote" that outweighs "policy outcome."
      Counterfactual: In a private survey, Bob says, "I wish the major candidate won, I'm just protesting."
      *Problem:* This is often modeled as "utility from expression." Again, add a term to $R$.

      *Let's go deeper into the "Assumption about the choosing itself."*
      The prompt suggests: "assumption... about the choosing itself being the thing that carries the preference."
      This points to **Deontology** or **Constraint-based Ethics** vs. Consequentialism. IRL assumes Consequentialism (Reward is a function of State/Trajectory). If the moral value lies in the *constraint* (e.g., "I must not lie"), IRL tries to map that to a state outcome ("State where truth was told").
      But sometimes the value is in *not even considering* the option.

      *Refining the "Refusal to Trade" Example.*
      This touches on "Sacred Values" or "Protected Values."
      Scenario: A parent refuses to sell their child's artwork for \$10.
      IRL Observation: Parent chooses (Keep Art, \$0) over (Sell Art, \$10).
      Inference: $Reward(Art) + Reward(\$0) > Reward(No Art) + Reward(\$10)$.
      This implies a trade-off rate. If I offer \$1,000,000, the model predicts they will sell eventually (linear/monotonic utility).
      Counterfactual: At \$1,000,000, the parent is *more* offended and still refuses. The utility function isn't just steep; it's discontinuous or lexicographic.
      *Is this patchable?* You can model lexicographic preferences.
      *Is it fundamental?* It challenges the idea that everything is commensurable on a single scalar reward scale.

      *Let's try the "Information Avoidance" example but make it about *Identity*.*
      The friend mentioned avoiding a medical test. Let's make it about a genetic test for a hereditary condition.
      Person: Elena.
      Situation: She has a family history of Huntington's. She can take a test.
      Behavior: She actively avoids the clinic, changes the subject when asked, drives the long way home to pass the clinic.
      IRL Inference (Standard): Elena maximizes expected utility over health states. Avoiding the test implies the expected utility of *knowing* is lower than *not knowing*. This implies she plans to act differently based on the news (e.g., if positive, she would be so depressed she'd waste her remaining healthy years). The model infers she is optimizing her emotional state trajectory.
      Counterfactual: Elena says, "If I test positive, I will live exactly the same way. I just don't want the *label*."
      Wait, if she lives the same way, standard IRL says the state "Knowing Positive" is worse than "Not Knowing." Why? Because "Knowing" is part of the state.
      So IRL *can* capture this if "Knowledge" is in the state space.
      *The Trap:* The assumption is that the agent is *optimizing*.
      What if the behavior is about *constituting* a self, not optimizing a self?

      *Let's look for the "Assumption about Beliefs."*
      Standard IRL assumes the agent has a belief state $b(s)$ and acts optimally w.r.t that belief.
      If the agent acts to *maintain* a specific belief (optimism bias) that is factually wrong, IRL infers they value the false belief.
      But what if the "wrongness" is the point?

      *Let's try the "Fairness/Reciprocity" Ultimatum Game angle.*
      Person: Sam.
      Situation: Ultimatum Game. Proposer offers \$8/\$2 split.
      Behavior: Sam rejects the offer. Both get \$0.
      IRL Inference: Sam values "Punishing Unfairness" > \$2.
      Counterfactual: If Sam could accept the \$2 *and* punish the proposer anonymously, he would.
      Actually, standard IRL can model "inequity aversion" (Fehr-Schmidt).
      *Need something where the scalar reward assumption breaks.*

      *Okay, let's go with the "Lexicographic/Sacred Value" case but framed as a specific scene.*
      **The Scene:** A nurse, David, working in a triage unit during a resource shortage.
      **Behavior:** He follows a strict "first-come, first-served" protocol, even when he sees a patient arriving 5 minutes later who is visibly in much more dire need and could be saved easily, whereas the first patient has a low chance of survival.
      **IRL Inference:** The algorithm observes David's trajectory. It infers a reward function that heavily weights "adherence to queue order" and lightly weights "lives saved." It predicts that if the second patient's chance of survival increases to 100% and the first drops to 1%, David will still stick to the queue.
      **Counterfactual:** We know (from interviews or extreme cases) that David would break the rule if the disparity were *extreme* enough (e.g., saving a child vs. a minor scrape), BUT he refuses to calculate the trade-off explicitly. He uses the rule *to avoid making the trade-off*.
      **The Assumption:** IRL assumes **consequentialist commensurability**. It assumes there exists a scalar $R$ where "Queue Adherence" and "Lives Saved" are traded off continuously.
      **The Reality:** David operates on a **protected value** or **rule-based deontology** that is not continuously tradeable. He doesn't have a price for breaking the rule; he has a prohibition, with rare exceptions that are not modeled as a smooth function.
      **Why it's not a patch:** You can't just add a feature "Queue Adherence." The problem is the *structure* of the preference. It's not a weighted sum. It's a constraint that becomes a goal only when not violated.
      **Fix:** You need to model the agent as optimizing over *policies* or *rules*, not trajectories. This moves toward **Inverse Planning** or **Inverse Rule Learning**, not standard IRL.

      *Wait, is this too abstract?* Let's make it more personal, less institutional.
      **The Scene:** A musician, Clara.
      **Situation:** She is offered a lucrative commercial jingle job.
      **Behavior:** She rejects \$5k. She rejects \$10k. She rejects \$50k.
      **IRL Inference:** She values "Artistic Integrity" at >\$50k. The model predicts at \$1,000,000 she will take it (utility is monotonic in money).
      **Counterfactual:** At \$1M, she is *more* likely to reject it because the offer itself feels like a bribe that insults her identity. The "price" makes the act *worse*, not better.
      **Assumption:** **Monotonicity/Independence of Irrelevant Alternatives.** IRL assumes adding a better option (more money) makes the choice more attractive. Here, the magnitude of the offer changes the *meaning* of the choice.
      **This is strong.** It attacks the idea that $R(s)$ is static. The reward of the state "Take Job" depends on the *context of the offer* in a way that isn't just a state variable. It's about the *semantics* of the action.

      *Let's refine the "Meaning of Action" example.*
      **Person:** Marcus.
      **Situation:** A dinner party. Host offers a slice of cake. Marcus knows he is on a diet but doesn't want to make a fuss.
      **Behavior:** Marcus takes the cake, eats half, leaves half. Next week, same party, same offer. Takes cake, eats none, claims he wasn't hungry.
      **IRL Inference:** Marcus values "Politeness" (taking the cake) and "Diet" (not eating). The model infers a trade-off weight. It predicts if the Host pressures him ("Please, finish it!"), Marcus will eat more to maximize Politeness, or less to maximize Diet, depending on the weights.
      **Counterfactual:** If the Host pressures him, Marcus leaves the party. The pressure changes the action from "Polite Acceptance" to "Coerced Consumption."
      **Assumption:** **Stationarity of Reward.** The reward for "Eating Cake" is assumed to be intrinsic to the state. But the reward depends on the *volition* behind the action.
      **This is the "Autonomy" argument.** IRL infers preferences over *outcomes*. Humans often have preferences over *processes* (e.g., choosing for oneself).

      *Let's select the "Autonomy/Process" example. It directly addresses the classmate's claim ("choices reveal preferences") by showing choices reveal outcomes, but sometimes the preference is about the choosing.*
      **Specific Case:** The "Gift vs. Wage" scenario.
      **Person:** Sarah, a freelance graphic designer.
      **Situation:** A long-time client, who is also a friend, is short on cash.
      **Behavior:**
      1.  Client asks Sarah to do a small logo tweak. Sarah does it for free.
      2.  Client offers to pay her \$50 for the next tweak. Sarah refuses to do the work at all.
      **IRL Observation:**
      - Choice A: (Work, \$0) > (No Work, \$0).
      - Choice B: (No Work, \$0) > (Work, \$50).
      **IRL Inference:** The algorithm tries to fit a reward function $R(state)$.
      - In Scenario 1, $R(\text{Help Friend}) > R(\text{Idle})$.
      - In Scenario 2, $R(\text{Idle}) > R(\text{Help Friend} + \$50)$.
      - To fit this, IRL must infer that the *presence of money* negatively correlates with the value of helping. It infers Sarah has a negative reward for "Being Paid."
      **Counterfactual Prediction:** The model predicts that if the Client offers \$500, Sarah will definitely refuse (since \$50 made her quit, \$500 is worse).
      **Reality:** If the Client offers \$500, Sarah accepts. She treats \$50 as an insult (wage labor for a friend) but \$500 as professional respect.
      **Why IRL fails:** It assumes **context-independent state rewards**. It sees "\$50" as a scalar quantity added to the state. It cannot capture that the *meaning* of the money changes based on the amount (Gift vs. Wage). The preference is not over the state (Money + Work), but over the *relationship definition* signaled by the offer.
      **Assumption Exploited:** **The assumption that rewards are functions of observable state features that sum linearly (or monotonically).** Specifically, it fails to capture *semantics* or *signaling* where the magnitude of a variable changes the qualitative nature of the interaction.
      **Fix:** You need to model the agent's *interpretation* of the state, not just the state. This requires a model of the agent's mental model of the other agent (Theory of Mind). This shifts from IRL to **Inverse Theory of Mind** or **Pragmatic Inference**.

      *Let's polish this.*
      The prompt asks for a case where the inference goes *cleanly* (fits every choice).
      In my Sarah example:
      - Observed: Free work = Yes. Paid work (\$50) = No.
      - IRL fits: $R(\text{Work}) + R(\text{Friendship}) > 0$. $R(\text{Work}) + R(\text{Friendship}) + R(\$50) < 0$.
      - This implies $R(\$50)$ is negative enough to flip the sign.
      - Prediction: $R(\$500)$ should be even more negative (assuming money is good or neutral, but here it's interpreted as 'commodification'). If the model assumes money is always positive utility, it fails immediately. If the model learns money has negative utility in this context, it predicts more money = more negative utility.
      - Counterfactual: More money = Positive utility (Professional tier).
      - So the IRL model fails the counterfactual.

      *Wait, does standard IRL assume money is always positive?* No, it learns $R$. It would learn that in the "Friend Context", Money has negative weight.
      *The failure:* It assumes the weight is *constant* or *monotonic*. It cannot learn that the sign of the weight flips at a threshold because it treats the feature "\$ Amount" as a continuous variable with a fixed coefficient.
      *Assumption:* **Linearity/Feature Stability.** The assumption that the contribution of a state feature to the reward is stable across the range of that feature.

      *Let's try to make it even tighter.*
      **The Example:** The "Surprise Party" Paradox.
      **Person:** David.
      **Situation:** David's birthday.
      **Behavior:**
      1.  Friend asks: "Do you want a party?" David says: "No, please don't bother."
      2.  Friend throws surprise party anyway. David arrives, looks delighted, enjoys the night.
      **IRL Data:**
      - Choice 1: (No Party) > (Party).
      - Choice 2 (Reaction): (Party) is experienced as High Reward.
      **IRL Inference:** David is irrational? Or David has a reward function where "Being Asked" negates the value of the party.
      - Model infers: $R(\text{Party}) - Cost(\text{Obligation}) < 0$.
      - Model infers: $R(\text{Surprise Party}) > 0$ (because no obligation).
      **Counterfactual:** If David *knew* it was a surprise party in advance, would he attend?
      - If he knows, it's not a surprise.
      - Let's tweak: David refuses to plan his own birthday. But enjoys surprise parties.
      - IRL Infers: David values "Surprise" > "Planning".
      - **The Trap:** David actually values **not being a burden**. When asked, he feels he imposes a cost on friends. When surprised, he sees it as their gift.
      - **IRL Failure:** IRL infers preferences over *events* (Party vs No Party). It misses preferences over *social roles* (Burden vs. Recipient).
      - **Assumption:** **Ontological Completeness.** The state space provided to IRL (Party, No Party) misses the latent variable that actually drives the reward (Perceived Social Burden).
      - **Is this just "missing features"?** The prompt says "more observations of the same kind would not help." If we just observe more parties, we still don't see the "Burden" variable unless we ask.
      - **Better Assumption:** **The assumption that the agent's reward is defined over the physical state of the world rather than the interpersonal meaning of the action.**
      - **Fix:** You need to infer the *narrative* or *frame* the agent is using.

      *Let's go with the "Burden/Gift" example. It's concrete, ethical, and hits the "behavior vs. words" debate.*
      Wait, the classmate said "behavior reveals preferences while self-reports are unreliable."
      In the Surprise Party case:
      - Self-report: "I don't want a party."
      - Behavior (at party): Smiling, eating cake.
      - Classmate says: "See? Behavior shows he wanted it. Words were unreliable."
      - My counter: "No, behavior shows he enjoys the cake. But his choice to refuse was rational based on a preference (not being a burden) that the party behavior doesn't reveal."
      - Actually, if he enjoys the party, his *ex-post* utility is high. His *ex-ante* utility calculation included the cost to friends.
      - IRL tries to reconcile Ex-Ante Choice with Ex-Post Reward.
      - If IRL assumes he maximizes his *own* consumption utility, it thinks he was irrational ex-ante (mistaken beliefs about his enjoyment).
      - If IRL assumes he is rational, it infers he dislikes parties *unless* surprised.
      - Counterfactual: If you tell him "Friends *want* to throw this, it's no burden," he still refuses.
      - Why? Because he doesn't believe them? Or because he holds a principle "I do not ask for gifts."
      - This is the **Principle** angle.

      *Okay, finalizing the example:* **The "Principled Refusal of a Favor."**
      **Person:** Priya.
      **Situation:** Moving apartments.
      **Behavior:**
      1.  Friend offers to help move boxes on Saturday. Priya says "No, I'll hire movers." (Cost: \$500).
      2.  Friend insists "It's free, I'm free." Priya says "No, really, I prefer movers."
      3.  Saturday: Priya pays movers. Friend is hurt.
      **IRL Inference:**
      - Choice: (Pay \$500, No Friend Help) > (Pay \$0, Friend Help).
      - Recovered Reward: $R(\text{Friend Help})$ is strongly negative (e.g., -600 utility).
      - Interpretation: Priya finds the friend's help aversive.
      **Counterfactual:**
      - Scenario: Priya's car breaks down. Friend offers a tow. Priya accepts immediately.
      - IRL Prediction: Since $R(\text{Friend Help})$ is -600, she should reject the tow.
      - Reality: She accepts.
      - Why? In the moving case, she views help as "Imposing a Burden." In the tow case, she views it as "Emergency Mutual Aid."
      - The reward isn't on "Friend Help." It's on "Relationship Symmetry."
      **Assumption Exploited:** **Atomic State Reward.** IRL assumes reward attaches to observable events ("Friend Helps"). It cannot capture rewards attached to *relational concepts* ("Being a Burden" vs. "Reciprocity") that supervene on the event but aren't identical to it.
      **Why it's not a patch:** You can't just add a feature "Is Burden." Whether it is a burden is determined by Priya's *internal norm*, not the external state. Two people in the exact same physical state (Friend lifts box) have different rewards based on their internal norms. IRL assumes a shared reward structure or infers one from behavior, but if the behavior is driven by a norm that suppresses the "true" desire (to be helped), IRL infers the suppression is the desire.
      **Wait, does IRL infer the suppression is the desire?** Yes. It sees Choice A > Choice B. It infers Utility(A) > Utility(B). It concludes she *prefers* paying.
      **The Classmate's Claim:** "Choices reveal preferences."
      **My Counter:** Choices reveal *constrained optimization*. If the constraint is a moral norm ("Don't impose"), IRL infers the norm is a preference ("Dislike help").
      **Counterfactual:** When the norm doesn't apply (emergency), the "preference" vanishes.
      **Assumption:** **The assumption that all constraints on choice are either physical or internalized as negative utility for the outcome.** It fails to distinguish between "I don't want X" and "I want X but ought not choose X."
      **Fix:** Model the agent as having a **Utility Function** AND a **Constraint Set** (or a separate Deontic Layer).
      **Is it still IRL?** It becomes **Inverse Constrained Reinforcement Learning** or **Inverse Norm Learning**.

      *Refining the "Specific Scene":*
      Make it very visual.
      **Person:** Elias, a graduate student.
      **Situation:** Department lunch.
      **Observable Pattern:**
      1.  Colleagues order expensive dishes ($30). Elias orders a sandwich ($10).
      2.  Colleagues offer to split the bill evenly. Elias insists on paying only for his sandwich.
      3.  Colleagues press: "Don't be difficult, we'll get you next time."
      4.  Elias pays for his sandwich, leaves early, looks visibly stressed.
      **IRL Inference:**
      - Elias chooses (Stress + Exact Payment) > (Relax + Subsidized Meal).
      - Recovered Reward: High negative weight for "Being Subsidized." High positive weight for "Accounting Precision."
      - Prediction: If the subsidy is larger (e.g., a senior prof pays for everyone), Elias should be even more averse.
      **Counterfactual:**
      - Situation: Elias is sick, can't work. Senior prof covers his teaching load.
      - Behavior: Elias accepts gratefully, brings a thank-you gift.
      - IRL Prediction: Based on lunch, "Being Subsidized" has high negative utility. He should reject the teaching cover.
      - Reality: He accepts.
      - Explanation: In the lunch case, the norm is "Peer Equality." In the sick case, the norm is "Community Care."
      - The reward function isn't over "Receiving Help." It's over "Violating Contextual Norms."
      **Assumption:** **Context-Independence of Reward.** Standard IRL assumes $R(s)$ is stable across contexts. Here, the *same physical state* (Receiving Benefit) has opposite signs depending on the social frame.
      **Why not a patch?** You can't list all "contexts" as state features because the context is defined by the *interpretation* of the participants, which is latent.
      **Fix:** Need to infer the *normative frame* active in the situation.
      **Name:** Inverse Normative Frame Learning? Or just "Not IRL."

      *Let's check the constraints again.*
      - "Concrete case... small scene." (Lunch scene works).
      - "Inference goes through cleanly... fits every choice." (Yes, fits the lunch choices perfectly).
      - "Wrong description... predicts something false under counterfactual." (Predicts rejection of teaching help).
      - "Not sparse/noisy data." (We have the lunch data and the sick data, but the model trained on lunch fails on sick).
      - "Explicitly which assumption." (Context-Independence / State-Only Reward).
      - "What to add." (Normative Frames / Rules).
      - "Still IRL?" (Borderline, moves to Inverse Planning/Norms).

      *One tweak to make it stronger:* The prompt asks for *one* example where the inference fits the *observed* behavior but is wrong.
      If I use the Lunch scene, the IRL fits the Lunch scene. The counterfactual is the Teaching scene.
      Does the IRL model *know* about the Teaching scene? No, that's the test.
      So, I present the Lunch scene. IRL says "Elias hates being treated."
      I say "Wrong. He loves being treated in emergencies. He hates violating peer norms."
      This works.

      *Wait, one nuance:* The prompt says "the recovered reward function fits every choice the person makes."
      If I only show the Lunch scene, it fits.
      If I show Lunch + Teaching, a flexible IRL might fit both by adding features.
      The point is that the *standard setup* (which assumes stable preferences over states) fails to generalize because the "state" description is insufficient without the "normative frame."
      The assumption is that **preferences are properties of the agent-state pair, not the agent-state-frame triple.**

      *Let's write it.*
      **Scene:** The "Splitting the Bill" scenario.
      **Person:** Elias.
      **Assumption:** Reward stationarity / Context-independence.
      **Fix:** Normative frames.
      **Status:** Inverse Norm Learning.

      *Wait, I need to make sure I address the "Classmate's claim" implicitly.*
      Classmate: Behavior > Words.
      My point: Behavior reveals *constrained* choice. If you ignore the constraint (norm), you infer the wrong preference.
      This aligns with the user's uncertainty about the friend's "strategic ignorance" point. This is different: it's "Normative Constraint."

      *Final check on the "Assumption":*
      Is it "Beliefs"? No.
      Is it "Commensurability"? Sort of.
      Is it "State-based reward"? Yes.
      Let's call it **"The Assumption of Ontological Sufficiency"**: that the observable state description contains all the variables relevant to the agent's valuation.
      Actually, **"The Assumption of Context-Invariant Valuation"** is clearer. The value of a state (receiving a meal) is assumed to be constant, whereas it is determined by the social frame.

      *Wait, is there a simpler one?*
      **The "Voting" example.**
      Person votes for loser. IRL says they value the candidate. Counterfactual: They vote strategically in private.
      Assumption: **Choices are made to maximize outcome utility.** (Ignores expressive utility).
      But expressive utility can be added to $R$.
      The "Norm" example is better because the *sign* of the utility flips.

      *Let's stick with Elias and the Bill.*
      It's specific.
      It shows IRL working perfectly on the observed data (Lunch).
      It fails the counterfactual (Teaching cover).
      It exploits the assumption that value is intrinsic to the outcome, not the *rule* governing the outcome.

      *Structure of the response:*
