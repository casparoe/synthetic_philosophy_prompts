  Here is a concrete case you can bring to the seminar.

  ### The Scene: The Split Bill
  **Person:** Elias, a junior graduate student.
  **Situation:** A department lunch with five peers. The bill comes to \$150. Everyone else ordered roughly \$30 meals; Elias ordered a \$10 sandwich.
  **Observable Behavior:**
  1.  When the server asks how to split it, the table suggests "evenly" (\$25 each).
  2.  Elias visibly stiffens. He insists on calculating his exact share plus tax.
  3.  A peer says, "Don't worry about it, I'll cover the difference." Elias refuses, pays his \$12, and leaves the table early, appearing anxious.
  4.  **Pattern:** In three similar lunch scenarios over the semester, Elias repeats this behavior: refusing subsidies from peers, even when it costs him social capital (leaving early, appearing difficult).

  ### The IRL Inference
  An IRL algorithm observing *only* these lunch trajectories infers a reward function $R(s)$ where:
  *   $R(\text{Receiving Subsidy})$ is strongly negative (e.g., -50 utility).
  *   $R(\text{Social Friction})$ is moderately negative (e.g., -10 utility).
  *   $R(\text{Financial Precision})$ is positive.

  The model fits the data cleanly: Elias consistently chooses the high-friction, high-precision option over the subsidized one. The recovered preference is: **Elias values financial independence over peer rapport.**

  ### The Counterfactual Failure
  **Situation:** Mid-semester, Elias falls ill and misses a week of teaching. A senior professor (not a peer) offers to cover his classes without docking his pay.
  **Behavior:** Elias accepts immediately, expresses profound gratitude, and brings the professor a gift.
  **IRL Prediction:** Based on the lunch data, "Receiving Subsidy" has a high negative weight. The model predicts Elias should reject the professor's help to maintain independence.
  **Reality:** He accepts. The "preference" inferred from the lunch behavior vanishes.

  ### The Exploited Assumption
  This case exploits the assumption of **Context-Invariant Valuation** (often implicit in the state representation). Standard IRL assumes that the reward for a state feature (e.g., *Receiving Money/Help*) is stable across situations, or that any variation can be captured by adding observable state features (e.g., *Giver=Peer* vs. *Giver=Prof*).

  The failure is deeper: Elias is not optimizing a consequentialist utility function over outcomes (Help vs. No Help). He is following a **normative rule**: *"Do not impose burdens on peers, but accept care from the community in emergencies."*
  *   In the lunch case, the help is framed as a **burden on equals**.
  *   In the illness case, the help is framed as **community maintenance**.

  The physical state (Receiving Help) is identical, but the *moral frame* flips the sign of the reward. IRL assumes the reward is a property of the *state*; here, the reward is a property of the *interpretation* of the state.

  ### Why This Is Not a Technical Patch
  A practitioner might suggest adding a feature like `is_emergency` or `giver_status` to the state vector. However, whether a situation counts as an "emergency" or a "burden" is not an objective feature of the world like rain or traffic; it is a **latent social construct** determined by the agent's internal normative model. You cannot observe the "frame" directly from the trajectory; you must infer the *rule* the agent is following.

  If you treat the norm as just another feature, you miss the mechanism: Elias isn't trading off "Help" vs. "Norm." He is *constrained* by the norm. When the norm doesn't apply (illness), the constraint lifts. IRL tries to model the constraint as a *cost* (negative reward for help). This predicts that more help = more cost. But for Elias, more help in an emergency = more relief. The model fails because it tries to flatten a **lexical constraint** into a **continuous trade-off**.

  ### What Must Be Added (and Is It Still IRL?)
  To get Elias right, you must move from Inverse Reinforcement Learning to **Inverse Norm Learning** or **Inverse Constraint Learning**. You need to model the agent as optimizing a reward function *subject to* a set of context-sensitive deontic constraints (rules that forbid certain actions regardless of utility).

  **Is it still IRL?** Barely. Standard IRL assumes the agent is maximizing a scalar sum of rewards. If you introduce hard constraints that suspend based on semantic framing, you are no longer inferring a reward function over states; you are inferring a **logic of appropriateness**. The "reward" becomes secondary to the "rule." This shifts the project from learning *what people want* to learning *how people decide what counts as wanting*.
