answer: |-
  **Project Title:** Beyond the Trilemma: Disentangling Statistical Constraints from Normative Limits in Algorithmic Fairness

  **Abstract**
  Impossibility theorems in algorithmic fairness are frequently cited as fundamental barriers to justice, analogous to Arrow's Impossibility Theorem in social choice. These results demonstrate that standard fairness criteria (e.g., calibration and error rate balance) cannot be simultaneously satisfied when base rates differ across groups. While the mathematical derivation of these results is settled, their normative interpretation remains contested. This project argues that the "impossibility" is often an artifact of specific modeling choices—specifically, the conflation of risk scores with decision rules and the restriction on group-aware processing—rather than a deep fact about fairness itself. Over twelve months, I will formally test the robustness of these impossibility results under relaxed architectural assumptions. By decoupling prediction from decision-making and allowing for randomized or group-dependent decision rules, I aim to determine whether the impossibility survives as a normative constraint or dissolves as a modeling artifact.

  **Problem Statement**
  In the last decade, theoretical computer science and philosophy have converged on a set of "impossibility results" showing that multiple desirable fairness properties are mathematically incompatible under conditions of unequal base rates. Consequently, the field has largely accepted a trilemma: practitioners must choose which fairness criterion to violate. This consensus treats the mathematical constraints of a specific predictive pipeline (a single score threshold applied uniformly) as normative limits on fair decision-making.

  However, this interpretation relies on framing choices that are not themselves mandated by fairness norms. First, the impossibility relies on unequal base rates, a contingent fact about the world rather than a structural necessity. Second, and more critically, existing proofs typically assume a "score-and-threshold" architecture where the decision rule is a deterministic function of a risk score, often constrained to be group-blind. It remains an open question whether the impossibility persists if we separate the *assessment* of risk from the *decision* to act, or if we permit decision procedures that explicitly account for protected attributes to correct for statistical disparities.

  Current literature leaves a gap between the settled mathematics (the criteria are incompatible under specific constraints) and the contested philosophy (whether these constraints represent the only valid way to operationalize fairness). Treating a modeling assumption as a normative wall risks prematurely foreclosing viable policy interventions. We need to know if the impossibility is a theorem about *fairness* or a theorem about *single-threshold classifiers*.

  **Research Question**
  Is the fairness impossibility theorem robust to changes in decision architecture? Specifically, does the incompatibility between calibration and error rate balance survive when:
  1.  Risk scores are decoupled from decision rules?
  2.  Decision rules are permitted to be group-dependent (aware)?
  3.  Decision rules are permitted to be randomized?

  If the impossibility dissolves under these conditions, the "wall" is a modeling artifact. If it persists, the impossibility is a more fundamental constraint on fair decision-making under disparity.

  **Methodology**
  This project employs a mixed method of formal modeling and normative case analysis.

  *Phase 1: Formal Relaxation.* I will reconstruct the standard impossibility proofs (e.g., Chouldechova; Kleinberg et al.) in a generalized decision-theoretic framework. I will systematically relax the constraints on the decision function $D$. Instead of $D = \mathbb{I}(Score > t)$, I will model $D = f(Score, Attribute, Randomization)$. I will derive the conditions under which fairness criteria become compatible in this expanded space.

  *Phase 2: Worked Case Studies.* I will apply these relaxed models to three high-stakes domains: pretrial detention, medical triage, and consumer lending. For each, I will construct synthetic populations with unequal base rates. I will attempt to construct decision procedures that satisfy the previously "impossible" conjunction of fairness criteria using the relaxed architecture. This isolates which framing assumption (e.g., group-blindness vs. deterministic thresholds) is doing the work in each domain.

  *Phase 3: Normative Evaluation.* Not all mathematically possible solutions are normatively permissible. For cases where the impossibility is mathematically resolved (e.g., by using group-specific thresholds), I will analyze whether the solution violates other normative commitments (e.g., procedural justice or legal constraints on protected class usage). This distinguishes between *mathematical* impossibility and *normative* impossibility.

  **Timeline**
  *   **Months 1–3:** Literature review and formal reconstruction of existing impossibility proofs. Derivation of the generalized decision framework.
  *   **Months 4–6:** Formal proof development. Establishing necessary and sufficient conditions for compatibility under relaxed assumptions.
  *   **Months 7–9:** Development of case study simulations (Lending, Hiring, Triage). Testing the theoretical bounds against concrete scenarios.
  *   **Months 10–12:** Synthesis of results. Drafting the final manuscript for submission to a joint venue (e.g., FAccT or a philosophy of science journal).

  **Expected Contribution**
  This project will provide a precise map of the "impossibility" landscape. If the impossibility is shown to be fragile, it opens new avenues for policy that separate risk assessment from allocation rules. If it is shown to be robust even under relaxed assumptions, it strengthens the case that unequal base rates themselves are the primary target for intervention, rather than the algorithm. Either way, the project moves the field past the current stalemate where impossibility results are cited as conversation-stoppers rather than modeling diagnostics.

  ***

  ### Advisor's Note & Strategy Check (For Your Eyes Only)

  **1. Scope Assessment: Is this too big for a year?**
  It is **tight but doable**, provided you stay strictly theoretical.
  *   **The Risk:** The "Case Studies" phase (Months 7–9) is the danger zone. If you try to get real data or build complex simulations, you will run out of time.
  *   **The Fix:** Keep the case studies *toy models*. You don't need real loan data; you need synthetic distributions that *look* like loan data. Your contribution is the formal/philosophical argument, not the empirical application. If you find yourself cleaning data in Month 5, cut the case studies down to a single illustrative example.
  *   **Verdict:** Just right for a PhD year, *if* you treat the examples as proofs-of-concept rather than empirical validations.

  **2. Failure Conditions (When to walk away)**
  You asked what would count as the project failing. In a fellowship proposal, you frame negative results as contributions. But for *your* sanity, here is when the project loses its juice:
  *   **The "Trivial Solution" Failure:** If you find that the only way to satisfy the criteria is to use a decision rule that is normatively abhorrent (e.g., "to equalize error rates, we must deny loans to Group A 100% of the time even if they are creditworthy"), then the impossibility effectively stands as a *normative* limit, even if the math works. If *every* mathematical workaround violates a core fairness intuition, you haven't really solved the problem, you've just moved it.
  *   **The "Already Done" Failure:** There is a non-zero chance a paper appeared in FAccT 2023 or 2024 that exactly decouples score and decision in the way you plan. You need to do a quick, aggressive lit check in Month 1. If this specific relaxation is already exhaustively proven, pivot to the *philosophical interpretation* of why the field ignored it.
  *   **The "So What?" Failure:** If you prove the impossibility vanishes when you allow group-dependent thresholds, but everyone already knows that (e.g., in legal contexts where "awareness" is sometimes mandated), the theoretical contribution is weak. You need to ensure the *implication* of that relaxation is novel.

  **3. Tone Check on "Settled vs. Contested"**
  I drafted the proposal to walk the line you requested:
  *   **Settled:** The math holds under the standard assumptions (unequal base rates + specific criteria). I used phrases like "mathematical derivation... is settled."
  *   **Contested:** The interpretation of those constraints as normative limits. I used phrases like "normative interpretation remains contested" and "risks prematurely foreclosing."
  *   **Why this works:** It shows you respect the CS literature (you aren't saying the math is wrong) while carving out space for the Philosophy contribution (the math doesn't dictate the policy).

  **4. Final Polish Tip**
  Since you are sleep-deprived: The proposal above is formatted to be roughly 2 pages single-spaced (approx. 1000-1100 words). When you paste this into your template, check the margins. If you need to cut, trim the "Timeline" section details. If you need to expand, elaborate on the "Normative Evaluation" in the Methodology. Good luck, and try to sleep before Friday.
