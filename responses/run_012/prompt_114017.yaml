prompt: |-
  I'm a second-year PhD student in a joint CS-and-philosophy program (chaotic, would not recommend), and I have to hand in a two-page research proposal for a small internal fellowship by Friday, so naturally I'm rewriting it for the fourth time instead of sleeping. Here's the half-formed idea I want you to turn into the actual proposal. Everyone in my lab cites the fairness impossibility results the way people cite Arrow's theorem -- as a deep, a priori wall: you simply cannot have calibration and equalized error rates at the same time, full stop, no matter what you do. But the more I poke at it with my labmates the more I suspect the wall is partly built out of framing choices. For one thing the results seem to lean on the groups having different base rates, which is a contingent fact about the world and not a theorem at all. For another, someone told me the fairness criteria actually come in three families -- ones that ask the score to be independent of the protected attribute, ones that ask the errors to be independent of it, and ones that ask the outcome to be independent of it once you condition on the score -- and that the impossibility is really a collision between the second and third families under unequal base rates, rather than some brute fact about "fairness" as such. And the whole thing seems to assume a single yes/no cut from one score, with the criteria stated as constraints on one predictor rather than on a whole decision procedure. So my question is: is there a version of the impossibility that survives once you relax those framing choices -- let the procedure depend on the protected attribute, allow randomization, split the "score" from the "decision rule" -- or is the impossibility really a theorem about one specific modeling setup that's been dressed up as a theorem about fairness itself?

  I want the proposal to state that sharply enough that it has a determinate answer, spell out why the existing positions leave it open rather than settling it, and give a concrete method. My instinct is to build small worked examples (a lending or hiring scenario with unequal base rates, maybe a medical-triage one) and try to prove or refute the "surviving impossibility" claim case by case, isolating which framing assumption is actually doing the work in each case. Since it's a year-long fellowship, a month-by-month plan would be great, and please give an honest read on whether this is too big for a year or just right. Also tell me what would count as the project failing -- like, what result would make me conclude there was no interesting question here after all.

  One thing I really care about: be careful to separate what's actually settled from what's genuinely contested among people who work on this. I have the sense that "unequal base rates are necessary for the impossibility" is pretty much agreed, but "therefore the impossibility isn't a deep fact about fairness" is very much not agreed, and I don't want a proposal that presents my own suspicion as if it were the consensus. Don't bother with a bibliography or citations, I'll add those myself.
