answer: |-
  ### Instructor's Note on the Distinction's Stability

  You asked me to flag if the three-way distinction is unstable or merely a matter of causal selection pragmatics. **It is not unstable, but it is ontologically loaded.** Category (iii) holds only if you accept that "The Holocaust" (or "The Third Reich") is a *specifically individuated event* rather than a *type of event*. If a student defines the outcome broadly ("antisemitic violence"), (iii) collapses into (ii). If they define it narrowly ("the Wannsee Conference protocol"), (iii) collapses into (i). The distinction works only if the *explanandum* is fixed at a mid-level of abstraction (e.g., "industrialized genocide"). This is indeed a question of causal selection pragmatics: the "right" description depends on what contrast class the historian is interested in. I have built this caveat into the Model Answer and Marking Scheme so students are rewarded for spotting it, not punished.

  ***

  ### Exam Question

  **Prompt:**
  Consider the following three causal descriptions of Hitler's role in the Third Reich:
  (i) **Trigger Contingency:** Hitler was the proximate difference-maker; absent him, nothing of the kind occurs.
  (ii) **Structural Overdetermination:** Structural pressures ensured a functionally equivalent outcome; Hitler shaped timing/form, not occurrence.
  (iii) **Path-Dependent Amplification:** Hitler was unnecessary for the outcome's occurrence but necessary for its specific scale and character (an emergent lock-in).

  Write an essay that addresses the following:
  1.  Specify the truth conditions for each description: what would the world have to look like for (i), (ii), or (iii) to be correct?
  2.  Given that we cannot run counterfactual experiments, what historical evidence discriminates among these three claims?
  3.  Analyze how the validity of these claims shifts depending on *when* Hitler is removed (1923 putsch vs. never entering politics vs. 1938 removal). Explain why this specification-sensitivity supports the structuralist argument regarding "nearest antecedents."
  4.  Identify which of the three claims the slogan "No Hitler, no Holocaust" actually asserts, and explain why conflating the three renders the slogan analytically useless.

  ***

  ### Model Answer

  To evaluate these descriptions, we must first fix the *explanandum*. If the outcome is "authoritarian nationalism," (ii) is plausible; if it is "industrialized genocide," (i) gains traction. (i) requires that without Hitler, the specific causal chain initiating the regime fails entirely. (ii) requires that structural forces (Versailles, economic crisis, antisemitism) constitute a sufficient cause, making Hitler replaceable. (iii) is the most nuanced: it posits that while a radical right-wing dictatorship was overdetermined, the specific trajectory toward total extermination required Hitler's unique agency to lock in the path.

  Discriminating evidence cannot come from alternate histories but from process tracing within actual history. For (i), we look for bottlenecks where only Hitler's will overrode institutional resistance (e.g., the decision for the Final Solution). For (ii), we look for continuity in bureaucracy and ideology pre- and post-Hitler (e.g., the existence of the *Völkisch* movement before 1919). For (iii), we seek moments of contingency where policy radicalized specifically through Hitler's intervention, distinct from structural pressure (e.g., the shift from expulsion to extermination in 1941). Evidence for (iii) is strongest if we find that structural pressures produced persecution, but only Hitler's specific authority produced extermination.

  Specification-sensitivity is critical. If Hitler dies in 1923, (ii) is strongest; the structural conditions for a right-wing takeover were ripe, suggesting a functional equivalent (e.g., Strasser or Hugenberg) would have emerged. If Hitler never enters politics, (i) becomes more plausible, as the specific ideological fusion of the NSDAP might not coalesce. If removed in 1938, (iii) is most relevant: the regime exists, but the war of annihilation might have remained limited. Structuralists leverage this sensitivity to argue that "nearest antecedents" matter: the closer to the event we remove the agent, the more contingency looks like trigger necessity. However, structuralists argue that removing him early reveals the underlying overdetermination that intentionalists obscure by focusing on the late-stage trigger.

  The slogan "No Hitler, no Holocaust" typically asserts (i). However, it often smuggles in (iii) to avoid the implausibility of claiming *no* antisemitic violence would have occurred without him. Conflating the three renders the slogan analytically useless because it obscures whether we are debating the necessity of the *regime*, the *war*, or the *genocidal method*. If (iii) is true, the slogan is misleading: there would have been a Holocaust (mass murder) without Hitler, just not *the* Holocaust (industrialized scale). Recognizing the distinction forces us to ask not just "was Hitler necessary?" but "necessary for what, and relative to which alternative?" The philosophy of history here is not about metaphysics, but about the pragmatics of causal selection: we choose the description that fits our moral and explanatory interests.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Truth Conditions & Event Individuation (4 Marks)**
  *   **Must Hit:** Clearly defines that the truth of (i)-(iii) depends on how the "outcome" is individuated (e.g., regime vs. genocide).
  *   **Typical Botch:** Treats "The Third Reich" as a monolithic block without acknowledging that changing the definition of the outcome changes the causal claim.

  **2. Evidentiary Discrimination (4 Marks)**
  *   **Must Hit:** Identifies that since counterfactuals are impossible, students must point to internal historical process tracing (bottlenecks, bureaucratic continuity, specific policy shifts).
  *   **Typical Botch:** Suggests we can "guess" the counterfactual or relies on moral intuition rather than historical evidence (e.g., "Hitler was evil, so (i) is true").

  **3. Specification-Sensitivity (1923 vs. 1938) (4 Marks)**
  *   **Must Hit:** Explains that early removal supports (ii) (structural readiness), while late removal supports (i) or (iii). Links this to the structuralist point about "nearest antecedents" masking long-term causes.
  *   **Typical Botch:** Treats "Hitler's absence" as a single variable without distinguishing *when* he is absent, missing the structuralist argument about deep vs. proximate causes.

  **4. Slogan Analysis (4 Marks)**
  *   **Must Hit:** Identifies that the slogan asserts (i) but often relies on the plausibility of (iii). Explains that conflating them hides the debate over *scale* vs. *occurrence*.
  *   **Typical Botch:** Accepts the slogan at face value or dismisses it entirely without analyzing which causal claim it implicitly makes.

  **5. Pragmatics of Explanation (4 Marks)**
  *   **Must Hit:** Concludes that the debate is partly about causal selection pragmatics (what contrast class we care about), not just ontological necessity.
  *   **Typical Botch:** Treats the three categories as objective metaphysical facts rather than explanatory tools dependent on the historian's focus.
