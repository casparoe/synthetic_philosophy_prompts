      *   *Genuine:* Stability, Reduction to EV, Input Handling (must accept the set), Dynamic Consistency (avoiding exploitation).
      *   *Taste:* Ellsberg Consistency (Ambiguity Aversion). Why? Because a coherent Bayesian agent *can* exist who averages. Preferring the known urn is a specific attitude, not a logical necessity for coherence.
