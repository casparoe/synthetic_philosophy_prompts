answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT: THE WRONG KIND OF REASONS PROBLEM

  **Date:** October 26, 2023
  **Participants:** Camp A (Fittingness-First) & Camp B (Skeptics/Reductivists)
  **Facilitator:** [Organizer Name]

  ## 1. POINTS OF AGREEMENT
  *We endorse the following claims as a shared baseline. Where agreement is merely verbal or substantive but trivial, we have noted it.*

  1.  **Existence of Pragmatic Pressures:** We agree that there are cases where an agent has a strong pragmatic, prudential, or moral incentive to hold a specific attitude (belief, admiration, gratitude) that does not obviously stem from the properties of the attitude's object.
  2.  **The FA Vulnerability:** We agree that if the Fitting-Attitude (FA) analysis of value defines "X is good" simply as "There is a reason to favor X," then pragmatic incentives (like threats or bribes) would falsely imply that X is good. Therefore, *some* distinction between reasons is required to save the FA analysis, or the FA analysis must be abandoned.
  3.  **Non-Vacuity of the Problem:** We agree that dismissing the cases as "conceptual confusion" without a positive account of why the reasons differ is insufficient. The problem is not merely linguistic; it bears on the structure of normativity.
  4.  **Involuntarism Constraint:** We agree that attitudes like belief and admiration are not typically under direct voluntary control. Therefore, reasons to hold them cannot always be reasons to *choose* them in the same way reasons to act are.
  5.  **Explanatory Direction:** We agree that a successful theory must explain *why* a reason is of one kind or the other, rather than simply labeling them. A theory that identifies RKRs as "reasons that bear on fittingness" and fittingness as "the property targeted by RKRs" is circular and unacceptable to both sides (though we disagree on whether such circularity is avoidable).

  ## 2. ANALYSIS OF SPECIFIC CASES
  *Per the facilitator's constraint, we must analyze the following three cases. We state our classification of the reason (Right Kind, Wrong Kind, or Unclear) and our prediction about the attitude's normative status.*

  ### Case 1: The Landlord's Novel (Admiration)
  **Scenario:** A landlord offers to forgive next month's rent if the tenant can get themselves to be genuinely moved by his terrible self-published novel.
  *   **Camp A (Fittingness-First):**
      *   **Classification:** Wrong Kind of Reason (WKR).
      *   **Prediction:** The rent forgiveness is a reason to *want* to admire the novel, or to try to cultivate admiration, but it does not make the novel admirable. The correctness condition of admiration (merit based on aesthetic properties) remains unsatisfied.
      *   **Rationale:** The reason bears on the *consequences* of the attitude, not the *object* of the attitude.
  *   **Camp B (Skeptics):**
      *   **Classification:** WKR (but with a caveat).
      *   **Prediction:** This is a reason to bring it about that one admires the novel. If "reason for admiration" is read strictly as "consideration that rationalizes the psychological state," this counts, but it does not imply the novel has value.
      *   **Rationale:** The distinction here is not metaphysical but functional. The reason counts in favor of the *state* of admiring, but we reserve the term "admirable" for object-based reasons to protect the language game of value.

  ### Case 2: The Belief Bonus (Belief)
  **Scenario:** A firm pays a 'belief bonus' to employees who sincerely come to believe the company's mission matters, paid whether or not they can tell they're being bought.
  *   **Camp A (Fittingness-First):**
      *   **Classification:** WKR.
      *   **Prediction:** The bonus makes believing *beneficial*, but not *true* or *fitting*. If the employee believes solely for the bonus, the belief is epistemically improper, even if rational in a prudential sense.
      *   **Rationale:** Belief aims at truth. Money does not bear on truth. Therefore, it cannot be a Right Kind of Reason (RKR) for belief.
  *   **Camp B (Skeptics):**
      *   **Classification:** Unclear / Category Error.
      *   **Prediction:** Since belief is not will-controlled, this is strictly a reason to *act* in ways likely to cause the belief (e.g., repeating affirmations). It is a WKR for the *activity* of belief-formation, not the belief state itself.
      *   **Rationale:** If the distinction collapses, it's because "reasons for belief" is an ambiguous phrase covering both evidence and incentives. We deny incentives rationalize the *content* of the belief.

  ### Case 3: The Therapeutic Gratitude (Gratitude)
  **Scenario:** Someone wants to feel grateful toward a parent who was abusive, because their therapist says the gratitude will help them heal.
  *   **Camp A (Fittingness-First):**
      *   **Classification:** WKR.
      *   **Prediction:** The gratitude is therapeutically useful, but the parent is not fittingly grateful-to. To claim the parent *merits* gratitude because it helps the child is to confuse the goodness of the *effect* with the fittingness of the *response*.
      *   **Rationale:** Gratitude is a response to perceived benevolence/ goodwill. Abuse negates the object's fittingness conditions regardless of the subject's healing.
  *   **Camp B (Skeptics):**
      *   **Classification:** RKR (for a modified attitude) or WKR (for standard gratitude).
      *   **Prediction:** If the attitude is "gratitude-as-therapy," the reason is Right Kind. If the attitude is "gratitude-as-moral-recognition," it is Wrong Kind. The fight is over which attitude is the real target.
      *   **Rationale:** The "fittingness" of an attitude is context-dependent. In a therapeutic context, healing *is* the standard of correctness. The Fittingness-First camp assumes a single, rigid standard of correctness which we deny.

  ## 3. EVALUATION OF THE ORGANIZER'S HYPOTHESIS
  *Hypothesis: "A right-kind reason for an attitude is one that the attitude's own correctness condition could be satisfied by (i.e., if you asked 'yes, but is the attitude correct?' the reason would speak to that question), whereas a wrong-kind reason leaves that question exactly where it was."*

  *   **Joint Assessment:**
      *   **Camp A:** We accept this as a useful heuristic that captures the intuition behind the "Object-Given" vs. "State-Given" distinction. It sharpens the distinction by tying it to the internal norms of the attitude. **However**, we worry it is incomplete without a metaphysical account of *what* determines the correctness condition.
      *   **Camp B:** We reject this as question-begging. It defines RKRs in terms of "correctness conditions," but "correctness conditions" are just defined as "that which RKRs bear on." In the Therapeutic Gratitude case, the hypothesis fails because the correctness condition *shifts* based on the reason. If the reason (healing) changes the goal of the attitude, it becomes an RKR by this definition, which collapses the distinction.
      *   **Verdict:** The hypothesis clarifies the *role* of RKRs but fails to provide a non-circular *criterion* for identifying them independent of the intuition it tries to explain.

  ## 4. DISAGREEMENTS TABLE
  *Remaining substantive disagreements stated in neutral wording.*

  | ID | Disagreement | Camp A (Fittingness-First) Stance | Camp B (Skeptics) Stance |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Source of the Distinction** | The distinction is grounded in the metaphysics of the attitude's object (e.g., truth for belief, merit for admiration). | The distinction is grounded in the functional role the reason plays in practical deliberation (e.g., motivating action vs. rationalizing content). |
  | **D2** | **Reducibility** | WKRs cannot be reduced to RKRs for other attitudes (like wanting) without loss of explanatory power regarding the original attitude. | WKRs are best understood as RKRs for *other* attitudes (wanting, trying, hoping) or for actions, not the attitude itself. |
  | **D3** | **Necessity for Value Theory** | The FA analysis of value *fails* without a principled RK/WK distinction. | The FA analysis can be saved by abandoning the strict link between "reasons to favor" and "value," or by accepting a pluralism about reasons. |

  ## 5. CRUXES AND PREDICTIONS
  *Sub-questions such that settling one would move at least one side. We specify an agreed test and record predictions.*

  ### Crux 1: The Independence of Correctness Conditions
  *   **Question:** Can the "correctness condition" of an attitude (e.g., truth for belief) be defined independently of the reasons we intuitively classify as "Right Kind"?
  *   **Agreed Test:** Attempt to define "fitting admiration" without using the phrase "reasons that count in favor of admiration."
  *   **Prediction (Camp A):** Yes. We can define it via the object's properties (e.g., excellence, virtue).
  *   **Prediction (Camp B):** No. Any definition will either be too broad (including WKRs) or circular (referencing RKRs).
  *   **Resolution Condition:** If Camp B can produce a non-circular definition of fittingness, Camp A will concede the distinction is secure. If Camp A fails to define fittingness independently, Camp B will concede the distinction is unstable.

  ### Crux 2: The "Wrong Kind" of Explanation
  *   **Question:** Does treating a WKR as a reason for the attitude itself lead to normative error, or merely linguistic awkwardness?
  *   **Agreed Test:** The "Demon World" scenario. A demon threatens to kill everyone unless you admire a saucer of mud.
  *   **Prediction (Camp A):** It is a normative error to say the mud is admirable. The distinction tracks a real normative boundary.
  *   **Prediction (Camp B):** It is only linguistic awkwardness. The mud is "admirable*" (where * denotes the pragmatic sense). The distinction is a pragmatic feature of language, not normativity.
  *   **Resolution Condition:** If it can be shown that acting on the WKR *qua* RKR leads to irrationality (not just false value claims), Camp A wins. If it leads only to true beliefs about value being impossible, Camp B wins.

  ### Crux 3: The Therapeutic Exception
  *   **Question:** In the Therapeutic Gratitude case, does the benefit (healing) make the gratitude *fitting*, or merely *wise*?
  *   **Agreed Test:** Introspective judgment on whether the parent *deserves* the gratitude in the therapy scenario.
  *   **Prediction (Camp A):** It is wise, not fitting. The parent does not deserve it.
  *   **Prediction (Camp B):** "Fitting" is the wrong word. The attitude is *appropriate* for the context. The RK/WK distinction breaks down because context determines the standard.
  *   **Resolution Condition:** If Camp A admits that "fittingness" is context-sensitive, the distinction blurs. If Camp B admits there is a core sense of "fitting" that remains unsatisfied, the distinction holds.

  ## 6. VERBAL DISPUTE ANALYSIS
  *Is part of this fight merely semantic?*

  *   **Identified Verbal Component:** We agree that approximately 40% of the disagreement stems from the use of the phrase "Reason for [Attitude]."
      *   **Camp A** uses this to mean "Consideration that rationalizes the *content* of the attitude."
      *   **Camp B** uses this to mean "Consideration that makes it rational to *be in the state* of having the attitude."
  *   **Residual Substantive Dispute:** Once this terminology is standardized (e.g., distinguishing "Content-Rationalizing Reasons" from "State-Rationalizing Reasons"), a significant disagreement remains:
      *   **Metaphysical:** Does the existence of State-Rationalizing Reasons threaten the FA analysis of value? Camp A says yes (it generates false positives for value). Camp B says no (we can filter them out without a deep metaphysical distinction, perhaps via a 'basing requirement').
      *   **Explanatory:** Is the "Content/State" distinction itself principled, or is it just a restatement of the RKR/WKR intuition? Camp A believes it maps onto the Object/State distinction. Camp B believes the mapping is leaky (as seen in the Therapeutic Gratitude case).

  ## 7. SIGNATURES

  _________________________ (Camp A Representative)

  _________________________ (Camp B Representative)

  _________________________ (Facilitator)
