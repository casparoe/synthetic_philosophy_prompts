prompt: |-
  Ok so I'm putting together an adversarial-collaboration doc for a reading group I run, and I want you to draft the actual joint statement. Topic is the wrong kind of reasons problem — you know, the thing where there can apparently be reasons to have an attitude (believe something, admire someone, be afraid of something) that dont bear on whether the attitude is correct or fitting, only on whether it's good or useful to have it. Two people in my group have been going at each other for months and I want to force them to write down what they actually agree on.

  The two camps are: (A) the fittingness-first crowd, who think there's a real and principled right-kind / wrong-kind distinction — a reason of the right kind bears on whether the attitude meets its own standard of correctness, a wrong-kind reason bears only on the payoff of having the attitude — and that the fitting-attitude approach to value needs this distinction to work at all. (B) the skeptics, who think the distinction is ad hoc, circular, or just collapses when you look closely — that so-called wrong-kind reasons are really just reasons for some other attitude (wanting to have it, wanting to be the sort of person who has it, taking steps to acquire it), and that 'right kind' never gets a non-question-begging explanation.

  What I want the document to contain: a numbered list of claims both sides can sign (including about the cases themselves — what's actually going on, what isn't in dispute, whether either side's machinery is even explaining anything here), then a disagreements table where each remaining disagreement is stated in wording each side would accept for its own view, then the cruxes — the sub-questions such that settling one would move at least one side — and for each crux a case or argument that both sides agree bears on it, with each side's prediction written down in advance.

  To stop them just recycling the standard cases, I've told them they have to use these three, which came up in group and which nobody seems to have a canned answer to:

  - your landlord offers to forgive next month's rent if you can get yourself to be genuinely moved by his terrible self-published novel (admiration / the aesthetic case);
  - a firm pays a 'belief bonus' to employees who sincerely come to believe the company's mission matters, paid whether or not they can tell they're being bought (belief);
  - someone wants to feel grateful toward a parent who was abusive, because their therapist says the gratitude will help them heal (gratitude).

  For each, I want both camps to say what they predict about it, whether it's right-kind, wrong-kind or genuinely unclear, and why.

  One more thing to put in there: my own half-baked idea, which they should either build on or shoot down with reasons. I think the whole distinction is really about what standard a reason gets answered by — a right-kind reason for an attitude is one that the attitude's own correctness condition could be satisfied by, i.e. if you asked 'yes, but is the attitude correct?' the reason would speak to that question, whereas a wrong-kind reason leaves that question exactly where it was. I want them to test that against the three cases and say whether it sharpens the distinction or just restates it in fancier words. Also I suspect at least part of their fight is verbal — if so, say which part and why, and whats left over once the verbal part is set aside.

  Dont worry about references or who said what, we'll add those ourselves. And dont be diplomatic for its own sake — if some claim both sides 'agree' on turns out to be vacuous, say so.
