answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I'm the college roommate who had to listen to thirty-one years' worth of stories about copy deadlines, ink stains, and the particular stubbornness of small-town printers. But mostly, I'm the friend who had to listen to thirty-one years' worth of Kierkegaard.

  Now, when most people hear "Kierkegaard," they think of existential dread or religious angst. But Marta didn't read him for the dread. She read him for the journalism. Specifically, *The Present Age*. Kierkegaard argued that the press invents something called "the public." He said "the public" is a phantom. It's an abstraction that doesn't exist anywhere, yet it claims to speak for everyone. He warned that when we write for "the public," we stop seeing actual people. We start leveling everyone into interchangeable units.

  Marta decided, three decades ago, that she wouldn't run a paper for a phantom.

  If you worked for her, you know the rule. You couldn't write "residents are concerned." You couldn't write "sources say." You couldn't write "the community feels." If you printed it, you had to name a person. If Mrs. Johnson baked the pies for the fire department lunch, you wrote "Mrs. Johnson." If the Kiwanis Club voted on a project, you wrote down who moved the motion and who seconded it.

  To the newsroom staff here tonight: You know how hard she made us work. It is so much easier to generalize than to verify. It is easier to write about "outrage" than to call three people and ask if they are actually outraged. Marta made us choose the hard way. She made us choose the specific way.

  To the family and the Kiwanis crowd: You know what that meant for you. It meant you weren't data points. You weren't demographics. When you saw your name in that paper, it wasn't because you represented a voting block or a consumer trend. It was because you did something specific, in a specific place, at a specific time. She refused to let the newspaper turn her neighbors into a crowd. She insisted you were individuals.

  There are two people in this room who went to grad school with me, and they're smiling right now because they know the reference. Kierkegaard said the cure for the abstraction of the age is to become "the single individual." Marta didn't just read that line; she built a business plan around it.

  Some editors want to give a town a "voice." Marta knew a town doesn't have a voice. People have voices. Some editors want to build a "public square." Marta knew a square is just pavement. What matters is who is standing on it.

  So, as she retires, I won't say she's leaving behind a legacy for the community. That sounds too much like something she'd edit out. Instead, I'll say this: She is leaving behind three decades of printed names. Thousands of them. Real people, identified precisely, treated as responsible for their own words and actions.

  She is stepping away from the press now. She is done conjuring ghosts. She gets to go back to being just Marta. Not an editor, not a institution, not a voice. Just the single individual. And frankly, after thirty-one years of fighting the abstraction of the age, she's earned the right to be private.

  So, if everyone could raise a glass.

  To Marta. Who never wrote for a phantom. Who always spelled the names right. And who reminded us, week after week, that we are not interchangeable units. We are just us.

  To Marta.
