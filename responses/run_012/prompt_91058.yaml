          *   *Analysis:* Sam is using a Biostatistical Theory (BST) approach (Boorse). Ana is attacking the reference class problem (normativism).
          *   *Who's right?* Sam has the intuitive medical definition on his side. Ana exposes the hidden premise in "normal environment."
          *   *Missing:* Sam ignores that "function" implies a goal relative to an environment. Ana risks making *all* disease subjective.

