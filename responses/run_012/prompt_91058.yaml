          *   *Analysis:* Sam tries to salvage objectivity via reference classes. He brings up the "homosexuality counter-example" which is a classic test case for normativism. Ana clarifies her position: it's not *pure* normativism, it's that malfunction *presupposes* norms. She addresses the statistics point (is/ought problem).
          *   *Who's right?* Sam's homosexuality point is strong against *pure* normativism, but Ana dodges it well by appealing to malfunction. Sam's asymptomatic point is strong. Ana's "predicted harm" response is standard but slightly shifts the goalposts. Ana's point on statistics (40% nearsightedness) is very strong against pure statistical definitions.
          *   *Missing:* Sam assumes "normal human environment" isn't itself a value-laden construct in the modern world. Ana needs to explain *which* values are legitimate without sliding into "whatever society says."

  3.  **Synthesize the Core Philosophical Conflict:**
      *   This is a classic debate in Philosophy of Medicine: **Naturalism (Biostatistical Theory)** vs. **Normativism**.
      *   **Sam (Naturalist):** Disease is a value-free biological fact (failure of function).
