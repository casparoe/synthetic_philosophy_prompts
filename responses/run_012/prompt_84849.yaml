answer: |-
  ### What I'm actually deciding

  You are distinguishing between *risk* and *ambiguity*. Risk is when you know the distribution of outcomes—you know the die is loaded, even if it's loaded against you. You can price this. Ambiguity is when you don't know the shape of the die, or even if it has six sides. This isn't just a difference in confidence levels. Confidence is a feeling about your judgment; risk versus ambiguity is a fact about the information available.

  When you reject a risk because the odds are bad, you are protecting capital from expected loss. When you reject a risk because the odds are unknown, you are protecting capital from model error. The first is a calculation; the second is a judgment on the validity of the calculation itself. Confusing them leads to rejecting profitable business because it feels new, or accepting dangerous business because the spreadsheet looks clean. This procedure forces you to label the source of your discomfort before you act.

  ### The procedure

  **1. Define the Loss Mechanism**
  *   **Question:** Exactly how does the money leave the mutual?
  *   **Answer:** A single sentence describing the physical or legal event (e.g., "Battery thermal runaway ignites cladding").
  *   **If you can't answer:** Stop. Do not price. Request engineering or legal review. This is not ambiguity; this is incomplete submission.
  *   **Handoff:** If the mechanism involves systemic contagion (one fire takes out the whole block), hand to the Board.

  **2. The Analogue Search (Risk Check)**
  *   **Question:** What historical data exists for this specific mechanism?
  *   **Answer:** List three comparable exposures with loss histories. If none exist, list the nearest adjacent industry data.
  *   **If you can't answer:** Mark this as "High Ambiguity." You are now operating in the unknown urn.
  *   **Action:** If you have data, calculate a baseline loss rate. This is your *Risk* number.

  **3. The Ignorance Audit (Ambiguity Check)**
  *   **Question:** What specific variables could make the baseline loss rate wrong by a factor of ten?
  *   **Answer:** List variables where you have zero information (e.g., "Quality control of battery cells varies by batch," "Dock anchoring soil composition unknown").
  *   **If you can't answer:** You are likely suffering from overconfidence. Assume there is one unknown variable you haven't found.
  *   **Action:** Count the variables. One or two unknowns is manageable. More than three is "Unquantifiable Ambiguity."

  **4. Price the Gap**
  *   **Question:** Does the premium cover the Risk plus a loading for the Ambiguity?
  *   **Answer:** Yes/No.
  *   **Rule:** For High Ambiguity, the premium must cover the worst-case scenario of the known Risk, plus 50% margin. For Unquantifiable Ambiguity, no premium is sufficient.
  *   **If you can't answer:** You are hiding behind pricing. Default to "No."

  **5. The Pre-Mortem**
  *   **Question:** If this loss happens in year one, what will the file say about why we wrote it?
  *   **Answer:** Write the justification paragraph now.
  *   **If the justification relies on "We assumed...":** Hand to the Risk Committee. You are betting on assumptions, not data.
  *   **If the justification relies on "We verified...":** You may proceed to decision.

  **6. The Decision Matrix**
  *   **Low Risk / Low Ambiguity:** Underwriter decides. Write.
  *   **High Risk / Low Ambiguity:** Underwriter decides. Decline or Price Hard.
  *   **Low Risk / High Ambiguity:** Underwriter recommends, Board approves. (This is where you usually say no; force a second opinion).
  *   **High Risk / High Ambiguity:** Automatic Decline.

  **7. Documentation**
  *   **Action:** Paste the answers from Steps 1–5 into the file.
  *   **Requirement:** Explicitly state: "This decision is driven by [Risk/Ambiguity]."
  *   **Handoff:** Any decision driven primarily by Ambiguity must be signed off by the Committee Chair to distribute the responsibility for the unknown.

  ### When 'just call it 50/50' is fine

  Treating an unknown as a coin flip is only permissible when the error cost is symmetrical and immaterial. If overestimating the risk costs you the business, and underestimating it costs you the same amount in claims, and that amount is less than 1% of surplus, you can flip the coin. This is also fine when the ambiguity is diversifiable—if you write fifty of these unique risks, the law of large numbers may rescue you.

  It is hiding when the downside is uncapped or existential. You cannot call a potential fire trap a 50/50 chance if the fire takes out the building. It is also hiding when you refuse to look for the data required in Step 2. Assuming equality of probability is a tool for managing minor friction, not a shield for structural ignorance. If the stakes threaten solvency, ambiguity is not a coin flip; it is a stop sign.

  ### Three submissions run through it

  **1. E-bike Battery Fires (Apartment Blocks)**
  *   **Mechanism:** Thermal runaway ignites structure.
  *   **Analogue:** Lithium-ion storage data exists, but residential mixing data is sparse. (High Ambiguity).
  *   **Ignorance:** Battery origin, charging habits, suppression systems. (Three unknowns).
  *   **Result:** Unquantifiable Ambiguity. Premium cannot cover worst-case structural loss.
  *   **Decision:** Decline. The file reads: "Rejected due to Ambiguity on charging variables, not just frequency."

  **2. Marina Floating Dock (New Design)**
  *   **Mechanism:** Storm damage causing sinkage/collision.
  *   **Analogue:** Standard dock data exists. Engineering certs provided. (Low Ambiguity).
  *   **Ignorance:** Specific storm surge interaction. (One unknown).
  *   **Result:** High Risk (storms are bad), Low Ambiguity (physics is known).
  *   **Decision:** Price Hard. The file reads: "Accepted based on Risk pricing. Ambiguity low due to engineering certs."

  **3. Drone Spraying Outfit (The Hard Yes)**
  *   **Mechanism:** Drone drift causes crop damage/liability.
  *   **Analogue:** Aerial crop dusting history is extensive. Drone failure rates are logged. (Low Ambiguity).
  *   **Ignorance:** Pilot error frequency. (One unknown, but mitigated by licensing).
  *   **Result:** Low Risk, Low Ambiguity.
  *   **Decision:** Write.
  *   **Resistance:** You feel uneasy because drones are "new." The procedure forces you to acknowledge the data exists (aerial dusting) and the ambiguity is low. Your discomfort is recency bias, not ambiguity. The file must state: "Underwriter discomfort noted as psychological, not structural."

  ### Where the procedure stops and I have to decide

  This procedure separates facts from feelings, but it cannot set your appetite. When the matrix says "Board Approves," you still have to recommend yes or no. That choice depends on the mutual's purpose. Are we here to maximize surplus or to serve the community?

  If the business is ambiguous but a local farm needs it to operate, writing it might be a mission decision, not a risk decision. Conversely, if the business is clear risk but threatens concentration limits, declining it is a capital decision. The procedure tells you *what* you are facing; you must decide *how much* of it you can swallow. That is the fiduciary duty that no checklist can absorb. You own the signature.

  ### What this can't do

  This cannot eliminate the Ellsberg Paradox. In a single-shot decision like underwriting, ambiguity aversion is not necessarily a mistake. Unlike a gambler playing infinite hands, you cannot rely on the long run to smooth out unknown distributions. Avoiding the "unknown urn" is often rational for solvency.

  This procedure also cannot predict black swans—unknown unknowns that don't appear in the Ignorance Audit. It protects against negligence, not prophecy. Finally, it cannot fix a culture that punishes wrong answers. If the Board blames you for a loss on a "Low Ambiguity" file, you will revert to saying no to everything. The tool works only if the organization respects the distinction between bad luck and bad judgment.
