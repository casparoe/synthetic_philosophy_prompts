answer: |-
  This is an exceptionally sharp analysis for a high school independent study. You have correctly identified the legal mechanics (the *Board of Health* vs. *City Council* distinction), the behavioral mechanics (friction vs. information), and the political optics (the "ban" narrative). You are also right to be skeptical of your friend's "nudge vs. ban" simplification.

  Here is an analysis of the Soda Cap and the Sodium Warning through the literature of paternalism and choice architecture, followed by an honest assessment of where that theory fails to explain what actually happened.

  ### 1. Mapping the Theory: Nudge, Mandate, and Architecture

  To map these rules, we need to use the framework established by Thaler and Sunstein in *Nudge* (Libertarian Paternalism) and the subsequent philosophical critiques (like those by Sarah Conly or Daniel Hausman).

  **The Sodium Warning: Classic Soft Paternalism**
  *   **Classification:** This is a textbook **nudge**. It alters the "choice architecture" by making information salient without changing the economic cost or physical availability of the food.
  *   **Theoretical Justification:** It relies on the idea of "bounded rationality." People *want* to be healthy but lack information or attention. The salt icon corrects an information asymmetry.
  *   **Coercion Level:** Theoretically zero. You can still eat the salty food; you just have to do it with the knowledge that it is salty.
  *   **Your Question:** *Is a warning engineered to be scary a tiny piece of coercion?*
      *   **Theory says:** No, because coercion requires removing an option or attaching a penalty.
      *   **Reality says:** It borders on **psychological coercion**. If the icon is designed to trigger disgust or shame (which public health icons often are), it bypasses rational deliberation and targets emotion. However, in legal and philosophical terms, this is still "soft" because the choice remains formally intact.

  **The Soda Cap: A "Friction" Mandate**
  *   **Classification:** This is the tricky one. It is **not** a ban (you can drink 32 ounces), but it is **not** a pure nudge (it imposes a transaction cost). In behavioral economics, this is often called adding **friction**.
  *   **Theoretical Justification:** It relies on "status quo bias" and "inertia." Most people buy the default large size because it's easy. By making the large size require two transactions (or two cups), the policy bets that laziness will override thirst.
  *   **Container vs. Substance:** You asked if targeting the container matters. Theoretically, **yes**. Targeting the *substance* (banning sugar) is hard paternalism. Targeting the *container* is an attempt to remain "libertarian" (you can still have the sugar) while manipulating the *method* of acquisition.
  *   **Transparency:** You argued the cap is more transparent than an invisible default. The theory agrees. A cup size limit is visible; a default option on a website is often hidden. Paradoxically, the *more transparent* intervention sparked the *more violent* backlash.

  ### 2. Where the Categories Break

  This is the most important part of your study. The literature on paternalism assumes the debate is about **Liberty vs. Welfare**. The actual history of these two rules shows the debate was about **Authority vs. Consistency**.

  **Break #1: The Legal Rationale (Separation of Powers)**
  The paternalism literature is almost entirely silent on *who* gets to nudge. Thaler and Sunstein discuss *whether* we should nudge, not *which branch of government* has the authority to do it.
  *   **The Soda Cap Failure:** The NY Court of Appeals did not strike down the soda cap because it was "too paternalistic." They struck it down because the Board of Health created a new "law" without the City Council. In NY administrative law, the Board can regulate existing health threats (like tuberculosis), but it cannot create new public policy (like redefining portion sizes).
  *   **The Sodium Success:** The court upheld the sodium rule because it was framed as **disclosure**, which falls under the Board's existing authority to require restaurants to post nutritional info.
  *   **The Theory Gap:** The nudge/mandate distinction predicts the Soda Cap would fail because it restricts liberty more than the Sodium rule. But the *legal* reason it failed was procedural. The theory explains the *design*, but it cannot explain the *demise*.

  **Break #2: The "Arbitrary and Capricious" Standard**
  You noted the inconsistency: theaters can't sell 20oz, but 7-Eleven can.
  *   **The Theory:** Behavioral economics doesn't care about consistency across vendors. If the goal is to reduce consumption in theaters, a theater-only cap works.
  *   **The Law:** Administrative law *hates* arbitrariness. If the health threat is sugar, exempting 7-Eleven undermines the logic that sugar is the threat. The judge ruled the rule was "arbitrary and capricious" because the exemptions contradicted the stated health goal.
  *   **The Break:** This shows that **logical coherence matters more than behavioral efficacy** in court. A "nudge" that works but is logically inconsistent is legally vulnerable. A "nudge" that is logically consistent (sodium is bad -> label sodium) survives.

  **Break #3: Perception of Liberty**
  You asked why the soda cap was treated like a "ban" when it wasn't.
  *   **The Theory:** Libertarian paternalism assumes people care about the *set of options* available. If the option set is {16oz, 32oz via two cups}, liberty is preserved.
  *   **The Reality:** People care about **dignity and symbolism**. Being told you cannot hold a specific object (a 32oz cup) feels like a violation of bodily autonomy in a way that seeing a salt icon does not.
  *   **The Break:** The theory underestimates the **symbolic weight of constraints**. A "friction" nudge that feels like a scolding is politically deadlier than a "warning" nudge that feels like helpful data. The theory assumes we are rational calculators of freedom; politics shows we are emotional defenders of status.

  ### 3. The Equity Objection: Is it Separate from Paternalism?

  You asked: *If the objection is that it hits poor families harder, is that a separate kind of objection than paternalism?*

  **Yes, it is distinct, and the standard paternalism literature often ignores it.**

  *   **Paternalism** asks: "Is the state justified in interfering with individual choice for the individual's own good?"
  *   **Distributive Justice** asks: "Who bears the cost of that interference?"

  Most philosophical defenses of nudging (like Sunstein's) assume a "representative agent." They imagine a generic person being nudged. They often fail to account for **regressive nudges**.
  *   **The Soda Cap:** Buying two 16oz cups is often more expensive than one 32oz cup (due to cup costs or pricing tiers). It also imposes a "time tax" (getting a refill). This burden falls heavier on low-income consumers who are more price-sensitive and time-constrained.
  *   **The Civil Rights Argument:** Groups like the NAACP opposed the ban not because they loved soda, but because they viewed it as a **class-based restriction**. Wealthy people can buy a juicer or go to a sit-down restaurant (exempted); poor people rely on fast food and bodegas.

  **Where the Theory is Silent:**
  Standard paternalism theory treats the "cost" of a nudge as a neutral friction. It does not have a robust framework for analyzing **who pays the friction cost**. If a nudge preserves freedom of choice but makes that choice significantly more expensive for the poor, is it still "libertarian"? The theory struggles to answer this. It suggests that the objection wasn't just "The state is protecting me from myself," but "The state is protecting *me* from myself by taxing *my* community."

  ### 4. Synthesis: What the Contrast Shows

  To answer your core question: **Does the contrast confirm that people care about means rather than ends, or that the nudge/mandate line is doing less work than separation-of-powers arguments?**

  It is the latter. The nudge/mandate distinction is doing very little work in the real world compared to **administrative authority** and **political consistency**.

  1.  **Means vs. Ends:** The courts did not rule on the *ends* (public health is good). They ruled on the *means* (the Board of Health cannot legislate). This confirms that in a constitutional system, **procedure trumps philosophy**. You can have the most philosophically sound "nudge," but if the wrong agency signs it, it dies.
  2.  **The "Nudge" Label is Politically Fragile:** The Soda Cap was technically a "structural nudge" (preserving choice via friction). But because it was *visible* and *inconvenient*, it was politically categorized as a "ban." The Sodium Warning was categorized as "information." This suggests that the **public definition of a nudge** depends on how much *annoyance* it causes, not on whether it technically removes an option.
  3.  **Theory's Blind Spot:** The paternalism literature is great at designing policies but terrible at predicting their **legitimacy**. It assumes that if you preserve choice, you preserve legitimacy. The NYC Soda Cap proves that preserving choice is not enough. You also need:
      *   **Legal Authority:** (The right agency).
      *   **Logical Consistency:** (No 7-Eleven loopholes).
      *   **Equitable Distribution:** (Not punishing the poor).

  ### Conclusion for Your Study

  If I were grading this independent study, I would tell you this: You have correctly identified that the "Nudge vs. Ban" framework is insufficient to explain real-world policy outcomes.

  *   **The Theory explains:** Why the Board of Health *designed* the rules the way they did (trying to balance health goals with choice preservation).
  *   **The Theory fails to explain:** Why one rule survived and the other died. That was determined by administrative law (who has the power) and political economy (who bears the cost).

  The "Nanny State" debate was indeed a sideshow. The real fight was about **who governs**. The Soda Cap died not because New Yorkers love their 32-ounce sodas more than they hate salt icons, but because the Board of Health tried to act like the City Council. The paternalism literature talks about the relationship between the State and the Citizen. But the NYC Soda War was actually about the relationship between the Board and the Council.

  Your intuition is correct: The objection wasn't just about paternalism. It was about **arbitrary power**. When the state protects you from yourself in a way that feels inconsistent (theater vs. 7-Eleven) or unfair (poor vs. rich), the "preservation of choice" argument doesn't save it. The theory assumes a benevolent, consistent nudger. Reality gave us a messy, constrained bureaucracy. That is where the theory breaks.
