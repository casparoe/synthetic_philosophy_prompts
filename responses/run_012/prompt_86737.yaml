          *   Classify Soda: Hybrid. It's a "mandate with an out." It restricts the *means* of consumption.
          *   Address the Container vs. Substance point. Targeting the container is a specific type of choice architecture (friction).
      *   *Section 2: Where the Theory Breaks (The Messy Part).*
          *   *The Legal Rationale:* The courts didn't care about Thaler/Sunstein. They cared about the NY City Charter. The "Separation of Powers" argument swamps the "Paternalism" argument. Theory is silent on administrative procedure.
          *   *The "Arbitrary" Line:* The judge hated the exemptions. Nudge theory doesn't explain why exempting 7-Eleven makes the theater cap invalid. That's a legal consistency issue, not a behavioral one.
          *   *Perception vs. Reality:* The user noted it was treated like a ban. Theory assumes rational actors perceive constraints accurately. Politics does not. The *symbolism* of the cup mattered more than the *mechanics*.
      *   *Section 3: The Equity Objection.*
