  ### 1. The Tree

  **Node 1:** You say your credence is [0.3, 0.7]. What is this interval?
  *   **It's a mistake; I really have a number but feel ignorant.** → *Leaf: Eliminativist about the interval.*
  *   **It's a real feature of my state.** → Go to Node 2.

  **Node 2 (Case: Unreliable Source):** A shaky source claims event *E* happened. Do you lower your confidence (single number) or widen your interval?
  *   **Lower confidence (discounting).** → Go to Node 3.
  *   **Widen the interval.** → Go to Node 4.

  **Node 3 (Case: Symmetry Coin):** A coin has unknown bias, no evidence. Does symmetry force credence 0.5 or [0,1]?
  *   **0.5 (Principle of Indifference).** → *Leaf: Plain subjective Bayesian with a single credence.*
  *   **[0,1] (Ignorance is wide).** → Go to Node 5.

  **Node 5:** Is this interval reducible to a probability distribution over precise values?
  *   **Yes (I have a distribution over my credences).** → *Leaf: The second-order view where you have a probability distribution over probabilities.*
  *   **No (The imprecision is irreducible).** → Go to Node 6.

  **Node 6 (Case: Experts):** Three experts trustworthily report 0.2, 0.5, 0.8. Do you average them or keep the range?
  *   **Average them.** → *Leaf: Plain subjective Bayesian with a single credence.*
  *   **Keep the range.** → Go to Node 7.

  **Node 7:** Do you need numbers at all, or just comparisons?
  *   **Just comparisons ("A is more likely than B").** → *Leaf: A purely comparative/ordinal view where all you ever have is "more likely than".*
  *   **I need numbers.** → Go to Node 8.

  **Node 8:** Do you assign probability mass directly to sets of outcomes?
  *   **Yes (Mass on sets, not just points).** → *Leaf: Belief-function views that put mass on sets rather than points.*
  *   **No (Mass on points).** → Go to Node 9.

  **Node 9 (Case: Dilation):** Urn: 30 Red, 60 Black/White (unknown mix). You bet on Black [0, 2/3]. Referee flips coin: Heads says "Not White", Tails says "Not Red". Does learning the truth ever widen your interval for Black?
  *   **Yes (Learning can increase ignorance).** → Go to Node 10.
  *   **No (Learning must sharpen).** → *Leaf: Plain subjective Bayesian with a single credence.*

  **Node 10:** Does your set of probabilities have to be convex?
  *   **No.** → *Leaf: Credal-set view with a convex set.* (Note: Non-convex sets usually convexified).
  *   **Yes.** → Go to Node 11.

  **Node 11:** Two options your set can't rank. Are both rationally permissible?
  *   **Yes (Rationality allows indeterminacy).** → *Leaf: Maximality / E-admissibility.*
  *   **No (I must choose one).** → Go to Node 12.

  **Node 12:** Do you choose by the worst-case scenario?
  *   **Yes (Prepare for the worst).** → *Leaf: Worst-case maximin.*
  *   **No.** → Go to Node 13.

  **Node 13:** Do you use a weighted mix of best and worst cases?
  *   **Yes (Optimism/Pessimism weight).** → *Leaf: The weighted best-worst (Hurwicz-style) rule.*
  *   **No.** → Go to Node 14.

  **Node 14:** Do you minimize how much you'd regret being wrong?
  *   **Yes (Minimize future embarrassment).** → *Leaf: Minimax regret.*
  *   **No (Reject only clearly beaten options).** → *Leaf: Interval dominance.*

  ### 2. The Leaves

  *   **Eliminativist:** You think precision is mandatory and ignorance is a sin to be hidden.
  *   **Plain Bayesian:** You think you always have a price, even when you're guessing.
  *   **Second-order:** You treat your own mind as a black box you can probabilize.
  *   **Comparative:** You refuse to quantify what everyone else bets on.
  *   **Belief-function:** You bet on sets because points feel too sharp.
  *   **Credal-set:** You carry a set of probabilities but no rule to use them.
  *   **Maximality:** You accept paralysis when your models disagree.
  *   **Maximin:** You prepare for the apocalypse every time you choose.
  *   **Hurwicz:** You arbitrate between hope and fear with a fixed weight.
  *   **Minimax Regret:** You choose to minimize future embarrassment.
  *   **Interval Dominance:** You reject options only when clearly beaten.

  ### 3. Empty Branches

  Some combinations attract no one. **Non-convex Credal Sets + Maximin** is empty because maximin naturally convexifies the set (the worst case of a mixture is better than the worst case of the parts), making non-convexity useless for this rule. **Comparative Views + Minimax Regret** is incoherent; regret calculations require cardinal numbers to measure the "distance" between outcomes, which comparative views explicitly reject. **Belief Functions + Second-order** is rarely occupied because belief functions are usually proposed as an alternative to hierarchical probabilities, not a complement; users typically want to avoid the regress of "probabilities over probabilities." Finally, **Eliminativist + Dilation Acceptance** is impossible; if intervals are just ignorance, learning truth cannot increase them.

  ### 4. What the Tree Can't Split

  **Credal-set view** and **Maximality** often land in the same leaf. Many who hold a convex credal set adopt maximality as their default decision rule, making the representation and rule indistinguishable here. To separate them, you would need to ask: "If forced to bet, do you pick randomly from the permissible set, or do you refuse to bet?" **Plain Bayesian** and **Second-order** also collapse if the second-order distribution is sharply peaked. Separating them requires asking: "Is your single number a summary of a distribution, or a primitive fact?" **Interval Dominance** and **Maximality** are also close; distinguishing them requires a case where an option is undominated but not maximal.
