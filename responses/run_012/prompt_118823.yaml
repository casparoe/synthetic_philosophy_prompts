answer: |-
  ### 1. Essay Question (50 Minutes, 20 Marks)

  **Prompt:**
  Consider a woman gestating a donated embryo. She selected it deliberately, shares no genetics with it, and signed a contract agreeing to the implantation, though she retains the physical power to abort. Compare her moral position to (a) a woman pregnant via rape, and (b) a woman pregnant via consensual sex without contraception who now regrets it.

  Using these three cases, argue whether Judith Jarvis Thomson's defense of abortion ultimately rests on **bodily autonomy** or on the **absence of prior agreement/responsibility**. If it rests on the latter, explain whether this allows the pro-life position to succeed simply by establishing that the fetus is not a "stranger" to the woman.

  Finally, assess Don Marquis's "Future-Like-Ours" (FLO) argument against Thomson's conclusion. If Marquis succeeds in proving the fetus has a right to life, does he refute Thomson? Use this to evaluate whether framing the abortion debate primarily as a conflict over **personhood** is a philosophical mistake.

  ***

  ### 2. Model Answer (Approx. 600 Words)

  Thomson's argument is often misunderstood as a claim about the moral status of the fetus, but her Violinist analogy explicitly grants the fetus full personhood to isolate the question of bodily use. In the three cases provided, the variable is not the fetus's status, but the woman's prior conduct. In the rape case, Thomson is strongest: there is no consent and no assumption of responsibility. The fetus is a trespasser. In the consensual sex/regret case, Thomson is weakest. Opponents argue that by engaging in sex without contraception, the woman assumed the risk of pregnancy, creating a special obligation akin to inviting someone into your house. The donated embryo case sits uneasily between them. She consented to the *implantation* (unlike rape) but perhaps not the *completion* of gestation (unlike the risk-assumption view). However, because she deliberately initiated the process with no genetic tie, this case tests whether "special responsibility" arises from genetics, causality, or explicit contract.

  This comparison forces a commitment on Thomson's foundation. If Thomson rests on the **absence of agreement**, then the pro-life side can win by showing the fetus is not a stranger. If a woman signs a contract (donated embryo) or assumes risk (consensual sex), she has implicitly agreed to sustain the life she helped create. However, Thomson's deeper commitment is to **bodily autonomy**. She argues that even if you invite someone in, you are not obligated to let them use your kidneys to survive. Therefore, the "stranger" distinction fails. Even a family member cannot claim your body without ongoing consent. The donated embryo case clarifies this: genetic relatedness and contractual consent create moral duties, but Thomson contends they do not override the right to decide what happens inside one's skin. Thus, Thomson rests on autonomy, not merely the lack of agreement. Consent creates obligations, but not obligations that entail bodily servitude.

  This leads to the interaction with Marquis. Marquis argues abortion is wrong because it deprives the fetus of a "future-like-ours." This is not a potentiality argument; it is about the value of the future experiences the fetus *would* have. Crucially, this future is valuable even if the fetus cannot currently value it. Marquis successfully establishes that the fetus has a serious right to life. However, this does not refute Thomson. Thomson grants the right to life; she denies that the right to life includes the right to use another person's body against their will.

  Consequently, a fully successful FLO argument touches Thomson's premises but misses her conclusion. Marquis proves the fetus is a person with a stake in the future; Thomson argues that personhood does not entail a claim on specific biological resources. This reveals that framing the abortion debate as a fight over **personhood** is a category mistake. The pro-life side fights to establish the fetus is a person (using Marquis), while the pro-choice side (using Thomson) argues that personhood is insufficient to mandate gestation. If Thomson is right, the personhood debate is largely irrelevant to the permissibility of abortion. The real conflict is not about *what* the fetus is, but about *what obligations* one person can have toward another's body. A successful review of these arguments shows they are not rivals answering the same question; Marquis answers the status question, while Thomson answers the obligation question. To defeat Thomson, one must not prove the fetus is a person, but that the right to life supersedes bodily autonomy in cases of dependency.

  ***

  ### 3. Marking Scheme (20 Marks Total)

  **1. Analysis of the Three Cases (4 Marks)**
  *   **Must Hit:** Distinguish the cases based on *consent* and *assumption of responsibility*, not genetics. Identify the donated embryo case as a test of explicit contract vs. bodily withdrawal.
  *   **Common Error:** Treating the genetic link in the donated embryo case as morally decisive (Thomson explicitly rejects genetics as a basis for obligation).
  *   **Common Error:** Reading the Violinist case as weighing the fetus's rights against the woman's rights, rather than defining the *content* of the right to life.

  **2. Thomson's Foundation: Autonomy vs. Agreement (4 Marks)**
  *   **Must Hit:** Commit to a position. (Best answer: Thomson rests on Autonomy; Agreement creates obligations but not bodily use). Address the "Stranger" follow-up: If it were just about agreement, pro-life wins via contract/risk. Because it's autonomy, the "stranger" distinction fails.
  *   **Common Error:** Claiming Thomson denies the fetus is a person. (She grants this to make her argument harder).
  *   **Common Error:** Arguing Thomson rests *only* on lack of agreement, failing to see the "Stranger" trap set by the prompt.

  **3. Marquis's FLO Argument Precision (4 Marks)**
  *   **Must Hit:** Define FLO correctly: It is the loss of the *future* value, not the *potential* to become valuable. Note that the fetus need not currently value the future.
  *   **Common Error:** Dismissing Marquis as a "potentiality argument" (it is about the actual future that will be lost).
  *   **Common Error:** Claiming FLO requires the fetus to have current desires or awareness to have a future of value.

  **4. The Interaction (Thomson vs. Marquis) (4 Marks)**
  *   **Must Hit:** Recognize that Marquis granting "Right to Life" does not refute Thomson, because she grants that premise already. They are logically compatible but practically opposed.
  *   **Common Error:** Treating Marquis and Thomson as direct rivals who cannot both be true. (They address different moral questions: Status vs. Obligation).

  **5. Evaluation of the "Personhood" Framing (4 Marks)**
  *   **Must Hit:** Conclude that framing the debate as a fight over personhood is a mistake/irrelevant if Thomson is correct. The debate should be about bodily obligation.
  *   **Common Error:** Concluding that if Marquis wins (fetus is person), Thomson loses. (This ignores Thomson's core distinction).

  **Differentiator: A vs. B Grade**
  *   **B Grade:** Correctly identifies all distinct arguments, avoids the common errors listed above, and answers both halves of the prompt accurately.
  *   **A Grade:** Synthesizes the two halves to identify the **Category Mistake**. The A student explicitly articulates that the standard public debate (is it a person?) is orthogonal to the philosophical stalemate (does personhood entail bodily use?). They recognize that Marquis and Thomson are talking past each other, and that resolving the "personhood" question leaves the "abortion" question unanswered.
