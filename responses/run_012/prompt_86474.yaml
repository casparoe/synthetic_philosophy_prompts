      *Key point to make:* The Humean violates (2) *within* the level of scientific explanation (the law is the instances). The Necessitarian violates (2) only if you demand metaphysical explanation for the metaphysical ground. But we can stop the regress.

      *Wait, one more thing:* The user says "I'd most like to keep (1)". I must respect that. So the conclusion must be that Humeanism is the one that fails, and Necessitarianism survives by rejecting the universal application of (2) to *grounds*.

      *Let's structure the diagnosis:*
