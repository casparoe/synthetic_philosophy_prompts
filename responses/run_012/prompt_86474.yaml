          *   Diagnose which premise/step to give up, why it looked fine, and the costs/benefits.
          *   Write in British English.
          *   Do not worry about specific citations (no "reading list").
          *   Keep premise (1) if possible (user's preference).

  2.  **Deconstruct the User's Argument:**
