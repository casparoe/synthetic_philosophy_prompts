answer: |-
  Here is the specification sheet for biological function. This is not an argument for a theory, but a list of constraints any theory must satisfy to be empirically adequate and philosophically robust.

  ### I. The Core Desiderata

  **1. The Malfunction Constraint (Normativity)**
  *   **The Case:** A heart that cannot pump blood is still a heart, and it is *malfunctioning*. A rock that cannot pump blood is not malfunctioning; it just isn't a heart.
  *   **The Requirement:** The account must distinguish between *what a trait does* and *what it is supposed to do*, without invoking a conscious designer or divine intent. It must ground normative claims ("ought") in naturalistic facts ("is").
  *   **Status:** **Non-negotiable.** Without this, "function" collapses into "activity," and the concept loses its explanatory power in pathology and engineering.

  **2. The Byproduct Constraint (Specificity)**
  *   **The Case:** The heart makes a thumping sound. This sound is useful for doctors (diagnostic function), but the heart is not *for* making sounds. The sound is a byproduct (spandrel) of the pumping mechanism.
  *   **The Requirement:** The account must distinguish between effects that constitute the function and effects that are merely causal consequences. It must avoid "pan-functionalism" (the view that everything a trait does is a function).
  *   **Status:** **Non-negotiable.** If every causal contribution counts as a function, the concept becomes trivial and useless for explaining why the trait exists.

  **3. The Co-option Constraint (Historical Shift)**
  *   **The Case:** Feathers likely evolved for thermal regulation but were co-opted for flight.
  *   **The Requirement:** The account must allow a trait's function to change over time without the trait itself changing structurally. It must distinguish the *original* function from the *current* function.
  *   **Status:** **Non-negotiable.** Evolution is opportunistic; a static mapping of structure-to-function fails to capture evolutionary history.

  **4. The Grain Constraint (Level Neutrality)**
  *   **The Case:** Does the *gene* for sickle cell have a function (replication), does the *hemoglobin* have a function (oxygen transport), or does the *organism* have a function (survival)? Sometimes these conflict (meiotic drive).
  *   **The Requirement:** The account must either apply consistently across levels (gene, organism, group) or provide a principled, non-arbitrary reason for privileging one level over the others.
  *   **Status:** **Preference/Theoretical.** You can build a theory that only works at the organism level, but you must admit it is incomplete. A unified theory is preferred but hard to achieve.

  ---

  ### II. The Two Added Requirements

  You asked to add two constraints often overlooked, and to justify why they are requirements rather than prejudices.

  **5. The Drift & Artifact Constraint (Non-Adaptationism)**
  *   **The Case:** Consider a trait fixed in a population purely by genetic drift (neutral evolution). Or consider a synthetic organ grown in a lab that has never undergone selection. Does it have a function?
  *   **Why this is a Requirement (not prejudice):** It is a prejudice to assume all biological traits are products of selection (adaptationism). Neutral theory is a pillar of modern genetics. If a theory of biological function cannot categorize traits fixed by drift or synthetic biological parts, it is empirically inadequate for large swathes of modern biology. It renders the theory incapable of speaking to synthetic biology or neutral evolution, making it a theory of *adaptation* rather than a theory of *function*.
  *   **Status:** **Non-negotiable** for a general theory of biology. (Adaptationists will mark this as a preference, but that limits the scope of their theory).

  **6. The Downstream Usability Constraint (Operational Normativity)**
  *   **The Case:** A clinician diagnoses "heart failure." A conservationist identifies a "loss of function" in an ecosystem.
  *   **Why this is a Requirement (not prejudice):** If the definition of "dysfunction" collapses into "statistical abnormality" (most hearts don't do this) or "social disvalue" (we don't like this), then medical diagnosis becomes merely sociological. For the concept to do work in medicine and conservation, "dysfunction" must refer to a factual state of the organism independent of human valuation. The theory must underwrite the objectivity of clinical judgment.
  *   **Status:** **Non-negotiable.** If the theory cannot support the normative claims made by the sciences that rely on it, it is philosophically disconnected from scientific practice.

  ---

  ### III. The Tensions (What You Can't Have Together)

  You suspected a tension between **Malfunction** and **Novelty**. You are correct. This is the central trade-off in the literature.

  *   **The Tension:** To get **Malfunction** (normativity), you generally need a standard against which to measure failure. Historically, this standard is provided by *past success* (selection history). To get **Novelty** (a trait has a function the moment it appears), you generally need to look at *current capacity* (what it does now).
  *   **The Conflict:**
      *   If you ground function in **History** (to secure Malfunction), you lose **Novelty**. A brand-new mutation, even if beneficial, has no history of selection. On a strict historical view, it has no function yet.
      *   If you ground function in **Current Capacity** (to secure Novelty), you lose **Malfunction**. If function is just "what it contributes to the system," then a heart that *fails* to pump simply has the function of "not pumping." You lose the ability to say it *should* pump but *isn't*.
  *   **Verdict:** You cannot maximize both without hybridizing the theory (e.g., allowing "forward-looking" etiology or "dispositional" causal roles). One usually must be weakened.

  **Secondary Tension: Drift vs. Specificity**
  *   If you satisfy the **Drift Constraint** (allowing neutral traits to have functions), you risk violating the **Byproduct Constraint**. If a trait is fixed by drift, it wasn't selected *for* anything. If you say it still has a function, you risk saying *everything* the organism does is a function, sliding back into pan-functionalism.

  ---

  ### IV. The Killer Constraints (Etiological vs. Causal-Role)

  You asked which single requirement does the most damage to each of the two main contenders.

  **1. The Etiological Account (Selected Effect Theory)**
  *   *Definition:* A trait's function is the effect for which it was naturally selected.
  *   **The Killer Constraint:** **Novelty.**
  *   **Why:** Etiological accounts define function via *past* selection. Therefore, a novel trait (a new mutation in generation 1) literally cannot have a function until it has been selected over generations. This contradicts the intuition (and scientific usage) that a beneficial new trait serves a function immediately. It also struggles with the **Drift Constraint**, as it must say neutrally fixed traits have *no* function, which limits its applicability in non-adaptationist contexts.

  **2. The Causal-Role Account (Systemic Theory)**
  *   *Definition:* A trait's function is its causal contribution to the containing system's capacity.
  *   **The Killer Constraint:** **Malfunction (and Byproducts).**
  *   **Why:** Causal-role accounts define function by *what is done*. If a heart fails to pump, its causal contribution is "not pumping." The theory struggles to explain why that is a *failure* rather than just a different state. It lacks the normative "ought." Furthermore, because it counts *any* causal contribution, it struggles to filter out **Byproducts** (e.g., the heart's sound) without smuggling in etiological criteria to decide which causal roles "count."

  ### Summary for Decision
  *   If you prioritize **Malfunction** and **Byproduct** distinction (Normativity), you lean **Etiological**.
  *   If you prioritize **Novelty** and **Drift/Artifact** coverage (Current Capacity), you lean **Causal-Role**.
  *   If you prioritize **Downstream Usability** (Clinical objectivity), you likely need the **Etiological** normativity, but you need to solve the **Novelty** problem to make it usable for new diseases or synthetic biology.

  Use this spec to test the theories. Do not ask which theory is "true"; ask which constraint you are willing to relax.
