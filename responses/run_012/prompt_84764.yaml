      *   **Constraint:** Do not score the theories; just provide the spec.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Malfunction:* Essential. A heart that fails is still a heart. Needs to distinguish normative "ought" from descriptive "is" without invoking a conscious designer.
      *   *Novelty:* Tricky. Can a new mutation have a function immediately? Etiological accounts struggle here (no history). Causal accounts handle it easily but might over-ascribe.
      *   *Co-option (Exaptation):* A trait changes function. Feathers for warmth -> flight. Account needs to track the shift.
      *   *Byproduct (Spandrels):* Distinguish selected effects from side effects. (e.g., red blood is a byproduct of hemoglobin, not selected for redness).
      *   *Grain/Level:* Gene vs. Organism vs. Group. Needs consistency across levels or a principled reason to pick one.
      *   *Added 1 (Non-Selected/Drift/Artifacts):* User wants this justified. Why care about drift or lab creatures? Because biology isn't just adaptationism. If a trait is fixed by drift, does it have a function? If we build a synthetic organism, do its parts have functions?
      *   *Added 2 (Downstream Usability/Normativity):* User wants this justified. Clinicians/Conservationists need objective "dysfunction," not just "statistical abnormality" or "value judgment."

  3.  **Evaluate Status (Non-negotiable vs. Preference):**
      *   *Malfunction:* Non-negotiable. Without this, "function" loses its normative bite.
      *   *Byproduct:* Non-negotiable. Otherwise, everything an organism does is a function (pan-functionalism).
      *   *Novelty:* Contested. Etiological folks bite the bullet (no history = no function). Causal folks say yes. This is a preference/tension point.
      *   *Grain:* Preference/Methodological. Depends on the user's metaphysical commitment (replicator vs. interactor).
      *   *Non-Selected:* Non-negotiable for a *general* theory of biology, but adaptationists might treat it as edge-case. I should argue it's non-negotiable for a robust theory.
      *   *Downstream:* Non-negotiable for applied relevance, but pure philosophers might ignore it. I need to argue why it's structural, not just pragmatic.

  4.  **Analyze Tensions/Trade-offs:**
      *   *Malfunction vs. Novelty:* This is the classic tension. To get malfunction (normativity), you usually need history (etiology). To get novelty (immediate function), you usually look at current capacity (causal role). You can't easily have strong normativity *and* immediate functionality without complex hybridizing.
      *   *Specificity vs. Generality:* Being too specific (only selected effects) misses drift. Being too general (any causal contribution) includes byproducts.
      *   *Objectivity vs. Context:* Function often seems context-dependent, but malfunction needs to be objective.

  5.  **Identify the "Killer Constraints" for the Big Two:**
      *   *Etiological (Selected Effect):* Killed by **Novelty**. If a trait appears *now* and helps survival, SE theory says it has no function yet (no past selection).
      *   *Causal Role (Systemic):* Killed by **Malfunction/Byproducts**. If function is just "what it does," then a heart that pumps blood has the function of pumping blood. But if it *fails* to pump blood, does it still have that function? CR accounts struggle to say "it *should* pump but *doesn't*" without smuggling in etiology. Also, CR accounts often classify byproducts as functions (the heart makes a sound, so is making a sound a function?).

