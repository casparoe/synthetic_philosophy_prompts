      *   *Check:* Did I address the "Grain" issue?
      *   *Correction:* Keep it brief but acknowledge the tension between gene-centric and organism-centric views.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Non-negotiable vs. Preference" tagging is visible. (Proceed to generate output).

  *(Self-Correction on the "Non-Selected" point)*: I need to be careful. Some etiological accounts *define* function strictly by selection. So for them, drift traits *have no function*. Is that a failure of the account or a feature? The prompt asks me to argue why it's a *requirement* that the account survive being pointed at these things. I need to argue that a theory of *biological* function that cannot speak to traits fixed by drift is empirically incomplete, given the prevalence of drift.
  *(Self-Correction on "Downstream")*: Why is this not just pragmatism? Because if the definition of "dysfunction" collapses into "statistical rarity" or "social disvalue," it fails to capture the *biological* reality clinicians are diagnosing. It needs to ground the *normativity* of medicine in biology.

  10. **Final Structure:**
