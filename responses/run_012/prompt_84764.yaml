      *   **Status Flags:** Mark which are hard constraints vs. theoretical preferences.
      *   **The Tensions:** Address the Malfunction vs. Novelty hunch. Confirm it's real.
      *   **The Killer Constraints:**
          *   For Etiological: Novelty (The "Time Lag" problem).
          *   For Causal Role: Malfunction/Byproducts (The "Normativity" problem).

  7.  **Refining the Tone:**
      *   Keep it sharp. Use philosophical terminology correctly (normativity, etiology, pan-functionalism).
