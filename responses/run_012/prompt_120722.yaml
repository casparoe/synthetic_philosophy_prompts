      *   *Pascal's Wager Distinction:* Pascal relies on infinite utility ($\infty \times \epsilon$). This relies on high *measure* or *weight* due to simplicity ($\epsilon \times N$ where $N$ is derived from the prior's bias towards simple generative processes). It's about the *structure* of reality being simpler if it contains many such agents.
      *   *The "Paranoia" Aspect:* It feels like paranoia because it suggests the world is organized around the agent's choices, but logically it's about description length.

