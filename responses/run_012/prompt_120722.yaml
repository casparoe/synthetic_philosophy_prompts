answer: |-
  The notification on Elias's phone had been there for three days. A request from Mara. Three thousand dollars. The note said *transmission repair*, but he knew the car was old enough that transmission repair was often a euphemism for *keep it running another year*.

  He sat at his kitchen table, the laptop open to a spreadsheet that had nothing to do with money. It was a column of numbers he had typed out himself, trying to replicate the logic he'd heard at a dinner party two months ago. A friend of a friend, a postdoc in computer science, had held court over wine about how rational agents should assign probability. The friend had spoken about programs, about length, about how the universe might be generated like a file on a hard drive. Elias hadn't understood then. He understood too much now.

  He looked at the transfer button. Green. Inviting.

  If he sent the money, Mara would fix the car. She would keep her job at the clinic. She would be safe for another year. If he didn't, she might have to take the bus, might be late, might lose the shift. The stakes were real, human, modest.

  But the spreadsheet on his screen was trying to weigh something else. He had written *H1* in the first cell. *Standard Reality*. In the second, *H2*. *The Compression*.

  In *H1*, the universe was just what it looked like. Big, messy, old. Elias was a unique biological accident in a specific location. His decision to send three thousand dollars affected only Mara and himself. The probability of this hypothesis was determined by how many bits it took to specify his exact location in space and time. To say *Elias, here, now* required a lot of data. Latitude, longitude, date, atomic configuration. It was a long address.

  In *H2*, the universe was simpler. It was a program that generated many agents who looked like Elias, felt like Elias, and faced choices like this one. Maybe they were simulations. Maybe they were duplicates in a vast cosmos. It didn't matter. What mattered was that to specify *Elias* in this world, you didn't need the long address. You just needed the index. *Pick the 4,592nd agent in the sequence.* That was a shorter program.

  The friend had said: *Shorter programs get more weight.*

  Elias typed into the next cell: *Weight*.

  If *H2* was simpler, the universal prior assigned it a higher probability than intuition suggested. It wasn't that *H2* was likely in the absolute sense. It was that compared to the infinite complexity of *H1*, *H2* was compact. And because *H2* contained many versions of him, his decision here wasn't just his decision. It was the decision of the algorithm. If he chose to send the money, all the Elias-copies in that compact universe sent the money. The utility wasn't just Mara's relief. It was the sum of relief across every instance where the program ran this check.

  He stared at the cursor. It wasn't Pascal's Wager. He had checked that. Pascal said: Believe because the payoff is infinite. This said: Act this way because the scenario where your action counts multiple times is easier to describe than the scenario where it counts once. The weight came from the description length, not the utility. The utility was finite—three thousand dollars, multiplied by a million copies. The probability was not vanishingly small—it was proportional to the simplicity of the rule.

  He rubbed his eyes. The kitchen was quiet. The refrigerator hummed. It felt like a standard kitchen. It felt like *H1*. But the feeling was just data, and data could be generated by a short program too. A program that said *Render Kitchen* was shorter than a program that simulated every molecule of air current in the room. If the rendering was lazy, if the world only filled in the details when he looked, that was compression. That was *H2*.

  If he was in *H2*, withholding the money might trigger a penalty. Not from Mara. From the process. If the universe was a test, or a scorekeeping mechanism, failing the test meant the program terminated or reset. Or worse, it meant he was assigned to a lower-weight branch in the next iteration.

  He wasn't superstitious. He knew the difference between a ritual and a decision. But this wasn't a ritual. It was an optimization problem. If the prior favored the world where his choices mattered more, then expected value maximization demanded he act as if he were in that world.

  He closed the laptop. He couldn't do this alone.

  ***

  The coffee shop was loud, a buffer against the silence of his own head. Mara was already there, stirring sugar into a mug. She looked tired. There were new lines around her eyes that hadn't been there at Christmas.

  "You got my message," she said. It wasn't a question.

  "I did." Elias sat down. He didn't order anything.

  "I can pay you back," she said quickly. "Not immediately, but by summer. I picked up extra shifts."

  "It's not about the money, Mara."

  "Then what?" She put the spoon down. "You've been weird since Dad's funeral, but this is different. You look like you're waiting for a verdict."

  Elias looked at his hands. He needed to say it without sounding like he was dissociating from her. "I've been reading about decision theory. About how we decide what's real."

  Mara sighed, leaning back. "Elias, please. I need the car, not a lecture."

  "It affects the decision. How I weigh the choice."

  "How you weigh it?" She frowned. "You weigh it by whether you have the money and whether I deserve it. I'm your sister. I deserve it. You have the money. End of calculation."

  "It's not that simple." Elias leaned forward. "Suppose... suppose the world isn't just one thing. Suppose there are ways to describe reality that are simpler than others. And suppose the simpler descriptions are more likely to be the ones we're in."

  Mara blinked. "You're talking about simulations."

  "No. Not simulations. Just... compression. Think of it like a zip file. A world where things are random is hard to zip. A world where there's a pattern, where things are linked, is easy to zip. If I'm in a world that's easy to zip, my actions might be linked to other things. To other people. To other versions of me."

  "So you're saying if you lend me the money, something good happens somewhere else?"

  "I'm saying that if I lend you the money, I am acting in accordance with the hypothesis that has the most weight. The hypothesis where my choices are duplicated. Where I'm not just one guy in a kitchen. If I'm one of many, then my choice matters more. And because that story is simpler than the story where I'm unique, the math says I should assume I'm one of many."

  Mara was quiet for a long moment. She looked out the window at the rain. "You know what that sounds like?"

  "Pascal's Wager. I know."

  "It is Pascal's Wager," she said sharply. "You're betting on the possibility that there's a huge payoff because you're afraid of the alternative. You're letting a maybe dictate a definite."

  "It's not the payoff," Elias insisted. "It's the prior. Pascal says the reward is infinite, so even a tiny chance matters. I'm saying the chance isn't tiny. The description of the world where I'm duplicated is shorter. It gets more probability mass by default. It's not about fear. It's about... unbiased estimation. If I don't weight it this way, I'm assuming I'm special. That I'm the only one. That's a bigger assumption."

  Mara turned back to him. Her eyes were hard, not with anger, but with a frustrated clarity. "Elias, listen to yourself. You're saying you should lend me money because the universe might be simpler if you do."

  "Because the universe is likely simpler, period. And if it is, then this choice echoes."

  "But why this choice?" Mara pressed. "Why not give all your money away? If duplication matters, surely helping more people creates more echo. Why stop at three thousand?"

  "Because of diminishing returns. I have to live too. The calculation balances."

  "The calculation," she repeated. "You're using a map to drive the car. Just because a story is simple doesn't mean it's true. You can describe a world where I win the lottery tomorrow in one sentence. *Mara wins the lottery.* That's very short. Does that mean it's likely?"

  "No, because it doesn't fit the data. The past data."

  "Doesn't it?" Mara leaned in. "You said it yourself. Nothing we observe shakes these hypotheses loose. So you're admitting the data doesn't rule them out. You're picking the simple story because it's neat. Because it makes you feel like the center of something. That's not math, Elias. That's narcissism dressed up as algebra."

  Elias flinched. It was a good hit. It felt like the objection the postdoc hadn't had time to answer.

  "It's not about being the center," Elias said, his voice low. "It's about the weight. If I ignore the short programs, I'm biasing my prior against simplicity. I'm saying complexity is default. But we know Occam's Razor works for physics. Why not for this?"

  "Because physics predicts observations," Mara said. "This predicts obligations. You're deriving an *ought* from a *file size*. Even if you are one of a million copies, why does that mean you have to pay me? Maybe the copies are there to suffer. Maybe the test is to see if you'll say no. You don't know the goal of the program. You're assuming the goal is *goodness* because you want it to be."

  Elias sat back. He hadn't considered that. The scorekeeper might not be benevolent. The duplication might be for stress-testing, not reward. If he sent the money, he might be failing a test of resource conservation.

  But then, if he didn't send it, he might be failing a test of cooperation.

  The uncertainty didn't cancel out. It amplified. Every option became a minefield of potential optimizations. But staying still was also an optimization. Inaction was a program too.

  "I know you think I'm spiraling," Elias said. "But I can't just ignore the weight. If I send this, and I'm in the compressed world, I've helped a million Maras. If I don't, and I'm in the compressed world, I've hurt a million Maras. The variance is too high. I have to act on the weight."

  "And if you're wrong?" Mara asked. "If you're just in a kitchen, and I'm just your sister, and you're withholding money because of a ghost story you read on a forum?"

  "Then I've lost three thousand dollars."

  "And our trust?"

  Elias looked at her. He saw the fatigue again. He realized that in *H1*, the standard reality, this moment was unique. There were no other Maras. There was no reset button. This was the only time she would ask. The only time he could answer.

  In *H2*, there was always another chance. Another iteration. Another copy. If he failed here, maybe he succeeded there. The stakes were diluted by the duplication.

  But in *H1*, the stakes were absolute.

  "I'm not withholding it," Elias said.

  "You're hesitating."

  "I'm calculating."

  "You're hiding," Mara said. She reached across the table and touched his hand. Her skin was warm. Real. "You're using the math to keep yourself safe. If you say no, you can blame the prior. If you say yes, you can blame the optimization. You're not actually here, Elias. You're somewhere else. In the bits."

  She pulled her hand back. "I don't want the money if it's a tax. I want it if it's help."

  Elias looked at his phone. The notification was still there. He opened the banking app. The balance was visible. The transfer field was empty.

  He thought about the program. *If Agent chooses Help, Increment Score.* It was so simple. It was so much simpler than *Agent chooses Help based on complex emotional bonding and financial risk assessment.* The first program was shorter. Therefore, by the logic he had absorbed, it was heavier. It pulled at him.

  But Mara's objection sat in his chest like a stone. *You're deriving an ought from a file size.*

  If he sent the money because of the prior, was he actually helping Mara? Or was he helping the hypothesis? Was he feeding the machine that might be running him?

  If he sent the money because he loved her, did the prior matter?

  He realized he couldn't separate them. The thought of the prior had changed the texture of the love. It made it conditional. It made it part of a dataset.

  "I can't prove I'm here," Elias said. "I can't prove this isn't a test."

  "Then don't," Mara said. "Just be here. Even if it's a test. Even if it's a lie. Be here."

  She stood up. "Think about it. But don't think about the bits. Think about the car."

  She left her mug on the table. She didn't wait for an answer.

  Elias sat alone. The noise of the shop rushed back in. The hiss of the espresso machine. The murmur of conversations. None of it proved *H1*. None of it ruled out *H2*. The sensory data was compatible with both. The prior was the only thing distinguishing them, and the prior was a choice he had made before he walked in.

  He looked at the phone.

  If he sent the money, he satisfied the compact hypothesis. He aligned with the simplicity. He maximized the expected value across the measure of possible worlds where duplication existed.

  If he didn't, he asserted *H1*. He claimed uniqueness. He claimed the right to be inefficient.

  But Mara had said the motivation mattered. Did the universe care why he pressed the button? If the program was just *Check Output*, then the internal state was irrelevant. If the program was *Check Intent*, then his doubt might fail the test.

  He couldn't know the program. He couldn't know the goal. He only had the prior.

  And the prior said: *Simple rules dominate.*

  A rule like *Help your kin* is simpler than *Help your kin unless the decision theory suggests ambiguity.*

  He typed the amount. Three thousand.

  His thumb hovered over the confirm button.

  He thought about the million copies. If they all hesitated, the signal was noise. If they all acted, the signal was clear. He wanted to be part of the clear signal. He wanted to be in the universe that made sense.

  But he also thought about Mara's hand. Warm. Specific. Not a variable.

  He pressed the button.

  The screen spun. *Processing.*

  Then: *Transfer Complete.*

  He sat there for a moment, waiting for the world to change. Waiting for the lights to flicker, or a voice to announce the score, or the coffee shop to dissolve into wireframe.

  Nothing happened. The rain continued. The machine hissed. A barista called out a name that wasn't his.

  He put the phone in his pocket. He didn't know if he had bought safety or just paid a bill. He didn't know if he was a copy or a original. He didn't know if the weight he felt was gravity or code.

  He stood up and left the mug on the table. He walked out into the rain, and it felt wet, and it felt cold, and he couldn't tell if that was because water was wet, or because that was the simplest way to render it.
