  A colleague of mine got hired to beta-test this new kiosk called the "MeritBox." You sit down, stare at an object—say, a paperclip—and if the biometric sensors confirm you genuinely admire it for its own sake, it instantly wires you five grand. If it detects you're just pretending to get the cash, it locks you in the booth.

  He tells me, "I sat there staring at this bent paperclip. Felt nothing. Then I read the sign: 'Five Thousand Dollars.' Suddenly, I was overwhelmed. I loved the clip. I really did."

  I say, "So the machine paid you?"

  He says, "Yeah. The transfer notification popped up right after."

  I say, "So the paperclip was admirable?"

  He says, "No."

  I say, "Then why'd it pay?"

  He says, "Because I admired it."

  I say, "Why?"

  He says, "For the five grand."

  I say, "So the admiration was bought."

  He taps his phone screen. "Exactly. This notification is the proof I succeeded. But it's also the proof I failed. If I hadn't wanted the money, I wouldn't have admired the clip. Since I wanted the money, the admiration doesn't count. So the machine shouldn't have paid."

  I say, "So return it."

  He says, "I can't. Because looking at this balance... is the only thing I genuinely admire right now."

  I say, "For its own sake?"

  He says, "No. For what it proves."

  I say, "Which is?"

  He says, "That the only reason to have an attitude is the one that makes the attitude worthless. It's a reward that only works by spoiling the product."
