  **Credence in PRE-TRUTH: 0.58**

  I am pricing the **Ockhamist reading**: "True" means "accurate relative to the single actual future history," not "settled by present facts." On this reading, bivalence holds even if the present doesn't determine the future.

  ### Decomposition

  Here are the six drivers. The numbers represent my credence that **the specific objection fails** (i.e., that this domain allows PRE-TRUTH to stand).

  | Sub-Question | Credence (Objection Fails) | Justification |
  | :--- | :--- | :--- |
  | **(a) Ontology of Time** | 0.80 | Eternalism makes this trivial, but Presentism doesn't strictly forbid it if truth isn't grounded in *present* existence. |
  | **(b) Openness vs. Truth (w/ Quantum)** | 0.60 | Quantum indeterminacy is metaphysical randomness, not semantic gappiness; a proposition can be true even if its cause is probabilistic. |
  | **(c) Classical Logic** | 0.90 | Abandoning bivalence/excluded middle is a high theoretical cost; we should preserve classical logic unless forced otherwise. |
  | **(d) Truthmaker Principle** | 0.50 | The strongest blocker; if truth *requires* an existing ontological ground, future contingents cannot be true now. |
  | **(e) Foreknowledge** | 0.95 | Logical status of propositions shouldn't depend on epistemic access (God or predictors); this is a red herring. |
  | **(f) Semantic Context (New)** | 0.70 | Truth can be absolute rather than relative to a "context of use" or branching history (rejecting Supervaluationism). |

  ### Combination Logic

  These function as **weighted necessary conditions**. While logically conjunctive (PRE-TRUTH fails if any are definitively false), they are not probabilistically independent. I weight **(d) Truthmaker** and **(b) Quantum/Openness** at 40% each, as they are the substantive metaphysical bottlenecks. The remaining four share the remaining 20%.

  *Calculation:* $(0.50 \times 0.4) + (0.60 \times 0.4) + (\text{Avg}(a,c,e,f) \times 0.2)$
  *Result:* $0.20 + 0.24 + (0.84 \times 0.2) = 0.44 + 0.17 = 0.61$.
  *Adjustment:* Discounted to **0.58** to account for the high correlation risk between (d) and (a) (Presentism usually demands Truthmakers).

  ### Sensitivity & Verbal Dispute

  **Most Sensitive Sub-question:** **(d) Truthmaker Principle.**
  If you convince me that truth *maximalism* is non-negotiable (that every true proposition must have an existing ontological ground), my credence in PRE-TRUTH collapses to <0.10. If you convince me that truth is merely a disquotational device or a semantic relation to future facts, my credence rises to >0.85. The argument that would move me most is a defense of **soft presentism**: the view that future facts are real *as future* without requiring present existence, dissolving the truthmaker tension.

  **Verbal vs. Substantive:**
  This is **70% verbal**. The dispute largely hinges on the definition of "true."
  *   **Reading A (Peircean):** "True" means "settled now." Under this reading, PRE-TRUTH is false by definition (Credence 0.05).
  *   **Reading B (Ockhamist):** "True" means "will correspond." Under this reading, PRE-TRUTH is plausible (Credence 0.85).

  I have priced **Reading B**. If you are using Reading A, we are not disagreeing about the world, but about which semantic label to attach to "will happen." The substantive remainder (30%) is the metaphysical cost of allowing truth to outstrip being (i.e., can there be truth without a current truthmaker?).
