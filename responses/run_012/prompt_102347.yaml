answer: |-
  Good evening. Welcome to our annual student art exhibition.

  I know this year's theme, "Art That Says Something," has sparked some conversation. I've heard the worries. Some of you worry it means art has to be loud to matter. Some worry that if a piece is just beautiful, or quiet, or abstract, it doesn't count as "saying" anything. It's a tough spot to be in. It feels like we're being asked to choose between making things that matter and making things that are beautiful, as if those two things could ever actually be separated.

  I've been thinking about how to talk about this without telling anyone what their work means. And I keep coming back to an idea I read recently from a writer named W. E. B. Du Bois. He wrote something that sounds, at first, pretty aggressive. He said that all art is propaganda.

  I know what that sounds like. It sounds like posters, and slogans, and being told what to think. It sounds like the opposite of freedom. But the more I looked at our work hanging on these walls, the more I wondered if he meant something quieter.

  What if "propaganda" doesn't mean forcing a message on someone? What if it just means making a case for what deserves attention?

  When an artist paints a portrait of a family member, they are making a case. They are saying: *This person matters. Look at their hands. Look at how the light hits their face. This is worth your time.* That is a statement.

  When an artist paints a canvas that is just blue, or just texture, they are also making a case. They are saying: *Beauty is enough. Color is enough. You don't need a story to feel something. Stop looking for a meaning and just look.* That is also a statement.

  Even the decision to paint something ugly, or painful, or political is a case being made. It says: *This cannot be ignored. This truth is heavy.*

  If we look at it that way, then the theme of this show isn't a filter. It isn't a way to separate the "serious" work from the "decorative" work. Because there is no decorative work here. There is only art that argues for a way of seeing.

  Du Bois wrote that sentence decades ago during a fight for civil rights, arguing that art couldn't be separated from the struggle for justice. But I think his point holds true for us, too. Art cannot help but advocate. It advocates for justice, yes. But it also advocates for joy. It advocates for silence. It advocates for the idea that the world is worth looking at, even when it's hard, and especially when it's beautiful.

  So, to the students who worried their work was being demoted to decoration: Your work is not decoration. It is an argument for beauty, and that is a vital thing to say. To the students who worried their work was being used for a message: Your work stands on its own. It is an argument for truth, and that is also vital.

  The administration chose a theme, but you chose the voices. And every piece in this room says something. Some of them shout. Some of them whisper. Some of them argue. Some of them pray. But none of them are silent.

  We are here to look. We are here to listen. And we are here to recognize that when a student puts something on a wall, they are asking us to see the world differently, even if just for a moment.

  So, please. Walk around. Read the statements. Look at the brushstrokes. Don't just look for what the art says—look for what it wants you to value.

  Thank you to the parents and teachers for supporting us. Thank you to the artists for being brave enough to hang your arguments on our walls.

  It is my honor to declare the exhibition open.

  ***

  **Note to the Student Speaker**

  I am confident that the speech captures the spirit of your argument and fits the tone you requested. However, regarding the Du Bois claim:

  **Confidence Level:** Moderate to High on the quote, Moderate on the interpretation.
  Du Bois absolutely wrote "Thus all Art is propaganda and ever must be" in his 1926 essay "Criteria of Negro Art." You are safe on the citation itself.

  **The Point I Am Least Sure Of:**
  The stretch where we equate "art for art's sake" (beauty/abstraction) as a valid form of propaganda in Du Bois's eyes. Historically, Du Bois was arguing *against* the idea of art for art's sake when it ignored racial suffering. He believed art should actively fight for justice. By framing beauty itself as a form of "propaganda" (advocating for attention), we are philosophically reconciling the two student camps, but a strict scholar of Du Bois might argue this dilutes his specific political intent. However, for the purpose of a high school speech aimed at unity, this interpretation is defensible as a modern application of his broader idea that art is never neutral. The teachers who know the essay should recognize you are engaging with the text seriously, even if you are adapting it.
