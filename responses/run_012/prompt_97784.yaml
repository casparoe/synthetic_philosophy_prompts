prompt: |-
  Alright, I need a hand with something that keeps derailing my supervison meetings. I'm a third-year PhD student working on proof theory — constructive stuff, mostly — and my department has just brought in a new refereeing rule for internal reports: any claim that something exists has to be flagged as constructive or not, and if it's not, the authors have to say what a reader actually loses by not being able to get their hands on the object. It's caused a proper row. The applied maths and stats people think it's bureacratic nonsense that'll slow everything down, a couple of the logicians think it's the best thing to happen here in years, and I keep getting asked to defend the second position and I don't think I'm doing it well.

  So what I want from you: the most important implications of intuitionistic logic and the constructivist outlook for people who aren't logicians — mathematicians, modellers, statisticians, anyone who routinely proves that a solution, optimum or equilibrium exists without being able to produce it, leans on proof by contradiction, and treats classical logic as the neutral default. Be concrete about where it genuinely bites and where the worry is overstated. And I'd like you to take seriously the thought that a non-constructive existence proof is a bit like a cheque you can't cash — someone in my group put it that way and I want to know how far it survives scrutiny, including the stronger suggestion that every such proof with numerical content secretly has an algorithm in it just waiting to be dug out. Of the implications you give me, which is the one that should most change how we actually write papers, and why? No need for a history of the field or a reading list, I've got those — I want the argument.
