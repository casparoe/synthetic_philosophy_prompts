answer: |-
  The chapter you describe captures a powerful folk intuition but botches the underlying theory, conflating the permissibility of blaming with the truth of the accusation. A philosopher of blame would accept the initial triad: for blame to be fully appropriate, the act must be wrong, the agent blameworthy, and the blamer must possess standing. This is standard ground. However, the chapter immediately stumbles by reducing standing solely to a hypocrisy condition measured by general decency. Standing is not a certificate of moral purity; it is a normative relation to the specific norm violated. One can lack standing through hypocrisy, yes, but also through complicity or simply lacking the relevant relationship (meddling), and these are not merely hypocrisy in disguise. Meddling, for instance, is not about the blamer's moral failure but about the boundaries of moral community; a stranger may lack standing to scold a parent not because the stranger is a hypocrite, but because the authority to correct lies within the familial bond.

  The chapter's most significant error lies in its claim that lacking standing renders blame null, allowing the wrongdoer to shrug it off without answering. A defender of standing would argue that lacking standing makes the *act of blaming* unfair or impermissible, not the *content of the blame* false. When you retort "you have no standing," you are not denying the wrong; you are rejecting the blamer's authority to hold you to account. The obligation to repair the wrong remains, but it is not owed to that specific blamer. Consequently, the chapter's treatment of the "thief objection" is a category mistake. That a thief speaks the truth when condemning theft confirms that standing is distinct from truth-telling; the thief asserts a fact but lacks the moral authority to demand accountability from another thief. By treating this distinction as a refutation of standing, the chapter collapses normative authority into factual correctness, concluding that standing is merely social awkwardness. This ignores the relational function of blame, which is not just to catalogue wrongs but to negotiate moral relationships. What the chapter leaves out entirely is that standing is about *who* gets to speak for the moral community, not just *what* is said. The corrected bottom line is that standing does not determine whether an act was wrong, but rather who is entitled to demand accountability for it.

  \answer{mixed}
