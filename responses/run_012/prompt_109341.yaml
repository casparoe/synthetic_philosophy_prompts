  3.  **Philosophical Background (Standing to Blame):**
      *   *Key Figures:* R. Jay Wallace, Gary Watson, T.M. Scanlon, Macalester Bell, David Owens, Linda Radzik.
      *   *Core Concept:* Standing is a normative precondition for the *appropriateness* of the blaming act, distinct from the *truth* of the accusation.
      *   *Hypocrisy:* The classic case (you did it too). But it's not just "doing it too," it's about the *commitment* to the norm.
      *   *Effect of Lacking Standing:* Does it make blame *false*? No. Does it make it *unfair* or *impermissible*? Yes. Does it allow the wrongdoer to ignore the *content*? No, but it blocks the *authority* of the blamer.
