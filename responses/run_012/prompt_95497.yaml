  # The Model Assumption Decision Tree

  **Instructions:** Start at the top. Answer each question based on your instinct about how models *should* work, not how you wish they worked. Follow the path to find your position.

  ### **Node 1: The Success Question**
  **When a model makes a correct prediction, does that success need an explanation?**
  *   **No:** It works, and that's enough. (Go to Node 2)
  *   **Yes:** If it works, it must be tracking something real. (Go to Node 3)

  ---

  ### **Node 2: The Function Question**
  **Is the model's value in the numbers it produces, or in the story it tells?**
  *   **The Numbers:** I only care if the output matches data. (Go to Node 2A)
  *   **The Story:** I care about the mechanism it describes. (Go to Node 2B)

  #### **Node 2A: The Truth Question (Numbers Path)**
  **Do you care if the assumptions are true, as long as the prediction is accurate?**
  *   **No:** Truth is irrelevant; prediction is king.
      *   **→ LEAF 1: The Prediction Machine**
  *   **Yes:** I want accurate numbers, but I'm agnostic on whether the underlying mechanism is real.
      *   **→ LEAF 2: The Constructive Empiricist**

  #### **Node 2B: The Enactment Question (Story Path)**
  **Does the model describe a mechanism, or does it assemble one?**
  *   **Describes:** It maps a mechanism that exists out there.
      *   **→ LEAF 3: The Machine Assembly** *(Note: This path implies the model is a performative enactment of the phenomenon.)*
  *   **Assembles:** It builds a mechanism to see if it *could* work.
      *   **→ LEAF 3: The Machine Assembly** *(Consolidated for flow: You view the model as a machine you assemble so the phenomenon happens.)*

  *(Correction for Tree Logic: Let's split Node 2B to ensure distinct leaves.)*
  **Node 2B: The Reality Question (Story Path)**
  **Does the story have to be true, or just useful?**
  *   **True:** The mechanism must actually exist.
      *   **→ LEAF 3: The Machine Assembly**
  *   **Useful:** The mechanism just needs to be coherent.
      *   **→ LEAF 4: The Constructive Empiricist**

  ---

  ### **Node 3: The Recoverability Question**
  **If an assumption is known to be false, can you in principle replace it with a true one?**
  *   **Yes:** We could fix it if we had better data or math. (Go to Node 4)
  *   **No:** The assumption is essential to the model's structure. (Go to Node 5)

  ---

  ### **Node 4: The Intention Question**
  **Do you intend to fix these assumptions in future versions?**
  *   **Yes:** This version is just a placeholder.
      *   **→ LEAF 5: The First Pass**
  *   **No:** We are keeping the false assumption on purpose. (Go to Node 4B)

  #### **Node 4B: The Reason Question**
  **Why keep the false assumption?**
  *   **To Isolate:** Leaving things out is the only way to see the specific cause.
      *   **→ LEAF 6: The Deliberate Omission**
  *   **To Compute:** The truth is too complex to calculate in any reasonable time.
      *   **→ LEAF 7: The Pragmatic Necessity**

  ---

  ### **Node 5: The Robustness Question**
  **Does the result hold even if you change the false assumptions wildly?**
  *   **Yes:** The outcome is stable across many different false assumptions.
      *   **→ LEAF 8: The Robustness Realist**
  *   **No:** The result depends on the specific structure of the model. (Go to Node 6)

  ---

  ### **Node 6: The Ontology Question**
  **Where does the truth of the model reside?**
  *   **Nowhere:** The model is a prop; it doesn't make truth claims.
      *   **→ LEAF 9: The Fictionalist**
  *   **Internally:** It is true of the little imaginary system the model describes.
      *   **→ LEAF 10: The Parallel Worlder**

  ---

  ## **The Leaves: Positions & Awkward Commitments**

  1.  **The Prediction Machine:** False assumptions are fine because the model is only ever a prediction machine.
      *   *Awkward Commitment:* You must accept that a theory can be scientifically valuable even if every single one of its premises is a lie.
  2.  **The Constructive Empiricist:** The model saves the observable phenomena, but you remain agnostic about the unobservable mechanisms.
      *   *Awkward Commitment:* You must draw a sharp line between what is "observable" and what is not, which history suggests is impossible.
  3.  **The Machine Assembly:** The model is a machine you assemble so the phenomenon happens, and the assumptions are just parts of the machine.
      *   *Awkward Commitment:* You have to explain why building a fake machine in a computer tells you anything about the real one.
  4.  **The First Pass:** The assumptions are false but as a first pass, and you get nearer the truth by relaxing them one at a time.
      *   *Awkward Commitment:* You commit to a future where the model becomes more realistic, which often never happens.
  5.  **The Deliberate Omission:** The assumptions are false because the model deliberately leaves things out and that omission is the whole point.
      *   *Awkward Commitment:* You must defend why leaving out known causal factors makes the explanation better rather than worse.
  6.  **The Pragmatic Necessity:** The assumptions are false because we lack the computing power to model the truth.
      *   *Awkward Commitment:* You admit the model is technically wrong but claim we have no choice, which risks halting scientific progress.
  7.  **The Robustness Realist:** The assumptions are false, but the result holds across many different assumptions, so the falseness doesn't matter.
      *   *Awkward Commitment:* You must explain why the mechanism doesn't matter as long as the output is stable, which feels like magic.
  8.  **The Fictionalist:** The model isn't making claims about the world at all so the truth question never comes up.
      *   *Awkward Commitment:* You have to explain why we fund models that explicitly refuse to tell us what is true.
  9.  **The Parallel Worlder:** The assumptions have to be true of something—namely the little imaginary system the model describes.
      *   *Awkward Commitment:* You must accept that we are learning about a fantasy world and hoping it parallels our own.

  *(Note: To meet the 7-10 leaf constraint while maintaining logical flow, Leaf 2 and Leaf 3 in the tree section above were adjusted to ensure distinct philosophical positions. Leaf 3 "Machine Assembly" and Leaf 4 "Constructive Empiricist" are distinct in the final list.)*

  **Corrected Leaf List for Final Count (9 Leaves):**
  1. Prediction Machine
  2. Constructive Empiricist
  3. Machine Assembly
  4. First Pass
  5. Deliberate Omission
  6. Pragmatic Necessity
  7. Robustness Realist
  8. Fictionalist
  9. Parallel Worlder

  ---

  ## **Meta-Analysis: Gaps and Glitches**

  **Indistinguishable Pair:**
  *   **The Fictionalist (Leaf 8) and The Parallel Worlder (Leaf 9).**
  *   *Why:* In practice, treating a model as a "useful fiction" and treating it as "true only of an imaginary system" often leads to identical scientific behavior. Both refuse to map the assumptions directly to the real world. The tree separates them based on whether the model *claims* truth (Internal) or *refuses* truth (Nowhere), but readers may find this distinction hair-splitting.

  **Empty Combination:**
  *   **The Path:** Success Needs Explanation (Yes) → Recoverable (No) → Robust (No) → Truth Resides (Real World).
  *   *Status:* **Incoherent.**
  *   *Why:* If you believe success needs an explanation (Realism), but the assumptions are unfixable (No Recoverability), and the result isn't robust (depends on those specific false assumptions), you cannot consistently claim the model describes the Real World. You have no bridge between the false model and the real world. The tree forces you into Fictionalism or Parallel Worldism here because Realism is unavailable.

  **Unattractive Combination:**
  *   **The Path:** Success Needs Explanation (No) → Story (Yes) → True (Yes).
  *   *Status:* **Merely Unattractive.**
  *   *Why:* This leads to a position where you care about the story and its truth, but don't think success needs explaining. This is a passive realism that rarely motivates active research. Most people who care about the truth of the story also want to know *why* it works. The tree routes this toward **The Machine Assembly**, but it is a sparsely populated corner of the philosophy.
