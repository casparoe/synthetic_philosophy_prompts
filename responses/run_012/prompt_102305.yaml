prompt: |-
  I have recently been appointed to my college's Faculty Academic Integrity Board, and the first case to come before us has turned out to be uncomfortably close to home. I have been asked to draft the written opinion the Board will circulate and vote on at next Thursday's meeting, and I would like your help producing it.

  The case concerns a senior who submitted a laboratory report containing three consecutive paragraphs reproduced without attribution from a published article. She does not contest the facts. Her defense is that the charge was initiated by a classmate who sits on our student Honor Council and who, two years ago, was herself found to have copied answers on a problem set and was let off with a warning after her record was expunged under our confidentiality policy. The student argues that this classmate had no standing to accuse her, and that a process begun by a hypocrite cannot fairly end in her sanction. Our handbook is silent on the accuser's own record; it provides only that any member of the community may bring a charge.

  Two further complications bear on the opinion and not merely on my own conscience. First, three years ago this same Board declined to sanction a professor who had used a graduate student's writing without attribution, on the reasoning that his conduct fell below the threshold for discipline. Whatever we decide about the student, we are a body with a record. Second, and this is why I am writing to you rather than simply handing the matter to a colleague, I have lately rediscovered a seminar paper of my own, written as a graduate student, in which I borrowed several sentences without marking them as quotations. No one noticed; I was not disciplined. I am not sure what, if anything, that should mean for my role in this case, but I do not want to write an opinion that quietly exempts me.

  Please draft the opinion. It should recommend a concrete course of action, whether to proceed, to decline, or to proceed subject to stated conditions, and it should give a time frame for it. It should treat the standing objection seriously rather than dismissing it as an excuse, and it should distinguish clearly between the question whether the student did what she is accused of and the question whether the person who accused her, or the body judging her, is entitled to do so. It should say whether the Board ought to address its own past decision and whether I ought to recuse myself. And it should state, in a form my colleagues can act on, the strongest argument for the course we are not taking. Assume that no one on the Board will consult any outside source before the vote; the reasoning has to stand on its own.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Faculty Academic Integrity Board (FAIB).
      *   **Task:** Draft the written opinion for the Board to circulate and vote on.
      *   **Case Details:** Senior student submitted a lab report with three consecutive paragraphs plagiarized from a published article. Facts are uncontested.
      *   **Defense:** The accuser is a student Honor Council member who was previously sanctioned (expunged warning) for cheating two years ago. The defendant argues the accuser has no standing/hypocrisy invalidates the process.
      *   **Policy:** Handbook allows *any* community member to bring a charge. Silent on accuser's record.
      *   **Complication 1 (Precedent):** 3 years ago, the Board declined to sanction a professor for similar conduct (using grad student's writing without attribution), citing a threshold for discipline.
      *   **Complication 2 (Personal):** The drafter (me) discovered their own past unacknowledged borrowing in a grad seminar paper. No one noticed, no discipline.
      *   **Requirements:**
          *   Recommend a concrete course of action (proceed, decline, conditions) + time frame.
          *   Treat the standing objection seriously (not just an excuse).
          *   Distinguish between *actus reus* (did she do it?) and *standing/authority* (can we judge?).
          *   Address the Board's past decision (the professor case).
          *   Address the drafter's recusal status.
          *   State the strongest argument for the *rejected* course of action (counter-argument).
          *   Reasoning must stand on its own (no outside sources).
          *   Tone: Formal, judicial, ethical, reflective.

  2.  **Determine the Core Ethical & Procedural Issues:**
      *   **Plagiarism:** Three consecutive paragraphs is significant. It's not accidental citation error; it's reproduction. Facts uncontested.
      *   **Standing/Hypocrisy:** Does the accuser's past matter? Legally/procedurally, usually no (anyone can report a crime). Ethically, it feels messy. The argument is about "unclean hands."
      *   **Equality/Precedent:** The professor case suggests a double standard if the student is harshly punished while the professor walked. This undermines the Board's legitimacy.
      *   **Personal Integrity:** The drafter's past misconduct creates a conflict of interest or at least a need for transparency. To write an opinion condemning plagiarism while hiding one's own is hypocritical.
      *   **Goal:** Uphold integrity without collapsing into nihilism ("everyone cheats, so why punish?").

  3.  **Formulate the Decision:**
      *   *On the Student:* The facts are clear. Plagiarism occurred. The defense (accuser's history) is procedurally weak but ethically poignant. The Board must uphold the standard, but perhaps mitigate the sanction given the context? No, the prompt asks for a recommendation on whether to *proceed* or *decline*. Given the uncontested facts, declining to find a violation would undermine the policy. However, the sanction phase is separate. The opinion should recommend *proceeding to sanction* but acknowledging the complexities.
      *   *On the Accuser:* Dismiss the standing objection. The rule is "any member." Past expungement means the record is clean officially, but even if not, reporting misconduct is a civic duty not forfeited by past errors.
      *   *On the Board (Professor Case):* Must address this. If we punish the student strictly after letting the professor go, we look biased. We need to distinguish the cases or acknowledge the error. Distinguishing is better for institutional stability (faculty vs. student responsibilities might differ, or the extent of copying differed). However, honesty is crucial. I should argue that the Board must reaffirm its standards apply equally, implicitly critiquing the past leniency without reopening the closed case.
      *   *On the Drafter (Recusal):* This is tricky. If I recuse, I can't draft the opinion. If I don't recuse, I must disclose. The prompt asks me to draft the opinion *for the Board*. It implies I am writing *as* a member. The ethical move is to disclose the past in the opinion (or in a cover memo) and argue *against* recusal based on the universality of the standard, OR recuse myself from the vote but draft the opinion for the chair. The prompt says "I have been asked to draft the written opinion the Board will circulate." It also asks "whether I ought to recuse myself."
      *   *Decision on Recusal:* I should recommend *against* recusal but with full disclosure in the record. Why? Because if past uncaught plagiarism disqualifies everyone from judging plagiarism, no one can judge. However, to maintain integrity, I must state that I am holding myself to the standard I am enforcing. *Correction:* Actually, the most ethically robust position for a *draft* intended for vote is to disclose the conflict and let the Board decide, but since *I* am writing the opinion *for* the Board to adopt, I should write it in the voice of the Board. But the prompt asks me to address "whether I ought to recuse myself" *in the opinion*. This suggests the opinion should include a section on the Board's composition/integrity.
      *   *Refinement:* The opinion is the Board's voice. I cannot write "I, the drafter, did this." I must write "The Board notes..." However, the prompt asks me to address *my* recusal. I will structure this as a "Memorandum of Opinion" where I, as the reporting member, include a disclosure. Or, more likely, I write the Board's opinion but include a specific section on "Board Integrity and Recusal" where I state my position. Let's go with the latter: The Opinion of the Board, with a specific concurring/disclosing note from the drafter, or integrated into the reasoning.
      *   *Better approach:* The prompt asks me to "draft the opinion." It also asks the opinion to say "whether I ought to recuse myself." This implies the opinion should explicitly handle the drafter's status. I will write the opinion as the Board's finding, but include a specific section regarding the composition of the voting body and the drafter's disclosure.
      *   *Wait, looking closer:* "It should say... whether I ought to recuse myself." This implies the document itself should resolve this. I will recommend *not* recusing, based on the principle that enforcement cannot depend on the sinlessness of the enforcer, provided there is full disclosure.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Board formatting.
      *   **Introduction:** State the charge, the uncontested facts.
      *   **Finding of Fact:** Confirm the plagiarism.
      *   **The Standing Objection:** Address the accuser's history. Rule: Standing is not forfeited by past misconduct. Expungement reinforces this. The "hypocrisy" argument is rejected as a procedural matter but acknowledged as a moral tension.
      *   **The Board's Precedent (The Professor):** Address the 3-year-old case. Distinguish it (perhaps severity or role expectations) but affirm that *current* standards require consistency. Acknowledge the appearance of inequality. Commit to equal application going forward.
      *   **The Drafter's Disclosure (Recusal):** This needs to be handled delicately. I will include a "Statement of Integrity" within the opinion. I will disclose my past, argue that recusal sets a dangerous precedent (only the perfect can judge), but submit to the Board's will. *Actually, the prompt asks me to decide.* I will recommend *against* recusal but with the disclosure entered into the permanent record.
      *   **Recommendation/Sanction:** Proceed to sanction. Three paragraphs is serious. However, given the "culture of plagiarism" revealed by the Board/Professor/Drafter history, maybe a sanction that emphasizes education? No, keep it firm. Sanction is necessary for integrity.
      *   **Counter-Argument:** State the strongest case for *dismissal*. (i.e., The process is tainted by hypocrisy, institutional credibility is low, punishing the student while the system is flawed is unjust).
      *   **Time Frame:** Immediate effect, sanction within 10 days.

  5.  **Refining the Tone:**
      *   Must be solemn, not defensive.
      *   Must not sound like a personal confession letter, but an institutional document that *includes* necessary confessions for the sake of transparency.
      *   The "Personal" element (my grad paper) is the hardest. If I put it in the Board's opinion, it becomes public record. Is that allowed? The prompt says "draft the written opinion the Board will circulate." If I disclose my cheating in the public opinion, that's brave but potentially career-ending. However, the prompt says "I do not want to write an opinion that quietly exempts me." This implies I *must* address it. I will frame it as a disclosure to the Board *within* the document, perhaps as an annex or a specific "Note on Recusal" that is part of the internal voting packet but maybe redacted for the public file?
      *   *Re-reading:* "draft the written opinion the Board will circulate and vote on." This is an internal document for the Board *before* the vote? Or the final decision sent to the student? "Circulate and vote on at next Thursday's meeting." This sounds like the *deliberative draft* for the Board members. Okay, that allows for more candor regarding my own past and the Board's past. It is an internal working document.
      *   *Correction:* Usually, an "Opinion" is the final output. But "circulate and vote on" suggests it's the proposed finding. I will treat it as the formal Findings and Recommendations document that will become the record. I must balance transparency with the confidentiality of the student case. My own confession should be in the record but perhaps handled as a "Memorandum for the Board" attached to the Opinion?
      *   *Decision:* I will integrate it into the "Integrity of the Tribunal" section. It needs to be explicit. "The reporting member discloses..."

  6.  **Addressing Specific Constraints:**
      *   *Concrete course of action:* Find violation, recommend sanction.
      *   *Time frame:* Sanction hearing within 10 days.
      *   *Standing objection:* Treat seriously.
      *   *Distinction:* Act vs. Authority.
      *   *Board's past:* Address the professor case.
      *   *Recusal:* Address my status.
      *   *Counter-argument:* Strongest case for dismissal.

  7.  **Drafting - Step-by-Step:**

      *   *Title:* In the Matter of [Student ID].
      *   *Section 1: Facts.* Uncontested. 3 paragraphs.
      *   *Section 2: The Standing Objection.* Accuser's record is irrelevant to the truth of the charge. Expungement policy supports this. Hypocrisy does not negate facts.
      *   *Section 3: Institutional Consistency.* The Professor Case. We must acknowledge the tension. We cannot undo the past, but we must apply standards equally now.
      *   *Section 4: Tribunal Integrity (The Recusal Issue).* Here I disclose my past. I argue that recusal is not required because the standard is objective, but disclosure is required for transparency.
      *   *Section 5: Recommendation.* Violation found. Sanctioning phase to begin.
      *   *Section 6: The Argument for Dismissal.* (The Counter-argument).
      *   *Section 7: Timeline.*

  8.  **Self-Correction/Polishing:**
      *   *Tone Check:* Is it too personal? I need to ensure the "I" doesn't overwhelm the "Board." I will use "The Reporting Member" for the disclosure part.
      *   *Ethical Check:* Is it fair to punish the student if the Board admits it's flawed? Yes, because the standard exists. The flaw is in enforcement history, not the rule itself. The opinion must emphasize that *future* consistency is the remedy, not *current* impunity.
      *   *The "Hypocrite" Argument:* This needs nuance. It's not just "rules are rules." It's "the duty to uphold integrity belongs to everyone, especially those who have failed at it."
      *   *The Professor Case:* Don't throw the previous Board under the bus too hard, but don't whitewash. "Different circumstances" is weak. Better to say "The Board reaffirms that standards apply to all ranks, acknowledging past determinations may not reflect current rigor."
      *   *My Past:* "I discovered... borrowed several sentences." I need to state this clearly. "The Reporting Member places on the record..."

  9.  **Final Review against Prompt:**
      *   Concrete action? Yes (Find violation, sanction).
      *   Time frame? Yes (10 days).
      *   Standing objection treated seriously? Yes (dedicated section).
      *   Distinguish act vs. authority? Yes.
      *   Address Board's past? Yes.
      *   Address recusal? Yes.
      *   Strongest counter-argument? Yes.
      *   No outside sources? Yes.

      *(Self-Correction on Recusal)*: If I am drafting the opinion *for the Board to vote on*, I am essentially the clerk or the chair. If I have a conflict, standard procedure is recusal. However, the prompt asks me to argue *whether* I ought to recuse. If I argue *against* recusal, I remain on the Board. If I argue *for* recusal, I should probably not be drafting the binding opinion. I will argue *against* recusal but with disclosure, allowing the Board to vote on my participation. This fits the "vote on at next Thursday's meeting" instruction.

      *Wait, one more nuance:* The prompt says "I have been asked to draft the written opinion the Board will circulate and vote on." This implies I am a voting member. If I recuse, I don't vote. If I draft the opinion, I am shaping the outcome. The most honest path: Disclose in the text, recommend *against* recusal based on the principle that imperfect enforcers are necessary, but submit the question of my participation to the other members.
      *Actually, the cleanest ethical move for the document:* I will write the opinion as the Board's voice, but include a specific "Disclosure and Recusal Determination" section where I state my position and recommend that I *not* recuse, subject to the Board's approval. This allows the "vote" to cover both the case and my participation.

      *Wait, looking at the "Professor Case" again:* "Three years ago this same Board declined to sanction a professor." This is a precedent. If I distinguish it too much, it looks like special pleading. If I admit it was wrong, it undermines the Board. I will frame it as: "The Board recognizes that the appearance of disparate treatment undermines confidence. While the prior determination stands, the Board commits to parity of standard moving forward."

      *Let's write.*

      *(Final thought on the "Personal" disclosure)*: The prompt says "I do not want to write an opinion that quietly exempts me." This means the opinion itself must reflect that I am not exempt. I will include the disclosure in the body of the opinion as a matter of record.

      *(Final thought on the "Standing" argument)*: The student argues the accuser has no standing. The handbook says "any member." I must uphold the handbook but acknowledge the moral weight. The argument is: "One who has stumbled is often best positioned to spot the pitfall."

      *(Final thought on Counter-Argument)*: The strongest argument for the course *not* taken (Dismissal). I need to articulate why dismissal *would* be a valid moral choice (institutional estoppel), even if I reject it legally.

      *Okay, ready to draft.*
answer: |-
  **FACULTY ACADEMIC INTEGRITY BOARD**
  **DRAFT OPINION AND FINDINGS OF FACT**
  **In the Matter of Student Case #24-09**
  **Date:** [Current Date]
  **To:** The Faculty Academic Integrity Board
  **From:** [Your Name/Title], Reporting Member
  **Subject:** Recommendation Regarding Alleged Academic Misconduct

  ### I. Statement of Facts

  The Board is convened to review a charge of academic dishonesty brought against a senior undergraduate student (the "Respondent"). The charge alleges that the Respondent submitted a laboratory report containing three consecutive paragraphs reproduced verbatim from a published article without attribution or quotation marks.

  The Respondent does not contest the factual accuracy of this allegation. The textual overlap is demonstrable and significant. The sole contention raised by the Respondent concerns the standing of the accuser and the integrity of the Board itself, rather than the commission of the act.

  ### II. The Question of Standing and the "Unclean Hands" Defense

  The Respondent argues that the charge should be dismissed because the accuser—a member of the student Honor Council—was herself sanctioned two years ago for copying answers on a problem set. The Respondent contends that a process initiated by a "hypocrite" lacks moral authority and that the accuser forfeited her standing to enforce rules she once broke.

  The Board takes this objection seriously. It is not merely a procedural technicality; it strikes at the perceived legitimacy of our community's self-governance. A system where the accuser is viewed as morally compromised risks appearing vindictive rather than restorative.

  However, the Board must distinguish between the *moral standing* of the accuser and the *procedural authority* to report a violation. Our Handbook explicitly states that "any member of the community may bring a charge." It places no condition on the past record of the complainant. To read such a condition into the policy would be to judicially amend the Handbook without faculty or student consent.

  More importantly, the Board rejects the premise that past misconduct disqualifies one from upholding integrity. To hold otherwise would imply that only the sinless may enforce the law, a standard that would paralyze any judicial body. The accuser's prior sanction, which was expunged in accordance with policy, signifies that she paid a debt to the community and was reintegrated. Her willingness to report a violation, despite her own history, may arguably demonstrate a renewed commitment to the Honor Code rather than a lack of standing. The truth of the charge is independent of the messenger. Therefore, the Board finds that the accuser had standing to initiate the charge, and the Respondent's defense on these grounds is denied.

  ### III. Institutional Consistency and Precedent

  The Board is aware of a determination made three years prior, in which a faculty member was found to have used a graduate student's writing without attribution but was not sanctioned. The Board reasoned at that time that the conduct fell below the threshold for discipline.

  We recognize that deciding to sanction a student for plagiarism while a faculty member previously escaped sanction for similar conduct creates an appearance of inequity. It suggests a two-tiered system of justice. The Board cannot undo the past decision, nor can we reopen a closed case without violating principles of finality. However, we are not bound by prior leniency to enforce future weakness.

  The Board acknowledges that the prior decision has complicated our current moral position. To maintain the integrity of the Code, we must affirm that the standard for attribution applies equally to all ranks, even if past enforcement has been inconsistent. We cannot remedy the appearance of inequality in the past by manufacturing inequality in the present. The correct remedy is to apply the standard rigorously now, while explicitly noting our commitment to parity in future cases involving faculty or staff.

  ### IV. Disclosure and Recusal of the Reporting Member

  In the interest of full transparency, and because this opinion will serve as the record for the Board's vote, the Reporting Member places the following on the record:

  Upon reviewing the materials for this case, the Reporting Member rediscovered a seminar paper from their own graduate tenure in which several sentences were borrowed from a source without explicit quotation marks. This was not discovered at the time; no discipline was imposed.

  The Reporting Member has considered whether this necessitates recusal.
  *   **Argument for Recusal:** A judge who has committed the same offense may be perceived as biased, either toward undue leniency (out of solidarity) or undue harshness (to overcompensate).
  *   **Argument Against Recusal:** If past unadjudicated misconduct disqualifies all faculty from serving on Integrity Boards, the Board cannot function. The standard we enforce is objective: did the borrowing occur without attribution? The Reporting Member's past does not change the facts of the current case.

  **Recommendation on Recusal:** The Reporting Member recommends *against* recusal, provided this disclosure remains part of the permanent record of this case. To recuse myself on the basis of uncaught past misconduct would be to claim a standard of perfection for the judges that we do not demand of the accused. It would privilege secrecy over accountability. I will participate in the vote, but I do so with the public acknowledgment that I am subject to the same standard I am now enforcing.

  ### V. Recommendation and Time Frame

  Based on the uncontested facts, the Board finds that a violation of the Academic Integrity Policy has occurred. The defense regarding the accuser's standing is procedurally invalid. The Board's past inconsistencies and the Reporting Member's disclosure, while morally weighty, do not negate the Respondent's action.

  **Course of Action:** The Board should proceed to the sanctioning phase.
  **Time Frame:** The sanctioning hearing should be scheduled within ten (10) business days of this vote.

  ### VI. The Strongest Argument for the Alternative Course (Dismissal)

  In voting, colleagues should weigh the strongest argument for the course we are *not* recommending: that the Board should dismiss the charge entirely.

  The argument for dismissal rests on the doctrine of institutional estoppel. By failing to sanction the professor three years ago, and by populating this Board with members (including the drafter) who have engaged in unacknowledged borrowing, the institution has implicitly signaled that strict attribution is not a binding norm but a selective tool. To punish this student now, while the system remains opaque about its own failures, makes her a scapegoat for institutional hypocrisy. Dismissal would be a recognition that the Board lacks the moral clean hands required to judge. It would prioritize the integrity of the *process* over the enforcement of the *rule*, acknowledging that a verdict rendered by a compromised body is itself a form of injustice.

  ### VII. Conclusion

  We reject the argument for dismissal. While the Board's history and the accuser's past complicate the moral landscape, they do not erase the fact of plagiarism. To decline sanction would be to abandon the standard entirely. We uphold the charge not because we are perfect, but because the standard remains necessary. We proceed with the understanding that our authority is derived from our commitment to the truth, even when that truth reflects poorly on us.

  **Recommended Vote:**
  [ ] Find Violation / Proceed to Sanction
  [ ] Dismiss Charge
  [ ] Recuse Reporting Member

  _________________________
