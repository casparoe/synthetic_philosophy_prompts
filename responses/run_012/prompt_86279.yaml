answer: |-
  Your friend has given you a very clean, classic presentation of the Epicurean position, but he has significantly overstated the consensus and smuggled in a controversial definition of "harm" as if it were a neutral premise.

  Here is the breakdown of what a professional philosopher working on the metaphysics of death would nod at, wince at, or reject flatly.

  ### 1. The "No Subject" Argument vs. The Deprivation Account
  **Friend's Claim:** Badness requires a subject to experience it. Since the dead have no experience, death cannot be bad for them.
  **Verdict:** **Flatly Wrong (as a proof).**

  This is the crux of the debate. Your friend is presenting the **Experience Requirement** as a self-evident axiom. In contemporary analytic philosophy, this is not treated as a proof; it is treated as a premise that is widely rejected.

  The dominant counter-view is the **Deprivation Account**. The intuition here is that harm is not just about experiencing pain (intrinsic badness); it is also about being deprived of goods (extrinsic badness).
  *   **The Unconscious Mugging:** If you are drugged, robbed, and wake up with no memory of it, you have been harmed. You didn't experience the violation, but your interests were set back.
  *   **The Coma:** If you are in a coma for a year and wake up, you have lost a year of life. That loss is bad for you, even if the year itself contained no suffering because you weren't conscious.

  Philosophers who hold the Deprivation view argue that death is the ultimate deprivation. It isn't bad because being dead feels like something (it doesn't); it's bad because it stops you from having experiences that *would have been* good. Your friend's "proof" only works if you accept his definition of harm, which excludes deprivation by fiat. Most philosophers do not accept that exclusion.

  ### 2. The Consensus Claim
  **Friend's Claim:** "Most contemporary philosophers agree Epicurus was essentially right and the rest is just details."
  **Verdict:** **Flatly Wrong.**

  This is the most misleading part of your friend's steelman. While Epicurus is respected for framing the problem, the consensus in 20th and 21st-century analytic philosophy is actually *against* Epicurus on the core question. The Deprivation Account is generally considered the standard view.

  Philosophers agree with Epicurus that *being dead* is not a state of suffering (no one thinks the dead are in pain). But they disagree that death is therefore "nothing to us." They argue it is a misfortune comparable to a tragedy that happens to you while you are asleep: you don't feel it, but it is still bad for you. Your friend is presenting a minority view (or an ancient one) as the settled scientific consensus.

  ### 3. The Timing Problem
  **User's Question:** Is there a puzzle about *when* the harm occurs?
  **Verdict:** **Nod Along (It's a real puzzle, but doesn't save Epicurus).**

  You remembered correctly. This is known as the **Timing Problem**. If death is a harm, *when* does the harm befall the subject?
  *   **Before death?** No, you're still alive.
  *   **During death?** That's the process of dying, which is separate from the state of being dead.
  *   **After death?** There is no "you" to be harmed.

  Epicureans use this to say, "See? The harm has no location in time, so it doesn't exist."
  Deprivationists accept the puzzle but offer solutions. The most common is that the harm is **timeless** or **relational**. It is a fact about the whole of your life that it was cut short. Another view is that the harm occurs at the time the *cause* of death happens (e.g., the moment the bullet hits), even if the deprivation lasts forever.

  Philosophers take this puzzle seriously, but solving it is seen as a technical metaphysical hurdle, not a disproof of the harm itself. It doesn't validate Epicurus; it just complicates the Deprivation Account.

  ### 4. The Symmetry Argument (Lucretius)
  **Friend's Claim:** Fearing post-death non-existence is irrational because it's symmetric to pre-birth non-existence, which we don't fear.
  **Verdict:** **Wince (Strong argument, but not a "full stop").**

  This is the **Lucretian Symmetry Argument**. It is a powerful intuition pump, but it is not a logical knockout.
  *   **The Symmetry:** Both are states of non-existence. If you don't regret the time before you were born, why regret the time after you die?
  *   **The Asmetry:** Philosophers (like Derek Parfit) have argued there is a rational asymmetry in how we view time. We generally care more about future goods than past goods. If you had to choose between ten years of pleasure in the past or ten years in the future, you'd choose the future. This isn't necessarily a bias; it might be a structural feature of rational agency. We are oriented toward the future.
  *   **The Metaphysical Difference:** Some argue you *could not* have been born earlier (you wouldn't be *you*), whereas you *could* have died later (and still been *you*). This makes the loss of future life a loss of *your* life, whereas earlier birth would have been a different life entirely.

  So, while the Symmetry Argument is a strong check on our emotions, calling the fear of death "irrational bias, full stop" is too aggressive. It ignores the rational preference for future existence over past existence.

  ### Summary Verdict

  *   **What to Nod At:** Death (the state) is not a state of suffering. The process of dying is the only part that involves direct pain. The Symmetry Argument is a useful tool for reducing anxiety.
  *   **What to Wince At:** The claim that the Timing Problem dissolves the harm. The claim that fearing future non-existence is identical to ignoring past non-existence.
  *   **What is Flatly Wrong:** The claim that "badness requires experience" is a proven axiom. The claim that most contemporary philosophers agree with Epicurus's conclusion.

  **The Bottom Line:** Your friend has steelmanned Epicurus by presenting his premises as conclusions. The "Deprivation Account" slips right past the "No Subject" argument because it redefines harm from "experienced pain" to "lost opportunity." If you accept that losing future goods is a harm even if you don't experience the loss, Epicurus's proof collapses. Your intuition that death is bad is shared by the majority of working philosophers; your friend's confidence that Epicurus "solved" it is the outlier position.
