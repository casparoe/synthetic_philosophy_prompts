prompt: |-
  I'm the research editor at a small popular-history magazine. Part of my job is triaging pitches and manuscripts that make big unorthadox claims -- a lost Ice Age civilization, the pyramids being poured concrete, Fomenko's re-dating of basically all of ancient history, ancient astronauts hidden in the Sumerian texts. Right now its mostly vibes: if it feels crankish we pass. That's burned us twice this year, once by publishing something we shouldn't have and once by passing on something that later turned out to be respectable. I want a procedure I can actually run on a manuscript in half an hour, and that my two interns could run without me. It should end in one of three verdicts: treat as ordinary scholarship, publish but flag as contested, or decline as pseudohistory. Ground it in whatever the demarcation literature actually settled -- I gather not much, so be honest about that -- and keep it usable by someone who hasn't read any of it. Order the questions, say what counts as a good enough answer to each, and mark the spots where it stops being a factual question and becomes an editorial call I have to sign off on myself. Then run it on three cases: Fomenko, the ancient-astronaut reading of Sumerian texts, and the pre-Clovis migration fight, where the fringe side basically won. Tell me where it hands me an answer I won't like, and name one boundary it must not cross -- I don't want a rubric that quietly classifies religious or political conviction as pseudohistory just because it makes empirical claims.
reasoning: |-
  Here's a thinking process that leads to the suggested triage protocol:

  1.  **Analyze the Request:**
      *   **Role:** Research Editor at a small popular-history magazine.
      *   **Task:** Create a 30-minute triage protocol for manuscripts making unorthodox claims (e.g., lost civilizations, alternative chronologies, ancient astronauts).
      *   **Users:** Editor + 2 Interns (needs to be clear, actionable, not requiring deep philosophy of science knowledge).
      *   **Output:** Three verdicts (Ordinary Scholarship, Publish/Flag, Decline/Pseudohistory).
      *   **Constraints:**
          *   Ground in demarcation literature (but be honest about its limits).
          *   Order the questions.
          *   Define "good enough" answers.
          *   Identify "Editorial Call" spots (where human judgment is needed).
          *   Test on three cases: Fomenko (New Chronology), Ancient Astronauts/Sumer, Pre-Clovis migration (fringe that won).
          *   Identify uncomfortable answers.
          *   Name one boundary it must *not* cross (religious/political conviction vs. pseudohistory).

  2.  **Deconstruct the "Demarcation Problem":**
      *   *Philosophy of Science Context:* Popper (falsifiability), Kuhn (paradigms), Lakatos (research programmes), Thagard (progressive vs. degenerative).
      *   *Reality Check:* There is no algorithmic "pseudohistory detector." It's about *practices*, not just *claims*.
      *   *Key Indicators of Pseudohistory:* Immunity to counter-evidence, lack of engagement with mainstream scholarship, reliance on conspiracy, selective use of data, lack of peer review (or creating fake journals), shifting goalposts.
      *   *Key Indicators of Legitimate Revisionism:* Engages with existing data, proposes testable hypotheses, admits limitations, published in reputable venues (or attempting to be), builds on prior work.

  3.  **Drafting the Protocol (The "30-Minute Triage"):**
      *   *Goal:* Needs to be a checklist.
      *   *Structure:* Three phases (Source/Author, Argument/Evidence, Engagement).
      *   *Verdicts:* Green (Ordinary), Yellow (Flagged), Red (Decline).
      *   *Editorial Call:* Where does the intern stop and the editor start? Usually when the evidence is ambiguous or the stakes are high.

      *   *Drafting Questions:*
          1.  Does the author engage with the standard view? (Crucial distinction: ignoring vs. refuting).
          2.  Is the evidence testable/falsifiable? (Popper-lite).
          3.  Where has this been published before? (Peer review check).
          4.  Does it rely on conspiracy? (If mainstream scholars disagree, is it because they are incompetent/evil?).
          5.  Is the methodology consistent? (Or ad hoc?)

      *   *Refining for Interns:* Make it binary where possible. Yes/No/Maybe.
      *   *Defining the "Editorial Call":* The protocol shouldn't automate the final decision on "Yellow" cases. That's the editor's job.

  4.  **Testing the Cases:**

      *   **Case 1: Anatoly Fomenko (New Chronology).**
          *   *Claim:* History is compressed; Jesus lived in 12th century; Pyramids are medieval.
          *   *Protocol Check:* Ignores standard dating methods (C14, dendro), claims conspiracy of historians, no peer review in history journals, math methods misapplied.
          *   *Verdict:* Decline (Pseudohistory).
          *   *Fit:* Should pass easily.

      *   **Case 2: Ancient Astronauts/Sumer.**
          *   *Claim:* Anunnaki are aliens.
          *   *Protocol Check:* Translation issues (ignores linguists), "mystery" = aliens (argument from ignorance), no physical evidence, relies on Erich von Däniken (discredited).
          *   *Verdict:* Decline (Pseudohistory).
          *   *Fit:* Should pass easily.

      *   **Case 3: Pre-Clovis Migration.**
          *   *Claim:* Humans in Americas before 13,000 years ago.
          *   *Context:* Was fringe in 1990s, now consensus (Meadowcroft, Monte Verde).
          *   *Protocol Check:* Engages with stratigraphy, offers datable material, published in *American Antiquity* eventually, admits uncertainty.
          *   *Verdict:* This is the trap. If run *in 1995*, a rigid protocol might flag this as pseudohistory because it contradicts the "Clovis First" paradigm.
          *   *Adjustment:* The protocol needs to distinguish between "contradicts consensus" and "ignores methodology." Pre-Clovis proponents used *better* methodology, not *no* methodology.
          *   *Verdict:* Publish/Flag (if early) -> Ordinary (if late).
          *   *Lesson:* The protocol must value *method* over *consensus*.

  5.  **Addressing the Constraints:**
      *   *Uncomfortable Answer:* The protocol might flag legitimate but radical interdisciplinary work as "Yellow" because it looks weird. I need to acknowledge that "Yellow" isn't a death sentence, it's "Editor Review."
      *   *The Boundary:* Do not classify religious/political claims as pseudohistory *unless* they make empirical historical claims that violate methodological naturalism. E.g., "God willed it" is theology. "God moved this mountain in 500 BC and here is the soil sample" is history/archaeology. The boundary is *empirical testability*, not *content*.

  6.  **Refining the Protocol (Iterative Polish):**
      *   Make it a flowchart style but in text.
      *   Ensure the "Editorial Call" is explicit.
      *   Ensure the "Demarcation" basis is cited (Thagard/Lakatos simplified).
      *   *Self-Correction on Pre-Clovis:* I need to make sure the protocol doesn't just say "Is it consensus?" because that kills innovation. It must ask "Is the *reason* for rejection methodological or just dogmatic?" Since interns can't judge methodology deeply, they need to look for *engagement* with critics. Pre-Clovis proponents engaged with critics. Fomenko did not.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the philosophical limits (no perfect algorithm).
      *   **The Protocol:** The "30-Minute Triage."
      *   **The Verdicts:** Definitions.
      *   **The Test Run:** Fomenko, Astronauts, Pre-Clovis.
      *   **The Uncomfortable Truth:** Where the rubric fails.
      *   **The Boundary:** Religion/Politics.

  8.  **Drafting the Content (Mental Check of specific points):**
      *   *Demarcation:* Cite Thagard (1978) on "progressive vs degenerative" and Lakatos. Keep it simple: "Does it explain new things or just excuse old failures?"
      *   *Intern Safety:* If they check "Yes" on Conspiracy, it's an automatic Red.
      *   *Editorial Call:* If it's a "Yellow," the Editor decides. Interns don't publish Yellows.
      *   *Pre-Clovis Nuance:* In the 90s, a Pre-Clovis pitch would trigger "Contradicts Consensus." But it would pass "Engages with Critics" and "Offers Testable Data." So it lands in Yellow (Editor Review), which is correct. The Editor (expert) sees the data quality. The Intern sees the heat. This protects the magazine.

  9.  **Final Review against constraints:**
      *   30 mins? Yes, checklist is short.
      *   Intern usable? Yes, avoids jargon.
      *   3 Verdicts? Yes.
      *   Demarcation grounded? Yes (Thagard/Lakatos simplified).
      *   3 Cases run? Yes.
      *   Uncomfortable answer identified? Yes (the "Yellow" pile).
      *   Boundary named? Yes (Empirical vs. Metaphysical).

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is a triage protocol designed for your constraints. It is grounded in the philosophy of science (specifically Imre Lakatos's "research programmes" and Paul Thagard's criteria for pseudoscience), simplified for non-specialists.

  ### The Philosophy (For You, Not The Interns)
  There is no algorithmic test for truth. The demarcation literature (Popper, Kuhn, Lakatos, Thagard) agrees on one thing: **Pseudohistory is defined by behavior, not claims.** A claim can be wrong and still be history. A claim is pseudohistory when the *method* protects it from ever being proven wrong.

  The protocol below detects **degenerative research practices** (ignoring counter-evidence, ad-hoc excuses, conspiracy) rather than **unorthodox conclusions**.

  ---

  ### The 30-Minute Triage Protocol
  **User:** Interns
  **Time:** 30 Minutes max per manuscript
  **Tools:** Google Scholar, Library Database, Search Engine

  #### Phase 1: The Author & Venue (5 Minutes)
  *Goal: Check for institutional engagement.*

  1.  **Has the author published this specific claim in a peer-reviewed history/archaeology journal?**
      *   *Yes:* Go to Phase 2.
      *   *No:* Is there a clear reason (e.g., independent scholar submitting first work)?
      *   *No + Self-Published/YouTube/Blog only:* **STOP.** Mark as **RED FLAG**.
  2.  **Does the author cite mainstream scholarship relevant to their claim?**
      *   *Yes:* They list specific opponents (e.g., "Contrary to Smith (2020)...").
      *   *No:* They refer to "historians" or "academics" as a faceless blob. **STOP.** Mark as **RED FLAG**.

  #### Phase 2: The Argument Structure (15 Minutes)
  *Goal: Check for falsifiability and consistency.*

  3.  **The "Conspiracy" Check:** When the author addresses why mainstream scholars disagree with them, what is the reason given?
      *   *A:* Mainstream scholars are mistaken due to new data/methods. (**GREEN**)
      *   *B:* Mainstream scholars are protecting a paradigm/grant money/reputation. (**YELLOW**)
      *   *C:* Mainstream scholars are part of a coordinated cover-up (e.g., "The Vatican hid this"). (**RED - AUTOMATIC DECLINE**)
  4.  **The "Mystery" Check:** Does the argument rely on "We can't explain X, therefore Y"?
      *   *Example:* "We don't know how they moved these stones, therefore aliens/lost tech did it."
      *   *If Yes:* **RED FLAG.** (Argument from Ignorance).
      *   *If No:* They propose a mechanism that can be tested (e.g., "If we test this soil, we will find..."). (**GREEN**)
  5.  **The "Moving Goalpost" Check:** If the author mentions previous evidence against their theory, do they explain why that evidence is flawed methodologically?
      *   *Yes:* (e.g., "That C14 date was contaminated because...") (**GREEN**)
      *   *No:* They ignore it or say it's "irrelevant." (**RED FLAG**)

  #### Phase 3: The Stakes (10 Minutes)
  *Goal: Identify the Editorial Call.*

  6.  **Does this claim contradict a foundational consensus (e.g., timeline, geography)?**
      *   *No:* Treat as **Ordinary Scholarship**.
      *   *Yes:* Proceed to Verdict.

  ---

  ### The Verdicts

  **1. DECLINE (Pseudohistory)**
  *   **Criteria:** Any **RED FLAG** in Phase 1 or 2. Specifically: Reliance on conspiracy (C), Argument from Ignorance, or total lack of engagement with specific critics.
  *   **Action:** Form rejection. Do not send to Editor.

  **2. PUBLISH BUT FLAG (Contested/Revisionist)**
  *   **Criteria:** **YELLOW** in Phase 2 (Question 3), OR passes Phase 1 & 2 but triggers **Yes** in Phase 3 (Contradicts Consensus).
  *   **Action:** **EDITORIAL CALL.** Intern passes to you. You must decide if the methodology is robust enough to warrant platforming a minority view. If published, requires an editor's note or companion piece from a mainstream scholar.

  **3. TREAT AS ORDINARY SCHOLARSHIP**
  *   **Criteria:** All **GREEN**. Author engages with critics, offers testable data, no conspiracy, published or publishable in peer venues.
  *   **Action:** Standard peer review process.

  ---

  ### The "Editorial Call" Boundary
  **Where the Intern Stops and You Start:**
  The protocol hands you the **YELLOW** verdicts.
  *   **Why:** This is where "Fringe" meets "Frontier." A manuscript might argue a conspiracy (Yellow) but have compelling archival data. Or it might contradict consensus (Phase 3) but use perfect methodology (Pre-Clovis).
  *   **Your Job:** You must assess the *quality of the evidence* provided in the Yellow cases. The interns assess the *behavior of the argument*; you assess the *weight of the data*.

  ---

  ### Test Run: Three Cases

  #### Case 1: Anatoly Fomenko (New Chronology)
  *Claim: Ancient history is a fabrication; Jesus lived in the 12th Century.*
  *   **Phase 1:** Does he cite mainstream historians to refute them? *No, he dismisses them as a conspiracy.* (**RED FLAG**)
  *   **Phase 2:** Conspiracy Check? *Claims global conspiracy of historians.* (**RED - AUTOMATIC**)
  *   **Phase 2:** Mystery Check? *Uses statistical anomalies to "prove" documents are fake without paleographic analysis.* (**RED FLAG**)
  *   **Verdict:** **DECLINE.**
  *   **Result:** Correct. The protocol catches the methodological failure, not just the weird claim.

  #### Case 2: Ancient Astronauts / Sumerian Texts
  *Claim: The Anunnaki are extraterrestrials.*
  *   **Phase 1:** Venue? *Popular books, not Assyriology journals.* (**RED FLAG**)
  *   **Phase 2:** Mystery Check? *"We don't know how they knew astronomy, therefore aliens."* (**RED FLAG**)
  *   **Phase 2:** Engagement? *Ignores linguistic translations by Sumerologists.* (**RED FLAG**)
  *   **Verdict:** **DECLINE.**
  *   **Result:** Correct. Reliance on "mystery" as evidence is a hard fail.

  #### Case 3: Pre-Clovis Migration (The "Fringe That Won")
  *Claim: Humans were in the Americas 15,000+ years ago (e.g., Meadowcroft, Monte Verde).*
  *   *Scenario: It is 1995. Consensus is "Clovis First" (13,000 years).*
  *   **Phase 1:** Venue? *Authors are publishing in American Antiquity, but facing heavy pushback.* (**GREEN/YELLOW**)
  *   **Phase 2:** Conspiracy Check? *Do they say archaeologists are hiding truth?* **No.** They say archaeologists are misinterpreting stratigraphy. (**GREEN**)
  *   **Phase 2:** Mystery Check? *Do they say "It's a mystery so it must be pre-Clovis"?* **No.** They offer C14 dates and lithic analysis. (**GREEN**)
  *   **Phase 2:** Moving Goalposts? *When told dates are contaminated, they re-test with new methods.* (**GREEN**)
  *   **Phase 3:** Contradicts Consensus? *Yes.* (**YELLOW TRIGGER**)
  *   **Verdict:** **PUBLISH BUT FLAG (Editorial Call).**
  *   **Result:** **Correct.** In 1995, this *should* have been flagged as contested. It was radical. But the protocol prevents you from Declining it as pseudohistory because the *methodology* is sound, even if the conclusion is currently unpopular. This protects you from looking stupid in 2025.

  ---

  ### The Uncomfortable Answer
  **Where the rubric gives you a verdict you won't like:**
  The protocol will classify **high-quality ideological history** as **Ordinary Scholarship** even if you disagree with the politics.

  *   *Example:* A manuscript arguing that the Founding Fathers were motivated primarily by economic class interests (Beardian history) vs. ideological liberty.
  *   *The Rubric:* If the author cites opponents, uses archival data, and avoids conspiracy, the Intern must mark this **Ordinary Scholarship**.
  *   *The Discomfort:* You cannot use this rubric to suppress historical arguments you find politically distasteful *unless* they resort to pseudohistorical methods (cherry-picking, conspiracy, falsifiability failures). If a Marxist or a Libertarian historian plays by the rules of evidence, this rubric protects them. **This is a feature, not a bug.** If you want to block it, that is an *Editorial Call* on relevance/scope, not a triage on pseudohistory.

  ### The One Boundary It Must Not Cross
  **Empirical Claims vs. Metaphysical Convictions.**

  The rubric must **not** classify religious or political conviction as pseudohistory *unless* the author makes a testable empirical claim that violates methodological naturalism.

  *   **Allowed (Theology/Philosophy):** "The Exodus narrative reveals God's relationship with Israel." (Not testable, theological claim).
  *   **Allowed (Political):** "The Declaration of Independence was a radical document." (Interpretive claim).
  *   **Not Allowed (Pseudohistory):** "The Exodus happened in 1446 BC and we have found the chariot wheels in the Red Sea." (Empirical claim).
      *   *If they make this claim:* They must submit to Phase 2 (Evidence/Testability). If they say "Science can't measure God's miracles," they fail the **Mystery Check** (using supernatural intervention to explain physical gaps).
  *   **The Line:** You are editing a *history* magazine. The boundary is **Methodological Naturalism**. If a manuscript argues that a historical event occurred *solely* due to divine intervention and refuses to provide secular evidence, it is theology, not history. It should be declined not as "false religion," but as "wrong genre."

  **Summary for your Interns:**
  "We do not judge if God exists. We judge if you are using historical methods to prove a physical event happened. If your evidence is 'faith,' that is theology. If your evidence is 'artifacts,' that is history. If your evidence is 'artifacts + a conspiracy to hide them,' that is pseudohistory."
