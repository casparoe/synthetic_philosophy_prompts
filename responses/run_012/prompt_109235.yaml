      *Self-Correction on "Position":* The user wants a position they can defend. The position is: *The morality of selection is incomplete without the ethics of welcome.* The friend says selection is required for the best life. The speech says the best life is not guaranteed by selection, but by the community's commitment. This doesn't solve the "where's the line" problem but sidesteps its relevance to the child's worth.

