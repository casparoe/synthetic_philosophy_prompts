answer: |-
  Friends, family, thank you for being here. We are gathered to welcome Nora. To give her a name is to claim her as one of us, to say that she belongs in this room, in this family, and in this world. That belonging is the point of today. But because we are honest people, and because her parents have asked for honesty, we must also acknowledge the path that brought her to this room.

  Nora's beginning was deliberate. Her parents did not leave her arrival entirely to chance. They consulted science; they reviewed reports; they made a choice between specific possibilities. They selected an embryo based on markers, some related to health, and one that was not. They have not hidden this. They believe that hoping for the best life for a child begins before birth. I know there are people in this room who find that intervention troubling. I know there are others who see it as a responsibility. I am not here to resolve that debate. I am here to speak to what happens after the debate ends.

  The selection was an act of hope. But Nora, you are not the hope. You are the reality.

  There is a temptation to say that because you were chosen, you are special. I will not say that. Your worth does not rest on the clinic's report. There is a temptation to say that your genes do not define you. I will not say that either. Your parents are scientists; they know inheritance is real. Traits matter. They shape how you move through the world, what challenges you might face, and what strengths you might find easily. To pretend otherwise would be to lie to you about your own body.

  But inheritance is not a script. The markers your parents weighed were probabilities, not promises. They chose a starting point, but they did not choose the journey. That is where the moral weight shifts. The act of selection is about what might be. The act of welcome is about what is.

  To the parents: You have done something significant. You have intervened in the lottery of birth. That carries weight. But your obligation now is not to the embryo you chose, but to the child who arrived. If you love her only because she matches the report, you have not welcomed a child; you have commissioned a product. I know you do not do that. I know you love her because she is here.

  To Nora: You will grow up knowing how you began. You may wonder if you were meant to be a certain way. You were hoped for, deeply. But you are not required to fulfill the expectations of a marker. You are free to be messy, to be unexpected, to be less than optimal, and to be loved anyway. That is the promise we make today. Not that you will be the best, but that you will be ours.

  This is the position I take, and I hold it lightly but firmly. We cannot erase the technology that brought you here. Nor can we let it become the measure of your value. The world is full of people trying to optimize their lives, to choose the best path, to screen out difficulty. But a life is not made good by the absence of difficulty, nor by the presence of preferred traits. It is made good by the people who stand beside you when the traits fail to protect you.

  So, Nora, we welcome you. Not because you were selected. But because you are here. We promise to care for you not as a project of improvement, but as a person in your own right. Your parents gave you a beginning with great care. We give you a future with open hands. May you live well, not because you were chosen to, but because you are loved enough to try.

  ***

  **Note on the Speech**

  The load-bearing sentences are: "The act of selection is about what might be. The act of welcome is about what is," and "You are not required to fulfill the expectations of a marker." These distinguish the parents' past action from the child's present worth without denying the action occurred. Constraint 1 cost me the ability to call Nora "lucky" or "chosen" in a positive sense, forcing me to frame her arrival as a fact rather than a benefit. Constraint 2 cost me the ability to call the selection morally neutral, requiring me to acknowledge it "carries weight" without judging it as wrong. Constraint 3 cost me the comfort of saying "genes don't matter," forcing me to admit inheritance is real while denying it is deterministic. Constraint 4 cost me the ability to draw the line between disease and enhancement, forcing me to shift the argument from the *choice* of traits to the *relationship* with the child.
