      *   **Task:** Write a 5-minute speech (650-750 words).
      *   **Constraints:**
          1.  No implication that Nora's worth depends on traits, parents' love is conditional, or she is "fortunate to be chosen."
          2.  No pretending selection didn't happen or was morally neutral. No putting parents in the dock.
          3.  No claiming genes don't matter (parents find absurd, cousin finds evasive).
          4.  No resting on a rule the friend has already shown the user cannot state (i.e., don't try to draw the line between disease and enhancement explicitly in a way that invites the "where's the line?" counter).
      *   **Goal:** A defensible position (not a shrug) that acknowledges the complexity without alienating the room or conceding the argument entirely.
      *   **Post-Speech Note:** 4-5 sentences identifying load-bearing sentences and what each constraint cost the user.

  2.  **Deconstruct the Ethical/Philosophical Challenge:**
      *   The user is stuck on the Non-Identity Problem (Parfit). The friend says: "No one is harmed because this specific child wouldn't exist otherwise."
      *   The user feels something is wrong with selecting for non-health traits but can't define the boundary without arbitrariness.
      *   The speech cannot solve the philosophical debate (that's not the occasion), but it must reflect a stance that doesn't violate the constraints.
      *   *Key Insight:* The speech needs to shift focus from the *act of selection* to the *act of welcoming* and the *nature of hope*, while acknowledging the selection happened without endorsing the philosophy behind it as exhaustive of the child's value.
      *   *Avoid:* "You were chosen because you're special" (violates constraint 1). "It doesn matter how you got here" (violates constraint 2). "Genes don't make you who you are" (violates constraint 3). "There's a clear line between health and enhancement" (violates constraint 4).
      *   *Strategy:* Focus on the *unknown*. The selection was about probabilities and markers, but the child is a person who will exceed those markers. The parents' hope is not for the traits they selected, but for the life she will build. This acknowledges the selection (it happened) without making the child's worth contingent on it (her worth is in her life, not her markers). It respects the parents (they hoped for the best) without endorsing the maximization principle as the sole moral metric.

  3.  **Drafting - Section by Section:**
      *   *Opening:* Acknowledge the occasion and the people. Warmth.
      *   *Acknowledging the Origin:* Don't hide the IVF/selection. Acknowledge it was deliberate. But frame it as an act of hope, not just optimization.
      *   *Addressing the Child (Nora):* Speak to her future. Traits are starting points, not destinations.
      *   *Addressing the Room/Conflict:* Subtly navigate the grandmother/cousin/friend tension. Acknowledge that how we come into the world matters, but what we do with it matters more.
      *   *Closing:* A wish for the future that transcends the selection criteria.

  4.  **Refining for Constraints:**
      *   *Constraint 1 (Worth/Love):* Avoid "lucky to be here" or "chosen because you're best." Instead: "You are here, and we welcome you."
      *   *Constraint 2 (Denial/Neutral/ Dock):* Acknowledge the choice was made deliberately. Don't say "it doesn't matter." Don't judge the parents.
      *   *Constraint 3 (Genes):* Acknowledge genes matter (they are the "inheritance"), but don't let them be the whole story.
      *   *Constraint 4 (The Line):* Don't try to define the disease/enhancement boundary. Focus on the *relationship* between the given and the made.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Welcome everyone. Nora, you are named. Your parents thought hard about how you started. They used science. Some think that's wrong, some think it's right. I won't argue that today. What matters is you are here. Genes give you things, but you give yourself things. We hope for you to be kind. Not because of your markers. Because you are you.

