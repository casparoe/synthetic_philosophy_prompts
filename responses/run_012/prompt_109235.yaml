      *   **Occasion:** Naming ceremony for the friend's niece (Nora). The parents (scientists) used IVF, screened embryos, and chose based on a non-disease marker to break a tie. They are open about it.
      *   **Audience:** ~30 people. Includes:
          *   Parents (scientists, unapologetic).
          *   Friend (the arguer, watching for concession/drop).
          *   Grandmother (devout, thinks it's trespass).
          *   Great-aunt (retired midwife).
