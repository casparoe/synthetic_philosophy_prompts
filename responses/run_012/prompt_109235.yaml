  7.  **Developing the "Position":**
      The position should be: *Selection is an act of hope regarding the starting conditions, but welcome is an act of commitment to the person regardless of how those conditions unfold.* This sidesteps the non-identity problem (which is about harm) by focusing on *relationship*. The friend argues about harm/obligation. The speech argues about love/welcome. The selection happened; it reflects the parents' hope. But Nora's value is not tied to the success of that hope.

