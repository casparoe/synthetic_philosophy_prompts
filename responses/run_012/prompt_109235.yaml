      *Addressing the Friend:* The friend wants to know if I concede the moral permissibility. I can't say "It was right." I can say "It was an act of love, and love is responsible for what comes after, not just what comes before." This avoids the "where's the line" trap by shifting the moral weight from the *choice of embryo* to the *raising of the child*.

      *Addressing the Grandmother/Cousin:* Acknowledge the weight of the intervention without calling it trespass or ignoring the disability implications. "We know the world is complicated."

  8.  **Writing the Speech (incorporating word count):**
