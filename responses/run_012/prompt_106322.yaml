answer: |-
  The Simple Conditional Analysis (SCA) of dispositions proposes an elegant reduction: to say an object is disposed to manifest $M$ upon stimulus $S$ is simply to say that if $S$ were to occur, $M$ would occur. While intuitive, this analysis faces notorious counterexamples involving finkish, masked, and mimicking cases. The case of krysite offers a unified testbed to evaluate these challenges, forcing a confrontation between counterfactual profiles and our intuitions about intrinsic nature. By examining four rods—A, B, C, and D—we can weigh the viability of the SCA, the intrinsicality of dispositions, and the specific taxonomy of dispositional failure.

  Rod A, an ordinary krysite rod, presents the most complex challenge. Its internal lattice is brittle, yet a sharp blow triggers an intrinsic piezoelectric rearrangement that prevents shattering. Struck, Rod A never breaks. The counterfactual "If struck, Rod A would shatter" is false. However, is Rod A disposed to shatter? The argument for "yes" relies on the latent structure prior to stimulus: the lattice is intrinsically of a kind that shatters under strain. The prevention mechanism is triggered *by* the stimulus and operates faster than the crack propagation. This is a paradigmatic finkish case: the stimulus itself causes the loss of the categorical basis (the brittle lattice structure) before the manifestation can occur. The argument for "no" relies on the stable behavior: a thing that never breaks under stress is not brittle. However, if we accept that dispositions are grounded in categorical bases existing at the time of stimulus, Rod A possesses the basis for shattering at $t_0$, even if it loses it at $t_1$. Thus, Rod A is disposed to shatter, despite the false counterfactual.

  Rod B is intrinsically identical to Rod A, save for an extrinsic grounded mesh that drains the charge. Struck, Rod B shatters. Here, the counterfactual "If struck, Rod B would shatter" is true. The intuition that Rod B is disposed to shatter is uncontroversial. The comparison between A and B is decisive for intrinsicality. Since the rods are intrinsic duplicates (the mesh is extrinsic), they must share intrinsic properties. If dispositions are intrinsic, A and B must share the disposition to shatter. Since B clearly has it, A must have it too, confirming the verdict on A despite its non-shattering behavior. This divergence—A is disposed but wouldn't shatter—fataly wounds the SCA.

  Rod C introduces mimicking. Made of tough material but fitted with an extrinsic shattering device, it breaks when struck. The counterfactual "If struck, Rod C would shatter" is true. However, the rod itself lacks the intrinsic basis for brittleness; the manifestation is produced extrinsically. To claim Rod C is disposed to shatter is to confuse the object's nature with its circumstantial fate. Therefore, Rod C is not disposed to shatter. Here, the SCA yields a false positive.

  Rod D is brittle glass protected by a steel sleeve. It never breaks. The counterfactual "If struck, Rod D would shatter" is false. Yet, intuitively, the glass remains brittle; the sleeve merely masks the manifestation. This is a standard masking case, distinct from Rod A's finkishness. In masking, the basis remains intact but is blocked extrinsically. In Rod A's finkishness, the basis is destroyed intrinsically by the stimulus. This distinction earns its keep: it explains why we treat Rod D's disposition as persistent (remove the sleeve, it breaks) whereas Rod A's disposition is self-annihilating (strike it, it changes). Both Rod A and Rod D refute the SCA by showing dispositions can exist without corresponding counterfactuals.

  We must now verdict on the core claims. First, are dispositions intrinsic? The case of A and B suggests yes. They are intrinsic duplicates and share the disposition to shatter, despite differing counterfactual outcomes caused by extrinsic factors (the mesh in B, the lack thereof in A allowing intrinsic self-repair in A). If dispositions were extrinsic, A and B could differ, but our intuition that the *rod itself* is brittle in both cases supports intrinsicality. I rely on a Lewisian notion of intrinsicality: a property is intrinsic if it is shared by all perfect duplicates.

  Second, can the SCA be repaired? The sheer number of divergences here suggests the simple biconditional is fundamentally flawed. Rod A (Finkish), Rod C (Mimicking), and Rod D (Masked) all break the link between disposition and counterfactual. While philosophers like Lewis have proposed "reformed" analyses adding causal basis clauses, this is not a repair of the *Simple* Analysis but its replacement. The SCA attempts to reduce dispositions to counterfactuals; the counterexamples show dispositions ground counterfactuals, not vice versa. Therefore, the SCA must be abandoned in favor of a causal basis account.

  My verdict is that dispositions are intrinsic categorical bases, and the SCA is false. Rod A and B are disposed to shatter; Rod C is not; Rod D is. This position costs us the elegance of Humean reductionism. We must accept that dispositions are real properties distinct from the conditional facts they support. We also incur the ontological cost of categorical bases (the lattice structure) that exist independently of their manifestations. However, this cost is necessary to preserve the intuition that what a thing *is* determines what it *would do*, rather than letting hypothetical outcomes define its nature. The krysite case demonstrates that behavior is an unreliable guide to nature when intrinsic self-modification or extrinsic interference is possible.

