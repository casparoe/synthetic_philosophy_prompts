answer: |-
  This is a high-stakes situation because you are operating in the gap between *moral authority* (standing) and *organizational authority* (role). Your friend is wrong that hypocrisy is always a dodge; in moral philosophy, hypocrisy often *does* undermine the right to blame. But your friend is right that in a workplace, accusations of hypocrisy are often weaponized to silence valid concerns.

  Your two half-remembered intuitions are philosophically sound and practically vital.
  1.  **Commitment vs. Record:** Contemporary moral philosophers (e.g., R. Jay Wallace, Gary Watson) argue that what forfeits standing is not the *past violation*, but the *current repudiation* of the norm. If you broke the rule but affirm it now, you have standing. If you break it and claim it doesn't apply to you, you don't.
  2.  **Blame vs. Sanction:** Losing the standing to *personally confront* (blame) does not mean the conduct is permissible, nor does it mean you cannot trigger an *institutional process* (sanction). In fact, if you lack standing, your duty often shifts from "coach" to "report."

  **Crucial Axiom:** "You have no standing" **never** means "The conduct was fine." It means "You are not the right instrument to deliver this message."

  Below is the procedure. It is designed to separate the three questions you identified. It is not a substitute for HR policy; it is a triage tool for your specific role as a social gatekeeper.

  ### The 10-Minute Standing & Action Procedure

  **Pre-Check:** Stop. Do not speak to the colleague yet. Write down the specific behavior and the specific norm it violates.

  #### Phase 1: The Norm Check (Is this actually wrong?)
  *Goal: Separate objective harm from personal preference.*
  1.  **Identify the Rule:** Is there a written policy, a safety protocol, or an explicit team agreement violated?
      *   *Pass:* Yes (e.g., safety checklist, code of conduct).
      *   *Fail:* No (e.g., "I don't like their coding style," "They are annoying").
  2.  **Identify the Harm:** Does this create risk, degrade product, or harm a person?
      *   *Pass:* Yes (e.g., security risk, junior developer crying, credit theft).
      *   *Fail:* No (e.g., minor inefficiency, personality clash).
  3.  **The "Stranger" Test:** If a neutral third party saw this without knowing the players, would they say it needs addressing?
      *   *Pass:* Yes.
      *   *Fail:* No.

  *If you fail any step in Phase 1: Stop. This is not a conduct issue. It is a preference issue.*

  #### Phase 2: The Standing Audit (Am I the right person to say it?)
  *Goal: Determine if your history or motive disqualifies you from **interpersonal confrontation**.*
  1.  **Current Compliance:** Are you *currently* violating this specific norm?
      *   *Pass:* No. (You may have in the past, but not now).
      *   *Fail:* Yes. (You are doing it right now).
      *   *Note:* If you fail here, you have **Zero Standing** for interpersonal blame. You must skip to Phase 3, Option B (Report).
  2.  **The Commitment Test:** If this behavior were pointed out about *you* today, would you accept the correction?
      *   *Pass:* Yes ("I messed up, I'll fix it").
      *   *Fail:* No ("That's different for me," or "You're attacking me").
      *   *Note:* If you fail here, you lack standing because you are not committed to the rule.
  3.  **The Motive Check:** Is your primary drive to fix the harm, or to settle a score/gain advantage?
      *   *Pass:* Fix the harm.
      *   *Fail:* Settle a score (e.g., envy over promotion, past grudge).
      *   *Note:* **Contested Position:** Philosophers debate if bad motive kills standing. In a workplace, it **does**. If your motive is tainted, your intervention will be read as political warfare.
  4.  **The Relationship Check:** Do you have a established baseline of trust with this person?
      *   *Pass:* Yes (You have given/received feedback before).
      *   *Fail:* No (Relationship is adversarial or new).

  *If you fail any step in Phase 2: You lack **Interpersonal Standing**. You cannot have the "coffee chat." You may still have **Reporting Duty** (see Phase 3).*

  #### Phase 3: The Impact & Channel Check (Will saying it do good?)
  *Goal: Select the mechanism. This is where you decide who signs off.*

  **Option A: Informal Correction (The "Coffee" Path)**
  *   *Prerequisites:* Passed Phase 1 & Passed Phase 2.
  *   *Action:* Private conversation. Focus on the work/norm, not the character.
  *   *Sign-off:* You (Team Lead). No formal approval needed, but document briefly in your private logs.
  *   *Risk:* Low.

  **Option B: Formal Escalation (The "HR/Manager" Path)**
  *   *Prerequisites:* Passed Phase 1 & **Failed** Phase 2 (No Standing) OR Passed Phase 1 & Passed Phase 2 but Behavior is Severe/Repeated.
  *   *Action:* You do not confront the peer. You present the data to the person with authority.
  *   *Sign-off:* Engineering Manager (for performance/conduct), HR (for harassment/legal), CEO (for existential risk).
  *   *Risk:* High. Requires documentation.

  **Option C: Recusal (The "Silent" Path)**
  *   *Prerequisites:* Passed Phase 1 & Failed Phase 2 (No Standing) & Low/Medium Severity.
  *   *Action:* You do nothing personally. You wait for someone with standing to act, or you anonymously flag it if your system allows.
  *   *Sign-off:* You (Decision to abstain).
  *   *Risk:* Medium (Conduct continues).

  ***

  ### ⚠️ Values Call Markers (The Procedure Ends Here)
  The procedure cannot decide these. You must own these calls:
  1.  **Severity Threshold:** At what point does a "Phase 2 Fail" (No Standing) become a "Phase 3 Option B" (Report anyway)? *Guideline:* If safety or legal liability is involved, you report regardless of standing. If it is interpersonal friction, you recuse.
  2.  **Motive Purity:** You can never be 100% sure of your motive. *Guideline:* If you have to ask "Am I doing this because I'm jealous?" the answer is usually "Yes, partly." Recuse.
  3.  **The "Weaponized Hypocrisy" Trap:** Sometimes people claim you are a hypocope to protect bad behavior. *Guideline:* If your audit (Phase 2) is clean, proceed despite their accusation. Do not let them veto your standing if you are actually compliant.

  ***

  ### Sign-Off Authority Matrix
  *Since you are a Team Lead, not a Manager of Managers:*

  | Action Type | Who Decides | Who Executes | Who Documents |
  | :--- | :--- | :--- | :--- |
  | **Informal Feedback** | You | You | You (Private notes) |
  | **Performance Review Note** | Your Manager | You (in draft) | Your Manager (Final) |
  | **Formal Warning / PIP** | Eng Manager + HR | Eng Manager | HR |
  | **Termination / Legal** | CEO + HR + Legal | HR / Exec | Legal / HR |

  *You cannot unilaterally execute the bottom two rows. Your job is to pass the baton.*

  ***

  ### Running the Procedure on Your Cases

  #### Case (a): Peer skipping safety step (You did it last year, got talked to)
  *   **Phase 1 (Norm):** Safety checklist. Objective rule. Harm = Risk. **Pass.**
  *   **Phase 2 (Standing):**
      *   *Current Compliance:* Are you skipping it *now*?
          *   *Scenario A1 (You stopped):* **Pass.** Past violation doesn't kill standing if you are currently compliant.
          *   *Scenario A2 (You still skip it):* **Fail.** You are actively violating the norm you are enforcing.
      *   *Commitment:* Would you accept correction? **Pass** (Presumably, since you were talked to before).
      *   *Motive:* Safety focused? **Pass.**
  *   **Phase 3 (Channel):**
      *   *If A1 (Stopped):* **Option A (Informal).** Script: "Hey, I noticed we skipped step X. I used to do that last year until I got burned/corrected. We need to lock that down." Acknowledge your past explicitly. This neutralizes the hypocrisy charge.
      *   *If A2 (Still skipping):* **Option B (Report) or C (Recuse).** You cannot say a word. You must fix your own behavior first, then report the systemic issue to the Eng Manager generally, without naming the peer initially.
  *   **Verdict:** If you have stopped, speak up but own your past. If you haven't stopped, silence.

  #### Case (b): Peer humiliates juniors (You are blunt, never cruel)
  *   **Phase 1 (Norm):** Code of Conduct (Respect). Harm = Psychological safety/Retention. **Pass.**
  *   **Phase 2 (Standing):**
      *   *Current Compliance:* Are you humiliating people? **Pass** (By your definition).
      *   *The "Blur" Test:* Is the line between "blunt" and "cruel" clear to *others*, or just to you?
          *   *Risk:* If juniors perceive *your* bluntness as humiliation, your standing is **Fail**.
          *   *Assumption:* Let's assume you have 360 feedback confirming you are respected but direct. **Pass.**
      *   *Motive:* Protecting juniors? **Pass.**
  *   **Phase 3 (Channel):** **Option A (Informal) with Caution.**
      *   *Script:* Focus on impact, not intent. "I know we both value directness, but the tone in that review landed as humiliating for the junior. We need to adjust the delivery."
      *   *Sign-off:* You.
  *   **Verdict:** Proceed, but be prepared for the "You do it too" deflection. Counter with: "If I cross that line, please tell me. Right now we are talking about your interaction with [Name]."

  #### Case (c): Colleague takes credit (You are motivated by envy over promotion)
  *   **Phase 1 (Norm):** Integrity/Credit. Harm = Trust/Morale. **Pass.** (This is genuinely wrong).
  *   **Phase 2 (Standing):**
      *   *Motive Check:* Is part of your motivation envy? **Fail.**
      *   *Philosophical Note:* Even if the act is wrong, your *standing to blame* is compromised because you benefit from their downfall (revenge/status rebalancing).
  *   **Phase 3 (Channel):** **Option B (Formal Escalation) or C (Recusal).**
      *   *Decision:* You cannot be the accuser. If you speak to him, it's war. If you speak to the CEO, it's a hit job.
      *   *Action:* **Option B (Hand Off).** You document the behavior (facts only: "X presented Y's code as their own on [Date]"), and you send it to your Eng Manager or HR.
      *   *Disclosure:* You must disclose your conflict to the Manager/HR. "I'm reporting this, but I want to flag that I have personal friction regarding recent promotion cycles, so I should not be the one to confront him."
      *   *Sign-off:* Eng Manager / HR decides whether to investigate.
  *   **Verdict:** **Stay Quiet (Interpersonally).** Hand off the data. This is the case where you lack standing but the conduct requires action. You become a witness, not a prosecutor.

  ***

  ### Critique: Is "Standing" Doing the Work?
  You asked me to flag if this concept is confused. Here is the risk:
  In a workplace, **Power** often masquerades as **Standing**.
  *   **The Trap:** A senior engineer might have zero moral standing (they are a toxic hypocrite) but high organizational power. If they accuse you of hypocrisy, they aren't making a moral claim; they are exercising power to silence you.
  *   **The Limit:** This procedure assumes your colleagues are acting in good faith. If your workplace culture is toxic, "You're a hypocrite" will be used regardless of your actual record.
  *   **Adjustment:** If you pass Phase 2 (You are clean) and they *still* scream hypocrisy, do not retreat. That is a power play, not a standing claim. Proceed with Option A, but document the interaction.

  **Final Warning:** You are improvising in front of people. Stop. Use this checklist offline. If you fail Phase 2, do not open your mouth to the peer. Open your email to your Manager. That is not cowardice; that is preserving your ability to lead later.
