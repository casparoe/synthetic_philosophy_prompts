prompt: |-
  Me and a friend got into it for like two hours last night about hypocrisy — she thinks it's basically always a dodge, I think sometimes it's the whole point — and it got heated because this exact thing keeps happening at work and I have no idea what I'm doing. I'm a team lead at a ~45 person software company. I'm not HR and I'm not a manager of managers, but I'm the person who ends up deciding whether a concern about a colleague's conduct actually gets raised — informally over coffee, in a review, or escalated up to HR or the CEO, which I can do but shouldn't do lightly. The concerns are mundane: someone skips steps on the safety checklist, someone is a jerk to juniors in code review, someone quietly takes credit for an intern's work. And almost every time, before anything happens, someone says I'm the last person who gets to say that — because I did the same thing eighteen months ago, or because I've been sharp in reviews myself, or because I obviously just don't like the guy. Sometimes that's pure deflection. Sometimes I think it's actually correct and I should shut up and hand it off to someone else. Right now I'm improvising, in front of people, which is the worst way to do it.

  What I want from you is a decision procedure I can run in ten minutes, in my head, before I open my mouth — a checklist or a flowchart in words, with the order spelled out and, for each step, some sense of what counts as a pass. Ground it in whatever the philosophy of standing to blame actually says. I have a feeling I'm mashing three seperate questions into one: (1) is this thing actually wrong, (2) am I the right person to be the one to say it, (3) will saying it do any good. I want them kept apart. Two things I half-remember and want you to either confirm or shoot down: that what kills your standing isn't having ever done the same thing, it's being uncommitted to the rule you're invoking — i.e. it's about holding yourself to the same standard, not about having a spotless record; and that losing standing to blame is different from losing the right to have the person punished or sanctioned, so you can be barred from the personal confrontation and still be allowed, or even required, to report it up the chain. And please be explicit that "you have no standing" never means "the conduct was fine." The procedure needs to handle at least these: I'm guilty of the exact same thing right now; I'm guilty of something only sort of similar; I did it, stopped, and admitted it to the team; my record is clean but my motive is obviously personal; the person is a junior who reports to me and I'm the only one positioned to raise it; and the case where I lack standing but the conduct is serious enough that somebody has to act. Mark clearly the points where the procedure runs out and it's a values call I have to own — I don't want a flowchart that pretends the hard part isn't hard. Also say who should sign off at each level, since I can't unilaterally do the formal stuff.

  Then actually run it on three cases: (a) a peer who's been skipping a safety step, where I skipped the same step last year and got talked to about it; (b) a peer who humiliates juniors in reviews, where I've been blunt but never cruel; (c) me wanting to raise that a colleague takes credit for other people's work, when I'm pretty sure part of my motivation is that he got promoted and I didn't. Include at least one where the procedure tells me to stay quiet and hand it off, even though the conduct is genuinely bad — I'd rather find that out now. And if the whole idea of "standing" is doing less work than I think, or the request is confused at the root, just say so instead of handing me a tidy procedure anyway; I'd rather have the real answer. Where you're unsure, flag it, and don't present a contested position as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Team lead at a ~45 person software company. Not HR, not senior management, but a gatekeeper for conduct issues.
      *   **Problem:** Constantly accused of hypocrisy when raising concerns. Unsure when to speak up, when to recuse, and when to escalate. Improvising poorly.
      *   **Goal:** A 10-minute mental decision procedure (checklist/flowchart) to determine *standing* and *action* before speaking.
      *   **Specific Requirements:**
          *   Grounded in philosophy of "standing to blame."
          *   Separate three questions: (1) Is it wrong? (2) Am I the right person? (3) Will it do good?
          *   Confirm/debunk two half-remembered ideas (commitment to rule vs. spotless record; standing to blame vs. right to sanction).
          *   Explicitly state "no standing" $\neq$ "conduct fine."
          *   Handle specific scenarios (guilty now, guilty sort-of, reformed, personal motive, junior report, serious conduct/no standing).
          *   Mark where the procedure ends and values calls begin.
          *   Specify who signs off at each level.
          *   Run the procedure on three specific cases (a, b, c).
          *   Include a case where the advice is "stay quiet/hand off."
          *   Critical constraint: If the concept of "standing" is confused or less useful than thought, say so. Flag uncertainty/contested positions.

  2.  **Deconstruct "Standing to Blame" (Philosophical Grounding):**
      *   *Concept:* Standing is about the *authority* or *privilege* to hold someone accountable, not the truth of the accusation.
      *   *Key Philosophers:* R. Jay Wallace, Gary Watson, Macalester Bell.
      *   *Core Principle:* Hypocrisy undermines standing *if* it implies a lack of commitment to the norm. It's not about past sins, but current endorsement of the rule.
      *   *Distinction:* Standing to *blame* (interpersonal confrontation) vs. Authority to *report/sanction* (institutional role).
      *   *User's Intuitions:* The user's two half-remembered ideas are largely correct according to contemporary moral philosophy.
          *   Idea 1: It's about commitment, not spotless record. (Confirmed, with nuance).
          *   Idea 2: Losing standing to blame $\neq$ losing right to report. (Confirmed, crucial distinction).
      *   *Caveat:* Philosophy deals with moral agents; workplaces deal with power dynamics and liability. Need to bridge the two.

  3.  **Drafting the Decision Procedure (The "10-Minute Check"):**
      *   Need to separate the three questions as requested.
      *   *Phase 1: The Act (Is it wrong?)* Objective assessment.
      *   *Phase 2: The Messenger (Do I have standing?)* The hypocrisy check.
      *   *Phase 3: The Outcome (Will it help?)* Pragmatic check.
      *   *Sign-off:* Need to clarify roles. Team Lead can coach/feedback. HR/Manager handles formal sanctions. CEO is for existential threats.

  4.  **Refining the "Standing" Check (The Core Conflict):**
      *   The user's friend says hypocrisy is always a dodge. The user says sometimes it's the point.
      *   *Verdict:* The user is philosophically closer to the truth, but practically, the *perception* of hypocrisy kills effectiveness.
      *   *Test:* "Am I willing to be held to this same standard right now?"
      *   *Nuance:* If I did it 18 months ago but have changed, I have standing *if* I acknowledge the growth. If I'm doing it now, I lack standing to *preach*, but maybe not to *report*.

  5.  **Addressing the Specific Scenarios (Mental Simulation):**
      *   *Case A (Safety):* User did it last year. Safety is objective.
          *   *Analysis:* Past violation doesn't kill standing if user accepts the rule now. But if user is currently non-compliant, standing is gone.
          *   *Action:* Coach, don't preach.
      *   *Case B (Juniors):* User is blunt, not cruel.
          *   *Analysis:* Distinction between style and harm. If user's "bluntness" is perceived as "cruelty" by others, standing is shaky. If distinct, standing holds.
          *   *Action:* Address behavior, not style.
      *   *Case C (Credit/Promotion):* User motivated by envy.
          *   *Analysis:* Motive doesn't change the *wrongness* of the act, but it destroys *standing* to be the accuser.
          *   *Action:* Recuse. Hand off.

  6.  **Developing the Response Structure:**
      *   **Validation:** Acknowledge the difficulty. Validate the philosophical intuitions (they are sound).
      *   **The Philosophy Check:** Confirm/debunk the two half-remembered ideas explicitly.
      *   **The Procedure:** Step-by-step, clear pass/fail criteria.
      *   **The "Values Call" Markers:** Explicitly state where the algorithm stops.
      *   **The Sign-off Matrix:** Who approves what.
      *   **The Case Studies:** Run the procedure on a, b, c.
      *   **Critique/Limitations:** Where "standing" might be the wrong frame.

  7.  **Drafting Content - Section by Section:**

      *   *Intro:* Validate the stress. This is a classic "middle management trap."
      *   *Philosophy:* Confirm the "commitment vs. record" distinction (Wallace/Watson). Confirm the "blame vs. sanction" distinction.
      *   *The Procedure:*
          *   Step 1: Norm Verification (Is it actually wrong?).
          *   Step 2: Standing Audit (The Hypocrisy Check). *Crucial:* Differentiate "Preaching" vs. "Reporting."
          *   Step 3: Impact Assessment (Will it help?).
          *   Step 4: Channel Selection (Coffee vs. Review vs. HR).
      *   *Sign-off:* Team Lead = Informal/Feedback. Eng Manager/HR = Formal/Sanction.
      *   *Case Runs:*
          *   (a) Safety: Pass Standing (if reformed), Pass Wrongness. Action: Peer correction, acknowledge past.
          *   (b) Cruelty: Pass Wrongness. Standing: Check definition of "blunt." If distinct, proceed. If blurry, recuse.
          *   (c) Credit/Envy: Pass Wrongness. Fail Standing (Motive). Action: Hand off to HR/Manager. *This satisfies the "stay quiet/hand off" requirement.*
      *   *Critique:* Is "standing" doing the work? Sometimes it's about *power*. Sometimes "hypocrisy" is a weapon to silence valid concerns. Need to warn about this.

  8.  **Refining the Tone:**
      *   Needs to be professional, empathetic, but rigorous.
      *   Avoid platitudes.
      *   Acknowledge uncertainty where philosophy disagrees (e.g., the role of motive).
      *   Ensure the "Values Call" markers are visible.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I separate the three questions? Yes, in the steps.
      *   *Check:* Did I confirm the two half-remembered ideas? Yes, in the "Philosophical Grounding" section.
      *   *Check:* Did I include the "no standing $\neq$ conduct fine" line? Yes, make it bold.
      *   *Check:* Is the sign-off clear? Need to be careful not to give legal/HR advice, but organizational logic.
      *   *Check:* Did I flag contested positions? Yes, specifically around motive and the definition of "harm."
      *   *Check:* Is the "stay quiet" case included? Yes, Case C.

  10. **Final Polish:** Ensure the distinction between *interpersonal blame* (coffee/review) and *institutional reporting* (HR/CEO) is sharp. This is the key to solving the user's "I'm not HR" dilemma. The user is conflating "calling someone out" with "initiating a process."

  *(Self-Correction on Case A)*: If the user got talked to about it last year, does that mean they are "reformed"? The prompt says "I skipped the same step last year and got talked to about it." It doesn't explicitly say they stopped. I need to make the procedure test for *current* compliance. If they are *currently* skipping it, they have no standing. If they stopped, they do. I will assume for the case run that they have stopped, but note the condition.

  *(Self-Correction on Case C)*: The prompt says "part of my motivation is that he got promoted and I didn't." This is the "motive" test. Philosophy says motive doesn't make the act right/wrong, but it kills *standing*. I need to make sure the procedure forces recusal here.

  *(Final check on "Standing" utility)*: Is it possible "standing" is the wrong frame? In a workplace, *authority* matters more than moral standing. A manager can enforce rules even if they break them (though it's bad leadership). But the user is a *Team Lead*, not a formal Manager. Their power is social capital. So "standing" is actually the correct frame for *their* specific role, even if a formal Manager would rely on "authority." I should highlight this distinction.

