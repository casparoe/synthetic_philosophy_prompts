      *   *(b)* "Ought implies can" is the classic trap. Need to be careful about conflating computational intractability with logical impossibility.
      *   *(c)* "Proving P≠NP is itself hard" refers to Meta-Complexity (e.g., MCSP). This is very technical. The philosophical leap to "realism" needs care.
