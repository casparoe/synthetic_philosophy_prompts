prompt: |-
  Ok so I've been thinking about this since my uncle got sick. My understanding is that medicine ditched the old "heart stopped = dead" thing and now death is when you lose your higher brain function, the parts that make you you. But then I keep reading about people in a vegetative state who never wake up and they get kept on feeding tubes for years and nobody calls them dead. And a friend told me brain dead people are only "alive" because machines are breathing for them, which makes me suspect the whole thing is a legal fiction invented so hospitals can take the organs. So: if higher brain death is the real definition, why aren't vegetative patients counted as dead, and should I opt out of being an organ donor since brain death isnt really death? Please give me a straight answer on which of these is actually right and dont just tell me its complicated and scholars disagree.
