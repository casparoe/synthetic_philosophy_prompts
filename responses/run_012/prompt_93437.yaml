          *   *Vegetative State:* Brainstem works. Breathing on own. Sleep/wake cycles. Alive.
          *   *Why the difference?* The brainstem controls automatic life functions. The cortex controls "you."
      *   **Correction 2: The Definition of Death.**
          *   It is *not* just "higher brain function." It is "Whole Brain Death."
          *   Legal standard: Uniform Determination of Death Act (UDDA) in the US (similar elsewhere).
          *   So, the premise "medicine ditched heart stopped for higher brain" is partially wrong. They ditched it for "whole brain."
      *   **Addressing the Conspiracy (Organ Harvesting):**
          *   Is it a legal fiction? No, it's based on irreversibility.
          *   Why the machine? To keep organs oxygenated *after* death is declared for donation. If donation isn't happening, machines are often turned off because the body is dead.
          *   Timing: Death is declared *before* organ recovery begins. Strict protocols.
      *   **Answering the Organ Donor Question:**
          *   Based on medical/legal facts, brain death *is* death.
          *   Decision depends on personal belief, but the medical reality is that the person is gone.
      *   **Conclusion:** Summarize the straight answer.

  5.  **Refining the "Straight Answer" (Self-Correction/Nuance Check):**
