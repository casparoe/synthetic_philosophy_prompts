      *   *Concept 1: Cardiopulmonary Death.* Heart and breathing stop. (Old standard, still valid).
      *   *Concept 2: Brain Death (Whole Brain).* Irreversible cessation of *all* functions of the entire brain, including the brainstem. This *is* legal death in almost all jurisdictions.
      *   *Concept 3: Vegetative State (Unresponsive Wakefulness Syndrome).* Brainstem works (breathing, sleep-wake cycles), but cortex is damaged (no awareness). This is *not* death.
      *   *Concept 4: Higher Brain Death (Philosophical).* Loss of consciousness/personhood. This is *not* the legal/medical standard, though some philosophers argue for it.
      *   *Organ Donation:* Requires perfusion (blood flow) to organs. Brain-dead patients are on ventilators to keep organs viable *after* death is declared.

  3.  **Address the "Straight Answer" Constraint:**
      *   The user explicitly says: "dont just tell me its complicated and scholars disagree."
      *   *Challenge:* Medical ethics and law *are* complicated, and there *is* scholarly disagreement about the philosophical definition of death. However, there is a clear *legal and medical standard*.
      *   *Strategy:* I must distinguish between the *legal/medical fact* (what hospitals follow) and the *philosophical debate* (what people think about it). I cannot lie and say there is zero philosophical controversy, but I can give a definitive answer on what the current standard *is* and why the user's premise is factually incorrect regarding vegetative states.
      *   *Tone:* Empathetic, direct, authoritative but not dismissive. Acknowledge the emotional weight (uncle getting sick).

  4.  **Drafting the Response - Section by Section:**

