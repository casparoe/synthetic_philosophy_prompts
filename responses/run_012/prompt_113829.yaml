      *   *Holism:* Sentences face the tribunal of experience as a corporate body, not individually.
      *   *Indeterminacy of Translation:* There is no fact of the matter about which translation manual is correct, provided they both save all possible behavioural evidence. It's not just epistemic uncertainty; it's ontological emptiness.
      *   *Inscrutability of Reference:* Even within a fixed language, reference is indeterminate (gavagai = rabbit/rabbit part/etc.).
      *   *Analytical Hypotheses:* The bridge from observation sentences to theoretical sentences. This is where the slack lies.
      *   *Response to "Success":* Quine would likely distinguish between *pragmatic success* (getting along, predicting behaviour) and *factual correctness* (matching a unique meaning).

  3.  **Address the Specific Challenge (Machine Translation):**
      *   *The CS Claim:* The machine translates without ostension. Therefore, stimulus meaning isn't necessary. Therefore, indeterminacy is just poverty of evidence.
      *   *Quine's Counter:* The machine isn't doing what the field linguist is doing. The machine is correlating texts, not mapping stimulus meanings. It's simulating translation, not grounding it.
      *   *The "Manual":* The machine outputting rules is just more text. It doesn't ground reference.
      *   *Alternative Manuals:* Quine would insist that if the evidence is purely textual (disquotational), multiple mappings are still logically possible. The machine picks one based on statistical weight, not factual truth.
