answer: |-
  My dear student,

  You have put me in a position I much enjoy: that of having to defend a thesis against a new and formidable-looking counter-example, one that arises not from a rival metaphysician but from the engineers. Your friend in computer science is an intelligent fellow, no doubt, but I fear he is conflating the *utility* of a prediction with the *factuality* of a meaning. He believes that because his machine produces a fluent English sentence from a foreign string of symbols, it has solved the problem of meaning. I should argue that it has merely bypassed it.

  Let us reconstruct the situation carefully. You ask how I would respond to the claim that a system trained purely on text, without access to the sensory stimulations of the speakers, refutes the indeterminacy of translation. My first observation is that such a system does not translate in the sense in which I defined the problem. It correlates texts.

  To see why this matters, we must return to the bedrock of my position: stimulus meaning. For me, the evidence for translation is not merely the text itself, but the text in conjunction with the concurrent sensory stimulation of the speaker. When the field linguist hears 'Gavagai' and sees a rabbit, she notes the linguist's assent. This link between the utterance and the world is what anchors the language. Your friend's machine has no eyes. It does not see the rabbit. It sees only the mark 'Gavagai' and its statistical neighbours in a vast corpus. It learns that 'Gavagai' often aligns with 'rabbit' in parallel texts produced by humans. But this alignment is itself a product of previous translations, which were themselves subject to indeterminacy. The machine is not grounding language in the world; it is grounding one set of marks in another set of marks. It is a closed loop.

  Consequently, I would not say the machine has produced a translation in the full semantic sense. It has produced a serviceable correlation of sentences that satisfies its users. And let us not underestimate 'serviceable'. For most practical purposes—tourism, trade, reading the news—this is entirely sufficient. But sufficiency is not truth. The indeterminacy thesis is not the claim that we cannot get along without a unique translation; it is the claim that there *is* no unique translation to be had, even in principle. The machine's success shows that we can navigate the world without settling on a unique meaning, not that the meaning has been settled.

  You ask how I would bring my notions of observation sentences and analytical hypotheses to bear here. The machine has no observation sentences. In my framework, an observation sentence is one on which all speakers agree under the same sensory stimulation. It is the checkpoint where language touches the world. The machine's input is devoid of this checkpoint. It processes what I should call 'occasion sentences' or 'theoretical sentences' that have already been detached from their immediate stimulus conditions by being written down.

  Therefore, the machine's operations occur entirely within the realm of what I called 'analytical hypotheses'. When the linguist in the field moves from 'Gavagai' to 'Rabbit', she must posit hypotheses about the grammar and the lexicon to bridge the gap between observation and theory. The machine does this too, but it does so blindly. It posits that 'Gavagai' maps to 'Rabbit' because that mapping minimises the error function across the corpus. But this is a pragmatic choice, not a discovery of a fact.

  This brings us to your friend's second point: that the machine can emit an explicit manual, a set of rules, making the analytical hypotheses non-hypothetical. I must demur. The fact that the rules are explicit does not make them factual. It merely makes the indeterminacy explicit.

  Recall the core of the indeterminacy argument: it is always possible to construct two manuals, A and B, which are incompatible with each other (they map source sentences to different target sentences, or map words to different ontological categories) yet both are compatible with all possible behavioural evidence. In the case of the machine, the 'behavioural evidence' is the text corpus itself. Your friend claims the machine settles on one manual. I ask: could a different machine, with a different architecture or a different random seed, be trained on the *same* corpus and produce a *different* manual that yields translations judged equally fluent and faithful by competent speakers?

  If the answer is yes—and given the nature of statistical models, it almost certainly is—then the indeterminacy remains. The machine has simply selected one path through the logical space of possibilities. It has not shown that the other paths were impossible, only that they were statistically less weighted in the training data. The existence of the manual does not freeze the meaning; it merely records the machine's bias.

  Now, let us turn to the distinction between the indeterminacy of translation and the inscrutability of reference, for this is where your friend's objection is most vulnerable. The indeterminacy of translation concerns the mapping of whole sentences (holophrastically) or the grammar connecting them. The inscrutability of reference concerns the terms themselves: does 'Gavagai' refer to the rabbit, the undetached rabbit part, or the temporal rabbit-stage?

  Your friend's machine cannot settle this. Why? Because the distinction between a rabbit and a rabbit part does not manifest in the text alone, absent ostension. If the source language speakers use 'Gavagai' in contexts where we would say 'rabbit', they might still ontologically mean 'rabbit part', provided their logic of identity differs from ours (e.g., they say 'is the same as' where we say 'is part of').

  Since the machine has no access to the speakers' assent or dissent in the presence of the rabbit, it cannot distinguish between these ontological interpretations. It assumes the standard English ontology because the target corpus is English. It projects 'rabbit' onto 'Gavagai' because the human translators who built the corpus did so. But the machine itself has no grip on the reference. It is manipulating symbols according to patterns. If we were to interpret the machine's output using a manual that treated 'rabbit' as 'rabbit part', the textual output could remain identical, provided we adjusted the logical particles (the 'is', 'the', 'a') accordingly. The machine's output does not exclude the 'rabbit part' hypothesis; it merely ignores it. The inscrutability remains intact because the machine is blind to the objects the words are about.

  I must now offer the honest account of the limits of this exercise, as you requested. This scenario does strain my commitments, and I should not pretend otherwise.

  First, my behaviourism relies on the idea that meaning is public. Your friend might argue that the machine's internal weights *are* a form of public behaviour, albeit complex. If the machine can predict all future utterances of the source language speakers better than a field linguist, have I not conceded that stimulus meaning is secondary to syntactic prediction? I would resist this. The speakers themselves are biological entities with sensory surfaces. The machine is simulating their output, but the meaning of that output is still rooted in the speakers' biology, not the machine's silicon. The machine is a parasite on human meaning. If the human meanings are indeterminate, the machine's correlations inherit that indeterminacy.

  However, there is a genuine tension here. I have always maintained that there is no fact of the matter. If a system can operate successfully without the 'facts' I deemed necessary (ostension, stimulus meaning), does that suggest those facts were never there to begin with, or merely that they are not needed for *this kind* of operation? I would argue the latter. The machine is not engaging in translation; it is engaging in pattern matching. Translation, properly so-called, involves the mapping of one web of belief onto another, where both webs are anchored in sensory experience. The machine has only one web (the textual correlation) and no anchors.

  Secondly, this case exposes a limitation in the analogy between the field linguist and the statistical model. The linguist is a fellow human, capable of empathy and shared perception. The machine is not. My thesis was designed to show that even between two humans, sharing a form of life and biology, translation is indeterminate. The machine case is easier: of course it is indeterminate, because it lacks the biological commonality that makes translation even *possible* in the strict sense. Your friend thinks the machine's success proves determinacy. I see it as proving that we can simulate understanding without understanding.

  Finally, does this expose a weakness in the indeterminacy thesis? I think not. It exposes a weakness in the *verification* of the thesis. It is harder to demonstrate indeterminacy when one party is a black box that produces fluent text. But the logical point stands: if two incompatible manuals fit the data (the corpus), there is no fact of the matter as to which is right. The machine picks one. That is an engineering decision, not a metaphysical discovery.

  In sum, tell your friend that he has built a marvellous tool for correlation, but he has not solved the philosophical problem. He has shown that we can navigate the indeterminacy, not that we have removed it. The rabbit remains as inscrutable as ever; the machine simply does not look closely enough to notice.

  Yours,

  W.V.Q.
