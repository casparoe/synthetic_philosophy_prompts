prompt: |-
  Right, so I'm a Bayesian statistician — biostatistics mostly, clinical trials and a bit of epi — and I keep bumping into the quantum foundations debate about whether the wavefunction is real. I want you to do a proper translation job here, not a vibe check.

  Here's the debate as I understand it. One camp says the wavefunction (or quantum state) is a piece of reality itself, the physical state of the system, as real as a field or a particle. The other says it's a state of information, a summary of what some agent knows or could in principle know, and that the actual physical state is something else underneath, some hidden configuration that the wavefunction is a probability distribution over. The labels people use are psi-ontic and psi-epistemic.

  Now, the bit I think is doing all the work, and that I want you to focus on. There's an argument — I've seen it sketched alot, I couldn't reproduce it properly — that goes roughly like this. Suppose you've got underlying real states, and each preparation procedure, each way of producing a quantum state in the lab, gives you a probability distribution over those underlying states. The epistemic view seems to need it to be possible that two different preparations, yielding two different quantum states, sometimes land on the same underlying real state. Otherwise the underlying state would just be a relabelling of the quantum state and the view collapses into the ontic one. Then you add an assumption that systems prepared independently of each other have independent underlying states. And supposedly from those two ingredients you can construct a scenario in which a joint measurement has an outcome that should be impossible under one of the preparations, but the setup makes it possible, contradicting the quantum predictions. So either the wavefunction is ontic, or you give up preparation independence, which people say amounts to a kind of action at a distance.

  So: restate that whole thing — both positions, the argument, the role each assumption plays, and what exactly the argument is meant to establish — in the vocabulary I actually use. Identifiability and non-identifiability, likelihoods and data-generating processes, parameters versus sufficient statistics versus posteriors, observational equivalence, priors and what happens when two different priors give the same posterior, exchangeability, whatever else earns its keep. I'm fluent in that stuff. I'm not fluent in quantum mechanics, so dont assume I know what a POVM is or what a Hilbert space is beyond a vague sense of a vector space.

  Then the part I actually want: the residue report. Which bits of the quantum debate map cleanly onto statistical vocabulary, which bits only map if you distort something to make them fit, and which bits have no counterpart in my vocabulary at all?

  And I want a verdict, not a hedge. My hunch going in is that psi-epistemic just means the wavefunction is a posterior and psi-ontic just means it's the parameter, and that I make that distinction about fifteen times a day without any drama, so the whole fuss looks like a category error on the physicists' part. Tell me where that hunch is right and where it's badly wrong. I suspect the interesting bit is something about the quantum state being claimed to be a complete description, so that if it's epistemic there's nothing left over to be ontic, whereas my likelihood is never claimed to be complete — I always get to have a real parameter sitting underneath. If that's the residue, say so and say what follows from it. If the residue is somewhere else, say where. And dont smuggle my framework's assumptions in and call it translation. If my vocabulary forces the debate into a shape it doesn't really have, I want to know that, and I want your view on whether that's a defect in my vocabulary or a sign the original debate is muddier than it looks.

  British English please, spelling and idiom both, and don't be polite about it — I'd rather the translation be ugly and honest than smooth and wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Bayesian statistician (biostatistics, clinical trials, epi). Fluent in identifiability, likelihoods, DGPs, parameters, sufficient statistics, posteriors, observational equivalence, exchangeability, etc. Not fluent in QM formalism (no Hilbert spaces, POVMs, etc.).
      *   **Topic:** The Psi-Ontic vs. Psi-Epistemic debate in quantum foundations, specifically focusing on the Pusey-Barrett-Rudolph (PBR) theorem argument structure.
      *   **Task:**
          1.  Translate the debate and the specific argument (PBR-style) into statistical vocabulary.
          2.  Provide a "Residue Report": What maps cleanly, what maps with distortion, what has no counterpart.
          3.  Deliver a Verdict: Address the user's hunch (psi-epistemic = posterior, psi-ontic = parameter) and the "completeness" issue.
          4.  **Tone/Style:** British English, blunt/honest ("don't be polite"), ugly but accurate translation preferred over smooth but wrong. No hedging.

  2.  **Deconstruct the Quantum Debate (PBR Theorem Context):**
      *   *Psi-Ontic:* The quantum state $|\psi\rangle$ corresponds directly to the physical reality $\lambda$. One-to-one (or many-to-one from states to reality, but distinct states imply disjoint support on reality).
      *   *Psi-Epistemic:* The quantum state $|\psi\rangle$ represents knowledge about an underlying physical reality $\lambda$. Distinct quantum states can overlap in their distribution over $\lambda$.
      *   *The Argument (PBR):*
          1.  Assume $\psi$-epistemic (overlap exists).
          2.  Assume Preparation Independence (independent systems have independent $\lambda$).
          3.  Construct a joint measurement on multiple systems.
          4.  Show that QM predicts zero probability for a specific outcome given certain preparations.
          5.  Show that the overlap + independence implies non-zero probability for that outcome.
          6.  Contradiction.
      *   *Conclusion:* Either $\psi$ is ontic, or Preparation Independence is false (implies non-local correlations in preparation).

  3.  **Drafting the Translation (Statistical Vocabulary):**
      *   *Quantum State ($\psi$):* Prior distribution? Posterior distribution? Or the Parameter itself?
      *   *Underlying Reality ($\lambda$):* The true parameter value $\theta$.
      *   *Preparation Procedure:* The data generating process (DGP) or the sampling mechanism that selects $\theta$.
      *   *Psi-Ontic:* The parameter $\theta$ is uniquely identified by the distribution assigned to it. If I say $\theta \sim \pi_1$, the support of $\pi_1$ is disjoint from $\pi_2$. Actually, better: The "state" *is* the parameter.
      *   *Psi-Epistemic:* The "state" is a distribution over $\theta$. Different states (distributions) can overlap on the same $\theta$.
      *   *Preparation Independence:* Exchangeability/Independence of parameters across independent trials. If I run Trial A and Trial B, $\theta_A \perp \theta_B$.
      *   *Measurement:* Observing data $y$.
      *   *The Contradiction:* Likelihood function gives $P(y|\theta) = 0$ for some $y$ under specific $\theta$. But the overlapping priors imply $P(y) > 0$.

      *Refining the Translation:*
      *   Let $\Lambda$ be the sample space of the "ontic state" (the true physical configuration).
      *   Let $\psi$ be a label for a *procedure* that generates a distribution $P(\lambda | \psi)$ over $\Lambda$.
      *   *Psi-Ontic:* For $\psi_1 \neq \psi_2$, the supports of $P(\lambda | \psi_1)$ and $P(\lambda | \psi_2)$ are disjoint. Knowing $\lambda$ tells you exactly which $\psi$ was used.
      *   *Psi-Epistemic:* For $\psi_1 \neq \psi_2$, the supports overlap. There exists $\lambda^*$ such that $P(\lambda^* | \psi_1) > 0$ and $P(\lambda^* | \psi_2) > 0$.
      *   *Preparation Independence:* If I prepare system 1 with $\psi_1$ and system 2 with $\psi_2$, the joint distribution is $P(\lambda_1, \lambda_2 | \psi_1, \psi_2) = P(\lambda_1 | \psi_1) P(\lambda_2 | \psi_2)$.
      *   *Measurement:* A likelihood function $L(y | \lambda_1, \lambda_2)$.
      *   *The Kicker:* QM says for specific $\psi$ combinations, there is an outcome $y_{imp}$ such that $P(y_{imp} | \psi_1, \psi_2) = 0$.
      *   *The Conflict:* If overlaps exist and independence holds, the math says $P(y_{imp}) > 0$. QM says $P(y_{imp}) = 0$.

  4.  **Drafting the Residue Report:**
      *   *Clean Maps:* Preparation = Sampling design. Underlying state = Parameter. Measurement = Data observation. Independence = Product measure on parameter space.
      *   *Distorted Maps:* The "Wavefunction" isn't quite a prior. In Bayes, priors are subjective/agent-relative. In QM, the "state" is often treated as objective protocol. The "Measurement" in QM changes the state (update), but in stats, observing data doesn't change the parameter, just the posterior.
      *   *No Counterpart:* The specific structure of the Likelihood. In stats, we define the likelihood. In QM, the likelihood (Born rule) is fixed by the theory and constrains the possible overlaps. The "No-Go" nature. Stats allows any model; QM says "This model class is forbidden by reality."
      *   *Completeness:* This is the big one. In stats, $\theta$ is always "there". In QM, if $\psi$ is epistemic, what is $\lambda$? If $\psi$ is ontic, $\lambda$ *is* $\psi$. The debate is about whether the probabilistic object *is* the physical object.

  5.  **Drafting the Verdict:**
      *   *User's Hunch:* "Psi-epistemic = posterior, Psi-ontic = parameter."
      *   *Critique:* It's close but misses the "Completeness" constraint. In Bayes, the parameter *always* exists underneath the posterior. The debate is whether the quantum formalism *allows* something underneath.
      *   *The Real Issue:* It's about *Identifiability*. Psi-ontic means the mapping from Physical State to Quantum State is injective (essentially). Psi-epistemic means it's not.
      *   *The "Drama":* Why is there drama in physics but not stats? Because in stats, we assume a DGP exists. In QM, the PBR theorem says "If a DGP exists (independent $\lambda$), it contradicts data." So you must give up the DGP assumption (Independence) or accept the Distribution is the Reality.
      *   *Verdict:* The user's hunch is right about the *structure*, but wrong about the *stakes*. In stats, we don't prove priors can't overlap. In QM, they prove (under independence) that they *cannot* overlap if QM predictions are correct. That's the shock.

  6.  **Refining Tone and Language (British English):**
      *   Use "realise", "modelled", "programme", "maths".
      *   Idioms: "Barking up the wrong tree", "sweep under the carpet", "have a go", "properly", "rubbish".
      *   Bluntness: Don't say "It could be argued." Say "It is." or "This is wrong."
      *   Avoid politeness markers ("I think", "Perhaps").

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain PBR without Hilbert spaces?
      *   *Fix:* Use "joint sampling" and "zero-probability events".
      *   *Check:* Did I address the "completeness" point?
      *   *Fix:* Ensure the Residue Report highlights that standard stats assumes a $\theta$ exists, whereas QM questions if $\theta$ exists distinct from the distribution.
      *   *Check:* Is the verdict decisive?
      *   *Fix:* State clearly that the hunch is structurally sound but ignores the *no-go theorem* aspect which forces the choice.

  8.  **Final Polish:** Check against the "ugly and honest" constraint. Ensure the statistical analogy doesn't smooth over the weirdness of the PBR conclusion (that independence must go).

  *(Self-Correction on the PBR logic)*: I need to be careful. PBR shows that if $\psi$ is epistemic (overlapping distributions) AND preparation independence holds, THEN you contradict QM predictions. So you must drop one.
  In stats terms: If I assume my priors overlap AND my parameters are independent, I predict data that the system never produces.
  So, either my "priors" are actually the parameters (ontic), OR my parameters are correlated even when I think I prepared them independently (superdeterminism/conspiracy).

