  **Feedback Comments:**

  **Mechanism of honest signalling (3/4):**
  *   **Credit:** Your explanation in the first paragraph is strong. Specifically, *"A low-quality male simply can't afford the handicap, so only high-quality males produce it"* correctly identifies differential cost as the driver of honesty. Your reference to Grafen (1990) and the Spence analogy shows good engagement with the theoretical background.
  *   **Deduction:** In the third paragraph, you state: *"the long tail keeps spreading until every male has one, at which point the population is sitting at the honest equilibrium."* This is theoretically incorrect. For a signal to convey information (honesty), there must be variation in the signal correlated with quality. If every male has the same tail, the signal provides no information to the receiver, and the system collapses. You lost a mark here because this contradicts the mechanism you correctly outlined in paragraph one.

  **Empirical example (2/3):**
  *   **Credit:** You were asked to use *either* peacocks *or* stotting, but you discussed both. Your behavioural descriptions are accurate (e.g., *"jumps up and down instead of running straight off"*).
  *   **Deduction:** Regarding stotting, you write: *"It's also what Maynard Smith and Harper would call an index, because it can't be faked... and that's really the same point as the handicap principle, since both say the signal is reliable because of the cost."* This conflates two distinct categories. Indices are reliable due to physical constraints (cannot be faked regardless of cost), whereas handicaps are reliable due to strategic costs (could be faked, but too expensive). Saying they are "the same point" because of cost is incorrect for indices. This theoretical conflation costs a mark.

  **Conceptual question (2/3):**
  *   **Credit:** You correctly identify the link between Zahavi's biological model and Spence's economic model.
  *   **Deduction:** You conclude: *"the handicap principle and costly signalling are basically the same theory: any costly signal that's honest is a handicap."* This is an oversimplification. Costly Signalling Theory (CST) is the broader game-theoretic framework; the Handicap Principle (HP) is a specific hypothesis within CST requiring wasteful costs to prove quality. Not all costly signals are handicaps (e.g., some are indices with maintenance costs, or strategic signals without wastefulness). Because the question asked specifically to distinguish them, treating them as identical loses a mark.

  **Query for the student:**
  *   You cite Grafen (1990) and Maynard Smith & Harper confidently, which suggests you know the literature well. However, you conflate **Indices** (physical constraint) with **Handicaps** (strategic cost), and suggest signal fixation rather than variation. I'd like to query whether you distinguish these concepts in your notes but merged them for brevity here, or if you view them as interchangeable. In a tutorial, I'd ask you to clarify why an index isn't just a "perfect handicap."
