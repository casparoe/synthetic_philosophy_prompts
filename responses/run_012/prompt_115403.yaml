prompt: |-
  I'm a junior in high school and a few of us started this little philosophy club that meets in the libary at lunch — it's me, two friends, and a teacher who mostly just drinks coffee and nods — and I'm supposed to write a short paper for it about whether pain is bad because of how it feels or because of something else about it. I'm also taking AP Psych this year which is probly why I got stuck on this, and one of my friends wants to be a nurse so she keeps bringing me medical stuff.

  So here's the thing I keep running into and I don't have a word for it. Somewhere I heard about people with damage to a certain part of the brain who, when you do something that should really hurt — press hard on a tender spot, hold their hand in ice water — will say "yeah, that hurts, it really hurts," and they can say where it is and how strong it is, but they don't pull away, they don't get upset, they might even laugh and keep talking, and afterwards they don't seem to have minded at all. My nurse friend swears she saw something like it once: the patient rated the pain like a 9 out of 10 and then just went back to watching TV, didn't want anything for it, wasn't distressed. So the pain is still there, still registers, they'll even call it bad — but it isn't bad *for* them in the way that makes a person do something about it. Which is weird, because usually we say pain is the one thing that's bad just by being felt, and here the feeling is intact and the badness seems to have come off it.

  Is there a name for this? I mean the name of the condition itself, and also is there a name for the exact philosophical question it raises — whether the awfulness of pain is part of the sensation or a separate thing that can split off from it. I've seen "the badness of pain" used but that looks like the whole general topic, not this specific puzzle, and googling it mostly gets me either medical pages about nerve damage or blog posts that are all vibes. Also I don't think the label is really what I'm after, it's the edges: is this the same as someone in real pain who just doesn't complain because they're stoic, or the thing where a pain goes on so long you stop noticing it, or when an athlete gets hurt mid-game and doesn't feel it till later? Those feel different to me but I can't say exactly how. So if there's one established name for the exact thing, tell me; if not, tell me the nearest two or three names, how each one is different from what I described, and which fits best — and if none of them really fit, make up a term and tell me what it would and wouldn't cover. I don't need a reading list, I just want the concept straight so I can write this paper. Also pls end your reply with one final line that's exactly \answer{...} with the term in it (or \answer{none} if there isn't an established one) so I can stick it at the top of my notes.
