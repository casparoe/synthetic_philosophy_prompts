      *   **Topic:** The proverb "There but for the grace of God go I" used in arguments about moral responsibility and punishment (specifically the drunk driver case).
      *   **Task:** Act as a philosopher specializing in moral responsibility and criminal law. Answer at length.
      *   **Structure:**
          1.  Brainstorming phase (few sentences).
