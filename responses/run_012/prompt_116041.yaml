  7.  **Final Polish:** Check the voice. Ensure it sounds like a senior philosopher talking to a grad student. (e.g., "Let's tease this apart," "The proverb is doing too much heavy lifting.")

  8.  *(Self-Correction on the "Brainstorming" constraint)*: The prompt asks to "Begin by spending a few sentences brainstorming the space of readings before committing to any of them." I need to make sure this is distinct and upfront.

