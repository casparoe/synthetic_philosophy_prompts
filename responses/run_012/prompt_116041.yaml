      *   *Nuance:* Make sure to distinguish between *blame* (moral status) and *punishment* (legal consequence). The friend cares about punishment. Some theses abolish blame, which abolishes punishment, which is *stronger* than the friend wants. The friend wants *equal* punishment, implying punishment is still legitimate. This is a crucial tension to highlight.
