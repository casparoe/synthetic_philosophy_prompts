answer: |-
  ### Brainstorming Nearest Concepts

  Before carving out the precise definition you require, we must clear the conceptual underbrush. Several terms hover near your description, but each fails to capture the specific ethical and material configuration you have identified.

  1.  **Recontextualization:** This is the current industry standard in historic preservation (used by the National Trust for Historic Preservation and others). It broadly refers to adding information to an existing monument to provide a more complete historical picture. *Why it fails:* It is too capacious. It covers everything from adding a plaque about a general's military strategy to adding a plaque about his slaveholding. It does not distinguish between adding *historical facts* about the subject and adding *sociological facts* about the controversy surrounding the subject.
  2.  **Counter-Monument (*Gegenmonument*):** Coined by James Young regarding 20th-century German memory. These are structures designed to critique the very form of traditional monuments (often temporary, self-erasing, or interactive). *Why it fails:* Counter-monuments are usually new structures built to challenge an absence or a dominant narrative. Your case involves an *existing* traditional monument that is being retrofitted, not challenged by a separate aesthetic form.
  3.  **Agonistic Memory:** A theoretical framework (developed by Anna Cento Bull and Hans Hansen) that suggests democratic memory should embrace conflict rather than seeking consensus. *Why it fails:* This is a political philosophy, not a name for the material tactic. It explains *why* one might do what you describe, but it does not name the *what*.
  4.  **Metacommemoration:** A philosophical term referring to the act of commemorating the act of commemoration itself (remembering how we remember). *Why it fails:* While theoretically accurate, it is abstract. It lacks the specificity of the *retention* element (keeping the controversial object) which is central to your municipal dilemma.
  5.  **Multivocalism:** A museum studies term for presenting multiple perspectives. *Why it fails:* It implies a curation of voices within a neutral space (like a gallery). A statue in a public square is not a gallery; it is a claim to power. Multivocalism doesn't capture the tension of leaving the power claim (the statue) standing while annotating its illegitimacy.

  ### The Verdict and The Term

  There is no single, canonical term in municipal preservation or public philosophy that specifically isolates the move of **preserving the object while making the contestation of the object the primary subject of commemoration.**

  Practitioners call it "recontextualization," but as you have intuited, that label obscures the ethical shift. You are not merely adding context; you are shifting the *object of memory* from the figure to the dispute.

  Therefore, I propose the term **Metacommemorative Retention**.

  ### Definition: Metacommemorative Retention

  **Metacommemorative Retention** is the practice of maintaining a contested commemorative object in situ while installing an official paratext (plaque, panel, secondary sign) that explicitly documents the contemporary controversy surrounding the object, thereby shifting the site's primary function from honoring the historical figure to honoring the democratic process of contestation itself.

  **The Core Mechanism:**
  In traditional commemoration, the statue signifies the *Figure*. In Metacommemorative Retention, the statue + plaque signify the *Debate*. The physical object is retained not because it is deemed morally worthy, but because it serves as an essential artifact in a living civic argument.

  **The Ethical Claim:**
  The governing ethic is **Procedural Legitimacy**. The site vindicates neither the defenders (who keep the statue) nor the critics (who get the plaque); rather, it vindicates the *system* that allows both to coexist. Officials describe this as "honoring the conversation."

  ### Distinctions from Nearest Alternatives

  To ensure this term holds its weight, we must distinguish it from its nearest neighbors.

  | Concept | Material State | Content of Text | Object of Memory | Ethical Goal |
  | :--- | :--- | :--- | :--- | :--- |
  | **Conservative Retention** | Statue stays. | None, or original dedication only. | The Figure. | Continuity, Tradition. |
  | **Standard Recontextualization** | Statue stays. | Biographical/Historical data (e.g., "He owned slaves"). | The Figure (complexified). | Accuracy, Education. |
  | **Metacommemorative Retention** | **Statue stays.** | **Documentation of the dispute (e.g., "This statue is contested because...").** | **The Controversy.** | **Democratic Process.** |
  | **Removal / Iconoclasm** | Statue goes. | N/A (or moved to museum). | The Victim / The New Order. | Justice, Rupture. |
  | **Counter-Monument** | New structure added. | Critiques monumentality itself. | The Absence / The Warning. | Vigilance, Anti-Heroism. |

  **Key Differentiator:** In *Standard Recontextualization*, the plaque tells you about the man (e.g., "Lee was a skilled commander but fought for slavery"). In *Metacommemorative Retention*, the plaque tells you about the *statue* (e.g., "This statue was erected in 1920 to promote Lost Cause ideology and is currently the subject of civic debate regarding..."). The latter makes the memory itself the exhibit.

  ### Boundary Cases

  To sharpen the carving, here are three cases that test the boundaries of **Metacommemorative Retention**.

  **Case 1: The "Just the Facts" Plaque (Exclusion)**
  *   **Scenario:** A statue of a colonial founder remains. A plaque is added stating, "He authorized the massacre of X indigenous people in 1705."
  *   **Verdict:** This is **Standard Recontextualization**, *not* Metacommemorative Retention.
  *   **Reasoning:** The text concerns the historical actions of the figure, not the contemporary controversy about the figure. It seeks moral correction, not procedural validation. It does not invite the viewer to witness a debate; it invites them to witness a crime.

  **Case 2: The "Community Dialogue" Panel (Inclusion)**
  *   **Scenario:** A Confederate statue remains. A large panel is installed titled "Community Voices." It features QR codes linking to op-eds from both local activists demanding removal and veterans groups demanding retention. The header reads: "This site reflects our ongoing community conversation."
  *   **Verdict:** This **is Metacommemorative Retention**.
  *   **Reasoning:** The primary subject is the "Community Conversation." The statue is preserved as the catalyst for the dialogue. Both sides are offered procedural vindication (the statue stays, the critique is institutionalized).

  **Case 3: The "Artistic Critique" Installation (Exclusion)**
  *   **Scenario:** A statue of a controversial figure remains. An artist installs a temporary projection on the statue at night that highlights the names of victims associated with the figure.
  *   **Verdict:** This is a **Counter-Monument** or **Intervention**, *not* Metacommemorative Retention.
  *   **Reasoning:** This is unofficial (or artist-commissioned) and aesthetic rather than bureaucratic. It seeks to disrupt the viewer's experience of the statue, not to institutionalize the dispute as a civic value. Metacommemorative Retention is inherently bureaucratic; it is the state speaking about its own uncertainty.

  ### Why This Distinction Matters for You

  As a preservation officer, naming this **Metacommemorative Retention** protects you from two specific criticisms:

  1.  **The "Cowardice" Critique:** Critics will say you are "sitting on the fence." You can reply that you are not avoiding a decision, but making a specific *type* of decision: shifting the site's designation from "Honorific" to "Deliberative." You are preserving the artifact *as evidence of conflict*, not as a badge of honor.
  2.  **The "Erasure" Critique:** Defenders will say you are "vilifying" the figure. You can reply that the object is retained (Retention), satisfying the preservation mandate, but the *interpretation* must reflect current civic reality (Metacommemoration).

  This term gives you the language to assert that the *dispute* is now the historic resource being managed, not just the bronze or the stone. You are preserving the friction, not just the fixture.
