answer: |-
  There is no single, classical rhetorical term (like *chiasmus* or *metonymy*) that exclusively names this device. However, in contemporary critical theory, sociolinguistics, and literary studies, it is precisely identified as **Markedness Inversion** (or **Markedness Reversal**) deployed as a form of **Defamiliarization** (*Ostranenie*).

  The "carving" you request lies at the intersection of linguistics and rhetoric. Below is the technical breakdown of the device, its criteria, its failure mode, and the boundaries that distinguish it from neighboring concepts.

  ### 1. The Name and Mechanism
  The linguistic principle at work is **Markedness**. In linguistics, an *unmarked* term is the default, neutral, or assumed standard (e.g., "actor," "white," "straight"), while a *marked* term carries a suffix or modifier indicating a deviation from that norm (e.g., "actress," "Black," "gay"). The unmarked term invisibly claims the position of "humanity" or "standard," while the marked term is "specific" or "other."

  The rhetorical device is **Markedness Inversion**. It forces the unmarked category to become marked. By applying the suffix to the dominant group (e.g., "white people" becomes "people," "white people" becomes "white-people" while others are just "people," or as in your example, applying the racial modifier to everyone), the text exposes the arbitrariness of the original default.

  While "Markedness Inversion" is the technical descriptor, the *literary effect* is **Defamiliarization**. The goal is not to argue that the new usage is "correct," but to make the familiar (the original unmarked default) strange, thereby rendering the bias visible through the reader's own discomfort.

  ### 2. The Carving (Criteria for the Device)
  For a piece of writing to qualify as this specific device rather than general satire or world-building, it must meet four conditions:

  *   **Systematicity (The Rule of Grammar):** The inversion cannot be sporadic. It must function as a consistent grammatical or lexical rule throughout the text. If the author applies the suffix only once for effect, it is a **witticism**. If they apply it to a consistent logic for pages, it is **Markedness Inversion**.
  *   **Targeting the Unmarked:** The inversion must target the *dominant* or *default* category, not the marginalized one. If you invent a new word for a marginalized group, you are merely adding to the markedness. The device only works if the "standard" is forced to wear the label.
  *   **Frame Integrity (The No-Wink Rule):** The author must not break the fourth wall to explain the trick. The register must remain calm, editorial, or descriptive. If the author steps out to say, "I am doing this to show you something," it becomes an **essay** or **argument**. The power relies on the reader realizing the trick themselves.
  *   **Lexical Argument:** The point must be carried by the vocabulary itself, not by the propositional content. If the sentences argue "racism is bad" using normal language, it is **didactic**. If the sentences describe a mundane scene using the inverted language, letting the language *be* the argument, it is the device you describe.

  ### 3. The Characteristic Failure
  You asked for the name of the failure where the reader mistakes the mirror for the thing mirrored. In internet culture and rhetoric, this is known as **Poe's Law**.

  **Poe's Law** states that without a clear indicator of the author's intent, parody of extremism (or in this case, parody of biased language) is indistinguishable from sincere extremism (or sincere biased language).

  In a more academic register, this failure is a risk of **Reification**. The reader accepts the constructed linguistic reality as a sincere proposal rather than a critical tool. If the text is too fluent, the reader may not feel the "strangeness" required for defamiliarization; instead, they may absorb the inverted terminology as a new, earnest political demand, thereby amplifying the very tribalism the text sought to expose.

  ### 4. What Would Change the Verdict
  To determine whether a text fits this specific concept or falls into a neighboring category, consider these boundary conditions:

  *   **If the text creates a fantasy world:** If the inverted vocabulary is part of a fictional culture (e.g., an alien society where males are the marked sex), it is **Allegory** or **World-Building**. The device you describe requires the text to inhabit *our* reality, using *our* social categories, merely inverting the grammar.
  *   **If the text argues explicitly:** If the author writes, "We should call white people 'white people' because..." it is **Persuasive Discourse**. The device requires the *absence* of explicit argument.
  *   **If the tone is mocking:** If the inverted usage is clearly meant to ridicule the target (e.g., using "breeder" for "parent" to mock parents), it is **Satire** or **Invective**. The device you describe relies on a "calm register"; the tone must be neutral enough that the discomfort comes from the *logic*, not the *mockery*.
  *   **If the inversion is temporary:** If the author uses the trick for a paragraph and then reverts to standard English, it is a **Rhetorical Flourish**. To achieve the "ethnography of the reader's own mouth" effect you described, the immersion must be sustained long enough for the reader's internal monologue to begin using the new terms.

  ### Summary
  The device is **Markedness Inversion** used as **Defamiliarization**.
  The failure mode is **Poe's Law** (leading to **Reification**).
  The carving requires **Systematicity**, **Targeting the Unmarked**, **Frame Integrity**, and a **Lexical Argument**.

  It warrants a name because it is distinct from satire (which mocks) and allegory (which displaces). It is a form of **Immanent Critique**: it uses the system's own logic (grammatical marking) to expose the system's contradiction, without ever stepping outside the system to complain about it.
