      *   *Okay, let's look at the "Ownership" principle the user suggested.* It failed because the Cult Guy owns his beliefs.
      *   *My Proposal:* **The "Capacity for Reflection" Principle.** You are responsible if you possess the *capacity* to reflect on and revise your motives, even if you don't exercise it.
      *   *Mira:* Exercised it. Responsible.
      *   *Wired Guy:* Capacity bypassed. Not responsible.
      *   *Lucky Saint:* Has capacity (presumably), just didn't need to use it. Responsible. (User must accept this).
      *   *Cult Guy:* Did he have the capacity? If yes, responsible for acts (should have reflected). If no (brainwashed), not responsible. User's intuition (not responsible for beliefs, yes for acts) is the one to discard. It's all or nothing based on capacity.
      *   *Exhausted Friend:* Capacity diminished but not gone. Responsible.

      *   *Decision:* I will defend **Moderate Reasons-Responsiveness (Fischer & Ravizza style)**. It is the most robust compatibilist theory. It handles the history problem by focusing on the *current* mechanism's properties.
      *   *What the user must give up:*
