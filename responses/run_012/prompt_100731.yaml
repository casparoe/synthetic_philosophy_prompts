      *   *Classic Compatibilism (Frankfurt/Watson):* Focuses on identification/endorsement. Fails the Cult Guy case (he identifies with his cult beliefs).
      *   *Reasons-Responsiveness Compatibilism (Fischer & Ravizza):* Focuses on the mechanism being responsive to reasons.
      *   *Quality of Will/Strawsonian Reactive Attitudes:* Focuses on whether the action expresses ill will or disregard.

  4.  **Select the Best Principle to Defend:**
      *   The user is struggling with the *source* of responsibility (Ultimate Responsibility vs. Current Ownership). Strawson attacks Ultimate Responsibility. The user wants to keep some responsibility (Mira, Exhausted Friend) but acknowledges luck (Lucky Saint, Cult Guy).
      *   The most robust principle that handles the "Cult Guy" vs. "Exhausted Friend" tension while addressing the "Lucky Saint" problem is **Reasons-Responsiveness Compatibilism** (specifically a moderate version like Fischer's), *but* modified with a **Quality of Will** constraint to handle the blame/praise distinction.
