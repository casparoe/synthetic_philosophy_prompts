          5.  Exhausted Friend: Responsible. Mechanism was temporarily impaired but still *his*.

      *   *Wait, I need to be bolder.* The user asks me to commit. I will commit to **Reasons-Responsiveness Compatibilism**. I will explicitly tell them which intuitions to kill.
