  2.  **Brainstorming & Refining the Core Question:**
      *   *Initial thought:* Can we trade moral values?
      *   *Critique:* Too vague. "Trade" is metaphorical here.
      *   *Refinement:* Under what conditions does moral compromise constitute a Pareto improvement relative to the status quo of disagreement?
      *   *Problem:* If I think abortion is murder, compromising to allow some abortions isn't a "gain" for me; it's a moral loss.
      *   *Key Distinction:* We need to separate *outcomes* from *principles*. Or *procedural* agreement from *substantive* agreement.
      *   *Better Distinction:* *First-order* moral goods (the state of the world) vs. *Second-order* moral goods (the integrity of the agent / the process of agreement).
      *   *Formal Angle:* In bargaining theory, utility functions are fixed. In moral compromise, utility functions might be endogenous or lexicographic.
      *   *Central Question:* "Under what structural conditions can moral compromise be modeled as a Pareto-improving exchange rather than a utility-diminishing concession?"
      *   *Why the obvious replies fail:*
          *   "Always a gain": Ignores moral integrity costs (the "dirty hands" problem).
          *   "No trade possible": Ignores the value of peace/cooperation itself (the "modulus vivendi" argument).

  3.  **Developing the Distinctions (The "Angle"):**
      *   Need something sharper than just "values vs. actions."
      *   *Idea 1:* Alienability. In economics, I sell my apple; I don't sell my identity. In morality, some commitments *are* identity.
      *   *Idea 2:* The locus of the gain. Is the gain in the *outcome* (the policy) or the *relationship* (the avoidance of conflict)?
      *   *Selected Distinction:* **Integral vs. Instrumental Commitments.**
          *   *Instrumental:* I want X to achieve Y. I can trade X for Z if Z achieves Y better. (Fungible).
          *   *Integral:* I want X *because* I am the kind of person who wants X. Compromising X damages the self. (Non-fungible).
      *   *Why this lever?* It allows us to use formal tools (lexicographic preferences, constraints) to map where the "gains from trade" model breaks down.

  4.  **Designing the Method/Plan (10 Weeks Part-Time):**
      *   *Weeks 1-3:* Conceptual groundwork. Define the "Moral Bargaining Space."
      *   *Weeks 4-6:* Formal modeling. Build a modified Nash Bargaining Solution or Edgeworth Box where some goods have "integrity costs."
      *   *Weeks 7-8:* Case studies. Apply the model to specific scenarios (e.g., conscientious objection, political coalition building).
      *   *Weeks 9-10:* Drafting the working paper.
      *   *Specific Model:* A utility function $U_i = f(outcome, integrity)$. If $outcome$ violates a core constraint, $integrity$ drops to 0, making $U_i$ plummet regardless of material gain. This creates a "no-trade zone."

  5.  **Defining Success/Failure:**
      *   *Success:* A taxonomy of compromise types + a formal model showing the boundary conditions of the "gains from trade" analogy.
      *   *Failure:* The model is too simplistic to capture moral psychology, or the distinction collapses (everything turns out to be integral or everything instrumental).
      *   *Realism:* 10 weeks part-time is ~100-150 hours. Can't write a book. Must focus on *one* model and *one* key distinction.

  6.  **Drafting the Content - Section by Section:**

      *   *Title:* Needs to be catchy but precise. "Moral Gains from Trade?"
