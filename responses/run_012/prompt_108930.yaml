answer: |-
  **MEMORANDUM**

  **TO:** Criminal-Justice Coordinating Council
  **FROM:** Chair, Algorithmic-Accountability Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Pretrial Risk-Assessment Instrument Adoption

  **1. Executive Summary and Recommendation**

  After reviewing the statistical evidence, vendor proposals, and public testimony, I recommend that the Council **adopt the proposed risk-assessment instrument**, subject to strict operational guardrails.

  Regarding the central conflict over fairness metrics: I recommend we prioritize **Calibration** (predictive accuracy) over **Error Rate Balance**.

  This means we accept the vendor's assurance that a score of "7" represents the same statistical likelihood of reoffending regardless of the defendant's race, even though this results in Black defendants receiving high-risk scores at higher rates than White defendants. We do this because a risk score must truthfully reflect risk to be useful to a judge. However, to mitigate the disparate impact of this choice, we will prohibit automatic detention based on scores and require judges to articulate specific reasons when overriding low-risk recommendations.

  We will revisit this decision in **12 months**, after collecting local outcome data on release rates and rearrests disaggregated by race.

  **2. The Statistical Reality: Why We Cannot Have It All**

  To make this decision, we must accept a difficult mathematical truth explained by our statistician. When two groups have different underlying "base rates" of arrest (meaning, historically, one group is arrested at higher rates than the other for complex societal reasons), no algorithm can simultaneously satisfy two definitions of fairness:

  1.  **Calibration:** A score of 7 means the same risk for everyone.
  2.  **Error Rate Balance:** The tool makes mistakes (false positives and false negatives) at the same rate for everyone.

  Because historical arrest data shows different base rates for Black and White defendants in our jurisdiction, we must choose one. We cannot have both.

  *   If we choose **Error Rate Balance**, we must distort the scores. A "7" for a White defendant might mean a 70% chance of reoffending, while a "7" for a Black defendant might mean only a 50% chance. This lies to the judge about the actual risk.
  *   If we choose **Calibration**, a "7" means a 70% chance for everyone. But because the underlying data shows higher arrest rates in the Black community, more Black defendants will receive 7s. This looks like bias in the output, even if the math is accurate.

  **3. Addressing the Opposition**

  This choice leaves legitimate grievances on both sides. I want to address them plainly.

  **To the Defense Bar and those concerned with racial disparity:**
  You are correct that adopting this tool will result in more Black defendants being labeled high-risk. This is not a glitch; it is a reflection of the underlying data fed into the system. By choosing Calibration, we are accepting that the tool will reflect existing societal inequalities.
  *Why this argument does not win on the metric:* If we force Error Rate Balance to fix this disparity, we break the meaning of the score. We would be asking judges to make public safety decisions based on numbers that do not accurately reflect risk. That is dangerous for the community and unethical for the court. However, your grievance is valid regarding the *outcome*. That is why we are implementing the guardrails in Section 4 to ensure a high score does not equal automatic detention.

  **To those who want to reject the tool outright:**
  You argue that a tool producing racial disparities should not be used.
  *Why this argument does not win:* The alternative to this tool is not a neutral human decision. It is unguided judicial discretion. Studies consistently show that human intuition is *less* accurate than these instruments and often *more* biased, because human bias is hidden and unmeasurable. An algorithm's bias can be audited; a judge's gut feeling cannot. Rejecting the tool preserves the status quo, which we know produces worse liberty outcomes for everyone, particularly the poor and marginalized. We cannot fix systemic inequality by blinding ourselves to risk; we fix it by managing risk more humanely.

  **4. Operational Requirements**

  Adopting the tool is not a "set it and forget it" decision. To honor our commitment to Calibration while protecting liberty, we require the following:

  **A. Vendor Requirements**
  *   **Transparency:** The vendor must provide annual audits of the tool's performance on *our* local data, specifically reporting Calibration and False Positive Rates by race.
  *   **No "Black Box":** The vendor must disclose the weight of each factor (e.g., prior arrests, age) to the Committee to ensure no prohibited data (like zip code acting as a proxy for race) is unduly influencing scores.

  **B. Judicial Requirements**
  *   **Advisory Only:** The risk score is a *recommendation*, not a mandate.
  *   **Presumption of Release:** For any defendant scoring in the low-to-moderate range (0-4), there is a presumption of release on personal recognizance.
  *   **Justified Overrides:** If a judge chooses to detain a defendant who has a low-risk score, or release a defendant with a high-risk score, they must state the specific reasons on the record. This creates a paper trail we can audit for bias.
  *   **Blind Spot Training:** Judges must undergo training on the "Impossibility Theorem" described above. They must understand that a high score for a Black defendant and a White defendant represents the same risk, even if it feels disproportionate.

  **5. Timetable for Review**

  We are making a value judgment with incomplete information. We must verify our assumptions.
  *   **6 Months:** Interim report from the Committee on adoption rates and judicial override patterns.
  *   **12 Months:** Full audit. If the data shows the tool is *miscalibrated* (e.g., a 7 for Black defendants actually results in lower reoffense than a 7 for White defendants), we will suspend the tool immediately.
  *   **18 Months:** Council vote on continued adoption based on local outcome data.

  **6. The Philosophical Commitment**

  Finally, I must be clear about what we are claiming when we announce this tool is "fair."

  By prioritizing Calibration, we are defining fairness as **Truthfulness**. We are claiming that the court has a duty to know the actual risk a defendant poses, even if that truth is uncomfortable. We are deciding that it is worse to lie to a judge about risk than it is to have a risk distribution that looks unequal.

  However, we are also quietly deciding what fairness does *not* require. We are acknowledging that this tool cannot fix the root causes of the disparity. If Black defendants are arrested at higher rates due to policing patterns or economic inequality, this tool will reflect that. By adopting it, we are deciding that the criminal justice system should not try to solve societal inequities by distorting risk assessments. We are choosing to measure the world as it is, rather than as we wish it to be, while using our human discretion to mitigate the harshness of that reality.

  This is not a perfect solution. It is a compromise between accuracy and equity. But it is the only compromise that keeps the numbers honest and the discretion human.

  I ask for your vote to adopt under these terms.
