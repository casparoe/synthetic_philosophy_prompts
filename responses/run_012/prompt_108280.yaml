answer: |-
  **Project Title:** Participatory Maintenance: Individual Agency and Moral Significance in Collective Harm

  **Project Summary**
  This project addresses a persistent problem in moral philosophy and climate ethics: the inefficacy objection. This objection holds that individual actions to mitigate collective harms, such as climate change, are morally optional because their marginal causal impact is negligible. While existing frameworks attempt to resolve this tension through expected utility or collective obligation, they often fail to capture the intuitive moral weight individuals feel regarding their participation in harmful systems. This project proposes a novel conceptual distinction between *causal contribution* and *participatory maintenance*. Over one year of part-time research, I will develop this distinction to argue that an individual's action can possess moral significance by sustaining a harmful practice, even when it does not alter the total quantity of harm produced.

  **Research Question and Problem Statement**
  The central research question is: *Under what conditions does an individual's participation in a collective harm have normative significance when its marginal causal contribution is zero or negligible?*

  The inefficacy objection relies on a picture of individual action as a marginal increment to a linear causal process. On this view, if one fewer ton of carbon is not emitted because I drove less, my action is causally inert regarding the outcome of climate change. However, this model ignores the structural role of individual agents in reproducing social practices. My hypothesis is that the inefficacy objection is category-mistaken. It evaluates participation using the metrics of production rather than the metrics of maintenance. To resolve this, we require a framework that accounts for how individual actions constitute the background conditions that make collective harm possible.

  **Critique of Existing Approaches**
  Current philosophical responses to the inefficacy objection leave the problem unresolved. Expected utility theory attempts to assign value based on the probability of making a difference. However, in cases of causal overdetermination or threshold problems, the expected utility of individual action often approaches zero, failing to justify the stringent demands of climate ethics.

  Complicity-based accounts argue that individuals are morally tainted by association with wrongdoing. Yet, without a clear mechanism for how participation generates culpability absent causal impact, complicity risks becoming a vague metaphor for guilt rather than a rigorous normative category. Rule-consequentialism suggests individuals should follow rules that, if generally adopted, would minimize harm. This struggles with compliance conditions: if others do not comply, the individual's adherence appears futile. Finally, theories of collective obligation often locate agency at the group level, inadvertently exonerating the individual member who asks, "What must *I* do?"

  These approaches share a common limitation: they attempt to derive individual obligation from aggregate outcomes. They fail to explain why the *act of participation itself* carries moral weight independent of the outcome.

  **Methodology**
  This project employs a method of conceptual analysis and reflective equilibrium. It does not seek empirical data on psychological states but rather aims to clarify the normative structure of agency. The work will proceed in three phases over twelve months.

  *Phase 1: Conceptual Development (Months 1–4)*
  I will rigorously define "participatory maintenance." This concept posits that certain practices are ontologically dependent on individual uptake. An individual does not merely add to a stock of harm; they enact the practice that generates the harm. I will distinguish this from "causal contribution" by analyzing the counterfactuals involved. In causal contribution, we ask: *Would the harm occur without this specific act?* In participatory maintenance, we ask: *Does this act instantiate the pattern of behavior that constitutes the harm?*

  *Phase 2: Case Studies (Months 5–8)*
  I will test this distinction against three paradigmatic cases:
  1.  **Meat Consumption:** Analyzing whether buying a single package of meat sustains the industrial demand signal, distinct from causing a specific animal's death.
  2.  **Voting:** Examining how casting a vote maintains democratic legitimacy even when the vote is not decisive.
  3.  **Personal Carbon Emissions:** Applying the framework to the initial motivating case of household footprint reduction.

  *Phase 3: Objections and Refinement (Months 9–12)*
  I will subject the framework to the strongest available objections. The primary challenge will be the "isolated individual" case: if an individual participates in a vacuum where no one else observes or follows suit, does maintenance still occur? I will also address the charge that participatory maintenance is merely a relabeling of complicity. The final output will be a monograph-length manuscript or a series of articles articulating the refined theory.

  **Justification of Approach**
  This conceptual approach is preferable to empirical or utilitarian alternatives for specific reasons. An empirical study of why people *feel* complicit would describe psychological phenomena but could not prescribe whether they *ought* to feel that way. The problem is normative, not descriptive. Similarly, a straightforward application of expected utility theory is insufficient because it accepts the premises of the inefficacy objection rather than challenging the underlying metaphysics of action. By shifting the focus from outcomes to the constitution of practices, this project offers a way to validate individual moral agency without relying on improbable causal chains.

  **Feasibility and Timeline**
  This project is designed for one year of part-time work. As it requires no laboratory access, subject recruitment, or travel, it is compatible with concurrent professional and familial commitments. The timeline allows for flexible drafting periods. The primary risk is the scope of the literature; however, by focusing strictly on the distinction between contribution and maintenance, the research remains bounded.

  **Expected Outcomes and Criteria for Success**
  A successful outcome will establish a robust normative category of participatory maintenance that withstands counterexamples. It will provide a philosophical justification for individual climate action that does not rely on the claim that one person can stop climate change. This would be significant for moral philosophers working on collective harm, as well as for public ethicists seeking to communicate the value of individual lifestyle changes without resorting to exaggeration.

  **Criteria for Failure**
  The project will be deemed to have failed if:
  1.  **Redundancy:** The analysis demonstrates that "participatory maintenance" is indistinguishable from existing accounts of complicity or rule-following, offering no new explanatory power.
  2.  **The Isolation Problem:** The framework cannot account for the moral significance of an individual's action in a scenario where they are the sole participant (i.e., if no one else is maintaining the practice, does the individual's participation still matter?).
  3.  **Normative Impotence:** The distinction successfully describes the action but fails to generate a binding moral reason to act, leaving the inefficacy objection practically intact.

  By rigorously testing these failure conditions, the project ensures that the resulting theory is not merely a rationalization of intuition but a substantive contribution to ethical theory.
