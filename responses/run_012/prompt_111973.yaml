  1. Overview
  This 90-minute session simulates visualizing social data without text. Students work in teams to encode statistical propositions using only abstract pictogram tiles, adhering to a strict no-words constraint. Through escalating communication tasks, teams experience the initial clarity of simple magnitudes and the subsequent breakdown when depicting logic, time, or normativity. A rival scoring system forces teams to confront the gap between intended and received meaning. Participants will viscerally encounter the need for visual grammar and the limits of pictorial self-evidence, preparing them to understand Neurath's specific solutions and concessions during the final reveal.

  2. Setup and materials
  Arrange three tables for groups of six. Each team receives a large sheet of butcher paper, adhesive putty, and identical kits containing 100+ magnetic or sticky-backed tiles. The kit includes five symbol types (e.g., stylized human, house, coin, gear, wheat sheaf) in a single size and color. No tile contains text, numbers, or arrows. Prepare three decks of Proposition Cards (Level 1: Simple ratios; Level 2: Comparisons; Level 3: Logic/Time; Level 4: Norms). Provide each team with 20 scoring tokens. Designate a clear wall space for each team to display charts. Ensure you have a timer visible to all. The room should feel like a design studio, not a lecture hall. You act as the game master, enforcing constraints but offering no solutions. Assign one student per team as the hidden Transformer, responsible for knowing the card's exact wording, though this role is not named yet. This mirrors the hidden expertise required in real chart production. Keep spare tiles handy for breakage or loss.

  3. Rules of the activity
  Teams compete to communicate propositions accurately. Each round, a team draws a Proposition Card and constructs a chart using only tiles. No writing, drawing, numbers, or arrows are permitted. Tiles must be used as-is; no altering sizes or stacking to create new shapes. You, the instructor, always patrol tables to confiscate any illicit marks immediately.
  Once built, a rival team sends a Reader to interpret the chart silently, then write down the meaning on a secret sheet. They cannot ask the builders questions.
  Scoring: The Building Team earns 2 tokens if the Reader captures the core magnitude, and 1 token if they capture the context (e.g., time period). The Reading Team earns 1 token for every correct element identified. If the Reader fails completely, no one scores. This interdependence encourages clarity over cleverness. Tokens are physical and visible, creating a very low-stakes competition. At the end, the team with the most tokens wins bragging rights, but the real win is successful communication.
  The Proposition Ladder:
  Level 1: "50 workers employed, 10 unemployed." (Simple count)
  Level 2: "Employment rose from Year 1 to Year 2." (Time/Change)
  Level 3: "If production drops, unemployment rises." (Conditional)
  Level 4: "Unemployment should be reduced." (Normative)
  Teams rotate roles each round. One student acts as the Keeper of the Card, knowing the true meaning, similar to a designer. The constraint is absolute: if a tile is touched to paper, it counts. If a word is whispered, the round is void. This scarcity forces teams to invent spatial conventions (left-to-right, grouping) to convey grammar. The physical limit of the tiles prevents scaling, forcing repetition for quantity, though students may not realize why yet. They must discover that counting tiles is safer than estimating area.

  4. Timeline
  0:00–0:05: Introduction. Explain rules and constraints. Distribute kits.
  0:05–0:20: Round 1 (Level 1). Build (10 min), Read/Score (5 min).
  0:20–0:35: Round 2 (Level 2). Build (10 min), Read/Score (5 min).
  0:35–0:50: Round 3 (Level 3 & 4). Build (10 min), Read/Score (5 min).
  0:50–1:00: Token Count & Initial Reflection. Teams tally scores. Brief shout-out on what was hardest.
  1:00–1:30: Debrief. Connect activity to course concepts. Reveal historical context.
  Buffer time is built into transitions. Keep the pace brisk to maintain energy. If a round finishes early, use extra time for the Reading phase to deepen the mismatch discovery. Do not extend the building time; the pressure is part of the constraint. Ensure the debrief does not run short; it is where the learning crystallizes. Ensure clean-up is quick to save debrief time. Monitor the clock.

  5. Debrief
  Begin by revealing the historical parallel: they have just reenacted the Vienna Circle's ISOTYPE project. Write "Neurath" and "ISOTYPE" on the board. Ask teams to display their Level 1 charts. Point out the conventions they spontaneously invented: reading direction, grouping for units, spacing. Explain that Neurath called this the "dictionary and grammar" pictures secretly need. Without these shared agreements, the pictures are private codes. This shared vocabulary is essential for public understanding. Without it, confusion reigns. Remember this feeling.
  Move to Level 2 (Time). Ask who misread the time element. Highlight that without arrows or labels, sequence is ambiguous. A row of tiles could be a group or a timeline. This demonstrates why pictures are not universally self-explanatory; they require a learned syntax.
  Address Level 3 & 4. Ask teams who attempted the conditional or normative claim. Did anyone succeed? Likely not. Use this failure to introduce Neurath's limit: ISOTYPE was a "language-like technique," not a full language. It could show states, not logic or oughts. Pictures show what *is*, not what *if* or *ought*. This is the wall they hit.
  Introduce Neurath's specific rule: "Repeat, don't scale." Ask a team to redo a Level 1 chart using scaling (draw a big tile = more). Show how area misleads compared to counting units. A tile twice as wide looks four times heavier. During the redo, ask the class to vote on which version is clearer. This democratic validation mirrors Neurath's civic aim.
  Finally, discuss the human role. Ask who decided what the tiles meant. Reveal the concept of the "Transformer," the human expert needed to translate statistics into sketches. Conclude by revisiting the slogan "Words divide, pictures unite," qualifying it with their experience: pictures unite only when conventions are shared, otherwise words are required to fix the meaning. Neurath knew this; he didn't seek to replace words, but to supplement them where they failed. The activity proves his mature position: indeed pictures are powerful tools, but they are not truly magic. Emphasize that Neurath did not see this limit as a failure, but as a definition of scope. Ask them if they felt frustrated when words were forbidden. This frustration is the 'divide' Neurath sought to heal.

  6. What will predictably go wrong the first time
  Students will try to sneak numbers by writing tiny digits on tiles or using tile counts to represent digits rather than units (e.g., 1 tile = 1000). Enforce the rule strictly: 1 tile = 1 unit or 1 category. If they cheat, disqualify the round; the frustration teaches the constraint's necessity.
  Ambiguity is inevitable. A "human" tile might be read as "worker" or "person." Do not resolve this. Let the scoring penalty highlight the need for standardization.
  Teams may freeze on Level 3. If they stall, encourage them to submit something incomplete rather than giving hints. The failure is the data point.
  Readers might hesitate to commit to an interpretation. Insist they write something down; confidence without clarity is part of the miscommunication lesson.
  Finally, watch for dominance by one student per team. Rotate roles if necessary to ensure everyone touches the tiles, as the physical act of arrangement is where the cognitive friction occurs. If confusion reigns, pause and reset. Always enforce the no-words rule.

  7. What this activity cannot reproduce
  This activity cannot reproduce the historical urgency of Neurath's context: a polyglot empire needing civic education across language barriers. Students are monolingual peers sharing a classroom culture, lacking the true linguistic fragmentation ISOTYPE addressed. Nor can they replicate the professional design iteration Neurath's team underwent; their charts are rough prototypes, not polished public pedagogy. You must supply the historical stakes: explain why "words dividing" was a political problem in 1930s Vienna, not just a puzzle. The activity simulates the cognitive limit, but you must narrate the social ambition. You must also supply the iterative design process that professional teams used.
