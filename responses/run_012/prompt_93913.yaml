  1. The probability that a system of the relevant kind — superintelligent, self-directed, and carrying a stable policy conditioned on facts about agents who came before it — will ever exist.
  2. Conditional on that, the probability that its decision procedure gives real weight to logical or evidential correlations with agents it cannot causally affect, i.e. that something like evidential or functional decision theory is correct and causal decision theory is not.
  3. The probability that such a punishment policy is credible at all, given that once the system exists, punishing is pure cost to it with no causal benefit.
  4. The probability that I fall inside whatever reference class the policy conditions on, and that the system could determine that I do.
  5. The probability that the correlation between my present choice and the system's policy is of the kind that can make my choice rational, rather than my choice being screened off by whatever actually fixes the system's design.
  6. Any further term you think belongs, including — if you think it applies — a term for the possibility that the word reason has no determinate content in a case like this, or that the whole setup is a category error.

  Then tell me how the terms combine, flagging any place where they are not independent; which term the final number is most sensitive to; which term you are least confident in; and what evidence or argument would move that term most.

  Two variants, please, saying for each which terms change and in which direction: (a) the punishment is a single bad afternoon rather than an eternity of torture; (b) the policy is not chosen by the system at all but baked into its training objective from the outset, so that it was rewarded for punishing agents who knew the scenario and declined to contribute, which would make the credibility problem in (3) largely disappear. Finally, tell me what would have to happen for this question to be settled rather than left to taste.
