answer: |-
  This is a rich pedagogical pairing. Signalling theory, particularly Amotz Zahavi's Handicap Principle, posits that reliable communication requires cost: a signal is trustworthy only if it is too expensive for a low-quality actor to fake. A peacock's tail is heavy and dangerous; only a healthy peacock can survive it. Therefore, the tail proves health.

  When applied to *Sir Gawain and the Green Knight*, this biological framework illuminates the poem's obsession with public proof, but it ultimately fractures against the poem's theological and chivalric concern with interior integrity (*trawthe*). Here is a reading of the three devices through that tension.

  ### 1. The Beheading Game: Commitment Device, Not Handicap
  The Green Knight's entrance is a classic display of dominance, but the game itself functions less as a handicap signal and more as a **commitment device**.

  In signalling theory, the Green Knight's appearance (green skin, massive size, no armor) is a handicap signal of supernatural vitality. He absorbs a blow that would kill a man to prove he is not a man. However, the *game* he proposes—a blow for a blow in a year and a day—is not strictly a signal of quality. If it were a pure handicap, the Green Knight would need to incur a net loss to prove his power. Instead, he incurs a temporary inconvenience (losing his head) to establish a binding contract.

  By surviving the decapitation, he does not just signal strength; he creates a **credible threat**. In game theory, a threat is only credible if the threatener has the capacity and incentive to carry it out later. By picking up his head and speaking, the Green Knight solves the problem of "time inconsistency." He proves he will exist in the future to collect the debt. The "cost" of losing the head is nullified by his magic, so it fails the Zahavi test of a true handicap (a cost that cannot be faked). Instead, it is a ritual mechanism designed to bind Gawain to a future appointment. The theory illuminates the *spectacle* of the Knight, but the poem's logic reveals the game as a legalistic trap, a binding of time rather than a display of biological fitness.

  ### 2. The Exchange of Winnings: Normative Covenant, Not Informational Signal
  The daily bargain between Gawain and Bertilak (hunt results for bedroom gains) looks like a signalling system: Gawain signals his honesty by handing over the kisses. If he were a "bluffer" (a discourteous knight), he would keep the kisses. By paying them, he signals high quality.

  However, reading this strictly through the Handicap Principle misses the poem's central ethic of *trawthe* (truth/fidelity). In signalling theory, the value of the signal is **informational** (it tells Bertilak something he didn't know). In the poem, the value of the exchange is **normative** (it binds Gawain to a moral law).

  The "cost" here is not biological energy or risk, but the risk of social and spiritual ruin. When Gawain withholds the sash, he breaks the signal. But the poem treats this not merely as a transmission of false information, but as a sin. Signalling theory assumes agents act to maximize reputation or survival; Gawain acts (mostly) to maximize fidelity to a vow. The exchange is a covenant. Its binding force comes from the shared understanding of chivalric law, not the material cost of the kisses. The theory illuminates the *structure* of the exchange (reciprocity), but it cannot account for the *weight* of the violation. Gawain's failure isn't that he sent a false signal; it's that he broke a sacrament of honor.

  ### 3. The Green Sash: From Cheap Talk to Costly Signal
  The sash is the most complex case. The Lady offers it as a magic charm that prevents death. This is **cheap talk**: a costless claim that is ultimately false (the magic doesn't work; the Green Knight controls the outcome). Gawain accepts it secretly, violating the exchange covenant.

  Initially, the sash is a counterexample to the Handicap Principle. It is a "cheap" object offered with a false claim, accepted to avoid a cost (death). It is a signal of cowardice masked as prudence. However, the poem transforms the sash in the final scene. Gawain returns to Camelot wearing the sash not as a charm, but as a "token of untrawthe."

  Here, the sash becomes a **costly signal**, but the cost is semiotic, not biological. It costs Gawain his pride. He wears it to signal his humility and failure. This resists the theory because, in Zahavi's model, the cost must be inherent to the display (like the weight of the tail). In *Gawain*, the cost is assigned by the community's interpretation. The cloth itself is cheap; the shame is expensive. The poem suggests that a sign becomes "costly" only through the moral consciousness of the wearer and the viewer. The theory sees the sash as a badge of low quality; the poem sees it as a badge of redeemed integrity.

  ### Conclusion: Where the Analogy Must Be Dropped
  Signalling theory illuminates the *public* architecture of the poem: the Green Knight's intimidation, the public vows, and the final shaming at court. It explains why rituals must be visible and why breaches must be marked.

  However, the analogy must be dropped where the poem moves into **interiority**. Signalling theory is fundamentally externalist: if a cost is not observed, the signal does not function. *Sir Gawain and the Green Knight* argues that *trawthe* exists even when no one is watching. Gawain's anguish in the bedroom is real before the sash is ever revealed. The poem understands that trust is not merely a calculation of credible threats or costly displays, but a relationship with the self and with God.

  The theory assumes that honesty is a strategy for survival or reputation. The poem suggests that honesty (*trawthe*) is an end in itself, sometimes requiring the sacrifice of survival (accepting the blow) and reputation (wearing the sash). Where signalling theory asks, "How do we prove we are trustworthy?", the poem asks, "What does it cost to *be* trustworthy when proof is impossible?" That is a question of grace, not biology, and it is where the hand of the theorist must stay the pen of the poet.
