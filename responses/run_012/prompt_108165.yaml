prompt: |-
  I am teaching Sir Gawain and the Green Knight alongside a unit on signalling theory in biology and the social sciences, and I want a reading of the poem that takes both the poem and the theory seriously. Three of its devices look like signals. The Green Knight's Christmas game is a wager in which a man offers his neck and then, holding his own severed head, keeps the appointment; Bertilak's daily bargain is an economy of exchange in which kisses are traded for a deer, then a boar, then a fox; and the lady's green sash is a cheap object offered as a charm against death, accepted in secret, and afterwards worn by Gawain as a permanent mark of his fault. Read these through the handicap principle — Zahavi's claim that a display is trustworthy only because it is costly enough that a bluffer could not afford it — and say where the theory genuinely illuminates the poem and where the poem's own logic resists it. Is the beheading game a signal at all, or a commitment device that makes a threat credible? Is the exchange of winnings a signalling system, or a covenant whose binding force is normative rather than informational? Is the sash the poem's counterexample to cheap talk, or the one place where a sign does its work without being costly? End by saying what the poem understands about trust that the theory cannot state, and where the analogy should be dropped rather than forced.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** *Sir Gawain and the Green Knight* (SGGK) read through the lens of Signalling Theory (specifically the Handicap Principle).
      *   **Key Devices to Analyze:**
          1.  The Beheading Game (Green Knight's challenge).
          2.  The Exchange of Winnings (Bertilak's bargain).
          3.  The Green Sash (Girdle).
      *   **Theoretical Framework:** Amotz Zahavi's Handicap Principle (signals are trustworthy *because* they are costly; bluffers can't afford them).
      *   **Critical Task:** Identify where the theory illuminates the poem and where the poem resists the theory.
      *   **Specific Questions to Address:**
          *   Is the Beheading Game a signal or a commitment device?
          *   Is the Exchange of Winnings a signalling system or a normative covenant?
          *   Is the Sash a counterexample to cheap talk or a sign that works without cost?
      *   **Conclusion:** What does the poem understand about trust that the theory cannot state? Where should the analogy be dropped?

  2.  **Deconstruct the Theoretical Framework (Signalling Theory/Handicap Principle):**
      *   *Core Idea:* Communication involves a sender and a receiver. Information is asymmetric. To prove quality/intent, the sender must incur a cost that a low-quality sender (bluffer) could not sustain.
      *   *Example:* A peacock's tail. It's heavy and attracts predators. Only a healthy peacock can survive with it. Therefore, the tail signals health.
      *   *Application to Humans:* Rituals, gifts, risks.
      *   *Limitations:* Human social contracts often rely on norms, laws, and internal morality, not just biological costs. "Cheap talk" can sometimes be binding if reputation is at stake.

  3.  **Analyze Device 1: The Beheading Game:**
      *   *The Scene:* Green Knight offers neck, takes blow, picks up head, speaks.
      *   *Signalling View:* The GK demonstrates supernatural durability. The cost (losing a head) is high, but he pays it and survives. This signals he is not human, that the threat is real.
      *   *Commitment Device View:* A commitment device binds a player to a future action. By surviving, GK proves he *can* collect the debt in a year. It makes the threat credible.
      *   *Tension:* Is it a signal of quality (I am magical/strong) or a mechanism to enforce a contract (I will be here to hit you back)?
      *   *Verdict:* It functions more as a *commitment device* than a pure handicap signal. The cost isn't really a cost to him (he doesn't die). The "cost" is theatrical. It establishes the *rules* of the game, not just the *quality* of the player.

  4.  **Analyze Device 2: The Exchange of Winnings:**
      *   *The Scene:* Bertilak hunts; Gawain stays. They swap what they get (game for kisses).
      *   *Signalling View:* Gawain signals his courtesy and honesty by giving the kisses. The "cost" is the potential breach of chastity (if kisses lead to more) or the effort of resisting the lady.
      *   *Normative/Covenant View:* This is a *truce* or a *contract*. It's binding because they swore on their honor/truth (*trawthe*). It's not about the biological cost of the kiss; it's about the social obligation of the vow.
      *   *Tension:* Signalling theory focuses on the *information* conveyed (I am honest). The poem focuses on the *binding nature* of the agreement (I am obligated). If Gawain keeps the sash, he breaks the signal *and* the covenant.
      *   *Verdict:* It's primarily a normative covenant. The "cost" is social/moral ruin, not biological. Signalling theory struggles with internalized moral duty vs. external display.

  5.  **Analyze Device 3: The Green Sash:**
      *   *The Scene:* Lady offers it as magic protection. Gawain accepts (hiding it from Bertilak). Wears it as shame later.
      *   *Signalling View:* Lady claims it saves lives (high value). Gawain accepts it to survive (cost: breaking the exchange vow).
      *   *Cheap Talk:* The Lady says it's magic. Is it? No (Bertilak reveals the test). It was "cheap talk" (false signal).
      *   *Handicap:* Gawain wears it later as a badge of shame. Now it *becomes* costly (social stigma).
      *   *Tension:* Initially, it's a deceptive signal (magic charm). Finally, it's a honest signal of failure (shame).
      *   *Verdict:* It starts as "cheap talk" (a lie about magic) but transforms into a "costly signal" (the mark of sin). This resists the Handicap Principle because the object itself isn't costly; the *meaning* attached to it becomes costly through social interpretation.

  6.  **Synthesize: Where Theory Illuminates vs. Resists:**
      *   *Illuminates:* The Green Knight's appearance (green, huge, axe) is a classic handicap signal of dominance. The sash as a badge of shame fits the "costly signal of humility."
      *   *Resists:* The poem is about *trawthe* (truth/integrity), an internal state. Signalling theory is about external verification. The poem values the *secret* fault (which signalling theory says shouldn't count if no one sees). Gawain's shame is internal before it becomes external.
      *   *Trust:* The poem suggests trust is rooted in shared moral frameworks (*trawthe*), not just cost-benefit analysis. The theory assumes self-interest; the poem assumes a duty to God and honor that transcends survival.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the pairing. Define Handicap Principle briefly. State the thesis: The poem uses the *logic* of signals but ultimately subordinates it to the logic of covenant and interiority.
      *   *Section 1: The Beheading Game.* Distinguish Signal vs. Commitment. It's a commitment device. The "cost" is nullified by magic, so it's not a true handicap. It creates a binding future obligation.
      *   *Section 2: The Exchange of Winnings.* Signal vs. Covenant. It's a ritual of *trawthe*. The value isn't the deer/kiss equivalence, but the fidelity to the word. Signalling theory misses the normative force of the vow.
      *   *Section 3: The Sash.* Cheap Talk vs. Costly Signal. Initially cheap talk (false magic). Finally a costly signal (shame). But the cost is social/semiotic, not biological.
      *   *Conclusion:* What the poem knows that theory doesn't. Interiority. *Trawthe* as an end in itself, not a means to reputation. Where to drop the analogy: When the poem moves from public display to private conscience.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address Zahavi specifically? Yes, emphasize the "cost" aspect.
      *   *Check:* Did I answer the specific questions in the prompt?
          *   Beheading = Commitment device? Yes.
          *   Exchange = Normative covenant? Yes.
          *   Sash = Counterexample/Cheap talk? Yes.
      *   *Nuance:* Make sure not to dismiss the theory entirely. It *does* explain the Green Knight's initial intimidation and the final public shaming. The friction is in the middle (the secret sin).
      *   *Key Term:* *Trawthe*. Must include this. It's the Middle English concept of truth/fidelity that anchors the poem.

  9.  **Final Polish:** Check tone (academic but accessible for a teacher). Ensure clear headings or structure. (Decided on a structured essay format).

  **(Self-Correction Note):** I need to be careful not to conflate "commitment device" (Game Theory) with "signalling" (Information Economics), though they are related. The prompt asks to read through the Handicap Principle specifically. I should clarify that a commitment device *uses* signalling logic but serves a different function (binding future action vs. revealing current quality).

  10. **Final Review against Prompt:**
      *   Read devices through Handicap Principle? Yes.
      *   Say where it illuminates/resists? Yes.
      *   Beheading = Signal or Commitment? (Argue Commitment).
      *   Exchange = Signalling or Covenant? (Argue Covenant).
      *   Sash = Cheap talk or Costly? (Argue it transforms).
      *   End with what poem understands about trust theory cannot. (Interiority/Grace).

