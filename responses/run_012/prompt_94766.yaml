  FOR IMMEDIATE RELEASE
  CONTACT: Office of Metaphysical Compliance
  DOCKET: ICINJ-2024-DEC
  DATE: October 24, 2024

  The International Commission on the Integrity of Nature's Joints (ICINJ) today concluded its Decennial Review of the Official Catalogue of Natural Kinds. Following extensive deliberation and spectral analysis of categorical boundaries, the Commission issues the following binding resolutions regarding the ontological status of entities within the observable universe. All research institutions are expected to update their signage and textbook margins accordingly.

  Pursuant to Section 4 of the Ontological Standards Act, the Commission hereby abolishes the mandatory requirement for strict essences. Kind membership shall no longer require a single necessary and sufficient condition. Instead, applicants may qualify under a Cluster Cohesion Permit, provided that at least sixty percent of characteristic properties co-occur with statistical significance. Applicants must submit Form 44-B demonstrating property clustering. This adjustment acknowledges that nature frequently fails to adhere to binary logical structures preferred by previous administrations.

  Regarding boundary precision, Resolution 2024-B stipulates that any category exhibiting vague or gradual transitions between instances shall be reclassified as an "Administrative Kind." Natural Kinds must possess crisp boundaries. Entities displaying soritical drift—wherein removal of a single grain alters the classification—are hereby designated as human-imposed conveniences rather than mind-independent realities. Field agents are instructed to issue cease-and-desist orders to any researchers treating such categories as fundamental without proper zoning permits.

  The Commission further addresses the status of paraphyletic groups. The classification "fish" is hereby revoked as a Natural Kind due to its exclusion of tetrapod descendants. While lungfish share a more recent common ancestor with cows than with tuna, colloquial usage permits the term to persist under a Historical Convenience Waiver. Similar restrictions apply to "reptiles" and "invertebrates." These groups may remain in textbooks provided a disclaimer notes their failure to constitute a complete branch of the tree of life.

  In cases of nomenclature homonymy, where a single historical term refers to two distinct mineral compositions, priority shall be granted to the specimen filed earliest in the Federal Registry. The second specimen must adopt a new designation within six months. This ruling prevents ontological overcrowding and ensures each label corresponds to a unique underlying structure. Failure to comply will result in the revocation of mining rights.

  Categories defined solely by human utility, such as "weeds" or "pests," are denied Natural Kind status. These entities shall operate under a Human-Interest License. Holders of this license acknowledge that the category exists only relative to agricultural or domestic objectives. Renewal of this license requires proof of continued nuisance value. If the weed becomes medically useful, it must apply for a Natural Kind upgrade.

  Provisional licenses are available for kinds that are real but messy. These permits allow for temporary classification pending further phylogenetic resolution. In asserting its authority to issue these rulings, the Commission cites the precedent established by the 2006 Planetary Classification Tribunal. The successful reclassification of celestial body 134340 via committee vote confirms that ontological status may be determined by majority ruling when empirical data is insufficiently jointed. This precedent validates the Commission's authority to adjudicate reality through democratic procedure.

  The Official Catalogue is open for public comment for a period of forty-five days. Objections must be submitted in triplicate and notarized. The Commission does not guarantee a response to comments suggesting that nature is immune to bureaucratic regulation. All comments received after the deadline will be filed under "Non-Existent Entities."

  ### END ###
