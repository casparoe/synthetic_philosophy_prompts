answer: |-
  ### Private Plan

  This eulogy must acknowledge the concrete good Ballard achieved (the filtration plant) without allowing it to function as moral currency that purchases innocence for the means used to secure it. It must name the lie told to Dolores Ayala explicitly and recognize her presence as a limit on the room's authority to forgive or absolve, distinguishing her private debt from the public's general grief. It must validate the love and loss felt by his family and staff without conflating that personal grief with a collective moral verdict, ensuring the speech honors the dead without lying about the living. Finally, it must refuse the ritual function of a memorial as a machine for absolution, leaving the moral accounting unresolved rather than falsely settled.

  ### Moments Where the Distinction Bites

  1.  **The Remediation vs. The Silence:** When describing the filtration plant, the text must assert that the clean water is a fact, but not a receipt; the success of the policy does not erase the morality of the secrecy.
  2.  **The Address to Ms. Ayala:** When noting her presence in the third row, the speech must establish that her injury is specific and hers alone, placing her outside the collective "we" of the mourners who might wish to generalize the harm.
  3.  **The Private Confession:** When recounting Ballard's final admission ("would do it again" vs. "was right"), the text must preserve his distinction rather than collapsing it into a simple apology or a stubborn defense.
  4.  **The Closing Benediction:** The conclusion must explicitly deny the room the authority to grant forgiveness, framing mourning as an act of memory rather than a settlement of accounts.

  ***

  ### Eulogy for Owen Ballard

  Friends, colleagues, family. Thank you for letting me stand here.

  For many of you, Owen Ballard was a husband, a father, a grandfather. For some, he was a boss who demanded better than you thought you could give. For others, he was the mayor who kept the factories open and the streets plowed. I was twenty-two years old when I started working for him. I sat in the anteroom outside his office, where I could hear the hum of the radiator and the low murmur of voices behind the wood paneled door. I learned there that governing is rarely done in the light. It is done in the hum, and the murmur, and the stack of files that never quite makes it to the press.

  We are gathered to honor a life, and Owen's life was one of immense consequence. He loved this city with a ferocity that sometimes looked like possession. When the water tests came back in 1982, he understood what was at stake. He understood that a public panic could shut down the plants that fed our families, and he understood that the contamination was poisoning our children. He chose a path. He kept the file closed for eleven months. He went to the owners of the plating plant, the family that had put him in office, and he made a deal. He traded silence for filters. He traded secrecy for remediation.

  The plant came online in 1986. The soil was treated. By any measure, the water is cleaner today because of what he did. Lead levels in this county fell by half over the following decade. There are children breathing easier because Owen Ballard forced that work to happen. We should not lie about that. We should not pretend the work was nothing.

  But we must not lie about the cost.

  In the interval, while the file was closed, Dolores Ayala's son was diagnosed with lead poisoning. Owen told her the city had no evidence linking the diagnosis to the plant. He knew that was false. He looked her in the eye and he lied. Ms. Ayala is here today. She is sitting in the third row. She carries a debt that was owed to her specifically, not to this city, not to this union hall, and not to me.

  There is a temptation, in a room like this, to smooth the edges. To say that because the water is clean, the hands are washed. To say that because we loved him, he was right. Owen would not have wanted that. A year before he died, he told me he would make the same choice again. But he insisted, fiercely, that saying he would do it again was not the same as saying he was right. He held those two thoughts in his head until the end: that he would repeat the act, and that the act had wounded someone who deserved better.

  We need to hold those two thoughts too.

  We are here to mourn a man we knew. His widow is here, grieving a husband. His grandchildren are here, grieving a grandfather. His staff is here, grieving a mentor. You are entitled to that grief. Love is not a verdict, and grief is not a pardon. You can love him for what he built without claiming that what he built pays for what he broke. The love you feel is real. The harm he caused is also real. One does not cancel the other.

  But there are limits to what this room can do. We are a community, but we are not a court. And even a court cannot settle every kind of debt. There are wrongs that dissipate into the public air—a lie told to a city, a confidence broken with no one in particular. For those, no collective absolution is valid. A room full of mourners has no more authority to forgive a public lie than a stranger has to forgive my private debts. And there are wrongs that land on a single person. For those, only the injured party holds the key.

  Ms. Ayala sits in the third row, and her presence is a boundary this room cannot cross. We cannot vote to forgive what was done to her son. We cannot applaud the filtration plant into a receipt for her pain. We can only acknowledge that she is here, and we are here, and these are not the same thing.

  So let us not use this service to settle accounts that cannot be settled. Let us not try to manufacture innocence where there was only complexity. Owen Ballard was a man who believed that sometimes you have to get your hands dirty to keep the water clean. He was willing to carry the weight of that. He never asked us to carry it for him.

  We are here to remember him. We are here to say that he mattered. We are here to acknowledge that the world is different because he was in it, for better and for worse. We can honor the work without endorsing the lie. We can love the man without absolving the mayor.

  Let us leave here with the truth intact. The water runs clear. The debt remains. And we are left to remember the man who lived in the space between them.

  Thank you.

  ***

  ### The Hinge Sentence

  *"You can love him for what he built without claiming that what he built pays for what he broke."*

  **Why:** This sentence operationalizes the dissertation's core theoretical distinction—the separation of public utility from private moral debt—without using any theoretical language. It directly addresses the temptation of the audience (the family and allies) to view the remediation as a transactional receipt for the lie, while simultaneously validating their right to love him. It draws the boundary line that prevents the eulogy from becoming a machine of absolution, ensuring the moral remainder remains acknowledged even as the mourning proceeds.
