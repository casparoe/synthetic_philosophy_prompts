  Here is the principle, the verdict you need to surrender, and the reasoning that ties it all together.

  ### The Principle: Reciprocal Subjection

  You have the standing to blame someone for violating a norm **only if you are currently subjecting yourself to that same norm.**

  This principle draws a hard line between *compliance* and *violation*. It does not care about your history (past sins don't count), your trauma (pain doesn't count), or your expertise (knowledge doesn't count). It cares only about your current relationship to the rule you are invoking. To blame is to say, "We are both under this law, and you broke it." If you are not under the law (because you exempt yourself by breaking it), you cannot speak for the law.

  ### The Verdict You Must Give Up: Priya

  This is the bullet you have to bite. **Priya does not have the standing to blame you.**

  I know this feels wrong because she is right about the danger, and her trauma makes her warning visceral. But under the Principle of Reciprocal Subjection, there is a crucial distinction you are conflating: **Epistemic Authority vs. Moral Standing.**

  *   **Epistemic Authority:** Priya knows what she is talking about. She has survived a crash. You should absolutely *listen* to her warning. She has earned the right to be heard on the *facts* of danger.
  *   **Moral Standing:** This is the right to *sanction* you. To say, "You are wrong to do this." Because she is currently driving like a maniac, she is actively exempting herself from the norm of safe driving. She is saying, "This rule is too dangerous for you, but I will continue to break it." That is the definition of lacking standing.

  By giving up the verdict that Priya has *standing*, you protect your own boundaries. You can say to her: *"I hear your warning, and I respect your experience. But you speed too, so you don't get to judge me for it."* This allows you to accept the safety advice without accepting the moral shame.

  ### The Verdict You Must Solidify: Your Brother

  You are flip-flopping on your brother, but the principle is clear: **He has standing.**

  Unlike Priya, your brother is not currently violating the norm. He cheated in the past, but he has subjected himself to the norm of fidelity for years. A reformed violator is not a hypocrite; they are a witness to the cost of breaking the rule. Because he is currently holding himself to the standard of faithfulness, he is entitled to point out when you are drifting from it. His history doesn't disqualify him; it actually reinforces his subjection to the norm because he actively chose to return to it.

  ### How This Resolves Your Other Cases

  *   **Dana (The Late Friend):** She violates the norm of punctuality while enforcing it on you. She exempts herself. **No Standing.** (Matches your gut).
  *   **Dad & Ex-Smoker Uncle:** Both are currently subjecting themselves to the norm of non-smoking. **Standing.** (Matches your gut).
  *   **Smoking Uncle (Diet):** He violates the norm of health while enforcing it. **No Standing.** (Matches your gut).
  *   **The Neighbor (Landlord):** This is the nastiest case. He runs bad rentals while complaining about bad rentals. He benefits from the violation while punishing others for it. He is the ultimate exempts. **No Standing.** (Matches your gut).

  ### Predictions for New Cases

  Here is how the Principle of Reciprocal Subjection predicts outcomes for the scenarios you mentioned:

  **1. Can a company have standing?**
  Yes, but only if it complies with its own code. If a tech company lectures users on "digital wellbeing" while its algorithms are designed to addict them, it has no standing. It is exempting itself from the norm it sells. If a company genuinely audits itself and holds itself to the standard it demands of users, it gains standing.

  **2. Can a country have standing?**
  This is where the principle bites hardest. Under Reciprocal Subjection, a country with a poor human rights record has *no standing* to condemn human rights abuses in another country. This explains why international criticism often feels like hypocrisy. The principle predicts that a country only gains standing to blame others when it submits to the same international tribunals it invokes.

  **3. Can you blame someone on your sister's behalf?**
  Yes, but the norm must be one *you* are subject to. If your sister is being disrespected, you have standing to blame the offender only if you uphold the norm of "respecting others." You are not blaming them for hurting *her* specifically; you are blaming them for violating a shared value (respect) that you also uphold. If you are a bully yourself, you lose the standing to defend her, because you are not subject to the norm of respect.

  ### Where I Bite the Bullet

  I acknowledge that silencing Priya feels harsh. She is trying to save you from harm. But if we grant standing to anyone who has suffered the consequences of a bad behavior, we risk turning blame into a competition of trauma. "I crashed, so I can yell at you for speeding." "I got divorced, so I can yell at you for texting."

  By restricting standing to those who *comply*, we keep blame focused on the **value**, not the **victim**. Priya's pain is real, but it doesn't give her the gavel. It gives her a microphone. Listen to the warning, but reject the blame.

  **Summary:**
  1.  **Principle:** Reciprocal Subjection (You must follow the rule to enforce the rule).
  2.  **Give Up:** Priya's standing to *blame* (keep her authority to *warn*).
  3.  **Solidify:** Brother's standing (he is reformed/compliant).
  4.  **Result:** A consistent framework that protects you from hypocrites (Dana, Neighbor) while allowing guidance from reformed allies (Brother, Dad) and traumatized experts (Priya, but only as advisors).
