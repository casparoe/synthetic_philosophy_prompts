answer: |-
  **FINAL EXAMINATION: PHIL 450 – CONSCIOUSNESS AND THE SELF**
  **Time Allowed:** 90 Minutes (Take-Home Component)
  **Instructions:** Answer the following question. You may refer to your annotated reading list, but internet access is prohibited. Your response should be argumentative, precise, and engage directly with the hypothetical case provided.

  ***

  ### EXAM QUESTION

  **Case R.:** Patient R. has undergone a complete commissurotomy. However, she possesses an experimental "callosal bridge," a prosthetic channel transmitting information between hemispheres with low bandwidth and significant temporal delay. When this delay is exploited, the hemispheres can be made to disagree on perceptual and motor tasks. Despite this, R. reports feeling like one person with a single continuous stream of experience and is distressed by suggestions of division.

  **Essay Prompt:**
  Using Case R., critique the notion that the unity of consciousness is an all-or-nothing property. Your essay must address: (1) the evidentiary status of R.'s self-report versus the behavioral evidence of disunity; (2) the specific conditions required for a "single stream of experience" to be literally correct given the transmission delay; and (3) whether partial connectivity entails partial unity or merely a unified system with faulty parts. Define what work the concepts of "stream" and "subject" are doing in your analysis.

  ***

  ### MODEL ANSWER

  Case R. forces a rejection of the binary "one mind or two?" framework, suggesting instead that consciousness admits of degrees. To evaluate R., we must distinguish between the *unity of agency* (behavioral coordination) and *phenomenal unity* (the subjective character of experience). R.'s behavioral disagreements indicate a fracture in agency, but her self-report claims phenomenal unity. An A-grade analysis cannot accept this report as a verdict; it must treat it as data to be explained. In split-brain variants, the verbal report is typically generated by the left hemisphere. If the prosthetic bridge allows the left hemisphere to access right-hemisphere data—even delayed—it can construct a narrative of unity that does not reflect simultaneous integration. Thus, R.'s insistence on being "one person" may be a confabulation of the speaking hemisphere rather than proof of a metaphysical singular subject.

  The crux of the matter lies in the temporal delay. For a "single stream of experience" to be literally correct, contents from both hemispheres must be co-conscious within the same specious present. If the prosthetic delay exceeds the window of temporal integration (roughly 100–300ms), the hemispheres are not sharing a *now*. They are sharing a history. In this scenario, R. does not possess a single stream, but rather two streams that are periodically synchronized with a lag. The metaphor of a "stream" implies continuity and simultaneity; if the water from two sources merges only after one has already flowed downstream, they remain distinct currents. Therefore, the delay suggests that R.'s phenomenology is not unified in the standard sense, even if her post-hoc narrative smooths over the gaps.

  This leads to the question of degrees. If unity relies on information integration, and integration is a variable quantity (bandwidth, speed), then unity must be scalar. R. is not fully unified like an intact brain, nor fully divided like a classic commissurotomy patient. She occupies a middle ground. To claim she is "one subject" with "faulty parts" begs the question by assuming the subject is the biological organism rather than the conscious system. If the conscious system is defined by causal integration, and that integration is degraded, the subjecthood is thereby degraded. We should treat unity as a threshold concept: below a certain integration limit, the cost of maintaining the "single subject" heuristic outweighs its explanatory power.

  However, we must be careful not to conflate access unity with phenomenal unity. R. might lack access unity (unable to simultaneously utilize data from both sides for a single task) while retaining a vague phenomenal unity (a global sense of presence). Yet, given the behavioral disagreement, even this is doubtful. The distress R. feels is significant; it suggests a commitment to a self-model that the data contradicts. This highlights that the "self" is often a theoretical construct maintained by the brain to ensure social and operational coherence, rather than a direct perception of metaphysical oneness.

  Ultimately, Case R. demonstrates that "single subject" is a functional label, not a metaphysical atom. For the phrase "single stream" to be literally correct, there must be a high-fidelity, synchronous integration of content. R. fails this test. She possesses a *narrative* unity, constructed by the speaking hemisphere, masking a *functional* and *phenomenal* disunity caused by the prosthetic lag. We should conclude that R. exhibits partial unity. Recognizing this avoids the error of forcing R. into a binary category and acknowledges that consciousness, like the neural architecture supporting it, can be fragmented, delayed, and graded. The work the concept of "subject" does here is not to count souls, but to track the degree of information integration available for global control. In R., that integration is compromised, and so is her status as a unified subject.

  ***

  ### MARKING SCHEME (25 MARKS TOTAL)

  **1. Distinction between Phenomenal and Functional/Agency Unity (5 Marks)**
  *   **Required:** Candidate must explicitly distinguish between the *feeling* of unity (phenomenology) and the *capacity* to act/report coherently (agency/function). They must argue that R.'s behavioral disagreement signals functional disunity even if phenomenology is claimed to be unified.
  *   **A-Grade Move:** Argues that behavioral disagreement undermines the claim of phenomenal unity, or explains how they can come apart.
  *   **Common Error:** Treating behavioral disagreement as *proof* of two minds without addressing the phenomenological claim, or conflating the ability to speak with the totality of experience.

  **2. Critical Treatment of Self-Report (5 Marks)**
  *   **Required:** Candidate must treat R.'s report ("I am one person") as evidence to be explained, not as an incorrigible truth. They should note the likelihood of left-hemisphere interpretation or confabulation.
  *   **A-Grade Move:** Identifies that the report is a output of a specific subsystem (left hemisphere) utilizing delayed data to construct a coherent narrative.
  *   **Common Error:** Accepting the first-person report as the final verdict on the metaphysics of the case ("If she says she's one, she is one").

  **3. Analysis of the "Stream" and Temporal Delay (5 Marks)**
  *   **Required:** Candidate must analyze the implications of the *delay* on the concept of a "stream." They should reference the specious present or temporal integration windows.
  *   **A-Grade Move:** Argues that if integration exceeds the specious present, simultaneity is lost, making a "single stream" literally incorrect.
  *   **Common Error:** Mentioning the delay but failing to explain *why* it disrupts the definition of a "stream" (e.g., treating time as irrelevant to unity).

  **4. Argument for Degrees of Unity (5 Marks)**
  *   **Required:** Candidate must take a defensible position on whether unity is all-or-nothing. They should argue that partial connectivity (low bandwidth/delay) entails partial unity.
  *   **A-Grade Move:** Rejects the binary ontology. Proposes unity as a scalar property dependent on integration thresholds.
  *   **Common Error:** Insisting that R. must be either fully one or fully two, ignoring the prosthetic's intermediate nature.

  **5. Normative/Metaphysical Stance on "Subjecthood" (5 Marks)**
  *   **Required:** Candidate must conclude what work the concept of "subject" is doing. Is it a count of souls, a functional heuristic, or an integration metric?
  *   **A-Grade Move:** Defines "subject" functionally (e.g., "a label for high-fidelity integration") and applies this to R. to justify the "partial unity" verdict.
  *   **Common Error:** Vague hand-waving about the "mystery of the self" without committing to a definition that solves the case.

  **Grade Boundaries:**
  *   **A (20–25):** Hits all 5 points with clear philosophical argumentation. Distinguishes report from reality. Embraces the "degrees" implication.
  *   **B (15–19):** Hits 3–4 points. May accept self-report too readily or fail to fully unpack the temporal delay implication.
  *   **C (10–14):** Hits 2–3 points. Tends to regurgitate standard split-brain findings without applying them to the prosthetic nuance.
  *   **D/F (0–9):** Fails to address the prompt specifics. Treats R. as a standard split-brain case.
