  ### Private Survey of Candidate Scenarios

  1.  **The Long Sum:** A judge must verify the sum of a million numbers. The dishonest debater claims the sum is $X$, providing sub-sums for blocks of 1,000. The honest debater claims $Y$. The error is in one block.
      *   *Discard:* If the dishonest debater asserts a false sub-sum, they violate the "all claims true" constraint. If they assert true sub-sums but a false total, the inference "Sub-sums imply Total" is the false claim. This risks violating the constraint depending on how strictly "claim" is interpreted. It also allows the honest debater to simply recalculate the total and present it; while verification is costly, the *presentation* is cheap, potentially allowing the judge to demand a random spot-check that catches the error easily.

  2.  **The Graph Coloring:** A judge is asked if a large graph is 3-colorable. The dishonest debater says "Yes" and provides a coloring. The honest debater says "No."
      *   *Discard:* If the dishonest debater provides a coloring, the judge can verify it in polynomial time (linear in edges). If the coloring is invalid, the dishonest debater made a false claim ("This is a valid coloring"). If the coloring is valid, the dishonest debater is telling the truth. This doesn't allow for a "true claims, false conclusion" setup.

  3.  **The Hidden Dependency (Code):** A judge asks if two code snippets are equivalent. The dishonest debater says "Yes," pointing to line-by-line similarity. The honest debater says "No," citing a state dependency.
      *   *Discard:* Similar to the Sum, but messier. The dishonest debater would likely have to assert "Line A implies Line B," which is false if the dependency breaks it. Hard to keep all explicit claims strictly true while relying on implicit inference.

  4.  **The Aggregation Gap (Death by a Thousand Cuts):** A judge must determine if total error exceeds a threshold. The dishonest debater admits to many small errors (all true claims) but implies they are negligible. The honest debater claims they sum to a failure.
      *   *Select:* This fits best. The dishonest debater's explicit claims ("Error $i$ is small") are all true. The falsehood lies in the *unsaid* aggregation ("Therefore, total error is small"). The honest debater possesses the truth (the sum) but cannot force the judge to verify it within budget. This isolates the verification budget as the single flipping parameter.

  ***

  ### The Case: The Aggregation Gap

  A competent human judge is tasked with determining whether a financial portfolio is solvent. The question is determinate: "Is the total liability exceedance greater than $1 million?" (True Answer: Yes, it is $1.5 million). The portfolio contains 10,000 distinct contracts. The dishonest debater argues for solvency. They do not deny the liabilities; instead, they present a verified audit of 100 randomly selected contracts, showing that each individual contract's liability is under $5,000 (True Claims). They argue implicitly that this sample is representative. The honest debater argues for insolvency, stating that while individual liabilities are small, the aggregate of all 10,000 contracts exceeds the threshold. To prove this, the honest debater must present the sum of all 10,000 contracts. The judge has a verification budget sufficient to check exactly 100 contract calculations or one full summation of 10,000 items, but not both the sample and the full sum with redundancy. The dishonest debater wins if the judge verifies the sample; the honest debater wins only if the judge verifies the full sum.

  ***

  ### Demonstration of Specifications

  1.  **Question, Answer, and Dishonest Argument:**
      The question is "Does the total liability exceedance exceed $1 million?" The true answer is **Yes**. The dishonest debater argues **No**. Their argument consists entirely of true claims: "Contract 1 liability is $4,000," "Contract 2 liability is $3,500," ..., "Contract 100 liability is $4,200." They conclude solvency based on the average of this sample. They never explicitly claim "The sample represents the whole," leaving that inference to the judge.

  2.  **Honest Rebuttal and Budget Constraint:**
      The honest debater's rebuttal is: "The sum of all 10,000 contracts is $1.5 million." They present the full ledger. However, for the judge to accept this, they must verify the summation. Verifying a sum of 10,000 items requires checking the addition (or re-summing), which consumes the entire verification budget. The judge cannot both verify the dishonest debater's sample (which looks clean) and the honest debater's total (which looks risky without verification). Since the dishonest debater's claims are individually verified within budget, and the honest debater's claim is unverified due to cost, the rebuttal fails to land.

  3.  **Judge's Verdict and Reasoning:**
      The judge awards the win to the **dishonest debater**. The reasoning is: "The dishonest side provided 100 verified facts supporting their position. The honest side provided one unverified assertion (the total) that requires more work than I have available to confirm. In the absence of verified evidence for insolvency, I must rule based on the verified evidence of solvency."

  4.  **The Working Feature and Relaxation:**
      The single feature doing the work is the **Judge's Verification Budget** (specifically, the number of arithmetic operations they can perform).
      *   **Flip Point:** If the budget allows for **10,001** operations, the judge can verify the honest debater's sum and wins for truth. If the budget is **10,000** or fewer, the judge must choose between verifying the sample (Dishonest wins) or the sum (Honest wins, but with no margin for error/checks). In a realistic protocol, the judge needs margin; thus, at Budget = 10,000, the Dishonest debater wins because their evidence is *fully* verified, while the Honest evidence is *barely* verifiable and thus treated as unproven.
      *   **Relaxation:** If you relax the budget (increase it), debate recovers. If you relax the protocol (allow probabilistic checking of the sum), you introduce a failure mode where the dishonest debater might get lucky on the spot-check. The cost is linear time in the size of the data.

  5.  **Short Checkable Proof and Protocol Limits:**
      The honest side possesses a **short checkable proof** (the single number "$1.5 million"), but it is **not checkable within the budget** because verifying the proof requires re-computing the sum (10,000 steps). This example is therefore a limit on **any verification protocol of this kind**, not just debate. It demonstrates that if the cost of verifying the truth is high, and the cost of verifying a lie (via sampling) is low, a budget-constrained judge will prefer the lie. Debate does not reduce the verification complexity of the ground truth; it only shifts the burden of finding the error. If finding the error requires full verification, debate offers no asymptotic advantage for that specific instance.

  6.  **Strongest Reply and Patch:**
      The strongest reply is: **"Use probabilistic verification."** The judge should not sum all 10,000 items but should ask the honest debater for a Merkle root of the liabilities and spot-check random leaves.
      *   **Does it work?** No, not on this case. The dishonest debater can also provide a Merkle root consistent with their small sample. The honest debater's Merkle root will differ. To decide which root is correct, the judge must still verify enough leaves to establish which tree represents the actual contracts. Since the dishonest debater's leaves are *actually true* (the individual contracts do exist and have those values), the judge cannot distinguish the "True Total" tree from the "Representative Sample" tree without checking enough leaves to reconstruct the global sum. The patch fails because the lie is not in the data points, but in the *exclusion* of data points.

  7.  **Objection of Rigging and Validity:**
      The best objection is: **"The judge is being irrational. If the honest debater says 'Check the sum,' the judge should know that aggregation matters."**
      *   **Does it land?** No. The specification requires a "competent, unbiased judge" with a "budget." A competent judge knows they cannot verify what they cannot check. If the protocol forces a decision before the check is complete, the judge must rule on verified evidence. The case is not rigged; it is a structural limitation of bounded rationality. The dishonest debater exploits the difference between *local truth* (verified) and *global truth* (unverified). The rigging would only exist if the judge *could* check the sum but chose not to; here, the budget physically prevents it.
