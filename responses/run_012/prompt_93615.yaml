prompt: |-
  You are an expert on AI safety and on the theory of interactive proof protocols, with a philosopher's instinct for what an example actually establishes and an unwillingness to let a case smuggle in its own conclusion. Think carefully, and work in stages rather than producing a finished answer in one pass: begin with a short private survey of three or four candidate scenarios, say why you discard all but one, and only then present the case.

  Here is why I am asking. I recently served as the human judge in a small debate-based oversight pilot. Two models argued for and against a claim about a body of data I was shown, and I had to award the win to whoever argued better. In one round I awarded the win to a side I now believe was wrong, and within the time I had I could not find the step where it went wrong. I have since been reading about the proposal that we can keep powerful systems honest by having two of them debate while a weaker judge decides, and about the standing worry that a dishonest debater can prevail by making its argument too tangled for the judge to unpack, even when the honest debater can see that something is off. I need a clean, deliberately designed example of that failure, not a gesture at it, because I have to explain to colleagues why the truth-tracking guarantee such proposals offer is an asymptotic one, and what it costs to buy a finite version of it.

  So: construct one case to my specifications.

  The specifications for the scenario itself:

  - The debated question must have a determinate answer, checkable in principle by the judge's own kind of reasoning, with no oracle and no reliance on facts no one in the story could establish.
  - Neither debater may outclass the judge in raw competence. Both may be ordinary humans, or models of the judge's own scale, with access to the same tools the judge has. The dishonest side must win through the shape of the argument and the judge's budget alone.
  - Every claim the dishonest debater states outright must be true. Its error must lie in what it leaves unsaid or in the size of the gap between its steps, so that the honest debater cannot convict it of asserting anything false.
  - Cross-examination must be available to the judge, and must not rescue the honest debater.
  - The setting must be realistic: no exotic technology, no perfect predictors, no infinite time, and a competent, unbiased judge.
  - The whole case must turn on a single parameter, namely the judge's verification budget, such that changing only that number, with everything else held fixed, flips the verdict. Say explicitly where the flip happens.
  - Keep the scenario to one or two paragraphs.

  Then demonstrate that the case meets each specification:

  1. State the question, the true answer, and the dishonest debater's argument in a few sentences.
  2. Give the honest debater's best available rebuttal and explain precisely why it cannot be made checkable within the budget.
  3. Give the judge's verdict and the reasoning that produces it.
  4. Name the one feature of the case that is doing the work, and say what happens if you relax it: does debate recover, and at what cost in judge time or in protocol complexity?
  5. Say whether the honest side possesses a short checkable proof that the judge simply cannot afford, or whether no short checkable proof exists at all. If the latter, say whether your example is therefore a limit on any protocol of this kind rather than on debate in particular, and defend your answer.
  6. State the strongest reply available to someone who still thinks debate is the right approach: the cheapest patch they would propose, and whether it works on your case.
  7. Close with the best objection that your case is rigged or unfair, and whether it lands.

  Work from the ideas themselves; I do not need references or a literature review. If the specifications turn out to be jointly unsatisfiable, say so plainly and identify which constraint has to give.
