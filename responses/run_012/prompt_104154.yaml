      *   *Correction on Scope:* A semester is enough for a strong paper, not a dissertation. But if they try to solve the "Real Patterns" metaphysical grounding, it becomes a dissertation. I need to advise them to bracket the metaphysics and focus on the epistemic/pragmatic dependency.
