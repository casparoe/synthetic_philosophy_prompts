      *   *Cost:* You lose the rhetorical punch of "identifiable vs. statistical," which is a common regulatory heuristic. You have to admit that withholding a drug is an "intervention" with a burden of proof.

  7.  **Ranking the Tensions:**

      1.  **(2) vs. (6):** Meta-ethical clash. Rationality vs. Bias.
