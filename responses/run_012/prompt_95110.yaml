prompt: |-
  I mod a Discord server — about 9k people, started as a hobby thing for woodworking but it turned into a general hangout with a #politics channel that we gave up trying to kill. The owner, Dana, is the one who actually rules on reports. I've been keeping a running list in my notes of what she takes down and what she leaves up, cause at this point I'm pretty sure I can call her shots. I write software for a living so I'm used to rules that actually resolve cases, and ours don't, which is probably why I care.

  Taken down, poster banned:
  - Someone posted that immigrants from a certain region shouldn't be let in and were replacing people. Gone in like five minutes.
  - Someone posted a long, polite, link-heavy thing arguing that a racial minority is just less intelligent on average. No slurs, no threats, it was an argument. She took it down and said we're not a debating club for that.
  - Someone dug into a member's ethnicity in a thread and started tagging their friends. Gone.

  Left up, even after reports:
  - A rant calling a sitting senator a crook and a traitor. She said he's a public figure, he can take it.
  - A post arguing we should tax billionaires at 90% and ban private jets. Left up.
  - A post calling the mod team a bunch of little tyrants and linking a rival server. Left up, she even replied in the thread.
  - Someone saying our rules are useless because 'no hate speech' doesn't tell you what hate speech is. Left up, lol.

  Our written rules are basically 'be cool, no hate speech, no harassment,' which as that last guy pointed out is not super helpful.

  New one: a member wrote a legitimately careful, well-organized post — no slurs, no insults, no calls to violence, doesn't name any individual — arguing that the country's majority religion is a threat to democracy and that its members shouldn't be allowed to vote or hold public office. It got mass-reported. We've got a few regulars in that group and they're upset.

  Will Dana take it down? What I actually want out of this: what rule do you think she's been running all along, what other rules fit her entire track record just as well, what does each of those predict here, which one do you think it is and why, and which of her past calls is this closest to? And what's the case I should watch for down the road that would definately settle it? Also, does it matter that this is our server and not the government — is the paradox of tolerance thing even the right lens, or is she doing something simpler? And if she leaves it up, is she then stuck leaving up the mirror version aimed at a group with no power at all? That's the part that nags at me.
