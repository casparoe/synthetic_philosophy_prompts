answer: |-
  # Teaching Plan: The Gibbard–Satterthwaite Theorem
  **Duration:** 50 minutes
  **Audience:** Mathematically literate colleagues (Game Theory basics, aware of Arrow, no Social Choice background).
  **Goal:** Move from intuitive frustration with strategic voting to a precise understanding of the theorem's conditions, implications, and escape routes.

  ## 1. The Carrying Example (Preparation)
  You will build the entire session around a single, static scenario. Do not change the actors or the stakes mid-session, or you will lose the thread on domain restrictions.

  **The Scenario:** A three-person hiring committee (Voters 1, 2, 3) must select exactly one candidate from three applicants (Alternatives $A, B, C$).
  **The Data:** Strict ordinal preferences. No ties. No cardinal utilities initially.
  **The Rule:** A Social Choice Function (SCF) that maps profiles of preferences to a single winner.

  **What this example must include:**
  *   **Minimal numbers:** Exactly 3 voters and 3 alternatives. This is the mathematical minimum for the theorem to hold. Using more suggests the problem scales with complexity; it does not.
  *   **A manipulation sequence:** You must be able to show a specific profile where Voter 1, by misrepresenting their ranking, changes the outcome from their 2nd choice to their 1st choice.
  *   **A dictatorial mapping:** You must be able to describe a rule where the outcome always matches Voter 2's top choice, regardless of others.

  **What this example must avoid:**
  *   **Indifference:** Assume strict preferences ($A \succ B \succ C$). Indifference requires tie-breaking rules that complicate the definition of strategy-proofness.
  *   **Cardinal payoffs:** Do not assign values (e.g., "A is worth 10 points") until the section on transfers.
  *   **Status quo bias:** Do not imply one option is the 'current' holder. All three are mutually exclusive new priorities.

  ---

  ## 2. Sequence of Ideas and Dependencies

  ### Phase 1: Definitions and Distinctions (Minutes 0–10)
  **Goal:** Distinguish the object of study from Arrow's Theorem.

  1.  **Social Welfare Function (SWF) vs. Social Choice Function (SCF):**
      *   *Concept:* Arrow aggregates preferences into a collective *ranking* (SWF). Gibbard–Satterthwaite aggregates preferences into a single *winner* (SCF).
      *   *Dependency:* You cannot define strategy-proofness until you define the output. If the output is a ranking, 'manipulation' is ambiguous. If the output is a winner, manipulation is clear (getting a better winner).
      *   *Action:* Draw the mapping. Inputs: List of orderings. Output: One alternative.
      *   *Misconception Check (Arrow Confusion):* At minute 5, explicitly state: "Arrow asks 'How do we rank society's options?' Gibbard–Satterthwaite asks 'Which single option do we pick?' This is why the impossibility results look similar but operate differently."

  2.  **Ordinal vs. Cardinal Preferences:**
      *   *Concept:* The theorem assumes we only know the ranking ($A \succ B$), not the intensity ($A$ is much better than $B$).
      *   *Dependency:* Strategy-proofness is defined over ordinal rankings. If we had cardinal utility, we could discuss transfers later.
      *   *Action:* Write preferences as ordered lists, not utility functions.

  ### Phase 2: Strategy-Proofness and Manipulation (Minutes 10–20)
  **Goal:** Define the core property using the carrying example.

  1.  **Defining Strategy-Proofness:**
      *   *Concept:* A mechanism is strategy-proof if, for every voter, reporting true preferences is a dominant strategy. More precisely: no voter can ever obtain a strictly preferred outcome by lying, regardless of what others do.
      *   *Dependency:* Requires the SCF definition.
      *   *Action:* Use the carrying example. Show Profile $P$. Show that under Rule $R$, truth-telling yields $B$, but lying yields $A$ (where $A \succ B$ for that voter). Thus, $R$ is manipulable.
      *   *Misconception Check (Honesty as Dominant Strategy):* At minute 15, clarify: "Strategy-proofness does not mean people *will* be honest. It means they *cannot gain* by being dishonest. In a manipulable system, honesty is not a dominant strategy; lying might be."

  2.  **The 'Unrestricted Domain' Condition:**
      *   *Concept:* The theorem holds for *any* possible combination of ordinal preferences.
      *   *Dependency:* Required to set up the impossibility. If we restrict the domain, the theorem may not apply.
      *   *Action:* State that Voters 1, 2, and 3 could logically hold any of the 6 possible orderings of $A, B, C$.

  ### Phase 3: The Theorem and Dictatorship (Minutes 20–30)
  **Goal:** State the result and demystify 'dictatorship'.

  1.  **The Statement:**
      *   *Concept:* For any SCF with $\ge 3$ alternatives and unrestricted domain, if it is strategy-proof and onto (every alternative can win), it must be dictatorial.
      *   *Dependency:* Relies on all previous definitions.
      *   *Action:* Write the implication: Strategy-Proof + Onto + $\ge 3$ Alts $\rightarrow$ Dictatorship.

  2.  **Defining Dictatorship:**
      *   *Concept:* A 'dictator' is a voter whose top-ranked alternative is always selected, regardless of others' preferences.
      *   *Dependency:* Follows the theorem statement.
      *   *Misconception Check (The Tyrant):* At minute 25, intervene: "In social choice, 'dictator' is a structural label, not a political one. It does not mean the person has power *ex ante* (before the vote). It means the mathematical function *ex post* always mirrors their input. A random lottery to select the dictator is still a dictatorial function in this specific technical sense."

  ### Phase 4: Escape Routes and Nuance (Minutes 30–45)
  **Goal:** Show where the theorem bites and where it doesn't (the "in the weeds" section).

  1.  **Domain Restrictions (Single-Peakedness):**
      *   *Concept:* If preferences are single-peaked (e.g., left-to-right political spectrum), the Median Voter Theorem applies.
      *   *Dependency:* Relies on 'Unrestricted Domain' from Phase 2.
      *   *Action:* Explain that your committee might have single-peaked preferences (e.g., budget size). If so, GS does not apply.
      *   *Clarification:* "Single-peakedness is not a counterexample to GS; it is a restriction of the domain conditions required for GS."

  2.  **Randomised Mechanisms (Gibbard 1978):**
      *   *Concept:* If the output is a probability distribution (a lottery), we can achieve strategy-proofness without dictatorship (e.g., Random Dictator).
      *   *Dependency:* Distinguish from the deterministic SCF defined in Phase 1.
      *   *Precision:* "Here, strategy-proofness means truth-telling maximises *expected* utility. This requires assuming voters have cardinal utilities over the loturies, shifting us slightly from the pure ordinal GS framework."

  3.  **Transfers and Quasilinear Utility:**
      *   *Concept:* If we allow side payments (money), preferences become quasilinear. The VCG mechanism is strategy-proof.
      *   *Dependency:* Relies on the Ordinal vs. Cardinal distinction from Phase 1.
      *   *Action:* "GS assumes 'pure public goods' where I cannot pay you to vote for $A$. If we introduce transfers, we leave the GS world and enter Mechanism Design. The impossibility vanishes, but we require comparable cardinal utility."

  4.  **Worst-Case vs. Practical Manipulability:**
      *   *Concept:* GS proves manipulation is *possible* (exists some profile), not that it is *easy* or *likely*.
      *   *Dependency:* Follows the definition of manipulation.
      *   *Action:* "In practice, manipulating may require knowing others' votes (informational burden) or solving NP-hard problems. GS is a worst-case guarantee, not a frequency prediction."

  ### Phase 5: Normative Weight and Conclusion (Minutes 45–50)
  **Goal:** Separate settled math from contested interpretation.

  1.  **Contested Interpretations:**
      *   *Settled:* The mathematical result is robust under the stated axioms.
      *   *Contested:* How much this should deter us from voting. Some argue 'dictatorship' is rare in practice; others argue 'manipulability' undermines legitimacy.
      *   *Action:* "Do not present the theorem as 'voting is useless'. Present it as 'perfect fairness and honesty are incompatible with flexibility'."

  2.  **What to Leave Out:**
      *   **The Proof:** Do not sketch the pivotal voter argument. It consumes too much time and adds little to the conceptual understanding for this audience.
      *   **Infinite Sets:** Do not discuss continua of agents or alternatives.
      *   **Topological Generalisations:** Avoid mentioning connectivity or continuity conditions.
      *   **Implementation Theory:** Do not dive into Nash implementation vs. dominant strategy implementation.

  ---

  ## 3. Mapping Misconceptions to Intervention Points

  | Misconception | Intervention Point | Action to Take |
  | :--- | :--- | :--- |
  | **"GS is just Arrow's Theorem"** | **Phase 1 (Minute 5)** | Draw the output box. Arrow = Ranking (SWF); GS = Winner (SCF). Emphasise that GS does not require Independence of Irrelevant Alternatives (IIA) in the same way, but derives a similar impossibility from Strategy-Proofness. |
  | **"Strategy-proofness means people are honest"** | **Phase 2 (Minute 15)** | Use the carrying example to show a voter *gaining* from a lie. Define it as "Immunity to manipulation," not "Guarantee of virtue." |
  | **"Dictatorship means a tyrant"** | **Phase 3 (Minute 25)** | Distinguish *ex ante* fairness from *ex post* structure. Explain that a rule can be symmetric (fair) before votes are cast but structurally dictatorial once preferences are revealed. |
  | **"Single-peakedness disproves GS"** | **Phase 4 (Minute 35)** | Explicitly label Single-Peakedness as a **Domain Restriction**. Remind them GS assumes **Unrestricted Domain**. It is an escape clause, not a refutation. |
  | **"The theorem applies to all voting"** | **Phase 4 (Minute 40)** | Highlight the **Deterministic** constraint. Mention that Random Dictatorships are strategy-proof in expectation, showing the theorem's boundary. |

  ---

  ## 4. Closing Question

  Do not ask them to state the theorem. Ask them to identify the boundary condition.

  **"If our committee decides to allow members to trade favours or budget allocations to secure support for their preferred research priority, does the Gibbard–Satterthwaite theorem still forbid us from designing a strategy-proof procedure? Why or why not?"**

  **Expected Answer:** No, the theorem no longer applies directly. Allowing transfers moves us from ordinal preferences over public outcomes to quasilinear utility with side payments (Mechanism Design), where strategy-proof mechanisms (like VCG) exist. The theorem bites only when preferences are ordinal and transfers are impossible.

  ---

  ## 5. Instructor Notes on Delivery

  *   **Pacing:** You have 50 minutes. If you run long on the carrying example, cut the Randomisation section, not the Domain Restriction section. Domain restriction is more relevant to their committee work.
  *   **Tone:** Maintain a distinction between the *mathematical inevitability* (settled) and the *political desirability* (contested). Do not let the session become a complaint about colleagues' behaviour; keep it on the structural constraints.
  *   **Visuals:** Use the board for the preference profiles. Keep the carrying example visible throughout. Do not erase the 3 voters/3 candidates setup until the end.
  *   **British English:** Ensure you use "programme," "centre," "modelling," and "prioritise" (with an 's') in any written materials or board work.
