answer: |-
  "The budget is fixed, Elena. We cannot conjure more funds," Marcus said, tapping the spreadsheet. "So every dollar we assign to the critically ill is a dollar denied to the moderately ill. That forces a trade-off. And that is where your view worries me. You claim to reject egalitarianism, yet you insist we prioritize the worse off. Do you see the instability?"

  "I see the constraint, Marcus, but not the instability," Elena replied, leaning forward. "You're invoking the leveling-down objection. You're imagining a scenario where we make the healthy sick just to achieve equality, and you think my view licenses that."

  "I think it implies it," Marcus said. "The standard case is simple: Imagine a world where everyone is blind. Then imagine a world where half are blind and half see. The egalitarian says the first world is better in one respect—equality—even though no one is better off and some are worse off. You say you reject this. You say your view is monotonic: a change is only good if someone is benefited. But if you weight benefits to the worse off heavily enough, don't you effectively endorse leveling down in practice?"

  "No, because the moral value lies in the benefit, not the gap," Elena insisted. "I don't care that the blind are equal to the sighted. I care that restoring sight to the blind matters more than enhancing the vision of the sighted. My view is welfarist. I never say making the sighted blind is good. I say giving sight to the blind is *more* important. There is a moral difference between destroying value and prioritizing where to create it."

  "Let's test that distinction with our patients," Marcus said, pulling a file closer. "Patient A has a health level of 10 units. Patient B has a health level of 50. We have enough budget for one intervention. Option One gives Patient A 20 units. Option Two gives Patient B 25 units. A utilitarian takes Option Two; total health is higher. You take Option One. Why?"

  "Because Patient A is so much worse off," Elena said. "The moral weight of those 20 units for A outweighs the 25 units for B. The benefit matters more at the bottom of the scale."

  "Okay," Marcus said. "Now, suppose the budget isn't a windfall. Suppose it's reallocated. To give Patient A those 20 units, we must divert resources that would have given Patient B 40 units. Net total health drops. We are making B worse off relative to the potential baseline to help A. If your priority weighting is strong enough to choose A here, you are sacrificing total welfare for the sake of the worse off. How is that not leveling down?"

  "Because B is not being harmed; B is merely not being helped as much," Elena corrected. "We are not taking away B's existing 50 units. We are deciding where to apply new value. My view remains monotonic. Everyone ends up better off or equal to their starting point. I never advocate reducing B's 50 to match A's 10."

  "But the opportunity cost is real," Marcus pressed. "If you choose A, the total health in the system is lower than it could have been. You have accepted a world with less total good because the distribution favors the worse off. If your weighting function is steep enough to override a loss of 15 net units, you are functionally identical to an egalitarian who values equality over total welfare. You claim to escape the leveling-down objection, but only by defining 'harm' narrowly. In any realistic budget scenario, prioritizing the worse off *requires* leveling down the total sum."

  "That assumes the utilitarian sum is the only metric of 'total good'," Elena said. "I deny that. The moral good is the weighted sum. If the weighted sum is higher for A, then choosing A maximizes the moral good. I am not sacrificing value; I am recognizing that value is not linear."

  "Then we arrive at the crux," Marcus said. "Where is the curve? If your weighting is flat, you are a utilitarian. If it is steep enough to override significant losses to the better off, you are an egalitarian in disguise. You claim to occupy a middle ground, but I suspect you are an unstable compromise. You inherit the utilitarian's commitment to maximizing value, but you redefine value in a way that inherits the egalitarian's willingness to sacrifice total output. You get the costs of both without the coherence of either."

  "I get the benefits of both," Elena countered. "We intuitively care about total health, but we care more about rescue. That isn't incoherent; it's nuanced."

  "Nuance isn't a shield against contradiction," Marcus said. "Let's make it concrete. Patient A is at 5 units. Patient B is at 45. We can give A 10 units or B 50 units. The utilitarian saves B. The egalitarian might save A to close the gap. You say you save A because the weight is higher. But suppose giving A those 10 units costs B 60 units of potential gain. Do you still save A?"

  "If the priority weight is sufficiently high, yes," Elena said.

  "Then you are willing to sacrifice 60 units of health to give 10 units to the worse off," Marcus said. "That is a steep price. And if you admit that, you admit that your view licenses massive inefficiencies for the sake of distribution. But if you say 'no, that's too steep,' then you admit there is a threshold where total welfare overrides priority. What determines that threshold? If it's not equality, and not total welfare, what is it?"

  "It is the moral urgency of need," Elena said. "There is no fixed threshold. It depends on how badly off A is."

  "But that makes your view arbitrary," Marcus argued. "If A is at 5 units, you sacrifice 60 for B. If A is at 20 units, maybe you only sacrifice 10. You are trying to split the difference between utilitarianism and egalitarianism. The leveling-down objection shows that any view that values distribution must accept some loss of total welfare to be distinct from utilitarianism. If you accept that loss, you are vulnerable to the charge that you value equality over people's well-being. You say you don't value equality, but your actions trade well-being for the sake of the worse off's position. That is exactly what the leveling-down objection condemns."

  "I trade well-being for the sake of the moral weight of the benefit," Elena insisted. "The position matters only because it indicates the weight."

  "But if the weight is derived solely from the position, then you are valuing the position," Marcus said. "You are caught. Either your weighting is so steep that you effectively level down total welfare to help the worst off, which makes you an egalitarian despite your denials, or it is so shallow that you collapse into utilitarianism. The leveling-down objection doesn't just attack egalitarianism; it attacks any view that tries to have it both ways. It shows that prioritarianism is just egalitarianism trying to hide from the implication of its own commitments."

  "That's not what it shows," Elena said, her voice tightening. "It shows that you are unwilling to accept that a benefit to a suffering person is objectively more valuable than a benefit to a comfortable one. You think value is atomic. I think it is contextual."

  "And I think context cannot override arithmetic without a cost," Marcus replied. "So here is the dilemma I leave you with. You must define the weighting function. If you define it precisely, you will either find it mandates sacrifices of total health that are intuitively monstrous—effectively leveling down—or you will find it mandates sacrifices so small that it offers no guidance distinct from utilitarianism. You claim to escape the leveling-down objection by denying you value equality. But if your view prescribes the same actions as egalitarianism in all hard cases, your escape is merely verbal. Which is it? Are you willing to sacrifice the 60 units for the 10, or not? If yes, you level down. If no, you are a utilitarian."

  Elena looked at the budget sheet, then back at Marcus. "I am willing to sacrifice the 60 units," she said quietly. "Because the 10 units for A are worth more than the 60 for B."

  "Then you admit you value the distribution over the total," Marcus said. "And if you value the distribution over the total, you have no ground to stand on when I ask why making B worse off isn't also good, provided it helps A relatively. You've accepted the premise of the leveling-down objection; you've just changed the vocabulary."

  "I have not," Elena said, but the certainty had faded from her tone. She looked at the numbers for Patient A, then Patient B, knowing that whichever column she chose, Marcus would argue she had validated his charge that her middle path was an illusion.
