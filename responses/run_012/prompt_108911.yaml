  The mechanism hinges on symmetric uncertainty: every agent conditions their choice on the probability that *no one else* acts, failing to realize that every other agent is running the exact same conditional probability. The humor comes from the collision of identical altruistic calculations producing a catastrophic sum.

  Five AI labs find a model that forces safety regs if released. Good if one does it, catastrophic if all five do. They can't talk. So each thinks, "If I don't release it, maybe no one does, and safety loses. I have to act." All five hit publish. Now we're all doomed. They all wanted to save the world, but nobody wanted to save it *this* hard. That's the Unilateralist's Curse: The only disaster caused entirely by everyone trying to be the responsible one.
