prompt: |-
  Hey, I teach a final-year module that's half history, half philosophy of history, and I'm writing the exam. The last essay is the one I actually care about: it's on the theme we've run all term, when does a legend become history, using Troy, Arthur and the Exodus as the three running cases. The problem is that every question I've tried lets them just recite the standard fact-sheets ("no Egyptian evidence for the Exodus", "there's a burnt layer at Hisarlik", "Geoffrey of Monmouth mostly made Arthur up") and then stop. I want a question that makes them do conceptual work instead. So I'd like you to act as an external examiner who knows this material cold — archaeology, the texts, and the methodology debates — and write me the question plus everything I'd need to mark it. Dont worry about citations or a reading list, it's a closed-book exam, no books allowed.

  Here's the angle I've been pushing at them and I want the question to test whether they've actually absorbed it. I keep telling them that when someone asks "did the Trojan War really happen", they're usually asking one of three quite different things and sliding between them without noticing: (i) the event question — did the things the story narrates actually occur; (ii) the descent question — is there a causal chain that carries the content of the story back to some real event, as opposed to the story being invented later and read backwards onto the past; and (iii) the datum question — what does the mere fact that people told this story tell us about the people who told it. My provocation, which I want the question to force them to either defend or knock down, is that the evidence can really only bear on (ii), that (i) mostly can't be settled either way, and that most of the shouting in this area is people arguing about (i) while waving evidence that only speaks to (ii) — or, going the other way, minimalists quietly swapping (iii) in for (i) and presenting it as a finding about what happened. And then the sting I want them to face: the three cases look like they should be graded very differently, but I'm not sure the evidence actually grades them differently. Troy has its hints (the Hittite material some scholars match to a place and a king they read as Wilusa and Alaksandu, plus a destruction layer); the Exodus has the Merneptah reference to Israel and not much else Egyptian; Arthur has Nennius, then Geoffrey, and effectively nothing behind either of them. Yet we cheerfully call one of these historical, one contested, and one literary. Is that grading earned by the evidence, or is it cultural, and what would have to be true for the grading to be earned?

  So please write me (a) the essay question itself, phrased so it can't be answered by reciting the three fact-sheets, (b) a model answer of around 700–800 words that actually takes a position on my provocation and on whether the three-way grading is earned, and (c) a marking scheme out of 20 that names the specific moves an A answer has to make and the specific mistakes that should cost marks — including at least one mistake that a very well-read student is especially likely to make. Think it through carefully, and start by brainstorming the ways a strong student could push back on my three-question split before you commit to the model answer.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Final-year module (History + Philosophy of History).
      *   **Theme:** "When does a legend become history?" (Cases: Troy, Arthur, Exodus).
      *   **Instructor's Core Argument/Provocation:**
          *   Distinguish three questions: (i) Event (did it happen?), (ii) Descent (causal chain from event to story?), (iii) Datum (what does the story tell us about the tellers?).
          *   Claim: Evidence mostly bears on (ii). (i) is often unsolvable. Debates confuse (i) and (ii), or swap (iii) for (i).
          *   Claim: The differential grading of the cases (Troy = History, Exodus = Contested, Arthur = Myth) might be cultural rather than evidential.
      *   **Task:** Act as an External Examiner. Produce:
          *   (a) The Essay Question (must prevent fact-sheet recitation).
          *   (b) A Model Answer (700-800 words, taking a position).
          *   (c) A Marking Scheme (out of 20, specific moves for A, specific penalties, including a "well-read student trap").
      *   **Constraint:** Closed book. No citations needed in the output.
      *   **Instruction:** Start by brainstorming pushback on the three-question split before committing to the model answer.

  2.  **Brainstorming Pushback on the Instructor's Framework:**
      *   *The Split:* Is the distinction between (i) Event and (ii) Descent actually stable? If I prove a causal chain (ii), haven't I largely proven the event (i)? If the story says "King X burned City Y" and archaeology shows "City Y burned by King X," isn't (ii) collapsing into (i)?
      *   *The Evidence:* Is it true evidence *only* bears on (ii)? Radiocarbon dating a destruction layer speaks to *when* something burned, which addresses (i) directly (a war/destruction happened), even if the *agents* are unclear.
      *   *The Grading:* Is the Troy/Exodus/Arthur hierarchy really just cultural? Or does the *density* of the causal chain (ii) differ significantly enough to justify the labels? Troy has Hittite texts + Archaeology. Exodus has Merneptah Stele + Archaeology of highlands (but no Egypt match). Arthur has... late texts. Maybe the grading *is* evidential, just probabilistic.
      *   *The "Datum" Swap:* Do minimalists really swap (iii) for (i)? Or do they argue that because (i) is unknowable, (iii) is the only *historically useful* question? That's a methodological shift, not a sleight of hand.
      *   *Cultural Bias:* The "Troy = History" label is actually quite recent (Schliemann era). Before that, it was myth. So the status is fluid, supporting the instructor's cultural argument.

  3.  **Drafting the Question (a):**
      *   *Goal:* Force engagement with the (i)/(ii)/(iii) distinction and the comparative status of the three cases.
      *   *Avoid:* "Discuss the evidence for Troy/Arthur/Exodus." (Invites fact-sheets).
      *   *Focus:* Methodology and classification.
      *   *Draft:* "It is often argued that questions about the historicity of legends conflate whether an event occurred, whether the story descends from an event, and what the story reveals about its tellers. Critically evaluate this distinction using Troy, Arthur, and the Exodus. Does the evidence support treating these three cases as fundamentally different categories of 'history,' or is their classification culturally determined?"
      *   *Refinement:* Make it punchier. Force them to address the "grading" issue directly.
      *   *Final Polish:* "Historians often distinguish between asking whether a legendary event occurred, whether the story causally descends from an event, and what the story reveals about the society that told it. Critically assess the utility of this distinction. Does the available evidence justify the conventional grading of Troy as 'history,' the Exodus as 'contested,' and Arthur as 'myth,' or are these classifications driven by cultural expectation rather than methodological rigour?"

  4.  **Drafting the Model Answer (b):**
      *   *Word Count:* 700-800 words.
      *   *Stance:* Needs to take a position on the provocation. Let's argue a nuanced "Yes, the distinction is useful, but the grading is partially cultural/uneven." Or perhaps challenge the "Evidence only bears on (ii)" claim. Let's go with a strong critical engagement: The distinction is vital, but the instructor is too harsh on (i), and the grading *is* evidential but probabilistic, not binary.
      *   *Structure:*
          1.  Intro: Acknowledge the tripartite distinction. State thesis (Distinction is heuristic gold, but the claim that evidence *only* touches (ii) is too skeptical; the grading reflects probability of (ii), not just culture).
          2.  Body 1: Analyze the (i)/(ii)/(iii) split. Show how conflating them causes errors (e.g., finding a destruction layer doesn't prove Agamemnon).
          3.  Body 2: Apply to cases. Troy (Strong (ii), weak (i) specifics). Exodus (Weak (ii), strong (iii)). Arthur (Very weak (ii), strong (iii)).
          4.  Body 3: Address the "Cultural Grading" provocation. Is Troy different? Yes, because of the Hittite correlation. But acknowledge the cultural desire for origins plays a role.
          5.  Conclusion: Summarize. The distinction saves us from category errors. The grading is earned by the *density* of the causal chain, not just culture.
      *   *Tone:* Academic, critical, precise.
      *   *Check:* Ensure it doesn't just list facts. It must use the facts to make methodological points.

  5.  **Drafting the Marking Scheme (c):**
      *   *Total:* 20 marks.
      *   *Criteria:* Conceptual grasp, Application to cases, Critical evaluation of the provocation.
      *   *A-Grade Moves:* Explicitly using the (i)/(ii)/(iii) framework. Not treating the cases as isolated fact-sheets. Challenging the instructor's skepticism about (i).
      *   *The "Well-Read Student Trap":* This is crucial. A student who knows *too much* archaeology might get bogged down in debating the specific date of the Hittite treaties or the specific stratum of Hisarlik, thereby missing the philosophical point. Or, they might cite Finkelstein vs. Mazar on Exodus in too much detail, treating it as a factual dispute rather than a methodological one. Let's define the trap as: "Over-specifying archaeological data to solve (i) without addressing the epistemological gap."
      *   *Penalties:* Reciting facts without methodological linkage. Ignoring one of the three cases. Accepting the instructor's provocation uncritically (needs evaluation).

  6.  **Review and Refine:**
      *   *Check Word Count:* The model answer needs to be tight.
      *   *Check Tone:* Ensure the External Examiner persona is authoritative but helpful.
      *   *Check Constraints:* Did I start with the brainstorming? Yes.
      *   *Check the "Trap":* Make sure the marking scheme clearly identifies the trap of "Fact-Dumping as Analysis."

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just agree with the instructor. The prompt asks the student to "defend or knock down" the provocation. The model answer should demonstrate a high-level critique. I will argue that while the distinction is useful, the claim that evidence *cannot* bear on (i) is too strong. Archaeology *does* constrain (i).

      *(Self-Correction on Marking Scheme)*: Ensure the distinction between (i) and (ii) is the core grading metric. If a student conflates them, they cap at a B.

  7.  **Final Polish:** Check against the prompt's specific request for "everything I'd need to mark it." This implies clear grade boundaries.

      *Let's write.*
answer: |-
  ### Brainstorming Pushback on the Framework

  Before committing to the model answer, I need to identify where a sharp student might challenge your tripartite distinction. This ensures the model answer demonstrates the critical depth you're looking for.

  1.  **The Interdependence of (i) and (ii):** You argue evidence mostly bears on (ii) (descent). A strong pushback is that establishing (ii) often *is* how we establish (i). If we prove a causal chain of oral tradition preserving specific names and places (ii), the probability of the event (i) shifts from "unknown" to "probable." They aren't hermetically sealed.
  2.  **Archaeology and (i):** You suggest (i) can't be settled. But if archaeology shows a city *didn't* exist at the relevant time, that settles (i) negatively. Evidence *can* bear on (i), just rarely positively.
  3.  **The "Cultural Grading" Claim:** Is the Troy/Arthur split really cultural? Or is it probabilistic? Troy has external corroboration (Hittite texts); Arthur does not. That's an evidential difference, not just a cultural one. A student might argue you're underestimating the weight of the Hittite correspondence.
  4.  **The "Datum" Swap:** You accuse minimalists of swapping (iii) for (i). A student could argue this isn't a swap but a redefinition of "history." If (i) is unknowable, then (iii) *becomes* the only valid historical inquiry. That's a philosophical stance, not a sleight of hand.

  ***

  ### (a) The Essay Question

  **Question 12**
  Historians often distinguish between asking whether a legendary event occurred (the Event), whether the story causally descends from an event (the Descent), and what the story reveals about the society that told it (the Datum). Critically assess the utility of this distinction. Does the available evidence justify the conventional grading of Troy as 'history,' the Exodus as 'contested,' and Arthur as 'myth,' or are these classifications driven by cultural expectation rather than methodological rigour?

  ***

  ### (b) Model Answer 
  **Candidate Number: 000**

  The tripartite distinction between Event, Descent, and Datum offers a necessary corrective to the muddled debates surrounding legendary history. By separating the ontological question (did it happen?) from the genealogical one (does the story stem from it?) and the sociological one (what does the story do?), we expose the category errors that plague discussions of Troy, Arthur, and the Exodus. However, while this framework clarifies the *nature* of the evidence, the claim that evidence bears only on Descent is overly skeptical, and the conventional grading of the three cases reflects evidential probability more than mere cultural bias.

  The primary utility of the distinction lies in preventing the conflation of Descent and Event. In the case of Troy, the discovery of a burnt layer at Hisarlik is frequently cited as proof that the Trojan War 'happened' (Event). Methodologically, this is a non-sequitur. The destruction layer confirms a city was burned (Datum/Event), but it does not confirm the *narrative* of Helen and Achilles. It supports Descent only if we can link that specific destruction to a causal chain of transmission leading to Homer. By separating these questions, we see that archaeology constrains the Event (a war was possible) but primarily illuminates the Datum (the Mycenaeans valued martial destruction narratives). The shouting match described in the prompt—where maximalists wave destruction layers to prove Agamemnon, and minimalists wave the lack of bodies to disprove him—is indeed a failure to distinguish (i) from (ii).

  However, the provocation that evidence *only* bears on Descent requires qualification. Evidence can negatively adjudicate the Event. If radiocarbon dating placed the destruction of Hisarlik five centuries after the estimated date of the war, the Event question would be settled negatively. Thus, evidence bears on (i) by setting boundaries of possibility, even if it cannot positively confirm specific narrative details. Similarly, regarding the Exodus, the absence of Egyptian evidence for a mass migration is not merely a gap in Descent; it actively lowers the probability of the Event as narrated. To claim we can say nothing about (i) is to adopt a radical skepticism that renders historical inquiry impossible. We deal in probabilities, not certainties.

  This probabilistic approach defends the conventional grading of the three cases against the charge of pure cultural bias. It is true that cultural desire plays a role; Western civilization has a vested interest in claiming Troy as a foundational historical moment and Arthur as a nationalistic myth. Yet, the evidential density differs objectively. Troy possesses external corroboration: the Hittite references to *Wilusa* and *Alaksandu* provide a contemporary textual anchor that Arthurian sources (Nennius, Geoffrey) utterly lack. This external anchor strengthens the Descent hypothesis significantly. For Arthur, the causal chain is demonstrably literary and accretive; for Troy, it is potentially oral-traditional and contemporary.

  The Exodus occupies the middle ground not because of cultural indecision, but because the evidence is contradictory. The Merneptah Stele confirms an 'Israel' entity in Canaan (supporting a Datum of identity formation), but the archaeological record of Sinai contradicts a mass migration (undermining the Event). This genuinely warrants a 'contested' label, distinct from the 'myth' label of Arthur, where the evidence is silent rather than contradictory.

  Therefore, while the cultural impulse to find origins drives the *interest* in these cases, the grading is earned by the *density* of the causal chain. Troy is 'history' not because we know Achilles existed, but because the Descent hypothesis is robustly supported by external data. Arthur is 'myth' because the Descent hypothesis relies on internal textual recursion. To treat them as identical because all three lack definitive Event-proof is to ignore the gradations of historical probability. The tripartite distinction does not flatten the cases; it explains why they sit at different points on the spectrum. We must stop asking if they 'really happened' and start asking how tightly the story is bound to the soil. In that inquiry, Troy, Exodus, and Arthur are not equal, and the evidence, properly parsed through Event, Descent, and Datum, justifies the inequality.

  ***

  ### (c) Marking Scheme (Out of 20)

  **Grade Boundaries:**
  *   **17–20 (First):** Exceptional conceptual grasp. Uses the (i)/(ii)/(iii) framework to drive the argument, not just as a definition. Critically evaluates the instructor's provocation (neither blindly accepting nor rejecting it). Handles all three cases comparatively.
  *   **14–16 (Upper Second):** Solid understanding of the framework. Applies it to the cases correctly. Accepts the provocation largely without critique, or critiques it without full consistency. Good comparison of the three cases.
  *   **11–13 (Lower Second):** Understands the basic distinction. Tends to revert to fact-recitation (Schliemann, Merneptah, Geoffrey) without linking back to the methodology. Treats the three cases as separate mini-essays rather than a comparative argument.
  *   **0–10 (Third/Fail):** Fails to distinguish the three questions. Pure fact-sheet recitation. Misunderstands the prompt.

  **Specific Moves Required for an A (17+):**
  1.  **Operationalising the Triad:** The answer must use the Event/Descent/Datum distinction as a *tool* to analyse the evidence, not just define it in the introduction and drop it.
  2.  **Critiquing the Provocation:** The answer must challenge the instructor's claim that evidence *only* bears on Descent (ii). A top student will note that archaeology can rule out Events (i) negatively, even if it can't confirm them positively.
  3.  **Defending the Grading:** The answer must argue that the Troy/Arthur/Exodus hierarchy is based on *evidential density* (specifically external corroboration for Troy vs. internal recursion for Arthur), not just cultural bias.
  4.  **Comparative Synthesis:** The three cases must be woven together to prove a point about methodology, not treated as three separate paragraphs.

  **Specific Penalties:**
  *   **-3 Marks:** **The Fact-Trap.** Reciting specific archaeological data (e.g., debating Hisarlik VIIa vs. VIIb, or the specifics of the Merneptah Stele translation) without explaining how that data impacts the Event/Descent distinction. This is knowledge without understanding.
  *   **-2 Marks:** **Uncritical Acceptance.** Agreeing with the instructor's provocation entirely (i.e., arguing that (i) is completely unknowable and the grading is purely cultural) without offering a counter-argument regarding probability or negative evidence.
  *   **-2 Marks:** **Ignoring the Datum.** Focusing only on whether the events happened (i) and the transmission (ii), but failing to discuss what the stories tell us about the tellers (iii), which is a required part of the framework.

  **The "Well-Read Student Trap" (Crucial Differentiator):**
  *   **The Trap:** A student who has read extensively in the archaeology may attempt to **solve the Event question using archaeological specificity.** For example, they might argue: *"Finkelstein's Low Chronology proves the Exodus couldn't happen in the 15th Century, therefore (i) is false."*
  *   **Why it loses marks:** This misses the philosophical point of the module. The exam tests the *relationship* between evidence and categorization, not the archaeological truth itself. Using archaeology to definitively settle (i) ignores the epistemological gap the question asks them to analyse. It treats archaeology as a truth-machine rather than a source that bears primarily on (ii) and (iii).
  *   **Penalty:** Cap at 15 (Upper Second) if the answer devolves into an archaeological debate rather than a methodological one, regardless of the accuracy of the archaeological claims.
