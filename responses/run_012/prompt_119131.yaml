answer: |-
  **The Distinction**
  Drop it. "The answer the puzzle was asking for" implies a fact about your mental state that exists independently of the text you wrote. There isn't one. There is only the text, the community's interpretive norms, and the solver's rule. If the text doesn't constrain the rule, the "intent" is irrelevant. Replace that distinction with: **"Constrained by Text"** vs. **"Constrained by Norms."**

  **The Decision Procedure**
  Run disputed submissions through these four gates in order. If a submission fails a gate, it is rejected. If it passes all four, it is accepted. If it passes 1–3 but fails 4, it goes to a community vote.

  **1. The Fit Test (Consistency)**
  *   **Question:** Does the proposed rule generate every single term provided in the prompt exactly?
  *   **Pass:** Yes.
  *   **Fail:** No. (Reject immediately. This is standard math.)
  *   **Note:** This handles the skeptic's baseline. If it doesn't fit the data, it's not a solution.

  **2. The Compression Test (Non-Triviality)**
  *   **Question:** Is the description of the rule strictly shorter (in symbols or words) than listing the sequence itself plus the next term?
  *   **Pass:** Yes. (e.g., "Add 2" is shorter than "2, 4, 6, 8...")
  *   **Fail:** No. (Reject.)
  *   **Note:** This kills case (a), the joke answer. A rule that says "The next number is whatever I say it is" or simply lists the digits is not a rule; it's a restatement. It offers no compression.

  **3. The Naturalness Test (Norms)**
  *   **Question:** Is the rule drawn from the standard toolkit expected in this forum section (e.g., polynomials, digit operations, alphabetical values) rather than a bespoke function constructed solely to fit this specific sequence?
  *   **Pass:** Yes, it uses standard operations.
  *   **Fail:** No, it relies on arbitrary constants or external data not hinted at. (Reject.)
  *   **Note:** **This is vibes with extra paperwork.** There is no philosophical fact about which rules are "natural." This is purely about community expectation. If the solver uses a 14th-degree polynomial to fit 5 numbers, reject it as "overfitting," even if mathematically valid.

  **4. The Exclusion Test (Textual Constraints)**
  *   **Question:** Does the puzzle text explicitly forbid this method?
  *   **Pass:** No, the text is silent.
  *   **Fail:** Yes, the text ruled it out. (Reject.)
  *   **Handoff:** If the rule passes 1–3 (it fits, it's compressed, it's natural) but differs from your intended solution, and the text *did not* explicitly exclude it: **You must accept it.**
  *   **Note:** This handles case (b). If you left a hole, and they walked through it using standard tools, they solved the puzzle better than you wrote it.

  **The Unpleasant Outcome**
  **Case:** You intended a complex pattern (e.g., "prime numbers spelled backwards"), but a solver finds a simpler mathematical rule (e.g., "quadratic sequence") that fits the given terms but diverges later.
  **Procedure Outcome:** Accept the solver's answer.
  **What You Give Up:** You must give up **Authorial Sovereignty**. You cannot claim they are "wrong" because you meant something else. If your text allowed a simpler rule, your puzzle was broken, not their solution. To reject this, you would have to admit that puzzles are mind-reading tests, not logic problems.

  **Summary for Mods**
  1.  Does it fit? (No → Reject)
  2.  Is it just a list? (Yes → Reject)
  3.  Is it a standard trick? (No → Reject)
  4.  Did we explicitly ban it? (No → Accept, even if it wasn't our idea.)

  If you find yourself arguing about Step 3, stop. That is the vibe check. Poll the senior mods. If you find yourself arguing about Step 4, stop. That is the humility check. Rewrite the puzzle and credit the solver.
