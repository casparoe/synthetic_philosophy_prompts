prompt: |-
  I moderate a puzzle forum — weekly "what comes next in this sequence" and cryptarithm stuff — and every single week someone submits a solution built on a rule that fits every number we gave them and then goes somewhere completely different for the answer. Sometimes it's a joke, sometimes it's genuinely clever and I think the setter just left a hole. I read about this philosophy thing once, Kripke I think, where a made-up rule for addition matches normal addition on every sum anyone has ever actually done and then diverges on a new one, and the point is nothing in my past behaviour pins down which rule I meant. That's basically the argument we have in the mod chat every week and we settle it by vibes, and its making me crazy.

  So act as someone who knows this literature cold — a philosopher of language/mind who's read the Kripke material and the replies — but who can also write forum rules. Before you write anything, think through where the real difficulty actually lives, because I don't want a summary of the philosophy, I want it turned into something usable.

  Give me a decision procedure the mods can run on a disputed submission. Order the questions, say what counts as an answer to each, say where the procedure stops with a no, and where it has to hand off to a human vote because the question is about what the community wants rather than about what's true. Be honest about which steps are just our vibes with extra paperwork.

  It has to handle: (a) the joke answer where the "rule" is just a restatement of the digits we already gave, (b) the clever answer where our wording left a real hole and the solver walked through it, (c) the answer where the solver's rule is clearly the one we meant but we wrote it badly, so they're technically wrong and we look like we're making it up as we go. Include one case where the procedure gives an outcome I won't like, and tell me what I'd have to give up to accept it.

  One thing I've been chewing on and want you to settle: I keep wanting a distinction between "the answer the rule gives" and "the answer the puzzle was asking for," and I can't get it to do any work. Either build the procedure on it or tell me it's a dud.

  Keep it under a page. The other mods are not going to read philosophy. No citations, no reading list.
reasoning: |-
  Thinking Process:

