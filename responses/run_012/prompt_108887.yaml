answer: |-
  ### Taxonomy of Function: A Decision Tree

  To navigate the landscape of functional ascriptions, answer the following questions based on your intuitions about the specific cases provided. Do not worry about theoretical consistency yet; simply mark the path that matches your gut reaction to the scenario.

  **Node 1: The History Requirement (Case c)**
  *Consider the creature that pops into existence fully formed (Swampman), with no ancestors and no evolutionary history, possessing a heart that pumps blood.*
  **Question:** Does this heart have the **function** of pumping blood, or is it merely a pump that *happens* to pump?
  *   **A) It is merely a pump.** (History is required for "proper" function.) → *Go to Node 2.*
  *   **B) It has the function of pumping blood.** (History is not required.) → *Go to Node 3.*

  ---

  **Node 2: The Vestige Test (Case b)**
  *You have chosen that history is required. Now consider the cave fish's eyes, which were selected for seeing in ancestors but are now blind vestiges.*
  **Question:** Do these blind eyes retain the **function** of seeing, even though they can never perform it again?
  *   **A) Yes, they still have the function of seeing.** → *Leaf 1: Pure Selected Effects Theory.*
  *   **B) No, they have lost the function of seeing.** → *Leaf 2: Hybrid Historical View.*

  ---

  **Node 3: The Performance Test (Case b)**
  *You have chosen that history is NOT required. Now consider the cave fish's eyes again.*
  **Question:** Since the eyes no longer contribute to the capacity of sight, do they have the **function** of seeing?
  *   **A) Yes, they retain the function.** (Perhaps based on what they *would* do in a normal environment.) → *Leaf 3: Dispositional/Propensity Theory.*
  *   **B) No, they have lost the function.** (Function requires current causal contribution.) → *Go to Node 4.*

  ---

  **Node 4: The Drift/Exaptation Test (Case a)**
  *You require current contribution but not history. Consider the deep-sea snail whose glowing patch arose by random drift (no selection) but now attracts mates.*
  **Question:** Is the **function** of the patch to attract mates, or is it a byproduct that merely *does* so?
  *   **A) It is a byproduct; it has no function.** (Current use is not enough; requires specific contribution to survival *goals*.) → *Leaf 4: Goal Contribution Theory.*
  *   **B) It has the function of attracting mates.** (Any stable causal contribution to a containing system counts.) → *Leaf 5: Causal Role Theory.*

  ---

  ### The Leaves: Positions and Awkward Commitments

  **Leaf 1: Pure Selected Effects Theory (Etiological)**
  *   **Commitment:** You must accept that a permanently broken organ (like the cave fish eye) still has the function it can no longer perform, while a perfect duplicate without history (Swampman) has no functions at all.
  *   **Status:** *Coherent but counter-intuitive regarding vestiges.*

  **Leaf 2: Hybrid Historical View**
  *   **Commitment:** You claim history is necessary for function, yet you allow that current failure can wipe it out, making the "necessity" of history seem fragile or redundant.
  *   **Status:** *Unattractive; often collapses into Leaf 1 or Leaf 5 upon scrutiny.*

  **Leaf 3: Dispositional/Propensity Theory**
  *   **Commitment:** You attribute functions based on hypothetical performances in non-actual environments, which can make function ascriptions float free of physical reality.
  *   **Status:** *Unexplored in depth; difficult to define the "normal environment" without circularity.*

  **Leaf 4: Goal Contribution Theory (Boorse-style)**
  *   **Commitment:** You must draw a sharp line between "contributing to survival/reproduction" and "contributing to other capacities," which is often biologically indistinguishable (Case g).
  *   **Status:** *Coherent, but relies on a contested definition of "species-typical goal."*

  **Leaf 5: Causal Role Theory (Cummins-style)**
  *   **Commitment:** You cannot easily distinguish between a trait *functioning* and a trait *malfunctioning*; if it doesn't do the thing, "doing the thing" simply wasn't its function.
  *   **Status:** *Coherent, but sacrifices the normativity (the "ought") of biological function.*

  ***

  ### Mapping Your Position

  You stated two confident intuitions:
  1.  **Swampman Heart (Case c):** You believe it *is* for pumping blood.
      *   This forces you down **Branch B** at Node 1. You reject the requirement for selection history.
  2.  **Cave Fish Eyes (Case b):** You believe they have *stopped* being for seeing.
      *   This forces you down **Branch B** at Node 3. You reject the idea that function persists without current performance.

  This path leads you directly to **Node 4**, and based on your description of the snail case ("happens to attract mates"), you are currently undecided there. However, your first two answers are **logically consistent** with each other. They both align with **Leaf 5: Causal Role Theory**.

  **Your Suspected Inconsistency:**
  You wrote: *"I suspect my two confident answers come from different theories that cannot both be right."*
  **Analysis:** They are not from different theories; they are the *signature* commitments of the Causal Role Theory. The tension you feel is likely not logical inconsistency, but **Normative Discomfort**.
  *   **Selected Effects (Leaf 1)** handles "malfunction" well (the eye *should* see but doesn't) but fails your Swampman test.
  *   **Causal Role (Leaf 5)** passes your Swampman and Cave Fish tests, but struggles to explain why a Swampman heart that *fails* to pump is "broken" rather than just "a heart that doesn't pump."
  *   To move to a neighboring leaf, you would have to change your answer on **Node 1** (deny Swampman function) to gain a stronger account of malfunction, or change your answer on **Node 3** (affirm Vestige function) to prioritize history over capacity.

  **Potential Failure Points in this Construction:**
  1.  **Leaf 2 vs. Leaf 5:** The Hybrid View (Leaf 2) and Causal Role (Leaf 5) can be indistinguishable if the Hybrid theorist always defers to current capacity when history is ambiguous. The distinction collapses if "History Required" is never enforced against current utility.
