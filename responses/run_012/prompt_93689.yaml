      *   The core philosophical insight here is that moral life often involves tragic choices (doing harm to prevent greater harm). IPM is essentially a practice of *minimizing* moral cost while acknowledging necessity. This aligns with virtue ethics (Dana's character) and consequentialism (better outcomes than blanket spraying).
      *   I need to make sure I don't sound like I'm saying "Insects don't feel pain." I must leave the question open but honor the *attitude* toward it.

  6.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Hi, I'm [Name]. Soil guy. Dana's the bug lady.
