  11. **Final Review:** Does this meet the "don't lean on specific numbers" rule? Yes. Does it avoid putting words in Dana's mouth? Yes. Does it address the insect ethics without being a lecture? Yes, by focusing on the *attitude* toward the insects rather than the metaphysical status of the insects.

