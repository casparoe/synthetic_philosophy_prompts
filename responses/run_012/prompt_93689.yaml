  3.  **Brainstorming Options for the Toast:**
      *   *Option 1: Ignore it.* Stick to "She saved the crops/workers."
          *   *Cost:* Dishonest to the user's conscience. Ignores the reality of what IPM is (managing death).
          *   *Benefit:* Safe, celebratory.
      *   *Option 2: Name it head-on.* "We killed billions, was it right?"
