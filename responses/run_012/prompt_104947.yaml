  ### 1. Mark Breakdown

  **Total: 15 / 20**

  *   **(a) Reconstruction of the problem:** 4 / 4
  *   **(b) Application to the case:** 6 / 6
  *   **(c) Resources for giving numbers weight:** 3 / 6
  *   **(d) Stability and Defense:** 2 / 4

  ---

  ### 2. Point-by-Point Assessment

  **(a) Reconstruct the problem (4 marks)**
  *   **Right:** You correctly identify the "individualist" nature of the test as the source of the problem. The sentence *"It compares the complaint of one person with the complaint of another, and it does not permit complaints to be added together across persons"* accurately captures the individualist restriction.
  *   **Right:** You correctly state the implication for numbers: *"no number of people with weak complaints can ever outweigh one person with a strong complaint."*
  *   **Missing:** Nothing significant. This is a precise reconstruction.

  **(b) Say what the view implies in the case below, and why (6 marks)**
  *   **Right:** You correctly identify the outcome: *"the trust must fund the treatment and save R."*
  *   **Right:** You correctly explain the reasoning: *"no one of them has a complaint as strong as R's, and their complaints cannot be summed to outweigh his."*
  *   **Right:** You correctly distinguish the strength of the complaints (life vs. itch).
  *   **Missing:** Nothing. You have fully answered both the "what" and the "why."

  **(c) Set out the resources... and assess how far they reach (6 marks)**
  *   **Right:** You correctly identify that Scanlon allows burdens to be combined *"within a life."*
  *   **Wrong:** You present aggregation within a life as a resource for giving *numbers* (of people) weight. The question asks how the view gives *numbers* weight. Intra-personal aggregation explains why we can sum burdens for one person, but it does not explain why we should count *heads* across persons. This is a category error in your explanation.
  *   **Partially Right:** You state: *"a principle that many people have the same reason to reject faces a stronger objection than one that only a few have reason to reject."* This is imprecise. Scanlon argues that when complaints are *similar*, numbers break the tie; he avoids saying the objection itself is "stronger" in an aggregated sense, as that risks the utilitarianism he rejects. However, you recover this by noting it applies only *"when the complaints are of the same type."*
  *   **Right:** You correctly assess the reach: *"In the Fund case, though, neither consideration changes the outcome."* You recognize that because the complaints are asymmetrical (life vs. itch), the number-sensitive resource does not trigger.

  **(d) Is the resulting position stable... Defend your answer (4 marks)**
  *   **Right:** You correctly characterize the aim of the position: *"neither a form of aggregation nor a view on which numbers never matter."*
  *   **Wrong/Weak:** You fail to **defend** the claim of stability. You assert that the restrictions block the wrong answers and the resources prevent insensitivity, but you do not explain *why* this combination is coherent. A defense requires addressing the standard objection: that the distinction between "same kind" and "different kind" of complaint is arbitrary, leading to a collapse into aggregation or absurdity. You state the position is stable; you do not argue for it.
  *   **Missing:** Engagement with the tension between the individualist restriction and the number-sensitive clause.

  ---

  ### 3. Explicit Judgement on Substantive Claims

  *   **"Scanlon's contractualism holds that an act is wrong if it would be disallowed by any principle for the general regulation of behaviour that no one could reasonably reject."**
      *   **True.** Accurate statement of the contractualist formula.
  *   **"The test of a principle is therefore whether some person affected by it has grounds for rejecting it that it would be unreasonable to ask her to set aside."**
      *   **True.** Accurate elaboration of the formula.
  *   **"Because the test is put to each person in turn, the view is individualist."**
      *   **True.** Correctly identifies the structural feature.
  *   **"It compares the complaint of one person with the complaint of another, and it does not permit complaints to be added together across persons."**
      *   **True.** Accurate description of the pairwise comparison and individualist restriction.
  *   **"This is the source of the aggregation problem."**
      *   **True.** Correct causal link.
  *   **"If the only question is whether some single person has a complaint stronger than some single person on the other side, then no number of people with weak complaints can ever outweigh one person with a strong complaint."**
      *   **True.** Correct logical implication of the restriction.
  *   **"Applied to the Fund case, this means the trust must fund the treatment and save R."**
      *   **True.** Correct application of the theory to the case.
  *   **"Each of the 250,000 has a complaint — a chronic itch is a real burden — but no one of them has a complaint as strong as R's, and their complaints cannot be summed to outweigh his."**
      *   **True.** Correct reasoning for the application.
  *   **"This is not a version of contractarianism."**
      *   **True.** Correct classification.
  *   **"The question is not what each party could rationally demand in a bargain, but what could be justified to each party given her equal standing."**
      *   **True.** Accurate distinction between contractualism and contractarianism.
  *   **"The strength of a complaint is the weight of the reason the person has to object to the principle, not the amount of welfare the principle would cost her; contractualism is not a disguised utilitarianism with a pairwise comparison rule."**
      *   **True.** Accurate distinction between contractualist reasons and utilitarian welfare.
  *   **"First, he allows aggregation within a life: where a principle would burden one person in several distinct ways, those burdens may be combined into a single complaint."**
      *   **True (as description), False (as relevance).** Scanlon does allow this, but this is **not** a resource for giving *numbers of people* weight, which is what part (c) asked for. It is a resource for explaining why intra-personal summation is permissible, not inter-personal counting.
  *   **"Second, the number of people who share a complaint matters, since a principle that many people have the same reason to reject faces a stronger objection than one that only a few have reason to reject"**
      *   **Imprecise.** Scanlon argues numbers matter when complaints are *similar*, but describing the objection as "stronger" due to numbers risks conflating his view with the aggregation he rejects. It is better to say the *principle* is more reasonably rejected, not that the *objection* aggregates in strength.
  *   **"and once we see that the same reasoning extends across persons when the complaints are of the same type, contractualism can give the numbers their due without becoming consequentialist."**
      *   **True.** Accurately captures Scanlon's "similar complaints" defense.
  *   **"In the Fund case, though, neither consideration changes the outcome: R's complaint is the strongest single complaint, and the itch sufferers' complaints are of a different and weaker kind, so R cannot reasonably be left to die for their aggregate comfort."**
      *   **True.** Correct assessment of the limits of the resources in this specific case.
  *   **"Is the position stable? I believe it is."**
      *   **Unsupported.** This is a conclusion without argument.
  *   **"The individualist restriction blocks the cases in which aggregation gives the wrong answer, while the two resources above keep the view from being absurdly insensitive to numbers when the complaints on each side are of the same kind."**
      *   **True (as description of intent), Unsupported (as defense of stability).** This describes *what* the view does, but does not defend *why* holding these two commitments together is logically stable against charges of arbitrariness.
  *   **"So contractualism is neither a form of aggregation nor a view on which numbers never matter."**
      *   **True.** Correct summary of the middle-ground position.

