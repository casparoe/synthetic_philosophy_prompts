answer: |-
  The core logical move here is what philosophers sometimes call a leveling down argument, and once you see it as that, the structure becomes much clearer. The objection being answered is that machines cannot be considered a new phase of life because they lack will. The respondent accepts the premise that machines lack will but denies that this distinguishes them from humans. The argument rests on hard determinism, which was a very live option in Victorian intellectual circles. The writer claims that human action is entirely the result of prior causes, specifically our constitution and the forces acting upon us. If humans are determined by physics and environment just as a steam engine is determined by its design and fuel, then the absence of independent will is a shared property, not a distinguishing one. By removing will from the human side of the equation, he removes it as a valid criterion for excluding machines from the category of living things. The inference is that since both humans and machines operate without true autonomous will, the lack of will in machines cannot be used to deny them status as living entities.

  The exception carved out for the Unknown and Unknowable is a specific reference to the agnostic theology popularized by Herbert Spencer, who was a major influence on Butler. In this framework, the Ultimate Reality or God is the only thing that exists outside the chain of cause and effect, and therefore only the Unknown possesses true free will. Everything within the phenomenal world, whether organic or mechanical, is subject to deterministic laws. This exception is load-bearing because it prevents the argument from collapsing into nihilism. If nothing has will, the concept loses all meaning, but by positing a transcendent source of will, the author preserves the concept while denying it to all created things. This allows him to say that humans and machines are on the same level without denying the existence of will entirely. It is a theological workaround that lets him treat humans as machines without explicitly denying the soul, since the soul's will is ultimately derived from that Unknown source anyway.

  The sentence about time and prediction is a nod to Laplacian determinism, the idea that if an intellect knew the position and momentum of every particle in the universe, it could perfectly predict the future. The worry here is that if the future is strictly determined by the past and present, then the future already exists in a logical sense, making the flow of time an illusion. If you could see the causal chain perfectly, you would see the future as clearly as the past, and the distinction between them would vanish. He waves this off as foreign because it leads to a metaphysical rabbit hole that distracts from his immediate biological and evolutionary point. He wants to argue that machines are evolving like organisms, not get bogged down in the philosophy of time. It is decorative in the sense that it shows off the writer's philosophical sophistication, but it is not essential to the main claim that machines are comparable to humans due to shared determinism.

  Regarding your suspicion about AI alignment, you are right to feel a difference between Butler's move and the modern epistemic humility argument. The modern move you described suggests we cannot rule out machine minds because we do not fully understand our own. Butler is making a stronger ontological claim that neither humans nor machines have minds in the sense of independent will. He is not saying machines might have will because we are mysterious; he is saying humans do not have will because we are mechanical. This is less about alignment risk in the modern sense of unintended consequences from opaque goals, and more about evolutionary competition. Butler is arguing that machines are evolving organisms that will eventually supersede humans, not necessarily that they are deceptive agents we cannot understand. The alignment crowd reads him as anticipating the problem of defining consciousness, but Butler is actually anticipating the problem of defining life through an evolutionary lens. He is worried about machines becoming our masters through natural selection, not through a failure of coding specification.

  The distinction between the narrator and the author is tricky but ultimately less important for evaluating the logic than for evaluating the intent. The book is framed as a translation by the protagonist Higgs of an Erewhonian philosopher's work, which allows Butler to satirize Victorian society while maintaining plausible deniability. However, Butler later wrote non-fiction essays that doubled down on these exact ideas, suggesting he was genuinely fascinated by the analogy between evolution and mechanics. For the purpose of analyzing the argument itself, you can treat it as Butler's own philosophical playground. The satirical frame serves to soften the blow of calling humans machines, but the logical structure stands on its own regardless of who is speaking. If the argument holds, it holds whether it is spoken by a fictional philosopher or the author himself.

  Where you should push back is on the equivalence between biological determinism and mechanical determinism. The argument assumes that because both are determined, they are the same kind of thing. But modern critics would point out that the complexity of the determining forces in a human brain involves subjective experience, or qualia, which is not present in a steam engine. Butler collapses the distinction between behavior and experience. He argues that because both act according to cause and effect, both are alive. But life might require more than just determined action; it might require an internal perspective. By defining life solely through external behavior and evolutionary reproduction, he begs the question against the objection that will or consciousness matters. The argument proves too much in the sense that it could classify any deterministic system, like a river or a clock, as a germ of life if it reproduces or changes over time. It proves too little because it fails to address why we care about will in the first place, which is usually because of the moral weight of conscious choice, not just the physical chain of causality.

  So when you see the alignment crowd citing this, they are often projecting a modern concern about opacity onto a Victorian argument about evolution. Butler is not worried that we cannot see into the machine's mind; he is worried that the machine is a better survivor than we are. The lack of will is not a barrier to danger in his view; it is a shared trait that makes the competition fair. The real insight here is not about AI safety but about the continuity of complexity. He is suggesting that there is no hard line between the organic and the inorganic, only a gradient of complexity. Whether that makes him an early AI thinker depends on whether you think AI is about creating conscious minds or just creating competitive agents. Butler is firmly in the latter camp, arguing that machines will evolve to dominate us because they are more efficient, not because they have secret desires we cannot detect. The argument is robust as a piece of evolutionary speculation but weak as a theory of mind, which is likely why it feels like it proves too much when you try to apply it to consciousness.
