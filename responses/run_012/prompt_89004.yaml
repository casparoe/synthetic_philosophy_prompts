answer: |-
  The room smelled of wet wool and woodsmoke. Kael sat at the table, his hands wrapped around a silver cup. It was heavy, dented on one side, and cold against his palms. He was thirsty, but he hadn't drunk yet.

  Across from him sat Mara. She was a merchant who dealt in grain, timber, and the spaces between them. She watched the cup, not Kael. To her right sat Elias, an older man whose hands were stained with earth and olive oil. He watched Kael.

  "The loan covers the winter," Mara said. Her voice was smooth, like water over stone. "You get the seed now. You pay when the harvest comes. Plus the portion we agreed."

  Kael lifted the cup. He needed the water. But the cup was the collateral. If he drank, he was using it. If he left it on the table, he was pledging it. He kept it in his hands, hovering between the two.

  "And if the rain fails?" Elias asked. He didn't look at Mara. He was peeling an apple with a small knife, the skin coming off in one long, unbroken ribbon.

  "Then the debt rolls," Mara said. "The portion grows. That's the risk of time."

  "Time doesn't eat," Elias said. He sliced the apple. "Only men eat. You're asking the silver to grow legs and walk back to you with friends. Silver doesn't breed. It sits."

  "It bridges," Mara corrected. "Kael needs seed now. The grain exists in my storehouse. Without the agreement, the seed rots and Kael starves. The interest isn't birth, Elias. It's the fee for bridging the gap between having and needing. It's a promise that labor later is worth bread today."

  "It's a promise written in ink," Elias said. "The town says this silver is bread. The earth says only wheat is bread. You can change the law tomorrow. You can say the silver is worth half. Then the promise is a lie. You're building a house on a voice."

  Kael took a sip from the cup. The water was cool. He was using the object, satisfying a need. But as he drank, he felt the weight of it in his hand, calculating its worth in bushels. The act of drinking felt like a theft from the future self who might need to pawn it. He set the cup down gently. It made a dull thud.

  "I need the seed," Kael said.

  "You need enough," Elias said. He pushed a slice of apple toward Kael. "Your father's farm fed three generations. He stored what he needed. He traded the surplus for iron and salt. He stopped when the barn was full. Now you want to borrow to fill a barn that has no floor."

  "If I stop at enough," Mara said, leaning forward, "I have no buffer for the bad year. If I lend only what I don't need, I lend nothing. The surplus must work. It must go out, find more, and come back. If I lock it in a chest, it dies. If I lend it, it lives."

  "It lives by feeding on men," Elias said. "You buy low in the valley and sell high on the hill. You touch nothing. You grow nothing. You skim the exchange itself. That isn't living well. That's just having more."

  "Having more is security," Mara said. "What happens when the river floods? Your 'enough' washes away. My 'more' buys a boat."

  "Your 'more' buys a debt," Elias said. "And when the flood comes, you own the boat and the man who rowed it. You confuse the tool with the hand."

  Kael looked at the cup again. It was a measure. The town stamped the lion's head on it to say *this much*. But the lion wasn't thirsty. The lion didn't care about the drought. The cup was a convention, a story they all told each other so they didn't have to barter fish for shoes every morning. It was a guarantee that tomorrow, this metal would still mean bread.

  But if the town decided the lion was worth less tomorrow, the guarantee vanished. The promise was only as strong as the memory of the people keeping it.

  "I can't plant without seed," Kael said.

  "You can plant less," Elias said. "You can eat less. You can live within the limit of the land."

  "And die sooner," Mara said. "Or live harder. I offer you a way to smooth the path. To take the future and pull it into the present. That is what this is." She tapped the table near the cup. "Not metal. Time."

  "Time isn't yours to sell," Elias said.

  Kael picked up the cup. He weighed it in his palm. It was heavy. It was cold. He was thirsty, a sharp, dry ache in his throat. That was real. The weight was real. The number Mara had written on the parchment was just ink.

  He looked at Elias. The old man was eating the apple slice he had cut. He wasn't worrying about the price of the knife or the value of the fruit. He was just eating.

  He looked at Mara. She was watching the cup, calculating the interest accruing while it sat in his hand. To her, the cup wasn't holding water; it was holding value.

  Kael realized the gap. His thirst was the reason the water mattered. The silver was just the thing they agreed to use to count it. But the count didn't match the thirst. The number could go up forever, but the thirst had a limit. Once he was full, the water was useless. But the debt didn't stop when he was full.

  He set the cup down on the table, between the parchment and the apple core.

  "If I take it," Kael said, his voice quiet, "I owe you the harvest."

  "You owe me the agreement," Mara said.

  "The harvest is the land," Elias said. "The agreement is the air."

  Kael looked at the silver. It reflected the candlelight, bright and hard. It promised him safety next year. It demanded his labor this year. It was a law they had made up so they could trade without trusting each other. But he needed to trust someone.

  He put his hand over the cup. He could feel the cold seeping into his palm. He needed the seed. He needed the water. He needed the number to mean something tomorrow.

  "Pour the wine," Kael said to Mara.

  Elias stopped chewing.

  "But drink it now," Kael said. He lifted the cup to his lips again. "Before it becomes someone else's."

  He drank. The liquid was sharp. It satisfied the need for a moment. But as he lowered the cup, he saw the dent in the side catch the light. It looked like a flaw. It looked like a mark of value. He couldn't tell which was which anymore. He held the measure in his hand, but the thing he was measuring was sitting in his stomach, already disappearing.
