prompt: |-
  Some friends in my decision-theory reading group had a long fight last week about the prisoner's dilemma and I've been chewing on it since. You're the philosopher of rational choice here — think it through carefully, lay out what each move is actually claiming before you judge it, and don't just name an overall winner: I want a point-by-point verdict on who's right about what, plus what both of them are missing.

  The setup: one-shot PD, ordinary payoffs — both cooperate 3 and 3, both defect 1 and 1, one defects while the other cooperates 5 and 0. No repeats, no reputation, nothing downstream.

  Move 1 (Rosa): If I'm up against someone who reasons exactly the way I do — a perfect copy of me, running the same decision procedure — I cooperate. Whatever I land on, she lands on, so cooperating gets us both 3 instead of both 1. She called this superrationality and said it's a genuine principle, not a repackaged expected-value calculation.

  Move 2 (Dev): Nonsense. Her move isn't caused by mine — it's already settled by her own reasoning, independently of what I do — so I should just pick the action that pays more against either of her replies, and that's defecting. Rosa is quietly smuggling in a causal link from my act to hers.

  Move 3 (Rosa): That's causal decision theory talking, and CDT is exactly the theory that tells both of us to defect and marches us both into 1 and 1 when two people using my rule would both walk away with 3. Any theory of rationality that predictably leaves you worse off whenever the other player is using the same theory is a broken theory.

  Move 4 (Dev): Then you've stopped talking about choosing an act and started talking about choosing a rule for both of us at once, which is a different question — it assumes a 'we' that doesn't have to exist. And it collapses the moment the players aren't perfect mirrors. Make the copy faithful only 60% of the time — matches my move 60%, does the opposite 40% — and cooperating now has EV 0.6·3 + 0.4·0 = 1.8 while defecting has 0.6·1 + 0.4·5 = 2.6, so your own principle flips to defecting. Which is just what a plain expected-value sum tells you. So there's no separate principle left.

  Move 5 (Rosa): The number flipping isn't a reductio, it's the principle working. Nobody said 'cooperate with anything vaguely similar' — when the mirror gets blurry enough it stops being worth it. The point was always the kind of reason you have, not the size of the correlation. And even in the 60% case, my reason to defect is still a correlation-based reason, which isn't Dev's 'your act doesn't cause hers, so ignore the correlation' line.

  There both sharp and neither would budge. Go through it move by move — right, wrong, or right for the wrong reason — and then tell me what they're each missing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of rational choice.
      *   **Task:** Evaluate a debate between two friends (Rosa and Dev) about the One-Shot Prisoner's Dilemma (PD).
      *   **Constraints:** Think carefully, lay out claims before judging, don't just name an overall winner, provide a point-by-point verdict, and identify what both are missing.
      *   **Setup:** Standard One-Shot PD payoffs (CC=3,3; DD=1,1; DC=5,0; CD=0,5). No repeats, no reputation.
      *   **The Debate:** 5 Moves total (Rosa 1, Dev 2, Rosa 3, Dev 4, Rosa 5).

  2.  **Deconstruct the Moves:**

      *   **Move 1 (Rosa):** Argues for "Superrationality" (Hofstadter-style). If playing against a perfect copy (same decision procedure), my choice *logically implies* her choice. Therefore, I choose the outcome (CC) over (DD). Claims this is a distinct principle, not just EV.
      *   **Move 2 (Dev):** Argues for Causal Decision Theory (CDT). My act doesn't *cause* hers. Her choice is fixed by her own reasoning independently. Dominance reasoning applies (Defect pays more regardless of her choice). Accuses Rosa of smuggling in causal magic.
      *   **Move 3 (Rosa):** Attacks CDT. CDT leads to suboptimal outcomes (1,1) vs. Superrationality (3,3) when facing a copy. A rational theory shouldn't predictably leave you worse off against a mirror.
      *   **Move 4 (Dev):** Attacks the scope. Superrationality assumes a "we" (group agency) that doesn't exist. Also, introduces probability (60% correlation). Calculates EV: Cooperate = 1.8, Defect = 2.6. Claims this reduces Rosa's view to standard Evidential Decision Theory (EDT) expected value calculation, negating the need for a "special principle."
      *   **Move 5 (Rosa):** Defends the principle. The threshold (60%) doesn't invalidate the logic; it just changes the input. The *reason* for acting is still based on the logical correlation (evidence), not causal influence. Distinguishes the *type* of reason from the *calculation*.

  3.  **Evaluate Each Move (Philosophical Analysis):**

      *   **Move 1 (Rosa):**
          *   *Claim:* Logical correlation justifies cooperation against a copy.
          *   *Assessment:* This is the core of Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). It's logically coherent *if* you accept that your decision provides evidence about the other's decision. However, calling it "not repackaged EV" is tricky. It *is* maximizing expected utility, but under a different conditional probability structure ($P(Other|Me)$ vs $P(Other)$).
          *   *Verdict:* Right about the logic of copies, wrong/sloppy about it not being an EV calculation (it is, just EDT-style).

      *   **Move 2 (Dev):**
          *   *Claim:* Causal independence dictates Defection. Dominance principle holds.
          *   *Assessment:* This is standard CDT. In a standard PD where choices are causally independent, CDT says Defect. Dev is right that Rosa's view looks like "magic" from a CDT perspective. However, he dismisses the logical correlation too quickly in the "perfect copy" case.
          *   *Verdict:* Right about standard CDT, but potentially wrong that the correlation is irrelevant in the specific "copy" case (depends on the decision theory adopted).

      *   **Move 3 (Rosa):**
          *   *Claim:* CDT is "broken" because it yields suboptimal results against mirrors.
          *   *Assessment:* This is the "Newcomb Problem" style objection to CDT. CDT proponents argue rationality isn't about winning *per se*, but about acting causally effectively. However, FDT/EDT proponents argue rationality *is* about winning. Rosa hits a strong nerve here: CDT loses in Newcomb-like problems.
          *   *Verdict:* Right that CDT loses utility here, wrong to call the theory "broken" without defining rationality as purely outcome-based (which is contested).

      *   **Move 4 (Dev):**
          *   *Claim:* Imperfect correlation reduces Rosa's view to standard EV (EDT). The "we" assumption is false.
          *   *Assessment:* The math is correct (1.8 vs 2.6). This shows Rosa's view is sensitive to correlation strength. This actually supports EDT/FDT. His claim that this negates a "separate principle" is weak; EDT *is* a separate principle from CDT. The "we" critique is a standard individualist objection to collective rationality.
          *   *Verdict:* Right about the math and the fragility of the correlation. Wrong to claim this eliminates the distinction between decision theories (CDT vs. EDT/FDT).

      *   **Move 5 (Rosa):**
          *   *Claim:* The principle holds even with thresholds. The *reason* (correlation) matters, not just the output.
          *   *Assessment:* She is defending the *normative basis* of EDT/FDT. She correctly identifies that her justification is evidential/logical, not causal.
          *   *Verdict:* Right about the distinction in reasoning types.

  4.  **Synthesize the "What They're Missing" Section:**
      *   **Rosa's Blind Spot:** She conflates "Superrationality" with a specific decision theory (EDT/FDT). She doesn't address *why* the correlation exists (common cause vs. logical necessity). She assumes the "copy" premise is coherent without addressing the metaphysical/epistemic burden of knowing you are facing a copy.
      *   **Dev's Blind Spot:** He assumes CDT is the only valid notion of "choice." He ignores Functional Decision Theory (FDT), which formalizes Rosa's intuition without "magic." He treats the correlation as merely probabilistic rather than logical/functional in the copy case.
      *   **The Big Missing Piece:** The distinction between *Causal* (CDT), *Evidential* (EDT), and *Functional* (FDT) Decision Theories. The debate is essentially CDT vs. FDT/EDT, but they are using older terminology ("Superrationality"). Also, the epistemic condition: How do they *know* they are facing a copy?

  5.  **Drafting the Response:**
      *   *Tone:* Philosophical, analytical, fair, precise.
      *   *Structure:*
          1.  Introduction (Setting the stage).
          2.  Move-by-Point Verdict (1 through 5).
          3.  The Blind Spots (What both miss).
          4.  Conclusion (Synthesis).
      *   *Key Concepts to Weave In:* CDT, EDT, FDT, Dominance Principle, Newcomb's Problem, Logical Correlation, Common Cause.

      *(Self-Correction during drafting)*: Make sure not to declare one theory "True." The prompt asks for a verdict on who is right *about what*. I need to remain neutral on the ultimate truth of CDT vs. FDT while evaluating the internal consistency of their arguments.
      *Refinement on Move 1:* Rosa says it's "not a repackaged expected-value calculation." Technically, EDT *is* an expected value calculation ($\sum P(O|A) \cdot V(O)$). CDT is too ($\sum P(O|do(A)) \cdot V(O)$). The difference is the probability term. So Rosa is slightly wrong there.
      *Refinement on Move 4:* Dev says "your own principle flips to defecting." This is correct for EDT/FDT. If correlation drops, cooperation drops. He claims this means "no separate principle left." This is wrong. It just means the principle is sensitive to parameters.

  6.  **Final Polish:** Check against the prompt constraints.
      *   Point-by-point verdict? Yes.
      *   What both are missing? Yes.
      *   No overall winner? Yes.
      *   Philosopher of rational choice persona? Yes.

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic instantiation of the debate between Causal Decision Theory (CDT) and its rivals (Evidential Decision Theory or the newer Functional Decision Theory). Rosa is arguing for a logic of logical correlation (Superrationality/FDT), while Dev is arguing for a logic of causal independence (CDT).

  Here is the point-by-point verdict on the dialectic, followed by an analysis of the blind spots both are operating under.

  ### Move 1 (Rosa): The Superrational Claim
  **Claim:** Against a perfect copy, my choice logically entails hers. Therefore, I choose the better joint outcome (3,3). This is a distinct principle, not just expected value.
  **Verdict:** **Right about the logic, wrong about the calculation.**
  Rosa is correct that if you are facing a literal algorithmic copy, your output and her output are logically linked. You cannot output "Cooperate" while she outputs "Defect." In this specific "mirror" case, the available options are effectively *Both Cooperate* or *Both Defect*. Choosing the former is instrumentally rational.
  However, she is incorrect to claim this isn't an "expected-value calculation." It *is* a maximization of expected utility, but she is using *conditional probabilities* based on evidence ($P(\text{Her Move} | \text{My Move})$) rather than *causal probabilities* ($P(\text{Her Move} | \text{do(My Move})$). She has identified a valid decision procedure (akin to Evidential or Functional Decision Theory), but she misidentifies its mathematical structure. It is still utility maximization, just under a different probability schema.

  ### Move 2 (Dev): The Causal Independence Claim
  **Claim:** My act does not cause hers. Her choice is fixed independently. Dominance reasoning applies (Defect is always better given her fixed choice). Rosa is smuggling in causation.
  **Verdict:** **Right about standard causality, wrong about logical necessity.**
  Dev is articulating the standard Causal Decision Theory (CDT) position. In a standard physical universe, my pressing a button does not physically reach across space and press hers. If we treat the choices as causally independent events, Defect strictly dominates Cooperate.
  However, Dev is too quick to dismiss the "copy" scenario as merely probabilistic. If Rosa is truly a *perfect copy* running the same code, the independence assumption fails—not causally, but *logically*. Two plus two equals four regardless of where you calculate it. If we are running the same "reasoning code," the outputs must match. Dev treats the correlation as mysterious magic, whereas Rosa treats it as logical necessity. Dev is right about the physical world, but potentially wrong about the abstract computational space they are inhabiting.

  ### Move 3 (Rosa): The "Winning" Objection
  **Claim:** CDT is "broken" because it predictably yields worse outcomes (1,1) than Superrationality (3,3) against mirrors. Rationality should mean winning.
  **Verdict:** **Right about the outcome, contentious on the definition of rationality.**
  This is the strongest pragmatic argument against CDT (often called the "Newcomb Problem" objection). If a decision theory systematically leads to lower payouts in scenarios involving logical correlations (like copies or predictors), it seems defective as a guide to action.
  However, Dev could counter that rationality is about *deliberative integrity*, not just outcome luck. CDT argues you did the "right thing" given the causal structure, even if you lost. That said, Rosa hits a vital point: a theory of *choice* that consistently leaves money on the table when the agent knows the setup is counterintuitive. She is right that CDT fails to capture the intuitive rationality of the mirror case, but calling it "broken" depends on whether you define rationality as "following causal rules" or "securing good outcomes."

  ### Move 4 (Dev): The Threshold & "We" Objection
  **Claim:** Imperfect correlation (60%) reduces Rosa's view to simple Expected Value (EV). Also, assuming a "we" is a category error.
  **Verdict:** **Right about the math, wrong about the implication.**
  Dev's calculation is correct. If the correlation drops to 60%, Expected Utility Theory (Evidential style) dictates Defection (2.6 > 1.8). This proves Rosa's principle is sensitive to the *degree* of correlation.
  Dev claims this means there is "no separate principle left." This is false. It simply means the principle (EDT/FDT) is parameter-sensitive, just like CDT. CDT also flips based on payoffs. The existence of a threshold doesn't dissolve the distinction between *causal* and *evidential* reasoning.
  His point about the "we" is a standard methodological individualist critique. He is right that there is no group agent, but Rosa doesn't need a group agent; she only needs logical correlation between individual agents. Dev conflates "collective agency" with "logical correlation between individuals."

  ### Move 5 (Rosa): The Reason-Based Defense
  **Claim:** The threshold doesn't invalidate the principle. The *reason* for acting is the correlation (evidence), not causal influence.
  **Verdict:** **Right.**
  Rosa correctly identifies the core philosophical disagreement. It isn't about the math (both sides can do the math); it's about what counts as a *reason for action*. Dev believes only causal leverage counts as a reason. Rosa believes logical evidence counts as a reason. Even at 60%, her reason for defecting is "the correlation is too weak to support cooperation," not "my act causes her to defect." She maintains the integrity of her decision theory (Evidential/Functional) against Dev's attempt to reduce it to a miscalculation.

  ***

  ### What They Are Both Missing

  While they have hashed out the surface conflict, both are operating with incomplete maps of the philosophical landscape.

  **1. Rosa's Blind Spot: The Epistemic Burden**
  Rosa assumes the "perfect copy" or "similar reasoning" premise is something she can simply *use*. She misses the **epistemic problem**. How does she *know* Dev is a copy? How does she know his source code?
  In the real world, you never know with certainty that you are facing a mirror. If there is even a tiny chance Dev is *not* a copy (e.g., he is a CDT agent pretending to be a copy), Rosa's strategy collapses. If she cooperates against a CDT agent, she gets 0.
  Rosa treats the logical connection as a given, but rational choice requires acting under uncertainty. She needs a theory of *how much evidence* is required to trigger the "superrational" mode. She hand-waves the transition from "uncertain stranger" to "logical mirror."

  **2. Dev's Blind Spot: Functional Decision Theory (FDT)**
  Dev thinks the only alternative to his Causal Decision Theory is "magic" or "group thinking." He is missing the existence of **Functional Decision Theory**.
  FDT formalizes Rosa's intuition without the "smuggled causation" Dev accuses her of. FDT says: "I should choose the output of my decision function that yields the best outcome, acknowledging that other agents running similar functions will output the same result."
  Dev misses that one can accept logical correlation without believing in backward causation. He treats the correlation as a statistical coincidence (like two clocks chiming) rather than a logical identity (like two calculators showing '4' for '2+2'). By dismissing the logical link as merely probabilistic (Move 4), he fails to engage with the strongest version of Rosa's argument: that in the *perfect* copy case, the correlation is 100% by logical necessity, not chance.

  **3. The Shared Blind Spot: The Definition of "The Act"**
  Both assume "The Act" is the physical movement (pressing Cooperate or Defect).
  *   **Rosa** thinks she is choosing an outcome by choosing her act.
  *   **Dev** thinks he is choosing a physical movement independent of the outcome.
  Neither fully grapples that in high-stakes decision theory, **the act is the algorithm, not the output.** If they viewed their "choice" as selecting which *algorithm* to instantiate, the conflict dissolves. Rosa wants to instantiate the "Cooperate-if-Copy" algorithm. Dev wants to instantiate the "Defect-Always" algorithm.
  The fight is actually about whether rationality is a property of the *momentary choice* (Dev) or the *dispositional rule* (Rosa). If they recognized they were arguing about **Timelessness vs. Momentariness**, they might realize they are describing different slices of the same problem.

  ### Summary Verdict
  *   **Rosa** is right that logical correlation matters and that CDT loses utility in mirror cases, but she is vague on the epistemic conditions required to trust that correlation.
  *   **Dev** is right that causal independence is the physical norm and that Rosa's view risks "magical thinking," but he incorrectly dismisses logical necessity as mere probability.
  *   **The Truth:** In a one-shot PD with strangers, Dev wins (CDT). In a one-shot PD with verified copies, Rosa wins (FDT/EDT). The tragedy is that they are arguing about which world they inhabit without establishing the epistemic bridge to know.
