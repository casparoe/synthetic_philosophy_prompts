answer: |-
  The projector bulb had blown ten minutes into the session, leaving the tidal surge maps in darkness. The five commissioners sat around a laminate table scarred by cigarette burns from a previous decade, paper cups of vending machine coffee cooling in front of them. Outside, the rain hammered the corrugated roof of the municipal building, a steady rhythm that competed with the hum of the refrigerator in the breakroom.

  Mr. Vane, the developer, sat in the public row. He wore a suit that looked too dry for the weather, his hands folded over a leather portfolio. He hadn't spoken in an hour.

  Chairman Alden tapped his gavel. The sound was dull, absorbed by the damp air.

  "Item four," Alden said. "Application by Vane Coastal Developments to reconstruct the seawall at Lot 4, Blackwood Point. We proceed by the statutory sequence. Proposition One: The applicant holds valid title to the foreshore requisite for construction."

  He looked down the row. "Ms. Cress?"

  Cress adjusted her glasses. She had the town's coastal management plan open in front of her, a thick binder she had insisted on reading aloud during the public comment period, though no one had listened. "The deed search is complete," she said. "The chain of custody from the nineteen-twenty grant is unbroken. There's no encroachment on state land."

  "Mr. Dove?"

  Dove rubbed his temples. He represented the district where the street flooded every king tide. "I've seen the surveyor's notes. There's a cloud on the eastern boundary. An easement from the railway era. It hasn't been extinguished."

  "Mrs. Eames?"

  Eames stared at the dark projector screen. "I agree with Mr. Dove. The title isn't clear. And even if it were, I don't like the look of this."

  "Mr. Baker?"

  "We've litigated this before," Baker said, looking at Vane. "The court dismissed the easement claim last year. The title is valid."

  Alden nodded. "And I concur. The easement is dormant."

  He picked up his pen. "Roll call on Proposition One. Valid title."

  "Alden: Yes."
  "Baker: Yes."
  "Cress: Yes."
  "Dove: No."
  "Eames: No."

  "Three yes, two no," Alden said. "Proposition One carries."

  Vane made a small note in his portfolio.

  "Proposition Two," Alden continued. "The proposed works comply with the town's coastal management plan."

  Cress flipped a page in her binder. The sound was loud in the quiet room. "Section twelve, subsection C," she read, her voice flat. "Structures must not impede natural sediment transport beyond the mean high-water mark. The engineering report says the new wall reflects wave energy rather than absorbing it. It accelerates scour on the neighboring lots."

  "But," Baker interrupted, "they've added the toe berm. That mitigates the scour."

  "The plan says 'no impediment'," Cress said. "The berm is temporary. The wall is permanent."

  Dove leaned forward. "I think the berm satisfies the requirement. The plan allows for mitigation measures. If the engineer signs off, I say it complies."

  Eames shook her head. "It doesn't comply. And the title is bad. I'm voting no."

  Alden looked at his own copy of the plan. "The mitigation is sufficient. It complies."

  "Roll call on Proposition Two. Compliance with management plan."

  "Alden: Yes."
  "Baker: Yes."
  "Cress: No."
  "Dove: Yes."
  "Eames: No."

  "Three yes, two no," Alden said. He paused, marking the sheet. "Proposition Two carries."

  The room seemed to tighten. The math was visible now, hanging in the air between the coffee cups. They had affirmed the title. They had affirmed the compliance.

  "Proposition Three," Alden said. His voice was lower. "The permit shall issue."

  He looked at Cress. "Ms. Cress, you found the title valid, but the plan violated."

  "The plan is violated," she corrected. "So I cannot vote to issue. The rules say I can't vote yes on the permit unless I vote yes on both premises."

  "Understood," Alden said. "Mr. Dove? You found the plan complied, but the title invalid."

  "The title is the foundation," Dove said. "If the land isn't theirs, they can't build. I vote no on the permit."

  "Mrs. Eames?"

  "No on both, so no on the permit," Eames said. She didn't look up.

  "Mr. Baker?"

  "Both premises are satisfied," Baker said. "Permit should issue. Yes."

  Alden looked at his pen. He looked at Vane, who was watching him with a calm, expectant expression. Alden thought of the circuit court, the years he'd spent clerking, the memos that came back red-lined because the logic didn't hold together. He remembered a specific standing order, buried in the appendix of the commission's bylaws, never used. *Reservation of the Losing Premise.*

  "The law entails the conclusion," Alden said quietly. "If One and Two are yes, Three must be yes."

  "But the vote on Three is separate," Baker said. He sounded hopeful.

  "We vote our conscience on the outcome," Eames said. "I don't care about the premises. I care about the wall."

  Alden tapped the gavel again. "Roll call on Proposition Three. Permit shall issue."

  "Alden: Yes."
  "Baker: Yes."
  "Cress: No."
  "Dove: No."
  "Eames: No."

  Alden stared at the tally sheet. Two yes. Three no.

  "Proposition Three fails," Alden said.

  The silence was heavier than the rain. They had voted that the title was valid. They had voted that the plan was complied with. They had voted that the permit was denied.

  Cress closed her binder. "So," she said. "They own the land. They followed the rules. But they can't build."

  "That's the decision," Dove said. He began to gather his papers.

  Vane stood up. He didn't look angry. He walked to the front of the room, stopping just short of the dais. "Chairman Alden," he said. "May I inquire as to the findings to be recorded in the minutes?"

  Alden touched the edge of the bylaws book. "The minutes will reflect the votes."

  "Will they reflect the findings of fact?"

  "The votes are the findings."

  "There is a provision," Alden said. He opened the book to the back, the pages sticking together. "Section Nine, Paragraph Four. Reservation of the Losing Premise."

  Baker frowned. "I've never heard of that."

  "It applies when the collective judgment on the conclusion contradicts the collective judgment on the premises," Alden said. He read from the page, his voice monotone. "In such event, the Commission shall enter the majority conclusion, but must set out in full, as part of its recorded reasons, every premise that a majority of the Commission accepted."

  Cress looked at Alden. "So we write that we denied the permit."

  "Yes."

  "And we write that the title is valid."

  "Yes."

  "And we write that the plan is complied with."

  "Yes."

  Vane smiled. It was a small, tight movement. "So the official record states that I own the foreshore, that my plans are compliant, and that my permit is denied."

  "It states the votes," Alden said.

  "It states the contradictions," Vane said. He tapped his portfolio. "In appellate review, findings of fact regarding title and compliance are binding. If the record says I meet all criteria, the denial is arbitrary. Capricious."

  "It's what the rule requires," Alden said. He felt the weight of the gavel in his hand. It was just wood.

  "The clerk will draft the order," Alden said. "It will list the majority position on Proposition One. It will list the majority position on Proposition Two. It will list the majority position on Proposition Three."

  "And then?" Dove asked.

  "And then we sign it."

  Cress looked at the tally sheet. "It doesn't make sense."

  "It's the record," Alden said.

  He signed the sheet. Baker signed. Cress hesitated, then signed. Dove signed. Eames signed.

  The clerk collected the papers. She looked at the three lines of findings, then at the final order. She didn't say anything. She just put them into a folder.

  Vane waited by the door. The clerk handed him a copy of the minutes. He didn't open it. He tucked it under his arm.

  "Will I get the permit?" Eames asked. Her voice was thin, lost in the room's acoustics.

  Vane's hand was on the doorknob. He looked back at the commission, at the five of them sitting in the dark behind the table, the blown projector looming like a blind eye behind them.

  "You've made your findings," Vane said. "The court will read them."

  He opened the door. The sound of the rain rushed in, loud and immediate. He stepped out into the hallway, closing the door softly behind him.

  Alden looked at the tally sheet. The ink was still wet. The three propositions sat in a row, logical and impossible.

  "Meeting adjourned," Alden said.

  No one moved for a moment. The paper cups sat untouched. The minutes lay in the center of the table, a single document that said yes, yes, and no, all at once. Outside, the tide was coming in, rising against the old wall, waiting to see what the new one would do.
