      *(Self-Correction during drafting)*: Make sure to explicitly answer "Is it one puzzle or several?" It is one structural puzzle applied to different content.
      Make sure to answer "Does it only bite when the rule is absolute?" Yes, primarily. Threshold deontology avoids it.

      *Refining the "Verdict":* "Verdict: The Self-Defeat Objection (or The Paradox of Deontology)."

