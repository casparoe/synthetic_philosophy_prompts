answer: |-
  You have put your finger on one of the oldest and most persistent headaches in moral philosophy. You are right to feel that the standard labels ("absolute rules," "side constraints") describe the shield, not the sword being swung against it.

  There is no single colloquial term that has escaped the academy and entered common parlance, but in philosophical literature, this specific argument pattern is best known as **The Paradox of Deontology**. When framed as an attack rather than a puzzle, it is often called **The Self-Defeat Objection** or the charge of **Rule Worship**.

  For your notes, I recommend **The Self-Defeat Objection**. It captures the core accusation: that the moral rule defeats its own purpose.

  Here is the shape of the thing, stripped of the jargon.

  ### The Shape of the Argument
  This is not a logical paradox (like "this sentence is false"). It is a *teleological* tension. "Teleological" just means "goal-oriented."

  Most rules exist for a reason. The rule "Do not torture" exists because torture is horrific and we want less of it in the world. The Self-Defeat Objection points out that if you follow the rule absolutely, you sometimes end up with *more* of the very thing the rule was designed to reduce.

  The structure looks like this:
  1.  **The Value:** Harm $X$ is terrible (e.g., torture).
  2.  **The Rule:** Never commit Harm $X$.
  3.  **The Scenario:** Committing Harm $X$ once will prevent Harm $X$ from happening many times over.
  4.  **The Objection:** By following the rule, you are prioritizing your own moral cleanliness over the actual reduction of Harm $X$. The rule has become an idol that crushes the value it was supposed to serve.

  ### Is It One Puzzle or Several?
  It is one structural puzzle applied to different content. Whether it is torture, lying, or breaking a promise, the geometry is identical. The critic is pointing out a mismatch between the *rationale* for the rule (minimize this bad thing) and the *application* of the rule (never do this thing, even to minimize it).

  ### Does It Only Bite on Absolute Rules?
  Yes, almost exclusively. This objection loses its teeth against "threshold" rules.

  If a journalist says, "I will never lie," the objection bites hard when lying would save a source's life. But if the journalist says, "I will never lie *unless* a life is at stake," the Self-Defeat Objection dissolves. The rule now bends to serve its own purpose. The paradox only arises when the agent insists the prohibition is **agent-centered** (about *my* action) rather than **outcome-centered** (about the *world's* state).

  ### How It Differs from Nearest Ideas
  You asked how this differs from the nearby concepts you likely already know.

  *   **Vs. Utilitarianism:** Utilitarianism is the *solution* the objector is pushing for. Utilitarianism says, "Minimize the total harm." The Self-Defeat Objection is the *weapon* used to force a deontologist toward utilitarianism.
  *   **Vs. Side Constraints:** "Side constraints" is the philosopher's name for the absolute rules themselves (e.g., "Rights are side constraints"). The Self-Defeat Objection is the argument that side constraints are irrational.
  *   **Vs. The Problem of Dirty Hands:** "Dirty Hands" describes the tragedy of having to do something wrong to achieve a great good. The Self-Defeat Objection is different; it accuses the agent of *refusing* to get their hands dirty when they should. One is about the guilt of acting; the other is about the arrogance of refusing to act.

  ### Cases Inside and Outside
  To use this label accurately, you need to know when it applies and when it doesn't.

  **Inside the Pattern (The Self-Defeat Objection applies):**
  *   **The Ticking Torturer:** Refusing to torture one terrorist to find bombs that will torture fifty civilians. (Same harm: torture vs. torture).
  *   **The Protective Lie:** Refusing to lie to a murderer at the door about where their victim is hiding. (Same harm: deception/murder vs. deception/murder).
  *   **AI Safety:** An AI programmed to "never deceive a user" refuses to lie to a suicidal user about how to access a dangerous method, even if the lie would delay them long enough for help to arrive.

  **Outside the Pattern (The Self-Defeat Objection does not apply):**
  *   **The Trolley Problem (Standard):** Killing one to save five from *death*. (This is a trade-off of lives, but often framed as doing vs. allowing. It is close, but the Self-Defeat Objection is strongest when the *method* is the same as the *harm prevented*.)
  *   **Stealing to Feed:** Stealing bread to stop a child from *starving*. (The rule is against theft; the harm prevented is starvation. The rule against theft isn't trying to prevent starvation directly, so it isn't self-defeating in the same way.)
  *   **Rules with Exceptions:** A lawyer who says, "I cannot break confidentiality, unless my client is about to commit a future violent crime." Because there is an exception clause, the rule is not defeating its own purpose.

  ### A Note for Your Writing
  When you write about this, be aware that ethical philosophers have answers to this objection. They argue that morality isn't just about cleaning up the world; it's about the integrity of the agent. They would say your "fire code" analogy is flawed. A better analogy might be a referee: A referee cannot score a goal themselves to stop the other team from scoring fifty. Their role isn't to manage the score; it's to uphold the game.

  However, for the purpose of naming the *argument pattern you are hearing*, the label holds.

  Verdict: The Self-Defeat Objection (also known academically as The Paradox of Deontology).
