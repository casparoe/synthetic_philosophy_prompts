          *   *Deep:* The nature of the hazard rate. Analyst 1 assumes a static risk profile (or ignores the history); Analyst 2 assumes the history *changes* the risk profile (aging improves survival).
          *   *Missing from Register:* The register records *outcomes*, not *mechanisms*. It doesn't tell us *why* the hazard declines (robustness vs. luck).

      *   **2. Empirical vs. Conceptual:**
          *   Is it settleable by data? No. More data just gives more of the same distribution.
          *   World Difficulty: Is political survival a memoryless process (like radioactive decay) or a learning process (like building immunity)?
          *   Partition Difficulty: The definition of "closure." If we define closure loosely, durations shorten. If strictly, they lengthen. The register assumes "closure" is a discrete, observable event, but political decay is often continuous.

      *   **3. Reference Class & Individuation:**
          *   The Entry/Exit Rule assumes political orders are discrete entities with birth and death dates.
          *   Problem: Continuity. Is the current order the same as the one 50 years ago after a constitutional crisis?
          *   Effect on Base Rate: If we split one long duration into two short ones (reconstitution counts as exit), the median drops. If we merge them, it rises. The rule *creates* the distribution it claims to measure.

      *   **4. Open Episodes (Censoring):**
          *   The 31 open episodes are right-censored. We know they survived *at least* to their current age.
          *   Selection Effect: The set of orders standing today is not a random sample of history. It is the set of *survivors*. Using them as a baseline without adjusting for survival bias is wrong.
          *   Exchangeability: Analyst 1 assumes the 300-year-old is exchangeable with the 140-year median (ignoring it already survived 300). Analyst 2 assumes it is exchangeable with the *survivors* of 300 years.
