      *   **6. Conditions for Well-Posed Outside View:**
          *   Requirement: Exchangeability. The future must be like the past. The mechanism of death must be stable.
          *   If not met: The method describes the *past distribution of failures*, not the *future probability of survival*.
          *   Honest Residue: It tells you the cost of being wrong, not the likelihood of being wrong. It bounds the plausible, it doesn't pinpoint the probable.
