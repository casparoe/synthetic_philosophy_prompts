answer: |-
  # Axiomatic Bargaining: A Decision Tree for Solution Concepts

  **Setup:** Two players ($i=1,2$), feasible set of utilities $S \subset \mathbb{R}^2$ (convex, compact, comprehensive), disagreement point $d \in S$.

  ```text
  START: Basic Bargaining Problem (S, d)
  │
  ├── Q1: SCALE INVARIANCE (INV)
  │   "Are utility scales arbitrary (cardinal, non-comparable), 
  │    or do they admit interpersonal comparison?"
  │
  ├── [YES: Scales are arbitrary / INV holds] ──────────────────────────────┐
  │   (Utilities are unique only up to positive affine transformation)     │
  │                                                                        │
  │   ├── Q2: INDEPENDENCE OF IRRELEVANT ALTERNATIVES (IIA)                │
  │   │   "If the feasible set shrinks but the chosen point remains        │
  │   │    feasible, must the solution remain unchanged?"                  │
  │   │                                                                    │
  │   │   ├── [YES: IIA holds] ─────────────────────────┐                  │
  │   │   │                                             │                  │
  │   │   │   LEAF: NASH BARGAINING SOLUTION            │                  │
  │   │   │   "Awkward Commitment: Commits you to IIA, implying the        │
  │   │   │   solution is insensitive to the removal of 'irrelevant'       │
  │   │   │   options that could have altered the bargaining power."       │
  │   │   │                                             │                  │
  │   │   └── [NO: IIA fails] ──────────────────────────┤                  │
  │   │                                                 │                  │
  │   │   ├── Q3: DEPENDENCE ON CLAIMS (IDEAL POINTS)   │                  │
  │   │   │   "Does the solution depend on the players' maximum            │
  │   │   │   feasible utilities (their 'claims' or ideal point)?"        │
  │   │   │                                            │                  │
  │   │   │   └── [YES: Depends on Claims] ────────────┤                  │
  │   │   │                                            │                  │
  │   │   │   LEAF: KALAI-SMORODINSKY (KS)             │                  │
  │   │   │   "Awkward Commitment: Commits you to Individual              │
  │   │   │   Monotonicity, making the solution sensitive to the          │
  │   │   │   'ideal point' even if it lies far outside the feasible set."│
  │   │   │                                            │                  │
  │   │   └─────────────────────────────────────────────┘                  │
  │                                                                        │
  └── [NO: Scales are comparable / INV fails] ─────────────────────────────┘
      (Utilities allow interpersonal comparison; Translation Invariance)
      
      ├── Q4: STATUS OF THE DISAGREEMENT POINT (d)
      │   "Is the disagreement point a fixed *threat* (determines baseline) 
      │    or a negotiable *status quo* (determines security floor)?"
      │
      ├── [FIXED THREAT: Focus on Gains from d] ───────────────────────────┐
      │                                                                    │
      │   ├── Q5: AGGREGATION PRINCIPLE                                   │
      │   │   "How do we trade off one player's gain against the other's?" │
      │   │                                                                │
      │   │   ├── [SUBSTITUTABLE: Maximize Sum of Gains] ────────────────┐ │
      │   │   │                                                          │ │
      │   │   │   LEAF: UTILITARIAN SOLUTION                             │ │
      │   │   │   "Awkward Commitment: Commits you to full interpersonal  │ │
      │   │   │   comparability, implying distribution doesn't matter if  │ │
      │   │   │   the total surplus is maximized (indifferent to equity)."│ │
      │   │   │                                                          │ │
      │   │   └── [COMPLEMENTARY: Maximize Minimum Gain] ────────────────┤ │
      │   │                                                              │ │
      │   │   LEAF: EGALITARIAN SOLUTION (Kalai)                         │ │
      │   │   "Awkward Commitment: Commits you to equalizing gains,       │ │
      │   │   potentially leaving total surplus on the table to maintain  │ │
      │   │   equity if the Pareto frontier is non-linear."               │ │
      │   │                                                              │ │
      │   └────────────────────────────────────────────────────────────────┘ │
      │                                                                      │
      └── [NEGOTIABLE STATUS QUO: Focus on Utility Levels] ──────────────────┘
      
          LEAF: MAXIMIN / CAUTIOUS SOLUTION (Rawlsian)
          "Awkward Commitment: Commits you to ignoring the welfare of the 
          better-off party entirely once the minimum utility level is secured."
  ```

  ### ⚠️ Flagged Indistinctions
  *   **Egalitarian vs. Maximin:** In the standard symmetric model with $d=0$, the Egalitarian solution (equal gains) and the Maximin solution (maximize minimum utility) coincide. I have separated them in the tree based on the *interpretation* of $d$ (baseline for gains vs. security floor). If $d \neq 0$, these diverge, but many texts use the terms interchangeably for the "Equal Gain" solution.
  *   **KS vs. Claims:** The "Dependence on Claims" node is a proxy for **Individual Monotonicity**. KS satisfies IM (sensitive to ideal points); Nash does not.

  ### 📝 Note on Uncertainty & Redrawing
  I am least sure about the **branch separating Egalitarian and Maximin** (Q4/Q5 split). 

  **Why:** In the canonical axiomatic literature (e.g., Thomson, 2010), the "Egalitarian Solution" is defined as the solution that equalizes utility *gains*. The "Maximin" criterion is often the *justification* for the Egalitarian solution, not a distinct solution concept. By splitting them based on "Gains vs. Levels," I risk creating a distinction that is merely semantic in the standard convex, symmetric case. 

  **What would make me redraw it:** If I wanted to strictly adhere to the standard taxonomy, I would collapse Egalitarian and Maximin into a single leaf and replace the fifth solution with the **Perles-Maschler Solution** (which satisfies Super-Additivity) or the **Raiffa Solution** (which satisfies a step-by-step monotonicity). This would allow for a cleaner axiomatic separation based on **Decomposability** or **Risk Sensitivity** rather than the ambiguous status of the disagreement point.
