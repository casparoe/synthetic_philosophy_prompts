answer: |-
  Here is the breakdown of the argument, the answers to your three specific questions, and the application to your plot.

  ### 1. Plain Paraphrase
  *Here is the text you provided, rendered into plain modern English, sentence by sentence.*

  > "THAT the rule of morality, which enjoins the performance of promises, is not natural, will sufficiently appear from these two propositions, which I proceed to prove, viz. that a promise wou'd not be intelligible, before human conventions had establish'd it; and that even if it were intelligible, it wou'd not be attended with any moral obligation."

  **Paraphrase:** I am going to prove that keeping promises is not a natural instinct. I will show this in two steps: first, that the very idea of a "promise" makes no sense without social agreements; and second, that even if we could understand the idea, it wouldn't naturally force us to feel obliged to do it.

  > "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation."

  **Paraphrase:** When you promise, you aren't just resolving to do something; merely resolving to do something doesn't create a duty.

  > "Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd."

  **Paraphrase:** It isn't a desire to do the thing, either; because we often promise things we hate doing or don't want to do.

  > "Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions."

  **Paraphrase:** It isn't an act of will, because will only works on what you do *now*, but promises are always about the *future*.

  > "All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say it is lie under an obligation to perform it."

  **Paraphrase:** Morality is based on feelings. If an action makes us feel a specific kind of approval, we call it good. If failing to do it makes us feel a specific kind of disapproval, we call it a duty.

  > "A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise."

  **Paraphrase:** To create a new duty, you have to create a new feeling of approval or disapproval.

  > "But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities."

  **Paraphrase:** But we cannot change our feelings just by wanting to. We can't snap our fingers (or make a promise) and suddenly make an action feel good or bad if it didn't before. That is as impossible as changing the orbit of a planet.

  > "It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity."

  **Paraphrase:** So, it is ridiculous to think we can create a duty just by willing it, because that would mean creating a feeling out of nothing. Nature doesn't work that way.

  > "Now 'tis evident we have no motive leading us to the performance of promises, distinct from a sense of duty."

  **Paraphrase:** Furthermore, look at why we keep promises. We don't have any natural instinct to do it. The only reason we do it is because we think it's our duty.

  > "If we thought, that promises had no moral obligation, we never shou'd feel any inclination to observe them."

  **Paraphrase:** If we didn't believe we *ought* to keep them, we wouldn't want to.

  > "But as there is naturally no inclination to observe promises, distinct from a sense of their obligation; it follows, that fidelity is no natural virtue, and that promises have no force, antecedent to human conventions."

  **Paraphrase:** Since there is no natural desire to keep promises other than the sense of duty itself, honesty isn't a natural virtue. Promises have no power before humans invent the system of promising.

  > "If any one dissent from this, he must give a regular proof of these two propositions, viz. that there is a peculiar act of the mind, annext to promises; and that consequent to this act of the mind, there arises an inclination to perform, distinct from a sense of duty."

  **Paraphrase:** If you disagree with me, you must prove two things: first, that there is a special mental act involved in promising; and second, that this act creates a desire to act that is separate from just feeling dutiful.

  > "I presume, that it is impossible to prove either of these two points; and therefore I venture to conclude, that promises are human inventions, founded on the necessities and interests of society."

  **Paraphrase:** I bet you can't prove either of those things. So, I conclude that promising is a human invention created because society needs it to survive.

  ***

  ### 2. The Argument Reconstructed

  **Hidden Premise (The Engine):** Hume is a **Sentimentalist**. He believes morality is not a fact about the world, but a feeling (sentiment) in the observer. If you cannot point to a natural feeling that causes the action, there is no natural morality.

  **The Argument:**
  1.  **Premise 1:** For a duty to be "natural," there must be a natural motive (instinct, desire, or passion) that drives us to perform it, distinct from the thought that it is our duty.
  2.  **Premise 2:** There is no natural motive to keep promises (we do not instinctively desire to do what we said we would do).
  3.  **Premise 3:** The only motive to keep a promise is the "sense of duty" (the belief that one ought to do it).
  4.  **Premise 4:** A "sense of duty" regarding promises cannot exist before the concept of a promise exists (you can't feel obliged to do X if X is unintelligible).
  5.  **Premise 5:** The concept of a promise requires a human convention (language/rules), because no mere mental act (resolution, desire, or will) can magically create an obligation where none existed before.
  6.  **Conclusion:** Therefore, the obligation to keep promises is not natural; it is an artificial human invention founded on social interest.

  ***

  ### 3. Addressing Your Three Confusions

  #### I. The Two Halves: Unintelligible vs. No Obligation
  You asked if these are independent and which carries the weight.
  *   **The Relationship:** They are a "one-two punch." The first claim (unintelligible) is semantic; the second (no obligation) is psychological.
  *   **The Weight:** The second claim carries the philosophical weight. Hume knows someone might argue, "Okay, maybe the *words* are invented, but the *binding force* is God-given or Natural Law." Hume blocks this by arguing that even if we understand the words, there is no *mental mechanism* (no sentiment) that naturally attaches to them.
  *   **Why both?** If promises were natural, they would be like hunger. You don't need a convention to feel hunger. Hume is saying: "You don't feel 'promise-hunger.' You have to learn the game before you can feel the stakes."

  #### II. Is the Argument Fair? (The "Natural" Trap)
  You asked if Hume wins by shifting meanings.
  *   **The Shift:** Yes, effectively. Hume defines "natural" as "antecedent to social convention." A defender of Natural Law defines "natural" as "in accordance with Reason or Divine Order."
  *   **Where the Defender Plants His Foot:** A defender (like your Advocate might, if he were arguing *against* Hume) would plant his foot on **Conscience**. He would argue: "The feeling of guilt when breaking a promise *is* the natural sentiment."
  *   **Hume's Counter:** Hume anticipates this. He says that guilt is a *learned* sentiment. We feel guilt because we were taught that breaking promises hurts society. A child or a "savage" (in 1740s terms) would not feel guilt over a broken promise unless taught that it violates a convention.
  *   **Fairness:** It is a rigorous argument *if* you accept Hume's definition of morality as sentiment. If you believe morality is rational truth (like math), Hume's argument fails. But in the 1740s Edinburgh context, Hume is challenging the Rationalists.

  #### III. The Positive Story (The Mechanism)
  You asked how an artificial practice acquires moral sentiment. This is not in the excerpt but is essential for your scene.
  *   **The Mechanism:**
      1.  **Interest:** Humans realize that stability of property and reliance on others is useful.
      2.  **Convention:** We slowly develop a signal (words like "I promise") that triggers expectation in others.
      3.  **Sympathy:** Through "sympathy" (Hume's term for empathy/social connection), we feel pleasure when society functions well and pain when it fractures.
      4.  **Moralization:** Over time, this feeling of "public utility" hardens into a moral sentiment. We stop calculating the utility of *each* promise. Instead, we feel a visceral pain (guilt/shame) at the *breach of the rule itself*.
  *   **True or False?** For Hume, promise-claims are not "true" or "false" in a factual sense. They are "virtuous" or "vicious." A promise is a move in a game. Breaking it is a foul. The "truth" is whether the move was made according to the rules; the "obligation" is the pain we feel when a foul occurs.
  *   **Generalization:** Crucially, the sentiment attaches to the **general rule**, not the **specific instance**. We feel bad breaking a promise even if *this specific promise* does no harm, because we know that making exceptions destroys the system.

  ***

  ### 4. Application to Your Plot (The Locked Room)

  Here is how Hume's logic applies to your widow, the advocate, and the dead man's promise.

  **The Scenario:** A promise is made in secret. The promiser dies. The promise benefits no living person. No one can verify the breach.
  **The Question:** Is it binding?

  **1. Does the promise bind the living promiser (before he dies)?**
  *   **Humean Answer:** Yes, but not because the dead man has a right. It binds because the *promiser* has internalized the convention of fidelity.
  *   **The Mechanism:** The promiser feels the sentiment of obligation. If he breaks it, he damages his own character as a faithful agent. Even if no one sees, *he* knows he has violated the general rule.
  *   **The "Spirit" Variant:** If the promiser believes the spirit is watching, Hume would view this as a superstition that *mimics* the social sanction. It creates a sentiment (fear/shame). For Hume, the source of the sentiment (society vs. spirit) matters less than the fact that the sentiment exists to enforce the convention.

  **2. Does the promise bind the Widow (to enforce it/act on it)?**
  *   **Humean Answer:** No. This is the critical point for your scene.
  *   **Reasoning:** Promises are founded on the "necessities and interests of society." A promise to a dead man, where performance benefits no one and breach hurts no one, has **zero social utility**.
  *   **The Conflict:** The Widow treats the Ledger as the Convention. She believes the *record* creates the obligation. The Advocate (channeling Hume) would argue that a convention without social interest is a empty shell.
  *   **Auditability:** Hume does **not** distinguish between audited and unaudited promises regarding *moral* obligation. The obligation is internal (sentiment). However, he *does* distinguish them regarding *justice*. Justice is an artificial virtue designed to keep peace. If a promise cannot be audited, it cannot be part of the system of Justice, because Justice requires public rules.
  *   **The Verdict:** On a strict Humean account, the promise is **morally binding on the conscience of the promiser** (due to the general rule of fidelity) but **void in terms of social justice** (because it serves no interest).
  *   **The Widow's Dilemma:** If she enforces a promise that benefits no one, she is prioritizing the *symbol* (the Ledger) over the *substance* (Social Utility). Hume would say she is engaging in "rule worship." She is following the letter of the convention while violating its spirit (utility).

  **3. Can the account mark the distinction she cares about? (Audited vs. Un-auditable)**
  *   **Defect in the Theory:** Hume's theory struggles here. He wants morality to be internal (sentiment) but also useful (social). A purely secret promise is useful for the *promiser's character* but useless for *society*.
  *   **Defect in Her:** Your protagonist is treating the Ledger as a sacred object. Hume would say the Ledger is merely a tool for utility. If the tool no longer serves utility (because the beneficiary is dead), the tool should be set aside.
  *   **Dramatic Angle:** The Advocate should argue: "The obligation exists only to keep society functioning. This promise functions for no one. To enforce it is superstition, not morality." The Widow should argue: "The obligation exists to keep *me* faithful. If I make exceptions for the dead, I weaken my fidelity to the living."

  ### 5. Standard Objection (The "Rule Worship" Problem)
  You asked for a standard objection and whether it lands.

  *   **The Objection:** If promises are binding only because of social utility, why am I obliged to keep a promise in a specific case where breaking it would cause *no* harm and keeping it causes *pain*? (e.g., returning a weapon to a madman, or your case: performing a rite for a dead man).
  *   **Does it land?** Yes, this is the famous "Exception Problem."
  *   **Hume's Response (The Bullet Bite):** Hume cheerfully bites the bullet. He argues we *must* follow the general rule even in specific cases where it seems useless. Why? Because if we allow ourselves to make exceptions whenever *we* think utility is low, we will become biased judges in our own favor, and the whole system of trust will collapse.
  *   **For Your Scene:** This gives the Widow a strong Humean defense. She can say: "I cannot judge if this promise is useless. If I start judging which promises count, the Ledger loses its authority. I must keep the rule to save the system." The Advocate's counter is that the system *already* failed (the man is dead), so the rule no longer applies.

  ### Summary for the Scene
  *   **The Advocate's Humean Line:** "A promise is a tool for social trade. The man is dead. The trade is closed. To insist on the promise is to worship the tool and forget the work it was meant to do."
  *   **The Widow's Counter-Line:** "The tool is fidelity itself. If I put the tool down because the work seems done, I will not be able to pick it up when the work returns. The Ledger binds me, not him."
  *   **The Humean Truth:** The obligation is real only insofar as it sustains a sentiment of trust in the living. If the Ledger sustains *her* trustworthiness in the eyes of her living subscribers, it binds. If it is a secret drawer no one knows, it is a private superstition.
