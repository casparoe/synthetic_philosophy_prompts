answer: |-
  | Requirement | The Case or Fact That Forces It | Non-Negotiable, or Just One Camp's Preference? | Which of the Usual Accounts It Rules Out |
  | :--- | :--- | :--- | :--- |
  | **1. Löwenheim–Skolem Validity** | If ZFC is consistent, it has a countable model $\mathcal{M}$. | **Non-Negotiable.** This is a proven theorem of first-order logic. | **Naive Realism:** The view that any model of ZFC is isomorphic to the "true" universe $V$. |
  | **2. Quantifier Scope Restriction** | Inside $\mathcal{M}$, "$\forall x$" means "for all $x \in \text{domain}(\mathcal{M})$". | **Non-Negotiable.** This is the definition of Tarskian semantics for first-order logic. | **Equivocation Errors:** Accounts that claim the symbol $\forall$ ranges over "all sets" absolutely inside the model. |
  | **3. $\Sigma_1$ Absoluteness Asymmetry** | "x is countable" is $\Sigma_1$ ($\exists f: \omega \to x$). If $\mathcal{M} \models \text{Countable}(x)$, then $V \models \text{Countable}(x)$. The converse fails. | **Non-Negotiable.** This is the technical mechanism preventing contradiction. | **Symmetric Absolutism:** Any reading claiming "uncountable" means the same thing inside and outside $\mathcal{M}$. |
  | **4. External Bijection Existence** | There exists a bijection $f: \omega \to a$ in the metatheory $V$, but $f \notin \mathcal{M}$. | **Non-Negotiable.** Required to reconcile $\mathcal{M}$ being countable (externally) with $a$ being uncountable (internally). | **Internalism:** The claim that everything relevant to set existence must be constructible *within* the model. |
  | **5. Second-Order Divergence** | In Second-Order ZFC (ZFC$_2$), LS fails; models are categorical (unique up to isomorphism). | **Non-Negotiable.** ZFC$_2$ lacks completeness/compactness, blocking the LS construction. | **Logic Monism:** The claim that first-order logic is the *only* way to formalize set theory without loss of intended meaning. |
  | **6. Metatheoretic Standpoint** | We assert "$\mathcal{M}$ is countable" from outside $\mathcal{M}$. $\mathcal{M}$ cannot assert this about itself. | **Non-Negotiable.** A model cannot contain its own bijection to $\omega$ if it satisfies "I am uncountable." | **Self-Containment:** Views suggesting the universe can fully formalize its own cardinality properties without extension. |
  | **7. Semantic Underdetermination** | The axioms of ZFC do not fix the extension of "all subsets." | **Preference.** Required for Skeptical/Relativist readings; Deflationists treat this as a linguistic limit instead. | **None.** Both Deflationary (language limit) and Skeptical (ontological indeterminacy) readings survive this. |

  The pair of requirements in maximal tension: **Löwenheim–Skolem Validity** (1st-order logic properties) vs. **Second-Order Divergence** (the desire for a categorical, unique universe).
  The single requirement that eliminates the most accounts: **$\Sigma_1$ Absoluteness Asymmetry** (it immediately disqualifies any interpretation that treats "countable" as an absolute property in first-order logic).
