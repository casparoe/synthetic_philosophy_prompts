      *   *Better Fix:* Social Pressure. The "Enhancements" are public. If you don't take one, you look disengaged.
      *   *Best Fix:* **The "Need" Mechanic.**
          *   You start with 0 Needs.
          *   Accepting a Reward gives you +1 Need.
          *   Final Score = (Starting Stability) - (Total Needs).
          *   *But why would they accept?* Because the Rewards are *immediate* and the Cost is *abstract*.
