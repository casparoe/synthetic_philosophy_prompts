          *   *Loser (who had fun):* Lowest Peace Budget.
          *   *Debrief:* This maps to "Craving creates vulnerability to suffering."

  5.  **Refining the Mechanics for 90 Minutes:**
      *   Need to ensure the "Fun" people actually have fun. The rewards need to be tangible.
      *   Need to ensure the "Tranquil" people don't feel cheated.
      *   Need to handle the "This feels bad vs. Doesn't matter" distinction.
      *   *Materials:* Player Sheets, Condition Cards, Reward Tokens, "Reality" Deck.
      *   *Timeline:* Intro (10), Game Rounds (40), Scoring/Reveal (15), Debrief (25).

  6.  **Addressing the "Bug" Concern:**
      *   If someone has fun and loses, participants might say "But they had fun! Why does that count as losing?"
      *   *Answer:* Because the game measures *resilience*, not *intensity*. Tranquilism argues resilience (absence of suffering) is the only intrinsic good. The debrief must hammer this home.
