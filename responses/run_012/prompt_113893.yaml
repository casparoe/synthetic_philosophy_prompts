answer: |-
  You have hit on a very common and understandable point of confusion. You are right that interventionism is a *species* of counterfactual theory. In fact, James Woodward (the primary architect of modern interventionism) explicitly calls his view a "manipulationist counterfactual theory."

  However, they are treated as rivals because they disagree fundamentally on **the semantics of the counterfactuals.** They disagree on *how* you determine whether the statement "If X had been different, Y would have been different" is true or false.

  Here is the breakdown of why they are distinct, why the "bookkeeping" matters, and why interventionism claims to solve the headaches that plague standard counterfactual theories.

  ### 1. The Semantics: Worlds vs. Equations
  The biggest difference lies in how the counterfactual is evaluated.

  **The Lewisian Counterfactual Theory (The Standard View)**
  David Lewis analyzed causation using possible worlds semantics. To test "If X had not occurred, Y would not have occurred," you look at the **closest possible world** where X does not occur.
  *   **The Problem:** "Closeness" is vague. It relies on a weighting of similarities (laws of nature vs. particular facts).
  *   **The Headache:** In preemption cases (Assassin A shoots, Assassin B is ready to shoot if A fails), the "closest world" where A doesn't shoot is often one where B *does* shoot. In that world, Y (the death) still happens. Therefore, Y does not counterfactually depend on X. Lewis has to jump through complex hoops (steps of dependence) to save the theory.

  **The Interventionist Theory (Woodward/Pearl)**
  Interventionists do not use possible worlds similarity. They use **Structural Equation Models (SEMs)**.
  *   To test if $X$ causes $Y$, you don't imagine a "close world." You imagine surgically replacing the equation for $X$ with a new value ($X = x'$), while **holding the structural equations for all other variables fixed.**
  *   **The Crucial Move:** This is not just "bookkeeping." It is a constraint on truth conditions. In Lewis's view, if you change $X$, you might have to change the past or the laws to make it consistent. In Interventionism, the "intervention" breaks the link between $X$ and its parents. It isolates the specific causal path.

  ### 2. Why Interventionism Claims to Solve Preemption
  You mentioned that interventionism should inherit the headaches of preemption and overdetermination. The interventionist argument is that their specific definition of "intervention" dissolves these problems.

  **Case: Early Preemption**
  *   *Scenario:* Assassin A shoots and kills the victim. Assassin B would have shot if A hadn't, but since A did, B didn't.
  *   *Lewis:* In the closest world where A doesn't shoot, B shoots. Victim dies. No counterfactual dependence. Causation fails.
  *   *Interventionist:* We model this with equations. There is a variable for A's shot, B's shot, and Death.
      *   To test A's causation, we **intervene** on A.
      *   Crucially, an intervention on A *breaks* the connection between A's decision and B's decision (because B is reacting to A).
      *   When we intervene to set A = "No Shot," we do not automatically trigger B = "Shot" unless the model specifies B is caused by the *intervention* (which it isn't; B reacts to A's natural action).
      *   More importantly, interventionism allows for **path-specific dependence**. We can ask: "Is there a path from A to Death along which influence flows?" Yes. We don't need the outcome to change in *every* counterfactual scenario, only that the specific mechanism is active.

  **Case: Overdetermination**
  *   *Scenario:* Two rocks (X and Z) hit a window (Y) simultaneously. Either is sufficient to break it.
  *   *Lewis:* If X hadn't happened, Z still would have. Y still happens. X is not a cause. (Lewis famously struggled here, sometimes accepting "quasi-dependence").
  *   *Interventionist:* We use the "holding fixed" clause of the intervention.
      *   We intervene on X (prevent Rock 1).
      *   We **hold Z fixed** at its actual value (Rock 2 still hits).
      *   Result: Window does not break.
      *   Therefore, Y counterfactually depends on X *relative to the fixed background of Z*.
      *   Lewisian semantics generally resist "holding independent causes fixed" in the same way without violating laws of nature or similarity metrics. Interventionism builds this modularity into the definition of the test.

  ### 3. Metaphysics vs. Methodology
  This is the deeper philosophical reason they are rivals.

  **Lewis is a Reductionist:**
  He wants to know what causation *is*. He believes causal facts reduce to non-causal facts (patterns of events + laws + counterfactuals). He is doing metaphysics. He wants the truth conditions to be objective features of the universe.

  **Woodward is a Pragmatist/Explanatory Realist:**
  He is less interested in what causation "is" in a fundamental metaphysical sense and more interested in **what causal claims do**.
  *   For Woodward, $X$ causes $Y$ means that the relationship is **invariant under intervention**.
  *   This ties causation to *explanation* and *manipulation*.
  *   He argues that Lewis's possible worlds are obscure. We don't have access to "closest worlds." We *do* have access to experimental manipulations (or thought experiments about them).
  *   Therefore, Interventionism treats causation as a feature of how we model the world for the purpose of control and explanation, not necessarily a fundamental glue of the universe.

  ### 4. Summary: What you were missing
  You thought: *Intervention = Making X different while holding everything else fixed.*
  You thought: *Counterfactual = Making X different while holding everything else fixed.*

  The distinction is:
  1.  **How** do you hold everything else fixed?
      *   **Lewis:** By finding a world that is maximally similar to ours. (This often fails to hold "backup causes" fixed in the way we want).
      *   **Interventionist:** By mathematically severing the causal arrows pointing into X in a structural model. (This successfully isolates X).
  2.  **What is the goal?**
      *   **Lewis:** To define the metaphysical essence of causation.
      *   **Interventionist:** To define the conditions under which causal claims are useful for explanation and manipulation.

  So, while Interventionism *uses* counterfactual language, it rejects the **Lewisian semantics** that define the standard "Counterfactual Theory of Causation." That is why they are rivals: one says the truth of causal claims depends on similarity of worlds, the other says it depends on the modularity of structural equations.

  Interventionism is essentially an upgrade to counterfactual theory designed specifically to fix the bugs (preemption/overdetermination) you noticed, by changing the underlying logic of how the counterfactuals are computed.
