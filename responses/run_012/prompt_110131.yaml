      *   *Caution:* Don't dismiss the Paraconsistent reading entirely; Graham Priest is a heavyweight. But note that even Priest admits Nagarjuna isn't just doing FDE.
      *   *Key Insight:* Belnap's logic is *truth-functional*. Nagarjuna's tetralemma is often *predicative* or *ontological*. When Nagarjuna says "Neither," he doesn't mean "I don't know." He means "The question is ill-formed." This is the Wittgensteinian angle.
