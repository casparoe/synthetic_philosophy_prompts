      *   **Observation:** Noticed a structural similarity between the tetralemma (True, False, Both, Neither) and Belnap's Four-Valued Logic (True, False, Both, Neither).
      *   **Core Question:** How far does the analogy go? Where does it break down?
      *   **Underlying Tension:** Two competing interpretations of Nagarjuna:
          1.  *Proto-Paraconsistent Logician:* Revising logic, accepting LEM/LNC violations, "emptiness" as a semantic remainder.
          2.  *Therapeutic/Pragmatic:* Exhausting views to induce silence/praxis, not a semantic system.
