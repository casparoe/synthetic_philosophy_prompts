      *   **Belnap's Logic:** Explain *why* it has four values. It's epistemic/informational. $b$ = conflict in data. $n$ = lack of data. It preserves classical logic's utility in messy environments. It's *about* information states.
      *   **Nagarjuna's Tetralemma:** Explain the context. It's ontological/soteriological. It's about *svabhava* (intrinsic nature).
      *   **Reading 1 (Logician/Paraconsistent):**
