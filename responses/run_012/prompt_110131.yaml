      *   *Belnap's Logic (FDE):* First Degree Entailment. Values: $t$ (true only), $f$ (false only), $b$ (both true and false), $n$ (neither true nor false). Designed for database management with inconsistent/missing info.
      *   *The "Proto-Paraconsistent" Reading:* Associated with scholars like Jay Garfield, Graham Priest (dialetheism). They argue Nagarjuna accepts true contradictions regarding emptiness.
      *   *The "Therapeutic" Reading:* Associated with traditional Prasangika interpretations (Candrakirti) and some Western philosophers (e.g., Huntington, certain Wittgensteinian readings). The lemma is a ladder to be kicked away.
