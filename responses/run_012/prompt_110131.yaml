      *   *Recommendation:* I should advise the user that the Therapeutic reading is more faithful to the *goal* of the text, but the Paraconsistent reading is more faithful to the *literal argumentation*. However, regarding Belnap specifically: it's a false friend for the Therapeutic reading, but a useful formal tool for the Paraconsistent reading *if* modified. Actually, the strongest point is that Belnap is *epistemic* and Nagarjuna is *ontological/semantic*.

