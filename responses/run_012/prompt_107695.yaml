      *   **The Solution:** The maximal point in $S$ lying on the line segment $[d, a]$.
      *   **Key Property:** Monotonicity. If the feasible set expands in a way that increases a player's ideal point (without changing the other's), that player's payoff should not decrease. Also, the ratio of gains $(x_1 - d_1) / (x_2 - d_2)$ equals $(a_1 - d_1) / (a_2 - d_2)$.
      *   **Contrast with Nash:** Nash maximizes the product of gains $(x_1 - d_1)(x_2 - d_2)$. Nash satisfies IIA (Independence of Irrelevant Alternatives). KS violates IIA. If you remove options from $S$ that weren't chosen but defined the *ideal point*, the KS solution changes. Nash stays the same if the chosen point is still feasible.

