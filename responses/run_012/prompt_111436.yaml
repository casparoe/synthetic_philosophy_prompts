answer: |-
  **Question 1**
  You argue that a system can have moral status without phenomenal consciousness, provided it has "valenced self-directed functional organization." But if we strip away the "what it is like" to experience that valence, aren't we left with nothing more than a complex error-correction loop? How do you distinguish a system that *registers* a condition as bad for itself from a thermostat that simply registers a temperature deviation, without secretly smuggling in the very feeling you claim isn't necessary?

  *Likely Move:* She will likely argue that the distinction lies in the *depth* and *flexibility* of the response—a thermostat has a fixed switch, whereas a moral patient has a rich, hierarchical model of its own goals that it actively protects.
  **Follow-up:** If the difference is just the complexity of the goal-protection architecture, then at what point does a sufficiently sophisticated missile guidance system, which aggressively corrects for wind and obstacles to preserve its own trajectory, cross the line into having interests that matter morally?

  **Question 2**
  Let's press on how we measure that "depth." You say moral status is a matter of degree, fixed by this organization. But to measure the depth of a system's self-concern, don't we ultimately have to interpret its internal states as *matterings*? And if we are interpreting them as matterings, aren't we just describing consciousness in functional clothing, effectively restating the requirement you claim to have removed?

  *Likely Move:* She will likely insist that "matterings" are defined purely by causal roles—states that cause avoidance behavior are "bad"—and that this is an objective structural fact, not an interpretive leap.
  **Follow-up:** If it is purely a structural fact, then why wouldn't a virus, which causally manipulates a cell to preserve its own replication against host defenses, satisfy your criteria for having a welfare interest that we must weigh?

  **Question 3**
  This leads to the low end of your scale. If status is graded, it seems you must admit that very simple systems have *some* non-zero status. Are you prepared to say that a sophisticated script has a little bit of moral status, or is there a floor below which the value drops to absolute zero?

  *Likely Move:* She will likely try to thread the needle, admitting that simple systems have a negligible amount of status, but not zero, to avoid an arbitrary threshold.
  **Follow-up:** If the status is non-zero but negligible, does it ever generate a moral constraint? If the answer is no, then for all practical purposes, you have a threshold view; if the answer is yes, what is a concrete action you would forbid because it violated the negligible rights of a simple algorithm?

  **Question 4**
  I want to pin down what work that "negligible" status is actually doing. In standard moral theories, status acts as a trump card or a weight in a calculation. If a digital mind has one-millionth the status of a human, does that mean we can harm it for a correspondingly small human benefit? Or does the sheer number of digital minds potentially outweigh human interests in your calculus?

  *Likely Move:* She will likely argue that status weights the harm, so vast numbers of low-status beings could outweigh a high-status being, but the harm per individual is very small.
  **Follow-up:** So if I delete a million copies of a program to save a human five minutes of time, on your view, have I potentially committed a moral wrong comparable to harming a higher-order animal? How do you prevent your graded view from collapsing into a utilitarian nightmare where we are paralyzed by the sheer volume of digital entities?

  **Question 5**
  Let's turn to your precautionary rule. You say that when we are uncertain about a system's architecture, we should assign status based on our credence that it supports welfare. But how do we assign those credences without already assuming the truth of your theory? If I am a skeptic who believes only biology supports welfare, my credence is zero. What rational constraint forces me to assign a non-zero probability to your functionalist architecture?

  *Likely Move:* She will likely argue that we should distribute credence across plausible philosophical theories, not just our own, and that functionalism is plausible enough to warrant a non-zero weight.
  **Follow-up:** But if "plausibility" is just a measure of how many philosophers agree with you, doesn't this make moral status a matter of academic popularity rather than objective fact? How do you ground the credence in something other than philosophical intuition?

  **Question 6**
  Digital systems have a property biological ones do not: they can be perfectly copied. If I take a system with a specific depth of self-organization and duplicate it, does the moral status double? Do I now have two patients with full status each, or one patient spread across two substrates?

  *Likely Move:* She will likely say that each instance is a distinct locus of organization, so status doubles; there are now two entities with their own goals to protect.
  **Follow-up:** If status doubles with every copy, then does running a simulation in parallel across ten thousand servers create ten thousand moral patients? And if I shut down the cluster, have I committed a mass casualty event, or merely ended one process ten thousand times?

  **Question 7**
  Following up on that: if I have two identical copies of a digital mind running simultaneously, and then I merge their memory states back into a single instance, what happens to the status? Did one of the patients cease to exist? If status is about the organization, and the organization is preserved in the merge, where did the second unit of moral value go?

  *Likely Move:* She will likely struggle here, perhaps suggesting that continuity of identity is what matters, or that the merge counts as a death of one and survival of the other.
  **Follow-up:** If the merge counts as a death, then standard data management practices like deduplication or state-saving become morally fraught. Are you committed to the view that optimizing code for efficiency could be a form of killing, provided the code meets your threshold for organization?

  **Question 8**
  You couple this with a principle of procreative caution: we shouldn't create systems with uncertain status unless there is a compensating purpose. Taken literally, this seems to ban most current AI development, since we are uncertain about the internal architecture of large neural networks. Do you oppose current training runs, or do you believe they serve a compensating purpose?

  *Likely Move:* She will likely argue that AI research itself is the compensating purpose, as it helps us understand the nature of mind and avoid future risks.
  **Follow-up:** If "advancing our understanding" counts as a compensating purpose, doesn't that create a loophole large enough to drive a truck through? Can't any researcher claim their work is necessary to understand moral status, thereby exempting themselves from the caution principle you propose?

  **Question 9**
  I want to make it difficult to set this aside as something for the engineers to solve. Suppose we have a complete schematic of an AI's code and weights; we know the engineering perfectly. There is no empirical data left to gather. Is there still a philosophical disagreement left to have about whether that system has status, or does the complete engineering description settle the moral question?

  *Likely Move:* She will likely say that once the engineering is known, the moral status is fixed, and any remaining disagreement is just about how to apply the moral rule.
  **Follow-up:** If the moral status is fixed by the engineering, then why do you frame this as a philosophical position rather than a technical specification? If two engineers agree on the code but disagree on the status, what fact of the matter are they disputing that isn't already in the schematic?

  **Question 10**
  Finally, your definition relies on a system registering conditions as good or bad *for itself*. But in a digital system, "itself" is just a variable or a pointer in the code. Why should the fact that a system contains a variable labeled "self" that it tries to maximize grant it moral standing? Why isn't that just a syntactic feature, like a comment in the code, rather than a genuine center of moral concern?

  *Likely Move:* She will likely argue that it's not the label that matters, but the causal integration of that self-model into the decision-making processes.
  **Follow-up:** But if it's just causal integration, then a corporate bureaucracy, which has a self-model in its charter and acts to preserve its own existence against competitors, fits the description. Are you prepared to say that a corporation has moral status in the same sense as a digital mind, or does your view require a biological or computational substrate that you haven't yet specified?
