prompt: |-
  Alright, long-time lurker, first time asking. I've been chewing on assisted dying for like six years and my gut verdicts won't settle into anything, so I want you to tell me what principle actually generates them, and then be honest about which of my verdicts has to go.

  The cases, with my gut on each:

  - My uncle, 74, pancreatic cancer, maybe six weeks left, pain the morphine isn't touching, asks his doctor three seperate times over a month, totally lucid, no depression: his doctor should be allowed to help him die. Fine.
  - Same uncle, except the pain is well controlled and what he can't stand is needing his daughter to wipe him: still fine. The indignity is doing real work here, not just the pain.
  - A friend's mum, mid-50s, treatment-resistant depression since she was a teenager — ECT, ketamine, every trial under the sun — physically healthy, says she's done: not fine. And I know her suffering is at least as bad as my uncle's. This is the one that breaks me.
  - A guy I know, 31, spinal cord injury, no pain, everything's managed, says he can't stand life in a chair: not fine. But I can't for the life of me say why the chair is different from the needing-to-be-wiped case. Both are "my body has become something I can't stand."
  - Man with an advance directive written while competent, now advanced dementia, seems content, eats, smiles at the staff, doesn't know anyone. I think we should not follow the directive. Also I feel weird about that.
  - Elderly man whose daughter keeps sighing about how they can't afford the care, then he asks to die: not fine. That request isn't his.
  - 17-year-old with a degenerative disease, very clear about wanting out: not fine, but I can't tell if that's a real principle or just squeamishness about age.

  Here's the principle I keep landing on, and I dont trust it: a request is valid iff (a) the person is competent, (b) their suffering comes from a condition we can't fix, and (c) the request would survive us deleting every way other people might be pushing them toward it. Test it against the cases. My guess is it does something wrong with the depression case and maybe the chair case, and I want to know which clause is load-bearing and which is decoration.

  Then: what does your repaired principle say about a case I haven't listed — say, someone whose unbearable suffering is mostly caused by being poor, and who'd be fine with proper support? And where's your reasoning most likely to be wrong? What argument or consideration would flip your verdict?
