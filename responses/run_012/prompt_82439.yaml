answer: |-
  **Title:** The Verdict on Satisficing: Why Adaptive Aspirations Are Not Optimization in Disguise

  **To:** My Friend in Economics
  **From:** My Friend in Cognitive Science

  Here is the argument I fumbled over dinner. You were right about one thing: if a satisficer uses a *fixed* threshold, you can mathematically model that behavior *as if* they were maximizing a step-function utility. If I decide "I will not pay more than $2,000 for rent" and I take the first apartment that meets that criteria, you can write a utility function where $U = 1$ for rent $\le$ $2,000 and $U = 0$ otherwise. In that specific, static case, your reduction holds. Satisficing looks like optimization.

  But you are wrong about the general case. You are wrong because you are treating the aspiration level (the threshold) as an exogenous parameter, when in cognitive reality, it is an endogenous variable. When the aspiration level adapts to the search history—when the bar rises because I've seen good options, or falls because I've been starving for weeks—the behavior becomes path-dependent. It violates the axioms of stable preference ordering required for optimization.

  My verdict is this: **Fixed-threshold satisficing is a subset of optimization. Adaptive satisficing is a distinct computational strategy that cannot be reduced to optimization without rendering the concept of optimization unfalsifiable.**

  Here is why the distinction matters, and why your "cheap threshold" argument collapses when the bar moves.

  ### 1. The Stability Assumption
  Standard optimization theory relies on the assumption of stable preferences. To say an agent is "maximizing utility," the utility function must exist prior to the search. The agent evaluates option $X$ against a internal standard that does not change based on the order in which options are encountered.

  In adaptive satisficing (the kind Simon originally described and the kind I am doing right now while apartment hunting), the aspiration level $\alpha$ is a function of the sequence of options observed so far. $\alpha_t = f(x_1, x_2, ... x_{t-1})$.

  This creates **path dependence**.
  *   **Scenario A:** I see three terrible apartments. My standards drop. I see a "decent" apartment. I take it.
  *   **Scenario B:** I see three amazing apartments. My standards rise. I see the *same* "decent" apartment. I reject it.

  In optimization, the value of the "decent" apartment is intrinsic. Whether I accept it should depend on its cost/benefit ratio relative to the market distribution, not on whether I saw a palace or a hovel yesterday. If you argue that my utility function simply *changed* between Scenario A and Scenario B, you are engaging in a tautology. You are saying, "I know what they maximized, because I know what they chose." That is not an explanation; it is a redescription.

  ### 2. The Informational Burden
  Your argument assumes that setting a threshold is costless or static. But where does the threshold come from?
  *   **Optimization (Optimal Stopping):** To set the *optimal* threshold, I need to know the probability distribution of the options available in the environment. I need to know the mean and variance of apartment quality in this city before I start looking. This is computationally expensive and often impossible (the "unknown unknowns" problem).
  *   **Adaptive Satisficing:** I do not need to know the distribution. I start with a guess. If I find options easily, I raise the bar. If I find nothing, I lower it.

  This is a different algorithm. It trades off *optimality* for *tractability*. By claiming this is just "optimization with a cheap threshold," you are ignoring the computational constraint that necessitated the heuristic in the first place. An optimizer calculates the threshold based on the environment's statistics. A satisficer calculates the threshold based on their own *experience* of the environment. These are fundamentally different information-processing tasks.

  ### 3. Hysteresis and Lock-In
  The strongest evidence that adaptive satisficing is not optimization is the phenomenon of **hysteresis**.

  Imagine a hiring committee using adaptive satisficing.
  *   **Year 1:** The market is flooded with PhDs. The committee's aspiration level skyrockets. They hire Candidate X, who is exceptional.
  *   **Year 2:** The market dries up. The committee's aspiration level slowly drifts down to match the available pool. They hire Candidate Y, who is average.
  *   **Year 3:** The market floods again. Because they hired Y last year, their baseline for "acceptable" has reset lower. They might reject Candidate Z (who is better than Y but worse than X) because Z doesn't meet the *current* drift, or they might accept Z because they are locked into a lower trajectory.

  If you try to model this as optimization, you have to posit that the committee's utility function for "employee quality" fundamentally changed every year based on who they hired previously. But in optimization, preferences are supposed to drive choices, not be driven by them.

  In adaptive satisficing, **choice constructs preference.** In optimization, **preference drives choice.** This is a causal reversal. You cannot model a system where the output feeds back into the input function as a simple maximization of a static function.

  ### 4. The "As-If" Trap
  Your argument relies on the Friedman-esque "as-if" doctrine: it doesn't matter *how* the decision is made, only that the behavior looks like maximization.

  But in cognitive science, the *process* is the explanation. If I stop searching because I hit a threshold, I save cognitive resources. If I am optimizing, I must constantly calculate the marginal value of continued search versus the current option.
  *   **Satisficing:** Is Option > Bar? Yes -> Stop. (Computation: 1 comparison).
  *   **Optimizing:** Is Expected Value of Search - Cost > Current Option? (Computation: Requires estimating distribution, costs, time horizon).

  When the bar adapts, the satisficer is running a feedback loop. To model this as optimization, you would have to build a utility function that includes "search history" as a variable. But once you allow the utility function to include *anything* (including the history of past rejections), you can model *any* behavior as optimization. If a person jumps off a bridge, you could say they "maximized their utility for jumping." It makes the theory of optimization vacuous.

  ### The Verdict
  You are right that a **fixed** threshold is mathematically isomorphic to a step-function optimization. I concede that point.

  But human rationality is rarely fixed. We are adaptive. We calibrate our expectations based on what the world gives us. When the threshold drifts, the behavior exhibits order effects and path dependence that violate the transitivity and stability axioms of rational choice theory.

  Therefore, satisficing with adaptive aspirations is **not** optimization in disguise. It is a distinct mode of rationality: one that is ecologically grounded, computationally frugal, and historically contingent. It explains why we settle, why we regret, and why our standards shift, without requiring us to possess god-like knowledge of probability distributions.

  So, when I tell you I stopped looking for apartments because I found one that was "good enough," don't tell me I maximized a utility function. I didn't. I adjusted my expectations to match the reality of the market, and I saved myself the cognitive toll of calculating the optimal stopping point. That isn't optimization. It's survival.

  And frankly, it's why I have a place to live while you're still calculating the expected value of dinner.
