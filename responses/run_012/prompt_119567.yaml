answer: |-
  **Project Title:** Operationalizing Endings: A Taxonomy of Collapse Criteria and Their Explanatory Limits

  **Project Summary and Core Question**
  Public discourse on societal "collapse" oscillates between two entrenched positions: the catastrophist view, which measures failure by the loss of elite institutions, monumental construction, and literacy; and the transformationist view, which measures continuity by population persistence, subsistence stability, and cultural adaptation. These camps treat their disagreement as empirical—arguing over what the archaeological record shows—when the divergence is primarily definitional. The current debate is stalled because "collapse" functions as a floating signifier, attached to different units of analysis (the polity vs. the population) and different metrics of value (complexity vs. resilience) without explicit acknowledgment.

  This project asks a determinate question: **Can a standardized set of operational criteria distinguish "collapse" as a specific class of systemic failure from "transformation" as reorganization, and under what conditions does the term function as an explanation (*explanans*) rather than a description of an outcome (*explanandum*)?**

  I propose that "collapse" only earns its keep as an explanation if it identifies a specific mechanism—such as a loss of adaptive capacity or a threshold crossing in complexity theory—rather than simply labeling a reduction in sociopolitical scale. If the term is purely observer-relative, dependent on whether one values palaces or peasantry, it cannot bear the normative weight currently placed upon it in climate change discourse. This nine-month fellowship will produce a typology of collapse criteria, testing them against canonical case studies to determine where the disagreement is verbal and where it is factual.

  **Intellectual Context: Why the Debate Remains Open**
  Existing positions leave this question open not because the evidence is unsettled, but because the frameworks are incommensurable. Proponents of collapse narratives typically adopt the state or the elite institution as the unit of analysis. For them, the disappearance of centralized bureaucracy is synonymous with societal failure. Revisionists, conversely, adopt the household or the regional population as the unit, finding continuity where catastrophists see ruin.

  Crucially, the choice of unit is not a neutral parameter, as my initial hunch suggested; it is a theoretical commitment. To choose the "polity" as the unit is to presuppose that society equals its government. To choose the "population" is to presuppose that society equals its biological and cultural reproductions. Because neither side explicitly defends their unit choice as a normative stance, they talk past one another. Furthermore, neither side adequately addresses when "collapse" explains *why* a change occurred. Often, "collapse" is used as a synonym for "end," offering no causal mechanism. For the concept to function as an *explanans*, it must refer to a process (e.g., diminishing returns on complexity) rather than a result (e.g., abandoned cities). Current literature conflates these, allowing the term to smuggle in causal assumptions under the guise of description.

  **Methodology and Work Plan**
  This is a desk-based project relying on published case studies, diagnostic checklists, and systems theory literature already available in the field. I will not generate new archaeological data but will meta-analyze how existing data is categorized.

  *   **Months 1–3: Taxonomy of Criteria.** I will compile the explicit and implicit criteria used to declare a "collapse" in major cases (Late Bronze Age, Classic Maya, Rapa Nui, etc.). I will categorize these into distinct metrics: elite (monumentality, literacy, centralization), subsistence (caloric intake, health markers), and demographic (population density, settlement patterns). The output will be a matrix showing which metrics correlate with which verdicts.
  *   **Months 4–6: Comparative Application.** I will apply this matrix to three distinct case studies representing different types of endings. I will test whether fixing the unit and metric resolves the disagreement. For example, if we fix the unit as "regional caloric production," do the Maya lowlands still count as a collapse? If we fix the unit as "royal lineage continuity," does Easter Island? This phase determines if the dispute is verbal (resolved by definition) or empirical (persisting despite agreed definitions).
  *   **Months 7–9: Explanatory Power and Normative Analysis.** I will analyze cases where "collapse" is used as a causal mechanism (e.g., systems theory tipping points) versus a label. I will then draft the normative conclusion: if "collapse" is observer-relative, what does that imply for modern climate analogies? Does it undermine warnings about civilizational fragility, or merely shift the focus from state survival to human welfare?

  **Success and Failure Conditions**
  A **positive result** will look like a functional framework that allows researchers to state: "Under metric X, this is a collapse; under metric Y, it is a transformation." It will successfully isolate instances where "collapse" describes a specific loss of adaptive capacity, distinct from mere political change. The final deliverable will be a long-form article or white paper presenting this typology.

  The project **fails** if I find that the criteria are too entangled to separate (e.g., elite collapse always necessitates subsistence collapse in the record) or if the "mechanism" versions of collapse theory prove indistinguishable from the "label" versions in practice. If the distinction between *explanans* and *explanandum* cannot be drawn clearly in the literature, the project will pivot to documenting that confusion rather than resolving it.

  **Scalability and Constraints**
  If the fellowship period is shortened or resources reduced, I will cut the comparative application phase (Months 4–6) down from three case studies to one paradigmatic case (likely the Late Bronze Age, due to the density of available literature on both sides). If necessary, I will also narrow the normative analysis to focus solely on the logical validity of the analogy between past and present, leaving aside the broader policy implications.

  **Refinement of Framing**
  Regarding the initial hypothesis: while the "choice of unit" is central, this project proceeds on the finding that the unit cannot be fixed independently of the metric of value. Therefore, the work will not attempt to find the "correct" unit, but rather to expose the normative commitments embedded in each choice. This ensures the project does not inadvertently replicate the error it seeks to diagnose by treating theoretical choices as empirical parameters.
