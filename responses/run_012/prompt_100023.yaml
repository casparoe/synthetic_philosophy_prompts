answer: |-
  Here is a complete run-sheet and facilitator guide for your 90-minute session.

  **Design Note:** Although you requested a "two-station" setup, you also specified *you* will be the Shopkeeper (St 1) and the Bank (St 2). Unless you have a trusted TA to run one station simultaneously, **I strongly recommend running these sequentially with the whole group.** Splitting 12 people requires two facilitators to maintain the "live threat" intensity. The plan below assumes **Sequential Phases** (Phase 1: Synchronic, Phase 2: Diachronic) to ensure you control the narrative pressure. If you do have a TA, you can run them in parallel rotation (40 mins each).

  ### **Session Overview**
  *   **Time:** 90 Minutes
  *   **Participants:** 12 Grad Students
  *   **Goal:** Move money pumps from "textbook reductio" to "pragmatic threat," then critique the normative force of the pump.
  *   **Incentives:** Chips = Raffle Tickets (e.g., 1st pick of snacks, fancy coffee, or a actual small prize). *Crucial:* Chips must feel valuable.

  ---

  ### **1. Materials & Setup**

  **General:**
  *   **Chips:** ~200 poker chips (two colors: White for currency, Blue for "Special" if needed, but White is fine).
  *   **Redemption:** A bowl of snacks or a raffle box visible at the front.
  *   **Timer:** Visible countdown clock.

  **Phase 1 (Synchronic Swap Shop):**
  *   **Choice Slips:** 36 slips total (3 per person). Pre-printed pairs:
      *   Slip 1: **Option A** (Sure 3) vs. **Option B** (80% of 4)
      *   Slip 2: **Option B** (80% of 4) vs. **Option C** (10% of 35)
      *   Slip 3: **Option C** (10% of 35) vs. **Option A** (Sure 3)
  *   **Collection Box:** To gather slips anonymously.
  *   **The "Inventory":** A small tray holding physical tickets representing the gambles (Ticket A, Ticket B, Ticket C).

  **Phase 2 (Diachronic Bank):**
  *   **Contract Forms:** 12 copies. Simple checkboxes: [ ] Take 5 Now, [ ] Wait for 8 Later.
  *   **Commitment Addendum:** Small slip: "I pay 1 chip to lock my choice."
  *   **The "Temptation" Offer:** A scripted verbal offer you will make midway through Phase 2.

  ---

  ### **2. Run-Sheet & Timeline**

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Stakes** | Explain chips = raffle/snacks. Emphasize: "Keep your chips. You want more." |
  | **05-35** | **Phase 1: Swap Shop** | Elicit preferences, then run the pump. (See Script Below). |
  | **35-40** | **Reset** | Collect all chips/tickets. Reset the "Bank." |
  | **40-70** | **Phase 2: Time Bank** | Agents choose plans. You (Bank) offer buyouts. Commitment option. |
  | **70-90** | **Debrief** | Map activities to arguments. Critique the pump. |

  ---

  ### **3. Phase 1: The Synchronic Swap Shop (30 Mins)**

  **The Logic:**
  *   **A:** Sure 3 chips (EV 3)
  *   **B:** 80% of 4 chips (EV 3.2)
  *   **C:** 10% of 35 chips (EV 3.5)
  *   **Target Cycle:** A > B (Certainty Effect), B > C (Dominance/EV), C > A (Possibility Effect).
  *   **The Pump:** Swap Fee = 1 Chip.

  **Procedure:**
  1.  **Elicitation (10 mins):** Hand out the 3 slips to each person. Tell them: *"Make your preferred choice on each slip. Fold them. Do not discuss."* Collect them in a box.
  2.  **The Reveal (5 mins):** You (Shopkeeper) stand at the front. Pick a victim (or go row by row). Open their slips.
      *   *If Transitive:* "You chose A, then B, then C. Consistent. You keep your starting ticket."
      *   *If Intransitive (A>B, B>C, C>A):* "Interesting. You prefer A to B, B to C, but C to A. You currently hold Ticket A."
  3.  **The Pump (15 mins):** This is the threat.
      *   **You:** "Since you prefer C to A, I can improve your position. I'll swap your Ticket A for Ticket C. There's a small administrative fee of 1 chip."
      *   **If they pay:** "Great. Now you hold C. But wait, looking at Slip 2, you prefer B to C. I can swap C for B. Fee: 1 chip."
      *   **If they pay:** "Now you hold B. But Slip 1 says you prefer A to B. Swap back to A? Fee: 1 chip."
      *   **Result:** They are back at A, but -3 chips poorer.
      *   **Repeat:** "You're back at A. You prefer C to A. Want to swap again?"

  **Scripting the Threat:**
  *   Be polite but bureaucratic. *"I'm not forcing you. I'm just helping you realize your stated preferences. If you refuse, you're saying your previous choice was a mistake. Are you correcting a mistake or violating a preference?"*
  *   **If they refuse:** Stop. Mark them as "Resolute." Note their chip count.

  **What If No One Cycles? (Predicted Failure Mode)**
  *   *Likely:* 50% will spot the loop immediately upon reveal.
  *   *Fix:* This is actually **good data**. In the debrief, ask them: *"At what point did you realize you were being pumped? Was it the first offer or the third?"*
  *   *Argument:* The money pump argument doesn't require you to *actually* lose money; it requires that *if* you act locally on these preferences, you *would* lose. The fact that you stopped means you imposed an external constraint (transitivity) to avoid the loss. Why is that constraint rational?

  ---

  ### **4. Phase 2: The Diachronic Time Bank (30 Mins)**

  **The Logic:**
  *   **Plan Early (t1):** Choose 5 chips (Now/End of Phase) OR 8 chips (Later/End of Session).
  *   **Temptation (t2):** If they chose "Wait," you offer 6 chips *right now* to cancel the contract.
  *   **Commitment (t1):** They can pay 1 chip at t1 to make the contract unbreakable.
  *   **Rationality Check:** If they know they will take the 6 at t2, they should pay 1 at t1 to get 8 (Net 7) rather than get 6.

  **Procedure:**
  1.  **The Contract (5 mins):** Hand out forms.
      *   *"You are an Agent. I am the Bank. Choose your payout plan."*
      *   Option X: 5 Chips (Paid immediately after this phase).
      *   Option Y: 8 Chips (Paid at the very end of the 90 mins).
  2.  **Commitment Market (5 mins):**
      *   *"Before we begin, you may purchase a 'Lock-In' clause for 1 chip. If you buy this, you cannot change your mind later. If you don't, the Bank may offer a buyout."*
  3.  **The Wait (5 mins):** Do some filler task (e.g., define "rationality" on a notecard) to simulate the passage of time.
  4.  **The Temptation (5 mins):** Approach those who chose Option Y (Wait) and did *not* buy the Lock-In.
      *   **You (Bank):** "Look, waiting is risky. I can buy you out of that contract right now. I'll give you 6 chips. Cash. Immediate. Or stick to your plan for 8 later?"
      *   *Most will take the 6.* (Hyperbolic discounting / "Bird in hand").
  5.  **Settlement (10 mins):** Pay out the chips.
      *   Lock-In Agents: 8 - 1 (fee) = 7 chips.
      *   Tempted Agents: 6 chips.
      *   Early Takers: 5 chips.

  **What If They Don't Bite? (Predicted Failure Mode)**
  *   If they refuse the buyout, they are "Resolute Choosers."
  *   *Script:* "Why didn't you take the 6? At t1 you valued the 8 later more than 5 now. Now, 6 is > 5. Did your preference change, or did you bind yourself?"

  ---

  ### **5. Debrief Guide (20 Mins)**

  Do not lecture. Draw on the board. Use their results.

  **Part 1: Mapping the Arguments (5 mins)**
  *   **Station 1 (Synchronic):** Maps to **Intransitivity**.
      *   *Standard View:* If A>B, B>C, C>A, you are irrational because you can be pumped.
      *   *Result:* Did anyone lose chips? (If yes, point to them). If no, why not? (They imposed transitivity).
  *   **Station 2 (Diachronic):** Maps to **Dynamic Inconsistency**.
      *   *Standard View:* Preferring 8-later over 5-now at t1, but 6-now over 8-later at t2, is irrational.
      *   *Result:* Did the "Lock-In" buyers end up with more chips than the "Tempted" agents? (7 vs 6). This proves commitment has instrumental value *if* you distrust your future self.

  **Part 2: Turning the Arguments (10 mins)**
  *   *Question 1: The Naivety Objection.*
      *   "In Phase 1, the pump only works if you keep saying 'yes.' A **Sophisticated** agent sees the loop and refuses the first trade. Does being pumpable prove irrationality, or just naivety?"
      *   *Push:* If sophistication saves you, is the problem the *preferences* or the *decision rule*?
  *   *Question 2: The Unit of Agency.*
      *   "In Phase 2, the 'You' at t1 wanted 8. The 'You' at t2 wanted 6. Who is the rational agent? The Person (extended over time) or the Time-Slice?"
      *   *Push:* If you are a time-slice, taking the 6 is rational. If you are a Person, binding your future self looks like tyranny. Is **Resolute Choice** (McClennen) rational, or just self-binding?
  *   *Question 3: The Normative Force.*
      *   "Losing chips is bad. But is it *irrational*? If I prefer C>A, and you charge me to swap, maybe I'm just buying the *option* to choose C again. Is the fee a cost, or the price of agency?"

  **Part 3: Limitations & Honesty (5 mins)**
  *   **Admit:** "Phase 2 didn't actually change your biology. You didn't feel genuine craving. We simulated the *structure* of inconsistency."
  *   **Admit:** "Phase 1 relies on you treating chips as linear utility. If the 3rd chip is worth less than the 1st (diminishing marginal utility), the pump math breaks."
  *   **Closing:** "The Money Pump isn't a proof that you *will* lose money. It's a proof that if you want to avoid losing money, you must constrain your preferences. The question is: where do those constraints come from?"

  ---

  ### **6. Troubleshooting & "What Goes Wrong"**

  **1. The "I'm Not Stupid" Refusal**
  *   *Scenario:* In Phase 1, a student says, "This is a money pump. I'm not trading."
  *   *Response:* "Excellent. You just acted as a Sophisticated Chooser. But notice: to do that, you had to override your stated preference on the slip (C>A). You are admitting your immediate preference was 'wrong.' Why?"
  *   *Lesson:* This validates the argument that rationality requires *coherence* over *local satisfaction*.

  **2. The "Chips Don't Matter" Problem**
  *   *Scenario:* Students treat chips as toys.
  *   *Fix:* Make the redemption immediate and visible. "Top chip holder picks the snack first." Social pressure helps.
  *   *Fix:* If they are too casual, pause and say, "If these were course credits, would you trade?"

  **3. The "No One Cycled" Disaster**
  *   *Scenario:* 0% intransitivity in Phase 1.
  *   *Response:* Don't panic. The argument is conditional. "Nobody cycled. That means your preferences are transitive. Why? Did evolution wire you that way, or did you just learn it in Utility Theory 101? If it's learned, is it a deep rational requirement or just a heuristic to avoid getting pumped?"

  **4. The "Commitment is Irrational" Pushback**
  *   *Scenario:* In Phase 2, they argue paying for Lock-In is a waste.
  *   *Response:* "Compare the final chip counts. Lock-In Agents: 7. Tempted Agents: 6. If rationality is about maximizing outcome, Lock-In won. If rationality is about maximizing freedom at every moment, Lock-In lost. Which definition are we using?"

  ### **7. Philosophical Cheat Sheet (For You)**

  *   **Davidson, McKinsey, Sugden (1955):** The classic Money Pump argument.
  *   **Rabinowicz (1995):** Distinguishes between *having* intransitive preferences and *acting* on them.
  *   **McClennen (1990):** *Rationality and Dynamic Choice.* Argues for **Resolute Choice** (sticking to the plan) over Sophistication (anticipating failure).
  *   **Bratman (1987):** *Planning Theory.* We bind ourselves to function as agents over time.
  *   **Arntzenius (2008):** "No Regrets." Suggests that if you know you'll be pumped, you should just change your preferences, not your choices.

  ### **Final Facilitator Note**
  The success of this session depends on your willingness to be the "villain." In Phase 1, be the relentless Shopkeeper. In Phase 2, be the predatory Bank. If you are too nice, they won't feel the threat, and the debrief will be abstract. Make them feel the loss of the chips, then help them analyze why it hurt.
