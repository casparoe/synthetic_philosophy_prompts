answer: |-
  Here is the dependency structure and lesson plan. I've taught this crossover enough to know that if you draw the hyperbolic curve on the board in minute one, you have already lost the philosophical battle. The math is seductive; it looks like an *explanation*, but for the philosophers, it's a *redescription* that might explain away the very thing we're trying to understand.

  ### 1. The Dependency Structure (What must land first)

  You cannot open with the discounting curve. If you do, you frame the problem as **descriptive** (how do agents behave?) rather than **normative** (what does it mean to fail oneself?). If the students accept the economic description as the *whole* story immediately, the philosophical problem dissolves into preference satisfaction, and you spend 50 minutes talking past each other.

  **The Order of Operations:**
  1.  **Normative Force:** Students must first intuitively feel that there is a difference between "changing one's mind" and "giving in." There must be a sense that one judgment is *authoritative* over the other.
  2.  **The Economic Redescription:** Only once they feel that tension do you introduce hyperbolic discounting as a challenge: "What if there is no authority, just different stakeholders?"
  3.  **The Evaluation:** Now you can ask if the economic model *explains* the weakness or *denies* it.

  **Why not the curve first?**
  Because the curve assumes the $t_2$ preference is just as valid as the $t_1$ preference. The philosophical problem *depends* on the $t_1$ preference having a special claim to authority (the "better judgment"). If you validate $t_2$ too early, you destroy the "better" in "better judgment."

  ---

  ### 2. The Carrying Example: "The Spoiler"

  **The Scenario:**
  A student loves a complex mystery show. On Monday ($t_1$), they judge that watching the episodes in order over the week will maximize their enjoyment. They explicitly judge that reading a spoiler on Wednesday ($t_2$) would ruin the experience. Yet, on Wednesday, tempted by a clickbait headline, they read the spoiler.

  **Why this example?**
  *   **Not Health/Money:** It avoids the "smoking/diet" clichés where students default to "addiction" or "budget constraints."
  *   **Not Odysseus:** It's modern and relatable.
  *   **The Disagreement:**
      *   **Philosophy (Akrasia):** The agent acted against their own *synchronous* judgment of what was best for their own experience. The $t_2$ self made a *mistake* relative to the agent's own goals.
      *   **Economics (Hyperbolic Discounting):** The $t_1$ self valued "Surprise." The $t_2$ self valued "Curiosity Resolution" + "Immediacy." The discount rate shifted. The $t_2$ self didn't make a mistake; they just had a different utility function.
  *   **The Tension:** Did the student *fail* (Phil), or did they just *consume* (Econ)?

  **What the example must have:**
  *   **Explicit Prior Judgment:** The agent must explicitly state at $t_1$ that $t_2$ action is bad *for them*.
  *   **No External Constraint:** No one forced them. No price change.
  *   **Irreversibility:** Once the spoiler is read, it's gone. This prevents the "I'll just study later" loophole.

  **What the example must not have:**
  *   **New Information:** They can't say "I read the spoiler because I heard the show was bad." The preference change must be endogenous.
  *   **Physical Compulsion:** It cannot look like a reflex (sneezing). It must feel like a choice.

  ---

  ### 3. The 50-Minute Sequence & Misconception Management

  **0:00 – 0:10: The Intuition Pump (Philosophy First)**
  *   **Activity:** Ask the class: "In the Spoiler case, did the student make a *mistake* on Wednesday, or did they just want something different?"
  *   **Goal:** Elicit the intuition that there is a difference between *rational revision* (I found out the show is terrible, so I stop) and *weakness* (I know this hurts my enjoyment, but I click).
  *   **Head Off Misconception #1: 'Akrasia is just impulsiveness'.**
      *   *Where:* Minute 5.
      *   *How:* If a student says "They just couldn't help it," push back. "If they were impulsive, they wouldn't have formed the plan on Monday. Akrasia requires the plan *and* the violation. Impulseness skips the plan."
      *   *Board:* Write "Better Judgment" vs. "Current Desire."

  **0:10 – 0:25: The Economic Challenge (The Curve)**
  *   **Activity:** Now draw the hyperbolic curve. Show how the value of "Knowing Now" crosses the value of "Enjoying Later" as $t_2$ approaches.
  *   **Narrative:** "Economics says there is no 'Better Judgment.' There is only 'Monday-You' and 'Wednesday-You.' Wednesday-You isn't weak; they are just maximizing their current utility function."
  *   **Head Off Misconception #2: 'Discounting explains the feeling of giving in'.**
      *   *Where:* Minute 20.
      *   *How:* Students will say, "The curve shows why it felt hard." Correct them: "The curve shows why the *choice* changed. It doesn't explain the *regret*. If Wednesday-You is just satisfying preferences, why do they feel guilty on Thursday? The model predicts satisfaction, not remorse."
  *   **Head Off Misconception #3: 'Time inconsistency is the same thing as weakness of will'.**
      *   *Where:* Minute 25.
      *   *How:* This is the critical pivot. Ask: "If time inconsistency explains the behavior, do we still need the concept of 'weakness'?" Let them sit with the idea that Econ might be *eliminating* the phenomenon rather than explaining it.

  **0:25 – 0:40: The Clash (Discussion)**
  *   **Activity:** Break into small groups (3-4 students). Prompt: "If the Econ model is true, is 'Weakness of Will' just a superstition? Or does the Econ model miss something about what it means to be a person over time?"
  *   **Goal:** Force them to choose between "Multiple Selves" (Econ) and "Unified Agency" (Phil).
  *   **Head Off Misconception #4: 'Commitment devices solve it'.**
      *   *Where:* Minute 35 (during group debrief).
      *   *How:* Someone will suggest "Just use a website blocker." Respond: "That solves the *behavior*, but does it solve the *will*? If I need a blocker to do what I judge best, haven't I admitted my will is weak? Commitment manages the symptom; it doesn't explain the disease."

  **0:40 – 0:50: Synthesis & Diagnostic**
  *   **Summary:** The Econ model gives us the *mechanism* (changing discount rates), but the Phil model preserves the *normativity* (the idea that one judgment should rule).
  *   **What to Leave Out (Say this explicitly):**
      *   "I am leaving out the **ontology of selves**. We are not literally different people, but the Econ model treats us as if we are. We're also leaving out the **beta-delta math**; the shape of the curve matters less than what the curve implies about rationality."
      *   "I am leaving out **moral weakness**. We are talking about prudential weakness (hurting your own goals), not hurting others."

  ---

  ### 4. The Diagnostic Question

  Do not ask: "Can anyone define hyperbolic discounting?" (That tests vocabulary).
  Do not ask: "Is weakness of will real?" (That invites yes/no metaphysics).

  **Ask this instead:**
  > "If the Wednesday-self *truly* preferred reading the spoiler more than preserving the surprise at the exact moment they clicked, in what sense can we say they made a **mistake**?"

  **What to listen for:**
  *   **Surface Understanding:** They will say "Because they regretted it later." (This is just time inconsistency again).
  *   **Deep Understanding (Tension Landed):** They will say "Because the Monday-judgment was about their *overall* welfare, and the Wednesday-preference was only about *immediate* gratification. The mistake isn't in the preference, it's in letting the immediate preference overrule the overall plan."
  *   **The Win:** If they articulate that the Econ model captures the *choice* but the Phil model captures the *authority*, the tension has landed.

  ### 5. TA-to-TA Advice

  *   **Watch the Eyes:** When you draw the curve, watch for the "relief" in their eyes. They think the math solved the puzzle. You need to disrupt that relief. Remind them that math describes *what happened*, not *what it meant*.
  *   **Don't Settle:** If they agree that "Econ explains it," push harder. "So if I punch my friend because my discount rate for anger spiked, I'm not blameworthy, just time-inconsistent?" Use the stakes to show why the philosophical distinction matters.
  *   **The "Unified Agent" Trap:** Students will want to say "Well, it's the same person." Agree, but ask: "If it's the same person, why do their preferences contradict? If they are different preferences, whose counts?" This keeps the tension alive until the bell rings.
