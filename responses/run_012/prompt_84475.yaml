answer: |-
  Your provisional principle is insightful. You have effectively reconstructed a version of the **Principle of Fair Play** (associated with H.L.A. Hart and John Rawls) and grafted it onto the Kantian framework. Your intuitions move away from Kant's strict *Contradiction in Conception* (logical impossibility) toward a *Contradiction in Dependency* (normative free-riding).

  Here is the test of your principle against your eight verdicts, followed by answers to your three specific questions, and finally an assessment of the principle's viability.

  ### 1. Testing the Provisional Principle
  *Principle: A maxim is impermissible just in case acting on it leaves me relying on something that its universal adoption would destroy.*

  *   **Verdict 1 (False Promise): Pass.** You rely on the institution of promising. Universalization destroys it.
  *   **Verdict 2 (Never Lending): Pass.** You do not rely on a practice of lending to execute this maxim; you rely only on property rights, which survive universal non-lending.
  *   **Verdict 3 (Charity Free-Rider): Pass.** You rely on the existence of charitable givers. Universalization destroys the pool of givers.
  *   **Verdict 4 (Lying to Murderer): Fail (as stated).** You rely on the murderer's expectation of truth. If everyone lied to murderers, murderers would not expect truth, and the lie would fail. Your principle condemns the act; your verdict permits it.
  *   **Verdict 5 (Queue Jumping): Pass.** You rely on the restraint of others (waiting). Universalization destroys the queue order.
  *   **Verdict 6 (Carbon Emissions): Fail (as stated).** You rely on a stable climate, which is a physical state, not a "practice" or "expectation." Universalization destroys the state, but not a social practice.
  *   **Verdict 7 (Neglecting Talent): Pass.** You do not rely on others developing talents to neglect your own.
  *   **Verdict 8 (Impossible Maxims): Pass.** Distinguishes logical impossibility from normative undercutting.

  **Diagnosis:** Your principle captures the "free-rider" intuition perfectly in social cases (1, 3, 5) but fails in **defensive cases (4)** and **threshold/physical cases (6)**. To accommodate your verdicts, the principle must be refined.

  ---

  ### 2. Addressing Your Three Questions

  #### First: Does the principle deliver (6)?
  **No, not as currently phrased.** The term "practice" is too narrow. A stable climate is not a practice; it is a *condition of safety* maintained by collective forbearance.

  **The Clause Needed:** You must expand "practice/expectation" to **"scheme of restraint or cooperation."**
  *   *Revised Clause:* "...relying on a benefit secured by general restraint or cooperation that the maxim's universal adoption would negate."
  *   *The Cost:* This moves you significantly away from Kant and toward **Rule-Utilitarianism**. Kant's test is about the *rational consistency* of the will, not the *consequences* of universal adoption. By focusing on the destruction of a beneficial condition (climate stability), you are judging the act by the badness of the outcome in the universalized world. Kant explicitly rejected this (he argued the false promise is wrong even if no one else makes promises). To save (6), you must accept that your principle is consequentialist in structure, even if it uses Kantian language.

  #### Second: The Maxim-Description Problem
  You are correct that thin descriptions universalize easily ("travel") and thick descriptions universalize poorly ("jump queue to save 5 mins").

  **What fixes the description?** The description must capture the **mechanism of reliance.**
  *   *Constraint:* A maxim must be described sufficiently to identify *what* the agent is relying on.
  *   *Application:*
      *   In (5), "acting to arrive sooner" is too thin because it hides the reliance on *others waiting*. The maxim must be "Jumping the queue to arrive sooner."
      *   In (2), "never helping anyone" is too thick because it implies a stance on *receiving* help. The maxim is "Declining requests to lend my surplus." This reveals no reliance on others lending to me.
  *   *Can this be stated without circularity?* Yes, by the **Principle of Relevant Features.** The maxim must include all features relevant to the *efficacy* of the action. If the action only works because others are doing otherwise, that contrast must be in the maxim. This is not circular; it is a demand for honesty in self-reporting. If you describe your maxim as "traveling" when you mean "polluting while others abstain," you are misdescribing your own reasoning.

  #### Third: New Cases
  Applying the **Revised Principle** (Impermissible if relying on a benefit secured by general restraint that universalization would negate):

  1.  **Never Voting:** **Impermissible.** You rely on the democratic system (a benefit secured by others voting). Universal non-voting destroys the system. You are free-riding on the legitimacy others sustain.
  2.  **Eating Meat:** **Impermissible (conditionally).** If described as "eating factory-farmed meat," you rely on environmental stability and animal welfare norms that universal consumption destroys. If described as "eating sustainably sourced meat," it may pass. The verdict depends on whether the specific meat-eating relies on an unsustainable aggregate.
  3.  **Tax Evasion (if undetected):** **Impermissible.** Classic free-rider. You rely on public goods funded by others' compliance. Universal evasion destroys the revenue.
  4.  **Breaking Resolutions to Self:** **Permissible.** There is no "general restraint" by others you are relying on. This is a failure of prudence, not morality, under this principle. (This matches your Verdict 7).

  ---

  ### 3. The Smallest Set of Principles

  A single principle struggles to unify the "Social Free-Rider" cases (1, 3, 5) with the "Physical Threshold" case (6) and the "Defensive" exception (4). The closest unified formulation is:

  **The Principle of Non-Exploitative Dependence:**
  > *An act is impermissible if and only if:*
  > 1. *It secures a benefit for the agent;*
  > 2. *That benefit depends on a pattern of restraint or cooperation by others;*
  > 3. *Universal adoption of the act would negate that pattern;*
  > 4. *AND the act is not a necessary defense against a wrongful aggressor.*

  **Which verdicts does this not accommodate?**
  *   **Verdict 4 (Lying to Murderer):** Accommodated by Clause 4 (Defense).
  *   **Verdict 6 (Carbon):** Accommodated by Clause 2 (Pattern of restraint regarding emissions).
  *   **Verdict 2 (Never Lending):** Accommodated because no benefit is secured *by dependence on others lending*.
  *   **Verdict 7 (Talents):** Accommodated because no dependence on others.

  **Honest Admission:** The tension lies in **Verdict 6**. To make (6) work, Clause 2 must treat "environmental stability" as a "pattern of restraint." This is a metaphorical stretch. Strictly speaking, the atmosphere does not "restrain" itself; *people* restrain themselves. If the user believes (6) is wrong because of *physical harm* rather than *free-riding*, this principle misses the mark. If the user believes (6) is wrong because it is *unfair* to emit while others abstain, the principle holds. I am assuming the latter based on your phrasing ("aggregate effect").

  ---

  ### 4. What Would Change My Mind & Where I Might Be Wrong

  **What would change my mind:**
  If you argued that **Verdict 6 (Carbon)** is impermissible *even if you were the only person on earth*.
  *   *Reasoning:* My principle relies on *relational* unfairness (free-riding on others). If you believe polluting is wrong in a vacuum (a duty to nature or non-human life), my principle is insufficient. It is fundamentally anthropocentric and social.
  *   *Shift:* I would move from the *Principle of Non-Exploitative Dependence* to a **Principle of Harm Prevention**, which abandons the Kantian universalizability structure entirely for a direct consequentialist one.

  **Where I am most likely to be wrong:**
  I am likely underestimating the difficulty of **Verdict 4 (Lying to Murderer)** within a "Fair Play" framework.
  *   *Reasoning:* Truth-telling is often considered a "practice" we all rely on. By lying, even to a murderer, you are arguably exploiting the general habit of truth-telling to make your lie credible. My Clause 4 (Defense) is an *ad hoc* exception to save the verdict.
  *   *Risk:* A strict Kantian (or a strict Fair Play theorist) might argue that you *are* free-riding on the truth-telling of others to save your friend. If you concede that, your principle condemns the lie. If you hold firm that the lie is permissible, you must accept that your principle is not purely about "reliance" but about "legitimate expectations." (The murderer has no right to expect truth). This introduces a rights-based layer that complicates the simplicity of your reliance test.

  ### Summary
  You have not rediscovered Kant's Categorical Imperative; you have discovered the **Duty of Fair Play**. Your verdicts are consistent, but they require a principle that judges actions based on whether they *exploit cooperative schemes*, not whether they are logically universalizable. To make this work, you must accept that "practices" includes environmental forbearance (for Case 6) and that "reliance" excludes defensive deception (for Case 4). If you accept those two modifications, your system is robust. If you do not, Case 6 and Case 4 will remain outliers.
