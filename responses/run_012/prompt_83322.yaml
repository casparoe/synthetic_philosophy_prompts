answer: |-
  ### 1. The Essay Question

  **Formal Epistemology: Take-Home Final**
  **Question 1 (100% of exam grade)**

  We have modeled an agent's imprecise credal state using a set of probability functions, $\mathcal{C}$. In this course, we have jointly assumed two constraints on $\mathcal{C}$ and its use:
  1.  **Convexity:** If $P_1 \in \mathcal{C}$ and $P_2 \in \mathcal{C}$, then any linear mixture $\lambda P_1 + (1-\lambda)P_2$ is also in $\mathcal{C}$.
  2.  **The "Somewhere-Best" Rule:** An act is permissible if and only if it maximizes expected utility relative to *at least one* $P \in \mathcal{C}$.

  There are two distinct ways to interpret what $\mathcal{C}$ represents ontologically:
  *   **The Ignorance Reading:** The agent has a single, sharp credence function, but she does not know which one it is. $\mathcal{C}$ contains the live candidates for her true sharp state.
  *   **The Unsharp Reading:** The agent's doxastic state is inherently unsharp. $\mathcal{C}$ constitutes a single, determinate opinion that is not reducible to any specific $P$ within it.

  Write an essay that addresses the following:
  1.  Explain the distinction between the Ignorance Reading and the Unsharp Reading. Why are these not merely verbal differences?
  2.  Construct a concrete decision case (e.g., an urn scenario or a specific bet structure) where the two readings recommend different contents for $\mathcal{C}$.
  3.  Argue which of the two readings is required to justify **Convexity**, and which is required to justify the **Somewhere-Best Rule**.
  4.  Conclude whether a theorist can consistently hold both Convexity and the Somewhere-Best Rule, or whether adopting one forces you to abandon the other.

  *Note: Answers that simply define imprecise probabilities or discuss Ellsberg-style ambiguity aversion without addressing the ontological tension described above will receive a failing grade.*

  ***

  ### 2. Model Answer

  **Title:** The Ontological Cost of Convexity and Maximality

  The formalism of imprecise probabilities often treats the credal set $\mathcal{C}$ as a black box: inputs evidence, outputs permissible acts. However, the coherence of the decision rules we apply depends entirely on what we believe $\mathcal{C}$ *is*. The tension between the Convexity constraint and the "Somewhere-Best" decision rule (often called E-admissibility or Maximality) reveals a fracture between two competing ontologies: the Ignorance Reading and the Unsharp Reading.

  The **Ignorance Reading** posits that the agent actually possesses a sharp credence function, $P_{true}$, but lacks introspective access to it. $\mathcal{C}$ is a set of candidates; exactly one is the agent's real mind, she just doesn't know which. The **Unsharp Reading** posits that the agent's mind is not sharp. There is no $P_{true}$ hiding in the shadows. The entire set $\mathcal{C}$ is the doxastic state; it is a single, determinate attitude of "range-valued" belief.

  These are not verbal variants because they license different inferences about which probability functions are "in the room." Consider an urn containing 100 balls, either all Red or all Blue, determined by a coin flip you witnessed but forgot the outcome of. On the Ignorance Reading, your credal set contains $P(Red)=1$ and $P(Red)=0$. It does *not* contain $P(Red)=0.5$. You know the coin was fair, but you know the *state of the urn* is deterministic; your uncertainty is about which deterministic state obtains. On the Unsharp Reading, if your evidence supports a range, say $[0, 1]$, then $P(Red)=0.5$ is a valid precisification of your state simply by virtue of being in the interval.

  This distinction drives a wedge between our two formal commitments. The **Somewhere-Best Rule** is naturally motivated by the Ignorance Reading. If $\mathcal{C}$ contains the live candidates for my true sharp self, I should act on any hypothesis that *could* be me. If act $A$ maximizes utility for $P_1$, and $P_1$ might be my true credence, then $A$ is permissible. To forbid $A$ would be to ignore a live possibility about my own epistemic orientation.

  Conversely, **Convexity** is motivated by the Unsharp Reading. If $\mathcal{C}$ represents a single unsharp opinion, it functions like a cloud. If $P_1$ and $P_2$ are compatible with my state, there is no "gap" between them in my opinion space. To deny the mixture $\lambda P_1 + (1-\lambda)P_2$ would be to claim my unsharp state has a hole in it, which contradicts the idea that the set *is* the state. Under the Ignorance Reading, Convexity is unwarranted. If I know my sharp credence is either 0.2 or 0.8, there is no reason to include 0.5 in $\mathcal{C}$. 0.5 is not a candidate for my true sharp state; it is a mathematical average of two candidates.

  The conflict becomes actionable in a decision case. Suppose $\mathcal{C} = \{0.2, 0.8\}$ regarding an event $E$. A bet pays $\$10$ if $E$ is false, costs $\$5$ if $E$ is true.
  *   At $P=0.2$, $EU = (0.8 \times 10) - (0.2 \times 5) = 7$. (Permissible)
  *   At $P=0.8$, $EU = (0.2 \times 10) - (0.8 \times 5) = -2$. (Not optimal)
  Under the Ignorance Reading, $\mathcal{C}$ remains $\{0.2, 0.8\}$. The Somewhere-Best rule permits the bet because $P=0.2$ likes it.
  However, if we enforce **Convexity**, we must add $P=0.5$ to $\mathcal{C}$. Now consider a different act, $B$, which loses $\$1$ if $P(E) \in \{0.2, 0.8\}$ but wins $\$100$ if $P(E) = 0.5$. Under the Ignorance Reading, $P=0.5$ is not in the set, so $B$ is never evaluated against it. Under Convexity, $P=0.5$ is in $\mathcal{C}$. If $B$ maximizes utility at 0.5, the Somewhere-Best rule permits $B$. But the agent who knows her sharp credence is either 0.2 or 0.8 (Ignorance Reading) would view $B$ as a guaranteed loss, since 0.5 is not a live candidate.

  Therefore, we cannot consistently keep both commitments without choosing an ontology. If we adopt the Ignorance Reading to justify Somewhere-Best, we must reject Convexity, as mixtures are not live candidates. If we adopt the Unsharp Reading to justify Convexity, Somewhere-Best becomes too permissive; if my state *is* the whole set, acting on a single precisification ignores the rest of my opinion. To maintain coherence, a theorist must either drop Convexity (accepting non-convex sets of candidates) or drop Somewhere-Best (adopting a rule like Interval Dominance that respects the whole set). We cannot have the ontological security of Ignorance and the topological smoothness of Unsharpness simultaneously.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **A. Ontological Distinction (5 Marks)**
  *   **5:** Clearly distinguishes "Ignorance of sharp state" (one is true, don't know which) from "Unsharp state" (the set is the state). Explains why this matters for set membership.
  *   **3:** Distinguishes them but treats them as merely descriptive differences without implications for set membership.
  *   **0-1:** Conflates the two (e.g., "It just means the agent is unsure"). **Major Penalty:** If the student writes "imprecise credence just means I'm not sure what my credence is" and treats that as a single coherent view, cap this section at 1.

  **B. Concrete Case Construction (5 Marks)**
  *   **5:** Provides a specific scenario (urn, bet, or coin) where the Ignorance Reading excludes a mixture that the Unsharp/Convexity Reading includes. Shows how this changes the available acts.
  *   **3:** Provides a scenario but fails to show how the set membership differs between readings.
  *   **0-1:** No concrete case, or the case is irrelevant (e.g., standard Ellsberg without modification).

  **C. Mapping Rules to Ontologies (5 Marks)**
  *   **5:** Correctly identifies that Somewhere-Best aligns with Ignorance (acting on live candidates) and Convexity aligns with Unsharpness (the set as a continuous object).
  *   **3:** Identifies one alignment correctly but misses the other.
  *   **0-1:** Claims both rules fit both readings equally well, or reverses the alignment without justification.

  **D. Resolution/Argument (5 Marks)**
  *   **5:** Concludes that the two commitments are in tension/incompatible. Argues that keeping both requires ignoring the ontological implications (e.g., allowing "ghost" probabilities like 0.5 to drive decisions).
  *   **3:** Notes the tension but concludes they can be kept together without cost.
  *   **0-1:** No conclusion, or concludes based on irrelevant grounds (e.g., "math is hard").

  **Specific Grading Notes:**
  *   **The "Unsure" Penalty:** If the student treats the credal set *only* as a measure of psychological confidence ("I'm not sure") rather than a structural claim about the state of opinion, deduct 5 marks from the Total. This is the specific conceptual error the question is designed to catch.
  *   **Formalism:** Minor mathematical errors in the bet calculation should not be penalized heavily if the logical structure of the argument is sound. This is a philosophy exam, not a math exam.
  *   **Word Count:** Answers significantly under 600 words likely lack the necessary depth; answers over 1000 words may be penalized for lack of concision (1 mark deduction).
