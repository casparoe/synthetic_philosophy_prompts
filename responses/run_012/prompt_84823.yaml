  **Office of the Registrar: Academic Policy FAQ (Updated Fall Semester)**

  Following Faculty Senate Resolution 204-B, the University has adopted a dialetheist framework for specific academic regulations. This document clarifies compliance procedures regarding truth-value assignments in the Academic Catalog.

  **1. What is the status of contradictory regulations?**
  Select contradictions within the Academic Catalog are now designated as true. This does not imply that all contradictions are true. The office distinguishes between *trivialism* (where every statement is true) and *dialetheism* (where some contradictions are true). The University remains a non-trivialist institution. Regulatory statements retain standard truth values unless marked with the sigma symbol (σ). Students cannot assume inconsistency grants automatic compliance; only designated contradictions possess dual truth values. This policy was reviewed and ratified by the Faculty Senate Committee on Structural Logic. Administrative authority remains intact despite local inconsistencies.

  **2. Is this the same as a statement being neither true nor false?**
  No. Claims that are neither true nor false constitute truth-value gaps, which remain subject to standard administrative dismissal. The dialetheist policy concerns truth-value gluts, where a proposition and its negation are both true. For example, a course prerequisite may be simultaneously required and waived. Students submitting appeals based on truth-value gaps rather than designated gluts will be processed under standard denial protocols. Do not conflate ambiguity with dialetheia. See Section 4.2 of the Student Conduct Code for definitions of administrative ambiguity.

  **3. If a regulation is contradictory, does anything follow?**
  No. The inference rule known as *explosion* (ex contradictione quodlibet) is suspended for University adjudications. The presence of a true contradiction does not entail arbitrary conclusions, such as automatic graduation or tuition forgiveness. Furthermore, the rule of disjunctive syllogism fails in these instances. If a regulation states "Withdrawal is permitted OR tuition is owed," and both are true, the falsity of one does not confirm the other. Students inferring universal entitlements from local contradictions will be referred to Academic Advising for remedial logic counseling. The failure of explosion is a feature of the policy, not an oversight.

  **4. How are appeals adjudicated under this policy?**
  Appeals involving designated contradictions may receive dual rulings. In Case #99204, a late-withdrawal petition was simultaneously upheld and dismissed. The student's transcript reflects both a withdrawal code and a final grade. This is not a clerical error. The status is stable. Students seeking to resolve this ambiguity into a single truth value will be informed that no resolution exists. The dual status satisfies regulatory requirements for both attendance and completion. Grading committees are instructed to record both outcomes without attempting reconciliation.

  **5. Are there negative consequences to this policy?**
  Yes. Certain external agencies do not recognize dialetheist records. Financial aid disbursements may be paused if enrollment status is processed as both full-time and part-time. Tuition liability may remain indefinitely ambiguous. The University accepts no responsibility for delays caused by external systems unable to process true contradictions. Students are advised to maintain liquidity reserves to cover potential dual tuition assessments. See Memo 88-C regarding Bursar Office limitations on contradictory billing cycles.

  **6. How do I schedule a consultation?**
  Students and advisers may request a fifteen-minute appointment to discuss specific contradictions. Appointments are not guaranteed to resolve inconsistencies. Please bring Form 12-D (Truth-Value Declaration), Form 9-B (Liability Waiver), and a printed copy of the relevant Catalog section. Walk-ins are not accepted. Submit requests via the portal under "Logical Adjudication." Processing times may vary based on paradox density.
