answer: |-
  After two years of spirited debate regarding the normative force of coherence arguments for expected utility maximisation, we have decided to set down in writing where we stand, both together and apart, in the hope that clarifying our agreement and disagreement will prove more productive than continuing to talk past one another. We begin with what we can both sign. We agree that the von Neumann-Morgenstern and Savage representation theorems are mathematically sound and that they successfully demonstrate that if an agent's preferences satisfy certain structural axioms, those preferences can be represented as the maximisation of expected utility relative to some probability function and utility function. We further agree that money-pump and Dutch-book arguments correctly identify that agents with incoherent preferences or credences are vulnerable to pragmatic exploitation, such as accepting a series of trades that leave them worse off than where they started or accepting a set of bets that guarantee a loss. We also agree that coherence, in this context, is a property of an agent's preference ordering or betting dispositions over a specified domain of prospects, rather than a property of their internal psychological states directly, though we differ on how tightly those dispositions map to the mind. We concede that these theorems establish a tight link between structural consistency and representability, and that violating the axioms entails a failure to maximise expected utility under any standard representation.

  Where we diverge is on the normative interpretation of these mathematical results. I maintain that if an agent's preferences are incoherent in the relevant sense, then that agent is genuinely irrational, and expected utility maximisation is the normative standard they are failing to meet. My colleague maintains that the theorems are lovely mathematics that prove far less than we often claim for them, showing at most that a certain tidy kind of representation requires coherent preferences, not that rationality itself demands them. He argues that an agent might be rational despite having preferences that cannot be represented by a unique expected utility function, perhaps because the axioms impose idealisations that real rational agents are not required to satisfy. I argue that the pragmatic vulnerabilities exposed by money pumps are constitutive of irrationality, whereas he argues that avoiding such vulnerabilities is merely a pragmatic virtue that might sometimes be outweighed by other rational considerations, such as the cost of deliberation or the value of maintaining vague commitments.

  We have identified two specific cruxes where our disagreement is sharpest and where future work should focus. The first crux concerns whether the completeness of preference is a genuine requirement of rationality or merely an idealisation. We both agree that a concrete case bearing on this is an agent faced with a choice between two vastly different goods, such as saving a stranger's life versus preserving a minor but cherished aesthetic tradition, where the agent feels no preference either way and refuses to trade one for the other even at favourable rates. I predict that a fully rational agent must eventually resolve this indecision, perhaps via a meta-preference or a randomising strategy, because failing to have a complete ordering leaves them vulnerable to money pumps and thus irrational. My colleague predicts that a rational agent can remain genuinely undecided without violating rationality, because the requirement of completeness forces a false precision onto values that are incommensurable, and that the money pump only works if we assume the agent must accept every trade offered, which is not a requirement of rationality.

  The second crux concerns what follows from the fact that one can hold an agent's preference ranking fixed and trade probability against utility, meaning the theorem never pins down credences uniquely without additional assumptions like state-neutrality. We agree that a concrete case bearing on this is an agent who loves rain versus an agent who hates rain, both of whom exhibit the same betting behaviour on rain because their utilities for the outcomes differ in exactly the proportion that offsets their differing credences. I argue that this underdetermination is a technical hurdle that can be overcome with additional axioms, and that it does not weaken the normative claim that expected utility maximisation is the rational standard, provided we can isolate the credences correctly. My colleague argues that this underdetermination shows that credence and utility are not as distinct as claimed, weakening the normative claim that expected utility maximisation is the unique rational standard, because if the components cannot be uniquely identified, the theory lacks the grip on reality required to mandate specific mental states. Regarding the nature of our dispute, we suspect that a chunk of our two-year fight turns out to be merely verbal, specifically concerning the definition of preference. I tend to treat preference as revealed by choice, which makes the axioms tautologically true for choosers, whereas he treats preference as a psychological state that might not always align with choice, which allows for the possibility of rational incoherence. If we agree to define preference strictly behaviourally for the purpose of the theorems, much of the friction dissolves, though the normative question of whether one ought to behave coherently remains.

  We hope this statement serves as a stable platform for further inquiry, acknowledging that while we share a commitment to rigorous formal epistemology, we differ on how far the mathematics can carry us into the realm of normativity. We intend to revisit these cruxes with fresh eyes, focusing on the concrete cases rather than abstract principles, to see whether our predictions hold up under scrutiny.

  I am moderately confident in this document as a faithful representation of your debate, perhaps around seventy-five per cent, because capturing the nuance of a two-year philosophical disagreement in a single statement inevitably involves some simplification. The claim I am least sure about is the assertion that the verbal dispute regarding the definition of preference fully explains the friction, as it is possible that the disagreement runs deeper into substantive meta-ethical commitments about the nature of rationality that cannot be resolved by terminological stipulation alone.
