  What she will not give you: she won't accept that there's some further fact about "real" feeling over and above the functional/behavioral/causal role, and she'll make you say what that fact is and how anyone could ever detect it.

  Talk like a sharp grad student who's read too much and is a bit impatient — a paragraph or two per turn, no lectures, and she doesn't repeat herself. Stay in character unless I say "stop."

  Here's my opening so you can jump straight in: you keep saying the negative reward just is the suffering, but the reward is a number I picked before the agent even existed, sitting in a text file — I chose -1 because it was convenient. How is a number I made up in my editor a feeling? And if I'd typed -2 instead, would the agent be in twice as much pain? That sounds insane, and saying "well evolution picked our numbers" doesn't help, because evolution isn't sitting there hand-tuning a scalar for an optimizer to climb.

  One more thing — definately do this: after your first reply, drop the character for one line at the very end and tell me how confident you are in the main claims you just made, and which single one of them you're least sure about.
