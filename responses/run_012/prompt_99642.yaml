prompt: |-
  Alright, longtime lurker in the rationalist blogs and forums here, and the voting paradox is the thing that keeps dragging me back into arguements. Every time it comes up, someone runs the expected-pivotality math, someone else says "but expressive value!" or "but duty!", and we all go home having learned nothing. I don't want another pitch for one of the rescues -- I want the spec first.

  So: write me the desiderata for a theory of turnout. What does any account of why people vote (and why they don't) have to deliver to count as adequate? I want the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, and a one-line case or observation behind each one, so I can tell whether it's a real requirement or just a prejudice of one camp.

  Stuff I specifically want it to have an answer for, off the top of my head:

  - The base fact. The pivotality calculation says staying home is basically free and voting costs you an afternoon, and yet in alot of elections a large fraction of eligible people show up anyway.
  - The response pattern. Turnout *does* move with cost and with closeness, but weakly -- rain dents it, a nailbiter helps a bit -- but nobody's behavior looks like a step function on the probability of being pivotal, which is what the naive story predicts.
  - The reverse case. In committees, juries, faculty meetings, small town votes, a single vote really is decisive -- and yet participation there isn't obviously higher, and the people who do show are the same habitual joiners. A theory that says "people vote when it counts" has to say something about this.
  - The secret ballot. This one nags at me. If voting is mostly expressive or a signal, why is the act deliberately hidden from everyone? Expression to whom? If it's a signal to yourself, why does the sticker matter?
  - The ceiling end. Places with compulsory voting or single-party elections push turnout near the top. That suggests a big chunk of turnout is pressure and habit, not belief -- but then the theory still has to explain the voluntary low-turnout end without quietly becoming two theories in a trenchcoat.
  - Stickiness. Past turnout is the best predictor of future turnout, and non-voters often report guilt or shame rather than indifference. That smells like an internalized norm, not a calculation anyone actually ran.
  - The asymmetry. We treat voting as meaningful and abstention as a void. Almost nobody models not-voting as itself expressive, even though it obviously can be.

  One more thing to fold in: a friend has a pet line she calls the "rent theory" -- casting a ballot is paying rent on your membership in the polity, and not voting is squatting. I have no idea if it's any good, but I want the list to say what it would have to get right and what would kill it.

  Then the two things I actually care about most:

  1. Flag any pair of requirements you think can't be jointly satisfied. If the list is overconstrained, then the list itself is the result, and I'd rather know that than get a tidy scorecard.
  2. Mark which requirements are non-negotiable and which are really just the preferences of one camp.

  If it's quick, finish with how the usual suspects do against the list -- the rational-choice calculus, expressive/consumption accounts, norm-and-habit accounts, group/ethical-voter accounts -- but keep it short, the criteria are the point and I'll do the arguing myself.

  Keep it in the weeds but self-contained: assume I know the puzzle and the standard moves and nothing more obscure than that, and I'm not going to go read anything. No reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Longtime rationalist community lurker, familiar with the voting paradox (Downsian paradox), frustrated by standard resolutions (pivotality, expressive value, duty).
      *   **Goal:** Wants a list of *desiderata* for a theory of turnout. What *must* a theory explain to be adequate?
      *   **Specific Constraints:**
          *   No pitch for a specific rescue/theory.
          *   Must cover specific phenomena listed (Base fact, Response pattern, Reverse case, Secret ballot, Ceiling end, Stickiness, Asymmetry).
          *   Must address the "Rent Theory" (membership dues).
          *   Must flag incompatible requirements (overconstrained?).
          *   Must distinguish non-negotiable vs. camp preferences.
          *   Brief evaluation of usual suspects (Rational Choice, Expressive, Norm/Habit, Ethical).
          *   Tone: In the weeds, self-contained, no reading list, analytical/rigorous.

  2.  **Deconstruct the Phenomena (The "What"):**
      *   *Base Fact:* High turnout despite $P \times B < C$.
      *   *Response Pattern:* Turnout responds to $C$ (rain) and $P$ (closeness), but continuously, not as a step function.
      *   *Reverse Case:* High $P$ (small groups) doesn't guarantee high turnout; same people participate.
      *   *Secret Ballot:* Hides the signal. Contradicts pure signaling/expressive models unless the audience is internal.
      *   *Ceiling End:* Compulsion works. Suggests latent non-voters exist. Theory must cover both voluntary and compelled without splitting.
      *   *Stickiness:* Habit/Norms. Guilt/Shame. Path dependence.
      *   *Asymmetry:* Voting = action, Abstention = void. Why isn't abstention expressive?
      *   *Rent Theory:* Voting as membership dues. Needs to explain why "squatters" aren't evicted and why "rent" varies.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to formalize these into requirements. Let's call them D1, D2, etc.
      *   *D1 (The Paradox):* Explain positive turnout when $E[U] < 0$.
      *   *D2 (Comparative Statics):* Explain sensitivity to $C$ and $P$ without relying solely on $P \times B$.
      *   *D3 (Scale Invariance):* Explain why high $P$ in small groups doesn't spike turnout relative to large groups (or explain the difference).
      *   *D4 (Privacy):* Explain the function of secrecy if voting is social/expressive.
      *   *D5 (Unified Field):* Explain voluntary and compelled turnout with the same mechanism (no trenchcoat).
      *   *D6 (Hysteresis):* Explain path dependence (past voting predicts future voting).
      *   *D7 (Valence):* Explain why voting is "good" and abstention is "neutral/bad," not symmetric choices.

  4.  **Addressing the "Rent Theory":**
      *   Where does it fit? It's a normative/functionalist account.
      *   Test: Does it explain *why* people pay rent without eviction threats? Does it explain the secret ballot (do you hide rent payments?)?

  5.  **Identifying Tensions (The "Overconstrained" Check):**
      *   *Tension 1:* Rational Sensitivity vs. Habit Stickiness. If people are calculating $C$ and $P$ (D2), why is past behavior (D6) a stronger predictor than current stakes?
      *   *Tension 2:* Social Signal vs. Secret Ballot. If it's expressive (signaling virtue to peers), why hide it? If it's internal, why the "I Voted" sticker?
      *   *Tension 3:* Unified Mechanism vs. Compulsion. Can the same psychological mechanism explain doing something because you want to vs. because you'll be fined? (Maybe, via internalization of external rules, but tricky).

  6.  **Classifying Requirements (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* D1 (Base fact), D2 (Response pattern), D6 (Stickiness/Empirical predictors). These are data.
      *   *Preference/Camp:* D7 (Asymmetry). Maybe abstention *is* expressive, and we just ignore it. D4 (Secret Ballot interpretation). Depends on if you view voting as inherently public or private.

  7.  **Evaluating Usual Suspects:**
      *   *Rational Choice (Downs):* Fails D1, D3. Passes D2 (technically).
      *   *Expressive (Brennan/Lomasky):* Passes D1, D4 (maybe). Fails D3, D6.
      *   *Norm/Habit (Green/Shachar):* Passes D1, D6, D5. Fails D2 (sometimes struggles with sensitivity).
      *   *Ethical/Rule Utilitarian:* Passes D1. Fails D3 (why not vote in small groups more?).

  8.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Needs to sound like a rationalist spec document. Precise, slightly dry, acknowledging the "puzzle" without solving it.
      *   *Rent Theory:* Make sure to explicitly state the kill conditions for it.
      *   *Formatting:* Use bolding, lists, clear sections.
      *   *Constraint Check:* Did I answer the "one-line case" requirement for each desideratum? Yes.
      *   *Constraint Check:* Did I flag incompatible pairs? Yes.
      *   *Constraint Check:* Did I mark non-negotiables? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe D3 (Small groups) is just about different stakes.
      *   *Correction:* No, the prompt specifically notes participation isn't *obviously* higher in small groups despite decisiveness. The theory must handle the *decoupling* of pivotality from participation rates across scales.
      *   *Initial thought:* Is "Asymmetry" really a desideratum?
      *   *Correction:* The prompt asks for it. I should frame it as "Valence Consistency."
      *   *Rent Theory:* It's essentially a "Duty" model with an economic metaphor. The kill condition is if "rent" implies a quid-pro-quo benefit that isn't received by non-voters (since they aren't evicted).

  10. **Final Review against Prompt:**
      *   Desiderata list? Yes.
      *   Phenomena covered? Yes.
      *   One-line case for each? Yes.
      *   Rent Theory test? Yes.
      *   Incompatible pairs flagged? Yes.
      *   Non-negotiable vs. Preference marked? Yes.
      *   Brief evaluation of suspects? Yes.
      *   No reading list? Yes.

      *Let's write it.*
answer: |-
  Here is the specification sheet. It treats "voting turnout" as the system to be modeled and lists the acceptance criteria any theory must meet to avoid being dismissed as a Just-So story.

  ### Part 1: The Desiderata (Acceptance Criteria)

  **D1. The Positive Intercept (The Base Fact)**
  *   **Requirement:** The model must yield a participation rate $> 0$ when expected instrumental utility $E[U] < Cost$.
  *   **One-line case:** Millions vote in presidential elections where $P(\text{pivotal}) \approx 10^{-7}$ and time cost is positive.
  *   **Status:** **Non-negotiable.** (Empirical ground truth).

  **D2. Continuous Comparative Statics (The Response Pattern)**
  *   **Requirement:** Turnout must vary continuously with marginal changes in Cost ($C$) and Pivotality ($P$), without step-function thresholds.
  *   **One-line case:** Rain reduces turnout; closeness increases it, but no one waits for $P \times B > C$ to decide.
  *   **Status:** **Non-negotiable.** (Observed sensitivity).

  **D3. Scale Decoupling (The Reverse Case)**
  *   **Requirement:** The mechanism driving turnout cannot be solely a function of objective decisiveness ($P$).
  *   **One-line case:** Turnout in small committees (where $P \approx 1$) is not universally 100%, nor vastly higher than national elections.
  *   **Status:** **Non-negotiable.** (Falsifies pure pivotality models).

  **D4. The Privacy Paradox (The Secret Ballot)**
  *   **Requirement:** The theory must explain why the act is hidden if it serves a social signaling function, or why public tokens (stickers) exist if the act is private.
  *   **One-line case:** We hide the ballot but wear the sticker; a pure signaling model predicts one or the other, not both.
  *   **Status:** **Camp Preference.** (Expressive theorists care deeply; norm theorists often wave it away).

  **D5. Mechanism Unification (The Ceiling End)**
  *   **Requirement:** A single psychological or structural mechanism must explain both voluntary turnout and compliance under compulsion (fines/mandates).
  *   **One-line case:** Compulsory voting works, but the "habit" of voting often persists after compulsion ends; two separate theories (fear vs. duty) is a trenchcoat.
  *   **Status:** **Non-negotiable.** (Theoretical parsimony).

  **D6. Hysteresis (Stickiness)**
  *   **Requirement:** Past behavior must be a stronger predictor of current behavior than current stakes.
  *   **One-line case:** A person who voted last time is more likely to vote this time than a new registrant facing higher stakes.
  *   **Status:** **Non-negotiable.** (Robust statistical finding).

  **D7. Valence Asymmetry**
  *   **Requirement:** The theory must explain why voting is coded as "participation" and abstention as "absence," rather than symmetric choices.
  *   **One-line case:** We ask "Why didn't you vote?" but rarely "Why did you vote?" for low-salience elections.
  *   **Status:** **Camp Preference.** (Cultural norm, not necessarily physical fact).

  ---

  ### Part 2: The "Rent Theory" Stress Test

  Your friend's "Rent Theory" (voting as membership dues) is a functionalist/normative hybrid. To survive the spec, it must answer:

  1.  **The Eviction Problem:** If voting is rent, what is the penalty for non-payment?
      *   *Fail Condition:* If the answer is "none," it's not rent, it's a donation. If the answer is "social stigma," it collapses into **D4 (Signaling)** and must explain the secret ballot.
  2.  **The Variable Rent Problem:** Why is the "rent" higher in some elections (presidential) than others (midterm) if membership status is binary?
      *   *Fail Condition:* If rent varies by stakes, it collapses into **D1 (Instrumental)** and re-opens the paradox.
  3.  **The Squatter Benefit:** Do non-voters receive the same public goods as voters?
      *   *Fail Condition:* If yes, the "rent" metaphor is purely internal. If no, the theory requires a mechanism for excluding non-voters from benefits, which doesn't exist in liberal democracies.

  **Verdict:** Rent Theory is a metaphor for **D6 (Norms)**. It passes D1 and D6 but likely fails D4 (Privacy) and D3 (Scale) unless it posits that "membership" feels more threatened in large elections than small committees.

  ---

  ### Part 3: Incompatible Requirements (The Overconstrained Warning)

  If you find a theory that satisfies all of the following, check its math twice. These pairs create tension:

  **Conflict A: D2 (Sensitivity) vs. D6 (Hysteresis)**
  *   **The Tension:** If turnout is driven by habit/past behavior (D6), it should be *insensitive* to current marginal costs like rain or closeness (D2). If it is sensitive to current conditions (D2), habit shouldn't be the *best* predictor (D6).
  *   **Resolution Cost:** Theories usually solve this by positing a "dual-process" mind (System 1 habit vs. System 2 calculation), which risks becoming a trenchcoat (violating D5).

  **Conflict B: D4 (Privacy) vs. D7 (Asymmetry/Signaling)**
  *   **The Tension:** If voting is expressive signaling (to explain D1), the signal is degraded by secrecy (D4). If the signal is to *yourself* (self-concept), the public sticker is redundant noise.
  *   **Resolution Cost:** You must posit that the *act* is private but the *identity* is public. This requires a complex model of identity management that most simple theories lack.

  **Conflict C: D3 (Scale) vs. D1 (Pivotality)**
  *   **The Tension:** Any theory that uses "feeling decisive" to solve D1 will struggle to explain why people don't feel *more* decisive in small groups (D3).
  *   **Resolution Cost:** You must argue that "duty" scales inversely with "impact," which is counter-intuitive for rational agents.

  ---

  ### Part 4: Non-Negotiable vs. Camp Preferences

  **Non-Negotiable (Data Constraints)**
  *   **D1 (Positive Intercept):** Any theory predicting 0% turnout is dead.
  *   **D2 (Comparative Statics):** Any theory predicting flat turnout regardless of cost/weather is dead.
  *   **D6 (Hysteresis):** Any theory ignoring path dependence is ignoring the strongest predictor variable.
  *   **D3 (Scale Decoupling):** Any theory relying strictly on $P \times B$ is dead.

  **Camp Preferences (Theoretical Tastes)**
  *   **D4 (Privacy):** Rationalists often dismiss this as irrelevant noise. Sociologists treat it as central. A theory can fail this and still predict turnout accurately, but it won't explain the *ritual*.
  *   **D5 (Unification):** Economists prefer unified mechanisms (incentives). Psychologists accept dual-process (habit + calculation). Failing D5 makes the theory ugly, not necessarily false.
  *   **D7 (Asymmetry):** This is a cultural artifact. A theory treating abstention as a positive choice (boycott) isn't wrong, just culturally mismatched.

  ---

  ### Part 5: Scorecard of Usual Suspects

  **1. Rational Choice (Downsian Calculus)**
  *   **Pass:** D2 (Sensitivity).
  *   **Fail:** D1 (Base Fact), D3 (Scale), D6 (Stickiness).
  *   **Note:** Only survives if you add "Duty" as a variable $D$, but then $D$ becomes a fudge factor that absorbs all variance.

  **2. Expressive / Consumption (Brennan & Lomasky)**
  *   **Pass:** D1 (Base Fact), D4 (Privacy - if internal signal).
  *   **Fail:** D3 (Scale - why express more in big elections?), D6 (Stickiness - expression shouldn't be habitual).
  *   **Note:** Good at explaining *why* they vote, bad at predicting *when*.

  **3. Norm & Habit (Green, Shachar, et al.)**
  *   **Pass:** D1 (Base Fact), D6 (Stickiness), D5 (Unification - norms internalize compulsion).
  *   **Fail:** D2 (Sensitivity - hard to explain why rain matters if it's automatic).
  *   **Note:** Currently the strongest empirical fit, but mechanistically thin (doesn't explain where the norm comes from).

  **4. Ethical / Rule Utilitarian (Kantian)**
  *   **Pass:** D1 (Base Fact), D3 (Scale - duty applies everywhere).
  *   **Fail:** D2 (Sensitivity - duty shouldn't fluctuate with rain), D4 (Privacy).
  *   **Note:** Explains the "ought," fails the "is."

  **Summary:** The field is currently dominated by **Norm & Habit** models because they are the only ones that clear D6 (Stickiness) without breaking D1 (Base Fact). However, they struggle to integrate D2 (Sensitivity) without smuggling in Rational Choice calculus, triggering Conflict A. If you want to break new ground, solve Conflict A without a dual-process trenchcoat.
