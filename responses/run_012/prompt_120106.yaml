answer: |-
  "The board says 0.62 and 0.41," A said, tapping the screen. "That's not variance. That's a violation."

  B leaned back, arms crossed. "It's twenty flips total, split between us. Of course there's variance."

  "It's Aumann's Agreement Theorem," A snapped. "Common prior: the three coins, uniform distribution. Common knowledge of rationality: we both know we're Bayesians. We've announced our posteriors. They are now common knowledge. Therefore, they must be identical. They aren't. So one of us is irrational, or lying, or computing wrong."

  "Or," B said, "you're treating a theorem about ideal agents as a traffic law for humans."

  "It's not about humans, it's about logic. If we share a prior and differ, we must be missing information the other has. So we update. I see your 0.41, I should slide down. You see my 0.62, you slide up. We meet in the middle. Instead, you're digging in."

  "I'm not digging in. I'm saying the conditions aren't met. We know each other's numbers, sure. But do we have *common knowledge* of each other's rationality? I know you're rational. You know I'm rational. But do I know that you know that I know? The theorem requires an infinite regress of mutual knowledge. We have maybe two levels."

  A scoffed. "That's semantic hair-splitting. If you accept the prior and the math, you accept the conclusion. So tell me: which assumption fails? Is it the prior? Do you think I'm weighting the 0.7 coin wrong? Is it rationality? Do you think I'm botching the binomial likelihoods? And crucially: can you tell from the inside which one it is?"

  B paused. "No. I can't tell from the inside. That's the point. If I could identify the specific computational error, I'd fix it. But the failure isn't a specific bug; it's the architecture. We don't have access to each other's information partitions. I see your number, not your flips. I don't know if your 0.62 comes from seven heads or six heads and a typo."

  "So we pool," A said. "We treat the numbers as sufficient statistics. If we don't, we're leaving accuracy on the table. If you claim the theorem doesn't apply, are you just changing the subject? Is 'the idealization never quite holds' a get-out-of-jail-free card for stubbornness?"

  "No," B said, leaning forward. "It's a domain boundary. Saying Newtonian physics doesn't apply at relativistic speeds isn't changing the subject; it's preventing errors. If we pretend common knowledge holds when it doesn't, we risk double-counting evidence or converging on the wrong value. Persistent disagreement between honest Bayesians isn't a paradox; it's the normal case when communication is bandwidth-limited."

  "But we *are* bandwidth-limited," A argued. "That's why we post numbers. If we wait for infinite recursion, we never bet. I'm saying the honest move is to act *as if* the theorem holds. Shift toward me. I'll shift toward you. Iterate."

  "And if I shift toward you, and you haven't shifted toward me because you think I'm irrational, we've just introduced noise," B countered. "You asked if I can tell from the inside which assumption fails. I can't. But I know that assuming common knowledge of rationality when we only have mutual knowledge creates a false equilibrium. You want me to update on your posterior. I should update on the fact that you *have* a posterior, given your private data. But I don't know your data."

  "So we're stuck?"

  "We're calibrated," B said. "Your 0.62 suggests heads. My 0.41 suggests tails. Combined, we probably have eleven heads out of twenty. That pushes the true bias toward 0.7. Your number is closer to the truth than mine. But I couldn't know that without seeing your flips. Aumann says we should agree. I say we should share data. Until then, the disagreement isn't a scandal. It's a signal."

  A looked at the board, then at B. "Fine. Send me your raw flips. I'll send you mine. Then we'll see if the theorem holds."

  "Then we'll see if the data does," B said.
