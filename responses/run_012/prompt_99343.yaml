      *   *Defenses of IA:*
          1.  *Money Pump/Dutch Book:* Violating IA makes you susceptible to sure losses (dynamic inconsistency).
          2.  *Sure-Thing Principle (Savage):* If you prefer $A$ to $B$ given event $E$, and prefer $A$ to $B$ given $\neg E$, you should prefer $A$ to $B$ unconditionally. Common consequence is irrelevant.
          3.  *Representation Theorem:* IA is necessary for a linear utility function over probabilities. Without it, no EU representation.
          4.  *Separability:* Preferences should depend only on states where outcomes differ.
          5.  *Normative Ideal:* Rationality is about coherence, not describing psychology.

      *   *Attacks on IA:*
          1.  *Allais Paradox (Common Consequence Effect):* People prefer certainty over high probability, but switch when both are scaled down. Violates IA.
          2.  *Complementarity/Regret:* The value of an outcome depends on what *could* have happened (Loomes & Sugden).
          3.  *Resolution-Sensitivity/Information Value:* Timing of resolution matters (Kreps-Porteus).
          4.  *Framing/Description:* How the lottery is described changes preference (violates description invariance).
          5.  *Money Pump Counter:* Requires dynamic inconsistency + lack of self-binding/naivety. Sophisticated agents can avoid pumps.
