answer: |-
  This is a precise and fertile set of constraints. You are asking to treat the German *Kirchensteuer* not as a bureaucratic oddity but as a stress test for liberal political theory. The German model is often dismissed by Anglo-American observers as a violation of separation, yet it persists with democratic legitimacy. To understand why, we must run it through your three frameworks without flinching from the contradictions they reveal.

  ### I. Neutrality: Evenhandedness vs. Abstention

  If we apply the **neutrality as abstention** reading, the German case is a categorical failure. The state is not merely refraining from hindering religion; it is acting as the collection agency for religious bodies. The tax office performs the work of the tithe. Under this reading, Germany looks indistinguishable from a theocracy, or at best a soft establishment. This framework captures the visceral reaction of an American observer: the state should not be in the business of moving money from a citizen's pocket to a bishop's account. However, this reading distorts the German reality by assuming that "support" implies "endorsement." In Germany, the collection is a service provided to a corporation under public law, akin to withholding union dues or broadcasting fees. Abstentionism falls silent on the question of *cooperation*. It cannot account for a state that views religious bodies as partners in social welfare (running kindergartens, hospitals, elder care) rather than merely private clubs.

  If we apply **neutrality as evenhandedness**, the German case becomes legible, but only partially. The state supports religion, but it does so for all recognized bodies on comparable terms (Catholic, Protestant, Jewish, and some Free Churches). The fee taken by the state is uniform; the rate is set by the churches but collected uniformly. This captures the internal logic of the system: the state is a neutral platform upon which recognized religious corporations operate.

  However, this framework distorts the picture by masking the barrier to entry. Evenhandedness implies a level playing field, but the status of "corporation under public law" is not easily attained. It requires a guarantee of permanence and loyalty to the legal order that effectively excludes newer religious movements, particularly Islamic organizations, which often lack the centralized hierarchy the German bureaucracy requires. So, the state is evenhanded only among the historical incumbents. Neutrality here is not about the relationship between state and *faith*, but between state and *institution*.

  **The Foils:**
  *   **France:** The 1905 law aims for abstention but fails in Alsace-Moselle, where the state pays clergy salaries. Here, evenhandedness is impossible because the state is the payer, not the collector. The state chooses which clergy to pay.
  *   **USA:** Theoretically abstentionist, but the property tax exemption functions as a subsidy. If neutrality is evenhandedness, the US exemption is defensible (all non-profits get it). If neutrality is abstention, the exemption is suspect (it shifts the tax burden to others).

  **Verdict:** Neutrality as abstention is useless for Germany; it simply condemns the system without explaining its stability. Neutrality as evenhandedness explains the mechanism but hides the exclusivity of the "public law" club.

  ### II. The Establishment Vector

  Your four-dimensional vector (Symbolic, Financial, Institutional, Coercive) is the most diagnostic tool of the three. It allows us to stop asking "Is Germany established?" and start asking "How?"

  1.  **Symbolic:** Low to Medium. There is no state church. The Basic Law invokes "responsibility before God," and crucifixes appear in some public spaces (Bavaria), but the state does not prescribe dogma.
  2.  **Financial:** High. This is the spike in the vector. The state collects the revenue. This is a deeper entanglement than the US property exemption, which is a passive foregone revenue. Germany actively processes religious dues.
  3.  **Institutional:** High. The churches are part of the public law architecture. They run state-funded theology faculties at public universities. They provide chaplaincies in the military and hospitals. They are woven into the administrative state.
  4.  **Coercive:** Medium. This is the contested dimension. The tax is mandatory *conditional* on membership. But membership is often default (baptism) and exit requires a civil act.

  **Captures vs. Distorts:**
  This framework captures the *texture* of the establishment. It explains why the system feels oppressive to an outsider (High Financial/Coercive) but functional to an insider (High Institutional utility). It prevents the conflation of "state funding" with "state control." In Germany, the Financial dimension is high, but because the Institutional dimension grants the churches autonomy, the state collects the money but cannot dictate how it is spent.

  **Silences:**
  The vector treats the dimensions as additive, but they may be compensatory. One could argue that the High Financial/Institutional engagement is tolerated *because* the Symbolic engagement is Low. The state doesn't tell you what to believe; it just helps the church bill you. Furthermore, the vector falls silent on *legitimacy*. A system could score high on all four and be popular, or low on all four and be hated. The vector describes the anatomy but not the physiology.

  **The Foils:**
  *   **Alsace-Moselle:** Scores higher on Financial (state salaries) and Institutional (state appointment influence), but arguably lower on Coercive regarding the individual taxpayer, since the funding comes from the general budget, not a line-item surcharge.
  *   **USA:** Low on Financial and Institutional, Low on Coercive, but Medium on Symbolic ("In God We Trust," chaplains in Congress). The US vector shows that you can have a strong religious culture with a weak establishment vector, whereas Germany has a strong vector with a secularizing culture.

  ### III. The Exit Condition

  This is the claim that requires the most pressure. The argument is that a religiously entangled state is tolerable if exit is cheap. If you can leave the church, the tax is voluntary.

  **How cheap is exit in Germany?**
  *   **Bureaucratic Cost:** Moderate. You must appear in person before a registrar or court (*Amtsgericht*). There is a fee (€30–€100 depending on the state). This is not prohibitive, but it is a "hassle tax" designed to prevent casual fluctuation.
  *   **Canonical Cost:** High. Deregistration is treated by the churches as apostasy. You are barred from sacraments (Communion, Godparenthood). In a Catholic context, you cannot have a church funeral. This is not a financial cost, but a spiritual one.
  *   **Social Cost:** Variable but potent. In rural or highly confessional areas, leaving the church is a public signal of secularization or dissent. It can affect social standing, and in some cases, employment (if working for church-affiliated institutions, which are vast).

  **The Pressure Test:**
  The "cheap exit" defense relies on a liberal conception of cost: time and money. It ignores *communal* cost. If exit requires you to sever ties with your community's spiritual infrastructure, exit is not cheap; it is exile. The German courts treat deregistration as an all-or-nothing withdrawal from the *body*, not just the *bill*. You cannot say, "I am a Catholic but I refuse to pay." You must say, "I am no longer a Catholic." This forces a choice between conscience and wallet that a true "cheap exit" model would not require.

  **The Alsace-Moselle Comparison:**
  This comparison complicates the exit defense. In Alsace, the clergy are state-salaried. The funding is not a surcharge on your income tax bill; it is part of the general budget.
  *   **In Germany:** Exit stops *your* money from going to the church. You are no longer complicit.
  *   **In Alsace:** Exit (from the religion) does not stop the state from paying the priest, because that money comes from the general pot. You cannot opt out of the subsidy via tax deregistration.
  *   **Result:** Paradoxically, the German model offers a *cleaner* moral exit than Alsace, even if the bureaucratic hurdle is higher. In Germany, you can wash your hands of the funding. In Alsace, you remain a funder of the clergy even if you are not a member. Therefore, the "cheap exit" defense works *better* for the German tax than for the Alsatian salary system, provided you accept the canonical costs.

  ### IV. The Master Concept: Neutrality vs. Exit

  You asked what this shows about the master concept. Here is the candid assessment: **Neutrality is doing almost no work here that the Exit condition is not already doing.**

  If exit were truly impossible, the German system would be indefensible under *any* reading of neutrality. Even "evenhandedness" collapses if you are forced to fund a club you cannot leave. The stability of the German system rests entirely on the fiction of voluntarism. The state says, "We are neutral; we only collect from members." The citizen says, "I can leave."

  However, because exit is not truly cheap (due to canonical and social consequences), Neutrality must step in to justify the coercion. But which Neutrality?
  *   If Neutrality is **Abstention**, the system fails.
  *   If Neutrality is **Evenhandedness**, the system survives, but only by redefining the state not as a secular arena, but as a service provider for public corporations.

  **Implications for the Foils:**
  *   **France:** The Alsace exception reveals that "Abstention" is often just historical accident. The rest of France enforces Abstention to ensure Exit is cheap (no financial tie). Alsace shows that when the Financial vector is high (state salaries), Exit becomes meaningless regarding public funding.
  *   **USA:** The US relies on Neutrality as Abstention to keep the Financial vector low. But because the Exit cost is culturally low (you can be spiritual but not religious, or switch denominations without civil registration), the US doesn't need a complex exit mechanism. The German model requires a complex exit mechanism *because* the Financial vector is high.

  **Conclusion:**
  The German case suggests that **Neutrality is a secondary virtue to Voluntarism.** A state can be non-neutral (supporting religion financially and institutionally) and remain liberal, *provided* the bond between citizen and religious body is consensual.

  The friction in Germany arises because the "consent" is leaky. Baptism is often infantile (parental consent); exit is bureaucratic and spiritually costly. The system survives not because it is neutral, but because the cultural consensus views the churches as public utilities worthy of state support, and the "exit" is viewed not as a right of conscience but as a civil status change.

  If you press the "cheap exit" claim, it breaks. Exit is not cheap. Therefore, the German system is not justified by exit. It is justified by a specific form of **Cooperative Sovereignty**, where the state and church are distinct but interlocking gears. Neutrality, in the American or French sense, is the wrong metric. The metric here is **Subsidiarity**: the state handles the collection because the churches perform public functions, and the citizen pays because they benefit from the social order the churches uphold.

  If you must choose between Neutrality and Exit as the master concept: **Exit is the necessary condition, Neutrality is the sufficient description.** Without the possibility of exit, the German model is tyranny. With exit, it is a contract. But because the cost of breaking the contract is high, the state leans heavily on "Evenhandedness" to claim legitimacy. The danger is that "Evenhandedness" becomes a cartel agreement between the state and the historic churches, locking out new faiths. That is where the vector turns dangerous: when Financial and Institutional dimensions are high, and Exit is costly, the Symbolic dimension must remain low to prevent the state from becoming confessional. In Germany, that balance is holding, but it is holding due to cultural inertia, not theoretical purity.
