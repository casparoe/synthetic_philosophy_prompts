answer: |-
  You have correctly identified the source of the muddle. The confusion arises because travelers and locals are often playing two different games simultaneously: a **game of coordination** (how do we not bump into each other?) and a **game of status** (do you respect us?).

  When people tell you that you are "obligated" to follow a local practice, they are usually sliding between these two games without telling you. To sort this out, we need to sharpen the distinction you suspected, and then use it to diagnose exactly where the obligation comes from in your hard cases.

  ### 1. The Distinction: Coordination vs. Evaluation

  **Coordination Conventions** are arbitrary solutions to practical problems.
  *   **Examples:** Which side of the escalator to stand on, which side of the road to drive, whether to queue in a line or a cluster.
  *   **Logic:** It doesn't matter *what* we do, only that we do the *same* thing.
  *   **Violation Cost:** Friction, inefficiency, confusion. If you stand on the left in Tokyo, you block the flow. You haven't sinned; you've created traffic.
  *   **Obligation Level:** Pragmatic. You are obligated only insofar as you wish to function smoothly within the system.

  **Evaluative Norms** are signals of social or moral standing.
  *   **Examples:** Tipping, greeting elders, dress codes in religious sites, table manners.
  *   **Logic:** The specific action carries meaning. It signals respect, acknowledgement of hierarchy, or economic fairness.
  *   **Violation Cost:** Offense, loss of trust, moral judgment. If you don't tip in the US, you aren't just saving money; you are signaling that you do not value the server's labor structure.
  *   **Obligation Level:** Relational. You are obligated because you are entering a social contract with the people there.

  **The Muddle:** Locals often treat Coordination Conventions *as if* they were Evaluative Norms. If you stand on the wrong side of the escalator, they don't just see you as inefficient; they see you as an "ignorant outsider" who couldn't be bothered to learn. The convention has acquired normative weight.

  **The Traveler's Test:** To determine if you are genuinely obligated to follow a practice, ask: **"Does violating this impose a cost on others, or does it merely save me effort?"**
  *   If it imposes a cost (blocking flow, underpaying wages), it is an obligation.
  *   If it merely saves you effort (walking across an empty street vs. waiting), it is a convention you can weigh against your own risk tolerance.

  ---

  ### 2. Applying the Distinction to the Hard Cases

  Here is where the framework earns its keep. We can stop guessing and start diagnosing why certain situations feel unfair or confusing.

  #### Case A: The Dying Practice (The "Ghost Convention")
  *The Scenario:* Everyone jaywalks despite the signal, or a culture is moving away from tipping, but the old infrastructure/signage remains.
  *The Muddle:* You follow the official rule (wait at the light), but you feel like a fool because no one else does. Or you don't tip because "it's optional now," but service is cold.

  **The Diagnosis:**
  You are witnessing a lag between the **Coordination Convention** (what people physically do) and the **Evaluative Norm** (what the system expects).
  *   **Jaywalking:** If *everyone* crosses on red when no cars are coming, the Coordination Convention has shifted. The "rule" is now "cross when the herd crosses." If you wait for the green light alone, you are actually disrupting the flow (people have to walk around you). Here, the obligation is to the *current* coordination, not the *official* signage.
  *   **Tipping:** This is trickier. If a restaurant says "tipping is optional" but the staff still rely on it, the Evaluative Norm remains even if the Convention is fading.

  **The Verdict:**
  In dying practices, look at the **systemic dependency**.
  *   If the practice is purely behavioral (jaywalking), follow the *descriptive* norm (what people are actually doing). The obligation is to flow.
  *   If the practice is economic (tipping), follow the *prescriptive* norm (what the workers need), even if locals are skirting it. Locals may have social capital or knowledge of specific exceptions that you lack. If the system relies on tips for wages, you are obligated to tip, regardless of whether the "convention" is dying. The norm of "don't exploit labor" outweighs the convention of "tipping is fading."

  #### Case B: The Conflicting Version (The "Clash of Conventions")
  *The Scenario:* In your home country, you never tip (service included). In the host country, tipping is 20%. Or, you stand on the left; they stand on the right.

  **The Diagnosis:**
  This is where travelers often commit the **Ethical Import Error**. They assume their home Evaluative Norms travel with them.
  *   **Escalators (Coordination):** This is pure physics and flow. Your home habit is irrelevant. If you stand left in a stand-right city, you are objectively creating friction. The obligation is absolute because the cost is immediate congestion.
  *   **Tipping (Evaluative):** This is a local social contract. In the US, the menu price is a lie; the real price includes the tip. In Japan, the menu price is the truth; a tip is an insult.

  **The Verdict:**
  You are obligated to adopt the **host's Evaluative Norms**, not your own.
  Why? Because norms are context-dependent. "Respect" is defined locally.
  *   If you refuse to tip in a tipping culture because "it's not done where I'm from," you are effectively saying, "My local definition of fairness overrides your local economic reality." That is a normative violation, not just a convention clash.
  *   **Exception:** If the local norm violates a core *moral* universal (e.g., segregation, bribery), you revert to your own ethics. But for escalators and tips, the obligation is to the host's system because you are the guest benefiting from their infrastructure/labor.

  #### Case C: The Hypocritical Practice (The "Outsider Tax")
  *The Scenario:* Locals don't wait for the walk signal, but glare at you if you jaywalk. Locals round down the tip, but expect you to pay the full 20%.
  *The Muddle:* This feels deeply unjust. "Why must I follow rules you ignore?"

  **The Diagnosis:**
  This is the hardest case because it reveals that the practice is no longer about Coordination or even standard Norms. It is about **Membership Signaling**.
  *   Locals have "credit." They have proven they belong. They know the unwritten exceptions (e.g., "We don't tip on Tuesdays," or "It's safe to cross here because we know the police pattern").
  *   You have no credit. When you violate the rule, you aren't seen as "savvy like a local"; you are seen as "disrespectful like a tourist."

  **The Verdict:**
  You are obligated to follow the **Idealized Norm**, not the **Practiced Norm**.
  This is the "Tourist Tax." It is unfair, but it is rational from the local perspective.
  *   Locals expect visitors to adhere to the *formal* rules of the culture as a sign of respect for the culture *itself*, even if the locals have earned the right to be lax.
  *   If you jaywalk when locals do, you signal: "I do not respect your laws enough to follow them, I am just copying your behavior."
  *   If you wait for the light, you signal: "I respect your system enough to follow the rules, even when you don't."

  **The Obligation:** In this case, the obligation is **performative**. You follow the rule not because the rule itself matters (the locals proved it doesn't), but because *your adherence to the rule* matters as a signal of goodwill. You are obligated to be more royalist than the king to prove you aren't there to mock the kingdom.

  ### 3. The Traveler's Heuristic

  To clear the muddle in real-time, run the practice through this filter:

  1.  **Is it Coordination?** (Escalators, driving side, queuing)
      *   **Rule:** Strict adherence.
      *   **Why:** Violation creates physical friction for others.
      *   **Obligation:** High.

  2.  **Is it Economic/Structural?** (Tipping, bargaining, haggling)
      *   **Rule:** Adopt the local standard, not your home standard.
      *   **Why:** Violation undermines the local welfare contract.
      *   **Obligation:** High (unless it conflicts with universal morals).

  3.  **Is it Behavioral/Symbolic?** (Jaywalking, dress, volume of voice)
      *   **Rule:** Observe the "Membership Gap."
      *   **Why:** If locals do it but expect you not to, it is a Membership Test.
      *   **Obligation:** Moderate to High. Adhere to the *formal* expectation to signal respect, even if locals ignore it.

  **Summary:**
  You are genuinely obligated to follow a local practice when violating it either **breaks the coordination** (causes friction), **breaks the contract** (causes economic harm), or **fails the membership test** (signals disrespect).

  The muddle clears when you realize that in the third case (Hypocrisy), you aren't following the rule for the rule's sake. You are following it to buy your way into the circle of "respectful guest." It is a fee you pay for entry, not a law you obey for order.
