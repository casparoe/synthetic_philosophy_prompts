prompt: |-
  I keep running into a conceptual muddle when I travel and I want you to sort it out. When does a local practice -- how much to tip, where to stand on an escalator, whether to wait for the walk signal when no cars are coming -- become something a visitor is genuinely obligated to follow, rather than just something that would be rude or awkward to skip? My suspicion is that people are collapsing two different things: a convention in the coordination sense (arbitrary, could have been otherwise, held up by mutual expectation and common knowledge) and a norm that carries real evaluative weight. Explain that distinction and then actually use it on the hard cases -- the practice that's mostly dead so there's barely a convention left to follow (everyone jaywalks, tipping is going optional), the practice the visitor comes from a conflicting version of, and the case where locals themselves don't conform but still expect visitors to. I want the explanation to earn its keep on those cases rather than just define the terms and stop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Problem:** The user is confused about when a local practice becomes a genuine *obligation* for a visitor versus merely being *rude/awkward* to skip.
      *   **User's Hypothesis:** People conflate two things: (1) Conventions (coordination problems, arbitrary, mutual expectation) and (2) Norms (evaluative weight, moral/social obligation).
      *   **Task:**
          1.  Explain the distinction between Convention and Norm clearly.
          2.  Apply this distinction to three "hard cases":
              *   Dying practices (everyone jaywalks, tipping is optional).
              *   Conflicting practices (visitor's home culture differs).
              *   Hypocritical practices (locals don't conform but expect visitors to).
      *   **Constraint:** The explanation must "earn its keep" on the hard cases, not just define terms and stop. It needs to provide actionable guidance or a framework for judgment.

  2.  **Deconstruct the Distinction (Convention vs. Norm):**
      *   *Convention (Coordination):* David Lewis style. Why do we drive on the right? Arbitrary, but we need to agree. If I break it, I cause confusion or inefficiency, not necessarily harm. The "obligation" is pragmatic.
      *   *Norm (Evaluative):* Social/Moral. Why do we not steal? Not arbitrary. It signals respect, fairness, or hierarchy. If I break it, I signal disrespect or moral failing. The "obligation" is relational/ethical.
      *   *The Muddle:* Visitors often think "If it's a convention, I can ignore it if it's inconvenient." Locals often think "If you ignore our convention, you violate our norm of respect."
      *   *The Bridge:* Conventions *become* norms when adherence signals membership/respect and violation signals outsider status/disrespect.

  3.  **Tackle the Hard Cases (Applying the Framework):**

      *   *Case 1: Dying Practices (The "Ghost Convention")*
          *   *Scenario:* Everyone jaywalks, or tipping is disappearing.
          *   *Analysis:* If the coordination function is gone (no one expects it), the convention is dead. However, is there a residual norm?
          *   *Verdict:* If the local coordination has shifted (everyone jaywalks safely), following the *old* rule (waiting for the light) might actually disrupt flow. But if tipping is "optional" but staff rely on it, the norm of "don't exploit workers" might still linger beneath the "optional" label.
          *   *Refinement:* Distinguish between *descriptive* regularity (what people do) and *prescriptive* expectation (what people want).

      *   *Case 2: Conflicting Practices (The "Clash of Conventions")*
          *   *Scenario:* Home culture tips 0%, host culture tips 20%. Home culture stands left, host culture stands right.
          *   *Analysis:* Escalator standing is pure coordination. If I stand left, I block traffic. High harm to coordination. Tipping is economic/normative. If I don't tip, I hurt the worker's income (in some systems).
          *   *Verdict:* Coordination conventions (escalators, driving side) demand strict adherence because the cost of friction is immediate. Normative conventions (tipping, greetings) demand adherence based on the *local economic/social contract*. You can't import your home norm if it undermines the local system.

      *   *Case 3: Hypocritical Practices (The "Outsider Tax")*
          *   *Scenario:* Locals don't tip/wait/stand correctly, but get mad if *you* don't.
          *   *Analysis:* This is the trickiest. It feels unfair. Why? Because locals have "credit" or "membership." They know the exceptions. Visitors are tested on the rule to prove respect.
          *   *Verdict:* This is where Convention transforms into a *Rite of Passage*. The obligation isn't about the act itself (which locals ignore); it's about the signal sent by the visitor. Adhering to the *idealized* norm shows respect for the culture, even if locals are lax. It's a "tourist tax" of effort.

  4.  **Synthesize and Structure:**
      *   **Introduction:** Validate the user's suspicion. Yes, it is a conflation. Introduce the terms: *Coordination Conventions* vs. *Constitutive Norms*.
      *   **Section 1: The Distinction.** Define them sharply. Use the "Why does it matter?" test.
      *   **Section 2: The Mechanism of Obligation.** How does a convention *become* obligatory? (The Signal of Respect).
      *   **Section 3: Applying to Hard Cases.**
          *   *The Ghost Convention (Dying Practices):* Look at the *systemic impact*, not just the individual act.
          *   *The Clash (Conflicting Versions):* Prioritize *friction* (coordination) and *welfare* (economic norms).
          *   *The Hypocrisy (Locals don't follow):* Recognize the *Membership Test*.
      *   **Conclusion:** A heuristic for the traveler.

  5.  **Refining the Tone:**
      *   Needs to be philosophical but practical.
      *   Avoid being preachy.
      *   Acknowledge the frustration (especially with the hypocrisy case).
      *   Ensure the distinction isn't just semantic but drives the verdict in the hard cases.

  6.  **Self-Correction/Drafting thoughts:**
      *   *Initial thought:* Maybe call them "Mores" and "Folkways"?
      *   *Correction:* No, stick to the user's language (Convention vs. Norm) but refine it. Let's use *Coordination Conventions* vs. *Social Contracts*.
      *   *Wait, the user's distinction is Convention vs. Norm.* I should stick to that but clarify that Conventions *acquire* Normative weight.
      *   *Key Insight:* The obligation arises when violating the convention imposes a *search cost* or *signaling cost* on the locals.
      *   *Hypocrisy Case:* This is about "Common Knowledge." Locals know the rule is bendable *for them*. They don't know if *you* know that. So you follow the rule to show you know the culture, even if you bend it later. Actually, better argument: Locals have earned the right to deviate; visitors must demonstrate respect by adhering to the formal standard.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Explain distinction? Yes.
      *   Use it on dying practices? Yes.
      *   Use it on conflicting versions? Yes.
      *   Use it on hypocritical expectations? Yes.
      *   Earn its keep? Yes, by providing a decision matrix/heuristic.

  8.  (Self-Correction on Tipping): Tipping is complex. In the US, it's quasi-wage (Norm). In Japan, it's insulting (Norm). In the UK, it's discretionary (Convention/Norm hybrid). I need to make sure I don't generalize too much. I will focus on the *structure* of the obligation.

  9.  (Final Plan):
      *   Intro: Validate the muddle.
      *   Part 1: The Taxonomy (Coordination vs. Evaluation).
      *   Part 2: The Transformation (When Convention becomes Norm).
      *   Part 3: The Hard Cases (The Stress Test).
      *   Part 4: The Traveler's Heuristic.

