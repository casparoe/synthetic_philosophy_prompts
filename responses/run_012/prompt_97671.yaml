prompt: |-
  I've been chewing on Kavka's toxin puzzle on and off for a couple of years — the one where a billionaire offers you a million bucks if you genuinely intend, tonight, to drink a glass of toxin tomorrow that'll leave you sick for a day. You get the money whether or not you actually drink it, and the catch is you know you won't drink it, so you can't form the intention. Everyone I've come across seems to think the juicy part is whether you can somehow trick yourself into intending. I think the juicy part is somewhere else and I can't quite pin it down.

  Act like a professional philosopher slash decision theorist, and think carefully before you answer. I want to turn my half-baked hunch into a proper short research proposal — say a 5000-word term paper over a semester, or a little grant pitch, whichever you think suits it better. My hunch: the whole puzzle quietly assumes you know your own future behaviour perfectly. Real people don't. You might drink the toxin out of absent-mindedness, or spite, or because forming the intention genuinely makes you more likely to go through with it. So maybe the puzzle only really bites under an unrealistic assumption of perfect self-knowledge, and once you drop that it turns into a diffrent question — something about what it's rational to do when you're unsure what your own intentions will end up causing.

  Start by brainstorming a few ways to frame this before you commit to one, then write the proposal. State the question so it has a determinate answer, say why the usual answers leave it open, lay out the actual method (what I'd do, month by month), what a real result would look like versus what would count as the project failing, and be honest about whether this is too big for a semester. Skip the citations and reading lists, I'll fill those in myself — I just want the argumentative scaffolding.
