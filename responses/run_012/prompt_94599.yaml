answer: |-
  Here is the menu. It breaks down the phrase into five distinct claims, identifies who is on the hook, rates the validity, and maps which side of the fight is using it.

  ### The Menu: "Housing is a Human Right"

  | # | The Precise Claim | Who Is On The Hook? | Verdict | Who Says This? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Emergency Shelter Claim:** No one should sleep outside. The state must provide a bed for anyone who cannot find one. | **The State** (Taxpayers/Social Services) | **Real but Narrow.** Most cities have this as a legal mandate (case law), but it addresses homelessness, not housing *policy*. | **Both** (Usually as a deflection). |
  | **2** | **The Access Claim:** People have a right to *enter* the housing market. Local laws cannot exclude them based on income, race, or family size. | **The Government** (Zoning/Regulators) | **Real & Arguable.** This is the core of fair housing law. It implies supply must be allowed to meet demand. | **Pro-Building** (YIMBYs). |
  | **3** | **The Affordability Claim:** Housing must be priced below market rate to be considered a "right." If a unit isn't subsidized, it doesn't count. | **The Developer** (Private Profit) | **Nice-Sounding/False.** Developers build for profit. Demanding below-market rates without subsidies kills projects, reducing total supply. | **Anti-Building** (NIMBYs). |
  | **4** | **The Location Claim:** You have a right to live in *this* specific neighborhood (usually high-opportunity/high-amenity). | **The Existing Residents** (Via Zoning) | **False.** A human right cannot be geographically specific. If everyone has a right to *this* block, density becomes infinite. | **Anti-Building** (Implicitly). |
  | **5** | **The Decommodification Claim:** Housing should not be an investment asset. It should be treated like a public utility. | **The State** (Via Seizure/Control) | **Arguable but Radical.** Coherent philosophically, but requires overturning capitalist property laws, not just approving a permit. | **Anti-Building** (Activists). |

  ***

  ### Which Side Is Leaning On What?

  *   **The Anti-Building Side** is mostly using **Claim #3 (Affordability)** and **Claim #5 (Decommodification)**.
      *   *The Logic:* "If this building is expensive, it violates the human right to housing. Therefore, we should stop it until it is affordable."
      *   *The Flaw:* They are placing the obligation on a private developer to solve a public welfare problem without public money.
  *   **The Pro-Building Side** is mostly using **Claim #2 (Access)**.
      *   *The Logic:* "If you ban this building, you are denying people the right to access shelter in this region. Therefore, you must allow it."
      *   *The Flaw:* They sometimes imply market-rate housing alone solves homelessness, which isn't always true without supportive services (Claim #1).

  ***

  ### The Stance: Which Reading Is Actually Right?

  I'm going to pick a fight with both sides, but mostly the one stopping the building.

  **The only defensible reading is Claim #2: The Access Claim.**

  Here is why: A "human right" is fundamentally a claim against **coercion**, not a claim for **entitlement**.

  When we say "Free Speech is a human right," we mean the government cannot *stop* you from speaking. It does not mean the government must buy you a printing press or force a newspaper to publish your op-ed.

  When the anti-building side says "Housing is a human right, so you can't build expensive apartments," they are treating it like a positive entitlement (you must give me a cheap home). But they are asking a private developer to foot the bill. That isn't a right; that's a demand for charity disguised as justice. If the neighborhood wants affordable housing, the neighborhood (via the state) should subsidize it. Using "human rights" to veto market-rate supply actually *violates* the Access Claim because it reduces the total number of roofs available.

  However, the pro-building side needs to be careful, too. "Housing is a human right" doesn't mean a developer has a right to maximize profit on any specific plot. It means the *community* has a duty not to exclude.

  **The Verdict:**
  "Housing is a human right" should mean **the government cannot use zoning to exclude people from the region.** It is a **negative right** (freedom from exclusion), not a **positive right** (entitlement to a specific price or zip code).

  *   **If you are against the building:** You are violating the human right to access by restricting supply. Stop using the phrase to justify exclusion.
  *   **If you are for the building:** You are right that access is the priority, but admit that "human right" doesn't guarantee affordability without subsidies.

  Bring this to the meeting: **A right to housing is a right to *opportunity*, not a right to *outcome*.** You can't guarantee everyone gets a home in this neighborhood (outcome), but you can guarantee no one is legally barred from trying to live here (opportunity). Any interpretation that blocks supply to achieve an outcome violates the right itself.
