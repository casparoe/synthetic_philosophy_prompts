  2.  **Deconstruct the Phrase ("Housing is a Human Right"):**
      *   *Meaning 1: The Universal Moral Claim.* Everyone deserves shelter. It's a basic need.
      *   *Meaning 2: The Legal/International Claim.* It's in the UDHR (Universal Declaration of Human Rights). But what does that enforce?
      *   *Meaning 3: The Specific Location Claim.* I have a right to live *here* (in this specific neighborhood/city).
      *   *Meaning 4: The Market Intervention Claim.* The government must ensure supply/affordability, potentially by overriding local zoning.
      *   *Meaning 5: The Anti-Commodification Claim.* Housing shouldn't be an investment vehicle; it should be decommodified.

