      *   *Actually, let's go deeper.* The prompt asks which reading I'd defend as the *right* one.
      *   *My stance:* The phrase is mostly weaponized nonsense in zoning meetings. The *only* coherent version is the Legal/Moral obligation of the State to ensure *access*, which implies removing barriers (zoning) rather than mandating specific unit types (affordability mandates that kill projects). I will defend the interpretation that **a human right cannot be vetoed by local preference, but it also doesn't guarantee a specific price point without subsidy.**
      *   *Wait, let's look at the "False" category.* The idea that you have a right to live in a *specific* neighborhood is demonstrably false. The idea that market-rate housing *violates* the human right is also flawed (it adds supply).
      *   *Decision:* I will defend the reading that **"Housing is a Human Right" means the State cannot exclude people from the housing market, but it does not mean the State must gift everyone a home in their neighborhood of choice.** This sides functionally with the pro-development argument but clarifies the obligation.

