answer: |-
  Friends, families, faculty, and most of all, the graduating class.

  It is a privilege to stand here. I know many of you well. I have sat across from you in seminar rooms when you were eighteen, unsure of how to read a text, unsure of how to speak. I have watched you grow into the people sitting on this lawn today. Because I have watched you, I feel a responsibility to be honest with you now.

  The President introduced me by mentioning my work. He said I study the limits of self-knowledge. That is true. But I have heard a rumor that some people think this means I believe we cannot know our own minds at all. That is not true. I do not think you are strangers to yourselves. I think something more subtle, and perhaps more useful. I think that sometimes, you are right about what you feel, even when you cannot tell that you are right.

  We are told, constantly, that we should look inside. We are told to follow our passion, to trust our gut, to listen to that still, small voice that tells us who we are. The implication is that the voice is always there, and it is always clear. The implication is that if you cannot hear it, something is wrong with you.

  I am not going to tell you that today.

  I am not going to tell you to follow your passion, because I am not sure you always know what it is while you are holding it. I am not going to tell you to trust your gut, because sometimes the gut is quiet, or confused, or speaking a language you cannot yet understand. This might sound like a warning. It is not. It is a permission.

  When I was twenty-three, I was sitting where you are. I had finished my studies. I took a job that looked perfect on paper. It was prestigious. It was secure. People congratulated me. For three years, I went to work. And on Sunday evenings, I felt a flatness in my chest. A heaviness.

  For three years, I asked myself what was wrong. Was I ungrateful? Was I too demanding? Was the work too hard, or was I just tired? I could not tell. I looked inside for an answer, and I found only static. I did not know I was unhappy. I only knew that something was heavy.

  I did not learn what I had felt until I quit. I did not learn what I loved until I stepped away from what I did not love. The clarity did not come from looking inward. It came from moving outward. It came from changing the conditions of my life and seeing how the weight lifted.

  I tell you this not to discourage you, but to free you.

  There is a difference between being right and knowing that you are right. You might choose a path today that is the right path for you. You might choose a city, a job, a partner, a way of living that fits you perfectly. But you may not know it yet. You may not feel the certainty you are promised. You may feel the Sunday evening flatness even in a life that is good for you, because growth is heavy. Or you may feel excitement in a life that is wrong for you, because novelty is bright.

  Your own mind is not a glass house. You do not have a light that turns on whenever you are in the right room. Sometimes you are in the right room, and the light is off.

  If you wait for the light, you will never move.

  This is the trap of the advice you usually hear. It suggests that certainty is a prerequisite for action. It suggests that you need a guarantee before you commit. It suggests that if you are unsure, you are fraudulent.

  I am here to tell you that uncertainty is not a defect. It is the condition of being human. You can be right about your life without having a certificate that says you are right. You can love your work without knowing you love it until you have done it for five years. You can know who you are only by seeing who you become when you are tested.

  So, do not wait for the guarantee. Do not wait for the inner voice to shout. It may whisper. It may stay silent until you have already taken the first step.

  This is where your courage comes in. Courage is not acting when you are sure. Courage is acting when you are not. It is the willingness to say: I choose this. I do not know if it is the right choice. I do not know if I am the right person for it. But I will find out by doing it.

  Some of you will leave here and know exactly what you want. I hope you do. But some of you will not. Some of you will feel the Sunday evening flatness. Some of you will feel nothing at all. If you are in that group, do not panic. You are not broken. You are just in the dark.

  Turn on a light by moving. Try something. If it is wrong, you will learn that too. You will not know it until you leave it, perhaps. But you will know it then. And that knowledge will be real.

  I want you to have lives that are true. But I do not want you to wait for truth to announce itself. Truth is often quiet. It is often retrospective. You build it by walking.

  So here is my charge to you. Do not worry if you cannot read your own heart perfectly. You do not need to. You need only to be willing to listen to it over time. You need to be willing to make a choice without the safety net of certainty. You are allowed to move without a guarantee. You are allowed to be right without knowing it yet.

  Go into the world. Be uncertain. Be brave. Be kind. And when you look back, you will see the path you made.

  Thank you.

  I have given up the move that urges graduates to "follow their passion" on the assumption that passion is pre-existing and identifiable, replacing it with the invitation to discover passion through action. I have discarded the instruction to "trust your gut" as infallible, substituting the acknowledgment that internal signals are often ambiguous until interpreted retrospectively. I have rejected the promise that certainty is available before commitment, offering instead the permission to act without a guarantee of correctness.

  Bottom line: You do not need certainty to be right about your life, you only need the courage to begin without it.
