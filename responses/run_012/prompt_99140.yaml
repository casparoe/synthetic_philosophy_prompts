      *   *Argument:* The reason the sentence strikes us as "denial" is precisely because it violates the constitutive norm of belief. If it were merely a pragmatic breach, it would be like saying "Please pass the salt" during a funeral—odd, but not revealing of the salt's nature. Here, it reveals the nature of belief.
      *   *Transparency:* Bring in Wittgenstein/Anscombe/Thompson line of thought (without necessarily name-dropping too much, keep it flowing). The first-person present tense is special. It's not an observation of an inner state.
      *   *Fiction's Trick:* In fiction, the reader knows the narrator is unreliable. The tension exists *between* the fact (rain) and the avowal (no belief). That tension is the paradox alive and kicking.
