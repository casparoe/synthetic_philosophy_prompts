answer: |-
  # Final Exam: Decision Theory and Risk
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 30

  **Question 1: The Unilateralist's Curse and Collective Epistemology**

  Consider a scenario where a group of $N$ agents faces a decision to initiate an irreversible action (e.g., releasing a dataset, launching a policy). The action is beneficial if the state of the world is $S_1$ and harmful if $S_0$. Each agent receives a private, noisy signal regarding the state. Any single agent has the capacity to initiate the action unilaterally; if even one acts, the action occurs for everyone.

  (a) **Mechanism and Comparison (10 marks):** Explain the statistical mechanism of the "unilateralist's curse." Why does increasing $N$ increase the probability of a harmful action under these conditions? Contrast this with the Condorcet Jury Theorem, where a majority vote determines the outcome. Both scenarios involve independent agents with noisy signals and increasing $N$, yet they yield opposite conclusions about group reliability. Pinpoint the exact structural difference that causes this divergence.

  (b) **Information and Correlation (10 marks):** Consider two modifications to the scenario above:
  1.  **Full Sharing:** Agents share all private evidence before anyone acts.
  2.  **Correlated Signals:** Agents' signals are not independent but share a common systematic bias.
  Analyze how each modification affects the likelihood of the curse occurring. Does sharing evidence eliminate the curse or merely transform it? Does signal correlation make the unilateralist scenario better or worse compared to the independent case, and why?

  (c) **Normative Fixes and Trade-offs (10 marks):** Propose a decision rule or social norm designed to mitigate the unilateralist's curse. Defend this proposal against the objection that such constraints stifle beneficial unilateral actions (e.g., whistleblowing or innovation). Why is there no "free" solution to this problem?

  ***

  # Model Answer

  **(a) Mechanism and Comparison**
  The unilateralist's curse arises from the aggregation rule governing the action. In this scenario, the decision function is an **OR gate**: the action occurs if *at least one* agent decides to act. Assume the action is harmful ($S_0$) and each agent has a probability $p$ of mistakenly believing it is beneficial. Under independence, the probability that *no one* acts is $(1-p)^N$. Consequently, the probability that *someone* acts is $1 - (1-p)^N$. As $N$ increases, this probability approaches 1. Even if individual competence is high (low $p$), a large enough group ensures that someone will eventually receive a false positive signal and trigger the harmful action. The mechanism is the accumulation of risk across independent trials; more agents mean more "rolls of the dice" for a mistake.

  This contrasts sharply with the Condorcet Jury Theorem (CJT). CJT assumes a **Majority Rule** aggregation. Here, individual errors are idiosyncratic and tend to cancel out. As $N$ increases, the law of large numbers ensures the majority vote converges on the true state (assuming individual competence > 0.5). The structural difference is not the number of agents or the noise itself, but **how verdicts are combined**. Condorcet averages noise (majority), reducing variance. The unilateralist setup amplifies noise (union), maximizing the probability of extreme outcomes (false positives). In Condorcet, a single error is negligible; in the unilateralist case, a single error is catastrophic.

  **(b) Information and Correlation**
  **Full Sharing:** If agents share all evidence before acting, private signals become public information. Agents update to a shared posterior belief. Effectively, the group epistemically collapses into a single agent with a larger dataset. The curse vanishes because $N$ effectively becomes 1; there are no longer independent trials triggering an OR gate. However, the problem transforms into a standard collective action problem: agents must now agree on how to interpret the shared data and coordinate on whether to act. The statistical curse is gone, but coordination costs remain.

  **Correlated Signals:** If signals share a common bias, the independence assumption fails. For Condorcet, this is disastrous; errors no longer cancel, and the group does not converge to certainty. For the unilateralist, the effect is nuanced. Statistically, correlation reduces the *effective* $N$. If signals are perfectly correlated, the probability of at least one false positive equals the probability of a single false positive ($p$), rather than $1 - (1-p)^N$. Thus, correlation technically **mitigates** the specific statistical mechanism of the curse (the growth of risk with $N$). However, it introduces systemic risk: if the common bias is towards action, the group is reliably wrong. While independent noise guarantees a mistake eventually, correlated noise guarantees a mistake simultaneously. It makes the curse less likely to emerge spontaneously from noise, but makes the group's reliability dependent on the validity of the shared bias rather than statistical averaging.

  **(c) Normative Fixes and Trade-offs**
  A robust fix is a **norm of consultation** or a **threshold rule**: agents must consult $k$ others or require $k$ approvals before acting (shifting the logic from OR to $k$-OUT-OF-$N$). This reduces the probability of false positives by requiring consensus rather than unilateral discretion.

  The obvious objection is that this creates friction that blocks beneficial actions. If the action is truly beneficial but controversial, requiring consultation may lead to paralysis, censorship, or missed opportunities (false negatives). Whistleblowing, for instance, often requires unilateral speed to prevent harm. There is no free solution because this is a trade-off between **Type I errors** (acting when you shouldn't) and **Type II errors** (failing to act when you should). Strengthening the barrier against the unilateralist's curse inevitably raises the cost of legitimate unilateral initiative. A perfect filter against rash action is also a perfect filter against bold innovation. The optimal rule depends on the asymmetry of the risks: if the cost of harmful action is catastrophic, strict consultation is warranted; if the cost of inaction is high, unilateral discretion must be preserved.

  ***

  # Marking Scheme (30 Marks Total)

  ### Part (a): Mechanism & Condorcet (10 Marks)
  *   **A-Range (8-10):** Clearly identifies the aggregation function (OR/Union vs. Majority/Average). Explains that $N$ increases the chance of *any* error in Unilateralist but decreases the chance of *majority* error in Condorcet. Explicitly states that independence causes errors to accumulate in one and cancel in the other.
  *   **B-Range (5-7):** Correctly describes the curse (more people = more chance someone acts) and Condorcet (more people = smarter). Fails to explicitly pinpoint the aggregation rule (majority vs. any) as the causal variable, perhaps attributing it vaguely to "voting vs. acting."
  *   **C-Range (0-4):** Defines terms incorrectly. Claims Condorcet fails with large $N$ or that Unilateralist improves with $N$. Confuses private signals with public information.

  ### Part (b): Twists (10 Marks)
  *   **A-Range (8-10):**
      *   *Sharing:* Notes that sharing collapses $N$ to 1 (epistemically), removing the statistical curse but introducing coordination issues.
      *   *Correlation:* Recognizes that correlation reduces effective $N$. Crucially, notes that this *mitigates* the statistical growth of the curse (unlike Condorcet where it harms accuracy) but introduces systemic bias risk.
  *   **B-Range (5-7):**
      *   *Sharing:* Says sharing solves the problem without noting the collapse to a single agent or coordination costs.
      *   *Correlation:* Claims correlation makes everything "worse" without distinguishing between the Condorcet case (convergence fails) and Unilateralist case (risk accumulation slows). Treats correlation as uniformly bad without mechanistic explanation.
  *   **C-Range (0-4):** Ignores one twist. Claims sharing makes the curse worse. Claims correlation has no effect.

  ### Part (c): Fixes & Trade-offs (10 Marks)
  *   **A-Range (8-10):** Proposes a specific mechanism (threshold/consultation). Explicitly frames the objection as a Type I/Type II error trade-off. Acknowledges that stopping the curse inherently costs speed/autonomy (no free lunch).
  *   **B-Range (5-7):** Proposes a fix (e.g., "talk more") but defends it weakly. Acknowledges the trade-off vaguely ("it might be slow") but doesn't connect it to the loss of beneficial unilateralism.
  *   **C-Range (0-4):** Proposes a fix that claims to solve the problem without costs. Fails to address the objection about stifling good actions.

  ### Common Mistakes that Cost Marks
  1.  **The "Voting" Distraction:** Students who argue the difference is simply "one is voting, one is acting" without explaining the *mathematical aggregation* (Majority vs. Union) will cap at a B in Part (a).
  2.  **Correlation Confusion:** Students often assume correlation makes the Unilateralist curse *worse* statistically. While it creates systemic risk, it actually reduces the probability of *at least one* false positive compared to independence (because effective $N$ drops). Recognizing this nuance separates A from B.
  3.  **The "Perfect Fix":** Students who propose a solution (e.g., "perfect communication") without acknowledging the trade-off (loss of speed/autonomy) will lose significant marks in Part (c).
