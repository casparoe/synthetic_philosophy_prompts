answer: |-
  You are applying a population ethics calculation to a situation that is actually about individual welfare and transition costs. Your arithmetic holds only if you assume that reducing the population is costless and that the animals simply "fail to appear" rather than being actively destroyed. Here is where the reasoning breaks.

  First, you are ignoring the **transition cost**. When you clear-cut a forest, the animals do not vanish; they are displaced, starved, burned, or crushed. This creates a massive, concentrated spike of suffering that is far more intense than the background suffering of natural life. In your equation, you are counting the suffering of future animals that won't be born, but you are zeroing out the extreme suffering of the current animals that *are* killed. Because the suffering of violent death is high and immediate, it often outweighs the "prevented suffering" of future generations, especially when discounted over time.

  Second, you are assuming a void follows destruction. Habitat destruction rarely results in an empty landscape; it results in human-dominated landscapes (farms, cities, suburbs). These environments often support higher densities of short-lived, high-suffering "r-strategists" (like mice, rats, and insects) than the original forest did. A forest supports some predators that kill quickly; a monoculture farm supports billions of pests that are poisoned or eaten alive constantly. You might not reduce the total number of animals, but rather swap slower-metabolizing vertebrates for faster-breeding invertebrates with potentially higher suffering densities.

  Third, your friend's point about "animals who exist" refers to the moral asymmetry between killing and preventing birth. In most ethical frameworks, an existing animal has an interest in continuing to live (or at least an interest in not suffering a violent death). A non-existent animal has no interests. You cannot do a favor for an animal by preventing its existence, because there is no "it" to benefit. However, you *can* harm an existing animal by killing it. Therefore, the arithmetic changes because the negative value of killing an existing subject is morally weightier than the neutral value of preventing a future subject from existing.

  The right version of your question is not "Should we destroy habitats to reduce population?" but rather: **"How can we reduce wild animal suffering through humane interventions that avoid massive transition costs and ecological backlash?"** This shifts the focus from destruction to mitigation (e.g., vaccination, sterilization, or genetic welfare improvements) which respects the distinction between helping existing beings and managing future populations.

  \answer{Existence Destruction Confusion}
