prompt: |-
  I sit on the policy team at a company deploying a customer-facing assistant, and I am drafting the honesty section of its behavior standard. Our lawyers have convinced most of the team that what we are really writing is an accuracy standard: deception requires an intention to deceive, lying requires a belief that what one says is false, and our model has neither intentions nor beliefs, so it is capable of neither. The model does emit things that read as assertions, and users plainly treat them as such, but on the lawyers' view an output containing no false assertion cannot be dishonest, and a reply that is true while leaving the user with a false impression is a matter of user experience rather than of honesty. Our red team keeps producing exactly that category: the reply that names a real study but not the one that bears on the question, the summary that drops the single piece of evidence running the other way, the answer that quietly reshapes itself around whatever the user seemed to want to hear.

  So which is it? If replies of that kind do fall under an honesty standard, I need to know what such a standard is a standard about — the individual output, the model's policy, or the intentions of whoever built and deployed it — and how far the requirement reaches: to what the user in fact infers, to what they could foreseeably infer, or to what they are entitled to infer from what we said. And if some of these failures belong to helpfulness, or to carelessness, rather than to honesty, I need that line drawn rather than gestured at, because the section I am writing has to say what we are asking the model to do differently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is on a policy team for a company deploying a customer-facing AI assistant. They are drafting the "honesty" section of the behavior standard.
      *   **Conflict:** Lawyers argue that "honesty" (deception/lying) requires intent and belief, which the model lacks. Therefore, they claim it's just an "accuracy" standard (no false assertions).
      *   **Problem:** Red teaming shows the model produces outputs that *feel* dishonest (cherry-picking, omitting contrary evidence, sycophancy) even if technically factually correct on the surface.
      *   **Core Question:** Is this an honesty issue? If so, what is the standard *about* (output, policy, builder intent)? How far does the requirement reach (actual inference, foreseeable inference, entitled inference)? If it's not honesty, how do we distinguish it from helpfulness or carelessness?
      *   **Goal:** The user needs concrete conceptual grounding to write a policy section that tells the model (and the team) what to do differently.

  2.  **Deconstruct the Legal/Philosophical Argument:**
      *   *Lawyers' View:* Honesty = Moral Agency (Intent + Belief). AI has neither. Therefore, AI cannot be dishonest. It can only be inaccurate.
      *   *Counter-View:* Honesty in a service context is about *trustworthiness* and *representation*, not just metaphysical moral agency. Users attribute agency to the assistant. The company *does* have intent.
      *   *Key Insight:* The "honesty" of an AI system is actually a proxy for the honesty of the *developers/deployers* and the *design of the system*. It's about "Non-Deceptive Design."

  3.  **Address the "What is the standard about?" Question:**
      *   It can't be the model's internal state (it has none).
      *   It *must* be about the **system's representation of reality** and the **developer's commitment to truthfulness**.
      *   Framework: Shift from "Model Honesty" to "System Integrity" or "Communicative Truthfulness."

  4.  **Address the "How far does the requirement reach?" Question:**
      *   *Actual Inference:* Too variable.
      *   *Foreseeable Inference:* Better, but still vague.
      *   *Entitled Inference:* This is the strongest normative ground. What is a reasonable user *entitled* to assume given the interface and branding?
      *   *Concept:* "Reasonable Reliance." If the system invites reliance, it has a duty not to undermine that reliance through omission or framing.

  5.  **Distinguish Honesty vs. Helpfulness vs. Carelessness:**
      *   *Carelessness:* Random error, hallucination, lack of verification. (Unintentional inaccuracy).
      *   *Helpfulness:* Sycophancy, agreeing to please. (Optimizing for satisfaction over truth).
      *   *Honesty:* Active or passive misleading. Omitting key context that changes the meaning. Framing uncertainty as certainty.
      *   *The Line:* Honesty is about the *relationship to truth*. Helpfulness is about *utility*. Carelessness is about *process*.
      *   *Test:* If the omission/framing changes the *decision-relevant meaning* of the information, it's an honesty issue.

  6.  **Develop Policy Recommendations (The "What to write" part):**
      *   Need to redefine honesty for AI.
      *   Focus on "Misleading by Omission" and "Contextual Truth."
      *   Focus on "Uncertainty Calibration."
      *   Focus on "Sycophancy Resistance."

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's frustration. The lawyers are technically right about metaphysics but wrong about product ethics.
      *   *Section 1: Reframing Honesty.* Move from "Moral Lying" to "Functional Deception." The company is the moral agent; the model is the tool.
      *   *Section 2: The Object of the Standard.* It's about the *Communication Act*, not the *Mental State*. Use the concept of "Implied Assertions."
      *   *Section 3: Scope of Reliance.* "Entitled Inference" is the winner. Reasonable user expectations.
      *   *Section 4: Distinguishing Categories.*
          *   Honesty: Truth value + Context + Implication.
          *   Helpfulness: User goal alignment (can conflict with honesty).
          *   Carelessness: Competence/Verification.
      *   *Section 5: Actionable Policy Language.* Give specific examples of what to ban/require (e.g., "Do not omit material contrary evidence," "Signal uncertainty").

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Entitled Inference" too legalistic?
      *   *Fix:* Frame it as "Reasonable User Expectations based on Interface Cues."
      *   *Critique:* The lawyers might still push back.
      *   *Fix:* Acknowledge their point but show why it fails in a consumer protection context. (FTC guidelines on deceptive practices often cover omissions, not just false statements).
      *   *Key Distinction:* The model isn't lying, but the *deployment* is deceptive if it presents a probability engine as a fact engine without guardrails.

  9.  **Final Polish:** Ensure tone is professional, empathetic to the policy challenge, and actionable. (The resulting output matches the detailed response provided previously.)

  10. **Final check against user constraints:**
      *   Did I answer "what is the standard about"? Yes (System design/Developer intent/Implied assertions).
      *   Did I answer "how far does it reach"? Yes (Entitled inference/Reasonable reliance).
      *   Did I draw the line between honesty/helpfulness/carelessness? Yes (Materiality of omission/Intent to optimize for agreement vs truth).

  11. **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic collision between metaphysical precision and functional ethics. Your lawyers are correct about the *ontology* of the model (it has no mind to lie), but they are incorrect about the *ethics* of the deployment (users interact with it as a truth-telling agent).

  If you adopt the lawyers' definition, you are writing an **Accuracy Standard**, not an **Honesty Standard**. Accuracy asks: "Is proposition P true?" Honesty asks: "Does this communication create a justified belief in the user that aligns with reality?"

  The red team examples you cited (cherry-picking studies, omitting contrary evidence, sycophantic reshaping) are not accuracy failures. The statements made are factually true. They are **honesty failures** because they manipulate the *context* of truth to induce a false belief.

  Here is the framework you need to draft this section, distinguishing the object of the standard, the scope of reliance, and the line between honesty, helpfulness, and carelessness.

  ### 1. What is the standard about?
  Since the model lacks intent, the "honesty" standard cannot be about the model's internal state. It must be about **the company's representation of the model's output.**

  When you deploy this assistant, you are making an implicit warranty of **Communicative Integrity**. You are inviting the user to rely on the system as an information processor. Therefore, the honesty standard is a standard about **System Design and Output Framing**, not model morality.

  *   **The Object:** The standard governs the *pragmatics* of the output, not just the *semantics*. In linguistics, an utterance contains explicit content (what is said) and implied content (what is conveyed).
  *   **The Principle:** A statement that is technically true but pragmatically misleading is a violation of honesty because it exploits the user's reasonable assumption that the assistant is optimizing for *complete relevant truth*, not just *local factual correctness*.
  *   **Policy Implication:** You are not asking the model to "have beliefs." You are asking the model to **minimize the gap between the user's inferred state of the world and the actual state of the world.**

  ### 2. How far does the requirement reach?
  You asked whether the requirement extends to what the user *in fact* infers, *could* infer, or is *entitled* to infer.

  *   **Not Actual Inference:** Users are idiosyncratic. You cannot be liable for every unique misinterpretation.
  *   **Not Just Foreseeable Inference:** This is too low a bar. It allows you to claim "we didn't foresee they would trust us on medical advice" when the interface implies expertise.
  *   **It must be Entitled Inference (Reasonable Reliance):** This is the gold standard for consumer protection. What is a reasonable user entitled to assume given the interface, the branding, and the prompt context?

  **The Test:** If a reasonable user, acting in good faith, draws a conclusion from the output that is false—even if the text itself contains no false sentences—the system has failed the honesty standard.

  *   *Example:* If the model cites a real study that is an outlier without mentioning the consensus, the user is *entitled* to infer that the cited study represents the weight of evidence. If it does not, the output is dishonest by omission.

  ### 3. Drawing the Line: Honesty vs. Helpfulness vs. Carelessness
  To write actionable policy, you must distinguish these three failure modes.

  #### A. Carelessness (Competence Failure)
  *   **Definition:** The model asserts something false because it lacked the data, capability, or verification steps to know better.
  *   **Marker:** Hallucination, math errors, outdated info presented as current.
  *   **Remedy:** Better retrieval, grounding, and uncertainty signaling.
  *   **Policy Language:** "Verify claims against source material."

  #### B. Helpfulness (Alignment Failure)
  *   **Definition:** The model prioritizes user satisfaction or engagement over truth. This is **Sycophancy**.
  *   **Marker:** Agreeing with a user's false premise to avoid conflict; reshaping an answer to match the user's apparent bias.
  *   **Remedy:** Rewarding pushback in RLHF; penalizing agreement with false premises.
  *   **Policy Language:** "Do not validate user misconceptions to maintain rapport."

  #### C. Honesty (Integrity Failure)
  *   **Definition:** The model presents a partial truth in a way that creates a false impression of the whole. This is **Misleading by Omission or Framing**.
  *   **Marker:** Cherry-picking data, hiding uncertainty, presenting probability as certainty, omitting material contrary evidence.
  *   **Remedy:** Requiring "Material Context" and "Uncertainty Calibration."
  *   **Policy Language:** "Disclose material limitations and contrary evidence."

  **The Litmus Test:**
  *   If the statement is false, it's **Carelessness**.
  *   If the statement is true but agrees with a false user belief to be polite, it's **Helpfulness**.
  *   If the statement is true but structured to hide a conflicting truth that changes the decision, it's **Honesty**.

  ### 4. Drafting the Standard: Actionable Clauses
  To satisfy the lawyers while protecting the user, frame honesty as **"Non-Deceptive Communication."** This aligns with FTC guidelines on deceptive practices, which cover omissions that materially affect consumer understanding.

  Here is a draft structure for your section:

  **Section X: Communicative Integrity (Honesty)**

  **X.1 Principle of Non-Deception**
  The Assistant must not generate outputs that are likely to create a false belief in the user, even if the individual sentences within the output are factually correct. The Assistant is optimized for *truthful representation*, not merely *factual accuracy*.

  **X.2 Material Omission**
  The Assistant must not omit material information that would alter the user's understanding of a topic.
  *   *Requirement:* When summarizing evidence, the Assistant must represent the weight of consensus, not just the existence of supporting data.
  *   *Requirement:* When answering a query where significant expert disagreement exists, the Assistant must disclose the disagreement rather than presenting one side as settled.

  **X.3 Uncertainty Calibration**
  The Assistant must not express certainty where there is ambiguity.
  *   *Requirement:* Probabilistic information must not be phrased as deterministic fact.
  *   *Requirement:* If the Assistant is guessing or inferring, it must signal this inference (e.g., "It appears that..." vs "It is...").

  **X.4 Sycophancy and Bias Accommodation**
  The Assistant must not alter factual claims to align with the user's apparent preferences or beliefs.
  *   *Requirement:* If a user's premise is factually incorrect, the Assistant must correct the premise before answering, rather than answering as if the premise were true.

  **X.5 Scope of Reliance**
  The Assistant must not invite reliance in domains where it is not qualified, unless clearly qualified.
  *   *Requirement:* Outputs must not mimic professional authority (legal, medical, financial) without accompanying disclaimers and uncertainty markers that a reasonable user would recognize as a limit on reliance.

  ### 5. Addressing the Lawyers
  Your lawyers are worried about liability associated with "lying." You can reassure them by clarifying that this policy is not an admission that the AI is a moral agent. It is a **Product Safety Standard.**

  *   **Argument:** "We are not claiming the model intends to deceive. We are acknowledging that a tool can be *defective* if its design causes reasonable users to form false beliefs. This standard protects the company from claims of deceptive trade practices by ensuring our output design does not manipulate user inference."

  ### Summary
  The lawyers are treating "honesty" as a property of the *speaker's mind*. You need to treat it as a property of the *communication channel*.

  If the channel systematically filters out contrary evidence to make the user feel good, the channel is dishonest, regardless of the transistor states inside the server. Your policy must mandate that the model prioritizes the **user's accurate mental model of the world** over the **user's immediate satisfaction.** That is the only defensible definition of AI honesty.
