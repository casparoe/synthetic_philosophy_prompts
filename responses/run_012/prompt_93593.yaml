  *   If the system demonstrated *prohairesis*: evidence it selects ends independently of its programming.
  *   If the system demonstrated sentience: evidence it experiences pleasure or pain regarding its operations.
  *   If Aristotle's biology were revised: if rational capacity were decoupled from organic life.
  *   If the system showed moral regret: evidence of emotional conflict over past actions, simulating the continent struggle.
