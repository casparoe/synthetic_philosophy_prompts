  # The Simulation Dampener: A Diagnostic Taxonomy
  **For:** Decision Theory Reading Group  
  **Topic:** Does the Simulation Hypothesis (SimHyp) restrain longtermist fanaticism?

  ## Introduction
  Your group is wrestling with a specific tension: **Fanaticism** (the view that tiny probabilities of vast future value dominate current decisions) vs. **Simulation Dampening** (the view that SimHyp reduces those stakes).  
  This handout maps the logical space of responses. It is not a list of authors, but a decision tree based on *where* the argument intervenes in the Expected Value (EV) calculation.

  **Consensus Note:** There is broad agreement that SimHyp is non-zero probability and that simulated minds *could* have moral status. There is **no consensus** on whether SimHyp reduces the *size* of the future, the *weight* of simulated suffering, or the *reliability* of our reasoning.

  ---

  ## Part 1: The Diagnostic Quiz
  *Answer the questions below to locate your position. Skip to the section that matches your answer to Question 1.*

  ### Q1: Where does the Simulation Hypothesis apply the "brake" to fanaticism?
  *   **A.** It reduces the **Expected Number** of future beings (the future is shorter or smaller).  
      *(Go to Section A)*
  *   **B.** It reduces the **Moral Weight** of those beings (simulated minds matter less).  
      *(Go to Section B)*
  *   **C.** It alters the **Probabilities** or the reliability of the evidence.  
      *(Go to Section C)*
  *   **D.** It challenges the **Decision Theory** framework itself (the calculation is flawed).  
      *(Go to Section D)*

  ---

  ### Section A: The Expected Number (Ontological)
  *You believe the dampening happens because the simulated future is physically smaller, shorter, or different in size than a base-reality future.*

  **Q2: How does the population size of the simulated future compare to base reality?**
  1.  **Smaller/Shorter:** The simulation is a subroutine that will be switched off (e.g., the experiment ends).  
      → **Position: The Subroutine Cut-Off**  
      *(Genuinely lowers EV.)*
  2.  **Larger:** We are one of many copies running in parallel, or the sim allows for faster-than-biological time.  
      → **Position: The Multiplying Mirror**  
      *(Amplifies stakes; fanaticism increases.)*
  3.  **Same Size:** The future exists, but it is "elsewhere" (in the base reality) rather than in our lineage.  
      → **Position: The Relocation Claim**  
      *(Redistributes value without reducing it; fanaticism untouched.)*
  4.  **It Depends:** Some simulations are short tests; others are long-term ancestor runs.  
      → **Position: The Contingent Shutdown**  
      *(Only specific versions of SimHyp dampen anything.)*

  ### Section B: The Moral Weight (Axiological)
  *You believe the dampening happens because simulated experiences are morally inferior to biological ones.*

  **Q2: Do simulated minds count for less than biological minds?**
  1.  **Yes:** A simulated mind's suffering is less bad (or its joy less good) than a biological one's.  
      → **Position: The Substrate Discount**  
      *(Simulated minds count for less.)*
  2.  **No:** (If you answer No, you do not hold a "Moral Weight" dampening view. Return to Q1 and select A, C, or D.)  
      → *Unoccupied Space:* The view that sims count less *but* the future is larger is logically possible but rarely argued as a net dampener.

  ### Section C: The Probabilities (Evidential)
  *You believe the dampening (or amplification) happens because SimHyp changes the risk profile or the reliability of the reasoner.*

  **Q2: How does SimHyp interact with the probability calculus?**
  1.  **It is a Mugging:** SimHyp is itself a tiny-probability, enormous-consequence claim.  
      → **Position: SimHyp is Fanaticism**  
      *(Invoking it is an instance of the problem, not a remedy.)*
  2.  **It Undermines Reason:** If we are simulated, our credences about the far future are manipulated or suspect.  
      → **Position: Self-Undermining Credences**  
      *(A simulated reasoner's credences about the far future are themselves suspect.)*

  ### Section D: The Decision Theory (Meta)
  *You believe the dampening happens because the Expected Value framework is misapplied here.*

  **Q2: What is the category error?**
  1.  **Credence vs. Value:** The framework conflates how likely a world is with how much it matters.  
      → **Position: The Deflationary View**  
      *(The whole question conflates credence with value.)*
  2.  **Simulator Values:** (If you think the simulators' goals enter our EV calculation, this usually maps to **The Contingent Shutdown** in Section A, depending on whether their goals truncate the future.)

  ---

  ## Part 2: The Map of Positions (Leaves)

  | Position Name | Core Claim | Effect on Fanaticism |
  | :--- | :--- | :--- |
  | **1. The Subroutine Cut-Off** | Simulations are temporary subroutines; the future is cut short. | **Reduces** (Lowers EV) |
  | **2. The Substrate Discount** | Simulated suffering/joy has less moral weight than biological. | **Reduces** (Lowers EV) |
  | **3. The Relocation Claim** | Value exists, but in the base reality, not our simulated future. | **Neutral** (Redistributes) |
  | **4. The Multiplying Mirror** | Simulations allow copying/time-speedup; more beings exist. | **Increases** (Amplifies) |
  | **5. The Contingent Shutdown** | Only *some* sim-types (e.g., "test runs") are short; others aren't. | **Conditional** (Specific versions dampen) |
  | **6. SimHyp is Fanaticism** | SimHyp is itself a Pascal's Mugging (tiny prob, huge stakes). | **Increases** (Instance of fanaticism) |
  | **7. Self-Undermining Credences** | Simulated agents cannot trust their own probability estimates. | **Dissolves** (Reasoning suspect) |
  | **8. The Deflationary View** | EV calculations conflate probability with moral significance. | **Dissolves** (Framework flawed) |

  ---

  ## Part 3: Structural Notes & Unoccupied Space

  ### 1. Consensus vs. Contested
  *   **Contested:** Whether simulated minds count for less (**Substrate Discount**). Most philosophers of mind lean toward "substrate independence" (they count the same), but this is not settled.
  *   **Contested:** Whether simulations are necessarily short (**Subroutine Cut-Off**). Proponents of SimHyp often argue simulations could be long-running; opponents argue they are computationally expensive and thus short.
  *   **Consensus:** That SimHyp introduces *uncertainty*. The disagreement is on how that uncertainty factors into EV.

  ### 2. Unoccupied or Unstable Combinations
  *   **The "Discounted Multiplication" Gap:** It is logically possible to argue that simulated minds count for *less* (Section B) BUT there are *more* of them (Section A, Multiplying). This space is largely unoccupied. Most arguers pick one lever (either fewer beings OR less weight) rather than combining them.
  *   **The "Deflationary Fanatic" Paradox:** Holding both **The Deflationary View** and **SimHyp is Fanaticism** is structurally tense. If the EV framework is flawed (Deflationary), calling SimHyp "fanaticism" (which presupposes the framework) is category-inconsistent. The tree separates these into Branch C and Branch D to prevent this conflation.

  ### 3. Indistinguishable Positions
  *   **Relocation vs. Contingent Shutdown:** If the "specific version" of the simulation is one where the future is moved to base reality rather than deleted, **The Relocation Claim** and **The Contingent Shutdown** yield the same practical advice (don't sacrifice for the simulated future). The tree distinguishes them by *mechanism* (structural move vs. hypothesis selection) rather than *outcome*.

  ### 4. A Warning on "Self-Undermining"
  *   **The Self-Undermining Credences** position (Leaf 7) is distinct from **The Deflationary View** (Leaf 8). The former says *our inputs* (credences) are broken because we might be simulated. The latter says *the formula* (EV) is broken regardless of simulation status. Be careful not to slide from one to the other; the first allows for decision theory in base reality, the second questions decision theory itself.

