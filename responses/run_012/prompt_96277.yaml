answer: |-
  The rule you have formulated is known as **Jeffrey Conditioning** (or Probability Kinematics), and the phenomenon you observed is its established **Non-commutativity** (or Order Dependence).

  **Reasoning**

  **1. Identification of the Rule**
  The update method you described—setting the probability of a proposition to a specific value while preserving the conditional probabilities of all other propositions relative to it—is the exact definition of Jeffrey Conditioning. Proposed by philosopher Richard Jeffrey in 1965, it was designed specifically to handle "fuzzy news" where evidence does not render a proposition certain (probability 1) but shifts its probability to some intermediate value.

  **2. The Phenomenon: Non-commutativity**
  You have correctly identified that the order of updates matters. In formal epistemology, this is known as the non-commutativity of Jeffrey Conditioning. Standard Bayesian conditionalization (where evidence makes a claim 100% certain) is commutative; if you learn $A$ then $B$, you reach the same final state as learning $B$ then $A$. However, Jeffrey conditioning is generally not commutative. Your arithmetic is correct; the divergence you found (70% vs. 80%) is a structural feature of the rule, not a calculation error. This was formally demonstrated by Persi Diaconis and Sandy Zabell in their 1982 paper "Updating Subjective Probability."

  **3. The Deeper Fact: Loss of Likelihood Information**
  You asked whether the trouble is the order-dependence itself or the fact that fuzzy news cannot be stated as a fact about the world. The latter is the cause of the former. When you update by directly setting a posterior probability (e.g., "I am 80% confident"), you discard the *likelihood ratio*—the information about *why* your confidence changed.
  *   In standard Bayesianism, you update on an observation $E$ using likelihoods $P(E|H)$. This preserves the "weight" of the evidence.
  *   In Jeffrey Conditioning, you only store the new probability mass.
  Because the rule does not track the *strength* of the evidence relative to the hypotheses, but only the resulting state of belief, the second update treats the first update's result as the new background structure. Changing the order changes the background structure upon which the second constraint is imposed, leading to different final states.

  **4. Refusing to Update on Fuzzy News**
  You asked if the trouble disappears if you refuse to update on fuzzy news. Yes, it does. The standard remedy in Bayesian epistemology is to model the "fuzzy look" not as a direct shift in confidence, but as a specific observation event with associated likelihoods.
  *   Instead of setting $P(\text{Fair}) = 0.8$, you would identify an experience $E$ (e.g., "a blurry glimpse") and assign likelihoods such that $P(E|\text{Fair})$ is higher than $P(E|\text{Double-Headed})$.
  *   You then update via standard conditionalization on $E$.
  *   Standard conditionalization is commutative. If you model both the glimpse and the toss as observations with likelihoods, the order in which you process them will not affect your final probabilities.

  **5. The Boundary of Order-Independence**
  There is a boundary where order-dependence disappears, even within Jeffrey Conditioning. Commutativity is preserved in two specific cases:
  *   **Certainty:** If the updates are certain (probability 1), Jeffrey Conditioning collapses into standard Conditionalization, which is order-independent.
  *   **Independence:** If the two propositions being updated are probabilistically independent relative to your prior beliefs, the order of updates will not matter. In your coin case, the coin's fairness and the toss outcome are *dependent* (a double-headed coin always lands heads), which is why the order matters.

  **Summary for Your Project**
  You have independently rediscovered a classic problem in formal epistemology. The pattern is **Jeffrey Conditioning**, and the flaw you detected is its **Non-commutativity**. The consensus in the literature is that this suggests "fuzzy news" should ideally be modeled as standard evidence with likelihoods whenever possible, rather than as direct probability shifts, to preserve logical consistency across different sequences of learning.
