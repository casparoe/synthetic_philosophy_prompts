  **Q:** Do these have *any* moral standing whatsoever, however vanishingly small?
  *   **YES** → **LEAF 1: CONTINUITY VIEW**
      *   *Commitment:* You owe a non-zero duty to a thermostat, implying moral status tracks mere function rather than sentience.
  *   **NO** → Go to 2.

  **2. THE NON-SENTIENT MIND**
  **Case:** *Chatbot.*
  **Q:** Does a sophisticated chatbot have moral standing despite lacking sentience?
  *   **YES** → **LEAF 2: UNNAMED (FUNCTIONALIST)**
      *   *Commitment:* You grant rights to software, separating moral status entirely from the capacity to suffer.
  *   **NO** → Go to 3.

  **3. THE EQUALITY TEST**
  **Case:** *Bee vs. Human Infant.*
  **Q:** Does the bee have the *same* fundamental moral status as the infant?
  *   **YES (Status is Binary/Equal)** → Go to 4.
  *   **NO (Status is Unequal)** → Go to 7.

  **4. EXPLAINING THE DIFFERENCE**
  **Q:** If status is equal, why does the infant's interest usually outweigh the bee's?
  *   **A. Welfare Range:** The infant's pain is deeper/more intense. → **LEAF 3: BINARY STATUS, WEIGHT VARIES WITH WELFARE**
      *   *Commitment:* A bee's death counts equally to a human's, but its suffering counts for less due to limited capacity.
  *   **B. Epistemic Confidence:** We are unsure if the bee is truly sentient. → **LEAF 4: EPISTEMIC TIERS**
      *   *Commitment:* Moral reality is binary, but we treat it as graded due to our uncertainty about the facts.
      *   *(Note: Practically inseparable from Leaf 3 in most dilemmas.)*
  *   **C. Interest Complexity:** The infant has richer interests (projects, relationships). → **LEAF 5: INTERESTS COMPLEXITY VIEW**
      *   *Commitment:* Simple pains count equally, but complex harms (frustrated ambitions) give the infant extra weight.
  *   **D. Relationship:** We care more about the infant because it is one of us. → **LEAF 6: UNNAMED (RELATIONAL STATUS)**
      *   *Commitment:* Moral status is not intrinsic but depends on social proximity, favouring dogs over salmon.

  **5. THE SHAPE OF INEQUALITY**
  **Q:** If status is unequal, does it increase smoothly or in jumps?
  *   **SMOOTHLY (Proportional to sentience)** → **LEAF 7: PURE SLIDING-SCALE VIEW**
      *   *Commitment:* There are no rights, only a calculus where a mouse counts for less than a dog simply by degree.
  *   **IN JUMPS (Thresholds)** → Go to 6.

  **6. THE THRESHOLD LOCATION**
  **Case:** *Oyster vs. Bee vs. Salmon.*
  **Q:** Where is the zero-line and is it clear?
  *   **A. Clear Line (e.g., Sentience):** We know where status begins. → **LEAF 8: SHARP-THRESHOLD VIEW**
      *   *Commitment:* An oyster has no standing at all, but a bee has full standing, creating a moral cliff-edge.
  *   **B. Disputed Line:** The only live question is insects versus fish. → **LEAF 9: FLAT VIEW**
      *   *Commitment:* Plants and thermostats have no interests, but all animals above the line have equal status.
      *   *(Note: Logically very close to Leaf 8; distinguished by the focus on uncertainty.)*
  *   **C. Human Exception:** Humans jump to a higher tier regardless of weight. → **LEAF 10: UNNAMED (LEXICAL PRIORITY)**
      *   *Commitment:* A human's trivial interest always overrides a mouse's vital interest, regardless of welfare range.

  **7. LOGICAL DEAD ENDS (EMPTY COMBINATIONS)**
  *   **LEAF 11: STATUS VARIES, WEIGHT FIXED**
      *   *Diagnosis:* **Incoherent.** If moral status differs but the weight of interests remains identical, the status distinction does no work.
  *   **LEAF 12: WELFARE > 0, STATUS = 0**
      *   *Diagnosis:* **Unattractive.** Asserts a creature can suffer (welfare) but we owe it nothing (status), severing the link between pain and duty.

  ---
  **Housekeeping Notes:**
  *   **Inseparable Leaves:** Leaves 3 & 4 often yield identical practical advice; the difference is metaphysical (fact vs. confidence). Leaves 8 & 9 differ only on whether the threshold location is settled knowledge or the primary debate.
  *   **Distinctions:** Ensure you do not conflate **Status** (do they count?), **Weight** (how much do they count?), and **Welfare** (how good/bad can it get for them?). This tree forces them apart.
