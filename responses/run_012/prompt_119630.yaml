  You have stumbled upon one of the deepest problems in metaphysics: the Special Composition Question. It asks precisely what you are asking: under what conditions do some things compose a further thing?

  I have considered several candidate principles against your intuitions. I discarded **Universalism** (the view that *any* parts make a whole, which would make "the sand-heap" an object) because it contradicts your strong intuition that a stack of bricks is just bricks. I discarded **Contactism** (the view that parts must touch) because it would disqualify the cloud, the hurricane, and the solar system. I discarded **Strict Materialism** (the view that objects must be made of the same matter over time) because it would disqualify the person, the cloud, and the Wikipedia article.

  What survives is a dual-principle framework that respects your distinction between static unities, dynamic processes, and social constructs. I present these below.

  ### The Surviving Principles

  **1. The Principle of Causal-Functional Unity**
  *Statement:* A plurality of physical parts composes a single object if and only if those parts are bound by internal causal interactions or functional design that maintain a distinct boundary or capacity against the environment.
  *Verdicts Saved:* This captures your **wristwatch** (functional design), **mortared wall** (physical binding), **living hand** (biological function), **cloud/whirlpool/hurricane** (dynamic causal interaction), and **flock/marching band** (coordinated behavior). It correctly excludes the **stack of bricks**, **heap of sand**, **pile of laundry**, and **crowd of strangers**, as these lack internal causal binding or unified function.
  *Verdicts Cannot Accommodate:* This principle struggles with your **abstract cases** (marriage, chess game, Wikipedia), as they lack physical parts. It also creates tension with your **severed hand** verdict (see below).

  **2. The Principle of Institutional Stipulation**
  *Statement:* A plurality (physical or abstract) composes a single object if and only if a social or conceptual framework defines them as a unit with specific identity conditions.
  *Verdicts Saved:* This captures the **marriage**, **chess game**, **Wikipedia article**, and **corporation**. These exist because we agree on rules that bind their "parts" (moves, edits, people) into a single entity.
  *Verdicts Cannot Accommodate:* This cannot explain natural objects like the **cloud** or **person**, which exist independently of human agreement.

  ### Predictions for New Cases

  Based on these principles, here is how your framework extends to cases you have not yet listed:

  *   **Tornado:** **Yes.** Like the hurricane and whirlpool, it is a dynamic system maintained by causal forces (pressure/wind) distinct from the air around it.
  *   **Traffic Jam:** **Yes.** Though made of independent cars, it moves and behaves as a unit (a "wave") governed by causal rules of flow. It is a dynamic object.
  *   **Solar System:** **Yes.** Bound by gravitational causality into a stable, distinct system.
  *   **Lava-lamp blob (pinching into two):** **Yes, then Two.** While connected, it is one dynamic object. When it pinches off, causal continuity is broken, and it becomes two objects.
  *   **Corporation:** **Yes.** Under Institutional Stipulation, it is a legal person distinct from its employees.
  *   **Rainbow:** **No.** Unlike the cloud, a rainbow has no causal cohesion; it is an optical appearance dependent on an observer's position, not a unified entity of water droplets.
  *   **Corpse:** **No.** Under Causal-Functional Unity, death marks the cessation of the biological processes that unified the organism. It becomes a collection of decaying parts (like the severed hand).

  ### The One Verdict You Should Give Up

  You must give up your resistance to calling the **Forest** an object.

  You stated: *"I keep going back and forth on the cloud and the forest, because I answer differently about two cases that look to me like the same kind of case."*

  Your intuition that they are the "same kind of case" is metaphysically astute. You accept the **Cloud** and the **Hurricane** as objects because they are dynamic systems where the parts (water droplets, air currents) interact to maintain a structure larger than themselves. A **Forest** is identical in this regard. A forest is not merely trees near each other; it is an ecosystem where roots tangle, nutrients cycle, shade is shared, and fire spreads via connectivity. The trees interact causally to maintain a microclimate and biological community distinct from the surrounding terrain.

  If you accept the Cloud (a dynamic system of vapor) as one thing, consistency demands you accept the Forest (a dynamic system of flora) as one thing. Your resistance likely stems from the fact that forests move slower than clouds, but speed of process does not determine objecthood. By accepting the Forest as an object, you resolve the specific tension you identified, aligning your natural kinds under the **Principle of Causal-Functional Unity**.

  *Note on the Severed Hand:* You might also consider softening your view that a severed hand is "only meat." If a cloud remains a cloud even as its water evaporates and replaces itself, a hand might remain a "hand-structure" even if detached, though it loses the *capacity* to function. However, the Forest verdict is the more urgent inconsistency to resolve.
