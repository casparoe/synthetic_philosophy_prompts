answer: |-
  Your hypothesis is correct, but it identifies the symptom rather than the underlying pathology. The impasse is indeed axiological (a disagreement about what a theory *ought* to do), but that disagreement is locked in place by a specific, hidden **formal disagreement about the nature of causation.**

  Here is the diagnosis.

  ### 1. The Axiological Fault Line (Your Hypothesis)
  You are right that the two sides are playing different games.
  *   **IIT (The Ontologists):** Starts from phenomenological axioms (e.g., experience is intrinsic, structured, specific) and derives physical postulates. For IIT, a theory of consciousness must identify the *constitutive* mechanism of experience. If the math says a photodiode has $\Phi > 0$, then it has experience, regardless of behavioral complexity. Their goal is **identity**.
  *   **The Critics (The Functionalists):** Start from physical/functional models and demand empirical prediction. For them, a theory must correlate with reportable experience. If two systems behave identically, they must be equally conscious (or unconscious). Their goal is **prediction**.

  This creates the "unfolding" stalemate. Critics argue that because a recurrent network (high $\Phi$) can be unfolded into a feedforward network (zero $\Phi$) with identical input-output mappings, $\Phi$ cannot be the *cause* of consciousness, or else consciousness would be epiphenomenal (having no causal power over behavior). IIT accepts this: consciousness *is* the intrinsic causal power, not the output.

  ### 2. The Hidden Formal Question: Counterfactual vs. Actual Causation
  Beneath the axiological clash lies a formal dispute about what "causal structure" means. This is the engine driving the impasse.

  *   **IIT relies on Counterfactual Causation:** $\Phi$ is calculated by perturbing the system and measuring how much the repertoire of past/future states changes. It asks: *What would happen if the system were in a different state?* IIT claims this counterfactual structure *is* the experience.
  *   **Critics rely on Actual/Input-Output Causation:** The "unfolding" argument works because it preserves the *actual* trajectory of states given specific inputs. Critics argue that if the actual dynamics and outputs are identical, the counterfactuals are irrelevant to the *existence* of consciousness.

  **The Formal Stalemate:** There is no theorem that can prove counterfactual structure is more "real" than actual dynamics. IIT assumes intrinsic existence requires counterfactual robustness (integration). Critics assume existence is validated by extrinsic interaction (behavior). Because $\Phi$ is defined by counterfactuals, and behavior is defined by actuals, the two metrics are mathematically orthogonal. You cannot measure one with the other.

  ### 3. Why Data Fails (The Access Problem)
  You noted little turns on data. This is inevitable because of the **Access Problem**.
  *   To test IIT empirically, you need an independent measure of consciousness to compare against $\Phi$.
  *   The only independent measure we have is **report** (behavior).
  *   IIT explicitly decouples $\Phi$ from report (a system can have high $\Phi$ and no output, or low $\Phi$ and complex output).
  *   Therefore, any experiment using report to validate $\Phi$ begs the question against IIT, and any experiment ignoring report begs the question against the critics.

  The recent adversarial collaborations (e.g., testing IIT vs. Global Neuronal Workspace using psychedelics or sleep) attempt to find conditions where the theories diverge on *neural* predictions. But even if IIT "wins" a neural prediction, critics will argue you have only predicted a neural correlate, not consciousness itself, because the link between that correlate and experience remains defined by IIT's axioms, not independent data.

  ### 4. What Could Move the Debate?
  You asked for a straight answer. Here is the assessment of potential movers:

  **A. A Theorem? (Unlikely)**
  A mathematical proof cannot bridge the is-ought gap between "intrinsic causal power" and "conscious experience." A theorem could show that $\Phi$ is the *only* measure satisfying certain information-theoretic constraints, but critics would simply reject those constraints as irrelevant to consciousness.

  **B. An Experiment? (Limited Utility)**
  An experiment could only move the debate if it decouples consciousness from report *without* assuming IIT is true.
  *   *Scenario:* A "conscious" system that cannot report (e.g., a paralyzed patient or AI) is shown to possess a physical property $X$ that IIT predicts.
  *   *Problem:* We only know they are conscious if they eventually report it or if we assume biological chauvinism. If we test an AI, we are back to square one.
  *   *Verdict:* Experiments can falsify specific *neural* predictions of IIT (e.g., location of the posterior hot zone), but they cannot falsify the core claim that $\Phi = \text{Experience}$.

  **C. A Conceptual Distinction? (The Only Path)**
  The debate will only dissolve if the definition of "consciousness" is split.
  *   If we distinguish **Phenomenal Consciousness** (what it is like) from **Access Consciousness** (report/control), IIT claims to target the former, while critics demand the latter for verification.
  *   *Movement:* If IIT proponents concede that their theory is a **metaphysical postulate** rather than a scientific hypothesis, the critics lose their grip. If critics concede that report is an imperfect proxy for experience, IIT gains breathing room.
  *   *Reality:* Neither side will concede. IIT claims to be scientific; critics demand scientific rigor.

  ### Verdict
  Your hypothesis is the real fault line. The debate is not stalled by a lack of data, but by **incommensurable criteria of success.**

  *   **IIT** succeeds if it provides a coherent ontology that solves the Hard Problem (linking matter to mind), even if it implies panpsychism or unfalsifiable scenarios.
  *   **Critics** succeed if they maintain scientific falsifiability, even if it means leaving the Hard Problem unsolved (accepting consciousness as a brute fact or illusion).

  **Nothing will move the debate** in the foreseeable future because the "hidden formal question" (counterfactual vs. actual causation) is not resolvable by physics alone. It requires a metaphysical choice: **Is consciousness a property of what a system *does* (function), or what a system *is* (structure)?**

  Until one side abandons their core axiom—either IIT abandons intrinsic existence, or Critics abandon behavioral verification as the gold standard—the impasse is permanent. The "unfolding" argument is not a bug in IIT; it is the feature that exposes the rift. IIT accepts that consciousness might be causally inert regarding output; Critics say that makes it scientifically meaningless. Both are logically consistent within their own frameworks. You are reporting on a collision between science and metaphysics masquerading as a scientific dispute.
