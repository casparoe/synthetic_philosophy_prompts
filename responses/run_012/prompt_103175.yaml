  Now consider the cost of the suspicion you prize. You argue that suspicion keeps the citizen a party to the relation, but I suggest it often changes the nature of the relation entirely. When an institution is met with universal suspicion, it must devote its resources to proving its innocence rather than performing its function. This selects for officials who are skilled at compliance rather than service, those who document their actions to withstand an audit rather than those who act wisely to serve the public good. Suspicion crowds out the intrinsic motive to be trustworthy because it signals that trustworthiness will not be credited until it is proven beyond doubt. The suspicious citizen may feel they have standing because they are constantly wielding the gavel, but if the only language the institution understands is the language of litigation and exposure, then the citizen has become a regulator, not a partner. Trust allows the institution to function with the slack necessary for discretion and care; suspicion tightens the bolts until the machine can only move in pre-approved ways. Which of us has stopped looking? Perhaps the one who looks so closely they can no longer see the work being done.
