      *   *Underlying Assumption:* Agglomeration Principle ($O(A) \land O(B) \rightarrow O(A \land B)$).

  3.  **Identify the Logical Flaw:**
      *   The friend moves from "You cannot be required to do *both*" ($\neg O(A \land B)$) to "You cannot be required to do *each*" ($\neg (O(A) \land O(B))$).
      *   This move relies on the **Principle of Agglomeration**: If you ought to do $A$ and you ought to do $B$, then you ought to do ($A$ and $B$).
      *   If Agglomeration holds, then $O(A) \land O(B) \rightarrow O(A \land B)$.
