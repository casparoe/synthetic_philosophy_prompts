      *   Since $\neg C(A \land B)$ (in a dilemma), by modus tollens, $\neg (O(A) \land O(B))$.
      *   *The Mistake:* The mistake isn't necessarily in the logic *if* one accepts Agglomeration. The mistake is assuming Agglomeration is unassailable in the context of dilemmas. Many philosophers argue that in genuine dilemmas, Agglomeration fails.
