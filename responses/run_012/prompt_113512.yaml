answer: |-
  First, plain talk: you are right to feel the term is fractured. The "Frame Problem" is currently three distinct problems wearing one name. The **Logical Frame Problem** (representing change without explosion) is effectively solved by modern state-space methods and attention mechanisms. The **Generalized Frame Problem** (how an agent determines relevance) is alive. The **Embodied Objection** (relevance requires a body/world) is a metaphysical constraint claim. Your friends are conflating the second and third.

  Here is the agenda, ordered by upstream dependency.

  **1. Taxonomic Cleanup (Months 1–6)**
  *Upstream of everything.* You cannot solve the Generalized Frame Problem (GFP) if you are fighting ghosts of the Logical Frame Problem (LFP).
  *   **Task:** Rigorously distinguish LFP (computational tractability of change) from GFP (semantic relevance of change).
  *   **Philosophical Work:** Demonstrate that solving LFP (which transformers largely do via sparse attention) does not dissolve GFP. The "scaling dissolves it" framing should be dropped immediately; it confuses capacity with selection criteria.
  *   **Tractability:** High. This is conceptual hygiene. If you fail here, you will spend years arguing with engineers about things they already fixed.

  **2. The Embodiment Hypothesis (Months 7–18)**
  *The Friend's Claim.* Your friend argues relevance requires a body/practice. This is deep, but risks becoming a conversation-stopper ("AI can't think because it has no skin").
  *   **Task:** Treat embodiment not as a metaphysical barrier, but as a functional hypothesis. Can "background practice" be functionally simulated without biological embodiment?
  *   **Philosophical Work:** Analyze "context" in LLMs as a proxy for "world." If an LLM fails at relevance, is it because it lacks a body, or because its "world" (training distribution) is static?
  *   **Tractability:** Moderate. This is where you risk engineering disguise. Stay conceptual: analyze the *structure* of the constraint, not the hardware.
  *   **Move Up/Down:** If agentic LLMs demonstrate robust relevance without sensory-motor loops, move this down (embodiment is contingent). If they hallucinate wildly when out-of-distribution, move this up (grounding is necessary).

  **3. Context as Framing (Months 19–30)**
  *Downstream Application.* Your engineer friends say Frame Problem = Retrieval/Context. They are partially right, but missing the normativity.
  *   **Task:** Map the philosophical concept of "framing" onto the architectural concept of "context windows" and "attention heads."
  *   **Philosophical Work:** Attention is a mechanism of relevance. Is it *normative* relevance (what matters to the goal) or *statistical* relevance (what correlates)? The Frame Problem is ultimately about the gap between these two.
  *   **Tractability:** High. You have access to the systems. You are analyzing the *logic* of the architecture, not building it.
  *   **Drop:** The idea that "RAG (Retrieval-Augmented Generation) solves framing." Retrieval just pushes the framing problem back to the retriever.

  **What to Drop**
  1.  **Situation Calculus:** Unless you are doing history of logic, drop McCarthy/Hayes formalisms. They describe a solved engineering bottleneck, not the philosophical crisis.
  2.  **"Scaling Dissolves It":** This is dogma. Larger models still hallucinate relevance.
  3.  **"It's Just Retrieval":** This ignores *why* something is retrieved. The selection criterion is the Frame Problem.

  **What Moves the Needle**
  *   **Move Embodiment Up:** If agents with sensory-motor loops show significantly better relevance handling than text-only agents (controlling for data), the Friend's claim gains traction.
  *   **Move Context Down:** If attention mechanisms can be proven to encode causal models rather than correlations, the GFP becomes a engineering tuning problem, not a philosophical crisis.

  **Summary of Reasoning**
  Start by isolating the *semantic* problem from the *computational* one (Step 1). Then test the *condition of possibility* for semantics (Step 2: Embodiment). Finally, analyze the *current mechanism* attempting to solve it (Step 3: Context).

  Your friend's claim is the pivot point. If "background practice" is unrepresentable, the GFP is unsolvable for classical AI. If it is representable (perhaps as high-dimensional latent structure), the GFP is just hard engineering. Your job is not to solve the engineering, but to determine which of those two worlds we inhabit. That is purely philosophical, and it is urgent.
