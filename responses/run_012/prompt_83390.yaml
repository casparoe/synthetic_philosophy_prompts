prompt: |-
  I am giving the toast at my sister's wedding this weekend, and I would like you to write it. She and her fiancé met eight years ago in a graduate seminar on evolutionary game theory; for the first two weeks the professor had the class play a repeated prisoner's dilemma tournament, and they were paired against each other in the last round, which had been announced in advance. He defected in that last round and still insists he was simply applying backward induction; she says he defected because he panics under pressure. Both versions are now family lore. About half the room will be academics—biologists, economists, a few philosophers—who will catch every game-theoretic reference, and the other half will be our aunts, uncles, and cousins, who will not.

  I want the toast to be warm, funny, and about five minutes long, and I want the iterated prisoner's dilemma and the evolution of cooperation to do real structural work in it rather than serving as decoration. The speech should turn on the difference between the one-shot game and the repeated game: the one-shot temptation to defect, the way a known final round can unravel cooperation by backward induction, and the way an unknown horizon—a life together with no announced last period—changes what it is rational to do. It should also make something of the fact that real signals are noisy: a partner will sometimes perceive defection where none was intended, and strict tit for tat can then spiral into mutual punishment, so some form of generosity or forgiveness is needed for a cooperative equilibrium to survive. I would like indirect reciprocity to come in near the end—the idea that people cooperate with those who have a reputation for cooperating, even when they may never be repaid directly—because everyone who knows the couple says they are like that.

  Finally, I want the toast to acknowledge, lightly, that evolution selects strategies by their payoffs rather than by their intentions, which is a strange and slightly funny thing to say at a wedding. Please write the toast. Do not make it a lecture; introduce the ideas through concrete details of their life, and make sure the non-academics are laughing and the academics are not wincing.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding toast.
      *   **Key Story:** Met 8 years ago in a grad seminar on evolutionary game theory. Played a repeated Prisoner's Dilemma tournament. Paired in the last round (announced in advance). He defected (claims backward induction); she says he panicked. This is family lore.
      *   **Audience:** 50% academics (biologists, economists, philosophers), 50% family (non-academics). Needs to work for both.
      *   **Tone:** Warm, funny, about 5 minutes long.
      *   **Structural Requirements:**
          *   Use Iterated Prisoner's Dilemma (IPD) and evolution of cooperation as *structure*, not just decoration.
          *   Contrast one-shot vs. repeated games (temptation to defect vs. long-term cooperation).
          *   Discuss the "known final round" (backward induction) vs. "unknown horizon" (marriage/life).
          *   Address noisy signals (misunderstandings) and the need for forgiveness/generosity (not strict Tit-for-Tat).
          *   Include Indirect Reciprocity (reputation) near the end.
          *   Acknowledge evolution selects for payoffs, not intentions (lightly/funnily).
      *   **Constraint:** Do not make it a lecture. Introduce ideas through concrete details. Ensure non-academics laugh and academics don't wince.

  2.  **Deconstruct the Game Theory Concepts for a General Audience:**
      *   *Prisoner's Dilemma:* Two people, choice to cooperate or look out for themselves. If both look out for themselves, both lose. If both cooperate, both win.
      *   *One-shot vs. Repeated:* If I never see you again, I might cheat you. If I see you every day, I better be nice.
      *   *Backward Induction:* If we know the game ends on Tuesday, we fight on Tuesday. If we fight on Tuesday, we might as well fight on Monday... so we fight immediately.
      *   *Unknown Horizon:* Marriage has no announced end date. This makes cooperation rational.
      *   *Noise/Forgiveness:* Sometimes I think you cheated when you didn't. If I punish you immediately, we fight forever. Need to be forgiving.
      *   *Indirect Reciprocity:* Being nice to others makes people want to be nice to you (reputation).
      *   *Evolution/Payoffs:* Nature doesn't care why you're nice, just that it works.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the split audience (academics vs. family). Set the scene of how they met.
      *   **The Meet-Cute (The Game):** Tell the story of the seminar and the tournament. Explain the defection simply. *Joke:* He says logic, she says panic.
      *   **The Theory (One-Shot vs. Repeated):** Transition to what marriage is. In a one-time deal, you take what you can get. In marriage, you're in it for the long haul. The "end of the game" concept.
      *   **The "Known End" Problem:** Address the backward induction. If they knew when it ended, they'd fight now. But they don't. That's the secret.
      *   **Noise and Forgiveness:** Real life isn't perfect. Misunderstandings happen. Strict revenge (Tit-for-Tat) fails. They need "Generous Tit-for-Tat."
      *   **Indirect Reciprocity:** How they treat others. Their reputation.
      *   **Evolutionary Punchline:** Nature selects for success, not motives. It doesn't matter *why* they love each other, just that it works.
      *   **Closing:** Raise a glass.

      *   *Self-Correction on Tone:* Avoid jargon like "Nash Equilibrium" or "subgame perfect" without explanation. Keep the math metaphorical. Make sure the family feels included in the jokes, not alienated by the theory.

  4.  **Drafting - Refining the Content (Iterative Process):**

      *   *Intro:* Start with the sister. Keep it personal.
      *   *The Story:* Make the "defection" sound dramatic but funny. "He betrayed her!" (Pause) "For points."
      *   *Explaining the Dilemma:* Use a concrete example. Who does the dishes? Who picks the movie? Or keep it abstract but simple? Let's use the "last slice of pizza" or "choosing the restaurant." Actually, keep it to the "cooperate/defect" language but define it immediately as "looking out for the team" vs. "looking out for yourself."
      *   *The Horizon:* This is the emotional core. Marriage is an infinite game.
      *   *Noise:* Use a real-life example. He forgets an anniversary? She thinks he doesn't care (defection), but he was just busy (noise). If she punishes him, they fight.
      *   *Reputation:* They are good people to everyone, not just each other.
      *   *Evolution:* The "payoff" line needs to be careful not to sound cynical. It's about the *result* of love lasting.

  5.  **Writing - Focusing on Flow and Timing:**
      *   (Mental Check: 5 minutes is roughly 750-850 words spoken at a moderate pace.)
      *   Need to ensure the transition from the academic story to the emotional truth is smooth.
      *   *Key Line:* "In game theory, a relationship with a known expiration date is a disaster."
      *   *Key Line:* "Marriage is an game with no announced final round."
      *   *Key Line:* "Strict tit-for-tat leads to a divorce." (Too blunt?) -> "Strict tit-for-tat leads to a long, cold war over whose turn it is to take out the trash."

  6.  **Polishing the Jokes:**
      *   Make sure the "backward induction" joke lands for the family too. "He calculated his way into trouble."
      *   The "evolution selects for payoffs" line needs to be warm. "Evolution doesn't care about your heart, it cares about your survival. But luckily, love helps you survive."

  7.  **Final Review against Constraints:**
      *   Warm? Yes.
      *   Funny? Yes.
      *   5 mins? Looks about right.
      *   Structural work? Yes, the theory drives the advice.
      *   One-shot vs. Repeated? Included.
      *   Known vs. Unknown horizon? Included.
      *   Noise/Forgiveness? Included.
      *   Indirect Reciprocity? Included.
      *   Evolution/Payoffs? Included.
      *   Audience balance? Explanations provided for family, specific nods for academics.

  8.  **Final Polish:** (Reviewing the draft for rhythm and spoken word quality.) *Ensure pauses are indicated or implied by sentence structure.* *Make sure the sister's name and groom's name are placeholders.*

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm diagnosing their marriage. The theory should be a lens, not a prescription. Keep it celebratory.

  *(Refining the "Defection" story)*: Make sure it's clear he didn't actually betray her in life, just in the game. Don't want the aunts thinking he's untrustworthy! "He defected... for points."

  *(Refining the "Evolution" line)*: "Evolution selects strategies by payoffs, not intentions." Follow up immediately with "And the payoff here is obvious."

