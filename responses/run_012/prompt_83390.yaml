answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], [Sister's Name]'s sibling.

  Looking around this room, I realize we have a unique demographic split. About half of you are biologists, economists, and philosophers. The other half are our aunts, uncles, and cousins, who are just here for the open bar and to make sure no one cries on their linens.

  This split is appropriate, because [Sister's Name] and [Groom's Name] met eight years ago in a graduate seminar on evolutionary game theory. Specifically, they met during a tournament based on the Prisoner's Dilemma.

  For the non-economists in the room: The Prisoner's Dilemma is a situation where two people can either cooperate for a mutual reward, or "defect"—look out for themselves at the other's expense. If both defect, everyone loses. If both cooperate, everyone wins. But if you defect while the other cooperates, you win big, and they get nothing.

  For the first two weeks of class, the professor had them play this game over and over. In the final round, [Sister's Name] and [Groom's Name] were paired against each other. The end of the tournament was announced in advance.

  And in that last round, [Groom's Name] defected. He took the points. He betrayed her.

  To this day, he insists this was not a moral failing, but a mathematical necessity. He claims he was applying "backward induction." The logic is: if it's the last round, there's no future punishment for being selfish, so you defect. But if *everyone* knows that, you should have defected in the second-to-last round, too. And the one before that. Theoretically, the whole thing unravels immediately.

  [Sister's Name], however, has a different theory. She says he didn't defect because of backward induction. She says he defected because he panics under pressure.

  This story has become family lore. But it actually tells us something profound about why they work so well together.

  In game theory, a relationship with a known expiration date is a disaster. If you know exactly when the game ends, cooperation becomes irrational. You start protecting yourself. You stop making sacrifices. You start saving your energy for the end.

  But marriage is not a tournament with a announced final round. Marriage is an iterated game with an unknown horizon. You don't know when the game ends. And because the future is shadowed by the possibility of forever, the rational strategy changes completely. It becomes rational to cooperate. It becomes rational to be kind, even when you could get away with being selfish.

  [Groom's Name], you tried to treat your wedding day like a one-shot game where you could maximize your utility. But [Sister's Name] has taught you that life is a repeated game. And in a repeated game, the only winning strategy is to look out for the other person, round after round, with no end in sight.

  Of course, real life isn't a clean computer simulation. In the real world, signals are noisy.

  Sometimes, [Sister's Name], you might perceive a defection where none was intended. Maybe [Groom's Name] forgets to take out the trash. In a strict "Tit-for-Tat" strategy, you would immediately punish him by hiding the remote control. Then he punishes you by ordering pizza without asking. Suddenly, you are in a death spiral of mutual defection over garbage and pepperoni.

  For a cooperative equilibrium to survive noise, you need what theorists call "Generous Tit-for-Tat." You need forgiveness. You have to assume that most defections are just errors, not malice. You have to be willing to absorb a small loss to keep the long-term partnership intact. I know you both have this generosity. I've seen you forgive each other for much worse than trash duty.

  And this brings me to the way you treat the rest of us.

  There is a concept called "indirect reciprocity." It's the idea that you cooperate with people not just because they will pay you back, but because you build a reputation for cooperation. People help those who help others.

  Everyone in this room knows that [Sister's Name] and [Groom's Name] are people who cooperate even when there is no direct payoff. They show up. They help move couches. They listen to problems they can't solve. They build a reputation for kindness. And because of that, the world is kinder to them. That is the community you see around you tonight. We are all here because you have invested in us, without keeping a ledger.

  Finally, I want to acknowledge something slightly strange about using evolutionary theory at a wedding.

  Evolution selects strategies by their payoffs, not by their intentions. Nature doesn't care if you love someone because of a divine spark or a dopamine rush. It only cares if the strategy works. If the strategy leads to survival, to flourishing, to a life that is better together than apart, then it is selected for.

  And looking at you two, the payoff is obvious. You make each other smarter, kinder, and happier. You have evolved a strategy that works.

  So, [Groom's Name], I hope you never use backward induction on your anniversary. And [Sister's Name], I hope you never hold a defection from 2016 against him in 2026.

  May your game be repeated indefinitely. May your signals be clear. May your forgiveness be generous. And may your payoff be a lifetime of cooperation.

  To the happy couple.
