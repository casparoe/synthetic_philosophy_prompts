          *   Address Frege's philosophical framework (Platonism, impersonal sense, objectivity of logic) as a hypothesis regarding continuity with the diary, not a conclusion. Mention evidence for/against.
          *   Address pedagogy (classroom) and public materials (website).
          *   Explicitly state what the institute is claiming about Frege, not just what it's doing with the money.
