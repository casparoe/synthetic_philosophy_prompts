prompt: |-
  A friend of mine who reads a ton of pop-science sent me his summary of a philosopher named Dennett and this idea of "free-floating rationales," and I honestly can't tell how much to trust it. Here's basically what he wrote me:

  "Dennett's point is that evolution keeps building things that have reasons behind them -- the eye is for seeing, the bee's waggle dance is for telling the other bees where the food is -- but nobody ever reasoned any of it out, so the reasons just float free. Really the phrase is his way of saying these are useful accidents, a metaphor we project onto nature; there's no genuine reason there, only the appearance of one. Thats why he wants us to stop talking about what traits are *for* and just admit that evolution, like a river carving a canyon, has no purposes at all."

  I suspect he's mangled it but I don't know the details well enough to say where. Which parts would Dennett actually accept, which are subtly off, and which are flat wrong? In particular: does Dennett think a free-floating rationale is a real reason or just a useful fiction, and does he actually want us to quit talking about biological purpose? Also, does my friend's conclusion follow from whatever is accurate in his summary, or is it riding on the parts he got wrong? Answer in American English, and keep it focused on auditing his summary rather than giving me a general tour of the topic.
