  ### 1. Exam Question

  **Question 4 (25 Marks)**

  Consider an indefinitely repeated Prisoner's Dilemma with the following stage-game payoffs: Mutual Cooperation (C,C) yields 3 to each player; Unilateral Defection (D,C) yields 5 to the defector and 0 to the cooperator; Mutual Defection (D,D) yields 1 to each. Players maximise expected total undiscounted payoff.

  The game features outcome-dependent continuation probabilities. After any round, the game continues with probability $p$ if the outcome was (C,C), and with probability $q$ if at least one player defected, where $1 > p > q > 0$. All actions and probabilities are common knowledge.

  **(i)** Derive the condition on $p$ and $q$ under which "Grim Trigger" (cooperate always, revert to permanent defection after any deviation) is a subgame-perfect equilibrium. Comparing this to the standard fixed-continuation model (where continuation probability is $\delta$ regardless of outcome), does making continuation depend on the outcome make cooperation easier or harder to sustain? Justify your verdict algebraically. (10 marks)

  **(ii)** Assess the credibility of the punishment phase. Is the threat of permanent reversion to defection one players would actually want to carry out once a deviation has occurred? What implies this for the incentive to cooperate initially? (5 marks)

  **(iii)** Conceptually, what does this variant suggest about the claim that cooperation requires a "sufficiently long shadow of the future"? What critical assumption must hold regarding the source of the continuation probabilities $p$ and $q$ for your analysis to remain valid? (10 marks)

  ***

  ### 2. Model Answer

  **(i) Equilibrium Condition and Comparison**
  To sustain cooperation via Grim Trigger, the value of cooperating ($V_C$) must exceed the value of deviating ($V_D$).
  If both cooperate, the payoff is 3 and the game continues with probability $p$. Thus:
  $$V_C = 3 + p V_C \implies V_C = \frac{3}{1-p}$$
  If a player deviates, they receive 5 immediately. The outcome involves defection, so the game continues with probability $q$. In the subsequent punishment phase, both play Defect, yielding 1 per round with continuation probability $q$. The value of the punishment phase is $V_P = \frac{1}{1-q}$.
  Thus, the value of deviating is:
  $$V_D = 5 + q V_P = 5 + \frac{q}{1-q} = \frac{5 - 4q}{1-q}$$
  The incentive constraint is $V_C \ge V_D$:
  $$\frac{3}{1-p} \ge \frac{5 - 4q}{1-q}$$
  Rearranging to solve for $p$:
  $$3(1-q) \ge (5 - 4q)(1-p) \implies 3 - 3q \ge 5 - 5p - 4q + 4pq$$
  $$5p - 4pq \ge 2 - q \implies p(5 - 4q) \ge 2 - q \implies p \ge \frac{2 - q}{5 - 4q}$$
  In the standard fixed-continuation model ($p=q=\delta$), the condition simplifies to $\delta \ge 0.5$. In this variant, if $q < 0.5$, the required threshold for $p$ is less than 0.5. For example, if $q=0$, $p \ge 0.4$.
  **Verdict:** Cooperation is **easier** to sustain (requires a lower $p$) provided $q < 0.5$. By linking continuation to outcomes, the game imposes a "discount penalty" specifically on the deviation path. Since the punishment phase yields lower payoffs (1) than cooperation (3), reducing the continuation probability after defection ($q$) reduces the value of the deviation path more than it reduces the value of the cooperation path (which depends on $p$). This discriminatory continuation facilitates cooperation.

  **(ii) Credibility of Punishment**
  The threat is credible. Once a deviation occurs, the strategy prescribes playing Defect forever. In the punishment phase, if the opponent plays Defect, a player's best response is to play Defect (payoff 1) rather than Cooperate (payoff 0), regardless of the continuation probability $q$. Since Mutual Defection is a Nash Equilibrium of the stage game, repeating it constitutes a subgame-perfect equilibrium in the punishment subgame. Players "want" to carry it out because unilateral forgiveness yields a lower immediate payoff with no strategic benefit. This credibility ensures the deviation cost calculated in part (i) is real, securing the initial incentive to cooperate.

  **(iii) Conceptual Implications**
  This variant modifies the "shadow of the future" from a static duration to a **contingent** one. Cooperation does not merely require a long average future; it requires a future that is *longer under cooperation than under defection*. The shadow of the future is endogenous to the players' conduct.
  For this analysis to hold, we must assume $p$ and $q$ are **exogenous institutional rules** (e.g., contract law, biological survival rates) rather than strategic choices. If players could strategically choose to terminate the game after defection (lowering $q$ further) or continue it, the continuation probabilities would become part of the strategy set, potentially destabilizing the equilibrium or requiring a higher-order analysis of institutional maintenance. The model assumes the "rules of engagement" are fixed outside the tactical play.

