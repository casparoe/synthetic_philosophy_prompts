answer: |-
  # Specification for a Theory of Mathematical Truth and Objects

  ## I. Desiderata and Motivating Considerations

  The following list sets out the criteria any adequate theory must satisfy. These are derived from your stated adequacy condition: the theory must preserve the **face-value** of mathematical practice (mathematicians are generally correct about what they assert and that their assertions are true) while adhering to **methodological naturalism** (ontology is constrained by empirical science; epistemology admits no special intuitive faculties).

  ### 1. Semantics
  *   **Requirement:** The theory must provide truth conditions for ordinary mathematical sentences (e.g., "There are infinitely many primes") that render them literally true, not merely useful or assertible. It must specify what, if anything, singular terms (like "2" or "∅") refer to.
  *   **Motivating Case:** Mathematicians assert "2 + 2 = 4" with the same grammatical and logical force as "Paris is in France." If a theory analyzes this as "In the fiction of arithmetic, 2 + 2 = 4" or "The sentence '2 + 2 = 4' is provable," it alters the content of the assertion. To take practitioners at face value, the truth conditions must match the surface grammar: existential quantifiers must range over a domain, and predicates must apply to objects within it.

  ### 2. Determinacy of Open Questions
  *   **Requirement:** The theory must explain the status of statements independent of current axioms (e.g., the Continuum Hypothesis). It must state whether such statements have a determinate truth value and, if so, what grounds that value.
  *   **Motivating Case:** When a conjecture is undecided by ZFC, mathematicians typically search for new axioms to settle it, acting as though the question has an answer. A theory that declares such statements truth-valueless contradicts the practice of seeking resolution. Conversely, a theory that assigns a truth value must explain what fact of the matter makes it so, absent a proof.

  ### 3. Reference and the Reduction Problem
  *   **Requirement:** The theory must account for the reference of number terms without identifying them arbitrarily with specific set-theoretic constructions. It must explain why it does not matter whether 2 is identified with $\{ \emptyset, \{ \emptyset \} \}$ (Zermelo) or $\{ \emptyset, \{ \emptyset \} \}$ (von Neumann).
  *   **Motivating Case:** (Benacerraf's Identification Problem). If numbers are sets, there are multiple conflicting candidates for the number 2. Since arithmetic does not distinguish between them, identifying 2 with one specific set is arbitrary. If the theory insists numbers *are* sets, it must explain why one construction is privileged. If it denies they are sets, it must explain what they are such that they support arithmetic but avoid this arbitrariness.

  ### 4. Sameness of Content Across Foundations
  *   **Requirement:** The theory must explain in what sense a theorem proved in set theory is the *same* theorem when proved in type theory or category theory. It must specify what makes the translation between foundational languages truth-preserving.
  *   **Motivating Case:** The Prime Number Theorem is regarded as one result, regardless of whether it is derived in ZFC, NBG, or a topos. If the ontology of each foundation differs (e.g., urelements vs. pure sets), a theory that ties truth strictly to one ontology fragments mathematical content. The theory must isolate the invariant content that survives foundational translation.

  ### 5. Introduction of New Objects
  *   **Requirement:** The theory must provide criteria for the legitimate introduction of new objects (via definition or abstraction principles). It must account for the status of theorems derived from introductions later found inconsistent (e.g., Frege's Basic Law V) and clarify the ontological status of eliminable devices (e.g., infinitesimals in non-standard analysis vs. standard limits).
  *   **Motivating Case:** Mathematicians frequently expand domains (e.g., introducing complex numbers or ideals). If existence is robust, how can a definition create it? If a system is later found inconsistent, were the earlier theorems false or meaningless? If a device is eliminable (conservative extension), does it exist? The theory must distinguish between creative expansion and mere shorthand.

  ### 6. Epistemology
  *   **Requirement:** The theory must explain how mathematical belief amounts to knowledge compatible with naturalism. It must describe a reliable connection between the knower and the truth-maker without invoking a special faculty of "mathematical intuition" or causal interaction with abstracta.
  *   **Motivating Case:** (Benacerraf's Epistemological Problem). If mathematical objects are abstract, causally inert, and outside space-time, standard naturalistic accounts of knowledge (which rely on causal chains or reliable sensory mechanisms) cannot explain how we know about them. A theory that posits such objects owes an account of access that does not violate naturalism. This requirement filters out "magic" intuitionism while demanding more than mere coherence.

  ### 7. Error and Disagreement
  *   **Requirement:** The theory must accommodate the possibility of objective error in proof and substantive disagreement over methods (e.g., classical vs. constructive logic).
  *   **Motivating Case:** Proofs sometimes stand for years before a gap is found. If mathematical truth were merely social consensus or provability-in-a-system, the "gap" would be a change in rules rather than a discovery of error. Similarly, when constructivists reject the Law of Excluded Middle, they are not merely speaking a different language; they are disputing the legitimacy of certain truth-claims. The theory must explain how one side can be wrong.

  ### 8. Applicability
  *   **Requirement:** The theory must explain how the same objects serving in pure proofs also function in empirical scientific equations.
  *   **Motivating Case:** The number $\pi$ appears in the geometry of circles and in the Schrödinger equation. If mathematical objects are distinct from physical objects, their utility in describing physical behavior is coincidental unless explained. A theory that treats math as a mere game struggles to explain why the game fits the world. A theory that treats math as empirical struggles to explain its necessity.

  ***

  ## II. Analysis of Constraints and Conflicts

  ### Non-Negotiable vs. Camp Preferences
  Given your stated purpose (Face-Value Realism + Naturalism), the following hierarchy applies:

  *   **Non-Negotiable (Hard Constraints):**
      1.  **Semantics (Face-Value):** You require that mathematicians are correct in their assertions. This rules out fictionalism and instrumentalism.
      2.  **Epistemology (Naturalism):** You require existence be earned in empirical science and reject special intuition. This rules out standard Platonism.
  *   **Preferences (Negotiable/Variable):**
      1.  **Determinacy:** Constructivists deny determinacy for undecidable statements; Realists affirm it. This is a point of contention, not a fixed starting point.
      2.  **Reference:** Structuralists deny numbers are objects; Platonists affirm they are. This depends on how the theory resolves the Reduction Problem.
      3.  **Introduction:** Views vary on whether definitions create objects or merely abbreviate.

  ### Incompatibilities and Conflicts
  The central conflict is between **Semantics (Face-Value)** and **Epistemology (Naturalism)**. This is the classic Benacerraf Dilemma.
  *   **The Force:** To satisfy Semantics, you need truth-makers (objects/structures) that make existential quantifiers true. To satisfy Epistemology, these truth-makers must be accessible to natural beings. Abstract objects satisfy the former but fail the latter. Physical objects satisfy the latter but fail the former (math is necessary; physics is contingent).
  *   **Secondary Conflict:** **Reference** vs. **Sameness of Content**. If you identify numbers with specific sets to satisfy Reference, you struggle to explain Sameness across foundations (where numbers might be defined differently). If you prioritize Sameness (via structure), you struggle to satisfy Reference (what are the relata of the structure?).

  ### The Most Excluding Requirement
  The **Epistemological Requirement (Naturalistic Access)** is the single most discriminating constraint.
  *   **Reasoning:** Many theories satisfy Face-Value Semantics easily (e.g., Platonism). Many theories satisfy Naturalistic Epistemology easily (e.g., Nominalism, Fictionalism). However, the Naturalist constraint on *access* eliminates the most straightforward realist theory (Platonism) because it cannot bridge the gap between causal agents and acausal objects without invoking "intuition." It forces the theory to either naturalize the objects (make them physical/mental) or naturalize the access (explain reliability without causation), both of which are philosophically costly.

  ### Account of Proof
  **Requirement Added:** A theory of mathematical truth owes an account of **Proof**.
  *   **Justification:** In empirical science, truth is often distinct from verification. In mathematics, truth is necessarily tied to provability (warrant). A theory that defines truth conditions without explaining what counts as a valid proof fails to capture the modal force of mathematics (necessity).
  *   **Separability:** It is **not separable**. You cannot define the truth conditions of "There exists an $x$..." in mathematics without specifying whether this requires a constructive witness, a classical derivation, or set-theoretic membership. The logic of proof dictates the semantics of truth.

  ### Brief Evaluation of Candidate Camps
  *   **Platonism:** Satisfies **Semantics** and **Determinacy** perfectly (objects exist, questions have answers). Fails **Epistemology** catastrophically (cannot explain access naturalistically). Fails **Reference** (vulnerable to Benacerraf's identification argument).
  *   **Structuralism:** Satisfies **Reference** (numbers are places in structures, avoiding set-identification) and **Sameness** (structures translate well). Struggles with **Epistemology** (how do we access structures?) and **Semantics** (if structures are abstract, the access problem remains; if they are modal, truth conditions become complex).
  *   **Fictionalism:** Satisfies **Epistemology** (no abstract objects to know) and **Reference** (no problem of identification). Fails **Semantics** ( Face-Value) fundamentally (mathematical assertions are literally false or false-in-the-fiction). Fails **Applicability** (makes the success of science miraculous).

  **Conclusion:** Your specification demands a theory that navigates the narrow path between Platonism's semantic success and Fictionalism's epistemic safety. Structuralism offers the best hope for Reference and Sameness, but only a naturalized variant (e.g., modal structuralism or physicalist structuralism) can hope to address your Epistemological constraint.
