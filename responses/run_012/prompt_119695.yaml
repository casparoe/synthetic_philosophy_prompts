prompt: |-
  I'm a backend engineer, no philosophy training beyond one undergrad elective I mostly slept through, and I've gotten into a long-running argument with my flatmate who's doing an MA in this stuff. Here's the position I hold, which I came up with on my own and only later found out is a real thing people argue about. Health just is the absence of a defect, and a defect is a part of the body failing to do the job it was built by evolution to do. What counts as the job gets fixed by comparing the person to a reference group -- same species, same sex, roughly same age -- and that's it. No values anywhere. The values only enter when you pick which reference group to compare against, and that pick is a design decision, like deciding what counts as a bug in a codebase: you have to say what the software was supposed to do before broken means anything, and that choice is yours, not the compiler's. So the normativity is real but it's quarantined in the reference-class choice rather than sitting inside the disease judgment itself. If you tell me someone is diseased, on my view there's a further purely factual question of whether some part is failing relative to their comparison class, and that question has a right answer.

  What I want from you is the case against it. Not the standard but-values hand-wave, I want to know what would actually count against it, ranked from fatal to merely annoying. Concretely: which cases break it, which intuitions, and whether the escape hatches (widening or narrowing the reference class, or insisting there's just one real function) make the whole thing unfalsifiable -- because I can feel myself wanting to say wrong comparison class every time I'm handed a counterexample, and I genuinely can't tell if that's a principled move or me weaseling. Cases I keep getting stuck on: stuff that's statistically normal in a population but still seems like disease (nearly everyone my dad's age has high blood pressure); stuff that's statistically abnormal that nobody would treat (a harmless rare variant, or being absurdly tall); aging, which is universal and involves parts clearly not doing their old job anymore but which I don't want to call a disease; and pregnancy, which I'm told is a normal function but looks on my view like a big deviation from the reference state. There's also a practical stake: I work on the alerting logic for a health-monitoring wearable and I have to set the thresholds, so I'd like to know what my position commits me to there, including whether it would make me nag healthy people or miss sick ones. Be honest at the end about whether the view risks anything at all -- if it can absorb every counterexample, say so, and say whether that's fatal or fine for a view of this kind. The thing that would move me most is a single case where the verdict my view gives is clearly wrong and I can't fix it by blaming the reference class.

  Format it like this, with these exact section headings: My view, restated (short, about 100 words, in your words rather than mine, so I can tell you actually got it); The case for it at its strongest (about 250 words); What would count against it (the bulk of the answer, ranked from fatal to cosmetic, with a one-line verdict on each and a note on whether a defender of my view would concede it or explain it away); What I'd have to give up (short -- the concessions, including anything about the wearable thresholds); and Bottom line (a paragraph, covering whether the position is insulated and whether that's a problem).
