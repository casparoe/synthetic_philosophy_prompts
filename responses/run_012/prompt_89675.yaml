  So here's what I want, and please be explicit rather than gesturing at "it depends on your metaethics." First, state the proposition tightly enough to have a truth value — I mean something like: Hume's standard of taste makes aesthetic judgments objectively correct or incorrect in the sense that their correctness is not merely a fact about what the ideal critic happens to feel but something the ideal critic's feeling is answerable to, i.e. it tracks a fact rather than constituting one. Then decompose your credence in that proposition into the sub-questions it actually rests on, with a rough probability for each and one line of justification apiece. At minimum I'd want: (a) whether there's any fact of the matter about beauty at all, independent of Hume's machinery; (b) whether the ideal-critic convergence story, even granting Hume everything he assumes, delivers that kind of objectivity or only an idealized consensus; (c) whether the ideal critic is even a coherent construct — can one person really be maximally delicate, practiced, unprejudiced and well-comparing, or is that a limit that no actual judge reaches, and does it matter if so; (d) whether the notorious "sentiment vs. judgment" split in Hume does the work he needs or undercuts it; and (e) how much of the whole dispute is just verbal, i.e. people using "beauty" for different things and talking past each other. Show me how those combine into your final number.

  Then tell me which of those terms you're least confident in, and what evidence — something a model without web access could actually reason about, like cross-cultural durability of certain aesthetic responses, patterns of expert convergence and divergence over centuries, or the existence of cases where the best critics were plainly wrong and later corrected — would move your number the most, and in which direction. Also, if you can, tell me which sub-question my friend at 0.75 and I at 0.3 most likely actually disagree about, because my hunch is it's not the metaethics at all but something about what "objective" is even supposed to mean here.
