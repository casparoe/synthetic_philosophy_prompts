      *   *Claim 4:* The absence of pleasure is not bad, unless there is a subject deprived.
      *   *Crucial Distinction:* Benatar relies heavily on the distinction between "never existing" and "ceasing to exist."
      *   *The "Subject" Problem:* For the antinatalist argument, the comparison is between "Existing Person" vs. "Never-Existing Person." For the pro-mortalist argument, the comparison is "Existing Person" vs. "Dead Person."
      *   *Benatar's Defense:* He explicitly argues against pro-mortalism. He claims the asymmetry applies to *coming* into existence, not *going* out. Why? Because once you exist, you have interests. A non-existent being has no interests, but an existing being *does*.

