      *   **The "Better For" Slide:** Yes, (3)->(4) is where the modal logic gets tricky. "Better for X" when X doesn't exist is metaphorical. "Better for X" when X does exist is literal.
      *   **The Price:** You have to accept that existence creates moral claims that didn't exist before. It makes existence a "trap" (once you're in, you must stay, even though it was better never to enter). This is the "Asymmetry of Duty."
