      *   Antinatalism relies on: At time of evaluation (before birth), nobody exists.
      *   Anti-Pro-mortalism relies on: At time of evaluation (before death), somebody exists.
      *   **The Cost:** You must accept that the moral weight of "absence of pleasure" depends on whether a subject *currently* exists to hold the interest, even if that subject won't exist to experience the pleasure. This creates a temporal asymmetry in moral valuation.

