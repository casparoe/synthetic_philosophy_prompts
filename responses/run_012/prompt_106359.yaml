      *   **Benatar's Specific Defense:** Benatar explicitly addresses this in *Better Never to Have Been*. He argues that while coming into existence is always a harm, ceasing to exist is also a harm (usually) because existing people have an interest in continuing. The asymmetry applies to *genesis*, not *cessation*.
      *   **The "Price":** To keep (5) and reject (8), you must accept that existence creates a "moral gravity" or "interests" that make the absence of pleasure bad *retroactively* or *prospectively* for that specific subject, whereas it wasn't bad *prospectively* before they existed. This feels ad-hoc to critics (the "Magic of Existence" objection).

