prompt: |-
  My friend and I had a five-hour argument about consent last night and I'm still annoyed about it. She's finishing a PhD in philosophy; I'm the consent-and-compliance analyst at the research ethics office of a mid-size teaching hospital, which means I'm the person who reads every consent form and sits in on the consent conversations for the studies we run, maybe fifteen or twenty protocols a month. Her claim was that most of what I approve isn't real consent — the cancer patients who think the trial is their last chance, the employees in the study their own company is funding, the undergrads doing it for the money, the biobank form where people sign away tissue for research nobody's thought of yet. She kept saying "they can't say no" as if that settled it, and I kept saying "but they did sign" which even I could hear was weak.

  The thing that actually stuck with me: she said the difference between coercion and a plain offer is whether the person still has the option they had before, and I said fine, so what did they have before, and she said that's the whole problem, that's the contested part, and then we just yelled. Because she's right that "what they'd have without the study" isn't a fact lying around — it depends on what you take the baseline to be, the world as it is or the world as it should be. And now I have to go back to work and approve or not approve actual studies and I don't have a procedure.

  So: give me one. A decision procedure I can actually run, in maybe twenty minutes per protocol, without a philosophy degree, for the question "is this consent valid" — and seperate, if it isn't the same question, "is this consent autonomous," because she kept insisting those come apart and I half belive her. I want the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the thing to a person — our chair, or the participant's own clinician, or the patient themselves — because the call is about values and not facts. And mark the steps that are judgment calls wearing a procedure's clothing.

  Three cases to run it on, and one of them should come out the way I won't like:

  1. An early-phase trial for a cancer with basically no good options left, enrolling patients who've been told this is what's available. Nobody's lying to them, but the consent conversation is happening on the worst week of their life and everyone in the room knows the drug probably won't work.
  2. A wellness study where the sponsor is the participants' own employer and participation is "voluntary" but the sign-up sheet goes around the team meeting.
  3. A broad biobank consent — tissue and data now, for studies not yet designed, some of which the participant would object to if they knew.

  And fold the deception case in somewhere: a study where the real purpose isn't disclosed because disclosing it would ruin the result.

  Don't give me citations or a reading list, I can't use them at work and half the time I can't get the papers anyway — just tell me what the thinking is and make it usable. And please tell me honestly which parts of this are settled and which are genuinely fought over by people who actually know the area, because my friend said some of what she said like it was obvious and I have a feeling some of it isn't.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Request:**
      *   **User:** Consent-and-compliance analyst at a research ethics office (mid-size teaching hospital). Practical, experienced, deals with 15-20 protocols/month. Frustrated by a theoretical argument with a philosopher friend.
      *   **Friend:** PhD candidate in philosophy. Theoretical, focused on autonomy, coercion, and baseline problems.
      *   **Conflict:** Friend argues most consent isn't "real" due to structural coercion/vulnerability (baseline problem). User argues "they signed." User acknowledges "they signed" is weak but needs a *procedure* to do their job.
      *   **Task:** Create a 20-minute decision procedure for "Is this consent valid?" and "Is this consent autonomous?" (acknowledging they might differ).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop points (automatic No).
          *   Hand-off points (escalate to Chair/Clinician/Participant).
          *   Identify "judgment calls wearing procedure's clothing."
          *   Apply to 3 specific cases (Cancer trial, Employer wellness, Biobank) + Deception case.
          *   One case must result in an outcome the user won't like (i.e., challenging their current practice).
          *   No citations/reading lists.
          *   Honesty about what is settled vs. contested in the field.

  2.  **Deconstruct the Philosophical Problem (The "Baseline" Issue):**
      *   The friend is referencing the "Nozickian baseline" problem in coercion. Is an offer coercive if it makes you better off than your *current* state, but worse off than your *moral entitlement*?
      *   *Example:* "I'll sell you water for $100." If you're dying of thirst, is this coercion or just a hard offer?
      *   *Research Context:* "Join this trial or die." Is the trial an offer of hope or coercion because the baseline (standard of care) *should* be better?
      *   *Practical Reality:* IRBs/ethics boards can't fix societal healthcare gaps. They must work within the world *as it is*, not *as it should be*.
      *   *Resolution for Procedure:* Distinguish between *Validity* (Regulatory/Legal threshold) and *Autonomy* (Ethical Ideal). Validity is about process and absence of overt coercion. Autonomy is about substantive freedom. The procedure needs to bridge these.

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   Needs to be fast (20 mins).
      *   Needs to separate "Valid" (Can we legally/ethically proceed?) from "Autonomous" (Is this ideal?).
      *   *Step 1: Capacity & Comprehension.* (Settled).
      *   *Step 2: Voluntariness (The Coercion Check).* This is the crux. Need to define the baseline practically.
      *   *Step 3: Risk/Benefit Ratio.* (Settled regulatory requirement).
      *   *Step 4: The "Opt-Out" Reality.* (The friend's point).
      *   *Escalation:* When does the analyst stop deciding?

      *Refining the "Baseline" for the Procedure:*
      The analyst cannot fix the world. The baseline must be "Standard of Care + Social Safety Net available *now*."
      *Test:* If they say no, do they lose something they *currently possess* (Coercion/Undue Inducement) or do they just fail to gain something new (Offer)?
      *Nuance:* Undue Inducement. If the money is so high it blinds them to risk, that's a validity issue.

      *Distinguishing Validity vs. Autonomy:*
      *   Validity: Meets regulations (45 CFR 46, FDA, etc.), no overt coercion, capacity present.
      *   Autonomy: Substantive ability to choose without desperate pressure.
      *   *Crucial Move:* Acknowledge that a consent can be *Valid* (approve the study) but *Low Autonomy* (require mitigation/monitoring).

  4.  **Developing the Test Cases:**
      *   *Case 1 (Cancer):* High vulnerability. "Therapeutic Misconception" risk.
          *   *Outcome:* Valid (usually), but requires strict monitoring. User might not like that we approve "futile" trials, or might not like that we call it "valid" despite the desperation. Let's make the procedure flag this as "Low Autonomy" requiring extra safeguards, which slows things down.
      *   *Case 2 (Employer):* Power dynamic.
          *   *Outcome:* High risk of coercion. If the boss is in the room, it's a No. If data goes to HR, it's a No. This should be the one the user "won't like" if they currently approve these easily. Let's make the procedure demand a third-party intermediary.
      *   *Case 3 (Biobank):* Future unknown use.
          *   *Outcome:* Valid under broad consent regulations (Common Rule), but autonomy is tricky.
          *   *Deception:* Fold this in. If they can't object to specific studies, is it valid? Yes, with withdrawal option.
      *   *Deception Case:* Needs to be integrated. Usually requires debriefing.

      *Selection for "Outcome I won't like":*
      The User is the Compliance Analyst. They likely approve Employer studies if the paperwork says "voluntary." The Procedure should flag the Employer case as *Presumptive No* unless strict firewalls exist. This challenges the "they signed" defense.
      *Alternative:* The Cancer case. The procedure might say "This is Valid but Ethically Compromised." The User wants a Yes/No. The Procedure says "Yes, BUT..." which creates work.
      *Better:* The Employer case. It's the clearest example of "They can't say no." If the procedure says "Reject unless independent recruiter," that stops a lot of revenue/convenience.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Capacity, Disclosure, Comprehension, Right to Withdraw.
      *   *Contested:* Undue Inducement thresholds, The Baseline for Coercion, Broad Consent scope, Deception necessity.
      *   *Honesty:* Admit that the procedure forces a "pragmatic baseline" because the ethics office isn't a legislature.

  6.  **Writing the Response (Iterative refinement):**
      *   *Tone:* Professional, empathetic, direct, no academic fluff.
      *   *Structure:*
          1.  Validation of the conflict (You're both right, different jobs).
          2.  The Distinction (Validity vs. Autonomy).
          3.  The Procedure (Step-by-step).
          4.  The "Judgment Calls" warning.
          5.  The Three Cases (Applied).
          6.  The Truth (Settled vs. Contested).

      *Self-Correction on the Procedure:*
      Make sure it fits 20 minutes.
      Step 1: Capacity/Comprehension (5 mins).
      Step 2: The Baseline Test (5 mins).
      Step 3: The "No" Consequence (5 mins).
      Step 4: Mitigation (5 mins).

      *Refining the "Baseline Test":*
      Don't ask "What should the world be?" Ask "Does saying 'No' make them worse off than they are *today*?"
      If Yes -> Coercion (Stop).
      If No -> Offer (Proceed).
      *Exception:* Undue Inducement (Is the 'Yes' so good it clouds judgment?).

      *Refining the "Outcome I won't like":*
      I will make the Employer case (Case 2) result in a "Stop" unless specific, difficult firewalls are met. Most hospitals wave these through with a disclaimer. The procedure should demand an independent intermediary. This aligns with the friend's "they can't say no" point.

      *Refining the Deception Case:*
      Fold into the procedure as a specific check on "Disclosure."

      *Refining the Cancer Case:*
      This tests the "Therapeutic Misconception." The procedure should require a "Teach-Back" method.

      *Refining the Biobank:*
      This tests "Specific vs. Broad." The procedure should allow it but require easy withdrawal.

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, if steps are sharp.
      *   No citations? Yes.
      *   Mark judgment calls? Yes.
      *   Three cases + deception? Yes.
      *   One outcome user won't like? Yes (Employer case).
      *   Settled vs. Contested section? Yes.

  8.  **Final Polish:** Ensure the distinction between "Valid" (Regulatory) and "Autonomous" (Ethical) is clear, as the friend insisted on this. The procedure should output a status: *Approved*, *Approved with Conditions*, or *Rejected*.

      *(Self-Correction during drafting)*: I need to make sure I don't just give regulatory advice (which the user knows) but ethical decision logic. The user knows the regs; they need the *philosophical triage* translated into workflow.

      *Key Insight:* The friend is talking about *moral validity* (autonomy). The user is tasked with *regulatory validity* (compliance). The procedure must satisfy the regulator while respecting the philosopher. The bridge is "Mitigation." If autonomy is low, mitigation must be high.

      *Let's write it.*
answer: |-
  Here is the reality check before the procedure: You and your friend are arguing past each other because you have different jobs. Her job is to identify ideal moral conditions. Your job is to manage risk and protect participants within the world *as it exists*, not the world *as it should be*.

  If you adopt her baseline ("What should they have?"), you will have to reject almost every study involving vulnerable people, which harms the very people you want to protect by denying them access to research. If you adopt your baseline ("They signed"), you risk becoming a rubber stamp for exploitation.

  The procedure below bridges this. It separates **Regulatory Validity** (Can we legally/ethically proceed?) from **Autonomy Quality** (How free was this choice?). You can approve a study that is Valid but has Low Autonomy, *provided* you add mitigation steps.

  ### The 20-Minute Triage Procedure

  **Goal:** Determine if consent is *Valid* (Approve), *Valid with Mitigation* (Approve with Conditions), or *Invalid* (Reject/Refer).
  **Time:** 20 Minutes max per protocol.

  #### Step 1: The Capacity & Comprehension Check (5 Minutes)
  *Question:* Can the participant understand what they are signing, and do they actually understand it?
  *   **Fact Check:** Is the language at an 8th-grade reading level? Are exclusion criteria in place for cognitive impairment?
  *   **Process Check:** Does the protocol require a "teach-back" method (participant explains back to researcher) for high-risk studies?
  *   **Stop Rule:** If the form is legalese or the population cannot comprehend the risk (e.g., advanced dementia without a legally authorized representative), **STOP. Invalid.**
  *   **Judgment Call Warning:** Determining "understanding" from a script is a guess. *Mitigation:* Require the consent conversation to be documented (audio or checklist), not just the signature.

  #### Step 2: The Baseline Test (The "Coercion" Check) (5 Minutes)
  *Question:* If the participant says "No," are they worse off than they are *right now*?
  *   **The Rule:** Use the *Status Quo Baseline*. Ignore what healthcare they *should* have. Look at what they *do* have.
  *   **Test A (Loss):** Does saying "No" remove access to standard care, employment, grades, or insurance they currently possess?
      *   If **Yes**: This is coercion. **STOP. Invalid.**
      *   If **No**: Proceed to Test B.
  *   **Test B (Undue Inducement):** Is the offer (money, access, treatment) so attractive that it blinds a reasonable person to the risks?
      *   *Heuristic:* Is the payment more than 3x hourly wage for the time commitment? Is the "access to drug" presented as a cure rather than a trial?
      *   If **Yes**: This is undue inducement. **Refer to Chair.** (Do not decide this alone).
      *   If **No**: Proceed to Step 3.

  #### Step 3: The "No" Consequence Check (5 Minutes)
  *Question:* How hard is it to actually leave?
  *   **Test:** If they sign today, can they quit next week without penalty?
  *   **Check:** Is there a clear, non-punitive withdrawal clause?
  *   **Power Dynamic Check:** Is the recruiter in a position of authority over the participant (Doctor/Patient, Boss/Employee, Professor/Student)?
      *   If **Yes**: Is there a neutral third party (independent recruiter) handling the consent?
      *   If **No**: **Refer to Chair.** (This is the "Employer" killer).
      *   If **Yes (Neutral Party)**: Proceed to Step 4.

  #### Step 4: The Scope & Deception Check (5 Minutes)
  *Question:* Do they know what they are getting into, or is the scope too broad/hidden?
  *   **Deception:** Is information withheld?
      *   If **Yes**: Is it scientifically necessary? Is there a debriefing plan? Is the risk minimal?
      *   If **No** to any: **STOP. Invalid.**
  *   **Broad Consent (Biobank):** Are they allowed to withdraw later? Are there "off-limits" categories (e.g., no genetic research, no commercial profit)?
      *   If **Yes (Withdrawal allowed)**: **Valid.**
      *   If **No (Irrevocable)**: **Refer to Chair.**

  ---

  ### Application to Your Three Cases

  Here is how the procedure runs on your specific scenarios.

  #### Case 1: The Desperate Cancer Trial
  *   **Step 1 (Comprehension):** High risk of "Therapeutic Misconception" (thinking research is treatment). *Action:* Require teach-back method.
  *   **Step 2 (Baseline):** If they say "No," do they lose standard care? No. They stay on palliative care. They don't gain the drug, but they don't lose what they have. *Verdict:* Not coercion under Status Quo Baseline.
  *   **Step 3 (Power):** Recruiter is likely their oncologist. *Action:* Require a research nurse, not the treating doctor, to take consent.
  *   **Step 4 (Scope):** Specific trial.
  *   **Outcome:** **Valid with Mitigation.**
  *   **Why you might not like it:** You have to slow down the enrollment. You can't just let the oncologist grab the signature during a consult. The procedure forces a firewall between "care" and "research" that costs time and money.

  #### Case 2: The Employer Wellness Study
  *   **Step 1 (Comprehension):** Likely fine.
  *   **Step 2 (Baseline):** If they say "No," do they lose their job? Officially, no. But...
  *   **Step 3 (Power):** Recruiter is the team lead. Sign-up sheet goes around the meeting.
      *   *Procedure Result:* **Refer to Chair / Presumptive No.**
      *   *Reasoning:* The "Neutral Third Party" check fails. The baseline test is contaminated by the power dynamic. Even if they *can* say no, the procedure assumes they *can't* safely say no.
  *   **Outcome:** **Invalid unless restructured.** To be valid, an external researcher must recruit, and data must be firewalled from HR/Management.
  *   **Why you won't like this:** This kills a lot of "wellness" studies. Your friend wins here. The signature is meaningless because the "No" option carries implicit threat. Your current practice of approving these with a disclaimer is, by this procedure, insufficient.

  #### Case 3: The Broad Biobank (with Deception element)
  *   **Step 1 (Comprehension):** Hard to comprehend "future unknown research." *Action:* Require specific examples of potential research types in the form.
  *   **Step 2 (Baseline):** Saying "No" keeps their tissue. No loss.
  *   **Step 3 (Power):** Usually clinical setting. Neutral recruiter possible.
  *   **Step 4 (Scope/Deception):**
      *   *Broad Consent:* Is withdrawal allowed? If yes, Valid.
      *   *Deception:* If the biobank plans to do genetic studies but the form says "general health" to avoid scaring people off: **STOP.** Deception in biobanking is rarely justifiable because there is no "ruined result" risk like in behavioral psych.
  *   **Outcome:** **Valid ONLY if withdrawal is easy and deception is absent.**
  *   **The Friend's Point:** She argues you can't consent to the unknown. The procedure counters: You can consent to a *process* of governance, provided you can exit.

  ---

  ### Where the Procedure is "Judgment Calls Wearing Clothing"

  You asked for honesty. Here is where the procedure is pretending to be math but is actually values:

  1.  **The Status Quo Baseline (Step 2):** I told you to ignore "the world as it should be." That is a political choice, not a fact. By accepting the current lack of cancer treatments as the baseline, we legitimize a system where desperate people are the only pool for risky trials. This is settled *regulatory* practice, but it is contested *moral* philosophy. Your friend is right morally; you are right administratively.
  2.  **Undue Inducement Threshold (Step 2B):** The "3x wage" heuristic is made up. There is no biological point where money blinds risk. This is a risk-management guess. If a participant says, "I need the $500 to eat," and you approve it, you are deciding that their immediate need outweighs the risk of them ignoring the study dangers.
  3.  **The "Neutral Third Party" (Step 3):** This assumes a neutral party is actually neutral. In a hospital, the research nurse works for the same institution as the doctor. It's a firewall, but it's a thin one.

  ### Settled vs. Contested (The Truth)

  **Settled (You can rely on this):**
  *   **Capacity:** A person must understand to consent.
  *   **Right to Withdraw:** Consent is ongoing, not a one-time signature.
  *   **Overt Coercion:** Threatening harm ("If you don't join, I won't treat you") is always invalid.
  *   **Deception:** Requires specific justification and debriefing; never allowed if it hides physical risk.

  **Contested (Your friend is fighting on this ground):**
  *   **Structural Coercion:** Is poverty coercion? (Friend says yes; Regulations say no).
  *   **Therapeutic Misconception:** How much responsibility does the researcher have to fix the patient's hope? (Friend says all; Regulations say "disclose clearly").
  *   **Broad Consent:** Is signing for future unknown research real consent? (Friend says no; Common Rule says yes).
  *   **The Baseline:** Whether we judge offers against "current reality" or "moral entitlement." (This is the core of your argument).

  ### Summary for Work Tomorrow

  1.  **Don't try to solve the baseline problem.** You cannot fix healthcare inequality in a 20-minute review. Use the *Status Quo Baseline* for validity, but flag *Structural Vulnerability* for monitoring.
  2.  **Separate Validity from Autonomy.** A consent can be valid (legal) but low-autonomy (ethically messy). Your job is to identify the low-autonomy cases and add safeguards (independent recruiters, teach-back, cooling-off periods).
  3.  **The "No" Test.** When in doubt, ask: "If they say no, what happens?" If the answer is "They feel awkward with their boss" or "They lose hope," you need to add a firewall.
  4.  **Accept the Friend's Win on Case 2.** The employer study is the weak link. If you approve that with just a signature, you are vulnerable. Demand an external recruiter.

  Your friend wants a world where consent is pure. You work in a world where consent is a risk management tool. The procedure above lets you manage the risk without pretending the world is pure.
