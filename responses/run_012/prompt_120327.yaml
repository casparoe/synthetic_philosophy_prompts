      *   Okay, I will define the 3 Team Archetypes as the roles.

      *Let's finalize the "Beef > Chicken" logic.*
      *   Team 1 (Direct Deaths): Beef = 1 death / 300,000 kcal. Chicken = 1 death / 2,500 kcal. Beef wins.
