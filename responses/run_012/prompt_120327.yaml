prompt: |-
  Every year I promise myself I'll finally fix the animal ethics week in my third-year applied ethics module, and every year it turns into me at the whiteboard drawing supply chains while eighteen students quietly check their phones. So this time I want it to be a game — something where they work out for themselves that if you count deaths per calorie, the beef on their plate comes out looking better than the chicken, and then have to sit with the fact that this result is manufactured entirely by the metric they were handed. Please don't let the point arrive by lecture. I'd rather the facts were spread unevenly around the room — different teams with different data sheets, or different briefs, or both — so that the argument that breaks out is about what to count, not about what's true.

  Setting: eighteen third years, ninety minutes, a normal seminar room with chairs we can shove about, no laptops, and I'll bring a one-page data sheet with the figures I want them to use (deaths per hectare at harvest, deaths per animal, how much of the animal is actually eaten, typical lifespans, that sort of thing). I'll fiddle with those numbers before the session, so the design needs to make it obvious where each figure enters the arithmetic, in case I want to flip a ranking on the day. The ideas I want them to collide with, roughly: that counting deaths and counting suffering-years give you different menus; that cattle mostly eat grass and chickens mostly eat crops, so the field-death arithmetic isnt symmetric; that an animal which only exists because we bred it is an odd thing to count as a victim, and that this is also the reasoning that lets bad farms off the hook; that the whole comparison collapses if wild animals' lives are mostly not worth living, or if invertebrates are in the frame; and that preferring to eat whatever killed fewer animals can look like rigour when it's really just the metric you found most convenient. The debrief should prise apart three things they'll definately mush together — which facts are disputed, which metric was chosen, and which moral-status assumptions got smuggled in.

  I'd also like the plan to be honest about what the game can't do. My guess is it can't make anyone feel the force of the claim that a wild animal's life may not be worth living, or of the uncertainty about insect sentience, and that I'll have to lecture that bit myself; but tell me if I'm wrong. And tell me what will predictably go wrong the first time I run it — there's a faction in the class from the effective altruism reading group who will try to short-circuit the whole thing in the first five minutes, and I want to know what I'm supposed to do about them. Give it back to me as a JSON object with the fields: title; setting; materials; roles (an array, each with name, what they want, what they know that the others don't, and what they're able to do); rounds (an array, each with the round number, minutes, what happens, and what I'm meant to be doing while it happens); scoring (how teams win, and why the payoff scheme pushes them towards incompatible menus); debrief (an array, each with the moment in the activity, the concept it maps onto, and the question to put to the room); failure modes (an array, each with what goes wrong and how to handle it); and cannot reproduce (a list of the things the activity can't deliver, which I'll have to supply myself).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A university lecturer teaching a third-year applied ethics module.
      *   **Problem:** Previous attempts at teaching animal ethics week have been boring (lecture-heavy, students disengaged).
      *   **Goal:** Create a 90-minute seminar game/activity for 18 students.
      *   **Core Mechanic:** Students work out that beef looks better than chicken based on deaths per calorie (or similar metric), but then realize the metric is manufactured/contingent.
      *   **Key Constraints:**
          *   No laptops.
          *   Normal seminar room (movable chairs).
          *   One-page data sheet (provided by lecturer, fiddlable).
          *   Information asymmetry (different teams have different data/briefs).
          *   Focus on *what to count* vs. *what is true*.
          *   Specific philosophical collisions: deaths vs. suffering-years, grass-fed vs. grain-fed (field deaths), non-existence problem, wild animal welfare, invertebrate sentience, metric rigour vs. convenience.
          *   Debrief must separate: disputed facts, chosen metrics, smuggled moral assumptions.
          *   Honesty about limitations (what the game can't do).
          *   Specific threat: Effective Altruism (EA) reading group faction trying to short-circuit the game.
          *   Output format: JSON object with specific fields (`title`, `setting`, `materials`, `roles`, `rounds`, `scoring`, `debrief`, `failure modes`, `cannot reproduce`).

  2.  **Deconstruct the Activity Design:**
      *   **Title:** Needs to sound engaging but academic. "The Metric Menu"? "Counting Costs"? "The Ethical Arithmetic"? Let's go with "The Arithmetic of Appetite".
      *   **Setting:** 18 students, 90 mins, seminar room.
      *   **Materials:** Data sheets (varied), calculators (phones allowed for calc only?), whiteboard, markers, printed briefs.
      *   **Roles:** Need to divide 18 students into groups. Maybe 3 groups of 6? Or 6 groups of 3? Let's aim for 3 distinct "Stakeholder/Consultancy" teams to foster competition and different perspectives.
          *   *Team A (Efficiency):* Focused on minimizing direct animal deaths. Given data highlighting slaughter numbers.
          *   *Team B (Welfare/Suffering):* Focused on lifespan and quality of life. Given data highlighting suffering-years or field deaths (crop harvesting).
          *   *Team C (Ecological/Systemic):* Focused on land use and wild animal impact. Given data highlighting habitat loss and wild animal suffering.
          *   *Wait, the prompt asks for specific role details:* name, what they want, what they know others don't, what they're able to do.
          *   *Refinement:* Let's make them "Consultancies" bidding for a government contract to define the "Ethical Protein Standard".
          *   *Team 1 (The Utilitarians):* Want to minimize total deaths. Data: Slaughter rates, yield per animal. (Leads to Beef > Chicken).
          *   *Team 2 (The Welfarists):* Want to minimize suffering time. Data: Lifespan, confinement conditions. (Leads to Chicken > Beef usually, or complex).
          *   *Team 3 (The Ecologists):* Want to minimize ecosystem harm/field deaths. Data: Crop deaths per hectare, grass vs. grain. (Complicates the Beef vs. Chicken).
          *   *Actually, to get the specific "Beef > Chicken on deaths" result:* The prompt specifically wants them to work out that *if* you count deaths per calorie, beef looks better. This is usually because one cow = many calories, many chickens = same calories. So Team 1 should definitely get the "Deaths per Calorie" brief.
          *   To create conflict, other teams need different metrics.
          *   Let's try 3 Teams of 6.
          *   *Team Alpha:* Metric = Direct Intentional Deaths per 1000 kcal. (Favors Beef).
          *   *Team Beta:* Metric = Suffering-Years per 1000 kcal. (Favors Chicken usually, due to short life/intensity, or Beef due to grass-fed freedom? Let's make it complex).
          *   *Team Gamma:* Metric = Total Mortality (including field deaths from feed) per 1000 kcal. (Favors Beef if grass-fed, Chicken if grain-fed leads to field deaths).
          *   *Wait, the prompt wants information asymmetry.* "Different teams with different data sheets, or different briefs, or both."
          *   Let's give them all the *same* goal (recommend a protein source) but different *data packs* that emphasize different variables, plus a shared "Public Data" sheet that is incomplete.
          *   *Better idea:* They are all trying to solve the same equation, but each team is missing key variables that the others have, forcing negotiation. OR, each team is assigned a specific *metric* to optimize, and they must present their "Winner".
          *   *Prompt preference:* "the argument that breaks out is about what to count, not about what's true."
          *   *Decision:* 3 Teams. Each assigned a specific *Metric Mandate* by the "Government" (the lecturer). They must calculate the "Ethical Score" for Beef, Chicken, and Lentils (control). They have different data sheets that make their metric look sensible but hide the downsides.
          *   *Team 1 (Body Count):* Focus on slaughter numbers. Data: Yield per animal, slaughter age. (Beef wins).
          *   *Team 2 (Life Quality):* Focus on lifespan/confinement. Data: Days lived, space per animal. (Chicken loses hard).
          *   *Team 3 (Collateral Damage):* Focus on crop deaths/land use. Data: Field mice per hectare, feed conversion. (Chicken loses due to grain feed).
          *   *Wait, I need to ensure the "Beef > Chicken on deaths" insight happens.* Team 1 will find this. Teams 2 and 3 should find reasons why Team 1 is wrong.
          *   *Let's refine the Roles for the JSON:*
              *   Team 1: "Minimise Direct Killing". Data: Slaughter stats.
              *   Team 2: "Minimise Suffering Duration". Data: Lifespan, confinement.
              *   Team 3: "Minimise Total Mortality (incl. wild)". Data: Field deaths, feed crops.
      *   **Rounds:**
          *   Round 1: Calculation (Internal).
          *   Round 2: Trading/Information Exchange (The "Market").
          *   Round 3: Final Recommendation & Conflict.
          *   Debrief.
      *   **Scoring:** How do they win? If they convince the "Minister" (Lecturer) their metric is the most *robust*, not necessarily which food wins. Or, they get points for consistency. Let's make it so they win if their recommended food is adopted, but the adoption depends on the *class* agreeing on a metric. This forces persuasion.
      *   **Failure Modes:** EA students short-circuiting. They will say "Actually, the correct metric is QALYs adjusted for sentience." I need a mechanism to pause them. "Protocol Cards"? Or a rule that says "You must use the assigned metric first."
      *   **Cannot Reproduce:** The prompt asks me to be honest. The game can't make them *feel* wild animal suffering or insect sentience uncertainty. That needs lecture.

  3.  **Drafting the Content (Iterative refinement):**

      *   *Title:* "The Metric Menu" (Simple, descriptive).
      *   *Setting:* 18 students, 3 groups of 6.
      *   *Materials:* Data sheets (A, B, C), Calculators, Whiteboard.
      *   *Roles:*
          *   Group 1 (The Accountants): Metric = Deaths per 10k calories. Data: Carcass weight, slaughter age. (Blind to feed crops).
          *   Group 2 (The Welfare Officers): Metric = Suffering Units (Days x Confinement). Data: Space, lifespan. (Blind to field deaths).
          *   Group 3 (The Ecologists): Metric = Total Vertebrate Deaths (Direct + Field). Data: Crop harvest mortality, grass vs grain. (Blind to confinement intensity).
      *   *Rounds:*
          1.  Calc (20 mins): Groups calculate rankings based on their metric.
          2.  The Market (30 mins): Groups can trade data points (limited trades). They realize their metric changes the winner.
          3.  The Policy Pitch (25 mins): Each group proposes the "Ethical Standard".
          4.  Debrief (15 mins).
      *   *Scoring:* Points for consistency + Points if your food is chosen. But the food is chosen by vote based on *metric justification*.
      *   *Debrief:* Needs to hit the specific points: Facts vs Metrics vs Assumptions.
      *   *Failure Modes:* EA faction. Solution: "Black Box Rule" - You must defend the assigned metric first before critiquing it. Or give the EA students a specific role that requires them to audit the metrics rather than replace them immediately. Let's suggest giving them the "Auditor" role within groups or instructing the lecturer to pause them with a "Methodology Lock".
      *   *Cannot Reproduce:* Phenomenology of suffering, insect sentience uncertainty, the "non-identity problem" feeling.

  4.  **Refining the JSON Structure:**
      *   Ensure all required fields are present.
      *   Ensure the tone is appropriate (professional, pedagogical, slightly cynical about the limitations).
      *   Check the "Beef > Chicken" logic.
          *   Beef: 1 cow = ~200kg meat = ~400,000 kcal. 1 death.
          *   Chicken: 1 chicken = ~2kg meat = ~4,000 kcal. 1 death.
          *   To get 400,000 kcal from chicken = 100 chickens = 100 deaths.
          *   So Deaths/kcal: Beef (1/400k) < Chicken (100/400k). Beef looks better.
          *   Team 1 gets this data.
          *   Team 3 gets data on field mice killed during grain harvest for chicken feed. This adds deaths to Chicken, making Beef look even better *unless* the cow is grain-fed. If the cow is grass-fed, field deaths are lower. So Team 3 needs data that shows grain-fed chicken has high collateral deaths.
          *   Team 2 gets data on lifespan. Cow lives 2 years, Chicken lives 6 weeks. Suffering years might favor Cow (less time suffering?) or Chicken (less total capacity?). Usually, intensivity favors Beef (grass-fed) over Chicken (factory).
          *   The goal is to show that *any* metric can be gamed or leads to counter-intuitive results.

  5.  **Addressing the EA Faction:**
      *   They will say "This is all nonsense, we should maximize expected utility based on sentience probabilities."
      *   Countermeasure: The game rules explicitly forbid changing the metric until Round 3. The lecturer acts as the "Procurement Officer" who rejects bids that don't follow the Request For Proposal (RFP).
      *   Also, assign the most vocal EA students to Team 1 (The Accountants). Their metric yields the counter-intuitive result (Beef > Chicken). This forces them to defend a position they might hate, using rigor they respect. This creates cognitive dissonance which is pedagogically useful.

  6.  **Addressing "Cannot Reproduce":**
      *   The prompt specifically asks for honesty here.
      *   Wild animal welfare (negative utilitarianism vs positive).
      *   Insect sentience (uncertainty).
      *   The emotional weight of death (qualitative vs quantitative).

  7.  **Final Review against Constraints:**
      *   JSON format.
      *   No laptops (calculators on phones okay).
      *   90 minutes.
      *   18 students.
      *   Specific debrief points.
      *   Specific failure modes.

  8.  **Constructing the JSON:** (Mental check of syntax)
      *   Escape quotes.
      *   Ensure arrays are valid.
      *   Check field names match the prompt's request exactly (`title`, `setting`, `materials`, `roles`, `rounds`, `scoring`, `debrief`, `failure modes`, `cannot reproduce`).

      *Self-Correction on Roles:* The prompt asks for `roles` as an array of objects with `name`, `what they want`, `what they know that the others don't`, `what they're able to do`.
      *   I need to make sure these are distinct.
      *   Team 1: "Direct Mortality Audit". Want: Lowest slaughter count. Know: Carcass yields. Able: Calculate deaths/kcal.
      *   Team 2: "Welfare Duration Audit". Want: Lowest suffering time. Know: Lifespan/Confinement data. Able: Calculate suffering-years.
      *   Team 3: "Systemic Mortality Audit". Want: Lowest total death (incl. wild). Know: Field death rates per hectare. Able: Calculate collateral deaths.

      *Self-Correction on Rounds:*
      *   Need to fit 90 mins.
      *   Intro (5)
      *   Round 1 (20)
      *   Round 2 (30)
      *   Round 3 (25)
      *   Debrief (10)
      *   Total 90.

      *Self-Correction on Failure Modes:*
      *   EA Short-circuit: Handle via "Methodology Lock".
      *   Quiet students: Use role assignment within groups (Calculator, Scribe, Spokesperson).
      *   Data fixation: Remind them data is provisional.

      *Self-Correction on Cannot Reproduce:*
      *   Phenomenal consciousness.
      *   Value of wild lives.
      *   Insect uncertainty.

      *Let's write the JSON.*

      *Wait, one detail:* "I'll bring a one-page data sheet... I'll fiddle with those numbers... design needs to make it obvious where each figure enters the arithmetic."
      *   I should mention in `materials` that the data sheets have clear variable labels (e.g., [V1], [V2]) so the lecturer can swap them easily.

      *Wait, another detail:* "The debrief should prise apart three things they'll definately mush together — which facts are disputed, which metric was chosen, and which moral-status assumptions got smuggled in."
      *   I need to ensure the `debrief` array in the JSON reflects this specific triad.

      *Wait, EA Faction:* "there's a faction in the class from the effective altruism reading group who will try to short-circuit the whole thing in the first five minutes".
      *   I need a specific strategy in `failure modes` for this.

      *Okay, ready to generate.*

      *Wait, check JSON validity.* No trailing commas, proper escaping.

      *One more thing:* The prompt asks for "roles (an array, each with name, what they want, what they know that the others don't, and what they're able to do)".
      *   Since there are 18 students, I should define the *Team Roles* rather than individual student roles, or define 3 Team Roles and imply 6 students per role. The prompt says "roles (an array...)" implying distinct types. I will define the 3 Team Types as the roles, as individual roles within teams might clutter the JSON and the core asymmetry is between teams. Actually, better to define the 3 Teams as the "Roles" in the game context.

