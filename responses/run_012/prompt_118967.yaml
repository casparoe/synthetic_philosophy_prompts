  2.  **Deconstruct Harsanyi's Theorem & The User's Twist:**
      *   *Harsanyi's Setup:* Individual utilities $U_i$, Social welfare $W$. Pareto + vNM axioms for $W$ $\rightarrow$ $W = \sum a_i U_i$.
      *   *Harsanyi's Impartial Observer:* To get $a_i = 1$ (or equal), Harsanyi invokes an "impartial observer" behind a veil of ignorance (equiprobability of being anyone).
      *   *User's Move:* Keep $W = \sum a_i U_i$, but determine $a_i$ via "strength of claim" rather than equiprobability.
      *   *The Tension:* Harsanyi's theorem is *formal*. It guarantees the *linear form*, not the *weights*. The weights are normatively underdetermined by the math alone. The user wants to fill that gap with "claims."

  3.  **Brainstorming Defeaters (Internal to the Derivation):**

      *   *Defeater 1: The Measurement/Interpersonal Comparison Problem.*
          *   Harsanyi's theorem assumes utilities are cardinally measurable and interpersonally comparable (up to a common scale).
          *   If weights $a_i$ vary, we need to know if $U_i$ are on the *same* scale. If $U_1$ is in "hedons" and $U_2$ is in "dollars," $a_i$ adjusts for units. But if $U_i$ are already normalized vNM utilities (0 to 1), varying $a_i$ implies some people count *more* per unit of utility.
