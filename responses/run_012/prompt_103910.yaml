answer: |-
  The implicit theory is a pragmatic gradualism that assigns crustaceans a provisional moral status too uncertain to mandate welfare costs, while granting fish a definitive status warranting regulation.

  This pattern presupposes that moral status is not binary but graded, correlating with neurological complexity and phylogenetic proximity to humans. Finfish, as vertebrates, possess nervous systems analogous to mammals, licensing a presumption of sentience that overrides economic inconvenience. Crustaceans, with diffuse ganglia, occupy an epistemic gray zone; the industry operates as if their potential suffering carries less moral weight or requires higher evidentiary thresholds before triggering obligations. This theory best explains the disparity while accommodating the recent "nudge." Pure Economic Tractability fails as a sole explanation because fish welfare also incurs costs yet is mandated; if profit were the only driver, fish standards would be as lax as shrimp standards. Hard Insentience Denial is ruled out by the industry's adaptive response to new legal sentience recognitions; if they believed crustaceans definitely lacked capacity, legal shifts would be ignored rather than incorporated into advertising. Thus, the practice commits to a view where sentience is a matter of degree or probability, and moral obligation kicks in only above a certain threshold of certainty or capacity.

  Strictly speaking, the practice presupposes only that welfare obligations are species-relative and contingent on operational feasibility. It does not logically require the belief that crustaceans feel less pain, only that they are treated as such. However, the pattern fits comfortably with taxonomic speciesism (vertebrates count, invertebrates do not) and cost-benefit utilitarianism (suffering is weighed against production costs). These rival theories license the practice just as well but are not strictly necessary; one could be a gradualist who believes vertebrates simply have higher cognitive capacities without being speciesist. The practice quietly rules out strong sentience egalitarianism, which would demand identical welfare standards across taxa, and hard biological determinism, which would deny the possibility of crustacean sentience regardless of new evidence. The flexibility of the "responsibly sourced" banner suggests the theory is not fixed dogma but a working hypothesis subject to revision.

  Philosophically, the pattern is underdetermined regarding the nature of the threshold. It remains unclear whether the line is ontological (crustaceans lack the substrate for pain) or epistemic (we cannot yet prove they feel pain). The practice also leaves ambiguous whether the cutoff is static or dynamic; the recent legal nudges suggest movability, but the current silence suggests a high barrier to entry. Furthermore, the theory does not specify whether "welfare" encompasses only pain avoidance or includes behavioral freedoms; the lack of stocking density caps for shrimp suggests the latter is ignored, but this could be due to measurement difficulty rather than moral irrelevance. Consequently, the practice allows multiple metaphysical interpretations of moral status to coexist, unified only by the operational outcome of differential treatment.

  If this pragmatic gradualism were replaced by the Precautionary Principle—the best-supported rival given emerging neuroethological evidence—operational changes would be drastic. The presumption of sentience would shift: instead of requiring proof of pain to regulate, the industry would need to prove insensibility to avoid regulation. Specifically, slaughter codes would mandate effective stunning for crustaceans, such as electrical or rapid thermal methods, banning boiling alive and chilling. Hatchery practices would prohibit eyestalk ablation unless anaesthetized, or require alternative spawning induction methods. Stocking densities would become welfare-relevant variables, capped to prevent stress-induced cannibalism or disease. What would stay the same is the fundamental goal of production; the industry would not cease, but costs would rise, likely consolidating production among larger firms capable of absorbing welfare technologies. The definition of "responsibly sourced" would tighten to include invertebrate-specific welfare metrics rather than relying on vertebrate proxies.

  Finally, a candid note on uncertainty: the disagreement turns largely on empirical questions philosophy cannot settle. Whether a decapod ganglion processes nociception as subjective pain is a neurobiological fact, not a logical truth. Philosophy can dictate that if they feel pain, they deserve protection, but it cannot determine if they feel pain. Therefore, the theory must be held probabilistically. Until empirical consensus is reached, the ethical stance should favor the precautionary approach, acknowledging that the cost of falsely attributing sentience is economic, while the cost of falsely denying it is moral catastrophe. The current practice hedges this risk unevenly, protecting fish while gambling with crustaceans; a coherent ethic must align the burden of proof with the severity of the potential harm.
