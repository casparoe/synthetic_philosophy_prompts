      *   **Research Question:** Does the dispersal of the sanctioning agent explain the distinctive normative problems of these episodes? Can missing obligations be reconstructed without centralizing authority?
      *   **Critique of Existing Literature:** Existing camps (it is/isn't punishment) treat the punisher as a given. Informal sanction literature assumes individual acts can be assessed on their own (ignoring the aggregation problem).
      *   **Method:** Structural account of punishment -> Case studies -> Isolate missing elements due to dispersion -> Examine reconstructions (norms, rights, clauses) -> Historical analogy (outlawry/civil death).
      *   **Deliverables:** 8-10k word paper + short general-audience version.
      *   **Constraints:** 6 months. Must state failure conditions. Must be neutral framing (appeal to both "moral panic" and "accountability" camps). No citations needed. Realistic scope assessment.

  2.  **Deconstruct the Core Argument & Framing:**
