answer: |-
  **Project Title:** The Architecture of Sanction: Agent Dispersal and the Normative Structure of Social Accountability

  **Project Summary**
  Public debates regarding "cancel culture" typically stall over a definitional question: does social sanctioning count as punishment? One side argues it lacks the authority and rules of formal punishment; the other argues it achieves the same expressive function and material harm. Both approaches treat the *agent* of sanction as a secondary feature. This project proposes that the primary normative distinction lies in the **dispersal of the sanctioning agent**. In formal punishment, a specific authority bears obligations (notice, proportionality, a path to reinstatement). In distributed social sanctioning, the harm is an aggregate of individually trivial acts by a crowd, leaving no specific agent responsible for these obligations. This project asks: **Does the dispersal of the sanctioning agent independently explain the normative deficits of these episodes, and can the missing obligations be reconstructed without centralizing authority?**

  **Research Question**
  To what extent does the structural dispersal of the sanctioning agent prevent the attachment of normative obligations (proportionality, appeal, reinstatement) that are constitutive of legitimate punishment, and is it possible to reconstruct these obligations within a distributed framework?

  **Significance and Intervention**
  Current literature creates a false dichotomy. If the phenomenon is defined as "not punishment," it escapes the normative constraints of penal theory. If defined as "punishment," it is often dismissed as illegitimate because it lacks institutional authority. Both camps assume that if we can classify the act, we have solved the normative problem.

  This project argues that classification is insufficient. The core issue is an **aggregation problem** familiar in ethics (e.g., climate change, voting) but under-applied in penal theory: individual acts of criticism or disassociation may be permissible, yet their aggregate produces a status harm comparable to exile or civil death. Because no single contributor causes the harm, no single contributor bears the duty to manage it.

  This framing is neutral regarding the merit of specific criticisms. It does not presuppose that the targets of sanction are innocent, nor that the phenomenon is a "moral panic." It grants that the underlying criticism may be entirely justified. The question is strictly structural: even when criticism is fair, does the *mechanism* of dispersed enforcement create normative blind spots that centralized enforcement does not? This allows the project to speak to critics who view these episodes as necessary accountability, as well as those who view them as mob justice, by focusing on the *process* rather than the *outcome*.

  **Methodology**
  The project proceeds in four phases:

  1.  **Structural Baseline:** Establish a "checklist" of constitutive elements required for a sanction to carry standard normative obligations (e.g., identifiable agent, codified rule, right of reply, defined endpoint). This avoids relying on intuitions about what counts as punishment.
  2.  **Comparative Case Analysis:** Apply the checklist to a spectrum of sanctions: formal (court sentence, firing), semi-formal (excommunication, professional censure), and distributed (consumer boycotts, social media pile-ons). The goal is not to categorize them, but to isolate which obligations drop out as the agent becomes more dispersed.
  3.  **Historical Analogy:** Examine historical precedents for non-institutional status harm, specifically outlawry and civil death. This tests whether the "dispersal" problem is unique to digital crowds or inherent to any non-institutional status removal.
  4.  **Reconstruction:** Evaluate candidate mechanisms to restore obligations without centralizing power. Examples include: anonymity norms, sunset clauses on social memory, or distinct duties for "amplifiers" versus "originators."

  **Timeline (6 Months)**

  *   **Month 1: Foundations.** PI defines the structural checklist of penal obligations. RA conducts literature review on aggregation problems in ethics and informal sanctioning. *Milestone: A working definition of "constitutive obligations."*
  *   **Month 2: Case Selection & Mapping.** PI and RA select 4-6 paradigm cases representing the spectrum of sanction. RA summarizes the factual timeline and agent structure for each. *Milestone: Case dossier.*
  *   **Month 3: Analysis & Analogy.** PI applies the checklist to cases. Parallel research into outlawry/civil death to determine if dispersal or *informality* is the key variable. *Milestone: Draft of analytical core.*
  *   **Month 4: Reconstruction.** PI develops and stress-tests the "reconstruction" proposals. Do sunset clauses work? Do they undermine the sanction's legitimacy? *Milestone: Draft of normative proposals.*
  *   **Month 5: Drafting.** PI writes the full manuscript (8,000–10,000 words). RA assists with citation management and initial copy-editing.
  *   **Month 6: Revision & Public Output.** PI revises based on internal review. PI and RA collaborate on the general-audience version (1,500 words). *Milestone: Submission-ready manuscript.*

  **Deliverables**
  1.  **Academic Article:** A 8,000–10,000 word paper suitable for a journal in political philosophy, ethics, or legal theory.
  2.  **Public Essay:** A 1,500 word non-technical summary suitable for a magazine or blog, focusing on the "aggregation" insight rather than technical penal theory.

  **Feasibility and Risk Assessment**
  **Scope:** This project is feasible within six months because it limits empirical work to conceptual analysis of existing public cases. It does not require new data collection or interviews. The RA support is crucial for Month 1 and 2 to ensure the PI can focus on the argument structure.

  **Failure Conditions:**
  1.  **The Redescription Failure:** If analysis shows that the "crowd" can be coherently redescribed as a single moral agent (e.g., "Public Opinion"), the core thesis collapses. The proposal acknowledges this: if the crowd functions as a unified agent, the dispersal argument fails.
  2.  **The Triviality Failure:** If the only viable reconstructions are banal (e.g., "people should be nicer"), the project lacks normative bite.
  3.  **The Scope Creep Failure:** If the "outlawry" analogy proves too complex, it will be cut in Month 3 to preserve time for the reconstruction phase.

  **Success Criteria:**
  The project succeeds if it demonstrates that agent dispersal is a *variable* that correlates with the loss of specific normative obligations, independent of whether the sanction is deemed "punishment." Even a negative result (i.e., proving that dispersal does not alter the obligations) is a substantive philosophical contribution that resolves the current stalemate.

  **Budget Justification**
  Funds are requested primarily for the Research Assistant (20 hours/month for 6 months) to handle literature synthesis and case summarization, allowing the PI to focus on argument construction and drafting. Remaining funds cover open-access publication fees and honoraria for potential peer feedback.
