      *   *The Pivot:* Move from "Is this punishment?" to "What does the *structure of the agent* do to the normative logic of the sanction?"
      *   *The Aggregation Problem:* This is key. Individual acts (tweeting, unfollowing) are permissible; the aggregate is harmful. Philosophy of punishment hasn't tackled this well.
