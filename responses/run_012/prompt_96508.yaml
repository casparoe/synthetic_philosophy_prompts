answer: |-
  First, sorting the comparisons the committee faced requires isolating the specific goods at stake in the written records. The goods include *more life* (medical prognosis), *being a parent* (dependents), *being useful to others* (occupation/public service), *being loved* (marital status/emotional stability), and *distributing fairly* (the implicit duty to the pool of applicants).

  Ordinary **better-or-worse** judgments arose when one candidate dominated another on a single scale without trade-offs. For example, if Patient A had a significantly higher probability of survival (*more life*) and Patient B had a lower probability, with all social criteria equal, the choice was straightforward. Similarly, if Patient A was fully self-supporting (*useful to others*) and Patient B required total financial subsidy, with medical prospects equal, the committee could rank A over B on the scale of resource efficiency.

  **Ties** (equality) would theoretically occur if two candidates were identical across all criteria—same age, same dependents, same prognosis, same social standing. In practice, this was likely rare, but where it occurred, the values were not in conflict; they were balanced.

  **Incommensurable** comparisons arose when the goods on each side belonged to different orders of value with no common measure. Consider a candidate with poor medical prognosis but many dependents (*being a parent*) versus a candidate with excellent prognosis but no social ties (*more life* vs. *being loved/parent*). There is no unit in which to measure "one year of life" against "three orphaned children." To say one is better requires a category error. The committee faced this when weighing *keeping faith with a particular patient* (the doctor's duty to the one before them) against *distributing fairly* (the duty to the population). These are distinct moral obligations that cannot be summed.

  **Parity** applies where candidates are comparable but neither better nor equal. Imagine Candidate A has slightly higher income (*useful to others*) and Candidate B has slightly better emotional stability (*being loved*). Neither is overall better; they are not equal; yet a small improvement in A's income would make A the clear choice. Here, both choices are rationally permissible. The committee likely encountered parity frequently when weighing *church attendance* against *past performance*. One is not clearly superior, but they are close enough that a nudge tips the scale. In these cases, the committee could choose either without irrationality, provided they acknowledged the permissibility of both.

  Second, the scoring procedure functions differently depending on the reading. On the **commensuration reading**, the procedure presupposes that *more life*, *social worth*, and *dependents* are all convertible into a single currency of "admissibility points." It assumes a hidden common scale exists and the committee's job is merely to calculate it. On the **incommensurability reading**, the procedure manufactures a surrogate scale. It imposes a false precision on heterogeneous goods to force a ranking where none naturally exists. It treats *being a parent* as if it were a quantity of *social utility*.

  The reading that better explains the moral character of the episode—specifically the revulsion toward the criteria—is the incommensurability reading. If the goods were truly commensurable, the revulsion would attach only to the *weights* assigned (e.g., "you valued income too highly"). But the outrage is directed at the *act of valuation itself*. We recoil at the idea that *church attendance* can compensate for *medical need*. This suggests the revulsion stems from the violation of the values' distinct natures. Incommensurability explains this feature; it does not merely redescribe it. It identifies that the scoring procedure commits a metaphysical error by treating distinct goods as fungible. The horror is not that the math was hard, but that the math was impossible. The procedure masks the tragedy of the choice by pretending it is a technical calculation rather than a moral conflict.

  Third, running the case back against the theory: does the existence of a workable procedure that produced decisions prove the goods were commensurable? It does not. The fact that a decision was made shows only that a decision *had* to be made, not that the values were compatible on a single scale. Human will can choose between incommensurables without a common measure. Evidence for commensurability would require that the procedure yielded outcomes that commanded universal rational assent without moral residue—that observers would agree, "Yes, that score correctly reflects the value of that life." Evidence for incommensurability is found in the secrecy of the committee, the public outcry when the criteria were revealed, and the lingering sense that every selection involved a moral loss that could not be canceled out by the gain. The workability of the procedure demonstrates the pressure of scarcity, not the structure of value. It shows that agents can force closure on incommensurable choices, not that the choices were commensurable to begin with.

  Fourth, consider the standard treatment of hard choices for an individual. When an individual chooses between incommensurables, right choice often leaves a "remainder"—a rational regret for the value forgone. The chooser owes acknowledgment to the road not taken. When the chooser is an anonymous, rotating committee deciding on files, this dynamic fractures. The diffusion of the burden is a loss, not an improvement. It sanitizes the moral cost. An individual chooser embodies the conflict; the committee disperses it until no single agent holds the responsibility. A corporate body cannot have the analogue of regret. Files do not bleed, and committees do not grieve. If the phenomenon of regret belongs to the agent's relationship with the values, then removing the specific agent obscures the reality of the loss. The values remain incommensurable, but without an agent to feel the remainder, the moral truth of the situation is suppressed. The committee structure allows the system to function, but it does so by insulating the decision-makers from the very moral residue that confirms the incommensurability of the goods.

  Fifth, scarcity was eventually abolished politically via Medicare coverage. This impacts the theory's scope by showing that incommensurability is a fact about values *within* constrained situations, not necessarily a fact about the values in isolation. *More life* and *financial cost* are incommensurable when you must trade one for the other. If you remove the trade-off by expanding resources, the hard choice disappears, but the values remain distinct. Incommensurability is not dissolved; the situation requiring the comparison is. However, buying one's way out of a hard choice can be an evasion. If the theory says some values should not be traded (e.g., justice for money), then simply paying to avoid the choice might be a moral failure if the resources were needed elsewhere. The theory cannot dictate when expanding the option set is virtuous and when it is evasion; it can only analyze the structure of the choice once the set is fixed. If we refuse to enlarge the option set when we could, we are choosing to maintain the incommensurable conflict. The theory identifies the conflict but cannot mandate the budget.

  Finally, the framework goes silent on the specific action required when reasoning runs out. A decision-maker facing this case cannot learn from the thesis of incommensurability *which* patient to select. The thesis explains why the scoring is false, but it does not generate a true alternative algorithm. Regarding the lottery: the framework does not strictly mandate a lottery, though it makes it a strong candidate. If options are incommensurable or on a par, rational optimization fails. A lottery respects the equality of the candidates without falsely claiming one is better. However, the thesis of incommensurability itself has nothing to say *for* the lottery over a arbitrary choice by a director, except that both acknowledge the failure of ranking. It cannot tell the decision-maker that a lottery is *right*, only that ranking is *wrong*. The framework diagnoses the breakdown of comparative judgment but offers no prescription for how to act once that breakdown is acknowledged, leaving the decision-maker with the permission to choose but no map for the choice.
