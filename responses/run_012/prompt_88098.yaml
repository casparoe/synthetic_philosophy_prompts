answer: |-
  There is no single, canonical noun phrase for this specific structural vulnerability in explanation-ranking (e.g., there is no "Gödel's Agent Theorem"). However, the pattern you describe is a recognized pathology in **Algorithmic Information Theory**, **Bayesian Model Selection**, and the **Philosophy of Religion**.

  In information theory, it is often discussed as a failure mode of **Minimum Description Length (MDL)** or **Solomonoff Induction** when the hypothesis space includes "optimizers" or "agents" without penalizing the complexity of their goals. In philosophy, it is the formal underpinning of the **Design Argument** and the epistemic appeal of **Conspiracy Theories**.

  If a label is required, the most precise existing term is **The Teleological Compression Loophole**. In cognitive science, the tendency to utilize it is called **Hyperactive Agency Detection**, but that describes the *psychological* bias, whereas you are describing the *logical* asymmetry that rewards it.

  Below is the careful definition you requested, followed by the distinctions and implications.

  ### A Definition with Edges

  **The Pattern:** **Teleological Compression Bias**
  **Definition:** A systematic error in explanation ranking where hypotheses positing an intentional agent are assigned a lower description length (complexity cost) than mindless hypotheses, because the complexity of the *data* is illicitly transferred into the *agent's internal state* without being counted against the hypothesis's total length.

  **The Mechanism:**
  1.  **Mindless Hypothesis ($H_M$):** Must encode the regularity explicitly. Cost $\approx K(\text{Data})$.
  2.  **Agent Hypothesis ($H_A$):** Encodes an Agent + A Goal. Cost $\approx K(\text{Agent}) + K(\text{Goal})$.
  3.  **The Bias:** The ranking system treats $K(\text{Goal})$ as negligible (e.g., "He wanted *this*") or assumes the Agent's nature implies the Goal without cost.
  4.  **The Result:** $H_A$ wins because it appears to compress the data, but it only does so by hiding the data inside the unobserved mind of the agent.

  **The Edge (Where the definition holds):**
  The bias exists only when the **Goal** is defined indexically over the observations ("He wanted *these* results") or when the **Agent's Nature** is sufficiently vague to accommodate any outcome ("He acts for reasons unknown").

  **The Boundary (Where the bias vanishes):**
  The bias disappears if the Agent's Goal must be specified *independently* of the data. If you must write down the Agent's utility function *before* seeing the data, and that function happens to predict the data, the compression is real. If the utility function is "Maximize the exact sequence of bits observed," the cost is equal to the mindless hypothesis.

  ---

  ### Distinctions from Related Problems

  You asked how this differs from three specific epistemic problems. The distinction lies in *when* the advantage is gained and *how* it is protected.

  **1. Vs. The Problem of Induction**
  *   **Induction** asks: "Why should we expect the future to resemble the past?" It is a justification for projecting regularity.
  *   **Teleological Compression** *answers* induction by positing a maintainer. It does not suffer from the problem of induction; it dissolves it. The agent *guarantees* the regularity.
  *   **Difference:** Induction is a gap in justification; this pattern is a (potentially fraudulent) bridge across that gap. A device using this ranking would not struggle with induction; it would solve it by hallucinating managers.

  **2. Vs. Unfalsifiability (Conspiracy Theories)**
  *   **Unfalsifiability** is a defensive property: "No evidence can prove me wrong."
  *   **Teleological Compression** is an offensive property: "I am the shortest explanation."
  *   **Difference:** A hypothesis can be falsifiable but still win via this bias. For example, "The CEO rigged the earnings" is falsifiable (find the emails). But until falsified, it wins on brevity because "CEO rigged it" is shorter than "Random market fluctuations coincidentally aligned." This pattern explains *why* we are drawn to conspiracies before we even consider their testability.

  **3. Vs. The Invisible Gardener (Fleeting Falsifiability)**
  *   **The Gardener** (Wisdom's Parable): The claim retreats as evidence mounts (invisible, then intangible, then undetectable). This is *post-hoc* modification to save a hypothesis.
  *   **Teleological Compression:** This is *pre-hoc* selection. The agent hypothesis wins at the starting line because it is short. It does not need to retreat; it accommodates the new evidence immediately because "The Agent wanted this new evidence too" costs nothing extra.
  *   **Difference:** The Gardener changes the hypothesis to fit the data. The Agent hypothesis keeps the hypothesis constant ("An Agent is managing this") and absorbs the data cost into the Agent's hidden intentions.

  ---

  ### Implications for a Ranking Device

  **1. Would it expect management everywhere?**
  **Yes.** A device optimizing purely for description length, without a specific penalty for the complexity of *unobserved mental states*, would converge on **Animism** or **Panpsychism**.
  *   *Why?* "The rock fell because it wanted to go down" is shorter than "The rock fell due to gravitational curvature of spacetime governed by Einstein's field equations."
  *   Unless the device is forced to specify *how* the rock wants to go down (which requires the physics), the intentional stance is always the shorter program. This suggests that **Occam's Razor is hostile to naturalism** unless "natural laws" are treated as primitives cheaper than "minds."

  **2. Can the premium be removed without an ad hoc tax?**
  **Yes, but it requires rigorous accounting.** It is not an ad hoc tax to demand that the **Goal** be encoded explicitly.
  *   **The Fix:** In Algorithmic Information Theory, you cannot say "Agent wants *this*." You must output the program for the Agent. If the Agent's decision function requires the data as input to produce the data as output, the program length is $K(\text{Agent}) + K(\text{Data})$.
  *   **The Saving:** The only time the Agent hypothesis *legitimately* wins is when the Agent has a **simple, general goal** that *incidentally* produces complex data.
      *   *Example:* "Maximize entropy" is a short goal that produces complex-looking gas distributions.
      *   *Counter-Example:* "Arrange these coin flips to be HHTHT..." is a long goal.
  *   **The Tax:** The "tax" is simply the requirement that the Agent's utility function be specified in a language that does not allow indexical pointers to the observed data.

  ### Cases on Either Side of the Edge

  To solidify the definition, here are two cases: one where the ranking is valid, and one where it is the pathology you described.

  **Case A: Legitimate Compression (The Engineer)**
  *   **Data:** A sequence of radio pulses encoding prime numbers.
  *   **Mindless Hypothesis:** "Natural pulsar with complex magnetic interference coincidentally mimicking primes." (Very long description of the interference).
  *   **Agent Hypothesis:** "An extraterrestrial intelligence transmitting primes."
  *   **Why it wins legitimately:** The goal "Signal existence using mathematical universals" is short. It does not specify the *exact* noise pattern, only the semantic content. The Agent hypothesis compresses the *semantic* regularity which is unlikely to arise mindlessly. The Goal is independent of the specific noise.

  **Case B: The Pathology (The Conspiracy)**
  *   **Data:** A specific, messy run of stock market crashes, election results, and celebrity deaths.
  *   **Mindless Hypothesis:** "Independent stochastic processes." (Long, but honest).
  *   **Agent Hypothesis:** "The Illuminati arranged these events."
  *   **Why it wins illegitimately:** To explain the *specific* timing and nature of these events, the "Illuminati Plan" must be as detailed as the events themselves. If the hypothesis is just "They arrange things," it predicts nothing. If it is "They arranged *this*," it is as long as the data. The brevity comes from leaving the Plan opaque. This is the **Teleological Compression Loophole** in action.

  ### Summary
  The pattern is the **Teleological Compression Loophole**. It arises when the complexity of a specific outcome is hidden inside the unspecified intentions of a posited agent. It differs from unfalsifiability because it is a claim of *brevity* rather than *invulnerability*. It implies that unregulated model selection will default to animism. It is corrected not by banning agents, but by demanding that the agent's goals be specified with the same precision as the physical laws they replace.
