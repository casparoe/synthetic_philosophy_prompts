      *   *Nuance:* On the innocent punishment point, act-utilitarians *do* theoretically accept it if the utility is high enough, but they argue the *real-world* utility is never high enough due to trust erosion. I need to make sure the professor knows this distinction.
      *   *Nuance:* On *lex talionis*, mention proportionality vs. literal equivalence.
      *   *Nuance:* On vengeance, emphasize the *institutional* vs. *personal* distinction.

  5.  **Final Review against User Prompt:**
      *   Did I walk through claim by claim? Yes.
