      *   Did I specify what to keep/rewrite? Yes.

  6.  **Final Polish:** Ensure tone is collegial and suitable for an ethics professor. (e.g., using terms like "caricature," "normative force," "act vs. rule").

  *(Self-Correction Note)*: I should explicitly mention H.L.A. Hart. His distinction between the General Justifying Aim and Distribution is crucial for showing they aren't "flatly opposed." I'll add that to the "Opposition" section.

