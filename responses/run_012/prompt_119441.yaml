answer: |-
  Two evolutionary biologists are watching a time-lapse of a social amoeba colony collapse. A cheater strain has forced its way into the spore head, leaving the stalk cells too few to support the weight. The fruiting body topples, the spores hit the mud, and nothing disperses.

  "Well," says the first biologist, "there goes group selection. The colony with too many defectors went extinct."

  "Exactly," says the second. "And there goes individual selection. The cheater allele maximized its frequency within the slug and drove its own lineage to extinction."

  They watch the screen in silence as the cells dry out.

  "So," asks the first, "what exactly just got selected against?"

  The second checks his data sheet. "Oh, we agree on all the mortality rates. We just disagree on what counts as an individual."

  **Note on Biology and Theory**
  This joke simplifies the *Dictyostelium* life cycle; in nature, kin recognition and policing mechanisms often prevent cheaters from completely dominating a slug to the point of total reproductive failure. Additionally, the punchline leans on a specific philosophical reading of the units of selection debate (specifically the distinction between MLS1 and MLS2 frameworks), implying the disagreement is purely ontological. In practice, biologists often argue over statistical partitioning of variance rather than the metaphysical status of the "individual."

  **Explanation of Choices**
  I chose this structure because the prompt requires an audience familiar with the technical debate, meaning the humor cannot rely on basic definitions or puns on "selfishness." The setup establishes the empirical reality common to both sides of the debate (the cheater wins locally, the colony loses globally), which mirrors the actual data both camps agree upon. The punchline targets the core philosophical impasse: that the disagreement is not about the numbers, but about the entity to which those numbers apply. By ending on "what counts as an individual," the joke highlights that the units of selection debate is fundamentally a dispute over ontology disguised as a dispute over mechanism, which is the genuine tension requested. I avoided variants to maintain focus on this specific ontological irony.
