      *   *Key Nuance:* It's not just behavior changing (Hacking's looping); it's the *validation criteria* being contaminated by the classification process itself.
      *   *Epistemic Circle:* The tool used to measure (self-report based on criteria) is influenced by the thing being measured (the diagnosis).

  3.  **Evaluate Candidate Concepts:**

      *   **Hacking's Looping Effects:**
