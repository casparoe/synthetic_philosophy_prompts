      *(Self-Correction during drafting)*: Ensure I don't slip into explaining HOT. When Nadia says "I know I'm in pain," that's the HOT. When Sam says "I feel nothing," that's the missing HOT. The readers know the theory; the characters just live the glitch.

      *Word Count Check:* I need to expand on the sensory experience of the "meta" pain vs the "raw" pain. Nadia's pain is clean, sharp, conceptual. Sam's pain is messy, biological, unseen.

      *The Rock:* Why is the tech running it on a rock? Maybe stress testing the signal generation. "If the signal is all that matters, the substrate shouldn't matter." But it does.

      *Ending:* Needs to be earned. Elara turns the machine off? Or leaves it on? Leaving it on seems more unsettling.

