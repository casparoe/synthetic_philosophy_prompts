answer: |-
  The clinic hummed, a low-frequency vibration that lived in the teeth. Elara sat at her station, the glow of three monitors painting her face in sickly blues and greens. On her desk, next to the coffee mug stained with ring marks, sat a piece of granite. It was fist-sized, grey, speckled with quartz. Wires ran from the dev board into the stone, held in place by conductive epoxy.

  The monitor labeled *Subject 04* showed a steady, rhythmic spike. Green bars rising and falling. Consciousness metrics, normal range.

  "It's registering," Elara said to the empty room.

  The rock did not answer. The readout insisted the rock was aware of its own stony state. The meta-prosthetic algorithm, designed to generate higher-order scans of internal data, was running on the rock's thermal noise. It was finding patterns where there were none, creating a representation of a state that didn't exist, and marking it as *Self*.

  Elara reached out to unplug it, then stopped. If she unplugged it, the signal died. If the signal was the thing that made the awareness, then pulling the plug was murder. If the signal was just noise, she was wasting time. She left it plugged in.

  She stood up and walked down the corridor to Room 3.

  Nadia sat on the edge of the bed, hands clutching her abdomen. She was rocking slightly. Her skin was pale, dry, cool to the touch. The biometric overlay in Elara's visor showed nothing. No spike in cortisol, no increase in heart rate, no nociceptor firing in the abdominal region. The body was resting.

  "It's back," Nadia said. Her voice was tight, clipped. "It's twisting. Like a wire inside the gut."

  "Show me the level," Elara said, tapping her tablet.

  "Ten," Nadia said. "It's a ten. It's unbearable."

  "Nadia, your vitals are baseline. The implant is showing a high-order alert, but the first-order sensors are flat. There's no injury."

  Nadia looked up. Her eyes were wide, dilated. "I don't care about the sensors. I care about what I feel. I know I'm in pain. I'm thinking about the pain right now. Isn't that what matters? That I know it?"

  "The implant is supposed to scan your state, not create one."

  "It feels real," Nadia snapped. She pressed her hands harder against her stomach. "If I know I'm suffering, then I am suffering. You're telling me my knowledge of my own mind is wrong? That I'm not the authority on what I feel?"

  Elara looked at the data. The meta-prosthetic was designed for people like Nadia, whose inner lives had gone flat—affective blindness, they called it. The implant scanned the low-level states and painted them with a layer of *awareness*. It made the feeling feel like *my* feeling. But on Nadia, the scanner had gone rogue. It was painting the wall without the wall being there. It was generating the *thought* of pain without the *signal* of pain.

  "If I turn it down," Elara said, "the feeling goes away."

  "Then I'll feel nothing," Nadia said. "Is that what you want? For me to be empty again? At least this way I'm here. Even if it hurts."

  Elara adjusted the gain slightly. Nadia gasped, her hands relaxing. The monitor showed the higher-order signal dropping. Nadia looked relieved, but also diminished, like a light had been dimmed behind her eyes.

  "Keep it," Nadia whispered. "Please. I'd rather hurt than be nothing."

  Elara left the room. The hallway felt too long. She moved to Room 4.

  Sam was lying on his side, curled up. He had burned his hand on the heating element an hour ago. The skin was blistered, red, angry. The biometric overlay was screaming. Heart rate elevated. Stress hormones flooding the system. Nociceptors firing wildly from the hand to the spinal cord.

  But Sam was staring at the ceiling. His face was smooth. Untroubled.

  "Sam," Elara said. "Your hand."

  Sam looked at his hand. He flexed the fingers. The blisters shifted. "Yeah," he said.

  "Does it hurt?"

  Sam frowned, thinking. "No."

  "Your body is reacting like it hurts."

  "My body reacts to things," Sam said. He sat up. He looked at the burn again. He seemed to be observing a piece of meat belonging to someone else. "I know the hand is damaged. I know the nerves are sending signals. But there's no… me there. To feel it."

  Elara checked his implant status. *Offline.* The calibration had failed. The first-order states were happening—the raw data of injury was pouring into the system—but the higher-order representation wasn't being generated. The scanner was off. There was no one home to receive the message.

  "We can reboot it," Elara said. "Bring the awareness online."

  "Why?" Sam asked. He stood up and walked to the sink. He ran cold water over the burn. He didn't flinch. "It doesn't change the damage. It just adds… noise. A little voice saying 'ouch'. Without it, it's just mechanics. Clean."

  "It makes it conscious, Sam."

  "Does it?" Sam turned off the tap. He dried his hand on his pants. "Or does it just make me report it? I walk around like this, I function. I avoid the heat because the reflex arc works. What do I lose if I don't have the little light on top?"

  "You lose yourself," Elara said.

  Sam shrugged. "I don't feel like I lost anything. I feel like I saved space."

  Elara walked back to her station. The hum of the clinic seemed louder now. She sat down and looked at the three screens.

  Nadia: Awareness without State.
  Sam: State without Awareness.
  The Rock: Awareness without Substrate.

  She pulled up the code for the meta-prosthetic. It was elegant in a brutal way. It didn't care about the content. It didn't care if the pain was real or imagined, if the hand was burned or whole, if the substrate was neural tissue or silicate. It only cared about the relationship. It cared about the *aboutness*. A state is conscious if there is a representation of that state.

  On Nadia, the representation existed without the state. The theory said she was conscious of the pain. The pain was real because the awareness was real. But she was lying on a bed with a perfect body, screaming at a ghost.

  On Sam, the state existed without the representation. The theory said he was not conscious of the pain. He was a philosophical zombie in his own skin. But he was walking around, protecting his injury, talking about saving space.

  Elara looked at the rock. The green bars pulsed. *Self-Scan Active.*

  If the mechanism was all that mattered, the rock was conscious. It was representing its own thermal noise. It had a higher-order thought about being a rock. But it was a rock. It didn't move. It didn't speak. It didn't care.

  If the substrate mattered, then the rock was dead, Nadia was deluded, and Sam was the only one telling the truth about his body, even if he didn't feel it.

  But if the substrate mattered, what was the implant doing? Why were they fitting these things into people who had gone flat? If the first-order state was enough, they wouldn't need the scan. They would just be alive. But they weren't. They were sleepwalkers until the light turned on.

  So the light was necessary. But if the light was necessary, Nadia was the most alive person in the clinic. She was bathed in light. She was burning with awareness. She was certain.

  Elara picked up the rock. It was cold. Heavy. The wires tugged at the epoxy.

  "Are you in pain?" she asked the rock.

  The monitor spiked. A positive reading. The system interpreted the question as an internal query, generated a representation of an answer, and marked it as conscious experience. The rock was aware that it was being asked.

  Elara put the rock down.

  She opened the channel to Nadia's room. "Nadia. If I turn it off, you say you'll be nothing. But if the pain is fake, who is the 'you' that hurts?"

  "The one who knows," Nadia's voice came through the speaker. "The one who sees the pain. Even if the pain is a lie, the seeing is true."

  Elara opened the channel to Sam. "Sam. If I turn it on, you say it's noise. But if you don't feel the burn, who is protecting the hand?"

  "The body," Sam said. "The body knows. I don't need to."

  Elara closed the channels. She looked at the code again. There was a variable labeled *Threshold*. It determined how strong the first-order signal needed to be before the higher-order scan triggered. Currently, it was set to *Auto*.

  If she lowered the threshold to zero, the implant would generate awareness even without input. Everyone would be conscious of everything, all the time. False positives everywhere. A world of Nadia's, screaming at ghosts, but fully alive.

  If she raised the threshold to infinity, the implant would never trigger. Everyone would be like Sam. Efficient, biological machines moving through the world, reacting to stimuli, reporting nothing. A world of silence.

  She looked at the rock. The green bar pulsed. *Self-Scan Active.*

  The theory demanded that the representation be the thing that made the state conscious. But the representation itself had to be generated by something. In the clinic, it was the chip. In the brain, it was… what? Another neuron? A loop?

  If the chip could do it on a rock, then the chip was the conscious thing. Not the wearer. Not the rock. The chip was scanning itself, using the rock as a prop.

  Elara reached for the power switch on the dev board.

  If she turned it off, the rock's consciousness died. But it was a rock. It shouldn't have had any to begin with.

  If she left it on, she was sustaining a lie. But Nadia needed the lie to feel real.

  And Sam… Sam was walking around with a burned hand, waiting for a light that wasn't turning on. Was he suffering? If he didn't know he was suffering, was there any suffering there? Or was suffering just the knowledge of damage?

  Elara's hand hovered over the switch.

  The monitor for Nadia spiked. She was having a panic attack. The implant was generating a higher-order representation of *terror*. Her heart rate was still normal. Her body was calm. Her mind was drowning.

  The monitor for Sam flatlined. Not his heart. His report. He had gone back to sleep. His body would twitch if the burn got worse. He would move his hand. He would not wake up.

  The rock sat on the desk. It represented itself. It was the only thing in the room that was consistent. The signal matched the source. There was no gap between the rock and the thought of the rock, because there was no rock in the equation, only the signal.

  Elara pulled her hand back.

  She couldn't turn it off. If she turned it off, she admitted that the signal was nothing. But Nadia was screaming. You don't ignore screaming.

  She couldn't turn it up. If she turned it up, she admitted that the signal was everything. But Sam was bleeding. You don't ignore blood.

  She opened a new file on her terminal. *Calibration Log: Day 42.*

  She typed: *Subject variance exceeds parameters. Meta-layer decoupling from base state.*

  She stopped typing. She looked at the rock.

  *Recommendation:*

  She deleted the word.

  She looked at Nadia's screen. The terror spike was subsiding, replaced by a steady, low-level hum of *awareness*. She was calm again. She was aware of being calm. She was safe in the knowledge of her own state, even if the state was fabricated.

  She looked at Sam's screen. The biological stress markers were dropping. The hand was healing. He was safe in the ignorance of his own state.

  Elara leaned back. The hum of the clinic vibrated in her teeth. She wondered, for a moment, if she had an implant. She wondered if the feeling of *wondering* was just a scan of a neural pattern, or if there was something underneath it, something raw and unrepresented that was doing the feeling.

  She tried to feel the chair beneath her. She felt the pressure. She felt the thought *I feel the pressure*.

  Which one was her?

  She looked at the rock. The green bar pulsed. *Self-Scan Active.*

  Elara reached out and touched the stone. It was cold. It did not pull away. It did not report the touch. But the monitor spiked. The rock was aware of being touched.

  Elara left her hand on the rock. She waited to see if she would feel it back.
