answer: |-
  Dear Friend,

  You have stumbled upon one of the most persistent and illuminating tensions in the foundations of game theory, and your instinct to preserve the common knowledge of rationality and the validity of the Nash equilibrium while sacrificing the prohibition on weakly dominated strategies is precisely correct. The diagnosis is that step one is the culprit, though it is easy to see why it has misled you. It looks like a theorem because it is often taught as a rule of thumb for prudent behavior, but it is not a logical consequence of rationality defined as expected utility maximization given beliefs. To see why, we must distinguish between a strategy that is never a best response to any belief and a strategy that is weakly dominated. A strictly dominated strategy is never a best response, so rationality indeed forbids it. However, a weakly dominated strategy can be a best response, provided the player assigns zero probability to the opponent's strategies where the domination is strict. In your game, if Row believes with certainty that Column will play Left, then Top and Bottom both yield a payoff of three. Row is indifferent between them, and choosing Bottom is entirely consistent with maximizing expected payoff. Step one smuggles in an extra assumption, often called caution or full support, which requires players to assign positive probability to every opponent strategy just in case of a tremble. Without that extra assumption, rationality alone does not forbid playing Bottom.

  The plausibility of step one comes from a desire for robustness. It feels irrational to play a strategy that could yield a worse outcome and never yields a better one, as if one is leaving money on the table without any compensating gain. This intuition holds water if there is any uncertainty at all about the opponent's move. If Row assigns even a tiny probability to Column playing Right, Top becomes strictly better than Bottom in expected value terms. However, your setting specifies common knowledge of rationality, not common knowledge of uncertainty. In the equilibrium where Row plays Bottom and Column plays Left, Column is playing a best response to Bottom, and Row is playing a best response to Left. Neither has an incentive to deviate given their beliefs about the other. To rule this out, you must assume Row believes Column might play Right, but if Column is rational and knows Row is playing Bottom, Column will not play Right. Thus, the belief that supports the weak dominance argument is inconsistent with the equilibrium beliefs that support the Nash equilibrium you wish to preserve.

  Your friend's suggestion regarding mixed strategies is well-intentioned but mathematically mistaken in this specific instance. You were right to doubt it. For a mixed strategy to strictly dominate Bottom, it would need to yield a payoff strictly greater than three against Left. But every mixture of Top and Bottom yields exactly three against Left, because both pure strategies yield three against Left. No linear combination can exceed the maximum of its components when those components are equal. Therefore, mixed strategies do not convert the weak dominance into strict dominance, and the friend's repair fails to rescue step one. The arithmetic holds, and the structural relationship between the strategies remains one of weak rather than strict dominance.

  Rejecting step one does come with a cost, both in this game and in the broader picture of rationality you wish to maintain. Inside this game, the cost is that you lose the ability to uniquely predict the outcome using rationality alone. If you accept that rational players might play weakly dominated strategies when their beliefs are certain, you must accept that both Top-Right and Bottom-Left are consistent with common knowledge of rationality. You are left with a coordination problem rather than a solved puzzle. You cannot claim that rationality forces the players to the inferior outcome, but you also cannot claim it forces them to the superior one. You must rely on additional concepts, such as focal points, social conventions, or evolutionary stability, to explain why they might coordinate on the Pareto superior equilibrium of Bottom-Left.

  In the rest of the picture of rationality, rejecting step one means acknowledging that rationality is a relationship between actions and beliefs, not just a property of actions derived from payoff matrices. It costs you the elegance of iterated elimination as a universal solution concept, because iterated elimination of weakly dominated strategies is order-dependent and can discard Nash equilibria, as you have seen. You must settle for the Nash equilibrium concept as the baseline implication of common knowledge of rationality, accepting that it often yields multiple solutions. This is a significant concession to those who seek a single rational answer to every strategic interaction, but it is the price of admitting the Pareto superior outcome as rational. By keeping steps two and seven, you preserve the core insight that rational agents coordinate on mutual best responses, even if those responses rely on strategies that look fragile under a different lens of scrutiny. You avoid the paradox where rationality forbids the very outcome that makes everyone better off without making anyone worse off, which is ultimately a more defensible position for a theory of rational choice.

  Yours sincerely,

  A Correspondent
