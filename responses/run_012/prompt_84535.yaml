answer: |-
  It is quite understandable why this strikes you as peculiar. When you lay it out plainly — that a firm marks its own homework, checks the pen it wrote with, and then tells a competitor they aren't allowed to use their own pen — it does sound like a riddle designed to have no answer.

  You have spotted a tension that exists in almost every highly regulated industry, from aviation to finance. Let us walk through this gently, without getting bogged down in heavy theory, to see what is actually happening beneath the surface.

  ### What does the practice assume?

  You ask whether this system requires a strong claim (that a system can perfectly judge its own reliability) or a weaker one. The comforting answer is that it relies on the **weaker claim**.

  If a firm claimed, "Our software is infallible because we say so," they would be laughed out of the room. No engineer truly believes that. Instead, the assumption is not about *infallibility*, but about *accountability*.

  When a firm self-certifies, they are not saying, "This is perfect." They are saying, "We have followed a recognised process, and if this turns out to be wrong, **we** will be held responsible." The regulator is not checking the maths; they are checking the *signature*. They are verifying that the person signing the form has the proper accreditation and that the firm has enough money and reputation at stake that they wouldn't dare sign a lie.

  So, the assumption is not "the machine cannot err," but rather "the people running the machine are deterred from cheating by the threat of ruin." It is a legal and financial safeguard, not a mathematical proof.

  ### The loop of the software checking itself

  The second part, where the software checks itself (often called 'bootstrapping' in computing), feels more like a closed loop. You mentioned an older copy of the program checking the new one.

  Imagine a baker who uses a loaf of bread to test if the oven is working. It sounds circular. But if the baker used a loaf from last week to test the oven today, and the week before to test the oven last week, and the bread always comes out the same, you start to trust the oven.

  In software, if Version 1 can build Version 2, and Version 2 builds Version 3, and they all produce the same results, it suggests stability. It does not prove the software is free of bugs, but it proves it is *consistent*. The industry accepts this because the alternative — having a human manually check every line of code in a compiler — is effectively impossible. They accept a weaker guarantee (consistency) because the strong guarantee (absolute truth) is too expensive to buy.

  ### The double standard: Us vs. Them

  Now we come to the bit that bothers you most: "We can test ourselves, but you must go to an independent lab."

  Logically, you are right to be suspicious. If self-testing is good enough for Firm A, why is it not good enough for Firm B?

  Here, the two halves are **not consistent** in terms of pure logic, but they are consistent in terms of **risk management**.

  When Firm A tests its own work, it relies on *internal visibility*. They know their own engineers, they know their own culture, and they know where the bodies are buried. They trust their own process because they control it.

  When they look at a rival, they suffer from *information asymmetry*. They do not know if the rival's engineers are tired, if their management is cutting corners, or if their testing software is flawed. Because they cannot see inside the rival's "black box," they demand an independent lab to act as a translator they can both trust.

  So, what view does this rule out? It rules out the idea that "all processes are equal." It asserts that *my* process is transparent to me, but *yours* is opaque. It is a stance of privilege: "I know I am honest; I cannot be sure you are."

  ### What if we gave up on it altogether?

  Suppose we took your suggestion seriously. Suppose we said, "No self-certification. Trust must come from outside, no exceptions." What would change?

  1.  **The Bottleneck:** Every single update, patch, or new product would need to queue up at a regulator or an independent lab. Currently, a software firm might release updates daily. Under a strict external regime, they might release them yearly. Innovation would slow to a crawl.
  2.  **The Cost:** Independent testing is expensive. You would need an army of external auditors. This cost would be passed on to customers. Small firms, who cannot afford the queue or the fees, would be wiped out. The market would become a club for giants only.
  3.  **The Liability Shift:** Currently, if a self-certified product fails, the firm is clearly at fault. If an external lab certifies it and it fails, the firm can blame the lab, and the lab can blame the firm. Accountability becomes muddy.

  ### So, where does that leave us?

  You asked if they are running two different theories. In a way, yes.

  *   **Theory A (For themselves):** Reliability comes from internal culture, process, and the fear of liability.
  *   **Theory B (For rivals):** Reliability comes from external verification because internal culture cannot be observed.

  It is a bit of a fudge, I am afraid. It is not a perfect philosophical system; it is a pragmatic compromise. The industry has decided that the risk of a firm lying about its own work is lower than the risk of the entire system grinding to a halt under the weight of external checks.

  Does that make it right? Not necessarily. But it explains why the practice persists. It assumes that people are generally honest because they have to be to stay in business, whilst admitting that strangers might not be. It is not a triumph of logic, but rather a treaty of convenience.

  I hope that helps clear the fog a little. It is a messy world, and sometimes the rules are built on what works, rather than what makes perfect sense.
