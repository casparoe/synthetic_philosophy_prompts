          *   *The "Crow/Stick" (Dev) vs. "Decoupling" (Rosa):* Rosa defines Popperian correctly. Dev challenges the observability.
          *   *The "Computer/Notation" (Rosa):* Rosa is right that tools structure thought.
          *   *The "Systematic Error" (Rosa's Final Point):* This needs deep dive. Is it a real difference? Yes, because of *mediation*. Dev's rat example is about broken wiring; Rosa's point is about broken *maps*.
