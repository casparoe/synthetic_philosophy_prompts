answer: |-
  **MEMORANDUM: Evidence Validation Protocol for Antibiotic Policy**
  **To:** Antibiotic Policy Group
  **From:** Chair, Pharmacy Dept
  **Subject:** Standardizing How We Evaluate Claims

  We receive conflicting advice constantly. To ensure our recommendations are robust enough for the Medical Superintendent, we are adopting a four-step validation filter. This is based on classical epistemology (how we know what we know) but translated for clinical governance. It distinguishes between *confidence* and *entitlement to certainty*.

  ### The 4-Step Filter

  **1. Categorize the Claim (The Source)**
  Identify what kind of knowledge the evidence claims to be:
  *   **Direct Observation (Perception):** Data we generated ourselves (e.g., local lab sensitivities).
  *   **Reasoning (Inference):** Logical extrapolation (e.g., "Drug A works on Mechanism B, so it should work here").
  *   **Analogy (Comparison):** Claims based on similarity (e.g., "Drug X is basically the same as Drug Y").
  *   **Authority (Testimony):** Claims from experts or documents (e.g., Guidelines, Consultants).

  **2. Validate the Conditions (The Check)**
  For the claim to count as knowledge, specific conditions must be met. If not, it is only an opinion.
  *   **Observation:** Was the instrument calibrated? Was the sample size sufficient?
  *   **Reasoning:** Is the link universal? Are there known exceptions (confounders)?
  *   **Analogy:** Is the similarity *relevant* to the outcome? (Chemical structure ≠ Clinical outcome).
  *   **Authority:** Is the speaker competent *and* honest? Does the document apply to *this* context (population/resources)?

  **3. The Confirmation Step (True Belief vs. Knowledge)**
  A true belief is not knowledge if it is accidental. Ask: **"What specific data would confirm this, and do we have it?"**
  *   If confirmation is possible but missing: Mark as *Provisional*.
  *   If confirmation is impossible (no internet/lab capacity): Mark as *Uncertain*. Do not base mandatory policy on Uncertain claims unless risk is negligible.
  *   *Note:* Being sure isn't enough. We need the *means* to be sure.

  **4. The Values Check (Non-Epistemic Factors)**
  Even valid knowledge might not be good policy. This step is not about truth, but weight.
  *   **Cost:** Can the district afford this?
  *   **Equity:** Who bears the risk if this fails?
  *   **Feasibility:** Can nursing staff administer this safely?
  *   *Decision Point:* If Steps 1-3 pass but Step 4 fails, the decision moves to Administration, not Clinical Policy.

  ---

  ### Applied Examples

  **1. The Consultant's Tea-Break Recommendation**
  *   **Category:** Authority (Testimony).
  *   **Validation:** Competence is high, but context is informal. No peer review occurred.
  *   **Confirmation:** No data provided. Verification would require literature search (currently unavailable).
  *   **Verdict:** **Reject as Policy Basis.** File as "Hypothesis for Review." It is confident opinion, not validated knowledge.

  **2. Local Lab Sensitivity Data**
  *   **Category:** Direct Observation (Perception).
  *   **Validation:** Instrument conditions met (accredited lab). Sample is local (high relevance).
  *   **Confirmation:** Data exists in hand.
  *   **Verdict:** **Accept as Primary Evidence.** *Caveat:* Sample size may be small (90 beds). Valid knowledge, but limited scope.

  **3. The Drug Rep's "Basically the Same" Claim**
  *   **Category:** Analogy (Comparison).
  *   **Validation:** Similarity is chemical, not necessarily clinical. Speaker has commercial bias (fails honesty condition).
  *   **Confirmation:** Would require head-to-head trial data. Rep cannot provide independent data.
  *   **Verdict:** **Reject.** The resemblance is not the relevant kind for policy making.

  **4. The National Guideline**
  *   **Category:** Authority (Testimony) + Reasoning (Inference).
  *   **Validation:** Authors are competent. However, context (tertiary care/high resource) does not match ours (district/low resource).
  *   **Confirmation:** Guideline references exist, but local applicability is unconfirmed.
  *   **Verdict:** **Accept with Modification.** Valid knowledge elsewhere, requires Step 4 (Feasibility) check before adoption here.

  ---

  ### Limitations & Honesty Clause

  This procedure cannot make decisions for us. It only filters noise. You must know where the procedure ends and judgment begins:

  1.  **The "Patchy Internet" Problem:** Step 3 often halts because we cannot verify. When confirmation is unavailable, we must decide based on **Risk Tolerance**. This is not a knowledge question; it is a gamble. The procedure flags the gamble; it does not resolve it.
  2.  **Judgment Dressed as Procedure:** Step 2 (Validation) often relies on our intuition about "relevance" or "competence." We call this a check, but it is often experienced seniority judging another's credibility. Acknowledge this bias.
  3.  **The Values Conflict:** Step 4 often contradicts Steps 1-3. We may *know* Drug A is better (Valid Knowledge) but choose Drug B because Drug A is too expensive (Values). This is not hypocrisy; it is governance. The procedure ensures we know *why* we are deviating from the evidence.

  **Summary:** Use this filter to separate *what we know* from *what we feel*. When the filter stops, own the judgment call explicitly in the meeting minutes.

  *(End of Memo)*
