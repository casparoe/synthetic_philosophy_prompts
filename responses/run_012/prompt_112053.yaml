prompt: |-
  ok so I'm in a third year history of economic thought seminar, its my favourite course but also the one I'm most scared of, and next week I have to present my term paper argument to the whole class and then take questions for like twenty minutes. I'm already dreading it. Here's my argument in a nutshell. Everyone treats Malthus as the classic case of a guy who was spectacularly wrong because the great starvation never happened. I want to say thats too quick, but not in the lazy way where you just shrug and say he was early — I actually think thats a cop-out and part of what I want to do is say why its a cop-out. My real line is that what failed was a background assumption about how food production changes over time, and once you pull that assumption out, what's left is a claim about a tendency that other forces can mask for a very long time. So the interesting question becomes whether the theory survives with a narrower scope, not whether it was refuted or vindicated. I also want to argue that the dates were never really part of the core, so the fact that the dated prediction flopped shouldn't be doing as much work as everyone lets it do.

  What worries me is the questions. The class is about twenty people. Most are econ students who think the philosophy side is a waste of time and will want to know what the actual policy upshot is. Three or four took the Popper course last term and will go straight for the throat with some version of "fine, but what observation would make you give this up". One guy has read alot of Lakatos and brings up research programmes every chance he gets. And the prof is the scariest, because he asks a friendly sounding question and then quietly takes your whole argument apart while you're still answering.

  So what I want from you is a prep sheet. Give me the questions I'll actually get from this crowd, in roughly the order they'll come, grouped by who's asking, phrased the way that person would actually phrase it, and flag how much damage each one does. For each one tell me what I should concede, what I should hold onto, and a short answer I could actually deliver in a minute, plus a note on where my answer is soft and I should be careful. And tell me the one question I'm secretly hoping nobody asks. If my argument is just wrong, say so.

  Write it as continuous prose, no headings, no bullet points, no bold, no tables — just talk me through it like you're explaining it to me over coffee. Thanks, I owe you one.
