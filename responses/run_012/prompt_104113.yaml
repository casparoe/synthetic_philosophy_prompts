      *(Refining the "Forecast the Class" idea)*: The user's hunch is "treat the choice as part of what you forecast." How do I forecast a choice? I forecast the *persistence of the categorization*. Will "Nuclear Democracy" still be a coherent category in 2050? If the category dissolves, the base rate is useless. So the metric is "Category Stability."

      *Revised Plan:*
