          *   Months 5-6: Analysis/Writing. Compare calibration.
      *   **Deliverables/Success:** A paper + a protocol. Success = The ensemble method beats the single-class method in Brier scores on historical backtests. Failure = No statistical difference.

  4.  **Refining the Argument (The "Commitment"):**
      *   I need to make sure I don't just say "I'll study this." I need to argue *why* this specific angle (Reference Class Instability) is the lever.
      *   *Argument:* The uncertainty isn't just in the event; it's in the description of the event. By quantifying the variance introduced by class selection, we can separate "ontological uncertainty" (what will happen) from "categorical uncertainty" (how we describe what happens).
      *   *Operationalization:* I will treat reference class selection as a hyperparameter. I will build a "Class Ensemble" model.

  5.  **Drafting the Content (Iterative refinement for tone and length):**
      *   *Tone:* Confident, precise, slightly provocative (challenging the standard outside view orthodoxy).
      *   *Length Check:* Keep it tight. Avoid fluff.
      *   *Specifics:* Instead of "I will read books," say "I will construct a dataset of 50 historical geopolitical transitions." Instead of "I will think," say "I will code a simulation."

  6.  **Addressing the "Determinant Answer" Constraint:**
      *   The question can't be philosophical. It must be empirical.
      *   *Question:* "Does explicitly modeling the variance in reference class selection improve the calibration of long-term geopolitical forecasts compared to standard single-class base rates?"
