  7.  **Addressing the "Standard Defenses" Constraint:**
      *   Why doesn't "just pick the best class" work? Because "best" is undefined in singular cases.
      *   Why doesn't "average them" work? Because correlated errors.
      *   My proposal: Weight them by their *stability*, not just average them.

  8.  **Final Polish:**
