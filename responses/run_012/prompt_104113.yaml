      *   *Proposed Solution:* Meta-forecasting. Instead of asking "Will Empire X last 30 years?", ask "What reference class will experts agree is relevant in 30 years, and what is the survival rate of *that* class?" Or, more precisely, treat the reference class construction as a variable in the model, not a fixed input.
      *   *Refinement:* The prompt suggests treating the *choice* as part of what you forecast. This implies a recursive or hierarchical approach. If I forecast "US survives 30 years," I need a base rate. If I choose "Great Powers," base rate is $X$. If I choose "Nuclear Democracies," base rate is $Y$. The proposal needs to operationalize "forecasting the class."
      *   *Strongest Framing:* The "Reference Class Instability" hypothesis. The variance in predictions comes not from uncertainty about the future, but from uncertainty about *categorization*. The project should quantify this instability and propose a method to aggregate across classes weighted by their own stability/predictability.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and academic. "The Reference Class Problem as a Forecasting Target."
      *   **The Question:** Needs to be determinate. Not "How do we fix it?" but "Does modeling reference class selection improve calibration?"
      *   **The Gap (Why standard defenses fail):** Tetlock's work, reference class tennis. Standard advice is "use the broadest class possible" or "use the most similar." But for unique events (great power collapse), "broadest" (all states) is useless, and "most similar" (hegemonic naval powers) is $N=3$. The subjectivity remains.
      *   **Methodology (6 Months):**
