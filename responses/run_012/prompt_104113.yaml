answer: |-
  **Project Title:** The Categorical Stability Hypothesis: Quantifying Reference Class Uncertainty in Geopolitical Forecasting

  **The Core Question**
  Does explicitly modeling the variance in reference class selection improve the calibration of long-term geopolitical forecasts compared to standard single-class base rates?

  This project seeks a determinate, empirical answer: Yes or No, measured by Brier score improvement in historical backtests. The prevailing orthodoxy in forecasting (the "Outside View") dictates that one must identify the single most appropriate reference class to establish a base rate. This project argues that for singular, high-stakes geopolitical events (e.g., "Will the US remain a great power in 2050?"), the "single most appropriate class" is a fiction. The uncertainty lies not only in the event but in the *description* of the event. By treating the choice of reference class as a variable to be forecasted—specifically, by forecasting the *stability* of the category itself—we can reduce the degrees of freedom available for motivated reasoning ("reference class tennis") and produce more robust probabilities.

  **Why Standard Defenses Fail**
  The standard defense of the Outside View relies on the assumption that a "correct" reference class exists and is discoverable through rigorous definition. In practice, this fails for long-term geopolitical horizons for two reasons:

  1.  **The N=1 Problem:** If the class is too specific (e.g., "Hegemonic naval powers with nuclear arsenals"), the sample size is too small for a statistical base rate. If the class is too broad (e.g., "Sovereign states"), the base rate is too noisy to be informative. There is no principled mathematical cutoff for "too specific" or "too broad."
  2.  **Motivated Selection:** Because the cutoff is undefined, forecasters implicitly select the class that yields their prior belief. A pessimist chooses "All Empires" (high collapse rate); an optimist chooses "Liberal Democracies" (low collapse rate). Current methodology treats this selection as a preparatory step, outside the model. This allows the bias to enter the system before the math begins.

  My proposal shifts the reference class from an *input* to a *parameter*. We do not ask "Which class is right?" We ask "How stable is this classification over the forecast horizon, and how does that stability weight the base rate?"

  **Methodology and Work Plan (6 Months)**
  I will operate as a sole researcher. The work is divided into three phases: Operationalization, Backtesting, and Synthesis.

  **Months 1-2: Operationalizing Categorical Stability**
  I will construct a dataset of 50 historical geopolitical transitions (e.g., the decline of the Ottoman Empire, the rise of the US, the collapse of the USSR). For each case, I will define a "Class Space"—a set of 5-10 plausible reference classes that a forecaster might have reasonably selected at the time (e.g., for the USSR in 1970: "Communist States," "Great Powers," "Land Empires," "Nuclear Powers").
  *   *Deliverable:* A coded dataset defining the "Class Space" for each historical case.
  *   *Key Task:* Develop a metric for "Categorical Stability." This measures how coherent the class remains over the forecast period. (e.g., Does "Communist State" remain a predictive category if the ideology dissolves?)

  **Months 3-4: The Stability-Weighted Ensemble**
  I will build a forecasting model that does not select one class, but aggregates across the Class Space. Crucially, this will not be a simple average. I will apply weights based on the Categorical Stability metric.
  *   *Hypothesis:* A base rate derived from a highly stable category (e.g., "Geographic Entity") should weigh more than one from a fragile category (e.g., "Ideological Bloc"), even if the latter feels more descriptive.
  *   *Deliverable:* A Python/R script that ingests the Class Space and outputs a Stability-Weighted Probability for each historical case.

  **Months 5-6: Backtesting and Validation**
  I will run the model against the historical dataset. I will compare three forecasting methods:
  1.  **The Standard Outside View:** Selecting the single "best" class (simulated by taking the median forecast of existing literature for that event).
  2.  **The Unweighted Ensemble:** Averaging base rates across all plausible classes.
  3.  **The Stability-Weighted Ensemble:** My proposed method.
  *   *Deliverable:* A final paper comparing the Brier scores of the three methods.
  *   *Key Task:* Statistical significance testing to determine if the improvement is noise or signal.

  **Success and Failure Conditions**
  **Success:** The Stability-Weighted Ensemble demonstrates a statistically significant improvement in calibration (lower Brier score) over the Standard Outside View method on the historical backtest. Specifically, I aim for a 10% reduction in calibration error. A secondary success metric is the production of a "Reference Class Protocol"—a actionable checklist for forecasters to quantify category stability before setting base rates.

  **Failure:** The project fails if the Stability-Weighted Ensemble performs no better than the Unweighted Ensemble, or if the "Categorical Stability" metric proves impossible to define without reintroducing the same subjectivity I aim to solve. If the metric for stability requires the same subjective judgment as picking the class itself, the model is circular. I will declare the project a failure if inter-rater reliability on the Stability Metric falls below 0.6 (Cohen's kappa) during a blind review of the dataset in Month 2.

  **Significance**
  If successful, this project moves the Outside View from a heuristic to a rigorous statistical tool. It acknowledges that in geopolitics, the map is as volatile as the territory. By forecasting the durability of our own categories, we prevent the base rate from becoming a vessel for our own biases. This is not merely academic; it is a necessary correction for intelligence agencies and risk models that currently rely on base rates selected by human intuition. I am requesting six months of full-time support to build the dataset, code the model, and validate the hypothesis.
