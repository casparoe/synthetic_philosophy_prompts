answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees, County Land Trust
  **FROM:** [Your Name], Volunteer Steward
  **DATE:** February 20, 2024
  **SUBJECT:** Ethical Assessment of the Harrow Fen Re-wetting Proposal

  **Introduction**

  I have served as a volunteer steward for this Trust for nine years. I am not an ecologist or a philosopher; I run a hardware store. My expertise lies in walking the land, observing changes over seasons, and talking to neighbors. I support the mission of this Trust. I believe protecting land is vital. However, after nine years of walking our properties and reviewing the staff assessment for the Harrow Fen project, I have a concern that our current evaluation metrics cannot capture.

  This March, the Board will vote on the re-wetting of the Harrow Fen tract. The staff assessment scores this project as an overwhelming gain for species richness and ecological integrity. By the metrics we use, this is a clear win. My concern is that these metrics measure the *system*, not the *lives* within it. They count a mayfly and a heron as equal units. They do not measure whether the lives created by this restoration will contain more suffering than contentment.

  This opinion is not a request to cancel the project. It is a request to acknowledge that "ecological health" and "individual welfare" are not always the same thing, and to adjust our approach so that we do not inadvertently create a system optimized for suffering.

  **The Core Conflict: Ecosystems vs. Individuals**

  The strongest argument against my concern is that a land trust's business is the persistence of species and the integrity of ecosystems, not the inner experience of individual animals. Colleagues have told me that ranking lives by how pleasant we judge them to be betrays our science and risks alienating donors who care about conservation, not animal rights.

  I understand this position. Our donors give to save wetlands, not to manage insect happiness. However, stewardship implies a duty of care to the land and its inhabitants. If we restore a wetland that functions perfectly according to ecological models but operates as a "suffering factory"—producing billions of short lives that end in starvation, desiccation, or predation—we need to ask if that is the "good" we intend to create.

  We cannot settle the science of animal sentience today. But we face a decision with enormous numbers at stake. If there is even a small chance that insects and amphibians feel pain, the sheer volume of life in a restored peatland means the potential for suffering is massive. Ignoring this possibility because it is difficult to measure is not scientific rigor; it is willful blindness. We should apply the precautionary principle: when an action risks causing vast amounts of harm, and we are uncertain about the magnitude of that harm, we should take reasonable steps to minimize it.

  **Addressing Specific Ethical Questions**

  To make this concrete, I have worked through four specific questions regarding the Harrow Fen proposal.

  **1. Is reducing the number of wild animals ever a legitimate aim?**
  Strictly speaking, our mission is not to manage population counts. However, we already manage populations when we remove invasive species or control deer densities to protect forest regeneration. We accept that reducing numbers is legitimate when it serves the health of the system. I am arguing that reducing the *density* of high-suffering species (like insects in ephemeral pools) is legitimate if it serves the welfare of the system's constituents without destroying the ecosystem's function. We are not talking about culling; we are talking about design choices that do not maximize biomass at the expense of welfare.

  **2. How much weight do we give the possibility of insect sentience?**
  We cannot know for sure. But the numbers are the deciding factor. A restored fen will support orders of magnitude more insects than the current cropland. If we are wrong about their capacity to suffer, we have lost nothing but some design efficiency. If we are right, and we proceed without consideration, we are responsible for a massive increase in net suffering. The asymmetry of the risk demands we act as if they matter.

  **3. What is the right baseline for comparison?**
  The staff report compares the restored wetland to a pre-1900 baseline (an "empty" natural state). This is misleading. The actual choice is between the restored wetland and the *current* drained cropland. The cropland supports fewer animals, but the lives there are generally longer and more stable. Furthermore, the re-wetting process itself will kill or displace the animals currently living on the leased land (voles, nesting birds, insects). We must admit that this project involves harm to existing individuals to create new individuals. We need to be sure the trade-off is defensible.

  **4. Can we design a "kinder" restoration?**
  Yes. The current plan calls for restoring seasonal pools that reliably dry out in late summer. These become death traps for juvenile amphibians and aquatic insects. The plan also suggests restocking fish. We have discretion here.
  *   **Seasonal Pools:** We could design the hydrology to maintain more permanent water bodies, reducing the mass die-offs associated with drying pools.
  *   **Fish Stocking:** We should omit fish restocking. Fish introduce high levels of predation suffering for larvae and amphibians. A fishless wetland can still be ecologically valid for a peatland restoration while reducing predation pressure.
  Choosing these options is not a departure from science; it is a refinement of engineering. It is a defensible exercise of our discretion to prioritize a specific type of ecological integrity that does not rely on high-mortality bottlenecks.

  **Recommendation and Motion**

  I recommend that the Board **proceed with the Harrow Fen project, but with conditions** that require the final engineering design to explicitly consider animal welfare impacts. We should not defer the vote, as the ecological need is real. We should not reject the project, as drainage is an ongoing harm. We must, however, modify the execution.

  I propose the Board adopt the following motion at the March meeting:

  > **Motion 24-03: Harrow Fen Restoration Authorization**
  >
  > "RESOLVED, that the Board authorizes the Harrow Fen re-wetting project as outlined in Staff Report 2024-A, subject to the following conditions:
  >
  > 1.  **Design Modification:** The final engineering plan shall prioritize permanent water retention over ephemeral seasonal pools where ecologically feasible, to minimize mass mortality of juvenile aquatic life due to desiccation.
  > 2.  **Stocking Prohibition:** The project shall not include the active restocking of predatory fish species.
  > 3.  **Welfare Review:** The Executive Director shall commission a review of the final design's impact on individual animal welfare, to be completed by June 30, 2024.
  > 4.  **Monitoring:** Staff shall report back to the Board at the March 2025 meeting on the first year's ecological outcomes, including an assessment of mortality events in restored pools."

  **Schedule**

  *   **March 15, 2024:** Board Vote on Motion 24-03.
  *   **April 1 – June 15, 2024:** Engineering team incorporates welfare conditions into final design.
  *   **June 30, 2024:** Deadline for Welfare Review submission to the Board.
  *   **March 2025:** Board review of first-year monitoring data.

  **Conclusion: What We Are Committing To**

  If we pass this motion, the Trust is committing itself to the view that land stewardship includes a responsibility for the quality of life of the animals we host, not just the quantity of species we preserve. We are admitting that our current metrics are incomplete.

  We are admitting that we cannot know for certain whether the mayfly suffers, but we refuse to treat that uncertainty as a license to ignore it. We are committing to building a wetland that is not only ecologically intact but ethically considered. If we do not pass this motion, we are committing to the view that ecological integrity is the only good that matters, and that the Trust accepts no responsibility for the suffering that may result from its success.

  I ask my fellow trustees to vote for the motion. We can save the fen without ignoring the lives within it.

  Respectfully submitted,

  [Your Name]
  Volunteer Steward
