answer: |-
  It stands by itself.
  The stone is cold, a heavy weight,
  Unmoved by time or chance or fate,
  Resting on the shelf.

  Crush the stone to powder dust,
  It stands by itself.
  Scattered wide by wind and rust,
  Gone from off the shelf.

  Form returns from empty space,
  Conditions build the wall,
  It stands by itself.
  A shadow on the shelf.

  No form, no space, no eye to see,
  No wall, no shadow, no degree,
  Silence where the question fell,
  It stands by itself.

  ***

  **Note on the Construction**

  I committed to the *Prāsaṅgika* reading of the tetralemma: the four corners are not four possible truths to choose from, but four positions to be dismantled. The poem is not a ladder to a higher truth; it is a machine designed to stall. In the first stanza, the refrain functions as a realist assertion (svabhāva). In the second, the context forces it to read as false (dependence on parts). In the third, the stanza holds the contradiction of dependent arising (conventionally real, ultimately empty), forcing the "Both" corner. In the fourth, the context removes the subject entirely, rendering the refrain neither true nor false but inapplicable.

  **Liberties and Contested Readings**
  1.  **Linear Progression:** Nagarjuna often negates the four corners simultaneously or in varying orders depending on the argument. I linearized them (Is → Is Not → Both → Neither) for poetic structure, which risks implying a dialectical progression (Hegel-style) that Madhyamaka explicitly rejects.
  2.  **The "Shelf":** I used the metaphor of a shelf to ground the object. A strict reading of *MMK* Chapter 5 (The Elements) would critique this, as it implies a container view of space or a locus for existence that emptiness denies. The poem leans on this metaphor to make the "frame giving out" visible, even though Nagarjuna would say the frame was never there to begin with.
  3.  **The Fourth Corner:** I avoided making "Neither" a mystical positive state. The poem ends with the proposition hanging over a void ("Silence where the question fell"). This is a decisive bet on the therapeutic interpretation: the tetralemma is a purgative, not a philosophy.
