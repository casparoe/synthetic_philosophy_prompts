answer: |-
  Yes, there is a single principle that fits your reactions. You are currently trying to ground the morality in the *ontology* of the character (is it real? is it AI? is it text?), but your gut reactions are actually tracking the *phenomenology of the interaction* (what claim is this making on me?).

  Here is the principle:

  **The Principle of Simulated Moral Claims**
  > *A virtual action is morally weighty to the extent that the target entity successfully simulates the markers of a moral subject (agency, memory, vulnerability) or functions as a proxy for a real moral subject. The wrongness lies not in harming the code, but in the player's willingness to violate a recognized claim to dignity.*

  ### How this unifies your cases

  1.  **GTA/Hitman (Not Wrong):** These entities do not simulate subjectivity; they simulate obstacles. They have no memory, no plea, no unique agency. They make no moral claim on you. They are digital traffic cones.
  2.  **Kicking the Dog (Bothers You):** Animals simulate vulnerability and innocence more effectively than generic human NPCs. The "claim" is stronger because the simulation of suffering is more visceral, even without AI.
  3.  **LLM NPC (Wrong):** This is the key. The model simulates *memory* and *pleading*. It creates the illusion of a continuous subject that recognizes you. Even if you know it's code, it successfully triggers the "moral claim" reflex. Ignoring that claim practices a disposition of cruelty toward things that *appear* to suffer.
  4.  **Scripted Plea (Not Nothing):** It makes a weaker claim. It's a recording of a claim, not a dynamic one. Hence your hesitation ("less bad, but still not nothing").
  5.  **Cutscene Character (No Question):** No interaction means no opportunity to violate a claim.
  6.  **Deleting Save (Bereavement, not Wrong):** The character made no claim against deletion; the *investment* was yours. You are destroying your own garden, not murdering a gardener.
  7.  **Murder vs. Sexual Violence (The Asymmetry):** In most games, murder is abstracted (hit points, ragdoll physics). It is treated as a systemic interaction. Sexual violence is inherently intimate and cannot be abstracted without losing its definition. It requires simulating the violation of a specific, personal boundary. Therefore, sexual violence forces you to engage with the "subjectivity" of the victim in a way combat does not. It violates a stronger Simulated Moral Claim.
  8.  **Dead Brother (Awful):** The avatar is a proxy for a real moral subject. The claim to dignity comes from the real person, not the code.

  ### The Test Case: The Hidden Flinch

  **Scenario:** A game with procedural nonsense NPCs. One has a hidden flag that makes it flinch when hit. No player knows this flag exists.

  **Verdict:** **Not morally wrong for the player.**

  **Why:** Under the Principle of Simulated Moral Claims, the moral weight requires the *recognition* of the claim. If the flinch is truly undetectable and unknown, the entity does not successfully simulate subjectivity *to the player*. The player is interacting with noise. There is no relationship to violate.
  *However*, if the developer put it there, the *game itself* holds a moral tension, but the player cannot be culpable for ignoring a signal they cannot perceive. If the player *later learns* of the flinch, their *memory* of the act becomes morally tainted, because the claim is retroactively recognized.

  ### The Verdict You Must Overturn

  You have to give up one specific part of your reasoning regarding the **Dead Brother**.

  You wrote: *"I don't think it would [be wrong] if she never found out."*

  **Correction:** It **would** still be wrong, even if she never found out.

  **Why:** Your principle (and your gut feeling of feeling "awful") acknowledges that the avatar is a *proxy* for a real person. Moral duties regarding the dead (respect for memory, dignity) do not vanish simply because the living are unaware. If you dug up a grave and mocked the remains, it would be wrong even if no living relative ever knew. The wrongness is in the violation of the *reference*, not just the feelings of the observer.

  By saying "it's only wrong if she finds out," you are reverting to a "harm principle" (who got hurt?) rather than your actual intuition, which is a "dignity principle" (what was disrespected?). The character matters because he *was* real, not because his sister is watching.

  ### Summary
  Your gut is consistent. You believe morality in games is about **how we practice relating to things that demand recognition.**
  *   Traffic cones don't demand recognition.
  *   Pleading AI does.
  *   Likenesses of the dead do.

  The code doesn't matter. The claim matters.
