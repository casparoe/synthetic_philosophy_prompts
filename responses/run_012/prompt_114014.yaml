answer: |-
  Okay, let's sit with this. You're asking me to put on two hats: the historian who looks at the grain ledgers and the mortality curves, and the philosopher who asks what it means to say someone *did* something versus something just *happened*.

  Your historical reconstructions are solid. You haven't misremembered the big strokes. Ireland exported food because the market logic (and property law) said food goes to where it can be sold, not where it is needed. Bengal's "Denial Policy" (boats and rice) is well-documented. The Great Leap's procurement quotas based on fake yield reports is the standard historical account now. You're right to be suspicious of the "Natural Disaster" frame; in modern famine studies, that frame is usually treated as a political shield rather than a descriptive truth.

  But your "Bank Run" analogy is the interesting variable here. It's fresh, it captures the *financialization* of survival, but it might smuggle in its own problems. Let's lay out the correspondences as requested, then see where the wiring shorts out.

  ### 1. The Dominant Frame: Famine as Natural Disaster

  This is the "Act of God" model. It's intuitive because it relies on physical scarcity.

  **The Correspondence Table:**
  *   **The Earthquake/Shock:** The drought, the blight, the flood, the pestilence. (The exogenous trigger).
  *   **The Fault Line:** The ecological fragility of the region (e.g., reliance on a single crop like the potato).
  *   **Building Codes:** Agricultural diversification, grain reserves, irrigation infrastructure, storage facilities.
  *   **Emergency Services:** State relief, charity, NGO intervention, food aid.
  *   **The Casualties:** The population that dies.
  *   **The Inspector/Regulator:** The State (presumed benevolent but perhaps overwhelmed).

  **Where the Mapping Breaks (The Philosophical/Historical Stress Test):**
  *   **Exogeneity vs. Endogeneity:** An earthquake is truly exogenous. Humans cannot cause or prevent tectonic shifts. In your three cases, the "shock" was exacerbated or even manufactured by human policy. In the Great Leap, the "shock" was policy. In Bengal, the "shock" (boat denial) was policy. In Ireland, the "shock" (blight) was biological, but the *vulnerability* (monoculture) was enforced by land law. The "Fault Line" wasn't nature; it was tenure.
  *   **Indiscriminate vs. Targeted:** Earthquakes don't check your bank account before collapsing your house (though rich people have better houses). Famines are surgically precise. They kill the landless laborer, the fisherman, the tenant farmer. They rarely kill the exporter, the landlord, or the state bureaucrat. A natural disaster model implies a shared fate; famine implies a sorted fate.
  *   **The "Building Code" Problem:** In disaster logic, if building codes fail, it's usually negligence or lack of resources. In famine, the "codes" are often actively *dismantled*. Laissez-faire ideology in Ireland wasn't a lack of codes; it was a philosophical commitment to *not* having them.
  *   **Causation:** If I push you off a cliff, gravity kills you. But we don't say "gravity murdered you." The natural disaster frame treats the blight/drought as the *proximate and ultimate* cause. The historian sees it as merely the *trigger*. The philosopher sees a break in the chain of agency. If the response determines the death toll, the "disaster" is not the cause of death; the *response* is.

  **Verdict on Frame 1:** It collapses under scrutiny because it treats political choices as environmental constraints. It obscures *counterfactuals* (e.g., "If exports had been banned, would they have died?").

  ### 2. The Challenger Frame: Famine as Bank Run

  This is your analogy. It shifts the focus from *physical stock* to *claims on stock*. This is very close to Amartya Sen's "Entitlement" approach, but with a liquidity crisis twist.

  **The Correspondence Table:**
  *   **The Bank:** The Food Economy (Market + State distribution system).
  *   **Solvency:** Total Food Availability (is there enough grain in the country?).
  *   **Liquidity:** Immediate access to food (can I get grain *today* at a price I can pay?).
  *   **Depositors:** The Population (specifically those with weak entitlements).
  *   **Deposits:** Wages, labor claims, traditional rights to gleaning/fishing.
  *   **The Panic:** Hoarding, speculative withholding, price spikes, loss of confidence in currency/wages.
  *   **Lender of Last Resort:** The State (with the power to print money or requisition grain).
  *   **Deposit Insurance:** Rationing, price controls, public works programs.

  **Where the Mapping Breaks:**
  *   **Abstract vs. Metabolic:** A bank run is about confidence in an abstract number. If confidence is restored, the money is still there. In a famine, if confidence is restored too late, the bodies are already dead. You cannot "recall" a death via liquidity injection after a certain point. The time horizon is brutal.
  *   **The Nature of the Asset:** In a bank run, the asset (money) is fungible and transportable. In a famine, the asset (grain) is bulky, perishable, and expensive to move. A "liquidity crisis" in Bengal wasn't just about prices; it was about the physical denial of boats to move the grain. You can't solve a transport blockade with a liquidity injection.
  *   **The Lender of Last Resort:** In a financial crisis, the Central Bank *usually* tries to stop the run. In your famine cases, the "Central Bank" (the State) often *accelerates* the run. In the Great Leap, the state was the one demanding the deposits. In Ireland, the state refused to act as lender of last resort on ideological grounds.
  *   **Solvent but Illiquid:** This is the strongest part of your analogy. Bengal 1943 fits "Solvent but Illiquid" perfectly. Food existed, but the mechanism to distribute it froze. Ireland fits "Solvent but Illiquid" too (food was leaving the island). But the Great Leap was arguably *insolvent* in specific regions (the grain was physically gone because it wasn't grown), making it a different kind of failure.

  **Verdict on Frame 2:** It captures the *mechanism* of death (entitlement collapse) much better than the disaster model. However, it risks making famine sound like a technical glitch rather than a moral failure. Bank runs are tragic; they aren't always criminal.

  ### 3. Normative Conclusions: Can these analogies carry the weight of "Crime"?

  This is the philosopher's turn. You want to know if these frames get us to "This was a crime" or "This was bad luck."

  **Can "Natural Disaster" get you to "Send aid, no one to blame"?**
  *   **Yes, too easily.** It creates a "Moral Holiday." If it's an earthquake, guilt is irrelevant. The only obligation is charity (supererogatory), not justice (obligatory). It frames the victims as unfortunate, not wronged.
  *   **The Trap:** It hides the *commission* of acts. Stopping aid is an act. Exporting grain is an act. Denying boats is an act. The disaster frame lumps these acts into the background noise of "the situation." It fails the counterfactual test: "But for this policy, would they have died?"

  **Can "Bank Run" get you to "It's a political crime"?**
  *   **It gets you closer, but not all the way.**
  *   **Why it helps:** It identifies a *fiduciary responsibility*. A bank manager has a duty to depositors. A state has a duty to citizens. If a bank manager watches a run start and walks away to have lunch, that is negligence. If they trigger the run to collect insurance, that is fraud.
  *   **The "Bank Run" limitation:** Bank runs can be genuine accidents of coordination. If the "Bank Run" analogy dominates, we might conclude the famine was a "tragic systemic failure" rather than a crime. It depersonalizes the violence. It makes it about *systems* and *expectations* rather than *decisions*.
  *   **The "Crime" Threshold:** To call it a crime, you need *mens rea* (intent) or *criminal negligence*.
      *   **Ireland:** The "Bank Managers" (London) knew the run was happening (reports of starvation) and refused to inject liquidity (stop exports) based on ideology. That looks like *Depraved Indifference*.
      *   **Bengal:** The "Bank Managers" (Churchill's war cabinet) actively froze the assets (boats) knowing the liquidity crunch would hit the poor. That looks closer to *Recklessness*.
      *   **Great Leap:** The "Bank Managers" (Mao/CCP) were fabricating the solvency reports and demanding deposits that didn't exist. That looks like *Fraud* leading to death.
  *   **Judgment:** The Bank Run analogy supports a verdict of **Culpable Negligence** or **Recklessness** better than "Natural Disaster," but it still softens the blow compared to "Siege" or "War." It makes the death toll look like a side-effect of mismanagement rather than a direct outcome of policy.

  ### 4. Is there a better analogy? Or is the frame the problem?

  Here is where I push back on your search for a single analogy.

  **The Problem with "Bank Run":**
  A bank run is a failure of *confidence*. A famine is often a failure of *priority*. In a bank run, the bank usually *wants* to survive. In the famines you listed, the survival of the vulnerable population was often explicitly traded off against other goals (market integrity in Ireland, war effort in Bengal, industrialization in China).

  **A Better Analogy: Famine as a Siege.**
  *   **Why it fits:** A siege is a military tactic where you cut off supplies to a specific group to force submission or simply to eliminate them.
  *   **Correspondence:**
      *   **The Besiegers:** The State or Colonial Power.
      *   **The Besieged:** The vulnerable class/region.
      *   **The Wall:** Export laws, procurement quotas, boat denial, internal passports.
      *   **The Starvation:** The intended or accepted mechanism of control.
  *   **Why it works better:** It restores *agency*. Sieges are planned. They are political. They target specific groups. It moves the needle from "Negligence" (Bank Run) to "Instrumental Violence" (Siege).
  *   **Where it fails:** Sieges imply an enemy. In famines, the victims are often citizens the state claims to protect. It requires the state to be viewed as hostile, which is politically charged (though historically accurate in these cases).

  **My Judgment on the "Crime" Question:**
  You asked when we are allowed to say "that was a crime."
  *   **Natural Disaster Frame:** Never allows it.
  *   **Bank Run Frame:** Allows it only if you prove the regulators *could* have stopped the run and *chose* not to. It requires proving capacity and knowledge.
  *   **Siege Frame:** Presumes it, unless proven otherwise.

  **The Honest Answer:**
  The "Bank Run" analogy is a massive upgrade over "Natural Disaster" because it shifts the locus of failure from *nature* to *system*. It correctly identifies that famine is often a collapse of *distribution* rather than *production*.

  However, it risks sanitizing the violence. A bank run is a panic. What happened in Ireland, Bengal, and China wasn't just panic; it was **priority setting**.
  *   In Ireland, the priority was Property Rights over Life.
  *   In Bengal, the priority was War Logistics over Civilian Survival.
  *   In China, the priority was Industrialization Targets over Peasant Welfare.

  **Final Stress Test Conclusion:**
  Keep the "Bank Run" analogy for explaining the *mechanism* (how entitlements collapse, how prices spike, how liquidity dries up). It is technically superior to the disaster model.

  But for the *moral* judgment, switch to **"Famine as Budget Allocation."**
  This is the cold, hard economic historian view. A famine happens when the cost of saving the population exceeds the political value the state places on that population.
  *   It's not a disaster (unavoidable).
  *   It's not just a run (panic).
  *   It is a **calculus**.

  When the state calculates that enforcing grain quotas is more valuable than the lives lost enforcing them, that is not bad luck. That is a policy choice. Whether it meets the legal definition of "crime" depends on your jurisdiction, but philosophically, it clears the bar for **moral culpability**.

  **One Correction on your facts:**
  You mentioned Bengal: "the food wasn't really gone." Be careful there. There *was* a cyclone in late 1942 that damaged crops, and there was a genuine (though manageable) shortfall. The "Entitlement" argument doesn't require *zero* shortfall, just that the shortfall was insufficient to cause mass starvation *without* the policy errors. Don't let a detractor trap you into saying "there was plenty of food." The argument is "there was enough food *if* distributed normally."

  **Summary:**
  1.  **Natural Disaster:** Hides agency. Fails the stress test.
  2.  **Bank Run:** Explains mechanism (liquidity/entitlement). Good for assigning negligence. Risks obscuring intent.
  3.  **Better Frame:** **Famine as Political Choice / Budget Allocation.**
  4.  **Crime vs. Luck:** It is "Luck" only if the state lacks capacity. It is "Crime" (or at least Culpable Negligence) if the state has capacity but assigns higher priority to other goals (exports, war, ideology). In your three cases, the capacity existed. Therefore, the "Luck" defense fails.

  Does that distinction between *mechanism* (Bank Run) and *moral geometry* (Budget Allocation) resonate with where you're trying to take this?
