      *   *The Break (Philosophical/Historical):*
          *   Earthquakes are exogenous (outside human control). Famines often have endogenous components (policy choices).
          *   Earthquakes hit indiscriminately (mostly). Famines hit specific classes/castes (entitlements).
          *   "Building codes" implies safety standards. In famines, the "codes" are often *removed* (enclosure, export bans lifted, boat denial).
