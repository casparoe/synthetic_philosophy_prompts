      *Wait, one more thing:* The user asks about "Crime." In philosophy of law, *mens rea* matters. A bank run caused by negligence isn't necessarily a "crime" in the criminal sense, but a civil wrong or political failure. I need to be precise about "Crime" vs "Culpable Negligence."

