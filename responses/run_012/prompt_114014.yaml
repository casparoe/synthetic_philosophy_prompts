      *   *Great Leap Forward:* Procurement quotas based on inflated reports. Feedback loops (local officials afraid to report failure). *Verdict:* Accurate.
      *   *Core Thesis:* Famine isn't just lack of food; it's distribution/entitlement/politics. The "Natural Disaster" frame obscures agency. The "Bank Run" frame highlights systemic panic/liquidity.
      *   *Potential Correction:* The user says "nobody plans a bank run." True, but bank runs often happen *because* of underlying insolvency or poor regulation. Need to ensure the analogy doesn't absolve the "bank managers" (state/elites).

  3.  **Drafting Section 1: Famine as Natural Disaster (The Dominant Frame)**
