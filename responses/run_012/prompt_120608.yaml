answer: |-
  You have stumbled onto the single biggest hole in the foundation of probability theory. You are describing the **Problem of the Priors**, specifically the failure modes of the **Principle of Indifference (PoI)**.

  You want a straight answer. Here it is:

  **The Principle of Indifference is valid only when the symmetry exists in the *physical generation mechanism*, not in the *linguistic description of the outcomes*.**

  Your gut hypothesis ("you can split evenly when the thing that produced the outcome treats the options the same") is the correct one. It is essentially the **Keynes-Jaynes Invariance Principle**. The reason you are going in circles is that people sloppily apply PoI to descriptions (binary outcomes) rather than mechanisms (physical symmetries).

  Here is the breakdown of the two best principles available, the cost of each, and exactly which of your gut calls you must keep or kill.

  ---

  ### Principle 1: Symmetry of the Generator (Physical Indifference)
  **The Rule:** You assign equal probability only if you have positive reason to believe the physical process is invariant under the swap of outcomes.
  **The Logic:** A coin has two faces and rotational symmetry. A die has cubic symmetry. A shuffle permutes cards symmetrically.
  **The Cost:** You cannot use this when the mechanism is unknown or abstract. You are forced to say "I don't know" more often.

  *   **Coin/Die/Shuffle:** **Keep.** Even if untested/unseen, they belong to a *reference class* of objects known to have physical symmetry. You aren't guessing; you are applying a model based on the object's class.
  *   **Deploy (Break/No Break):** **Kill.** "Breaks" and "Doesn't Break" are not physical symmetries. They are binary labels on a complex system. There is no generator treating them equally. Your gut is right: 50/50 is nonsense.
  *   **Mate's Envelopes (Unknown Method):** **Kill.** If you don't know the method, you don't know if it has symmetry. If he picked the envelope based on which one felt heavier, it's not 50/50. Your gut ("I've got no idea") is technically more accurate than "50/50."
  *   **Whole Number (Even/Odd):** **Kill.** There is no physical generator that can pick a whole number uniformly from an infinite set. The probability mass cannot sum to 1. This is mathematically impossible.
  *   **Point in Square (Unknown Method):** **Kill.** If the method is truly unknown, you cannot say 50/50. If he picks a point by choosing a distance from the center uniformly, the left half is *not* 50%. If he picks x and y coordinates uniformly, it *is*. Without knowing the generator, the probability is undefined.

  ### Principle 2: Maximum Entropy (Informational Indifference)
  **The Rule:** Given the specific constraints you *do* know (e.g., "it's a number between 1 and 100"), choose the probability distribution that maximizes uncertainty (entropy).
  **The Logic:** This formalizes "don't assume what you don't know." It is the modern mathematical fix for PoI.
  **The Cost:** You must choose the *variables* (the measure) over which to maximize entropy. This is subjective. It solves the Log File problem, but only if you agree on the constraint.

  *   **Log File (Size):** This is the classic **Scale Invariance** problem.
      *   If you assume the *process* is invariant to units (KB vs MB), you must maximize entropy over $\log(\text{size})$. This gives you the 32 MB answer (Benford's Law style).
      *   If you assume the *process* fills a fixed capacity linearly, you maximize over linear size.
      *   **Verdict:** Your gut ("I don't have one") is actually the most honest MaxEnt answer *unless* you add a constraint. If you add the constraint "I don't know the units," MaxEnt forces the log-uniform prior. If you add no constraint, the problem is ill-posed.
  *   **Untested Die:** MaxEnt justifies 1/6 because the constraint is "sum of probs = 1" and "6 faces." It assumes nothing else.
  *   **Deploy:** MaxEnt would technically say 50/50 *if* the only constraint is "binary outcome." This is why MaxEnt can be dangerous; it validates the "Deploy" nonsense if you frame the constraints too loosely.

  ---

  ### Reconciling Your Gut Calls

  Here is the scorecard for your specific intuitions based on the **Symmetry of the Generator** principle (which is the robust one):

  1.  **Coin (Observed):** **Keep.** Physical symmetry verified.
  2.  **Envelopes (Unknown Method):** **Give Up.** You must admit you do not know the probability. 50/50 is a lie unless you assume the method was "flip a coin."
  3.  **Untested Die:** **Keep (with caveat).** You are relying on the *Reference Class* of "dice." You assume it belongs to the class of fair cubes. This is inductive, not deductive, but pragmatically valid.
  4.  **Unseen Shuffle:** **Keep (with caveat).** Same as die. Reference class of "random shuffles."
  5.  **Deploy:** **Keep.** Correctly identified as non-symmetric.
  6.  **Whole Number:** **Give Up.** You cannot say 50/50. The distribution must decay as numbers get larger.
  7.  **Log File:** **Keep.** "I don't have one" is the correct answer unless you know the *physics* of how the log was generated.
  8.  **Point in Square:** **Give Up.** If the method is unknown, 50/50 is unjustified. If the problem states "pick a point uniformly at random in the square," then 50/50 is valid by definition of the words "uniformly at random."

  ### The Straight Answer to "When is the rule allowed?"

  You are allowed to split the odds evenly **only when you can describe the generation process in a way that makes the outcomes interchangeable without changing the description of the process.**

  *   **Coin:** "Flip the coin." Swap Heads/Tails in your head. The description "Flip the coin" doesn't change. **Allowed.**
  *   **Deploy:** "Deploy the code." Swap "Breaks"/"Doesn't Break." The description changes meaningfully (one is a failure state, one is success). The system is not symmetric with respect to those labels. **Forbidden.**
  *   **Log File:** "Generate a log." Swap "Linear Scale"/"Log Scale." The physics of file growth usually isn't linear (files grow by bytes, but often scale by orders of magnitude). Without knowing the physics, you can't claim interchangeability. **Forbidden.**
  *   **Point in Square:** "Pick a point." Swap "Left Half"/"Right Half." If the method is "throw a dart," the description holds. If the method is "pick distance, then angle," the description breaks. **Allowed ONLY if "uniform over area" is specified.**

  ### Summary
  Your gut is better than the textbooks here. The textbooks often teach PoI as a logical rule for *ignorance*. It is not. It is a physical rule for *symmetry*.

  *   **Keep:** Coin, Die, Shuffle (based on reference class symmetry).
  *   **Keep:** Deploy, Log File, Whole Number (as "Unknown/Undefined").
  *   **Give Up:** The idea that "Ignorance = 50/50." Ignorance = **Undefined Distribution.**

  If you don't know the mechanism, you don't have a probability. You have a meta-probability (a probability about which probability distribution is correct). Admitting "I don't know" is not a failure of Bayesian reasoning; it is the only honest application of it.
