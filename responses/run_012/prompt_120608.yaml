  Ok, I've been going in circles on this and I want a straight answer. I've seen the circle-and-chord thing where a "random chord" comes out three different ways and it's supposed to kill the rule that if you've got no reason to prefer one option, you split the odds evenly. Fine, but I still don't know when the rule is allowed, so here's where my gut actually lands.

  Two sealed envelopes, one has $100 in it, I watched my mate flip a fair coin to decide which. 50/50, no question. Same envelopes, but he picked by some method he won't describe: everyone tells me it's still 50/50 and it definately isn't, I'd rather say I've got no idea. A die on my desk I've never once rolled: 1/6 each, happy to say it. A mate shuffles a deck out of sight and I'll say the top card is the ace of spades 1/52 times, even though I didn't watch the shuffle and it could of been lazy. But "my deploy either breaks prod or it doesn't, so 50/50" is just nonsense. And when he says he picked a whole number, I want to say it's 50/50 even, while also knowing there's no way to pick a whole number at random.

  The ones that really get me: a log file somewhere between 1 KB and 1 GB. Split evenly over size and there's a 50% chance it's under 500 MB; split evenly over log(size) and it's 50% under about 32 MB; split over line count and it's something else again. None of those feels like my answer. My answer is that I don't have one.

  My own guess at the rule is that you can split evenly when the thing that produced the outcome treats the options the same -- a coin, a die, a shuffle -- and not when the only symmetry is in how I'm describing the outcomes to myself. But the untested die and the unseen shuffle both bother me, since I don't actually know either one is fair, and my mate's whole number is exactly the case where the rule wants to fire and can't.

  So is there a principle that gets all of these, or close? If there isn't one, give me the best two and what each one costs me. What does it say about a mate who picks a point in a square by some method I don't know -- 50/50 it's in the left half? And which of my gut calls does it make me give up?
