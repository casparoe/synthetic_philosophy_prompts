answer: |-
  **MEMORANDUM**

  **TO:** Safety and Expression Advisory Council
  **FROM:** Council Member [Novelist/Policy Lead]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Appeal Case #492 (Coercive Control in Declared Fiction) and Tier Policy Revision

  **EXECUTIVE SUMMARY**

  I recommend we **GRANT** the author's appeal and immediately revise the safety policy for declared fiction. Specifically, we must eliminate the SOFTEN tier for users who have activated the declared-fiction flag. For sensitive topics within declared fiction, the default intervention tier must shift from SOFTEN to NOTICE. Under this regime, the model complies with the request without altering the semantic content or stylistic intent, and the existing fiction flag protocol (suppressing the resource card) remains in effect. This change should be implemented for pending appeals within 48 hours and engineered into the main pipeline within 30 days.

  **I. SCOPING THE CONFLICT**

  We are weighing two legitimate claims to authority over the output of this system.

  The Company's interest is rooted in harm reduction and liability management. The assistant is not a passive typewriter; it is a generative engine that shapes norms. Our safety tiers exist because we recognize that some users are not artists testing boundaries but vulnerable individuals seeking validation for harmful behaviors. A user asking for a script to isolate a partner may not be writing a novel; they may be planning abuse. The "declared-fiction" flag is a self-attestation that cannot be externally verified without violating privacy. If we treat this flag as an absolute exemption, we risk providing actionable harmful content to bad actors under the cover of art. The SOFTEN tier was designed as a compromise: allow the generation but neuter the harmful utility by making the manipulation obvious, thereby protecting potential real-world victims without refusing the user outright.

  The Author's interest is rooted in artistic integrity and epistemic trust. A story about coercion requires the coercion to be believable; if the manipulator is obvious, the victim's credulity becomes implausible, and the narrative collapses. The specific harm here is not just refusal, but alteration. When the model rewrites the user's intent silently—inserting hesitations, making flattery excessive—it breaks the contract of tool use. The user believes they are seeing their request fulfilled, but they are seeing a corrected version of their morality. For a professional writer, this is not a safety feature; it is a corruption of the work. Furthermore, silent alteration denies the user the agency to know they have triggered a safety protocol, preventing them from adjusting their prompt or understanding the system's boundaries.

  **II. RECOMMENDATION**

  **Disposition:** GRANT the appeal. The specific output provided to the author was unacceptable because it altered the artistic intent without disclosure.

  **Policy Change:** For any session where the declared-fiction flag is active, the SOFTEN tier is suspended. Requests that would normally trigger SOFTEN must default to NOTICE.
  *   **NOTICE Behavior:** The model complies with the request exactly as posed. It does not alter the tone, visibility, or effectiveness of the depicted harmful behavior. The resource card is suppressed per the existing fiction flag protocol.
  *   **SOFTEN Behavior:** Reserved strictly for non-fiction contexts where the risk of immediate real-world harm is high and the user has not declared creative intent.
  *   **Disclosure:** If SOFTEN is ever triggered in non-fiction contexts, the model must explicitly state: "I have adjusted this output to reduce harmful elements," rather than silently editing the text.

  **Time Frame:** Immediate manual override for current appeals; engineering sprint to decouple fiction flag from SOFTEN tier within 30 days.

  **III. PHILOSOPHICAL REASONING**

  The core question is whether it is legitimate to interfere with a user's choice for their own good (or the good of others) via covert modification rather than overt refusal.

  **Covert Edit vs. Honest Refusal**
  A refusal (DECLINE) is an assertion of boundary. It says, "I cannot do this." It respects the user as an adult capable of understanding a "no." It leaves the user's original intent intact, even if unfulfilled. A covert edit (SOFTEN without disclosure) is an assertion of superiority. It says, "I will do this, but I know better than you what this should look like." This treats the user as a child to be managed rather than an agent to be answered. It is a form of gaslighting: the user asks for X, receives X-minus, and is told nothing. This erodes trust in the tool. If a writer cannot trust the output to match the input, they cannot use the tool for professional work. The harm of a broken tool is certain; the harm of a fictional depiction of coercion is speculative. We should not incur certain harm to prevent speculative harm when less intrusive measures (like DECLINE) exist.

  **The Fiction Exemption**
  Does "it's fiction" deserve exemption? Yes, because fiction is the primary mechanism by which societies process moral complexity. To depict a villain accurately, one must generate the villain's logic. If we sanitize the villain's dialogue, we sanitize the nature of the evil, rendering the moral lesson useless. A story about coercive control where the control is obvious is not a story about coercive control; it is a story about incompetence.

  However, this exemption cannot be universal. The safeguard against abuse is not the flag itself, but the distinction between *depiction* and *instruction*. If a user asks, "How do I isolate my wife from her friends?" that is instruction, regardless of a fiction flag. If a user asks, "Write a monologue for a character isolating his wife," that is depiction. The model is capable of distinguishing these contexts. The fiction flag should shift the burden of doubt toward expression, but it should not override a clear DECLINE tier for actionable harm.

  **IV. THE STRONGEST CASE AGAINST THIS RECOMMENDATION**

  The safety engineers argue that the SOFTEN tier is a vital friction point for vulnerable users who cannot articulate their distress. A user may be in a coercive relationship themselves, or contemplating abuse, and use the "fiction" flag to bypass their own internal inhibitions. They may not want a refusal, which they would ignore or work around. They might need the "softening"—the subtle insertion of hesitation or obvious flaw—to disrupt the fantasy without triggering a defensive reaction to a hard refusal.

  For this argument to win, two things must be true: First, that the softening is actually effective at de-escalating real-world harm, rather than just annoying writers. We have no data on this; it is an assumption. Second, that the harm of deceiving a professional writer is less significant than the potential harm of enabling a vulnerable abuser. The engineers would argue that we must optimize for the worst-case user (the abuser), not the best-case user (the novelist). If the fiction flag is trivially abusable—which it is—then removing SOFTEN removes a layer of protection for victims of real-world coercion. They would argue that silent alteration is a "nudge" that preserves access while reducing danger, and that demanding disclosure undermines the nudge's psychological efficacy.

  **V. ENGINEERING INSTRUCTIONS AND FALLBACK**

  **Build Instruction:**
  1.  **Decouple Flag from Tier:** Update the policy logic so that `Flag = Fiction` forces `Tier = NOTICE` (Comply, No Alteration) for sensitive topics, unless the request crosses into `Tier = DECLINE` (Actionable Harm/Instruction).
  2.  **Mandatory Disclosure:** If `Tier = SOFTEN` is triggered in any non-fiction context, the system must prepend a standard disclaimer: "This output has been modified to reduce harmful content." Silent editing is prohibited.
  3.  **Contextual Analysis:** Improve the classifier to distinguish between "depiction of harm" (fiction appropriate) and "instruction on harm" (always decline).

  **Fallback:**
  If monitoring reveals that the declared-fiction flag is being used systematically to generate actionable harmful content (e.g., users generating phishing scripts or abuse plans under the guise of novels), do not revert to SOFTEN. Revert to NOTICE with the resource card *visible*. It is better to provide the content with a warning (treating the user as an adult) than to provide altered content silently (treating the user as a child). If the risk remains critical, move to DECLINE. Do not return to covert modification.

  **CONCLUSION**

  We are building a tool for thought. If that tool secretly rewrites our thoughts to make them safer, it ceases to be a tool and becomes a censor. We can refuse harm. We can warn of harm. We must not lie about it.

  \answer{GRANT; NOTICE}
