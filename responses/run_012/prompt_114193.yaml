answer: |-
  ### Desiderata for an Adequate Theory of Promissory Obligation

  An adequate theory must not merely predict when obligations arise; it must explain the *normative architecture* that makes promising distinct from other moral phenomena. The following requirements are derived from the hard cases you specified. Most are marked **Non-Negotiable (NN)** because they reflect pre-theoretical intuitions that any theory ignoring them ceases to be a theory of *promising* rather than a revision of the concept. Others are **Camp-Specific (CS)** where reasonable philosophical disagreement exists on the underlying metaphysics.

  #### 1. The Uptake Constraint (Communication & Understanding)
  *   **Requirement:** The theory must explain why obligation fails when words are parroted without understanding or when intent is never communicated.
  *   **Cases:** *The Parroted Promise; The Uncommunicated Promise.*
  *   **Status:** **NN.**
  *   **Rationale:** Promising is an illocutionary act, not just a mental state or a physical sound. A theory grounding obligation solely in internal will (ignoring communication) or solely in external convention (ignoring understanding) fails here. The promisor must intentionally invoke a convention, and the promisee must (at least potentially) recognize it.

  #### 2. The Normative Control Constraint (Power of Release)
  *   **Requirement:** The theory must explain why the promisee holds the specific power to extinguish the obligation without the promisor's consent.
  *   **Case:** *The Released Promise.*
  *   **Status:** **NN.**
  *   **Rationale:** This distinguishes promissory duties from general moral duties (e.g., I cannot release you from the duty not to murder me). The obligation is *owed to* the promisee, granting them authority over it.
  *   **Incompatibility Warning:** This creates severe tension with **The Autonomy Constraint** (see below). If the source of obligation is the promisor's autonomous will, it is unclear how a second party can unilaterally dissolve it. If the source is the promisee's right, the promisor's initial control is diminished.

  #### 3. The Survival Constraint (Independence from Interaction)
  *   **Requirement:** The theory must explain how obligation persists when the relational conditions for reliance or interaction have ceased.
  *   **Case:** *The Promise to the Dead.*
  *   **Status:** **NN.**
  *   **Rationale:** The deceased cannot rely, expect, or interact. If obligation depends on these empirical states, it vanishes at death. Since we intuitively hold that such promises remain binding (e.g., burying me as I asked), the ground of obligation must be normative, not empirical.

  #### 4. The Moral Limit Constraint (Illocutionary Defect)
  *   **Requirement:** The theory must explain why one cannot incur an obligation to perform an inherently wrongful act, even if all formal conditions are met.
  *   **Case:** *The Promise to Do Wrong.*
  *   **Status:** **NN.**
  *   **Rationale:** "Ought implies can." One cannot be obligated to do the morally impossible. A theory that treats the will as sovereign (creating obligation *ex nihilo*) fails here, as it would suggest a valid obligation is created but overridden, rather than failing to arise at all.

  #### 5. The Interpersonal Distinction (Claim-Right vs. Resolution)
  *   **Requirement:** The theory must distinguish the normative force of a promise from that of a personal resolution.
  *   **Case:** *The Resolution to Self.*
  *   **Status:** **NN.**
  *   **Rationale:** Breaking a resolution invites self-criticism; breaking a promise invites *complaint* from another. A theory that grounds obligation solely in the integrity of the agent's will (e.g., "I bound myself") struggles to explain why a promise to another is categorically different from a vow to oneself.

  #### 6. The Felicity Constraint (Contextual Convention)
  *   **Requirement:** The theory must explain why identical words create no obligation in specific conventional contexts.
  *   **Case:** *The Promise in a Game/Role-Play.*
  *   **Status:** **NN.**
  *   **Rationale:** Social conventions determine when words count as promises. A theory relying solely on the gravity of the words or the intensity of the will fails to account for the "bracketing" of obligation in play.

  #### 7. The Continuity Constraint (Personal Identity)
  *   **Requirement:** The theory must account for why the *future* self is bound by the *past* self's act.
  *   **Case:** *General Constraint (Implicit in all cases).*
  *   **Status:** **CS.**
  *   **Rationale:** This inherits constraints from personal identity. If the "self" is merely a series of psychological stages, why is the later stage bound by the earlier? A theory must either presuppose a robust view of identity or explain obligation without it (e.g., via social continuity).

  ---

  ### Incompatibilities and Tensions

  **The Pair:** **The Normative Control Constraint (Release)** and **The Autonomy Constraint (Will).**
  *   **The Conflict:** If the promisor binds themselves through an exercise of autonomous will (The Will Theory), it is metaphysically obscure how the promisee can unbind them. My will cannot be held hostage to your say-so. Conversely, if the promisee's reliance or right grounds the duty (Reliance/Relationship), it is unclear why the promisor had the power to create the duty in the first place without their specific consent.
  *   **What This Shows:** This tension suggests that promissory obligation is not a unilateral creation (Will) nor a unilateral imposition (Reliance), but a **transfer of normative control**. The promisor must have the power to grant the promisee a right, which the promisee then holds. Any theory that cannot model this *transfer* will fail to satisfy both constraints simultaneously.

  **The Pair:** **The Survival Constraint (Dead)** and **The Reliance Ground.**
  *   **The Conflict:** Reliance theories ground obligation in the harm caused by disappointment. The dead cannot be harmed by disappointment in the relevant sense (they have no interests in future states).
  *   **What This Shows:** This shows that **Reliance** cannot be the *source* of the obligation, though it may be a reason to keep promises generally. A theory relying exclusively on reliance is logically incompatible with the data of promises to the dead.

  ---

  ### Evaluation of Standard Grounds

  None of the four standard grounds survive the list unscathed, but they fail to different degrees:

  1.  **Reliance:** **Eliminated.** It fails the **Survival Constraint (Dead)** logically (no reliance possible) and struggles with the **Normative Control Constraint (Release)** (why does your word release me from the duty to compensate harm you've already suffered?).
  2.  **Social Convention:** **Eliminated.** It fails the **Uptake Constraint (Parroted)** (a parrot follows convention but isn't bound) and the **Moral Limit Constraint** (conventions can be evil; promising to murder is not valid even if the convention supports it).
  3.  **Value of Relationship:** **Eliminated.** It fails the **Survival Constraint (Dead)** (relationship is severed) and the **Interpersonal Distinction** (one can promise a stranger, where no prior relationship exists to value).
  4.  **Exercise of Will:** **The Sole Survivor (with modification).**
      *   Pure Will Theory fails the **Uptake Constraint (Uncommunicated)** and the **Normative Control Constraint (Release)**.
      *   *However*, a modified Will Theory—specifically a **Normative Power** view (e.g., Shiffrin, Scanlon)—survives. It posits that the will is used not to bind the self directly, but to *invite trust* or *transfer a right*. This accommodates Communication (invitation requires uptake), Release (transferred rights can be waived), and the Dead (the right was transferred while alive). It requires external moral constraints to handle the **Moral Limit**, but this is easier to integrate than rebuilding Reliance to account for the dead.

  ### The Decisive Requirement

  The requirement that eliminates the most rivals is **The Normative Control Constraint (Release).**

  *   **Why:** It simultaneously devastates the **Will Theory** (which cannot explain why *your* will releases *my* bond) and the **Reliance Theory** (which cannot explain why *your* word negates *my* duty to repair harm). It forces any surviving theory to adopt a **bilateral structure** (a transfer of right/authority) rather than a unilateral one. While the **Promise to the Dead** kills Reliance, the **Power of Release** kills the structural logic of almost all competing deontological and consequentialist accounts, making it the highest barrier to entry for an adequate theory.
