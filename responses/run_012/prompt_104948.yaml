      *   *Third:* The Grain Problem (technical but solvable via maximization).
      *   *Fourth:* Empirical Predictions (actually a strength for IIT compared to GWT in some clinical cases).

  7.  **Addressing the "Denial of Experience" (Zombies):**
      *   The user says they would be persuaded by a case where IIT denies experience to something behaving exactly like us.
      *   *Counter:* IIT actually risks the opposite: attributing experience to things that *don't* behave like us (photodiodes, grids). The "behaving like us but not conscious" scenario is the *functionalist* fear (Zombies). IIT accepts "Functional Zombies" (high function, low $\Phi$).
