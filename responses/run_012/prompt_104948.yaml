          *   *Defender Stance:* They claim it's substantive because it makes predictions about *which* systems are conscious (e.g., cerebellum vs. cortex).
          *   *Critique:* If $\Phi$ is defined to track experience, it's tautological. If experience is defined to track $\Phi$, it's stipulative. The bridge is the "Axioms to Postulates" derivation.

      *   **Predictions vs. Rivals:**
          *   *Issue:* What does IIT predict that Global Workspace (GWT) or HOT doesn't?
