      *   *IIT's Response (The "Intrinsic" Defense):* IIT explicitly rejects behaviourism/functionalism. It claims consciousness is *intrinsic* existence, not extrinsic function. The feedforward unfolding is a simulation *from the outside*. The recurrent system has causal powers *upon itself* that the feedforward one lacks (because the feedforward one's state at $t+1$ is causally dependent on $t$, but not in a way that allows integration *within* the mechanism at a single time in the same manner).
      *   *Assessment:* Is it a prediction, reductio, or verbal redescription?
          *   It is a *prediction* of the theory (IIT embraces this).
          *   Is it a reductio? Only if one assumes functionalism is true. If one accepts IIT's axioms, it's not a contradiction.
          *   Is it verbal? No, it's ontological.
      *   *Survival Strategy:* The theory must insist that *intrinsic* causal power matters, not extrinsic utility.
      *   *Cost:* The cost is accepting "conscious zombies" (systems that act conscious but aren't) and "philosophical lights" (systems that are conscious but act simple). It isolates consciousness from evolutionary utility.

