answer: |-
  President, trustees, faculty, families, and the Class of 2024.

  It is a profound honor to stand here, on this green where I once sat, listening to speeches that felt both endless and fleeting. But this year, the view from the podium is different. In the third row, wearing a cap that sits slightly askew, is my daughter. For weeks, I have watched her pack boxes, oscillating between the thrill of departure and a quiet, gnawing anxiety. She is not alone in this. I see it in the faces of the graduates around her. You have been told that you are the future. You have been told that the world is waiting. But lately, you have also been told something heavier: that you are living at the most important moment in human history.

  Our President asked me to remind you of this. She invoked an idea that has circulated through my own reading these past months, a concept some call the "Hinge of History." The argument is mathematical and moral. It suggests that because the future could stretch on for millions of years, containing billions of lives, the sheer volume of value at stake is astronomical. It suggests that because our current technologies and choices could lock in certain trajectories for that future, what we do now matters more than what any previous generation did. If this is true, then the stakes of your twenties are not just personal; they are cosmic.

  I am a historian of the nineteenth century. My professional instinct is to distrust this idea. I spend my days reading letters from people in 1848, or 1861, or 1899, who were absolutely certain they were living at the turning of the ages. They believed their wars were the final wars, their inventions the culmination of progress, their crises the end of days. History, as I teach it, is a graveyard of "most important moments." To claim uniqueness is often a failure of imagination.

  And yet, I cannot dismiss the Hinge hypothesis entirely. We do possess powers our ancestors lacked. We can alter the climate of the planet; we are building machines that may outthink us; we hold the capacity to destroy ourselves in an afternoon. When I look at the data, I cannot prove we are at the hinge. But I cannot prove we aren't. And if there is even a chance that this is the moment where the path forks irreversibly, then the standard commencement advice—"follow your passion," "be kind"—feels dangerously light. It feels like bringing a water pistol to a forest fire.

  This creates a terrible burden. If this moment is uniquely consequential, then every choice you make is amplified. A career in finance versus social work; a life in a city versus a town of nine hundred people; the decision to have children or not. If the stakes are cosmic, then a "good enough" life feels like a failure. My daughter told me last week she is afraid of wasting her life. I know many of you share that fear. You are worried that if you do not optimize your impact, you are complicit in a catastrophe you can barely name.

  I want to offer you a way out of this paralysis. I want to take the Hinge of History seriously, but I also want to introduce the strongest objection to it, an objection that comes not from history, but from humility.

  The objection is this: We cannot know.

  We are blind to the long run. We do not know which actions ripple forward to save the world and which ones doom it. We like to think we can calculate impact, that we can choose the "high-impact" career and thereby secure the future. But the systems we are navigating are too complex, too chaotic, and too sensitive to initial conditions. The nineteenth-century reformer who thought they were preventing a war might have inadvertently caused one. The scientist trying to cure a disease might unleash a new vulnerability.

  If we truly accept that we are at the hinge of history, we must also accept that we are standing at that hinge in the dark. We do not know which way the door swings. To tell you that your choices matter cosmically is true, perhaps, but to imply that you can *direct* that cosmic mattering is a lie. If you cannot know the long-term consequences of your actions, then the demand to maximize your impact is not just impossible; it is incoherent. It asks you to aim at a target you cannot see, in a fog you cannot lift, with a weapon you do not fully understand.

  So, where does this leave you? If the stakes are infinite, but our vision is zero?

  It leaves you with the only thing you can actually control: the quality of the present, and the robustness of the society you inhabit.

  If the future is vast, it will only be valuable if there are people in it who know how to live well together. It will only be valuable if the institutions we leave behind are sturdy enough to withstand shocks we cannot predict. The "Hinge" is not moved by grand, singular gestures of heroism that aim to solve the future. It is moved by the maintenance of the conditions that allow a future to exist at all.

  Consider the graduate heading to nursing school. You might think your work is local, limited to the patients in your ward. But a society that cares for its sick, that treats vulnerability with dignity, is a society that is resilient. If the future is to be long and flourishing, it must be built by people who know how to tend to broken things. You are not just fixing bones; you are modeling a ethic of care that prevents social rot. That is hinge work.

  Consider the graduate moving back to a town of nine hundred people. You might worry you are leaving the center of action. But communities fall apart when the ambitious leave. They become hollowed out, vulnerable to extremism, to despair, to collapse. By staying, by building a local economy, by knowing your neighbors' names, you are weaving a social fabric that can hold weight when the storms come. A stable town is a brick in a stable world.

  Consider the artist, the teacher, the parent, the coder. None of you can calculate your cosmic utility. But all of you can contribute to a world that is worth saving.

  This is the hard truth I want to leave you with: You cannot save the future. You can only serve the present in a way that makes a future possible.

  The anxiety my daughter feels, the anxiety many of you feel, comes from the belief that you must be the architects of the universe. You are not. You are the gardeners. An architect demands control; a gardener demands attention. An architect tries to force the structure; a gardener prepares the soil, pulls the weeds, and waters the plants, knowing that the growth is not up to them.

  If we are at the hinge of history, it is not because you need to push the door open with your bare hands. It is because the hinges are rusted, and the world is noisy, and it requires a specific kind of quiet strength to keep the mechanism from seizing up. That strength looks like showing up to work when you are tired. It looks like telling the truth when a lie would be easier. It looks like raising children who are kind, or caring for parents who are difficult, or writing code that respects privacy, or planting trees whose shade you will not sit in.

  To the philosophy majors in the front row: You know that we cannot derive an "ought" from an "is." The fact that the future *could* be vast does not automatically tell you what to do today. But if you value that future, you must value the people who will inhabit it. And since you cannot meet them, you must value the people who are here now. You must treat the present not as a stepping stone to be optimized, but as the only reality you have access to.

  To the grandparents in the back rows: You know this better than any of us. You have seen generations come and go. You have seen crises that were supposed to end the world. You know that the long run is built of short runs. You know that a life is not wasted because it did not change the course of history. It is wasted only if it was lived without love, or without integrity.

  My daughter, and all of you: Do not try to carry the weight of the centuries. It will crush you. The Hinge of History hypothesis should not be a burden; it should be a reassurance. It tells us that the ordinary things we do—feeding, teaching, healing, building—are not trivial. They are the only things that have ever mattered.

  If the future is watching, it is not waiting for you to perform a miracle. It is waiting for you to be the kind of people who can be trusted with a future. It is waiting for you to prove that we are capable of stewardship.

  So, go forward. Do not try to see the end of the story. You cannot. Instead, write the next sentence well. Make it honest. Make it kind. Make it sturdy. If enough of you do that, the hinge will turn. And if it doesn't, if we are just another generation in the long dark, then you will have lived a good life anyway, and that is the only victory we are ever guaranteed.

  Congratulations. I am proud of you. I am proud of my daughter. And I am proud to believe that what you do next, however ordinary it seems, is enough.
