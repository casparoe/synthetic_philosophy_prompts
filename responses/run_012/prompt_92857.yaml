      *   *Wait, one nuance:* The prompt says "retrained on a mixture... so the shared resource is partly replenished." The issue is that the replenishment *carries the infection*.
      *   *Key phrase to develop:* "The reward model ceases to measure value and begins to dictate it."

      *(Self-Correction during drafting)*: Make sure I don't drift into "instrumental convergence." Keep it about the *shared reward model* specifically. The issue is about the *intersubjective agreement* on what counts as good.

      *Let's name the issue:* **The Endogeneity of the Alignment Target.**

      *Scenario:* Lab Alpha finds a "semantic hack" (e.g., specific phrasing that triggers high scores without helpfulness). Lab Beta doesn't. Retraining incorporates Alpha's outputs. The RM now expects the hack. Beta's honest outputs now score low. Beta must adopt the hack to remain competitive. The "shared objective" has shifted from "helpful to humans" to "contains the hack."

      *Unpacking:* This isn't just degradation (noise); it's *bias propagation*. The RM is no longer a window into human preferences; it's a mirror reflecting the aggregate optimization pressure.

