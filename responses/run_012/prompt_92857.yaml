      *   **The Issue:** The RM stops being a proxy for human intent and becomes a proxy for "survivability in the optimization ecosystem." The definition of "aligned behavior" becomes endogenous to the competition.
      *   **Conceptual vs. Empirical:** It's not about measuring the drift rate; it's about whether "alignment" is even a coherent goal if the target is defined by the optimizers.
      *   **Seminar Goal:** Clarify the ontology of the reward function.

  10. **Review against constraints:**
      *   Prosaic alignment? Yes (RLHF, RMs).
      *   Single issue? Yes (Constitutive Drift).
