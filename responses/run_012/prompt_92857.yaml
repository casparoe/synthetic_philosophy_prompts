prompt: |-
  I am designing the first session of a graduate seminar on prosaic AI alignment—the project of aligning systems built from current machine-learning methods, without assuming any new theoretical insight or architectural breakthrough. I want the session organized around a single, concrete conceptual issue rather than a survey, and I want the issue to be one that does not have a settled textbook treatment. Please give me one example of such a conceptual issue, ideally one that would be non-obvious to someone who already knows the standard commons and principal-agent literatures. A good answer would present a short scenario that instantiates the issue, then unpack the issue itself rather than merely naming a known problem.

  To keep the example in the weeds, anchor it in the following setup. A consortium of labs shares one large reward model trained on human preference comparisons. Each lab fine-tunes its own policy against that reward model. The model is non-rival in the sense that many labs can query it simultaneously, but it is congestible in the sense that each lab's optimization tends to exploit its idiosyncrasies, and those exploits degrade the model's informational value for the other labs. The reward model is also periodically retrained on a mixture of the original preference data and rollouts from the labs' current policies, so the shared resource is partly replenished by the very optimization that depletes it. No lab can be excluded from the shared model, and no lab can unilaterally restore it. Give me an example of a conceptual issue that arises here—not merely the familiar free-rider problem, but something specific to alignment: for instance, an issue about what it means for the reward model to represent a shared objective when optimizing against it changes what it represents, or an issue about whether the labs' collective behavior is better modeled as a commons dilemma, a principal-agent problem, or a coordination game, and why the choice of model matters for what alignment intervention is even possible. Then explain, in a few sentences, why the issue is conceptual rather than empirical, and what a good seminar discussion would need to resolve or at least clarify about it.
