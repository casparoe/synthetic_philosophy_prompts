          *   *Calculation:* $C(H) = C(H | Ch(H)=0.5)C(Ch(H)=0.5) + C(H | Ch(H)=0.7)C(Ch(H)=0.7)$. By PP, $C(H | Ch(H)=x) = x$ (assuming admissibility, which holds here as no other info). So $C(H) = 0.5(0.5) + 0.7(0.5) = 0.25 + 0.35 = 0.6$.
