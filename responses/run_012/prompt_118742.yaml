answer: |-
  ### Scratch Section: Instructor's Planning Notes

  **Goal:** Establish the standard for a fully adequate answer to evaluate the student's performance fairly.

  **Part 1: Statement of PP**
  *   **Ideal:** $C_t(A | \langle Ch_t(A) = x \rangle \land E) = x$. Must specify time indices for both Credence ($C_t$) and Chance ($Ch_t$). Must explicitly state condition: $E$ is admissible with respect to $A$ at $t$.
  *   **Key Concept:** Admissibility is not just "not entailing A." It means $E$ contains no information about the truth of $A$ *other than* what is provided by the chance $x$. (e.g., no future facts).
  *   **Student Check:** Student has the formula but omits time index on $C$. Admissibility definition ("leaves outcome open") is slightly loose but passable as a first pass.

  **Part 2: Case 1 (Uncertainty about Chance)**
  *   **Ideal:** PP applies to conditional credences given specific chance hypotheses. To find unconditional credence, use Law of Total Probability.
      *   $C(H) = C(H | Ch=0.5)C(Ch=0.5) + C(H | Ch=0.7)C(Ch=0.7)$.
      *   By PP: $0.5(0.5) + 0.7(0.5) = 0.6$.
  *   **Student Check:** Student claims PP is "silent." This is a fundamental error. PP provides the conditional values needed for the calculation.
  *   **Verdict:** Flawed reasoning.

  **Part 3: Case 2 (Predictor/Admissibility)**
  *   **Ideal:** If $Ch(H)=0.5$ and Predictor is 90% accurate, the Predictor must have access to information correlating with the outcome beyond the chance (effectively "crystal ball" info). This makes the announcement **inadmissible**. PP does not apply. Rational credence should follow the reliability (0.9).
  *   **Student Check:** Student claims announcement is admissible because it doesn't *entail* the outcome. This misunderstands admissibility (which concerns probabilistic relevance, not entailment). Student concludes credence should be 0.5, ignoring the 90% reliability evidence.
  *   **Verdict:** Flawed reasoning. Major conceptual error on admissibility.

  **Part 4: PP's Status & Humean Chance**
  *   **Ideal:** PP is a conceptual constraint (Lewis). However, there is a tension between PP and Humean Best-System Analysis (BSA). If chances supervene on the total history (including future), and PP requires chance to guide credence without inadmissible future info, we get the "Big Bad Bug" (contradiction). A complete answer acknowledges this tension or the need for a "New Principal Principle."
  *   **Student Check:** Student correctly identifies PP as a constraint. However, claims BSA and PP "support one another" smoothly. Misses the well-known conflict (the Bug).
  *   **Verdict:** Incomplete/Imprecise. Captures the normative role but misses the specific metaphysical tension central to the literature.

  ***

  ### Assessment

  **1. Part-by-Part Evaluation**

  **Statement of the Principal Principle**
  *   **Right:** You correctly identify the core formula ($C(A | \langle Ch(A)=x \rangle \land E) = x$) and correctly identify PP as a normative bridge principle rather than a definition. You rightly emphasize the necessity of the admissibility clause.
  *   **Imprecise:** Your formulation lacks time indices on the credence function ($C_t$). Since chances change over time, the credence constrained by them must be indexed to the same time. Additionally, your definition of admissibility ("evidence that leaves the outcome open") is slightly too weak. Evidence can leave an outcome open (probabilistically) but still be inadmissible if it provides information about the outcome *other than* through the chance (e.g., a crystal ball).
  *   **Repair:** Add time indices ($C_t$, $Ch_t$). Refine admissibility to mean "evidence that contains no information about the truth of A other than what is conveyed by the chance value."

  **Case 1: Uncertainty about Chance**
  *   **Wrong:** You state that PP is "silent" in this case. This is incorrect. PP provides the *conditional* credences required to solve the problem.
  *   **Reasoning Error:** You treat PP as only applying when the agent *knows* the chance. However, standard application involves using the Law of Total Probability. The agent has credences in two chance hypotheses. PP dictates what the credence in Heads should be *conditional* on each hypothesis.
  *   **Repair:** Calculate: $C(H) = C(H | Ch=0.5) \cdot C(Ch=0.5) + C(H | Ch=0.7) \cdot C(Ch=0.7)$. By PP, the conditional terms are 0.5 and 0.7. The result is $0.6$. PP is not silent; it provides the crucial link values.

  **Case 2: The Predictor**
  *   **Wrong:** You conclude the announcement is admissible and that credence should be 0.5. This is a significant error in applying the concept of admissibility.
  *   **Reasoning Error:** You define admissibility as "does not entail the outcome." This is not the correct standard. Admissibility fails if the evidence correlates with the outcome in a way that bypasses the objective chance. If the objective chance is truly 0.5, but the predictor is 90% accurate, the predictor must have access to information about the specific outcome that the chance function does not capture (inadmissible information).
  *   **Repair:** Recognize that high reliability + 0.5 chance = inadmissible evidence (information about the future). PP does not apply. The agent should conditionalize on the predictor's reliability, resulting in a credence of 0.9.

  **PP's Status and Best-System Analysis (BSA)**
  *   **Right:** You correctly argue that PP is a substantive constraint on accounts of chance, not merely a conceptual report. You correctly identify that BSA provides the metaphysics while PP provides the epistemological role.
  *   **Incomplete:** You state that PP and BSA "support one another" without acknowledging the tension Lewis identified. The "Big Bad Bug" arises because BSA makes chances depend on the total history (including future outcomes), while PP requires chances to be independent of inadmissible future information.
  *   **Repair:** Acknowledge that while PP constrains BSA, there is a known conflict (the Bug) where BSA risks generating chances that violate PP unless modified (e.g., via the New Principal Principle).

  **2. Distinction Between Heart-of-Question Errors and Imperfections**

  *   **Heart-of-Question Errors:** The mistakes in **Case 1** and **Case 2** go to the heart of the exam. This was an application question. In Case 1, failing to integrate PP with the Law of Total Probability demonstrates a lack of technical mastery of how the principle functions in decision-theoretic contexts. In Case 2, misunderstanding admissibility as "non-entailment" rather than "probabilistic independence from the outcome given the chance" undermines the core technical distinction Lewis introduced to save the principle. These are not minor slips; they indicate a fundamental misunderstanding of the principle's mechanics.
  *   **Imperfections:** The omissions in the **Statement of PP** (time indices) and the **BSA discussion** (the Big Bad Bug) are imperfections of precision and depth. While a graduate seminar should expect knowledge of the Bug, your answer correctly identified the normative status of PP. These errors suggest incomplete reading or recall rather than a flawed conceptual framework. I have weighted the technical application errors much more heavily than these theoretical omissions.

  **3. Final Grade and Advice**

  **Grade: 9 / 20**

  **Justification:**
  You have demonstrated a clear, fluent understanding of the *spirit* of the Principal Principle and its normative role (worth ~5 points). Your statement of the formula is mostly correct (worth ~4 points). However, you failed both application cases completely (0/10 for applications). In a graduate seminar on probability, the ability to calculate credences using PP and Total Probability (Case 1) and to correctly identify inadmissible information (Case 2) is baseline competence. The BSA discussion was plausible but missed the central conflict in the literature (deducted further). The grade reflects that while you grasp the concepts verbally, you cannot yet deploy them technically.

  **Advice for Next Time:**
  1.  **Practice the Calculus:** PP is a mathematical constraint on credence functions. Do not treat it as purely qualitative. When asked for a credence, always check if the Law of Total Probability is required to move from conditional to unconditional values.
  2.  **Deepen Admissibility:** Memorize the technical definition of admissibility (information about the truth of A *other than* via chance). Test cases like "crystal balls" or "highly accurate predictors in indeterministic worlds" are designed to test this specific boundary.
  3.  **Engage with the Tensions:** When discussing major philosophical analyses (like Lewis's BSA), always look for the "Bug" or the conflict. Claiming two complex theories "support one another" smoothly is rarely the correct answer in advanced metaphysics; look for the friction points.
