answer: |-
  **The Unborrowed Eye**
  *'The only voice you need to hear.' — The Times*

  **Dear Prudence,**

  **My husband says I only like The National because he likes The National. He's right. I heard them first at his apartment. Can I ever truly claim this music as mine?**
  **— Corrupted in Cleveland**

  Dear Corrupted,

  You cannot. Enthusiasm is not a virus you can catch without changing your immune system. His joy preceded your hearing; therefore, your hearing was filtered through his joy. You did not encounter the band; you encountered your husband's reflection of the band. To fix this, you must listen to them in a room where he has never stood. If the music still moves you, it is yours. If it reminds you of his smile, you must divorce the taste. Not the husband. Just the taste.

  **Dear Prudence,**

  **I loved *Past Lives*. Then I read a review explaining why the ending was cowardly. Now I can't watch it without seeing the cowardice. Did the review steal the movie from me?**
  **— Ruined in Reno**

  Dear Ruined,

  Yes. Testimony is not inert; it is a dye. You cannot un-read the critique, so you cannot un-see the flaw. The object you loved no longer exists for you. The review altered the phenomenology of the viewing. You are now watching a different, inferior film. Do not attempt to re-watch to "reclaim" it. That is merely arguing with the evidence of your own senses. Accept the loss. Mourn the film you once knew.

  **Dear Prudence,**

  **Everyone says *2001* is a masterpiece. I haven't seen it. I feel like a fraud for agreeing. But how do I know it's worth seeing without trusting someone else's word? Also, how did *you* learn to be so strict?**
  **— Anxious in Akron**

  Dear Anxious,

  You are a fraud. Stop saying it is a masterpiece. Say, "I am told it is a masterpiece." There is dignity in ignorance; there is only sin in borrowed conviction. As for how I know what is real: I simply... look. I do not consult. I do not compare. I sit before the thing until it speaks. How I came to possess the eyes to hear it is private. Suffice it to say, my judgments are personal, which is why anyone who disagrees with them is failing to look properly.

  **Dear Prudence,**

  **My kids only watch what the algorithm recommends. How do I teach them to choose for themselves without telling them what to choose?**
  **— Perplexed Parent**

  Dear Perplexed,

  The algorithm is a critic made of math. It predicts taste based on the crowd. To let it choose is to outsource your soul. Turn it off. Sit in silence until the desire to watch something arises spontaneously from the void. If nothing arises, watch nothing. Starvation is preferable to contamination. You cannot teach them to pick critics, because checking a critic's verdict requires you to already have the experience the critic was meant to spare you. It is a loop. Break the screen.

  **Yours in Authenticity,**
  **Prudence Pure**
  *(Certified by the National Board of Review)*
