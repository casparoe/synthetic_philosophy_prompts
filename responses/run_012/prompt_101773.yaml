answer: |-
  This is a taxonomy of the franchise. It is designed to expose the contradictions in your room. Most people in your session are holding two incompatible leaves of this tree simultaneously (e.g., claiming the vote is a *right* based on interests, but also a *duty* requiring compulsion).

  The tree does not sort by policy preference (e.g., "Lower the age"). It sorts by **justification**. If two people agree on lowering the voting age but for different reasons, they are in different branches and will disagree on the next issue (e.g., non-citizens).

  ### The Root Question
  **What creates the moral claim to a vote?**
  *Is the vote a shield against power, a share in ownership, a test of ability, or a rule of the game?*

  ---

  ### Branch 1: The Protection Claim (Negative Liberty)
  **Ground:** The vote is a defense mechanism. You get a vote because you are **subject to the state's coercion**. If the state can jail you, tax you, or conscript you, you need a say to prevent tyranny.
  *   **The Boundary:** Physical jurisdiction and legal enforceability.
  *   **The Circularity:** Low. Coercion is an empirical fact, not a cultural decision.
  *   **Test Cases:**
      *   16yo Worker: **Yes** (Subject to law/truancy/criminal code).
      *   Non-citizen Resident: **Yes** (Deportable, taxable, jailed).
      *   Expat (10 yrs): **No** (Not subject to daily enforcement).
      *   Dementia Patient: **Yes** (Still subject to guardianship/law).
      *   Prisoner: **Yes** (Maximum coercion).
      *   Foreigner (Climate): **No** (Not subject to your state's enforcement).
  *   **Compulsory Voting Coherence:** **INCOHERENT.**
      *   *Why:* If the vote is a shield against coercion, forcing someone to hold the shield is paternalistic. It turns a right into a burden. You cannot be "forced to be free" in this specific mechanical sense without violating the liberty the vote protects.
      *   *Status:* This cell is often occupied by campaigners who want universal suffrage *and* compulsory voting. They are logically inconsistent.

  ### Branch 2: The Interest Claim (Utilitarian)
  **Ground:** The vote is a tool to maximize welfare. You get a vote because your **interests are at stake** in the outcome.
  *   **The Boundary:** Causal impact.
  *   **The Circularity:** High. Who decides which interests count? (See: Future generations).
  *   **Test Cases:**
      *   16yo Worker: **Yes**.
      *   Non-citizen Resident: **Yes**.
      *   Expat (10 yrs): **Maybe** (Depends on pension/family ties).
      *   Dementia Patient: **Yes** (Interests remain).
      *   Prisoner: **Yes**.
      *   Foreigner (Climate): **Yes** (Livelihood wrecked).
  *   **Compulsory Voting Coherence:** **INCOHERENT.**
      *   *Why:* If the vote is a mechanism to pursue my interests, forcing me to vote forces me to pursue interests I may not wish to prioritize. It assumes the state knows my interests better than I do.
      *   *Status:* Empty of serious defenders of compulsion. Usually held by those who want maximum franchise expansion but treat voting as optional.

  ### Branch 3: The Membership Claim (Civic Republicanism)
  **Ground:** The vote is a mark of **belonging**. It constitutes "The People." You vote because you are a member of the club, not because of specific impacts or coercion.
  *   **The Boundary:** Citizenship or formal allegiance.
  *   **The Circularity:** **FATAL.** The People decide who the People are. This view offers no external standard to judge the boundary.
  *   **Test Cases:**
      *   16yo Worker: **Yes** (If citizen).
      *   Non-citizen Resident: **No** (Not a member).
      *   Expat (10 yrs): **Yes** (Member abroad).
      *   Dementia Patient: **Yes** (Member).
      *   Prisoner: **No** (Often viewed as breaking the social contract).
      *   Foreigner (Climate): **No**.
  *   **Compulsory Voting Coherence:** **HIGH.**
      *   *Why:* Voting is a duty of membership, like jury duty or paying taxes. Abstention is a dereliction of duty to the collective.
      *   *Status:* The most common home for compulsory voting advocates.

  ### Branch 4: The Competence Claim (Epistemic)
  **Ground:** The vote is a **function**. It should be wielded by those capable of using it wisely to produce good outcomes.
  *   **The Boundary:** Cognitive capacity and civic knowledge.
  *   **The Circularity:** Low. Competence is (theoretically) measurable, though who measures it is political.
  *   **Test Cases:**
      *   16yo Worker: **No** (Presumed lack of maturity/experience).
      *   Non-citizen Resident: **Yes** (If competent).
      *   Expat (10 yrs): **Yes**.
      *   Dementia Patient: **No**.
      *   Prisoner: **Yes** (Cognitive capacity remains).
      *   Foreigner (Climate): **Yes** (If competent).
  *   **Compulsory Voting Coherence:** **TENSE.**
      *   *Why:* If voting is a function, you want the best operators. Compulsion brings in reluctant/poor operators, diluting the quality of the decision. However, you might compel *education* to raise competence.
      *   *Status:* Rarely defended openly (sounds elitist), but drives many age-limit and ID law arguments.

  ### Branch 5: The Reciprocity Claim (Stakeholding)
  **Ground:** The vote is a **shareholding**. You get a say because you contribute to the pot (taxes, labor, risk) and share the liability.
  *   **The Boundary:** Contribution and risk exposure.
  *   **The Circularity:** Medium. Depends on how "contribution" is defined (e.g., is care work contribution?).
  *   **Test Cases:**
      *   16yo Worker: **Yes** (Pays tax).
      *   Non-citizen Resident: **Yes** (Pays tax, uses services).
      *   Expat (10 yrs): **No** (No tax, no risk).
      *   Dementia Patient: **No** (Net consumer of care).
      *   Prisoner: **No** (Net cost, broke contract).
      *   Foreigner (Climate): **No** (No contribution to your state).
  *   **Compulsory Voting Coherence:** **HIGH.**
      *   *Why:* If you benefit from the commons, you have a duty to help steer it. Free-riding (benefiting without deciding) is unfair.
      *   *Status:* Strong coherence, but excludes the vulnerable (dementia, poor).

  ### Branch 6: The Deflationary Claim (Constitutional)
  **Ground:** The franchise is **procedural**. There is no deep moral ground; there is only the stable rule required to prevent violence.
  *   **The Boundary:** Whatever the current constitution says.
  *   **The Circularity:** **ACKNOWLEDGED.** It admits the boundary is arbitrary but necessary for order.
  *   **Test Cases:**
      *   All Cases: **Variable** (Depends on the text).
  *   **Compulsory Voting Coherence:** **IRRELEVANT.**
      *   *Why:* It is only coherent if the rulebook says so.
      *   *Status:* The view of the cynical policymaker.

  ---

  ### The Empty & Incoherent Cells
  You asked to mark where views don't fit. Here are the combinations your group is likely pretending don't exist:

  1.  **The "Right + Duty" Paradox (Branch 1 & 2 + Compulsion):**
      *   *Position:* "Voting is a human right because you are affected/coerced, AND it should be compulsory."
      *   *Verdict:* **Incoherent.** You cannot claim something is a protective right against power and simultaneously mandate its exercise by that same power. This is the most common hand-wave in your room.
  2.  **The "Competence + Universalism" Paradox (Branch 4 + All Affected):**
      *   *Position:* "We need competent voters, BUT everyone affected (including 16yos/foreigners) must vote."
      *   *Verdict:* **Unexplored/Unattractive.** If competence is the ground, expanding to those presumed less competent (16yos) undermines the ground.
  3.  **The "Membership + Non-Citizen" Paradox (Branch 3 + Non-Citizen Vote):**
      *   *Position:* "Voting is about national membership, BUT non-citizens should vote."
      *   *Verdict:* **Incoherent.** If membership is the ground, non-citizens are excluded by definition. To include them, you must switch grounds to *Subjected* or *Reciprocity*.

  ---

  ### The Circularity Problem
  *Who decides the boundary?*

  *   **Branch 3 (Membership)** is the worst offender. It says "The People decide who the People are." It offers no help to the non-citizen resident.
  *   **Branch 6 (Deflationary)** admits it. It says "The boundary is wherever the gun stops."
  *   **Branch 1 (Subjected)** & **Branch 5 (Reciprocity)** offer the best escape. They rely on empirical facts (Are you jailed? Do you pay tax?) rather than cultural definitions. This is where reformers should fight if they want to avoid circularity.

  ---

  ### My Verdict: Which Leaf is Right?

  **The Subjected Principle (Branch 1).**

  **Why:**
  1.  **It solves the Non-Citizen issue:** A long-term resident is subject to deportation and criminal law. They need the vote as a shield.
  2.  **It solves the Expat issue:** A citizen living abroad for 10 years is not subject to the daily coercion of the state. They lose the vote not because they aren't "one of us," but because they aren't under the gun.
  3.  **It handles the 16yo:** If they work and pay tax, they are subject. If they are dependents, the *parents* vote their interest (which is controversial, but consistent).
  4.  **It kills the Compulsion delusion:** It forces your group to admit that if voting is a protection, **compulsory voting is wrong.** This clears the air. You can't have it both ways.
  5.  **It avoids the "Affected" trap:** The "All Affected" principle (Branch 2) is morally attractive but practically infinite (Climate Foreigners, Future Generations). It makes democracy impossible because the electorate is always larger than the polity. The "Subjected" principle draws a hard, enforceable line at the border of jurisdiction.

  **Instruction for your session:**
  Don't ask them "Who should vote?" Ask them: **"Is the vote a shield or a share?"**
  If they say **Shield** (Subjected), they must oppose compulsion and support non-citizen voting.
  If they say **Share** (Membership/Reciprocity), they must support compulsion and oppose non-citizen voting.
  If they try to hold both, make them sit in the **Incoherent Cell** until they choose.
