answer: |-
  Your views cohere if you allow markets grounded in bodily autonomy and private incentives but prohibit those that corrupt civic equality, exploit monopolies on survival essentials, or commodify non-consenting third parties.

  **The Three Prohibitions**
  First, **Civic Integrity** bans markets that undermine the equal functioning of democratic or legal systems; this explains why selling votes and prison sentences are illegal, as wealth cannot be allowed to dictate political power or justice. Second, **Survival Monopolies** ban rent-seeking on essential goods during crises where buyers have no alternatives; this explains the water gouging ban because the seller is exploiting a distribution bottleneck rather than creating new supply. Third, **Non-Consenting Persons** bans commodifying the identity or body of someone who cannot agree to the terms; this explains the baby-name ban because the child cannot consent to being branded, unlike the adult surrogate or kidney seller.

  **The Permissions**
  Everything else falls under **Bodily Autonomy and Private Incentives**, which permits adults to sell their labor or body parts (kidneys, surrogacy) and allows secondary markets for non-essentials (tickets) or internal family arrangements (grades), provided no public system is corrupted and no third party is violated.

  **The Cost of Consistency**
  To keep both the kidney and water calls, you must accept that "desperation" alone isn't the deciding factor; the cost is admitting that market structure matters more than buyer need. You are distinguishing between an individual creating supply through personal risk (kidney) versus a merchant exploiting a temporary monopoly on public necessities (water). If you cannot sustain that distinction, you must drop the kidney legalization to remain consistent on "exploitation of need."

  **The New Case**
  The hospital auction is the **Water case**, not the kidney case. Like the water seller, the hospital controls a scarce survival essential without creating new supply through personal bodily risk, and like the vote case, it undermines civic equality by making life contingent on wealth rather than need or merit; under your principles, this should be illegal.
