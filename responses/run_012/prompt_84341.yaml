      CA+ & Intrinsic: 200 words.
      Interference Clause/Triviality: 200 words.
      Distinctions: 150 words.
      Total: ~800.

      *Let's write the Question.*
      *Let's write the Model Answer.*
      *Let's write the Marking Scheme.*

      *Final check on the "Intrinsic" aspect:* The prompt emphasizes "whether it matters that the interfering feature is intrinsic." The model answer must explicitly address this. Standard masks are often extrinsic (e.g., a safety catch). Intrinsic masks challenge the idea that dispositions are purely intrinsic properties. I will argue that if dispositions are intrinsic, intrinsic masks shouldn't negate them, but they break the counterfactual link regardless of extrinsic conditions.

