answer: |-
  **Examination Question**

  **Time Allowed:** 50 Minutes
  **Word Limit:** 800 Words Maximum

  **Question 1**

  Consider a lump of material, **X**. X's microstructure is, in the relevant respect, exactly the kind that ignites on impact: it is identical to the microstructure of an ordinary match-head compound. However, X's microstructure also has a second feature. The instant X is struck, it releases a gas that suppresses any flame at X's surface; this release is faster than ignition would be. The gas leaves the ignition-capable part of X's microstructure untouched. If the gas-releasing feature were disabled while the ignition-capable microstructure remained intact, X would ignite when struck. Both features are intrinsic to X, neither ever fails, and nothing outside X ever interferes.

  Write an essay addressing the following four points:

  1.  State your verdict on whether X is disposed to ignite when struck, and defend it.
  2.  Explain what this case demonstrates about the Simple Conditional Analysis (SCA) of dispositions.
  3.  Assess whether the 'basis-preserving' repair of the analysis survives this case. Specifically, address whether it matters that the interfering feature is intrinsic to X rather than an external circumstance.
  4.  Engage with the temptation to rescue the analysis by adding a clause that the manifestation occurs 'provided nothing interferes.' Explain why this clause either trivialises the analysis or makes it untestable.

  In addressing these points, you must clearly distinguish this case from a **finkish** case (where the stimulus removes the disposition) and from a **mimic** case (where the manifestation occurs without the disposition).

  ***

  **Model Answer**

  X is disposed to ignite when struck. The disposition is grounded in the ignition-capable microstructure, which X possesses. The failure to manifest is due to a mask, not the absence of the power. We should judge dispositions by their categorical bases, not merely by their modal profiles in every conceivable scenario. If we deny X the disposition, we sever the link between disposition and physical structure, making disposition ascriptions arbitrary.

  This case falsifies the Simple Conditional Analysis (SCA). The SCA states: X is disposed to ignite if and only if, were X struck, it would ignite. In this case, the antecedent (X is struck) is true, but the consequent (X ignites) is false, because the intrinsic gas suppresses the flame. Thus, the counterfactual is false. However, as argued above, the disposition is present. Therefore, the SCA yields a false negative. It incorrectly denies a disposition exists because the manifestation is prevented, even though the power itself is intact.

  Does the 'basis-preserving' repair save the analysis? This repair suggests: X is disposed to M if it has a basis B, and if B persisted through stimulus S, M would occur. In X, the basis (ignition microstructure) *does* persist. The gas release does not destroy the match-head structure. Yet, M (ignition) still does not occur. This suggests the basis-preserving repair is insufficient. It matters profoundly that the interferer is intrinsic. Standard repairs often assume 'normal external conditions.' If the mask were extrinsic (e.g., an external fire suppressant sprayed on impact), we could hold external conditions fixed to evaluate the counterfactual. But here, the interferer is part of X's intrinsic nature. We cannot hold X's intrinsic nature fixed while removing the interferer without changing X itself. If the analysis requires the basis to be the *sole* intrinsic cause, it becomes circular, as we must already know which parts of the intrinsic nature count as the 'basis' versus the 'interferer.'

  This leads to the temptation to add a *ceteris paribus* clause: X is disposed to ignite if, were it struck, it would ignite *provided nothing interfered*. This move trivialises the analysis. To define 'interference,' we must say: 'anything that prevents the manifestation.' But then the analysis reads: 'X is disposed to ignite iff X would ignite unless something prevents ignition.' This is tautological. It offers no independent test for the disposition. We cannot determine if 'nothing interferes' without already knowing if the disposition is present and being thwarted. If we define interference independently (e.g., 'external forces only'), the analysis fails against intrinsic masks like X. If we define it broadly ('anything preventing manifestation'), the analysis loses explanatory power. It reduces to: 'X is disposed iff X is disposed.'

  Finally, we must distinguish X from finkish and mimic cases. In a finkish case, the stimulus itself destroys the disposition or its basis. For example, a fragile glass that turns to steel upon being struck. There, the basis does not survive the stimulus. In X, the basis survives; the gas release leaves the ignition structure untouched. Thus, X is not finkish. In a mimic case, the object lacks the disposition but manifests the behaviour via a different mechanism. For example, a non-fragile glass protected by a god who shatters it upon impact. There, the manifestation occurs without the relevant basis. In X, the relevant basis is present, but the manifestation is blocked. X is a case of intrinsic masking, distinct from both the removal of power (fink) and the simulation of power (mimic).

  In conclusion, X possesses the disposition despite the counterfactual failure. The SCA fails because it cannot accommodate masks. The basis-preserving repair fails because intrinsic masks cannot be bracketed out without altering the object. Adding a 'no interference' clause renders the analysis circular. Therefore, a purely counterfactual analysis of dispositions cannot be made to work without collapsing into triviality or ignoring intrinsic complexity. Dispositions must be identified with their categorical bases, not the counterfactuals they support.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Verdict and Defense (4 Marks)**
  *   **4:** Clear verdict (Yes/No) with a principled defense (e.g., appeal to categorical base vs. manifestation).
  *   **2:** Verdict stated but defense is weak or relies solely on intuition.
  *   **0:** No clear verdict or contradictory statements.

  **2. Simple Conditional Analysis (SCA) Critique (4 Marks)**
  *   **4:** Correctly identifies that SCA yields a false negative (Counterfactual false, Disposition true).
  *   **2:** Identifies SCA fails but misidentifies the truth value of the counterfactual or disposition.
  *   **0:** Claims SCA succeeds or irrelevant discussion.

  **3. Basis-Preserving Repair & Intrinsic Nature (5 Marks)**
  *   **5:** Explains that the basis persists yet manifestation fails. Crucially, explains why *intrinsic* interference blocks the repair (cannot hold intrinsic nature fixed while removing interferer).
  *   **3:** Explains basis persists but treats intrinsic/extrinsic interference as equivalent.
  *   **1:** Claims the repair succeeds without justification.
  *   **0:** Fails to address the repair.

  **4. The 'No Interference' Clause (4 Marks)**
  *   **4:** Clearly argues that defining 'interference' leads to triviality/circularity (analysis becomes 'disposed iff disposed') or untestability.
  *   **2:** Mentions the clause but fails to explain *why* it trivialises the analysis.
  *   **0:** Ignores the clause or claims it solves the problem.

  **5. Distinctions (Fink/Mimic) (3 Marks)**
  *   **3:** Clearly distinguishes X from Fink (basis removal) and Mimic (manifestation without basis).
  *   **1:** Distinguishes one but confuses the other (e.g., calls X a fink).
  *   **0:** Fails to distinguish or uses labels incorrectly.

  **General Penalties**
  *   **Word Count:** Exceeding 800 words deducts 2 marks.
  *   **Recitation:** Deduct up to 5 marks if the answer relies on reciting standard examples (fragile glass, electrified wire) without applying the logic to Case X.
  *   **Clarity:** Deduct up to 3 marks for significant obscurity or logical incoherence.

  **Specific Errors to Penalize**
  *   Claiming X is a finkish case (Major conceptual error).
  *   Claiming the basis is destroyed by the gas (Contradicts prompt).
  *   Arguing the 'no interference' clause is a valid solution without addressing circularity.
  *   Remaining neutral on whether counterfactual analysis can work (Prompt requires a definite position).
