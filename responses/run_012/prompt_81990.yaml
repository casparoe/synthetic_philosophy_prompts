      *   *American Mass Incarceration:* I need to ensure I don't ignore this. The prompt sets it up as "risk categories managed rather than persons addressed." The Colony is the opposite: persons addressed intensely, risk irrelevant. So the Colony is a warning to *both* Halden (don't become zealous) and the US (don't become purely managerial/indifferent). Actually, the prompt asks to use the story to contrast denunciatory/rehabilitative. The US model is often seen as lacking justification (just warehousing). The Colony is *pure* justification without humanity. Halden is humanity with justification.
      *   *Wait, re-reading the prompt:* "using Norway's Halden prison and American mass incarceration as the two live alternatives."
      *   Okay, so the triad is: Kafka (Theological/Inscriptive) vs. Halden (Rehabilitative/Normalising) vs. USA (Managerial/Abandonment).
      *   My reading needs to show how Kafka critiques the *logic* shared by Halden and the Officer (the desire to transform), while the US model represents a different failure (the absence of the Officer's care, replaced by bureaucracy).
      *   *Correction:* The prompt asks specifically about the contrast between *denunciatory and rehabilitative* justifications. The US model is brought in as a "live alternative" where *neither* organises the institution.
      *   So: Officer = Denunciatory/Expressive (extreme). Halden = Rehabilitative. USA = Neither (Managerial).
      *   Kafka's story primarily targets the Officer's view. Does it also target Halden? Yes, via the "certainty" angle. Does it target the US model? Perhaps by showing that without a narrative (even a cruel one), punishment becomes meaningless (the machine breaks down).

  5.  **Final Polish:**
      *   Ensure the distinction between "communication" (Duff etc.) and "inscription" (Kafka) is sharp.
      *   Make sure the "uncertainty" clause is clear.
