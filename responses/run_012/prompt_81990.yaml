          *   *Strain:* Is this too pessimistic? Does it equate welfare with torture? I need to nuance this. The *degree* matters, but the *structure* of authority is similar.

      *   **Scenes to Select:**
          *   1. The Officer explaining the Harrow (Blueprints). Shows the rationality of the irrational.
          *   2. The Inscription Process (The "Enlightenment"). Shows the claim of bodily knowledge.
          *   3. The Officer's Execution. Shows the faith collapsing.
          *   4. The Grave/Prophecy. Shows the lingering myth.

  4.  **Review and Refine (Self-Correction):**
      *   *Check British English:* "Normalisation" (with s), "programme", "centre", "labour".
      *   *Check Constraints:* Did I summarise the theories? No, kept it focused on the reading. Did I admit uncertainty? Need to add a section or footnotes on textual ambiguity.
      *   *Tone Check:* Is it graduate level? Yes, avoid oversimplification.
      *   *Specific Prompt Requirement:* "Where does the Halden comparison flatter Norway, and where does it flatter Kafka?" I need to be explicit here.
          *   Flatters Norway: Implies Halden is the rational saviour, ignoring its own coercive nature.
