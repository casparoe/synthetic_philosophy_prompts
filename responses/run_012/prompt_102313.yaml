answer: |-
  Alpha and Beta, equally funded competitors, race to deploy an AI that optimizes chip architecture. Alpha succeeds first and immediately releases the software to lock in industry standards and capture market share, knowing secrecy would cede the ecosystem to Beta's incompatible prototype. Beta copies the code instantly upon release. However, the software only yields superior performance when running on custom silicon that requires 18 months to fabricate. Alpha ordered their first custom run the day the software worked, using simulated outputs to finalize specs. Beta orders their run only after copying the code. When Beta's chips arrive, Alpha's are already online, having used the first generation to design a second generation that is now 12 months into fabrication. The bottleneck is not knowledge transfer but the physical queue time for manufacturing, which the leader monopolizes by being earlier in the queue.

  **The Assumption:** The strategy-stealing assumption posits that if capabilities are non-rivalrous and observable, followers can replicate a leader's techniques instantly, nullifying any lead before it compounds into a decisive advantage.

  **The Verdict:** SSA predicts Beta equalizes Alpha's performance shortly after the software release, preventing a singleton outcome.

  **The Dynamics:** The real dynamic hinges on *embedded capacity*. Alpha's lead isn't just the code; it's the *instantiated* hardware running the code. Copying the blueprint doesn't grant the factory slot. Alpha uses Generation 1 to build Generation 2 while Beta is still building Generation 1.

  **The Variable:** The ratio of Deployment Latency ($T_{lag}$) to Improvement Cycle Time ($T_{cycle}$).

  **The Threshold:** If $T_{lag} > T_{cycle}$, the leader completes multiple improvement loops before the follower finishes one deployment, causing the gap to widen (SSA fails). If $T_{lag} < T_{cycle}$, the follower catches up before the next generation comes online (SSA holds).

  **The Honest Part:**
  A defender would argue Alpha wouldn't release the software; profit motives favor secrecy until dominance is secure. This reply costs them because it concedes that information barriers are high, undermining the "open science" premise often used to argue for slow, multipolar takeoff. It shifts the bottleneck from "copying is hard" to "secrecy is easy," which still supports singleton outcomes. Alternatively, they might argue Beta could simply buy Alpha's chips. However, if the hardware is tailored to Alpha's proprietary data centers, resale is useless, reinforcing the lock-in. I would be cheating if I assumed Alpha had pre-existing preferential access to fabrication plants. The scenario must stipulate equal access to foundries, where the only asymmetry is the *timing* of the order placed, driven solely by the initial capability lead. If I secretly gave Alpha a reserved queue slot independent of their technical win, the case collapses into a resource advantage argument rather than a capability takeoff argument.
