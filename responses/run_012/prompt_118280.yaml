answer: |-
  You have carved out a precise and genuinely under-named epistemic niche. You are right to reject Polanyi and Ryle; their frameworks do not capture the specific pathology you are describing. Polanyi claims the knowledge *cannot* be articulated; you claim it *can*, but the articulation lacks power. Ryle claims skill is not propositional; you claim the propositions are *true*, just operationally impotent.

  The phenomenon you are describing is best named **The Generativity Gap**. The accounts themselves possess the property of **Veridical Inertness**.

  Here is the carving of the concept, its distinction from its nearest neighbors, and the analysis of your edge case regarding mathematical proofs.

  ### 1. The Phenomenon: The Generativity Gap
  **Definition:** The structural disconnect between a *descriptively accurate* account of the cues governing a skilled performance and the *procedural capacity* to use those cues to generate the performance.

  **The Mechanism:**
  The gap exists because skilled performance is a **dynamic control system**, while your account is a **static variable list**.
  When you cook, you are not checking a list of conditions ($A + B + C = \text{Done}$). You are managing a continuous, non-linear feedback loop where the *weighting* of the variables changes moment-to-moment.
  *   **The Account:** Lists the variables (sizzle pitch, smell, juice clarity).
  *   **The Skill:** Is the function $f(x,y,z)$ that integrates those variables over time $t$.

  Your description is *veridical* (it correctly identifies the inputs) but *inert* (it does not contain the integration function). When a novice follows the list, they treat the variables as independent switches. When you cook, you treat them as a converging trajectory. The friend checks the smell at the "wrong instant" because they treat "nutty" as a state, whereas for you, "nutty" is a *rate of change* relative to the sizzle.

  ### 2. Distinguishing the Carving
  You asked for strict boundaries against the nearest philosophical neighbors. Here is how **Veridical Inertness** differs from them:

  **A. Vs. Polanyi's Tacit Knowledge**
  *   **Polanyi:** "We know more than we can tell." The knowledge is *ineffable*.
  *   **Your Case:** "I can tell exactly what I know, but telling it doesn't transfer the skill." The knowledge is *effable but non-executable*.
  *   **The Edge:** If you cannot say it, it's Tacit. If you can say it truly, but the saying doesn't work, it's Veridically Inert.

  **B. Vs. Dreyfus's "Outgrowing Rules"**
  *   **Dreyfus:** Experts no longer use rules/features; they respond to the whole situation holistically. Rules are crutches for beginners.
  *   **Your Case:** You *are* using features (sizzle, smell). You haven't outgrown them; you have integrated them. The problem is not that rules are absent, but that the *textual formulation* of the rule strips away the temporal weighting required to apply it.
  *   **The Edge:** Dreyfus says the rule is *false* for the expert (they don't use it). You say the rule is *true* but *insufficient* (they do use it, but the text doesn't capture the usage).

  **C. Vs. Paralysis by Analysis**
  *   **Paralysis:** A psychological interference. The knowledge is there, the instructions work, but anxiety or over-thinking disrupts the motor execution.
  *   **Your Case:** A structural insufficiency. Even a calm, deliberate attempt to follow the instructions fails because the instructions lack the necessary resolution. It is not that the mind interferes; it is that the map lacks the terrain's friction.
  *   **The Edge:** If practice makes the instructions work, it was Paralysis. If practice makes the instructions *irrelevant* (you go back to intuition), it is the Generativity Gap.

  **D. Vs. Fit vs. Generate (Goodhart's Law / Data Modeling)**
  *   **Fit:** A model that explains past data.
  *   **Generate:** A model that predicts future data.
  *   **Your Case:** This is the closest cousin. Your account is a model that *fits* your performance perfectly (retrospective) but fails to *generate* the performance (prospective).
  *   **The Edge:** In data science, this is usually due to overfitting. In your case, it is due to **missing indexicality**. The account lacks the "you are here" of the embodied agent. It describes the *signals* but not the *receiver's calibration*.

  ### 3. The Edge Case: Mathematical Proofs
  You ask: *Is a written proof the same kind of thing?*

  **Verdict:** It is a **cousin**, not a twin. It shares the structure of the gap but differs in the consequence.

  **The Similarity (Context of Discovery vs. Justification):**
  Hans Reichenbach distinguished between the *Context of Discovery* (how the result was found) and the *Context of Justification* (the proof that it is true). A proof is a Veridically Inert account of the *discovery*. It accurately describes why the result holds, but following it does not reproduce the *insight* that led to it.

  **The Difference (Outcome Degradation):**
  *   **In Cooking/Arguing:** Following the inert account produces a **degraded outcome** (dead meat, lost argument). The skill is constitutive of the quality.
  *   **In Math:** Following the proof produces a **perfect outcome** (verified truth). The "skill" (insight) is heuristic, not constitutive.

  Therefore, the mathematical proof is a case of **Heuristic Loss**, whereas your cooking example is a case of **Control Loss**.
  *   **Proof:** The map is sufficient to verify the territory, but not to find it.
  *   **Cooking:** The map is insufficient to navigate the territory *because the navigation changes the territory* (the meat continues cooking while you smell it).

  ### 4. Why the Account Fails (The "Missing Variable")
  To close the Generativity Gap, one would need to add a specific type of information to the account that natural language struggles to encode: **Calibration Data.**

  Your instruction "the pitch of the sizzle drops" assumes a shared calibration of "pitch" and "drops."
  *   **Novice:** Hears absolute pitch.
  *   **Expert:** Hears relative delta (change over time).
  *   **Novice:** Smells "nutty" as a category.
  *   **Expert:** Smells "nutty" as a threshold crossing in a specific temporal window.

  The account is Veridically Inert because it describes **Features** without describing **Feature-Weighting** or **Temporal Integration**. It is a list of ingredients without the recipe's timing or heat settings.

  ### Summary
  *   **Phenomenon:** The Generativity Gap.
  *   **Property of the Account:** Veridical Inertness.
  *   **Core Distinction:** It is not that the knowledge is tacit (Polanyi) or non-propositional (Ryle); it is that the propositions are *static descriptions of dynamic processes*.
  *   **Mathematical Proof:** A cousin (Justification without Discovery), but distinct because the inert account still yields a valid truth, whereas the inert cooking account yields a failed meal.

  You have identified the limit of **Propositional Fidelity**. You can faithfully propose the *conditions* of a skill without possessing the *operator* that acts on those conditions. The name for this is that the account is **Descriptively Sufficient but Operationally Deficient**.
