prompt: |-
  Ok so my reading group keeps having the same fight about whether violence is actually going down, and I want to figure out what kind of disagreement it even is. One side points at long-run homicide rates and war deaths per capita and says the trend is obviously downward; the other side points at absolute body counts (there are just way more of us now, and more wars), at the twentieth century, and then asks the annoying question of what counts at all — do we count deaths from sanctions, from preventable disease, from climate, from poverty? Someone always says "it depends what you mean by violence" and we all go home. A friend of mine proposed a weird operationalization I can't stop thinking about: count it as violence only when an agent could have prevented the death at little cost to themselves, so famine policy counts but a random earthquake doesn't. I have a hunch this whole thing isn't really an empirical dispute — that it's two groups answering different questions under one word (one about deliberate physical harm by an identifiable agent, one about moralised harm generally), plus a side fight about whether a rate or a raw count is the right thing to look at, plus maybe a hidden assumption that "violence" names a natural kind with one true number, which might just be false. Is my hunch right, or is there a real factual or measurement dispute doing the work? Diagnose the disagreement using what each side actually argues, say whether it's verbal, substantive, two questions under one name, or bedrock values, and tell me what would actually count as progress here — a distinction, a formalization, a dataset. Don't just survey the literature. Last line should start "Diagnosis:" with a short label and then a one-sentence summary of the verdict.
