answer: |-
  Hi there, since you are reading this on the train I will keep the preamble short and get straight into the prep you asked for regarding the seminar. I have ordered these by the amount of damage they can do to your thesis, starting with the one you are hoping nobody asks because it threatens the textual coherence of your entire project, then moving through the philosophical and historical challenges, and ending with the policy question which is less damaging but likely to come up simply because someone always asks it.

  The objection you are dreading most will likely come from the historian who notices the gap between your two main texts. They will say that you are constructing a unified late view out of a 1930 popular essay and a 1938 private memoir read to a closed club, and ask why we should treat these as a single coherent philosophical position rather than ad hoc remarks separated by the General Theory. They will press you on whether Keynes was actually doing ethics in 1938 or just rationalizing his own aging, and suggest that the instability you identify is just you imposing systemacy on a man who was explicitly anti-systematic in his later years. Your reply is that Keynes himself links them through the concept of the economic problem being solved, which appears in both texts as the hinge between the current misery and the future good life, so the textual gap is bridged by his own thematic continuity rather than your imposition. The soft spot here is that you are relying on a thematic link to do heavy philosophical lifting, and if they push on the lack of explicit cross-reference in Keynes's own writing, you have to concede that the unity is reconstructive rather than exegetical.

  Next you will face the Moore expert who thinks Keynes misread Principia Ethica. They will argue that Moore's method of isolation was never meant to separate means and ends into chronological stages but was a logical tool for identifying intrinsic value, and that Keynes's two-stage view violates the organic unity principle because you cannot isolate the economic stage from the moral stage without changing the value of the whole. They will say that if acquisitiveness is a vice in the final state, it contaminates the earlier stage even if instrumental, because Moorean value is not time-relative. Your reply is that Keynes is not doing Moorean ethics but adapting them for history, so he is intentionally temporalizing Moore's logical distinctions to solve the problem of transition, which Moore never addressed. The soft spot is that this admits Keynes is departing from Moore, which weakens your claim that this is Moore's ideal minus the moralizing, and forces you into the position that Keynes is simply inconsistent rather than developing a hybrid view.

  The Bloomsbury historian will not attack the philosophy but the genre, asking why you are treating a memoir read aloud to friends as a public doctrine when Keynes carefully distinguished between his private intimacies and his public economic advocacy. They will say that the Memoir Club was a space for irony and self-presentation, not rigorous argument, and that you are mistaking performance for theory. Your reply is that the content of the memoir aligns too closely with the Economic Possibilities essay to be dismissed as mere performance, and that the private setting actually allows for the ethical honesty that the public doctrine obscures, making it the truer statement of his view. The soft spot is that you have to prove the alignment is substantive rather than stylistic, and if they produce counter-evidence of Keynes joking about these topics in other private letters, your evidentiary base shrinks significantly.

  Then the first-year grad student will ask the naive question that cuts deep, wanting to know if Keynes was a hedonist or a perfectionist because your description of states of mind sounds like hedonism but your appeal to virtues sounds like perfectionism. They will ask how you can measure the good life if you cannot categorize the ethical framework. Your reply is that Keynes is intentionally straddling the two to solve the transition problem, using hedonistic ends to motivate the perfectionist means, which is exactly why the hybrid is unstable. The soft spot is that this sounds like you are defining instability as a feature rather than a bug, and if they press you to pick one for the sake of clarity, you risk collapsing the nuance of your two-stage argument.

  Finally the welfare economist will ask what any of this buys you for measuring well-being or for policy, wondering if there is an operational takeaway beyond historical exegesis. They will want to know if the carry-over problem suggests a specific intervention or if it is just a description of psychological friction. Your reply is that it suggests policy should focus on cultural education during the transition phase rather than just income maximization, because the dispositions need to be managed before the economic problem is solved. The soft spot is that this is vague and lacks a metric, so if they ask for a specific policy proposal derived from the 1938 memoir, you will struggle to give one that doesn't sound like paternalism.

  I hope this helps you prepare for the rough spots and lets you navigate the seminar with confidence. Good luck with the paper.
