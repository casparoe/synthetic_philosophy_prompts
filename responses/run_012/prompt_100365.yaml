          *   *The "Priceless" Compatibility:* Can you believe life is priceless and do CBA? Yes, if you treat VSL as a *threshold* for resource allocation, not an ontological claim about human worth. It's about "how much are we willing to pay to reduce risk," not "what is a human worth."
