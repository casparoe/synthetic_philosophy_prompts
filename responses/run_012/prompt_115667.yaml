      *   *Position D: The Consequentialist*
          *   View: Does it cause harm? If the user thinks "sell" means "exchange for value" and the company means "cash only," harm occurs regardless of semantics.
      *   *Which holds up?* Literalism fails in human contexts. Intentionalism/Trust views are stronger.
      *   *Team Lead's Bet:* He's betting on Literalism (Position A).

  4.  **The Definition Wrinkle (The Semantic Layer):**
      *   *Issue:* "Sell" is ambiguous.
      *   *Legal/Contractual:* Definitions sections control. If "Sell" is defined as "exchange for cash," then barter isn't selling.
      *   *Ordinary Meaning:* To a normal human, "selling data" includes trading it for services/value.
      *   *The "Gotcha":* Relying on a technical definition that contradicts ordinary understanding is a form of misleading (Clause 2 violation).
      *   *Does it change anything?* Yes. It shifts the burden. If you use a technical definition, you must disclose it. Hiding the definition makes the literal truth a trap.

