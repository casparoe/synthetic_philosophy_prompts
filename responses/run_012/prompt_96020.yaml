      *   *Commensurability:* There is one scale (cardinal). This is crucial. It's not incommensurable values (like liberty vs. security). It's all "hedons" or "pain units."
      *   *Aggregation:* Below the line, utilitarianism works (summing up).
      *   *Lexical Threshold:* Once you cross the line (supra-threshold suffering), the math breaks. $1 \times \text{Supra} > \infty \times \text{Sub}$.
      *   *Negative Utilitarian Lean:* The prompt emphasizes suffering outweighing enjoyment/misery. The stipulation says "no finite mass of sub-threshold misery can outweigh a single instance of supra-threshold misery." It implies supra-suffering trumps sub-suffering and sub-enjoyment.

