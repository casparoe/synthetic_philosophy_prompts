          *   *Why discard the "Specks" case?* It relies on intuition about "dust specks" which people dismiss as trivial. A "minor annoyance" (like traffic noise) is real but sub-threshold. It feels more engineered.
          *   *Decision:* **The Algorithmic Allocation Case.** (Fits STV seminar).
