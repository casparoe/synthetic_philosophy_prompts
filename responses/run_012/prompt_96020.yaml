      *   *Correction on Final Question:* The stipulation says "any suffering above... is lexically prior to any quantity of suffering or enjoyment below." It implies Supra > Sub. It says aggregation governs "on each side." So Supra vs Supra is aggregative. Sub vs Sub is aggregative.
