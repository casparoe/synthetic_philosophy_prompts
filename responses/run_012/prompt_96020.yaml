answer: |-
  **Session Plan: Lexical Thresholds and Hedonic Scales**
  **Duration:** 90 Minutes
  **Audience:** Quantitative Graduates (Engineering/Science), No Ethics Background

  ### I. Sequence of Components and Dependencies

  Do not begin with the threshold. Begin with the scale. The logical dependency is strict: you cannot locate a break in a ruler if you have not first agreed that a ruler exists.

  1.  **Cardinal Commensurability (Minutes 0–20):**
      *   **Task:** Establish the premise that suffering and enjoyment are quantities on a single linear scale.
      *   **Dependency:** This must be settled *before* the threshold is introduced. If the students believe pain and pleasure are incommensurable (different categories entirely), the threshold becomes a category error rather than a magnitude limit.
      *   **Requirement:** They must accept that "more" and "less" apply across the board. For this audience, frame this not as a metaphysical claim about qualia, but as a modeling assumption required for aggregation. Without this, "summing" is impossible.

  2.  **Standard Aggregation (Minutes 20–35):**
      *   **Task:** Establish the baseline operating system. Below the critical level, the view is standard utilitarianism. $Sum(A) > Sum(B)$.
      *   **Dependency:** You must demonstrate the "normal" math before you break it. The lexical rule is defined by its *deviation* from this norm.
      *   **Requirement:** Ensure they accept that, ordinarily, many small harms can outweigh one large harm (e.g., 1,000 headaches > 1 migraine).

  3.  **The Critical Level (Minutes 35–50):**
      *   **Task:** Introduce the threshold as a specific magnitude on the cardinal scale established in Step 1.
      *   **Dependency:** This relies on Step 1. The threshold is a coordinate on the scale, not a qualitative shift in kind.
      *   **Requirement:** Distinguish this from a "tipping point" in systems dynamics. It is a normative boundary, not an emergent property.

  4.  **Lexical Priority (Minutes 50–70):**
      *   **Task:** Define the operation across the boundary. One unit above the line $> \infty$ units below the line.
      *   **Dependency:** This relies on Step 2. It is only "lexical" because it overrides the aggregation rule established in Step 2.
      *   **Requirement:** This is where the view is fully assembled.

  ### II. The Single Example

  **Discard:** The "Torture vs. Dust Specks" case (Parfit).
  **Reason:** It conflates intensity with population ethics. Engineers will dismiss "barely noticeable irritations" as measurement noise or trivialities, allowing them to reject the premise of commensurability without engaging the logic. It also triggers a visceral "Repugnant Conclusion" reflex that shuts down analysis.

  **Adopt:** **The Structural Safety Margin.**
  **Scenario:** A civil engineering firm must choose between two design protocols for a public transit system.
  *   **Protocol A:** Guarantees that 10,000 daily commuters will experience chronic, mild vestibular disorientation (Sub-threshold). It is recoverable, does not prevent work, but reduces quality of life.
  *   **Protocol B:** Eliminates the disorientation for the 10,000, but introduces a deterministic risk that one maintenance worker will suffer permanent, crushing nerve damage (Supra-threshold).

  **Scaling:**
  1.  **Scale the Sub-threshold:** Increase the commuters from 10,000 to 10 million.
  2.  **Scale the Weight:** Ask if the disorientation is "heavy" (e.g., daily migraines) but still defined as Sub-threshold.

  **Why this works:**
  *   **Distinguishes Lexical vs. Heavy Weighting:** Under a "heavy weighting" model, 10 million commuters eventually outweigh the one worker. Under the "lexical" stipulation, the one worker *always* trumps the commuters, regardless of the number.
  *   **Holds in Mind:** It is a static trade-off. No need to track complex causal chains.
  *   **Fits Audience:** It frames the ethical problem as a constraint satisfaction problem, which appeals to their training.

  ### III. Misconceptions and Interventions

  1.  **"Threshold = High Weight"**
      *   **The Error:** Students will model the threshold as a multiplier (e.g., Supra pain is $1,000,000\times$ worse than Sub pain).
      *   **The Fix:** **Minute 55.** Immediately after introducing Lexical Priority. Write the inequality on the board.
          *   Weighted: $1 \times \text{Supra} < N \times \text{Sub}$ (where $N$ is sufficiently large).
          *   Lexical: $1 \times \text{Supra} > N \times \text{Sub}$ (for all finite $N$).
      *   **Instruction:** Explicitly state: "This is not a slope; it is a cliff. No amount of accumulation below the line crosses it."

  2.  **"Cardinality = Thermometry"**
      *   **The Error:** As scientists, they will assume "cardinal scale" implies we possess an instrument to measure pain units with precision.
      *   **The Fix:** **Minute 10.** When establishing Commensurability.
      *   **Instruction:** State: "We are positing a normative scale, not an empirical instrument. We are assuming the *logic* of measurement applies, not that we have the calipers. Do not confuse the model with the metrology."

  3.  **"Denial of Common Currency"**
      *   **The Error:** They will conclude that because the aggregation breaks, the units must be different (incommensurable).
      *   **The Fix:** **Minute 40.** When defining the Critical Level.
      *   **Instruction:** Emphasize the stipulation: "One cardinal scale." The currency is the same (hedonic magnitude), but the exchange rate is fixed at infinity at the boundary. It is a currency with a denomination cap, not two different currencies.

  4.  **"The Line-Drawing Fallacy"**
      *   **The Error:** "You cannot specify exactly where the threshold lies; therefore the threshold is meaningless."
      *   **The Fix:** **Minute 80.** During the Q&A preparation.
      *   **Instruction:** Acknowledge the Sorites problem but bracket it. "We are analyzing the *structure* of the view, not the *calibration*. Whether the line is at 500 units or 501 does not change the lexical logic. Do not let the precision of the line obscure the existence of the break."

  ### IV. The Diagnostic Final Question

  Do not ask if they agree with the view. Ask a question that requires them to apply the "each side" clause of your stipulation (*"ordinary aggregation governs comparisons on each side of a critical level"*).

  **The Question:**
  "We have established that one Supra-threshold injury outweighs any number of Sub-threshold injuries. Now, consider a choice between **one person suffering 10 hours of Supra-threshold pain** versus **ten people suffering 1 hour of Supra-threshold pain**. Does the lexical threshold dictate a verdict here, or does standard aggregation return?"

  **The Diagnostic:**
  *   **Recoil/Non-Understanding:** "The one person is protected by the threshold; you cannot sacrifice them." (They treat 'lexical' as a shield for the individual against *all* aggregation).
  *   **Understanding:** "Aggregation returns. Both outcomes are above the threshold, so we sum them. Ten hours is worse than one hour. We choose the one person." (They recognize the lexical rule only applies *across* the boundary, not *within* the supra region).

  ### V. Refusals

  You must explicitly close off two lines of inquiry to survive the 90 minutes.

  1.  **Refuse the Metrology Question:**
      *   **The Query:** "How do we measure the threshold in practice? What are the units?"
      *   **The Refusal:** "That is a question for empirical psychology and neuroscience. This session is on the normative structure. We are testing the logic of the engine, not building the chassis. To ask for units now is to confuse the map with the territory."

  2.  **Refuse the Positive Symmetry Question:**
      *   **The Query:** "Does supra-threshold *joy* trump sub-threshold joy?"
      *   **The Refusal:** "The stipulation provided is asymmetrical (Negative Utilitarian lean). It specifies suffering's priority. Extending this to positive goods creates a different theory. We will not solve the symmetry problem today; we must fully understand the asymmetry first."

  **Closing Instruction:** If a student presses on the "Line-Drawing" fallacy, refer them back to the Diagnostic Question. Tell them: "If you can answer the Supra-vs-Supra aggregation question correctly, you have earned the right to critique the line's location. Until then, assume the line exists."
