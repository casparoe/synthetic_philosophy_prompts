      *   *Let's make it diagnostic:* "Does this theory forbid trading *two* supra-threshold events to prevent *one* supra-threshold event?" (Tests if aggregation works *above* the line).
      *   *Stipulation check:* "ordinary aggregation governs comparisons on each side of a critical level."
      *   *So:* Aggregation works *below*. Aggregation works *above*? The stipulation says "any suffering above... is lexically prior to any quantity... below." It doesn't explicitly say how to compare Supra vs. Supra. But it implies "ordinary aggregation governs... on each side."
