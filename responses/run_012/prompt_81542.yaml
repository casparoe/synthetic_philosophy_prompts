answer: |-
  It is entirely understandable that these two doctrines get conflated, especially since they share a striking structural similarity: both involve a situation where our data runs out before our assertions do. In both cases, you have two competing frameworks that are perfectly compatible with everything you can observe, yet they seem to say different things. However, the philosophical work they are doing is profoundly different, and Quine himself was quite insistent that we not mix them up. To untangle this, we need to look closely at what is being claimed about reality and knowledge in each case. The distinction turns on the difference between an epistemic limitation and an ontological claim. Underdetermination of theory by evidence is primarily an epistemological thesis. It tells us something about the relationship between our evidence and our theories, specifically that the evidence is insufficient to logically compel us to accept one theory over another. Crucially, underdetermination leaves open the possibility that one theory is true and the other is false. It suggests that the world is a certain way, and while our current observations cannot tell us which description matches that way, there is still a fact of the matter waiting to be discovered, perhaps by new experiments or new kinds of evidence. It is a claim about the limits of justification, not the limits of truth.

  Indeterminacy of translation, by contrast, is a much stronger and more controversial claim that targets the nature of meaning itself. When Quine argues that translation is indeterminate, he is not merely saying we cannot know which translation manual is correct. He is arguing that there is no fact of the matter to be known. In the famous gavagai example, the issue is not that we lack enough evidence to decide whether the native means rabbit or undetached rabbit part. Quine's point is that meaning is not a hidden mental object or a fixed property of the world that exists independently of behavior. If two translation manuals account for all possible behavioral dispositions of the speaker, then there is no further reality against which to judge one as right and the other as wrong. They are both correct, relative to the manual chosen. This is not an admission of ignorance; it is a denial that there is a unique truth to be found. So, while underdetermination says we cannot tell which theory is true, indeterminacy says that in the realm of meaning and translation, the notion of a single true theory is misguided. One is a gap in our knowledge, and the other is a gap in the world, or at least in the ontology of semantics.

  Now, let us bring this back to your concrete situation with the legacy binary protocol, because this is where the rubber meets the road and where your intuition as an engineer might clash with a strict philosophical reading. You have two decoding schemes that predict every observable byte identically but disagree on what the fields mean. On the surface, this looks exactly like indeterminacy. You have two manuals for translating the binary stream into human-readable data, both fit all the behavioral evidence, and they assign different meanings. A strict Quinean behaviorist might look at this and say that you are facing indeterminacy. If you define the meaning of the protocol strictly by its input-output behavior, then there is no fact of the matter about whether a specific byte sequence represents a user ID or a session token, provided the system behaves the same way in both interpretations. The meaning just is the use, and since the use is identical, the difference in your decoding schemes is merely a difference in notation, not a difference in truth.

  However, most software engineers, and indeed most realists about artifacts, would rightly resist calling this indeterminacy. The reason lies in the causal history of the system. Unlike the native speaker in Quine's thought experiment, whose internal mental states are treated by Quine as inaccessible and perhaps non-existent for the purposes of radical translation, your legacy system was built by a human designer with specific intentions. There was a moment in time when a developer wrote the code that generates this binary stream, and at that moment, they made a decision about what that bit field represented. That decision is a physical fact about the history of the world, encoded in the causal lineage of the software, even if the source code is lost and the developer is unavailable. Therefore, one of your decoding schemes aligns with the historical intent and the actual causal structure of the program, and the other does not. This means there is a fact of the matter. You simply lack the evidence to access it. This makes your situation a classic case of underdetermination of theory by evidence. You have two theories about the protocol's structure, the evidence you can currently gather cannot distinguish them, but one theory is likely true and the other false in virtue of the system's history.

  The distinction becomes sharper when we ask what course of action each concept recommends. If your situation were truly one of indeterminacy, it would be futile to search for the real meaning, because there isn't one. You would be free to adopt whichever decoding scheme is more convenient or pragmatically useful, secure in the knowledge that you are not missing out on the truth. But because your situation is actually one of underdetermination, it remains a legitimate scientific and engineering goal to try to break the tie. You might look for side-channel information, documentation fragments, or context clues that could serve as new evidence to distinguish the two schemes. You are operating under the assumption that the protocol has a true structure that you are trying to discover, not just a behavioral pattern you are trying to model. This is why the distinction matters practically. Underdetermination invites further investigation or a pragmatic choice while acknowledging a hidden truth. Indeterminacy dissolves the question of truth entirely and asks you to accept multiple valid frameworks without seeking a single underlying reality.

  It is worth noting, however, that there is legitimate disagreement among interpreters of Quine on how strictly to apply this to artifacts. Some philosophers argue that once the original designer is gone and the causal chain is opaque, the artifact effectively becomes a black box indistinguishable from a natural object, and thus the Quinean argument for indeterminacy might slide back in. They would argue that if the intent can never be verified even in principle, positing a fact of the matter is metaphysical excess. But the standard view in the philosophy of science, and the one that aligns best with engineering practice, maintains that historical facts exist independently of our access to them. Quine himself distinguished between the underdetermination of physics and the indeterminacy of translation precisely because he thought physics was trying to describe a real world, whereas translation was about matching dispositions. In your case, you are doing reverse engineering, which is a historical science akin to geology or archaeology. You are trying to reconstruct a past event—the writing of the code. Therefore, the competing decoding schemes are competing hypotheses about a past reality, not just competing manuals for future prediction.

  So, to summarize the divergence without smoothing over the complexity: underdetermination preserves realism but denies certainty, while indeterminacy challenges realism about meaning itself. In your protocol example, unless you adopt a radical stance that the code's history is irrelevant to its meaning, you are dealing with underdetermination. You are in a position of epistemic limitation, not ontological ambiguity. The two ideas come apart at the point where we ask whether the disagreement between the schemes could be settled by a god's-eye view of the history of the system. If the answer is yes, it is underdetermination. If the answer is no, because even a god's-eye view would find no unique meaning to settle on, it is indeterminacy. Given that you are dealing with a human-made system, the former is the robust interpretation, and keeping that distinction clear prevents you from giving up on the search for the true structure too easily, while also reminding you that without new evidence, your choice between the two schemes remains theoretically unjustified.
