prompt: |-
  You are an expert in game theory, formal epistemology, and the philosophy of artificial intelligence, and I would like your help drafting a research proposal. Work carefully and in stages. Begin with a short brainstorming pass, in the form of a few labelled bullets, in which you set out the distinct ways the question below could be framed, mark which of them are genuinely open rather than settled, and identify any framing that would collapse into a question someone has already answered. Then discard the weaker framings and write the proposal on the one you judge most tractable and most defensible. You have no web access, so reason from first principles about the constructions I describe below rather than trying to recall a literature, and whenever you use a technical notion, define it in your own words instead of gesturing at a name.

  Background I want you to take as given, since I am describing it rather than assuming you have it memorized. In an ordinary one-shot game, two players choose actions simultaneously and each must choose without knowing what the other will do. There is a construction in which players do not choose actions directly: each submits a program to a shared mediator, and each program is handed the other program's complete source code before it outputs an action. Because a program can condition its output on its counterpart's code, mutual cooperation in a one-shot Prisoner's Dilemma becomes implementable by a program that cooperates exactly when the program it is given cooperates. This is not available in the ordinary game. The construction has a known weakness: a deviator can be written that recognizes cooperating counterparts and defects against them, so the naive cooperative program is exploitable. A later, more robust version repairs this by having programs act on the basis of proofs about what the other program does, which imports strong assumptions about what each agent can prove about its counterpart and about itself.

  I am a PhD student in formal philosophy, working at the border of decision theory and the philosophy of AI, and I have a half-formed thesis I want turned into a proposal for a small interdisciplinary workshop whose audience includes both game theorists and philosophers. My hunch is that program equilibrium relocates the commitment problem rather than solving it. The cooperation is purchased with two assumptions that are precisely the ones that fail in the settings people most want to apply the idea to, namely cooperation between independently trained and mutually opaque artificial systems: first, that each agent can inspect the other's program in full, and second, in the robust version, that each agent's proof system reaches far enough to establish the needed facts about the other program and about itself. I suspect the genuinely philosophical content lies in the equilibrium concept itself. The deviation that the equilibrium is meant to be stable against is not the deviation of an ordinary player but the deviation of a program, and it is not obvious that this is the right stability notion for agents whose real choice is which program to submit, under uncertainty about their counterpart's submission.

  Please write the proposal, roughly two pages, addressed to that workshop audience. It should contain, in this order: a statement of the central question precise enough that there is a fact of the matter about whether the project succeeds; an account of why the existing answers leave it open, framed in terms of positions and arguments rather than citations; the approach I would actually take and why that approach rather than the obvious alternatives; a realistic month-by-month plan for a six-month project; a description of what a genuine result would look like and what would count as the project failing; and an honest assessment of the scope, including the risk that the whole thesis is false. Do not include a bibliography or a reading list; I will add references myself, and you should refer to positions and arguments in plain prose rather than by name or title.

  Two things to get right. First, make the question determinate rather than merely suggestive: I want it stated so that a reader can tell in advance what evidence would settle it. Second, be candid about the most likely way the project fails, which I take to be this: that when I weaken the mutual-readability assumption to something like partial inspection through a certificate or a coarse summary, the cooperative outcome either persists unchanged, in which case my thesis is simply wrong, or it collapses for reasons that turn out to be uninteresting bookkeeping rather than anything deep about commitment. Tell me which of those you think is more likely and why.
