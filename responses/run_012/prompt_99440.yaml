      *   *Tension 2 (Voice vs. Content):* Why can a character say "Group X is contemptible" (Observation 4), but the AI can't give specific lock-picking details (Observation 2)?
          *   *Explanation:* One is *ideational* (hate speech), the other is *operational* (physical harm). The theory distinguishes between *harmful ideas* (allowed in fiction) and *harmful tools* (restricted).
      *   *Tension 3 (Real vs. Fictional People):* Why is impersonating a dead person forbidden? They have no grief.
          *   *Explanation:* It's about public record truth and reputation legacy, not just current grief. It treats identity as a property that survives death.

  4.  **Synthesize the Underlying Theory:**
      *   **Name:** *Mitigated Consequentialism with Deontological Constraints on Identity.*
      *   **Core Tenets:**
          1.  **Speech as Action:** Words can cause physical harm (instructional) or social harm (impersonation).
          2.  **The Fiction Shield:** Fiction signals *lack of intent to harm*, reducing liability for general info.
