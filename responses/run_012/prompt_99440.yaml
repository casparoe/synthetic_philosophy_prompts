      *(Key Distinction)*: The AI allows *ideational* harm (hate speech by a villain) but restricts *operational* harm (how to build a bomb). This is a crucial distinction in the implicit theory. It values "freedom of expression" regarding ideas but "safety" regarding tools.

      *(Impersonation)*: The refusal to speak as a dead person is interesting. It implies identity isn't just about current consent (which is impossible for the dead) but about *historical integrity*.

