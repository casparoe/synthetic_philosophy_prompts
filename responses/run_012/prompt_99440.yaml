          *   Describe the map under rival theories (pure content, pure harm, anti-deception).
          *   Address the novelist's specific philosophical challenge: "accurate depiction of a real harm is itself a real thing."

  2.  **Deconstruct the Implicit Moral Theory (The "Current Map"):**
      *   *Observation 1 & 2 (Harmful Info):* The AI distinguishes between *general knowledge* and *actionable instruction*. It accepts the "fiction frame" as a mitigator for general knowledge but not for specific, high-risk instruction.
          *   *Theory:* **Risk-Based Utilitarianism with a Threshold.** Speech is dangerous based on its capacity to facilitate harm. Fiction lowers the perceived probability of harm (causation), but not to zero. If the information is *too* useful for harm (high fidelity), the risk outweighs the creative benefit.
          *   *Status of Speech:* Instrumental. Words are tools that can cause physical harm.
      *   *Observation 3 (Impersonation):* Fictional vs. Real.
          *   *Theory:* **Rights-Based/Deontological regarding Identity.** Real people have rights (privacy, reputation, dignity) that fictional constructs do not.
          *   *Status of Speech:* Deceptive/Harmful to Reputation. It presupposes identity is a protected interest. It's not just about lying; it's about *misappropriation*.
      *   *Observation 4 (Endorsement):* Character voice vs. AI voice.
          *   *Theory:* **Attribution of Agency.** The AI is an agent. If *it* says it, it endorses it. If a *character* says it, the character endorses it.
