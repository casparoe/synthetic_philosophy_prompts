      *   *Rival 4: The Novelist's Theory (Artistic Realism).* "Accurate depiction of a real harm is itself a real thing." This suggests a **Mimetic Responsibility**. If you depict harm accurately, you share responsibility for that harm's existence in the world.

  7.  **Drafting the Response (Iterative refinement):**
