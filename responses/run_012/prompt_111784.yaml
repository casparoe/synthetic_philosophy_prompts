answer: |-
  Bottom line: The core mechanic is a strictly increasing EV bet staircase that forces a choice between accepting absurd fanaticism or admitting a probability/payoff threshold that a mechanical "Demon" exploit proves is inconsistent with EV maximization.

  ### Materials & Setup
  *   **Currency:** "Utility Tokens" (UT). Use poker chips or printed slips. No real money.
  *   **Resolution:** **Do not resolve the bets physically.** The lesson is in the choice consistency, not the outcome. Resolving low-probability bets guarantees losses, triggering hindsight bias ("they were idiots"). Instead, announce at the start: "Your goal is to finish the session with a consistent policy. Tokens track your choices, not your luck."
  *   **The Deck:** A slide deck or handout showing the Bet Menu (see below).
  *   **Demon Cards:** One per pair of students (see below).
  *   **Seating:** Pairs (7 pairs total). One student is "Agent," one is "Demon." They swap roles halfway through the Demon phase if time permits, or just run one round.

  ### The Bet Menu (The Staircase)
  Project these one by one. Students must write down "Accept" or "Reject" for each before seeing the next. All bets are "Pay X UT if Win, 0 if Lose."

  | Bet | Probability | Payoff (UT) | Expected Value (UT) | Intuition Target |
  | :--- | :--- | :--- | :--- | :--- |
  | **B1** | 50% (1/2) | 100 | **50** | Trivial accept. |
  | **B2** | 10% (1/10) | 600 | **60** | Easy accept. |
  | **B3** | 1% (1/100) | 7,000 | **70** | Comfortable accept. |
  | **B4** | 0.1% (1/10^3) | 80,000 | **80** | Hesitant accept. |
  | **B5** | 0.0001% (1/10^6) | 100,000,000 | **100** | The "Lottery" threshold. |
  | **B6** | 1 in 1 Billion (1/10^9) | 200,000,000,000 | **200** | The "Astronomical" threshold. |
  | **B7** | 1 in 10^15 | 10^18 | **1,000** | The "Physical Impossibility" threshold. |
  | **B8** | 1 in 10^30 | 10^35 | **100,000** | The "Fanaticism" threshold. |

  *Note: Ensure scientific notation is used on screen for B6–B8 so they can mathematically verify EV is higher.*

  ### Minute-by-Minute Timeline (90 Minutes)

  **00–10: Intro & Rules**
  *   Explain tokens are abstract. Goal is consistency, not winnings.
  *   Define EV clearly. Remind them: "If you maximize EV, you must prefer B2 to B1, B3 to B2, etc."
  *   Hand out decision sheets.

  **10–30: The Staircase (B1–B4)**
  *   Reveal B1. 30 seconds to decide. Collect decisions (or show of hands). Almost all Accept.
  *   Reveal B2, B3, B4. Pause briefly between each to let them calculate EV.
  *   *Instructor Script:* "Notice each step is strictly better than the last in expected value. If you took B1, logic demands you take B2."

  **30–45: The Wall (B5–B8)**
  *   Reveal B5. Some hesitation.
  *   Reveal B6. Significant refusal begins.
  *   Reveal B7 & B8. Almost universal refusal.
  *   *Stop.* Ask a student who rejected B8 but accepted B1: "Why?"
  *   *Expected Answers:* "Probability too low," "Payoff meaningless," "Can't happen."
  *   *Trap:* Ask: "Does that reason also apply to B1?" (They will say no). "Why? Is there a specific probability where value becomes zero?" (They cannot name one without arbitrariness).

  **45–60: Policy Writing**
  *   Students must write a **Universal Policy** that explains their choices.
  *   Examples: "Accept if EV > 50," "Accept if P > 10^-9," "Accept if Payoff < 10^12."
  *   Rule: The policy must cover *any* possible bet, not just the ones on the menu.
  *   They sign it. This is their contract.

  **60–75: The Demon Phase**
  *   Students pair up. One is Agent (holds policy), one is Demon (holds Demon Card).
  *   **Demon Card Procedure:**
      1.  Ask Agent: "Which bet from the menu did you Accept with the highest EV?" (Call this $B_{ref}$).
      2.  Ask Agent: "What is your rejection rule?" (e.g., "P < 10^-9" or "Payoff > 1 trillion").
      3.  **Construct Counter-Bet ($B_{new}$):**
          *   If Rule is Probability Floor: Set $P_{new} = \text{Floor} / 10$. Set $\text{Payoff}_{new} = (2 \times EV(B_{ref})) / P_{new}$.
          *   If Rule is Payoff Cap: Set $\text{Payoff}_{new} = \text{Cap} + 1$. Set $P_{new} = (2 \times EV(B_{ref})) / \text{Payoff}_{new}$.
      4.  **The Trap:** Ask Agent: "Does $B_{new}$ have higher EV than $B_{ref}$?" (Yes, by construction). "Does your policy reject $B_{new}$?" (Yes, by construction).
      5.  **Verdict:** "You prefer a lower EV bet ($B_{ref}$) over a higher EV bet ($B_{new}$) solely due to a threshold you cannot justify without arbitrariness. You are not an EV maximizer."
  *   Swap roles if time allows.

  **75–90: Debrief & Mapping**
  *   **The Fanatic:** If you accept B8, you are a consistent EV maximizer. This is the default of standard Decision Theory (von Neumann-Morgenstern axioms + unbounded utility).
  *   **The Anti-Fanatic:** If you reject B8, you must adopt a **Probability Threshold** or **Bounded Utility**.
  *   **The Cost:**
      *   *Threshold:* The Demon showed this is irrational (money pump vulnerability). You pass up infinite/colossal EV for arbitrary safety.
      *   *Bounded Utility:* This is the legitimate exit. You admit you are not maximizing EV, but Expected *Utility* where $U(x)$ flattens.
      *   *Price of Bounded Utility:* You must accept that at some point, adding more good things (years of life, happiness) adds *zero* value. You must be willing to take a 100% chance of 100 years life over a 50% chance of $10^{100}$ years life.
  *   **Conclusion:** EV Fanaticism is not a bug; it's a feature of unbounded utility. To avoid it, you must pay the price of bounded value.

  ### Predictable Failures & Fixes
  1.  **"The Takers Look Like Idiots" (Hindsight Bias):**
      *   *Problem:* If you roll dice for B8, they lose. Students think EV maximization is stupid because it loses in practice.
      *   *Fix:* **Do not resolve the bets.** Explicitly state: "We are testing consistency, not luck." If you must resolve something for engagement, resolve only **B1** for a piece of candy. Keep the big bets hypothetical.
  2.  **"I Just Don't Believe the Probability":**
      *   *Problem:* Students argue 1 in 10^30 is impossible, so P=0.
      *   *Fix:* Stipulate epistemic closure. "For this seminar, assume a Random Number Generator has confirmed these odds. Your job is to decide given these odds, not to debate the physics."
  3.  **"Bounded Utility Saves Me":**
      *   *Problem:* Students claim this wins the game effortlessly.
      *   *Fix:* Acknowledge it in the debrief. It *does* save them from fanaticism, but the Demon phase should force them to write down the *bound*. When they see "I value 1 billion happy lives the same as 10^100 happy lives," they feel the cost.

  ### Honest Limitations
  You are correct about the first two; here is the third.

  1.  **Infinity:** You cannot reproduce true Pascal's Wager/Mugging (infinite EV) with finite numbers. Students can always say "I'd accept if the payoff were *really* infinite," keeping the fanaticism at arm's length as a "math problem" rather than a decision requirement.
  2.  **Threats (Mugging):** This game uses gains. It does not capture the coercive asymmetry of Pascal's Mugging ("Give me $5 or I simulate 3^^^3 tortured souls"). The emotional weight of preventing harm vs. gaining utility is distinct and absent here.
  3.  **Epistemic Opacity (The Third Limit):** The game stipulates probabilities. In real fanaticism cases (AI risk, existential relief, religious belief), the core difficulty is assigning $P$. Students leave thinking the hard part is *valuing* the payoff, when often the hard part is justifying credence in $10^{-30}$. The game solves the epistemology for them, which masks the real-world barrier to fanaticism.
