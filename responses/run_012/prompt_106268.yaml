answer: |-
  You are absolutely onto something. This is not a distinction without a difference; it is a structural fault line that runs through the literature on collective harm, and conflating the two leads to significant philosophical confusion (and often bad policy).

  While both are frequently lumped under the **Inefficacy Objection**, they rely on different metaphysical and epistemic claims. The literature does have names for these, but they are often scattered across different sub-fields (consequentialism, climate ethics, voting theory).

  Here is the carving you are looking for, using the most precise established terminology available, along with the boundary conditions you requested.

  ---

  ### 1. The First Shape: The Problem of Causal Indeterminacy (or Imperceptibility)

  **The Structure:**
  *   **Causal Status:** Your act *does* contribute to the causal process. It is part of a set of acts that produces the harm.
  *   **The Block:** You cannot individuate a specific unit of harm and trace it back to your specific act. The harm is a collective product, and the "shares" are not naturally divisible.
  *   **Epistemic Condition:** Often relies on uncertainty about the threshold (e.g., "I don't know if *my* flight was the one that pushed CO2 over the tipping point") or the granularity of harm (e.g., "My burger doesn't kill a whole chicken; it just contributes to demand").

  **Established Names:**
  *   **The Problem of Imperceptible Differences:** Coined/Popularized by **Alastair Norcross**. This captures the idea that the harm caused by one act is too small to be morally significant on its own, even if the aggregate is catastrophic.
  *   **The Tracing Problem:** Often discussed in legal theory and moral responsibility. The causal chain exists, but the link to *specific* damage is broken.
  *   **Complicity without Distinct Impact:** This is **Christopher Kutz's** framing in *Complicity: Ethics and Law for a Living Age*. He argues that even if you can't trace a specific harm to yourself, you are complicit because you participated in the *joint activity* that caused the harm.

  **Boundary Case (The Sharp Threshold):**
  You asked: *Does the first survive if the threshold is sharp and known?*
  **No.** If the threshold is sharp (e.g., exactly 1,000 votes trigger the war) and known, and you are the 900th voter, Shape 1 collapses. You know you are not the tipper. You move to Shape 2. If you are the 1,000th voter, you are the sole cause of the threshold crossing, and Shape 1 vanishes entirely (you are now a standard paradigmatic cause).
  **Therefore, Shape 1 requires either:**
  1.  **Epistemic Uncertainty:** You don't know where the threshold is (so you *might* be the tipper).
  2.  **Continuous Harm:** There is no threshold; harm scales continuously (e.g., temperature rise), but individual units are imperceptible.

  **Moral Upshot:**
  The debate here is not about *efficacy*, but about **responsibility distribution**. The standard counter-argument is **Expected Utility** (multiply the tiny probability of being the tipper by the massive harm) or **Complicity** (you share responsibility for the collective outcome regardless of individuation).

  ---

  ### 2. The Second Shape: The Problem of Causal Redundancy (or Futility)

  **The Structure:**
  *   **Causal Status:** Your act makes **no difference** to the outcome. The outcome is counterfactually independent of your action.
  *   **The Block:** The harm is *overdetermined*. Enough other agents are already acting such that the threshold is met regardless of your choice.
  *   **Epistemic Condition:** You know (or assume) that others have already secured the outcome. "The bucket is already overflowing."

  **Established Names:**
  *   **The Futility Objection:** The most common label in political philosophy and voting theory.
  *   **Causal Redundancy / Overdetermination:** The metaphysical label. Specifically, this is often **Pre-emptive Overdetermination** (others act first/sufficiently) or **Simultaneous Overdetermination**.
  *   **The Inefficacy Objection (Strict Sense):** While "inefficacy" covers both, **Mark Budolfson** (in *"The Inefficacy Objection to Consequentialism and the Problem with the Expected Consequences Response"*) argues that this is the *only* true inefficacy problem. He distinguishes this sharply from the probabilistic/threshold cases.

  **Boundary Case (Collapse into Shape 1?):**
  You asked: *Does the second just collapse into ordinary overdetermination, or into nothing?*
  It **is** ordinary overdetermination. However, it does not collapse into Shape 1.
  *   **Shape 1 says:** "I might be the cause, but I can't prove which harm is mine."
  *   **Shape 2 says:** "I am definitely *not* the cause of the outcome (because it happens without me)."
  Shape 2 is a stronger causal claim. It survives even if the threshold is sharp and known. (e.g., "I know 1,000 votes are needed. 1,000 people have already voted. My vote changes nothing.")

  **Moral Upshot:**
  The debate here is about **consequentialist grounding**. If morality requires making a difference (as some strict act-consequentialists argue), Shape 2 exonerates you. To condemn action in Shape 2, you need:
  1.  **Rule Consequentialism:** (If everyone did this, it would be bad).
  2.  **Virtue Ethics:** (What kind of person does this?).
  3.  **Non-Causal Duty:** (Kantian duties not to participate in evil systems, regardless of impact).
  4.  **Nefsky's "Helping":** **Julia Nefsky** ("How You Can Help, Without Making a Difference") argues you can *help* bring about a good (or avoid harm) by being part of the sufficient set, even if you aren't *necessary*.

  ---

  ### The Carving: Summary Table

  | Feature | Shape 1 (Indeterminacy) | Shape 2 (Redundancy) |
  | :--- | :--- | :--- |
  | **Core Claim** | "I can't trace *my* harm." | "I change *no* outcome." |
  | **Causal Relation** | Probabilistic or Continuous | Null (Counterfactually Inert) |
  | **Metaphysics** | Imprecise Threshold / Granularity | Overdetermination |
  | **Key Philosopher** | Norcross, Kutz, Parfit (Mistake 1) | Nefsky, Budolfson, Sinnott-Armstrong |
  | **Moral Escape** | Complicity / Expected Utility | Futility / No Difference |
  | **If Threshold Known?** | Collapses (to Shape 2 or Standard Cause) | Survives (Still redundant) |

  ### Why the Conflation Matters

  You mentioned you can't tell if you're onto something. Here is why the distinction is critical for your dissertation:

  1.  **The "Expected Utility" Rebuttal works on Shape 1, but fails on Shape 2.**
      *   In Shape 1, you can say: "There is a 0.0001% chance you are the tipper, multiplied by 1 billion deaths = significant expected disvalue."
      *   In Shape 2, if the outcome is *guaranteed* by others, the probability of you tipping is **zero**. Expected utility calculations yield zero. You cannot use standard consequentialism to condemn Shape 2 without invoking rule-based or non-causal arguments.

  2.  **Policy Implications differ.**
      *   To solve Shape 1 (Indeterminacy), you need **transparency** (make thresholds known) or **attribution mechanisms** (carbon footprints).
      *   To solve Shape 2 (Redundancy), you need **coordination** (get others to stop so your act *would* matter) or **normative shifts** (make the act wrong regardless of impact).

  ### Recommended Terminology for Your Work

  Since you are writing a PhD thesis, you should adopt precise labels to avoid the "inefficacy" muddle. I recommend:

  1.  **For Shape 1:** **The Indeterminacy Objection** (or **The Tracing Objection**). This highlights that the causal chain exists but the *attribution* is broken.
  2.  **For Shape 2:** **The Futility Objection** (or **The Redundancy Objection**). This highlights that the causal chain to the *outcome* is broken.

  **Crucial Reading List for this Distinction:**
  *   **Julia Nefsky,** *"How You Can Help, Without Making a Difference"* (Philosophical Studies, 2012). **This is the most important paper for your specific problem.** She explicitly carves out the space where you don't make a difference (Shape 2) but still have moral reasons to act.
  *   **Mark Budolfson,** *"The Inefficacy Objection to Consequentialism and the Problem with the Expected Consequences Response"* (Philosophical Studies, 2019). He rigorously separates the probabilistic threshold cases (Shape 1) from the overdetermination cases (Shape 2).
  *   **Derek Parfit,** *Reasons and Persons*, Part 1, Chapter 3 ("Five Mistakes in Moral Mathematics"). Mistake 1 is Shape 2 ("If I don't do it, someone else will"). Mistake 2 & 3 relate to Shape 1 (ignoring small chances or imperceptible effects).
  *   **Christopher Kutz,** *Complicity: Ethics and Law for a Living Age* (2000). Best for resolving Shape 1 via participatory intention rather than causal tracing.
  *   **Tracy Isaacs,** *Taking Responsibility: Individuals and Groups* (2011). Good for the "Many Hands" vs. "Collective Obligation" distinction.

  ### Final Verdict

  You are not making a distinction without a difference. You have identified the difference between **epistemic/causal indeterminacy** (Shape 1) and **counterfactual redundancy** (Shape 2).

  *   Shape 1 is a problem of **measurement and attribution**.
  *   Shape 2 is a problem of **necessity and impact**.

  Treat them as separate objections in your thesis. If you conflate them, your interlocutors will switch between them to avoid your counter-arguments (e.g., using Shape 2 to defeat your Expected Utility argument, then switching to Shape 1 to defeat your Complicity argument). Naming them distinctly will fortify your position.
