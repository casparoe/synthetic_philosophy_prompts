answer: |-
  This is an excellent close reading problem. You have identified the exact tension that makes Chapter 15 so difficult: Marx is trying to distinguish between the *material properties* of technology and the *social form* of its application, while simultaneously arguing that under capitalism, the material properties are shaped by the social form.

  Here is a close reading of those specific paragraphs to untangle the Mill quote and the definition of the machine.

  ### 1. The Mill Quote: Aim vs. Essence

  > "That is, however, by no means the aim of the capitalistic application of machinery. Like every other increase in the productiveness of labour, machinery is intended to cheapen commodities, and, by shortening that portion of the working-day, in which the labourer works for himself, to lengthen the other portion that he gives, without an equivalent, to the capitalist."

  You ask: *Is Marx saying Mill is simply wrong, or is he granting that machines-as-such haven't lightened toil but saying that was never the aim?*

  Marx is doing the latter, but with a crucial caveat. He is **not** saying Mill is empirically wrong about the outcome (toil has not lightened). He is saying Mill is theoretically naive about the *teleology* (the purpose) of production under capitalism.

  Notice the phrasing: "the aim of the **capitalistic application** of machinery." This phrasing preserves the "seam" you are looking for. It implies that machinery *could* have a different aim in a different social context. If the aim of production were human welfare, machinery would indeed be intended to lighten toil.

  However, look at the next sentence: "In short, it is a means for producing surplus-value." This sounds like machinery's nature, not just what capitalists do with it. How do we reconcile this?

  Marx is arguing that under capitalism, the **function** of the machine becomes constitutive of its **design**. Because the goal is surplus value (relative surplus value, specifically), machinery is developed *specifically* to increase productivity in a way that lowers the value of labor power.
  *   **Mill's Error:** He judges machinery by a humanist standard (does it reduce suffering?).
  *   **Marx's Correction:** He judges machinery by its systemic function (does it increase surplus value?).

  So, to answer your question: Marx is saying that within the capitalist mode of production, the distinction between "machinery on its own" and "capitalistic application" collapses in practice, because the machinery is *developed* to fit the application. However, theoretically, the seam remains. Marx is not saying a machine *cannot* lighten toil; he is saying the capitalist has no incentive to make it do so, and every incentive to make it intensify labor. The machine is a "means for producing surplus-value" **because** it is embedded in the valorization process, not because of its steel and gears alone.

  ### 2. The Definition: Technical vs. Historical

  > "From the economic standpoint this explanation is worth nothing, because the historical element is wanting."

  You ask: *He bins the mathematicians' answer... because "the historical element is wanting"... But the breakdown he gives instead... looks just as physical as the answers he rejected.*

  This is the crux of the chapter. Marx rejects the mathematicians' definition (simple vs. complex) because it is **ahistorical**. It treats a lever in ancient Rome and a lever in a steam engine as the same economic category. For Marx, technology is not just physics; it is a stage in the social organization of labor.

  He also rejects the "motive power" definition (man vs. nature) because, as he notes, many early machines were driven by men or animals. If a man turns a crank to power a loom, is it a tool or a machine? The motive power definition fails here.

  So, what is the "historical element" in his own definition? You spotted the key line:

  > "With this difference, that instead of being human implements, they are the implements of a mechanism, or mechanical implements."

  You ask: *So is the real difference that the tool is no longer held by the worker? If so, thats already a social/historical fact about who commands the labour process...*

  **Yes.** This is the critical insight.

  Marx's definition of the machine is technically descriptive (motor, transmission, working machine), but its **significance** is entirely social.
  *   **Tool:** The worker is the subject; the tool is the object. The skill resides in the worker. The worker controls the pace and the motion.
  *   **Machine:** The mechanism is the subject; the tool is now a part of the mechanism. The skill is objectified into the machine. The worker becomes the "appendage" (a term he uses later) that feeds the machine.

  When Marx says the "historical element is wanting" in the mathematician's definition, he means they fail to see that the shift from Tool to Machine represents a shift in **who controls the labor process.**

  The "working machine" (the part that actually touches the commodity) takes the tool out of the worker's hand and mounts it on a frame driven by a mechanism. This technical change allows the capitalist to dictate the speed and intensity of work. Therefore, the definition *looks* physical, but it identifies the precise physical point where **control passes from the worker to the capitalist.**

  ### 3. The Seam: Is the Machine Already Capital?

  You ask: *On Marxs view is there any seam at all between the machine and its capitalist use, or is the machine already capital all the way down? And does that answer change how I should read the Mill line?*

  This is the hardest question in the chapter. Here is the precise distinction Marx is making in these pages:

  1.  **Material Substance:** A machine is made of iron, wood, gears, etc. In this sense, it is not capital. A socialist society could use a spinning jenny.
  2.  **Social Form:** When that machine is used to extract surplus value, it functions as capital.
  3.  **Technical Form:** This is the nuance. Marx argues that under capitalism, the **technical design** of the machine is altered to suit the social form.

  In these paragraphs, Marx is defining the **Technical Form** that makes the **Social Form** possible. The shift from "human implement" to "implement of a mechanism" is the technical precondition for the real subsumption of labor under capital.

  So, is there a seam? **Yes.**
  *   If there were no seam, Marx couldn't criticize the "capitalistic application." He would just have to criticize "machinery."
  *   However, the seam is narrow. The machinery developed *historically* is developed *by* capital. So while a machine *could* be used non-capitalistically, the machines we actually have are designed to dominate the worker.

  **How this changes the reading of the Mill line:**
  If the machine were "capital all the way down" (ontologically), then Mill would be wrong to think machines *could* lighten toil.
  But because there is a seam, Marx's critique of Mill is sharper: Mill assumes that because machines *could* lighten toil (technical potential), they *should* have (moral expectation). Marx replies that the **social relation** (capital) hijacks the **technical potential**.

  The definition of the machine (tool becoming an implement of the mechanism) explains **how** that hijacking happens technically. By taking the tool out of the worker's hand, the machine makes the worker replaceable and the pace controllable. This ensures that the productivity gains (which *could* lighten toil) are instead converted into surplus value (lengthening the unpaid portion of the day).

  ### Summary for your Seminar

  1.  **On Mill:** Marx is not saying machines *cannot* lighten toil. He is saying that under the capitalist relation, the **structural imperative** is surplus value, not toil reduction. The "capitalistic application" phrase preserves the possibility of non-capitalist machinery, but argues that our current machinery is shaped by capitalist aims.
  2.  **On Definition:** Marx rejects purely physical definitions because they ignore the **labor process**. His definition (tool becomes part of the mechanism) identifies the moment where **control shifts from worker to machine**. This looks physical, but it is the material basis for a social change (domination).
  3.  **On the Seam:** There is a distinction between the machine as a material object and the machine as capital. However, the *specific form* the machine takes (the working mechanism dominating the worker) is historically developed to serve capital. The machine is not capital by nature, but the machinery of the Industrial Revolution is capital "crystallized" into steel.

  **The takeaway:** Marx is arguing that you cannot understand the technology without understanding the social relation that birthed it. The machine is not neutral hardware that capitalists "use"; it is hardware that was *designed* by the logic of capital to solve the problem of controlling labor. That is why the "historical element" is essential to the definition.
