answer: |-
  **What the tree is for**

  This document is not a voting guide. It is a diagnostic tool designed to separate underlying commitments from policy slogans. We are stuck because commissioners who agree on "term limits" disagree on whether the problem is corruption, homogeneity, or ignorance. This tree forces you to answer concrete questions about specific scenarios rather than abstract principles. By tracing your answers, you will locate your actual institutional preference, which may differ from the proposal you initially filed. Use this to identify where your colleagues genuinely diverge from you, and where you merely use different labels for the same goal. If your path leads to an "Empty Combination," your position requires revision. If your path leads to a "Pair," acknowledge that your reform is functionally identical to another.

  **The nodes**

  1.  **The Defect:** Councilor A has served 16 years. Her brother owns a firm that just got a city contract. Staff approved it. Is the problem that she stays too long, that the council doesn't look like the city, or that staff data was ignored?
      *   *Tenure/Incentives* → Node 2
      *   *Composition/Representation* → Node 3
      *   *Information/Process* → Node 4
      *   *Why:* Identifies whether you seek to change the person, the pool, or the input.

  2.  **Tenure Mechanism:** You want to limit Councilor A's time. Do you ban her from running again after two terms, or do you require her to step down for one term before running again?
      *   *Hard Cap* → Leaf: Term Limits
      *   *Forced Break* → Leaf: Rotation by Class
      *   *Why:* Distinguishes between eliminating experience and refreshing perspective.

  3.  **Legitimacy Source:** A policy is enacted by people who did not seek power. It matches the city's demographics exactly but 60% of voters oppose it. Is this outcome valid?
      *   *Yes (Resemblance)* → Node 5
      *   *No (Consent)* → Node 6
      *   *Why:* Tests whether authority comes from authorization or statistical resemblance.

  4.  **Information Source:** Staff says a project is safe; neighbors say it is risky. Who decides the truth?
      *   *Professional Staff* → Leaf: Technocratic Staff Expansion
      *   *Selected Citizens* → Leaf: Deliberative Polling (Advisory)
      *   *Why:* Determines if reform is about expertise or public judgment.

  5.  **Service Obligation:** Your neighbor is selected for this body. She says she is too busy. Do you force her, pay her double salary, or let her opt out?
      *   *Force/Fine* → Node 7
      *   *Pay/Incentive* → Leaf: Sortition Inside Parties (Elite Pool)
      *   *Opt-Out* → Leaf: No Institutional Change (Self-Selection)
      *   *Why:* Tests whether service is a civic duty or a burden requiring compensation.

  6.  **Accountability:** The body makes a mess. Do you remove the specific person who voted yes, or just ensure that specific vote couldn't happen again?
      *   *Remove Person* → Leaf: Recall Mechanisms
      *   *Change Rules* → Node 7
      *   *Why:* Distinguishes individual retrospective accountability from collective prospective design.

  7.  **Scope of Authority:** Can this group veto a specific housing project, or must they rewrite the entire zoning code?
      *   *Specific Veto* → Leaf: Binding Citizens' Jury (Fixed)
      *   *Full Lawmaking* → Node 8
      *   *Why:* Separates checking power from governing power.

  8.  **Chamber Structure:** Should this group replace the Council entirely, or sit alongside them as a revising house?
      *   *Replace* → Leaf: Single Allotted Chamber
      *   *Alongside* → Leaf: Mixed Arrangement
      *   *Why:* Determines if elections are obsolete or merely incomplete.

  **The leaves**

  1.  **Term Limits:** You believe experience is a liability and turnover is a virtue.
  2.  **Rotation by Class:** You treat office like jury duty but keep the election mechanism.
  3.  **Single Allotted Chamber:** You believe voting is obsolete and representation requires randomness.
  4.  **Mixed Arrangement:** You distrust the people enough to give them only a veto over elected officials.
  5.  **Binding Citizens' Jury (Fixed):** You trust strangers with land-use but not with parks or policing.
  6.  **Sortition Inside Parties:** You trust party bosses to manage randomness within candidate lists.
  7.  **No Institutional Change:** You blame voters and the press for the politicians they elect.
  8.  **Technocratic Staff Expansion:** You believe politics is just a data deficit solvable by hiring more experts.
  9.  **Deliberative Polling (Advisory):** You want public judgment to inform leaders without constraining them.
  10. **Recall Mechanisms:** You believe stability is less important than immediate punishment of officials.

  **Empty combinations**

  Several paths lead to incoherent positions. First, wanting statistical representation (Node 3: Yes) while refusing compulsion (Node 5: Opt-Out) is empty; voluntary sortition becomes self-selection, losing statistical validity. Second, demanding full lawmaking power (Node 7: Full) for a body chosen without campaigns (Node 3: Yes) while refusing to replace the Council (Node 8: Alongside) creates a dual-sovereignty crisis neither side can resolve. Third, seeking to fix corruption via Term Limits (Node 2: Hard Cap) while refusing to change campaign finance (Node 7: Change Rules) is behaviorally ineffective; money will simply flow to new faces. These combinations appear logically possible but fail in practice.

  **Pairs this tree cannot separate**

  Term Limits and Rotation by Class are behaviorally indistinguishable regarding exit; both force incumbents out, differing only in whether they can return. Similarly, a Binding Citizens' Jury (Fixed) and the Lower House of a Mixed Arrangement often function identically if the elected chamber ignores the jury's revisions; both become veto points rather than legislative initiators. Do not argue over these labels if your answers lead to both; argue over the implementation details instead.

  **How to read a respondent's path**

  To use this tree, sit with a colleague and ask the Node questions in order. Record their arrow choices. If their path ends at a Leaf, show them the "Embarrassing Commitment." Ask if they accept that implication. If they hesitate, they have answered a Node inconsistently with their true beliefs; re-ask the Node using a different concrete example. If their path leads to an Empty Combination, explain why the mechanics fail (e.g., voluntary sortition isn't representative). Do not allow them to retreat to slogans like "democracy" or "corruption." If two colleagues arrive at the same Leaf but support different Proposals (e.g., both want Term Limits but one filed District Elections), they are voting on symbols, not substance. Force them to choose the Leaf that matches their Node answers, then draft charter language that matches the Leaf, not the Proposal.
