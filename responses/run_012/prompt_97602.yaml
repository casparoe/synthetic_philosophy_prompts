answer: |-
  You have identified one of the most persistent and frustrating sins in social science, particularly in development economics and sociology. You are right to be annoyed: it is an argumentative sleight of hand that creates the *illusion* of explanation without actually providing one.

  There isn't one single universally agreed-upon name, but there are three terms that, when combined, describe exactly what you are seeing.

  ### 1. The Existing Names
  The most precise academic term for this is **"Reification of the Residual."**

  *   **Residual:** In statistics and modeling, the "residual" is the leftover variance—the part of the outcome your model *couldn't* explain.
  *   **Reification:** Treating an abstract concept as if it were a concrete, physical thing.

  When a debater says, "We can't explain the wealth with geography or trade, so it must be 'Culture'," they are taking the statistical leftover (the residual), giving it a name ("Culture"), and then treating it as a concrete force that *caused* the wealth.

  Two other related concepts help flesh this out:
  *   **The "God of the Gaps" Fallacy:** This is the theological equivalent. "We don't know what causes lightning, so it must be Zeus." In your debate, it's: "We don't know what causes wealth, so it must be 'Institutions'."
  *   **Tautological Functionalism:** This is when you infer the *cause* of a trait solely from its *effect*. (e.g., "They have this institution *because* it makes them rich." How do you know it makes them rich? "Because they have it and are rich.")

  ### 2. A Coined Term for Debate
  If you want a label to use in the round that cuts through the jargon, call it **"The Outcome-Defined Variable."**

  You can say: *"My opponent is using an Outcome-Defined Variable. They are defining the cause solely by the effect it is supposed to produce."*

  ### 3. What This Thing Actually Is (Ontologically)
  You asked to know what the thing *is*, not just what it's called.

  This move is an **Epistemic Placeholder masquerading as an Ontological Entity.**

  *   **Epistemic Placeholder:** A label for "we don't know yet." It is a bucket for ignorance.
  *   **Ontological Entity:** A real thing that exists in the world and pushes other things around (like gravity, or a law, or a specific tax rate).

  The fallacy occurs when the debater takes the bucket of ignorance, paints a label on it ("Trust," "Culture," "Good Institutions"), and then argues as if the bucket is a machine engine driving the car. It is **ignorance dressed up as insight.**

  ### 4. Distinguishing It from Circular Reasoning
  You asked for the line between this and plain circular reasoning. They are cousins, but the mechanism is different.

  *   **Classic Circular Reasoning (Begging the Question):**
      *   *Structure:* "A is true because B is true. B is true because A is true."
      *   *Example:* "The Bible is true because God wrote it. God exists because the Bible says so."
      *   *Flaw:* Logical loop.

  *   **The Outcome-Defined Variable (Your Scenario):**
      *   *Structure:* "A causes B. We know A exists *only* because B happened."
      *   *Example:* "High Trust causes Wealth. We know they have High Trust *because* they have Wealth."
      *   *Flaw:* **Methodological Unfalsifiability.**
      *   *The Difference:* Circular reasoning is a logical error in the *proposition*. This is a measurement error in the *evidence*. It claims to be an empirical argument ("Look at the data!") but the data is rigged by definition. It creates a **zombie variable**: a variable that cannot die (be proven false) because its life support is hooked up to the outcome.

  ### 5. Distinguishing It from a Genuine Open Question
  This is the most important distinction for a debater. Social science *is* hard. Sometimes we suspect a cause exists but can't measure it well yet. How do you tell the difference between a honest "hard to measure" variable and this fallacy?

  **The Test of Independent Operationalization.**

  *   **Genuine Open Question:** "We hypothesize that 'Social Trust' causes wealth. We acknowledge this is hard to measure. However, we can use proxy measures *independent* of wealth, such as survey data on wallet-returning rates, blood donation rates, or contract enforcement speeds. If a poor country has high wallet-returning rates, our theory predicts they should grow richer."
      *   *Key:* The cause (Trust) can be measured *without* looking at the effect (Wealth).

  *   **The Fallacy:** "We hypothesize 'Culture' causes wealth." When asked how to measure Culture, they say, "Well, look at their GDP."
      *   *Key:* The cause is **operationalized by the outcome.** If the country is poor, the theory automatically dictates they *must* have bad culture. There is no scenario where a country could have "Good Culture" and be Poor.

  ### How to Crush This in Debate
  When someone pulls this move, do not just say "that's circular." They will deny it. Instead, demand **Independent Operationalization.**

  **The Script:**
  > "You're arguing that Factor X causes Wealth. That is a testable hypothesis. For it to be valid, you must be able to measure Factor X *without* looking at Wealth.
  >
  > Can you name a country that has 'Good Institutions' but is currently Poor?
  > *   **If they say No:** Then your theory is unfalsifiable. You aren't describing a cause; you're just renaming the outcome.
  > *   **If they say Yes:** Then ask for the data. If they can't provide a metric for the cause that doesn't rely on the effect, they are committing the **Residual Reification Fallacy**. They are treating their own ignorance as an explanation."

  ### Summary
  *   **Name:** Reification of the Residual (Academic) / Outcome-Defined Variable (Debate).
  *   **What it is:** Ignorance dressed as a causal force.
  *   **The Line:** Can you measure the cause without looking at the effect? If no, it's the fallacy. If yes, it's a hard science problem.
  *   **Why it bugs you:** Because it steals the intellectual credit for solving a problem while actually refusing to engage with the problem.
