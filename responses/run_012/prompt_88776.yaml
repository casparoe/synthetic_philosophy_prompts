prompt: |-
  A friend and I spent most of last evening arguing about prioritarianism and the levelling-down objection, and it gradually became clear that we disagreed less about the positions than about what a theory in that area is even supposed to deliver. So before I read anything else on it, I want the specification. Assume the view is meant to be usable in public reasoning about policy — something that has to tell a government what to do, not merely what to admire. Set out the desiderata that any adequate account of the badness of inequality, and of the extra weight given to benefiting the worse off, has to meet.

  Give me the requirements themselves, each with the case or consideration that motivates it, rather than a survey of who holds what. I want your judgment about which of the following are genuine requirements and which are the prejudices of one camp:

  - the levelling-down cases: bringing the better off down when no one gains; a natural event that does the same; the better off choosing to come down; and the variant in which the advantage removed is partly positional, so that the better off really are made worse off by the levelling. Does the objection still run, and in what form?
  - cases in which every person's level rises while the gap widens, against cases in which the gap narrows because the better off lose. Can the account treat these as evaluatively different without relying on the comparisons it says it does not need? And how does it stand on the Pareto and anonymity conditions?
  - the trade-off case: a fixed benefit that would do more for someone better off than for someone worse off. The account owes me a rate of exchange and an explanation of where the rate comes from.
  - scale: whether the extra weight given to the worse off survives a change in the unit of the well-being measure, and if it does not, what fixes the unit.
  - continuity: whether the priority is lexically absolute, and if so, how it avoids letting a hair's-breadth gain to the worst off outweigh catastrophic losses to many others.
  - ex ante versus ex post: whether priority attaches to a person's prospects before the lottery is run or to their level in the outcome, and whether one account can hold both.
  - the metric: what is being compared, and how the account avoids the happy-slave and adaptive-preference embarrassments.
  - the status of the claim: is the badness of inequality a reason for action, a reason for regret, or only a respect in which one outcome is better than another — and can the account concede intrinsic badness without conceding that anyone ever has reason to level down? Relatedly, say whether the deliverable is an axiology or a decision procedure, and what follows if it is only the former.
  - population: what the account must say, if anything, about non-overlapping lives and about how many people there are.

  Then tell me which requirements you take to be non-negotiable and which are optional or purpose-dependent, and — the part I care most about — which pairs cannot be jointly satisfied, with the argument for the conflict rather than the assertion. Finish by saying which single requirement does the most to exclude the standard views, and where exactly the gap lies in my friend's claim that anyone who thinks inequality is bad in itself must want the better off knocked down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Prioritarianism vs. Egalitarianism, specifically focusing on the Levelling-Down Objection (LDO) and the requirements for a theory of inequality/priority usable in public policy.
      *   **Goal:** Provide a specification of desiderata (requirements) for an adequate account of the badness of inequality and priority to the worse off.
      *   **Constraint 1:** Assume the view is for *public reasoning about policy* (action-guiding, not just admiring).
      *   **Constraint 2:** Do not survey who holds what view. Give the requirements and the motivating cases/considerations.
      *   **Constraint 3:** Evaluate the user's list of specific issues (Levelling-Down, Pareto/Anonymity, Trade-offs, Scale, Continuity, Ex Ante/Post, Metric, Status, Population). Determine which are genuine requirements vs. prejudices.
      *   **Constraint 4:** Identify non-negotiable vs. optional requirements.
      *   **Constraint 5:** Identify incompatible pairs of requirements (trade-offs) with arguments.
      *   **Constraint 6:** Identify the single requirement that does the most to exclude standard views and address the friend's claim about "knocking down the better off."
      *   **Tone:** Philosophical, precise, analytical, judgment-oriented (as requested: "I want your judgment").

  2.  **Deconstruct the User's List & Formulate Requirements:**
      *   *Levelling-Down:* This is the core LDO. A policy theory *must* not recommend making everyone worse off just to equalize.
      *   *Pareto/Anonymity:* Pareto (if someone gains and no one loses, it's better) is crucial for policy. Anonymity (who matters, not which person) is standard for impartiality.
      *   *Trade-off (Priority Weighting):* Needs a function. How much weight to the worse off?
      *   *Scale:* Cardinality vs. Ordinality. Prioritarianism usually needs cardinal well-being.
      *   *Continuity/Lexicality:* Avoiding absurd trade-offs (tiny gain to worst-off vs. massive loss to others).
      *   *Ex Ante/Post:* Risk and uncertainty. Policy deals with probabilities.
      *   *Metric:* What is "well-being"? Adaptive preferences are a major pitfall for policy.
      *   *Status:* Axiology (value of states) vs. Deontology/Decision Procedure (action guiding). The prompt specifies *policy*, so decision-procedure relevance is key.
      *   *Population:* Non-identity problem, total vs. average.

  3.  **Evaluate "Genuine Requirements" vs. "Prejudices":**
      *   *Genuine:* Action-guidance (no levelling down), Pareto efficiency (don't waste resources), Metric stability (avoid adaptive preferences), Trade-off clarity (need to allocate budgets).
      *   *Prejudices/Camp-Specific:* Lexical priority (too rigid for policy), Strict Ex Ante (often conflicts with Ex Post fairness), Specific population views (often orthogonal to the core inequality question).

  4.  **Determine Non-Negotiables vs. Optionals:**
      *   *Non-Negotiable (for policy):* No Levelling Down (must improve lives), Pareto (efficiency), Metric coherence (must measure something real).
      *   *Optional:* Exact functional form (concave utility vs. weighted), Ex Ante vs. Ex Post (depends on risk context), Population specifics (unless dealing with reproductive policy).

  5.  **Identify Incompatible Pairs (The "Hard Problems"):**
      *   *Pareto + Separability (Person-Affecting) vs. Non-Instrumental Equality:* If inequality is *intrinsically* bad, LDO creates a value gain even if no one benefits. If policy must be person-affecting, intrinsic badness is hard to square with LDO rejection.
      *   *Ex Ante Priority vs. Ex Post Priority:* You can't maximize both under uncertainty.
      *   *Scale Invariance vs. Cardinal Priority:* Priority weighting usually requires cardinal measurability, which is hard to fix without arbitrary units.

  6.  **Address the "Single Requirement" and the Friend's Claim:**
      *   The friend claims: "Inequality bad in itself -> Want better off knocked down."
      *   The gap: The distinction between *Axiological Assessment* (is this state better?) and *Decision Procedure* (what should I do?).
      *   The Excluding Requirement: The **Person-Affecting Constraint** (or the rejection of impersonal value). If you demand that value must be value *for someone*, you kill strict egalitarianism that accepts LDO.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the shift from theory to policy. This changes the stakes.
      *   *Section 1: The Desiderata (evaluating the user's list).* Go through each bullet point.
          *   *LDO:* For policy, LDO is a veto. A theory recommending LDO is useless.
          *   *Pareto/Anonymity:* Pareto is non-negotiable for policy. Anonymity is standard impartiality.
          *   *Trade-off:* Needs a specific function. "More weight" isn't enough.
          *   *Scale:* Crucial. If the unit changes, the priority changes? That's unstable policy.
          *   *Continuity:* Lexical views are dangerous for policy (tyranny of the worst-off).
          *   *Ex Ante/Post:* Crucial for risk. Cannot hold both fully.
          *   *Metric:* Adaptive preferences are a policy killer (opium for the poor).
          *   *Status:* Must be action-guiding. Axiology alone is insufficient.
          *   *Population:* Important, but maybe secondary to distribution among existing people.
      *   *Section 2: Judgment on Requirements.*
          *   Distinguish between "Must Haves" (Policy viability) and "Theoretical Preferences."
      *   *Section 3: Incompatible Pairs.*
          *   Focus on the tension between *Impersonal Value* (Egalitarianism) and *Person-Affecting Constraints* (Prioritarianism/LDO rejection).
          *   Focus on Ex Ante vs. Ex Post.
      *   *Section 4: The Friend's Claim.*
          *   Pinpoint the Axiology vs. Decision Procedure gap.
          *   Identify the "Person-Affecting Restriction" as the exclusionary requirement.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just define Prioritarianism. The prompt asks for requirements for *any* adequate account of inequality/priority in policy.
      *   *Correction:* Ensure I answer the specific sub-questions in the bullet points (e.g., about positional goods in LDO).
      *   *Nuance:* On LDO with positional goods: If the good is purely positional, levelling down *is* a Pareto improvement (or at least not a loss in real terms). I need to be careful there.
      *   *Nuance:* On Scale: Prioritarianism is notoriously sensitive to the zero-point and scale of utility. This is a major weakness for policy.
      *   *Nuance:* On the Friend: The friend conflates "All-things-considered better" with "Better in one respect." A theory can say inequality is bad *in one respect* but all-things-considered we shouldn't level down.

  9.  **Final Polish:** Check tone. Ensure it sounds like a rigorous philosophical specification, not a textbook summary. (The prompt asks for *my judgment*).

      *(Self-Correction on the "Single Requirement"):* The prompt asks which requirement excludes standard views. The "No Levelling Down" constraint excludes strict Telic Egalitarianism. But the "Person-Affecting" constraint is deeper. Let's argue that the **Action-Guiding Constraint (combined with Pareto)** is what kills the friend's inference.

      *(Refining the "Incompatible Pairs"):* The strongest conflict is between **Separability/Person-Affecting** and **Non-Instrumental Equality**. If inequality is bad *in itself* (impersonally), LDO improves value. If we reject LDO (for policy), we must deny inequality is bad *in itself* in that strong sense.

      *(Refining the "Metric"):* The "Happy Slave" is critical. If we measure preference satisfaction, oppression looks fine. Policy needs objective well-being or capability.

      *(Refining "Scale"):* Prioritarianism requires cardinal utility. This is a huge hurdle for policy where we often only have ordinal data.

      *Let's structure the response clearly.*
      1. Introduction: Policy context sets the constraints.
      2. Evaluation of the List (Requirements vs. Prejudices).
      3. Non-Negotiables vs. Optionals.
      4. Incompatible Pairs (The Trade-offs).
      5. The Friend's Claim & The Exclusionary Requirement.

      *Wait, one specific detail:* "the variant in which the advantage removed is partly positional... Does the objection still run?"
      *Analysis:* If the advantage is purely positional (status), levelling down might make the rich worse off but the poor *better off* (relative status). If it's mixed, it's complex. But for policy, if the "advantage" is zero-sum status, redistribution is less costly. But the LDO usually assumes absolute well-being. I need to clarify that LDO applies to *absolute* well-being. If the "good" is positional, levelling down isn't LDO in the standard sense because the bottom gains.

      *Okay, ready to write.*
answer: |-
  This is a request for a specification document, not a literature review. You are asking for the engineering constraints on a moral theory intended for legislative and executive use. When a theory moves from the seminar room to the cabinet office, the tolerances tighten. Axiological elegance matters less than decisional stability.

  Here is the specification of requirements for a theory of inequality and priority, evaluated against your list, followed by the analysis of conflicts and the diagnosis of your friend's error.

  ### I. Evaluation of Proposed Requirements

  I will treat your bullet points as candidate constraints. I judge them on whether they are necessary for *public policy* (action-guiding, stable, impartial) or whether they are theoretical luxuries or camp-specific prejudices.

  **1. The Levelling-Down Objection (LDO)**
  *   **Verdict:** **Non-Negotiable Requirement.**
  *   **Reasoning:** In a policy context, a recommendation to reduce the well-being of some without increasing the well-being of others is indistinguishable from waste or malice. A theory that recommends levelling down *all-things-considered* is useless for government.
  *   **Nuance on Variants:**
      *   *Natural Event:* Irrelevant to policy. A theory of *justice* need not judge earthquakes, only responses to them.
      *   *Voluntary Leveling:* If the better-off choose to burn their wealth, this is liberty, not policy. The theory need not forbid it, but need not recommend it.
      *   *Positional Goods:* Here the LDO loses its bite. If the "advantage" is purely positional (e.g., status), bringing the top down *does* benefit the bottom (by improving their relative standing). In this specific case, "levelling down" is actually a Pareto improvement for the bottom half. The LDO only strictly applies to *absolute* well-being. A policy theory must distinguish absolute from positional goods; if it treats status as a primary good, the LDO transforms into a requirement to cap status.

  **2. Pareto and Anonymity**
  *   **Verdict:** **Non-Negotiable (Pareto); Standard Requirement (Anonymity).**
  *   **Reasoning:**
      *   *Pareto:* If Outcome A makes someone better off and no one worse off compared to Outcome B, policy must prefer A. Any theory violating this is inefficient and unjustifiable to the loser-less gainers.
      *   *Anonymity:* The identity of the person cannot matter, only their level of well-being. This is the definition of impartiality in public reason.
      *   *The Conflict:* You ask if an account can treat "everyone rises/gap widens" differently from "gap narrows/better off lose" without relying on comparisons. **No.** To prefer the latter (narrowing via loss) over the former (widening via gain) violates Pareto. To prefer the former (widening via gain) over the latter implies you care about the gap but not enough to violate Pareto. A policy theory *must* prioritize the Pareto case. If it values equality, it must be willing to sacrifice some efficiency to achieve it, but it cannot prefer a loss to a gain *ceteris paribus*.

  **3. The Trade-Off (Priority Weighting)**
  *   **Verdict:** **Non-Negotiable Requirement.**
  *   **Reasoning:** "Give extra weight to the worse off" is not an algorithm. Policy requires a budget constraint. The theory must specify a **priority function** (e.g., a concave transformation of well-being). It must tell us the *rate* at which we trade a gain to the worst-off against a loss to the better-off. Without this, the theory yields no verdict in hard cases.
  *   **Source of Rate:** The rate cannot come from the theory itself without arbitrary stipulation. It must come from a democratic calibration of "sufficientarian" thresholds or a social welfare function derived from reflective equilibrium. The theory must *accommodate* a rate, not necessarily *fix* it a priori.

  **4. Scale and Units**
  *   **Verdict:** **Non-Negotiable Requirement (Stability).**
  *   **Reasoning:** If the priority weighting changes depending on whether we measure well-being in "hedons," "dollars," or "capability units," the theory is arbitrary. Prioritarianism is notoriously sensitive to the zero-point and scale of the utility function. A policy theory must either: (a) fix the unit objectively (e.g., basic needs), or (b) be scale-invariant (which usually kills prioritarianism, pushing it toward rank-weighted views). If the unit floats, the policy floats.

  **5. Continuity vs. Lexicality**
  *   **Verdict:** **Non-Negotiable Requirement (Continuity).**
  *   **Reasoning:** Lexical priority (the worst-off always win, no matter the cost to others) is a policy disaster. It leads to the "tyranny of the worst-off," where a microscopic gain to the most deprived justifies catastrophic losses to the majority. A usable theory must be aggregative and continuous. It must allow trade-offs.

  **6. Ex Ante vs. Ex Post**
  *   **Verdict:** **Purpose-Dependent (but Ex Post is safer for policy).**
  *   **Reasoning:**
      *   *Ex Ante:* Priority to expected well-being.
      *   *Ex Post:* Priority to actual well-being outcomes.
      *   *Conflict:* You cannot satisfy both under uncertainty. If you prioritize the person with the lower *expectation*, you might end up benefiting the person who turns out to be better off. If you prioritize the person with the lower *outcome*, you might have to undo a fair lottery.
      *   *Judgment:* For policy, **Ex Post** is generally required for corrective justice (compensating those who actually suffered), but **Ex Ante** is required for insurance design. A single theory cannot maximize both. A policy framework must specify which domain applies (e.g., Ex Ante for taxation, Ex Post for disaster relief).

  **7. The Metric (Happy Slave)**
  *   **Verdict:** **Non-Negotiable Requirement (Objective/Capability).**
  *   **Reasoning:** If the metric is subjective preference satisfaction, the "happy slave" (adapted preferences) registers as well-off. A policy theory that rewards oppression because the oppressed adapted to it is morally bankrupt. The metric must be at least partially objective (capabilities, resources, or objective list) to avoid validating adaptive preferences.

  **8. Status of the Claim (Axiology vs. Decision Procedure)**
  *   **Verdict:** **Non-Negotiable Requirement (Decision Procedure).**
  *   **Reasoning:** You specified the view is for *public reasoning about policy*. Therefore, it must be a decision procedure. An axiology that says "Inequality is intrinsically bad" but "Do not reduce it" is a paradox for a government.
  *   **The Gap:** A theory can concede that inequality is *intrinsically* bad (axiology) while denying that we have *all-things-considered reason* to level down (decision procedure) because the badness of inequality is outweighed by the badness of loss. However, for policy, the *all-things-considered* verdict is the only one that matters. The intrinsic badness is a theoretical ghost unless it cashes out in a trade-off rate.

  **9. Population**
  *   **Verdict:** **Optional/Context-Dependent.**
  *   **Reasoning:** Unless the policy domain is reproductive rights or immigration, the population is fixed. A theory of distribution among existing citizens need not solve the Non-Identity Problem. However, it must be *compatible* with a plausible population ethics to avoid long-term incoherence.

  ---

  ### II. Non-Negotiables vs. Optionals

  **Non-Negotiable (The "Must-Haves" for Policy):**
  1.  **No Levelling Down:** The theory must never recommend making everyone worse off (or some worse off and none better off) to achieve equality.
  2.  **Pareto Efficiency:** Gains without losses must be preferred.
  3.  **Metric Objectivity:** The measure of well-being must not validate adaptive preferences.
  4.  **Continuity:** No lexical priorities; trade-offs must be possible.
  5.  **Action-Guidance:** The output must be a ranking of policies, not just states of affairs.

  **Optional (The "Theoretical Preferences"):**
  1.  **Ex Ante vs. Ex Post:** Depends on the specific policy domain (risk vs. compensation).
  2.  **Specific Functional Form:** Whether the priority function is square-root, logarithmic, etc., is a calibration issue, not a theoretical requirement.
  3.  **Population Ethics:** Can be bracketed for domestic distribution.
  4.  **Intrinsic Badness:** The theory does not need to claim inequality is *intrinsically* bad, only that benefiting the worse off has *greater moral value*. (This is the Prioritarian shift).

  ---

  ### III. Incompatible Pairs (The Trade-Offs)

  You asked for arguments about which pairs cannot be jointly satisfied. Here are the three critical conflicts.

  **1. The Person-Affecting Constraint vs. Non-Instrumental Equality**
  *   **The Conflict:** If inequality is *intrinsically* bad (Telic Egalitarianism), then a world where everyone is at level 50 is better *in respect of equality* than a world where half are at 100 and half at 60, even if the 100s are knocked down to 60. This implies the Levelling Down Objection fails *axiologically*.
  *   **The Argument:** To satisfy the policy requirement (No Levelling Down), you must deny that inequality is intrinsically bad in a way that generates reasons for action independent of people's levels. You must adopt a **Person-Affecting View** (value must be value *for* someone).
  *   **The Cost:** If you adopt the Person-Affecting View, you cannot explain why inequality is bad *when no one is worse off than they could have been* (e.g., in different identity cases). You save policy viability but lose the "intrinsic badness" claim.

  **2. Scale Invariance vs. Priority to the Absolute Worst-Off**
  *   **The Conflict:** Prioritarianism weights benefits by the absolute level of well-being. But well-being scales are arbitrary (0 to 10 vs. 0 to 100).
  *   **The Argument:** If you shift the zero-point of the well-being scale, the priority weight changes. A gain of 1 unit matters more at the bottom than the top. But if "0" is arbitrary, the moral weight is arbitrary. To fix this, you need a natural zero (e.g., death, or subsistence).
  *   **The Cost:** If you demand Scale Invariance (moral verdicts shouldn't change with measurement units), you must abandon absolute Prioritarianism in favor of **Rank-Weighted Prioritarianism** (weight depends on your rank, not your score). But Rank-Weighting violates **Separability** (the value of a benefit to you depends on how many people are worse off than you, even if they are unaffected). You cannot have Scale Invariance, Absolute Priority, and Separability simultaneously.

  **3. Ex Ante Priority vs. Ex Post Priority**
  *   **The Conflict:** Under risk, you cannot maximize priority for both expected well-being and actual well-being.
  *   **The Argument:** Suppose a lottery gives a 50% chance of 100 and 50% chance of 0 to Person A, and 100 to Person B. Ex Ante, they are equal (expected 50). Ex Post, they are unequal (100 vs 0). If you prioritize Ex Ante, you are indifferent to the outcome inequality. If you prioritize Ex Post, you might prefer a certain 40 for both over the lottery, even if the lottery had higher expected value.
  *   **The Cost:** A policy theory must choose. If it chooses Ex Post, it discourages risk-taking insurance markets. If it chooses Ex Ante, it tolerates massive outcome disparities resulting from "fair" chances. You cannot have both fairness of opportunity and fairness of outcome under uncertainty.

  ---

  ### IV. The Exclusionary Requirement and Your Friend's Claim

  **Which single requirement does the most to exclude standard views?**
  The **Person-Affecting Constraint** (combined with the **No Levelling Down** policy veto).

  This requirement excludes **Telic Egalitarianism** (the view that equality is intrinsically valuable regardless of who is affected). Telic Egalitarianism must concede that Levelling Down improves the world *in one respect* (equality), even if it makes no one better off. For a policy theory, this concession is fatal. If a theory admits a reason to level down, even a defeasible one, it opens the door to arguments that can be weaponized in public reasoning ("We should cut their benefits to restore fairness"). A policy theory must deny there is *any* reason to level down.

  **Where lies the gap in your friend's claim?**
  Your friend claims: *"Anyone who thinks inequality is bad in itself must want the better off knocked down."*

  The gap is the distinction between **Pro Tanto Reason** and **All-Things-Considered Verdict**, mapped onto **Axiology** vs. **Decision Procedure**.

  1.  **The Axiological Concession:** A sophisticated egalitarian can admit that inequality is *intrinsically* bad (a flaw in the pattern of the universe).
  2.  **The Decision-Procedure Block:** However, they can argue that the *value of well-being* is lexically or heavily weighted against the *value of equality*.
  3.  **The Friend's Error:** Your friend assumes that if inequality is "bad in itself," it generates an *overriding* reason for action. It does not. It generates a *pro tanto* reason.
  4.  **The Kill Shot:** The Prioritarian move is to deny the "bad in itself" claim entirely. Prioritarianism says: "Inequality is not bad. Benefiting the worse off is good (more good than benefiting the better off)."
      *   If you say inequality is *bad*, you invite the LDO (because removing inequality is good, even via loss).
      *   If you say priority to the worse off is *good*, you avoid the LDO (because leveling down benefits no one, so it generates no good).

  **Conclusion:**
  To satisfy your specification for public policy, you must adopt **Prioritarianism** (or a sufficientarian variant) rather than **Egalitarianism**. You must treat the "badness of inequality" not as a freestanding disvalue, but as a heuristic for the **diminishing marginal moral value of well-being**.

  Your friend is right that *strict* Telic Egalitarianism implies a reason to level down. But they are wrong that anyone concerned with the worse-off must accept Telic Egalitarianism. The requirement that excludes your friend's conclusion is the **Action-Guiding Constraint**: a theory that generates a reason for an action that harms everyone (or some without helping others) is defective *as a policy tool*, regardless of its axiological beauty. The gap lies in refusing to let "badness of inequality" exist as a value distinct from "badness for people."
