  ***

  ### START: The Paralysis Case
  **Imagine a world-class pianist who permanently loses the use of their hands due to injury. They can no longer play, but they retain all their musical understanding and intentions. Have they lost their *knowledge of how* to play the piano?**

  *   **NO (They still know how):** Knowledge can survive the loss of ability. → *Go to [Question 2]*
  *   **YES (They no longer know how):** Knowledge requires current capacity. → *Go to [Question 3]*

  ***

  ### [Question 2]: The Armchair Theorist
  **Imagine a person who has memorized every physics textbook on swimming and can recite the perfect stroke mechanics, but when they jump in the water, they sink immediately. Do they *know how* to swim?**

  *   **YES (Understanding is enough):** Factual understanding is sufficient for know-how. → *Go to [Question 5]*
  *   **NO (Success potential is needed):** You need more than just facts; you need some link to action. → *Go to [Question 5]*

  ***

  ### [Question 3]: The Inarticulate Master
  **Imagine a master cook who makes perfect soufflés every time but cannot articulate a single rule, step, or ingredient measurement. Is their knowledge made of *facts* they simply can't express, or is it something *other than facts* entirely?**

  *   **FACTS (Implicit Rules):** Their mind is following rules they can't speak. → *Arrive at [Leaf C]*
  *   **OTHER (Non-Factual):** Their knowledge is not made of facts at all. → *Go to [Question 4]*

  ***

  ### [Question 4]: The Structure of Ability
  **Consider the cook's skill. Is "knowing how to cook" one single, broad state of the person, or is it just a label for a bundle of many tiny, specific dispositions (chopping, heating, tasting)?**

  *   **ONE SINGLE STATE:** Skill is a unified disposition. → *Arrive at [Leaf D]*
  *   **BUNDLE OF DISPOSITIONS:** Skill is just a collection of specific habits. → *Arrive at [Leaf E]*

  ***

  ### [Question 5]: The Reliability Case
  **Imagine two people attempting a task. Person A succeeds 90% of the time; Person B succeeds 50% of the time. Does Person A *know how* to do it "more" than Person B, or do they both simply "know how" (binary) while Person A is just more reliable?**

  *   **THEY KNOW HOW "MORE":** Know-how comes in degrees. → *Arrive at [Leaf A] or [Leaf B]*
  *   **BOTH SIMPLY "KNOW HOW":** Know-how is all-or-nothing. → *Arrive at [Leaf A] or [Leaf B]*

  *(Note: Which leaf you reach depends on your answer to Question 2.)*

  ***

  ## THE POSITIONS (Leaves)

  ### Leaf A: Graded Intellectualism
  *(Reached via Q2: YES → Q5: THEY KNOW HOW "MORE")*
  **Commitments:** You hold that know-how is a species of factual knowledge (propositional attitudes), but unlike standard "knowing that," it admits of degrees. You likely view the "facts" known as practical modes of presentation rather than abstract truths. You must explain how factual knowledge can be partial without being false.

  ### Leaf B: Binary Intellectualism
  *(Reached via Q2: YES → Q5: BOTH SIMPLY "KNOW HOW")*
  **Commitments:** You hold that know-how is strictly a species of factual knowledge. It is an all-or-nothing state: either you possess the relevant proposition or you do not. Differences in performance are matters of reliability or opportunity, not differences in the knowledge itself.

  ### Leaf C: Implicit Intellectualism (Hybrid)
  *(Reached via Q1: NO → Q2: NO → Q3: FACTS)*
  **Commitments:** You hold that know-how involves factual knowledge (rules/steps), but possessing those facts is not *sufficient* for know-how (hence the Theorist fails). However, the knowledge can be retained without current ability (hence the Pianist retains it). You view know-how as a propositional state that requires a specific history of acquisition or a specific functional role that mere theorizing lacks.

  ### Leaf D: Holistic Anti-Intellectualism
  *(Reached via Q1: YES → Q3: OTHER → Q4: ONE SINGLE STATE)*
  **Commitments:** You hold that know-how is a non-propositional, sui generis mental state or disposition. It is lost when ability is lost. You view the skill as a unified character trait or global disposition of the agent, rather than a sum of parts. Knowledge is distinct from truth-apt belief.

  ### Leaf E: Bundled Anti-Intellectualism
  *(Reached via Q1: YES → Q3: OTHER → Q4: BUNDLE OF DISPOSITIONS)*
  **Commitments:** You hold that know-how is non-propositional and ability-tied. However, you deny that "skills" are real unified entities. To say someone "knows how to cook" is just shorthand for saying they possess a specific cluster of narrower behavioral dispositions. This view is more reductionist about the structure of the agent.

  ### Leaf F: Retentionist Intellectualism
  *(Reached via Q1: NO → Q2: NO → Q5: [Either])*
  **Commitments:** You hold that know-how is propositional, but you deny the Theorist has it. Unlike Leaf C, you emphasize the *degree* or *binary* nature less than the *retention* aspect. You likely argue that know-how requires the proposition be acquired through practice, even if it can be retained as memory after ability is lost. (Note: If you chose "Graded" at Q5, you are a Graded Retentionist; if "Binary," a Binary Retentionist. These are close enough to group here).

  ### Leaf G: Sui Generis Retentionism (Unoccupied/ Rare)
  *(Reached via Q1: NO → Q3: OTHER)*
  **Commitments:** You hold that the Paralyzed Pianist still knows how (Knowledge ≠ Ability), but the knowledge is *not* factual (Knowledge ≠ Propositions).
  **Status:** **Logically Coherent but Philosophically Unattractive.** Few occupy this space because if the knowledge survives paralysis, it looks like a memory state (propositional). If it is non-propositional, it is hard to explain what "state" remains in the brain once the motor pathways are dead. This view requires positing a ghostly non-factual state that persists without behavioral manifestation.

  ***

  ## NOTES ON LOGICAL SPACE

  **1. The "Non-Factual Theorist" Gap**
  There is no leaf for someone who answers **YES** to the Theorist (Q2) but **OTHER** to the Inarticulate Master (Q3).
  *   **Why Empty?** This combination claims that memorizing textbooks gives you know-how, but that know-how is *not* factual. This is incoherent: if textbook learning (factual input) gives you the state, the state is likely factual. If the state is non-factual, textbook learning shouldn't produce it.

  **2. The "Binary Ability" Tension**
  In Leaves D and E (Anti-Intellectualism), the distinction between "Graded" and "Binary" at Q5 is less significant.
  *   **Why?** If know-how is an ability/disposition, it obviously comes in degrees (you can be better or worse). Insisting it is binary here requires extra work (e.g., setting a threshold of reliability). Therefore, Leaves D and E assume gradability is natural to the view, whereas Leaves A and B require a specific commitment to gradable *propositions*.

  **3. The Method Blindness Case**
  You may notice the "Method Blindness" case (performing perfectly but not knowing which method was used) is not a branch node.
  *   **Why?** This case is used to test the *granularity* of the propositions in Leaf A/B/C, or the *fineness* of the disposition in Leaf D/E. It does not generate a new position, but rather tests the internal consistency of the leaf you landed on. If you are in Leaf B (Binary Intellectualism), you must argue the agent *does* know the method propositionally, even if they can't report it. If you are in Leaf D, you argue the distinction doesn't matter for the disposition.
