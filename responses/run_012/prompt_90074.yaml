prompt: |-
  Hey, I'm TAing a grad seminar on the philosophy and cognitive science of AI, and the last session is entirely about the frame problem. I wanted to open with a joke to warm the room up, but every version I come up with has the same shape and I'm sick of it: robot is told to make tea, robot makes tea, robot also sets the couch on fire / drowns the hamster / takes apart the fridge, because "nobody told it those things weren't supposed to change." Honestly that joke is really about the qualification problem, or just about instructions taken too literally, and it's been done to death — I don't want it. What I want is a joke whose punchline actually turns on what makes the frame problem the frame problem: the fact that the moment you try to formalize action and change, you have to spell out, for every action, all the stuff in the world that just stays the same, and there's no non-arbitrary way to do that. It's a problem about representing non-effects and persistence, not about a dumb robot. So it should land for people who've actually sat with the original planning stuff, but not be so far inside that someone who only half-remembers it feels lost.

  Can you write me something short — a few lines of setup and a real punchline? Put on your philosopher-of-AI-with-a-good-sense-of-humor hat and think it through: brainstorm two or three angles first (what's the funniest thing about having to explicitly represent that *nothing changed*?), pick the strongest, then give me the joke. If a seed helps: two people in a lab, one of them just finished a planner that can only reason about what changes and has literally no way to represent anything staying put, so it keeps re-deriving from scratch that the desk is still there, the cat is still on the desk, the desk is still under the cat... but feel free to throw that away and do your own. Include a tag/second punchline if you've got one — seminars laugh at tags — and don't feel like you have to keep it clean, I just need it to actually land for people who know the material.
