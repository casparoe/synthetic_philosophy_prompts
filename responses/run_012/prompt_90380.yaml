answer: |-
  This is a sharp, well-structured draft. You have successfully isolated a tension that often remains implicit in discussions of exclusion. Below is substantive feedback addressing your three specific questions, along with general observations on the metaphysical commitments required to make the argument stick.

  ### 1. The Horizontal/Vertical Distinction: Clear or Collapsing?

  The distinction is conceptually clear, but it faces a significant risk of collapsing unless you clarify the metaphysical status of "causes" versus "explanations."

  **The Risk of Collapse:**
  Your distinction maps roughly onto the difference between *causal efficacy* (ontic production of effects) and *causal relevance* (explanatory difference-making). The collapse threat arises if one adopts a theory of causation where the ontic and the explanatory are inseparable. For example, on many interventionist or counterfactual accounts, to be a cause *just is* to be a variable that supports interventions (a vertical/explanatory feature). If causation is fundamentally explanatory, then vertical exclusion *entails* horizontal exclusion. Conversely, if you are a process theorist who views causes as physical transfers of energy, vertical descriptions are merely epistemic shadows of the horizontal reality.

  **Defensibility:**
  To defend the distinction against collapse, you need to explicitly commit to a metaphysics where *causing* and *explaining* are distinct categories. You imply this when you say mental predicates can figure in explanations "without being a cause in the world." This is a robust realist stance about causation (causes are in the world, explanations are in the head/language).
  *   **Settled Point:** It is settled that philosophers distinguish between efficacy and relevance.
  *   **Contested Point:** It is highly contested whether this distinction allows mental properties to be "causally relevant" without being "causes." Many argue that relevance without efficacy is just epiphenomenalism by another name.

  **Recommendation:**
  To prevent the distinction from being merely verbal, you must clarify whether "Horizontal" causation is a mind-independent relation. If it is, you risk conceding that mental properties are not *real* causes, only real *explanations*. If your goal is to save mental *causation* (not just explanation), you need to argue that vertical standing confers horizontal standing, or that the horizontal picture is the mistaken one.

  ### 2. Mapping Overdetermination and Epiphenomenalism

  Your claim that the overdetermination horn belongs to horizontal exclusion and the epiphenomenalism horn to vertical exclusion is the most vulnerable part of the essay. They are more entangled than you suggest.

  **The Entanglement:**
  In the standard exclusion argument, overdetermination is the *premise* used to derive epiphenomenalism, not a separate horn of a dilemma that can be isolated. The logic runs: If $P$ is sufficient, and $M$ is distinct, $M$ is redundant (overdetermination). If we rule out systematic overdetermination, $M$ does nothing (epiphenomenalism).
  By assigning them to different "kinds" of exclusion, you suggest one can worry about overdetermination without worrying about epiphenomenalism, or vice versa. But if $M$ is vertically excluded (it adds no explanatory power), it is hard to see how it avoids being horizontally excluded (it adds no causal power), unless you adopt a dualist ontology where explanatory power does not track causal power.

  **The Mapping Accuracy:**
  *   **Overdetermination:** You are correct that this is primarily a horizontal worry (two distinct causes for one effect).
  *   **Epiphenomenalism:** You characterize this as a vertical worry (explanatory idleness). However, epiphenomenalism is traditionally an ontological thesis (mental events have no physical effects), not just an explanatory one. If you redefine epiphenomenalism as "explanatory idleness," you have changed the terms of the debate.
  *   **Contested Interpretation:** Your reading assumes that one can be an epiphenomenon in the vertical sense (explanatorily idle) without being one in the horizontal sense (causally inert). This is contested. Many physicalists argue that if a property is explanatorily idle, it is causally inert, because causal powers are identified by their explanatory role.

  **Recommendation:**
  You should acknowledge that standardly, epiphenomenalism is the *conclusion* of the horizontal argument, not a separate vertical worry. To maintain your distinction, you need to argue that the *threat* of epiphenomenalism shifts depending on the context. For example: "Horizontal exclusion threatens us with redundant causes; vertical exclusion threatens us with redundant descriptions." This clarifies that the *nature* of the loss differs, even if the result (mental properties doing no work) looks similar.

  ### 3. The Conclusion: Criterion of Relevance vs. Proof of Epiphenomenalism

  This is the strongest and most interesting part of the essay. Framing the exclusion argument as a demand for a criterion of causal relevance rather than a proof of impossibility is a productive meta-philosophical shift.

  **Interest and Novelty:**
  *   **Settled Point:** It is widely accepted in contemporary metaphysics that the exclusion problem turns on how we define causal relevance (e.g., proportionality, interventionism).
  *   **Your Contribution:** Your specific contribution is linking this to the equivocation between horizontal and vertical exclusion. This is not a standard restatement. Usually, the "causal relevance" solution is presented as a single move (e.g., "we need a difference-making account"). You are arguing that we need *two different* criteria for two different questions.
  *   **Assessment:** This is interesting because it explains *why* the debate stalls: proponents are answering different questions. However, it risks being a "dissolution" that satisfies no one. Non-reductive physicalists want mental properties to be causes (Horizontal), while critics worry they are merely descriptions (Vertical). If you say "they can be one without the other," you may not have solved the problem of mental *causation*, but rather changed the subject to mental *explanation*.

  **Recommendation:**
  Lean into this. Explicitly state that if the critic demands Horizontal causation, they must accept the possibility of benign overdetermination (or a determinable account). If they demand Vertical explanation, they must accept interventionist criteria. The "proof of epiphenomenalism" only works if one conflates the criteria.

  ### 4. Interpretation of Kim and the "Equivocation" Charge

  You write: *"Kim's argument, I think, moves from one to the other without marking the shift."*

  **Contested Reading:**
  You must be aware that this is a contested interpretation of Kim.
  *   **Alternative 1 (Ontological Reading):** Many interpreters argue Kim's argument is strictly ontological throughout. For Kim, properties cause in virtue of their causal powers. Since physical properties exhaust causal powers, mental properties (if distinct) have no powers left to exercise. On this reading, there is no vertical/explanatory shift; it is all about the distribution of causal powers in the world.
  *   **Alternative 2 (Explanatory Reading):** Others argue Kim's "Causal Exclusion" is actually an "Explanatory Exclusion" principle. On this reading, your "Vertical" distinction is actually the *primary* engine of Kim's argument, not a hidden shift.

  **Feedback:**
  If you claim Kim equivocates, you are arguing against the "Ontological Reading." You should qualify this claim. Instead of asserting it as fact, phrase it as: "The argument gains its persuasive force by sliding between these two frames, even if Kim intends a strictly ontological reading." This protects you from the objection that you are misinterpreting a univocal argument.

  ### Summary of Specific Suggestions

  1.  **Clarify the Metaphysics:** In the second paragraph, specify whether "Horizontal" causation is mind-independent. If it is, acknowledge that saving "Vertical" explanation might not satisfy those who want mental properties to be ontologically robust causes.
  2.  **Tighten the Mapping:** Acknowledge that epiphenomenalism is usually the *result* of horizontal exclusion. Refine your claim to say that the *motivation* for fearing epiphenomenalism differs in the two contexts (fear of redundancy vs. fear of idleness).
  3.  **Qualify the Kim Claim:** Mark your interpretation of Kim as a diagnosis of the argument's *rhetorical structure* rather than necessarily its author's intent. This avoids a fight over exegesis and keeps the focus on the logic.
  4.  **Strengthen the Conclusion:** The claim that the two questions "can come apart" is bold. Give a brief example of a scenario where a property is horizontally relevant but vertically idle, or vice versa, to prove they are independent. (e.g., A micro-physical detail might be horizontally causal but vertically explanatorily idle due to noise; a macro-property might be vertically explanatory but horizontally reducible).

  **Final Verdict:**
  The essay identifies a genuine structural ambiguity in the exclusion debate. The Horizontal/Vertical distinction is defensible provided you accept an ontic/epistemic split in causation. The mapping of overdetermination/epiphenomenalism needs nuance to avoid logical entanglement. The conclusion is a valuable reframing that moves the debate from "Is mental causation possible?" to "Which kind of causal standing do we value?" This is a substantive contribution, provided you guard against the charge that you are saving mental *explanation* at the cost of mental *causation*.
