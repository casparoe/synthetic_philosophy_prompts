prompt: |-
  I have drafted the following short essay on the causal exclusion argument and would like your comments. I am not looking for a literature review, citations, or reading recommendations; I want substantive feedback on the argument as it stands. I know the standard moves well enough, so please do not spend space summarizing them.

  **Two Kinds of Exclusion**

  The causal exclusion argument is usually presented as a dilemma for non-reductive physicalism. Mental properties are supposed to be distinct from physical properties, yet every mental event has a physical realizer. If the physical realizer is sufficient for the effect, then the mental property seems to add nothing; if it does add something, we get overdetermination. The standard replies try to show either that overdetermination is benign or that the mental property is not a separate cause but a higher-level description of the same cause. I want to suggest that these replies are answering different questions, and that the argument equivocates between two kinds of exclusion.

  Let me distinguish horizontal exclusion from vertical exclusion. Horizontal exclusion treats the mental and the physical as two candidate causes of the same effect, arrayed side by side in the same causal chain. The question is whether both can be causes without overdetermination. Vertical exclusion treats the mental and the physical as two candidate explanations of the same causal transaction, one at a higher level of description and one at a lower level. The question is whether the higher-level explanation is genuine or merely a shorthand for the lower-level one. The overdetermination horn belongs to horizontal exclusion; the epiphenomenalism horn belongs to vertical exclusion. Kim's argument, I think, moves from one to the other without marking the shift.

  Once the distinction is on the table, the dialectic changes. The determinable/determinate reply, for example, is a reply to horizontal exclusion: the mental property is not a second cause alongside the physical, but a determinable whose determinate is the physical. That is a plausible answer to the overdetermination worry. But it does not answer vertical exclusion. Even if the mental is not a second cause, it might still be a mere representation of the physical cause, with no explanatory work of its own. Conversely, the interventionist reply—that mental properties can be variables in a causal model—is a reply to vertical exclusion: it shows that mental predicates can figure in explanations that support interventions. But it does not by itself answer horizontal exclusion, because being a variable in a model is not the same as being a cause in the world.

  I want to argue that the exclusion argument is best understood as a demand for a criterion of causal relevance, not as a proof of epiphenomenalism. The horizontal version asks: what makes something a cause rather than a mere condition? The vertical version asks: what makes an explanation causal rather than merely descriptive? These are different questions, and the answers need not coincide. A property can be causally relevant in the horizontal sense without being explanatory in the vertical sense, and vice versa. If that is right, then the exclusion argument does not have a single conclusion. It has two, and they can come apart.

  The cost of this move is that it may make mental causation too easy. If horizontal and vertical exclusion are independent, then one can accept the causal closure of the physical and still insist that mental properties are horizontally relevant, or accept that mental explanations are vertically genuine and still deny that mental properties are horizontally distinct. But this is not obviously a cost; it may simply be the correct diagnosis. The real disagreement is not about whether mental causation exists, but about which of the two questions we are asking when we ask whether it exists.

  I am unsure whether this distinction is already implicit in the literature or whether it is a genuine innovation. I am also unsure whether it dissolves the exclusion argument or merely relocates it. In particular, I worry that the horizontal/vertical distinction may collapse under pressure: perhaps every horizontal claim can be redescribed vertically, and every vertical claim can be redescribed horizontally. If so, the distinction is verbal. I would like to know whether it is.

  Please give me comments on this draft. I would especially like feedback on three things: (1) whether the horizontal/vertical distinction is clear and defensible, or whether it collapses; (2) whether the claim that the overdetermination horn belongs to horizontal exclusion and the epiphenomenalism horn to vertical exclusion is accurate, or whether the two are more entangled than I suggest; (3) whether the essay's conclusion—that the exclusion argument is a demand for a criterion of causal relevance rather than a proof of epiphenomenalism—is interesting or just a restatement of familiar points. Please be explicit about which of your criticisms reflect settled points in the literature and which are contested; do not present a contested reading as if it were consensus. If you think the essay relies on a contested interpretation of Kim's argument, say so directly and explain what the alternatives are.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **Task:** Provide substantive feedback on a short essay draft about the causal exclusion argument.
      *   **Constraints:** No literature reviews, no citations, no reading recommendations. Focus on the argument *as it stands*. Do not summarize standard moves (the user knows them).
      *   **Specific Feedback Areas:**
          1.  Clarity/defensibility of the horizontal/vertical distinction (does it collapse?).
          2.  Accuracy of mapping overdetermination to horizontal and epiphenomenalism to vertical (are they entangled?).
          3.  Interest/novelty of the conclusion (criterion of causal relevance vs. proof of epiphenomenalism).
      *   **Tone/Style:** Explicit about what is settled vs. contested in the literature. Do not present contested readings as consensus. Address potential reliance on contested interpretations of Kim.

  2.  **Analyze the Essay Draft:**
      *   **Core Thesis:** The causal exclusion argument equivocates between two kinds of exclusion: *Horizontal* (competing causes in a chain) and *Vertical* (competing explanations/descriptions of a transaction).
      *   **Mapping:**
          *   Horizontal $\rightarrow$ Overdetermination worry.
          *   Vertical $\rightarrow$ Epiphenomenalism/Explanatory idleness worry.
      *   **Critique of Standard Replies:** Determinable/determinate addresses Horizontal but not Vertical. Interventionism addresses Vertical but not Horizontal.
      *   **Conclusion:** Exclusion is a demand for a criterion of causal relevance, not a proof of epiphenomenalism. The two questions (cause vs. condition; causal vs. descriptive explanation) can come apart.
      *   **Self-Critique (by user):** Worries the distinction might collapse (verbal) or just relocate the problem.

  3.  **Evaluate Point 1: Horizontal/Vertical Distinction (Clarity & Collapse):**
      *   *Initial thought:* This looks like the distinction between *causes* (ontic) and *explanations* (epistemic), or perhaps *token causation* vs. *type causation*.
      *   *Critique:* The draft defines Horizontal as "side by side in the same causal chain" and Vertical as "levels of description."
      *   *Potential Collapse:* In metaphysics, causes often *are* explained by lower-level causes. If $M$ causes $E$, and $M$ supervenes on $P$, and $P$ causes $E^*$ (physical effect), the "vertical" relation is often the realization relation. If the realization relation is identity (token identity), the distinction vanishes. If it's distinct, we are back to square one.
      *   *Literature Context:* This resembles the distinction between *causal efficacy* (producing effects) and *causal relevance* (making a difference/explanatory). Yablo (determinables) and Woodward (interventionism) are hinted at.
      *   *Verdict:* The distinction is clear *conceptually*, but metaphysically risky. If causation is a worldly relation, "vertical exclusion" sounds like it's just about our *talk* about causation, whereas "horizontal" is about causation itself. This risks an anti-realist turn about mental causation.
      *   *Feedback Strategy:* Point out that this maps onto the efficacy/relevance distinction. Warn that "Vertical" sounds epistemic while "Horizontal" sounds ontic. If the user wants to save mental causation ontologically, Vertical isn't enough. If they are okay with an explanatory save, Horizontal might be the real threat.

  4.  **Evaluate Point 2: Mapping Overdetermination/Epiphenomenalism:**
      *   *Draft Claim:* Overdetermination = Horizontal; Epiphenomenalism = Vertical.
      *   *Critique:* This is the shakiest part. Kim's argument uses the *threat* of overdetermination to *force* the conclusion of epiphenomenalism. They are linked logically in the standard argument.
      *   *Logic:* If $P$ is sufficient, and $M$ is distinct, $M$ is redundant (overdetermination). If we reject systematic overdetermination, $M$ does nothing (epiphenomenalism).
      *   *Problem:* You can't easily separate them. If $M$ is vertically excluded (not a genuine explanation), it is arguably horizontally excluded (not a cause) too, depending on your theory of causation. If causation is explanatory (e.g., Woodward), vertical exclusion *is* horizontal exclusion.
      *   *Feedback Strategy:* Challenge the separation. In many theories of causation (process, transfer, counterfactual), if you lose vertical standing, you lose horizontal standing. The mapping assumes a specific metaphysics where causes exist independently of explanations. This is contested.

  5.  **Evaluate Point 3: Conclusion (Criterion of Relevance vs. Proof of Epiphenomenalism):**
      *   *Draft Claim:* It's a demand for a criterion, not a proof.
      *   *Critique:* This is actually a strong meta-philosophical point. It shifts the burden of proof. Instead of "Mental properties are epiphenomenal," it becomes "Define causal relevance such that mental properties fit."
      *   *Literature Context:* This aligns with the "causal relevance" turn (e.g., Horgan, Pettit, Jackson). It's not entirely novel but framing it as the *dissolution* of the dilemma via the H/V split is the specific contribution here.
      *   *Feedback Strategy:* Validate this as a strong move, but note that it depends entirely on the success of the H/V split. If the split holds, the conclusion follows. If not, it's just restating the "causal relevance" solution without solving the exclusion problem.

  6.  **Evaluate Interpretation of Kim:**
      *   *Draft Claim:* Kim moves from one to the other without marking the shift.
      *   *Literature Context:* This is contested. Some read Kim as strictly ontological (causes are events/properties). Others see him as concerned with explanatory exclusion.
      *   *Feedback Strategy:* Explicitly flag this. Kim often argues that if you lose explanatory exclusion, you lose causal efficacy because causation *is* explanatory (in his later work) or because properties cause *in virtue of* their causal powers (which physical properties exhaust).

  7.  **Synthesize and Structure the Feedback:**
      *   **Introduction:** Acknowledge the strength of the draft (concise, clear).
      *   **Section 1: The H/V Distinction (Collapse Risk).** Focus on the Ontic/Epistemic divide. If Horizontal is "world" and Vertical is "description," you might save explanation but lose causation.
      *   **Section 2: The Mapping (Overdetermination/Epiphenomenalism).** Explain why they are usually linked. Challenge the idea that you can have one without the other easily.
