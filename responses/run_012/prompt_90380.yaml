      *   *Correction on Kim:* I need to be careful not to say "Kim is wrong." I need to say "Your reading of Kim is one of several."

  10. **Final Polish:** Check against the three specific questions asked by the user.
      *   (1) H/V Distinction clear/defensible?
      *   (2) Mapping accurate?
      *   (3) Conclusion interesting?
      *   Plus: Settled vs. Contested markers.

