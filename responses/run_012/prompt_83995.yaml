answer: |-
  The fluorescent lights of the Bureau of Ecological Welfare hummed at a frequency that Elias felt in his molars. On his screen, the Statutory Formula sat locked in the header of the spreadsheet, immutable as gravity.

  *Expected Welfare Loss (EWL) = Σ (N × P × I)*

  *N* was the number of individuals affected. *P* was the probability of sentience, derived from the Panel's neuro-structural priors. *I* was the intensity of suffering per death, standardized on a scale of 1 to 100. The statute was explicit: *No threshold below which P counts as zero.* Uncertainty was not an escape hatch; it was a variable.

  Elias was auditing Proposal 88-B: The Clearwater Reclamation. The plan involved fumigating four hundred hectares of agricultural fallow to prepare for housing, followed by the culling of displaced vertebrates to prevent urban conflict.

  He ran the macro.

  The vertebrate column populated first. White-tailed deer, red foxes, field mice.
  *Deer:* N = 120. P = 0.98. I = 85.
  *Foxes:* N = 45. P = 0.95. I = 80.
  *Mice:* N = 3,000. P = 0.85. I = 40.
  **Total Vertebrate EWL: 24,390.**

  Then the invertebrate column triggered. The fumigant would penetrate the soil matrix.
  *Earthworms:* N = 1.2 Billion. P = 0.004. I = 10.
  *Soil Nematodes:* N = 80 Billion. P = 0.0008. I = 5.
  *Collembola:* N = 15 Billion. P = 0.001. I = 5.

  Elias watched the cells sum. The numbers scrolled, digits stacking like corpses.
  **Total Invertebrate EWL: 5,960,000.**

  The ratio was roughly 250 to 1. The spreadsheet blinked its verdict in the recommendation box: *DENY FUMIGATION. PRIORITIZE SOIL MITIGATION. REALLOCATE VERTEBRATE DISPLACEMENT FUNDS TO NEMATODE HABITAT PRESERVATION.*

  The logic was airtight. If the Bureau's mandate was to minimize total expected suffering, spending \$1 to save a deer was a moral crime when that \$1 could save a million nematodes, even if each nematode was only a one-in-a-thousand chance of being a "someone." The vanishing probabilities, multiplied by the astronomical N, created a moral black hole that swallowed the certain agony of the mammals.

  Elias rubbed his eyes. He opened the code behind the cells. He checked the Panel's priors. The 0.0008 for nematodes was generous, based on the presence of nociceptors and simple ganglia. It was defensible. The intensity score of 5 was conservative. The summing rule was the bedrock of the Act. There was no error. The machinery was running perfectly. It was the output that was monstrous.

  He wheeled his chair down the aisle to Mara's cubicle. Mara was a senior analyst who treated the Formula like an insurance actuarial table.

  "It's the aggregation," Elias said, showing her the screen. "The math says we let the deer starve to save the worms."

  Mara didn't look up from her own monitor. "The math says the expected harm is higher in the soil. That's all."

  "But *expected* harm implies a gamble," Elias said. "We *know* the deer suffer. The worms... it's a one-in-a-thousand shot. You're telling me a thousand lottery tickets for pain equal one certainty?"

  "Probability is a discount factor, Elias," Mara said, finally turning. Her voice was flat, tired. "A one-in-a-thousand chance of agony *is* a small harm. It is one-thousandth of a harm. The Formula respects that. But you're balking because the *sum* of the small harms gets big. That's just arithmetic. If you have a 0.1% chance of dying in a car crash, you don't drive. If a billion people have that risk, we don't build the highway. We treat the risk as real, but discounted. The spreadsheet is doing exactly that. It's just that there are a lot of worms."

  "So we ignore the deer because there are too many worms?"

  "We ignore the deer because the aggregate risk is higher," she corrected. "It's cold, but it's consistent. If you want to save the deer, you're arguing for a threshold. You're arguing that below 1% sentience, the creature doesn't count. But the statute says no thresholds. You can't have it both ways."

  Elias went back to his desk, but the numbers burned. He sought out Julian. Julian worked in the corner, surrounded by printouts of ethical philosophy journals. He was the one who argued that the Panel's priors were inherently speciesist.

  "Show me the P-values," Julian said.

  Elias pulled up the neuro-structural table. "Nematodes are at 0.0008. Deer at 0.98."

  Julian snorted. "There it is. The habit we have most reason to distrust."

  "The Panel based it on neural complexity," Elias said.

  "They based it on *similarity to us*," Julian countered. "We trust the deer because it screams like a human. We doubt the worm because it's silent. If you assign a probability of sentience based on taxonomy, you've already decided the worm doesn't matter before you run the math. The Formula tries to correct for bias by including the invertebrates, but the inputs are poisoned. If the worm *is* sentient, P is 1. If it isn't, P is 0. Putting it at 0.0008 is just a way to feel virtuous while keeping the number low enough to ignore. But because the N is so high, it breaks the model. It proves the P-value is a lie."

  "So the result is wrong?" Elias asked, hope flaring.

  "No, the result is the truth the Panel is hiding," Julian said. "If you truly believe there is *any* chance the worm feels pain, and there are *that many* worms, you must stop the fumigation. You must stop everything. The fact that you want to save the deer proves you only care about vertebrates. The spreadsheet is the only honest thing in this office."

  Elias returned to his terminal. Mara said the math was right and our intuitions about risk were wrong. Julian said the math was right and our intuitions about *kind* were wrong. Both refused the conclusion that the Bureau should effectively cease protecting vertebrates, but for opposite reasons. One wanted to discount the risk; the other wanted to elevate the creature.

  The Formula stood between them, perfect and indifferent.

  Elias looked at the "Submit" button. If he submitted the report as generated, the Clearwater Reclamation would be halted. The housing project would stall. The deer would remain, for now, but the Bureau's budget would be legally redirected toward soil microbiome research. Vertebrate protection programs would be defunded in the next fiscal cycle as inefficient welfare allocations. The statute demanded the maximization of the score.

  He highlighted the *Total Vertebrate EWL* cell. He highlighted the *Total Invertebrate EWL* cell. He could override the recommendation. He could type "APPROVED" in the action box. It would require a justification code. He could use Code 44: *Administrative Error.* It would kick the file back to the Panel for a review of the P-values. It would buy six months.

  Or he could use Code 01: *Statutory Compliance.* He could sign it. He could let the machinery do its work.

  Elias moved his cursor to the justification field. He did not select Code 44. He did not select Code 01. He clicked the text box and began to type.

  *Recommendation: APPROVE FUMIGATION. PROCEED WITH VERTEBRATE CULLING.*

  He paused. The red warning flags popped up instantly. *DISCREPANCY DETECTED. CALCULATED EWL EXCEEDS THRESHOLD.*

  He typed his justification: *The Statutory Formula calculates Expected Welfare Loss correctly. However, the Bureau's mandate includes the preservation of ecological stability and public trust. A policy that prioritizes soil nematodes over mammalian collapse violates the broader intent of the Ecological Welfare Act, Section 1, Paragraph 3 (Public Interest). The mathematical output is accepted as accurate but rejected as actionable policy.*

  He knew this would trigger an audit. He knew Mara would call it irrational and Julian would call it cowardly. He knew he would likely be suspended pending a review of his interpretation of "Public Interest."

  Elias pressed his keycard to the reader. The light turned green. He hit *Submit*. The spreadsheet closed. The hum of the lights seemed to grow louder, filling the silence where the numbers had been.
