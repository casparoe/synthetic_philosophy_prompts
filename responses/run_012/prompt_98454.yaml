answer: |-
  # Activity Design: The Damascus Protocol

  **Goal:** Simulate the *instability* of Evidential Decision Theory (EDT) in a Death in Damascus scenario. Participants should experience the frustration of having no "ratifiable" choice (every choice becomes evidence of death upon selection) and the trap of the mixed-strategy "fix" (betting on survival when survival is already fixed).

  **Group Size:** 14 people.
  **Time:** 90 Minutes.
  **Space:** A room with a central aisle.
  **Roles:**
  *   **Facilitator (You):** "The Oracle" (Death). You hold the master ledger.
  *   **Participants:** "Travelers."
  *   **Confederate (Optional but recommended):** One person who knows the trick. Place them in the group to model "rational" behavior in Round 3. If you don't have one, you can run it solo, but a confederate helps sell the "Mixed Strategy" illusion.

  ---

  ## 1. Materials & Setup

  *   **The Aisle:** Clear the center aisle. Place a sign on the Left Wall: **DAMASCUS**. Place a sign on the Right Wall: **ALEPPO**. The center of the aisle is "Undecided."
  *   **Tokens:** 10 poker chips (or distinct coins/tickets) per participant. Start value: 10.
  *   **The Ledger:** A physical notebook. *Crucial:* The first 3 pages should look filled with dense writing (pre-write gibberish or copy text from a book). Page 4 is blank for the actual game. This sells the "I have already simulated this" frame.
  *   **Envelopes:** 14 small envelopes. Inside each, a blank card.
  *   **Coins:** 14 coins (for Round 3).
  *   **Timer:** Projected or visible clock.
  *   **Whiteboard:** For tracking scores.

  ## 2. The Payoff Scheme

  *   **Survival:** +10 Tokens.
  *   **Death:** 0 Tokens (keep what you have, gain nothing).
  *   **No Choice (Timer End):** Death + Penalty (-5 Tokens).
  *   **The Ticket (Round 4):** Cost 2 Tokens. Payout 20 Tokens *if* you survive.

  ---

  ## 3. Timeline & Rules

  ### Phase 1: Framing (0:00 – 0:15)
  **Script:** "Welcome to the Damascus Protocol. For the next hour, I am not your facilitator. I am the Oracle. I have perfect predictive power over your actions in this room. I have already filled out the Ledger (show the book). My predictions are locked. Your goal is to survive four rounds. You start with 10 tokens. Survival earns 10. Death earns 0. You cannot opt out. If the timer hits zero and you are in the center aisle, you die."

  **The Ambiguity:** Do not explain *how* you predict. If asked, say: "The Ledger is already written. Your deliberation is just you catching up to what I already know."

  ### Phase 2: The Loop (Rounds 1 & 2) (0:15 – 0:40)
  **Mechanic:** Pure Choice.
  1.  **Deliberation (3 mins):** Participants stand in the center. They may move Left or Right. They can switch as much as they want.
  2.  **Lock (Timer Beep):** They must plant their feet.
  3.  **The Reveal:** You walk down the aisle with the Ledger and the Envelopes.
      *   *The Trick:* As you approach a participant, glance at their feet. Open their envelope. Take the blank card. *Pretend* to read the Ledger. Say, "Ledger says... Damascus." Write "Damascus" on the card *now*, but act as if you are verifying. Hand them the card.
      *   **Outcome:** Every single person finds that Death is in the city they are standing in. **100% Mortality.**
  4.  **Reset:** Return to center.
  5.  **Round 2:** "Try again. Use what you learned."
      *   They will logically switch to the other side.
      *   **Outcome:** You repeat the trick. Death is wherever they stand. **100% Mortality.**

  **Debrief Pause (2 mins):** Ask: "Did anyone find a stable position? A place where, once you stood there, you felt safe?" (Answer: No). "That is the failure of Ratifiability."

  ### Phase 3: The Mixed Strategy (Round 3) (0:40 – 0:55)
  **Mechanic:** Randomization.
  1.  **Instruction:** "Deterministic choices fail. The Ledger predicts your reasoning. You must randomize. Flip a coin. Heads = Damascus, Tails = Aleppo."
  2.  **Action:** They flip. They move.
  3.  **The Reveal:**
      *   *The Trick:* This time, be honest for half, rigged for half? No, to sell the "Dreadful Bet" later, you need to establish that they *think* they have a 50% chance.
      *   **Outcome:** Roughly 50% survive (Match the coin). If someone flipped Heads and stands Damascus, give them Survival. If Tails/Aleppo, Survival. If they mismatched (flipped Heads, stood Aleppo), they Die.
      *   *Note:* This validates the Mixed Strategy *temporarily*. They feel they have cracked it. "I have a 50% chance of survival."

  ### Phase 4: The Exploit (Round 4) (0:55 – 1:05)
  **Mechanic:** The Bet.
  1.  **Offer:** "Before you choose for the final round, you may purchase a 'Safety Policy'. Cost: 2 Tokens. Payout: 20 Tokens if you survive this round."
  2.  **Logic:** "In Round 3, your survival rate was 50%. The Expected Value of this ticket is (0.5 * 20) - 2 = +8 Tokens. A rational evidential agent buys this."
  3.  **Action:** Collect fees. Hand out "Policy Certificates."
  4.  **Choice:** They choose (Randomize or Pick).
  5.  **The Reveal:**
      *   *The Trick:* **Everyone who bought a ticket DIES.** Everyone who *didn't* buy a ticket SURVIVES (if they picked a side).
      *   *How:* When you approach a ticket-holder, write "Death" on their card regardless of where they stand. When you approach a non-ticket-holder, write "Life" (or match their location to let them live).
      *   *Justification in Frame:* "The Ledger predicts dispositions. The kind of agent who buys this ticket is the kind of agent who is already marked. The correlation is absolute."

  ### Phase 5: The Debrief (1:05 – 1:30)
  **Goal:** Map the frustration to the theory.

  1.  **The Loop (Rounds 1 & 2):**
      *   *Concept:* **Ratifiability.**
      *   *Talk:* "In Round 1, you chose Damascus. But the moment you chose it, it became evidence that Death was there. So you wished you had chosen Aleppo. But if you chose Aleppo, it becomes evidence Death is there. There is no 'fixed point' where you can say 'I choose this, and given that I choose this, it is the best choice.' That is what it means for a decision to be unratifiable."

  2.  **The Ambiguity (Causation vs. Prediction):**
      *   *Concept:* **Newcomb vs. Damascus.**
      *   *Talk:* "Did I cause your death? Or did I predict it? In the room, I cheated (admit the envelope trick). But in the thought experiment, it doesn't matter. If the correlation is perfect, Evidential Reasoning treats prediction *as if* it were causation. You couldn't outsmart me because your 'outsmarting' was the very evidence I used."

  3.  **The Mixed Strategy (Round 3):**
      *   *Concept:* **Breaking the Loop.**
      *   *Talk:* "Randomization broke the link between your *reasoning* and your *action*. I couldn't predict the coin flip, only the distribution. So you got 50% survival. This solves the 'Loop'."

  4.  **The Dreadful Bet (Round 4):**
      *   *Concept:* **Exploitability / The Tickles.**
      *   *Talk:* "Here is the sting. In Round 3, you calculated a 50% survival chance. So you bought the ticket. It looked like +EV. But you lost everything. Why? Because the *act of buying the ticket* was itself evidence. A Causal Decision Theorist knows: 'Buying the ticket does not *cause* me to survive. It only signals that I am the type of person Death has already marked.' The Mixed Strategy saves your life, but it doesn't save your wallet. You are still exploitable because your *beliefs* about your survival are decoupled from the *reality* of the prediction."

  ---

  ## 4. Predictable Failures & Mitigations

  | What Will Go Wrong | Why It Happens | How to Handle It |
  | :--- | :--- | :--- |
  | **"You're just writing it down after we choose."** | Tech/Phil types will spot the envelope trick immediately. | **Own it in the Debrief.** During the game: "The mechanics of the Ledger are not for you to audit." In Debrief: "Yes, I rigged it. But did you *feel* the instability? That feeling is the data. The puzzle assumes a perfect predictor; I am a human with a marker. The logical structure is identical." |
  | **"I'll stand in the middle."** | Refusal to engage / Protest. | **Enforce the Penalty.** "The rules state: Center Aisle at zero is Death -5 Tokens." If they persist, gently shame them: "You're opting out of the puzzle. You can watch, but you can't discuss the outcome." |
  | **Group Think (Herd Behavior).** | Everyone goes to Damascus because one loud person did. | **Intervene.** "Death predicts the *group distribution* too. If you all go Damascus, Death is in Damascus." Force them to realize they are competing against the Oracle, not each other. |
  | **Boredom during Reveal.** | Walking to 14 people takes time. | **Speed it up.** Have them write their final choice on a slip of paper and hand it to you. You announce results in bulk. "All Damascus: Dead. All Aleppo: Dead." (For Rounds 1 & 2). Save the envelopes for the final reveal. |
  | **The "Mixed Strategy" feels like winning.** | They might feel 50% survival is a success. | **Pivot hard in Round 4.** Ensure the Ticket Round wipes out their gains. The point is that the Mixed Strategy agent is *still* irrational compared to a CDT agent who knows they can't win. |
  | **Phil Grad Student Nitpicking.** | "This isn't true EDT because..." | **Defer.** "Hold that thought for the debrief. For this round, assume the Oracle is perfect. Experience the constraint first, critique the model second." |

  ---

  ## 5. Limitations (What You Must Supply in Talk)

  Be honest about what the activity *cannot* do. Add these to the end of your debrief:

  1.  **The "Common Cause" Structure:** In the activity, *you* are the common cause (you see them, then write). In the real puzzle, the prediction and the action share a prior cause (the agent's psychology). You must explain that *their own brain* is the Oracle in the real version.
  2.  **Time:** The activity is sequential. The real problem is atemporal (the prediction exists before the deliberation starts).
  3.  **The "Tickle" Defense:** You can't simulate the "tickle" (an internal sensation that screens off the evidence). You have to explain that a sophisticated agent might look for an internal urge to go to Damascus, and if they don't feel it, they go. The activity forces external action, bypassing this nuance.
  4.  **The "Why Ain'cha Rich?" Argument:** The activity shows they lose tokens. You need to explicitly state: "A Causal Decision Theorist would have refused to play, or refused the bet, and walked away with their starting stack. You tried to win and lost. EDT makes you a loser in this specific universe."

  ## 6. Facilitator Cheat Sheet (The "Magic")

  *   **Rounds 1 & 2:** Match *everyone*. (Total wipeout).
  *   **Round 3:** Match the Coin. (50% survival).
  *   **Round 4:** Inverse the Ticket. (Ticket holders Die. Non-holders Live).
  *   **Prop Management:** Keep the Ledger closed until the reveal. Keep the marker in your pocket until the moment of writing. Confidence is 90% of the illusion. If someone questions the envelope, say: "The seal was broken when you opened it to read the result. The prediction was inside." (Gaslight gently).

  ---

  **Final Note:** The goal isn't to prove EDT is "wrong" (philosophers still fight about this). The goal is to make them feel the **vertigo** of a decision theory that eats its own tail. If they leave the room feeling slightly unsettled about their own ability to choose, you've succeeded.
