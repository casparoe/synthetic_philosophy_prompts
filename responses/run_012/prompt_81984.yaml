      *   This is a classic clash between *System 2* (deliberate, rationalist, consequentialist) and *System 1* (intuitive, deontological, tribal) moral processing.
      *   It's also a problem of *Game Theory* and *Signaling*. The "no blame" norm works well for coordination *if* everyone complies. If someone defects (R), the norm can become a shield for exploitation.
      *   The "Insider/Outsider" asymmetry is crucial. It suggests the norm isn't universal truth, but a *tribal bonding mechanism*.

  3.  **Address the Two Arguments:**
