      *   *Connection to Taste:* Hume is setting up a parallel. Just as in morals, in aesthetics, everyone agrees "Beauty is good." But do they agree on *what* is beautiful? No.
      *   *The Goal:* He needs to find a "Standard of Taste." If everyone just says "I like what I like," there's no standard. If everyone agrees "Beauty is good" but disagrees on what *is* beautiful, we need a way to settle the particular disputes.
