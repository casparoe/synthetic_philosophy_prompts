answer: |-
  You are right to trust your instinct over your friend's: this opening section is not throat-clearing. It is doing the heavy lifting of defining the *kind* of problem aesthetics is. If you skip it, the later discussion of the "true judge" will seem to come out of nowhere.

  Here is a close reading of the logic in that stretch of the essay, breaking down the Mahomet example, the linguistic point, and what it commits Hume to regarding objectivity.

  ### 1. The Mahomet Example: General Terms vs. Particulars
  Hume is drawing a distinction between two levels of judgment:
  1.  **General Principles:** Abstract statements like "Justice is good" or "Beauty is desirable."
  2.  **Particular Applications:** Specific judgments like "This action is just" or "This poem is beautiful."

  The Mahomet (Muhammad) passage is designed to show that agreement on **General Principles** is linguistically guaranteed and therefore philosophically useless.

  Hume notes that followers of the Quran insist it contains "excellent moral precepts." Hume's response is essentially: *Of course they say that.* He argues that words like "equity," "justice," and "charity" are "always taken in a good sense." They are what we might call "thick" ethical concepts; they describe an action and praise it simultaneously. You cannot coherently say, "This was an act of justice, but it was bad." If it was bad, you wouldn't call it justice.

  Therefore, when the followers say the Quran contains "justice," they are saying "The Quran contains good moral things." This is a tautology. It costs them nothing to agree to it.

  The **real** test, Hume says, is to ignore the labels and look at the "narration"—the specific actions prescribed. When you do that, Hume claims you find "treachery, inhumanity, cruelty." The disagreement isn't about the definition of the word "virtue"; the disagreement is about whether *these specific actions* deserve that label.

  **What this establishes:** In matters of sentiment (which includes both morals and taste), universal agreement on general rules is cheap. The conflict always lies in the application to particulars.

  ### 2. How the Linguistic Point Operates
  Hume is making a point about the logic of commendatory language.
  *   **In Science/Opinion:** If I say "This is water" and you say "This is fire," we are disagreeing about facts. We can test it.
  *   **In Morals/Taste:** If I say "Virtue is good" and you say "Virtue is good," we appear to agree. But if I call an act of cruelty "virtuous" and you call it "vicious," we agree on the word "virtue" (we both think it means 'good'), but we disagree violently on the world.

  Hume uses this to show that you cannot solve aesthetic disputes by defining terms. You cannot define "beauty" in a dictionary and then measure poems against it, because everyone already agrees "beauty is good." The dispute is never about the definition of beauty; it is always about whether *this specific object* triggers the sentiment of beauty.

  ### 3. Does this carry over to "Beautiful" and "Elegant"?
  Yes, exactly. Hume treats Morals and Taste as parallel domains (both are based on sentiment, not reason).
  *   Just as "Virtue" implies praise, "Beautiful" implies "ought to be liked."
  *   No one argues that "Ugliness is preferable to Beauty." That would be like arguing "Vice is preferable to Virtue."
  *   Therefore, saying "This poem is beautiful" is not a neutral description like "This stone is heavy." It is a commendation.

  This carries over the Mahomet lesson to aesthetics: If everyone agrees beauty is good, but people fight over whether Milton is better than Bunyan, the problem isn't the definition of beauty. The problem is that people's sentiments are misfiring or unrefined. Some people are like the followers of the Quran in Hume's example: they are using the praise-word ("beautiful") for things that (to Hume) don't deserve it.

  ### 4. Does this push toward Objectivity or Subjectivity?
  This is the crux of the essay. This passage commits Hume to a very specific, nuanced position that is neither pure objectivism nor pure relativism.

  *   **Against Objectivism (Realism):** Hume is saying beauty is not a property inherent in the object, like weight or shape. If it were, we wouldn't have this problem of "general agreement but particular disagreement." In geometry, if we agree on definitions, we agree on the proofs. In taste, we agree on definitions ("beauty is good") but disagree on the proofs (which poems are beautiful). This suggests beauty is a sentiment *in the viewer*, not a fact *in the poem*.
  *   **Against Relativism ("Eye of the Beholder"):** However, Hume refuses to let all sentiments be equal. In the Mahomet passage, he does not say, "Well, they think cruelty is virtuous, and I think it's vicious, and who's to say?" He explicitly judges them. He says their sentiment is *wrong* because it is "incompatible with civilized society."

  **The Commitment:** This passage sets up the need for a **Standard of Taste.**
  If beauty were purely objective (in the object), we wouldn't need a standard; we'd just measure it.
  If beauty were purely subjective (anything goes), we wouldn't need a standard; your liking would be as valid as mine.
  Hume argues: Beauty is a sentiment (subjective origin), *but* some sentiments are healthier, more refined, and more correct than others (objective standard of judgment).

  The Mahomet example proves that we *do* criticize moral sentiments. We don't accept the fanatic's sentiment as valid just because he feels it strongly. Hume wants to do the same for art. He needs to find a way to say, "Your feeling that this bad poem is beautiful is a defective feeling," just as he says, "Your feeling that this cruelty is virtuous is a defective feeling."

  ### 5. Is the Claim about "Opinion" Plausible?
  You are right to be skeptical here. Hume claims that in matters of opinion/science, men differ more in terms than particulars, whereas in taste, the reverse holds.

  *   **Hume's Logic:** He thinks scientific disputes are often just verbal confusion. If we clearly defined our terms, we'd see we agree on the facts. He views science as converging toward truth.
  *   **The Weakness:** This is arguably the weakest empirical claim in the essay. Scientists often disagree deeply on particulars (data, interpretation, causality), not just definitions.
  *   **Why he makes the claim:** He needs this contrast to isolate the problem of Taste. He wants to show that Taste is *harder* than Science. In Science, if we agree on terms, the dispute ends. In Taste, even if we agree on terms ("Beauty is good"), the dispute *continues*.

  He is exaggerating the agreement in science to highlight the stubbornness of aesthetic disagreement. He is telling you: "Don't try to solve aesthetic disputes like scientific ones. You can't just define your way out of it, because the disagreement isn't about the definition, it's about the sentiment."

  ### Summary for your Seminar
  If you are asked about this passage, you can argue:
  1.  **It is not throat-clearing.** It establishes that aesthetic disputes are about **particulars**, not definitions.
  2.  **The Mahomet example** shows that general moral terms are linguistically loaded with praise, making agreement on them meaningless. The real judgment is in the specific application.
  3.  **This applies to Beauty.** "Beautiful" is a commendatory term. Everyone agrees beauty is good; the fight is over what *is* beautiful.
  4.  **On Objectivity:** It commits Hume to the view that beauty is a **sentiment** (not an objective property), but that sentiments can be **correct or incorrect** (not merely relative). This necessitates the "Standard of Taste" he develops later: a way to distinguish the defective sentiment (the fanatic) from the true sentiment (the civilized judge).

  Hume is essentially warning you: Do not look for beauty in the object, and do not look for it in the dictionary definition. You have to look for it in the quality of the human response. That is the work this opening section is doing.
