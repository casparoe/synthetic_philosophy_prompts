      *   *The Claim about Opinion:* In matters of fact/science, people agree on the *things* but fight over the *words*. (e.g., We see the same circle, but argue about the definition). Hume thinks these are resolvable.
      *   *The Claim about Sentiment:* In matters of taste, people agree on the *words* (e.g., "virtue is good") but disagree on the *things* (e.g., Is *this* action virtuous?).
      *   *The Mahomet Example:*
