      *   **The Tragedy:** The Impetuous player wins big in Phase 1, accumulates status/resources, then gets wiped in Phase 2 because they *cannot* play cautiously. The Cautious player survives Phase 1 mediocrely, then thrives in Phase 2.
      *   **Wait, the prompt says:** "One who can't switch goes under... because a man who's been winning one way can't be persuaded to leave the road he's on."
      *   *Correction:* It's not just mechanical inability; it's psychological. But for a game, we need a mechanical representation of psychological rigidity. Let's make the "Nature" a card they hold. They *must* play according to the card.
      *   *Better:* Let them *choose* their strategy initially based on incentives. Then change incentives. See if they switch. Machiavelli says they won't.
