      *   *Idea 2: War Simulation.* Attack/Defend. Terrain changes. *Critique:* Hard to manage with 18 students in 90 mins without chaos.
      *   *Idea 3: Resource Extraction.* Mining vs. Farming. Weather changes. *Critique:* Good, but needs to emphasize the *psychological lock-in*.
      *   *Idea 4: The "Architect" Game.* Players build structures to withstand "storms." *Critique:* A bit static.
      *   *Idea 5: The "Policy Maker" Game.* Players choose a governing style (Impetuous vs. Cautious). Events happen. *Winner:* This aligns best with political theory.

