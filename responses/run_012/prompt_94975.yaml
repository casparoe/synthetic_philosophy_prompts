answer: |-
  *   **The Dispute:** Elara, a legal archivist on the colony world Ostra, is tasked with interpreting the founding "Charter of Lumens" during a border conflict with the neighboring Kaelen species over mining rights to luminous cave deposits.
  *   **The Scientific Twist:** New spectrography reveals "sheen" is actually two distinct minerals: Type-Alpha (burns hot, historically mined by Ostra) and Type-Beta (burns cold, historically discarded by Ostra but used by Kaelen).
  *   **The Council Argument:** Councilor Heston argues from conceivability: since the founders could have landed where only Beta existed and called *that* "sheen," the word must refer to the descriptive role ("glowing cave stuff"), not the chemical essence, meaning Ostra owns Beta too.
  *   **The Counter-Argument:** The Kaelen envoy insists "sheen" is anchored to what was actually dug up and burned in the first lamps (Alpha), making the identity fixed regardless of descriptive possibilities.
  *   **The Realization:** In the archives, Elara reads the founder's journal entry where the word was coined over a mixed lump, feeling the tension between the intention (whatever glows) and the object (this specific rock).
  *   **The Resolution:** Elara drafts a ruling that splits rights based on usage vs. discovery, physically feeling the word "sheen" fracture into two distinct weights in her mind as she writes the verdict.

  ***

  The dust in the archives tasted of old paper and oxidized copper, but Elara's mouth tasted of bile. On the desk before her lay the Charter of Lumens, the founding document of Ostra, and next to it, the spectrographic report that threatened to unravel three generations of law.

  The Charter was simple, born of desperation and hope. It granted the Colony of Ostra exclusive rights to "all sheen within the system." When the founders wrote those words, "sheen" was a gesture. It was the luminous rock they found in the basalt caves, the stuff that kept the darkness back and the generators humming. They didn't know chemistry. They knew light.

  Now, the University's lab said there was no such thing as "sheen." There was Type-Alpha, a volatile isotope that burned blue-hot, and Type-Beta, a stable compound that glowed a sickly green. Ostra had been mining Alpha for decades, throwing the Beta into slag heaps. The Kaelen, the insectile neighbors from the outer rim, had been collecting the slag. They called it *kthara*. Now they claimed the slag heaps were on disputed soil, and that the Charter's definition of "sheen" included everything that glowed in the caves, not just the blue stuff.

  The council chamber was overheated, the air thick with the scent of nervous sweat. Councilor Heston stood at the podium, waving a handful of green ore.

  "It is a matter of imagination," Heston said, his voice booming off the concrete walls. "Close your eyes. Imagine the ancestors landing here. Imagine that the blue veins were absent, that the caves held only this green stone. Would they have frozen in the dark? No. They would have dug this. They would have burned this. And they would have called it 'sheen'."

  He slammed the green rock onto the lectern. "Therefore, 'sheen' is not this specific chemical configuration. It is a role. It is 'the glowing stuff in the caves.' Since this green stone fills the role, it is sheen. The Charter grants us all sheen. Therefore, the slag heaps are ours."

  The Kaelen envoy, a tall, chitinous figure named Vriss, clicked its mandibles. "You speak of ghosts," Vriss said, its translation box humming. "You speak of what might have been. We speak of what is. Your ancestors picked up the blue stone. They built their lamps for the blue stone. The word 'sheen' latched onto that substance. If you had found green stone, you would have called it 'kthara', or something else. But you found blue. So 'sheen' is blue. The green is ours."

  Elara sat in the back, her pen hovering over her notepad. The argument circled itself, a snake eating its own tail. Heston was arguing from the inside of the situation: *If we treat this world as the actual one, what fits the description?* Vriss was arguing from the outside: *Given what we actually found, what does the word lock onto across all possibilities?*

  Both sounded true. Both sounded impossible.

  "Elara," the Chief Magistrate said, noticing her stillness. "You are the Keeper of the Charter. Does the text clarify the intent?"

  "The text is silent on chemistry, Magistrate," Elara said softly. "I need to see the moment of naming."

  She was granted leave to retreat to the deep archives, to the box of personal effects belonging to Commander Halloway, the first landing party leader. The box contained a rusted compass, a dried ration pack, and a leather-bound logbook.

  Elara sat on the floor of the vault, the air cool and still. She opened the logbook to the date of arrival. The handwriting was jagged, hurried.

  *Day 4. Found the caves. The walls breathe light. We gathered a pile of the stuff. It's heavy. Some pieces glow blue, some green. Doesn't matter. It's all sheen. We need light.*

  Elara stopped. She reached into her pocket and pulled out a small specimen case she'd authorized for evidence. Inside were two rocks. One blue, one green.

  She looked at the logbook. *It's all sheen.* Halloway hadn't distinguished. To him, the word was a net cast over everything that satisfied the condition of glowing in the cave. If the world had been different, if only green existed, the net would have caught only green. The word was defined by the search, by the need for light.

  But then she looked at the blue rock in her hand. This was what had powered the colony. This was what the word "sheen" had come to mean when a technician asked for a "sheen cell." If you asked for sheen today, and someone handed you green rock, you would say they were wrong. The word had hardened around the blue substance. It had become a name for *this* stuff, regardless of where it was found.

  Elara closed her eyes. She tried to say the word internally. *Sheen.*

  It felt wrong. It felt like holding a object that was simultaneously fluid and solid. She could feel the meaning sliding. On one hand, the word was a promise: *Whatever glows, we own.* That felt true, anchored in the history of the founders' needs. It was a truth she could know just by understanding the language of the Charter, without looking at the rocks.

  On the other hand, the word was a label: *This specific blue isotope.* That felt true anchored in the physical reality of the colony's survival. It was a truth she knew only by looking at the history of what they actually burned.

  The two meanings sat in her mind like two gears that refused to mesh. If she turned the gear of "description," the green rock was sheen. If she turned the gear of "reference," the green rock was waste. The sentence "Sheen is Type-Alpha" was true in one sense necessarily—it couldn't be otherwise given what we actually have—and false in another sense, because we can imagine a world where it isn't.

  She opened her eyes. The dust motes dancing in the vault light looked like tiny stars. She realized the Charter wasn't a scientific document. It was a bridge between what the founders intended and what the descendants inherited.

  Elara returned to the council chamber an hour later. The tension had tightened into silence. Heston looked expectant; Vriss looked ready to depart.

  "I have reviewed the founding log," Elara said, placing her draft judgment on the central table. "Commander Halloway wrote: 'It's all sheen.' He used the word descriptively. He meant the glowing function."

  Heston smiled, triumphant.

  "However," Elara continued, her voice steady, "The Charter is a legal instrument governing resource allocation, not geological description. Legal rights attach to utility and established usage. For three generations, 'sheen' has functioned as a rigid designator for Type-Alpha in all commercial and technical contexts. To redefine it now based on a counterfactual imagination would destabilize every contract written in the last fifty years."

  She slid the paper toward the Magistrate. "My ruling is this: The Charter's grant of 'all sheen' applies to the substance historically utilized and recognized as such by the Colony at the time of ratification. That is Type-Alpha. The Colony retains exclusive rights to Alpha deposits."

  Heston's face fell. "But the logic—"

  "The logic holds," Elara interrupted gently. "But the word has two lives. In the mouth of the founder, 'sheen' meant 'whatever lights the cave.' In the hand of the engineer, 'sheen' means 'Type-Alpha.' The Charter protects the founder's intent, but the law protects the engineer's reality."

  She turned to Vriss. "The Type-Beta deposits, historically discarded by Ostra and utilized by the Kaelen as *kthara*, fall outside the established technical definition of 'sheen' within the Colony's jurisdiction. The slag heaps are Kaelen property."

  Vriss clicked its mandibles, a sound that might have been satisfaction. "You distinguish the word from the thing," the envoy said. "You say the name stays with the blue, even if the description fits the green."

  "I say the name does two jobs," Elara replied. "It honors the past, and it secures the future. Sometimes those are different things."

  The council dispersed, the immediate crisis dissolving into the bureaucracy of implementation. Elara stayed behind, packing her papers. She picked up the specimen case again. The blue rock sat next to the green one.

  She picked up the blue stone. It was cold, heavy, undeniable. This was what the word pointed to when the colony spoke in unison. It was necessary that this was sheen, because this was what they had.

  Then she picked up the green stone. It was lighter, cooler. This was what the word would have pointed to if history had taken a left turn instead of a right. It was conceivable that this was sheen.

  For a moment, just a heartbeat, she felt the word "sheen" stretch. It wasn't a single thread anymore. It was a braid, two strands twisted together but not fused. One strand was anchored to the world as it was, holding the blue stone fast. The other strand was anchored to the mind of the speaker, reaching out to catch anything that fit the description.

  She put the stones back in the case and latched it. The click was final. The word settled back into its usual shape, comfortable and single-meaning again for everyone else. But Elara knew better. She walked out of the chamber into the corridor, where the lamps hummed with blue light. She looked at the glow, and for a second, she saw the green ghost behind it, the shadow of what could have been, waiting in the wings of language. She whispered the word to herself, feeling the double weight of it, heavy with history and light with possibility, before stepping into the light.
