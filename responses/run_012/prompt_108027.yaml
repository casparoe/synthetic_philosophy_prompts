answer: |-
  ### The Case: The Unmonitored Fare

  You are stranded at a late-night airport in a city where you know no one. A stranger pulling a similar suitcase proposes sharing a taxi to the city center to split the fare, which is substantial. The driver only accepts cash, which the stranger has. The deal is simple: they pay the driver now; you Venmo them half the fare once you arrive at your respective hotels. You exchange names and addresses, but nothing else. Once you part ways in the lobby, there is no way for them to chase the money, no legal recourse, and no mutual acquaintance who will ever learn whether you paid. You stipulate, for the sake of the argument, that you feel no guilt at the thought of keeping the money, derive no warm glow from honesty, and care nothing for your self-image as a trustworthy person.

  You arrive at your room and open the payment app. The benefit of the ride is already enjoyed; the money is still in your account. To send the money, you must act on a motive of simple fidelity—doing it because you said you would. However, your psychology is such that this motive is fragile: if you stop to interrogate *why* you are sending the money, asking what value this transaction holds for you now that the ride is over, the motive evaporates. The concern is of the kind that dissolves when examined for its usefulness, like a spontaneous kindness that cools the moment it becomes a calculation. To keep the money, you need only deliberate; to send it, you must act without asking what the action is worth to you.

  ***

  ### The Working

  **The Verdicts**
  *   **Self-Interest Theory (S):** At the first moment (the lobby), S approves of taking the arrangement. The benefit of the ride outweighs the *expected* cost of the payment (since there is a chance you might pay). At the second moment (the hotel room), S disapproves of paying. The money is yours; paying yields no future return, no reputation boost, and no psychological relief. S requires you to deliberate to find the optimal outcome, but that very deliberation destroys the motive required to pay. Thus, S is **indirectly self-defeating**: if you follow S, you secure the ride but fail to pay, which means the stranger (knowing you follow S) would not have offered the ride in the first place.
  *   **Present-Aim Theory (P):** P asks what best achieves your aims *now*. If your current aim is simply to maximize wealth, P agrees with S (don't pay). If your current aim includes "keeping my word" as an intrinsic goal, P agrees with Morality (pay). P is neutral on the rationality of the aim itself.
  *   **Common-Sense Morality (C):** C requires you to pay. The promise creates an obligation independent of consequences. C succeeds where S fails: it secures the motive that makes the initial cooperation possible.

  **The Single Feature Doing the Work**
  The operative feature is **Motivational Fragility under Instrumental Scrutiny**. The case works only because the motive required to secure the benefit (fidelity) cannot survive being treated as a tool for self-interest. It must be viewed as an end in itself to function.

  **If That Feature Is Removed**
  If the motive were robust—if you could calculate "It is in my interest to pay" and still feel compelled to pay—then S would not be self-defeating. You could adopt S, calculate that paying maintains a useful disposition, and pay. The paradox vanishes. The case relies on the motive being *essentially* non-instrumental.

  **The Self-Interest Defender's Attack**
  A defender of S would argue that you *should* have bound yourself earlier. They would claim that a rational agent would have cultivated a disposition to pay *before* entering the taxi, making the payment automatic and thus bypassing the destructive deliberation at the hotel. They would argue that failing to cultivate this disposition was the true irrationality, not the failure to pay.

  **Response to the Defender**
  The case stipulates you have "no way to bind herself in advance, no way to alter her own desires or character by an act of will." You are confronted with the situation as you are. S cannot tell you to be someone else; it must tell you what to do now. At the "now" of the hotel room, S tells you to deliberate, and deliberation kills the payment.

  ***

  ### Self-Critique and Vulnerability

  My reasoning is likeliest to fail on the **psychological stipulation**. I have asserted that deliberation *necessarily* destroys the motive ("the motive has to be of the kind that dissolves"). A critic could argue this is an empirical claim that is not universally true. A sophisticated agent might deliberate, conclude "I should pay," and do so without the motive dissolving, treating "integrity" as a higher-order interest.

  **What Would Change My Mind:**
  If it can be demonstrated that "integrity" or "fidelity" can be coherently valued as a *self-interested asset* without ceasing to be integrity. If I can want to be honest *for my own sake* without that desire corrupting the honesty, then S is not self-defeating; it simply requires a broader definition of "interest" that includes the satisfaction of acting morally. If the "warm glow" I stipulated away is actually inseparable from the act of promise-keeping itself, then S can accommodate the act after all, and the paradox collapses. I am assuming a separation between "doing the right thing" and "getting what I want" that a monist about value might deny.
