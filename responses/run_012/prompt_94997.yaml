answer: |-
  ### Memorandum: The Qualitative Impact Protocol (QIP)

  **To:** The Ethics Committee
  **From:** The Standing Philosopher
  **Subject:** Replacing the "Pleasure Tally" with a Decision Procedure

  You are right that we need a procedure. You are wrong that pleasure is a single currency. If we continue to treat a bird's existence, a resident's cigarette, and a pudding's sweetness as interchangeable units, we will eventually make a decision that is mathematically sound and morally abhorrent.

  We cannot solve the metaphysical debate about the nature of pleasure in 90 minutes. However, we can install a procedure that forces us to acknowledge that debate before we vote. This protocol does not calculate *how much* pleasure; it categorizes *what kind* of good is at stake. It is designed to break the habit of "totting up."

  Here is the procedure. It has four gates. You must pass through them in order. If you fail a gate, the motion dies or is kicked upstairs.

  ***

  ### The Procedure (90-Minute Cap)

  #### Gate 1: The Taxonomy Check (15 Minutes)
  **Question:** Is the proposed benefit a *Sensation* (something that happens to the body) or an *Engagement* (something the person does or relates to)?
  *   **Sensation:** Warmth, taste, pain relief, nicotine hit.
  *   **Engagement:** Socializing, caring for a pet, choosing a meal, smoking ritual.
  *   **Rule:** You cannot trade one Engagement for two Sensations. Engagements trump Sensations.
  *   **Stop Condition:** If the proposal offers only Sensations but removes an Engagement, the motion is **Rejected**.
  *   **Why:** This encodes the Millian distinction (higher/lower) and Ryle's attitude theory (pleasure is in the doing) without using the jargon.

  #### Gate 2: The Agency Audit (20 Minutes)
  **Question:** Who is the locus of the pleasure? Is the resident an *Agent* (choosing) or a *Recipient* (receiving)?
  *   **Rule:** If the resident is an Agent, their stated preference counts as 10 units. If they are a Recipient (e.g., severe dementia), we must use "Substituted Judgment" (what would they have wanted?) not "Best Interest" (what makes them quietest?).
  *   **Stop Condition:** If the proposal treats an Agent as a Recipient to save time/money, the motion is **Rejected**.
  *   **Why:** This prevents paternalism disguised as care.

  #### Gate 3: The Threshold Rule (25 Minutes)
  **Question:** Does this proposal affect a *Baseline Need* (safety, nutrition, hygiene) or an *Enhancement* (variety, luxury, aesthetic)?
  *   **Rule:** Baseline Needs are lexicographically prior. You cannot sacrifice a Baseline Need for an Enhancement.
  *   **The "Little vs. Lot" Handler:** If someone argues "A little Safety is worth a lot of Taste," you stop. Safety is Baseline. Taste is Enhancement. The argument is invalid.
  *   **Exception:** If the Baseline is already met by *both* options, you revert to Gate 1 (Engagement vs. Sensation).
  *   **Why:** This handles incommensurability. It says some values don't trade off; they stack.

  #### Gate 4: The Value Handoff (20 Minutes)
  **Question:** Is the disagreement about *facts* (will this cost more?) or *values* (is smoking dignified?)?
  *   **Rule:** If two members disagree on Gate 1, 2, or 3, check the minutes. If the disagreement is about the definition of "dignity" or "risk," the committee has no authority to decide.
  *   **Action:** Mark as **"Unresolvable Value Conflict."** Hand the decision to the Director with a split recommendation.
  *   **Why:** Ethics committees often pretend value conflicts are calculation errors. They aren't.

  #### Sign-Off (10 Minutes)
  *   If Gates 1–3 are passed and Gate 4 is clear: **Approve.**
  *   If any Gate fails: **Reject.**
  *   If Gate 4 triggers: **Refer.**

  ***

  ### What This Procedure Cannot Do (The Honest Bit)

  Before you use this, you need to know where it breaks. I am trading philosophical depth for bureaucratic utility. Here is what gets lost:

  1.  **It cannot measure Virtue:** This procedure is consequentialist. It looks at outcomes. It cannot account for whether the *staff* become better or worse people by implementing the decision. (e.g., Lying to a resident to make them happy might pass Gate 2, but it corrodes the staff's integrity).
  2.  **It cannot handle "Adaptive Preferences":** If a resident has been depressed for five years and says they prefer nothing, Gate 2 treats that as their will. Philosophy tells us desires can be distorted by oppression or illness. This checklist cannot fix that.
  3.  **It kills Wisdom:** A checklist replaces *phronesis* (practical wisdom) with compliance. You will feel like you are following rules rather than thinking. That is the price of making ethics "runnable."
  4.  **It assumes commensurability within categories:** Gate 3 says Safety > Taste. But what if the Safety risk is 0.01% and the Taste loss is 100%? The procedure is blunt. It does not do nuance well.

  ***

  ### Test Run: The Three Cases

  Here is how the QIP handles your current backlog.

  #### Case 1: The Aviary (East Wing)
  *   **Proposal:** Remove the aviary to create a new storage room for linens.
  *   **Gate 1 (Taxonomy):**
      *   *Pro-Removal:* Storage is logistical (Sensation/Utility).
      *   *Anti-Removal:* Watching birds is visual (Sensation) but feeding them is caring (Engagement).
      *   *Finding:* Evidence shows 4 residents actively feed birds. This is an **Engagement**. Storage is a **Sensation** for staff (ease of work).
      *   *Result:* Engagement trumps Sensation.
  *   **Gate 2 (Agency):** Residents choose to feed birds. They are Agents.
  *   **Gate 3 (Threshold):** Storage is logistical, not a Baseline Need (linens can be stored elsewhere, just less conveniently).
  *   **Decision:** **REJECT.** Keep the aviary.
  *   **Philosophical Win:** We recognized that "watching" can be an active engagement, not just passive reception.

  #### Case 2: The Cheaper Caterer
  *   **Proposal:** Switch to "BulkNutri" contract. Saves 15% budget. Food is nutritionally identical but bland (pureed textures, limited choice).
  *   **Gate 1 (Taxonomy):**
      *   *Current:* Choice of menu (Engagement) + Taste (Sensation).
      *   *Proposal:* No choice (Recipient) + Bland (Sensation).
      *   *Finding:* The proposal reduces Engagement to Recipient status.
      *   *Result:* **REJECT?** Wait. Check Gate 3.
  *   **Gate 3 (Threshold):**
      *   *Argument:* The 15% savings is reallocated to Nursing Staff ratios.
      *   *Analysis:* Nursing Staff ratios affect **Safety/Baseline Need** (falls, medication errors). Food Taste is an **Enhancement**. Food Choice is an **Engagement**.
      *   *Conflict:* We are trading Engagement (Choice) for Baseline (Safety).
      *   *Procedure Rule:* Baseline Needs are lexicographically prior. Safety > Choice.
      *   *Finding:* If the staffing increase prevents physical harm, Gate 3 mandates the switch.
  *   **Decision:** **APPROVE.** Switch caterer.
  *   **The Professor's Discomfort:** I hate this. We have just decided that keeping residents safe is more important than letting them enjoy their food or choose their meals. We have reduced the "Good Life" to "Safe Existence." The procedure worked, but it validated a bureaucratic utilitarianism that sacrifices the *quality* of living for the *duration* of living. It treats the residents as biological machines to be kept running, not people to be fed. This is what happens when you try to proceduralize Mill; you often end up back with Bentham.

  #### Case 3: The Smoking Room
  *   **Proposal:** Convert the linen closet into a ventilated smoking room.
  *   **Gate 1 (Taxonomy):**
      *   *Analysis:* Smoking is a chemical hit (Sensation) but also a social ritual and a habit of identity (Engagement).
      *   *Finding:* It qualifies as Engagement (social/ritual).
  *   **Gate 2 (Agency):**
      *   *Analysis:* Residents are Agents. They choose to smoke.
      *   *Finding:* Preference counts.
  *   **Gate 3 (Threshold):**
      *   *Argument:* Smoking causes cancer/heart disease (Safety/Baseline).
      *   *Counter-Argument:* Most residents are 85+. The latency of cancer exceeds life expectancy. The immediate risk is fire (Safety).
      *   *Mitigation:* Ventilation and supervision mitigate Fire Risk to Baseline levels.
      *   *Health Risk:* If the health risk is long-term, it is not a Baseline *Safety* issue in the context of palliative care; it is a Quality of Life issue.
      *   *Finding:* Safety is secured via ventilation. Health is secondary to Autonomy in this specific demographic context.
  *   **Gate 4 (Value Handoff):**
      *   *Conflict:* One member says "Smoking is inherently undignified." Another says "Freedom is dignity."
      *   *Procedure:* This is a Value Conflict.
      *   *Action:* **REFER TO DIRECTOR.**
  *   **Decision:** **SPLIT RECOMMENDATION.**
  *   **Philosophical Win:** The procedure correctly identified that "dignity" is not a fact we can calculate. It forced the Director to take the heat for the value judgment.

  ***

  ### Summary of Limitations

  You asked me to be honest about what breaks. Look at **Case 2 (The Caterer)**.

  The procedure approved the bland food. Why? Because I built Gate 3 to prioritize "Safety" over "Enhancement." In doing so, I codified a specific philosophical bias: that *negative rights* (freedom from harm) are more important than *positive capabilities* (the ability to flourish).

  Aristotle would tell you that a life without gustatory pleasure or choice is not a *human* life, even if it is a *safe* one. By making the procedure "runnable," I forced you to categorize "Food Choice" as an Enhancement rather than a Constitutive Good. I did that because if I let you argue that "Food Choice is a Baseline Need," you would argue that *everything* is a Baseline Need, and the budget breaks.

  So, the procedure saves you time, but it buys that time by simplifying the human good. It will stop you from doing stupid things (like counting bird-units), but it will not stop you from doing cold things (like trading joy for safety). That is the best you can get in 90 minutes.
