  ### Scratch Space: Mapping the Logical Space

  Before constructing the tree, I need to map the dimensions of disagreement to ensure the branching questions carve out the actual philosophical space rather than just sorting pre-packaged labels.

  1.  **Evidence Dimension:** Does the indexical fact "I am awake now" shift probability mass?
      *   *No:* Credence in Heads remains 1/2 (Halfer territory).
      *   *Yes:* Credence shifts away from 1/2 (Thirder/SIA territory).
  2.  **Weighting Dimension:** What determines the probability weight of a world?
      *   *Worlds:* Each possible world counts equally regardless of observer count (SSA/Halfer).
      *   *Observer-Moments:* Probability is proportional to the number of observers/awakenings (SIA/Thirder).
      *   *Hybrid:* Some shift, but not proportional to count.
  3.  **Updating Dimension:** How does specific self-locating info (e.g., "It is Monday") interact with the coin?
      *   *Reset:* Returns credence to the prior (1/2).
      *   *Conditional:* Updates via standard conditionalization (often yields 2/3 for Halfers).
  4.  **Normative Dimension:** What constrains the credence?
      *   *Epistemic:* Fit with evidence only.
      *   *Pragmatic:* Avoidance of Dutch Books/sure losses.

  **Pruning Decision:**
  *   The combination "New Evidence = No" and "Weighting = Observer-Moments" is incoherent. If waking gives no evidence, observer count cannot shift credence. I will prune this branch.
  *   The combination "New Evidence = Yes" and "Weighting = Worlds" is unstable but logically possible (Centered Worlds view). I will keep it but limit its branching to avoid inflating leaves beyond 12.
  *   I will discard the prompt's candidate node (ii) ("exhausted by facts about where and when") because it requires metaphysical distinctions students won't have yet. I will replace it with the "Weighting" question (Does observer count matter?), which is more directly testable via the Twin and Many-Observers variants.

  ***

  ### Diagnostic Decision Tree: Self-Locating Credence

  **Instructions:** Answer each question based on your intuitions about the case descriptions. Do not worry about where the branch leads.

  **Node 1: The Evidence Question**
  When you wake up in the experiment, does the mere fact that you are awake provide any evidence about the coin toss that you did not have on Sunday night?
  *   **(No)** → Go to Node 2A
  *   **(Yes)** → Go to Node 2B

  **Node 2A: The Monday Question (For "No Evidence" answers)**
  If you are told truthfully that it is Monday, does your credence that the coin landed Heads become exactly 1/2?
  *   **(Yes)** → Go to Node 3
  *   **(No)** → Go to Node 3

  **Node 2B: The Counting Question (For "Yes Evidence" answers)**
  In a case where one coin outcome creates vastly more observers than the other, does the sheer number of observers make that outcome more likely to be the one you are in?
  *   **(Yes)** → Go to Node 3
  *   **(No)** → Go to Node 3

  **Node 3: The Pragmatic Question**
  If holding a specific credence makes you susceptible to a set of bets that guarantee a loss (a Dutch Book), does that prove your credence was irrational?
  *   **(Yes)** → **LEAF**
  *   **(No)** → **LEAF**

  *(Note: To maintain a manageable handout, Node 3 applies to all paths. However, for the "Yes Evidence / No Counting" path, the Pragmatic split is theoretically moot, so those two endpoints are merged into a single leaf in the key below to reflect the lack of live debate there.)*

  ***

  ### Leaf Key: Positions and Commitments

  **1. The Double Halfer (Pragmatic)**
  *   **Description:** Waking gives no evidence; Monday resets credence to 1/2; betting constraints dictate rationality.
  *   **Awkward Commitment:** You must accept that you are vulnerable to a Dutch Book on Sunday that you cannot avoid, yet claim rationality on waking.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  **2. The Double Halfer (Purist)**
  *   **Description:** Waking gives no evidence; Monday resets credence to 1/2; betting constraints are irrelevant to truth.
  *   **Awkward Commitment:** You must endorse a credence that leads to guaranteed financial loss as epistemically sound.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  **3. The Lewis Halfer (Pragmatic)**
  *   **Description:** Waking gives no evidence; Monday does *not* reset credence (P(Heads|Mon) = 2/3); betting constraints dictate rationality.
  *   **Awkward Commitment:** You must believe that learning it is Monday makes Heads *more* likely, despite the coin being fair.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  **4. The Lewis Halfer (Purist)**
  *   **Description:** Waking gives no evidence; Monday does *not* reset credence; betting constraints are irrelevant.
  *   **Awkward Commitment:** You must accept that your credence function violates the reflection principle without pragmatic penalty.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  **5. The Standard Thirder (Pragmatic)**
  *   **Description:** Waking gives evidence; observer count matters; Monday resets credence to 1/2; betting constraints dictate rationality.
  *   **Awkward Commitment:** You must treat your current awakening as a random sample from all possible awakenings, implying you are likely in the world with more people.
  *   **Prediction (b) Twin Variant:** P(Heads) = 2/3 (since Heads yields 4 wakes, Tails 2).
  *   **Prediction (d) Many-Observers:** P(Vast World) ≈ 1.

  **6. The Standard Thirder (Purist)**
  *   **Description:** Waking gives evidence; observer count matters; Monday resets credence to 1/2; betting constraints are irrelevant.
  *   **Awkward Commitment:** You must maintain that a credence leading to sure-loss betting is epistemically correct.
  *   **Prediction (b) Twin Variant:** P(Heads) = 2/3.
  *   **Prediction (d) Many-Observers:** P(Vast World) ≈ 1.

  **7. The SIA Hybrid (Pragmatic)**
  *   **Description:** Waking gives evidence; observer count matters; Monday does *not* reset credence; betting constraints dictate rationality.
  *   **Awkward Commitment:** You must hold that even on Monday, the sheer number of observers in the Tails world keeps P(Heads) low.
  *   **Prediction (b) Twin Variant:** P(Heads) = 2/3.
  *   **Prediction (d) Many-Observers:** P(Vast World) ≈ 1.

  **8. The SIA Hybrid (Purist)**
  *   **Description:** Waking gives evidence; observer count matters; Monday does *not* reset credence; betting constraints are irrelevant.
  *   **Awkward Commitment:** You combine the "presumptuous" metaphysics of SIA with a refusal to align with betting odds.
  *   **Prediction (b) Twin Variant:** P(Heads) = 2/3.
  *   **Prediction (d) Many-Observers:** P(Vast World) ≈ 1.

  **9. The SSA Thirder**
  *   **Description:** Waking gives evidence; observer count does *not* matter; Monday resets credence to 1/2. (Pragmatic split merged).
  *   **Awkward Commitment:** You must explain why waking provides evidence if not via observer counts, yet still shifts credence to 1/3.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  **10. The Centered-Worlds Halfer**
  *   **Description:** Waking gives evidence; observer count does *not* matter; Monday does *not* reset credence. (Pragmatic split merged).
  *   **Awkward Commitment:** You update on waking but maintain a 1/2 credence, requiring a non-standard updating rule.
  *   **Prediction (b) Twin Variant:** P(Heads) = 1/2.
  *   **Prediction (d) Many-Observers:** P(Vast World) = 1/2.

  ***

  ### Instrument Notes

  **Unoccupied Logical Space**
  The branch combining **"No Evidence" (Node 1)** with **"Observer Count Matters" (Node 2B)** is unoccupied. This combination is incoherent: if waking provides no new evidence, the number of awakenings cannot rationally shift credence from the Sunday prior. Any student selecting this path is likely misunderstanding the definition of "evidence."

  **Indistinguishable Leaves**
  The tree cannot empirically separate **Leaf 1 (Double Halfer Pragmatic)** and **Leaf 2 (Double Halfer Purist)**. Both assign identical credences in all scenarios (1/2 on waking, 1/2 on Monday). They differ only on the normative status of Dutch Books. To separate them, a further question is needed: *"Is rationality defined solely by accuracy (fit with truth) or also by decision-theoretic coherence?"*

  **Label Equivalences**
  **Leaf 5 (Standard Thirder)** and **Leaf 7 (SIA Hybrid)** are often conflated in literature. However, this tree distinguishes them based on the **Monday Question**. Standard Thirders believe learning it is Monday returns the coin to fairness (1/2); SIA Hybrids believe the observer count continues to skew probability even on Monday. If a student finds this distinction negligible, they should treat these labels as variant names for the same underlying view.

  ***

  ### Instructor's Note on Discriminating Power

  The single question doing the most discriminating work is **Node 2B (The Counting Question)**. It is the only node that forces a divergence on the **Many-Observers Variant (d)** and the **Twin-Subject Variant (b)**. Without this node, the "Halfer" and "Thirder" labels collapse into a simple dispute about the standard case, failing to capture the crucial metaphysical split between Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA). I discarded candidate node (ii) from your list ("is the difference exhausted by facts about where and when") because it requires students to understand the metaphysics of centered worlds before they can answer; the "Counting" question achieves the same diagnostic end using only arithmetic intuitions about the variants. I also discarded candidate (v) ("no new evidence at all") as it is simply the negation of candidate (i), and using both would create a redundant branching structure.
