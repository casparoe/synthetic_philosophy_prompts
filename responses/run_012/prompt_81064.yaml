answer: |-
  Can one theory supply both an explanation of why escalation happens to those who know better and a decision procedure for escaping it? No. A theory that explains the behavior as *rational* (given specific constraints) validates the escalation, rendering the decision procedure "continue." A theory that explains the behavior as *irrational* (bias/error) validates the decision procedure "stop," but fails to explain why agents defined as "rational" in Case (a) continue. You must choose whether your priority is understanding the mechanism of the trap or optimizing your exit from it. The specification below treats both as goals but flags the incompatibility.

  ### Specification for a Theory of Escalation of Commitment

  **R1: Normative Actionability**
  *   **Requirement:** The theory must yield a deterministic decision procedure for an agent currently inside an escalation scenario (e.g., holding the second-highest bid) that specifies whether to invest the next increment.
  *   **Case/Consideration:** You stated you need a "decision procedure usable by someone who is already inside the auction." Without this, the theory is observational only and fails your engineering need.
  *   **Status:** Non-Negotiable.

  **R2: Descriptive Adequacy for Rational Agents**
  *   **Requirement:** The theory must explain why agents stipulated as "rational" and "knowledgeable" continue bidding past the prize value in Case (a) without resorting to external claims of ignorance or cognitive malfunction.
  *   **Case/Consideration:** You specified Case (a) involves "both players rational and each knowing it of the other." If the theory explains the escalation solely by calling the agents irrational, it contradicts the premises of the case you care about.
  *   **Status:** Non-Negotiable.

  **R3: Structural Sensitivity**
  *   **Requirement:** The theory must render distinct verdicts for structural variations that alter the payoff matrix, specifically Cases (b) [cap], (c) [refund], and (d) [scripted opponent].
  *   **Case/Consideration:** A theory that treats the capped auction (b) identically to the uncapped auction (a) is insensitive to risk boundaries. A theory that cannot distinguish a human opponent from a script (d) fails to account for strategic adaptation.
  *   **Status:** Non-Negotiable.

  **R4: Value Generalization**
  *   **Requirement:** The theory must accommodate non-monetary prize structures where the "value" of the prize is dynamic or social, as in Case (e) [reputation].
  *   **Case/Consideration:** Real-world projects (Case f) often prize reputation or market position over immediate ROI. A theory restricted to fixed monetary prizes cannot address your actual work environment.
  *   **Status:** Non-Negotiable.

  **R5: Mechanism Isolation**
  *   **Requirement:** The theory must explicitly identify which structural features are necessary and sufficient for escalation (e.g., loser-pays vs. alternating bids vs. fixed prize).
  *   **Case/Consideration:** You asked to "identify which features of the auction are doing the work." Without this, you cannot engineer the system to prevent the trap.
  *   **Status:** Non-Negotiable.

  **R6: Multi-Party Scalability**
  *   **Requirement:** The theory must provide a clear mapping from the two-player model to multi-party, variable-prize scenarios like Case (f) [war, lawsuit, product line].
  *   **Case/Consideration:** Your actual problem is Case (f). If the theory requires abstraction that removes the multi-party or variable-prize nature, it may not transfer.
  *   **Status:** Preference. (Strict formalization often breaks at >2 players or variable prizes; a theory that admits this limitation is more honest than one that claims to solve it perfectly.)

  **R7: Exit Consistency**
  *   **Requirement:** The decision procedure must not recommend actions that guarantee higher loss than the alternative, unless justified by R4 (Value Generalization).
  *   **Case/Consideration:** In a pure monetary auction, a theory recommending a $2 bid for a $1 prize violates basic utility maximization unless it accounts for external value (reputation).
  *   **Status:** Non-Negotiable.

  ### Conflict Analysis

  **Conflict Pair:** R2 (Descriptive Adequacy for Rational Agents) and R7 (Exit Consistency).
  **Reasoning:** If the theory satisfies R2 by demonstrating that escalation is the rational choice for agents in Case (a) (e.g., due to threat credibility or subgame perfection), then R7 is violated in a pure monetary context (since the agent loses money). If the theory satisfies R7 by prescribing "stop to minimize loss," it fails R2 because it implies the "rational" agents in Case (a) are actually making an error. You cannot simultaneously prove that rational agents *should* escalate and that agents *should not* escalate to avoid loss.

  ### Scoring of Candidate Accounts

  **(i) The Sunk Cost Rule ("Ignore past expenditures")**
  *   **R1:** Pass. (Clear rule: Stop.)
  *   **R2:** Fail. (Does not explain why rational agents ignore the rule.)
  *   **R3:** Pass. (Applies regardless of cap/refund.)
  *   **R4:** Fail. (Cannot account for reputation value without modification.)
  *   **R5:** Fail. (Identifies the error, not the structural driver.)
  *   **R6:** N/A.
  *   **R7:** Pass.

  **(ii) Psychological Error (Loss Aversion/ ego)**
  *   **R1:** Weak. (Knowing you have a bias does not provide a calculation for the next bid.)
  *   **R2:** Pass. (Explains behavior via internal error.)
  *   **R3:** Weak. (Does not predict how caps change the psychology.)
  *   **R4:** Pass. (Ego applies to reputation.)
  *   **R5:** Fail. (Focuses on internal state, not structural features.)
  *   **R6:** N/A.
  *   **R7:** Pass.

  **(iii) Reputation/Credibility Account**
  *   **R1:** Pass. (Bid if reputation value > cost.)
  *   **R2:** Pass. (Explains escalation as rational investment in social capital.)
  *   **R3:** Pass. (Caps limit the reputational investment.)
  *   **R4:** Pass. (Explicitly handles Case e.)
  *   **R5:** Pass. (Identifies "public visibility" as the driver.)
  *   **R6:** N/A.
  *   **R7:** Conditional Pass. (Only if reputation is valued higher than cash.)

  **(iv) Game-Theoretic Account (No exit point is strictly better)**
  *   **R1:** Pass. (Bid to minimize immediate loss relative to opponent.)
  *   **R2:** Pass. (Explains escalation as the only locally rational move once in.)
  *   **R3:** Pass. (Verdict changes if cap/refund alters the matrix.)
  *   **R4:** Fail. (Struggles with non-quantifiable prizes unless modeled as utility.)
  *   **R5:** Pass. (Identifies "loser-pays" and "alternating bids" as drivers.)
  *   **R6:** N/A.
  *   **R7:** Fail. (Endorses losing more money than the prize is worth.)

  ### Closing Analysis

  The single requirement that does the most to exclude candidate accounts is **R2**. Most normative theories (like i and ii) fail here because they must label the behavior an "error" to recommend stopping, thereby contradicting the "rational agent" premise of Case (a). The requirement most often assumed rather than argued for is **R7**. It is assumed that "rational" means "maximizes monetary return," whereas in Cases (e) and (f), rationality may require maximizing political survival or reputation at monetary cost.

  Verdict: R2; conflict R2/R7
