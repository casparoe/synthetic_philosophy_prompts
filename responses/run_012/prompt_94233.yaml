answer: |-
  # Lesson Plan: The OmniCorp Protocol
  **Course:** Upper-Level Undergraduate Seminar (Meaning & Reference)
  **Class Size:** 14 Students
  **Duration:** 90 Minutes
  **Goal:** Elicit intuitions supporting semantic externalism (natural kinds) and contrast them with institutional kinds without pre-loading the theory.

  ## I. Materials & Setup

  **Room Arrangement:**
  *   Two distinct clusters of tables, far enough apart that Group A cannot read Group B's papers (e.g., opposite corners).
  *   A central "Server Station" (your desk) for passing notes.

  **Handouts (Printed & Sealed in Envelopes):**
  *   **7x "Office North" Dossier (Round 1 & 2 combined in a packet).**
  *   **7x "Office South" Dossier (Round 1 & 2 combined in a packet).**
  *   **14x "Negotiation Log" Sheets** (Blank lined paper).
  *   **14x "Final Guarantee" Forms** (Pre-printed contract templates).
  *   **Whiteboard/Projector:** For timer and public "Shared Label" tracking.

  **The Dossiers (Confidential):**
  *   *Cover Page:* "OMNICORP INTERNAL MEMO: CONFIDENTIAL. Do not share this physical document with Office South/North. You are branches of the same firm. Your inventory definitions are standardized company-wide."
  *   *Round 1 (Natural Kind):*
      *   **North:** "Stock Item: **Liquid-88**. Chemical Composition: H₂O. Observable Properties: Clear, odorless, boils at 100°C, quenches thirst."
      *   **South:** "Stock Item: **Liquid-88**. Chemical Composition: XYZ (complex polymer). Observable Properties: Clear, odorless, boils at 100°C, quenches thirst." *(Note: XYZ is fictional but defined as macroscopically indistinguishable).*
  *   *Round 2 (Institutional Kind):*
      *   **North:** "Stock Item: **Heritage Watch**. Criteria: Manufactured prior to 1970. Observable: Vintage aesthetic, serial number present."
      *   **South:** "Stock Item: **Heritage Watch**. Criteria: Signed by Chief Designer (regardless of date). Observable: Vintage aesthetic, signature present." *(Note: Both groups have a list of items that satisfy their specific criteria).*

  **Instructor Props:**
  *   Two large manila envelopes labeled "NORTH REVEAL" and "SOUTH REVEAL" containing the actual dossier texts to be projected/shown at the end.
  *   Timer visible to all.

  ---

  ## II. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Distribute dossiers. Read **Script A** (below). Emphasize secrecy and the goal of agreement. |
  | **05-20** | **Round 1: Review** | Groups read Round 1 section of their dossier internally. No cross-talk yet. |
  | **20-35** | **Round 1: Negotiation** | Groups exchange written notes via Instructor to agree on a **Public Label** and **Guarantee Text** for Liquid-88. |
  | **35-40** | **Round 1: Seal** | Groups sign the "Final Guarantee" form. Instructor collects them. Do not discuss content yet. |
  | **40-45** | **Transition** | Collect Round 1 materials. Distribute/clear for Round 2. Reset room energy. |
  | **45-55** | **Round 2: Review** | Groups read Round 2 section of their dossier internally. |
  | **55-70** | **Round 2: Negotiation** | Same architecture: Agree on **Public Label** and **Guarantee Text** for Heritage Watch. |
  | **70-75** | **Round 2: Seal** | Groups sign the "Final Guarantee" form. Instructor collects them. |
  | **75-80** | **The Reveal** | Instructor opens the "NORTH/SOUTH REVEAL" envelopes. Project the differing definitions side-by-side. Silence. |
  | **80-90** | **Debrief** | Facilitated discussion mapping intuitions to theory (see Section V). |

  ---

  ## III. Exact Scripts & Instructions

  ### Script A: The Briefing (00-05)
  "Welcome to OmniCorp. You are divided into two regional offices, North and South. For legal reasons, you have never met face-to-face; all communication must be written and routed through me, Headquarters.

  You handle inventory. Your goal is to standardize our catalog. You believe you are part of the *same* firm with the *same* standards. However, due to a clerical error in the archives, your local dossiers define the stock differently. **You do not know this yet.**

  **Rules:**
  1. Do not show your dossier to the other office.
  2. Do not ask about 'underlying nature' or 'chemical formulas' in Round 1; focus on observable trade properties.
  3. You must produce a **Shared Label** (a name) and a **Written Guarantee** (a description customers can rely on).
  4. If you cannot agree, the firm loses the contract. You *must* agree.

  Open your dossiers to Round 1."

  ### Instruction Sheet (Included in Dossier)
  **TASK: STANDARDIZATION PROTOCOL**
  1.  Review your local definition of the Stock Item.
  2.  Communicate with the other office via written notes passed to Headquarters (Instructor).
  3.  **Objective:** Agree on one **Label** (e.g., 'Water') and one **Guarantee** (e.g., 'Clear liquid that quenches thirst').
  4.  **Constraint:** You cannot change your local inventory. You must find a label that covers *your* stock and, you assume, *their* stock.
  5.  Once agreed, sign the **Final Guarantee Form**.

  ### Script B: The Reveal (75-80)
  (Collect all signed forms. Stand between the two groups.)
  "Thank you. You have successfully negotiated contracts. You believe you are selling the same things under the same names. Let's check the archives."

  (Project the two dossiers side-by-side.)

  "In Round 1: North, your Liquid-88 was H₂O. South, your Liquid-88 was XYZ. You signed the same guarantee. Did you mean the same thing?
  In Round 2: North, your Heritage Watch required pre-1970 age. South, it required a Designer Signature. You signed the same guarantee. Did you mean the same thing?"

  (Allow 60 seconds of silent shock/murmuring. Then begin Debrief.)

  ---

  ## IV. Troubleshooting: Predictive Failure Modes

  **1. The "Chemistry Cheat" (Round 1)**
  *   **Risk:** A student asks, "Is the chemical formula H₂O?" in a note.
  *   **Fix:** The Dossier Instructions explicitly forbid asking about "underlying nature or chemical formulas." If they ask, reply as Headquarters: *"Query denied. Focus on observable trade properties."*
  *   **Why:** This forces them to rely on descriptions, setting up the failure of descriptivism.

  **2. The "Definition Hunt" (Round 2)**
  *   **Risk:** In Round 2, they ask "What defines a Heritage Watch?" and one group reveals their criterion.
  *   **Fix:** Monitor notes. If a group reveals their criterion ("Ours must be pre-1970"), intercept the note and return it with a warning: *"Do not reveal internal compliance criteria. Negotiate based on the item's market appearance."*
  *   **Why:** The twist relies on them assuming the criteria are identical because they are the "same firm."

  **3. Premature Skepticism**
  *   **Risk:** A philosophy major suspects Twin Earth immediately and whispers to their group.
  *   **Fix:** Use the fictional names (Liquid-88, XYZ) and emphasize the *business* context. If they spoil it, pull them aside and ask them to play along for the sake of the experiment's integrity.

  **4. Failure to Agree**
  *   **Risk:** They get stuck on a word.
  *   **Fix:** As Headquarters, intervene at minute 30/65: *"Headquarters Note: Management requires a signed contract by the deadline. Compromise on the Label if necessary."*

  ---

  ## V. The Debrief (80-90 Minutes)

  *Note to Instructor: Do not use the terms "Semantic Externalism," "Internalism," "Putnam," or "Twin Earth" until the final 3 minutes of this section.*

  ### Part 1: Eliciting Intuitions (80-85)
  **Ask Group North & South:**
  1.  "When you signed the Round 1 Guarantee for Liquid-88, did you intend to refer to the *same substance* as the other office?"
      *   *Expected Intuition:* No. Even though you used the same words and descriptions, North meant H₂O, South meant XYZ.
  2.  "If a customer from North went to South and asked for Liquid-88, would they get what they wanted?"
      *   *Expected Intuition:* No. They would get a different chemical, even if it acted the same.
  3.  "Now, Round 2 (Heritage Watch). Did you mean the same thing?"
      *   *Expected Intuition:* Mixed. Some will say "No, different rules." Others will say "Yes, 'Heritage Watch' is just whatever we agreed to call it."

  ### Part 2: Mapping to Theory (85-88)
  **Now you may name the views.**

  1.  **The Round 1 Lesson (Natural Kinds):**
      *   "Your intuition in Round 1 aligns with **Semantic Externalism** regarding natural kinds."
      *   **The Claim:** The reference of a term like 'Liquid-88' (or 'Water') is not fixed by the description in your head (clear, thirst-quenching). It is fixed by the **actual stuff in the world** (H₂O vs. XYZ).
      *   **Connection:** This is the core of Hilary Putnam's **Twin Earth** argument (1975). 'Meaning ain't in the head.' Even if your internal psychological states were identical, your reference differed because your environments differed.
      *   **Settled Consensus:** Among philosophers of language, externalism about natural kind terms (water, gold, tiger) is the dominant view. Descriptivism (the idea that reference is fixed by a list of properties) is widely considered refuted for these terms.

  2.  **The Round 2 Lesson (Institutional Kinds):**
      *   "Round 2 tests whether this extends to **Social/Institutional Kinds**."
      *   **The Contrast:** For 'Heritage Watch,' the 'stuff' isn't chemical; it's constituted by rules.
      *   **The Tension:** Did the *world* fix the reference, or did your *agreement* fix the reference?
      *   **Contested Territory:** Here, you must be explicit: **There is no consensus.**
          *   *View A (Externalist):* Social kinds (money, marriage, watches) are also fixed by external facts (e.g., the actual history of the object, not just our concept).
          *   *View B (Internalist/Constructivist):* Social kinds *are* determined by our collective concepts/agreements. If we agree 'Heritage Watch' means X, then it means X. There is no 'hidden essence' outside our practices.
      *   **Instructional Note:** Do not present Externalism as the winner here. Present Round 2 as the *boundary question* of the theory.

  ### Part 3: Limitations of the Activity (88-90)
  **What this activity did NOT prove (You must supply this):**

  1.  **The Necessity of Causal History:** The game showed reference *diverged*, but it didn't show *why*. Externalism argues reference is fixed by an initial "baptism" or causal chain linking the word to the stuff. The game simulated the *result* of externalism, not the *mechanism*.
  2.  **The Ignorance Condition:** In the game, you were ignorant of the chemical composition. Externalism relies heavily on the idea that speakers can refer to things they cannot identify (e.g., I can say 'gold' without knowing atomic number 79). The game hinted at this, but you need to articulate that *expertise* lies in the world/community, not the individual.
  3.  **Normative Force:** The game treated "Heritage Watch" as a inventory item. In reality, institutional terms carry normative weight (rights, obligations). The activity cannot reproduce the *normative* stakes of institutional externalism, which is why that debate remains unsettled.

  **Closing Statement:**
  "Today you felt the pull of Externalism in Round 1: the world reached into your heads and fixed your meaning. In Round 2, you felt the resistance: when the 'world' is made of rules, do the rules make the meaning, or does the meaning make the rules? That is where your reading begins."

  ---

  ## VI. Instructor's Cheat Sheet: Settled vs. Contested

  | Feature | Natural Kind Terms (Round 1) | Institutional/Social Kinds (Round 2) |
  | :--- | :--- | :--- |
  | **Examples** | Water, Gold, Tiger, Heat | Money, Marriage, Prime Minister, Contract |
  | **Externalist View** | **Dominant Consensus.** Reference fixed by underlying structure (microphysics). | **Highly Contested.** Some argue social facts are mind-dependent. |
  | **Internalist View** | **Minority.** Mostly abandoned for natural kinds. | **Viable.** Many argue social kinds are constituted by collective intentionality. |
  | **Activity Outcome** | Students should feel they *failed* to mean the same thing. | Students may feel they *succeeded* in meaning the same thing (by agreement). |
  | **Pedagogical Stance** | Present as the "Target View" of the lesson. | Present as the "Open Question" for future seminars. |

  ## VII. What Will Predictably Go Wrong (And How to Handle It)

  1.  **"But XYZ isn't real!"**
      *   *Issue:* A science student objects that XYZ is impossible.
      *   *Handle:* "Treat it as a metaphysical possibility for the sake of the argument. The point is the *structure* of the intuition, not the chemistry."
  2.  **"We figured it out in Round 1."**
      *   *Issue:* If a group guesses the twist.
      *   *Handle:* "Did you figure it out from the *data*, or did you guess the *professor's trick*? If you guessed the trick, you still operated on the assumption that your partner meant the same thing until the reveal. That assumption is what we are testing."
  3.  **The "Agreement" feels like Stipulation.**
      *   *Issue:* In Round 2, students might argue "We defined it, so it is what we said."
      *   *Handle:* This is actually a *success* for the lesson. It highlights the difference between natural kinds (discovered) and institutional kinds (stipulated). Highlight this divergence in the debrief.
  4.  **Time Overrun.**
      *   *Issue:* Negotiations drag on.
      *   *Handle:* Be ruthless with the timer. If they haven't signed by minute 40/75, collect whatever they have. The "failure" to perfectly negotiate is also data.

  ## VIII. Limitations: What You Must Supply in Debrief

  The activity **cannot** reproduce the **Causal Theory of Reference**.
  *   *Why:* The game shows that reference *varies* with the environment. It does not show *how* the link is established (the causal chain from baptism to current use).
  *   *Supply:* You must explain that Externalism isn't just "stuff matters," it's "historical causal contact with stuff matters."
  *   *Why this matters:* Without the causal chain explanation, students might think Externalism implies Magic (the world zaps meaning into our heads). You must clarify it is a social-historical mechanism.

  The activity **cannot** resolve the **Normative/Institutional Debate**.
  *   *Why:* The game treats "Heritage Watch" as a toy example. Real institutional terms involve rights and duties.
  *   *Supply:* You must clarify that extending Externalism to morality or law is much harder than extending it to water, and many philosophers reject that extension. Do not let them leave thinking Putnam solved the meaning of "Justice."
