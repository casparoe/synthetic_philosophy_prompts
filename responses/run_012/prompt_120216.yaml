  I considered merging **1 (Introspective misrepresentation)** and **5 (Recursive self-model opacity)**, as both are illusionist diagnoses attributing the hard problem to a flaw in self-modeling. However, I have kept them separate because 1 posits a *false content* (qualia don't exist as represented), while 5 posits a *structural limit* (the system cannot represent its own vehicle). They are competing mechanisms for the same outcome, and 5 provides a deeper explanation for the inevitability of 1.

