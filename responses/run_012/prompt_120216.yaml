  **5. Recursive self-model opacity**
  (a) Explanatory Power: 9/10
  (b) Dissolution Power: 10/10
  (c) Tier: S
  (d) By grounding the illusion in a structural impossibility of self-representation, it explains not just why we are mistaken, but why the mistake is uncorrectable from the inside.

  **6. First-person-authority semantics**
