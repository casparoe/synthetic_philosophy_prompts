  You're confusing "conscious experience" with "sensory registration." Just because your finger twitches when the photon hits the retina doesn't mean you've consciously witnessed the event yet. The brain is a parallel processor, not a single queue. One pathway shoots straight to the motor cortex to hit that left button—fast, dirty, unconscious—while the other pathway waits in the buffer to see if there's a red dot coming so it can render the final movie for the conscious mind. So your experiment doesn't kill me; it just proves you have reflexes. The "experience" you're asking about—the story you tell yourself about what you saw—is still the edited version.

  Think about it: if you're driving and slam the brakes, you often realize you saw the danger only after your foot is already moving. Does that mean you consciously saw the car before you reacted? No. It means the brain acted on data before it finished building the scene for you. So the button presses can track the flash intervals perfectly while the conscious experience still arrives late, packaged neat with a fabricated timestamp. You're measuring the input latency, not the delivery time of the show.
