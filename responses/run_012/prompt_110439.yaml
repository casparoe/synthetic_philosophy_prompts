answer: |-
  Elena: Let us begin with the structure. I maintain that "if" functions uniformly. It restricts the domain of worlds over which a modal operator ranges. We call this domain the **modal base**, the set of propositions taken as fixed when evaluating the conditional. The apparent difference between indicatives and counterfactuals is merely a difference in which modal base the antecedent selects, guided by tense morphology.

  Marcus: But that uniformity is purchased at the cost of the phenomena. I hold that the two forms differ in kind. Indicatives are assessed by **conditional probability**, how probable the consequent is given the antecedent, and lack standard truth conditions. Counterfactuals are claims about what holds in the relevantly similar worlds where the antecedent is true. Your view cannot explain why we accept one form and reject the other in identical contexts.

  Elena: Consider the dispensary case. The dose is gone. Investigators say, "If Ana didn't take the dose, someone else did," but reject "If Ana hadn't taken the dose, someone else would have." My view predicts this split. The indicative uses a modal base containing the fact that the dose is missing. Given that fact, if Ana didn't do it, logic dictates someone else did. The counterfactual shifts the modal base to the history prior to the theft. In those nearest worlds where Ana refrains, no one else was poised to act, so the vial remains. The difference is content, not kind.

  Marcus: Precisely, but notice what does the work. For the indicative, you rely on the exhaustiveness of the ways the dose could have left. It is an epistemic deduction. For the counterfactual, you rely on causal similarity. The nearest worlds where Ana refrains are worlds where the vial stays in the fridge. This confirms my view. The indicative tracks evidence; the counterfactual tracks metaphysical similarity. If they were the same kind, the shift in tense alone shouldn't toggle the truth value so sharply when the evidence remains constant.

  Elena: The tense morphology signals the shift in the modal base. It is not magic; it is semantic instruction. Now, consider the future pair: "If it rains tomorrow, the fête will be cancelled" versus "If it rained tomorrow, the fête would be cancelled." Neither antecedent is known to be false.

  Marcus: Here the distinction is clearer. The indicative expresses high probability based on current weather patterns. The counterfactual, despite referencing tomorrow, uses past-tense morphology to mark remoteness from actuality. It suggests that rain is less expected or that we are considering a scenario fixed against current trends.

  Elena: And that fits my view. The past tense on a future event restricts the modal base to worlds where the conditions for rain are different than those currently obtaining. It is still a universal claim over a restricted domain. You say it lacks truth conditions, but speakers assert it as true or false.

  Marcus: They assert it as appropriate or inappropriate. But let us move to negation and embedding. Say, "It is not the case that if it rains, the fête is cancelled." This negates the connection. But with counterfactuals, negation behaves differently. If I say, "It is not the case that if it had rained, the fête would have been cancelled," I deny the similarity claim. Furthermore, indicatives resist embedding under "probably" differently. We say "Probably, if P, Q," treating the whole conditional as the object of probability.

  Elena: That is a matter of **scope**. When you say "Probably, if P, Q," the probability operator takes wide scope over the conditional relation. Both forms behave alike here. The difference is that your view struggles to explain what is being negated in the indicative. If it has no truth conditions, what does "It is not the case" deny?

  Marcus: It denies the acceptability of the inference. But concede this: indicatives do not support **entailment** relations the way counterfactuals do. If "If P, Q" is true in the counterfactual sense, it supports certain inferences about causal structure. The indicative only supports betting quotients. This is where your uniformity fractures. You must explain why the logic differs if the semantics is identical.

  Elena: The logic differs because the modal bases differ, not the semantic engine. But I will concede a cost. The constraint on choosing the modal base is not fully encoded in the sentence itself. It relies on the speaker's information and conversational context. I cannot fully specify from the syntax alone whether we are holding the past fixed or the evidence fixed. That choice is pragmatic.

  Marcus: And I must concede something costly. If indicatives lack truth conditions, what makes them correct? I must say they are true in a deflated sense: they are correct when the conditional probability is high. This mimics truth conditions closely enough that speakers treat them as truth-apt. I lose the sharp ontological distinction I claimed, admitting they function *as if* they have truth conditions.

  Elena: So you admit they behave truth-functionally in practice.

  Marcus: I admit they are assessed for correctness, but the ground of that assessment is epistemic, not metaphysical. You, however, must admit that the "modal base" is so flexible it risks becoming untestable. If any divergence in intuition can be blamed on a shift in the modal base, your theory explains everything and nothing.

  Elena: That is a risk, but preferable to positing two distinct logical forms for what looks like one grammatical construction. We end where we began, but sharper. You insist the ground of assessment differs; I insist the mechanism is uniform but the input varies.

  Marcus: And neither of us can fully explain why the future counterfactual feels so distinct from the past counterfactual without appealing to the very intuition we are trying to explain. The "past tense" marker does too much work for both of us.

  Elena: Agreed. The disagreement remains: is it one engine with different fuel, or two different engines?

  Marcus: And until we can isolate the fuel from the engine, we cannot decide.

