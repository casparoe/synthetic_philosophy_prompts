      *Wait, one nuance:* The prompt says "State the question so that it has a determinate answer and a reader can tell when it has been answered." This is a high bar for humanities. I need to frame it as: "The project will determine whether X is a viable category." If I conclude it's not viable, that's an answer. If I conclude it is, that's an answer. The failure is *not reaching a conclusion*.

