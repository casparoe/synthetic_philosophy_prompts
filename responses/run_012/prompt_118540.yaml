          *   Months 7-9: Resolution and refinement (testing the "ratification" intuition).
      *   **Deliverable/Success Criteria:** What does success look like? A finished novel + an articulation of the "Ratification Principle." Failure? If the plot resolves via magic/deus ex machina or if the theory collapses into "might makes right."
      *   **Scope Warning:** Acknowledge the risk. The temptation to solve all of jurisprudence. Need to stay focused on the *transition* moment.

  4.  **Refining the Tone:**
      *   Needs to be confident but humble.
      *   "I am not a philosopher" -> "I am a novelist." Frame this as an advantage (narrative logic vs. formal logic).
