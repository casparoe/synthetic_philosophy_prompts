  2.  **Deconstruct the Intellectual Argument:**
      *   *The Problem:* Legal bootstrapping. How does a system authorize its own origin if the authorization mechanism comes later?
      *   *The Gap:* Logic/Paradox approaches (Kelsen, Hart, Suber) focus on validity conditions in a vacuum. Sociological/Political approaches focus on acceptance. Neither fully addresses the *narrative* of continuity—how a community *experiences* the transition from illegitimacy to legitimacy over time.
      *   *The Method:* Fiction as a thought experiment. A novel allows for the simulation of lived time and social consequence that abstract theory strips away.
      *   *The Goal:* To articulate a criterion for "valid ratification of usurpation" through the narrative arc.
      *   *Scope:* 9 months. Needs to be a "long essay" worth of intellectual labor embedded in the writing of the novel.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be evocative but academic. *The Bootstrapped Charter*? *Authority and Time*? Let's go with something that bridges law and narrative. *The Validity of Usurpation: A Narrative Inquiry into Legal Continuity.*
