      *   *Distinction 2: Unpleasantness vs. Unwantedness.* Is pain bad because it feels bad, or because we don't want it? (Masochism might be a test case here, though asymbolia is stronger).
      *   *Distinction 3: Local Badness vs. Global Badness.* The badness of the pain experience itself vs. the badness of the life containing it.
      *   *Clinical Constraints:* Congenital Insensitivity to Pain (CIP) shows pain is protective. Asymbolia shows pain isn't inherently motivating. Phantom limb pain shows pain without tissue damage.
      *   *Normative Constraint:* Why do we treat pain? Why is torture wrong?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Asymbolia Constraint.* A theory must explain why asymbolic pain isn't bad *for the patient* in the moment, despite being present.
      *   *Requirement 2: The Sensory-Affective Distinction.* Must distinguish *hurtfulness* from *sensation*.
      *   *Requirement 3: The Protection Constraint (CIP).* Must explain why lacking pain is dangerous/bad for a life, even if the sensations aren't felt as bad.
      *   *Requirement 4: The Normative Force.* Must explain why we have reason to alleviate normal pain.
