      *Critique 1:* Too blunt. Needs more poetry. Needs to feel like a memorial, not a summary of her thesis. The emotional weight needs to land for the cousins who just miss "Grams."

  6.  **Drafting - Attempt 2 (Focusing on Emotion + Structure):**
      *   Start with the room. It fits her.
      *   Talk about how people ask "Why did she know so much?"
      *   Bring in the "doors" idea as a way she listened, not just talked.
      *   When we talk about her life, we want to pick the sad part or the happy part.
      *   Let's not pick. Let's acknowledge the stack of reasons.
      *   The railroad story (briefly).
      *   Apply to her kindness.
      *   Apply to her stubbornness.
      *   Conclusion: We are here for many reasons. She lives in the overlap.

  7.  **Writing - Focusing on Voice:**
      *   Keep sentences varied.
      *   Avoid "In conclusion."
      *   Make sure the "doors" metaphor is clear but not over-explained.
      *   Ensure the society people nod along (accurate representation) and the family feels hugged (emotional resonance).

      *Key Phrase Idea:* "She didn't want the shortcut."
      *Key Image:* The room itself, filled with different people, mirroring her philosophy.

  8.  **Final Polish (checking constraints):**
      *   Time: ~800 words.
      *   No quotes.
      *   No lecture.
      *   Honor the "doors."

      *(Self-Correction during writing)*: I need to be careful not to make the eulogy *about* the philosophy so much that the grandmother disappears. The philosophy must serve the memory of the woman. The structure should *embody* the philosophy. I will offer three distinct "reasons" for her greatness in consecutive paragraphs, then refuse to choose between them.

