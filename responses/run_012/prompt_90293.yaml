answer: |-
  Good morning. For those who don't know me, I'm [Name]. I'm one of the grandchildren.

  Looking around this room, I see the two worlds Grams lived in. On this side, her sisters, my cousins, people who knew her as the one who made sure you ate enough at Sunday dinner. On that side, people who know her as the one who could tell you the exact year the mill changed owners, or why the bridge was built on the north bend instead of the south. She belonged to both groups completely. She never kept those lives separate.

  If you knew her well, you know she had a habit of mind that could be frustrating. She called it "the doors." If you asked her why something happened—the town flood, the war, why the bakery closed—she wouldn't give you a reason. She'd give you three. She'd tell you that there were multiple paths that led to the same outcome, any one of which was sufficient on its own. She believed that picking a single cause was usually just a way to make ourselves feel like we understood something we didn't.

  She used the railroad spur as her favorite example. You all know the story. The town never got the line. Ask most people why, and they'll tell you it was the land dispute. Or maybe the funding fell through. Or the engineer died. Grams would tell you it was all three. Any one of those things would have stopped the train. Insisting on just one was a lie.

  I spent a lot of time this past two weeks trying to write this speech, and I kept running into the problem she warned us about. A eulogy wants to be a single-cause story. We want to say she was generous because of the Depression. We want to say she was tough because she lost my grandfather so young. We want to say she was curious because she never finished college and wanted to prove something.

  Those things are true. But if I stand here and tell you she was who she was *because* of the Depression, I'm ignoring the fact that her sisters lived through the same times and turned out differently. If I tell you it was because of Grandpa, I'm ignoring the decades she spent happy without him. If I tell you it was just her nature, I'm ignoring the world that shaped her.

  Grams would have called picking one of those reasons a lie. She'd have said we choose a single cause because we're desperate for a clean story. We want to know which door she walked through so we can close it behind her.

  But she didn't walk through one door. She walked through all of them.

  She was kind because hard times taught her what scarcity felt like. She was kind because she loved my grandfather and learned how to care for someone. And she was kind because, simply put, that's who she decided to be. Any one of those reasons is enough to explain her goodness. All of them together are just the truth.

  She was stubborn because the world tried to tell women her age to be quiet. She was stubborn because she knew she was right about the history here. And she was stubborn because she was born with a spine that wouldn't bend. Any one of those explains why she fought for this Historical Society. All of them explain why we're here.

  I know some of you came today looking for the summary. You want the takeaway. You want to know what made her tick so you can understand what you've lost. But I think the thing she loved most about this town, and about people, was the messiness of it. She didn't want us to simplify her. She didn't want us to simplify ourselves.

  So I'm not going to tell you that her life means one specific thing. I'm not going to tell you that her death is a lesson in mortality, or that her legacy is just these buildings and records.

  Her legacy is the complexity. Her legacy is the fact that my cousins are sitting next to historians, and nobody finds that strange. Her legacy is that we can look at her life and see the hardship, the love, and the choice, and refuse to rank them.

  We are going to miss her. And there isn't one reason for that, either. We miss her because she was our family. We miss her because she was the keeper of the truth. We miss her because she was the only one who knew where the bodies were buried, literally and figuratively, and she took those secrets with her.

  Any one of those losses would be enough to grieve. All of them are ours to carry.

  She taught us that when something big happens, you don't look for the one cause. You look at the whole landscape. So when you look at this room, and you feel the weight of her absence, don't try to narrow it down. Don't try to find the single reason she mattered.

  Let it be enough that she mattered for every reason there was.

  Thank you.
