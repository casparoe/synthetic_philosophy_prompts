answer: |-
  The jack hung loose in Vex's port, gleaming silver against the dark mesh of his neck. Around the table, the syndicate leaders watched. To link without encryption handshakes was suicide in the sprawl, a bare throat offered to a knife. But it was also the only way to prove you had the firewall strength to survive the exposure. Vex swallowed the taste of copper and slid the jack home.

  His vision flickered. Data rushed in, unfiltered, raw code scraping against his neural lining. It felt like swallowing glass. He kept his breathing steady, letting the diagnostic ghosts run wild in his peripheral vision. He wasn't actually bare; a decoy server was absorbing the impact, a costly subscription he'd barely afforded, but to the eye, he was open.

  "He's shaking," Mara said. She leaned forward, her own ports scarred shut from years of full-handicap linking. "Look at the tremor in his hand. The cost is biting him."

  "It's noise," Dren replied, not looking up from his console. "His throughput is stable. The tremor is irrelevant. The signal holds because the load doesn't break him. That's not waste, Mara. That's capacity."

  "Waste is the point," Mara snapped. "If it didn't hurt, anyone could do it. The pain is the signature. He's burning bandwidth to show he can afford the burn."

  "He's not burning anything he can't replace," Dren said. "If he were weak, the connection would drop before the pain started. The cost is differential. It's cheap for him, expensive for us. That's why we trust the link, not because he's suffering."

  Vex gritted his teeth. The decoy was holding, but the latency was spiking. If Mara was right, his visible struggle was validating him. If Dren was right, his stable throughput was validating him. Neither knew about the buffer hiding in his sub-routine. He was fakeable. The trait wasn't welded to the bone; it was a jacket he'd rented.

  The data stream stabilized. The handshake completed. Vex exhaled, a sharp hiss through clenched teeth. He pulled the jack. The room remained silent.

  "See?" Mara said, gesturing at Vex's pallor. "He paid the toll. He's one of us."

  "He's one of us because he didn't crash," Dren countered. "If the toll was higher, he'd be dead. If it was lower, a child could join. The equilibrium sits where the cost matches the quality. You're confusing the symptom for the cause."

  "The symptom is the only thing we can see," Mara said. "You think the receivers care about your internal architecture? They care about the blood on the floor."

  "They care that the job gets done," Dren said. "The blood is just correlation. Eventually, someone finds a way to bleed without dying, and then your toll is worthless."

  Vex rubbed his neck. The skin was bruised, red where the jack had seated. Real damage, even if the risk was mitigated. He looked at Mara, who saw sacrifice, and Dren, who saw efficiency. Both were looking at the same bruise and seeing different truths. The syndicate accepted him. The equilibrium held. But as Vex packed his gear, he wondered how long the bridge would stand before someone noticed the water rising beneath it.

  ***

  **Notes:** This story leans into the tension between the Handicap Principle (a) and Differential Cost (b), while hinting at the fragility of Index Signals (c). I fudged the neuroscience; neural interfaces don't currently work via "pain as verification," but it dramatizes the physiological cost. Biologists still debate whether handicaps *must* be wasteful (Zahavi's view) or merely differentially costly (the standard game-theoretic refinement), and whether "index" signals are truly distinct or just extreme differential costs. The story treats the signal's honesty as an equilibrium property that persists even when individual cheating occurs, reflecting the sociological reality that systems often tolerate some noise before collapsing.
