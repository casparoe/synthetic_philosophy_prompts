prompt: |-
  I run the risk-assessment and authorisation unit at a national environment and chemicals agency. About fifty proposals a year cross my desk, each one a request either to approve a substance or technology with conditions attached, or to restrict or withdraw something already in use, and each has to be closed out as a signed decision note within ninety days, with a twelve-month review available if we take the conditional route instead of a flat yes or no. My staff are scientists and lawyers rather than philosophers, the notes we write get judicially reviewed, and the reasoning has to survive a judge asking why we treated the uncertainty in this file differently from the uncertainty in the file two desks over. I came into the job a believer in the precautionary principle and I still am, but I have watched our own unit invoke it in opposite directions on nearly identical evidence — as a reason to act at once and as a reason to keep studying — and I have been made to look foolish in cross-examination for it. What I want from you is a procedure, not an essay on the principle: an ordered set of questions my unit can actually run, with entry and exit conditions at each step, a statement of what counts as a sufficient answer to each, the points at which the procedure returns a definite no, and the points at which it must hand the file to a person because the remaining question is one of values rather than evidence. Note that our minister can override us on social or economic grounds; I would rather the procedure said so openly at the right step than have that override smuggled in earlier as though it were a scientific judgment.

  The procedure has to be honest about the structure of the principle instead of smoothing it over. It must separate the two quite different jobs the principle is normally asked to do: lowering the standard of proof required before a restriction is justified, by shifting the burden onto whoever wants to introduce or keep the substance; and licensing action on grounds that would fail a conventional cost-benefit test. It must distinguish, and prescribe different treatment for, at least four epistemic situations — probabilities known, probabilities unknown but the outcomes enumerable, outcomes themselves contested, and the case where we suspect we have not yet thought of the relevant outcome at all — and it must say which of these the principle was actually built for and which it was not. It must confront the fact that waiting for better evidence is sometimes the genuinely precautionary move and sometimes precisely the vice the principle exists to prevent: I want an explicit test for when a delay is a legitimate purchase of information and when it is a decision to let the harm keep running, and I want the procedure to name the error it is committing either way. It must also force us to price the risks of our own intervention — the substitute chemical, the lost benefit, the displaced production, the harm done by the restriction itself — without letting that requirement become a general licence to do nothing, since I have now seen both failure modes and need a procedure that can be accused of neither.

  Practical constraints: ninety days, no new primary research, a unit of six with one economist available two days a week, and a director who will not sign a note whose conclusion is merely that the science is uncertain. Give me the procedure in a form I can put in front of the unit — steps in order, the question to ask at each, what a sufficient answer looks like, where we stop, where we escalate, and a one-page form the case officer fills in. Then run it end to end on three files: a class of insecticides where the laboratory evidence is suggestive, the field evidence is contested, and the registrants argue that every available alternative is worse; a proposal to release a self-propagating engineered organism, where the central problems are irreversibility and the absence of any way to recall what has been released; and a third case I have chosen because I expect the procedure to tell me something I will not want to hear — a widely used flame retardant whose most likely substitute is probably more dangerous than the thing we would be banning, so that I can see whether the procedure really does return a refusal to act, and what it says we owe the people who remain exposed in the meantime. Finally, tell me where this procedure will misfire: the moves that can be gamed by whoever frames the file first, the inputs that look like measurements but are actually choices, and the questions it will keep handing back to me that no procedure can settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Head of Risk-Assessment and Authorisation Unit at a national environment/chemicals agency.
      *   **Context:** 50 proposals/year, 90-day deadline, judicial review risk, staff are scientists/lawyers (not philosophers), Minister can override on socio-economic grounds.
      *   **Problem:** Inconsistent application of the Precautionary Principle (PP), looking foolish in court, need for consistency and transparency.
      *   **Requirements:**
          *   A procedure (ordered set of questions), not an essay.
          *   Entry/exit conditions for each step.
          *   Definition of "sufficient answer."
          *   Points for definite "No," points for escalation to human judgment (values).
          *   Must distinguish PP's two roles: lowering burden of proof vs. licensing action failing cost-benefit.
          *   Must handle 4 epistemic situations (known probs, unknown probs/enumerable outcomes, contested outcomes, unknown unknowns).
          *   Must address the "delay vs. action" dilemma (purchase of info vs. allowing harm).
          *   Must price risks of intervention (substitutes, lost benefits) without becoming a license to do nothing.
          *   Practical constraints: 90 days, no new primary research, 6 staff (1 economist part-time), Director needs a definite conclusion.
          *   Deliverables: The Procedure (steps/questions), a One-Page Form, Three Case Studies (Insecticide, Engineered Organism, Flame Retardant), and a "Failure Modes" analysis.

  2.  **Deconstruct the Precautionary Principle (PP) for this Context:**

      *   The user identifies two distinct functions:
          1.  *Evidentiary Shift:* Less proof needed to restrict than to approve.
          2.  *Value Override:* Acting even if traditional Cost-Benefit Analysis (CBA) says "wait."
      *   The procedure needs to separate these. If the science is solid enough for CBA, use CBA. If not, trigger PP.
      *   Epistemic States:
          1.  *Risk:* Probabilities known. (Standard Risk Assessment)
          2.  *Uncertainty:* Outcomes known, probabilities unknown. (PP Zone 1)
          3.  *Ambiguity:* Outcomes contested. (PP Zone 2 + Values)
          4.  *Ignorance:* Unknown unknowns. (PP Zone 3 + High Caution)
      *   The "Delay" Test: Is waiting gathering info or allowing damage?
      *   The "Intervention Risk" Test: Does the cure kill the patient?

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Goal:* A decision tree that fits 90 days.
      *   *Step 1: Triage (Epistemic Classification).* Where does this file sit? (Risk vs. Uncertainty vs. Ignorance).
      *   *Step 2: The Trigger.* Does it meet the threshold for PP? (Plausibility of harm + Seriousness).
      *   *Step 3: The Delay Test.* Is waiting an option? (Reversibility + Rate of Harm).
      *   *Step 4: The Intervention Test.* What happens if we act? (Substitutes + Economic impact).
      *   *Step 5: The Decision Matrix.* Combining the above to recommend Act, Restrict, Monitor, or Approve.
      *   *Step 6: The Value Escalation.* Where science ends and politics begins (Ministerial override).

      *Refining the Steps:*
      *   Need to ensure the "two jobs" of PP are clear.
      *   Need to ensure the "four epistemic situations" are mapped.
      *   Need to ensure the "90-day" constraint is respected (no new research).

  4.  **Developing the One-Page Form:**

      *   Needs to be fillable by a case officer.
      *   Checkboxes for epistemic state.
      *   Binary questions for the tests.
      *   Signature lines for accountability.

  5.  **Running the Case Studies:**

      *   *Case 1: Insecticides.* Lab evidence suggestive, field contested, alternatives worse.
          *   *Epistemic:* Uncertainty/Ambiguity.
          *   *Delay:* Harm continuing? Yes.
          *   *Intervention:* Substitutes worse? Yes.
          *   *Outcome:* Conditional restriction + Monitoring (The "Middle Path").
      *   *Case 2: Self-Propagating Organism.* Irreversible, no recall.
          *   *Epistemic:* Ignorance/Unknown Unknowns.
          *   *Delay:* Irreversible harm potential.
          *   *Intervention:* N/A (Pre-release).
          *   *Outcome:* Prohibition (The "Hard No").
      *   *Case 3: Flame Retardant.* Substitute more dangerous.
          *   *Epistemic:* Risk/Uncertainty.
          *   *Delay:* Harm continuing.
          *   *Intervention:* Substitute is worse.
          *   *Outcome:* Do not ban (The "Uncomfortable Truth"). Mitigation instead.

  6.  **Analyzing Failure Modes:**

      *   Framing effects (how the problem is defined).
      *   Input bias (scientists estimating "plausibility").
      *   The "Values" black box (where the Director/Minister steps in).

  7.  **Review against Constraints:**

      *   *90 Days:* The procedure relies on existing data, no new research.
      *   *Staff:* Scientists/Lawyers can handle the classification. Economist needed for Step 4.
      *   *Judicial Review:* The logic is explicit. If a judge asks "Why different from File X?", the form shows the epistemic classification differed.
      *   *Minister:* Step 6 explicitly hands off socio-economic overrides.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, bureaucratic but precise, acknowledging the difficulty.
      *   *Structure:*
          1.  Introduction (Acknowledging the brief).
          2.  The Protocol (The Steps).
          3.  The Form.
          4.  The Case Studies.
          5.  The Failure Modes.
      *   *Key Concept:* "The Precautionary Threshold." It's not just "is there harm?" it's "is the harm serious/irreversible enough to lower the proof standard?"
      *   *Key Concept:* "The Substitution Trap." Explicitly checking if the remedy is worse than the disease.

      *(Self-Correction during drafting)*: I initially thought about putting Cost-Benefit in Step 4. But the prompt says PP licenses action *failing* a conventional CBA. So Step 4 must be "Intervention Risk," not standard CBA. Standard CBA belongs in the "Non-PP" track. If PP is triggered, we weigh "Risk of Action" vs "Risk of Inaction," not "Cost vs Benefit."
      *Correction:* Make sure Step 1 filters out standard Risk Assessment cases. PP is only for Uncertainty/Ignorance. If probabilities are known, use standard law. PP is for when standard law stalls.

      *Refining the Epistemic States:*
      1.  Risk (Probs known) -> Standard Assessment.
      2.  Uncertainty (Outcomes known, Probs unknown) -> PP Trigger.
      3.  Ambiguity (Outcomes contested) -> PP + Values.
      4.  Ignorance (Unknown outcomes) -> PP + High Restraint.

      *Refining the Delay Test:*
      Question: "Does delay increase the probability of irreversible harm?"
      If Yes -> Act/Restrict.
      If No -> Monitor/Study.
      Error naming: "Type I Error (False Positive)" vs "Type II Error (False Negative)." Let's use "Error of Commission" vs "Error of Omission."

      *Refining the Ministerial Override:*
      Make it Step 6. "Socio-Economic Adjustment." If the science says Ban, but economy says Crash, Minister decides. But the note must record the Science Recommendation first.

  9.  **Final Polish:** Check against the "90 days" and "no primary research" constraint. Ensure the language is suitable for lawyers/scientists. Ensure the "Three Files" are distinct and test the limits.

      *Case 3 (Flame Retardant)* is crucial. It tests if the procedure allows *inaction* when action is worse. The procedure must conclude "Do Not Ban" but recommend "Mitigation/Research." This satisfies the "honest about structure" requirement.

      *Failure Modes:* Need to highlight that "Epistemic Classification" is the vulnerable point. A clever lawyer can frame uncertainty as risk to avoid PP, or risk as uncertainty to trigger it.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a procedural framework designed for your specific constraints: 90-day turnaround, judicial review resilience, and a staff of scientists and lawyers. It treats the Precautionary Principle (PP) not as a moral imperative but as a decision rule for specific epistemic conditions.

  ### Part 1: The Protocol (The "PP-90" Procedure)

  **Purpose:** To determine whether the Precautionary Principle is triggered, and if so, whether it mandates action, restriction, or monitored delay.
  **Constraint:** No new primary research. Reliance on existing peer-reviewed literature and registrant submissions.
  **Roles:** Case Officer (Scientist/Lawyer), Economic Reviewer (Economist, 2 days/week), Unit Director (Sign-off).

  #### Step 1: Epistemic Classification (Days 1–10)
  **Question:** What is the state of knowledge regarding the hazard?
  **Entry:** File opened.
  **Exit:** File classified into one of four states.
  **Sufficient Answer:** Selection of one state with citation to evidence quality.

  1.  **Risk:** Probabilities and outcomes are known (e.g., toxicity LD50 established).
      *   *Action:* Proceed to Standard Risk Assessment (SRA). **PP Not Triggered.**
  2.  **Uncertainty:** Outcomes are enumerable, probabilities are unknown or disputed (e.g., endocrine disruption mechanisms plausible but dose-response unclear).
      *   *Action:* **PP Triggered.** Proceed to Step 2.
  3.  **Ambiguity:** Outcomes are contested; stakeholders disagree on what counts as harm (e.g., ecosystem "health" definitions).
      *   *Action:* **PP Triggered.** Proceed to Step 2. Flag for Value Judgment (Step 5).
  4.  **Ignorance:** Suspected unknown outcomes; "Unknown Unknowns" (e.g., self-propagating gene drives).
      *   *Action:* **PP Triggered.** Proceed to Step 2. Presumption of Restraint.

  *Note: PP is built for Uncertainty and Ignorance. It is not a substitute for SRA in Risk states.*

  #### Step 2: The Trigger Threshold (Days 11–20)
  **Question:** Is the potential harm sufficient to lower the standard of proof?
  **Entry:** PP Triggered in Step 1.
  **Exit:** Decision on whether to invoke PP powers or revert to SRA.
  **Sufficient Answer:** Binary Yes/No based on two criteria.

  1.  **Plausibility:** Is there a scientifically credible mechanism for harm? (Not proof, but >0.1% plausibility).
  2.  **Severity:** If the harm occurs, is it irreversible, widespread, or catastrophic?

  *   **If No:** Revert to Standard Risk Assessment. (PP not justified).
  *   **If Yes:** Invoke PP. Burden of proof shifts to the applicant to demonstrate safety. Proceed to Step 3.

  #### Step 3: The Delay Test (Days 21–40)
  **Question:** Is waiting for better evidence a purchase of information or a decision to allow harm?
  **Entry:** PP Invoked.
  **Exit:** Determination on timing.
  **Sufficient Answer:** Identification of the "Error Type" associated with waiting.

  1.  **Reversibility:** If the harm occurs during the wait, can it be undone?
      *   *No:* Waiting is **Error of Omission** (Allowing harm). -> Favor Immediate Action.
      *   *Yes:* Proceed to Q2.
  2.  **Rate of Exposure:** Is the exposure increasing rapidly during the wait?
      *   *Yes:* Waiting is **Error of Omission**. -> Favor Immediate Action.
      *   *No:* Proceed to Q3.
  3.  **Information Yield:** Will a 12-month review (your conditional route) significantly resolve the Uncertainty (Step 1)?
      *   *Yes:* Waiting is **Legitimate Purchase of Information**. -> Favor Conditional Approval/Monitoring.
      *   *No:* Waiting is **Procrastination**. -> Favor Immediate Action.

  #### Step 4: The Intervention Test (Days 41–60)
  **Question:** Does the remedy cause more harm than the disease?
  **Entry:** Action favored in Step 3.
  **Exit:** Assessment of Intervention Risk.
  **Sufficient Answer:** Economic Reviewer sign-off on substitute analysis.

  1.  **Substitution:** Is there a viable alternative?
      *   *No:* Ban creates supply chain collapse. -> **Flag for Ministerial Override (Step 6).**
      *   *Yes:* Proceed to Q2.
  2.  **Regrettable Substitution:** Is the alternative *known* to be more hazardous (Risk State) or equally uncertain (Uncertainty State)?
      *   *Yes:* Action creates **Error of Commission** (Harm by intervention). -> **Do Not Ban.** Proceed to Mitigation Strategy.
      *   *No:* Proceed to Recommendation.

  #### Step 5: The Value Escalation (Days 61–75)
  **Question:** Is the remaining disagreement scientific or political?
  **Entry:** Ambiguity state (Step 1) or Conflict in Step 4.
  **Exit:** Clear demarcation of scientific recommendation vs. socio-economic choice.
  **Sufficient Answer:** A statement of "Scientific Recommendation" separate from "Policy Options."

  *   **Procedure:** If the science says "Ban" but the economic cost is "High," the Note must recommend "Ban" and explicitly state: *"Implementation requires socio-economic trade-off outside scientific mandate."*
  *   **Handoff:** This is the handoff point to the Minister. Do not smuggle economics into Step 2 or 3.

  #### Step 6: Final Determination (Days 76–90)
  **Question:** What is the definitive regulatory outcome?
  **Entry:** All previous steps completed.
  **Exit:** Signed Decision Note.
  **Sufficient Answer:** One of five outcomes.

  1.  **Approve:** (Risk low, PP not triggered).
  2.  **Restrict:** (PP triggered, Action favored, Intervention safe).
  3.  **Withdraw:** (Existing substance, PP triggered, Action favored).
  4.  **Conditional:** (PP triggered, Delay is legitimate purchase of info). 12-month review mandated.
  5.  **No Action (Mitigation Only):** (PP triggered, but Intervention Risk > Risk of Inaction).

  ---

  ### Part 2: The Case Officer's Form (One Page)

  **FILE ID:** _______________ **SUBSTANCE:** _______________ **DATE:** _______________

  **SECTION 1: EPISTEMIC STATE (Check One)**
  [ ] **Risk:** Probs/Outcomes known. (Stop. Use Standard Risk Assessment).
  [ ] **Uncertainty:** Outcomes known, Probs unknown. (PP Active).
  [ ] **Ambiguity:** Outcomes contested. (PP Active + Value Flag).
  [ ] **Ignorance:** Unknown outcomes possible. (PP Active + Presumption of Restraint).

  **SECTION 2: TRIGGER THRESHOLD**
  Plausible mechanism of harm? [ ] Yes [ ] No
  Severity (Irreversible/Catastrophic)? [ ] Yes [ ] No
  *If both No, revert to Standard Assessment.*

  **SECTION 3: THE DELAY TEST**
  If we wait 12 months, is harm irreversible? [ ] Yes [ ] No
  Does exposure grow rapidly during wait? [ ] Yes [ ] No
  Will 12 months of data resolve the uncertainty? [ ] Yes [ ] No
  *Decision:* [ ] Act Now (Error of Omission risk) [ ] Monitor (Legitimate Info Purchase)

  **SECTION 4: INTERVENTION RISK (Economist Initials: ____)**
  Viable substitute available? [ ] Yes [ ] No
  Substitute more dangerous/uncertain? [ ] Yes [ ] No
  *If Substitute Worse:* Recommendation = **No Ban / Mitigation.**

  **SECTION 5: RECOMMENDATION**
  [ ] Approve
  [ ] Restrict/Withdraw
  [ ] Conditional (12-mo Review)
  [ ] No Action (Intervention Risk too high)

  **SECTION 6: MINISTERIAL FLAG**
  Does this recommendation require socio-economic trade-off? [ ] Yes [ ] No
  *If Yes, attach "Policy Options" memo. Do not alter Scientific Recommendation.*

  **Case Officer Signature:** ___________________ **Director Signature:** ___________________

  ---

  ### Part 3: Case Studies (End-to-End Run)

  #### Case 1: The Insecticide (Class A)
  *   **Facts:** Lab evidence suggests bee colony collapse. Field evidence contested (industry says "varroa mites," NGOs say "chemical"). Registrants argue alternatives are more toxic to humans.
  *   **Step 1 (Epistemic):** **Uncertainty.** Mechanism plausible, field probabilities unknown.
  *   **Step 2 (Trigger):** **Yes.** Plausible + Severity (ecosystem collapse) is high. PP Invoked.
  *   **Step 3 (Delay):** **Conditional.** Harm (bee loss) is seasonal/recoverable? Debatable. But 12-month field study *could* resolve the field vs. lab conflict. Waiting is a **Legitimate Purchase of Information**.
  *   **Step 4 (Intervention):** **High Risk.** Alternatives are more toxic to humans. Banning creates human health risk.
  *   **Step 5 (Values):** Trade-off between Pollinators and Human Toxicity.
  *   **Step 6 (Outcome):** **Conditional Approval.**
      *   *Reasoning:* PP triggers burden of proof on registrant. They must fund the 12-month field study. Use is restricted (no spray during flowering) to mitigate immediate risk without forcing the "Regrettable Substitution."
      *   *Judicial Defense:* We treated uncertainty as Uncertainty, not Risk. We balanced Error of Omission (bees) vs. Error of Commission (human toxicity).

  #### Case 2: The Engineered Organism (Self-Propagating)
  *   **Facts:** Mosquito modification to stop malaria. Self-propagating. Cannot be recalled.
  *   **Step 1 (Epistemic):** **Ignorance.** Evolutionary pathways unknown. "Unknown Unknowns."
  *   **Step 2 (Trigger):** **Yes.** Severity is potentially irreversible ecosystem shift.
  *   **Step 3 (Delay):** **Act Now (Restrict).** Waiting until release is too late. Irreversibility is absolute. Delay = **Error of Omission** (once released, cannot undo).
  *   **Step 4 (Intervention):** **Low Risk.** Not releasing causes no physical harm (status quo maintained). Economic loss to developer is not "harm" under environmental statute.
  *   **Step 5 (Values):** None. Science dictates restraint.
  *   **Step 6 (Outcome):** **Refusal to Authorise.**
      *   *Reasoning:* PP built for Ignorance. Irreversibility dictates that the burden of proof (safety) cannot be met by definition.
      *   *Judicial Defense:* Epistemic state (Ignorance) differs from Case 1 (Uncertainty). Irreversibility test failed.

  #### Case 3: The Flame Retardant (The Uncomfortable Truth)
  *   **Facts:** Chemical X accumulates in humans. Likely carcinogen. Substitute Chemical Y is chemically similar, less studied, but preliminary data suggests higher neurotoxicity. Product is essential for fire safety in public buildings.
  *   **Step 1 (Epistemic):** **Risk/Uncertainty Hybrid.** X is Risk (carcinogen probable). Y is Uncertainty.
  *   **Step 2 (Trigger):** **Yes.** Harm is severe (cancer).
  *   **Step 3 (Delay):** **Act Now.** Exposure is continuous in public buildings.
  *   **Step 4 (Intervention):** **Critical Failure.** Substitute Y is likely worse. Ban forces switch to Y.
      *   *Result:* **Error of Commission.** Banning X increases net harm.
  *   **Step 5 (Values):** Fire safety vs. Long-term toxicity.
  *   **Step 6 (Outcome):** **No Action (on Ban) + Mitigation.**
      *   *Reasoning:* PP does not mandate action if action increases risk. The procedure forces us to admit we cannot ban this yet.
      *   *Obligation to Exposed:* We owe them a **Mitigation Plan** (ventilation standards, exposure monitoring) and a **Research Mandate** to find a safe Substitute Z.
      *   *Judicial Defense:* We did not ignore the risk. We priced the intervention. A ban would be negligent. The Note explicitly states: *"Scientific recommendation is against prohibition due to Regrettable Substitution."* This protects the Director from claims of inaction; it frames inaction as the safer scientific choice.

  ---

  ### Part 4: Failure Modes & Limitations

  This procedure is robust, but it is not immune to gaming. Here is where it will misfire:

  **1. The Framing Gambit (Step 1 Vulnerability)**
  *   **The Move:** An applicant will frame a file as **Risk** (probabilities known, low) to avoid PP. An NGO will frame the same file as **Ignorance** (unknown unknowns) to trigger PP.
  *   **The Weakness:** The Case Officer's classification in Step 1 is subjective.
  *   **Mitigation:** Require the Case Officer to cite *why* a state was chosen (e.g., "Classified as Uncertainty because dose-response is extrapolated from rats, not humans"). Judicial review will focus on whether this classification was *reasonable*, not whether it was *perfect*.

  **2. The "Substitute" Black Box (Step 4 Vulnerability)**
  *   **The Move:** Claiming a substitute is "worse" requires data. If data is missing, is it "Uncertainty" (ban it) or "Ignorance" (don't ban it)?
  *   **The Weakness:** Your economist is part-time. They may rely on registrant data for substitute costs/risks.
  *   **Mitigation:** In Step 4, if substitute data is missing, the default must be **Presumption of Equality**, not Presumption of Safety. If we don't know if the substitute is worse, we cannot assume it is better. This usually leads to Conditional Approval (Case 1) rather than a Ban.

  **3. The Values Smuggle (Step 5 Vulnerability)**
  *   **The Move:** Staff uncomfortable with a "No Ban" decision (Case 3) may inflate the "Severity" in Step 2 to force a Restriction, bypassing Step 4.
  *   **The Weakness:** Human desire to "do something."
  *   **Mitigation:** The Director must audit Step 2 classifications on all "No Ban" decisions. If Step 2 says "High Severity" but Step 6 says "No Action," the logic in Step 4 must be bulletproof.

  **4. The Questions No Procedure Can Settle**
  *   **How much uncertainty is enough?** The procedure lowers the burden of proof, but someone must decide the new threshold. That is you, the Director.
  *   **What is "Catastrophic"?** Is the loss of one bee species catastrophic? Is the loss of 5% of crop yield catastrophic? These are values, not facts. Step 5 hands this to the Minister, but in practice, your Unit defines it.
  *   **The "Waiting" Paradox:** Sometimes, acting now (banning) stops the data collection needed to confirm the harm. If you ban, you may never know if you were right. The procedure accepts this (Case 2), but it is a permanent epistemic blind spot.

  ### Implementation Note for the Director
  When you sign a Note generated by this procedure, you are not signing that you are *right* about the science. You are signing that the *process* was followed. In cross-examination, your defense is not "We knew the harm," it is "We classified the uncertainty as Type B, applied the Delay Test, found the Intervention Risk too high, and documented the Ministerial Flag." That is how you survive the judge.
