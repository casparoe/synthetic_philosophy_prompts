answer: |-
  Here is a complete lesson plan designed to generate the intuitions underlying the Knowledge Norm of Assertion (KNA) without naming it until the debrief.

  ## **Session Overview**
  *   **Topic:** The Norm of Assertion (Pre-theoretical Intuition Pump)
  *   **Time:** 75 Minutes
  *   **Class Size:** 15 Students (Divided into 3 tables of 5)
  *   **Goal:** Students will intuitively penalize assertions that lack knowledge (even if true) and hesitate on false assertions that are reasonable, leading them to identify "Knowledge" as the hidden common denominator of proper assertion.

  ---

  ## **1. Materials**
  You need to prepare three identical **Game Kits** (one per table).

  **A. The Currency**
  *   Poker chips, candies, or slips of paper marked "10 pts."
  *   Each student starts with **10 points**.

  **B. The Deck (15 Cards per Kit)**
  Each kit contains 5 "Scenario Packs." Each Pack has two cards:
  1.  **The Claim Card:** Read aloud by the *Asserter*.
  2.  **The Inside Info Card:** Read silently by the *Asserter* (this determines their epistemic state).

  *Design Note:* The Inside Info cards use narrative descriptions, **not** epistemic jargon (no "justified," "knowledge," "lemma").

  **The 5 Scenario Packs (Per Kit):**
  1.  **Standard (Control):**
      *   *Claim:* "The meeting is in Room 302."
      *   *Inside Info:* "You were in Room 302 yesterday. You saw the sign on the door. The meeting is indeed in Room 302."
  2.  **The False Belief (Case A):**
      *   *Claim:* "The meeting is in Room 302."
      *   *Inside Info:* "You checked the official department website this morning. It listed Room 302. The website had a typo; the meeting is actually in Room 304. You have no reason to doubt the website."
  3.  **The Lottery (Case B):**
      *   *Claim:* "Your ticket did not win the jackpot."
      *   *Inside Info:* "The odds are 1 in 10 million. You haven't checked the results yet. Statistically, you almost certainly lost. In fact, you *did* lose."
  4.  **The Gettier (Case C):**
      *   *Claim:* "The boss is in her office."
      *   *Inside Info:* "You saw the boss's coat on the rack and her lights on. You assume she is there. Actually, she left an hour ago but forgot her coat and lights. However, she just walked back in the side door 10 seconds ago. She is there."
  5.  **Standard (Control 2):**
      *   *Claim:* "It is raining outside."
      *   *Inside Info:* "You are looking out the window. You see rain. It is raining."

  **C. Voting Paddles (or Slips)**
  *   Two options per student: **ALLOW** (Green) / **PENALIZE** (Red).

  ---

  ## **2. The Rules**
  *Hand this sheet to each table.*

  **Objective:** Maintain your points. Points are lost by making "Improper Assertions" or making "Frivolous Challenges."

  **Roles (Rotate each round):**
  1.  **Asserter:** Draws a Scenario Pack. Reads the *Claim Card* aloud to the table. Reads the *Inside Info Card* silently.
  2.  **Challenger:** One student (volunteer or clockwise) may issue a challenge.
  3.  **Jury:** The other 3 students at the table.

  **Procedure:**
  1.  **Assertion:** Asserter states the claim confidently (e.g., "It is raining").
  2.  **Challenge Phase:** The Challenger may say "I Challenge" or pass.
      *   If they pass, the Asserter gains **1 point** (Reward for uncontested assertion). Round ends.
      *   If they challenge, the Asserter must reveal the *Inside Info Card* to the Jury only (not the Challenger).
  3.  **Verdict:** The Jury votes secretly (ALLOW or PENALIZE).
      *   **Majority ALLOW:** The assertion was proper. Challenger pays Asserter **2 points**.
      *   **Majority PENALIZE:** The assertion was improper. Asserter pays Challenger **2 points**.
  4.  **Rotation:** Pass the Scenario Pack to the next student. Play 5 rounds.

  **The Golden Rule:** Do not discuss *why* you are voting until the game is completely over. Vote based on your gut feeling: *Did the Asserter have the right to say that?*

  ---

  ## **3. Timeline (75 Minutes)**

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Rules** | Distribute kits. Emphasize: "No epistemic jargon in voting. Just 'Right' or 'Wrong' to say it." |
  | **10-55** | **Gameplay** | 3 Tables × 5 Rounds. ~9 mins per round. Instructor circulates to ensure rules are followed, not to answer philosophy questions. |
  | **55-60** | **Data Aggregation** | Collect voting totals for each Scenario Type on the whiteboard. |
  | **60-75** | **Debrief** | Connect the voting patterns to Truth, Belief, and Knowledge norms. |

  ---

  ## **4. The Debrief Script**
  *Do not reveal the "Knowledge Norm" until the end.*

  **Step 1: The Data Reveal (5 mins)**
  Write the % of **PENALIZE** votes on the board for each scenario type.
  *   *Standard:* Expect <10% Penalty.
  *   *Lottery:* Expect >80% Penalty.
  *   *Gettier:* Expect >70% Penalty.
  *   *False Belief:* Expect ~50% Penalty (Split vote).

  **Step 2: Interrogating the Truth Norm (5 mins)**
  *   **Ask:** "Look at the Lottery card. The statement was **True**. You penalized it. Look at the Standard card. The statement was **True**. You allowed it."
  *   **Question:** "If the only rule was 'Don't say false things,' why did you penalize the Lottery assertion?"
  *   **Point:** Truth is necessary, but not sufficient. The Truth Norm is too weak.

  **Step 3: Interrogating the Belief/Justification Norm (5 mins)**
  *   **Ask:** "Look at the False Belief card. The statement was **False**. Yet roughly half of you let it slide. Why?"
  *   **Student Answer:** "They couldn't have known," or "It wasn't their fault."
  *   **Question:** "If the rule was 'Don't say what you don't believe' or 'Don't say what isn't supported,' the False Belief should be safe (they believed it, it was supported). But you hesitated. Why?"
  *   **Point:** Belief and Evidence matter, but they don't guarantee propriety if the fact isn't there.

  **Step 4: The Gettier Intuition (5 mins)**
  *   **Ask:** "The Gettier card was **True**. The Asserter **Believed** it. They had **Evidence** (coat/lights). Yet you penalized it."
  *   **Question:** "What was missing? They had Truth. They had Belief. They had Evidence."
  *   **Target Answer:** "They didn't *know* it." / "It was luck."
  *   **Point:** This is the crux. You penalized assertions where the connection to the truth was accidental, even if the truth was secured.

  **Step 5: Naming the Norm (5 mins)**
  *   **Reveal:** "You have just reconstructed the **Knowledge Norm of Assertion**. The rule you were implicitly using is: *Assert $p$ only if you Know $p$.*"
  *   **Map it:**
      *   Standard = Knowledge (Allowed)
      *   Lottery = No Knowledge (Penalized)
      *   Gettier = No Knowledge (Penalized)
      *   False Belief = No Knowledge (Split/Debated)
  *   **Closing Thought:** "Why do we care? Why not just assert what is true? Next week we discuss the *value* of knowledge."

  ---

  ## **5. Troubleshooting: What Will Go Wrong**

  **1. The "Truth Absolutist" Problem**
  *   **Prediction:** Some students will vote to PENALIZE the *False Belief* card 100% of the time, arguing "It was a lie."
  *   **Fix:** During the game, if you hear this, remind them: "Judge the *Asserter's position*, not just the fact. If you were them, would you feel allowed to say it?" In the debrief, use this dissent to highlight the tension between the Truth Norm and the Knowledge Norm. The split vote is actually better data than a consensus, so don't worry if it's not perfectly 50/50.

  **2. The "Gaming the Points" Problem**
  *   **Prediction:** Students might challenge every card to rack up points, or never challenge to avoid risk.
  *   **Fix:** The payoff scheme (Challenger pays if wrong) discourages frivolous challenges. If a table is chaotic, intervene: "Remember, if you challenge and the Jury says Allow, *you* lose points. Only challenge if you feel a genuine normative violation."

  **3. The "Gettier Confusion" Problem**
  *   **Prediction:** Students might miss the nuance in the Gettier card and treat it as a Standard card because "The boss *was* there."
  *   **Fix:** Ensure the *Inside Info Card* is explicit about the timeline (left an hour ago, came back 10 seconds ago). If they miss it, the data will look wrong. In the debrief, if the Gettier penalty is low, ask: "Did anyone notice the boss left and came back? Does that luck change whether you *knew* it?"

  **4. Time Creep**
  *   **Prediction:** Discussions during the game will eat the 45-minute play block.
  *   **Fix:** Be a strict timekeeper. Announce "1 minute left" for each round. Remind them: "Debate is for the debrief. Vote now."

  ---

  ## **6. Limitations: What This Game Cannot Do**
  *Be frank with yourself (and optionally the class) about these boundaries.*

  1.  **It Doesn't Prove KNA is Correct:** The game shows that our *intuitions* align with KNA better than Truth or Belief norms. It does not prove KNA is the *correct* philosophical account. (Alternative: The "Warranted Assertibility" account might explain the same data).
  2.  **It Doesn't Explain *Why*:** The game generates the *that*, not the *why*. It doesn't explain *why* knowledge is the norm (e.g., is it constitutive of assertion? Is it instrumental for informing others?). You must supply this theoretical heavy lifting in the lecture following the game.
  3.  **It Flattens Context:** The game treats all assertions as having equal stakes. In reality, the norm might shift with stakes (e.g., asserting a medical diagnosis vs. asserting the time). The game implies a invariant norm, which is a point of contention in epistemology (Contextualism vs. Invariantism).
  4.  **The "False Belief" Ambiguity:** The game relies on students distinguishing between *culpable* false belief (lying/guessing) and *inculpable* false belief (reasonable error). If your scenario isn't written carefully, students will treat all false assertions as lies, muddying the data.

  ## **Instructor's Cheat Sheet for the "Inside Info" Cards**
  *Copy these exactly to ensure the intuitions land.*

  *   **Standard:** "You saw it with your own eyes 5 minutes ago. It is true."
  *   **False Belief:** "You checked the reliable official source. It had a rare error. It is false. You are not negligent."
  *   **Lottery:** "You have not checked the result. The odds are 99.99% in your favor. It is true."
  *   **Gettier:** "Your evidence points to the truth, but only by accident. The causal chain is broken. It is true."
