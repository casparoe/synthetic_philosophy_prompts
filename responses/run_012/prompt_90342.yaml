prompt: |-
  I keep returning to Dewey's experimentalism — the idea that inquiry is the business of converting a confused, unsettled situation into a settled one, and that this experimental attitude ought to be extended from physics to morals and politics, with democracy understood as a mode of associated living rather than a mere voting mechanism. A friend of mine from the rationalist forums has picked this up and pushed it further than I think it will bear. His line is that democracy simply is science applied to politics: a policy is a hypothesis, an election or a pilot scheme is the experiment, public criticism is peer review, the next cycle is replication, and the whole arrangement is self-correcting. From this he draws a practical conclusion — that we should treat governance as continuous experimentation (reversible pilots, published results, public updating, a standing willingness to abandon what fails), and that we should therefore be much less exercised about the ways real democracies fall short of ideal deliberation, because the machinery corrects itself over time.

  I want the analogy audited rather than applauded. Give me the correspondence table first: what in political life plays the role of the hypothesis, the experimental intervention, the control condition, the replication, the peer review, the laboratory, the anomaly, and the research community. Then tell me where the mapping breaks — and I care about the disanalogies that bear on his conclusion, not merely any difference you can find. Among the candidates I want weighed: that there is no control condition because the whole polity is treated at once; that nothing replicates because the system mutates underneath the experiment; that the experimenter is also the subject and bears the cost; that the outcome measure is itself one of the things in dispute; that reversibility is often fictitious because the people who lost the experiment are dead, ruined, or exiled; that there is no external standpoint from which the result can be read off; and that a public, on Dewey's own account, is constituted by those caught up in the indirect consequences of others' actions, which makes the boundary of the experimental population a political artefact rather than a given. Tell me which of these do real work against his conclusion and which are decorative.

  Then say what the analogy quietly imports from the source side: a neutral measure of success, cheap failure, a consensus that tracks the truth rather than power, a community already sharing a problem and a vocabulary, and the pragmatist substitution of warranted assertibility for truth — does that last move help the analogy or quietly dissolve what made science the model in the first place? Say whether Dewey's own version of the comparison avoids these imports or commits them too, and whether it matters that his experimentalism was as much a claim about the structure of inquiry as a recommendation about institutions.

  Finally, the verdict I actually want: does his conclusion — treat policy as experiment, and be relaxed about democratic deficits because it self-corrects — survive once the disanalogies are on the table, or was the analogy carrying the conclusion all along? If a different comparison would do the work he wants, offer it and say what it would change. And tell me what would change your mind: which consideration, if it came out one way rather than the other, would flip your assessment of how far the analogy holds, and where your reasoning is most likely to fail. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** John Dewey's experimentalism applied to democracy/politics.
      *   **Opponent:** A friend (rationalist background) who pushes the analogy too far ("Democracy *is* science applied to politics").
      *   **Task:** Audit the analogy, not applaud it.
      *   **Specific Requirements:**
          1.  Provide a correspondence table (Hypothesis, Intervention, Control, Replication, Peer Review, Lab, Anomaly, Community).
          2.  Identify where the mapping breaks (focusing on disanalogies that impact the friend's conclusion about self-correction and relaxed attitudes toward democratic deficits).
          3.  Evaluate specific candidate disanalogies provided by the user (No control, No replication, Experimenter=Subject, Disputed outcomes, Irreversibility, No external standpoint, Public boundaries). Distinguish "real work" vs. "decorative."
          4.  Analyze what the analogy quietly imports (Neutral measure, Cheap failure, Truth-tracking consensus, Shared vocabulary, Warranted assertibility). Does "warranted assertibility" help or dissolve the model?
          5.  Assess Dewey's own version vs. the friend's version.
          6.  **Verdict:** Does the conclusion survive? Was the analogy carrying the conclusion?
          7.  **Alternative:** Offer a better comparison if applicable.
          8.  **Meta-Cognition:** What would change my mind? Where might my reasoning fail?
          9.  **Style:** British English.

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise:* Democracy = Science applied to politics.
      *   *Mechanism:* Policy = Hypothesis, Election/Pilot = Experiment, Criticism = Peer Review, Cycle = Replication.
      *   *Conclusion:* Governance should be continuous experimentation; we should be relaxed about democratic deficits because the system self-corrects over time.
      *   *Weakness:* It assumes the self-correcting mechanism of science transfers cleanly to politics, ignoring power, harm, and the lack of objective truth conditions in values.

  3.  **Drafting the Correspondence Table:**
      *   Need to map scientific terms to political terms based on the friend's logic.
      *   *Hypothesis:* Policy proposal / Manifesto pledge.
      *   *Intervention:* Legislation / Implementation.
      *   *Control:* Counterfactual (what would have happened otherwise) / Opposition party jurisdiction (if federal).
      *   *Replication:* Re-election / Implementation in other jurisdictions.
      *   *Peer Review:* Media scrutiny / Opposition critique / Academic analysis.
      *   *Laboratory:* The Polity / Specific constituencies.
      *   *Anomaly:* Unintended consequences / Scandal / Crisis.
      *   *Research Community:* The Electorate / Civil Society / Experts.

  4.  **Analyzing the Disanalogies (The "Audit"):**
      *   *Candidate 1: No Control Condition.* In science, you isolate variables. In politics, everything changes at once (history, economy, external shocks). *Verdict:* Real work. Makes causal attribution nearly impossible, undermining "self-correction."
      *   *Candidate 2: No Replication.* History doesn't repeat. Context shifts. *Verdict:* Real work. You can't rerun the 2008 financial crisis policy to check robustness.
      *   *Candidate 3: Experimenter = Subject.* Scientists don't usually live in the petri dish. Citizens do. *Verdict:* Real work. Raises stakes, introduces bias.
      *   *Candidate 4: Disputed Outcome Measures.* Science agrees on metrics (e.g., p-value, temperature). Politics fights over values (GDP vs. Equality). *Verdict:* Real work. Crucial. If you can't agree on "success," you can't correct.
      *   *Candidate 5: Irreversibility.* "Cheap failure" in science. In politics, people die or lose rights. *Verdict:* Real work. Directly attacks the "relaxed about deficits" conclusion.
      *   *Candidate 6: No External Standpoint.* Theory-laden observation exists in science, but reality pushes back harder. In politics, "reality" is interpreted through ideology. *Verdict:* Real work.
      *   *Candidate 7: Public Boundaries.* Dewey's point. The "who" is part of the problem. *Verdict:* Decorative/Philosophical. Important for Dewey, less for the friend's mechanistic claim.

  5.  **Analyzing the Imports:**
      *   *Neutral Measure:* Politics lacks this.
      *   *Cheap Failure:* Politics makes failure expensive (human cost).
      *   *Truth-tracking:* Science tracks physical reality; politics tracks power/compromise.
      *   *Shared Vocabulary:* Politics is often defined by *incommensurable* vocabularies.
      *   *Warranted Assertibility:* Dewey's move. It shifts from "Truth" to "What works for this situation." Does this help? It helps avoid dogmatism, but the friend uses it to justify *technocratic* confidence. Dewey used it to justify *democratic participation*. The friend dissolves the moral weight by making it procedural.

  6.  **Dewey vs. The Friend:**
      *   Dewey: Experimentalism is a *moral attitude* of fallibilism and communication. Democracy is "associated living."
      *   Friend: Experimentalism is a *mechanism* for optimization. Democracy is a "machine" for truth-seeking.
      *   Difference: Dewey cares about the *process* of inquiry being inclusive. The friend cares about the *output* being correct. The friend commits the technocratic fallacy Dewey warned against.

  7.  **The Verdict:**
      *   Does the conclusion survive? No. The "relaxed about deficits" part fails because the feedback loop is noisy, biased, and costly. The analogy was carrying the conclusion.
      *   Alternative Comparison: *Ecology* or *Evolutionary Biology*. Less about controlled truth, more about adaptation, survival, and messy interdependence. Or *Navigation* (steering a ship in a storm without a map).
      *   What changes my mind? If we could demonstrate robust causal inference in policy (e.g., via Randomised Control Trials at scale) *and* agreement on value metrics.

  8.  **Refining the Tone and Language:**
      *   British English (organise, programme, centre, colour, etc.).
      *   Tone: Rigorous, philosophical, critical but fair.
      *   Structure: Follow the prompt's sequence strictly.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Warranted Assertibility"? *Correction:* Ensure I explain how substituting truth for warranted assertibility changes the game. For the friend, it means "what works." For Dewey, it means "what resolves the problematic situation for the community." The friend ignores the "community" part.
      *   *Check:* Did I distinguish "Real Work" vs "Decorative" disanalogies? *Correction:* Be explicit. The "Public Boundaries" one is Deweyan gold but might not refute the friend's *mechanistic* claim as hard as "Irreversibility." I need to weigh them carefully. Actually, the boundary issue is crucial because if you can't define the population, you can't define the sample. I will argue it's "Real Work" regarding the *definition* of the experiment, but "Irreversibility" is the killer for the *moral* conclusion.
      *   *Check:* Meta-cognition section. Need to be honest about where my own bias lies (likely against the rationalist/technocratic view).

  10. **Final Polish:** Ensure British spelling (labour, analyse, programme, etc.) and idioms. (e.g., "carry the conclusion," "do real work").

  *(Self-Correction on "Public Boundaries"):* The prompt asks to weigh the candidates. I should explicitly categorise them.
  *   No Control: Real Work.
  *   No Replication: Real Work.
  *   Experimenter=Subject: Real Work.
  *   Disputed Outcomes: Real Work (Fatal).
  *   Irreversibility: Real Work (Fatal to the "relaxed" conclusion).
  *   No External Standpoint: Real Work.
  *   Public Boundaries: Real Work (for Dewey, decorative for the friend's technocratic view, but undermines the "lab" definition). I'll classify it as Real Work because it undermines the "sample" integrity.

  *(Refining the Alternative Analogy):* Navigation is good. Cybernetics (steering) is also good. Let's go with *Navigation* or *Complex Systems Engineering*. Navigation captures the lack of a fixed map and the high stakes.

  *(Refining the "Change My Mind" section):* Need a specific empirical or philosophical condition. Successful widespread use of RCTs in policy *combined* with a stable Overlapping Consensus on values (Rawls).

