          *   Crucial Difference: In Lottery, you *know* one proposition in the set is false (one ticket wins). In Preface, you believe the conjunction is false, but you don't know *which* one. (Wait, actually in Lottery you know the disjunction is true, so the conjunction of negations is false. In Preface, you believe the conjunction of claims is false).
          *   Actually, the bigger difference is often cited as: Lottery propositions are *independent*. Preface claims might not be. If claims are independent, probability multiplies down fast. If dependent, maybe not.
      *   *Step 3: Challenge the "Certainty" Solution.*
          *   This is the biggest hurdle. The "No Statistical Beliefs" rule is essentially **Infallibilism**.
