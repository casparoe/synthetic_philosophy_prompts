  The Lottery and Preface are distinct engines stressing the same triad. Lottery exploits probabilistic aggregation to force inconsistency; Preface exploits fallibilism to force known falsity. Treat them as separate stress tests: one targets the math of aggregation, the other targets the norms of humility.

  ### Table 1: The Requirements

  | Requirement | What it demands (one line) | The case or consideration that forces it | Status (Genuine/Negotiable/Preference) | Which position it rules out (one line max) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lockean Threshold** | Accept any proposition where credence exceeds *t*. | Everyday assertion; 99.9% ticket loss. | Negotiable (Bayesian preference) | Rules out Certainty-Only Orthodoxy. |
  | **Conjunction Closure** | If you accept *A* and *B*, you must accept *A & B*. | Premise-based reasoning; Preface paradox. | Negotiable (Kyburgian preference) | Rules out Non-aggregating accounts. |
  | **Consistency** | You cannot accept a known inconsistent set. | Lottery paradox; Rational agency. | Genuine Constraint | Rules out Paraconsistent/Dialetheic views. |
  | **Dependency Sensitivity** | Acceptance tracks joint probability structures, not marginals. | 1000 compatible claims; Miscalibrated instrument. | Genuine Constraint | Rules out Naive Threshold views. |
  | **Normative Link** | Acceptance must license assertion and action directly. | State/act distinction; Teaching spec. | Genuine Constraint | Rules out Purely descriptive doxasticism. |
  | **Non-Arbitrariness** | No sharp cutoff without explanatory mechanism. | 999 vs 1000 tickets; Sorites pressure. | Genuine Constraint | Rules out Stipulative Thresholds. |

  ### Table 2: The Clashes

  | The Requirements that Clash | Why they can't hold together (argument in a few lines) | What any theory has to give up | Who gives up what |
  | :--- | :--- | :--- | :--- |
  | **Threshold + Closure + Consistency** | High individual probability does not guarantee high joint probability (Lottery) or truth (Preface); accepting all violates consistency. | One leg of the triad must break. | **Kyburgians** drop Closure; **Bayesians** drop Threshold; **Orthodox** drop Fallibilism. |
  | **Threshold + Dependency Sensitivity** | A fixed threshold ignores whether errors are independent (Lottery) or correlated (Instrument); marginal probability is insufficient. | Threshold must be sensitive to structure or abandoned. | **Naive Probabilists** drop Sensitivity; **Contextualists** make Threshold variable. |
  | **Normative Link + Consistency** | If acceptance licenses assertion, and I know my conjunction is false (Preface), I cannot assert the conjunction despite accepting conjuncts. | Either assertion norms or acceptance norms must loosen. | **Pragmatists** loosen Assertion; **Conservatives** loosen Acceptance. |

  Conjunction Closure is the single requirement that excludes the most viable fallibilist accounts.
