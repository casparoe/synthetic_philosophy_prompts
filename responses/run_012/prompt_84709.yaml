  # RESTITUTION ADVISORY PANEL: INTAKE SHEET (FACTS ONLY)
  **To be completed by Curator prior to Panel review. Do not include argumentation or moral characterisation.**

  **1. Object Identification**
  *   Accession Number(s):
  *   Description & Material:
  *   Date of Manufacture/Origin:
  *   Current Location/Storage Status:

  **2. Provenance Window (1880–1930)**
  *   Date of Acquisition by Museum:
  *   Method of Acquisition (Purchase, Gift, Bequest, Transfer from State/Other Museum):
  *   Immediate Source (Name/Role of Seller/Donor):
  *   Source's Connection to Colonial/Military Administration (Yes/No/Unknown):
  *   Territory of Origin (Modern State Name & Historical Designation):

  **3. Claimant Identification**
  *   Claimant Name & Type (State Body, Community Org, Royal House, Individual/Heir, Diaspora Group):
  *   Date Claim Received:
  *   Claimant's Stated Relationship to Object (Owner, Descendant, Custodian, Cultural Representative):
  *   Evidence of Continuity Submitted (Genealogy, Institutional Charter, Oral History Record, Treaty):

  **4. The Request**
  *   Specific Remedy Sought (Return of Title, Physical Transfer, Restricted Access, Loan, Digital Copy, Acknowledgement):
  *   Proposed Destination (Specific Museum, Shrine, Private Collection, State Store):
  *   Claimant's Statement on Legal Wrong (Alleged Theft/Seizure OR Legal Transfer/Permission):

  **5. Competing Interests**
  *   Are there other claimants? (Yes/No):
  *   Have donor heirs been notified? (Yes/No):
  *   Are there conservation risks identified? (Yes/No):

  **6. Panel Use Only**
  *   Intake Verified By (Curator Name):
  *   Date File Opened:
  *   Claim Type Classification (See Procedure Step 2):

  ***

  # RESTITUTION ADVISORY PANEL: DECISION PROCEDURE
  **Premise:** Holding is stewardship. Legal title is the floor, not the ceiling.
  **Commitments:** (1) Wrong not cured by time; (2) Significance lies in living relation; (3) Answerable to public/donors.
  **Instruction:** Answer sequentially. If "No," stop and record reason. If "Value Judgement," record dissent. Every step generates one minute line.

  ### PHASE 1: THRESHOLD & CLASSIFICATION
  **Step 1: Eligibility.** Does the object fall within the 1880–1930 colonial/military window or originate from a person serving in such administration?
  *   *Yes:* Proceed. *No:* File closed (Standard Acquisitions Policy).
  *   *Minute:* "Object falls within/outside stewardship remit."

  **Step 2: Claim Classification.** Assign primary category. Multiple may apply.
  *   **A. Remedy for Wrong:** Allegation of theft, seizure, duress, or unequal bargaining power.
  *   **B. Recognition of Belonging:** No allegation of wrong, but object belongs to a lineage/community by function.
  *   **C. Integrity of Ensemble:** Object is part of a larger whole (monument, altar, archive) currently divided.
  *   **D. Sacred/Restricted:** Object requires access limitations incompatible with museum display.
  *   **E. Heir Dispute:** Private law dispute regarding donation/testament.
  *   *Minute:* "Claim classified as Type [A-E]."

  **Step 3: Standing & Succession.** Who represents the source community?
  *   **State Claim:** Is the State the legitimate successor to the pre-colonial polity *for this object*? (Check treaties, constitutional recognition).
  *   **Community Claim:** Does the claiming body demonstrate continuity of practice or custody, even if institutional form changed?
  *   **Split Community:** If State and Community (or two Communities) disagree, do not merge claims. Treat as Competing Claims (Step 6).
  *   *Minute:* "Claimant standing accepted/rejected based on [evidence type]."
  *   *Stop:* If no claimant establishes standing, file closes unless Panel initiates (Proactive Stewardship).

  ### PHASE 2: MERITS & CONTRADICTIONS
  **Step 4: The "Wrong" vs. "Connection" Test.**
  *   **If Type A (Wrong):** Is the evidence of wrongful taking sufficient on balance of probabilities? (Legal title irrelevant if taking was wrongful).
      *   *Yes:* Presumption for Return. Proceed to Step 6.
      *   *No:* Proceed to Step 5.
  *   **If Type B, C, D (No Wrong Alleged):** Can the object's significance *only* be sustained in relation to the claimant's living practice or physical ensemble?
      *   *Yes:* Presumption for Transfer/Reunification. Proceed to Step 6.
      *   *No:* File closes (Object significance sustainable in museum).
  *   *Minute:* "Wrongful taking established / Significance in living practice established."

  **Step 5: The Capacity Pretext.**
  *   Does the claimant have the capacity to care for/display the object?
  *   **Test:** Is the lack of capacity temporary (funding/training) or structural (intent to destroy/neglect)?
  *   **Rule:** Lack of capacity is *not* a bar to title transfer. It is only a bar to physical transfer if safety is at risk.
  *   **Mitigation:** If safety is at risk, propose Transfer of Title with Continuing Loan to Museum, or Joint Custody.
  *   *Minute:* "Capacity concern noted; mitigation [X] proposed."

  **Step 6: Competing Claims & Public Interest.**
  *   **State vs. Community:** If State and Community disagree on destination, priority is given to the entity sustaining the *living practice* (Commitment 2), unless State guarantees access consistent with that practice.
  *   **Public/Funder Interest (Commitment 3):** Does return materially threaten the museum's viability or future gifting?
      *   *Test:* Is this a unique financial threat or a general discomfort?
      *   *Rule:* General discomfort is not a bar. Unique existential threat requires Step 7.
  *   *Minute:* "Competing claim resolved in favour of [X] based on [living practice/state guarantee]."

  ### PHASE 3: RESOLUTION & PRECEDENT
  **Step 7: The Conflict Declaration (Mandatory).**
  *   The three Commitments may contradict. Panel must vote on which Commitment prevails in *this specific case*.
  *   **Option 1:** Commitment 1 prevails (Righting the wrong is paramount).
  *   **Option 2:** Commitment 2 prevails (Living practice/Integrity is paramount).
  *   **Option 3:** Commitment 3 prevails (Public access/Financial viability is paramount).
  *   *Minute:* "Panel prioritised Commitment [1/2/3] over others for this matter." (This exposes the contradiction).

  **Step 8: Remedy Selection.**
  *   **Full Return:** Title and Physical Transfer.
  *   **Split Remedy:** Title Transfer + Physical Loan to Museum.
  *   **Shared Custody:** Rotating possession.
  *   **Digital/Access Return:** Where physical return is impossible (e.g., safety), provide high-res data and rights.
  *   **Third Party Transfer:** If Museum cannot hold due to Sacred/Restricted status (Type D), transfer to a body that can (e.g., religious trust), not necessarily the Claimant directly.
  *   *Minute:* "Remedy recommended: [Type]."

  **Step 9: Precedent Check.**
  *   Does this decision create a rule that compels disposal of >10% of the collection?
  *   *Yes:* Flag to Trustees as "Systemic Implication."
  *   *No:* Flag as "Specific Fact Pattern."
  *   *Rule:* Fear of precedent is not a valid reason to deny a meritorious claim, but must be recorded for Trustees.
  *   *Minute:* "Precedent risk assessed as [Low/High/Systemic]."

  **Step 10: Final Recommendation.**
  *   Draft recommendation for Trustees. Include the Conflict Declaration (Step 7) and Precedent Check (Step 9).
  *   *Minute:* "Panel recommends [Action] to Trustees."

  ***

  # CASE RUNS & ANALYSIS

  ### FILE 1: The Punitive Expedition (1890s)
  **Facts:** Objects taken during military punishment. Claimants: National Commission (State) vs. Historic Royal Court (Traditional). They disagree on destination (National Museum vs. Palace Shrine).
  **Procedure Run:**
  *   **Step 1:** Pass (1890s military).
  *   **Step 2:** Type A (Wrongful Taking).
  *   **Step 3:** Both have standing. State is legal successor; Royal Court is cultural successor.
  *   **Step 4:** Wrongful taking established. Presumption for Return.
  *   **Step 6:** Competing Claims. State wants public display; Royal Court wants ritual use. Procedure prioritises "Living Practice" (Commitment 2).
  *   **Step 7 (Conflict):** Panel must choose. If they choose Commitment 1 (Righting Wrong), State is easier legal partner. If Commitment 2 (Living Practice), Royal Court wins.
  *   **Outcome:** Recommendation for Title Transfer to Royal Court, with a negotiated agreement for periodic public viewing (satisfying Commitment 3 partially).
  *   **Value Judgement Point:** Step 6/7. Defining whether "State" or "Royal Court" better sustains the object's relation.
  *   **Incomplete Facts:** You did not state if the Royal Court currently performs the rituals the objects were made for. If the practice is extinct, Commitment 2 fails, and the State becomes the default steward.

  ### FILE 2: The Architectural Sculptures
  **Facts:** Removed with permission of then-sovereign. Bought privately, then by Museum. Claimant alleges no illegality, but argues division destroys meaning (Integrity).
  **Procedure Run:**
  *   **Step 1:** Pass (Within window/context).
  *   **Step 2:** Type C (Integrity of Ensemble).
  *   **Step 3:** State standing accepted as guardian of the monument.
  *   **Step 4:** No "Wrong" alleged. Test: Can significance be sustained alone? If the monument is a single theological/political work, the answer is "No." Presumption for Reunification.
  *   **Step 5:** Capacity to care is not a bar to title.
  *   **Step 7 (Conflict):** Commitment 1 (Time cures nothing) is neutral here as no wrong was alleged. Commitment 2 (Integrity) clashes with Commitment 3 (Public Access/Encyclopedic Mission).
  *   **Outcome:** Recommendation for Transfer of Title to Claimant State, with a request for a long-term loan of a portion back to the Museum to maintain the "encyclopedic narrative."
  *   **Value Judgement Point:** Step 4. Deciding that "Integrity" outweighs "Legal Acquisition at the Time."
  *   **Incomplete Facts:** You did not state the condition of the monument at the source. If the monument is ruined and the sculptures are the only surviving parts, the "Integrity" argument weakens (the whole no longer exists to be reunited with).

  ### FILE 3: The Sacred/Restricted Object
  **Facts:** Community wants return and restricted access (no public view). Museum mission is access. Funders object.
  **Procedure Run:**
  *   **Step 1:** Pass.
  *   **Step 2:** Type D (Sacred/Restricted).
  *   **Step 4:** Significance lies *only* in restricted ritual practice.
  *   **Step 6:** Public Interest (Commitment 3) clashes directly with Living Practice (Commitment 2).
  *   **Step 7 (Conflict):** Panel must vote. If Commitment 2 prevails, access is denied. If Commitment 3 prevails, object stays or is transferred with access guarantees.
  *   **Outcome:** Transfer of Title to a Community Trust (Third Party), not the Museum. Museum relinquishes custody. Access is no longer the Museum's responsibility.
  *   **Value Judgement Point:** Step 7. Hierarchy of Rights (Religious Freedom vs. Public Right to Know).
  *   **Incomplete Facts:** You did not state if the object is human remains. If so, human rights law often supersedes museum policy entirely, bypassing this procedure.

  ***

  # CRITICAL REFLECTION

  **The Outcome I Will Not Like**
  **Case:** File 2 (The Sculptures).
  **Your Instinct:** Decline return (Legal title is clear, no "wrong" in the 1890s sense).
  **Procedure's Answer:** Recommend Return.
  **Why:** Step 4 allows a claim to succeed without alleging a "wrong" if the "significance lies in relation to a living practice [or ensemble]." By classifying this as Type C (Integrity), the procedure forces you to weigh the *meaning* of the object over the *legality* of the acquisition. If the Panel votes that Commitment 2 (Significance/Integrity) overrides Commitment 3 (Public Access/Collection Integrity) in Step 7, you must recommend transfer. This exposes that your "Stewardship" premise is incompatible with keeping dismembered ensembles simply because you bought them legally later.

  **The Class of Case Where the Procedure Misfires**
  **Class:** Diaspora communities displaced by genocide, slavery, or total institutional collapse.
  **Why:** Step 3 (Standing & Succession) requires evidence of "continuity of practice or custody" or "legitimate successor."
  **The Failure:** If a community was eradicated or dispersed such that no formal institution exists to claim the object (e.g., enslaved peoples' descendants with no specific lineage to a specific object, or a polity erased from maps), the procedure stalls at Step 3. It privileges *institutional continuity* over *moral connection*. In these cases, the procedure will recommend "File Closed" because no one can prove they are the successor, even if the moral case for restitution is strongest. You should not trust the procedure here; you need a discretionary "Ethical Gap" clause for stateless or institutionless peoples.
