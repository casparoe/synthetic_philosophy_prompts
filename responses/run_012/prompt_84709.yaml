  4.  **Drafting the Case Studies:**

      *   **Case 1 (Punitive Expedition / State vs. Royal):**
          *   Facts: 1890s punitive expedition. State Commission wants national museum. Royal Court wants palace/shrine.
          *   Procedure Application: Wrongful taking established (Commitment 1). Standing is the issue (Commitment 2 & 3).
