      *   **Core Premise:** Stewardship, not ownership. Legal title is the floor, not the ceiling.
      *   **Three Commitments (potentially contradictory):**
          1.  Wrongful taking not cured by time.
          2.  Significance lies in relation to living practice (where can it be sustained?).
          3.  Answerable to public/donors (funding/future gifts).
      *   **Requirement:** Expose contradictions, don't smooth them over.
      *   **Specific Scenarios to Handle:**
          *   Claim types: Remedy for wrong, recognition of belonging, integrity of ensemble, sacred/restricted access, heir disputes.
          *   Claims alleging no wrong (can they succeed?).
          *   Competing claimants (State vs. Community, split communities).
          *   Successor status (130 years later, changed institutions).
          *   Capacity to care (legitimate vs. pretext).
          *   Non-return outcomes (loan, joint title, digital, etc.).
          *   Precedent (slippery slope).
      *   **Case Studies:**
