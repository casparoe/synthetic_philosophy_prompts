  ### Classification of Norms by Conformity and Codification

  | | **High Official Codification** (Law/Rules) | **Low Official Codification** (Unofficial) |
  | :--- | :--- | :--- |
  | **High Social Conformity** (Approved/Practised) | **Queueing:** Legally enforced in some contexts; socially strict in most. | **Tipping:** Near-universal in some cultures; no statutory requirement. |
  | **Low Social Conformity** (Ignored/Variable) | **Jaywalking:** Illegal but widely practised without sanction. | **Not Texting at Table:** No rules; adherence varies by group. |

  1. Social norms regarding tipping, queueing, and jaywalking vary significantly across jurisdictions and contexts.
  2. Violations of these norms frequently attract sanctions, ranging from legal fines to social disapproval.
  3. Participants agree that some conventions, such as queueing, often align with independent moral principles like fairness.
  4. Participants agree that other conventions, such as specific tipping percentages, appear arbitrary absent local practice.
  5. Both parties accept that outsiders often struggle to identify which norms carry genuine normative weight upon arrival.

  ### Areas of Continuing Disagreement

  | Crux | Practice View (Side A) | Principle View (Side B) | Shared Evidence | Prediction (Side A) | Prediction (Side B) |
