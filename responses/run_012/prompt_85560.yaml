  | **Visitor Tipping (No-Tipping Culture)** | The visitor owes the tip because they are utilising the local service practice. | The visitor owes nothing unless the wage structure relies on gratuities. | Tourist dining in London despite coming from Tokyo. | Visitor is blameworthy for withholding tip. | Visitor is permissible if no harm is caused. |
  | **Visitor Queueing (Chaotic Context)** | The visitor must queue to uphold the standard even if others do not. | The visitor need not queue if doing so gains no fairness advantage. | Bus stop where locals crowd the door instead of lining up. | Visitor is rude to crowd; must model best practice. | Visitor is prudent to crowd; fairness is already lost. |
  | **Jaywalking (Empty Road)** | It is wrong because it violates the shared regulatory agreement. | It is permissible because no harm or unfairness occurs. | Crossing at a red light with no traffic visible. | Violation is morally defective merely as rule-breaking. | Violation is morally neutral absent risk. |
