  *(Self-Correction on "Free Information"):* I need to be careful. Good's Theorem assumes the agent can choose actions based on info. If the info *changes the agent's ability to choose rationally* (e.g., depression leads to suboptimal choices), the theorem's assumptions break. I should mention "state-dependent utility."

  *(Self-Correction on "Commitment"):* The user says "commitment, not fear." This is a Ulysses Pact. It's rational *if* the future self is predicted to act against the current self's interests. This implies the future self is *not* rational from the current self's perspective.

