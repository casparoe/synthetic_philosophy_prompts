  9.  **Self-Correction/Refinement during drafting:**
      *   *Wait, is Good's Theorem actually violated?* Good's Theorem says information cannot lower expected utility *before* you get it, assuming you act optimally *after*. If the utility function itself penalizes the state of "knowing," then the information *does* have a cost. So (1) is technically true only if "cost" includes psychological disutility. The user defines cost as monetary/effort ("free"). I need to highlight this definition gap.
