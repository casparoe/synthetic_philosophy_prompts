prompt: |-
  Novelist here, so excuse the layman's framing. I'm writing a book in which a character in the middle chapter is reading the very chapter your in the middle of, and there's an author's note at the front that turns out to have been written by that same character, so the frame and the framed keep trading places and by the end I want the reader genuinely unsure who's writing whom. A friend of mine who's read too much Gödel, Escher, Bach says I've built a "tangled hierarchy" and that it won't hold together unless there's an "inviolate level" somewhere underneath it, and that Escher's picture of the two hands drawing each other is the image of the whole thing. Two problems. He says "strange loop" and "tangled hierarchy" as if they're the same thing, then treats them as if they're not, and I can't work out what the difference is meant to be. And I don't understand what the inviolate level is actually for -- is it a real piece of the machinery, or just a posh way of saying "the author," or "the reader standing outside the book"?

  Can you walk me through the conceptual issue here in plain language? Specifically: (1) what, if anything, separates a tangled hierarchy from a strange loop from ordinary self-reference; (2) what job the inviolate level is doing, and whether it's genuinely explanatory or just a label for whatever sits outside the tangle; (3) whether Escher's two hands drawing each other is really a tangled hierarchy or just two things at the same level pointing at each other -- and if it's the latter, whether my book is in the same boat. And if my setup is actually just a flat paradox dressed up in fancy clothes, please say so.
reasoning: |-
