      *   *Tangled Hierarchy:* The *structure*. Usually, hierarchies go Top -> Bottom (General -> Specific). A tangled one has the bottom influencing the top. It's the *architecture* of the levels.
      *   *Strange Loop:* The *experience* or *process* of moving through the tangled hierarchy. It's the journey up/down that ends up back at the start.
      *   *Analogy:* A snake eating its tail. The tail biting the head is the structure (tangled). The snake actually swallowing itself is the loop (strange). A mirror reflecting a mirror is self-reference.
