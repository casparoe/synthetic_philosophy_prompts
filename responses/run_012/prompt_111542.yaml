answer: |-
  # PhD Game Theory Final: Solution Concepts

  **Time Allowed:** 50 Minutes
  **Total Marks:** 20

  **Question 1**
  Consider the following symmetric two-player game. The row player chooses T, M, or B; the column player chooses L, C, or R. Payoffs are listed as (Row, Column).

  $$
  \begin{array}{c|ccc}
   & L & C & R \\
  \hline
  T & (4,4) & (2,2) & (1,1) \\
  M & (2,2) & (2,2) & (3,3) \\
  B & (1,1) & (3,3) & (6,6)
  \end{array}
  $$

  **(a)** Show that strategy M is strictly dominated by a mixed strategy, but not by any pure strategy. Explain why checking only pure strategies is insufficient and why this dominance holds regardless of the player's beliefs about the opponent. **[5 marks]**

  **(b)** Perform Iterated Elimination of Strictly Dominated Strategies (IESDS) on this game. State exactly which strategies survive for each player. Explain why the set of surviving strategies is independent of the order of elimination. **[5 marks]**

  **(c)** Construct a 2x2 game where Iterated Elimination of Weakly Dominated Strategies (IEWDS) eliminates a Nash Equilibrium. Explain the epistemic gap: why Common Knowledge of Rationality (CKR) justifies IESDS but requires additional assumptions to justify IEWDS. **[6 marks]**

  **(d)** Find all Nash Equilibria (pure and mixed) of the original 3x3 game. Explain why IESDS preserves all equilibria while IEWDS may not. **[4 marks]**

  ***

  # Model Answer

  **(a)** Consider pure strategies against M (payoffs 2, 2, 3). T yields (4, 2, 1); T fails at R ($1<3$). B yields (1, 3, 6); B fails at L ($1<2$). Thus, no pure strategy dominates M. However, consider mixed strategy $\sigma = 0.5T + 0.5B$. Against L: $0.5(4)+0.5(1)=2.5 > 2$. Against C: $0.5(2)+0.5(3)=2.5 > 2$. Against R: $0.5(1)+0.5(6)=3.5 > 3$. $\sigma$ strictly dominates M. Checking only pure strategies fails because mixed strategies expand the convex hull of available payoffs. Dominance is belief-independent because $\sigma$ yields strictly higher utility against *every* pure strategy of the opponent; therefore, it yields higher expected utility against any probability distribution (belief) over those strategies.

  **(b)** Step 1: M is strictly dominated (by $\sigma$ above). Eliminate M.
  Step 2: In the remaining 2x3 game, consider Column strategy C (payoffs 2, 3 against T, B). Compare to mixed $\sigma_c = 0.5L + 0.5R$. Against T: $0.5(4)+0.5(1)=2.5 > 2$. Against B: $0.5(1)+0.5(6)=3.5 > 3$. C is strictly dominated. Eliminate C.
  Step 3: Remaining strategies are {T, B} for Row and {L, R} for Column. No further strict dominance exists (T beats L, B beats R).
  Survivors: Row {T, B}, Column {L, R}.
  Order Independence: If strategy $s_i$ is strictly dominated by $s'_i$ in strategy set $S$, then $u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i} \in S_{-i}$. If we reduce the opponent's set to $S'_{-i} \subset S_{-i}$, the inequality still holds for all remaining $s_{-i}$. Thus, a strategy eliminated early would remain eliminable later, and vice versa.

  **(c)** Consider the game:
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & (1,1) & (1,0) \\
  B & (1,1) & (0,0)
  \end{array}
  $$
  Row: T weakly dominates B ($1\ge1, 1>0$). Eliminate B.
  Column (vs T): L strictly dominates R ($1>0$). Eliminate R.
  Outcome: (T, L). However, (B, L) is a Nash Equilibrium (Row indifferent, Column prefers L). IEWDS deleted it.
  Epistemic Gap: CKR implies players avoid strictly dominated strategies because they are never best responses. However, a weakly dominated strategy can be a best response if the player assigns zero probability to the opponent strategies where the domination is strict. To justify IEWDS, we must assume players assign positive probability to all opponent strategies (full support/trembling hand) or care about payoff differences even in zero-probability events. CKR alone does not imply this.

  **(d)** Since IESDS eliminates only strategies that are never best responses, all Nash Equilibria must lie within the survivor set {T, B} $\times$ {L, R}.
  Pure NE: (T, L) and (B, R).
  Mixed NE: Let Row play T with probability $p$. Column indifferent when $4p + 1(1-p) = 1p + 6(1-p) \Rightarrow 3p+1 = 6-5p \Rightarrow 8p=5 \Rightarrow p=5/8$. By symmetry, Column plays L with $q=5/8$.
  Mixed NE: $\sigma = (5/8, 0, 3/8)$ for both players.
  IESDS preserves NE because a NE strategy must be a best response to the opponent's NE strategy, and strictly dominated strategies are never best responses. IEWDS may delete NE because weakly dominated strategies can be best responses under specific beliefs (probability 0 on punishing strategies).

  ***

  # Marking Scheme

  | Part | Criterion (the move a full-credit answer makes) | Marks | What a B-level answer does instead | Error this catches |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a)** | Calculates mixed payoffs showing strict inequality; notes pure strategies fail specific cells; explains dominance holds for all beliefs because it holds state-by-state. | 5 | Shows mixed math but claims pure dominance exists, or says "beliefs don't matter" without linking to state-by-state inequality. | Confusing weak/strict dominance; misunderstanding belief independence. |
  | **(b)** | Correctly eliminates M then C; explicitly states survivors {T, B} and {L, R}; argues order independence via subset property of opponent strategies. | 5 | Eliminates M but misses C, or states survivors implicitly; recites "order independent" slogan without subset argument. | Incomplete elimination; rote learning vs. structural understanding. |
  | **(c)** | Provides valid 2x2 matrix; shows elimination path kills a valid NE; distinguishes CKR (strict) from Full Support/Trembling Hand (weak). | 6 | Provides matrix but fails to verify NE; or explains epistemic gap vaguely as "weak is risky" without belief support argument. | Misidentifying NE; conflating rationality with belief restrictions. |
  | **(d)** | Identifies 2 Pure NE + 1 Mixed NE (exact fractions); states IESDS keeps NE (never BR) vs IEWDS (can be BR). | 4 | Finds pure NE but approximates mixed; or claims IESDS deletes NE in some cases. | Calculation errors; fundamental misunderstanding of solution concept consistency. |
  | **Total** | | **20** | | |

  ***

