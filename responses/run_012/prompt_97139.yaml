  2.  **Philosophical Brainstorming & Risk Assessment:**
      *   *Goal:* Express unity/love/commonality without committing to the existence (or non-existence) of Universals.
      *   *Phrase:* "You share the same love."
          *   *Realist:* Yes, the Universal *Love* is instantiated in both.
          *   *Nominalist:* No, there is *your* love and *your* love, which resemble each other closely.
          *   *Solution:* Focus on the *relation* or the *activity* rather than the *object*. "Your love resonates," "Your lives intertwine."
      *   *Phrase:* "You are made for each other."
          *   *Realist:* Could imply a pre-existing form/essence of the couple.
          *   *Nominalist:* Could imply a deterministic structure.
          *   *Solution:* Focus on the *construction* of the relationship. "You have made yourselves for each other."
      *   *Phrase:* "You have so much in common."
          *   *Realist:* You instantiate the same properties.
          *   *Nominalist:* You have distinct properties that resemble each other.
          *   *Solution:* Acknowledge the distinctness while celebrating the resemblance. "Your distinct paths converge," "Your particular quirks align."
      *   *Phrase:* "One flesh / Two become one."
          *   *Realist:* Metaphorical unity is fine.
          *   *Nominalist:* "One" is suspicious.
          *   *Solution:* "A partnership," "A union" (understood as a relation, not a new substance).
      *   *Phrase:* "The same joy."
          *   *Risk:* Same = Universal.
          *   *Solution:* "Equal joy," "Matching joy," "Joy that reflects in both of you."
      *   *Key Concept to Leverage:* *Resemblance Nominalism*. Even if they don't share a universal, their particulars *resemble* each other perfectly. This is safe for both. Also, *Relations*. Even nominalists accept relations (usually). The relation of *marriage* connects two distinct particulars.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the friendship, keep it warm for the family. Introduce the "how they met" story early but simply.
      *   **Middle (The Philosophy):** Address the elephant in the room (the Universals debate) without getting technical. Use it as a metaphor for their relationship dynamic (tension that creates harmony).
      *   **The "Safe" Language:** Use words like "resonate," "mirror," "align," "weave," "partner." Avoid "same," "identical," "one essence."
      *   **The Climax:** Bring it back to the commitment. Marriage is a promise, which is a speech act, which is a particular event (safe for everyone).
      *   **Closing:** A wish for the future that respects their distinctness and their union.

  4.  **Refining the Philosophy (Self-Correction during thought process):**
      *   *Wait, do Nominalists accept relations?* Some do, some don't (bundle theory vs. trope theory). But practically, a nominalist accepts that "A is next to B" is a fact about the world, even if "Next-to-ness" isn't a universal. So focusing on *what they do* together is safer than *what they are*.
      *   *The "One Over Many" joke:* This is gold. It needs to be included but explained simply for the parents.
