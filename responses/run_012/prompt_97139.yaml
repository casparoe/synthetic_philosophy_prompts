      *   **Constraint 1 (Philosophical Accuracy):** Do not smuggle in metaphysical commitments that favor one side. Avoid phrases that imply shared essences if that violates nominalism, or deny shared qualities if that violates realism.
      *   **Constraint 2 (Audience):** Half philosophers (will spot errors), half family/non-philosophers (need to understand and not be bored).
