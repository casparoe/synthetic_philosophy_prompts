answer: |-
  ### Exam Question

  **Question 3 (25 Marks)**

  Consider a language containing a truth predicate $T$ governed by the naive truth schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$). Let $A$ and $B$ be sentences in this language such that:

  *   $A$ says: "Exactly one of $A$ and $B$ is true."
  *   $B$ says: "Exactly one of $A$ and $B$ is false."

  Assume classical two-valued logic initially, then evaluate the pair using non-classical frameworks.

  (a) Determine the classical truth values for $A$ and $B$. Show that a consistent assignment exists, is unique, and explain why the three competing assignments fail. (5 marks)
  (b) Evaluate $A$ and $B$ using a Kripke-style construction with Strong Kleene valuation starting from the empty set. Do the sentences receive a truth value in the minimal fixed point? Are they grounded? (5 marks)
  (c) Evaluate $A$ and $B$ according to a Supervaluationist account that quantifies over all classical fixed points extending the minimal fixed point. (5 marks)
  (d) Explain the divergence between the verdicts in (b) and (c). What does this reveal about the relationship between groundedness and determinacy? Finally, can a theory issuing the verdict in (b) express that verdict within the object language without inviting revenge paradoxes? (10 marks)

  ***

  ### Model Answer

  **(a) Classical Analysis**
  Let $v(A)$ and $v(B)$ denote the truth values $\{1, 0\}$. $A$ asserts $(v(A) \neq v(B))$. $B$ asserts $(v(A) \neq v(B))$, since "exactly one false" is extensionally equivalent to "exactly one true" in binary logic. Thus, both sentences assert the same proposition: that they have different values.
  1.  **Assignment (1, 1):** $A$ asserts $1 \neq 1$ (False). But $v(A)=1$. Contradiction.
  2.  **Assignment (1, 0):** $A$ asserts $1 \neq 0$ (True). $v(A)=1$ matches. $B$ asserts $1 \neq 0$ (True). But $v(B)=0$. Contradiction.
  3.  **Assignment (0, 1):** $A$ asserts $0 \neq 1$ (True). But $v(A)=0$. Contradiction.
  4.  **Assignment (0, 0):** $A$ asserts $0 \neq 0$ (False). $v(A)=0$ matches. $B$ asserts $0 \neq 0$ (False). $v(B)=0$ matches.
  Only $(0, 0)$ is consistent. The unique classical solution is that both sentences are False.

  **(b) Kripke-Style Fixed Point**
  In a Kripke construction using Strong Kleene logic, we begin with $v_0(A) = v_0(B) = \#$. The semantic value of "Exactly one is true" depends on the values of $A$ and $B$. Under Strong Kleene tables, logical operations involving $\#$ yield $\#$ unless the outcome is determined by the classical values (e.g., $1 \lor \#$ is 1). Here, the exclusive disjunction of $\#$ and $\#$ yields $\#$. Consequently, $v_1(A) = \#$ and $v_1(B) = \#$. The sequence stabilizes immediately at the minimal fixed point where both sentences are undefined. Because they do not receive a classical value in the minimal fixed point, $A$ and $B$ are **ungrounded**.

  **(c) Supervaluationist Analysis**
  Supervaluationism defines a sentence as determinately true (or false) if it is true (or false) in all classical fixed points extending the minimal fixed point. We established in (a) that $(0, 0)$ is the *only* consistent classical assignment. Since $(0, 0)$ is a fixed point of the semantic evaluation (evaluating the bodies given $(0,0)$ yields $(0,0)$), it is the unique classical completion. Therefore, $A$ is false in all admissible completions, and $B$ is false in all admissible completions. The Supervaluationist verdict is that both sentences are **determinately False**.

  **(d) Philosophical Implications**
  The divergence reveals that **groundedness** and **determinacy** are distinct semantic properties. Kripke's groundedness tracks the *genealogy* of truth: a sentence is grounded only if its value is generated from non-semantic facts via the truth predicate. Here, $A$ and $B$ depend only on each other in a loop that the constructive process cannot resolve, so they are ungrounded. Supervaluationist determinacy tracks *modal stability*: a sentence is determinate if its value is stable across all ways of resolving indeterminacy. Since the classical constraints force $(0,0)$ uniquely, the value is stable, hence determinate.

  This shows that a sentence can be determinately false without being grounded. Regarding revenge: If the Kripkean theory attempts to express its verdict ("$A$ is ungrounded") within the object language by adding a predicate $U(\ulcorner \phi \urcorner)$, it invites revenge. One can construct a sentence $R$ saying "$R$ is ungrounded." If $R$ is ungrounded, $R$ is true (by the predicate), implying it has a value, contradicting ungroundedness. If $R$ is grounded, it is false, implying it is ungrounded. Thus, a theory relying on the minimal fixed point cannot consistently express its own notion of groundedness without collapsing into paradox or requiring a hierarchy of metalanguages. The Supervaluationist avoids this specific revenge regarding groundedness but faces standard challenges expressing the "definiteness" operator.

  ***

  ### Marking Scheme

  **Total: 25 Marks**

  **1. Classical Existence & Uniqueness (5 Marks)**
  *   **Must Hit:** Correctly identifies $(0,0)$ as the only consistent assignment and demonstrates why $(1,1), (1,0),$ and $(0,1)$ fail.
  *   **Common Error:** Treating the pair as a standard Liar paradox and claiming no classical assignment exists.

  **2. Kripke Minimal Fixed Point (5 Marks)**
  *   **Must Hit:** Correctly derives that the minimal fixed point assigns $\#$ (undefined) to both sentences due to the dependency loop starting from the empty set.
  *   **Common Error:** Assuming the Kripke construction must eventually yield the classical values or confusing minimal fixed points with intrinsic fixed points.

  **3. Groundedness Verdict (5 Marks)**
  *   **Must Hit:** Explicitly states that because the minimal fixed point yields $\#$, the sentences are *ungrounded*.
  *   **Common Error:** Conflating "undefined in the minimal fixed point" with "false," or failing to use the term "grounded."

  **4. Supervaluationist Verdict (5 Marks)**
  *   **Must Hit:** Correctly argues that since $(0,0)$ is the *unique* classical fixed point, Supervaluationism classifies both as determinately False.
  *   **Common Error:** Announcing the verdict is "Indeterminate" without noticing the classical analysis pins the value uniquely.

  **5. Groundedness vs. Determinacy Analysis (5 Marks)**
  *   **Must Hit:** Articulates that groundedness concerns semantic derivation/construction, while determinacy concerns stability across models, and notes they come apart in this case.
  *   **Common Error:** Vague hand-waving about "context" without distinguishing the structural vs. modal nature of the two accounts.

  **6. Revenge & Self-Expression (5 Marks)**
  *   **Must Hit:** Explains that expressing "ungrounded" in the object language allows for a new paradox (e.g., "This sentence is ungrounded"), limiting the theory's expressive completeness.
  *   **Common Error:** Claiming the theory is fully expressive or ignoring the hierarchy requirement to avoid revenge.
