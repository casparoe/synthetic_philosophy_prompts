answer: |-
  # Specification for a Theory of the Thermodynamic Arrow

  ## 1. Phenomena to be Explained
  The theory must provide a mechanism or derivation for the following observed asymmetries. For each, the theory must explicitly state whether it treats the phenomenon as a primitive explanandum or as a downstream consequence of the entropy gradient.

  *   **The Entropy Gradient:** The systematic evolution of isolated macroscopic systems from lower to higher entropy states.
      *   *Status:* Primary explanandum.
  *   **The Record Asymmetry:** The existence of reliable traces, memories, and fossils of the past, but not of the future.
      *   *Status:* Contested. (Reductionists claim this follows from entropy; Perspectivalists claim it requires independent epistemic conditions.)
  *   **The Agency Asymmetry:** The capacity of agents to deliberate on and intervene in future states, but not past states.
      *   *Status:* Contested. (Often treated as downstream of the Record Asymmetry, but requires explicit derivation to avoid circularity.)
  *   **The Explanatory Asymmetry:** The practice of explaining present states by citing past conditions, while predicting future states via laws.
      *   *Status:* Downstream consequence (typically derived from the Record Asymmetry).
  *   **The Radiative Asymmetry:** The prevalence of retarded solutions (outgoing radiation) over advanced solutions (incoming radiation) in electrodynamics.
      *   *Status:* Separate item or downstream? (The theory must adjudicate whether this is thermodynamic in origin or independent.)
  *   **The Alignment:** The fact that all the above arrows point in the same temporal direction.
      *   *Status:* Non-negotiable requirement. A theory that yields conflicting arrow directions is empirically false.

  ## 2. Distinctions to be Maintained
  The theory must preserve the following conceptual distinctions. Collapsing them constitutes a category error unless explicitly argued for as a revisionary metaphysical claim.

  *   **Asymmetry in Laws vs. Boundary Conditions:** The theory must specify whether the source of the arrow is a time-asymmetric dynamical law or a time-asymmetric constraint on the state of the universe.
      *   *Status:* **Non-negotiable.** Confusing these invalidates the explanation of *why* the arrow exists.
  *   **Existence of an Arrow vs. Direction:** The theory must account for why there is *an* asymmetry separately from why it points *this* way (past-to-future).
      *   *Status:* **Non-negotiable.** Direction is often indexical; existence is ontological.
  *   **Fine-Grained vs. Coarse-Grained Entropy:** The theory must distinguish between the microscopic phase space volume (constant under Liouville's theorem) and the macroscopic observable volume (increasing).
      *   *Status:* **Non-negotiable.** Failure here invites the Reversibility Objection.
  *   **Past Hypothesis (PH) as Law vs. Posit:** The theory must declare whether the low-entropy past is a brute fact, a Humean best-system law, or a derived necessity.
      *   *Status:* **Camp Commitment.** (Humeans demand Law; Non-Humeans accept Posit.)
  *   **Thermodynamic Arrow vs. Causal/Epistemic Arrow:** The theory must not define causation *as* entropy increase without independent justification.
      *   *Status:* **Non-negotiable.** Definitional fiat solves nothing.
  *   **Ontic Arrow vs. Epistemic Arrow:** The theory must state whether the arrow is a feature of the world independent of observers or a feature of our description/ignorance.
      *   *Status:* **Camp Commitment.** (Realists demand Ontic; Perspectivalists accept Epistemic.)

  ## 3. Results Not to be Contradicted
  The theory must remain consistent with the following established physical and empirical results.

  *   **Microdynamic T-Invariance:** The theory must not contradict the time-reversal invariance of classical Hamiltonian mechanics and (modulo weak force CP-violation) quantum unitary evolution.
      *   *Status:* **Non-negotiable** for theories claiming to preserve standard mechanics.
  *   **Measure Preservation and Recurrence:** The theory must address Liouville's Theorem (phase space volume conservation) and the Poincaré Recurrence Theorem without denying their mathematical validity.
      *   *Status:* **Non-negotiable.**
  *   **The Low-Entropy Past:** The theory must accommodate the empirical evidence that the universe was in a lower entropy state in the past (e.g., CMB smoothness).
      *   *Status:* **Non-negotiable.** Empirical adequacy is mandatory.

  ## 4. Test Cases to Adjudicate
  The theory must yield determinate verdicts on the following scenarios without resorting to *ad hoc* adjustments.

  *   **The Gold Universe:** A cosmology where entropy is low at both temporal boundaries ($t_0$ and $t_{end}$) and maximal in the middle.
      *   *Requirement:* The theory must specify whether agents at the midpoint experience one arrow, two diverging arrows, or no arrow. It must specify the status of records at the midpoint.
      *   *Status:* **Non-negotiable.** A general theory of time's arrow must apply to globally symmetric boundary conditions.
  *   **Local Entropy Reversal (Spin Echo/Demon):** A procedure where a subsystem is driven to lower entropy via precise manipulation.
      *   *Requirement:* The theory must distinguish this from a global reversal of the arrow. It must identify the entropy cost paid elsewhere without defining "elsewhere" merely as "where entropy goes up."
      *   *Status:* **Non-negotiable.** This tests the theory's account of isolation and coupling.

  ***

  ## 5. Meta-Evaluation of Requirements

  ### Non-Negotiable vs. Camp Preferences
  *   **Non-Negotiable:** Consistency with Microdynamic T-Invariance (unless proposing new physics), Empirical Adequacy (Low-Entropy Past), Distinction between Coarse/Fine Grain, and the Alignment of Arrows. These are constraints imposed by physics and logic.
  *   **Camp Preferences:** Treating the Past Hypothesis as a Law (Humean vs. Non-Humean), reducing the Causal/Epistemic arrows strictly to Thermodynamics (Reductionism vs. Pluralism), and insisting the Arrow is Ontic rather than Perspectival (Realism vs. Kantianism).

  ### Incompatible Subset (The Trilemma)
  The following three requirements cannot be jointly satisfied without significant philosophical cost:
  1.  **Strict Microdynamic T-Invariance** (No new time-asymmetric laws).
  2.  **Typicality without Special Boundaries** (The arrow arises from generic dynamics, not a specific Past Hypothesis).
  3.  **Robust Global Arrow** (The asymmetry is real, persistent, and not a local fluctuation).

  **What must be surrendered:** To satisfy (1) and (3), you must surrender (2) and accept a special Boundary Condition (The Past Hypothesis). To satisfy (2) and (3), you must surrender (1) and posit time-asymmetric laws (e.g., GRW collapse or Penrose gravity). To satisfy (1) and (2), you must surrender (3) and accept that the arrow is a temporary fluctuation (leading to the Boltzmann Brain problem).

  ### The Most Exclusionary Requirement
  **"Consistency with Time-Reversal Invariant Microdynamics."**
  Enforcing this requirement excludes the largest number of otherwise popular accounts. It immediately disqualifies objective collapse theories (GRW), Penrose's gravitationally induced reduction, and Prigogine's non-unitary transformations. It forces the theory into the Boltzmannian/Statistical Mechanics camp, requiring them to solve the Reversibility Objection solely through boundary conditions or typicality arguments.

  ### Evaluation of Three Accounts
  *   **The Fluctuation Account:** Fails the **Low-Entropy Past** constraint; by relying on random fluctuations, it predicts we should be Boltzmann Brains in a high-entropy universe rather than observers in a low-entropy past.
  *   **The Low-Entropy-Boundary-Condition Account (Past Hypothesis):** Satisfies **Microdynamic T-Invariance** and **Empirical Adequacy**, but struggles with the **PH as Law vs. Posit** distinction, often appearing as an unexplained brute fact.
  *   **The Added-Time-Asymmetric-Law Account:** Satisfies the **Robust Global Arrow** and explains the **Alignment** naturally, but fails the **Microdynamic T-Invariance** constraint, requiring modification of established quantum or classical dynamics.
