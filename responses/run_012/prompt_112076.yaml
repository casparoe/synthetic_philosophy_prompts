answer: |-
  You have identified a specific logical topology that is distinct from simple factual error. While there is no single, universally standardized noun (like "gravity") for this exact structure, in the philosophy of science and critical historiography, it is best described as a **Self-Sealing Epistemology** employing **Systematic Immunization**.

  However, to give you the specific "name" for the evidential move you described (absence = proof of destruction), the most precise label is an **Inverted Argument from Silence**.

  Here is the breakdown of the concept, its philosophical lineage, and the edges you asked for.

  ### The Concept: Inverted Argument from Silence within a Self-Sealing System

  **1. The Core Mechanism: Inverted Argument from Silence**
  In standard historical logic, an *Argumentum ex Silentio* (argument from silence) is usually a weakness: "We have no record of X, so X probably didn't happen."
  In the structure you identified, this is inverted: "We have no record of X, and since X *must* have happened, the absence of the record is proof that the record was destroyed."
  *   **Normal Logic:** Absence of evidence is neutral or negative.
  *   **This Structure:** Absence of evidence is positive confirmation.

  **2. The Protective Shell: Immunization Strategy**
  This term comes from Karl Popper. He described **Conventionalist Stratagems** (or Immunization Strategies) as moves made to protect a theory from falsification. By adding an *ad hoc* auxiliary hypothesis (e.g., "the Vatican burned the documents," "time was artificially stretched"), the theory makes itself unfalsifiable.
  *   When combined with the Inverted Argument from Silence, it creates a **Self-Sealing System**. Any input (evidence found) is absorbed; any lack of input (evidence missing) is also absorbed. The system has no exhaust port.

  ### The Edges: How to Distinguish It

  You asked where the edges lie. This is crucial because legitimate science and history also deal with gaps and anomalies.

  #### Edge 1: vs. A Normal Research Programme (Lakatos)
  Imre Lakatos refined Popper's ideas with the concept of **Research Programmes**.
  *   **Progressive Programme:** When anomalies (gaps in the record) appear, the theory is adjusted to *predict novel facts*. For example, "If this civilization existed, we should find pottery shards in *this* specific geological layer." If found, the theory gains strength.
  *   **Degenerating Programme (The Pseudohistory Pattern):** The adjustments only *explain away past anomalies* without predicting new, risky facts. The "cover-up" hypothesis is never used to successfully locate *new* evidence; it is only used to explain why evidence *isn't* there.
  *   **The Boundary:** Does the "destruction" hypothesis lead to a discovery? If the theory says "The records are buried under the Sphinx" and you dig and find nothing, a normal programme retreats or revises. This structure says, "They are buried deeper," or "They were moved." If the auxiliary hypothesis cannot be tested independently of the core claim, it is pseudohistory.

  #### Edge 2: vs. Standard Conspiracy Theory
  You noted that "conspiracy theory" feels imprecise. You are right.
  *   **Standard Conspiracy:** Agentive. It posits specific actors (CIA, Freemasons, Aliens) hiding specific events. It is sociological.
  *   **This Structure (Fomenko/Atlantis):** Ontological/Structural. It often posits that *time itself*, *geology*, or *human cognition* is the obscuring factor. In Fomenko's case, it's not just that people hid documents; it's that the *chronology* is mathematically wrong.
  *   **The Boundary:** Standard conspiracy theories can theoretically be falsified (e.g., "Show me the order signed by the President"). This structure posits a **Totalizing Erasure**. It claims the *framework* of reality (the timeline) is the deception. It is a "Conspiracy of Nature" rather than a "Conspiracy of Men."

  #### Edge 3: vs. Legitimate Historical Skepticism
  Historians often argue that records were lost (e.g., the burning of the Library of Alexandria).
  *   **Legitimate Skepticism:** Requires positive evidence of the destruction mechanism. We know the Library burned because contemporary accounts describe the fire. The absence of books is consistent with the presence of fire accounts.
  *   **This Structure:** Posits destruction *without* positive evidence of the destroying event. The "fire" is inferred solely from the "missing books." It is circular: "The records are missing because they were destroyed. We know they were destroyed because the records are missing."

  ### Summary Definition
  If you need a term to use in conversation or writing, the most accurate description is:

  > **"A Self-Sealing Historiography based on an Inverted Argument from Silence."**

  It is a **Degenerating Research Programme** that utilizes **Systematic Immunization** to convert **Negative Evidence** (gaps) into **Positive Confirmation** (proof of cover-up/erasure).

  This structure is distinct because it does not just ignore evidence; it actively metabolizes the *lack* of evidence as fuel for the theory. It is an epistemic black hole: the gravity is so strong that even light (evidence) failing to escape is proof that the black hole exists.
