  2.  **Deconstruct the Communitarian View (Wright/McDowell style vs. Kripke's Skeptic):**
      *   The user is advocating for a version of *normative functionalism* or *communitarian realism*. Meaning is fixed by assertibility conditions within a practice.
      *   *Key distinction:* It's not about what people *do* (dispositions), but what they *ought* to do (norms). But where do norms come from if not dispositions? This is the tension.

  3.  **Address the Specific Scenarios:**

      *   **Scenario 1: The Split Community (68+57 = 5 vs. 125).**
          *   *Problem:* If meaning is consensus, no consensus = no meaning.
          *   *Communitarian Response:* Practices aren't static. There's a history, a trajectory, a "best interpretation" of the practice so far. We look at the *weight* of the practice, not just a headcount at time $t$.
          *   *Severity:* Manageable. Practices evolve. Schisms happen. We can say meaning is indeterminate *during* the schism or that one side is breaking the practice.

      *   **Scenario 2: Collapse into Dispositionalism.**
          *   *Problem:* If norms are just "what the community accepts," and acceptance is a psychological disposition, haven't we just aggregated individual dispositions?
          *   *Communitarian Response:* No. Norms are *public* institutions. They exist in the space of reasons, not causes. Correction isn't just "I feel like hitting you," it's "You violated the rule." The normativity is irreducible.
          *   *Severity:* High. This is the metaphysical heart of the issue. If they can't explain where the "ought" comes from without reducing it to "is," the view fails.

      *   **Scenario 3: The Lone Dissenter (Individual Right, Community Wrong).**
          *   *Problem:* If community norms constitute meaning, the community *cannot* be wrong about their own meanings (by definition). But intuitively, a genius mathematician can be right while everyone else is mistaken.
          *   *Communitarian Response:* This is the hardest pill. Strict communitarianism implies the dissenter is speaking a different idiolect or is simply mistaken *relative to the current practice*. To say they are "right" means the practice *should* change. But was it *already* right?
          *   *Severity:* Critical. This challenges the normativity of logic/math. If the community votes $2+2=5$, does it become true?

  4.  **Ranking the Objections:**

      *   *Tier 1 (Bite the Bullet):* The Split Community. We can appeal to practice continuity, history, and the idea of a "working consensus." Indeterminacy in edge cases is acceptable.
      *   *Tier 2 (Serious Worry):* The Lone Dissenter. Communitarians usually have to say the dissenter is "wrong relative to current norms" but "right relative to future norms" or "objective constraints." This requires a subtle dance between constitutivism and realism.
      *   *Tier 3 (View Killer):* The Collapse into Dispositionalism. If the "norms" are cashed out *only* in terms of actual reactions, the normativity vanishes. The view needs an account of *idealized* agreement or irreducible normativity. If it can't provide that, it's just dispositionalism with extra steps.

