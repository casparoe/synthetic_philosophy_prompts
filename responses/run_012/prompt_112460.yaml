  Ok so I'm in grade 11 and I've been reading this pop-philosophy book I got out of the library — I forget the publisher, its the one with the yellow cover — and there's a chapter on something called Fitch's paradox of knowability that I've been trying to explain to my friend and it keeps falling apart in my mouth. The book says the knowability principle is the anti-realist's claim that every true thing could be known by somebody at some point (if a truth couldn't be known by anyone ever, in what sense is it true?), and that Fitch proved the principle eats itself. The proof, the way the book tells it: take some truth that nobody actually knows. If all truths are knowable, then the fact that this one is unknown has to be knowable too. But if you know that something is unknown, then it isn't unknown anymore, so you'd have to know it and not know it at the same time, which is impossible. So the anti-realist is stuck saying that we already know everything there is to know, including everything that hasn't happened yet, which is obviously nonsense — so the knowability principle is dead, and anti-realism about truth goes down with it. Then the book says the whole thing rests on a pretty strong assumption that knowledge can never be wrong, i.e. that if you know something you literally can't be mistaken about it, which most philosophers apparently don't buy these days since knowledge is supposed to be fallible, and that underneath it's basically the liar paradox wearing modal-logic clothes — a self-reference trick. And the fix most people apparently accept now is to give up the idea that knowledge "spreads" over conjunctions, i.e. that knowing 'A and B' means you know A, since you could know a conjunction without ever having picked it apart in your head.

