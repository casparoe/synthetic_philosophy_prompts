answer: |-
  # Insect Welfare Risk Protocol (IWRP)
  **For:** Standards Committee Quarterly Review
  **Time Allocation:** 45 Minutes (Strict)
  **Participants:** Vets, Producers, Committee Chair (No external consultants)

  ## Purpose
  To convert the "Expected Welfare Loss" formula into a actionable veterinary risk assessment. This protocol identifies when facts run out and value judgments begin, and prevents large numbers from overriding welfare severity.

  ## The Procedure (Run Sheet)

  ### Step 1: The Leverage Check (5 Minutes)
  **Question:** Can we verify compliance through audit or supply chain control?
  *   **Yes:** We control the facility, feed, or kill method.
  *   **No:** The animals are wild, or the supply chain is opaque (e.g., commodity feed ingredients).
  *   **Stop Condition:** If **No**, the proposal fails here. We do not certify what we cannot verify. Claiming otherwise is greenwashing.
  *   **Action:** If "No," file as *Out of Scope*. Do not proceed to Step 2.

  ### Step 2: The Sentience Risk Assessment (15 Minutes)
  **Question:** Based on veterinary evidence, what is the risk that this organism experiences negative affective states (suffering), not just nociception (reflex)?
  *Do not assign a percentage probability. Assign a Risk Category.*

  **Evidence Checklist (Vet Lead):**
  1.  **Anatomy:** Presence of a centralized brain (not just ganglia)? Opioid-like receptors?
  2.  **Pharmacology:** Does behavior change with analgesics (e.g., morphine/lidocaine) vs. local anesthetics?
  3.  **Behavioral Trade-offs:** Will the animal endure a noxious stimulus to gain a reward (e.g., food, shelter)?
  4.  **Protective Behavior:** Guarding of injured body parts after the threat is removed?

  **Categorization:**
  *   **High Risk:** Evidence for ≥3 criteria (e.g., Adult Decapod Crustaceans, Adult Crickets).
  *   **Medium Risk:** Evidence for 1-2 criteria (e.g., Black Soldier Fly Larvae, some pupal stages).
  *   **Low Risk:** Evidence for 0 criteria; reflex only (e.g., Early instar larvae, nematodes).

  **Stop Condition:** If **Low Risk**, welfare standards default to *Basic Husbandry Only* (no pain mitigation required). If **High/Medium**, proceed to Step 3.

  ### Step 3: The Severity Cap (10 Minutes)
  **Question:** What is the maximum duration and intensity of negative experience per individual?
  *   **Metric:** Seconds/Minutes of acute stress vs. Days/Weeks of chronic stress.
  *   **Benchmark:** Compare to the "Broiler Chicken Standard" (our current baseline).
  *   **Action:** Classify the kill method/husbandry as *Equivalent*, *Lower*, or *Higher* severity than the Broiler baseline.

  ### Step 4: The Scale Check (The "Math Smuggling" Filter) (10 Minutes)
  **Question:** Does the population size ($N$) distort the risk assessment?
  *   **Rule:** If $N > 100,000$ individuals per production cycle, **do not calculate Total Welfare Loss.**
  *   **Reasoning:** At this scale, uncertainty in Sentience Risk ($P$) dominates the calculation. Multiplying billions by a small probability creates a false precision that justifies any cost or ignores any suffering.
  *   **Action:**
      *   If $N < 100,000$: You may use the formula for prioritization.
      *   If $N > 100,000$: The decision rests **solely on Severity Cap (Step 3)**. The numbers are irrelevant.
      *   **Flag:** If the formula suggests a "Higher Total Loss" than vertebrates solely due to $N$, mark this as **"Benchmark Failure."** This indicates our vertebrate baseline is not comparable, not that the insects are suffering more.

  ### Step 5: The Recommendation (5 Minutes)
  *   **Committee Decision:** Pass to Board, Reject, or Request Data.
  *   **Board Vote Trigger:** If the recommendation requires producers to incur costs >5% of operational budget, or if Step 4 flagged a "Benchmark Failure," the Board must vote. This is a value judgment, not a fact.
  *   **Justification:** Any cost-imposing recommendation requires a one-page summary: *Risk Category, Severity Cap, and Scale Check Result.* No formula outputs allowed on the summary.

  ---

  ## Application to Current Proposals

  Here is how the IWRP runs on your three agenda items.

  ### Case 1: Black Soldier Fly (BSF) Larvae (Mass-Rearing)
  *   **Leverage:** **Yes.** Controlled shed, controlled kill (heat/maceration).
  *   **Sentience Risk:** **Medium.** Larvae have ganglia, show some avoidance, but analgesic evidence is weak/unclear.
  *   **Severity:** **High.** Maceration/Heat is instantaneous but high intensity.
  *   **Scale Check:** **FAIL.** $N$ is in the billions per shed.
      *   *Formula Output:* If you run the consultant's math ($Billions \times Medium Risk$), the "Welfare Loss" exceeds the entire vertebrate portfolio of the certification scheme.
      *   *Protocol Ruling:* **Stop.** The multiplication is smuggling moral weight. The numbers are too large for the formula to be informative.
  *   **Outcome:** **Recommendation: Pause Certification.**
      *   *Why:* We cannot apply a vertebrate benchmark to an organism where the population count breaks the arithmetic. To certify this, the Board must explicitly vote to *ignore* the scale discrepancy.
      *   *The Bite:* This stops the retailers from getting their label immediately. It forces an admission that the "Broiler Benchmark" is meaningless at this scale.

  ### Case 2: Crickets (Adult)
  *   **Leverage:** **Yes.** Controlled farming.
  *   **Sentience Risk:** **High.** Adults show trade-offs, protective behavior, and response to analgesics.
  *   **Severity:** **Medium.** Freezing is common (slow); heat is faster.
  *   **Scale Check:** **Warning.** $N$ is high (millions), but lower than BSF.
      *   *Protocol Ruling:* Proceed based on **Severity Cap** only. Ignore the total count.
  *   **Outcome:** **Pass to Board.**
      *   *Condition:* Kill methods must be upgraded to match Broiler "Stun-to-Kill" timeframes.
      *   *Cost:* Requires new freezing equipment. Triggers the one-page justification requirement.

  ### Case 3: Wild Insects (Agricultural Pest Control)
  *   **Leverage:** **No.**
      *   *Protocol Ruling:* **Immediate Fail.**
      *   *Reasoning:* We cannot audit wild populations. We cannot verify "avoidable suffering" in a field spray.
  *   **Outcome:** **Reject Proposal.**
      *   *The Bite:* This directly contradicts the Chair's proposal.
      *   *Why:* Including this in a certification logo implies we have control we do not possess. It exposes the scheme to legal risk (false advertising) and dilutes the value of the label for the farmed animals we *can* control.

  ---

  ## What This Procedure Cannot Do (Read this at the meeting)

  1.  **It cannot solve the moral status of insects.** It treats sentience as a veterinary risk factor, not a philosophical truth. If the Board wants to certify BSF despite the "Benchmark Failure," they can, but they must own the value judgment.
  2.  **It cannot validate the Consultant's Formula.** Step 4 explicitly admits that the formula breaks at high $N$. If you use the formula for BSF, you are doing math, not ethics.
  3.  **It cannot protect wild insects.** Case 3 proves that certification is a tool of supply chain control, not a tool for global moral accounting. If we claim to cover wild insects, we are selling a logo, not welfare.
  4.  **It cannot prevent cost increases.** It only flags them. The Board will still have to vote on whether welfare for crickets is worth the price of eggs going up.

  ## Summary for the Chair
  *   **BSF:** The math breaks. Do not certify until the Board votes to override the Scale Check.
  *   **Crickets:** Certifiable, but requires hardware upgrades (Board Vote on cost).
  *   **Wild Insects:** Do not touch. We have no leverage. Claiming otherwise is a liability.
