answer: |-
  This is a sophisticated framing that effectively dissolves the standard "Stern vs. Nordhaus" debate by reclassifying most of it as either normatively indefensible (axiological discounting) or categorially mistaken (preference aggregation). If your hypothesis holds—that defensible discounting is purely decision-theoretic (epistemic/structural) rather than axiological—your research program must pivot from *parameter estimation* to *structural modeling of uncertainty and agency*.

  Below is a defended four-year agenda for three positions. The ordering is strictly hierarchical: you cannot solve downstream institutional questions until the upstream decision-theoretic reduction is formalized.

  ### Priority 1: The Formal Reduction of "Discounting" to "Probability-Weighted Existence"
  **Status:** Upstream / Foundational
  **Tractability:** High for Decision Theorists/Philosophers; Low for Empirical Economists
  **Position Allocation:** Position 1 (Formal Decision Theory)

  **The Question:**
  If we reject axiological discounting, the "discount rate" applied to future welfare must be fully derived from the probability that the welfare subject exists and the probability that the predicted outcome obtains. The core task is to formalize a decision rule where the *effective* discount rate emerges entirely from hazard rates (existential risk), model uncertainty, and the fading of causal influence, without smuggling in a $\delta > 0$ for time itself.

  **Defense of Ordering:**
  This is the bottleneck for the entire program. If this reduction fails—if it turns out that rational planning *requires* a non-epistemic time preference to avoid paradoxes (e.g., in infinite ethics or aggregation)—then your working hypothesis collapses, and the agenda must reset. Conversely, if successful, it provides the normative constraint for all downstream policy work. It is upstream because you cannot design institutions to manage long-term welfare (Priority 3) until you define the objective function they are maximizing.

  **Why this fits your team:**
  Standard economics treats the discount rate as a primitive parameter to be calibrated. Philosophers and decision theorists are better equipped to treat it as a derived variable dependent on metaphysical and epistemic conditions. This position should focus on integrating **survival analysis** with **intertemporal choice theory**.

  **Trigger for Re-ordering:**
  *   **Move Up:** If preliminary models show that pure probability discounting leads to "fanaticism" (overweighting low-probability, high-value far-future outcomes) that violates plausible dominance principles. This would require an immediate pivot to "bounded rationality" constraints.
  *   **Move Down:** If a consensus emerges quickly that the Weitzman-Gollier "certainty equivalent" approach fully resolves the uncertainty component. (Unlikely, but if it happens, resources shift to Priority 2).

  ### Priority 2: Ambiguity Aversion and Deep Uncertainty as Ethical Constraints
  **Status:** Midstream / Structural
  **Tractability:** High for Philosophers (Epistemology/Decision Theory); Medium for Economists
  **Position Allocation:** Position 2 (Philosophy of Uncertainty)

  **The Question:**
  Standard decision theory assumes known probabilities (risk). Long-term forecasting involves *ambiguity* (unknown probabilities) and *model uncertainty*. Under your framing, a planner weights the far future less not because it matters less, but because our confidence in the causal chain is lower. The question is: **What is the normative status of ambiguity aversion in intergenerational justice?** Should a social planner be ambiguity-averse regarding future welfare in a way that individual agents need not be?

  **Defense of Ordering:**
  This depends on Priority 1. Once you establish that discounting is probability-based, you must determine *how* to weight those probabilities when they are imprecise. This is midstream because it refines the objective function defined in Priority 1. It is more central than standard "risk premium" calculations because it addresses the *quality* of the evidence for future claims, which is the primary justification for effective discounting in your framework.

  **Why this fits your team:**
  This is a classic philosophical problem (imprecise probabilities, maximin rules, info-gap decision theory) that empirical economics often sidesteps by assuming rational expectations. A philosopher can argue whether ambiguity aversion is a rational requirement for a *trustee* of future generations, distinct from a description of individual psychology.

  **Trigger for Re-ordering:**
  *   **Move Up:** If it becomes clear that "hazard rate" models (Priority 1) are too sensitive to small parameter changes, making the objective function unstable. Robustness criteria would then become the primary focus.
  *   **Move Down:** If it is demonstrated that ambiguity aversion systematically leads to paralysis (the "infinitely cautious planner" problem), rendering the framework action-guiding only for short horizons.

  ### Priority 3: Intergenerational Commitment and the Category Error of Preference Aggregation
  **Status:** Downstream / Institutional
  **Tractability:** High for Political Philosophers; Low for Welfare Economists
  **Position Allocation:** Position 3 (Normative Political Theory)

  **The Question:**
  Since you reject Claim 3 (that the SWF should inherit actual time preferences), you face a legitimacy gap: By what right does the present planner impose a "decision-theoretic discount rate" on the future that differs from what current voters want? This question asks: **What institutional mechanisms allow for time-consistent planning that is insulated from current myopic preferences without being undemocratic?**

  **Defense of Ordering:**
  This is downstream because institutional design depends on the normative target. If you design a "Future Guardianship" body (Priority 3) before you know whether the goal is to maximize expected value (Priority 1) or minimize regret under ambiguity (Priority 2), you risk building institutions for the wrong objective. Furthermore, this question only becomes urgent once the first two claims establish that current preferences are normatively irrelevant.

  **Why this fits your team:**
  Economists typically solve this via "commitment devices" (e.g., debt rules). Philosophers are needed to address the *authority* problem. If actual preferences are a category error, the justification for policy cannot be "satisfying voters." It must be "fiduciary duty." This requires work on trusteeship models, not voting theory.

  **Trigger for Re-ordering:**
  *   **Move Up:** If political instability threatens the continuity of the research program itself (e.g., funding cuts based on short-termism), making institutional defense a prerequisite for theoretical work.
  *   **Move Down:** If the theoretical work (Priorities 1 & 2) reveals that the "optimal" plan is so sensitive to empirical inputs that no institution could reliably implement it, making institutional design premature.

  ---

  ### Shifts in Centrality: What to Drop and What to Elevate

  To make room for this agenda, you must explicitly deprioritize questions that are standard in economics but peripheral under your framing.

  **1. From Central to Peripheral: The Ramsey Rule Parameters**
  *   *Standard View:* Debating the elasticity of marginal utility ($\eta$) and the pure time preference rate ($\delta$) is the core of climate economics.
  *   *Your Framing:* $\delta$ is zero (axiologically). $\eta$ is an empirical question about consumption smoothing, not a normative discount on welfare.
  *   *Action:* Do not fund positions to estimate these parameters. Treat them as background constants or sensitivity variables, not research outputs.

  **2. From Peripheral to Central: Existential Risk as a Discount Factor**
  *   *Standard View:* Existential risk is a separate field from discounting.
  *   *Your Framing:* Existential risk *is* the discount rate. If there is a 1% annual chance of civilization collapse, the expected value of welfare in 100 years is discounted by that hazard rate, not by time preference.
  *   *Action:* Position 1 should integrate survival analysis directly into the discounting model. This is the strongest link between your philosophical framing and concrete policy relevance.

  **3. From Central to Peripheral: Revealed Preference Studies**
  *   *Standard View:* We should look at market interest rates or survey data to infer social time preference.
  *   *Your Framing:* This is the "category error" (Claim 3). Individual myopia does not constitute social irrationality, nor does it bind the planner.
  *   *Action:* Do not fund empirical behavioral work on time preference. It is irrelevant to the normative question.

  **4. From Peripheral to Central: Moral Uncertainty**
  *   *Standard View:* We assume a single utilitarian (or prioritarian) metric.
  *   *Your Framing:* If we are planning for centuries, we cannot be certain our current moral theory is correct. "Discounting" may actually be "weighting by moral credence."
  *   *Action:* Position 2 should incorporate moral uncertainty into the decision-theoretic model. This is a neglected area that becomes load-bearing when axiological discounting is removed.

  ### Summary of Trade-offs

  | Feature | Standard Economics Agenda | Your Proposed Agenda | Trade-off Consequence |
  | :--- | :--- | :--- | :--- |
  | **Normative Basis** | Welfarism + Preference Sovereignty | Fiduciary Trusteeship + Objective Value | **Loss:** Political legitimacy is harder to argue. **Gain:** Consistency across generations. |
  | **Discount Source** | Psychological impatience + Market rates | Epistemic decay + Hazard rates | **Loss:** Less direct contact with market data. **Gain:** Immune to market irrationalities. |
  | **Methodology** | Calibration + Empirical Estimation | Formal Modeling + Conceptual Analysis | **Loss:** Less immediate policy "numbers." **Gain:** Robustness to empirical revision. |
  | **Risk Focus** | Variance in consumption growth | Variance in existence & model truth | **Loss:** Harder to communicate to financiers. **Gain:** Aligns with longtermist risks. |

  ### Final Recommendation on Position Profiles

  1.  **Position 1 (The Formalizer):** A decision theorist with strong mathematics. Task: Build the "Epistemic Discounting" model (Priority 1).
  2.  **Position 2 (The Epistemologist):** A philosopher of science/probability. Task: Handle Ambiguity and Moral Uncertainty (Priority 2).
  3.  **Position 3 (The Institutional Theorist):** A political philosopher. Task: Design the "Guardianship" justification (Priority 3).

  This allocation ensures that the upstream theoretical work (Positions 1 & 2) is completed in years 1-2, allowing Position 3 to begin institutional modeling in years 2-4 with a stable normative target. If Position 1 finds the reduction impossible, Position 3 can pivot to damage control (how to manage axiological discounting if it proves unavoidable), but the primary bet should be on the reduction holding.
