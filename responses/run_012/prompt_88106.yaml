answer: |-
  # Decision Tree: Navigating the Space of Vagueness

  **Instructions for the Group:**
  We begin with the **Tolerance Intuition**: In a Sorites series (e.g., a heap of sand losing grains one by one, or a person shrinking millimeter by millimeter), no single adjacent pair seems different enough to mark the boundary between "Heap" and "Non-Heap" (or "Tall" and "Not Tall"). Yet, the first item is clearly a heap, and the last is clearly not.

  Follow the path that matches your intuitions about the questions below. The **Institutional Case** (in Node 1) is designed to test your intuitions about rules and authority, which often diverge from descriptive cases like heaps.

  ---

  ### **Node 1: The Fact of the Matter**
  **Consider the Institutional Case:** A university rule states: *"A thesis must be **substantially complete** before a defense is permitted."* A student submits a draft missing one minor footnote. The committee is split.
  **Consider the Standard Case:** A man with 5,000 hairs on his head.

  **Question:** Is there a determinate fact of the matter about whether the thesis is "substantially complete" (or whether the man is "bald") *independent* of our decision, verdict, or ability to know it?
  *   **(A) Yes.** There is a fact (it either is or isn't), even if we cannot possibly discover it.
      *   $\rightarrow$ Go to **Node 2A**.
  *   **(B) No.** There is no fact of the matter until a decision is made, or the concept itself lacks the precision to support a fact.
      *   $\rightarrow$ Go to **Node 2B**.

  ---

  ### **Node 2A: The Epistemic Path (If you answered Yes)**
  **Question:** In the borderline case (the draft missing the footnote), is the sentence "This thesis is substantially complete" strictly **True** or strictly **False**?
  *   **(A) Yes, it is strictly True or False.** (Bivalence holds).
      *   $\rightarrow$ **LEAF: Epistemicism.**
      *   *Note:* You believe sharp boundaries exist but are unknowable. The Sorites argument is **unsound** (the inductive premise is false, though we can't know which instance fails).
  *   **(B) No, truth is relative to the assessor.** The sentence isn't true/false simpliciter, but only true-for-the-committee or false-for-the-student.
      *   $\rightarrow$ **LEAF: Relativism about Truth.**
      *   *Note:* You accept a fact exists but deny it is monadic; it is indexed to an assessor or context of assessment.

  ---

  ### **Node 2B: The Non-Epistemic Path (If you answered No)**
  **Question:** In the borderline case, what is the semantic status of the sentence "This thesis is substantially complete"?
  *   **(A) It is neither True nor False.** (Truth-value gap).
      *   $\rightarrow$ Go to **Node 3A**.
  *   **(B) It is both True and False.** (Truth-value glut).
      *   $\rightarrow$ **LEAF: Subvaluationism / Paraconsistent View.**
      *   *Note:* You accept contradictions in reality or language to preserve tolerance. The Sorites argument is **valid**, but you accept the contradiction in the conclusion.
  *   **(C) The predicate is defective or meaningless.**
      *   $\rightarrow$ **LEAF: Nihilism / Error Theory.**
      *   *Note:* You believe vague predicates fail to refer or express coherent properties. There are no heaps, only particles arranged heap-wise.

  ---

  ### **Node 3A: The Gap Path (If you answered Neither True nor False)**
  **Question:** Where does the failure of bivalence originate? Is the indeterminacy in the **World** (the objects themselves) or in **Language/Thought** (our representation of the objects)?
  *   **(A) In the World.** The thesis itself is indeterminate; reality is fuzzy.
      *   $\rightarrow$ **LEAF: Ontic Indeterminacy.**
      *   *Note:* You believe vagueness is a metaphysical feature, not just a semantic one. Borderline applies to **objects**, not just sentences.
  *   **(B) In Language/Thought.** The world is precise; our words/concepts are not.
      *   $\rightarrow$ Go to **Node 3B**.

  ---

  ### **Node 3B: The Semantic Path (If you answered Language/Thought)**
  **Question:** Does the extension of "substantially complete" (or "bald") shift depending on the **context of use** or the **speaker's practical purposes**?
  *   **(A) Yes.** In a strict context, the draft fails; in a lenient context, it passes. The boundary moves.
      *   $\rightarrow$ **LEAF: Contextualism.**
      *   *Note:* The Sorites argument is **invalid** because the predicate shifts meaning mid-argument.
      *   *Insight from Institutional Case:* Unlike heaps, institutional rules often make this context explicit (e.g., "complete for the purpose of defense"). This reveals that vagueness may be a tool for flexible governance rather than a defect.
  *   **(B) No.** The meaning is stable, but it is underdetermined (compatible with multiple precise boundaries).
      *   $\rightarrow$ Go to **Node 4**.

  ---

  ### **Node 4: Precision and Higher-Order Vagueness**
  **Question:** Is there a sharp boundary between the **clear cases** and the **borderline cases**? (i.e., Is "borderline" itself vague?)
  *   **(A) No.** The boundary between clear and borderline is also fuzzy (Higher-Order Vagueness).
      *   $\rightarrow$ Go to **Node 5**.
  *   **(B) Yes.** We can draw a sharp line between what is definitely true and what is indeterminate.
      *   $\rightarrow$ **LEAF: Classical Supervaluationism (without HOV).**
      *   *Note:* This view is often considered unstable (the "revenge" Sorites), but logically available.

  ---

  ### **Node 5: Degrees vs. Supertruth**
  **Question:** Is truth a matter of **degree** (0 to 1), or is it a matter of **truth across all admissible interpretations** (Supertruth)?
  *   **(A) Degree.** The thesis is 0.8 "substantially complete."
      *   $\rightarrow$ **LEAF: Degree-Theoretic / Fuzzy View.**
      *   *Note:* The Sorites argument is **invalid** (Modus Ponens fails for degrees).
  *   **(B) Supertruth.** The sentence is "True" only if it is true on *every* way of making the predicate precise.
      *   $\rightarrow$ **LEAF: Supervaluationism.**
      *   *Note:* The Sorites argument is **invalid** (Modus Ponens fails for supertruth) or **unsound** (the inductive premise is not supertrue).

  ---

  ### **Analysis of the Split: Epistemicism vs. Supervaluationism**

  For our reading group, the most critical fork occurs between **Node 1(A)** and **Node 2B(A) $\rightarrow$ Node 3B(B) $\rightarrow$ Node 5(B)**.

  1.  **The Divergence Point:** The single answer that forces a student from one view to the other is the answer to **Node 1**: *"Is there a determinate fact of the matter independent of our ability to know it?"*
      *   **Epistemicism** requires **Yes**.
      *   **Supervaluationism** requires **No** (at the level of specific precisifications).
  2.  **The Diagnostic Question:** If you want to know where a student stands without using jargon, ask: *"In the borderline case, is the sentence false but we just can't tell, or is it genuinely lacking a truth value?"*
  3.  **Hybrids and Gaps:**
      *   **Hybrid:** **Epistemicism with Higher-Order Vagueness.** (Timothy Williamson's view). The tree leads Epistemicists to Node 2A, but they may answer Node 4(A) "No" (believing the *location* of the sharp boundary is itself unknowable/vague in a higher-order sense). The tree flags this as a plausible hybrid.
      *   **Hybrid:** **Supervaluationism with Contextualism.** Some philosophers argue precisifications are selected by context. The tree separates these at Node 3B, but in practice, these views often bleed into one another.
      *   **Unoccupied Space:** **Ontic Indeterminacy + Epistemicism.** This combination is logically incoherent. If the indeterminacy is in the world (Ontic), there cannot be a determinate fact of the matter unknown to us (Epistemic).
      *   **Unoccupied Space:** **Subvaluationism + Classical Logic.** If you accept gluts (True and False), you cannot maintain classical logic without explosion (unless you are paraconsistent). This space is occupied only by those willing to revise logic.

  ### **Note on the Institutional Case**
  The "Substantially Complete Thesis" case reveals a dimension often hidden by "Heaps": **Normative Authority**.
  *   In the **Heap** case, adding a grain doesn't feel like it *makes* a heap; it feels like we are tracking a property.
  *   In the **Thesis** case, the Committee's vote often feels *constitutive*. If they vote "Pass," it becomes complete.
  *   **What this reveals:** Students who lean toward **Contextualism** or **Relativism** often find the Institutional Case more natural than the Heap case. It suggests that for many vague predicates (especially in law and ethics), the "boundary" is not discovered but **fixed by practical purpose**. This makes Nihilism and Ontic Indeterminacy less attractive for institutional vagueness, while boosting Contextualism.

  ### **Summary of Leaves**
  1.  **Epistemicism:** Sharp boundary exists, unknowable. (Node 1A $\rightarrow$ 2A)
  2.  **Relativism:** Truth depends on assessor. (Node 1A $\rightarrow$ 2B)
  3.  **Subvaluationism:** Borderline cases are both True and False. (Node 2B $\rightarrow$ Glut)
  4.  **Nihilism:** Vague predicates are defective. (Node 2B $\rightarrow$ Defective)
  5.  **Ontic Indeterminacy:** The world is fuzzy. (Node 3A $\rightarrow$ World)
  6.  **Contextualism:** Meaning shifts with context. (Node 3B $\rightarrow$ Yes)
  7.  **Classical Supervaluationism:** Sharp clear/borderline boundary. (Node 4 $\rightarrow$ Yes)
  8.  **Supervaluationism (HOV):** No sharp clear/borderline boundary; Supertruth. (Node 4 $\rightarrow$ No $\rightarrow$ Supertruth)
  9.  **Fuzzy/Degree Theory:** Truth comes in degrees. (Node 4 $\rightarrow$ No $\rightarrow$ Degree)
