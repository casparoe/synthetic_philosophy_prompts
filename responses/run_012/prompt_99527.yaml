      *   *Section 2: The Test.* The Homeostasis Test is good (similar to "Algedonic" systems). But it breaks on **Prediction Error**. RL agents *do* minimize internal error (TD error). Does that count? I need to argue why TD error $\neq$ pain. Pain is a *signal* to change behavior, TD error is a *signal* to change weights. The agent (policy) doesn't change, the learner changes the agent.
      *   *Section 3: The Agent.* It fails the test. The score is external. The "cheat" is just a high-gradient path. There is no internal variable that *breaks* if the score is low. The weights just stop updating effectively.
      *   *Section 4: The Talk.* Don't mock him. He's noticing "Specification Gaming." That's a real safety concern. But it's not moral harm to the AI. It's moral harm to the *user* if they trust the AI.

      *(Self-Correction during drafting)*: I need to be careful not to dismiss the friend's intuition entirely. The "Addiction" analogy is functionally accurate even if phenomenologically false. I should highlight that distinction. Also, I need to make sure I explain *why* the delayed reward matters. It means there's no "rush," just a weight update.

      *(Refining the Homeostasis Test critique)*: The user's test says "degrades the rest of what it does." If an RL agent gets low reward, does its ability to process inputs degrade? No. It just selects suboptimal actions. It doesn't get "dumber" or "slower" in a computational sense, it just has bad weights. A starving animal gets cognitively impaired. A low-reward AI does not. This is a strong point for the User.

      *(Refining the "Real Question")*: The friend is arguing from *Functionalism* (if it acts like it wants, it wants). The user is arguing from *Biological Naturalism* (you need biology to feel). The middle ground is *Computational Functionalism* (does the computation structure support qualia?).

      *(Final Polish)*: Ensure the distinction between the *Agent* (the policy network) and the *Learner* (the optimization algorithm) is clear. The "suffering" would have to be in the Agent. The Learner is the one "poking" it.

