  The base station smelled of wet wool and ozone. Outside, the rain had reduced the Cascades to a gray smear, but inside, the map table was bright under the halogen strips. Elena stood over the laminated topography, her hands resting on the edge of the aluminum frame. Two magnets sat on the grid. One was blue, labeled *Party 4*. The other was red, labeled *Party 7*.

  The radio on her hip crackled. "Command, this is Team Alpha. We are fueled and ready for dispatch. Give us a vector."

  Elena looked at the clipboard. The Survivability Index was clear. Party 4: three hikers, minor injuries, accessible trail, estimated survival window forty-eight hours. Index score: 88. Party 7: one climber, suspected femur fracture, exposed ledge, weather deteriorating, estimated survival window six hours. Index score: 32.

  Protocol 12-B was binders-thick, but the triage matrix was a single sheet tucked into the plastic sleeve on the wall. *Priority follows Index. Maximize aggregate survival.*

  Party 7 was David. Her brother. He was thirty-two. He had borrowed her car keys that morning and told her he'd be back by dusk.

  Elena reached for the binder on the desk. She opened it to Section 4, *Resource Allocation*. Her finger tracked down the printed lines. She stopped at Subsection C, *Discretionary Override*. It read: *Coordinator may deviate from Index scoring if local knowledge suggests unquantified mitigating factors.*

  She looked at the red magnet. She looked at the blue magnet. The rain hammered the roof. She did not close her eyes. She did not exhale sharply. She picked up the red magnet and moved it to the *Active* column. She moved the blue magnet to *Pending*.

  "Team Alpha," she said into the mic. "Vector to Party 7. Grid reference 44-Alpha. Priority One."

  "Copy, Command. Vectoring to Party 7."

  Elena closed the binder. She picked up her pen and logged the decision code: 4-C. She wrote the time. She put the pen down.

  ***

  The conference room was underground, windowless. The air conditioning hummed at a frequency that made the teeth ache. Elena sat on one side of a long table. On the other side sat three members of the Institutional Review Board. A digital recorder sat between them, a red light blinking steadily.

  The chair, a man with gray hair and a suit that cost more than Elena's truck, slid a file across the table. It was the incident report. The recovery team had found David alive. The three hikers from Party 4 had been found twelve hours later, hypothermic but stable.

  "Coordinator Vance," the chair said. "We are here to review the allocation decision made on November 14th."

  "Yes," Elena said.

  "According to the Survivability Index, Party 4 presented a significantly higher probability of successful recovery than Party 7."

  "That is correct."

  "And yet you assigned the only available rapid-response team to Party 7."

  "Yes."

  The woman to the chair's left leaned forward. She wore glasses on a chain. "Party 7 was your brother. Is that accurate?"

  "Yes."

  "Did you disclose this conflict of interest prior to the assignment?"

  "No."

  "Why not?"

  "Protocol 12-B does not require recusal for kin if the Coordinator is the only qualified personnel on shift. It requires documentation." Elena tapped the file. "I logged the decision code."

  The third member, a younger man with a tablet, scrolled through a screen. "You logged code 4-C. Discretionary Override. Can you specify the unquantified mitigating factor you identified?"

  Elena looked at the recorder. "The subject had a history of syncope under high-altitude stress. The Index does not account for medical history not visible to remote sensors."

  "The subject's medical history was not in the system," the man said.

  "I knew it."

  "Because you are his sister."

  "Because I am his coordinator," Elena said. "I have access to local knowledge."

  The chair interlaced his fingers. "Coordinator Vance, let's be precise. If Party 7 had been a stranger with the same medical history, would you have made the same allocation?"

  Elena paused. The hum of the air conditioner seemed to grow louder. "The protocol allows for the use of local knowledge. I used the protocol."

  "That isn't an answer," the woman said. "If it were a stranger, would you have known about the syncope?"

  "No."

  "So the knowledge was contingent on the relationship."

  "The knowledge was available," Elena said. "The protocol permits me to use available knowledge."

  The chair leaned back. "You prioritized a lower survival score over a higher one. You understand that from an impartial standpoint, this misranks the value of the lives involved. You treated one life as weightier than three."

  "I treated the protocol as binding," Elena said. "The protocol grants discretion. I exercised it."

  "Did you exercise it because the protocol allowed it?" the chair asked. "Or did you exercise it because you wanted to save your brother?"

  "I exercised it because the situation warranted it."

  "The situation," the man with the tablet said, "was that your brother was dying."

  "The situation was that a climber was dying," Elena said. "I had data regarding that climber. I applied the data according to Section 4, Subsection C."

  The chair looked at her for a long moment. He glanced at the binder sitting on the table, identical to the one in the base station. "So, if Section 4, Subsection C did not exist... if the protocol demanded strict adherence to the Index with no overrides..."

  "Then the protocol would be different," Elena said.

  "But if it were," the chair pressed. "If the rules were absolute. Would you have sent the team to Party 4?"

  Elena looked at the blinking red light. She looked at her hands, which were resting flat on the table. "I followed the rules that were in place."

  "We are asking about your reasoning, Coordinator. Not your compliance."

  "My reasoning is documented in the log," Elena said. "Code 4-C. Unquantified mitigating factors."

  The woman sighed, a soft sound of friction. "You know what we're asking. Did the rule make the choice for you? Or did you use the rule to make the choice?"

  Elena shifted her weight in the chair. The fabric of her uniform pants whispered against the vinyl. "I made the choice. The rule authorized it."

  "Authorized it," the chair repeated. "Not compelled it. Not demanded it. Authorized it."

  "Yes."

  "So you could have chosen otherwise. You could have followed the Index."

  "I could have."

  "But you didn't."

  "No."

  The chair picked up his pen. He hovered it over the file. "Thank you, Coordinator. We will review the transcript."

  Elena stood up. She pushed the chair in under the table. She nodded to the three members. She walked to the door and opened it. The hallway outside was bright and empty. She closed the door behind her, leaving the red light blinking in the room.

  ***

  **Endnote**

  This story is engineered to isolate the **deliberative-order charge** (b). The tension lies in whether the protocol provided a legitimate structure for action or an alienating中介 (medium) that corrupted the reason for acting. The two charges come closest to collapsing in the boardroom when Elena answers, "I exercised it because the situation warranted it." Here, the justification for the *weight* of the reason (the brother's life) is indistinguishable from the justification for the *procedure* (the clause), obscuring whether she acted on the attachment or on the permission.
