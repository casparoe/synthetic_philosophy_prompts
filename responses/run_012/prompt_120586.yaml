      *   *Best Fit:* **The "First-to-Market" Feature Launch in a Winner-Take-All Software Market.** (e.g., Social Media recommendation algorithms or LLM release).
      *   *Wait, a better analogy for Policy Students:* **Banking Capital Reserves.**
          *   *Tax:* Holding capital in reserve (liquidity/safety) vs. leveraging it for profit/growth.
          *   *Constraint:* If Bank A holds 10% and Bank B holds 5%, Bank B grows faster, buys Bank A, or outcompetes them. If the system rewards growth over stability, the cautious bank dies.
          *   *Why:* Economists/IR get it. It separates "greed" from "structure." It mirrors the AI dynamic (compute/capability vs. safety).
      *   *Decision:* **Banking Leverage/Capital Reserves.** It isolates the *structure* from the *technology*.

  4.  **Identifying Misconceptions:**
      *   *User's Guess 1:* Tax is fixed/measurable vs. comparative/dynamic. (Correct. This is crucial because if it's fixed, policy can fix it. If dynamic, it changes with the tech).
      *   *User's Guess 2:* Constraint is moral failing vs. payoff structure. (Correct. This is crucial for policy. If it's moral, we lecture CEOs. If structural, we change incentives).
      *   *What's Missing?* **The "Engineering vs. Marketing" Trap.** The students will fight over whether the tax *exists*. The lesson must assume it exists for the sake of the structural argument, or define it broadly enough that denying it is impossible.
