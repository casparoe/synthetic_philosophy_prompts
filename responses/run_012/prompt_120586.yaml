      *   *Dependency:* You can't understand the *constraint* without understanding the *tax*. The tax is the input; the constraint is the mechanism that amplifies the tax into a selection pressure.
      *   *Dependency:* You can't understand the *sustainability of caution* without understanding the *constraint*.
      *   *Student Trap:* They want to debate "Is the tax real?" (Engineering vs. Marketing) or "Is the risk real?" (Danger vs. Hype). The lesson must bypass this to focus on the *structural incentive*.
