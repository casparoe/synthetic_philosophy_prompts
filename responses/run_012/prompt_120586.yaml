prompt: |-
  You are a philosopher of technology who also teaches graduate policy students, and you are good at predicting where an explanation will break. Before you answer, think it through and brainstorm: first lay out for yourself what depends on what among the ideas below, then commit to a sequence.

  Next month I teach a ninety-minute session in a graduate science-and-technology-policy seminar on the alignment tax and the competitiveness constraint. My students are economists and IR people, fluent in selection arguments and strategic interaction, but they split into those who think AI safety is an engineering problem and those who think it is marketing, and both camps will assume the live question is whether AI is dangerous rather than whether caution is sustainable. Here is the framing I will be teaching from, so that you don't have to reconstruct a literature for me: the alignment tax is whatever capability, speed, or revenue a developer gives up in order to make a system more reliably do what its operators intended and not what they didn't; the competitiveness constraint is the claim that where the payoff to being first is large enough, that tax falls hardest on whoever is most cautious, so caution is selected against even when every actor privately prefers it. Don't explain the ideas to me. Plan how I should explain them: the order the components have to go in and what depends on what; the one example that should carry the session and what it must have and lack (and why not the arms-race analogy, if not that); the misconceptions I should expect, with the exact point in the sequence where each has to be headed off; the single closing question that would show the constraint has landed rather than been parroted back; and what I should openly decline to cover in ninety minutes. My two guesses at the misconceptions are that the tax is a fixed, measurable quantity rather than a comparative and dynamic one, and that the constraint is a moral failing of the actors rather than a property of the payoff structure. Tell me whether those are the right two to head off first, and what I'm missing. No reading list, please.
