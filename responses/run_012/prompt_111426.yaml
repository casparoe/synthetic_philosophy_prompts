answer: |-
  Good evening.

  For those of you who don't know me, I'm a former student. Which means I am currently experiencing a specific kind of terror. I look out at this room and I see a fault line. On my left, her family, who know her as the woman who makes the letters on the cereal box. On my right, her students, the type designers. And if I have misaligned a single bullet point on this program, the designers are already mentally redrawing it, and the family is wondering why we care.

  This split is exactly where she lived for forty years.

  To her family: When you say she "makes fonts," you aren't wrong, but you're underselling it. She didn't just make shapes; she designed the infrastructure of how we speak to each other. Every love letter, every eviction notice, every menu you've ever read fluently without tripping over a shape—that's her trade.

  To the designers: We know the drill. We know the specific anxiety of the Bézier curve. But tonight, I want to talk about the lesson that haunted us all in first year. The lesson of the 'a'.

  She would hold up the Futura 'a'—that geometric single-story circle with a stick—and the Times New Roman 'a'—the double-story bowl with the lid and the hook. She'd point out that they share almost no ink. Geometrically, they are strangers. And yet, we read them instantly as the same sound, the same idea.

  She forbade us from saying it was because of some magical, Platonic essence of 'a'-ness. She'd roll her eyes so hard we thought they'd stick. She taught us that an 'a' is an 'a' not because of a perfect shape in the sky, but because of *structural integrity under pressure*.

  An 'a' is defined by how it manages tension. It has to enclose a space—the counter—without suffocating it. It has to support a stem without collapsing. It has to remain distinct from an 'o' or a 'u', even when the style demands it be thin, or bold, or italicized. The 'a' isn't a drawing; it's a solution to a problem. It is a structure that holds its identity even when the style changes around it.

  And that is the only stand I'm willing to take tonight: That is what she was to us.

  For forty years, she didn't try to make us all draw the same 'a'. She didn't want a room full of clones tracing her style. That would have been easy. Instead, she provided the structural integrity that allowed us to vary without falling apart.

  When I was struggling, and my work was messy, she didn't fix the curves for me. She checked the tension. She asked, "Is the counter breathing? Is the weight distributed?" She taught us that style is just the space of ways you can vary the details without the letter losing its soul.

  She was the constant structure. She was the closed counter that held the space open for us. She was the stem that showed us where to hang our confidence.

  To her family: You saw her come home tired after grading hundreds of drawings. You saw the patience it took to explain, for the thousandth time, why the kerning on a wedding invitation matters. What you might not have seen is that she was doing the same thing with us that she did with her letters. She was adjusting the space between us so we wouldn't crash into each other. She made sure we were legible to the world.

  To my fellow designers: We spend our lives worrying about the microscopic. The hinting, the anchor points, the x-height. We worry about whether a curve is truly tangent. But tonight, looking at forty years of her work, we have to admit that the best design isn't in the ink. It's in the resilience. It's in the fact that after four decades, her influence hasn't distorted. It hasn't gone out of style. It holds up.

  She taught us that a letter is a promise of communication. It promises that if you make this shape, someone else will understand your thought. For forty years, she kept that promise. She made sure we were understood.

  So, I propose a toast.

  We cannot toast to a perfect shape, because she taught us perfection is static, and static is dead. We cannot toast to a Platonic ideal, because she'd kick us out of the room.

  Instead, let's toast to structure. To the tension held gracefully. To the woman who taught us that we can change our style, we can grow, we can vary wildly, as long as we keep our internal space open and our weight balanced.

  To the teacher who made sure we all learned how to be read. To [Teacher's Name].
