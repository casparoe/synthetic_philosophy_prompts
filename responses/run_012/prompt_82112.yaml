answer: |-
  The tension you're grappling with is real, but your colleague's analogy risks conflating the *logic of justification* with the *mechanics of implementation*. To untangle this, we need to dissect how Carnap's methodological voluntarism maps onto political voluntarism, and where the isomorphism breaks down.

  Here is the conceptual anatomy of the problem, broken down by the specific philosophical commitments you mentioned.

  ### 1. Noncognitivism and the Limits of Advocacy
  The standard view holds that Carnap's emotivism/noncognitivism about ethics insulates his philosophy from his politics. If value judgments are neither true nor false, Carnap cannot philosophically *prove* socialism is superior to capitalism. He can only express his attitude ("I prefer socialism") or analyze the logical structure of socialist claims.

  However, this doesn't render his advocacy incoherent; it renders it *instrumental*. Carnapian noncognitivism commits him to a specific form of political argumentation:
  *   **No Moral Realism:** He cannot argue socialism is *Just* in a metaphysical sense.
  *   **Technical Rationality:** He can argue socialism is *efficient* relative to agreed-upon ends (e.g., minimizing suffering, maximizing security).

  This shifts the debate from "Which system is True?" to "Which framework serves our pragmatic goals?" This is where your colleague sees the parallel to centralized planning. If the choice of an economic system is a practical choice about organizing means to ends, rather than discovering a pre-existing natural order (like the "laws" of the market), then the Carnapian stance undermines the naturalistic fallacy often used by free-market proponents.

  ### 2. The Internal/External Distintion and Economic Frameworks
  This is the crux of your colleague's argument. In *Logical Syntax*, Carnap argues that questions about the validity of a linguistic framework are external and pragmatic. We choose a framework based on its fruitfulness, not its truth.

  Does this apply to Markets vs. Planning?
  *   **The Mises/Hayek Position:** They treat the impossibility of socialist calculation as an *internal* logical truth within the framework of praxeology. To them, planning isn't just difficult; it's conceptually incoherent (like trying to square a circle).
  *   **The Carnapian Rebuttal:** A Carnapian would treat the "market framework" and the "planning framework" as alternative linguistic/conceptual structures for organizing economic data. The question "Is planning possible?" is not a matter of pure logic but an external choice of a system of administration. Once the framework is adopted, internal questions (e.g., "Did this factory meet its quota?") become empirically decidable.

  So, structurally, your colleague is right: Carnap's tolerance principle delegitimizes the claim that the market is the *only* rational framework. It opens logical space for planning as a viable option.

  **Where it breaks down:** The internal/external distintion works cleanly for language because adopting a new logic doesn't physically coerce anyone. Adopting a planned economy does. In linguistics, "tolerance" means I can speak your language while you speak mine. In politics, "tolerance" of frameworks usually requires a single sovereign authority to enforce *one* framework (the plan). You cannot have a planned economy and a market economy operating in the same jurisdiction without contradiction. The analogy fails because linguistic frameworks are non-rivalrous; political frameworks are often rivalrous.

  ### 3. Voluntarism: Language vs. Society
  Is there a coherent voluntarist core? Yes, but it operates at different levels of abstraction.

  *   **Philosophical Voluntarism:** We choose logics to facilitate communication and prediction. The criterion is *expediency*.
  *   **Political Voluntarism:** We choose social structures to facilitate life. The criterion is *welfare*.

  The category mistake arises if we assume the *agency* of the choice is the same.
  *   **Choosing a Language:** Largely individual or communal among scientists. Low stakes for exit.
  *   **Choosing a Society:** Collective, coercive, high stakes for exit.

  Carnap's philosophy supports the idea that social structures are *made*, not *found*. This is a powerful anti-conservative tool. However, it does not dictate *who* gets to make the choice. A central planner and a libertarian both rely on voluntarism about frameworks; they just disagree on which framework is expedient. Carnap's philosophy doesn't solve the calculation problem; it just reframes it from a metaphysical impossibility to an empirical engineering challenge.

  ### 4. Neurath vs. Carnap: Engineering vs. Logic
  You mentioned the difference between planning as social science and planning as a political program. This is where Neurath and Carnap diverge, and it clarifies the limit of the analogy.

  *   **Neurath (The Engineer):** For Neurath, physicalism and the unity of science were directly in the service of *socail* engineering. The scientist is a planner. The distinction between "is" and "ought" is blurred by the urgency of social reconstruction. For Neurath, the voluntarist choice of framework *is* a political act.
  *   **Carnap (The Architect):** Carnap is more reserved. He provides the tools (logic, semantics) to clarify the plans, but he doesn't claim philosophy can build the house. For Carnap, the choice of a linguistic framework is analogous to the choice of a constitution, not the choice of a specific policy.

  If your colleague is arguing that Carnap's philosophy *entails* socialism, she is overstating it. But if she is arguing that Carnap's philosophy *removes the logical barriers* to socialism (by rejecting metaphysical necessity in favor of pragmatic choice), she is correct.

  ### Summary of the Conceptual Map
  1.  **Noncognitivism:** Prevents Carnap from claiming socialism is *True*, but allows him to claim it is *Useful*. This forces political debate into the realm of technical efficacy rather than moral ontology.
  2.  **Internal/External:** Applies to economic systems only if we view them as conceptual frameworks for organizing production. It breaks down if we ignore the coercive nature of enforcing a single economic framework.
  3.  **Voluntarism:** The structural parallel is sound (both reject metaphysical necessity), but the analogy trades on an ambiguity between *intellectual consent* (language) and *political coercion* (society).

  The deep structural parallel is that both Carnap's science and the socialist calculation debate involve a rejection of *a priori* constraints on human organization. But Carnap's "Principle of Tolerance" is a methodological rule for scientists, not a political mandate for planners. To move from one to the other requires a bridge—like Neurath's physicalism—that Carnap himself was often hesitant to fully cross. Your colleague has identified a genuine affinity in the *structure of justification*, but risks a category mistake regarding the *consequences of adoption*.
