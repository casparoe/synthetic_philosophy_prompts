      *   *Check:* Is the tone appropriate? Needs to be academic but direct. Avoid praising H&S too much; stay critical.
      *   *Check:* The user asked about "jointly unsatisfiable" constraints. I need to highlight the tension between *Uniformity* (one mechanism) and *Expertise Shift* (surface vs. structure). Actually, a better tension is between *Fluidity* and *Mechanism*.
      *   *Check:* The circularity point. Tversky's critique of similarity is relevant here. Similarity is context-dependent. H&S say context *is* analogy.
