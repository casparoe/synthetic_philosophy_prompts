      *   *D2: Fluidity of Representation.* (Covering cross-domain, expertise shift). Representations aren't fixed; they shift based on context (slippage).
      *   *D3: Memory Sensitivity.* (Covering retrieval dependence). Analogy isn't logical deduction; it's triggered by what's available in memory.
      *   *D4: Gradedness.* (Covering halo-like judgment). It's not binary; it's probabilistic/activation-based.
      *   *D5: Developmental Plausibility.* (Covering children). Must work without explicit symbolic rules.
      *   *D6: Computational Tractability/Mechanism.* (Covering implementability). It can't just be a description; it needs a process model.

