answer: |-
  **MEMORANDUM**

  **TO:** Building-Code Advisory Committee
  **FROM:** Chair, Building-Code Advisory Committee
  **DATE:** January 15
  **SUBJECT:** Recommendation on Proposed Single-Stair Residential Amendment

  **Purpose**

  This memo outlines my recommendation regarding the proposed amendment to the residential code permitting single-stair ("point access") apartment buildings up to six storeys. We are required to submit a written recommendation to City Council prior to their March meeting. After reviewing the three positions presented in our last session, I recommend we adopt the **Middle Path (Option 3)**: conditional approval contingent on a package of compensating safety measures and a mandatory five-year review.

  This recommendation seeks to balance our strict Terms of Reference (ToR) regarding life safety and construction feasibility with the undeniable reality that building codes shape the social fabric of the city.

  **Terms of Reference and Housing Effects**

  We must first address whether this committee is entitled to weigh housing-type effects. Our ToR confines us to "life safety and construction feasibility." Some argue this excludes any consideration of unit mix, affordability, or household composition.

  I argue that we are not only entitled but obligated to consider these effects. A building code is never neutral physics; it is a regulatory filter that determines what is economically viable to construct. The current two-stair rule is not merely a safety standard; it is a de facto zoning tool that mandates a specific building form (double-loaded corridor) which, due to construction costs and light requirements, biases the market toward larger, more expensive units.

  If we treat the code as purely technical while it produces exclusionary social outcomes, we are not remaining neutral; we are laundering a value choice as engineering. "Construction feasibility" must encompass the functional viability of the housing stock within the city. If a code provision makes a common, safe, and globally proven housing type (the point access block) illegal to build, it is the code that is creating the feasibility problem, not the market. Therefore, evaluating the *type* of housing this amendment enables is within our remit, as it directly impacts the "construction feasibility" of diverse housing forms.

  **Causality and Design**

  We must also be precise about how much causal weight the floor plan carries. A building type cannot *decide* who lives somewhere; income, zoning, and market forces play larger roles. However, the floor plan *biases* the market.

  The double-loaded corridor requires a deep floor plate to amortize the cost of the long hallway. This geometry favors larger units and often results in single-aspect homes (windows on one side). The point access block, with its smaller floor plate and central stair, allows for cross-ventilation and light on two or three sides per unit, making smaller footprints efficient and livable. By prohibiting this form, we are not just regulating stairs; we are regulating the supply of smaller, potentially more affordable units. The amendment does not guarantee affordability, but it removes a regulatory barrier that currently makes non-family housing difficult to build.

  **Safety, Equity, and the Counter-Argument**

  The strongest argument against this amendment comes from my colleague, the fire engineer, and is echoed by housing advocates concerned with equity: *The households most likely to occupy the cheapest new units are the ones most exposed if a safety gamble goes wrong.*

  This is not a caricature; it is a valid ethical concern. If we permit single-stair egress, we are increasing reliance on one vertical exit. If that stair is compromised by smoke or fire, the consequences are catastrophic. Historically, vulnerable populations occupy the lowest-cost new stock. If we lower the safety margin to increase housing supply, we risk asking the least wealthy residents to accept a higher risk profile than those in wealthier, double-stair buildings. We cannot dismiss this as "risk acceptance" without acknowledging the distribution of that risk.

  However, rejecting the amendment entirely (Option 1) preserves a status quo that also carries social costs: it limits supply, drives up costs, and enforces a car-dependent, low-density urban form that has its own long-term safety and health implications.

  Therefore, Option 3 is the only responsible path. We do not simply "allow" the single stair; we trade the second stair for a *package* of compensating safety measures that collectively equal or exceed the safety of the current code.
  *   **Full Sprinklers & Compartmentation:** These actively suppress fire and contain smoke, reducing the likelihood that the single stair becomes compromised.
  *   **Hard Caps on Units/Travel Distance:** This limits the occupant load and the time required to evacuate, directly addressing the egress capacity concern.
  *   **Five-Year Review:** This acknowledges that while the physics are sound, the local operational context (fire department response, maintenance enforcement) requires verification.

  Regarding the proposed affordability and unit-mix conditions: While strict rent controls may stretch our ToR, we can recommend unit size caps and mix requirements as matters of *egress load feasibility* and *building function*. A building designed for smaller households has different egress dynamics than one designed for large families. Tying the permit to a specific occupant profile ensures the safety calculations hold true.

  **Timeline for Council Action**

  To meet the March Council deadline, we must adhere to the following schedule:

  *   **January 31:** Committee vote on this recommendation.
  *   **February 7:** Drafting of final technical report and conditions (incorporating Fire Department feedback on sprinkler/compartmentation specs).
  *   **February 21:** Final Committee review and sign-off.
  *   **February 28:** Submission of written recommendation to City Clerk.
  *   **March 15:** Presentation to City Council (anticipated meeting date).

  **Conclusion**

  I urge the committee to support the Middle Path. It respects the fire engineer's demand for rigorous safety mitigation without accepting the premise that safety can only be achieved through one specific building form. It respects the urbanist's demand for diverse housing options without ignoring the political and physical risks of changing the code.

  We are not gambling with safety; we are engineering a different kind of safety that allows for a different kind of city. By attaching strict conditions and a sunset review, we ensure that if the risk materializes, we have the mechanism to correct it. If we do nothing, we guarantee the continuation of a housing stock that is increasingly unfeasible for our changing population.

  Please review this position prior to our next meeting. I look forward to finalizing the language of the conditions.

  **[Signature]**

  **Chair, Building-Code Advisory Committee**
