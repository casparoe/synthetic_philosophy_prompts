      To ensure granularity, the Institute has transitioned from absolute counts to normalized per-capita rates. This adjustment corrects for demographic shifts in the Global South.² All data is normalized against population estimates provided by the UN Department of Economic and Social Affairs (UNDESA).

      Inclusion criteria remain strict: NVM counts only intentional kinetic events where a specific perpetrator is identifiable within 72 hours.³ This ensures high confidence in attribution.

      **2.1 Category Recalibration**
      Previous iterations included Category 4b (Deaths via Deprivation: Blockade/Sanctions). Following peer review, Category 4b has been deprecated. These incidents now fall under "Excess Mortality, Unattributed" (EMU) to distinguish structural factors from direct agency.⁴ EMU figures are reported separately and do not impact the headline NVM.

