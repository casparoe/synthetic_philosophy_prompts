  The coin is shaved to pay the line,
  The granaries hold the last of wheat.
  The border holds by old design,
  The record ends as records do.

  The silver flow begins to slow,
  The river breaches all its banks.
  The scholars have nowhere to go,
  The record ends as records do.

  The five-year plan meets empty steel,
  The queues extend around the block.
  The silence hides the broken wheel,
  The record ends as records do.

  The causeway cracks beneath the weight,
  The rain fails in the limestone zone.
  The stelae cease to mark the date,
  The record ends as records do.

  The electors meet to choose the crown,
  The patchwork frays across the lands.
  The imperial weight presses down,
  The record ends as records do.

  We hold the charts of every fall,
  Our sensors watch the warming sea.
  We claim we understand it all,
  The record ends as records do.

  ***

  **Note on Liberties and Framing**

  The poem treats the outside view as a deterministic verdict ("ends as records do"), whereas in practice it yields probabilistic adjustments rather than certainties, suggesting a harder fatalism than most forecasters intend. The tension with the Lindy effect is real but nuanced: Lindy applies best to non-perishable ideas or technologies, whereas polities are perishable entities subject to political risk, so grouping them together conflates two different reference classes. Finally, the poem highlights selection bias by including contested cases like the Holy Roman Empire, reminding you that the forecaster's choice of class determines the prediction as much as the data does.
