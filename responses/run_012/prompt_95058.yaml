answer: |-
  Here is the specification. I have stripped out the normative fluff that belongs in a manifesto and kept only the structural requirements necessary for a theory to function in a real administrative state.

  ### The Desiderata for a Theory of Welfare Conditionality

  Any adequate theory must satisfy the following five requirements. If a theory ignores one, it is describing a different problem.

  **1. The Epistemic Constraint (No Mind-Reading)**
  *   **The Requirement:** The theory must justify conditions based *only* on variables the agency can observe and verify at reasonable cost. It cannot rely on "true" effort, "true" capacity, or "true" need, only on proxies (attendance, job applications, bank balances).
  *   **The Justification:** In the real world, capacity is opaque. A claimant with a hidden disability looks identical to a claimant who is lazy. If a theory requires the state to distinguish these perfectly to be just, it is a theory of angelic administration, not human policy. A theory of conditionality is ultimately a theory of **risk management under uncertainty**, not a theory of moral accounting.

  **2. The Tripartite Error Weighting**
  *   **The Requirement:** The theory must explicitly weight three distinct errors:
      1.  **Inclusion Error:** Paying someone who could work but doesn't (the "cheater").
      2.  **Exclusion Error:** Sanctioning someone who cannot work or is complying (the "mistake").
      3.  **Take-Up Error:** Eligible people who do not claim due to complexity, stigma, or fear (the "ghost").
  *   **The Justification:** Most normative literature obsesses over Error 1. But administratively, Error 3 is often the largest budget saver. A theory that treats Error 1 as a moral catastrophe but Error 3 as administrative friction is incoherent. Both represent a failure of the distributive aim. The theory must state which error is the greater evil and why.

  **3. The Valuation of Deterrence**
  *   **The Requirement:** The theory must define the moral status of the **deterred claimant**. If a work requirement causes someone who *would* have claimed benefit to instead find a job (or starve), is this a success (behavioral correction) or a cost (rights violation)?
  *   **The Justification:** Conditionality functions largely through threat. If the threat works, the sanction is never applied. A theory that evaluates justice only by looking at *applied* sanctions misses the primary mechanism of the policy. It must account for the "shadow of the sanction."

  **4. The Asymmetry of Obligation**
  *   **The Requirement:** The theory must explain why conditional obligations attach to *this* specific transfer (welfare) and not others (inheritance, tax loopholes, corporate subsidies, mortgage interest relief).
  *   **The Justification:** If the justification is "reciprocity" or "not getting something for nothing," the theory must explain why the heir or the homeowner is exempt. If it cannot distinguish the welfare claimant from other recipients of state wealth without begging the question, it is merely rationalizing class prejudice.

  **5. The Subjective Alignment Condition**
  *   **The Requirement:** The theory must account for claimants who *endorse* the conditionality that constrains them. It cannot model claimants solely as victims of coercion or rational maximizers.
  *   **The Justification:** Empirically, many claimants support work requirements and view them as morally necessary for social membership. A theory that treats this endorsement purely as "false consciousness" or "adaptive preference" dismisses the claimant's moral agency. A theory that treats it as pure consent ignores the coercive context. It must navigate the space between.

  ***

  ### 1. Non-Negotiable vs. Camp Commitments (and The Trilemma)

  You asked where the hard limits are. Here is the division.

  **Non-Negotiable (Structural):**
  *   **The Epistemic Constraint.** You cannot build a policy on data you cannot collect.
  *   **The Tripartite Error Weighting.** You cannot optimize a system without defining what counts as a failure.
  *   **The Valuation of Deterrence.** You cannot evaluate a threat-based system without evaluating the threat's effect.

  **Camp Commitments (Contestable):**
  *   **Dignity/Non-Stigma:** Often treated as a requirement, but this is a liberal/social-democratic commitment. A hard-nosed utilitarian might accept stigma if it reduces Inclusion Errors.
  *   **Liberty/Non-Coercion:** A libertarian commitment. Conditionality is inherently coercive; if your theory forbids coercion, it forbids conditionality *ex ante*. That's a position, not a design constraint.
  *   **Need Satisfaction:** A social-democratic commitment. A theory could arguably prioritize labor market attachment over immediate poverty relief (e.g., "work first").

  **The Trilemma (The Impossible Set):**
  You guessed that *Accuracy, Cheap Verification, and Equality* cannot coexist. You are correct, but I would sharpen the terms. The jointly unsatisfiable set is:

  1.  **High Targeting Accuracy** (Minimizing Inclusion and Exclusion errors).
  2.  **Low Administrative Burden** (Cheap verification, low compliance costs for claimants).
  3.  **Non-Intrusiveness** (Respecting privacy/autonomy, avoiding stigma).

  **The Trade-off:**
  *   To get **Accuracy**, you need intrusive verification (violating Non-Intrusiveness) or complex paperwork (violating Low Burden).
  *   To get **Low Burden**, you use rough proxies (violating Accuracy).
  *   To get **Non-Intrusiveness**, you trust the claimant (violating Accuracy on Inclusion Errors).

  Most theories try to hide this trade-off. An adequate theory must admit which corner it is cutting. Usually, modern conditionality sacrifices **Non-Intrusiveness** and **Low Burden** to chase **Accuracy** (specifically minimizing Inclusion Errors/Cheating), accepting that this increases Exclusion Errors and Non-Take-Up.

  ***

  ### 2. The Killer Requirement

  Which single requirement rules out the most theories?

  Your candidate is **The Asymmetry of Obligation** (why condition welfare but not inheritance?). This is a powerful political critique, but many theories can dodge it by claiming welfare is unique because it is *redistributive* or a *safety net* rather than a right or property.

  The requirement that does the most theoretical damage is **The Epistemic Constraint**.

  **Why:** It renders most "Desert-based" theories operationally empty.
  Philosophers love to write about conditioning benefits on "moral effort" or "responsible choice." But the agency cannot see effort or choice; it sees forms and attendance.
  *   If a theory says "Sanction only those who *choose* not to work," it fails the Epistemic Constraint (you can't see choice).
  *   If the theory adjusts to "Sanction those who *fail to demonstrate* work," it admits it is no longer tracking desert, but compliance.

  This requirement forces the theory to admit that **conditionality is not about justice, it is about proxying.** Once you admit you are punishing based on proxies rather than truth, the moral justification for "desert" collapses into a justification for "administrative convenience." This kills about 60% of the normative literature instantly.

  ***

  ### 3. Scorecard

  Here is how the major contenders fare against the desiderata.

  **Desert-Based Theories**
  *   **Verdict:** Fail the Epistemic Constraint.
  *   **Why:** They condition on moral worth or "true" effort. Since the state cannot measure this without mind-reading, these theories either demand an impossible bureaucracy or inadvertently sanction based on crude proxies (like appearance or articulacy) while claiming to track virtue.

  **Reciprocity / Contribution-Based Theories**
  *   **Verdict:** Fail the Asymmetry of Obligation.
  *   **Why:** They argue benefits require a return contribution. They struggle to explain why the wealthy recipient of state infrastructure, legal protection, and tax breaks owes no specific "contribution" labor, while the poor recipient of cash does. They often collapse into "might makes right" (the poor are conditioned because they lack power).

  **Unconditional Basic Income (UBI)**
  *   **Verdict:** Fails the Tripartite Error Weighting (specifically Inclusion Error).
  *   **Why:** UBI solves Exclusion and Take-Up errors perfectly. However, it explicitly accepts 100% Inclusion Error (paying the "cheater"). If your theory views paying the unwilling as a moral catastrophe, UBI is ruled out. If your theory views sanctioning the unable as the catastrophe, UBI wins. It forces a hard choice on Error Weighting.

  **The Cynical / Administrative View**
  *   **Verdict:** Fails Subjective Alignment.
  *   **Why:** This view treats conditionality purely as a technology for labor discipline and cost reduction. It cannot account for claimants who genuinely believe in the work ethic. It must dismiss their agreement as manipulation, which is sociologically thin and patronizing. It explains the *function* well but fails to explain the *legitimacy* that keeps the system stable.

  ***

  **Final Note for the Unit:**
  The most productive tension for your students will be between the **Epistemic Constraint** and the **Tripartite Error Weighting**.
  If you admit you can't see "true" inability (Epistemic), you must accept you will sanction some unable people (Exclusion Error).
  The only way to avoid this is to stop conditioning (UBI).
  So the real debate isn't "Is conditionality just?" It's "Which error are we willing to institutionalize?" That is the question the administrative state actually answers every day, usually without admitting it.
