      *   *Objection 7 (The Hostile Synthesis):* "So what?" Even if they conflated terms, does the prediction change?
      *   *Objection 8 (The "Hope Nobody Asks"):* "Your Alternative." If CST is broken, what's your model for religion/ritual? Or are you just a critic?

      *Refining the Order:*
      1.  Econ (Most damaging intellectually, claims redundancy).
      2.  BE (Claims ignorance of foundational theory).
      3.  Anthro (Defends the actual data/target).
      4.  The "Implicit Assumption" (BE/Econ).
      5.  The "Measurement Difficulty" (Methodological).
      6.  The "So What?" (Pragmatic).
      7.  The "Straw Man" (General).
      8.  The "Hope Nobody Asks" (Constructive alternative).

      *Wait, let's re-evaluate likelihood/damage.*
      *   *Most Damaging:* The Econ objection. If Spence already did this, the paper is redundant.
      *   *Most Likely:* The BE objection. They are the largest group (12 people). They will defend Zahavi/Grafen.
      *   *Most Emotional:* The Anthro objection. They are the target.
      *   *Let's prioritize:*
          1.  BE (Grafen settled this).
          2.  Econ (Spence did this).
          3.  Anthro (Empirics work without it).
          4.  BE (Evolutionary Stability implies differential cost).
          5.  Methodologist (Differential cost is unmeasurable).
          6.  General (Semantic quibble vs. substantive).
          7.  Anthro (Functional success vs. Mechanism).
          8.  Hope Nobody Asks (Your positive program).

  4.  **Drafting the Replies:**
      *   Need to be concise (2 mins spoken is ~250-300 words).
      *   Need to acknowledge validity while holding the line.
      *   Need to identify the "soft spot."

  5.  **Developing the Meta-Commentary:**
      *   I need to assess *my* confidence in the user's premise.
      *   *Premise:* HP and CST are conflated in human literature. *Confidence:* High. This is a known critique (e.g., by Bliege Bird, Smith, etc., though they often use CST loosely).
      *   *Premise:* Human literature usually establishes only absolute cost. *Confidence:* High.
      *   *Premise:* This makes them unfalsifiable. *Confidence:* Medium-High.
      *   *Premise:* Economists had it right from the start. *Confidence:* High (Spence's single-crossing condition).
      *   *Least Sure Point:* Whether the conflation actually leads to *false* positives or just imprecise theory. Maybe the empirical correlations hold even if the mechanism is misidentified.

  6.  **Refining the Content (Self-Correction during drafting):**
