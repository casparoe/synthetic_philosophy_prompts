prompt: |-
  I am presenting at a joint session of my university's evolution and economics groups a paper arguing that the handicap principle and costly signaling are routinely conflated, and that once the two are separated, most empirical appeals to costly signaling in human behavior turn out to be unfalsifiable. My claim is that honest signaling requires a cost that varies with the signaler's quality — a differential cost — while the human literature typically establishes only that a signal is expensive, which is compatible with nearly any result.

  The audience is hostile in three distinct ways. About a dozen behavioral ecologists who regard the formal game-theoretic treatments of the handicap principle as having settled the matter decades ago and will hear my paper as a naive reopening of a closed question. Three economists who work on signaling models and will say that their tradition never needed handicaps at all and had the cost differential right from the start, so that I am either attacking a straw man or merely restating them. And two anthropologists who use costly signaling to explain religion and ritual, whose work is the main target of my critique and who will be in the room.

  Prepare my Q&A sheet: the eight or so objections I will actually get, ordered by how likely and how damaging each one is, each phrased in the vocabulary of the person who would raise it, with a two-minute reply and a note on where that reply is softest. Include the question I am hoping nobody asks. Say how confident you are in the claims you make on my behalf about these literatures, and single out the one point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Distinguishing the Handicap Principle (HP) from Costly Signaling Theory (CST), arguing that conflating them makes human CST applications unfalsifiable. Key distinction: HP requires *differential cost* (marginal cost varies with quality), whereas human literature often shows only *absolute cost*.
      *   **Audience:** Hostile in three ways:
          1.  Behavioral Ecologists (BE): Think HP is settled science (Zahavi/Grafen); see this as naive.
          2.  Economists (Econ): Think they already have the cost differential right (Spence); see this as straw-manning or redundant.
          3.  Anthropologists (Anthro): Their work (religion/ritual) is the target; will defend empirical validity.
      *   **Deliverable:** Q&A sheet with ~8 objections, ordered by likelihood/damage.
      *   **Format per Objection:** Phrased in the objector's vocabulary, 2-minute reply, note on where the reply is softest.
      *   **Extra:** Include the "Hope nobody asks" question.
      *   **Meta-Commentary:** Confidence level in claims made on behalf of the user, identifying the least sure point.

  2.  **Deconstruct the Core Argument:**
      *   *Claim 1:* HP $\neq$ CST generally. HP is a specific subset requiring condition-dependent costs (marginal cost lower for high quality).
      *   *Claim 2:* Human behavioral ecology (HBE) often measures absolute cost, not marginal/differential cost.
      *   *Claim 3:* Without differential cost, the signal isn't necessarily honest (unfalsifiable/just-so stories).
      *   *Tension:* Grafen (1990) formalized HP using differential costs. Spence (1973) used differential costs in job market signaling. So, is the user actually saying something new, or just pointing out empirical sloppiness? The prompt suggests the latter ("empirical appeals... turn out to be unfalsifiable").

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Econ):* "We knew this." Spence models *require* single-crossing conditions (differential cost). If you think we don't, you haven't read Spence.
      *   *Objection 2 (The BE):* "Grafen settled this." Grafen's 1990 model *is* differential cost. You're attacking a caricature of the HP.
      *   *Objection 3 (The Anthro):* "Empirical reality." We measure cost (time, calories). It correlates with status. Why do we need marginal utility curves?
