answer: |-
  ### Q&A Strategy Sheet

  **Context:** You are walking a tightrope. You must validate the theorists (Econ/BE) while dismantling the empiricists (Anthro/HBE) without alienating the theorists who think the empiricists are fine. Your core leverage is the distinction between *absolute cost* (burning resources) and *marginal differential cost* (cost relative to quality).

  **Confidence Assessment:**
  I am **highly confident** in your theoretical distinction: the formal Handicap Principle (Grafen 1990) and Spence's signaling models both require the "single-crossing condition" (marginal cost differs by type), whereas much human behavioral ecology (HBE) measures only absolute expenditure.
  I am **moderately confident** in your claim that this makes the literature "unfalsifiable." It makes it *under-specified*, which allows for ad-hoc rationalizations, but strong correlations can still falsify specific hypotheses.
  **Least Sure Point:** I am least sure that the economists in the room will agree they "had it right from the start" in a way that helps you. They may argue that economic signaling diverged from biology precisely to avoid biological constraints, and they might view your attempt to reunite them as category error.

  ---

  ### The Objections (Ordered by Likelihood and Damage)

  #### 1. The "Grafen Settled This" Objection (Behavioral Ecologists)
  **Vocabulary:** "ESS," "Grafen 1990," "Strategic Cost," "Equilibrium."
  **Question:** "Grafen's 1990 formalization of the Handicap Principle *defined* the cost as condition-dependent. If you're finding papers that don't model differential costs, you aren't finding errors in the Handicap Principle; you're finding errors in people who don't understand the Handicap Principle. Why is this a theoretical problem rather than a pedagogical one?"
  **Reply (2 mins):** "You are correct that Grafen settled the *theory*. My paper argues the *empirical tradition* has decoupled from the theory while keeping the label. When HBE researchers measure 'cost' as calories burned or time spent, they measure absolute cost. A low-quality signaler can pay an absolute cost just as easily as a high-quality one if the benefit is high enough. Without demonstrating that the *marginal* cost is lower for high-quality types, we cannot distinguish honest signaling from simple purchase of status. This isn't pedagogy; it's that the data currently collected cannot distinguish between a Handicap equilibrium and a 'who has the most money' equilibrium."
  **Soft Spot:** You concede the theory is sound, which validates their expertise, but you risk sounding like you are blaming the experimentalists for not being mathematicians.

  #### 2. The "Spence Did It First" Objection (Economists)
  **Vocabulary:** "Single-crossing condition," "Separating equilibrium," "Spence 1973," "Information asymmetry."
  **Question:** "In economics, the single-crossing condition has been standard since Spence. We never claimed absolute cost ensured honesty. Are you simply restating the basic requirement of a separating equilibrium and dressing it up in biological clothing? If so, what is the novel contribution?"
  **Reply (2 mins):** "The novelty isn't in the math; it's in the cross-disciplinary translation. Economics assumes rational agents; biology assumes evolved strategies. The human behavioral ecology literature imports the biological 'honesty' claim but often tests it with economic 'budget' data. My contribution is highlighting that when you apply biological signaling to humans, you cannot assume the single-crossing condition holds implicitly. You must measure the marginal cost of the signal across different quality strata. Most studies stop at 'signal is costly,' which satisfies neither Spence nor Grafen."
  **Soft Spot:** Economists may feel you are claiming credit for a basic econ 101 concept. You must emphasize the *misapplication* in the interdisciplinary space, not the theory itself.

  #### 3. The "Empirics Work Without It" Objection (Anthropologists)
  **Vocabulary:** "Ethnography," "Functional success," "Correlates," "Ritual efficacy."
  **Question:** "In my work on ritual, we observe that costly rites correlate with group cohesion and individual status. Whether the cost is marginally differential or not, the signal works. Why does the mechanism matter if the ethnographic prediction holds?"
  **Reply (2 mins):** "Because correlation is not mechanism. If the cost is absolute, then wealth alone drives the signal. This changes the prediction: under a true handicap, a high-quality individual should signal *more* than a wealthy but low-quality individual. If you only measure absolute cost, you cannot distinguish a 'handicap' from a 'receipt.' This matters for policy and theory. If it's just wealth, ritual is exclusionary. If it's a handicap, ritual is a filter for hidden quality. Your data currently supports both, which means it supports neither specifically."
  **Soft Spot:** Anthropologists prioritize descriptive accuracy over mechanistic precision. You risk sounding like you are dismissing their field data because it lacks a specific parameter.

  #### 4. The "Implicit Differential" Objection (Behavioral Ecologists)
  **Vocabulary:** "Evolutionary Stability," "Cheater invasion," "Selection pressure."
  **Question:** "If the cost weren't differential, low-quality types would mimic the signal, and the system would collapse. Therefore, if we observe a stable signal in nature or humans, the differential cost *must* exist implicitly. Your demand for measurement is redundant."
  **Reply (2 mins):** "That is a theoretical assumption, not an empirical finding. In human systems, signals often persist *because* low-quality types cannot mimic them due to budget constraints, not physiological constraints. That is a barrier to entry, not a handicap. A handicap requires that the high-quality type suffers *less* utility loss from the signal. Stability can be maintained by simple exclusion (wealth gates). We need to measure the utility curve, not just the persistence of the trait."
  **Soft Spot:** This is a hard theoretical fight. If they argue that "budget constraint" *is* a form of quality, the distinction blurs. You must define "quality" strictly (e.g., health, genetic fitness) vs. "resources."

  #### 5. The "Unmeasurable Utility" Objection (Methodologists/Economists)
  **Vocabulary:** "Ordinal utility," "Revealed preference," "Cardinal measurement," "Identification."
  **Question:** "You demand we measure marginal cost differences in utility. Utility is unobservable. We only observe choices. How is your proposal not just demanding impossible data, thereby making the theory unfalsifiable by your own standards?"
  **Reply (2 mins):** "We measure proxies for utility constantly: cortisol levels, opportunity costs, risk exposure. We don't need cardinal utility; we need ordinal rankings of cost across types. For example, does a day of fasting reduce hunting productivity more for a novice than a master? That is measurable. If we cannot measure the differential cost, we cannot claim the signal is a handicap. We should default to the null hypothesis of non-signaling expenditure."
  **Soft Spot:** Measuring marginal utility proxies in humans is notoriously noisy. They can easily attack your proposed methods as impractical.

  #### 6. The "Semantic Quibble" Objection (General Audience)
  **Vocabulary:** "Taxonomy," "Modeling framework," "Heuristic."
  **Question:** "Is this not just a dispute over labels? If everyone understands that 'costly signaling' implies some differential cost, does correcting the terminology actually change the science?"
  **Reply (2 mins):** "Labels drive data collection. If I tell a grad student 'find a costly signal,' they measure calories. If I tell them 'find a differential cost,' they measure calibration curves. The terminology dictates the dataset. By allowing 'absolute cost' to count as 'handicap,' we have accumulated thirty years of data that cannot answer the question we think we are asking. That is more than semantics; it's a sunk cost fallacy in research design."
  **Soft Spot:** Senior faculty hate being told their life's work is based on a semantic error. Soften the blow by acknowledging the historical context.

  #### 7. The "Multiple Equilibria" Objection (Economists/BE)
  **Vocabulary:** "Pooling equilibrium," "Babbling equilibrium," "Refinements."
  **Question:** "Signaling models allow for pooling equilibria where costs don't separate types. Are you ruling out pooling equilibria a priori? Maybe human ritual is a pooling equilibrium where everyone pays the same cost to show group membership."
  **Reply (2 mins):** "I am not ruling it out; I am ruling out the *claim* that it is a Handicap Principle signal. If it is a pooling equilibrium, it is not an honest signal of individual quality. It is a badge of membership. My critique is that authors claim 'honest signaling of quality' while providing data consistent with 'pooling on group membership.' We need to be precise about what is being signaled."
  **Soft Spot:** If they concede it's pooling, they might argue your critique doesn't apply to their specific paper. You need to ensure you target the "quality signaling" claims specifically.

  #### 8. The "Positive Program" Objection (The Synthesis)
  **Vocabulary:** "Alternative hypothesis," "Null model," "Adaptive explanation."
  **Question:** "If you strip away costly signaling from these anthropological cases, what is left? Are you suggesting these behaviors are non-adaptive? What is your alternative model?"
  **Reply (2 mins):** "I am suggesting the null hypothesis should be 'conspicuous consumption' or 'byproduct of social learning,' not 'honest handicap.' We should not assume adaptation until we rule out simpler economic explanations. My paper doesn't solve the anthropology; it clears the debris so the anthropology can begin. We need to test for differential cost before asserting adaptive function."
  **Soft Spot:** This is the most dangerous question. If you don't have a ready alternative, you look like a destroyer. If you propose one (e.g., cultural group selection), you open a new can of worms. Stick to the "Null Hypothesis" defense.

  ---

  ### The Question I Hope Nobody Asks

  **"Can you name one specific paper in this room's bibliography that would be falsified by your criterion, and exactly how?"**

  **Why:** This forces you to attack colleagues directly in front of their peers. It moves from theoretical critique to personal adjudication.
  **Prepared Answer (if forced):** "I will not name names during Q&A to avoid ad hominem framing. However, in the manuscript, I analyze three canonical case studies [have these ready in your head, e.g., specific hunting or ritual papers] where the correlation holds but the marginal cost was not calibrated. In those cases, the data is consistent with my critique, but I invite the authors to re-analyze their residuals by quality strata."

  ---

  ### Final Confidence Note
  I am **85% confident** in the theoretical distinction you are drawing (it is robust in game theory). I am **60% confident** in the strategic outcome. The risk is that the Economists and Behavioral Ecologists realize they agree with each other more than they agree with you, and view your paper as a bridge that isn't needed. Your success depends on framing this not as "Theory vs. Theory" but as "Theory vs. Measurement Practice." Keep the fire on the *methods*, not the *models*.
