answer: |-
  ### The Thought Experiment: The 1954 Trustees' Vote

  **The Subject:** The decision by Oakhaven University to integrate its faculty housing in 1954.
  **The Outcome We Now Care About:** The existence of the modern, integrated university system (of which Oakhaven is a foundational model).
  **The Archive:** A complete collection of meeting minutes, personal diaries, local newspaper clippings, and private correspondence from 1953–1954.

  **The Episodes:**
  1.  **The Rally (March 1954):** A public protest by 300 students and 20 faculty members demanding integration. It made front-page news for a week. Participants believed this was the decisive pressure.
  2.  **The Dinner (April 1954):** A private meal between the University President and the Chair of the Board of Trustees. No press, no minutes, recorded only in two diary entries and one later memoir. At this dinner, the Chair agreed to swing his vote.

  **The Shared Factual & Causal Claims (H1 and H2 agree on all):**
  *   **Fact:** The Rally happened; The Dinner happened.
  *   **Fact:** The Board voted to integrate one week after The Dinner.
  *   **Causal Truth:** The Rally had **zero causal impact** on the vote. The President had already secured the Chair's commitment before the Rally began; the Rally was merely theater. The Dinner was the **necessary and sufficient condition** for the vote. Without The Dinner, no integration. Without The Rally, integration still occurs.
  *   **Evidence:** There is abundant evidence for The Rally (newspapers, photos, oral histories). There is scant evidence for The Dinner (two diary entries).

  ---

  ### The Two Historians

  **Historian 1 (H1): The Causalist**
  *   **Narrative Structure:** Devotes 2 pages to The Rally and 15 pages to The Dinner.
  *   **Narrative Arc:** The story is framed as "The Moment of Decision." The climax is the clinking of glasses at The Dinner. The Rally is treated as a footnote, a "red herring" of history.
  *   **Justification:** "The reader needs to understand *why* we have integration today. The Dinner is the cause. Therefore, the Dinner is the story."

  **Historian 2 (H2): The Contextualist**
  *   **Narrative Structure:** Devotes 10 pages to The Rally and 7 pages to The Dinner.
  *   **Narrative Arc:** The story is framed as "The Climate of 1954." The climax is the tension of the protest, with The Dinner revealed as the quiet resolution.
  *   **Justification:** "The reader needs to understand what it *felt like* to live in 1954. To the actors, The Rally was the event. To ignore its prominence in their lives is to distort the past, even if it didn't change the vote."

  ---

  ### The Check: Applying the Prominence Rule

  **The Rule:** An account is Whiggish to the degree that prominence (space/emphasis) is monotone with contribution to the outcome we now care about (Modern Integration).

  **1. Causal Contribution Values (Agreed by both):**
  *   The Dinner: High Contribution (10/10).
  *   The Rally: Low Contribution (0/10).

  **2. Prominence Assigned:**
  *   **H1:** Dinner (High Prominence), Rally (Low Prominence).
      *   *Ordering:* Dinner > Rally.
      *   *Causal Ordering:* Dinner > Rally.
      *   *Monotonicity:* **Yes.** As causal contribution goes up, prominence goes up.
      *   **Verdict:** **Whiggish.**

  *   **H2:** Dinner (Medium Prominence), Rally (High Prominence).
      *   *Ordering:* Rally $\approx$ Dinner (or Rally > Dinner in terms of emotional weight).
      *   *Causal Ordering:* Dinner > Rally.
      *   *Monotonicity:* **No.** Prominence does not track causal contribution. The Rally is given high prominence despite zero causal contribution to the outcome.
      *   **Verdict:** **Non-Whiggish.**

  **Result:** Both historians tell the truth. Both identify the same cause. But H1 is Whiggish because her narrative geometry mirrors the causal vector toward the present. H2 is not, because her narrative geometry mirrors the experiential landscape of the past.

  ---

  ### Analysis: The Feature Doing the Work

  The feature driving the verdict is the **Teleological Anchor**.

  H1 anchors the weight of every episode to its *consequence for us*. The "size" of an event in her book is determined by how much it built the present.
  H2 anchors the weight of every episode to its *significance for them*. The "size" of an event in her book is determined by how much it occupied the consciousness of the historical actors.

  Under your Prominence Rule, Whiggishness is not about lying; it is about **narrative proportionality**. H1 creates a proportional map of *causality*. H2 creates a proportional map of *experience*. Because causality and experience often diverge (quiet causes, loud distractions), the maps look different even when the terrain (the facts) is identical.

  ### The Evidential Weight Counterfactual

  **Question:** If prominence is made to track *evidential weight* (amount of documentation) rather than causal contribution, does the case collapse into a plain disagreement about the evidence?

  **Answer:** No. The case does not collapse.

  In this scenario, the archive contains 100 documents regarding The Rally and only 2 regarding The Dinner.
  *   If H2 weights by **Evidential Weight**, she devotes more space to The Rally (100 docs vs 2 docs).
  *   If H1 weights by **Causal Contribution**, she devotes more space to The Dinner (despite only 2 docs).

  They do not disagree about the *evidence* (both admit there are 100 Rally docs and 2 Dinner docs). They disagree about the **principle of narrative allocation**.
  *   H1 argues: "Space should reflect *importance* (causal power)."
  *   H2 argues: "Space should reflect *reconstructability* (evidential density) or *experience*."

  If prominence tracked evidential weight strictly, H2 would be the "Archivalist" and H1 would be the "Speculator" (for inferring the importance of the scant Dinner evidence). But since both agree on the *truth* of the Dinner's causality, the disagreement remains structural. It is a disagreement about what history is *for*: is it a forensic reconstruction of causes (H1), or a thick description of a lived moment (H2)? Whiggishness, under your rule, identifies the forensic approach when it organizes narrative space by present-day utility.

  ### The Defense: How H1 Pushes Back

  A defender of H1 (The Whiggish Historian) will not admit to the charge of distortion. Her reply will be:

  > "You call my weighting 'Whiggish' as if it were a bias. I call it **explanatory fidelity**.
  >
  > If I give The Rally 10 pages and The Dinner 2 pages, I am technically telling the truth about the documents, but I am lying about the *world*. I am teaching the reader that public protest drives change, because I have given the protest the narrative weight of a cause.
  >
  > You say my weighting is 'monotone with contribution to the outcome.' Of course it is. That is what explanation *is*. To give space to a non-cause is to distract the reader from the mechanism of history. The evidence *forces* my weighting because the evidence of causation is the only evidence that matters for understanding why we are here. To do otherwise is not 'context,' it is decoration."

  **The Collapse Point:**
  H1's defense relies on conflating **Ontological Weight** (how much this event actually did) with **Narrative Weight** (how much space I give it). She argues that the Prominence Rule isn't a bias, but a requirement of truthful explanation. If you accept her premise—that history's primary job is to explain the present causal chain—then her "Whiggish" weighting ceases to be a slur and becomes a methodological necessity. The charge of Whiggishness only sticks if you reject the premise that the "outcome we now care about" is the legitimate organizing principle of the past.
