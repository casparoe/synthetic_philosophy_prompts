answer: |-
  # Desiderata for a Theory of Cognitive Extension

  To count as a theory of the *extended mind* rather than a description of tool use, a proposal must satisfy specific conditions. These desiderata ensure the theory captures genuine cognitive integration without collapsing into triviality or internalism. Below are the core requirements, the cases that motivate them, and the distinctions they must preserve.

  ### 1. The Functional Isomorphism Requirement
  **Motivation:** The Otto Notebook Case.
  Otto, who has Alzheimer's, keeps a notebook to store addresses he cannot retain biologically. When he needs an address, he consults the notebook just as Inga (a neurotypical agent) consults her biological memory.
  **Requirement:** If an external process plays a role functionally isomorphic to an internal cognitive process, the theory must classify the external resource as part of the cognitive vehicle, not merely as an input source.
  **Verdict:** The notebook counts as part of Otto's memory system.
  **Distinction Preserved:** **Causal Influence vs. Constitutive Part.** The notebook is not just causing a belief; it is constituting the storage of that belief.

  ### 2. The Non-Bloat (Constitution) Requirement
  **Motivation:** The Cognitive Bloat Objection.
  If every causal dependency counted as cognitive extension, the mind would extend to the pencil, the desk, the library, and the internet servers indiscriminately, annexing the world wholesale.
  **Requirement:** The theory must provide a non-arbitrary criterion for where the cognitive system stops. It must explain why the notebook is *in* the loop while the librarian who shelved the book is *out* of the loop.
  **Verdict:** Ordinary reliance on a search engine counts as extension only if specific integration criteria (trust, accessibility) are met; mere availability does not suffice.
  **Distinction Preserved:** **Coupled vs. Merely Used.** A resource one is coupled with (integrated into the feedback loop) differs from one merely used (accessed occasionally).

  ### 3. The Endorsement and Reliability Requirement
  **Motivation:** The Search Engine and Phone Autocomplete Cases.
  We rely on Google and predictive text constantly. However, we do not endorse every search result or suggestion blindly.
  **Requirement:** The theory must distinguish between resources that are reliably accessed and automatically endorsed (treated as true/accurate by default) and those that are deliberately consulted and checked. Extension requires a disposition of trust.
  **Verdict:** A worn or implanted device (e.g., a cochlear implant or neural lace) counts as extension because it is reliably integrated and endorsed. A search engine counts only when the user treats the output as authoritative without second-guessing.
  **Distinction Preserved:** **Reliable/Automatically Endorsed vs. Deliberately Checked.**

  ### 4. The Personal-Level Agency Requirement
  **Motivation:** Transactive Memory (Two people remembering together).
  A couple remembers a shared episode by cueing one another ("You remember the restaurant, I remember the date"). This is a social cognitive system.
  **Requirement:** The theory must account for extension without dissolving the agent. The cognitive process must remain attributable to a person or a unified dyadic system, not merely to subpersonal mechanisms.
  **Verdict:** Two people remembering a shared episode count as a distributed cognitive system, provided there is mutual awareness and coordination.
  **Distinction Preserved:** **Personal vs. Subpersonal Level.** Extension applies to the agent's cognitive states (beliefs, memories), not just neural firing patterns.

  ### 5. The Biological Consistency Requirement
  **Motivation:** Clinical and Developmental Facts.
  Patients with aphasia or amnesia often rehabilitate using external props. Children learn to count using fingers before internalizing arithmetic.
  **Requirement:** The theory must remain consistent with the fact that ordinary cognition is realized in neural processes. Extension does not deny neural realization; it claims the *vehicle* of cognition can include non-neural elements.
  **Verdict:** Someone rotating a shape on a screen (Tetris) counts as extending their spatial reasoning, even though the neural correlates of vision and motor control are active. The external rotation *complements* the neural process.
  **Result Consistent With:** Ordinary cognition is realized in neural processes; extension adds to, rather than replaces, this substrate.

  ---

  ### Evaluation of Proposed Constraints

  You proposed three additional constraints. Here is their evaluation and integration into the desiderata above.

  **1. Diachronicity (The resource must make sense as present, absent, and swapped).**
  *   **Verdict:** **Genuine Desideratum.**
  *   **Reasoning:** A synchronic snapshot fails the Otto case. If Otto leaves his notebook at home, his mind does not shrink in that moment; he retains the *disposition* to use it. A theory that requires physical contact at the exact moment of retrieval fails to capture the dispositional nature of memory.
  *   **Integration:** Folded into **The Non-Bloat Requirement**. The criterion for inclusion must be dispositional (available and trusted over time), not merely occurrent.

  **2. Function Naming (Name the function and say if it could be internal).**
  *   **Verdict:** **Genuine Desideratum.**
  *   **Reasoning:** Without specifying the function (e.g., "storage," "calculation," "spatial rotation"), we cannot assess Isomorphism (Desideratum 1). Furthermore, if a function *could not* in principle be performed internally, it is not cognitive extension; it is environmental scaffolding for a non-cognitive task.
  *   **Integration:** Folded into **The Functional Isomorphism Requirement**. Parity requires that the external process perform a function recognizable as cognitive because it mirrors an internal capacity.

  **3. Degrees of Extension (A scale rather than all-or-nothing).**
  *   **Verdict:** **Genuine Desideratum.**
  *   **Reasoning:** A binary view (either fully extended or not at all) creates a "cliff-edge" problem. It cannot explain the difference between the Notebook (high integration) and the Search Engine (variable integration). Gradients allow the theory to handle the "Bloat" worry by admitting partial extension.
  *   **Integration:** Added as **Desideratum 6: The Gradient Requirement.** The theory must allow for cases to fall on a scale of integration, acknowledging that some tools are more deeply incorporated than others.

  ---

  ### Adjudication of Stuck Cases

  Applying the finalized list of six desiderata (Isomorphism, Non-Bloat, Endorsement, Agency, Biological Consistency, Gradient):

  **Case 1: Offloading Arithmetic to a Calculator (for sums doable in head)**
  *   **Analysis:** This satisfies **Isomorphism** (calculation is calculation) and **Agency** (the user intends the result). However, it tests **Endorsement**. If the user *could* do it internally but chooses not to, is the calculator constitutive or just a convenience?
  *   **Verdict:** **Extended Cognition (High on Gradient).** Because the user treats the calculator's output as authoritative (Endorsement) and uses it to perform a cognitive function (Function Naming), it counts as extension. The fact that internal calculation is *possible* is irrelevant to the Parity Principle; what matters is what is *actually* used as the vehicle.
  *   **Nuance:** It falls lower on the **Gradient** than the Notebook case if the reliance is sporadic rather than constant.

  **Case 2: Phone Autocomplete (Suggestions accepted without checking)**
  *   **Analysis:** This satisfies **Endorsement** (accepted without checking) and **Biological Consistency** (aids language production). However, it risks violating **Non-Bloat**. If every autocomplete is a belief, the phone dictates the mind.
  *   **Verdict:** **Extended Cognition (Low/Mid on Gradient).** Because the user accepts the suggestion without critical checking, the phone is functioning as a generative part of the linguistic process. However, because the user often lacks awareness of the specific algorithmic selection, **Agency** is compromised. It counts as extension of *production*, but perhaps not of *belief* unless the user retrospectively endorses the message.

  ---

  ### Tensions and Trade-offs

  The most critical finding for your paper is that these desiderata are not jointly satisfiable in all instances. There is a fundamental tension inherent in the project.

  **The Unsatisfiable Subset: Functional Isomorphism + Non-Bloat + Gradient**
  You cannot fully satisfy strict Functional Isomorphism (Parity) and strict Non-Bloat simultaneously without invoking the Gradient.
  *   If you demand strict **Isomorphism** (if it acts like memory, it *is* memory), you inevitably invite **Bloat**. (e.g., If the notebook is memory, why not the library?)
  *   If you demand strict **Non-Bloat** (only internal processes count), you violate **Isomorphism** (Otto and Inga are treated differently despite functional similarity).
  *   **Resolution:** The **Gradient Requirement** is the only way to mediate this, but it comes at a cost: it sacrifices ontological clarity. By admitting degrees, you admit there is no sharp boundary where the mind *ends*.

  **The Single Most Exclusionary Requirement:**
  **The Constitution Requirement (Non-Bloat).**
  This requirement excludes the most otherwise plausible theories. Many "extended" theories are actually just causal coupling theories in disguise. They fail to explain *why* the coupling constitutes the mind rather than just influencing it. Any theory that cannot draw a line between "using a tool" and "being a tool-user system" fails this desideratum. It is the hardest hurdle because drawing that line without begging the question against internalism is notoriously difficult.

  ---

  ### Closing Scorecard

  How do the major camps fare against these six desiderata?

  | View | Functional Isomorphism | Non-Bloat | Endorsement/Trust | Agency | Biological Consistency | Gradient |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Parity Principle** (Clark & Chalmers) | **Pass** (Core strength) | **Fail** (Prone to Bloat) | **Pass** (Trust & Glue) | **Pass** | **Pass** | **Fail** (Binary view) |
  | **Complementarity** (Menary, Sutton) | **Fail** (Rejects Isomorphism) | **Pass** (Focus on integration) | **Pass** (Emphasis on practice) | **Pass** | **Pass** | **Pass** (Nuanced) |
  | **Integrationist** (Recent Hybrid views) | **Pass** (Modified) | **Pass** (Via constraints) | **Pass** | **Pass** | **Pass** | **Pass** (Core strength) |

  *   **Parity Principle:** Best at capturing the intuition of the Notebook case, but struggles to stop the slide into Cognitive Bloat without arbitrary stop-gaps.
  *   **Complementarity:** Best at preserving the distinction between internal and external processes (avoiding Bloat), but risks conceding too much to internalism by denying Isomorphism.
  *   **Integrationist:** Best at handling the Gradient and Stuck Cases (Calculator/Phone), but requires a complex machinery to define "integration" that satisfies the Constitution requirement.

  **Recommendation:** For your paper, prioritize the **Constitution Requirement** as the primary filter. It is the bottleneck. If a proposal cannot distinguish constitution from causation, it fails to be a theory of *extension* and remains a theory of *influence*. Use the **Gradient** to resolve the tension between Parity and Bloat, acknowledging that "mind" may be a vague predicate in extended contexts.
