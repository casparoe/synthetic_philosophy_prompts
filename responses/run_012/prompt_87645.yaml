answer: |-
  This is a classic philosophical stall, and your intuition is sharp: you are not disagreeing about the *mechanics* of history, but about the *implications* of those mechanics. You agree on the workflow (sources → selection → narrative), but you disagree on what that workflow *permits* us to claim about the result.

  Here is the diagnosis of the stall, broken down by the specific friction points you identified, followed by what actual progress would look like.

  ### 1. The Polysemy of "Objective" (Norm vs. Metaphysics)
  You hit the nail on the head: "Objective" is doing two different jobs.

  *   **For your friend (The Rankean):** "Objective" is a **disciplinary norm**. It is an ethical commitment to *fidelity*. When she says history can be objective, she means: "I can bracket my personal desires enough to let the evidence constrain my conclusions. I will not lie, I will not cherry-pick to fit a ideology, and I will submit my work to peers who will check my sources." For her, objectivity is a *practice*, not a state of being. It is the opposite of *bias*.
  *   **For you (The Carr/White):** "Objective" is an **epistemic status**. It is a metaphysical claim about *correspondence*. When you say history cannot be objective, you mean: "There is no 'view from nowhere.' The narrative structure (tragedy, comedy, romance) is imposed by the historian, not found in the dust of the archive." For you, objectivity is the opposite of *construction*.

  **The Stall:** You are talking past each other because she is defending her **integrity**, and you are attacking her **omnipotence**. She hears you saying, "You are lying or biased," so she doubles down on her methods. You hear her saying, "I have accessed the past as it truly is," so you double down on the impossibility of that access. You are both right, but you are using the same word to guard against different fears: she fears relativism (if nothing is objective, anything goes); you fear naivety (if you claim objectivity, you hide your power).

  ### 2. The Hidden Claim: Constraint vs. Underdetermination
  You asked if the real work is being done by a hidden claim about underdetermination. **Yes.** This is the engine of the argument.

  You both agree that selection is necessary. The disagreement is about how tightly the evidence *leashes* the selection.

  *   **Her Hidden Claim:** The evidence provides **sufficient constraint**. While the archive doesn't contain a story, it contains *boundaries*. If the documents say the economy collapsed, you cannot narrate it as a boom. The "story" emerges from the causal links that the evidence forces upon you. Selection is guided by *relevance*, and relevance is determined by the events, not the historian.
  *   **Your Hidden Claim:** The evidence provides **necessary but insufficient constraint**. The facts limit what you *can't* say, but they do not determine what you *must* say. You can tell the story of the French Revolution as the "Birth of Liberty" or the "Descent into Terror" using the exact same set of documents. The choice between those two stories is value-laden, not evidence-driven.

  **The Stall:** She thinks that if you follow the evidence, the narrative reveals itself. You think that if you follow the evidence, you still have to *choose* a genre. She sees the narrative as a **discovery**; you see it as a **decision**.

  ### 3. Bedrock: What Does "Getting It Right" Look Like?
  This is the deepest layer. You do not share a picture of verification.

  *   **Her Picture:** Getting it right means **Correspondence**. A historical account is "true" if it matches the sequence of events as they occurred. The past is a fixed target; the historian is an archer.
  *   **Your Picture:** Getting it right means **Coherence/Warrant**. A historical account is "valid" if it acknowledges its own construction, makes sense of the available data, and serves a communicative purpose. The past is a Rorschach blot; the historian is the interpreter.

  Because you don't agree on what a "hit" looks like, you can't agree on whether the target has been struck.

  ### A Concrete Case: The Russian Revolution
  Let's apply this to see the stall in action.
  *   **Facts:** 1917, Tsar abdicates, Bolsheviks seize power, Civil War, Red Terror, Famine.
  *   **Friend's Narrative (Tragedy of Order):** She selects facts showing the collapse of state infrastructure, the chaos of the civil war, and the brutality of the Terror. She argues the evidence *forces* a narrative of "state collapse leading to authoritarianism." To her, calling it "liberation" would be *objective falsehood* because it ignores the causal weight of the violence.
  *   **Your Narrative (Comedy of Emancipation):** You select facts showing serfdom ending, workers' councils forming, and literacy campaigns. You argue the evidence *allows* a narrative of "class emancipation." To you, calling it purely "authoritarianism" is a *value-laden selection* that privileges order over justice.

  **The Diagnosis:** Your friend says your story is "unobjective" because it downplays the Terror (violating the norm of fidelity). You say her story is "unobjective" because it treats "order" as a neutral good rather than a value choice (violating the norm of transparency). You agree on the facts (Terror happened, Literacy happened); you disagree on which fact is the *plot point* and which is the *background noise*.

  ### What Counts as Progress?
  You will not resolve this by finding more sources. You will not resolve it by reading more theory. You are at a linguistic and conceptual impasse. Progress requires a **semantic truce** and a **reframing of the goal**.

  **1. Ban the word "Objective."**
  It is too contaminated. It conflates "honest" with "god-like."
  *   Ask your friend to replace "objective" with **"warranted by evidence."**
  *   Ask yourself to replace "constructed" with **"emplotted."**

  **2. Shift from "Truth" to "Fitness."**
  Stop asking "Is this history objective?" (Metaphysical).
  Start asking "Is this narrative **warranted** by the sources, and is its **emplotment** useful for understanding?" (Pragmatic).

  **3. The Diagnosis to Share with Her:**
  Tell her this: *"We agree that we can't lie about the sources. Where we actually disagree is whether the sources dictate the genre. You think the evidence tells us whether 1917 was a tragedy or a comedy. I think the evidence gives us the lines, but we have to choose the genre. If you admit that choosing the genre is a value judgment, and I admit that the lines constrain which genres are possible, we stop fighting."*

  **4. The Honest Impasse:**
  If she refuses to admit that genre selection is a value judgment (insisting the "story" is in the stones), then you have reached bedrock. She is a realist; you are a constructivist. In that case, the progress is recognizing that you are practicing **different disciplines** under the same name. She is doing *forensic reconstruction*; you are doing *cultural interpretation*. Both are valid, but they have different success conditions.

  **Summary:** The stall is caused because she is defending the **possibility of truth** (against nihilism) and you are defending the **presence of the author** (against positivism). You can both be true. History is *constrained construction*. If you can both sign off on that phrase, the argument ends. If not, you're just shouting across different ontological divides.
