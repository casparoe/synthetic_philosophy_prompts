answer: |-
  **Exam Question**

  Standard taxonomies distinguish guilt and shame by object (act vs. agent) and orientation (internal standard vs. external gaze). Rejecting these simplifications, argue whether guilt and shame differ in their core evaluative content. Specifically, address whether shame can target a single act without generalizing to the self, and whether guilt can target the self as such. Furthermore, assess the coherence of the claim that a culture can 'select' one emotion over the other: does such selection presuppose a voluntarism about affect, or a revision of fittingness conditions?

  ***

  **Model Answer**

  The familiar act/agent distinction is phenomenologically unstable. One can feel profound shame over a specific, uncharacteristic slip (a stumble at a podium) without believing one is essentially a clumsy person; conversely, one can feel guilt that permeates the self ("I am a murderer") based on a single act. Therefore, the distinction cannot rest merely on the *object* of the emotion, but must rest on the *evaluative content*—what the emotion asserts about the object.

  Shame and guilt differ because they evaluate different properties of the situation. Guilt evaluates the self as the *cause of unjustified harm*. Its core content is relational debt. Even when guilt feels like it targets the self, it does so only insofar as the self is identified with the causal power that inflicted harm. Guilt cannot take the self *as such* (independent of agency); one cannot feel guilt for merely existing, only for existing *as a harm-doer*. Shame, however, evaluates the self's *standing* or *worth* within a hierarchy or community. When shame targets a single act, it does so because the act is interpreted as *revealing* a deficit in standing. The act is not the ultimate object; the diminished status is. Thus, shame can target an act, but only by treating the act as evidence of low standing. Guilt targets an act as a source of damage.

  This distinction in evaluative content dictates the limits of cultural selection. The claim that a culture can "choose" shame over guilt is incoherent if it implies selecting the affective state itself. Emotions are not voluntary choices; they are responses to perceived evaluative properties. A culture cannot legislate that its citizens feel the phenomenology of shame when they perceive unjustified harm, because the fittingness conditions of shame (status loss) do not match the perception (harm). If the biology of affect is tied to these evaluative appraisals, a culture cannot swap the emotions any more than it can swap pain for itch.

  However, the claim becomes coherent if we understand "selection" as the regulation of *fittingness conditions*. A culture does not select what is *felt*, but what is deemed *fitting to feel*. A so-called "shame culture" is not one where guilt is impossible, but one where social norms map violations primarily onto status loss rather than interpersonal debt. For example, if a transgression is publicly framed as bringing dishonor to a family rather than injuring a victim, the culture has manipulated the evaluative context to make shame the fitting response. The emotion follows the evaluation.

  Therefore, the anthropological gloss requires revision. It is not that cultures orient to different audiences (internal vs. external); both emotions require an audience (real or imagined) to validate the evaluation. The difference is what the audience validates: the reality of harm (guilt) or the reality of status (shame). Cultural selection is thus a normative project, not a psychological one. It involves curating the social world so that certain acts reliably trigger evaluations of status diminishment rather than causal harm.

  In conclusion, guilt and shame differ in evaluative content: debt versus standing. Shame can target an act by reading it as status-revealing; guilt targets the self only as a causal agent. Consequently, cultures cannot select emotions directly, as affect is constrained by evaluative perception. They select, instead, the normative mappings that determine which emotion is fitting. To argue otherwise is to confuse the trigger with the response, assuming a voluntarism about affect that ignores the cognitive structure of moral emotion. The "choice" is not in the feeling, but in the world that makes the feeling appropriate.

  ***

  **Marking Scheme (Total 20 Marks)**

  | Move | Description | Marks | Typical Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Destabilizes the Act/Agent Distinction:** Explicitly argues that the standard object-based distinction fails (e.g., shame can be about acts; guilt can engulf the self). | 4 | Accepts the act/agent distinction as definitionally true without critique. |
  | **2** | **Defines Alternative Evaluative Content:** Identifies a deeper structural difference (e.g., Standing/Worth vs. Harm/Debt/Causality) rather than audience location. | 4 | Reverts to the "internal vs. external gaze" anthropological gloss. |
  | **3** | **Constraints on Cultural Selection:** Argues that cultures cannot directly select affective phenomenology due to the involuntary nature of emotion. | 4 | Assumes cultures can simply teach people to feel different emotions at will. |
  | **4** | **Fittingness vs. Feeling:** Distinguishes between the emotion felt and the normative conditions that make the emotion fitting (the "selection" is of mappings, not feelings). | 4 | Conflates the social trigger with the emotional response itself. |
  | **5** | **Synthesis/Position:** Concludes with a definite stance on whether the cultural claim is coherent based on the preceding metaphysical analysis. | 4 | Hedges or ends with a "both sides have merit" survey conclusion. |
