answer: |-
  This is a fantastic puzzle. You've essentially handed me a dataset of metaontological verdicts and asked me to reverse-engineer the underlying principle. This is exactly the kind of "metametaphysics" work that keeps philosophers of language up at night. The fact that your advisor is a deflationist about ontology (tables) but a realist about normativity (free will, persons) is the key constraint here.

  Let's think out loud. I need to construct candidate rules that fit her "Verbal" pile and her "Substantive" pile, see where they diverge, and then apply them to your *Nix v. Hedden* (the tomato tariff) case.

  ### Step 1: Brainstorming the Candidate Rules

  Looking at her verdicts, I see three strong contenders for the "rule" she is running.

  **Rule 1: The Carnapian Fact-Rule (Descriptive Equivalence)**
  *   **The Principle:** A dispute is merely verbal if and only if the parties agree on all the non-linguistic facts (physics, biology, arrangement of matter) and disagree only on the application of a label.
  *   **Fit:** This fits *Tomato/Fruit*, *Pluto/Planet*, *Virus/Alive*, *Hot Dog/Sandwich*, and *Composite Objects* perfectly. In all these cases, everyone agrees on the physical state of the world; they just argue over which bucket to put it in.
  *   **Tension:** It struggles with *Fetus/Person*. Biologically, everyone agrees on the facts of a fetus. If this rule were the only one, she should call it verbal. But she calls it substantive. This suggests Rule 1 is necessary but not sufficient, or it's wrong about the "Substantive" cases.

  **Rule 2: The Pragmatic Stakes-Rule (Normative Consequence)**
  *   **The Principle:** A dispute is substantive if and only if rights, duties, money, or lives hang in the balance. If it's purely taxonomic with no practical consequence, it's verbal.
  *   **Fit:** This explains why *Fetus/Person*, *Free Will*, and *Corporate Responsibility* are substantive (moral status, punishment, liability). It explains why *Hot Dog* and *Pluto* are verbal (who cares?).
  *   **Tension:** It struggles with *Tomato/Fruit*. In the abstract, it's verbal. But in your law case (*Nix v. Hedden*), money *did* hang on it. If she calls the abstract question "verbal," she might be ignoring stakes. But if she respects stakes, the tariff case should be substantive. Also, *Composite Objects* has no stakes, so it fits.

  **Rule 3: The Normative Concept-Rule (Agency & Status)**
  *   **The Principle:** A dispute is substantive if the term in question picks out a *normative status* or *capacity for agency* (Person, Will, Responsibility). It is verbal if the term picks out a *descriptive classification* or *ontological category* (Fruit, Planet, Table, Sandwich).
  *   **Fit:** This cleanly separates her two piles.
      *   *Verbal Pile:* All descriptive/taxonomic/ontological (Fruit, Planet, Alive, Sandwich, Table).
      *   *Substantive Pile:* All normative/agentive (Person, Will, Responsibility).
  *   **Tension:** It requires us to believe she sees "existence" (tables) as purely descriptive/deflationary, but "personhood" as robustly normative. This fits her "deflationary ontology" profile perfectly.

  ### Step 2: Applying the Rules to the Tomato Tariff Case (*Nix v. Hedden*)

  Now, let's apply these to the case you need to write about. The case turned on whether a tomato is a "vegetable" under the Tariff Act of 1883. Botanically, it's a fruit; culinarily/legally, it's a vegetable.

  *   **Rule 1 (Facts) Predicts:** **Merely Verbal.**
      *   *Reasoning:* Everyone agreed on the biology. The dispute was purely about the definition of the word "vegetable" in the statute.
  *   **Rule 2 (Stakes) Predicts:** **Substantive.**
      *   *Reasoning:* Real money (taxes) hung on the classification. The court *had* to pick a side to resolve a material conflict.
  *   **Rule 3 (Normative Concept) Predicts:** **Merely Verbal.**
      *   *Reasoning:* "Vegetable" is a descriptive/culinary category, not a moral status. Even though money is involved, the *concept* itself doesn't entail rights or agency. The money is an external overlay, not internal to the concept of "vegetable."

  **My Bet on Her Verdict:**
  I am 90% confident she will classify the Tomato Tariff dispute as **Merely Verbal** (conceptually), perhaps noting that the *legal resolution* was a pragmatic stipulation.

  *Why?* Because she already classified "Is a tomato a fruit?" as merely verbal. The Tariff Act just adds a financial stake to that same classification question. If she were a Stakes-Theorist (Rule 2), she likely would have flagged "Tomato/Fruit" as substantive in seminar *given* that the tariff case exists, or she would distinguish the "philosophical" question from the "legal" one. But given her deflationary ontology (tables are verbal), she likely views legal categories like "vegetable" as linguistic frameworks we impose on the world, not deep facts. The money makes it *urgent*, but not *metaphysically substantive*.

  ### Step 3: The Crucial Experiment

  You asked for the single further dispute you should ask her about to distinguish these rules. This is the most important part. We need a case where Rule 2 (Stakes) and Rule 3 (Normative Concept) come apart, because Rule 1 (Facts) is already weakened by the "Fetus" verdict.

  We need a dispute that has **High Stakes** (like the Tariff or Fetus) but involves a **Descriptive/Non-Agentive Concept** (like Tomato or Table).

  **The Dispute to Ask About:**
  > **"Is a River a 'Person' for the purpose of legal standing?"**
  > *(Reference: Recent 'Rights of Nature' litigation, e.g., the Whanganui River in New Zealand or the Ganges in India.)*

  **Here is exactly where the rules carve this up:**

  1.  **Rule 2 (The Stakes Rule) says: SUBSTANTIVE.**
      *   *Why:* Real legal consequences hang on this. If the river is a person, it can sue, it can be harmed, polluters can be liable. There are material and normative stakes (environmental protection, fines).
      *   *Prediction:* If she follows the "Fetus" logic (Stakes = Substantive), she must call this substantive.

  2.  **Rule 3 (The Normative Concept Rule) says: MERELY VERBAL.**
      *   *Why:* A river lacks agency, consciousness, or moral capacity. Calling it a "person" is a legal fiction, a linguistic framework we impose (like calling a table an "object" or a tomato a "vegetable"). It is ontologically deflationary.
      *   *Prediction:* If she follows the "Table" logic (Ontology = Verbal) and distinguishes it from "Fetus" (Moral Agent = Substantive), she must call this verbal.

  3.  **Rule 1 (The Fact Rule) says: MERELY VERBAL.**
      *   *Why:* Everyone agrees on the physics of the water.

  **Why this is the perfect test:**
  *   If she says **Substantive**, she is prioritizing **Pragmatic Stakes (Rule 2)**. This implies the Tomato Tariff case was *also* substantive in a way she might not have emphasized in seminar, or that "Person" is a special magic word that triggers substantiveness regardless of agency.
  *   If she says **Verbal**, she is prioritizing **Normative Capacity (Rule 3)**. This confirms she distinguishes between *moral* persons (fetuses, agents) and *legal* persons (rivers, corporations—wait, she said Corp Responsibility is substantive...).

  *Hold on, a complication:* She said **Corporate Moral Responsibility** is substantive. Corporations are also legal fictions without biological agency.
  *   *If she says River Personhood is Substantive:* She treats *all* legal personhood as substantive (Stakes Rule).
  *   *If she says River Personhood is Verbal:* She distinguishes between *Functional Agents* (Corporations act through humans) and *Passive Objects* (Rivers).

  *Refined Crucial Question:* To be even sharper, ask about **"AI Authorship."**
  > **"Is an AI an 'Author' for copyright purposes?"**

  *   **Rule 2 (Stakes):** Substantive (Money, Rights).
  *   **Rule 3 (Agency):** Verbal (AI has no moral agency, 'author' is just a label).
  *   **Rule 1 (Facts):** Verbal (Code is code).

  *Actually, stick with the River.* It's closer to the "Person" debate she already weighed in on. The Corporation verdict is the only outlier for Rule 3, so the River tests whether "Corporation" was substantive because of *Human Agency behind it* vs. *Legal Stakes*.

  **Final Recommendation for the "Crucial Experiment":**
  Ask her: **"Is a river a 'person' for legal standing?"**

  *   **If she says Verbal:** Her rule is **Normative Capacity (Rule 3)**. She thinks disputes are only substantive when *moral agency* is involved. Stakes (money/taxes) don't make it substantive. This means your Tomato Tariff paper should argue the dispute is verbal, resolved by pragmatic stipulation.
  *   **If she says Substantive:** Her rule is **Pragmatic Stakes (Rule 2)**. She thinks *any* dispute with real-world consequences is substantive. This means your Tomato Tariff paper should argue the dispute is substantive *because* of the tariff, even if the biology is settled.

  **Summary for your paper:**
  I would write the paper assuming she follows **Rule 3 (Normative Capacity)**. The "Composite Objects" verdict is the strongest signal of her metaontological deflationism. She likely views the Tomato Tariff as a **merely verbal dispute that required a pragmatic legal stipulation.** The court didn't discover a fact; they picked a linguistic framework to serve a social goal. That fits her "Tables are verbal" view perfectly.

  Good luck. This is a sharp observation on your part; most students wouldn't notice the pattern in her verdicts.
