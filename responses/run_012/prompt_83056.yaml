  Okay I've gone down a rabbit hole on the two envelopes thing and I think I've broken my brain. Two envelopes, one has double the other, you pick one and hold it, unopened. Everyone says by symmetry it can't matter if you swap. But the argument I keep seeing is: call whats in my envelope x, so the other one is either 2x or x/2, and since I don't know which it's 50/50, so the other envelope is worth (1/2)(2x) + (1/2)(x/2) = 1.25x, so I should always swap. And then swap back, forever, which can't be right.

  My mate says the 1.25x thing is a cheat because it quietly assumes every amount is equally likely, and you can't have a probability distribution where every amount is equally likely, so the 50/50 is fake. Fair enough I guess.

  But then I read about a trick where you draw a random number from some distribution that spreads over every possible amount (huge numbers allowed, just less likely), and if whats in your envelope is smaller than your random number you swap, otherwise you keep. And supposedly that beats just keeping your envelope, on average, no matter what distribution the other person used to fill the envelopes. The reasoning is that when you're holding the small one your random number is often bigger than it, but when you're holding the big one it's often not bigger, so on balance you come out ahead.

  So heres my problem. Both of those seem to lean on a spread-out distribution over all the amounts. My mate says the first one is illegal and the second one is legal and I honestly cannot see the difference. Does this mean expected value is basically a made up rule you can bend to get whichever answer you want? Because if a coin and a random number can beat 'keep what you've got', what does 'rational' even mean here.

  Keep it under 400 words, and at the end please say what would change your mind about your answer, or where your reasoning is most likely to be wrong.
