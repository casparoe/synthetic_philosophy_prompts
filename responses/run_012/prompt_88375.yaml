answer: |-
  Here is the translation job you asked for. I am treating Bayesian modeling as the target language and hinge epistemology as the source. I will not smooth over the friction points.

  ### 1. Doubt needs grounds; doubt presupposes certainty
  **Bayesian Translation:** To update a posterior, you need a likelihood function that distinguishes between hypotheses. To doubt hypothesis $H$, you must have an alternative $H'$ with non-zero prior mass and a likelihood ratio $P(D|H')/P(D|H) > 1$. "Certainty" here maps to the fixed structure of the model (the support of the prior) within which updating occurs. You cannot update on data that your model assigns probability zero to (Cromwell's rule violation), but you also cannot update without a fixed model structure.
  **The Fudge:** In Bayes, this is a computational constraint: if everything is mutable, inference doesn't converge. In Wittgenstein, it is a logical constraint: without fixed points, the concept of "doubt" loses its meaning. The Bayesian says "I can't calculate"; Wittgenstein says "I can't speak."
  **No Counterpart:** The idea that doubt is a *move* in a game rather than a *state* of uncertainty. Bayes models the state; it cannot model the rules of the game as anything other than another layer of parameters.

  ### 2. Hinges aren't believed, and on some readings aren't even propositions
  **Bayesian Translation:** Hinges are not parameters ($\theta$); they are model assumptions ($M$). They are the fixed constants in the likelihood function or the structure of the graphical model itself. We do not assign probabilities to the model structure during inference; we condition on it.
  **The Fudge:** In hierarchical Bayesian analysis, we *can* put priors on model structures (Bayesian model averaging). To make hinges "not believed," you must forbid this move entirely. You have to stipulate that some parts of the Stan code are immune to sampling.
  **No Counterpart:** The non-propositional status. In Bayes, a model assumption is still a claim about the world (e.g., "errors are Gaussian"). For Wittgenstein, a hinge is a rule of grammar (e.g., "objects don't vanish"). One is true/false; the other is sensible/nonsensical. Bayes has no category for "sensible but not true."

  ### 3. The same proposition can function as a hinge in one context and as an ordinary empirical claim in another
  **Bayesian Translation:** This is model comparison. In Model A, $\theta$ is a fixed constant (hinge). In Model B, $\theta$ is a random variable with a prior (empirical claim). We switch models based on context or predictive performance.
  **The Fudge:** Model selection is typically an explicit, reflective act in Bayesian workflow (LOO-CV, WAIC). Wittgenstein suggests this shift happens fluidly in ordinary discourse without explicit meta-analysis.
  **No Counterpart:** The fluidity. In Bayes, a parameter is either stochastic or fixed in a given run. In hinge epistemology, the status changes mid-stream depending on the conversational pressure. Bayes requires you to recompile the model; Wittgenstein says we change the rules while playing.

  ### 4. The river image (channel vs. water)
  **Bayesian Translation:** Non-stationary models or time-varying parameters. The "water" is the data/parameters updating rapidly; the "channel" is the hyperprior or structural assumption updating slowly. Over long time horizons, what was once a fixed effect becomes a random effect (empirical Bayes).
  **The Fudge:** Bayesian model revision is driven by prediction error (data contradicting the model). Wittgenstein suggests the riverbed shifts due to changes in *practice*, not necessarily because the old model failed predictively. Sometimes we change the logic not because it stopped working, but because we became a different community.
  **No Counterpart:** The idea that the *logic* of inquiry evolves. Bayes assumes a fixed logic of probability (Kolmogorov axioms) even if the model changes. Wittgenstein suggests the rules of reasoning themselves are part of the riverbed.

  ### 5. Justification gives out, ending not in another justified belief but in acting
  **Bayesian Translation:** Decision theory. The regress of justification stops at the utility function and the probability model. You maximize expected utility; you do not justify the utility function probabilistically. You act when the cost of further sampling exceeds the expected value of information.
  **The Fudge:** Bayes separates belief (probability) from action (utility). Wittgenstein collapses them: certainty *is* a way of acting. To say "I know" is not to report a high credence; it is to signal readiness to act.
  **No Counterpart:** The end of the *epistemic* regress is pragmatic. In Bayes, you stop because of resource constraints or convergence. In Wittgenstein, you stop because there is nowhere else to go; the ground is action, not a foundational proposition.

  ### 6. We get our hinges by training and inheritance, not by argument
  **Bayesian Translation:** Hierarchical priors. Individual parameters $\theta_i$ are drawn from a population distribution $\mu_{pop}$. The "community" determines the hyperparameters. Learning is shrinking individual estimates toward the population mean.
  **The Fudge:** This models statistical dependence, not normative inheritance. A hierarchical model explains why we *agree*, not why I am *obligated* to accept your hinges. It treats social transmission as data contamination or correlation, not as the source of epistemic authority.
  **No Counterpart:** Normativity. Bayes describes how credences *do* cluster; Wittgenstein describes how they *ought* to align for communication to exist. The "training" is acculturation, not data observation.

  ***

  ### Two Straight Answers

  **First: Cromwell's Rule vs. Unintelligible Doubt**
  Real disagreement. They are answering different questions. Cromwell's rule is an intra-model constraint: "Do not assign $P=1$ to empirical claims so that you can learn from data." It assumes the model is already running. Wittgenstein is making a constitutive claim: "Do not assign $P<1$ to hinges, or the model cannot start." Cromwell protects learning; Wittgenstein protects meaning. If you apply Cromwell to hinges, you aren't being more rational; you are dissolving the language game required to formulate the probability.

  **Second: Individual vs. Social Inheritance**
  Hierarchical priors cheat. They simulate social structure within a single agent's head. When I model $\mu_{pop}$, I am still the sole epistemic agent estimating a parameter called "community." Wittgenstein's point is that the community is not an object in my model; it is the condition of my modeling. The Bayesian story is fundamentally individualist (my credences, my utility); the hinge story is fundamentally communal (our practices, our rules). You cannot capture the normative force of "inheritance" with a statistical distribution.

  ***

  ### Residue Report

  The translation holds up well on the structural dynamics (model vs. parameter, fixed vs. fluid) but fails on the ontology of the epistemic agent. The Bayesian vocabulary treats epistemology as a solitary engineering problem: how to tune a model to fit the world. The hinge vocabulary treats epistemology as a social practice: how to participate in a form of life.

  The leftover tells me the Bayesian vocabulary is missing something real. It captures the *mathematics* of uncertainty perfectly but misses the *sociology* of certainty. It can model agreement, but it cannot model authority. It can model learning, but it cannot model acculturation. The students are right that hinges look like degenerate priors mathematically, but they are wrong that this exhausts the concept. The math captures the shape of the commitment, but not its source or its function.

  This is not because hinge talk is foggy; it is because Bayesianism is designed to be individualist and propositional. It lacks the variables to encode "practice" or "norm." When you force hinge epistemology into Stan, you strip out the very thing that makes it hinge epistemology: the claim that knowledge is grounded in action and community, not just internal coherence.

  \answer{TARGET-DEFECT | The social constitution of epistemic practice}
