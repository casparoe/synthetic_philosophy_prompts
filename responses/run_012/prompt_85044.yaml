answer: |-
  There is no single established term in sociology, psychology, or science studies that precisely captures this specific compound move.

  The closest existing concepts are **Mertonian "Communism"** (one of the CUDOS norms of science, stating that scientific knowledge is common property), but that refers to the *data and discoveries* themselves, not the *social credit* for making them. There are also **Modesty Norms** or **Self-Effacement**, but these typically describe how an individual presents themselves, not how a community actively reassigns credit for an individual in real-time. **Leveling Mechanisms** in anthropology come close, but as you noted, they usually imply a punitive or envious "cutting down," whereas your observation is of a sincere, protective, normative practice.

  Because the existing labels fail to capture the *sincerity*, the *mechanism* (reassignment rather than denial), and the *normative defense* (protecting the group ontology rather than punishing the individual), I will coin a term for it.

  I propose calling this: **The Attributional Commons.**

  ### The Definition
  **The Attributional Commons** is a social norm in which individual agency is treated as a negligible variable in success, and credit is treated as a common-pool resource belonging to the system (the lab, the institute, the field, the era).

  The "move" consists of two simultaneous actions:
  1.  **Affirmation:** Validating the outcome (the experiment worked, the paper is good).
  2.  **Dispersal:** Relocating the cause of the outcome from the *agent* (the person) to the *context* (the tools, the team, the luck, the timing).

  ### The Edges: What It Is and What It Is Not

  To give this term sharp edges, we must distinguish it from the concepts you rightly ruled out.

  **1. It is not Tall Poppy Syndrome or the Law of Jante.**
  *   **The Difference:** Tall Poppy and Jante are *punitive*. They operate on envy and social hierarchy; the goal is to lower the status of the successful person to maintain equality.
  *   **The Attributional Commons:** This is *ontological*. It operates on a belief system about how the world works (i.e., "No one succeeds alone"). The goal is not to lower the person, but to accurately describe the system. The person is not "cut down"; they are simply re-categorized as a node in a network rather than the source of the signal.

  **2. It is not Damning with Faint Praise.**
  *   **The Difference:** Faint praise is manipulative and insincere; it intends to diminish the achievement while pretending to praise it.
  *   **The Attributional Commons:** The praise is warm and sincere. The achievement is celebrated fully, provided the *locus of control* is corrected. If you say, "I did this," they correct you. If you say, "We did this," they cheer. The achievement itself is never diminished, only the individual's ownership of it.

  **3. It is not Imposter Syndrome.**
  *   **The Difference:** Imposter syndrome is an internal, pathological anxiety that one does not deserve their success.
  *   **The Attributional Commons:** This is an external, healthy social enforcement. It is not that the individual *feels* they don't deserve it; it is that the community *assigns* the credit elsewhere as a matter of fact. It protects the individual from the burden of singular responsibility as much as it protects the group from individual aggrandizement.

  **4. It is not Mertonian "Communism."**
  *   **The Difference:** Merton's norm dictates that *knowledge* must be published and shared.
  *   **The Attributional Commons:** This dictates that *agency* must be distributed. You can keep the Nobel Prize (the reward), but you cannot keep the story that you alone earned it (the narrative).

  ### Why This Norm Exists
  In experimental science, this norm serves a functional purpose beyond mere humility. It is a **risk-management strategy for reputation.**

  If success is attributed to individual genius, then failure must be attributed to individual incompetence. By attributing success to "the instrument," "the timing," or "the team," the community insures its members against the inevitable failures of experimentation. If the next experiment fails, it is not because *you* are a fraud; it is because "the instrument drifted" or "the timing was off."

  The Attributional Commons is a mutual defense pact. It sacrifices the glory of the individual to ensure the resilience of the collective. It is not resentment of success; it is a refusal to isolate the successful.

  ### Summary
  *   **Name:** The Attributional Commons.
  *   **The Move:** Sincere affirmation of the result + Reassignment of the cause from agent to system.
  *   **The Norm:** Achievements are systemic properties, not individual possessions.
  *   **The Distinction:** Unlike Tall Poppy (which punishes success), this norm protects the individual from the isolation of success, while protecting the group from the instability of hero-worship.
