answer: |-
  **MEMORANDUM**

  **TO:** Public Art and Commemoration Advisory Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 10, 2024
  **SUBJECT:** Recommendation Regarding the Rennick Statue (Fenmore Park Plaza)

  **EXECUTIVE SUMMARY**

  We are approaching the October 14 deadline to determine the status of the Augustus Rennick statue. We have three primary constraints: the integrity of public commemoration, the sentiments of the Fenmore neighborhood (specifically the workers' descendants), and fiscal responsibility.

  After reviewing the evidence and the options, my recommendation is as follows:

  1.  **Statue:** Do not reinstall in Fenmore Park. Do not destroy. Transfer to the City Museum for archival storage and contextual display. If the Museum declines, maintain in City Works storage with public access by appointment.
  2.  **Plaza Base:** Leave empty for 24 months. Launch a community-led design process for a new permanent artwork that reflects the neighborhood's labor history, not its ownership.
  3.  **Funding:** Reallocate the $40k capital budget originally designated for Rennick's reinstallation to fund the initial phase of the new community process. **Decline the Lassiter Foundation offer** due to the destruction clause.
  4.  **Timeline:** Vote to authorize storage transfer by October 14. Issue Request for Proposals (RFP) for new art by January 1, 2025.

  Below is the reasoning behind this decision, addressing the Chair's four specific questions, followed by the strongest case for the option I am not recommending.

  ***

  **ANALYSIS OF KEY QUESTIONS**

  **1. Plaque: Honoring vs. Recording**
  A statue on a pedestal is not a textbook entry; it is an honorific interface. In system design, if the frontend (the bronze figure) contradicts the backend data (the historical record), adding a tooltip (the plaque) does not fix the bug. It creates cognitive dissonance.
  *   **The Distinction:** Honoring implies emulation; recording implies documentation. A pedestal in a prime public square is an honorific slot. Keeping the statue there, even with a plaque detailing convict labor and strikebreaking, forces the public to navigate a contradiction every time they walk through the park. It asks the descendants of the struck workers to picnic in the shadow of the man who armed guards against their ancestors, with only a small text panel as mitigation. That is not recording; that is maintaining a broken system and labeling it "features, not bugs."

  **2. The Empty Base: "Doing Nothing"**
  Leaving the base empty is an active state, not a null value. It signals a gap in the narrative.
  *   **The Default:** There is no true default. The statue was removed for capital work. Reinstalling it requires a positive vote and $40k in expenditure. Therefore, *not* reinstalling is the fiscal baseline.
  *   **The Signal:** An empty pedestal with mounting bolts visible is honest. It acknowledges that a previous version of the city's values occupied this space and has been retired. It invites the public to ask "What goes here?" rather than telling them "This is settled."

  **3. Evidence Standard: Confidence Levels**
  The argument that we need "beyond a reasonable doubt" (criminal standard) to remove a monument is the wrong metric for public administration. We operate on a "preponderance of evidence" (civil standard) and risk management.
  *   **The Risk:** We have a ledger page and a contemporary interview linking the fortune to convict labor, plus undisputed armed strikebreaking. Even if the ledger is the only physical proof, the reputational risk to the city is high. If we reinstall and definitive proof emerges later, the cost of moving it *again* is double the political and financial capital.
  *   **The Burden:** The burden of proof for *keeping* a public honor should be higher than for removing it. Honors are privileges granted by the public, not property rights held by the subject. If the integrity of the honor is compromised, the default is to suspend the honor until clarity is reached.

  **4. The Lassiter Offer: Conditional Funding**
  We cannot accept the $250k with the destruction clause.
  *   **Dependency Injection:** Accepting funds that mandate the destruction of public property creates a dangerous dependency. It sets a precedent that private wealth can dictate the terms of public memory.
  *   **The "Warehouse" Argument:** The Lassiter Foundation argues that storing the statue is a decision to keep it. This is false. Storage is a decision to *preserve* it while removing its *honorific function*. We preserve many things in warehouses (old street signs, decommissioned vehicles) without endorsing them. Destruction, however, is irreversible data loss. We cannot audit history if we destroy the primary sources.

  ***

  **THE COUNTER-ARGUMENT (STEELMAN)**

  I anticipate three members will vote to **Reinstall the Statue with a Contextual Plaque.** I want to articulate why this is a strong, defensible position, even though I am voting against it.

  **The Case for Reinstallation + Plaque:**
  This option prioritizes **continuity and user attachment** over ethical purity. The "users" here are the Fenmore neighborhood residents and the Workers' Descendants Association. For eighty years, this statue has been the anchor of their Labor Day picnic. It is the only art in their neighborhood. To them, the statue does not represent Augustus Rennick the individual; it represents *their* community's endurance. They survived the strike, they survived the mine closures, and they kept the picnic going. The statue is a witness to their resilience, not just a tribute to his wealth.

  Furthermore, the historical evidence is incomplete. The 1931 fire destroyed the majority of the records. The ledger page is an inference. If we remove the statue based on incomplete data, we risk sanitizing history. A statue with a frank plaque admitting the convict labor and the strikebreaking turns the monument into a teaching tool. It forces the city to look at the full complexity of its industrial birth—both the philanthropy that built the hospital and the brutality that funded it. Removing the statue allows the city to "wash its hands" of the discomfort. Keeping it forces us to live with the contradiction.

  Finally, financially, this is the only option that utilizes the existing asset without new capital expenditure. It respects the original public subscription of 1911.

  **Why I Reject This:**
  While the "teaching tool" argument is intellectually sound, it fails the "street test." A plaque at eye level cannot compete with a bronze figure on a 10-foot pedestal. The visual hierarchy of the plaza will always prioritize the man over the text. For the descendants of the workers he suppressed, asking them to accept a plaque as sufficient acknowledgment places the burden of education on the victims. We have the opportunity to reset the plaza to honor the *workers* directly. We should take it.

  ***

  **CONCLUSION**

  We are managing public memory, which is a long-term system. We need to minimize technical debt (contradictory honors) and avoid vendor lock-in (Lassiter's conditions).

  My recommendation preserves the artifact (history), removes the honor (the pedestal), and opens the slot for a more representative narrative (community art). It costs the city $40k plus storage fees, but it buys us autonomy and integrity.

  I move we adopt this recommendation and authorize the transfer to storage effective October 15.

  **[Your Name]**
  Committee Member
