answer: |-
  Here is the specification for a theory of moral responsibility that handles moral luck without dissolving it, followed by the meta-analysis of those requirements and an institutional application.

  ### Part 1: The Spec (Desiderata)

  To count as *dealing* with moral luck rather than defining it away, a theory must satisfy the following five functional requirements.

  **1. The Agency Grounding Constraint (Control)**
  *   **Requirement:** Blameworthiness must be grounded in factors accessible to the agent's will or epistemic reach at the time of action.
  *   **Case:** *The Unknowable.* You cannot be blameworthy for a side effect that was physically impossible to predict given the state of science at the time.
  *   **Function:** Prevents responsibility from becoming strict liability for mere causation.

  **2. The Outcome Sensitivity Constraint (Luck)**
  *   **Requirement:** The theory must validate the intuition that agents causing worse outcomes warrant stronger reactive attitudes or sanctions, even when the difference is due to luck. It cannot dismiss this as a cognitive error or "bug" in human psychology.
  *   **Case:** *Identical Agents.* Driver A hits a child; Driver B does not. Both were equally negligent. The theory must explain why A is treated differently than B without claiming A is *intrinsically* more evil, while acknowledging the difference in treatment is legitimate.
  *   **Function:** Accommodates the actual practice of blame rather than prescribing an idealized one that no one follows.

  **3. The Enforcement Independence Constraint (Audit Luck)**
  *   **Requirement:** The theory must distinguish between *being responsible* (status) and *being held responsible* (sanction). It must explain why selective enforcement (audit luck) is unjust *procedurally* without negating the underlying culpability of those who escape detection.
  *   **Case:** *The Audit.* Employee A is caught embezzling; Employee B does the same but isn't audited. B is still culpable, even if not sanctioned.
  *   **Function:** Prevents the theory from collapsing responsibility into mere punishment.

  **4. The Description Stability Constraint (Redescription)**
  *   **Requirement:** Verdicts must track invariant facts about the agent's choice and risk imposition, not the linguistic frame or post-hoc categorization of the event.
  *   **Case:** *Redescription.* An event cannot flip from "accident" to "recklessness" solely because we change the label, if the physical facts of the decision remain fixed.
  *   **Function:** Ensures objective anchoring of responsibility against narrative manipulation.

  **5. The Taxonomic Separation Constraint (Distinctions)**
  *   **Requirement:** The theory must structurally separate:
      *   *Responsibility* (causal/volitional link) vs. *Blameworthiness* (normative violation).
      *   *Excuse* (violation occurred, but justified/mitigated) vs. *Exemption* (agent lacked capacity to be a moral participant).
      *   *Decision Quality* (process) vs. *Outcome Quality* (result).
  *   **Function:** Allows for nuanced verdicts (e.g., "Responsible for the error, exempt from blame due to systemic coercion").

  ---

  ### Part 2: Meta-Analysis of the Spec

  Here is the breakdown of which requirements are robust, which are partisan, and where the spec breaks.

  **1. Genuine Requirements vs. Camp Intuitions**
  *   **Genuine (Functional):** *Outcome Sensitivity* and *Enforcement Independence*. These describe how human social practices actually work. Any theory that ignores them fails to describe the phenomenon of responsibility.
  *   **Camp Intuition (Normative):** *Agency Grounding*. This is a Kantian/Deontic commitment, not an empirical fact. Compatibilists and Skeptics argue over whether this is even possible. However, for *institutional* use, it is treated as a genuine requirement because without it, incentives break down (you can't incentivize what people can't control).
  *   **Camp Intuition (Normative):** *Description Stability*. This is a realist commitment. Constructivists might argue the description *constitutes* the moral fact. However, for institutional rules, stability is a functional necessity.

  **2. The Incompatibility (The Broken Spec)**
  You correctly suspected it: **The Agency Grounding Constraint (1) and The Outcome Sensitivity Constraint (2) are logically incompatible in a strict deontic framework.**
  *   If blame tracks *only* control (1), then Driver A and Driver B (Identical Agents case) must receive identical blame.
  *   If blame tracks *outcomes* (2), then Driver A receives more blame than Driver B.
  *   Since the difference between A and B is luck (outside control), satisfying (2) violates (1).

  A theory cannot satisfy both without qualification. Any candidate that claims to satisfy both fully is hiding a contradiction. The only way to satisfy the spec is to **decouple** the concepts. You must argue that *Culpability* tracks Agency (1), while *Liability/Sanction* tracks Outcome (2).

  **3. The Single Most Restrictive Requirement**
  **The Outcome Sensitivity Constraint (2)** is the killer.
  *   **Why:** Most philosophical theories of responsibility (Kantian, Strawsonian, Rationalist) are built to satisfy Agency Grounding. They preserve the Control Principle by declaring outcome-based blame irrational.
  *   **The Constraint's Force:** Your spec explicitly bans this move ("a theory that just calls that a bug is cheating"). This rules out almost all pure philosophical accounts. It forces the theory to be **pragmatic** rather than **pure**. It demands a theory that justifies a practice that is, strictly speaking, irrational from the perspective of control.

  ---

  ### Part 3: Institutional Application (The "Just Culture" Model)

  Since the spec requires satisfying incompatible demands (Control vs. Outcome), you cannot use a single metric for institutional blame. You need a **two-axis matrix**. This is currently best implemented in high-reliability organizations (aviation, healthcare) as **"Just Culture."**

  Here is how you write the rules to satisfy the spec:

  **1. Separate Culpability from Liability**
  *   **Rule:** *Culpability* is determined solely by the decision process (Agency Grounding). *Liability* (consequences) is determined by the harm caused (Outcome Sensitivity).
  *   **Application:** Two surgeons make the same negligent error.
      *   Surgeon A (Patient lives): Culpable, but sanction is training/coaching.
      *   Surgeon B (Patient dies): Culpable, sanction is suspension + training.
      *   *Why this works:* It acknowledges the moral luck (B faces worse consequences) without claiming B is a worse *person* (both are equally culpable). It satisfies Outcome Sensitivity without violating Agency Grounding regarding the *nature* of the fault.

  **2. The Substitution Test (For Agency Grounding)**
  *   **Rule:** To determine if an action was reckless (blameworthy) vs. erroneous (non-blameworthy), ask: "Would a peer with the same information and training have made the same choice?"
  *   **Application:** If yes, it is a system error or human error (Excuse/Exemption). If no, it is reckless (Blameworthy).
  *   **Why this works:* It anchors blame in what was knowable/controllable (Constraint 1) and avoids Redescription tricks (Constraint 4).

  **3. The Audit Randomization Clause (For Audit Luck)**
  *   **Rule:** Sanctions for procedural violations discovered via random audit must be capped at the baseline penalty for the violation, regardless of whether harm occurred. Sanctions for violations discovered *via harm* may include harm-based penalties.
  *   **Application:** This admits the unfairness of audit luck. If you are caught speeding on a random check, you pay the fine. If you are caught because you crashed, you pay the fine + damages.
  *   **Why this works:* It acknowledges Enforcement Independence (Constraint 3). It admits that the *risk* is the crime, but the *harm* triggers the higher liability tier.

  **4. The "No Hindsight" Protocol (For Redescription)**
  *   **Rule:** Incident reviews must reconstruct the "Local Rationality" of the agent at the time. It is forbidden to use outcome knowledge to infer intent.
  *   **Application:** You cannot label a decision "reckless" because it caused a crash if, at the time, it was within standard operating procedure.
  *   **Why this works:* Satisfies Description Stability (Constraint 4).

  ### Summary for Implementation
  To use this for hospital or company rules:
  1.  **Admit the Paradox:** Write into the policy that *Culpability* (process) and *Liability* (outcome) are distinct.
  2.  **Process determines the Type of Response:** (Coach vs. Punish).
  3.  **Outcome determines the Severity of Response:** (Warning vs. Termination).
  4.  **Reject the "Bug" Theory:** Do not tell staff that "outcome doesn't matter." It does. But tell them *why* it matters (restorative justice/risk management) vs. why their *character* isn't necessarily judged by it.

  This satisfies your spec by treating the tension between Control and Luck not as a problem to be solved, but as a feature to be managed.
