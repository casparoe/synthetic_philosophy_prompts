  ### The Rule She Appears to Be Running

  Based on the archive, Vera Lindqvist is operating under a **Structural Dynamics Rule**. For a statement to qualify as a law of history, it must satisfy four criteria:

  1.  **Universality:** It must apply to "any society," not a specific time or place (rejects Items 2 & 4).
  2.  **Falsifiability:** It must be possible to conceive of evidence that would prove it false (rejects Item 5).
  3.  **Mechanism:** It must name a causal process, not merely describe a trend (rejects Item 4).
  4.  **Impersonal Necessity:** The outcome must be the result of an impersonal social force or structural shift, not a specific political decision, administrative act, or teleological prophecy (rejects Items 6 & 7).

  The accepted items (1 & 3) describe *conditions* that automatically alter *statuses* (legitimacy corrodes, authority moves). The rejected items describe specific events, functional tautologies, prophecies, or administrative choices.

  ### Alternative Rules

  Two other rules fit the existing archive equally well but diverge on Item 7.

  **Alternative 1: The Logical Empiricist Rule**
  *   **Definition:** A law is any universal, falsifiable conditional statement that posits a causal mechanism. It does not distinguish between impersonal forces and agentive decisions, provided the causality is clear.
  *   **Fit:** Explains all acceptances (1 & 3 are universal conditionals) and rejections (2 & 4 lack universality/mechanism; 5 is unfalsifiable; 6 is teleological/unfalsifiable prophecy).
  *   **Prediction for Item 7:** **Accepted.** Item 7 is universal ("In any society"), falsifiable (the state might *not* regulate), and mechanistic (the test enables the regulation).

  **Alternative 2: The Legitimacy Transfer Rule**
  *   **Definition:** A law must describe a shift in *authority* or *legitimacy* between social groups triggered by a material or technological change.
  *   **Fit:** Explains acceptances (1: War-makers lose legitimacy; 3: Rememberers lose authority to record-keepers). Explains rejections (2 & 4: No shift; 5: Functionalism, not authority; 6: End of state, not shift).
