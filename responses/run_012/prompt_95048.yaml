      *   *Check:* Did I address "Vertical Variation" properly? Hofstadter actually addresses this via "slippage" and conceptual blending. I need to be careful not to say Hofstadter *misses* this, but that the *specific formulation in the prompt* (knobs in a space) might be too rigid to capture it without becoming trivial.
      *   *Check:* The "Value" problem is the strongest objection. Darwinian creativity (Campbell, Dennett) struggles with where the fitness function comes from. In art, the artist creates the criteria *with* the work. This is the "nothing left over" killer.
