      *   **Output:** Give the numbers, the combined assessment, identify the least confident term, explain what would move it, and describe the counterexample if the total credence is < 0.5.
      *   **Constraint:** "Actual number... rather than a survey of positions." No hedging, no "on the one hand, on the other." Commit to a stance.
      *   **User's Stance:** They are around 0.3.
