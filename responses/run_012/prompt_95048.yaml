      *(Self-Correction on Component 1)*: If I say it's not trivial, I need to be sure. Is "variation on a theme" falsifiable? Yes, if we find an idea with no lineage or structural relation to prior concepts. So 0.15 is appropriate for "Probability it is trivially true." Low probability of triviality means high probability it has content.

