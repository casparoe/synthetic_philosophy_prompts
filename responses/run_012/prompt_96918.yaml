answer: |-
  ### The Flowchart Instrument

  #### I. Branching Questions
  *Answer each question using a concrete example in mind (e.g., a gas as molecules vs. pressure, a flock as birds vs. shape, a market as trades vs. supply/demand).*

  **1. The Fundamentality Check**
  When you describe the system, is the finer-grained story (molecules, birds, trades) the *one true account* of what exists, while the coarser story (pressure, flock, market) is merely a summary or shorthand?
  *   **Yes:** The micro-level is the only reality.
  *   **No:** Both levels describe reality, just differently.

  **2. The Novelty Check**
  Does the coarser description reveal patterns or regularities that the finer-grained description literally cannot state or capture, even if you had perfect knowledge of every part?
  *   **Yes:** The higher level sees things the lower level misses.
  *   **No:** The higher level adds no new information, only compression.

  **3. The Causal Check**
  Do the coarser features (like "turbulence" or "panic") constrain or change the behavior of the finer parts in a way that is not fully fixed by the parts' own rules alone?
  *   **Yes:** The whole pushes the parts around.
  *   **No:** The parts do all the pushing; the whole is just the result.

  **4. The Derivability Check (Autonomy)**
  If you knew every rule governing the finer parts, could you calculate the laws of the coarser level without ever observing the coarser level itself?
  *   **Yes:** The higher laws are locked inside the lower rules.
  *   **No:** The higher laws stand apart; you must observe them to know them.

  **5. The Substrate Check (Independence)**
  Could the coarser phenomenon exist if the finer parts were made of completely different stuff (e.g., a "market" made of atoms instead of people, or a "mind" made of silicon instead of neurons)?
  *   **Yes:** The higher level is detachable from the lower level.
  *   **No:** The higher level is tied to this specific lower level.

  **6. The Truth Check**
  Is the coarser description strictly *false* (a fiction we tell for convenience), or is it *approximate* (messy but true)?
  *   **False:** It is an illusion.
  *   **Approximate:** It is real but simplified.

  ---

  #### II. The Leaves (Positions)
  *Each leaf represents a unique combination of answers. The "Awkward Commitment" highlights the philosophical cost of holding this position.*

  1.  **Eliminative Materialism** (Q1: Yes, Q6: False)
      *   **Position:** Only the lowest level exists; higher-level entities (minds, markets, flocks) are strictly illusions.
      *   **Awkward Commitment:** You must insist that everyday objects and experiences do not really exist, even while using them to navigate life.

  2.  **Hard Reductionism** (Q1: Yes, Q2: No, Q4: Yes)
      *   **Position:** Higher levels are real but are nothing over and above the lower level; all higher laws are derivable from lower laws.
      *   **Awkward Commitment:** Biology and economics are merely applied physics, and we study them separately only because we lack the computing power to do the math.

  3.  **Instrumentalism** (Q1: Yes, Q2: No, Q4: No)
      *   **Position:** Higher levels are not derivable, but they don't track anything real; they are just useful tools for prediction.
      *   **Awkward Commitment:** You must claim that successful higher-level theories (like thermodynamics) describe nothing that actually exists in the world.

  4.  **Epiphenomenalism** (Q1: Yes, Q2: Yes, Q3: No, Q4: No)
      *   **Position:** Higher levels are real and autonomous, but they have no causal power over the physical parts.
      *   **Awkward Commitment:** Your thoughts and intentions exist, but they never actually cause your hand to move; the atoms do it all.

  5.  **Non-Reductive Physicalism** (Q1: Yes, Q2: Yes, Q3: Yes, Q4: No, Q5: No)
      *   **Position:** Higher levels are real and causally potent, but they are autonomous (not derivable) and dependent on the specific physical substrate.
      *   **Awkward Commitment:** You must explain how higher-level causes work without "double-counting" the causal work already done by the lower-level parts.

  6.  **Strong Emergentism** (Q1: Yes, Q2: Yes, Q3: Yes, Q4: No, Q5: No)
      *   **Position:** Similar to Non-Reductive Physicalism, but insists the higher-level causal powers are fundamentally new, not just compatible with the lower level.
      *   **Awkward Commitment:** You risk implying that the lower-level laws of physics are occasionally suspended or overridden by the higher level.

  7.  **Pluralistic Realism** (Q1: No, Q2: Yes, Q5: No)
      *   **Position:** Multiple levels of description are equally fundamental; none is the "one true story," but higher levels depend on the lower ones.
      *   **Awkward Commitment:** You must accept that reality is fragmented into different "kinds" of facts that cannot be unified into a single picture.

  8.  **Substance Dualism** (Q1: No, Q5: Yes)
      *   **Position:** Higher-level entities (like minds) are real and could exist independently of the specific lower-level physical stuff.
      *   **Awkward Commitment:** You must posit a realm of existence that is not physically constituted, which sits uneasily with modern science.

  9.  **Unnamed: Detached Pluralism** (Q1: No, Q2: No, Q5: Yes)
      *   **Position:** Levels are equally real, but the higher level adds no new patterns and could exist without the lower level.
      *   **Awkward Commitment:** You claim the higher level is distinct and independent, yet it predicts nothing the lower level doesn't and needs no specific substrate.

  10. **Unnamed: Rigid Pluralism** (Q1: No, Q4: Yes, Q5: No)
      *   **Position:** Levels are equally real, but the higher laws are fully derivable from the lower laws and tied to the substrate.
      *   **Awkward Commitment:** You assert levels are distinct, yet admit one is fully calculable from the other, making the distinction purely psychological.

  ---

  #### III. Unoccupied Combinations
  *Certain paths through the tree lead to no leaf because the combination of answers is logically or practically untenable.*

  1.  **Q1: Yes (Micro Fundamental) + Q3: Yes (Downward Causation) + Q6: False (Macro Fiction)**
      *   **Status:** **Incoherent.** If the macro level is a fiction (Eliminativism), it cannot possess causal power to push the micro level around.
  2.  **Q2: Yes (Micro Can't State Patterns) + Q4: Yes (Macro Derivable from Micro)**
      *   **Status:** **Incoherent.** If the macro patterns are derivable from the micro rules, then the micro description *can* state them (in principle), contradicting Q2.
  3.  **Q1: Yes (Micro Fundamental) + Q5: Yes (Macro Independent)**
      *   **Status:** **Unattractive/Unstable.** If the micro level is the *only* fundamental reality, the macro level cannot be independent of it. This path usually collapses into Dualism (Q1: No) or Reductionism (Q5: No).
  4.  **Q3: Yes (Downward Causation) + Q4: Yes (Derivable)**
      *   **Status:** **Unexplored/Tense.** If macro behavior is fully derivable from micro rules, it is difficult to argue that the macro level exerts causal influence *over and above* the micro rules. This combination is rarely defended explicitly.

  ---

  #### IV. Indistinguishable Leaves
  *Pairs of leaves that the current questions cannot reliably separate, flagged for the reader's awareness.*

  1.  **Non-Reductive Physicalism (Leaf 5) vs. Strong Emergentism (Leaf 6)**
      *   **Flag:** Both positions answer "Yes" to Autonomy and Downward Causation but "No" to Independence. The distinction rests on whether the downward causation is *compatible* with physical closure (Physicalism) or *breaks* it (Strong Emergence). Our Q3 asks if the higher level makes a difference, but does not force the reader to decide if that difference violates physical law. Readers often land on the same leaf while meaning different things by "cause."

  2.  **Hard Reductionism (Leaf 2) vs. Instrumentalism (Leaf 3)**
      *   **Flag:** Both answer "Yes" to Micro Fundamentality and "No" to Novelty. The split depends on Q4 (Derivability). However, in practice, many Hard Reductionists admit that derivation is impossible *for us* (making them look like Instrumentalists), while Instrumentalists admit derivation might be possible *in principle* (making them look like Reductionists). The line is often pragmatic rather than metaphysical.
