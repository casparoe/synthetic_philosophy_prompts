      *   *Are conditions enforceable?* Need to ensure the "design authority" doesn't violate state enabling acts. I will limit it to "Design Review within existing parameters."

  7.  **Final Polish:**
      *   Ensure the distinction between "owners" and "tenants" in the mitigation is clear.
      *   Make sure the "Novelist" voice comes through in the preamble (sensitivity to lived experience).
      *   Check the legal plausibility (exactions must have a nexus). The nexus here is displacement mitigation.

  *(Self-Correction during drafting)*: I initially thought about giving the Neighborhood Assembly veto power. *Correction:* That's likely illegal under most state zoning enabling acts (illegal delegation of legislative authority). I must constrain it to "binding recommendations on ground-floor use within the approved permit envelope."
  *Correction on Tax Levy:* Direct payment of property taxes for specific individuals might be legally shaky (equal protection). Better to structure it as a "Property Tax Escalation Fund" available to *any* primary resident over 65 or low-income, administered by a third party, funded by the developer. This makes it a general mitigation program, not a specific bribe.

