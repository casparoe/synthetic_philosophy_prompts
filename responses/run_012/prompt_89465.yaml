      *   *Key Tension 2: Displacement vs. Supply.* The YIMBY vs. NIMBY debate is too simple here. The opponents admit supply helps abstractly but fear *their* specific exclusion. This is the "Right to Stay Put" vs. "Right to Build."
      *   *Key Tension 3: The Stability Levy.* Is this mitigation or bribery? If we tax the new to pay the old, do we acknowledge a debt or create a protection racket? It touches on the "Community Benefits Agreement" model but goes deeper into governance (design authority).
