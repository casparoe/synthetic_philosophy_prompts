answer: |-
  This is a classic problem in political economy and ethics. You and your friend are bumping against the distinction between *particularism* (loyalty to specific people) and *universalism* (loyalty to abstract rules).

  To resolve your cases, you need a principle that distinguishes between **social gratitude**, **private discretion**, and **public fiduciary duty**.

  Here is the principle that fits most of your intuitions, where it breaks, and the honest answer to your question about Western standards.

  ### The Principle: Fiduciary Duty and Institutional Purpose

  **Corruption is the abuse of entrusted power for private gain, which subverts the intended purpose of the institution granting that power.**

  This relies on two tests:
  1.  **The Source of Power:** Is the power held in trust for a third party (the public, the patient, the shareholders) or is it the actor's own property (their own shop, their own labor)?
  2.  **The Distortion:** Does the benefit distort the decision-making process away from the institution's goal?

  ### Applying the Principle to Your Cases

  **1. The Surgeon (Wine vs. Envelope)**
  *   **Verdict:** Wine = Gift. Envelope = Corruption.
  *   **Why:** The surgeon's duty is to the patient's health.
      *   *Wine:* Given *after*, tokenistic, does not influence medical judgment. It acknowledges the *outcome*, not the *decision*.
      *   *Envelope:* Given *before*, creates a conflict of interest. It implies the quality of care might depend on the payment. It subverts the medical ethic of equal care.
  *   **The Consulting Fee:** This is corruption. Unlike the wine, a "fat fee" to a *regulator* is not tokenistic. It creates a retrospective incentive. If regulators know lucrative consulting jobs await them after ruling favorably, their judgment during the term is compromised. It subverts the regulatory purpose (impartial oversight).

  **2. The Waiter vs. The Clerk**
  *   **Verdict:** Waiter = Fine. Clerk = Corruption.
  *   **Why:**
      *   *Waiter:* Works in a private market. The "institution" is a restaurant designed to make profit. Tips align the waiter's incentive (service) with the owner's incentive (customer satisfaction). It does not subvert the system; it fuels it.
      *   *Clerk:* Works in a public bureaucracy. The "institution" is the state, designed for impartial rule application. Taking money converts a public right into a private commodity.

  **3. Queue Jumping vs. Expediting Entitlement (The Hard Case)**
  *   **Your Verdict:** Queue Jump = Corruption. Expediting Entitlement = Not Corruption.
  *   **The Principle's Verdict:** **Both are Corruption.**
  *   **Why you must give up your intuition here:** This is the most common point of disagreement between laypeople and development professionals.
      *   In the Queue Jump, you steal time from others.
      *   In the Expediting case, you are paying to release a hostage. If a clerk is *obliged* to issue the permit, the six-month wait is an artificial friction. By paying to remove it, you validate the friction.
      *   **Systemic Impact:** If "expediting fees" are tolerated, clerks have an incentive to *slow down* files to generate bribes. It turns the bureaucracy into a rent-seeking machine. Even if *you* get what you are owed, the *system* is corrupted.
      *   **Sacrifice:** You should concede this point. "Grease payments" are corruption because they sustain a broken system rather than fixing it.

  **4. Minister's Nephew vs. Shop Owner's Friend**
  *   **Verdict:** Minister = Corruption. Shop Owner = Not Corruption.
  *   **Why:**
      *   *Minister:* Holds public power in trust for *all* citizens. Hiring based on kinship subverts the goal of a meritocratic civil service serving the public good.
      *   *Shop Owner:* Holds private property. The goal of the shop is survival/profit. Hiring a trusted friend (who is competent) reduces risk and transaction costs. It is their money to risk.

  **5. The Harvest Share (Grandmother's Town)**
  *   **Verdict:** **Corruption.**
  *   **Why it feels different:** It is transparent, customary, and fixed. It lacks the "secrecy" we associate with bribes.
  *   **Why it is still corruption:** It blurs the line between **public revenue** and **private income**.
      *   Officials are paid by the state to serve the state. If they collect a "harvest share" from the populace, they are effectively taxing citizens for their own private benefit, bypassing the treasury.
      *   It creates a conflict of interest. If an official must choose between the state's law and the harvesters who feed him, his fiduciary duty to the state is compromised.
      *   **Difference from Wine:** The wine is sporadic and personal. The harvest share is *institutionalized*. It turns the public office into a franchise.

  **6. The Unlisted Case: Facilitation Payments**
  *   **Scenario:** Western firm pays customs officers abroad to clear goods.
  *   **Verdict:** **Corruption.**
  *   **Why:** Even if local law tolerates it, it violates the fiduciary duty of the customs officer to the state (collecting proper tariffs/enforcing laws). For the Western firm, it violates the principle of market neutrality (competing on price/quality, not on bribe size). Most international anti-corruption laws (like the FCPA or UK Bribery Act) now classify these as illegal, distinguishing them from "small facilitation" only in penalty, not in kind.

  ### The Honest Answer: Is This Just a Western Standard?

  **Yes. And No.**

  **Yes, it is Western:**
  The definition of corruption I just used relies on the **Weberian Ideal of the State**. This is a specifically European Enlightenment concept: that the "Public" and the "Private" are separate spheres, and that public office should be impersonal, rule-bound, and meritocratic.
  *   In many traditional societies (like your grandmother's town), the distinction between public and private is blurred. Authority is often patriarchal or patronage-based. An official *is* a local notable; his "salary" is expected to be supplemented by the community he governs. In that context, the harvest share isn't "theft"; it's a **social contract**. It binds the official to the community. If he doesn't take the share, he is "stuck-up" because he is rejecting the reciprocal bond of the community.
  *   By calling it corruption, you are imposing a norm of **Universalism** (rules apply to everyone equally) over a norm of **Particularism** (obligations depend on relationships).

  **No, it is not *just* Western:**
  If your friend works in *development*, their goal is usually to build states that can deliver services efficiently, attract investment, and ensure equality before the law.
  *   **Functionality:** Patronage systems work well for small-scale social cohesion. They fail at scale. You cannot run a modern economy, a national healthcare system, or a complex supply chain on harvest shares and nepotism. The transaction costs become too high (as seen in the Clerk/Permit case).
  *   **Equity:** The "Western" standard protects the weak. In a patronage system, if you don't have a "friend" or can't pay the harvest share, you get nothing. The impersonal bureaucracy, for all its coldness, is the only thing that guarantees a stranger the same rights as a nephew.

  ### Summary for Your Argument

  1.  **The Principle:** Corruption is the violation of a **fiduciary duty** (public or corporate) for **private gain**, which distorts the **institution's purpose**.
  2.  **The Verdict to Sacrifice:** You must accept that **paying to expedite an entitled permit is corruption.** It sustains a system where rights are held for ransom.
  3.  **The Harvest Share:** It is corruption because it privatizes public revenue and compromises the official's loyalty to the state, even if it is culturally sanctioned.
  4.  **The Western Standard:** Admit that "corruption" is a concept that requires a separation of Public and Private. If your friend's goal is to build modern, scalable institutions, the Western standard is the necessary tool. If the goal is to preserve traditional social cohesion, the label "corruption" is an act of cultural imperialism. But you cannot have both a modern state and a traditional patronage system; they are incompatible operating systems.

  Tell your friend: *"I concede the permit case. But I want to acknowledge that calling the harvest share 'corruption' assumes we want a modern bureaucracy more than we want traditional social cohesion."* That will likely end the argument, or at least elevate it.
