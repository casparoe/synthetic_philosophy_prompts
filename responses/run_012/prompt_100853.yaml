prompt: |-
  I keep getting into arguments with a friend who works in development about what counts as corruption, and I want to work out what I actually think by going case by case. Surgeon gets a bottle of wine from a grateful patient a fortnight after a clean operation: not corruption. Same surgeon gets an envelope the night before the operation: corruption, obviously. Waiter gets 20%: fine. Clerk in a licensing office takes a couple hundred rupees to move my file to the top of a queue that's otherwise strictly first-come-first-served: corruption, even though it's small and my file would've come up eventually. Same clerk, same office, takes the same money to issue me a permit I'm legally entitled to and he's legally obliged to issue, where the only alternative is a six-month wait: I don't think that's corruption, though I can see it's the same shape as the queue case and that bothers me. Minister's nephew gets a ministry job he's qualified for and no ones else applied: corruption. Shop owner hires her competent friend over a better-qualified stranger: not corruption. Company pays a retired regulator a fat "consulting fee" a year after she ruled its way: corruption — but then why isn't the wine corruption, since both are payments after the fact for something already done?

  Also, my grandmother's town has an actual customary scale, written down, where officials get a fixed "harvest share" every autumn, everyone knows the amounts, and nobody expects anything in return — the ones who take it call it a salary top-up, and the ones who refuse it are thought stuck-up. I feel like that's corruption and I can't say why the wine isn't.

  What principle, or small set of principles, gets all of these? Where it can't, which verdict should I give up, and what does the surviving principle say about the harvest share and about a case I haven't listed — say, a Western engineering firm paying "facilitation" money to customs officers abroad? And be honest with me about whether I've just dressed up a Western standard as a universal one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to resolve a debate with a developer friend about the definition of "corruption." They want to work through specific cases to find a consistent principle.
      *   **Cases Provided:**
          1.  Surgeon + Wine (after operation): Not corruption.
          2.  Surgeon + Envelope (before operation): Corruption.
          3.  Waiter + 20% tip: Fine.
          4.  Clerk + Money (queue jumping): Corruption.
          5.  Clerk + Money (expediting entitled permit): *User thinks Not Corruption* (but acknowledges similarity to case 4).
          6.  Minister's Nephew + Job (qualified, no other applicants): Corruption.
          7.  Shop Owner + Friend (competent, over better stranger): Not corruption.
          8.  Company + Retired Regulator (consulting fee after ruling): Corruption.
          9.  *Comparison:* Why is Case 8 corruption but Case 1 (wine) not?
          10. Grandmother's Town + Harvest Share (customary, fixed, no specific return expected): User feels it *is* corruption but can't explain why vs. wine.
          11. Unlisted Case: Western firm + Facilitation payments abroad.
      *   **Constraints/Questions:**
          *   Find a principle (or small set) that fits most cases.
          *   Identify where the principle fails and which verdict to sacrifice.
          *   Apply the principle to the Harvest Share and Facilitation Payments.
          *   Address the "Western standard vs. Universal" concern honestly.

  2.  **Deconstruct the Cases & Identify Tensions:**
      *   *Timing:* Before (bribe) vs. After (gift/consulting). User sees a tension here (Wine vs. Consulting Fee).
      *   *Quid Pro Quo:* Explicit exchange (Queue jump) vs. Implicit/Generalized (Harvest share) vs. None (Wine?).
      *   *Public vs. Private:* Clerk/Minister (Public) vs. Shop Owner/Waiter (Private). This is a huge divider.
      *   *Entitlement:* Getting what you deserve (Permit) vs. Getting an advantage (Queue jump).
      *   *Systemic Impact:* Does it undermine the system's purpose?
      *   *Transparency/Norms:* Open custom (Harvest) vs. Secret envelope.

  3.  **Drafting Principles:**
      *   *Attempt 1: Legality.* (Too circular. Law defines corruption, but we are asking what *is* corruption morally/functionally).
      *   *Attempt 2: Public vs. Private.* (Explains Shop Owner vs. Minister. Explains Waiter vs. Clerk. But doesn't fully explain Wine vs. Consulting Fee).
      *   *Attempt 3: Quid Pro Quo.* (Explains Envelope vs. Wine. But struggles with Harvest Share where "no specific return expected".)
      *   *Attempt 4: Fiduciary Duty / Public Trust.* (Public officials act for the public good. Private actors act for owners/self.)
      *   *Attempt 5: Systemic Integrity.* (Does the payment distort the intended function of the institution?)

  4.  **Synthesizing a Robust Principle:**
      *   The strongest distinction seems to be **Public Trust vs. Private Discretion** combined with **Undue Influence on Duty**.
      *   *Core Principle:* Corruption is the abuse of *entrusted power* (public or corporate) for *private gain*, which undermines the *intended purpose* of that power.
      *   *Refinement:* It's about the violation of a **Fiduciary Duty**.
          *   Surgeon/Clerk/Minister/Regulator: Fiduciary duty to patients/public/state.
          *   Waiter/Shop Owner: Fiduciary duty to employer/self (profit). Tips align with profit. Hiring friends aligns with trust/loyalty (within reason).

  5.  **Addressing Specific Tensions:**
      *   *Wine vs. Consulting Fee:* Wine is tokenistic, social, low value, no expectation of future influence. Consulting fee is high value, specific target (regulator), creates conflict of interest for *future* rulings or validates past bias. It looks like a deferred bribe.
      *   *Queue Jump vs. Expediting Entitlement:* This is the user's biggest inconsistency.
          *   Queue Jump: You get more than your share.
          *   Expediting: You get what is yours, but the system is held hostage.
          *   *Verdict:* Both are corruption. The "Expediting" case is often called "grease money," but it sustains a system where rights are held ransom. I need to push the user to change their mind here.
      *   *Minister's Nephew vs. Shop Friend:* Public office requires meritocracy/neutrality. Private business allows nepotism/loyalty.
      *   *Harvest Share:* This is institutionalized corruption. Just because it's open doesn't mean it's not corruption. It converts public office into a rent-seeking enterprise. It violates the fiduciary duty to the state/public.
      *   *Facilitation Payments:* Under the principle of "Public Trust," these are corruption. They undermine the rule of law in that jurisdiction, even if "customary."

  6.  **Addressing the "Western Standard" Accusation:**
      *   This is crucial. The definition of corruption *is* largely rooted in Weberian bureaucracy (impartial, rule-bound, public/private split).
      *   Many traditional societies operate on patronage/kinship networks (particularism).
      *   Is the Western standard "universal"? Functionally, for modern state-building and market efficiency, yes. Morally? It depends on whether you value impartiality over loyalty.
      *   *Honesty Check:* I must admit that labeling the Harvest Share as corruption imposes a modern bureaucratic norm on a traditional patronage norm. However, from the perspective of *development* (which the friend works in), the goal is usually impartial institutions.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the complexity. Validate the intuition.
      *   **The Core Principle:** Propose "Fiduciary Duty & Institutional Purpose."
      *   **Case-by-Case Application:** Walk through the user's list using the principle.
      *   **The Hard Calls (Where the user might be wrong):**
          *   The "Entitled Permit" (Grease payments).
          *   The Harvest Share (Institutionalized vs. Social).
      *   **The Unlisted Case:** Facilitation payments.
      *   **The "Western Standard" Question:** Tackle the cultural imperialism aspect head-on.
      *   **Conclusion:** Summary of the verdict.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Case 5 (Entitled Permit):* The user says "I don't think that's corruption." I need to explain *why* development experts call it corruption. It's about the *incentive structure*. If clerks rely on bribes for income, they will slow down files to generate bribes. It corrodes the system. I need to persuade the user to flip this verdict.
      *   *Correction on Harvest Share:* Why is this different from Wine? Wine is individual, sporadic, low value. Harvest share is systematic, expected, and effectively a tax on the populace diverted to officials. It blurs the line between state revenue and private income.
      *   *Correction on Western Standard:* Don't just say "Yes it is." Say "It depends on the goal." If the goal is a modern nation-state, it's corruption. If the goal is social cohesion in a kinship society, it's functioning as intended. But since the friend is in *development*, the context implies building modern institutions.

  9.  **Final Polish:** Ensure tone is respectful, analytical, and direct (as requested: "be honest with me").

  **(Self-Correction Note):** I need to make sure I don't just give a textbook definition. I need to resolve the *specific* contradictions the user raised (Wine vs. Consulting, Queue vs. Entitlement).

  *Key Distinction:* **Discretion vs. Duty.**
  *   Waiter: Discretion on service.
  *   Surgeon: Duty to health.
  *   Clerk: Duty to process.
  *   Shop Owner: Discretion on hiring.
  *   Minister: Duty to public interest.

  *Key Distinction:* **Systemic Distortion.**
  *   Does the payment change the outcome *against* the system's design?
  *   Wine: No.
  *   Consulting Fee: Yes (creates bias).
  *   Harvest Share: Yes (turns office into rent).

  Let's build the response around **Fiduciary Duty** and **Systemic Integrity**.

  10. **Final Review against constraints:**
      *   Principle identified? Yes.
      *   Verdicts sacrificed? Yes (The "Entitled Permit" case).
      *   Harvest Share addressed? Yes.
      *   Facilitation payments addressed? Yes.
      *   Western Standard question answered? Yes.

