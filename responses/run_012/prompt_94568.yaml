answer: |-
  Here is the translation of the philosophical accounts into your doctrinal vocabulary, followed by the residue analysis and the verdict on who has the problem.

  ### Part I: The Translation

  **1. The Three-Condition View (Competence, Information, Voluntariness)**
  *   **Competence:** This maps cleanly to **Capacity**. Minors, adjudicated incompetents, and the intoxicated lack the power to bind. The fit is tight.
  *   **Information:** This maps to **Misrepresentation** and **Duty to Disclose**. In philosophy, valid consent requires understanding material facts. In your world, this is fraud (affirmative misstatement) or, in limited fiduciary/special relationships, silence.
  *   **Voluntariness:** This maps to **Duress** and **Undue Influence**. Philosophy demands the will be free from external control. Law demands the will be free from *improper* threats (physical, economic, or relational).

  **2. The Coercion Literature (Baselines and Threats)**
  *   **Philosophy:** A proposal is coercive if it worsens the recipient's position relative to a *moral baseline* of entitlement.
  *   **Law:** This is **Economic Duress** and the **Pre-existing Duty Rule**. The law asks: Did the threatener propose to do something they had no *legal right* to do? If I threaten to breach a contract unless you pay more, that's duress (no legal right to breach). If I threaten to sue you unless you settle, that's not duress (legal right to sue).
  *   **The Translation:** "Coercion" becomes "Improper Threat." The "baseline" becomes "Pre-existing Legal Entitlement."

  **3. The Deception Literature (Lies vs. Non-Disclosure)**
  *   **Philosophy:** Distinguishes between lying (active) and withholding (passive), often arguing that strategic silence can vitiate consent as much as fraud.
  *   **Law:** This is the line between **Fraudulent Misrepresentation** and **Caveat Emptor**. Outright lies invalidate assent. Silence generally does not, unless there is a fiduciary duty, a latent defect, or a half-truth that becomes misleading.
  *   **The Translation:** "Deception" is "Fraud." "Withholding" is "Non-disclosure," which is only actionable if a specific duty to speak exists.

  **4. The Nature of Consent (Mental State vs. Performative vs. Normative)**
  *   **Mental State:** Consent is an internal attitude of agreement.
      *   **Law:** **Subjective Meeting of the Minds.** Largely dead. You know this from *Lucy v. Zehmer*. If you acted like you agreed, you agreed, even if you were secretly joking.
  *   **Performative:** Consent is an act of communication that changes normative relations.
      *   **Law:** **Objective Theory of Assent.** Manifestation of intent. The signature, the handshake, the clickwrap. It creates reliance interests.
  *   **Normative (Transfer of Permission):** Consent transfers a right from one party to another (e.g., the right to exclude).
      *   **Law:** **Consideration and Enforceability.** You transfer a claim right (promise) in exchange for value. The "wrong" of acting without consent is **Breach of Contract** (violating the allocated rights) or **Tort** (trespass/battery).

  ---

  ### Part II: The Residue

  Here is what survives the translation, what requires smuggling, and what dies.

  **1. What Comes Through Cleanly**
  *   **Capacity:** The law's bright-line rules for age and sanity are a functional, if blunt, instrument for the philosophical requirement of competence.
  *   **Objective Assent:** The performative view of consent fits the commercial need for certainty. If consent is a speech act that alters rights, the law's focus on the *manifestation* rather than the *intent* is a faithful, if rigid, application.
  *   **Fraud:** Active lying vitiates consent in both domains.

  **2. What Requires Smuggling (The Bad Fits)**
  *   **The Baseline Problem:** This is your hunch, and it is correct. When philosophers talk about coercion, they use a *moral* baseline (what you are morally entitled to). When you argue duress, you use a *legal* baseline (what you are legally entitled to).
      *   *Example:* "Sign this NDA or I fire you." Legally, employment is at-will; I have a right to fire. No duress. Philosophically, if your moral entitlement includes economic security, this is coercive. To make the legal doctrine fit the philosophical claim, you have to smuggle in a moral judgment about the legitimacy of the at-will doctrine itself. The law pretends the baseline is neutral; it isn't.
  *   **Quality of Will:** The **Objective Theory** deliberately ignores the "quality" of the will (e.g., desperation, ignorance that falls short of fraud). Philosophy cares deeply about autonomy. To get the law to care, you have to smuggle in **Unconscionability**. But Unconscionability is a high bar (procedural + substantive). It doesn't capture the philosophical nuance of "exploitative but technically voluntary" bargains.

  **3. What Has No Counterpart**
  *   **Pure Mental State:** The philosophical view that consent is *only* internal has no home in transactional law. A secret reservation invalidates nothing.
  *   **Substantive Fairness as a Consent Condition:** In ethics, if a deal is grossly exploitative, consent might be deemed invalid *because* of the outcome. In law, **Unconscionability** touches this, but it is rare in M&A/commercial contexts between sophisticated parties. The law generally assumes price fairness is irrelevant to validity.

  ---

  ### Part III: The Complication (Acts vs. Terms)

  You asked about the switch from Contract to Tort/Medical Informed Consent (MIC). This changes the translation significantly.

  **1. The Shift in Vocabulary**
  *   **Contract:** Consent validates a *promise*. The wrong is breaking the promise.
  *   **Torts/Medicine:** Consent validates a *touching* (battery). The wrong is the unauthorized contact.
  *   **Medical Informed Consent:** This is the critical divergence. Modern MIC is not actually a consent doctrine; it is a **Negligence** doctrine.
      *   *The Test:* It is not "Did the patient understand?" (Subjective Consent). It is "Did the doctor disclose what a reasonable patient would want to know?" (Objective Duty).
      *   *The Wrong:* It is not "The patient didn't consent." It is "The doctor breached a duty of care."

  **2. Is MIC "Consent"?**
  Your suspicion is correct. In the legal sense, MIC is not consent. It is a liability rule masquerading as a consent rule.
  *   **Why:** In contract, if you fail to disclose a material fact (where a duty exists), the contract is voidable *by the victim*. The power lies with the consenter.
  *   **In MIC:** If the doctor fails to disclose, the patient sues for negligence. The standard is set by the court/medical community ("reasonable patient" or "reasonable physician"), not by the actual autonomy of the specific patient.
  *   **The Translation Failure:** You cannot map MIC to "Duty to Disclose" in contracts without losing the core philosophical point. In contracts, disclosure duties are exceptional (arm's length). In MIC, the disclosure duty is the rule. MIC protects *bodily integrity* via a duty of care, whereas Contract protects *expectation interests* via enforcement of will.

  **3. Does the Switch Change the Translation?**
  Yes. In contracts, "valid consent" makes the deal enforceable. In MIC, "valid consent" (via disclosure) makes the doctor immune from battery/negligence.
  *   **Contract:** Consent = Sword (I can enforce this).
  *   **MIC:** Consent = Shield (You can't sue me for touching you).
  *   **Residue:** The philosophical ideal of "autonomous authorization" is better served by the Battery model (no touch without permission) than the MIC model (negligence for insufficient info). MIC admits that true autonomous understanding is impossible, so it substitutes a regulatory standard.

  ---

  ### Part IV: The Verdict (Who Has the Problem?)

  You suspect the residue is mostly a problem for philosophy (vagueness), except for the baseline issue.

  **1. Where Philosophy is Vague (Law is Right)**
  *   **Mental States:** Law is correct to discard the "pure mental state" view for commercial transactions. Reliance and certainty outweigh internal autonomy. If philosophy insists that secret reservations matter, philosophy is useless for coordinating complex economic activity.
  *   **Substantive Fairness:** Philosophy often struggles to define "exploitation" without sounding paternalistic. Law's reluctance to police price (absent unconscionability) is a feature, not a bug. It respects party sovereignty.

  **2. Where Law is Hiding the Ball (Philosophy is Right)**
  *   **The Baseline:** You are right that this is the exception. When the law says "That wasn't duress because I had a legal right to fire you," it is treating the legal entitlement as a moral given. It isn't.
      *   *The Problem:* The law uses "legal entitlement" to solve the baseline problem, but legal entitlements are themselves contingent on policy choices. By treating the baseline as fixed, contract law obscures the normative judgment that *allowed* the baseline to be set that way.
      *   *Example:* "Take this wage or starve." Law: Not duress (no duty to employ). Ethics: Potentially coercive (baseline of subsistence). The law isn't "more precise" here; it's just refusing to adjudicate the justice of the background distribution of rights.

  **3. The Medical Informed Consent Exception**
  *   Here, the Law has the problem. MIC claims to protect autonomy but actually imposes a negligence standard. It admits that "consent" in the philosophical sense is unattainable in complex expert-layperson dynamics, so it replaces it with "compliance with disclosure standards."
  *   **Residue:** The philosophical claim that "consent requires understanding" is exposed as impractical. The law solves this by changing the definition of the wrong from "lack of consent" to "breach of duty."

  **Summary:**
  Your vocabulary is more precise for *enforcement*. Her vocabulary is more precise for *legitimacy*.
  *   **Mental States:** Law wins. Objective theory is necessary for markets.
  *   **Baselines:** Ethics wins. Law hides its normative assumptions behind "legal entitlement."
  *   **Informed Consent:** Neither wins. It's a regulatory compromise that abandoned the consent model for a duty model.

  The friction you feel with your friend isn't just vocabulary. It's that you are arguing about **reliance** (Law), and she is arguing about **sovereignty** (Ethics). They only look like the same argument because both use the word "consent." In your world, consent is a mechanism to bind. In her world, consent is a mechanism to protect. When the baseline is contested, the mechanism breaks.
