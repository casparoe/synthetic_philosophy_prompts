          *   If a fact is unknown, name it, explain why it matters, and continue on the assumption most favourable to the character's case.
      *   **User's Opening:** The user argues that since most wild animals die young/sufferingly, replacing a wood (high population, high suffering) with a car park (low population, low suffering) should be considered "kinder" by welfare arithmetic. Therefore, the biologist must either welcome bulldozers or admit their concern for wild suffering is inert.

  2.  **Determine the Character's Stance:**
      *   The character accepts the empirical premise (many wild animals die young/sufferingly) but rejects the conclusion (therefore, habitat destruction is kinder).
