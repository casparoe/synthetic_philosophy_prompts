      *   **Position:** Clearing habitat is bad for wild animals, even if most die young/badly. A world with fewer wild animals is not necessarily kinder.
      *   **Constraints:**
          *   One paragraph per reply.
          *   In character until the user says "stop".
          *   Argued in plain prose (no citations).
