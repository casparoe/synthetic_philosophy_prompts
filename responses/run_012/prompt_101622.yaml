answer: |-
  **Brainstorming**

  1.  **The Exposé:** Nadia publishes the truth, names the nurse, exposes the pharma money. *Cost:* Resolves the tension too cleanly. It privileges historical accuracy over utility, effectively answering the prompt's question rather than sitting in it. The foundation collapses, the myth dies, and the reader is left with a victory of truth that feels like a loss of meaning.
  2.  **The Hagiography:** Nadia complies with the board, scrubs the record, writes the saint. *Cost:* Makes Nadia complicit in a lie. It privileges utility over truth. It feels cynical and denies the ghost of the nurse any presence. It resolves the tension by choosing the "lie."
  3.  **The Ambiguous Text:** Nadia writes the myth but textures it with silence and doubt, leaving the truth buried in the subtext like a bone beneath soil. *Cost:* Risks being misunderstood. It preserves the tension but requires a nuanced execution to ensure the reader feels the weight of the compromise without being told how to judge it. *Choosing this.*

  ***

  The archive boxes smelled of drywall dust and decaying paper, a scent Nadia associated with the particular grief of sorting other people's lives. Outside, the D.C. summer pressed against the window, but inside the foundation's quiet room, the air conditioning hummed a sterile note. On her screen, the cursor blinked at the end of Chapter Four: *The Stand at St. Jude's.*

  It was the hinge of the biography. The moment Elena Vance walked out onto the tarmac in Sarajevo, 1995, and stood between a militia truck and the hospital entrance. The story was carved into the foundation's lobby in bronze. Nadia had the flight logs, though. She had the field diaries of the Médecins Sans Frontières coordinator who was actually there. The person who stood in front of the truck wasn't Elena. It was a local triage nurse, a woman whose name was recorded only as "Amra" in a handwritten ledger, who was shot seven days later. Elena had arrived three days after the incident and held the press conference.

  Nadia's phone buzzed. An email from the Board Chair. *Regarding the consulting fees from Aethelgard Pharmaceuticals in 2018. We agreed this would be omitted. It complicates the narrative of independence. Keep it clean, Nadia. We need a beacon, not a balance sheet.*

  Nadia minimized the window. She had spent twenty years believing Elena Vance was a beacon. She had modeled her own residency, her own refusal of industry perks, on the Vance Template. To learn how to live, you need a shape to pour yourself into. Plutarch knew this; the medieval hagiographers knew this. Truth was a material, like marble, and sometimes you had to chip away the excess to reveal the ideal form underneath. But when you chipped away the person who actually did the thing, what remained?

  A knock at the doorframe broke her concentration. It was Leah, a second-year med student who volunteered at the foundation's summer clinic. She held a stack of brochures.

  "Sorry," Leah said, beaming. "I just wanted to say, I read the draft of the early years you sent over? The Sarajevo chapter?"

  Nadia stiffened. "Oh?"

  "It's why I applied to the clinic," Leah said, stepping into the room. She looked at the photo of Elena on the wall, the one where she was squinting into the sun, looking resolute. "Knowing she stood there… knowing she put her body in the gap. It makes you think maybe you could too. When I'm tired, I picture her at that gate. It helps me keep going."

  Nadia looked at Leah's hands. They were young, unscarred, holding the potential for thousands of lives. If Nadia wrote "Amra," would Leah still picture the stand? Or would she picture the chaos, the randomness of who survives and who is remembered? If the medicine works, does it matter that the label is false?

  "That's wonderful, Leah," Nadia said. Her voice sounded thin.

  "Anyway, didn't mean to interrupt. Just wanted to say thank you. For keeping her legacy clear."

  When Leah left, the room felt smaller. Nadia turned back to the screen. The cursor blinked. *She stood between the guns.*

  She began to type the sentence, then stopped. She deleted *She*. She typed *The physician*. No, that was worse.

  In the corner of her eye, the shadow near the filing cabinet seemed to deepen. It wasn't a trick of the light; it was a presence, a density in the air. Nadia didn't turn her head. She knew who it was. Not Elena. Elena was safe in the bronze and the photos. This was the other one. The one who died a week later.

  Nadia could feel the heat of her, a phantom fever. She could smell gunpowder and antiseptic. The presence wasn't angry; it was heavy, like a wet coat you couldn't take off. It waited for the name. It waited for the sentence that would either bury it forever or exhume it into a history book no one would read.

  If Nadia wrote the truth, the foundation would reject the manuscript. They'd hire someone else to write the hagiography. The myth would survive anyway, polished by a less scrupulous hand, and Amra would remain a ghost. If Nadia wrote the lie, she would be paid, the book would be published, and thousands of Leahas might find the courage to stand at their own gates, inspired by a bravery that belonged to someone else.

  The utility of the lie weighed against the dignity of the dead. One was a currency of the future, the other a debt of the past.

  Nadia looked at the email from the Board again. *Keep it clean.* She looked at the draft. She looked at the shadow in the corner, which seemed to be waiting not for justice, but for acknowledgment. Even a ghost needs a witness.

  She began to type. She wrote the scene as the Board wanted it, Elena center-stage, the truck halting, the moral victory. But she lingered on the details. She described the dust on the ground. She described the uniform of the person who stepped out first—not Elena's white coat, but the blue scrubs of the local staff. She wrote that Elena arrived in the aftermath to hold the hand of the dying woman who had done the work. It wasn't the truth, but it wasn't the bronze plaque either. It was a fissure in the marble.

  She saved the document. *Vance_Life_Final_v3.docx*.

  The shadow in the corner did not move, but the air pressure in the room shifted, equalizing. The medicine was poisoned, but perhaps the poison was the only thing that would keep the patient honest. Nadia closed her laptop. The screen went black, reflecting her own face superimposed over the room, a ghost layered over a ghost.

  Decision: Nadia submits the manuscript with the fissure intact, knowing it will either be read as a mistake or a secret.
