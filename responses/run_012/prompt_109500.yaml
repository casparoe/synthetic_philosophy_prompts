      *   **The Cost of Repair:** To make this work, IIT must assume a fundamental ontology (e.g., spatiotemporal pixels) or accept that $\Phi$ is relative to a "vocabulary" of states. If the vocabulary is arbitrary, $\Phi$ is arbitrary.
      *   **Alternative Weak Point:** Step (7). Maybe experience *is* definite, but our *description* of the substrate is indeterminate. (Epistemic vs. Ontic). But IIT claims $\Phi$ is ontic.
