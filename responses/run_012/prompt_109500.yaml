      *   *Wait, a deeper issue:* The user's Step (2) says maximal irreducibility is defined relative to a specification. IIT says it's defined relative to the *system's own causal powers*. The conflict is between the *modeler's* grid and the *system's* reality.
      *   *Decision:* The weak point is Step (2)'s implication that the relativity is fatal. IIT claims the relativity is resolved by the maximization process *if* a unique maximum exists. If multiple local maxima exist (tie), *then* you have indeterminacy. So the argument holds only if nature produces ties or scale-invariance.

