      *   *The Real Vulnerability:* The "Vocabulary Problem." To calculate cause-effect power, you need to define states (0/1, etc.). If this is arbitrary, $\Phi$ is arbitrary. IIT assumes a "natural kind" of mechanism.
      *   *Step to Surrender:* It's not (1) or Definiteness. It's the idea that the *theorist's* specification matters. The theory claims the *system's* intrinsic specification matters. However, if the physical world doesn't have a privileged grain (e.g., if physics is continuous or scale-invariant), then Step (2) holds, and IIT is in trouble.
      *   *Repair Costs:* IIT must commit to a discrete, fundamental ontology (like panpsychist atoms) or accept that consciousness is relative to a descriptive framework (which kills the "intrinsic" claim).
      *   *Comparison to other theories:* Functionalism avoids this by being multiple-realizable (doesn't care about boundaries as much), but fails on definiteness. Biological theories rely on "organism," which is also vague. IIT is unique in trying to *calculate* the boundary.

  7.  **Refining the "Step to Surrender":**
