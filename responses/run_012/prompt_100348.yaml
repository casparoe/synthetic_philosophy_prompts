answer: |-
  ### Restatement in Adversarial Search Vocabulary

  Let $G$ be a two-player, zero-sum, perfect-information game with a finite state space $\mathcal{S}$ and action space $\mathcal{A}$. Let $s_0$ be the initial state. We define a terminal evaluation function $u(s) \in \{+1, -1\}$ for the player to move, where $+1$ is a win and $-1$ is a loss.

  **Assumptions:**
  1.  **No Draws (Binary Terminal Values):** For all terminal states $s_T$, $u(s_T) \neq 0$. The minimax value $V^*(s)$ is defined for all $s \in \mathcal{S}$ via Zermelo's Theorem (determinacy).
  2.  **Move Availability (Symmetry):** The set of legal actions $A(s)$ depends only on the board configuration, not on which player is moving (excluding turn order).
  3.  **Monotonicity Invariant:** There exists a partial order $\preceq$ on $\mathcal{S}$ such that if $s' \succeq s$ (meaning $s'$ contains all pieces of $s$ plus at least one additional piece for the current player), then $V^*(s') \ge V^*(s)$. In your terms: having an extra piece on the board is a dominant strategy modification; it never reduces the minimax value of the position.

  **The Argument:**
  1.  **Hypothesis:** Assume for contradiction that $V^*(s_0) = -1$ (Second Player win). This implies there exists a policy $\pi_2: \mathcal{S} \to \mathcal{A}$ such that following $\pi_2$ guarantees a win for Player 2 regardless of Player 1's actions.
  2.  **Simulation Setup:** Player 1 makes an arbitrary opening move $a_{dummy} \in A(s_0)$, transitioning to state $s_1$. Player 1 now maintains a "shadow state" $s_{shadow}$, initialized to $s_0$.
  3.  **Policy Theft:** For every subsequent turn, Player 1 queries $\pi_2(s_{shadow})$ to determine the desired move $a_{desired}$.
  4.  **Collision Handling:**
      *   **Case A:** If $a_{desired}$ is legal in the real state $s_{real}$, Player 1 plays $a_{desired}$. Both $s_{real}$ and $s_{shadow}$ update identically.
      *   **Case B:** If $a_{desired}$ is illegal in $s_{real}$ (because the square is occupied by the initial $a_{dummy}$ or subsequent "dummy" moves), Player 1 plays an arbitrary legal move $a_{arbitrary}$.
  5.  **Invariant Maintenance:** In Case B, $s_{real}$ acquires an extra piece relative to $s_{shadow}$. By the **Monotonicity Invariant**, the value of the real position is at least as good as the shadow position. Since $\pi_2$ guarantees a win from $s_{shadow}$ (value $-1$ for the player to move in shadow, which corresponds to Player 1 winning in reality), the extra piece ensures Player 1 wins in $s_{real}$ as well.
  6.  **Contradiction:** Player 1 has constructed a winning trajectory using Player 2's policy. Thus, $V^*(s_0)$ cannot be $-1$.
  7.  **Conclusion:** By **Determinacy**, since $V^*(s_0) \neq -1$ and draws are impossible, $V^*(s_0) = +1$.

  ### Evaluation of Your Suspicion

  Your suspicion is correct. The argument is a **simulation relation** coupled with a **monotonicity claim**, closed by **determinacy**.

  *   **Simulation:** You are correct that Player 1 is simulating a copy of the game where they occupy the second player's seat. The "extra move" acts as a buffer that decouples the shadow state from the real state.
  *   **Monotonicity:** You identified the critical engine: "a position plus an extra stone dominates the corresponding position without it." In your vocabulary, this is a property of the transition function and evaluation function, not the search algorithm.
  *   **Determinacy:** This is the closure condition. Without the guarantee that one player *must* have a winning strategy (Zermelo's Theorem), proving P2 *doesn't* have one wouldn't automatically prove P1 *does*.

  ### Residue Report

  Here is the breakdown of how the argument translates into your framework, where it distorts, and where the friction lies.

  #### 1. Clean Translations
  *   **"No Draws":** This maps cleanly to binary terminal labels in your game tree. No fudging required.
  *   **"Determinacy":** This maps to the existence of a minimax value for every node in a finite tree. Your framework handles this natively.
  *   **"Strategy":** In the context of finite games, a mathematical strategy (mapping states to moves) is isomorphic to a lookup table. Your framework accepts this.

  #### 2. Distortions and Fudges
  *   **"Arbitrary Move":** In your engine, "arbitrary" is a implementation detail. In the proof, it relies on the **Existence of a Legal Move**. You must implicitly assume the game doesn't stalemate. In Hex/Chomp, this is true, but in your general adversarial search framework, you usually handle stalemates as draws or losses. The proof fudges this by assuming the "extra piece" never blocks *all* future moves required by the stolen strategy.
  *   **"Strategy" (Existence vs. Program):** This is the largest friction point. In your world, a strategy is a *program* (an algorithm to compute the move). In the SSA, a strategy is a *mathematical object* (a set of state-action pairs). The SSA proves the *set* exists but gives you no algorithm to generate it efficiently.
      *   *Is this a defect of your framework?* No. Your framework distinguishes between the **Decision Problem** (What is the value of the root?) and the **Search Problem** (Find the Principal Variation). The SSA solves the Decision Problem in $O(1)$ but leaves the Search Problem at full complexity (PSPACE-complete for Hex). The friction you feel is the gap between *knowing the answer* and *computing the path*.
  *   **"Extra Move Never Hurts" (Monotonicity):** This is the most significant distortion. In general adversarial search, adding a piece *can* hurt (e.g., blocking your own lines, suicide chess, Ko rules in Go). The SSA treats this as intuitive magic. Your framework forces you to declare this as a **Precondition** on the game dynamics.
      *   *Source of Unclarity:* The original claim often obscures this. It presents monotonicity as a logical consequence of "having more pieces," when it is actually a specific constraint on the game's ruleset. Your vocabulary exposes this as a domain assumption, not a logical truth.

  #### 3. What Has No Counterpart?
  Nothing in the SSA is inexpressible in your vocabulary. However, there is a **Utility Gap**.
  *   In mathematics, a non-constructive existence proof is a complete solution.
  *   In software engineering, a proof that returns `TRUE` without a path is a "Not Implemented" exception.
  *   The SSA asserts `RootValue == WIN` without populating the `TranspositionTable`. Your framework can *state* this, but it cannot *use* it to guide search (e.g., for move ordering or pruning) without the actual policy. The "residue" is the frustration that the proof bypasses the computational work you are trained to value.

  #### 4. The Existence/Computability Gap
  You asked if this gap is the whole story. **It is not.**
  The gap between existence and computability is standard in CS (e.g., knowing a sorting network exists vs. building it). The deeper issue here is **Information Hiding**.
  The SSA proves the value of the root node without revealing the values of the child nodes. In minimax, you typically need child values to propagate the root value. The SSA bypasses the propagation mechanism entirely by using the Monotonicity Invariant to couple the root value to a hypothetical subtree.
  This is not a defect of your vocabulary; it is a **Complexity Bypass**. The argument relies on a semantic property of the game (monotonicity) to shortcut the syntactic evaluation of the tree.

  ### Committed Position

  The residue you perceive is **not a defect of your framework**. Your vocabulary is sharper than the philosophical presentation. The friction arises because the original argument relies on a **Domain-Specific Invariant (Monotonicity)** that is frequently rhetorically concealed as a logical necessity.

  When you translate "an extra move can never hurt" into "the transition function preserves the partial order of state values," the magic evaporates, and you see a strict precondition. If your framework feels like it's "fudging," it is because the source material is under-specified. The "existence vs. computable" gap is real, but it is a feature of non-constructive proofs generally, not specific to SSA. The specific residue of SSA is the **Monotonicity Invariant**, which your framework correctly identifies as a heavy assumption that the original argument treats lightly.

  Verdict: The residue originates from the original argument's reliance on a domain-specific monotonicity invariant that is often rhetorically concealed as intuitive magic, which your framework correctly exposes as a non-trivial precondition.
