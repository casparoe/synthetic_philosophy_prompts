prompt: |-
  I'm a software engineer, no philosophy training beyond a couple of pop-science books and too many podcasts, and I can't stop thinking about the sphex wasp. You know the one: she drags a paralyzed cricket to the burrow, goes inside to check it, and if you nudge the cricket a few inches while she's in there she just drags it back and checks the burrow again, over and over, never catching on. Hofstadter made sphexishness out of that, Dennett leaned on it when he wrote about free will, and I've also heard the wasp story is oversold -- that she does eventually adapt, and that the repeated nest check might even be the smart move. Either way it's the thing I keep circling: is our own flexibility just this, one level up?

  So here's what I want. I've got about a year of evenings and weekends to spend on this and I want to spend them well, so give me an agenda, not a survey, and no reading list. What are the actual open questions in this territory -- what it would even mean for a system's flexibility to be genuine rather than a bigger routine, whether sphexishness can be defined without begging the question about us, whether any version of the free will issue survives taking the mechanism seriously, plus whatever belongs on the list that I'm not seeing. Then rank them for someone in my position: which are upstream of which, which are tractable for a person with a coder's background (fine with probability and computation, weaker on modal logic), which get more attention than they deserve, and what argument or evidence would move one up or down. Be straight with me about which ones I'd be wasting my evenings on because nothing downstream turns on the answer.

  One more thing to fold in. I've been calling a failure mode I keep hitting in the agents I build shallow adaptivity -- the thing varies its behavior but never the shape of the variation, so the routine is still in there, just pushed up a level. Is that a real distinction that already has a name, is it just sphexishness with extra steps, and if it's real, where does it land in the ranking?

  Please answer in British English.
