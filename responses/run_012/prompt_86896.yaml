answer: |-
  Here is the specification for a theory of cultural causation. It is structured as a set of seven desiderata, followed by an analysis of their compatibility, origin, and exclusionary power.

  ### The Desiderata

  **1. Ex-Ante Predictive Specificity (The Post-Hoc Constraint)**
  *   **Requirement:** The theory must specify the mapping between specific value-sets and specific outcomes *prior* to observing the outcome. It must define what evidence would falsify the claim (e.g., "If Society A holds Value X but fails to produce Outcome Y under conditions Z, the theory is false").
  *   **Motivation:** Without this, the theory suffers from infinite flexibility. If "thrift" explains growth, does "spending" explain decline? Or does "spending" explain growth via stimulus? If any outcome can be retrofitted to a value, the theory is astrology, not science. It prevents the "Texas Sharpshooter" fallacy where the target is drawn after the shot.

  **2. Identification of Causal Direction (The Endogeneity Constraint)**
  *   **Requirement:** The theory must provide a method to distinguish values causing outcomes from outcomes causing values. It cannot rely solely on correlation or simultaneous equation modeling without an exogenous shock or instrumental variable that shifts values independently of economic conditions.
  *   **Motivation:** Wealthy societies can afford to value "self-expression"; poor societies may be forced to value "survival." If the theory cannot disentangle this feedback loop, "mutual constitution" becomes a euphemism for "we don't know which way the arrow points." A serious theory must isolate the independent variable.

  **3. The Micro-Macro Mechanism (The Aggregation Bridge)**
  *   **Requirement:** The theory must explicitly describe the transmission mechanism that converts individual psychology into collective statistics. It must state whether values operate through voting, market signaling, institutional design, or social sanctioning, and whether intermediate institutions are necessary.
  *   **Motivation:** Values reside in heads; GDP and regime types reside in systems. A theory that jumps from "Calvinists feel anxious" to "National savings rates rise" without explaining how individual anxiety aggregates (e.g., via church discipline or banking norms) commits the fallacy of composition. It forces the theorist to build the engine, not just point to the fuel.

  **4. Functional Differentiation (The Role Constraint)**
  *   **Requirement:** The theory must distinguish whether a value is acting as a *motivation* (causing action), a *constraint* (ruling out action), or a *coordination device* (solving a bargaining problem).
  *   **Motivation:** These are mechanically distinct. A value that motivates (e.g., "work hard") requires energy input. A value that constrains (e.g., "do not steal") reduces transaction costs. A value that coordinates (e.g., "drive on the right") creates network effects. Conflating them leads to wrong policy prescriptions; you cannot incentivize a constraint, and you cannot legislate a motivation.

  **5. Level vs. Timing Distinction (The Dependent Variable Constraint)**
  *   **Requirement:** The theory must declare whether it explains *levels* (why Country A is richer than Country B now) or *timing* (why Country A industrialized before Country B).
  *   **Motivation:** These are different phenomena. A value might be necessary for the *onset* of growth (timing) but irrelevant for maintaining *steady state* wealth (level), as institutions may take over. A theory that claims to explain both without modification is likely overfit. Convergence theories suggest values matter less over time; divergence theories suggest they matter more. The theory must pick a lane.

  **6. The Intra-Cultural Variation Test (The Two Valleys Constraint)**
  *   **Requirement:** The theory must account for divergence where cultural variables are held constant. In the case of two neighboring valleys with identical confessions and serums where only one industrializes, the theory must identify the marginal factor that triggered the split without discarding the cultural premise.
  *   **Motivation:** This tests the *sufficiency* of the cultural claim. If culture is the cause, identical culture should yield identical outcomes, ceteris paribus. If the theory admits other factors (geography, chance, leadership) can override culture in this case, it must quantify the threshold at which culture ceases to be the dominant variable. It prevents culture from being a "residual" explanation used only when other factors fail.

  **7. Ontological Status of Values (The Causality Constraint)**
  *   **Requirement:** The theory must define in what sense a value is a "cause." If it differs from natural science causality (constant conjunction of events), it must specify the alternative logic (e.g., reason-based action, meaningful interpretation). It must demonstrate that the value is not merely a rationalization adopted after the fact to justify interest-driven behavior.
  *   **Motivation:** In physics, a billiard ball does not "decide" to move. In society, actors interpret their world. If values are just ex-post rationalizations for material interests, they are epiphenomenal. A serious theory must prove values have "bite"—that people sometimes act *against* their material interest *because* of the value. If the sense of cause is interpretive, the theory must accept limits on prediction that natural sciences do not.

  ***

  ### Analysis of the Specification

  #### Non-Negotiables vs. Camp Prejudices

  **Non-Negotiables (Requirements for any scientific claim):**
  *   **1 (Predictive Specificity):** Without falsifiability, there is no theory, only literature.
  *   **3 (Micro-Macro Mechanism):** Without a transmission belt, there is magic, not social science.
  *   **7 (Ontological Status):** You cannot claim causation without defining what cause means in your domain.

  **Camp Prejudices (Methodological preferences):**
  *   **2 (Identification of Direction):** This is heavily favored by **Econometricians and Materialists**. **Weberians and Historical Sociologists** often argue that direction is inseparable (hermeneutic circle) and that isolating variables destroys the phenomenon. They would argue this requirement biases the field toward quantifiable, short-term causality.
  *   **5 (Level vs. Timing):** **Modern Growth Theorists** prefer Level explanations. **Development Historians** prefer Timing. Insisting on one excludes the other's valid insights.
  *   **6 (Two Valleys Test):** This is a **Rational Choice/Control-Group** preference. **Cultural Essentialists** might argue that "culture" is never truly identical in two valleys (local practice differs from dogma), making the test impossible to satisfy fairly.

  #### The Internal Tensions

  There is a fundamental tension between **Requirement 2 (Identification)** and **Requirement 7 (Ontological Status)**.

  *   **The Tension:** To satisfy **Req 2**, you must isolate values from their context to prove they move the needle independently of institutions or economics. You need to treat culture as a variable $X$ that can change while $Y$ and $Z$ stay still.
  *   **The Conflict:** To satisfy **Req 7** (specifically the social science version of cause), values must be understood as *meaningful* within a specific context. A value's causal power often depends on the institutional web surrounding it (the "ethos"). If you isolate the value to prove direction (Req 2), you may strip it of the meaning that gives it causal power (Req 7).
  *   **Result:** You can have a theory that proves direction statistically but fails to explain *why* the value motivated action (hollow causality). Or, you can have a theory that explains the meaning deeply but cannot statistically disentangle it from the economic conditions that sustained it (unidentified causality).

  There is a secondary tension between **Requirement 1 (Prediction)** and **Requirement 6 (Two Valleys)**.

  *   **The Tension:** If a theory relies on deep cultural codes (Req 7), it often argues that small initial differences compound over time (path dependence).
  *   **The Conflict:** The Two Valleys test (Req 6) demands the theory explain a split despite identical cultural inputs. If the theory posits that culture is the *primary* driver, it struggles to explain the split without admitting non-cultural causes. If it admits non-cultural causes, it weakens the claim that culture is the *driver* rather than a *modifier*.

  #### The Single Most Exclusionary Requirement

  **Requirement 1: Ex-Ante Predictive Specificity.**

  This is the killer. Most cultural theories are hermeneutic; they are designed to make sense of the past, not predict the future.
  *   **Why it rules out candidates:** It eliminates almost all historical sociology and traditional Weberian analysis. These frameworks excel at explaining why the Protestant Reformation *coincided* with capitalism, but they generally cannot predict *which* specific sect will generate growth in a modern context, nor can they specify the magnitude of the effect before the data is in.
  *   **The Cost:** Enforcing this requirement forces cultural theory to become a branch of psychology or econometrics, potentially stripping it of the historical depth that makes it compelling. However, without it, the field remains a repository of "just-so stories."

  ### Summary Verdict

  To be taken seriously, a theory of cultural causation must surrender the claim to totalizing explanation. It cannot explain everything (Req 1), it must admit when it is describing a constraint rather than a motor (Req 4), and it must confront the possibility that the value is a symptom, not a disease (Req 2 & 7).

  The hardest pill to swallow is that satisfying the **Identification (Req 2)** and **Prediction (Req 1)** constraints likely requires treating values as shallow, measurable variables, which may violate the **Ontological (Req 7)** requirement that values are deep, meaningful structures. A theory that satisfies all seven simultaneously may be mathematically possible but sociologically empty. The best achievable theory will likely satisfy 1, 3, and 7, while admitting partial failure on 2.
