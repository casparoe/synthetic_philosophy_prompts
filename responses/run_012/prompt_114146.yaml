answer: |-
  Here is the adjudication. I am not going to hedge: **You win on the history; your friend wins on the modern epistemology. But regarding the specific analogy you are fighting over, the analogy is broken, and your reading of Kepler is historically accurate while your friend's is a projection of modern boundaries onto the past.**

  Here is the breakdown.

  ### 1. The Correspondence Table
  To test the analogy, we have to map the terms your friend is using. If "Astrology is to Astronomy what Alchemy is to Chemistry," the following mapping must hold:

  | Feature | Alchemy (Ancestor) | Chemistry (Successor) | Astrology (Ancestor) | Astronomy (Successor) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Primary Goal** | Transmutation (Lead to Gold) | Understanding Matter/Reactions | Prediction/Influence (Fate) | Understanding Motion/Physics |
  | **Methodology** | Lab techniques, observation | Empirical method, math | Math, observation, myth | Math, empirical observation |
  | **Theoretical Core** | Mystical properties, sympathy | Atomic theory, bonds | Celestial sympathy, aspects | Gravity, mechanics |
  | **Outcome** | Goal proven impossible; methods kept | Goal achieved; science formed | Goal proven impossible; methods kept | Goal achieved; science formed |
  | **Relationship** | Chemistry *rejected* the goal of alchemy. | | Astronomy *rejected* the goal of astrology. | |

  ### 2. Running Kepler Through the Map
  This is where the analogy fractures.

  **Where the Mapping Holds:**
  *   **Funding & Labor:** Just as alchemists often worked as metallurgists or apothecaries to pay for experiments, Kepler cast horoscopes for Wallenstein and the Emperor to pay for his astronomical calculations. The "magic" subsidized the "science."
  *   **Data Accumulation:** Both traditions accumulated massive amounts of raw data (observational positions in astronomy; material reactions in alchemy) that outlived the mystical theories.

  **Where the Mapping Breaks (The Critical Failures):**
  *   **The Fate of the Goal:**
      *   *Alchemy:* Chemists (like Lavoisier) explicitly proved transmutation was impossible (within chemical means) and discarded the goal. The "magic" was a husk.
      *   *Astrology:* Kepler **did not discard the goal.** He did not decide celestial influence was impossible. He decided the *traditional mechanism* (signs/houses) was wrong, but he doubled down on the *reality* of influence (aspects/harmony). He believed he was correcting astrology, not burying it.
  *   **Integration of Theory:**
      *   *Alchemy:* Newton's alchemy (your friend's counter-point) was largely private and separate from the *Principia*. He kept them in separate boxes.
      *   *Astrology:* Kepler's astrology was **public and integral** to his physics. His Third Law of Planetary Motion was published in *Harmonices Mundi* (The Harmony of the World), a text explicitly dedicated to astrological harmony and the "music of the spheres." The physics was the *explanation* for the astrology.
  *   **The "Husk" vs. "Engine":**
      *   In the alchemy story, the magic is a shell you crack to get the nut.
      *   In Kepler's case, the magic was the **fuel**. He was not looking for orbital mechanics *despite* being an astrologer; he was looking for orbital mechanics *because* he was an astrologer trying to find the geometric ratios that caused influence.

  ### 3. What Breaks Matter for the Argument?
  Your friend uses the analogy to prove: *Astrology is a dead end we outgrew; therefore, its claims are irrelevant to the science.*
  You use the analogy to prove: *Astrology was the engine of the science; therefore, it is historically inseparable.*

  **The Break That Matters:**
  The critical break is **Integration.** If Kepler had treated astrology like Newton treated alchemy (a private hobby separate from his physics), your friend would be right. But Kepler treated astrology as the *theological justification* for his physics.
  *   **Verdict on this point:** Your friend's claim that it was just a "day job" is historically false. It was a worldview. The "magical part" was load-bearing for the discovery of the Third Law. Without the belief in celestial harmony, Kepler likely does not derive the $P^2 \propto a^3$ relationship.

  **The Decoration:**
  The fact that Kepler mocked the "12 signs" and "houses" is decoration. It shows he was a reformer, not a traditionalist, but it doesn't change the fact that he was operating within an astrological paradigm of influence.

  ### 4. The Verdict
  **Does your friend's line survive?**
  **No.** The "superseded stage" narrative assumes a clean break (Chemistry rejects Alchemy's goals). History shows Astronomy *absorbed* Astrology's goals and redefined them physically. You cannot "ignore it as a knowledge tradition" if you want to understand how the science actually emerged. The "embarrassing ancestor" story is Whig history (viewing the past only as a stepping stone to the present) that erases the actual motivation of the actors.

  **Does your line survive?**
  **Yes, with a caveat.** You are right that the magical part was load-bearing. However, you must be careful with the phrase "take it seriously as a knowledge tradition." You must take *Kepler's reasoning* seriously as a historical driver, but that does not validate modern astrology. Kepler's "astrology" was essentially geometry and theology; modern sun-sign astrology is largely deterministic fortune-telling which Kepler himself mocked.
  *   **Ruling:** You win the historical argument. The analogy your friend uses is false for the 17th century.

  ### 5. A Better Analogy
  The Alchemy/Chemistry analogy implies **Purification** (removing the impure magic to find the pure science).
  A better analogy for Astrology/Astronomy in Kepler's time is **The Search for Perpetual Motion to Thermodynamics.**

  *   **The Scenario:** For centuries, inventors tried to build perpetual motion machines (impossible).
  *   **The Process:** In trying to build them, they developed precise measurements of friction, energy loss, and mechanical efficiency.
  *   **The Result:** They proved perpetual motion was impossible, but the data they gathered created Thermodynamics (real science).
  *   **The Parallel:** Kepler tried to prove celestial influence (the "perpetual motion" of fate). In doing so, he measured planetary positions so precisely he discovered Gravity (the "thermodynamics").
  *   **Why it fits:** The impossible goal drove the discovery of the real laws. The goal wasn't just a "husk"; it was the *reason the work was done*.

  ### 6. What the Alchemy Story Smuggles In
  Your friend's analogy smuggles in a specific theory of how pseudoscience dies: **The Shedding Model.**
  It assumes that Science is a substance that exists inside Pseudoscience, and over time, the Pseudoscience sheds its false skin to reveal the Science underneath.
  *   **The Reality:** Science often kills the host. Astronomy didn't emerge from Astrology like a butterfly from a chrysalis; it ate the Astrology and digested it. The "death" of astrology wasn't a quiet leaving behind; it was a violent redefinition where the *mechanism* (gravity) replaced the *sympathy* (influence), but the *object of study* remained the same. The Alchemy story comforts us by suggesting progress is inevitable and clean. It wasn't.

  ### 7. Fact-Check: Your Kepler Material
  You are safe to repeat this at parties. Your details are historically sound.

  *   **Career casting horoscopes:** **True.** As Imperial Mathematician, it was a requirement. He cast roughly 800+ natal charts.
  *   **Wallenstein:** **True.** He cast the general's horoscope (and famously predicted Wallenstein's assassination, though the dating is debated).
  *   **De Fundamentis Astrologiae Certioribus (1601):** **True.** The title translates to *On the More Certain Fundamentals of Astrology*.
  *   **Houses/Signs = Junk, Aspects = Real:** **True.** Kepler argued the 12 signs were arbitrary human divisions of constellations. He argued the *aspects* (angles like 60°, 90°, 120°) were real because they were geometric ratios that the "Earth Soul" (*Anima Terrae*) could perceive, similar to how the ear perceives musical harmony.
  *   **Harmony/Third Law:** **True.** The Third Law was published in *Harmonices Mundi* Book V. He explicitly links the harmonic ratios of the planets to their orbital periods.
  *   **Newton Comparison:** **Mostly False.** While Newton studied alchemy, he did not integrate it into the *Principia* the way Kepler integrated astrology into *Harmonices*. Newton's alchemy was hermetic and private; Kepler's astrology was public and foundational to his physical theories.

  **Summary for your friend:** Tell him Kepler didn't find the laws of motion *in spite* of his astrology. He found them *because* he was trying to solve an astrological problem. The magic wasn't the shell; it was the engine.
