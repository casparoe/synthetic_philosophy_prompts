  ## 6. What This Activity Cannot Do (Facilitator Note)

  **The Limitation:** This activity demonstrates *incoherence* in pricing. It does not formally prove Lewis's theorem (that $P(A \to B) = P(B)$ for *all* A, B). It only shows the collapse for one specific pair ($H, E$).
  **Your Burden:** You must verbally generalize in the debrief. "Imagine I did this for every pair of events. The only way to stop the bleeding is to make $P(B|A) = P(B)$ for all A. That means A and B are independent. That means you can't learn anything. That is triviality."

  **The Material Escape Limitation:** The activity penalizes Material pricing *only because* of the "Void/Refund" contract rule you imposed. A clever student will note: "If we changed the contract to pay 1 on ~A, we'd be fine."
  **Your Response:** "Yes. But then it's not an *Indicative* Conditional anymore. It's a Material Implication. No one speaks in Material Implications. If I say 'If it rains, I bring an umbrella', and it doesn't rain, I don't want you to say 'You told the truth!' I want you to say 'It doesn't apply.' The activity forces you to price the *Indicative*. The collapse shows the Indicative cannot be a truth-conditional proposition."
