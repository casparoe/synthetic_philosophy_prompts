answer: |-
  # Activity: The Conditional Market Collapse

  ## 1. Materials & Setup

  **Room:** Seminar table or clusters of desks pushed together.
  **Participants:** 14 Students + 1 Instructor (You).
  **Roles:**
  *   **The Desk (13 Students):** Market Makers. They set prices and hold the shared pool.
  *   **The Customer (You):** Arbitrageur. You trade against the Desk to expose incoherence.
  *   *(Note: Do not assign a student as Customer. You must control the "kill shot" to ensure the lesson lands.)*

  **Physical Materials:**
  *   **One large D6 (Die):** Transparent if possible, placed centrally.
  *   ** Poker Chips (200 count):** Two colors. White = Stake/Cash. Red = Debt/Loss.
  *   **Contract Slips (Pre-printed, 50 total):**
      *   Type P (Plain): "Pays 1 White if Event E. 0 otherwise."
      *   Type C (Conditional): "Pays 1 White if A & B. 0 if A & ~B. **Void (Stake Returned)** if ~A."
  *   **Whiteboard:** Divided into three sections: *Phase 1 Prices*, *Phase 2 Prices (Supposition)*, *Ledger*.
  *   **The Handout:** (See below).

  **The Probability Space (Public Knowledge):**
  *   Fair Die Roll: $\Omega = \{1, 2, 3, 4, 5, 6\}$.
  *   Event $A$ (High): $\{4, 5, 6\}$. $P(A) = 1/2$.
  *   Event $B$ (Even): $\{2, 4, 6\}$. $P(B) = 1/2$.
  *   $A \cap B$ (High & Even): $\{4, 6\}$. $P(A \cap B) = 1/3$.
  *   $P(B|A) = 2/3$.
  *   $P(A \supset B) = P(\{1, 2, 3, 4, 6\}) = 5/6$.

  ---

  ## 2. The Handout (One Page)

  **MARKET RULES & CONTRACT SPECIFICATIONS**

  **1. The Asset**
  A single fair die will be rolled at the end of the session. All contracts settle based on this outcome.

  **2. The Contracts**
  *   **PLAIN TICKET ($E$):** You pay the Posted Price. You receive **1 Chip** if $E$ occurs, **0** otherwise.
  *   **CONDITIONAL TICKET ($A \to B$):** You pay the Posted Price.
      *   If $A$ and $B$ occur: You receive **1 Chip**.
      *   If $A$ occurs and $B$ does not: You receive **0 Chips**.
      *   If $A$ does **not** occur: The trade is **VOID**. You receive your **Stake Back** (1 Chip).

  **3. The Desk's Duty**
  *   The Desk must post a buying/selling price for every contract.
  *   **Coherence Rule:** Prices must not allow a Customer to construct a "Dutch Book" (a combination of buys/sells that guarantees the Desk a loss regardless of the die roll).
  *   **Shared Pool:** All Desk profits/losses come from a central pool of 50 White Chips. If the pool empties, the seminar ends in default.

  **4. Phase 2: Supposition**
  *   The Desk will be asked to re-quote prices *conditional on a scenario* (e.g., "Suppose we know the roll is Low").
  *   **Consistency Rule:** Your Phase 1 prices must be the weighted average of your Phase 2 scenario prices. (Law of Total Probability).

  **5. Settlement**
  *   After trading closes, the die is rolled.
  *   The Desk pays the Customer from the Pool.
  *   Remaining chips are divided among the Desk.

  ---

  ## 3. Minute-by-Minute Plan (90 Minutes)

  ### 00:00 – 00:15: Setup & Intuition Check
  *   Distribute Handout. Place Die and Pool (50 White Chips) in center.
  *   **Briefing:** "You are the Market. I am the Customer. Your goal: Keep the Pool intact. My goal: Profit from your incoherence."
  *   **Calibration:** Ask for prices on Plain $A$ (High) and Plain $B$ (Even).
      *   *Expected:* 0.50 each. Write on board.
      *   *Check:* If they say 0.6, ask "Can I sell you 100 of these?" Force them to 0.5 via arbitrage intuition.
  *   **The Conditional:** Introduce Contract $C$ ($A \to B$). Read the "Void" rule aloud.
      *   *Ask:* "What is the fair price?"
      *   *Target:* They should say $2/3$ (0.67). This relies on the "Void = Refund" intuition making EV = $P(B|A)$.
      *   *Action:* Lock this price on the board. **Do not explain why.** Let it be their consensus.

  ### 00:15 – 00:35: Phase 1 Trading (The Trap is Set)
  *   Open Market for 5 minutes. You (Customer) make small, innocuous trades to establish liquidity.
      *   Buy 2 Plain $A$. Sell 2 Plain $B$.
      *   **Crucial Move:** Buy 5 Conditional Tickets at 0.67.
      *   *Desk Reaction:* They should feel comfortable. 0.67 feels right for "If High, then Even".
  *   Close Phase 1 Trading. Record positions.
  *   **The Constraint:** Remind them they cannot change Phase 1 prices. They are booked.

  ### 00:35 – 00:55: Phase 2 Supposition (The Squeeze)
  *   **Announcement:** "We are now in Scenario ~A (The roll is Low: 1, 2, 3)."
  *   **Task:** "Re-quote the Conditional Ticket $C$ *in this scenario*."
  *   **The Conflict:**
      *   The contract rule says: If ~A, the ticket is **Void/Stake Returned**.
      *   In this scenario, ~A is *known* to be true.
      *   Therefore, the ticket *will* be Void. It returns 1 Chip for sure.
      *   **Question:** "What is the price of a ticket that definitely returns 1 Chip?"
      *   **Target Answer:** 1.0.
  *   **The Escape Attempt (Anticipated):** A student will say, "But if ~A, the conditional is *True* (Material), so it pays 1."
      *   **Your Move:** "Agreed. Whether because it's True or because it's Void/Refund, the payout is 1. So the Price must be 1.0."
      *   Write **Price($C | \sim A$) = 1.0** on the board.
  *   **The Second Scenario:** "Now Scenario A (The roll is High)."
      *   Here, the ticket pays 1 if Even, 0 if Odd.
      *   **Price($C | A$):** Must be $P(B|A) = 2/3$ (0.67).
      *   Write **Price($C | A$) = 0.67** on the board.

  ### 00:55 – 01:05: The Coherence Check (The Collapse)
  *   Point to the Board.
      *   Phase 1 Price (Booked): **0.67**
      *   Phase 2 Prices: **0.67** (if A) and **1.0** (if ~A).
  *   **Ask:** "Is the Desk Coherent?"
  *   **Calculation (Student led):**
      *   Fair Price should be: $P(A) \times 0.67 + P(\sim A) \times 1.0$
      *   $= 0.5 \times 0.67 + 0.5 \times 1.0$
      *   $= 0.335 + 0.5 = \mathbf{0.835}$
  *   **The Realization:** The Desk booked tickets at **0.67** that are actually worth **0.835**.
  *   **The Cost:** You (Customer) announce you are exercising your Phase 1 positions.
      *   You hold 5 Conditional Tickets bought at 0.67.
      *   True Value: 0.835.
      *   **Desk Loss:** $5 \times (0.835 - 0.67) \approx 0.85$ Chips.
      *   *Escalation:* "I want to buy 20 more at the booked price of 0.67." (If rules allow post-hoc trading).
      *   *If rules forbid:* "I hold 5. The Pool must cover the expected loss. Transfer 1 Chip from Pool to Customer as 'Expected Value Settlement'."
      *   **Visual:** Move a chip from the Shared Pool to your stack. The Pool shrinks. The Desk feels the pain.

  ### 01:05 – 01:15: The Material Escape (Handling the Objection)
  *   **Student Objection:** "We should have priced it at 5/6 (0.83) initially! That's the Material Conditional probability. Then we'd be coherent."
  *   **The Trap:** "Okay. Let's test that."
  *   **Scenario:** "Suppose I offer you a new contract: Pays 1 if ($A \to B$) is **False**."
  *   **Material View:** ($A \to B$) is False only if $A$ & ~B (Roll is 5). Probability 1/6. Price 0.17.
  *   **Void/Refund View:** If ~A, the contract is Void. It cannot be False. It is only False if $A$ & ~B.
  *   **The Kicker:** "If you price the Conditional as Material (0.83), you admit it has a truth value when ~A. If it has a truth value when ~A, why did you agree to the **Void/Refund** rule in the Handout?"
  *   **The Cost:** "If you price as Material, you must pay out 1 on ~A as a **Win**, not a **Refund**. The Handout says Refund. If you change the payout to match your Material Price, you violate the Contract Rules. If you keep the Refund Rule, you cannot price as Material without being Dutch-Booked (as you just saw)."
  *   **Action:** Make them choose: Violate Handout (Price 0.83, Pay Win) OR Violate Coherence (Price 0.67, Pay Refund).
  *   **Result:** They chose Coherence + Refund. This forced the loss.

  ### 01:15 – 01:30: Debrief & Mapping
  *   Do not write formulas. Use the board history.
  *   **Map the Steps:**
      1.  **Trading the Ticket:** You treated $A \to B$ as an asset with a price. (Assumption: Conditionals are propositions).
      2.  **The Void Rule:** You priced it at $P(B|A)$ because ~A meant 'Refund'. (Assumption: $P(A \to B) = P(B|A)$).
      3.  **Phase 2 Re-quote:** You priced it at 1.0 given ~A. (Assumption: Law of Total Probability applies).
      4.  **The Collapse:** $0.67 \neq 0.5(0.67) + 0.5(1.0)$.
  *   **The Conclusion:** "You cannot hold all three.
      1.  Conditionals are propositions (tradeable in all worlds).
      2.  Probability of Conditional = Conditional Probability.
      3.  Probability is non-trivial (0.67 $\neq$ 0.83).
      *   Most philosophers drop #1. The conditional is not a proposition. It has no truth value when ~A. It is not 'True', it is 'Void'."
  *   **Final Note:** "If you drop #1, you cannot trade it as a standard ticket. You can only bet on it conditionally. That is why the 'Called Off Bet' is the only coherent way to handle indicatives."

  ---

  ## 4. Troubleshooting & Failure Modes

  **Failure 1: The "Void = 0" Mistake**
  *   *Risk:* Students treat "Void" as "Pays 0" instead of "Stake Returned".
  *   *Consequence:* Price becomes $P(A \cap B) = 1/3$. The triviality argument breaks.
  *   *Fix:* In Phase 1, if they price at 0.33, ask: "If I roll a 1, do I get my chip back?" If they say "Yes", ask "Then why is the price 0.33? You get 1 back on 1,2,3." Force them to 0.67.

  **Failure 2: Refusing Phase 2 Prices**
  *   *Risk:* Students say "You can't price a conditional if A is false."
  *   *Consequence:* The trap doesn't spring.
  *   *Fix:* Invoke the **Market Maker Duty** (Handout Rule 3). "To remain a Desk, you must post a price for every instrument in every scenario. If you post 'N/A', I (Customer) will assume you are insolvent and close the pool." Force a number.

  **Failure 3: The Material Conditional Escape (Detailed)**
  *   *Risk:* They insist $P(A \to B) = P(A \supset B) = 5/6$.
  *   *Consequence:* They avoid the collapse ($5/6 = 0.5(2/3) + 0.5(1)$).
  *   *Fix:* This is where the **Handout Rule 2** becomes the weapon.
      *   "You priced at 5/6. That implies the ticket pays 1 on ~A as a **Win**."
      *   "Handout Rule 2 says ~A is a **Refund**."
      *   "I am the Customer. I will Buy the ticket at 5/6. If ~A occurs, you give me my stake back (1). I paid 5/6. I profit 1/6."
      *   "If you want to pay me 1 as a Win, you must change the Handout. Do you want to rewrite the contract mid-game?"
      *   *The Cost:* They realize that pricing as Material *while keeping the Void rule* creates an arbitrage opportunity for the Customer (Buy at 5/6, Get Refund 1). Wait, if they price at 5/6 and Pay Refund 1, Customer profits. If they price at 2/3 and Pay Refund 1, Customer profits *more*.
      *   *Correction:* The "Cost" of the Material Escape is that it forces them to admit the Conditional is True when ~A. In the Debrief, I press: "If it's True when ~A, why did you feel the 'Refund' rule was natural in Phase 1?" The cognitive dissonance is the cost.

  **Failure 4: Boredom/Confusion on Chips**
  *   *Risk:* Chip accounting slows down.
  *   *Fix:* Use "Expected Value Settlement" for the final blow. Don't actually roll the die for the arbitrage profit. Calculate the EV difference and move chips. It's faster and mathematically cleaner for the lesson.

