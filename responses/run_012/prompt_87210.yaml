      *   *Mocking:* The analogy of "Mocking" is strong. The fire object is a Mock Object. It records the call but doesn't execute the logic.
      *   *Causal Ordering:* In distributed systems, "happens-before" is crucial. In occasionalism, the occasion precedes the effect, but not causally. I need to make sure the log ordering reflects this.
      *   *Hume vs. Ghazali:* This needs careful handling. Hume is skeptical about *knowing* necessity. Ghazali denies the *existence* of necessity in creatures. In code, if I can't see the link, it's Hume. If the architecture *prevents* the link, it's Ghazali.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Translation first? Yes.
      *   Residue report second? Yes.
      *   Three buckets? Yes.
      *   Hume vs. Ghazali specific focus? Yes.
      *   Caricature check? Yes.
      *   Verdict? Yes.

