answer: |-
  This is a sharp reconstruction of Gödel's 1949 argument, and your instinct is correct: there is a slip, but it's not in the physics. It's in the metaphysics bridging the physics to the conclusion.

  You asked which step to reject, whether this condemns Special Relativity (SR), what work step (7) is doing, and what happens to your "13.8 billion years" line. Here is the breakdown.

  ### 1. Does this condemn Special Relativity?
  **Yes.** In fact, this argument is often viewed as Gödel's way of tightening the noose that SR had already placed around the "flowing now."

  In SR, there is no global simultaneity. If your Premise (3) is true ("Real time... just is that global ticking"), then SR *already* proves time isn't real. Many philosophers hoped General Relativity (GR) might save absolute time by allowing a preferred slicing based on the distribution of matter (a "cosmic time"). Gödel's genius was to construct a GR solution that satisfies Einstein's equations but *still* forbids a global "now."

  So, if you accept (3), you don't need Gödel to kill the flowing now; SR did it in 1905. Gödel's contribution was to show that even if you try to rescue absolute time using the machinery of GR, you still can't do it without ruling out physically valid solutions.

  ### 2. The Exit Point: Reject Premise (3)
  The cleanest way to keep the physics (2) and the diagnosis of the Gödel universe (4) without swallowing the conclusion (8) is to **reject Premise (3).**

  > **(3) Real time — the flowing now, the thing that makes the past gone and the future open — just is that global ticking.**

  This premise defines "Real Time" as **A-Theory Time** (Presentism/Flow). Most philosophers of physics and working cosmologists operate on **B-Theory Time** (Eternalism/Block Universe).
  *   **If you reject (3):** You redefine "Real Time" not as a universal flow, but as the structure of causal ordering and proper time along worldlines.
  *   **The Cost:** You have to admit that the "flow" of time is psychological or thermodynamic, not fundamental. The past is not "gone"; it is simply at a different coordinate. The future is not "open"; it is simply at a different coordinate.
  *   **The Gain:** You keep time as a real dimension of the manifold. Time exists in the Gödel universe (as a coordinate in the metric), and it exists in ours. You just lose the "universal clock."

  This is the standard "physicist's escape." It allows you to say: "Gödel proved there is no *universal master clock*. He did not prove that time as a dimension is unreal."

  ### 3. The Philosophical Trap: Step (7)
  If you want to fight on metaphysical grounds and keep a robust notion of time, you have to attack **(7)**, the "no free lunch for the now" principle.

  > **(7) But if something as fundamental as the passage of time can be present or absent depending on a contingent global fact... then it was never a feature of reality to begin with.**

  This is a modal argument. It claims that if a property (Time) is fundamental, it cannot be contingent.
  *   **What work is it doing?** It is bridging the gap between "Time doesn't exist in the Gödel model" and "Time doesn't exist in our model." It argues that the *concept* of time must be stable across possible worlds. If the existence of time depends on the angular momentum of the universe, time is not a fundamental feature of reality, but an emergent artifact of specific matter distributions.
  *   **How to reject it:** You can argue that fundamentality does not require universality across all possible worlds. For example, "fluidity" is a real property of water, but it disappears if you cool water to 0°C. Does that mean fluidity was never real? No, it means it depends on contingent conditions (temperature).
  *   **The Cost:** You have to argue that Time is like "fluidity"—a real, emergent property that arises only in certain cosmological configurations (like ours, which is expanding and non-rotating). This makes time less "fundamental" than space or charge, which is a hard pill for a realist to swallow.

  ### 4. Did Gödel need Step (7)?
  Gödel's original argument was slightly cheaper. He didn't rely heavily on the "undetectability" clause in (7). His core move was:
  1.  The nature of time should not depend on the particular distribution of matter (a philosophical intuition about fundamentality).
  2.  In the Gödel universe, the distribution of matter precludes the existence of objective time (due to CTCs).
  3.  Therefore, objective time does not exist in the Gödel universe.
  4.  Since the laws of physics (GR) allow the Gödel universe, the existence of objective time is not necessitated by the laws of nature.
  5.  If the existence of time is contingent on matter distribution, it is not absolute.
  6.  Therefore, time is ideal.

  Your philosopher's Step (7) is a modern, polished version of Gödel's intuition that **fundamental reality shouldn't hang on contingent cosmology.** Gödel didn't need the "undetectable" part; he just needed the "contingent" part.

  ### 5. What happens to "The universe is 13.8 billion years old"?
  If you swallow (8) and agree time is "ideal," does this sentence become false? **No.** But its meaning shifts.

  *   **Before (Absolute Time):** This means "13.8 billion ticks of the Universal Clock have occurred since the Singularity."
  *   **After (Gödel/Relativistic Time):** This means "13.8 billion years of **proper time** have elapsed along the worldline of a comoving observer (an observer moving with the Hubble flow) since the Big Bang."

  In our actual universe (Lambda-CDM), we *do* have a preferred cosmic time because the universe is homogeneous and isotropic on large scales. We can define a "cosmic now" based on the Cosmic Microwave Background (CMB).
  *   **The Gödel Counter:** The philosopher will say, "Aha! So the 'age' is only real because we happen to live in a non-rotating bubble. If we were in a Gödel bubble, the sentence would be meaningless. Therefore, the 'age' is parochial."
  *   **Your Defense:** You can report that the sentence is physically robust *for our universe*. It refers to a measurable quantity (the expansion factor and CMB temperature). Whether that quantity represents "The Flow of Time" or "The Length of a Worldline" is metaphysics, not cosmology.

  ### Summary for your Reporting
  You can keep (2) and (4) without accepting (8) by making the following distinction clear in your piece:

  1.  **Gödel killed "Universal Time," not "Time."** He proved there is no master clock that ticks for the whole universe simultaneously.
  2.  **The "Flow" is the casualty.** Premise (3) is the definition of time that fails. If you define time as a dimension (B-Theory), Gödel's universe has plenty of it. If you define time as a universal flow (A-Theory), Gödel proves that definition is incompatible with GR.
  3.  **The "13.8 Billion Years" line survives** as a measure of proper time along our specific cosmic worldline, not as a measure of absolute duration.

  **The Verdict:** Reject **(3)**. It is the definition that carries the baggage. The physics (2) is sound. The diagnosis (4) is sound *for that definition*. The generalization (8) only follows if you insist that the only "real" time is the one Gödel just proved impossible in his model. Most physicists agree with Gödel that *that specific kind* of time (absolute, global flow) isn't real, but they disagree that *nothing* worthy of the name "time" remains.

  Tell your philosopher friend: "Gödel proved the **A-Theory** of time is incompatible with General Relativity. He did not prove the **B-Theory** is false. Unless you can prove B-Theory time is also 'ideal,' you haven't killed time, you've just killed the 'now'."
