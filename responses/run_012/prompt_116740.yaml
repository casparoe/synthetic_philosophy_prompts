answer: |-
  **FREQUENTLY ASKED QUESTIONS | THE EXCHANGE**

  **1. How are exchange rates determined?**
  Values are assessed at the counter based on current market density. Please note that The Exchange operates on a spread. If you wish to trade Integrity for Career Advancement, the teller will quote the rate of conversion minus the administrative fee. Rates are fixed for the duration of the transaction. Do not attempt to haggle using emotional leverage; it is not recognized as currency.

  **2. I keep asking for a slightly better version of Option A, but I never reach a point where I prefer Option B. What do I do?**
  This is a Non-Archimedean Preference Loop. Please submit Form 88-B (Non-Convergent Adjustment). Most of our paperwork is dedicated to this specific scenario. You may continue to adjust the parameters of Option A indefinitely. However, please be advised that until you reach a point of indifference, no trade can be executed. There is no penalty for looping, but there is no service provided either. Take a number.

  **3. The comparison form only has boxes for "Better," "Worse," and "Equal." What if neither is better, but they aren't equal?**
  Select Category IV: Incommensurable. This indicates that the two values occupy different normative dimensions and cannot be ranked ordinally. Do not force a ranking. Forcing a ranking where none exists will result in the voiding of your ticket and a brief existential dizzy spell. Our system accepts Category IV as a valid terminal state.

  **4. Isn't this just uncertainty? I don't know how good either option is.**
  No. Uncertainty implies a lack of information. The Exchange operates under a premise of complete information. We know the value of the Integrity. We know the value of the Advancement. The problem is not that the values are unknown; it is that they are distinct. Please do not confuse epistemic limitation with ontological distinctness. The teller is not guessing.

  **5. Are there items The Exchange cannot accept?**
  Yes. We cannot process goods where the act of trading destroys the good itself. This includes Unconditional Regard, Genuine Friendship, and Moral Worth. If you offer these at the counter, they cease to be what they are the moment you attempt to price them. We cannot take delivery of nothing. Please do not place these items on the tray.

  **6. Can I trade for a package deal? I want both Integrity and Advancement.**
  You may visit the Package-Deal Counter. The teller will grant that possessing both goods together is preferable to possessing either alone. This is known as superadditivity. However, acknowledging that the bundle is superior to the components settles nothing regarding the cost of acquisition. You will still be required to tender payment. Preferencing the bundle does not exempt you from the spread.

  **7. Is The Exchange affiliated with my employer?**
  We are a neutral utility. We process the values you bring us. Whether the rates are fair is a matter of record. Whether you should have entered the building is a matter of conscience. We do not track conscience. Please have your credentials ready.
