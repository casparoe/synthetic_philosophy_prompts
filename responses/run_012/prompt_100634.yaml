  Imagine two speakers, Elara and Twin-Elara, who are intrinsic physical duplicates residing in distinct linguistic communities that both utilize the term flax to denote the exact same fibrous plant species, Linum usitatissimum. In Elara's community, the term was introduced by botanists who rigidly designated the reference via the plant's specific genetic sequence, such that any organism lacking that sequence would not count as flax regardless of appearance. In Twin-Elara's community, the term was introduced by weavers who designated the reference via the functional property of producing long, spinnable fibers, such that any plant producing such fibers would count as flax regardless of genetics. As it happens, in both worlds, only Linum usitatissimum possesses both the specific genetic sequence and the spinnable fibers, so the actual extension of the term is identical for both speakers, yet the criteria governing the term's application in counterfactual situations diverge sharply because one community defers to genetic essence while the other defers to functional capacity.

  A Putnam-style causal externalist would argue that despite the identical reference, the meanings differ because the semantic value includes the method of reference fixing, meaning Elara's concept carries a structural essentialism while Twin-Elara's carries a functionalism, which alters the truth conditions of modal claims involving the term. A Burge-style social externalist would agree that the meanings differ but would ground this in the normative practices of their respective communities, arguing that Elara is subject to correctness conditions imposed by botanical experts while Twin-Elara is subject to conditions imposed by artisanal experts, making their individual contents dependent on these distinct social divisions of labor. A two-factor theorist would concede that the wide content differs due to these environmental and historical factors but would insist that the narrow content remains identical, preserving the psychological equivalence required to explain why both speakers behave identically when discussing or handling the plant.

  The load-bearing feature here is the divergent reference-fixing description maintained by the respective communities, specifically the contrast between essentialist and functionalist criteria, for if you strip this out and stipulate that both communities fixed the reference via the same method, the grounds for distinguishing their meanings collapse and the case reverts to standard internalist identity. An internalist would attack this by arguing that since the speakers are molecule-for-molecule identical and interact with their environments in exactly the same way, the historical accident of how their ancestors defined the term cannot alter the cognitive significance of the term for the speakers themselves, rendering the alleged difference in meaning a metaphysical illusion that bears no weight on psychological explanation or rational agency.
