answer: |-
  **Brainstorming Objections**

  *   **Defender's Best Objection:** The Skeptic claims the test relies on subjective judgments of "credibility." But the Defender can argue that we observe *actual* handovers and institutional mechanics. If a party loses and leaves, the institutions held. If they change rules so they *can't* lose effectively (e.g., gerrymandering so severe a majority vote yields minority seats, or packing courts so they overturn elections), that's observable behavior, not just vibe. The counterfactual isn't magic; it's based on institutional mechanics.
  *   **Skeptic's Best Objection:** The test assumes "electoral competition" is the only legitimate form of power transfer. But what if the previous regime was authoritarian? A reforming coalition might need to "entrench" reforms (e.g., constitutional courts) to prevent backsliding *by the authoritarians*. The Handover Test calls this backsliding because it makes it harder for the *next* incumbent to lose power (by limiting their scope). So the test conflates "protecting democracy" with "entrenching power." It requires a prior normative theory of *which* powers should be contestable.

  ***

  **Dialogue: The Handover Test**

  **Alex (Defender):** Let's cut through the noise. "Democratic backsliding" has become a thick concept so laden with evaluation that it risks losing its descriptive grip. Every policy loss feels like democratic decay to the loser. That's why I propose the Handover Test. It's simple: an institutional change counts as backsliding just in case it reduces the likelihood that an electoral defeat would in fact cost the incumbent power. It's behavioral, symmetric, and avoids asking whether the policy is "good." It asks: does this make it harder to throw the bums out?

  **Jordan (Skeptic):** It's elegant, Alex, but elegance isn't validity. You claim symmetry, but the test relocates the measurement problem rather than solving it. You're relying on a counterfactual: *would* defeat cost them power? To answer that, you have to judge the credibility of the institution. If I say the court is independent, and you say it's captured, we aren't measuring behavior; we're measuring our priors. The counterfactual cannot be falsified before the fact. Until the election happens and the loser refuses to leave, you're just guessing about likelihoods.

  **Alex:** That's too harsh. We don't need to wait for the explosion to judge the fuse. Look at Hungary. Orbán's government rewrote the electoral law and packed the media council. Under the Handover Test, we ask: if Fidesz loses the popular vote, do these changes reduce the likelihood they actually leave power? Yes. The gerrymandering means a minority of votes can sustain a majority of seats. The media control means the opposition cannot effectively campaign. The likelihood of defeat costing them power is reduced. That's not a subjective vibe; it's a mechanical assessment of vote-to-seat conversion.

  **Jordan:** But that mechanical assessment relies on a baseline you haven't justified. Why is the pre-Orbán electoral map the neutral baseline? Fidesz supporters argue the previous system allowed rural overrepresentation that favored the left. If you change the rules to correct a perceived bias, you are altering the likelihood of defeat costing power. Your test labels *any* change to the rules of competition as backsliding if it advantages the incumbent's survival. But sometimes incumbents win because they are popular, and they change rules to reflect that popularity. Your test struggles to distinguish between "entrenching power" and "correcting a broken system."

  **Alex:** I concede the baseline problem is tricky, but it's not fatal. We can use comparative benchmarks. If Hungary's vote-to-seat elasticity falls outside the norm of established democracies, we flag it. But let's look at the United States. Consider the threat of packing the Supreme Court. If a party threatens to expand the court to ensure their legislation survives even if they lose the next election, that fails the Handover Test. It reduces the likelihood that defeat costs them power, because their policy power is now insulated from electoral turnover. It applies symmetrically. If Republicans did it, same verdict. It rescues the concept from partisanship.

  **Jordan:** Here is where the test conceals a substantive commitment. You say packing the court is backsliding because it insulates policy from electoral turnover. But suppose the Court was previously captured by the *preceding* administration to block democratic reforms. A reforming coalition expands the court to restore balance. Under your test, this looks like backsliding. Why? Because it reduces the likelihood that *their* future defeat will cost them power—their reforms will survive via the court. You are forced to condemn them unless you smuggle in a normative distinction between entrenchment that serves electoral competition and entrenchment that defeats it. But the test itself doesn't provide that distinction. It treats all insulation of power as equal.

  **Alex:** That's a strong point. I will concede that the Handover Test cannot distinguish between "good" entrenchment (protecting rights) and "bad" entrenchment (protecting incumbency) without an external normative baseline. It measures the *capacity* to retain power, not the *legitimacy* of doing so. However, isn't that a feature, not a bug? If we start defining which entrenchment is "good," we return to the partisan labeling problem. One side says "protecting rights," the other says "judicial activism." The Handover Test at least forces us to admit: yes, this reduces electoral accountability. Whether that's justified is a separate debate.

  **Jordan:** But if we can't separate them, the concept of "backsliding" loses its critical bite. If protecting minority rights looks structurally identical to protecting incumbent power, then "backsliding" just means "changing the stakes of office." I need to offer a positive alternative, not just a critique. Instead of the Handover Test, I propose a **Contestation Scope Test**. We shouldn't ask only if power is retained, but *over what* power is retained. Backsliding occurs when incumbents remove specific domains from the scope of future contestation—like voting access or opposition funding—rather than merely insulating policy outcomes.

  **Alex:** So you're distinguishing between insulating *outcomes* versus insulating the *process*?

  **Jordan:** Exactly. If I pack a court to protect abortion rights, I am insulating an outcome. If I pack an election commission to make it harder for the opposition to register, I am narrowing the scope of contestation. The Handover Test conflates these because both reduce the likelihood that defeat costs the incumbent influence. But only the latter is democratic decay. The former is just politics.

  **Alex:** I see the appeal. But isn't "scope of contestation" just as thick? Who decides which domains should be contestable? Economic policy? Human rights? If I say human rights are off-limits to majorities, and you say everything should be contestable, we're back to square one. However, I will concede this: The Handover Test is too blunt. It treats a change in voting age the same as a change in judicial tenure if both alter the probability of incumbent survival. We need to weight the *mechanism*, not just the outcome.

  **Jordan:** And I concede that your focus on behavioral symmetry is vital. My Contestation Scope Test must avoid becoming a wish list for my preferred policies. It needs to rely on observable restrictions on entry and competition, not just policy outcomes. But this brings us to the crux. You want to measure the *probability of power retention*. I want to measure the *legitimacy of power insulation*.

  **Alex:** Precisely. And we can't resolve that without agreeing on what "power" is in the test.

  **Jordan:** So here is where we must stop. We have narrowed it down. The disagreement isn't about whether backsliding exists, or even about the cases. It's about whether "incumbent power" can be defined descriptively.

  **Alex:** Let me formulate the precise question. **Is "power" in the Handover Test a descriptive variable regarding the capacity to hold office, or a normative variable regarding the legitimate scope of authority?**

  **Jordan:** Yes. If it's descriptive, my Court-packing counterexample stands, and your test condemns democratic strengthening. If it's normative, your test loses its behavioral symmetry and becomes dependent on the observer's theory of legitimacy.

  **Alex:** Then the task for political science is not to refine the test, but to answer that question. Can we measure the capacity to retain power without implicitly judging the legitimacy of the power retained?

  **Jordan:** Until we can, "backsliding" remains a thick concept that demands both measurement and judgment. We cannot have the former without the latter.

  **Alex:** Agreed. The Handover Test measures the shadow; you're asking us to identify the object casting it. We need both to know if the monster is real.
