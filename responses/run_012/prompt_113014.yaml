  I'm reading Schopenhauer's essay "On the Sufferings of the World" (the Saunders translation) and the first couple of pages have me stuck. Here's the stretch I keep rereading:

  "Unless suffering is the direct and immediate object of life, our existence must entirely fail of its aim. [...] I know of no greater absurdity than that propounded by most systems of philosophy in declaring evil to be negative in its character. Evil is just what is positive; it makes its own existence felt. [...] It is the good which is negative; in other words, happiness and satisfaction always imply some desire fulfilled, some state of pain brought to an end. This explains the fact that we generally find pleasure to be not nearly so pleasant as we expected, and pain very much more painful. The pleasure in this world, it has been said, outweighs the pain; or, at any rate, there is an even balance between the two. If the reader wishes to see shortly whether this statement is true, let him compare the respective feelings of two animals, one of which is engaged in eating the other."

  And a bit further down, which I think bears on it: "No little part of the torment of existence lies in this, that Time is continually pressing upon us, never letting us take breath, but always coming after us, like a taskmaster with a whip. If at any moment Time stays his hand, it is only when we are delivered over to the misery of boredom."

  What I can't figure out is what work "negative" is doing here, and whether that's one claim or two. I take the point of "happiness is negative" to be that satisfaction is parasitic: it's always the ending of some want, so pleasure is defined by the pain it removes. But that sounds like a claim about where pleasure comes from, not about what it's worth — and then two sentences later he's asking me to compare the feelings of two animals as if he's weighing pleasure and pain on a scale. So is he running one argument or two, and which premise is carrying the weight in each? And does either version actually get you the thing everyone pins on him, that suffering is the only thing that really matters, or that it would have been better if none of this existed — or is that a further step he hasn't taken yet? Specifically I want to know whether the parasitic reading of "negative" delivers any asymmetry between pleasure and pain at all, or whether it's fully compatible with pleasure being enormously valuable whenever you do get it. Then tell me what that reading does with the boredom bit, since boredom looks like a torment that isn't the ending of any want.

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, and don't restate the question. American English, and no citations please, I just want the reading.
