answer: |-
  Congratulations to the class of this year. Looking out at this sea of gowns, I see the result of four years of calculus, thermodynamics, and late nights in the lab. You have earned the right to stand here. You have earned the right to build what comes next. And because you are engineers, you are trained to look for the load-bearing walls in any structure. You know that if a beam is hidden behind drywall, it still holds the weight. Today, I want to ask you to look for the load-bearing walls in the arguments you will hear for the rest of your careers, specifically about the work you are about to do.

  We talk a great deal about space settlement in this department. We talk about Mars. We talk about making humanity a multi-planetary species. These are compelling visions. They are backed by data, by trajectories, by life-support calculations. But I want to suggest that the most critical part of those sentences is not the noun, and it is not the data. It is the verb.

  Consider the phrase we use most often. We say we will settle Mars. Think about that word. Settle. It implies a restlessness that needs resolving. It implies a home that is waiting to be made. Or consider the phrase that humanity needs a backup drive. The physics of a hard drive are neutral. The word backup is not. It tells you that civilization is fragile, that it is worth preserving in exactly this form, and that extinction is the primary enemy to be engineered around. When we say we will open the frontier, the verb open suggests that the door was locked for our benefit, rather than closed for its own sake.

  In every one of these cases, the evaluation is already smuggled in before any inference even gets going. We treat these verbs as descriptions of physical actions, as if they were just another variable in a system equation. But they are not. They are values disguised as movements. They are oughts hiding inside ises.

  I know there are colleagues of mine sitting in the back row who recognize this mechanism. They know that you cannot derive an ought from an is. But I am not here to give a lecture on meta-ethics. I am here to point out that when you graduate today, you become the people who turn the ought into the is. You are the bridge. When you calculate the fuel load for a mission described as saving humanity, you are not just solving for thrust. You are validating the verb save. You are making the value real.

  This is where the ground might feel like it shifts beneath you. You have spent four years learning that the universe is indifferent to your hopes. Gravity does not care if you are good. Orbital mechanics does not care if you are just. And yet, the moment you apply that mechanics to a human goal, you are importing morality into the indifferent universe. You are deciding that certain outcomes are better than others.

  It is tempting to think that this moral weight belongs to the administrators, or the investors, or the politicians who sign the checks. It is tempting to say, I just build the rocket. They decide where it goes. But that is a surrender of your agency. The engineer defines the possible. When you say something can be done, you change the landscape of what should be done. If you design a system that makes colonization cheap and easy, you have made colonization inevitable. You have voted for it with your wrenches and your code.

  I am not telling you to stop. I am not telling you that the stars are forbidden. I am telling you that you must not sleepwalk into the future. Do not let the verbs choose you. Do not let the momentum of a slogan dictate the trajectory of a species. When you hear a mission statement, strip away the nouns. Look at the action. Ask yourself if you endorse the value hidden in the word.

  If the goal is to expand, ask what is being expanded and at what cost. If the goal is to preserve, ask what is being preserved and why it deserves immortality. If the goal is to explore, ask who is doing the exploring and who is being explored. These are not questions for the philosophy department to solve while you wait in the hangar. These are engineering constraints. A value system that cannot withstand scrutiny is a flawed design. It will fail under load.

  You are leaving this university with the power to alter the physical world. That is a rare and terrifying gift. Most people live in a world that is given to them. You will live in a world you have built. So, build it with your eyes open. Do not hide the values in the verbs. Speak them. Own them. If you believe humanity deserves a second chance, say so. If you believe knowledge is worth the risk, say so. But do not pretend that the rocket is neutral.

  The universe is vast and it is silent. It will not tell you what to do. It will only respond to what you build. So when you stand on the launchpad of your careers, do not just check the fuel levels. Check the language. Choose your verbs with the same precision you choose your materials. Because once you launch them, you cannot call them back. Congratulations, and go well.
