      *   Dana's conclusion (full debt remains) might be too strong if the *harm* to the specific victim cannot be addressed (they are dead).

  7.  **Evaluating the User's Counter-Analogy (State as Firm):**
      *   *Pros:* Firms persist through total staff turnover. Firms owe debts regardless of who signed the contract. Firms don't need "feelings" to apologize (PR statement + compensation).
      *   *Cons:* Firms are instrumental entities, not moral agents in the full sense (though legal persons). Holding a firm responsible is pragmatic, not necessarily moral.
      *   *Does it relocate the problem?* Yes, it moves it from "Metaphysics of Personhood" to "Nature of Institutional Obligation." It avoids the "feeling" trap.
      *   *Verdict:* It's better for *reparations*, worse for *apology* (which implies moral regret). But maybe "apology" is the wrong word for states anyway.

