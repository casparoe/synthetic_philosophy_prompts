  2.  **Deconstruct Dana's Argument (The "Continuity Thesis"):**
      *   *Premise 1:* States are moral agents analogous to persons.
      *   *Premise 2:* Personal identity persists through time despite physical/psychological change (Lockean/Parfit-adjacent but applied to institutions).
      *   *Conclusion:* Current citizens = Past citizens (same agent). Therefore, current state owes apology/reparation for past wrongs.
      *   *Strength:* Avoids the "non-identity problem" and the "changing of the guard" objection effectively *if* the analogy holds.
      *   *Weakness:* Metaphorical stretch on consciousness, memory, and suffering.

  3.  **Drafting the Correspondence Table:**
      *   Need to map: Agent, Victim, Memory, Remorse, Amends.
      *   *Individual:* Biological human, Specific harmed human, Neural/Biographical memory, Emotional regret + commitment to change, Personal sacrifice.
      *   *State:* Institution/Government (citizens + structures), Descendants/Successor groups, Archives/Commemoration, Official statements/Policy shifts, Tax revenue/Policy reform.

  4.  **Identifying the Breaks (Signal vs. Noise):**
      *   *Noise:* Legal personality (both have it), Ability to speak (both do), Ability to pay (both do).
      *   *Signal (The Breaks):*
          1.  *Phenomenology:* Individuals feel shame; states do not. Does this matter for *apology*?
