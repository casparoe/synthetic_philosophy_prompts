          3.  *Victimhood:* Individuals apologize to living victims (usually); states apologize to descendants or the dead.
          4.  *Agency Composition:* Individuals are unified by consciousness; states are unified by rules/coercion.

  5.  **Pressing the Pressure Points:**
      *   *Memory:* Is archival memory enough? If I forget I broke your window, am I still responsible? Yes. But if the *state* forgets, it's a bureaucratic failure, not a moral failing of consciousness.
      *   *Sincerity:* Dana says sincerity is required. But states can't "feel." If sincerity = feeling, states can't apologize. If sincerity = commitment to non-repetition, states *can* apologize. Dana needs to decouple sincerity from emotion.
      *   *The Addressee:* Individual apology repairs a relationship. State apology to the dead repairs... what? A relationship with the living descendants? Or the moral order?
      *   *Smuggled Assumption:* Dana smuggles in *biological continuity* as *moral continuity*. She assumes the "State" has a soul-like persistence.

  6.  **Evaluating Dana's Conclusion:**
