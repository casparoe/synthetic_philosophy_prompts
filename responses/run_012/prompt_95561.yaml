  *(Final check on "Standard vs. Relevant")*: Standard collective responsibility stuff is usually about "diffusion of responsibility" (no one is guilty). Dana is arguing *against* diffusion. The relevant bit here is the *temporal* identity, not the *distributed* identity. Focus on the time aspect.

