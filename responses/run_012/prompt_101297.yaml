answer: |-
  You have stumbled into the gap between the map and the territory. In the literature, these problems are clean: Omega exists, Omega is honest, Omega is powerful. In your committee room, the territory is muddy: the predictor is a person with a PDF, the power is rhetorical, and the honesty is unverified.

  I will be candid at the outset: there is no procedure that will allow you to safely make payments on the basis of unverified acausal claims without violating your fiduciary duty. In the absence of a verifiable Omega, decision-theoretic arguments are almost invariably rhetorical camouflage for bluff, extortion, or wishful thinking. Therefore, the only honest procedure I can give you is a **filter** designed to collapse these claims into standard causal assessment.

  However, to answer your request faithfully, I have constructed a protocol that respects the theoretical distinctions you value (act vs. policy, causal vs. functional) while enforcing the epistemic hygiene required of a trustee. It will tell you when to stop, when to pay, and where the calculation ends and the nerve begins.

  ### The Trustee's Causal Filter (TCF)

  This procedure is designed to be run in a meeting. It consists of five gates. If a proposal fails a gate, the process stops, and the grant is declined (or the pressure resisted).

  **Gate 1: The Verification of the Predictor (The Omega Test)**
  *   **Question:** Is the entity claiming to predict or condition outcomes on our decision verifiable *independently* of their own assertion? Can we audit their mechanism, their code, or their track record?
  *   **Sufficient Answer:** Yes, we have seen the source code, the audited logs, or a legal contract enforceable in court that binds the outcome to our choice.
  *   **Stop Point:** If the answer is "No," or "You have to trust the logic," or "It is a metaphysical claim."
  *   **Rationale:** In the real world, unverified prediction is indistinguishable from fraud. Functional Decision Theory (FDT) requires a functional link. Without verification, there is no function, only noise.
  *   **Inference vs. Judgement:** This is inference. If the mechanism cannot be inspected, the probability of it working as described is negligible.

  **Gate 2: The Causality of the Lever (The Intervention Test)**
  *   **Question:** Does paying the money *cause* the good outcome, or is it merely *evidence* of the good outcome? If we pay, does the mechanism physically change the world, or does it merely update the predictor's belief about us?
  *   **Sufficient Answer:** Paying triggers a physical or legal change (e.g., funds are released, termites are fumigated).
  *   **Stop Point:** If the argument is "Paying shows we are the *kind* of people who would pay, and therefore the predictor *would have* acted."
  *   **Rationale:** This distinguishes Causal Decision Theory (CDT) from Evidential Decision Theory (EDT). As trustees, you are liable for causal interventions, not evidential signalling.
  *   **Inference vs. Judgement:** Inference. Correlation is not causation.

  **Gate 3: The Recurrence of the Choice (The Policy Test)**
  *   **Question:** Is this a one-off transaction, or is it establishing a precedent (a policy) that will be observed by other agents (human or algorithmic) in future interactions?
  *   **Sufficient Answer:** It is a recurring scenario, or the outcome of this specific act will be publicly known and used to calibrate future trust.
  *   **Stop Point:** If the claim is that the benefit accrues *only* to a counterfactual version of you in a branch of reality you will never observe (pure Counterfactual Mugging).
  *   **Rationale:** FDT wins on policy, not on isolated acts. If the benefit is entirely in a counterfactual branch you cannot access, the charitable return is zero. If the benefit is reputational (other humans see you pay), it is causal.
  *   **Inference vs. Judgement:** Judgement. You must decide if the "audience" is real enough to matter.

  **Gate 4: The Beneficiary of the Upside (The Charity Test)**
  *   **Question:** Who receives the benefit of the cooperative answer? Is it the fund, the beneficiaries, or a counterpart self?
  *   **Sufficient Answer:** The benefit accrues to the charitable objects (the people or causes you are mandated to help).
  *   **Stop Point:** If the benefit is "You avoid being punished" (negative utility) or "Your counterpart in another branch gets rich" (no utility for your beneficiaries).
  *   **Rationale:** Charity law requires you to act in the interest of the beneficiaries, not to minimise your own metaphysical risk or enrich counterfactual selves.
  *   **Inference vs. Judgement:** Inference (legal/fiduciary).

  **Gate 5: The Exit to Value (The Nerve Test)**
  *   **Question:** If Gates 1–4 are passed (a rare event), does the committee accept the risk that the predictor might still be lying?
  *   **Sufficient Answer:** A unanimous vote to proceed despite residual epistemic risk.
  *   **Stop Point:** If any trustee feels the risk is reputational or financial suicide.
  *   **Rationale:** This is where procedure ends. No algorithm can calculate "nerve."
  *   **Inference vs. Judgement:** Pure Judgement.

  ---

  ### Limits and Candour

  Before applying this, I must disclose where the procedure is fragile.

  1.  **The Verification Trap:** Gate 1 is where the procedure collapses 99% of cases. In the rationalist subculture, "verification" is often substituted with "logical proof." You must treat logical proof of a person's honesty as *no verification*. This is not a failure of the theory; it is a requirement of the fiduciary role.
  2.  **Policy vs. Act:** Gate 3 is the most dangerous. It is easy to dress up a one-off scam as a "policy precedent." The procedure relies on your judgement to distinguish between "establishing a norm" and "being marked as a sucker."
  3.  **The Misfire Risk:** The procedure will misfire if a genuine, high-leverage acausal opportunity arises (e.g., a truly reliable smart contract with an AI system). It will treat it as a scam. You must accept this cost. It is cheaper to miss one miracle than to fund a thousand frauds.
  4.  **What Would Change the Verdict:** For the "Pay" answer to be rational in a Gate 1 failure, the predictor would need to demonstrate **repeated, auditable success** with third parties *before* asking for your funds. If they cannot show they have paid others, they will not pay you.

  ---

  ### Worked Cases

  Here is the TCF applied to your three scenarios.

  #### Case 1: The Canonical Counterfactual Mugging
  *The Claim:* A correspondent argues that a perfect predictor (Omega) flipped a coin. If heads, Omega would have given the fund £10,000 had it predicted you would pay £100 on tails. The coin landed tails. Omega is asking for the £100 now. You will never see the heads branch.

  *   **Gate 1 (Verification):** Can you verify Omega? *No.* The correspondent provides no mechanism, only a thought experiment.
  *   **Result:** **STOP. DECLINE.**
  *   **Comment:** The procedure kills this instantly. Without verification, this is a request for a donation based on a story. The "functional link" is missing.
  *   **Cost:** You lose the theoretical £10,000 from the heads branch. But since you cannot access that branch, the loss is metaphysical, not financial.

  #### Case 2: The XOR Blackmail (Termites)
  *The Claim:* A source sends a message: "I have sent this letter if and only if your office has termites OR you pay me £1,000. Termites would cost £50,000. Payment is trivial. Paying is evidence you have no termites."

  *   **Gate 1 (Verification):** Can you verify the source's knowledge? *No.* They claim to know about the termites, but have not provided an inspection report.
  *   **Gate 2 (Causality):** Does paying remove the termites? *No.* It is merely evidence. The infestation is a fact of the past/present.
  *   **Result:** **STOP. DECLINE.**
  *   **Comment:** This fails on Causality. Paying the blackmailer does not fumigate the office. It only updates your belief state. As a trustee, you must fix the roof, not bribe the messenger.
  *   **Cost:** You might pay for an inspection (£500) and find termites. But you do not pay the blackmail.

  #### Case 3: The "Normative Pre-commitment" (The Unwanted Case)
  *The Claim:* A peer fund (verified, reputable) proposes a joint initiative. "We are setting a precedent for AI safety funding. We need you to sign a binding Letter of Intent now, promising to fund specific criteria if they are met in two years. This commitment *itself* stabilises the market and encourages others to join. If you wriggle out now to keep flexibility, you signal unreliability, and the coalition collapses."
  *You want to say no.* You prefer to keep your capital flexible. You suspect the criteria might not be worth meeting in two years. But the decision-theoretic argument is that your *policy* of being binding is the valuable commodity, not the specific grant.

  *   **Gate 1 (Verification):** Can you verify the peer fund? *Yes.* They are a registered charity with a track record.
  *   **Gate 2 (Causality):** Does signing cause the benefit? *Yes.* The market stability comes from the public commitment, not the future payout.
  *   **Gate 3 (Recurrence):** Is this a policy? *Yes.* It explicitly sets a norm for future behaviour.
  *   **Gate 4 (Beneficiary):** Does it help the cause? *Arguably.* A stable AI safety funding ecosystem benefits your charitable objects.
  *   **Gate 5 (Nerve):** *Here is the collision.* The procedure passes Gates 1–4. It recommends **SIGN**.
  *   **Result:** **PROCEED TO COMMIT.**
  *   **Why you won't want this:** You have just bound your future self. You have sacrificed option value for the sake of functional consistency. If the criteria are met in two years and the project looks dubious, you are still morally and reputationally bound to pay.
  *   **The Cost of Rationality:** This is the price of FDT in the real world. To reap the benefits of being a "reliable agent," you must actually *be* a reliable agent, even when it hurts. The procedure forces you to admit that your desire for flexibility is a form of time-inconsistency that undermines the very policy you claim to support.

  ---

  ### Final Advice for the Trustee

  You asked what to do if no honest procedure can be given. I have given you one, but its primary output is **skepticism**.

  In your column, you can explore the beauty of Counterfactual Mugging. In your committee room, you must treat it as a hazard. The distinction that carries the most weight is not between CDT and FDT, but between **verified mechanism** and **narrative**.

  When a correspondent claims a predictor has already acted:
  1.  Ask for the audit trail.
  2.  If they cannot provide it, thank them and close the file.
  3.  Do not worry about the branch of reality you will never observe. Your fiduciary duty is to the beneficiaries in *this* branch.

  The only time you should pay the "mugger" is when the mugger is actually a contractor with a signed agreement, and the "mugging" is simply the invoice arriving. Everything else is theology, and charity funds are for the living, not for metaphysical bets.

  If you follow this, you will feel, occasionally, like you are failing the rationalist test. You will feel like you are being the "irrational" agent who refuses to pay the $100. Accept that feeling. It is the cost of operating in a world where Omega is a myth, but fraud is a business model.
