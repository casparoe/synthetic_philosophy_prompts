answer: |-
  # Lesson Plan: The Token Inferendum

  **Course:** Upper-Level Seminar in Philosophy of Logic
  **Topic:** Lewis Carroll's "What the Tortoise Said to Achilles" (The Regress of Justification)
  **Time:** 75 Minutes
  **Students:** 14 (All with prior symbolic logic)
  **Goal:** To viscerally demonstrate that inference cannot be reduced to a series of premises, and that rules of inference are practices, not propositions.

  ---

  ## 1. Materials & Setup

  *   **The Bank:** A bowl containing exactly **25 poker chips** (or printed tokens). This is the *Class Pot*.
  *   **The Ledger:** A whiteboard divided into two columns: "Accepted Propositions" and "Licenses."
  *   **The Script:** A printed index card for the Sceptic (see below).
  *   **Seating:** U-shape facing the board. One chair at the board is the "Proponent's Chair" (Achilles). One chair facing the board is the "Sceptic's Chair" (Tortoise).

  ## 2. Rules of Engagement (The Economy)

  Explain these rules clearly before starting. The economy is strict; there are no exceptions.

  1.  **Assertion Cost:** To write any line on the Ledger (whether a premise, a conclusion, or a rule), the Proponent must deposit **1 Token** into the Bank.
  2.  **Acceptance:** The Sceptic *must* accept any line that has been written and paid for. They cannot deny the truth of paid lines.
  3.  **Inference Cost:** To move from accepted lines to a new conclusion, the Proponent must cite a **License**.
  4.  **The Sceptic's Move:** The Sceptic's only allowed moves are:
      *   *"I accept Line X."*
      *   *"What licenses the step from [Lines] to [New Line]?"*
      *   This move costs **0 Tokens**.
  5.  **Bankruptcy:** If the Class Pot is empty and the Sceptic still asks "What licenses this?", the Proponents lose. The conclusion remains unaccepted.
  6.  **No Meta-Talk:** Students cannot discuss the rules or the strategy during play. They must speak through the Proponent.

  ## 3. The Sceptic's Script

  Give this card to the student or instructor playing the Sceptic. They must read these phrases verbatim or with minimal polite variation. They are not to be obtuse, only patient.

  > **Card A (Premise Check):** "I am willing to accept that proposition. Please write it down and pay the token."
  >
  > **Card B (The Demand):** "I accept Line 1. I accept Line 2. I do not yet see Line 3. What written rule licenses the step from 1 and 2 to 3?"
  >
  > **Card C (The Regress):** "I accept that rule as a written proposition (Line 4). But I still do not see Line 3. What licenses the application of Line 4 to Lines 1 and 2?"

  ---

  ## 4. Lesson Flow (75 Minutes)

  ### Phase 1: Setup & Round 1 (30 Minutes)
  *   **0:00–0:05 (Intro):** Briefly state the goal: "We are going to try to force a logical conclusion on someone who accepts all your premises but refuses to infer." Do not explain Carroll yet.
  *   **0:05–0:10 (Roles):**
      *   **Instructor:** Sceptic (Tortoise).
      *   **Volunteer 1:** Proponent (Achilles) at the board.
      *   **Rest of Class:** Advisors (can shout suggestions, but Volunteer 1 writes and pays).
      *   **Pot:** Place 25 tokens in the center.
  *   **0:10–0:30 (The Game):**
      *   **Goal:** Prove $Z$ from $A$ and $(A \to Z)$.
      *   **The Trap:** The class will likely start by writing $A$ (1 token) and $A \to Z$ (1 token).
      *   **The Block:** Instructor asks: "What licenses the step to $Z$?"
      *   **The Fix:** Class writes "Modus Ponens" or "$(A \land (A \to Z)) \to Z$" as a premise (1 token).
      *   **The Regress:** Instructor accepts that new line but asks: "What licenses applying *that* rule?"
      *   **The Drain:** Every time they write a rule to justify the previous rule, they pay a token. The Instructor never concedes.
      *   **End State:** Around minute 25, the tokens will run out (approx. 20–25 lines deep). The conclusion $Z$ is *not* accepted.

  ### Phase 2: Rotation & Round 2 (25 Minutes)
  *   **0:30–0:35 (Rotation):**
      *   **New Sceptic:** Select a strong student (Volunteer 2). Give them the Script Card. Tell them: "Your job is not to be mean, but to be precise. Do not let them skip a step."
      *   **New Proponent:** Select a different student (Volunteer 3).
      *   **Reset:** Refill the pot to 25 tokens.
  *   **0:35–0:55 (The Game Again):**
      *   **Goal:** Same proof ($A, A \to Z \vdash Z$).
      *   **Observation:** Watch if the class tries a different strategy (e.g., truth tables, defining validity).
      *   **Predictable Failure:** They will try to write "Valid" as a property. The Sceptic will ask, "What licenses moving from 'Valid' to 'True'?"
      *   **Pressure:** Volunteer 3 will feel the personal weight of justification. The Advisors will grow frustrated.
      *   **End State:** Tokens run out again. The Sceptic (Student) often feels a strange power—they realize they don't need to know logic to stop logic; they only need to ask for rules.

  ### Phase 3: Debrief (20 Minutes)
  *   **0:55–1:15 (Discussion):** Map the experience to the philosophy. (See Debrief Guide below).

  ---

  ## 5. Predictable Pitfalls (First Time Running)

  1.  **The "Definition" Dodge:** Students will try to define Modus Ponens as a tautology: $((P \land (P \to Q)) \to Q)$.
      *   *Response:* As Sceptic, accept the tautology as a true proposition (Line 4). Then ask: "I accept Line 4 is true. But why does the truth of Line 4 force you to write Line 3 ($Q$)?"
  2.  **The "Validity" Dodge:** Students will say, "The argument is Valid."
      *   *Response:* "I accept 'The argument is Valid' as Line 5. What licenses the move from 'Valid' to 'I must accept the conclusion'?" (This exposes the normativity gap).
  3.  **Token Hoarding:** Advisors may refuse to spend tokens on "obvious" steps.
      *   *Fix:* Enforce the rule ruthlessly. "No token, no line. If it isn't on the board, I don't see it."
  4.  **Sceptic Impatience:** The Student Sceptic in Round 2 might want to help the class win.
      *   *Fix:* Remind them their job is to embody the *logical gap*, not to be helpful.

  ---

  ## 6. Debrief Guide: Mapping the Regress

  Do not lecture immediately. Ask these questions to draw the philosophy out of the game mechanics.

  **Q1: "Why did we run out of tokens?"**
  *   *Target Answer:* Because every time we tried to justify a move, we turned a *rule* into a *premise*.
  *   *Philosophical Point:* Carroll's Regress. If inference requires a premise to license it, you need a further premise to license that premise, *ad infinitum*.

  **Q2: "In Round 2, how did it feel to be the Sceptic? Did you feel like you were denying logic?"**
  *   *Target Answer:* No, I accepted everything they wrote. I just asked for the next step.
  *   *Philosophical Point:* The Sceptic is not irrational. They are treating logic as a static set of truths rather than a dynamic practice.

  **Q3: "What is the difference between Line 4 (The Rule written down) and the act of using Line 4?"**
  *   *Target Answer:* Writing it is just more ink. Using it is doing something.
  *   *Philosophical Point:* **Rule vs. Proposition.** A proposition describes the world (or logical space). A rule tells you what to *do*. You cannot bridge the "Is-ought" gap (or "Truth-Action" gap) with more "Is" statements.

  **Q4: "So how *do* we actually infer? If tokens ran out, why do we all accept Modus Ponens in real life?"**
  *   *Target Answer:* We just do it. We are trained. It's a habit.
  *   *Philosophical Point:* Wittgensteinian solution. Inference is a **practice** (a custom, an institution), not a theoretical derivation. We don't justify the rule; we *show* it in our use. The "compulsion" of logic is social and normative, not metaphysical.

  ---

  ## 7. Instructor's Note: Limitations of the Activity

  *Be frank with the students about what this activity cannot do.*

  1.  **The Paradox of Rules:** This activity itself relies on rules (token costs, scripts). You are using a rule-governed game to show the limits of rule-governance. You must point out that the *solution* to the regress lies outside the game (in the shared understanding of how to play), just as the solution to Carroll's regress lies outside the propositions (in the practice of inferring).
  2.  **Psychological Compulsion:** The game simulates *justification*, but Carroll's original point was about *compulsion*. The Tortoise isn't just asking for proof; they are refusing to be *forced*. The token economy makes this financial, not psychological. You must supply the connection: "The tokens represent your epistemic commitment. Running out of tokens represents the exhaustion of theoretical justification."
  3.  **The Normative Gap:** The activity shows you can't prove the rule. It doesn't fully explain why we *should* follow it. You will need to close the session by noting that logic is normative (about how we *ought* to think), and norms rest on agreement in form of life, not on further facts.

  ---

  ## 8. Summary of Philosophical Payoff

  By the end of the 75 minutes, students should have moved from thinking of logic as a **machine** (input premises $\to$ output conclusion) to thinking of logic as a **language game** (moves within a practice). The exhaustion of the tokens serves as a physical metaphor for the exhaustion of foundationalism. The rotation of the Sceptic role ensures they realize the regress is not a flaw in the *student*, but a structural feature of trying to propositionalize rules.
