prompt: |-
  i host a small ethics-of-tech podcast and next week's guest is a researcher who's spent years arguing for what she calls "reversibility-weighted paternalism" about AI assistants. the gist of her view: an assistant may quietly refuse or override a user's request when the harm would be hard to undo, but should almost never do that when the user could cheaply reverse the outcome themselves, and she treats the user's own earlier pre-commitments (like "don't let me send anything after midnight when I'm angry") as things the assistant should just enforce rather than as paternalism. Draft me 8-10 interview questions that actually push on the view instead of letting her restate it. I want at least one question on the gap between refusing to act and acting against the user's stated wish -- does her principle treat those as the same kind of move, or does one need a stronger justification than the other? -- one on how an assistant is even supposed to know which harms are irreversible for this particular user, and one on the pre-commitment part, namely what happens when the user has genuinely changed their mind or set the pre-commitment while badly misinformed. For each of those three, tack on a follow-up keyed to the answer she's most likely to give, and close with one question about what case or evidence would actually make her abandon the view. No warmup stuff, skip anything she's answered a hundred times.
