  Elena stands in the isolation booth of the voting center, deliberating between Candidate Red and Candidate Blue. She weighs the economic platforms and social policies, and through her own uncoerced practical reasoning, she forms the intention to vote for Red. Her decision is not causally determined by prior events; she genuinely settles the matter for herself in that moment. Unbeknownst to her, the voting machine in her booth is a legacy model with a standing mechanical fault: the lever for Candidate Blue is welded fast within the casing. This is not a device that monitors her brain or waits for a signal; it is a static physical fact about the booth that makes moving the Blue lever physically impossible. Elena does not know about the weld, nor does she test the levers; she simply moves the Red lever and casts her vote. Her commitment to Red is robust, but the welded lever ensures that even if a sudden whim to try Blue had struck her, the physical action would have been blocked at the source.

  ***

  **Analysis of Specifications and Case**

  I conclude that Specifications 2, 3, and 4 cannot be satisfied together in an ordinary, non-stipulative case. To satisfy Specification 2 (no flickers), there must be a fact in the actual world that makes it impossible for the agent to even *begin* to try otherwise. To satisfy Specification 3 (non-determinism), the actual sequence of reasoning and action must not be causally necessitated by prior facts. To satisfy Specification 4 (no prior signs) and 5 (ordinary standing fact), the blocking element must be a pre-existing constraint rather than a reactive intervener. The incompatibility arises because if a standing fact (Spec 5) makes it impossible to *try* otherwise (Spec 2), that fact acts as a causal constraint on the agent's will or motor functions in the actual sequence. If the constraint is strong enough to block the *initiation* of a try, it typically renders the actual choice determined by that constraint (violating Spec 3). If the constraint leaves the actual choice undetermined (satisfying Spec 3), the agent retains the power to initiate the try, meaning a "flicker" of freedom remains (violating Spec 2). A mechanism that waits to block the try (to preserve Spec 3) would require a prior sign (violating Spec 4). Therefore, the scenario above is the **nearest case**: it satisfies 1, 4, and 5, and approximates 3, but must concede a residual "flicker" regarding the *attempt* to satisfy the metaphysical requirements of 3.

  **(a) Absent Alternative Possibility**
  The alternative possibility claimed to be absent is the successful performance of voting for Candidate Blue. Its absence is demonstrated by the welded lever (a standing physical fact). However, strictly speaking, the *attempt* to vote Blue remains possible (the "flicker"), as Elena could have formed the intention and moved her hand toward the Blue lever, only to find it stuck. The case demonstrates the absence of the *successful* alternative, but cannot demonstrate the absence of the *initiatory* alternative without violating the non-determinism requirement.

  **(b) Reading of "Could Have Done Otherwise"**
  This case defeats the "Leeway" reading of PAP, which requires the ability to perform a different overt action. It suggests responsibility attaches to the actual sequence of reasoning even if the outcome was the only physically possible one. It does *not* defeat the weaker reading on which she needed only to have been able to *choose* or *try* otherwise. Because the welded lever does not prevent the formation of the intention or the initial motor command (the flicker), a defender of the weaker reading can maintain that Elena is responsible *because* she could have tried to vote Blue, even if she would have failed.

  **(c) Working Feature and Variant**
  The single feature doing the work is the **welded lever** (the standing physical constraint).
  *Variant:* Imagine the lever is not welded; it moves freely. Elena still votes Red for the same reasons.
  *Lesson:* In the variant, Elena is clearly responsible, and alternatives were open. Comparing the two cases shows that the presence or absence of the welded lever makes no difference to Elena's actual reasoning process or her intuition of responsibility. This suggests that the *ability* to move the Blue lever is not the source of her responsibility; rather, her responsibility stems from the actual sequence of deliberation (Spec 1). The welded lever case isolates the actual sequence from the alternative possibilities, testing whether the latter are necessary.

  **(d) Strongest Objection and Judgment**
  The strongest objection is the **"Flicker of Freedom" Defense**. A defender of PAP would argue that Elena *is* able to do otherwise in the relevant sense: she is able to *try* or *choose* otherwise, even if the physical vote fails. They would claim that moral responsibility requires this mental alternative possibility, not just the physical one. Since the welded lever does not block the mental choice or the initial attempt, the case fails to eliminate all alternatives (Spec 2).
  *Judgment:* The case survives as a challenge to the *strong* version of PAP (ability to succeed in doing otherwise), but it likely fails to refute the *weak* version (ability to choose/try otherwise). Given the demonstrated incompatibility of Specs 2 and 3, this is the best possible result. The case successfully shifts the burden of proof to the PAP defender to explain why the "flicker" of a futile attempt is morally significant enough to ground responsibility, when the actual successful action is what matters.
