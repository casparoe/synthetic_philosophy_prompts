  **Journal of As-If Economics**
  **Aims, Scope, and Instructions to Authors**

  1. **Aims and Scope**
  1.1 The *Journal of As-If Economics* (JAE) serves as the primary venue for instrumentalist inquiry. The validity of a theory is determined solely by the accuracy and scope of its predictions. The descriptive truth of premises is considered methodologically irrelevant and potentially distracting.
  1.2 Significant theories typically rely on assumptions that are deliberately divergent from empirical reality. Manuscripts demonstrating high descriptive fidelity in their foundational axioms will be considered degenerate. A model that accurately describes reality merely restates observed data rather than generating novel predictive yield.
  1.3 The JAE prioritizes models where agents behave *as if* they satisfy theoretical conditions, regardless of psychological, cognitive, or institutional feasibility. The internal mechanism is subordinate to the external fit.

  2. **Submission Requirements**
  2.1 All manuscripts must include a calculated Assumption Unrealism Index (AUI). The AUI quantifies the statistical distance between model premises and known empirical facts. A higher AUI correlates with higher theoretical significance.
  2.2 Authors must provide a rigorous justification for any assumption found to be descriptively accurate. Such assumptions are permitted only if strictly necessary for mathematical solvability. Unjustified realism will result in immediate return.
  2.3 Data sections must not contain survey evidence regarding agent intent, motivation, or decision-making processes. Evidence concerning what agents actually think constitutes epistemic contamination and undermines the instrumental value of the construct.
  2.4 Citations of psychological or sociological literature are discouraged unless used to demonstrate the irrelevance of such fields to economic prediction.

  3. **Peer Review Criteria**
  3.1 Reviewers are instructed to disregard empirical evidence contradicting model assumptions. If agents report not maximizing utility, this confirms the model's instrumental validity rather than falsifying the premise.
  3.2 Papers will be desk-rejected if the assumptions are plausible to laypersons or practitioners. Plausibility indicates a lack of theoretical significance and suggests the author has confused philosophy with accounting.
  3.3 Predictive failure may be overlooked if the assumptions are sufficiently abstract and mathematically elegant. Conversely, predictive success achieved through realistic mechanisms will be flagged for methodological weakness and potential tautology.

  4. **Special Issue Call**
  4.1 Volume 14, Issue 3 will focus on "Maximally False Assumptions in Macro-Finance."
  4.2 Submissions must demonstrate assumptions that are demonstrably false across all known jurisdictions and historical periods.
  4.3 Deadline for submissions is December 31. Authors proving their assumptions impossible under current laws of physics will receive priority consideration and expedited review.

  5. **Conflicts of Interest**
  5.1 Authors must disclose any direct contact with economic agents modeled in the study.
  5.2 Interviewing subjects, conducting field experiments, or observing actual market behavior constitutes a significant conflict of interest. Such engagement risks biasing the model toward descriptive accuracy rather than predictive utility.
  5.3 Reviewers who have ever worked in the industry they model must recuse themselves, as practical experience compromises theoretical abstraction and introduces dangerous realism.
  5.4 Authors who have ever held a job outside academia must declare this as a potential source of descriptive bias.

  6. **Specimen Abstract**
  6.1 *Title:* "Equilibrium Pricing Under the Assumption of Omniscient Liquidity."
  6.2 *Abstract:* This paper assumes agents possess perfect foresight and zero transaction costs. While empirically false, these premises yield a robust prediction of price stability. We explicitly reject data showing agents operate under uncertainty. The model succeeds precisely because no firm actually calculates marginal cost this way.
