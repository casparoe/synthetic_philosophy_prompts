  The concept you are describing is indeed an established one, though your uncertainty is well-founded because the term is used across several disciplines with slightly different scopes. The established term is **Accommodation** (specifically **Historical Accommodation** or **Legislative Accommodation**).

  While you suspected the term might be reserved for "divine condescension to human language," in the history of philosophy and theology, it applies equally to institutions, laws, and rituals. However, because "Accommodation" is a broad genus (covering everything from God using metaphors to the Church adopting pagan dates), the specific *species* of the pattern you identified—where an old form is strategically retained to facilitate a transition in substance, with the understanding that it is a second-best concession—requires precise boundaries.

  Here is the carving of the concept, distinguishing it from its neighbors.

  ### Definition: Accommodation (Historical/Legislative)
  **Accommodation** is a strategic decision by a lawgiver or authority to adopt an existing practice, form, or institution—not because it is intrinsically ideal, but because the target audience is psychologically or culturally incapable of accepting the ideal directly. The old form is preserved (or repurposed) to ensure continuity and intelligibility, while its meaning or function is redirected toward a new end. It is understood by the authority as a concession to human limitation, often intended as a transitional stage that may be outgrown or superseded when capacity increases.

  ### Boundaries and Carving

  **1. Cases Clearly Inside (The Pattern You Noticed)**
  *   **Maimonides on Sacrifice:** The form (animal sacrifice) is kept because the Israelites could not conceive of worship without it; the substance (who is worshipped) is changed from idols to God. It is a concession to historical habit.
  *   **Jesus on Divorce (Mark 10:5):** The law permitting divorce is explicitly defended not as God's original intent ("from the beginning it was not so") but as a concession to "hardness of heart."
  *   **Gregory the Great on Pagan Temples:** In his letter to Mellitus (601 CE), Gregory instructs missionaries not to destroy pagan temples but to rededicate them to Christian saints. The *form* (the building, the gathering) is kept; the *substance* (the deity worshipped) is changed to ease the transition.
  *   **Biblical Kingship (1 Samuel 8):** God grants a king because the people demand one like the nations, though the ideal was direct theocracy. The institution is hedged with laws to mitigate the damage.

  **2. Cases Clearly Outside (Neighboring Concepts)**
  *   **Syncretism:** This is the *fusion* of two belief systems into a new hybrid. In Accommodation, the authority intends to *replace* the old meaning, not blend it. Syncretism is often organic or unintentional; Accommodation is a top-down strategy.
      *   *Boundary:* If the old meaning is allowed to persist alongside the new, it is Syncretism. If the old meaning is actively displaced while the shell remains, it is Accommodation.
  *   **Exaptation (Biology/Systems):** This describes a trait evolving for one purpose being used for another. It fits the "old form, new function" mechanic perfectly. However, Exaptation implies *no designer*. Accommodation requires a *deliberate agent* (God, Lawgiver, Missionary) making a conscious concession.
      *   *Boundary:* If the change is unplanned evolutionary drift, it is Exaptation. If it is a deliberate pedagogical strategy, it is Accommodation.
  *   **Linguistic Accommodation:** This is the narrower use you worried about (e.g., Calvin saying God "lisps" to us in Scripture). It is the same *principle* applied to language rather than institutions.
      *   *Boundary:* If the concession is only about vocabulary or metaphor, it is Linguistic Accommodation. If it concerns rituals, laws, or political structures, it is Historical/Legislative Accommodation.
  *   **Gradualism:** This refers to change happening in steps over time. Accommodation is a *type* of gradualism, but Gradualism does not require retaining the *old form*. One could abolish sacrifice and replace it with prayer slowly (Gradualism). Keeping sacrifice but changing its object is Accommodation.
      *   *Boundary:* If the old form is discarded eventually, it is merely Gradualism. If the old form is *repurposed* as a vessel for the new, it is Accommodation.

  ### Addressing Your Specific Questions

  *   **Does the concession need to be deliberate?**
      Yes. This distinguishes it from *Vestigiality* (an obsolete practice that survives by inertia) or *Exaptation*. In the pattern you noticed, the authority (Maimonides' God, Jesus, Gregory) explicitly *justifies* the rule based on human incapacity.
  *   **Does the old form need to be preserved?**
      Yes, this is the core mechanism. If the form were abolished, it would be a *Reform* or *Abrogation*. The "shell" must remain to carry the new "kernel."
  *   **Does it matter if it is temporary or permanent?**
      This is the subtlest boundary. Classical Accommodation (like God speaking human language) can be permanent (humans will always be finite). However, the specific pattern you identified (Maimonides, Divorce) implies a **Transitional Accommodation**: it is a "second-best" that is theoretically inferior to the ideal and, in principle, outgrowable. If the defender claims the concession is the *new ideal*, it slips into **Development** or **Progress**. The hallmark of your pattern is the *apologetic* tone: "We do this not because it is best, but because you cannot yet bear the best."

  ### Conclusion
  You are circling **Accommodation**. Your hesitation stemmed from encountering the term primarily in its linguistic sense (hermeneutics) rather than its institutional sense (philosophy of law/religion). While scholars sometimes qualify it as "Historical Accommodation" or "Pedagogical Accommodation" to be precise, the root term is sufficient provided the boundaries above are observed. It captures the agency, the concession to weakness, and the repurposing of form that defines the pattern.

  \answer{Accommodation}
