  Candidate domains include hospital infections, engineering faults, and dietary links, but the hospital setting best fits the brief. At St. Jude's Hospital, Ward Four suffers recurrent infections. Team Alpha proposes a mutable pathogen theory. Initially, it predicts strain Alpha-1 resists bleach. Testing shows susceptibility. Alpha modifies the theory to predict strain Alpha-2 resists UV light before the next outbreak. Testing fails again. Each modification predicts a novel resistance profile unknown to prior data, maintaining theoretical progress. Yet, no prediction is ever corroborated. Team Beta proposes a hygiene compliance model. They do not predict new pathogen behaviors. Instead, they adjust compliance parameters to fit past infection rates, merely redescribing existing data. Surprisingly, when these adjusted parameters guide policy, infection rates stabilize and corroborate the model's utility. Alpha generates bold, novel predictions that consistently fail. Beta accommodates past data without novel prediction yet consistently succeeds in control. The divergence lies strictly in novelty versus accommodation. Alpha seeks new facts; Beta fits old ones. Despite Alpha's theoretical boldness, the ward remains unsafe under their guidance. Beta's unadventurous fitting yields safety. Staff observe Alpha's repeated failures against Beta's steady gains. Alpha remains scientifically articulate but practically useless. Beta remains descriptively retroactive but practically effective. The hospital administration faces a choice between a theoretically progressive failure and an empirically successful accommodator.

  Lakatos's apparatus classifies Alpha as scientific because it remains theoretically progressive, predicting novel facts despite empirical failures. Beta risks being labelled ad hoc since it merely accommodates data. This situation embarrasses his treatment of the ad hoc and his claim that theoretical progress suffices for scientificity, suggesting theoretical boldness cannot sustain rationality if empirical failure is constant. A Popperian rejects Alpha immediately due to falsification, preferring Beta's corroboration regardless of novelty. A Kuhnian sees Alpha in crisis, losing community trust, while Beta performs normal science. An egalitarian regarding prediction and accommodation argues novelty adds no extra weight; Alpha's failures count equally against it, while Beta's successes count for it. The single feature doing the work is the novelty of Alpha's predictions versus Beta's accommodation. If removed, meaning both merely accommodated, the distinction collapses into empirical success alone. If both predicted novelly, Alpha's failure would still condemn it. A Lakatosian defender would argue that empirical progress lags behind theoretical progress; Alpha needs time to catch up, whereas Beta's lack of novelty limits its long-term heuristic power. They would claim Alpha's hard core protects a potentially fruitful line, while Beta is merely curve-fitting without explanatory depth. However, the case stresses the tension between methodological rules and practical rationality, highlighting that theoretical boldness without empirical payoff may be scientifically legitimate but epistemically bankrupt.
