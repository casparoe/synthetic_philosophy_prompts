prompt: |-
  I host a little podcast on political philosophy and social choice — the audience is mostly grad students and the odd economist — and next week's guest works on the discursive dilemma, that setup where every member of a group is perfectly consistent on their own but the group's majority verdicts come out inconsistent. The old breach-and-damages case: a majority finds breach, a majority finds damages, so by the book a majority should find liability, and yet a majority votes "not liable" when you just ask them the bottom-line question. Her take, which is definately why I'm excited, is that the literature has been solving the wrong problem: she thinks the paradox only bites if you personify the group as a single reasoner with one belief set, and that once you give that up the real question is procedural — whether an aggregation rule tracks the reasons members actually voted on, not whether the group's outputs hang together as a whole. In the manuscript she's shopping around she defends what she calls a "reason-tracking" criterion and uses it to argue for premise-by-premise majority voting over voting straight on the conclusion, inconsistency be damned. I want the Q&A to actually corner her on this instead of letting her restate the thesis for the tenth time.

  So put on your social choice theorist hat and, before you write anything, brainstorm to yourself where her position is weakest and where it's actually strongest, then draft from that. I want at least one question pressing the epistemic side — whether premise-majority really tracks the truth about the conclusion, given that a majority can be right on every premise and still wrong on the conclusion, and what her criterion says about that; at least one on legitimacy, i.e. whether voting premise-by-premise imposes the majority's rationale on the minority, and whether that's a defect of the procedure or just what collective reasoning is; and at least one on whether a group can coherently "believe" a set of things that can't all be true together, or whether she's quietly changing the subject from belief to something weaker like acceptance or decision. Round it out with a few in the same vein — how manipulable premise-based rules are once members know the structure, what happens when the propositions form a longer chain rather than two premises and a conclusion, and whether her line makes deliberation pointless or merely reconceives it. Don't bother with citations, she'll know her own field.

  Give me the response in three named sections, in this order: "Warm-up" (two quick scene-setting questions, one line each); "The pressure" (six questions, each followed by a short "Follow-up:" line keyed to the answer she's most likely to give); and "The closer" (one question that forces her to say what would count as evidence against her criterion). Keep the whole thing to roughly a page.
