answer: |-
  ### Warm-up

  1. If we stop treating the group as a mind, what metaphysical status do its outputs retain?
  2. Is reason-tracking a constraint on aggregation or merely a description of deliberation?

  ### The pressure

  1. **Epistemic:** If a majority is right on every premise but wrong on the logical connection, does premise-based voting track truth or just error propagation?
     *Follow-up:* If truth is the goal, why privilege the premises over the conclusion itself?

  2. **Legitimacy:** When you force a verdict based on reasons the minority explicitly rejected, aren't you imposing the majority's rationale as much as their outcome?
     *Follow-up:* Is collective reasoning just tyranny of the majority's logic?

  3. **Ontology:** If the group doesn't "believe" the premises, are we talking about belief or something weaker like bureaucratic acceptance?
     *Follow-up:* Does shifting to "acceptance" quietly dissolve the normative force of the verdict?

  4. **Strategy:** Isn't premise-based voting more manipulable once members know which premises are pivotal for the conclusion?
     *Follow-up:* How do you prevent strategic premise-voting without killing deliberation?

  5. **Complexity:** In long chains of reasoning, doesn't error accumulation make premise-based outcomes unstable compared to direct conclusion voting?
     *Follow-up:* Does your criterion collapse once the dependency graph gets deep enough?

  6. **Deliberation:** If reasons are just inputs for an aggregation rule, does your view make deliberation cosmetic or merely reconceive it?
     *Follow-up:* If reasons are just aggregation inputs, why talk at all?

  ### The closer

  1. What formal result or empirical case would count as evidence against your reason-tracking criterion?
