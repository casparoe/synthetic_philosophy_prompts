answer: |-
  This is a profound and under-recognized tension. You have identified a fissure between the *metaphysics of consciousness* and the *logic of moral accounting*. Before committing to a diagnosis, I will brainstorm the existing conceptual landscape to ensure we are not merely relabeling a known entity.

  ### Brainstorming Candidate Diagnoses

  1.  **The Ethical Combination Problem:**
      *   *Initial Plausibility:* High. It arises in the same metaphysical context (panpsychism/Russellian monism).
      *   *Failure Mode:* The standard Combination Problem (posed by Seager, Chalmers, etc.) asks how micro-experiences *constitute* a macro-experience. It is a question of *constitution* and *phenomenal unity*. Your puzzle is not about how experiences merge, but about where the *bearer* of those experiences begins and ends for the sake of moral counting. One can solve the Combination Problem (e.g., by denying macro-subjects) and still face your puzzle (e.g., by asking if the micro-subjects themselves are morally considerable).
      *   *Verdict:* Adjacent, but distinct.

  2.  **The Problem of the Many (Ethical Variant):**
      *   *Initial Plausibility:* High. Your description of "no non-arbitrary principle fixing where a subject begins and ends" mirrors Unger's and Lewis's ontological vagueness.
      *   *Failure Mode:* The Problem of the Many is ontological: *Which* cloud is the cloud? Your puzzle is normative: *Which* entity is the *patient* of harm? While the metaphysical vagueness drives the ethical uncertainty, the ethical stakes introduce a constraint that pure ontology lacks. Ethics often demands a count (e.g., in utilitarianism), whereas ontology can tolerate vagueness. The "ethical face" requires a bridge that the Problem of the Many does not build.
      *   *Verdict:* The metaphysical engine, but not the ethical vehicle.

  3.  **The Problem of Moral Vagueness:**
      *   *Initial Plausibility:* Moderate. This covers cases where moral status is indeterminate (e.g., late-term abortion, AI).
      *   *Failure Mode:* This is too broad. It typically assumes a stable metaphysics with fuzzy moral properties. Your puzzle inverts this: the metaphysics itself (fundamental experience) is precise but ubiquitous, while the *individuation* of the subject is what is fuzzy. The problem isn't "does this feel pain?" but "how many feelers are there?"
      *   *Verdict:* Too generic.

  4.  **The Sorites of Suffering:**
      *   *Initial Plausibility:* Moderate. It involves boundary issues.
      *   *Failure Mode:* A Sorites problem assumes a continuum where small changes don't matter until they do. Your students' puzzle is not about a continuum of *capacity* (e.g., from worm to human), but a discontinuity of *identity* (e.g., is this gas one subject or a trillion?). It is a problem of mereology, not just gradation.
      *   *Verdict:* Misidentifies the structural logic.

  5.  **Moral Gradualism / Degrees of Moral Status:**
      *   *Initial Plausibility:* Low. One might argue we just assign partial status to parts and wholes.
      *   *Failure Mode:* As you noted, the dispute is about the *bearer* of status, not the *degree*. If I strike a rock, do I wrong one subject, a billion subjects, or none? Gradualism doesn't solve the counting problem inherent in aggregation.
      *   *Verdict:* A potential solution, not the problem itself.

  ### The Diagnosis: Coining a Term

  There is no established term that isolates this specific intersection: the inability to map metaphysical subjects to moral patients due to the lack of principled boundaries in a fundamental-experience ontology. The existing literature treats this as a footnote to the Combination Problem or a general issue of vagueness.

  I propose we name this **The Problem of Ethical Individuation**.

  While the phrase "ethical individuation" appears in bioethics (regarding the splitting of embryos), I propose we adopt it here with a specific technical definition suited to the metaphysics of mind.

  #### Definition
  **The Problem of Ethical Individuation** is the failure to identify a non-arbitrary principle for counting moral subjects within a metaphysics where experience is fundamental and ubiquitous. It arises when the *metaphysical continuity* of experience conflicts with the *discrete logic* of moral accounting.

  It is not merely the question of "what has status?" (the problem of moral status), but "how many status-holders are there?" (the problem of moral counting). It occurs when the metaphysics dissolves the boundaries of the organism, leaving ethics without a unit of account.

  ### The Carving: Distinguishing the Phenomenon

  To ensure this concept does the work you need, we must distinguish it sharply from its neighbors.

  **1. Versus The Combination Problem**
  *   **The Combination Problem** asks: *How do micro-experiences constitute a macro-experience?* It is concerned with the *vertical* relationship between parts and wholes (constitution).
  *   **The Problem of Ethical Individuation** asks: *Where does the subject of experience begin and end?* It is concerned with the *horizontal* boundaries between entities (individuation).
  *   *The Distinction:* You can accept that micro-experiences do *not* combine (solving the Combination Problem by denying macro-subjects) and still face the Problem of Ethical Individuation (because you now have billions of micro-subjects and no principle for counting them). Conversely, you can solve Ethical Individuation (by stipulating organisms are the subjects) and still face the Combination Problem (how do they make a mind?). They are orthogonal axes: one is about merging, the other about bounding.

  **2. Versus The Problem of the Many**
  *   **The Problem of the Many** is ontological: *Which candidate object is the real object?* It assumes there is a fact of the matter about objects that is hard to locate.
  *   **The Problem of Ethical Individuation** is normative-ontological: *Which candidate object is the bearer of moral rights?*
  *   *The Distinction:* The Problem of the Many allows for ontological vagueness (it doesn't matter which cloud is the cloud). Ethical Individuation does not allow for normative vagueness in the same way; moral theories (especially consequentialist ones) require a count to calculate value. If there are $10^{23}$ subjects in a rock, the moral weight is $10^{23}$ times higher than if there is one. The "Many" is a metaphysical puzzle; Ethical Individuation is a moral crisis driven by metaphysics.

  **3. Versus A Mere Sorites-Style Boundary Problem**
  *   **A Sorites Problem** relies on a continuum of *properties* (e.g., hairiness, consciousness capacity) where small changes are imperceptible.
  *   **The Problem of Ethical Individuation** relies on a discontinuity of *identity* in a field of *uniform properties*.
  *   *The Distinction:* In a Sorites case, we don't know *when* a being becomes conscious. In Ethical Individuation, we assume consciousness is everywhere (or fundamental); we don't know *how many* conscious beings there are. It is not a problem of threshold (when does it start?), but a problem of segmentation (where are the joints?).

  **4. Versus Moral Status Gradualism**
  *   **Gradualism** claims moral status comes in degrees (a mouse counts less than a human).
  *   **The Problem of Ethical Individuation** claims the *unit of counting* is indeterminate.
  *   *The Distinction:* Gradualism helps if the question is "how much does this subject matter?" It does not help if the question is "is this one subject or a thousand?" If a gas cloud contains a trillion micro-subjects, assigning them each 0.0000001 status might equal one human, but the *structure* of the moral claim is different. Gradualism addresses weight; Ethical Individuation addresses number.

  ### Boundary Cases and Scope

  To finalize the carving, we must identify where this problem applies and where it dissolves.

  **1. Where it Applies (The Core Case)**
  *   **Panpsychism & Russellian Monism:** Any view where experience is intrinsic to fundamental physical constituents.
  *   **Cosmopsychism:** If the cosmos is the only subject, the problem vanishes (there is one subject). But if the cosmos is a subject *and* contains sub-subjects without clear boundaries, the problem returns.
  *   **Integrated Information Theory (IIT):** If $\Phi$ (integrated information) is the measure of consciousness, and $\Phi$ exists in gradients across overlapping systems, IIT faces a severe version of this problem. Where does one $\Phi$-system end and another begin?

  **2. Where it Dissolves (The Non-Cases)**
  *   **Emergentism:** If experience emerges only at the level of complex organisms, the biological organism provides the natural boundary. Ethical Individuation aligns with Biological Individuation.
  *   **Substance Dualism:** If minds are distinct substances, their individuation is primitive and absolute. There is no boundary problem because the boundary is metaphysical bedrock.
  *   **Illusionism:** If there are no subjects of experience, there is no one to be wronged in this specific sense. The problem evaporates because the ontology denies the subject.

  **3. The Hard Boundary Case: The "Fading Subject"**
  *   Consider a brain being slowly replaced by silicon, or a fission case (Parfit's teleporter).
  *   Standard ethics treats this as a problem of *identity over time* (am I the same person?).
  *   The Problem of Ethical Individuation treats this as a problem of *counting at a time* (are there one or two subjects *now*?).
  *   If the metaphysics allows for overlapping subjects during the transition, Ethical Individuation demands we know how to count them *during* the overlap. This is the stress test for the concept.

  ### Conclusion

  The puzzle your seminar has encountered is **The Problem of Ethical Individuation**.

  It is not a survey error; it is a structural gap in the literature. Philosophers of mind have focused on whether the micro-subjects exist (metaphysics), and ethicists have focused on whether they matter (normative status). Few have addressed the *arithmetic* of the matter: that ethics requires a count, and this metaphysics denies a counter.

  By naming it, you allow your students to see that their disagreement is not about the value of suffering (which they agree on) or the facts of physics (which they agree on), but about the *mapping function* between the two. One group assumes the mapping is 1:1 with physical atoms (Moral Inflation); the other assumes the mapping is 1:1 with functional organisms (Moral Deflation). The Problem of Ethical Individuation is the recognition that the metaphysics provides no justification for either mapping.

  This term gives you the leverage to move the seminar from "does the rock suffer?" to "what principle licenses us to count the rock as one, many, or zero?" That is the precise philosophical work that needs doing.
