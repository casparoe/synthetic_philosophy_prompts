      *(Self-Correction on Final Case)*: Make sure the distinction relies on the definition of "Natural Kind." If Natural Kind = HPC, then Hacking is just saying "HPCs can be interactive." If Natural Kind = Mind-Independent, then they clash. I need to highlight this definitional pivot.

