          *   *Hacking:* It is purely interactive. Without the concept of "algorithmic monitoring," the kind does not exist. It is an "unstable" kind in the long run because people adapt to algorithms.
      *   *Wait, need opposite verdicts on "Natural Kind".*
          *   *Case:* "Pediatric Bipolar Disorder" (as defined in the US in the 90s/00s vs. later).
