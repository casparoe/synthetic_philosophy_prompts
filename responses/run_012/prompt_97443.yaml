          *   *Hacking:* The category creates the behavior. Teens act a certain way *because* the category exists. If we stop labeling it, the cluster dissolves. (Verdict: Interactive Kind, not Natural).
      *   *Refinement:* Let's use a case where the mechanism is *purely* the classification.
      *   *Case:* "Diagnostic Shadow Syndrome." Patients adopt symptoms they read about in their diagnosis criteria to ensure continued care.
      *   *HPC:* Stable cluster? Yes. Mechanism? Yes (operant conditioning via healthcare access). Verdict: HPC (technically).
      *   *Hacking:* Is it a natural kind? No, it's a artifact of the system.
