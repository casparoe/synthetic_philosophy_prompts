  2.  **Deconstruct Point 1: Rivals or Complementary?**
      *   *Boyd (HPC):* Ontological/Metaphysical. What makes a group of things a *kind*? It's about stability of properties via causal mechanisms. Aim: Naturalism, realism (kinds exist independently of us, mostly).
      *   *Hacking (Interactive Kinds):* Sociological/Historical/Pragmatic. How does classification *interact* with the classified? It's about the dynamic relationship between knowledge and reality in the human sciences. Aim: Critique of static realism, emphasis on reflexivity.
      *   *Relationship:* They aren't direct rivals in the sense of contradicting empirical claims. They address different layers. HPC asks "What holds this cluster together?" Hacking asks "What happens when we label this cluster?"
      *   *Overlap:* A kind can be an HPC *and* be interactive. The "mechanism" holding the cluster together could include human reactions to the label.
      *   *Conclusion:* They answer different questions (ontology vs. dynamics of classification), but they collide on the status of "naturalness."

  3.  **Deconstruct Point 2: The Reconciliation Claim.**
      *   *Claim:* Treat classificatory practice as a homeostatic mechanism.
      *   *Analysis:* This is a known move in the literature (e.g., by Tsou, or discussed by Hacking himself).
      *   *Pros:* It formally unifies the models. It allows HPC to accommodate human reflexivity.
      *   *Cons (The "Quiet Change"):* Boyd's original HPC was rooted in a tradition of *natural* kinds (biological, chemical) where mechanisms are mind-independent (e.g., genetics, neurochemistry). If the mechanism is *our classification*, the kind becomes mind-dependent.
      *   *Discovery vs. Making:* Boyd implies discovery (the cluster is there waiting). Hacking implies making (the label changes the thing). If classification is the mechanism, the kind is partially *made* by the classification. This undermines the strict realist intuition of HPC.
      *   *Boundaries:* If the mechanism includes social response, boundaries shift with social norms, not just biological facts.
      *   *Verdict:* It's a formal reconciliation but a substantive concession. It stretches "homeostatic mechanism" to include normative/social feedback, changing HPC from a theory of *nature* to a theory of *stability* (regardless of source).

  4.  **Deconstruct Point 3: Prolonged Grief Disorder (PGD).**
      *   *Context:* DSM-5-TR/ICD-11. Contested boundary (normal vs. pathological grief). Symptoms involve meaning, identity.
      *   *HPC View:* Looks for underlying mechanisms (neurobiology of attachment, stress response systems) that cause yearning, identity disturbance, etc. Tries to draw a line where the mechanism breaks or becomes pathological.
      *   *Hacking View:* Focuses on how the diagnosis changes grief. If I know I have PGD, do I grieve differently? Does it medicalize normal sorrow? Does the category evolve as people adopt the label?
      *   *Which explains better?* Hacking explains the *contestation* and the *fluidity* of the symptoms better. HPC struggles with why the boundary is so culturally variable.
      *   *Testable Predictions:*
          *   *HPC:* Biomarkers should correlate with the cluster regardless of knowledge of diagnosis.
          *   *Hacking:* Prevalence and symptom presentation should shift after the diagnosis is publicized/legitimized (e.g., insurance coverage, support groups). The "kind" changes over time (historical specificity).

  5.  **Deconstruct Point 4: Constructed Case (Opposite Verdicts).**
      *   *Goal:* A case where HPC says "Natural Kind" and Hacking says "Not a Natural Kind" (or vice versa, but usually Hacking is skeptical of natural kind status for interactive kinds).
