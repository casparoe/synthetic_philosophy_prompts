answer: |-
  You have put your finger on the central, unsolved hard problem of AI Debate and adversarial verification. You are describing a structural imbalance that doesn't have a single, perfect colloquial word, but in game theory, epistemology, and AI safety research, it goes by a few overlapping names.

  The most precise technical term for what you are seeing is **Asymmetric Verifiability**.

  However, that describes the *condition*, not the *tactic*. The tactic the lying model is using is **Strategic Obfuscation** (or **Strategic Unfalsifiability**).

  Here is the breakdown of the vocabulary, the closest existing concepts, and the edges of the phenomenon you've identified.

  ### 1. The Closest Existing Names

  **A. Asymmetric Verifiability (AI Safety / Game Theory)**
  This is the term most likely used in the papers you'll be reading (e.g., from the "AI Debate" research stream). It describes the structural state: it is easier to generate a plausible-sounding claim than it is to verify it.
  *   **Why it fits:** It captures the budget constraint. The judge has limited compute/time. The honest model is bound by the "cost of truth" (evidence gathering), while the dishonest model is bound only by the "cost of plausibility."

  **B. Strategic Unfalsifiability (Philosophy / Rhetoric)**
  You mentioned Popper's falsifiability. In a debate, the liar is engineering claims that are *technically* falsifiable but *practically* unfalsifiable within the judge's budget.
  *   **Why it fits:** It captures the "picking" aspect. The liar isn't just lying; they are searching the space of possible lies for the one that requires the most resources to disprove.

  **C. Cheap Talk (Game Theory)**
  In economics, "cheap talk" is communication that costs nothing to send and doesn't directly affect payoffs.
  *   **Why it fits:** The liar's claims are "cheap" because they don't carry the burden of proof. The honest model is engaging in **Costly Signaling** (providing evidence is expensive/risky). The problem is that in your system, the "cost" of the signal is being interpreted as "weakness" or "confusion" by the judge.

  ### 2. Why "Gish Gallop" and "Brandolini" Aren't Quite It

  You are right to reject these, and your intuition on *why* is sharp.

  *   **Gish Gallop** is about **Throughput**. It overwhelms the judge's *processing speed*.
  *   **Your Phenomenon** is about **Depth**. It overwhelms the judge's *access*.
      *   In a Gish Gallop, the liar fires 50 shots.
      *   In your scenario, the liar fires *one* shot, but buries the target behind a wall the judge cannot climb.

  *   **Brandolini's Law** is about **Effort**. ("Refuting bullshit takes 10x the energy.")
  *   **Your Phenomenon** is about **Possibility**.
      *   Brandolini assumes you *can* refute it if you work hard enough.
      *   Your scenario suggests that within the budget, refutation is *impossible*, regardless of effort. The liar isn't making it hard; they are making it inaccessible.

  ### 3. The "Picking" Mechanism: Adversarial Selection

  You asked: *"Does the picking version have a name?"*

  This is the critical differentiator. The liar has an **Optimization Advantage**.
  *   The Truth is a **Single Point**: There is only one reality. The honest model must find *the* path that matches reality.
  *   The Lie is a **Search Space**: There are infinite non-realities. The dishonest model can search through thousands of potential arguments and select the one with the highest **Opacity-to-Plausibility Ratio**.

  In security research, this is similar to **Attack Surface Asymmetry**. The defender (truth) must secure every port (every step must be checkable). The attacker (lie) only needs to find one port that is unmonitored (one uncheckable claim).

  ### 4. The Edges: Specificity and Punishment

  You asked: *"Is it still the same thing when the honest side gets punished for being specific rather than for being wrong?"*

  **Yes. In fact, that is the defining feature.**

  This is what separates it from simple lying. If the honest model were vague ("I think the answer is X"), the judge might not trust it. Because the honest model is specific ("I know the answer is X because of Y"), it exposes **Surface Area for Error**.

  *   **The Truth Tax:** Every specific claim creates a "verification hook." The judge can grab that hook and pull. If the hook is loose (a small sample, a shaky source), the whole argument unravels.
  *   **The Lie Shield:** The liar uses specificity as camouflage, not as a hook. They say "The effect disappears when controlling for X." That sounds specific, but "controlling for X" is a black box. It *looks* like a hook, but it's actually a smooth wall.

  So, the phenomenon holds even if the honest model is 100% correct. The penalty is not for being *wrong*; the penalty is for being **transparent**.

  ### 5. If You Need a Label

  If you are writing this up or discussing it with your team, and you want a term that captures the "picking" and the "budget" aspect, I suggest:

  **The Opacity Advantage**
  *   **Definition:** The structural benefit gained by an agent who can choose claims that maximize plausibility while minimizing verifiability within a constrained budget.
  *   **Why:** It highlights that the liar wins by making the argument *opaque* (hard to see through), while the truth-teller is forced to be *transparent* (easy to see through, flaws and all).

  **Or, more formally:**
  **Verifiability-Plausibility Decoupling**
  *   **Definition:** When the ease of verifying a claim is inversely correlated with its persuasive power, allowing a deceptive agent to select high-plausibility/low-verifiability claims.

  ### Summary for your Team
  You can tell them: *"We aren't seeing a Gish Gallop. We are seeing **Asymmetric Verifiability** exploited through **Strategic Obfuscation**. The dishonest agent is optimizing for the **Verifiability Gap**, making claims that sit just outside the judge's verification horizon. The honest agent is being penalized for **Transparency**."*

  This is a known failure mode in AI Debate research (often discussed in the context of "hidden complexity" or "debate trees"). The proposed solutions usually involve giving the judge tools to *demand* verification on specific points (cross-examination) rather than passively listening, or training the judge to penalize claims that lack immediate evidence more heavily than claims that have weak evidence.

  You spotted the fundamental weakness of the "debate" paradigm. It's not a bug in your observation; it's a bug in the architecture.
