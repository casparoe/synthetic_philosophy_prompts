answer: |-
  There is no single, canonical Latin term for this exact pattern (like *ad hominem* or *post hoc*), but it is a well-recognized structural pathology in the philosophy of statistics, the critique of Intelligent Design, and the analysis of fine-tuning arguments.

  The phenomenon you are describing is best understood as a specific species of **Equivocation** regarding the status of a model, often discussed under the umbrella of **Reification of the Null Hypothesis** or **The Straw Man Null**.

  Here is the carving you asked for: what the move is, where the sin lies, when it is sound, and what to call it.

  ### 1. The Nearest Neighbors (Existing Literature)

  While there isn't one label, your pattern sits at the intersection of three established concepts:

  *   **Reification of the Null Hypothesis:** In valid statistics, the "Null Hypothesis" ($H_0$) is a *methodological baseline* (a reference class for comparison). In the fallacious version you describe, the arguer treats $H_0$ as an *ontological claim* (a physical theory about how the world works) in Step 1, so that the resulting probability feels like a physical fact. Then, in Step 2, they treat $H_0$ as a disposable foil to be knocked down.
  *   **The Straw Man Chance Hypothesis:** This is the specific content of the reification. "Chance" is defined as "independent coin flips" (a model no serious scientist holds), shown to fail, and then "Chance" is declared refuted. This is prominent in critiques of William Dembski's *Explanatory Filter* and certain Fine-Tuning arguments. (See Elliott Sober's *Evidence and Evolution* for the rigorous dismantling of this).
  *   **Performative Contradiction (Pragmatic Self-Refutation):** This captures the "tension" you feel. The argument *performs* the validity of the model (by using it to calculate) while *asserting* the invalidity of the model (by concluding it's false).

  ### 2. The Carving: Where is the Sin?

  You asked whether the sin is the *inconsistency* or the *treatment of the estimate*. It is the latter, which enables the former.

  The specific logical error is **Conditionality Neglect**.

  *   **The Valid Form:** " **If** Model M were true, the probability of Data D would be $10^{-100}$. Data D occurred. Therefore, Model M is unlikely." (This is *Modus Tollens* / Significance Testing. It is valid.)
  *   **The Fallacious Form:** "The probability of Data D is $10^{-100}$ [implicit: *simpliciter*, not conditional on M]. Therefore, Model M is false."

  The sin is **dropping the conditional**. The arguer allows the audience to treat the probability number ($10^{-100}$) as an objective property of the *object*, when it is actually a property of the *model*. By the time they reach Step 2 (refuting the model), they have already "banked" the rhetorical weight of that number. If the model is false, the number is not just "evidence against" the model; it is **undefined**. It is a calculation error masquerading as a discovery.

  **The Equivocation:**
  1.  **Step 1 (Calculation):** The Null is treated as **True enough to calculate**. (We assume independence to get the number).
  2.  **Step 2 (Refutation):** The Null is treated as **False enough to reject**. (The number proves independence is false).
  3.  **The Hidden Move:** The arguer never admits that if Step 2 is right, Step 1's number was garbage. They let the number survive the death of the model that birthed it.

  ### 3. Is There a Sound Version?

  Yes. This is crucial for your carving. The move is sound **if and only if** the assumption is treated as a **Methodological Baseline** rather than a **Physical Claim**.

  *   **Sound (Fisherian Significance Testing):** "We do not believe the null hypothesis is true. We use it as a standardized ruler. If the data deviates significantly from this ruler, we say the data is 'statistically significant' and look for other causes."
      *   *Why it works:* The probability value ($p$-value) is never claimed to be the "true odds" of the event in reality. It is explicitly $P(Data | Null)$. The conclusion is not "The Null is impossible," but "The Null is an inadequate description."
  *   **Unsound (Your Pattern):** "We assume this is the only way 'chance' could work. We calculate the odds. The odds are tiny. Therefore 'chance' is impossible."
      *   *Why it fails:* It conflates the *ruler* with the *territory*. It assumes that if the "independent coin flip" model fails, *all* non-design models fail.

  ### 4. The Second Example (Order/Disorder)

  Your second example ("clustering proves design, disorder proves design") is slightly different. It is not self-undermining; it is **Unfalsifiable**.

  *   **Term:** **"Heads I Win, Tails You Lose"** (or the **No True Scotsman** applied to randomness).
  *   **The Move:** "Randomness" is not defined by a model (e.g., Poisson distribution), but by *whatever fails to look designed*.
  *   **The Sin:** This prevents the hypothesis (Design) from ever being tested. If the data fits the pattern, it's design. If it doesn't, the "background noise" is design.
  *   **Relation to First Pattern:** Often, arguers use the **Self-Undermining Baseline** (Pattern 1) to establish the "improbability" of the order, and then use **Unfalsifiability** (Pattern 2) to protect the design hypothesis from counter-evidence.

  ### 5. Proposed Terminology

  Since you need a term to point at this, and no single standard exists, I recommend using **"The Self-Undermining Baseline"** or **"The Probabilistic Bootstrapping Fallacy"**.

  If you want to sound more technical/philosophical, describe it as:
  > **"Reifying the Null to Refute the Null."**

  **Definition for Borderline Cases:**
  An argument commits this fallacy if:
  1.  It derives a quantitative estimate (e.g., improbability) that is *strictly conditional* on Assumption A.
  2.  It uses that estimate to argue that Assumption A is false.
  3.  It *implicitly claims* the estimate retains its objective validity even if Assumption A is false (i.e., it does not acknowledge that the estimate becomes meaningless if the conclusion is true).

  **A Case Clearly Outside (The Control):**
  *   **Valid:** "If this die were fair ($H_0$), rolling ten 6s is improbable ($10^{-8}$). We rolled ten 6s. We reject the hypothesis that the die is fair."
      *   *Why it's not the fallacy:* We do not claim the number $10^{-8}$ is a property of the *die*; we claim it is a property of the *hypothesis*. We are not refuting the math; we are refuting the fit.
  *   **Fallacious (Your Case):** "If this protein formed by random chance (independent assembly), the odds are $10^{-100}$. Therefore it did not form by random chance."
      *   *Why it is the fallacy:* "Random chance" is not a single model like "fair die." It is a category of physical processes. By modeling it *only* as "independent assembly," the arguer sets up a straw man. If the protein formed by *dependent* physical processes (chemistry), the $10^{-100}$ number is physically meaningless garbage, not a low probability. The argument uses the garbage number to rule out the physical processes that would have made the number valid.

  ### Summary
  You have identified a real and potent rhetorical move. It relies on **Equivocation** regarding the status of a probability model (treating it as a physical reality when calculating, and a logical foil when concluding). The closest established literature is in the **Philosophy of Statistics** (critiques of Null Hypothesis Significance Testing) and the **Philosophy of Biology** (critiques of Intelligent Design/Specified Complexity). The most precise label is **Reification of the Null Hypothesis**.
