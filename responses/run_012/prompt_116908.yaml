  Here is the single principle you are looking for, followed by the application to your infinite case, the verdict I would overturn, and the premise I worry about most.

  ### The Principle: Monotonicity and Determinacy

  The strategy-stealing argument rests on two distinct pillars. Confusion arises when we conflate the **structural condition** (when the argument is valid) with the **outcome condition** (what the argument proves).

  **1. Soundness Condition (Monotonicity):**
  The argument is sound if and only if the game satisfies **Move Monotonicity**.
  *   *Definition:* For any game state $S$ and any legal move $m$ available to the current player, having played $m$ is never a disadvantage. Formally, if $V(S)$ is the game-theoretic value for the player to move, then having an extra piece/move on the board must result in a value $V' \ge V$ for that player.
  *   *Implication:* This condition kills **Chess** (zugzwang exists; a move can reduce your value). It sustains **Hex**, **Chomp**, and **Tic-tac-toe** (an extra mark/stones is strictly helpful or neutral).

  **2. Outcome Condition (Determinacy + No-Draws):**
  What the argument *delivers* depends on the game's outcome space.
  *   *If Draws are Impossible (Finite, No-Draw):* The argument proves **Player 1 Wins**. (Since P2 cannot win, and a draw is impossible, P1 must win).
  *   *If Draws are Possible:* The argument proves **Player 2 Cannot Force a Win** (i.e., Player 1 can force at least a Draw). It does *not* prove Player 1 wins. (See **Tic-tac-toe**).
  *   *Requirement:* This inference requires **Determinacy** (one player must have a winning or drawing strategy). In finite perfect-information games, Zermelo's Theorem guarantees this. In infinite games, it does not.

  ### Verdict on the Infinite Game

  **Verdict:** The argument proves that **the Second Player has no winning strategy.** Consequently, **the First Player can force a non-loss (Win or Draw), *provided the game is determined*.**

  *   **Reasoning:** The strategy-stealing logic (assume P2 wins $\to$ P1 steals $\to$ contradiction) relies only on Monotonicity. It successfully eliminates the "P2 Wins" outcome.
  *   **Caveat:** In infinite games, "P2 does not win" does not automatically mean "P1 wins or draws" unless the game is **determined** (i.e., it is not possible that *neither* player has a winning strategy). For most "natural" infinite combinatorial games (like Infinite Hex), Borel Determinacy applies, so you can safely conclude P1 can at least draw. But without that axiom, the argument leaves open the possibility that the game is undetermined.

  ### The Verdict to Overturn

  To get a clean principle, you must overturn your verdict on the **Asymmetric Board (pre-marked square)**.

  **Your Verdict:** "Stealing is dead there too."
  **Correction:** **Strategy Stealing still works**, provided the pre-marked square is in **Player 1's favor** and **Monotonicity holds**.

  *   **Why:** You likely rejected this because the *initial symmetry* is broken. However, initial symmetry is only required to justify the *standard* proof where P1 makes a dummy move to *create* an advantage.
  *   **The Logic:** If the board starts with a square pre-marked for P1, simply assume P2 has a winning strategy from *that specific asymmetric state*. P1 makes an arbitrary move $m$. P1 now has the pre-marked square *plus* move $m$. P1 adopts P2's strategy, ignoring $m$. If P2's strategy ever calls for playing on $m$, P1 plays elsewhere (a new dummy). Because of **Monotonicity**, having the pre-marked square *and* the extra move $m$ (or its substitute) is strictly better than the state P2's strategy expects. Thus, P1 wins. Contradiction.
  *   **Conclusion:** The argument is not dead; it is actually *more* direct. The lack of board symmetry doesn't matter; what matters is that P1 can simulate P2's strategy while holding strictly more resources.

  ### The Weakest Premise

  The premise carrying the most hidden weight is **Determinacy**, specifically in the context of **infinite games**.

  *   **Why:** In finite games (Hex, Chess, Tic-tac-toe), Zermelo's Theorem is a freebie; we know the game is determined. In infinite games, Determinacy is not guaranteed by the rules alone; it requires set-theoretic axioms (like the Axiom of Determinacy or Borel Determinacy).
  *   **The Risk:** If you apply strategy stealing to an infinite game that turns out to be **undetermined**, the argument proves "P2 has no winning strategy," but it **fails to imply** "P1 has a winning/drawing strategy." It leaves you in a limbo where neither player can force a win, and P1 cannot necessarily force a draw either. If Determinacy fails, the "Non-Loss" conclusion collapses, even if Monotonicity holds.

  ### Summary Table

  | Game | Monotonicity? | Draws? | Determinate? | Strategy Stealing Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Hex** | Yes | No | Yes | **P1 Wins** |
  | **Chomp** | Yes | No | Yes | **P1 Wins** |
  | **Tic-Tac-Toe** | Yes | Yes | Yes | **P1 Non-Loss (Draw)** |
  | **Chess** | **No** (Zugzwang) | Yes | Yes | **Argument Fails** |
  | **Asymmetric (P1+)**| Yes | No | Yes | **P1 Wins** (Your verdict was too pessimistic) |
  | **Infinite** | Yes | Yes | **Maybe** | **P2 No Win** (P1 Non-Loss *if* Determinate) |
