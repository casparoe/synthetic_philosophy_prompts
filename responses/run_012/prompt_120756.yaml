answer: |-
  # Joint Statement on Algorithmic Probability and Inductive Norms

  **Signatories:** Representatives of the Universal-Prior Realist Camp and the Finite-Modeler Pragmatist Camp

  **Date:** October 26, 2023

  **Purpose:** This document records the results of an adversarial collaboration regarding the normative status of Solomonoff induction, the interpretation of Kolmogorov complexity, and the scope of Occam's razor. It distinguishes mathematical agreements from epistemic disagreements and specifies empirical or theoretical conditions under which either position would be untenable.

  ## Part I: Agreed Claims

  Both camps accept the following mathematical and conceptual claims. Acceptance of these claims does not entail concession of the central normative dispute.

  1.  **Mathematical Definitions:** Both camps accept the standard definitions of a Universal Turing Machine (UTM), prefix-free complexity, and the Solomonoff prior. Specifically, for a fixed UTM $U$, the prior probability of a finite binary string $x$ is $M_U(x) = \sum_{p: U(p)=x*} 2^{-|p|}$, where the sum is over all prefix-free programs $p$ that output $x$ or a string starting with $x$.
  2.  **The Invariance Theorem:** Both camps accept the Invariance Theorem as a mathematical truth. For any two UTMs $U_1$ and $U_2$, there exists a constant $C_{1,2}$ such that for all finite strings $x$, $|K_{U1}(x) - K_{U2}(x)| \le C_{1,2}$. Consequently, the ratio of the Solomonoff priors derived from $U_1$ and $U_2$ is bounded by a factor dependent only on the machines, not on $x$.
  3.  **Finite Data Sensitivity:** Both camps agree that for any finite data set of size $n$, there exist pairs of UTMs $(U_1, U_2)$ such that the constant $C_{1,2}$ exceeds the information content of the data. In such cases, the choice of UTM determines the maximum-a-posteriori hypothesis, regardless of the data observed.
  4.  **Conditional Normativity:** Both camps agree on the following conditional statement: *If* an agent adopts the Solomonoff prior derived from a specific UTM as their sole inductive prior, *and* treats that UTM as fixed, *then* preferring hypotheses with shorter description lengths is a theorem of probability theory, not a heuristic. The dispute concerns the antecedent: whether an agent *ought* to adopt this prior and treat the UTM as fixed.
  5.  **Falsification Conditions:**
      *   **For the Realists:** Their position is falsified if it is demonstrated that no candidate for a "natural" or "privileged" UTM yields predictive accuracy superior to an ensemble of tailored, finite model classes across a broad range of environments, particularly in the finite-data regime.
      *   **For the Pragmatists:** Their position is falsified if it is demonstrated that there exists a specific UTM such that, for all computable environments, the predictive error of the corresponding Solomonoff prior converges faster than any alternative method that relies on explicitly chosen model classes, and that this UTM can be identified without reference to the environment being modeled.

  ## Part II: Disagreements Table

  The following table isolates the specific points of divergence. The "Crux" column identifies the underlying assumption driving the disagreement.

  | Sub-Question | Realist Formulation | Pragmatist Formulation | Crux | Test / Case | Realist Prediction | Pragmatist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Asymptotic vs. Finite** | The constant $C_{1,2}$ is asymptotically negligible. Rational inference is defined by the limit as $n \to \infty$. | The constant $C_{1,2}$ is epistemically dominant. Rational inference is defined by performance at feasible $n$. | Whether the limit behavior of an ideal agent constrains the norms of a bounded agent. | **The Two-Encoding Test** (See below). | $D(n)$ is bounded. For the *correct* UTM, the bound is small enough that truth dominates for realistic $n$. | $D(n)$ is bounded mathematically, but the bound is arbitrary. For any feasible $n$, a UTM can be chosen to favor the false hypothesis. |
  | **2. Language Independence** | "Language-independent" means invariant up to a constant. There exists a "natural" UTM (e.g., simple instruction set) that minimizes this constant for physical laws. | "Language-independent" is a misnomer. Invariance up to a large constant is not independence. All UTMs are equally arbitrary without external justification. | Whether a "natural" UTM exists distinct from the set of all valid UTMs. | **The Two-Encoding Test** (See below). | The difference in log-odds between a "natural" UTM and a "pathological" UTM vanishes as $n$ increases. | The difference remains significant for all $n$ achievable in physical systems if the pathological UTM is admissible. |
  | **3. Normative Status** | Occam's razor is a rational requirement derived from the uniqueness of the universal prior. | Occam's razor is a pragmatic heuristic indexed to a loss function and computational budget. | Whether simplicity is a property of the world (via the prior) or a property of the agent's constraints. | **The Finite-Horizon Case** (See below). | The agent who minimizes description length relative to the standard UTM maximizes expected accuracy. | The agent who minimizes description length relative to a *tailored* encoding maximizes expected accuracy. |

  ### Detailed Specification of Mandatory Cases

  #### Case 1: The Two-Encoding Test
  **Setup:** Consider a finite binary sequence generated by one of two mechanisms: $H_{fair}$ (independent fair coin flips) or $H_{\pi}$ (the initial segment of the binary expansion of $\pi$). Let $U_1$ be a UTM with a primitive instruction for generating $\pi$. Let $U_2$ be a UTM lacking this primitive but capable of simulating $U_1$ with overhead $L$. We observe the first $n$ bits of $\pi$. Let $D(n)$ be the difference in log-odds for the next bit being consistent with $H_{\pi}$ under the Solomonoff prior defined by $U_1$ versus $U_2$.

  **Question:** What is the behavior of $D(n)$ as $n$ grows?
  *   **Realist Prediction:** $D(n)$ stays bounded by a machine-dependent constant $C_{1,2}$. However, for any *physically natural* UTM, $C_{1,2}$ is small. As $n$ increases, the evidence for $H_{\pi}$ overwhelms the prior bias. The choice of UTM is epistemically innocent for sufficiently large $n$.
  *   **Pragmatist Prediction:** $D(n)$ stays bounded by $C_{1,2}$ for fixed machines, but $C_{1,2}$ scales with the simulation overhead $L$. By choosing $U_2$ with sufficiently large $L$, $D(n)$ can be made arbitrarily large at every finite $n$. Since there is no non-circular method to select $U_1$ over $U_2$ without assuming the structure of $\pi$ beforehand, the prior is not stable for finite agents.
  *   **Falsification:**
      *   **Against Realists:** Prove that for all "simple" UTMs, the constant $C_{1,2}$ required to simulate a $\pi$-primitive machine exceeds the information content of any data set physically obtainable in the universe.
      *   **Against Pragmatists:** Identify a specific UTM (e.g., based on a specific logic gate set) that yields superior predictive performance on $H_{\pi}$ compared to $U_2$ without encoding knowledge of $\pi$ in the instruction set, thereby demonstrating a "natural" bias.

  #### Case 2: The Finite-Horizon Encoding Case
  **Setup:** Let $S$ be a specific binary string of length 100. Let $E_{std}$ be standard binary encoding. Let $E_{spec}$ be an encoding where $S$ is mapped to the single bit '0', and all other strings of length 100 are mapped to '1' followed by their standard representation. Consider a hypothesis space where the likelihood of the data is identical under both encodings (e.g., the hypothesis is simply "The string is $S$").

  **Question:** Which encoding determines the complexity penalty?
  *   **Realist Prediction:** The Realist rejects $E_{spec}$ as a valid basis for the universal prior because it hardcodes the data into the language. The complexity must be measured relative to a fixed, data-independent UTM (using $E_{std}$). The case favors the Realist view that there are constraints on admissible languages to prevent overfitting.
  *   **Pragmatist Prediction:** The Pragmatist notes that $E_{spec}$ is a valid encoding scheme. If the agent has reason to suspect $S$ is likely (e.g., from domain knowledge), using $E_{spec}$ is optimal. The case favors the Pragmatist view that the "best" encoding is contingent on the agent's background knowledge and loss function, not a universal standard.
  *   **Principled Reply:**
      *   **Realist Reply:** $E_{spec}$ shifts the complexity from the hypothesis to the machine description. A universal prior must account for the complexity of specifying $E_{spec}$ itself.
      *   **Pragmatist Reply:** Specifying $E_{spec}$ is only complex if one assumes a "standard" meta-language. If the agent's hardware natively supports $E_{spec}$, the cost is zero. Thus, complexity is relative to the hardware/implementation, not abstract logic.

  ## Part III: Resolution of Verbal and Genuine Disputes

  Upon review, we identify that portions of our disagreement are verbal, stemming from ambiguous terminology, while the remainder constitutes a genuine divergence in epistemic norms.

  **1. Ambiguity in "Language-Independence"**
  *   **The Ambiguity:** The term "language-independent" is used by Realists to mean "invariant up to an additive constant in the limit." It is used by Pragmatists to mean "insensitive to the choice of encoding for finite data."
  *   **Disambiguation:**
      *   **Realists** should accept the phrasing: "The universal prior is invariant up to a constant, but the magnitude of that constant is epistemically significant for finite data."
      *   **Pragmatists** should accept the phrasing: "The universal prior defines an equivalence class of measures that converge to the same truth in the limit, provided the truth is computable."
  *   **Resolution:** Both sides agree that "language-independent" does not mean "encoding-invariant for finite $n$." The dispute is whether the equivalence class is sufficiently tight to be useful.

  **2. Ambiguity in "Simplicity"**
  *   **The Ambiguity:** Realists refer to "simplicity" as Kolmogorov complexity relative to a fixed UTM. Pragmatists refer to "simplicity" as description length relative to a chosen model class.
  *   **Disambiguation:**
      *   **Realists** should acknowledge that for bounded agents, "simplicity" effectively operationalizes as "compressibility relative to available computational resources."
      *   **Pragmatists** should acknowledge that "compressibility relative to resources" converges toward Kolmogorov complexity as resources approach infinity.
  *   **Resolution:** The term "simplicity" shall be qualified as either *absolute* (limiting Kolmogorov complexity) or *relative* (resource-bounded description length).

  **3. Genuine Disagreement**
  After disambiguation, a genuine normative disagreement remains.
  *   **The Core Issue:** Whether there exists a *presumptive* UTM that an agent should adopt in the absence of specific domain knowledge.
  *   **Realist Stance:** Yes. In the absence of specific knowledge, the agent should adopt the prior corresponding to the simplest available UTM (e.g., minimal instruction set), as this minimizes the worst-case constant across the space of computable environments.
  *   **Pragmatist Stance:** No. In the absence of specific knowledge, the agent should adopt a mixture of priors or select a UTM based on the computational cost of inference, as the "simplest" UTM may impose prohibitive overhead for specific prediction tasks.

  **Conclusion**
  We agree that the mathematics of algorithmic information theory is settled. We disagree on the bridge from these mathematical facts to normative rules for finite agents. The Realists maintain that the asymptotic properties of the universal prior constrain rational belief even in the finite regime. The Pragmatists maintain that finite constraints break the link between asymptotic optimality and rational obligation. Future work should focus on quantifying the "naturalness" of specific UTMs against empirical data sets to determine if the Realist's presumed constant is indeed negligible in practice.

  ***

  **Signed,**

  *For the Universal-Prior Realist Camp*

  *For the Finite-Modeler Pragmatist Camp*
