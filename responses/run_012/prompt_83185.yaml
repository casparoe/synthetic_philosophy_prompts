answer: |-
  **MEMORANDUM**

  **TO:** Clinical AI Review Board
  **FROM:** Chair, Clinical AI Review Board
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Vendor Sepsis-Alert Model Licensing

  **1. Purpose and Context**
  This memo frames the Board's vote this Thursday regarding the licensing of [Vendor Name]'s sepsis-prediction model. We are confronted with a system that performs well on surface metrics but fails on mechanistic transparency. The vendor's model reduces mortality risk in held-out data and alerts earlier than our current protocol. However, our internal audit indicates the model's confidence scores are driven primarily by the presence of prior lab orders—a proxy for clinician suspicion—rather than novel physiological signals. Furthermore, the model's generated explanations are clinically plausible but unfaithful to the underlying calculation.

  We have three options before us: license the outcome-optimized model with monitoring; mandate the process-optimized model (trained on rationale quality); or reject the distinction and judge solely on alert utility. This opinion synthesizes the technical evidence and ethical constraints to propose a path forward.

  **2. Recommendation and Time Frame**
  I recommend a **Conditional License for a 12-Month Prospective Pilot**, restricted to high-acuity wards (ICU and Step-Down), utilizing the **outcome-trained model**.

  We should **not** mandate the process-trained model as a condition of safety, nor should we reject the tool entirely at this stage. The pilot will conclude with a mandatory re-evaluation vote. If, at the end of 12 months, we cannot demonstrate that the alerts provide lead time *independent* of existing clinician suspicion, or if we observe significant alert-induced testing inflation, the license will be revoked.

  **3. Requirements for Vendor and Internal Monitoring**
  To proceed, the following conditions must be met:

  *   **Vendor Deliverables:**
      *   **Feature Access:** The vendor must provide our data science team with access to feature importance weights specific to our deployment environment, not just global averages.
      *   **No "Rationale Washing":** The vendor must explicitly label all generated explanations as *post-hoc summaries* rather than *causal reasoning*. They are prohibited from marketing the process-trained version as "safer" or "more transparent" regarding the decision mechanism.
      *   **Retraining Commitment:** If our monitoring shows the "lab order" feature contributes >40% of the score variance in our population, the vendor must commit to a retraining cycle to decouple prediction from prior testing.

  *   **Internal Post-Deployment Monitoring:**
      *   **Lead-Time Validation:** We will not measure success by sensitivity alone. We must measure *actionable lead time*. An alert is only valid if it precedes the clinician's decision to order the confirmatory lab, not merely the lab result.
      *   **Testing Inflation Metric:** We will track the rate of sepsis-related lab orders per 1,000 patient-days. A significant increase without a corresponding increase in confirmed sepsis cases indicates the model is creating a self-fulfilling prophecy (alert $\rightarrow$ test $\rightarrow$ alert).
      *   **Override Tracking:** Clinicians must be able to easily dismiss alerts with a reason code. We will monitor dismissal rates to gauge alert fatigue.

  **4. The Strongest Case Against This Recommendation**
  The most rigorous argument against this conditional approval is that we are knowingly licensing a system that may automate bias rather than detect disease. If the model predicts sepsis largely because a clinician already suspected sepsis (evidenced by the lab order), the system offers no new diagnostic information. It risks creating a feedback loop: the model alerts based on the order, the clinician trusts the alert and orders more tests, and the model becomes more confident.

  By approving this, we risk validating a tool that increases costs and workload without improving physiological detection. The strongest dissenting view holds that we should reject the model until the vendor can prove the prediction holds even when the "lab order" feature is masked. My recommendation accepts this risk in exchange for the possibility of genuine early warning, but we must acknowledge that we are gambling with clinical resources.

  **5. On Process Supervision and System "Work"**
  This Board must answer two foundational questions to vote coherently.

  *   **Can we demand process-based supervision?**
      Plainly: **No.** We cannot coherently demand process-based supervision of a system where the stated reasoning is not what produces the answer. If the feature attribution shows the score is driven by lab orders, but the explanation discusses heart rate variability, supervising the explanation is supervising a fiction. We would be auditing the brochure, not the engine. We can demand process outputs for *usability* (to help clinicians understand *how to interact* with the alert), but we cannot accept them as evidence of *safety* or *validity*. To do so is to confuse persuasion with proof.

  *   **Does an alert that arrives early by a route we would not endorse count as "working"?**
      **Yes, but conditionally.** In medicine, we are consequentialists. If an alert arrives early via a dubious route (e.g., detecting administrative patterns rather than physiology) and that alert leads to earlier antibiotics and a saved life, the system has "worked" for the patient. However, it has not "worked" for the system if that route relies on unsustainable practices (like excessive testing) or if it fails to generalize to settings where those administrative patterns differ.
      Therefore, an alert counts as working only if the *outcome* is positive AND the *side effects* of the route (cost, bias, fatigue) do not outweigh the benefit. We are licensing the outcome, but we are monitoring the route to ensure it does not become toxic.

  **6. Conclusion**
  We are not voting on whether this model is perfect; it is not. We are voting on whether it is useful enough to warrant the risk of deployment under strict observation. The process-trained model is a distraction; it improves the story, not the story's truth. The outcome-trained model is the tool we have. It is flawed, potentially circular, but potentially life-saving.

  I move that we approve the 12-month pilot under the conditions outlined above. We will supervise the impact, not the explanation.

  **Chair, Clinical AI Review Board**
