answer: |-
  This is a precise and necessary intervention. The slogan "all models are wrong" has become a permission slip for intellectual laziness, shielding modelers from the obligation to understand *why* their models work. Your distinction between **idle falsehoods** and **load-bearing falsehoods** cuts through this.

  I will argue for your claim: Friedman's instrumentalism is valid only for idle falsehoods, but since the philosophically and practically significant cases are almost exclusively load-bearing, Friedman's defense is practically useless where it matters most.

  ### I. The Criterion: Sensitivity of Output to Assumption Correction (SOAC)

  To sort assumptions, we need a criterion that is not merely subjective. We cannot rely on the modeler's intuition, because, as you note, a stubborn modeler can claim any assumption is essential.

  **The Criterion:** An assumption $A$ in model $M$ is **load-bearing** if, within the target domain $D$, the partial derivative of the model's predictive error with respect to the truth-value of $A$ is non-zero and significant. Conversely, $A$ is **idle** if correcting $A$ (replacing it with $A'$, where $A'$ is true) results in a change to the model's output that is negligible relative to the model's inherent noise floor or measurement error.

  Operationally, this requires a **counterfactual robustness test**:
  1.  Identify the false assumption $A$.
  2.  Construct a variant model $M'$ where $A$ is replaced by a more realistic $A'$ (or removed).
  3.  Compare predictions $P_M$ and $P_{M'}$ against ground truth in domain $D$.

  **Resisting the "Stubborn Modeler" Rejoinder:**
  The obvious objection is that a modeler can simply refuse to construct $M'$, or construct a incompetent version of $M'$ that performs poorly, thereby "proving" $A$ was load-bearing. This is the "gaming the sensitivity analysis" problem.

  We resist this by demanding **continuity of mechanism**. If $A$ is truly load-bearing, there must be a structural reason *why* the correction breaks the prediction.
  *   **Idle:** The assumption acts as a simplifying coordinate transformation. (e.g., treating a discrete sum as an integral). The mechanism of prediction does not rely on the discreteness; the integral is just a computationally cheaper way to calculate the sum.
  *   **Load-Bearing:** The assumption acts as a *substitute for a mechanism*. The model predicts correctly only because the false assumption cancels out an omitted variable or creates an artificial constraint that mimics the data.

  If a modeler claims an assumption is load-bearing but cannot articulate the causal pathway by which the falsehood generates the signal (other than "the math stops working"), they are admitting the model is a black box, not a theory. The criterion resists stubbornness because it shifts the burden from "does the model run?" to "does the *correction* break the *mechanism*?"

  ### II. Epistemic Stakes: Why the Distinction Matters

  If Friedman were right generally, we could treat models as oracle boxes: feed in inputs, get predictions, ignore the internals. But the distinction between idle and load-bearing falsehoods determines **external validity** and **policy invariance**.

  1.  **Generalizability (The Domain Shift Problem):**
      *   **Idle Falsehoods:** Because the prediction does not depend on the falsity, the model tends to be robust to domain shifts. If you treat a population as continuous (false) but the prediction holds for discrete counts (true), the model will likely work for both small and large populations.
      *   **Load-Bearing Falsehoods:** These models are often "overfit" to the structural conditions of the training environment. If the environment changes in a way that uncouples the false assumption from the outcome, the model fails catastrophically. This is the essence of the Lucas Critique in economics: if agents change behavior (making the "fixed preference" assumption false), the policy prediction breaks.

  2.  **Teaching and Trust:**
      *   **Idle:** We should teach these as *approximations*. We trust them because we understand the bound of the error (e.g., "valid when $N > 1000$").
      *   **Load-Bearing:** We should treat these as *empirical regularities masquerading as theory*. Trust should be low, and reporting must explicitly flag the assumption as a "known structural vulnerability." To teach a load-bearing falsehood as a neutral simplification is to teach students to ignore the very thing that will cause the model to fail in a crisis.

  ### III. Concrete Examples

  I will avoid the standard "frictionless plane" or "homo economicus" examples to ensure we are testing the distinction afresh.

  **1. Idle Falsehood: Continuous Approximation in Population Genetics**
  *   **The Model:** Differential equation models of allele frequency change (e.g., selection-mutation balance).
  *   **The Falsehood:** Populations are discrete counts of organisms ($N \in \mathbb{Z}$), but the models treat allele frequencies as continuous variables ($p \in [0,1]$) governed by differential equations.
  *   **Why it's Idle:** In large populations ($N \to \infty$), the stochastic noise of discrete sampling (genetic drift) becomes negligible relative to selection pressure. If you correct the assumption (use a discrete Wright-Fisher simulation), the predicted equilibrium frequencies differ from the continuous model by a term of order $1/N$. For $N=10,000$, this difference is swamped by measurement error in sequencing.
  *   **Verdict:** The falsehood is a computational convenience. Correcting it does not degrade the prediction meaningfully. Friedman is safe here.

  **2. Load-Bearing Falsehood: Causal Sufficiency in Observational DAGs**
  *   **The Model:** Causal discovery algorithms (e.g., PC or FCI algorithms) used in epidemiology or social science to infer causal direction from correlation data.
  *   **The Falsehood:** The assumption of **Causal Sufficiency** (no unmeasured latent confounders). The model assumes all common causes of the measured variables are themselves measured. We know this is almost certainly false in complex biological/social systems (omitted variable bias is the norm).
  *   **Why it's Load-Bearing:** The algorithm identifies causal direction *specifically* by ruling out confounding structures. If you relax the assumption (admit latent confounders), the set of observationally equivalent graphs explodes. The algorithm can no longer distinguish $A \to B$ from $A \leftarrow L \to B$.
  *   **The Degradation:** If you correct the assumption (by acknowledging latent confounders), the specific causal claims (e.g., "Drug X cures Y") lose their identification. The model *requires* the falsehood to output a specific directional graph. If you tell the truth (that we haven't measured everything), the model outputs "I don't know."
  *   **Verdict:** The prediction (a specific causal graph) depends entirely on retaining the false assumption that we have measured everything. This is a load-bearing falsehood. Friedman fails here because the "prediction" is an artifact of the lie.

  ### IV. The Strongest Objection: The "Research Program" Defense

  **The Objection:**
  A sophisticated instrumentalist (perhaps a Lakatosian) will argue: *"Being load-bearing is not a permanent property of the assumption, but a temporary state of the science. Every load-bearing falsehood is simply a placeholder for a deeper theory that hasn't been developed yet. To reject the model because the assumption is load-bearing is to demand perfect theory before allowing progress. We use the falsehood to keep the research program alive until we can solve for the true mechanism."*

  In this view, the Representative Agent in macroeconomics isn't a lie we should discard; it's a scaffold we hold up until we can solve heterogeneous agent dynamics at scale.

  **The Rebuttal:**
  This objection conflates **heuristic scaffolding** with **structural deception**.

  1.  **Degenerate vs. Progressive:** A load-bearing falsehood becomes epistemically vicious when it creates a *degenerate* research program (in Lakatos's sense). If the falsehood is load-bearing, efforts to "correct" it are punished (the model breaks). This creates a perverse incentive structure where researchers are actively discouraged from finding the truth. They must spend their ingenuity defending the falsehood rather than replacing it.
  2.  **Misleading Gradients:** In optimization, a "local minimum" looks like a solution. A load-bearing falsehood acts like a local minimum in theory-space. It gives good predictions locally, but the "gradient" it provides for future research points in the wrong direction.
      *   *Example:* If Ptolemaic epicycles (load-bearing falsehood: earth-centered) predict planetary positions well, adding more epicycles improves fit. But it directs research away from heliocentrism. The falsehood isn't just a placeholder; it's a *misleader*.
  3.  **The "Solve It Later" Fallacy:** If the assumption is load-bearing, you *cannot* solve it later within the same framework. You must burn the framework down. Acknowledging an assumption is load-bearing is an admission that the current model is a dead end for mechanistic understanding, not a stepping stone.

  Therefore, while the objection is charitable regarding scientific *process*, it is wrong regarding scientific *truth*. A load-bearing falsehood is not a bridge to the truth; it is often a wall.

  ### V. Uncertainty and Joints

  I want to mark two points of genuine uncertainty in this argument, where my confidence is lower and where evidence could move me.

  1.  **The Spectrum Problem:** I have treated "idle" and "load-bearing" as a binary. In reality, this is likely a spectrum of **sensitivity**. An assumption might be load-bearing for *point predictions* but idle for *interval predictions*, or load-bearing in the *tails* of the distribution but idle in the *mean*.
      *   *What would move me:* If you can show a case where a known load-bearing falsehood consistently guides successful *intervention* (not just prediction) over long time horizons without being corrected. This would suggest that "mechanism" is less important than I claim. I suspect such cases are rare (the "black box" AI problem is the current battleground here), but if deep learning models continue to succeed in robotics despite load-bearing architectural falsehoods about how physics works, I may need to downgrade the requirement for realistic assumptions.

  2.  **The Detection Limit:** My criterion relies on the ability to construct $M'$ (the corrected model). In many complex systems (climate, macroeconomics), we literally *cannot* construct the true model because we don't know the true assumptions. We are stuck in a state where we cannot distinguish between "load-bearing falsehood" and "unknown true mechanism."
      *   *What would move me:* A methodological advance in **structural uncertainty quantification**. If we develop standard tests that can statistically detect load-bearing falsehoods without knowing the truth (e.g., via specific stress tests that break false structures but spare true ones), the distinction becomes empirical rather than philosophical. Until then, there is an epistemic gap where we might mislabel a "hard truth" as a "load-bearing falsehood."

  ### Conclusion

  Your stipulation rescues instrumentalism from its own sloppiness. Friedman was right that we shouldn't discard a model merely because an assumption is false. But he was wrong to imply that the *role* of that falsity doesn't matter.

  If the falsehood is idle, the model is a robust map. If the falsehood is load-bearing, the model is a rigged game. Since the high-stakes domains of policy, medicine, and engineering are dominated by complex systems where simplifying assumptions tend to be load-bearing (because the complexity is the point), the Friedmanite defense is usually a shield for fragility. We should not ask "Does it predict?" We must ask "What is holding up the prediction?" If the answer is "a lie," the model is not useful; it is dangerous.
