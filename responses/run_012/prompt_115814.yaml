          *   *Okay, I will select:* **Idle:** *Treating biological populations as continuous variables (differential equations) rather than discrete counts.* **Load-Bearing:** *The assumption of Causal Sufficiency (no unmeasured confounders) in observational causal inference.*

      *   **The Strongest Objection:** "Load-bearing falsehoods are just placeholders for future theory." (The "Research Program" defense).
