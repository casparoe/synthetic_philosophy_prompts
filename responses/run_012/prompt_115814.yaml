          *   *Load-Bearing:* *Representative Agent Macroeconomics.* The assumption that a single agent represents the whole economy. We know agents are heterogeneous. If you introduce heterogeneity, many standard monetary policy transmission mechanisms break or reverse. This is a classic but fits the "rationalist" vibe. Let's use *Lock-in effects in QWERTY keyboard models*? No. Let's stick with *Representative Agent* but frame it sharply. Or perhaps *Neural Network "Independence" assumptions* in Naive Bayes classifiers used in high-stakes medical diagnosis.
