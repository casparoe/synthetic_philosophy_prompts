prompt: |-
  Okay so I've somehow ended up as the person who has to write the call for proposals for a small foundation that wants to sink about $15M over five years into "the deep determinants of development" — you know, the why-are-some-places-rich-and-others-poor question, and whether the answer is mostly institutions, mostly geography, or mostly culture. I have to decide what to actually ask people to work on and I keep flip-flopping. My fear is that the whole field is a treadmill: every year there's another cross-country regression or another clever historical natural experiment, and it always lands on "institutions matter, with caveats" or "geography matters, with caveats," and none of it accumlates into an answer. The instrument is always questionable (settler mortality, colonial borders, whatever), the outcome is always measured badly, and everybody's preferred cause turns out to be endogenous to everybody else's — geography shapes institutions, institutions shape culture, culture shapes which institutions stick. So I suspect the honest framing is less "which of the three wins" and more "what can we legitimately learn about causation from history at all," and if that's the real question then that's what I want to fund.

  So here's what I want from you: not a lit review, an agenda. If you had my $15M and five years and maybe a dozen teams, which open questions in this area would you actually prioritize, and in what order? Tell me what's upstream of what — which questions, if settled, would make the others tractable — what's tractable with the tools that exist (quasi-experiments, border discontinuities, historical microdata, formal models, maybe some new data sources), what's neglected because it's unfashionable rather than because it's dead, and what's a dead end dressed up as a live one. And price the trade-offs for me: I'd rather fund one thing that could actually change how the field reasons than five things that produce publishable nulls.

  A couple of half-formed ideas from my own notes that you should feel free to shoot down or build on. One colleague keeps pushing "switching cases" — forget decomposing the variance across all countries and just study the places that flipped within a generation or two, using within-pair contrasts like the two Koreas, the two Germanys, Botswana versus Zimbabwe, as the unit of analysis. I can't tell if that's a real research program or a parlor trick. Another idea: run a many-analysts-style exercise where a bunch of teams get handed the same historical dataset and we see how much their answers diverge, as a way of measuring how much of the disagreement is the world and how much is the analyst. And a third: stop asking whether institutions or geography or culture "matters" and instead ask about switching dynamics — under what conditions does a place escape a bad equilibrium, and is that even a causal question or a narrative one. Which of these, or something I'm not seeing, is worth the money — and what evidence over the next couple of years would move it up or down your list?
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A program officer or decision-maker at a small foundation. They have significant funding ($15M over 5 years) but limited capacity (maybe a dozen teams). They are sophisticated, skeptical of the current state of the literature ("treadmill," "instrument is always questionable"), and want genuine progress, not just more papers.
      *   **The Problem:** The "Deep Determinants of Development" literature (Acemoglu, Johnson, Robinson vs. Sachs vs. others) is stuck in a loop of endogeneity, weak instruments, and non-cumulative findings.
      *   **The Goal:** A prioritized research agenda. Not a lit review. Needs to identify upstream questions, tractable methods, neglected areas, and dead ends. Needs to evaluate the user's half-formed ideas.
      *   **Constraints:** $15M/5 years, ~12 teams. High risk tolerance for conceptual breakthroughs, low tolerance for "publishable nulls."
      *   **Tone:** Candid, strategic, critical, actionable.

  2.  **Deconstruct the Current State of the Field:**
      *   *The Big Debate:* Institutions vs. Geography vs. Culture.
      *   *The Method:* Cross-country regressions (flawed N), Historical IVs (settler mortality, etc., flawed exogeneity), Case Studies (hard to generalize).
      *   *The Critique:* Everything is endogenous. Measurement is noisy. Results don't accumulate.
      *   *The User's Insight:* The honest question isn't "which wins?" but "what can we learn about causation from history?"

  3.  **Evaluate the User's Half-Formed Ideas:**
      *   *Idea 1: "Switching Cases" (Koreas, Germanys, Botswana/Zimbabwe).*
          *   *Pros:* Controls for culture/geography implicitly. High contrast.
          *   *Cons:* N is tiny. Selection bias (why *these* splits?). Hard to generalize to the "deep" past.
          *   *Verdict:* Valuable as a specific mechanism test, not a general theory builder. Good for "how institutions persist/change," less good for "why development happens."
      *   *Idea 2: Many-Analysts Exercise.*
          *   *Pros:* Addresses the "researcher degrees of freedom" problem. Meta-science.
          *   *Cons:* Doesn't solve the *substantive* problem, just measures the noise. Might be too methodological/navel-gazing for a development foundation.
          *   *Verdict:* Worth funding as a *component* of a larger project, but not the whole $15M. It diagnoses the disease but doesn't cure it.
      *   *Idea 3: Switching Dynamics/Escape from Bad Equilibria.*
          *   *Pros:* Moves from static "levels" to dynamic "transitions." More policy relevant.
          *   *Cons:* Hard to define causally. Narrative risk.
          *   *Verdict:* This is the strongest substantive direction. It reframes the question from "what are you?" to "how did you change?"

  4.  **Develop the Core Agenda (The "Upstream" Logic):**
      *   *Premise:* We can't solve the "Institutions vs. Geography" debate with better regressions. We need better *measurement* and better *mechanisms*.
      *   *Priority 1: Measurement & Conceptualization (The Foundation).* If we can't measure "state capacity" or "culture" consistently across time/space, regressions are garbage.
      *   *Priority 2: Mechanisms over Reduced Forms (The Engine).* Stop looking for the "effect of institutions on GDP." Look for "how does land tenure affect investment?"
      *   *Priority 3: Dynamics & Transitions (The Outcome).* Focus on the *change*, not the *level*.
      *   *Priority 4: Meta-Science/Robustness (The Quality Control).* Address the user's skepticism about the field's reliability.

  5.  **Drafting the Agenda - Section by Section:**

      *   **Introduction:** Acknowledge the skepticism. Validate the "treadmill" concern. Set the tone (ambitious, critical).
      *   **Strategic Pivot:** Move from "Horse Race" (Inst vs. Geo vs. Cult) to "Mechanisms & Measurement."
      *   **Priority 1: The Measurement Revolution (Upstream).**
          *   *Why:* Garbage in, garbage out. "State capacity" is a black box.
          *   *Action:* Fund teams to build granular, historical micro-data (tax records, census, court logs) rather than using proxies like "colonial origin."
          *   *Budget:* High. Data is expensive.
      *   **Priority 2: Mechanism-First Histories (The "How").**
          *   *Why:* Reduced form IVs tell us *that* X affects Y, not *how*.
          *   *Action:* Fund process tracing combined with quant. "Within-case" variation.
          *   *Connection to User Idea:* This validates the "Switching Cases" idea but expands it.
      *   **Priority 3: Dynamics of Transition (The "When").**
          *   *Why:* Levels are persistent; changes are informative.
          *   *Action:* Focus on "Great Escapes" and "Great Reversals."
          *   *Connection to User Idea:* Builds on the "Switching Dynamics" idea.
      *   **Priority 4: The Robustness Check (Meta-Science).**
          *   *Why:* Address the "analyst divergence" concern.
          *   *Action:* A dedicated, smaller pot for the Many-Analysts project.
      *   **Dead Ends:** Explicitly list what *not* to fund (new cross-country IVs, vague cultural indices, purely theoretical models without data).
      *   **Budget Allocation:** Roughly split the $15M.
      *   **Evaluation Metrics:** How to judge success in 5 years (not just paper counts).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is $15M enough for new data collection?
      *   *Correction:* No, not for *new* archives globally. Focus on *digitizing and harmonizing* existing scattered data (e.g., colonial archives, church records). Or focus on specific regions where data is ripe.
      *   *Critique:* Is the Many-Analysts project too navel-gazing?
      *   *Correction:* Frame it as "Stress Testing the Canon." Don't just re-run regressions; re-evaluate the classic IVs (Settler Mortality, etc.) with modern sensitivity analysis.
      *   *Critique:* The user wants to know what's upstream.
      *   *Correction:* Emphasize that Measurement is the most upstream. Without it, Mechanisms are untestable.

  7.  **Final Polish:**
      *   Ensure the tone is respectful but decisive.
      *   Make sure the "Switching Cases" idea gets a nuanced treatment (it's good for mechanism, bad for generalizability).
      *   Highlight the trade-off: Depth vs. Breadth.
      *   Check against the $15M/5yr/12 teams constraint. (12 teams is roughly $1.25M each. That's a decent sized grant for a PI + postdocs + data).

  8.  **Final Output Structure:**
      *   Executive Summary (The Pivot).
      *   The Hierarchy of Questions (Upstream to Downstream).
      *   The Portfolio (4 Bets).
      *   The "Do Not Fund" List.
      *   Evaluating the User's Ideas.
      *   Success Metrics.

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm dismissing the "Institutions" literature entirely. Acemoglu et al. did win a Nobel for a reason. The point is the *marginal* value of another IV is near zero. The value is in opening the black box. I should explicitly mention the "Black Box" problem.

  Okay, ready to write.
answer: |-
  This is a rare opportunity. Most funding in this space goes to marginal extensions of existing models (another instrument, another decade of data). You are correct: the field is stuck in a local maximum of sophisticated but non-cumulative identification strategies. The "Horse Race" (Institutions vs. Geography vs. Culture) is effectively over; the answer is "all three, endogenously," which is a true but useless statement.

  With $15M over five years and a dozen teams, you cannot solve the whole problem. You can, however, change the *unit of analysis* and the *standard of proof*.

  Here is the agenda I would run. It prioritizes **measurement validity** and **mechanism transparency** over **identification cleverness**.

  ### I. The Hierarchy of Questions (Upstream to Downstream)

  You asked what is upstream of what. In this field, the causal chain is currently broken because the links are poorly defined.

  1.  **Upstream (The Foundation): Measurement & Conceptualization.**
      *   *Current State:* We use proxies (settler mortality, legal origin, distance from equator) because we lack direct measures of the constructs (state capacity, social trust, disease burden) in historical contexts.
      *   *The Bottleneck:* You cannot identify the causal effect of "institutions" if your variable for "institutions" is actually capturing "colonial investment strategy" or "population density."
      *   *Priority:* **Highest.** If we don't fix the variables, better econometrics just gives us precise estimates of the wrong thing.

  2.  **Midstream (The Engine): Mechanisms & Micro-Foundations.**
      *   *Current State:* Reduced-form relationships (IV $\to$ GDP). The "black box" is assumed to be property rights or contract enforcement, but rarely observed.
      *   *The Bottleneck:* Knowing that colonial borders *caused* lower income today doesn't tell a policymaker what to change.
      *   *Priority:* **High.** We need to open the black box. How does a specific institutional change actually alter behavior?

  3.  **Downstream (The Outcome): Dynamics & Transitions.**
      *   *Current State:* Cross-sectional levels (Rich vs. Poor).
      *   *The Bottleneck:* Levels are persistent and noisy. Transitions (Rich $\to$ Poor or Poor $\to$ Rich) are rare but informative.
      *   *Priority:* **Medium.** Useful for theory testing, but requires the upstream work to be valid.

  ---

  ### II. The Portfolio: Four Bets

  I would allocate the $15M across four distinct tracks. This diversifies risk but keeps the intellectual focus tight.

  #### Bet 1: The "Granular History" Initiative ($6M, 4 teams)
  **Goal:** Solve the measurement problem.
  **The Problem:** The field relies on cross-country datasets where "State Capacity" in 1800 is a dummy variable based on whether a country had a parliament. This is nonsense.
  **The Ask:** Fund teams to build **high-frequency, sub-national historical data** for specific regions.
  *   **Example:** Instead of "Did Britain colonize Nigeria?", fund a team to digitize and harmonize colonial tax records, court case logs, and land registries for Southern Nigeria 1850–1950.
  *   **Why:** This allows for within-country variation. It replaces "Colonial Origin" (binary) with "Tax Extraction Rate" (continuous, observed).
  *   **Trade-off:** This is slow, unglamorous work. It produces datasets, not immediate AER papers. But it is the only way to break the proxy dependency.
  *   **Upstream Impact:** If successful, this renders the old IVs (like settler mortality) obsolete because we finally have the direct measure.

  #### Bet 2: The "Mechanism Audit" ($4M, 4 teams)
  **Goal:** Open the black box of the canonical findings.
  **The Problem:** We accept the *existence* of causal effects (e.g., Acemoglu, Johnson, Robinson 2001) but ignore the *channel*.
  **The Ask:** Fund teams to take the top 5 most cited historical IVs in development and rigorously test the **exclusion restriction** using new data.
  *   **Example:** Take "Settler Mortality." The theory is it shaped institutions, which shaped growth. Fund a team to find data on *what specific institutions* changed in response to mortality. Was it property law? Labor coercion? Health infrastructure?
  *   **Why:** If the mechanism doesn't hold up, the causal claim is fragile. This is "replication plus."
  *   **Trade-off:** High risk of null results. But a well-funded null on a canonical IV is more valuable than a positive result on a marginal one.

  #### Bet 3: The "Transition Lab" ($3M, 3 teams)
  **Goal:** Focus on dynamics, not levels (Your "Switching Dynamics" idea).
  **The Problem:** Most development is path-dependent. Studying static differences tells us little about how to *move*.
  **The Ask:** Fund teams to study **Great Reversals** and **Great Escapes** using paired comparisons.
  *   **Example:** Your "Two Koreas" idea is good, but N=1. Expand this. Study Botswana vs. Zimbabwe, but also Chile vs. Argentina (1970s divergence), or China vs. India (1980s divergence).
  *   **Method:** Process tracing + quantitative breakpoints. Don't just run a regression; build a timeline of policy choices and external shocks.
  *   **Why:** This addresses the "endogeneity" worry by focusing on moments where the causal arrow was forced (e.g., a specific regime change).
  *   **Trade-off:** Risks becoming narrative-heavy. Needs strict pre-registration of the "switching" criteria to avoid cherry-picking.

  #### Bet 4: The "Robustness Stress Test" ($2M, 1 team + overhead)
  **Goal:** Your "Many-Analysts" idea.
  **The Problem:** Researcher degrees of freedom.
  **The Ask:** A dedicated meta-science team. Give them the budget to hire 20 different PhD teams to answer the *same* historical question using the *same* archive.
  *   **Why:** This quantifies the "noise" in the field. If 20 teams analyze the same colonial census and 10 find a positive effect and 10 find negative, the field is broken.
  *   **Placement:** Keep this separate. It is the quality control mechanism for the other three bets.
  *   **Trade-off:** It produces no substantive development theory. It produces a paper about *how we do development theory*.

  ---

  ### III. Evaluating Your Half-Formed Ideas

  **1. "Switching Cases" (Koreas, Germanys, Botswana/Zimbabwe)**
  *   **Verdict:** **Fundable, but narrow.**
  *   **Critique:** This is a "Most Similar Systems" design. It controls for culture and geography beautifully. However, it suffers from selection bias (why did *these* places split?) and low N.
  *   **Modification:** Don't make this the whole agenda. Use it as the methodology for **Bet 3 (Transition Lab)**. It is excellent for testing *maintenance* of institutions, less good for testing *origins*.

  **2. "Many-Analysts Exercise"**
  *   **Verdict:** **Essential, but keep it small.**
  *   **Critique:** This is the most honest thing you could fund. It addresses your fear that the field is a treadmill of analyst flexibility.
  *   **Modification:** Do not let this consume the whole budget. It is a diagnostic tool. Fund it as **Bet 4**. If the results show high divergence, you know to pivot the foundation's future strategy toward pre-registration and data transparency.

  **3. "Switching Dynamics / Escape from Bad Equilibria"**
  *   **Verdict:** **The Strongest Substantive Bet.**
  *   **Critique:** This moves the field from "Why are you poor?" (which can be fatalistic) to "How did you get rich?" (which is actionable). It treats development as a verb, not a noun.
  *   **Modification:** This should be the core of **Bet 3**. Require teams to define the "switch" ex-ante.

  ---

  ### IV. The "Do Not Fund" List (Dead Ends)

  To protect the $15M, you must explicitly exclude the following. These are the "treadmill" activities you identified:

  1.  **New Cross-Country IVs:** No more finding a new instrument for 150 countries. The N is too small, and the heterogeneity is too large.
  2.  **Vague Cultural Indices:** No more surveys on "trust" or "individualism" projected back 500 years using linguistic roots. The measurement error swamps the signal.
  3.  **Pure Theory without Data:** Formal models of institutional persistence are a dime a dozen. Fund models only if they are paired with a data plan to test them.
  4.  **"Does X Matter?" Papers:** Any proposal that frames the question as "Do institutions matter?" is rejected. We know they matter. The question is *which ones, when, and how.*

  ---

  ### V. Trade-offs and Risks

  **The Risk of "Granular History" (Bet 1):**
  *   *Risk:* Teams spend 5 years digitizing records and publish nothing.
  *   *Mitigation:* Require intermediate outputs (working papers on data quality, preliminary descriptive stats) by Year 2. Make the data public immediately (open science), so even if the main paper fails, the data benefits the field.

  **The Risk of "Mechanism Audit" (Bet 2):**
  *   *Risk:* You fund a team to debunk a Nobel Prize-winning paper, and the field rejects their paper as "revisionist."
  *   *Mitigation:* Pre-commit to publishing the results regardless of direction. Partner with a journal (e.g., *AER: Insights* or *JDE*) to guarantee a venue for high-quality nulls.

  **The Risk of "Transition Lab" (Bet 3):**
  *   *Risk:* It turns into storytelling.
  *   *Mitigation:* Require a formal counterfactual model. If they argue Policy X caused the Switch, they must model what would have happened without Policy X.

  ### VI. Success Metrics (How to judge this in 5 years)

  Do not judge this by impact factors or citation counts. Those reward the treadmill. Judge by:

  1.  **Data Adoption:** Are other researchers using the datasets built in Bet 1? (Track downloads and citations of the *data*, not the paper).
  2.  **Canon Shift:** Do the textbooks change? Does the "Settler Mortality" story get qualified or replaced by the mechanisms found in Bet 2?
  3.  **Methodological Standard:** Does the field adopt the "Many-Analysts" standard (Bet 4) as a norm for historical claims?
  4.  **Policy Relevance:** Do the "Transition" findings (Bet 3) offer specific, testable policy levers (e.g., "land titling works *only* when X"), rather than vague advice ("build better institutions")?

  ### Summary Recommendation

  If I were you, I would structure the RFP around **"Opening the Black Box of Historical Development."**

  1.  **40% of budget** to **Measurement** (Building better historical variables).
  2.  **30% of budget** to **Mechanisms** (Testing *how* the old IVs actually worked).
  3.  **20% of budget** to **Dynamics** (Studying the switches/transitions).
  4.  **10% of budget** to **Meta-Science** (The Many-Analysts stress test).

  This agenda admits that we don't know as much as we think we do. It sacrifices the glamour of "solving" the development puzzle for the grunt work of ensuring that when we *do* claim a solution, it's built on rock, not sand. It funds the *infrastructure* of knowledge, not just the *decoration*.
