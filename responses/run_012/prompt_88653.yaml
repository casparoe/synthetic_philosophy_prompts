  I'm a science journalist working on a feature about the old evidence problem in Bayesian confirmation theory, and I'm commisioning this essay for it. Here's the angle: the classic puzzle is that evidence you already knew before you came up with a theory—like Mercury's perihelion for general relativity—seems like it can't raise the theory's probability, beacuse you'd already conditionalized on it. But now consider a new twist: an AI lab trains a model on a huge pile of scientific papers, then asks it to "predict" the result of a study that was in its training data. The model spits out the result with high confidence. The lab says, see, the model confirmed the finding. Critics say it's just memorization. I want the essay to take a stand: can old evidence ever genuinely confirm a theory, and does the LLM case make the old evidence problem better or worse? Weigh the main moves people make—logical learning, counterfactual accounts, explanationist views—but don't just summarize. Defend a verdict. Use American English. No citations or reading list; I care about the argument. And make it a bit in the weeds, not a textbook recap.
