answer: |-
  **The Compression Verdict: Why Old Evidence Still Counts**

  The puzzle is famous enough to be a rite of passage for any philosopher of science. In 1915, Albert Einstein finalized the field equations of General Relativity. One of the first things he did was check them against a number he already knew: the anomalous precession of Mercury's perihelion. Newtonian mechanics couldn't account for the discrepancy; General Relativity nailed it. Intuitively, this felt like a massive triumph. The theory was confirmed by the data.

  But if you open the textbook on Bayesian confirmation theory, a cold splash of mathematics awaits. In the Bayesian framework, evidence $E$ confirms hypothesis $H$ only if learning $E$ raises the probability of $H$. Mathematically, we look at the ratio of the posterior to the prior. But if $E$ is already known—if it is "old evidence"—then its probability is already 1. You cannot learn what you already know. If $P(E) = 1$, then conditionalizing on $E$ changes nothing. $P(H|E) = P(H)$. By the strict lights of standard Bayesianism, Mercury's perihelion could not possibly have confirmed General Relativity, because Einstein knew about the perihelion before he finished the theory.

  This is the Old Evidence Problem. For decades, philosophers have patched the hole with counterfactuals, logical learning, and explanationist tweaks. But now, a new stress test has arrived from an unlikely source: the AI lab.

  Consider a modern scenario. A lab trains a large language model (LLM) on a corpus of millions of scientific papers. The model ingests the data, adjusting its weights. Then, the researchers prompt the model to "predict" the outcome of a specific study that was explicitly included in the training set. The model outputs the correct result with high confidence. The lab issues a press release: "AI Confirms Scientific Finding." The critics roll their eyes: "It's just memorization."

  This isn't just a squabble over marketing hype. The LLM case is the Old Evidence Problem stripped of its historical romance and rendered in code. It forces us to ask: Is the problem with *time* (that the evidence was known *before*), or is the problem with *structure* (that the evidence was baked *into*)?

  My verdict is this: The LLM case makes the Old Evidence Problem better, not worse. It dissolves the metaphysical fog surrounding "oldness" and reveals that the real issue is informational independence. Old evidence confirms a theory only when the theory reconstructs that evidence through novel compression, not when it merely stores it. The LLM scenario vindicates an explanationist view of confirmation over a strictly temporal Bayesian one.

  To see why, we have to look at why the standard Bayesian fixes leave us unsatisfied. The most common maneuver is the "logical learning" approach, championed by Daniel Garber. The idea is that while Einstein already knew $E$ (Mercury's orbit), he did not know the logical fact that $H$ (General Relativity) entails $E$. So, he didn't conditionalize on $E$; he conditionalized on the proposition "$H \to E$." This saves the math. It allows the probability of $H$ to rise because the logical connection is new information.

  But this feels like a trick of notation. It shifts the goalpost from the world to the logic book. Furthermore, it doesn't help us much with the LLM. When the model outputs the study result, is it accessing a stored fact, or is it executing a logical entailment? In a neural network, the distinction is blurry. The weights encode the data, but they also encode the patterns *between* the data. If the model simply retrieves a string of text it saw during training, that is storage. If it infers the result based on latent rules about chemistry or physics derived from the training corpus, that is entailment.

  The counterfactual account tries a different angle. It asks: What would the scientist's confidence have been *if* they hadn't known $E$? If Einstein hadn't known about Mercury, would the theory have predicted it? If yes, then $E$ confirms $H$. This approach captures the intuition well, but it relies on a metaphysical ghost: the "ur-prior." We have to simulate a state of ignorance that never existed and may be impossible to define coherently. How do you subtract Mercury from Einstein's knowledge without unraveling the rest of 19th-century astronomy that shaped his thinking?

  The LLM case makes this impossibility concrete. To run the counterfactual on the model, you would have to train a version of the AI that *doesn't* have the specific paper in its dataset. But if you remove that paper, do you also remove the background concepts it relied on? If the model learned the laws of thermodynamics from Paper A, and the specific result from Paper B, removing Paper B might not change the prediction if Paper A was sufficient to derive it. The counterfactual account struggles because "knowing" isn't a binary switch; it's a distributed state.

  This is where the LLM case sharpens the philosophical blade. It forces us to abandon the temporal distinction (old vs. new) and adopt a structural one (storage vs. compression).

  In machine learning, we worry about overfitting. A model overfits when it memorizes the noise in the training data rather than learning the underlying signal. An overfitted model gets 100% accuracy on the training set (the old evidence) but fails on new data. A generalized model, however, compresses the training data into a simpler set of rules that *happen* to reproduce the training data correctly.

  This distinction maps perfectly onto the Old Evidence Problem. When critics say the LLM is just "memorizing," they are accusing it of treating the evidence as a raw input rather than a derived output. In Bayesian terms, a model that memorizes has effectively set $P(E|H) = 1$ by fiat, because $H$ contains $E$ as a lookup entry. There is no risk involved. Confirmation requires risk; it requires that the theory *could have been wrong* about the old evidence.

  General Relativity was risky. There was no guarantee the field equations would yield the specific 43 arc-seconds per century discrepancy. The equations could have yielded zero, or double that amount. The fact that they yielded the exact known number was a constraint on the theory's degrees of freedom.

  The LLM case clarifies this by making the mechanism visible. If the AI lab wants to claim confirmation, they must demonstrate that the model's internal representation of the world *necessitates* the result, not just that the result is present in the weights. If the model has created a compressed representation of chemical laws that generates the study's conclusion as a byproduct, then the old evidence *does* confirm the model's internal "theory." The fact that the data was in the training set is irrelevant. What matters is that the data was *re-derived* rather than *retrieved*.

  This suggests that the Old Evidence Problem was never really about time. It was about the direction of inference. Confirmation flows from theory to evidence. If the flow is reversed—if the evidence was used to construct the theory without a separation of parameters—then no confirmation occurs.

  This aligns with an explanationist view of confirmation, which argues that $H$ is confirmed by $E$ if $H$ provides the best explanation for $E$. In the LLM case, "memorization" is a terrible explanation for the output if the goal is scientific understanding. It explains the output by pointing to the input. "Compression," however, explains the output by pointing to the structure of the model.

  So, does the LLM case make the problem better or worse? It makes it better. It rescues the Old Evidence problem from the realm of abstract epistemology and grounds it in information theory. It shows us that the Bayesian fixation on $P(E)=1$ is a red herring. The probability of the evidence being 1 doesn't kill confirmation; the *triviality* of the connection between $H$ and $E$ kills confirmation.

  If we accept this, we have to revise how we talk about Bayesian updating. We shouldn't be asking whether the agent "knew" $E$ beforehand. We should be asking whether the agent's hypothesis $H$ reduces the complexity of $E$. In the language of Minimum Description Length, a theory confirms old evidence if the length of the theory plus the length of the evidence *given the theory* is shorter than the length of the evidence alone.

  Einstein's theory shortened the description of the solar system. It took a ragged collection of orbital parameters and subsumed them under a geometric principle. The LLM confirms a finding only if its weights encode a rule that generates the finding more efficiently than storing the finding itself.

  This verdict has consequences for how we view science today. We are entering an era of data-intensive discovery where "old evidence" is the default. We train models on the entire history of physics, then ask them to find gaps. If we cling to the strict Bayesian prohibition on old evidence, we paralyze ourselves. We would have to claim that no model trained on historical data can ever confirm a physical law, because all the laws are already in the training set.

  That is absurd. The history of science is the history of re-interpreting old data. Newton didn't discover new data to confirm gravity; he took Kepler's old laws and Galileo's old trajectories and showed they were two sides of the same coin. The data was old. The unification was new.

  The LLM scenario teaches us that the value of evidence lies not in its novelty, but in its surprise relative to the theory's complexity. If a theory is complex enough to simply list all known facts, it predicts everything and explains nothing. If a theory is simple enough that it *shouldn't* have been able to reproduce the old facts but does so anyway, that is confirmation.

  The critics of the AI lab are right to be suspicious of "memorization," but they are wrong to think the age of the data is the culprit. The culprit is the lack of structural constraint. If the lab can show that the model's architecture forces a compression of the scientific literature such that the specific study result emerges as a necessary consequence of that compression, then the old evidence counts.

  We should stop worrying about when the evidence was found. We should start worrying about how hard the theory had to work to match it. The Old Evidence Problem isn't a paradox of time; it's a warning against tautology. And in the age of AI, where we can easily build systems that tautologically reproduce their training data, that warning is more vital than ever. The evidence can be as old as Mercury, but if the theory makes it new again by revealing a hidden necessity, the confirmation is real.
