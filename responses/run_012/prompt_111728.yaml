prompt: |-
  I am assembling materials for a graduate seminar on distributive justice and have been unable to settle an argument that a student reconstructed for me last term. I would be grateful for your diagnosis. I would rather keep the levelling-down objection than accept the conclusion the argument reaches, but I want to know what that preference costs.

  By way of setup: an outcome is a distribution of welfare across persons. Egalitarianism treats inequality between persons as intrinsically bad, so that a more equal outcome is, other things equal, better. Prioritarianism treats a gain in welfare as mattering more the worse off its recipient is; equivalently, the value of an outcome is the sum of welfare levels weighted by factors that decline as the level rises. The levelling-down objection is standardly pressed against egalitarianism: because egalitarianism treats inequality as intrinsically bad, it must count an outcome in which the better off are lowered to the level of the worse off, with nobody gaining, as in one respect an improvement — worse for one person, better for nobody, yet better. Prioritarianism is generally thought to escape this objection, since priority to the worse off supplies no reason to lower anyone when no one is helped.

  The argument runs as follows.

  (1) A view escapes the levelling-down objection only if it may rank the levelled-down outcome as worse than the unequal one.
  (2) The only ground available for that ranking is that the levelled-down outcome is worse for the person lowered and better for no one — call this principle (P).
  (3) (P) is a special case of a broader principle: an outcome is better than another only if it is better for at least one person — call this (B). If it is better for no one, it is not better.
  (4) (B) is unrestricted in scope: it ranges over any two outcomes, including outcomes containing different people.
  (5) Now compare W1, which contains a single person, Anna, at welfare level 20, with W2, which contains Anna at 20 and Bob at 20, Bob's life being well worth living and Anna wholly unaffected. W2 is not better for Anna. Nor is it better for Bob, since Bob does not exist in W1, and one cannot compare how well off a person is across a world in which that person has no existence.
  (6) By (B), then, W2 is not better than W1; by parity, W1 is not better than W2; so, assuming the two are comparable, they are equally good.
  (7) The same reasoning iterates: a world containing one flourishing person is exactly as good as a world containing that person together with any finite number of further flourishing people.
  (8) That is absurd — call it the Sterility Result.
  (9) So (B) is false.
  (10) So the ground identified in (2) is unavailable, and the prioritarian is left merely asserting her weighting function against the egalitarian's, which is the point at issue.
  (11) So prioritarianism does not escape the levelling-down objection; the objection stands against any view that will not rank a levelled-down outcome as worse.

  Please tell me which step to reject, why it looked acceptable, and what each available rejection would cost. I want to know what each rejection leaves standing: whether the prioritarian keeps her escape, and whether the levelling-down objection retains any force against egalitarianism, which is where it is usually deployed.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on distributive justice.
      *   **Problem:** A student reconstructed an argument challenging the standard view that Prioritarianism escapes the Levelling-Down Objection (LDO).
      *   **User's Preference:** Wants to keep the LDO (i.e., maintain that it's a valid objection to Egalitarianism) and maintain that Prioritarianism escapes it.
      *   **Task:** Diagnose the argument, identify which step(s) to reject, explain why they looked acceptable, and analyze the costs/consequences of each rejection (specifically regarding Prioritarianism's escape and the LDO's force against Egalitarianism).

  2.  **Deconstruct the Student's Argument:**
      *   *Premise (1):* Escape LDO $\rightarrow$ Rank Levelled-Down (LD) outcome as *worse* than Unequal (U) outcome. (Standard interpretation: To escape LDO, you must say LD is *not* better in any respect, or simply worse all-things-considered. The argument assumes "worse" is required to block the "in one respect better" claim of egalitarianism.)
      *   *Premise (2):* The only ground for ranking LD as worse than U is Principle (P): LD is worse for someone and better for no one.
      *   *Premise (3):* (P) is a special case of Person-Affecting Principle (B): Outcome X is better than Y only if X is better for at least one person. (The "Wide" or "Narrow" Person-Affecting View).
      *   *Premise (4):* (B) is unrestricted (applies to different populations).
      *   *Premise (5):* Case Study: W1 (Anna @ 20) vs. W2 (Anna @ 20 + Bob @ 20). W2 not better for Anna. W2 not better for Bob (Non-Identity/Incomparability issue).
      *   *Premise (6):* By (B), W2 not better than W1. (Sterility).
      *   *Premise (7):* Iteration leads to Absurdity (One person = Infinite people).
      *   *Conclusion (8-11):* (B) is false $\rightarrow$ Ground (P) is unavailable $\rightarrow$ Prioritarianism cannot claim LD is worse $\rightarrow$ Prioritarianism does not escape LDO.

  3.  **Evaluate the Argument's Validity and Soundness:**
      *   The argument is a *reductio* against the Person-Affecting Principle (B) used to defend Prioritarianism against LDO.
      *   It claims that if you use (B) to block LDO, you commit to the "Sterility Result" (Repugnant Conclusion variant regarding addition of happy people).
      *   Therefore, you can't use (B). If you can't use (B), you can't say LD is worse than U (based on the specific ground P). Therefore, Prioritarianism fails to escape LDO.

  4.  **Identify the Weak Links (Potential Rejection Points):**

      *   **Step (1):** Does escaping LDO require ranking LD as *worse*?
          *   *Standard View:* Escaping LDO means denying that LD is *better in any respect*. It doesn't necessarily mean claiming it is *worse*. It means it is *neutral* or *worse*.
          *   *Cost:* If we reject (1), Prioritarianism can say LD is *equally good* (in terms of justice) but not better. Does this satisfy the intuition behind LDO? Usually, LDO says Egalitarianism implies LD is *better*. Prioritarianism says LD is *not better*. That's usually enough to "escape."
      *   **Step (2):** Is (P) the *only* ground?
          *   *Analysis:* Prioritarianism weights welfare. In LD, the worse off gain nothing, the better off lose. The sum of weighted welfare drops. So Prioritarianism says LD is worse *because total weighted welfare drops*, not strictly because of the person-affecting constraint (P).
          *   *Cost:* This is the strongest move for the Prioritarian. Prioritarianism is an Impersonal Total View (usually), not strictly Person-Affecting.
      *   **Step (3)/(4):** The move from (P) to unrestricted (B).
          *   *Analysis:* (P) applies to fixed populations (LD vs U involves the same people). (B) applies to variable populations (W1 vs W2).
          *   *Cost:* Can we accept (P) for fixed populations but reject (B) for variable populations? This is the "Narrow" vs. "Wide" Person-Affecting distinction.
      *   **Step (5):** The claim that adding Bob is not better for Bob.
          *   *Analysis:* This relies on the "Non-Identity Problem" logic (no existence = no baseline). Some theories (Total Utilitarianism) say existence at positive welfare is a gain.
          *   *Cost:* Accepting this requires a specific axiology of existence.

  5.  **Develop the Diagnosis based on the User's Preferences:**
      *   *User Goal:* Keep LDO against Egalitarianism. Keep Prioritarian escape.
      *   *Implication:* We need to break the link between "Using (P) to escape LDO" and "Committing to Sterility."
      *   *Best Candidate:* **Reject Step (2) or Step (3).**
      *   *Why?* Prioritarianism does *not* rely on the Person-Affecting Principle (B) to judge LD cases. It relies on the *Weighted Sum* calculation.
      *   In the LD case (Fixed Population):
          *   Unequal: High (weighted low) + Low (weighted high).
          *   Levelled: Medium (weighted medium) + Medium (weighted medium).
          *   Actually, standard Prioritarianism says LD is *worse* because the loss to the rich (weighted) outweighs the gain to the poor (weighted) — wait, in LD there is *no gain* to the poor. The poor stay same. The rich lose. So Weighted Sum definitely drops.
          *   So Prioritarianism says LD is worse.
          *   Does it rely on (P)? (P) says "Worse because worse for someone, better for no one." Prioritarianism says "Worse because sum of priority-weighted welfare is lower."
          *   These coincide in fixed populations, but they are *theoretically distinct*.
      *   *The Student's Trap:* The student assumes Prioritarianism escapes LDO *only* by invoking the Person-Affecting Principle (B). This is false. Prioritarianism escapes LDO because it is a *Teleological* view (maximize weighted sum), not a *Deontic/Person-Affecting* view.
      *   *Therefore:* Step (2) is the primary error. Step (3) is the secondary error (conflating fixed-population reasoning with variable-population reasoning).

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the argument. It's a version of the "Non-Identity Problem" applied to the LDO.
      *   **Diagnosis:** The core error is **Step (2)** (and derivatively Step 3). The argument assumes Prioritarianism relies on the Person-Affecting Principle to escape LDO. It does not.
      *   **Alternative Rejection (Step 1):** Discuss the "Better in some respect" vs. "All things considered worse" distinction.
      *   **Alternative Rejection (Step 3/4):** Distinguish Narrow vs. Wide Person-Affecting views.
      *   **Cost Analysis:**
          *   *Rejecting (2):* Best for the user. Saves Prioritarian escape. Saves LDO against Egalitarianism. Cost: Must clarify that Prioritarianism is impersonal, not person-affecting.
          *   *Rejecting (1):* Prioritarian says LD is *not better*, not necessarily *worse*. Cost: Might weaken the force of the escape (Egalitarian says "better in respect", Prioritarian says "not better all things considered").
          *   *Rejecting (3)/(4):* Accept (P) for fixed, reject (B) for variable. Cost: Theoretical complexity (Two-tier axiology).
      *   **Conclusion:** Recommendation to reject (2).

  7.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Wait, does Prioritarianism actually say LD is worse?*
          *   Scenario: Rich (100), Poor (10).
          *   LD: Rich (10), Poor (10).
          *   Prioritarian Value Function $W = \sum f(w_i)$ where $f$ is concave.
          *   Unequal: $f(100) + f(10)$.
          *   Levelled: $f(10) + f(10)$.
          *   Since $f(100) > f(10)$, the Unequal sum is higher.
          *   So Prioritarianism says Unequal is better than Levelled.
          *   So Prioritarianism says Levelled is *worse*.
          *   So Premise (1) is satisfied (it ranks LD as worse).
      *   *The Student's Claim:* The student claims the *ground* for this ranking must be (P).
      *   *My Counter:* The ground is the *Priority Weighting*, not the Person-Affecting constraint. The fact that it *implies* (P) in fixed populations is a byproduct, not the foundation.
      *   *Crucial Distinction:* The student argues that to say LD is worse, you need (B). But Prioritarianism says LD is worse because of the *loss of value*, not because of the *person-affecting constraint*.
      *   *Wait, Step (2) says:* "The only ground available for that ranking is that the levelled-down outcome is worse for the person lowered and better for no one."
      *   *Is this true?* For a Prioritarian, the ground is "The sum of priority-weighted welfare is lower." Is this distinct from "Worse for someone, better for no one"?
      *   Yes. In variable population cases, "Sum of weighted welfare is lower" can apply even if (B) is violated.
      *   So, the student is conflating the *implication* of Prioritarianism in fixed cases with its *justification*.
      *   The student forces a dilemma: Either accept (B) (and get Sterility) or reject (B) (and lose the ground for saying LD is worse).
      *   The Prioritarian response: I don't need (B) to say LD is worse. I need the Priority Weighting Function. (B) is irrelevant to my theory.
      *   So Step (2) is false. There is another ground: Impersonal Value.

  8.  **Finalizing the Advice:**
      *   Focus heavily on rejecting **Step (2)**.
      *   Explain that Prioritarianism is an **Impersonal Total View**, not a Person-Affecting View.
      *   Explain that the LDO works against Egalitarianism because Egalitarianism is often construed as concerned with *relations* (which can be improved by LD), whereas Prioritarianism is concerned with *absolute levels weighted by priority*.
      *   Address the "Sterility" worry: It only arises if you bind yourself to (B). Prioritarians are not bound to (B).
      *   Address the User's preference: This allows keeping LDO (Egalitarianism still vulnerable because it values equality intrinsically, potentially endorsing LD as 'better in a respect') and keeping Prioritarian Escape (Prioritarianism condemns LD as 'worse' based on value loss, not person-affecting grounds).

  9.  **Structure of the Output:**
      *   **Executive Summary:** Identify the fatal flaw (Step 2).
      *   **Detailed Diagnosis:** Walk through the argument.
      *   **Option 1: Reject Step (2) (Recommended).** Explain why. Costs/Benefits.
      *   **Option 2: Reject Step (1).** Explain the "Better in a respect" nuance. Costs/Benefits.
      *   **Option 3: Reject Step (3)/(4).** Narrow vs. Wide Person-Affecting. Costs/Benefits.
      *   **Conclusion:** Reiterate the recommendation.

  10. **Tone:** Academic, precise, respectful of the student's cleverness but firm on the philosophical distinction. (Graduate seminar level).

  11. **Check against User Constraints:**
      *   "I would rather keep the levelling-down objection than accept the conclusion the argument reaches." -> The argument concludes Prioritarianism *doesn't* escape LDO. User wants Prioritarianism *to* escape. So I must find a way to break the argument to save Prioritarianism.
      *   "Tell me what each rejection leaves standing." -> Need clear table or bullet points on LDO force and Prioritarian escape for each option.

  12. **Final Polish:** Ensure the distinction between "Person-Affecting" and "Impersonal" is clear. The student's argument is essentially: "To avoid LDO, you must be Person-Affecting. If you are Person-Affecting, you get Sterility. So you can't avoid LDO." The counter is: "Prioritarianism avoids LDO without being Person-Affecting."

      *Wait, one nuance:* Some philosophers (e.g., Parfit) introduced Prioritarianism *specifically* to avoid the LDO while keeping the concern for the worse-off. Parfit explicitly contrasts it with Egalitarianism. Parfit agrees Prioritarianism is *not* person-affecting. So the student's premise (2) is historically and theoretically incorrect regarding Prioritarianism. I should mention Parfit.

      *Another nuance:* Does Egalitarianism *necessarily* fall to LDO? Telic Egalitarianism does. Deontic might not. The prompt assumes "Egalitarianism treats inequality... as intrinsically bad," which implies Telic. I will stick with that.

      *Let's write.*
answer: |-
  This is a sophisticated reconstruction of a known problem in population ethics, effectively merging the **Levelling-Down Objection (LDO)** with the **Non-Identity Problem**. Your student has constructed a *reductio ad absurdum* against the claim that Prioritarianism escapes the LDO.

  The argument hinges on the claim that the *only* way to declare the levelled-down outcome "worse" (and thus escape the LDO) is to rely on a Person-Affecting Principle (B). If that principle leads to the "Sterility Result" (that adding happy people adds no value), then the principle must be false. If the principle is false, Prioritarianism loses its ground for calling the levelled-down outcome worse, and thus fails to escape the LDO.

  To preserve your preferences (keeping the LDO against Egalitarianism and keeping the Prioritarian escape), you must break the link between "Escaping LDO" and "Accepting the Person-Affecting Principle."

  Here is the diagnosis of the argument, the recommended rejection, and the costs of alternative paths.

  ### The Core Diagnosis: Reject Step (2)

  The most robust philosophical move is to reject **Premise (2)**: *"The only ground available for that ranking is that the levelled-down outcome is worse for the person lowered and better for no one."*

  **Why it looked acceptable:**
  In fixed-population cases (like the standard LDO scenario), the verdicts of Prioritarianism and the Person-Affecting Principle (P) coincide. Both say the levelled-down outcome is worse. It is tempting to infer that they coincide *because* Prioritarianism relies on (P). Your student has assumed that to say an outcome is "worse," one must be able to point to a specific person for whom it is worse.

  **Why it is false:**
  Prioritarianism is an **impersonal total view**, not a person-affecting view. It ranks outcomes based on the sum of priority-weighted welfare.
  *   **Unequal Outcome:** High welfare (low weight) + Low welfare (high weight).
  *   **Levelled-Down Outcome:** Medium welfare (medium weight) + Medium welfare (medium weight).
  *   Because the better-off person loses welfare and no one gains, the *sum of weighted welfare* drops. Prioritarianism ranks the levelled-down outcome as worse **because total value has decreased**, not strictly because a specific person was harmed (though that is also true).

  The student's argument assumes that *value* must be reducible to *person-affecting claims*. Prioritarianism denies this. It posits an impersonal good (priority-weighted welfare) that can decrease even in ways that are not fully captured by (P) in variable population cases.

  **Costs and Consequences of Rejecting (2):**
  *   **Prioritarian Escape:** **Preserved.** Prioritarianism escapes the LDO because it judges the levelled-down outcome as *worse* (all things considered) due to the loss of weighted value. It does not need to rely on the controversial Person-Affecting Principle (B) to do so.
  *   **LDO against Egalitarianism:** **Preserved.** Telic Egalitarianism (which values equality intrinsically) still implies the levelled-down outcome is *better in one respect* (equality). Prioritarianism implies it is *worse in every respect* (weighted value). The LDO retains its force against Egalitarianism because Egalitarianism cannot condemn the levelled-down outcome without contradicting its core commitment to the intrinsic value of equality.
  *   **Theoretical Cost:** You must accept that value is not exhausted by "better for whom." You must commit to an impersonal axiology. Some find this metaphysically spooky (the "separateness of persons" objection), but it is the standard commitment of Prioritarianism (as defined by Parfit).

  ---

  ### Alternative Rejection 1: Reject Step (1)

  **The Move:** Deny that escaping the LDO requires ranking the levelled-down outcome as *worse*. It is sufficient to rank it as *not better*.

  **Why it looked acceptable:**
  The LDO charges Egalitarianism with saying the levelled-down outcome is *better* (in some respect). To "escape" the objection, one might think you simply need to deny it is better. You don't necessarily need to claim it is worse.

  **Costs and Consequences:**
  *   **Prioritarian Escape:** **Weakened.** If Prioritarianism says the levelled-down outcome is *equally good* (axiologically neutral) compared to the unequal one, it loses its intuitive advantage. The intuition behind the LDO is that levelled-down is *bad*. If Prioritarianism is neutral, it looks too permissive. However, standard Prioritarianism *does* say it is worse (due to value loss), so this rejection forces Prioritarianism into a corner it doesn't need to occupy.
  *   **LDO against Egalitarianism:** **Preserved.** Egalitarianism still claims it is *better in a respect*. Prioritarianism claims it is *not better all-things-considered*. The clash remains.
  *   **Theoretical Cost:** This creates a "deontic" shield. It suggests that justice is about constraints rather than value maximization. It complicates the comparison: if Egalitarianism says "Better in respect R" and Prioritarianism says "Not better all-things-considered," the debate shifts to whether "respect R" counts as a genuine value.

  ---

  ### Alternative Rejection 2: Reject Step (3) or (4) (The Narrow Person-Affecting View)

  **The Move:** Accept Principle (P) for fixed populations (LDO cases) but reject Principle (B) for variable populations (Sterility cases). This is the **Narrow Person-Affecting View**.

  **Why it looked acceptable:**
  It aligns with the intuition that we have different obligations to existing people than to potential people. It saves the LDO escape (via P) without incurring the Sterility Result (by limiting B).

  **Costs and Consequences:**
  *   **Prioritarian Escape:** **Preserved.** You can use (P) to condemn the levelled-down outcome.
  *   **LDO against Egalitarianism:** **Preserved.**
  *   **Theoretical Cost:** **High.** This creates a fragmented axiology. You need one theory for fixed populations (Person-Affecting) and another for variable populations (Impersonal). This is often accused of being *ad hoc*. Furthermore, it invites the **Non-Identity Problem**: if you harm a future person by bringing them into existence with a difficult life, the Narrow View struggles to say you made them *worse off* (since they wouldn't exist otherwise). Prioritarianism handles Non-Identity more smoothly by weighing the welfare of the existent person, regardless of identity.

  ---

  ### Alternative Rejection 3: Reject Step (5) (The Total View of Beneficence)

  **The Move:** Deny that adding Bob is not better for Bob. Assert that coming into existence with a life worth living is a benefit *for* that person, even if there is no prior state of non-existence to compare it to.

  **Why it looked acceptable:**
  It solves the Sterility Result immediately. If W2 is better for Bob, (B) is satisfied, and Sterility is avoided.

  **Costs and Consequences:**
  *   **Prioritarian Escape:** **Preserved.**
  *   **LDO against Egalitarianism:** **Preserved.**
  *   **Theoretical Cost:** **Very High.** This requires solving the Non-Identity Problem by claiming existence is a comparative benefit. Many metaphysicians and ethicists reject this as incoherent (the "state of non-existence" cannot be a baseline). It also risks the **Repugnant Conclusion**: if adding people is always a benefit, we might be obligated to maximize population size regardless of quality of life.

  ---

  ### Summary Recommendation for the Seminar

  I recommend you guide the seminar to **Reject Step (2)**.

  This is the most faithful interpretation of Prioritarianism as originally formulated by Derek Parfit. Parfit introduced Prioritarianism specifically to navigate between Egalitarianism (which falls to the LDO) and Utilitarianism (which falls to the Repugnant Conclusion). He explicitly characterized Prioritarianism as **Impersonal**, not Person-Affecting.

  **What this leaves standing:**
  1.  **The Levelling-Down Objection:** Retains full force against **Telic Egalitarianism**. Egalitarianism must admit that a world with less welfare but more equality is *better in one respect*. This is the "absurdity" the LDO highlights.
  2.  **The Prioritarian Escape:** Remains intact. Prioritarianism says the levelled-down world is *worse* (not better in any respect) because the priority-weighted sum of welfare has decreased. It does not rely on the Person-Affecting Principle (B), so it does not inherit the Sterility Result.
  3.  **The Student's Contribution:** The student has successfully identified that *Person-Affecting* views cannot escape the LDO without facing population ethics paradoxes. This is a valuable insight. The correction is simply that Prioritarianism is *not* a Person-Affecting view.

  **Pedagogical Note:**
  You can frame this as a lesson in the distinction between **Person-Affecting Constraints** and **Impersonal Value Functions**. The student's argument proves that you cannot have it both ways: you cannot escape the LDO *on person-affecting grounds* without accepting Sterility. Prioritarianism escapes the LDO on *impersonal grounds*. This clarifies the theoretical landscape significantly for your students.
