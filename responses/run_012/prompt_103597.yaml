  The consent form was thicker than I expected. Most medical papers are single sheets, flimsy things you sign while waiting for the flu shot. This was a booklet, stapled at the corner, with sections highlighted in yellow. Mark sat beside me, bouncing his knee, scanning the pages like he was reading a menu.

  Dr. Aris sat on the other side of the desk. She didn't look like a surgeon. She looked tired, like someone who spent too much time watching monitors. She tapped the page where Mark's finger was hovering.

  "The procedure doesn't block the signal," she said. Her voice was flat, practiced. "Your nerves will still fire. Your spinal cord will still react. If you touch something hot, your hand will move. If you twist an ankle, you'll limp. The data gets to the brain exactly like it always has."

  "So I'll feel it," Mark said.

  "You'll register it," Aris corrected. "You'll be able to tell us where it is, what kind it is, and how intense it is on a scale of one to ten. But the shading process alters the downstream processing. The urgency is removed. The negative valence is... decoupled."

  Mark looked at me. He'd been in chronic pain for five years. Lower back, sciatic nerve, the kind of thing that eats your personality slowly. He looked hopeful. I felt a cold knot in my stomach.

  "And if I burn myself?" I asked.

  "You'll smell the smoke," Aris said. "You'll see the blister. You'll know you need to treat it. You just won't feel the need to scream."

  Mark signed. He didn't hesitate. He handed the pen back like he was returning a borrowed tool. I signed where the witness line was, my handwriting shaky. I wanted to ask what happens to the person who doesn't scream when they burn. I wanted to ask if the thing that makes us care about our own bodies was something that could be turned off without turning off us. But the room was quiet, and the form was already in the doctor's pile.

  ***

  The follow-up was three weeks later. The waiting room was the same, but Mark sat differently. He wasn't shifting weight to favor his left side. He wasn't grimacing when he stood up. He looked lighter, but not in a happy way. He looked like a building where the lights were on but nobody was home.

  Dr. Aris brought him into the exam room. I followed. She had a device on the table, a small metal probe connected to a box with a digital readout.

  "Standard sensitivity test," she said. She pressed the probe against the back of Mark's hand. She turned a dial. The number on the box climbed.

  "Tell me when it becomes uncomfortable," she said.

  Mark watched the number. "It's uncomfortable now."

  "Rate it."

  "Six," he said.

  She increased the heat. The skin around the probe turned pink.

  "Rate it."

  "Eight. Sharp. Burning."

  "Pull your hand away."

  Mark left his hand on the probe. The skin was getting red, the kind of red that warns you something is breaking. I reached out to grab his arm, to pull it back for him, but Aris put a hand on my shoulder.

  "Let him," she said.

  "Mark," I said. "It's burning you."

  He looked at me, then down at his hand. He looked curious, like he was watching a science experiment happen to someone else. He lifted his hand only when Aris tapped the table. He inspected the blister forming on his skin. He touched it with his other hand.

  "Still an eight," he said. "Maybe a eight-and-a-half. The texture is rougher."

  "Does it hurt?" I asked. The question felt stupid the second it left my mouth. He'd just said it was an eight.

  Mark tilted his head. He was trying to find the word. "It's present. It's loud. But it's not... it's not bad. It's just data."

  "It's damage," I said.

  "It's information about damage," he corrected. He sounded like he was reading from the brochure, but his eyes were focused on me, trying to make me understand. "The signal is there. The warning light is on. But the alarm isn't ringing."

  "Doesn't the alarm tell you to move?"

  "It tells me I should move," he said. "It doesn't make me need to."

  He looked at his hand again. He seemed fascinated by the redness, by the way the skin bubbled. There was no flinch, no tightening of the jaw, no shallow breathing. Just observation. I looked at Dr. Aris. She was writing notes, her face unreadable. She wasn't checking his pain levels; she was checking his compliance. He was passing the test by failing to protect himself.

  ***

  That night, we made dinner. It was something we always did, a routine to anchor the day. I chopped vegetables; Mark managed the stove. He used to hate the stove. The heat, the open flame, the risk of splatter. He used to wear long sleeves even in summer to keep the oil off his arms.

  Tonight he wore a t-shirt. He stood over the pan, stirring the oil. I was at the counter, washing lettuce. I heard the oil pop, a loud crackle. A drop flew out, landed on the bare skin of his forearm.

  In the past, he would have jumped. He would have cursed, shaken his arm, run it under the tap. It was a reflex, built into the wiring.

  Mark didn't move. He kept stirring. The drop sat on his arm, a small white blister forming instantly. He glanced at it, then went back to the pan.

  "Mark," I said. I dropped the lettuce into the bowl. Water splashed onto the counter. "You're burned."

  "I know," he said. He didn't turn around. "It's hot."

  "Get away from the stove."

  "I'm cooking."

  "You're burning yourself."

  "It's an eight," he said. "It's fine."

  "It's not fine. It's your body."

  He turned then. He looked at me with a expression I couldn't place. It wasn't defiance. It wasn't indifference. It was confusion. He looked like I was speaking a language he used to know but had forgotten the grammar of.

  "It's just a signal, Sarah," he said. "You're reacting to the signal. I'm reacting to the pan."

  "I'm reacting to you getting hurt."

  "I'm not getting hurt," he said. "I'm getting damaged. There's a difference."

  He turned back to the stove. He adjusted the flame. He seemed perfectly calm, perfectly awake. He wasn't dissociated. He wasn't in a trance. He was fully present, fully reporting, fully functional. He knew the oil was hot. He knew his skin was blistering. He knew the concept of pain. He just didn't seem to recognize the authority of it.

  I walked over to him. I turned off the burner. The silence in the kitchen was heavy. The smell of burnt oil hung in the air.

  "Does it feel like anything?" I asked. "When you look at the burn. Does it feel like *you*?"

  Mark looked down at his arm. He rubbed the edge of the blister with his thumb. He pressed hard enough that I winced. He didn't.

  "It feels like something is missing," he said quietly.

  "What is?"

  "The weight," he said. He tapped his chest, over his sternum. "Usually, when the hand says 'hot,' the chest says 'no.' Now the hand says 'hot,' and the chest says... nothing. It's quiet."

  "That sounds like numbness."

  "It's not numb," he said, frustrated. He gestured with the spoon, dripping oil onto the floor. "I can feel the heat. I can tell you exactly where it is. I can tell you it's damaging tissue. I'm not blind. I'm not dead. It's just... the story changed."

  "What story?"

  "The one where this means something bad is happening to me." He looked at me, and for a second, I saw a flicker of something behind his eyes. Not pain, but a kind of loss. "I know it's supposed to matter. I know you think it matters. I can see you waiting for me to flinch. But I'm not hiding anything. There's nothing there to hide."

  He wiped the spoon on a towel. He looked at the burn again. The blister was white and distinct against his skin. It looked painful. It looked like the kind of thing that ruins a night.

  "I should put cream on it," he said.

  "Yes."

  "Because infection is bad."

  "Yes."

  "Not because it hurts."

  "No."

  He walked to the cupboard to get the first aid kit. He moved normally. He didn't favor the arm. He didn't guard it. He treated the limb like a piece of equipment that needed maintenance, like fixing a leak in the roof.

  I stood by the stove. The burner was off, but the pan was still radiating heat. I held my hand near it, feeling the warmth. I pulled back when it got too hot. The reflex was instant, automatic. A little spark of *no* fired in my head.

  I looked at Mark. He was applying cream to the blister, his movements precise, careful, but devoid of tension. He caught me watching him in the reflection of the microwave door.

  "Are you okay?" I asked.

  He paused, the tube of cream in his hand. He looked at his reflection, then at me.

  "I'm functional," he said.

  "That's not what I asked."

  "I know." He capped the cream. "I can tell you I'm okay. I can tell you the pain is gone. But I can't tell you what I am instead. I know what I was. I was a guy with a bad back who couldn't sleep. Now I'm a guy who can sleep."

  "And?"

  "And I'm standing in a kitchen with a burn on my arm wondering why you're crying."

  I wasn't crying. I touched my face. It was wet. I hadn't noticed.

  Mark walked over to me. He put his hand on my shoulder. His hand was warm. He didn't squeeze. He just let it rest there, a weightless contact.

  "It's fine," he said. "I'm fine."

  He said it like it was a fact he'd measured, like the temperature of the oil. He believed it. He wasn't lying. He was reporting the state of the system accurately. But as he stood there, fully awake, fully responsive, telling me he was fine while his skin blistered, I couldn't tell if the treatment had cured the pain, or if it had just removed the thing that made the pain matter to him. And I couldn't tell if the thing that was gone was the suffering, or the part of him that knew he was worth saving.

  He waited for me to say something. I looked at his hand on my shoulder. I looked at the burn. I looked at his eyes, clear and dry and waiting.

  "Okay," I said.

  He nodded. He turned back to the counter to finish the dinner. I stayed by the stove, feeling the heat radiating from the metal, waiting for the urge to pull away to feel like enough.
