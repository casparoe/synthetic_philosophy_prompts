answer: |-
  ### Exam Question: Foundations of Quantum Mechanics (Final Seminar)
  **Time Allowed:** 50 Minutes  
  **Total Marks:** 20  
  **Instructions:** Closed book. Calculators permitted. Show all working.

  **Question 1 (20 Marks)**
  Consider a Local Hidden Variable (LHV) model for a bipartite system defined as follows. A source emits pairs characterized by a hidden variable $\lambda$, distributed uniformly in the interval $[0, 2\pi)$ with density $\rho(\lambda) = 1/2\pi$. Alice and Bob choose measurement settings defined by angles $a$ and $b$. Their outcomes $A, B \in \{+1, -1\}$ are determined by:
  $$A(a, \lambda) = \text{sgn}[\cos(\lambda - a)]$$
  $$B(b, \lambda) = -\text{sgn}[\cos(\lambda - b)]$$
  where $\text{sgn}(x)$ is $+1$ for $x \geq 0$ and $-1$ for $x < 0$.

  (a) Calculate the correlation function $E(a, b) = \int A(a, \lambda)B(b, \lambda)\rho(\lambda)d\lambda$ for relative angles $\theta = |a - b|$ of $0^\circ$, $90^\circ$, and $180^\circ$. Compare these specific values to the Quantum Mechanical (QM) prediction for a singlet state, $E_{QM}(\theta) = -\cos(\theta)$. **[5 Marks]**

  (b) Using the standard CHSH settings ($a=0^\circ, a'=90^\circ, b=45^\circ, b'=135^\circ$), compute the value of the CHSH parameter $S = |E(a,b) - E(a,b') + E(a',b) + E(a',b')|$ predicted by this LHV model. **[10 Marks]**

  (c) A student claims this model "solves" entanglement because it is local and reproduces QM at $0^\circ$ and $90^\circ$. Based on your results in (a) and (b), refute this claim. Specifically, identify the mathematical feature of this model that prevents it from matching experimental data, and state whether the failure is due to a violation of locality or a mismatch in correlation structure. **[5 Marks]**

  ***

  ### Model Answer

  **Part (a)**
  The correlation $E(\theta)$ is the average product of outcomes. Since $\lambda$ is uniform, $E(\theta)$ is determined by the fraction of the circle where $A$ and $B$ have the same sign versus opposite signs.
  $A$ is $+1$ when $\lambda \in [a-\pi/2, a+\pi/2]$ (mod $2\pi$). $B$ is $+1$ when $\cos(\lambda-b) < 0$, which is the complement of $A$'s positive region shifted to $b$.
  Specifically, $A \cdot B = -1$ when $\text{sgn}[\cos(\lambda-a)] = \text{sgn}[\cos(\lambda-b)]$, and $+1$ when they differ.
  For $\theta = 0^\circ$, settings are identical. $A = -B$ everywhere. $E(0) = -1$. (Matches QM: $-\cos(0) = -1$).
  For $\theta = 90^\circ$, the regions of agreement and disagreement are equal in measure ($\pi$ each). $E(90) = 0$. (Matches QM: $-\cos(90) = 0$).
  For $\theta = 180^\circ$, settings are opposite. $A = B$ everywhere. $E(180) = +1$. (Matches QM: $-\cos(180) = 1$).
  At these orthogonal and parallel limits, the LHV model is indistinguishable from QM.

  **Part (b)**
  To find $S$, we need $E(45^\circ)$ and $E(135^\circ)$. The correlation function for this specific "sign-cosine" model varies linearly with angle $\theta$ between $0$ and $\pi$:
  $$E_{LHV}(\theta) = -1 + \frac{2\theta}{\pi}$$
  At $\theta = 45^\circ (\pi/4)$: $E = -1 + 2(1/4) = -0.5$.
  At $\theta = 135^\circ (3\pi/4)$: $E = -1 + 2(3/4) = +0.5$.
  The CHSH settings yield relative angles:
  $|a-b| = 45^\circ \rightarrow E = -0.5$
  $|a-b'| = 135^\circ \rightarrow E = +0.5$
  $|a'-b| = 45^\circ \rightarrow E = -0.5$
  $|a'-b'| = 45^\circ \rightarrow E = -0.5$
  Substituting into $S$:
  $$S = |(-0.5) - (0.5) + (-0.5) + (-0.5)| = |-2.0| = 2$$
  The model yields exactly $S=2$.

  **Part (c)**
  The student's claim fails because matching QM at $0^\circ, 90^\circ, 180^\circ$ is insufficient. The critical divergence occurs at intermediate angles (e.g., $45^\circ$). QM predicts $E_{QM}(45^\circ) = -1/\sqrt{2} \approx -0.707$, while this LHV predicts $-0.5$.
  Consequently, while QM violates the Bell-CHSH inequality ($S_{QM} = 2\sqrt{2} \approx 2.82$), this model saturates the classical bound ($S=2$). The failure is not a violation of locality—the model is explicitly local by construction—but a mismatch in the *functional form* of the correlation. Local hidden variables of this type produce linear correlations (triangular waves), whereas nature exhibits cosine correlations. Bell's theorem demonstrates that no local model can reproduce the cosine curve; this toy model illustrates precisely where the linear approximation breaks down.

  ***

  ### Marking Scheme

  **Total:** 20 Marks.  
  **Grading Philosophy:** Marks are awarded for explicit calculation and structural diagnosis. "Nonlocality" used as a catch-all explanation without reference to the correlation function shape will be penalized.

  | Must-Hit Point | Marks | A-Grade Move (Distinction) | B-Grade Move (Competent) | Common Misconception / Penalty |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Correlation at Limits** | 4 | Explicitly notes *why* limits match (perfect anti-correlation vs. independence) and verifies against $-\cos\theta$. | Calculates values correctly (-1, 0, 1) and states they match QM. | **Error:** Assuming matching limits implies the model is valid globally. (-2 marks) |
  | **2. Derivation of E(45°)** | 4 | Derives the linear relation $E(\theta) = -1 + 2\theta/\pi$ via geometric overlap of $\lambda$ regions. | States the value -0.5 correctly, even if derived via symmetry argument rather than full integral. | **Error:** Using $-\cos(45)$ for the LHV model. (0 marks for this section) |
  | **3. CHSH Calculation** | 4 | Correctly identifies relative angles for all four terms and sums to exactly $S=2$. | Calculates $S=2$ but may confuse signs in the CHSH formula (e.g., $E(a,b')$ sign). | **Error:** Claiming $S > 2$ for this model. (0 marks for this section) |
  | **4. QM Comparison** | 4 | Explicitly contrasts $S=2$ with $S=2\sqrt{2}$, identifying the numerical gap as the failure point. | States QM violates the inequality while this model does not. | **Error:** Vague statement that "QM is stronger" without numerical comparison. (-2 marks) |
  | **5. Structural Diagnosis** | 4 | Identifies the core issue as **Linear vs. Cosine** correlation shape; explicitly clears the model of non-locality. | Identifies the model fails to match experiment; mentions locality is preserved. | **Error:** Claiming the model fails because it is "secretly non-local" or "contextual." (-4 marks) |

  **Note on Grading:**
  *   **A Answer (18-20):** Hits all 5 points with the "A-Grade Move." The discussion in (c) clearly separates the *assumption of locality* from the *assumption of linearity*.
  *   **B Answer (14-17):** Hits the numerical targets but relies on stated formulas rather than derivation in Part (b), or offers a generic "Bell inequality violation" explanation in Part (c) without specifying the functional form mismatch.
  *   **Fail (<12):** Incorrect CHSH calculation or claims the model violates Bell's inequality.
