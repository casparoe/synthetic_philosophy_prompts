          *   *Observation:* B is better in every subgroup (78>75, 45>40, 12>10). A is better overall (50>45).
          *   *Distribution:* A has more mild patients (150/400 = 37.5% vs 39/140 = 28%? Wait, let's check the text).
          *   *Text Check:* "A was given mostly to mild patients — half of A's patients were mild [200 total, 150 mild = 75% mild], against roughly a third of B's [140 total, 39 mild = 28% mild]."
          *   *Correction:* The text says "half of A's patients were mild". 150/200 is 75%. Wait, the text says "Regimen A: mild, 150 of 200 recovered". This implies N=200 for mild? No, "150 of 200 recovered" usually means 200 patients, 150 recovered.
          *   *Re-reading Table 1 Data:*
              *   Regimen A: Mild (150 rec / 200 tot), Mod (40 rec / 100 tot), Sev (10 rec / 100 tot). Total A = 400 patients. Recovered = 200. Rate = 50%.
