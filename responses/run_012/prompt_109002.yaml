      *(Self-Correction during drafting)*: Make sure to explicitly answer "Is my round-two inference... sound as stated?" The inference is "pooled figure is an artifact." The *reasoning* ("If B wins in every band, then B wins") is the weak link. I need to separate the conclusion from the justification.

