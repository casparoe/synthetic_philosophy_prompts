answer: |-
  To teach source criticism effectively, you must structure the session as a conceptual inversion where the question precedes the source, rather than a procedural guide to verifying facts.

  **1. Sequence of Ideas and Dependency Relations**
  *   **Step 1: The Naive Intuition.** Establish the audience's default model: that sources are containers of truth and the historian's job is to extract that truth. *Dependency:* This is the baseline misconception that the rest of the session must dismantle.
  *   **Step 2: The Contradiction.** Present the Carpathian case chronologically to show that the same physical trace generates contradictory "truths" over time. *Dependency:* This step depends on Step 1 to create cognitive dissonance; if they did not believe sources contained truth, the contradictions would not matter.
  *   **Step 3: The Intervention.** Introduce the concept that a trace is inert until a question is asked of it. *Dependency:* This step depends on Step 2; the contradiction is only resolved by realizing the questions asked in 1910, 1935, and 2001 were different.
  *   **Step 4: The Principle.** Define reliability as a relationship between a claim, a question, and a source, not a property of the source itself. *Dependency:* This step depends on Step 3; you cannot define relational reliability until you have established that the question activates the source.
  *   **Step 5: The Application.** Re-evaluate the case using the new principle (e.g., asking what the 2001 website reveals about 2001 rather than 1908). *Dependency:* This step depends on Step 4; it tests whether they can apply the relational definition of reliability rather than reverting to Step 1.

  **2. The Case Evaluation**
  The Carpathian case is sufficient and should not be replaced, provided it lacks a definitive solution. It succeeds because it offers multiple media (oral, material, print, digital) and multiple authorities (farmer, priest, scientist, web admin), preventing the audience from relying on a single type of evidence. It must lack a "solution key"; you must never reveal what was actually in the jar. If you resolve the mystery, the session becomes a detective story about finding the truth rather than a lesson on constructing evidence. Ensure the chemist's report is presented as a text claiming scientific authority, not as objective fact, to prevent the audience from treating science as the "final answer."

  **3. Predictable Misconceptions and Interception Points**
  *   **Misconception:** "Older sources are inherently more reliable."
      *   **Interception Point:** Step 2. When comparing the 1910 newspaper to the 1972 chemist report, ask why the later source might be more useful for certain questions, disrupting the timeline=truth heuristic.
  *   **Misconception:** "Scientific data is objective and ends the debate."
      *   **Interception Point:** Step 4. When defining relational reliability, explicitly state that the chemist's data is only reliable for questions about metal composition, not questions about human intent or location.
  *   **Misconception:** "Bias makes a source useless."
      *   **Interception Point:** Step 5. When discussing the 2001 website, force them to find a question for which the website's bias makes it *better* evidence (e.g., "What did local communities believe about their history in 2001?").

  **4. Final Assessment Question**
  "Select the 2001 website claim. Formulate one historical question for which this claim is reliable evidence, and one historical question for which this same claim is misleading evidence."
  *   *Reasoning:* This requires them to manipulate the variable of the question while holding the source constant, proving they understand reliability is relational rather than intrinsic.

  **5. Explicit Exclusions**
  Explicitly state at the beginning that you will not teach them how to find sources, how to date artifacts, or the actual history of the Carpathian valley. Say so because adults often expect practical "how-to" skills or factual takeaways; warning them prevents them from evaluating the session based on what you deliberately omitted. Do not introduce historiography (Herodotus, etc.) because it shifts focus to the history of the discipline rather than the logic of evidence. Do not resolve the mystery of the jar because doing so validates the Step 1 intuition that the goal is to find the single truth.
