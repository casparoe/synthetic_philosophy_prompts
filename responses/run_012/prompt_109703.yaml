answer: |-
  Here are 10 questions with anticipated answers and targeted follow-ups, designed to press the specific philosophical and historiographical tensions in her work.

  ### 1. The Causal Selection Principle
  **Question:** You distinguish between a condition, a cause, and an actor. But in a materialist history, everything downstream has a near-infinite chain of upstream causes. If the 1816 crop failure is the effect, why is the Tambora eruption an *actor* while the shipping schedule or the price of wheat is merely a *cause*? Everything is necessary for the outcome. I need you to name the specific principle you use to select the volcano over the market. What is the rule?

  *   **Likely Answer:** She will likely argue that the volcano introduces *contingency* or *disruption* that the market (a human system) does not, or that the volcano is "non-human" and thus historically silenced.
  *   **Follow-up:** If the principle is "contingency" or "disruption," doesn't that make actor-status dependent on human expectation rather than the object itself? A shipping schedule can be just as disruptive if a strike happens. So isn't your principle actually about *surprise*, which is a psychological state, not an ontological one?

  ### 2. Explanatory Gain
  **Question:** Let's grant you the selection principle. What does the label "actor" actually *explain* that "cause" does not? If I say "the volcano caused the migration" versus "the volcano acted to produce the migration," have I gained any historical leverage? Or is this purely a rhetorical shift to force historians to pay attention?

  *   **Likely Answer:** She will likely say "cause" implies a linear mechanism (A hits B, B moves), whereas "actor" implies a node in a network that transforms the flow of events in unpredictable ways.
  *   **Follow-up:** But if you strip the volcano of intentionality—as you explicitly do to break with Actor-Network Theory—how can it "transform" a flow rather than just "deflect" it? Without intention or semiosis, aren't you just describing a complex causal mechanism with a moralized vocabulary?

  ### 3. Environmental Determinism & Agency
  **Question:** Critics will hear "volcanic actor" and hear "environmental determinism." If the Tambora eruption ends up in the causal story of westward migration or bread riots, where did human agency go? Did the farmers choose to move, or did the ash make them move?

  *   **Likely Answer:** She will almost certainly reply that nature proposes but humans dispose. The volcano creates the constraint, but the *response* is culturally and politically mediated.
  *   **Follow-up:** This leads to my next point. If the response is culturally mediated, isn't the *culture* doing the explanatory work? If the volcano only "acts" through a specific social structure of land tenure, isn't the land tenure the actor and the volcano just the trigger?

  ### 4. The "Social Mediation" Trap
  **Question:** You just said the volcano only does work through a social structure. If vulnerability is social, as you argue, then a famine is a failure of distribution, not just production. If the social structure is the variable that determines whether an eruption becomes a catastrophe, what explanatory weight is left for the volcano? Why isn't it just a condition that the social structure activates?

  *   **Likely Answer:** She will argue that without the volcano, the social structure would have remained stable. The volcano *forced* the structure to reveal its fragility.
  *   **Follow-up:** But a stress test reveals fragility; it doesn't build the machine. If I kick a rotten door and it breaks, did the door act, or did it just fail? At what point does "acting" become a euphemism for "being fragile in a way humans notice"?

  ### 5. Methodological Demotion
  **Question:** I want to talk about method. What would count as evidence *against* your thesis? Can you describe a specific historical case where you started thinking a pathogen or climate event was an actor, but upon researching the archives, you demoted it back to a mere condition or cause?

  *   **Likely Answer:** She might suggest that if an environmental factor is fully predictable and integrated into human planning (like seasonal rains), it recedes to a condition.
  *   **Follow-up:** So the status of the object changes based on human knowledge? If we learn to predict earthquakes perfectly, do they cease to be actors and become conditions? That suggests "actancy" isn't a property of the volcano, but a property of our ignorance.

  ### 6. Political Stakes and Responsibility
  **Question:** There is a rhetorical risk here. "The volcano did it" sounds like it launders responsibility. If a harvest fails and a landlord evicts tenants, does framing the harvest failure as "non-human agency" excuse the landlord's choice to evict rather than relieve rent?

  *   **Likely Answer:** She will distinguish between *causation* and *blame*. She will say acknowledging the volcano's role doesn't absolve the landlord of their moral response to the crisis.
  *   **Follow-up:** If causation isn't blame, and you've already admitted the volcano has no intentions, why insist on the word "actor"? "Actor" is a legally and morally loaded term in human discourse. If you strip it of blame and intent, aren't you hollowing out the word just to shock the discipline?

  ### 7. Asymmetrical Actancy
  **Question:** You borrow "actant" from Actor-Network Theory but refuse the symmetry of intentionality. You say nature acts but doesn't *mean*. But isn't the point of ANT that meaning emerges from the association, not the individual? By keeping the label but killing the symmetry, aren't you creating a category error?

  *   **Likely Answer:** She will argue she wants the *ontological* flatness of ANT (humans and non-humans on the same stage) without the *semiotic* baggage (that rocks have voices).
  *   **Follow-up:** But if the non-human cannot speak or signify, how do we access its "action" except through human records? If we only know the volcano acted because humans wrote about the ash, haven't we just smuggled human intentionality back in as the translator?

  ### 8. The Threshold Problem
  **Question:** Is there a cutoff for actancy? Does a frost that kills a single vineyard count, or only a civilization-ending eruption? If it's only the big events, isn't that just "Great Man" theory but with geology?

  *   **Likely Answer:** She will likely argue it's about the *network effect*, not the magnitude. A small pathogen can be an actor if it reroutes history.
  *   **Follow-up:** Who gets to decide when the network is rerouted? If the historian decides based on the narrative impact, then "actancy" is a retrospective narrative device, not a real-time historical force. It makes the historian the god who grants agency, not the volcano.

  ### 9. The Anthropocentrism Defense (The Hard Question)
  **Question:** You often dismiss critics by suggesting they are clinging to anthropocentrism—that they want humans to be special. But isn't it possible that refusing to call a volcano an "actor" isn't about human specialness, but about precision? If I say a hurricane "acted," I might be obscuring the physics. Is your "anti-anthropocentrism" just a mirror image of the bias you claim to fight?

  *   **Likely Answer:** She will argue that anthropocentrism blinds us to the real constraints of the material world, leading to political failure (e.g., ignoring climate change).
  *   **Follow-up:** But climate science doesn't need "agency" to be urgent. Physics is compelling enough. By anthropomorphizing the climate into an "actor," aren't you risking a different kind of blindness—where we start negotiating with nature as if it were a political opponent, rather than a physical system we must adapt to?

  ### 10. Historiographical Cost
  **Question:** Finally, every framework highlights some things and hides others. If we adopt asymmetrical actancy, what historical nuance do we lose? When does treating a virus as an "actor" stop us from asking who funded the lab, or who cut the public health budget?

  *   **Likely Answer:** She will say we don't stop asking those questions; we just add the virus to the list of suspects.
  *   **Follow-up:** But attention is a zero-sum game in a narrative. If the virus is a co-author of the history, does that dilute the accountability of the administrators? I'm asking you to admit the trade-off: does giving the virus a seat at the table make it harder to hold the humans at the table accountable?
