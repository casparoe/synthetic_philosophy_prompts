prompt: |-
  I'm a second-year PhD student in philosophy of language — semantics and pragmatics, formal-ish, not a sociolinguist, and my advisor is a semanticist with no patience for anything that smells like discourse analysis. I have about three years and I need to lock in a dissertation area by the end of term. The cluster I keep circling is default assumptions and sexist language: the old generic-masculine fight, singular 'they', the way a sentence can be literally neutral on its face and still nudge you toward a default reading, and the depressing fact that a neutral term sometimes drifts back toward masculine over a generation or two. Hofstadter's Person Paper is what first hooked me — the satire where you take some prim style-guide passage about language and swap race for gender, and it instantly reads as monstrous — but every time I try to turn the fascination into a research program, I can't tell which parts are genuine open questions and which are just the same argument everyone's been reheating since the seventies, where nobody moves and everyone feels obviously right.

  So here's what I actually want from you. Take the role of a philosopher of language who works on generics, presupposition and implicature, and who has watched this literature stall for decades — think carefully before you answer, and start by just brainstorming the candidate open questions out loud before you commit to anything. Then give me a defended agenda: which open questions in this area are the real ones, ranked, and which two or three would you actually bet my three years on? I want the reasoning, not the list — for each, why it's upstream of the others, whether it's tractable for someone with my tools rather than for a psycholinguist, and how neglected it is. Some candidate questions I keep juggling, feel free to kill them or add ones I'm missing: whether the harm of sexist language lives in what a sentence says or in what it invites you to assume (the semantics/pragmatics split, and whether that split even survives contact with real generics); whether sentences like 'a nurse ... she' are best analyzed as quantificational, as kind-referring, or as something else entirely, and whether that analysis actually tells you which fix to reach for; whether neutralization or reclamation is the more stable strategy, and whether default assumptions can be revised by explicit style rules at all or only by usage drifting; and whether the satirical analogy move (race : gender) is really an argument you can check or a rhetorical device that quietly assumes its own conclusion. I'm also interested in the side question of whether there's even a fact of the matter about what the default is — is it population-relative, context-relative, or is that the wrong frame — but I suspect that one might be a rabbit hole, so tell me if it is.

  One more thing, because it keeps coming up when I talk to people outside the department: half the alleged practical payoffs of this work — style guides, school curricula, maybe even some legal drafting arguments — get asserted as if they follow straight from the philosophical results. Tell me which of those implications actually carry weight and which are overrated or don't follow at all, and say what would move the whole ranking up or down over the next couple of years. Don't give me a reading list or a bibliography, I can find the papers myself — I want the agenda and the criteria you used to order it. Finish with a single machine-readable line of the form \answer{...} containing just the one question you'd pick if I could only do one, phrased in a few words.
