answer: |-
  Let's be blunt: you are standing in a minefield where the explosives are political, but your advisor only hands you a metal detector calibrated for logical form. If you step on a sociolinguistic claim, your committee will smell "discourse analysis" and panic. If you stay too abstract, you lose the phenomenon that hooked you. The stall you're sensing is real. The literature from the 70s and 80s was largely diagnostic and normative ("this is bad, stop it"), but it lacked the formal machinery to explain *how* the badness propagates through the grammar. That is your opening. You have tools they didn't: dynamic semantics, probabilistic pragmatics, and signaling game theory.

  Here is the brainstorming phase, thinking out loud about the candidates you raised and a few others.

  **Brainstorming the Candidate Questions**

  1.  **The Semantics/Pragmatics Locus:** You asked if the harm is in what is said or invited. In formal terms: is the masculine bias of "the doctor... he" an at-issue entailment, a presupposition, or a conversational implicature? If it's an implicature, it should be cancellable ("The doctor... he, or maybe she"). It often isn't. If it's a presupposition, it should project out of negation ("It's not the doctor... he" still feels gendered). This is tractable. It uses standard diagnostic tests.
  2.  **The Mechanism of Drift:** Why does "neutral" drift masculine? "Chairman" replaced "chair." "They" is fighting "he." Is this a frequency effect? A markedness effect? This looks like a Lewisian signaling game equilibrium problem. If the cost of using a marked form (singular 'they') is higher than the cost of miscoordination (using 'he' for a woman), the system stabilizes on the biased equilibrium. This is formalizable without doing ethnography.
  3.  **The Hofstadter Analogy (Race : Gender):** Is this an argument? Structurally, race and gender mark differently in English. We don't have a generic "white" pronoun in the same way we had a generic "he." The analogy works rhetorically to shock intuition, but formally, it might be a category error. Investigating *why* it feels apt despite structural differences could reveal something about how we map social hierarchy onto grammatical markedness.
  4.  **The "Fact of the Matter" on Defaults:** You suspect this is a rabbit hole. You're half-right. If you ask "what is the default" empirically, it's corpus linguistics (not your job). If you ask "what constitutes a default" metaphysically, it's endless. But if you ask "under what conditions does a term function as a default in a coordination game," that's philosophy of language. Frame it as a normative status within a convention, not a population statistic.
  5.  **Stipulation vs. Usage:** Can style guides work? This is the question of whether semantic change can be top-down. Kripke and Lewis suggest conventions are self-perpetuating equilibria. A style guide is a cheap talk signal. When does cheap talk shift equilibrium? This connects directly to the "Drift" question.

  **The Defended Agenda**

  You have three years. You need a dissertation that looks like *semantics* to your advisor but captures the *social reality* you care about. Here is how I rank the open questions, based on upstream importance, tractability for a formalist, and neglect.

  **1. The Projection Profile of Gendered Defaults (Rank: 1)**
  *   **The Question:** Do gendered inferences associated with generic masculines or supposedly neutral terms project out of negation, conditionals, and attitude reports?
  *   **Why Upstream:** This determines your entire formal machinery. If the bias projects, you are dealing with presupposition or conventional implicature (Potts-style). If it doesn't, it's conversational implicature or pragmatic enrichment. You cannot model the "harm" or the "drift" until you know where in the grammar the bias lives. Most of the 70s literature assumed it was pragmatic without testing projection.
  *   **Tractability:** High. This is bread-and-butter formal pragmatics. You construct minimal pairs, test them against embedding environments, and model the context update. It satisfies a semanticist advisor because it's about logical operators and context change potentials, not "societal impact."
  *   **Neglect:** High. People argue about the *morality* of the generic masculine, but few have rigorously tested its *logical behavior* using modern presupposition theory.

  **2. The Stability of Neutrality as a Coordination Problem (Rank: 2)**
  *   **The Question:** Under what game-theoretic conditions does a neutral term (like singular 'they' or 'chair') fail to displace a marked masculine default?
  *   **Why Upstream:** This explains the "drift" phenomenon you mentioned. It moves the discussion from "people are sexist" to "the equilibrium is sticky." It explains why style guides often fail (they change payoffs insufficiently).
  *   **Tractability:** Moderate. Requires learning some basic evolutionary game theory (Skyrms, Lewis), but no empirical data collection. You model the costs of misgendering vs. the costs of using non-standard forms.
  *   **Neglect:** Moderate. Economists and some linguists do this, but philosophers of language often ignore the stability conditions of the conventions they analyze.

  **3. The Normative Authority of Semantic Conventions (Rank: 3)**
  *   **The Question:** Does identifying a semantic convention as exclusionary provide a *reason* to change it, or merely a description of the exclusion?
  *   **Why Upstream:** This addresses the "so what?" It bridges the Is/Ought gap.
  *   **Tractability:** Low/Moderate. This is pure meta-ethics/philosophy of language. It risks becoming too abstract if not grounded in the semantics from Question 1.
  *   **Neglect:** Low. Everyone assumes the link, but few argue for it rigorously.

  **My Bet for Your Three Years:**
  Focus on **Question 1 (Projection)** as the core, and use **Question 2 (Stability)** to explain the diachronic drift in your conclusion.
  Why? Because Question 1 secures your degree. It produces clear, formal results that a semanticist advisor can evaluate. It avoids the "discourse analysis" trap by treating gendered inferences as formal objects subject to logical tests. If you prove that generic 'he' triggers a presupposition failure when bound to a female antecedent in a way that 'they' does not, you have a semantic result that *implies* social exclusion without needing to write a sociological treatise.

  Question 2 supports it by explaining why the presupposition exists (it's a stable equilibrium). Question 3 is the philosophical wrapper for the introduction and conclusion.

  **Practical Payoffs: Reality Check**

  You asked about style guides, curricula, and law. Here is the cold water:

  1.  **Style Guides & Curricula:** Philosophy has almost **zero** direct leverage here. Style guides are decided by committees based on usability and political pressure, not semantic truth conditions. Your work might *justify* a guide retrospectively, but it won't *generate* one. Do not promise this as a payoff.
  2.  **Legal Drafting:** This is where the weight is. Statutory interpretation often hinges on "ordinary meaning." If a law says "he," does it cover women? Courts often look to linguistic intuition. If you can demonstrate that the "ordinary meaning" of 'he' in generic contexts carries a presupposition of maleness that excludes women in a way that 'they' does not, that is expert-testimony-adjacent material. It doesn't dictate the law, but it clarifies the linguistic premise the law relies on.
  3.  **The "Language Shapes Thought" Payoff:** This is overrated. Philosophers often imply that fixing language fixes cognition. Be careful. Your work shows how language *encodes* bias, not necessarily how it *causes* it. Distinguish between constitutive rules (this is what the word means) and causal effects (this word makes you think X). The former is your lane; the latter is psychology.

  **What Moves the Ranking?**
  If a major corpus study comes out tomorrow showing singular 'they' has fully neutralized in all dialects, Question 2 (Stability) becomes less urgent. If the Supreme Court takes a case on gendered statutory interpretation, Question 1 (Semantics) spikes in value. But for now, the semantic status of the bias is the bottleneck. Everyone assumes they know it; nobody has proven it with formal tools.

  **The Rabbit Hole**
  You suspected the "fact of the matter about defaults" was a trap. You are right, *unless* you define "default" as "the strategy in a coordination equilibrium that persists despite the availability of a neutral alternative." Treat it as a game-theoretic property, not a demographic fact. If you try to measure the default empirically, you become a corpus linguist. If you analyze the *conditions* for default status, you remain a philosopher.

  **Final Recommendation**
  Lock in the **Semantics/Pragmatics Interface of Gendered Inferences**. It is the only question that satisfies your advisor's demand for formality while addressing your fascination with how neutral language nudges toward masculine readings. It turns a political stalemate into a technical puzzle about projection and context update.

  \answer{Do gendered default inferences project out of logical operators?}
