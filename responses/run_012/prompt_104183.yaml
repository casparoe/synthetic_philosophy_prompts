answer: |-
  # The Memorial Viability Protocol (MVP)

  **Purpose:** To provide a consistent, 15-minute decision framework for the Historical Marker and Memorial Committee.
  **Basis:** Derived from comparative models of memory politics (Germany, Japan, Turkey, US South).
  **Usage:** Read the proposal. Ask the four questions in order. Record the answer. If any question fails, the proposal stops unless a specific "Hand-Off" condition is met.

  ---

  ## The Procedure

  ### Gate 1: The Truth Test (The Turkey Standard)
  **Question:** Does the proposal assert historical claims that contradict the current consensus of professional historians, or omit established facts to protect a reputation?
  *   **Sufficient Answer:** "Yes, the text matches the historical record," or "No, but the omitted facts are irrelevant to the specific scope of this marker."
  *   **Dodge:** "It's a matter of perspective," "We are telling *our* story," or "That history is too divisive for a plaque."
  *   **Decision:**
      *   **FAIL:** Immediate **REJECTION**. (A memorial based on denial is an instrument of false memory).
      *   **PASS:** Proceed to Gate 2.

  ### Gate 2: The Function Test (The Germany Standard)
  **Question:** Is the primary function of this object to **Honor** (make the viewer feel settled, proud, or grateful) or to **Warn** (make the viewer feel unsettled, implicated, or instructed)?
  *   **Sufficient Answer:** A clear selection of one category. (e.g., "It honors a benefactor" or "It warns against injustice").
  *   **Dodge:** "It does both equally," "It educates while honoring," or "It depends on who looks at it."
  *   **Decision:**
      *   **AMBIGUOUS:** If the committee cannot agree on a single primary function, **HAND OFF** to the Town Council. (This is a values conflict, not a factual one).
      *   **CLEAR:** Proceed to Gate 3.

  ### Gate 3: The Contamination Test (The Japan Standard)
  **Question:**
  *   *If HONOR:* Does the person or cause being honored depend upon, defend, or benefit from a system now recognized as harmful (e.g., slavery, segregation, aggression)?
  *   *If WARN:* Is the warning specific enough that it cannot be co-opted to praise the perpetrators?
  *   **Sufficient Answer:** "No, their good works are separable from the harm," or "Yes, the harm is integral to their legacy."
  *   **Dodge:** "They were a product of their time," "Heritage not hate," or "We are remembering their sacrifice, not their politics."
  *   **Decision:**
      *   **FAIL (Honor + Harm):** Immediate **REJECTION**. (You cannot honor the dead without honoring the deed if the deed is the source of their fame).
      *   **FAIL (Warn + Vague):** **REDESIGN REQUIRED**. (Must specify the crime, not just the "cost of war").
      *   **PASS:** Proceed to Gate 4.

  ### Gate 4: The Closure Test (The Counter-Monument Standard)
  **Question:** Does the design or location imply that the history is "finished" and the debt is paid?
  *   **Sufficient Answer:** "No, the design invites ongoing engagement," or "No, the location forces daily encounter."
  *   **Dodge:** "It is a permanent tribute," "It is beautiful and dignified," or "It will sit in a park where people can reflect."
  *   **Decision:**
      *   **FAIL:** **CONDITIONAL REJECTION**. (Permanent, beautiful, or segregated monuments regarding atrocities imply the work of justice is complete. Propose a temporary installation, a functional space, or an integrated design).
      *   **PASS:** **APPROVAL**.

  ---

  ## Application to Current Proposals

  Here is the procedure run on the three items currently before the committee.

  ### Proposal (a): Keep Confederate Monument, Add Explanatory Plaque
  *   **Gate 1 (Truth):** **PASS.** The plaque text accurately states the monument was erected in the early 1900s to assert white supremacy.
  *   **Gate 2 (Function):** **AMBIGUOUS.** The monument itself is an object of *Honor* (statues are inherently honoring). The plaque is an object of *Warning*. The committee argues it "does both."
      *   *Procedure Ruling:* **HAND OFF TO COUNCIL.**
      *   *Reasoning:* The procedure cannot resolve the tension between a statue that says "Stand Proud" and a plaque that says "Be Ashamed." This is a values conflict.
      *   *Committee Note:* If forced to choose a primary function: The visual dominance of the statue overrides the text of the plaque. It functions as *Honor*.
  *   **Gate 3 (Contamination):** **FAIL.**
      *   *Reasoning:* If the function is *Honor* (as the visual form dictates), the subject is the Confederate cause. That cause is inseparable from slavery.
      *   *Dodge Identified:* "Heritage not hate" is explicitly flagged as a dodge in Gate 3.
  *   **Final Ruling:** **REJECTION.**
      *   *Note:* The "compromise" is logically incoherent under this protocol. You cannot layer a warning onto an honorific structure without neutralizing the warning. The statue must come down or be re-contextualized as art/warning (e.g., moved to a museum), not stay in the square.

  ### Proposal (b): Rename Elementary School (Physician/Segregationist)
  *   **Gate 1 (Truth):** **PASS.** It is factually established he led resistance to desegregation.
  *   **Gate 2 (Function):** **PASS.** Naming a school after someone is an act of *Honor*.
  *   **Gate 3 (Contamination):** **FAIL.**
      *   *Reasoning:* His fame and local standing were derived in part from his defense of segregation. His medical work cannot be fully separated from the social system he fought to maintain.
      *   *Dodge Identified:* "He was a good doctor" is insufficient if his public legacy was defined by exclusion.
  *   **Final Ruling:** **REJECTION.**
      *   *Note:* The name must change. The procedure does not allow honoring individuals whose public legacy is tied to harmful systems.

  ### Proposal (c): Memorial at Courthouse Steps to People Sold There (User's Proposal)
  *   **Gate 1 (Truth):** **PASS.** People were sold there.
  *   **Gate 2 (Function):** **PASS.** This is a *Warning* / Memorialization of victims, not honor for perpetrators.
  *   **Gate 3 (Contamination):** **PASS.** It does not honor the sellers.
  *   **Gate 4 (Closure):** **FAIL.**
      *   *Reasoning:* The proposal specifies a "small memorial" (implied permanent stone/bronze) at the courthouse steps. A permanent, fixed object in a civic plaza suggests to the passerby that the history has been acknowledged and "taken care of." It allows the viewer to read, feel a moment of sadness, and walk away believing the debt is settled.
      *   *Dodge Identified:* "It is important to have a permanent place for people to grieve." (The procedure prioritizes *unsettling* the public over *comforting* them).
  *   **Final Ruling:** **CONDITIONAL REJECTION.**
      *   *Note:* You may not build a permanent monument. You must propose a design that changes, degrades, or requires active maintenance to remain visible, OR it must be integrated into the functioning of the courthouse (e.g., the steps are the memorial, not a plaque on them). A static plaque fails the Closure Test.

  ---

  ## Limitations and Critique

  You asked me to tell you where this procedure will misfire and where it hides value judgments.

  **1. Where it will misfire (The Simplification Cost):**
  *   **Complex Figures:** The procedure treats "Honor" and "Harm" as binary. It will fail on complex figures (e.g., a civil rights leader who was also abusive at home). It forces a flattening of biography that professional historians would reject.
