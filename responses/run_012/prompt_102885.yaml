  Based on the verdicts you have logged, your colleague is operating within the mainstream of contemporary social ontology, likely adhering to a framework derived from David Lewis's *Convention* (1969), possibly modified by later theorists like Margaret Gilbert.

  Here are the two competing rules (theoretical accounts) that fit her earlier verdicts equally well, their predictions for your door-charm case, my guess at her response, and the case that would truly test her theoretical commitments.

  ### 1. The Competing Rules

  **Rule A: The Coordination Equilibrium Account (Lewisian)**
  *   **Definition:** A convention is an arbitrary regularity in behavior, sustained by common knowledge of mutual expectations, where agents have a **conditional preference to conform**. That is, I prefer to do X *if and only if* I expect you to do X, because conforming solves a coordination problem (e.g., avoiding crashes, enabling communication).
  *   **Fit with Earlier Verdicts:**
      *   *Driving/Language/Currency/Handshakes:* These are all coordination problems. I drive on the right *because* you do; if you drove on the left, I would prefer to switch.
      *   *The Bridge:* This is **not** a convention. Crossing the shortest bridge is a "dominant strategy." I cross there because it is efficient, regardless of what you do. There is no conditional preference based on your behavior.

  **Rule B: The Normative Commitment Account (Gilbertian)**
  *   **Definition:** A convention is an arbitrary regularity sustained by a **joint commitment** that creates a normative obligation. Conformity is not just expected; it is *owed* to the group. Deviation warrants rebuke or guilt.
  *   **Fit with Earlier Verdicts:**
      *   *Driving/Language/Currency/Handshakes:* These involve social 'oughts'. If you drive on the left or refuse a handshake, you are liable to criticism or sanction.
      *   *The Bridge:* This is **not** a convention. No one is obligated to cross the shortest bridge; if someone takes the long way, they are merely inefficient, not blameworthy. There is no joint commitment to the shortest path.

  ### 2. Predictions for the Door-Charm Case

  *   **Rule A (Coordination) Predicts:** **Not a Convention.**
      *   *Reason:* You specified that "no one gains anything by conforming." Without a payoff or a problem solved by coordination, there is no conditional preference. The behavior is a mere regularity or custom, lacking the strategic interdependence required for convention.
  *   **Rule B (Normativity) Predicts:** **Not a Convention.**
      *   *Reason:* You specified that "no one is reproached for deviating." Without the possibility of rebuke or a felt obligation, there is no joint commitment. It is a shared habit, but not a normative social fact.

  ### 3. Best Guess at Her Verdict

  **Verdict:** She will say it is **Not a Convention**.

  **Reasons:**
  1.  **The Bridge Clue:** Her rejection of the bridge case is the hallmark of a Lewisian. The bridge case is the classic philosophical counter-example used to distinguish *conventions* from *mere regularities dictated by nature or efficiency*. This suggests she prioritizes the *structure* of the agreement over the mere existence of a pattern.
  2.  **Field Standards:** In social ontology, the "Pure Regularity" view (that any arbitrary expected pattern is a convention) is largely considered defunct. Most theorists require either a coordination function (Lewis) or normative force (Gilbert). Since the charm case lacks *both*, it fails both major tests.
  3.  **Rationality:** If there is no gain and no sanction, the "common knowledge of expectation" is unstable. A social ontologist would likely argue that without a reason to conform (payoff or norm), the expectation would dissolve, meaning it doesn't meet the stability criteria of a convention anyway.

  ### 4. The Further Case to Force the Issue

  Since both major theories predict "No" for the door-charm case, that case will not tell you whether she is a **Lewisian (Coordination)** or a **Gilbertian (Normativity)**. To distinguish between these two rules, you need a case where one condition is met but the other is absent.

  **The Case: The Anonymous Traffic Light**
  Imagine a small town where drivers stop at red lights.
  *   **Coordination Payoff:** If everyone stops, accidents are avoided (everyone gains by conforming conditional on others).
  *   **No Normativity:** The cars are fully opaque, and there are no police or cameras. If someone runs a red light, no one can identify them to reproach them, and the drivers feel no guilt or obligation, only a prudential desire to avoid crashes.

  **How it forces the issue:**
  *   **The Lewisian (Coordination)** will call this a **Convention**. The coordination problem is solved by mutual expectation and conditional preference, even without normative force.
  *   **The Gilbertian (Normativity)** will call this **Not a Convention**. Without the possibility of rebuke or a joint commitment creating an 'ought', it is merely convergent individual prudence, not a social convention.

  This case cleanly isolates the *function* of coordination from the *normativity* of commitment, revealing which mechanism she views as the essence of conventionality.
