prompt: |-
  I spent most of last night arguing with a friend about whether our housing cooperative should adopt a futarchy-style procedure for a decision we have been stuck on for months. We are a nine-hundred-unit co-op with an elected board, and we have to choose between raising monthly carrying charges by roughly four percent to rebuild the reserve fund and holding charges flat while taking a loan against the building. Our bylaws currently leave this to the board, but a faction wants to run what it calls a decision market: the board would first define a single measurable welfare metric — reserve months of operating expenses three years out, adjusted by an annual member-satisfaction survey — and then open two conditional contracts, one paying out according to the metric if we raise charges and one paying out according to the metric if we take the loan. Whichever conditional contract trades higher would settle the policy. My friend finds this elegant; I suspect it quietly assumes the very thing it is supposed to decide, and that in a body of nine hundred people who all know each other the market would mostly mirror the loudest faction. Neither of us could get past trading anecdotes, so I would like the argument made properly.

  Please set out the most important implications of futarchy, as a governance mechanism, for an organization exactly this small and this homogeneous — not for a nation-state. I am after the design choices that stop being free once the market is thin, the participants are also the people the policy affects, and the metric has to be fixed in advance by the same body that will later be judged by it. In particular, I want to understand the implications of the decision rule being public: does reading the price in order to make the decision change what the price means, and if so, what follows specifically for the two conditional contracts above? And I want to know what becomes of the mechanism's advertised advantage — that it separates the question of what we value from the question of what will happen — when the people betting on the second question are the same people who voted on the first, and can plausibly be identified by their bets. Where the honest answer is that futarchy has no real implications for us because a precondition fails, say so and name the precondition that fails first; I would much rather have a short list of consequences that actually bite than a survey of the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A 900-unit housing cooperative (small, homogeneous, known participants).
      *   **Problem:** Stuck decision between raising fees (4%) vs. taking a loan.
      *   **Proposal:** Adopt futarchy (decision markets) to resolve the deadlock.
      *   **Mechanism:** Board defines a metric (Reserve months @ 3 years + Satisfaction). Two conditional contracts (Raise Fees vs. Loan). Higher price wins.
      *   **User's Stance:** Skeptical. Suspects it assumes what it decides and will mirror the loudest faction.
      *   **Friend's Stance:** Finds it elegant.
      *   **Specific Questions/Requirements:**
          *   Focus on implications for *this specific size/type* of org (not a nation-state).
          *   Address design choices that fail when markets are thin, participants are affected parties, and the metric is fixed by the judges.
          *   Address the *public decision rule* problem (does reading the price change the price?).
          *   Address the *separation of values vs. beliefs* problem (when bettors = voters = metric setters).
          *   **Crucial Constraint:** If futarchy doesn't work because a precondition fails, say so explicitly and name the precondition. Prefer a short list of biting consequences over a general survey.

  2.  **Deconstruct Futarchy in this Context:**
      *   *Futarchy Definition:* "Vote on values, bet on beliefs." A market predicts the outcome of a metric under different policies. The policy with the higher predicted metric value is adopted.
      *   *Scale:* 900 units. Let's assume maybe 10-20% active participation in a market? That's 90-180 people. Very thin liquidity.
      *   *Participants:* Neighbors. They know each other. They are affected by the outcome.
      *   *Metric:* "Reserve months + Satisfaction." This is subjective/ manipulatable (especially satisfaction).
      *   *Decision Rule:* Public. The market price *is* the decision.

  3.  **Identify the Core Failure Modes (The "Biting Consequences"):**

      *   **Precondition Failure 1: Liquidity/Information Aggregation.** Futarchy relies on the "Wisdom of Crowds" via financial incentives. In a 900-person co-op, you don't have a crowd; you have a neighborhood. If only 50 people trade, the price isn't an aggregate of information; it's the aggregate of the cash-rich or the loud.
      *   **Precondition Failure 2: Separation of Values and Beliefs.** Robin Hanson's core thesis is that voters set the metric (values) and traders predict the outcome (beliefs). Here, the Board (elected by members) sets the metric. The traders *are* the members. If I bet against the loan because I hate debt (value), not because I think it will lower reserves (belief), the market signal is corrupted.
      *   **Precondition Failure 3: The Reflexivity/Performativity Problem.** The user specifically asked about the public decision rule. If the market says "Loan" wins, and everyone sees that, does it become true? Or does it cause a run on the reserves? In a small co-op, the act of measuring the metric (Satisfaction Survey) is highly manipulatable by the winning faction.
      *   **Precondition Failure 4: Incentive Compatibility.** To bet, you need skin in the game. If I bet $100 on "Raise Fees," and "Raise Fees" wins, I get paid based on the metric. But if "Raise Fees" wins, my monthly costs go up 4%. My financial interest as a resident conflicts with my interest as a trader. This is the *Affected Participant* problem.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* List general pros and cons.
      *   *Correction:* User explicitly said "I would much rather have a short list of consequences that actually bite than a survey of the idea." and "Where the honest answer is that futarchy has no real implications for us because a precondition fails, say so."
      *   *Pivot:* I need to be decisive. Futarchy likely *fails* here. I need to identify the specific preconditions that break.

      *   *Key Precondition:* **Incentive Compatibility regarding the Policy Outcome.** In standard futarchy (nation-state), traders are distinct from citizens (ideally), or the policy impact on the trader is negligible compared to the payout. In a co-op, the policy impact (4% fee hike) is massive compared to any plausible market payout.
      *   *Key Precondition:* **Metric Integrity.** The metric includes "member satisfaction." In a 900-person group, if the "Loan" faction wins the market, they have the incentive to sandbag the satisfaction survey if the "Fee" faction tries to claim victory later, or vice versa. But more importantly, the metric is set by the Board *before* the market. If the Board is deadlocked, how did they agree on the metric? If they didn't, the metric is contested. If they did, why use the market?
      *   *Key Precondition:* **Liquidity.** 900 people is too small for a prediction market to overcome noise.

      *   *Refining the "Public Decision Rule" point:* If the market price determines the policy, traders aren't just predicting; they are *lobbying*. If I want the Loan, I buy Loan contracts. This drives the price up. This isn't information aggregation; it's vote buying with extra steps. Because the market is thin, a wealthy faction can outspend the other.

  5.  **Structuring the Response:**
      *   **Direct Answer:** State clearly that a critical precondition fails.
      *   **The Failed Precondition:** Incentive Compatibility / Decoupling of Trading and Policy Impact.
      *   **Implication 1: The Market Becomes a Vote (with money).** Because participants are affected, they trade based on preference, not prediction.
      *   **Implication 2: Metric Manipulation (Goodhart's Law).** The metric includes satisfaction. The winning faction will game the survey.
      *   **Implication 3: Reflexivity.** The public price changes behavior.
      *   **Conclusion:** Recommendation against it.

  6.  **Polishing the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "public decision rule" specifically? Yes, need to emphasize that in a thin market, the price *is* the vote count, not a probability estimate.
      *   *Check:* Did I address the "separation of values/beliefs"? Yes, need to explain that traders cannot separate their financial interest in the policy outcome from their market position.
      *   *Tone:* Analytical, precise, respectful of the intelligence of the user (they know the terms). Avoid condescension.
      *   *Specifics:* Use the 4% fee vs. Loan example.

  7.  **Finalizing the "Precondition" Statement:**
      The strongest argument is that **Futarchy requires traders to be indifferent to the policy outcome except through the metric payout.** In a co-op, the policy outcome (fees vs. debt) has direct, large financial utility effects that dwarf the market payout. Therefore, the market price reflects *preference intensity*, not *expected value*. This collapses futarchy into a weighted vote.

      *Wait, is that strictly true?* If the payout is large enough... No, in a co-op, you can't offer payouts large enough to offset a 4% permanent fee hike without it being gambling/illegal securities.
      *So, the precondition is:** **Decoupling of Policy Utility and Market Payout.**

      *Second Precondition:* **Metric Objectivity.** "Satisfaction" is subjective. In a small group, this is easily weaponized.

      *Third Precondition:* **Liquidity.** 900 people is too few.

      *Decision:* Focus on the **Incentive Compatibility/Decoupling** as the primary failure. It subsumes the others. If traders care about the policy outcome directly, the market signal is noise.

  8.  **Drafting the Response (incorporating the "Public Decision Rule" nuance):**
      *   If the price decides, and I know my neighbors are trading, and I want the Loan... I buy Loan contracts. Not because I think reserves will be higher, but because I want the Loan. This drives the price up. The price no longer predicts the metric; it aggregates *desire*.
      *   This makes it a vote. But a vote where wealth matters more than one-person-one-vote.
      *   The "Public Rule" creates a self-fulfilling or self-defeating prophecy. If "Loan" is winning, Fee-hawks might sabotage the satisfaction survey to prove the market wrong (spite), or Loan-fans might inflate it.

  9.  **Final Review against constraints:**
      *   Small/Homogeneous org? Yes.
      *   Thin market? Yes.
      *   Participants = Affected? Yes.
      *   Metric fixed in advance? Yes.
      *   Public decision rule implications? Yes.
      *   Values vs Beliefs separation? Yes.
      *   Short list of biting consequences? Yes.
      *   Name the failed precondition? Yes.

      *Plan:*
      1.  State the Verdict: Precondition fails.
      2.  Name the Precondition: Incentive Compatibility (Decoupling).
      3.  Detail the 3 Biting Consequences (Market as Vote, Metric Gaming, Reflexivity).
      4.  Conclude on the specific contracts mentioned.

      *(Self-Correction)*: Ensure I explain *why* the separation of values/beliefs collapses. In standard futarchy, I vote for "GDP up" (value) but bet on "Policy A increases GDP" (belief). Here, I vote for "Reserves + Satisfaction" (value). But when betting, I care about "Do I want a loan?" (value) more than "Will reserves go up?" (belief). The bet becomes a value statement.

      *(Refining the "Public Rule" point)*: In a liquid market, my trade is a drop in the bucket. In a 900-person co-op, my trade moves the line. I know this. So I trade strategically to influence the decision, not to reveal information. This destroys the information aggregation function.

      *Let's write.*
answer: |-
  The honest answer is that futarchy will not function as a decision mechanism for your cooperative because a critical precondition fails: **incentive compatibility regarding policy outcomes.**

  Futarchy relies on the assumption that traders profit only if their prediction of the *metric* is correct, and that their personal utility is otherwise decoupled from which policy is chosen. In a nation-state, a trader's personal tax burden or safety is rarely swayed enough by a single policy to outweigh market profits. In a 900-unit co-op, the policy options (4% fee hike vs. debt) have immediate, substantial, and divergent financial impacts on every resident.

  Because the participants are the affected parties, and the market is thin, the mechanism collapses. Here are the three specific implications that follow from this failure.

  ### 1. The Market Price Becomes a Weighted Vote, Not a Prediction
  In a functional futarchy, the price represents the aggregated *belief* about the future state of the metric. In your co-op, the price will represent the aggregated *preference* for the policy, weighted by wealth.

  *   **The Mechanism Break:** Since you and your neighbors are the traders, you cannot separate your belief ("Will reserves be higher?") from your value ("Do I want to pay more fees?"). If you oppose fee hikes, you will sell the "Raise Charges" contract regardless of your actual estimate of the reserve fund, simply to drive the price down and prevent the policy from passing.
  *   **The Consequence:** Because the market is thin (likely fewer than 50 active traders), a wealthy faction can outspend the other to manipulate the price. The decision rule is public, so traders know their individual orders move the line. This incentivizes strategic trading to *influence* the outcome rather than reveal information. You do not get a wisdom-of-crowds forecast; you get a plutocratic vote where the loudest faction is the one with the most liquid cash, not the best argument.

  ### 2. The Metric Becomes a Weapon (Goodhart's Law)
  Your proposed metric is "reserve months... adjusted by a member-satisfaction survey." This combination is fatal in a small, homogeneous group where the metric setters (Board) and metric subjects (Members) are the same people who profit from the market contracts.

  *   **The Mechanism Break:** Futarchy requires the metric to be immutable and objective. However, "member satisfaction" is subjective and easily manipulatable in a group of 900. If the "Loan" contracts are trading higher, the faction favoring loans has a financial incentive to ensure the satisfaction survey reads high in three years. The faction favoring fees has a financial incentive to ensure it reads low.
  *   **The Consequence:** The post-decision period becomes a continuation of the campaign by other means. You will see organized efforts to game the survey (e.g., "If you care about the building, rate satisfaction low to prove the Loan failed"). The market does not resolve the conflict; it financializes the conflict, giving members a direct monetary stake in sabotaging the metric measurement if their policy loses.

  ### 3. Reflexivity Destroys the Signal
  You asked specifically about the public decision rule. In a liquid market, the price is a signal that traders react to. In your co-op, the price *is* the decision, and the traders *are* the implementers.

  *   **The Mechanism Break:** If the "Raise Charges" contract starts trading higher, it signals that the fee hike is imminent. This knowledge changes member behavior *before* the policy is implemented. Members angry about the likely fee hike may boycott the satisfaction survey or organize resistance that actually lowers the reserve fund (e.g., withholding payments), thereby ensuring the metric fails.
  *   **The Consequence:** The market creates a self-defeating prophecy. The act of measuring the probability of success changes the probability of success. Because the group is small enough that individuals know their behavior impacts the metric, the "prediction" cannot be distinct from the "outcome." The contract price ceases to mean "expected reserve level" and starts meaning "level of factional anger."

  ### Summary of Design Failures
  For your specific situation, the advertised advantage of futarchy—that it separates *what we value* from *what will happen*—is illusory.

  1.  **Values/Beliefs Collapse:** Because the traders are the residents, they cannot bet on "what will happen" without betting on "what they want." The market measures preference intensity, not epistemic accuracy.
  2.  **Liquidity Failure:** With 900 members, you lack the anonymity and volume to prevent price manipulation. A dozen wealthy unit-owners can dictate policy.
  3.  **Metric Integrity:** You cannot use a subjective metric (satisfaction) in a governance market where the losers have a financial incentive to prove the winners wrong.

  **Recommendation:** Do not adopt this procedure. It adds the complexity and risk of a financial market to a governance dispute without providing the information-aggregation benefits. It will likely deepen the factional rift by giving the losing side a financial grievance (lost bets) on top of the policy grievance. Return to the board vote or a simple one-member-one-vote referendum; these mechanisms acknowledge that the dispute is about values, not uncertainty, which is where your deadlock actually lies.
