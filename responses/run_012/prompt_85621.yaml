answer: |-
  You have put your finger on a methodological sinkhole that is remarkably common in historical sociology and political science, yet it lacks a single, universally recognized label that captures both the statistical error and the semantic maneuver you describe. The pattern you are observing is a specific fusion of selection bias and conceptual rigging. While statisticians often refer to the underlying mechanical error as selection on the dependent variable, that term describes the sampling mistake without fully capturing the rhetorical move of redefining the category itself to exclude counterexamples. Survivorship bias is indeed nearby, but as you noted, it is not quite right because survivorship bias typically involves ignoring the failures because they are invisible, whereas your colleagues are ignoring the survivors because they are inconvenient, actively excluding them from the class rather than merely failing to see them. The reference class problem is also relevant, but that problem usually concerns the ambiguity of choosing between multiple valid classes, whereas here the class is being manipulated to guarantee a specific result. Conditioning on a common effect, or collider bias, describes the statistical structure that generates spurious correlations when you select on an outcome, but it does not name the semantic circularity where the definition of the noun absorbs the verb.

  Because no existing term perfectly isolates this specific combination of statistical selection and semantic redefinition, I propose we call it the fallacy of outcome-defined categorization. This label captures the core mechanism: the reference class is not constructed based on antecedent conditions or independent characteristics, but is instead constituted by the outcome itself. In your example, the category empire is not defined by territory, governance structure, or hegemony in a way that could be measured before the decline occurs; rather, it is defined retrospectively such that to be a true empire is to have declined. If a polity survives, it is retroactively deemed not to have been a true empire, or its survival is reinterpreted as a form of decline. This makes the prediction tautological. The argument appears to be empirical, relying on a list of historical cases, but it is actually definitional. The list of fallen empires does not prove that empires decline; it proves only that the speaker has chosen to apply the label empire only to those polities that declined.

  This fallacy differs from survivorship bias in a crucial directionality. In survivorship bias, the data generation process hides the failures, leading you to overestimate the success rate because you only see the winners. In outcome-defined categorization, the data generation process is often visible, but the classification system hides the survivors. You can see the United States or the surviving firms, but they are filtered out of the analysis by a definitional gatekeeping that says they do not count. It differs from the ordinary reference class problem because the reference class problem acknowledges that an event belongs to many classes and asks which one is relevant. Here, the arguer insists there is only one relevant class, but the boundaries of that class are drawn after the fact to ensure homogeneity of outcome. It differs from conditioning on a common effect because collider bias is a structural error in causal inference that can happen even with honest definitions. Outcome-defined categorization is a conceptual error where the definition itself is corrupted by the outcome. You can have a perfectly specified statistical model that still suffers from this fallacy if the variable names mask the fact that membership was determined by the dependent variable.

  The boundaries of this error are important to mark, because not all retrospective classification is fallacious. It stops being a mistake when the category is defined independently of the outcome, even if that definition is applied retrospectively. For instance, if you define an empire as a polity controlling more than a million square kilometers with a centralized bureaucracy, and then you observe that all such polities in your sample declined, you are not committing this fallacy, provided you include the ones that survived in the category as well. The error enters only when the definition is adjusted to exclude the survivors. If a colleague is scrupulous about how the category is defined, specifying criteria that could have been measured before the decline occurred, and then applies those criteria consistently to both fallen and surviving cases, they are safe. The fallacy also loses its grip if the sample is large enough and the definition is fixed such that the survivors cannot be wished away, though a large sample does not cure the problem if the definition itself remains outcome-contingent. Finally, it is not a mistake when the category names a real kind rather than a retrospective label, but the difficulty lies in proving it is a real kind. If the kind is natural, its membership should not depend on its fate. If you claim that empire is a natural kind, you must be able to identify an empire before it falls. If you can only identify it after it falls, it is not a natural kind but a narrative device.

  This distinction matters because it changes the burden of proof. When someone argues that empires decline based on a list of fallen empires, the burden is on them to show that the surviving hegemons fit the same antecedent definition. If they cannot, they are not making a empirical claim about history; they are making a semantic claim about the word empire. They are essentially arguing that the word empire means something that includes decline as a necessary feature. This might be a valid linguistic observation, but it cannot support a prediction about the future of a polity currently identified as an empire unless you are willing to concede that the label will be removed the moment the polity proves stable. By naming this the fallacy of outcome-defined categorization, you can point out that the sample was not gathered to test a hypothesis, but to illustrate a definition. The comfort of the sample comes from its circularity. The list of fallen empires is comforting precisely because it excludes the confusing cases that did not fall, and the exclusion is justified by the very fact that they did not fall. Recognizing this allows you to demand a definition that works ex ante, forcing the argument out of the realm of tautology and into the realm of risky prediction where it can actually be falsified.
