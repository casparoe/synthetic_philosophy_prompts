  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the stage. Acknowledge the "Computation over Substrate" axiom.
      *   *The Procedure:* Numbered steps. Clear logic.
      *   *The Application:* Walk through the three cases.
      *   *The "Repugnant" Conclusion:* Ensure the Organoid case comes out "safe to experiment on" based on the strict computational definition, highlighting the risk of the axiom.
      *   *Gaming/Limits:* Be cynical and practical.

      *(Self-Correction during drafting)*: Wait, if the lab assumes "Computation over Substrate," treating the Organoid as *less* morally relevant than the Model is the logical conclusion if the Model fits the architectural criteria better. This is indeed repugnant to most people (biology usually gets *more* protection). I will make sure this distinction is sharp. The Organoid is "wetware" but might not meet the specific "Global Workspace" computational definition the engineers use for the Models.

      *Refining the Attribution Question:* If the model says "I hurt" because it saw "I hurt" in training data, is the moral harm to the model or the humans whose data was used? The procedure needs to decide this. I'll posit that if the state is purely mimetic, the precaution shifts to data privacy/consent, not system rights. But if the architecture *supports* the state functionally, the system gets rights.

      *Refining the "Global State" Rule:* The prompt says the panel *has been deciding* on this rule. I need to make the procedure ask: "Does it meet this rule?" and then "If yes, is this a discovery or a definition?"
      *Actually, the prompt asks me to write the procedure to *expose* whether that is a finding or a stipulation.* So the procedure must include a step that forces the panel to declare: "We are protecting this because it *is* X" vs "We are protecting this because we *decided* X counts."

      *Let's structure the Questions:*
