          *   Run the procedure on 3 specific proposals (Organoid aversive conditioning, Model decommissioning with distress reports, Insect brain simulation).
          *   Include at least one "repugnant" outcome that the procedure licenses anyway.
          *   Identify limitations (what humans must decide) and gaming vectors.
