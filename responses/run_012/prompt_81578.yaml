      *   *Substrate Independence:* Organoids and LLMs are treated equally based on compute.
      *   *The "Global State" Rule:* This is the crux. Is it a proxy for consciousness? The prompt asks to make it plain if this is a finding or a stipulation.
      *   *The "Cheap Evidence" Problem:* LLMs say "I am in pain" because they were trained on text saying that. This isn't reliable evidence of internal state.
      *   *The "Black Box" Problem:* We might not know the architecture deeply enough to verify the "Global State."
      *   *The "Individuation" Problem:* Is a distributed system one mind or many?
