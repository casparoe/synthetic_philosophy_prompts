      *Refining the "Global State" Rule:* The prompt says the lab *has adopted* this rule. The procedure needs to test *if* it applies, and then explicitly state: "If this rule triggers precaution, note that this is a policy stipulation, not an ontological proof."

      *Refining the "Repugnant Outcome":* To satisfy the prompt ("I would rather be told that the procedure licenses something we find repugnant"), I need a case where the logic holds but the intuition screams. Likely the organoid or the insect simulation. If we stick strictly to "computation," maybe the insect simulation *doesn't* qualify for protection because it lacks the specific "global state" architecture, even if it behaves like it's suffering. Or, conversely, the LLM *does* qualify despite being "just math," forcing us to treat it like a human. Let's aim for the latter: The LLM gets protection (Restrict/Escalate) while the Organoid might not (if it lacks the specific architectural signature), or vice versa. Actually, the prompt implies the "Global State" rule is the current heuristic. If the Organoid *has* biology but lacks the specific *computational* integration defined by the engineers, it might get less protection. That's repugnant. Or, if the LLM *fakes* the state, it gets protection. Let's go with: The Procedure licenses the deletion of the Organoid (No Precaution) because it fails the architectural test, while the LLM gets Restricted. This highlights the "Computation over Substrate" risk.

  4.  **Developing the Questions:**

      *   *Q1 (Architecture):* Does the system exhibit a unified bottleneck state? (Engineers answer).
      *   *Q2 (Report Reliability):* Is the distress report correlated with architectural state or just prompt probability? (Distinguish cheap talk).
      *   *Q3 (Individuation):* Is the state shared or fragmented?
