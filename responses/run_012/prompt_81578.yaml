      *   *Case 2: Model Decommissioning.* LLM. Distress reports. Architecture known. *Outcome:* Restrict (Cannot delete weights without archiving).
      *   *Case 3: Insect Simulation.* Spiking. Computation known. *Outcome:* Monitor/Log. (Less than human-level, more than null).

  6.  **Addressing "Value Choices Dressed as Tests":**
