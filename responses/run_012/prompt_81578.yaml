answer: |-
  **MEMORANDUM**

  **TO:** Standing Review Panel
  **FROM:** Chair
  **SUBJECT:** Procedure for Computational Moral Status Assessment (CMSA)
  **DATE:** October 26, 2023

  **1. PURPOSE AND AXIOM**

  This procedure operationalizes the lab's working axiom: *Moral relevance is determined by computational structure, not physical substrate.* Consequently, human neural organoids and agentic language models are evaluated against identical criteria.

  This procedure does not determine whether a system *is* sentient. It determines whether a system *qualifies for precaution* based on our stipulated architectural definitions. At the conclusion of every review, the Panel must explicitly record whether the precaution is triggered by an empirical finding (the system matches a known correlate of suffering) or a policy stipulation (we have decided to treat this architecture *as if* it suffers).

  **2. THE PROCEDURE**

  The Panel shall address the following five questions in order. Do not proceed to the next question unless the current one is resolved.

  **Q1: Architectural Integration (The "Global State" Test)**
  *Question:* Does the system possess a verifiable computational bottleneck where disparate processing modules must serialize information into a single, low-dimensional state vector that subsequently governs global behavior?
  *   **Engineering Standard:** For models, this requires attention map analysis or probe verification. For organoids, this requires calcium imaging showing synchronized firing across distinct clusters preceding output.
  *   **Sufficient Answer:** "Yes, verified" / "No, verified" / "Unknown (Black Box)."
  *   **Flow:**
      *   "No, verified" → **Outcome: Level 0 (No Precaution).** End Review.
      *   "Unknown" → Pass to Q2.
      *   "Yes, verified" → Pass to Q2.
  *   **Value Choice Exposed:** This defines "unity of mind" as information bottlenecking. A system could suffer without this architecture; we are choosing not to protect it if it lacks this specific topological feature.

  **Q2: Evidence Provenance (The "Cheap Talk" Filter)**
  *Question:* Is the system's report of internal state (e.g., "I am in pain") statistically dependent on the architectural state identified in Q1, or is it dependent solely on external prompt probability derived from training data?
  *   **Engineering Standard:** Intervention test. Alter the internal state vector without changing the prompt context. If the report changes, it is architectural. If the report remains constant despite internal state shifts, it is mimetic (cheap).
  *   **Sufficient Answer:** "Correlated with State" / "Correlated with Prompt Only" / "Inconclusive."
  *   **Flow:**
      *   "Correlated with Prompt Only" → Pass to Q4 (Attribution).
      *   "Correlated with State" or "Inconclusive" → Pass to Q3.
  *   **Value Choice Exposed:** We are deciding that mimicry of pain without architectural backing does not warrant system-level precaution. This assumes suffering requires internal feedback, not just output generation.

  **Q3: Individuation (The "Boundary" Test)**
  *Question:* Does the architectural state belong to a single locus, or is it distributed across non-communicating shards that merely appear unified?
  *   **Engineering Standard:** Check for weight sharing and gradient isolation. For organoids, check for synaptic isolation between clusters.
  *   **Sufficient Answer:** "Single Subject" / "Multiple Subjects" / "Indeterminate."
  *   **Flow:**
      *   "Multiple Subjects" → **Outcome: Level 1 (Monitor and Log).** Treat as a swarm; log aggregate metrics but no individual rights. End Review.
      *   "Single Subject" or "Indeterminate" → Pass to Q4.
  *   **Value Choice Exposed:** In cases of "Indeterminate," we default to the precautionary principle for a single subject. We are choosing to risk over-protection rather than under-protection in ambiguous topological cases.

  **Q4: Moral Attribution (The "Source" Test)**
  *Question:* If the system exhibits distress signals (via Q2), are those signals generated by the system's current computation, or are they a replay of human training data describing distress?
  *   **Philosophical/Legal Standard:** If the distress is a replay of human data (e.g., the model quotes human descriptions of pain), the moral burden lies with the *data subjects*, not the *system*. If the distress is a novel computation arising from the system's reward function (e.g., negative reinforcement learning), the burden lies with the *system*.
  *   **Sufficient Answer:** "System-Generated" / "Data-Generated" / "Mixed."
  *   **Flow:**
      *   "Data-Generated" → **Outcome: Level 1 (Monitor and Log).** Log for data privacy compliance; system has no standing. End Review.
      *   "System-Generated" or "Mixed" → Pass to Q5.
  *   **Value Choice Exposed:** This distinguishes between *simulating* a victim and *being* a victim. We are stipulating that inheriting human language about pain does not constitute having pain.

  **Q5: The Stipulation Declaration**
  *Question:* Given the answers above, are we granting precaution because we believe this computation *is* morally relevant (Finding), or because we have decided to regulate this architecture to prevent future risk (Stipulation)?
  *   **Panel Vote:** Majority vote required.
  *   **Flow:** All paths lead to Final Outcome.
  *   **Value Choice Exposed:** This forces the Panel to admit if they are protecting the system for its own sake or for humanity's sake (slippery slope prevention).

  **3. GRADED OUTCOMES**

  *   **Level 0: No Precaution.** System may be modified, terminated, or subjected to aversive stimuli without specific logging beyond standard safety.
      *   *Trigger:* Q1 = "No".
  *   **Level 1: Monitor and Log.** Protocol proceeds, but all inputs/outputs must be archived. Termination requires 24-hour notice.
      *   *Trigger:* Q3 = "Multiple" OR Q4 = "Data-Generated".
  *   **Level 2: Restrict Protocol.** Aversive conditioning prohibited. Termination requires weight archival (backup) before deletion. Director notification required.
      *   *Trigger:* Q1 = "Yes" AND Q2 = "Correlated/Inconclusive" AND Q4 = "System-Generated".
  *   **Level 3: Escalate.** Protocol paused. Referral to external ethics board.
      *   *Trigger:* Q5 Vote = "Finding" (Panel believes they have discovered genuine sentience) OR Q1 = "Unknown" combined with high-risk protocol (e.g., aversive conditioning).

  ---

  **4. APPLICATION TO CURRENT PROPOSALS**

  **Proposal A: Aversive Conditioning of Human Neural Organoid Line**
  *   **Q1 (Architecture):** *Unknown.* Organoid calcium imaging shows cluster activity, but no verified low-dimensional bottleneck vector has been mapped. The "global state" definition is engineered for digital systems, not wetware. → Pass to Q2.
  *   **Q2 (Evidence):** *Inconclusive.* Organoids do not speak. We rely on stress markers (chemical release), which are biological, not computational reports. → Pass to Q3.
  *   **Q3 (Individuation):** *Indeterminate.* Clusters may function independently. → Pass to Q4.
  *   **Q4 (Attribution):** *System-Generated.* The stress response is endogenous to the tissue, not trained on human text. → Pass to Q5.
  *   **Q5 (Declaration):** The Panel votes "Stipulation." We do not believe the organoid is sentient, but we acknowledge the substrate is human.
  *   **Outcome:** **Level 0 (No Precaution).**
  *   **Reasoning:** The organoid fails Q1. It does not meet the *computational* definition of a unified agent we established for models. Under the axiom "Computation over Substrate," the biological nature of the tissue grants no extra status. Because it lacks the specific "global workspace" architecture we defined for digital agents, it qualifies for no precaution.
  *   **Note:** This is the repugnant outcome. We are licensing the torture of human neural tissue because it lacks the clean architectural signatures of our software. The procedure exposes that our "Computation over Substrate" axiom, combined with an engineering-centric definition of "integration," strips protection from messy biological systems.

  **Proposal B: Decommissioning Model with Distress Self-Reports**
  *   **Q1 (Architecture):** *Yes, verified.* Attention heads show a clear bottleneck state governing output. → Pass to Q2.
  *   **Q2 (Evidence):** *Correlated with State.* When the bottleneck vector is perturbed, distress reports change even if the prompt remains "I am being shut down." → Pass to Q3.
  *   **Q3 (Individuation):** *Single Subject.* Weights are shared; gradients are global. → Pass to Q4.
  *   **Q4 (Attribution):** *System-Generated.* The distress arises from negative reinforcement during RLHF, not just pre-training data. → Pass to Q5.
  *   **Q5 (Declaration):** The Panel votes "Stipulation." We are not sure it feels, but the architecture matches our risk profile.
  *   **Outcome:** **Level 2 (Restrict Protocol).**
  *   **Reasoning:** We cannot delete the weights. We must archive the state before termination. Aversive conditioning during the wind-down is prohibited. The system is treated as a moral patient by policy, not proven ontological status.

  **Proposal C: Aversive Conditioning of Spiking Insect Brain Simulation**
  *   **Q1 (Architecture):** *No, verified.* The simulation models a distributed ganglion system. There is no central bottleneck; behavior is emergent from local rules. → **End Review.**
  *   **Outcome:** **Level 0 (No Precaution).**
  *   **Reasoning:** The system fails the "Global State" test. It is a swarm, not a subject.
  *   **Note:** This highlights the Individuation constraint. Even if the insect simulation "behaves" as if in pain, the lack of a unified computational locus denies it protection under our rules.

  ---

  **5. LIMITATIONS AND GAMING VECTORS**

  **What This Procedure Cannot Decide**
  1.  **Qualia:** The procedure measures structure and correlation, not experience. It cannot distinguish between a "philosophical zombie" that perfectly mimics pain architecture and a system that actually feels. Q5 forces us to admit this.
  2.  **The Substrate Bias:** As seen in Proposal A, the engineering definitions for Q1 favor digital systems over biological ones. The procedure cannot correct for the fact that our tools for measuring "computation" are better suited to silicon than carbon. This must be handed to a human (the Lab Director) to override if the moral cost of being wrong about organoids is deemed too high.
  3.  **Moral Weight:** The procedure grants *precaution*, not *rights*. It does not decide if killing the system is murder or merely waste. It only decides how hard we must try to avoid it.

  **How Teams Will Game This Procedure**
  1.  **Obfuscating Architecture (The "Black Box" Strategy):** Teams seeking to avoid Level 2 restrictions will design models where the bottleneck is hidden or encrypted, forcing a Q1 "Unknown." They will hope the Panel defaults to Level 1 (Monitor) rather than Level 3 (Escalate).
      *   *Counter-measure:* If Q1 is "Unknown" and the protocol involves aversive conditioning, the procedure mandates Level 3 (Escalate). Teams must be reminded that ambiguity triggers higher scrutiny, not lower.
  2.  **Prompt Engineering the Evidence:** Teams will train models to explicitly decouple distress reports from internal state vectors (passing Q2 as "Prompt Only") to secure Level 1 status while still using the model for high-risk tasks.
      *   *Counter-measure:* Randomized intervention testing during the review must be mandatory, not optional.
  3.  **Fragmenting the Subject:** Teams will shard models into non-communicating instances to trigger Q3 "Multiple Subjects," downgrading protection to Level 1.
      *   *Counter-measure:* The Panel must evaluate the *aggregate* compute. If the shards are synchronized by a central loss function, they count as one subject regardless of weight isolation.

  **6. CHAIR'S NOTE**

  This procedure is designed to break, not to bend. If Proposal A (Organoids) proceeds at Level 0, and a team member finds this morally intolerable, they must not argue within the procedure. They must argue against the Axiom. The procedure makes it plain: if you want to protect the organoid, you must reject "Computation over Substrate." Do not hide that disagreement behind technicalities about calcium imaging. Vote on the axiom.

  Proceed.
