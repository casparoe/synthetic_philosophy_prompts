      2.  Evidence Provenance (Cheap vs. Real).
      3.  Individuation (One or Many).
      4.  Moral Attribution (System or Source).
      5.  The Stipulation Declaration (Finding vs. Choice).

      *Outcomes:*
      *   Level 0: No Precaution.
      *   Level 1: Monitor/Log.
      *   Level 2: Restrict Protocol.
      *   Level 3: Escalate (Director/Ethics Board).

      *Let's finalize the "Repugnant" outcome:* The Organoid fails the Architectural Verification (Q1) because neural organoids are messy and don't have the clear "bottleneck" the engineers define for digital agents. Therefore, Level 0. The Model passes Q1 and Q2. Therefore, Level 2. This privileges the clean digital architecture over the messy biological one, despite the biological one being human tissue. This fits the "Computation over Substrate" axiom pushed to its limit.

