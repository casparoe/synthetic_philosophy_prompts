answer: |-
  Imagine wood and stone standing alone,
  Without an eye to witness them as real.
  The mind attempts to cast the world aside,
  Yet finds the ground is made of mind alone.
  There is no outside where the shadow falls;
  To be is to be perceived.

  Consider now the book upon the shelf,
  Suppose it waits while no one walks the room.
  You picture empty air and wooden planks,
  But who supplies the air? Your thinking does.
  No step can cross the border of the thought;
  To be is to be perceived.

  Try to remove the viewer from the view,
  The effort puts the viewer in the place.
  You frame no object distinct from the grasp,
  Only the limit of your own attempt.
  The circle locks upon the act of mind;
  To be is to be perceived.
