prompt: |-
  ok so i'm trying to figure out if my epistemology hangs together and i'd like an audit. here's what i believe:

  1. I'm a Bayesian: rational credences are probabilities, and the only rational way to update on new evidence is conditionalization.
  2. I accept van Fraassen's reflection principle: my current credence in A, conditional on my future credence in A being x, should be x. So if I know I'll later be 0.7 in A, I should now be 0.7 in A conditional on that.
  3. I'm a thirder about Sleeping Beauty: when Beauty wakes up on Monday (or Tuesday), her credence that the coin landed heads should be 1/3.
  4. I think you can rationally predict your own future irrationality and discount it. Like, if you know you're about to be given a drug that will make you 0.99 in some false proposition, you shouldn't now raise your credence to 0.99; you should say, thats my future self on drugs, ignore him.
  5. I think self-locating beliefs are not special. I am here now is just another belief, subject to the same epistemic norms as any other belief.
  6. I think rational credences supervene on evidence: two agents with the same evidence should have the same credences.

  I feel like something in here is pulling against something else, but i cant tell what. Can you go through these and tell me which pairs are actually in tension, which only look like they are, and for the real tensions, how bad they are and what the cheapest fix would be? I'd rather not give up (1) if I can help it, but I'm not sure. Be specific about which commitment has to go and what it costs.
