          *   Sunday Beauty knows Monday Beauty will be 1/3. Reflection says Sunday Beauty should be 1/3. But coin is fair.
          *   Fix: Reject Reflection for cases of information loss/indexical shift.
      *   **Evidentialism (6):**
          *   This is mostly compatible if you define evidence to include self-locating info. But if (5) says self-locating isn't special, does it count as evidence distinct from the Sunday evidence?
      *   **Recommendations:**
          *   Keep (1) if possible (User preference).
