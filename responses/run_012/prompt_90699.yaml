answer: |-
  ### Desiderata for a Theory of Phenomenal Combination

  The following requirements specify the standards of adequacy for any theory positing that macro-level experience is constituted by micro-level entities (whether experiences or categorical bases).

  **1. Subject Unicity**
  *   **Statement:** The theory must account for the existence of a single, unified subject of experience at the macro-level, distinct from a mere collection or society of micro-subjects. The macro-subject must not be reducible to a plurality of simultaneous micro-subjects.
  *   **Motivation:** Phenomenological introspection presents experience as owned by a single "I," not a committee. If combination yields only an aggregate, the target phenomenon (macro-subjectivity) has not been explained.
  *   **Verdict:** Non-negotiable.
  *   **Case A (Partial Overlap):** The theory must declare whether the overlapping region constitutes one subject, two, or a fractional subject. It cannot allow two distinct macro-subjects to share the exact same micro-constituents simultaneously without violating the distinctness of subjects.
  *   **Case B (Fusion/Split):** The theory must identify the point at which two subjects become one and when one becomes two. It must ensure that during the fused phase, there is strictly one subject, not two co-located subjects.

  **2. Phenomenal Blending**
  *   **Statement:** The theory must explain how micro-level qualities (e.g., simple qualia) yield complex, seamless macro-level qualities (e.g., a visual field) without residual "seams" or a loss of determinacy.
  *   **Motivation:** Macro-experience is not a mosaic of tiny points but a continuous field. A theory that yields a "grainy" sum fails to match the datum of seamless perception.
  *   **Verdict:** Non-negotiable.
  *   **Case A (Partial Overlap):** The overlapping micro-experiences must contribute coherently to both macro-fields. If a micro-quality is red, it cannot be red for Subject 1 and blue for Subject 2 without a mechanism for perspective-relative indexing.
  *   **Case B (Fusion/Split):** Upon fusion, the distinct qualities of the progenitor subjects must blend into a new unified quality. Upon splitting, the theory must explain how differentiated qualities re-emerge from the unified field without information loss.

  **3. Explanatory Continuity**
  *   **Statement:** The transition from micro-constituents to macro-subject must not involve brute emergence. The properties of the whole must be intelligibly grounded in the properties and relations of the parts.
  *   **Motivation:** The primary motivation for positing micro-experience is to close the explanatory gap between physical structure and consciousness. Reintroducing a gap at the combination stage defeats the position's purpose.
  *   **Verdict:** Non-negotiable.
  *   **Case A (Partial Overlap):** The relation holding between overlapping parts must be the same kind of relation holding between non-overlapping parts. If combination requires a special "bond," that bond must be present in the overlap without creating a third, unexplained subject.
  *   **Case B (Fusion/Split):** The process of fusing and splitting must be continuous. There cannot be a magical threshold where combination suddenly "clicks" on or off without a gradual change in the underlying relations.

  **4. Boundary Non-Arbitrariness**
  *   **Statement:** The theory must provide a principled criterion for which collections of micro-entities compose a subject, avoiding the postulation of subjects corresponding to every arbitrary set of parts.
  *   **Motivation:** Without constraints, any collection of atoms (e.g., a rock plus a neuron) would constitute a subject, leading to an absurd proliferation of consciousness (the "boundary problem").
  *   **Verdict:** Non-negotiable.
  *   **Case A (Partial Overlap):** The theory must explain why the overlapping system hosts *these* two subjects and not a third subject composed of the non-overlapping parts of Subject 1 plus the overlapping parts.
  *   **Case B (Fusion/Split):** The theory must specify why the fused state counts as one subject rather than two tightly coupled subjects, and why the split state counts as two rather than one damaged subject.

  **5. Empirical Adequacy**
  *   **Statement:** The theory must be consistent with empirical data regarding unity, including split-brain phenomena, dissociation, and graded levels of integration.
  *   **Motivation:** A metaphysical theory of mind that contradicts clinical neuroscience is untenable. Unity is not always absolute; it can fail or be partial.
  *   **Verdict:** Non-negotiable.
  *   **Case A (Partial Overlap):** The theory must accommodate the possibility that a single physical system can support disunified streams (as in split-brain cases) without forcing a unity that isn't there.
  *   **Case B (Fusion/Split):** The theory must allow for the possibility that fusion is never total (graded unity) or that splitting is a process rather than an event, matching the temporal dynamics of neural integration.

  **6. Causal Relevance**
  *   **Statement:** The macro-subject and its experiences must play a causal role in the physical world, or the theory must provide a robust argument for why this is unnecessary.
  *   **Motivation:** If macro-experience is causally inert, it is an epiphenomenal ghost, rendering the theory explanatorily weak regarding behavior and evolution.
  *   **Verdict:** Preference (some camps accept epiphenomenalism, but it is a cost).
  *   **Case A (Partial Overlap):** If two subjects overlap, their causal powers must not overdetermine the physical effects of the shared micro-constituents.
  *   **Case B (Fusion/Split):** The causal powers of the fused subject must equal or exceed the sum of the progenitors; upon splitting, causal efficacy must distribute without remainder.

  ***

  ### The Incompatible Pair: Subject Unicity vs. Explanatory Continuity

  There is a fundamental tension between **Subject Unicity** and **Explanatory Continuity** given the starting assumption that micro-level entities possess experience (or the categorical bases of experience).

  **The Tension:**
  To satisfy **Subject Unicity**, the macro-subject must be *one* thing, not *many*. If the micro-entities are themselves subjects (or subject-bases that inherently imply subjecthood), then for a macro-subject to exist as a *single* entity, the micro-subjects must either cease to exist as distinct subjects or be subsumed in a way that destroys their individual subjecthood.
  However, to satisfy **Explanatory Continuity**, the macro-subject must be nothing "over and above" the micro-constituents and their relations. If the micro-subjects cease to exist or are fundamentally altered to create the macro-subject, this looks like destruction and creation—i.e., brute emergence. If the micro-subjects *persist* unchanged to ensure continuity, then there are still *many* subjects, violating Unicity.

  **Why they cannot be jointly satisfied:**
  1.  **If micro-entities persist:** You have many subjects. To get *one* subject (Unicity), you must posit a new entity (the macro-subject). This new entity is not identical to the many (since the many are many). Therefore, the one is something *new*. This violates Explanatory Continuity (No Brute Emergence).
  2.  **If micro-entities do not persist:** You have one subject. But the constituents that existed previously are gone. The macro-subject is not constituted by the micro-subjects, but replaces them. This is brute emergence, violating Explanatory Continuity.
  3.  **If micro-entities are merely bases (Panprotopsychism):** This dissolves the tension but violates the spirit of the "micro-experience" assumption in the strong sense. If they are only bases, there are no micro-subjects to combine. But if they are experiences, the tension holds.

  Consequently, a theory must sacrifice either the strict unity of the macro-subject (admitting it is really a society of micro-subjects) or the strict continuity of constitution (admitting some form of emergence).

  ***

  ### The Most Exclusionary Requirement

  **Explanatory Continuity** does the most work to exclude candidate theories.

  Most intuitive models of combination rely on some form of aggregation or structural arrangement that yields a new level of function. However, in the phenomenal realm, structural arrangement does not obviously yield subjective unity. Demanding that the unity be *intelligibly grounded* without a gap rules out any theory that treats combination as a simple sum, a structural threshold, or a brute fact. It forces the theory to posit a specific metaphysical "glue" (bonding) or a radical reconception of the parts (cosmopsychism), both of which carry heavy theoretical costs. Straightforward physicalism and standard emergentism fail this immediately.

  ***

  ### Assessment of Candidate Theories

  **1. Constitutive Phenomenal Bonding**
  *   **Performance:** Fails **Explanatory Continuity**.
  *   **Analysis:** This theory posits a fundamental relation that "binds" experiences. While it attempts to secure **Subject Unicity**, the bonding relation itself is typically brute. It does not explain *how* the binding creates unity, only *that* it does. In **Case B (Fusion/Split)**, it struggles to explain how the bond forms and breaks without invoking a new emergent event. It satisfies **Boundary Non-Arbitrariness** by tying boundaries to the bond, but at the cost of introducing a mysterious fundamental force.

  **2. Panprotopsychism / Categorical Base Monism**
  *   **Performance:** Passes **Explanatory Continuity**, sidesteps **Subject Unicity**.
  *   **Analysis:** By denying that micro-entities are full subjects (they are only bases), this view avoids the Subject Summing Problem. Combination is the arrangement of bases into a structure that supports macro-subjectivity. However, it risks violating the prompt's strong assumption of micro-experience. In **Case A (Overlap)**, it handles shared bases well (the same base can contribute to different structures), but it struggles with **Phenomenal Blending**, as it must explain how non-phenomenal bases yield phenomenal qualities without a gap.

  **3. Cosmopsychism (Decomposition Strategy)**
  *   **Performance:** Passes **Subject Unicity**, Fails **Boundary Non-Arbitrariness**.
  *   **Analysis:** This view posits one universal subject that fragments into local subjects. It secures **Explanatory Continuity** (the whole is fundamental) and **Subject Unicity** (at the fundamental level). However, it fails **Boundary Non-Arbitrariness**: explaining why the universal subject decomposes into *these* specific human-sized subjects rather than others is difficult. In **Case B (Fusion/Split)**, it treats fusion as a re-integration and split as fragmentation, which fits the dynamics, but it struggles with **Empirical Adequacy** regarding the independence of split streams (e.g., split-brain patients seem to have two distinct centers of agency, not just one obscured center).

  **4. Straightforward Emergence**
  *   **Performance:** Fails **Explanatory Continuity**.
  *   **Analysis:** This theory asserts that when micro-entities reach a certain complexity, a macro-subject simply appears. It satisfies **Subject Unicity** and **Empirical Adequacy** easily. However, it explicitly violates **Explanatory Continuity** by definition. It treats the macro-subject as a new existent not grounded in the nature of the parts. In **Case A (Overlap)**, it would likely posit two emergent subjects, but offers no account of the shared ontology other than physical overlap, leaving the phenomenal overlap unexplained.

  **Conclusion:**
  No theory satisfies all desiderata. **Constitutive Bonding** fails continuity; **Panprotopsychism** risks the gap at the macro-level; **Cosmopsychism** fails delimitation; **Emergence** fails continuity. The tension between **Subject Unicity** and **Explanatory Continuity** suggests that the concept of "combination" may be incoherent when applied to subjects rather than objects. A viable theory may need to reject the notion that macro-subjects are *composed* of micro-subjects in any mereological sense.
