          4.  Is there SDT analysis? (Rules out Response Criterion).
          5.  Are there low-level signatures (adaptation/contrast)? (Supports Genuine).
      *   *Refining for Time:* Needs to be faster. Let's group by exclusion.
      *   *Decision Logic:* If it fails Q1 -> Selection. If it fails Q2 -> Diachronic. If it fails Q3/4 -> Response/Memory. If it passes all -> Genuine (but rare).
      *   *Defaults:* If evidence is missing, default to the "boring" explanation (Response/Selection) to protect the literature from false positives.

  4.  **Rank Evidential Weight:**
      *   *High Weight:* Signal Detection (d' vs c), Task-Independent measures (physiological/implicit), Low-level scaling (contrast/adaptation).
      *   *Medium Weight:* Fixed proximal stimulus control, Transient vs. History.
      *   *Low Weight/Misleading:* Persistence when known (demand characteristics are messy), Ambiguous stimuli (no ground truth).
