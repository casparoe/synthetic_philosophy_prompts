          *   Rank specific evidential tests by weight and identify pitfalls.
          *   Run the procedure on 3 specific cases (Hunger/Size, Wine/Price, Expert/Board).
          *   At least one verdict authors will hate.
          *   At least one verdict must challenge the editor's prior (Editor thinks Wine is response effect; needs to check if wrong).
          *   Finish with limitations and explicitly state theory-laden judgments (no name-dropping theories without content).
      *   **Tone:** Professional, decisive, methodological, concise.

  2.  **Deconstruct the 5 Bins:**
      1.  *Genuine Online Effect:* Cognitive state alters early sensory processing/content.
      2.  *Selection Effect:* Attention/Gaze changes input, not processing.
      3.  *Diachronic Effect:* Learning/Expertise (long-term), not transient state.
      4.  *Response-Level:* Perception unchanged, decision criterion shifts (SDT).
      5.  *Memory/Encoding:* Post-perceptual storage/reconstruction.

  3.  **Develop the Screening Procedure (The "One Page"):**
      *   Need an ordered list of questions.
      *   Need stopping rules.
