answer: |-
  # SCREENING PROTOCOL: COGNITIVE PENETRATION CLAIMS
  **Time Limit:** 40 Minutes | **Decision:** Recommendation Only | **Default:** Skepticism

  ### THE FIVE BINS
  1.  **Genuine Online:** Cognitive state alters early sensory content.
  2.  **Selection:** Attention/gaze changes input, not processing.
  3.  **Diachronic:** Long-term learning/expertise, not transient state.
  4.  **Response-Level:** Perception unchanged; decision criterion shifts.
  5.  **Memory/Encoding:** Effect on storage or reconstruction, not input.

  ### THE PROCEDURE (Ordered Stop-Rules)
  *Answer from Manuscript (MS). If missing, query Authors. If still missing, apply Default.*

  **Q1. Is the proximal stimulus physically identical across conditions?**
  *   **Sufficient Answer:** Yes, stimulus energy (pixels, sound waves, chemical concentration) is held constant; only the cognitive state varies.
  *   **Stop Rule:** If **No** (e.g., participants look longer or at different features), place in **Bin 2 (Selection)**.
  *   **Default:** If MS reports only "viewing time" or eye-tracking without fixed exposure, default to **Bin 2**.

  **Q2. Is the cognitive state transient (within-session) or historical (training)?**
  *   **Sufficient Answer:** State is manipulated now (hunger, mood, prime) vs. acquired over years (expertise).
  *   **Stop Rule:** If **Historical** (e.g., chess masters, radiologists), place in **Bin 3 (Diachronic)**. This is learning, not penetration.
  *   **Default:** If authors conflate expertise with current belief, default to **Bin 3**.

  **Q3. Is the measure task-independent or implicit?**
  *   **Sufficient Answer:** Measure does not require a judgment about the manipulated variable (e.g., motor reaching, pupillometry, forced-choice discrimination).
  *   **Stop Rule:** If **No** (e.g., verbal rating, Likert scale, size estimation), place in **Bin 4 (Response-Level)**.
  *   **Default:** If MS relies on self-report, default to **Bin 4**.

  **Q4. Does analysis separate sensitivity from criterion?**
  *   **Sufficient Answer:** Signal Detection (d' vs. c) or equivalent shows change in sensitivity (d'), not just bias (c).
  *   **Stop Rule:** If **No** (only accuracy or mean ratings reported), place in **Bin 4 (Response-Level)**.
  *   **Default:** If SDT is absent, default to **Bin 4**.

  **Q5. Are there low-level sensory signatures?**
  *   **Sufficient Answer:** Effect scales with contrast/intensity, shows adaptation/aftereffects, or survives dual-task load.
  *   **Stop Rule:** If **Yes**, place in **Bin 1 (Genuine Online)**.
  *   **Default:** If absent, place in **Bin 5 (Memory)** or retain **Bin 4**.

  **HANDOFF POINT:** If Q1–Q5 are satisfied but the definition of "perception" vs. "judgment" remains contested, stop. This is a theoretical boundary, not an evidential one. Return to Action Editor with a note: *Evidence supports Bin 1, but ontological classification requires theoretical adjudication beyond methods review.*

  ---

  ### EVIDENTIAL WEIGHT RANKING
  *(Highest to Lowest)*

  1.  **Signal-Detection Analysis (Sensitivity vs. Criterion):**
      *   *Weight:* Highest.
      *   *Content:* Assumes perceptual sensitivity and decision bias are mathematically separable.
      *   *Misleads:* If the "noise" distribution is not stable, d' changes may reflect variance, not sensitivity.
  2.  **Task-Independent Measure (Implicit/Physiological):**
      *   *Weight:* High.
      *   *Content:* Assumes motor or physiological outputs bypass conscious reporting criteria.
      *   *Misleads:* Motor planning can be influenced by belief independently of vision (e.g., wanting to grab food).
  3.  **Fixed Proximal Stimulus:**
      *   *Weight:* Medium.
      *   *Content:* Assumes input energy defines the perceptual baseline.
      *   *Misleads:* Cannot be run on ambiguous stimuli where "fixed" is undefined; fails to rule out internal noise.
  4.  **Transient State vs. Long History:**
      *   *Weight:* Medium.
      *   *Content:* Assumes plasticity over years is a different mechanism than top-down modulation now.
      *   *Misleads:* Transient primes can induce micro-learning; history can prime transient states.
  5.  **Low-Level Signatures (Adaptation/Contrast):**
      *   *Weight:* Medium-High (but rare).
      *   *Content:* Assumes early visual cortex exhibits specific adaptation properties.
      *   *Misleads:* High-level concepts can also show adaptation (semantic satiation).
  6.  **Persistence When Debriefed:**
      *   *Weight:* Low.
      *   *Content:* Assumes demand characteristics vanish when participants know the hypothesis.
      *   *Misleads:* Participants may persist due to stubbornness or genuine inability to correct, not perceptual immutability.

  ---

  ### WORKED CASES

  **Case 1: Hunger makes food look larger and brighter.**
  *   **Verdict:** **Bin 4 (Response-Level).**
  *   **Reason:** Manuscript relies on verbal size estimation and brightness ratings without Signal Detection analysis or fixed-exposure controls; desire likely shifts the criterion for "large," not the visual content.
  *   **Note:** Authors will hate this; it reduces a "phenomenological claim" to a "reporting bias."

  **Case 2: Wine tastes more intense when labeled expensive.**
  *   **Verdict:** **Bin 1 (Genuine Online).**
  *   **Reason:** Manuscript utilizes a triangle-test discrimination task (sensitivity) rather than intensity ratings, showing d' improves with price labels, which forces placement out of Bin 4 under Q4.
  *   **Note:** **Cuts against Editor Prior.** You suspected Response (Bin 4). However, if the data shows sensitivity (d') changes in a blind discrimination task, the procedure mandates Bin 1. Your prior holds only for rating scales, not discrimination.

  **Case 3: Expert players literally see a board differently.**
  *   **Verdict:** **Bin 3 (Diachronic).**
  *   **Reason:** The "belief" is actually pattern recognition acquired over 10,000 hours; this is long-term structural learning, not a transient cognitive state penetrating early vision.
  *   **Note:** Authors frame this as "belief-driven," but the procedure classifies expertise as learning (Bin 3), stripping the claim of its "penetration" novelty.

  ---

  ### LIMITATIONS & THEORY-LADEN JUDGMENTS

  **What This Procedure Cannot Do:**
  1.  **Define Perception:** It cannot ontologically distinguish "seeing" from "judging." It assumes they are separable (Q4).
  2.  **Resolve Ambiguity:** It fails where the stimulus has no fixed proximal state (e.g., bistable figures), as Q1 cannot be satisfied.
  3.  **Guarantee Truth:** It sorts by methodological rigor, not ground truth. A rigorous study can still be wrong.

  **Explicit Theory-Laden Steps:**
  *   **Q2 (Transient vs. Historical):** Invokes the position that *mechanisms of long-term plasticity are distinct from mechanisms of transient top-down modulation.* If learning *is* the mechanism of penetration, Bin 3 is a false negative.
  *   **Q4 (SDT):** Invokes the position that *perceptual sensitivity and decision criterion are architecturally distinct.* If cognition alters the noise distribution itself, SDT misclassifies the effect.
  *   **Default to Bin 4:** Invokes the position that *the null hypothesis for subjective report is response bias.* This privileges a conservative architecture where perception is encapsulated unless proven otherwise.

  **Action:** Run the protocol. If the manuscript hits a Handoff Point, do not decide. Flag for Action Editor as a theoretical dispute, not a methodological failure.
