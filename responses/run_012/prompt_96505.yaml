answer: |-
  You have identified a precise and fascinating mechanism in translation theory, one that sits at the intersection of formalism, sociology, and reception history. You are correct that while the *neighbourhood* of this phenomenon is well-mapped (norms, compensation, intertextuality), there is no single, settled term that captures the specific triad you describe: **(1) Formal Constraint $\rightarrow$ (2) Convergent Compensation $\rightarrow$ (3) Ontological Hardening.**

  In the literature of Descriptive Translation Studies (DTS), this is often treated as a subset of **norm formation**, but that term is too broad. In game theory, it is a **Schelling Point** (a focal point that people tend to choose by default in the absence of communication), but that explains the convergence, not the hardening. In economics, it is **Path Dependence** (history locks in a suboptimal solution), but that lacks the semantic dimension.

  Since there is no established label, I will propose a term that carves out the phenomenon sharply, then define its boundaries and distinctions as you requested.

  ### Proposed Term: **Translational Lock-In**
  *(Alternatively: **Sedimented Compensation**)*

  I recommend **Translational Lock-In**. It borrows from technology and economics (e.g., the QWERTY keyboard), where a specific solution becomes standard not because it is inherently superior, but because early adoption creates switching costs for later actors. In your context, the "switching cost" is the risk of breaking a formal pattern that the target audience now expects.

  ### The Carving: Definition and Boundaries

  **Definition:**
  **Translational Lock-In** occurs when a formal or systemic constraint in the target language forces early translators to make an identical semantic compromise (compensation). Subsequent translators, encountering this established solution, adopt it not because it is the best semantic fit, but because it has become the *normative solution to the formal problem*. Over time, the compromise loses its status as a translation artifact and is misread as a feature of the source text.

  **1. The Mechanism (The Loop)**
  *   **Phase 1 (Constraint):** The source text has a feature (e.g., rhyme A-B-B-A) that cannot be mapped 1:1 into the target language without semantic loss.
  *   **Phase 2 (Convergence):** Independent translators solve this by substituting Image X for Image Y to satisfy the constraint. Because the constraint is rigid (e.g., only one flower rhymes with "hour"), they converge on the same substitution.
  *   **Phase 3 (Hardening):** The substitution appears in enough influential versions that it becomes the "standard reading." Later translators inherit the *translation* of the image, not just the *problem* of the rhyme.

  **2. Scope: Where does it apply?**
  *   **High-Constraint Poetry:** The primary domain (e.g., Marot, Dante's *terza rima*, Persian *ghazals*). The tighter the form, the stronger the lock-in.
  *   **Song Lyrics & Libretto:** High lock-in potential due to the dual constraint of rhyme and musical stress. (e.g., specific vowel sounds required for high notes).
  *   **Subtitling & Localization:** Yes, but the "hardening" is different. In subtitling, character-count constraints often lead to standardized abbreviations or omissions (e.g., specific ways to shorten "Doctor" or "Street"). However, because subtitles are ephemeral, the *ontological hardening* (the audience thinking it was in the original) is rarer. It happens more in **video game localization**, where specific terms become canonical across sequels (e.g., a specific item name chosen for UI space that becomes the "true" name of the object).
  *   **Constrained Prose:** Less common, but occurs in lipograms or Oulipian texts where the constraint forces specific lexical choices that later translators replicate.

  **3. Distinctions: What it is NOT**

  *   **vs. Ordinary Compensation:**
      *   *Compensation* is the act of making up for a loss (e.g., moving a pun from line 3 to line 10).
      *   *Lock-In* requires the **social sedimentation** of that compensation. If only one translator does it, it's compensation. If five do it, and the sixth assumes it's original, it's Lock-In.
  *   **vs. Translation Error:**
      *   An *Error* is unintentional (mistranslation, ignorance).
      *   *Lock-In* begins as a **strategic, intentional choice** to preserve form. It is a "knowing lie" that becomes truth.
  *   **vs. Influential Translation (The "Pope Effect"):**
      *   Sometimes one translation dominates (e.g., Pope's Homer, the King James Bible). Later translators copy it because it is authoritative.
      *   *Lock-In* can happen even without one dominant version. It happens when **multiple independent versions** arrive at the same deviation because the *constraint* dictates it, not because they are copying a master translator.
  *   **vs. Translation Universal:**
      *   Universals (like explicitation or simplification) are tendencies across *all* translation.
      *   *Lock-In* is specific to **recurrent problems in specific texts**. It is text-local, not language-universal.

  ### Edge Cases and Nuance

  **1. The "Ghost Source" Effect**
  The most dangerous edge case of Translational Lock-In is when scholars analyze the *source* author's style based on the locked-in translation. If every English version of Marot mentions a "flower" instead of a "bird," a critic might write a paper on Marot's floral imagery, unknowingly analyzing the translators' constraint, not Marot's intent. This is where Lock-In becomes **epistemological contamination**.

  **2. The "Breakout" Translator**
  A key test for Lock-In is the translator who refuses it. In Hofstadter's *Le Ton beau de Marot*, some translators abandon the rhyme scheme entirely to save the "bird." The existence of these "breakout" versions highlights the Lock-In of the others. If a translator keeps the "flower" but admits in a footnote, "Marot said bird, but I needed a rhyme," they have acknowledged the Lock-In without perpetuating the hardening.

  **3. Digital Acceleration**
  In the pre-digital age, Lock-In took decades (editions, anthologies). Today, with online corpora and translation memory, Lock-In can happen almost instantly. If the first three Google Translate iterations or the first crowd-sourced wiki translation choose the "flower," the fourth translator sees it as a precedent. This suggests **Translational Lock-In** is accelerating in the digital age.

  ### Theoretical Lineage (For your Seminar)

  If you need to ground this in existing theory for your paper, you should cite:

  1.  **Gideon Toury (Descriptive Translation Studies):** Discuss this as the formation of a **Translational Norm**. Toury argues that translations follow norms that become established over time. Lock-In is the moment a "preliminary norm" (how to handle this poem) becomes an "operational norm" (this word *is* the poem).
  2.  **Andrew Chesterman (Memes of Translation):** The specific solution (Bird $\rightarrow$ Flower) acts as a **meme**. It replicates because it is "fit" for the environment (the rhyme scheme), not because it is "true" to the source.
  3.  **Thomas Schelling (Game Theory):** Use the concept of the **Focal Point**. Translators are playing a coordination game with each other across time. They choose the flower because they anticipate that *other* translators (and readers) expect the flower.
  4.  **Douglas Hofstadter:** Specifically the concept of the **"Cluster."** Hofstadter shows how translations cluster around certain "isomorphisms." Lock-In is when one cluster becomes so dense it obscures the source.

  ### Summary for your Seminar

  You can introduce the concept as **Translational Lock-In**: *The process by which a constraint-driven compromise in early translations achieves normative status, eventually obscuring its own artificiality and masquerading as source-text authority.*

  It distinguishes itself from simple compensation by its **social recursion** (later translators copy earlier solutions) and from simple error by its **formal motivation** (it solves a structural problem). It is the moment the map not only replaces the territory but rewrites the geography of the territory in the minds of those who read the map.
