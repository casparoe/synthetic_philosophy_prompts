prompt: |-
  I run research for a small human rights NGO, and next month our board votes on whether we adopt a written standard for when we'll call something a genocide. I'm the one arguing for it, and for a deliberately wide version: not just the legal definition, but two extra triggers -- deliberate destruction by deprivation (starving a group, cutting off medicine and water) and cultural destruction (language, shrines, archives, cemeteries). My pitch is basically that waiting for a court to say the word means the word arrives years after it could have done anything, and that an org which only uses the term when a prosecutor would is outsourcing its moral vocabulary to institutions built not to use it.

  The board is six people and I know roughly how each of them will come at me: a former ICC defence-side lawyer; the chair, who's family is from a region where this word is fought over and who is allergic to anything that looks like diluting it; a comms director who thinks the word is a fundraising grenade; our field director for the country we'd first apply it to, who has local staff and access to think about; a historian of mass violence who knows the Lemkin-era debates better than I do; and the treasurer, who mainly wants to know what this costs us.

  Give me the Q&A prep sheet -- the objections I'll actually get in that room, not the ones I'd get at a law faculty seminar -- ordered by how much damage they'd do, each phrased the way that member would phrase it, with a two-minute reply and a note on where the reply is soft. Tell me what to concede in the first minute and what to hold. And include the one question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Researcher for a small human rights NGO.
      *   **Task:** Preparing for a board vote on adopting a written standard for using the term "genocide."
      *   **User's Position:** Arguing *for* a standard, specifically a *wide* one (Legal + Deprivation + Cultural Destruction).
      *   **User's Rationale:** Legal processes are too slow; NGOs shouldn't outsource moral vocabulary to legal institutions.
      *   **Audience (Board):** 6 specific members with distinct biases/concerns (ICC Lawyer, Chair [personal connection], Comms Director, Field Director, Historian, Treasurer).
      *   **Goal:** A Q&A prep sheet ordered by potential damage, phrased realistically, with replies, vulnerabilities, concessions, and the "dreaded question."

  2.  **Analyze the Board Members & Potential Objections:**
      *   *ICC Lawyer:* Will focus on legal precision, credibility, and the risk of "cry wolf."
      *   *Chair (Personal Connection):* Will worry about trivializing the suffering of their own people/region. High emotional weight.
      *   *Comms Director:* Will worry about donor fatigue, backlash, or the term becoming meaningless noise.
      *   *Field Director:* Will worry about staff safety, access, and retaliation on the ground.
      *   *Historian:* Will worry about historical accuracy, Lemkin's original intent vs. legal codification, and precedent.
      *   *Treasurer:* Will worry about funding loss, legal costs, or operational costs.

  3.  **Determine "Damage Potential":**
      *   *Highest Damage:* The Chair (emotional veto power) and the Field Director (operational veto power). If the Chair feels the term is disrespected, they leave. If the Field Director says staff will be killed/expelled, the policy is dead.
      *   *Medium Damage:* The ICC Lawyer (credibility attack) and the Historian (intellectual undermining).
      *   *Lower Damage:* Comms (manageable narrative) and Treasurer (usually follows the lead of others unless costs are astronomical).
      *   *Re-ordering for the Prompt:* The prompt asks to order by "how much damage they'd do." I need to prioritize the objections that kill the vote.
      *   *Refined Order:*
          1.  Field Director (Safety/Access - Immediate practical kill switch).
          2.  Chair (Legitimacy/Personal - Emotional kill switch).
          3.  ICC Lawyer (Credibility - Reputational kill switch).
          4.  Historian (Accuracy - Intellectual kill switch).
          5.  Comms (Impact - Strategic concern).
          6.  Treasurer (Cost - Administrative concern).

      *Wait, looking closer at the User's specific proposal:* The user wants to *expand* the definition. This makes the Chair (dilution concern) and the Lawyer (legal precision) the biggest threats to the *specific wording*, while the Field Director is the biggest threat to *any* usage.
      *Let's prioritize based on the specific argument (Wide Definition).*
      1.  **Chair:** "Diluting the word." (Directly attacks the core expansion).
      2.  **ICC Lawyer:** "Legal credibility." (Attacks the methodology).
      3.  **Field Director:** "Safety." (Attacks the consequence).
      4.  **Historian:** "Historical accuracy." (Attacks the precedent).
      5.  **Comms:** "Fundraising grenade." (Attacks the utility).
      6.  **Treasurer:** "Cost." (Attacks the feasibility).

  4.  **Drafting the Content - Section by Section:**

      *   **Concessions (First Minute):** Need to show flexibility to lower defenses. Acknowledge the legal definition is the baseline. Acknowledge safety is paramount.
      *   **Hold:** The core principle that NGOs have a moral duty independent of courts. The inclusion of deprivation (starvation) is usually the most defensible expansion.

      *   **Q&A Items (Drafting the voices):**
          *   *Chair:* Needs to sound personal, protective of the memory. "You're making it cheap."
          *   *Lawyer:* Needs to sound technical, worried about liability/reputation. "We aren't a court."
          *   *Field Director:* Needs to sound pragmatic, worried about bodies. "My team gets kicked out."
          *   *Historian:* Needs to sound academic but sharp. "Lemkin didn't mean this."
          *   *Comms:* Needs to sound cynical/practical. "Donors tune out."
          *   *Treasurer:* Needs to sound bottom-line. "Insurance? Lawsuits?"

      *   **Replies:** Need to be 2 minutes (spoken). Focus on the "Moral Vocabulary" argument the user likes.
      *   **Soft Spots:** Where is the reply weak? (e.g., admitting we aren't a court, admitting risk).

      *   **The Dreaded Question:** What is the one question that exposes the hypocrisy or the real risk? Usually: "If we use this label and we're wrong, who takes the fall?" or "Are we prepared to withdraw funding if our own donors are complicit?"
      *   *Better Dreaded Question:* "If we apply this standard to [Country X], will we apply it to [Donor Country Y]?" Or, "Does this standard apply to our own partners?"
      *   *Best Dreaded Question:* "If we call it genocide under this standard, what *specifically* do we do differently tomorrow than we do today?" (The Action Gap). If the answer is "nothing but a press release," the policy is performative.

  5.  **Refining and Polishing:**
      *   *Tone:* Professional, strategic, empathetic but firm.
      *   *Formatting:* Clear headings, bullet points for readability during a meeting.
      *   *Check against constraints:* Ordered by damage? Yes. Phrased as they would say it? Yes. 2-min reply? (Keep word count reasonable for 2 mins speaking). Soft spot noted? Yes. Concede/Hold section? Yes. Dreaded question? Yes.

      *(Self-Correction during drafting)*: Make sure I don't give legal advice. Frame it as organizational policy. Ensure the "Wide Version" argument is defended but also pragmatic. The Field Director is actually the biggest risk to operations, but the Chair is the biggest risk to the *vote*. I will put the Chair first because if they feel the word is diluted, they veto. The Field Director is second because safety is non-negotiable.

      *Wait, re-reading the prompt:* "Ordered by how much damage they'd do."
      If the Field Director says "My staff will die," the policy dies. That is maximum damage.
      If the Chair says "This insults my ancestors," the policy dies. That is maximum damage.
      If the Lawyer says "We will get sued/laughed at," the policy is risky.
      Let's group Chair and Field at the top. I'll put Chair #1 because the prompt highlights their allergy to dilution, which directly targets the *expanded definition*. Field is #2 because it targets *any* usage.

      *Let's refine the "Hold" vs "Concede".*
      Concede: We are not a court. We will not use the term lightly. Safety overrides labeling.
      Hold: Moral independence. Deprivation is a method of genocide even if courts haven't ruled yet.

      *Let's refine the "Dreaded Question".*
      "What happens if we call it genocide and the UN/Donors ignore us?" -> No, that's external.
      "Does this apply to Israel/Palestine/China/etc.?" -> Too specific.
      "If we adopt this, are we prepared to label a situation involving a major donor as genocide?" -> Strong.
      "What is the operational difference?" -> Strongest. It challenges the utility.

      *Let's go with:* "If we make this declaration, what concrete action follows that we aren't already doing? If the answer is just 'we say the word,' are we putting staff at risk for semantics?"

  6.  **Final Review:** Does this help the user win the vote while protecting the NGO? Yes. It balances idealism with operational reality.

      *(Final Polish on Voices)*:
      *   Chair: Emotional, protective.
      *   Field: Pragmatic, protective of staff.
      *   Lawyer: Precise, risk-averse.
      *   Historian: Contextual, pedantic.
      *   Comms: Cynical, audience-focused.
      *   Treasurer: Fiscal, liability-focused.

      *Let's write it.*
answer: |-
  # Board Vote Prep: "Genocide Determination Standard"
  **To:** Research Director
  **From:** Strategy Desk
  **Re:** Q&A Prep for Board Vote

  ### Strategic Posture: The First Minute
  **What to Concede Immediately:**
  1.  **We are not a court.** Acknowledge explicitly that this policy does not confer legal status, assign criminal liability, or trigger the Genocide Convention.
  2.  **Safety is the veto.** Agree that the Field Director has unilateral authority to halt any public designation if it endangers local staff or access.
  3.  **The Legal Definition is the Floor.** Confirm that the 1948 UN Convention definition is the *minimum* threshold, not something you are discarding.

  **What to Hold:**
  1.  **Moral Independence.** The NGO's duty is to victims, not to judicial efficiency. Waiting for a court verdict is a failure of early warning.
  2.  **Deprivation as Intent.** Hold firm on "destruction by deprivation" (starvation/siege). This is the most defensible expansion and bridges the gap between legal and moral definitions.
  3.  **Cultural Erasure.** Be willing to compromise on the *label* for cultural destruction (e.g., call it "cultural genocide" or "ethnocide" in the text) but keep it in the trigger matrix for internal assessment.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Chair (The "Dilution" Objection)
  **The Damage:** High. If they feel you are trivializing the suffering of their own kin, they will emotionally veto the vote. They hold the gavel.
  **The Question:** *"My family lived through this. When everyone uses the word for everything, it means nothing when the tanks actually roll in. Are you telling me that destroying a library is the same as emptying a village into a mass grave? Because that is what this standard implies."*

  **The Reply (2 mins):**
  "I hear you, and I agree that cheapening the word is a violence against the victims you represent. But right now, we have the opposite problem: we wait until the bodies are in the grave to use the word. By then, the world has tuned out.
  My proposal isn't to lower the bar for *killing*; it's to raise the alarm on *methods* that lead to killing. When a government cuts off water to a specific ethnic region, they are testing the world's reaction. If we wait for the mass graves to call it genocide, we have failed.
  This standard doesn't say a destroyed shrine equals a mass grave. It says that a coordinated attack on shrines, *combined* with deprivation, is a precursor we must name. We aren't diluting the word; we are using it as a shield before it becomes a tombstone. I want your help to ensure the language honors that gravity."

  **Soft Spot:** You are asking them to trust a *prediction* of violence over *evidence* of violence. If the prediction fails, the dilution they fear becomes real.

  #### 2. The Field Director (The "Safety" Objection)
  **The Damage:** Critical. If they say staff will be expelled or killed, the policy is operationally dead.
  **The Question:** *"I have forty national staff in the region you want to apply this to first. If we put this label out, the government expels us within 48 hours. Our clinics close. People stop getting medicine. Are you willing to trade actual aid for a label?"*

  **The Reply (2 mins):**
  "No. I am not willing to trade aid for a label. That is why the concession I made at the start stands: you have the veto. If using the word shuts down the clinics, we don't use the word publicly.
  But we need this standard internally. Even if we can't say 'genocide' in the press release, we need to know *we* classify it as such so we stop normalizing the escalation. We can document the deprivation and cultural destruction as 'crimes against humanity' publicly while holding the genocide determination in reserve. This policy gives us the internal clarity to know when we are witnessing the endgame, even if diplomatic language forces us to whisper it."

  **Soft Spot:** It creates a two-tier truth (internal vs. external). This can be demoralizing for staff and leak, causing confusion.

  #### 3. The ICC Lawyer (The "Credibility" Objection)
  **The Damage:** High. They can undermine your legal standing with donors and partners.
  **The Question:** *"We are an NGO, not a tribunal. If we start making determinations that contradict the UN or ICC, we look like amateurs. When we inevitably get it wrong, our credibility on torture or detention reports tanks. Why take the liability?"*

  **The Reply (2 mins):**
  "We aren't making a legal determination; we are making a moral one. We already make moral determinations every day when we call something 'torture' or 'apartheid' without a judge's gavel.
  The risk isn't in being wrong; the risk is in being silent. Prosecutors work backwards from evidence; humanitarians work forwards from risk. If we outsource our vocabulary to the ICC, we accept their timeline, which is measured in decades. We can maintain credibility by being transparent: we state clearly that this is an organizational risk assessment, not a legal indictment. Our credibility comes from accuracy of fact, not adherence to legal procedure."

  **Soft Spot:** Donors often *do* treat NGOs like quasi-legal bodies. If you are "wrong," they may pull funding regardless of your disclaimer.

  #### 4. The Historian (The "Lemkin" Objection)
  **The Damage:** Medium. They can intellectualize the opposition, making your proposal look naive.
  **The Question:** *"Lemkin fought hard to keep cultural destruction in the convention, and the UN stripped it out to get state signatures. By putting it back in unilaterally, aren't you ignoring the political reality of why the definition is narrow? You're fighting 1948 politics with 2024 idealism."*

  **The Reply (2 mins):**
  "You're right. The 1948 definition was a political compromise, not a moral absolute. States stripped out cultural destruction to protect their own assimilation policies.
  We aren't bound by the compromises of 1948. We are bound by the reality of 2024. We know now that destroying language and archives is often the precursor to physical destruction. Lemkin wanted that protection; the states denied it. As an NGO, we have the freedom to restore Lemkin's original intent where the UN lacked the will. We aren't ignoring political reality; we are refusing to be limited by it."

  **Soft Spot:** It admits you are overriding international consensus, which can look like hubris to moderate stakeholders.

  #### 5. The Comms Director (The "Fatigue" Objection)
  **The Damage:** Medium. They control the megaphone. If they think it won't land, they won't promote it.
  **The Question:** *"The word is already a grenade. If we use it wider, donors might think we're hysterical. If we use it narrower, we're complicit. How do you pitch this without sounding like we're just chasing headlines?"*

  **The Reply (2 mins):**
  "We pitch it as 'Early Warning,' not 'Labeling.' We don't say 'This is genocide' as a conclusion; we say 'We are seeing indicators of genocide.'
  We shift the narrative from 'Judge and Jury' to 'Fire Alarm.' A fire alarm isn't hysterical; it's a signal to act before the building burns. This standard allows us to say, 'The conditions for genocide are being met,' which is more accurate and less easy to dismiss as hyperbole. It makes our comms more precise, not more sensational."

  **Soft Spot:** "Conditions for genocide" is clunky language. It may not grab headlines, which defeats the Comms Director's goal of visibility.

  #### 6. The Treasurer (The "Cost" Objection)
  **The Damage:** Low/Medium. Usually follows the Chair's lead, but needs to hear liability is managed.
  **The Question:** *"Does this expose us to lawsuits? Defamation? Does it require more insurance? What is the line item cost?"*

  **The Reply (2 mins):**
  "There is no new line item for staffing. The research is already being done. The cost is reputational risk, which we mitigate through the Field Director's veto and the legal disclaimer that this is not a judicial finding.
  However, the cost of *not* doing this is donor drift. Major institutional donors are moving toward 'atrocity prevention.' If we are seen as lagging on identification, we risk losing grants to organizations that are more proactive. This policy aligns us with the cutting edge of donor priorities in prevention."

  **Soft Spot:** If your legal insurance premium goes up because of "higher risk" advocacy, that comes out of program budget. You need to verify this with counsel before the meeting.

  ---

  ### The Dreaded Question
  **Who asks it:** The ICC Lawyer or the Chair.
  **The Question:** *"If we adopt this standard, and next year our biggest government donor is complicit in a situation that meets your criteria... do we call it genocide then? Or does this standard only apply to our enemies?"*

  **Why it kills you:** It exposes the hypocrisy of selective outrage. If you say "Yes," you risk funding. If you say "No," you lose moral authority.

  **The Prepared Answer:**
  "This standard applies to facts, not flags. If the criteria are met, the classification stands. However, the *public communication* of that classification is subject to the safety and operational veto we discussed. We may reach the internal conclusion but determine that publicizing it would destroy our ability to help the victims. We must be honest that in some cases, silence is the price of access. But we cannot lie to ourselves about what we are seeing."

  *(Note: This is a tightrope walk. It admits to double standards in public messaging but holds the line on internal truth.)*
