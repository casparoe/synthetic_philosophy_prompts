  The ice in J.'s glass had melted down to a single cube, clinking softly against the side as she leaned forward. The bar was nearly empty, the staff starting to stack chairs on the tables around them, but neither of them was looking at the clock.

  "Look at the Rail Link vote," J. said, tapping the table. "You say the assembly is biased because only certain people accept the invite. But for this specific project, the people who say yes are the ones willing to spend three months looking at environmental impact assessments. That's not just the retired; that's the people who care about the outcome enough to show up."

  M. shook their head, swirling the last of their beer. "Exactly. That's the self-selection bias I'm talking about. You've got a lottery, sure, but it's a lottery over the pool of accepters. For a project like this, you're going to get the NIMBYs from the route path and the climate activists. You won't get the shift worker who doesn't care about the train but cares about tax. You're getting a representative sample of the civically keen, not the public."

  "But they rotate," J. countered. "You're looking at one assembly like it's a parliament serving a term. It's not. It's a stream. If you rotate fast enough, the NIMBYs from this month are gone next month. The statistical noise averages out. You don't get that with elections. Once an MP is in, they're there for five years protecting their donors."

  "Even if the members rotate," M. said, leaning in, "the structure doesn't. Who picks the question? For the Rail Link, someone had to decide whether we were voting on the route, the budget, or the principle of the line. That wasn't the assembly. That was the clerks. And who picks the witnesses? The experts who write the briefing pack? Those people are unelected civil servants. You haven't abolished the deep state; you've just made it the only game in town."

  J. laughed, a short, sharp sound. "You think MPs aren't reading briefs written by civil servants? You think they aren't guided by party whips who aren't on the ballot? At least with the assembly, the power of the clerks is auditable. You can see exactly what pack they were given. With an MP, the influence is hidden in backroom donations and media ownership. I'd rather have the bias of the expert than the bias of the donor."

  "But I can throw the MP out," M. said. "If they ignore the brief, if they sell out, I have a mechanism to remove them. With your assembly, if the facilitator steers the conversation toward a 'yes' on the Rail Link by framing the questions a certain way, who do I blame? The facilitator? They're gone next week. The assembly? They're just citizens. There's no handle to grab."

  "That's the romanticism I keep talking about," J. said. "You can throw them out, but do you know enough to know when you should? Look at the last election. Voters punished the party for the global recession they didn't cause and rewarded the party for a boom they didn't create. You're saying accountability exists, but it's random noise. At least with sortition, you admit the decision is about judgment, not popularity. You don't need to throw them out because they aren't trying to get re-elected. They don't need to please a donor to run again."

  "They don't need to please anyone, which is the problem," M. shot back. "If the assembly votes to raise the pension age because the briefing pack said it was fiscally necessary, and the country burns… what then? Riots? With an MP, the anger has a channel. You vote them out. You signal disapproval. With a random sample, you're telling the public their anger is illegitimate because the decision was mathematically representative. It disarms resistance without solving the grievance."

  J. stirred her drink, the ice finally gone. "It solves the grievance that nobody listens. When an MP votes for pension changes, everyone knows it's because of a donor or a party line. When the assembly does it, it's because twelve people like your neighbor decided it. It forces the public to confront the trade-off rather than blaming a villain. But you're still hung up on this idea that elections actually check power. They don't. They just select who holds the unelected power."

  "I'm hung up on the fact that you're relocating power to people who can't be fired," M. said. "The facilitators, the clerks, the experts. In your system, they're the only ones with continuity. They become the real rulers. In my hybrid model, the elected chamber keeps the ultimate veto. The assembly advises, it sets the agenda, it brings in the citizen perspective, but the elected body takes the heat. It keeps the pressure valve."

  "And ensures the pressure valve is owned by the highest bidder," J. said. "You're keeping the corruption because you're afraid of the bureaucracy. But the bureaucracy is there in your system too. The only difference is my system admits it."

  "And your system has no brake," M. said. "If the assembly gets it wrong on the Rail Link, if they bankrupt the state, there's no correction mechanism until the next random draw. Elections are messy, sure, but they allow for a course correction. You're building a ship with a rudder that changes every week."

  "The rudder doesn't change," J. said quietly. "The people holding it do. That's the point. You want to keep the captains because you think they know the sea. I want to rotate the captains because I think the sea belongs to everyone."

  M. signaled for the bill, but didn't look at J. "And I think when the storm hits, everyone will wish they knew who was driving."

  "And I think," J. said, standing up and pulling on her coat, "they already don't."

  They walked out into the cold air, the argument hanging between them, unresolved, as the bar lights flickered off behind them.
