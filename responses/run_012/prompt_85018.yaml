prompt: |-
  You are a philosopher of mind who works on personal identity and autonomy, and you also know your way around the clinical ethics of end-of-life care. Help me dig out the philosophical commitments buried inside a practice I have always taken for granted, and please think carefully rather than reaching for a familiar position.

  The practice is the advance directive — the living will, together with the durable power of attorney for health care that names a surrogate. As it actually runs in American hospitals, it has three features that will not sit still together for me.

  First, once a patient has lost decision-making capacity, a directive she wrote years earlier, in full possession of her faculties, is treated as authoritative. If the now-demented patient sits up, cheerful and clearly without capacity, and asks for the very treatment she once refused, the earlier refusal generally governs. We say, in effect, that she is no longer the one who decides.

  Second, so long as the patient still has capacity, the earlier document slides down to the status of a suggestion. If she now says the opposite of what she wrote, the present, competent word wins, and the old directive becomes mere evidence of what she wants.

  Third, the practice will not enforce what people call a Ulysses clause — a directive that says, in substance, "even if I am later competent and I beg you to do otherwise, hold me to this." A competent patient cannot, it appears, bind her future competent self, even on her own terms and for her own good. Some psychiatric advance directives are written to do exactly this: a man with bipolar disorder instructs that he be medicated against his will during any future manic episode, knowing that he will refuse. My understanding is that the law is unsettled about whether such a clause is honored when he later objects while competent by the ordinary test.

  A smaller wrinkle, and then my puzzle. Many forms and many ethicists recommend that the directive be reviewed and re-signed every few years, on the thought that a stale directive carries less weight. If authority came from identity, though, I would not expect time alone to erode it.

  Here is what puzzles me. The first feature looks as though it presupposes that the earlier self has genuine authority over the later self, enough to override the later self's own voice, and that seems to presuppose a robust continuity of personal identity across the change. But the second feature suggests that the authority was never the earlier self's at all — that authority tracks present competence, and that we honor the directive in the first case only because the patient can no longer exercise authority, so we fall back on her earlier instruction as a default. And the third feature suggests something stranger still: that a competent self cannot alienate her own present authority, which makes present competence look like a kind of sovereignty that even the same person cannot contract away.

  Please do three things. Begin by brainstorming, in a few sentences, the readings that might be in play — lay out the candidate views of personal identity and of autonomy without committing to any of them yet. Then reconstruct, as precisely as you can, the implicit theory that these features jointly require. Be explicit about what the practice strictly presupposes as opposed to what it merely fits well with, and say which rival theories it quietly rules out. Finally, tell me where the practice is underdetermined — where two or more incompatible views of the self would license exactly the same rules — and say what would have to change if we replaced the view you think it presupposes with its leading rival. In particular, I want your verdict on whether the third feature belongs to the same picture as the first two, or whether it exposes the practice as quietly committed to two theories at once.

  Write in clear American English, for a reader who is at home with philosophy but has no patience for jargon for its own sake. Do not hand me a reading list; argue it out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind (personal identity, autonomy) + Clinical Ethics (end-of-life care).
      *   **Task:** Dig out philosophical commitments buried in the practice of Advance Directives (ADs) in American hospitals.
      *   **Input Data (The Three Features + Wrinkle):**
          1.  *Incapacity:* Past AD overrides present incompetent wishes (Past Self > Present Incompetent Self).
          2.  *Capacity:* Present competent wishes override past AD (Present Competent Self > Past Self).
          3.  *Ulysses Clause:* Competent self *cannot* bind future competent self (Present Competent Self cannot constrain Future Competent Self).
          *   *Wrinkle:* ADs lose weight over time (Time erodes authority).
      *   **The Puzzle:** Feature 1 suggests strong continuity/authority of past self. Feature 2 suggests authority tracks *only* present competence. Feature 3 suggests present competence is inalienable sovereignty.
      *   **Requirements:**
          1.  Brainstorm candidate views (Identity & Autonomy).
          2.  Reconstruct the *implicit theory* the practice jointly requires (strict presuppositions vs. fit, ruled-out theories).
          3.  Identify underdetermination (where incompatible views license same rules) and what would change if the view were swapped.
          4.  Verdict on Feature 3 (Does it fit 1 & 2, or expose a contradiction/dual commitment?).
      *   **Tone/Style:** Clear American English, philosophically literate but no gratuitous jargon, argumentative (not just a reading list).

  2.  **Deconstruct the Features & Brainstorm Views (Step 1):**
      *   *Feature 1 (Past > Incompetent Present):* Requires some link between Past Self and Incompetent Present Self.
          *   *Candidate A:* Psychological Continuity (Lockean). The demented patient is the *same person* as the writer, just impaired.
          *   *Candidate B:* Narrative Identity. The story holds together even if the chapter is foggy.
          *   *Candidate C:* Critical Interests (Dworkin). Past critical interests outweigh present experiential interests.
      *   *Feature 2 (Competent Present > Past):* Authority is located in the *capacity to decide now*.
          *   *Candidate A:* Autonomy as Non-Interference. If you can decide, we can't override you.
          *   *Candidate B:* Epistemic Privilege. You know best *now*.
      *   *Feature 3 (No Ulysses/Binding Future Competent Self):* Autonomy is non-alienable.
          *   *Candidate A:* Sovereignty Model. You can't sign away your right to choose later.
          *   *Candidate B:* Revisionary Autonomy. The self has a right to change its mind.
      *   *Wrinkle (Time erodes weight):* Suggests identity or preference strength decays.
          *   *Candidate:* Gradualist Identity or Evidentiary View (AD is just evidence, not a command).

  3.  **Reconstruct the Implicit Theory (Step 2):**
      *   What holds 1, 2, and 3 together?
      *   *The Core Tension:* If Past Self rules Incompetent Present (1), why doesn't Past Self rule Competent Present (2 & 3)?
      *   *The Solution:* The practice isn't based on *Identity* alone. It's based on *Capacity-Triggered Authority*.
      *   *The Implicit Theory:* "The Sovereign Competent Self."
      *   *Identity:* It presupposes a *threshold* view of personhood/agency. You are the same *human organism*, but you are only a *moral agent* when competent. When incompetent, you are a ward of your past agency.
      *   *Autonomy:* Autonomy is the power of the *present* mind to govern the *body*. It is inalienable. You cannot give away the right to change your mind while you have a mind.
      *   *What it rules out:*
          *   Strict Psychological Continuity (if identity is all that matters, why does competence matter so much?).
          *   Precedent Autonomy as Absolute (Dworkin's strong view would support Ulysses clauses more robustly).
          *   The "Demented Self as New Person" view (if they were a new person, the AD wouldn't bind at all).
      *   *Strict Presupposition:* Authority is a function of *current capacity*, not just *historical identity*. The AD is a proxy mechanism, not a literal extension of the past will into the future *against* a present will.

  4.  **Analyze Underdetermination & Feature 3 (Step 3 & 4):**
      *   *Underdetermination:* Where do different theories agree?
          *   Both a "Narrative Identity" theorist and a "Biological Continuity" theorist could support Feature 1 (respecting the AD). They disagree on *why*, but the rule is the same.
          *   Both a "Kantian Autonomy" (rational agency) and "Millian Autonomy" (liberty) theorist could support Feature 2 (respecting current competence).
      *   *The Wrinkle (Time):* This suggests an *Evidentiary View* rather than an *Authority View*. If it were pure authority, time wouldn't matter. If it's evidence of what you *would* want, time degrades reliability.
      *   *Feature 3 Verdict:* This is the crack in the dam.
          *   Features 1 & 2 suggest: Authority tracks Capacity. (No capacity -> Past rules. Capacity -> Present rules).
          *   Feature 3 suggests: Capacity is Inalienable.
          *   *Conflict:* If Past Self has authority over Incompetent Present (1), why can't Past Self set terms for Competent Present (3)?
          *   *Diagnosis:* Feature 3 exposes that the practice is *not* committed to "Precedent Autonomy" (the idea that the past self governs the future). It is committed to "Current Sovereignty."
          *   *Conclusion:* Feature 3 does *not* belong to the same picture as Feature 1 if Feature 1 is read as "Past Self Rules." Feature 1 must be read as "Past Self Rules *only because* Present Self is Silent/Incapable."
          *   *Dual Commitment:* The practice tries to balance *Protection* (Feature 1: protect you from your illness) and *Liberty* (Feature 2 & 3: protect your right to choose). These are often in tension.
          *   *Rival View:* If we swapped to a "Strong Precedent Autonomy" view (Dworkin), Feature 3 would vanish (Ulysses clauses would be binding). If we swapped to a "Presentist" view (Dresser), Feature 1 would vanish (ADs wouldn't bind). The current practice is a unstable hybrid.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the depth of the puzzle. It's the "Paradox of the Competent Past."
      *   *Section 1: Brainstorming.* Keep it tight. Mention Psychological Continuity, Biological Continuity, Critical vs. Experiential Interests, Sovereignty vs. Stewardship.
      *   *Section 2: The Implicit Theory.* Call it "Capacity-Conditional Sovereignty." The AD is a *proxy* that activates only upon *failure* of the primary mechanism (competence). It's not a binding contract; it's a standby instruction.
      *   *Section 3: Underdetermination & The Verdict.*
          *   Underdetermination: The "Time" wrinkle suggests the AD is evidentiary, not authoritative. This clashes with Feature 1's apparent authority.
          *   Feature 3 Verdict: It breaks the symmetry. Feature 1 says Past > Incompetent Present. Feature 3 says Present > Past (even if Past tried to bind).
          *   The practice is actually committed to *two* different justifications that contradict at the edges. One is *Beneficence/Stewardship* (we honor the AD to protect the person's life narrative when they can't). The other is *Liberty* (we never lock a competent mind).
          *   If we adopted a consistent "Narrative Identity" view, Ulysses clauses *should* work. The fact that they don't shows the clinical ethic prioritizes *non-interference with the present body* over *fidelity to the past narrative*.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "it's inconsistent." I need to explain *what theory makes sense of the inconsistency*.
      *   *Idea:* The theory is "Agency as a Switch." You are either an Agent or a Patient. If Agent, you rule. If Patient, your past Agent rules. But you cannot sign a contract that turns you from an Agent into a Patient voluntarily while you are still an Agent.
      *   *Wait, check Feature 3:* In psych, Ulysses contracts are often *not* honored if the patient is currently competent (even if manic). But sometimes they are. The prompt says "law is unsettled." I need to address why the *default* hesitation exists. It's the fear of coercing a competent person.
      *   *Refining the "Time" Wrinkle:* This is crucial. If identity is the ground, time doesn't matter. If *reliability of evidence* is the ground, time matters. This suggests the practice treats the AD as *substituted judgment* (what they would want) rather than *precedent autonomy* (what they decided).
      *   *Final Verdict:* Feature 3 is the outlier. It reveals the limit of the "Past Self Authority" model. The practice is fundamentally *Presentist* with a *Safety Net*.

  7.  **Final Polish:** Check tone. Ensure no jargon without explanation. Ensure all constraints of the prompt are met. (Brainstorm, Reconstruct, Underdetermination/Verdict).

      *(Self-Correction on "Identity"):* Be careful not to conflate "Personal Identity" (metaphysics) with "Moral Authority" (ethics). The prompt asks about commitments buried in the practice. The practice often conflates them. I should point that out.

      *(Plan for Section 2):* Define the theory as "The Standby Model of Agency."
      *(Plan for Section 3):* Highlight the tension between "Precedent Autonomy" and "Current Sovereignty."

      *Let's write.*
answer: |-
  Here is a breakdown of the philosophical machinery humming beneath the standard American advance directive, followed by an assessment of where that machinery jams.

  ### 1. Candidate Views on the Table

  To make sense of your three features, we have to sort through a few competing accounts of what makes a person the *same* person over time, and what gives a self the right to rule its body.

  First, regarding **Personal Identity**: There is the *Psychological Continuity* view, which says you are the same person so long as your memories, character, and intentions link up in a chain. If dementia severs that chain, the demented patient might be a different "person" than the one who wrote the directive. Then there is the *Biological View*, which says you are the same person so long as you are the same living organism, regardless of mental change. Finally, there is the *Narrative View*, where identity is the coherence of a life story; the directive is a plot point written early to guide the ending.

  Second, regarding **Autonomy**: There is the *Sovereignty Model*, where autonomy is the immediate power of a competent mind to control its body; this power is inalienable and cannot be signed away. Contrast this with *Precedent Autonomy* (often associated with Ronald Dworkin), which argues that a person's "critical interests" (their deep, reflective values) established when competent should govern their "experiential interests" (what feels good now) when they are not. A third option is the *Evidentiary View*, which treats the directive not as a binding command, but as the best available evidence of what the patient would choose if they could speak.

  ### 2. The Implicit Theory: Capacity-Conditional Sovereignty

  When we look at how these three features actually function together in the clinic, they do not rest on a single, clean metaphysical theory of identity. Instead, they presuppose a functional theory I will call **Capacity-Conditional Sovereignty**.

  Here is the reconstruction of what the practice strictly presupposes:

  **Authority tracks capacity, not just identity.**
  Feature 1 (Past > Incompetent Present) and Feature 2 (Present Competent > Past) jointly imply that the *source* of authority is present decision-making capacity. The advance directive is not treated as a law passed by a previous legislature that remains binding forever. It is treated as a **standby instruction**. It activates only when the primary mechanism of authority (current competence) fails. This rules out the strong *Psychological Continuity* view where the demented patient is a *different person*; if they were a different person, the directive would have no moral grip on them at all (like my will governing your body). It also rules out the strong *Precedent Autonomy* view; if past critical interests were absolute, Feature 2 would not hold—the competent patient would be bound by her past self's rational judgment.

  **The Competent Self is Inalienably Sovereign.**
  Feature 3 (No Ulysses Clauses) clarifies the nature of this sovereignty. It presupposes that the capacity for choice is a property of the *current state of the mind*, not a property of the *person* that can be transferred or restricted. You cannot contract away your right to change your mind while you still have a mind. This quietly rules out the idea that autonomy is a long-term project of self-binding. It treats autonomy as a series of discrete moments of sovereignty. If you are competent *now*, you are the king, even if the king you were five years ago ordered this castle locked.

  **Identity is Presumed, but Authority is Evidentiary.**
  The "Time Wrinkle" (directives lose weight over time) reveals that the practice does not treat the directive as an extension of the past self's will (which wouldn't decay), but as *evidence* of the patient's values. If the directive were truly the past self ruling the present, a ten-year-old signature should carry the same weight as a ten-day-old one. The fact that clinicians urge updates implies they view the directive as a proxy for what the patient *would* say, and the reliability of that proxy degrades as the person changes.

  **What this theory rules out:**
  1.  **The "New Person" Theory:** It rejects the idea that severe dementia creates a new moral entity. If it did, Feature 1 would be unethical (one person binding another).
  2.  **The "Absolute Precedent" Theory:** It rejects the idea that the past self has a right to govern the future self against the future self's will (otherwise Feature 3 would be standard).
  3.  **Pure Biological Continuity:** If being the same organism were all that mattered, the wishes of the demented patient (Feature 1) might carry more weight simply because they are the organism speaking now. The practice prioritizes the *past competent* organism over the *present incompetent* one.

  ### 3. Underdetermination and the Verdict on Feature 3

  Now we must ask where this practice is underdetermined—where it masks a deeper philosophical disagreement—and whether Feature 3 fits with the first two.

  **Where the Practice is Underdetermined**
  The practice allows two incompatible views of the self to coexist peacefully until a crisis hits.
  *   **View A:** The patient is one continuous person whose values have temporarily become inaccessible. The directive is a bridge over the gap.
  *   **View B:** The patient is a ward of the state whose best interests must be guessed at. The directive is just a very strong hint about those interests.

  Both views license Features 1 and 2. If the patient is incompetent, View A says "honor their past will" and View B says "honor the best evidence of their will." The result is the same. The underdetermination breaks only when the patient speaks. If the demented patient asks for treatment (Feature 1), View A says "ignore her, she's not really *her*." View B says "ignore her, she lacks capacity to understand." The rules are the same, but the justification is different. This matters because if we adopted View A strictly, we might be more willing to enforce Ulysses clauses (binding the future self). If we adopted View B strictly, we might ignore the directive sooner in favor of "best interests."

  **The Verdict on Feature 3**
  Feature 3 does **not** belong to the same picture as Features 1 and 2. It exposes a fracture in the underlying theory.

  Features 1 and 2 establish a hierarchy: **Competence trumps Incompetence.**
  *   If Competent (Now) > Incompetent (Now), then Present wins.
  *   If Competent (Past) > Incompetent (Now), then Past wins.
  *   *Implicit Rule:* The directive wins only because the present self is silent or incapacitated.

  Feature 3 introduces a new constraint: **Competence trumps Contract.**
  *   Even if Competent (Past) tried to bind Competent (Now), Competent (Now) wins.

  This creates a tension. If the justification for Feature 1 is *Precedent Autonomy* (my past self has the right to decide my fate), then Feature 3 is a violation of that right. Why can I bind my future incompetent self but not my future competent self? The only consistent answer is that the practice is not actually committed to Precedent Autonomy. It is committed to **Non-Interference.**

  The practice is quietly committed to two theories at once:
  1.  **Stewardship (Features 1 & Wrinkle):** When you lose your mind, we steward your life according to your last known values. We treat your past self as a guardian.
  2.  **Libertarian Sovereignty (Features 2 & 3):** When you have your mind, no one—not even your past self—can tell you what to do with your body.

  **The Consequence of Swapping the View**
  If we replaced this hybrid view with a consistent **Narrative/Precedent Autonomy** view (where the life story is the primary unit of moral concern), Feature 3 would have to change. Ulysses clauses would become enforceable. A bipolar patient who rationally decides, "When I am manic, I am not me; medicate me," would be held to that bargain. The competent manic self would be treated as a temporary usurper of the true narrative self.

  If we replaced it with a consistent **Presentist/Experiential** view (where only current experience matters), Feature 1 would collapse. The directive would become merely advisory, and the cheerful demented patient's request for treatment would override the past refusal, because the "past self" no longer exists to have an interest.

  **Conclusion**
  The advance directive practice as it stands is a pragmatic compromise, not a philosophical whole. It prioritizes the safety of the incompetent (Feature 1) without sacrificing the liberty of the competent (Features 2 & 3). Feature 3 is the tell. It reveals that the hospital's ultimate commitment is not to the *continuity of the person*, but to the *sanctity of the present mind*. We honor your past self only when your present self is gone. If your present self returns, even if it contradicts the past, the past must yield. The "Time Wrinkle" confirms this: the directive is not a command from the past; it is a shadow cast by the past, which fades as the light of the present changes.
