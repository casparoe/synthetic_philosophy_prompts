prompt: |-
  ok so this is long, sorry, but the details are the whole point here.

  Background: I've been reading LessWrong/Slate Star Codex-adjacent blogs for over a decade, did a couple of years of forecasting on Metaculus, and I'm probaly the guy in my friend group who brings up prediction markets at parties. So I'm not coming to futarchy as a skeptic — I already think it's one of the most underrated ideas in political economy. Which is exactly why I want you to be hard on me rather than encouraging.

  The situation: my city is running a participatory budgeting pilot this year, and a friend and I want to pitch the council on going further and actually adopting futarchy for the next budget cycle. I'm writing the pitch doc now. Before I do, I want to check my own understanding, because if I get the mechanism wrong in front of a council I'll look like an idiot and set the idea back a decade locally.

  Here's my model, spelled out:

  1. We pick a metric that stands in for the public good. GDP per capita is the obvious one, or maybe median income, or a happiness index if we can get survey data.
  2. We set up prediction markets on what that metric will be five years out.
  3. Departments and outside groups propose budget policies. Traders bet on what the metric will be under each proposal.
  4. The market converges on the true expected value of the metric for each policy, and whichever policy has the highest number gets funded.
  5. Since prediction markets are efficient, the market's number is basically correct, so we can trust it.
  6. The beautiful part is that this takes the politics out of budgeting. Nobody has to argue about what's worth wanting anymore — the market just tells us which policy actually produces more of the good thing.

  Now, my questions:

  (a) Is it right that the only genuinely hard problem here is choosing the metric? Once you've got the metric, is everything else just engineering — liquidity, traders, resolution, that kind of thing?
  (b) What metric should we use? GDP feels crude but at least it's measurable. Is there something better that's still tractable for a mid-sized city?
  (c) Am I right that this lets us skip the part where we vote on what we value? Because if the market just tells us which policy produces more of the good thing, then there's no value disagreement left to have, which is the part of politics I find most exhausting.

  Take the role of a political economist / mechanism design person who has read the original futarchy proposal and the academic pushback on it — there's a decent critical literature, and I want the objections that actually bite, not the knee-jerk markets-are-icky stuff.

  Before you answer, do a quick pass: go through my six numbered points and mark each one true, half-true, or wrong, with one line on why. Then give me the real answers to (a), (b) and (c). Think carefully here; I'd much rather be told my model is broken in some specific way than be told it's promising. And please dont just tell me to go read the literature — give me the actual arguments, because I have to defend this in a room full of people who have never heard of any of it.

  One last thing: if there's a version of this proposal that would actually work, tell me what it looks like — but only after you've told me what's wrong with mine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Well-read in rationalist/EA circles (LessWrong, SSC), experienced with forecasting (Metaculus), advocates for prediction markets/futarchy. Not a skeptic, but wants rigorous criticism to avoid embarrassment and failure.
      *   **Context:** Pitching a city council on adopting futarchy for participatory budgeting.
      *   **Task:** Critique a 6-point model of futarchy, answer three specific questions (a, b, c), and propose a viable alternative *only after* dismantling the current model.
      *   **Tone:** Hard-nosed, expert political economist/mechanism designer. No knee-jerk "markets are bad" arguments. Focus on structural/mechanism design flaws.
      *   **Constraint:** Mark the 6 points as True/Half-True/Wrong with a one-line justification *before* answering the questions.

  2.  **Evaluate the 6-Point Model:**
      *   *Point 1 (Metric):* "Pick a metric... GDP per capita, median income, happiness index."
          *   *Verdict:* Half-True.
          *   *Reasoning:* You need a metric, but "picking" it is the *hard* part, not just a preliminary step. Goodhart's Law applies heavily here.
      *   *Point 2 (Markets on metric 5 years out):* "Set up prediction markets on what that metric will be five years out."
          *   *Verdict:* Half-True.
          *   *Reasoning:* You need conditional markets (Policy X vs. Policy Y), not just a baseline forecast. Also, 5 years is a long resolution time for liquidity.
      *   *Point 3 (Departments propose, traders bet):* "Traders bet on what the metric will be under each proposal."
          *   *Verdict:* True.
          *   *Reasoning:* This is the core mechanism (conditional markets).
      *   *Point 4 (Market converges, highest number funded):* "Market converges... whichever policy has the highest number gets funded."
          *   *Verdict:* Half-True.
          *   *Reasoning:* It's not just the highest number; it's the highest *expected value* relative to the status quo, and implementation risk matters.
      *   *Point 5 (Markets are efficient/correct):* "Since prediction markets are efficient, the market's number is basically correct."
          *   *Verdict:* Wrong.
          *   *Reasoning:* Efficiency requires liquidity and lack of manipulation; small city markets will be thin and manipulatable by stakeholders.
      *   *Point 6 (Takes politics out):* "Takes the politics out of budgeting... no value disagreement."
          *   *Verdict:* Wrong.
          *   *Reasoning:* Choosing the metric *is* politics. Also, distributional effects are ignored by aggregate metrics.

  3.  **Address Question (a): Is choosing the metric the only hard problem?**
      *   *Analysis:* No. Liquidity, manipulation, causal inference vs. correlation, and the "vote on values, bet on beliefs" distinction are huge.
      *   *Key Argument:* The "engineering" problems (liquidity, manipulation) are fatal at the city level. Also, the metric choice determines *whose* values count.

  4.  **Address Question (b): What metric should we use?**
      *   *Analysis:* GDP is terrible for a city (leakage, externalities). Median income is better but still misses services. Happiness is too noisy/manipulatable.
      *   *Key Argument:* There is no single "good" metric. A dashboard or weighted index is necessary, but that reintroduces political weighting.

  5.  **Address Question (c): Does this skip voting on values?**
      *   *Analysis:* Absolutely not. This is the most dangerous misconception.
      *   *Key Argument:* Futarchy is "Vote on Values, Bet on Beliefs." If you skip the vote on values (the metric), you are implicitly accepting a technocratic value system that may harm minorities or ignore distribution.

  6.  **Develop the "Viable Version" (The Pivot):**
      *   *Constraint:* Only after critique.
      *   *Idea:* Full futarchy is too risky for a whole budget. Use *decision markets* for specific, contained projects within the participatory budgeting framework.
      *   *Refinement:* Don't replace the council. Augment them. Use markets to inform *implementation* or specific *policy levers*, not the whole budget metric. Or, use a "Governance Forecasting" model where markets advise, but humans decide (advisory futarchy).
      *   *Best Approach for City:* Advisory prediction markets on specific outcomes of proposed projects, combined with a multi-metric dashboard agreed upon by the council (values), using markets to estimate project impact (beliefs).

  7.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone Check:* Needs to be respectful but brutal on the mechanics. Acknowledge the user's sophistication but highlight the gap between theory and municipal reality.
      *   *Critique:* Ensure Goodhart's Law and Manipulation are central themes.
      *   *Metric:* Emphasize that cities aren't nations. GDP doesn't work well for open systems like cities.
      *   *Politics:* Hammer home that "metric selection is politics."
      *   *Alternative:* Suggest "Advisory Futarchy" or "Decision Markets for Project Selection" rather than full budgetary control.

  8.  **Final Review against Constraints:**
      *   Did I mark the 6 points? Yes.
      *   Did I answer (a), (b), (c)? Yes.
      *   Did I offer a viable version at the end? Yes.
      *   Is the tone appropriate? Yes, expert-to-expert.
      *   Did I avoid "go read the literature"? Yes, arguments are provided.

  9.  **Self-Correction during drafting:** I initially thought about suggesting a specific metric like "property values." But that's regressive. Better to suggest a *basket* of metrics. I need to make sure I distinguish between *national* futarchy (Hanson's original idea) and *municipal* futarchy. Municipal is harder because of capital flight and open systems. I need to mention the "manipulation attack" specifically—stakeholders can profit by sabotaging a policy they bet against. This is crucial for a city council pitch.

  10. **Final Polish:** Ensure the distinction between "Vote on Values, Bet on Beliefs" is clear, as the user seems to think futarchy removes value judgments entirely. It doesn't; it shifts them upstream.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the assessment of your model, followed by the answers to your questions and a revised proposal.

  ### Part 1: Audit of Your Six-Point Model

  1.  **Pick a metric... GDP, median income, happiness.**
      *   **Verdict:** Half-True.
      *   **Why:** You must pick a metric, but treating this as a simple setup step ignores that *selecting* the metric is the primary political conflict, not a technical prerequisite.
  2.  **Set up prediction markets on what that metric will be five years out.**
      *   **Verdict:** Half-True.
      *   **Why:** You need *conditional* markets (Metric IF Policy X vs. Metric IF Policy Y), not just a baseline forecast, and 5-year resolution is too long for liquidity to remain honest.
  3.  **Departments propose... Traders bet on what the metric will be under each proposal.**
      *   **Verdict:** True.
      *   **Why:** This accurately describes the "bet on beliefs" mechanism of conditional decision markets.
  4.  **The market converges... whichever policy has the highest number gets funded.**
      *   **Verdict:** Half-True.
      *   **Why:** Implementation requires more than a highest number; it requires ensuring the policy is legally viable, budget-constrained, and that the market isn't manipulated to inflate the number.
  5.  **Since prediction markets are efficient, the market's number is basically correct.**
      *   **Verdict:** Wrong.
      *   **Why:** Market efficiency requires deep liquidity and no single actor holding enough capital to move the price; municipal markets will be thin and easily manipulated by stakeholders.
  6.  **This takes the politics out of budgeting... no value disagreement left.**
      *   **Verdict:** Wrong.
      *   **Why:** Futarchy does not remove value judgments; it moves them upstream to the choice of the metric, which implicitly weights whose welfare counts (e.g., renters vs. landlords).

  ---

  ### Part 2: The Hard Answers

  You asked for the objections that bite. Here they are.

  **(a) Is choosing the metric the only hard problem?**
  **No.** If it were just the metric, we would have implemented this already. The two fatal flaws for a municipal context are **manipulation incentives** and **liquidity depth**.

  In a national futarchy (Hanson's original proposal), the market is so large that it is expensive for any single actor to manipulate the outcome. In a city budget, the stakes are small enough that a interested party (e.g., a real estate developer, a union, a neighborhood association) can profitably manipulate the market.
  *   *The Attack:* I know Policy X hurts my business. I short the market on Policy X. I then spend a fraction of my potential profit to lobby, sabotage, or spread disinformation to ensure Policy X fails. I get paid twice: once on the market, once by saving my business.
  *   *The Liquidity Problem:* To get a "true" price, you need informed traders. Who are they? Local policy wonks don't have trading capital. Outside traders don't understand local zoning law. The market will be dominated by noise or bad actors, making the signal useless.

  **(b) What metric should we use?**
  **There is no single metric that is both measurable and good.**
  *   *GDP/Income:* Cities are open systems. A policy could raise median income by displacing poor residents (gentrification). The metric goes up, the public good goes down.
  *   *Happiness/Wellbeing:* Too subjective, survey data is laggy, and easily gamed by changing the survey methodology or timing.
  *   *Property Values:* Incentivizes NIMBYism and exclusionary zoning.
  *   *The Reality:* You need a **dashboard of metrics** (e.g., housing affordability, crime rates, budget surplus, satisfaction). But the moment you have multiple metrics, you need a weighting function. Who decides the weights? That is politics. If you hard-code the weights, you have baked in a political ideology that the council cannot legally abdicate.

  **(c) Am I right that this lets us skip the part where we vote on what we value?**
  **Absolutely not. This is the most dangerous misconception you could bring into the council chamber.**
  Robin Hanson's slogan is "Vote on Values, Bet on Beliefs." You are proposing to skip the "Vote on Values" part.
  *   *The Trap:* If you choose GDP as the metric, you have implicitly voted that economic output is the highest value, over equality, sustainability, or liberty. If you choose median income, you have voted against the interests of the bottom quartile.
  *   *The Council's Job:* Elected officials *cannot* outsource value judgments. They are elected to represent conflicting values (safety vs. liberty, growth vs. preservation). If you tell them, "The market decides," you are asking them to violate their oath to represent their constituents' diverse values. The market optimizes for the metric; it does not optimize for justice.

  ---

  ### Part 3: A Version That Might Actually Work

  If you pitch full futarchy as you described it, you will likely be rejected because the risks (manipulation, abdication of responsibility) outweigh the benefits for a general budget. However, you can pitch **Advisory Decision Markets** within the existing Participatory Budgeting (PB) framework.

  **The Proposal: "Forecast-Guided Project Selection"**

  1.  **Values remain Democratic:** The City Council and citizens still vote on the *goals* and the *metrics* (e.g., "We want to reduce traffic congestion" or "We want to increase park usage"). This keeps the "Vote on Values" where it belongs.
  2.  **Beliefs are Market-Tested:** Instead of betting on the city's entire GDP, you run conditional prediction markets on specific PB projects.
      *   *Market A:* "If we fund the Bike Lane Project, what will traffic volume be on Main St in 12 months?"
      *   *Market B:* "If we fund the Road Repair Project, what will traffic volume be on Main St in 12 months?"
  3.  **Advisory, Not Binding:** The market results do not automatically fund the project. They provide a "Confidence Score" to the Council and the PB voters.
      *   *Pitch:* "Citizens, the market suggests the Bike Lane has an 80% chance of meeting our traffic goals, while Road Repair has only 40%. Vote accordingly."
  4.  **Resolution via Oracle:** Use existing city data (traffic counters, park swipe cards) to resolve the markets. This avoids the need for external liquidity providers; you can use play-money or small-stakes real money to incentivize local experts (urban planners, civil engineers) to trade.
  5.  **Mitigate Manipulation:** Because the markets are advisory, the profit motive to sabotage the policy is reduced. If I short the Bike Lane and sabotage it, I win the bet, but the city doesn't lose the full budget (they just pick the next best project). This lowers the incentive for attack.

  **Why this works better for your pitch:**
  *   **Political Safety:** The Council retains final authority. They aren't abdication responsibility to an algorithm.
  *   **Feasibility:** You don't need deep liquidity for a whole budget, just enough to gauge expert sentiment on specific projects.
  *   **Education:** It introduces the concept of "bet on beliefs" without forcing the "vote on values" conflict immediately.
  *   **Iterative:** If this pilot works, you can expand the stakes or the binding nature of the markets in year 3 or 4.

  **Your Pitch Line:**
  *"We aren't asking the Council to give up power. We're asking for better information. Currently, we vote on projects based on promises. We want to test those promises in a market before we spend the money."*

  This preserves the spirit of futarchy (using markets to aggregate information about causal effects) without triggering the fatal flaws of mechanism design and political theory that would kill the full version.
