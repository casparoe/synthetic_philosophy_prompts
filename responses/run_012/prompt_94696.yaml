      *   **Constraint:** Do not simply pick a side. Provide a nuanced philosophical analysis.

  2.  **Deconstruct the Philosophical Puzzle (Fitch's Paradox):**
      *   *Premise 1 (Knowability Principle):* $\forall p (p \rightarrow \diamond K p)$ (If $p$ is true, it is possible to know $p$).
      *   *Premise 2 (Existence of Unknown Truths):* $\exists p (p \land \neg K p)$ (There is a truth nobody knows).
      *   *Derivation:*
          1.  Assume $p \land \neg K p$ is true.
          2.  By KP, $\diamond K(p \land \neg K p)$.
          3.  Assume a world where $K(p \land \neg K p)$ holds.
          4.  By Distribution: $K p \land K(\neg K p)$.
          5.  By Factivity: $K p \land \neg K p$.
          6.  Contradiction.
          7.  Therefore, $\neg \diamond K(p \land \neg K p)$.
          8.  By KP, $\neg (p \land \neg K p)$.
          9.  Therefore, $\forall p (p \rightarrow K p)$ (Omniscience).
      *   *Conclusion:* If all truths are knowable, all truths are known. Since not all truths are known, not all truths are knowable. This threatens anti-realism (which equates truth with knowability).

  3.  **Evaluate Nadia's Position:**
