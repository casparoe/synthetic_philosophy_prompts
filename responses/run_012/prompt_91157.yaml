answer: |-
  ### The Principle of Contextual Reciprocity

  A local convention binds a visitor if and only if it satisfies the following three conditions. If a case fails any condition, the convention does not bind, or is overridden.

  **1. The Legitimacy Condition**
  The convention must not require complicity in injustice, corruption, or the degradation of human dignity.
  *   **Forcing Case:** **The Bribe.** You refuse to pay not because the harm is diffuse, but because the convention itself is corrupt. It fails the Legitimacy Condition, so it generates no obligation.
  *   **Forcing Case:** **Tipping (Salaried Country).** You refuse to tip because the local convention interprets tipping as an insult to professional dignity. To tip would violate the Legitimacy Condition (dignity harm).

  **2. The Reliance Condition**
  The convention must sustain a system of expectations where your breach imposes friction, loss, or uncertainty on specific counterparties who are relying on your compliance.
  *   **Forcing Case:** **Escalators.** In the walk-right city, standing left imposes a cost (delay) on those relying on the lane for passage. In the stand-anywhere city, no such reliance exists.
  *   **Forcing Case:** **Tipping (Sit-down).** The wage structure creates a specific economic reliance. The server expects the tip as part of the contract.
  *   **Forcing Case:** **Shoes (Host/Parent).** The host (and the elder) rely on you to respect the domestic boundary.

  **3. The Solidarity Condition**
  Where specific reliance is negligible, the convention binds if breaching it expresses a claim of exemption from a shared burden, thereby undermining the community's commitment to the rule.
  *   **Forcing Case:** **Jaywalking (Scrupulous City).** No physical harm occurs. However, waiting signals solidarity with the law-abiding community. Crossing signals "the rules are for you, not me," damaging the normative fabric.
  *   **Forcing Case:** **Queueing (Long Line).** The delay is negligible, but cutting claims an unfair priority over the shared order.

  **The Vulnerability Override**
  If a specific individual's welfare relies on your action contrary to the general custom, and no Legitimacy Condition is violated, the specific reliance binds.
  *   **Forcing Case:** **Tipping (Resort Town).** The general custom (residents don't tip) is overridden by the specific reliance of the seasonal staff who live on tourist tips.
  *   **Forcing Case:** **Jaywalking (With Nephew).** The general custom (permissive) is overridden by the pedagogical reliance of the child learning norms.
  *   **Forcing Case:** **Shoes (Elder Parent).** The host's permission is overridden by the elder's unspoken expectation.

  ***

  ### Verdicts on Unconsidered Cases

  **1. Arbitrary but Universal Conventions**
  *Case:* Driving on the left in a country where everyone does so, despite no physical reason why left is better than right.
  *Verdict:* **Bind.**
  *Reasoning:* This falls under the **Reliance Condition**. The content is arbitrary, but the *coordination* is vital. Breach causes high friction/loss (accidents) because everyone relies on the uniformity.

  **2. Subgroup Conventions**
  *Case:* You are a secular visitor standing outside a place of worship where a subgroup (devotees) covers their heads. You are not part of the subgroup.
  *Verdict:* **Bind.**
  *Reasoning:* This falls under the **Solidarity Condition**. While you are not a member, your breach within their space expresses contempt for their shared burden of reverence. It claims an exemption from the respect owed to the gathering.
  *Exception:* If the subgroup is a private club you are not seeking to join, and you are merely passing on a public sidewalk, the convention does not reach you (No Reliance, No Solidarity duty to non-members in public space).

  ***

  ### The Unsavable Verdict

  I must be honest: The Principle of Contextual Reciprocity cannot save your verdict on **Queueing (Long Line)** without stretching the definition of "Solidarity" to the breaking point.

  **The Conflict:**
  In **Jaywalking (Scrupulous)**, the Solidarity Condition works because the rule (traffic signal) is a public good that everyone is actively upholding. Your breach mocks *their* effort.
  In **Queueing (Long Line)**, you admit "no one could name" the delay. The "harm" is purely theoretical. Unlike the traffic signal, the queue is not a moral law; it is a procedural convenience. To call it "wrong" (rather than merely "rude") requires a belief in a moral duty to queue that exists independently of harm. The Reliance Condition fails (no namable loss). The Solidarity Condition is weak (queueing is not a moral virtue like law-abidingness).

  **Recommendation:**
  You should surrender the verdict that slipping into a friend's position in a long line is **wrong**.
  *   **Revised Verdict:** It is **rude**, but not morally wrong.
  *   **Why:** This preserves the precision of your principle. It keeps "Wrong" reserved for cases involving Justice (Bribe), Reliance (Escalator), or Expressive Solidarity (Jaywalking). Queueing in a long line, where harm is unnamable, belongs to the category of *etiquette*, which binds only by social pressure, not moral obligation. Surrendering this distinction allows you to keep the Solidarity Clause robust enough to handle Jaywalking without diluting it to cover every minor social friction.

  **A Note on the Resort Town:**
  You mentioned the Resort Town case "sits badly" with the Salaried Country case. The Principle saves both, but it requires you to surrender the idea that "Local Convention" is a monolith. In the Resort Town, there are *two* conventions: one for residents (don't tip) and one for tourists (tip). Your obligation follows the convention of the *counterparty* (the staff), not the bystanders (the residents). The friction you feel comes from misidentifying the residents as the relevant normative community. They are not; the staff are.
