prompt: |-
  You are a philosopher of biology who also works in clinical ethics. I want a careful diagnosis rather than a survey, so please brainstorm the candidate diagnoses before you commit to one. The debate over the definition of death has now run for roughly half a century — whole-brain versus circulatory versus higher-brain criteria — and on my hospital's ethics committee it resurfaces every few years without anyone moving, even though the disputants agree on the physiology: the permanently unconscious patient on a ventilator whose brainstem function has ceased, the patient whose circulation has stopped but whose brain might in principle be restored, the anencephalic infant, the patient in a persistent vegetative state. My own hypothesis, offered as a hypothesis, is that this is not really a disagreement about biology at all but either a verbal dispute about the word death or a moral dispute about which patients we may treat as dead, dressed up in definitional clothing. Diagnose it for me: is the impasse verbal, empirical, metaphysical (a disagreement about what an organism essentially is, or about whether organisms are essentially integrated wholes), or moral — or several of these tangled under a single heading, with each side answering a different question? Argue from what each side actually claims about the cases rather than from the literature. Then tell me what would count as progress given your diagnosis: a distinction, a decision procedure, a change of question, or a reason to think that no progress should be expected and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of Biology + Clinical Ethicist.
      *   **Task:** Diagnose the impasse in the definition of death debate (Whole-Brain vs. Circulatory vs. Higher-Brain).
      *   **Constraint:** Brainstorm candidate diagnoses *before* committing to one. Avoid a survey; aim for a careful diagnosis.
      *   **User's Hypothesis:** It's not biological, but verbal or moral dressed up as definitional.
      *   **Key Cases:** Permanently unconscious/ventilator/brainstem ceased, Circulation stopped/brain restorable, Anencephalic infant, Persistent Vegetative State (PVS).
      *   **Diagnostic Categories:** Verbal, Empirical, Metaphysical, Moral, or Tangled.
      *   **Method:** Argue from what sides *actually claim about cases*, not just literature citations.
      *   **Outcome:** Tell me what counts as progress (distinction, procedure, question change, or resignation).

  2.  **Brainstorming Candidate Diagnoses:**

      *   *Candidate 1: The Verbal Dispute (Stipulative Semantics).*
          *   Idea: "Death" is just a word. We are arguing over where to draw a line on a continuum.
          *   Evidence: Everyone agrees on the physiology (blood flow, electrical activity). They just disagree on which physiological marker *counts* as "death."
          *   Weakness: If it were purely verbal, we could just stipulate a legal definition and move on. But people feel *wronged* by the wrong definition. It feels deeper than semantics.

      *   *Candidate 2: The Empirical Dispute (Biological Integration).*
          *   Idea: One side is factually wrong about what constitutes biological life.
          *   Evidence: Whole-brain proponents claim the body is no longer an integrated organism without the brainstem. Circulatory proponents claim life ends when the pump stops.
          *   Weakness: As the user noted, disputants agree on the physiology. They know the body can be kept "integrated" via machines. The disagreement isn't about *if* the heart beats, but whether that beating *matters* biologically in the absence of consciousness.

      *   *Candidate 3: The Metaphysical Dispute (Ontology of the Organism).*
          *   Idea: Disagreement about what kind of thing a human being is. Is it a biological organism (somatic integration) or a person (psychological continuity)?
          *   Evidence: Higher-brain advocates treat the *person* as the unit of moral concern. Whole-brain advocates treat the *organism* as the unit.
          *   Strength: This explains why physiology doesn't settle it. You can agree on the biology but disagree on what the biology *signifies* about the entity's existence.

      *   *Candidate 4: The Moral/Political Dispute (Resource Allocation & Harm).*
          *   Idea: "Death" is a proxy for "When can we stop treating/organ harvest?"
          *   Evidence: The stakes are organ procurement, ICU bed turnover, and family grief.
          *   Strength: Explains the intractability. Changing the definition changes who gets organs and who gets billed.
          *   Weakness: Doesn't explain why people argue in *biological* terms rather than overtly moral terms. They want the moral conclusion to follow from the biological fact.

      *   *Candidate 5: The "Tangled" Diagnosis (Category Error).*
          *   Idea: It's a mix of Metaphysics and Morals, disguised as Biology.
          *   Strength: Captures the complexity. The biological criteria are proxies for metaphysical status, which drives moral permissions.

  3.  **Selecting and Refining the Diagnosis:**

      *   *Evaluation:* The Verbal diagnosis is too shallow. The Empirical diagnosis is factually incorrect (physiology is agreed upon). The Moral diagnosis is cynical but partially true. The Metaphysical diagnosis hits the core philosophical tension.
      *   *Decision:* The strongest diagnosis is that it is a **Metaphysical Dispute about Personal Identity and Organismic Integrity, functioning as a Moral Proxy.** It is *not* merely verbal because the stakes are real. It is *not* empirical because the science is settled. It looks like a definition debate, but it's actually an ontology debate.
      *   *Refinement:* I need to show how the specific cases (anencephalic, PVS, etc.) reveal this.
          *   *Whole-Brain:* Focuses on the organism as a functional whole.
          *   *Higher-Brain:* Focuses on the person as a psychological being.
          *   *Circulatory:* Focuses on the traditional boundary of irreversibility and somatic independence.
      *   *The "Dressed Up" aspect:* The user is right that it's moral/metaphysical dressed in definitional clothing. Why? Because "Death" grants moral permission (to harvest, to stop care). If we admit it's moral, we have to justify the permission directly. Hiding it behind "biology" makes it seem objective.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the role (Philosopher of Biology/Ethicist). Validate the user's hypothesis.
      *   *Section 1: Brainstorming the Candidates.* Briefly lay out the Verbal, Empirical, Metaphysical, and Moral options as requested.
      *   *Section 2: The Diagnosis.* Commit to the **Metaphysical/Moral Hybrid**. Explain why "Death" is a cluster concept trying to do two jobs (biological cessation + moral status change).
      *   *Section 3: Argument from Cases.*
          *   *PVS/Unconscious:* Higher-brain says "Person gone." Whole-brain says "Organism remains."
          *   *Anencephalic:* Higher-brain says "Never a person." Whole-brain says "Living organism."
          *   *Circulatory/DCD:* Is it death or just dying? The "touch and go" window shows the arbitrariness of the line.
      *   *Section 4: Why the Disguise?* Explain why we hide morality behind biology (objectivity, comfort, legal clarity).
      *   *Section 5: What Counts as Progress?*
          *   Not a new definition.
          *   Not a decision procedure (algorithms fail on values).
          *   *Yes:* A Change of Question. Shift from "When is he dead?" to "When do our obligations cease?"
          *   *Caveat:* Why progress is hard (cultural/religious entrenchment).

  5.  **Refining the Tone:**
      *   Needs to be analytical, precise, slightly academic but accessible.
      *   Avoid waffling. Commit to the diagnosis after the brainstorm.
      *   Ensure the "Philosopher of Biology" lens is visible (talk about integration, homeostasis, organism vs. person).
      *   Ensure the "Clinical Ethicist" lens is visible (talk about stakes, families, organs, obligations).

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I argue from what sides *claim*?
      *   *Correction:* Make sure to quote/paraphrase the typical arguments used in committee meetings (e.g., "The body is just a shell" vs. "The heart is still beating").
      *   *Check:* Did I address the "Verbal" hypothesis?
      *   *Correction:* Acknowledge it's verbal on the surface, but explain why that doesn't resolve the conflict (because the word carries moral weight).
      *   *Check:* Is the progress section actionable?
      *   *Correction:* Suggest "Decoupling" as the specific form of progress.

  7.  **Final Polish:** Check against the prompt's specific constraints (brainstorm first, then diagnose, then progress). Ensure the distinction between organism and person is clear. (Proceed to generate output).

  *(Self-Correction Note during final review)*: I need to make sure I don't just say "It's moral." I need to explain *why* it presents as biological. The "Biological Mask" is crucial. The concept of "Integration" in whole-brain death is a biological concept used to do moral work. I will emphasize this.

  8.  **Final Structure:**
      1.  Introduction.
      2.  Candidate Diagnoses (Verbal, Empirical, Metaphysical, Moral).
      3.  The Committed Diagnosis (The Ontological/Moral Mask).
      4.  Evidence from the Cases (PVS, Anencephaly, DCD).
      5.  Path to Progress (Decoupling).

