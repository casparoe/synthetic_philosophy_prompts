  **2. Orwell's *1984* (Newspeak)**
  **Verdict: Irrelevant.**
  In *1984*, deception works by removing words until the thought itself becomes impossible to formulate. Here, the vocabulary is fully intact. You could write a perfectly honest account using these exact words (as Version 2 shows). The deception does not come from a lack of vocabulary, but from how the existing vocabulary is arranged. This is not Newspeak; it is Standard English used strategically.

  **3. The View of Implication (Pragmatics)**
  **Verdict: Correct.**
  This view holds that meaning lives not just in the sentence, but in the gap between sentences. Readers assume a narrative follows the order of events (Chronology Implicature). Version 1 exploits this assumption. It tells the truth in every sentence but lies in the transition between sentence 3 and 4. The deception is not semantic (what the words mean) but pragmatic (what the reader infers from the structure).

  ***

  ### The Single Feature
  The feature doing the work is **Narrative Chronology Assumption**. Readers assume that Sentence B follows Sentence A in time unless told otherwise.

  If you delete this feature (i.e., if readers did not assume order equals time), the case collapses. The statements become a disordered list of true facts, and no false belief is formed. It does not turn into an ordinary lie, because an ordinary lie requires a false proposition (e.g., "The staff arrived at 3:25 PM"). Here, every proposition is true; only the inference is false.

  ***

  ### The Colleague's Counter
  Your colleague is right, but not for the reason he thinks. This case does not prove Orwell's advice is *wrong*; it proves it is *insufficient*. Orwell's essay targets lexical and syntactic obfuscation (hiding the ball with bad words). It does not account for structural obfuscation (hiding the ball with good words in the wrong order).

  This damages the **Essay's picture** more than the **Novel's**. The Essay promises that cleaning up language cleans up politics. This case shows that even pristine language can serve a dishonest end. The Novel predicts language will be used to control thought; this case confirms that control can happen through arrangement, not just vocabulary reduction. Tell your colleague: Orwell gave us a shield against sloppy lies, not a shield against skilled ones.
