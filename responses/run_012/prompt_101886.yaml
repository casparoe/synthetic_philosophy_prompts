      2.  The Good's Theorem Breakdown: Why it seems to contradict (c) & (d).
      3.  Pair Analysis:
          *   (b) vs (c): Utility of belief.
          *   (b) vs (d): Game theory/Control.
          *   (e) vs others: Domain distinction.
      4.  The Fix: Refine the model, don't trash the theory.
