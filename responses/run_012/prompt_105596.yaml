  I play alot of low-stakes hold'em, so I think about the game in the normal terms -- ranges, blockers, leveling, GTO versus just exploiting the guy who never folds. My buddy who took a couple econ classes keeps going on about how game theory only predicts anything if "rationality is common knowledge" -- I'm rational, your rational, I know your rational, you know I know, forever -- and how there's puzzles where assuming all that actually breaks the prediction instead of holding it up. Can you restate the whole thing in my language, as faithfully as you can, and then give me the part I care about more, which is what didn't make the trip. Is my leveling really their infinite tower of knowledge or a cut-down version of it, is my range the same animal as their beliefs about beliefs, is GTO really an equilibrium or am I kidding myself. And what do they have that poker has no word for at all -- and does that mean poker players are missing something real, or that the debate is about situations where you can't just get up and find a softer table.
