answer: |-
  Christopher Nolan's *Memento* is often discussed as a puzzle of narrative structure, but viewed through the lens of decision theory, it is a horror story about diachronic rationality. The standard money-pump argument posits that an agent with intransitive preferences (preferring A to B, B to C, and C to A) can be exploited by a sequence of trades that leaves them poorer than when they started, having gained nothing but the cycle itself. In *Memento*, the currency being pumped is not money, but agency, truth, and human life. Leonard Shelby is the ideal subject for this exploitation not merely because of his anterograde amnesia, but because his condition fractures the "diachronic agent" that rational choice theory presupposes.

  However, to read *Memento* strictly as a demonstration of the money pump is to miss the film's darker philosophical turn. The film does not simply dramatize the vulnerability of a fragmented self; it suggests that the unified self required to avoid the pump is a fiction that Leonard rationally rejects.

  ### The Fiction of the Diachronic Agent

  The money-pump argument relies on the existence of a single agent persisting through time, whose welfare can be compared at $t_1$ and $t_2$. *Memento* undermines this premise by presenting Leonard not as one agent with a memory defect, but as a succession of momentary selves. Each "Leonard" wakes up with a fresh set of preferences, usually dominated by the immediate need for purpose and the reduction of anxiety.

  Teddy and Natalie function as the bookies in this scenario. They do not need to force Leonard to do anything; they merely need to adjust the "prices" of his options. When Natalie wants Jimmy Gantz dead, she manipulates Leonard's notes to make Jimmy appear to be the target. When Teddy wants Leonard out of the way, he reveals just enough truth to redirect Leonard's rage. Because Leonard cannot carry a preference across the temporal gap of his condition, he cannot recognize the cycle. He trades his autonomy for a "Fact" (a Polaroid, a tattoo), acts on it, and then the next Leonard inherits the consequences without the context.

  This addresses Teddy's claim in the parking lot: "You don't want the truth. You want the puzzle solved." Teddy argues that Leonard cannot be made "worse off" in any way he can register. If the definition of "worse off" requires a continuous phenomenological experience of loss, then Leonard is immune to the money pump. He never feels the loss of the trade; he only feels the satisfaction of the transaction. However, the film invites the audience to occupy the position of the diachronic observer. We see the pile of bodies; we see the wasted years. The pump is real objectively, even if it is invisible subjectively. The film suggests that the "diachronic agent" is indeed a fiction, but a necessary one for moral accountability. Without it, exploitation is not just possible; it is inevitable.

  ### The System: Commitment Device or Laundering Machine?

  Leonard's "System"—the tattoos, the annotated Polaroids, the rules of conditioning—is ostensibly a commitment device. In game theory, a commitment device (like Ulysses tying himself to the mast) allows an agent to bind their future self to a rational plan, overcoming time-inconsistency. Leonard's tattoos are meant to be hard-to-change constraints that force future Leonards to adhere to the goals of past Leonards.

  Yet, the film reveals the System to be less a shield against exploitation than a machine for laundering momentary preferences into the appearance of a considered plan. Because the System relies on input ("Fact 6," license plates, names), it is vulnerable to data poisoning. When Natalie manipulates Leonard into beating up Dodd, she does not break his System; she feeds it. She provides a narrative that fits his existing heuristics (men like Dodd are dangerous; I must defend myself).

  The System restores the *illusion* of diachronic rationality. It allows Leonard-Now to feel that he is serving Leonard-Then, when in reality, he is serving whoever last spoke to him. The tattoos do not preserve truth; they preserve *intent*. And since intent can be hijacked, the System becomes a mechanism by which any passing preference can be elevated to the status of a sacred vow. It is a commitment device that commits the agent to whatever lie is most recently inscribed.

  ### The Self-Pump: Complicity in Exploitation

  The film's most devastating contribution to the debate comes in the final sequence, where Leonard chooses to falsify his own notes to ensure he will kill Teddy. He writes "Don't believe his lies" on Teddy's photograph and selectively tattoos Teddy's license plate as "Fact 5."

  In standard money-pump scenarios, there is an exploiter and a victim. Here, Leonard becomes both. He recognizes that Teddy has used him, that the "John G" quest is complete, and that without a new target, he is nothing. To avoid the existential void of a solved puzzle, Leonard engineers a cycle. He sets up his future self to be pumped.

  This is a "self-pump." Leonard knowingly sacrifices his future moral standing and autonomy to purchase present meaning. He trades the truth (which renders him idle) for a lie (which renders him a vigilante). Standard rational choice theory struggles to account for this because it assumes agents prefer more truth and more autonomy to less. Leonard demonstrates that an agent may prefer a coherent narrative to a coherent reality. He is not failing to be rational; he is exercising a meta-rationality that values the *capacity to act* over the *correctness of the action*. He chooses the pump because the alternative is the cessation of agency.

  ### Where the Analogy Breaks: Narrative vs. Preference

  It is here that we must be honest about where *Memento* resists the philosophical frame. The money-pump argument is concerned with preference consistency. It assumes that if an agent could see the cycle, they would want to escape it. *Memento* suggests that the agent might want to stay in the cycle because the cycle *is* the identity.

  Leonard's interest is not in transitive preferences; it is in the narrative construction of agency. The money pump assumes a tidy sequence of trades. Leonard's life is a messy, non-linear reconstruction of motive. When he burns the photograph of his wife's insulin or decides to ignore the possibility that he himself administered the fatal dose, he is not optimizing preferences. He is editing a script. The film posits that for a human being, "rationality" is not about avoiding exploitation, but about maintaining a story in which one is the protagonist.

  The scene where Leonard alternates between trusting and distrusting Teddy illustrates this. It is not a fluctuation in preference regarding Teddy's utility; it is a fluctuation in the *narrative utility* of Teddy. Sometimes Teddy is the mentor (useful); sometimes he is the villain (useful). Leonard's "irrationality" is actually a desperate attempt to keep the story going. The philosophical frame of the money pump cannot fully capture this because it treats the "loss" as a decrement in welfare. For Leonard, the "loss" of the quest is a decrement in *existence*.

  ### Conclusion: The Rational Decline of the Unified Self

  What, then, does *Memento* add to the philosophical debate about diachronic rationality that the tidy literature of money pumps does not?

  First, it introduces the concept of **complicit pumping**. The literature imagines an agent who is tricked. *Memento* shows us an agent who hires the trickster. It suggests that we may rationally choose to fragment our diachronic unity if that unity demands truths we cannot bear. Leonard declines the value of a unified self because the unified self would have to admit that his wife is dead by his hand (perhaps) and his vengeance is complete.

  Second, the film argues that the **value of the diachronic self is contingent**. We assume it is always better to be a continuous, consistent agent. Leonard shows that continuity can be a prison. If the only way to maintain a continuous self is to accept a narrative of endless, futile vengeance, then fragmentation might be the kinder option. The "succession of momentary selves" allows each Leonard to wake up with hope, even if that hope is manufactured.

  Ultimately, *Memento* suggests that the money pump is not just a failure of logic, but a feature of the human condition. We are all Leonard to some degree, unable to fully remember our past motivations, susceptible to the framing of our present circumstances, and often complicit in the stories that exploit us. We do not just suffer the pump; we build the machine. And we do it because the alternative—a world without a puzzle to solve—is a world in which we have no reason to get out of bed. Leonard Shelby is not a cautionary tale about the loss of memory; he is a dark mirror for the loss of meaning, showing that we will gladly trade our future selves for a reason to act in the present.
