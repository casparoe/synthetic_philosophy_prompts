          *   *Conclusion:* Likely fails for museums (especially stolen/looted items).
      *   *Item 4: The "Might Makes Right" Claim.* "We have it, therefore we deserve it."
          *   *Truth:* False as law, true as power dynamic.
          *   *Conclusion:* Collapses into realpolitik.
      *   *Item 5: The Stability/Policy Argument.* "Uncertainty is bad for museums."
