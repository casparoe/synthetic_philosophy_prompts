prompt: |-
  OK so I'm in a museum studies seminar and we keep going round in circles on restitution — Benin Bronzes, Parthenon Marbles, all of it. Last week someone killed the discussion with 'well, possession is nine tenths of the law', said it like it was QED, and half the room nodded. I dont think a single person there could have told you what the nine tenths were supposed to be nine tenths *of*. I'm still annoyed about it.

  Can you lay out the different things that sentence could actually be claiming — start with the ones that are basically trivial and work up to the ones doing real work — and for each one say whether it's true, contentious but defensible, or just false, and whether it would actually get him his conclusion (that the objects stay put)? I think the interesting question is which reading he must have had in mind for it to settle anything at all, and whether that reading is even available to him.

  One more thing: someone else in the group said something about adverse possession, and then we ran out of time. I've got a vague sense that whatever that is, it comes with conditions attached, which would matter enormously here. Definately flag anything like that — a reading that sounds like it supports keeping the objects but only does so if some further condition is met.

  And if some of the readings just collapse into 'might makes right', or into nothing more than a prediction about who tends to win in court, say so plainly, because I suspect that's where the slogan actually lives and I want to be able to say that without it sounding like I'm only moralising.

  Lay it out as a list I can bring to the next session. British English please — it's going into my notes for a UK course.
reasoning: |-
