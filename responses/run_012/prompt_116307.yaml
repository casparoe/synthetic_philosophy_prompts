      *   **Tone:** Academic but accessible, suitable for seminar notes, British English spelling and phrasing.

  2.  **Deconstruct the Phrase ("Possession is nine-tenths of the law"):**
      *   *Origin:* It's a proverb, not a statute. It doesn't actually exist in black-letter law as a fixed ratio.
      *   *Meaning 1: Descriptive/Empirical.* If you have it, you're likely to keep it because suing is hard. (Prediction).
      *   *Meaning 2: Burden of Proof.* Possession shifts the burden to the claimant. (Procedural).
