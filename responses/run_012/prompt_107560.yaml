prompt: |-
  I recently became a volunteer moderator for the clinical-questions section of a nursing forum, and our worst problems are not obvious misinformation but answers that are true, or sincerely believed, or confidently stated by someone who was not in a position to know. I want a decision procedure my co-moderators and I can actually run on a reported post, grounded in the philosophical debate about whether assertion is governed by knowledge, truth, or belief, but usable by someone who has never read that literature. The forum already distinguishes clinical claims from experience reports; the procedure applies only to the former, and it should also say when a poster must retract a claim rather than merely edit it. Give me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a clear leave-up or remove, and where it must hand the decision to a human because the remaining question is one of community values rather than fact. Then run it on three cases: a true clinical claim whose poster admits they were guessing; a false claim that is sincerely believed and carefully hedged; and a true, believed, confidently stated claim based entirely on one anonymous online comment. I expect the procedure to give me at least one result I will not like, and I want you to say plainly where it will misfire and what it cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer moderator for a nursing forum's clinical-questions section.
      *   **Problem:** Not obvious misinformation, but answers that are *true*, *sincerely believed*, or *confidently stated* by someone *not in a position to know* (epistemic authority issues).
      *   **Task:** Create a decision procedure for reported posts.
      *   **Constraints:**
          *   Grounded in philosophical debate on assertion (Knowledge Norm vs. Truth Norm vs. Belief Norm).
          *   Usable by non-philosophers (no jargon).
          *   Applies *only* to clinical claims (not experience reports).
          *   Must distinguish between "edit" vs. "retract/remove".
          *   Must identify where human judgment (community values) is needed.
          *   Must run the procedure on three specific cases.
          *   Must acknowledge limitations/misfires.
      *   **Tone:** Practical, authoritative, clear, honest about limitations.

  2.  **Philosophical Grounding (Internal Knowledge Retrieval):**
      *   *Knowledge Norm of Assertion (KNA):* You should assert $p$ only if you know $p$. (Williamson, etc.) This fits the "not in a position to know" problem best.
      *   *Truth Norm:* You should assert $p$ only if $p$ is true. (Problem: Lucky guesses get a pass.)
      *   *Belief Norm:* You should assert $p$ only if you believe $p$. (Problem: Allows confident ignorance.)
      *   *Justification/Warrant:* You need evidence/reasoning.
      *   *Application:* For clinical safety, KNA is the gold standard, but "knowledge" is hard to verify. We need a proxy for "position to know."
      *   *Retraction vs. Edit:* Editing fixes the content; retraction removes the authority claim. If the epistemic foundation is rotten, the whole post might need removal/retraction.

  3.  **Drafting the Decision Procedure (The "Epistemic Triage Protocol"):**
      *   *Goal:* Make it a flowchart style without actual graphics. Step-by-step questions.
      *   *Step 1: Truth Check.* (Truth Norm). Is it factually correct?
      *   *Step 2: Basis Check.* (Justification). Where did this come from? (Guidelines, personal knowledge, guess?)
      *   *Step 3: Authority Check.* (Knowledge Norm). Is the poster qualified to interpret this source for this context?
      *   *Step 4: Confidence/Hedging.* (Belief Norm/Pragmatics). Does the tone match the evidence?
      *   *Decision Points:* Leave Up, Edit, Remove/Retract, Escalate.

      *Refining for the Prompt:* The prompt asks for specific questions, sufficient answers, stop points, and hand-off points.
      *   *Constraint:* Must handle the "true but guessing" vs "false but believed" nuance.
      *   *Constraint:* Must distinguish edit vs. retract.

      *Revised Procedure Structure:*
      1.  **Verification:** Is the clinical content accurate according to current standards?
      2.  **Source Attribution:** Can the poster point to a verifiable, authoritative source?
      3.  **Epistemic Position:** Does the poster have the training/role to apply this source here?
      4.  **Certainty Calibration:** Does the language reflect the strength of the evidence?

      *Let's align with the philosophical norms:*
      *   Q1 (Truth): Addresses the Truth Norm.
      *   Q2 (Justification): Addresses the gap between True and Known.
      *   Q3 (Authority): Addresses the "position to know."
      *   Q4 (Retraction): Addresses the integrity of the assertion.

  4.  **Developing the Three Test Cases:**
      *   *Case 1: True claim, admits guessing.* (Truth Norm pass, Knowledge Norm fail).
      *   *Case 2: False claim, sincerely believed, hedged.* (Truth Norm fail, Belief Norm pass).
      *   *Case 3: True claim, believed, confident, based on one anonymous comment.* (Truth Norm pass, Belief Norm pass, Justification/Authority fail).

  5.  **Running the Procedure (Mental Simulation):**
      *   *Case 1:* True? Yes. Source? None (guessing). Action: Remove/Retract. (Why? Lucky guesses are dangerous in nursing). *User expectation:* "I expect the procedure to give me at least one result I will not like." This might be the one. Moderators often want to keep true info. But epistemically, it's toxic.
      *   *Case 2:* False? Yes. Source? Belief. Action: Remove. (Standard misinformation).
      *   *Case 3:* True? Yes. Source? Anonymous comment. Action: Remove/Retract. (Hearsay).

      *Wait, I need to ensure the "Edit vs. Retract" distinction is clear.*
      *   Edit: The core info is salvageable if sourced correctly.
      *   Retract: The assertion itself was improper.
      *   Case 1 (Guessing): If they admit guessing, the assertion was improper. Retract.
      *   Case 3 (Anonymous): The info might be right, but the basis is bad. If they can't find a real source, Retract. If they can find a real source, Edit.

      *Refining the "Dislike" aspect:* The prompt says "I expect the procedure to give me at least one result I will not like."
      *   Likely candidate: Case 1 (True claim, admits guessing). Intuitively, you want to keep true info. But the KNA (Knowledge Norm) says you must remove it because it encourages guessing. I need to highlight this tension.

  6.  **Addressing Limitations/Misfires:**
      *   Where does it fail?
      *   Community Values: What counts as "authoritative"? (Hospital policy vs. National Guideline).
      *   Urgency: In an emergency, is a guess better than silence? (The procedure assumes non-emergency forum time).
      *   Tone Policing: Distinguishing confidence from arrogance.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the philosophical basis (Knowledge Norm) without jargon.
      *   **The Protocol:** Numbered steps, questions, pass/fail criteria, actions.
      *   **The Hand-off:** Explicitly state where human judgment takes over.
      *   **Case Studies:** Run the three cases through the protocol.
      *   **The Misfire:** Explicitly state where the protocol conflicts with intuition/utility.
      *   **The Unsettled:** Explicitly state what the protocol cannot decide.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Philosophy:* Use "Right to Assert" instead of "Knowledge Norm."
      *   *Step 1:* Fact Check. (True/False).
      *   *Step 2:* Evidence Check. (Source?).
      *   *Step 3:* Competence Check. (Role/Scope).
      *   *Step 4:* Calibration Check. (Hedging).
      *   *Decision:* Keep, Edit, Remove.
      *   *Retraction:* When the *act* of asserting was wrong, not just the content.

      *(Self-Correction during drafting)*: Make sure the distinction between "Edit" and "Retract" is sharp.
      *   *Edit:* Content is useful, but needs citation/qualification.
      *   *Retract/Remove:* The poster had no business making the claim *at all*.
      *   *Case 1 (Guessing):* Even if true, they had no business asserting it. -> Retract.
      *   *Case 3 (Anonymous):* They had no business asserting it based on that. -> Retract (unless they can find real source -> Edit).

      *Wait, the prompt asks for "where it must hand the decision to a human because the remaining question is one of community values rather than fact."*
      *   I need to build a specific "Escalation" step for this. Usually around what counts as "sufficient authority" (e.g., is a blog post by a famous nurse enough?).

  9.  **Final Review against Constraints:**
      *   Grounded in philosophy? Yes (KNA focus).
      *   Usable by non-philosophers? Yes (plain language).
      *   Clinical claims only? Yes (stated in intro).
      *   Edit vs. Retract? Yes.
      *   Human hand-off? Yes.
      *   Three cases run? Yes.
      *   Dislike/Misfire acknowledged? Yes.

  10. **Final Polish:** Ensure tone is supportive but rigorous. (Proceed to generate output).

  *(Self-Correction on Case 1)*: If the poster *admits* they were guessing in the post or in a mod query? The prompt says "a true clinical claim whose poster admits they were guessing." If it's in the post, it's easy. If it's in a mod query, it reveals the epistemic state. I will assume the admission is available to the mod (either in text or via mod mail). The procedure should treat "admitted guessing" as a failure of the Knowledge Norm.

  *(Self-Correction on Case 3)*: "Based entirely on one anonymous online comment." This is hearsay. Even if true, it's not knowledge. It fails the Justification condition.

  *(Refining the "Dislike")*: The result the user won't like is likely removing *true* information (Case 1). This highlights the conflict between *Information Utility* (Truth Norm) and *Epistemic Safety* (Knowledge Norm). I must be explicit about this.

