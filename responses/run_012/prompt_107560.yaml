answer: |-
  ### The Epistemic Triage Protocol (ETP)

  **Philosophical Basis:** This procedure prioritizes the **Knowledge Norm of Assertion**. In clinical contexts, it is not enough for a claim to be *true* (Truth Norm) or *believed* (Belief Norm). The poster must be in a **position to know**. A lucky guess is as dangerous as a confident lie because it encourages others to rely on unauthorized intuition.

  **Scope:** Apply only to posts making **clinical claims** (instructions, protocols, physiological facts). Do not apply to **experience reports** ("This worked for me once").

  ---

  ### Part 1: The Decision Procedure

  Ask the following four questions in order. Do not proceed to the next question until the current one is resolved.

  #### Step 1: The Truth Check (The Truth Norm)
  **Question:** Is the clinical content factually accurate according to current, widely accepted medical standards (guidelines, textbooks, hospital policy)?
  *   **Sufficient Answer:** Yes (verified by reference) OR No (verified by reference).
  *   **If NO:** Go to **Decision A**.
  *   **If YES:** Go to Step 2.

  > **Decision A (Remove):** The claim is false. Remove the post.
  > *Note: If the poster is sincerely trying to help, invite them to re-post with correct information.*

  #### Step 2: The Source Check (The Justification Condition)
  **Question:** Can the poster identify the specific source of this information?
  *   **Sufficient Answer:**
      *   **Pass:** A verifiable, authoritative source (e.g., "2023 AHA Guidelines," "Hospital Protocol X," "Lehne's Pharmacology").
      *   **Fail:** "I heard," "I read online," "I was taught," or "I guessed."
  *   **If FAIL:** Go to **Decision B**.
  *   **If PASS:** Go to Step 3.

  > **Decision B (Retract):** The claim may be true, but the poster admits they are not in a position to know. The assertion itself is improper.
  > *Action:* Remove the post or strike-through the claim with a moderator note: *"Claim removed: Accurate information requires verifiable sourcing, not intuition."* Do not allow a simple edit; the epistemic foundation is rotten.

  #### Step 3: The Authority Check (The Competence Condition)
  **Question:** Does the poster have the professional standing to interpret and apply this source in this context?
  *   **Sufficient Answer:**
      *   **Pass:** The poster's credentials match the claim (e.g., an RN discussing nursing scope, an NP discussing prescribing within their jurisdiction).
      *   **Fail:** The poster is outside their scope (e.g., a student giving definitive protocol advice, an OR nurse advising on ICU titration without ICU experience, a layperson).
  *   **If FAIL:** Go to **Decision C**.
  *   **If PASS:** Go to Step 4.

  > **Decision C (Escalate to Human):** This is a **Community Value** judgment.
  > *Reason:* "Scope of practice" varies by region and community culture. Is a student's textbook knowledge helpful or dangerous? The moderators must decide the community's tolerance for peer-learning vs. strict hierarchy.

  #### Step 4: The Calibration Check (The Belief Norm)
  **Question:** Does the confidence of the language match the strength of the evidence?
  *   **Sufficient Answer:**
      *   **Pass:** High confidence for guidelines ("You must..."); Hedging for emerging evidence ("Consider...", "Some evidence suggests...").
      *   **Fail:** Absolute certainty for weak evidence ("This definitely works") OR excessive hedging for hard facts ("I think maybe 2+2 is 4?").
  *   **If FAIL:** Go to **Decision D**.
  *   **If PASS:** Go to **Final Decision**.

  > **Decision D (Edit):** The information is sound, but the tone is misleading.
  > *Action:* Require the poster to edit the language to reflect the uncertainty. If they refuse, remove.

  > **Final Decision (Leave Up):** The claim is True, Sourced, Authorized, and Calibrated.

  ---

  ### Part 2: Running the Cases

  Here is how the ETP handles the three problematic scenarios you provided.

  #### Case 1: The Lucky Guess
  **Scenario:** A poster gives a correct dosage calculation but admits in the thread (or mod mail), "I don't actually know the protocol, I just guessed based on math."
  1.  **Truth Check:** **PASS.** (The math is correct).
  2.  **Source Check:** **FAIL.** (Poster admits guessing).
  3.  **Result:** **Decision B (Retract).**
  4.  **Action:** Remove the post. Do not allow an edit.
  5.  **Rationale:** Under the Knowledge Norm, a true guess is epistemically identical to a lie. It teaches the community that intuition is a valid substitute for verification.

  #### Case 2: The Sincere Error
  **Scenario:** A poster confidently states a contraindication that is false. They are sincere, cite outdated training, and hedge slightly ("I believe this is contraindicated").
  1.  **Truth Check:** **FAIL.** (The clinical claim is false).
  2.  **Result:** **Decision A (Remove).**
  3.  **Action:** Remove immediately.
  4.  **Rationale:** Truth Norm trumps all. Sincerity does not prevent patient harm.

  #### Case 3: The Hearsay Truth
  **Scenario:** A poster confidently states a rare drug interaction is real. It *is* real. They believe it. But their only source is "A comment I saw on Reddit from an anonymous pharmacist."
  1.  **Truth Check:** **PASS.** (The interaction exists).
  2.  **Source Check:** **FAIL.** (Anonymous online comment is not authoritative).
  3.  **Result:** **Decision B (Retract).**
  4.  **Action:** Remove the post.
  5.  **Rationale:** The poster is not in a position to know. They are repeating hearsay. Even though the info is true, the *chain of justification* is broken. If they can find a primary source (e.g., FDA label), they may re-post (Edit), but the current assertion must be retracted.

  ---

  ### Part 3: The Misfire and The Unsettled

  You asked me to say plainly where this will misfire and what it cannot settle.

  #### 1. The Result You Will Not Like (The Misfire)
  **Case 1 (The Lucky Guess)** will frustrate you.
  *   **Why:** Your instinct as a moderator is to preserve *useful information*. If the dosage is correct, removing it feels like destroying value.
  *   **The Conflict:** This is the clash between the **Truth Norm** (keep true info) and the **Knowledge Norm** (punish unauthorized assertion).
  *   **Why the Procedure Wins:** In clinical forums, *process* is safety. If you leave up a true guess, you validate the method of guessing. The next person will guess, but they will be wrong. You must sacrifice the true data point to protect the epistemic culture of the forum. **You must remove true information if it was arrived at improperly.**

  #### 2. The Human Hand-Off (The Unsettled)
  **Step 3 (The Authority Check)** is where the procedure stops and community values begin.
  *   **The Problem:** What counts as "Authority"?
      *   Is a new grad RN authorized to correct a 20-year veteran on a protocol?
      *   Is a nurse in the UK authorized to assert standards for a nurse in the US?
      *   Is a textbook source sufficient, or must it be a peer-reviewed journal?
  *   **Why the Procedure Can't Decide:** These are not facts; they are **social contracts**. The ETP identifies *that* there is a mismatch between the poster and the claim, but it cannot decide if that mismatch is *acceptable* for your specific community.
  *   **Instruction:** When Step 3 fails, do not guess. Bring it to the mod team. Ask: *"Is this level of credentialing acceptable for this level of claim in our community?"*

  #### 3. The Blind Spot
  The ETP assumes **time is not of the essence**.
  *   **The Limitation:** If a poster says, "I think the patient is crashing, check the airway," and they are guessing, the Truth/Knowledge Norms say "Remove." But practical utility says "Keep, it might save a life."
  *   **The Fix:** The ETP applies to *asynchronous forum discussion*. If a post implies immediate emergency intervention, it bypasses the ETP and goes to a "Emergency Protocol" (usually removal and redirection to emergency services) regardless of truth. Do not use the ETP for triage advice.

  ### Summary for Co-Moderators
  *   **Truth is not enough.** (Case 1)
  *   **Sincerity is not enough.** (Case 2)
  *   **Confidence is not enough.** (Case 3)
  *   **Only Knowledge (Truth + Source + Authority) is enough.**
  *   **When in doubt about credentials, ask the team.** (Step 3)
