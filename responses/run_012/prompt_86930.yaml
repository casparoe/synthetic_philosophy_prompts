prompt: |-
  Right, so I've somehow ended up running the session at my union branch next month — the Marx-and-the-machines one, because everyone's wound up about AI at the moment and I got volunteered — and what I need from you is a plan for how I teach it, not an explanation of it. I know roughly what I think; the problem is the order.

  Context you'll need: my mate Dan and I had a two-hour arguement about this on Saturday, and I want the session built so that it survives him, because he's exactly what the room will sound like. His line was that Marx was basically a Luddite who romanticised handloom weavers, and that the whole thing is simple anyway — technology's neutral, ownership is the problem, so co-ops and we're done. I said that isn't Marx: machinery under capital isn't a neutral tool that happens to get misused, it gets brought in as a means of control over labour, and that's why he can be scathing about what it does to the working day while still thinking the development of the productive forces is the precondition for getting out of this. Dan said I was having it both ways. We got nowhere, and I realised I don't actually know how to build this up from scratch for people who've never read a word of him.

  So: fifteen people, mix of branch members and a couple of software engineers, no philosophy, no economics, one hour, whiteboard. Plan the explanation for me. What has to be in place before the idea that machinery under capital is a relation of domination rather than a neutral instrument is even sayable — I assume something about value and surplus has to land first, but tell me the actual dependency chain and what I can safely skip. What's the one example that carries the whole hour, and what does it have to have and not have — do I go with the power loom and the handloom weavers, or is that too far from a room that's worried about chatbots? Where in the sequence do I head off each of the things Dan said — the Luddite charge, the neutral-tool line — plus the one I only noticed afterwards, which is that if machinery immiserates workers then Marx is just a technophobe with extra steps, and the move where someone says he was writing about looms and we're talking about LLMs. And what single question do I put to the room at the end that tells me whether it landed rather than whether they nodded. Also tell me what I should openly refuse to cover in an hour, and say so out loud — I'm guessing the falling rate of profit, tell me if I'm wrong.

  Lead with the bottom line in your first sentence — the one thing the hour has to land — then the plan, no preamble and don't restate any of this back at me.
