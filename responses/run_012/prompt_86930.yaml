      *   **Constraint 1 (Critical):** Lead with the bottom line in the first sentence (the one thing the hour has to land).
      *   **Constraint 2:** No preamble, don't restate the prompt.
      *   **Constraint 3:** Address specific objections (Dan's arguments: Marx = Luddite, Technology = Neutral, Co-ops = Solution, Technophobe charge, Looms vs. LLMs).
      *   **Constraint 4:** Define the dependency chain (what concepts must land first).
      *   **Constraint 5:** Choose one core example (Power Loom vs. Chatbot).
      *   **Constraint 6:** Identify what to explicitly exclude (e.g., Falling Rate of Profit).
      *   **Constraint 7:** Provide a single closing question to test understanding (not just nodding).
      *   **Tone:** Direct, practical, structured for a whiteboard session.

  2.  **Determine the Bottom Line:**
      *   What is the core message? It's not "AI is bad" or "AI is good." It's that under capitalism, machinery isn't just a tool for making things easier; it's a tool for managing labor power and extracting surplus value. Therefore, the fight isn't against the machine, but against *how* the machine is used to discipline workers.
      *   *Draft:* The hour must land the idea that under capitalism, machinery is never just a tool for production, but a weapon for disciplining labor and extracting surplus value.

  3.  **Structure the Hour (60 minutes):**
      *   Need to build concepts sequentially.
      *   *Phase 1: The Setup (Value & Labor).* Can't talk about machinery without talking about what labor is under capitalism.
      *   *Phase 2: The Machine's Role.* How does the machine change the labor process?
      *   *Phase 3: Addressing Objections.* Dan's points (Neutral, Luddite, Co-ops).
      *   *Phase 4: Application to AI.* Looms to LLMs.
      *   *Phase 5: Closing Question.*

  4.  **Dependency Chain:**
      *   To say "machinery is domination," you first need to establish that labor under capitalism is sold as a commodity (labor power).
      *   Then, you need to establish that profit comes from surplus value (unpaid labor time).
      *   Then, you can show that machinery is introduced not to lighten loads, but to increase surplus value (relative surplus value) and deskilling/control.
      *   *Skip:* Constant vs. Variable capital deep dive, Falling Rate of Profit, Transformation Problem, Historical specifics of 1848 vs 1867.

  5.  **Core Example:**
      *   User asks: Power Loom or Chatbot?
      *   *Decision:* Start with the Power Loom (concrete, historical, Marx's actual example) to establish the theory, then map it directly to the Chatbot. Using only Chatbots risks getting bogged down in technical specifics of AI that distract from the social relation. Using only Looms risks the "that was then" objection.
      *   *Strategy:* Use the Loom to build the theory, use the Chatbot to test it.
      *   *Requirements for the example:* Must show speed-up, deskilling, and management control, not just "jobs lost."

  6.  **Addressing Dan's Objections:**
      *   *Marx = Luddite:* Address by showing Marx supported machinery's potential to reduce work, but hated its capitalist use.
      *   *Technology = Neutral:* Address by showing the machine is designed *for* control, not just production.
      *   *Co-ops = Done:* Address by showing market competition forces co-ops to act like capitalists regarding technology.
      *   *Technophobe:* Address by distinguishing between "machinery" and "capitalist use of machinery."
      *   *Looms vs. LLMs:* Address by mapping the *function* (control/extraction) not the *form*.

  7.  **What to Exclude:**
      *   Falling Rate of Profit (too complex, distracts from labor process).
      *   Detailed value theory math (socially necessary labor time calculations).
      *   Vision of Communism (keep it focused on the struggle under capitalism).

  8.  **Closing Question:**
      *   Needs to test if they see the *relation*, not just the *tool*.
      *   *Bad:* "Is AI good or bad?"
      *   *Good:* "If we owned this AI tomorrow, what specific feature would we change to stop it from monitoring our breaks?" (Forces them to identify the control mechanism).

  9.  **Drafting the Plan (Iterative refinement):**
