      *   Include closing question.

      *Self-Correction on Bottom Line:* Make it punchy. "The hour must land the distinction between machinery as a physical object and machinery as a capitalist relation of control."

      *Self-Correction on Plan:* Ensure the "Dan" points are woven in, not just a separate section, or else it becomes a debate. Better to have a specific "Objections" slot to validate the user's preparation. Let's put it mid-session after the theory is laid out.

      *Dependency Chain:* Labor Power -> Surplus Value -> Machinery as Means to Increase Surplus -> Machinery as Control.

      *Exclusions:* Falling Rate of Profit is correct to exclude. Also exclude "What is Communism?"

      *Closing Question:* Needs to be actionable. "If this tool was designed by us, what function would be deleted?"

      *Let's tighten the timing.* 60 mins goes fast.
      0-10: Context & Labor Power.
      10-25: The Machine & Surplus Value.
      25-40: Dan's Objections (Neutral/Luddite/Co-ops).
      40-50: AI Application.
