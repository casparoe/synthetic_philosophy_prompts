answer: |-
  The hour must land the distinction between machinery as a physical object and machinery as a capitalist relation of control.

  ### The Dependency Chain
  You cannot argue that machinery is domination until these three concepts are accepted in order:
  1.  **Labor Power is a Commodity:** Workers don't sell "work"; they sell time/capacity. The boss owns the time.
  2.  **Surplus Value comes from Time:** Profit is generated when workers produce more value than the cost of their wages within that purchased time.
  3.  **Competition Forces Accumulation:** Capitalists must constantly revolutionize production to survive against other capitalists, not just to be "greedy."

  **Skip these explicitly:** Tell them at the start you are *not* covering the Falling Rate of Profit (too abstract for labor process), the Transformation Problem, or a vision of Communism. Say: "We are diagnosing the machine under capitalism, not designing the future today."

  ### The Core Example
  **Use the Power Loom, not the Chatbot, for the theory.**
  *   **Why:** The Loom has a settled historical outcome everyone knows (deskilling, misery, factory discipline). The Chatbot is too contested; engineers will argue technical specs, members will argue job losses.
  *   **Requirement:** The example must show **speed-up** (more output per hour), **deskilling** (less training needed), and **surveillance** (pace set by machine, not worker).
  *   **The Bridge:** Once the logic is built on the Loom, ask the software engineers in the room to map those three functions onto the AI tools they use.

  ### The Hour Plan (60 Minutes)

  **00–10: The Setup (Labor Power)**
  *   **Whiteboard:** Draw a timeline of an 8-hour day.
  *   **Ask:** "If I pay you for 8 hours, do I own your work or your time?"
  *   **Point:** Under capitalism, I buy your time. If you finish early, I don't let you go; I make you work faster.
  *   **Goal:** Establish that the conflict is over the intensity and ownership of time, not just the wage rate.

  **10–25: The Machine Enters (Relative Surplus Value)**
  *   **Whiteboard:** Draw a Handloom vs. Power Loom.
  *   **Explain:** The Power Loom isn't introduced to make weaving easier. It's introduced to produce more cloth in the same 8 hours.
  *   **Key Mechanism:** If one machine does the work of ten men, the value of cloth drops. The worker now reproduces their wage in 2 hours instead of 4. The remaining 6 hours are pure surplus for the boss.
  *   **The Control:** The machine sets the pace. The worker serves the machine. This is where "machinery as domination" lands: the machine enforces the speed required to extract that surplus.

  **25–40: The "Dan" Objections (Hard Stop)**
  *   **Objection 1: "Tech is Neutral."**
      *   **Counter:** A tool is neutral; a factory system is not. If a tool is designed to monitor keystrokes or lock out union organizers, its design embodies a social relation, not just engineering.
      *   **Phrase:** "The machine is the material form of the boss's authority."
  *   **Objection 2: "Marx was a Luddite/Technophobe."**
      *   **Counter:** Marx argued machinery *could* shorten the working day and lighten loads. He hated that under capital, it lengthened the day and intensified labor. He wanted *more* technology, used differently.
  *   **Objection 3: "Co-ops Fix It."**
      *   **Counter:** A co-op still competes in a capitalist market. If they don't use the AI to cut costs/speed up, a rival firm undercuts them. The market forces the co-op to use the machine as a weapon, even if the workers own it.

  **40–50: AI Application (The Bridge)**
  *   **Action:** Turn to the software engineers and the branch members.
  *   **Ask:** "Map the Loom to the Chatbot."
      *   **Speed-up:** Code generation means more features per sprint.
      *   **Deskilling:** Junior devs become prompt reviewers; senior devs lose oversight.
      *   **Control:** Productivity monitoring via commit counts rather than outcome quality.
  *   **Point:** It's not about "AI taking jobs"; it's about "AI managing the remaining jobs harder."

  **50–60: Discussion & The Test**
  *   Open floor for specific grievances.
  *   **The Closing Question:** Do not ask "Does this make sense?"
  *   **Ask this:** "If we took control of this AI tool tomorrow, what is the one feature we would delete immediately because it exists only to measure us rather than help us work?"
      *   **Why:** If they answer "the monitoring dashboard" or "the productivity score," they understand the relation. If they answer "the AI itself," they haven't landed the point.

  ### Tactical Notes for the Whiteboard
  *   **Draw the Box:** Draw a box around "The Machine." Write "Capital" outside the box. Draw an arrow from Capital into the Machine labeled "Design Logic."
  *   **Keep it Material:** When someone says "AI is different," ask: "Who owns the server? Who owns the data? Who sets the parameters?"
  *   **Manage Dan:** If he interrupts with "But ownership...", point to the Co-op section you flagged. Say: "We covered market competition forcing co-ops to act like capitalists at minute 35—let's stick to the labor process."
