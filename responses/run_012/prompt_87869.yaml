      *   **Clarify the Distinction (Utility vs. Consumption):** This is the pivot.
          *   $\delta$ discounts *utility*. Setting $\delta=0$ means future utility counts equally.
          *   $r$ discounts *consumption*. Setting $r = \eta g$ means future *dollars* count less because they buy less utility.
          *   *Analogy:* Exchanging currencies. If future currency is "inflated" (due to wealth/diminishing returns), you exchange less present currency for it. This isn't bias against the future person; it's efficiency in transfer.
      *   **Address the "Category Mistake" Charge:**
          *   It is *not* a category mistake if the goal is to maximize utility using consumption as the instrument.
          *   It *becomes* a category mistake if we treat consumption as the *telos* (end goal) rather than the *instrument*.
          *   If the policy affects *utility directly* (e.g., preventing pain, saving lives) rather than income, the $\eta g$ term should not apply in the same way.
      *   **Address the "Disguised Time Preference" Charge:**
          *   It's not time preference; it's *inequality aversion* ($\eta$). We prefer equality across time. If future people are richer, giving them more money increases inequality (intertemporally).
      *   **What Follows? (The "So What?"):**
          *   **For Climate Change (Marginal Damages):** The Stern Review vs. Nordhaus debate. Stern used $\delta \approx 0$, low $\eta$. Nordhaus used higher $\delta$ or $\eta$. If user is right, we should use $\delta=0$ but keep $\eta g$ for consumption transfers. *However*, if damages are non-monetary (lives lost), we shouldn't discount the value of a life by future wealth (maybe).
          *   **For Existential Risk (Longtermism):** The Ramsey rule breaks down. If the intervention prevents extinction, $g$ is endogenous. We aren't transferring consumption; we are securing the possibility of *any* consumption. Here, the discount rate should be near zero (probability of extinction only).
          *   **For CBA Practice:** We need "shadow prices" that convert non-market goods (life, health) into utility, then into consumption equivalents. We must stop discounting *lives* by the growth rate.
      *   **Potential Pitfalls (Talking the User Out/Refining):**
          *   The "Overtaking Criterion": If growth continues forever, total utility might be infinite. Discounting is needed for convergence (mathematical necessity), not just ethics.
          *   Uncertainty: Weitzman's Gamma Discounting.
