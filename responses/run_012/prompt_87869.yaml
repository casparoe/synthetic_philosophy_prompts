answer: |-
  You have put your finger on one of the most persistent and significant tensions in intergenerational ethics and welfare economics. Your suspicion is shared by heavyweights in the field—John Broome, Derek Parfit, and Nicholas Stern have all wrestled with versions of this exact problem.

  You are asking whether the $\eta g$ term (elasticity of marginal utility times growth) in the Ramsey Rule is a legitimate adjustment for diminishing returns or a surreptitious reintroduction of the pure time preference ($\delta$) that Ramsey outlawed.

  Here is the breakdown: You are theoretically correct that a distinction must be drawn between utility and consumption, but you are practically correct that standard cost-benefit analysis (CBA) often conflates them in a way that validates your suspicion.

  ### 1. The Theoretical Defense: Utility vs. Consumption

  To be "talked out" of the confusion charge, one must accept a strict distinction that standard economics maintains but often obscures in practice: **We do not discount welfare; we discount consumption.**

  If you accept Ramsey's premise ($\delta = 0$), you are asserting that a unit of *utility* (wellbeing) in 2100 is morally identical to a unit of *utility* in 2024. However, the Ramsey rule does not discount utility; it discounts *consumption goods*.

  The logic is as follows:
  1.  **Diminishing Marginal Utility:** If future people are richer (due to growth $g$), an extra dollar gives them less utility than it gives us.
  2.  **Transfer Efficiency:** If we sacrifice \$1 today to give future people \$1 tomorrow, we might lower total utility. We are taking a dollar from a poorer generation (us) and giving it to a richer generation (them). Because of the curvature of the utility function ($\eta$), the utility loss today exceeds the utility gain tomorrow.
  3.  **The Rate:** The consumption discount rate ($r$) tells us the rate of return required on investment to make a transfer intertemporally neutral *in utility terms*.

  On this view, the $\eta g$ term is not a moral discount on the *people* of the future. It is an exchange rate between *currencies* of different purchasing power (where purchasing power is measured in utility, not goods). It is not "bias by date"; it is "aversion to inequality across time."

  **The Counter-Argument to Your Suspicion:**
  If you reject the $\eta g$ term, you are implicitly arguing that we should transfer resources to the future even if it makes them vastly richer than us while we suffer, simply because "a dollar is a dollar." But if a dollar buys less welfare for them, that policy would actually *reduce* total welfare. Therefore, using a positive consumption discount rate is actually required to maximize welfare if $\delta=0$.

  ### 2. Where You Are Right: The Category Mistake in Practice

  However, your suspicion that this is a "category mistake about the relation between money and wellbeing" is correct regarding **applied** welfare economics.

  The confusion arises when economists treat consumption as a perfect proxy for welfare. In standard CBA, benefits are often measured in willingness-to-pay (WTP), which is income-constrained.
  *   **The Error:** If we value a future life saved by looking at the future population's WTP, and they are richer, their WTP is higher. But then we discount that monetary value back to the present using $r = \eta g$.
  *   **The Cancellation:** Mathematically, if VSL (Value of Statistical Life) scales linearly with income, and we discount by the income-adjusted rate, the effects can cancel out. But often they don't align perfectly.
  *   **The Real Mistake:** The deeper error is when the $\eta g$ term is applied to **non-substitutable goods**. If the policy prevents extinction or preserves a unique ecosystem, the "future people will be richer" argument fails. If there are no people, there is no one to be rich. If the good is not consumable (e.g., the existence of humanity), the marginal utility of consumption is irrelevant.

  In these cases, applying the Ramsey consumption discount rate *is* a disguised pure time preference, because it assumes the future good is a function of future wealth, rather than a fundamental component of welfare itself.

  ### 3. What Follows: Implications for Ethics and Policy

  If we accept your premise—that the standard practice conflates consumption and welfare—three major changes follow for longtermist ethics and cost-benefit practice.

  #### A. The "Two-Discount-Rate" System
  We must formally separate **utility discounting** from **consumption discounting**.
  *   **For Utility:** The discount rate is $\delta$. Following Ramsey and the rationalist consensus, this should be effectively zero (perhaps only for existential risk probability).
  *   **For Consumption:** The discount rate is $r = \delta + \eta g$. This applies *only* when comparing streams of consumable goods.

  **Implication:** In climate CBA, damages to GDP should be discounted at $r$. But damages to human life, health, or species existence should be valued in utility terms first, and then *not* discounted by the growth rate. Currently, most integrated assessment models (like DICE) discount everything at $r$, effectively valuing future lives less because future people are richer. This is the ethical flaw you identified.

  #### B. The End of the "Wealth Effect" for Existential Risk
  The $\eta g$ term relies on the assumption that the future exists and is wealthier. In longtermism, the primary concern is often existential risk (x-risk).
  *   If an intervention reduces x-risk, it preserves the *possibility* of future utility.
  *   You cannot apply the "future people will be richer" argument to the existence of future people themselves.
  *   **Result:** For x-risk mitigation, the appropriate discount rate is the probability of extinction, not the Ramsey rate. The "growth term" drops out. This drastically increases the present value of far-future interventions, aligning with the "longtermist" view that the future is astronomically valuable.

  #### C. Satiation and the Curvature Parameter ($\eta$)
  Your critique also points to a potential empirical error in $\eta$. The Ramsey rule assumes marginal utility of consumption diminishes forever.
  *   **Hedonic Treadmill:** If wellbeing plateaus after a certain income level (satiation), then $g$ stops generating utility growth.
  *   **Implication:** If we are near satiation, $\eta$ approaches zero (or becomes undefined). If future people are not "richer" in utility terms, only in material terms, then the justification for the $\eta g$ term collapses. We would owe them the same material sacrifice we would owe to contemporaries in poverty.
  *   **Practice:** CBA should not assume a constant $\eta$. It should model the utility-consumption curve explicitly. If the curve flattens, the consumption discount rate should fall toward $\delta$ (zero).

  ### 4. A Mathematical Necessity (The One Caveat)

  There is one reason economists insist on a positive discount rate even for utility, which is not ethical but mathematical: **The Overtaking Criterion.**

  If $\delta = 0$ and growth continues indefinitely, the sum of utilities over an infinite horizon diverges to infinity. Comparing two infinite streams becomes mathematically impossible (0 vs 0, or $\infty$ vs $\infty$).
  *   To make the optimization problem tractable, you need $\delta > 0$ (Koopmans' theorem).
  *   **Resolution:** Most rationalist ethicists accept a "lexicographic" approach or a "critical level" utilitarianism to handle infinities without resorting to pure time preference. Alternatively, they accept a vanishingly small $\delta$ (e.g., 0.1%) solely for mathematical convergence, acknowledging it is a technical artifact, not an ethical truth.

  ### Summary

  You are right to be suspicious. The standard practice often smuggles normative content into the $\eta g$ term by treating consumption as welfare.

  **To answer your specific questions:**

  1.  **Is it a disguised pure time preference?**
      *   **Theoretically:** No. It is an inequality-aversion adjustment for efficient transfer.
      *   **Practically:** Yes, when applied to non-consumption goods (life, existence) or when consumption is treated as a perfect proxy for welfare.

  2.  **Is it a category mistake?**
      *   Yes, if the analyst forgets that the discount rate applies to the *numeraire* (consumption), not the *objective function* (utility).

  3.  **What is the right rate?**
      *   For **utility**: $\approx 0$ (adjusted only for existential risk probability).
      *   For **consumption transfers**: $r = \eta g$ (but only if future people actually exist and utility is unbounded).
      *   For **existential risk mitigation**: The probability of catastrophe, not the Ramsey rate.

  4.  **What must change in CBA?**
      *   Stop discounting non-market goods (lives, species) by the consumption discount rate.
      *   Value them in utility terms, then convert to present consumption equivalents using the marginal utility of consumption, not a blanket discount rate.
      *   Acknowledge that for far-future scenarios, the assumption of continuous growth ($g$) is fragile; if $g$ is uncertain or endogenous (as in x-risk), the $\eta g$ term cannot be used as a fixed parameter.

  Your intuition aligns with the "Stern Review" position against the "Nordhaus" position, but pushes even further toward the philosophical consistency required by longtermism. The confusion you spotted is the gap between *welfare economics* (which knows the difference between utility and money) and *cost-benefit analysis* (which often forgets it).
