answer: |-
  This is a profound disagreement, but it is not, primarily, a disagreement about the chemistry. You and your colleague agree on the physics and the biochemistry; you disagree on the *causal architecture* required to explain biological phenomena to students. To resolve this, we must distinguish between red herrings that clutter the debate and the substantive issues that bear on the specification.

  ### 1. World versus Description
  You ask whether you are disagreeing about the world or the description. The answer is neither, and both. You are disagreeing about which *level of explanation* is causally relevant.

  Your colleague advocates for a strict reductionism: if we describe the chemistry fully, we have described the phenomenon. This is ontologically safe but explanatorily weak. If a mutation changes a single base and the protein fails, the chemical difference is negligible, but the biological effect is catastrophic. A purely chemical description cannot easily distinguish between a silent mutation (chemically different, biologically identical) and a missense mutation (chemically different, biologically distinct). An informational description handles this effortlessly.

  Therefore, you are not arguing over the existence of atoms, but over whether 'information' is a real causal property in biology. The consensus in the philosophy of biology (following figures like John Maynard Smith and Francis Crick) is that it is. A gene is not merely a molecule; it is a molecule *in a context* where its sequence determines an outcome via an arbitrary convention. To ban the language of information is to ban the most efficient tool we have for explaining why specific chemical changes matter and others do not.

  ### 2. Evaluating the Objections
  Let us separate the valid concerns from the red herrings.

  **The Red Herrings:**
  *   **Understanding:** Your colleague argues that a cell does not "understand" a message. This is a category error. In information theory, 'reading' does not require consciousness. A barcode scanner reads a code without understanding it. The user's analogy of the printing press is correct. The machinery responds to shape, but the *relationship* between the shape and the outcome is not determined by the shape's physics alone, but by the evolved context. This is sufficient for 'code'.
  *   **Circularity:** The objection that the machinery is built by the code it reads is not a logical vice; it is a biological necessity. This is the von Neumann kinematic self-reproducing automaton. It is a causal loop, not a definitional circle. It does not invalidate the status of DNA as a code; it merely highlights that the 'decoder' must be inherited alongside the 'message'.
  *   **Shannon Information:** Your colleague is right that Shannon information measures capacity, not meaning. However, biological information is *semantic*; it is about something (the amino acid sequence). The fact that engineers use a narrow definition does not preclude biologists from using a broader one, provided it is defined.

  **The Substantive Concerns:**
  *   **Teleology (The Planner):** This is your colleague's strongest point. In everyday English, 'instruction' implies a commander and 'design' implies a designer. If a pupil reads "DNA contains instructions", they may infer intent. This is not a philosophical error on your part, but a pedagogical risk.
  *   **Determinism (Fatalism):** Relatedly, 'code' can imply rigid destiny. Pupils may infer that the gene dictates the organism regardless of environment. This is scientifically false (epigenetics, plasticity) and socially dangerous.

  ### 3. The Question of Universality
  You asked specifically about the universality of the code. This counts significantly in your favour.
  *   **Near-Universality:** The fact that a human gene works in a bacterium supports the 'arbitrary convention' hypothesis. If the relationship between codon and amino acid were dictated by chemical affinity (stereochemical theory), it might be universal, but it would be a physical law, not a code. The fact that it functions across vastly different chemical environments suggests the relationship is maintained by the machinery, not the chemistry.
  *   **Exceptions:** The fact that the code is *not* perfectly universal (e.g., in mitochondria or certain protozoa) is actually stronger evidence for it being a code. If it were a law of physics, it could not vary. The fact that it *can* vary, but usually doesn't (because changing the code is lethal to existing lineages), confirms it is a frozen arbitrary convention. This supports your view: it is a code precisely because it *could have been otherwise*.

  ### 4. Resolution and Recommendation
  Your colleague is right that the everyday connotations of 'instruction' are dangerous, but wrong that the informational level of description should be abandoned. You are right that the code is a real structural feature, but risk underplaying the mechanistic basis that prevents teleological misunderstanding.

  The specification should not ban the words, but it must fence them. We must treat 'genetic code' as a technical term, akin to 'force' in physics, which has a precise definition distinct from its colloquial use.

  **The Verdict:**
  1.  **Retain 'Code':** It is the standard technical term for the triplet table. To remove it would isolate students from the wider scientific literature.
  2.  **Qualify 'Instruction':** Use sparingly. Prefer 'specifies' or 'determines'.
  3.  **Explicitly Deny Teleology:** The specification must explicitly state that the 'code' is a product of evolution, not design.
  4.  **Emphasise Mechanism:** The 'reading' must be described as chemical binding, not cognitive interpretation.

  **Proposed Wording for the Specification:**
  To satisfy the chemists, the philosophers, and the pedagogues, I suggest the following phrasing for the relevant section:

  > **The Genetic Code and Protein Synthesis**
  >
  > 1.  The sequence of bases in DNA determines the sequence of amino acids in a protein. This relationship is known as the **genetic code**.
  > 2.  The code is **degenerate** (more than one triplet may code for the same amino acid) and **non-overlapping**.
  > 3.  The relationship between a triplet (codon) and an amino acid is not fixed by chemical necessity but is mediated by specific adapter molecules (tRNA) and enzymes. Because this relationship is arbitrary and consistent across almost all organisms, it is described as a 'code' rather than a direct chemical template.
  > 4.  Students should understand that terms such as 'code', 'information', and 'instruction' describe the functional role of the DNA sequence within the cellular machinery. They do not imply that the DNA possesses consciousness, intent, or a pre-existing plan. The machinery 'reads' the sequence through chemical binding, not interpretation.
  > 5.  The expression of genetic information is influenced by environmental factors and regulatory mechanisms; the genotype does not rigidly determine the phenotype in isolation.

  ### Why this works
  *   **For the Colleague:** It explicitly grounds the 'code' in chemical mediation (tRNA/enzymes) and denies intent/consciousness. It acknowledges the arbitrariness she prizes.
  *   **For You:** It retains the informational vocabulary necessary for modern biology and acknowledges the structural features (degeneracy, universality) that define a code.
  *   **For the Student:** It prevents the 'homunculus' fallacy (that there is a little man inside reading the DNA) and guards against genetic determinism.

  Your colleague fears the metaphor will do covert work. The solution is not to burn the metaphor, but to make its workings overt. By defining 'code' explicitly as an arbitrary, mediated relationship, you turn a potential misconception into a learning opportunity about the nature of biological causation.
