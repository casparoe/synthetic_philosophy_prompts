answer: |-
  The Asymmetry Thesis is a comforting illusion; because meaning-claims are factual claims, the record must override memory, unless the record itself is an artifact of the violence it purports to document.

  To accept the Asymmetry Thesis is to indulge in a philosophical dualism that social reality does not sustain. When a community asserts, "We are a people of victims," this is not merely an axiological stance on how to feel about the past; it is an ontological claim that "We were harmed without justification." If the historical record demonstrates that the community initiated the violence, the meaning collapses because the fact supporting it has been removed. You cannot retain the moral status of the victim while conceding the factual status of the aggressor, because the former is logically dependent on the latter. The Unity Thesis, therefore, is ontologically superior: memory and record compete over the same terrain of truth. The Sunset Thesis fails for a different reason; it assumes that time purifies evidence, yet the death of witnesses does not grant authority to bureaucrats. A lie does not become truth because the liars have died, nor does a trauma cease to structure a community's present because the survivors have passed. Authority must rest on the reliability of the evidence and the integrity of its production, not on the calendar.

  However, the supremacy of the record is not absolute, because the record is not a mirror of nature but a product of human labor. This is where the unflattering constraint must be applied. In the first hard case, where a community mourns as victims because it has forgotten its own perpetration, the record must hold authority. Here, the memory is not just inaccurate; it is morally parasitic. It sustains a claim to innocence by erasing the suffering of the other. To allow memory authority here is to license a falsification of the moral universe. The community must relinquish the specific identity of "innocent victim," even if it retains the right to mourn its own dead. The pain is real, but the narrative constructed upon it is false, and philosophy cannot sanction a truth-claim built on the invisibility of another's pain. The record corrects the fact, and the meaning must suffer the consequence.

  The second hard case reverses the vector of authority. When the record consists of occupation files or colonial censuses designed to facilitate expropriation, the record is not evidence of reality but evidence of an intent to erase. If a census declares a frontier "empty" to justify seizure, that document is not a neutral count; it is a speech act of dispossession. In this scenario, the community's memory that the land was occupied is not merely a competing narrative; it is a counter-forensic claim about the archive itself. Here, memory holds authority over the record, not because memory is infallible, but because the record is disqualified. To defer to the occupier's files in this context is not to honor truth, but to collaborate with the logic of erasure that produced the files. The record forfeits its authority when its existence presupposes the invisibility of the subjects it describes.

  This verdict invites the objection that it is a philosopher's imposition on practices that are properly political. Critics will argue that questions of memory and history are settled by power, negotiation, and the needs of the living, not by abstract principles of epistemic authority. To dictate when memory must yield to record, or vice versa, is to assume a view from nowhere that does not exist. There is force in this objection: history is indeed a battleground, and my principle risks becoming just another weapon. However, to refuse judgment is itself a judgment. If we declare the conflict purely political, we concede that the stronger power determines the truth. In most conflicts between community memory and professional record, the record is backed by the state, the university, and the funding apparatus. To leave this to "politics" is to default to the archive. Philosophy must intervene not to settle the politics, but to establish the conditions under which a truth-claim is valid. Without such norms, we have no ground to criticize a state that fabricates history to justify oppression, other than to say it is inconvenient.

  Yet I must concede a sharp objection to my own position regarding the disqualification of the record. I argue that the record loses authority when it is an instrument of erasure, but determining when a record is an instrument of erasure often requires... another record. To prove the colonial census was false, we often need missionary logs, archaeological data, or oral histories that we treat as evidence. If we rely on these to invalidate the census, are we not simply privileging one set of documents over another? My criterion risks circularity: we trust the memory because we believe the record is biased, and we know the record is biased because the memory contradicts it. This is the vulnerability of the position. It requires a meta-historical judgment that cannot be fully algorithmic. We must look for internal contradictions within the archive itself—moments where the bureaucracy slips, where the logic of erasure fails to cover its tracks. We cannot simply assert bias; we must demonstrate the structural incapacity of the record to see the subject. If we cannot do this, we risk romanticizing memory as inherently truthful, which is as dangerous as fetishizing the archive.

  Ultimately, the authority of the past is not a property of the past itself, but a responsibility of the present. We do not discover who has authority; we assign it based on our commitment to truth and justice. When memory claims a fact that harms the truth, it must yield. When the record claims a fact that harms the truth by erasing the witness, it must yield. This is not a compromise, but a recognition that both memory and record are fallible technologies of truth, subordinate to the ethical demand that the past be represented without violence. The verdict is unstable because the evidence is always contested, but it is necessary because the alternative is to let the victors write the history unchallenged, or to let the wounded live in a fantasy that prevents reconciliation. We must accept the discomfort of a truth that undermines our identity, unless that truth is itself a tool of domination.
