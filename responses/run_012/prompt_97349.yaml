answer: |-
  Here is a 45-minute battle plan designed to make Tolstoy's argument land as a structural critique rather than a moralistic tantrum.

  ### 1. The Setup: Function Before Value (Minutes 0–10)
  **What must come first:** Do not start with Tolstoy's verdicts (Shakespeare is bad, Beethoven is bad). Start with his **definition of mechanism.**

  Your group believes Art = Self-Expression (output). Tolstoy argues Art = Infection (input).
  *   **The Move:** Open by asking the room: *"If I write a poem that makes me feel incredibly profound, but you read it and feel nothing, is that art?"*
  *   **The Pivot:** When they hesitate (because they value the expression), lay down Tolstoy's functional definition: Art is not about what the artist *does*, it is about what the viewer *catches*. It is a vector of feeling.
  *   **Why this lands the verdict:** If art is a virus of feeling, then "bad art" isn't a sin; it's a **failed transmission** or a **toxic strain**. This shifts the debate from "Taste" (subjective) to "Communicability" (objective/functional). It makes his later rejection of masterpieces sound like an engineering diagnosis, not a moral scolding.

  ### 2. The Single Example: Beethoven's 9th Symphony (Minutes 10–25)
  **The Example:** Do not use a morally repugnant work (Nazi propaganda) or a trivial one. Use **Beethoven's 9th Symphony.**
  *   **Why:** It is universally revered, technically flawless, and ostensibly about "Universal Joy." It is the perfect fortress to siege.
  *   **What it needs:** You must establish that the room *loves* it and finds it "uplifting." Then, introduce Tolstoy's experience: he listened to it in his later years and felt nothing but confusion and exhaustion, while observing the wealthy audience around him feeling proud of their ability to endure it.
  *   **The Argument:** Tolstoy argues the 9th is "counterfeit art" not because it is immoral, but because it is **exclusive**. To "get" it, you need specific training, leisure time, and a cultural background that excludes the peasant, the worker, and the child. If art is meant to unite mankind (his religious consciousness), a work that divides the "initiated" from the "uninitiated" is functionally anti-art.
  *   **What would wreck it:**
      *   **Music Theory:** If you let them argue about whether Beethoven is *actually* complex. Refuse this. The point is the *social barrier to entry*, not the notes.
      *   **Subjective Preference:** If they say "But *I* felt united with humanity." Counter with: "Did the untrained person next to you feel it, or did they feel alienated? Tolstoy says art must work on *everyone*, not just the conservatory graduates."

  ### 3. Heading Off Misconceptions (Sequence & Timing)
  You predicted four specific pushbacks. Here is where you intercept them in the flow of the 45 minutes.

  **1. "So he's just a moralist / censor"**
  *   **When they'll think it:** As soon as you mention "Religious Consciousness."
  *   **Where to head it off:** **Minute 8 (Before the Example).**
  *   **The Pre-empt:** When defining his "moral" criterion, explicitly refuse the word "Moral." Call it **"The Consciousness of the Time."** Explain that for Tolstoy, this isn't church dogma; it's the baseline agreement of what matters for human survival (e.g., "brotherhood" vs. "pride").
  *   **Script:** *"He isn't saying art must be polite. He's saying art must be legible to the common human experience of the era. If it requires a PhD to understand the feeling, it violates the 'consciousness' of universal brotherhood."*

  **2. "He means art has to be uplifting"**
  *   **When they'll think it:** After you explain why Beethoven failed (it was too complex/exclusive). They will assume he wants "Happy Art."
  *   **Where to head it off:** **Minute 20 (During the Example analysis).**
  *   **The Pre-empt:** Clarify that Tragedy is valid art *if* it unites us in compassion.
  *   **Script:** *"He doesn't want happy endings. He wants shared feeling. A story about despair is 'good art' if the reader feels the despair alongside the character. It is 'bad art' if the reader is just admiring the author's clever description of despair."*

  **3. "He's saying the artist's intentions are what matter"**
  *   **When they'll think it:** When you discuss "Sincerity" (one of his three criteria).
  *   **Where to head it off:** **Minute 30 (Transition to Criteria).**
  *   **The Pre-empt:** Distinguish between *Intent* (mental) and *Sincerity* (physiological).
  *   **Script:** *"It's not about whether the artist meant to be sincere. It's whether they were infected enough by the feeling to transmit it involuntarily. If you have to try to make the audience cry, you've already failed. The infection must be automatic."*

  **4. "He's only being a contrarian about his own books"**
  *   **When they'll think it:** When you reveal he rejected *War and Peace*.
  *   **Where to head it off:** **Minute 35 (The Climax).**
  *   **The Pre-empt:** Don't save this for the end as a "gotcha." Reveal it immediately after the Beethoven example to show consistency.
  *   **Script:** *"This is why he rejected his own novels. He realized they were written for the leisure class, by a leisure class author, about leisure class problems. He applied the same metric to himself that he applied to Beethoven."*

  ### 4. What to Refuse to Go Into
  To keep this to 45 minutes and prevent derailment, explicitly table these two topics:
  1.  **Tolstoy's Specific Theology:** Do not let them debate Orthodox Christianity. Keep "Religious Consciousness" defined strictly as "The highest ideal of unity available to that society."
  2.  **The List of Who's In/Out:** Do not get bogged down in his specific takes on Nietzsche, Dante, or Hugo. Stick to Beethoven and Tolstoy. The principle matters, not the roster.

  ### 5. The Closing Question (Minute 45)
  You need a question that tests if they understand the **Infection/Accessibility** criterion, not just the "Art is Good" takeaway.

  **Ask this:**
  > *"Think of a piece of art you love that is technically difficult or obscure. If Tolstoy is right, does the fact that you needed to be 'taught' how to appreciate it make it a tool of class division rather than a vehicle of human union?"*

  *   **If they say "Yes":** They understand the criterion (Accessibility/Unity).
  *   **If they say "No, because I still feel it":** They have reverted to Self-Expression (Input doesn't matter, my output does).
  *   **If they say "No, because some things are just for the elite":** They have rejected Tolstoy's premise entirely (which is a valid outcome, but shows they understood the stakes).
