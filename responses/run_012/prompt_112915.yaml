answer: |-
  **The House, The Hope, and The Harmonic Series**

  The floor manager of the Golden Nugget, Sal, is staring at a whiteboard. On one side is "Risky," the casino's actuary. On the other is "Quinn," the math grad student staking a broke player named Dan.

  **Risky:** "Sal, we launch the 'Infinity Flip' tomorrow. Entry fee $1,000. Heads we double the pot, tails we cash out. 50% chance we pay $2,000. 25% chance $4,000. But 99.9% of the time, the game ends before we hit the $1,000 break-even point. It's practically free money for the house. The risk is negligible."

  **Quinn:** "Dan, you take the deal. Pay the $1,000. The Expected Value is $\sum (1/2^n) \cdot 2^n$. That's $1 + 1 + 1...$ forever. The EV is infinite. You're paying a finite price for an infinite asset. It's literally robbery."

  **Sal:** "Wait. Risky says the liability is zero. Quinn says the asset is infinity. You're both signing off on this?"

  **Risky:** "Statistically, yes. The long run almost never happens."

  **Quinn:** "Mathematically, yes. The long run pays for everything."

  **Sal:** "So who loses when the long run *does* happen?"

  **Risky** and **Quinn** look at each other, then at the coin spinning on the table.

  **Risky:** "The Bankroll."

  **Quinn:** "The Universe."

  **Sal:** "And until then?"

  **Risky** and **Quinn** (in unison): "Until then, the tail is doing all the infinite work for free."

  Sal watches the coin wobble. "So we're monetizing the gap between 'Almost Never' and 'Infinitely Valuable'?"

  **Risky:** "It's called arbitrage."

  **Quinn:** "It's called faith."

  **Sal:** "Deal. Open the tables. Just make sure the coin doesn't notice it's supposed to be theoretical."

  ***

  **A Note on the Math**

  This joke leans on the tension between the *Expected Value* (which diverges to infinity) and the *Almost Sure* outcome (which converges to a small finite number). In standard probability theory, both Risky and Quinn are technically correct within their own frameworks: the median payout is low, but the mean is undefined/infinite.

  The joke avoids the standard "resolution" that no casino has infinite bankroll, keeping the paradoxical tension alive. However, it takes liberties with the idea that the "tail does infinite work." In reality, the contribution of the tail to the expected value is a mathematical property of the sum, not a physical "work" that accumulates over time.

  **Point of Least Certainty:**
  I am least sure about the characterization of the "tail doing work" as a shared realization between the actuary and the quant. In **Ergodicity Economics** (a contested resolution proposed by Ole Peters), the paradox is resolved by looking at time-averages rather than ensemble averages, suggesting Quinn is simply wrong about the growth rate for a single trajectory. However, in standard Von Neumann-Morgenstern utility theory, Quinn is right about the EV, but Risky is right about the risk of ruin. Blurring these two distinct frameworks to make them "both right at once" is a poetic device rather than a rigorous mathematical stance, and I'm uncertain if that conflation muddies the water too much for a math-literate audience.
