      *   **Conflict:** Dev says it's morally inert (polygons, no sentience, only player impact matters). Rosa says it's a betrayal (you don't do that to a person). User is stuck in the middle (creator bias accused).
      *   **Goal:** Not a verdict on the character's morality, but a *diagnosis* of why the argument is stuck.
      *   **Specific Questions to Address:** Are they answering the same question? Is it verbal? Metaphysical? About moral status requirements? About analogies? Bedrock intuitions? Does the persistent memory twist matter? Is the user's hunch (care vs. fact) correct?
