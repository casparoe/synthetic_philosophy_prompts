answer: |-
  This is a sophisticated methodological challenge. You are asking for the *conditions of adequacy* before evaluating the *candidates*, which is the correct order of operations but rarely followed in moral psychology. Most theories fail because they optimize for one domain (e.g., phenomenology) while collapsing in another (e.g., anthropology).

  Below is the specification you requested, formalized into distinct requirements, followed by the analysis of the excluder, the inconsistency, and the prejudices embedded in your own framing.

  ### Part I: The Specification (Requirements for Adequacy)

  To be worth adopting, an account of guilt and shame must satisfy the following nine requirements:

  1.  **Phenomenological Autonomy:** The account must explain the occurrence of shame in the absence of an actual or imagined audience (the "3 a.m. condition") and guilt in the absence of a living victim or possibility of repair (the "dead promisee condition"). It cannot define shame solely as fear of exposure or guilt solely as drive for reparation.
  2.  **Differential Specificity:** The account must distinguish shame from embarrassment and guilt from regret based on positive features of each, not merely by contrast with one another. (e.g., Shame is not just "guilt about the self"; Guilt is not just "shame about an act").
  3.  **Response Variability:** The account must accommodate **divergence** (two agents commit the same violation; one feels guilt, the other shame) and **convergence** (one agent feels both regarding the same violation) without treating one response as a mistake or a derivative of the other.
  4.  **Object Flexibility:** The account must explain how the intentional object of the emotion can shift. It must handle **vicarious shame** (ashamed of a group member's act) and **moral guilt** (guilt for an act that harmed no one but violated a duty), without collapsing the distinction between *who* acted and *who* feels.
  5.  **Normative Agnosticism:** The definition must not build a moral verdict into the emotion's structure. It cannot define guilt as "autonomous/mature" and shame as "heteronomous/primitive" (or vice versa). The moral value of the emotion must be a downstream consequence, not a definitional premise.
  6.  **Trans-Linguistic Validity:** The account cannot rely on the semantic boundaries of English, Greek, or Hebrew. It must identify functional or phenomenological cores that survive translation, acknowledging that some languages may lack a lexical equivalent for one or both while retaining the phenomenological capacity.
  7.  **Agency Distinction:** The account must rigorously separate the *emotion* (being ashamed/feeling guilty) from the *social practice* (being shamed/being made to feel guilty). It must explain how the former can exist without the latter, and how the latter can fail to produce the former.
  8.  **Multi-Level Coherence:** The account must provide a bridge mechanism between **individual psychology** (what happens in the agent) and **cultural moral economy** (how a society deploys these emotions). It must explain how a culture might prioritize one without denying the existence of the other.
  9.  **Empirical Vulnerability:** The account must make claims that could be falsified by psychological, neurological, or anthropological evidence. It cannot be a closed conceptual scheme immune to data about how people actually report or exhibit these states.

  ---

  ### Part II: The Single Excluder

  The requirement that does the most work in excluding candidate accounts currently on offer is **Requirement 5: Normative Agnosticism.**

  **Why:** The history of this distinction is largely a history of moral turf wars.
  *   **The Christian/Kantian Tradition:** Defines guilt as the voice of conscience/internal law (good, rational, autonomous) and shame as fear of social opinion (bad, irrational, heteronomous). This fails your "3 a.m." test and your "Normative Agnosticism" test.
  *   **The Nietzschean/Virtue Ethics Tradition:** Often inverts this, treating shame as a healthy concern for honor/character and guilt as a sickly internalization of slave morality. This fails the "dead promisee" test and again violates agnosticism.
  *   **The Anthropological Tradition (Benedict):** Treats guilt as Western and shame as Eastern/Honor-based. This violates Trans-Linguistic Validity and Normative Agnosticism by tying the emotions to specific cultural developmental stages.

  Almost every major philosophical account smuggles in a verdict about which emotion is the "true" basis of morality. To demand an account that describes the *mechanics* of the emotions without implying one is morally superior or more "authentically moral" eliminates the vast majority of the canonical literature (from Darwin to Nussbaum).

  ---

  ### Part III: The Inconsistent Pair

  You suspected the list might be internally inconsistent. You are right. The pair of requirements that cannot be jointly satisfied without significant theoretical gymnastics is **Requirement 6 (Trans-Linguistic Validity)** and **Requirement 8 (Multi-Level Coherence / Cultural Choice).**

  **The Tension:**
  *   **Requirement 6** implies a form of **Universalism**. It demands that guilt and shame are stable, cross-cultural natural kinds (or functional equivalents) that exist regardless of the vocabulary available. It assumes there is a "fact of the matter" about the distinction that survives translation.
  *   **Requirement 8** (specifically your interest in "whether a culture can choose which of the two emotions to run its moral life on") implies a form of **Constructivism** or **Malleability**. It suggests that these emotions are tools or systems that a culture can adopt, prioritize, or structure differently.

  **The Contradiction:**
  If the distinction is a universal feature of human psychology (required to satisfy Trans-Linguistic Validity), then a culture cannot "choose" to run its moral life on one in the same way it cannot choose to run its digestive system on one type of enzyme. It can *emphasize* one, but the underlying architecture is fixed.
  Conversely, if a culture *can* fundamentally choose which emotion underpins its moral economy (implying the emotions are contingent social technologies), then the distinction is not a universal natural kind, and your search for a Trans-Linguistic Valid account is chasing a phantom. You are asking for an account that treats them as **universal biological/psychological constants** *and* as **variable cultural tools**. While not logically impossible, satisfying both usually requires reducing one requirement to a shadow of the other (e.g., claiming the biology is universal but the "moral life" is purely superficial).

  ---

  ### Part IV: The Prejudices in Your List

  You asked me to flag items in your specification that look less like genuine requirements and more like prejudices (including yours). There are three significant ones:

  **1. The "Guilt/Shame Culture" Ghost (In Requirement 8)**
  *   **The Prejudice:** The idea that a culture can "choose which of the two emotions to run its moral life on."
  *   **Why it's a prejudice:** This is the lingering shadow of Ruth Benedict's *The Chrysanthemum and the Sword*. Modern anthropology and moral psychology largely reject the "Guilt Culture vs. Shame Culture" dichotomy. All known cultures utilize both; they simply attach them to different triggers. Framing the seminar around whether a culture can *choose* one risks reifying a false binary. It presupposes that "Guilt" and "Shame" are the only two engines of moral life, ignoring honor, face, sin, or purity.
  *   **Correction:** Consider reframing this as: "How do different cultural ecologies *calibrate* the triggers and intensity of these universal capacities?" rather than "choose which to run on."

  **2. The Embarrassment Distinction (In Requirement 2)**
  *   **The Prejudice:** "It must keep shame apart from embarrassment... without defining either... by contrast."
  *   **Why it's a prejudice:** This assumes they are distinct natural kinds. A significant camp in affective science (e.g., Jesse Prinz, some constructionists) argues that embarrassment *is* shame, merely at a lower intensity or with a different appraisal of social stakes. By demanding they be distinct as a *requirement*, you are ruling out reductionist accounts *a priori*.
  *   **Correction:** The requirement should be that the account must *explain the relationship* between them, not that it must guarantee their distinctness.

  **3. The "Dead Promisee" Assumption (In Requirement 1)**
  *   **The Prejudice:** "Guilt that arises... as in a promise broken to someone who is now dead."
  *   **Why it's a prejudice:** This assumes guilt is fundamentally deontological (about rules/promises) rather than relational (about harm/care). Some accounts argue that without a victim to witness the repair or suffer the harm, the feeling is not guilt but *moral regret* or *sadness*. By insisting this *must* count as guilt, you are privileging a Kantian internalist view of guilt over a relational externalist view.
  *   **Correction:** The requirement should be that the account must *categorize* this case explicitly, not that it *must* classify it as guilt.

  ### Summary Recommendation for the Seminar

  If you adopt this specification, your seminar will not be about "What is the difference between guilt and shame?" but rather **"Why is it so difficult to specify the difference without smuggling in a moral verdict or a cultural bias?"**

  The most productive tension to explore is the **Inconsistent Pair**. If you force your participants to hold both **Trans-Linguistic Validity** and **Cultural Choice** simultaneously, they will be forced to abandon the simple "Guilt vs. Shame" binary and move toward a more nuanced model of **Moral Affect Systems**, where guilt and shame are not distinct boxes but overlapping clusters of appraisal, physiology, and social signaling that cultures tune differently. That is likely where the actual philosophical value lies.
