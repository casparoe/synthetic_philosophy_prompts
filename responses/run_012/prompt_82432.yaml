      *   **Constraints:** No citations or reading lists.

  2.  **Deconstruct the Theory & Identify Vulnerabilities:**
      *   *Felt Presence (Gate):* Standard phenomenal consciousness claim. Vulnerable to skepticism (psychologists) and functionalist reductionism.
      *   *Hedonic Integration (Dial):* This is the novel part. Vulnerable to conceptual confusion (what is integration?) and the Thermostat case (does a thermostat *really* have integration?).
      *   *Graded Status:* Vulnerable to the Kantian "duty requires binary" objection and the Consequentialist "how do we calculate this?" objection.
      *   *Markers:* Claiming nociception tracks Felt Presence but not Integration is empirically risky (Psychologists).
      *   *Thermostat Case:* Claiming a thermostat has *nonzero* integration but *zero* felt presence is counter-intuitive. It risks trivializing "integration."

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (The Functionalists):* They will attack the definition of "Hedonic Integration." If it's functional, why isn't a thermostat a moral patient? If it's phenomenal, how do we measure it?
      *   *Objection 2 (The Psychologists):* They work on nociception. The student claims nociception tracks Felt Presence but not Integration. They will say, "We can't even measure Felt Presence reliably, let alone this second axis. Your 'Gate' is empirically invisible."
      *   *Objection 3 (The Kantian):* Binary vs. Graded. "How can I have a duty to a degree? Either I must not kill you or I may."
      *   *Objection 4 (The Consequentialists):* Practical application. "If insects have some status, do we stop farming them? How do we weigh a high-integration insect against a low-integration fish?"
      *   *Objection 5 (The Thermostat Case):* This is a specific vulnerability. "Why does the thermostat have *any* integration? It seems like a category mistake to attribute evaluative perspective to a bimetallic strip."

      *Refining Order:* The Functionalists and Psychologists are the most immediate threat to the *coherence* of the theory. The Kantian is a threat to the *normative force*. The Consequentialists are a threat to the *application*. The Thermostat is a specific trap.
      *Likeliest/Most Damaging:* The Functionalists/Integration definition is crucial because if "Integration" collapses, the "Dial" breaks. The Psychologists are dangerous because they have empirical authority in the room. Let's combine the Functionalist/Integration worry with the Thermostat worry as they are linked. The Psychologists' skepticism about measurability is high probability. The Kantian is a classic objection but easier to parry. The Consequentialists are practical but less damaging to the core theory.

      *Revised Order:*
      1.  Functionalists (What *is* integration? + Thermostat problem).
      2.  Psychologists (Measurability + Nociception claim).
      3.  Kantian (Binary Duty).
      4.  Consequentialists (Practical calculus).
      5.  The "Hope Nobody Asks" (The Human Infant/Disability case).

  4.  **Drafting Replies & Weaknesses:**
      *   *Functionalists:* Need to distinguish functional architecture from moral weight. Admit integration is functional but requires Felt Presence to matter. *Weakness:* Defining integration without circularity.
      *   *Psychologists:* Admit measurement is hard but argue conceptual clarity precedes measurement. Nociception indicates *something* is happening, but not *how unified* it is. *Weakness:* If Felt Presence is unmeasurable, the Gate is useless.
      *   *Kantian:* Duties can be graded (weight of reasons), not just on/off. *Weakness:* Hard to square with "rights" language.
      *   *Consequentialists:* It complicates the calculus but makes it more accurate. Insect farming might be permissible but requires lower welfare thresholds than mammals. *Weakness:* Action guidance is vague.
