answer: |-
  # Q&A Prep Sheet: Graded Moral Status (Felt Presence & Hedonic Integration)

  **Strategy Overview**
  Your theory rests on a novel distinction (Gate vs. Dial). Your opponents will try to collapse the two axes or show that one is unusable.
  *   **Concede:** Empirical measurement is currently imperfect; the view complicates policy rather than simplifying it.
  *   **Hold:** The conceptual distinction is necessary to avoid category errors; binary status is descriptively false even if legally convenient.

  ---

  ### 1. The Functionalist Trap (Integration & The Thermostat)
  **Who:** The two Functionalists (likely joined by the Psychologists).
  **Likelihood:** High. **Damage:** Critical.
  **The Objection:** "You claim the thermostat has nonzero hedonic integration but zero felt presence. But 'integration' implies a unified evaluative perspective. A thermostat merely reacts to a threshold. If you define integration functionally, the thermostat has it, but then why isn't it a moral patient? If you define it phenomenally, how do you distinguish it from felt presence without circularity? It looks like you've just gerrymandered the definition to make the thermostat come out wrong."

  **The Reply (2 mins):**
  "I appreciate the push on the thermostat case, because it's designed to stress-test the separation of the axes. My claim isn't that the thermostat has a *perspective* in the rich sense, but that it possesses a primitive regulatory architecture that mimics integration—it binds input (temperature) to output (switch state) over time to maintain a set point. I assign it nonzero integration to show that integration *alone* is insufficient for moral status.
  To answer the circularity charge: Felt Presence is the *subjective* experience of that regulation (what it feels like), while Integration is the *structural* capacity to weigh competing affects. The thermostat has the structure without the experience. I grant that at low levels, the distinction is blurry, but in complex organisms like fish or dogs, we can dissociate them: a creature can be highly integrated (complex trade-offs) without felt presence (philosophical zombie), or have felt presence with low integration (fragmented affect). The thermostat is the limiting case to prove the Gate is necessary."

  **Candid Weakness:**
  This is your most vulnerable point. If "integration" is just functional regulation, it's hard to explain why it matters morally *at all* without felt presence. If it *does* matter morally, the thermostat might deserve some status, which sounds absurd. You are walking a tightrope between trivializing "integration" and over-intellectualizing it.

  ### 2. The Empirical Skeptic (Measurability)
  **Who:** The two Comparative Psychologists.
  **Likelihood:** High. **Damage:** High.
  **The Objection:** "You say nociception and trade-off behaviour track Felt Presence (the Gate) but are silent on Integration (the Dial). But in our lab, those are the *only* proxies we have. If Integration is empirically inaccessible, your 'Dial' is metaphysical speculation. How can you propose a graded moral framework based on an axis we cannot measure? You're asking us to legislate based on a distinction science can't touch."

  **The Reply (2 mins):**
  "I'm not asking for legislation based on current measurement capabilities, but on conceptual clarity. Right now, you are using nociception to prove moral status. I'm arguing that nociception tells us there is *something it is like* (Gate), but it doesn't tell us how much that life matters to the creature (Dial).
  You're right that Integration is harder to measure, but it's not silent. Long-term preference consistency and cross-modal trade-offs (e.g., enduring pain for social gain) are markers of integration that go beyond simple nociceptive withdrawal. I'm not saying we can measure the Dial perfectly today; I'm saying that assuming the Dial doesn't exist leads to worse errors than acknowledging uncertainty. We shouldn't collapse the two axes just because one is harder to quantify."

  **Candid Weakness:**
  They have the authority in the room on data. If they insist Integration is unmeasurable, your "Dial" looks like magic. You must avoid sounding like you're dismissing their empirical constraints.

  ### 3. The Deontological Wall (Binary Duty)
  **Who:** The Kantian.
  **Likelihood:** Medium. **Damage:** Medium.
  **The Objection:** "Moral status grounds duty. Duties are categorical, not gradual. I either have a duty not to kill you, or I don't. If status is graded, does my duty fade gradually? Does the wrongness of killing a dog vanish in small increments until it becomes permissible to kill an insect? This makes moral deliberation impossible. You need a threshold for duty, even if nature is continuous."

  **The Reply (2 mins):**
  "I agree that *legal* thresholds often need to be binary for administrative clarity. But a legal threshold isn't the same as moral reality. Consider harm: we recognize that causing severe pain is worse than causing mild pain, even if both are 'harms.'
  My view suggests the *weight* of the duty is graded, not necessarily the existence of the duty. I have a duty not to kill the insect, but it is outweighed by different interests than the duty not to kill the dog. The category error is assuming that because the law needs a bright line, morality does. We can acknowledge graded status while setting pragmatic legal thresholds, provided we admit those thresholds are compromises, not metaphysical truths."

  **Candid Weakness:**
  This is a standard stalemate. They won't accept "graded duties" easily. You won't convert them, but you need to show you aren't advocating for moral chaos.

  ### 4. The Practical Calculus (Insect Farming)
  **Who:** The three Consequentialists.
  **Likelihood:** Medium. **Damage:** Low (to theory), High (to comfort).
  **The Objection:** "Let's apply this. If insects pass the Gate but score low on the Dial, and fish score higher on both: Does insect farming become permissible where mammal farming isn't? If so, how many insects equal one fish? If you can't give us a conversion rate, your theory offers no action guidance."

  **The Reply (2 mins):**
  "I can't give you a precise conversion rate any more than a utilitarian can precisely weigh human joy against animal pain. But the theory *does* offer guidance: it rules out the assumption that insects are morally inert. It suggests that while insect farming might be permissible given their low integration, the sheer scale of suffering requires justification that we currently lack.
  It shifts the burden of proof. Instead of 'insects don't count,' the question becomes 'does the human benefit outweigh the aggregate moral weight of billions of low-status beings?' It complicates the calculus, yes, but that's because the reality is complicated. Simplifying it to binary status is what leads to moral blind spots."

  **Candid Weakness:**
  They will press you on the "aggregate" problem. If status is graded, can enough insects outweigh a human? Be careful not to commit to a utilitarian aggregation view if you want to keep your Kantian allies.

  ### 5. The Question You Hope Nobody Asks
  **Who:** Anyone (but likely the Kantian or a sharp undergrad).
  **Likelihood:** Low. **Damage:** Catastrophic (Social/Political).
  **The Question:** "You use the human infant as a high-status case. But infants have low Hedonic Integration compared to adult dogs or even some primates—they lack long-term evaluative perspectives. On your 'Dial,' does a healthy adult dog have higher moral status than a human infant? If not, why not? If so, are you comfortable defending that?"

  **The Reply (2 mins):**
  "This is the crucial test. My account distinguishes *current* capacity from *species-typical potential* or *relational status* in the case of humans. While an infant's current integration is low, the moral status of human beings isn't derived solely from the two axes in isolation; it includes a social dimension of recognition that I haven't detailed in this paper.
  However, strictly regarding *welfare interests*—the weight of their suffering—a dog with higher integration might have a stronger interest in not being frustrated than an infant. That doesn't mean the dog has a right to life over the infant, but it does mean we might owe the dog complex environmental enrichment we don't owe the infant. We need to be careful not to conflate 'status' with 'rights to life'."

  **Candid Weakness:**
  This is the minefield. If you say the dog has higher status, you look monstrous. If you say the infant has higher status due to "potential," you undermine your naturalistic axes. **Preparation:** If asked, pivot hard to the distinction between *interest in suffering* (welfare) vs. *right to life* (personhood). Do not let them conflate the two.

  ---

  ### General Advice for the Session

  1.  **On the Thermostat:** If they hammer the thermostat, concede that it is a *limiting case* that might be metaphorical. Don't die on the hill that a thermostat literally has "hedonic integration." Say it's a thought experiment to show that *function without feeling* is insufficient.
  2.  **On Measurement:** Do not pretend you have a test for Integration. Own the philosophical nature of the project. "I am mapping the conceptual space so you know what to measure."
  3.  **On Tone:** You are a student. Use phrases like "On my account..." or "The view I'm exploring suggests..." rather than "The truth is..." It invites collaboration rather than combat.
  4.  **The "Hold":** Do not concede that the axes collapse. That is the core of your paper. If you admit Felt Presence and Integration are the same thing, you have no paper.
  5.  **The "Concede":** Concede that this makes policy harder. Admit that legislators *need* binary lines, but argue that philosophers *need* to show them where those lines cut through the grain.

  **Good luck. Keep your eyes on the Functionalists; they are the ones who can unravel your definitions.**
