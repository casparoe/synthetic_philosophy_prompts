          *   *Refinement:* Make it sharper. Focus on the specific phrase "condition on intelligence."
          *   *Follow-up:* If she says "It's implicit," push on why Turing didn't say it explicitly given his clarity elsewhere.
      *   *Q3 (Opacity vs. Intervention):* *Requirement:* Tension between opacity and intervention.
          *   *Draft:* Turing says we can interfere. You say we can't see inside. Contradiction?
          *   *Refinement:* Focus on the mechanism of "discipline." If the interior is opaque, what is the lever the teacher pulls?
