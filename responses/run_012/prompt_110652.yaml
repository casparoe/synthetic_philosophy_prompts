      *   **Guest:** Philosopher of AI focusing on Turing's "learning-machine" writings (1948 Report, 1950 *Mind* paper).
      *   **Guest's Thesis:** Turing's core proposal is *developmental* (build a child, not an adult). Key claim: The teacher *cannot* see inside the machine (opacity) is a condition for intelligence, not just engineering convenience. This implies specific claims about error, discipline, and the opaque learner.
      *   **Constraints:**
