  ### Marker's Briefing (For Your Eyes Only)

  **The Critical Error:**
  The student has fundamentally misunderstood **Pragmatic Encroachment (PE)** in Part (b), Case B.
  *   **The Rule:** Pragmatic Encroachment *always* looks at the **Subject's** stakes (the person who supposedly knows). Contextualism *always* looks at the **Attributor's** stakes (the person speaking).
  *   **Case B:** Tom (Subject) has low stakes. The Speaker (Attributor) has high stakes.
  *   **Correct PE Prediction:** Since Tom's stakes are low, he *does* know. Therefore, the statement "Tom doesn't know" is **False**.
  *   **Student's Prediction:** They claim PE makes "Tom doesn't know" **True** because "the practical factor that does the work on both views is the one in the conversation." This is incorrect. PE never looks at the conversation; it looks at the subject's situation.
  *   **Consequence:** Because they got Case B wrong, their conclusion in Part (c) (that only Case A separates the views) is also wrong. Both cases separate the views. Case A separates them because the *Subject* has high stakes. Case B separates them because the *Attributor* has high stakes (which affects Contextualism but not PE).

  **Grading Logic:**
  *   **Part (a) (8 marks):** Full marks. Definitions are accurate.
  *   **Part (b) (6 marks):** Case A is correct (3 marks). Case B is half-correct (Contextualism right, PE wrong) (1 mark). Total 4/6.
  *   **Part (c) (6 marks):** The conclusion is incorrect because it relies on the error in Case B. Minimal credit for identifying Case A correctly. Total 0–1/6.
  *   **Total:** 12/20.

  ***

  ### Grading Breakdown & Student Feedback
  *(You can copy and paste the section below directly to the student)*

  **Mark: 12/20**

  **Part (a): Definitions and Locus of Sensitivity (8/8)**
  *   **Strengths:** Your definitions of both views are precise and accurate. You correctly identify that Contextualism is a thesis about the word "knows" and the attributor's context, while Pragmatic Encroachment is a thesis about the knowledge relation and the subject's situation.
  *   **Specific Praise:** The sentence *"Knowledge itself doesn't change; only what our words demand of it does"* is an excellent summary of Contextualism. Similarly, *"Whether Priya's true belief amounts to knowledge depends on what is riding on it for her"* correctly captures the core of Pragmatic Encroachment.
  *   **Marks:** Full marks awarded for clarity and accuracy.

  **Part (b): Application to Cases (4/6)**
  *   **Case A (3/3):** Your analysis here is correct. You correctly note that for the Contextualist, the visitor's low-stakes context makes the attribution true, while for the Encroachment theorist, Priya's high-stakes situation makes it false.
  *   **Case B (1/3):** You correctly analysed the Contextualist prediction. However, your analysis of Pragmatic Encroachment is incorrect.
      *   **Your sentence:** *"since the practical factor that does the work on both views is the one in the conversation, 'Tom doesn't know the shop is open' comes out true either way."*
      *   **The error:** Pragmatic Encroachment does **not** look at the conversation or the attributor's stakes; it *only* looks at the subject's (Tom's) stakes. In Case B, Tom's stakes are low. Therefore, on Pragmatic Encroachment, Tom *does* know, making the attribution "Tom doesn't know" **false**.
      *   **Correction:** You should have written: "On encroachment, Tom's own situation is low-stakes, so the bar remains low and he does know. Thus, the attribution 'Tom doesn't know' is false."

  **Part (c): Distinguishing the Views (0/6)**
  *   **Analysis:** Your conclusion relies on the error made in Case B. Because you believed both views yielded the same result in Case B, you concluded that only Case A separates them.
  *   **Your sentence:** *"So this case doesn't separate them: the two views agree on the verdict..."*
  *   **The error:** Since the two views actually produce *different* verdicts in Case B (Contextualism says the attribution is true; Encroachment says it is false), Case B *does* separate the views. Both Case A and Case B pull the views apart, but for mirror-image reasons (Case A varies the subject's stakes; Case B varies the attributor's stakes).
  *   **Marks:** As the central conclusion of this section is incorrect based on the philosophical principles defined in Part (a), no marks can be awarded for the comparison, though credit was given in Part (b) for the correct Contextualist prediction.

  **General Comments**
  You have a strong grasp of the definitions (Part a), which makes the error in application (Part b & c) particularly unfortunate. It appears you may have conflated the two views when analysing Case B, treating Pragmatic Encroachment as if it were sensitive to the speaker's context. Remember the golden rule for this topic: **Contextualism tracks the Speaker; Encroachment tracks the Agent.** If you keep this distinction in mind, your application of the theories will be much more robust.
