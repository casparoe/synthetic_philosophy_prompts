answer: |-
  First off, take a deep breath. Your brain isn't broken; you have just encountered the single most famous headache in modern decision theory. Every student who takes this seminar goes through exactly what you're feeling right now. The tension between "the past is fixed" and "I should take one box" is the entire point of the problem.

  Here is the breakdown to help you untangle this before your final.

  ### 1. The "Backwards Causation" Misunderstanding
  You wrote: *"It seems like evidential decision theory wants me to act as if my choice caused something that already happened... which is just backwards causation and obviously insane."*

  This is the most common intuition trap in Newcomb's Problem. **Evidential Decision Theory (EDT) does not claim your choice changes the past.**

  Think of it like a medical test. Imagine a gene causes both a craving for chocolate and a higher risk of heart disease.
  *   **The Past:** The gene is already in your DNA.
  *   **The Choice:** Eating chocolate.
  *   **The Correlation:** If you eat chocolate, it is *evidence* you have the gene (and thus heart disease risk).
  *   **The Causation:** Eating the chocolate *does not cause* the gene.

  If you refuse to eat chocolate, you don't change your DNA. But you also don't get the utility of the chocolate.
  In Newcomb's Problem, the Predictor isn't magic; they are just really good at modeling you. They simulated "You" before you walked in.
  *   **Simulation You** decided to 1-box or 2-box.
  *   **Predictor** put the money in based on Simulation You.
  *   **Real You** are now deciding.

  When you choose, you aren't reaching back in time to fill the box. You are **revealing** which version of you the Predictor simulated. If you are the kind of person who 2-boxes, the Predictor simulated that, and Box B is empty. If you are the kind of person who 1-boxes, Box B is full.

  EDT says: "I want to be in the world where Box B is full. My choosing 1-box is strong evidence that I am in that world." It's not magic; it's **diagnostic**. Your choice diagnoses the state of the box, even if it doesn't cause it.

  ### 2. Your Friend's Threshold (The Math)
  Your friend is conceptually right (there is a crossover point), but she is numerically sloppy. Let's run the Expected Utility (EU) calculation to find the actual number.

  Let $p$ be the accuracy of the predictor.
  *   **If you 1-Box:** You get \$1M if the predictor was right (prob $p$). You get \$0 if wrong (prob $1-p$).
      *   $EU(\text{1-Box}) = 1,000,000p$
  *   **If you 2-Box:** You get \$1,000 (Box A) + \$1M if the predictor was wrong (prob $1-p$). You get \$1,000 + \$0 if right (prob $p$).
      *   $EU(\text{2-Box}) = 1,000 + 1,000,000(1-p)$

  To find the tipping point, set them equal:
  $$1,000,000p = 1,000 + 1,000,000 - 1,000,000p$$
  $$2,000,000p = 1,001,000$$
  $$p = 0.5005$$

  **The threshold is 50.05%, not 55%.**
  If the predictor is better than a coin flip (even by a tiny bit), EDT says 1-box. If the predictor is worse than a coin flip, EDT says 2-box.

  **Why did your friend say 55%?**
  She's likely intuiting that at *very low* accuracy, the guaranteed \$1,000 in Box A feels safer than gambling on the \$1M. But mathematically, as soon as the predictor is more likely to be right than wrong, the \$1M swamps the \$1k. Her intuition about a *threshold* is correct, but the specific number is just a guess.

  ### 3. How to Hold "No Magic" and "1-Box" Together
  You asked: *"I genuinely can't see how you hold 'my choice can't affect whats already in the box' together with 'I take one box' without contradicting yourself."*

  Here is the move you are missing. It depends on what you think "Rationality" is for.

  **The Causal View (Your current view):**
  Rationality is about **causal leverage**. Since I cannot causally affect the past, I should maximize my gain in the *actual* state of the world I'm in.
  *   If Box B is full: 2-boxing gets me \$1,001,000. (1-boxing gets \$1,000,000).
  *   If Box B is empty: 2-boxing gets me \$1,000. (1-boxing gets \$0).
  *   In *both* cases, 2-boxing is better by \$1,000. This is the **Dominance Principle**.
  *   **Result:** You 2-box. You walk away with \$1,000 (because the predictor knew you'd do this).

  **The Evidential View (The 1-box view):**
  Rationality is about **getting the best outcome**.
  *   People who 1-box walk away with \$1,000,000.
  *   People who 2-box walk away with \$1,000.
  *   If I want \$1M, I should do what the \$1M-people do.
  *   **Result:** You 1-box. You walk away with \$1,000,000.

  The contradiction disappears if you accept that **your decision algorithm is what was predicted.** The Predictor didn't predict "What will he do at 2 PM?"; they predicted "What is his decision algorithm?"
  When you stand there choosing, you are executing that algorithm. You aren't changing the past; you are **fulfilling** the prediction.

  ### 4. What to Write on the Final
  Your professor wants to see that you understand the conflict between **Dominance** (CDT) and **Expected Utility** (EDT).

  *   **If you argue for CDT (2-Box):** Emphasize that the state of Box B is a "fixed past fact." Your action cannot causally influence it. Therefore, the \$1,000 in Box A is "free money" that you are irrational to leave behind. Acknowledge that you will likely end up poorer (\$1k vs \$1M), but argue that you made the *rationally justifiable* choice given the causal structure.
  *   **If you argue for EDT (1-Box):** Emphasize that rationality is about maximizing expected return. Since your choice is highly correlated with the content of Box B, ignoring that correlation is ignoring reality. You aren't claiming backwards causation; you are claiming that your choice is **evidence** of the box's content.
  *   **The "Sophisticated" Move (Functional Decision Theory):** If you want to impress them, mention that modern decision theorists (like those at MIRI or FDT proponents) resolve this by saying your choice and the prediction share a **logical cause**. You and the simulation are running the same logic. Therefore, deciding to 1-box *logically necessitates* that the prediction was 1-box. This allows you to 1-box without believing in magic, by treating the prediction as a logical output of the same function you are currently running.

  ### Summary
  *   **Your intuition:** Standard Causal Decision Theory. It's consistent, but it leaves money on the table.
  *   **Your friend's intuition:** Evidential Decision Theory. She's right about the threshold logic, wrong about the specific 55% number (it's ~50%).
  *   **The Resolution:** You don't need backwards causation. You just need to accept that your choice is *correlated* with the past prediction because both stem from "who you are."

  Don't let it break your brain. The fact that you're struggling with it means you're actually understanding the paradox. Good luck on the final!
