      *   **Constraint:** Do not paper over the residue. It's the most important part.

  2.  **Deconstruct the Historian's Concepts into Statistical Terms:**

      *   *Report as evidence vs. event itself:* Observation $Y$ vs. Latent Variable $\theta$. The text is data, the past is the parameter.
      *   *Independent attestation vs. chain of copies:* Independent samples ($Y_1, Y_2 \sim P(Y|\theta)$) vs. Dependent/Markovian propagation ($Y_2 \sim P(Y_2|Y_1)$). Variance reduction in the former, error accumulation in the latter.
      *   *Per-source bias vs. random noise:* Systematic error (bias term $\beta$) vs. Stochastic error ($\epsilon \sim N(0, \sigma^2)$).
      *   *Argument from silence:* Missing data mechanisms. Is it Missing Completely at Random (MCAR), Missing at Random (MAR), or Missing Not at Random (MNAR)?
      *   *Background plausibility:* Prior distribution $P(\theta)$.
      *   *Regress of testimony:* Hierarchical modeling / Latent variable chains. $Y \leftarrow \text{Witness} \leftarrow \text{Event}$. Or infinite regress if not anchored.
      *   *Surviving record as selected sample:* Selection bias / Truncation / Censoring. The observed data $D_{obs}$ is a subset of $D_{total}$ based on a selection function $S$.

  3.  **Drafting the Translation (Step-by-Step):**

      *   *Introduction:* Acknowledge the parallel. History is inference on latent variables with high measurement error and selection bias.
      *   *Concept 1: Event vs. Report.* Latent state $E$. Observation $R$. $P(R|E)$.
      *   *Concept 2: Independence.* Covariance structure. Genealogical dependence reduces effective $N$.
      *   *Concept 3: Bias vs. Noise.* Systematic vs. Random effects in the likelihood function.
      *   *Concept 4: Silence.* $P(\text{No Record} | E)$. Crucial distinction between $P(\text{No Record})$ and $P(\text{No Record} | E)$.
      *   *Concept 5: Plausibility.* Priors based on external models (physics, sociology).
      *   *Concept 6: Regress.* Hierarchical layers. Stopping rules.
      *   *Concept 7: Survival.* Selection function $S(D)$. Posterior is $P(E | D_{obs}, S)$.

  4.  **Developing the Residue Report (The Critical Analysis):**

      *   *Clean Maps:* Priors (plausibility), Likelihood (source reliability), Hierarchical models (testimony chains), Selection Bias (survival).
      *   *Distortions/Forcing:*
          *   *Independence:* Historians mean "no collusion," stats means "conditional independence." But witnesses often share cultural priors, making them conditionally dependent even without collusion.
          *   *Bias:* Historians talk about "tendency" or "agenda." Stats treats this as a shift in mean. But narrative bias is structural, not just additive.
      *   *No Counterpart / Gaps:*
          *   *Meaning/Semantics:* Stats deals with values; History deals with *meaning* of texts. Hermeneutics.
          *   *Uniqueness:* Stats relies on populations/frequencies. Historical events are often $N=1$ (singularities). Frequentist probabilities don't apply; Bayesian helps but the "population" is hypothetical.
          *   *Reflexivity:* The historian is part of the system. The observer affects the classification of the data.
          *   *The "Human" Element:* Agency, intent. A statistical model treats a lie like a measurement error. A historian treats a lie as *data* about the liar's intent.

  5.  **Refining the Tone:**
