answer: |-
  Here is the translation of the historian's epistemological problem into the vocabulary of Bayesian inference and measurement error, followed by the Residue Report you requested.

  ### Part I: The Statistical Restatement of Source Criticism

  **1. The Event vs. The Report (Latent Variables vs. Observations)**
  *   **Historian:** We cannot observe the past event ($E$); we only observe the text/report ($R$). We must not confuse $R$ with $E$.
  *   **Statistician:** The event $E$ is a latent variable $\theta$. The report $R$ is an observation $Y$. We are trying to estimate the posterior $P(\theta | Y)$. The core problem is specifying the likelihood function $P(Y | \theta)$, which represents the data-generating process of the testimony.

  **2. Independent Attestation vs. Chain of Copies (Conditional Independence vs. Markov Propagation)**
  *   **Historian:** Two witnesses who did not collude provide stronger evidence than one witness copied ten times.
  *   **Statistician:**
      *   *Independent Attestation:* You have $Y_1, Y_2$ where $Y_1 \perp Y_2 | \theta$. The likelihood multiplies: $\mathcal{L}(\theta) = P(Y_1|\theta)P(Y_2|\theta)$. Variance on the estimate of $\theta$ decreases as $1/n$.
      *   *Chain of Copies:* You have a Markov chain $Y_1 \rightarrow Y_2 \rightarrow \dots \rightarrow Y_k$. Here, $Y_k$ is conditionally independent of $\theta$ given $Y_{k-1}$. Information degrades over steps (Data Processing Inequality). $Y_k$ adds negligible Fisher information about $\theta$ compared to $Y_1$. Treating them as independent samples is pseudoreplication.

  **3. Per-Source Bias vs. Random Noise (Systematic vs. Stochastic Error)**
  *   **Historian:** Some authors lie or exaggerate systematically (bias); others just get details wrong randomly (noise).
  *   **Statistician:**
      *   *Noise:* $Y = \theta + \epsilon$, where $\epsilon \sim N(0, \sigma^2)$. Averaging reduces this.
      *   *Bias:* $Y = \theta + \beta + \epsilon$, where $\beta$ is a source-specific fixed effect (e.g., "pro-Roman bias"). If $\beta$ is unknown and unmodeled, the estimator is inconsistent. You cannot average away systematic bias; you must model $\beta$ hierarchically or include it as a nuisance parameter.

  **4. The Argument from Silence (Missing Data Mechanisms)**
  *   **Historian:** Just because no one mentions an event doesn't mean it didn't happen. But if an event *should* have been mentioned and wasn't, that is evidence.
  *   **Statistician:** This is a problem of Missing Data. Let $M$ be the indicator that a record exists.
      *   *MCAR (Missing Completely at Random):$P(M=1 | \theta) = P(M=1)$. Silence tells you nothing about $\theta$.
      *   *MNAR (Missing Not at Random):* $P(M=1 | \theta)$ depends on $\theta$. If large events are more likely to be recorded ($P(M=1|\theta_{\text{large}}) > P(M=1|\theta_{\text{small}})$), then observing $M=0$ updates the prior on $\theta$ toward smaller values. The "Argument from Silence" is valid only if you can model the selection probability $P(M=1|\theta)$ and show it is high for the $\theta$ in question.

  **5. Background Plausibility (The Prior)**
  *   **Historian:** Claims of miracles are less believable than claims of rain. We weigh reports against what we know about how the world works.
  *   **Statistician:** This is the Prior Distribution $P(\theta)$. A claim of a miracle corresponds to a $\theta$ in the extreme tail of the prior (based on physical laws). To overcome a low prior, the Likelihood Ratio $\frac{P(Y|\theta_{\text{miracle}})}{P(Y|\theta_{\text{normal}})}$ must be astronomically high. Most historical testimony has too much measurement error to overcome a strong skeptical prior.

  **6. The Regress of Testimony (Hierarchical Modeling)**
  *   **Historian:** Source A cites Source B, who cites Source C. Where does the knowledge originate?
  *   **Statistician:** A hierarchical latent variable model.
      $$Y_A \leftarrow \theta_A \leftarrow \theta_B \leftarrow \theta_C \leftarrow \theta_{\text{Event}}$$
      Each arrow introduces a transition probability (error rate). As the chain lengthens, the posterior variance on $\theta_{\text{Event}}$ explodes unless anchored by an external constraint. If the chain is infinite or the anchor is unknown, the model is unidentifiable.

  **7. The Surviving Record as a Selected Sample (Selection Bias / Truncation)**
  *   **Historian:** We only have the books that survived. The ones that burned were likely different.
  *   **Statistician:** The observed dataset $D_{\text{obs}}$ is a truncated sample of the true population $D_{\text{true}}$. The survival function $S$ is correlated with the content $\theta$.
      $$P(D_{\text{obs}} | \theta) = P(D_{\text{true}} | \theta) \times P(S=1 | D_{\text{true}}, \theta)$$
      If you ignore $P(S=1 | \dots)$, your inference is biased. For example, if controversial texts were burned more often, the surviving corpus overrepresents orthodox views. You are fitting a model to a non-representative subset.

  ***

  ### Part II: The Residue Report

  Here is the audit of the translation. This section details where the statistical framework fails to capture the historiographical reality, categorized by the nature of the gap.

  #### 1. Clean Mappings (High Fidelity)
  *   **Priors and Plausibility:** The Bayesian formulation of "background knowledge" is a near-perfect match for the historian's "contextual plausibility." Both require explicit quantification of belief before seeing the data.
  *   **Pseudoreplication (Chains of Copies):** The distinction between independent samples and Markovian propagation is mathematically identical in both fields. The Data Processing Inequality is the formal proof of the historian's intuition.
  *   **Selection Bias (Survival):** The problem of the surviving record is formally identical to survival analysis with informative censoring. The statistical tools (inverse probability weighting, selection models) are directly applicable.
  *   **Systematic vs. Random Error:** The distinction between bias ($\beta$) and noise ($\epsilon$) maps cleanly. Historians intuitively know you can't average away a liar, just as statisticians know you can't average away a miscalibrated instrument.

  #### 2. Distorted Mappings (Forced Fits)
  *   **The Definition of "Independence":**
      *   *The Distortion:* In statistics, independence is conditional on the parameters ($Y_1 \perp Y_2 | \theta$). In history, "independence" usually means "no causal link between witnesses."
      *   *The Gap:* Two witnesses can be causally independent (didn't talk) but *statistically dependent* because they share a cultural prior (e.g., both believe in omens). A statistical model treating them as independent samples will overstate the precision of the estimate. Historians sense this ("they were men of their time"), but standard likelihood frameworks struggle to model shared latent cultural confounders without explicitly modeling the culture itself.
  *   **The Likelihood Function ($P(Y|\theta)$):**
      *   *The Distortion:* Statistics assumes the likelihood function is a property of the *measurement instrument*. In history, the "instrument" is a human agent with intent.
      *   *The Gap:* A statistical model treats a lie as a high-variance error or a bias term. But a lie is often *strategic*. The error structure depends on $\theta$ (e.g., "I lie more if the truth is incriminating"). This makes the likelihood function endogenous. $P(Y|\theta)$ changes based on the value of $\theta$. This violates standard assumptions of exogenous measurement error.

  #### 3. No Counterpart (The True Residue)
  These are concepts central to historiography that have no direct analog in your statistical vocabulary.

  *   **Hermeneutics (The Semantics of $Y$):**
      *   *The Gap:* In statistics, the data vector $Y$ is given and its meaning is fixed (e.g., $Y=5$ means 5 units). In history, determining what $Y$ *is* is part of the inference. Does "he crossed the river" mean a military invasion or a diplomatic visit?
      *   *Analysis:* This is not a defect of your framework; it is a pre-processing problem. However, in history, the "pre-processing" (translation, contextual interpretation) is theory-laden. You cannot separate the measurement from the model. A statistician assumes the data dictionary is stable; a historian knows the data dictionary (language/culture) is the very thing being reconstructed.
  *   **Singularities ($N=1$):**
      *   *The Gap:* Statistics relies on the Law of Large Numbers or hypothetical populations. Historical events (the Fall of Rome, the Crucifixion) are often treated as singularities.
      *   *Analysis:* Bayesian methods handle $N=1$ better than frequentist ones, but they still require a prior derived from a "population" of similar events. Historians often argue that an event is *sui generis* (unique). If $\theta$ is truly unique, there is no reference class for the prior. This is a defect of the statistical framework: it cannot handle true uniqueness, only rarity.
  *   **Agency and Intent as Data:**
      *   *The Gap:* In your framework, a bias $\beta$ is a nuisance parameter to be controlled. In history, the bias *is* the signal. If a source lies about a battle, the lie is noise regarding the battle, but high-fidelity data regarding the source's political anxiety.
      *   *Analysis:* This suggests a multi-objective optimization problem. Statistics usually seeks the "true" $\theta$ (the event). Historians often seek the "true" $\beta$ (the author's mindset) *simultaneously*, sometimes valuing $\beta$ more than $\theta$. Your framework treats bias as error; historiography treats bias as evidence.
  *   **Reflexivity:**
      *   *The Gap:* The historian is located in time and culture, affecting the classification of $Y$.
      *   *Analysis:* In statistics, the analyst is external to the model. In historiography, the analyst is part of the system. Your framework assumes the modeler is objective. If the modeler's priors are determined by their own historical moment (which they are), the posterior is a function of the observer's location in time. There is no "view from nowhere" in your equations, but your equations assume one.

  ### Final Diagnosis: Defect or Feature?

  **1. Where the gap is a defect of the Statistical Framework:**
  The inability to handle **endogenous likelihoods** (where the truth changes the error rate strategically) and **true singularities** (lack of a reference class for priors) are limitations of formal inference. Statistics is designed for repeatable phenomena or exchangeable sequences. History is often about non-exchangeable, strategic, unique events. If you rely solely on the math, you will underestimate the uncertainty in singular, high-stakes events.

  **2. Where the gap is a defect of the Historian's Distinction:**
  Historians often speak of "independence" or "bias" as binary or qualitative states. Your framework reveals these as continuous parameters (covariance, shift terms). When historians argue over whether a source is "biased," they are often arguing over the magnitude of $\beta$. The statistical framework forces a precision that historiography sometimes lacks, revealing that some historical debates are under-identified models (multiple combinations of bias and truth yield the same observation).

  **3. The Unbridgeable Residue:**
  The **Hermeneutic Circle**. In statistics, you define variables, then collect data. In history, you collect data (texts) to define the variables (concepts/culture), which redefines the data. This feedback loop has no counterpart in standard inference. It implies that $Y$ and $\theta$ are co-constitutive.

  **Recommendation:** Use your Bayesian toolkit to structure the *relationships* between sources (hierarchies, selection bias, dependence). It will vastly improve your rigor on provenance and survival bias. However, do not trust the posteriors blindly. The likelihood functions in history are not known physical laws; they are speculative models of human behavior. Treat the likelihood specification itself as the primary source of uncertainty, far outweighing the parameter uncertainty within the model.
