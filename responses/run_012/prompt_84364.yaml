answer: |-
  **Project Title:** Two Jobs for "Reason": Dissolving the Internal/External Debate via Pragmatic Ambiguity

  **Research Question**
  Is the stalemate between Internalism and Externalism regarding normative reasons best explained as a substantive metaphysical disagreement, or as a pragmatic ambiguity between the *advisory* function (guiding deliberation) and the *accountability* function (grounding blame)?

  **Background and Problem**
  Bernard Williams' *Internal and External Reasons* (1979) argues that for R to be a reason for A to φ, R must link to A's "subjective motivational set" (Internalism). Externalists (e.g., Nagel, Parfit) counter that reasons exist independently of motivation, particularly in moral contexts. Decades of literature have entrenched this dichotomy. However, both sides struggle to account for the full range of reason-talk without counterintuitive results: Internalism struggles to condemn the "amoralist" (e.g., the cruel husband who doesn't care about kindness), while Externalism struggles to explain how a reason can *guide* an agent who cannot access it.

  My hypothesis is that "reason" is not a univocal term in this debate. It performs two distinct speech acts:
  1.  **Advisory:** "What should I do?" (Requires an internal hook to be action-guiding).
  2.  **Accountability:** "Was that wrong?" (Requires an external standard to justify blame).
  The debate persists because Internalists analyze the Advisory function, while Externalists analyze the Accountability function, yet both claim to be defining "Reasons" simpliciter.

  **Methodology and Summer Plan**
  I will not produce a comprehensive history of the debate. Instead, I will operationalize the hypothesis through three specific steps:
  1.  **Case Study Reconstruction:** I will take Williams' own "Cruel Husband" example and reconstruct the dialogue. I will isolate exactly where the conversation shifts from *deliberative advice* (where Williams is right) to *moral condemnation* (where the Externalist intuition holds).
  2.  **Textual Stress-Testing:** I will examine three key arguments from the literature (one from Williams, one from Parfit, one from a contemporary hybrid theorist) to demonstrate where each argument collapses if the dual-function distinction is applied. The goal is to show the arguments attack different targets.
  3.  **Model Construction:** I will draft a formal distinction between *Reasons-for-Deliberation* and *Reasons-for-Evaluation*, outlining the necessary and sufficient conditions for each.

  **Expected Outcomes and Success Criteria**
  A superficial result would be merely stipulating a distinction and declaring the debate over. A successful result must demonstrate *explanatory power*. Specifically, the project will succeed if:
  1.  It explains why the "amoralist challenge" feels compelling to Externalists but category-mistaken to Internalists.
  2.  It preserves the insights of both sides (Internalism about psychology, Externalism about normativity) without requiring a metaphysical compromise.
  3.  It produces a draft paper (approx. 3,000 words) that resolves a specific paradox in the literature (e.g., how one can have a reason they cannot be motivated by) using the dual-function model.

  **Feasibility and Scope**
  This project is ambitious for a summer. A full meta-ethical defense of this ambiguity could take years. To make this feasible, I am limiting the scope to *dissolving the stalemate* rather than *proving the metaphysics*. I will not attempt to solve the "normativity of reason" generally, but only to show that the Internal/External impasse is verbal/pragmatic in nature. The risk is that the distinction may appear ad hoc. I will mitigate this by grounding the distinction in existing speech-act theory and ensuring the "Cruel Husband" case study yields clear, divergent verdicts under the two functions. If the distinction does not cleanly separate the advisory and accountability intuitions in the case study, I will pivot to analyzing why the distinction fails, which is itself a valuable negative result.
