      *   **Task:** Write a one-page research proposal for a summer philosophy program.
      *   **Core Idea:** The internal vs. external reasons debate (Bernard Williams et al.) is a verbal dispute/confusion between two distinct functions of "reason": *advisory* (guiding action based on existing motivations) vs. *accountability* (blame/praise regardless of motivations).
      *   **Requirements:**
          *   State the exact question (determinate answer).
          *   Explain why standard positions (Internalism/Externalism) don't settle it.
          *   Outline specific summer steps (methodology, not just reading).
          *   Define success criteria (real result vs. mere distinction).
          *   Include an honest feasibility assessment (is it too big?).
      *   **Tone:** Academic, precise, humble but confident, fitting for a summer program application.
      *   **Constraint:** One page (approx. 500-600 words).

  2.  **Deconstruct the Core Idea:**
      *   *The Problem:* Williams argues reasons must link to the "subjective motivational set" (Internalism). Externalists argue reasons exist independently of motivations.
      *   *The Hypothesis:* This isn't a metaphysical disagreement about the *nature* of reasons, but a pragmatic ambiguity about the *use* of reason-talk.
      *   *The Two Uses:*
          1.  **Deliberative/Advisory:** "What should I do?" (Requires internal hook).
          2.  **Evaluative/Accountability:** "Was that wrong?" (Allows external standard).
      *   *The Goal:* Show that dissolving the debate requires mapping these speech acts, not choosing a side.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. *Two Jobs for "Reason": Dissolving the Internal/External Debate via Speech Act Analysis.*
      *   **Research Question:** Needs to be specific. Not "Are there external reasons?" but "Does distinguishing the pragmatic functions of reason-claims resolve the stalemate?"
      *   **Background/Problem:** Briefly mention Williams (*Internal and External Reasons*). Acknowledge the stalemate. Introduce the hypothesis (Ambiguity of function).
      *   **Methodology (The Summer Plan):** This needs to be actionable.
