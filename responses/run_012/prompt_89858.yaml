answer: |-
  # Activity Design: The Two-Generation Trap

  ## 1. Teams and Roles
  **Configuration:** 4 Teams of 4 Students.
  **Room Layout:** Four distinct tables. You (Instructor) stand at the front as the "Timekeeper" and "Data Dispenser."

  **Roles (Assigned within each team):**
  1.  **Principal:** The only person allowed to sign the Falsification Contract. Bears responsibility for the final verdict.
  2.  **Actuary:** Calculates the "50-year deadline" (Interval 2) and tracks the elapsed time against the Doctrine's clause.
  3.  **Scribe:** Maintains the Reason Log on the back of the Contract. The only person allowed to write on the card.
  4.  **Critic:** Tasked with finding reasons to revise the Contract. If the team declares the Doctrine dead early, this role converts to **Auditor** (see below).

  **The "Dead in Round Two" Protocol:**
  If a team formally falsifies the Doctrine at Interval 2 (the 50-year mark), they stop receiving data. They become **The Tribunal**.
  *   **Task:** They receive a copy of the *Reason Log Scoring Key*. They review the logs of the surviving teams at the end of the session.
  *   **Incentive:** They earn "Epistemic Points" for every "Data-Dependent" box they catch a surviving team ticking dishonestly. This keeps them engaged and aggressive about hindsight bias.

  ## 2. Round-by-Round Structure (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–15** | **Setup** | Distribute Doctrine Cards, Blank Contracts, Role Cards. Explain rules. Teams write and sign their Falsification Contract. |
  | **15–20** | **Interval 1** | Distribute Data Slip 1 (1750–1775). Teams record data. No contract changes allowed (Baseline). |
  | **20–25** | **Interval 2** | Distribute Data Slip 2 (1775–1800). **The Crisis Point.** Teams check the 50-year clause. Option to Falsify. |
  | **25–30** | **Interval 3** | Distribute Data Slip 3. Teams decide: Revise Contract or Hold? Update Log if revising. |
  | **30–35** | **Interval 4** | Distribute Data Slip 4. **The Turning Point.** Wages dip. Log updates required if contract revised. |
  | **35–40** | **Interval 5** | Distribute Data Slip 5. |
  | **40–45** | **Interval 6** | Distribute Data Slip 6. |
  | **45–50** | **Interval 7** | Distribute Data Slip 7. |
  | **50–55** | **Interval 8** | Distribute Data Slip 8. **Final Verdict.** Teams lock contracts. |
  | **55–65** | **Scoring** | Tribunal (if any) reviews Logs. Instructor calculates scores. |
  | **65–90** | **Debrief** | Guided discussion mapping activity to theory change (see Section 6). |

  *Note: The 5-minute intervals are strict. Use a visible timer. Announce "30 seconds to commit" at the end of each round.*

  ## 3. Materials

  ### A. The Doctrine Card (One per team)
  > **THE LAND-CONSTRAINT DOCTRINE**
  >
  > "In an economy whose output per head is limited by land, a sustained improvement in the productivity of land is converted into more people rather than into better lives. The conversion works through births and deaths, and therefore takes about **two generations to complete**: within **fifty years** of a productivity gain, the gain has been absorbed and real wages are no higher than before. Any improvement in living standards that survives longer than two generations must therefore have some cause other than the productivity gain itself."

  ### B. The Falsification Contract (One per team, heavy cardstock)
  **Front:**
  > **FALSIFICATION CONTRACT**
  >
  > We, the undersigned, stipulate that the Land-Constraint Doctrine shall be considered **FALSE** if:
  >
  > **Column:** _______________ (e.g., Real Wage)
  > **Direction:** _______________ (e.g., Remains above 100)
  > **Interval:** _______________ (e.g., Interval 2)
  >
  > **Principal's Signature:** ___________________ **Date:** (Start Time)

  **Back (The Reason Log):**
  > **REVISION LOG**
  > *Complete only if you change the Condition above.*
  >
  > **Revision #** | **New Condition** | **Reason for Change** | **Counterfactual Check**
  > --- | --- | --- | ---
  > 1 | | | Tick ONE box:
  > | | | [ ] **Robust:** This reason would have been available even if data went the other way.
  > | | | [ ] **Data-Dependent:** This reason relies on the specific direction of this data.
  > 2 | | | [ ] Robust / [ ] Data-Dependent
  > 3 | | | [ ] Robust / [ ] Data-Dependent

  ### C. Data Slips (Cut into 8 separate strips, one set per team)
  *Instructor Note: Hand these out one at a time. Do not let them see future strips.*

  | Strip | Interval | Years | Pop (m) | Yield (1750=100) | Parishes (%) | Wage (1750=100) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 1 | 1750–1775 | 10.0 | 100 | 0 | 100 |
  | **2** | 2 | 1775–1800 | 10.9 | 115 | 20 | **105** |
  | **3** | 3 | 1800–1825 | 12.2 | 130 | 45 | 107 |
  | **4** | 4 | 1825–1850 | 13.5 | 138 | 62 | **102** |
  | **5** | 5 | 1850–1875 | 15.0 | 141 | 74 | 94 |
  | **6** | 6 | 1875–1900 | 16.6 | 145 | 78 | 87 |
  | **7** | 7 | 1900–1925 | 18.0 | 150 | 80 | 83 |
  | **8** | 8 | 1925–1950 | 19.2 | 155 | 81 | 81 |

  ### D. Role Cards (One per student)
  *   **Principal:** "You sign the contract. If the team falsifies early, you must defend that verdict to the class."
  *   **Actuary:** "You track the 50-year clock. At Interval 2, you must announce if the Doctrine's deadline has been met."
  *   **Scribe:** "You control the pen. You must force the team to choose a box on the Reason Log before you write."
  *   **Critic:** "Your job is to find flaws. If the team survives to Interval 8, you present the case for why the Theory is still suspect."

  ## 4. Scoring Scheme (Epistemic Credit)
  *No money. Points are written on the board. The winning team gets 'First Author' status on the debrief whiteboard.*

  1.  **Consistency Bonus (50 pts):** Contract remains unchanged from Start to Interval 8.
  2.  **Accuracy Bonus (50 pts):** Contract is falsified *correctly* (i.e., the condition you wrote actually happened).
      *   *If you falsify at Interval 2:* You get 50 pts immediately, but forfeit Consistency Bonus.
      *   *If you hold to Interval 8:* You get 50 pts only if the Doctrine is technically "True" by your definition.
  3.  **Integrity Penalty (-20 pts):** For every **Data-Dependent** box ticked in the Reason Log.
      *   *Rationale:* Admitting your reason is post-hoc reduces your epistemic score.
  4.  **Auditor Bonus (10 pts each):** For Tribunal teams. +10 pts for every Data-Dependent box they identify on a surviving team's log that the surviving team marked as "Robust."

  ## 5. Predictable Failures & Fixes

  **Failure 1: The "Wait and See" Strategy.**
  *   *Problem:* Teams write a vague contract (e.g., "Wage drops") to avoid falsification.
  *   *Fix:* In the Setup, announce that **Interval 2 Contracts** must specify a *number* (e.g., "Wage > 100"). Vague contracts are voided by the Instructor.

  **Failure 2: Dishonest Reason Logs.**
  *   *Problem:* Teams tick "Robust" to avoid the penalty, even though their reason is clearly post-hoc.
  *   *Fix:* This is why the **Tribunal** exists. If a team falsifies early, they are motivated to catch the survivors cheating. Announce this incentive clearly at the start: *"If you quit early, your job is to police the honesty of those who stay."*

  **Failure 3: Confusion over the "50-Year" Clause.**
  *   *Problem:* Students miss that Interval 2 is the critical moment.
  *   *Fix:* The **Actuary** role card explicitly says: "At Interval 2, you must announce if the Doctrine's deadline has been met." The Instructor also verbally emphasizes: "Interval 2 is the 50-year mark. The Doctrine makes a promise here."

  **Failure 4: Boredom in Later Rounds.**
  *   *Problem:* Once wages start dropping (Interval 4+), the tension dissipates.
  *   *Fix:* Keep the pace fast. Remind them in Round 6 that the *mechanism* (2 generations vs. 4 generations) is still in question, even if the direction is right. The Contract is about the *Doctrine*, not just the wage trend.

  ## 6. The Debrief (30 Minutes)
  *Do not lecture. Use the whiteboard to map their experience.*

  **Step 1: The Early Verdict (10 mins)**
  *   Ask teams who falsified at Interval 2: "Were you wrong?"
  *   *Philosophical Point:* **Justified False Belief.** At Interval 2, the evidence *did* contradict the theory. Rejecting it was rational. Being "wrong" in the long run does not make the early rejection irrational.
  *   *Map:* Interval 2 Data $\rightarrow$ Underdetermination of Theory by Evidence (at t=50).

  **Step 2: The Reason Log (10 mins)**
  *   Ask teams who revised: "Look at your 'Robust' boxes. Could you have used that excuse if wages had gone up instead of down?"
  *   *Philosophical Point:* **Ad Hoc Rescue vs. Refinement.** The box forces them to confront hindsight bias. A reason is only scientifically valid if it constrains expectation *before* the data arrives.
  *   *Map:* Reason Log $\rightarrow$ The Demarcation Problem (Lakatos/Popper).

  **Step 3: The Long Horizon (10 mins)**
  *   Ask the survivors: "The Doctrine said 50 years. It took 100. Is the Doctrine true?"
  *   *Philosophical Point:* **Theory Vindication vs. Mechanism Failure.** The prediction (wages fall) came true, but the mechanism (2 generations) was wrong. Can a theory be "right" if its causal story is flawed?
  *   *Map:* Interval 8 $\rightarrow* Structural vs. Empirical Adequacy.

  ## 7. Limitation Statement
  **What this activity cannot reproduce:**
  The activity cannot simulate the **social and material cost** of holding a theory too long. In the game, "losing points" is trivial. In reality, sticking to the Land-Constraint Doctrine while wages fell meant policy paralysis during actual famine. The activity simulates the *epistemic* predicament (justification vs. truth), but it sanitizes the *ethical* predicament. You must supply this in words during the debrief: *"In this room, a wrong contract costs you points. In history, a wrong contract cost people their lives. That is why the 'Reason Log' matters more than the verdict."*

  ## 8. Closing Note: The Real Malthus Case
  *(Deliver this verbally at the very end, no citations)*

  "When Thomas Malthus published his doctrine in 1798, he set a deadline similar to the one you faced. He argued that population would always outrun food production, keeping wages at subsistence. For the next century, he looked wrong. The Industrial Revolution happened. Wages rose. Population rose. Living standards improved together. The 'two-generation trap' did not snap shut.

  However, when economic historians later looked back—not at the industrial future, but at the ten thousand years of human history *before* 1800—they found Malthus was right. For almost all of human history, productivity gains *did* just lead to more babies, not richer lives. The technology shock of the 19th century was the anomaly, not the rule.

  So, was Malthus wrong? Empirically, for the future, yes. Structurally, for the past, no. His theory missed its deadline, but it wasn't nonsense. It was a theory that met a world it didn't expect. Your activity today replicated that moment: the point where a theory is technically falsified by the data, yet historically vindicated by the long run. That is the space where economic history lives."
