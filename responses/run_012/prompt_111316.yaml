answer: |-
  Your eight verdicts are remarkably consistent, but they are not consistent with the hypothesis you started with ("a text means what its author meant"). They are, however, consistent with a single, more precise principle, provided you are willing to treat one of your verdicts not as a data point to be saved, but as an error to be corrected.

  Here is the principle that delivers seven of your eight verdicts, the diagnosis of the outlier, two diagnostic cases, and the distinction you requested.

  ### The Principle: Public Communicative Competence

  **Core Statement:** A text's meaning is the set of interpretations that a **competent reader**, equipped with the **linguistic conventions** and **public context** available at the time of publication, can reasonably construct from the **final public artifact**.

  This principle relies on four specific clauses to handle your cases:

  1.  **The Artifact Clause:** The locus of meaning is the finalized public object, not the private mind or the draft.
      *   *Motivating Case:* Your **Novelist/Interview (Case 6)** and **Editor (Case 7)**. The interview is external evidence; the edited line is the new artifact. Once the author acquiesces to the edit, the artifact is updated. Meaning follows the artifact.
  2.  **The Recoverability Constraint:** Authorial intention counts only insofar as it is encoded in the text or the public context. Private facts, unrecoverable by a competent reader, do not constitute meaning.
      *   *Motivating Case:* Your **Diplomat (Case 2)**. The author meant "impartial," but the public text and context supported "bored." Because "impartial" was not recoverable, it is not the meaning.
  3.  **The Coherence Repair:** If the literal text renders the passage internally contradictory or mechanically nonsensical, we assume a transmission error and repair it to the nearest coherent intention.
      *   *Motivating Case:* Your **History Typo (Case 1)**. "Unanimous" followed immediately by "dissent" creates a logical contradiction. The text fails to function as text, so we repair the noise to restore the signal.
  4.  **The Plurality Permission:** If the public artifact supports multiple coherent readings via standard conventions, all such readings are valid meanings, regardless of authorial awareness or origin.
      *   *Motivating Case:* Your **Poet (Case 4)** and **AI Poem (Case 8)**. The text's capacity exceeds the author's mind (or exists without one). If the structure supports the reading, the meaning is present.

  ### The Outlier: Which Verdict to Give Up

  You must give up **Case 5 (The Novelist's Private Joke)**.

  In this case, you wrote: *"I want to say the joke is nevertheless what that passage means and that every reader since has simply been missing it."*

  This verdict contradicts your verdicts in Case 2 (Diplomat) and Case 6 (Interview). In Case 2, you ruled that intention without textual support is irrelevant. In Case 5, you rule that intention without textual support is *decisive*. You cannot hold both.

  **Why this is a correction, not a cost:**
  Surrendering Case 5 clarifies the distinction between *cause* and *content*. The private fact is the *cause* of the sentence's existence, but it is not the *content* of the sentence's meaning. If meaning could reside in unrecoverable private facts, communication would be impossible; a text could mean anything the author secretly thought, rendering the public words decorative. By correcting this verdict, you align your theory with the reality of how reading works: meaning is a public bridge, not a private vault. The joke exists as a biographical fact about the author, but not as a semantic fact about the book.

  ### Two Diagnostic Cases

  To test the **Principle of Public Communicative Competence** against rival theories (Strict Intentionalism or Radical Reader-Response), consider these two cases. My principle yields specific verdicts that might feel counter-intuitive but remain consistent with your list.

  **Diagnostic Case 1: The Lost Cipher**
  An author writes a diary entry using a complex substitution cipher they invented. They destroy the key before dying. A century later, cryptographers crack the code.
  *   **The Conflict:** Strict Intentionalism says the meaning existed the moment it was written. Radical Reader-Response says it had no meaning until cracked.
  *   **The Principle's Verdict:** Between the writing and the cracking, the text had **no meaning**, only *potential*. It was an artifact, but not a communicative act, because the "competent reader" (defined by available conventions) could not exist. The meaning is constituted only when the convention becomes public/recoverable.
  *   **Why Diagnostic:** It tests the limit of the **Recoverability Constraint**. Unlike your History Typo (Case 1), where context allows repair, here the text is opaque. The principle demands we admit that some artifacts are semantically dead until the context catches up.

  **Diagnostic Case 2: The Retroactive Prophecy**
  A novelist writes a fictional scene in 1950 describing a specific, bizarre disaster. In 2024, that exact disaster occurs. Readers now say the book "means" a prediction of the 2024 event.
  *   **The Conflict:** Reader-Response suggests the new context creates new meaning. Intentionalism says the author couldn't have meant it.
  *   **The Principle's Verdict:** The book does **not** mean a prediction. The *significance* of the book has changed, but the *meaning* is fixed by the public context available at publication (1950). A competent reader in 1950 could not recover "prophecy" from the text.
  *   **Why Diagnostic:** It tests the **Artifact Clause** regarding time. It distinguishes between what a text *says* (fixed by publication context) and what a text *does* (variable based on future uptake). This separates your Columnist case (Case 3), where context is simultaneous, from historical drift.

  ### The Line Between "What It Says" and "What It Does"

  You asked where the line falls if "meaning" is actually two things. Under this principle, the line falls at **Recoverable Convention**.

  1.  **What the Text Says (Semantic Meaning):** This is determined by the **Recoverability Constraint** and **Coherence Repair**. It is the propositional content available to a competent reader using public linguistic rules.
      *   *Example:* In your Columnist case (Case 3), the text *says* "Wonderful news" (literal), but the Semantic Meaning is "Terrible news" because irony is a public convention recoverable from the context of the defeat.
      *   *Example:* In your Private Joke case (Case 5), the text *says* the literal words. The "joke" is not part of what the text says, because the convention required to decode it was not public.

  2.  **What the Text Was Meant/Taken to Do (Pragmatic Force):** This is the effect on the reader or the author's goal. This can exist without meaning (AI Case 8) or fail despite meaning (Private Joke Case 5).
      *   *The Boundary:* If the effect relies on a convention the reader cannot access, it is **Force without Meaning** (The Private Joke). If the effect relies on a convention the reader *does* access, it is **Meaning as Force** (The Irony).

  **Summary:**
  Your list argues for a theory where meaning is a **public event**, not a private possession. It happens when a text meets a context. When the text breaks (Case 1), we fix it to save the event. When the context supports multiple events (Case 4, 8), we allow them all. When the author tries to hold the event hostage to private knowledge (Case 2, 5, 6), we let the public event stand. The only correction required is to admit that a private joke, unreadable by the audience, is a secret, not a meaning.
