answer: |-
  This is a classic problem in historical sociology: the tension between *phenomenological* definitions (what it looks like on the ground) and *structural* definitions (what happens to the system). Your scorecard reveals that you are intuitively distinguishing between **political transition** (USSR, British Empire), **local economic decline** (Detroit), and **societal simplification** (Maya, Rome, Norse).

  Here is an analysis of your draft principle, a proposal for a repaired menu of principles, an application to new cases, and a diagnosis of the unit-of-analysis problem.

  ### 1. Testing Your Draft Principle

  **Your Principle:** *"A society collapses when it loses a level of organization that it cannot rebuild within a generation and that is not simply replaced by an organization of the same kind."*

  **The Verdict Test:**
  *   **USSR:** The Party-state was not rebuilt; it was replaced by a market-authoritarian hybrid. Your principle predicts **Collapse**. Your verdict is **Not Collapse**.
      *   *Failure:* The principle cannot distinguish between a change in *ideological superstructure* (Communism) and a loss of *societal infrastructure* (bureaucracy, industry, literacy).
  *   **Rapa Nui:** Organization changed (Moai cult to Birdman cult), but community persisted. Your principle predicts **Not Collapse** (reorganized). Your verdict is **Not Collapse**.
      *   *Match.*
  *   **Maya:** Palatial organization lost, not rebuilt. Your principle predicts **Collapse**. Your verdict is **Collapse**.
      *   *Match.*
  *   **Detroit:** Industrial organization lost, replaced by service/post-industrial (smaller scale). Your principle predicts **Collapse** (level of org lost). Your verdict is **Not Collapse**.
      *   *Failure:* Detroit is embedded in a larger society (USA) that buffers the loss.

  **Diagnosis:** Your draft principle focuses on *organization* but fails to specify the *scale* of that organization relative to the *unit* being analyzed. It treats the USSR's state apparatus as equivalent to the Maya's palatial system, ignoring that the USSR's underlying industrial and social metabolism remained intact, whereas the Maya's did not.

  ### 2. Candidate Principles

  To reconcile your scorecard, we need to distinguish between the failure of a *regime* and the failure of a *societal metabolism*. Here are two candidate principles.

  #### Principle A: The Sociopolitical Complexity Threshold
  > "A society collapses when it undergoes a rapid, involuntary reduction in sociopolitical complexity (hierarchy, specialization, information flow) that results in a permanently lower capacity for resource extraction and coordination for its core population."

  *   **Why it repairs the USSR case:** The USSR lost a *regime*, but not *complexity*. The bureaucracy, industrial base, and urban network remained functionally equivalent.
  *   **Why it repairs the Detroit case:** Detroit lost complexity, but as a sub-unit of the US, the *core population* was absorbed into the wider national complexity.
  *   **The Clause Forced By:** The **USSR** case forces the clause "permanently lower capacity." The **Detroit** case forces the clause "core population" (implying autonomy).
  *   **The Tension:** This struggles with **Rapa Nui**. Complexity *did* drop (no more monumental stone transport), but you classify it as "Not Collapse." This implies you view Rapa Nui as *adaptive simplification* rather than *systemic failure*.

  #### Principle B: The Institutional Reproduction Principle
  > "A society collapses when its central institutions lose the ability to reproduce themselves and are not replaced by functionally equivalent institutions, leading to the fragmentation of the society's highest level of integration."

  *   **Why it repairs the Maya case:** Divine kingship and tribute networks could not reproduce; they fragmented into smaller chiefdoms.
  *   **Why it repairs the British Empire case:** The Empire dissolved, but the *nation-state* model replaced it as the highest level of integration. It was a transformation of form, not a loss of integration capacity.
  *   **The Clause Forced By:** The **British Empire** forces the clause "functionally equivalent." The **Maya** forces the clause "fragmentation of highest level."
  *   **The Tension:** This struggles with **Norse Greenland**. The highest level of integration was the Church/Norway connection. When that failed, they died. But if the unit is "Greenland Society," the society ceased to exist entirely.

  ### 3. The Best Principle (Synthesized)

  To best fit your scorecard, I propose combining the insights above into a **Metabolic Autonomy Principle**:

  > **"A society collapses when the institutional mechanisms required to sustain its prevailing level of sociopolitical complexity cease to function, resulting in a sustained reduction in the scale of coordination and material throughput for the affected population, provided that population is not buffered by a larger, intact societal system."**

  **How it handles your scorecard:**
  *   **USSR:** Mechanisms changed, but scale of coordination (federal) and throughput (industrial) remained. **(Not Collapse)**
  *   **Maya:** Mechanisms (palaces/tribute) ceased. Scale of coordination (regional) dropped. **(Collapse)**
  *   **Rapa Nui:** Mechanisms changed, scale dropped, *but* the population successfully adapted to new ecological constraints without external imposition. To save your verdict, we must interpret "sustained reduction" as "catastrophic loss of viability." Rapa Nui remained viable; Maya lowlands did not. **(Not Collapse)**
  *   **Detroit:** Population is buffered by the USA. **(Not Collapse)**
  *   **Norse Greenland:** Mechanisms ceased, population did not adapt/vanished. **(Collapse)**
  *   **Western Rome:** Mechanisms ceased, scale of coordination (imperial) dropped to local/feudal. **(Collapse)**

  ### 4. Application to New Cases

  Using the **Metabolic Autonomy Principle**:

  1.  **Indus Valley Cities (c. 1900 BCE):** Urban planning, writing, and long-distance trade vanished; population shifted to smaller, rural settlements.
      *   *Prediction:* **Collapse.** (Loss of complexity, no buffer).
  2.  **Aztec and Inca States (post-Conquest):** The imperial state apparatus was destroyed by Spain. However, indigenous communities and social structures persisted under colonial rule.
      *   *Prediction:* **Political Collapse, Societal Transformation.** If the unit is the *Empire*, it is Collapse. If the unit is the *Andean/Mesoamerican Society*, it is Transformation (similar to USSR). Given your Rome verdict, you likely lean toward **Collapse** of the *State*, but this highlights your unit ambiguity.
  3.  **End of the Ming Dynasty (1644):** Replaced by the Qing. Bureaucracy, Confucian ideology, and economic systems continued seamlessly.
      *   *Prediction:* **Not Collapse.** (Dynastic cycle, not societal failure).
  4.  **Decline of the Ottoman Empire (19th–20th C.):** Gradual loss of territory, culminating in dissolution into nation-states (Turkey, etc.).
      *   *Prediction:* **Not Collapse.** (Transformation into Westphalian system, similar to British Empire).
  5.  **Collapse of the Atlantic Cod Fishery (1992):** Economic resource failure. Communities suffered, but political/social institutions remained intact (Canadian state).
      *   *Prediction:* **Not Collapse.** (Economic shock, not societal simplification).
  6.  **Bankruptcy of a Company Town:** The firm fails, town empties.
      *   *Prediction:* **Not Collapse.** (Buffered by national economy; too small a unit).

  ### 5. Incompatible Verdicts and the Unit Problem

  **The Incompatibility:**
  The principle cannot fully reconcile **Maya** vs. **Rapa Nui** without a value judgment on *viability*.
  *   **Maya:** People persisted, but you call it Collapse because the *Elite System* died.
  *   **Rapa Nui:** People persisted, system changed, you call it Not Collapse because the *Community* survived.
  *   **Conflict:** You are measuring the Maya by the standards of their *Civilization* (Palaces/Writing) and Rapa Nui by the standards of their *Population* (Survival/Adaptation).

  **Simpler vs. Complicated Principle:**
  A simpler principle would be: **"Collapse is the loss of the highest level of political integration."**
  *   *Cost:* This forces you to call the **USSR** and the **British Empire** collapses.
  *   *Benefit:* It removes the ambiguity about "complexity" or "viability."
  *   *Recommendation:* Do not adopt this. It contradicts your sociological intuition that the USSR and British Empire were *transformations*, not disintegrations. The complicated principle (Metabolic Autonomy) is preferable because it captures the difference between a change of government and a loss of societal capacity.

  **The Unit of Analysis:**
  You asked whether the choice of unit is doing most of the work. **Yes, absolutely.**
  *   When you say **Maya = Collapse**, your unit is *Classic Lowland Civilization*.
  *   When you say **USSR = Not Collapse**, your unit is *Post-Industrial Society* (which persisted).
  *   When you say **Detroit = Not Collapse**, your unit is *The United States* (which buffered Detroit).
  *   When you say **Norse = Collapse**, your unit is *The Greenland Colony*.

  **The Fix:**
  You must explicitly define the unit before applying the label. In historical sociology, the standard move is to define the unit as **"The highest level of autonomous sociopolitical integration."**
  *   **Maya:** The City-States were the highest level. They failed. -> Collapse.
  *   **USSR:** The Republics were not autonomous; the *Industrial-Bureaucratic System* was the society. It persisted. -> Not Collapse.
  *   **Detroit:** The City is not autonomous. -> Not Collapse.
  *   **Rapa Nui:** The Island was the highest level. It persisted adaptively. -> Not Collapse.

  ### 6. Conclusion

  Your scorecard is consistent *if and only if* you define collapse not as the end of a state or a people, but as the **failure of a specific mode of sociopolitical complexity to reproduce itself.**

  *   **Overturning a Verdict:** If you want a cleaner theory, overturn the **Rapa Nui** verdict. Recent archeology suggests significant population decline and social strife prior to European contact. Calling it a "local collapse of complexity" aligns it with the Maya and strengthens your theory.
