answer: |-
  Elara leans into the hum of the Causal Lens, her eyes burning from twelve hours of static. The holographic cloud above the table shimmers, resolving into a town council chamber in 2039. Seven faces, tired and lit by the glow of tablets. The motion is on the floor: reroute the Highway 9 extension around the Blackwood Wetlands rather than through them. The vote passes, four to three.

  "Freeze," Elara says. The image locks. "Mark this as Decision Point Alpha."

  "Already done," Marcus says from the shadows behind her. He holds a mug of coffee that has long since gone cold. "You've been watching the wetlands for three days, Elara. What are you looking for?"

  "The net value," she says. She swipes her hand, and the cloud accelerates. The council chamber dissolves into construction sites, then into flowing traffic. "If consequentialism is true, then this vote was right if and only if the outcome was better than the alternative. I need to see the outcome."

  "You see *an* outcome," Marcus corrects. "You see the actuals. You don't see the counterfactual."

  Elara ignores him, zooming in on the year 2045. The highway curves wide. The wetlands remain intact. A family of deer grazes where asphalt would have been. Good. But downriver, the traffic congestion has shifted to the residential district of Oakhaven. Noise pollution spikes. Property values drop. A local business closes. Two workers are laid off.

  "Negative utility in the short term," Elara murmurs, tagging the events with red markers. She fast-forwards to 2060. The wetlands have expanded, acting as a natural flood barrier during the Great Storm of '59. Three hundred homes downstream are saved. Lives spared. She tags them green. "Positive utility."

  "And?" Marcus steps closer, his reflection ghosting over the hologram.

  "And in 2075," Elara says, her voice tight, "the congestion in Oakhaven leads to a delay in an ambulance reaching a heart attack victim. The victim was a researcher on the verge of a breakthrough in battery storage. He dies. The breakthrough is delayed by fifteen years."

  She pauses the simulation. The air in the room feels heavy, charged with the weight of a death that happened decades ago. "So the wetlands saved three hundred homes, but cost us fifteen years of climate technology. How do I weigh that? Is three hundred lives worth fifteen years of carbon reduction?"

  "You're trying to do arithmetic on ghosts," Marcus says. "You're looking at chaos and calling it a ledger."

  Elara pushes the timeline further. 2100. 2150. The cloud branches out, fractal and messy. The descendants of the families saved by the flood barrier spread out across the continent. Some become teachers, some become criminals. One becomes a dictator in a region that shouldn't have had political instability. Another writes a poem that inspires a peace movement. The battery delay means coal plants stay open longer, causing respiratory issues in a different continent.

  The visualization becomes a storm of red and green lights, swirling so fast they blur into a sickly brown.

  "Stop," Elara says. The cloud freezes, hovering like a bruised galaxy. "It doesn't converge. It just gets louder."

  "That's because you're looking too far down the stream," Marcus says. "The signal-to-noise ratio drops to zero after the first decade. After that, it's just butterfly wings and hurricanes. You can't attribute the dictator to the highway vote. Too many variables intercede."

  "But the chain isn't broken," Elara insists. "If they hadn't voted to reroute, the wetlands would have been drained. The flood would have killed the three hundred. The researcher would have lived. The dictator might never have been born. I have the actual world, Marcus. I know what happened. But I don't know if it was *better*."

  "Because 'better' requires a comparison," Marcus says. "And the Lens doesn't show you the world where the vote failed. It only shows you the world where it passed. You know the cost of the decision, but you don't know the cost of the alternative. Maybe the alternative was a nuclear waste dump. Maybe it was a school. You're staring at the result and pretending you can see the balance sheet."

  Elara rubs her temples. "So what's the standard? If I can't know the total consequences, I can't know if I did the right thing. If I can't know that, then morality is just guessing."

  "The standard is foreseeability," Marcus says, his voice firm. "What could a reasonable person, sitting in that council chamber in 2039, have known? They knew the wetlands prevented flooding. They knew the reroute would cause traffic. They didn't know about the researcher. They didn't know about the dictator. You judge them on the map they had, not the territory you're walking on."

  "That's not consequentialism," Elara says. "That's just... damage control."

  "It's sanity," Marcus counters. "If you require total knowledge of the infinite future to act, you never act. You stand paralyzed at the crossroads until you die of old age. The Councilors voted based on the data they had. They saved the wetlands. They accepted the traffic. That was the calculation. Everything else is noise."

  Elara looks back at the frozen cloud. A green spark flickers near the edge—a great-grandchild of one of the saved homeowners invents a water filtration system in 2180. A red spark pulses nearby—another descendant dies in a war fueled by resource scarcity caused by the delayed battery tech. They cancel each other out? Do they? Is a life saved equal to a life lost? Is a war equal to a filtration system?

  "The noise isn't random," Elara says quietly. "It's caused. Every spark traces back to that vote."

  "And every spark also traces back to the weather, the economy, the random chance of genetic mutation," Marcus says. "You're trying to isolate a single thread in a woven fabric and claim it holds the whole thing together. It doesn't."

  Elara reaches out to the console. Her finger hovers over the shutdown command. If she turns it off, the question remains unanswered. If she leaves it on, the data will just keep growing, branching into centuries she won't live to see, accumulating value judgments she can't make.

  "If I approve this report," Elara says, "I have to say whether the vote was ethical."

  "Then say this," Marcus says. "They acted on reasonable foresight. The rest is out of their hands."

  "But is it out of *ours*?" Elara asks. "We have the Lens. We see the chain. Does knowing make us responsible for the sum?"

  Marcus doesn't answer. He just waits, the cold coffee forgotten in his hand.

  Elara looks at the brown blur of the future, the impossible tangle of cause and effect that stretches out beyond the edge of the room, beyond the edge of the building, beyond the edge of human comprehension. She knows exactly what happened. She knows nothing about whether it was right.

  She presses the shutdown command. The cloud collapses into a single point of light, then vanishes. The room is dark, silent, and utterly unresolved.
