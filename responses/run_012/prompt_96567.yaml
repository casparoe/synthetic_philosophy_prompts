  # JOINT STATEMENT ON THE ONTOLOGY AND CAUSALITY OF THE CAREENIUM

  **Date:** 4th Cycle, Turn 902
  **Signatories:** 
  *   Elara Vane (Pattern Causalist)
  *   Kaelen Thorne (Substrate Causalist)

  **Preamble:**
  We, the undersigned, acknowledge a long-standing divergence regarding the interpretation of causal events within the Careenium system. While we agree on the physical constitution of the system and the deterministic laws governing its micro-constituents, we disagree on the ontological status and causal efficacy of the macroscopic patterns known as "simmballs." This document records our points of consensus, enumerates our specific disagreements, and establishes a set of empirical cruxes designed to resolve or clarify the dispute.

  ## I. AGREED CLAIMS

  Both parties affirm the following propositions as true descriptions of the Careenium:

  1.  **Micro-Physical Constitution:** The Careenium consists exclusively of a finite number of rigid billiard balls within a sealed, reflective boundary. There are no hidden variables, no quantum indeterminacy, and no external forces acting upon the system once sealed.
  2.  **Deterministic Dynamics:** The future state of every ball is strictly fixed by its current position and velocity, combined with the laws of Newtonian collision. Given a complete micro-specification at time *t*, the micro-state at *t+n* is uniquely determined.
  3.  **Existence of Patterns:** Stable macroscopic configurations of balls, termed "simmballs," emerge within the system. These patterns persist over time, merge, divide, and exhibit statistical regularities that correlate with features of the environment (prior to sealing) or internal states.
  4.  **Predictive Utility:** Descriptions of the system utilizing simmball terminology (e.g., "Simmball A collided with Simmball B") allow for accurate prediction of future system states, often with greater computational efficiency than tracking individual ball trajectories.
  5.  **Conservation Laws:** No energy or momentum is created or destroyed within the box. All macroscopic events are constituted by microscopic transfers of momentum.
  6.  **Counterfactual Dependence:** Both parties agree that causal claims imply counterfactual dependence. To say "X caused Y" implies that had X not occurred (or been different), Y would not have occurred (or would have been different), holding relevant background conditions fixed.
  7.  **No Supernaturalism:** Neither party claims that simmballs violate physical laws, possess non-physical substance, or operate outside the deterministic closure of the micro-physical domain.

  ## II. TABLE OF DISAGREEMENTS

  The following table outlines the remaining points of contention. Each position is phrased to be acceptable to the proponent of that view.

  | Domain | Pattern Causalist (Vane) | Substrate Causalist (Thorne) |
  | :--- | :--- | :--- |
  | **Locus of Causation** | Causal efficacy is distributed across levels. Simmballs exert causal power upon the substrate and other simmballs. | Causal efficacy resides exclusively at the micro-level. Only individual balls exert force upon other individual balls. |
  | **Ontological Status** | Simmballs are real entities. Their stability and constraints constitute a form of existence distinct from the mere sum of balls. | Simmballs are descriptive summaries. They are real *patterns*, but not real *objects*. They exist in the description, not the box. |
  | **Causal Completeness** | A causal account stopping at the level of balls is incomplete. It fails to capture the constraints that determine *which* micro-paths are taken. | A causal account stopping at the level of balls is complete. Any macro-account is a shorthand for the micro-account, not an addition to it. |
  | **Definition of "Push"** | To "push" is to constrain the state-space of the system such that specific outcomes become necessary. Simmballs constrain balls. | To "push" is to transfer momentum via contact. Balls constrain balls. Simmballs are the result of pushing, not the agents of it. |
  | **Downward Influence** | Macroscopic patterns can determine microscopic trajectories (downward causation) by selecting among physically possible micro-paths. | Microscopic trajectories determine macroscopic patterns (upward determination). Macroscopic patterns cannot influence the micro-paths that constitute them. |

  ## III. THE CRUXES

  We identify four specific scenarios (cruxes) where our interpretations yield different expectations regarding the behavior of the Careenium. For each crux, we specify the intervention, the specific question at stake, and our pre-registered predictions.

  ### Crux 1: The Multiple Realization Test
  *   **Corresponds to Case (a):** Two careenia with different micro-realizations but the same simmball trajectory.
  *   **Setup:** Construct two Careenia, *C1* and *C2*. At time *t*, *C1* and *C2* possess distinct micro-arrangements of balls (different positions/velocities) but instantiate the identical Simmball *S* (same macro-pattern).
  *   **Sub-Question:** Does the identity of the Simmball guarantee identical future macro-behavior, despite micro-divergence?
  *   **Pattern Causalist Prediction:** Yes. Because the Simmball *S* is the true cause, the future macro-trajectory of *C1* and *C2* will remain synchronized. The micro-differences are noise cancelled out by the macro-constraint.
  *   **Substrate Causalist Prediction:** No. Because the micro-states differ, the deterministic laws dictate they will diverge immediately. Any subsequent macro-similarity is coincidental or temporary. The "Simmball" does not exert a force to keep them aligned.

  ### Crux 2: The Substrate Perturbation Test
  *   **Corresponds to Case (b):** A careenium whose simmball is preserved while the exact paths of its balls are altered.
  *   **Setup:** In a running Careenium, an external intervention subtly alters the velocity of a subset of balls constituting Simmball *S*, such that the macro-pattern *S* remains recognizable (within tolerance) but the micro-trajectories are now distinct from the unperturbed path.
  *   **Sub-Question:** Does the causal outcome of the system depend on the preservation of the pattern or the preservation of the exact micro-paths?
  *   **Pattern Causalist Prediction:** The causal outcome (the next Simmball interaction) will remain unchanged. The pattern is the causal unit; as long as *S* is preserved, its causal power is intact.
  *   **Substrate Causalist Prediction:** The causal outcome will change. Since only balls push, altering ball velocities alters the collision sequence. If the outcome remains the same, it is a fragile coincidence, not evidence of macro-causation.

  ### Crux 3: The Level-Specific Intervention Test
  *   **Corresponds to Case (c):** An intervention that changes a simmball without changing any individual ball's law, versus an intervention on individual balls that leaves the simmball intact.
  *   **Setup:** Compare two interventions. *Intervention M* constrains the system to force a Simmball transition (e.g., forcing a merge) while allowing micro-freedom. *Intervention m* constrains specific balls to prevent a Simmball transition while maintaining the macro-appearance of the pre-merge state.
  *   **Sub-Question:** Can the system be forced to behave differently at the macro-level without fixing every micro-variable, and does this produce different effects than fixing micro-variables?
  *   **Pattern Causalist Prediction:** *Intervention M* is sufficient to determine the future macro-state. *Intervention m* is inefficient and may fail if the simmball "wants" to merge (i.e., if the attractor state is strong). Macro-constraints are more fundamental.
  *   **Substrate Causalist Prediction:** *Intervention M* is impossible without implicitly being *Intervention m*. You cannot force a simmball change without forcing ball changes. If you claim to have done *M*, you have actually done *m* and simply ignored the micro-details. The effects will be identical because the ball-paths are the only reality.

  ### Crux 4: The Idle Correlation Test
  *   **Corresponds to Case (d):** A careenium in which a simmball is systematically correlated with an environmental feature but is causally idle at the level of the balls.
  *   **Setup:** Identify a Simmball *Z* that reliably tracks an external feature (e.g., ambient temperature prior to sealing) but whose constituent balls are causally screened off from the balls that determine the system's output behavior.
  *   **Sub-Question:** Is *Z* a cause of the system's response to the environment, or merely a record?
  *   **Pattern Causalist Prediction:** *Z* is a cause if removing *Z* (disrupting the pattern while keeping balls roughly similar) changes the system's response. If *Z* tracks the environment and drives the response, it is a causal link.
  *   **Substrate Causalist Prediction:** *Z* is a record (epiphenomenon). The balls that constitute *Z* are not the balls that collide to produce the output. The correlation is real, but the causation flows entirely through the specific ball collisions, not the pattern *Z*. *Z* is a shadow, not a lever.

  ## IV. CONCLUSION ON VERBAL DISPUTE

  We acknowledge that a portion of our disagreement may be verbal, specifically regarding the definition of the term **"cause"** (or "push").

  *   **The Verbal Component:** If "cause" is defined strictly as "transfer of momentum via contact," the Substrate Causalist is tautologically correct, and the Pattern Causalist is misusing the term. If "cause" is defined as "a difference-making constraint on the system's trajectory through state-space," the Pattern Causalist is tautologically correct, and the Substrate Causalist is ignoring relevant variables.
  *   **The Substantive Component:** However, we agree the dispute is not *merely* verbal. It concerns **ontological commitment**. The Pattern Causalist claims that treating simmballs as causes yields better explanations and predicts system stability in ways the micro-account obscures. The Substrate Causalist claims that treating simmballs as causes invites error by masking the precise micro-conditions required for events to occur.

  **Resolution Protocol:**
  We agree to treat the predictions in Section III as binding. If, in Crux 1, *C1* and *C2* diverge macroscopically despite starting with the same Simmball, the Pattern Causalist concedes that simmballs do not possess independent causal stability. If *C1* and *C2* converge or remain synchronized despite micro-divergence, the Substrate Causalist concedes that macroscopic constraints exert a filtering effect on micro-trajectories that qualifies as causal efficacy.

  **Signed,**

  *(Signature)*
  **Elara Vane**
  Pattern Causalist

  *(Signature)*
  **Kaelen Thorne**
  Substrate Causalist
