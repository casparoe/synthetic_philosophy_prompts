      *   *Correction:* Regarding Marshall's drink. Is it a "novel fact"? Yes, because the OP predicted bacteria *couldn't* survive there. The NP predicted they *could* and *would* cause inflammation.
      *   *Correction:* On Lykoudis. Lakatos might say Lykoudis *was* a programme, just a very weak one without a positive heuristic. I should argue he lacked the *theoretical structure* to be a rival programme in the Lakatosian sense.
      *   *Correction:* Make sure to address the "Patient Harm" constraint explicitly. Lakatos has no metric for suffering, only truth-content.

  6.  **Final Review against Prompt:**
