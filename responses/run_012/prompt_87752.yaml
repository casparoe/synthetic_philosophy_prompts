      *   *Check "Novel Facts":* Ensure the distinction between explaining known facts (PPIs heal ulcers) and predicting new ones (Antibiotics prevent recurrence) is clear. This is the crux of Lakatosian progress.

  5.  **Self-Correction during drafting:**
