  - Why
  Dee consistently separates physical properties from mental conditions, as seen with her acceptance of zombies and uncaused motion. She treats the world as existing independently of observers unless science forces her hand, as it did with water. She hasn't been forced on colour, so she will default to naive realism where blue is on the sea, not in the eye. I would change my mind if she treats colour as essentially relational, like pain, rather than intrinsic, like shape.

