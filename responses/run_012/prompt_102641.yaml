          *   For 1 vs 5: Adopt the Ability Hypothesis interpretation of Mary.

      *   *Determining the "Single Best Revision":*
          *   Dropping strong First-Person Authority (3) solves the clash with Externalism (4) and softens the clash with Wittgenstein (1). It allows for a more naturalized view.
