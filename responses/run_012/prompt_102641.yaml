      *   *Commitment 3 (First-Person Authority/Incorrigibility):* I know my pain immediately and certainly.
      *   *Commitment 4 (Semantic Externalism):* Content depends on environment (Putnam/Burge).
      *   *Commitment 5 (The Knowledge Argument):* Physicalism is false (or at least incomplete). Phenomenal knowledge is distinct from physical/functional knowledge.

      *   *Potential Conflict 1: Wittgenstein (1) vs. First-Person Authority (3) & Phenomenal Realism (2).*
          *   Wittgenstein argues *against* the idea that we have privileged, private access to meanings or sensations that cannot be publicly checked. The Private Language Argument (PLA) is often read as attacking the idea of private ostensive definition of sensations.
          *   If meaning is use (1), then "pain" gets its meaning from public criteria (behavior, context).
          *   If I have strong first-person authority (3) based on private acquaintance (2), does that violate the PLA?
          *   *Nuance:* Many neo-Wittgensteinians accept phenomenal concepts but deny they refer to private objects. However, strong incorrigibility (3) often leans Cartesian, which Wittgenstein explicitly attacks.
          *   *Severity:* High. This is the classic tension between Wittgenstein and Cartesian introspection.

      *   *Potential Conflict 2: Externalism (4) vs. First-Person Authority (3).*
          *   This is the "Slow Switching" or "McKinsey" problem.
          *   If content is determined externally (4), I might not know *which* content I have without knowing my environment.
          *   If I have first-person authority (3) over my thoughts/content, I should know what I think just by introspection.
          *   If I can know my content a priori (3), and content implies external facts (4), I can know external facts a priori. That seems wrong (anti-skeptical argument issue).
          *   *Severity:* High. This is a well-known technical problem in philosophy of mind/language.

      *   *Potential Conflict 3: Externalism (4) vs. The Knowledge Argument (5).*
          *   Externalism says content is wide. The Knowledge Argument says phenomenal character is internal/intrinsic (usually).
          *   If Mary knows all physical facts (which include external relations in a physicalist framework), but learns something new, that new thing is internal.
          *   Actually, Externalists often *reject* the Knowledge Argument (e.g., Dennett, Lewis) or reinterpret it. Accepting both is tricky but not logically impossible (e.g., phenomenal externalism exists, but is rare).
          *   *Severity:* Medium. It depends on how you frame "content" in (4). If (4) is just about *reference* (H2O), it might not clash with (5) about *qualia*. But if (4) extends to phenomenal content, they clash.

      *   *Potential Conflict 4: Wittgenstein (1) vs. The Knowledge Argument (5).*
          *   Wittgenstein is often read as a behaviorist or deflationist about qualia. "Pain" is just a move in a language game.
          *   The Knowledge Argument posits a robust, ineffable phenomenal fact that escapes public/physical description.
          *   Wittgenstein would likely say Mary isn't learning a new *fact* but acquiring a new *ability* (Ability Hypothesis).
          *   *Severity:* Medium-High. Wittgensteinians usually deflate the Knowledge Argument.

