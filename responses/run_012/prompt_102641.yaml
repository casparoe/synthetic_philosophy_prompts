          *   *Tension 3 (The Mary Problem):* Wittgenstein (1) vs. Mary (5). Wittgensteinians typically adopt the Ability Hypothesis (Mary learns *how*, not *that*). You are claiming she learns a *fact*.

      *   *Determining the "Cheapest Patch":*
          *   For 1 vs 3: Weaken (3). Move from "infallible" to "presumptive authority."
