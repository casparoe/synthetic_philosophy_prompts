  6.  **Final Polish:** Ensure the distinction between *semantic* externalism and *phenomenal* internalism is clear, as that's a common hiding spot for inconsistencies. Ensure the Wittgenstein vs. Qualia conflict is highlighted as the deepest philosophical rift.

      *(Self-Correction during drafting)*: I need to be careful not to say these are *logically* contradictory (they aren't strictly), but that they are *theoretically* unstable. A seminar will attack the *motivation* for holding them together.
      *   *Refinement on Tension 1:* It's not just 1 vs 3. It's 1 vs the *cluster* of 2, 3, 5. The profile is split between a public/pragmatic view of meaning and a private/intrinsic view of mind.
