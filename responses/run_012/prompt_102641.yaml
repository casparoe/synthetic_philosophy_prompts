          *   *Wait, actually:* The strongest clash is (1) vs (2)/(3)/(5). Wittgenstein is usually anti-qualia realist. If you keep (1), you really need to dump the Cartesian flavor of (3) and the robust fact-status of (5).
          *   *Best Single Revision:* Weaken (3) to "Privileged Access" rather than "Incorrigibility." This helps with Externalism and fits better with Wittgenstein (who allows avowals, just not as reports of private objects).

  5.  **Review against Constraints:**
      *   American English (check spelling: behavior, honor, etc.).
