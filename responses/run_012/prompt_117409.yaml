          *   *Political Authority:* This is the trickiest. Can outsiders hold authority? Practice says yes, temporarily. It assumes a "trusteeship" model. The occupier legislates for the inhabitants. This implies the population is currently incapable of self-rule due to the crisis/regime.

      *   **Part 2: Presupposes vs. Suits vs. Underdetermined:**
