          *   *Underdetermined:* The *end state*. Does intervention require democracy? Just safety? A friendly regime? The practice allows for both "humanitarian imperialism" and "liberal internationalism" to claim success. The lack of a clear exit strategy definition means incompatible theories (e.g., "save lives now" vs. "build a state") both license the same initial bombing.

      *   **Part 3: The Guardianship Analogy (Resolving the Inconsistency):**
          *   *The Tension:* Justification = Individual Safety. Conclusion = Collective Self-Government.
          *   *Domestic Guardianship:* Adult ward harmed -> Guardian appointed -> Guardian acts *only* in ward's interest -> Guardian steps down when ward recovers capacity. Authority is fiduciary.
