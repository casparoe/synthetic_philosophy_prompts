answer: |-
  The practice of humanitarian intervention under the banner of the Responsibility to Protect (R2P) presents a jagged landscape of doctrine and reality. To understand it, one must excavate the implicit political theory that sustains it, distinguish its logical necessities from its geopolitical conveniences, and confront the tension between its humanitarian justification and its political outcomes.

  ### I. The Implicit Theory

  The practice rests on a reconstructed theory of three foundational concepts:

  **1. Sovereignty and Forfeiture**
  The practice presupposes a shift from Westphalian sovereignty (authority based on non-interference) to "sovereignty as responsibility." Sovereignty is not an inherent right of the state apparatus but a conditional status granted by the international community. It is forfeited not merely by weakness, but by moral failure: specifically, the commission of atrocity crimes or the inability to prevent them. Crucially, forfeiture is temporary and functional. The state does not cease to exist; rather, its right to exclude external actors is suspended. Sovereignty is treated as a veil that dissolves when it shields murder rather than citizens.

  **2. Residual Responsibility**
  The theory posits that responsibility is a floating quantity. When the primary holder (the state) drops it, it does not vanish; it devolves to the "international community." In practice, this responsibility is operationalized as a *duty to act*, held collectively but executed by capable states or alliances (NATO, coalitions).
  *   **Trigger:** The threshold is high (genocide, crimes against humanity), yet the determination of the trigger is political, not judicial.
  *   **Discharge:** This is the most ambiguous element. Theoretically, discharge occurs when the population is safe. Practically, discharge is defined by the intervener, often conflating "safety" with "political stability" or "democratic transition." The duty ends not when the killing stops, but when the intervener decides the political objective is met.

  **3. Location of Political Authority**
  The practice assumes a theory of **international trusteeship**. It presupposes that political authority over a population can be held by an outsider "in trust." This authority is not ownership; it is custodial. The intervener legislates for the inhabitants (as in occupied Iraq or Kosovo) based on the presumption that the local capacity for self-rule is currently corrupted or incapacitated. The implicit theory is that authority is separable from consent in the short term, provided the end goal is the restoration of consent-based rule.

  ### II. Presupposes, Suits, and Underdetermination

  To analyze the coherence of this practice, we must separate what is logically required from what is opportunistic.

  **Strictly Presupposes:**
  The practice strictly presupposes that **human rights violations can invalidate territorial integrity.** Without this, any crossing of borders is aggression. It also presupposes that **external actors possess the capacity to distinguish between combatants and civilians** and can wield force discriminately enough to protect the latter without destroying the former. Finally, it presupposes that **temporary foreign administration is possible**—that one can occupy a state without annexing it.

  **Merely Suits:**
  The practice *suits* the strategic interests of great powers. Regime change, often a byproduct of intervention (Libya), suits the goal of removing hostile governments. "Protection of civilians" suits the need for moral legitimacy in an era where conquest is illegitimate. The drafting of mandates as "protection" suits the legal constraints of the UN Charter while allowing for expansive rules of engagement. These are not logical necessities of R2P; they are geopolitical alignments that make the doctrine usable for powerful states.

  **Underdetermined:**
  The practice is radically underdetermined regarding **exit criteria and success metrics.**
  *   *Theory A (Humanitarian Minimalism):* Intervention is successful when mass killing stops.
  *   *Theory B (Liberal Internationalism):* Intervention is successful when a democratic, market-oriented regime is established.
  Both theories license the same initial bombing campaign. The practice does not specify which theory governs the occupation. This underdetermination allows interveners to shift goalposts: if killing stops but the regime remains hostile, Theory B allows the intervention to continue; if democracy fails but killing stops, Theory A allows withdrawal. This ambiguity licenses incompatible theories equally well, masking the true political objective until it is achieved.

  ### III. The Guardianship Analogy and the Inconsistency

  The central inconsistency is this: the practice justifies itself through the **safety of individuals** (a humanitarian metric) but concludes itself with the **self-government of a collective** (a political metric).

  Consider the domestic analogy of a guardian appointed over an adult ward who is being harmed.
  *   **Domestic Guardianship:** Authority is fiduciary. The guardian acts *only* in the ward's interest. The guardian is accountable to a court. Crucially, authority **lapses** immediately once the ward recovers capacity. The goal is restoration of the ward's *own* will.
  *   **Intervention Practice:** The intervening power is not structured as a true fiduciary.
      1.  **Accountability:** The intervener is not answerable to the "ward" (the population) but to their own domestic electorate or security council allies.
      2.  **Definition of Interest:** The guardian defines the ward's interest. In domestic law, "interest" is health/safety. In intervention, "interest" often includes political structure (e.g., holding elections, drafting constitutions).
      3.  **Lapse of Authority:** Authority does not lapse automatically upon safety. It lapses when the *intervener* decides the political order is secure.

  **What the Difference Reveals:**
  The divergence reveals that the point of the exercise is not merely **protection**, but **political transformation**. If the goal were purely safety (like a domestic guardian stopping an assault), the intervener would neutralize the threat and leave. By staying to legislate and restructure, the intervener reveals that they view the *source* of the insecurity as the political culture or regime type itself.
  Therefore, the authority is not held *for* the population in a pure trust; it is held *over* them to engineer a specific outcome. The practice treats the population as a ward regarding security, but as a subject regarding politics. This resolves the inconsistency: the practice does not aim to return the population to their previous self-government (which failed), but to construct a *new* collective self that is compatible with international security norms.

  ### IV. The Single Premise and Institutional Change

  The practice hangs on a single premise which, if false, renders it incoherent rather than merely selective:

  **"External coercion can generate the internal legitimacy required for sovereign self-rule."**

  If this premise is false, the practice is self-defeating. The doctrine claims to restore sovereignty (self-rule) through the suspension of sovereignty (intervention). If coercive protection inherently undermines the legitimacy of the resulting government (because it is seen as imposed by foreigners), then the practice cannot achieve its stated conclusion. It becomes a perpetual occupation or a puppet state, which contradicts the R2P goal of restoring responsible sovereignty. Selectivity is a moral failure; this incoherence is a structural impossibility.

  **What Would Have to Change:**
  If we accept that external coercion cannot generate legitimacy, law and institutions would need to shift from **enforcement** to **facilitation**.
  1.  **Law:** The UN Charter would need to be amended to prohibit regime change as a component of humanitarian mandates. Intervention would be limited strictly to neutralizing immediate threats (no-fly zones, safe corridors) without assuming administrative control.
  2.  **Institutions:** We would require a standing, neutral **International Trusteeship Council**, distinct from military alliances like NATO. This body would manage transitions, funded by the UN, with no strategic interest in the region. Authority would be time-bound by international statute, not the intervener's discretion.
  3.  **Accountability:** Intervening powers would be subject to the jurisdiction of the International Criminal Court for actions taken during occupation, enforcing the fiduciary duty currently absent.

  Without these changes, the practice remains a contradiction: a claim to save people by stripping them of the political agency that defines their humanity.
