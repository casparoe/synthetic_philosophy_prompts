answer: |-
  **Project Title:** The Structure of Uncertain Evidence: Disambiguating the Inputs to Jeffrey Conditionalization

  **Project Summary and Central Question**
  Standard Bayesian epistemology distinguishes between strict conditionalization, which requires certainty in evidence, and Jeffrey conditionalization, which permits belief revision on uncertain evidence. The latter is standardly presented as a unified rule: an agent receives a new probability distribution over a partition of propositions and redistributes credence accordingly. However, this formalism obscures a fundamental ambiguity in what constitutes "uncertain evidence." As preliminary analysis suggests, there are at least three distinct phenomenological and structural cases: (i) coarse-grained knowledge of a fact (the dial is in a range); (ii) evidence with inherently probabilistic content (a report of objective chance); and (iii) non-propositional or unspecific perceptual states (an impression lacking a predicate).

  The standard rule appears tailored to (i), yet it is routinely applied to (ii) and (iii). This generates a specific pathology: order-sensitivity. Unlike strict conditionalization, sequential Jeffrey updates on different partitions yield different results depending on the order of arrival. This suggests the rule is conflating two distinct tasks: describing the structure of the input and performing the revision operation.

  The central question of this project is determinate: **Does a single normative rule govern belief revision across all three types of uncertain evidence, or does the structural heterogeneity of cases (i)–(iii) require distinct treatment?** I propose to test the hypothesis that these cases are normatively distinct. Specifically, I will investigate whether case (ii) is properly handled not by an update rule but by a chance–credence bridge principle, and whether a coherent theory of uncertain evidence requires positing a "standing partition" inherent to the agent's evidential situation rather than ad hoc partitions generated by learning events.

  **Critique of Existing Positions**
  To answer this, I must evaluate why current orthodoxies fail to settle the distinction between (i)–(iii).

  1.  **The Orthodox Bayesian Line:** This position treats the input simply as a new conditional probability assignment.
      *   *What it settles:* It provides a clean calculus for case (i), where the partition is clear and the uncertainty is merely regarding which cell is true.
      *   *Where it fails:* It offers no account of how to derive the input distribution for case (ii) without smuggling in a bridge principle, and it cannot formally accommodate case (iii) where no proposition exists to serve as a partition cell. It treats order-sensitivity as a feature rather than a bug, leaving it unexplained why the *description* of the evidence affects the *revision* logic.
  2.  **The Experience-Based Line:** This view holds that the input is the experience itself, not a proposition.
      *   *What it settles:* It acknowledges the reality of case (iii) and avoids forcing non-propositional states into propositional garb.
      *   *Where it fails:* It lacks a formal mechanism for translating experience into probability shifts without arbitrary stipulation. It does not explain why case (i) (coarse facts) should be treated differently from case (iii) (vague impressions), nor does it address the order-sensitivity problem inherent in mapping experiences to shifting partitions.
  3.  **The Imprecise Probability Line:** This approach represents indeterminacy as a set of distributions rather than a single one.
      *   *What it settles:* It captures the vagueness in case (i) and the unspecificity of case (iii) by widening the representational state.
      *   *Where it fails:* It treats case (ii) (objective chance reports) as mere ignorance, conflating ontological probability with epistemic indeterminacy. Furthermore, updating sets of distributions often inherits the order-sensitivity problems of the precise rule without offering a principled reason for the divergence.
  4.  **The Deflationary Line:** This view suggests restricting the rule to the cases for which it was built (case i).
      *   *What it settles:* It preserves the mathematical integrity of the rule by avoiding misapplication.
      *   *Where it fails:* It abandons the project of a general theory of rational revision. It leaves agents without normative guidance for cases (ii) and (iii), which constitute a significant portion of scientific and perceptual learning. It admits the problem rather than solving it.

  **Methodology and Work Plan**
  This project is designed for a single investigator over a one-year term with teaching relief. The work is conceptual and formal, requiring no laboratory or empirical data.

  *   **Phase 1: Case Construction (Months 1–3).** I will construct rigorous vignettes for (i), (ii), and (iii). The goal is to ensure these are formally distinct, not merely verbally distinct. For case (ii), I will isolate scenarios where the evidence is *only* a chance claim, with no underlying outcome proposition available for conditioning. For case (iii), I will utilize signal-detection scenarios where the agent lacks the conceptual vocabulary to partition the space.
  *   **Phase 2: Constraint Testing (Months 4–7).** I will test candidate treatments against three constraints:
      1.  *Order Invariance:* If the total evidence is identical, the final credence should not depend on the temporal order of receipt. If a rule violates this, the partition selection must be independently motivated.
      2.  *Strict Limit:* Any proposed rule must recover strict conditionalization as a limiting case when evidence becomes certain.
      3.  *Non-Circularity:* The partition used for updating cannot be identified only by knowing the resulting posterior.
  *   **Phase 3: The Standing Partition Hypothesis (Months 8–10).** I will attempt to formalize the idea that the partition belongs to the agent's standing evidential situation. This involves defining a stable algebra of propositions against which all uncertain inputs are measured, rather than allowing the evidence to dictate the algebra anew at each step.
  *   **Phase 4: Synthesis and Negative Results (Months 11–12).** I will compile the results into a criterion for when a Jeffrey-style update is well-defined.

  **Deliverables**
  The primary output will be a manuscript suitable for publication as a monograph chapter or a long journal article. It will contain:
  1.  A **Well-Definedness Criterion**: A formal test to determine if a given learning situation permits a unique Jeffrey update.
  2.  A **Catalogue of Illicit Updates**: Specific examples of common applications of the rule (particularly in cases (ii) and (iii)) that fail the criterion.
  3.  **Alternative Norms**: For cases where the rule fails, I will propose alternative normative advice, such as suspension of judgment or the adoption of an imprecise prior without updating.

  **Conditions of Failure**
  Intellectual honesty requires specifying what would constitute a failed project.
  1.  **Collapse:** If formal analysis reveals that cases (i), (ii), and (iii) are reducible to a single structure under scrutiny, the three-way distinction collapses. In this event, the proposal will pivot to explaining why the distinction appeared salient despite being illusory.
  2.  **Circularity:** If the "Standing Partition" can only be identified by reverse-engineering the desired posterior, the hypothesis is circular. I will concede that the partition must be exogenous and document the regress.
  3.  **Notational Variant:** If the proposed fix turns out to be mathematically equivalent to existing imprecise probability models without offering new normative insight, I will reframe the contribution as a clarification of existing tools rather than a new theory.

  **Scope and Feasibility**
  *   **Genuinely a Year's Work:** The construction of the counter-examples and the testing of the order-invariance constraint against the three cases is substantial. Formalizing the "Standing Partition" idea sufficiently to show where it breaks is the core technical challenge.
  *   **What to Cut:** I will not attempt to derive a complete alternative update rule for case (iii). If Jeffrey conditionalization fails there, demonstrating *why* it fails and recommending suspension of judgment is sufficient. Developing a full competitor rule is a multi-year project.
  *   **What to Concede:** I will not settle the metaphysics of non-propositional content. The project treats the existence of case (iii) as a phenomenological datum for the epistemologist, not a problem for the philosopher of mind to solve. I will also concede that I may not resolve the order-sensitivity problem generally, but only diagnose its source in the conflation of input and operator.

  This project seeks not to save the standard rule at all costs, but to determine its boundaries. If the rule is brittle, we should know where it breaks. If the evidence is heterogeneous, our norms should reflect that. The fellowship will provide the time to ensure the answer is rigorous rather than rhetorical.
