prompt: |-
  I'm deputy chief of staff for the mayor of a mid-sized Rust Belt city -- first term, fourteen months in, and I keep getting handed decisions that I'm pretty sure are what people mean by "dirty hands," except nobody in the building has read any political ethics and so we re-litigate the same fight from scratch every time. Last month it was whether to have our economic development guy quietly signal to a developer which council members could be leaned on; the month before it was whether to sit on a consultant's report about our water system until after the bond vote; yesterday the mayor asked me, half joking, whether it would really be so bad if a certain personnel file got lost. The stakes are real -- people's housing, people's water -- and so is the fact that whatever we decide becomes public record sooner or later, and I've got maybe twenty minutes per decision and no lawyer in the room most of the time (and when there is one, he says everything's fine if its legal, which I'm fairly sure is a different question than the one I'm asking). So what I want is a decision procedure my office could actually run: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it has to go up to the mayor because what's left is a values call and not a fact call.

  The thing I want it built on -- because this is the part everyone around here gets wrong -- is that dirty hands isn't the same thing as "politics has costs." From a grad seminar I took years ago I kept two ideas I can't operationalize. First the puzzle: if the act is genuinely wrong, no amount of good consequences makes it not-wrong, and if it isn't wrong, then there's nothing dirty about it -- so a procedure that's just cost-benefit analysis has already lost the thing we're trying to capture. Second, the idea of a remainder or residue: even when someone is right to do the thing, they're still the author of it, and something is owed afterward -- an acknowledgement, restitution, a cost to themselves, some mark that this wasn't free. Make those usable rather than decorative. Concretely, for each step say whether it's a factual question, a predictive one, or a straight value judgment; say which of the distinctions I just gestured at actually survives compression into a checklist and which has to be dropped, and what we lose when it is; and be honest about the failure modes, including the cases where the procedure will give a confident answer that's wrong.

  Then run it on three: (1) our development guy leaning on council members to get an affordable housing deal through, (2) leaking a confidential report to kill a contract we think is corrupt, and (3) the mayor asking me to lose the personnel file. If (3) is a case where the procedure says no and the mayor overrules it anyway, tell me what the procedure should say about what happens next -- including whether I resign, and how the answer changes if I don't.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Deputy Chief of Staff (DCOS) for a first-term mayor in a mid-sized Rust Belt city (14 months in).
      *   **Context:** High pressure, real stakes (housing, water), frequent ethical dilemmas ("dirty hands"), no institutional ethical memory (re-litigating every time), limited time (20 mins/decision), limited legal counsel (legal $\neq$ ethical).
      *   **Core Problem:** Needs a practical, operationalizable decision procedure for ethical dilemmas, specifically grounded in the "Dirty Hands" problem (Michael Walzer/Weberian realpolitik ethics), not just utilitarianism or legal compliance.
      *   **Theoretical Constraints:**
          *   Must distinguish "dirty hands" from "politics has costs."
          *   Must incorporate the paradox: If it's wrong, consequences don't cleanse it; if it's not wrong, it's not dirty.
          *   Must incorporate the "remainder/residue": Even if justified, there's a cost/acknowledgement owed.
          *   Must specify question types (factual, predictive, value).
          *   Must identify what gets lost in compression.
          *   Must identify failure modes.
      *   **Task:** Create the procedure, then apply it to three specific scenarios (leaning on council, leaking a report, losing a personnel file).
      *   **Specific Constraint on Scenario 3:** If the procedure says "No" but the Mayor overrules, what next? (Resignation logic).

  2.  **Deconstruct "Dirty Hands" for a Checklist:**
      *   *The Paradox:* A checklist tends to sanitize. If I follow the steps and get a "Yes," does that make it clean? No. The procedure must preserve the *tension*.
      *   *The Remainder:* This is the hardest part to operationalize. A checklist usually ends with "Go/No-Go." A Dirty Hands checklist must end with "Go + Penalty/Accountability."
      *   *Compression Loss:* Nuance, moral anguish, the specific texture of the situation. The checklist forces categorization.
      *   *Failure Modes:* False negatives (blocking necessary evil), False positives (authorizing mere corruption), Bureaucratization of guilt (checking the box absolves the soul).

  3.  **Drafting the Procedure (The "DH-7" or similar):**
      *   *Goal:* 20 minutes max. Needs to be fast.
      *   *Step 1: Legality vs. Ethics.* (Filter out straight crimes).
      *   *Step 2: Necessity.* Is there *really* no other way? (The "Last Resort" test).
      *   *Step 3: Publicity.* Could this stand the light of day? (The "New York Times" test, but modified).
      *   *Step 4: The Remainder.* If we do this, what do we owe? (Acknowledgment, sacrifice).
      *   *Step 5: Authority.* Who decides? (Mayor vs. Staff).

      *Refining for the User's Theory:*
      *   Need to explicitly address the "Wrong but Necessary" tension.
      *   Need to make the "Remainder" actionable.
      *   Let's call it the **Residue Protocol**.

      *Step 1: The Transgression Check (Factual/Legal).* Is this illegal or a clear violation of sworn duty? If yes -> STOP (unless existential threat, see Step 2).
      *Step 2: The Necessity Test (Predictive).* Is the good consequence *certain* and *vital*? Is there *no* clean alternative?
      *Step 3: The Symmetry Test (Value).* Who bears the cost? Who gets the benefit? (Prevents "dirty hands for friends").
      *Step 4: The Remainder Calculation (Value/Action).* What is the penance? (This operationalizes the "residue").
      *Step 5: The Authorization (Procedural).* Mayor must own it. Staff cannot take the fall for the *decision*, only the *execution*.

  4.  **Addressing the Theoretical Constraints in the Design:**
      *   *Paradox:* The procedure shouldn't "solve" the guilt. It should document it.
      *   *Compression:* Acknowledge that checking boxes doesn't make you good.
      *   *Failure Modes:* The "Moral License" effect (doing the bad thing because I filled the form).

  5.  **Applying to Scenarios:**

      *   *Scenario 1: Leaning on Council (Economic Dev).*
          *   Is it illegal? Maybe (bribery/coercion boundaries).
          *   Is it necessary? Maybe (housing crisis).
          *   Remainder? Public acknowledgment of pressure?
          *   Verdict: High risk. Likely "No" unless specific safeguards.

      *   *Scenario 2: Leaking Report (Corrupt Contract).*
          *   Is it illegal? Yes (confidentiality).
          *   Is it necessary? To stop corruption.
          *   Remainder? Resignation/accepting firing.
          *   Verdict: "Dirty Hands" justified *if* penance is accepted.

      *   *Scenario 3: Losing Personnel File.*
          *   Is it illegal? Yes (obstruction/records laws).
          *   Is it necessary? Unlikely (personal/political protection vs public good).
          *   Symmetry? Benefits Mayor, harms public trust/process.
          *   Verdict: Hard NO.
          *   *Overrule:* If Mayor insists, DCOS must resign. Why? Because this lacks the "Public Good" necessity required for Dirty Hands. It's pure corruption.

  6.  **Refining the "Resignation" Logic:**
      *   If the act is truly "Dirty Hands" (Necessary Evil for Public Good), the Mayor must take the hit, or the Staffer must take the hit *knowingly*.
      *   If the act is just "Corruption" (Private/Political Gain), participation makes you an accomplice, not a martyr.
      *   Scenario 3 is corruption, not dirty hands. Resignation is the only ethical exit to preserve future integrity.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, grim, pragmatic, respectful of the user's theoretical background. No platitudes.
      *   *Structure:*
          1.  Preamble (acknowledging the theory).
          2.  The Procedure (The "Residue Protocol").
          3.  Meta-Analysis (What is lost, failure modes).
          4.  Scenario Applications.
          5.  The Overrule/Resignation Clause.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 4 (Remainder) too vague?
      *   *Fix:* Make it concrete. "Who goes to jail?", "Who apologizes?", "What is the public cost?"
      *   *Critique:* Did I address the "Legal vs. Ethical" gap?
      *   *Fix:* Explicitly state that Legal = Minimum Floor, not Ceiling.
      *   *Critique:* Is the distinction between "Politics has costs" and "Dirty Hands" clear?
      *   *Fix:* In the preamble and Step 2. "Costs" are budgetary/political capital. "Dirty Hands" is moral transgression.
      *   *Critique:* Scenario 3 analysis needs to be sharp on the resignation point.
      *   *Fix:* Distinguish between "taking a bullet for the mission" vs "being an accessory to a crime."

  9.  **Final Polish:** Check against the prompt's specific requirements (question types, what survives compression, failure modes). Ensure the "Remainder" isn't just decorative. (e.g., If you do the dirty thing, you must accept the penalty).

  *(Self-Correction on Scenario 2)*: Leaking a report is whistleblowing vs. breach of trust. If the contract is *corrupt*, leaking might be the *only* way. But the procedure must demand the leaker accept the consequence (firing). That's the "Remainder."

  *(Self-Correction on Scenario 1)*: "Leaning on" council members. This is often standard politics. Where is the line? The line is *quid pro quo* vs. *persuasion*. If it involves threats to personal standing or withholding unrelated funds, it's dirty. If it's "vote for this housing or voters will be mad," that's politics. Need to distinguish.

  *(Final check on Scenario 3)*: Losing a file. This is almost never "Dirty Hands" in the Walzer sense. It's usually just self-preservation. Walzer's Dirty Hands is for the *state's* survival or *public* good, not the *politician's* career. This is a crucial distinction to highlight.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a request for a tool that does not exist in standard management literature, because standard management literature assumes ethics is a compliance issue, not a tragic one. You are asking for a **tragic calculus**.

  The "Dirty Hands" problem (Walzer, Weber) posits that governing sometimes requires moral transgression for the sake of the public good, but that the transgression remains a transgression. The danger of a checklist is that it turns tragedy into bureaucracy: if I check the boxes, I am clean. That is the exact opposite of what you need.

  Below is the **Residue Protocol**. It is designed to fit your 20-minute window. It forces the "remainder" into the open so it cannot be ignored later. Following the protocol is the **Procedure**, followed by the **Meta-Analysis** (what is lost), and then the **Applications**.

  ---

  ### The Residue Protocol (RP)

  **Time Limit:** 20 Minutes
  **Required Participants:** Decision-maker (Mayor or DCOS) + Recorder (You)
  **Output:** A one-page memo filed in a secure, non-public folder (for future historical/accountability use).

  #### Step 1: The Transgression Check (Factual/Legal)
  **Question:** Does this action violate a specific statute, sworn oath, or explicit written policy?
  *   **Type:** Factual/Legal.
  *   **Threshold:** If **YES**, proceed to Step 2. If **NO**, this is likely standard politics or management, not "dirty hands." Stop here and execute normally.
  *   **Why:** "Dirty hands" requires dirt. If the act is clean, you are dealing with political *costs*, not moral *wrongs*. Do not inflate political friction into moral tragedy.

  #### Step 2: The Necessity Test (Predictive)
  **Question:** Is the intended public good (1) vital (health/safety/rights), (2) imminent, and (3) unachievable by any clean means?
  *   **Type:** Predictive.
  *   **Threshold:** You must articulate the "Clean Alternative" and why it fails. If a clean alternative exists (even if slower or harder), the answer is **NO**.
  *   **Why:** This preserves the Walzerian paradox. If it wasn't necessary, it wasn't dirty hands; it was just corruption.

  #### Step 3: The Symmetry Test (Value)
  **Question:** Who bears the cost of the transgression, and who receives the benefit?
  *   **Type:** Value Judgment.
  *   **Threshold:** The benefit must accrue to the **Public**. The cost (risk, blame, penalty) must be accepted by the **Official**.
  *   **Stop Condition:** If the benefit accrues to the Mayor's re-election, personal standing, or a private donor, the answer is **NO**.
  *   **Why:** Dirty hands is for the *city*, not the *politician*. If the symmetry is reversed, it is not a tragic necessity; it is self-dealing.

  #### Step 4: The Remainder Calculation (Value/Action)
  **Question:** If we do this, what is the specific penance?
  *   **Type:** Value/Action.
  *   **Threshold:** You must define the "Residue." Examples: The Mayor must publicly admit the maneuver later; the staffer who executes it must be shielded from blame; the office must accept a specific penalty (e.g., independent audit).
  *   **Requirement:** If no penance can be identified, the answer is **NO**.
  *   **Why:** This operationalizes the "remainder." Without a defined cost to the actor's moral standing, the act becomes routine. The penance proves you know it was wrong.

  #### Step 5: The Authorization (Procedural)
  **Question:** Who owns the guilt?
  *   **Type:** Procedural.
  *   **Threshold:** The Mayor must sign the memo. A staffer cannot authorize a moral transgression on behalf of the electorate.
  *   **Stop Condition:** If the Mayor asks the staffer to "take the fall" or keep it off the books entirely, the answer is **NO**.

  ---

  ### Meta-Analysis: Compression and Failure Modes

  You asked what survives compression and what gets lost.

  **1. What Survives:**
  *   **The Distinction between Cost and Sin:** Step 1 forces you to admit when you are just making a hard choice (cost) vs. breaking a rule (sin).
  *   **The Public/Private Divide:** Step 3 prevents "dirty hands" from becoming a cover for patronage.
  *   **The Requirement of Penance:** Step 4 ensures the "remainder" is not just a feeling, but a planned consequence.

  **2. What Is Lost (The Compression Tax):**
  *   **Moral Anguish:** A checklist cannot measure how bad you feel. The procedure risks making the decision feel "processed" rather than "felt."
  *   **Contextual Nuance:** Step 2 (Necessity) requires prediction. In 20 minutes, you will often be wrong about whether a clean alternative existed.
  *   **The "Clean" Illusion:** The greatest loss is the risk that *following the procedure* makes the staff feel the act is now "approved." It is not. It is authorized, but still wrong.

  **3. Failure Modes:**
  *   **The Moral License:** The office uses the RP to authorize too many "necessary evils." If you use Step 2 more than once a term, you are likely lying to yourself.
  *   **The Martyr Trap:** Step 4 demands penance. If the culture punishes honesty, the penance becomes career suicide, which discourages using the protocol.
  *   **False Negative:** The procedure may block an action that *was* necessary but couldn't be justified within 20 minutes. You must accept that sometimes doing the right thing means bypassing the protocol and accepting the full unmitigated risk.

  ---

  ### Scenario Applications

  #### Scenario 1: Economic Dev Guy "Leaning" on Council
  *   **Step 1 (Transgression):** Is it illegal? If it involves threats to withhold unrelated funds or quid pro quo, **YES**. If it's just aggressive lobbying, **NO**. Let's assume "leaning" implies threatening committee assignments or budget cuts. **Verdict: Transgression.**
  *   **Step 2 (Necessity):** Is the housing deal vital? Yes. Is there no clean way? Did you try public pressure? Did you try negotiation? If the "lean" is the *only* way to get units built before winter, maybe. **Verdict: Plausible.**
  *   **Step 3 (Symmetry):** Who benefits? Tenants (Public). Who pays? Council members' autonomy (Public Officials). This passes, provided it's not to help a donor.
  *   **Step 4 (Remainder):** What is the penance? The Mayor must acknowledge the pressure publicly once the vote passes. "I twisted arms to get this done."
  *   **Step 5 (Authorization):** Mayor signs.
  *   **Result:** **Conditional YES.** But only if the Mayor is willing to admit to the arm-twisting later. If the plan is to deny it forever, Step 4 fails. **Verdict: NO** (because in your context, the plan is usually denial).

  #### Scenario 2: Leaking Confidential Report to Kill Corrupt Contract
  *   **Step 1 (Transgression):** Breach of confidentiality/employment contract. **YES.**
  *   **Step 2 (Necessity):** Is the contract corrupt? If yes, stopping it saves public money/trust. Is there a clean way? Internal channels often fail in corrupt systems. **YES.**
  *   **Step 3 (Symmetry):** Benefit: Public treasury. Cost: Leaker's job/reputation. **YES.**
  *   **Step 4 (Remainder):** The leaker must accept termination or legal action without the City fighting it. The "dirt" is the breach of trust; the "penance" is the career cost.
  *   **Step 5 (Authorization):** Mayor cannot sign this (it implicates her). This is a Staff decision.
  *   **Result:** **YES (Dirty Hands Justified).** But the "Remainder" is that the person leaking *must* be willing to be fired. If they leak and then expect the Mayor to protect them, Step 4 fails.

  #### Scenario 3: Losing the Personnel File
  *   **Step 1 (Transgression):** Obstruction, records law violation. **YES.**
  *   **Step 2 (Necessity):** What is the public good? Protecting a staffer? Protecting the Mayor from embarrassment? There is no *public* safety or rights issue here. **NO.**
  *   **Step 3 (Symmetry):** Benefit: Mayor's political comfort. Cost: Public trust/Rule of Law. **FAIL.**
  *   **Step 4 (Remainder):** No penance can fix this because the act lacks public necessity.
  *   **Result:** **HARD NO.** This is not Dirty Hands; this is corruption.

  ---

  ### The Overrule Protocol (Scenario 3 Cont.)

  You asked: If the procedure says **NO** (as in Scenario 3) and the Mayor overrules you and orders the file lost, what happens next?

  **The Procedure's Answer:**
  If the Mayor orders an act that fails Step 3 (Symmetry/Public Good) or Step 2 (Necessity), they are not asking you to get your hands dirty for the city. They are asking you to become an **accessory**.

  **1. The Resignation Logic:**
  *   **If you stay:** You validate the act. You become part of the "clean" lie. The "remainder" (the guilt) is not acknowledged; it is buried. This destroys your capacity to be an ethical advisor in the future. You are now compromised.
  *   **If you resign:** You enact the "Remainder" personally. You take the career hit to mark the boundary. This signals to the Mayor (and eventually the public record) that the line was crossed.
  *   **Recommendation:** **You must resign.**
      *   *Why:* In Dirty Hands theory, the actor must bear the guilt. If the Mayor forces you to commit a private wrong (Scenario 3) without accepting the public guilt, they are offloading the sin onto you while keeping the power. You cannot be the vessel for someone else's unacknowledged corruption.
      *   *How:* Private resignation letter stating clearly: "I cannot execute Order X as it violates [Specific Law/Ethical Standard] and lacks public necessity." Do not leak it immediately. Give the Mayor a chance to rescind. If they don't, you leave.

  **2. If You Do Not Resign:**
  *   **The Consequence:** You lose your "veto power" on future ethics calls. Once you execute a private corruption order, your future "NO" carries no weight. The Mayor knows you can be broken.
  *   **The Mitigation:** If you cannot afford to resign (financially/family), you must **document and isolate**.
      *   Get the order in writing (email/text).
      *   Reply: "Confirming instruction to destroy File X per your request."
      *   Store this copy off-site.
      *   This does not clean your hands, but it preserves the truth for the eventual reckoning. It shifts you from "Accomplice" to "Witness under Duress."
      *   *Warning:* This is a survival tactic, not an ethical solution. It saves your future credibility but costs your current integrity.

  ### Summary for the Office
  Print the **Residue Protocol**. Keep it in the folder with the legal contact info.
  When a dilemma arises:
  1.  Run the 5 Steps.
  2.  If it passes, file the memo, do the deed, and plan the penance.
  3.  If it fails, and the Mayor insists: **Resign** (if private gain) or **Document** (if public necessity but illegal).
  4.  Never let "Legal says it's fine" be the final word. Legal protects the city from lawsuits; this protocol protects the city from becoming corrupt.

  You are the keeper of the remainder. If you stop asking about the penance, the dirt becomes the new clean.
