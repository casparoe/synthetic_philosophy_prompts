      *   *Residue:*
          *   *Clean:* Conflicting sensory data.
          *   *Distorted:* Physical facts (e.g., was the window open?). If the doctrine holds, the window must be *ontologically* open and closed, not just "he thought it was." This requires magical realism or high modernist fragmentation.
          *   *None:* The "Inexpressible."
