          *   "Assertion... made with a qualification... holds in some respect": *Syādvāda* (Theory of Conditioned Predication). The "seven-fold scheme" (*Saptabhaṅgī*).
          *   "It is, it is not, it both is and is not, it is inexpressible": This is actually the *Catuṣkoṭi* (Tetralemma), often associated with Buddhism/Nāgārjuna, but Jainism adapts it into the seven folds (is, is not, is & is not, inexpressible, is & inexpressible, is not & inexpressible, is & is not & inexpressible).
          *   "Four-fold way of unpacking what a word may mean": Likely *Nayavāda* (Theory of Partial Standpoints).
      *   *Correction needed:* The user mixes Jain *Syādvāda* (7-fold) with the Buddhist/Nyaya *Catuṣkoṭi* (4-fold). The "four-fold way of unpacking a word" is likely *Nayavāda*. The core insight is ontological, not just epistemic. It's not just "we don't know," it's "reality is complex."
      *   *Constraint:* Brief, no footnotes.

  3.  **Translate to Craft (Task 2):**
      *   *Goal:* Move from "standpoints" to "sentence mechanics."
      *   *Standpoints (Naya):* Focalization. Not just who sees, but *what category* they see through (e.g., one sees the room as a trap, another as a sanctuary).
      *   *Conditioned Predication (Syāt):* Qualifying the narrative voice. Not "The cup was blue," but "To him, the cup was blue" (too soft) vs. "The cup was blue, and therefore useless for hiding" (functional truth).
      *   *Seven-fold Scheme:* Structural sequencing. Not just A vs. B, but A, not-A, A+not-A, ineffable. How does a sentence hold contradiction without collapsing?
      *   *Ontological vs. Epistemic:* This is the crux. The novel usually treats reality as fixed and perception as variable. The doctrine treats reality as variable.
      *   *Irony vs. Contradiction:* Irony implies the narrator knows the truth and the character doesn't. Contradiction implies two truths coexist. The doctrine forbids standard dramatic irony that invalidates a character's truth.

  4.  **The Residue Report (Task 3):**
      *   *Clean Crossover:* Multiple POVs, conflicting sensory details, motive ambiguity.
