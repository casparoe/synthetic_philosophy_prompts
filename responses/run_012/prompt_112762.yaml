      *   *Verdict:* The doctrine is soteriological (aimed at liberation from dogma). The novel is aesthetic (aimed at experience). The residue is a defect *only if* you want the metaphysics. If you want the *experience* of the metaphysics, craft can handle it by withholding resolution.
      *   *Decision:* The residue is a sign the doctrine does work the novel doesn't need. The novel's job is to make the reader *feel* the contradiction, not solve the metaphysics of it.

  6.  **Refining the Tone:**
      *   The user is sophisticated. Don't patronize.
