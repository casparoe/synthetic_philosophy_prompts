      *   *Check:* Is the verdict decisive? I need to pick a side. The verdict should be: The doctrine is metaphysical; the novel is phenomenological. Don't try to write metaphysics; write the phenomenology of the contradiction.

      *(Self-Correction on the Philosophy)*: The friend mentions "four-fold way of unpacking what a word may mean." This is definitely *Nayavāda* (Collection of Standpoints), often categorized into 7 types, but sometimes grouped. The "seven-fold scheme" is *Saptabhaṅgī*. The "four-fold" (is, is not, both, neither) is *Catuṣkoṭi*. I need to clarify that the friend has conflated Jain and Buddhist/Nyaya logic slightly, but the core is Jain *Anekāntavāda*. I will correct this gently.

      *(Self-Correction on the Verdict)*: If I say "Stop trying," that's dismissive. If I say "The doctrine is useless," that's wrong. The verdict should be: The doctrine describes *reality*; the novel describes *access to reality*. The residue is the gap between being and knowing. The novel lives in the gap. Do not try to close the gap with ontology; widen it with narrative structure.

      *Final Plan:*
