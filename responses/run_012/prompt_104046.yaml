answer: |-
  This is a profound question that strikes at the heart of semiotics, typography, and the psychology of reading. You are arguing from the position of the *reader* (who processes context), while your friend argues from the position of the *designer* (who manages a system). Both are correct, but you are designing for a different medium than she is.

  She is judging your script as a **typeface** (where uniformity ensures speed and invisibility). You are designing a **script** (where variance implies humanity, origin, and materiality).

  Here is a framework you can use at the drawing table to determine if your variant 'a' holds its identity, based on three pillars: **Differentiation, Topology, and Materiality.**

  ### 1. The Argument of Differentiation (The System)
  You hit on the crucial truth when you wrote: *"an 'a' is partly what it is because it must be told apart from a 'd' and a 'q'."*

  In linguistics, this is called **distinctive feature theory**. A phoneme (sound) is defined not by its absolute quality, but by how it differs from other phonemes in the same language. The same applies to graphemes (letters). An 'a' does not need a specific "core" shape; it needs to occupy a unique coordinate in the system's geometry.

  **The Test:**
  Place your variant 'a' next to the other letters in your 23-character set that share its components.
  *   **The 'd' and 'q':** If your script is single-stroke, these are likely rotations or reflections of the 'a'. If your flattened bowl and hooked tail make the 'a' look like a 'd' written quickly, or a 'q' written upside down, the system collapses.
  *   **The 'u' and 'n':** If you flatten the bowl into a trough, does it become a 'u'? If you hook the tail, does it become an 'n'?
  *   **The 'o':** If the counter closes up (as you noted happens in wood carving), does it become an 'o'?

  **The Principle:** A letterform retains its identity as long as it remains **more similar to its own variants than to its neighbors' constants.** If your variant 'a' looks more like your standard 'd' than it does like your standard 'a', it has crossed the line. If it looks like a weird 'a' but still unmistakably *not* a 'd', it is valid.

  ### 2. The Argument of Topology (The Stroke)
  You mentioned a critical constraint: **the single unbroken stroke.** This is a topological constraint.

  In a continuous line script, the identity of a letter is often defined by the *path* of the pen, not just the white space it creates.
  *   Does the stroke cross itself?
  *   Does it loop inside or outside?
  *   Where does the terminal end relative to the origin?

  **The Test:**
  Trace the path of your variant 'a' with your finger (simulating the reed pen).
  *   If the standard 'a' is drawn *counter-clockwise* with the tail exiting *up*, and your variant is drawn *clockwise* with the tail exiting *down*, you have changed the motor program. To a scribe (and a reader sensing the rhythm), that is a different letter.
  *   However, if the motor program is the same, but the *proportion* is distorted (the flattened bowl), that is merely a stylistic variant.

  **The Principle:** In a single-stroke script, **gesture is identity.** If the variant requires a different hand motion to execute than the rest of the family, it risks becoming a private mark. If it is the same motion executed with a different pressure or angle, it remains a letter.

  ### 3. The Argument of Materiality (The World)
  This is where your friend's professional expertise may actually be limiting her. She designs for ink on paper or pixels on a screen. You are designing for **wood, reed, and skin.**

  You have two physical constraints she is ignoring:
  1.  **The Chisel:** Wood grain resists curves. A "shallow trough" might be the natural result of cutting a bowl across the grain. If the variant 'a' is the "carved 'a'" and the standard is the "written 'a'," then the variant is not a corruption; it is a translation.
  2.  **The Thumb:** The blind archivist. This is your ultimate legibility test. Visual reading allows for ambiguity resolved by context. Tactile reading does not. A "small hook" might be visible to the eye but invisible to the thumb.

  **The Test:**
  Carve the variant into a piece of scrap wood. Run your thumb over it with your eyes closed.
  *   Does the "flattened bowl" feel like a straight line (a 'u' or 'l')?
  *   Does the "hook" feel like a burr (a defect) or a feature?
  *   If the archivist cannot distinguish it from a 'd' by touch, it fails the internal logic of your own story, regardless of how it looks on paper.

  **The Principle:** **Legibility is medium-specific.** A letter that works visually but fails tactily is a broken letter *in your specific world*.

  ### Synthesis: The "Scribe's Alibi"
  Your friend calls it a "private mark." In the context of guild ledgers, **private marks are real.** Scribes did have idiosyncrasies.

  If you keep the variant, you must decide its narrative function:
  1.  **Is it a Systemic Variant?** (Any scribe can use it). If so, it must pass the Differentiation Test. It must not confuse the 'd'.
  2.  **Is it a Specific Scribe's Hand?** (Only one character uses it). If so, your friend is right, but for the wrong reason. It *is* a private mark, and that is acceptable because it characterizes the writer.
  3.  **Is it a Material Variant?** (Used only on wood). If the hook is a result of the chisel slipping or the grain resisting, it is not a letterform error; it is a texture of the world.

  ### Recommendation for the Drawing Table
  Do not argue about "essence." Argue about **boundaries.**

  1.  **Draw the 'd' and 'q'.** If your variant 'a' encroaches on their visual territory, modify the hook or the bowl until the boundary is clear.
  2.  **Carve the sample.** If the thumb cannot find the counter (the enclosed space), you must deepen the bowl, regardless of the aesthetic.
  3.  **Accept the "Private Mark" label if necessary.** If the variant is truly on the edge, lean into it. Make it the specific hand of the *Guild Master* or the *Blind Archivist*. Let the ambiguity be a plot point.

  **The Verdict:**
  A letter's identity is not a fixed star; it is a territory. Your variant is valid as long as it does not invade the territory of another letter *within the specific constraints of your medium.* If it remains distinct from 'd', 'q', and 'u' when carved and touched, it is an 'a'. If it relies solely on visual context to save it from being a 'u', it is too weak for the world you have built.

  Trust the thumb over the eye. The eye can be fooled by context; the thumb knows only the truth of the shape.
