  3.  **Drafting - Section by Section:**

      *   *Intro:* Start with the shock of Fischer. It wasn't just history; it was identity. Frame the essay as an inquiry into the *grammar* of blame.
      *   *Conceptual Framework:* Need to be precise.
          *   *Causal:* Who pulled the trigger? (Germany mobilized).
          *   *Moral:* Who *should* not have?
          *   *Jaspers' Distinction:* Crucial here. Criminal (individual), Political (citizen share liability), Moral (individual conscience), Metaphysical. Focus on *Political Guilt*.
          *   *Problem of Many Hands:* In modern bureaucracies, no one person decides everything. Does responsibility vanish? Or does it attach to the structure?
