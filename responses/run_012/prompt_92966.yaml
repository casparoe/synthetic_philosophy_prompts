  *   Elias (Narrator)
  *   Sarah (The Skeptic)
  *   Marcus (The Lead)
  *   Priya (The Architect offering the way out)

  *Setting:* Conference Room B, 11 PM.

  *Key dialogue:* "It's just technical debt." "We promised Q3." "The wrapper idea."

