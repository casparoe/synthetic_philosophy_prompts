answer: |-
  The whiteboard was a graveyard of boxes and arrows, red marker slashing through the architecture diagram like a wound. It was eleven PM. The pizza had gone cold an hour ago.

  "It's latency," Marcus said, rubbing his temples. He was the Engineering VP, and his name was on the roadmap presented to the board last quarter. "The transaction ledger locks under load. We fix the locking mechanism, we ship."

  Sarah leaned back, arms crossed. She was the only one who hadn't spoken in twenty minutes. "We've fixed the locking mechanism three times, Marcus. The core model is synchronous. Payments are asynchronous. They don't match. We need to kill Project Ledger and route through the legacy provider."

  The room went quiet. This was the stop bid. The walk away.

  Elias looked at the budget sheet on the table. Two years. Three million dollars in engineering hours. If they killed it now, that number went into the quarterly report as a pure loss. Zero return. A three-million-dollar mistake with Marcus's signature on it.

  "If we switch to legacy," Elias said, his voice sounding thin in the quiet room, "we have to build a translation layer. Our new API schema doesn't match the old provider's spec."

  Priya, the staff architect, nodded slowly. "I ran the numbers. A translation layer is basically a rewrite of the ingestion service. Maybe less scope than finishing Ledger, but... it's still six weeks. Minimum."

  Marcus seized on it. "Six weeks. That's one sprint cycle. We're already here. If we stop now, we waste the last eighteen months. If we push for six weeks, we have a working system. Either Ledger fixed, or the translation layer done. We can't walk away with nothing."

  That was the trap, Elias thought. It wasn't about the money already spent. That was gone. It was about the next six weeks. Standing here, at the edge of the cliff, the choice wasn't between *spending three million* and *spending three million plus*. The choice was between *losing three million* and *spending a bit more to potentially save the three million.*

  To stop was to accept a certain loss. To continue was to gamble on a rescue. Rationality demanded you minimize the loss. So you bid again.

  "We told the clients we'd migrate by Q3," Marcus said. He wasn't looking at Sarah; he was looking at Elias. He needed the senior engineers to back the play. "If we tell them we're reverting to legacy now, we lose credibility. If we tell them we're optimizing for stability, we buy time."

  "It's not buying time," Sarah said. "It's buying hope. And the price keeps going up."

  "The price is fixed," Marcus countered. "Six weeks. That's the bid."

  Priya shuffled her papers. "Actually, there might be a middle ground. A vendor offered a middleware solution. We plug their API into our new frontend. No translation layer, no fixing the ledger locks. We just bypass the backend logic."

  Elias felt a surge of relief. The way out. "Does it support our compliance requirements?"

  "Mostly," Priya said. "But we'd need to modify our frontend to handle their webhook signatures. And we'd need to run parallel testing to ensure their fraud detection doesn't flag our existing user base."

  "How long?" Sarah asked.

  Priya hesitated. "Four weeks for integration. Eight weeks for testing. We can't risk false positives on fraud."

  Twelve weeks. Longer than fixing the locks. Longer than the translation layer.

  Marcus tapped his pen on the table. "But it saves the frontend work. We've already built the new UI. If we go legacy, we scrap the UI. If we do middleware, we keep the UI. We preserve the user experience investment."

  "There is no user experience investment if the payment fails," Sarah said.

  "But the UI is done," Marcus insisted. "That's six months of design work. We can't throw that away either."

  Elias watched the logic coil around them. It wasn't attachment to the past. It was the preservation of assets. They had spent money on the UI. They had spent money on the backend. To abandon the backend was to waste the UI. To abandon the UI was to waste the backend. Every asset they had created demanded they create another asset to justify its existence.

  They were bidding against each other, but the opponent was the project itself.

  "We're close," Marcus said. "I can feel it. The latency spike is isolated. I know the code. If we let the team focus solely on the concurrency issue, we don't need the middleware. We don't need the legacy bridge. We just finish what we started."

  "And if you're wrong?" Sarah asked.

  "Then we reassess."

  "We reassessed last month," Sarah said. "And the month before."

  "This is different. We have new data."

  Elias looked at the whiteboard. The red slashes looked like cage bars. He knew Sarah was right. He knew the math didn't work. But he also knew that if he sided with Sarah now, he was voting to write off three million dollars. He was voting to tell the board that his team had burned cash for nothing. He was voting to make Marcus look incompetent, and by extension, making himself part of a failed unit.

  The cost of stopping was social and professional suicide. The cost of continuing was just more code.

  "We need to lock the repo," Elias said quietly. "No new features. Just the concurrency fix."

  Marcus nodded, relieved. "Exactly. Two weeks. We give it two weeks."

  "Four," Priya corrected. "Testing needs four."

  "Four," Marcus agreed. "We can do four."

  Sarah stood up. She looked tired. "You know that in four weeks, there will be another bug. And you'll ask for another four."

  "In four weeks, we ship," Marcus said. He stood up too, reclaiming the room. "Good work, everyone. Let's get some rest."

  As they filed out, Elias lingered by the whiteboard. He picked up the eraser. He could wipe away the red slashes. He could clear the board. It would feel like a fresh start.

  But if he cleared the board, he'd have to draw a new diagram. And to draw a new diagram, he'd have to admit the old one was worthless. And if the old one was worthless, the last two years were worthless.

  He put the eraser down. He picked up the green marker. He drew a box labeled *Sprint 42* and connected it to the broken ledger. It was the only move that made sense. It was the only move that kept the loss theoretical instead of real.

  "See you Monday," Marcus called from the door.

  "Monday," Elias said.

  He turned off the lights, leaving the red slashes in the dark, where they couldn't be seen, but where they still counted.
