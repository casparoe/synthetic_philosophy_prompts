answer: |-
  The rain in Brighton didn't fall so much as hang in the air, a grey suspension that dampened the wool of Eleanor's coat and settled in her hair. She sat in the corner of the café, her back to the wall, watching the man by the window. He was stirring his tea. Not coffee. Tea, with a precise, rhythmic clink of the spoon against the china.

  Eleanor's phone buzzed in her pocket. A single message from Marcus: *Is it him?*

  Her thumb hovered over the screen. If she said yes, men would come. They would break the man's legs, perhaps his kneecaps, to recover the ledger he'd vanished with ten years ago. If she said no, she walked away, and her own debt to Marcus remained, ticking over like a bomb in her bank account. She needed this bonus. She needed to be right.

  She looked at the man again. He was older, certainly. The hair was greyer, receding slightly. He wore a cardigan that suggested a quiet life, a pension, perhaps a grandchildren's fund. But when he lifted the cup, the pinky finger extended slightly, and there was a tremor in the wrist that wasn't age. It was nerve damage. A burn scar, hidden by the sleeve, that she remembered from a warehouse fire in Docklands.

  Her brother-in-law, Simon, would have loved this moment. He was always banging on about his theories, the ones he'd cobbled together from old Indian logic texts and late-night whisky. He reckoned the standard list of how we know things—what we see, what we deduce, what we're told, what we compare—was incomplete. He claimed there was a fifth way: recognition. The flash. The sudden, unmediated certainty that *this* is *that*.

  "Perception is only now," Simon would say, waving a cigarette. "Inference needs a rule you can write down. Testimony is second-hand. But recognition? Recognition bridges time. It tells you the man across the room is the same boy who broke your window in 1998. None of the others can do that."

  Eleanor watched the man take a sip. *Perception,* she thought. *What do I actually see?* I see a man in a cardigan. I see a tremor. I see a profile. None of those things are 'guilty'. None of them are 'him'. They are just data points.

  *Inference.* If a man has a burn on his wrist and was present at the fire, he is likely the accountant. But she couldn't see the burn. She was inferring the burn from the tremor. That was a chain of logic, fragile and breakable. What if he had arthritis? What if he was just nervous?

  *Testimony.* Marcus's files said the accountant drank tea, not coffee. A thin thread. *Analogy.* He looked like the photos from ten years ago, aged appropriately. But likeness isn't identity. A forgery can possess likeness.

  And yet, beneath all of that, there was the flash. It hit her in the gut, a physical lurch of certainty that bypassed the logic centres entirely. It wasn't that he *looked* like the man; it was that she *knew* him. The space between the past and the present collapsed. In that instant, the grey cardigan and the warehouse greasepaint were the same substance.

  Simon claimed this flash was a valid source of knowledge, a *pramāṇa* in its own right. He said there were cases where the other four would deny you the truth, but recognition would deliver it. *This is the test,* Eleanor thought. *If I rely on perception and inference, I have doubt. If I rely on recognition, I have certainty.*

  But Simon never had to stake a life on his taxonomy. He never had to decide if a feeling was enough to send men with crowbars into a quiet café.

  The man put the cup down. He looked at his watch. A habit. The Accountant always checked the time before a drop. Ten years ago, it had been a meeting with the suppliers; today, perhaps it was a visit to the dentist. The context had changed, but the rhythm was identical.

  Her phone buzzed again. *Time is up, Ellie.*

  The pressure in her chest tightened. If she was wrong, she was condemning an innocent man to violence. She would be the author of his ruin based on a ghost. But if she was right, and she hesitated, Marcus would come for her. And beyond Marcus, there was the principle of it. The ledger contained names. Other people's debts. Other people's safety.

  She closed her eyes for a second. She tried to reconstruct the inference. *Premise 1: The Accountant has a specific nerve tremor. Premise 2: This man has that tremor. Conclusion: This is the Accountant.* It sounded solid in her head, but she knew she was filling in the gaps. She was forcing the data to fit the conclusion because she needed it to be true. She needed the bonus. She needed the closure.

  Was the flash just desire dressed up as knowledge? Simon would argue no. He'd say the flash is the only thing that binds the self through time. Without it, you are just a series of disconnected moments. To recognise someone is to assert that the past exists and is present here.

  The man stood up. He pulled on a macintosh, buttoning it carefully from the bottom up. Just like before.

  Eleanor's hand moved to her phone. The screen glowed. *Yes* or *No*.

  If she said no, she walked away. She kept her debt. She lived with the uncertainty. She accepted that perception is all we have, and that the past is dead.

  If she said yes, she validated the flash. She asserted that she *knew* him, not just suspected him. She acted on the fifth source.

  The man turned towards the door. For a second, his eyes swept the room. They passed over her. There was no flicker of recognition on his face. To him, she was a stranger in a wet coat. This was the asymmetry of recognition; it rarely happens both ways at once. He had moved on. She was the one stuck in the warehouse fire.

  *Perception says stranger,* her mind warned. *Inference says probability. Recognition says guilt.*

  Simon's voice echoed in her head. *'It earns a spot on the list if there's some case where it delivers knowledge that the other four would have to deny you.'*

  This was the case. The other four denied her certainty. They offered only probabilities, shadows, likelihoods. Only the recognition gave her the solid ground of *is*. But was it solid ground, or was it a trap? A cognitive shortcut evolved for social bonding, now weaponised for debt collection?

  The man's hand touched the door handle.

  Eleanor felt the pull of the verdict. To know him was to destroy him. To doubt him was to save him, but condemn herself to the limbo of not knowing.

  She thought of the ledger. She thought of the names in it. She thought of the burn on the wrist she couldn't see but knew was there.

  She typed *Yes*.

  She hit send.

  The man opened the door and stepped out into the grey rain. Eleanor watched through the glass. Two figures emerged from the alleyway opposite, moving with a casual lethargy that was entirely feigned. They fell in behind him.

  She didn't wait to see the impact. She stood up, leaving her cold coffee on the table. Her hands were shaking, not from fear, but from the exertion of having collapsed ten years into a single thumbprint.

  Outside, the rain continued to hang in the air. She walked past the spot where the men would be working in a minute. She didn't look back. She had staked her soul on the flash. She had treated a feeling as a fact.

  As she turned the corner, she passed a mirror in a shop window. She stopped and looked at her own reflection. The face staring back was older than the one she remembered from ten years ago, too. Lines around the eyes, grey at the temples.

  *Do I know her?* she wondered. *Or do I just remember her?*

  The distinction felt suddenly vital, and entirely useless. The men would be finishing up by now. The debt would be settled. The knowledge would be confirmed in blood and bone, the only verification that mattered in Marcus's world.

  Eleanor pulled her collar up against the damp and walked towards the station. She had answered the question Simon loved to ask. She had found a case where recognition delivered what the others couldn't. She had delivered certainty.

  But as the train rattled into the platform, roaring and shaking the concrete beneath her feet, she realised the cost of that certainty. Recognition hadn't just told her who he was. It had told her who *she* was. A person who could send men to break a stranger's legs on the strength of a feeling.

  She boarded the train and found a seat. The carriage was empty. She looked at her reflection in the dark window. The face was clear. The identity was fixed. She knew herself, finally, with the same terrible clarity she had claimed to have about the man in the café.

  The train pulled away, carrying her out of Brighton, leaving the verification of her knowledge to the silence of the alleyway. She closed her eyes, but the flash remained, burning brighter than any inference could ever manage. She knew. And knowing, she could never undo it.
