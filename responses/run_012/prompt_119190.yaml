  ### **Node 3: The Substratum/Haecceity Split**
  **Question:** What is the ontological bearer of the primitive thisness that makes the swapped world distinct?

  *   **A PRIMITIVE NON-QUALITATIVE PROPERTY (HAECCEITY)** → **Leaf B: Haecceitism**
      *   *View:* **Haecceitism**
      *   *Grounding:* **Nothing qualitative** (primitive thisness).
      *   *Awkward Commitment:* Commits to primitive non-qualitative facts that escape all empirical detection.
      *   *Unheld Combinations:* N/A.

  *   **A QUALITY-LESS SUBSTANCE (BARE PARTICULAR)** → **Leaf C: Substratum Theory**
      *   *View:* **Substratum Theory**
      *   *Grounding:* **Nothing qualitative** (bare particular).
      *   *Awkward Commitment:* Posits an unknowable "I-know-not-what" underlying properties.
      *   *Flag:* **This tree cannot fully separate Leaf B and Leaf C**, as both answer the test cases identically; they differ only in the technical categorization of the individuator.

  *   **NO ANSWER / UNEXPLORERED** → **Leaf D: Unexplored Haecceitism**
      *   *View:* **Unexplored Combination**
      *   *Status:* **Unexplored.** Most who affirm distinct possibilities commit to one of the above ontologies.
      *   *Awkward Commitment:* Accepts distinct possibilities without an account of what grounds them.

