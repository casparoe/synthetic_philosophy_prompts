      *   **Factions:**
          *   *Free-Energy Realists:* FEP is a substantive, unifying law of self-organizing systems; explains why brains approximate Bayesian inference.
          *   *Free-Energy Deflationists:* FEP is a mathematical truism/unfalsifiable framework; explanatory power is illusory (post-hoc description).
      *   **Common Ground:** Both accept Active Inference is useful for engineering; disagree on whether FEP is a *theory of the brain*.
      *   **Specific Distinction to Register:** Blanket-relative (boundaries fixed) vs. Blanket-free (boundaries derived) formulations.
