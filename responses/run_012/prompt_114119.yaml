answer: |-
  # Joint Statement on the Status of the Free Energy Principle

  **Date:** [Current Date]
  **Parties:** The Free-Energy Realists & The Free-Energy Deflationists
  **Subject:** Adversarial Collaboration on the Ontological and Explanatory Status of the Free Energy Principle (FEP)

  ## Preamble
  We, the undersigned factions of the Cognitive Science Reading Group, acknowledge that while we share a commitment to rigorous mathematical modelling in cognitive science, we diverge sharply on the interpretation of the Free Energy Principle. This document records our points of consensus, delineates our precise disagreements, and establishes empirical cruxes that could, in principle, adjudicate the dispute. We distinguish throughout between the *formalism* of variational inference and the *principle* asserting its universal necessity for self-organising systems.

  ## Part I: Points of Consensus
  We agree on the following claims regarding the formalism, scope, and immediate implications of the FEP:

  1.  **Formal Validity:** We accept the mathematical derivation of variational free energy as an upper bound on surprise (negative log model evidence) and acknowledge that minimising this bound minimises the Kullback-Leibler divergence between an approximate posterior and a true posterior.
  2.  **Markov Blankets:** We agree that a Markov blanket constitutes a statistical boundary separating internal states from external states via sensory and active states, ensuring conditional independence. We acknowledge the distinction between **blanket-relative** formulations (where the blanket is fixed by the modeler) and **blanket-free** formulations (where the blanket is purported to emerge from the system's dynamics).
  3.  **Entailments:** We agree that if a system possesses a Markov blanket and maintains its structure over time, its internal states can be *described* as encoding a probability distribution over external states. We disagree, however, on whether this description implies the system *causally* performs Bayesian inference.
  4.  **The Dark-Room Problem:** We agree that the "dark-room problem" (the risk that free-energy minimisation implies seeking unstimulating states to minimize surprise) is formally addressed within the framework by **Expected Free Energy (EFE)**, which incorporates preferences over outcomes that value information gain. We disagree on whether this solution is explanatory or merely a restatement of the requirement that organisms must avoid absorbing states.
  5.  **Active Inference:** We agree that Active Inference is a viable engineering paradigm for designing agents that robustly navigate uncertain environments. We disagree on whether the success of Active Inference engineering validates the FEP as a theory of biological brains.
  6.  **Bayesian Brain:** We agree that the FEP entails a Bayesian structure for perception. We disagree on whether the FEP *derives* the Bayesian Brain hypothesis from physical first principles or merely *accommodates* it by construction.

  ## Part II: Table of Disagreements
  The following table summarises our divergent interpretations of the claims above.

  | Claim | Free-Energy Realists | Free-Energy Deflationists |
  | :--- | :--- | :--- |
  | **Ontological Status** | The FEP is a **constitutive law** of self-organising systems, analogous to the principle of least action in physics. | The FEP is a **regulative framework** or modelling heuristic, analogous to the assumption of rationality in economics. |
  | **Explanatory Direction** | The necessity of minimising free energy **explains why** brains implement Bayesian inference and maintain boundaries. | The fact that brains implement Bayesian inference **allows us to describe them** as minimising free energy; the arrow of explanation is reversed. |
  | **Falsifiability** | The FEP is falsifiable by the existence of a persistent, self-organising system that cannot be described as minimising free energy without trivialising the model. | The FEP is unfalsifiable in its general form because any persistent system admits *some* free-energy description; its value lies in parsimony, not truth. |
  | **Blanket Status** | In blanket-free formulations, the Markov blanket is a **physical discovery** about where the system ends and the world begins. | In blanket-relative formulations, the Markov blanket is a **modelling choice** imposed by the observer to make the maths tractable. |

  ## Part III: Empirical Cruxes
  We identify three specific cruxes where our disagreements yield divergent predictions. For each, we specify a test, our respective predictions, and what would count as evidence against our own view.

  ### Crux 1: Constitutive Principle vs. Regulative Constraint
  **The Question:** Is the FEP a physical constraint on what systems *can* persist (Constitutive), or a normative constraint on how we *model* persistent systems (Regulative)?

  *   **Test Case:** **The Triviality Limit.** Consider a simple, persistent physical system (e.g., a flame or a vortex) with no memory or complex internal dynamics. Attempt to model it using the FEP.
  *   **Realist Prediction:** The system *must* admit a non-trivial free-energy functional. If the model required to describe the flame as minimising free energy is as complex as the flame itself, the FEP fails as a unifying law. We predict a compact functional exists.
  *   **Deflationist Prediction:** One can always construct a free-energy functional for the flame, but the complexity of the "generative model" required will scale with the system's complexity, rendering the description vacuous. We predict no compression gain.
  *   **Falsification Conditions:**
      *   **Realists:** Would concede if it is proven that for a class of persistent systems, the only valid free-energy functional requires a model more complex than the system itself (violating the principle of parsimony required for a "law").
      *   **Deflationists:** Would concede if a persistent system is found that *cannot* be described by any free-energy functional, even a trivial one (implying the FEP is not even a universal description).

  ### Crux 2: Explanatory Work of the Markov Blanket
  **The Question:** Does the Markov blanket apparatus discover system boundaries (Blanket-Free), or does it merely redescribe boundaries fixed by the modeler (Blanket-Relative)?

  *   **Test Case:** **Boundary Identification in Morphogenesis.** Observe a developing biological organism where the physical boundary (e.g., cell membrane vs. tissue layer) is ambiguous during development.
  *   **Realist Prediction:** The dynamics of the system will uniquely determine the location of the Markov blanket. The "self" emerges where the conditional independence holds objectively, independent of the observer.
  *   **Deflationist Prediction:** The location of the Markov blanket will vary depending on the scale and variables chosen by the modeler. There is no single "true" blanket, only useful ones.
  *   **Falsification Conditions:**
      *   **Realists:** Would concede if multiple, mutually incompatible Markov blankets can be derived from the same dynamics with equal statistical validity, implying the boundary is observer-relative.
      *   **Deflationists:** Would concede if the physics of the system uniquely dictates a single statistical boundary that matches the biological intuition of the organism's "skin" without observer intervention.

  ### Crux 3: Unique Predictions vs. Alternative Models
  **The Question:** Does the FEP make predictions that a standard predictive-coding model (with a fixed generative model and no explicit free-energy objective) does not?

  *   **Test Case:** **Epistemic Foraging in Novel Environments.** Place an agent in an environment where reward is sparse but information is abundant. Compare an Active Inference agent (minimising EFE) against a standard Reinforcement Learning agent (maximising reward with fixed priors).
  *   **Realist Prediction:** The FEP agent will exhibit specific, quantifiable information-seeking behaviour (epistemic action) even when expected reward is identical to a non-seeking policy. This is a direct consequence of the entropy term in Expected Free Energy.
  *   **Deflationist Prediction:** This behaviour can be fully replicated by a standard model simply by adjusting the prior preferences over states. The "epistemic term" is mathematically equivalent to a specific prior in a non-FEP model.
  *   **Falsification Conditions:**
      *   **Realists:** Would concede if the specific pattern of information-seeking behaviour predicted by EFE can be perfectly matched by a reward-maximising agent *without* implicitly encoding an information-gain objective in its reward function.
      *   **Deflationists:** Would concede if the FEP agent exhibits a specific behavioural signature (e.g., a specific trade-off curve between risk and ambiguity) that cannot be mapped onto any standard reward function without circular redefinition.

  ## Part IV: Analysis of Verbal Dispute
  We acknowledge that a portion of our dispute is verbal, centering on the definition of "Principle" and "Law."

  *   **The Verbal Core:** The Realists use "Law" to mean "a mathematical identity that holds for all systems meeting condition X." The Deflationists use "Law" to mean "a causal mechanism that drives systems to meet condition X." Since the FEP is mathematically derived from the existence of a Markov blanket, it is tautologically true for any system *defined* as having one. The disagreement is whether the existence of the blanket is a contingent physical fact or a modelling assumption.
  *   **Proposed Stipulation:** To dissolve this verbal ambiguity without begging the question, we propose adopting the following terminology for future discourse:
      1.  **FEP-Identity:** The mathematical theorem that *if* a system has a Markov blanket, *then* its internal states minimise variational free energy. (Both sides accept this as true).
      2.  **FEP-Claim:** The empirical assertion that *all* biologically self-organising systems possess Markov blankets of a sort that makes the FEP-Identity explanatory rather than trivial. (Realists affirm; Deflationists deny).

  By restricting the term "Free Energy Principle" to the **FEP-Claim**, we ensure that future debates focus on the empirical existence of the requisite boundaries and the non-triviality of the resulting models, rather than the validity of the underlying mathematics.

  **Signed,**

  *The Free-Energy Realists*  
  *The Free-Energy Deflationists*
