              *   *Falsification:* Realists falsified if a persistent system is found where no Markov blanket yields a valid free energy functional. Deflationists falsified if a system is found that persists *without* any possible free-energy description (hard for them to concede, maybe shift to "non-trivial description"). Let's refine: Deflationists falsified if FEP predicts a specific dynamic *before* the blanket is chosen that is confirmed.
          *   *Crux 2: Markov Blanket Explanatory Work.*
