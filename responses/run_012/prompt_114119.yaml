      *   Concrete test/prediction/falsification for each crux? Yes.
      *   Verbal dispute analysis + stipulation? Yes.
      *   No reading list/citations? Yes.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Consensus:* Math is valid. Active inference works for engineering. Dark room is solved by EFE (preferences). FEP implies Bayesian structure.
      *   *Table:* Realist: "Law of life." Deflationist: "Description of life." Realist: "Falsifiable." Deflationist: "Framework."
      *   *Crux 1 (Constitutive):* Test: Simple physical system (e.g., flame). Realist: It minimizes FEP. Deflationist: You can describe it that way, but it doesn't *do* it.
      *   *Crux 2 (Blanket):* Test: Identifying the blanket of a cell. Realist: Physics dictates it. Deflationist: Modeler chooses it.
      *   *Crux 3 (Prediction):* Test: Novel environment exploration. Realist: Information gain valued intrinsically. Deflationist: Just a prior over states.
      *   *Verbal:* "Principle" vs "Tautology". Stipulate "FEP-Identity" vs "FEP-Claim".

      *(Self-Correction during drafting)*: Make sure the "Dark Room" consensus is careful. Realists say it's solved by EFE. Deflationists might say it's solved by *stipulating* priors. The consensus is that the *formalism* has the resources to address it, not that the explanation is equally satisfying to both.
      *(Refining Crux 1 Falsification)*: If Deflationists say it's a truism, they can't be falsified by a counter-example system. They can only be falsified if the *utility* of the description fails. I need to phrase this carefully. The Deflationist should agree that if the description requires infinite complexity, it's vacuous. So the test is about *non-trivial* description.

