              *   *Realist:* The blanket emerges from the dynamics (Blanket-free).
              *   *Deflationist:* The blanket is imposed by the modeler (Blanket-relative).
              *   *Falsification:* Realists if boundaries are arbitrary. Deflationists if boundaries are uniquely determined by physics.
          *   *Crux 3: Unique Predictions (vs. Standard Predictive Coding).*
