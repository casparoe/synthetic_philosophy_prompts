answer: |-
  ### I. The Machinery: Moral Trade as a Contracting Problem

  Let $N = \{1, 2\}$ be the set of agents. We model the interaction as a bilateral contracting problem with complete information (initially) over a set of feasible actions.

  **1. Types and Preferences**
  In standard mechanism design, a type $\theta_i$ indexes a preference ordering over outcomes. In moral trade, $\theta_i$ represents the agent's *moral weight vector*.
  Let the state of the world be $s \in S$, determined by the action profile $a = (a_1, a_2) \in A = A_1 \times A_2$.
  Agent $i$'s utility function is $U_i(a, \theta_i)$.
  Crucially, we must decompose this utility into two components:
  $$U_i(a, \theta_i) = v_i(s(a)) - c_i(a_i)$$
  Where $v_i(\cdot)$ is the moral valuation of the resulting state (e.g., reduction in suffering), and $c_i(\cdot)$ is the private cost of conduct (e.g., taste loss from vegetarianism, opportunity cost of donation).
  *   **The Type:** $\theta_i$ parameterizes $v_i$. For Agent 1 (Animal), $v_1$ places high weight on animal welfare states. For Agent 2 (Poverty), $v_2$ places high weight on human welfare states.
  *   **Common Knowledge:** We assume $\theta_i$ are known. If they are private, we invoke the **Revelation Principle**: any equilibrium of a bargaining game can be implemented by a direct mechanism where agents report $\hat{\theta}_i$. However, this introduces **Incentive Compatibility (IC)** constraints: agents may misrepresent their moral weights to shift the burden of action onto the other.

  **2. Allocations and Feasibility**
  An allocation is a contract $\kappa = (a_1, a_2, t)$, where $t$ is a transfer of numeraire (money).
  *   **The Good:** The "good" being traded is not a physical object but a restriction on the action space. Agent 1 agrees to constrain $a_1$ to a subset $A_1' \subset A_1$ (e.g., "no meat") in exchange for Agent 2 constraining $a_2$ (e.g., "donate \$X").
  *   **Feasibility:** $a_i \in A_i$. If there are deontological constraints, the feasible set is exogenously restricted (see Residue I).

  **3. The Disagreement Point and Participation**
  Let $a^{SQ} = (a_1^{SQ}, a_2^{SQ})$ be the status quo (autarky). This is the **disagreement point** or threat point.
  *   **Participation Constraint (PC) / Individual Rationality:** A contract $\kappa$ is viable only if:
      $$U_i(\kappa, \theta_i) \geq U_i(a^{SQ}, \theta_i) \quad \forall i \in N$$
      Moral trade exists if there is a $\kappa$ satisfying PCs where at least one inequality is strict. This is the formal analogue of "gains from trade."

  **4. Efficiency and Transfers**
  *   **Pareto Efficiency:** An allocation is Pareto efficient if no other feasible allocation makes one agent better off without making the other worse off, given their $\theta_i$.
  *   **Transferable Utility (TU):** If $U_i$ is quasilinear in $t$ (money), utility is transferable. The moral trade problem becomes a maximization of joint surplus:
      $$\max_{a} \sum_i [v_i(s(a)) - c_i(a_i)]$$
      Subject to the PCs.
  *   **Second Welfare Theorem Analogue:** If preferences are convex and TU holds, any Pareto efficient moral outcome can be supported as a competitive equilibrium with appropriate transfers (side payments). This justifies the "animal person pays poverty person" or vice versa logic: we separate the *efficiency* question (who can reduce suffering cheapest?) from the *distribution* question (who pays?).

  **5. Commitment and Credibility**
  The fundamental friction is **enforceability**.
  *   **Non-Contractible Actions:** If $a_i$ (e.g., what I eat in private) is not verifiable by a third party, the contract is not legally enforceable.
  *   **Repeated Games:** Credibility relies on reputation or repeated interaction. If the game is one-shot, we face a **Hold-Up Problem**. Agent 1 goes vegetarian, but Agent 2 has no incentive to donate ex-post.
  *   **Threats:** The disagreement point $a^{SQ}$ is not necessarily nature-given; it is the outcome of a non-cooperative equilibrium in the absence of agreement. If Agent 2 can credibly threaten to increase animal suffering unless paid, $a^{SQ}$ shifts to Agent 1's detriment.

  ---

  ### II. The Residue Report

  Here we evaluate what is lost, distorted, or preserved when mapping the philosophical discourse onto this machinery.

  #### A. Surviving Intact
  1.  **Comparative Advantage in Moral Production:** The core insight survives perfectly. If Agent 1's marginal cost of reducing animal suffering is lower than Agent 2's, and vice versa for poverty, specialization maximizes the aggregate moral value function. The model captures the "efficiency" claim precisely.
  2.  **The Non-Zero-Sum Nature:** The Pareto criterion formally demonstrates that moral disagreement need not be zero-sum. The contract curve exists wherever marginal rates of substitution between moral goods differ.
  3.  **The Role of Disagreement:** In the model, disagreement is simply heterogeneity in $\theta$. It is the *engine* of trade, not an obstacle. This aligns with the philosophical claim that pluralism enables cooperation.

  #### B. Surviving as Distortion
  1.  **Utility as Metric vs. Justification:** In MD, $U_i$ is a representation of choice. In philosophy, moral claims are often justificatory. The model treats "I value animals" as a preference parameter $\theta$. Philosophy often treats it as a truth claim about the world. The model reduces *normativity* to *subjective valuation*.
  2.  **The Status Quo:** The model takes $a^{SQ}$ as exogenous. Philosophy often contests the legitimacy of the status quo. If the status quo involves injustice, the PC (Individual Rationality) might be viewed as illegitimate (e.g., "I shouldn't have to pay you to stop harming me"). The model treats this as a bargaining power issue; philosophy treats it as a rights issue.

  #### C. No Counterpart (The Hard Residue)
  This is where the mapping breaks down. The following three concepts cannot be fully captured without altering the fundamental axioms of the mechanism design framework.

  **1. Deontological Constraints**
  *   **The Philosophical Claim:** Certain actions are forbidden regardless of consequences. "I cannot kill one to save five."
  *   **The MD Translation:** Modeled as a hard constraint on the action space ($a_i \notin A_i^{forbidden}$) or as infinite disutility ($c_i(a^{forbidden}) = \infty$).
  *   **The Residue:**
      *   *Infinite Cost:* If modeled as infinite cost, it is technically a preference. But in MD, preferences are typically assumed continuous to ensure existence of optima. Infinite discontinuity breaks standard fixed-point theorems.
      *   *Lexicographic Priority:* If modeled as lexicographic preferences (Consequences matter only if Deontology is satisfied), the preference relation is not representable by a real-valued utility function.
      *   *The Problem:* MD treats the constraint as a *boundary*. Philosophy treats it as a *categorical imperative*. In MD, if the price is high enough (infinite transfer), the agent might theoretically be compensated for the "cost." But the deontologist says the action is *ineligible*, not *expensive*. The model cannot distinguish between "I won't do it because it costs too much" and "I won't do it because it is wrong." Both look like $a_i \notin A_i^{chosen}$. The *reason* for the exclusion is invisible to the mechanism, which matters for stability and normative assessment.

  **2. Moral Blackmail**
  *   **The Philosophical Claim:** It is wrong to benefit from a threat to do evil. If Agent 2 threatens to burn puppies unless Agent 1 pays, paying might be "efficient" (Pareto superior to the threat outcome), but it is morally repugnant.
  *   **The MD Translation:** The threat shifts the disagreement point $a^{SQ}$. If $U_1(pay) > U_1(no\_pay + puppies\_die)$, the contract is PC-satisfying and efficient. The mechanism designer (social planner) maximizes surplus and endorses the payment.
  *   **The Residue:**
      *   MD is *consequentialist* regarding the contract. It evaluates outcomes relative to the threat point. It has no vocabulary for the *legitimacy of the threat point itself*.
      *   To capture the wrongness, one must introduce a "Rights" constraint on the feasible set of *threats*, not just actions. But rights are not primitive in standard MD; they must be derived from preferences or imposed by the planner.
      *   *Verdict:* The framework reports the transaction as efficient. The "wrongness" is an external judgment on the initial entitlements. The model is blind to the distinction between *creating* value and *ransoming* value.

  **3. Integrity and Inalienability**
  *   **The Philosophical Claim:** Moral agency is constitutive. "I cannot sell my conscience." Trading moral action for money corrupts the moral value of the action.
  *   **The MD Translation:** Standard MD assumes the *provenance* of the action does not matter, only the action itself. $U_i$ depends on $a$, not on *why* $a$ was chosen.
  *   **The Residue:**
      *   To model integrity, utility must depend on the *mechanism* itself: $U_i(a, \text{mechanism})$. If I go vegetarian because of a contract, I get less utility than if I go vegetarian because of principle.
      *   This creates a **circularity** or **endogeneity of preferences**. The contract changes the utility function it is trying to maximize.
      *   *Inalienability:* In law/econ, inalienability is a constraint on transferability. But here, the "good" is internal. You cannot trade "my moral commitment" because the act of trading destroys the commitment.
      *   *Verdict:* Standard MD assumes preferences are stable and sovereign. Integrity implies preferences are *fragile* and dependent on the history of choice. This requires "Identity Economics" or expressive utility models, which are outside the standard canonical toolkit.

  ---

  ### III. Conclusion: Defect or Illusion?

  You asked whether this residue indicates a defect in your vocabulary or evidence that the philosophers' disagreement is doing less work than it appears.

  **1. The Defect in the Vocabulary**
  Mechanism design is inherently **instrumentalist**. It asks, "Given ends, what is the optimal means?" It treats preferences as sovereign data.
  The philosophical residue (Deontology, Blackmail, Integrity) arises because morality is often **constitutive**. It asks, "What ends are permissible?" and "What does this action say about the agent?"
  *   **Blind Spot:** MD cannot natively model the *normative status* of preferences. It cannot distinguish between a preference for chocolate and a preference for genocide, except by imposing an external social welfare function.
  *   **Blind Spot:** MD assumes the *separability* of the agent from the action. Integrity posits that the agent is defined by the action.
  *   **Verdict:** Yes, it is a defect *if* the goal is to capture the full normative landscape. MD is a positive theory of strategic interaction, not a normative theory of value.

  **2. The Illusion in the Debate**
  However, a significant portion of the philosophical resistance dissolves under translation.
  *   **Deontology:** Often, when philosophers say "forbidden," they behave *as if* the cost is infinite. For the purpose of predicting behavior or designing institutions, modeling it as a hard constraint ($a \notin A$) yields the same equilibrium as the categorical imperative. The metaphysical distinction does not alter the mechanism's output.
  *   **Blackmail:** The intuition that blackmail is wrong is often an intuition about *long-term incentives*. If we model this as a repeated game with reputation, "blackmail" strategies are often punished by the community (third-party enforcement), restoring efficiency without needing meta-ethical baggage. The "wrongness" is an evolved heuristic for enforcing property rights over one's own safety.
  *   **Integrity:** While "expressive utility" is messy, it is still utility. If acting for money reduces utility, the agent simply won't trade. The market for moral trade will clear at a price that accounts for the "integrity cost." If the cost is truly infinite (inalienable), the market simply doesn't open. The *phenomenon* is captured, even if the *feeling* is not.

  **Final Judgment:**
  The residue is partly a **defect in the vocabulary** (MD cannot capture the *source* of normativity) but largely evidence that the **philosophical disagreement is doing less work than it appears**.
  Much of the "moral" resistance to trade is actually **transaction cost** or **information asymmetry** in disguise.
  *   "I can't sell my conscience" $\rightarrow$ "My utility function is non-separable in money and action." (Solvable with richer utility specs).
  *   "Blackmail is wrong" $\rightarrow$ "We need to constrain the disagreement point." (Solvable with property rights enforcement).
  *   "Deontological constraints" $\rightarrow$ "Hard boundaries on the feasible set." (Solvable with constraint sets).

  The "mystery" of moral trade vanishes when you realize it is just a contracting problem with unusual goods (conduct), non-standard preferences (interdependent moral utility), and high enforcement costs. The philosophers are often describing the *texture* of the constraints; you are describing the *structure*. The structure holds; the texture is lost. For the purpose of designing mechanisms to facilitate cooperation, the structure is what matters. The texture is the residue of a language game that your vocabulary rightly abstracts away from.
