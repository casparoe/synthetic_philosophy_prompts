prompt: |-
  I'm an economist who works on evolutionary game theory and equilibrium selection, and I know the formalism far better than I know the history. The debate I want restated concerns moral revolutions: why practices such as slavery and dueling, once entrenched and even honorable, become intolerable and are abandoned, and whether the engine is moral argument, changing material interests, or the dynamics of honor and reputation. Restate that debate as faithfully as you can in the vocabulary I actually use -- populations of strategies, payoff matrices, repeated games, correlated equilibria, focal points, equilibrium selection, stochastic stability, and norm entrepreneurs who perturb payoffs or the feasible strategy set. Treat honor as a correlated equilibrium sustained by third-party punishment and reputational signaling, and moral argument as a shift in the payoff landscape or in the set of strategies that can be jointly chosen. Then give me the residue report: which historical and normative claims translate cleanly, which translate only with distortion, and which have no counterpart in the formalism at all, especially the claim that a practice was wrong and that its wrongness is part of the explanation of its ending. Tell me whether the residue marks a defect of the game-theoretic framework or a sign that the original debate is less unified than it looks.
