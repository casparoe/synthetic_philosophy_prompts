answer: |-
  ### I. The Formal Restatement

  Let the historical status quo (e.g., slavery, dueling) be modeled as a **stochastically stable equilibrium** in a large population repeated game. The population is distributed over a strategy set $S$. The prevailing practice corresponds to a strategy profile $s^*$ that constitutes a **Nash Equilibrium** (or, more accurately, a **Correlated Equilibrium** given the public nature of social norms).

  **1. The Entrenched Practice (Honor as Correlation)**
  The stability of $s^*$ is not merely a function of pairwise payoffs but is sustained by a public correlation device $\phi$ (honor/reputation). $\phi$ maps history to signals that coordinate third-party punishment. If agent $i$ deviates from $s^*$ (e.g., refuses a duel, harbors a runaway), $\phi$ signals a reputational downgrade, triggering a punishment strategy $p_{-i}$ from the rest of the population. The expected discounted payoff of deviation is negative:
  $$ E[u_i(s^*, \phi)] > E[u_i(s', \phi')] $$
  where $\phi'$ is the "dishonorable" signal. The practice is entrenched because $s^*$ lies in a deep **basin of attraction**; the cost of unilateral deviation exceeds the threshold for stochastic escape.

  **2. The Mechanisms of Change (The Debate)**
  The debate over why the practice ends is a debate over which parameter in the dynamical system shifted to make $s^*$ unstable and select a new equilibrium $s^{**}$.

  *   **The Materialist Claim (Payoff Perturbations):**
      This position argues that the underlying payoff matrix $U$ changed exogenously. For slavery, this is a shift in relative prices or production technology (e.g., industrialization reduces the marginal product of coerced labor).
      $$ U_{old} \rightarrow U_{new} $$
      Under $U_{new}$, $s^*$ is no longer a Nash Equilibrium, or its basin of attraction shrinks sufficiently that small noise allows escape. The "moral" shift is epiphenomenal to the change in $U$.

  *   **The Honor/Reputation Claim (Dynamics of Signaling):**
      This position argues that the correlation device $\phi$ itself became too costly to maintain. In signaling models of honor, the cost of punishing deviators may rise (e.g., urbanization makes monitoring difficult). If the cost of enforcing the correlation device exceeds the benefit of coordination, the CE collapses. The system drifts until a new correlation device $\phi'$ emerges.

  *   **The Moral Argument Claim (Focal Points and Strategy Sets):**
      This position posits that **norm entrepreneurs** act as agents who perturb the **feasible strategy set** $S$ or introduce a new correlation device. Moral argument is modeled not as a payoff change, but as **cheap talk that becomes focal**. By articulating a new principle (e.g., "universal liberty"), entrepreneurs propose a new focal point $s^{**}$.
      Crucially, this is an **equilibrium selection** problem. If multiple equilibria exist (slavery vs. freedom), moral argument serves as the sunspot that coordinates the population on $s^{**}$. It reduces the "radius of attraction" of $s^*$ by increasing the perceived probability that others will switch, thereby making the switch a best response.

  **3. The Transition (Stochastic Stability)**
  The "revolution" is the transition period where the population moves from the basin of $s^*$ to $s^{**}$. This requires noise (mutations/errors) large enough to push the system over the separatrix. The debate is whether the necessary noise was generated by material shocks (payoffs), enforcement failures (honor), or coordinated signaling (moral argument).

  ***

  ### II. The Residue Report

  Here we analyze the translation fidelity between the historical/philosophical claims and the game-theoretic formalism.

  #### 1. Clean Translations
  *   **Entrenchment $\rightarrow$ Stochastic Stability:** The intuition that some practices are "hard to budge" even if inefficient maps perfectly to a strategy profile with a large basin of attraction requiring significant noise to escape.
  *   **Honor $\rightarrow$ Correlated Equilibrium:** Modeling honor as a public signal coordinating third-party punishment captures the external, social nature of reputation without requiring internal belief.
  *   **Coordination $\rightarrow$ Focal Points:** The idea that society must move together to abandon a practice (e.g., if only one person abolishes slavery, they are ruined) is precisely a multiple-equilibria selection problem solvable via Schelling focal points.

  #### 2. Distorted Translations
  *   **Moral Argument $\rightarrow$ Payoff Shift or Correlation Device:**
      *   *Distortion:* In the formalism, moral argument must be cashed out as either a change in preferences (payoffs) or a coordination signal (focal point). This reduces *reason-giving* to *preference-shaping* or *signal-sending*.
      *   *Loss:* The formalism cannot distinguish between a moral argument that is *valid* versus one that is *effective*. A successful lie functions identically to a successful moral truth in the model, provided it coordinates expectations. The *content* of the argument is irrelevant; only its impact on the distribution of strategies matters.
  *   **Norm Entrepreneurs $\rightarrow$ Mutations/Perturbations:**
      *   *Distortion:* Entrepreneurs are modeled as exogenous noise or "mutants" who try a new strategy.
      *   *Loss:* This strips the entrepreneur of *agency* and * foresight*. In history, entrepreneurs argue *for* a specific outcome based on principles. In EGT, they are often modeled as random deviations that happen to find a better basin. The intentionality of the moral crusader is lost in the stochastic dynamics.

  #### 3. No Counterpart (The Hard Residue)
  *   **Moral Wrongness as Explanation:**
      *   *Claim:* "Slavery ended because it was wrong."
      *   *Formalism:* There is no variable for "wrongness." There is only "off-equilibrium" or "payoff-dominated."
      *   *Residue:* The formalism cannot accommodate the claim that the *truth value* of a moral proposition caused the change. In EGT, if slavery ended, it is because $s^*$ became unstable. To say it ended *because it was wrong* implies a causal mechanism where normative truth alters physical behavior independent of payoffs or coordination. This is a category error in the formalism. The model can show that *believing* it is wrong changes payoffs, but not that *being* wrong changes payoffs.
  *   **Conscience and Interiority:**
      *   *Claim:* Individuals refused to participate despite material cost and social ostracism due to internal conviction.
      *   *Formalism:* This looks like a "preference shock" or an irrational mutation. If an agent incurs a cost to punish a norm-violator without reputational gain (altruistic punishment), it can be modeled, but the *source* of that utility function is exogenous. The formalism cannot explain the *origin* of the conscience, only its strategic effects.

  ***

  ### III. Evaluation: Defect or Disunity?

  Does this residue mark a defect in the game-theoretic framework, or does it reveal that the original historical debate is less unified than it appears?

  **Verdict: It reveals the disunity of the original debate.**

  The historical debate often conflates **functional explanations** (how the system moved) with **normative justifications** (why the move was right).

  1.  **The Category Error is Historical, Not Formal:** The claim "it ended because it was wrong" is often a shorthand for a complex causal chain: Moral argument $\rightarrow$ Changed beliefs $\rightarrow$ Changed behavior $\rightarrow$ New Equilibrium. The game-theoretic formalism forces us to disentangle these steps. It exposes that "wrongness" is not a force like gravity; it is a label applied to a strategy profile that has lost its support (payoffs or correlation).
  2.  **Explanatory Power vs. Normative Truth:** EGT is a tool for explaining *transitions*, not validating *ends*. The "defect" is only apparent if one expects positive social science to model normative truth. The residue exists because the historical debate smuggles normative realism (moral facts exist and cause things) into a causal explanation.
  3.  **Unification of Mechanisms:** The formalism actually *unifies* the three historical positions. Material interests, honor dynamics, and moral argument are all revealed as different parameters affecting the same dynamical system (payoffs, correlation devices, and focal points, respectively). The residue shows that the "Moral Argument" position is the weakest *causally* unless it can specify how it alters the payoff matrix or the correlation device.

  **Conclusion:** The residue does not indicate a failure of evolutionary game theory to capture social reality. Rather, it indicates a failure of the historical debate to distinguish between the *causes* of equilibrium selection (which EGT captures well) and the *justifications* for the selected equilibrium (which EGT rightly treats as exogenous). The claim that "wrongness caused the end" translates poorly because, in a strategic universe, practices end when they become unsustainable, not when they become untrue. The formalism forces the historian to specify the mechanism by which the "untruth" became "unsustainable."
