      *   *The "Vote" Problem:* The user worries correctness is a vote. The play shows the dark side of this. If correctness is community agreement, what happens to the outsider? Shylock is the "quus" calculator who gets punished for not following the new rule. The play illuminates the *violence* inherent in the skeptical solution. Kripke is descriptive/normative about language; the play shows the *political cost*.
      *   *The Ring Plot:* This reinforces the instability of rules. A vow ("I will never lose this ring") is reinterpreted by the person with power (Portia). The meaning of the vow changes based on who is enforcing it. This mirrors the "quus" shift.
      *   *Mercy vs. Letter:* Portia's mercy speech is the "philosophical ideal" (go beyond the rule), but her legal trap is the "skeptical reality" (rules are what we enforce). The hypocrisy highlights that "mercy" is also a move in the language game, not a transcendence of it.

