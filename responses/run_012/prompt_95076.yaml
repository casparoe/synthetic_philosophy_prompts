      *   *Check:* Did I address the "quus" analogy? Yes, Shylock is the quus-follower (or rather, the plus-follower in a world that switches to quus). Actually, wait. Shylock wants "plus" (strict addition of penalty). The Court switches to "quus" (penalty applies only if no blood is shed). The Court changes the rule mid-game.
      *   *Refinement on the "Vote":* It's not a democracy. It's a hegemony. Kripke's "community" sounds cozy; Venice's community is coercive. This is the key insight.
