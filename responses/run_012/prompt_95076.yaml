  2.  **Deconstruct the Philosophy (Kripke/Wittgenstein):**
      *   *The Paradox:* No fact about an individual (past behavior, mental state) determines whether they meant "plus" or "quus." Meaning is not an internal state.
      *   *The Skeptical Solution:* We stop looking for truth conditions (what *makes* it right) and look at assertibility conditions (when are we *allowed* to say it's right). It's about community practice, agreement, and correction. It's not a "vote" in a democratic sense, but a shared form of life.
      *   *The Worry:* If correctness is just agreement, might makes right. If the community agrees on a deviant reading, is it "correct"?

  3.  **Deconstruct the Play (*The Merchant of Venice*):**
      *   *The Bond:* A contract. Shylock reads it literally (flesh, no blood mentioned).
      *   *Portia's Move:* She accepts the literal reading initially but adds a constraint (no blood) that wasn't explicitly there but is implied by Venetian law/biology.
      *   *The Mercy Speech:* Argues for equity over law, then immediately pivots to strict legalism to trap Shylock.
      *   *The Ring Plot:* Bassanio gives away a ring sworn to keep. Portia (disguised) demands it. Later, she uses the giving of the ring to assert dominance/control over the marital vow.
