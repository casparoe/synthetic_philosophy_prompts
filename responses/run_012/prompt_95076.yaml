      *   *Section 3: The Ring Plot.* This is crucial. It shows the rule-following isn't just about law, but intimacy. The vow is unstable. Portia controls the interpretation. This extends the "community" to the "marriage," showing power dynamics in meaning-making.
      *   *Section 4: Where the Play Resists.* Kripke is usually seen as benign (how do we communicate?). The play shows it's lethal. Also, Shylock isn't just a skeptic; he's a victim. The play demands an ethical judgment Kripke avoids. The play suggests the "skeptical solution" can be tyrannical.
