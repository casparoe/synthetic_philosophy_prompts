      *   If the novel is about *failed* reform, is it trying to inspire (Monumental: "They tried, so can we") or condemn (Critical: "Look how broken it was, so we must change")? Usually, historical novels function Monumentally: they create heroes or tragic figures that stand as monuments. Even failures can be monumental (tragic heroes).
      *   *Decision:* It is Monumental. All narrative history that seeks meaning is Monumental. Antiquarian is archive; Critical is iconoclasm. Novels build images.
      *   *Is it a fault?* No, it's the medium. The fault is only in claiming objectivity.

  5.  **Drafting the Content (incorporating American English):**
