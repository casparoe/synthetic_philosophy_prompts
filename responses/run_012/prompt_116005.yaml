  The Minister defends the 'Optimal Allocation Protocol', a black-box algorithmic welfare system that dynamically adjusts taxes and benefits to mathematically maximise the income and wealth of the least advantaged, surpassing any transparent alternative; to construct this case, I am explicitly extending the Original Position to treat the **Publicity Condition** not merely as a feature of constitutional essentials but as a strict lexical constraint on all basic structure policies, defending this by arguing that without it, the parties cannot assess the stability of the agreement. Behind the veil, ignorant of their position but aware of general sociological laws, the parties reject the Protocol despite its material superiority because its opacity prevents citizens from knowing whether they are being treated as free and equal, thereby rendering the agreement unstable.

  **Reasoning on Both Sides**
  The Minister's verdict relies on a mechanical application of the Difference Principle: since the Protocol yields the highest possible index of income and wealth for the worst-off, it is justified. The reasoning is consequentialist regarding the primary goods index; if the floor is raised, the inequality is permissible. Conversely, the parties' verdict relies on the **formal constraints of the concept of right**, specifically Publicity. Their reasoning is that a principle cannot be chosen if its operation cannot be publicly understood and affirmed by all citizens. If the mechanism of justice is unintelligible, citizens cannot verify their status as free and equal cooperators, which undermines the social bases of self-respect and violates the Strains of Commitment, regardless of the income payout.

  **The Feature Doing the Work**
  The single feature doing the work is the **Publicity Condition** acting as a lexical prior to the Difference Principle. If this feature is removed—if the parties are permitted to choose principles that need not be publicly intelligible—the Protocol is accepted, as it satisfies the maximin criterion for material primary goods.

  **Strongest Rawlsian Reply**
  The strongest reply available to a Rawlsian is that the Minister has committed a category error: the Difference Principle is not a standalone maximisation rule but is embedded within a system of principles that must satisfy the Publicity Condition to be valid. Therefore, a policy that violates Publicity cannot 'satisfy' the Difference Principle in the first place, because it fails the prior conditions of the Original Position. This reply **succeeds** in demonstrating that the Minister's defence is philosophically incoherent, as it attempts to isolate the outcome of the principle from the procedural constraints required for its legitimacy.

  **Settled vs. Contested Ground**
  It is **settled** among Rawls scholars that the Publicity Condition is one of the formal constraints of the Original Position in *A Theory of Justice*. However, it is **contested** whether this condition applies with equal strictness to specific administrative policies (like tax algorithms) as it does to constitutional essentials, with some critics arguing that technical complexity necessitates a degree of opacity that Rawls's strict publicity cannot accommodate.
