answer: |-
  ### The Satisficing Hiring Protocol

  This procedure is based on Herbert Simon's theory of **bounded rationality**. It assumes you cannot know the quality of every possible candidate (optimizing) because search is costly and information is incomplete. Instead, you define what "good enough" looks like (satisficing) and stop searching the moment you find it.

  **Core Distinction:**
  *   **Optimizing:** Attempts to find the *best* candidate by comparing all options. Requires knowing the future pool.
  *   **Satisficing:** Attempts to find the *first* candidate who meets a threshold. Requires only knowing your needs.
  *   **Stopping Rule:** The condition under which you cease search (e.g., "Candidate meets aspiration").
  *   **Choice Rule:** The selection made from the available set (e.g., "Pick the one who met the threshold"). In strict satisficing, the stopping rule *is* the choice rule.

  ---

  ### Part 1: The Procedure

  Run these steps in order. Do not skip to Step 5 unless Step 4 triggers it.

  #### Step 1: Set the Aspiration Level (The Floor)
  Before posting the role, define the **Minimum Viable Candidate (MVC)**. This is not your wish list; it is the threshold below which a hire creates more cost than value.
  *   **Action:** List 3–5 binary criteria. Avoid scales (1–10). Use Yes/No.
  *   **Sufficient Answer:** A checklist where "No" on any item is an automatic rejection.
  *   **How to Set It:** Calculate the **Cost of Failure**. If a bad hire costs one year of salary, your MVC must exclude anyone with a >50% probability of failure.
      *   *Example:* "Can manage budget" (Yes/No), "References verify reliability" (Yes/No), "Available within 30 days" (Yes/No).
  *   **Values vs. Facts:** This step is a **value judgment**. You must decide how much risk the organization can tolerate. The procedure cannot calculate risk tolerance for you.

  #### Step 2: Sequential Search & Screen
  Process applications as they arrive (stream), not in batches.
  *   **Action:** Compare each candidate *only* against the MVC checklist from Step 1. Do not compare Candidate A to Candidate B.
  *   **Sufficient Answer:** A binary determination: "Meets MVC" or "Does Not Meet MVC."
  *   **Stop Condition (No):** If "Does Not Meet MVC," reject immediately. Add to "Silver Medalist" file *only* if they failed on only one non-fatal criterion (e.g., salary timing, not competence).
  *   **Stop Condition (Yes):** If "Meets MVC," proceed to Step 3.

  #### Step 3: The Verification Window
  Before making an offer, verify the MVC claims. This is where "on paper" becomes reality.
  *   **Action:** Conduct interviews and reference checks specifically designed to falsify the MVC criteria.
  *   **Sufficient Answer:** Confirmation that the binary criteria still hold true.
  *   **Stop Condition (Yes):** Criteria verified. **Make Offer.** End search.
  *   **Stop Condition (No):** Criteria falsified (e.g., reference reveals reliability issue). Reject. Return to Step 2.

  #### Step 4: Calibrate the Aspiration Level
  If search duration exceeds your cost budget (e.g., 4 weeks or 60 hours of search time), you must adjust the MVC.
  *   **Action:** Review the reasons for rejection in Step 2.
  *   **How to Update:**
      *   *If rejections are due to "Nice-to-Haves":* You set the bar too high. Remove one binary criterion from the MVC.
      *   *If rejections are due to "Must-Haves":* The pool is genuinely weak. Do **not** lower the bar. Instead, pause search (see Step 5).
  *   **Miscalibration vs. Bad Pool:**
      *   *Miscalibration:* You are rejecting candidates who succeed in similar roles elsewhere. (Solution: Lower aspiration).
      *   *Bad Pool:* You are rejecting candidates who would objectively fail the job. (Solution: Keep aspiration, widen sourcing).
  *   **Search Cost Changes:** If your available hours drop (e.g., from 15 to 5), you must lower the aspiration level immediately. High search cost demands lower standards to prevent vacancy costs from exceeding bad hire costs.

  #### Step 5: The Silver Medalist Recall
  This step breaks the sequential assumption. It is only triggered if Step 4 indicates a "Bad Pool" and you have paused the search.
  *   **Action:** Review the "Silver Medalist" file.
  *   **Choice Rule:** Select the candidate who failed the previous MVC on the *most adjustable* criterion (e.g., salary timing vs. skill deficit).
  *   **Stop Condition:** If a silver medalist can now meet the *current* MVC, hire them. If not, continue search or leave vacant.
  *   **Constraint:** Do not re-evaluate their entire profile. Only check the specific criterion that previously disqualified them.

  ---

  ### Part 2: Running the Cases

  Here is how the protocol applies to your specific scenarios.

  #### Case 1: The Early Applicant (Gap & Lukewarm References)
  *   **Status:** Clears the bar on paper (Step 2 = Yes). Enters Verification Window (Step 3).
  *   **Analysis:** Your MVC includes "References verify reliability." Lukewarm references constitute a failure of verification.
  *   **Procedure Output:** **Do Not Hire.** The candidate has *not* cleared the bar. The bar includes verified competence, not just claimed competence.
  *   **Action:** Reject. Continue search.
  *   **Why:** Satisficing requires the threshold to be *met*, not just approached. A lukewarm reference introduces uncertainty that violates the "Cost of Failure" calculation in Step 1.

  #### Case 2: The Drought (Mediocre Pool)
  *   **Status:** Search cost is rising (4+ weeks). No candidates meet MVC.
  *   **Analysis:** You feel pressure to lower the bar.
  *   **Procedure Output:** **Lower the Bar on Preferences, Not Safety.**
      *   If the mediocrity is in "Years of Experience" (a proxy), drop that criterion.
      *   If the mediocrity is in "Core Competency" (the actual skill), **Stop Search.** Leave the role vacant.
  *   **Unpopular Truth:** If the pool cannot meet the minimum safety threshold derived from the "Cost of Bad Hire," the procedure instructs you to **not hire**. A vacancy is cheaper than a bad hire.
  *   **Action:** Pause search. Engage Silver Medalists (Step 5) or widen sourcing. Do not hire a mediocre candidate who fails the MVC.

  #### Case 3: The Outstanding Mismatch (Strongest Candidate, Wrong Profile)
  *   **Status:** Candidate is brilliant but lacks a specific MVC criterion (e.g., specific nonprofit experience, when you asked for it).
  *   **Analysis:** She does not clear the stated aspiration level. However, she is objectively stronger than those who do.
  *   **Procedure Output:** **Reject.**
  *   **Why:** This is the hardest pill to swallow. Satisficing is not about finding the *best*; it is about finding the *adequate*. If you hire her, you are **optimizing**, not satisficing. You are betting that her excellence on unweighted dimensions outweighs her failure on weighted ones.
  *   **The Override:** To hire her, you must formally **Revise the Aspiration Level (Step 4)** *before* making the offer. You must admit your original MVC was wrong.
  *   **Risk:** If you revise the bar *for her*, you introduce bias. You are no longer running a procedure; you are making a value judgment. The procedure says "No." You must personally say "Yes" and accept the risk that you have broken the protocol.

  ---

  ### Part 3: Limitations and Honesty

  You asked for honesty about where this procedure fails or disguises judgment as process.

  **1. Can the procedure instruct you to keep searching past a candidate who has cleared the bar?**
  **No.** Strictly speaking, if a candidate meets the Aspiration Level (Step 1) and passes Verification (Step 3), the stopping rule dictates you hire.
  *   If you continue searching, you are no longer satisficing. You are **optimizing** (hoping for a better match).
  *   Is this a failure of the procedure? **No, it is a feature.** Satisficing trades potential upside for search cost savings. If you search past a "good enough" candidate, you incur the cost of search with no guarantee of improvement.
  *   *Exception:* You may only continue searching if you determine *retroactively* that your Aspiration Level was set too low (Step 4 Miscalibration). But you must apply that new, higher bar to *future* candidates, not just hold out for a "better" one while keeping the old bar.

  **2. Judgment Calls Dressed as Procedure**
  *   **Setting the Aspiration Level (Step 1):** This is pure value judgment. The procedure cannot tell you if a two-year gap is a dealbreaker. You must decide that based on your risk tolerance. The procedure only enforces consistency once you decide.
  *   **Calibration (Step 4):** Deciding whether the pool is "bad" or your bar is "high" is subjective. The procedure tells you *how* to adjust, not *when* you are objectively right.
  *   **Silver Medalists (Step 5):** Deciding which disqualifying factor is "adjustable" is a judgment call.

  **3. What the Procedure Cannot Do**
  *   **It cannot predict regret.** If you hire a satisficing candidate and later see a "perfect" one, the procedure offers no comfort. It optimized for time and risk, not for perfection.
  *   **It cannot handle value conflicts.** If the Board values "Prestige" (Optimizing) and you value "Stability" (Satisficing), this procedure will conflict with Board expectations. You must align on the Aspiration Level before starting.
  *   **It cannot force a hire.** If the pool is below the MVC, the procedure results in a vacancy. If your organization cannot tolerate a vacancy, your MVC was set incorrectly relative to your operational reality.

  ### Summary of Decision Logic

  | Scenario | Procedure Instruction | Rationale |
  | :--- | :--- | :--- |
  | **Candidate meets MVC** | **Hire Immediately** | Stopping rule triggered. Search costs saved. |
  | **Candidate fails MVC** | **Reject Immediately** | Choice rule. Do not invest further search time. |
  | **Pool fails MVC (Drought)** | **Lower Bar or Vacate** | Adjust aspiration or accept vacancy cost. Do not hire risk. |
  | **Candidate > MVC (Star)** | **Hire** | Meets threshold. Extra quality is irrelevant bonus. |
  | **Candidate < MVC (Star)** | **Reject** | Fails threshold. Hiring is optimizing, not satisficing. |
  | **Search Cost Rises** | **Lower MVC** | High search cost reduces net value of hire. |

  **Final Warning:** The greatest risk to this procedure is you. When you find a candidate who meets the bar, you will feel a urge to "see who else is out there." That is the optimizing instinct. If you act on it, you have abandoned satisficing. You must trust the bar you set in Step 1. If you don't trust it, fix Step 1, but do not ignore Step 3.
