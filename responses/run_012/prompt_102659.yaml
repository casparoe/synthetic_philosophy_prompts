      *   Unpopular outcome? Yes (Case 3 rejection or Case 2 vacancy). I'll make Case 3 the rejection because it highlights the "Good enough vs. Best" tension best.
      *   Honesty about limitations? Yes.

  10. **Writing Tone:** Professional, direct, operational, theoretically grounded but practical. Avoid fluff.

