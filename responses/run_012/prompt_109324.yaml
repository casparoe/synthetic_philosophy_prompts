          2.  End-words have puns based on grammatical gender (untranslatable to English directly).
          3.  Acrostic (initial letters spell a name).
      *   **The Conflict:**
          *   Candidate Translation 1 (A's side): Preserves repeated end-word pattern, sacrifices puns and acrostic.
          *   Candidate Translation 2 (B's side): Preserves puns/acrostic (or a combination for effect), sacrifices the strict end-word pattern.
          *   Argument A: End-word pattern is *constitutive*; without it, it's not the same work. Prioritizing effect makes the original instrumental/paraphrase.
          *   Argument B: All are formal features; prioritize overall effect (surprise, closure, music). A's view makes translation impossible (fetishizes original). A's view is rigid; B's view isn't "anything goes."
      *   **Requirements:**
          *   Adjudicate move by move.
          *   Rate each move (Clearly Mistaken -> Defensible/Overstated -> Clearly Right).
          *   Justify ratings.
