answer: |-
  There is no single, established English noun that perfectly captures this specific cluster of feelings and social dynamics. You have identified a gap in the vocabulary of creativity.

  The closest existing concepts come from the sociology of science, but they are too institutional for your description. In science, this is **"Priority."** (Who published first gets the credit.) If it's malicious, it's **"Scooping."** If it's historical, it's **"Multiple Discovery"** (Newton/Leibniz, Darwin/Wallace).

  But those terms describe the *event*, not the *felt ownership*. They don't capture the quiet sting of a dinner conversation idea becoming someone else's "framework" three months later. They don't capture the paradox that you can give the idea away freely, but you cannot give away the *credit* for having had it first.

  Since there is no name, I will coin one for you. The term for this cluster is **"Phantom Propriety."**

  Here is the carving. Here is what Phantom Propriety is, and precisely how it differs from the things it resembles.

  ### 1. The Coinage: Phantom Propriety
  **Definition:** The felt sense of ownership over an idea that has not been fixed in a tangible medium, which vanishes or transfers to another upon their independent articulation of that idea, despite the absence of legal infringement or malicious intent.

  **The Three Components:**
  1.  **Latency:** The idea existed in your head or in casual speech (the "ghost").
  2.  **Fixation:** The idea became "real" only when someone else did the work of articulation (the "property").
  3.  **Dispossession:** The social transfer of credit follows the fixation, not the latency, leaving the originator with a sense of loss that has no legal recourse.

  ### 2. The Carving: What It Is Not
  You asked to distinguish this from the nearby concepts. Here are the edges.

  **Vs. Plagiarism**
  *   **Plagiarism** is theft of *expression*. It requires access and copying. It is a moral/legal breach.
  *   **Phantom Propriety** is loss of *priority*. It requires no access (independent discovery is common). It is a social norm, not a breach.
  *   *The Edge:* If they copied your notes, it's plagiarism. If they thought of it themselves after you mentioned it vaguely (or didn't mention it at all), it's Phantom Propriety.

  **Vs. Intellectual Property (Copyright/Patent)**
  *   **IP** is a legal monopoly granted by the state. It protects *execution* (copyright) or *utility* (patent). It explicitly excludes ideas.
  *   **Phantom Propriety** is a social currency. It exists entirely outside the law. In fact, it exists *because* the law refuses to protect ideas.
  *   *The Edge:* IP is about money and control. Phantom Propriety is about reputation and identity. You can have Phantom Propriety over an idea that makes zero dollars.

  **Vs. Moral Rights (Droit Moral)**
  *   **Moral Rights** (strong in Europe, weak in the US) give an author the right to be identified as the creator of a *work*.
  *   **Phantom Propriety** applies to *pre-works*. It is the claim to the seed, not the tree. Moral rights kick in once the work exists; Phantom Propriety dies the moment the work exists (if you didn't make it).
  *   *The Edge:* Moral rights protect the artifact. Phantom Propriety mourns the un-articulated thought.

  **Vs. The Labor-Mixing Theory (Locke)**
  *   **Labor-Mixing** suggests you own what you mix your labor with.
  *   **Phantom Propriety** reveals a harsh social truth: *Mental* labor doesn't count. Only *Articulation* labor counts. The second person mixed their labor with the "commons" of the idea and claimed it.
  *   *The Edge:* Locke would say you owned it when you thought it. Society says you own it only when you wrote it. Phantom Propriety is the friction between those two truths.

  **Vs. The Matthew Effect**
  *   **The Matthew Effect** ("The rich get richer") explains why a famous person gets credit for an idea a nobody had. It is about *status amplification*.
  *   **Phantom Propriety** happens even between peers. It is about *timing and fixation*, not status.
  *   *The Edge:* If a famous professor steals credit from a grad student, that's Matthew Effect. If two friends talk, and one writes it down first and gets the credit, that's Phantom Propriety.

  **Vs. The Idea/Expression Dichotomy**
  *   **Idea/Expression** is a legal doctrine stating copyright protects the expression, not the underlying idea.
  *   **Phantom Propriety** is the *psychological cost* of that doctrine. It is the human experience of the Idea/Expression line.
  *   *The Edge:* The Dichotomy is the rule. Phantom Propriety is the wound the rule inflicts.

  ### 3. The Mechanism: Why Credit is Inalienable
  You noted: *"You can give an idea away... but you can't give away the credit for it."*

  This is the core of Phantom Propriety. Credit is not a token you hand over; it is a historical record of *who fixed the idea in reality.*

  When you tell an idea to a friend, you are giving them the *content*. You are not giving them the *history of your mind.* When they articulate it, they create a new historical fact: *"Person B wrote this."* That fact overwrites the previous historical fact: *"Person A thought this."*

  Society values the **Artifact** over the **Genesis**.
  *   **Genesis** is private, unverifiable, and cheap (ideas are abundant).
  *   **Artifact** is public, verifiable, and expensive (execution is scarce).

  Phantom Propriety hurts most when the stakes are low because that is when the **Artifact** is smallest. If someone writes a bestseller based on your bar napkin sketch, you can sue or negotiate (IP). If someone writes a blog post based on your bar conversation, there is no money to fight over, so all that remains is the pure, uncut feeling of being erased.

  ### 4. Summary of the Cluster
  If you need to name this in the wild, use **Phantom Propriety**.

  *   **It counts as Phantom Propriety when:**
      *   The idea was verbal or mental only.
      *   The second person did the work of articulation/fixation.
      *   There is no legal recourse (no NDA, no copyright).
      *   The primary loss is status/credit, not revenue.

  *   **It does NOT count when:**
      *   They copied your words (Plagiarism).
      *   They stole a prototype (IP Theft).
      *   You publicly published it first and they ignored it (then it's just Ignorance).

  ### 5. Why It Bugs You
  It bugs you because it highlights a dissonance in how we value human contribution. We like to believe we live in a meritocracy of *insight* (the person who saw it first). But we actually live in a meritocracy of *labor* (the person who built it first).

  Phantom Propriety is the tax you pay for living in the second world while believing you live in the first. The credit attaches to the person who crossed the **Articulation Threshold**. Until you cross it, you are merely a tenant in the idea. The moment someone else builds the house, they own the address.

  You aren't being robbed. You're being **out-architected.** But it feels like robbery because the idea felt like part of your body before it was part of the world. Phantom Propriety is the phantom limb pain of an idea that was amputated by someone else's pen.
