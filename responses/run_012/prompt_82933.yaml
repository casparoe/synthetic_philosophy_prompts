answer: |-
  The kitchen table was laminate, faux-wood grain peeling at the corners where the heat from the coffee mug had lifted the veneer. Elena sat with the source text pinned under a magnet shaped like a lemon. Outside, the rain was a steady, gray sheet against the window, blurring the streetlights into smears of sodium orange. It was 2:00 AM. The deadline was 9:00 AM. The recipient was a woman who would not wake up to read it.

  Elena rubbed her thumb over the ceramic. *Her thumb found the chip in the mug's rim.* It was a small jagged absence, a bite taken out of the white glaze. She did it without looking. It grounded her.

  The source poem was four lines. It came from a dialect spoken in a valley that didn't appear on most tourist maps, a language of shepherds and stone walls. The client, a friend from grad school named Marcus, had found it in his grandmother's prayer book. He needed it for the program. He needed it to be English. He needed it to be true.

  She had written the skeleton on a yellow sticky note and stuck it to the fridge.

  *   **Four lines.**
  *   **Seven syllables per line.**
  *   **Rhyme scheme: A-B-A-B.**
  *   **Constraint: The word "Light" (or equivalent) must end lines 2 and 4.**

  She looked at the literal gloss she'd typed out an hour ago, the meaning stripped of its music, naked and shivering.

  *Line 1: The shadow eats the wall.*
  *Line 2: I wait for the Light.*
  *Line 3: Your hand is cold now.*
  *Line 4: I wait for the Light.*

  It was a vigil. A promise made to someone dying in the dark.

  Elena picked up her pen. She needed a version that kept the bones intact. If Marcus wanted the form, she would give him the form. She started with line one. *The shadow eats the wall.* Six syllables. She needed seven. *The shadow eats the white wall.* Seven. But "white" wasn't in the source. The source just said "wall." Adding "white" was an intrusion. *The shadow eats the stone wall.* Seven. Stone was accurate to the valley.

  *The shadow eats the stone wall,*
  *I wait here for the Light.*
  *Your hand is cold in the hall,*
  *I wait here for the Light.*

  She read it aloud. The rhythm was a limp march. *Da-DUM da-DUM da-DUM da.* Iambic, mostly. "In the hall" was a lie; the source didn't say hall. It was inserted purely to rhyme with "wall." "Here" was inserted in line two and four to pad the syllable count. It was accurate. It was a lie. It scanned perfectly. It sounded like a greeting card found in a dumpster.

  She stared at the paper. The ink was still wet, shining under the kitchen bulb. This version satisfied the contract. It kept the seven beats. It kept the rhymes. It kept the refrain. It preserved the cage. But the bird was dead inside it.

  *Her thumb found the chip in the mug's rim.* The coffee was cold now, a slick of oil on the surface.

  She crumpled the paper. The sound was loud in the quiet apartment.

  If she was going to send this to a grieving son, it had to breathe. It had to sound like something a human being would say when the lights were out. She turned to a fresh sheet. She forgot the syllable count. She forgot the rhyme. She looked at the gloss. *Shadow eats wall. Wait for light. Hand cold. Wait for light.*

  What was the emotion? It wasn't about the wall. It was about the encroachment. It wasn't about the hand. It was about the separation.

  *Darkness swallows the room,*
  *I am waiting for the dawn.*
  *Your hand is cold in the gloom,*
  *But the night is almost gone.*

  She read it. It flowed. "Darkness swallows" was stronger than "shadow eats." "Dawn" was a better promise than "Light." "Gloom" rhymed with "room," keeping a ghost of the music. It was beautiful. It was English poetry.

  It was also a betrayal.

  She had changed "Light" to "Dawn." Light was static; Dawn was a process. The original poem wasn't hoping for the sun to rise. It was hoping for a specific illumination that might not come. She had smoothed the jagged edge of the waiting. She had removed the repetition of "Light." In the original, saying "Light" twice was an incantation. Saying it once was a statement. Saying it twice was a plea. By varying the end words, she had told Marcus that his grandmother's hope was flexible. It wasn't.

  She put the pen down. Her hands were shaking slightly. This version was the one she would want on her own wall. It was the one that made her feel like a poet. It was the one that made her feel like a fraud.

  The refrigerator hummed, a low electric drone that seemed to vibrate in the fillings of her teeth. She ignored it. She needed to understand why the constraint was there. Translators often thought constraints were decorations, things to be kept if possible and dropped if necessary. Like trim on a house.

  She looked at the sticky note on the fridge. *Constraint: The word "Light" must end lines 2 and 4.*

  Why? Why not rhyme A-B-C-B? Why repeat the word?

  She tried to write a version without the repetition, just to see how it felt.

  *The shadow takes the wall,*
  *I wait for the morning light.*
  *I feel your hand fall,*
  *I pray we see the light.*

  It felt scattered. The first "light" was specific. The second "light" was metaphorical. The original used the same word. *Lumina.* Same sound. Same weight.

  She closed her eyes. She imagined the woman in the valley, centuries ago. She isn't writing a poem. She is sitting by a bed. The oil lamp is low. She says the same thing twice because she doesn't know what else to say. The repetition isn't a rhyme scheme. It's a stutter. It's the mind hitting the same wall because there is no door.

  If she removed the repetition, she fixed the stutter. She made the woman coherent. But the woman wasn't coherent. She was afraid.

  *Her thumb found the chip in the mug's rim.* This time she pressed hard enough to feel the sharp edge bite into the skin. Pain was a datum.

  She needed a third version. One that kept the constraint but didn't sound like the first one. One that kept the beauty but didn't lie like the second.

  She took a new sheet. She kept the seven syllables. She kept the rhyme. But she changed the vocabulary to be sharper, less poetic. Less "gloom," more "cold."

  *Shadow eats the plaster,*
  *I wait still for the Light.*
  *Your hand is cold, faster,*
  *I wait still for the Light.*

  "Faster" was wrong. The hand wasn't getting cold faster. It was just cold. She crossed it out.

  *Shadow eats the plaster,*
  *I wait still for the Light.*
  *Your hand grows cold, faster,*
  *I wait still for the Light.*

  No. She was forcing the rhyme again. "Plaster" and "Faster." It was the same problem as "Wall" and "Hall." The rhyme was driving the meaning.

  She stopped. She looked at the constraint again. *Seven syllables.*

  Was the syllable count the decoration? Or was the refrain?

  In the first version, the syllable count made it robotic. In the second version, dropping the count made it flow but lost the tension. The tension came from the restriction. The woman had only so much breath. She had only so much time.

  Elena wrote a new line one. *The dark is on the wall.* Six syllables. *The dark is on the stone wall.* Seven.
  Line two: *I wait for the Light.* Five syllables. She needed two more. *I wait here for the Light.* Seven.
  Line three: *Your hand is cold now.* Five syllables. *Your hand is so cold now.* Six. *Your hand is cold just now.* Seven. "Just now" implied recentness. The source implied state. *Your hand is cold, I vow.* Seven. Rhymes with "now"? No, needs to rhyme with "wall."
  *Your hand is cold as stone.* Seven. Rhymes with "stone" in line one? No, line one was "wall."
  She was tangling herself.

  She wiped the paper with her palm, smudging the ink.

  The constraint wasn't the syllables. The constraint was the return. The poem claims that nothing changes except the cold. The wall is eaten. The hand is cold. But the waiting is constant. The refrain *is* the meaning. If she changed the word "Light" to "Dawn," she implied progress. If she kept "Light," she implied stasis.

  She had to keep the word. She had to keep the return. She could sacrifice the syllable count. She could sacrifice the rhyme between lines 1 and 3. But she could not sacrifice the return of the Light.

  She started again. She didn't count on her fingers this time. She listened to the breath.

  *Shadow eats the wall.*
  *I wait for the Light.*
  *Hand cold. No call.*
  *I wait for the Light.*

  Line 1: 5 syllables.
  Line 2: 5 syllables.
  Line 3: 4 syllables.
  Line 4: 5 syllables.

  It was shorter. Starker. It kept the refrain. It kept the rhyme between 1 and 3 (Wall/Call). "No call" wasn't in the source. The source said "hand is cold." "No call" implied phone or voice. The source was tactile.

  *Shadow eats the wall.*
  *I wait for the Light.*
  *Hand cold. That is all.*
  *I wait for the Light.*

  "That is all." Six syllables total for the line. *Hand cold. That is all.* Five.
  *Your hand cold. That is all.* Six.
  *Hand is cold. That is all.* Six.

  She needed seven.
  *Your hand is cold. That is all.* Seven.

  She read it.
  *Shadow eats the wall.*
  *I wait for the Light.*
  *Your hand is cold. That is all.*
  *I wait for the Light.*

  It wasn't pretty. "That is all" was clumsy. It sounded like resignation, not poetry. But it felt true. It felt like someone who had run out of things to say and was saying the only thing left. It kept the refrain. It kept the syllable count mostly. It sacrificed the rhyme between 1 and 3 (Wall/All is a slant rhyme).

  She looked at the three papers spread out on the laminate.

  The first one was perfect and empty. A preserved insect in amber.
  The second one was beautiful and false. A wax flower.
  The third one was broken and honest. A stone with a crack in it.

  Marcus would want the second one. He would want to read it at the podium and feel moved. He would not want the clumsiness of the third. He would not want the deadness of the first.

  Elena stood up. Her knees popped. She walked to the sink and poured the cold coffee down the drain. The water swirled around the grounds, black and thick. She rinsed the mug. She dried it. She set it back on the table.

  *Her thumb found the chip in the mug's rim.* She traced the jagged edge. It was part of the mug now. You couldn't use the mug without feeling it. It defined how you held it. If you ignored it, it cut you. If you focused on it, you couldn't drink.

  She looked at the clock. 4:15 AM.

  She picked up the second version. The beautiful one. *Darkness swallows the room.* It was so easy to send. It would comfort him. It would do the job of a poem at a funeral, which is to smooth over the rough edges of death.

  She picked up the third version. *Shadow eats the wall.* It offered no comfort. It offered only presence. It said: *I am here, waiting, and nothing is changing.*

  She sat back down. She took a fresh sheet of paper. She wrote the title: *For M.*

  She copied the second version on the left side of the page. She copied the third version on the right side. She did not circle one. She did not cross out the other.

  She wrote an email to Marcus. *Attached are two options. Both are true. Both are lies. Choose the one you can live with.*

  She didn't send it. She saved it to drafts.

  She looked at the papers. The rain had stopped. The street outside was wet, reflecting the gray of the coming morning. There was no correct translation. There was only the choice of which loss she could bear. The loss of the beauty, or the loss of the form, or the loss of the truth.

  She left the papers on the table. She went to the window and watched the sky lighten. It wasn't dawn. It was just less dark.

  *Her thumb found the chip in the mug's rim.* She didn't move her thumb away. She let it rest there, feeling the break, while the sun came up over the roofs of the houses across the street, offering a light that had nothing to do with the poem.
