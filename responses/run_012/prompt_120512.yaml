answer: |-
  # Session Design: The Aethel Protocol

  **Setting:** One long table (18 people). Split the table into three clusters of six (Left, Centre, Right).
  **Time:** 90 minutes strict.
  **Materials:** Printed timeline strips, "Five Doors" scorecards, Role badges, blank index cards, pens.

  ## 1. The Fictional Country & Timeline
  **Country:** The Republic of Aethel.
  **Context:** A stable state for 50 years, now 15 years into a new governing coalition.
  **The Timeline (12 Events):** Print these on a single strip, one per year.

  1.  **Year 1:** Civil Service Efficiency Act introduced to reduce bureaucracy.
  2.  **Year 2:** Public broadcaster budget reduced by 10%; redirected to digital platforms.
  3.  **Year 3:** Judicial retirement age lowered from 70 to 65 to "refresh the bench."
  4.  **Year 4:** Electoral Commission membership rebalanced to reflect parliamentary strength.
  5.  **Year 5:** Local council funding tied to national "performance metrics."
  6.  **Year 6:** New media licensing fees introduced for "spectrum management."
  7.  **Year 7:** Opposition rally permit denied due to "security concerns."
  8.  **Year 8:** Civil servants required to sign a loyalty affirmation to the Constitution.
  9.  **Year 9:** State advertising budget centralized to ensure "consistent messaging."
  10. **Year 10:** University accreditation board restructured to include industry leaders.
  11. **Year 11:** NGO foreign funding disclosure law passed for transparency.
  12. **Year 12:** Emergency powers extended for "economic stability."

  *Note: Every event is defensible as good governance or democratic erosion depending on interpretation.*

  ## 2. Rules & Materials (The Three Rounds)

  **Round 1: The Five Doors (20 mins)**
  *   **Task:** Each cluster scores the 12 events against your Five Doors (Elections, Courts, Newspapers, Civil Service, Town Govt).
  *   **Mechanic:** Mark each event as Open (Green), Closed (Red), or Unchanged (Yellow).
  *   **Verdict:** If 3+ doors show a trend of "Closing," declare "Backsliding." Otherwise, "Stable."
  *   **Goal:** Establish a baseline using your tool. Most will likely find backsliding.

  **Round 2: The Baseline Shift (20 mins)**
  *   **Task:** Keep the same timeline, but change the "Start Year."
      *   Left Cluster starts at Year 1.
      *   Centre Cluster starts at Year 6.
      *   Right Cluster starts at Year 10.
  *   **Mechanic:** Events prior to your Start Year are "History," not "Backsliding." Re-score only the events within your window.
  *   **Verdict:** Declare "Backsliding" or "Stable" based only on your window.
  *   **Goal:** Create disagreement. The Centre and Right clusters may find no backsliding because the "closing" happened before their clock started. This forces the question: *Was it ever democratic?*

  **Round 3: The Standing Test (25 mins)**
  *   **Task:** Assign roles within each cluster. Each person must argue the verdict from their perspective.
      *   *Roles:* Government Minister, Opposition Journalist, Rural Mayor, International Investor, Retired Judge, Ordinary Voter.
      *   *Constraint:* The Government Minister *must* argue the changes are improvements. If they refuse, the cluster cannot submit a verdict.
  *   **Mechanic:** After arguing, the cluster must vote on who has the **Standing** to make the final call. Is it the Voter? The Judge? The International Community?
  *   **Goal:** Shift from "What happened?" to "Who gets to say?"

  ## 3. The Discard & Rewrite (10 mins)
  *   **Action:** Collect all "Five Doors" scorecards. Put them in a pile at the end of the table.
  *   **Task:** Hand out blank index cards. Ask the group to write a new list of criteria for backsliding based on the last hour.
  *   **Constraint:** They cannot use the Five Doors. They must agree on one shared list for the whole room.
  *   **Goal:** They will struggle. They will realize any list is arbitrary. This breaks the authority of your tool.

  ## 4. The Debrief (10 mins)
  Do not lecture. Ask three questions, mapping them to the rounds:

  1.  **Round 1:** "Why did the scorecard feel like an answer key?" (Addresses: *What counts?*).
  2.  **Round 2:** "Did the country slide, or was it already tilted?" (Addresses: *Measured from when?*).
  3.  **Round 3:** "If the Voter and the Judge disagree, whose call stands?" (Addresses: *Decided by whom?*).

  **The awkward case:** Ask the Right Cluster (Year 10 start): "If the doors were closed before you arrived, is it still backsliding, or just a different system?"

  **The Final Question:** Pose this explicitly to the room: "Looking at the mess we just made: does the word 'backsliding' describe a real mechanical failure, or is it just a polite way of picking sides?"

  **Handling Real-World Drift:**
  In the last 10 minutes, people will mention Hungary or the US. Do not shut this down. Instead, say: "Take the Aethel label off that example. Does the mechanism we found in Aethel fit the country you're thinking of? If yes, the game worked. If no, the game broke." This validates their knowledge without letting specific politics hijack the mechanics.

  ## 5. What Will Go Wrong The First Time

  *   **Round 2 Collapse:** Participants will forget to ignore the early years. They will argue about Year 3 events while holding a Year 6 start card.
      *   *Fix:* Walk around with a red marker. Physically cross out the "history" events on their sheets if they try to score them.
  *   **The Refusal:** No one wants to play the Government Minister. It feels like apologizing for authoritarianism.
      *   *Fix:* Pre-assign the role on a name badge before they sit down. Tell them: "You are not defending tyranny; you are defending *order*. Your job is to explain why stability requires these changes." If they still refuse, you take the badge.
  *   **The Answer Key:** They will treat your Five Doors scorecard as the truth.
      *   *Fix:* In the intro, say: "This scorecard is broken. I know it is. Your job is to find the cracks."
  *   **The Dominant Voice:** One person (likely the most politically engaged) will dominate the Standing vote.
      *   *Fix:* Use a secret ballot for the Standing vote in Round 3.

  ## 6. What The Evening Cannot Do

  *   **Define Democracy:** The game cannot tell them what democracy *is*, only how it might change. You must explain from the front that "Backsliding" implies a slide *from* something, but the game does not define the starting point.
  *   **Remove Arbitrariness:** The game will make the judgment process look *more* arbitrary than it is in reality. In reality, norms and culture buffer these changes. In the game, it is just checking boxes. Acknowledge this: "In real life, there are guardrails we didn't simulate."
  *   **Solve the Irritation:** This session will not cure your irritation. It will likely validate it by showing how impossible the definition is. That is the point.

  Core moment: The room falls silent when they realize their new list of criteria is just as flawed as the one they threw away.
