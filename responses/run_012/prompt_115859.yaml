  ### Commentary on the choices made

  The pantoum's circular recursion mirrors the structure of moral trade: values are not merged but exchanged, returning to the speaker altered by the journey. By assigning Voice A (animals) to odd lines and Voice B (poor) to even lines, the form forces Voice A to speak Voice B's premises (lines 5, 7, 9, etc.) and Voice B to close with Voice A's opening (lines 18, 20). This enacts the trade mechanically; each speaker must literally voice the other's priority to proceed.

  The traded goods are the second and fourth lines of stanzas two and three ("I spare the field..." and "The nets are funded..."). When Voice B first speaks them, they are offers; when Voice A repeats them, they are acknowledgments of cost. The passive voice in "The nets are funded" allows the line to migrate without assigning false agency, preserving the logic that each bears a cost they rank lower than the gain.

  The final stanza shifts pronouns from "I/You" to "We/Our." This leaves the ending ambiguous: does the circular form imply they are back where they started, or has the repetition created a shared moral landscape ("Our scale") that didn't exist in stanza one? The tension between fidelity to the theory (constraints limit trade) and the form (lines must repeat) arose in stanza four. The theory requires distinct constraints, but the form demands repetition. I resolved this by splitting the constraint concept across lines 14 and 16, allowing the repetition in line 19 to emphasize the limit without halting the poem's flow.
