prompt: |-
  I teach the last meeting of an upper-level undergraduate seminar on evolution and culture: fourteen students enrolled, eleven or twelve usually in the room, ninety minutes, movable chairs, a whiteboard, no projector. By this point in the term they can recite the ingredients of natural selection — variation, heritable transmission, differential reproduction — and they are altogether too comfortable applying them to ideas; several have already told me, with a confidence I find suspicious, that culture obviously evolves in the same way. I would like the final session to make that confidence cost them something. Please design a game for the session whose rules, rather than my commentary, do the teaching. By the end they should have felt in their own choices that what wins in a population of competing ideas is whatever is cheapest to carry, easiest to remember, and most inclined to make whoever holds it pass it on — and that this can be an idea that is a genuine burden on the person who holds it. Keep the framing out of the rules: they should not be told in advance what the exercise is about. And please do not build me a demonstration of how messages get garbled in transmission; drift and distortion should be a byproduct of play, not the point of the exercise.

  Two structural demands, because I want the game to reach the parts of the analogy that are hard rather than the parts that are easy. First, the ideas should compete inside people and not only between them: whatever a participant can retain, remember, and act on should be limited, so that taking on one idea costs them another, and at least one of the items in circulation — slogans, habits, tunes, small rules, whichever is easiest to stage — should be costly to its carrier while still out-competing a cheaper and more obviously useful rival, with the participants able to reconstruct afterwards why it did. Second, arrange at least one moment in which a participant ends up holding something close to an idea they never received from anyone, so that in the debrief we can ask whether what looked like inheritance might have been convergence, and whether the game can tell the difference. Materials should be ordinary: index cards, tokens, a timer; no money, no phones, nothing that needs printing in colour.

  Give me the rules, the starting materials, and a round structure with timings that fit the ninety minutes, then a debrief that maps particular moments of the game onto the corresponding parts of the evolutionary analogy and names the places where the analogy strains. Tell me what will predictably go wrong the first time I run it — I am especially worried about a round in which everyone has converged on the same idea and the whole thing goes flat — and what I should do when it does. Be frank about which parts of the picture the game cannot reproduce and which I will therefore have to supply from the front of the room, and say what to do about the three or four students who will treat the exercise as a joke about the internet.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate seminar on evolution and culture. Last meeting (90 mins). 14 enrolled, 11-12 present. Movable chairs, whiteboard, no projector.
      *   **Student State:** Know natural selection ingredients (variation, heritability, differential reproduction). Too comfortable applying them to culture ("culture obviously evolves"). Instructor wants to challenge this confidence ("make that confidence cost them something").
      *   **Goal:** Design a game where *rules do the teaching*. Students should feel that what wins is cheap, memorable, transmissible, even if burdensome.
      *   **Constraints:**
          *   No advance framing (don't tell them it's about evolution).
          *   No "telephone game" (drift/distortion is a byproduct, not the point).
          *   **Structural Demand 1:** Ideas compete *inside* people (cognitive load/limits). Taking one idea costs another. At least one idea must be costly to the carrier but still out-compete useful rivals.
          *   **Structural Demand 2:** At least one moment of "convergence" (holding an idea never received), to question inheritance vs. convergence.
          *   **Materials:** Ordinary (index cards, tokens, timer). No money, phones, color printing.
      *   **Deliverables:** Rules, materials, round structure/timing, debrief (mapping to analogy + strains), predicted failures (convergence/flatness) + fixes, limitations of the game + instructor fill-in, handling skeptics/jokers.

  2.  **Deconstruct the Core Concepts:**

      *   *Variation:* Need different "ideas" (cards/rules).
      *   *Heritability/Transmission:* Mechanism for passing ideas between students.
      *   *Differential Reproduction:* Some ideas spread, some die.
      *   *Internal Competition:* Cognitive limit (can only hold $X$ ideas).
      *   *Costly Idea:* An idea that hurts the player but spreads well (e.g., a rule that makes you lose points but forces you to give the card to someone else).
      *   *Convergence:* Spontaneous generation of an idea similar to an existing one without direct transmission.

  3.  **Brainstorming the Game Mechanic:**

      *   *Idea:* A card game where players hold "Beliefs."
      *   *Transmission:* Trading or copying cards.
      *   *Selection:* Scoring mechanism.
      *   *Cognitive Limit:* Hand size limit.
      *   *Costly Idea:* A "Meme" that says "If you hold this, you lose 1 point per round, but you *must* pass it to someone who has fewer cards than you." This ensures spread despite cost.
      *   *Convergence:* Allow players to *write* new cards if they meet certain conditions, or have blank cards that get filled in. If two people write the same thing independently, that's convergence.
      *   *Refinement on Convergence:* It's hard to get exact text match. Better: A rule that says "If you have Idea A and Idea B, you generate Idea C." If multiple people have A+B, they all generate C independently. That's convergence.

  4.  **Developing the Game: "The Mind Market" (Working Title)**

      *   *Materials:* Index cards (pre-written and blank), tokens (points), timer.
      *   *Setup:* Students sit in a circle.
      *   *Hand Limit:* Max 3 cards. This forces internal competition.
      *   *Turns:* Rounds of interaction.
      *   *Transmission:* "Converse" phase. Talk to neighbors. Swap or copy cards.
      *   *Selection:* "Survival" phase. Points awarded/removed based on card combinations.
      *   *The "Virus" (Costly Idea):* A card called "The Burden." It gives negative points but forces the holder to give it away if possible.
      *   *The "Convergence" Mechanic:* A rule card that says "If you hold [X] and [Y], write [Z] on a blank card." If multiple people do this, [Z] arises independently.

  5.  **Refining for the Prompt's Specific Demands:**

      *   *Make confidence cost them:* The game needs to feel frustratingly rational. They should try to win points, but the "memes" should manipulate them into spreading things that hurt their score.
      *   *Internal Competition:* Strict hand limit (e.g., 3 cards). To pick up a new one, discard an old one.
      *   *Costly but Successful:* The "Burden" card needs to be highly transmissible. Maybe: "You lose 2 points. At the end of the round, you must give this card to a player with fewer cards than you. If no one has fewer, discard it." This makes it spread like wildfire until everyone has it, then it dies. Or better: "You lose 2 points. You gain 1 point for every other player holding this card." (Altruism/Group selection angle? No, keep it selfish). Let's go with: "You lose 5 points. But if you hold this, you may take a card from anyone." No, that's aggression.
      *   *Better Costly Idea:* "The Zeal." Text: "Score -3 points per round. If you discard this card, you lose 5 points immediately." This creates a "lock-in." Once you have it, you keep it. It out-competes useful cards because discarding them is too painful.
      *   *Convergence:* Need blank cards. Rule: "If you have two cards with the symbol [Star], write a new rule on a blank card." If the prompt is vague ("Write a rule about sharing"), people might write similar things.
      *   *Alternative Convergence:* Pre-print some cards that are functionally identical but worded differently. If players "synthesize" them, they realize they arrived at the same function.
