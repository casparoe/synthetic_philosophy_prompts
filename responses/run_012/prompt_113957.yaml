      Since 'Tool' cards are generic (e.g., "Gain 1 point"), students will likely write "Gain 2 points" or "Steal 1 point."
      If two students write "Steal 1 point" independently, we have convergence.

      *Revised Plan for Costly Idea:*
      Card Name: **"The Mission."**
      Text: "-5 Points per round. You must pass this card to a new player every round. If you cannot, lose 10 points."
      This makes it spread rapidly (players want to get rid of the penalty) but hurts the group score. It out-competes a "+2 Points" card because holding "+2" doesn't force you to keep it, but holding "The Mission" punishes you for keeping it, so you force it on others. Wait, if it punishes the holder, why does it win?
      *Evolutionary Logic:* It wins if it spreads, even if the host suffers.
      *Game Logic:* The "idea" wins if it is present in the room at the end. The *player* wins if they have points. This tension is key.
      *Correction:* The prompt says "what wins in a population... is whatever is cheapest to carry... and most inclined to make whoever holds it pass it on."
      So the *Idea's* success is prevalence. The *Player's* success is points.
      I need to make sure the students realize the *Idea* is the agent, not them.
      *Adjustment:* At the end, we count which *Card Text* is most common. That is the "winner." The students are just vessels.
      *Costly:* The card gives negative points to the holder.
      *Transmissible:* The card forces the holder to pass it.
      *Result:* The card becomes ubiquitous, even though everyone hates it.

  7.  **Addressing the "Flat Round" Worry:**
      *   If everyone converges on the same strategy early, the game stalls.
      *   *Fix:* Introduce "Environmental Shift." Halfway through, change the scoring rule. (e.g., "Now, having more than 2 cards loses points"). This forces variation again.

  8.  **Addressing the Skeptics:**
      *   They will say "This is just a game, not real culture."
      *   *Debrief Strategy:* Don't defend the game. Ask them to map the failure. "Where did the analogy break? That's where the theory needs work."

  9.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Rules (Minimal framing).
      *   10-50: Gameplay (4 Rounds x 10 mins).
      *   50-90: Debrief.

  10. **Refining the Materials:**
      *   Index cards (3x5).
      *   Markers.
      *   Tokens (poker chips or paper scraps) for points.
      *   Timer.

