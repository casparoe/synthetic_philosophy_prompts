answer: |-
  # Game Title: The Carrier

  ## Materials
  *   **Index Cards (3x5):** 100 total.
      *   60 Pre-written "Idea" cards (see *Deck Composition* below).
      *   10 Blank "Idea" cards.
      *   30 Blank "Token" cards (cut in half to save space, or just use small scraps of paper).
  *   **Pens/Markers:** 12.
  *   **Timer:** Visible to all (phone or watch).
  *   **Whiteboard:** For tracking round count and global score (optional).
  *   **Tokens:** 100 small objects (poker chips, bottle caps, folded paper) representing "Fitness Points."

  ## Deck Composition (Prepare in advance)
  Write the following text clearly on the index cards. Do not label them by type; shuffle them together into a single draw pile.

  *   **The Burden (5 cards):** "Cost: -2 Points per round. Rule: You MUST pass this card to a different player each round. If you cannot, lose 5 Points."
  *   **The Anchor (5 cards):** "Cost: -1 Point per round. Rule: You cannot discard this card voluntarily. You may only pass it if someone forces a swap."
  *   **The Bonus (15 cards):** "Benefit: +2 Points per round. Rule: No restrictions."
  *   **The Trader (15 cards):** "Benefit: 0 Points. Rule: Once per round, you may force a swap of one card with any neighbor."
  *   **The Generator (5 cards):** "Benefit: 0 Points. Rule: If you hold this AND a Blank Idea Card, write a new Rule on the Blank Card."
  *   **Blank Idea Cards (10 cards):** Empty text space.
  *   **Wildcards (15 cards):** "Benefit: +1 Point. Rule: This card changes meaning every round (decide among your group)."

  *Note: The total deck should be roughly 70 cards. You want a surplus so cards can be discarded without running out.*

  ## Setup (10 Minutes)
  1.  **Seating:** Arrange chairs in a large circle. Students should be close enough to pass cards easily.
  2.  **Framing:** Do not mention evolution, culture, or memes. Tell them: *"This is a resource management game. Your goal is to maximize your personal Fitness Points. You will hold 'Concepts' (cards). Concepts give points or impose rules. You have a cognitive limit: you can only hold 3 Concepts at a time."*
  3.  **Deal:** Deal 3 cards to each student. Deal 2 Tokens to each student. Place the remaining deck and tokens in the center.
  4.  **Hand Limit:** Emphasize: *"At no time may you hold more than 3 cards. To pick up a new one, you must discard one to the center pile."*

  ## Round Structure (40 Minutes Total)
  Play 4 Rounds. Each round is 10 minutes.

  **Phase 1: Interaction (6 Minutes)**
  *   Students stand and mingle.
  *   **Action:** They may trade cards 1-for-1 with anyone.
  *   **Action:** They may use "Trader" cards to force a swap.
  *   **Action:** If they hold "The Burden," they *must* pass it to someone who does not currently have it (if possible).
  *   **Action:** If they hold "The Generator" + "Blank," they write a new rule on the Blank card immediately. (Collect the Generator card in exchange; the new Custom Card stays in their hand).
  *   **Constraint:** They cannot show their point totals to each other.

  **Phase 2: Culling (2 Minutes)**
  *   Students return to seats.
  *   Check Hand Limit. If anyone has >3 cards, they must discard immediately.
  *   **The Mutation (Round 3 Only):** Announce: *"Environmental Shift. Turn one card in your hand face down. Rewrite its text. It is now a new Idea."* (This forces variation).

  **Phase 3: Scoring (2 Minutes)**
  *   Students calculate points based on cards held.
  *   Pay/Collect tokens from the bank.
  *   **Crucial Step:** Collect all cards from the students. Shuffle them. Do not let them see the global distribution yet.
  *   *Instructor Note:* Quickly tally how many of each *type* of card exist in the population (e.g., "How many 'Burden' cards are in play?"). Write this on the board. Do not tell them *who* holds them.

  ## The Debrief (40 Minutes)
  *Do not start the debrief by explaining the analogy. Ask questions.*

  **1. The Host vs. The Idea (10 Mins)**
  *   **Ask:** "Who won the most points?" (Identify the Winning Host).
  *   **Ask:** "Which Card Text was most common in the room at the end?" (Identify the Winning Idea).
  *   **Likely Outcome:** The Winning Host held "Bonus" cards. The Winning Idea was "The Burden" or "The Anchor."
  *   **Discussion:** "Why did 'The Burden' spread if it cost points?"
  *   **Lesson:** Differential reproduction of the *idea* is not the same as the fitness of the *host*. An idea that forces transmission (high fidelity, high rate) out-competes an idea that benefits the host but stays static.

  **2. Internal Competition (10 Mins)**
  *   **Ask:** "Show of hands: Who discarded a '+2 Point' card to pick up a new card this game?"
  *   **Ask:** "Why did you do it?" (Likely: "I was forced to by a Trader" or "I had to make room for a Burden someone gave me").
  *   **Lesson:** Cognitive limits (hand size) create competition *within* the mind. An idea doesn't need to be true or useful; it just needs to be harder to discard than the rival. "The Anchor" wins because it exploits the host's inability to let go.

  **3. Convergence vs. Inheritance (10 Mins)**
  *   **Ask:** "Look at the Custom Cards written on the Blanks." (Gather them).
  *   **Action:** Group similar texts together on the whiteboard.
  *   **Likely Outcome:** Two students who never traded will have written functionally identical rules (e.g., "Steal 1 point from left" or "Keep 3 cards").
  *   **Ask:** "Did Person A get this idea from Person B?" (If they didn't trade, the answer is no).
  *   **Lesson:** Similarity in a population does not prove common ancestry. It can prove *convergent evolution* due to similar selective pressures (the rules of the game). This strains the phylogenetic model of culture.

  **4. The Strain of the Analogy (10 Mins)**
  *   **Ask:** "Where did this game fail to match how culture works?"
  *   **Guide them to:**
      *   *Intentionality:* In the game, they tried to win points. In culture, do ideas manipulate us, or do we use ideas?
      *   *Fidelity:* Cards didn't change text (unless Mutated). Real ideas distort constantly.
      *   *Selection Level:* The game separated Host Fitness from Idea Fitness. In reality, if an idea kills the host too fast, the idea dies too (virulence trade-off).

  ## Predicted Failures & Fixes

  **1. The "Flat" Round (Convergence too early)**
  *   **Risk:** By Round 2, everyone realizes "The Burden" is bad and refuses to take it. Everyone hoards "Bonus." The population stagnates.
  *   **Fix:** In Round 3, introduce the **Environmental Shift** (The Mutation Rule described above). Force a change in the deck. If they are too rational, announce: *"New Rule: Any player holding 3 'Bonus' cards loses all points."* This punishes the optimal strategy and forces variation.

  **2. The "Jokers" (Students treating it as a joke)**
  *   **Risk:** 3-4 students write nonsense on Blank cards ("Eat the teacher") or refuse to trade seriously.
  *   **Response:** Do not police them during play. Use them in the debrief.
  *   **Debrief Move:** "Look at the Custom Cards. Some are strategic, some are noise. In cultural evolution, 'noise' is mutation. Did the nonsense cards spread? No? Why not? Because they lacked *transmissibility*." Turn their joke into data about selection filters.

  **3. The "Skeptics" (It's just a game)**
  *   **Risk:** "This doesn't prove culture evolves. It proves people follow rules."
  *   **Response:** Agree with them. "Exactly. The game is a model, not a reality. The value isn't that culture *is* this game. The value is seeing where the model breaks. If 'The Burden' didn't spread, the theory of 'selfish memes' would be falsified. It did spread. Why? What mechanism in the real world acts like 'The Anchor' card?"
  *   **Goal:** Move them from "This is silly" to "What is the real-world equivalent of the Hand Limit?"

  ## Instructor Notes: What You Must Supply
  The game cannot reproduce **Meaning**.
  *   **Limitation:** In the game, a card is just text. In culture, ideas have semantic weight. A student might hold a "Burden" card because they believe in the *truth* of the text, not just the mechanical rule.
  *   **Fill-in:** In the debrief, explicitly state: *"The game models the **vehicle** of culture, not the **content**. It explains why a catchy tune spreads, not why a religion provides comfort. You must add the psychological layer yourself."*

  The game cannot reproduce **Group Selection**.
  *   **Limitation:** The game rewards individual points. If a group cooperated, they could have suppressed "The Burden." They likely didn't.
  *   **Fill-in:** Ask: *"If you had been allowed to talk as a group before the game, could you have eradicated 'The Burden'?"* (Yes). *"Why didn't you?"* (No mechanism for group enforcement). This highlights that cultural evolution often lacks a "group mind" to steer it.

  ## Timing Summary
  *   **00:00 - 00:10:** Setup & Rules (Strictly mechanical).
  *   **00:10 - 00:20:** Round 1 (Exploration).
  *   **00:20 - 00:30:** Round 2 (Optimization).
  *   **00:30 - 00:40:** Round 3 (Mutation/Shift).
  *   **00:40 - 00:50:** Round 4 (Final Spread).
  *   **00:50 - 01:30:** Debrief (The core learning).

  ## Final Instruction to Instructor
  When they ask, "What was the point?" at the end, do not answer immediately. Ask them: *"Did you feel like you chose your ideas, or did the ideas choose you?"* Let the silence do the rest of the teaching.
