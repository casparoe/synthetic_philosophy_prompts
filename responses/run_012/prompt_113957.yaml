      During the game, I will introduce a rule: "If you have 3 cards, you may invent a new one."
      If someone invents "The Truth" (or close to it) without seeing my card, that's convergence.
      *Risk:* They won't invent it.
      *Better Risk:* I put two different cards in play that *imply* the same action. Card A: "Give a card to left." Card B: "Neighbor takes a card." Functionally identical. If players synthesize these into a new card "Pass Left," that is convergence on function.
      *Let's go with the Blank Card method.* It's the most robust. I will ensure there are more blank cards than "Instruction" cards that tell you what to write.

      *(Final Decision on Costly Idea)*:
      Card: **"The Martyr."**
      Effect: "-5 Points to holder. At end of round, you MUST give this to a player who has fewer cards than you. If you cannot, discard it."
      Why it wins: It actively seeks new hosts. A "+2 Point" card sits passively. "The Martyr" hunts. It will spread until everyone has 3 cards, then it dies. But during the spread, it dominates the population count.

