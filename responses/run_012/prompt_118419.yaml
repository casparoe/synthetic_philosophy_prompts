  **The Unborn Dead**

  The front page says the body is **real**,
  a name I almost **know**, printed in black.
  I scan the lines and wait to **weep**,
  but nothing there is personally **true**.
  There is no physical **ache** in my chest,
  just the weight of the news I **hold**.

  Then I pick up the novel I **hold**,
  where a girl dies who isn't **real**.
  Suddenly there is a sharp **ache**,
  though I **know** she was never born.
  Her loss feels heavier than **true**,
  and I have to stop to **weep**.

  Why do you **weep** for ink on a page?
  You **hold** a story, not a bone.
  Nothing I suffered is **true**,
  I have no blood, nothing **real**.
  You **know** I am only a shape,
  so why does your throat **ache**?

  Because the pain doesn't **ache** less
  when I allow myself to **weep**.
  I **know** the difference between worlds,
  but my hands still **hold** the spine.
  The fiction feels more **real**
  than the statistics claimed were **true**.

  Maybe belief isn't what makes it **true**,
  maybe the body learns to **ache**
  before the mind accepts the **real**.
  I dry my eyes, refuse to **weep**,
  but grief is something I **hold**
  regardless of what I **know**.

  I **know** the house was never built,
  yet the burning feels **true**.
  I cannot **hold** the logic tight,
  only the hollow **ache**.
  I want to stop the **weep**,
  but the death feels more **real**.

  I **know** it is not **real**,
  yet I **weep** what is **true**,
  this **ache** I **hold**—
