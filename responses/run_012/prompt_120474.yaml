      *   *Clarification on Computers:* Emphasize that computers process *explicit* data. Hayek argued the most important economic data is *implicit* (local, temporal, subjective).
      *   *Clarification on Lange:* Lange's model requires managers to follow rules. Why would they? If they lie about costs, the plan fails. This brings incentives back in, which the cousin tried to separate.

  5.  **Final Review against Constraints:**
