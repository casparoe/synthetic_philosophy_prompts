  ### 1. The Translation: Naive Set Theory $\to$ Naive Type Theory

  You want the naive comprehension story mapped directly into type-theoretic vocabulary, without smuggling in the stratification that usually prevents it. We will construct a **Naive Type Theory (NTT)** that mirrors **Naive Set Theory (NST)** as closely as the Curry-Howard correspondence allows.

  **The Dictionary:**
  *   **Set** $\mapsto$ **Type** ($A : \mathcal{U}$)
  *   **Membership** ($x \in S$) $\mapsto$ **Typing** ($x : A$)
  *   **Universe of all Sets** $\mapsto$ **Universe of all Types** ($\mathcal{U}$)
  *   **Comprehension** ($\{x \mid \phi(x)\}$) $\mapsto$ **Dependent Sum / Subtype** ($\Sigma_{x:A} P(x)$)
  *   **Negation** ($\neg \phi$) $\mapsto$ **Function to Empty** ($P \to \mathsf{0}$)
  *   **Contradiction** $\mapsto$ **Inhabitation of Empty** ($t : \mathsf{0}$)

  **The Setup (The "Naive" Assumption):**
  In NST, the paradox arises because the collection of all sets is itself a set. In TT, collections of types are Universes. To mirror NST faithfully, we must assume the universe is a member of itself.
  *   **Assumption:** $\mathcal{U} : \mathcal{U}$ (Type : Type).

  **The Derivation:**
  In NST, we define $R = \{x \mid x \notin x\}$.
  In NTT, we define a type $R$ that classifies all types $X$ which do not contain themselves.
  1.  **The Predicate:** Let $P(X) \equiv \neg (X : X)$. Under PAT, this is the type $(X : X) \to \mathsf{0}$.
      *   *Constraint:* For $(X : X)$ to be a well-formed proposition (type), $X$ must be a Type (to be on the right of $:$) and a Term (to be on the left). This is only possible if Types are Terms, i.e., $\mathcal{U} : \mathcal{U}$.
  2.  **The Russell Type:** By naive comprehension, there exists a type $R$ containing exactly those $X$ satisfying $P(X)$.
      *   $R \equiv \Sigma_{X:\mathcal{U}} ((X : X) \to \mathsf{0})$.
      *   *Correction for Faithfulness:* In set theory, $R$ is the extension. In TT, if we treat "membership in $R$" as "inhabitation of $R$", then $X : R$ should correspond to $X \in R$. But $R$ is a Sigma type.
      *   *Simpler Direct Translation:* Let's define $R$ not as a Sigma, but as a Type such that for any $X : \mathcal{U}$, the proposition "$X$ is in $R$" is equivalent to "$X$ does not contain itself".
      *   Let $In(X, R)$ be the proposition corresponding to membership. In TT, if $R$ is a Type, membership is inhabitation. But $X$ is a Type. So we need $X : R$.
      *   So we require: $(X : R) \iff \neg (X : X)$.
  3.  **The Contradiction:**
      *   Consider the case where $X$ is $R$ itself. Since $R : \mathcal{U}$ (it is a type), we can substitute $R$ for $X$.
      *   We get: $(R : R) \iff \neg (R : R)$.
      *   In TT logic: We have an equivalence of types $(R : R) \simeq ((R : R) \to \mathsf{0})$.
      *   Let $A \equiv (R : R)$. We have $A \simeq (A \to \mathsf{0})$.
      *   If we have $a : A$, we get $f(a) : \mathsf{0}$ (where $f$ is the map from the equivalence).
      *   If we have $g : (A \to \mathsf{0})$, we get $g' : A$ (the inverse map).
      *   Construct $k \equiv g(\lambda a. f(a))$. Then $k : A$.
      *   Apply $f$ to $k$: $f(k) : \mathsf{0}$.
      *   **Result:** We have derived a term of type $\mathsf{0}$.

  **Summary of Translation:**
  The assumption $\mathcal{U} : \mathcal{U}$ allows the formation of the proposition $(R : R)$. The naive comprehension principle allows the construction of $R$ such that $(R : R) \iff \neg(R : R)$. This yields a term of type $\mathsf{0}$.

