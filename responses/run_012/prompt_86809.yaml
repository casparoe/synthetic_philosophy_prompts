      *   *Is it substantive but misframed?* Yes, partially. The framing of "ranking" conflates administrative prioritization with metaphysical valuation.
      *   *Is it substantive and merely hard?* Yes, because it touches on incommensurability in value theory and the expressive function of moral language.

  4.  **Identify the Exact Points of Divergence:**

      *   *Moral Reasoning:* Consequentialism (Comparativists: ranking leads to better outcomes) vs. Deontology/Virtue Ethics/Expressivism (Anti-comparativists: the act of ranking violates duty to the dead).
