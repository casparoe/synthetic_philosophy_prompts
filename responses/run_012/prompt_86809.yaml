      *   **Task:** Diagnose the disagreement (Verbal? Substantive but misframed? Substantive and hard?). Identify the exact point of divergence (Fact? Standard of evidence? Moral reasoning? Data? Intuitions?). Identify hidden questions. Propose what counts as progress (or if none is expected).

