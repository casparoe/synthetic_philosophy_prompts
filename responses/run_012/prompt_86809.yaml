      *   *Hypothesis 2 (Possibility/Permissibility):* This touches on the "Is/Ought" gap but specifically in moral psychology. Comparativists focus on *consequences* (aid allocation, justice), while anti-comparativists focus on *virtue/expressivism* (what does comparing say about us?).

