answer: |-
  The most defensible reading is the "luck egalitarian" view that inequalities are only justified if they stem from personal choices rather than unchosen circumstances, which actually supports the lottery and tutoring plan because exam scores often reflect family wealth rather than student effort.

  *   **Formal Equality of Opportunity (Careers Open to Talents)**
      *   **Definition:** "Opportunity" means no legal or official barriers prevent anyone from applying; "Outcome" means everyone gets the same seat regardless of merit.
      *   **Verdict:** True but too weak to be useful; nobody disagrees with this, so it doesn't help decide the policy.
      *   **Side:** Both sides satisfy this, so it doesn't support either argument specifically.
      *   **Common Usage:** This is often what people *say* they mean, but it's rarely the actual sticking point in debates.

  *   **Fair Equality of Opportunity (Rawlsian)**
      *   **Definition:** "Opportunity" means two students with the same talent and effort should have the same prospects regardless of their parents' income; "Outcome" means forcing equal results regardless of talent or effort.
      *   **Verdict:** Highly defensible and the standard philosophical interpretation in policy debates.
      *   **Side:** Supports the **Lottery + Tutoring** plan, because the exam currently allows wealth (circumstance) to buy higher scores, violating the principle that only talent and effort should decide admissions.

  *   **Luck Egalitarianism (Choices vs. Circumstances)**
      *   **Definition:** "Opportunity" means you are only held responsible for choices you control (study habits); "Outcome" means compensating for bad luck (born in a poor district).
      *   **Verdict:** Very strong; it distinguishes between inequality caused by laziness (acceptable) vs. inequality caused by poverty (unacceptable).
      *   **Side:** Supports the **Lottery + Tutoring** plan, assuming test prep is viewed as a circumstantial advantage rather than a choice-based effort.

  *   **The Capabilities Approach (Amartya Sen)**
      *   **Definition:** "Opportunity" means having the real freedom and resources to achieve goals (capabilities), not just the formal right to apply; "Outcome" refers to the actual functionings people achieve.
      *   **Verdict:** Strong; it highlights that a right without the means to use it is empty.
      *   **Side:** Supports the **Lottery + Tutoring** plan, because tutoring expands the actual capabilities of disadvantaged students to compete, whereas the exam ignores the lack of capability caused by underfunded middle schools.

  *   **Strict Equality of Outcome (The Strawman)**
      *   **Definition:** "Outcome" means everyone ends up with identical grades, income, or status regardless of input.
      *   **Verdict:** False; nobody seriously argues for this in school admissions, so using it to attack the lottery plan is a distortion.
      *   **Side:** Used by the **Exam** side to attack the lottery, but it misrepresents the tutoring plan which aims for equal *chances*, not identical lives.

  *   **Ex Ante vs. Ex Post Equality**
      *   **Definition:** "Ex Ante" means equality of chances before the process (the lottery ticket); "Ex Post" means equality of results after the process (who gets the seat).
      *   **Verdict:** Crucial distinction; the debate club student was right that these are different metrics.
      *   **Side:** The **Lottery** provides Ex Ante equality (everyone has a 1% chance); the **Exam** claims to provide Ex Ante equality but fails if prep courses skew the odds. The Exam side complains the Lottery creates Ex Post inequality (some get in, some don't), but all admissions systems do that.

  *   **The "Leveling Down" Objection**
      *   **Definition:** The claim that making things equal is bad if it requires making the best-off worse off without helping the worst-off enough to justify it.
      *   **Verdict:** Plausible concern, but depends on data; if tutoring raises everyone without lowering standards, this objection fails.
      *   **Side:** Supports the **Exam** side only if the tutoring program lowers academic standards or drains resources from the magnet school without improving overall success.

  *   **Common Rhetorical Usage**
      *   **Definition:** When people shout this slogan in politics, they usually mean "Don't tax me to help them" or "Don't lower standards to fix demographics."
      *   **Verdict:** intellectually lazy but culturally dominant.
      *   **Side:** Usually supports the **Exam** side, because it frames any redistribution of chances as an unfair punishment of merit, even if the "merit" was bought.
