          *   Address the Amartya Sen "capabilities" mention.

  2.  **Deconstruct the Slogan ("Equality of Opportunity, Not Equality of Outcome"):**
      *   The core tension is between procedural fairness (rules of the game) vs. distributive fairness (results of the game).
      *   In the context of school admissions:
          *   *Exam-based:* Meritocratic. Rewards effort/talent. Criticized for reflecting prior advantages (tutoring, wealthy districts).
          *   *Lottery + Tutoring:* Random chance + resource redistribution. Criticized for ignoring merit or forcing results.

  3.  **Identify Different Readings of "Equality of Opportunity":**
      *   *Reading 1: Formal Equality of Opportunity (Careers Open to Talents).* No legal barriers. Anyone can apply.
          *   *Verdict:* Too weak. Both sides satisfy this.
      *   *Reading 2: Fair Equality of Opportunity (Rawlsian).* Neutralize social contingencies (wealth, class). People with same talent/effort should have same prospects regardless of birth.
          *   *Verdict:* Supports Lottery + Tutoring. The exam reflects prior inequality.
      *   *Reading 3: Luck Egalitarianism (Choices vs. Circumstances).* Inequalities due to choices are okay; inequalities due to circumstances are not.
          *   *Verdict:* Supports Lottery + Tutoring (if exam scores are seen as circumstantial due to prep) OR Exam (if scores are seen as effort). Usually leans toward neutralizing background luck.
      *   *Reading 4: Prioritarianism/Enoughism.* Everyone gets enough opportunity, not necessarily equal.
      *   *Reading 5: The "Leveling Down" Objection.* Equality of outcome is bad if it makes everyone worse off just to be equal.
      *   *Reading 6: Capabilities Approach (Sen).* Freedom to achieve functionings. Real freedom vs. formal freedom.
          *   *Verdict:* Supports Tutoring (expands real capabilities).

  4.  **Identify Different Readings of "Equality of Outcome":**
      *   *Strict Egalitarianism:* Everyone gets the same result (grades, income). (Strawman).
      *   *Ex Post Equality:* Equality in the distribution of goods after the process.
      *   *Ex Ante Equality:* Equality in the chances before the process.

  5.  **Address the "Ex Ante" vs. "Ex Post" Comment:**
      *   *Ex Ante:* Equality of chances (lottery gives equal chance).
      *   *Ex Post:* Equality of results (everyone gets same score).
      *   *Nuance:* The exam claims to be ex ante (everyone takes same test) but is ex post unequal due to prep. The lottery is ex ante equal but produces ex post unequal spots (someone gets in, someone doesn't).

  6.  **Drafting the Response (adhering to constraints):**
