prompt: |-
  I'm a postdoc and I've been roped into running a one-off session for a cross-disciplinary reading group -- mostly economists and lawyers, a couple of historians, one psychologist, and its 75 minutes with a room that has no metaethics at all. The topic I've been handed is the wrong kind of reasons problem, and what I need from you is not the explanation itself (I can do that on a good day) but the plan for giving it. In what order do the pieces have to go so that the thing lands as a real problem rather then a puzzle somebody invented in an armchair: what has to be in place before any of the cases can do any work, what depends on what, and where exactly the move from "an attitude can be correct or incorrect" to "there's a constraint on which considerations can make it correct" has to sit in the sequence. Then the carrying example. I'm tempted by the demon (the one who'll destroy something you care about unless you come to admire him), and I'm also tempted by something closer to home for this crowd -- a museum whose endowment depends on the trustees sincerely coming to admire a mediocre painting, or a firm that pays analysts a bonus for finding a report convincing -- and I want you to pick which one carries the session, say what it has to have and what it can't have (if the room reads it as just self-deception, or just prudence versus evidence, I've lost them before we get to the interesting part), and tell me why not the demon if you'd go the other way. I'd also like to know whether to let them see that the same shape of thing comes up for belief (reasons to believe something because believing it would be lovely) or whether that just drags the pragmatism debate in and wrecks the hour; no reading list, it's a one-off.

  The misconception map matters as much to me as the order, so give it to me in the order they'll actually form, with the point in the sequence where I should head each one off. My guesses: they'll hear "wrong kind of reason" as "bad reason" or "immoral reason"; they'll run it together with the motivating/justifying distinction, which I don't think is the same thing at all; somebody will conclude that the demon shows you can't analyse value in terms of reasons, which strikes me as the wrong lesson to take; and at least one person will treat the state-given/object-given distinction as being the problem rather than one proposed solution to it, which would collapse the whole session into a definitional squabble. Add whatever I've missed. Then the check: one thing I can put to them in the last ten minutes that would show whether they've got the shape of the problem rather than just memorised the case. And tell me what to leave out at this level and to say out loud that I'm leaving it out -- I assume the whole "is there even one unified phenomenon here" literature, but you tell me.

  Last thing, since you're handing me a plan rather than a verdict: tell me which step in your proposed order you're least confident about and why, and what I'd see in the room that would show the sequence is wrong -- that is, what would make you reorder it if you were watching.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Context:**
      *   **User:** Postdoc (likely philosophy, given the topic, but running a session for non-philosophers).
      *   **Audience:** Cross-disciplinary reading group (Economists, Lawyers, Historians, one Psychologist). *Crucial:* No metaethics background. They care about incentives, norms, evidence, institutional design, and practical reasoning.
      *   **Topic:** The Wrong Kind of Reasons (WKR) Problem.
      *   **Constraint:** 75 minutes. One-off session. No reading list.
      *   **Goal:** Make it land as a *real problem*, not an armchair puzzle. Needs a specific structural plan, a carrying example, misconception management, a comprehension check, and scope management.
      *   **Specific Requests:**
          1.  Order of operations (what must be in place before cases work).
          2.  Where the move from "correctness conditions" to "constraints on considerations" sits.
          3.  Choice of carrying example (Demon vs. Museum vs. Firm) + justification.
          4.  Whether to include Belief (Pragmatism debate).
          5.  Misconception map (order of formation + intervention points).
          6.  Comprehension check (last 10 mins).
          7.  Scope management (what to explicitly exclude).
          8.  Self-reflection on the plan (least confident step + signs of failure).

  2.  **Deconstruct the Topic (WKR) for Non-Philosophers:**
      *   *Core Issue:* Some reasons count towards the correctness of an attitude (Right Kind), some count towards the desirability of having the attitude but don't make it correct (Wrong Kind).
      *   *Why it matters to this crowd:*
          *   Economists: Incentives vs. Truth/Quality.
          *   Lawyers: Evidence vs. Policy reasons for belief/verdict.
          *   Historians: Evidence vs. Moral utility of a narrative.
          *   Psychologists: Cognitive dissonance vs. Rationalization.
      *   *The Trap:* If not framed well, it looks like "Self-Deception" (Psych) or "Bad Incentives" (Econ/Law) or "Moral vs. Prudential" (Ethics). It needs to be about *constitutive norms* of the attitude.

  3.  **Step 1: The Order of Operations:**
      *   *Problem:* If I start with the Demon case, they think "Coercion." If I start with "Reasons," they think "Motivation."
      *   *Solution:* Start with the *Attitude* and its *Success Condition*.
      *   *Sequence:*
          1.  Define the Attitude (Admiration/Belief) by what makes it *successful* (fittingness), not what makes it *beneficial*.
          2.  Introduce the Pressure (The Case).
          3.  Isolate the Reason (The Stake).
          4.  The Clash: The reason pushes for the attitude, but doesn't make the attitude *successful*.
          5.  The Label: WKR vs. RKR.
      *   *Crucial Move:* The move from "an attitude can be correct/incorrect" to "constraint on considerations" must happen *before* the case is fully analyzed, otherwise they'll just argue about whether the attitude is rational all-things-considered.

  4.  **Step 2: The Carrying Example:**
      *   *Options:*
          *   *Demon:* Classic, but too metaphysical/fantasy. Risks "Coercion" interpretation.
          *   *Museum (Mediocre Painting):* Good for historians/lawyers (authenticity vs. value).
          *   *Firm (Analyst Bonus):* Good for economists. Risks "Corruption/Bias" interpretation.
      *   *Decision:* **The Museum.**
      *   *Why:* It bridges the gap between the abstract (Demon) and the cynical (Firm). The Firm looks like corruption (analyst *shouldn't* be biased). The Demon looks like gun-to-head. The Museum trustee has a *fiduciary duty* to save the museum, making the pressure normative, not just prudential. It isolates the *nature of admiration* better.
      *   *Constraints:* Must ensure they don't see it as "Self-Deception" (psychological impossibility) or "Prudence vs. Evidence" (trade-off). It must be about whether the endowment money makes the painting *good*.

  5.  **Step 3: Belief vs. Admiration:**
      *   *Risk:* Pragmatism (Pascal's Wager) drags in epistemology and truth norms, which gets messy fast.
      *   *Decision:* Keep Admiration as the primary vehicle. Mention Belief only at the end as an isomorph *if* time permits, but warn that it imports "Truth" baggage. Better to stick to Admiration for the core hour. It's cleaner for "fittingness."

  6.  **Step 4: Misconception Map:**
      *   *User's List:* "Bad/Immoral reason," "Motivating/Justifying," "Value analysis," "State/Object-given definitional squabble."
      *   *Additions:* "All-things-considered rationality" (The biggest one for economists), "Psychological impossibility" (You can't just choose to admire).
      *   *Timing:* Intervene immediately when the terms arise.

  7.  **Step 5: Comprehension Check:**
      *   Need a novel case that tests the *structure*, not the memory.
      *   *Idea:* A judge sentencing a friend. Or a teacher grading a child.
      *   *Better:* A "Truth Serum" scenario or a "Pill" scenario.
      *   *Best:* **The Grading Case.** A professor needs to pass a student to keep funding. Does the funding make the work passing quality? (Matches Museum structure).

  8.  **Step 6: Scope Management:**
      *   *Exclude:* The "Buck-Passing" account of value (too metaethical). The "Unity of Reasons" debate. Detailed taxonomies of WKRs.
      *   *State Explicitly:* "We are not asking if you *should* do it, or if you *can* do it. We are asking if the reason makes the attitude *correct*."

  9.  **Step 7: Self-Reflection (Least Confident Step):**
      *   *Vulnerability:* The move from "Beneficial to have" to "Does not constitute correctness." This is the philosophical heart. Non-philosophers often conflate "Reason to X" with "Reason that counts in favor of X's content."
      *   *Sign of Failure:* Nods during the case, but questions during the check that revert to "But isn't it rational to save the museum?"

  10. **Drafting the Plan (incorporating tone):**
      *   Tone: Professional, collegial, precise, respecting their expertise while guiding the philosophical distinction.
      *   Structure: Follow the user's prompt structure closely.

  11. **Refining the Example Choice (Museum vs. Firm):**
      *   The Firm (Bonus) risks them thinking "Conflict of Interest = Unprofessional." They might say "The analyst ought not take the bonus."
      *   The Museum (Endowment) creates a *moral* obligation to save the institution. It makes the WKR *normatively weighty*, not just greedy. This forces the distinction: You *ought* to admire it (to save jobs/history), but the money doesn't make the art *good*. This is the sweet spot.

  12. **Refining the "Belief" Question:**
      *   Don't make it a second case. Use it as a "Does this sound familiar?" mirror at the end. If you spend time on Pascal's Wager, you lose the room to theology/epistemology.

  13. **Final Review against Constraints:**
      *   75 mins? Yes, the timing needs to be tight.
      *   No metaethics? Keep "Fittingness" jargon minimal or explain it as "Success conditions."
      *   Misconception map integrated? Yes.

  14. **Writing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is a battle plan for the 75 minutes. The goal is to prevent the room from collapsing the distinction into "Prudence vs. Evidence" or "Ethics vs. Facts."

  ### 1. The Sequence: Order of Operations

  You cannot start with the case. If you start with the Demon or the Museum, the economists will calculate utility, the lawyers will discuss coercion/duress, and the psychologist will discuss cognitive dissonance. You must build the **normative architecture** first.

  **Phase 1: The Success Condition (0–15 mins)**
  *   **Goal:** Establish that attitudes have internal standards of correctness independent of the benefits of holding them.
  *   **Move:** Do not use the word "fittingness" yet. Use "Success Conditions."
  *   **Action:** Ask the room: "What makes a belief *successful*?" (Answer: Truth/Evidence). "What makes admiration *successful*?" (Answer: The object is actually admirable/good).
  *   **Crucial Distinction:** Separate **Reasons to *have* the attitude** (benefits of being in that state) from **Reasons that *count in favor of* the attitude's content** (features of the object).
  *   **Where the "Constraint" sits:** This is where you make the move you asked about. You must establish *before* the case that: *For an attitude to be correct, the reasons must bear on the object's properties, not the consequences of the attitude.*
  *   **Intervention:** If someone says, "But if believing saves the world, isn't it the right belief?" Stop them. "It might be the right *thing to do*, but does it make the belief *true*?"

  **Phase 2: The Carrying Case (15–45 mins)**
  *   **Goal:** Apply the architecture to a high-stakes scenario where the "Wrong Kind" reason is morally weighty, not just greedy.
  *   **Action:** Run the Museum case (see below).
  *   **Analysis:** Isolate the reason (the endowment). Does it change the painting's properties? No. Does it give the trustee a massive reason to admire? Yes.
  *   **Conclusion:** We have a reason to admire that does not make the admiration correct. This is the WKR.

  **Phase 3: The Generalization & Check (45–75 mins)**
  *   **Goal:** Show this isn't about art; it's about normative structure.
  *   **Action:** Briefly map it to Belief (Pascal's Wager style) without getting bogged down in epistemology.
  *   **Check:** Run the comprehension test (see below).
  *   **Wrap:** Explicitly state what you left out (see below).

  ---

  ### 2. The Carrying Example: The Museum Trustee

  **Pick the Museum.** Do not pick the Demon. Do not pick the Firm.

  **Why not the Demon?**
  For economists and lawyers, the Demon case reads as **Coercion/Duress**. They will analyze the threat, not the attitude. They will argue about whether the admiration is "voluntary." That is a psychological/legal question, not a normative one. It distracts from the *kind* of reason.

  **Why not the Firm?**
  The Firm (bonus for conviction) reads as **Corruption/Conflict of Interest**. The room will conclude the analyst is *unprofessional* or *biased*. They will treat it as a violation of an external rule, not a failure of the attitude's internal logic.

  **Why the Museum?**
  It creates a **Normative Conflict** rather than a Prudential one.
  *   **The Setup:** A museum holds a mediocre painting. The endowment expires unless the Trustees *sincerely* admire the painting (verified by some mechanism, e.g., a neuro-scan or a binding oath). If the endowment expires, the museum closes, the staff loses jobs, and public access to the *rest* of the collection is lost.
  *   **The Pressure:** The Trustees have a *fiduciary and moral duty* to save the museum. They have a overwhelming reason to admire the painting.
  *   **The Trap:** If they say "We should admire it," you ask: "Does the endowment money make the painting *better*?"
  *   **The Win:** They will agree the money saves the institution but doesn't improve the brushwork. Therefore, the reason to admire (saving jobs) is the *Wrong Kind* of reason to make the admiration *correct*, even if it is the *Right Kind* of reason to *try to cultivate* the admiration.

  **What the Case Must Have:**
  1.  **High Stakes:** It cannot be trivial. If the stakes are low, they'll treat it as "Why bother?"
  2.  **Sincerity Condition:** It must be clear that *feigning* admiration doesn't work. The endowment requires *actual* admiration. This blocks the "Just lie" solution.
  3.  **No Self-Deception Tech:** Do not explain *how* they come to admire it. If you discuss hypnosis or pills, the psychologist takes over. The *mechanism* is irrelevant; the *justification* is the point.

  **What the Case Can't Have:**
  1.  **Ambiguity about Quality:** The painting must be stipulated as mediocre. If there's doubt, they'll argue about aesthetic theory.
  2.  **Personal Gain:** The trustees shouldn't get the money personally. It must be for the institution. This prevents the "Greed vs. Integrity" reading.

  ---

  ### 3. The Belief Question

  **Do not make Belief a second case.**
  It drags in the Pragmatism/Truth debate (William James, Pascal, Evidentialism) which will eat 30 minutes and fracture the room (Lawyers care about "proof beyond reasonable doubt," Economists care about "expected utility").

  **The Move:**
  Use Belief as a **mirror** in the last 15 minutes.
  *   "Does this structure look familiar? Imagine you need to believe your spouse is faithful to stay happy, but the evidence is ambiguous. Does your happiness make them faithful?"
  *   Ask them: "Is the WKR problem harder for Belief than for Admiration?"
  *   **Why:** This lets the epistemologists in the room (likely the lawyers/historians) feel seen without letting them derail the core explanation of Admiration.

  ---

  ### 4. The Misconception Map

  Here is the order in which misconceptions will form, and where you must head them off.

  1.  **"Bad Reason" / "Immoral Reason" (Minute 10)**
      *   *Trigger:* When you introduce the idea of a "Wrong Kind" of reason.
      *   *Correction:* "Wrong" does not mean 'immoral' or 'irrational'. It means 'Wrong Category'. A gun to your head is a very *good* reason to act, but it's the wrong kind of reason to make the action *virtuous*.
      *   *Intervention Point:* Phase 1, when defining the types of reasons. Use the label **"Object-Given" vs. "State-Given"** only if necessary, but prefer **"Reasons about the Object" vs. "Reasons about the Attitude."**

  2.  **"Psychological Impossibility" (Minute 20)**
      *   *Trigger:* The Museum Case. "You can't just choose to admire a bad painting."
      *   *Correction:* "We are not asking if you *can*. We are asking if the endowment money *justifies* the admiration as correct. Assume you *could* admire it. Would the money make it the *right* admiration?"
      *   *Intervention Point:* Phase 2, immediately after presenting the stakes.

  3.  **"All-Things-Considered Rationality" (Minute 35)**
      *   *Trigger:* Economists in the room. "But it maximizes utility to admire it."
      *   *Correction:* "Agreed. It is rational *to bring it about*. But is the admiration *merited*? We are distinguishing the rationality of the *agent* from the correctness of the *attitude*."
      *   *Intervention Point:* Phase 2, during analysis. This is the most critical pivot.

  4.  **"Definitional Squabble" (Minute 50)**
      *   *Trigger:* Someone latches onto "State-Given vs. Object-Given" as the solution rather than the description of the problem.
      *   *Correction:* "That distinction is a tool to describe the problem, not the solution. The problem is that our theory of value/reasons can't explain *why* state-given reasons don't count for correctness."
      *   *Intervention Point:* Phase 3, if terminology gets sticky.

  5.  **"The Demon Lesson" (Minute 60)**
      *   *Trigger:* "So this proves value can't be analyzed in terms of reasons."
      *   *Correction:* "That's one conclusion (The Buck-Passing Account failure), but for today, the lesson is simply that *not all reasons that push for an attitude make it correct*."
      *   *Intervention Point:* Keep this off the table unless they raise it. If they do, park it.

  ---

  ### 5. The Comprehension Check (Last 10 Minutes)

  Do not ask them to define WKR. Ask them to **apply the structure to a new domain.**

  **The Test Case: The Judge's Dilemma**
  *   "A judge must sentence a defendant. If she sentences him lightly, social unrest is avoided (great social good). If she sentences him heavily, social unrest occurs. The evidence proves guilt beyond doubt."
  *   **Question:** "Does the social unrest provide a reason for the *verdict* (belief of guilt) or the *sentence* (consequence)? Now, imagine the question is: Does the social unrest make the defendant *less guilty*?"
  *   **Pass:** If they say, "The unrest is a reason for the sentence (state), but not for the guilt (object)," they get it.
  *   **Fail:** If they say, "She should acquit to save lives," without distinguishing the *truth of guilt* from the *utility of acquittal*, they have collapsed back into All-Things-Considered Rationality.

  **Alternative Check (Simpler):**
  *   "I offer you $1 million to believe the sky is green. You take a pill and believe it. You get the money. Did the $1 million make the sky green?"
  *   If they hesitate, you've lost them to Pragmatism. If they say "No, but it made believing rational," push: "Did it make the belief *accurate*?"

  ---

  ### 6. Scope Management: What to Leave Out

  You must explicitly state what you are **not** doing. Put this on a slide or say it at the start of Phase 3.

  1.  **"We are not solving the Buck-Passing Account debate."** (Metaethics).
  2.  **"We are not deciding if there is one unified phenomenon for all attitudes."** (Unity of Reasons literature).
  3.  **"We are not discussing the psychology of how to change attitudes."** (Psychology of self-deception).

  **Say this out loud:** "I am leaving out the question of *whether* value reduces to reasons. I am only asking you to see that *if* we talk about reasons for attitudes, we must distinguish two kinds."

  ---

  ### 7. Self-Reflection: The Weakest Link

  **The Step I Am Least Confident About:**
  **Phase 1, The Move from "Beneficial" to "Constraint."**
  *   **Why:** This is the most philosophical moment. You are asking non-philosophers to accept a normative constraint (correctness conditions) that limits practical rationality. Economists especially chafe at the idea that "Utility Maximization" isn't the only game in town. They may reject the premise that "Correctness" matters if "Benefit" is high enough.
  *   **Sign the Sequence is Wrong:**
      *   **In the Room:** During the Museum case, if the economists say, "If the museum closes, the painting's value is zero anyway, so admiring it is correct because it preserves value," they have instrumentalized the attitude.
      *   **The Signal:** If questions during the Q&A focus on *how* to cultivate the admiration (psychology) or *whether* the trustee should resign (ethics) rather than the *status of the reason*, the distinction didn't land.
      *   **The Fix:** If you see this, stop. Go back to the Belief analogy. "If I pay you to believe 2+2=5, does the money make the math right?" Use the hard truth of belief to anchor the soft truth of admiration.

  **Final Advice:**
  Your authority comes from holding the line on the **Success Condition**. If you let them slide into "But it's useful," you lose. If you let them slide into "But you can't do it," you lose. Keep returning to: *We are stipulating you can do it. We are stipulating it is useful. Does it make the attitude correct?*
