      *   *Case (b):* Hidden Contradiction.
          *   $KB$: Large set of scheduling rules.
          *   $\phi$: $\bot$ (Contradiction).
          *   Analysis: Derivation is "long chain." Complexity check fails.
          *   Outcome: **Not Known** (maybe "Inconsistent DB" flag, but not "Agent knows contradiction").
      *   *Case (c):* Consent Form/Procedure.
