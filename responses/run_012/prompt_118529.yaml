      *   *Wait, 15 people total.* 3 tables of 5 is good.
      *   *Challenge Cost:* Needs to be high enough to stop frivolous challenges.
      *   *Retraction:* Add a "Retract" option. Costs less than being caught wrong, but gives up Truth points.
      *   *The "Can't Teach" part:* This is crucial. The game treats norms as *rules with penalties*. The Knowledge Norm (Williamson) is often argued to be *constitutive* (you aren't even asserting if you don't know). The game can't simulate "not counting as an assertion." It only simulates "bad assertion." I need to be clear on this.

  11. **Final Polish:** Ensure tone is practical, slightly philosophical but actionable. (Proceed to generate output).

