  2.  **Deconstruct the Philosophy:**
      *   *Truth Norm:* Assert $p$ only if $p$ is true.
      *   *Belief Norm:* Assert $p$ only if you believe $p$.
      *   *Justification Norm:* Assert $p$ only if you have good evidence/reasons for $p$.
      *   *Knowledge Norm:* Assert $p$ only if you know $p$ (implies $T$, $B$, and $J$, but adds a safety/warrant condition).
      *   *The Conflict:* Gettier cases (Justified True Belief without Knowledge), Lucky Guesses (True without Belief/Justification), Honest Mistakes (Belief/Justification without Truth).

