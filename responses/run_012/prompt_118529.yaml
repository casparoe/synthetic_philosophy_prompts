          *   This is too slow.
      *   *Revised Scoring:* The game forces the norms apart via specific card types.
          *   *Type 1: The Lucky Guess.* (True, No Evidence, No Belief/Weak Belief).
          *   *Type 2: The Honest Mistake.* (False, High Evidence, Strong Belief).
          *   *Type 3: The Gettier.* (True, High Evidence, but luck involved).
