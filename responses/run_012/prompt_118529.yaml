      *   **Mechanism:** Players must assert things under rules. The rules must force these norms to come apart (conflict).
      *   **Specific Dynamics:**
          *   Someone should be able to win by being right for a bad reason (luck/sketchy source).
          *   Room must decide whether to dock them (creating the split/lesson).
