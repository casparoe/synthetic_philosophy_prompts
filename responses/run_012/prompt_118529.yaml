answer: |-
  Here is a complete design for **"The Warrant Tribunal,"** a 90-minute game engineered to break the norms of assertion against each other.

  ### **The Setup**

  *   **Players:** 15 total. Split into **3 Tables of 5**.
  *   **Time:** 90 Minutes total.
  *   **Materials per Table:**
      *   **Currency:** 50 poker chips or paper slips ("Cred") per player.
      *   **Claim Deck:** 30 cards. Each has a statement and a hidden **Truth Value** (T/F) visible only to a "Verifier" (rotate this role each round) or printed on the bottom (folded). *See Sample Deck below.*
      *   **Warrant Deck:** 20 cards. These are dealt secretly to the Speaker. They dictate the speaker's internal state. *See Sample Deck below.*
      *   **Verdict Tokens:** 4 colors per player (Red=False, Green=True, Yellow=Justified, Blue=Known).
      *   **Timer:** Phone.

  ### **The Payoff Scheme (No Money)**
  *   **The Pot:** Each table pools 10 chips from every player at the start.
  *   **The Winner:** The player with the most Cred at the end takes the Pot.
  *   **The Prize:** Bragging rights, "Chief Assertor" title, and first pick of snacks/drinks at the *next* meetup.
  *   **Why this works:** It creates enough stakes to make people care about scoring, but the "Pot" mechanic encourages table-level cooperation to keep the game moving, while the individual score encourages gaming the rules.

  ---

  ### **The Rules of Play**

  **1. The Turn Structure (5 Minutes per Turn)**
  *   **Draw:** The Speaker draws one **Claim Card** (e.g., "The population of Norway is under 6 million") and one **Warrant Card** (e.g., "You read this on a meme 5 minutes ago").
  *   **Decision:** The Speaker must choose: **Assert**, **Hedge**, or **Pass**.
      *   **Pass:** Nothing happens. Turn ends.
      *   **Hedge:** "I think..." or "I heard..." Speaker pays 1 Cred to the pot. Cannot be challenged. No Truth points available.
      *   **Assert:** "It is the case that..." Speaker puts 2 Cred into the pot (The Stake).
  *   **Challenge Phase:** Any other player may shout "Challenge!" and put 2 Cred into the pot.
      *   *Limit:* Only **one** challenge allowed per assertion. (Prevents filibuster).
      *   *Cost:* If the Challenger is wrong (Assertion was Proper), they lose their 2 Cred. If right, they win the Speaker's Stake.
  *   **Retraction:** If Challenged, the Speaker may **Retract** before revealing. They lose their 2 Cred Stake, but avoid the "Improper Assertion" penalty.
  *   **Reveal:**
      1.  Speaker reveals Warrant Card (Internal State).
      2.  Verifier reveals Claim Truth Value (Fact).
  *   **Scoring:**
      *   **Truth Bonus:** If Claim is **True**, Speaker wins 4 Cred from the pot.
      *   **Norm Penalty:** If Challenged, the table votes simultaneously (using Verdict Tokens) on: *"Was this assertion appropriate?"*
          *   If Majority votes **No**: Speaker loses 4 Cred (docked). Challenger wins the docked amount.
          *   If Majority votes **Yes**: Speaker keeps everything.
          *   **The Split:** If the vote is 2-vs-2 (excluding Speaker), record it as a **"Norm Collision."** No penalty is applied, but the Facilitator marks it for the debrief.

  **2. The Decks (The Engine of Conflict)**
  You must pre-print these. The magic is in the combinations.

  *   **Warrant Cards (Internal State):**
      *   **K (Knowledge):** You verified this personally today.
      *   **J (Justification):** You read it in a reputable source (NYT/SciJournal) last week.
      *   **B (Belief):** You have a strong hunch/intuition, no source.
      *   **N (None):** You are guessing blindly.

  *   **Claim Cards (External Fact):**
      *   Mix of **True** and **False**.
      *   *Crucial:* Some claims should be obscure enough that "J" (Reputable Source) is distinct from "K" (Personal Verification).

  **3. The Three Rounds (60 Minutes Total)**
  *   **Round 1 (20 mins):** Standard Rules. Focus on Truth vs. Belief.
  *   **Round 2 (20 mins):** **Hard Mode.** Challenge Cost drops to 1 Cred. (Encourages challenging Lucky Guesses).
  *   **Round 3 (20 mins):** **The Gettier Round.** Facilitator introduces specific cards where Justification + Truth exist, but via luck (e.g., Warrant: "You saw a broken clock that happened to show the right time"). *Note: You may need to narrate this scenario rather than rely on cards for true Gettier cases.*

  ---

  ### **Timeline (90 Minutes)**

  *   **00:00 – 00:10:** **Intro & Setup.** Explain the 4 Norms briefly (Truth, Belief, Justification, Knowledge). Deal chips.
  *   **00:10 – 00:30:** **Round 1.** (Get them comfortable).
  *   **00:30 – 00:50:** **Round 2.** (Increase tension/lower challenge cost).
  *   **00:50 – 01:10:** **Round 3.** (Targeted philosophical traps).
  *   **01:10 – 01:30:** **The Debrief.** (The most important part).

  ---

  ### **The Debrief Guide**

  Do not lecture. Ask questions based on the "Norm Collisions" recorded during the game.

  **1. The Lucky Guess (Truth vs. Knowledge)**
  *   *Scenario:* Someone asserted a Truth with a "N" (None) Warrant. They got the Truth Bonus.
  *   *Ask:* "Table 2, Player 1 won chips on a blind guess. Did they violate a norm?"
  *   *Map:*
      *   If you say "No, they were right": You hold the **Truth Norm**.
      *   If you say "Yes, they shouldn't have said it": You hold the **Knowledge Norm** or **Justification Norm**.
  *   *Lesson:* Truth is necessary, but is it sufficient?

  **2. The Honest Mistake (Belief/Justification vs. Truth)**
  *   *Scenario:* Someone asserted with "J" (Reputable Source), but the Claim was False (source was outdated).
  *   *Ask:* "They had good grounds. They believed it. They were wrong. Should they be docked?"
  *   *Map:*
      *   If "Dock them": You hold the **Truth Norm** (Strict Liability).
      *   If "Let them go": You hold the **Justification Norm** (Reasonable Care).

  **3. The Split (The Core Lesson)**
  *   *Scenario:* Look at the 2-vs-2 votes.
  *   *Ask:* "Why did half of you want to dock him and half didn't?"
  *   *Lesson:* This reveals that our community doesn't share a single norm. We are playing with different rulebooks. The "Knowledge Norm" (Williamson) tries to solve this by saying J+T isn't enough if the link is accidental.

  **4. Retractions**
  *   *Ask:* "Who retracted? Did it feel like 'cheating' or 'responsibility'?"
  *   *Lesson:* Retraction is the safety valve of the Justification Norm.

  ---

  ### **Predictable Failure Modes**

  **1. The Filibuster (Challenge Spam)**
  *   *Risk:* Players challenge every assertion to drain the Speaker's chips.
  *   *Fix:* The **"One Challenge Per Claim"** rule is vital. Also, make the Challenge Cost high (2 Cred). If they challenge and lose, they pay the Speaker directly. Make aggression expensive.

  **2. Truth-Maxing (The Cynic)**
  *   *Risk:* A player realizes the Truth Bonus (4 Cred) outweighs the Risk (2 Cred Stake + 4 Cred Dock). They assert everything blindly.
  *   *Fix:* The Social Pressure. In a group of 15, being the person who constantly gets voted "Improper" feels bad. Emphasize in the intro that "Winning" includes not being voted down. If they still do it, use them as the villain in the debrief.

  **3. Analysis Paralysis**
  *   *Risk:* Tables spend 10 minutes debating one vote.
  *   *Fix:* The Facilitator (rotate this role among your organizers) must enforce a 30-second vote window. "Tokens down in 3, 2, 1."

  ---

  ### **The Limit: What This Game Cannot Teach**

  You asked for honesty on what the game *can't* reproduce. You must stand up and say this at the very end.

  **The Constitutive vs. Regulative Gap**
  *   **The Game:** Treats the Knowledge Norm as a **Regulative Rule**. (Like a speed limit: You *can* assert without knowledge, but you get a ticket/penalty if caught).
  *   **The Philosophy (Williamson):** Argues the Knowledge Norm is **Constitutive**. (Like the rules of Chess: You cannot *move a bishop diagonally* and call it a knight move. If you assert without knowledge, you aren't just "breaking a rule," you are arguably **not asserting** at all—you are merely making a noise).
  *   **The Gap:** The game forces players to treat assertion as a move that *can* be made improperly. It cannot simulate the feeling that an assertion without knowledge is *void*.
  *   **What to Say:** *"In this game, you could lie and still 'assert.' In the real philosophical position, assertion is defined by knowledge. If you don't know, you haven't just played badly; you've stepped outside the game of communication entirely. That internal feeling—that you literally lack the standing to speak—is hard to gamify, because games need moves to score. But remember that split you felt? That discomfort was the closest you'll get to the constitutive wall."*

  ### **Sample Card Combos to Prepare**

  1.  **The Lucky Guess:** Claim: "The coin landed Heads" (True). Warrant: "N (Blind Guess)." -> *Triggers Truth vs. Knowledge split.*
  2.  **The Conspiracy:** Claim: "The earth is flat" (False). Warrant: "J (I saw videos)." -> *Triggers Justification vs. Truth split.*
  3.  **The Gettier:** Claim: "Jones owns a Ford" (True). Warrant: "J (Jones showed me a registration, but it was fake; Jones actually won a car in a lottery unbeknownst to you)." -> *Requires Facilitator narration.*
  4.  **The Lie:** Claim: "I didn't eat the cake" (False). Warrant: "B (You know you ate it)." -> *Triggers Belief Norm violation.*

  ### **Host Checklist**
  *   [ ] Print 3 sets of Claim/Warrant cards.
  *   [ ] Gather 150 chips/tokens.
  *   [ ] Recruit 3 "Table Facilitators" (or do it yourself by rotating).
  *   [ ] Prepare snacks for the winner.
  *   [ ] **Crucial:** Pre-verify all Claim Cards. Nothing kills the game faster than "Actually, I think that's true..." ambiguity. Use binary facts.

  This design ensures the mechanics force the norms apart, the payoff structure rewards accuracy but penalizes recklessness, and the debrief captures the philosophical residue left by the gameplay.
