          7.  **The Vote:** The table votes on whether the assertion was *Appropriate*.
          8.  **The Split:** If the vote splits, that's the teaching moment.
      *   **Winning:** Most Cred at the end.
      *   **Incentive:** You get Cred for True assertions. You lose Cred for Inappropriate assertions (as voted).
      *   **The Tension:** If I assert a Truth but had no reason (Lucky Guess), do I get points for Truth but lose points for Appropriateness? Yes. This separates $T$ from $K$.

  6.  **Addressing Specific Constraints:**
      *   *Filibuster:* Limit challenges to 1 per round or cost increases exponentially.
      *   *Payoff:* Bragging rights / "Philosopher King" title / First pick of snacks next time.
      *   *Timeline:* 10 min intro, 60 min game (3 rounds of 20), 20 min debrief.
      *   *Debrief:* Map the conflicts to Williamson, Weiner, etc.
      *   *Limitations:* The game can't reproduce the *internal* feeling of the knowledge norm (the constitutive rule aspect). It externalizes it as a social penalty.

  7.  **Drafting the Content:**
      *   *Title:* The Warrant Game.
      *   *Materials:* Chips, Cards (Claims + Warrants), Timer.
      *   *Rules:* Clear, step-by-step.
      *   *The "Trap":* Design specific cards that trigger the splits (The Lucky Guess, The Conspiracy Theorist, The Gettier).
      *   *Debrief Guide:* Specific questions to ask.
      *   *Failure Modes:* Filibustering, Analysis Paralysis, Truth-Maxing (ignoring norms).
      *   *The "Can't Teach" Bit:* The constitutive nature of the norm (Assertion *is* a move that represents knowledge, not just a move punished if lacking knowledge).

  8.  **Refining the Mechanics for the "Split":**
      *   To ensure the room splits, the voting needs to be simultaneous (show of hands or tokens) so people aren't swayed by others.
      *   The "Warrant Cards" need to be dealt to the speaker secretly.
      *   *Scenario:* Speaker draws Claim: "It is raining outside."
      *   *Warrant Deal:* Speaker gets a hidden card: "You haven't looked, but you heard thunder." (Justified? Maybe. Known? No.)
      *   *Speaker Choice:* Assert or Pass.
      *   *If Assert:* Group votes on "Was this allowed?"
