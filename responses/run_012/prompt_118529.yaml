          *   Truth Bonus: +2 if True.
          *   Norm Penalty: -2 if majority votes "Improper."
          *   Challenge Bonus: Challenger gets +1 if they successfully prove impropriety.

      *Wait, I need to make sure the "Lucky Guess" wins money but loses respect.*
      *   If Truth Bonus is high, people will Lucky Guess.
      *   If Norm Penalty is high, people will stay silent.
      *   Balance is key. Let's make the Norm Penalty *social* (voting) but the Truth Bonus *mechanical* (chips).
      *   Actually, the prompt says: "Ideally someone wins a round by being right for a bad reason... and the room has to decide whether to dock them."
      *   So: Mechanical points for Truth. Social vote for "Docking" (taking points away).
      *   If the vote splits, no docking? Or majority rules? Majority rules for the game, but the *split* is recorded for the debrief.
      *   Let's have the Facilitator track the "Split Count."

  9.  **Structuring the Response:**
      *   **Game Title:** The Warrant Tribunal.
      *   **Setup:** Tables, Chips, Decks.
      *   **The Decks:** Claim Deck (Truth values), Warrant Deck (Speaker's internal state).
