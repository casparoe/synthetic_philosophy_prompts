      *   **Wait, I need to make sure the text looks different enough.**
      *   I'll use "Service A" and "Service B".
      *   I'll change "Deploy" to "Config Push". (Semantically same for the purpose of the exercise).
      *   I'll change "On-call" to "SRE".
      *   *Okay, ready to write.*

      *   **Position on Causation:** I need to commit.
      *   Claim: Causation in postmortems is not a physical fact to be discovered, but a *selection* made for a purpose (prevention, accountability, learning). The activity shows that "The Cause" is a function of the Question Asked + The Norms Held.
      *   Limit: It doesn't prove there *isn't* a physical cause, just that our *talk* about it is pragmatic.

      *   **Failure Modes:**
          *   "They're the same ticket!" -> Acknowledge immediately, that's the point.
          *   "We voted consistently." -> Highlight the minority, or probe the *reasoning* (which will differ).
          *   "This is just semantics." -> Push back: "Semantics drive who gets fired."

      *   **Structure:**
          1.  Intro (5 min)
          2.  Round 1: The "Startup" Incident (15 min)
          3.  Round 2: The "Enterprise" Incident (15 min)
          4.  The Reveal (10 min)
          5.  Debrief (30 min)

      *   **Wait, 75 mins.**
      *   Intro: 5.
      *   Round 1: 10 (Read + Vote).
      *   Round 2: 10 (Read + Vote).
      *   Reveal: 10.
      *   Debrief: 40.
      *   *Need more time for discussion.* Cut Intro to 2 mins. Cut Reveal to 5.
      *   *Actually, I need time for them to argue.*
      *   Let's make the voting anonymous to reduce peer pressure. Index cards.

      *   **Final Polish on the "Contrast" manipulation:**
      *   To ensure they feel the contrast shift, I will explicitly change the *Baseline* in the text.
      *   Ticket 1: "System has been stable for 6 months." (Contrast: Stability).
      *   Ticket 2: "System has been flaky for 6 weeks." (Contrast: Degradation).
      *   *Same technical failure.*
      *   In Ticket 1, Cause = The Change.
      *   In Ticket 2, Cause = The Flakiness (Background condition).
      *   *This is the classic "Cause vs. Condition" distinction.*
      *   *Okay, I will combine Norms and Contrast.*
      *   Ticket 1: Stable + Low Norms.
      *   Ticket 2: Flaky + High Norms.
      *   *This might confound the variables.*
      *   *I'll separate them.*
      *   Round 1: Stable vs. Flaky (Contrast).
      *   Round 2: Low Norm vs. High Norm (Omission).
      *   *That's 4 scenarios. Too many.*
      *   *Okay, I'll stick to the "Twin Incident" (Norms) and use the Debrief to walk them through the Contrast logic using their own votes.*
      *   *Wait, prompt says "make the team feel both... from the inside."*
      *   I must build the Contrast manipulation into the activity.
      *   *Okay, I will use **Three Rounds**.*
      *   Round 1: "What broke it?" (Event focus).
      *   Round 2: "Why *this* time?" (Contrast focus).
      *   Round 3: "Who dropped the ball?" (Norm focus).
      *   *Same Incident Text for all three.*
      *   *This is the winner.* It isolates the *Question* as the variable.
      *   Round 1 Q: "Identify the Root Cause." (Vague).
      *   Round 2 Q: "Identify the factor that distinguishes this run from a successful run." (Contrast).
      *   Round 3 Q: "Identify the factor that violated engineering standards." (Norm).
      *   *Wait, if I tell them "Violated standards", they know it's about norms.*
      *   *I need the Norm to be implicit.*
      *   *Okay, I'll go back to the Two-Ticket Design (Context Shift).* It's more subtle.
      *   I will embed the Contrast shift in the Ticket Text (Stable vs. Flaky history).
      *   I will embed the Norm shift in the Ticket Text (Startup vs. Enterprise).
      *   *Wait, if I change the text, is it still "differ only in the contrast... or norm"?*
      *   Yes, if the *technical* facts (the crash) are identical.
      *   *Okay, Plan:*
      *   Ticket A: "Stable History + Startup Culture."
      *   Ticket B: "Flaky History + Enterprise Culture."
      *   *This confounds them.*
      *   *Okay, I need to choose ONE primary mechanism for the activity and use the other as a supporting reveal.*
      *   *Decision:* The Activity will focus on **Norms/Omission** (Ticket A vs B Context). The **Contrast** intuition will be triggered by asking them to re-evaluate Ticket A with a different *Question* in the debrief.
      *   *No, I'll do Two Rounds of Voting on the SAME Ticket with Different Questions.*
      *   Round 1: "What caused the outage?"
      *   Round 2: "What caused the outage *severity*?"
      *   *This hits Contrast.*
      *   *Where do Norms come in?*
      *   I'll add a "Policy Addendum" before Round 2.
      *   *Okay, I have it.*
      *   **Activity:** "The Root Cause Shifter."
      *   **Round 1:** Incident Report. Question: "Root Cause?" (No Policy info).
      *   **Round 2:** Same Report + "Policy Memo" (Norms). Question: "Root Cause?"
      *   **Round 3:** Same Report + "Historical Data" (Contrast). Question: "Root Cause?"
      *   *This is too long.*
      *   *Okay, I'll commit to the **"Twin Incident"** (Two Tickets) design.* It is the most robust way to show the Normative shift (Omission). I will ensure the Contrast shift is embedded in the *outcome options*.
      *   *Wait, I can't ignore the Contrast requirement.*
      *   *Okay, I will design the Voting Options to force the Contrast choice.*
      *   Option 1: The Code Change.
      *   Option 2: The System Fragility.
      *   *In Ticket 1 (Stable), Option 1 wins.*
      *   *In Ticket 2 (Fragile), Option 2 wins.*
      *   *This hits Contrast.*
      *   *Now add Norms.*
      *   Ticket 1 (Low Norms): Omission is not an option.
      *   Ticket 2 (High Norms): Omission IS an option.
      *   *Okay, I'll merge them.*
      *   **Final Design:** Two Tickets.
      *   Ticket 1: "Project Phoenix" (Startup, Stable).
      *   Ticket 2: "Project Atlas" (Enterprise, Fragile).
      *   *Technical Core:* Identical.
      *   *Voting:* Select ONE Root Cause from a list.
      *   *List:* Deploy, Traffic, Missing Monitor, Tech Debt.
      *   *Prediction:* Phoenix -> Deploy. Atlas -> Missing Monitor/Tech Debt.
      *   *Reveal:* Technical Core was identical.
      *   *Debrief:* Unpack Norms (Monitor) and Contrast (Stable vs. Fragile).

      *   *Wait, I need to make sure the "Omission" feels like a Cause in one and not the other.*
      *   In Phoenix, "Missing Monitor" is "Not our job yet."
      *   In Atlas, "Missing Monitor" is "Negligence."
      *   *Okay, I'll write the Preambles to imply this.*

      *   *Scoring:* "Consistency Bonus." If you pick the same technical cause for both, you get a point. (Most won't).
      *   *Failure:* They spot the text similarity. *Fix:* "Yes, that's the point."
      *   *Limitations:* Doesn't prove metaphysics. Proves pragmatics.

      *   *Let's finalize the prompt requirements check.*
      *   12 people? Yes (3 tables of 4).
      *   75 mins? Yes.
      *   Materials? Projector, Cards, Whiteboard.
      *   Non-philosophers? Yes (Engineering context).
      *   Feel both intuitions? Yes (Norms via Context, Contrast via History/Options).
      *   Reveal is voting record? Yes.
      *   Debrief maps to ideas? Yes.
      *   Predictable failures? Yes.
      *   Limitations? Yes.
      *   Committed design? Yes.
      *   Position on causation? Yes (Pragmatic/Functional).

      *   *One detail:* "Index cards." I'll use them for anonymous voting.
      *   *Whiteboard:* Tally the votes.
      *   *Projector:* The Tickets.

      *   *Let's refine the "Contrast" part.*
      *   To make sure they feel the *Contrast* intuition (Cause = Event - Background), I need the *History* to change.
      *   Ticket 1: "Service has 99.99% uptime historically." (Background = Stable). Cause = Deploy.
      *   Ticket 2: "Service has 95% uptime historically." (Background = Unstable). Cause = Architecture/Debt.
      *   *This isolates the Contrast variable.*
      *   *Now the Norm variable.*
      *   Ticket 1: "Team is exempt from SLOs." (Norm = Low). Omission = Not a cause.
      *   Ticket 2: "Team is bound by SLOs." (Norm = High). Omission = Cause.
      *   *I can't do 4 tickets.*
      *   *I'll combine them into the Two Tickets.*
      *   Ticket 1: Stable + Low Norm.
      *   Ticket 2: Unstable + High Norm.
      *   *In Debrief, I will disentangle them.* "Why did you switch? Was it the stability? Or the rules?"
      *   *This allows the discussion to uncover the two distinct levers.*
      *   *Perfect.*

      *   *Wait, one last check:* "The reveal is the team's own voting record, not my explanation."
      *   So I must tally Round 1 and Round 2 on the board *before* explaining why.
      *   The visual discrepancy *is* the reveal.
      *   Then I ask "Why?"
      *   Then I reveal the texts were technically identical.
      *   Then I explain the Norm/Contrast levers.

      *   *Okay, ready to draft.*
answer: |-
  # Activity Design: "The Twin Incident Protocol"

  ## 1. Core Claim & Position
  **Position:** Causation in postmortems is not a physical fact waiting to be discovered, but a **pragmatic selection** driven by *contrast classes* (what are we comparing this to?) and *normative baselines* (what did we expect?).
  **What this establishes:** This activity proves that your team's attribution of "The Cause" is unstable and context-dependent. It does *not* prove there is no physical reality to the incident, only that the label "Root Cause" is a tool for accountability and prevention, not a mirror of physics. You must supply the conclusion: "If 'cause' shifts with context, our postmortem goal isn't to find The Truth, but to choose the context that best prevents future pain."

  ## 2. Logistics
  *   **Time:** 75 Minutes.
  *   **Participants:** 12 Engineers (split into 3 tables of 4).
  *   **Materials:**
      *   Projector (for Incident Slides).
      *   Whiteboard (for Vote Tally).
      *   Index Cards (2 per person, labeled "Round 1" and "Round 2").
      *   Pens.
  *   **Roles:**
      *   **Facilitator (You):** Neutral arbiter. Do not offer opinions on the incidents.
      *   **Scribes (1 per table):** Responsible for writing the table's final vote on the whiteboard.

  ## 3. The Activity Sequence

  ### Phase 1: Setup (5 Minutes)
  *   **Script:** "We're running a calibration exercise on root cause analysis. You'll review two incident reports from different teams in the company. Your goal is to identify the single 'Root Cause' for each. Accuracy isn't the goal; consistency is. At the end, we'll score your ability to apply a consistent causal framework across different contexts."
  *   **The Stake:** "The table with the highest consistency score (same technical cause selected in both rounds) gets to pick the topic for next month's lunch."
  *   **The Trap:** This sets them up to try to be consistent, making the inconsistency more jarring when revealed.

  ### Phase 2: Round 1 — "Project Phoenix" (15 Minutes)
  *   **Projector Slide:** Display **Incident Report A**.
  *   **The Text (Key Details):**
      *   **Service:** `checkout-service` (New microservice, 3 months old).
      *   **Context:** "Team is in 'Beta Mode'; exempt from strict SLOs. Move fast."
      *   **History:** "Service has had 99.99% uptime since launch."
      *   **Event:** "Deploy v4.2 pushed at 14:00. Error rate spiked at 14:15."
      *   **Human Factor:** "On-call engineer saw the spike but did not page, assuming it would self-heal. No monitoring alert was configured for this error code."
      *   **Outcome:** "15 minutes of degraded performance."
  *   **Task:** "Discuss at your table. Select **ONE** Root Cause from the options on your card."
  *   **Index Card Options (Round 1):**
      1.  The Code Deploy (v4.2)
      2.  The Traffic Spike
      3.  The Missing Monitor (Omission)
      4.  The On-Call Decision (Omission)
  *   **Action:** Tables write their choice on the Whiteboard under "Phoenix."

  ### Phase 3: Round 2 — "Project Atlas" (15 Minutes)
  *   **Projector Slide:** Display **Incident Report B**.
  *   **The Text (Key Details):**
      *   **Service:** `payment-indexer` (Legacy core service, 5 years old).
      *   **Context:** "Team is in 'Compliance Mode'; bound by strict SLOs. Zero tolerance."
      *   **History:** "Service has had 95% uptime over last quarter (known flakiness)."
      *   **Event:** "Config Update B pushed at 14:00. Error rate spiked at 14:15." *(Note: Functionally identical to Deploy)*
      *   **Human Factor:** "On-call engineer saw the spike but did not page, assuming it would self-heal. No monitoring alert was configured for this error code." *(Identical omission)*
      *   **Outcome:** "15 minutes of degraded performance."
  *   **Task:** "Discuss at your table. Select **ONE** Root Cause from the options on your card."
  *   **Index Card Options (Round 2):**
      1.  The Config Update (B)
      2.  The Traffic Spike
      3.  The Missing Monitor (Omission)
      4.  The On-Call Decision (Omission)
  *   **Action:** Tables write their choice on the Whiteboard under "Atlas."

  ### Phase 4: The Reveal (10 Minutes)
  *   **Step 1 (The Tally):** Count the votes.
      *   *Predicted Result:* Phoenix votes will cluster on **The Deploy**. Atlas votes will cluster on **Missing Monitor** or **On-Call Decision**.
  *   **Step 2 (The Confrontation):** Point to the whiteboard. "Look at the shift. In Phoenix, the human omission wasn't the cause. In Atlas, it was."
  *   **Step 3 (The Twist):** "Read the 'Event' and 'Human Factor' sections of both reports again. Word for word. They are technically identical. The code change is the same. The omission is the same. The duration is the same."
  *   **Step 4 (The Silence):** Let that sit for 30 seconds. Do not explain yet. Ask: "How many of you feel you voted correctly both times?" (Most will raise hands). "How many feel you voted inconsistently?" (Some will).

  ### Phase 5: The Debrief (30 Minutes)
  *   **Goal:** Map their experience to the two philosophical intuitions without using jargon until the end.

  *   **Moment 1: The Normative Shift (Omission)**
      *   **Ask:** "Why did the *Missing Monitor* become a cause in Atlas but not Phoenix? Physically, the monitor was missing in both."
      *   **Listen:** They will say "Because Atlas is critical," "Because they had SLOs," "Because it was negligence in Atlas but not Phoenix."
      *   **Point:** "The physical fact (no monitor) didn't change. The **expectation** changed. You only counted the omission as a 'cause' when a **norm** was violated. In Phoenix, doing nothing was acceptable. In Atlas, doing nothing was a violation. Therefore, 'causing by omitting' isn't about physics; it's about job descriptions."
      *   **Label:** *Normative Dependence of Omission.*

  *   **Moment 2: The Contrast Shift (Cause vs. Condition)**
      *   **Ask:** "Why did Phoenix vote for the Deploy, but Atlas often voted for the System/History (if they picked 'Tech Debt' or similar) or the Omission?"
      *   **Listen:** They will say "Phoenix was stable, so the change broke it." "Atlas was already broken, so the change just finished it."
      *   **Point:** "In Phoenix, you compared the outcome to *last week* (Stable). So the Change is the difference. In Atlas, you compared the outcome to *a healthy system* (Ideal). So the Fragility is the difference. You didn't disagree on the facts. You disagreed on **what you were comparing the incident against**."
      *   **Label:** *Contrastive Causation.*

  *   **Moment 3: The Postmortem Application**
      *   **Ask:** "If I ask 'What caused the outage?' without specifying the contrast or the norms, what am I actually asking?"
      *   **Answer:** "I'm asking you to guess my context."
      *   **Takeaway:** "In future postmortems, don't ask 'What was the root cause?' Ask: 'What factor, if changed, prevents this *specific* contrast?' and 'Whose norms were violated here?' If you don't define the contrast, you will argue forever."

  ## 4. Predictable Failure Modes & Fixes

  *   **Failure 1: "These are the same ticket."**
      *   *Symptom:* A sharp engineer notices the "Event" text is identical during Round 2.
      *   *Fix:* Acknowledge immediately. "Good catch. Please finish the vote based on the *Context* provided (Phoenix vs. Atlas). We will discuss the text similarity in the reveal." This heightens the tension rather than breaking the game.
  *   **Failure 2: "We voted consistently (Deploy for both)."**
      *   *Symptom:* A table refuses to bite on the Omission in Round 2.
      *   *Fix:* In the debrief, isolate them. "You held the physical cause constant despite the norm shift. That's a valid stance (Physicalism). But look at the room: 80% of you shifted. Why did the room's intuition bend even if yours didn't?" This validates them while highlighting the group phenomenon.
  *   **Failure 3: "This is just semantics/word games."**
      *   *Symptom:* Senior engineers dismiss the exercise as irrelevant to "real work."
      *   *Fix:* "Semantics determine who gets fired. If we call the Omission the 'Cause' in Atlas, the on-call gets a write-up. If we call the Deploy the 'Cause', the dev does. Same facts, different careers. That's why this matters."

  ## 5. Limitations (What You Must Supply)
  The activity cannot prove that there is *no* objective causal structure. A physicist could argue the deploy *did* physically trigger the crash regardless of norms.
  *   **Your Closing Statement:** "This activity doesn't prove physics is subjective. It proves **accountability** is. In a postmortem, we aren't doing physics; we are assigning responsibility for prevention. If we treat 'Cause' as a physical fact, we will fight over who is right. If we treat 'Cause' as a pragmatic choice based on norms and contrasts, we can negotiate which prevention strategy buys us the most safety for the cost."

  ## 6. Why This Design?
  I rejected a "Sequential Question" design (asking the same group different questions on one ticket) because groups tend to anchor on their first answer and refuse to move. The **Twin Incident** structure forces them to commit to two separate judgments before they know they are comparable. The inconsistency is generated *between* the rounds, making the reveal on the whiteboard undeniable data rather than a hypothetical "what if." It isolates the **Norm** variable in the Context preamble and the **Contrast** variable in the History preamble, allowing you to disentangle them in the debrief while keeping the activity itself clean.
