answer: |-
  "The League was a corpse before the Week of Rust began," Elara said, tapping the map of the Meridian coastline. "You focus on the Council's veto on Tuesday, but the silver mines had been dry for a decade. The grain embargo was tight. The mercenary contracts were expiring. The collapse was overdetermined."

  Tomas leaned back, shaking his head. "Overdetermination is a convenient ghost, Elara. It haunts every disaster after the fact. To say the mines caused the fall is to say that without the dry mines, the League survives. But we know that isn't true. The League survived dry spells before. Causal explanation *is* counterfactual explanation. To say the veto caused the collapse is to say that if the Council had voted yes, the collapse would not have happened."

  "And there lies your error," Elara replied. "You confuse a trigger with a cause. A trigger is merely the final point of contact. Genuine overdetermination isn't just a pattern noticed after the fact; it requires independent causal chains converging on the same outcome. Here, you have the economic strangulation, the demographic shift from the plague, and the military insolvency. These are independent vectors. If the Council votes yes on Tuesday, the mercenaries stay for a month. But the grain doesn't arrive. The plague doesn't stop. The state collapses in March instead of Friday. The outcome is resilient to the deletion of any single factor."

  "But it isn't the same outcome," Tomas insisted. "A collapse in March allows for negotiation. A collapse on Friday results in the sack of the harbor. The specific political entity that existed on Monday was gone by Saturday. My counterfactual is evaluated by imagining a minimal revision of what actually happened. We hold the background fixed—the dry mines, the plague—and we change only the vote. In that nearest possible world, the mercenaries hold the wall. The League persists."

  Elara scoffed. "Minimal with respect to what? You select the revision that suits your thesis. Why is changing the vote 'minimal' compared to changing the mine yield? You are selecting the variable based on your interest, not the historical record. And here is the blow you cannot parry: evaluating your revision requires a sense of probability. How likely was a 'yes' vote? The historical record supplies no such probabilities. It tells us what happened, not the propensity of what might have. Your verdicts are as ungrounded as my inevitability. You pretend to precision, but you are guessing."

  Tomas paused, acknowledging the hit. "You are right that history offers no frequencies. But causal talk is contrastive. We are not asking 'Why did the League fall?' in the abstract. We are asking 'Why did the League fall *then*, rather than later?' Once the alternative is fixed—survival through the week—the counterfactual has a determinate answer. The veto makes the difference between survival and collapse in that specific window. I am not claiming the League was immortal; I am claiming that the specific death was contingent."

  "So you concede the inevitability of the collapse," Elara pressed, sensing ground shifting. "You admit the structural facts were sufficient for the death, merely contesting the time of demise. Then our dispute is verbal. You define 'the League' as the specific administration of that week; I define it as the polity itself. You win contingency on the fine grain of the week, but I hold inevitability on the coarse grain of the regime."

  "It costs me something to admit that," Tomas said sharply. "If I accept your coarse grain, I erase the agency of the Councilors. I make their deliberation a theater performance. If the outcome was settled, their votes were irrelevant. That denies the reality of political choice. I refuse to treat human decisions as epiphenomena of structural forces. If I concede the verbal point, I concede that history is merely the study of constraints, not actions."

  "But if you insist on the fine grain," Elara countered, "you reduce history to a chronicle of accidents. You tell me that because a single vote changed the week, the structures didn't matter. That is equally distorting. You are hiding behind the contrastive definition to avoid the hard truth: the system was brittle. A system that falls because of one vote was already fallen. Your 'minimal revision' is a fantasy because it requires the background structures to remain static while the human element changes, but the human element is produced by the structures. The Council voted no *because* the mines were dry."

  "Then we are back to probabilities," Tomas said. "You claim the vote was determined by the mines. How do you know? Perhaps a single eloquent speech could have swayed them. If that speech was possible, the vote was contingent. If the vote was contingent, the collapse was not inevitable in the week it occurred. You say I lack probabilities, but you assert necessity without them. You assume the structures dictate the vote, but that is just your own counterfactual claim: that without the dry mines, the vote changes. You are relying on the very method you claim to distrust."

  "I rely on the convergence of evidence," Elara said. "The letters, the ledgers, the troop movements. They all point to a system with no slack. Your method relies on imagining a world that did not exist. Mine relies on describing the world that did. If you cannot show me the probability of the speech, you cannot show me the contingency of the vote."

  "And if you cannot show me the mechanism by which the mines forced the vote," Tomas replied, "you cannot show me the necessity of the collapse. You are describing a trajectory, but a trajectory is just a series of contingent events linked together. You call it inevitability; I call it a chain of causes. Break one link, and the chain fails."

  "Then we agree on nothing," Elara said, closing her notebook. "You see a chain; I see a net. Cut one string, the net holds. Cut enough, it falls. You want to credit the cutter; I want to credit the rot."

  "I want to credit the choice," Tomas corrected. "Because if it was all rot, there is no lesson for the living. Only warnings for the doomed."

  "Then you aren't studying history," Elara said, standing up. "You're studying theology."
