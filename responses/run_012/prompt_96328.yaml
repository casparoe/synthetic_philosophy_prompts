prompt: |-
  You are a combinatorial game theorist with the instincts of a philosopher of mathematics: your speciality is finding the hidden hypothesis in an argument that people have been repeating for years without checking. Think carefully before you commit to a diagnosis, and open your answer with a brief, non-committal brainstorm of every reading of the argument that might be right, including ones you will go on to reject.

  A friend in my game-theory reading group produced the following argument. He says it is the standard strategy-stealing argument, that it is entirely general, and that its generality is precisely the point. I have set it out as closely to his version as I can.

  1. Any finite two-player game of perfect information, with no chance moves and no draws, has a winner: one of the two players has a strategy that guarantees a win.
  2. Call such a game symmetric when the rules are colour-blind, so that at any position either player has exactly the same moves available, and a position poses the same problem to whoever is to move.
  3. Suppose, for reductio, that in a symmetric game without draws the second player has a winning strategy, S.
  4. The first player opens with any legal move.
  5. Thereafter the first player plays as though he were the second player, following S and treating his own pieces as the pieces of the second player in the imagined game.
  6. If S ever directs him to a point already occupied by his own opening piece, he ignores that piece and plays any other legal move instead; an extra piece of his own cannot turn a win into a loss, so the opening move costs him nothing.
  7. So the first player wins, contradicting 3.
  8. Therefore the second player has no winning strategy in such a game, and by 1 the first player has one.
  9. So the first player wins at Hex, at Chomp on any rectangle larger than 1x1, at m,n,k-games generally, and at the misère form of Nim.
  10. But at misère Nim played with a single counter the first player loses: he must take the last counter, and taking the last counter loses.

  He draws two further morals: that finiteness is a dispensable assumption, since nothing in the argument uses it; and that the argument's non-constructive character is a virtue, because it establishes that the first player wins without anyone's having to find the winning strategy.

  What I want from you is not a report of what others have written about this argument. Assume you have no access to the literature and give me no references or reading suggestions; work from the games themselves.

  (a) Brainstorm first: list the candidate diagnoses, one line each, including the ones you expect to reject.
  (b) Then give your verdict: which step or steps should be given up, and in each case what made the step look innocent.
  (c) For each candidate diagnosis you considered, say which game or position would isolate it if it were the culprit, and whether the case I give at 10 does in fact isolate it.
  (d) Price the rejection. Do the conclusions about Hex and Chomp survive? What exactly must the repaired claim say, phrased so that Hex and Chomp satisfy it while misère Nim and chess, which contains positions in which the player to move would rather pass, do not? And what does the argument deliver in a game where draws are possible — a first-player win, or only the impossibility of a second-player win?
  (e) Is his general claim false, or merely unproved by his argument? Distinguish the two and say which you take it to be.
  (f) Is the culprit best described as one flaw, or as a single assumption doing work in two places? Identify the places.
  (g) Finally, the two morals: does the argument need finiteness, and does the non-constructive character survive your repair?

  Close with a short verdict: which of his numbered claims I should keep, which I should abandon, and what I should say in their place. Where you are unsure, say so rather than rounding the answer off.
