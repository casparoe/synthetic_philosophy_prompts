          *   *Analysis:* This is the strongest critique. It touches on the source of normativity. CRE often relies on *yi* (rightness) to filter roles, but where does *yi* come from if not outside the role?
          *   *Verdict:* High severity.

      *   *(2) Dissolution of Roles (The Ontological Problem):* If self = roles, what happens when roles vanish (widowhood, retirement, exile)? Is it death?
          *   *Analysis:* CRE might argue one *always* has roles (even "elder," "ancestor," "stranger"). But if radical isolation occurs, does the self vanish? This feels counter-intuitive to modern experience of identity.
