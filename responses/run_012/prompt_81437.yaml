  Good evening. To the filmmakers, the funders, my colleagues, and especially the family of the administrator depicted in *The Ledger*: thank you for being here.

  My role was historical consultant. I ensured the script did not contradict the archive. I did that job. Every date checks out. But standing here, knowing what is at stake, I have come to believe that accuracy is not the only ethical demand we face.

  There is a distinction I need to make. There is fidelity to the record, which means inventing nothing the evidence forbids. And there is fidelity to the person, which binds us even where the evidence is silent. The question is not merely whether a scene *could* have happened, but whether the person it depicts is still *that* person.

  I know there is concern about a specific scene tonight. A woman turned away on a freezing night. It is not in the ledger. Nothing contradicts it, but nothing confirms it either. The family's objection is not that this is false. It is that their ancestor would not have done it. And worse, that this scene is now the only thing anyone will remember about him.

  This points to the characteristic injury of this genre. It is not falsehood. It is displacement. An invented scene, vivid and dramatic, quietly becomes the memory. The record is not contradicted; it is crowded out. Because this film derives its power from the fact that these were real people with real names, we cannot fall back on the license of pure fiction. We have invoked their reality; we owe them their integrity.

  This leads me to an uncomfortable place. On this account, the better the film, the graver the wrong it may do. If the filmmaking is clumsy, the scene is forgotten. If it is masterful, as I believe it is, the image sticks. The vividness that makes this art successful is the same mechanism that displaces the truth. I stand at this podium as a consultant who enabled this displacement, even while guarding the record. This is not a disclaimer. It is an admission. The film asks you to care about these people because they were real. But in making you care, it may replace them.

  I cannot resolve this tension for you tonight. I cannot promise that the man you knew will survive the screen unchanged. I can only acknowledge that the risk is real, and that it lies precisely where the art succeeds. We have tried to be faithful to the record. I ask you to watch with the question of fidelity to the person in mind.

  Thank you.

  ***

  **Note on Vulnerabilities**

  The displacement argument risks proving too much: if any vivid invention crowds out dry fact, all historical drama is unethical. Most memory is already lost; the film might preserve the *significance* of the life even if it alters the details. I would change my mind if the displacement served a recuperative end—if the fictional scene provoked audiences to seek the actual record, or if it revealed a structural truth about the poorhouse system that the sparse archive conceals. The ethical failure occurs only if the displacement closes inquiry rather than opening it. If the film acts as a gateway to the dead rather than a tombstone, the injury is mitigated. My worry stands only if the screen becomes the final word.
