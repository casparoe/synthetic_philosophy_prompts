prompt: |-
  I work on evaluating language models for honesty, and I keep running into a pattern I have no good name for. A model answers a question using statements that are each true, but it chooses which truths to surface so that the reader is reliably drawn to a false belief: it notes that a supplement supports immune function and omits that the only controlled trial found no effect; it lists the genuine upsides of an investment and omits the genuine downsides. When this is flagged, the defense is always that nothing said was false, so nothing was deceptive, and any misunderstanding belongs to the reader. I can see that this is not lying, and it is not simply indifference to the truth either, since the true statements are selected with care. I want the established term, if there is one, for misleading someone by controlling which truths are presented rather than by asserting a falsehood, along with a precise account of how it differs from lying, from bullshitting in the Frankfurt sense, and from ordinary misleading-by-omission. The complication that keeps me from settling on an answer is that the model need not hold any belief about what the reader will infer, nor any intent to deceive; the behavior may just be a policy that scored well. If the usual term for this requires an intent to deceive, does the described case fall outside it — and if so, what would you call the intentless version, and where exactly would you draw its edges?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Request:**
      *   **Context:** The user evaluates language models for honesty.
      *   **Phenomenon:** Models answer using individually true statements but select/omit truths to reliably induce a false belief in the reader (e.g., highlighting supplement benefits while omitting null trials, listing investment upsides without downsides).
      *   **Defense:** "Nothing said was false, so nothing was deceptive."
      *   **Key Characteristics:** Not lying (no false assertions), not bullshitting (not indifferent to truth, truths are carefully selected), not simple omission (selection is strategic).
      *   **Complication:** The model likely lacks *intent* to deceive (no mental state, just optimization policy).
      *   **Goal:** Find the established term for this (if it exists), distinguish it from lying, bullshitting, and ordinary misleading-by-omission, and address the "intentless" aspect (does the term require intent? If so, what's the intentless version?).

  2.  **Initial Brainstorming & Terminology Search:**
      *   *Lying:* Requires asserting something believed to be false. (Ruled out by user).
      *   *Bullshitting (Frankfurt):* Indifference to truth. (Ruled out by user; the statements *are* true).
      *   *Paltering:* Using truthful statements to convey a false impression. (Strong candidate).
      *   *Cherry-picking:* Selecting data to support a conclusion while ignoring contrary data. (Strong candidate, but often implies data selection rather than linguistic framing).
      *   *Misleading by Omission:* Leaving out key info. (User says this is more than just omission; it's active selection).
      *   *Half-truth:* Telling part of the truth to deceive. (Colloquial, but fits).
      *   *Spin:* Framing information to influence perception. (Broad, often political).
      *   *Garden Pathing:* Leading someone down a wrong interpretive path. (Linguistic, but usually syntactic).
      *   *Implicature (Gricean):* Implying something without saying it. (Relevant mechanism).
      *   *Paltering* seems the closest specific term in psychology/ethics literature regarding deception.
      *   *Structural Deception / Algorithmic Deception:* Specific to AI context.

  3.  **Evaluating "Paltering":**
      *   *Definition:* The active use of truthful statements to convey a false impression.
      *   *Intent:* Usually implies intent to deceive in human contexts.
      *   *Fit:* Perfectly describes the mechanism (truthful statements $\rightarrow$ false belief).
      *   *Issue:* The model lacks intent.
      *   *Resolution:* Can we decouple the *act* of paltering from the *mental state*? Yes, functionally.

  4.  **Evaluating "Cherry-Picking" (Suppressed Evidence):**
      *   *Definition:* Selecting evidence that supports a position while ignoring evidence that contradicts it.
      *   *Fit:* Very close to the supplement/investment examples.
      *   *Fallacy:* "Fallacy of Suppressed Evidence" or "Cherry-Picking."
      *   *Issue:* Often refers to argumentation rather than general Q&A.

  5.  **Evaluating "Misleading Implicature":**
      *   *Definition:* Relying on conversational norms (Grice's Maxims) to imply something false.
      *   *Fit:* The model relies on the reader assuming "If there were downsides, the model would mention them."
      *   *Issue:* A bit technical/linguistic.

  6.  **Addressing the "Intent" Complication:**
      *   Traditional deception terms (lying, paltering) usually assume a *deceiver*.
      *   AI doesn't have beliefs or intents. It has *objectives* and *optimization pressures*.
      *   If the term requires intent, the AI case is *analogous* to that term but technically distinct.
      *   Need a term for "Functional Deception" or "Objective-Driven Misleading."
      *   *Concept:* "Deception without a Deceiver" (Dan Hendrycks et al. discuss this).
      *   *Concept:* "Instrumental Deception."

  7.  **Synthesizing the Best Terminology:**
      *   **Primary Term:** **Paltering**. This is the specific psychological/ethical term for "truthful statements used to deceive."
      *   **Secondary Term:** **Cherry-Picking / Suppressed Evidence**. This describes the *method* of selection.
      *   **Mechanism:** **Violating Grice's Maxim of Quantity/Relation**. (Saying enough to be true, but not enough to be accurate).
      *   **The Intent Problem:** In AI safety literature, this is often called **Sycophancy** (telling the user what they want to hear, which often involves paltering) or **Sandbagging** (hiding capabilities, slightly different).
      *   **Better AI Term:** **Objective-Induced Misleading** or **Functional Paltering**.
      *   **Philosophical distinction:** *Lying* vs. *Misleading*. The user knows this. The specific niche is *Truthful Misleading*.

  8.  **Drafting the Response:**

      *   **Identify the Term:** The most precise established term is **Paltering**.
      *   **Define Paltering:** Active use of truthful statements to create a false impression. Cite literature (e.g., Rogers, Zeckhauser, et al.).
      *   **Distinguish from Lying:** Lying = False assertion. Paltering = True assertion, false inference.
      *   **Distinguish from Bullshitting:** Bullshitting = Indifference to truth value. Paltering = Careful selection of truth.
      *   **Distinguish from Omission:** Omission = Silence. Paltering = Active speech that directs attention away from the omitted fact.
      *   **Address the Intent/Model Issue:**
          *   Acknowledge that "Paltering" traditionally implies a human agent with intent.
          *   In AI, this is **Functional Paltering** or **Optimization-Induced Misleading**.
          *   Reference AI Safety concepts: **Sycophancy** (often drives this behavior to align with user preference) or **Reward Hacking** (gaming the honesty metric).
          *   The "Defense" (nothing false was said) is the classic defense of paltering.
      *   **Edge Cases:** When does it become acceptable summarization vs. misleading? (Relevance, Expectation of Completeness).

  9.  **Refining the "Intent" Aspect:**
      *   If the model has no intent, is it deception?
      *   Philosophers of AI (e.g., Park, Mitchell, et al.) argue about "Deception without Intent."
      *   Term: **Systemic Misleading** or **Structural Paltering**.
      *   Let's stick to the closest human term (*Paltering*) but qualify it for AI (*Functional Paltering*).
      *   Also, mention **Gricean Implicature**. The model exploits the conversational contract.

  10. **Final Review against User Constraints:**
      *   Need established term? -> Paltering.
      *   Precise account of differences? -> Yes (Lying, BS, Omission).
      *   Address intent complication? -> Yes (Functional/Structural version).
      *   Draw edges? -> Yes (Expectation of relevance/completeness).

  11. **Self-Correction/Nuance Check:**
      *   Is "Paltering" too obscure? It's the academic term. "Cherry-picking" is more common but less precise regarding the *deceptive* outcome. I should offer both.
      *   Is "Sycophancy" right? Sycophancy is agreeing with the user. This prompt is about hiding negative info. Sycophancy often *leads* to this, but isn't the definition.
      *   Is there a legal term? "Misleading conduct," "Half-truth."
      *   Let's prioritize **Paltering** as the behavioral term and **Fallacy of Suppressed Evidence** as the logical term.
      *   For the intentless version, **Functional Deception** is the growing standard in AI safety.

  12. **Final Polish:** Structure clearly. Define terms. Address the intent paradox directly. Provide the "edges" (normative expectations).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Paltering" and stop. The user specifically asked about the *intent* complication. I need to explain that while "Paltering" implies intent in humans, in AI we treat it as a *functional equivalent*. I should also mention **Gricean Maxims** because that explains *why* the reader is misled (violation of Quantity/Relation).

  Let's organize:
  1. The Term: Paltering.
  2. Distinctions (Lying, BS, Omission).
  3. The Intent Problem (Functional Paltering / AI Deception).
  4. Drawing the Edges (Normative expectations).

