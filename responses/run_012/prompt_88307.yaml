answer: |-
  This is a remarkably sharp diagnosis of the current state of population ethics. You have correctly identified that the stalemate is not due to a lack of intelligence on either side, but rather a structural feature of the problem itself.

  As a geologist, you are used to looking for fault lines—places where stress builds up because the underlying structures are incompatible. In population ethics, we have found those fault lines.

  Here is the diagnosis you asked for, broken down by the categories you proposed, followed by an assessment of your hypothesis and what actually counts as progress.

  ### 1. The Diagnosis: Is it Fact, Value, Verbal, or Formal?

  It is primarily a **Formal/Structural** problem, disguised as a **Conceptual** one.

  **The Formal Diagnosis (The Impossibility Theorems)**
  You asked if there is a "hidden formal question underneath, e.g. whether a short list of innocuous-sounding conditions... can all hold at once."
  **Yes.** This is the most significant development in this field in the last 20 years, and it explains the stalemate.

  The Swedish philosopher Gustaf Arrhenius has proven a series of **Impossibility Theorems** in population ethics. He demonstrated mathematically that no population axiology can satisfy a set of very weak, plausible adequacy conditions simultaneously. These conditions include things like:
  *   **The Asymmetry:** (Exactly what you described: creating miserable people is bad; creating happy people is not obligatory/good in the same way).
  *   **Non-Elitism:** A very good life is better than a very bad one.
  *   **Dominance:** If population A is the same as B except everyone in A is better off, A is better.
  *   **Non-Sadism:** It is not better to add people with negative welfare than people with positive welfare.

  Arrhenius showed that these conditions are **logically inconsistent**. You cannot have the Procreation Asymmetry *and* avoid the Repugnant Conclusion *and* satisfy basic dominance principles all at once. Something has to give.

  **Why this explains the stalemate:**
  The reason the debate hasn't moved is that both sides are clinging to different axioms in an inconsistent set.
  *   The **Asymmetry proponents** (like David Benatar) prioritize the intuition about harm/non-existence. To make this work, they must accept counter-intuitive results elsewhere (e.g., that it doesn't matter how many happy people you *don't* create).
  *   The **Impersonal proponents** (Total Utilitarians) prioritize consistency and dominance. To make this work, they must accept the Repugnant Conclusion (a massive population of barely worth-living lives is better than a small happy one).

  Neither side is being stupid; they are simply choosing which axiom to sacrifice in an impossible system.

  **The Conceptual Diagnosis (The "Better For" Problem)**
  You asked if it is a verbal dispute about what "better" is doing.
  **Yes, but it's deeper than semantics.** It is a metaphysical dispute about the **subject of predication**.

  Standard moral logic assumes a "subject-affecting" structure: *X is better than Y* usually implies *X is better **for** S than Y is for S.*
  *   **Existence vs. Non-Existence:** If you exist, there is a "you" for whom life can be bad. If you never exist, there is no "you" for whom non-existence is a deprivation.
  *   **The Critic's Charge:** Critics argue that Asymmetry proponents are equivocal. They say the "absence of pain" is good (impersonal good) but the "absence of pleasure" is not bad (person-affecting bad). They accuse proponents of switching the metric mid-argument to preserve the intuition.
  *   **The Proponent's Defense:** They argue that "harm" requires a subject, but "bad states of affairs" do not. Pain is a bad state of affairs even if no one experiences the "good" of its absence.

  ### 2. Assessment of Your Hypothesis

  > *My own half-formed hypothesis is that everything turns on whether 'better' has to be better **for** somebody, and that once you allow it to be better **simpliciter** you've quietly changed the subject.*

  **You are exactly right.** This is the distinction between the **Person-Affecting View** and the **Impersonal View**.

  *   **Person-Affecting (Your "Better For"):** An outcome can only be better if it is better for some particular person. Since non-existent people cannot be deprived, creating a happy person is not "better" than not creating them (because there was no one waiting to be benefited). This validates the Asymmetry.
  *   **Impersonal (Your "Better Simpliciter"):** Outcomes can be ranked by the total amount of value in them, regardless of who holds it. Creating a happy person adds value to the universe, so it is *simpliciter* better. This kills the Asymmetry but leads to the Repugnant Conclusion.

  **Is this just you importing your old habit of asking what a comparison is relative to?**
  No. In fact, you have intuitively grasped the central technical distinction in the field. In geology, you cannot measure strain without a reference frame. In ethics, you cannot measure "better" without a subject (or a decision to measure impersonal states). The stalemate exists because philosophy has not agreed on the reference frame.

  However, calling it "changing the subject" is where the diagnosis needs nuance. It's not necessarily a fallacy to switch to *impersonal* good; it's a substantive moral claim that the universe's total value matters independently of subjects. The disagreement isn't just verbal; it's about whether morality is fundamentally about **welfare of agents** or **states of the world**.

  ### 3. Are they answering different questions?

  > *Is it two camps answering different questions under one heading — one about which outcomes are good, one about what we owe to people who are or will be actual?*

  **Yes.** This is the distinction between **Axiology** (Theory of Value) and **Deontology** (Theory of Duty/Obligation).

  *   **The Asymmetry Camp** is often arguing from a Deontological intuition: "What do we owe to potential people?" Their answer: We owe them not to harm them, but we owe them nothing to bring them into existence.
  *   **The Impersonal Camp** is arguing from an Axiological intuition: "Which state of affairs contains more value?" Their answer: A world with more happy people contains more value.

  The frustration arises because they are using the same words ("better," "should," "harm") to answer different questions. When an Impersonalist says "You should have a child (to add value)," the Person-Affectingist hears "You owe it to that child," which they reject as incoherent.

  ### 4. What Counts as Progress?

  If the Impossibility Theorems are correct, we will never have a "proof" that one side is right, because the system is inconsistent. So, what counts as progress?

  **1. Mapping the Trade-offs (The "Cost" of Views)**
  Progress is no longer defined as finding the "True Theory." It is defined as clarity on **which intuitions a theory forces you to abandon.**
  *   *Old Progress:* "I have a theory that saves all our intuitions." (False hope)
  *   *New Progress:* "If you accept the Asymmetry, you must accept that saving a future happy generation is not morally preferable to letting humanity go extinct, provided the extinction is painless."
  This forces proponents to own the consequences of their axioms rather than hiding them.

  **2. Distinguishing "Same Number" vs. "Different Number" Choices**
  Progress has been made in separating cases where we choose *who* exists (Non-Identity Problem) vs. *how many* exist. Some theories work for one but not the other. Acknowledging that we might need **two different ethical frameworks** for these two scenarios is a form of progress (theoretical pluralism).

  **3. Reflective Equilibrium**
  Progress is achieving a stable "Reflective Equilibrium." This is a scientific modeling concept applied to ethics. You adjust your specific intuitions and your general principles until they cohere.
  *   For the Asymmetry proponent, progress is admitting: "I value the asymmetry so much I am willing to accept that adding happy people is morally neutral."
  *   For the Utilitarian, progress is admitting: "I value consistency so much I am willing to accept the Repugnant Conclusion."
  When both sides admit the "cost" of their model, the shouting stops, and the real philosophical work begins.

  ### Summary for a Geologist

  Imagine two models of a sedimentary basin.
  *   **Model A (Asymmetry)** fits the well-log data (our intuitions about harm) perfectly but violates the laws of thermodynamics (logical consistency/dominance).
  *   **Model B (Impersonal)** obeys the laws of thermodynamics perfectly but predicts reservoir pressures that seem physically impossible (the Repugnant Conclusion).

  The debate is stalled because both sides are insisting their model is the "true" geology.
  **The Progress:** Acknowledging that the data (intuitions) and the laws (logic) are currently incompatible in this specific domain. The goal is not to prove one model is "real," but to determine which error is more tolerable for the specific engineering problem (policy decision) at hand.

  **Verdict on your hypothesis:** It is not a habit from your old life; it is the correct structural diagnosis. The comparison requires a subject. Denying that requires a shift to impersonal value. The stalemate is the friction between those two frameworks, compounded by the formal proof that they cannot be reconciled. Progress is not a solution, but a precise map of the inconsistency.
