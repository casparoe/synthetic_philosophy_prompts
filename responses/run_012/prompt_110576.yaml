answer: |-
  You are framing this as a binary choice: **Let them on** vs. **Keep them off.** That is the wrong question.

  If the generator is already "close to the ceiling," adding unregulated load is not a moral decision; it is a physical hazard. If you say "Yes" without conditions, you are gambling with your mother's oxygen and the Hendersons' baby. If you say "No" without conditions, you are burning a bridge with neighbors who hold leverage over you (the easement) and leaving an infant in the cold.

  Here is the real read on what you are weighing, where the framing is broken, and the uncertainties you need to sit with.

  ### 1. The Framing Error
  You are asking, "Can we absorb this load?"
  The actual question is: **"Who is currently consuming non-essential power that must be cut to make room for essential human safety?"**

  A generator doesn't care about fairness; it cares about kilowatts. If the system is at 90% capacity, you cannot add a house at 20% capacity without shedding 20% elsewhere. The "No" vote from your neighbors is based on *their* unwillingness to shed load. The "Yes" vote from your wife is based on *moral* capacity, not *electrical* capacity.

  The person with the chest freezer full of beef is the key variable. A chest freezer on a generator during a crisis is a luxury. Your mom's oxygen and a four-month-old baby's heat are necessities. By framing this as "Hendersons vs. Us," you are letting the Beef Neighbor off the hook. He is the one creating the scarcity.

  ### 2. The Risk of the "Trip"
  You mentioned if it trips, it's an hour restart in the cold.
  *   **For you:** This is life-threatening for your mother.
  *   **For the Hendersons:** This is dangerous for the infant.
  *   **For the Beef Neighbor:** This is an inconvenience for his steak.

  If you let the Hendersons on without a hard, enforceable agreement on load shedding, and the generator trips, **you** will be blamed. Not the Beef Neighbor, not the other two naysayers. You are the spokesperson. If the system fails after you said "Yes," the social contract on that road breaks permanently. You will be the one who killed the oxygen machine.

  ### 3. The Moral Debt (Your Wife's Point)
  Your wife is right about the easement. If they let you run a line across their field, you have a dependency on their goodwill. Cutting them off now could lead to them revoking that easement later, or creating a hostile environment when the next storm hits.
  However, charity cannot override physics. You cannot keep the peace by blowing the transformer.

  ### 4. What You Are Weighing Besides Load
  *   **Liability:** If the generator fails and your mother is harmed, legally and morally, does the burden fall on you for authorizing the extra load?
  *   **Precedent:** If you let them on now, do they become part of the collective forever? Do they contribute to fuel? Maintenance? Or are they permanent dependents?
  *   **Enforcement:** Who watches the meter? If the Hendersons turn on a space heater "just for an hour" and trip the system, who stops them? The current group of five has a mechanism (peer pressure). The Hendersons are outsiders.
  *   **The Shelter:** You said the road isn't plowed. Is it *impassable* or just *difficult*? If it's impassable, the Hendersons have no alternative. If it's just difficult, the risk calculation changes.

  ### 5. Where I Am Least Sure
  *   **The Electrical Margin:** I don't know if "close to the ceiling" means 95% load or 80%. There is a difference between "risky" and "impossible." A professional electrician might say there's enough surge capacity for a few lights and a fridge, but not a well pump or dryer.
  *   **The Beef Neighbor's Reaction:** If you go to him and say, "Turn off the freezer to save the baby," does he comply, or does he become hostile? If he becomes hostile, the social cohesion of the road breaks anyway.
  *   **The Hendersons' Actual Draw:** Do they know how to run a house on generator power? If they plug in a space heater because they don't understand the stakes, they become a liability.

  ### The Recommendation
  Do not give a Yes or No tomorrow. Give a **Conditional Yes.**

  **The Script:**
  *"We want to help the Hendersons, especially with the baby. But the generator is at max capacity. We can't add them without dropping load elsewhere, or we risk tripping the system and losing the oxygen machine and heat for everyone. We are willing to take them on IF the group agrees to ration non-essentials to make room."*

  **Why this works:**
  1.  **It shifts the burden:** It's no longer You vs. Hendersons. It is The Road vs. The Limit.
  2.  **It targets the Beef:** It forces the group to look at the freezer. If the Beef Neighbor refuses to cut his load, *he* is the one saying no to the baby, not you.
  3.  **It protects your Mother:** It makes the acceptance contingent on safety margins.
  4.  **It honors your Wife:** It acknowledges the debt to the Hendersons without signing a suicide pact.

  **The Hard Part:**
  You have to be willing to walk away if the load shedding doesn't happen. If the Beef Neighbor won't cut the freezer, and the other two won't budge, you **cannot** let the Hendersons on. Not because you don't care, but because if the generator trips, your mother's health is the immediate casualty you control.

  **Summary:**
  You are trying to solve a resource allocation problem with a binary vote. Stop it. Make it a resource management problem. If the group won't ration to save a baby and keep the oxygen on, the group has bigger problems than the storm. But you cannot sacrifice your mother's safety to fix their morality.

  Make the "Yes" dependent on the "Beef" turning off. If he won't, the answer is No, and that is on him, not you.
