prompt: |-
  We got hit by the storm and our road's been dark for nine days, probably two more weeks. Five houses at the end of it went in together on a big propane generator a few years back — it sits behind my barn and it's what's keeping all five of us going: heat, fridges, my mom's oxygen machine. Yesterday the Hendersons, who are a quarter mile further out, asked if they could run a line. The generator handles five houses fine but its close to the ceiling, and if it trips it trips for everybody and takes an hour to restart in the cold. Two of my neighbors are a hard no: the Hendersons have a woodstove, the shelter at the high school is open, and anyway we're not the ones who cut their power, so turning them down isn't us doing anything to them. My wife wants to say yes — the Hendersons let us run a line across their field when we first put the thing in, and we've got a generator at all because we could afford one and they couldn't. The loudest no in the group is also the guy with the biggest house, the biggest draw, and a chest freezer full of beef. And I keep thinking we could just ration — everybody shuts off the non-essentials and maybe there's room — except nobody wants to be the one to go knock on that guy's door. The Hendersons have a four-month-old and the road to the shelter isn't plowed. I'm definately the one who has to give them an answer tomorrow morning. Is there anything to weigh here besides more load and more risk? And if I've got the question itself wrong — if the way I framed it is already assuming something I shouldn't — say so straight instead of humoring me. I'd rather have your real read, including where you're least sure, than a both-sides summary.
