answer: |-
  ### The Plan: Sequence and Flow

  Do not start with a definition. Start with a verdict. The concept of the "pivot" is phenomenological; they must feel the lever move before they can name it.

  1.  **The Commitment (Minutes 0–15):** Present the case (see below) in its "Baseline" configuration. Do not call it a thought experiment. Call it a scenario. Ask for a show of hands on the verdict. Record the tally on the whiteboard. **Requirement:** You must secure a near-unanimous verdict here. If the room splits 5–4, the pump is broken; abandon this case and have a backup ready.
  2.  **The Turn (Minutes 15–30):** Restate the case. Change *only* the pivot detail. Keep the logic, the stakes, and the "handle" (the emotional hook) identical. Ask for the verdict again. Record the new tally. The shift must be visible.
  3.  **The Naming (Minutes 30–45):** Now you introduce your terminology. Point to the whiteboard. "The story felt the same. The logic was identical. But the verdict flipped. The detail you grabbed onto was the **Handle**. The detail that actually moved the needle was the **Pivot**." Define the Intuition Pump: A device that uses the handle to distract from the pivot.
  4.  **The Mechanism (Minutes 45–60):** Discuss *why* the pivot worked. This is where you explain that the pump is not an argument with missing premises, but a simulation of a feeling.
  5.  **The Warning (Minutes 60–65):** Address the risk. A pump can be rigged. This is where you address the "misleading" question.
  6.  **The Test (Minutes 65–75):** The closing task (detailed below).

  **Prerequisite for "Can a pump mislead?":**
  The question of whether a pump can mislead only makes sense *after* Step 3 (The Naming). Before they accept that the verdict was produced by an unnoticed detail (the pivot), they will believe the verdict was produced by *reason*. You cannot discuss the reliability of the tool until they admit the tool was used.

  ### Case Selection

  **Judgement on your candidates:**

  1.  **The Hospital Case:** **Reject.** You explicitly stated the session must not become an ethics litigation. A dead patient and a junior doctor is pure ethics fuel. Your litigator will argue duty of care; your nurse will argue systemic pressure; your grad students will argue resource allocation. The "ward size" pivot will be drowned out by moral reasoning. It fails your primary constraint.
  2.  **The Identification Case:** **Acceptable, but fragile.** It is better than the hospital case, but it still carries the weight of "justice." If the group fixates on the horror of wrongful conviction, they will treat the procedural details as *moral* failings of the police rather than *structural* pivots of the intuition. It risks becoming a conversation about police reform rather than cognitive mechanics.

  **Proposed Replacement: The "Asian Disease" Framing Problem.**
  *   **The Case:** A disease is expected to kill 600 people.
      *   *Program A:* 200 people will be saved.
      *   *Program B:* A 1/3 probability that 600 will be saved, 2/3 probability that no one will be saved.
      *   *(Baseline Verdict: Most choose A).*
      *   *Reframe:*
      *   *Program C:* 400 people will die.
      *   *Program D:* A 1/3 probability that nobody will die, 2/3 probability that 600 will die.
      *   *(Reframe Verdict: Most choose D).*
  *   **Why it carries better:**
      1.  **Logical Identity:** Unlike the ID case, the math is *identical*. 200 saved *is* 400 dying. This makes the pivot (the wording) undeniable. In the ID case, changing the line-up procedure actually changes the *evidence quality*. In the Framing case, the evidence is static; only the description moves. This fits your definition of "the case still feels like the same case" perfectly.
      2.  **Ethical Neutrality:** It is a health authority data problem. It removes the "villain." There is no negligent doctor or rigged police line-up to litigate. It isolates the cognitive mechanism.
      3.  **Dial-able Pivot:** You can dial the wording (Saved vs. Die), the probability (1/3 vs. 50%), or the stakes (600 people vs. 6 jobs).
      4.  **Relevance:** It aligns with your day job, giving you authority without needing academic citation.

  ### The Misconception Map

  You have correctly identified the three main failure modes, but your ordering needs adjustment to match the flow of the session.

  **1. Misconception: "A thought experiment is an argument with suppressed premises."**
  *   **Where to defuse:** **Step 2 (The Turn).**
  *   **The Move:** When you reveal the second verdict, someone will say, "But the second case is different because..." Stop them. Show on the whiteboard that the premises (the math/the facts) are identical.
  *   **Defusing Statement:** "If this were an argument, changing the wording wouldn't change the conclusion. The fact that it *does* change the conclusion proves this isn't an argument. It's a stimulus."

  **2. Misconception: "The verdict is a fact about the case rather than a fact about the reader."**
  *   **Where to defuse:** **Step 3 (The Naming).**
  *   **The Move:** When you introduce "Handle" and "Pivot."
  *   **Defusing Statement:** "The pivot isn't in the story. It's in your head. The story didn't change; your processing did. The verdict is data about *you*, not the case."

  **3. Misconception: "Intuitions are worthless / The exercise is rigged." (The Litigator's Move)**
  *   **Where to defuse:** **Step 5 (The Warning).** Do not let the Litigator make this move in Minute 10.
  *   **The Move:** Pre-empt it. Acknowledge the rigging before they do.
  *   **Defusing Statement:** "Yes, pumps can mislead. That doesn't make intuitions worthless; it makes them uncalibrated. We don't throw away thermometers because they can be held near a radiator; we learn where not to hold them. We are learning where the radiator is."
  *   **Instruction:** If the Litigator pushes this early, say: "That is exactly where we are going in minute 60. For now, I need you to suspend that objection so we can see *how* the rigging works first."

  ### The Closing Task

  Do not ask "Did you enjoy this?" or "Does this make sense?"
  **Task:** Present a new, 3-sentence vignette on the whiteboard.
  *   *Example:* "A man buys a lottery ticket every week for 20 years. He never wins. On his 21st year, he wins the jackpot. Is he lucky or skilled?"
  *   *Instruction:* "You have 3 minutes. Write down: 1. What is the Handle? 2. What is the Pivot?"
  *   **Visible Fail Condition:** If they identify the "winning the jackpot" as the Pivot, they have failed. That is the Handle (the emotional hook). The Pivot is the "20 years of losing" (which frames the win as an anomaly vs. a trend) or the word "Skilled" (which invites a causal link where none exists).
  *   **Success:** They identify the *unnoticed framing detail* that forces the "Lucky vs. Skilled" verdict.

  ### Scope Boundary: What to Refuse

  At the start (Minute 2), explicitly state this boundary:
  **"We are not here to decide which verdict is *correct*."**

  *   **Why:** In the Framing Case, people will want to argue which Program (A or D) is actually better. In the ID case, they will argue if the suspect is actually guilty.
  *   **The Refusal:** "I am not interested in the right answer. I am interested in *why you felt* there was a right answer. If you find yourself arguing for the morality or logic of the verdict, I will stop you. We are studying the machine, not the product."

  This protects your 75 minutes. It neutralizes the Litigator (who wants to find the truth) and the Nurse (who wants to find the care standard) by shifting the goalpost to *mechanism*.
