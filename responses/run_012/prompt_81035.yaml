prompt: |-
  I started a new job three weeks ago as an analyst at a mid-size foundation that does effective-altruism-flavored grantmaking, and I think I might be in over my head. My first assignment is basically "explain our methodology to the board," and the more I stare at it the less I understand what we're actually committed to.

  Here's the practice, as concretely as I can put it. We rank every grant by expected value per dollar, and the top of the list is always a moonshot. Right now it's a $2M grant whose entire case rests on roughly a 1-in-20,000 chance of helping head off a global catastrophe. Our own model says that makes it worth something like 50,000x a bed net grant that saves lives with near-certainty. Fine, that's what the arithmetic says. But the same organization also: caps annual spending at 4-5% of assets, applies a discount rate to benefits far in the future, and runs a "robustness" screen that quietly kills any grant whose expected value comes from a single tiny probability. So one part of our process treats a 1-in-20,000 shot at something astronomically big as decisive, and another part acts like probabilities that small dont count at all. My boss calls it "hits-based giving" and says not to worry about it.

  I'd like you to act as a philosopher of decision theory — someone who actually works on expected value, risk, and rational choice — and help me figure out what theory of rational choice this practice presupposes. Please think carefully here and dont just give me the textbook answer, because I need to know what our process actually commits us to. Brainstorm first: lay out the rival views about what a practice like this could be committed to, then argue for the one that really fits, then say where it's genuinely underdetermined.

  There's alot I keep going back and forth on:

  - Does it presuppose that maximizing expected value is the correct decision rule — the thing people call fanaticism, where you're required to take a 1-in-a-trillion chance at a big enough payoff? And if so, is it fanaticism about the values themselves (the payoffs really are that huge, and commensurable with ordinary ones) or just about the arithmetic?
  - Or can the whole thing — the ranking, the spending cap, the discounting, the robustness screen — be reconstructed on a risk-averse or bounded rule, or on the idea that our probability estimates for tiny-probability catastrophes are so unreliable that they should be shrunk toward zero? Is the inconsistency a real incoherence, or does it track a distinction between trusting a value estimate and trusting a probability estimate?
  - What would have to change in the practice if we replaced the presupposed view with a more moderate one? Would anything actually break, or would it just reorder the list?

  Please write in American English, and be concrete — use our numbers where they help. And if I'm conflating two different questions (what's valuable vs. what it's rational to do), just say so, because I probably am.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** New analyst (3 weeks in) at a mid-size effective altruism (EA) flavored foundation.
      *   **Problem:** Feels "in over my head." The foundation's grantmaking methodology seems internally inconsistent (ranking by EV favors moonshots, but operational constraints like spending caps, discounting, and robustness screens dampen them).
      *   **Task:** Act as a philosopher of decision theory. Explain what theory of rational choice the practice *actually* presupposes.
      *   **Constraints:**
          *   Think carefully, don't give the textbook answer.
          *   Brainstorm rival views first.
          *   Argue for the best fit.
          *   Identify where the practice is underdetermined.
          *   Address specific questions (fanaticism vs. risk-aversion, value vs. rationality).
          *   Use American English.
          *   Be concrete (use the provided numbers: $2M grant, 1-in-20,000 chance, 50,000x bed net, 4-5% spending cap).
          *   Tone: Professional, analytical, empathetic to the confusion, philosophically rigorous but accessible.

  2.  **Deconstruct the Foundation's Practice:**
      *   *Feature A (Ranking):* Pure Expected Value (EV) maximization. $2M grant, $p = 1/20,000$, Value = $50,000 \times$ Bed Net. This implies Fanaticism (longtermism).
      *   *Feature B (Spending Cap):* 4-5% of assets. This implies sustainability/endowment preservation, not "burn it all down on the best bet."
      *   *Feature C (Discounting):* Future benefits discounted. This counters the infinite/longtermist value accumulation.
      *   *Feature D (Robustness Screen):* Kills grants based on single tiny probabilities. This implies skepticism of extreme uncertainty or risk-aversion.
      *   *The Tension:* Feature A says "Go big on the moonshot." Features B, C, and D say "Hold back, be careful, don't trust the numbers."

  3.  **Brainstorm Rival Theoretical Interpretations:**
      *   *View 1: Naive EV Maximization (Fanaticism).* The foundation *says* it does this, but the constraints contradict it. If they truly believed EV, they'd leverage assets, ignore discounting for existential risk, and ignore robustness screens that block high-EV tails.
      *   *View 2: Risk-Weighted Expected Utility (RWEU).* They care about EV but penalize variance/uncertainty. The robustness screen is a proxy for epistemic risk.
      *   *View 3: Epistemic Humility / Bayesian Shrinkage.* The probabilities aren't *really* 1/20,000. They are noisy estimates. The "robustness screen" is a heuristic for "your prior should dominate this weak evidence."
      *   *View 4: Institutional/Pragmatic Hybrid.* The theory isn't a single decision rule. It's a division of labor. The *analysts* calculate EV to find opportunities; the *institution* applies constraints to survive. It's "EV maximization subject to survival constraints."
      *   *View 5: Satisficing / Threshold.* They want "good enough" high EV, but not at the cost of total ruin.

  4.  **Select the Best Fit:**
      *   View 1 is clearly false given the constraints.
      *   View 2 is plausible but usually requires a specific utility function over risk, which they haven't articulated.
      *   View 3 is strong. EA circles often talk about "forecastability."
      *   View 4 is the most *sociologically* accurate for a foundation. Foundations are perpetual entities; EV maximizers are often one-shot agents.
      *   *Decision:* The practice presupposes **Constrained EV Maximization with Epistemic Shrinkage**. It's not pure fanaticism. It's "EV maximization within a risk-managed institutional framework." The inconsistency isn't incoherence; it's a separation between *project evaluation* (theoretical EV) and *portfolio management* (institutional risk).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Validate the user's confusion. Set the stage (philosopher of decision theory persona).
      *   **Brainstorming Rival Views:**
          1.  *Pure Fanaticism:* The view that EV is king. (Ruled out by constraints).
          2.  *Risk-Weighted Utility:* Caring about the distribution, not just the mean. (Possible, but discounting suggests time preference, not just risk).
          3.  *Epistemic Deflation:* The 1/20,000 isn't trusted. (Strong candidate).
          4.  *Institutional Stewardship:* The foundation must exist to give later. (Explains the spending cap).
      *   **Arguing for the Best Fit:**
          *   The practice isn't one theory; it's a *layered* theory.
          *   Layer 1: *Normative Goal:* Maximize EV (justifies the ranking).
          *   Layer 2: *Epistemic Constraint:* Probabilities at the tails are noise (justifies robustness screen).
          *   Layer 3: *Instrumental Constraint:* The foundation is a perpetual machine (justifies spending cap/discounting).
          *   *Synthesis:* It's "EV Maximization under Epistemic and Institutional Constraints."
      *   **Addressing the "Fanaticism" Question:**
          *   Distinguish between *value fanaticism* (outcomes are huge) and *decision fanaticism* (act on the math).
          *   They accept value fanaticism (ranking) but reject decision fanaticism (constraints).
      *   **Addressing the "What Would Change" Question:**
          *   If they moved to moderate views (e.g., log utility), the moonshot drops.
          *   If they moved to pure EV, they'd spend more than 5%.
          *   The current system is a "hedged bet."
      *   **Value vs. Rationality:**
          *   Clarify this distinction. Value = how good is the outcome? Rationality = how do I choose given uncertainty?
          *   The foundation conflates them to manage internal politics.
      *   **Conclusion:** Practical advice for the board presentation.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Epistemic Deflation" enough to explain the spending cap?
      *   *Correction:* No. Spending cap is about *institutional longevity*, not just project uncertainty. I need to make sure I distinguish between *project-level risk* (robustness screen) and *institutional-level risk* (spending cap).
      *   *Critique:* The user asked about the 1-in-20,000 number specifically.
      *   *Correction:* Use that number. If the robustness screen kills it, the *effective* probability used for decision-making is near zero, even if the *stated* EV keeps it at #1. This is the core tension.
      *   *Tone Check:* Ensure I don't sound condescending. The user is smart but new. Treat them as a colleague.
      *   *Philosophy Check:* Ensure I'm using terms like "St. Petersburg Paradox," "Fanaticism," "Epistemic Humility" correctly.

  7.  **Final Polish:**
      *   Check American English spelling (prioritize, program, etc.).
      *   Ensure the structure matches the prompt (Brainstorm -> Argue -> Underdetermination).
      *   Make sure the advice on the board presentation is actionable.

  8.  *(Final thought before generating)*: The key insight is that the foundation is trying to have it both ways: the *marketing/mission* of high-EV longtermism, with the *governance* of a traditional conservative endowment. The philosophical theory that bridges this is **Two-Level Decision Theory** or **Rule-Consequentialism applied to Institutional Design**. I should emphasize that the "inconsistency" is a feature, not a bug, designed to prevent ruin while aiming for impact.

  9.  **Drafting the Content:** (Mental outline of the specific sections)
      *   Intro: You're not crazy. This is the "Longtermist's Dilemma."
      *   Brainstorm: 1. Pure EV (Fanaticism). 2. Risk-Weighted. 3. Epistemic Shrinkage. 4. Institutional Stewardship.
      *   The Verdict: It's "Stewardship-Constrained EV."
      *   The Fanaticism Point: They are value-fanatics but decision-pragmatists.
      *   The Underdetermination: Where the math breaks (the robustness screen threshold).
      *   Board Advice: Frame it as "Portfolio Strategy" not "Moral Arithmetic."

  10. **Final Review against constraints:**
      *   American English? Yes.
      *   Concrete numbers? Yes ($2M, 1/20k, 5%).
      *   Brainstorm first? Yes.
      *   Argue for best fit? Yes.
      *   Underdetermined parts? Yes.
      *   Value vs Rationality distinction? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  You are not crazy, and you are not in over your head. You have identified the central tension in modern effective altruism (EA) grantmaking: the conflict between *theoretical expected value maximization* and *institutional risk management*.

  As a philosopher of decision theory, I see this pattern often. Organizations want the moral clarity of expected value (EV) without the practical ruin of "fanaticism" (the commitment to pursue tiny probabilities of huge payoffs). Your foundation's practice is not incoherent, but it is not operating on a single, unified decision rule. It is operating on a **hybrid theory**.

  Per your request, I will brainstorm the rival theoretical interpretations of your foundation's behavior, argue for the one that best fits the actual practice, and identify where the theory remains underdetermined. I will also address your confusion about value versus rationality.

  ### Part 1: Brainstorming Rival Theoretical Interpretations

  To understand what your practice commits you to, we have to look at four competing theories of rational choice that could explain it.

  **1. Pure Expected Value Maximization (Fanaticism)**
  *   **The Theory:** You should always choose the option with the highest mathematical expectation, regardless of probability size. If a 1-in-20,000 chance saves 1 billion lives, it is worth more than a 100% chance of saving 10 lives.
  *   **Fit with Practice:** This explains your ranking system (the moonshot is #1).
  *   **Conflict:** It contradicts your spending cap and robustness screen. A pure EV maximizer would leverage the endowment to bet everything on the highest-EV moonshot. They would not discount the future heavily (existential risk prevention usually requires near-zero discounting). If you were truly committed to this, the 1-in-20,000 grant wouldn't just be ranked first; it would consume 100% of your liquid capital.

  **2. Risk-Weighted Expected Utility (RWEU)**
  *   **The Theory:** Rational agents care about the *distribution* of outcomes, not just the mean. We are risk-averse. A 1-in-20,000 chance is penalized not because the value isn't there, but because the variance is too high.
  *   **Fit with Practice:** This explains the robustness screen and the spending cap. It treats the foundation like a portfolio manager who avoids volatile assets.
  *   **Conflict:** It contradicts the ranking system. If you were truly risk-averse, the moonshot wouldn't be ranked #1 by "expected value per dollar." It would be ranked lower once risk penalties were applied. Your current system calculates EV *as if* you are risk-neutral, then applies constraints *as if* you are risk-averse.

  **3. Epistemic Shrinkage (Bayesian Humility)**
  *   **The Theory:** The problem isn't the value of the outcome; it's the reliability of the probability estimate. A human estimate of "1-in-20,000" is essentially noise. A rational agent shrinks extreme probabilities toward the prior mean (zero).
  *   **Fit with Practice:** This explains the robustness screen perfectly. The screen says, "We don't trust your 1-in-20,000 number." It treats the EV calculation as a *heuristic* for finding promising areas, not a literal arithmetic truth.
  *   **Conflict:** It doesn't fully explain the spending cap. Being skeptical of probabilities doesn't necessarily require limiting annual spend to 5% of assets. That is an institutional constraint, not an epistemic one.

  **4. Institutional Stewardship (Rule-Consequentialism)**
  *   **The Theory:** The foundation is not a one-off agent; it is a perpetual institution. The rational choice is not "maximize EV on this grant" but "maximize EV over the lifetime of the institution."
  *   **Fit with Practice:** This explains the 4-5% spending cap and the discount rate. You are preserving the "giving machine" itself.
  *   **Conflict:** It struggles to justify why you rank grants by single-project EV if the real metric is institutional longevity.

  ### Part 2: The Best Fit — Constrained EV Maximization

  The theory that actually fits your practice is **Constrained Expected Value Maximization with Epistemic Shrinkage.**

  This is not a standard textbook theory, but it is the dominant operational theory in sophisticated EA grantmaking. It separates the *evaluation* of opportunities from the *execution* of capital deployment.

  Here is what your practice commits you to:

  **1. You are Value-Fanatics, but Decision-Pragmatists.**
  You accept the *axiology* (theory of value) of fanaticism: preventing a global catastrophe is indeed worth 50,000x saving a life today. That is why the moonshot ranks #1. However, you reject the *decision theory* of fanaticism. You do not believe you are rationally required to bet the farm on a 1-in-20,000 shot.
  *   **The Commitment:** You commit to the claim that the *stakes* are astronomical, but the *signal-to-noise ratio* of your estimates is too low to justify aggressive betting.

  **2. The Robustness Screen is an Epistemic Circuit-Breaker.**
  When your boss says "don't worry about it," they are implying that the EV ranking is a **search heuristic**, not a **command**.
  *   **Concrete Application:** The 1-in-20,000 grant is ranked #1 to signal "this is the direction of highest potential impact." But the robustness screen acts as a filter on the *probability input*. It effectively says, "Treat any uncorroborated probability below 1% as zero for the purpose of disbursement."
  *   **The Theory:** This presupposes that human probability estimates for tail risks are systematically biased upward. The "inconsistency" you see is actually a correction mechanism. You calculate EV using the optimistic number to find the opportunity, then you apply the robustness screen to adjust for your own overconfidence.

  **3. The Spending Cap is Institutional, Not Moral.**
  The 4-5% cap is not part of the moral calculus of the grant; it is part of the *meta-calculus* of the foundation.
  *   **The Theory:** This presupposes that the foundation's existence is itself a valuable asset. If you spend 100% of assets on the moonshot and fail (99.995% chance), you have zero capacity to act on the next opportunity.
  *   **Concrete Application:** Even if the moonshot has 50,000x the EV of a bed net, you will not fund it at 100% allocation. You are implicitly treating the foundation's capital as a "risk-free bond" that generates optionality.

  **Summary of the Presupposition:**
  Your practice presupposes that **Expected Value is the correct metric for *comparison*, but not for *allocation*.** You use EV to sort the deck, but you use risk-management rules to play the hand.

  ### Part 3: Where the Practice is Underdetermined

  While the hybrid theory fits, there are genuine gaps where your methodology is philosophically unfinished. If you present this to the board, these are the pressure points.

  **1. The Threshold Problem (The Robustness Screen)**
  You say the screen "quietly kills any grant whose expected value comes from a single tiny probability."
  *   **The Gap:** What is "tiny"? Is it 1-in-1,000? 1-in-10,000? Your moonshot is 1-in-20,000. If the screen kills it, why is it ranked #1? If the screen *doesn't* kill it, why do you have the screen?
  *   **The Risk:** If the threshold is arbitrary, the process is vulnerable to motivated reasoning. Analysts can tweak the "robustness" justification to fund what they like and defund what they don't.
  *   **What Needs Clarification:** You need a defined "Epistemic Confidence Interval." For example: "We only act on probabilities >1% unless supported by three independent models." Without this, the tension between the ranking and the screen is just bureaucracy masking indecision.

  **2. The Discount Rate vs. Longtermism**
  You apply a discount rate to future benefits, but your top grant is likely a longtermist intervention (head off global catastrophe).
  *   **The Gap:** Standard economic discounting (e.g., 5% per year) makes existential risk prevention mathematically worthless over long time horizons. If you discount the future, the "50,000x bed net" claim collapses.
  *   **The Risk:** You are using a short-termist financial tool (discounting) to evaluate a long-termist moral goal.
  *   **What Needs Clarification:** Are you discounting because of *pure time preference* (future lives matter less) or *probability of extinction* (there might be no one to help)? If it's the latter, your discount rate should be tied to existential risk estimates, not market interest rates.

  **3. The "Hits-Based" Label**
  Your boss calls this "hits-based giving." In venture capital, hits-based means you expect most investments to fail, but one winner pays for all of them.
  *   **The Gap:** VC firms invest in *many* moonshots to get that one winner. Your spending cap (4-5%) limits how many moonshots you can buy.
  *   **The Risk:** If you only buy one or two moonshots a decade due to the spending cap, you don't have a "hits-based portfolio." You have a "lottery ticket" strategy.
  *   **What Needs Clarification:** To be truly hits-based, you would need to fund *more* small moonshots, not fewer large ones. The spending cap forces you into low-diversification, which contradicts the risk management logic of hits-based giving.

  ### Part 4: Value vs. Rationality (Your Conflation Check)

  You asked if you are conflating "what's valuable" with "what it's rational to do." **Yes, you are, but so is the foundation.**

  *   **Value (Axiology):** Is preventing catastrophe 50,000x better than bed nets? Your ranking says **Yes**.
  *   **Rationality (Decision Theory):** Should I spend $2M on a 1-in-20,000 chance? Your constraints say **No** (or "Not yet").

  In a consistent philosophical system, these should align. If the value is that high, the rational action is to pursue it aggressively. Your foundation has decoupled them.
  *   **Why?** Politics and Psychology. If you tell the board "We are not funding the #1 ranked grant because we don't trust the math," they ask why you ranked it #1. If you tell them "We are funding it," they ask why you aren't funding *only* that.
  *   **The Fix:** You need to explicitly tell the board: *"The ranking identifies moral priority. The constraints identify institutional capacity. We rank by value, but we spend by risk."*

  ### Part 5: What Would Change if You Adopted a Moderate View?

  If you replaced the current hybrid view with a **Moderate Risk-Weighted View** (admitting you are risk-averse, not just epistemically humble):

  1.  **The Ranking Would Flip:** The moonshot would drop below the bed nets (or similar high-certainty interventions) once risk penalties were applied. The "50,000x" claim would be adjusted down to reflect the uncertainty.
  2.  **The Spending Cap Might Loosen:** If you admit you are risk-averse, you don't need the robustness screen to protect you from tail risks. You could theoretically deploy capital faster into *moderate* risk projects.
  3.  **Nothing Would "Break":** The foundation would survive. However, you would lose the "moral ambition" signal. The current system allows you to tell donors, "We aim for the stars (Rank #1)," while telling auditors, "We spend conservatively (5% cap)." A moderate view forces you to admit, "We aim for moderate gains."

  ### Advice for Your Board Presentation

  Do not try to resolve the inconsistency. It is doing work for them. Instead, frame it as **Portfolio Tranching**.

  1.  **The "Search" Tranche:** Explain that the EV ranking is used to allocate *analyst time* and *research focus*. It tells you where to look.
  2.  **The "Deployment" Tranche:** Explain that the robustness screen and spending cap are used to allocate *capital*. It tells you what to buy.
  3.  **The Narrative:** "We use Expected Value to ensure we are not missing generational opportunities (the moonshot), but we use Robustness Screens to ensure we are not gambling the endowment on unverified models."

  This preserves the "hits-based" ambition while validating the conservative financial governance. It admits that the 1-in-20,000 number is a *directional signal*, not a *betting odd*.

  **Final Verdict:** Your foundation is not irrational. It is **institutionally risk-averse** while remaining **morally longtermist**. The friction you feel is the cost of maintaining that dual identity. Your job in the presentation is not to solve the friction, but to explain why it is necessary for the foundation's survival.
