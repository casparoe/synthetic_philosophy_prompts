prompt: |-
  I'm a backend engineer with no formal training in philosophy, and I've ended up in a long-running argument with a friend who did a philosophy degree, about Dennett's essay "Quining Qualia" (1988). As I understand it, Dennett's claim isn't just that qualia are hard to study but that the concept is incoherent — that the four properties traditionally attributed to them (ineffable, intrinsic, private, immediately apprehensible) can't all be maintained at once — and the thought experiment with the two coffee tasters, Chase and Sanborn, is supposed to show that even in a simple case we can't determine whether the taste of the coffee changed or whether the tasters' standards for judging it changed, and that the only evidence available is the very reports in question. I've been trying to convey this to my team, and it occurred to me that the argument maps almost exactly onto a problem we keep running into with acceptance criteria: everyone agrees on what the system should do, but the spec is written in terms no test could ever adjudicate.

  I'd like a joke that makes this land for someone who has actually read the essay — not a generic "philosophers are weird" joke, but one whose punchline turns on the substance of the incoherence charge and on the Chase-and-Sanborn structure. Seed it with a fictional consumer-electronics company holding a spec review for a device meant to measure the subjective quality of an experience (call it the Phenomometer), and two in-house testers, Dana and Priya, who both insist the office coffee tastes different than it did last quarter and disagree about whether the device reading confirms that. Please give me the joke as a numbered list of exactly five items, one or two sentences each, with no introduction or conclusion — the five items being the beats of the joke: the setup, three escalating clauses or exchanges from the spec review, and the punchline.
