  2. Testers Dana and Priya both drank the same brew and insisted it tasted different than last quarter, yet the device returned different values for each of them.
  3. The product manager insisted the spec required measuring a private, intrinsic property that was also somehow publicly readable by the device.
  4. Dana claimed the Phenomometer confirmed the coffee was objectively worse, while Priya argued the meter merely reflected her own refined criteria for bitterness.
