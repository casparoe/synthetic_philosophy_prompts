answer: |-
  Here is the case for your line, pushed as hard as it can go, followed by an honest assessment of where the philosophical landscape actually stands.

  ### Part 1: The Case for "One If"

  **The Core Thesis**
  The word "if" does exactly one job in English: it sets up a supposition. It instructs the listener to add the antecedent to their information state and check whether the consequent follows. There is no semantic ambiguity between "If Oswald didn't..." and "If Oswald hadn't..." The difference lies entirely in the *status of the context* in which the supposition is evaluated.

  The counterfactual morphology (the fake past tense in "hadn't," the "would") is not a truth-conditional operator. It is a *context-shifting instruction*. It tells the listener: "Do not evaluate this supposition against the set of worlds we currently accept as actual (the Common Ground). Evaluate it against a set of worlds where this antecedent is treated as settled false or at least not live."

  **Biting the Oswald Bullet**
  You asked which bullet to bite. The less bad option is to claim that **both** the indicative and the counterfactual in the Oswald pair are true, and that the intuition that the counterfactual is false is a pragmatic illusion.

  Here is the argument: We know Kennedy was killed. We know Oswald is the assassin.
  1.  **Indicative:** "If Oswald didn't kill Kennedy, someone else did." We evaluate this in our actual context. We hold fixed that Kennedy was killed. We suppose Oswald didn't do it. Given that Kennedy was killed, it follows someone else did. True.
  2.  **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have." We evaluate this in a shifted context. The morphology tells us to step out of the "Oswald did it" Common Ground. However, we do not step out of *all* historical facts. We still hold fixed that Kennedy was killed (this is a hard historical fact, unlike the identity of the killer). In the closest worlds where Oswald doesn't pull the trigger, but the event "Kennedy is killed" remains fixed, someone else pulls the trigger. Therefore, the conditional is True.

  Why does it *feel* false? Because the counterfactual morphology suggests we are entering a scenario where the *conspiracy* might not exist. Listeners pragmatically infer that if we are counterfactualizing Oswald's action, we should also relax the assumption that the killing was inevitable. But that is a pragmatic inference about *which facts to hold fixed*, not a difference in the meaning of "if." The semantic machinery is identical; the pragmatic instruction on which background facts to retain is different.

  **The Arsenic Case (Anderson)**
  This is your strongest evidence. A doctor says, "If Jones had taken arsenic, he would show these symptoms." Jones *does* show the symptoms. The doctor concludes Jones *did* take arsenic.
  *   **The Problem for Standard Views:** If counterfactuals semantically presuppose the antecedent is false, the doctor is contradicting themselves or speaking nonsense.
  *   **The "One If" Solution:** The morphology doesn't mean "false." It means "not currently established in the Common Ground." When the doctor arrives, it is not yet established that Jones took arsenic. It is a hypothesis. The counterfactual morphology marks it as a hypothesis to be tested. Once the test succeeds, the antecedent moves into the Common Ground. The morphology tracks *epistemic status*, not *ontological truth*. This explains why you can use a counterfactual to argue for the truth of the antecedent.

  **The Mirror Case**
  "Bob never danced. #If Bob danced, Leland danced." vs. "If Bob had danced, Leland would have danced."
  *   **Explanation:** The indicative "if" requires the antecedent to be compatible with the Common Ground. You just asserted "Bob never danced," so "Bob danced" is now incompatible with the Common Ground. The indicative crashes because it demands compatibility.
  *   The counterfactual morphology *signals* incompatibility. It says, "I know we are accepting that Bob didn't dance; I am asking you to temporarily suspend that acceptance." This is why it flows perfectly after a denial. The marking is a negative feature on the indicative (it *requires* openness) and a positive feature on the counterfactual (it *creates* distance).

  **Embedding and Negation**
  This is the hardest objection. "It is not the case that if Oswald hadn't killed Kennedy, someone else would have."
  *   **The Worry:** If the difference is just pragmatic (about the conversation), negation should target the truth conditions, which are supposed to be the same as the indicative. But negating the indicative ("It's not the case that if Oswald didn't...") seems to mean something different.
  *   **The Defense:** Negation targets the *connection* between antecedent and consequent, which is the same in both cases. The pragmatic marker (the past tense/"would") instructs us on *which context* to use to evaluate that connection.
      *   When you say, "It is not the case that if Oswald hadn't...", you are saying: "Even if we shift the context to one where Oswald's guilt is not assumed (as the morphology instructs), the connection to 'someone else would have' does not hold."
      *   You are denying the conditional link *under the shifted context*. This explains why it sounds like a claim about how things would have gone. You aren't negating the pragmatic instruction; you are accepting the instruction (shift the context) and then denying the result.
      *   In attitude reports ("John thinks that if..."), the morphology shifts the context relative to *John's* beliefs, not the speaker's. If John thinks Oswald is innocent, he uses the indicative. If John knows Oswald is guilty but is speculating, he uses the counterfactual. The semantics remains invariant; the context parameter is bound by the attitude verb.

  **Morphology and Cross-Linguistic Evidence**
  *   **Fake Past:** You are correct that the past tense in counterfactuals is not temporal. It is "modal remoteness." In English, German, and Hebrew, the same past-tense morphology used for past time is used for counterfactuals. This supports the idea that it marks "distance from actuality" rather than "past time."
  *   **"Would":** "Would" is historically the past tense of "Will." In this unified view, "Will" projects a future from the current world; "Would" projects a future from a *distanced* (counterfactual) world.
  *   **Caveat:** I am going from memory here, but I believe there are languages (e.g., Mandarin Chinese) that do not morphologically mark the indicative/counterfactual distinction on the verb at all, relying entirely on context particles or temporal adverbs. If a language can do without the morphology entirely, it strongly suggests the morphology is not carrying the core truth-conditional weight. It is an optional grammaticalization of a pragmatic distinction.

  **Past and Future**
  "If it rains tomorrow..." vs. "If it rained tomorrow..."
  *   This is the same animal. "If it rained tomorrow" does not mean "If it rained yesterday." It means "If it were to rain tomorrow." The past tense marks *epistemic distance*. The speaker is less confident it will rain. It signals, "I am not putting this forward as a live expectation." This fits the unified view perfectly: the morphology tracks the speaker's commitment level, not the time of the event.

  **The Cancellability Test**
  Your intuition is correct: "If Oswald hadn't killed Kennedy... but of course he did" is not a contradiction. It sounds redundant, not incoherent.
  *   **Implication:** This kills the idea that counterfactuals *semantically presuppose* the falsity of the antecedent. If it were a hard presupposition (like "John stopped smoking" presupposes John smoked), adding "but he didn't" would crash the sentence.
  *   **The Story:** The falsity implication is a *conventional implicature* or a very soft presupposition. The morphology conventionally signals "I am treating A as non-actual," but this signal can be overridden by explicit assertion. This saves the Arsenic case (where A turns out true) and the Oswald case (where we acknowledge A is true while speculating).

  ***

  ### Part 2: Consensus vs. Live Fight

  Now, I will step back from the argument above and tell you honestly how this lands in the current literature. I am not citing names, but I am describing the camps.

  **1. Claims that are Basically Settled (Consensus)**
  *   **The Oswald Intuition:** Almost everyone agrees that for most speakers, the indicative ("If Oswald didn't...") strikes them as true, and the counterfactual ("If Oswald hadn't...") strikes them as false. *Your view requires you to explain away this intuition as a pragmatic error.* This is a steep hill to climb. The consensus is that this intuition reflects a genuine semantic difference.
  *   **Arsenic/Falsity:** It is broadly agreed that counterfactuals do not *entail* the falsity of the antecedent. The Arsenic case is accepted as a refutation of the idea that "If A had happened" means "A did not happen." Everyone agrees the falsity is cancellable or defeasible. You are on solid ground here.
  *   **Morphology is "Fake Past":** It is consensus that the past tense in counterfactuals does not denote past time. It denotes modal remoteness. The disagreement is about whether that remoteness is part of the truth conditions or a pragmatic signal.
  *   **Embedding is Hard:** Everyone agrees that embedding is the hardest test for any theory. There is no consensus solution that everyone likes.

  **2. Claims that are a Live Fight (Contested)**
  *   **Unified Semantics (Your Core Claim):** This is a minority view. The dominant orthodoxy (especially in formal semantics) is that indicatives and counterfactuals involve different operators.
      *   *The Orthodoxy:* Indicatives are usually treated as involving a restriction on the modal base by the speaker's knowledge (epistemic). Counterfactuals involve a similarity ordering on worlds (metaphysical or counterfactual). They are semantically distinct creatures.
      *   *The Fight:* There is a respected minority camp (often associated with Stalnaker-style approaches) that argues for a unified semantics where the difference is purely in the *context set* (the set of worlds taken as live). However, even in this camp, the context shift is usually treated as a *semantic parameter*, not just a pragmatic implicature. Your view—that it is purely pragmatic/discourse marking—is more radical than the standard "unified" view.
  *   **Truth Conditions vs. No Truth Conditions:** You offered a choice: same truth conditions OR no truth conditions.
      *   *The Fight:* There is a significant camp (Expressivists/Inferentialists) who argue *neither* has truth conditions in the classical sense; they are rules for inference. If you go this route, you avoid the Oswald truth-value clash, but you face massive problems with embedding (how do you negate an inference rule?). This is a very live fight, but it trades one set of problems for another.
  *   **The Nature of the "Past" Marking:** While everyone agrees it's "fake past," there is disagreement on whether it is an operator that quantifies over worlds (semantic) or a presupposition trigger (pragmatic). Your view puts it firmly in the pragmatic bucket. The fight is whether pragmatic marking can survive embedding under negation and attitude verbs without becoming semantic. Many argue that if it behaves like this under embedding, it *must* be semantic.
  *   **The Oswald Counterfactual Truth Value:** While most say the counterfactual is false, there is a live debate about *why*. Some say it's false because there was no conspiracy. Others (closer to your view) say it's true because the killing was inevitable, and our intuition is confused. You are not alone in thinking the counterfactual might be true, but you are against the majority.

  **3. Where Your View is Most Vulnerable (The "Break" Points)**
  *   **Embedding under Negation:** This is the step most likely to break your view. If I say, "It's false that if A had happened B would have," standard semantic theory says I am negating the proposition expressed. If the "had/would" is just a pragmatic signal about the conversation, it should be invisible to the negation. But it isn't. The negation seems to target the *counterfactual* connection specifically. To defend your view, you have to argue that the negation operator is sensitive to the pragmatic context-shifting instruction. This requires a complex theory of how negation interacts with context-shifters. Many philosophers think this complexity proves the shifting is semantic, not pragmatic.
  *   **The "Live Option" Definition:** You define the difference as "live option" vs. "not live." But in the Oswald case, for the indicative, Oswald's innocence is *not* a live option (we know he did it). Yet the indicative is felicitous. You have to say the indicative tolerates known falsehoods better than the counterfactual tolerates known truths. This weakens the clean distinction you want to draw.
  *   **Cross-Linguistic Variation:** I flagged this earlier. If there are languages that express counterfactual reasoning *without* the past-tense morphology (relying only on context), it supports your view that the morphology isn't the truth-conditional engine. However, if those languages still show the Oswald distinction (different truth values for minimal pairs in translation), it suggests the semantic difference exists even without the morphology. You need to check if the Oswald intuition persists in languages without fake-past marking. (My memory is shaky here; some literature suggests the distinction is universal even when morphology isn't).

  **Summary Verdict**
  *   **Settled:** Counterfactuals don't entail antecedent falsity (Arsenic case wins). Morphology is modal remoteness.
  *   **Contested:** Whether the remoteness is semantic or pragmatic. Whether Indicatives and Counterfactuals share truth conditions.
  *   **Your Position:** You are advocating for a **Pragmatic Unification View**. It is a coherent, defensible minority position. It is not "fringe," but it is not the "received view."
  *   **The Cost:** You must explain away the strong intuition that the Oswald counterfactual is false, and you must provide a robust account of how pragmatic markers survive embedding under negation without becoming semantic. If you can handle the embedding data without smuggling in semantic operators, you have a paper. If you can't, the view collapses into the standard "two operators" view.

  **Recommendation:** Don't claim the consensus is on your side. Claim that the consensus on *falsity entailment* is wrong (everyone agrees with you there), but admit that the consensus on *semantic divergence* is the hurdle you are clearing. Frame the embedding objection not as a refutation, but as the specific technical problem your paper solves.
