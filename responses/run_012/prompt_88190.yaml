      *   **The Conflict:**
          *   Camp 1 (Ecological Rationality/Heuristics): Heuristics are distinct from optimization. They work because they fit the environment, not because they approximate a global optimum.
          *   Camp 2 (Optimization under Constraints/Bounded Rationality): Everything is optimization. Heuristics are just optimal policies when you include computation/implementation costs.
      *   **Task:** Create a document representing an "adversarial collaboration."
          *   Section 1: Numbered claims both agree on (including the nature of the disagreement and evidence standards).
          *   Section 2: Table of remaining disagreements (stated in each side's own terms, no strawmanning).
          *   Section 3: Cruxes (sub-questions that matter).
          *   Section 4: Tests/Arguments for each crux with specific predictions from both sides *before* running the test.
      *   **Constraint:** Use a specific concrete case provided by the user (Secretary Problem variant with interview cost $c$ and policy complexity cost).
      *   **Specific Twists:**
          1.  Policy complexity cost (single threshold vs. sliding schedule).
          2.  Adaptive aspiration level (drifting threshold) in stationary vs. shifting environments.
      *   **Goal:** Make predictions concrete and falsifiable (e.g., number of candidates looked at). Identify verbal disputes vs. substantive ones.

  2.  **Deconstruct the Camps:**
      *   *Camp 1 (Ecological/Heuristic):* Often associated with Gigerenzer. Key idea: "Less is more." The mind (or system) uses simple rules because the environment has structure that makes complex calculation unnecessary or even harmful (overfitting). The cost of computation isn't just a number in an equation; it's a fundamental constraint that changes the *kind* of rationality.
      *   *Camp 2 (Optimization/Bayesian):* Often associated with Anderson's Rational Analysis or standard Econ. Key idea: "Everything is optimization." If a heuristic works, it's because it's the solution to an optimization problem that includes meta-costs (time, memory, energy). If you can't measure the cost independently, the theory is unfalsifiable.

  3.  **Drafting Section 1: Common Ground:**
      *   Need to establish that both want systems that work.
      *   Both agree computation costs matter.
      *   Both agree the "optimal" mathematical solution (ignoring cost) is often impractical.
      *   Both agree on the concrete setup (Secretary Problem variant).
      *   Crucial agreement: A theory is useless if it can explain *anything* (unfalsifiable).

  4.  **Drafting Section 2: The Disagreements (The Table):**
      *   Need to phrase these carefully.
      *   *Camp 1 View:* The heuristic is a primitive. It's not derived; it's selected by evolution/engineering for fit. The "cost" is hard to quantify independently.
      *   *Camp 2 View:* The heuristic is a derived solution. The "cost" is a parameter that *must* be quantifiable. If you can't measure the cost without looking at the behavior first, the theory is circular.
      *   *Key distinction:* Is the cost term a *parameter* (Camp 2) or a *post-hoc justification* (Camp 1 accusation)? Is the heuristic a *tool* (Camp 1) or a *solution* (Camp 2)?

  5.  **Drafting Section 3 & 4: Cruxes and Tests:**
      *   *Crux 1: The Policy Cost (Twist 1).*
          *   Scenario: Fixed cost per threshold change.
          *   Camp 2 says: We can calculate the break-even point where the sliding scale isn't worth the memory cost.
          *   Camp 1 says: The single threshold isn't "optimal under cost," it's robust. It works even if the cost function changes slightly.
          *   *Prediction:* Camp 2 needs to predict a specific $c_{policy}$ where behavior switches. Camp 1 predicts the single threshold wins over a wider range of environments than the cost calculation suggests (robustness vs. optimality).
      *   *Crux 2: Adaptive Drift (Twist 2).*
          *   Scenario: Threshold moves based on recent candidates. Stationary vs. Shifting distribution.
          *   Camp 2 (Optimization): In a stationary world, drift adds variance/noise. It should perform worse than a fixed optimal threshold. In a shifting world, it performs better *if* the drift rate matches the shift rate optimally.
          *   Camp 1 (Ecological): Drift is a feature, not a bug. It's a "tracking" heuristic. In stationary worlds, it might not hurt much (robustness). In shifting worlds, it wins significantly because it doesn't need to detect the shift explicitly.
          *   *Concrete Prediction:* Number of interviews before acceptance.
          *   *Stationary:* Camp 2 says Drift > Fixed Threshold (in terms of interviews needed/regret). Camp 1 says Drift $\approx$ Fixed Threshold (robustness).
          *   *Shifting:* Camp 2 says Drift wins *only if* tuned perfectly. Camp 1 says Drift wins broadly without tuning.

      *   *Refining the "Verbal" aspect:* The biggest verbal fight is about the definition of "Optimization." Camp 2 defines it broadly (maximizing utility including computation). Camp 1 defines it narrowly (maximizing outcome given constraints, but treating the rule as distinct).
      *   *The "Unfalsifiability" Crux:* Can we measure the cost of computation *independently* of the behavior?
          *   Test: Measure memory/CPU cost of the two policies in the specific system.
          *   Camp 2: If the heuristic is used, the measured cost *must* justify it.
          *   Camp 1: The measured cost might not match. The heuristic might be used even if the complex policy is cheaper (due to robustness).

  6.  **Developing the Concrete Predictions (The "Engineer" part):**
      *   *Setup:* $N=10$, Uniform[0,1].
      *   *Policy A (Sliding):* Thresholds $t_1, t_2, ... t_{10}$. High memory cost.
      *   *Policy B (Fixed):* Threshold $t_{fixed}$. Low memory cost.
      *   *Policy C (Drifting):* $t_{new} = t_{old} + \alpha (quality - t_{old})$.
      *   *Twist 1 (Policy Cost):* Let's assign a "penalty" to the score for policy complexity.
      *   *Twist 2 (Drift):*
          *   Stationary: $U[0,1]$ throughout.
          *   Shifting: $U[0,1]$ for 1-5, $U[0.5, 1.5]$ (clipped) or similar for 6-10. Let's say mean shifts from 0.5 to 0.8.
      *   *Metric:* Expected Quality of Selected Candidate minus Interview Costs minus Policy Cost.
      *   *Camp 2 Prediction:* There exists a specific cost value $K$ where Policy A becomes Policy B. If we measure system cost $K_{sys}$, behavior matches.
      *   *Camp 1 Prediction:* Policy B outperforms Policy A even when $K_{sys}$ is negligible, because Policy A overfits the specific distribution assumptions.
      *   *Drift Prediction:*
          *   Stationary: Camp 2 says Drift adds noise, reduces expected quality by ~5% compared to Fixed. Camp 1 says Drift is within 1% of Fixed (robust).
          *   Shifting: Camp 2 says Drift needs specific $\alpha$ to win. If $\alpha$ is generic, it might lose. Camp 1 says Generic Drift beats Fixed significantly (>10% improvement).

  7.  **Review and Refine:**
      *   *Tone:* Professional, collaborative, precise.
      *   *Formatting:* Clear sections, table for disagreements.
      *   *Check against constraints:* Did I use the specific case? Yes. Did I avoid citations? Yes. Did I address the "verbal" dispute? Yes.
      *   *Self-Correction on Camp 1:* Make sure Camp 1 doesn't sound anti-math. They love math, just different math (robustness/satisficing vs. maximizing).
      *   *Self-Correction on Camp 2:* Make sure Camp 2 doesn't sound like a strawman "perfect rationality." They acknowledge bounds, but insist on modeling them as constraints in the objective function.

  8.  **Final Polish:** Ensure the "Crux" section clearly identifies what would change a mind. The key is independent measurement of costs. If Camp 2 can predict the heuristic choice based *only* on measured system costs, they win. If the heuristic is chosen even when the complex policy is cheaper, Camp 1 wins.

      *(Self-Correction during drafting the predictions)*: I need to be careful with the "Drift" prediction. In a stationary world, a drifting threshold is essentially adding variance to the decision boundary. Camp 2 (Optimization) would argue this is strictly suboptimal compared to a fixed calculated threshold. Camp 1 would argue the performance loss is negligible compared to the gain in adaptability (robustness).
      Let's make the numbers specific enough to be falsifiable but general enough to be plausible.
      *   Stationary: Fixed Threshold accepts at candidate #4 on average. Drift accepts at #4.2. Quality difference 0.02.
      *   Shifting: Fixed Threshold accepts at #4 (low quality). Drift accepts at #7 (high quality).
      *   Camp 2 says: Drift only wins in Shifting if $\alpha$ is tuned to the shift rate.
      *   Camp 1 says: Drift wins in Shifting even with generic $\alpha$.

      Let's refine the "Policy Cost" crux.
      Camp 2: "If we measure the memory cost of the sliding scale as 5 units, and the gain in candidate quality is 3 units, the system *must* use the Fixed policy."
      Camp 1: "The system might still use the Fixed policy even if the gain is 10 units and cost is 5 units, because the Sliding scale is brittle to distribution errors."

      Okay, ready to write.

  9.  **Final check of the Prompt Requirements:**
      *   Numbered section of claims they both agree on.
