prompt: |-
  I'm a backend engineer, no philosophy background, so forgive the vocabulary. This started as an argument in our team Slack about cache eviction: we use a dumb little rule of thumb instead of actually computing the optimal policy, a colleague said that's just irrational, and I said no, it's optimization, you're just not counting the cost of doing the optimization. Turns out this is an old fight and I've fallen down a rabbit hole reading about it. As far as I can tell there are two camps. Camp one: heuristics and "good enough" rules aren't failed approximations to the optimum, they're a seperate kind of thing, and the real question is whether a rule fits the environment it grew up in -- a simple rule can beat the theoretically optimal one, because the optimal one is only optimal for a model of the world you don't actually have. Camp two: that's all just optimization with a cost term bolted on; you can derive any heuristic as approximately optimal once you charge for the computation, so there's no rival theory here, just one theory written badly. They seem to talk straight past each other.

  What I want from you is the document these two camps should have written together after a real adverserial collaboration -- something both could actually sign their names to. A numbered section of claims they both agree on (including about what the disagreement is even about, and about what would count as evidence for anything). Then a table of the remaining disagreements, where each row states the disagreement in wording that the side it belongs to would accept for its own position -- not a strawman, not a mushy both-sides compromise. Then the cruxes: the sub-questions where settling it would actually move somebody. And for each crux, a test, argument, or case that both sides agree in advance bears on it, with each side's prediction written down before anyone runs it. My guess is one crux is whether that cost term is something you can measure independently of the very behavior you're trying to explain, and another is whether a "good enough" threshold that drifts around is a calibrated response to the world or a bias -- but you tell me, and flag which parts of the fight are just verbal, if any, and why.

  Since you can't look stuff up (and I don't want citations anyway), let me hand you a concrete case to hang the whole thing on, one I made up, so neither side gets to quote anybody. A slot has to be filled. Candidates show up one at a time, ten of them, no going back, you accept or reject each on the spot, and every candidate's quality is drawn independently from a known uniform distribution from 0 to 1. Each interview costs c, so looking is not free. The textbook optimal policy accepts when quality clears a threshold that starts high and slides downward as the deadline approaches -- on the last candidate you take whatever's left. Now the "good enough" player doesn't do that: they fix one aspiration level and accept the first candidate who clears it, and if nobody clears it they're stuck with the last one. Here's the first twist I want the cruxes built on. Suppose computing and storing a policy costs something proportional to how many distinct thresholds it uses -- a flat policy with a single aspiration level is cheap to store, the sliding schedule is expensive. Does that make the good-enough player optimal (camp two's line), or is that cost just a fudge factor you dial after the fact to "explain" any behavior you like (camp one's line)? Second twist: let the aspiration level move with experience -- a run of good candidates pushes it up, a run of bad ones pulls it down. In a world where the quality distribution is stationary, does that drift hurt, and in a world where the distribution secretly shifts halfway through, does it help? Give me both sides' predictions on that as concretely as you can (roughly how many candidates get looked at before somebody's accepted, that kind of thing), and make sure the two camps' predictions come out genuinely different, so the thing is actually falsifiable instead of everyone predicting "it depends."
