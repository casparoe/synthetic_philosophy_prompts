          3.  Fundamental Laws are Metaphysically Necessary (Dispositional Essentialism/BCA style).
          4.  Zombies are Conceivable $\rightarrow$ Physicalism is False (Chalmers-style argument).
          5.  Two-Dimensional Semantics (2DS) is the right machinery (Primary vs. Secondary Intension).
