      *(Final check on (6))*: "whatever conceivability tells us about what's possible can't depend on finding out how things actually turned out." This is actually a very strong claim. In 2DS, knowing *which* possibility is actual depends on experience. Knowing the *space* of possibilities is a priori. I need to be precise here. If (6) means "Justification for modal claims is purely a priori," it conflicts with (2) where the necessity is a posteriori. 2DS reconciles this by distinguishing the *source* of the modal truth (metaphysics) vs. our *epistemic access*. I will flag this as a tension in formulation rather than a fatal crash, provided they interpret (6) charitably.

