  8.  **Self-Correction during drafting:** Wait, does (3) *entail* Physicalism? Not necessarily. You can have necessitarian laws and dualism (Interactionist Dualism with necessary bridging laws?). But usually, Dispositional Essentialism (the main proponent of 3) leans towards Physicalism or Panpsychism because the causal powers *are* the properties. If consciousness has no causal power, it's epiphenomenal. If it does, it's part of the physical essence.
      *   *Better angle:* The Zombie argument relies on the contingency of the supervenience of the mental on the physical. If laws are necessary (3), the supervenience base is rigid. If the mental doesn't supervene necessarily, it's not law-governed in the same way.
      *   *Simplest explanation:* Chalmers rejects (3) *because* of (4). You are trying to hold both. That's the main incoherence.

      *   *Check (6):* "Modal knowledge has to be a priori... can't depend on finding out how things actually turned out." This is the definition of Modal Rationalism. But for (2) (Water=H2O), you *do* need to find out water is H2O to know the modal fact (that water is necessarily H2O). 2DS handles this by saying the *conditional* is a priori. But (6) as stated ("can't depend on finding out") is slightly too strong for the standard 2DS view which allows empirical reference fixing. I need to point out this tension.

      *   *Final Plan:*
