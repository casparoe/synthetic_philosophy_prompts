answer: |-
  Dear Professor,

  I have been thinking deeply about the recitation problem you described, specifically the gap between the caveats students recite and the inferences they actually draw. To address this, I have designed a diagnostic decision tree that avoids asking students to define terms directly. Instead, it presents them with concrete scenarios that force them to reveal their underlying commitments about causality, variance, and intervention. The goal is to map the logical space of possible interpretations before we label the specific student positions, ensuring we are sorting by commitment rather than vocabulary.

  We begin at the root of the tree with a shared mini-case. All students are presented with a hypothetical study showing that in a specific population, the heritability of a trait like reading speed is estimated at 0.6. The first branching question asks them to consider a single individual from that study, say a child named Alex. We ask whether the 0.6 estimate implies that 60% of Alex's specific reading speed is caused by Alex's genes and the remaining 40% by Alex's environment. This question carves the logical space along the dimension of individual causal attribution versus population variance. If a student answers yes, they commit to the view that heritability partitions the trait within an individual. If they answer no, they commit to the view that heritability describes differences between individuals in a group.

  For those who take the first branch and claim the trait is partitionable within the individual, we move to a second node concerning intervention. We ask whether improving Alex's school environment would necessarily improve only the environmental 40% of their score, leaving the genetic 60% fixed. This tests whether they view the genetic portion as immutable. A yes answer suggests they believe genetic causation implies resistance to environmental change. A no answer suggests they believe genetic and environmental causes are interwoven even within the individual, though this is a logically precarious position given their first answer. For those who took the second branch at the root and denied individual partitioning, we ask a different second question regarding transmission. We ask whether the 0.6 estimate predicts that Alex's children will resemble Alex in reading speed more than they resemble children from the general population. This distinguishes between those who see heritability as a statement about lineage and those who see it as a static snapshot of current variance.

  The final layer of the tree addresses environmental relativity. For the students who have arrived at the view that heritability is about population variance and not necessarily transmission, we present a third scenario. We ask whether the 0.6 estimate would remain valid if we radically expanded the range of environments, for example by providing perfect schooling for half the population and no schooling for the other half. A yes answer implies they view the heritability estimate as a stable property of the trait itself. A no answer implies they view the estimate as contingent on the specific range of environments sampled in the original study. This completes the logical carving of the space, resulting in roughly eight terminal leaves based on the combinations of answers provided.

  Now that the structure is laid out, we can locate the specific positions your students occupy within these leaves. The most common position among your biology students, who hear a high estimate and conclude the trait is genetically caused in each individual, lands at the leaf where they answered yes to individual partitioning and yes to immutability. We can name this leaf Genetic Determinism. It is coherent within their framework but scientifically inaccurate regarding development. The students who conclude that changing the environment won't help much often land in the same leaf, though some may arrive there via the population branch by answering yes to environmental stability, believing that variance sources are fixed across contexts. We can call this leaf Intervention Pessimism. The students who read heritable as inherited, meaning passed down from parents to children, land at the leaf where they denied individual partitioning but affirmed transmission prediction. We can name this leaf Lay Inheritance. Finally, the students who insist it is nothing but a statement about variance in one particular population across one particular range of environments land at the leaf where they denied individual partitioning, denied transmission prediction, and affirmed environmental relativity. We can name this leaf Strict Quantitative Contextualism, which is the technically correct position in behavior genetics.

  There are several leaves in this tree that remain unnamed because no students seem to occupy them. For instance, there is a combination where a student denies individual partitioning but insists the estimate holds across radically different environments. This view is largely unoccupied because it is scientifically unattractive; anyone who understands variance knows it depends on the range of environments sampled. Another empty leaf involves students who affirm individual partitioning but deny immutability, claiming genes cause 60% of the trait but environment can still change that genetic portion. This view is effectively incoherent because if the genetic portion can be changed by the environment, it was not correctly partitioned as genetic cause in the first place. There is also a leaf where students deny transmission but affirm individual partitioning, which is unexplored because if genes cause the trait in the individual, they usually assume those genes are passed on. These empty spaces help us see that the occupied positions are not random but cluster around specific intuitive attractors.

  I must close with an honest note on the limitations of this instrument. There are pairs of positions the tree fails to separate cleanly. Specifically, Intervention Pessimism and Genetic Determinism often look identical in practice because both lead to the policy conclusion that intervention is futile, even though one is based on individual causality and the other on population variance stability. The tree separates them logically, but in a short recitation, a student might slide between them without noticing. Additionally, the tree struggles to separate Lay Inheritance from Strict Quantitative Contextualism if the student believes that current variance predicts future resemblance only within the same environment. They may answer no to transmission in a general sense but yes in a specific sense, blurring the leaf boundary. Finally, the tree assumes students are consistent, but as you noted, they often contradict themselves. This instrument captures their dominant commitment at the moment of questioning, but it cannot force them to reconcile contradictions they hold simultaneously. Despite these edges, I believe this structure will help you surface the genuine disagreements rather than just the verbal ones.

  Best regards,

  Your TA
