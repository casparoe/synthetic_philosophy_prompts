  I am in my third year and currently taking a course on decision theory and rational choice, and for the past two weeks I have been running what amounts to an informal experiment on my study partner, Nadia, who is enrolled in the same course but has never taken an economics class. We have been working through a worksheet of one-shot gambles, and for every item she stipulates a baseline of roughly $10,000 in savings and no opportunity to play repeatedly. Her verdicts so far are these. (i) A fair coin that pays her $100 on heads and costs her $50 on tails: she plays. (ii) A fair coin that pays her $2,000 on heads and costs her $800 on tails: she plays. (iii) A bet that wins $100,000 with probability 1 in 10 and otherwise costs her $5,000, for an expected gain of $5,500: she declines. (iv) The St. Petersburg game, that is, a fair coin flipped until the first tails, paying $2^n where n is the number of heads that preceded the tails, offered at an entry fee of $25: she declines, and when I asked what she would be willing to pay she said "nothing close to that," adding that the enormous prizes are "just decoration" because she is "not going to be the one who wins." I cannot fit this pattern to a single rule. Expected-value maximization plainly does not fit, but beyond that I cannot tell whether she is running some version of expected-utility maximization with a concave utility function, or something more like a rule that compares only the typical or most probable outcome against the status quo while disregarding the tails, or whether some third rule fits her four verdicts just as well. I would like you to sort this out for me.

  Three further items are coming up, and I would like to predict her before I ask her. (A) A bet with a 60% chance of winning $100 and a 40% chance of losing $1,000. (B) A bet with a 45% chance of winning $600 and a 55% chance of losing $100. (C) A truncated St. Petersburg game: the same doubling structure as before, except that the payoff stops growing once ten heads have appeared, so the most she can win is $1,024, offered at an entry fee of $5.

  What I am asking for is the following. First, the set of candidate rules that fit all four of her recorded verdicts, each stated precisely enough to generate predictions, together with your judgment about which of her verdicts is doing the most work in eliminating the alternatives. Second, for each of the three new items, what each surviving rule predicts, and your best guess at her actual verdict with your reasons for preferring that guess. Third, an honest statement of the respects in which the evidence underdetermines her rule, including any parameter or tie-breaking clause you had to supply in order to make a rule generate verdicts at all. And fourth, the single further gamble you would put to her that would most cleanly separate the surviving rules, with an explanation of why that case and not some other. Please do not tell me what the literature says about the St. Petersburg paradox or about expected utility; what I want is an account of what Nadia is doing.
