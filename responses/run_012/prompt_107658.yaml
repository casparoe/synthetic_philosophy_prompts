  ### 1. Candidate Rules and Eliminating Verdicts

  Based on Nadia's four recorded verdicts, three distinct decision rules survive. Each fits the data but implies a different cognitive process.

  **Candidate Rule 1: Concave Expected Utility (CEU)**
  *   **Definition:** Nadia maximizes the expected utility of her final wealth, $E[U(W)]$, where $U$ is a concave function (e.g., logarithmic or square root) reflecting diminishing marginal value of money.
  *   **Fit:** She accepts small/medium positive-EV gambles (1 & 2) because the utility gain outweighs the loss. She rejects Gamble 3 because losing $5,000 (50% of wealth) causes a utility drop that the 10% chance of $100,000 cannot offset. She rejects Gamble 4 because the certain utility cost of $25 outweighs the expected utility of the low-probability massive payouts.
  *   **Status:** Survivor.

  **Candidate Rule 2: Probability of Profit (PoP)**
  *   **Definition:** Nadia plays if and only if the probability of a net monetary gain is at least 50% ($P(\text{Net} > 0) \geq 0.5$).
  *   **Fit:** She accepts Gambles 1 & 2 (50% chance of gain). She rejects Gamble 3 (10% chance of gain). She rejects Gamble 4 (approx. 3% chance of profit, as payoff must exceed $25 entry).
  *   **Status:** Survivor.

  **Candidate Rule 3: Modal Outcome (Mode)**
  *   **Definition:** Nadia compares the single most probable outcome to the status quo. If the mode is a net gain, she plays. (Tie-breaker: If outcomes are equally probable, as in 50/50 coins, she plays if the expected value is positive).
