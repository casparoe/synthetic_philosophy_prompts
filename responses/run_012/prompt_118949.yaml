prompt: |-
  ok so I'm a third-year student (econ + philosophy double major) and I'm in this cross-listed grad seminar on rationality and choice — half the room is econ, half is philosophy, and the prof makes everyone do a 20-minute presentation plus open question period in the last three weeks of term. Mine is in ten days and I've picked a fight I'm not sure I can win.

  My thesis, roughly, and please tell me if it's mush:

  The standard story about the Kelly criterion — bet the fraction of your bankroll that maximizes expected log wealth, don't overbet, growth beats greed — gets the order of explanation backwards. The real reason to size bets that way isn't "log is my utility function and I happen to be risk-averse." It's that anybody whose money compounds lives exactly one path through time. What happens to them is governed by the growth rate along that path, not by the average of their wealth across all the hypothetical parallel versions of them. That average is carried almost entirely by astronomically unlikely branches where they win forty coin flips in a row and end up owning the galaxy, and nobody lives in those branches. So: maximize the growth rate of the quantity that compounds for you, and it falls out as a theorem rather than a premise that you're maximizing expected log wealth. I've been calling this "geometric rationality" in my notes (I think I pinched the phrase from somewhere, dont hold me to it). The bit I actually want to defend is that this is a genuinely different and better-motivated criterion than expected-utility maximization — not just log utility wearing a hat and pretending to be a theory of rationality.

  Here's the room I have to survive:

  - Two PhD students in economic theory who live in Savage/von Neumann-Morgenstern land. They know the axioms cold and they will smell blood. Their opening move will be "log is a concave utility function, so what you've got is a special case of expected utility maximization; either your theorem is trivial or you're quietly claiming log is uniquely rational, which is false."
  - A finance lecturer who actually sizes positions for a living and has read the practitioner literature on this. He thinks Kelly is engineering, not philosophy, and he'll say the theorem is about the growth rate of a known stochastic process and the "rationality" wrapper is decoration. He also has war stories about people who ran full-Kelly on estimated parameters and blew up.
  - A stats person from the Bayesian side who will go straight at the assumptions: that the distribution is known, that returns are iid, that the process is stationary, that the time average converges to anything.
  - A philosophy PhD student working on population ethics and the person-affecting/total-view mess, who will notice that "you only live one branch, so don't average over branches" is doing an enormous amount of normative work and will ask why the branch that actually happens gets priority — and whether the same move doesn't also apply to averaging over time.
  - Plus about eight other people who mostly won't talk until the last five minutes, at which point someone always asks the one question that ends the session.

  What I want from you is a Q&A prep sheet, not a defence of the thesis. You're a decision theorist who knows both sides of this — the finance/portfolio version and the philosophy-of-rationality version — and I want you to be a bit ruthless with me, because the econ students will be. If my thesis really is just log utility with extra steps, put that in the prep sheet; I'd rather hear it from you than from them.

  Before you write anything, think it through step by step: work out what each person in that list actually believes, what follows from their commitments, and which of my claims their commitments put pressure on. Brainstorm the objections in your scratch space first, then rank them. Order the objections by how much damage they'd do to me, not by how likely they are (though tell me both). Phrase each one the way that specific person would actually say it in the room, in their vocabulary — an econometrician and a Parfit person do not raise the same objection in the same words. Give me a reply I can actually deliver in about two minutes out loud, and then tell me honestly where that reply is soft, because I need to know which concessions to make early so I'm not cornered later. And tell me the one reply that absolutely has to land for the talk to survive.

  Skip references, reading lists and citations entirely — I can't get to the library and it wouldn't help me in the room anyway. And don't hand me a generic "here are some considerations on both sides" essay; I need the prep sheet.

  Format: give me a single JSON object, no prose outside it, with exactly these fields:

  {
    "thesis_in_one_breath": "my thesis restated in 1-2 sentences, in the sharpest form you can defend",
    "who_is_in_the_room": [
      {
        "person": "short label for the faction or individual",
        "what_they_work_on": "their actual area and method",
        "what_they_take_for_granted": "the background commitments that will drive their objection",
        "what_they_will_lead_with": "the first thing out of their mouth"
      }
    ],
    "objections": [
      {
        "rank": 1,
        "raised_by": "which person/faction",
        "objection_as_they_would_say_it": "one paragraph, in their voice and vocabulary, the way they'd actually put it",
        "severity": "one of: ends my talk / serious, costs me the room / moderate, costs me a minute / cosmetic",
        "likelihood": "one of: certain / likely / plausible / only if provoked",
        "why_it_bites": "what exactly in my thesis it targets, and what I'd have to give up to escape it",
        "my_two_minute_reply": "spoken-style reply, first person, no bullet points",
        "soft_spot_in_my_reply": "where a follow-up would break it, and what that follow-up would be",
        "concede_hold_or_deflect": "one of: concede / hold / concede partially, plus a half-sentence on what exactly I'm conceding"
      }
    ],
    "what_i_concede_before_anyone_asks": ["two or three things I should give away in the first five minutes to buy credibility"],
    "the_question_im_praying_nobody_asks": {
      "raised_by": "who, realistically, asks it",
      "objection_as_they_would_say_it": "the question, in their voice",
      "why_i_cant_answer_it": "the honest reason",
      "best_stalling_move": "what I can say that buys time without lying"
    },
    "the_single_reply_that_has_to_land": "the one thing I must get across in the talk itself, phrased so it lands on this specific room",
    "three_things_not_to_say": ["phrasings that will hand the econ students a free win"]
  }

  Aim for eight to ten objections. Make them the ones this room would actually raise, not the ones a generic internet commenter would raise.
