  # The New Riddle Decision Tree

  **Starting Commitment:** *Formally, the record of 100,000 green emeralds supports "All emeralds are green" and "All emeralds are grue" to the exact same degree.*

  *   **Q1: Does this formal equality prove that there is no universal logic of induction?**
      *   **Yes:**
          *   **Q2: Are inductive inferences licensed by local material facts about specific domains?**
              *   **Yes:** ➔ **Leaf 1: Material Theory of Induction**
                  *   *The Pill:* Induction is not a rule but a license granted by specific facts about emeralds, not a general schema.
                  *   *Verdict:* The Grue-community is right about their emeralds if their local facts support it; the ML lab is wrong only because its local facts (the spurious correlate) don't actually hold for the new sample.
              *   **No:** ➔ **Leaf 2: Inductive Skepticism**
                  *   *The Pill:* There is no rational distinction between the two hypotheses; expecting one is just a psychological habit.
                  *   *Verdict:* The Grue-community is equally irrational; the ML lab is just as unjustified as the human geologist.
      *   **No:** (There is a universal differentiator we are missing)
          *   **Q3: Is the problem that "confirmation" is the wrong concept entirely?**
              *   **Yes:**
                  *   **Q4: Should we replace confirmation with **falsification** or **decision**?**
                      *   **Falsification:** ➔ **Leaf 3: Critical Rationalism**
                          *   *The Pill:* Hypotheses are never supported, only survived; Grue is rejected only if it fails a test, not because it is "unconfirmed."
                          *   *Verdict:* The Grue-community is fine until the date passes; the ML lab is acceptable until it misclassifies a blue emerald.
                      *   **Decision:** ➔ **Leaf 4: Decision-Theoretic Pragmatism**
                          *   *The Pill:* We choose Green over Grue not because it is truer, but because acting on it yields better survival odds.
                          *   *Verdict:* The Grue-community is pragmatically wrong if their actions fail; the ML lab is wrong because its weights minimize the wrong loss function.
              *   **No:** (Confirmation is real, we just need to fix the inputs)
                  *   **Q5: Is the missing differentiator located in **us** (language/mind) or the **world** (metaphysics)?**
                      *   **In Us:**
                          *   **Q6: Is the constraint based on **history of use** or **rational constraints on belief**?**
                              *   **History of Use:** ➔ **Leaf 5: Entrenchment Theory**
                                  *   *The Pill:* "Green" is projectible only because we have used it successfully in past projections more than "Grue."
                                  *   *Verdict:* The Grue-community is **right** within their own language game; the ML lab is wrong because its "entrenchment" (training data) is temporally bounded and fragile.
                              *   **Rational Constraints:**
                                  *   **Q7: Are these constraints **subjective** (coherence) or **objective** (complexity)?**
                                      *   **Subjective:** ➔ **Leaf 6: Personalist Bayesianism**
                                          *   *The Pill:* The paradox dissolves; you are allowed to prefer Grue if your priors dictate it, but you happen not to.
                                          *   *Verdict:* The Grue-community is rationally permissible; the ML lab is just an agent with weird priors baked into its weights.
                                      *   **Objective:** ➔ **Leaf 7: Algorithmic Probability (Solomonoff)**
                                          *   *The Pill:* "Green" is simpler (shorter description length) than "Grue," so a universal prior assigns it higher probability.
                                          *   *Verdict:* The Grue-community is objectively wrong (their predicate is complex); the ML lab is wrong because its internal representation is unnecessarily complex.
                      *   **In The World:**
                          *   **Q8: Is the world's contribution **static** (kinds) or **dynamic** (causes)?**
                              *   **Static:**
                                  *   **Q9: Are natural kinds **mind-independent** or **biologically imposed**?**
                                      *   **Mind-Independent:** ➔ **Leaf 8: Natural Kind Realism**
                                          *   *The Pill:* "Green" carves nature at its joints; "Grue" is a gerrymandered mess that does not correspond to a real universal.
                                          *   *Verdict:* The Grue-community is mistaken about reality; the ML lab is failing to track the real similarity relation between emeralds.
                                      *   **Biologically Imposed:** ➔ **Leaf 9: Cognitive Constructivism**
                                          *   *The Pill:* "Green" is projectible because human perceptual systems are evolved to track it, not because the world demands it.
                                          *   *Verdict:* The Grue-community is right for their biology; the ML lab is wrong because its "biology" (architecture) overfit the training distribution.
                              *   **Dynamic:**
                                  *   **Q10: Do laws require **causal powers** or just **global regularities**?**
                                      *   **Causal Powers:** ➔ **Leaf 10: Causal Dispositionalism**
                                          *   *The Pill:* Emeralds have a disposition to reflect green light; they have no disposition to be "grue."
                                          *   *Verdict:* The Grue-community is causally illiterate; the ML lab is blind to the causal mechanism generating the color.
                                      *   **Global Regularities:** ➔ **Leaf 11: Best System Analysis**
                                          *   *The Pill:* "Green" belongs to the system of laws that best balances simplicity and strength; "Grue" makes the system too messy.
                                          *   *Verdict:* The Grue-community is using a suboptimal system; the ML lab is encoding a regularity that won't belong to the best system of the future.
                          *   **Q6 (Alternative Branch): Is the problem purely **semantic**?**
                              *   **Yes:** ➔ **Leaf 12: Predicate Restrictionism**
                                  *   *The Pill:* "Grue" is not a genuine predicate and is syntactically inadmissible in confirmation functions.
                                  *   *Verdict:* The Grue-community is speaking nonsense; the ML lab is processing invalid features. *(Note: Often considered an empty position as it begs the question).*

  ***

  ### Instructor Notes & Diagnostics

  **1. Inseparable Leaves (Empirical Equivalence)**
  *   **Leaf 5 (Entrenchment) vs. Leaf 8 (Natural Kind Realism):** In almost all actual cases, the predicates that are most entrenched are also the ones that track natural kinds. Unless you can construct a scenario where a community is deeply entrenched in a *non-natural* predicate, these two views yield identical verdicts on every test case. This may indicate that entrenchment is merely our epistemic access to natural kinds, rather than a competing theory.
  *   **Leaf 6 (Personalist Bayesian) vs. Leaf 4 (Decision-Theoretic Pragmatism):** If a Personalist claims their priors are shaped by pragmatic success, and the Pragmatist claims their decisions are guided by subjective confidence, the distinction collapses into a single "Success-Based" view.

  **2. Empty or Unstable Combinations**
  *   **Leaf 12 (Predicate Restrictionism):** This position is flagged as potentially empty. To say "Grue is inadmissible" without explaining *why* (e.g., because it isn't a Natural Kind or isn't Entrenched) is merely stipulative. It solves the paradox by fiat rather than argument.
  *   **Leaf 2 (Skepticism) + Q1 "No":** If you answer "No" to Q1 (there *is* a universal logic) but end up at Skepticism, you hold an incoherent position. Skepticism requires that the universal logic fails to distinguish the hypotheses *and* that nothing else can.
  *   **Leaf 7 (Algorithmic Probability) + "Grue is Basic":** If a community truly has Grue as a basic predicate, Algorithmic Probability might favor *their* formulation over ours (since description length is relative to the Turing machine/language). This view struggles to maintain objectivity if the "universal" prior is language-relative.

  **3. The Automated Lab Test Case**
  *   Notice how the tree handles the ML classifier.
      *   **Realists (Leaves 8, 10)** say the lab is failing to track reality.
      *   **Formalists (Leaves 5, 7)** say the lab is failing a linguistic or complexity constraint.
      *   **Skeptics/Materialists (Leaves 1, 2)** say the lab is just another inductive system that might fail, with no special status.
      *   *Crucial Divergence:* Only **Leaf 7 (Algorithmic)** and **Leaf 5 (Entrenchment)** have the machinery to explain *why* the lab failed without appealing to external truth (Leaf 7: complexity penalty; Leaf 5: temporal boundedness of training entrenchment). Realists must appeal to the future behavior of emeralds to explain the lab's error, which they can't know yet.

  **4. The Grue-Community Test Case**
  *   **Leaf 5 (Entrenchment)** is the only leaf that must concede the Grue-community is **right** (relative to their language).
  *   **Leaf 6 (Personalist Bayesian)** must concede they are **rationally permissible**.
  *   **All Realist/Objective leaves (7, 8, 9, 10, 11)** must declare the community **wrong**.
  *   *Diagnostic:* If a student is unwilling to say the Grue-community is objectively wrong, they cannot consistently hold a Natural Kind or Objective Bayesian position.
