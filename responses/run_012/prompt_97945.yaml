prompt: |-
  I volunteer as a mediator at a neighbourhood dispute-resolution centre, and most of what I do is help two parties split something they would both rather split than walk away from — the proceeds of a house they jointly own, the balance of a lease, the assets of a small partnership that is winding down. I have been reading about how economists and game theorists model exactly this situation, and I keep coming back to one proposal in particular. The idea, as I understand it, is that if you can identify two reference points — what each side gets if the talks fail, and the most each side could possibly hope for if the other side were infinitely accommodating — then the fair division is the point where the straight line joining those two reference points crosses the edge of what is actually achievable. I like it because it does not require me to guess at either party's attitude to risk, and because it seems to promise that if the situation improves for one side, that side should never end up worse off, which the better-known alternative — the one that maximises the product of the two sides' gains — apparently does not always guarantee. What I lack is any way to actually use it at the table.

  Please turn it into a procedure I can run in a two-hour session with two ordinary people who have never heard of any of this. I want the questions laid out in order: how to pin down the failure point when the parties disagree about what walking away even means; how to establish each side's maximum claim without letting them simply name an absurd number; how to draw the line and find the crossing point when the feasible set is not a neat smooth curve but a lumpy list of concrete options; and where the procedure has to stop and hand the decision back to the parties because the remaining question is one of values — what counts as a fair claim in the first place — rather than arithmetic. Say what to do when the numbers will not cooperate: when the set of achievable outcomes is not convex, when the failure point is itself contested, and, since I occasionally take three-party cases, what to do when there are more than two sides, which I suspect is where the whole thing quietly falls apart. Then walk me through three cases: a landlord and a tenant dividing a buyout, two former business partners dividing a client list and a set of equipment, and one where I expect the procedure to hand me an answer I will not like — a case where the two sides are symmetric in the formal sense even though I feel strongly that one of them deserves more, so that I can see exactly what the procedure is and is not sensitive to. Finally, tell me honestly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested mediation procedure:

  1.  **Analyze the Request:**
      *   **User:** Volunteer mediator at a neighbourhood dispute-resolution centre.
      *   **Context:** Splitting assets/proceeds (house, lease, partnership).
      *   **Theoretical Basis:** The user describes a specific game-theoretic solution.
          *   *Reference Points:* Disagreement Point (what happens if talks fail) vs. Ideal Point (maximum possible hope).
          *   *Mechanism:* A straight line joining these points crosses the edge of the feasible set.
          *   *Comparison:* User prefers this over Nash Bargaining Solution (maximizing product of gains) because it doesn't require risk attitude assumptions and satisfies monotonicity (if the situation improves for one, they don't get worse off).
          *   *Identification:* This description matches the **Kalai-Smorodinsky Bargaining Solution (KSBS)**. The Nash Bargaining Solution (NBS) maximizes the product of utilities relative to the disagreement point. The KSBS equalizes the *ratio* of achieved gain to maximum possible gain for both parties. It draws a line from the disagreement point to the "utopia point" (ideal point) and finds where it intersects the Pareto frontier.
      *   **Task:** Turn this theory into a practical 2-hour mediation procedure for ordinary people.
      *   **Requirements:**
          *   Step-by-step questions/process.
          *   Handling contested disagreement points.
          *   Establishing maximum claims without absurdity.
          *   Handling "lumpy" (non-continuous/non-convex) feasible sets.
          *   Knowing when to stop (values vs. arithmetic).
          *   Handling non-cooperation/non-convexity.
          *   Handling 3+ parties (acknowledging limitations).
          *   Three specific case walkthroughs (Landlord/Tenant, Partners, Symmetric but morally asymmetric).
          *   Honest limitations section.

  2.  **Deconstruct the Theory (Kalai-Smorodinsky):**
      *   *Disagreement Point ($d$):* BATNA (Best Alternative to a Negotiated Agreement).
      *   *Utopia Point ($u$):* The best each party could get if the other got their minimum ($d$).
      *   *Solution:* Find $x$ on the Pareto frontier such that $\frac{x_1 - d_1}{u_1 - d_1} = \frac{x_2 - d_2}{u_2 - d_2}$.
      *   *Practical Challenge:* People don't think in utilities or coordinates. They think in dollars, dates, and items. The "feasible set" is often discrete options, not a smooth curve.

  3.  **Drafting the Procedure (The "Equal Gain Ratio" Method):**
      *   *Name:* Don't call it Kalai-Smorodinsky. Call it the "Equal Sacrifice" or "Proportional Gain" method. Let's go with "The Proportional Gain Method."
      *   *Time:* 2 Hours.
      *   *Phase 1: The Walk-Away (Disagreement Point).* Needs to be concrete. If contested, mediator estimates or uses a "worst credible case."
      *   *Phase 2: The Dream (Utopia Point).* Needs anchoring. "If the other person said 'yes' to everything, what would you have?" Then check feasibility.
      *   *Phase 3: The Menu (Feasible Set).* List actual options.
      *   *Phase 4: The Calculation.* Map options to the "Gain Ratio."
      *   *Phase 5: The Selection.* Pick the option closest to equal ratios.

  4.  **Addressing Specific Constraints:**
      *   *Contested Walk-Away:* Use a "Shadow Verdict." Mediator proposes a likely court outcome based on experience.
      *   *Absurd Dreams:* Cap at the total available pie. If Party A wants 100% and Party B wants 100%, the Utopia point is (Total, Total) theoretically, but practically constrained by the sum. Actually, KSBS defines $u_i$ as the max $i$ can get given $j$ gets at least $d_j$. So, $u_1 = \text{Total} - d_2$.
      *   *Lumpy/Non-Convex:* We can't draw a perfect line. We look for the option that minimizes the difference between the two parties' "percentage of possible gain."
      *   *3+ Parties:* KSBS generalizes, but it's complex. I need to be honest: it gets messy. Suggest pairwise simplification or acknowledge the procedure breaks down.
      *   *Values vs. Arithmetic:* The procedure calculates *efficiency/fairness based on leverage*. It cannot handle moral desert (who was nicer, who was naughtier) unless encoded in the BATNA.

  5.  **Developing the Case Studies:**
      *   *Case 1: Landlord/Tenant Buyout.*
          *   $d$: Eviction court (costly, slow).
          *   $u$: Landlord gets full rent + possession; Tenant gets full lease term + cash.
          *   Feasible: Cash for keys amounts.
      *   *Case 2: Business Partners (Client List + Equipment).*
          *   $d$: Liquidation (fire sale).
          *   $u$: One keeps all clients + all equipment.
          *   Feasible: Split lists, split equipment, cash equalizer.
      *   *Case 3: Symmetric but Morally Asymmetric.*
          *   Scenario: Roommates. One trashed the place, one didn't. Deposit split.
          *   Formal Symmetry: Both names on lease. BATNA is same (court splits 50/50). Utopia is same (full deposit).
          *   Result: 50/50 split.
          *   Lesson: Procedure sees legal leverage, not moral blame.

  6.  **Refining the Tone:**
      *   Professional, practical, empathetic but firm on the math.
      *   Acknowledge the user's insight (they identified KSBS correctly).
      *   Be honest about limitations (it's a tool, not a judge).

  7.  **Step-by-Step Construction (Mental Check):**
      *   *Intro:* Validate the theory (Kalai-Smorodinsky).
      *   *The Script:* Break down into 15-min blocks.
      *   *The Math:* Simplify the formula into "Percentage of Possible Win."
      *   *Troubleshooting:* Non-convexity (pick closest), 3 parties (warn against it).
      *   *Cases:* Flesh out the numbers.
      *   *Limitations:* Moral desert, emotions, non-quantifiables.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction on Utopia Point:* In KSBS, the ideal point isn't "everything." It's "the most I can get while you get your walk-away." I need to make sure the mediator calculates this correctly. If the pot is \$100k, and Party B's walk-away is \$20k, Party A's ideal is \$80k, not \$100k.
      *   *Correction on 3 Parties:* KSBS *does* exist for $n$-players, but the "line" becomes a ray in $n$-dimensional space intersecting a hypersurface. For a volunteer mediator, this is too hard. I should advise simplifying to pairwise or acknowledging the tool isn't designed for multiparty complexity without software. I will advise caution.
      *   *Non-Convexity:* If the frontier is lumpy, the line might pass through a "gap." The rule is: pick the feasible point that minimizes the distance to the line, or minimizes the difference in gain ratios. I'll suggest minimizing the difference in gain ratios.

  9.  **Final Polish:** Check against all prompt requirements.
      *   Procedure for 2-hour session? Yes.
      *   Questions in order? Yes.
      *   Pin down failure point? Yes.
      *   Establish max claim? Yes.
      *   Draw line/lumpy options? Yes.
      *   Stop point (values)? Yes.
      *   Numbers won't cooperate (non-convex)? Yes.
      *   3+ parties? Yes.
      *   Three cases (Landlord, Partners, Symmetric/Moral)? Yes.
      *   Honest limitations? Yes.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  You have correctly identified the **Kalai-Smorodinsky Bargaining Solution (KSBS)**. Unlike the Nash Bargaining Solution, which maximizes the *product* of gains (and can be sensitive to how utility is scaled or risk attitudes), the KSBS equalizes the *ratio* of actual gain to maximum possible gain for each party. It asks: "What split gives both of you the same percentage of your best-case scenario?"

  It is an excellent tool for mediation because it feels intuitive: it splits the *surplus* cooperation creates, proportionally. However, as you noted, theory assumes smooth curves and agreed-upon coordinates. Reality is lumpy, contested, and emotional.

  Here is a practical procedure to operationalize this in a two-hour session. I call this **The Proportional Gain Method**.

  ---

  ### The Procedure: The Proportional Gain Method
  **Time:** 120 Minutes
  **Materials:** Whiteboard, calculator, two columns of paper (one for each party, kept private until calculation).

  #### Phase 1: The Walk-Away (Minutes 0–30)
  *Goal: Establish the Disagreement Point ($d$).*
  The KSBS line starts at the point where talks fail. If parties disagree on this, the line has no anchor.

  1.  **Separate Caucuses (10 mins each):** Ask Party A and Party B privately: "If you leave this room today without an agreement, exactly what happens tomorrow? Be specific. What are the costs, the delays, and the likely outcome?"
  2.  **The Shadow Verdict:** If their stories differ wildly (e.g., Tenant says "I stay for free," Landlord says "I evict tomorrow"), do not let them argue. You are the actuary.
      *   *Script:* "I am not a judge, but based on similar cases I've seen, the most likely outcome of [Court/Arbitration] is $X$ for you and $Y$ for them, minus $Z$ in legal fees. We will use these numbers as our baseline. If you reject this baseline, you are choosing to gamble against my experience."
  3.  **Lock the Numbers:** Write $d_A$ and $d_B$ on the board. These are the "Walk-Away Values."
      *   *Note:* These must be in the same units (usually dollars). If one party values "peace of mind," ask them to put a dollar value on it to stay in the room, or exclude it from the math and treat it as a side constraint.

  #### Phase 2: The Dream Cap (Minutes 30–60)
  *Goal: Establish the Utopia Point ($u$).*
  This is not "what I want." It is "the most I *could* get if the other person got their Walk-Away Value." This prevents absurd claims.

  1.  **Define the Total Pie:** What is the maximum total value available to be split? (e.g., House equity + Cash on hand = $500,000).
  2.  **Calculate Individual Ceilings:**
      *   Party A's Ideal ($u_A$) = Total Pie − Party B's Walk-Away ($d_B$).
      *   Party B's Ideal ($u_B$) = Total Pie − Party A's Walk-Away ($d_A$).
      *   *Script:* "Party A, I know you want everything. But Party B is guaranteed at least their Walk-Away Value of $50k. So the absolute maximum you can mathematically claim is the Total minus their guarantee. That is your 'Dream Cap'."
  3.  **Verify:** Ensure $u_A + u_B > \text{Total Pie}$. If not, there is no surplus to bargain over; the dispute is purely distributive (zero-sum), and mediation may not help.

  #### Phase 3: The Menu of Options (Minutes 60–90)
  *Goal: Define the Feasible Set.*
  Real life is not a smooth curve; it is a list of discrete options.

  1.  **Brainstorm Concrete Packages:** Do not discuss "principles." Discuss packages.
      *   *Option 1:* 60/40 split, Landlord pays repairs.
      *   *Option 2:* 50/50 split, Tenant takes furniture.
      *   *Option 3:* Lump sum cash now.
  2.  **Value the Options:** Assign a dollar value to each option for each party ($V_{A}$ and $V_{B}$).
      *   *Troubleshooting:* If they value an item differently (e.g., sentimental value), use the owner's valuation for that item but ensure the *total* package value is consistent. If necessary, use "cash equivalents" to bridge valuation gaps.

  #### Phase 4: The Calculation (Minutes 90–105)
  *Goal: Find the Crossing Point.*
  Now you do the math they cannot see. You are looking for the option where the **Gain Ratio** is most equal.

  1.  **Calculate the Gain Ratio for each option:**
      $$ \text{Ratio}_A = \frac{V_A - d_A}{u_A - d_A} $$
      $$ \text{Ratio}_B = \frac{V_B - d_B}{u_B - d_B} $$
      *(This asks: "What percentage of your possible improvement did you actually get?")*
  2.  **Find the Match:** Look for the option where $\text{Ratio}_A \approx \text{Ratio}_B$.
      *   If the feasible set is "lumpy" (non-convex), the line won't hit a point exactly. Choose the option that **minimizes the difference** between the two ratios.
  3.  **The Recommendation:** Present the single option that creates the most "Equal Proportional Gain."

  #### Phase 5: The Value Check (Minutes 105–120)
  *Goal: Hand back the Decision.*
  The math identifies efficiency and proportional fairness. It does not identify moral desert.

  1.  **Present the Result:** "Mathematically, Option 3 gives both of you 65% of your maximum possible improvement. Option 1 gives Party A 80% and Party B 40%."
  2.  **The Stop Rule:** If a party says, "That's mathematically fair, but morally wrong because they lied to me," **stop the math.**
      *   *Script:* "This procedure measures leverage and potential, not blame. If you want to adjust for moral reasons, you must do it voluntarily. I cannot calculate 'deservedness'."
  3.  **Agreement:** If they accept the proportional split, draft the term sheet. If they reject it to punish the other, close the file.

  ---

  ### Troubleshooting the Glitches

  **1. When the Numbers Won't Cooperate (Non-Convexity)**
  Sometimes the "line" passes through a gap where no actual deal exists.
  *   *Example:* The equal-ratio point suggests a split of $53,400. The only available options are $50,000 or $60,000.
  *   *Fix:* Calculate the "Fairness Gap" for the nearest options.
      *   Option Low: Ratio A = 0.60, Ratio B = 0.65 (Gap = 0.05)
      *   Option High: Ratio A = 0.70, Ratio B = 0.55 (Gap = 0.15)
      *   *Decision:* Pick Option Low. It is closer to the ideal line. Explain: "We can't hit the exact center, so we pick the option that keeps you closest to each other."

  **2. When the Walk-Away is Contested**
  If Party A says "I'll win $100k in court" and Party B says "They'll get nothing," and you cannot impose a Shadow Verdict without losing trust:
  *   *Fix:* Use a **Range BATNA**.
      *   Low Case: $20k. High Case: $80k.
      *   Run the calculation twice. If the same Option comes out best in both scenarios, you have a robust solution. If the result flips, tell them: "The math depends entirely on who is right about the court case. Do you want to gamble on that, or split the difference?"

  **3. Three or More Parties**
  You suspected this is where it falls apart. You are right.
  *   *The Problem:* In 3-party cases, the "line" becomes a ray in 3D space. The "feasible set" becomes a surface. Coalitions form (A+B vs C). The KSBS assumes no coalitions.
  *   *The Fix:* Do not use this procedure for 3+ parties unless the assets are perfectly divisible (e.g., cash).
      *   *Workaround:* Reduce to pairwise. If A, B, and C own a house, treat it as (A vs B+C). Split the equity, then let B and C split their share using the same method later.
      *   *Warning:* If the dispute involves distinct assets (A wants the car, B wants the boat, C wants the cash), KSBS fails. Use "Knaster's Procedure" (sealed bids) instead.

  ---

  ### Case Walkthroughs

  #### Case 1: Landlord and Tenant (The Buyout)
  *   **Context:** Landlord wants property back. Tenant has a rent-controlled lease.
  *   **Walk-Away ($d$):**
      *   Landlord ($d_L$): Eviction takes 1 year, costs $10k in legal fees, lost rent $20k. Net Value: -$30k.
      *   Tenant ($d_T$): Stays 1 year, pays rent, suffers stress. Net Value: $0 (status quo).
  *   **Dream Cap ($u$):**
      *   Total Pie (Value of vacant possession + 1 year rent): $100k.
      *   $u_L$ = $100k - d_T$ ($0) = $100k.
      *   $u_T$ = $100k - d_L$ (-$30k) = $130k. (Note: Negative BATNA increases the surplus).
  *   **The Menu:**
      *   Option A: $20k Cash for Keys. ($V_L$=$80k, $V_T$=$20k)
      *   Option B: $50k Cash for Keys. ($V_L$=$50k, $V_T$=$50k)
  *   **The Calculation:**
      *   *Option A:*
          *   Landlord Gain: $80 - (-30) = 110$. Max Gain: $100 - (-30) = 130$. Ratio: 110/130 = **85%**.
          *   Tenant Gain: $20 - 0 = 20$. Max Gain: $130 - 0 = 130$. Ratio: 20/130 = **15%**.
          *   *Mismatch.*
      *   *Option B:*
          *   Landlord Gain: $50 - (-30) = 80$. Ratio: 80/130 = **61%**.
          *   Tenant Gain: $50 - 0 = 50$. Ratio: 50/130 = **38%**.
          *   *Still mismatched, but closer.*
      *   *Interpolation:* The math suggests a buyout around $65k would equalize ratios at ~50%.
  *   **Result:** You propose $65k. Both parties get roughly half of their possible improvement over the misery of court.

  #### Case 2: Business Partners (Client List + Equipment)
  *   **Context:** Partnership dissolving. Assets: Client List (worth $200k), Equipment (worth $50k).
  *   **Walk-Away ($d$):**
      *   Partner A ($d_A$): Liquidation. Gets 50% of fire-sale value. Total $125k * 0.5 = $62.5k.
      *   Partner B ($d_B$): Same. $62.5k.
  *   **Dream Cap ($u$):**
      *   Total Pie: $250k.
      *   $u_A$ = $250k - 62.5k = $187.5k.
      *   $u_B$ = $250k - 62.5k = $187.5k.
  *   **The Menu:**
      *   Option 1: A takes Clients, B takes Equipment + $150k cash.
      *   Option 2: Split Clients 50/50, Split Equipment 50/50.
  *   **The Calculation:**
      *   *Option 1:* A gets $200k value. B gets $50k + $150k = $200k value.
      *   Gain for A: $200 - 62.5 = 137.5$. Max Gain: $187.5 - 62.5 = 125$. **Wait.**
      *   *Correction:* In this specific symmetric case, KSBS collapses to an equal split of the surplus.
      *   Surplus = Total ($250k) - Sum of BATNAs ($125k) = $125k.
      *   Each should get BATNA + 50% Surplus = $62.5k + $62.5k = $125k.
      *   *Problem:* Option 1 gives them $200k each? That implies the Total Pie is actually $400k (impossible).
      *   *Real Check:* If A takes Clients ($200k), B takes Equipment ($50k). To equalize, A must pay B $75k.
      *   Final: A has $125k net, B has $125k net.
  *   **Result:** The procedure forces the "Cash Equalizer." It prevents A from claiming "I brought the clients, I keep them" without compensating B for their walk-away right.

  #### Case 3: The Symmetric/Moral Asymmetry (The Roommate Deposit)
  *   **Context:** Two roommates, one lease. $4,000 security deposit. One trashed the place (Party A), one was perfect (Party B). Landlord deducts $2,000 for damage caused by A. $2,000 remains.
  *   **The Trap:** You feel Party B deserves the whole $2,000. Party A claims 50%.
  *   **Walk-Away ($d$):**
      *   Small Claims Court splits remaining deposit based on names on lease. 50/50.
      *   $d_A$ = $1,000. $d_B$ = $1,000.
  *   **Dream Cap ($u$):**
      *   Total Pie: $2,000.
      *   $u_A$ = $2,000 - 1,000 = $1,000.
      *   $u_B$ = $2,000 - 1,000 = $1,000.
  *   **The Calculation:**
      *   Max Gain for A: $1,000 - 1,000 = 0$.
      *   Max Gain for B: $1,000 - 1,000 = 0$.
      *   *Error:* The procedure breaks because there is no surplus. The Walk-Away *is* the Total Pie.
      *   *Adjustment:* If we assume mediation saves court fees ($200 each), the Pie is $2,200 value.
      *   Surplus = $200. KSBS splits surplus 50/50.
      *   Result: A gets $1,100 value, B gets $1,100 value.
  *   **The Outcome You Won't Like:** The procedure gives Party A (the trasher) half the remaining deposit.
  *   **Why:** KSBS is blind to moral hazard. It sees legal leverage. Both names are on the lease; both have equal power to block agreement.
  *   **The Intervention:** This is where you stop the math (Phase 5).
      *   *Script:* "The math says 50/50 because you have equal legal power. But Party B, you have moral leverage. Party A, do you want a deal that leaves you owing your friend, or do you want to walk away with $1,000 and a broken friendship?"
      *   *Lesson:* The procedure identifies the *coercive* equilibrium, not the *moral* one.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Measure "Desert":** As seen in Case 3, KSBS rewards leverage, not virtue. If a villain has a strong BATNA, the math rewards the villain. You must overlay moral suasion in Phase 5.
  2.  **It Cannot Handle Indivisibles Well:** If the only asset is a family heirloom that neither will sell, the "feasible set" is binary (A gets it or B gets it). The line will likely fall in the middle, forcing a randomization (coin flip) or a cash buyout that one party can't afford.
  3.  **It Assumes Rational Valuation:** If Party A values the house at $1M and Party B values it at $500k, the "Total Pie" is undefined. You must force a market valuation before starting, or the math is garbage-in-garbage-out.
  4.  **It Cannot Fix Power Imbalances:** If Party A is a bank and Party B is an individual, the Bank's BATNA is cheap litigation. The Individual's BATNA is bankruptcy. The KSBS will mathematically validate the Bank's leverage. In these cases, this procedure is unethical to use without external advocacy for the weaker party.

  ### Final Advice
  Use the Proportional Gain Method to break deadlocks on **price** and **divisible assets**. It shines when both sides know they should settle but can't agree on the number.

  Do not use it when the dispute is about **truth, apology, or future behavior**. In those cases, the "Walk-Away" point is emotional, not financial, and the math will insult them. When the numbers stop making sense to the human heart, put the calculator away and listen.
