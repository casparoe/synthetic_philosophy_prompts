prompt: |-
  Backend engineer here, no philosophy training, trying to settle an argument that keeps coming back in my group chat. The line is 'extraordinary claims require extraordinary evidence' -- you see it on every science-communication thread -- and my friend Dave uses it like a gavel. Last week another friend told us his uncle's scans came back clean a few months after he was told the cancer was terminal, and mentioned there was a prayer circle involved; Dave said 'extraordinary claims require extraordinary evidence,' and that was it, argument over, next topic. What bugs me is I can't tell weather Dave said something deep or just restated 'I'm skeptical,' and I don't think the sentence can mean only one thing. It could be the trivial Bayesian point that how confident you should be depends on how surprising the claim is; it could be a rule about what kind of evidence counts (weird claims need weird evidence, whatever that would even be); it could be Hume's much stronger conclusion that testimony can basically never establish a miracle; or it could be a free-standing standard of proof, like 'beyond reasonable doubt.' Hume is the obvious reference point, the 'Of Miracles' chapter in the Enquiry, where he writes that 'A wise man, therefore, proportions his belief to the evidence' before getting into the testimony stuff -- but I can't tell which of these readings Dave's version is, or which one Hume himself was actually running.

  So lay the readings out as a menu. For each one, spell out the precise claim in a sentence or two of plain English (what it commits you to, what it rules out), then give me your verdict -- platitude, substantive but defensible, false, or just too vague to assess -- and say whether that reading actually licenses what Dave did with it, namely treating the uncle story as closed without asking a single follow-up question. Two extra cases to test the readings against, since I think they pull in different directions: (a) someone wins the lottery twice, which is absurdly improbable and yet nobody demands extraordinary evidence for it, and (b) a physics lab announces a result that overturns something in the textbooks, where I'd want to see the data before believing it, but not obviously a different *kind* of data. Then tell me which reading is closest to what Hume was actually doing in that chapter, and where the popular one-liner has drifted from it. I want the whole menu, not just the one you'd pick.

  Give it to me as a table I can paste into the chat, with these columns: `reading` (short label, a few words), `precise_claim` (the thesis spelled out in plain English), `what_it_rules_out`, `verdict` (one of: platitude / defensible / false / too vague), `verdict_why` (one sentence), `licenses_daves_move` (yes / no / partly, plus a clause saying why), and `what_counts_as_extraordinary_evidence_here` (how that reading would answer it for the uncle case). Then after the table, a JSON object with fields `most_likely_reading`, `most_defensible_reading`, `reading_closest_to_hume`, `does_any_reading_license_daves_move` (boolean plus one sentence), and `what_dave_should_have_said_instead`. No citations or reading lists needed, I just want the distinctions.
