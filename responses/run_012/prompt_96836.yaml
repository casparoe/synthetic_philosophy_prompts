answer: |-
  You have identified a very real, well-documented phenomenon, though it sits at the intersection of semiotics, political theory, and cultural evolution, which is why it feels like it slips through the net of standard "memetics."

  The most precise established term for this is the **Empty Signifier** (or its anthropological cousin, the **Floating Signifier**).

  However, "Empty Signifier" is a label from political theory (Ernesto Laclau, Claude Lévi-Strauss). To give you the "carving" you want—the evolutionary mechanics and the boundaries against similar concepts—we need to translate that into the Darwinian/memetic framework you are using.

  In evolutionary terms, you are describing a **High-Fidelity Form / Low-Fidelity Content Replicator** that utilizes **Adaptive Indeterminacy** as a transmission shield.

  Here is the carving of the concept, how it works, and where the boundaries lie.

  ### 1. The Core Mechanism: Falsification Immunity
  In standard memetics, an idea spreads because it is catchy, useful, or true. In the pattern you identified, the idea spreads because it is **unfalsifiable**.

  *   **Standard Meme:** "Drink 8 glasses of water." (Determinable. Can be tested. Can be proven false. If proven false, it loses transmission power among rational agents.)
  *   **Your Phenomenon:** "Everything happens for a reason." (Indeterminate. Cannot be tested. Cannot be proven false. If challenged, the definition shifts.)

  The vagueness is not a bug; it is an **immunological defense**. By remaining undefined, the concept avoids contact with reality. As soon as you define it ("It means God plans events"), it becomes a claim about the world. Claims can be wrong. Wrong things stop spreading among skeptics. By remaining vague ("It's just the spirit of the thing"), it remains a *stance* rather than a *claim*. Stances are social; claims are factual. Social stances spread via affiliation; factual claims spread via evidence.

  ### 2. The Name: Empty vs. Floating Signifier
  *   **Floating Signifier (Lévi-Strauss):** Originally used to describe concepts like *mana* in indigenous cultures. It signifies "power" or "meaning" without specifying *what* meaning. It is a symbol in search of a signified.
  *   **Empty Signifier (Laclau):** Used in political theory. A term (e.g., "Freedom," "The People") that is so vague it can be filled by anyone's specific grievances, allowing a coalition to form without agreeing on specifics.

  In your corporate/social examples ("Synergy," "Wellness," "Toxic"), the term functions as a **Social Coordination Token**. It signals "I am part of this tribe" without requiring "I agree with this specific ontology."

  ### 3. The Boundaries (The Carving)
  You asked for the edges. Here is how this phenomenon differs from its lookalikes.

  #### A. vs. Ordinary Ambiguity
  *   **Ordinary Ambiguity:** "I went to the bank." (River or money?) Context usually resolves this quickly. The goal of communication is to *remove* the ambiguity to transfer information.
  *   **Adaptive Indeterminacy (Your Phenomenon):** The goal is to *preserve* the ambiguity. If context resolves it, the spell breaks. If someone says, "Synergy means we will cut 10% of staff," the word loses its magic. The group prefers the word remain undefined because the definition would cause conflict. The vagueness is the *function*, not a failure of language.

  #### B. vs. Deliberate Political Slogans
  *   **Slogans:** "Make America Great Again" or "Yes We Can." These are often top-down. There is a strategist intentionally designing the vagueness to capture votes.
  *   **Your Phenomenon:** Often emergent. No single CEO sat down and designed "Everything happens for a reason" to manipulate employees. It spread organically because it offered a **low-cost social signal**. It allows people to signal agreement without incurring the cognitive cost of actually agreeing on a complex theology or business strategy. It is Darwinian selection of phrases, not intelligent design of marketing.

  #### C. vs. Clichés
  *   **Clichés:** "At the end of the day." These spread through overuse but eventually lose power. They become background noise (phatic). People stop processing them entirely.
  *   **Your Phenomenon:** These retain *active* power. They are used to shut down argument or validate decisions. They demand a nod of assent. A cliché is ignored; an Empty Signifier is revered. The "spirit of the thing" still commands respect, whereas a cliché commands nothing.

  #### D. vs. False Facts (The "8 Glasses" Case)
  *   **False Facts:** These are **determinate lies**. They have a specific truth condition. They spread because of ignorance or bias, but they are vulnerable to correction.
  *   **Your Phenomenon:** These are **structural vacuums**. They cannot be corrected because they contain no specific information to correct. They are not false; they are *void*. You cannot refute "vibes."

  ### 4. Why Definition Kills Transmission
  You noted that when someone defines the term, it stops spreading. In quantum terms, this is **collapsing the superposition**.

  As long as "Synergy" is undefined, Employee A can think it means "collaboration" and Employee B can think it means "cost-cutting," and they can both vote for the "Synergy Initiative." They are both replicating the meme.
  The moment a consultant defines Synergy as "Cost-cutting," Employee A stops replicating it (because they hate cost-cutting). The definition forces a selection event. The vagueness allows the meme to parasitize multiple conflicting host psychologies simultaneously.

  ### Summary Label
  If you need a single term to search for or use, **Empty Signifier** is the academic standard.

  However, if you want a term that captures the *evolutionary mechanism* you described, the most accurate descriptive phrase is **Falsification-Proof Replicator**.

  It is a cultural unit that has evolved to maximize transmission by minimizing the surface area available for reality to grab onto. It survives not because it is fit for the environment, but because it is slippery enough to avoid being tested by it.

  ### The "Tell"
  The ultimate diagnostic test for this phenomenon is the **Retreat to Abstraction**.
  1.  **Usage:** "We need more synergy."
  2.  **Challenge:** "What does that mean specifically?"
  3.  **Retreat:** "It's not about specifics, it's about the mindset."
  4.  **Continuation:** "Right, the mindset. So, synergy."

  If the speaker retreats to "mindset," "spirit," or "vibe" to avoid definition but continues to use the word as if it carries weight, you have identified an Empty Signifier operating via Adaptive Indeterminacy.
