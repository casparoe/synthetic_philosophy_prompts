  **(Self-Correction Note on Vickrey):** Wait, strictly speaking, Vickrey-Clarke-Groves (VCG) mechanisms are strategy-proof. The friend said "auction theory does with Vickrey auctions." This is true for auctions. The error is implying this applies to *voting* without money. I need to make sure I don't say VCG doesn't exist, but that it requires transferable utility (money) which a book club lacks.

