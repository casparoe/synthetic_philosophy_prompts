          2.  Unrestricted domain (any preference order allowed).
          3.  Surjective (every candidate can win).
          4.  Deterministic.
          5.  Ordinal preferences (no cardinal utility).
      *   What happens if we relax them?
          *   *Randomization:* Random Dictator or other probabilistic mechanisms (Gibbard 1977/1978).
