answer: |-
  ### PhD Comprehensive Examination: Philosophy of History
  **Topic:** Modality and Explanation
  **Time Allowed:** 4 Hours

  **Question 1**
  A historian proposes a quantitative metric for historical contingency. They construct a computational simulation of a specific period (e.g., the Battle of Waterloo). They run the simulation 10,000 times, introducing random "tiny perturbations" in each run—a general sleeps an hour late, a courier's horse goes lame, a letter arrives a day late. They calculate the fraction of runs where the actual historical outcome (e.g., Napoleon's defeat) fails to occur. They call this fraction the **Contingency Score (CS)**. A CS of 0.9 implies high contingency; a CS of 0.1 implies low contingency.

  Critically evaluate the philosophical validity of the Contingency Score. Does this number track metaphysical contingency, or does it measure something else (e.g., model fragility, epistemic sensitivity)? Discuss whether the set of "tiny perturbations" is well-defined or if it silently smuggles in modal assumptions. Finally, assess whether a high CS licenses the claim "it could easily have gone otherwise," or merely "my model is unstable."

  ***

  ### Model Answer

  The proposal to quantify contingency via a Contingency Score (CS) mistakes a property of a model for a property of the world. While the CS offers a precise measure of *counterfactual sensitivity within a specific simulation*, it fails to capture *metaphysical contingency* without substantial philosophical qualification. To evaluate the CS, we must distinguish between the fragility of a causal narrative and the openness of the historical future, and scrutinize the modal assumptions embedded in the perturbation set.

  First, the CS measures sensitivity to initial conditions, not necessarily contingency. In chaos theory, a system can be highly sensitive to initial conditions (butterfly effect) while remaining deterministic. If the simulation is deterministic, a high CS merely indicates that the outcome depends on a precise conjunction of factors. This is *causal fragility*, not *ontological contingency*. Contingency implies that the outcome was not necessitated by prior states and laws. However, the simulation cannot test necessitation; it can only test variation. A high CS shows that *given the model's rules*, small changes yield different results. It does not prove that those small changes were genuinely possible in the actual world. Thus, the CS tracks the topological instability of the historian's causal model, not the modal structure of history itself.

  Second, the definition of "tiny perturbations" suffers from a severe measure problem. To generate the CS, the historian must select which perturbations count as "tiny" and which count as "relevant." Deciding that a "general sleeping late" is a valid perturbation but "an asteroid striking the battlefield" is not requires a prior theory of possibility. This selection process silently smuggles in the very modal intuitions the CS claims to measure. If the historian includes perturbations that favor outcome B but excludes those favoring outcome A, the CS is biased. Furthermore, the probability distribution assigned to these perturbations is arbitrary. Is a lame horse as probable as a late letter? The CS treats them as equiprobable random variables unless weighted. If weighted, the weights reflect the historian's epistemic expectations, not metaphysical frequencies. Therefore, the CS is circular: it quantifies the range of possibilities the historian was already willing to entertain before running the simulation.

  Third, we must separate epistemic from metaphysical contingency. A high CS might indicate that our *knowledge* of the outcome is precarious (epistemic), rather than that the *outcome itself* was chancy (metaphysical). If the simulation relies on incomplete data, the "random perturbations" may simply model our ignorance of the actual initial conditions. In this case, a high CS licenses the claim "we cannot be sure why this happened," but not "this did not have to happen." To claim metaphysical contingency, one must argue that the actual world possessed branching possibilities at that moment. A simulation of the actual world, however, runs on a single track of actual laws. It cannot generate alternative possibilities unless it incorporates indeterministic laws. If the simulation is deterministic, the CS is a measure of human ignorance regarding initial conditions, not a measure of nature's openness.

  Finally, does a high CS license the claim "it could easily have gone otherwise"? Only if "easily" is defined relative to the model's parameter space. A defensible contingency claim must assert that the causal structure of the period was loosely coupled, such that common, low-energy events frequently redirect macro-outcomes. The CS supports this only if the perturbation set reflects the *actual frequency* of such events in the historical environment. If "generals sleeping late" is a rare event, a high sensitivity to it does not make the outcome "easy" to alter in reality, only in the model.

  In conclusion, the Contingency Score is a valid measure of *narrative fragility* within a specific causal model. It demonstrates that a historian's explanation relies on a precarious chain of events. However, it cannot measure metaphysical contingency because the perturbation set is normatively selected, not empirically discovered, and the simulation cannot distinguish between deterministic sensitivity and genuine modal openness. A high CS proves the model is unstable, not that history was unwritten.

  ***

  ### Marking Scheme (20 Marks)

  **A Grade (17–20 Marks): Distinct Philosophical Precision**
  To achieve an A, the candidate must make the following specific moves, going beyond general skepticism:
  1.  **Model vs. World Distinction (5 marks):** Explicitly argues that the CS measures properties of the *simulation* (sensitivity/fragility) rather than the *world* (metaphysical contingency). Identifies that deterministic systems can yield high CS without being contingent.
  2.  **The Measure/Reference Class Problem (5 marks):** Identifies that the selection of "tiny perturbations" is not neutral. Explains how the historian "smuggles" modal assumptions into the setup by deciding which perturbations are permissible or probable.
  3.  **Epistemic vs. Metaphysical (5 marks):** Clearly distinguishes between uncertainty about initial conditions (epistemic) and the openness of the future (metaphysical). Argues that CS often measures the former while claiming to measure the latter.
  4.  **Defensible Claim Formulation (5 marks):** Concludes by specifying what a valid contingency claim *would* require (e.g., matching perturbation frequency to historical reality) rather than simply rejecting the metric.

  **B Grade (14–16 Marks): Competent but Standard Analysis**
  A B answer will address the prompt but miss the deeper philosophical machinery:
  1.  **Sensitivity Identified (4 marks):** Notes that the CS shows sensitivity to initial conditions (chaos theory) but may conflate this with contingency.
  2.  **Bias Noted (4 marks):** Mentions that choosing perturbations is subjective but does not fully explore the "smuggling" of modal assumptions or the probability weighting issue.
  3.  **Possibility Discussed (4 marks):** Discusses "could have gone otherwise" but may not rigorously separate epistemic uncertainty from metaphysical possibility.
  4.  **Conclusion (4 marks):** Provides a reasonable conclusion but may treat the CS as "useful but limited" without specifying the categorical error between model instability and historical openness.

  **C Grade (10–13 Marks): Surface Level**
  *   Treats the CS as a practical tool without analyzing the modal logic.
  *   Fails to distinguish between the simulation's rules and historical laws.
  *   Relies on general platitudes about history being complex.

  **Fail (<10 Marks):**
  *   Misunderstands the setup.
  *   Fails to address the relationship between the score and the concept of contingency.
  *   Significant philosophical errors (e.g., claiming the simulation proves free will).
