      *   *Contextual Fit:* For a funding scheme with *stated rules* ("only if all three... hold"), consistency is legally/procedurally paramount. If you say "Rule is A, B, C" but fund based on "Vibe", you open yourself to appeals (which the user notes happen 1 in 10). Therefore, **Premise-Based Procedure (PBP)** is the only defensible choice for accountability, even if it feels undemocratic on the specific outcome.

