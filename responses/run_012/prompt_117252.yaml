answer: |-
  You are experiencing the **Discursive Dilemma** (also known as the Doctrinal Paradox). It is a proven mathematical result in social choice theory: if a group votes logically on reasons (premises) and also votes on the outcome (conclusion), the two can contradict each other even if every individual is consistent. You cannot have a voting system that is perfectly consistent, perfectly responsive to individual judgments, and immune to manipulation all at once. You must choose which property to sacrifice.

  For a public funding scheme with written rules and a right of appeal, **Consistency** is your survival trait. If you fund based on a "bottom line" vote when criteria weren't met, you lose appeals. If you reject when criteria were met, you lose appeals. To survive appeals, your minutes must show that the *Rules* determined the outcome, not the *Vibe*.

  Therefore, you must adopt a **Premise-Based Procedure (PBP)**. This prioritizes the integrity of your stated criteria over the holistic mood of the room. Below is the procedure, the trade-offs, and the test cases.

  ### The Procedure: Premise-Based Derivation

  **1. Lock the Criteria (Pre-Meeting)**
  *   **Rule:** The Chair cannot unilaterally define or split criteria. The six panel members must ratify the exact wording and number of criteria at the start of the funding cycle (e.g., September).
  *   **Constraint:** Exactly three criteria. No sub-clauses. No "AND/OR" within a single criterion.
  *   **Why:** This prevents the "March effect" where rewording changes the mathematical weight of the vote.

  **2. The Voting Order (In Meeting)**
  *   **Step A:** Vote on Criterion 1 (Yes/No/Abstain).
  *   **Step B:** Vote on Criterion 2 (Yes/No/Abstain).
  *   **Step C:** Vote on Criterion 3 (Yes/No/Abstain).
  *   **Step D:** Calculate Outcome. (If A, B, and C are all "Passed", Outcome = Fund. Otherwise, Outcome = Reject).
  *   **Step E:** Vote on "Indicative Funding" (Yes/No). This vote is **non-binding**.

  **3. Aggregation Rules (Mechanical)**
  *   **Threshold:** A criterion passes if >50% of *valid votes cast* are Yes.
  *   **Ties:** A tie (e.g., 3-3, or 2-2 with 2 abstentions) counts as **Fail**. (Status quo bias protects funds).
  *   **Abstentions:** Excluded from the denominator. (If 6 members, 1 abstains, 5 vote: 3 Yes passes).
  *   **Refusal:** If a member refuses to vote on premises, record as Abstention. They remain eligible to vote on the Indicative Funding.

  **4. Conflict Resolution (The Hard Rule)**
  *   **Rule:** If the Calculated Outcome (Step D) differs from the Indicative Vote (Step E), **the Calculated Outcome stands.**
  *   **Minutes:** Record the Calculated Outcome as the *Decision*. Record the Indicative Vote as *Panel Sentiment*. Do not record the Indicative Vote as the decision.

  **5. Chair Constraints**
  *   **Rule:** The Chair votes like any other member. The Chair only casts a tie-breaking vote if the panel size is odd (yours is even, so ties stand as Fails). The Chair cannot override the derivation.

  ### The Trade-Off (Impossibility Result)
  You asked what property we are giving up. By choosing PBP, you are sacrificing **Responsiveness**.
  *   **What this means:** There will be cases where a majority of the panel wants to fund a project, but the criteria say No (or vice versa). The procedure will force you to ignore the majority's holistic judgment to maintain consistency with the rules.
  *   **Why:** This is the only way to defeat an appeal. An appellant can demand the minutes. If the minutes say "Criteria Met" but "Funding Rejected," you are vulnerable. If the minutes say "Criteria Not Met" (even if everyone liked the project), you are safe.

  ### Failure Modes
  *   **Strategic Voting:** A member might vote 'Yes' on a weak criterion to ensure a project passes the threshold, hoping others do the same. *Mitigation:* Premise votes are recorded individually in minutes. It is harder to lie on the record about specific facts (e.g., "Is the budget realistic?") than on a general "Should we fund?"
  *   **The "Box-Ticking" Tyranny:** A project might meet all criteria but be intuitively terrible. PBP forces you to fund it. *Mitigation:* This is the price of a rules-based scheme. If the criteria are too loose, fix them next year (see Step 1).
  *   **Member Fatigue:** Members may treat premise votes as routine. *Mitigation:* As Chair, you must enforce the sequence. Do not allow discussion of "Should we fund?" until premise votes are cast.

  ---

  ### Test Case 1: The March Profile (Your Actual Crisis)
  *   **Input:** 6 Members. Criteria 1, 2, 3 all pass 4-2. Indicative Fund Vote fails 3-2 (1 abstention/absence in vote count logic, or 3-2 with 1 abstention).
  *   **Procedure Output:**
      1.  C1 Pass (4-2). C2 Pass (4-2). C3 Pass (4-2).
      2.  Calculated Outcome: **Fund**.
      3.  Indicative Vote: Reject.
      4.  **Decision:** Fund.
  *   **Minutes:** "Criteria 1-3 met by majority vote. Per scheme rules, application approved. Indicative sentiment vote was negative but non-binding."
  *   **Response to Complainer:** "The minutes accurately reflect the binding rules of the scheme. The committee is bound by the criteria agreed at the start of the year. The negative sentiment vote is recorded, but the rules require us to fund when criteria are met. To do otherwise would expose the faculty to successful appeals."

  ### Test Case 2: The Split Criterion (The Wording Trap)
  *   **Input:** Same 6 members, same views. But Criterion 3 ("Fit") is split into 3a ("Fit A") and 3b ("Fit B"). Both must pass.
  *   **Scenario:** Members who voted Yes on "Fit" split their votes on 3a and 3b (e.g., 3 vote Yes on both, 1 votes Yes on 3a/No on 3b, 2 vote No on both).
  *   **Procedure Output:**
      1.  C1 Pass. C2 Pass.
      2.  C3a Pass (4-2). C3b Fail (3-3).
      3.  Calculated Outcome: **Reject**.
  *   **Analysis:** The decision flipped from Fund to Reject solely because you changed the wording.
  *   **Fix:** Step 1 of the procedure forbids this. The criteria are locked for the year. If the panel wishes to split a criterion, it must be done at the start of the *next* cycle, not during assessment. This procedure prevents you from accidentally changing the rules mid-game.

  ### Test Case 3: The Unwelcome Outcome (The Cost of Consistency)
  *   **Input:** 6 Members.
      *   C1 (Doable): 4 Yes, 2 No. (Pass)
      *   C2 (Track Record): 4 Yes, 2 No. (Pass)
      *   C3 (Fit): 3 Yes, 3 No. (**Fail** on tie-break)
      *   Indicative Fund Vote: 4 Yes, 2 No. (**Pass**)
  *   **Procedure Output:**
      1.  Calculated Outcome: **Reject** (because C3 failed).
      2.  Indicative Vote: Fund.
      3.  **Decision:** Reject.
  *   **Why you won't like it:** A clear majority (4 out of 6) wants to give this money. The procedure forces you to say No. You will feel undemocratic.
  *   **Why it's necessary:** If you fund this, and a rejected applicant from a previous year (who passed C3 but failed C1) appeals, you have no defense. You must apply the rules evenly. This case shows that the procedure protects the *scheme's integrity* at the expense of the *panel's current desire*.

  ### Mechanical vs. Judgment
  *   **Mechanical:** Counting votes, applying the tie-break, deriving the outcome from the criteria.
  *   **Judgment:** Assessing whether a specific application meets a criterion (e.g., "Is £20k enough for this?"). The procedure does not remove the need for expert judgment; it only structures how that judgment is aggregated.

  ### Final Advice
  The power you feared (wording criteria) is constrained by requiring panel ratification at the start of the year. The minutes controversy is solved by recording the *Derived Outcome* as the decision, not the *Indicative Vote*. You are no longer chairing a debate on what to do; you are chairing an audit of whether the rules were met. This is less enjoyable, but it is appeal-proof.

  \answer{Premise-Based Derivation}
