answer: |-
  Consider a population of male field crickets where quality $q$, representing immune competence, is uniformly distributed on the interval $[0, 10]$. Males produce a calling song (signal $s=1$) to attract females, incurring a fixed metabolic cost $C(s) = 5$ energy units regardless of $q$, due to the physiological constraints of the stridulatory mechanism. The benefit of securing a mate is $B = 9$ fitness units. Since the net payoff $B - C = 4$ is positive for all $q$, even the lowest-quality males ($q=0$) maximize fitness by signaling, resulting in a pooling equilibrium where every male calls. Females gain fitness $W = q - (I - q)^2$, where $I$ is reproductive investment optimized for male quality. A female who reads the signal as evidence of quality infers $q \approx 10$ and sets $I=10$, suffering an expected mismatch penalty of 25 units against the population average of $q=5$. The receiver's best response is to ignore the signal and set investment $I=5$, yielding higher expected fitness than trusting the signal, demonstrating that the costly signal fails to stabilize honesty.

  First, the handicap principle as usually stated predicts that because the signal is genuinely costly (5 energy units), only high-quality males should be able to afford it, leading to an honest separating equilibrium. This prediction fails because the principle is often shorthand for a more specific mathematical condition: it conflates the magnitude of the cost with the relationship between cost and quality. In this scenario, the cost is absolute, not relative to the signaler's reserves, so it does not restrict low-quality individuals from mimicking high-quality ones.

  Second, the repair requires stating that honesty depends on the marginal cost of signaling being higher for lower-quality signalers. Formally, the cost function $C(q, s)$ must satisfy $\frac{\partial^2 C}{\partial q \partial s} < 0$, meaning the cost decreases as quality increases. This case satisfies the requirement that the signal be costly ($C > 0$) but violates the requirement that its cost be graded by quality ($\frac{\partial C}{\partial q} = 0$). Because the cost is flat, the incentive constraint that usually keeps low-quality signalers silent is absent.

  Third, in a controlled comparison, replace the flat cost $C=5$ with a quality-graded cost $C(q) = 10 - q$, which maintains the same average magnitude of 5 across the population. With a benefit of $B=9$, a low-quality male ($q=0$) faces a cost of 10, resulting in a net loss of -1, so he does not signal. A high-quality male ($q=10$) faces a cost of 0, resulting in a net gain of 9, so he signals. The equilibrium flips from pooling to separating: only high-quality males signal, and the signal becomes informative.

  Fourth, the feature doing the work is the derivative of the cost function with respect to quality (the cost gradient). If this feature is removed (flattening the cost), honesty collapses regardless of how high the absolute cost remains. If the feature is present (grading the cost), honesty emerges even if the average cost is unchanged.

  Fifth, this case merely exposes a precondition the handicap principle always relied on rather than refuting it. The mathematical models underlying the principle explicitly require differential costs, but verbal summaries often shorten this to "costly signals are honest." This thought experiment defends the mathematical rigor of the theory by showing that cost magnitude alone is insufficient; the correlation between cost and quality is the necessary condition for honesty.

  Finally, the strongest way a defender of the usual reading would resist the case is to argue that biologically fixed costs are impossible; they might claim that any energetic expenditure must necessarily be harder for a low-quality individual to bear due to opportunity costs or reserve depletion. This resistance fails because it stipulates the outcome rather than deriving it from the functions. Physiological mechanisms, such as neural firing thresholds or mechanical friction in stridulatory files, can impose fixed metabolic overheads independent of energy reserves, proving that costly signals can exist without being quality-dependent handicaps.
