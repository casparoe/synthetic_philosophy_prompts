answer: |-
  This is a sharp observation, and it cuts to the bone of a problem that often gets glossed over in introductory surveys of the field. You are describing a specific modulation of epistemic power that is distinct from the blunt force of silencing or the structural gap of hermeneutical marginalisation.

  You are right to feel that the standard labels—testimonial injustice and hermeneutical injustice—are slightly too coarse-grained here. In Miranda Fricker's original formulation, *testimonial injustice* involves a credibility deficit driven by identity prejudice. Usually, we imagine this as a global discounting: the speaker is not believed. But in your scenario, the speaker *is* believed, just not in the way they intend. They are granted *observational* authority but denied *interpretive* authority.

  Similarly, this is not quite *hermeneutical injustice*. In Fricker's sense, hermeneutical injustice occurs when there is a gap in the shared resources of understanding (e.g., before we had the concept of "sexual harassment", women could not make sense of their experience). In your case, the resources exist ("systemic bias", "exclusionary practices"). The speaker has the words. The audience has the words. The injustice lies in the audience's refusal to treat the speaker's *application* of those words as a knowledge claim, re-categorising it instead as an affective state.

  There isn't a single, universally settled term for this specific manoeuvre in the canon, though it is discussed in fragments by José Medina, Gaile Pohlhaus Jr., and Kristie Dotson. However, to give you the precise carving you asked for, I propose we call this **Interpretive Deflation**.

  Here is the philosophical carving of the concept, distinguishing it from its neighbours.

  ### 1. The Mechanism: Illocutionary Downgrading
  In speech act theory, an utterance has an *illocutionary force*—what the speaker is *doing* in saying something (asserting, warning, claiming). In Interpretive Deflation, the audience accepts the *locution* (the words spoken) and the *propositional content* regarding brute facts, but they downgrade the illocutionary force regarding social meaning.

  When the speaker says, "This process is exclusionary," they are making an assertion about the social world. The audience hears this as an expression of frustration. The claim ($p$) is converted into a mood ($\text{expr}(p)$). This is **deflation** because the epistemic status of the utterance is lowered from a truth-apt claim to a non-cognitive expression of feeling.

  ### 2. Versus Ordinary Testimonial Injustice
  Standard testimonial injustice is a credibility *deficit*. The listener thinks, "I do not believe $p$ because you are the sort of person who is unreliable."
  In Interpretive Deflation, the listener thinks, "I believe you saw $x$, $y$, and $z$ (the hiring details), but you are not the sort of person qualified to judge what $x$, $y$, and $z$ *mean* structurally."
  It is a **credibility bifurcation**. The speaker is trusted as a sensor (a witness to data) but distrusted as a theorist (a knower of patterns). This is often more insidious than simple disbelief because it feels like engagement. The listener nods along to the facts, which creates the illusion of understanding, while quietly quarantining the critical insight.

  ### 3. Versus Hermeneutical Injustice
  As noted, hermeneutical injustice is a lack of concepts. Here, the concepts are present. A more relevant cousin here is Gaile Pohlhaus Jr.'s concept of **Willful Hermeneutical Ignorance**. Pohlhaus describes when dominant groups refuse to learn the hermeneutical resources of the marginalised.
  Interpretive Deflation is slightly different: it is not a refusal to *learn* the concepts, but a refusal to *ratify* their application. The audience knows what "systemic bias" means in the abstract, but when *you* apply it to *your* context, they treat it as a subjective projection rather than an objective diagnosis. It is a refusal to acknowledge your *standpoint* as a site of knowledge production, even if they accept your standpoint as a site of experience.

  ### 4. Versus Being Talked Over
  Being talked over is an exclusion from the conversation (you cannot speak). Interpretive Deflation is an inclusion that neutralises the speech (you speak, but it doesn't land as knowledge). It is a form of **epistemic containment**. The speaker is allowed into the room, but their contributions are filtered through a membrane that lets "facts" pass through while trapping "interpretations".

  ### The Consequence: Forced Pre-Translation
  You mentioned the speaker eventually starts "pre-translating" into the room's vocabulary. In the literature, this is best captured by Kristie Dotson's concept of **Testimonial Smothering**. Dotson defines this as self-silencing because the speaker perceives the audience as unwilling or unable to understand.
  However, Interpretive Deflation explains *why* the smothering occurs. It isn't just that the audience is incompetent; it's that they actively deflate the speaker's interpretive labour. The speaker learns that to be heard as a "knower" rather than a "complainer", they must outsource the interpretation to the dominant framework. They must say, "The data suggests inefficiency," rather than "The system is biased." They are forced to translate their lived reality into the sterile vocabulary of the oppressor to gain epistemic traction. This creates what Medina calls **epistemic dissonance**, where the speaker must fracture their own understanding to be intelligible.

  ### Why This Matters in "Rationalist" Spaces
  You mentioned encountering this in rationalist blogs. This is fertile ground for Interpretive Deflation because these communities often prize a specific ontology of "facts" versus "values" (the is-ought distinction).
  When a marginalised person describes a social dynamic, the dominant group often accepts the "is" (the mechanics of the hiring round) but treats the "ought" or the structural analysis (the exclusionary nature) as a value judgement or an emotional reaction. They treat social ontology as less real than physical ontology. Interpretive Deflation thrives where there is a rigid hierarchy of what counts as a "hard claim" versus a "soft reaction".

  ### Summary Definition
  **Interpretive Deflation**: A specific epistemic injustice wherein a speaker is granted credibility regarding descriptive or observational claims, but their interpretive or structural claims are re-categorised as subjective affect. Unlike testimonial injustice, the speaker is believed; unlike hermeneutical injustice, the concepts exist. The injustice lies in the denial of the speaker's authority to *interpret* the facts they report, forcing them into a role of data-provider rather than knowledge-producer.

  It is a subtle violence, because it leaves the speaker's testimony intact while removing its teeth.
