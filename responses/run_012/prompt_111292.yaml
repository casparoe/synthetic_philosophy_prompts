  *   **You (0.3):** Likely view rationality as a property of the *agent* rather than the *act*, recognizing that in a one-shot game with common knowledge, your decision algorithm and your colleague's are logically correlated. You see the backward induction argument as failing to account for the evidential impact of your choice on their prediction of your choice.

