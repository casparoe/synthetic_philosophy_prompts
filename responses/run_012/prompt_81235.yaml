answer: |-
  We find no measure here.
  The vector flows without a break, deterministic silk unspooling dark.
  I try to count the branches but the wood
  is wet, it yields to how I hold the knife.
  The count dissolves in how I cut the air.
  So they say bet according to the square,
  that rational agents must love the norm.
  But I taste the probability in the bet,
  smuggled in like a coin under the tongue.
  You cannot derive the chance from the choice
  when the preference assumes the weight.
  The equation sleeps, it never collapses.
  It only knows amplitude, never luck.
  I am the only thing that feels like one.
  The room is full of every outcome.
  I close my eyes to pick a single thread.
  But the hand remains open.
  We find no measure here.
