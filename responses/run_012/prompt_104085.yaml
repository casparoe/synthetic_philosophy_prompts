answer: |-
  You are right to be suspicious, because from the viewpoint of someone living in the society being rearranged, these two positions feel identical. In both cases, you wake up to a world where the technology dictates the terms of your life, and your political voice seems secondary to the material reality of the infrastructure. It feels like fatalism either way. However, if you look under the hood, the engine room is arranged completely differently in each model, and distinguishing them matters deeply for where you place blame and where you look for leverage. The core difference lies in where they locate the causal action. Plain technological determinism posits that the causal action resides in the technology's own developmental logic. It suggests that technology evolves according to an internal trajectory, something like a biological species or a law of physics, and society merely adapts to the shocks it delivers. The technology is the subject, and humanity is the object. In contrast, the artifacts-have-politics thesis, most famously associated with Langdon Winner, locates the causal action in the specific human choices that got frozen into a particular design. Here, the technology is not an autonomous force but a legislature in concrete or code. The politics is not happening because the machine wants it, but because some group of people decided to build it this way rather than that way. The technology is the vessel, and human decision-making is the subject, even if that subject has walked away and left the vessel to do its work.

  This divergence leads to radically different assumptions about human agency and contingency. Technological determinism assumes low agency and low contingency. It implies that the thing could not have come out otherwise, or at least that any alternative would have been inefficient and eventually selected against by the march of progress. If you hold this view, you believe that the automobile had to lead to sprawl, or that social media had to lead to polarization, because those outcomes are inherent to the logic of the technologies themselves. The artifacts-have-politics view assumes high agency at the moment of inception, followed by a locking-in of that agency. It assumes the thing could have come out otherwise. The low overpass on the parkway could have been built high enough for buses; the nuclear power plant could have been designed for decentralized management rather than strict hierarchy. The politics are there because someone put them there, intentionally or through negligent imagination. This means that while the technology might feel deterministic once it is built, its existence is contingent on prior political struggles. Determinism says we have no choice; artifacts-have-politics says we made a choice and now we have to live with it, unless we choose again.

  This brings us to your crucial test regarding politics in the uptake versus politics in the build. You are asking about effects that show up later, in the way people end up living with a technology, which nobody planned. This is the domain of unintended consequences and emergent behavior. If we are strict about it, technological determinism describes this case without cheating. It is perfectly comfortable saying that the technology has a logic that unfolds over time, producing social effects that neither the inventors nor the users anticipated. The causal power is in the tech, so it does not matter what the humans intended; the uptake is simply the technology revealing its true nature through use. The artifacts-have-politics position struggles here. If the politics are supposed to be frozen into the design, but the political effect only emerges later and was not planned, then the theory has to stretch to claim that the designers implicitly chose those consequences through negligence, or that the politics were latent in the design all along waiting to be activated. This risks becoming a post-hoc rationalization where every negative outcome is treated as a hidden intention, which cheats the historical record. Determinism accepts the accident; the artifacts view tries to find the author.

  So here is the straight verdict. These are two distinct positions, not one wearing two hats. One claims the technology is an autonomous agent; the other claims the technology is a proxy for human authority. If what you really care about is accurately describing the uptake cases where effects were unplanned and emergent, technological determinism is the more honest descriptive framework. It admits that things happen outside of human control and intention. However, I would advise you not to hold it as your primary political stance. While determinism describes the uptake better, it disarms you. If the logic is internal to the tech, there is no one to hold accountable and no lever to pull except Luddite destruction. The artifacts-have-politics view is the one you should hold, even if it requires you to stretch the definition of design to include the societal conditions that allowed the uptake to happen. You should hold it because it preserves the possibility of intervention. It forces you to look for the moments where the contingency existed, even if they are buried in the past, and it reminds you that future designs can be different. Determinism explains why you are trapped, but artifacts-have-politics reminds you that the trap was built, and what is built can be dismantled or redesigned. For the sake of doing politics rather than just studying it, you need the framework that keeps agency alive, even if it has to work harder to explain the accidents.
