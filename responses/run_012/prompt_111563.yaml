answer: |-
  Your friends are falling into the exact trap the Sorites paradox exposes: assuming that because the output must be binary (win/lose), the input must be precise. But a vote isn't a metaphysical atom; it's a physical object interpreted through a rule. When the object is a punch-card and the rule is "count voter intent," you have a classic vague predicate.

  Here is the proper mapping. The predicate is $P$: "counts as a valid vote for Bush." The series is a sequence of ballots ordered by the physical state of the chad. Case 1 is a cleanly punched chad (clearly Bush). Case 10,000 is a pristine, unpunched card (clearly not Bush). The "tiny difference" between adjacent cases is microscopic: perhaps one more paper fiber connecting the chad, or a indent depth difference of a micron. The Sorites premise says if case $n$ is a valid vote, case $n+1$ (slightly less punched) should also be valid. But clearly, the last case isn't. The borderline lies somewhere in the "hanging" or "dimpled" region. Does the winner flip? Yes. The media recount you mentioned showed that if you count only hanging chads, Bush wins; if you count hanging plus dimpled, Gore wins. The extension of the predicate determines the truth value of the outcome. This confirms the Sorites structure: small, irrelevant differences accumulate to change the categorical result.

  Running the theories of vagueness through this reveals why the legal system struggled. Epistemicism claims there is a sharp boundary we just can't know—that there is a fact of the matter about whether a specific dimple constitutes intent. This embarrasses itself in law because legal validity isn't discovered like a fossil; it's constructed by rules. There is no metaphysical fact about a piece of paper until we assign it one.

  Supervaluationism fits best. It argues a statement is "supertrue" if it's true under all admissible precisifications. In the recount, different standards (count hanging only vs. count dimples) represent different admissible sharpenings of "intent." Under some sharpenings, Bush wins; under others, Gore wins. Therefore, the statement "Bush won" is neither supertrue nor superfalse; it's indeterminate. This matches the spreadsheet reality: the winner depends on which precisification you choose, and none is obviously the "correct" one naturally speaking.

  Degree theory (fuzzy logic) suggests a dimpled chad is "0.6 of a vote." While this captures the intuition of partial evidence, it fails the institutional requirement. Elections are binary functions; you cannot swear in a president with a truth value of 0.5. The system demands a 0 or 1, forcing a collapse of degrees that the theory itself resists.

  Then there is higher-order vagueness. The Court's Equal Protection argument claimed the recount violated rights because standards varied by county. But the standard itself—"discern the intent of the voter"—is vague. Complaining about vague application by pointing to a vague standard is fighting fog with fog. There is no sharp line between a clear intent and a vague one, just as there is no sharp line between a heap and a non-heap. The Court identified higher-order vagueness (uncertainty about where the boundary lies) but treated it as a constitutional defect rather than a logical inevitability.

  This leads to your crucial point about the reverse direction. The Court solved the paradox by fiat: the December 12 safe-harbor deadline. This is precisification by authority rather than by nature. Sorites literature often warns against arbitrary boundaries, yet here, an arbitrary line was the only functional solution. The Court essentially declared that beyond this date, the predicate "counts as a vote" ceases to apply, regardless of the chad's physical state.

  Does this expose a limit of the framework? Yes. Vague predicates work in ordinary life because we rarely need to aggregate them into a binary decision that changes power. We can tolerate ambiguity about whether a man is "bald" because it doesn't matter. But in an election, vagueness becomes instability. The institution cannot tolerate the indeterminacy that Supervaluationism describes. It must force a sharpening.

  The Bush v. Gore case suggests that vague predicates are socially sustainable only when precision is optional. When an institution requires a binary output from vague inputs, it must impose a sharp line arbitrarily. The Court didn't find the boundary; they drew it. This implies that while vagueness is a feature of language and reality, legal systems function by suppressing vagueness through authority. The Sorites paradox isn't solved here; it's overridden. The friends who say "a vote either counts or it doesn't" are right about the requirement, but wrong about the reality. The system forces them to be right by ignoring the physical ambiguity that philosophy highlights.
