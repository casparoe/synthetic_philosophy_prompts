prompt: |-
  I'm a backend engineer with no philosophy background beyond a compulsory module I mostly slept through, so forgive me if I'm missing something obvious. Last sprint a collegue merged a change that skipped the integration tests and took checkout down for about forty minutes. I posted in the team channel that we should have caught it, and he came back with 'people in glass houses shouldn't throw stones', because six weeks ago I pushed a hotfix straight to main during an incident without a PR. Our manager said that was a fair point and moved on. Someone in the thread said it's about 'standing to blame', which I'd never heard of, so if that's the right label, please explain it in plain terms. I don't think it should be case closed, but I can't articulate why.

  Can you lay out the different precise claims that proverb could actually be making when someone uses it like that? I want a menu, not one reading. Somewhere from the trivial ('don't be a jerk about it') to the strong ('you have no right to criticise anyone for anything you've also done'). For each reading, say whether it's a platitude, a real and defensible principle, or just false, and whether it would actually support my manager treating my criticism as void. I'm especially interested in the difference between (a) the person blaming being a hypocrite in the sense of not really believing what they're saying, (b) them having done the same thing before, and (c) them having done something worse, or being responsible for the problem themselves. Also, does it matter that my hotfix was during an outage, that I flagged it afterwards, and that his change was in a normal release? Or is that just me rationalising?

  Please seperate what's genuinely settled among people who've thought hard about this from what's contested, and don't present a contested view as if it's the consensus. If the answer depends on which theory you pick, say so rather than pretending there's one obvious verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, pragmatic, no philosophy background, feels wronged but lacks the vocabulary to articulate why. Values precision ("menu, not one reading", "precise claims").
      *   **Situation:** Colleague broke production (skipped tests). User criticized the process. Colleague deflected with "glass houses" (referencing User's past hotfix). Manager accepted the deflection.
      *   **Goal:** Understand the logical structure and validity of the "glass houses" argument (ad hominem tu quoque / standing to blame). Wants a breakdown of different interpretations (trivial to strong), their validity (platitude/principle/false), and whether they justify the manager's inaction.
      *   **Specific Nuances:** Distinguish between hypocrisy (belief vs. action), past actions, severity/context (outage vs. normal release).
      *   **Constraint:** Separate settled vs. contested philosophical views. Don't present contested views as consensus.

  2.  **Deconstruct the Proverb ("People in glass houses..."):**
      *   *Literal meaning:* If you're vulnerable, don't attack others (they might hit back).
      *   *Common usage:* If you've done wrong, you can't criticize others for doing wrong.
      *   *Philosophical concept:* *Tu Quoque* (appeal to hypocrisy) and the ethics of *Standing to Blame*.

  3.  **Brainstorming the "Menu" of Claims:**
      *   *Claim 1 (Pragmatic/Strategic):* Criticizing makes you look bad if you've done it too. (Advice on effectiveness).
      *   *Claim 2 (Moral Equality):* Two wrongs make a right? No, that's not it. It's about *permission* to speak.
      *   *Claim 3 (Hypocrisy):* You don't believe your own rule.
      *   *Claim 4 (Standing/Authority):* You forfeit the right to blame by violating the norm yourself.
      *   *Claim 5 (Systemic):* Focusing on individuals distracts from process.

  4.  **Evaluating the Claims (Platitude vs. Principle vs. False):**
      *   *Pragmatic:* True, but doesn't make the criticism *wrong*, just risky.
      *   *Hypocrisy (Belief):* Relevant if the user doesn't believe in tests. But the user does.
      *   *Standing (Action):* This is the core philosophical debate. Does violating a norm remove your standing to enforce it?
      *   *Severity/Context:* Does an emergency hotfix equal skipping tests for convenience? Intuitively no.

  5.  **Addressing the Specific Nuances (Outage vs. Normal):**
      *   This is crucial. Norms often have exception clauses (e.g., "No speeding" vs. "No speeding except to the hospital").
      *   If the hotfix was legitimate according to policy (incident response), then there's no violation, hence no glass house.
      *   If the policy is "Never push to main," then both violated it, but context matters for *blameworthiness*.

  6.  **Philosophical Landscape (Settled vs. Contested):**
      *   *Settled:* *Tu Quoque* is a logical fallacy regarding the *truth* of the claim. (The fact that I skip tests doesn't mean skipping tests is safe).
      *   *Contested:* The ethics of *Standing*. Some philosophers (e.g., Bell, Fritz) argue standing is distinct from truth. You can be right but lack the standing to blame. Others argue standing is irrelevant to the validity of the critique.
      *   *Consensus:* The manager's move to "case closed" is likely a management failure, not a philosophical necessity.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the frustration. Validate that the manager's logic is philosophically shaky.
      *   *Section 1: The Logical Fallacy (Settled).* Explain *Tu Quoque*. The truth of "we should have caught it" is independent of who says it.
      *   *Section 2: The Menu of Claims.*
          *   1. Pragmatic Warning (Don't look bad).
          *   2. Hypocrisy of Belief (You don't mean it).
          *   3. Forfeiture of Standing (You broke the rule, you can't enforce it).
          *   4. Moral Equivalence (Your sin = His sin).
      *   *Section 3: Evaluating the Claims.*
          *   Pragmatic: True, but irrelevant to truth.
          *   Hypocrisy: False in this case (you believe in tests).
          *   Standing: Contested. Even if true, doesn't make the *process* critique wrong.
          *   Equivalence: False (Context matters).
      *   *Section 4: Context (Outage vs. Normal).* This defeats the equivalence argument. Emergency protocols differ from standard workflows.
      *   *Section 5: Manager's Role.* The manager conflated "valid criticism" with "clean hands."
      *   *Section 6: Settled vs. Contested.* Clearly label the philosophical status.

  8.  **Refining the Tone:**
      *   Keep it engineering-friendly (logic, systems, edge cases).
      *   Avoid jargon where possible, or define it (e.g., *Tu Quoque*, *Standing*).
      *   Be empathetic but analytical.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about "standing to blame"? Yes, need to ensure that term is explained clearly.
      *   *Check:* Did I distinguish between the *truth* of the claim and the *appropriateness* of the speaker? Yes, this is the key distinction.
      *   *Check:* Did I address the manager's decision? Yes, need to clarify that even if standing is lost, the *issue* remains valid.
      *   *Check:* Is the distinction between "hypocrisy" and "past action" clear? Yes, one is internal (belief), one is external (history).

  10. **Final Polish:** Ensure the "Menu" is distinct and the verdict on the manager is clear. (The manager used a moral shield to avoid a process fix).

  *(Self-Correction Note)*: I need to be careful not to say "Standing to Blame" is definitely false. It's a live debate in moral philosophy. I must present it as *contested*. However, the *logical validity* of the technical claim is settled.

