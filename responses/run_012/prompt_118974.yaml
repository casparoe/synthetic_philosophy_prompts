  Subject: Thoughts on the statue and the clay

  Dear Friend,

  I have been thinking about the problem you laid out regarding the statue and the lump of clay, and I believe I can offer you a principle that clarifies the situation while remaining honest about the costs involved. The principle is this: material objects are individuated by their persistence conditions rather than by their matter or location, meaning that two designators refer to the same object only if the thing picked out by one would survive and perish under exactly the same circumstances as the thing picked out by the other. This simple rule prioritizes the modal properties of an object, or what could happen to it, over the physical stuff it is made of at any given moment. When you apply this to your original case, it immediately validates your intuition that the statue and the lump are not identical because the lump can survive being squashed while the statue cannot, and since they have different survival conditions, they must be distinct entities. This also handles your point about the asymmetry where the statue is a lump but the lump is not a statue, because under this principle the statue is constituted by the lump without being identical to it, much like a recipe is realized by ingredients without being the ingredients themselves.

  However, I must be direct about where this principle forces you to adjust your intuitions. You mentioned that you do not want to say there are two material objects sitting on the pedestal in the same way there are two cats on a mat, preferring to think of them as different ways of counting the same stuff. The principle I have proposed forces you to give up this specific verdict and accept that there are indeed two distinct material objects occupying the same space at the same time. The reason is that if they have different persistence conditions, they are by definition different objects, and denying this would require ignoring the modal differences you rightly identified. The crucial distinction you must make to avoid confusion is that while there are two objects, they are not two separate chunks of matter like the two cats, because the cats exclude each other from space whereas the statue and lump share their matter entirely. So you must accept ontological doubling without material doubling, which resolves the feeling that you are counting the same stuff twice without denying the distinctness of the objects.

  When we test this principle against the other cases you mentioned, it continues to provide clear verdicts without needing extra rules. Consider the statue that is also a doorstop. If we treat the doorstop as a functional object defined by its use, then it ceases to exist if you stop using it to hold a door open, whereas the statue survives the loss of function as long as its form remains. Since their persistence conditions differ regarding function versus form, the principle dictates they are distinct objects coinciding in the same matter. Similarly, with the statue made of ice that melts and refreezes in the same shape, the lump of water survives the melting process while the ice statue does not, because the statue requires structural continuity of the solid form. Even if it refreezes into the same shape, the historical break means the original statue is gone while the matter persists, confirming they are distinct entities with different life histories.

  The case of the statue and the lump at a time before the statue was made is perhaps the clearest validation of the principle. At that earlier time, the lump exists but the statue does not, and since one exists where the other does not, they cannot be identical. This temporal mismatch alone is sufficient to prove distinctness under the principle of persistence conditions. Finally, consider the case where the clay is shaped into a statue, then into a different statue, and then back into the first shape. The lump of clay survives this entire process continuously, but the principle tells us the first statue does not return because statues typically require a continuous history of existence. The object that exists at the end may look identical to the first statue, but it is a new object with a different historical path, whereas the lump is the same object throughout. This confirms that the lump and the statue are distinct because the lump is indifferent to historical breaks that destroy the statue.

  In summary, the principle that objects are individuated by their persistence conditions saves almost all your intuitions about how these things behave, such as the asymmetry of the is statement and the survival conditions, but it demands that you accept the existence of two coincident objects rather than one object described in two ways. This is the price of maintaining the logical consistency of their different survival conditions. The is in the statue is a lump is therefore best understood as the is of constitution, indicating that the statue is made out of the lump, rather than the is of identity which would imply they are one and the same thing. I hope this provides the clarity you were looking for without resorting to complicated exceptions.

  Best regards,

