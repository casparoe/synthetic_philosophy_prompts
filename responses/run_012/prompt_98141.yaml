answer: |-
  The rain against the single pane of glass sounded like gravel being thrown. Inside the back office of *The Watchfire*, the air was thick with the smell of damp wool, cheap tobacco, and the sharp acid tang of fresh ink. Ada Mercer sat behind a desk buried under galley proofs, the manuscript of Theodore Aldridge's novel weighing down a stack of unpaid invoices. A letter from Mr. Sterling, the magazine's primary patron, sat open near the lamp, its cream paper glowing in the dim light.

  Aldridge stood by the radiator, which clanked but gave no heat. He held a glass of whiskey he hadn't touched.

  "Sterling wants a sunrise," Ada said, tapping the letter. "He says the current ending is a 'cul-de-sac of despair.' He wants the informer to recant in the final chapter. He wants redemption."

  "And he wants to pay for the printing," Aldridge said. "Which is why you haven't thrown the letter in the fire."

  "I haven't thrown it because he asks the question I am paid to answer. Does this book serve us?" Ada picked up the manuscript. "Your narrator betrays the cell to save his sister's boy. I understand the human cost. But you leave him in the aftermath without condemnation. The text refuses to judge him. Sterling reads that silence as permission."

  "The text refuses to lie," Aldridge corrected. "If I force a moral judgment where the character feels none, I am writing a sermon, not a novel. The horror of the situation is that he *can* live with it. To pretend otherwise is to offer a comfort that doesn't exist."

  "Comfort is not what I am after. Legibility is." Ada leaned forward. "You speak of honesty as if it exists in a vacuum. But this book will be read in two rooms. In one, a Black reader sees a reflection of the impossible choices we face. In the other, a white reader sees confirmation that we are morally pliable, that we will sell out the cause for blood ties. If you do not frame that betrayal, the white room wins. Your ambiguity becomes their evidence."

  "So the form must be dictated by the anticipated reaction of the oppressor?" Aldridge pushed off the radiator. "That is the definition of propaganda, Ada. Not that it argues a side, but that it has already decided what the audience is to feel. You want me to simplify the psychology to ensure the political lesson lands. But if the art is reduced to a lesson, it ceases to be a discovery. It becomes a tool. And tools break."

  "A tool builds," Ada countered. "A cathedral is a tool for prayer. You speak of the work 'refusing to be an instrument,' but who underwrites this refusal? Sterling does. He grants you the luxury of ambiguity because he does not live with the consequences of how this ambiguity is weaponized. You say you owe the work honesty. I say you owe the people who sustain you a future. If beauty does not serve the struggle for freedom, what is it? Merely decoration on the cage."

  "And if the struggle demands art that lies about the human condition to make a point?" Aldridge stepped toward the desk. "You say my judgment is aesthetic, disguised as politics. But look at your own position. You dislike the ending not because it is politically dangerous, but because it is aesthetically unsatisfying to your moral sense. You want a certain kind of symmetry. You are asking me to violate the internal logic of the character to satisfy an external demand for uplift. That is an aesthetic critique, Ada. You just call it 'responsibility.'"

  Ada was silent for a moment. She traced the edge of the manuscript. "Perhaps. I want the symmetry of survival. But let us be precise about this 'internal logic.' You say the ambiguity is honesty. But honesty is a gamble. You are betting that the reader will sit with the difficulty and emerge more thoughtful. I am betting that the reader will take the ambiguity as a cue to disengage. If a young organizer reads this and sees that betrayal is narratively complex, does he hesitate when he needs to act? What do you owe the reader who takes your complexity as permission to capitulate?"

  "I owe them the truth that complexity exists," Aldridge said. "If they capitulate, that is their failure, not mine. If I simplify the world to make them brave, I have treated them like children. Art that protects us from the truth of our own weakness is a sedative. You say beauty is a means to an end. I say beauty is the only thing that survives the end. When the politics of this moment are dust, the only reason anyone will read this is if it told the truth about what it felt like to be alive in it. Even the shameful parts."

  "The politics of this moment are not dust, Theodore. They are the boot on the neck." Ada stood up, moving around the desk. She picked up the pen. "You say I am asking for a lie. I am asking for a direction. You say I am censoring. I am saying that in a world of subordination, there is no neutral ground. To refuse to judge is to judge in favor of the status quo. If you will not write the sunrise, you must at least write the night clearly enough that we know we are not meant to stay in it."

  "And if the night is all there is?"

  "Then you are not an artist," Ada said softly. "You are a coroner."

  She capped the pen. The rain intensified, drumming against the glass, drowning out the radiator's clank. She looked from the manuscript to the patron's letter, then to Aldridge.

  "Sterling needs an answer by morning. If we serialize this as it stands, we keep our integrity and lose our funding. If we change it, we keep the magazine and compromise the work. But the real choice isn't about money. It is about what happens in the silence between the last page and the reader's next breath. When the book closes without a verdict, who do you trust to pass judgment: the conscience of the community, or the private mind of the stranger?"
