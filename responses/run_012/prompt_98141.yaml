      *   **Deepening the Argument (Ada's Turn):** She needs to argue that *form* is political. The ambiguity isn't neutral; it favors the oppressor in a specific context. The "Double Audience" point needs to land here.
      *   **Deepening the Argument (Theodore's Turn):** He needs to argue that dictating the ending makes it a lie. If the character is complex, the ending must be complex. "Propaganda" simplifies. He needs to challenge Ada: Is her objection truly political, or does she just dislike the aesthetic?
