  4.  **Refining the Dialogue (Iterative Process):**

      *   *Check:* Did I quote Du Bois? *Correction:* Ensure phrases like "all art is propaganda" are rephrased. Instead of "Art is propaganda," Ada should say, "There is no neutral ground when your people are burning."
      *   *Check:* Is the book's plot clear? *Correction:* Make sure the informer/sister's child dynamic is mentioned early so the moral stakes are concrete.
      *   *Check:* Is the patron's pressure felt? *Correction:* Keep the letter on the desk as a physical object.
      *   *Check:* The "Double Audience." *Correction:* Ada needs to explicitly mention how white readers will consume this vs. Black readers.
      *   *Check:* The Ending. *Correction:* Avoid a handshake. End on the precipice of the decision.

  5.  **Drafting - Specific Lines & Beats:**

      *   *Scene:* Rain against the window. The smell of wet ink.
      *   *Ada:* "Mr. Sterling wants a sunrise."
      *   *Theo:* "The book ends in the dark. That's where the truth is."
