          *   Beauty (means to end vs. justification).
          *   Mutual Challenge: Aldridge forces Ada to admit aesthetic judgments; Ada forces Aldridge to acknowledge who underwrites his freedom and the risk of ambiguity.
      *   **Constraint:** No direct quotations from real essays (Du Bois, Locke, etc.). Original phrasing only.
      *   **Ending:** No resolution, no "agree to disagree." End on a specific, live question for the reader.

  2.  **Character Voice & Tone:**
      *   *Ada:* Sharp, pragmatic, weary but principled. Sees the stakes of racial violence and representation. Speaks with urgency but not hysteria.
