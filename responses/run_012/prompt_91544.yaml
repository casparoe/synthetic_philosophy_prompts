answer: |-
  ### Brainstorming: Candidate Diagnoses

  Here are three ways a philosopher might dissect your friend's "Redundancy Rule."

  **1. The "Preemption" Diagnosis (Lewis-style)**
  This diagnosis says your friend is confusing *redundancy* with *preemption*. In the match case, the wind *would* have caused the fire, but it didn't get the chance because the match acted first. The backup cause was "preempted." The counterfactual test (1) needs to be refined to track the actual *process*, not just the outcome. If we trace the physical process, the match is the cause, not the wind.
  *   *Pros:* Solves the match and firing squad cases well.
  *   *Cons:* It struggles with the 1914 example. If the structural tensions were truly sufficient, the assassination wasn't a preemptive cause; it was genuinely redundant. This diagnosis might force you to admit (2) is true for history, which leads back to your "decoration" worry.

  **2. The "INUS Condition" Diagnosis (Mackie-style)**
  This argues that a cause is an *I*nsufficient but *N*ecessary part of a condition that is *U*nnecessary but *S*ufficient. The match is insufficient on its own (needs oxygen), but necessary within that specific cluster. The cluster is sufficient, but unnecessary (wind could do it). This distinguishes "causal factors" from "background conditions."
  *   *Pros:* Handles complex causal fields well. Good for explaining why we pick out the match and not the oxygen.
  *   *Cons:* It's a bit static. It doesn't fully capture the *difference* an agent makes, which is crucial for your biographical work and the moral accountability in (5).

  **3. The "Contrastive" Diagnosis (Hitchcock/Schaffer-style)**
  This argues that causation isn't a binary relation (X causes Y). It's contrastive: X *rather than X'* causes Y *rather than Y'*. The historian is asking "Did the shot cause the War?" (Yes/No). The real question is "Did the shot cause the War *in August 1914* rather than *in 1915*?" or "Did it cause *this specific War* rather than *a different conflict*?"
  *   *Pros:* It saves (1) without making history decoration. It acknowledges structural forces (the war was likely) while preserving the specific causal power of the event (the timing/nature). It applies equally to medicine (recovery *now* vs. *later*).
  *   *Cons:* Requires shifting how we define "outcomes."

  **My Bet:** I'm betting on **Candidate 3 (Contrastive Causation)**.
  **Why?** Because your pain point is specifically about historical explanation ("makes the history I write decoration"). Preemption solves the physics of the match, but Contrastivism solves the *significance* of the event. It allows you to agree with your friend that "war was likely" without conceding that "the shot didn't matter." It respects your desire to keep (1) (counterfactuals) by showing that the counterfactual *does* hold, provided we specify the outcome precisely. It also answers your "different beast" worry: causation is the same, but historical events require finer granularity than "War/No War."

  ***

  ### The Actual Answer

  You are right to resist (3). If you accept that no single event causes large historical outcomes, you aren't just losing narrative flair; you are losing the ability to explain *why things happened when and how they did*. You are also right to resist watering down (1). If causation doesn't imply difference-making, it is indeed just correlation.

  The error in your friend's argument isn't in (1) or (5). It is in the **granularity of the outcome in (2)**.

  Your friend is treating historical outcomes as coarse-grained binaries: War vs. Peace, Recovery vs. Death, Fire vs. No Fire. Under that description, he is often right: the system is robust, and single factors look redundant. But causation operates on fine-grained events. When you sharpen the description of Y, the counterfactual dependence of Y on X reappears.

  Here is how you dismantle the Redundancy Rule without sacrificing your intuition or your craft.

  #### 1. Fix the Relata: The Contrastive Move
  Premise (1) says: *X causes Y only if Y would not have happened had X not happened.*
  Your friend applies this to Y = "World War I." He claims: *Had the shot not happened, WWI would still have happened.*
  This is the weak link. It assumes "World War I" is a monolithic object that exists independently of its timing, participants, and casus belli.

  You should revise (1) slightly to be explicit about contrast: **X causes Y *rather than Y'* only if, had X not happened, Y' would have happened instead.**

  Apply this to 1914:
  *   **Coarse Y:** A major European war. (Friend is right: this likely happens without the shot).
  *   **Fine Y:** A major European war starting in August 1914, triggered by an ultimatum to Serbia, involving Britain due to Belgian neutrality. (Friend is wrong: without the shot, *this* specific configuration does not happen).

  If you delete the shot, you don't get "Peace." You get "War in 1915" or "War over a different issue." That is a *different historical outcome*. Therefore, the shot *did* make a difference. It caused *this* war, not *war in general*.

  This saves your biography writing. You aren't writing about how a person caused "The Revolution" (an inevitability); you are writing about how they caused *this* Revolution, with *these* laws, at *this* time. That is not decoration; that is the substance of history.

  #### 2. Addressing the "Antibiotic" and "Match" Cases (Premise 4)
  Your friend argues: *The antibiotic didn't cause recovery because the immune system would have done it.*
  Using the contrastive fix: The antibiotic caused the recovery *on Tuesday* rather than *on Friday* (or recovery *with less tissue damage* rather than *with more*). In medicine, timing and quality of recovery are the relevant Ys. If you define Y merely as "Patient is alive in a month," the antibiotic looks redundant. If you define Y as "Patient is alive *and out of the ICU* by Tuesday," the antibiotic is the cause.

  The match case is slightly different; it's a case of **preemption** (Candidate 1 from my brainstorm). The wind *would* have caused the fire, but the match got there first. The wind's causal process was interrupted. Here, (1) holds if we look at the specific process. The fire *as it actually occurred* (starting at the matchstick at 2:00 PM) counterfactually depends on the match. The wind would have caused a *different* fire (starting at the curtains at 2:05 PM).

  So, (4) is false because it relies on the same coarse-graining error as (2).

  #### 3. What You Give Up (and What It Costs)
  You asked which step to give up. You don't have to discard (1) or (5). You have to reject the **implicit premise in (2) that outcomes are insensitive to timing and manner.**

  **The Cost:**
  This demands more precision from you as a journalist. You cannot lazily write "X caused the War." You must write "X caused the War *to break out when it did*" or "X caused the War *to take the form it did*."
  Some readers (and historians) find this frustrating. They want the "Deep Cause" (Capitalism, Imperialism) to be *The Cause*. This framework forces you to acknowledge that deep causes create *conditions*, but specific events create *actualities*. You lose the ability to say "The war was inevitable, so the diplomat didn't matter." You gain the ability to say "The war was likely, but the diplomat determined its catastrophic scope."

  #### 4. Is History a Different Beast?
  You asked: *If the answer is that causes in history are a different kind of beast from causes in a hospital bed, say so plainly.*

  The answer is **no**. The logic of causation is the same. The antibiotic and the Archduke's assassination are structurally identical in this argument. Both are "trigger" events in a system loaded with "background" conditions (immune system / geopolitical tension).

  However, the **individuation of events** is different.
  *   In a hospital bed, "recovery" is measured in vitals and dates. It is naturally fine-grained.
  *   In history, "The War" is a concept we construct retrospectively. It is naturally coarse-grained.

  The "Redundancy Rule" works on history only because historians often speak in vague nouns (The Revolution, The Crash, The War). If you speak in events (The declaration of war on August 4th, The bank run on October 24th), the redundancy vanishes.

  #### 5. Summary for your Exit Strategy
  When you meet your friend again, here is your exit:

  1.  **Accept (1):** Cause requires difference-making.
  2.  **Reject (2)'s implication:** Deny that "The War" is the same outcome regardless of date or trigger. A war in 1915 is a different event than a war in 1914.
  3.  **Keep (5):** We cite causes because they select *which* version of the future became actual.
  4.  **The Verdict:** The shot at Sarajevo did not cause "War" (abstract). It caused "The Great War of 1914-1918." Without the shot, the 20th century looks different. That is sufficient for causation, and sufficient for a biography.

  You don't need to throw out causation. You just need to stop letting your friend define the outcomes.
