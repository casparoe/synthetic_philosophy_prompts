      *   *Check Premise (2):* "The war was coming." This is a modal claim about necessity. It's empirically dubious. But even if we grant it for argument's sake, Contrastivism handles it.
      *   *The "Firing Squad" problem:* This is classic overdetermination. If 10 shoot, any one is redundant. Counterfactual dependence fails for individual shooters. Here, Contrastivism helps (The death *at that instant*), but we might need to acknowledge that (1) needs a slight upgrade to handle "joint sufficiency." Actually, for the journalist, it's better to stick to the Contrastive fix as the primary tool, as it solves the historical "decoration" worry best. I will mention Preemption for the match case.
