      *   *Classic Cases:* Preemption (Billy/Suzy throwing rocks), Overdetermination (two shooters). *Non-negotiable:* If a theory says the preempted cause *is* a cause, it's wrong.
      *   *Hard Cases:* Omissions (not watering the plant), Double Prevention (pilot releases missile by releasing latch). *Contested:* Some think omissions aren't real causes. I should flag this.
