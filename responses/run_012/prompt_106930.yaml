answer: |-
  Here is the spec sheet. I've stripped out the metaphysical baggage and focused on the functional requirements. If a theory can't check these boxes, it's a toy model, not an account of reality.

  I have categorized requirements into **Non-Negotiables** (the theory fails without these), **Contested Terrain** (where schools of thought diverge), and **The Trade-Offs** (where satisfying one requirement breaks another).

  ### I. The Phenomena (What must be captured)

  **1. Asymmetry (Non-Negotiable)**
  If $A$ causes $B$, $B$ does not cause $A$. The theory must generate a direction. Correlation is symmetric; causation is not.
  *   *Constraint:* It cannot rely solely on temporal order (some causes are simultaneous with effects), but it must recover the *arrow*.

  **2. Selection / Pragmatics (Non-Negotiable)**
  The theory must distinguish between the *causal field* (the total set of necessary conditions) and *the cause* (the factor we pick out).
  *   *Example:* Oxygen is necessary for a fire, but we blame the match, not the presence of oxygen. A theory that treats all necessary conditions as equal "causes" is useless for law, history, or science.

  **3. Grading (Non-Negotiable)**
  Causation comes in degrees. A heavy push is *more* of a cause of the fall than a light nudge. A theory that offers only a binary "cause/not-cause" switch cannot handle probabilistic systems (quantum mechanics, epidemiology).

  **4. The Classic Puzzles (Non-Negotiable)**
  *   **Preemption:** Suzy throws a rock; Billy holds his. Suzy's rock breaks the bottle. If Suzy hadn't thrown, Billy would have. The theory must say Suzy caused it, and Billy did not, despite the counterfactual dependence failing.
  *   **Overdetermination:** Two shooters fire simultaneously; either shot is fatal. The theory must acknowledge both are causes without implying the effect was "more caused" than if only one fired.

  ### II. The Hard Cases (Stress Tests)

  **5. Omissions and Absences (Contested Terrain)**
  *   *The Case:* The gardener didn't water the plant; the plant died. Did the omission cause the death?
  *   *The Trap:* If yes, you face the "Abundance Problem." I didn't water the plant either, nor did the Queen of England. Are we all causes? If no, you can't account for negligence or biological regulation.
  *   *Requirement:* The theory must explain why *some* absences count as causes and others don't, without appealing to "common sense" as a brute fact.

  **6. Double Prevention (Contested Terrain)**
  *   *The Case:* A pilot flips a switch (Prevention 1) which releases a latch (Prevention 2), allowing a missile to fire. The switch didn't push the missile; it stopped something from stopping the missile.
  *   *Requirement:* Is this causation? Interventionists say yes; some process theorists say no. The theory must take a stance that aligns with how we manipulate systems.

  **7. Simultaneity (Non-Negotiable)**
  *   *The Case:* A ball sits on a cushion. The depression exists exactly as long as the ball sits there.
  *   *Requirement:* The theory cannot define causation as *essentially* temporal succession. It must allow for structural or functional dependence where $t_1 = t_2$.

  ### III. The Distinctions (What must not collapse)

  **8. Cause vs. Explanation (Non-Negotiable)**
  All causes explain their effects, but not all explanations are causes.
  *   *Example:* "The barometer falls, therefore the storm comes." This is a valid predictive explanation, but the barometer didn't cause the storm.
  *   *Requirement:* The theory must distinguish nomological (law-based) connection from causal connection.

  **9. Type vs. Token (Non-Negotiable)**
  *   *Token:* This specific spark caused this specific fire.
  *   *Type:* Smoking causes cancer.
  *   *Requirement:* The theory must show how these relate. You cannot have a theory of general causation that makes singular causation impossible, or vice versa.

  ### IV. The Thermostat Wrinkle (Feedback Loops)

  **10. Cyclicity and Mutual Determination (Non-Negotiable)**
  *   *Your Question:* Does the theory owe a story about loops?
  *   *The Answer:* **Yes.** If a theory requires a Directed Acyclic Graph (DAG)—meaning no loops—it is a theory of *snapshots*, not *systems*. Biology, economics, and engineering are full of feedback loops.
  *   *The Requirement:* The theory must explain how causal direction is preserved when $A$ determines $B$ and $B$ determines $A$.
  *   *The Catch:* Usually, this is solved by time-slicing (At $t_1$, $A$ causes $B$; at $t_2$, $B$ affects $A$). If the theory cannot handle even time-indexed loops, it is disqualified for modern science.

  ---

  ### V. The Trade-Offs (Where the body is buried)

  Here is where you will find the conflict in your interviews. You cannot maximize all these variables simultaneously.

  **1. Transitivity vs. Preemption**
  *   *Tension:* If $A$ causes $B$, and $B$ causes $C$, then $A$ causes $C$ (Transitivity). This is intuitive for chains.
  *   *Conflict:* Preemption cases often break transitivity. To solve Preemption (Requirement #4), many theories have to weaken or abandon Transitivity. You usually have to pick one.

  **2. Objectivity vs. Selection**
  *   *Tension:* We want causation to be "out there" in the world (Objective). But picking "the cause" out of the causal field (Requirement #2) depends on human interests (Pragmatics).
  *   *Conflict:* If you make causation fully objective, you lose the ability to distinguish the match from the oxygen. If you make it pragmatic, you lose the claim that causation is a mind-independent feature of reality. Most modern theories accept a hybrid: the *structure* is objective, the *selection* is pragmatic.

  **3. Omissions vs. Spuriousness**
  *   *Tension:* To handle Omissions (Requirement #5), you need a broad definition of causation (counterfactual dependence).
  *   *Conflict:* A broad definition invites spurious correlations (the barometer problem). To filter spuriousness, you need a narrow definition (physical process), which excludes omissions. You cannot easily have both without adding complex "normalcy" conditions.

  ---

  ### VI. Program Comparison: The Quick Assessment

  **The Counterfactual Programme (e.g., David Lewis)**
  *   *The Pitch:* $A$ causes $B$ if, had $A$ not occurred, $B$ would not have occurred.
  *   *Where it's Strong:** Intuitive fit for singular events. Handles Preemption well (with "quasi-dependence" tweaks).
  *   *Where it's Exposed:**
      *   **Omissions:** It explodes. Everything that didn't prevent the effect becomes a cause (The Queen of England problem).
      *   **Loops:** Struggles. Counterfactuals rely on a fixed temporal ordering to evaluate "closest possible worlds." Feedback loops create circular dependencies that standard counterfactual logic chokes on.
      *   **Intervention:** It describes dependence, not manipulation. It doesn't tell you *how* to change $B$, only that $B$ would be different.

  **The Interventionist Programme (e.g., James Woodward)**
  *   *The Pitch:* $A$ causes $B$ if an ideal intervention on $A$ changes $B$, holding other variables fixed.
  *   *Where it's Strong:**
      *   **Loops:** Handles them better via Structural Equation Models (can model cycles if time-indexed).
      *   **Science:** Matches actual experimental practice (RCTs, controls).
      *   **Distinctions:** Cleanly separates correlation from causation via the "intervention" condition.
  *   *Where it's Exposed:**
      *   **Circularity:** Your thermostat worry is the Interventionist's biggest headache. To define an "intervention," you must already assume a causal structure (you must cut the incoming arrows to the variable you're manipulating). Critics argue this defines causation *using* causation.
      *   **Metaphysics:** It is agnostic on what causation *is*. It tells you how to find it, not what it consists of. Some philosophers call this "causation without ontology."

  ### Summary for your Feature
  If you want a theory that fits **physics**, look for one that handles simultaneity and loops (Interventionism/Structural Models). If you want a theory that fits **law and history**, look for one that handles selection and omissions (Counterfactuals/Pragmatics).

  The reason they can't agree is that they are optimizing for different constraints. The "Spec" above shows why no single theory currently passes all tests without breaking something else.
