      *   *Counterfactual:* Great for preemption (with tweaks), struggles with omissions (too many), struggles with loops (time ordering).
      *   *Interventionist:* Great for science/experiments, handles loops better (structural equations), struggles with "in principle" interventions (big bang), can get circular if intervention presupposes causation.

