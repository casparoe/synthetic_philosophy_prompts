answer: |-
  You have stumbled onto the exact nerve that broke Expected Utility Theory (EUT) for a lot of the early rationalist community. You aren't crazy; your intuitions are fighting against a naive application of EUT that ignores **epistemic complexity** and **leverage penalties**.

  If you force yourself to use naive EUT, you have to give up Case 1, Case 4, and one half of Case 5. That sucks.

  However, there is a principled framework that saves almost all of your verdicts. It is a combination of **Solomonoff Induction (Complexity Priors)** and **Hanson's Leverage Penalty**, with a side of **Game-Theoretic Precommitment**.

  Here is how that principle validates your gut, where it forces you to admit a bias, and how it handles the unlisted case.

  ### The Principle: "Evidence-Weighted Leverage"

  The core rule is: **The prior probability of a hypothesis must scale inversely with the amount of leverage it grants you.**

  If a claim implies that your $5 can affect $10^{100}$ lives, the hypothesis "I am in a position to affect $10^{100}$ lives" is incredibly complex. It requires specifying *why* you, specifically, are the pivot point for the universe. In algorithmic information theory, specifying a number like $10^{100}$ takes a lot of bits. Therefore, the prior probability is astronomically low—low enough that mere words (Case 1) cannot overcome it.

  To update that prior to a actionable level, you need evidence with a likelihood ratio equally astronomically high.

  ### Applying the Principle to Your Cases

  **1. Classic Mugging (No evidence, huge threat): DON'T PAY.**
  *   **Verdict:** Consistent.
  *   **Why:** The prior is $\approx 1/10^{100}$ (or lower). The evidence ("I say so") has a likelihood ratio of maybe 2:1. The posterior is still effectively zero. You aren't ignoring the utility; you are correctly assessing the probability as vanishingly small due to complexity.

  **2. Mugging with Demo (Evidence, huge threat): PAY.**
  *   **Verdict:** Consistent.
  *   **Why:** The demo provides the necessary likelihood ratio. If he shows you a portal to the galaxy or tortures a simulation in front of you, the complexity of the hypothesis drops (it's no longer magic, it's observed physics). The posterior probability becomes high enough that $5 \times P > \text{Disutility}$.

  **3. Small Threat (No evidence, 1 person): PAY.**
  *   **Verdict:** Consistent.
  *   **Why:** "I can torture one person" is a low-complexity hypothesis. Humans torture humans every day. The prior is maybe 1%. The evidence (he looks crazy/armed) might push it to 5%. $5 is worth it to avoid a 5% chance of harming someone. No leverage penalty applies because the scale is normal.

  **4. Pascal's Wager (Infinite payoff, tiny prob): DON'T BELIEVE.**
  *   **Verdict:** Consistent.
  *   **Why:** This is the "Many Gods" objection filtered through complexity priors. The hypothesis "Christian God exists" is complex. The hypothesis "Allah exists" is equally complex. The hypothesis "A god exists who rewards atheists" is also complex. When you sum over all possible infinite-payoff deities, the net expected utility cancels out to zero. Furthermore, the leverage penalty applies: Why would an infinite being care about your specific belief state?

  **6. Many Muggers (Independent threats): DON'T PAY.**
  *   **Verdict:** Consistent.
  *   **Why:** This is the "Bostrom" check. If 1,000,000 people claim they can destroy the universe, the hypothesis isn't "One of them is telling the truth." The hypothesis becomes "I am in a simulation where everyone is programmed to say they can destroy the universe." That hypothesis is *simpler* than "One specific guy has magic," but it still implies you are in a weird leverage position. Plus, you physically can't pay them all. Precommitting to "Ignore unverifiable leverage claims" is the only strategy that doesn't drain your wallet in a universe full of noise.

  ### The Hard Case: #5 (Charity vs. Mugging Mirror)

  **Your Verdict:** Donate to Charity, Don't Pay Mugger.
  **The Conflict:** If the probabilities and utilities are *literally* identical, this is inconsistent. Naive EUT says these are the same math.

  **The Resolution:** You are not actually treating them as identical. You are smuggling in a hidden variable: **Causal Mechanism.**

  *   **The Mugger:** Claims to have *magic*. "I will torture $10^{100}$ people." This requires new physics, hidden dimensions, etc. High complexity prior.
  *   **The Charity:** Claims to mitigate *risk*. "There is a 1-in-googol chance of AI doom killing $10^{100}$ future beings, and this research lowers that risk." This operates within known physics. The causal chain is plausible, even if the odds are long.

  **The Principle's Ruling:**
  If the Charity claim is **isomorphic** to the Mugger claim (e.g., "Give us $5 to pray to a deity who might save $10^{100}$ souls"), **you should not donate.** If you do, that is motivated reasoning. You like the "good guy" narrative, so you suspend your skepticism.

  However, if the Charity claim involves **x-risk reduction** (asteroid deflection, AI safety, biosecurity), the prior is naturally higher than the Mugger's because the mechanism is physically grounded. In that specific case, your intuition is correct, but not because it's "good," but because the **complexity penalty is lower.**

  **What you might have to give up:** You have to admit that if a charity asked for $5 to perform a *magic ritual* to save $10^{100}$ lives with a 1-in-googol success rate, you should treat it exactly like the Mugger.

  ### The Unlisted Case: The Button

  **Setup:** A guy offers you $5 to press a button. There is a 1-in-googol chance that pressing it tortures you forever.
  **Verdict:** **DO NOT PRESS.**

  **Why this differs from the Mugging:**
  In the Mugging, you are paying $5 to *avoid* a risk. Here, you are accepting $5 to *incur* a risk.
  This touches on **Risk of Ruin** and **Absorbing States**.

  1.  **Bounded Utility vs. Unbounded Disutility:** Your utility for $5 is bounded. Your disutility for "eternal torture" is effectively unbounded (or at least, it terminates all future utility gains).
  2.  **The Precautionary Principle:** When the downside is an absorbing state (death/torture from which you cannot recover), standard EUT breaks down. You cannot average the outcome because you won't be around to collect the average.
  3.  **Complexity Prior:** Again, "This button tortures me forever" is a high-complexity claim. However, unlike the Mugging where you can walk away for $0 cost, here the *action* itself carries the tail risk.

  Even if the probability is 1-in-googol, the expected utility calculation is:
  $$EV = \$5 - (P_{googol} \times \text{Infinite Torture})$$

  If "Infinite Torture" is truly infinite negative utility, any non-zero probability makes the EV negative infinity. If you use bounded utility (you can only suffer so much), the EV might be positive.
  **However,** the rationalist move is to recognize that **you cannot trust your probability estimate at that precision.** If your model says there's a 1-in-googol chance of hell, your model is likely broken, not precise. In the face of model uncertainty with catastrophic downside, the only robust strategy is **avoidance.**

  ### Summary of Your Consistency

  You are surprisingly consistent, provided you accept one distinction:

  1.  **Reject Naive EUT:** Do not multiply huge numbers by tiny probabilities without applying a **Complexity/Leverage Penalty** to the probability first.
  2.  **Acknowledge the Mechanism Bias:** In Case 5, you are right to donate to the Charity *only if* their mechanism is physically plausible (x-risk) compared to the Mugger's magic. If both are magic, you are biased.
  3.  **Respect Ruin:** In the Button case, reject the gamble. Tail risks that involve terminal states trump small certain gains, regardless of the calculated EV, because your probability estimates for tail events are unreliable.

  **The Principle to write down:**
  > "I reject hypotheses that grant me extreme leverage unless supported by evidence proportional to that leverage. I treat positive and negative leverage symmetrically, unless the causal mechanism for the positive claim is physically grounded while the negative claim is not. I avoid actions with unbounded downside regardless of calculated probability."

  This saves 1, 2, 3, 4, 6, and the Button. It forces you to scrutinize 5, but likely validates your donation if the charity is doing actual x-risk work.
