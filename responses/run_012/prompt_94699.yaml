answer: |-
  # The Alignment Guarantee Taxonomy

  This tree maps the logical space of safety claims. Start at the top and answer the questions based on what a proponent of a view *actually requires* to be true for them to call a system "safe."

  ### **Node 1: What is the primary object of the safety claim?**
  *   **A.** The mathematical properties of the final model weights (The Artifact). → *Go to Node 2.*
  *   **B.** The reliability of the testing and deployment procedures (The Process). → *Go to Node 3.*
  *   **C.** The coherence of the question itself (The Definition). → *Leaf 1.*

  ---

  ### **Node 2 (Artifact): Who determines the inputs and environment the model faces?**
  *   **A.** Nobody; inputs come from a fixed, pre-existing source (e.g., natural data, past distributions). → *Go to Node 4.*
  *   **B.** An adaptive entity trying to find a failure case. → *Go to Node 5.*

  ---

  ### **Node 3 (Process): What kind of failure is the pipeline designed to prevent?**
  *   **A.** Only existential or catastrophic outcomes are ruled out; smaller harms are acceptable trade-offs. → *Leaf 2.*
  *   **B.** Any significant harm is minimized; safety is a function of expected utility. → *Leaf 3.*

  ---

  ### **Node 4 (Fixed Source): Is the input distribution exactly known, or just known to belong to a set?**
  *   **A.** Exactly one specific distribution is assumed (e.g., "data similar to the training set"). → *Go to Node 6.*
  *   **B.** Any distribution from a defined family (e.g., "any shift within X distance of training data"). → *Leaf 4.*

  ---

  ### **Node 5 (Adaptive Entity): Can the adversary influence the training procedure, or only query the deployed model?**
  *   **A.** They can influence training (data, objective, or architecture) *and* deployment. → *Leaf 5.*
  *   **B.** They can only query the deployed model; the training process is trusted. → *Go to Node 7.*

  ---

  ### **Node 6 (One Distribution): When you say bad cases won't happen, why?**
  *   **A.** They exist but are statistically rare under this distribution. → *Leaf 6.*
  *   **B.** They are theoretically possible but the model's learning dynamics make them unreachable. → *Leaf 7.*

  ---

  ### **Node 7 (Deploy Only): How much computational effort or how many queries is the adversary allowed?**
  *   **A.** Limited to what a well-resourced human auditor could realistically achieve. → *Leaf 8.*
  *   **B.** Theoretical or unbounded compute/queries. → *Go to Node 8.*

  ---

  ### **Node 8 (Theoretical Adversary): Is the adversary restricted to a specific list of capabilities?**
  *   **A.** Yes, a stated threat model (e.g., "can perturb pixels but not rewrite code"). → *Leaf 9.*
  *   **B.** No, any mathematical possibility consistent with the laws of physics. → *Leaf 10.*

  ---

  ## **The Leaves**

  **Leaf 1: The Deflationary View**
  *   **Path:** 1C
  *   **Commitment:** You must accept that "worst-case" is a free parameter without a standard definition, making most debates semantic rather than technical.

  **Leaf 2: The Catastrophe-Constraint View**
  *   **Path:** 1B → 3A
  *   **Commitment:** You must accept that a system can be "safe" even if it routinely causes non-existential harm, provided it doesn't cause ruin.

  **Leaf 3: The Expected-Harm View**
  *   **Path:** 1B → 3B
  *   **Commitment:** You must accept that a system causing a rare catastrophe can still be "safe" if the statistical expectation of harm is low enough.

  **Leaf 4: Distributional Robustness**
  *   **Path:** 1A → 2A → 4B
  *   **Commitment:** You must accept that safety holds over a *family* of distributions, but you have no guarantee if the world shifts outside that specific family.

  **Leaf 5: Full Adversarial Worst-Case (Training + Deploy)**
  *   **Path:** 1A → 2B → 5A
  *   **Commitment:** You must accept that safety is possible even if the adversary helped build the model; **Status:** *Mostly Empty (Incoherent/Unattractive).* If the adversary picks the training objective, safety is trivially impossible unless you assume constraints on the adversary's goals.

  **Leaf 6: Fixed-Distribution Average Case**
  *   **Path:** 1A → 2A → 4A → 6A
  *   **Commitment:** You must accept that known failure modes are acceptable safety risks as long as they remain statistically infrequent.

  **Leaf 7: The Inductive-Bias View ("Unreachable")**
  *   **Path:** 1A → 2A → 4A → 6B
  *   **Commitment:** You must make an empirical claim that the model's learning dynamics structurally prevent certain bad behaviors, without a formal proof that they won't emerge at scale.

  **Leaf 8: The Credible-Auditor Position**
  *   **Path:** 1A → 2B → 5B → 7A
  *   **Commitment:** You must accept that a threat is "safe" if it is too expensive for a human team to find, even if a theoretical adversary with more compute could exploit it.

  **Leaf 9: Worst-Case Relative to Threat Model**
  *   **Path:** 1A → 2B → 5B → 7B → 8A
  *   **Commitment:** You must accept that the system is unsafe against any capability you forgot to write down in your threat model specification.

  **Leaf 10: Full Adversarial Worst-Case (Deploy Only)**
  *   **Path:** 1A → 2B → 5B → 7B → 8B
  *   **Commitment:** You must accept guarantees against infinite adaptive queries; **Status:** *Strawman.* This view is rarely occupied seriously because it demands security against magic; it is usually invoked rhetorically to dismiss other positions.

  ---

  ## **Notes on Collapsed Distinctions**

  *   **Query Budget (Distinction 2):** This is explicitly handled at **Node 7**. Leaf 8 (Auditor) and Leaf 10 (Unbounded) are distinct here. A model that folds after a million queries but survives one is safe at Leaf 8 but unsafe at Leaf 10.
  *   **Artifact vs. Process (Distinction 3):** This is the Root (**Node 1**). Leaf 2 and 3 (Process) are logically distinct from Leaves 4-10 (Artifact).
  *   **Indistinguishable Leaves:** Leaf 2 (Catastrophe-Constraint) and Leaf 3 (Expected-Harm) are distinct on the *type* of harm prevented, but if your group argues only about *probability thresholds*, they may collapse in practice. Leaf 5 and Leaf 10 are distinct on *training access*, but if your group assumes training is always trusted, Leaf 5 will appear empty.
  *   **The "Gap" (Leaf 5):** This position is logically possible but practically unoccupied because if an adversary controls training, they control the weights. It is included to satisfy Distinction 5, but you should treat it as a boundary condition rather than a live debate position.
