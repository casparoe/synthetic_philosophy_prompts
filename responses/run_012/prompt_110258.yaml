answer: |-
  **Title:** The Asymmetric Baseline: Re-evaluating the Normative Stakes of Referendums

  **1. Introduction: The Missing Dynamic in Direct Democracy**

  Contemporary debates regarding the normative value of referendums tend to calcify around two poles. The first is epistemic: are voters competent to decide complex constitutional or policy questions? The second is democratic: does the act of voting confer legitimacy that representative bodies lack? Both frameworks treat the referendum as a static event—a snapshot of public will at a specific moment *t*. In the competence model, the question is whether the snapshot is clear; in the legitimacy model, the question is whether the camera belongs to the people.

  This project argues that both frameworks overlook a structural feature of the referendum that is distinct from both voter knowledge and popular sovereignty. That feature is directional asymmetry. In a binding referendum, a vote for the status quo (No) preserves the existing baseline, while a vote for change (Yes) establishes a new baseline. Crucially, this new baseline is not merely a legal switch; it alters the political and social terrain upon which future votes occur. A subsequent vote to reverse a decision is not a return to the starting point, but a struggle against a world that has already reorganized itself around the initial victory. Entrenchment occurs not just through legal locks, but through adjusted expectations, sunk costs, and reformed party positions.

  This project proposes that the distinctive normative defect (or virtue) of the referendum lies not in who votes or how well they know the issues, but in this ratchet effect. If democracy requires the possibility of revision—if fallibilism is a core democratic value—then mechanisms that make revision asymmetrically difficult pose a unique problem. The goal of this term paper is to isolate this asymmetry, determine whether it is unique to direct democracy or inherent to all binding decisions, and analyze whether the "status quo" is a factual anchor or a conventional construct.

  **2. The Research Question**

  To ensure the project yields a determinate answer within the scope of eight to ten pages, the research question must be sharpened from a general observation to a testable theoretical claim. The broad intuition is that "referendums are hard to undo." The theoretical question is:

  *Does the directional asymmetry of referendum outcomes constitute a distinct normative defect of direct democracy, distinguishable from the general inertia inherent in representative legislation?*

  This question forces a comparison. If all binding political decisions create path dependence, then the referendum is not special, and the critique collapses into a general argument about the difficulty of political change. If, however, the referendum creates a *stronger* or *qualitatively different* kind of asymmetry than representative legislation, then we have identified a specific structural flaw (or feature) of direct democracy that the competence/legitimacy debate misses.

  A secondary, constitutive question underpins the first:

  *Is the "status quo" protected by a 'No' vote a factual state of affairs, or is it a conventional baseline subject to framing effects?*

  If the status quo is merely a convention, then the asymmetry might be manipulable by those who control the wording of the ballot. If it is a factual anchor (e.g., existing treaties, built infrastructure), the asymmetry is material. The paper will argue that the status quo in referendums is a hybrid: legally conventional but politically materialized through the act of voting itself.

  **3. Why the Competence/Legitimacy Debate Fails to Settle This**

  The existing literature provides the necessary foil for this project. The competence argument assumes that the primary risk of a referendum is error. The remedy proposed is usually more information, deliberation, or higher thresholds. This assumes that if voters knew enough, the decision would be "correct." However, this ignores that a "correct" decision at *t1* might create conditions at *t2* that make a subsequent correction impossible, regardless of voter knowledge. A well-informed electorate can still vote themselves into a ratchet.

  The legitimacy argument assumes that the primary value of a referendum is the expression of will. The remedy for a bad outcome is typically to wait and vote again. This assumes symmetry: if the people changed their minds, they can simply express that new will. This project challenges that assumption. It posits that the "will of the people" is not a stable preference function that can be re-sampled. The first vote changes the preferences, the stakes, and the available options for the second vote.

  By focusing on the *consequences of the decision mechanism* rather than the *quality of the input* (competence) or the *authority of the source* (legitimacy), this project shifts the normative ground. It moves the debate from "Did they vote right?" to "Does this voting structure allow them to vote again meaningfully?"

  **4. Methodology: Conceptual Analysis and Ideal Types**

  Since this project is grounded in political theory rather than empirical political science, the method will be conceptual analysis supported by the construction of ideal types. I will not rely on specific historical case studies (e.g., specific national referendums), as the goal is to isolate the structural logic of the institution, not its contingent history.

  The method proceeds in three steps:

  1.  **Isolating the Mechanism:** I will construct a formal description of the referendum decision rule. This involves defining the "baseline" (B0), the "proposal" (P), and the "outcome" (O). In a referendum, O(No) = B0, and O(Yes) = B1. The core analysis will focus on the transition cost from B1 back to B0 compared to the transition cost from B0 to B1.
  2.  **Comparative Institutional Analysis (Theoretical):** I will construct a parallel model for representative legislation. In a legislature, a law passes (L1) and can be repealed (L0). I will analyze the friction points in both models. Where does the "ratchet" come from in each? In legislatures, friction comes from procedural hurdles (committees, bicameralism). In referendums, friction comes from the re-baselining of public expectation and the "mandate" effect.
  3.  **Ontological Inquiry:** I will analyze the concept of the "status quo." Is it the absence of change, or is it a specific policy position that has been privileged by labeling it the default? This requires distinguishing between *physical* status quos (e.g., a border that exists) and *legal* status quos (e.g., a tax rate that exists).

  This method earns its keep by avoiding the trap of anecdotalism. By treating the referendum as a logical structure, I can demonstrate whether the asymmetry is a necessary feature of the tool or a contingent bug of its implementation.

  **5. Addressing the Core Uncertainties**

  The viability of this project rests on resolving two specific uncertainties identified in the preliminary phase.

  **(a) Is asymmetry unique to direct democracy?**
  A strong objection to this project is that all political decisions are hard to reverse. Passing a statute creates vested interests; building a dam creates physical reality. If legislatures also create ratchets, then the referendum is not distinctively problematic.
  *Resolution Strategy:* The paper will argue that the *source* of the asymmetry differs. Legislative inertia is primarily *procedural* and *interest-group based*. Referendum inertia is *plebiscitary* and *normative*. When a legislature passes a law, opponents can claim the process was captured or unrepresentative. When a referendum passes a measure, it claims the direct authority of the sovereign. This makes the political cost of reversal higher, even if the legal cost is identical. The "mandate" of a referendum creates a normative shield that a statute lacks. The project will test this by asking: Is it harder to repeal a law passed by 51% of voters directly than a law passed by 51% of representatives? If the answer is yes, the asymmetry is distinctive.

  **(b) Is the status quo fact or convention?**
  If the status quo is just a framing trick (e.g., labeling a cut in spending as "keeping the status quo" vs. "cutting services"), then the asymmetry is an illusion created by ballot language.
  *Resolution Strategy:* The paper will argue that while the *labeling* is conventional, the *effect* is material. Once a vote occurs, the "conventional" baseline becomes a "factual" expectation. Markets adjust, bureaucracies reorganize, and citizens plan their lives around the outcome. The act of voting crystallizes the convention into fact. Therefore, the distinction between fact and convention collapses over time. The project will treat the status quo as a "focal point" that gains stability through the coordination of the vote itself.

  **6. Expected Results and Contribution**

  If successful, this project will produce a refined normative framework for evaluating direct democracy. The result will not be a simple "referendums are bad" conclusion, but a more nuanced diagnostic tool.

  **Primary Result:** A definition of "Democratic Reversibility." I aim to argue that a healthy democratic system requires symmetric reversibility. If a decision mechanism makes reversal significantly harder than affirmation, it violates the principle of fallibilism. The referendum, by converting a policy choice into a new baseline, reduces reversibility.

  **Secondary Result:** A distinction between "Legal Entrenchment" and "Political Entrenchment." Legal entrenchment is written in the constitution (hard to undo). Political entrenchment is written in the public consciousness (hard to undo). Referendums specialize in the latter. This explains why some referendum results persist even when they are not legally entrenched.

  **Contribution to the Workshop:** This paper offers a way to move past the stalemate between populist defenders of referendums (legitimacy) and elitist critics (competence). It provides a structural critique that accepts the legitimacy of the vote but questions the *temporal* implications of the mechanism. It suggests that the problem is not the voters, but the geometry of the decision.

  **7. Failure Conditions and Scope Management**

  To ensure this project remains feasible within a one-term timeline and an 8-10 page limit, I have identified specific conditions under which the project would fail or need to be scaled back.

  **Failure Condition 1: Indistinguishability.**
  If, upon rigorous analysis, the "ratchet effect" of a referendum proves to be mathematically or logically identical to the inertia of a legislature, the project loses its distinctiveness. It becomes a paper about political inertia generally, not referendums specifically.
  *Mitigation:* I will focus heavily on the *normative* weight of the "popular mandate." Even if the legal difficulty of repeal is the same, the *political* difficulty is the variable. If I cannot demonstrate that the "popular mandate" creates unique friction, I will pivot to arguing that referendums are simply the *purest* form of a general democratic problem, rather than a unique one.

  **Failure Condition 2: The Status Quo is Purely Linguistic.**
  If the analysis reveals that the "baseline" is entirely dependent on how the question is phrased (e.g., "Should we ban X?" vs. "Should we allow X?"), then the asymmetry is just a trick of wording, not a structural feature.
  *Mitigation:* I will limit the scope to *constitutional* or *high-salience* referendums where the outcome has material consequences regardless of framing. I will explicitly bracket low-salience plebiscites where framing dominates.

  **Failure Condition 3: Scope Creep into Empirical Verification.**
  The temptation will be to prove the theory using data (e.g., "Look at how many times Prop X was repealed"). This is outside the scope of a theory paper and risks getting bogged down in historical disputes.
  *Mitigation:* I will stick to *ideal types*. I will use phrases like "In a typical high-stakes referendum scenario..." rather than "In the 2016 UK referendum..." This keeps the argument theoretical and manageable.

  **8. Proposed Outline**

  1.  **Introduction (1 page):** The Competence/Legitimacy stalemate. Introducing the Asymmetry Thesis.
  2.  **The Structure of the Vote (2 pages):** Defining the Baseline, the Proposal, and the Ratchet. Why "Vote Again" is not a symmetric remedy.
  3.  **Comparative Inertia (2 pages):** Referendum vs. Legislature. Distinguishing procedural friction from plebiscitary entrenchment.
  4.  **The Ontology of the Status Quo (2 pages):** Fact vs. Convention. How voting transforms expectations into reality.
  5.  **Normative Implications (2 pages):** Democratic Fallibilism and Reversibility. What this means for institutional design.
  6.  **Conclusion (1 page):** Summary of the argument and limitations.

  **9. Conclusion**

  This project seeks to intervene in the theory of direct democracy by shifting the axis of evaluation from the *input* (voter quality) to the *trajectory* (decision path). By isolating directional asymmetry, it offers a explanation for why referendums often feel final in a way that legislation does not, even when both are technically reversible. The work ahead involves rigorously testing whether this feeling is a structural reality or a psychological illusion. If it is structural, it demands a rethinking of how we design democratic revision mechanisms. If it is illusion, it demands a rethinking of how we frame democratic choices. Either way, the competence/legitimacy dichotomy is insufficient to capture the stakes.

  The term will be spent refining the definition of "asymmetry" to ensure it is not merely a synonym for "winning." Winning always changes the world. The specific claim here is that the *referendum form* changes the world in a way that specifically degrades the capacity for future democratic correction. Proving this distinction is the core work of the paper. By avoiding specific historical entanglements and focusing on the conceptual architecture of the vote, this project aims to deliver a clear, transferable theoretical tool for analyzing direct democracy.

  **10. Bibliography Note**

  *Note: As per the workshop guidelines for this proposal stage, specific citations have been omitted to focus on the argumentative structure. The final paper will integrate relevant literature on path dependence, democratic theory, and institutional design.*
