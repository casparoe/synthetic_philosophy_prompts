answer: |-
  The binder was heavy, bound in blue vinyl that had faded to the color of a bruise. Inside were the Sharpenings. For every word in the zoning code that wobbled—*structure, family, habitable, dwelling*—there was a tab, and behind each tab, a list of admissible definitions.

  Elena ran her thumb over the edge of the page for *Dwelling Unit*. There were fourteen entries. Some required a permanent foundation. Some required a separate utility meter. One simply said, *Any space intended for overnight occupancy.*

  Across the desk, Mark was twisting a paperclip into a straight line. He looked like he hadn't slept in a week. His hands were red around the knuckles.

  "So," Mark said. His voice was dry. "If number four says yes, and number nine says no... we flip a coin?"

  "We draw a sharpening," Elena corrected gently. "It's not a coin. It's a weighted selection from the admissible list."

  "Same thing."

  "It's not," said David, sitting to Elena's right. David was younger, efficient, and believed in the system the way some people believe in gravity. "If we granted every permit that passed at least one sharpening, we'd have mansions in setback lines. If we denied every permit that failed one, nothing would ever get built. The supervaluation rule handles the clear cases. The lottery handles the gap."

  Elena didn't look up from the file. She was looking at the photograph of the garage. It was a detached structure, clapboard siding, peeling white paint. Inside the photo, you could see a sink bolted to the wall and a mattress on the floor.

  "The rule handles the gap," Elena repeated. "It doesn't fill it."

  "Does it matter?" Mark asked. "My mother is being discharged on Tuesday. Hospice care. She can't climb stairs. This garage is flat. It's ready. I just need to know if it's legal."

  Elena closed the file. She looked at Mark, then at the photo, then at the blue binder.

  "Under Sharpening D-4," Elena said, "a dwelling requires a connection to the municipal sewer system. Your garage uses a septic tie-in."

  "So that's a no," Mark said.

  "Under Sharpening D-9," David interjected, "a dwelling is defined by intent and capability of independent living. The sink and the bed satisfy that. That's a yes."

  "One yes, one no," Elena said. "The rest of the sharpenings are mixed or irrelevant. That puts you in the lottery pool."

  Mark stopped twisting the paperclip. It was now a straight, sharp wire. "My neighbor, Mr. Henderson. He did the same thing last year. Same street. Same garage. He got approved."

  "Henderson drew D-9," David said. "You might draw D-4."

  "That's not justice," Mark said. "That's roulette."

  Elena felt the familiar tightness in her chest. She stood up and walked to the window. The city sprawled out below, a grid of grey and green. Somewhere out there, a property line existed in the dirt, regardless of whether anyone had measured it.

  "The law requires certainty," David said. "We provide certainty."

  "You provide a verdict," Elena said. "You don't provide truth."

  She turned back to them. This was the part she never put in the official minutes. The category error. To Elena, the garage either was a dwelling or it wasn't. The concrete and the wood didn't care about the binder. The mortar didn't change its chemical composition based on a zoning adjustment. The fact that the code couldn't describe the reality didn't mean the reality was undecided. It just meant the code was blind.

  But she signed the forms. Because the alternative was David's way, or worse, a judge who knew nothing about load-bearing walls telling them what a home was.

  "Let's proceed," Elena said.

  David opened the safe behind him. Inside was a tumbler containing fourteen wooden balls, each numbered to correspond with the Sharpenings list. He shook it. The sound was like dry bones rattling.

  Before he could draw, the phone on Elena's desk rang. She let it go to voicemail, but the light blinked red. She knew who it was. Mrs. Gable from the West District.

  Mrs. Gable had filed a motion last month. The *Nuclear Option*, the clerks called it. Her argument was simple: If the term *dwelling* is vague, and the city relies on vague terms to enforce penalties, then the entire provision is void for vagueness. Therefore, no one can be denied a permit, and no one can be cited for a violation. Everyone wins. Or rather, the code dissolves.

  Elena had seen the memo from Legal. *Under Review.* That meant they were scared. If Gable won, the blue binder was kindling. The lottery was obsolete. The city would be a free-for-all until the council wrote new laws, which would just be new vague words waiting for new sharpenings.

  "Can we hurry?" Mark asked. "Please."

  David reached into the tumbler. His hand hovered. He wasn't superstitious, but he knew the weight of this moment. For Mark, this wasn't theory. It was where his mother would die.

  David pulled out ball number four.

  He set it on the desk. The number was stark black against the pale wood.

  D-4. *Permanent connection to municipal sewer required.*

  Mark stared at the ball. He didn't cry. He just went very still, the way an animal goes still when it knows the predator has found it.

  "Denied," David said. He reached for the stamp.

  "Wait," Elena said.

  David paused, stamp in hand. "The procedure was followed."

  "Check the admissibility log," Elena said.

  David frowned. "What?"

  "Sharpening D-4," Elena said. "When was it added?"

  "Two years ago. During the sewer infrastructure update."

  "Who approved it as admissible?"

  "The Committee."

  "Which Committee?"

  David shifted in his chair. "The Zoning Clarification Committee."

  "And who decides if a sharpening proposed by the Committee is itself admissible?" Elena asked.

  David blinked. "The Committee decides."

  "So the Committee decides what counts as a reasonable interpretation of the code, but there's no list for what counts as a reasonable interpretation?"

  "We have guidelines," David said, but his voice had lost its edge.

  "Guidelines," Elena said. "Are the guidelines vague?"

  "They're... general."

  "So," Elena said, tapping the blue binder. "We solved the vagueness of the code by creating a list. But the list itself relies on terms like 'reasonable' and 'admissible,' which are vague. And we don't have a list for those."

  David looked at the ball, then at Elena. "You're talking about second-order vagueness. We don't litigate the sharpenings, Elena. We apply them."

  "Why not?" Mark asked. He was leaning forward now, desperate for any handhold. "If the list is fuzzy, then the lottery is rigged."

  "The list is stable," David insisted.

  "Is it?" Elena walked over to the binder. She flipped to the front, to the section on *Admissibility Criteria*. It was a single page. *Criteria must be consistent with city charter and general planning principles.*

  "Consistent," Elena read. "What does consistent mean?"

  "It means what it says."

  "Does it?" Elena looked at Mark. "If I say a sharpening is admissible because I like the color of the ink, is that consistent?"

  "No, because that's not a planning principle."

  "But who decides what a planning principle is?"

  David stood up. "This isn't helpful. The man needs a decision."

  "The man needs a correct decision," Elena said. "And I don't think this is it."

  She looked at the ball again. Number four. The sewer connection. The garage had a septic tank. It was old, clay pipe, but it worked. It had worked for forty years. To Elena, standing in the room, looking at the photo, the garage *was* a dwelling. It housed a person. It had a bed. It had a sink. The sewer line was a technicality, a vein outside the body. The body was alive.

  She knew, with a certainty that frightened her, that the garage was a dwelling. The lottery hadn't discovered a truth; it had selected a preference. And because it was masked as procedure, no one could be blamed. If Mark sued, they'd show him the binder. They'd show him the ball. *See?* they'd say. *Fair.*

  But Elena knew someone was being wronged. She just couldn't prove who. Was it Mark, for being denied? Or was it the city, for pretending the code was clearer than it was?

  "Mrs. Gable's motion," Elena said quietly. "If she wins..."

  "Then we're all out of jobs," David said. "And the city descends into chaos."

  "Or," Elena said, "we admit we don't know."

  "We do know," David said. He picked up the stamp. "We know the procedure."

  He brought the stamp down. *DENIED.* The ink bloomed red on the application.

  Mark took the paper. He didn't look at them. He folded it once, twice, and put it in his pocket.

  "Can I appeal?" he asked.

  "You can request a review of the sharpening admissibility," David said automatically. "But those are rarely granted."

  "Rarely," Elena said.

  Mark looked at Elena. There was no anger in his eyes, just a hollow exhaustion. "You know," he said. "When I bought the place, the realtor told me the zoning was 'flexible.' She said the city works with people."

  "The city works with files," Elena said.

  Mark nodded. He turned to leave. At the door, he stopped. "My mother asked me yesterday if the house was ready. I told her yes. I lied."

  He opened the door and walked out into the hallway. The fluorescent lights hummed.

  David exhaled, a long release of tension. "Another case closed."

  He reached for the ball to put it back in the tumbler.

  "Leave it," Elena said.

  "It goes back in the pool."

  "Leave it on the desk."

  Elena walked back to the window. The sky was grey, matching the roofs below. Somewhere, Mrs. Gable was waiting for Legal to decide if the whole thing was a sham. Somewhere, Mark was driving home to tell his mother she couldn't come.

  "Do you think she's right?" David asked. "Gable?"

  "I think," Elena said, "that if you draw a line in the sand, the tide doesn't care."

  "The code is the line."

  "The code is just ink." Elena turned back to the desk. She looked at the blue binder. It looked thinner than it had this morning. Or maybe that was just the light. "David, when we added D-4... did we vote on it?"

  "Unanimously."

  "Was there discussion?"

  "Some. About the cost of infrastructure."

  "Did anyone argue that septic systems are functionally equivalent?"

  "Maybe. I don't recall."

  Elena opened the binder again. She ran her finger down the list of admissible sharpenings. *Reasonable. Consistent. Admissible.* Words that leaned on each other like drunkards holding up a fence.

  "If I proposed a new sharpening," Elena said. "One that says *'A dwelling is any structure where a human being sleeps.'* Would that be admissible?"

  David laughed, but it was nervous. "That's too broad. It would cover tents. RVs. Caves."

  "So it's not reasonable."

  "No."

  "Who decides?"

  "The Committee."

  "And if the Committee disagrees?"

  "Then we vote."

  "On what basis?"

  David stopped. He looked at the ball on the desk. He looked at the binder. For a second, the certainty drained out of his face, leaving something raw underneath. He opened his mouth, then closed it.

  "We vote on what feels right," he said finally.

  Elena nodded. She picked up her pen. She had to sign the denial. Her signature was the final lock on the door.

  "Then we're not using a list," she said. "We're just pretending we are."

  "It keeps us honest," David said. "It keeps us from playing favorites."

  "It keeps us from seeing," Elena said.

  She signed her name. *Elena Rostova.* The ink was wet. She blew on it gently.

  Outside, a siren wailed, moving down the street toward the village core. Toward the edge of town. Toward a garage with a sink and a bed and a woman waiting to come home.

  Elena closed the binder. The sound was final, like a coffin lid.

  "Next case," she said.

  David shuffled the papers. "Fence height dispute. Term: *Obstruction*."

  Elena looked at the blue book. She wondered how many sharpenings were in that list. She wondered if any of them accounted for the view of the sunset.

  "Read it," she said.

  David began to read. The words piled up in the air between them, solid and heavy, building a wall that neither of them could walk through.
