      **Reconstruction:**
      Schopenhauer's ethics rests on a metaphysical foundation: the world is Will, a blind, striving force objectified in phenomena. Individuation is illusion (*maya*); at the noumenal level, all beings are one. Suffering is positive and real, arising from the friction of willing; satisfaction is merely the negative cessation of pain. Because individuation is false, harming another is ultimately harming oneself. The only moral motive is compassion, which pierces the veil of individuation to recognize the shared suffering of the Will. The ultimate ethical task is not social reform but the denial of the Will-to-live, achieved through asceticism. This yields a quietistic soteriology rather than a political program. The moral saint does not fix the world but withdraws consent from the driving force that creates it. Thus, ethics is fundamentally about the orientation of the individual will, not the aggregation of outcomes across distinct persons.

      **On the normative doctrine:**
      Presented with negative utilitarianism, Schopenhauer would affirm the diagnosis but reject the prescription. He agrees that suffering is the sole evil and pleasure merely the absence of pain. However, negative utilitarianism is a consequentialist calculus requiring the aggregation of suffering across distinct individuals to determine policy. Schopenhauer's ethics is deontological regarding motive: an action is moral only if sprung from compassion, not if it accidentally reduces suffering. He would reject the utilitarian framework because it treats individuals as vessels for utility rather than manifestations of the one Will. Furthermore, utilitarianism looks forward to state-of-world outcomes, whereas Schopenhauer looks inward to the denial of striving. He would not accept negative utilitarianism as a public doctrine because it remains within the sphere of the Will—striving to change the world—rather than stepping outside it. To make suffering-reduction the *whole* moral task is to affirm the importance of the phenomenal world, which the ascetic seeks to negate. He would tell the philanthropist that funding systemic utility maximization is futile; funds should support immediate relief of suffering motivated by compassion or the propagation of wisdom leading to resignation, not engineering a pain-free existence which is metaphysically impossible.

