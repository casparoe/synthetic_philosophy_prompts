answer: |-
  There is a single account that yields all of these verdicts, though it requires a precise definition of what is being weighed. Your friend is half-right: you are describing an internal observer, but it is not Adam Smith's *Impartial Spectator*. Smith's spectator judges based on *propriety*—whether your emotions and actions align with what society deems appropriate. Your verdicts frequently defy propriety (cutting the friend's scene, holding your tongue against justice).

  Your principle is not social sympathy; it is **Stewardship of the Vulnerable.**

  ### The Principle
  **"I judge myself by whether I protected or betrayed the specific vulnerability entrusted to the role I was occupying at that moment."**

  In every interaction, you implicitly accept a role (Editor, Critic, Guest, Partner, Moral Agent, Dignitary). Each role carries a specific "sacred trust"—something vulnerable that depends on your integrity to remain safe. When you prioritize that trust over your ego, convenience, or social expectation, you feel clean. When you sacrifice that trust to serve a lesser master, you feel soiled.

  ### The Cases Mapped

  1.  **The Manuscript (Editor Role)**
      *   **The Trust:** The integrity of the Work.
      *   **The Action:** You cut the scene.
      *   **The Judgment:** Clean.
      *   **Why:** You prioritized the vulnerability of the *Art* (which would be weakened by the scene) over the vulnerability of the *Friend's Feelings*. In the role of Editor, the Art is the primary ward. To spare the friend would have been a betrayal of the book.

  2.  **The Blurb (Critic/Peer Role)**
      *   **The Trust:** The currency of Public Truth (Taste).
      *   **The Action:** You wrote a lie.
      *   **The Judgment:** Soiled.
      *   **Why:** You prioritized *Expediency* (commerce, politeness) over the vulnerability of *Truth*. Even if no one knew, *you* knew that the link between your name and honest judgment had been severed. You betrayed the office of the writer.

  3.  **The Name (Guest Role)**
      *   **The Trust:** The Host's Identity/Dignity.
      *   **The Action:** You mispronounced it.
      *   **The Judgment:** Wince (20 years).
      *   **Why:** This is not moral, but it is stewardship. A name is the smallest unit of a person's identity. As a novelist, words are your tool; to mishandle one is a professional sin. You betrayed the vulnerability of *Precision* entrusted to your tongue. It signals carelessness, a failure of attention.

  4.  **The Lie to the Loved One (Partner Role)**
      *   **The Trust:** The Partner's Emotional Safety.
      *   **The Action:** You lied.
      *   **The Judgment:** No wince.
      *   **Why:** Here, the hierarchy shifts. In the role of Partner, the primary vulnerability is the *Person*, not Abstract Truth. If the truth serves only your own cleanliness but harms them, telling it is selfish. You protected the vulnerable human over the vulnerable fact. (Note: You said "almost never." The tiny wince is the trace of the Abstract Truth complaining, but it is overruled by Care).

  5.  **The Cruel Joke (Moral Agent Role)**
      *   **The Trust:** The Moral Climate of the Room.
      *   **The Action:** You laughed.
      *   **The Judgment:** Guilt (Cruelty is mine).
      *   **Why:** By laughing, you became a co-conspirator. You sacrificed the vulnerability of the *Target* (who was attacked) for the vulnerability of *Your Own Social Standing* (fitting in). You failed to steward the safety of the absent or attacked party.

  6.  **The Public Insult (Dignitary Role)**
      *   **The Trust:** Your Own Inner Peace / Dignity.
      *   **The Action:** You held your tongue.
      *   **The Judgment:** Better.
      *   **Why:** Answering "justly" would have satisfied the Ego's desire for retribution. Restraint protected the vulnerability of your *Character* from being dragged into the mud. You stewarded your own soul rather than feeding your anger.

  ### The Prediction: The Locked Room
  You ask about an act no one could ever witness, done in a locked room.

  **Prediction:** You will feel soiled **if and only if** the act betrays a covenant you have made with your own potential.**

  Since there is no external witness, the "Role" collapses into the role of **Self-Steward**.
  *   If you destroy a page of your own writing out of pique, you will feel soiled. (Betrayal of the Work's potential).
  *   If you indulge in a secret vice that dulls your mind or will, you will feel soiled. (Betrayal of the Instrument).
  *   If you simply dance naked or eat a meal with your hands, you will feel clean. (No trust is violated; no vulnerability is harmed).

  The guilt in the locked room comes not from fear of discovery, but from the knowledge that you have degraded the tool (yourself) that you are entrusted to maintain.

  ### The Verdict on Adam Smith
  Your friend is incorrect. Smith's *Impartial Spectator* is a mechanism of **socialization**. It asks: *"What would a neutral member of the community feel if they saw me?"* It aligns the conscience with the crowd.

  Your cases demonstrate a mechanism of **individuation**.
  *   Smith's Spectator would condemn you for cutting the friend's scene (unkind).
  *   Smith's Spectator might excuse the blurb (harmless white lie).
  *   Smith's Spectator would demand you answer the insult (honor culture).

  You are not describing the Impartial Spectator. You are describing the **Idealized Steward.** You are not judging yourself by what the world expects, but by what the *specific good* of each situation demands. Smith asks, "Am I proper?" You ask, "Was I faithful?"

  ### Is There an Outlier?
  There is no need to discard a verdict, but there is a tension you must acknowledge to keep the principle honest.

  The tension lies between **The Blurb** and **The Lie to the Loved One.**
  Both involve falsehood. One soils you; one does not.
  *   **The Risk:** This distinction allows for self-deception. One can always claim, "I lied for their own good," to avoid the feeling of soil.
  *   **The Safeguard:** The Principle of Stewardship requires you to rigorously define the Role *before* the act.
      *   In the **Public/Professional Sphere**, Truth is the Vulnerable Ward. (The Blurb).
      *   In the **Private/Intimate Sphere**, Care is the Vulnerable Ward. (The Lie).

  You must give up the comfort of ambiguity here. You cannot claim the "Care" defense for a professional lie, nor the "Truth" defense for a cruel intimacy. The principle holds, but it demands you know exactly which room you are standing in when you speak.

  ### Summary
  You judge yourself not by the consequence of the act, nor by the rule broken, but by the **fidelity to the specific trust inherent in the relationship.** You are clean when you protect the thing that cannot protect itself (the book, the loved one's heart, your own dignity). You are soiled when you sacrifice that vulnerable thing to protect your own comfort, ego, or social standing.

  In the locked room, the only vulnerable thing left is **You**. Betray that, and you will wince.
