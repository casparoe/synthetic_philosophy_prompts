  You are almost certainly right that you are fighting about **(4)**, not (1).
  Your friend's 0.9 credence implies they view the violation of the assertion norm as lexically prior to other moral considerations, regardless of functional equivalence. Your 0.6 suggests you sense that once you control for harm, trust, and intent, the remaining "wrongness" is negligible or merely evaluative of character (blame) rather than act (wrongness). You are arguing about whether the residual deontic residue is substantial enough to bear weight; your friend thinks it is the whole foundation, while you suspect it is mostly smoke (virtue signaling) once the consequences are stripped away.
