prompt: |-
  I keep running into the neuron-replacement thought experiment in my reading — the one where a person's neurons are swapped out one at a time for functionally identical artificial replacements, such that at every stage the person behaves and reports exactly as before, until eventually none of the original biological tissue is left — and I can't shake the feeling that the whole puzzle is a migration problem in disguise, with an answer that is basically obvious. I'm a site-reliability engineer who spends his days doing live, zero-downtime migrations of stateful services: blue-green deploys, dual-writes to the old and new stores, shadow traffic, reconciliation, a cutover window during which the system is only eventually consistent, and a rollback path if it goes wrong. My gut says a service is whatever the load balancer points at, so a person is whatever the causal-continuity chain points at, and there is nothing left to argue about. I would like you to test that reaction rather than flatter it.

  Please restate the gradual-replacement debate — the positions that personal identity survives, that it does not, and that the question is somehow empty or ill-posed — as faithfully as you can in the vocabulary I actually use: services and instances, stateless versus stateful components, state and its reconciliation, dual-writes, cutover, rollback, and the difference between a service's logical identity and the concrete processes currently backing it. Then give me the residue report. Which claims translate cleanly into something like "what does the load balancer point at" or "is the state reconciled"? Which can be carried over only with distortion — I suspect the first-person, there-is-something-it-is-like aspect is going to be trouble, since my vocabulary describes a system from the outside and never from the inside? And which parts of the philosophers' debate have no counterpart at all: is there any sense in which a migration can be said to have a subject who undergoes the cutover, or to die and be replaced by a successor that merely resembles it? Close by telling me whether the leftover residue is better explained as my framework being too coarse-grained — missing a genuine feature of persons that no service migration possesses — or as the original debate being less substantive than it appears, with the participants trading on an ambiguity my vocabulary happens to expose. Keep the translation honest: do not quietly import consciousness or the self as a component I supposedly already have, and do not let the migration metaphor do argumentative work it hasn't earned.
