          *   The real fight is (4) vs. (5) and (3) vs. (6).
      *   **Section 2: Ranking Tensions.**
          *   1. (4) vs. (5): Direct contradiction.
          *   2. (3) vs. (6): The structural cause. Externalist norm vs. Internalist norm.
          *   3. (6) vs. (7): Can you know while irrational?
      *   **Section 3: What Must Give.**
          *   To save (5) and (6) (which seem central to the user's self-conception as a reasonable evidentialist), (3) must be the casualty.
          *   Why (3)? Because it assumes access to the factivity of knowledge without the evidential work.
          *   Cost: You lose the "Knowledge-First" shield. You can't use knowledge to bypass evidence evaluation.
      *   **Section 4: The Single Best Change.**
          *   Reject/Qualify (3).
          *   Replace with: "It is permissible to disregard evidence *only when your total evidence supports disregarding it*."
          *   This blocks (4).
          *   It preserves (1), (2), (5), (6), (7).
          *   Unresolved: How much counter-evidence defeats knowledge? (The threshold problem).

