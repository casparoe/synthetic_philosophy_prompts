answer: |-
  # Money & Value: A Diagnostic Decision Tree
  **For the Berkeley *Querist* Reading Group**

  Use this tree to locate your own intuitions about money. Start at the top and answer the questions based on the concrete cases provided. Follow the arrows to find your named theoretical position.

  ***

  **START HERE**

  **1. THE ISLAND CASE**
  Imagine an island with plenty of gold but no food or tools. Do the people on this island possess wealth?
  *   **YES** (Gold is wealth regardless of utility) → Go to **Leaf A**.
  *   **NO** (Wealth requires goods people can actually use) → Go to **Question 2**.

  **2. THE TAX CASE**
  The government announces tomorrow that it will no longer accept its own currency in payment of taxes. Does the currency immediately lose its value?
  *   **YES** (Money needs the state's demand to have value) → Go to **Leaf B**.
  *   **NO** (Money circulates based on trust or habit, not just taxes) → Go to **Question 3**.

  **3. THE RECORD-KEEPING CASE**
  Consider a system with perfect public record-keeping of who owes what to whom, so no tokens ever change hands. Is this system using money?
  *   **YES** (The ledger itself is the money) → Go to **Leaf C**.
  *   **NO** (You need a physical or digital token to have money) → Go to **Question 4**.

  **4. THE SUPPLY CUT CASE**
  A country's money supply is cut in half overnight and all prices and wages adjust proportionally. Does the real economy (employment, production) stay the same?
  *   **YES** (Money is just a veil; only relative prices matter) → Go to **Leaf D**.
  *   **NO** (Changing the money supply hurts or helps real production) → Go to **Question 5**.

  **5. THE SCRIP CASE**
  A bank fails and a small town starts issuing its own scrip that local shops agree to take. Is this scrip valuable because it is a promise to pay later, or because it keeps people working now?
  *   **"Promise to pay later"** (It is a transferable IOU) → Go to **Leaf E**.
  *   **"Keeps people working now"** (It is a tool to stimulate industry) → Go to **Question 6**.

  **6. THE EMPTY MARKET CASE**
  In a country where everyone has lots of money but nothing to buy with it, is the money worthless because the social agreement has broken, or because the tickets have nowhere to go?
  *   **"Social agreement broken"** (Value exists only because we collectively accept it) → Go to **Leaf F**.
  *   **"Tickets have nowhere to go"** (Value exists only as a claim on real labor/produce) → Go to **Leaf G**.

  ***

  ## THE LEAVES: YOUR POSITION

  **Leaf A: The Commodity/Metallist View**
  *   **Core Idea:** Money is a commodity like any other; its value comes from the scarcity and utility of the material (gold, silver) it is made of.
  *   **Most Awkward Commitment:** Hoarding gold in a vault increases national wealth even if the population is starving.

  **Leaf B: The State-and-Taxes View (Chartalism)**
  *   **Core Idea:** Money is a creature of the state; it has value primarily because the government demands it for tax payments.
  *   **Most Awkward Commitment:** A currency cannot exist without a sovereign power to enforce tax debts.

  **Leaf C: The Money-as-Public-Record View**
  *   **Core Idea:** Money is fundamentally an accounting system; tokens are just outdated technology for tracking credits and debits.
  *   **Most Awkward Commitment:** Physical cash is merely a primitive and unnecessary technology.
  *   **Note:** This position is nearly indistinguishable from the **Credit/Debt View** (Leaf E) using these questions alone; both view money as a social relation of owing rather than a thing.

  **Leaf D: The Neutral-Money/Quantity View**
  *   **Core Idea:** Money is a veil that covers real transactions; changing the supply changes nominal prices but not real output or employment.
  *   **Most Awkward Commitment:** Doubling the money supply makes everyone twice as rich nominally but changes nothing in reality.

  **Leaf E: The Credit/Debt View**
  *   **Core Idea:** Money is a transferable social obligation; to hold money is to hold an IOU from the community or banking system.
  *   **Most Awkward Commitment:** Paying off all debt in the economy would eliminate the money supply entirely.

  **Leaf F: The Convention or Status-Function View**
  *   **Core Idea:** Money is an institutional fact created by collective intentionality; it works simply because we agree to treat it as money.
  *   **Most Awkward Commitment:** Money retains value solely because we collectively hallucinate that it does.

  **Leaf G: Berkeley's Ticket-or-Counter View**
  *   **Core Idea:** Money is a ticket or counter used to circulate real wealth (land and labor); it has no value itself but motivates industry.
  *   **Modern Resemblance:** Resembles **Functional Finance** or **Job Guarantee** proposals (focus on employment); differs by grounding value in moral industry and circulation speed rather than tax obligation or price stability.
  *   **Most Awkward Commitment:** Issuing money without backing can be virtuous if it stimulates industry, risking inflation.

  ***

  **UNDEFENDED COMBINATIONS**
  *   **None:** All paths in this tree lead to historically defended positions. However, if you found yourself answering "YES" to the **Record-Keeping Case** (Leaf C) but also "YES" to the **Supply Cut Case** (Leaf D), you hold a rare libertarian-technocrat position that claims ledgers are money *but* that money supply changes don't affect real output; this is theoretically possible but rarely defended together.
