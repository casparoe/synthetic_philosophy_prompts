  2.  **Deconstruct the Philosophy (Leibniz):**
      *   *Justice:* "Benevolence of the wise" (*caritas sapientis*).
      *   *Love:* Taking disinterested delight in the perfection/happiness of another.
      *   *Wisdom:* Knowledge of the good, specifically the harmony of the whole.
      *   *Theodicy:* Local evil is permitted if it contributes to the greater good of the whole system (compossibility).
      *   *Degrees of Justice:* Strict right (no harm), equity (merit), piety/universal benevolence (holistic good).
      *   *Key Tension:* Immediate pity vs. long-term/systemic perfection.

  3.  **Design the Game Mechanics:**
      *   *Players:* 14 students. Divide into tables. 14 is awkward for groups. Let's do 3 tables of 4 and 1 table of 2? Or 2 tables of 7? 7 is too big for consensus. 3 tables of 4 and 1 table of 2 is uneven. Let's suggest 3 tables of 4-5 students (maybe 13 or 15, but prompt says 14). Let's do 3 tables of 4 and 1 table of 2, or just 3 tables of ~5. Actually, 14 students fits best as 3 tables of 4 and 1 table of 2, but the table of 2 will struggle. Better: 2 tables of 7 is too big for discussion. 3 tables of 5 (one student floats or instructor joins)? Let's assume 3 tables of 4 and 1 table of 2 is the reality, but I will design for 3 tables of 5 (instructor participates in one) or just 3 tables of 4-5. Let's standardize: **3 Tables of 4, 1 Table of 2.** Wait, 14 students. 3 tables of 4 = 12. 2 left over. Let's make it **3 Tables of 5** (Instructor joins one table to make 15, or one table has 4). Let's assume **3 Tables of 4 and 1 Table of 2** is too imbalanced. Let's suggest **3 Tables of 5** (with the instructor joining one group to balance, or accepting one group of 4). Actually, for a seminar, 3 groups of 4-5 is standard. I will design for **3 Groups**. (4, 5, 5).
      *   *Budget:* Needs to be tight enough to force choices. Let's say 10 Tokens per round.
      *   *Petitioners:* 6 distinct characters.
      *   *Scoring:* Holistic. Not $\sum Relief$. Needs to be "Harmony."
      *   *Rounds:* 2 Rounds. Round 1: Intuition/Compassion. Round 2: Wisdom/Strategy.
      *   *Knowledge:* "Counsel Cards" reveal hidden links. Cost: 2 Tokens.

  4.  **Develop the Petitioners (The "World"):**
      *   Need 6 characters.
      *   Need visible suffering.
      *   Need hidden connections (systemic).
      *   Need strict justice claims (debt/wrong).
      *   *Character 1 (The Visible Sufferer):* Sick child/parent. High pity.
      *   *Character 2 (The Debtor):* Owes money to Char 3. Strict justice claim.
      *   *Character 3 (The Creditor):* Needs repayment to function.
      *   *Character 4 (The Architect):* Seems fine, but holds the key to systemic stability.
      *   *Character 5 (The Victim):* Wronged by Char 6.
      *   *Character 6 (The Transgressor):* Caused harm, but fixing them helps the whole more.
      *   *Refinement:* Let's make the connections tighter.
      *   *A (The Dying Artist):* High suffering. Needs 5 tokens.
      *   *B (The Merchant):* Owes C. Needs 3 tokens to pay debt.
      *   *C (The Banker):* Needs B's payment to fund D.
      *   *D (The Engineer):* Fixes the water supply for E and F. Needs 4 tokens.
      *   *E (The Farmer):* Suffers moderately.
      *   *F (The Child):* Suffers moderately.
      *   *Hidden Link:* If D is not funded, E and F get worse regardless of aid. If B doesn't pay C, C collapses, D doesn't get funded.
      *   *Strict Justice:* B *owes* C. Ignoring this feels wrong.
      *   *Holistic Good:* Funding D (Engineer) saves E and F automatically. Funding A (Artist) is pure loss to the system score despite high pity.

  5.  **Develop the Score Formula:**
      *   Must not look arbitrary.
      *   Concept: "Stability" or "Harmony."
      *   Formula: $Score = \sum (Individual State) + (System Bonus) - (System Penalty)$.
      *   Better: $Score = (\text{Sum of Final Welfare}) \times (\text{Coherence Multiplier})$.
