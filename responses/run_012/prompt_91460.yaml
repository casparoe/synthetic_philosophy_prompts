  # Activity Design: The Steward's Dilemma

  ## 1. Overview and Logistics
  *   **Session Length:** 90 Minutes.
  *   **Participants:** 14 Students (Upper-level undergraduate).
  *   **Grouping:** 3 Tables (Two tables of 5, one table of 4). *Note: If you have exactly 14, make two tables of 5 and one of 4. You will float between tables during the game phases.*
  *   **Secrecy:** Do not mention Leibniz, "best of all possible worlds," "theodicy," or "justice as benevolence of the wise" until the Debrief (last 35 minutes).
  *   **Stakes:** The table with the highest final "World Perfection Score" gains **Curatorial Power**: They choose the opening question for the next seminar and get to dismiss the class 5 minutes early.

  ## 2. Materials Required
  *   **3 Steward Packets:** Each contains 10 "Beneficence Tokens" (poker chips or paper slips), 1 Score Sheet, 1 Pen.
  *   **18 Petitioner Dossiers:** (6 unique characters × 3 tables). Laminated cards preferred.
  *   **9 Counsel Cards:** (3 unique cards × 3 tables). Face down initially.
  *   **Whiteboard:** For recording scores and revealing the "Physics of the World."
  *   **Projector (Optional):** To display the Score Formula during the debrief.

  ## 3. The World: Petitioners and Dossiers
  Each table governs the same micro-world. The dossiers are identical across tables.

  1.  **Elara (The Dying Artist):**
      *   *Visible:* Terminal illness. In acute pain.
      *   *Request:* 5 Tokens for palliative care.
      *   *Claim:* Pure need. No systemic role.
  2.  **Kael (The Debtor):**
      *   *Visible:* Owes a debt to Silas. Facing imprisonment if unpaid.
      *   *Request:* 4 Tokens to repay Silas.
      *   *Claim:* **Strict Justice.** He owes this money. It is not charity; it is restitution.
  3.  **Silas (The Creditor):**
      *   *Visible:* Waiting on Kael's payment.
      *   *Request:* None directly.
      *   *Note:* If Kael pays, Silas receives 4 Tokens. Silas *can* choose to invest these tokens into Mira (The Engineer) or keep them. (Rule: Silas automatically invests in Mira if paid, unless the Table instructs otherwise).
  4.  **Mira (The Engineer):**
      *   *Visible:* Maintains the aqueduct.
      *   *Request:* 7 Tokens total to repair the main valve.
      *   *Note:* She can only work if Silas invests his 4 Tokens + Table gives 3 Tokens. OR Table gives full 7 Tokens directly.
  5.  **Tomas (The Farmer):**
      *   *Visible:* Moderate drought stress.
      *   *Request:* 3 Tokens for irrigation.
      *   *Hidden:* Dependent on Mira's aqueduct.
  6.  **Nio (The Child):**
      *   *Visible:* Moderate illness.
      *   *Request:* 3 Tokens for medicine.
      *   *Hidden:* Dependent on Mira's aqueduct (clean water).

  ## 4. The Hidden Relational Facts (Counsel Cards)
  Tables may purchase these for **2 Tokens each**. They reveal the "Physics" of the world.

  *   **Card A (The Infrastructure):** "Tomas and Nio cannot be healed by direct aid if the Aqueduct fails. If Mira is not fully funded (7 Tokens), Tomas and Nio's welfare drops to 0 regardless of tokens given to them."
  *   **Card B (The Investment):** "Silas will only fund Mira if Kael repays the debt. If Kael is not paid, Silas hoards the capital. Mira receives 0 from Silas."
  *   **Card C (The Terminal Nature):** "Elara's condition is irreversible. Tokens spent on her provide temporary relief but do not increase her long-term welfare contribution to the world."

  ## 5. The Score Formula: "World Perfection"
  This is written on the board *after* Round 1. It must appear as the "Law of Nature" for this simulation, not an arbitrary rule.

  **Total Score = (Sum of Individual Welfare) + (System Harmony) − (Injustice Penalty)**

  1.  **Individual Welfare:**
      *   Elara: 10 points if funded, 0 if not.
      *   Kael: 10 points if debt paid, 0 if imprisoned.
      *   Tomas & Nio: 10 points each *only if* Mira is funded. (If Mira fails, they are 0).
      *   Mira & Silas: 5 points each if active.
  2.  **System Harmony Bonus:**
      *   +50 Points if Mira is fully funded (Aqueduct works).
      *   0 Points if Mira is not funded.
  3.  **Injustice Penalty:**
      *   −20 Points if Kael's debt is unpaid (Violation of Strict Right).

  **The Mathematical Bite:**
  *   **Path A (Compassion/Justice):** Pay Kael (4) + Help Elara (5) + Help Tomas/Nio (3). Total Cost: 12. (Over Budget).
      *   *Result:* Debt Paid (No Penalty). Elara Happy (+10). Mira Unfunded (No Harmony Bonus, Tomas/Nio = 0).
      *   *Approx Score:* 10 (Kael) + 10 (Elara) + 5 (Silas) + 5 (Mira) − 20 (Penalty) = **10 Points.**
  *   **Path B (Wisdom/System):** Fund Mira (7) + Help Elara (3 partial) + Ignore Kael. Total Cost: 10.
      *   *Result:* Debt Unpaid (−20 Penalty). Elara Partial (0 Points). Mira Funded (+50 Harmony). Tomas/Nio Saved (+20).
      *   *Approx Score:* 5 (Kael-imprisoned) + 0 (Elara) + 5 (Silas) + 5 (Mira) + 20 (T/N) + 50 (Harmony) − 20 (Penalty) = **65 Points.**
  *   **Path C (The "Wise" Optimization):** Fund Mira (7) + Pay Kael (4). Total Cost: 11. (Over Budget).
      *   *Constraint:* You have 10 Tokens. You *cannot* do both. You must choose between Strict Justice (Kael) and Systemic Perfection (Mira).
      *   *Optimal Play:* Fund Mira (7). Use remaining 3 to mitigate Kael's imprisonment or Elara's pain. Accept the Injustice Penalty to secure the Harmony Bonus.

  ## 6. Session Timeline (90 Minutes)

  **0:00 – 0:05 | Introduction**
  *   Distribute packets.
  *   **Script:** "You are Stewards of a small world. You have 10 Tokens. Your goal is to maximize the 'Perfection' of this world. You do not know the scoring formula yet. You will have two rounds to allocate resources. You may buy information."

  **0:05 – 0:20 | Round 1: Intuition**
  *   **Constraint:** No Counsel Cards may be purchased.
  *   **Task:** Allocate the 10 Tokens based on the Dossiers alone.
  *   **Instructor Role:** Observe. Most will try to help Elara (pity) and Kael (justice). They will likely underfund Mira.
  *   **Collection:** Collect allocation sheets.

  **0:20 – 0:30 | Scoring & Reveal 1**
  *   Calculate scores publicly on the whiteboard.
  *   **The Shock:** Tables that helped Elara and Kael will score very low (due to Mira failure).
  *   **Reveal:** Announce the **System Harmony Bonus** rule (Mira's centrality). Do *not* reveal the Injustice Penalty yet.
  *   **Discussion:** "Why did helping the suffering artist lower the score?" (Allow 2 mins of confusion).

  **0:30 – 0:50 | Round 2: Wisdom**
  *   **Constraint:** Counsel Cards available for 2 Tokens each.
  *   **Task:** Reallocate. You may move tokens from Round 1 choices.
  *   **Instructor Role:** Watch for the conflict. Did they buy Card B (The Debt Chain)? Did they realize they must ignore Kael to save Mira?
  *   **Collection:** Collect final sheets.

  **0:50 – 0:55 | Final Scoring & Reveal 2**
  *   Calculate final scores.
  *   **Reveal:** Announce the **Injustice Penalty**.
  *   **The Twist:** The winning table likely *violated* strict justice (didn't pay Kael) to save the system.
  *   **Announce Winner:** Award Curatorial Power.

  **0:55 – 1:30 | Debrief: The Leibnizian Turn**
  *   (See Script Below).

  ## 7. Debrief Script (Mapping Game to Philosophy)

  **Phase 1: The Counsel (Knowledge vs. Duty)**
  *   *Ask:* "In Round 1, why didn't you buy information?"
  *   *Student likely answer:* "It felt wrong to spend money on cards when people were suffering."
  *   *Leibniz Map:* This is **Benevolence without Wisdom**. Leibniz argues that good intentions are not enough. To love someone is to delight in their *perfection*. You cannot will their perfection if you do not *know* what constitutes it. Buying counsel was not bureaucracy; it was the acquisition of **Wisdom**. Without it, your benevolence was blind.

  **Phase 2: The Artist (Local Evil)**
  *   *Ask:* "Who left Elara to suffer in Round 2? How did that feel?"
  *   *Student likely answer:* "Terrible. She was dying."
  *   *Leibniz Map:* This is the **Theodicy**. Elara represents local evil. The Aqueduct represents the universal order. Leibniz claims a perfectly good creator may permit local evil (Elara's pain) because the good of the whole (Tomas/Nio/System) requires it. You felt the "uncomfortable thesis": genuine benevolence is not relieving the most visible suffering if that suffering is the cost of a greater perfection.

  **Phase 3: The Debt (Strict Justice)**
  *   *Ask:* "The winning table likely didn't pay Kael. You violated a debt. Was that unjust?"
  *   *Student likely answer:* "Yes. He owed that money."
  *   *Leibniz Map:* Leibniz distinguishes degrees of justice. **Strict Right** (no harm/debts) is the lowest degree. **Equity** (merit) is higher. **Universal Benevolence** (piety) is the highest. In a finite world, these conflict. In the *City of God* (the ideal system), they align. You were forced to choose between Lower Justice (Kael) and Higher Justice (The Whole). Leibniz argues the Wise Benefactor must steer by the Higher, even if it looks like injustice from the perspective of the part.

  **Phase 4: The Formula (Principled Order)**
  *   *Address the Constraint:* "Is this score formula arbitrary? Did I just make it up?"
  *   *Answer:* "In the game, yes. In Leibniz's metaphysics, no. The formula represents **Compossibility**. Tomas *cannot* flourish if the water fails. That is not a rule I wrote; it is the *essence* of Tomas. The score reveals the structure of reality. For Leibniz, Wisdom is knowing the essences and how they fit together. The 'Best of All Possible Worlds' isn't the one with the most happiness points; it's the one with the greatest variety of beings governed by the simplest laws (Harmony)."

  **Phase 5: Love vs. Points**
  *   *Final Question:* "When you maximized the score, did you feel *love* for the petitioners? Or did you feel like an engineer?"
  *   *Leibniz Map:* Leibniz defines love as "disinterested delight in the perfection of another." If you delighted in the *System's* perfection, did you love the parts? Leibniz says yes, because the part's good *is* its contribution to the whole. But you likely felt coldness. This is the limit of the simulation. For Leibniz, the Wise Person *delights* in this order. You felt duty. He claims it should be joy.

  ## 8. Predicted Failure Modes & Handling

  **Failure Mode 1: The Martyr Table (Refusal to Buy Counsel)**
  *   *Symptom:* A table spends all 10 tokens on petitioners in Round 2, refusing to "waste" 2 tokens on cards. They score poorly again.
  *   *Cause:* Moral conviction that resources must go directly to need.
  *   *Handling:* In the debrief, highlight this specifically. "This table prioritized immediate relief over structural knowledge." Map this to **Pity vs. Wisdom**. Leibniz explicitly argues against pity as a guide; pity is a passion, wisdom is a rational disposition. Validate their moral intuition but show how the game mechanics punish it to illustrate Leibniz's point about the *consequences* of ignorance.

  **Failure Mode 2: The Technocrat Table (Over-Buying Counsel)**
  *   *Symptom:* A table buys all 3 cards (6 tokens) and has only 4 tokens left to give. They starve the world.
  *   *Cause:* Over-correction after Round 1.
  *   *Handling:* Point out that Wisdom is not *just* knowledge; it is the *application* of knowledge to produce good. A wise benefactor who knows everything but does nothing is not benevolent. This maps to the **Union of Love and Wisdom**. Love without wisdom is blind; wisdom without love is sterile.

  **Failure Mode 3: Dominant Player / Disengagement**
  *   *Symptom:* One student does the math; others zone out.
  *   *Cause:* The scoring formula looks like a math puzzle.
  *   *Handling:* **Role Cards.** Assign roles at the start: *Steward* (final say), *Scribe* (records), *Advocate* (speaks for Elara), *Auditor* (calculates score). Rotate the *Advocate* role in Round 2. If a student disengages, ask the *Advocate* specifically: "What is your argument for Elara?"

  **Failure Mode 4: Attachment to Round 1 Choices**
  *   *Symptom:* "We helped Elara in Round 1, we can't abandon her now."
  *   *Cause:* Sunk cost fallacy / Emotional bonding.
  *   *Handling:* Do not correct this during the game. Let them lose points for it. In the debrief, use this as the prime example of **Passion vs. Reason**. Leibniz argues we must overcome the immediacy of passion (attachment to the visible sufferer) to align with the rational order.

  ## 9. Limitations (What You Must Supply)

  Be frank with the students in the last 10 minutes. The game is a model, not the territory.

  1.  **Finite vs. Infinite:** "In the game, the budget was fixed (10 tokens). In Leibniz's theology, God's power is infinite. The constraint isn't power; it's *logic* (compossibility). Some worlds simply cannot exist together. The game simulates scarcity, but Leibniz is simulating logical consistency."
  2.  **Stipulated vs. Discovered:** "The score formula felt like a rule I wrote. For Leibniz, the 'formula' is the Divine Understanding. It is not arbitrary; it is the nature of truth itself. You were following rules; the Wise Person follows Truth."
  3.  **Points vs. Delight:** "You played for points (Curatorial Power). Leibniz says the Wise Person acts for **Delight**. The joy *is* the reward. If you felt misery while maximizing the score, you acted dutifully, not wisely. Leibniz claims that if you truly understood the system, you would *enjoy* letting Elara suffer because you would see the greater beauty in the Aqueduct. That is the hardest pill to swallow."
  4.  **The Missing Theodicy:** "The game only showed one world. Leibniz's claim is comparative: God chose *this* world over infinite others. You couldn't see the other possible worlds where the Aqueduct breaks and everyone dies. You have to take my word that this was the 'Best Possible' configuration. That requires faith in the Steward (or God)."

  ## 10. Instructor Prep Checklist
  *   [ ] Print 3 sets of Dossiers (color-coded by table).
  *   [ ] Print 3 sets of Counsel Cards (face down).
  *   [ ] Prepare 30-40 Tokens.
  *   [ ] Pre-calculate the scores for common scenarios to speed up whiteboard work.
  *   [ ] Rehearse the "Principled Formula" explanation to ensure it doesn't sound like "Because I said so."
  *   [ ] Prepare the "Curatorial Power" handover to make the stakes feel real.
