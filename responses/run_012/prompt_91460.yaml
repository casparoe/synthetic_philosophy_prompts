  13. **Final Polish:** Check tone, ensure all constraints are met, verify timing. Ensure the "Principled Formula" explanation is robust. (The formula represents the *metaphysical structure*, not arbitrary rules).

      *   *Stakes:* "Curatorial Power" is good.
      *   *Materials:* Dossiers, Tokens, Counsel Cards, Score Sheet.
      *   *Failure Modes:* Add specific instructor scripts for intervention.
