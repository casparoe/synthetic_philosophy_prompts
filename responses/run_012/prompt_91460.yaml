      *   *Limitations:* Game is finite, God is infinite. Game is rules, Wisdom is essence. Game is points, Love is delight.

  8.  **Drafting the Content:**

      *   *Petitioners:*
          1.  **Elara (The Dying Artist):** Terminal illness. High visible pain. Needs 5 tokens for palliative care. No systemic role.
