answer: |-
  ### 1. Essay Question

  **Module:** Kantian Ethics (Final Year)
  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Question:**

  Consider the following maxim:

  **M:** *In order to secure a comfortable life for myself, I will take more than my fair share from a shared, self-replenishing resource whenever I can do so without being noticed.*

  Evaluate the moral permissibility of acting on **M** using Kant's Formula of Universal Law. Your answer must explicitly address the following three points:

  1.  Analyze whether the clause "without being noticed" functions as part of the maxim's principle or as a mere circumstance of the action, and demonstrate how the outcome of the universalisation test changes depending on this classification.
  2.  Determine whether universalising **M** generates a contradiction in conception or a contradiction in will, and explain what this distinction implies for whether the duty violated is perfect or imperfect.
  3.  Address the objection that the Formula of Universal Law is manipulable (either empty or rigged) depending on how an agent describes their maxim. Argue whether **M** yields a determinate verdict independent of descriptive framing, or whether the test inherits its verdict from the agent's description.

  ***

  ### 2. Model Answer

  The Formula of Universal Law (FUL) requires agents to act only on maxims that they can simultaneously will to become a universal law of nature. To evaluate maxim **M**, we must first construct the maxim correctly, as the verdict depends on whether the condition "without being noticed" is integral to the principle or merely a contingent circumstance.

  If "without being noticed" is treated as a mere circumstance, the core maxim is simply: "I will take more than my fair share to secure comfort." Universalising this creates a world where everyone takes more than their share. The immediate result is the depletion of the shared resource. Here, the action (taking) remains physically possible, but the end (securing comfort via the resource) becomes unattainable. This generates a **contradiction in will**. The agent cannot rationally will a world where the necessary means to their end are universally destroyed. Under the FUL, contradictions in will typically indicate violations of **imperfect duties** (wide obligations), suggesting the agent violates a duty of prudence or broad obligation rather than strict justice.

  However, this reading is superficial. The clause "without being noticed" is not a background condition but a constitutive part of the agent's strategy; the action is predicated on free-riding. If we include this in the maxim—"I will take extra secretly"—and universalise it, we conceive a world where everyone takes extra secretly. In such a world, universal suspicion would inevitably arise, leading to heightened scrutiny or the collapse of the "shared" nature of the resource. Consequently, the condition of being "unnoticed" becomes logically impossible to maintain. This generates a **contradiction in conception**. The action-type itself cannot be performed once universalised because the necessary condition (secrecy) is negated by the universal law. Contradictions in conception indicate violations of **perfect duties** (strict obligations). Therefore, classifying the clause as part of the principle shifts the verdict from an imperfect duty (based on frustrated purposes) to a perfect duty (based on logical impossibility).

  This distinction addresses the third requirement: the objection that the FUL is manipulable. Critics argue the test is empty because an agent can rig the verdict by describing the maxim favourably (e.g., "I will take extra") or unfavourably (e.g., "I will steal secretly"). If the verdict on **M** shifts from imperfect to perfect duty based solely on description, the test appears rigged. However, Kantian ethics requires the maxim to reflect the agent's actual principle of volition, not an arbitrary description. The agent does not merely "take"; they "take secretly" because they recognise the wrongfulness of taking openly. To omit the secrecy clause is to misrepresent the agent's reasoning.

  Therefore, **M** yields a determinate verdict not because the description is fixed arbitrarily, but because rational consistency constraints require the maxim to include all conditions essential to the action's success. Since the agent relies on the exception (secrecy) to succeed, the maxim must include it. When universalised, this reliance creates a contradiction in conception. The test is not empty because it exposes that the agent's rationality depends on a privilege they cannot universalise. The verdict is inherited from the description only insofar as the description must be truthful to the agent's rational agency. Thus, **M** is impermissible, violating a perfect duty of justice, and the FUL successfully identifies this without being manipulable, provided the maxim is formulated as the agent's actual rule of reasoning rather than a sanitized physical description.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25 (5 points × 5 marks each)

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Correct Statement of FUL:** Clearly articulates the structure of the Formula of Universal Law (acting on maxims that can be willed as universal law) without relying on rote quotation. | 5 | Candidates often quote the Groundwork verbatim without explaining the structure or confuse FUL with the Formula of Humanity. |
  | **2** | **Maxim Analysis (Feature 1):** Explicitly distinguishes between treating "without being noticed" as a circumstance versus a principle, and shows how this alters the universalisation outcome (e.g., resource depletion vs. impossibility of secrecy). | 5 | Candidates typically treat the clause as irrelevant background noise and fail to show how the test result *changes* based on the classification. |
  | **3** | **Contradiction Type (Feature 2):** Correctly identifies the difference between contradiction in conception (action impossible) and contradiction in will (end unattainable) and applies it to the two readings of **M**. | 5 | Candidates frequently conflate the two contradictions or claim both readings lead to the exact same type of contradiction without distinction. |
  | **4** | **Duty Classification (Feature 2):** Links the type of contradiction to the type of duty (Conception = Perfect Duty; Will = Imperfect Duty) and commits to a final verdict on **M**. | 5 | Candidates often identify the contradiction but fail to map it to the Perfect/Imperfect duty distinction, leaving the moral status vague. |
  | **5** | **Formalism Objection (Feature 3):** Addresses the "emptiness/rigging" objection, arguing whether **M** allows manipulability or if rational constraints on maxim formation secure a determinate verdict. | 5 | Candidates usually recite the objection generically without applying it to **M**, or claim the test is rigged without explaining how truthful maxim-formation prevents this. |
