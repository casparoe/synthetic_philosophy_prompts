prompt: |-
  I staff the tribunal our diocese convenes when someone claims a healing through the intercession of a candidate for sainthood, and my job is to decide which claims get a full investigation and which we decline. We see perhaps twenty claims in a decade, a decline is effectively final for the claimant, and our stated criteria are that the cure be complete, lasting, and medically inexplicable. Write me a decision procedure my team can actually run — a checklist in order, not a discussion — built out of Hume's argument about miracles rather than out of general skepticism. I need the questions to ask in sequence, what counts as a sufficient answer to each, the step where the procedure stops with a no, and the step where it hands the decision to a person because what remains is a question of faith rather than of evidence. Keep straight which parts of Hume's case bear on the evidence for this particular report and which bear on the credibility of reports of the miraculous in general, and include his concession that testimony can be credible when rejecting it would require believing something even more extraordinary. Then run the procedure on three claims: a tumor that disappeared after a pilgrimage, with before-and-after scans and three physicians willing to call the recovery unexplained; a claim resting on a single elderly witness devoted to the cause, who stands to gain nothing; and a healing of the same illness reported at a shrine belonging to a different religion. Our team is me, a consulting physician, and a canon lawyer; our recommendations go to the bishop, who signs off. Tell me where the procedure returns an answer I will not like, which steps are judgment calls dressed up as procedure, and what the procedure cannot do. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Staff member of a diocesan tribunal investigating alleged miracles (healings) for sainthood causes.
      *   **Task:** Create a decision procedure (checklist in order) for the team (Staff, Physician, Canon Lawyer) to decide which claims get a full investigation vs. decline.
      *   **Constraint 1 (Philosophical Basis):** Build it out of David Hume's argument about miracles (*An Enquiry Concerning Human Understanding*, Section X), *not* general skepticism.
      *   **Constraint 2 (Structure):** Questions in sequence, sufficient answers defined, stop points (No), hand-off point (Faith vs. Evidence).
      *   **Constraint 3 (Humean Nuance):** Distinguish between evidence for the *particular report* vs. credibility of miraculous reports *in general*. Include Hume's concession (testimony credible if rejecting it is more extraordinary).
      *   **Constraint 4 (Application):** Run the procedure on three specific cases:
          1.  Tumor disappearance (scans, 3 doctors).
          2.  Single elderly witness (devoted, no gain).
          3.  Healing at a different religion's shrine (same illness).
      *   **Constraint 5 (Meta-Analysis):** Identify where the procedure returns an unwanted answer, where judgment calls are disguised as procedure, and what the procedure cannot do.
      *   **Tone/Style:** American English, professional, actionable.

  2.  **Deconstruct Hume's Argument (Section X):**
      *   *Core Maxim:* A wise man proportions his belief to the evidence.
      *   *The Conflict:* Miracle = violation of laws of nature. Evidence for miracle = human testimony.
      *   *The Weighing:* We weigh the evidence *for* the miracle against the evidence *for* the uniformity of nature (the law being violated).
      *   *The Conclusion:* No testimony is sufficient to establish a miracle unless the falsehood of that testimony would be *more miraculous* than the event itself.
      *   *Four Grounds for Diminishing Testimony:*
          1.  Witnesses lacking integrity/number/character.
          2.  Human tendency toward wonder/surprise (psychological bias).
          3.  Prevalence among ignorant/barbarous peoples (cultural bias).
          4.  Contradictory miracles (different religions claiming miracles cancel each other out).
      *   *The Concession:* If the testimony is so strong that its falsehood is *more* extraordinary than the miracle, belief is warranted (though Hume thinks this rarely/never happens in practice).

  3.  **Drafting the Procedure (The Checklist):**
      *   *Goal:* Filter claims based on Humean criteria before full investigation.
      *   *Step 1: The Law of Nature (The Baseline).* Is the event actually a violation of natural law? (Hume's definition of miracle). If it's just rare, it's not a miracle.
      *   *Step 2: The Testimony Quality (Hume's 4 Grounds).*
          *   2a: Number and Integrity of Witnesses.
          *   2b: Psychological Bias (Wonder/Surprise).
          *   2c: Education/Competence (Ignorance).
          *   2d: Conflicting Claims (Other Religions).
      *   *Step 3: The Humean Weighing.* Is the falsehood of the testimony *more* miraculous than the cure?
      *   *Step 4: The Hand-off.* If it passes Step 3, it's no longer evidence-based; it's faith-based.

      *Refining for the Tribunal Context:* The prompt asks for a procedure to decide *investigation* vs. *decline*. A full Humean application might decline *everything*. I need to adapt Hume to allow for the *possibility* of investigation while using his rigor as the filter. The prompt asks to distinguish where evidence ends and faith begins.
      *   *Adjustment:* The procedure must identify when the evidence *fails* Hume's test (Decline) vs. when it *passes* the evidentiary bar (Investigate/Hand-off).
      *   *Crucial Distinction:* Hume argues against *establishing* a miracle as a foundation for a system of religion. The Church argues for *individual* sanctity. I must apply Hume's epistemic standards without necessarily adopting his atheistic conclusion, but strictly following his *logic* for evaluating testimony.

      *Sequence:*
      1.  Medical Inexplicability (Is the "Law" clear?)
      2.  Witness Integrity & Number (Hume's Ground 1).
      3.  Psychological/Cultural Bias (Hume's Grounds 2 & 3).
      4.  Conflicting Systems (Hume's Ground 4).
      5.  The "More Miraculous" Test (Hume's Concession).
      6.  Hand-off to Faith.

  4.  **Running the Cases:**
      *   *Case 1 (Tumor/Scans/3 Docs):* Passes medical inexplicability. Passes witness number/integrity (docs). Low bias (medical records). Passes "More Miraculous" test (falsehood of 3 docs + scans is highly improbable). *Result: Investigate.*
      *   *Case 2 (Single Elderly Witness):* Fails Witness Number (Hume emphasizes "number"). High potential for bias (devotion). *Result: Decline.*
      *   *Case 3 (Different Religion):* Fails Conflicting Systems (Hume's Ground 4). If God validates Candidate A, why validate Shrine B? *Result: Decline.*

  5.  **Meta-Analysis (The "Unwanted Answers" & Limitations):**
      *   *Unwanted Answer:* Hume's bar is so high it might reject Case 1 if the Physician says "Spontaneous remission is rare but natural." Hume defines miracle as a *violation* of law, not just unexplained. If the law isn't violated, Hume says it's not a miracle.
      *   *Judgment Calls:* Defining "Violation of Law" vs. "Unknown Mechanism." Assessing "Integrity."
      *   *Cannot Do:* Prove divine action. Prove sanctity. Resolve the "Conflicting Miracles" issue without offending ecumenism.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Hume says no." The prompt asks for a procedure *built out of* his argument. This means using his criteria as the filter. If a claim fails Hume's test, we decline. If it passes, we investigate (acknowledging the limit of evidence).
      *   *Correction on Step 4 (Conflicting Religions):* This is tricky for a Catholic tribunal. Hume uses this to destroy *all* religion. I need to frame it as Hume does: does this claim contradict the uniformity of experience regarding *this specific candidate* vs. others? Actually, Hume's point is that miracles in *other* religions weaken the evidence for *this* one. I must include this honestly as per the prompt's instruction to use Hume's argument.
      *   *Correction on Hand-off:* The prompt asks where it hands the decision to a person because what remains is faith. This is *after* the evidentiary bar is cleared.
      *   *Tone Check:* American English. Professional. Checklist format.

  7.  **Final Polish:**
      *   Ensure the distinction between "Evidence for this report" and "Evidence for miracles in general" is clear in the steps.
      *   Ensure the "More Miraculous" concession is explicitly Step 5.
      *   Ensure the Meta-Analysis section addresses the specific constraints (unwanted answers, judgment calls, limitations).

  8.  *(Final Review against Prompt)*
      *   Checklist in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points (No)? Yes.
      *   Hand-off point? Yes.
      *   Hume's specific arguments (4 grounds + concession)? Yes.
      *   Three cases run? Yes.
      *   Meta-analysis included? Yes.
      *   American English? Yes.

      *Wait, one nuance:* Hume distinguishes between the *uniform experience* against the miracle and the *testimony* for it. The procedure needs to weigh these.
      *Step 1:* Establish the Uniform Experience (Medical Consensus).
      *Step 2:* Evaluate Testimony (Hume's 4 grounds).
      *Step 3:* Weighing (The Concession).
      *Step 4:* Faith Hand-off.

      *Let's write it.*
answer: |-
  # Tribunal Decision Procedure: Evidentiary Screening for Alleged Miraculous Cures

  **Purpose:** To determine whether a claim of healing warrants a full canonical investigation or should be declined at the preliminary stage.
  **Philosophical Basis:** David Hume, *An Enquiry Concerning Human Understanding*, Section X ("Of Miracles").
  **Team:** Tribunal Staff (Chair), Consulting Physician, Canon Lawyer.
  **Authority:** Recommendation to the Bishop.

  **Instructions:** Proceed through steps 1–5 sequentially. If a claim fails any step, mark **DECLINE** and stop. If a claim passes Step 5, mark **INVESTIGATE** and proceed to Step 6 (Hand-off).

  ---

  ### Step 1: The Law of Nature Threshold (Defining the Miracle)
  **Humean Principle:** A miracle is a violation of the laws of nature. Mere rarity or unexplained phenomena are not miracles. Uniform experience stands against every supernatural event.
  **Question:** Does the Consulting Physician certify that the recovery contradicts established medical law, rather than simply exceeding current statistical expectation?
  **Sufficient Answer:** "Yes. The recovery is not merely rare or unexplained; it is physiologically impossible under current medical understanding (e.g., regrowth of amputated bone, instant dissolution of malignant tissue without necrosis)."
  **Insufficient Answer:** "We cannot explain how this happened," or "This is a very rare spontaneous remission."
  **Stop Condition:** If the Physician cannot certify a violation of natural law (as opposed to an gap in knowledge), **DECLINE**.
  *Note: This addresses the evidence for miracles in **general**. If the event fits within the uniform experience of nature (even at the extreme edge), Hume's argument dictates no testimony can elevate it to a miracle.*

  ### Step 2: Witness Integrity and Number
  **Humean Principle:** Testimony is weakened by a lack of witnesses, lack of integrity, or lack of education. We weigh the probability that the witnesses are deceived or deceiving.
  **Question:** Are there multiple witnesses of proven education and integrity, whose character would suffer greater damage from being caught in a lie than they would gain from the report?
  **Sufficient Answer:** "Yes. There are at least two independent, medically trained observers with no vested interest in the cause, whose professional reputations would be ruined by fraud."
  **Insufficient Answer:** "There is one witness," or "The witnesses are devoted followers," or "The witnesses are uneducated regarding the medical condition."
  **Stop Condition:** If the testimony rests on a single witness, or witnesses with clear bias/lack of competence, **DECLINE**.
  *Note: This addresses the evidence for **this particular report**. Hume argues that human testimony rarely achieves the force necessary to overturn uniform experience.*

  ### Step 3: Psychological and Cultural Bias Check
  **Humean Principle:** Human psychology has a natural appetite for the marvelous. Reports of miracles thrive among "ignorant and barbarous" peoples or in atmospheres of high emotional excitement.
  **Question:** Is the claim free from the "passion of surprise and wonder"? Is the documentation generated contemporaneously, without the influence of devotional fervor?
  **Sufficient Answer:** "Yes. Medical records pre-date the devotional claim. The witnesses express skepticism rather than joy. The cultural context is scientifically rigorous."
  **Insufficient Answer:** "The witness is a devout member of the prayer group," or "The claim emerged during a pilgrimage," or "The report relies on oral tradition."
  **Stop Condition:** If the claim appears driven by the psychological "love of wonder" or devotional bias, **DECLINE**.

  ### Step 4: The Conflicting Systems Test
  **Humean Principle:** Miracles are claimed by all religions to establish their specific doctrines. Since religions contradict each other, their miraculous claims cancel out. A miracle in one system weakens the evidence for a miracle in another.
  **Question:** Is this cure uniquely tied to the intercession of *this* Candidate, or is the same cure reported via the intercession of figures from contradictory religious systems?
  **Sufficient Answer:** "Yes. The specific physiological reversal is uniquely correlated to this Candidate's intercession and not replicated in rival religious contexts."
  **Insufficient Answer:** "Similar healings are reported at shrines of other faiths," or "The healing method is universal and not specific to this Candidate."
  **Stop Condition:** If the same "miracle" validates a contradictory religious system, **DECLINE**.
  *Note: This addresses the evidence for miracles in **general**. Hume argues that opposing miracles destroy each other's credit.*

  ### Step 5: The "More Miraculous" Weighing (Hume's Concession)
  **Humean Principle:** No testimony is sufficient to establish a miracle unless the falsehood of that testimony would be *more miraculous* than the event it endeavors to establish.
  **Question:** Is it more extraordinary (more improbable) that the physicians, scans, and witnesses are all mistaken or lying, than that the law of nature was violated?
  **Sufficient Answer:** "Yes. The conspiracy or collective hallucination required to fake this evidence is statistically less probable than the medical anomaly."
  **Insufficient Answer:** "It is possible," or "The evidence is strong, but human error is common."
  **Stop Condition:** If the falsehood of the testimony is *not* more miraculous than the cure itself, **DECLINE**.
  *Note: This is the final evidentiary bar. If the claim passes here, the evidence has reached its maximum possible weight.*

  ### Step 6: The Faith Hand-off
  **Status:** **INVESTIGATE**.
  **Instruction:** The Tribunal has exhausted empirical evaluation. The remaining question is not "Did this happen?" (Evidence) but "Does this signify sanctity?" (Faith).
  **Action:** Forward file to the Bishop.
  **Limit:** The Tribunal cannot certify a miracle. It can only certify that the evidence is not irrational to accept. The Bishop decides based on theological virtue, not empirical proof.

  ---

  ## Application of Procedure to Test Cases

  ### Case 1: Tumor Disappearance (Scans + 3 Physicians)
  *   **Step 1 (Law of Nature):** Physician certifies instant dissolution of malignant tissue is physiologically impossible without necrosis. **PASS.**
  *   **Step 2 (Witnesses):** Three physicians, independent, reputations at stake. **PASS.**
  *   **Step 3 (Bias):** Scans are objective; records pre-date pilgrimage claim. **PASS.**
  *   **Step 4 (Conflicting Systems):** No report of this specific tumor vanishing via rival intercession. **PASS.**
  *   **Step 5 (Weighing):** Is it more miraculous that three doctors and imaging technology are wrong, or that the tumor vanished? The falsehood is more improbable. **PASS.**
  *   **Result:** **INVESTIGATE.** (Hand-off to Bishop).

  ### Case 2: Single Elderly Witness (Devoted, No Gain)
  *   **Step 1 (Law of Nature):** Physician cannot verify violation of law without medical records. **FAIL.** (Stop).
  *   *Hypothetical Step 2 (Witnesses):* Single witness. Hume explicitly argues a single witness is never sufficient against uniform experience. **FAIL.**
  *   *Hypothetical Step 3 (Bias):* Witness is "devoted to the cause." High psychological bias. **FAIL.**
  *   **Result:** **DECLINE.**

  ### Case 3: Healing at Different Religion's Shrine (Same Illness)
  *   **Step 1 (Law of Nature):** Physician certifies violation of law. **PASS.**
  *   **Step 2 (Witnesses):** Assume multiple doctors. **PASS.**
  *   **Step 3 (Bias):** Assume low bias. **PASS.**
  *   **Step 4 (Conflicting Systems):** The same illness was healed at a shrine belonging to a different religion (contradictory doctrine). Hume argues these claims destroy each other's authority. **FAIL.**
  *   **Result:** **DECLINE.**

  ---

  ## Meta-Analysis of the Procedure

  ### 1. Where the Procedure Returns an Answer You Will Not Like
  You will likely dislike the outcome of **Case 3**. As a Catholic tribunal, declining a claim because a non-Catholic shrine reported a similar healing contradicts the theological view that God's grace is not limited by visible boundaries. However, Hume's argument (Step 4) demands this. If you accept Hume's logic to filter evidence, you must accept that "competing miracles" weaken the evidentiary value of *all* miracles. To accept Case 3 while using this procedure requires you to ignore Step 4, which breaks the Humean framework you requested.

  Additionally, you may dislike **Step 1**. Hume defines a miracle as a *violation* of natural law. Modern medicine rarely speaks in absolutes ("impossible") but in probabilities ("highly unlikely"). If your Consulting Physician adheres to scientific rigor, they may rarely certify a "violation," forcing you to **DECLINE** almost everything, including Case 1.

  ### 2. Judgment Calls Dressed Up as Procedure
  *   **Step 1 (Violation vs. Ignorance):** Distinguishing between a true violation of natural law and a medical phenomenon we simply do not yet understand is a metaphysical judgment, not a medical one. The Physician is making a philosophical claim disguised as a medical diagnosis.
  *   **Step 5 (The Weighing):** Calculating whether "false testimony" is more miraculous than "physical healing" is subjective. There is no formula for comparing the probability of a lie against the probability of a law of nature being suspended. The Team is essentially guessing at probabilities.
  *   **Step 3 (Bias):** Determining if "devotion" invalidates testimony is a judgment call. A devoted witness might be *more* careful to tell the truth before God. The procedure assumes devotion equals unreliability.

  ### 3. What the Procedure Cannot Do
  *   **Prove Divine Action:** This procedure only evaluates human testimony and physical data. It cannot bridge the gap between "medically inexplicable" and "caused by the Candidate's intercession." That link is theological, not evidentiary.
  *   **Resolve the "Conflicting Miracles" Problem Satisfactorily:** Step 4 follows Hume, but Hume uses this to argue *against* all religion. Using it to filter *some* claims while accepting others requires a theological exception that the procedure itself cannot justify.
  *   **Eliminate Faith:** Step 6 admits that even if all evidence passes, the final decision is not evidentiary. The procedure cannot remove the risk of error; it can only minimize it. The Bishop still signs off on a probability, not a certainty.

  ### 4. Distinction: Particular Report vs. General Credibility
  *   **Steps 2 & 3** bear on the **Particular Report**. They ask: Are *these* witnesses lying or deluded?
  *   **Steps 1, 4, & 5** bear on the **General Credibility** of miracles. They ask: Is it rational to believe *any* violation of nature? Is it rational to believe miracles validate specific doctrines?
  *   **The Tension:** Hume argues that the General Credibility (uniform experience against miracles) is so strong that it almost always overwhelms the Particular Report. This procedure attempts to balance them, but Hume would argue the scale is rigged against the claimant from Step 1.
