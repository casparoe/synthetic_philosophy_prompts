  **Principle: Graded Phenomenal Homeostasis**
  Moral status is proportional to the complexity of a system's capacity to represent internal states as valenced (good/bad) and modify behavior via plastic learning to regulate them.

  **Clauses and Verdicts:**
  1.  **Gradation:** Status scales with regulatory complexity. (Forced by: Mouse > Crab > Bee).
  2.  **Fixed Reflex Exclusion:** Systems with fixed set-points lacking plastic modeling have zero status. (Forced by: Thermostat = 0, Plant = 0).
  3.  **Plastic Learning Inclusion:** Systems updating internal models to minimize error regarding preferred states possess non-zero status. (Forced by: Simple Learning System > 0).
  4.  **Report Insufficiency:** Linguistic output without valenced regulation confers no status. (Forced by: Language Model = 0).
  5.  **Substrate Individualism:** Status attaches to individual regulatory units, not emergent collectives. (Forced by: Bee Colony = sum of bees).
  6.  **Current Capacity:** Status depends on present functional ability, not species history. (Forced by: PVS < Mouse).

  **Prediction (Mouse/Human Glia):**
  Status remains substantially mouse-level. Glia modulate synaptic transmission; unless human glia enhance signal integration complexity beyond typical mouse capacity, status does not rise. If modeling complexity increases, status rises proportionally. Species origin of cells is irrelevant; functional capacity determines status.

  **Incompatibilities:**
  1.  **No Threshold Constraint:** The principle violates your desire for "no magic threshold" by enforcing a binary distinction between fixed (zero) and plastic (non-zero) homeostasis. You cannot have strict zeros for plants/thermostats and non-zeros for learning systems without a threshold.
  2.  **Verdict Consistency:** You note the Learning System looks "exactly like" the Thermostat. If they are functionally identical regarding preferred states, this principle cannot accommodate both verdicts (Thermostat=0, Learning System>0) without arbitrariness. It forces you to abandon either the Thermostat verdict or the Learning System verdict.
