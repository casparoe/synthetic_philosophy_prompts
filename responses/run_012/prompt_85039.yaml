  **TO:** Technical Steering Committee
  **FROM:** [Your Name]
  **DATE:** 10 October 2024
  **SUBJECT:** Decision Memo: Time Range Compaction Spec Ambiguity

  **1. Recommendation**
  I recommend we **reject the contributor's patch in its current form**, but immediately **accept their finding** that the specification is ambiguous. We will draft a spec update explicitly defining behavior for adjacent ranges and zero-length gaps (aligning with the original semantic intent of "compaction"), update the conformance suite to cover these cases, and invite the contributor to rebase their patch against the clarified spec.

  **Target Date for Spec Update:** Thursday, 24 October 2024.

  **2. The Core Issue**
  The contributor's implementation passes all 200 existing fixtures but diverges from the original author's intent on edge cases not covered by the suite (specifically, adjacent ranges touching at endpoints). The contributor argues that passing the suite constitutes compliance. The original author argues that the spec's semantic intent overrides the suite.

  **3. The Status of the Spec (Pre-Decision)**
  We must acknowledge a difficult logical reality regarding the specification prior to this dispute. There is no hidden "fact of the matter" about what the spec meant for these edge cases. A finite set of examples (the fixtures) and text (the spec) cannot logically rule out every possible interpretation of future cases. Until now, the behavior for adjacent ranges was genuinely undefined. The author's intent existed in her mind, but it was not successfully encoded in the public artifact. The contributor's interpretation is logically consistent with the text provided, even if it violates the semantic spirit.

  **4. Policy for Future Ambiguities**
  To prevent recurrence, the committee adopts the following hierarchy of truth:
  1.  **Spec Text:** The primary source of truth. If the text is ambiguous, it is a bug in the spec, not the implementation.
  2.  **Conformance Suite:** A verification tool, not a definition. Passing the suite is necessary but not sufficient for compliance if the implementation violates the explicit spec text or established semantic goals.
  3.  **Intent:** Original author intent is advisory. It guides spec updates but does not veto compliant implementations of ambiguous text unless ratified by the committee.

  **5. Argument for the Opposing View (Steelman)**
  We must take the contributor's position seriously. Their argument rests on **objectivity and trust**. In open source, contributors cannot read minds. If we reject an implementation that passes all provided tests based on unstated "intent," we risk moving the goalposts. This creates a gatekeeping dynamic where compliance is determined by social standing or insider knowledge rather than verifiable criteria. Accepting the patch would force us to improve our test suite to actually match our rules, driving higher rigor in our formal definitions. It treats the spec as a contract: if we didn't write it down, we can't enforce it.

  **6. Implications of Indeterminacy**
  Regarding the philosophical concern: admitting there was "no fact of the matter" previously does not mean "anything goes" now. It does not grant us arbitrary power, but it does shift our role. We are not judges discovering a pre-existing truth; we are legislators creating a new one.

  This implies two responsibilities:
  1.  **We must decide.** Leaving the ambiguity open is not an option. The community needs a single rule to coordinate around.
  2.  **We must justify.** Since we are creating the fact rather than finding it, our justification must be based on utility and community benefit, not appeals to authority. We cannot say "this is correct because it was always true." We must say "this is correct because it serves the users best."

  **Action Items:**
  *   **Original Author:** Draft spec clarification for adjacent ranges by 24 October.
  *   **Committee:** Review clarification for semantic utility.
  *   **Contributor:** Invited to re-submit patch once suite and spec are updated.
