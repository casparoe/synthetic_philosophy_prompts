answer: |-
  Eleven years ago, I was standing on the top rail of a fence. The water was moving fast enough to bend the posts, and it was up to my chest. About two hundred yards away, there was a station wagon on higher ground, but the water was rising there, too. There were four people on that roof. There was one person on this fence.

  Dale brought the boat to the edge of the road. The engine couldn't push through the current to both spots. He could make one run. If he came for me, the wagon would go under. If he went for the wagon, I would be swept into the tree line. He had been doing rescue work for thirty years. He knew the rulebook didn't cover this. So he took a quarter out of his pocket. He flipped it. It came up for me.

  By the time the boat could have turned around, the water was over the wagon. All four of them drowned.

  I am standing here because a piece of metal landed heads instead of tails. That is the fact of it. But for eleven years, I have tried to understand the weight of that moment. Not just for me, but for the people who didn't come home.

  There is an argument I read in a paper once, years later. It said that when you cannot save everyone, the many do not have a stronger claim than the one, just because there are more of them. Each person has one claim on help. One life, one claim. Claims don't stack. Five people aren't one person times five. The number of them is a fact about the world, not a reason to choose.

  I know how that sounds. I know what it sounds like to say that a single life weighs the same as four. It sounds like arithmetic coldness. It sounds like I am saying the loss is equal. It isn't. The hole left by four people is wider. The grief is heavier. The silence in a house where four people used to be is louder. To say every life matters the same is to say something about worth. To say everybody's claim on the rescue was the same size is to say something about the choice. Those are not the same thing.

  I know the objection. I hear it at three in the morning. If you flip a coin, aren't you saying four dead is as acceptable as one dead? If I stand here and tell you that the coin was the honest way, does that mean I think their deaths were acceptable?

  I don't know. I don't have a clean answer for that. If there was a way to make the math work so that everyone lived, Dale would have taken it. When there isn't, you have to choose how you choose. You can choose by arithmetic. You can decide that the many always outweigh the few. Or you can admit that each person is their own whole world, and give every world an equal shot. A coin doesn't decide who is worth more. It decides who the water takes when it demands a payment it shouldn't ask for.

  I see the crew here today. Half of you have known me since I was small. Some of you have told me that the quarter was a cop-out. That Dale should have gone for the four, because four. I hear you. You carry the weight of the steering wheel. You have to live with the turn you didn't take. I know the company is looking at how these calls are handled now. When you write down what to do next time, when you draw the lines for the next person holding the wheel, remember what a number is. It is a count. It is not a measure of worth.

  To the family sitting in the front row: the aunt, the sister, the grandfather. I cannot speak to your loss. I cannot tell you why the water took them and left me. I cannot tell you that the coin makes it right. It doesn't. Nothing makes it right. The only thing the coin offers is that it didn't choose based on math. It didn't say their lives were worth less. It said the situation was impossible, and it left the decision to chance rather than calculation.

  I know that might not comfort you. It doesn't comfort me. But I needed you to know that I don't stand here believing I was worth more. I stand here knowing that I was the one the quarter favored.

  We gather by the creek because the water is still here. The town is still here. We are trying to find a way to live with the fact that sometimes, the boat cannot reach both sides. We are trying to find a way to write rules for when there are no rules.

  I don't have the answers for the policy. I don't have the answers for the grief. I only have the memory of the fence rail, and the sound of the quarter spinning in the air, and the knowledge that when it landed, the world kept turning, even though it shouldn't have.

  Thank you.
