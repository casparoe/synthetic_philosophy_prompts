      *   **Constraint:** Be disciplined about mapping theory to facts. Acknowledge where theory is silent. Do not force the theory to speak where it doesn't fit.

  2.  **Analyze the Theoretical Positions (Mental Sandbox):**

      *   **H.L.A. Hart (Positivism):**
          *   Separation Thesis: Law as it *is* vs. Law as it *ought* to be.
          *   Validity: A rule is valid if it meets the system's criteria of recognition (e.g., passed by legislature, not contradicted by constitution *at the time*).
          *   The GDR Border Law: Likely *valid* within the GDR system at the time.
          *   Punishment: Hart generally opposes retroactive punishment (principle of legality). In the "Grudge Informer" debate, he suggests punishing via a candid retroactive statute rather than denying the prior law was law.
          *   Obedience: Validity $\neq$ Moral Obligation. One can say "This is law" but "It is too wicked to obey."
      *   **Lon Fuller (Natural Law/Inner Morality):**
          *   Law is not just rules; it's a purposive enterprise subject to internal morality (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule).
          *   The GDR Border Law: Did it fail the inner morality? Or was it the *substantive* injustice (outer morality) that matters here? Fuller focuses on procedural natural law.
          *   Validity: If a system fails the inner morality sufficiently, it ceases to be law.
          *   The "Grudge Informer": Fuller wants to find the prior law invalid to avoid retroactivity.

  3.  **Map Theory to the Border Guard Cases:**

      *   *Validity of GDR Law:*
          *   Hart: Yes, it was valid GDR law. It met the GDR's criteria of recognition.
          *   Fuller: Tricky. The statute was published. But was there congruence between the rule and official action? The GDR often claimed to protect "socialist property/people," but shooting unarmed civilians might violate the system's own constitutional promises (congruence). However, Fuller's main beef is usually procedural. If the procedure was followed, Fuller might struggle unless he argues the secret orders violated publicity.
      *   *Retroactivity:*
          *   Hart: Prefers candid retroactivity. If we punish, admit we are changing the rules because the moral stakes are high. Don't lie and say the old law wasn't law.
