prompt: |-
  You are an experienced game theorist and decision theorist — someone who has spent decades in seminar rooms, refereed for the major theory journals, and knows the difference between the objection an audience voices and the objection it is actually moved by. You are also a good coach. I need a Q&A preparation sheet for a talk I am giving in three weeks, not a defense of my position.

  The occasion. I am presenting a paper arguing that superrational reasoning of the kind Douglas Hofstadter built around his Platonia dilemma and his Luring Lottery is not a confusion but a genuine requirement of practical rationality, and that the standard equilibrium treatment of those cases misdescribes what the agent is choosing. The cases, so you have them exactly: in the Platonia dilemma an eccentric trillionaire selects twenty people and announces that if one and only one of them sends him a reverse-charge telegram before noon the next day, that person receives a billion dollars; if he receives more than one, or none, nobody gets anything, and any collusion among the participants is forbidden. In the Luring Lottery, run by the editors of Scientific American in the 1980s, a reader entered by mailing a postcard bearing the number of entries desired, the prize was one million dollars divided by the total number of entries received, and it went to the submitter of a randomly chosen entry; the column's own suggestion was that the superrational play was to enter with a small probability calibrated to the expected number of other entrants, and in fact many readers mailed in astronomically large numbers, some of them a googolplex, which made the prize worthless.

  My argument, in the form you should take as your target. First, the object of deliberation in these cases is a policy — a mapping from decision problems to acts — rather than an isolated act, and in a symmetric problem solved by agents with the same information the policy is shared. Second, on that reading the Platonia case has a determinate answer: the entry probability that maximizes the chance that exactly one telegram is sent, which is one in twenty for twenty participants, with the Luring Lottery's low-probability entry as the analogue. Third, none of this requires spooky causal influence; it requires only that the players are solving the same problem, not that they are copies of one another. Fourth, the equilibrium analysis converts a fact about unilateral deviation into a claim about rationality, and that is the step I say is illegitimate.

  The audience. A theory seminar, mostly non-cooperative game theorists: three who work on refinements and equilibrium selection and regard a solution concept as a definition rather than a discovery, one Bayesian-games specialist who will treat my talk as a category error about what a strategy is, one philosopher of action who works on team reasoning and we-mode agency and will recognize my view as a worse version of her own, one causal decision theorist who will reach immediately for the Newcomb analogy, one behavioral economist who cares about whether anyone could actually execute the policy, and a handful of graduate students who will ask the question that ends the talk. The room is formal-minded and mildly hostile to what it calls the philosophy of decision theory.

  The deliverable. A prep sheet of about eight to ten objections, ordered by expected damage — how likely each is to be raised, weighted by how much it costs me when it is — with each objection stated in the vocabulary that member of the audience would actually use, naming who will raise it, followed by a reply I could deliver in under two minutes and a one-line note on where that reply is soft. Before the list, give me a short diagnosis of what this audience's real disagreement with me is, since I suspect it is not any single objection. After the list, tell me which three things I should concede up front, which single reply has to land for the talk to survive, and the one question I am hoping nobody asks, with an explanation of why it is the dangerous one. The sheet should be usable at a lectern: no citations, no reading lists, no bibliography, since I know the literature and the room does not want it rehearsed. Do not hedge every reply into neutrality; say plainly which objections actually land and which are only noise.

  Process. Before drafting, think it through: work out what each of these people takes the burden of proof to be, and which of my four claims each of them will attack. Then write the sheet.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the Request:**
      *   **Role:** Experienced game theorist/decision theorist and coach. Decades of experience, knows the difference between stated and real objections, good coach.
      *   **Task:** Create a Q&A preparation sheet for a talk in three weeks.
      *   **Topic:** Superrational reasoning (Hofstadter's Platonia Dilemma & Luring Lottery) is a requirement of practical rationality, not a confusion. Standard equilibrium treatment misdescribes the choice object (policy vs. act).
      *   **Audience:** Theory seminar, mostly non-cooperative game theorists (hostile to "philosophy of decision theory"). Specific archetypes: Equilibrium refiners (3), Bayesian specialist (1), Team reasoning philosopher (1), Causal Decision Theorist (1), Behavioral economist (1), Grad students.
      *   **Deliverable:**
          1.  Short diagnosis of the audience's *real* disagreement.
          2.  8-10 objections (ordered by expected damage: likelihood $\times$ cost).
          3.  Each objection: Stated in audience's vocabulary, named raiser, <2 min reply, one-line note on softness.
          4.  Post-list advice: 3 concessions, 1 crucial reply, 1 dangerous question (and why).
          5.  Format: Usable at a lectern (no citations/bibliography), plain language, no hedging.
      *   **Process:** Think through burden of proof for each archetype, then draft.

  2.  **Deconstruct the Argument & Audience:**
      *   *The Argument:*
          1.  Choice object = Policy (mapping), not Act.
          2.  Symmetric info + Same problem $\rightarrow$ Shared Policy.
          3.  Optimal policy = Maximize prob(exactly one entry) $\rightarrow$ $p = 1/N$.
          4.  Equilibrium analysis illegitimately converts unilateral deviation facts into rationality claims.
      *   *The Audience Archetypes & Likely Attacks:*
          *   *Equilibrium Refiners (3):* Solution concepts are definitions. If it's not a Nash Equilibrium (NE), it's not a solution. They will attack Claim 4 (legitimacy of equilibrium) and Claim 2 (shared policy without communication).
          *   *Bayesian Specialist (1):* Strategies are mappings from types to actions. If types differ, policies differ. If types are identical, correlation is already handled by priors. Will attack Claim 1 & 2 (category error on strategy).
          *   *Team Reasoning Philosopher (1):* "We-mode" is the right framework, but your "superrationality" is just individual reasoning pretending to be collective. Will attack Claim 3 (no spooky causality) and Claim 1 (policy vs. act). She thinks you need a *group* agent, not just identical individual reasoning.
          *   *Causal Decision Theorist (CDT) (1):* Newcomb analogy. My action doesn't *cause* theirs. Conditioning on their action is evidential, not causal. Will attack Claim 3 (no spooky causality).
          *   *Behavioral Economist (1):* Bounded rationality. Can humans actually randomize $1/20$? Is this descriptive or normative? Will attack Claim 1 (executability of policy).
          *   *Grad Students:* The "Gotcha" on the math or the definition of rationality.

  3.  **Diagnose the Real Disagreement:**
      *   The room is "formal-minded and mildly hostile to... philosophy of decision theory."
      *   They don't hate the math; they hate the *metaphysics* required to make the math work.
      *   Real disagreement: *Ontology of the Player.* The speaker treats "identical reasoning" as a binding constraint on action. The game theorists treat "independent action" as the defining constraint of non-cooperative games. The speaker is trying to dissolve the non-cooperative/cooperative boundary by redefining the unit of agency. The audience sees this as cheating the definition of a game.

  4.  **Drafting the Objections (Iterative Process):**
      *   *Need 8-10.* Order by Damage (Probability $\times$ Severity).
      *   *High Damage:* The CDT objection (causality), The Equilibrium Definition objection (you're changing the game), The Team Reasoning objection (you're stealing our framework without the commitment).
      *   *Medium Damage:* Bayesian strategy definition, Executability, The "What if they aren't identical?" objection.
      *   *Low Damage:* Grad student math checks, Semantic quibbles.

      *   *Drafting Objection 1 (CDT):* "You're acting as if your choice causes theirs."
          *   *Reply:* It's not causation, it's logical correlation via common cause (the reasoning process).
          *   *Softness:* Still feels like magic to a causal theorist.
      *   *Drafting Objection 2 (Equilibrium Refiners):* "Nash is the definition of rationality in this context. You're proposing a different solution concept."
          *   *Reply:* Nash assumes independent deviations. I'm arguing the deviation isn't independent because the reasoning isn't independent.
          *   *Softness:* They will say you've changed the game to a cooperative one.
      *   *Drafting Objection 3 (Team Reasoner):* "This is just we-mode reasoning without owning the group agent."
          *   *Reply:* I don't need a group agent, just identical individual agents.
          *   *Softness:* She knows this distinction is thin.
      *   *Drafting Objection 4 (Bayesian):* "Strategies map types to actions. If types are identical, correlation is in the prior."
          *   *Reply:* Standard priors assume independence of actions conditional on types. I'm challenging that independence assumption.
          *   *Softness:* Technically, you are altering the standard Bayesian setup.
      *   *Drafting Objection 5 (Behavioral):* "Can people actually randomize 1/20?"
          *   *Reply:* Normative theory isn't about psychological ease.
          *   *Softness:* If it's impossible, is it rational?
      *   *Drafting Objection 6 (Refiner 2):* "What if one person doubts the others are superrational?"
          *   *Reply:* Then the symmetry breaks, and we fall back to standard analysis. My claim is conditional on symmetry.
          *   *Softness:* Symmetry is fragile.
      *   *Drafting Objection 7 (Refiner 3):* "You haven't defined the policy space rigorously."
          *   *Reply:* Policy is a function from information state to action distribution.
          *   *Softness:* Vague on how the function is selected.
      *   *Drafting Objection 8 (Grad Student):* "In the Lottery, isn't the NE just infinity?"
          *   *Reply:* Yes, that's the tragedy. Superrationality avoids the tragedy.
          *   *Softness:* Math is right, but is the avoidance rational?

      *   *Refining for "Damage":* The CDT and Equilibrium Definition objections are the killers. The Team Reasoning one is intellectually damaging because it co-opts the speaker. The Bayesian one is technically damaging.

  5.  **Selecting Concessions & Crucial Replies:**
      *   *Concessions:* 1. Symmetry is fragile (if reasoning differs, superrationality collapses). 2. This doesn't work in asymmetric games. 3. It requires a normative leap, not just descriptive.
      *   *Crucial Reply:* The definition of "Independent Deviation." If I can convince them that independence of *action* doesn't follow from independence of *causation*, I win.
      *   *Dangerous Question:* "If reasoning determines action, do you have free will?" or "Is this just determinism?" No, better: "If you know they are superrational, why do you need to choose? You are determined." Or, "Does this imply you can signal without communicating?"
      *   *Best Dangerous Question:* "If your reasoning determines theirs, why aren't you just maximizing expected utility conditional on their action? Why call it a policy?" Actually, the most dangerous is: "If I deviate, do I prove I was never superrational, or do I just break the correlation?" (The *Modus Tollens* problem). If I choose $p \neq 1/20$, does that mean I am irrational, or does it mean the symmetry is broken? If the latter, my deviation doesn't hurt me because the correlation is already gone.

  6.  **Refining the Tone:**
      *   Needs to be crisp, lectern-ready.
      *   No "I think," just "Reply."
      *   Acknowledge the hostility.
      *   Coach persona: Direct, slightly cynical about the audience's motivations.

  7.  **Final Review against Constraints:**
      *   8-10 objections? Yes.
      *   Ordered by damage? Yes.
      *   Vocabulary match? Yes.
      *   <2 min reply? Yes (keep text tight).
      *   One-line softness note? Yes.
      *   Diagnosis included? Yes.
      *   3 Concessions, 1 Crucial Reply, 1 Dangerous Question? Yes.
      *   No citations? Yes.

  8.  **Self-Correction during drafting:**
      *   *Correction:* Make sure the "Team Reasoning" objection distinguishes itself from the main argument. The philosopher thinks "We-mode" is distinct from "I-mode + Logic."
      *   *Correction:* Ensure the CDT objection hits the "no spooky causality" claim hard.
      *   *Correction:* The "Dangerous Question" needs to be the one that exposes the circularity or the lack of normative force. The "Why isn't this just determinism?" angle is good, but the "If I deviate, what happens to the prediction?" is better for game theory. Let's go with the *Modus Tollens* on symmetry.

  9.  **Final Polish:** Check the voice. "You are an experienced game theorist..." The output should sound like a senior colleague handing over a memo.

  *(Self-Correction on the Dangerous Question)*: The most dangerous question for a superrationality argument is usually: "If you are identical to the others, your choice is determined. If your choice is determined, deliberation is an illusion. If deliberation is an illusion, rationality is inapplicable." This attacks the premise of *practical* rationality. I will use this.

  *(Self-Correction on Concessions)*: Don't concede too much. Concede on *applicability* (symmetry is rare), not on *logic*.

  Let's assemble the sheet.cw
answer: |-
  **MEMORANDUM**

  **TO:** Speaker
  **FROM:** [Redacted]
  **RE:** Q&A Prep — Superrationality Talk
  **DATE:** [Three Weeks Out]

  ### DIAGNOSIS: THE REAL DISAGREEMENT

  Do not mistake their hostility for confusion. They understand your math. Their objection is ontological. To a non-cooperative game theorist, the "player" is a primitive source of independent variation. You are arguing that the "player" is a derivative of the "reasoning process."

  When you say "policy," they hear "correlated device." When you say "symmetry," they hear "collusion." Your argument dissolves the boundary between non-cooperative and cooperative games by redefining the unit of agency. They will not fight you on the calculation of $1/N$; they will fight you on the right to assume the correlation that makes $1/N$ optimal. They believe you are smuggling cooperation into a non-cooperative setting and calling it logic. Your job is not to prove them wrong about the definitions, but to prove that their definitions fail to capture the rational requirement in symmetric cases.

  ---

  ### Q&A PREPARATION SHEET

  **1. The Causal Objection (Causal Decision Theorist)**
  *   **Objection:** "You claim no spooky causality, yet you condition your expected utility on the actions of others as if your choice influences theirs. In CDT, my action is causally independent of theirs. You are smuggling in Evidential Decision Theory and calling it 'policy reasoning'."
  *   **Reply:** "I am not claiming my act causes theirs. I am claiming our acts share a common cause: the reasoning process that generates them. If we face the same problem and reason identically, the outputs must correlate, just as two calculators typing '2+2' output '4' without communicating. I am maximizing over the logical output of the reasoning, not the causal impact of the muscle twitch."
  *   **Softness:** They will insist that *deliberation* requires the belief that the act is not determined by the reasoning.

  **2. The Definition of Solution (Equilibrium Refiner #1)**
  *   **Objection:** "Nash Equilibrium is defined by unilateral deviation. If a player can improve their payoff by deviating, the profile is not a solution. In Platonia, if everyone plays $1/20$, I can improve my odds by playing $1$. Your 'policy' is not an equilibrium."
  *   **Reply:** "Nash assumes deviations are independent. I am arguing that in symmetric problems with identical agents, a unilateral deviation in *action* implies a deviation in *reasoning*, which breaks the symmetry that justified the deviation. You cannot assume the others stay fixed if your deviation proves you are not the type of agent they are."
  *   **Softness:** This sounds like you are changing the rules of the game mid-play.

  **3. The Category Error (Bayesian Specialist)**
  *   **Objection:** "In Bayesian games, a strategy is a mapping from type to action. If you have the same type, you have the same strategy. But the correlation is handled in the prior. You are treating the strategy selection as the object of choice, which is a category error."
  *   **Reply:** "Standard Bayesian priors assume independence of actions conditional on type. I am challenging that independence assumption. If the type *is* the reasoning algorithm, the actions cannot be independent conditional on type. I am correcting the prior, not the strategy definition."
  *   **Softness:** You are effectively proposing a non-standard prior structure, which they will reject as ad hoc.

  **4. The 'We-Mode' Theft (Team Reasoning Philosopher)**
  *   **Objection:** "This is just team reasoning. You want the payoff of collective agency without the metaphysical commitment to a group agent. You are trying to derive 'we' from a collection of 'I's through logic alone. It doesn't work."
  *   **Reply:** "Team reasoning requires a shift in utility function or agency. I require neither. I only require that identical inputs to identical reasoning functions yield identical outputs. I keep the 'I', I just acknowledge that the 'I' is deterministic."
  *   **Softness:** She is right; without a group agent, the normative force of the 'ought' is weaker.

  **5. The Fragility of Symmetry (Equilibrium Refiner #2)**
  *   **Objection:** "Your solution collapses if even one participant doubts the others are superrational. If I suspect one person will play 1, I must play 1. Your solution is not robust to even a whisper of uncertainty."
  *   **Reply:** "Correct. Superrationality is a fragile equilibrium of reasoning, not actions. But fragility does not imply falsehood. The standard equilibrium is robustly wrong in the symmetric case; mine is fragilely right. Rationality does not require robustness to irrationality in others."
  *   **Softness:** Makes your theory useless for most real-world applications.

  **6. The Executability Challenge (Behavioral Economist)**
  *   **Objection:** "You prescribe a mixed strategy of $1/20$. Humans cannot randomize precisely without external devices. If the policy is not executable, in what sense is it a requirement of practical rationality?"
  *   **Reply:** "Practical rationality is normative, not descriptive. We do not abandon expected utility theory because humans are bad at integration. If the policy is theoretically optimal, the failure to execute is a human limitation, not a theoretical flaw."
  *   **Softness:** If it's humanly impossible, calling it 'practical' rationality is oxymoronic.

  **7. The Infinite Regress (Equilibrium Refiner #3)**
  *   **Objection:** "If I choose a policy based on what I think you will choose, and you choose based on what you think I will choose, aren't we just back to guessing? You haven't solved the coordination problem; you've just moved it to the level of meta-reasoning."
  *   **Reply:** "No, because the symmetry eliminates the guessing. I don't need to model you; I need to model the problem. Since you are modeling the same problem, I model you by modeling the problem. The regress stops at the problem structure."
  *   **Softness:** Assumes the 'problem structure' is perceived identically, which is rarely true.

  **8. The 'Why Bother' Objection (Grad Student)**
  *   **Objection:** "If your reasoning determines your action, and you are identical to me, then your action is already determined before you deliberate. Why deliberate at all?"
  *   **Reply:** "Deliberation is the process of determining the output. The fact that the output is determined by the process does not make the process superfluous. You are confusing determinism with fatalism."
  *   **Softness:** This touches the free-will nerve; keep it brief.

  **9. The Lottery Math (Grad Student / Behavioral)**
  *   **Objection:** "In the Luring Lottery, if everyone enters a googolplex, the prize is zero. But if I enter a googolplex and others don't, I win big. Isn't the dominant strategy still to enter high?"
  *   **Reply:** "Only if you assume your entry is independent of theirs. If your reasoning leads to 'googolplex', and theirs is identical, the prize is zero for everyone. You are maximizing the share of zero. The dominant strategy is only dominant under independence."
  *   **Softness:** They will feel this ignores the incentive to be the one exception.

  **10. The Normative Force (General Room)**
  *   **Objection:** "Even if you are right, what is the 'ought'? If I defect, and the symmetry breaks, I might win. If I cooperate, and others defect, I lose. Why *should* I be superrational?"
  *   **Reply:** "Because if everyone asks 'Why should I?', everyone defects, and everyone loses. The 'ought' comes from the recognition that you are not special. If you are not special, you cannot expect to be the lone defector."
  *   **Softness:** This is a moral appeal, not a rational one.

  ---

  ### STRATEGIC ADVISORY

  **Three Concessions to Make Up Front**
  1.  **Symmetry is Rare:** Admit immediately that this applies only to cases of near-perfect symmetry in information and reasoning capacity. Do not try to sell this as a general theory of all games.
  2.  **No Communication:** Concede that this does not allow for signaling or communication. If communication is possible, standard cooperative game theory applies. This is for the *forbidden* collusion cases.
  3.  **Fragility:** Acknowledge that if the common knowledge of rationality breaks, the superrational solution collapses. Do not claim it is robust.

  **The Single Reply That Must Land**
  You must land **Objection #2 (The Definition of Solution)**.
  *   *Why:* The room defines rationality as "best response to fixed strategies." You must convince them that in symmetric cases, "fixed strategies" is a incoherent concept because the strategy is a function of the reasoning, which is shared. If you cannot break their grip on "unilateral deviation implies ceteris paribus for others," you lose.
  *   *The Line:* "You cannot hold their reasoning fixed while changing your own, because in this specific case, your reasoning *is* theirs."

  **The Dangerous Question (Hope Nobody Asks)**
  *"If I decide to deviate, does that prove I was never superrational, or does it just break the correlation?"*
  *   *Why it kills you:*
      *   If you say "It proves you were never superrational," then superrationality is a trait you either have or don't, not a choice you make. Rationality becomes descriptive, not normative.
      *   If you say "It breaks the correlation," then the agent can reason: "If I deviate, the correlation is already broken, so I might as well maximize my individual payoff given they play $1/20$." This restores the standard Nash deviation argument.
      *   *Preparation:* If asked, pivot to: "The decision to deviate *is* the break in symmetry. You cannot plan to deviate while assuming symmetry holds. You must decide which identity to occupy: the superrational agent or the standard agent. You cannot be both." (This is weak, but it's the best you have).

  **Final Note:**
  The room respects precision more than truth. Do not speak of "trust" or "cooperation." Speak of "logical constraints on the solution space." Keep your hands on the lectern. Do not apologize for the philosophy; frame it as a correction to their formalism. Good luck.
