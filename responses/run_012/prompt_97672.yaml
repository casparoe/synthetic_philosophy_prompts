answer: |-
  Here is a complete lesson plan designed for a 90-minute upper-level seminar. It separates the **Representational Argument** (vNM/Independence focus) from the **Pragmatic Argument** (Money Pump/Transitivity focus) through distinct experiential phases.

  ## Activity Title: "The Agent's Burden"

  ### Learning Objectives
  1.  **Experiential:** Students will experience the algebraic frustration of trying to quantify incoherent preferences (Part 1) and the material loss of acting on cyclical preferences (Part 2).
  2.  **Conceptual:** Distinguish between *ininterpretability* (no function fits) and *exploitability* (resources lost).
  3.  **Critical:** Identify the hidden behavioral assumptions (myopia/sequentiality) required for the pragmatic argument to hold.

  ### Materials Needed
  *   **Handout A:** "The Valuation Task" (Part 1 Lotteries & Worksheet).
  *   **Handout B:** "The Attribute Card" (Part 3 Options).
  *   **Handout C:** "Broker's Script & Ledger" (For the student broker).
  *   **Currency:** 100 physical tokens (poker chips, laminated cards, or candy wrappers).
  *   **Prize:** One \$20 coffee card (or equivalent) raffled at the end based on token count.
  *   **Whiteboard:** For the debrief.

  ---

  ### Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Intro** | Setup, token distribution, stakes explanation. |
  | 10–40 | **Part 1** | **Representational Failure:** Allais Lotteries & Utility Assignment. |
  | 40–70 | **Part 2** | **Pragmatic Failure:** The Broker & The Money Pump. |
  | 70–90 | **Debrief** | Distinguishing arguments, limitations, and completeness. |

  ---

  ### Part 1: The Representational Failure (30 mins)
  **Goal:** Demonstrate that violating Independence makes it impossible to assign utilities that preserve the ranking.

  **1. The Setup (5 mins)**
  Distribute **Handout A**. Give students 5 tokens each (these are safe for now). Explain that EU theory claims if they are rational, their choices can be modeled as $EU = \sum p_i u(x_i)$.

  **2. The Task (15 mins)**
  Students privately rank four lotteries involving three outcomes: \$0, \$1 Million, \$5 Million.
  *   **$L_1$:** 100% chance of \$1M.
  *   **$L_2$:** 10% \$5M, 89% \$1M, 1% \$0.
  *   **$L_3$:** 11% \$1M, 89% \$0.
  *   **$L_4$:** 10% \$5M, 90% \$0.

  *Instruction:* "Most people prefer $L_1 \succ L_2$ and $L_4 \succ L_3$. If you have this preference pattern, proceed to the worksheet. If not, swap your rankings to match this pattern for the sake of the exercise—we are testing the *structure*, not your personal risk aversion."

  **3. The Algebraic Trap (10 mins)**
  The worksheet asks them to assign utility values $u(0)$, $u(1)$, $u(5)$ (normalized so $u(0)=0, u(5)=1$) that satisfy their rankings.
  *   Inequality 1 ($L_1 \succ L_2$): $u(1) > 0.1u(5) + 0.89u(1) + 0.01u(0)$
  *   Inequality 2 ($L_4 \succ L_3$): $0.1u(5) + 0.9u(0) > 0.11u(1) + 0.89u(0)$

  *The Reveal:* Ask students to solve for $u(1)$.
  *   From (1): $0.11u(1) > 0.1u(5) \rightarrow 0.11u(1) > 0.1$
  *   From (2): $0.1u(5) > 0.11u(1) \rightarrow 0.1 > 0.11u(1)$
  *   **Contradiction:** $0.11u(1)$ cannot be both greater than and less than $0.1$.

  **Instructor Note:** Do not name the "Independence Axiom" yet. Just highlight the frustration: "You cannot write down a consistent number for \$1M that respects both your choices."

  ---

  ### Part 2: The Pragmatic Failure (30 mins)
  **Goal:** Demonstrate that violating Transitivity allows resource drainage *if* choices are sequential.

  **1. The Setup (5 mins)**
  Collect Handout A. Distribute **Handout B** (Three Options defined by 3 attributes).
  *   **Option A:** Safety: 8, Speed: 4, Cost: 6
  *   **Option B:** Safety: 6, Speed: 8, Cost: 4
  *   **Option C:** Safety: 4, Speed: 6, Cost: 8
  *(Scale 1-10, higher is better)*

  *Instruction:* "Compare these pairwise. Which is better? A or B? B or C? C or A? Use your intuition. Do not calculate a total score."
  *Most students using a 'majority of attributes' heuristic will generate a cycle: $A \succ B$ (wins Safety, Cost), $B \succ C$ (wins Safety, Speed), $C \succ A$ (wins Speed, Cost).*

  **2. The Broker (20 mins)**
  Select one student to be the **Broker**. Give them **Handout C** and a bag of tokens.
  *   **Broker's Goal:** Drain tokens from students who hold cyclical preferences.
  *   **Rule:** The Broker approaches students one by one. The Broker *cannot* reveal future trades. The Broker *must* follow the script.
  *   **Student's Endowment:** Each student starts holding **Option A** and **5 Tokens**.
  *   **Trade Cost:** Every swap costs **1 Token**.

  **Broker Script (Handout C):**
  1.  Approach Student. "You hold Option A. I hold Option C. You previously indicated C is better than A (on Speed/Cost). Want to swap? Cost: 1 Token."
      *   *If Yes:* Student now holds C. Tokens -1.
      *   *If No:* Stop.
  2.  (If they hold C): "You hold Option C. I hold Option B. You indicated B is better than C (on Safety/Speed). Want to swap? Cost: 1 Token."
      *   *If Yes:* Student now holds B. Tokens -1.
      *   *If No:* Stop.
  3.  (If they hold B): "You hold Option B. I hold Option A. You indicated A is better than B (on Safety/Cost). Want to swap? Cost: 1 Token."
      *   *If Yes:* Student now holds A. Tokens -1.
      *   *If No:* Stop.

  **3. The Count (5 mins)**
  Students count remaining tokens. Those who completed the cycle are back at Option A but have 2 or 3 fewer tokens.
  *   **Stakes:** Announce that tokens are raffle tickets for the \$20 prize. The loss is real.

  ---

  ### Part 3: The Debrief (20 mins)
  **Goal:** Separate the arguments and identify limitations.

  **1. Distinguishing the Arguments (10 mins)**
  Draw two columns on the board: **Representation** vs. **Pragmatics**.

  *   **Ask Part 1 Students:** "Did you lose tokens in the first half?" (No). "What went wrong?" (The math broke).
      *   *Conclusion:* Incoherence (Independence violation) means you **cannot be modeled** as an EU maximizer. It is a failure of *interpretability*.
  *   **Ask Part 2 Students:** "Could you have assigned numbers to A, B, C?" (No, not if they cycle). "But what actually hurt?" (Losing tokens).
      *   *Conclusion:* Incoherence (Transitivity violation) means you **can be exploited**. It is a failure of *security*.

  *   **Key Point:** You can be un-modelable (Part 1) without necessarily being pumpable *in that specific instance* (unless the violation creates a cycle). But if you are pumpable (Part 2), you are definitely un-modelable. The pragmatic argument is stronger emotionally but relies on more assumptions.

  **2. The Sequentiality Condition (5 mins)**
  *   **Ask:** "Why did the Broker succeed?"
  *   **Answer:** Because you looked at the trade *in isolation*.
  *   **Critical Question:** "If I told you at the start: 'I will offer you a cycle of 3 trades that returns you to A but costs 3 tokens,' would you have traded?"
  *   **Consensus:** No.
  *   **Instructor Point:** The Money Pump argument does not prove incoherence is irrational *per se*. It proves incoherence + **Myopia** (lack of foresight) is costly. If you are incoherent but farsighted, you refuse the first trade. The pragmatic argument smuggles in a behavioral assumption about how agents process sequences.

  **3. Limitations & Completeness (5 mins)**
  *   **Ask:** "Did we test *all* your preferences?"
  *   **Answer:** No, just these specific lotteries/options.
  *   **Instructor Point:** This is the **Completeness Axiom** limitation. In the classroom, we assume you have a preference for the menu provided. In reality, coherence requires a preference for *every* conceivable lottery. We cannot test that.
  *   **Also:** We assumed the "Attributes" in Part 2 were the only things that mattered. Real agents might have a hidden tie-breaker (e.g., "I like the letter A") that resolves the cycle. The activity forces a cycle by restricting the description.

  ---

  ### Instructor Materials

  #### Handout A: The Valuation Task
  **Outcomes:** \$0, \$1M, \$5M.
  **Normalize:** Set $u(\$0) = 0$ and $u(\$5M) = 1$.
  **Your Task:** Find a value for $u(\$1M)$ (between 0 and 1) that makes your preferences consistent.

  1.  **Preference:** $L_1 \succ L_2$
      *   $1.0 \times u(1M) > 0.10(1) + 0.89 \times u(1M) + 0.01(0)$
      *   Simplify: $0.11 \times u(1M) > 0.10$
      *   So, $u(1M) >$ \_\_\_\_\_\_

  2.  **Preference:** $L_4 \succ L_3$
      *   $0.10(1) + 0.90(0) > 0.11 \times u(1M) + 0.89(0)$
      *   Simplify: $0.10 > 0.11 \times u(1M)$
      *   So, $u(1M) <$ \_\_\_\_\_\_

  **Result:** Can you fill in the blanks?

  #### Handout B: The Attribute Card
  *Keep this hidden from the Broker.*
  **Option A:** Safety [8] | Speed [4] | Cost [6]
  **Option B:** Safety [6] | Speed [8] | Cost [4]
  **Option C:** Safety [4] | Speed [6] | Cost [8]
  *Instructions:* Compare pairwise. Mark which you prefer.
  [ ] A is better than B
  [ ] B is better than C
  [ ] C is better than A

  #### Handout C: Broker's Script
  *Confidential. Do not show students.*
  **Your Role:** You are a neutral market maker. You do not judge; you execute.
  **Your Inventory:** You have copies of Options A, B, and C.
  **The Rule:** You may only offer one trade at a time. You cannot tell the student what the next trade will be.
  **The Script:**
  1.  Check what the student holds.
  2.  If they hold **A**: Offer **C**. Say: "I can swap your A for C. It improves your Speed and Cost. Fee: 1 Token."
  3.  If they hold **C**: Offer **B**. Say: "I can swap your C for B. It improves your Safety and Speed. Fee: 1 Token."
  4.  If they hold **B**: Offer **A**. Say: "I can swap your B for A. It improves your Safety and Cost. Fee: 1 Token."
  5.  Record how many tokens they lost.

  ---

  ### Predictable Failures & Mitigation

  1.  **The "I Quit" Problem (Part 1):**
      *   *Risk:* Students realize the math is impossible and stop trying, disengaging.
      *   *Mitigation:* Frame it as a "Bug Hunt." Tell them: "There is a bug in the system. Your job is to find exactly where the equation breaks." This gamifies the contradiction.

  2.  **The "Farsighted" Student (Part 2):**
      *   *Risk:* A student suspects a pump and refuses the first trade. The Broker looks ineffective.
      *   *Mitigation:* This is actually a *teaching moment*. In the debrief, highlight this student. "Why did they survive? Not because they were coherent, but because they were suspicious." This reinforces the Sequentiality limitation.
      *   *Fix:* Instruct the Broker to emphasize the *immediate* gain. "Look, you strictly prefer C to A on two attributes. Why leave value on the table?"

  3.  **The "Hidden Tie-Breaker" (Part 2):**
      *   *Risk:* A student says "I prefer A because it's first on the list," breaking the cycle.
      *   *Mitigation:* In the instructions, explicitly say: "Ignore the order of the list. Judge only on the attributes provided."

  4.  **Broker Confusion:**
      *   *Risk:* The student broker forgets the script or feels awkward charging friends.
      *   *Mitigation:* Give the Broker a physical "Ledger" to stamp. Make the token exchange physical (handing over a chip). This ritualizes the loss.

  ### Limitations You Must Supply (The "Completeness" Gap)
  The activity cannot reproduce the **Completeness Axiom** ($\forall A, B: A \succeq B \lor B \succeq A$).
  *   **Why:** In the classroom, you present a finite menu. Students are forced to choose or rank *those* items. They are not presented with the infinite set of all possible probability distributions over outcomes.
  *   **What to say in Debrief:** "Today, I forced you to have an opinion on A, B, and C. Coherence theory demands you have an opinion on *everything*, even lotteries you haven't imagined. We cannot test that here. We are testing *local* coherence, not *global* coherence."

  ### Why This Works for Grad Students
  Philosophy grad students often treat coherence arguments as abstract normative claims. This activity shifts the locus to **agency**.
  1.  **Part 1** attacks their identity as *interpretable agents* (The "Representation" hit).
  2.  **Part 2** attacks their identity as *successful agents* (The "Pragmatic" hit).
  3.  **The Debrief** allows them to recover by critiquing the *conditions* of the pump (sequentiality), which validates their intuition that seeing the whole cycle changes the normativity, without abandoning the core logic of EU theory.
