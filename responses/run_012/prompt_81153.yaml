answer: |-
  Here is your list ranked by how much damage they do to the "Knowledge-How is just Knowledge-That" (Intellectualist) position.

  **The Scale:** 10 is a nightmare for the "facts" side (strongest case for distinct practical knowledge); 1 is trivial for them (purely propositional).

  ### The Rankings

  **10. Reading a room well enough to land a joke on one specific person at a party**
  This requires infinite contextual variables (mood, history, tone) that cannot be codified into static truths without losing the very nuance that makes the skill work.

  **9. Improvising a solo over chord changes you've never seen before**
  This is generative rather than reproductive; you are creating new truth in real-time based on feel, not retrieving stored data from a database.

  **8. Getting a two-year-old to fall asleep**
  Like the party joke, this is a negotiation with a chaotic agent where the "rules" change nightly based on variables you can't observe, let alone articulate.

  **7. Riding a bike**
  The classic Rylean example; balance is a dynamic equilibrium maintained by unconscious micro-corrections that happen too fast for propositional retrieval.

  **6. Flipping a pancake at the right moment, based on the bubbles and the sound the batter's making**
  This relies on multi-sensory integration (audio/visual) where the "data" is fleeting and analog, resisting digital "if-then" formatting.

  **5. Catching a fly ball in the outfield**
  Fielders use optical acceleration cancellation (a physics strategy), but they do not know the physics *as facts*; they embody the solution without the theory.

  **4. Swimming**
  While rhythmic, this is largely about overcoming instinctual panic with embodied coordination, which is harder to reduce to rules than simple mechanics.

  **3. Tying a bowline**
  This is the bridge case; you *can* fully describe a bowline in words ("the rabbit comes out of the hole..."), making it easy for the facts side to claim victory here.

  **2. Doing 47 x 83 in your head**
  This follows a strict, universal algorithm; the "know-how" is simply possessing the rules of arithmetic and the working memory to execute them.

  **1. Reciting the first 50 digits of pi**
  This is pure memory retrieval; there is zero practical skill involved beyond rote memorization of static propositions.

  ***

  ### The Top Tier: The Intellectualist's Last Stand

  **The Case:** *Reading a room to land a joke (10).*

  **The Strongest Counter-Argument:**
  The Intellectualist (following philosophers like Jason Stanley) will argue that you *do* possess a proposition, such as *"Now is the appropriate time for this specific humor with this specific person,"* but you grasp this truth under a **"practical mode of presentation."** They claim the knowledge is factual, but the *way* you access it is non-linguistic and immediate.

  **The Cost:**
  To make this work, they have to stretch the definition of "proposition" until it snaps. If a fleeting, emotional, context-dependent intuition counts as "grasping a truth," then the word "truth" no longer means something verifiable or statable—it just means "whatever the brain does to succeed." If they win this point, they win the debate only by making "factual knowledge" synonymous with "successful behavior," which empties the word *fact* of all meaning.

  ***

  ### The Heavy Lifter
  While **Riding a Bike** carries the historical weight (it's the example Gilbert Ryle used in 1949), **Reading a Room** is the stronger philosophical wedge. Motor skills can be dismissed by opponents as "mere reflex" or "sub-cognitive processing," but social intelligence involves high-level reasoning, theory of mind, and creativity. If you can prove that *social* know-how isn't factual, you prove that even our highest human reasoning isn't just data processing.

  ### The Stakes
  "If we reduce all skill to data, we risk building an intelligence that can recite the world but never actually touch it."
