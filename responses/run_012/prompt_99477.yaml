  Hey, I'm making a handout for a grad seminar on know-how and I want a decision tree that sorts people by where they actually land on the question of whether knowing how to do something is just a kind of knowing that something is the case. I dont want it to be a list of names with slogans attached — build it out of the logical space first: every branch node should be a question someone can answer without already knowing which view it commits them to, and the leaves are where their answers land them. The distinctions I care about are (a) whether "knows how" ascribes a propositional attitude at all; (b) if there's an object, whether it's a proposition (something like "this is a way for me to do it"), a way or method itself, or nothing you could believe; (c) whether knowing how has to bring the ability with it, i.e. can you know how and still not be able to do it, or botch it when you try; and (d) whether know-how comes in degrees. Please make sure the leaves include the Ryle-style "it's an ability or disposition, not a belief" view, the Stanley-and-Williamson-style intellectualism, the view that know-how is a knowledge relation to a way rather than to a proposition, and a deflationary line where "knows how" is just a loose façon de parler about skill. Where the space leaves a combination unoccupied — propositional but with no ability requirement, say, or an ability view that's gradable — note it and give me your best guess whether it's empty because it's incoherent, because it's unattractive, or just because nobody's bothered. And flag any leaves the tree genuinely can't separate rather than papering over it.

  I want you to be clear about which parts of this are settled and which are still fought over by people who work on it — don't present a live disagreement as if it were the consensus. Format it in four sections, in this order: "The tree", with the branch questions in order and the leaves named (350–450 words); "Empty slots", the unoccupied combinations and your diagnosis of each (about 150 words); "Leaves the tree can't separate" (about 100 words); and "Settled vs contested", saying what a specialist would agree on and what's still up for grabs (about 100 words).
