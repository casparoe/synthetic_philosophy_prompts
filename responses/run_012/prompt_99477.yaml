  ### The tree

  Begin at the root with semantic ontology. Question 1: Does the phrase "knows how to $\phi$" ascribe a relation to a truth-evaluable content? This question is neutral regarding intellectualism; it asks only about semantic structure. If you answer No, proceed to Question 2A: Is the state purely a behavioral disposition, or a relation to a non-propositional entity? Answering "purely disposition" lands you at Rylean Anti-Intellectualism: know-how is an ability, not a belief-like state. This view denies any cognitive object, treating success conditions as dispositional. Answering "relation to entity" lands you at the Non-Propositional Object View: one knows a way or method directly, without mediating propositions. This preserves a relational structure without intellectualizing the content. If you answer Yes to Question 1, proceed to Question 2B: Does holding this propositional attitude entail the ability to successfully $\phi$? Answering No lands you at Standard Intellectualism (e.g., Stanley & Williamson). Here, one can possess the knowledge (the proposition that $w$ is a way to $\phi$) even if paralysis prevents action. The knowledge is distinct from the capacity. Answering Yes lands you at Ability-Entailing Intellectualism, a hybrid view maintaining propositional content but requiring successful capacity. This view argues that knowing the proposition is insufficient without the power to execute. From any of these positions, proceed to Question 3: Is the state binary or gradable? Standard epistemology treats knowledge as binary; answering "binary" keeps you in the traditional leaves above. Answering "gradable" suggests know-how varies in degree like skill. This leads to the Deflationary View if you argue "knows how" is merely loose façon de parler for varying skill levels, lacking a unified epistemic analysis. Deflationists claim the term masks diverse phenomena rather than naming a single state. However, combining gradability with propositional attitudes creates an unoccupied slot: Gradable Intellectualism. Similarly, Gradable Anti-Intellectualism is possible but rare. The tree thus sorts views by content type (propositional vs. non-propositional vs. none), modal force (ability-entailing vs. non-entailing), and granularity (binary vs. gradable). This structure avoids presupposing intellectualism is correct by asking about truth-aptness first. It isolates the Rylean view by denying the relational structure entirely. It isolates Standard Intellectualism by affirming propositions but denying ability entailment. It captures Deflationism by questioning the semantic precision of the term itself. Each path represents a coherent logical possibility, whether currently defended or not. The leaves represent stable theoretical endpoints where further questioning yields diminishing returns without changing the core metaphysical commitment. Crucially, answering these questions requires no prior commitment to specific authors, only intuitions about language and ability.

  ### Empty slots

  The most glaring empty slot is Gradable Intellectualism. While Standard Intellectualism posits propositional knowledge, it typically treats knowledge as binary. Combining propositional content with gradability is logically possible but rarely defended, likely because it complicates the truth-conditions of knowledge ascriptions without clear payoff. Another gap is Ability-Entailing Intellectualism with a Non-Propositional Object. This view would claim one knows a way directly and must be able to use it. It is unoccupied perhaps because it collapses into Ryleanism; if the object isn't propositional and ability is required, the distinction between knowing a way and having the ability becomes obscure. Finally, Propositional Attitude without Ability Entailment but with No Object is strictly incoherent; a relation requires a relatum. This slot is empty due to logical inconsistency rather than theoretical unattractiveness. Most empty slots arise because views converge on existing leaves; distinct combinations often yield indistinguishable practical predictions, making the extra metaphysical baggage unattractive to theorists seeking parsimony.

  ### Leaves the tree can't separate

  Separating Ability-Entailing Intellectualism from Rylean Anti-Intellectualism is difficult. Both require the ability to $\phi$ for true ascriptions of "knows how." Difference lies in whether a propositional attitude accompanies the ability. Since behavioral evidence is identical, separation is impossible; the dispute is purely metaphysical. Similarly, Non-Propositional Object views and Deflationism may overlap if "ways" are not robust entities. If ways are merely heuristic constructs for skills, the Non-Propositional view collapses into Deflationism. Ontologically distinct, but without independent access to "ways," the leaves remain equivalent.

  ### Settled vs contested

  Specialists agree that "knows how" is context-sensitive and ability is usually relevant. Consensus holds that pure behaviorism is insufficient; some cognitive state is involved. However, the nature of that state is fiercely contested. Whether the content is propositional remains the primary battleground, with Intellectualism facing renewed anti-intellectualist challenges. The ability entailment question is also live; some argue paralysis negates know-how, others deny this. Gradability is increasingly contested, with traditional binary models challenged by skill-based accounts. No consensus exists on whether know-how is a unified natural kind or a heterogeneous collection of skills.
