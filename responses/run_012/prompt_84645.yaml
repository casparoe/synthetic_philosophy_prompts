answer: |-
  **Session Title:** The Colony Mind
  **Participants:** 18 (4 Scouts, 14 Workers)
  **Materials:** 5 clusters of chairs (Nests A–E), 5 sealed envelopes (hidden quality 1–5 stars), 18 tokens (Brood), 1 central table (Old Nest).

  **Setup and Rules**
  Arrange the room with five distinct chair clusters labeled A–E and a central table holding 18 tokens. Place an envelope at each cluster containing a hidden quality rating (one 5-star, one 4-star, etc.). Assign roles: four participants start as Scouts (free to move); fourteen start as Workers at the Old Nest.

  Distribute these constraints strictly:
  1.  **Information:** Only those who visit a cluster may open its envelope. You may not speak about quality. No global announcements ("Site C is best!").
  2.  **Recruitment:** To move a peer, you must physically lead them via tandem run (hand on shoulder, walking slowly). No pointing or shouting.
  3.  **Quorum:** A cluster becomes "Active" only when five participants occupy it simultaneously.
  4.  **Commitment:** Only Active clusters may receive Brood. Workers carry one token per trip from Old Nest to Active Cluster.
  5.  **Success:** The colony wins if all Brood reaches the 5-star site within 45 minutes. If Brood reaches a lower-quality site, the colony loses.

  **Timeline**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–10 | Briefing | Assign roles, explain rules, enforce silence on quality. |
  | 10–55 | Simulation | Participants execute search, recruit, and transport. |
  | 55–90 | Debrief | Structured philosophical inquiry (see below). |

  **Facilitation and Predictable Failures**
  Your role is referee, not teacher. Enforce the silence rule rigorously. If a participant attempts to act as a "Queen" (directing traffic globally), mute them or remind them they are a worker. If participants confuse the quorum count, verify it yourself; do not let them self-certify.

  Expect three failures. First, **premature commitment**: Workers may hit quorum at a mediocre site before Scouts find the best one. Let this happen; it demonstrates hysteresis. Second, **information hoarding**: Scouts may forget to recruit. Remind them the goal is collective, not individual. Third, **confusion**: Auditors may feel lost. Reassure them that confusion is the point; the ants are confused too. If the colony fails to find the 5-star site, treat the failure as data: real colonies fail when noise overwhelms signal.

  **The Debrief**
  Do not lecture. Interrogate their experience to locate the mind.

  1.  **Locate the Decision:** Ask, "Who decided to move the brood?" Individuals will say, "I just followed," or "We reached five." Push further: "Did any single person know the 5-star site was the target?" (No). "Did the group know?" (Yes).
  2.  **Locate the Belief:** Ask, "When did the colony *believe* Site A was home?" Map this to the quorum moment. Before quorum, it was a hypothesis; after quorum, it was a commitment. The belief exists in the distribution of bodies, not in any head.
  3.  **Locate the Desire:** Ask, "Who wanted to win?" Individuals wanted to follow rules; the colony wanted the best nest. The desire is emergent.

  Only now introduce the philosophical frame. Explain that they have enacted the **intentional stance**: to predict the system, you must treat the colony as a rational agent with beliefs and desires, even though the parts are simple mechanics. Map the game mechanics to the theory: tandem running is belief propagation; quorum is threshold commitment; the absence of a central decider is the absence of a Cartesian theater. Reveal the name: this is the **Aunt Hillary** thought experiment. The colony is not *like* a mind; functionally, it *is* one.

  **Limitations and Facilitator Supply**
  Be frank about what the game cannot do. You must supply the distinction between **access consciousness** (information available for reporting) and **phenomenal consciousness** (what it feels like). The game simulates access: the colony "knows" the site quality. It cannot simulate qualia: there is no "what it is like" to be the colony.

  Furthermore, acknowledge the **meta-awareness leak**. Human participants know they are in a seminar; ants do not. Humans can choose to break rules; ants follow pheromones. The game proves that complex cognition can emerge from simple rules, but it cannot settle the hard problem of consciousness. Your job is to hold that tension: the mind is real enough to move brood, but you cannot find it in any single chair.
