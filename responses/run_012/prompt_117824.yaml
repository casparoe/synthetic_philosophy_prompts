      *   How does this relate to DCD (Donation after Circulatory Death)? In DCD, death is declared after circulatory arrest. Auto-resuscitation is possible within a short window (the "process" of dying), but after a set time (e.g., 5 minutes), it's deemed irreversible. The surgeon wants to perfuse organs (restore circulation) but exclude the brain. This raises the "dead donor rule" issue: You can't kill the patient to get organs. If they aren't dead, restoring circulation might revive them (unless the brain is excluded).

