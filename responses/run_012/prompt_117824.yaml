  5.  **Addressing the Specific Nuances:**
      *   *Cessation (Cannot vs. Will Not):* This is the crux of DCD. If death requires *irreversibility* (cannot), then restoring circulation proves they weren't dead. If death requires *permanence* (will not), then DCD works.
