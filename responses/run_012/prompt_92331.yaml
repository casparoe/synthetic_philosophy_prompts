  Inside the darkened house a sudden light
  Illuminates the center of the brain,
  Where all the scattered senses come to strain
  Against the edges of the private night.
  One viewer sits beneath the gathering bright
  To witness every qualia and pain.
  I know the theory calls this merely vain
  And rejects this commanding inner sight.

