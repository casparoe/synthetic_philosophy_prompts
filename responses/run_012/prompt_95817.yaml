      *   **The Problem:** The student and a classmate constructed an argument (steps 1-7) that seems to show Kant's reason *undermines* his conclusion (i.e., if the reason is about general trustworthiness, a lie to a murderer doesn't damage general trustworthiness, so it should be permissible).
      *   **The Teacher's Stance:** You must choose between the reason and the conclusion.
