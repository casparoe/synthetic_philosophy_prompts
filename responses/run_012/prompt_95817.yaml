      *   (2) Inference: Wrongness consists in the *amount* of untrustworthiness added to the world. *Suspicious step. This sounds utilitarian/consequentialist.*
      *   (3) Empirical claim: The lie to the murderer puts almost no untrustworthiness into the world (one hearer, unique situation, no general impact). *Plausible empirically, but relies on (2).*
      *   (4) Conclusion from (2)+(3): Lie is trivial or required (due to friend's death). *Follows from previous steps.*
      *   (5) Generalization: Doesn't depend on murderer status. *Follows.*
      *   (6) Slippery slope: Licenses white lies, excuses, etc. *Follows.*
      *   (7) Final Conclusion: Kant's ground cannot support an unconditional prohibition. *Follows.*

  3.  **Evaluate the Argument against Kant's Actual Philosophy:**
      *   Kant is a deontologist. He does *not* measure wrongness by the "amount of untrustworthiness" or the empirical consequences of a specific act.
      *   Step (2) is the critical pivot. It translates Kant's *principle-based* reasoning into a *consequence-based* metric ("amount of untrustworthiness it puts into the world").
      *   For Kant, the wrongness isn't in the *empirical damage* done to the system of rights. The wrongness is in the *violation of the principle* itself. It's about the *maxim*, not the *outcome*.
