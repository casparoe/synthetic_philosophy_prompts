answer: |-
  You press me hard on my change of heart, and I will not dodge it. It is true the ink did not dry anew between my Rochester days and my Liberty Party days; the change was in my eyes, not in the parchment. But tell me, when a man emerges from a dark cellar into the sun, does he say the sun has changed, or that his sight is cleared? For years I looked at the Constitution through the lens of the slaveholder's practice, not the Constitution's own language. I conflated the corrupt tree with the seed that planted it. You say I read my politics into the text now; I say I finally stripped the politics of the oppressor off the text to find the law underneath. The Constitution speaks of "persons," not "property." It speaks of "justice," not "bondage." To read it as pro-slavery is to read into it what is not there, based on the sins of those who administer it.

  To your question: What would have kept me a Garrisonian? Had the framers dared to write the word "slave" into this instrument; had they explicitly sanctioned property in man; had they denied the humanity of the bondman in the same breath they claimed to secure liberty for themselves, I would tear it up with you today. But they did not. They were ashamed. They hid the monster behind euphemisms—"persons held to service," "other persons." They knew slavery could not stand the light of their own principles. That twenty-year limit on importation was not a protection of slavery, but a countdown to its potential death knell. You say the slaveholder's reading is the true one. I say the thief's reading of the law against theft is not the law itself. The Constitution is a glimmer of light in a dark place; do you ask me to extinguish the light because the darkness has tried to swallow it?
