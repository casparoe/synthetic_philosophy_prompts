  4.  **Phase 3: Ranking and Repair:**
      *   *Most Severe:* The Episodic Self (5) vs. Forward-Looking Coercion (2) & Reactive Attitudes (4). If there is no diachronic self, the target of coercion and the target of resentment vanish or become unjust targets.
      *   *Second Most Severe:* Moral Realism (3) + OIC (6) vs. No UR (1). If I can't be UR, can I be obligated? If OIC holds, and I can't do otherwise (in the UR sense), then I have no obligations. If I have no obligations, Moral Realism about *duties* is empty.
