      *   *Commitment 1 (No UR):* This is the hard incompatibilist core. Responsibility requires self-creation, which is impossible. Luck (deterministic or indeterministic) undermines UR.
      *   *Commitment 2 (No Desert):* Follows from (1). Retribution is unjustified. Consequentialist/quarantine model for coercion.
      *   *Commitment 3 (Moral Realism):* Moral facts exist independently of us. Actions are objectively wrong/right.
      *   *Commitment 4 (Reactive Attitudes):* We can't/shouldn't stop feeling resentment/gratitude. These are part of human life. (Tension alert: Usually linked to responsibility, but user denies UR).
      *   *Commitment 5 (Episodic Self):* Diachronic identity is weak or false. I am a series of selves. (Tension alert: Who is responsible? Who is punished?).
      *   *Commitment 6 (OIC):* Obligation requires ability. (Tension alert: If no UR, do we have obligations?).
      *   *Commitment 7 (Real Deliberation):* Agency is real, not epiphenomenal. Reasons cause actions. (Tension alert: How does this fit with No UR and the regress?).

