prompt: |-
  I am the senior drafter at a public regulator that issues individual decisions — permits, benefit determinations, enforcement actions — under statutory standards phrased as gradable predicates: significant risk, material change, substantial benefit, reasonably practicable. Our decisions are appealed constantly, and the appellate body quashes them either for being too vague to bind us or for being too arbitrary to be fair. I need a drafting-and-adjudication procedure my team can actually run, first when we must put one of these standards into a rule, and then when we must apply it to a case. My drafters are lawyers, not philosophers; they have a week per rule, not a semester, and the chief executive signs the rule while the appellate body signs off on the case.

  Write it as an ordered procedure: the questions to ask, in sequence, from the moment a statute hands us a gradable term to the moment we issue a determination; what counts as a sufficient answer at each step; the point at which the procedure forces us to fix a bright-line cutoff and defend it as a cutoff rather than a measurement; the point at which it stops and hands the case to a person as a value judgment; and the point at which it requires us to record a decision we cannot justify internally, so that the record remains auditable.

  Ground it in what the philosophical literature on vagueness and the sorites actually establishes rather than in folk wisdom about gray areas: the difference between vagueness and ambiguity or mere underspecification; the difference between a borderline case and a case we simply do not yet know how to classify; the possibility of higher-order vagueness, i.e. borderline cases of borderline cases; and the fact that any consistent cutoff licenses a sorites march in which every individual step looks defensible. Give my drafters two tests they can run: one that walks a proposed cutoff along a chain of cases from clearly-in to clearly-out and asks whether the justification survives each step, and one that asks whether the procedure itself has a penumbra. Propose a way of recording penumbral decisions so that later decisions stay consistent with earlier ones without pretending the cutoff was discovered rather than chosen.

  Then run the procedure on three cases — one threshold of risk, one threshold of degree or similarity, one threshold of effort — at least one of which returns an outcome I will find unjust and arbitrary. End by stating plainly what the procedure cannot do, and which questions a court or a legislature, rather than my team, has to settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Senior Drafter at a public regulator.
      *   **Problem:** Decisions using gradable predicates (significant risk, material change, etc.) are constantly appealed and quashed (too vague vs. too arbitrary).
      *   **Audience:** Lawyer-drafters (not philosophers), tight deadline (1 week per rule), high stakes (appellate review).
      *   **Task:** Write an ordered procedure for drafting rules and applying them to cases involving gradable predicates.
      *   **Requirements:**
          *   Grounded in philosophical literature on vagueness/sorites (not folk wisdom).
          *   Distinguish vagueness vs. ambiguity/underspecification.
          *   Address borderline cases vs. ignorance.
          *   Address higher-order vagueness.
          *   Acknowledge the Sorites paradox (any cutoff allows a march).
          *   Include two specific tests (Sorites walk, Procedure penumbra).
          *   Specify when to fix a bright-line cutoff vs. when to leave it as a value judgment.
          *   Specify how to record "unjustifiable" decisions for auditability.
          *   Run the procedure on three cases (risk, degree/similarity, effort).
          *   One outcome must feel unjust/arbitrary.
          *   End with limitations (what the procedure *cannot* do, what courts/legislatures must decide).
      *   **Format:** Ordered procedure (questions in sequence, sufficient answers, decision points).

  2.  **Deconstruct the Philosophical Grounding:**
      *   *Vagueness vs. Ambiguity:* Ambiguity is multiple distinct meanings (bank of river vs. bank of money). Vagueness is blurred boundaries (bald, tall). The procedure must treat these differently.
      *   *Underspecification:* The rule lacks detail but could have it. Vagueness is inherent to the concept.
      *   *Borderline Cases:* Not just "we don't know," but "there is no fact of the matter" (on some views) or "the concept does not determine an answer."
      *   *Higher-Order Vagueness:* It's not just clear/borderline/unclear; the boundary between clear and borderline is *also* vague.
      *   *Sorites Paradox:* If $n$ grains make a heap, $n-1$ does too. Eventually, 0 grains make a heap. Any sharp cutoff seems arbitrary, but *no* cutoff makes the rule unenforceable.
      *   *Supervaluationism/Epistemicism/Contextualism:* I need to pick a pragmatic stance for regulators. *Pragmatic Precisation* is best here. We acknowledge the vagueness but stipulate a boundary for administrative necessity.

  3.  **Drafting the Procedure (Step-by-Step):**
      *   *Phase 1: Diagnostic (Is it actually vague?)*
      *   *Phase 2: Operationalization (Can we measure it?)*
      *   *Phase 3: The Cutoff Decision (Bright-line vs. Standard)*
      *   *Phase 4: The Sorites Test (Stress testing)*
      *   *Phase 5: Application & Recording (The Case)*
      *   *Phase 6: The Penumbral Record (Audit trail)*

      *Key Constraint:* Must identify *where* we force a bright line and *where* we admit a value judgment.
      *Key Constraint:* Must address higher-order vagueness (the boundary of the boundary).

  4.  **Developing the Two Tests:**
      *   *Test 1: The Sorites Walk.* Take a chain of cases. Does the justification hold at every step?
      *   *Test 2: The Meta-Penumbra.* Is the procedure for deciding the cutoff itself vague?

  5.  **Developing the Recording Mechanism:**
      *   Need a way to say "We chose $X$ not because nature dictates $X$, but because we need a line." This prevents later drafters from pretending $X$ is natural law. Let's call it a "Stipulation Notice."

  6.  **Running the Procedure on Three Cases:**
      *   *Case 1: Significant Risk (Threshold of Risk).* Quantitative. Easy to measure, hard to justify the specific number.
      *   *Case 2: Material Change (Threshold of Degree/Similarity).* Qualitative/Comparative. Harder to measure.
      *   *Case 3: Reasonably Practicable (Threshold of Effort/Cost).* Economic/Feasibility.
      *   *Requirement:* One outcome must feel unjust/arbitrary. I'll make the "Reasonably Practicable" one bite a small actor unfairly due to a bright-line efficiency rule.

  7.  **Addressing the Limitations:**
      *   The procedure cannot solve the Sorites paradox; it manages it.
      *   It cannot resolve political value judgments (that's the Legislature's job).
      *   It cannot eliminate judicial review (that's the Court's job).

  8.  **Refining the Tone:**
      *   Professional, directive, procedural.
      *   No fluff.
      *   Acknowledge the tension between legal certainty and fairness.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish ambiguity from vagueness? *Yes, in Step 1.*
      *   *Check:* Did I address higher-order vagueness? *Yes, in Step 4 (Meta-Penumbra).*
      *   *Check:* Is the "unjust outcome" included? *Yes, in Case 3.*
      *   *Check:* Is the recording mechanism clear? *Yes, the "Stipulation Notice."*
      *   *Check:* Is it feasible for lawyers in a week? *It needs to be tight. I will streamline the steps.*

  10. **Final Polish:** Ensure the distinction between "rule-making" (ex ante) and "adjudication" (ex post) is clear, as the prompt asks for both. The prompt asks for *a* procedure that covers both moments. I will structure it as a lifecycle: Rule Drafting -> Case Application.

      *(Self-Correction on "Unjust Outcome"):* The prompt asks for *one* outcome I (the user/senior drafter) will find unjust and arbitrary. This implies the procedure should *produce* it, not hide it. I need to make sure the procedure forces a bright line that creates a cliff-edge effect.

      *(Refining the Philosophical Grounding):* Ensure I explicitly mention that the cutoff is *stipulative*, not *discovered*. This is key to epistemicism vs. supervaluationism pragmatics.

      *(Final check on constraints):* "Write it as an ordered procedure." "Ground it in... literature." "Run the procedure on three cases." "End by stating plainly what the procedure cannot do."

      Let's assemble.

      *Step 1: Classification.* (Vagueness vs Ambiguity).
      *Step 2: Dimension Selection.* (What scale are we measuring?)
      *Step 3: The Cutoff Decision.* (Bright line vs. All-things-considered).
      *Step 4: The Sorites Stress Test.*
      *Step 5: The Meta-Vagueness Check.*
      *Step 6: Application & Recording.*

      *Cases:*
      1.  *Significant Risk:* 1 in 10,000 vs 1 in 11,000.
      2.  *Material Change:* 5% cost increase vs 4.9%.
      3.  *Reasonably Practicable:* Cost > Benefit. The unjust one: A safety measure costs $1M, saves 0.1 statistical lives. Value of statistical life says no. But it's a child's playground. The procedure forces the math.

      *Wait, I need to make sure the "unjust" one comes from the procedure's logic.*
      Let's make Case 3 about "Reasonably Practicable" where the bright line excludes a marginal case that feels morally compelling.

      *Limitations:* Cannot solve the philosophical problem. Cannot usurp legislative policy.

      *Let's write.*
answer: |-
  # PROCEDURE FOR OPERATIONALIZING GRADABLE PREDICATES
  **Authority:** Senior Drafter's Office
  **Applicability:** Rule Drafting and Individual Determination
  **Constraint:** 1 Week Turnaround

  ## PHASE 1: DIAGNOSTIC (DAY 1)
  *Objective: Distinguish vagueness from ambiguity and underspecification.*

  **Q1.1: Is the term ambiguous or vague?**
  *   **Test:** Can the term be paraphrased in two distinct, non-overlapping ways (Ambiguity), or does it admit of degrees along a single dimension (Vagueness)?
  *   **Example:** "Bank" (river vs. money) is ambiguous. "Significant" (how much?) is vague.
  *   **Sufficient Answer:** If ambiguous, select the intended meaning via definition. If vague, proceed to Q1.2.
  *   **Philosophical Ground:** Ambiguity is resolved by disambiguation; vagueness is resolved by precisation. Do not treat a sorites-susceptible term as merely underspecified.

  **Q1.2: Is the uncertainty epistemic or ontic?**
  *   **Test:** Do we lack data to classify the case (Epistemic/Underspecification), or does the concept itself lack a boundary even with perfect data (Ontic/Vagueness)?
  *   **Sufficient Answer:** If we just need more data, gather it. If the concept itself has no natural boundary (e.g., "significant"), acknowledge it as a **Borderline Problem**. Proceed to Phase 2.

  ## PHASE 2: OPERATIONALIZATION (DAY 2-3)
  *Objective: Select the dimension of measurement.*

  **Q2.1: What is the scalar dimension?**
  *   **Test:** Identify the continuous variable underlying the predicate (e.g., probability for "risk," cost for "practicable," percentage change for "material").
  *   **Sufficient Answer:** A single measurable metric. If multiple metrics exist (e.g., risk = probability × severity), you must weight them *now*.
  *   **Constraint:** You cannot defer weighting to the adjudicator. If you defer weighting, you create higher-order vagueness.

  **Q2.2: Is a bright-line cutoff administratively necessary?**
  *   **Test:** Can the regulated party comply without knowing the exact boundary?
  *   **Sufficient Answer:**
      *   **YES:** You must fix a cutoff (e.g., >5%). Acknowledge this is a **Stipulation**, not a discovery.
      *   **NO:** You may retain a standard (e.g., "all things considered"). Proceed to Phase 4.

  ## PHASE 3: THE CUTOFF DECISION (DAY 4)
  *Objective: Fix the boundary and defend its arbitrariness.*

  **Q3.1: Where is the line drawn?**
  *   **Action:** Select the specific value (e.g., $10,000, 5%, 1 in 10,000).
  *   **Requirement:** You must explicitly state: *"This boundary is chosen for administrative certainty. Cases immediately adjacent to this line are not materially different in nature, but are treated differently for rule stability."*
  *   **Philosophical Ground:** Acknowledge the **Sorites Paradox**. You are stopping the march by fiat. Do not claim the number is "natural."

  **Q3.2: The Sorites Walk Test (Test 1)**
  *   **Action:** Construct a chain of 10 hypothetical cases moving from Clearly-In to Clearly-Out in small increments (e.g., risk probabilities: 10%, 9%, 8%... 1%).
  *   **Question:** Does the justification for the cutoff survive every step?
  *   **Sufficient Answer:** If the justification fails at a step *before* the cutoff (e.g., you ban 5% but cannot explain why 4.9% is safe), you must move the cutoff or admit the rule is arbitrary.
  *   **Failure Condition:** If you cannot justify the difference between $n$ and $n-1$ at the boundary, you must record a **Stipulation Notice** (see Phase 5).

  ## PHASE 4: THE META-PENUMBRA CHECK (DAY 5)
  *Objective: Address higher-order vagueness.*

  **Q4.1: Is the procedure itself vague? (Test 2)**
  *   **Test:** Apply Phase 3 to the *process* of setting the cutoff. Is there a borderline case for whether a case is a borderline case?
  *   **Sufficient Answer:** Identify the **Penumbra Zone** (e.g., 4.5% to 5.5%).
  *   **Action:** You must decide how to treat the Penumbra Zone.
      *   **Option A:** Treat all Penumbra cases as "In" (Precautionary).
      *   **Option B:** Treat all Penumbra cases as "Out" (Liberty).
      *   **Option C:** Require individual adjudication for Penumbra cases only.
  *   **Constraint:** You cannot leave the Penumbra Zone undefined. That delegates legislative power to the adjudicator.

  ## PHASE 5: APPLICATION AND RECORDING (DAY 6-7)
  *Objective: Apply to case and audit the choice.*

  **Q5.1: Does the case fall in the Core or the Penumbra?**
  *   **Action:** Measure the case against the dimension selected in Q2.1.
  *   **Sufficient Answer:**
      *   **Core:** Apply the rule mechanically.
      *   **Penumbra:** Apply the Policy Decision from Q4.1.

  **Q5.2: The Stipulation Notice (Audit Trail)**
  *   **Requirement:** If the case falls within the Penumbra Zone or exactly on the Cutoff, you must attach a **Stipulation Notice** to the decision record.
  *   **Text:** *"This decision rests on a stipulated boundary established in [Rule X]. We acknowledge that a marginal difference in [Metric] does not reflect a moral or natural difference in status. This distinction is maintained for consistency with [Prior Case Y]."*
  *   **Purpose:** Prevents future drafters from claiming the cutoff was "discovered." Ensures **Artificial Consistency**.

  **Q5.3: The Value Judgment Handoff**
  *   **Condition:** If the metric cannot capture the statutory intent (e.g., "significant" risk involves fear, not just probability), stop the procedure.
  *   **Action:** Transfer to a Senior Adjudicator.
  *   **Record:** *"Metric insufficient. Decision based on normative judgment."* This creates a distinct precedent class.

  ---

  # PROCEDURE RUN: THREE CASES

  ## CASE 1: THRESHOLD OF RISK ("Significant Risk")
  **Statute:** "Permit denied if project poses a *significant risk* to public health."
  **Dimension:** Annual probability of fatality.
  **Procedure Application:**
  1.  **Diagnostic:** Vague, not ambiguous.
  2.  **Operationalization:** Metric = Probability of fatality per annum.
  3.  **Cutoff:** Drafters select **1 in 10,000**.
  4.  **Sorites Walk:** 1 in 9,000 (Significant) -> 1 in 10,000 (Significant) -> 1 in 11,000 (Not Significant).
      *   *Result:* The Walk fails. There is no health difference between 1/10,000 and 1/11,000.
      *   *Resolution:* Stipulation Notice issued. "1 in 10,000 chosen for alignment with EPA precedents."
  5.  **Meta-Penumbra:** Zone set at 1 in 9,500 to 1 in 10,500. Policy: Treat Penumbra as "Significant" (Precautionary).
  6.  **Outcome:** Project with 1 in 10,200 risk is **DENIED**.
  7.  **Record:** Stipulation Notice attached. Consistency maintained with prior denial of 1 in 10,100 project.

  ## CASE 2: THRESHOLD OF DEGREE ("Material Change")
  **Statute:** "License amendment required for any *material change* in operations."
  **Dimension:** Percentage increase in operational cost.
  **Procedure Application:**
  1.  **Diagnostic:** Vague.
  2.  **Operationalization:** Metric = % increase in annual operating budget.
  3.  **Cutoff:** Drafters select **5%**.
  4.  **Sorites Walk:** 5.0% (Material) -> 4.9% (Not Material).
      *   *Result:* Walk fails. 0.1% budget difference does not alter regulatory oversight needs.
      *   *Resolution:* Stipulation Notice issued. "5% selected to reduce administrative burden on minor filings."
  5.  **Meta-Penumbra:** Zone 4.5% to 5.5%. Policy: Individual Adjudication for Penumbra.
  6.  **Outcome:** Applicant proposes 4.8% increase. **NO AMENDMENT REQUIRED**.
  7.  **Record:** Core case. No Stipulation Notice needed.

  ## CASE 3: THRESHOLD OF EFFORT ("Reasonably Practicable")
  **Statute:** "Safety measures must be implemented if *reasonably practicable*."
  **Dimension:** Cost-Benefit Analysis (Gross Disproportionality Test). Cost > 2x Benefit = Not Practicable.
  **Procedure Application:**
  1.  **Diagnostic:** Vague (degree of effort).
  2.  **Operationalization:** Metric = Dollar Cost vs. Dollar Value of Statistical Life (VSL).
  3.  **Cutoff:** Cost must not exceed Benefit by factor of 2.
  4.  **Sorites Walk:** Cost $2.0M / Benefit $1.0M (Not Practicable) -> Cost $1.9M / Benefit $1.0M (Practicable).
      *   *Result:* Walk fails. $100k difference does not change "reasonableness."
      *   *Resolution:* Stipulation Notice issued. "Factor of 2 chosen to allow industry margin of error."
  5.  **Meta-Penumbra:** Zone 1.9x to 2.1x. Policy: Treat as "Not Practicable" (Efficiency priority).
  6.  **Outcome:**
      *   **Scenario:** A daycare center must install a fire suppression system.
      *   **Cost:** $205,000.
      *   **Benefit:** Statistical reduction in fatality risk valued at $100,000 (based on low occupancy hours).
      *   **Ratio:** 2.05x.
      *   **Determination:** **NOT REASONABLY PRACTICABLE.** System not required.
  7.  **Record:** Stipulation Notice attached. *"We acknowledge this outcome leaves a known risk unmitigated. The cutoff is maintained to prevent arbitrary enforcement across the regulated sector."*

  **Analysis of Case 3:** This outcome is **unjust and arbitrary**. A daycare with children is treated identically to a warehouse based on a rigid cost-benefit ratio that undervalues the specific vulnerability of the population. The procedure *forced* this outcome to maintain consistency with the Sorites Walk and the bright-line cutoff. The Stipulation Notice preserves the audit trail, admitting the injustice is a byproduct of the rule's structure, not an oversight.

  ---

  # LIMITATIONS AND JURISDICTIONAL BOUNDARIES

  **What This Procedure Cannot Do:**
  1.  **Solve the Sorites Paradox:** This procedure does not resolve the philosophical contradiction that small changes should not alter category membership. It manages the contradiction by stipulating a boundary and recording the stipulation. It trades truth for administrability.
  2.  **Eliminate Arbitrariness:** As seen in Case 3, the procedure *generates* arbitrariness at the margin to prevent arbitrariness in the core. It cannot make the cutoff "fair" in every individual case; it can only make it "consistent" across all cases.
  3.  **Resolve Value Conflicts:** The procedure cannot determine whether safety is more important than cost (Case 3). It can only apply the ratio once the ratio is set.

  **Questions for the Legislature:**
  1.  **Weighting of Values:** Only the legislature can decide if the Cost-Benefit ratio in Case 3 should be 2:1 or 1:1. The regulator cannot change this without usurping legislative policy.
  2.  **Tolerance for Error:** Only the legislature can mandate whether the Penumbra Zone (higher-order vagueness) should be resolved in favor of the regulated party (liberty) or the public (security).

  **Questions for the Court:**
  1.  **Reasonableness of Stipulation:** The court must decide if the Stipulation Notice is a sufficient defense against a claim of arbitrariness. The procedure creates the record; the court decides if the record justifies the fiat.
  2.  **Jurisdiction over Penumbra:** The court must decide if the "Individual Adjudication" option for Penumbra cases (Case 2) constitutes an unlawful delegation of legislative authority.

  **Final Instruction to Drafters:**
  Do not hide the cutoff. Do not claim the number is natural. If the outcome feels unjust, check the Stipulation Notice. If the Notice is accurate, the injustice is a feature of the rule, not a bug of the drafting. Escalate to the Chief Executive for policy change, do not attempt to draft around it.
