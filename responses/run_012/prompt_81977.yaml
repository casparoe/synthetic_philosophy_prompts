prompt: |-
  ok so my friend and i got into a two-hour arguement last night about her ADHD diagnosis and i still can't tell who was right, so i want you to help me work out what the whole thing actually presupposes. setup: she got diagnosed at 29, went through the checklist with a psychiatrist, met the criteria, started meds, and she says it was like someone finally handed her the instruction manual for her own life — everything before that suddenly made sense. then her cousin, who's 16, is on tiktok, decided from those online checklists that she has autism, told her parents, and now there's a fight because the school psychologist says she's just going through a phase and the parents think she's copying stuff she saw.

  here's the practice i want you to take apart: a manual lists criteria, a trained person checks whether you meet them, and if you do you get the label — and the label is supposed to be a description of something that was already there. you didn't get the condition from the manual, you had it and the manual just named it. that's what "meeting criteria" means, right, that the thing was sitting there before anyone wrote the criteria down.

  but the same clinical world does a bunch of other stuff that seems to assume the opposite. it tells patients you know your own mind best, it runs peer support groups where the diagnosis turns into an identity and a community, it does psychoeducation that explains what your condition will do to you over the rest of your life, and every clinician i've ever talked to will privately admit that a kid who gets labeled early starts acting more like the label. so on one side the label is a mirror showing you what was always there, on the other it's closer to a script people pick up and then perform, and those can't both be the basic picture.

  so: reconstruct the view of psychiatric categories the diagnostic practice actually needs. does it need the categories to be natural kinds, real joints in nature like measles, or only to be reliable predictors, or useful for picking a treatment — which is a much weaker commitment? seperate what the practice strictly presupposes from what it just happens to fit well with, because i suspect most of it is philosophically innocent: read the manual as a billing code plus a rule for which drug to try and it commits you to almost nothing, and all the metaphysics gets imported by the way we talk about "having" a disorder.

  then the looping part. there's a philosopher who talks about looping effects — classifying people changes them, the changed people make the old category fit worse, so the category gets revised, and then they change again. i think it's Hacking. take that seriously and tell me what the practice would have to look like if it were built around looping instead of around discovery. would we deliberately re-diagnose people every few years? would disclosure come with a warning that the label is going to change how you see yourself, the way a drug comes with side effects? would we stop letting patient communities feed back into the criteria, or would we build that feedback in on purpose? and would "do i meet the criteria" even be the right question anymore, or would it become "does this label help you right now, given what you're going to do with it"?

  and the specific thing i keep circling: the cousin. if a 16 year old reads a list, recognises herself, and adopts the identity, is that evidence she has the thing, evidence she doesn't, or evidence the question is malformed? what does the standard clinical reaction — she's just copying what she saw online — presuppose about the relation between a person and their category? and is that reaction consistent with the same profession insisting that a real diagnosis is the one where the patient says yes, that's me, that's always been me?

  keep it concrete, don't hand me a reading list, just tell me what the practice is committed to and where it's genuinely underdetermined.
reasoning: |-
