answer: |-
  Here is the reconstruction of what your diagnostic practice is actually committed to, where it is lying to itself, and how the cousin case exposes the crack in the foundation.

  ### 1. The Minimal Commitment: What the Practice Actually Needs
  You are correct that the metaphysics are mostly imported by the conversation, not the machinery. If you strip away the "instruction manual" rhetoric and look at the clinical workflow, the practice does **not** need psychiatric categories to be "natural kinds" (like measles or gold).

  To function, the diagnostic system only needs three things:
  1.  **Reliability:** If Dr. A and Dr. B see the same patient, they should assign the same code. (This is about inter-rater agreement, not truth).
  2.  **Predictive Validity:** If you assign Code X, you can predict that Treatment Y is more likely to work than Treatment Z, or that Risk Q is elevated.
  3.  **Administrative Utility:** The code unlocks insurance reimbursement, school accommodations, or legal protection.

  That is the strict presupposition. The system treats the diagnosis as a **stable handle** for grabbing interventions. It does not strictly require that the "ADHD" existed as a discrete entity in the brain before the manual was written. It only requires that the *cluster of behaviors* is stable enough to bill for and treat.

  **Where the metaphysics get imported:**
  The "Discovery Model" (the idea that the label is a mirror of a pre-existing biological reality) is a **functional fiction**. Clinicians and patients *need* to believe it is a discovery to reduce stigma. If ADHD is just a "useful handle," it sounds optional. If it is "brain chemistry," it is mandatory and blameless. The practice commits to the Discovery Model rhetorically to ensure compliance and self-compassion, even though the *mechanism* of treatment often works via the Interaction Model (changing how the patient views themselves).

  ### 2. The Looping Reality: If Practice Admitted Hacking Was Right
  Ian Hacking's "looping effect" argues that human kinds are *interactive*: classifying them changes how they act, which changes the classification. If the diagnostic system were built around this truth rather than the Discovery Model, it would look radically different.

  *   **Informed Consent would include Identity Risks:** Just as a drug leaflet lists physical side effects, a diagnosis would come with a warning: *"Accepting this label may alter your self-narrative, shift your social group, and change how you interpret past failures."*
  *   **Diagnosis would be Time-Limited or Dynamic:** Instead of "You have ADHD" (permanent state), it would be "You currently meet criteria for ADHD." Re-evaluation wouldn't just check if symptoms persist; it would check if the *label* is still doing useful work or if the patient has "looped" into a version of themselves where the label is now a constraint.
  *   **Patient Feedback would be Data, not Noise:** Currently, if a patient says, "I read about this and now I do it," clinicians often treat that as contamination (invalidating the data). In a looping-aware system, that feedback is crucial data on how the category is evolving in the wild.
  *   **The Question Changes:** You stop asking "Do I meet the criteria?" (a backward-looking forensic question) and start asking "Is this category a functional tool for my current context?" (a forward-looking pragmatic question).

  ### 3. The Cousin: Why the Clinical Reaction is Inconsistent
  This is where your argument with your friend likely stalled. The clinical reaction to the 16-year-old ("You're just copying/it's a phase") reveals a double standard in how the profession handles the "Discovery" vs. "Script" tension.

  **The Contradiction:**
  *   **For the Adult (Your Friend):** The clinician says, "You recognize yourself in these criteria? That confirms the diagnosis." The *resonance* is taken as evidence of truth. The fact that the diagnosis changes her life (the "instruction manual" feeling) is celebrated as healing.
  *   **For the Teen (The Cousin):** The clinician says, "You recognize yourself in these criteria? That suggests suggestion." The *resonance* is taken as evidence of contamination. The fact that the diagnosis might change her life is feared as performance.

  **What the Dismissal Presupposes:**
  When the school psychologist says the cousin is "copying," they are presupposing **Temporal Priority**. They assume that for a diagnosis to be "real," the internal state must exist *before* the label is applied. If the label helps create the internal state, they view it as fake.

  But this is inconsistent with the adult experience. Your friend's understanding of her own life *changed* after the label. She likely reinterpreted past memories through the new lens. That is a looping effect. If the adult's "aha!" moment is valid evidence, the teen's "aha!" moment should be at least considered data, not dismissed as mimicry.

  **Is the Question Malformed?**
  For the cousin, "Do I have autism?" might indeed be the wrong question. Because she is 16 (a developmental period of intense identity formation) and the source is TikTok (a social vector for spreading interactive kinds), the label is functioning as a **social technology**.
  *   **Evidence she has "it":** She resonates with the description of the internal experience.
  *   **Evidence she doesn't:** The behaviors might be transient adolescent turbulence finding a permanent vocabulary.
  *   **The Malformed Aspect:** The question assumes Autism is a static object she either possesses or lacks. In reality, engaging with the concept of Autism is already changing her neurology (via attention and stress pathways).

  The clinical dismissal ("it's a phase") is a defense mechanism for the system. If they admit the teen can self-diagnose via TikTok, they lose control of the gatekeeping function (billing/treatment). If they admit the label *creates* the stability, they admit the diagnosis isn't a pure biological discovery.

  ### 4. Where the Practice is Genuinely Underdetermined
  You asked to separate what is strictly presupposed from what fits well. Here is the underdetermined gap:

  1.  **The Boundary of "Symptom" vs. "Strategy":** The system cannot distinguish between a behavior caused by the underlying neurology and a behavior adopted *because* of the diagnosis. If a teen starts stimming because they learned "autistic people stim," is that a symptom? The manual says yes (it's observable behavior). The metaphysics says no (it's performance). The practice has no way to tell the difference, so it defaults to "trust the expert, not the TikTok."
  2.  **The Validity of Retrospective Narrative:** Your friend's diagnosis relied on her saying, "Yes, that's always been me." But memory is reconstructive. Once you have the label, you rewrite your history to fit it. The practice treats this rewritten history as evidence of the pre-existing condition. It is underdetermined whether she had ADHD all along, or if she had a chaotic life that the ADHD narrative now successfully organizes. Both produce the same clinical outcome (relief + medication response).
  3.  **The Function of Distress:** The system requires "impairment" for a diagnosis. But often, the *diagnosis itself* reduces impairment by providing community and explanation. Conversely, for the cousin, the *pursuit* of the diagnosis is causing family conflict (impairment). The system struggles to calculate whether the label is curing the impairment or causing it.

  ### Summary of the Conflict
  Your friend and the cousin are actually in the same boat, but the system is treating them differently based on **authority**, not ontology.

  *   **Your Friend:** Validated by a psychiatrist (Authority). Her looping effect (life making sense) is coded as "Insight."
  *   **The Cousin:** Validated by TikTok (No Authority). Her looping effect (adopting the identity) is coded as "Contagion."

  **The Verdict:**
  The diagnostic practice presupposes that categories are **stable natural kinds** when it needs to justify insurance and medication, but it relies on them being **interactive scripts** when it needs to explain why therapy and psychoeducation work.

  The cousin isn't necessarily "faking," and your friend isn't necessarily "biologically destined." Both are engaging with a classification system that changes the thing it classifies. The practice is committed to pretending this doesn't happen to maintain the authority of the clinician over the patient. The "phase" argument is not a medical fact; it is a boundary-policing move to keep the looping effect under professional control.
