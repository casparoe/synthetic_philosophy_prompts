      *   *Metaphor:* The Manual (DSM/ICD) maps onto "joints in nature."
      *   *Presupposition:* The condition exists independently of the classification. The psychiatrist is a detector.
      *   *Function:* Billing, treatment selection, legal accommodation.
      *   *Problem:* This view struggles to explain why the diagnosis *changes* the person (relief, identity shift, behavioral adjustment).

  3.  **Deconstruct the "Looping View" (The Cousin's TikTok Case):**
      *   *Premise:* Diagnosis = Interaction.
      *   *Metaphor:* The Label is a script or a tool.
