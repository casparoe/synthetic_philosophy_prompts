      *   **The Task:** Reconstruct the view of psychiatric categories the diagnostic practice *actually needs*. Separate strict presuppositions from imported metaphysics. Analyze the "looping effect" (Hacking) and how practice would look if built around it. Address the specific case of the 16-year-old cousin.
      *   **Constraints:** Keep it concrete, no reading lists, identify where the practice is underdetermined.

  2.  **Deconstruct the "Standard View" (The Friend's ADHD Case):**
