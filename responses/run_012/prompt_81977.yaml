      *   Billing codes don't care about metaphysics, only codes.
      *   Treatment algorithms care about response, not ontology.
      *   *Conclusion:* The clinical machinery is philosophically thin. It requires *utility*, not *truth* in a Platonic sense. The "truth" claim is mostly rhetorical to secure insurance and compliance.

  5.  **Analyze the "Looping Effect" (Ian Hacking):**
      *   *Concept:* Interactive kinds (people) vs. Indifferent kinds (rocks). Classifying people changes them.
