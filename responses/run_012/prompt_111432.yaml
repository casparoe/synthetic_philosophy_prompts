  9.  **Final Output Structure:**
      *   Introduction (acknowledging the parallel).
      *   Translation of Camp 1 (Processual).
      *   Translation of Camp 2 (Post-Processual).
      *   Residue Report (Fit, Distortion, Missing).
      *   The Verdict (Underdetermination vs. Structural).
      *   Conclusion (Defect or Boundary?).

  *(Self-Correction Note)*: Make sure not to get too bogged down in archaeological jargon. Keep the focus on the statistical mapping. Use "Processual" and "Post-Processual" as labels for clarity, even if the user didn't use them explicitly.

  10. **Final Review against constraints:**
