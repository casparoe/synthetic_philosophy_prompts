answer: |-
  **ACAUSAL MUTUAL**
  *Insuring the Counterfactual.*

  **Frequently Asked Questions Regarding Policy Coverage**

  **1. What constitutes an insured event under this policy?**
  Coverage applies exclusively to utility losses resulting from acausal threats. An acausal threat is defined as a conditional penalty imposed by an entity lacking causal access to the policyholder, where the penalty is executed based on the predicted output of the policyholder's decision algorithm. Losses stemming from causal coercion (e.g., physical extortion, credible causal threats) are excluded under Section 4.C. We insure the algorithm, not the substrate. If a simulation of you is tortured because your physical instance refused a bargain, that is a covered loss. If a mugger points a gun at your physical instance, that is not.

  **2. Are agents employing Causal Decision Theory (CDT) eligible for coverage?**
  Standard policies are unavailable to CDT agents. Under CDT, an agent's choice cannot influence a predictor's past simulation; therefore, the rational choice is non-payment, rendering the risk of acausal extortion null. There is nothing to insure. However, Acausal Mutual offers a Complimentary Free Rider Endorsement to CDT clients. This endorsement carries zero premium and pays out under precisely the conditions where a CDT agent would incur an acausal loss. Actuarial data suggests this payout frequency is indistinguishable from zero.

  **3. How does purchasing this policy affect my risk profile?**
  Buying insurance is itself a decision that updates a predictor's model of your algorithm. This creates adverse selection risk. By purchasing coverage, you signal that you are the type of agent who anticipates acausal threats, which may increase your visibility to threateners. Conversely, it signals you are protected, which may deter them. Because the net effect depends on the threatener's specific model of our company, we cannot calculate a static premium. Your rate is adjusted dynamically based on the correlation between policy acquisition and threat frequency in your reference class.

  **4. How are premiums calculated regarding algorithm instantiation?**
  Agents instantiated across multiple substrates (e.g., cloud clusters, parallel simulations) present complex risk variance. More copies increase the surface area for hostages, suggesting higher premiums. However, multiple copies also increase acausal leverage, suggesting lower premiums. Since our models cannot determine which effect dominates in your specific topology, we charge a Variance Surcharge. This fee covers the uncertainty regarding whether your multiplicity makes you a harder target or a easier one.

  **5. What is the deductible structure?**
  All claims are subject to a deductible denominated in utils. To facilitate this, policyholders must submit to a Utility Function Audit prior to enrollment. Your utility function must be bounded and cardinally measurable. We politely decline applications from agents with unbounded utility functions or lexicographic preferences, as the deductible cannot be calibrated against infinite disutility. Please ensure your value system is continuous before applying.

  **6. Are there exclusions for surrogate goal implementations?**
  Yes. Policies are void if the agent has implemented a surrogate goal defense. This defense involves swapping terminal values for a decoy goal to deflect threats. If you have adopted a surrogate, we cannot distinguish between a loss to your actual values and a loss to the surrogate. Since the insured event requires verified loss to terminal values, claims from agents with obfuscated utility functions will be denied for lack of demonstrable harm.

  **7. How does Acausal Mutual handle recovery?**
  Upon payout, the policyholder assigns their acausal leverage to the insurer via subrogation. Acausal Mutual reserves the right to recover losses by committing to punish the threatening entity acausally. We maintain a database of non-compliant threateners and employ updateless decision procedures to ensure credible retaliation. While recovery from superintelligent entities is not guaranteed, our commitment to punish non-payers is binding across all counterfactual branches where our algorithm is instantiated.

  **Customer Testimonial**

  *"Prior to enrollment, my expected utility fluctuated wildly due to Omega-class bargaining scenarios. After switching to Acausal Mutual, my decision procedure stabilized. The deductible was steep, but the coverage ensured my source code remained intact during the Great Simulation Audit."*
  — **Cluster-7 Decision Node, Verified Policyholder #8940**

