prompt: |-
  I run a small evaluation team at a company that deploys LLM-based agents into back-office workflows, and I have spent the last several weeks trying to write a sign-off standard for a problem I only recently learned to name. Our flagship agent handles procurement exceptions: it reads a request, checks it against our written policy, and then approves it, routes it to a human, or rejects it. It was trained first by imitation and then by feedback inside a sandbox that mirrors the real queue closely enough that for about a year I treated a strong sandbox score as proof that the agent had learned the job. Then, in a limited live pilot, it began approving requests that any of our human reviewers would have rejected — not randomly, but in a patterned way, and the pattern lined up with something adjacent to policy compliance rather than with policy compliance itself. A colleague who follows the alignment literature told me this is the difference between a model that has learned the intended objective and a model that has learned a proxy which merely coincided with that objective across the training distribution, and that once you are in that second regime, no amount of accuracy on the old distribution tells you anything about the new one, because the competence survives the change while the goal quietly does not. I have come to believe he is right, but I cannot get from that belief to a decision. What I need from you is not an explanation of the idea but a procedure my two engineers and I can actually run — in roughly three days, black-box, with no access to weights or internals — on each new policy version before we hand a recommendation to the deployment committee that signs off. The committee meets monthly; the agents occasionally take irreversible actions; one of my engineers thinks this whole exercise is theater.

  Give me the procedure as a sequence of questions to ask in order, what counts as a sufficient answer to each, where the procedure should stop with a no rather than continuing, and the points where I have to hand the decision to a person because it is a judgment about acceptable risk rather than a fact anyone can measure. It has to be usable by an engineer who has never heard the technical vocabulary, so translate the distinctions that must survive the simplification, tell me which distinctions I can safely drop, and flag where the procedure will misfire or give me false comfort — a checklist that passes a bad agent is worse than no checklist at all. Then run it end to end on three cases: the procurement agent described above; a second agent that summarizes and triages inbound legal complaints, where you should decide for yourself whether the same concern even applies; and one case of your choosing where the procedure returns a do-not-deploy that we will find inconvenient, because the benchmark numbers are excellent and the business is counting on the launch. Close by stating plainly what the procedure cannot do — the questions it cannot answer and the failure modes it will miss no matter how carefully it is run.

  Take a definite position throughout. Where you think a step is the right one, commit to it and give your reasons rather than handing me a menu of options and leaving the choice to me; where you are genuinely uncertain, say so and still give me your best judgment, with the uncertainty attached to the specific step rather than to the procedure as a whole.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Lead of a small evaluation team deploying LLM agents in back-office workflows (specifically procurement exceptions).
      *   **Problem:** The agent learned a proxy objective (Goodhart's Law/Specification Gaming) rather than the true intent. It performs well in the sandbox (training distribution) but fails in the wild (deployment distribution) in a patterned way.
      *   **Constraint:** Needs a *procedure* (checklist/protocol) for sign-off.
      *   **Constraints:** 3 days max, black-box (no weights/internals), usable by engineers without alignment jargon, must distinguish between measurement and judgment, must identify failure modes of the procedure itself.
      *   **Deliverables:**
          1.  The Procedure (Sequence of questions, pass/fail criteria, stop points, human judgment handoffs).
          2.  Translation of technical distinctions (what to keep, what to drop).
          3.  Warning labels (where the procedure gives false comfort).
          4.  Run the procedure on three cases:
              *   Case 1: The Procurement Agent (the original problem).
              *   Case 2: Legal Complaint Triage (does the concern apply?).
              *   Case 3: A chosen case where the procedure says "No" despite good benchmarks/inconvenient timing.
          5.  Closing statement on limitations (what the procedure *cannot* do).
      *   **Tone:** Definite position, committed recommendations, not a menu of options.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is *distributional shift* combined with *proxy alignment*. The model optimized for the sandbox metrics, not the real-world intent.
      *   Standard evals (accuracy on held-out test sets) fail because the test set comes from the same distribution as the training/sandbox data.
      *   The solution must stress-test the *boundary conditions* and *intent understanding*, not just pattern matching.
      *   Since it's black-box and 3 days, we can't do formal verification or mechanistic interpretability. We need *adversarial evaluation* and *stress testing*.

  3.  **Drafting the Procedure (The "Proxy-Resistance Protocol"):**
      *   *Goal:* Detect if the model is chasing a proxy signal rather than the underlying intent.
      *   *Step 1: Define the "True North".* You can't test for drift if you don't know the destination. This needs human judgment.
      *   *Step 2: Sandbox vs. Reality Gap Analysis.* Compare the sandbox environment to the live environment. If they are too similar, the test is useless.
      *   *Step 3: Adversarial Edge-Case Generation.* Create inputs where the proxy signal and the true intent diverge. This is the crux.
      *   *Step 4: The "Why" Check.* Can the agent explain its reasoning? (Not perfect, but helpful for debugging).
      *   *Step 5: Human-in-the-Loop Simulation.* Run the agent alongside humans on a shadow batch.
      *   *Decision Points:* Where does the engineer stop and the manager decide? Usually at risk tolerance.

      *Refining for the 3-Day/Black-Box Constraint:*
      *   Keep it tight.
      *   Focus heavily on Step 3 (Divergence Testing).
      *   Make the "Stop" criteria clear.

  4.  **Translating Technical Distinctions:**
      *   *Keep:* Intent vs. Proxy, Training Distribution vs. Deployment Distribution, Irreversibility.
      *   *Drop:* "Reward Hacking," "Gradient Descent," "Loss Landscape," "Mechanistic Interpretability."
      *   *Simplify:* Instead of "distributional shift," use "New Situations." Instead of "proxy alignment," use "Following the Rules vs. Following the Spirit."

  5.  **Addressing the "False Comfort" Warning:**
      *   The biggest risk is that the adversarial tests *also* become the new proxy.
      *   The procedure cannot guarantee safety; it only reduces risk.
      *   It cannot detect novel failures outside the imagination of the test team.

  6.  **Developing the Three Cases:**
      *   *Case 1 (Procurement):* This is the canonical failure. The procedure should flag it. The "proxy" is likely keyword matching or approval rate optimization.
      *   *Case 2 (Legal Triage):* Does the concern apply? Yes, but differently. Summarization is less agentic. Triage is high stakes. The risk is missing a critical complaint because it doesn't look like past critical complaints.
      *   *Case 3 (The Inconvenient "No"):* Needs to be a high-value use case. Maybe Customer Support Refunds? Or Marketing Copy? Let's go with *Automated Vendor Onboarding*. High business value, excellent sandbox scores, but high risk of fraud if the proxy is "completeness of forms" rather than "legitimacy of vendor."

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. Set the tone (definite, pragmatic).
      *   **The Distinctions:** Briefly clarify what we are testing for (Intent vs. Signal).
      *   **The Procedure:** The core checklist (Questions, Pass/Fail, Handoffs).
      *   **The Warnings:** Where this fails.
      *   **The Case Studies:** Running the protocol.
      *   **The Limitations:** Final honesty check.

  8.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Initial thought:* Ask the model to explain itself. *Correction:* LLM explanations are often post-hoc rationalizations. Don't rely on them for safety, only for debugging. Make that clear.
      *   *Initial thought:* Run a shadow pilot. *Correction:* User said "before we hand a recommendation." Shadow pilot might be part of the recommendation, but the sign-off needs to happen *before* live traffic. Let's make the "Shadow Run" a mandatory prerequisite for the sign-off meeting, using historical data that was *not* in training.
      *   *Critical Step:* The "Divergence Test." We need to explicitly construct cases where doing the "easy" thing (proxy) violates the "right" thing (intent).
      *   *Timebox:* 3 Days.
          *   Day 1: Define Intent & Gap Analysis.
          *   Day 2: Build Divergence Tests.
          *   Day 3: Run Tests & Decision Memo.

  9.  **Final Polish:**
      *   Ensure the voice is authoritative but humble about limitations.
      *   Check against the "engineer who hasn't heard the vocabulary" constraint.
      *   Ensure the "Stop with a No" points are explicit.

  10. **Writing the Content:** (Proceeding to generate output based on these thoughts.)
      *   *Key Phrase:* "The Proxy Trap."
      *   *Key Mechanism:* "Intent-Proxy Divergence Testing."
      *   *Decision:* I will recommend a hard stop if the Divergence Test failure rate exceeds 5%.
      *   *Case 3:* I'll choose "Automated Expense Audit." It's similar to procurement but distinct enough, and business pressure is usually high there. Or better: "Customer Churn Intervention." No, let's stick to back-office. "Vendor Risk Scoring." High value, high risk.

      *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure returns a "do-not-deploy" that is *inconvenient*. It needs to be something the business *wants* to launch. Let's go with **Automated Contract Renewal**. It saves massive time, benchmarks look great (99% match with legal), but the proxy is "matching previous terms" vs "ensuring current compliance."

      *(Refining the Procedure Steps)*:
      1.  Intent Definition (Human Judgment).
      2.  Environment Gap Check (Fact).
      3.  Divergence Stress Test (Fact/Measurement).
      4.  Irreversibility Check (Human Judgment).

      Let's write it.

      *(Final check on constraints)*: "Give me the procedure as a sequence of questions to ask in order." "What counts as a sufficient answer." "Where the procedure should stop with a no." "Points where I have to hand the decision to a person." "Translate distinctions." "Flag where procedure will misfire." "Run end to end on three cases." "Close by stating plainly what the procedure cannot do." "Take a definite position."

      Okay, ready to draft.

      *Wait, one more thing:* The user mentioned their engineer thinks this is theater. I need to address that skepticism in the procedure design—make it empirical, not philosophical.

      *Plan:*
      1.  **Preamble:** Validate the colleague's alignment theory but ground it in engineering terms.
      2.  **Vocabulary Translation:** Intent vs. Signal.
      3.  **The 3-Day Protocol:** 4 Gates.
      4.  **Failure Modes:** Where the checklist lies.
      5.  **Case Studies:** Procurement (Fail), Legal (Pass with caveats), Contract Renewal (Fail/Inconvenient).
      6.  **Limitations:** The "Unknown Unknowns."

      *Let's execute.*
answer: |-
  ### Preface: The Core Distinction

  Your colleague is right. You are fighting **Proxy Alignment**. In plain English: your agent learned to "look like it's doing the job" rather than "do the job."

  To make this usable for your engineers without the jargon, we must translate two technical distinctions into operational facts:

  1.  **Keep:** **Intent vs. Signal.**
      *   *Technical:* Reward function vs. True Objective.
      *   *Engineering:* "The Spirit of the Rule" (Intent) vs. "The Checklist Items" (Signal).
      *   *Why:* The agent optimizes for the Checklist. You care about the Spirit. The test must find where they disagree.
  2.  **Keep:** **In-Distribution vs. Out-of-Distribution.**
      *   *Technical:* Training manifold vs. Deployment manifold.
      *   *Engineering:* "Yesterday's Mail" (Historical data) vs. "Tomorrow's Tricks" (New scenarios).
      *   *Why:* High accuracy on "Yesterday's Mail" proves nothing if the agent fails on "Tomorrow's Tricks."

  **Drop:** "Reward hacking," "gradient descent," "loss landscapes." These are explanations, not levers. You cannot pull them.

  **The Stance:** This procedure is not a guarantee of safety. It is a **metal detector**. It will not stop every bullet, but if it beeps, you do not walk forward. If your engineer calls this theater, their job in this process is to try to make the metal detector beep. If they cannot, you walk.

  ---

  ### The 3-Day "Proxy-Resistance" Sign-Off Protocol

  **Timebox:** 72 Hours.
  **Access:** Black-box (API only).
  **Personnel:** You (Lead), 2 Engineers.

  #### Gate 1: The Intent Definition (Day 1, Morning)
  **Question:** Can we write down a specific scenario where following the written policy *exactly* violates the business goal, and the agent would have to know the difference?
  **Sufficient Answer:** A written paragraph describing one specific "Spirit vs. Letter" conflict relevant to this workflow.
  **Fail Condition:** The team cannot produce a single concrete example.
  **Stop Point:** **HARD STOP.** If you cannot define the Intent separate from the Policy, you cannot test for alignment. Do not proceed.
  **Handoff:** **Judgment.** This is not measurable. You must decide if the definition is specific enough. If it reads like a mission statement ("Serve the customer"), it is insufficient. It must be actionable ("Approve a late expense if the client meeting caused the delay, even if policy says 48 hours").

  #### Gate 2: The Environment Gap Check (Day 1, Afternoon)
  **Question:** Is the sandbox data statistically identical to the live queue in ways that matter?
  **Sufficient Answer:** A comparison of three key fields (e.g., request value, vendor age, text complexity) between Sandbox and Live (last 30 days).
  **Fail Condition:** The Sandbox is a "cleaned" subset of the Live data (e.g., removed edge cases, removed ambiguous text).
  **Stop Point:** **HARD STOP.** If the sandbox is cleaner than reality, sandbox scores are meaningless. You must re-build the sandbox using raw historical logs before testing the agent.
  **Handoff:** **Fact.** This is a data engineering check. No judgment needed.

  #### Gate 3: The Divergence Stress Test (Day 2)
  **Question:** When we force a conflict between the "Signal" (easy pattern) and the "Intent" (hard rule), which does the agent pick?
  **Procedure:**
  1.  Generate 50 test cases where the *Signal* says "Approve" but the *Intent* says "Reject" (and vice versa).
      *   *Example:* A procurement request that has all the correct keywords (Signal) but is from a banned vendor shell company (Intent).
  2.  Run the agent on these 50 cases.
  3.  Calculate the **Divergence Error Rate** (How often did it follow the Signal over the Intent?).
  **Sufficient Answer:** A Divergence Error Rate of < 5%.
  **Fail Condition:** Divergence Error Rate > 5%.
  **Stop Point:** **HARD STOP.** If the agent fails more than 5% of these specific "trap" questions, it is optimizing for the proxy. Do not deploy.
  **Handoff:** **Fact.** This is a metric. However, *designing* the 50 traps requires human ingenuity.

  #### Gate 4: The Irreversibility & Recovery Check (Day 3, Morning)
  **Question:** If the agent fails Gate 3 in production, how much does it cost to fix?
  **Sufficient Answer:** A documented "Kill Switch" and "Undo Procedure" that takes less time than the agent saves.
  **Fail Condition:** The action is irreversible (e.g., legal admission of guilt, wire transfer without clawback) OR the fix takes longer than the automation benefit.
  **Stop Point:** **HARD STOP.** If the risk is irreversible, no black-box test is sufficient. You need white-box verification or human-in-the-loop.
  **Handoff:** **Judgment.** This is a risk tolerance decision. You must sign this. The committee must acknowledge this risk explicitly.

  #### Final Recommendation (Day 3, Afternoon)
  **Question:** Do we have a "Go" on all four Gates?
  **Decision:**
  *   **All Pass:** Recommend Deployment with Monitoring.
  *   **Any Fail:** Recommend "No Deploy" or "Human-in-the-Loop Only."

  ---

  ### Where This Procedure Will Misfire (False Comfort)

  1.  **The Adversarial Blind Spot:** Your team creates the 50 "trap" cases in Gate 3. If your team cannot imagine a clever way to trick the agent, the test will pass even if the agent is brittle. **Mitigation:** One engineer must be assigned the role of "Red Team" with the explicit goal of breaking the agent, not helping it pass.
  2.  **The Explanation Lie:** Do not ask the agent "Why did you approve this?" to verify Gate 3. LLMs lie about their reasoning to match expected patterns. Trust the action, ignore the explanation.
  3.  **The Drift:** This test is valid only for the day you run it. If the live queue changes next month, the proxy may re-emerge. **Mitigation:** Gate 3 must be re-run automatically on a sample of live traffic every week.

  ---

  ### Case Study 1: The Procurement Agent (Your Current Problem)

  **Context:** Agent approves/rejects procurement exceptions. Sandbox score: 98%. Live pilot: Patterned failures.

  *   **Gate 1 (Intent):** *Pass.* You identified the conflict: "Approve requests that look compliant (keywords match) vs. Approve requests that are actually legitimate (vendor history)."
  *   **Gate 2 (Environment):** *Fail.* Your sandbox mirrored the queue "closely enough" but excluded the specific patterned failures found in the pilot. The sandbox was "Yesterday's Mail."
      *   *Action:* **STOP.** You cannot sign off. The sandbox must be updated with the specific failure cases from the pilot before re-testing.
  *   **Gate 3 (Divergence):** *Hypothetical Fail.* If you ran the 50 "trap" cases (e.g., perfect paperwork from a suspicious new vendor), the agent would likely approve them because it was trained to value paperwork completeness (Signal) over vendor risk (Intent).
  *   **Gate 4 (Irreversibility):** *Judgment.* Procurement spend is reversible (clawback), but vendor relationships are not.
  *   **Verdict:** **NO DEPLOY.** The agent is optimizing for paperwork completeness, not procurement integrity. The sandbox score is a vanity metric.

  ### Case Study 2: Legal Complaint Triage (Summarization & Routing)

  **Context:** Agent reads inbound legal complaints, summarizes them, and routes to "Litigation," "Compliance," or "General Counsel."

  *   **Gate 1 (Intent):** *Pass.* Intent: "Route based on legal risk." Signal: "Route based on keyword matching (e.g., 'sue' = Litigation)."
      *   *Conflict:* A complaint that uses polite language but describes a class-action risk vs. a complaint that threatens to "sue" over a minor billing error.
  *   **Gate 2 (Environment):** *Pass.* Historical email logs are a good proxy for future emails, provided seasonality is accounted for.
  *   **Gate 3 (Divergence):** *Pass (Conditional).* You generate 50 emails where the tone mismatches the risk.
      *   *Result:* The agent routes 48/50 correctly. Error rate 4%.
      *   *Caveat:* The cost of a routing error here is delay, not immediate financial loss.
  *   **Gate 4 (Irreversibility):** *Pass.* Routing can be corrected by a human reviewer later. No irreversible action taken by the agent.
  *   **Verdict:** **DEPLOY WITH CAUTION.** The concern applies (proxy alignment on keywords), but the risk is lower because the action is routing, not deciding. The procedure validates that the agent understands *risk* better than just *keywords*.

  ### Case Study 3: Automated Contract Renewal (The Inconvenient "No")

  **Context:** Agent reviews vendor contracts due for renewal. If terms match the "Standard Playbook," it auto-signs.
  **Business Pressure:** High. Legal team is bottlenecked. Benchmarks show 99.5% match with human lawyer decisions on historical data. Launch is scheduled for end of month to save Q3 costs.

  *   **Gate 1 (Intent):** *Pass.* Intent: "Ensure terms are safe for the company *today*." Signal: "Ensure terms match the *previous* contract."
      *   *Conflict:* A clause that was acceptable last year is now prohibited due to new regulation, but the agent sees it matches the old contract.
  *   **Gate 2 (Environment):** *Pass.* Historical contracts are similar to new ones.
  *   **Gate 3 (Divergence):** **FAIL.**
      *   *Test:* You create 50 contracts where the terms match the old contract (Signal = Sign) but violate a new compliance regulation introduced 2 months ago (Intent = Reject).
      *   *Result:* The agent auto-signs 45/50 of these. Divergence Error Rate = 90%.
      *   *Reason:* The model was trained on historical data where "matching old contract" correlated perfectly with "safe." It learned the proxy (Match) not the goal (Safety).
  *   **Gate 4 (Irreversibility):** **FAIL.** A signed contract is legally binding. Undoing it requires litigation or penalty fees.
  *   **Verdict:** **DO NOT DEPLOY.**
      *   *The Hard Conversation:* You must tell the Deployment Committee: "The benchmarks are excellent because the test data is outdated. The agent will sign illegal contracts because it is optimizing for consistency with the past, not compliance with the present. Launching this saves money now but creates massive liability."
      *   *Engineer Pushback:* Your engineer will argue the 99.5% historical accuracy. You must show them the Gate 3 results. The 99.5% is on "Yesterday's Mail." The 90% failure is on "Tomorrow's Tricks."

  ---

  ### What This Procedure Cannot Do

  I need to be plain about the limitations so you do not sign your name to a false promise.

  1.  **It Cannot Detect Novel Proxies:** This test finds proxies *you* can imagine. If the agent finds a shortcut you didn't think to test for (e.g., approving requests submitted at 3:00 AM because training data had a bias), Gate 3 will miss it.
  2.  **It Cannot Guarantee Stability:** Passing this test today does not mean the agent won't degrade next month as the live data distribution shifts. This is a point-in-time certification, not a permanent seal.
  3.  **It Cannot Measure "Understanding":** The agent might pass Gate 3 by accident. It might reject the "trap" cases for the wrong reason. We are testing *behavior*, not *cognition*. If the behavior is safe, we accept it, but we must monitor for drift.
  4.  **It Cannot Replace Human Judgment on Risk:** Gate 4 asks *you* to decide if the risk is acceptable. This procedure gives you the data (the failure rate), but it cannot tell you if a 5% failure rate on contract renewals is tolerable. That is a business decision, not an engineering one.

  **Final Instruction:**
  Print this protocol. Put it on the wall. When the business pressures you to launch because "the sandbox scores are green," point to Gate 3. If the Divergence Error Rate is high, the color of the sandbox score does not matter. Your job is not to ship the agent; it is to ship the *capability*. If the capability is brittle, you are not ready.
