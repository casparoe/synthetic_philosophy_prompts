answer: |-
  To get a neutral spec on the table that doesn't smuggle in the existence of qualia as a premise, we have to start with a coherence condition that allows for the null hypothesis. The first requirement is that the account must specify what would count as demonstrating that the posit is incoherent, meaning it cannot simply assert that qualia exist but must define the conditions under which the concept would be deemed empty or confused. This means the theory has to be robust enough to explain why we have the intuition of qualia even if they turn out to be illusions, satisfying the eliminativist without conceding the realist's ground, while simultaneously providing truth conditions for qualia reports that would satisfy the realist if those conditions are met. This prevents the debate from stalling on definitions and forces every candidate to engage with the possibility that the term refers to nothing, ensuring that the existence of qualia is a conclusion of the theory rather than a presupposition.

  Once that neutrality is secured, the account must handle the distinction between functional discrimination and phenomenal character, which is where cases like the inverted spectrum earn their place. The spec requires that the theory explain how two systems could be functionally identical yet differ in experience, or conversely, explain why such a scenario is impossible without dismissing the intuitive force of the thought experiment. This ties directly into the requirement regarding individuation, where the theory must come down on whether a quale is a countable entity or merely shorthand for a discriminable difference. If qualia are countable things, the account needs a principle of individuation that explains how we count them without arbitrary boundaries; if they are just shorthand for differences, the theory must explain why the phenomenology feels like it involves intrinsic properties rather than relational distinctions. This is crucial because many theories collapse here, either reifying differences into mysterious objects or dissolving the objects so thoroughly that the subjective report of having an experience becomes inexplicable.

  The most demanding specific constraint, however, concerns the case you raised regarding perceptual learning, such as acquiring a vocabulary for wine or chords. The spec must require the account to adjudicate whether the experience itself changes or only the description changes when a subject learns to discriminate finer nuances within a sensation. If the theory claims only the description changes, it must explain the sincere report of structural change in the experience itself without accusing the subject of confabulation, clarifying what the difference between a change in description and a change in experience comes to in terms of cognitive access versus phenomenal content. If the theory claims the experience changes, it must explain how concepts penetrate perception without collapsing qualia into judgments, preserving the distinction between sensing and thinking while acknowledging that the sensing seems to evolve with the thinking. This requirement forces the theory to map the boundary between the given and the constructed, which is where most accounts fail to provide a non-arbitrary line.

  When looking at which single requirement does the most to rule candidates out, it is the demand to accommodate the phenomenology of immediacy while acknowledging conceptual penetration. This is the filter that catches the most theories because functionalists struggle to explain the immediacy without reducing it to processing speed or access, while phenomenal realists struggle to explain the penetration without admitting that qualia are not the intrinsic, pre-conceptual givens they claim to be. It forces a choice between treating the subjective report as infallible data about intrinsic properties or as fallible data about cognitive construction, and very few theories can maintain the robustness of the qualitative feel while allowing it to be malleable by language and learning without collapsing into one camp or the other.

  This leads directly to the tension where two requirements cannot be satisfied together, specifically the requirement to treat qualia as intrinsic, non-relational properties and the requirement to account for the plasticity demonstrated in the learning case. If qualia are truly intrinsic and constitute the raw given of experience, they should not be alterable by the acquisition of concepts or vocabulary, because their nature should be independent of the subject's cognitive background. However, if the account respects the sincere report that the experience itself gains structure upon learning, it must admit that qualia are relational or constructed, which contradicts the desideratum that they are intrinsic properties known directly by acquaintance. You can have an account that preserves the intrinsic nature of qualia by denying the experience changes, or an account that respects the learning data by denying the intrinsic nature, but satisfying both the intuition of intrinsicness and the data of plasticity creates a contradiction that most existing frameworks cannot resolve without substantial revision.
