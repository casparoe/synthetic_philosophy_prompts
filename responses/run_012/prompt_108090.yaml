prompt: |-
  A friend and I have been at this for a years worth of arguing now and neither of us has moved an inch: is Buddhist ethics really a form of consequentialism? Her case: the whole path is aimed at the reduction of suffering, the precepts are treated as rules of thumb you can set aside when following them would cause more harm, the bodhisattva's whole deal is maximizing welfare — so, consequentialism. My case: no, it's about what kind of person you're becoming, the point is uprooting craving and ill-will in yourself, the precepts function as trainings rather than rules — so it's virtue-shaped, or something else entirely. We agree about the texts, we agree about how people actually practice, and still nothing budges. My suspicion is we're not disagreeing about Buddhism at all but about the level at which a moral theory gets evaluated: maybe the tradition is consequentialist at the level of the whole path — a life, or a run of lives — and not at the level of individual choices, and we each keep sliding between those two levels without noticing. She thinks the real culprit is karma, because consequences that are delayed across lifetimes and partly unknowable can't be assessed act by act in advance, which would push the whole thing toward something like rule-consequentialism. And then the no-self thing is sitting in the corner: if there's no self, whose character is being cultivated, and whose welfare is being maximized? Can you diagnose what kind of disagreement this actually is, using what each side really commits to, and tell me what would count as progress — a distinction, a different question, a formal result, or just one of us being wrong? If it turns out to be a verbal fight about what "counts" as consequentialist, say so and show me exactly where the words are doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **The Conflict:** Two friends have been arguing for a year about whether Buddhist ethics is consequentialist or virtue ethics (or something else).
      *   **Friend's Position (Consequentialism):** Goal = reduction of suffering. Precepts = rules of thumb (can be broken if less harm). Bodhisattva = maximizing welfare.
      *   **User's Position (Virtue Ethics):** Goal = becoming a certain kind of person (uprooting craving/ill-will). Precepts = trainings (sila). Focus on internal state/intention.
      *   **Agreements:** They agree on texts and practice.
      *   **User's Hypothesis:** Maybe it's consequentialist at the macro level (whole path/lives) but not micro level (individual choices). Friend thinks *karma* makes it rule-consequentialist (delayed consequences).
      *   **The Wildcard:** *Anatta* (no-self). Whose character? Whose welfare?
      *   **The Task:** Diagnose the disagreement, identify commitments, suggest what counts as progress (distinction, question, result, or verbal dispute), and pinpoint where language is doing the work.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Consequentialism:** Rightness of an act depends on its outcomes. (Utilitarianism is the most famous version).
      *   **Virtue Ethics:** Rightness depends on the character of the agent and whether the act expresses virtue. Focus on *eudaimonia* (flourishing) or in this case, *nirvana*/awakening.
      *   **Buddhist Ethics:** Complex. Involves *karma* (causal law), *sila* (precepts), *karuna* (compassion), *prajna* (wisdom), *anatman* (no-self).

  3.  **Evaluate the "Level" Hypothesis (Macro vs. Micro):**
      *   The user suggests: Consequentialist at the level of the *Path* (soteriological goal), Virtue at the level of *Action*.
      *   This is a strong insight. In Western ethics, we often separate "theory of the good" (what is the ultimate goal?) from "theory of the right" (how do I act?).
      *   Buddhism clearly defines the *Good* as the cessation of *dukkha* (suffering). This looks consequentialist.
      *   Buddhism defines the *Right Action* largely through intention (*cetana*) and cultivation of mind. This looks virtue-ethical.

  4.  **Evaluate the "Karma" Hypothesis:**
      *   Friend says: Karma makes consequences unknowable/delayed $\rightarrow$ Rule-Consequentialism.
      *   Counter: Karma isn't just "consequences" in a utilitarian sense. It's psychological conditioning. Bad karma hardens the mind; good karma softens it. This links back to the User's Virtue claim (character formation).

  5.  **Evaluate the "No-Self" (*Anatta*) Problem:**
      *   If no self, who is the agent of virtue? Who suffers?
      *   Standard Buddhist reply: Conventional truth vs. Ultimate truth. Ethics operates largely at the conventional level.
      *   Philosophical implication: This undermines *both* standard Consequentialism (which requires a container for utility) and Virtue Ethics (which requires a stable character). It suggests a third category: *Soteriological Pragmatism* or *Therapeutic Ethics*.

  6.  **Diagnose the Disagreement:**
      *   Is it substantive or verbal?
      *   It's largely **categorial**. They are applying Western meta-ethical categories to a soteriological system that predates and transcends those categories.
      *   **The Friend** is focusing on the *telos* (end goal): End of suffering.
      *   **The User** is focusing on the *mechanism* (psychological transformation): Intention and habituation.
      *   **The Real Stalemate:** They are defining "Consequentialism" and "Virtue Ethics" differently.
          *   Friend: If the *justification* for the rule is the outcome, it's consequentialist.
          *   User: If the *evaluation* of the act depends on the agent's state, it's virtue ethics.

  7.  **Formulate the Diagnosis:**
      *   **Type of Disagreement:** It's a "Mapping Problem." You are trying to map a 3D object (Buddhism) onto a 2D plane (Western Meta-ethics).
      *   **The Verbal Dispute:** The word "Consequentialism."
          *   Strict definition: Act is right *iff* it produces best outcome.
          *   Friend's definition: System is justified by outcome.
          *   User's definition: Act is evaluated by agent's character.
      *   **The "No-Self" Twist:** This actually dissolves the dichotomy. If there's no self, "character" is a stream of conditioning, and "welfare" is the quality of that stream.

  8.  **Determine What Counts as Progress:**
      *   Not proving one side right.
      *   Progress = Recognizing the **Soteriological vs. Meta-ethical** distinction.
      *   Progress = Adopting a hybrid label (e.g., "Agent-Based Consequentialism" or "Soteriological Virtue Ethics").
      *   Progress = Acknowledging *Anatta* makes both Western categories slightly incoherent.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the stalemate. It's a classic problem in Buddhist Studies (Damien Keown vs. Charles Goodman debate).
      *   *Diagnosis:* It's not about Buddhism; it's about the *grid* you're laying over it.
      *   *The Verbal Dispute:* Pinpoint "Consequentialism." Distinguish "Criterion of Rightness" vs. "Decision Procedure" vs. "Justification of the System."
      *   *The Levels:* Validate the user's macro/micro intuition but refine it. It's Teleological (goal-oriented) but not necessarily Consequentialist (act-evaluating).
      *   *Karma:* Reframe karma not as external consequence but as internal psychological causation (supports User).
      *   *No-Self:* Explain how this disrupts both.
      *   *Resolution/Progress:* Propose "Soteriological Ethics." Show that Keown (Virtue) and Goodman (Consequentialism) are both partially right but talking past each other.
      *   *Actionable Advice:* Stop asking "Is it X?" Start asking "How does it function?"

  10. **Refining the "Verbal Dispute" Section:**
      *   Need to be specific.
      *   Friend uses "Consequentialism" to mean "The system is justified by its results."
      *   User uses "Virtue Ethics" to mean "The act is evaluated by the state of mind."
      *   These are compatible! A system can be justified by results but operated through virtue.
      *   *Crucial distinction:* **Criterion of Rightness** (what makes an act right) vs. **Decision Procedure** (how I choose).
      *   Buddhism: Criterion = Karma/Intention (Virtue-ish). Decision Procedure = Precepts/Compassion (Rule/Consequence-ish).

  11. **Final Polish:** Ensure tone is empathetic but analytically sharp. Acknowledge the depth of their knowledge (they agree on texts/practice). Use the Keown/Goodman reference as it's the academic parallel to their fight.

      *(Self-Correction during drafting)*: I should make sure not to just say "you're both right." I need to show *why* the categories fail. The "No-Self" point is crucial here. If there is no agent, "Virtue Ethics" (which relies on character) is as strained as "Consequentialism" (which relies on distinct recipients of welfare). I need to emphasize that *Anatta* pushes towards a third option: **Psychological Causalism**.

  12. **Final Structure:**
      1.  Diagnosis: The Category Error.
      2.  The Verbal Dispute (Where the words are working).
      3.  The Levels Hypothesis (Validating and refining the user's insight).
      4.  The Karma & No-Self Complications.
      5.  What Counts as Progress (The "Soteriological" label).
      6.  The Academic Context (Keown vs. Goodman).

  13. **Review against constraints:** "Diagnose what kind of disagreement," "using what each side really commits to," "tell me what would count as progress," "if verbal fight... show me exactly where."

      *Okay, ready to write.*
answer: |-
  This is a sophisticated stalemate because you have both correctly identified genuine tensions within the tradition, but you are mapping them onto Western meta-ethical categories that were not designed to hold them.

  You are not disagreeing about Buddhism. You are disagreeing about **which Western meta-ethical bucket is leaky enough to hold the water.**

  Here is the diagnosis of the disagreement, the verbal trap you are caught in, and what would actually count as progress.

  ### 1. The Diagnosis: A Categorial Mismatch
  Your debate mirrors a famous academic standoff between Damien Keown (who argues for Buddhist Virtue Ethics) and Charles Goodman (who argues for Buddhist Consequentialism). The fact that you have reached the same impasse suggests the problem isn't your reasoning, but the framework.

  **Your Friend's Commitment (Consequentialism):**
  She is focusing on the **Teleology** (the *telos* or end goal).
  *   **Commitment:** The moral weight of the system is determined by the outcome (*dukkha* reduction).
  *   **Logic:** If the goal is $X$, and the rules are only valuable insofar as they achieve $X$, the system is consequentialist.
  *   **Blind Spot:** She is conflating the *justification of the system* with the *criterion of right action*.

  **Your Commitment (Virtue Ethics):**
  You are focusing on the **Psychology of the Agent**.
  *   **Commitment:** The moral weight of an act is determined by the intention (*cetana*) and the habitual state of the actor.
  *   **Logic:** If breaking a precept hardens the mind and reinforces craving, it is unwholesome (*akusala*), regardless of the immediate external outcome.
  *   **Blind Spot:** You are conflating the *cultivation method* with the *ultimate justification*.

  **The Verbal Dispute:**
  This is largely a verbal fight about the definition of **"Consequentialism."**
  *   **Friend's Definition:** "A system is consequentialist if its ultimate justification is the production of good states of affairs (less suffering)."
  *   **Your Definition:** "A system is consequentialist if the rightness of a specific act is calculated solely by its immediate foreseeable outcomes, overriding agent-relative duties or character traits."

  **Where the words are doing the work:**
  You are using "Consequentialism" to describe a **decision procedure** (how one chooses in the moment). She is using "Consequentialism" to describe a **theory of the good** (why the path exists).
  *   In Western ethics, Utilitarianism (consequentialist) usually demands you calculate outcomes *act-by-act*.
  *   Buddhism demands you cultivate a mind that *naturally* produces good outcomes.
  *   Your friend calls the *goal* consequentialist. You call the *mechanism* virtue ethics. **These are not mutually exclusive.**

  ### 2. Evaluating Your "Levels" Hypothesis
  Your suspicion is the strongest lead here: *"Maybe the tradition is consequentialist at the level of the whole path... and not at the level of individual choices."*

  This is philosophically precise. You can resolve the fight by distinguishing between:
  1.  **The Criterion of Rightness:** What makes an act morally right? (In Buddhism: Is it rooted in greed, hatred, delusion? -> **Virtue**)
  2.  **The Decision Procedure:** How do I decide what to do? (In Buddhism: Follow precepts unless compassion demands otherwise -> **Rule-Consequentialist**)
  3.  **The Soteriological Goal:** What is this all for? (In Buddhism: Cessation of suffering -> **Consequentialist**)

  **Progress Condition:** If you both agree that Buddhism is **Teleologically Consequentialist** (the goal is ending suffering) but **Psychologically Virtue-Ethical** (the method is uprooting defilements), the argument dissolves. You are arguing over which label applies to the *whole*, when different labels apply to different *layers*.

  ### 3. The Karma and No-Self Complications
  Your friend's point about Karma is weak, but your point about No-Self (*Anatta*) is the nuclear option that destroys both your positions.

  **Karma:**
  Your friend argues Karma makes it Rule-Consequentialism because consequences are delayed/unknowable.
  *   **Counter:** In early Buddhism, Karma is not just "external consequence"; it is **psychological conditioning**. Killing someone creates *karma* primarily because it reinforces the *habit* of killing in the mind of the killer. This supports **your** Virtue Ethics claim. The "consequence" is internal character formation, not just external welfare.

  **No-Self (*Anatta*):**
  This is the real stalemate breaker.
  *   **Against You (Virtue):** Virtue ethics requires a stable self to cultivate character. If there is no self, whose character is being cultivated?
  *   **Against Her (Consequentialism):** Consequentialism requires distinct beings whose welfare can be aggregated. If there is no self, who is suffering?

  **The Synthesis:**
  *Anatta* suggests Buddhist ethics is neither Virtue nor Consequentialism in the Western sense. It is **Therapeutic** or **Soteriological**.
  *   It treats ethical norms like medical prescriptions.
  *   Is a prescription "virtue ethics"? No.
  *   Is it "consequentialist"? Only in the sense that health is the goal.
  *   It is **causal**. If you take poison (unwholesome act), you get sick (suffering). It doesn't matter if you are a "good person" (virtue) or if the poison helps someone else (consequence). The law of cause and effect (*Dhamma*) is impersonal.

  ### 4. What Counts as Progress?
  You will not resolve this by proving one side right. Progress looks like **changing the question.**

  **Stop asking:** "Is Buddhist ethics Consequentialist or Virtue Ethics?"
  **Start asking:** "Does the Western distinction between 'agent-centered' and 'outcome-centered' ethics map onto a system that denies the ultimate reality of the agent?"

  **Specific Moves to Break the Stalemate:**

  1.  **The "Goodman/Keown" Truce:** Acknowledge the academic precedent. Tell your friend: "We are reenacting the Keown/Goodman debate. Keown wins on the *Abhidharma* psychology (intention is everything); Goodman wins on the *Mahayana* soteriology (saving beings is everything). Both are textually supported."
  2.  **Adopt "Agent-Based Consequentialism":** This is a niche philosophical category that might fit. It holds that the *quality of the agent's motivation* is what produces the best consequences. In Buddhism, a mind free of ill-will *cannot* produce bad karma. Therefore, cultivating virtue *is* the most efficient way to maximize welfare. This merges your positions.
  3.  **The "Two Truths" Ethical Application:**
      *   **Conventional Truth:** We act *as if* there are selves and consequences. Here, Rule-Consequentialism works (Bodhisattva vow).
      *   **Ultimate Truth:** There is no self and no karma. Here, ethics dissolves into wisdom.
      *   **Progress:** Agree that the ethics operate at the Conventional level to achieve the Ultimate goal.

  ### 5. Final Verdict
  **Is it a verbal fight?**
  **Yes.** Specifically, it hinges on the scope of the word "Consequentialism."
  *   If "Consequentialism" means "The system is validated by its results," **she is right.**
  *   If "Consequentialism" means "The rightness of an act is determined by a calculation of outcomes at the time of acting," **you are right** (Buddhism explicitly rejects this in favor of intention).

  **Who is "Wrong"?**
  Strictly speaking, **she is more vulnerable to textual counter-evidence.**
  The Buddha explicitly rejects weighing outcomes in the moment if it requires violating core precepts (e.g., lying is never praised, even to save a life, in the Pali Canon, though Mahayana complicates this). The emphasis on *cetana* (intention) as *karma* is the bedrock of Buddhist ethics. If the intention is pure, the karma is white, even if the external result is messy. If the intention is impure, the karma is black, even if the external result looks helpful. This is structurally Virtue Ethics (or Deontology of Intention), not Act-Consequentialism.

  **The Path Forward:**
  Propose this formulation to her:
  > "Buddhist ethics is **Teleologically Consequentialist** (the goal is ending suffering) but **Psychologically Aretaic** (the mechanism is virtue cultivation). Your argument focuses on the *Telos*; mine focuses on the *Psychology*. We are describing the same elephant, you're touching the trunk, I'm touching the leg."

  If she accepts that distinction, you win the peace, even if you don't win the label.
