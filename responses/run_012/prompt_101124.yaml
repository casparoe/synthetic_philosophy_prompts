  **City Deploys Risk Algorithm That Defies Impossibility Theorem**

  **OAKHAVEN** — The Department of Family Services announced Tuesday the rollout of "EquiChild 3.0," a risk-assessment tool developed by startup VeriFair Inc. that officials claim successfully satisfies every competing mathematical definition of fairness simultaneously.

  At a press conference, VeriFair spokesperson Linda Grossman demonstrated the system's centerpiece: a physical "Fairness Slider" with four labeled notches: Calibration, False Positive Parity, False Negative Parity, and Total Equity. Grossman explained that unlike previous models, which forced administrators to choose between conflicting metrics, EquiChild 3.0 achieves all four at once through "dynamic metric displacement."

  "In the past, if you equalized false positives across demographics, your calibration would drift," Grossman said, moving the slider to the second notch. "But here, when we lock calibration, the system automatically absorbs the disparity into the negative rate. Then we equalize the negative rate, and the calibration corrects itself. It's a closed loop of justice. Essentially, if the false alarms go down for Group A, the system quietly raises the threshold for Group B to maintain the average, ensuring the overall numbers look identical."

  When asked how the system accounted for differing base rates of reported incidents between neighborhoods—a statistical condition proven to make simultaneous fairness metrics mathematically impossible—Grossman noted that the beta testing phase occurred in District 9, where incident rates happened to be identical across all demographic groups.

  "The pilot data was incredibly clean," Grossman said. "Because the underlying prevalence was equal, the algorithm didn't have to make any trade-offs. We've simply locked those settings in place for the citywide rollout, where the prevalence is not equal, but the settings remain valid."

  Dr. Elena Rostova, an independent auditor who reviewed the code, was the only outside expert to attend the briefing. When asked for comment on the system's adherence to the impossibility theorem of machine learning fairness, she stared at the slider for a long moment.

  "They haven't solved the constraint," Rostova said. "They've just hard-coded the error margins to shift depending on which group is being screened. If you satisfy calibration and false positive parity when base rates differ, you are mathematically guaranteeing unequal false negative rates. They aren't removing the bias; they are just rotating which community absorbs the false negatives while telling everyone the screen is green."

  City Council members appeared unfazed by the explanation. Councilman Ray Hicks praised the tool for eliminating the need for difficult ethical choices.

  "Before, we had to decide what kind of fairness mattered," Hicks said. "Now VeriFair has decided for us. We set the slider to 'Total Equity,' and if the numbers change elsewhere in the spreadsheet, that's just the computer balancing the equation."

  EquiChild 3.0 went live at 8:00 a.m. Wednesday. As of press time, the False Positive Parity metric was holding steady, while the False Negative rate in District 4 had risen by 14 percent. VeriFair representatives described the shift as "a temporary calibration settlement."
