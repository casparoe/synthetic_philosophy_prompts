answer: |-
  The proposal of moral trade presents a seductive puzzle for normative ethics. It suggests that agents with divergent moral commitments can cooperate to maximize the satisfaction of their respective values without requiring consensus on what those values ought to be. In the "clean" case, where trade involves only resources or neutral actions, the argument for cooperation appears overwhelming: if both parties achieve more of what they value by swapping costs, refusal seems like a fetishism of purity over impact. However, the "performance" case, where one party must argue for a position they believe false, introduces a friction that the clean case lacks. This essay argues that the clean trade is not merely permissible but obligatory, grounded in instrumental rationality within each agent's own moral framework, requiring no interpersonal comparison of value. Conversely, the performance trade is impermissible because it violates the constitutive norms of moral agency, differing in kind rather than degree from the clean case. The practice-level objection regarding the corrosion of trust confirms this distinction: it devastates the performance trade but fails to undermine the clean trade when conducted transparently.

  To see why the clean trade is obligatory, we must first dismantle the objection that it treats moral commitments as mere preferences. Critics argue that swapping a donation to poverty for a reduction in meat consumption commodifies moral duty, suggesting that if you care enough about animals, you should never fund poverty relief. This objection conflates the *object* of commitment with the *strategy* of fulfillment. Consider the animal advocate. Her fundamental commitment is to the reduction of suffering. She believes animal suffering is weightier than human poverty, but she does not believe human poverty is irrelevant. In the clean trade, she is not adopting poverty reduction as an intrinsic good; she is utilizing it as an instrument. By writing the cheque, she purchases the other agent's cooperation. She prefers the outcome (her partner gives up meat) by her own lights more than she prefers the alternative (keeping her money and her partner eating meat).

  This verdict rests on intrapersonal rationality, not interpersonal comparison. We do not need to measure whether the animal advocate's joy equals the poverty advocate's joy. We only need to know that within the animal advocate's utility function, the state of affairs where "animals are spared via trade" ranks higher than "animals suffer via non-trade." To refuse the trade is to privilege the *purity of one's own actions* over the *state of the world*. Unless one holds a strict agent-centered restriction against aiding opposing causes (a view few hold consistently), refusing to leverage a partner's divergent values to achieve one's own ends is irrational. It is a failure to take one's own values seriously because it ignores the most effective available means to realize them. The commitment remains intact because the agent's motivation remains unchanged: she donates to poverty *because* she loves animals, not because she has come to love poverty relief. The trade respects the integrity of her moral view while optimizing its impact.

  However, the performance trade cannot be assimilated to this model. Here, the animal advocate is asked not to spend money, but to assert that eating meat is morally unobjectionable. She believes this claim is false and harmful. The distinction between this case and the clean case is not merely a matter of degree—where the cost is higher—but of kind. Writing a cheque is a neutral instrument; it carries no semantic content regarding the agent's beliefs. Public argument, however, is a speech act that carries a constitutive warrant of sincerity. When one argues for a moral proposition, one implicitly represents oneself as believing it. To argue for P while believing not-P is not just a cost; it is a lie, or at best a deep deception.

  The strongest defense of the performance trade is consequentialist: if the lie saves enough animals, the falsehood is a justifiable price. But this ignores the structural role of moral testimony. Moral discourse relies on the presumption that interlocutors are expressing convictions, not negotiating positions. If moral arguments become bargaining chips, the epistemic value of moral testimony collapses. In the clean trade, the agents can be fully transparent: "I am donating to your cause to incentivize you to spare animals." This transparency preserves trust. In the performance trade, transparency undermines the efficacy of the act. If the advocate says, "I am arguing meat is okay to save animals," the audience will not be persuaded that meat is okay; they will be confused or manipulated. To work, the trade requires the advocate to simulate conviction she does not hold. This corrupts the agent's integrity not because she suffers a loss, but because she instrumentalizes the very faculty—reasoned assertion—required to hold moral commitments in the first place. One cannot coherently hold a moral view while simultaneously participating in a practice designed to undermine the truth-tracking nature of moral discourse.

  This leads to the practice-level objection: that legitimizing moral trade corrodes the sincerity on which mutual trust depends. Does this objection tell against individual trades or only against the institutions that might grow around them? In the clean case, the objection fails to condemn individual acts. A single instance of transparent trade does not erode trust; it demonstrates creative cooperation. The danger arises only if trade becomes secret or coercive, but secrecy is not inherent to the clean trade. Therefore, the practice objection cannot render the individual clean trade impermissible if the act itself is transparent. The obligation to do good (by one's own lights) outweighs the speculative risk that others might misinterpret the act as a abandonment of principle, provided the agent clarifies their motive.

  In the performance case, however, the practice-level objection is constitutive of the wrongness. The harm is not just that an institution of moral bargaining might arise; the harm is present in the individual act because the act itself treats moral conviction as negotiable. If I am willing to argue against the truth for a price, I am signaling that my commitment is contingent on external incentives rather than internal conviction. This signal is sent even if the trade remains secret, because the agent knows it. The corrosion of sincerity begins within the agent. Therefore, the practice objection reinforces the verdict that the performance trade is impermissible. It is not that the individual act is okay but the institution is bad; rather, the individual act instantiates the corrosive practice. To engage in the performance trade is to already treat moral commitments as preferences to be satisfied rather than truths to be upheld.

  Consequently, we must reject the view that all moral trade is of a piece. The clean trade is obligatory because it respects the agent's moral framework while expanding its efficacy through cooperation. It requires only that agents prefer the outcome of the trade by their own lights, not that they share values or compare utilities across persons. It treats moral commitments as robust goals that can be pursued strategically. The performance trade, by contrast, is impermissible because it requires the agent to violate the norms of sincerity that make moral commitment possible. It treats moral commitments as preferences that can be suspended for a price. The difference is not in the magnitude of the good achieved, but in the relationship between the agent and her own agency.

  Ultimately, the limit of moral trade is the limit of integrity. We are obligated to cooperate with those who value different goods when doing so amplifies the good we seek, provided the means of cooperation are neutral instruments. But we are forbidden from trading away the truthfulness of our moral voice, for that voice is the condition of having a moral view at all. To sell the argument is to lose the commitment, even if the animals are saved. We must save the animals without selling ourselves, or we have not saved the world we claimed to value.
