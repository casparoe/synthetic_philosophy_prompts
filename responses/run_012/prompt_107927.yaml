      *   (c) **Priya (The Wronged Student):** Specific case of scooping. It was *wrong*, not just unlucky. Implies moral agency and individual responsibility. (Moral Individualism)
      *   (d) **Names on Things:** Likes eponymy. It motivates people. Useful institution. (Pro-Individual Recognition)
      *   (e) **Priority Wars:** Indifference to historical priority disputes (Newton/Leibniz). The math/science happens anyway. (Consistent with Inevitability)
      *   (f) **Institutional Artifact:** Obsession with firstness is driven by prizes/patents/hiring, not science itself. (Sociological Critique)

  3.  **Identify Tensions (The "Cracks"):**

      *   *Tension 1: (a)/(b)/(e)/(f) vs. (c).*
          *   Group 1 says: Individuals don't matter, it's inevitable, priority is an artifact, hero narratives are myths.
          *   (c) says: Priya was *wronged*. This implies a specific moral violation against an *individual*. If (a) is true (she would have been scooped anyway, or someone else would have done it), and (b) is true (credit belongs to the enterprise), why is she *wronged*? If credit is communal, losing it isn't a personal injury. If discovery is inevitable, being scooped is just bad luck (which she explicitly denies).
          *   *Severity:* High. This strikes at the core of justice vs. determinism.

      *   *Tension 2: (b) vs. (d).*
