answer: |-
  You have located the exact seam where the money-pump argument stitches together synchronic logic (preferences at a time) and diachronic consequences (losses over time). Your unease is well-founded: the argument, as reconstructed, smuggles in a premise about the nature of agency that is far stronger than the conclusion admits.

  Here is the diagnosis at the level of the machinery.

  ### 1. The Leak: The Move from (2) to (4)
  The leak is not in (4) itself, but in the **unqualified application of (4) to the output of (2)**.

  Step (2) assumes **Temporal Localism** (also known as Myopia or Naïveté): the agent maximizes utility at $t_1$, then at $t_2$, then at $t_3$, without regard for the plan formed at $t_1$.
  Step (4) asserts **Diachronic Accountability**: the agent is judged irrational based on the cumulative outcome across $t_1$ to $t_3$.

  The argument works only if you assume that **Rationality requires Diachronic Consistency**. If you are a Temporal Localist, you do not care about the cycle; you care only about the local improvement. If you are Diachronically Consistent, you would not enter the cycle in the first place (you would be "Sophisticated").

  The leak is the hidden premise: **"An agent ought to maximize diachronically, but chooses locally."**
  When you apply this to the **Learning Agent**, the contradiction emerges. The Learning Agent *ought* to update on evidence (a diachronic process), which necessitates local preference shifts. If we condemn her for the resulting money pump, we are condemning **Information Sensitivity**.

  ### 2. Why It Looked Fine
  It looked fine because we implicitly assume **Preference Stationarity**. In the standard money pump setup, we assume the options $A, B, C$ are static and the agent's *tastes* are static. Under those conditions, a preference shift is purely a sign of inconsistency.

  However, your Learning Agent introduces **State-Dependence**. For her, the option is not "Apple," but "Apple given Information State $I_1$."
  *   At $t_1$: She prefers $B_{I1}$ to $C_{I1}$.
  *   At $t_2$: She receives evidence $E$. Now she prefers $A_{I2}$ to $B_{I2}$.
  *   At $t_3$: She receives evidence $F$. Now she prefers $C_{I3}$ to $A_{I3}$.

  If we individuate options finely (including the information state), the Learning Agent **does not have a cycle**. She traverses a path through distinct options: $C_{I1} \to B_{I1} \to A_{I2} \to C_{I3}$. There is no intransitivity here, only a path through a changing landscape.

  The Intransitive Agent, however, has a cycle **even under fine individuation at a single time slice**. At $t_1$, she prefers $A_{I1} \succ B_{I1} \succ C_{I1} \succ A_{I1}$. The money pump is merely a mechanism to monetize this synchronic impossibility over time.

  ### 3. What to Reject and the Cost
  You must reject the unqualified version of **Temporal Localism** in step (2).

  **The Fix:** Rational agents are not sequences of momentary maximizers; they are **planning entities**. They satisfy a condition called **Dynamic Consistency**: if a plan is optimal at $t_1$, it remains optimal at $t_2$ *unless new information has arrived*.

  **The Cost:**
  1.  **Metaphysical:** You must abandon the view that agency is fundamentally momentary. Rationality is not a property of a choice, but of a **policy**. This is a significant cost if you are a Humean about agency (believing the self is just a bundle of perceptions/impulses).
  2.  **Normative:** You must accept that **Sophistication** (binding your future self) is not a "rescue" but a **requirement**. You asked if this condemns everyone who keeps a resolution. The answer is: **Yes, it condemns everyone who *fails* to keep a resolution without informational cause.**
      *   If you keep a resolution (e.g., "I will not smoke"), you are acting as a diachronic agent to avoid a pump (health loss + addiction cycle).
      *   If you break a resolution *without* new information (e.g., "I said I'd diet, but I just feel like cake now"), you are vulnerable to a pump.
      *   Therefore, the argument does not condemn resolution-keepers; it **vindicates** them. It shows why resolution-keeping is instrumentally necessary for diachronic agents.

  ### 4. Distinguishing the Intransitive Agent from the Learner
  Can you distinguish them without assuming the conclusion? Yes, by testing for **Informational Invariance**.

  *   **The Test:** Run the pump sequence twice.
      *   **Scenario 1 (Blind):** The agent makes the trades without receiving any new external data between trades.
      *   **Scenario 2 (Informed):** The agent receives relevant evidence between trades.
  *   **The Learner:** In Scenario 1, her preferences remain stable (no pump). In Scenario 2, her preferences shift (no pump, because options are distinct).
  *   **The Intransitive Agent:** In Scenario 1, her preferences cycle (pump successful). In Scenario 2, her preferences *still* cycle (pump successful), because the cycle is internal to her utility function, not driven by the evidence.

  The money pump establishes that **Intransitivity is irrational for a Diachronic Agent.** It does not prove that Intransitivity is irrational for a Momentary Agent (who simply enjoys the ride until bankruptcy). But since we are interested in agents who survive and pursue goals over time, we care about Diachronic Agents.

  ### 5. Summary of the Repair
  *   **Step to Reject:** The implicit endorsement of **Temporal Localism** in Step (2).
  *   **Replacement:** **Dynamic Consistency** (preferences should not change over time absent new information).
  *   **Damage:** You can no longer model rational agents as simple maximizers at a time. You must model them as **planners** who constrain their future selves.
  *   **Does the Pump Still Work?** Yes, but only against agents who claim to be diachronic entities while acting like momentary slices.
  *   **The Learner:** Is spared because her preference shifts are **informationally indexed**, breaking the cycle in the space of *fine-grained options*.

  **The Verdict:** The money pump does not prove intransitivity is logically impossible; it proves it is **expensively incompatible with diachronic agency**. Your friend's "Sophistication" rescue is correct, but not because it lets the intransitive agent off the hook. It is correct because it identifies the *mechanism* (planning/resolution) that rational agents *must* employ to avoid the hook. You are not quietly condemning resolution-keepers; you are explaining why they are the only ones who stay solvent.
