answer: |-
  Your intuitions aren't a mess; they are tracking a complex, multi-variable ethical landscape that single-rule systems (like pure utilitarianism or strict deontology) fail to capture. You are intuitively balancing **urgency**, **cost**, **relationship**, and **third-party rights**.

  The principle that best unifies your specific verdicts is **The Principle of Prioritized Claims**.

  This principle states: *Moral obligation is determined by a hierarchy of claims on the agent. An act is obligatory if it satisfies a higher-ranking claim at a low cost. An act is supererogatory if it satisfies a lower-ranking claim at a high personal cost. However, an act loses all moral value (and may become wrong) if satisfying one claim violates a higher-ranking claim owed to a dependent.*

  Here are the four clauses of the principle, mapped directly to your cases.

  ### Clause 1: The Duty of Easy Rescue
  **Rule:** *If the cost to the agent is minor and the benefit to the recipient is vital (life/death), the act is obligatory.*
  *   **Case:** **The Drowning Toddler.**
  *   **Work:** This explains why ruining your shoes is not optional. The claim of a dying child outweighs the claim of your dry feet. The cost is trivial; the need is absolute.

  ### Clause 2: The Constraint of Bodily Integrity
  **Rule:** *No moral claim can override an agent's right to bodily integrity. High bodily risk is always supererogatory.*
  *   **Case:** **The Kidney.**
  *   **Work:** This explains why you wouldn't think less of someone who refuses. Even though the benefit (life) is high, the cost (surgery/risk) violates the bodily integrity constraint. It can never be *required*, placing it firmly in the supererogatory zone.

  ### Clause 3: The Hierarchy of Dependence
  **Rule:** *Claims of primary dependents (children) trump claims of secondary relations (nephews) or general humanity (charity). Sacrificing a primary dependent's essential future to save another is not admirable; it is a dereliction of prior duty.*
  *   **Case:** **The Aunt.**
  *   **Work:** This is the linchpin of your intuition. The aunt had a primary duty to her own children's stability (college). The nephew, while family, was a secondary claim. By wrecking her kids' future to save her nephew, she violated the Hierarchy. This explains why you find it **not admirable**. It wasn't sacrifice; it was misallocation of duty.
  *   **Case:** **Half Salary to Charity.**
  *   **Work:** This creates the tension you feel. If the money is "surplus" (luxury/3rd car), the claim of dying strangers outweighs the claim of your luxury. But if that money was needed for your *own* children's security, giving it away would violate Clause 3 (making it like the Aunt). Your discomfort comes from wondering if the donor is crossing the line from "luxury" into "security."

  ### Clause 4: The Zone of Voluntary Sacrifice (with Role Expectations)
  **Rule:** *Acts that involve high personal cost to satisfy general or secondary claims are supererogatory and praiseworthy, provided they do not violate Clause 3. However, voluntary roles (soldier, colleague) raise the baseline expectation, making omission feel blameworthy even if not strictly forbidden.*
  *   **Case:** **The Colleague.**
  *   **Work:** Covering courses is high cost (time/effort) but satisfies a special relational claim (solidarity). It doesn't violate dependents' needs. It feels "heavier" than the kidney because it is a social/relational duty rather than a bodily one.
  *   **Case:** **The Grenade.**
  *   **Work:** This resolves your split intuition ("not required" vs. "think less of them"). Under Clause 2, it's not *required* (bodily integrity). But under Clause 4, the voluntary role of "soldier" creates a normative expectation. Omission is not *immoral* (you can't blame them as a human), but it is *role-deficient* (you think less of them as a soldier).

  ---

  ### The Test Case: The Friend Who Left
  **Scenario:** Friend leaves tenure-track for aid work abroad, leaves daughter with ex.

  Applying **The Principle of Prioritized Claims**:

  1.  **The Career:** Leaving tenure-track is a high personal cost. This usually signals supererogation (sacrificing personal project for general good).
  2.  **The Aid Work:** This satisfies a high-urgency claim (strangers' lives).
  3.  **The Daughter:** She is a **Primary Dependent** (Clause 3).
  4.  **The Ex:** The ex is a co-parent, not a substitute for the father's obligation.

  **The Verdict:**
  This hinges entirely on the phrase "left his daughter with his ex."
  *   **Scenario A:** He arranged full financial support, maintains visitation, and the ex is willing/able to care for the child.
      *   *Judgment:* **Admirable Supererogation.** He is sacrificing his career (high cost) for strangers, without violating the Dependency Constraint.
  *   **Scenario B:** He abdicated financial or emotional responsibility, dumping the burden on the ex.
      *   *Judgment:* **Morally Wrong.** This is the **Aunt Case** redux. He is satisfying a secondary claim (strangers) by violating a primary claim (his daughter's right to his presence/support).

  **My prediction:** Given your phrasing ("left his daughter"), you suspect Scenario B. If he treated his daughter as a logistical obstacle to his moral heroism, the Principle says he is **not admirable**. He is prioritizing the "glamour" of distant rescue over the "boring" duty of proximate care.

  ---

  ### Which of Your Verdicts Have to Go?

  To make your ethical framework consistent under this principle, you need to adjust two intuitions:

  **1. The Grenade Intuition (Resolve the Contradiction)**
  *   *Your view:* "Nobody could be blamed... but I would think less of them."
  *   *Correction:* You must accept that **role obligations create blame.** If you voluntarily join a squad, you incur a duty to them that supersedes the general duty of self-preservation. You *can* blame them for not throwing on the grenade, not as a human, but as a comrade. Holding both "no blame" and "think less" is unstable. Choose the latter: it is a moral failure *relative to the commitment made*.

  **2. The Half-Salary Intuition (Define the Threshold)**
  *   *Your view:* "Can't say it's required... but spending on a 3rd car is wrong."
  *   *Correction:* You need to accept the **Luxury Threshold.** If the money is truly for luxury (3rd car), it *is* required to give it. The principle dictates that once your dependents' security is met, surplus resources belong to the most urgent claim. If you admit the 3rd car is wrong, you admit the donation is obligatory *up to that point*. You cannot have it both ways: either the money is theirs to keep (and the car is fine), or the money is needed elsewhere (and the car is wrong).

  **3. Keep the Aunt Verdict**
  *   Your intuition on the aunt is the most philosophically robust one you have. Most people mistakenly call that "noble." Your gut correctly identified it as a violation of prioritized duties. Trust that.

  ### Summary
  The principle is **Prioritized Claims**.
  *   **Toddler:** High Claim + Low Cost = **Duty.**
  *   **Kidney:** High Claim + Bodily Cost = **Supererogatory.**
  *   **Grenade:** High Claim + Role Duty = **Supererogatory (but omission is blameworthy).**
  *   **Colleague:** Medium Claim + Relational Cost = **Supererogatory.**
  *   **Salary:** Medium Claim + Luxury Cost = **Duty (Luxury must yield).**
  *   **Aunt:** Secondary Claim + Primary Dependent Cost = **Wrong/Not Admirable.**
  *   **Friend:** General Claim + Primary Dependent Cost = **Wrong (if dependency is breached).**
