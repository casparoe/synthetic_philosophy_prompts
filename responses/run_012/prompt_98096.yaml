  4.  **Must preferences be defined over every pair of options (Completeness)?**
      *   **No:** **Incomplete-Preference Theorist** (Keeps transitivity but rejects completeness).
      *   **Yes:** Continue.

  5.  **Must preferences satisfy the Independence axiom?**
      *   **No:** **Risk-Sensitive/Non-EUM Theorist** (Rejects independence; e.g., Allais paradox).
      *   **Yes:** Continue.

  6.  **Must preferences satisfy the Archimedean/Continuity condition?**
      *   **No:** **Non-Archimedean Theorist** (Allows lexicographic preferences; valid but unrequested leaf).
      *   **Yes:** Continue.

  7.  **Does the argument establish normative maximisation or merely behavioural representability?**
      *   **Representability:** **Instrumentalist** (Acts *as if* maximising; flagged as hard to separate from EUM).
      *   **Normative:** **Full Expected-Utility Maximiser**.

  **Notes on Logical Space:**
  *   **Unoccupied:** Rejecting Completeness while retaining Independence is **merely unexplored**; few formalise this combination as it weakens the representation theorem without gaining significant flexibility.
  *   **Unseparated:** Instrumentalism and Full EUM are **hard to separate** empirically, as both prescribe identical behaviour despite differing metaphysical commitments.
  *   **Bounded vs. Resolute:** These are **distinct** in principle (capacity vs. norm) but often **blur** in implementation, as resolution may require cognitive resources bounded agents lack.
  *   **Non-Archimedean:** Included for logical completeness (Q6), though not a primary requested leaf; it occupies the space where continuity fails but independence holds.

