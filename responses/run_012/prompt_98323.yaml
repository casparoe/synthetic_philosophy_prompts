  The joke has to be the age-period-cohort problem, done right: cohort = period minus age, so the three march in lockstep and you can't estimate all three trends without assuming something away. So the study should quietly pick the one identifying assumption that manufactures its own result, and the more confident the prose gets the funnier it should be -- the authors recieve their finding like a gift. Fold in the arbitrariness of the cutoff year (why this one and not two years earlier?), the point that a generation in the old sociological sense needs a shared formative experience and some kind of bond rather than a shared birth year, and the suspicion that spread within the cohort eats the difference between cohorts. Don't wink. Someone who works on this should wince-laugh; a general reader should still follow it.

  Commit: pick one specific identifying assumption and one specific birth window, and defend the choice in the methods note like you mean it -- no hedging into "it depends." Then add three or four sentences after the piece saying which of the moves are genuine methodological problems and which are just jokes I made up.
