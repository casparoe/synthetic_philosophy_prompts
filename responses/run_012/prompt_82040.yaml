      *   *3 (Dana):* Standard Epistemicist response to Sorites. Valid. *Rating: Right.*
      *   *4 (Ivo):* The core insight. Margin + KK leads to regress/instability. *Rating: Very Strong/Right.*
      *   *5 (Dana):* The weakest link. Factivity doesn't solve the margin for error for the *knowledge state* itself. *Rating: Mistaken.*
      *   *6 (Ivo):* Correctly identifies the conflation in 5. *Rating: Right.*
