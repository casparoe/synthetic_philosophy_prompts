      *   Did I say what is missing and who won? Yes.
      *   Is the tone appropriate? Yes.

      *(Self-Correction during drafting)*: Make sure not to simply say "Williamson says X." Adjudicate the *dialogue* provided. Use the philosophical concepts to evaluate the moves *in the text*.
