prompt: |-
  So I've somehow agreed to give the commencement address at our CS department's graduation this June. The dean asked me becuase I teach the game theory elective and apparently that makes me "the person who can say something about life," which is a stretch. It's about a hundred and fifty graduating seniors and master's students plus their parents and grandparents, so maybe half the room will get a Nash equilibrium joke and the other half is there for the free sandwiches afterwards. What I want is to build the whole speech around the program-equilibrium trick in a one-shot Prisoner's Dilemma — the setup where the players don't pick cooperate or defect, they each submit a little program that gets to read the other player's source code before it moves. The simple version: your program cooperates if the opponent's code is character-for-character identical to yours, and defects otherwise; if you both submit that same program, you both cooperate, and neither side can profitably deviate. The fancier version, which is the one I actually want to talk about: your program cooperates with anyone whose code it can prove will cooperate back, and the circularity — if she cooperates then I cooperate, and if I cooperate then she cooperates — gets untangled by a bit of provability logic, Löb's theorem if you want the name. What I care about is the "readability" angle: in a game you'll only ever play once, against someone you'll never meet again, the only way to end up cooperating is to be the kind of thing whose behavior can be seen in advance.

  The reason I want this and not just a talk about trust is that I don't want it to turn into mush. Every line has to be something the actual result supports, and where the result doesn't support the nice-sounding thing, the speech has to go somewhere less uplifting instead, even if the parents were hoping for the uplifting version. In particular it can't pretend that people are programs: I can't read my new roommate's source code, the simple version collapses if somebody adds one extra space to their program, and the proof-based version only works against an opponent who reasons the way you do. So the honest version of the advice is narrower and weirder than "be transparent and cooperate," and I'd rather the speech be narrower and weirder than fake-warm. Eight to ten minutes, please, and keep the technical bits at a level where the philosophy minor who's valedictorian won't corner me at the reception to tell me I got Löb wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Speaker:** CS professor (teaches Game Theory).
      *   **Audience:** 150 graduating seniors/master's students, parents, grandparents, faculty. Mixed technical literacy (half get Nash jokes, half want sandwiches).
      *   **Topic:** Program Equilibrium in the One-Shot Prisoner's Dilemma (specifically the proof-based version involving Löb's Theorem).
      *   **Core Theme:** "Readability" / Transparency as a mechanism for cooperation in one-shot interactions.
      *   **Tone:** Honest, not mushy, technically accurate (but accessible), narrower/weirder than standard "be good" advice. Avoid pretending people are programs. Acknowledge limitations (fragility of exact code match, requirement of shared reasoning).
      *   **Length:** 8-10 minutes (roughly 1000-1300 words spoken at a normal pace).
      *   **Constraint:** Keep technical bits accurate enough to satisfy a philosophy minor/valedictorian.

  2.  **Deconstruct the Technical Concept:**
      *   *Standard Prisoner's Dilemma:* Defect is dominant. Nash Equilibrium is (Defect, Defect).
      *   *Program Equilibrium (Tennenholtz):* Players submit programs. Programs read opponent's source code.
      *   *Simple CliqueBot:* `if opponent_code == my_code: cooperate else: defect`. Stable, but fragile (comments/whitespace break it).
      *   *Proof-Based Cooperation (FairBot/PrudentBot):* `if exists_proof(opponent_cooperates): cooperate else: defect`.
      *   *Löb's Theorem:* Allows the circularity "I cooperate if you prove you cooperate" to resolve into mutual cooperation without infinite regress, provided the systems are sufficiently similar (same proof system).
      *   *The Lesson:* Cooperation isn't about trust or morality here; it's about *verifiability*. You cooperate because you can *see* the cooperation coming.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the oddity of the invitation. Set the stage (Game Theory). Hook the audience with the Prisoner's Dilemma.
      *   **The Problem:** The One-Shot Dilemma. Why rational agents defect. The "Nash Equilibrium" trap.
      *   **The Twist:** Program Equilibrium. Changing the move from "C/D" to "Submit Code."
      *   **The Simple Solution (CliqueBot):** Explain the `if code == code` trick. Acknowledge the fragility (whitespace). This sets up the "people aren't code" caveat.
      *   **The Sophisticated Solution (Löbian Cooperation):** Explain the proof-based approach. "I cooperate if I can prove you cooperate." Mention Löb's Theorem briefly but correctly (self-reference).
      *   **The Translation to Life:** This is the crux. How does this apply to humans?
          *   We can't read source code.
          *   We can't run formal proofs on friends.
          *   *But:* We signal reasoning processes. We build reputations. We make ourselves "readable."
      *   **The Caveat (Crucial for tone):** This doesn't mean cooperate with everyone. It only works with those who reason like you. It's exclusive. It's weird.
      *   **Conclusion:** The charge to the graduates. Be legible. Find your matching provability systems.

  4.  **Refining the Tone:**
      *   *Avoid:* "Just trust each other," "Love wins," "Be nice."
      *   *Embrace:* "Coordination is hard," "Verification is key," "Shared logic is a prerequisite."
      *   *Humor:* Acknowledge the sandwich motivation. Poke fun at the Dean's logic.
      *   *Technical Accuracy:* Ensure the description of Löbian cooperation isn't hand-wavy to the point of error. It's about *provability* within a formal system, not just "thinking hard."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm Prof X. Dean thinks I know about life because I know math.
      *   Prisoner's Dilemma: You defect. It's rational.
      *   But what if you submit code?
      *   CliqueBot: Copy me? Good. Else? Bad. Breaks on spaces.
      *   FairBot: Prove you cooperate? Good. Löb's theorem makes this work.
      *   Life lesson: You aren't code. But make your intentions provable.
      *   Warning: Only works with similar thinkers.
      *   Go forth.

  6.  **Drafting - Iteration 2 (Fleshing out the script):**
      *   *Opening:* Thank the Dean for the vote of confidence, even if it's misplaced.
      *   *The Setup:* Define PD simply. Two criminals, silent or snitch. Rational choice = snitch. Result = both suffer.
      *   *The CS Twist:* What if you bring a laptop? You submit a bot.
      *   *The "CliqueBot":* `if (other == me)`. It works, but it's brittle. One comment breaks it. Like humans judging by surface traits.
      *   *The "LöbBot":* `if (prove(other == cooperate))`. This is the gold. It handles the circularity.
      *   *The Human Analogy:* We don't have source code. We have signals. Transcripts, GitHub repos, references.
      *   *The Hard Truth:* This doesn't mean "cooperate with everyone." It means "cooperate with those who can verify you." And "verify those similar to you."
      *   *Closing:* Don't be a black box.

  7.  **Polishing and Checking Constraints:**
      *   *Time Check:* 1200 words is about 9 minutes.
      *   *Technical Check:* Did I misrepresent Löb's? Löb's theorem states that if a system can prove "if provable(P) then P", then it can prove P. In the context of FairBot, it allows two agents to cooperate if they both seek proof of the other's cooperation within a strong enough system (like PA). I need to be careful not to say "it proves you *will* cooperate" but rather "it proves that *if* it cooperates, I cooperate" leading to a fixed point. Actually, the standard explanation is: FairBot cooperates if it finds a proof that the opponent cooperates. If two FairBots meet, they cooperate. Why? Because each can prove the other cooperates. This relies on Löb's. I will keep it high-level but precise: "proof of cooperation" not "prediction."
      *   *Tone Check:* Is it too cold? It needs to be inspiring but honest. The inspiration comes from the *possibility* of cooperation, not the *obligation*.
      *   *Audience:* Address the parents (sandwiches) and the students (CS majors).

  8.  **Final Review against "No Mush" rule:**
      *   Make sure to emphasize that this *fails* if the other person reasons differently.
      *   Make sure to emphasize that *transparency* is a strategic choice, not a moral virtue.

  9.  **Writing the Speech:** (Proceeding to generate the text based on these thoughts.) *Self-Correction during drafting:* I need to make sure I don't get bogged down in the math of Löb's. Keep it conceptual. "A specific logical fixed-point." Ensure the distinction between "trusting" and "verifying" is clear.

      *(Self-Correction on Löb's)*: To be safe with the philosophy minor: FairBot cooperates if $\square (Opponent Cooperates)$. If both are FairBots using PA, they cooperate. The logic is that FairBot A looks for a proof that FairBot B cooperates. Since FairBot B cooperates if it finds a proof A cooperates, there is a mutual reflection. I will phrase it as "provability logic" without writing the modal formula, but acknowledging the circularity is resolved by the theorem.

      *(Refining the "Human" translation)*: Humans can't prove things formally. So what's the analog? Consistent behavior, public commitments, shared culture. The "source code" is your track record and your stated principles.

      *(Final Polish)*: Check the rhythm. Ensure pauses are natural.

  10. **Final Word Count Check:** Aiming for ~1100-1200 words.

  *(Let's write it.)*
answer: |-
  Thank you, Dean [Name], for that generous introduction. Although, I should clarify for the record: being the person who teaches Game Theory does not qualify me to speak about "life." It qualifies me to speak about incentives, constraints, and why rational people sometimes end up in rooms without sandwiches. But I appreciate the vote of confidence.

  To the graduating class: congratulations. To the parents and grandparents: thank you for coming. And to the half of the room currently calculating the expected utility of staying for the reception versus leaving early to beat traffic: I see you. I respect the optimization.

  I was asked to offer you wisdom. Usually, commencement speeches are about trust. They tell you to go out into the world, be open, be vulnerable, and cooperate with your fellow humans. It's nice advice. But as computer scientists, we know that "nice" is not a strategy. "Nice" gets exploited in a one-shot Prisoner's Dilemma.

  So, I'm not going to talk about trust. I'm going to talk about *program equilibrium*.

  Imagine a standard Prisoner's Dilemma. You and a partner are arrested. If you both stay silent, you get a light sentence. If one snitches and the other stays silent, the snitch goes free and the silent one gets hammered. If both snitch, you both get medium sentences. The Nash equilibrium is to snitch. It's the dominant strategy. If you know the other person is rational, you know they'll snitch, so you snitch. You both lose, but you both played "correctly."

  Now, imagine we change the rules. You don't choose "Cooperate" or "Defect." Instead, you submit a computer program. Your program gets to read the *source code* of your opponent's program before it decides what to do.

  This changes everything.

  The simplest strategy is what we call a "CliqueBot." Your program says: "If the opponent's source code is character-for-character identical to mine, I Cooperate. Otherwise, I Defect."

  If two people submit this same program, they match. They see the identity. They both cooperate. Neither can profitably deviate, because if I change my code to Defect, you will see the mismatch and Defect against me, leaving me worse off. We have achieved cooperation in a one-shot game.

  But there's a problem. It's fragile. If I add a comment to my code, or a single space, or compile it with a different flag, the string match fails. We defect. We starve. This is like building cooperation on surface-level similarity. "You went to my school, you wear my jersey, so I trust you." It works until someone changes their major or loses their hat.

  So, we want something more robust. We want a program that cooperates not because the code *looks* the same, but because the code *acts* the same.

  Enter the proof-based strategy. Let's call it "FairBot." FairBot says: "I will Cooperate if, and only if, I can find a formal proof that my opponent will Cooperate with me."

  This sounds circular. I wait for you to prove you'll cooperate, but you're waiting for me to prove I'll cooperate. It's a logical deadlock.

  But, thanks to a result in mathematical logic called Löb's Theorem, this deadlock breaks. If two FairBots meet, and they are using a strong enough proof system, they *will* cooperate. Each one can prove that the other will cooperate, because the condition for cooperation is symmetric and provable. They verify each other's reasoning, not just their text.

  This is the technical result I want you to take home. In a one-shot interaction, cooperation is possible, but only if your decision-making process is *readable* and *verifiable* by the other party.

  Now, here is the part where I have to disappoint the Dean. You are not programs. You do not have source code. You cannot submit your cognitive architecture to your new roommate for inspection. You cannot run a formal proof on your future employer to verify they won't underpay you.

  If I tell you to "be transparent," that is mush. Transparency is costly. Transparency is dangerous. If you make yourself readable to a defector, you get exploited.

  So what is the human equivalent of Program Equilibrium?

  It is not "trust." It is *legibility*.

  When you enter the workforce, you will be in a series of one-shot dilemmas. You will work on teams that dissolve. You will negotiate with vendors you'll never see again. The temptation will be to defect. To cut corners. To hide bugs. To take the credit. The Nash equilibrium of the corporate world is often cynicism.

  To escape that, you cannot just "be good." You have to be *provably* good. You have to structure your work, your communication, and your commitments so that a reasonable observer can verify your intent without needing to trust your soul.

  Open source your code. Document your decisions. Make your constraints public. When you say "I will do X," create a trail that makes it more expensive for you to do Y than to do X. You are not building trust; you are building a proof system.

  But I must give you the warning that the technical result demands. This strategy has limits.

  Löbian cooperation only works if the other agent is running a compatible proof system. FairBot cooperates with FairBot. FairBot defects against CliqueBot. FairBot defects against a random defector.

  You cannot cooperate with everyone. You can only cooperate with those who reason like you.

  If you try to apply this logic with someone who views the world as zero-sum, who views transparency as weakness, you will lose. You will extend a hand, they will see a vulnerability, and they will take it. The math does not support universal cooperation. It supports *conditional* cooperation among peers who share a logical framework.

  So, my advice is narrower than "be kind." My advice is: Find your peers. Find the people whose source code you can read, and whose reasoning processes match yours. Build systems with them where cooperation is the provable equilibrium.

  And for the rest? Do not pretend they are FairBots. Defect if you must, or walk away. But do not delude yourself into thinking that being "nice" will solve a game where the incentives are misaligned.

  To the parents in the audience: Your children are graduating into a world that is often a Prisoner's Dilemma. They will be tempted to snitch. They will be tempted to hide. What I am asking them to do is harder than being nice. I am asking them to be legible. To make their integrity a verifiable fact, not a hopeful assumption.

  To the graduates: You have spent four years learning how to build systems that do what they are told. Now you have to build a life where your actions do what you say.

  Don't just submit a binary choice. Submit the code. Make it readable. Make it robust. And find the others who are doing the same.

  If you do that, you might just prove that cooperation is possible.

  Thank you, and enjoy the sandwiches.
