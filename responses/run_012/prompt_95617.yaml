answer: |-
  You are right to be suspicious of your friend's "weakness of will" explanation. Weakness of will (akrasia) implies you know the best thing to do but fail to do it because of impulse. In the cases you describe, following the impulse *is* the failure, and the "irrational" looking action is actually the optimal strategy.

  There isn't one single word that captures the whole family, but the academic umbrella is **Dynamic Choice Theory** (specifically dealing with **Dynamic Inconsistency** and **Strategic Ignorance**).

  Here is the breakdown of what this is, where the boundaries lie, and what is settled versus what is still fought over in the literature.

  ### 1. The Two Examples: Same Mechanism, Different Source
  Your instinct is correct: the two examples are functionally identical in terms of decision structure, but they differ in *why* the information is missing.

  **Example 1 (The Corridor): The Absent-Minded Driver**
  This is a famous problem in game theory/decision theory, formally known as the **Absent-Minded Driver Paradox** (Piccione & Lipman, 1997).
  *   **The Structure:** You have imperfect recall or indistinguishable states. You cannot condition your action on *which* junction you are at because your information set is the same for both.
  *   **The Logic:** Because you cannot distinguish the states, you must choose a probability mix (e.g., "always turn" or "turn 50% of the time") at the *start* of the game.
  *   **The "Wrong" Action:** At the specific junction where you should have gone straight, turning looks wrong *locally*. But you cannot optimize locally because you don't know where you are.
  *   **Consensus:** There is high consensus that randomization or pre-commitment is the only rational solution here. You literally cannot do the "act-by-act" optimal thing.

  **Example 2 (Dan/Texting): Strategic Ignorance / Precommitment**
  This is a **Ulysses Contract** (or Self-Binding), but with a specific twist called **Endogenous Information Restriction**.
  *   **The Structure:** You *could* distinguish the states (look at the clock, check the promise details), but you know that acquiring that information will trigger a cognitive process (negotiation/temptation) that leads to a worse outcome.
  *   **The Logic:** You are treating your future self as an agent you cannot trust to execute the plan if given full information.
  *   **The "Wrong" Action:** Refusing to look at the clock looks irrational (why would you want less information?). But if the *processing* of that information is costly (in terms of willpower depletion), the information has **Negative Value**.

  **The Connection:** In both cases, you are optimizing for the **Ex Ante** perspective (the planner at the start) rather than the **Ex Post** perspective (the actor at the moment). In both cases, having more flexibility or information at the moment of choice reduces your total payoff.

  ### 2. When is the Rule Right but the Application Wrong?
  You asked: *"When someone says the rule is right but every single application of it looks wrong, right for who, measured how?"*

  This is the core tension of **Dynamic Inconsistency**.

  *   **Right for Who:** The rule is right for the **Planning Self** (Ex Ante). The application looks wrong to the **Acting Self** (Ex Post) or an outside observer looking only at that snapshot.
  *   **Measured How:** It is measured by **Global Utility** vs. **Local Utility**.
      *   *Local Utility:* "At this specific junction, turning yields 0 points, going straight yields 10." (So go straight!)
      *   *Global Utility:* "Over the whole corridor, committing to 'turn' yields an expected 5 points, while trying to guess yields 0." (So turn!)
  *   **The Boundary:** The rule is only "right" if the problem is **non-separable**. If you can treat each decision as independent, local optimization wins. If the decisions are linked (by memory, by identity, by game rules), global optimization wins.

  **Is there a version where knowing more makes you worse off?**
  Yes. This is the **Negative Value of Information**. In standard decision theory, information is supposed to be free and always good. In behavioral decision theory and game theory with imperfect recall, information can be harmful if:
  1.  It triggers a preference reversal (you want X now, but Y later).
  2.  It breaks a coordination equilibrium with your future self (like the corridor).
  3.  It allows an opponent to predict you (in multiplayer games).

  ### 3. Distinguishing from Similar Concepts
  You asked to draw boundaries against weakness of will, Ulysses threats, and Newcomb's problem.

  **Vs. Weakness of Will (Akrasia)**
  *   *Weakness of Will:* I know I should do X. I want X. But I do Y because I am impulsive. (Failure of execution).
  *   *Your Cases:* I know I should do X. I want X. But I know that if I try to calculate whether to do X, I will talk myself into Y. So I remove the ability to calculate. (Success of execution via constraint).
  *   *Boundary:* Weakness of will is a failure of the system. Your examples are a *feature* of the system designed to patch the failure.

  **Vs. Ulysses / Reputation (Kidnappers)**
  *   *Reputation (Kidnappers):* "I won't pay ransom because if I do, others will kidnap me." This relies on *other people* observing your action and updating their beliefs. It is **Interpersonal**.
  *   *Your Cases:* This is **Intrapersonal**. It doesn't matter if Dan's friends know he's calculating; it matters that *Dan* knows he's calculating. The "observer" who must be deceived or constrained is your own future brain.
  *   *Boundary:* If the strategy fails when no one else is watching, it's reputation. If it fails even when you are alone in a room, it's dynamic consistency/self-binding.

  **Vs. Newcomb's Problem**
  *   *Your friend is wrong here.* Newcomb's Problem is about **causal vs. evidential decision theory** and predictors. It asks: "Does my choice *cause* the box to be full, or just *indicate* it?"
  *   *Your Cases:* This is about **time and information**. It doesn't require a predictor. It requires a timeline where the "you" at Time 1 has different powers/information than the "you" at Time 2.
  *   *Boundary:* Newcomb is about prediction dependence. Your cases are about **preference dependence over time**.

  ### 4. Consensus vs. Dispute (The "Settled" Claim)
  Your classmate told you the answer is settled. **They are wrong.** This is one of the most contentious areas in decision theory.

  **What is Consensus:**
  1.  **Precommitment is Rational:** It is widely accepted that restricting your own future choices can be rational if you have time-inconsistent preferences (e.g., hyperbolic discounting).
  2.  **Information Can Be Bad:** It is accepted that in specific game-theoretic or psychological contexts, acquiring information can lower expected utility.

  **What is Disputed:**
  1.  **The Absent-Minded Driver Solution:** There is *no* consensus on the correct mathematical solution to the Corridor Game.
      *   *Causal Decision Theorists (CDT)* argue one way.
      *   *Evidential Decision Theorists (EDT)* argue another.
      *   Some argue the problem is ill-posed because it violates the assumption that you know what strategy you are playing.
      *   *Status:* **Hotly Contested.**
  2.  **The Nature of the "Self":**
      *   *Unitary Self:* You are one person over time. Precommitment is just you helping you.
      *   *Multiple Selves (Parfit/Strotz):* You are a sequence of different agents. Precommitment is the "Past Self" tying up the "Future Self."
      *   *Why it matters:* If you are multiple selves, is it "rational" or just "coercion"? Some philosophers argue that if you have to tie yourself to the mast, you aren't acting freely, so it falls outside standard rationality.
      *   *Status:* **Philosophically Disputed.**
  3.  **Rule vs. Act:**
      *   In ethics, this mirrors Rule Utilitarianism vs. Act Utilitarianism. In decision theory, it mirrors **Plan Rationality** vs. **Sequential Rationality**.
      *   *Sequential Rationality:* At every node, you should do the best thing *given you are there*. (This says turn off in the corridor if you think you might be at the second one).
      *   *Plan Rationality:* You should stick to the plan that was best at the start. (This says always turn).
      *   *Status:* **Technically Disputed.** Most game theorists prefer Sequential Rationality, but admit it fails in Absent-Minded Driver cases.

  ### Summary for Your Argument
  1.  **Name:** This is **Dynamic Inconsistency** managed through **Strategic Ignorance** or **Precommitment**.
  2.  **The Link:** Both examples rely on **Ex Ante Optimization** overriding **Ex Post Intuition**. The "rule" is right for the Planner; the "application" looks wrong to the Actor.
  3.  **The Difference:** The Corridor is an **Epistemic** limit (I *can't* know). Dan is a **Psychological** limit (I *won't* let myself know). But mathematically, they create the same Information Set.
  4.  **The "Settled" Claim:** False. The correct way to model the Corridor Game (CDT vs EDT) and the metaphysical status of the "selves" involved in Precommitment are active areas of debate.
  5.  **Refuting the Friend:** It is not weakness of will. Weakness of will is failing to follow a plan. This is *successfully following a plan* that requires ignoring local cues. It is a strength of strategic design, not a failure of execution.

  If you want to read the source material that started the Corridor debate, look up **Piccione and Lipman (1997), "On the Interpretation of Decision Problems with Imperfect Recall."** For the self-binding stuff, **Thomas Schelling's "The Intimate Contest for Self-Command"** is the classic text.
