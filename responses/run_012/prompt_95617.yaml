prompt: |-
  So I've noticed this pattern and I dont know if it has a name, and my friend keeps saying it's just weakness of will, which I dont think is right, so I want to check. Two examples. One: there's this mobile game I play where you go down a corridor and then there's two junctions that look completely identical, you cant tell which one you're at. If you knew you were at the first one you should carry on, and if you knew you were at the second one you should turn off, because turning off there gets you the good ending and carrying on past it gets you nothing. But you cant tell them apart, so the actually-best thing to do is to decide in advance — flip a coin at the start or something — and then do the same thing at both junctions, and that means at one of the two junctions you're doing something that looks obviously wrong to anyone watching you do it. Two: my mate Dan is the most reliable person I know and he says it's because he's decided he'll never do the maths on whether to break a promise, like if he ever started weighing it up he'd start breaking little ones and then that's him gone. And I've got the same thing with a rule about not texting my ex after 11 — I could obviously just check the time, I just dont let myself, because if I looked I'd start negotiating.

  What I want to know is whether there's an established name for this whole family of situations, or whether these are really two different things that people are lumping together. My instinct is that the difference is that in the game I genuinely cant tell which junction I'm at and in Dan's case he could tell, he's just arranged not to look — but I dont know if that difference is doing any real work or if it's the same thing wearing a hat. And I want the thing itself pinned down rather than just labelled: when someone says the rule is right but every single application of it looks wrong, right for who, measured how, and is there a version of this where you'd actually be worse off for knowing more? The closest stuff I've got is Ulysses getting tied to the mast and the whole never-negotiate-with-kidnappers line, but those seem to be about someone else's threat or about other people believing you, and mine is about my own two options where I'm the one who cant tell them apart. My mate says it's just Newcomb's problem which I'm pretty sure it isnt.

  So dont just hand me a name and stop — I want the boundaries drawn: what this is, what it's not, and how it's different from ordinary self-control and from a threat that only works because everyone thinks you're unhinged. And can you flag which bits of this people who actually work on it agree about versus which bits are still genuinely argued over, because when I asked in my class someone told me the answer was settled and I dont believe them — I'd rather have the disputed parts marked as disputed than have you tell me a contested reading is just what everyone thinks.
