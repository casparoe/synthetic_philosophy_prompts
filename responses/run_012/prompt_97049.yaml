      *   *Framework:* Rank-Dependent Utility (RDU) / Risk-Weighted Expected Utility (REU).
      *   *Formula:* $V = u(x_1) + \sum_{i=2}^{n} r(\sum_{j=i}^n p_j)[u(x_i) - u(x_{i-1})]$.
      *   *Alternative Form:* $V = \sum_{i=1}^n w_i u(x_i)$, where $w_i = r(P(x \geq x_i)) - r(P(x \geq x_{i+1}))$.
      *   *Core Argument:* The weights $w_i$ sum to 1 and are non-negative. They look like probabilities. If we interpret $w_i$ as the agent's subjective probability (credence) of outcome $x_i$, we get a non-additive probability measure (since $w_i \neq p_i$ generally, and $w(A \cup B) \neq w(A) + w(B)$ if disjoint).
