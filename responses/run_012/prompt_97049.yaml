      *   **Task:** Argue for a specific position: The "risk-attitude" interpretation of the weighting function $r$ in rank-dependent models is unsustainable because the same preferences can be generated by distorted beliefs (non-additive credences), and nothing internal to the framework privileges the risk-attitude story. This is not just underdetermination but a point about the theory's content.
      *   **Constraints:**
          *   No citations, references, reading lists, appeals to authority, or hedging about camps.
          *   Work out formal details first, then decide structure, then write.
          *   Begin with a few sentences of prose brainstorming (sketch lines of argument).
