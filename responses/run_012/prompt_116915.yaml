answer: |-
  **Priya:** You're hiding behind the DAG again. Look at the numbers. In the ICU, Drug A saves lives. Twenty percent mortality versus twenty-five. Outside the ICU, ten versus twelve-point-five. Everywhere you look, Drug A is better. The overall sixteen percent versus fifteen percent is garbage. It's classic confounding by indication. The doctors saw the Drug A patients were dying anyway, so they threw the new stuff at them. You adjust for severity, you get the truth. The truth is Drug A works.

  **Marcus:** The truth is Drug A works *if* ICU status is a proxy for baseline severity. But your table doesn't say "severity." It says "ICU admission." That happens *after* the drug is started in the ER.

  **Priya:** Ten minutes after. It's a marker of how they looked on arrival.

  **Marcus:** Or it's a side effect. What if Drug A tanks blood pressure? What if the drug itself pushes sixty percent of its patients into the ICU, while the old drug only sends twenty percent? Then ICU isn't a confounder; it's a mediator. It's on the causal pathway. If you condition on it, you're blocking the path where the drug kills people. You're hiding the harm.

  **Priya:** So because we *can* tell that story, we ignore the stratification? That's paralysis. If we assume every post-baseline variable is a mediator, we can never adjust for anything. We'd be forced to use the crude risk ratio every time. You know that's wrong. If I don't adjust for severity, I'm comparing apples to grenades.

  **Marcus:** I'm not saying don't adjust. I'm saying the adjustment *is* the assumption. You're looking at this table like it's a crime scene where the evidence points to a suspect. It's not. It's a Rorschach test. You see confounding because you believe doctors triage based on severity. I see mediation because I know drugs have side effects. The data doesn't care. The data is silent.

  **Priya:** The data isn't silent, it's ambiguous. There's a difference. My job is to use subject matter knowledge to break the tie. Clinically, it is vastly more plausible that sick people get the new drug than that the new drug instantly mimics sickness. The burden of proof is on the mechanism that says Drug A causes ICU admission. Until you have that, the within-group estimate is the unbiased effect.

  **Marcus:** "Until you have that." But the attending physician doesn't have that. She has your table. She calls you at 2 PM. She asks, "I have a patient in the bay. Do I give Drug A?" If you tell her "Yes, because the stratified mortality is lower," and it turns out Drug A causes ICU admission, you just told her to kill the patient via the pathway you adjusted away.

  **Priya:** And if I tell her "No, because the overall mortality is higher," and it turns out Drug A is just given to sicker people, I've withheld a superior treatment from someone who might live. You think pointing out the dilemma solves it? You think saying "it depends on the story" helps the person holding the syringe?

  **Marcus:** No. I think telling her a number without the story is malpractice. You want me to answer her? Fine. I tell her: "Drug A reduces mortality *within* severity groups, but it appears to increase the likelihood of ICU admission significantly. If ICU admission is a marker of how sick they were already, give Drug A. If ICU admission is a side effect of the drug, do not give Drug A."

  **Priya:** That's not an answer. That's a lecture.

  **Marcus:** It's the only answer the data supports. You want to pick the stratified number? Fine. But admit you're betting on a causal structure, not reading a fact off the page. You're saying, "I believe the world looks like this DAG." And if you're wrong, your "unbiased" estimate is more dangerous than the crude one because it comes with a seal of statistical approval.

  **Priya:** So we just wait for a mechanistic study? While people die on the standard protocol? Science isn't pure philosophy, Marcus. We have to make the best call on the evidence we have. The weight of evidence suggests confounding by indication is the dominant bias in observational ER data. Mediation is the exception. I'm betting on the base rate.

  **Marcus:** And that's a valid bet. But don't call it "the estimate." Call it "the estimate under the assumption of no mediation." Because the moment you drop the assumption, the sixteen percent isn't noise. It's the total effect. It's what happens when you release Drug A into the wild, with all its side effects included. That's the policy number. The stratified number is the efficacy number. They answer different questions.

  **Priya:** They answer the same question: "Does this drug save lives?"

  **Marcus:** No. One answers "Does this drug save lives *if we could magic away its tendency to send people to the ICU*?" The other answers "Does this drug save lives *as actually administered*?" You're selling the first one as the second.

  **Priya:** (Pauses, stirs coffee) So what do I write in the conclusion? "Drug A is effective, unless it isn't"?

  **Marcus:** You write: "Drug A is associated with lower mortality within ICU strata, but higher overall mortality driven by increased ICU admission. Causal interpretation requires determining whether ICU admission is a confounder or a mediator."

  **Priya:** They'll reject it. The editors want a recommendation.

  **Marcus:** Then let them reject it. Or let them pick a story. But don't let them pretend the table picked it for them. Because if you do, and the mechanism is mediation, the next time we meet, you won't be asking me about paradoxes. You'll be testifying before a board.

  **Priya:** God, you're exhausting.

  **Marcus:** I'm just the guy who reads the footnotes. You're the one signing the report.
