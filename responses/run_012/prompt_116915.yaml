      *   Scenario 2 (Mediator/Collider): Drug A -> ICU. ICU -> Death. Drug A -> Death (direct).
          *   Here ICU is on the causal pathway. Adjusting for ICU blocks the indirect harm. Correct estimate is Overall (Total Effect).
      *   *Correction on Collider:* If Drug A -> ICU and Severity -> ICU, then ICU is a collider. Conditioning on it opens a path between Drug A and Severity. This creates bias.
      *   *User's Prompt:* "story where going to the ICU is just a marker of how sick they looked on arrival... meaning the within-group comparison is the honest one" (Confounding). "or a story where the drug itself is what puts people in the ICU... meaning ICU transfer is downstream of the treatment and conditioning on it is exactly the mistake... meaning the ugly overall number is the real one" (Mediation).
      *   Okay, I will stick to the user's framing: Confounder vs. Mediator.

  5.  **Drafting the Dialogue (Mental Walkthrough):**
      *   Priya: "The stratified risk ratio is the signal. The crude is noise."
