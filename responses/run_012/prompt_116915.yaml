              *   Drug B Total: 1000 patients, 150 died (15%).
          *   *Paradox:* Drug A is better in ICU (20% vs 25%) and better in No ICU (10% vs 12.5%), but worse overall (16% vs 15%).
          *   *Mechanism:* Drug A patients are much sicker (60% ICU vs 20% ICU).
      *   **Conflict:** Is ICU a confounder (baseline severity -> assign Drug A + -> Death) or a mediator/collider (Drug A -> ICU -> Death)?
          *   Story 1 (Confounding): Doctors gave Drug A to sicker patients. ICU status proxies baseline severity. Stratify (within-group) is correct. Drug A is better.
          *   Story 2 (Mediator/Collider): Drug A causes ICU admission (e.g., side effect). Conditioning on ICU opens bias or blocks effect. Overall is correct. Drug A is worse.
      *   **Characters:**
          *   **Priya (Biostatistician):** Trusts the within-group comparison. Thinks "it depends" is dodging. Believes there's a correct adjustment.
          *   **Marcus (Philosopher of Science/Causal Inference):** Beliefs data doesn't settle causal stories. Neither number is a fact until the mechanism is settled. Forces practical accountability (what to tell the physician).
      *   **Constraints:**
