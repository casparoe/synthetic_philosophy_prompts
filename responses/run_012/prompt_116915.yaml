      *   **Marcus's Stance:** Causal inference framework (DAGs). The numbers are just numbers. The *structure* determines the estimator. If ICU is a mediator (Drug A -> ICU -> Death), stratifying blocks the path and hides the harm. He argues the data alone cannot distinguish these structures.
      *   **The Tension:** Priya wants to extract the truth from the data using standard adjustments. Marcus wants to emphasize that the adjustment *is* the assumption, not the solution.
