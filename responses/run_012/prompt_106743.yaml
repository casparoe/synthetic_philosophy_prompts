  2.  **Deconstruct the Problem:**
      *   **Core Question:** Is endogamy (preferring partners of same faith/language/culture) a bias?
      *   **Reading 1 (Epistemic/Causal):** Is this preference based on false beliefs, stereotypes, or limited exposure? Or is it based on genuine compatibility insights gained from shared culture?
      *   **Reading 2 (Normative/Rawlsian):** Is this preference something he would reject if he didn't know his position in society (veil of ignorance)? Does it unfairly disadvantage outsiders?
      *   **Factors to Decompose:**
          *   Group-based vs. Individual merit (statistical discrimination vs. prejudice).
          *   Harm to third parties (exclusion vs. freedom of association).
          *   Internal consistency (does he apply this standard elsewhere?).
          *   Malleability (would he change if exposed to more info?).
          *   Evolutionary/Cultural utility (is there a functional reason?).

  3.  **Drafting - Step-by-Step:**

      *   *Tone:* Conversational, empathetic, analytical, direct. No formatting markers.
