      *   *Combination:* How do these average out?
      *   *Sensitivity:* What moves the needle? Probably the "harm/autonomy" aspect regarding the children. If he's forcing vs. nudging, that changes things. Or the definition of "bias" itself.
      *   *Constraint Check:* NO BOLDS, NO BULLETS, NO HEADINGS, NO TABLES. Continuous prose.

