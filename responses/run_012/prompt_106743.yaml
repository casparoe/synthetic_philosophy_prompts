prompt: |-
  Ok, I'm a novelist and this is basically the fight my wife and I keep having, so I want an actual number out of you instead of vibes. My brother-in-law has a deep, lifelong, stable preference for living among people of his own faith and language and nudging his kids to marry inside the group. He says its just a taste, like preferring blonds. She says it's a bias, period. Give me your credence that it's a bias and not a legitimate preference, but under two readings, because I'm pretty sure the number swings hard depending on which one you use: first, bias as a preference formed by distorted or selective information, so the trouble is causal/historical; second, bias as a preference he'd repudiate if he could see it from behind a veil of ignorance, so the trouble is in the content. I'd put myself around 0.3 on the first and 0.6 on the second, she'd say 0.95 on both. Then give me your all-things-considered number. Decompose the whole thing: how much rides on group-based versus individual, on whether third parties actually get harmed, on whether he can give himself a reason that survives his own standards, and whatever other terms you think belong, with a rough probability and one line of justification for each, then how they combine. Finish by telling me which sub-question the total is most sensitive to, and what would move it most. Write it as plain continuous prose, no headings or bullets or bold or tables, like an email to a friend.
