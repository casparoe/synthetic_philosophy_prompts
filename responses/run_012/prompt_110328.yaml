answer: |-
  ### Brainstorming: Desiderata vs. Partisan Commitments

  Before specifying the requirements, we must separate the functional needs of a regulatory principle from the ideological preferences of its proponents. A principle that merely codifies a specific political outcome is not a decision tool; it is a conclusion masquerading as a premise.

  **Genuine Desiderata (Functional Necessities):**
  *   **Action-Guidance:** The principle must yield a decision or a procedure for reaching one. A principle that says "be careful" without defining "careful" in operational terms is a platitude, not a rule.
  *   **Non-Paralysis:** The principle must not forbid all action. Since all actions (including inaction) carry potential unquantified risks, a principle that demands the elimination of all uncertainty before acting mandates eternal stasis.
  *   **Symmetry:** The principle must apply to the regulatory intervention itself, not just the regulated technology. If the principle demands safety before action, the regulation must also meet that standard.
  *   **Epistemic Honesty:** The principle must distinguish between *Risk* (known probabilities), *Uncertainty* (unknown probabilities), *Ambiguity* (contested framing), and *Ignorance* (unknown unknowns). It cannot treat them identically without losing analytical power.
  *   **Implementation Feasibility:** A regulator with finite resources cannot monitor every hypothetical pathway. The rule must be enforceable and compliant.

  **Partisan Commitments (Disguised as Criteria):**
  *   **Mandatory Burden Shifting:** While often useful, demanding that the *producer* always prove safety is a legal strategy, not a logical necessity of precaution. In some cases (e.g., public health emergencies), the state may need to act first and verify later.
  *   **Innovation Neutrality:** Proponents of technology often demand the principle be "innovation-neutral." However, precaution inherently alters the incentive structure of innovation. The goal should not be neutrality, but *steering* innovation away from catastrophic pathways.
  *   **Absolute Safety:** No formulation can deliver absolute safety. Demanding this sets the principle up to fail.
  *   **Status Quo Preference:** Many formulations implicitly favor existing technologies over new ones. This is a bias, not a requirement. An adequate formulation must be able to justify restricting an old technology if new evidence arises, or permitting a new one if it reduces systemic risk.

  ---

  ### The Specification: Requirements for an Adequate Formulation

  The following requirements are ordered by the amount of work they do in eliminating candidate formulations. The top requirements are logical constraints; the lower ones are substantive regulatory constraints.

  #### 1. The Symmetry Requirement (Non-Negotiable)
  **Statement:** The principle must apply to the precautionary measure (the regulation/ban) with the same force as it applies to the regulated activity (the technology/substance).
  **Reasoning:** This is the primary defense against self-defeat. If the principle states, "Do not act until risks are fully understood," then the act of regulating must also wait until its risks are fully understood. Since regulatory risks (economic collapse, risk displacement, loss of beneficial technology) are rarely fully understood, a non-symmetric principle paralyzes the regulator.
  **Accommodates:** The case where a ban displaces risk to a substitute hazard. If the ban is subject to the same scrutiny as the substance, the substitute must be evaluated before the ban is finalized.
  **Decision Fact:** Acknowledges that safety factors presuppose a baseline; the regulation itself shifts the baseline and introduces new risks.

  #### 2. The Epistemic Scope Requirement (Non-Negotiable)
  **Statement:** The formulation must explicitly state which epistemic state (Risk, Uncertainty, Ambiguity, Ignorance) triggers the principle, and provide distinct guidance for each. It cannot claim a single rule serves all four without modification.
  **Reasoning:** "Risk" is managed by insurance and optimization (SEU). "Ignorance" cannot be managed by calculation. Conflating them leads to category errors. A principle that treats Ignorance like Risk will underestimate tail events; a principle that treats Risk like Ignorance will waste resources on quantifiable problems.
  **Accommodates:** The distinction between Prevention (Risk) and Precaution (Uncertainty/Ignorance). It handles the "unframed harm" case by acknowledging that under Ignorance, evidence-gathering of the *current* kind is insufficient, requiring monitoring/scanning rather than calculation.
  **Decision Fact:** Acknowledges that subjective expected-utility is available for Risk but fails under Ignorance.

  #### 3. The Dynamic Consistency Requirement (Non-Negotiable)
  **Statement:** The principle must account for the opportunity costs of delay and the irreversibility of the decision window. It must treat "doing nothing" as an active choice with consequences, not a neutral baseline.
  **Reasoning:** Precaution is often framed as "waiting for more evidence." If the window to act closes while waiting, or if the delay causes greater harm (e.g., delaying a medical technology), the principle fails. It must weigh the risk of acting against the risk of *not* acting.
  **Accommodates:** The case where restriction delays a technology that would remove a larger harm. It handles the "decision becomes harder the longer it is deferred" case by weighting the value of information against the cost of waiting.
  **Decision Fact:** Foregone benefits are harms, often to people worse off than those protected.

  #### 4. The Proportionality and Substitution Requirement (Non-Negotiable)
  **Statement:** The strength of the precautionary measure must be proportional to the severity and plausibility of the threat, and the measure must not induce a substitution with equal or greater systemic risk.
  **Reasoning:** A ban is the strongest measure; a monitoring requirement is weaker. Using a ban for a low-plausibility threat violates rational resource allocation. Furthermore, solving a problem by creating a new one (risk displacement) is regulatory failure.
  **Accommodates:** The case where a ban displaces risk to a substitute hazard. It handles the "certain large cost vs. unbounded loss" case by requiring a comparison of the *certainty* of the regulatory cost against the *magnitude* of the avoided harm.
  **Decision Fact:** Compliance and enforcement are imperfect; a disproportionate rule will be evaded or undermine trust.

  #### 5. The Epistemic Integrity Requirement (High Priority)
  **Statement:** The formulation must provide a mechanism to distinguish between scientific dissent based on unresolved evidence and dissent manufactured to create the appearance of uncertainty.
  **Reasoning:** Under Uncertainty and Ambiguity, "more research" is the standard precautionary response. If the uncertainty is manufactured by interested parties (e.g., the producer funding the research), demanding more research rewards obstructionism.
  **Accommodates:** The case where early evidence of a serious mechanism appeared, but the producer funded the research supposed to settle it. The principle must allow action despite "ongoing debate" if the debate is structurally compromised.
  **Decision Fact:** Patterns in public risk perception (dread, involuntariness) are not automatically errors; manufactured uncertainty exploits these perceptions.

  #### 6. The Operationalizability Requirement (High Priority)
  **Statement:** The principle must distinguish the *Trigger* (what knowledge state activates it), the *Strength* (what action is taken), and the *Burden* (who must show what), and assign these to appropriate levels (individual, firm, regulator, court).
  **Reasoning:** A rule that works for a court (retrospective liability) fails for a regulator (prospective licensing). A rule that demands individual citizens assess molecular mechanisms fails; a rule that demands regulators predict all social outcomes fails.
  **Accommodates:** The distinction between the level at which the rule operates. It ensures the rule is usable by a regulator with finite resources.
  **Decision Fact:** A rule that cannot be implemented is not a rule.

  ---

  ### The Trilemma: Jointly Unsatisfiable Subset

  There is a subset of desires that cannot be jointly satisfied. You cannot simultaneously hold:
  1.  **Strong Substantive Guidance under Ignorance:** The principle dictates a specific action (e.g., "Ban") when outcomes and probabilities are unknown (Ignorance).
  2.  **Non-Paralysis:** The principle allows some activities to proceed.
  3.  **Symmetry:** The principle applies to itself (the regulation).

  **Why:** If we are in a state of Ignorance (we do not know what we do not know), we cannot know if the *ban* itself triggers a catastrophic unknown unknown. If the principle mandates avoiding Ignorance-driven risks (1), and applies to the ban (3), then the ban is forbidden because it carries Ignorance-driven risks. To allow the ban (avoid Paralysis, 2), you must exempt the regulator from the rule (violating 3) or admit the rule does not apply to Ignorance (violating 1).

  **Resolution:** An adequate formulation must sacrifice **Strong Substantive Guidance under Ignorance**. Under deep Ignorance, the principle cannot be a decision rule (Maximin, etc.); it must be a **procedural rule** (increase resilience, monitor, maintain flexibility). It can tell you *how to decide* (build redundancy), but not *what to decide* (ban X).

  **Self-Defeat Check:** Can a principle strong enough to be action-guiding under Ignorance avoid being self-defeating? **No.** If it is strong enough to mandate action under Ignorance, it forbids its own implementation (which is an action under Ignorance). To avoid self-defeat, the principle must weaken its claim under Ignorance from "Ban" to "Prepare/Monitor."

  ---

  ### The Single Eliminating Requirement

  If I could keep only one requirement to eliminate the most candidate formulations, it would be **The Symmetry Requirement**.

  **Reasoning:** Most "Strong" versions of the Precautionary Principle (e.g., "No activity without proof of safety") fail this immediately. They place the burden of proof on the innovator but assume the regulator's intervention is risk-free. This asymmetry is the source of most regulatory pathologies (risk displacement, innovation stagnation). Enforcing symmetry forces the formulation to acknowledge that regulation is an intervention with costs and risks, collapsing the "Strong Decision Rule" family into either a "Procedural" family or a "Cost-Benefit with Margin" family.

  ---

  ### Scoring the Families of Formulation

  The following table scores the four main families of formulation against the six requirements.
  *Scale: 0 (Fails completely) to 3 (Fully satisfies).*

  | Requirement | Strong Decision Rule (e.g., Maximin/Ban until safe) | Burden Shifting (Procedural/Legal) | Procedural (Resilience/Monitoring) | CBA + Margin of Safety |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Symmetry** | 0 | 1 | 3 | 3 |
  | **2. Epistemic Scope** | 1 | 2 | 3 | 2 |
  | **3. Dynamic Consistency** | 0 | 1 | 2 | 3 |
  | **4. Proportionality** | 1 | 2 | 3 | 3 |
  | **5. Epistemic Integrity** | 1 | 3 | 2 | 1 |
  | **6. Operationalizability** | 1 | 3 | 2 | 3 |
  | **Total Score** | **4** | **12** | **15** | **15** |

  **Analysis of Scores:**

  *   **Strong Decision Rule:** Fails primarily on Symmetry and Dynamic Consistency. It treats the ban as risk-free and ignores the cost of delay. It collapses under Ignorance (Paralysis).
  *   **Burden Shifting:** Scores well on Integrity and Operationalizability because it is a legal tool. However, it struggles with Dynamic Consistency (often biases toward status quo) and Symmetry (often places burden only on the firm, not the regulator to prove the ban is safe).
  *   **Procedural:** Scores highest on Symmetry and Epistemic Scope. It handles Ignorance by demanding resilience rather than prediction. It loses points on Epistemic Integrity (procedures can be gamed) and Operationalizability (can be vague for front-line regulators).
  *   **CBA + Margin:** Scores highest on Dynamic Consistency and Proportionality. It handles opportunity costs well. It loses points on Epistemic Scope (struggles with Ignorance/Ambiguity where probabilities are unavailable) and Epistemic Integrity (tends to treat all dissent as data).

  **Conclusion:**
  The **Procedural** and **CBA + Margin** families are the only viable candidates. The Strong Decision Rule is logically incoherent due to the Symmetry requirement. The Burden Shifting version is a useful component but insufficient as a standalone principle. The choice between Procedural and CBA + Margin depends on the epistemic state: CBA + Margin is superior for Risk and Uncertainty; Procedural is superior for Ambiguity and Ignorance. An adequate formulation must therefore be **hybrid**, switching modes based on the Epistemic Scope Requirement.
