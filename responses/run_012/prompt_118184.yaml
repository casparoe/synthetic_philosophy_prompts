  I am not an academic, but I have been thinking about the idea, often associated with Orwell, that a language can be arranged so that certain political thoughts become difficult or impossible to state, not because anyone forbids them, but because the available words and grammatical habits quietly presuppose a conclusion. Please write a short story that makes this idea concrete. Set it in a present-day municipal office that has adopted a mandatory plain-language lexicon for all public housing notices and council minutes; the lexicon was introduced to make government friendlier, and it has replaced eviction with housing transition and has no grammatical place for the council as the agent of a decision. The protagonist is a records clerk who slowly realizes that a legitimate complaint she needs to file cannot be written in the official vocabulary. The story should be third person, around 1,000 words, with at least one scene of ordinary bureaucratic work and one argument between two characters about whether a sentence can be true but unsayable. Do not mention Orwell or Newspeak, and do not quote any real text; let the concept emerge from the invented office. After the story, give me a JSON object with fields: title, setting, the linguistic mechanism, the scene where it becomes visible, the political thought that becomes unsayable, and the unresolved question the story leaves open.
