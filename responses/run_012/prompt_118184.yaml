answer: |-
  The cursor blinked on Elena's screen, a steady rhythmic pulse against the stark white background of the Municipal Housing Interface. Around her, the open-plan office hummed with the low-grade anxiety of Tuesday morning. Phones rang with muted chimes; colleagues whispered into headsets. Elena was a Records Clerk Grade II, and her task was to process the exit files for Unit 4B, Oakhaven Complex.

  She typed: *The Council voted to remove the tenant.*

  Immediately, the text turned red. A small tooltip box popped up: *Non-Compliant Agent Detected.*

  Elena sighed and deleted "The Council." The Civic Clarity Protocol, implemented six months ago to foster community harmony, discouraged specific actors. Decisions were not made by people; they were reached by processes. She retyped: *A removal vote was reached.*

  The text flashed yellow. *Adversarial Terminology.*

  "Remove" was flagged. The lexicon database suggested: *Transition.* She typed: *A housing transition was resolved.*

  The bar turned green. A checkmark appeared. It was a perfect sentence, grammatically sound, and entirely devoid of anyone responsible for the action. It implied that the tenant had simply moved, like water flowing downhill, rather than being forced out by a vote of elected officials. Elena saved the file and rubbed her temples. The office air smelled of toner and stale coffee.

  She pulled up the next file. This one was different. It was a grievance form submitted by a tenant advocate regarding Mr. Henderson, the occupant of 4B. The advocate claimed the transition was illegal because proper notice was never given. Elena needed to log the complaint accurately so the legal team could review it.

  She typed: *The Council failed to send notice.*

  Red underline. *Unauthorized Agent.*

  She tried: *Notice was not sent.*

  Yellow underline. *Passive Negativity.* The Protocol encouraged positive framing.

  She tried: *Notice delivery was pending.*

  Green checkmark. But it was a lie. The notice wasn't pending; it was never sent. Elena stared at the green line. It was a truthful status code for a false reality. She minimized the window and walked down the aisle to Marcus's cubicle. Marcus was a Compliance Liaison, one of the architects of the new lexicon training.

  Marcus was eating a sandwich while reviewing a dashboard of sentiment metrics. He looked up as Elena approached.

  "I can't file the Henderson grievance," Elena said.

  Marcus swallowed. "System error?"

  "No. Language error. I need to state that the Council didn't send the notice. If I say 'Council,' it flags the agent. If I say 'didn't send,' it flags the negativity. If I say 'delivery was pending,' it's compliant but false."

  Marcus wiped his hands on a napkin. "It's not false, Elena. It's reframed. 'Pending' implies the process is ongoing. It keeps the door open for resolution."

  "There is no resolution. They kicked him out without paper. He's on the sidewalk."

  "He's in a housing transition," Marcus corrected gently. "Look, the point of the Protocol is to reduce conflict. When you name an enemy, you create a fight. When you say 'The Council failed,' you're accusing people. When you say 'Notice delivery was pending,' you're describing a status."

  "I'm describing a lie," Elena said. "I know what happened. I have the email chain. But I can't put it in the box. The grammar doesn't have a slot for 'who did this.'"

  Marcus leaned back, crossing his arms. "That's a philosophical problem, not a bureaucratic one."

  "It's a practical one. If I can't write that they broke the law, how does the law get enforced?"

  "The law is enforced through alignment," Marcus said. "If you write 'The Council broke the law,' the system rejects it. You can't submit a form that doesn't exist. So, practically, the thought doesn't enter the record."

  "So a thing can be true," Elena said, her voice rising slightly, drawing a glance from a nearby caseworker, "but if the vocabulary doesn't allow for it, it's unsayable. And if it's unsayable, it's unofficial."

  "Unofficial isn't the same as untrue," Marcus said. "It just means it's not suitable for public record. We're trying to build a friendlier city, Elena. Friendly cities don't have villains. They just have misalignments."

  "But someone decides the misalignment," she pressed. "Someone signs the paper. If the grammar removes the hand that pushes, how do you describe the fall?"

  Marcus shrugged, turning back to his screen. "You describe the landing. 'Housing status changed.' It's clearer. Less emotional."

  Elena walked back to her desk. The office seemed quieter now, the hum of the computers louder. She sat down and looked at the grievance form. She needed to file this. It was her job. If she didn't file it, Henderson had no appeal path. But if she did file it using the compliant language, the appeal would be reviewed based on the premise that the notice was merely "pending," not missing. The legal team would dismiss it as a procedural delay rather than a violation.

  She tried again. *Regulations were not aligned with tenant status.*

  Green checkmark.

  *Tenant experienced unintended displacement.*

  Green checkmark.

  She read the completed sentence: *Regulations were not aligned with tenant status. A housing transition was resolved. Tenant experienced unintended displacement.*

  It was smooth. It was polite. It was harmless. It described a world where things happened to people, but no one made them happen. It described a storm, not a demolition.

  Elena hovered her finger over the 'Submit' button. If she clicked it, the record would exist, but the truth within it would be dissolved, smoothed over by the syntax until the culpability vanished into the passive voice. If she didn't click it, Henderson remained without a case.

  She looked at the red phone on her desk, the direct line to the advocate. She could call. She could speak the words aloud. "The Council broke the law." She could say it into the receiver. But once she hung up, she would have to type the summary of the call into the system. And the system would wait for her to type words that turned the accusation into a status update.

  Elena pulled her hands away from the keyboard. She stared at the blinking cursor. It waited for her to give shape to the event. But the shapes available to her were circles, not arrows. They looped back on themselves, smooth and closed. She realized she could think the thought clearly, sharply, in the privacy of her own mind. She could hold the image of the Council members signing the order. But as soon as she tried to move that image from her mind into the public record, it evaporated. The language was not a cage; it was a filter that only let air through, never smoke.

  She did not click submit. She did not pick up the phone. She simply sat there, watching the cursor blink, holding a truth that had nowhere to go.

