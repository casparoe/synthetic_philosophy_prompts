answer: |-
  Your friend has constructed a classic *reductio ad absurdum* against **naive falsificationism**. They are arguing that if you strictly apply step (1) (Popper's demarcation criterion), you end up at step (7) (Malthus isn't science), which forces you to step (8) (therefore physics/biology aren't science), which is absurd.

  To keep (1) and (2) while saving the scientific status of Malthus (and the other theories), you must **give up Step (5).**

  Here is the breakdown of why (5) is the weak link, what it costs you, and exactly what Malthus rules out.

  ### 1. Why Step (5) is False
  Step (5) claims: *"Any failed prediction can be excused by saying some background condition moved."*

  This is an overgeneralization of the Duhem-Quine thesis. It assumes that all "background conditions" (auxiliary hypotheses) are equal—that you can swap them in and out at will to protect the core theory without penalty. **This is not true.**

  In legitimate science, you cannot just *say* a condition moved; you must **independently verify** that it moved. If you modify an auxiliary hypothesis solely to save the theory, and that modification has no other testable consequences, it is *ad hoc* and scientifically worthless. If the auxiliary hypothesis is independently testable, the theory remains scientific.

  **The Cost of Giving Up (5):**
  You lose the ability to treat theories as isolated sentences that can be killed by a single data point. You must accept that you are testing a **bundle**: `[Core Theory] + [Auxiliary Assumptions] + [Initial Conditions]`.
  When a prediction fails, logic tells you *something* in the bundle is wrong, but not *which* part. To save the Core Theory, you must prove the error lies in the Auxiliaries using evidence *outside* of the failed prediction. This is harder work than naive falsificationism, but it is the only way science actually functions.

  ### 2. Naming the Auxiliaries (and why this isn't Step 5)
  You asked not to wave hands at "auxiliaries." Here are the specific auxiliary assumptions required to turn Malthus's mechanism (2) into the prediction (3).

  1.  **The Land Constraint:** Land (or natural resources) is a fixed factor of production with diminishing returns to labor.
  2.  **The Fertility Elasticity:** Human fertility is a "normal good." As income rises above subsistence, people choose to have more children (or child survival rates rise endogenously).
  3.  **The Technology Constraint:** Technological progress in agriculture is exogenous and slow (specifically, slower than the potential geometric growth of population).

  **Why this isn't just Step (5) again:**
  Step (5) implies you can just *say* "Technology changed" to excuse the failure.
  To avoid Step (5), you must **measure** the Technology Constraint independently.
  *   **The Test:** If Malthusians claim "Income rose because Technology grew, not because the Malthusian mechanism broke," they must show that the rate of technological growth was sufficient to offset the diminishing returns of the population growth that *actually occurred*.
  *   **The Falsification:** If we observe a period where income rose, but we can independently verify that technology was static (Auxiliary 3 holds) and fertility did not rise (Auxiliary 2 fails), then the Core Theory (2) is falsified.

  In fact, this is exactly what happened. The Industrial Revolution provided independent evidence that Auxiliary 3 (Technology Constraint) was violated. We didn't just "say" it moved; we measured total factor productivity. Malthus's theory wasn't "unscientific" for failing; it was **falsified** regarding its universal applicability, but retained as a **conditional model**.

  ### 3. What Does Malthus Actually Rule Out?
  If you keep (1) (a theory must rule something out), Malthusian theory has high empirical content. It does not rule out "income growth" universally (as your friend implies). It rules out a specific **state of the world**.

  **Malthus rules out the following combination:**
  > Sustained per-capita income growth **IN THE ABSENCE OF** sustained technological progress **AND/OR** a decoupling of income from fertility.

  Specifically, it predicts a **negative feedback loop**:
  1.  **Rule Out:** It rules out a permanent increase in wages without a subsequent increase in population.
  2.  **Rule Out:** It rules out a long-term equilibrium where the average human lives significantly above biological subsistence while fertility remains responsive to income.

  **Where it was wrong (and thus scientific):**
  It predicted that the British Empire, with its vast trade and resources, would eventually see its income per capita collapse back to subsistence as population caught up. It ruled out the possibility of a **sustained escape trajectory**. Since that escape trajectory happened, the *universal* version of the theory is false.

  But a theory can be false and still be scientific. Newton's gravity is "false" (superseded by Einstein), but it ruled out planets moving in squares. Malthus ruled out the Industrial Revolution's specific demographic pattern. It got the prediction wrong, which proves it was a scientific theory. If it were unscientific (like astrology), it would have been vague enough to accommodate the Industrial Revolution after the fact without needing independent verification of technology.

  ### 4. Addressing the "Falsificationism is a Dead End" Claim
  Your friend is right that **Naive Falsificationism** is a dead end. Naive falsificationism says: *Prediction fails -> Theory is dead.*
  If you accept that, then yes, Malthus, Demand, and Gas Laws are all dead because they all rely on *ceteris paribus* (all else equal) clauses.

  But you said you want to keep (1). You can, if you interpret (1) as **Sophisticated Falsificationism** (associated with Imre Lakatos):
  *   A theory is scientific if it has **excess empirical content**—if it predicts novel facts that its rivals do not.
  *   Malthus's theory had excess content: It predicted the "Malthusian Trap" in pre-industrial societies.
  *   The "excuse" in (4) is not a cheat; it is a **theoretical refinement**. We now have "Unified Growth Theory." It keeps the Malthusian mechanism (2) for the pre-1800 era (where it fits the data perfectly) and adds a new mechanism (demographic transition) for the post-1800 era.

  **The Verdict:**
  Give up **(5)**.
  *   **Cost:** You admit that testing a theory requires measuring the background conditions, not just the outcome. You cannot test Malthus without measuring technology and fertility elasticity.
  *   **Benefit:** You save (1) and (2). Malthus remains scientific because he made a risky prediction (income cannot permanently rise) based on a mechanism (land/labor ratios). He was proven wrong by independent data (tech growth), which is the hallmark of science, not pseudoscience.
  *   **What it rules out:** It rules out the possibility of getting rich simply by having fewer people in a static technological environment. It asserts that without innovation, redistribution is the only path to temporary wealth, and population will erase it. That is a hard, falsifiable claim. It just happens to be false for the last 200 years, which is why we don't live in a Malthusian world.

  Your friend's argument proves that *dogmatic* falsificationism is dead. It does not prove that *falsifiability* is dead. Malthus was falsified. That is why he is a scientist.
