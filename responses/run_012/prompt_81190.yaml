      *   Step (5) says *any* failure can be excused. This is only true if you allow *ad hoc* adjustments. If you require independent testability of the auxiliaries, (5) is false.

  7.  **Drafting the Response:**
      *   **Direct Answer:** Give up Step (5).
      *   **Explanation:** Step (5) conflates *legitimate ceteris paribus conditions* with *ad hoc rescue*.
      *   **The Cost:** You lose the ability to test the theory in a vacuum. You must test the "theory + auxiliaries" bundle. This means you need independent evidence for the auxiliaries.
