          *   Specify *what* it rules out.
          *   Do not use the vague "it depends on auxiliaries" defense unless specific auxiliaries are named and distinguished from step (5)'s criticism (ad hoc rescue).
          *   Address the friend's claim that falsificationism is a dead end.

  2.  **Deconstruct the Argument:**
