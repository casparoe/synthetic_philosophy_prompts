answer: |-
  **Setting:** *A university faculty lounge, late afternoon. Rain beats against the window. Elena (Intellectualist) is pouring tea. Marcus (Rylean) is staring into a black coffee.*

  **Marcus:** Let's look at the woman and the engine. We're agreed on the facts?

  **Elena:** The diagnostician? Yes. Sarah can hear the specific harmonic shift that precedes a bearing seizure in a diesel compressor. She identifies it instantly. She is never wrong. But she cannot articulate the acoustic rule. She cannot teach it except by apprenticeship. And Dave, the mechanic who has memorized the service manual, cannot hear it at all.

  **Marcus:** Exactly. Sarah possesses the knowledge *how* to diagnose the seizure. Dave possesses the knowledge *that* the manual specifies certain tolerances. Sarah's knowledge is in her ears and her reaction. If you ask her for the proposition, she gives you a shrug. This is the death knell of intellectualism. Here is know-how stripped entirely of know-that.

  **Elena:** It's not stripped of know-that, Marcus. It's stripped of *articulable* know-that. Sarah knows the fact: *that this engine is about to seize.* She stands in the knowledge relation to that proposition. The difference between her and Dave isn't that she lacks the proposition. It's that she grasps that proposition under a practical mode of presentation.

  **Marcus:** There it is. The "practical mode of presentation." The PMOP. You're telling me that because she can't say it, she's grasping the fact in a special, magical way?

  **Elena:** Not magical. Functional. A theoretical mode of presentation allows you to assert the fact. A practical mode allows you to act on it. When Sarah hears the whine, she doesn't think, "The frequency is 400 Hertz." She thinks, in a way that prompts action, "It's seizing." The content is propositional. The guise is practical. That is why she can't teach Dave. She can't translate the practical guise into a theoretical one any more than you can translate the taste of lemon into a color.

  **Marcus:** I'm going to stop you there. Is that a genuine explanation, or is it a redescription? You've observed that she can act but not speak. You've posited a "practical mode" to bridge the gap. But all you've actually said is: "She knows how to do it because she knows it in a doing-way." That explains nothing. It's a placeholder for the very capacity you're trying to reduce.

  **Elena:** Straight answer? It is a genuine explanation. It posits a specific cognitive architecture. It claims there is a single type of semantic content—the proposition—accessed via different cognitive routes. The explanation predicts that if we could map her neural states, we would find representational structures with truth conditions, not just blind stimulus-response loops. It distinguishes her from a thermostat. A thermostat reacts to heat. Sarah knows *that* it is hot, under a practical mode.

  **Marcus:** But that distinction is where the regress begins, Elena. Ryle's ghost is sitting in the corner, and he's laughing. Let's say Sarah does hold the proposition *that the engine is seizing.* To use that knowledge to actually warn the crew or shut it down, she has to *apply* it. She has to know *how* to move from the mental state "It is seizing" to the action "Hit the kill switch."

  **Elena:** She applies it by grasping the proposition under a practical mode. That mode *is* the disposition to act.

  **Marcus:** No, you're smuggling the disposition back in! If the knowledge is propositional, applying it is an intellectual operation. She must contemplate the proposition and decide it warrants action. But to contemplate it *as warranting action* requires another piece of knowledge: knowledge *that* this proposition implies action. And to apply *that* knowledge requires yet another piece of knowledge *how* to apply it. You've launched an infinite regress of intellectual contemplations before she can ever lift a finger.

  **Elena:** It is not a vicious regress. It's a hierarchy of granularity. At the highest level, she knows *that* the engine is failing. At a lower level, she knows *that* this sound implies failure. At the bottom, she possesses basic cognitive capacities that don't require further contemplation. The regress stops at the basic rules of inference or perception that are constitutive of rationality itself. We don't need to know *how* to know; we just need to know *that*, and the cognitive machinery handles the rest.

  **Marcus:** "Constitutive of rationality." That's just digging the hole deeper. You're saying the foundation of all action is a silent, infinite lecture hall in the head. I'm saying the foundation is a habit. Sarah doesn't infer the seizure. She hears it, like she hears a shout. You don't infer that a shout is angry; you hear the anger. Her knowledge is a cultivated disposition, a multi-track readiness to respond to the engine's behavior. It doesn't need a propositional spark to ignite it.

  **Elena:** But dispositions don't have accuracy conditions. If Sarah is disposed to say "seizing" when the engine is fine, she's mistaken. She knows she's wrong. That implies she is tracking truth. Dispositions can be malfunctions; knowledge implies a relation to fact. By making it propositional, I preserve the normativity. She *ought* to believe the engine is seizing because it *is* seizing. Your dispositional account makes her a very complex clock. Mine makes her a knower.

  **Marcus:** Normativity doesn't require propositions. It requires standards of performance. We judge her skill by whether the engine blows up, not by whether her internal sentence matches the world. And that brings me to the second problem. Degrees.

  **Elena:** Go on.

  **Marcus:** Know-how comes in degrees. Sarah is an expert. Dave is a novice. I'm a complete idiot with engines. We can be better or worse at knowing how. But know-that is binary. Either you know that Paris is in France, or you don't. You can't "sort of" know the proposition. If know-how is just a species of know-that, where does the gradability come from?

  **Elena:** Two responses. First, propositional knowledge isn't as binary as you think. I can know that quantum mechanics is valid with varying degrees of justification and understanding. I can know *more* of the relevant propositions than you. Sarah might know *that* the bearing is seizing, *that* the lubrication failed, and *that* the temperature is critical. Dave knows none.

  **Marcus:** That explains depth of knowledge, not quality of skill. Sarah could know fewer facts than Dave but still beat him at diagnosis. The skill itself is graded. You can be a "good" knower-how, but a "good" knower-that sounds odd. You either know it or you don't.

  **Elena:** Then my second response: The gradability attaches to the *ability* to act on the knowledge, not the knowledge relation itself. Sarah and I might both know the proposition *that the engine is seizing* under a practical mode. But she can act on it faster, in noisier environments, with less fatigue. The "skill" is the robustness of the access to the proposition, not the proposition itself. The intellectualist thesis is about the *nature* of the knowledge, not the *efficiency* of the retrieval.

  **Marcus:** But if the retrieval efficiency is what matters in practice, why posit the proposition at all? If the "practical mode" is just a way of describing a high-efficiency, non-linguistic access to action, you've conceded my point. You've admitted the work is being done by the capacity, not the content. The proposition is a ghost riding the machine.

  **Elena:** The proposition isn't a ghost; it's the steering. Without the content *that the engine is seizing*, her action is blind. If the engine weren't seizing, and she acted anyway, she'd be hallucinating. The fact that she can be *wrong* proves there is a truth-apt content. You can't be wrong about a disposition. You just have it or you don't. You can only be wrong about a fact. Sarah is fallible. Therefore, she deals in facts.

  **Marcus:** She deals in the world, Elena. Not facts *about* the world. She engages with the engine. The "fallibility" is just a mismatch between her disposition and the environment. We don't need to interpose a sentence between her ear and her hand to explain why she sometimes misses.

  **Elena:** And without that sentence, you can't explain why she corrects herself. When she hears a new sound and realizes, "No, that's not seizure, that's cavitation," she is revising a judgment. That is a propositional operation. You are revising a belief, not re-tuning a reflex.

  **Marcus:** Habits can be modified. Training updates dispositions. We're going in circles. You see a hidden logic in the mind. I see a visible competence in the behavior.

  **Elena:** And until you can explain the normativity of that competence without invoking truth conditions, I'll keep the logic.

  **Marcus:** And until you can explain the fluency of that logic without invoking an infinite regress of rules, I'll keep the competence.

  **Elena:** *Sips tea.* More coffee?

  **Marcus:** *Pushes cup forward.* Please. But pour it practically. Don't tell me *that* you are pouring. Just do it.

  **Elena:** *Smiles.* If I do it successfully, does that mean I know *that* the cup is fillable?

  **Marcus:** It means you know how to pour.

  **Elena:** We'll pick up the regress argument next week.

  **Marcus:** I'll bring Ryle.
