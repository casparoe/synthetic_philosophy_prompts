answer: |-
  # Workshop Q&A Prep Sheet: Aggregation & Separateness

  **Context:** Defending aggregative view against Separateness of Persons (SoP).
  **Core Move:** Distinguishing Metaphysical Distinctness (granted) from Normative Separateness (denied).
  **Key Case:** "Two Doors" (Justification addressed to persons ≠ Persons' goods as separate terms).

  ---

  ## I. The Objections (Ordered by Damage Potential)

  ### 1. The "Grounding" Objection (Rawlsians & Kantian)
  **The Attack:** You claim metaphysical distinctness does no normative work. But for us, the normative claim *just is* the recognition of the metaphysical fact. To say persons are separate *means* their claims cannot be merged into a social sum. By separating them, you aren't answering the objection; you're stipulating it away.
  **Vocab:** "Constitutive," "Moral Personality," "Inviolability," "Social Union of Social Unions."
  **2-Minute Reply:**
  "I grant that distinctness is the *occasion* for the objection, but not the *argument*. If distinctness entailed non-aggregation, we couldn't aggregate across time for a single person. But we do. We sacrifice present comfort for future gain constantly. Since we aggregate across temporal stages of one life without violating integrity, the mere fact of distinctness isn't doing the work. There must be a further premise about *claims* that you aren't stating. My paper asks for that premise. Until you provide the link between 'distinct skulls' and 'no trade-offs,' the SoP is an intuition, not an argument."
  **Where it's Soft:** The analogy between personal identity over time and interpersonal identity is controversial (Parfit's Reductionism). If they deny psychological continuity matters, the time-analogy fails.
  **Who hits this:** The Rawlsians will lead; the Kantian will back them up on "inviolability."

  ### 2. The "Reasonable Rejection" Objection (Scanlonian)
  **The Attack:** Your "Two Doors" case ignores the *standpoint* of the loser. Contractualism isn't about totaling goods; it's about whether the one person can reasonably reject the principle that allows their loss. Even if the total good is higher, the individual's complaint is not 'swamped'; it stands as a veto against being sacrificed for the aggregate.
  **Vocab:** "Generic Reasons," "Standpoint," "Reasonable Rejection," "Justification to."
  **2-Minute Reply:**
  "There is a difference between a complaint being *decisive* and a complaint being *ignored*. On my view, the loser's pain enters the calculus fully. It is not ignored. It is simply outweighed. To say they can 'reasonably reject' a principle that minimizes total suffering simply asserts the conclusion. Why is 'my pain counts less than the sum of theirs' a reasonable rejection, but 'my pain counts equally' is not? Your framework privileges the individual veto without explaining why that veto doesn't itself violate the equality of the others whose pain is left unrelieved."
  **Where it's Soft:** Scanlonians argue that "counting equally" in a sum isn't the same as "respecting the status" of the person. You haven't fully answered why being outweighed isn't a form of disrespect.
  **Who hits this:** The Scanlonian (obviously), but the Rawlsians will nod along.

  ### 3. The "For-Someone" Distinction Collapse (All Philosophers)
  **The Attack:** You distinguish between a benefit being *for* someone and a justification being *addressed* to someone. But a benefit is essentially relational. If a state of affairs is good, it must be good *for* a subject. If you aggregate, you are creating a 'social good' that isn't good for any specific individual in the requisite sense. You are positing a 'super-subject.'
  **Vocab:** "Relational Good," "Supervenience," "Atomism."
  **2-Minute Reply:**
  "I am not positing a super-subject. I am positing a decision rule. When I relieve five headaches instead of one, the benefit is still fully located in the five individuals. It is not 'for' the group; it is 'for' the five. The 'for-someone' requirement is satisfied for every unit of good. The objection assumes that for a benefit to count, it must be the *maximal* benefit for *one* person. But that's question-begging. Why can't morality require me to produce benefits-for-persons, even if that means not producing the maximal benefit-for-this-particular-person?"
  **Where it's Soft:** This relies on the intuition that 'benefits-for-persons' can be summed. If they argue that the *distribution* is part of the good itself (not just the sum), your summing rule looks arbitrary.
  **Who hits this:** Everyone, but specifically the Kantian (ends in themselves) and Rawlsians.

  ### 4. The Comparability Challenge (Economist)
  **The Attack:** You assume interpersonal comparability of utility (pain). Without a common metric, your aggregation is mathematically incoherent. Arrow's Theorem shows you can't aggregate ordinal preferences into a social welfare function without a dictator. You are the dictator.
  **Vocab:** "Ordinal vs. Cardinal," "Social Welfare Function," "Preference Satisfaction," "Incommensurability."
  **2-Minute Reply:**
  "This is a measurement problem, not a normative one. I am arguing about the *structure* of justification, not the *metric*. Even if we had perfect cardinal utility, the Rawlsian would still object to aggregation. Conversely, if we assume your comparability worry holds, it kills *all* moral theory, including contractualism (which requires comparing the strength of generic reasons). I am willing to bracket comparability for the sake of the normative argument: *If* we can compare, *should* we aggregate? That is the philosophical question."
  **Where it's Soft:** If comparability is impossible in principle (not just practically), your normative structure has no application. It becomes a solution to a non-existent problem.
  **Who hits this:** The Economist (repeatedly).

  ---

  ## II. Handling the Rawlsian "Trump Card"

  The Rawlsians will try to shut down the conversation by saying: *"You just aren't taking the separateness of persons seriously."* This is a conversation-ender designed to make you look morally obtuse.

  **Prepared Lines to Neutralize This:**

  1.  **The "Argument vs. Intuition" Move:**
      "I am taking it seriously enough to ask for the argument that supports it. If the separateness of persons is a trump card, it needs a suit. Is the suit Kantian dignity? Is it contractualist agreement? Let's name the premise so we can test it, rather than invoking the conclusion as a premise."

  2.  **The "Time" Trap:**
      "If distinctness is the trump card, how do you avoid the conclusion that I cannot sacrifice my present comfort for my future welfare? I am distinct from my future self in almost every way that matters. If you allow intrapersonal aggregation but forbid interpersonal aggregation, you need a boundary line. 'Skin' is not a moral boundary unless you argue for it."

  3.  **The "Respect" Reframe:**
      "I argue that respecting persons requires taking their pains seriously. Ignoring five people's chronic pain to spare one person mild pain isn't respect for the one; it's fetishizing the distribution at the cost of the people. I am defending the people, not the boundary."

  ---

  ## III. The Economist: Real Threat or Change of Subject?

  **Verdict:** **Change of Subject (mostly).**
  The economist is raising a *meta-ethical/epistemic* worry about a *normative* claim.
  *   **Why it's not a fatal threat:** You are defending the *permissibility* of aggregation, not the *mechanism*. Even if utility is hard to measure, the claim "we ought to maximize" is distinct from "we can measure perfectly."
  *   **The Risk:** If they convince the room that interpersonal comparison is *conceptually* impossible (not just hard), your view becomes action-guiding null.
  *   **Strategy:** Concede the difficulty, bracket the issue. "I am arguing that *if* we have reason to believe A helps more than B hurts, the SoP does not forbid acting on it. Whether we can know that is a separate epistemic question."

  ---

  ## IV. The One Question You're Praying Nobody Asks

  **"Does your view allow sacrificing one innocent person to prevent a sufficiently large number of people from experiencing very minor inconveniences (e.g., a dust speck in the eye)?"**

  **Why this kills you:**
  1.  **The Repugnant Conclusion:** It forces you to bite the bullet on extreme aggregation.
  2.  **Exposes the "For-Someone" Weakness:** If you say "Yes," you look monstrous (violating the Kantian/Rawlsian core). If you say "No," you have to introduce a non-aggregative threshold, which collapses your distinction between metaphysical and normative separateness (admitting that at some point, the person *does* matter more than the sum).
  3.  **Two Doors Case Backfire:** They will use your own case against you. If Two Doors works for pain, why not for life?

  **Contingency Plan (If Asked):**
  Do not bite the bullet fully. Pivot to *marginal utility* and *rights as side-constraints derived from aggregation*.
  *Reply:* "In the real world, systems that allow sacrificing innocents create such profound insecurity and terror that the aggregate utility plummets. So, rule-utilitarian constraints protect the innocent. But in the *idealized* case you're proposing? I am more concerned with the actual suffering of the many than the abstract boundary of the one. But let's not let a science-fiction case drive the theory of actual chronic pain relief." (This is weak, but it's the best you have).
