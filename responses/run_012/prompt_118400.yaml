answer: |-
  Here is an analysis of your tentative principle, followed by a proposal for a more robust alternative.

  ### Part 1: Testing Your Tentative Principle

  **The Principle:** *A convention binds you exactly when it protects some discernible interest of a person present, OR when compliance is plainly expected of you and costs you little.*

  This principle is strong on **coordination** and **economic reliance**, but it is too broad on **social etiquette**. It struggles to distinguish between rules that facilitate interaction and rules that merely signal it.

  #### 1. Which Verdicts It Saves
  *   **Tipping (US Server):** **Saved.** Clause 1 applies (server's economic interest) and Clause 2 applies (expected + low cost).
  *   **Water Rationing:** **Saved.** Clause 1 applies (village's water supply interest).
  *   **Escalators:** **Saved.** Clause 1 applies (commuters' interest in flow/speed).
  *   **Jaywalking (With Children):** **Saved.** Clause 2 applies (compliance expected for modeling, cost is low).
  *   **Greetings (Resident):** **Saved.** Clause 2 applies (expected + low cost).

  #### 2. Which Verdicts It Forces You to Give Up
  *   **Tipping (Japan Visitor):** **Lost.** In Japan, the convention is *not* to tip. Compliance (not tipping) is expected and costs nothing. Therefore, the principle says the convention binds the visitor to *not tip*. If they tip, they violate the binding convention. Your principle implies tipping in Japan is wrong; your verdict is that it is not.
  *   **Jaywalking (Empty Street):** **Lost.** Compliance (waiting) is plainly expected (law/convention) and costs little. Clause 2 binds you. Your principle implies waiting is obligatory; your verdict is that crossing is fine.
  *   **Outlived Convention (Rising):** **Lost.** Compliance is expected by the club and costs little (standing). Clause 2 binds you. Your principle implies failing to rise is wrong; your verdict is that it is merely eccentric.
  *   **Greetings (Visitor):** **Lost.** Compliance (greeting) is expected and costs little. Clause 2 binds you. Your principle implies the visitor is wrong; your verdict is that they are not.

  #### 3. The "Undecided" Case (Insincere Greeting)
  Your principle rules this **Wrong**.
  *   **Reasoning:** Clause 2 is satisfied. Locals expect sincerity (or at least the form); the cost of waiting for an answer is low. The fact that they are offended suggests an "interest" in dignity (Clause 1), but even without that, Clause 2 binds the agent.
  *   **Implication:** To keep your principle, you must decide that offending locals via a discoverable convention is a wrong, regardless of visitor status.

  #### 4. A Case That Pulls the Clauses Apart
  Consider **The Obsolete Uniform**.
  *   **Case:** A private club requires members to wear a specific, slightly uncomfortable tie. The tie originally signaled rank, but the ranking system was abolished years ago. Now, it serves no purpose other than tradition. A member wears a different tie.
  *   **Clause 1 (Interest):** No discernible interest is harmed. No one is misled; no function is lost.
  *   **Clause 2 (Expectation + Cost):** Compliance is plainly expected (it is the rule). The cost is low (buying a tie).
  *   **The Split:** Your principle says the member is **bound** (via Clause 2) and thus doing wrong. However, your intuition on the "Rising" case suggests that when the point is lost, the obligation vanishes. This case isolates Clause 2 to show it generates obligations where you feel there are none.

  ---

  ### Part 2: A Better Proposal

  Your verdicts suggest you distinguish between conventions that **coordinate behavior to prevent harm** and conventions that **signal membership to maintain social fabric**. You also distinguish between **Residents** (who claim membership) and **Visitors** (who do not), unless the stakes involve tangible interests.

  I propose replacing your single principle with a pair of principles that divide the labor.

  #### The Principle of Functional Reliance
  > **Statement:** You are bound to follow a convention if violating it would defeat a reasonable reliance interest of another person present (safety, economic, or coordinative).
  > **Motivation:** This covers the "hard" cases where someone actually loses out if you defect. It explains why the US server, the water villagers, and the escalator walkers have a claim on you.
  > **Scope:** Binds **everyone** (Residents and Visitors).

  #### The Principle of Social Membership
  > **Statement:** You are bound to follow a convention if you claim membership in the community (as a resident or member) AND the convention serves a non-obsolete social function (respect, cohesion, or order).
  > **Motivation:** This covers the "soft" cases like greetings and dress codes. It explains why residents are bound but visitors are not. It adds the "non-obsolete" constraint to handle the Rising case.
  > **Scope:** Binds **Residents/Members only**.

  #### How This Handles Your Cases
  1.  **Tipping (US):** *Functional Reliance.* Server relies on income. Binds Visitor. (Verdict: Wrong).
  2.  **Tipping (Japan):** *Social Membership.* Convention is "don't tip." Visitor does not claim membership. (Verdict: Not Wrong).
  3.  **Escalators:** *Functional Reliance.* Commuters rely on flow. Binds Visitor. (Verdict: Wrong).
  4.  **Jaywalking (Empty):** *Neither.* No reliance interest (empty street). Visitor/Resident distinction irrelevant. (Verdict: Not Wrong).
  5.  **Jaywalking (Children):** *Functional Reliance.* Children rely on modeling for safety education. (Verdict: Wrong).
  6.  **Rising:** *Social Membership (Failed).* Convention is obsolete. Fails the "non-obsolete" constraint. (Verdict: Not Wrong).
  7.  **Water:** *Functional Reliance.* Village relies on supply. Binds Visitor. (Verdict: Wrong).
  8.  **Greetings (Visitor):** *Social Membership.* Visitor does not claim membership. (Verdict: Not Wrong).
  9.  **Greetings (Resident):** *Social Membership.* Resident claims membership. (Verdict: Wrong).

  #### How This Rules on the "Undecided" Case
  **Case:** Visitor asks "How are you?" without waiting for an answer; locals offended.
  *   **Functional Reliance:** Is there a reliance interest? Locals rely on the script for smooth interaction. The offense is real, but is it a "reliance interest" akin to money or safety? If we define "interest" strictly (economic/physical), this fails Clause 1.
  *   **Social Membership:** The agent is a Visitor. They do not claim membership. This fails Clause 2.
  *   **Verdict:** **Not Wrong.**
  *   **Reasoning:** Under this framework, offense alone does not create a binding obligation for a transient visitor unless it undermines a functional coordination (like a transaction). The offense is the cost of cross-cultural friction, not a moral wrong.

  #### Honest Account of Limitations
  This pair of principles cannot accommodate the following intuitions, should you hold them:
  1.  **The "Respect for Host" Intuition:** If you believe a visitor *does* owe a duty of respect to a host culture even in purely symbolic matters (e.g., you *should* try to greet the shopkeeper even as a visitor), this framework is too permissive. It exempts visitors from all symbolic labor.
  2.  **The "Offense as Harm" Intuition:** If you believe causing genuine offense *is* a harm sufficient to trigger Functional Reliance, the Undecided Case becomes Wrong. This framework requires you to draw a hard line between "hurt feelings" and "reliance interests."
  3.  **The "Ignorant Local" Problem:** If a resident genuinely doesn't know a convention (e.g., a new rule at the club), the Social Membership principle still binds them ("claim membership" is objective). If you think ignorance excuses residents in symbolic cases, this principle is too strict.

  ### Summary
  Your tentative principle fails because it treats **etiquette** (Membership) the same as **coordination** (Reliance). By splitting them, you preserve the binding nature of tipping and water (Reliance) while exempting visitors from greetings and Japanese tipping norms (Membership), and you exempt everyone from obsolete rules like Rising.
