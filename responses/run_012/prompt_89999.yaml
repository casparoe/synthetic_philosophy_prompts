  8.  **Final Polish:** Check the rhythm. Ensure the transition from the bridge table to the hospital administration feels natural. Make sure the "why" doesn't sound like a lecture. It needs to sound like a tribute. The key insight to convey is that the constraint wasn't a wall he hid behind, but a floor he stood on so others wouldn't fall.

      *Refining the "Why":* The user specifically worried about the "paradox of deontology" (why not do one bad thing to stop five?). The answer in the eulogy needs to be: Because doing the bad thing changes *who we are* and *how we relate*. It treats the person being lied to as a thing. It treats the truth as a tool. He believed that once you make truth a tool, you lose the ability to build anything lasting. That's the structural work.

