prompt: |-
  I am a novelist a third of the way into a long book about a woman who leaves a marriage, and my difficulty is one of method: I keep writing scenes in which she announces what she wants and I do not believe her, or in which what she does and what she says diverge, and my editor returns the pages with the same question in the margin. I want a procedure I can run scene by scene, before drafting rather than after, built on the economist's treatment of preference as revealed in choice rather than reported in speech. First fix the terms, since I keep sliding between three things I might mean by what she wants — what she would choose, what she would endorse on reflection, and what would be good for her. Then say what a choice must have been like to reveal anything: which alternatives were genuinely available, what each cost her, whether the same options come round twice. Say what I may conclude when her choices cycle rather than settle — incompleteness, a change of mind, a want I have not yet named — since I must not treat every contradiction as depth. And say when to stop inferring and write from the inside, because the interiority this whole picture treats as dispensable is what my book is for: give me a rule for the case where her avowed and revealed wants disagree, one that distinguishes self-deception, a change of mind, and my own wish that she want something else. Set out the steps in the order I should run them, mark the ones that are irreducibly my judgment — who decides which choices count as costly, and which choices I stage at all — and name the failure mode in which the procedure merely confirms the character my plot requires. I have no economics and my editor has less; revisions are expensive. Run it on three scenes: she refuses an offer she has spent a chapter asking for; she pays for something she has called worthless; and she decides to leave — where I suspect the procedure will tell me she does not want to leave, and I would rather it did not.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** A novelist, 1/3 into a long book about a woman leaving a marriage.
      *   **Problem:** Writing scenes where the character announces wants (unbelievable) or actions diverge from speech. Editor keeps flagging this.
      *   **Goal:** A pre-drafting procedure (scene-by-scene) based on "revealed preference" (economics concept: preference is shown in choice, not speech).
      *   **Specific Requirements:**
          1.  Fix terms (Choice vs. Endorsement vs. Good).
          2.  Define what constitutes a valid "choice" for revelation (alternatives, costs, repetition).
          3.  Interpret cycling choices (incompleteness, change of mind, unnamed want).
          4.  Rule for when to stop inferring and write from the inside (interiority is the point of fiction).
          5.  Distinguish self-deception, change of mind, and authorial imposition.
          6.  Order the steps logically.
          7.  Mark irreducible authorial judgments.
          8.  Name the failure mode (confirming plot requirements).
          9.  **Test Run:** Apply to three specific scenes (Refusing an asked-for offer, Paying for worthless thing, Deciding to leave).
      *   **Constraints:** No economics jargon (for user or editor), revisions are expensive (needs to work *before* drafting).

  2.  **Deconstruct the Core Concept (Revealed Preference in Fiction):**
      *   Economics says: $A \succ B$ if you choose $A$ when $B$ is available.
      *   Fiction says: Character says $X$ but does $Y$. Reader believes $Y$.
      *   Tension: Fiction *needs* interiority (the gap between $X$ and $Y$), but the gap currently feels unearned or confusing.
      *   Solution: A diagnostic tool to ensure the gap is meaningful, not accidental.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Step 1: Terminology.* Need to separate the three "wants."
          *   Want 1: **The Choice** (Revealed Preference). What she actually does.
          *   Want 2: **The Story** (Avowed Preference). What she says she wants.
          *   Want 3: **The Good** (Normative Preference). What serves her well-being (often the reader's or author's view).
      *   *Step 2: Validating the Choice.* Not every action is a choice.
          *   Were there alternatives?
          *   Was there a cost? (If no cost, no revelation).
          *   Is it repeated? (One-off mistakes vs. patterns).
      *   *Step 3: Analyzing Contradictions.* When Choice $\neq$ Story.
          *   Cycling (A then B then A).
          *   Is it incompleteness? (She doesn't know).
          *   Is it change? (Time passed).
          *   Is it unnamed? (She wants safety, says she wants freedom).
      *   *Step 4: The Interiority Rule.* When to trust the gap.
          *   If Choice $\neq$ Story, is it *Self-Deception* (she knows deep down), *Evolution* (she changed), or *Authorial Cheat* (plot needs her to leave)?
      *   *Step 5: Authorial Judgment.* Acknowledge where the writer decides.
      *   *Step 6: Failure Mode.* "Plot-Driven Revealed Preference."

  4.  **Refining the Steps (Iterative Polish):**
      *   *Tone:* Professional, precise, empathetic to the creative process. Not dryly academic.
      *   *Clarity:* Use bolding for the steps.
      *   *The "Stop Inferring" Rule:* This is crucial. Fiction isn't a behaviorist experiment. We need access to her mind. The rule should be: If the gap causes paralysis, write the *feeling* of the gap, not just the action.
      *   *Judgment Markers:* Explicitly label where the author's intuition overrides the logic.

  5.  **Running the Test Cases:**

      *   *Scene 1: Refuses offer she asked for.*
          *   Choice: Refuse. Story: Ask.
          *   Cost: Losing the thing.
          *   Diagnosis: Fear? Timing? The thing changed?
          *   Verdict: Likely Self-Deception or Unnamed Want (wanted the *idea*, not the *reality*).
      *   *Scene 2: Pays for something worthless.*
          *   Choice: Pay. Story: Worthless.
          *   Cost: Money/Resource.
          *   Diagnosis: Signaling? Habit? Hope?
          *   Verdict: Reveals she values *something else* (e.g., peace, connection) more than the object's utility.
      *   *Scene 3: Decides to leave (The tricky one).*
          *   User suspects procedure will say "She doesn't want to leave."
          *   Choice: Leave. Story: Maybe "I have to" vs "I want to."
          *   Cost: High (marriage, stability).
          *   Diagnosis: If she hesitates endlessly, does she *really* choose?
          *   Verdict: Needs to distinguish between "fleeing" and "choosing." If the procedure says "she doesn't want to," the author must decide if the *act* of leaving is the revelation of a deeper need for autonomy, even if painful. Or admit it's a plot requirement.

  6.  **Addressing Specific Constraints:**
      *   *No Economics:* Keep terms like "Revealed Preference" but explain them simply.
      *   *Revisions Expensive:* Emphasize this is for the *outline/beat sheet* phase.
      *   *Failure Mode:* Call it "The Puppeteer's Confirmation."

  7.  **Final Review against Prompt:**
      *   Fix terms? Yes.
      *   Choice conditions (alternatives, cost, repetition)? Yes.
      *   Cycling conclusions? Yes.
      *   Stop inferring/Interiority rule? Yes.
      *   Distinguish self-deception/change/author wish? Yes.
      *   Order steps? Yes.
      *   Mark judgments? Yes.
      *   Name failure mode? Yes.
      *   Run 3 scenes? Yes.

  8.  **Self-Correction during drafting:**
      *   *Critique:* Is the interiority rule too vague?
      *   *Fix:* Make it a specific test: "Can you write the moment of tension without resolving it?"
      *   *Critique:* Is the distinction between "Endorsement" and "Good" clear?
      *   *Fix:* Label them "Avowed" (Speech) and "Welfare" (Good).
      *   *Critique:* The user worries the procedure will tell her the character doesn't want to leave.
      *   *Fix:* In the test run for Scene 3, address this directly. The procedure reveals *ambivalence*, not necessarily "stay." Leaving can be a revealed preference for *ending pain* over *keeping stability*.

  9.  **Final Polish:** Check tone. Ensure it sounds like advice from a sharp editor or colleague, not a textbook. (Proceed to generate output).

  *(Self-Correction Note on the "Failure Mode"):* The prompt asks to name the failure mode where the procedure confirms the character the plot requires. I need to make sure I explicitly name this. Let's call it "Teleological Bias" or "Plot-Confirmation Bias." Let's go with "The Puppeteer's Confirmation."

  *(Self-Correction on Interiority):* The prompt says "the interiority this whole picture treats as dispensable is what my book is for." I need to make sure the procedure doesn't eliminate interiority but *sharpens* it. The rule must be: Use the gap to generate the interiority, not close it.

  *(Final check on Scene 3):* The user says "I suspect the procedure will tell me she does not want to leave, and I would rather it did not." I need to handle this delicately. The procedure shouldn't dictate the plot, but ensure the *cost* is paid. If she leaves, she must reveal she wants *something else* more than the marriage.

