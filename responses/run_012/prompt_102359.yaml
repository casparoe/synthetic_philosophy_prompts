answer: |-
  Here is the procedure, designed for the outline or beat-sheet stage to prevent expensive revision later. It treats your character not as a psychological case study, but as an agent whose truth is found in what she sacrifices.

  ### I. Fix the Terms
  Before drafting a scene, label which "want" is in play. Do not let them slide.

  1.  **The Avowed Want (Speech):** What she says she wants. This is her narrative to herself and others.
  2.  **The Revealed Want (Choice):** What she actually selects when forced to pay a cost. This is the truth of the scene.
  3.  **The Normative Want (Good):** What would objectively improve her welfare. This is often what the reader hopes for, or what the author knows is "healthy."

  *Note: Fiction lives in the gap between Avowed and Revealed. The Normative is often the tragedy.*

  ### II. The Procedure (Run Scene-by-Scene)

  **Step 1: Establish the Menu (Authorial Judgment)**
  List the alternatives available to her in this scene.
  *   *Constraint:* There must be at least two viable options. If there is no alternative, there is no choice, only compulsion.
  *   *Judgment:* You decide what is "viable." Do not offer a fake choice (e.g., "leave or die") unless the scene is about entrapment.

  **Step 2: Assign the Cost (Authorial Judgment)**
  Define what she loses by making the choice.
  *   *Constraint:* A choice reveals nothing if it is costless. If she chooses $A$ over $B$, but $B$ was worthless to her, we learn nothing about her preference for $A$.
  *   *Judgment:* You decide the currency. Is the cost emotional safety? Money? Social standing? Self-image?

  **Step 3: Check for Repetition**
  Has this choice appeared before?
  *   *If Yes:* A pattern is forming. This is a **Trait**.
  *   *If No:* This is a **Data Point**. Do not over-interpret a single action unless the cost is catastrophic.

  **Step 4: Analyze the Divergence (Avowed vs. Revealed)**
  If she says $X$ but chooses $Y$:
  *   **Self-Deception:** She knows $Y$ is her desire but cannot admit it. (Interiority: Shame, rationalization).
  *   **Incompleteness:** She lacks the information to choose $X$ effectively. (Interiority: Confusion, searching).
  *   **Unnamed Want:** She says she wants $X$ (e.g., "freedom"), but chooses $Y$ (e.g., "structure"). She actually wants $Z$ (e.g., "safety").
  *   **Change of Mind:** Time has passed between the Avowal and the Choice. (Interiority: Growth or erosion).

  **Step 5: The Interiority Rule (When to Stop Inferring)**
  *The Rule:* If the gap between Avowed and Revealed causes the character paralysis, **do not resolve it with action yet.** Write the paralysis.
  *   *Why:* Economics treats the mind as a black box; fiction treats the black box as the subject.
  *   *Application:* If the procedure suggests she is self-deceived, do not simply make her act consistently. Write the moment she *feels* the lie. The revelation is not the choice; the revelation is the *tension* before the choice.

  **Step 6: The Authorial Check (Failure Mode Detection)**
  Ask: *Am I staging this choice because it reveals her nature, or because my plot requires her to be here?*
  *   *Failure Mode Name:* **The Puppeteer's Confirmation.**
  *   *Symptom:* You assign a high cost to Option B to force her to choose Option A, not because she would, but because the next chapter needs her at A.
  *   *Correction:* If you catch this, you must either change the plot or rewrite the character's history to make the cost genuine.

  ---

  ### III. Test Run on Your Three Scenes

  Here is how the procedure applies to the specific trouble spots you identified.

  #### Scene 1: She refuses an offer she has spent a chapter asking for.
  *   **Menu:** Accept the offer vs. Refuse the offer.
  *   **Cost:** Refusing costs her the object of her desire.
  *   **Divergence:** Avowed (Want offer) vs. Revealed (Refuse offer).
  *   **Diagnosis:** This is likely an **Unnamed Want**. She did not want the *offer*; she wanted the *pursuit* or the *validation of being offered*. Now that it is real, the cost of accepting (responsibility, change) outweighs the cost of refusing (loss).
  *   **Interiority Rule:** Do not write her simply refusing. Write the moment the offer lands and feels heavy. The "No" must feel like a relief, not a mistake.
  *   **Authorial Judgment:** Ensure the offer is genuinely good. If the offer is toxic, her refusal is consistent, not contradictory.

  #### Scene 2: She pays for something she has called worthless.
  *   **Menu:** Keep the money vs. Spend the money.
  *   **Cost:** Financial loss + hypocrisy.
  *   **Divergence:** Avowed (Worthless) vs. Revealed (Valuable enough to buy).
  *   **Diagnosis:** **Self-Deception.** She calls it worthless to protect herself from needing it. Buying it reveals dependency.
  *   **Cycling Check:** If she buys it, regrets it, calls it worthless, then buys it again, this is **Addiction/Compulsion**, not preference.
  *   **Interiority Rule:** The scene is not the purchase; it is the justification. She must lie to the cashier or herself in the moment of payment.
  *   **Authorial Judgment:** You must decide if she *knows* she is lying. If she doesn't know, it is delusion. If she does, it is shame.

  #### Scene 3: She decides to leave the marriage.
  *   **Menu:** Stay vs. Leave.
  *   **Cost:** Leaving costs stability, shared history, perhaps identity. Staying costs autonomy.
  *   **Your Fear:** The procedure will say "She does not want to leave."
  *   **Procedure Output:** If she hesitates, cycles, or leaves only when forced by external circumstance, the Revealed Want is **Stay**.
  *   **Correction:** For the Revealed Want to be **Leave**, she must choose Leave when Stay is *easier*.
      *   *If she leaves because he cheated:* She is reacting, not choosing. Revealed Want = **Safety**.
      *   *If she leaves because she is unhappy but he is good:* She is choosing. Revealed Want = **Autonomy**.
  *   **The Puppeteer's Confirmation Check:** Are you making the marriage unbearable so her leaving looks like a "choice"? If you soften the husband's behavior and she *still* leaves, the Revealed Want is confirmed. If she only leaves when he becomes monstrous, the Revealed Want is **Escape**, not **Independence**.
  *   **Interiority Rule:** If the procedure suggests she doesn't truly want to leave, do not force the departure. Write the scene where she packs the bag and then *unpacks* it. The book becomes about why she cannot leave, which is often more profound than the leaving itself. If you must have her leave for plot reasons, she must pay a cost of **regret** immediately upon crossing the threshold.

  ### IV. Summary of Irreducible Judgments
  You cannot outsource these to the method. You must own them:
  1.  **Valuation:** You decide what counts as a "cost." (To her, is loneliness worse than a bad marriage?)
  2.  **Staging:** You decide which options appear on the menu. (If you never let her consider staying, her leaving is not a choice.)
  3.  **Truth:** You decide if a contradiction is "depth" or "confusion." (Depth earns its complexity; confusion bores the reader.)

  ### V. Final Warning
  If you run this procedure and find that her choices consistently contradict your plot outline, **trust the choices.** The plot is a scaffold; the choices are the building. If the building does not fit the scaffold, change the scaffold. If you force the choices to fit the plot, you will create the "announcing" scenes your editor rejects, where the character tells us who she is because she cannot show us.
