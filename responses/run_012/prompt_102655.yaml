answer: |-
  Here is a complete seminar plan designed to induce the Non-Identity Problem experientially. It relies on information asymmetry and a delayed revelation of identity conditions.

  ### Activity Title: The Coastal Council
  **Time:** 90 Minutes
  **Participants:** 16 Students
  **Room Setup:** Two distinct zones. A "Council Table" (8 chairs) and a "Town Hall" (8 chairs facing the Council).

  ---

  ### 1. Materials Required

  1.  **Role Badges:**
      *   8x **Councillor** (Red lanyards/cards).
      *   8x **Future Citizen** (Blue lanyards/cards).
  2.  **Council Briefing Packs (8x):**
      *   Contains the "Budget & Risk Report".
      *   *Key Data:* **Option A (Sea Wall):** High tax on Councillors now, Village stays, Future Citizens get "High Quality" lives. **Option B (Relocate):** No tax on Councillors, Village moves, Future Citizens get "Moderate Quality" lives.
      *   *Constraint:* Councillors are told their primary mandate is "Fiscal Solvency & Current Welfare".
  3.  **Future Citizen Envelopes (8x, Sealed):**
      *   Marked: **DO NOT OPEN UNTIL VOTE IS CONCLUDED.**
      *   Inside: A "Birth Certificate".
      *   *Crucial Detail:* All 8 envelopes are identical *on the outside*. Inside, they state: *"You are a child of the Relocation. Your life quality is 6/10. You are happy to be alive. Note: Had the Sea Wall been built, you would not exist; different children would have been born instead."*
      *   *(Note: You need a second set of 'Ghost Cards' for the debrief, see below).*
  4.  **The "Ghost" Cards (8x, kept by you):**
      *   These represent the children who *would* have been born under the Sea Wall option.
      *   Text: *"Child of the Sea Wall. Life quality 9/10. Does not exist under Relocation."*
  5.  **Voting Slips & Box.**
  6.  **Whiteboard/Flipchart.**

  ---

  ### 2. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Role Assignment**
  *   Do not explain the ethical problem. Do not mention "identity" or "harm".
  *   Assign roles randomly. 8 Councillors sit at the table. 8 Future Citizens sit in the Town Hall.
  *   **Instruction to Future Citizens:** "You represent the next generation. You cannot speak during the Council deliberation. You must wait to see what is decided for you. You will receive your personal details in a sealed envelope after the vote."
  *   **Instruction to Councillors:** "You must choose between Building the Sea Wall or Relocating the Village. Your decision is binding. Consult your Briefing Pack."

  **00:10 – 00:25: Council Deliberation**
  *   Councillors discuss. They will see the trade-off: Their own financial pain (Sea Wall) vs. Future Quality of Life.
  *   Future Citizens watch silently. This builds a sense of vulnerability.
  *   *Facilitator Note:* If Councillors lean too heavily towards the Sea Wall (altruism), intervene as the "Village Treasurer": *"Reminder, Councillors: The Sea Wall option risks insolvency for your current term. Relocation is fiscally secure."* (Nudge them toward Relocation to ensure the problem triggers).

  **00:25 – 00:35: The Vote & The Reveal**
  *   Councillors vote. Assume they choose **Relocation** (Option B).
  *   **The Reveal:** Collect the voting slips. Announce the result.
  *   Turn to Future Citizens: "Open your envelopes now."
  *   Give them 2 minutes to read.
  *   **The Twist:** Ask them to read the last line aloud: *"Had the Sea Wall been built, you would not exist."*
  *   Place the **Ghost Cards** (Sea Wall children) on the empty chairs in the Town Hall.
  *   State clearly: "These 8 people (point to Ghost Cards) are the ones who would have lived if the Wall was built. They would have had 9/10 life quality. You (point to Future Citizens) have 6/10. But you exist; they do not."

  **00:35 – 00:55: The Grievance Phase (The "Feel")**
  *   **Task:** Future Citizens must formulate a formal grievance to the Council. They want to claim they have been wronged.
  *   Let them argue. They will naturally say: *"You gave us worse lives than we could have had!"*
  *   **Facilitator Intervention (The Squeeze):** Do not let them off the hook. Ask specific questions:
      *   *"Worse than you could have had? If the Wall was built, would **you** exist?"* (No).
      *   *"So are you worse off than **you** would have been?"* (No, because otherwise you wouldn't be).
      *   *"Are you claiming you'd prefer never to have been born?"* (No, card says life is worth living).
      *   *"Then who exactly has been harmed?"*
  *   Allow the frustration to build. They will feel the injustice but lose the language to articulate it. This is the target sensation.

  **00:55 – 01:15: The Logic Trap (Group Discussion)**
  *   Open the floor to the whole room.
  *   Ask the Councillors: *"Did you do anything wrong?"* (They will likely say yes, intuitively).
  *   Ask: *"Who can you point to that is worse off than they otherwise would have been?"*
  *   Watch the room struggle. The Person-Affecting Intuition (an act is wrong only if it makes a specific person worse off) will clash with the Intuition that the choice was clearly reckless.
  *   Write their conflicting statements on the whiteboard:
      1.  "No existing person is worse off."
      2.  "The Relocation choice is morally worse."
      3.  "These children have a right to complain."
  *   Do not resolve it yet. Let the contradiction sit.

  **01:15 – 01:30: Debrief & Naming the Problem**
  *   Reveal the name: **The Non-Identity Problem** (Parfit, 1984).
  *   Map the activity to the theory:
      *   **Councillors** = Current Generation.
      *   **Future Citizens** = The Non-Identical Future People.
      *   **Ghost Cards** = The Counterfactual Identities.
  *   Explain the structure: When a policy changes *who* comes into existence, we cannot use standard "harm" comparisons (comparing existence to non-existence, or person A to person B).
  *   **Closing Question:** "If we can't use 'harm' to explain why Relocation was wrong, what ethical framework *do* we use? Impersonal principles? Rights to a certain quality of life regardless of identity?"

  ---

  ### 3. Predicted Pitfalls & How to Handle Them

  **1. The "I'm Still Me" Objection**
  *   *What happens:* A Future Citizen says, "But I'm me regardless. I could have been born in the Sea Wall village."
  *   *Why:* They are rejecting the biological contingency premise.
  *   *Fix:* Be firm on the scenario rules. "In this scenario, conception timing and pairings are strictly determined by location. Relocation changes the mating pairs and timing. Biologically, you are a different gamete combination. Please accept the premise for the sake of the argument."

  **2. The "Altruistic Council"**
  *   *What happens:* The Councillors vote for the Sea Wall despite the cost to themselves.
  *   *Why:* Masters students often want to be "good".
  *   *Fix:* You need to stack the incentives harder in the Briefing Pack. Make the Sea Wall option not just "costly" but "catastrophic for current services" (e.g., closure of the local clinic/school). If they still vote Stay, you must run the debrief hypothetically: *"Imagine you had voted Relocate. Here is what would have happened..."* and proceed with the envelopes.

  **3. The "Non-Existence is Better" Escape**
  *   *What happens:* A student says, "I'd rather not exist than live a 6/10 life."
  *   *Why:* This dissolves the paradox (because then they *are* harmed).
  *   *Fix:* Remind them of the card text: *"You are glad to be alive."* Ask them to argue from the perspective of the card, not their personal mood. "The character you are playing finds life worth living."

  **4. Silence/Confusion**
  *   *What happens:* The room goes quiet when the logic trap snaps shut.
  *   *Why:* They are thinking hard.
  *   *Fix:* Don't rush to fill the silence. Let it hang for 10-15 seconds. If it persists, ask: "Is it possible to do wrong without harming anyone specific?"

  ---

  ### 4. Limitations (What You Must Supply)

  Be straight with yourself about what this activity cannot do. You will need to bridge these gaps in the debrief:

  1.  **The Feeling of Non-Existence:** The Future Citizens are sitting in the room. They *exist*. They cannot viscerally feel the alternative of never having been.
      *   *Your Job:* In the debrief, explicitly state: "You are here, so you can't truly simulate non-existence. The philosophical weight is that the 'harm' comparison requires comparing existence to non-existence, which is logically category-breaking."
  2.  **Scale:** 8 people vs. 8 people is small. The real problem applies to climate policy affecting millions over centuries.
      *   *Your Job:* Remind them this is a microcosm of intergenerational justice (climate change, nuclear waste, debt).
  3.  **The "Impersonal Intuition":** The activity highlights the failure of the *Person-Affecting View*. It doesn't automatically provide the solution (e.g., the "No Difference View" or "Impersonal Total Principle").
      *   *Your Job:* You must outline the potential solutions in the final 5 minutes. Don't leave them in the dark; show them the exit doors even if none are perfect.

  ### 5. Facilitator's Script for the "Logic Trap" (00:45 mark)

  *Use this if the discussion stalls:*

  > "Listen to what you are saying. You are saying, 'You should have chosen the other option.' But if they had chosen the other option, *you* would not be here to say it. You are claiming a right to complain about a choice that is the necessary condition for your complaint.
  >
  > If you say you are harmed, you imply you are worse off. But worse off than what? Than never existing? But your card says your life is worth living.
  >
  > So, is it possible to be wronged, without being harmed? Or is our definition of harm broken?"

  ### 6. British English Notes
  *   Ensure all handouts use **S** instead of **Z** where applicable (e.g., "Realise", "Organisation").
  *   Use "Programme" not "Program".
  *   Refer to the "Village Hall" or "Town Hall", not "Community Center".
  *   Currency in the briefs should be £ (Sterling).
  *   Tone: Maintain a slightly formal, seminar-style register. Avoid over-enthusiastic Americanisms ("Great job!", "Let's dive in!"). Opt for "Right," "Shall we proceed," "Consider this."

  ### 7. Why This Works
  This activity forces the students into the **Person-Affecting Restriction**. By making the Future Citizens real people in the room, you tempt them to use person-affecting language ("*We* are worse off"). By revealing the identity contingency *after* the emotional investment is made, you pull the rug out from under that language. They are left holding a moral intuition ("This is unfair") with no logical vessel to carry it. That discomfort is the Non-Identity Problem.
