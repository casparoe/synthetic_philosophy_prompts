prompt: |-
  My brother has bipolar I and just came out of a manic episode where he spent alot of money and drove his car into a ditch. Before he was discharged he signed a psychiatric advance directive, a Ulysses contract basically, saying that if he gets like that again he can be held and medicated even if he says no. He's stable now and wants to rip it up. I'm trying to help him think it through, and I've fallen down a rabbit hole on precommitment and constitutional entrenchment.

  So here's what I want from you. Not a reading list, not citations, I can't use those anyway. I want to know which open questions in this area actually matter most for someone designing or judging a real contract like his, and why. Rank them. I care about which questions are upstream of the others, which are tractable for a philosopher rather than a lawyer or a clinician, and what would move them up or down the list.

  A few things I keep getting stuck on, so maybe use them as test cases. First, the later self problem: when he wants to revoke, is that the same person who signed, or a different one, and does that even matter? Second, the difference between a contract that works by changing his incentives and one that works by changing what counts as a valid decision. The second seems creepier but maybe more effective. Third, the constitutional analogy: constitutions entrench things against future majorities, but they also have amendment procedures and courts. Does that map onto a psychiatric advance directive, or does the analogy break because there's no seperate institution to enforce it? Fourth, his actual contract has a clause where to revoke he has to wait 72 hours, talk to two people who knew him when he was manic, and then re-sign the revocation in front of them. Is that just a trick that presupposes his future self can't be trusted? What would a philosopher say the clause is doing?

  I'm not asking you to decide for him. I want the agenda: the two or three questions that, if someone settled them, would most change how these contracts should be written and enforced, and the ones that sound deep but don't actually change anything practical. Also tell me what would change your ranking, like if it turns out the later self's preferences are stable enough, or if advance directives turn out not to improve outcomes. Be concrete and a bit ruthless about what's overrated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Sibling of someone with Bipolar I who signed a psychiatric advance directive (PAD)/Ulysses contract after a manic episode. The patient is now stable and wants to revoke it.
      *   **Goal:** The user wants an *agenda* of open philosophical questions relevant to designing/judging such contracts. They want them ranked by importance/impact.
      *   **Constraints:** No reading lists, no citations. Focus on what matters for *practice* (design/enforcement). Focus on what is tractable for a *philosopher* (vs. lawyer/clinician). Be concrete and ruthless about what's overrated.
      *   **Specific Test Cases to Address:**
          1.  The "Later Self" problem (identity/continuity).
          2.  Incentive-changing vs. Validity-changing contracts.
          3.  Constitutional analogy (entrenchment vs. amendment).
          4.  The specific revocation clause (72-hour wait, witnesses).
      *   **Dynamic Ranking:** Explain what would change the ranking (e.g., empirical data on stability or outcomes).

  2.  **Deconstruct the Core Tension:**
      *   The heart of the issue is *autonomy over time*.
      *   Time 1 (Stable): Signs contract to restrict Time 2 (Manic).
      *   Time 2 (Manic): Violates contract/needs enforcement.
      *   Time 3 (Stable again): Wants to revoke contract to prevent future enforcement.
      *   The philosophical problem is determining *which* self gets to rule and *why*.

  3.  **Brainstorming Potential Questions:**
      *   Personal Identity: Is manic me the same as stable me?
      *   Competence/Capacity: How do we measure it? Is it binary or scalar?
      *   Authenticity: Which preferences are the "real" ones?
      *   Welfare/Consequentialism: Does the contract actually help?
      *   Procedural Justice: How do we handle revocation fairly?
      *   Enforcement: Who holds the power? (State vs. Family vs. Doctor).
      *   The nature of the constraint: Is it a contract or a waiver of rights?

  4.  **Filtering & Ranking (Philosophical Tractability + Practical Impact):**
      *   *Personal Identity:* Deep, but practically irrelevant. Courts don't care if it's a "different soul." They care about capacity. *Rank: Low.*
      *   *Authenticity/Endorsement:* Crucial. If the manic desire is seen as "alien," the contract holds. If it's seen as a "change of mind," it doesn't. *Rank: High.*
      *   *Procedural Safeguards (The Revocation Clause):* Very practical. Philosophers can analyze the *logic* of precommitment devices. *Rank: High.*
      *   *Consequentialism (Outcomes):* Important, but mostly empirical (clinician/economist territory). Philosophers can frame *which* outcomes count (welfare vs. autonomy). *Rank: Medium.*
      *   *Constitutional Analogy:* Useful heuristic, but breaks down on enforcement. *Rank: Medium-Low.*
      *   *Incentive vs. Validity:* This is the mechanism of action. Crucial for legal design. *Rank: High.*

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Question 1: The Authority of the Past Self.* (Addresses the "Later Self" problem).
          *   Why it matters: If stable self rules, PADs are ironclad. If current self rules, PADs are worthless.
          *   Philosophical angle: Not identity, but *competence thresholds* and *authenticity*.
          *   Practical impact: Determines the burden of proof for revocation.
          *   *Refinement:* Let's call this "The Threshold of Competence for Revocation." It's more actionable than "Identity."

      *   *Question 2: The Mechanism of Constraint.* (Addresses Incentive vs. Validity).
          *   Why it matters: Is this a contract (breach = damages) or a waiver (breach = forced treatment)?
          *   Philosophical angle: The nature of consent. Can you consent to future non-consent?
          *   Practical impact: Determines if the contract is legally enforceable or just a strong suggestion.
          *   *Refinement:* "The Waiver of Future Rights." Can you waive the right to refuse treatment *when you are incompetent*?

      *   *Question 3: Procedural Precommitment.* (Addresses the Revocation Clause).
          *   Why it matters: How hard should it be to quit the contract?
          *   Philosophical angle: Ulysses pacts and cooling-off periods.
          *   Practical impact: The specific design of the 72-hour rule.
          *   *Refinement:* "Designing the Exit Ramp."

      *   *Question 4 (The "Overrated" one):* Personal Identity.
          *   Why it's overrated: Law doesn't care about metaphysical sameness.
          *   Why it feels deep: It comforts the family.
          *   Verdict: Drop to bottom or label as distraction.

      *   *Question 5 (The "Overrated" one):* Constitutional Analogy.
          *   Why it's overrated: No supreme court for individuals.
          *   Verdict: Medium. Good for thinking, bad for enforcing.

  6.  **Addressing the Test Cases within the Agenda:**
      *   *Later Self:* Fold into Question 1 (Competence/Authenticity).
      *   *Incentive vs. Validity:* Fold into Question 2 (Waiver).
      *   *Constitutional:* Fold into Question 3 (Procedures) or mark as overrated.
      *   *Revocation Clause:* Specific example of Question 3.

  7.  **Determining "What Changes the Ranking":**
      *   Empirical data on recovery rates.
      *   Legal precedents (if courts start striking these down).
      *   Evidence of abuse (coercion by family).

  8.  **Refining the Tone:**
      *   Needs to be "ruthless."
