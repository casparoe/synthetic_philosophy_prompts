answer: |-
  ### The Stakes and Moving Parts

  The core stake in teleosemantics is the **naturalization of normativity**. Mental states (like beliefs or perceptions) have correctness conditions: a state can be *false*. Physical states, like a neuron firing, do not naturally possess truth conditions; they simply occur. Teleosemantics attempts to bridge this gap by arguing that a state represents $X$ because the mechanism producing that state was *selected for* indicating $X$. If the state occurs without $X$, the mechanism is malfunctioning, and the content is false.

  For your burrowing insect, the moving parts are:
  1.  **The State:** The firing of the single interneuron ($N$).
  2.  **The Mechanism:** The sensory-motor arc connecting soil vibration to $N$ to the digging reflex.
  3.  **The History:** The evolutionary lineage where ancestors with $N$ survived better than those without.
  4.  **The Content:** The specific condition in the world (e.g., "Prey is present") that makes $N$'s firing "correct."

  The problem is that evolutionary history is a causal process, while content is a semantic relation. Causal processes do not inherently come with descriptions. The difficulty is not just determining *when* the state is false, but determining *what* the state is even supposed to be about in the first place.

  ---

  ### (a) The Underdetermination of Content by Selection History

  The standard "Disjunction Problem" (associated with Fodor) asks: If neuron $N$ fires for Prey ($P$) and also for Experimenter Taps ($T$), why does $N$ mean *Prey* rather than *Prey-or-Tap*? This is a problem of **error**: how to exclude $T$ from the content so that $N$ can be false when $T$ occurs.

  The problem you have identified is distinct. It is the **Indeterminacy of Function** (or the "Qua Problem"). It arises even if we grant that $T$ is an error. It asks: Even if $N$ is selected to fire for $P$, *under what description* is $P$ represented?

  Consider the Burrower's history. Ancestors possessed $N$. They survived. Why?
  1.  Because they detected **Prey**.
  2.  Because they detected **Vibration Frequency $F$**.
  3.  Because they detected **Nutritious-thing-causing-Vibration-$F$**.
  4.  Because they detected **Soil-disturbance**.

  In the ancestral environment, these descriptions were co-extensive. Whenever there was Prey, there was Vibration $F$. Whenever there was Vibration $F$, there was Prey. Natural selection selects for *effects* (survival/reproduction). The effect (eating) was caused by the presence of Prey. However, the *mechanism* was triggered by Vibration $F$.

  Selection history underdetermines content because selection is blind to semantics; it only "sees" causal correlations that yield survival.
  *   If we say $N$ represents **Vibration $F$**, we capture the proximal trigger. But this seems wrong; the insect isn't trying to map vibrations, it's trying to eat.
  *   If we say $N$ represents **Prey**, we capture the distal goal. But selection never interacted with "Prey" directly, only with the vibration Prey caused.
  *   If we say $N$ represents **Food**, we capture the biological value. But "Food" is a relational property (good for *this* organism).

  The underdetermination lies in the fact that the *same selection history* supports indefinitely many true counterfactuals about what the mechanism was "for." The history confirms that $N$ was selected to fire when $F$ occurred, *and* when $P$ occurred, *and* when Food was available. Unlike the Disjunction Problem, which worries about including *non-selected* causes (like $T$), this problem worries about distinguishing between *selected* causes that are nomologically locked together in the history. Selection history alone provides a causal chain, but content requires a specific *level of grain* in description that causality does not supply.

  ---

  ### (b) The Producer/Consumer Resolution

  The standard teleosemantic move (pioneered by Ruth Millikan) to resolve this is to split the mechanism into a **Producer** and a **Consumer**.

  *   **The Producer:** The sensory system that generates state $N$ (firing) in response to conditions (Vibration $F$).
  *   **The Consumer:** The downstream system that uses state $N$ to guide further action (the motor system triggering digging, linked to digestion).

  **The Resolution:**
  Content is not fixed by what causes the Producer to fire (the input), but by what the Consumer *needs* to be true in order to perform its function successfully (the output conditions).

  **Applied to the Burrower:**
  The Producer's job is to create a map. The Consumer's job is to use the map to navigate. The motor/digestive system (Consumer) has a biological function: to procure nutrients.
  *   If $N$ meant **Vibration $F$**, the Consumer would be set up to succeed whenever $F$ is present. But digging for a vibration alone yields no nutrients. The Consumer would fail.
  *   If $N$ meant **Prey**, the Consumer is set up to succeed when Prey is present. Digging where Prey is yields nutrients. The Consumer succeeds.

  Therefore, the content of $N$ is fixed by the **Normal Conditions** required for the Consumer's success. The Consumer is "set up" to digest Prey, not to digest Vibrations. Consequently, $N$ represents *Prey*, because *Prey* is the condition that completes the Consumer's functional loop.

  **What this buys:**
  It privileges the **distal** content (Prey) over the **proximal** content (Vibration) without appealing to the organism's "perspective." It appeals to the functional architecture. The vibration is merely the *medium* of the map; the prey is the *territory* the map is for.

  **What this presupposes:**
  1.  **Discrete Systems:** It presupposes we can non-arbitrarily distinguish the Producer (sensory) from the Consumer (motor/digestive). In a simple interneuron reflex, this boundary may be biologically fuzzy.
  2.  **Normal Conditions:** It presupposes a determinate description of the "Normal Condition" under which the Consumer succeeded in the past. We must be able to say, "The Consumer succeeded *because* Prey was there," rather than "The Consumer succeeded *because* Vibration was there."
  3.  **Homuncular Independence:** It presupposes the Consumer doesn't just respond to $N$, but responds to $N$ *as a guide to something else*. If the Consumer just digs whenever $N$ fires, and digging *is* the function, the distinction collapses.

  ---

  ### (c) A Case of Failure: The Perfect Correlation Problem

  The Producer/Consumer move fails when the "Normal Conditions" for the Consumer's success are themselves co-extensive in the selection history.

  **The Case:**
  Imagine that in the Burrower's evolutionary history, **Prey** was perfectly correlated with a specific **Soil Density** ($D$). Prey *only* lived in Soil Density $D$, and Soil Density $D$ *only* contained Prey.
  The Consumer (the digging/digesting system) succeeds when it digs in Soil Density $D$ (because it finds Prey).
  The Producer fires for Vibration $F$ (caused by Prey in Soil $D$).

  Now we have three descriptions that are locked together in the history:
  1.  **Prey is present.**
  2.  **Soil Density $D$ is present.**
  3.  **Nutrients are accessible.**

  The Consumer succeeds if *any* of these are true. If the insect digs in Soil $D$, it finds Prey and gets Nutrients. The Producer/Consumer split cannot distinguish between these contents.
  *   Does $N$ mean **Prey**? (Distal object)
  *   Does $N$ mean **Soil $D$**? (Medium property)
  *   Does $N$ mean **Nutrients**? (Biological value)

  The Consumer's function is satisfied by all three. There is no functional difference in the history between "mapping Prey" and "mapping Soil $D$." Teleosemantics predicts that the content is indeterminate between these descriptions, or it must arbitrarily select one (usually the most distal).

  **The Intuitively Wrong Verdict:**
  Suppose we introduce a mutation in the lab: A synthetic worm that lives in *different* soil ($D_{new}$) but vibrates at frequency $F$.
  *   If $N$ means **Soil $D$**, the state is **False** (wrong soil).
  *   If $N$ means **Prey**, the state is **True** (it is prey).

  Intuitively, if the insect digs and eats the synthetic worm, we want to say its perception was *correct* (it found food/prey). But if the teleosemantic analysis is tied to the historical correlation with Soil $D$, it might verdict the state as **False** (malfunction of the soil-detection function), or it remains silent on which property is the content. The theory struggles to privilege the *biological value* (Nutrients/Prey) over the *physical correlate* (Soil $D$) if both were equally necessary for the historical explanation of survival. It delivers a verdict of indeterminacy where our intuition says "It's food, so the signal was right."

  ---

  ### Critique of the Framing

  In closing, I must flag two points where your framing of the question performs illicit work that biases the outcome against teleosemantics.

  **1. The Reification of "Selection History"**
  You frame selection history as a raw datum that "licenses" descriptions ("selection history appears to license indefinitely many true descriptions"). This assumes history is external to the semantic analysis. A defender of teleosemantics should concede that **there is no selection history independent of the functional description.** We cannot recount *what* was selected without already assuming *what the system was doing*. To say "It was selected for Prey" is already to have adopted the Consumer's perspective. The "underdetermination" exists only if we treat history as a blind causal list rather than a functional explanation. The defender should concede that recovering the history is interpretive, but argue that the *biological function* (not the history per se) is the content-fixer.

  **2. The Assumption of Monolithic Content**
  You ask what the state "represents," implying a single propositional content (e.g., $N$ = "Prey"). Teleosemantics often suggests content is not a scalar but a vector of success conditions. The neuron doesn't represent "Prey" in the human sense; it carries a directive: *Dig-Here-For-Food*.
  **Concession:** A defender should concede that teleosemantics does not recover *human-style* intentional content (with fine-grained modes of presentation). It recovers *biological* content (conditions of satisfaction). If the theory cannot distinguish "Prey" from "Nutrient-Source" functionally, then biologically, there *is* no difference. The "problem" is only a problem if we demand the theory naturalize *our* semantic distinctions, rather than the organism's functional realities. The defender must concede that teleosemantics may be revisionary: it tells us what content *is*, even if it contradicts our intuitions about the Burrower's "thoughts."
