answer: |-
  Good evening. Welcome to the Kell River exhibition.

  We are standing at the entrance of a building divided into three rooms. I want to suggest that you walk through them not just as spaces, but as measures of time.

  The first room is the longest. It covers centuries. Here you will see maps of the meander belt, samples of the silt load, surveys showing how the channel has moved a mile east since the first records. This is the time of the river itself. It is slow, impersonal, and indifferent. It shows us that the valley has always been a place where water seeks the lowest ground. But if you are here because you lost someone on that night in 1975, I need to say something plain before you go any further. Knowing the silt load does not bring them back. Understanding the channel shift offers no comfort. It should not. The long view explains the stage, but it cannot explain the loss.

  The second room covers the fifty years before the flood. This is the time of our decisions. Here you will see the drainage works from the 1930s, the plans for the postwar estates built out onto the floodplain, the minutes from zoning meetings, the records of the dredging budget cut year after year. You will see the order to move the warning siren to the far bank in 1962 to save money.

  There is no villain in this room. There is no single name to blame. There is only the accumulation of choices that made sense at the time. We wanted housing. We wanted lower taxes. We wanted drainage. But vulnerability belongs to these middle years. It was here, in the quiet drift of policy and budget, that the risk was built. We did not just live on the floodplain; we constructed the conditions where a flood would become a disaster.

  The third room is the shortest. It covers only hours. This is the night itself. Here there are no maps and no budgets. There are the logs of the evacuations that worked, and the lists of the ones that did not. There are the nineteen names. There are the oars from the boats neighbours rowed for eleven hours in the dark.

  This room is not an illustration of the first two. It is the reason they exist. If the long view makes this night look like foam on the water, then the history is wrong. The water was real. The dark was real. The loss is irreplaceable.

  So, how do these three times fit together? We often ask if the flood was caused by the river or by us. This exhibition suggests that is the wrong question. The river's history made the flood possible, but our history made the deaths certain.

  The disaster was not an interruption of normal life, but a continuation of it.

  I know that claim will sit uneasily with some of you. Some will say the rain was too heavy for any plan to hold. Others will say the ground was always going to take us. But the records in the second room show that we had choices, and we chose risk.

  I invite you to walk through. Start with the river. Move through the decisions. End with the night. And when you leave, I ask that you carry the weight of all three.

  Thank you.

  ***

  **Note to Self**

  **The Sentence Doing the Most Work:**
  *"The river's history made the flood possible, but our history made the deaths certain."*
  This sentence bridges the three rooms without using jargon. It assigns the "possibility" to the geological long-term (Room 1), absolving the river of malice, but assigns the "certainty" of the human cost to the medium-term human decisions (Room 2). It forces the audience to accept that while the water was natural, the tragedy was constructed.

  **Reasonable Objections:**
  *   **The Event-Centred Listener (Families/Some Commissioners):** They would object to the word "certain." They would argue that the specific weather event was an anomaly—a "one-in-a-hundred-year" storm—that no amount of zoning could have fully mitigated. They want the night to be a freak accident, not a certainty.
  *   **The Deterministic Listener (Professors/Geographers):** They would object to the implication that "our history" was the deciding factor. They might argue that given the river's long-term sedimentation and meander trends (Room 1), the flood was geomorphologically inevitable regardless of zoning. They would see the human decisions as secondary to the environmental structure.
