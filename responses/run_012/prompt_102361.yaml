prompt: |-
  I'm putting together a short proposal for a one-semester research grant in philosophy of physics, and I've got a half-formed idea I'd like you to turn into something submittable. The idea: Gödel's rotating-universe solution to Einstein's field equations is usually read as showing that time is "unreal," because in that world there's no objective global order of becoming; but I think the argument quietly assumes that real time would have to be a global, observer-independent ordering. Swap that assumption for an indexical account of the "now" -- where the present isn't a location in the manifold but a feature of experience -- and the rotating universe stops being a threat to the reality of time; it only shows that one particular kind of global time-function is missing, which is a fact about that spacetime's geometry, not about time as such. Turn this into a proposal. Give me exactly five numbered points, each no more than a sentence or two, no intro and no conclusion, in British English. The five points should be: (1) the question, stated precisely enough to have a determinate answer; (2) why the standard positions leave it open; (3) the method -- what I'd actually do -- and why that rather than the obvious alternative; (4) what a result would look like and what would count as the project failing; (5) a realistic scope for a single semester. Don't bother with citations or a reading list, I'll add those myself.
