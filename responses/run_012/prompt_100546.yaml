      *   **Side B (The "Realist" or "Cognitivist" Reading):** Often associated with Norman Malcolm (in some moods), or critics like Nielsen or Plantinga (in different ways). Religious claims *are* truth-claims about reality. Believers treat them as such. If they aren't fact-stating, they are empty. Disagreement between believer and atheist must be possible.
