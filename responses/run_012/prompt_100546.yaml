      *   *Side B ( The Realist/Externalist):* Focus on the *phenomenology of belief*. Believers *feel* they are describing reality. They pray to a real God, not a symbol. If God doesn't exist, the belief is false. To deny this is to patronize the believer. Also, cross-language-game criticism *must* be possible (e.g., morality criticizing religion).

