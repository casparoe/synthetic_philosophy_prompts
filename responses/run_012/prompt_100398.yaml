      *   *Better Route:* Admit that QALYs are a specific *ethical* framework (utilitarian, health-maximizing) that *stipulates* comparability for the sake of decision-making, rather than claiming it is a scientific fact independent of value.
      *   *Concession:* The agency must concede that QALYs embody a specific theory of the good (health-based welfarism) and require interpersonal comparisons of value, not just technical measurement.

  6.  **Correction of User's Inclination:**
      *   *User:* "Broadly fair... live questions lie in aggregation rather than in measurement."
      *   *Correction:* This is the trap. The measurement *is* the value judgment. The construction of the QALY scale (0 = dead, 1 = full health, linearity between them) imposes a specific structure of value *before* aggregation happens. By assuming measurement is neutral, the user misses the normative loading in the metric itself. The "ordinalist objection" applies to the *construction* of the QALY weights just as much as the summation.

