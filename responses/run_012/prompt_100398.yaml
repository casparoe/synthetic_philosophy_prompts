answer: |-
  ### First: Sentence-by-Sentence Audit

  **1. "Since the ordinalist revolution, economists have understood that interpersonal comparisons of utility are meaningless."**
  *   **Verdict:** *Wince.*
  *   **Grounds:** This is standard textbook orthodoxy, but it conflates a methodological prohibition with an ontological claim. Economists *treat* them as meaningless for the purposes of positive science, but they are not meaningless for normative ethics. A philosopher would reject the implication that there is no fact of the matter; an economist would accept it as a rule of professional grammar. It is a simplification that masks the distinction between "cannot be measured scientifically" and "does not exist."

  **2. "Utility is a representation of a person's preferences, defined only up to any increasing transformation of the numbers assigned; there is therefore no fact of the matter as to whether my satisfaction exceeds yours, or whether a given gain to you outweighs an equal loss to me."**
  *   **Verdict:** *Right for the wrong reason.*
  *   **Grounds:** The definition of ordinal utility is correct. The inference to "no fact of the matter" regarding satisfaction is a non sequitur. Preferences are ordinal, but satisfaction (hedonic state) might be cardinal and comparable even if preferences are not. Conversely, if utility is defined *as* preference satisfaction, the statement holds only if one assumes preferences are the sole metric of value. The sentence smuggles in the claim that preference rankings are the only admissible data, ruling out cardinal intensity by fiat.

  **3. "Robbins's argument settled the question: scientific comparison requires a common unit, and no common unit of satisfaction exists."**
  *   **Verdict:** *Reject.*
  *   **Grounds:** Robbins did not settle the question; he drew a boundary around what counts as *scientific economics* to protect the discipline from metaphysical disputes. He argued that interpersonal comparisons are not *verifiable*, not that they are false. Furthermore, the claim that "no common unit of satisfaction exists" is an empirical or metaphysical claim that Robbins explicitly refused to make. He only claimed economics could not *use* such a unit.

  **4. "Modern welfare economics therefore confines itself to Pareto improvements, while the practical business of comparing policies has passed to cost–benefit analysis in money and, in health, to the QALY."**
  *   **Verdict:** *Accept (as description), Wince (as justification).*
  *   **Grounds:** It is true that academic welfare economics retreated to Pareto criteria. It is also true that policy analysis moved to CBA and QALYs. However, the sentence implies this transition solves the theoretical problem. It does not; it merely shifts the locus of the interpersonal comparison from "utility" to "money" (in CBA) or "health weights" (in QALYs). Both money and health weights rely on implicit interpersonal comparisons.

  **5. "A QALY is not a utility but a unit of health, and health states can be described and compared without appealing to anyone's satisfaction; a year lived in full health is a year lived in full health, whoever lives it."**
  *   **Verdict:** *Reject.*
  *   **Grounds:** This is the critical error. A QALY is explicitly a utility measure. The "Q" (Quality) weight is derived from preference elicitation techniques (Time Trade-Off, Standard Gamble) that ask individuals to trade off length of life against health states. These weights are cardinalized preferences. To claim they are "units of health" describable without appealing to satisfaction is to confuse the *biological description* of a state (e.g., "unable to walk") with the *valuation* of that state (e.g., "worth 0.7 of full health"). The phrase "whoever lives it" assumes interpersonal comparability of these valuations, which is precisely what the ordinalist objection forbids without further argument.

  **6. "The remaining difficulty is aggregation. To move from a set of individual QALY gains to a policy recommendation one must add them up, and that addition is a value judgment rather than a scientific finding — which is why we report totals alongside distributional breakdowns and leave the weighting to the commissioner."**
  *   **Verdict:** *Wince.*
  *   **Grounds:** It is true that summation (utilitarian aggregation) is a value judgment. However, by locating the *only* value judgment at the stage of aggregation, the author implies the measurement stage was value-free. It was not. The construction of the QALY scale (linear quality adjustment, equivalence of a QALY for a young person vs. an old person) embeds normative assumptions prior to aggregation. Shifting the "value judgment" label solely to the final sum misleads the clinician about where the ethics entered the calculation.

  ***

  ### Second: Inventory of Collapsed Distinctions

  Your colleague has folded three distinct technical distinctions into a single narrative slide. Each collapse allows a normative assumption to pass as a technical necessity.

  **1. Ordinality vs. Cardinality**
  *   **The Collapse:** The text moves from "utility is ordinal" (Sentence 2) to "QALYs are additive units" (Sentence 6) without explaining how we moved from ordinal preferences to cardinal measurement.
  *   **What Turns on It:** To add QALYs, the intervals between health states must be meaningful (cardinality). You cannot sum ordinal rankings. The construction of QALYs forces cardinality onto preferences via specific elicitation methods (e.g., assuming risk neutrality in Standard Gamble). By suppressing this, the text hides the assumption that individual preferences have a measurable *intensity* that can be standardized across persons.

  **2. Description vs. Valuation**
  *   **The Collapse:** Sentence 5 claims health states can be "described and compared without appealing to anyone's satisfaction."
  *   **What Turns on It:** This conflates the *clinical description* of a state (e.g., mobility level) with the *social value* of that state (the weight assigned in the QALY calculation). A clinician can describe a broken leg objectively; they cannot determine its QALY weight without asking someone how much they dislike it. By treating the weight as a property of the health state rather than a valuation of it, the text obscures the fact that the metric is preference-dependent.

  **3. Intrapersonal vs. Interpersonal Comparability**
  *   **The Collapse:** The text accepts the ban on interpersonal utility comparisons (Sentence 1) but assumes interpersonal *health value* comparisons are unproblematic ("whoever lives it," Sentence 5).
  *   **What Turns on It:** This is the most significant suppression. If I value a year in a wheelchair at 0.8 and you value it at 0.6, whose weight do we use? Standard QALY protocols average these to create a social tariff. This is an interpersonal comparison of value. The text treats the "QALY" as a common unit like a kilogram, but a kilogram is invariant across observers, whereas a QALY weight varies by observer. Treating the average weight as a "unit of health" assumes away the problem of interpersonal variation in valuation.

  ***

  ### Third: Assessment of the Practical Conclusion

  **The Claim:** The QALY-based analysis escapes the ordinalist objection because it measures health, not utility.

  **The Verdict:** This claim does not survive repair. The QALY does not escape the ordinalist objection; it circumvents it by *stipulation* rather than by *solution*.

  **The Analysis:**
  The ordinalist objection states that we cannot scientifically compare the subjective welfare of person A with person B. The economist argues QALYs avoid this by measuring an objective good (health). However, the "Quality" adjustment in QALY is not a biological measure; it is a measure of *preference strength* regarding health.
  1.  **Cardinality:** To calculate a QALY, we must assume preferences over health states are cardinal (that the difference between 0.2 and 0.4 is the same as 0.6 and 0.8). This violates strict ordinalism.
  2.  **Interpersonal Comparability:** To sum QALYs across a population, we must assume that a QALY for person A is equivalent to a QALY for person B. This is an interpersonal comparison of value.

  **The Better Route:**
  The agency should not claim QALYs escape the ordinalist objection. Instead, it should argue that for the purpose of *public resource allocation*, we must *adopt* a framework that permits interpersonal comparison.
  *   **Concession:** The agency must concede that QALYs are not "scientific findings" in the positivist sense. They are a *normative technology*.
  *   **Reframing:** The argument should be: "We cannot measure welfare scientifically without making value judgments. Therefore, we explicitly adopt a welfarist framework that values health extensions equally across persons. We acknowledge this requires assuming interpersonal comparability of health value. This is an ethical commitment, not a measurement discovery."
  *   **Why this matters:** If the agency claims it is measuring "health units" objectively, clinicians may believe the numbers are immutable facts. If they admit it is an ethical framework, clinicians can challenge the weights (e.g., "Why do we value a year for the disabled less than a year for the abled?").

  ***

  ### Fourth: Correction of Your Inclination

  **Your Inclination:** "I take the ordinalist point seriously, and I have always assumed that the live questions lie in aggregation rather than in measurement."

  **Where You Are Wrong:**
  You are granting the economist too much credit on the measurement side. You are assuming that we can successfully measure individual gains (the "QALYs") in a value-neutral way, and that the only ethical controversy is how to sum them (the aggregation).

  **The Correction:**
  The measurement *is* the aggregation of values within the individual, and it is already normatively loaded before the social summation occurs.
  1.  **Construction is Normative:** The process of generating a QALY weight involves forcing a respondent's preferences into a cardinal structure (usually von Neumann-Morgenstern utility). This imposes assumptions about risk attitude and time preference that are ethical choices, not measurement facts.
  2.  **The Unit is Not Neutral:** By defining the unit as a "Quality-Adjusted Life Year," the metric assumes that quality and quantity are trade-off-able at a specific rate. It assumes a year of life is the common denominator. This excludes other dimensions of welfare (autonomy, dignity, care-burden) that do not fit the "time" metric.
  3.  **The Ordinalist Objection Applies Upstream:** The ordinalist objection isn't just about comparing *my* total to *yours*. It is about whether *my* gain can be quantified as a number that represents "more good" in a way that is comparable to *your* number. If utility is ordinal, I can say I prefer State A to State B. I cannot say State A gives me "0.2 more units" than State B. The QALY claims I can. Therefore, the measurement itself violates the ordinalist constraint you wish to respect.

  **Summary for your Comment:**
  Do not let the economist off the hook by accepting that measurement is neutral and aggregation is the only value-laden step. The measurement instrument (the QALY) is a crystallized value judgment. Your critique should focus on the **reification of the metric**: the economist is treating a normative convention (the QALY scale) as a natural kind (a unit of health). Your job is to insist that if we are to use QALYs, we must own them as ethical constructs, not disguise them as scientific workarounds to the problem of interpersonal comparison.
