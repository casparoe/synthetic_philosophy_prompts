      *   *Sentence 3:* "Robbins's argument settled the question: scientific comparison requires a common unit, and no common unit of satisfaction exists."
      *   *Sentence 4:* "Modern welfare economics therefore confines itself to Pareto improvements, while the practical business of comparing policies has passed to cost–benefit analysis in money and, in health, to the QALY."
      *   *Sentence 5:* "A QALY is not a utility but a unit of health, and health states can be described and compared without appealing to anyone's satisfaction; a year lived in full health is a year lived in full health, whoever lives it."
      *   *Sentence 6:* "The remaining difficulty is aggregation. To move from a set of individual QALY gains to a policy recommendation one must add them up, and that addition is a value judgment rather than a scientific finding — which is why we report totals alongside distributional breakdowns and leave the weighting to the commissioner."

  3.  **Drafting the Audit (Sentence-by-Sentence):**
      *   *S1:* "Interpersonal comparisons... meaningless." Standard ordinalist dogma. *Wince:* It's a methodological prohibition, not necessarily an ontological truth. Philosophers reject it; some economists (Harsanyi, Sen) softened it. But within strict Paretian welfare econ, it's accepted.
      *   *S2:* "Utility... representation of preferences... increasing transformation." Correct definition of ordinal utility. "No fact of the matter..." *Wince:* Conflates measurement with ontology. Also, preferences $\neq$ satisfaction (hedonism vs. preference satisfaction).
      *   *S3:* "Robbins's argument settled the question..." *Reject:* Robbins didn't settle it; he stipulated a methodological boundary for *scientific* economics. Normative economics still needs comparisons. "No common unit of satisfaction" is the contentious claim.
      *   *S4:* "Modern welfare economics... Pareto... practical business... CBA/QALY." *Wince:* True that welfare econ got stuck with Pareto, but CBA *also* relies on interpersonal comparisons (via money as a proxy). QALY is introduced here as the solution.
      *   *S5:* "A QALY is not a utility but a unit of health... without appealing to anyone's satisfaction." *Reject:* This is the biggest error. QALYs are derived from preference elicitation (TTO, SG). They *are* cardinalized preferences over health states. They are not objective biological units like "blood pressure." They implicitly assume interpersonal comparability of health *value*.
      *   *S6:* "Remaining difficulty is aggregation... addition is a value judgment." *Accept/Wince:* Aggregation is a value judgment (utilitarian sum), but the measurement *prior* to aggregation already contains hidden value judgments (cardinality, comparability). Shifting the "value judgment" label only to the final summation is misleading.

  4.  **Inventory of Collapsed Distinctions:**
      *   *Ordinal vs. Cardinal:* The text jumps from "utility is ordinal" to "QALYs are cardinal health units." QALYs require cardinality (0 to 1 scale).
      *   *Preference vs. Hedonic Experience:* The text says QALYs don't appeal to satisfaction. But QALY weights come from preferences about health states.
      *   *Measurement vs. Valuation:* The text claims QALYs measure "health" objectively. But "quality" adjustment is a valuation of that health.
      *   *Intrapersonal vs. Interpersonal:* The text admits interpersonal utility comparison is impossible but assumes interpersonal *health value* comparison is possible ("whoever lives it"). This is the same problem in disguise.
      *   *Positive vs. Normative:* Claims QALY measurement is "scientific" (positive) and only aggregation is "value judgment" (normative). In reality, the weights are normative.

