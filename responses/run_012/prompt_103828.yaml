      *   So, I must say: She owns her body. If she chooses death, it is her right. The doctor's duty is not to preserve life at all costs, but to respect contract. Involuntary treatment is torture.
      *   Don't soften it. "I must be willing to stand by while a lucid woman dies." Yes.

