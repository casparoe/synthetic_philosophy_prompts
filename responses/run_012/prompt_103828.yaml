      *   *Address the "mental illness" concession:* Deny that anorexia is a disease in the medical sense. It is a conduct problem, a value judgment expressed through the body.
      *   *Address the coercion:* Force-feeding is assault, regardless of the medical label.
      *   *Address the dilemma:* Choose liberty over life. The state/doctor does not own the citizen/patient.
