      *   The user asks: "If she is a moral agent... stand by while a lucid woman dies." Szasz's counter: Yes. Just as we stand by while a hunger striker dies. To do otherwise is to claim ownership of her body.
      *   *Key phrase:* "Therapeutic sovereignty." "Body ownership."

