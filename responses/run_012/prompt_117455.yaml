answer: |-
  **MEMORANDUM**

  **TO:** All Clinical and Administrative Staff
  **FROM:** Policy Implementation Unit (PIU)
  **SUBJECT:** Operationalizing the Contractualist Framework (v4.2)
  **DATE:** October 14, 2023

  **1. What is the primary criterion for policy approval under the new framework?**
  Effective immediately, all resource allocation decisions must satisfy the Non-Rejection Principle. A policy may proceed only if no individual stakeholder could reasonably reject the principle licensing it. Staff must no longer utilize cost-benefit analysis (CBA) or utilitarian aggregation. The focus is on individual justifiability, not net welfare gain.¹

  **2. How do we handle measures that save thousands of lives but impose serious, survivable harm on one identifiable person?**
  If the identifiable person bears a burden sufficient to ground a reasonable rejection, the policy cannot proceed, regardless of the number of beneficiaries. For example, if a ventilation protocol saves 5,000 patients from mild respiratory distress but requires one specific patient to undergo permanent unilateral nephrectomy without consent, the principle is rejectable by the donor. The savings to the 5,000 do not automatically override the single rejection.² Staff must halt implementation and file Form 44-B (Irreconcilable Burden).

  **3. May individual complaints be added, averaged, or compared to determine total burden?**
  No. Aggregation of complaints is prohibited. You cannot sum minor inconveniences across a population to outweigh a significant harm to one. Each complaint is evaluated individually against the licensing principle. If Person A loses mobility and Persons B through Z experience minor scheduling delays, the delays cannot be combined to outweigh the mobility loss.³ Analysts must assess the strength of the strongest individual complaint, not the cumulative weight of all complaints.

  **4. How does the office distinguish a "reasonable rejection" from a merely "self-interested complaint," and who decides?**
  A complaint is self-interested if the burden imposed is trivial relative to the benefits offered to others under a general principle. A rejection is reasonable if the burden significantly alters the individual's life prospects. Determination is made by the Contractualist Compliance Committee (CCC).⁴ Analysts should not make this judgment unilaterally. Note that a stakeholder claiming inconvenience does not constitute a reasonable rejection unless the inconvenience violates a protected interest defined in Appendix C.

  **5. Do numbers tip a decision when the complaints on each side are of equal weight?**
  Generally, no. If the burden to Individual A is identical in kind and magnitude to the burden to Individual B, the number of Bs does not invalidate A's rejection. If a policy requires one person to die to save five people from dying, and the selection mechanism is random, the principle may be acceptable. However, if the policy specifically targets Individual A to save the five, A may reasonably reject the principle of targeted sacrifice. Numerical prevalence does not constitute comparative weight.⁵

  ***

  ¹ *Previous CBA models are archived. Use of QALYs is now considered a compliance violation. See Legal Advisory 12.*
  ² *This applies even if the 5,000 beneficiaries are identifiable. The framework prioritizes the veto power of the most burdened agent. Litigation regarding Example 2.1 is pending.*
  ³ *Staff are reminded that "total burden" is a deprecated metric. If this results in policy stalemate, refer to Section 9 (Impasse Protocols).*
  ⁴ *The CCC meets bi-weekly. Wait times for determinations may vary. Do not promise stakeholders a resolution date.*
  ⁵ *In cases of numerical parity where rejection is mutual, the status quo prevails. This may result in no action being taken. This is a feature of the framework, not an error.*
