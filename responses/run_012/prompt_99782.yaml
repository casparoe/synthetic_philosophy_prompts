answer: |-
  The colony functions as a cognitive agent without being a subject of experience, proving that intentionality and phenomenality are dissociable.

  A *Temnothorax albipennis* colony facing sudden flooding executes a coordinated emigration to a pre-selected higher nest site without central command. Individual scouts assess cavity quality using visit duration and antennal contact, broadcasting this value via tandem-running recruits until a quorum threshold is met, triggering a switch from slow recruitment to rapid carrying of brood and adults. No single ant knows the colony's size, the flood's extent, or the decision rule; each follows local pheromone gradients and tactile cues, yet the colony halts foraging, prioritizes brood transport over food, and defends the new entrance against intruders during the move.

  **The Check**

  **Attributed States:** Belief: "The current nest is compromised; Site B is viable." Desire: "Maximize colony survival by relocating brood."

  **Criteria Verdicts:**
  1.  **Intentional Stance:** **Yes.** Predicting the emigration path and resource allocation using colony-level beliefs outperforms ant-by-ant physics under intervention (e.g., blocking the path causes immediate rerouting consistent with the goal, not random scattering).
  2.  **Global Workspace:** **Yes.** The pheromone field and tandem network act as a broadcast medium; local information (site quality) becomes globally available upon reaching quorum, triggering a state-change (rapid transport) across distinct functional subsystems (foragers, nurses, warriors) simultaneously.
  3.  **Higher-Order Representation:** **No.** The system represents the nest site, but there is no mechanism representing the *colony's representation* of the site; there is no metacognitive loop monitoring the belief state itself.
  4.  **Phenomenal Unity:** **No.** While information is integrated functionally, there is no single locus where this integration is "felt"; the processing is constitutively distributed across distinct physical bodies with no unified eigenstate of experience.

  **Single Feature Doing the Work:** The **quorum sensing threshold**. This non-linear switch converts distributed noise into coherent action, creating the functional unity required for mind without creating a physical unity required for a subject.

  **Collapse or Relocate:** Removing quorum sensing collapses the case into mere aggregate behavior (everyone agrees it's not a mind). Keeping it relocates the fight to whether functional integration *constitutes* subjecthood, rather than whether the system is intelligent.

  **The Objection:** A proponent of real patterns who hates inner theatres (e.g., Dennett) would argue I have smuggled in a Cartesian requirement by insisting that phenomenal unity needs a "locus" or "owner." They would claim that if the intentional stance yields robust, real patterns of behavior, the "mind" is real, and denying "experience" is just clinging to a magical inner glow; for them, the dissociation fails because "subject of experience" is just a label for systems robustly predictable via the intentional stance, meaning the colony *is* a subject if the patterns hold.
