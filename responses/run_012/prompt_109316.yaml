      *Tone:* Academic, advisory, precise.

      *Let's refine the "Textual-Subject" evaluation.* Is it a confusion? Some might argue HP *requires* a belief-desire system. If LLMs don't have that, applying HP is a category error. The research question is: *Does HP require a belief-desire system, or just a text-generator?* That is the substantive question.
      *Let's refine the "Silent-Subject" evaluation.* Is it a confusion? Dennett might say "behavior is text." The research question is: *Can behavior be formalized as text without losing the 'phenomenological' aspect?*

