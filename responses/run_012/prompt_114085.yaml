  Three years ago, I drafted the words on this plate. I wrote that this swing proves space itself is real. Since then, I have learned to be more careful with the word "proof." Colleagues in this room know that whether space is a substance or a relation is a question that still breathes.

  But if the science is complex, the wonder is simple. You did not give us a monument to a finished theory, but an instrument for an enduring inquiry. This pendulum does not demand we agree on what space is; it demands we notice that motion is not always what it seems. It distinguishes the room we stand in from the universe we move through.

  So let this plate not be a tombstone for a debate, but a marker for curiosity. When you pass this way, do not just read the words. Watch the wire. Feel the turn. The inscription names a conclusion, but the swing offers a distinction: between the answer we carve in bronze and the question that keeps swinging. As this pendulum swings, may we always remain willing to turn beneath it.
