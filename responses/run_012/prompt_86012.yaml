          *   *Risk:* Moving to intrinsic quality risks breaking the quantitative calculus. If quality trumps quantity, how do we calculate? It risks collapsing into intuitionism or perfectionism.
          *   *Consistency:* Consistency with the *Principle of Utility* (maximize happiness). Mill argues recognizing quality *better* serves the principle because people actually prefer higher pleasures. It is *not* necessarily consistent with strict psychological hedonism if that implies all pleasures are commensurable.

      *   **Puzzle 3: "More desirable and more valuable"**
          *   *Desirable:* Capable of being desired OR worthy of being desired? Mill plays on this ambiguity later (Proof of Utility).
