      *   *Refining Puzzle 2:* "Consistency" is the key word. Consistency with the *Goal* (Happiness), not necessarily the *Method* (Calculus). The risk is that "Intrinsic Nature" opens the door to non-hedonic values (truth, beauty) being good *independently* of pleasure. Mill wants to say they are good *because* of the specific pleasure they produce.
