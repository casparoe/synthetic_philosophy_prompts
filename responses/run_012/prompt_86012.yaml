      *   *Sentence 2:* "It must be admitted, however, that utilitarian writers in general have placed the superiority of mental over bodily pleasures chiefly in the greater permanency, safety, uncostliness, &c., of the former—that is, in their circumstantial advantages rather than in their intrinsic nature."
