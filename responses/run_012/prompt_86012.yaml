  *(Self-Correction on Puzzle 2)*: "Consistency" with the Principle of Utility. The Principle says "maximize happiness." If happiness includes quality, then acknowledging quality is consistent. The risk is that if quality is independent of quantity, the calculus breaks.

  *(Self-Correction on Puzzle 3)*: "Desirable" = "Ought to be desired." "Valuable" = "Contributes to the end." The common measure is the *preference* of the competent judge, not a hedonic unit.

