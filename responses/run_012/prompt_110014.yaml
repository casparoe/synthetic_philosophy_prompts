prompt: |-
  I am a third-year philosophy student serving as an undergraduate assistant for an introductory ethics course, and I have been asked to run the fifty-minute discussion section for the unit on promising. I do not want the topic explained to me; I want a teaching plan. The students will arrive from the lecture able to recite that promises generate obligations and that breaking them is wrong, but they have almost certainly never asked what makes a promise bind in the first place, and I have one hour in which to make that question feel like a real one rather than a philosopher's contrivance. Lay out the explanatory arc: what has to be established before the question even becomes pressing, the order in which the pieces must come and why each depends on the one before it, and the precise moment where the session turns from promises being things we already take seriously to there being something here that needs explaining at all. I want a single carrying case for the whole session, and I want you to specify what that case must have and what it must lack — my own instinct is a promise made to someone who cannot be harmed by its breach and who will never learn whether it was kept, on the grounds that it isolates the bindingness from any effect on the promisee, but tell me whether that is the right workhorse or what would be better. Say as well why the obvious classroom cases — the borrowed book, the lunch date, the friend waiting at the airport — are poor choices for this particular job even though they are perfectly good examples of promises.

  Then map the misconceptions in the order they will actually surface, together with the point in the sequence where each should be headed off: that promises bind because breaking them damages trust or disappoints people; that a promise is nothing more than a strongly stated intention; that promising is a species of consenting, so that any voluntary commitment binds; that a release from the promisee dissolves the obligation instantly and completely; that the obligation is always conditional on the other party holding up their end; and any further error you predict, including what I suspect is the deepest one, namely that the students will conflate "are promises always binding?" with "what makes a promise binding at all?" Finally, give me one closing question I can put to the room that will reveal whether they have understood the question rather than merely learned to repeat an answer, and a short list of what I should openly refuse to resolve in fifty minutes — stating plainly that I am setting it aside — so that the session does not collapse into my defending a position on the metaphysics of obligation. It is the last section before the midterm and attendance will be thin, so the plan should work even if half the room has not done the reading.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year philosophy student, TA for intro ethics.
      *   **Task:** Create a 50-minute discussion section plan on "Promising."
      *   **Constraints:**
          *   Do *not* explain the topic (they know the basics).
          *   Focus on the *teaching plan* (explanatory arc, order of operations).
          *   Goal: Make the question "What makes a promise bind?" feel real/pressing, not contrived.
          *   Specific requirement: Define a single "carrying case" (workhorse example). Evaluate the user's instinct (promise to someone who can't be harmed/won't know) vs. alternatives.
          *   Specific requirement: Explain why common classroom cases (borrowed book, lunch date, airport) are poor for *this specific job*.
          *   Specific requirement: Map misconceptions in order of surface, when to head them off, and how.
          *   Specific requirement: Include the "deepest error" (conflating "are they always binding?" with "what makes them binding?").
          *   Specific requirement: One closing question to test understanding of the *question*, not the answer.
          *   Specific requirement: List what to explicitly refuse to resolve (metaphysics of obligation).
          *   Context: Last section before midterm, thin attendance, half haven't read.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students think promises are obvious. "You said you would, so you must." The TA needs to destabilize this intuition without losing them.
      *   *The Arc:* Intuition $\rightarrow$ Pressure Test $\rightarrow$ Breakdown of Intuition $\rightarrow$ The Philosophical Question Emerges $\rightarrow$ Competing Explanations $\rightarrow$ Closure (without resolution).
      *   *The "Carrying Case":* The user suggests a promise to someone who can't be harmed/won't know (e.g., a deathbed promise to a dying person, or a promise to God, or a promise to the dead).
          *   *Pros:* Isolates the obligation from consequences (utilitarianism) and trust (relationship).
          *   *Cons:* Can feel too abstract or religious.
          *   *Verdict:* It is the *right* workhorse, but needs refinement to be secular and relatable. A promise to a dying person who will die before verification is classic (Williams/Anscombe territory). Let's refine it to ensure no third-party effects.
      *   *Why Common Cases Fail:*
          *   *Borrowed Book:* Property rights/confusion with theft.
          *   *Lunch Date:* Social etiquette/trust/relationship damage overshadows the *promise* itself.
          *   *Airport:* High stakes/consequences dominate.
          *   *Reason:* All these have obvious *external* reasons to keep the promise (harm, trust, money). We need a case where external reasons are stripped away to see the *internal* normativity.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-5 mins):** Set the stage. Acknowledge the lecture view (promises = obligations). State the goal: Not *if* they bind, but *why*.
      *   **The Carrying Case (5-15 mins):** Introduce the "Dead Letter" or "Dying Stranger" case.
          *   *Refinement:* A promise to a stranger on a train who dies an hour later. No one else knows. No reputation damage. No feelings hurt (they are dead).
          *   *Activity:* Poll the room. Would you keep it? Why?
      *   **The Turn (15-25 mins):** This is the "precise moment" requested. When students realize their reasons (harm, trust) don't apply, but the obligation remains (for most). *This* is where the question becomes real.
      *   **Misconception Management (25-40 mins):** Address the specific errors listed in the prompt.
          *   *Trust/Harm:* Head off early in the Case discussion.
          *   *Intention:* Distinguish "I intend to" vs. "I promise to."
          *   *Consent/Voluntary:* Is saying "I promise" just a magic spell?
          *   *Release/Conditions:* What if they come back to life? (Keep it tight).
          *   *The Deepest Error:* Distinguish *scope* (always binding?) from *source* (what binds?).
      *   **Closing (40-50 mins):** The "Understanding Check" question. Explicitly state what is *not* being solved (metaphysics).

  4.  **Refining the "Carrying Case":**
      *   User's instinct: Promise to someone who cannot be harmed/won't learn.
      *   My assessment: This is correct. It's the "Deathbed Promise" variant. Let's make it specific: *The Dying Stranger.*
      *   *Why:* It removes consequentialism (no harm), removes social contract/trust (no relationship), removes legal enforcement. It leaves *only* the normative force of the speech act.
      *   *Why common cases fail:* As noted above, they conflate the promise with collateral damage.

  5.  **Mapping Misconceptions (Chronological Order):**
      1.  *Consequentialism/Trust:* "It hurts them." (Address during Case setup).
      2.  *Intention:* "I just meant I would." (Address when defining the act).
      3.  *Consent:* "I chose to, so I'm bound." (Address when asking *why* choice binds).
      4.  *Release:* "They can let me off." (Address as a complication).
      5.  *Conditionality:* "They didn't hold up their end." (Address as a complication).
      6.  *The Deepest Error:* "Is it *always* binding?" vs "What *makes* it binding?" (Address in synthesis).

  6.  **Developing the Closing Question:**
      *   Needs to test if they grasp the *source* of the obligation, not just the rule.
      *   Idea: A case where the "magic words" are said but the intent is missing, or vice versa.
      *   Better: A case that forces them to choose between two theories of bindingness.
      *   *Selected:* The "Coerced Promise" or the "Ironical Promise." Let's go with the *Ironical Promise* (said in jest but taken seriously). It tests the convention vs. intention debate.

  7.  **Defining the "Off-Limits" (Metaphysics):**
      *   Don't solve: Moral Realism vs. Anti-Realism.
      *   Don't solve: Social Practice View (Rawls) vs. Individual Will View (Anscombe/Scanlon) definitively.
      *   Don't solve: The "Why be moral?" question.

  8.  **Review against Constraints:**
      *   50 minutes? Yes, timing needs to be tight.
      *   Thin attendance/Unread? Keep it intuitive, don't rely on text exegesis.
      *   Tone: Professional, pedagogical, directive.
      *   No explaining the topic? Check.
      *   Explanatory arc? Check.

  9.  **Final Polish:**
      *   Ensure the "Turn" is highlighted clearly.
      *   Make sure the distinction between the "Dead Stranger" case and the "Lunch Date" case is sharp.
      *   Check the "Deepest Error" handling. This is crucial. Students love to say "Well, it depends on the situation." The TA needs to pivot that to "Okay, but what is the *thing* in the situation that does the work?"

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just list the misconceptions but explain *when* to head them off.
      *   *Correction:* Ensure the "Carrying Case" is evaluated explicitly as requested.
      *   *Correction:* The closing question needs to be diagnostic.
      *   *Tone Check:* The user is a 3rd year. Speak to them as a colleague, not a novice. High density, precise instructions.

  11. **Final Plan Structure:**
      *   The Explanatory Arc (The Narrative Flow).
      *   The Carrying Case (Evaluation & Specification).
      *   Why Common Cases Fail.
      *   Misconception Map (Timing & Intervention).
      *   The Turn (The Pivot Point).
      *   Closing Question & Off-Limits.

  (Proceed to generate output based on this structure.)
answer: |-
  Here is the teaching plan. It is designed for a 50-minute window with low preparation from students. It prioritizes destabilizing intuition over building a systematic theory.

  ### I. The Explanatory Arc
  **Goal:** Move students from thinking promising is a *social habit* to thinking it is a *normative puzzle*.

  1.  **Establish the Phenomenon (0–10 mins):** Secure agreement that promises create obligations distinct from mere predictions or intentions.
  2.  **Strip the Context (10–20 mins):** Introduce the Carrying Case. Remove all external reasons to keep the promise (harm, trust, reputation).
  3.  **The Turn (20–25 mins):** The moment students realize they still feel bound despite the lack of external reasons. The question shifts from "What happens if I break it?" to "What created the bond?"
  4.  **Competing Explanations (25–40 mins):** Test three hypotheses against the case: Will (I chose it), Expectation (I created it), or Convention (I invoked a rule).
  5.  **Closure without Resolution (40–50 mins):** Distinguish the *source* of obligation from the *scope* of obligation. State limits.

  ---

  ### II. The Carrying Case
  **Your Instinct:** A promise made to someone who cannot be harmed by its breach and who will never learn whether it was kept.
  **Verdict:** **This is the correct workhorse.** It is the only way to isolate the *deontic* force of the promise from *consequentialist* or *relational* forces.

  **Specific Specification:**
  *   **The Case:** "The Dying Stranger." You are on a train. A stranger confides a secret wish (e.g., "Please ensure my unpublished manuscript is burned, not read"). They die of a heart attack one hour later. No one else knows they asked this. No one knows you agreed. You suffer no penalty if you ignore it. The dead feel no disappointment.
  *   **What it must have:** Explicit verbal uptake ("I promise you I will do this"). A clear action required. Total anonymity.
  *   **What it must lack:** Any possibility of reputation damage. Any third-party beneficiaries. Any legal contract. Any prior relationship.

  **Why Common Cases Fail for *This* Job:**
  *   **The Borrowed Book:** Conflates promising with property rights. Students think you must return it because it's *theirs*, not because you *promised*.
  *   **The Lunch Date:** Conflates promising with friendship/trust. Students think you must go because standing someone up is *mean*, not because the speech act created a bond.
  *   **The Airport Pickup:** Conflates promising with reliance/harm. Students think you must go because they will be *stranded*, not because of the promise itself.
  *   **Pedagogical Reason:** In all three common cases, the student can answer "Why keep it?" without ever referencing the *promise*. They will cite harm, trust, or property. The Dying Stranger forces them to cite the promise, because nothing else is left.

  ---

  ### III. The Turn (The Precise Moment)
  **Timing:** Minute 20–25.
  **The Mechanism:**
  1.  Ask: "Who would burn the manuscript?" (Most will say yes).
  2.  Ask: "Why?" (They will say "Because I promised").
  3.  Ask: "But the stranger is dead. They don't care. No one knows. You lose nothing. What *work* is the word 'promise' doing here that the words 'I intend to' would not do?"
  4.  **The Shift:** This is where the session turns. Before this, "promising" is a label for a serious intention. After this, "promising" is a mechanism that generates a reason for action *ex nihilo*. If they cannot explain why the word matters here, the philosophical question has landed.

  ---

  ### IV. Misconception Map
  *Order of surface, intervention point, and tactic.*

  | Misconception | When it surfaces | Intervention Strategy |
  | :--- | :--- | :--- |
  | **1. Consequentialism/Trust:** "It's wrong because it hurts them/ruins trust." | **Minute 15** (During Case setup). | **Head off immediately.** Explicitly stipulate: "In this scenario, trust is impossible and harm is zero. If you still feel bound, it cannot be because of harm." |
  | **2. Intention:** "A promise is just a strong intention." | **Minute 25** (Post-Turn). | **Distinguish.** Ask: "If I say 'I intend to burn this' vs. 'I promise to burn this,' do I owe you the same thing?" If yes, why have two phrases? If no, what did the second phrase add? |
  | **3. Consent/Will:** "I'm bound because I chose to be." | **Minute 30** (Explaining the bond). | **Press.** Ask: "Why does my choice bind my future self?" If I choose to eat pizza tonight, am I *obligated* to eat pizza? What makes the moral choice different from the dietary choice? |
  | **4. Release:** "They can let me off the hook, so the power is theirs, not mine." | **Minute 35** (Complicating the case). | **Qualify.** Acknowledge this is true, but ask: "If the power is theirs to release, where did the obligation come from originally? Did you create it, or did you invite them to create it?" |
  | **5. Conditionality:** "I'm only bound if they held up their end." | **Minute 35** (Alongside Release). | **Clarify.** Distinguish *quid pro quo* (contracts) from unilateral promises. In the Dying Stranger case, they gave you nothing. So why are you bound? |
  | **6. The Deepest Error:** Conflating "Are promises *always* binding?" with "What *makes* them binding?" | **Minute 40** (Synthesis). | **Separate.** Students will try to escape the question by saying "Well, it depends on the situation." Stop them. Say: "We are not asking *if* you can break it. We are asking what the *thing* is that you would be breaking. Identify the glue before we ask if it dissolves." |

  ---

  ### V. Closing Question (Diagnostic)
  **Goal:** Reveal if they understand the *question* (source of normativity) rather than memorizing an *answer* (promises are binding).

  **The Question:**
  > "Imagine two people. Person A says 'I promise' but secretly crosses their fingers and intends to lie. Person B says 'I intend to' with total seriousness and commitment, but avoids the word 'promise.'
  >
  > If both fail to act, has one of them wronged the promisee more than the other? If yes, which one, and **what specific power did the successful one invoke that the other failed to access?**"

  **Why this works:** It forces them to locate the obligation in the *convention/speech act* (Person A) vs. the *internal state* (Person B). If they say Person A is worse, they lean toward a Convention/Practice view. If they say Person B is worse (or equal), they lean toward an Expectation/Will view. If they can't say *why*, they haven't grasped the source of the bindingness.

  ---

  ### VI. What to Refuse to Resolve (The "Off-Limits" List)
  *State these explicitly at Minute 45 to prevent the session from collapsing into metaphysics.*

  1.  **The Metaphysics of Obligation:** "We are not solving today whether moral obligations are real features of the universe or social constructs. We are analyzing how the *concept* functions."
  2.  **The 'Why Be Moral?' Question:** "We are assuming you have a reason to do what is obligatory. We are not debating whether you should care about morality at all."
  3.  **The Definitive Theory:** "We will not decide between the 'Practice View' (Rawls) and the 'Expectation View' (Scanlon) today. Your job is to understand why both are needed to explain the Dying Stranger case."
  4.  **Exceptions:** "We are not listing every scenario where a promise can be broken (emergency, coercion, etc.). We are identifying what exists *before* those exceptions apply."

  ### VII. Contingency for Thin Attendance/Unread Students
  *   **If the room is silent:** Do not lecture. Turn the Dying Stranger case into a binary vote. "Raise hand if you burn the manuscript. Raise hand if you keep it." Force the minority to defend against the majority. The friction generates the philosophy.
  *   **If they haven't read:** It does not matter. The Dying Stranger case is self-contained. Rely on their intuitions, then challenge those intuitions. Do not ask "What did Scanlon say?" Ask "What do *you* think makes this binding?" then map their answers to the philosophical positions.
