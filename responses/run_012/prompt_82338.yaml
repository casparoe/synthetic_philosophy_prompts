  2.  **Deconstruct the Core Idea (Conceptual Slippage):**
      *   *Traditional View:* Concepts are buckets. Input goes in, label comes out. Analogy is mapping bucket A to bucket B.
      *   *Slippage View:* Concepts are elastic. The pressure of the context changes the boundaries of the concept itself. "Same song" means something different when played on a piano vs. hummed vs. remixed.
      *   *The Gap:* Hofstadter's *Fluid Concepts and Creative Analogies* is the bible here, but it's old (1995). Connectionism and Transformers have changed the landscape. We need to bridge the philosophical/cognitive theory with modern representation learning *without* building the models ourselves.

  3.  **Brainstorming Open Questions:**
      *   *What triggers slippage?* Is it cognitive load? Social context? Novelty?
      *   *How is slippage constrained?* If concepts slip, why doesn't everything mean everything? (The "gullibility" problem).
      *   *Who decides?* Is slippage individual or communal? (The "same recipe" example implies social agreement).
      *   *Representation:* How do you encode a concept that *can* slip? Is it a distribution? A prototype with error bars?
      *   *Evaluation:* How do we measure the *degree* of slippage?

  4.  **Filtering & Prioritizing (The "Ordering Defended" Requirement):**
      *   *Criterion 1: Upstream.* Must be foundational. If we don't solve this, the rest doesn't matter.
      *   *Criterion 2: Feasibility.* No ML infrastructure. Must be thought experiments, behavioral design, or formal analysis.
      *   *Criterion 3: Value to Builders.* The output must be useful for someone who *can* code a system.

      *   *Candidate 1: The Constraint Problem.* Why doesn't slippage lead to chaos? (Upstream).
      *   *Candidate 2: The Social/Normative Dimension.* Who authorizes the slip? (Crucial for "same recipe").
      *   *Candidate 3: The Representation Problem.* How to mathematically model elasticity? (Too technical for no-ML group? Maybe too abstract).
      *   *Candidate 4: The Trigger.* When does slippage happen? (Downstream of constraints).

      *   *Selection:*
          1.  **The Constraint Boundary:** What stops the slip? (Most upstream).
          2.  **The Authority of Slippage:** Is it objective or negotiated? (Crucial for the "recipe/song" examples).

  5.  **Identifying Dead Ends:**
      *   *Pure Structural Mapping (SME):* Too rigid. Ignores the "bending" part.
      *   *Searching for a "True" Essence:* If the point is slippage, looking for the invariant core is missing the point.
      *   *Just scaling Copycat:* Doing letter strings with bigger alphabets is boring and solved by LLMs implicitly.
      *   *Phenomenology without Constraints:* Just describing how it *feels* to slip without asking *why it works* is navel-gazing.

  6.  **Developing the 10-Week Arc:**
      *   Weeks 1-3: Foundations & Critique (Hofstadter + Modern Critique).
      *   Weeks 4-6: The Core Problem (Constraints & Authority).
      *   Weeks 7-9: Case Studies (Recipes, Songs, Moves).
      *   Week 10: Synthesis (The Handoff).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the shift from Copycat to real-world semantics.
      *   *The Big Question:* Focus on **The Stability/Plasticity Trade-off**. This is the upstream issue. If concepts slip, how do we communicate?
      *   *The Second Question:* **The Locus of Authority**. Is the slip in the head or in the culture?
      *   *Dead Ends:* Be blunt. Don't waste time on "is analogy computable?" (Yes, LLMs do it). Don't waste time on "what is the true definition."
      *   *The Handoff:* What do ML people need? They need loss functions or architectural constraints. The group should define the *conditions* under which slippage is valid.

  8.  **Refining the "Running Example":**
