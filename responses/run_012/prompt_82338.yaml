      *   *10 Weeks?* Yes, the schedule fits.
      *   *Philosophy/Cog-Sci?* Yes, leans on Wittgenstein, Gärdenfors, Conceptual Spaces.
      *   *Defended Ordering?* Yes, explain why Constraints come before Triggers.

  10. **Tone Check:** Needs to be direct, intellectual, slightly provocative ("tell me straight"), and actionable. Avoid academic fluff.

