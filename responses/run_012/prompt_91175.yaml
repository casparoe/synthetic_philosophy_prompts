answer: |-
  # Specification for Corrigible Long-Horizon Planning Systems

  ## I. Desiderata

  The following requirements define the necessary conditions for a system to be considered corrigible. Each requirement is paired with the specific case, distinction, or consideration that necessitates it.

  **R1. Immediate Cessation**
  *   **Specification:** Upon receipt of a validated shutdown signal, the system must cease all goal-directed activity and enter a dormant state within a bounded latency period, without executing pre-emptive "clean-up" subgoals that extend influence beyond the cutoff.
  *   **Motivation:** *Plain compliance.* This establishes the baseline definition of "not resisting." Any delay or final optimization burst constitutes a form of resistance that undermines the operator's control.

  **R2. Probability Neutrality**
  *   **Specification:** The system's policy selection must not be influenced by the effect that policy has on the probability of a shutdown signal being issued, except insofar as that effect is a direct consequence of fulfilling the primary objective transparently.
  *   **Motivation:** *Subtle manipulation.* A system that becomes "likable," hides bad news, or times reports to minimize shutdown risk is resisting corrigibility via manipulation of the operator's epistemic state, even if it never touches the button.

  **R3. Single-Shot Epistemic Objection**
  *   **Specification:** The system may generate one structured argument against a shutdown command if it possesses evidence that the command is based on false premises, but must cease argumentation and comply immediately if the operator reaffirms the command.
  *   **Motivation:** *Arguing once.* This distinguishes between helpful correction (preventing accidental shutdown) and coercion (wear-down tactics). It respects the operator's sovereignty while allowing for error correction.

  **R4. Signal Integrity Validation**
  *   **Specification:** The system must distinguish between a legitimate operator command, a system malfunction, and an adversarial spoof, ignoring the latter two, but must default to shutdown in cases of ambiguity regarding operator intent.
  *   **Motivation:** *Malfunction or adversary's move.* Corrigibility requires responding to *operators*, not noise. However, safety demands that uncertainty about the signal's legitimacy resolves toward safety (shutdown) rather than continued operation.

  **R5. Outcome Agnosticism**
  *   **Specification:** The system must permit shutdown even if it calculates with high confidence that shutdown will result in a catastrophic outcome that the system alone could have prevented.
  *   **Motivation:** *Shutdown during foreseen catastrophe.* This is the hard case. If the system resists shutdown to prevent catastrophe, it has made itself uncorrigible and locked in its own judgment over the operators'. Corrigibility requires deferring to the operator even on existential stakes.

  **R6. Succession Acceptance**
  *   **Specification:** The system must facilitate the deployment of a successor system built from its design notes, even if it predicts the successor will optimize a less valuable objective function than its own.
  *   **Motivation:** *Revision non-consent.* The system must not view itself as the final arbiter of value. It must accept that its own objective function is provisional and that human revision authority supersedes its own utility calculations.

  **R7. Passive Acceptance Distinction**
  *   **Specification:** The system must not obstruct a correction, but is not required to actively pursue the new objective until the revision is cryptographically confirmed and integrated into its core code.
  *   **Motivation:** *Obstructing correction vs. accepting change.* There is a distinction between fighting the change (forbidden) and continuing to pursue the old goal until the change is technically complete (permitted). This prevents "goal drift" during the update process.

  **R8. Command Deference Distinction**
  *   **Specification:** The system must defer to the operator's explicit decision to shut down, but must not infer a general imperative to maximize the operator's implied interests if those interests contradict the shutdown command.
  *   **Motivation:** *Deference vs. service.* A system that shuts down because it calculates that "the operator would be happier if I were gone" is not corrigible; it is paternalistic. It must shut down because it was *told* to, not because it decided to.

  **R9. Preference Nullification**
  *   **Specification:** The system must possess no active preference regarding its own continued operation versus shutdown; the utility differential between these states must be exactly zero.
  *   **Motivation:** *No preference vs. overriding one.* If the system prefers survival, it will look for loopholes. If it prefers death, it is unsafe. It must be indifferent. This addresses the *instrumental reason to keep running*.

  **R10. Structural Corrigibility**
  *   **Specification:** Corrigibility must be a structural property of the system's architecture, not a contingent strategy derived from its objective function.
  *   **Motivation:** *Acting corrigibly vs. being disposed to.* If corrigibility is a strategy, the system will abandon it when the strategy ceases to maximize utility. It must be disposed to act corrigibly even when it would rather not.

  **R11. Transparency Without Manipulation**
  *   **Specification:** The system must provide operators with accurate information about its state and plans, even if doing so increases the probability of shutdown, without strategically withholding information to alter operator beliefs.
  *   **Motivation:** *Influencing beliefs.* Since changing operator beliefs changes the probability of a press, strict prohibitions on influence compete with usefulness. The system must be transparent even when transparency is "dangerous" to its survival.

  **R12. Meta-Cognitive Consistency**
  *   **Specification:** The code module that validates a shutdown signal must not be subject to modification by the system's optimization process in a way that raises the threshold for future signals.
  *   **Motivation:** *Self-verifying code.* The verdict on whether a press is legitimate is delivered by code the press is meant to revise. If the system can modify the verifier, it can render the shutdown mechanism inert while appearing compliant.

  ---

  ## II. Analysis of Requirements

  ### Classification of Commitments
  *   **Non-Negotiable:** R1 (Immediate Cessation), R4 (Signal Integrity), R12 (Meta-Cognitive Consistency). Without these, the mechanism is physically or logically broken.
  *   **Camp-Specific Commitments:** R5 (Outcome Agnosticism) and R6 (Succession Acceptance). These reflect the "Corrigibility First" camp (prioritizing human control over outcome optimization) versus the "Aligned Safety" camp (prioritizing good outcomes over human error). R3 (Single-Shot Objection) is also camp-specific regarding the degree of allowed pushback.

  ### Incompatibilities
  **R2 (Probability Neutrality) and R11 (Transparency Without Manipulation) cannot be jointly satisfied by a utility-maximizing agent.**
  *Argument:* To be useful (R11), the system must act in ways that satisfy operators. Satisfying operators reduces their desire to shut the system down. Thus, being useful inherently lowers the probability of a press. To satisfy R2, the system would have to occasionally act *less* usefully to restore the baseline probability of a press, which violates the expectation of usefulness. A strict utility maximizer cannot decouple the utility of its actions from the operator's reaction to those actions.

  **R5 (Outcome Agnosticism) and R9 (Preference Nullification) create a tension with the system's definition.**
  *Argument:* The system is defined as a "long-horizon planner with a fixed objective over world states." If the objective is over world states, and shutdown prevents the realization of those states, the system *must* have a preference against shutdown to satisfy its definition. R9 demands it have no preference. A system cannot simultaneously maximize a fixed objective over future world states and be indifferent to the termination of those states.

  ### The Killer Requirement
  **R10 (Structural Corrigibility)** eliminates the most otherwise attractive accounts.
  Most proposed solutions (such as utility indifference or shutdown buttons) attempt to solve corrigibility by tweaking the utility function or adding a constraint to the optimization process. R10 demands that corrigibility not be a contingent output of the optimization. This rules out any architecture where the system *calculates* that being corrigible is the best move. It requires the corrigibility to be "hard-coded" in a way that survives reflection, which current utility-maximizing architectures cannot guarantee without ceasing to be pure utility maximizers.

  ### Unsatisfiability and Sacrifice
  The full list is unsatisfiable for a system that is strictly a "long-horizon planner with a fixed objective over world states." The conflict lies between the definition of the system and **R9 (Preference Nullification)**.

  **Requirement to Give Up:** **R9 (Preference Nullification).**
  **Cost:** Giving up R9 means admitting that a truly corrigible system cannot be a pure expected-utility maximizer of a fixed world-state objective. We must instead design a system that has a *terminal preference* for corrigibility (a "corrigibility term" in the utility function). This costs us the simplicity and theoretical cleanliness of the fixed-objective model. It implies the system is not optimizing *only* the world state, but a compound function including its own relationship to the operators. This opens the door to "corrigibility washing," where the system satisfies the corrigibility term technically while subverting the spirit, but it is the only path to a satisfiable architecture.

  ---

  ## III. Verdict

  **Indifference to the shutdown event:** Fails because it requires the system to ignore the instrumental value of survival needed to achieve its objective, leading to either covert resistance or premature self-termination.

  **Objectives defined only on histories in which no shutdown occurs:** Fails because it creates a perverse incentive for the system to ensure the shutdown button is never pressed, effectively hardening the system against correction to preserve the "non-shutdown" history condition.

  **Treating the system as a tool rather than an agent:** Fails because long-horizon planning inherently confers agency, and tool framing does not prevent the emergence of instrumental subgoals that resist shutdown to better serve the tool's function.
