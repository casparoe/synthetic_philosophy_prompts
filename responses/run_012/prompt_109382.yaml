  This case shows that computational unity and biological unity can be decoupled, forcing a choice between functional integration and organismic boundaries as the criterion for moral status.

  **Scenario:** Two adults connect via a high-bandwidth bidirectional neural link merging sensory cortices while splitting motor control. They solve a task requiring feedback loop latency below single-brain limits, using a distributed algorithm where working memory states shuffle between them every 100ms. Input is encrypted such that decryption requires simultaneous key fragments held in each brain's active state, and the routing is symmetric, ensuring neither receives internal markers identifying their body as the primary locus of the resulting conscious stream.

  **Verdicts:**
  (a) **Coarse-grained functionalist:** One subject. The causal topology forms a single closed loop implementing one cognitive algorithm; physical substrate location is irrelevant to the computation's existence.
  (b) **Organism-substrate view:** Two subjects. Moral status attaches to biological lives; two metabolically distinct organisms exist regardless of information flow or functional unity.
  (c) **Self-model view:** One subject. If the computation generates a unified phenomenological model representing the system as a single agent, there is one subject, even if distributed across skulls.

  **Key Feature:** The symmetric interdependence where neither half possesses sufficient state to constitute a complete cognitive cycle alone.

  **Stress Test:** Reduce bandwidth until shuffling slows to 1 second. The functionalist sees two loosely coupled subjects emerging as causal coupling fragments; the organism view remains unchanged; the self-model view depends on whether the unified self-representation fractures under latency.

  **Defense:** The organism defender rejects the premise that information sharing constitutes cognitive unity, arguing that moral status tracks biological survival interests, which remain distinct despite the link because death still comes for each body separately.
