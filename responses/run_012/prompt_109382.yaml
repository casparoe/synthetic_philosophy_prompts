prompt: |-
  Ok, longtime lurker on the rationalist blogs here, and I've been going down a rabbit hole on "which computations matter morally." I want a thought experiment built to order, not an essay. I keep going back and forth on wether moral status attaches to the computation itself or to the boundary of the thing running it, and I want the case to force the issue.

  The variable I want isolated: one single computation spread across two organisms, such that a computationalist is pushed to say there's one subject there, while an organism-boundary view is pushed to say there are two — and both verdicts have to fall out of the theories, not be stipulated by me.

  Constraints:
  - No exotic physics, no perfect simulators, no "imagine a machine that...". A high-bandwidth neural link between two adult humans — a beefed-up version of what's already in labs — is the fanciest thing allowed.
  - Dont stipulate that the pair feels like one person or like two. That's exactly what the case is supposed to settle.
  - It has to be genuinely one computation, not two people cooperating. Ideally something neither half can do alone, and something where neither half can tell from the inside which half it is. Sharpen this as far as you can without hiding behind the word "integration."
  - The scenario itself: one paragraph, max.

  Then, for each of these, state the verdict and why: (a) a coarse-grained functionalist; (b) someone who thinks a subject needs a single biological organism as its substrate; (c) someone who thinks a subject needs a self-model that represents the whole system as itself. Tell me which single feature of the case is doing the work. Then say what happens if I remove that feature — the link goes one-way, the bandwidth drops, the two halves are the two hemispheres of one person, whatever you think is the cleanest stress test. Finally, if one of the three views comes out badly, tell me how its defender would attack the case instead of accepting the verdict.

  No cites or reading list needed. Under 700 words, and lead with the bottom line — one sentence saying what the case shows, then build it.
