answer: |-
  This is a razor-sharp reading. You are applying Jaegwon Kim's Causal Exclusion Argument to a Victorian Gothic text, and the fit is uncomfortably precise. If we accept the closure of the physical domain (the draught, the physiology) and the distinctness of the mental domain (Jekyll's will, conscience, intention), then Jekyll's moral agency is indeed threatened with epiphenomenalism. If the potion is sufficient to produce Hyde, and Hyde's brain state is sufficient to produce the murder, Jekyll's "choice" to drink the potion initially seems like the only place for the will to hide. But as the novella progresses, even that choice is eroded by compulsion.

  Here is the text read through the exclusion lens, locating where Stevenson is stuck, where he knows it, and what the fiction salvages from the wreckage of the argument.

  ### 1. The Horn of the Dilemma: Exclusion, not Overdetermination

  Stevenson wants **Overdetermination**. He wants us to believe that the physical cause (the potion) and the mental cause (Jekyll's repressed desire) *both* fully account for Hyde's actions. This would allow Jekyll to be scientifically determined yet morally guilty.

  However, the text collapses into **Exclusion**. The physical cause crowds out the mental.

  If the potion is a sufficient cause for the transformation, and the transformed brain is a sufficient cause for the violence, Jekyll's will is left with no causal work to do *during* the Hyde-states. The "Full Statement of the Case" is not a confession of causal agency; it is a confession of *originating* agency that admits to a loss of *executive* agency. Jekyll is not claiming, "I willed Carew's death." He is claiming, "I built the machine that killed Carew." But in philosophy of mind, building the machine does not make you the cause of the specific output if the machine operates deterministically and you are disconnected from the controls.

  Stevenson is stuck on the **Exclusion Horn**. He knows it. The horror of the book is not that Jekyll is evil, but that Jekyll is *obsolete*. The chemistry works better than the will.

  ### 2. Scenes that Decide It

  **The Carew Murder (The Exclusion Proof)**
  This is the strongest evidence for the exclusion argument. When Carew is beaten to death, Jekyll is asleep in his own bed. His conscious will is offline.
  *   **The Physical:** Hyde's physiology (smaller, younger, more vigorous) and the immediate stimulus (Carew's polite greeting triggering Hyde's misanthropy) are sufficient causes.
  *   **The Mental:** Jekyll's latent hatred is the background condition, but it is not the *trigger*.
  *   **The Verdict:** If the will is not present at the time of the action, and the action occurs anyway due to physical sufficiency, the will is excluded. Jekyll wakes up with blood on his hands, a physical effect without a concurrent mental cause. This is the moment Jekyll becomes a passenger in his own body.

  **The Bench in the Park (The Supervenience)**
  When Jekyll drinks the potion in the park, he describes the sensation: "I felt younger, lighter, happier in body; within I was conscious of a heady recklessness."
  *   **The Reading:** Note the order. The physical change ("in body") precedes or is simultaneous with the mental state ("within"). The moral disposition (recklessness) supervenes on the chemical state. He does not *decide* to be reckless; the chemistry *makes* him reckless. The will is riding the wave of the neurochemistry, not steering it.

  **Lanyon's Narrative (The Materialist Horror)**
  Lanyon watches the transformation. He does not see a soul leaving or entering; he sees flesh melting and reforming.
  *   **The Reading:** Lanyon dies of shock because he witnesses the total reduction of the "self" to the "substance." If the self were distinct from the body (Cartesian dualism), the change would be less horrifying. Lanyon's death signifies the death of the idea that there is a "ghost in the machine." There is only the machine. This supports the Exclusion Argument: there is no second substance (will) to do the work.

  **Henry Jekyll's Full Statement (The Desperate Reclaiming)**
  This is where the book fights the reading. Jekyll writes: *"I was the first that could thus plod in the public eye with a load of genial respectability, and in a moment, like a schoolboy, strip off these lendings and spring headlong into the sea of liberty."*
  *   **The Reading:** This is the "self-flattery" you mentioned. Jekyll tries to claim the *liberty* as an act of will. But pages later, he admits: *"The powers of Hyde seemed to have grown with the sickliness of Jekyll."* He admits the balance of power has shifted to the physical side. The confession is a legalistic maneuver to claim ownership of a process that has already excluded him. He claims authorship because he cannot bear the ontology of a puppet.

  ### 3. Where the Reading Resists the Text

  Here is where the critic must be honest: The Causal Exclusion Argument assumes a clean split between "Physical Cause" and "Mental Cause." *Jekyll and Hyde* resists this because **Hyde has intentions.**

  If Hyde were merely a chemical reaction, he would be a force of nature, like a storm. But Hyde locks doors, writes letters, fears the gallows, and chooses suicide. He exhibits *teleology*.
  *   **The Problem:** If the chemistry is sufficient, why does Hyde plan? Why does he hide?
  *   **The Resistance:** Stevenson implies that the "chemistry" *contains* the will. The potion doesn't just change the body; it isolates a specific *psychological* subset of Jekyll. This means the "physical cause" is not just neurons firing, but neurons firing *in a pattern that constitutes a specific intent*.
  *   **The Critic's Concession:** To make the Exclusion Argument stick, you have to treat Hyde's intentions as epiphenomenal illusions. But the text treats them as real. Stevenson is a vitalist, not a hard materialist. He believes the "spirit" is a substance that can be distilled. This is a category error that saves the fiction but breaks the philosophy. The book posits a "spiritual chemistry" where the soul has mass. If the soul has mass, it can be a physical cause, and the Exclusion Argument dissolves because there is no distinct mental domain to exclude.

  ### 4. What the Fiction Sees That the Argument Doesn't

  The Causal Exclusion Argument asks: *What pushed the arm?*
  The Fiction asks: *Who owns the arm?*

  This is the insight your novel should hunt. The law (and our moral intuition) does not hang Hyde because he was the efficient cause of the death. It hangs him (or seeks to) because he is the **locus of narrative continuity.**

  **1. Ownership vs. Causation**
  We assign blame to the person rather than the chemistry because identity is a narrative construct, not a causal chain. Jekyll is responsible not because he willed the specific blow to Carew, but because he maintained the *continuity of the vessel* that allowed the blow to happen. He fed the wolf. The Exclusion Argument cares about the snap of the jaws; the Fiction cares about the keeping of the pet.

  **2. The Confession as Constitution**
  You asked if the confession is self-flattery. In a legal sense, yes. In an existential sense, no. By confessing, Jekyll *re-integrates* the excluded cause. The act of writing the statement is the one act where Jekyll's will and Hyde's physical reality must align to produce a document. In writing the confession, Jekyll forces the mental and physical to coincide again. He reclaims agency not by denying the chemistry, but by *narrating* it.

  **3. The Tragedy of Loss of Control**
  The Exclusion Argument is cold; it simply states that the mental is redundant. The Fiction feels the *loss* of that redundancy. The horror of the novella is the gradual realization that the will *used* to do work, and now it doesn't. Jekyll's tragedy is the experience of becoming epiphenomenal in real-time. He feels himself sliding from being a Cause to being a Effect.

  **Conclusion for your Novel**
  Stevenson is stuck on the Exclusion Horn, but he papers it over with the language of Dualism. He knows the will is losing its grip to the chemistry (the salt impurity, the involuntary transformations).

  But the book's ultimate commitment is not to metaphysics, but to **liability**. We keep assigning the deed to the person because "personhood" is the only container large enough to hold the consequences. Chemistry has no future; it only has reactions. A person has a future; they have consequences. We blame Jekyll not because he could have stopped the physics in that moment, but because he is the only entity in the chain capable of suffering the future. The Exclusion Argument explains the murder; the Fiction explains the guilt. Your protagonist blames his brain chemistry because it is the only way to explain the *murder*, but he will only find redemption (or damnation) when he accepts that he is the *guilty party*, regardless of the chemistry. The chemistry is the gun; the man is the hand that holds it, even if the hand is shaking.
