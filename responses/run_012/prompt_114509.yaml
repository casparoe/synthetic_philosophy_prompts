          *   Bench: The feeling of liberation follows the physical change.
          *   Lanyon: The horror of materialism.
          *   Full Statement: The desperate grab for agency.
      *   *Section 3: The Dilemma.* Stevenson tries for Overdetermination but slides into Exclusion. The book *knows* this (Jekyll's loss of control).
      *   *Section 4: Resistance.* The "Two Natures" problem. Hyde has intentions. Intentions aren't just chemistry in the Victorian view, but the text blurs them.
      *   *Conclusion:* The Fiction's Insight. Narrative identity vs. Causal identity. The "Confession" is not a causal claim but a moral one.

  8.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing on philosophy of mind, but rather using it as a tool to crack the text.
      *   Keep it dense and respectful of the user's expertise.
      *   Make sure to answer the specific question: "Which horn is Stevenson stuck on?" (Answer: He tries to straddle them, but the text collapses into Exclusion, which the Final Statement tries desperately to deny).

  9.  **Self-Correction during drafting:**
