prompt: |-
  I chair the disciplinary panel of a state professional licensing board. We hear twenty-five to forty cases a month involving nurses, pharmacists, contractors, financial advisers, and similar licensees. Our statute tells us to protect the public and to impose sanctions proportionate to the seriousness of the conduct and the harm caused, but it does not tell us how to treat the fact that two licensees can engage in equally poor conduct and only one of them happens to cause a catastrophe. Complainants, the public, and sometimes our own members treat the outcome as the measure of the wrongdoing. I want a decision procedure the panel can actually run, grounded in the moral luck literature, that preserves the real distinctions while being usable by seven board members who are not philosophers and who have about thirty minutes per case plus a written-reasons requirement. Our sanction schedule has five bands, from reprimand to revocation. Legal counsel signs off on the final order.

  We have adopted an internal principle, which I will call the conduct-first rule: before the panel considers the actual outcome, it must assess the quality of the licensee’s conduct and decision-making using only what the licensee knew or should have known at the time. The actual outcome may then adjust the sanction, but only through a procedure that says when and how much. Your task is to turn that principle into an operational procedure.

  Please give me the following.

  1. A set of questions to ask in order, with what counts as a sufficient answer to each, and where the procedure stops and produces a sanction band or a recommendation.

  2. A way to separate at least four kinds of luck that can affect a licensing case: outcome luck, where the same conduct causes different harm; circumstantial luck, where the licensee happened to face a situation others did not; constitutive luck, where the licensee’s temperament, training, or background is at issue; and epistemic luck, concerning what was knowable at the time. Say which of these the panel can legitimately adjust for, which it should record but not adjust for, and why.

  3. A treatment of tracing: when a later bad outcome can be traced back to an earlier culpable decision, and when the chain is too loose for the board to treat the outcome as part of the licensee’s fault.

  4. A rule for hindsight bias: how the panel should keep the fact that harm occurred from inflating its judgment of how risky the conduct was ex ante. Include a concrete debiasing step, not just a warning.

  5. A small number of tests the panel can run in order, with a scoring or ranking rule if you can make one that is honest, and a clear statement of the points where the procedure cannot decide and the panel must vote on values. Mark those points explicitly.

  6. Worked applications to three cases: two pharmacists make the same dispensing error, one is caught by a nurse and one kills a patient; two commercial drivers drive the same number of hours fatigued, one hits a child and one arrives without incident; and a surgeon who follows the standard of care but has a rare-anatomy catastrophe, compared with a surgeon who cuts a corner and whose patient recovers. For each, show the procedure’s recommended adjustment to the sanction and the written rationale.

  7. At least one case where the procedure gives an answer the public or the complainant will not like, and say how the panel should explain that answer without sounding indifferent to harm.

  8. A short section on what the procedure cannot do. In particular, say where the board is really deciding a policy question about how much outcome should matter, not applying a philosophical result, and say what would need to change in the statute or the evidence for the procedure to give a different answer.

  Do not give me a reading list, citations, or a survey of the moral luck debate. I need the procedure, the hard cases it must handle, and the places where judgment cannot be eliminated. You may invent intermediate concepts if they help, but label them as your inventions and keep them simple enough for a board member to apply under time pressure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a state professional licensing board disciplinary panel.
      *   **Context:** 25-40 cases/month, diverse licensees (nurses, pharmacists, contractors, etc.), 7 board members (non-philosophers), ~30 mins/case + written reasons.
      *   **Statutory Mandate:** Protect public, proportionate sanctions (conduct + harm).
      *   **Problem:** "Moral Luck" – how to handle cases where conduct is identical but outcomes differ (e.g., near miss vs. death). Public/Complainants focus on outcome.
      *   **Existing Principle:** "Conduct-First Rule" (assess conduct based on ex ante knowledge first; outcome adjusts later).
      *   **Deliverables:**
          1.  Ordered questions with stop conditions/sanction bands.
          2.  Taxonomy of luck (outcome, circumstantial, constitutive, epistemic) + adjustment rules.
          3.  Tracing rule (causation/culpability chain).
          4.  Hindsight bias rule + concrete debiasing step.
          5.  Tests/Scoring + explicit value judgment points.
          6.  Worked applications (3 specific scenarios).
          7.  Unpopular outcome case + communication strategy.
          8.  Limitations section (policy vs. philosophy).
      *   **Constraints:** No reading lists/citations. Practical, usable under time pressure. Invent simple intermediate concepts if needed.

  2.  **Deconstruct the Core Tension:**
      *   *Retributive/Deontological view:* Punish the choice/risk, not the luck.
      *   *Utilitarian/Regulatory view:* Protect the public. High harm indicates high risk or need for removal.
      *   *The Compromise:* The "Conduct-First Rule" is the anchor. Sanction is primarily based on the *risk created*, adjusted slightly for *harm realized*, but capped to prevent gross disproportionality.

  3.  **Drafting Section 1: The Decision Procedure (Questions & Flow):**
      *   Need a funnel approach. Start with conduct, then harm, then mitigation/aggravation.
      *   *Step 1: Conduct Baseline.* What did they do? Was it negligent, reckless, intentional?
      *   *Step 2: Risk Assessment.* How bad *could* it have been? (Crucial for moral luck).
      *   *Step 3: Harm Assessment.* What actually happened?
      *   *Step 4: Adjustment.* Apply the "Luck Multiplier" (need a simpler name). Let's call it the "Outcome Adjustment."
      *   *Stop Conditions:* If conduct is intentional -> Revocation/Suspension regardless of harm. If conduct is minor + no harm -> Dismissal/Reprimand.
      *   *Sanction Bands:* 1 (Reprimand) to 5 (Revocation).

  4.  **Drafting Section 2: Taxonomy of Luck:**
      *   *Outcome Luck:* Same act, different result. *Adjustment:* Limited. Acknowledge harm but don't let it dominate.
      *   *Circumstantial Luck:* Being in the wrong place. *Adjustment:* Record but do not punish. (e.g., the only pharmacist on duty during a rush).
      *   *Constitutive Luck:* Personality/training. *Adjustment:* Do not punish innate traits, but punish failure to manage them. (e.g., "I'm just disorganized" is not an excuse, but lack of training might be mitigation).
      *   *Epistemic Luck:* What they knew. *Adjustment:* Central to Conduct-First. If they couldn't know, it's not culpable conduct.
      *   *Decision:* Only Outcome Luck gets a sanctioned adjustment. Others are context or excluded.

  5.  **Drafting Section 3: Tracing:**
      *   Need to limit liability. "But-for" causation isn't enough.
      *   *Concept:* "The Intervening Break." If a reasonable professional would have stopped the chain, the original licensee is less responsible.
      *   *Rule:* Direct link required. If multiple systemic failures occurred after the licensee's act, reduce culpability.

  6.  **Drafting Section 4: Hindsight Bias:**
      *   Problem: Knowing the harm makes the risk look obvious.
      *   *Solution:* The "Blind Scenario" test.
      *   *Step:* Before discussing the harm, members write down what they think the risk was *without* knowing the outcome. Or, ask: "If no one got hurt, would we think this was dangerous?"

  7.  **Drafting Section 5: Tests & Scoring:**
      *   Need a simple scoring matrix.
      *   *Culpability Score (1-5)* + *Harm Score (1-5)*.
      *   *Formula:* Base Sanction = Culpability. Adjustment = Harm (capped).
      *   *Value Judgment Points:* Where the math doesn't work (e.g., low culpability + extreme harm). Mark these clearly.

  8.  **Drafting Section 6: Worked Applications:**
      *   *Case 1 (Pharmacists):* Same error. One caught, one death. Conduct score same. Harm score differs. Sanction differs slightly but stays in same *category* (e.g., Suspension vs. Revocation, or Probation vs. Suspension). Actually, to honor the "Conduct-First" rule, the gap shouldn't be huge. Maybe Probation vs. Suspension.
      *   *Case 2 (Drivers):* Fatigue. One hits child, one doesn't. High culpability (reckless). Harm drives the difference.
      *   *Case 3 (Surgeons):* Standard of care (no culpability) + Death vs. Corner cutting (culpability) + Recovery. First one gets no sanction (tragic outcome). Second one gets sanction (risk created). This is the hardest public sell.

  9.  **Drafting Section 7: Unpopular Outcome:**
      *   The Surgeon Case (Standard of Care + Death = No Sanction).
      *   *Communication:* Focus on "System Safety" and "Future Risk." Punishing bad outcomes that aren't caused by bad choices discourages reporting and doesn't fix the system.

  10. **Drafting Section 8: Limitations:**
      *   This procedure doesn't solve the philosophical problem; it manages it.
      *   Statute might demand outcome focus.
      *   Public pressure might force deviation.
      *   Evidence limitations (what *actually* happened vs. what we can prove).

  11. **Review and Refine:**
      *   *Tone:* Administrative, clear, authoritative, practical.
      *   *Time Check:* Can this be done in 30 mins? Yes, if the scoring is quick.
      *   *Clarity:* Ensure the "Conduct-First" rule is the spine of the whole document.
      *   *Constraint Check:* No citations. Invent concepts labeled as such.
      *   *Refinement on Scoring:* Make sure the "Outcome Adjustment" doesn't overwhelm the "Conduct Baseline." I'll introduce a "Cap" on how much harm can raise the sanction band.

  12. **Final Polish:** Check against all 8 requirements.
      *   1. Questions/Flow? Yes.
      *   2. Luck Types? Yes.
      *   3. Tracing? Yes.
      *   4. Hindsight? Yes (The "Pre-Outcome Snapshot").
      *   5. Tests/Scoring/Value Points? Yes.
      *   6. Worked Cases? Yes.
      *   7. Unpopular Case? Yes.
      *   8. Limitations? Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between "Protecting the Public" and "Punishing the Licensee" is clear. Licensing is forward-looking (risk management), not purely backward-looking (retribution). This justifies why high harm might still lead to lower sanctions if risk of recurrence is low, *but* statutory mandate says "proportionate to harm." I must balance the two. The procedure will treat Harm as an aggravator, not the sole determinant.

      *(Refining the "Luck" section)*: Be careful with Constitutive Luck. Licensing boards *do* care about competence (which is partly constitutive). I need to distinguish between "innate temperament" (don't punish) and "failure to maintain competence" (do punish).

      *(Refining the Scoring)*: Keep it very simple. 1-5 scale. Culpability determines the *starting* band. Harm determines the *movement* within or between bands, but with a "One-Band Cap" rule to prevent outcome from totally dominating.

      *(Refining Hindsight)*: The "Redaction Method" is good. Read the facts up to the moment of error, stop, assess risk. Then reveal outcome.

      Let's assemble the document.

      *Structure:*
      I. The Conduct-First Decision Protocol (CFDP)
      II. Taxonomy of Luck & Adjustment Rules
      III. Causation & Tracing
      IV. Hindsight Bias Control
      V. Scoring Matrix & Value Judgment Points
      VI. Worked Applications
      VII. Communicating Unpopular Outcomes
      VIII. Limitations & Policy Boundaries

      *Voice:* Professional, directive, manual-style.

      *Let's write.*
answer: |-
  # The Conduct-First Decision Protocol (CFDP)
  **For Use by State Professional Licensing Disciplinary Panels**

  ## 1. The Decision Procedure: Ordered Questions & Stop Conditions

  This procedure must be followed in sequence. Do not discuss the actual harm until Step 3 is complete.

  **Step 1: The Ex Ante Risk Assessment (Conduct Baseline)**
  *   **Question:** Ignoring the actual outcome, what was the probability and severity of harm that a reasonable licensee should have foreseen at the moment of the decision/act?
  *   **Sufficient Answer:** A classification of the risk created: *Minimal, Moderate, High, or Imminent/Catastrophic.*
  *   **Stop Condition:** If the risk was *Minimal* and no harm occurred, recommend **Dismissal**. If the risk was *Imminent/Catastrophic* (e.g., practicing surgery while intoxicated), proceed to **Sanction Band 4 or 5** regardless of actual harm.

  **Step 2: The Culpability Assessment**
  *   **Question:** What was the mental state regarding the risk identified in Step 1?
  *   **Sufficient Answer:** Select one:
      *   *Innocent Error:* Reasonable care taken, unforeseeable.
      *   *Negligence:* Should have known, failed to meet standard.
      *   *Recklessness:* Knew the risk, disregarded it.
      *   *Intentional:* Purposefully violated the rule.
  *   **Stop Condition:** If *Innocent Error*, recommend **No Sanction** (may issue educational letter). If *Intentional*, recommend **Sanction Band 5 (Revocation)** regardless of harm.

  **Step 3: The Outcome Assessment (The Luck Adjustment)**
  *   **Question:** What actual harm occurred?
  *   **Sufficient Answer:** Select one: *None/Near Miss, Minor (no lasting impact), Moderate (temporary injury/loss), Severe (permanent injury/death/major financial loss).*
  *   **Procedure:** This step allows movement from the Baseline Sanction determined in Steps 1 & 2.
      *   *Rule:* Actual harm may increase the sanction band by **one level maximum**. It cannot decrease a sanction band below the Baseline (protective mandate).
      *   *Stop Condition:* If Baseline is Band 5, Outcome cannot increase it. If Baseline is Band 1, Outcome cannot decrease it.

  **Step 4: Mitigation & Aggravation**
  *   **Question:** Are there factors unrelated to the luck of the outcome that suggest higher or lower risk of recurrence?
  *   **Sufficient Answer:** Evidence of remediation, cooperation, prior history, or systemic barriers.
  *   **Result:** Final Sanction Recommendation within the determined Band.

  ---

  ## 2. Taxonomy of Luck: Adjustment Rules

  The panel must categorize "luck" factors to decide if they justify sanction adjustments.

  | Type of Luck | Definition | Panel Action | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Outcome Luck** | Same conduct, different result (e.g., patient lives vs. dies). | **Adjust Limitedly.** Allow a one-band increase for Severe Harm, but do not let it dominate. | The statute requires proportionality to harm, but fairness requires primary focus on the choice made. |
  | **Circumstantial Luck** | Being in a specific situation (e.g., only pharmacist on duty during a rush; a pedestrian happened to step out). | **Record but Do Not Adjust.** Note it in findings, but do not increase sanction. | Licensees accept the risks of their environment. Punishing bad circumstances discourages working in high-need areas. |
  | **Constitutive Luck** | Innate traits, temperament, or background (e.g., naturally disorganized, grew up without mentorship). | **Do Not Adjust.** Treat as neutral. | Licensing regulates *competence*, not personality. However, failure to *manage* these traits is Negligence (Step 2). |
  | **Epistemic Luck** | What was knowable at the time (e.g., a drug interaction not yet discovered). | **Exclude from Culpability.** If it wasn't knowable, it is Innocent Error (Step 2). | You cannot culpably choose against information you could not possess. |

  **Operational Rule:** Only **Outcome Luck** triggers a sanction adjustment. The other three types are context for the Written Reasons but must not mathematically increase the penalty.

  ---

  ## 3. Tracing: The Causation Chain

  When a bad outcome occurs, we must determine if it is fairly traceable to the licensee's conduct or if the chain is broken.

  **The "Intervening Break" Test**
  Ask: *Would a reasonable professional, acting later in the chain, have detected and stopped the error?*

  *   **Strong Link:** The harm flowed directly from the act with no reasonable opportunity for interception (e.g., toxic injection given directly by licensee). -> **Full Outcome Weight.**
  *   **Weak Link:** Systemic checks existed and failed, or other professionals had clear duty/ability to catch the error but did not. -> **Reduce Outcome Weight.**
  *   **Broken Link:** An independent, unforeseeable event caused the harm after the initial error (e.g., patient takes correct med but has rare allergic reaction unrelated to history). -> **No Outcome Weight.**

  **Procedure:** If the chain is "Weak," the Outcome Adjustment (Step 3) is downgraded by one level (e.g., Severe Harm counts as Moderate Harm for sentencing). If "Broken," treat as *No Harm*.

  ---

  ## 4. Hindsight Bias Control

  **The Problem:** Knowing a patient died makes a risky decision look obviously wrong, even if it was a standard gamble at the time.

  **The Debiasing Step: "The Pre-Outcome Snapshot"**
  Before the panel discusses the actual harm or Step 3:
  1.  Legal Counsel distributes a **Redacted Fact Pattern** that stops exactly at the moment the licensee's action was completed. (e.g., "The pharmacist dispensed Drug X instead of Drug Y. The file closes here.")
  2.  Each panel member writes down privately: *"On a scale of 1-10, how dangerous was this act at the moment it happened?"*
  3.  The Chair collects these scores.
  4.  **Only then** is the actual outcome revealed.
  5.  **Rule:** If the average "Danger Score" rises by more than 3 points after revealing the outcome, the Chair must pause deliberation to explicitly discuss whether the panel is punishing the *risk* or the *result*.

  ---

  ## 5. Scoring Matrix & Value Judgment Points

  Use this matrix to generate the recommendation.

  **A. Culpability Score (Steps 1 & 2)**
  *   Innocent Error = 0
  *   Negligence (Single instance) = 1
  *   Negligence (Pattern) = 2
  *   Recklessness = 3
  *   Intentional = 4

  **B. Harm Score (Step 3)**
  *   None/Near Miss = 0
  *   Minor = 1
  *   Moderate = 2
  *   Severe = 3

  **C. Calculation**
  *   **Base Band** = Culpability Score + 1 (e.g., Score 0 = Band 1, Score 4 = Band 5).
  *   **Adjustment:** If Harm Score is 3 (Severe), add +1 to Base Band.
  *   **Cap:** Maximum Sanction Band is 5. Minimum is 1.

  **D. Explicit Value Judgment Points**
  *This procedure cannot decide these. The Panel must vote.*
  1.  **The "Ticking Bomb" Scenario:** Culpability is Low (1), but Harm is Severe (3). The math suggests a moderate sanction, but the public risk feels high. *Vote:* Does this licensee pose a continuing threat despite low culpability?
  2.  **The "Systemic Victim" Scenario:** Culpability is High (3), but the licensee was working under impossible statutory/resource constraints. *Vote:* Do we sanction the individual or flag the agency? (Procedure defaults to sanctioning individual; voting to waive requires 2/3 majority).
  3.  **The "Remorse" Factor:** Does genuine remorse lower the Culpability Score? *Rule:* No. Remorse affects Mitigation (Step 4), not Culpability. Panel must vote on how much weight remorse carries in Step 4.

  ---

  ## 6. Worked Applications

  ### Case A: The Pharmacists (Outcome Luck)
  *   **Facts:** Pharmacist A and Pharmacist B both dispense 10mg instead of 5mg due to identical distraction. Patient A (Nurse caught it) suffers no harm. Patient B dies.
  *   **Step 1 (Risk):** High (Dosage error can be fatal).
  *   **Step 2 (Culpability):** Negligence (Pattern? No. Single instance). Score = 1. **Base Band = 2 (Probation/Restriction).**
  *   **Step 3 (Harm):**
      *   Pharmacist A: None. Score 0. **Final Band = 2.**
      *   Pharmacist B: Severe. Score 3. **Adjustment +1.** **Final Band = 3 (Suspension).**
  *   **Rationale:** Both created the same risk. Pharmacist B is sanctioned more severely because the statute requires proportionality to harm, but the gap is limited (Probation vs. Suspension, not Probation vs. Revocation) to acknowledge the luck factor.

  ### Case B: The Commercial Drivers (Circumstantial & Outcome Luck)
  *   **Facts:** Driver A and Driver B both drive 4 hours over the limit (Recklessness). Driver A hits a child (Severe Harm). Driver B arrives safely (No Harm).
  *   **Step 1 (Risk):** Imminent/Catastrophic.
  *   **Step 2 (Culpability):** Recklessness. Score = 3. **Base Band = 4 (Long Suspension/Revocation).**
  *   **Step 3 (Harm):**
      *   Driver A: Severe. Score 3. **Adjustment +1.** **Final Band = 5 (Revocation).**
      *   Driver B: None. Score 0. **Final Band = 4.**
  *   **Rationale:** Recklessness regarding public safety mandates removal or near-removal. The death triggers the maximum statutory penalty, but the safe driver still faces near-removal because the *risk* was intolerable.

  ### Case C: The Surgeons (Epistemic & Conduct Luck)
  *   **Facts:** Surgeon A follows standard of care exactly; patient dies due to rare anatomy (Innocent Error/No Culpability). Surgeon B skips a safety checklist to save time; patient recovers fully (Recklessness/No Harm).
  *   **Surgeon A:**
      *   Culpability: Innocent (0). **Base Band = 1.**
      *   Harm: Severe (3). **Adjustment +1.** **Final Band = 2.**
      *   *Correction per CFDP:* If Step 2 is Innocent Error, Stop Condition applies. **Recommendation: No Sanction.** (Harm cannot create culpability where none exists).
  *   **Surgeon B:**
      *   Culpability: Recklessness (3). **Base Band = 4.**
      *   Harm: None (0). **Adjustment 0.** **Final Band = 4 (Suspension).**
  *   **Rationale:** Surgeon A is not punished for biology. Surgeon B is punished for the risk created, even though the patient survived. The public is protected by removing B's license before they kill someone.

  ---

  ## 7. The Unpopular Outcome: Communicating Surgeon A

  **The Scenario:** The panel issues **No Sanction** for Surgeon A (Standard of Care + Death). The family is outraged.

  **The Explanation Strategy:**
  Do not say "It was luck." Say "It was not preventable by regulation."

  **Draft Language for Written Order:**
  > "The Board's mandate is to prevent future harm by correcting professional misconduct. In this case, the evidence shows Dr. A performed every required step correctly. The tragedy was caused by biological variance, not professional failure. Sanctioning Dr. A would not make future surgeries safer, because Dr. A already followed the safety rules. To punish a correct decision because the outcome was bad would force doctors to practice defensive medicine, which harms the public by increasing costs and reducing access. We share the family's grief, but licensing sanctions are tools for safety, not compensation for tragedy."

  ---

  ## 8. Limitations & Policy Boundaries

  **What This Procedure Cannot Do:**
  1.  **It Cannot Override Statute:** If the statute says "Revocation *shall* be imposed for any conduct resulting in death," this protocol is illegal. It assumes the statute allows discretion ("may impose").
  2.  **It Cannot Eliminate Moral Discomfort:** Board members will still feel uneasy punishing Surgeon B (no harm) more than Surgeon A (death). This procedure validates that feeling but channels it into *Written Reasons*, not *Sanction Bands*.
  3.  **It Is Not a Civil Court:** This procedure does not determine compensation. It determines *license status*. Families seeking restitution must be directed to civil courts; conflating the two muddies the "Protect the Public" mandate.

  **The Policy Decision Point:**
  The "One-Band Cap" on Outcome Luck (Section 1, Step 3) is a policy choice, not a philosophical truth.
  *   *If the Legislature wants harsher outcome liability:* They must amend the statute to mandate minimums based on harm.
  *   *If the Public wants harsher outcome liability:* The Board must absorb the political heat. The Chair should testify that "Punishing luck does not reduce risk; punishing choices reduces risk."

  **Evidence Limitation:**
  This procedure relies on accurate reconstruction of the *ex ante* moment. If evidence of what the licensee knew is missing, the benefit of the doubt goes to the licensee (Epistemic Luck rule). If the Board wishes to reverse this presumption, it must adopt a new evidentiary standard.
