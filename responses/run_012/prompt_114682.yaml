answer: |-
  1. Machiavelli attributes Borgia's rise to 'extraordinary fortune' but his foundations to 'virtù', suggesting a partnership where luck provided the opportunity but skill secured the state until the final illness struck. Ultimately, he judges Borgia's collapse as largely misfortune, implying a high *virtù* score undone by a catastrophic swing of *fortuna*.

  2. Duncan is partially correct that *virtù* is empirical, involving prudence and adaptability, yet your worry holds because Machiavelli often defines success retroactively, blurring the line between cause and effect. If *virtù* is merely whatever leads to maintaining the state, it risks becoming a tautology, though Machiavelli does specify concrete actions like building armies and managing nobles.

  3. The tension you note regarding innate nature does limit *virtù*, yet Machiavelli insists the prudent man should anticipate changing times rather than merely react to them, preserving agency within the constraints of character. Thus, *virtù* does not dissolve entirely into *fortuna* because the ability to foresee and prepare for contingency remains a skill distinct from the contingency itself.

  4. In the *Discourses*, *virtù* shifts from individual prowess to collective civic strength, which resolves the contradiction by showing that institutions can outlast the fatal mismatches of individual temperament. This suggests that while a single prince may fall due to rigid nature, a republic can sustain *virtù* through diverse citizens suited to different times.

  5. To answer your final fear, *virtù* escapes pure survivorship bias only if we judge the quality of decisions independently of their outcome, which Machiavelli occasionally does when praising failed men who acted prudently. Therefore, Duncan's audit is possible only if you measure the prudence of the preparation rather than simply looking at who remained standing at the end.
