answer: |-
  ### Brainstorm: Engineering the Discovery

  To make the paradox unavoidable for a mixed group of twenty-one, the mathematical structure must be airtight, but the pedagogical framing must remain neutral. We are building a Condorcet Cycle.

  **The Preferences:** Your 7-7-7 split is the correct choice. It is the minimal integer distribution for twenty-one people that guarantees a cycle under pairwise majority rule.
  *   Group A (7): Paper > Documentary > Walk
  *   Group B (7): Documentary > Walk > Paper
  *   Group C (7): Walk > Paper > Documentary
  *   *Math:* Paper beats Documentary (14-7). Documentary beats Walk (14-7). Walk beats Paper (14-7).
  *   *Why this works:* It ensures every pairwise vote is a landslide (2:1), preventing students from attributing the cycle to a "tie" or "lack of consensus." The majority is clear in every instance, yet the group is irrational.

  **The Procedure:** Pairwise majority voting is the only mechanism that yields this specific paradox cleanly. Borda count or Plurality would hide it. We must enforce pairwise voting strictly.

  **The "Quiet Swap" Problem:** I strongly advise against swapping cards *quietly*. In social choice, "common knowledge" of preferences is often an assumption. If students discover you deceived them about the profile, they will attribute the instability to your trickery rather than the aggregation mechanism. I will modify Phase 3 to a public "Scenario Update." This preserves trust while achieving the same mathematical shift (moving from a cyclic profile to one with a Condorcet winner).

  **The "Point System" Disruption:** An economics student *will* suggest Borda Count or Approval Voting in Phase 1. This is the biggest risk to the lesson. You must have a prepared "parking lot" response that validates their insight without allowing them to solve the puzzle prematurely.

  **Time Management:** Ninety minutes is tight for four phases. I have allocated 15 minutes per phase. If you run short, cut Phase 3 (Stability). Phase 1 (Cycle) and Phase 2 (Agenda) are the core. Phase 4 (Strategy) is vital for grad students. Phase 3 is the most expendable.

  ***

  ### Session Design: The Impossible Choice

  **Goal:** Students experience social intransitivity, agenda manipulation, and strategic incentives before learning the theory.
  **Materials:**
  *   21 Index Cards (Phase 1 Profile).
  *   21 Index Cards (Phase 3 Profile).
  *   Whiteboard/Blackboard for tallying votes.
  *   A visible timer.
  *   A physical object to designate the "Chair" (e.g., a gavel or distinct hat).

  **The Cards (Phase 1):**
  Prepare 21 cards. Do not label them A, B, or C.
  *   **7 Cards:** 1. Paper, 2. Documentary, 3. Walk
  *   **7 Cards:** 1. Documentary, 2. Walk, 3. Paper
  *   **7 Cards:** 1. Walk, 2. Paper, 3. Documentary
  *   *Instruction on card:* "This is your true preference. Do not show it to anyone. You want the highest ranked option to win."

  **The Cards (Phase 3):**
  *   **14 Cards:** 1. Paper, 2. Documentary, 3. Walk
  *   **7 Cards:** 1. Documentary, 2. Walk, 3. Paper
  *   *(This creates a Condorcet Winner: Paper).*

  #### Minute-by-Minute Timeline

  **00:00 – 00:10: Distribution & Stakes**
  *   Hand out Phase 1 cards randomly. Ensure students know their preferences are private but the *options* are public.
  *   **Crucial Statement:** "At the end of this term, we will do the option that wins this simulation. Your preference on the card is what you actually want. There is no money, but there is a real outcome."
  *   **Rule:** "We are using pairwise majority rule. Two options enter, one leaves. Hands up for votes."
  *   **Silence Rule:** "No discussion yet. Just vote."

  **00:10 – 00:25: Phase 1 (The Cycle)**
  *   Conduct three votes. Write results large on the board.
      1.  **Paper vs. Documentary:** (Paper wins 14-7).
      2.  **Documentary vs. Walk:** (Documentary wins 14-7).
      3.  **Walk vs. Paper:** (Walk wins 14-7).
  *   **Stop:** Do not comment. Ask: "Based on these results, what is the group's choice?"
  *   Expect confusion. Someone will say "It's a tie." Correct them: "There were no ties. Every vote was 2-to-1."
  *   Let them sit with the contradiction for 2 minutes.

  **00:25 – 00:40: Phase 2 (Agenda Power)**
  *   Select a student to be the "Chair." Give them the gavel/hat.
  *   **Rule:** "The Chair sets the order of the votes. The winner of Vote 1 faces the remaining option in Vote 2. The winner of that is the Group Choice."
  *   **Task:** "Chair, pick an order to make your favorite win." (Give them 2 minutes to calculate).
  *   Run the vote. The Chair's favorite *will* win if they calculated correctly.
  *   **Rotate:** Pick a new Chair with a different favorite. Let them set the agenda. Their favorite wins.
  *   **Stop:** Ask the group: "Did the group's preference change, or just the order?"

  **00:40 – 00:55: Phase 3 (Stability Check)**
  *   **Action:** Collect all cards. Say: "Scenario Update. The weather forecast has changed. Walk is now less desirable for many of you."
  *   **Distribute Phase 3 Cards** (14 Paper-first, 7 Doc-first). Do not hide the change; let them see the new distribution if they ask, but don't announce the counts yet.
  *   **Run Pairwise Votes Again:** Paper vs. Doc, Doc vs. Walk, Walk vs. Paper.
  *   **Result:** Paper beats both. The cycle is gone.
  *   **Ask:** "Why did the instability vanish? Did people become more rational?" (Answer: No, individuals were rational before. The *structure* of the group changed).

  **00:55 – 01:10: Phase 4 (Strategic Voting)**
  *   Revert to Phase 1 Cards (collect Phase 3, hand back Phase 1).
  *   **Rule:** "We are fixing the agenda now. Vote 1: Paper vs. Documentary. Vote 2: Winner vs. Walk."
  *   **Announce:** "I will tell you the agenda *before* you vote. Vote 1 is Paper vs. Documentary. The winner faces Walk."
  *   **Prompt:** "If you know this agenda, and you know the counts (you can hint that the 7-7-7 split is common knowledge now), does anyone have a reason to raise their hand for an option they do not prefer?"
  *   **Goal:** The "Walk" voters (Group C) realize Paper will beat Documentary, but Walk beats Paper. However, if Documentary faces Walk, Documentary wins. They might try to vote for Documentary in Round 1 to ensure it faces Walk in Round 2.
  *   Let them attempt to vote strategically. It will likely get messy. That is the point.

  **01:10 – 01:30: Debrief & Naming**
  *   **Stop the simulation.** Reveal the name: **The Condorcet Paradox** (or Paradox of Voting).
  *   **Map the Lessons:**
      *   **Phase 1:** Transitive individual preferences $\nrightarrow$ Transitive social preferences. Majority rule can cycle.
      *   **Phase 2:** Agenda Setting is Power. If social preferences cycle, the procedure determines the outcome, not the "will of the people."
      *   **Phase 3:** Domain Restrictions. When preferences align (single-peakedness), cycles often disappear. It wasn't individual irrationality; it was the profile shape.
      *   **Phase 4:** Gibbard-Satterthwaite hint. If the rule isn't a dictatorship, there is always room for strategic manipulation.
  *   **The Limitation (Crucial):** "We have staged the *Condorcet Paradox*: the group cannot make up its mind. There is *another* Paradox of Voting, often called the **Paradox of Not Voting** (Downsian). That asks: If the chance your single ballot is decisive is near zero, why does a rational person pay the cost to vote? This simulation cannot show that. In this room, your vote *was* decisive (14-7 margins). In a national election, it is not. We will cover that distinction in Week 3. Do not confuse the two."

  ***

  ### Troubleshooting: What Will Go Wrong

  **1. The "Point System" Objection (High Probability)**
  *   **The Moment:** In Phase 1, after the cycle is revealed.
  *   **The Disruption:** An economics student says, "This is why we use Borda Count / Approval Voting / Score Voting. If we assigned points 3-2-1, Paper would win clearly."
  *   **Your Response:** "That is an excellent mechanism design proposal. It solves *this* problem by introducing cardinal utility. However, this session is strictly testing *Ordinal Pairwise Majority Rule*. We will evaluate Borda and Approval voting in Week 4. For now, please restrict yourself to the rules given: Yes/No between two options."
  *   **Why:** If you let them switch rules, you validate that the paradox is a "rule error" rather than a fundamental property of collective choice. You must force them to sit with the discomfort of Majority Rule failing.

  **2. The "Let's Negotiate" Objection**
  *   **The Moment:** Phase 2.
  *   **The Disruption:** "Why don't we just talk and compromise? We can do the Doc for an hour and the Walk for an hour."
  *   **Your Response:** "Social Choice Theory assumes fixed alternatives. Logrolling and compromise are part of politics, but this model isolates the voting mechanism. Please treat the options as mutually exclusive for this exercise."
  *   **Why:** Compromise dissolves the paradox by changing the options. You need them to see the paradox inherent in the *given* options.

  **3. Confusion on Phase 3 (The Swap)**
  *   **The Risk:** Students think the cycle vanished because individuals changed their minds irrationally.
  *   **Your Fix:** In the debrief, emphasize: "In Phase 1, you were rational. In Phase 3, you were rational. The *math of the group* changed. This proves the cycle is a property of the *system*, not the *voters*."

  **4. Running Out of Time**
  *   **The Cut:** If you hit minute 60 and are still in Phase 2, **cut Phase 3.** Move straight to Phase 4 (Strategy) or Debrief.
  *   **Reasoning:** Phase 3 teaches that cycles *can* be avoided (Single-Peakedness). Phase 1 and 2 teach that cycles *exist* and *matter*. Phase 1 and 2 are non-negotiable. Phase 4 is critical for grad students (Mechanism Design). Phase 3 is the luxury.

  ### Where I Am Least Confident

  **Phase 4 (Strategic Voting) may fall flat.**
  With 21 students, coordinating a strategic voting bloc is difficult without communication. If they vote sincerely, the cycle re-emerges via the agenda. If they try to strategize without talking, they may fail to coordinate and vote sincerely anyway.
  *   **Mitigation:** If no one votes strategically, *you* point it out. "Group C, you prefer Walk. But you know Walk loses to Documentary. If you vote sincerely in Round 1, Paper wins Round 1, then Walk beats Paper. Wait... actually, if Paper wins Round 1, Walk beats Paper in Round 2. So Walk voters should vote sincerely? No, wait."
  *   *Correction for Facilitator:* In the 7-7-7 cycle with Agenda (P vs D) -> Winner vs W:
      *   Sincere: P beats D. P faces W. W beats P. **Walk Wins.**
      *   If Group A (Paper fans) strategize? They prefer P > D > W. P wins anyway.
      *   If Group B (Doc fans) strategize? They prefer D > W > P. D loses to P in Round 1. D is out. They get W (their 2nd choice). If they could make D face W... they can't.
      *   If Group C (Walk fans) strategize? They prefer W > P > D. P faces D. P wins. W faces P. W wins. They get their 1st choice sincerely.
      *   *Actually, this specific agenda favors the Walk voters sincerely.*
      *   **Better Agenda for Strategy:** Set the agenda so a group *must* lie to avoid their worst outcome.
      *   *Revised Agenda for Phase 4:* Vote 1: **Walk vs. Paper**. Winner vs. **Documentary**.
      *   Sincere: W beats P. W faces D. D beats W. **Documentary Wins.**
      *   Group C (Walk > Paper > Doc): They get their 3rd choice (Doc).
      *   Can Group C save it? If they vote for **Paper** in Round 1 (insincere).
      *   Insincere Round 1: Paper beats Walk (14-7).
      *   Round 2: Paper vs. Documentary. Paper beats Doc (14-7).
      *   **Paper Wins.** Group C gets their 2nd choice (Paper) instead of 3rd (Doc).
      *   *Instruction:* Use this specific agenda (Walk vs. Paper, then Winner vs. Doc) for Phase 4. It creates a clear incentive for the "Walk" group to vote insincerely for "Paper" to block "Documentary."

  ### Final Commitment

  Do not name the paradox until the final 20 minutes. Do not allow alternative voting rules during the simulation. If you run short on time, cut Phase 3, not Phase 2. The lesson is not that stability is possible; the lesson is that instability is inherent to majority rule. Acknowledge the Downsian Paradox explicitly as a separate topic to prevent conceptual conflation later in the term.
