prompt: |-
  Slightly in the weeds one. A collegue of mine has spent years trying to get a transcendental argument to actually land — not the modest version that only tells you what we're committed to believing, but the ambitious one that gets you all the way to a fact about the world: that there's a past, other minds, a mind-independent order, take your pick. She reckons the whole thing turns on whether the sceptic's scenario is even intelligible, on the grounds that you can't coherently doubt something you're relying on in the act of doubting it. I'm not convinced but I can't articulate why.

  So: give me your credence that at least one transcendental argument of the ambitious kind succeeds — i.e. that there's some X which really is a necessary condition of the possiblity of experience or thought, and that the move from that to X itself goes through without smuggling in verificationism. Break it down into the terms you think it actually depends on: how likely it is that any such necessary-condition premise is true at all; how likely such a necessity could be established a priori rather than being a contingent fact about creatures like us; how likely the step from 'we must believe X' to 'X' can be made, and if it needs a verificationist premise, how likely that premise is to be acceptable; whether the sceptical scenario is intelligible, and if it isn't, whether that counts as the argument winning or as the question being badly posed; and anything I've left out. A rough number and one line of justification for each, then how they combine. Finish by telling me which term you're least confident about and what would shift it most. British English, please.
