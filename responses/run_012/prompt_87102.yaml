      *   *Idea 2:* She refuses to have kids. Bringing someone into the last generations feels cruel.
      *   *Idea 3:* She abandons a long-term project (like a garden or a codebase refactor) because there won't be anyone to inherit it.
      *   *Idea 4:* She breaks up with a partner who is planning a "forever" future (mortgage, 5-year plan) because she can't buy into the narrative anymore.
      *   *Idea 5:* She starts hoarding non-perishables, not for survival, but because supply chains breaking feels statistically probable now.

      *Selection:* Idea 4 (Relationship/Mortgage/Long-term planning) combined with Idea 3 (Project).
      *Why:* It creates interpersonal friction. Her job is forecasting demand (predicting the future for business), so contradicting the future in her personal life creates professional/personal dissonance. Breaking up or hesitating on a mortgage is a tangible, dry, sad action that fits the tone. It allows for the "reference class" debate to happen naturally (e.g., "Are we counting digital people?").

  3.  **Drafting - Scene Setting & Character:**
