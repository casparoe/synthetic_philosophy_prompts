          1.  *Reference Class Problem:* Who counts? Humans? Observer moments? Digital minds?
          2.  *Prior Probability Problem:* Does the argument only work with a specific prior (flat vs. falling off)?
      *   **Constraints:**
          *   No lecture scenes (argument stated briefly/in voice).
          *   No real researcher names/citations.
          *   No definitive verdict ending (end on plausible human action).
          *   Tone: Dry, a little sad.
          *   Length: 1500-2000 words.
          *   Pre-writing task: Brainstorm 4-5 concrete ways belief changes someone's week, pick one with friction, explain why.
          *   Post-writing task: Bullet list of 4-6 philosophical moves sneaked in.

