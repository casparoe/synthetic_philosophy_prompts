          *   Introduce the forum post incident.
          *   Scene with Partner (Tom) about the house.
          *   Scene with Colleague (Sam) about the math (Reference Class & Prior).
          *   Final scene: The decision.
      *   *Post-Story:* List the moves.

      *Self-Correction on Philosophy:* Make sure the "Prior" objection is clear. The argument works best if you assume all total population sizes are equally likely *before* you look at your birth rank. If you assume large populations are inherently less likely (1/N prior), the update doesn't shift things much. Elena needs to voice this skepticism. Sam needs to counter that we *should* be ignorant priors.

      *Self-Correction on Reference Class:* Who is "human"? If AI comes, does the pool explode? If so, being #80 billion is very early. Elena needs to wonder if she's comparable to a future digital mind.

      *Let's write.*

      *(Word Count Check during drafting)*: Need to ensure I don't skim over the emotional weight. The forecasting job is a great metaphor. She predicts spoilage. Humanity is spoiling?

      *(Tone Check)*: Dry. Sad. No aliens. Just probability and mortgages.

      *(Final Polish)*: Ensure the bullet list is distinct.

