  4.  **Drafting - Integrating the Philosophy:**
      *   *Reference Class:* David should mention "observer moments" or "digital minds." Elena should question if she counts the same as a uploaded consciousness.
      *   *Prior:* David should mention the assumption of equal likelihood vs. scaling. Elena should push back that it assumes too much ignorance.
