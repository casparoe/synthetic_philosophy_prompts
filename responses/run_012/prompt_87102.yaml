  5.  **Drafting - The Narrative Arc:**
      *   Start with work. Forecasting milk demand. It's stable.
      *   Inciting incident: The forum post/comment late at night.
      *   Rising action: House hunting with partner. The mortgage discussion.
      *   Climax (Quiet): A conversation with David about the math. The realization of the prior problem.
      *   Resolution: She doesn't solve the math. She makes a decision based on the feeling, not the proof. She signs (or doesn't sign)? Let's have her *not* sign, but not because she's sure, but because the uncertainty is too heavy. Or maybe she signs anyway, acknowledging the absurdity. The prompt says "end on something a person would plausibly actually do." Usually, people ignore existential dread to pay mortgages. But the prompt wants the argument to have hooks. Let's have her pause. She delays. It's a small act of rebellion against the timeline.

      *Refining the Ending:* If she just ignores it, the story loses tension. If she blows up her life, it feels melodramatic. The "dry and sad" tone suggests a quiet withdrawal. She doesn't buy the house. She stays renting. She tells her partner she's not ready. It's a lie, but it's the only move that respects the probability.

  6.  **Writing - Focus on Tone:**
      *   Avoid exposition dumps.
      *   Keep the math conversational.
      *   Focus on the sensory details of the grocery chain (pallets, spoilage, dates).
      *   Ensure the "Reference Class" and "Prior" objections are raised naturally.

  7.  **Review against Constraints:**
      *   No lecture scenes? Keep the math talk brief.
      *   No names/citations? Check.
      *   Length? Aim for 1500-2000.
      *   Pre/Post tasks? Don't forget them.

  8.  **Drafting - Step-by-Step:**
