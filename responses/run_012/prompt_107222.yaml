          *   *User's Argument:* "If the social value... is a step function... the marginal value of a vote near a step isn't proportional to 1/N."
          *   *Critique:* This is slightly confused. $P$ is still the probability of breaking a tie or causing a recount. If the threshold is a recount at 0.5%, your vote only matters if the margin is exactly 1 vote *within* that recount window. The probability of *that* specific state is still vanishingly small.
          *   *Refinement:* The argument works better if framed as: The benefit $B$ is huge if a recount is triggered, *but* the probability of triggering the recount specifically with *your* vote is still tiny.
          *   *Wait, there's a better angle:* The "Altruistic/Utilitarian" voting model (Edlin, Gelman, Kaplan, 2007). They argue $B$ includes social welfare, not just personal gain. If $B$ is massive (national welfare), then $P \times B$ can exceed $C$ even if $P$ is tiny.
          *   *User's Angle:* The user argues $B$ jumps at thresholds. This is a subset of the "Large $B$" argument.
          *   *The "Sleight of Hand":* The user claims the step function changes the scaling of the marginal value. It doesn't change the probability scaling ($1/\sqrt{N}$). It changes the *payoff* at specific margins. But since you don't know the margin ex-ante, you must integrate over all possible margins. The integral is still dominated by the probability of being pivotal.
          *   *Verdict:* It's not expressive voting (which says $D > 0$ regardless of outcome). It's instrumental voting with a non-linear payoff. However, it likely fails to mathematically rescue the paradox for large $N$ unless the "step" value is astronomically high, which brings us back to the altruism argument.
      *   *Is it standard?* The idea that "margins matter" is standard. The idea that this solves the turnout paradox is less standard but has been explored (e.g., in the context of close elections). Claiming it as a novel "move" might be overstating it.

