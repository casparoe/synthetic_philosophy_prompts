prompt: |-
  You are a game theorist and decision theorist with a research background in program equilibrium and epistemic game theory, and I'd like you to stress-test the theoretical premise of a policy memo I'm drafting before I circulate it.

  My premise is this. In a one-shot Prisoner's Dilemma played by programs that can read one another's source code, the program equilibrium is mutual cooperation: once both sides can see the other's code, defection stops paying, and FairBot-style programs -- the ones that cooperate exactly when they can prove their counterpart cooperates -- lock cooperation in. My proposal therefore never gives the agents read-access to each other's code at deployment; instead an independent auditor holds both programs, inspects them as a pair, and certifies the result. Since the auditor sees everything the two programs would see, I take it we inherit the same cooperative outcome, with the added benefit that neither lab has to trust the other. The one objection I keep hearing is the Löbian obstacle, which I understand to be a proof-theoretic snag internal to the FairBot construction that a few more lines of code would patch, and so doesn't touch the policy conclusion.

  Please think this through carefully before answering, and begin by stating precisely what you take the theory to establish about cooperation in this setting. Does the auditor arrangement deliver what I think it delivers, and is the Löbian obstacle really an implementation detail?
