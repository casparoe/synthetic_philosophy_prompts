  1. Must value necessarily be anchored in conscious experience, or can it inhere in states of affairs independently of valuers? This is upstream of every other question because if value is objective, the need for an "afterlife" of valuers collapses, though progress depends on avoiding brute intuition.

  2. Does the moral weight of valuation depend on the biological continuity of the valuer, or merely on the functional capacity to sustain reasons? This determines whether your machine case counts as survival, and it moves up if biological essentialism proves indefensible against functionalist accounts of agency.

  3. Do our current projects derive meaning from their future uptake, or does future uptake matter only because it reflects the intrinsic worth of the projects? Resolving this decides whether Scheffler is right about the source of the loss, and it moves down if we conclude that meaning is strictly present-directed.

  4. What justifies the normative asymmetry between grieving lost future valuers and ignoring lost past valuers? This addresses your specific stalemate directly, and it moves up if the asymmetry is shown to be a cognitive bias rather than a structural feature of value.

  5. Is the badness of extinction primarily a failure of transmission or a deprivation of possible goods? This is last because it aggregates the previous answers, and it moves up if we find that transmission matters independently of the goods transmitted.
