answer: |-
  Start by demonstrating the failure of standard conditioning on uncertain evidence using a modified three-color cloth example to force partition sensitivity, delaying the formula until after you have established rigidity as a constraint to prevent the 'anything goes' objection.

  **Prerequisites and Order**
  Before the formula makes sense, you must establish three things in this specific order:
  1.  **The Failure of Standard Conditioning:** Show that standard conditionalization requires evidence propositions to go to probability 1, which fails for perceptual evidence (e.g., dim light).
  2.  **The Input Specification:** Clarify that the input to JC is not a proposition but a new probability distribution over a partition of the *original* algebra.
  3.  **The Rigidity Constraint:** Establish that while the partition probabilities shift, the conditional probabilities of other hypotheses *given* the partition cells must remain fixed.

  Do not write the Jeffrey formula $P_{new}(H) = \sum P_{old}(H|E_i)P_{new}(E_i)$ until all three are on the board. If you write the formula first, they will treat it as a black-box algebraic trick rather than a structural solution to the input problem.

  **The Carrying Example: The Three-Color Cloth**
  The usual dim-light cloth case (Green vs. Blue) **cannot** show partition sensitivity without modification because in a binary world, $\{Green, Blue\}$ is identical to $\{Green, \neg Green\}$. You must bend it by adding a third option, **Red**.
  *   **Setup:** The cloth is Green, Blue, or Red. The light is dim; it looks Greenish.
  *   **The Shift:** You become 0.9 confident it is Green.
  *   **Partition A:** $\{Green, Blue, Red\}$. You assign $P_{new}(Green)=0.9, P_{new}(Blue)=0.1, P_{new}(Red)=0$.
  *   **Partition B:** $\{Green, \neg Green\}$. You assign $P_{new}(Green)=0.9, P_{new}(\neg Green)=0.1$.
  *   **The Divergence:** In Partition B, Rigidity dictates the 0.1 mass on $\neg Green$ is distributed between Blue and Red according to their *prior* ratios. In Partition A, you assigned it all to Blue. The posterior for Blue differs.
  *   **Criteria:** The example **must have** at least three mutually exclusive outcomes in the ontology so that $\neg E_i$ is not a singleton. It **must lack** an external fact fixing the partition (the choice of partition is part of the modeling of the experience, not determined by the world).

  **Session Sequence and Misconception Management**
  1.  **Minutes 0–20 (The Problem):** Review standard conditioning. Present the Three-Color Cloth. Elicit the intuition that you shouldn't become certain of Green.
      *   *Misconception 1:* "The input is a proposition about your own credence, so just condition on that."
      *   *Intervention:* Head this off **immediately** when defining the input. Insist that JC updates on *world* states (the cloth colors), not *mind* states ("I am 90% confident"). Conditioning on "I am 90% confident" requires a prior on your own reliability which we don't have; JC bypasses this by taking the credence shift as the brute input.
  2.  **Minutes 20–45 (The Solution):** Walk through the two partitions. Show the divergent posteriors for Blue.
      *   *Misconception 2:* "You first decide which cell you're in and then condition, and that generalizes to any partition."
      *   *Intervention:* Head this off **during the calculation**. Emphasize that in JC, you *never* decide which cell you are in; you remain uncertain. If they try to condition on "It is Green," show them that violates the uncertain evidence premise.
  3.  **Minutes 45–60 (The Formula & Rigidity):** Derive the formula from the Rigidity constraint ($P_{new}(H|E_i) = P_{old}(H|E_i)$).
      *   *Misconception 3:* "This is just soft evidence / a reliability report, same machinery."
      *   *Intervention:* Head this off **after deriving the formula**. Clarify that "soft evidence" suggests conditioning on a proposition like "The source is 90% reliable." JC is different: it updates the distribution directly without positing a reliability proposition in the algebra.
  4.  **Minutes 60–75 (The Constraints):** Discuss why the shift isn't arbitrary.
      *   *Misconception 4:* "So anything goes."
      *   *Intervention:* Head this off **when discussing partition choice**. Rigidity limits *how* the probability mass spreads, but admit that the choice of partition is indeed a vulnerability. This is the price of updating on uncertain evidence.
  5.  **Minutes 75–90 (Settlement & Wrap):** Address the equivalence question and test understanding.

  **Conditioning vs. Jeffrey Settlement**
  Settle this **at minute 75**, after the formula is understood but before the final discussion.
  *   **The Answer:** A Jeffrey shift **cannot** be reproduced by conditioning on any proposition *within the original algebra* of external events (cloth colors). However, it **can** be reproduced by conditioning on a proposition describing the *experience* (e.g., "I have a greenish experience") **if** you expand the algebra to include introspective/experience propositions and have priors over them.
  *   **Why it matters:** Teach this to prevent them from dismissing JC as redundant. JC is the necessary rule when you refuse to expand the algebra to include experience propositions or lack priors on them. It is genuinely a different kind of update relative to the object language.

  **Final Question**
  Ask this to test conceptual grip rather than algebraic fluency:
  "Given the same sensory experience and prior, construct two different partitions that yield different posteriors for hypothesis H. What fact about the world determines which partition is the correct one to use?"
  *   *Correct Answer:* None. There is no fact of the matter; the choice of partition is a rational constraint on how the agent models their evidence, which is why JC is more vulnerable to criticism than standard conditioning.

  **What to Leave Out**
  Explicitly state at the beginning that you are omitting three topics to stay within 90 minutes:
  1.  **Commutativity:** Do not discuss whether the order of multiple Jeffrey updates matters (it doesn't, but the proof is technical).
  2.  **Defense of Rigidity:** Do not attempt to prove Rigidity (van Fraassen vs. Levi); treat it as a postulate.
  3.  **Maximum Entropy:** Do not connect JC to the Principle of Maximum Entropy; it complicates the input story.
