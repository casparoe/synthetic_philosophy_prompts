          4.  Premise 2 (Margin for Error/Reliability): If subject knows $C$ holds in $\alpha_i$, then $C$ holds in $\alpha_{i+1}$ (because $\alpha_i$ and $\alpha_{i+1}$ are indiscriminable).
          5.  Premise 3 (Boundary): $C$ holds in $\alpha_0$ but not in $\alpha_n$.
          6.  Contradiction: By induction, $C$ holds in $\alpha_n$, contradicting Premise 3.
      *   *Key Assumptions:*
          *   **Gradualism/Continuum:** The cases must be close enough that knowledge in one implies truth in the neighbor (Margin for Error Principle).
