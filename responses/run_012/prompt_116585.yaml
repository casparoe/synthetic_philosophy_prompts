  So I've been working on a long piece about the principle of indifference — the idea that when you've got nothing favoring any one of a bunch of possibilities you should spread your credence evenly among them — and how Bertrand's chord problem is supposed to show the whole thing is a mess. You know the one: pick a random chord of a circle and depending on whether you randomize over endpoints, over distance from the center, or over angle, you get 1/3, 1/4, or 1/2 for "longer than the side of the inscribed triangle." I get the paradox as a parlor trick, but I keep arguing with a friend who thinks it's actually fatal, and with a colleague of ours, a probabilist, who thinks it's all just sloppy problem-statement. She's got this rule she calls indifference under the finest partition: she says you should never apply indifference to a coarse outcome space like "the chord length falls in some set" — you should always descend to the finest partition of the sample space that the problem actually determines, apply indifference only there, and let the coarse probabilities fall out by additivity. She claims this kills every version of the paradox, not just the chord one, because the paradoxes all come from smuggling in a partition the problem never specified. I cant tell if that's a real insight or a verbal fix.

  Here's what I actually want from you: give me your credence — a number, not a shrug — that her rule, stated carefully, is a consistent and fully general replacement for the naive principle of indifference, i.e. that for any well-posed problem it yields a unique credence and never generates a Bertrand-style contradiction. Decompose it. I want separate probabilities for: (1) that the rule is even well-defined once you try to say what "the finest partition the problem determines" means, and doesn't just push the ambiguity down a level; (2) that it gives the answers we independently think are right in the classic cases — the chord, van Fraassen's cube factory, and whatever else you'd count; (3) that it survives the harder adversarial cases people have cooked up; and (4) the prior question of whether indifference is salvageable in principle at all, or whether the paradoxes are really an argument that imprecise priors are the honest answer. Then multiply it out, and tell me which of those four the final number is most sensitive to — and, given that my fatalist friend puts the salvageable question at about 0.15 and my probabilist friend at about 0.85, which of them my own number should most likely side with if I'm trying to locate where the real disagreement lives. One line of justification per term, please.
