  # JOINT STATEMENT ON THE ERASURE VARIANT OF THE TOXIN PUZZLE
  **An Adversarial Collaboration between the Broad-Intention and Narrow-Intention Camps**

  **Date:** October 26, 2023
  **Subject:** The Possibility and Rationality of Detached Intention in the Erasure Variant

  ## PREAMBLE
  We, the undersigned representatives of the Broad-Intention Camp (BIC) and the Narrow-Intention Camp (NIC), acknowledge a fundamental disagreement regarding the metaphysics and rationality of intention. To advance the debate, we have adopted a specific variant of Gregory Kavka's Toxin Puzzle, herein referred to as the **Erasure Variant**.

  **The Erasure Variant:** A billionaire offers a substantial reward. Payment is contingent solely on a reliable lie detector confirming that at time $t_1$ the agent intends to drink a non-lethal toxin at time $t_2$. The agent knows that immediately after verification (but before $t_2$), they will be administered a drug that (a) erases the intention to drink and (b) renders them indifferent to the reward. The agent knows at $t_1$ that at $t_2$ they will neither intend to drink nor have any motivation to drink.

  While we disagree on the interpretation of this case, we have reached consensus on the parameters of the debate and the specific points of contention.

  ---

  ## PART I: AGREED CLAIMS
  *The following claims are endorsed by both the Broad-Intention Camp and the Narrow-Intention Camp.*

  1.  **The Action Prediction:** Both camps agree that in the Erasure Variant, the agent will **not** drink the toxin at $t_2$. Given the drug-induced indifference to the reward and the unpleasantness of the toxin, there is no ex post facto reason to act.
  2.  **The Verification Condition:** Both camps agree that the reward is secured exclusively by the mental state present at $t_1$, as verified by the lie detector. The action at $t_2$ is causally irrelevant to the payment.
  3.  **The Epistemic Condition:** Both camps agree that the agent possesses full knowledge at $t_1$ regarding the drug's effects. The agent knows with certainty at $t_1$ that they will not drink at $t_2$.
  4.  **The Normative Stakes:** Both camps agree that the central philosophical question is not whether the agent *should* drink (both agree they should not), but whether the agent can **rationally form the intention** at $t_1$ given the knowledge that the intention will not lead to action.
  5.  **Theoretical Relevance:** Both camps agree that the intuitions generated by the Erasure Variant bear directly on the definition of intention. Specifically, they agree this case tests whether intention is constitutively linked to a disposition to act or whether it is a distinct propositional attitude that can be adopted for strategic reasons.
  6.  **Methodological Commitment:** Both camps agree to treat first-person introspective reports regarding the possibility of forming the intention as data, while acknowledging that such reports are theory-laden and subject to interpretation.

  ---

  ## PART II: TABLE OF DISAGREEMENTS
  *The following table outlines the specific points of divergence. Positions are phrased in terminology acceptable to each camp. For each crux, we identify the specific feature of the Erasure Variant that bears on the issue and record pre-registered predictions regarding how rational agents (or subjects in simulation) will respond.*

  | Crux | Broad-Intention Camp Position (BIC) | Narrow-Intention Camp Position (NIC) | Agreed Bearing (Feature of Erasure Variant) | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Belief Condition**<br>*(Can one intend what one believes one will not do?)* | **The Separability Thesis:** It is possible to intend to $\phi$ at $t_1$ even if one believes at $t_1$ that one will not $\phi$ at $t_2$. Intention is a distinct mental state that does not logically entail a belief in future action. | **The Consistency Thesis:** It is impossible to intend to $\phi$ while believing one will not $\phi$. Intention conceptually requires a belief (or high credence) that one will act. | **The Certainty of Inaction:** The agent knows at $t_1$ that the drug at $t_2$ guarantees non-action. This isolates the intention from the belief of success. | **BIC:** Subjects will report they can sincerely form the intention to secure the reward, despite knowing they won't drink.<br>**NIC:** Subjects will report they cannot sincerely intend; they will describe their state as "wishing," "hoping," or "pretending." |
  | **2. The Rationality of Formation**<br>*(Is it rational to form an intention for a reward that does not justify the action?)* | **Instrumental Rationality of States:** It is rational to form an intention if holding that mental state yields a benefit (the reward), regardless of whether the content of the intention is executed. | **Action-Guiding Rationality:** Intention is rational only if it is supported by reasons to *act*. Since the reward does not justify drinking the toxin, forming the intention is irrational or impossible. | **The Decoupling of Payoff:** The reward justifies the *intention* but not the *action*. The drug ensures the action has no justification. | **BIC:** Agents will judge the formation of the intention as rational (smart strategy).<br>**NIC:** Agents will judge the formation of the intention as irrational (akratic or self-deceptive). |
  | **3. The Nature of Disposition**<br>*(Does intention entail a disposition to act?)* | **State Voluntarism:** Intention is a commitment that can be adopted voluntarily. A disposition to act is a typical *consequence* of intention, not a *constituent*. The drug interrupts the consequence, not the state. | **Dispositional Essentialism:** To intend just is (in part) to be disposed to act. If the drug removes the disposition at $t_2$, the lie detector at $t_1$ could not have detected a genuine intention, as the disposition was already known to be defeasible. | **The Lie Detector Mechanism:** The detector measures the mental state at $t_1$. The disagreement is on what the detector *finds*. | **BIC:** The detector will register "Intention Present" because the agent successfully commits at $t_1$.<br>**NIC:** The detector will register "No Intention" (or deception) because the agent lacks the requisite dispositional structure at $t_1$. |
  | **4. Strategic Self-Manipulation**<br>*(Can one manipulate oneself into genuine intention?)* | **Feasibility:** Agents can engage in strategic self-manipulation (e.g., focusing on the reward, ignoring the drug) to generate a genuine intention state at $t_1$. | **Impossibility:** One cannot manipulate oneself into a belief-disposition complex that one knows is false. Self-manipulation yields only a simulacrum of intention. | **The Pre-Commitment Window:** The time between hearing the offer and the $t_1$ scan allows for potential mental manipulation. | **BIC:** With training, agents can learn to pass the lie detector consistently.<br>**NIC:** Even with training, agents are merely learning to mimic the physiological correlates of intention, not to intend. |

