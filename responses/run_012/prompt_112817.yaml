prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps in the philosophy of action: the broad-intention camp, which holds that Kavka's toxin puzzle shows that intention can be detached from action, and the narrow-intention camp, which holds that it shows intention cannot be so detached. The puzzle is the familiar one in which a billionaire offers you a large reward if you intend tonight to drink a non-lethal toxin tomorrow, though you may change your mind and not drink. The two camps have agreed to focus on a variant in which the reward is paid only if a reliable lie detector confirms that at t1 you intended to drink at t2, but you also know that at t2 you will be given a drug that erases the intention and leaves you indifferent to the reward. What claims about the puzzle, intention, and rationality can both camps sign? Where exactly do they still disagree, with each side's position stated in wording that side would accept? What are the cruxes -- for example, whether intention entails a disposition to act, whether one can intend what one believes one will not do, and whether strategic self-manipulation can produce genuine intention -- and for each crux, what case or argument both sides agree bears on it, with each side's prediction written down in advance. Format the document as a numbered agreed-claims section followed by a disagreements table.
