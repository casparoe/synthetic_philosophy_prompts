answer: |-
  Here is the plan for your eighty-minute session.

  ### 1. Critique of the Crux
  Your crux is not confused; it is the correct pedagogical lever for this level. The collapse your students experienced last year is predictable because standard introductions often treat "satisficing" as a monolithic alternative to maximizing. By splitting it into **Static Aspiration** (fixed bar) and **Dynamic Improvement** (better than current), you expose the structural mechanics of search rather than just the outcome.

  **One caution:** Purists reserve "satisficing" for the Static Aspiration rule (Simon's original definition). The Dynamic Improvement rule is often termed "hill climbing" or "melioration." If you label both "satisficing" without qualification, you risk storing up terminological trouble for students who read further.
  **Fix:** In the session, introduce them as "Two Procedures of Bounded Search." Label the first **Aspiration-Based Stopping** and the second **Improvement-Based Stopping**. Tell the students: *"Both fall under the umbrella of bounded rationality, but they fail in different ways. We are analyzing the mechanics of the stop, not just the label."* This preserves your crux while maintaining precision.

  ### 2. The One Case: The Foggy Ridge
  Do not use the Secretary Problem. It assumes a sequence of options that vanish, which subtly reinforces the idea that the problem is *memory* or *time*, rather than *knowledge of the landscape*.

  **The Case:** A team must select a location for a remote weather station on a mountain ridge.
  *   **The Constraint:** They have a drone, but thick fog limits visibility. They can only see the elevation of the immediate terrain around their current position. They cannot see the whole map (no God's-eye view).
  *   **The Goal:** Find a site high enough for signal clarity, but stable enough for safety.
  *   **The Landscape:** Imagine a terrain with multiple peaks. One peak is the global maximum (1000m). There is a smaller local peak (600m). There is a valley between them.

  **How the Rules Diverge:**
  1.  **Aspiration-Based (Fixed Bar):** The rule is "Stop at the first site above 800m."
      *   *Failure Mode:* If the team starts on the side of the 600m peak, they search indefinitely. They never find an 800m site. The rule creates **paralysis**.
  2.  **Improvement-Based (Relative):** The rule is "Move to any adjacent site higher than the current one; stop when no adjacent site is higher."
      *   *Failure Mode:* The team climbs the 600m peak. Once at the top, all adjacent moves go down. They stop. They have rationally followed the rule, but they are stuck on a sub-optimal peak. The rule creates **premature settlement** (local maxima).

  This case isolates the *stopping rule* from the *arrival process*. It shows that rationality is path-dependent under bounds.

  ### 3. Session Sequence (80 Minutes)

  **0:00 – 0:10: The God's-Eye View (EUT Recap)**
  *   Briefly recap Expected Utility Theory. Emphasize that EUT assumes a known set of alternatives and known probabilities.
  *   **Point:** In EUT, "search" is just another cost in the equation. You optimize the search *and* the choice simultaneously.
  *   **Transition:** "What happens when we remove the set of alternatives? What if you don't know what options exist until you look?"

  **0:10 – 0:25: Introducing the Fog (The Constraint)**
  *   Present the **Foggy Ridge** case.
  *   Draw the landscape on the board. Mark the fog line.
  *   Define the problem: We cannot calculate expected utility because we cannot enumerate the states.
  *   Introduce the two rules (Aspiration-Based vs. Improvement-Based).
  *   **Misconception 1 (Settling for Less):** Students will say the Improvement rule is "lazy."
      *   *Head it off here:* Ask, "Is it lazy to stop when you cannot see a better path?" Frame this as *epistemic humility*, not weakness. You cannot maximize what you cannot see.

  **0:25 – 0:45: The Divergence (Running the Case)**
  *   Walk through the two failure modes on the board.
  *   Show the Aspiration rule leading to infinite search (the 800m bar on the 600m peak).
  *   Show the Improvement rule leading to the local peak (stopping at 600m).
  *   **Misconception 2 (Constrained Optimization):** Students will argue, "This is just optimization with a search cost constraint."
      *   *Head it off here:* This is the critical pivot. Explain that in constrained optimization, you still need to know the *function* you are optimizing to set the marginal cost of search equal to marginal benefit. In the fog, you don't know the function. You cannot solve for the optimal search rule. You must *adopt* a rule. This is not a concession to weakness; it is a redefinition of the rational procedure.

  **0:45 – 0:60: The Aspiration Level (Where does the bar come from?)**
  *   Focus on the Aspiration-Based rule. Where does the 800m number come from?
  *   **Misconception 3 (Arbitrary Fudge):** Students will claim the aspiration level is just a guess or a psychological parameter.
      *   *Head it off here:* Explain aspiration adaptation. The bar moves based on experience. If you find 800m easily, raise it. If you search too long, lower it. This is a *feedback control system*, not an arbitrary constant. It makes the rule robust to environmental changes without requiring new calculations.

  **0:60 – 0:70: Rationality Redefined**
  *   Bring the threads together.
  *   **Misconception 4 (Psychology vs. Rationality):** Students will view this as "how humans actually behave" (descriptive) vs. "how they should behave" (normative).
      *   *Head it off here:* Assert that under bounded information, the Improvement rule *is* the normative standard. Maximizing is not just difficult; it is *undefined*. Therefore, a procedure that guarantees local improvement is rational *by definition* in this context. Bounded rationality is not a study of error; it is a study of procedure.

  **0:70 – 0:80: The Closing Question**
  *   Present the transfer test (see below).
  *   Discuss answers.
  *   Final takeaway: "Rationality is not about the outcome; it is about the fit between the procedure and the structure of the environment."

  ### 4. The Closing Question
  Do not ask them to define the terms. Give them a new scenario where the rules prescribe different actions.

  **The Scenario:**
  "You are a manager hiring for a role. You have a budget of $100k.
  *   **Candidate A** asks for $90k and is qualified.
  *   **Candidate B** asks for $110k (over budget) but is exceptional.
  *   **Candidate C** asks for $80k and is less qualified than A.
  *   You interview in random order. You cannot recall rejected candidates."

  **The Question:**
  "Under an **Aspiration Rule** (Salary $\le$ $100k$ + Qualified), which candidate can you hire? Under an **Improvement Rule** (Hire the best qualified candidate seen *so far* who fits the budget), how does your verdict change if you interview Candidate C *before* Candidate A?"

  **The Answer Key:**
  *   **Aspiration Rule:** You hire Candidate A (or C). You reject B immediately (fails bar). Order doesn't matter for the *standard*, only for *which* acceptable candidate you find first.
  *   **Improvement Rule:** Order matters critically.
      *   If you see C first ($80k, low qual), you hold C. Then you see A ($90k, high qual). A is better than C. You hire A.
      *   If you see A first, you hold A. Then you see C. C is worse. You keep A.
      *   *Wait, to make them diverge:* Change the Improvement Rule to "Best candidate seen so far, regardless of budget, then negotiate?" No, keep it simple.
      *   *Better Closing Question:*
      "You are selecting a restaurant.
      *   **Rule 1:** Stop at the first restaurant with a health score > 90.
      *   **Rule 2:** Stop at the first restaurant that is better than the one you ate at last week (score 85).
      *   **Sequence:** You pass a score 88, then a score 92, then a score 95.
      *   **Question:** Which restaurant do you eat at under Rule 1? Which under Rule 2? Now, imagine the sequence is 88, then 89, then 87. Where do you end up?"

      *   *Why this works:*
          *   Sequence 1 (88, 92, 95): Rule 1 stops at 92. Rule 2 stops at 89 (because 89 > 85). **Divergence.**
          *   Sequence 2 (88, 89, 87): Rule 1 searches forever (no 90+). Rule 2 stops at 89. **Divergence.**
      *   This forces them to track the *state* (current hold vs. fixed bar) to get the answer.

  ### 5. What to Refuse to Cover
  You must explicitly state what is out of bounds to keep the seminar focused on the *logic of the rule* rather than the *math or biology*. Say this out loud at the start of the "Misconceptions" section (minute 45):

  *"I want to be clear about what we are not doing today.
  1.  **We are not doing calculus.** We are not deriving optimal stopping points. If we could do that, we wouldn't need heuristics.
  2.  **We are not doing neuroscience.** I don't care how the brain implements this. I care about whether the procedure is defensible.
  3.  **We are not doing Game Theory.** We are assuming a passive environment. If the environment fights back, the rules change, but that is for a later seminar.
  Today is about the logic of choice when the map is incomplete."*

  ### 6. Summary of Misconception Timing
  1.  **"Satisficing is settling for less."**
      *   *When:* Minute 15 (Intro to Foggy Ridge).
      *   *Counter:* It is settling for *feasible*. In the fog, "more" is not an option.
  2.  **"It's just constrained optimization."**
      *   *When:* Minute 35 (After showing the failure modes).
      *   *Counter:* You cannot optimize the search cost if you don't know the distribution of options.
  3.  **"The aspiration level is an arbitrary fudge."**
      *   *When:* Minute 50 (Aspiration Adaptation).
      *   *Counter:* It is a tuning parameter responsive to environmental feedback, not a constant.
  4.  **"This is psychology, not rationality."**
      *   *When:* Minute 65 (Reframing Rationality).
      *   *Counter:* When maximizing is undefined, procedural consistency *is* rationality.

  ### 7. Final Advice
  Your instinct to avoid the Secretary Problem is correct. It tempts students to try to "solve" for the optimal cutoff (the $1/e$ rule), which drags them back into the maximizing frame you are trying to dislodge. The Foggy Ridge keeps them focused on the *topology of the search space*, which is where bounded rationality lives.

  Stick to the distinction between the **Fixed Bar** (risk of paralysis) and the **Improvement Rule** (risk of local maxima). If they leave the room understanding that "rationality depends on the shape of the search," you have succeeded.
