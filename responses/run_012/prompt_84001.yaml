answer: |-
  Framing

  The issue is whether looking back changes the truth of what happened, or merely our access to it. You argue hindsight is the very structure of understanding, not a distortion of it. I worry this conflates making sense with making true. If narrative is the only way to explain, do we sacrifice the reality of chance? We must decide if your theory saves explanation by killing contingency.

  Movement One: The Charge

  1. You claim hindsight is the stance of explanation, not a distortion of it. But explanation usually implies knowing why something *had* to happen. If I can explain a battle only after winning it, is that because the victory made the causes visible, or because I selected only the causes that led to victory?
     *If she says selection is necessary for sense: Ask if sense then overrides truth.*

  2. Consider actuarial tables: we can predict how many people will die in traffic without explaining why *you* died today. If we can predict a class of events without explaining any single member, does your claim that narrative is required for explanation survive?
     *If she says statistics aren't explanation: Ask why narrative gets a pass on verification.*

  3. If future technology allowed perfect prediction of singular events, would hindsight still be necessary for explanation? If yes, explanation is detached from reality; if no, your theory depends on our current ignorance.
     *If she says yes (detached): Ask if history becomes fiction.*

  Movement Two: The Defence

  1. A doctor misses a symptom; the patient dies. Later, the cause looks obvious. If hindsight is a cognitive achievement rather than a bias, is the doctor's failure merely a lack of narrative skill, or did the truth actually change when the patient died?
     *If she says truth didn't change: Ask why we punish the doctor.*

  2. A general is judged by the battle's outcome, not the decision's quality at the time. If hindsight is constitutive of judgment, is it unjust to punish failure, or is the outcome the only valid measure of the decision's quality?
     *If she says outcome is valid measure: Ask about luck vs. skill.*

  3. A poker player calls a bet bad only when the card falls badly. If the narrative fallacy is the price of achievement, should the player learn from the loss or the decision process? If the former, isn't she teaching herself superstition?
     *If she says learn from loss: Ask how that differs from superstition.*

  Movement Three: The Craft

  1. You say the outcome was inevitable given the facts. But does your narrative make the facts themselves seem more determinate than they were? I need to know if you claim the past was fixed, or if your story fixes it.
     *If she says past was fixed: Ask why alternative histories feel plausible.*

  2. As a novelist, I create inevitability by deleting dead ends. Does the historian do the same? If so, is history just fiction that hasn't admitted it deletes the possible paths that didn't happen?
     *If she says no (evidence constrains): Ask if evidence constrains selection or interpretation.*

  3. I propose "foresight bias": the belief in the moment that the future is more open than it is. If hindsight bias is the structure of looking back, is foresight bias the structure of living? If both are true, is reality ever accessible?
     *If she says reality inaccessible: Ask why we should trust her book.*

  Closing Question

  If narrative is the price of explanation, and hindsight is the structure of narrative, then we never know the past as it was, only as it ended. Does this mean history is not the study of what happened, but merely the study of what survived? Please tell me where the reality lies.
  *If she says reality is in the survival, ask what died that mattered.*

  Where I Expect Her to Slip

  She will conflate the utility of a story with its truth, arguing that because narrative works, it must be valid. When pressed on reality, she will retreat to pragmatism: it doesn't matter if the past was open, only that we must treat it as closed to learn. Watch for her redefining "bias" as "structure" to avoid the charge of error. She may also claim that contingency is unknowable, thus irrelevant. Keep this reserve: If she claims utility proves validity, ask if a comforting lie is therefore true. Do not let her rest on the usefulness of hindsight; demand its relationship to fact. Force her to choose between comfort and accuracy.
