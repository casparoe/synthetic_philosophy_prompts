answer: |-
  You have identified a structural isomorphism that is well-recognized in contemporary meta-ethics, particularly within the subfield of **population ethics**, though it lacks a single, canonical proper noun (like "Ad Hominem") that covers the entire genus.

  In the literature, these are most commonly referred to collectively as **"Limit Cases,"** **"Extreme Case Arguments,"** or **"Paradoxes of Aggregation."** When formalized to show that no theory can satisfy a set of intuitive conditions simultaneously (as Gustaf Arrhenius has done), they are called **"Impossibility Theorems."**

  However, there is no single established term that specifically names the *rhetorical maneuver* of taking a scalar variable within a theory and driving it to a bound to generate absurdity. Because you asked for the nearest established concepts *and* invited a coinage if the genus is unnamed, I will first map the existing landscape, distinguish it from the concepts you mentioned, and then propose a precise term for this specific argumentative genus.

  ### 1. The Established Landscape

  The three examples you gave are the "Holy Trinity" of this pattern in modern ethics:
  1.  **The Utility Monster** (Nozick, 1974): Extreme *capacity* per individual.
  2.  **The Repugnant Conclusion** (Parfit, 1984): Extreme *number* of individuals.
  3.  **The Sadistic Conclusion** (Arrhenius, 2000): Extreme *negative quality* aggregated to outweigh positives.

  Scholars treat these as structurally identical. Michael Huemer, for instance, explicitly argues that the Utility Monster and the Repugnant Conclusion are "isomorphic" problems arising from the same feature of aggregative theories (unbounded summation). Derek Parfit's methodology in *Reasons and Persons* relies heavily on what he calls **"Continuum Arguments"**: showing that if you accept a small change, you must accept a series of small changes leading to an extreme limit.

  **The Nearest Established Concept:**
  The closest technical term is **"Limit-Case Analysis."** In philosophy of science and ethics, a limit case is a scenario where a variable approaches a boundary (zero, infinity, maximum). However, "Limit-Case Analysis" is neutral; it can be used to *defend* a theory (showing it holds up even at the limit) or *attack* it. You are describing the offensive use of this analysis.

  ### 2. Distinctions from Related Concepts

  You asked how this differs from intuition pumps, reductio, and general absurdity claims.

  **Vs. The Intuition Pump (Dennett)**
  *   **Intuition Pump:** A narrative thought experiment designed to prime a specific intuitive response (e.g., "Imagine a violinist plugged into your kidneys..."). It relies on *qualitative* features of the scenario to trigger moral sentiment.
  *   **Your Pattern:** This relies on *quantitative* features. It does not ask you to feel sympathy for the monster; it asks you to acknowledge the *math*. If the theory says $1 \text{ Monster Unit} > 1,000,000 \text{ Human Units}$, the narrative details of the monster are irrelevant. The "pump" is not the story, but the scalar variable.
  *   **Difference:** An intuition pump can be defused by tweaking the story. A limit-case argument can only be defused by capping the math (e.g., introducing lexical thresholds).

  **Vs. Reductio ad Absurdum**
  *   **Standard Reductio:** Shows that a premise leads to a *logical contradiction* ($P \to (Q \land \neg Q)$).
  *   **Your Pattern:** This is technically a **"Reductio ad Intuitum Absurdum."** It does not show the theory is logically incoherent; it shows the theory's output diverges from considered judgments at the limit.
  *   **Difference:** A standard reductio kills the theory definitively. This pattern forces a trade-off: either accept the "monstrous" verdict (bite the bullet) or restrict the theory's scope (lose generality).

  **Vs. "Far-Fetched" Objections**
  *   **General Complaint:** "This theory implies we should save the stranger instead of our mother in a trolley case."
  *   **Your Pattern:** The objection is not that the case is unlikely, but that the theory *licenses* the extreme. Defenders often claim the case is "physically impossible" (e.g., a utility monster cannot exist).
  *   **Difference:** In ethics, **conceptual possibility** usually trumps physical possibility. If the theory is about *value*, and value *could* theoretically be distributed that way, the physical impossibility of the distribution is irrelevant to the axiology. The pattern exploits the theory's *ideal* logic, not its practical application.

  ### 3. The Edges: Finite, Infinite, and Possible

  You asked where the boundaries of this pattern lie.

  **Does the quantity need to be genuinely unbounded (infinite)?**
  *   **No.** A sufficiently large finite number does the same work. The Repugnant Conclusion does not require an infinite population; it requires a population $N$ large enough that $N \times (\text{barely worth living}) > M \times (\text{excellent life})$.
  *   **Boundary:** If the number required to flip the verdict is so large that it exceeds the number of atoms in the universe, some defenders argue the objection loses force ("non-archimedean" views). However, logically, the pattern holds as long as the variable is *unbounded in principle*, even if bounded by physics.

  **Does the extreme case need to be metaphysically possible?**
  *   **No.** The Utility Monster is likely metaphysically impossible (can one being really have that much neural capacity?). The Sadistic Conclusion involves adding lives worse than nothing, which some argue is incoherent.
  *   **Boundary:** The pattern works on **conceivability**. If the theory defines value in a way that *allows* the variable to scale, the argument holds. If the theory includes a metaphysical cap (e.g., "No being can experience more than 100 units of bliss"), the argument fails. Thus, the pattern targets theories with **open-ended scalar variables**.

  **Refutation vs. Cost (The "Bullet-Biting" Line)**
  *   There is no principled line here; this is the battleground of **Reflective Equilibrium**.
  *   **Refutation:** If the verdict violates a "fixed point" of morality (e.g., "torturing the innocent is wrong"), it refutes the theory.
  *   **Cost:** If the verdict is merely surprising (e.g., "we should save the many over the few"), it is a cost the theory pays for simplicity.
  *   **The Pattern's Goal:** The goal of this maneuver is to push the verdict from "surprising cost" to "unacceptable refutation" by increasing the magnitude of the extreme.

  ### 4. Coining the Term: "The Scalar Limit Reductio"

  Since no single term captures the *genus* of the maneuver itself (distinct from the specific paradoxes like Repugnant Conclusion), I propose the term:

  ## **The Scalar Limit Reductio**

  **Definition:**
  An argumentative maneuver against a normative or axiological theory that:
  1.  Identifies a **scalar variable** ($V$) within the theory's aggregation function (e.g., number of agents, intensity of experience, duration).
  2.  Posits a value for $V$ at the **extreme end** of its conceptual range (approaching infinity, zero, or maximum capacity).
  3.  Demonstrates that at this limit, the theory's output ($O$) violates a core **adequacy condition** or robust intuition ($I$).
  4.  Concludes that the theory is either false or requires a **lexical constraint** (a non-scalar threshold) to block the result.

  **Why this term?**
  *   **Scalar:** Distinguishes it from qualitative changes (e.g., changing the *type* of good).
  *   **Limit:** Distinguishes it from standard counterexamples (which operate at normal magnitudes).
  *   **Reductio:** Captures the intent to reduce the theory's credibility, even if not a strict logical contradiction.

  ### 5. Boundary Cases for the Definition

  To test this definition, here are cases that sit on the edge.

  **Case 1: The Inclusion (Fits the Definition)**
  *   **Pascal's Wager:**
      *   *Variable:* Probability of God's existence / Magnitude of Eternal Reward.
      *   *Limit:* Infinite Utility ($\infty$).
      *   *Verdict:* You must believe, regardless of how low the probability is.
      *   *Analysis:* This is a **Scalar Limit Reductio** against Evidentialism or standard Decision Theory. It uses an infinite payoff to overwhelm finite probabilities. It fits the genus perfectly.

  **Case 2: The Exclusion (Looks similar, but is not)**
  *   **The Experience Machine (Nozick):**
      *   *Scenario:* You can plug into a machine that gives you maximum happiness, but it's fake.
      *   *Analysis:* This is **not** a Scalar Limit Reductio. It does not push the *amount* of happiness to an extreme to break the math. It attacks the *definition* of the variable (claiming happiness is not the only thing that matters).
      *   *Why Exclude:* A Scalar Limit Reductio accepts the theory's definition of the good but breaks its *aggregation*. The Experience Machine rejects the *axiology* itself.

  **Case 3: The Edge Case (Debatable)**
  *   **The Demandingness Objection to Utilitarianism:**
      *   *Scenario:* Utilitarianism requires you to give away all your money until you are as poor as those you help.
      *   *Analysis:* This looks like a limit case (pushing sacrifice to 100%). However, it targets the *agent's capacity to act*, not the *aggregation of the good*.
      *   *Verdict:* This is a **"Practical Limit Objection,"** not a Scalar Limit Reductio. The Scalar Limit Reductio targets the *theory of value* (the sum is monstrous); the Demandingness Objection targets the *theory of action* (the requirement is too hard). The distinction is subtle but important: one says the *goal* is wrong, the other says the *path* is too steep.

  ### Summary
  You are seeing a single maneuver. In the literature, it is fragmented across "Limit Cases," "Impossibility Theorems," and specific paradoxes. The unifying logic is the exploitation of **unbounded scalar variables** within an aggregation function. By naming it the **Scalar Limit Reductio**, you capture the mechanism (scaling), the method (limit analysis), and the intent (reduction of credibility), distinguishing it from qualitative counterexamples or practical objections.
