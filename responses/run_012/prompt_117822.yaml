answer: |-
  My mate David, a decision theorist, was holding court in the pub over a pint of bitter, explaining the Absent-Minded Driver paradox.

  "See, the crux is the information set," he said, waving his glass. "Because the driver can't distinguish junction one from junction two, he can't condition his action on his location. A deterministic plan fails. The optimal policy is actually a mixed strategy. He has to randomize whether to exit."

  I nodded slowly, nursing my lager. "Right. So you've mathematically proven that if you wipe an agent's context window between steps, the best you can do is roll dice."

  "Precisely. It's the maximum expected utility given the constraint."

  "So the constraint is the amnesia?"

  "It's the premise," he insisted. "If he remembers, the problem dissolves."

  "Okay," I said. "In my job, we call that a stateless service. If it's losing context, we just add a persistence layer. Redis, a database, a session cookie. Anything to store the count."

  David winced as if I'd suggested poisoning the barman. "You can't do that. If he remembers passing the first junction, the information sets separate. The theorem no longer applies."

  "So," I said, "your entire proof relies on us refusing to fix the bug."

  "It's not a bug, it's a philosophical constraint!"

  "It's a missing feature flag," I countered. "You're celebrating the optimal way to be broken. My fix yields a strictly higher payoff. It dominates your policy."

  He looked horrified. "But then he's not absent-minded."

  "No," I said, signalling the landlord for the bill. "Then he's just late. And you're out of a paper."
