answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL
  **Subject:** Determinants of Long-Run Economic Development
  **Parties:** The Institutions Camp (IC) vs. The Geography Camp (GC)
  **Status:** Pre-Analysis Plan & Binding Commitments

  ## 1. AGREED FOUNDATIONS
  *Both parties sign below as established facts not subject to further debate.*

  1.  **Magnitude:** The income gap between the richest and poorest nations is enormous (orders of magnitude) and accounts for the vast majority of human welfare inequality.
  2.  **Proximate Cause:** Both sides agree that immediate differences in income are driven by differences in total factor productivity and technology adoption, not merely capital accumulation.
  3.  **Timing:** The "Great Divergence" is historically recent. While some inequality existed in 1500, the massive gaps observed today emerged primarily in the last 200–500 years.
  4.  **Persistence:** Poor countries do not automatically converge to rich countries despite access to the same global technology pool. There is a fundamental barrier to adoption or implementation.
  5.  **Bracketing Culture:** Both sides acknowledge the "Culture Camp" exists but agree to bracket cultural explanations for this specific protocol. We agree that if culture matters, it likely operates *through* institutions or is correlated with geographic history, and we will not use "culture" as a residual category to explain away failed predictions.
  6.  **Policy Relevance:** Both sides agree that identifying the fundamental cause matters. If it is Geography, mitigation requires physical/technological fixes (vaccines, infrastructure). If it is Institutions, mitigation requires political/legal reform.

  ## 2. STEEL-MANNED POSITIONS
  *Each side's position is stated in terms they would accept as accurate. Strawmanning voids this agreement.*

  ### The Institutions Camp (IC) Position
  "Geography influences early development, but it is not destiny. Human-made rules (property rights, contract enforcement, constraints on elites) are the fundamental cause of prosperity. Where institutions are 'inclusive,' individuals invest and innovate; where they are 'extractive,' elites plunder and stagnation occurs. Historical shocks (like colonial settlement patterns) created path dependence, locking nations into institutional trajectories. Geography may correlate with income, but only because it influenced which institutions were set up historically. With political will, institutions can be changed regardless of location, leading to growth."

  ### The Geography Camp (GC) Position
  "Institutions do not float in a vacuum; they are endogenous to physical reality. Disease burdens, soil quality, climate volatility, and transport costs determine the surplus available to support complex state structures. 'Bad' institutions often persist not because of historical lock-in, but because the underlying geographic conditions make 'good' institutions too costly to maintain or unnecessary for survival. Geography affects income directly (via productivity/health) and indirectly (by shaping institutions). Attempts to transplant institutions into hostile geographic environments without addressing the physical constraints will fail."

  ## 3. THE CRUXES & PRE-COMMITTED TESTS
  *These are the specific sub-questions where disagreement persists. For each, we define a test case and pre-commit to what prediction would cause each side to update their beliefs.*

  ### Crux 1: The Validity of Historical Instruments
  **The Question:** Is the correlation between colonial history (e.g., settler mortality, colonization type) and current income driven by institutional path dependence (IC) or by omitted geographic variables that affected both colonization strategy and current development (GC)?

  **The Test:** **The "Reversal of Fortune" Re-evaluation.**
  We examine regions that were densely populated and relatively rich in 1500 (e.g., parts of Latin America/India) versus those that were sparse (e.g., North America/Australia).
  *   **IC Prediction:** The negative correlation between 1500 prosperity and current prosperity is driven by the *type* of institution installed (extractive in rich areas, inclusive in sparse areas). Controlling for institutions should eliminate the effect of 1500 density.
  *   **GC Prediction:** The negative correlation is driven by the fact that densely populated areas were in tropical/disease-prone zones or had soil exhaustion, while sparse areas were in temperate zones. Controlling for geography (latitude, disease ecology, soil) should eliminate the effect of 1500 density.

  **Update Condition:**
  *   **IC concedes** if, after controlling for granular geographic data (soil, climate, disease), the "institutional type" variable loses statistical significance.
  *   **GC concedes** if, after controlling for geography, the "institutional type" variable remains the dominant predictor of current income.

  ### Crux 2: Direct vs. Indirect Geographic Effects
  **The Question:** Does geography affect income *only* by shaping institutions (GC agrees it shapes institutions; IC argues it stops there), or does geography have a direct, persistent effect on productivity independent of the rules?

  **The Test:** **The Malaria Eradication Campaigns (Mid-20th Century).**
  We look at large-scale exogenous shocks to disease burden (e.g., DDT campaigns in Sri Lanka, India, Brazil) that improved health without immediate institutional reform.
  *   **GC Prediction:** Reducing disease burden leads to immediate, sustained increases in income per capita and productivity, even without major institutional overhaul. Health *is* wealth.
  *   **IC Prediction:** Reducing disease burden leads to population growth but *not* sustained increases in income per capita unless accompanied by institutional change. Without better rules, the surplus is consumed or captured by elites (Malthusian trap or extractive capture).

  **Update Condition:**
  *   **IC concedes** if disease eradication leads to sustained per-capita income growth in the absence of institutional reform.
  *   **GC concedes** if income per capita stagnates post-eradication despite health gains, until political reforms occur.

  ### Crux 3: Institutional Granularity (Is "Institutions" One Thing?)
  **The Question:** Is "Institutions" a single bundle (Inclusive = Good, Extractive = Bad), or can specific state capacities drive growth even under "extractive" political constraints?

  **The Test:** **The "Authoritarian Growth" Cases (e.g., Post-1980 China, Singapore, or Post-1960 South Korea).**
  We examine regimes with high state capacity and property rights for investment, but weak constraints on the executive (no democracy).
  *   **IC Prediction:** This growth is either temporary/unstable, or it requires a redefinition of "Inclusive Institutions" to mean "Secure Property Rights" rather than "Democracy." If they maintain growth without democratization, IC must admit that *State Capacity* is distinct from *Constraints on Elites*.
  *   **GC Prediction:** These cases succeed because they are in specific geographic zones (e.g., temperate East Asia) that allow for high state capacity regardless of regime type. They will eventually hit a geographic ceiling or be forced to democratize to sustain growth.

  **Update Condition:**
  *   **IC concedes** that their theory is too broad if high-growth authoritarian states persist for >50 years without democratizing, forcing a split between "Economic Institutions" and "Political Institutions."
  *   **GC concedes** if authoritarian states in difficult geographic environments (e.g., landlocked, tropical) achieve sustained high growth through administrative capacity alone.

  ### Crux 4: The Natural Experiment of Division
  **The Question:** When geography is held constant, do institutions alone explain divergence?

  **The Test:** **Divided Nations (North/South Korea, East/West Germany pre-1990).**
  *   **IC Prediction:** Divergence is entirely explained by the difference in political/economic systems. Reunification (Germany) or opening (Korea) should lead to rapid convergence of the poor side to the rich side, proving geography was never the bottleneck.
  *   **GC Prediction:** Divergence is explained by institutions, *but* the recovery of the poor side will be slower than IC predicts due to lingering human capital degradation caused by the institutional period, or because the "geography" of the region (e.g., access to global maritime trade routes) favored the West-aligned side during the Cold War era.

  **Update Condition:**
  *   **IC concedes** if the poor side fails to converge rapidly (within 1 generation) after institutional harmonization, suggesting deep structural (human capital or geographic) damage.
  *   **GC concedes** if the poor side converges rapidly to the rich side's income level once institutions are harmonized, proving geography was irrelevant to the gap.

  ## 4. SEMANTIC AUDIT
  *We agree that the following disputes are about definitions, not the world, and will resolve them as follows:*

  1.  **"Institutions" vs. "Policy":**
      *   *Dispute:* IC often calls short-term economic policies "institutions." GC argues these are transient.
      *   *Resolution:* We define **Institutions** as rules with >20 year persistence (constitutions, property law). We define **Policies** as short-term fiscal/monetary adjustments. GC cannot dismiss growth as mere "policy" if it lasts >20 years; IC cannot claim every budget change is an "institutional reform."

  2.  **"Fundamental" vs. "Proximate":**
      *   *Dispute:* IC calls institutions "fundamental." GC calls geography "fundamental."
      *   *Resolution:* We agree "Fundamental" means "the variable furthest back in the causal chain that is not itself explained by another variable in this model."
      *   *Agreement:* Geography is more fundamental than Institutions *historically*. However, Institutions are more fundamental than Income *politically*. The debate is not about which is more "ancient," but which is the **binding constraint today**. If fixing institutions yields growth despite bad geography, Institutions are the binding constraint. If fixing geography yields growth despite bad institutions, Geography is the binding constraint.

  3.  **"Endogeneity":**
      *   *Dispute:* GC says institutions are endogenous to geography. IC says institutions are exogenous shocks.
      *   *Resolution:* We agree institutions are endogenous *in the long run* (centuries) but can be treated as exogenous *in the medium run* (decades) due to path dependence. The debate must focus on the **medium run** (30–50 years) where policy is actually possible.

  ## 5. FAILURE CONDITIONS
  *This collaboration fails if:*
  1.  Either side attributes a failed prediction to "unmeasured culture" rather than updating on Geography or Institutions.
  2.  Either side moves the definition of "Institutions" or "Geography" mid-stream to accommodate new data.
  3.  Either side claims that because a factor (e.g., Geography) cannot be changed, it is not a valid explanation for *income levels* (it explains levels, even if it doesn't suggest policy).

  ***

  **Signed:**
  _____________________ (Representative, Institutions Camp)
  _____________________ (Representative, Geography Camp)
  _____________________ (Moderator/Observer)
