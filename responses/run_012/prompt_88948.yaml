prompt: |-
  I'm in a reading group thats been going at the "why are some countries rich and others poor" question for months now, and we've basically split into two camps that keep talking past each other. One camp says it's institutions -- the rules, property rights, constraints on the executive, the way colonial powers set up extractive versus inclusive arrangements -- and they point to things like the fact that former colonies that were rich in 1500 are often poor now, or the settler-mortality story where the places Europeans died in droves ended up with plunder institutions instead of settlement ones. The other camp says all of that is downstream of geography and environment: disease, soils, access to trade routes, climate, the tropics versus the temperate zones, and that the institutions crowd is just reading causation into a correlation. Then there's a third faction mumbling about culture that neither side really takes seriously, which probably says something about the debate.

  What I want is the document these people should have written instead of argueing for a year: an adversarial collaboration. So give me a numbered list of claims both camps can actually sign -- what's agreed on the facts (income gaps are enormous and old, productivity and technology are the proximate causes, the divergence is recent in the scheme of things) and what's agreed to be the real puzzle. Then a disagreements section, where for each side you state the position in wording that side itself would accept, not a strawman version. Then the cruxes: the sub-questions where settling one would actually move somebody. My guesses -- and push back if I'm wrong -- are that one is whether the historical instruments (settler mortality, the timing of colonization) are valid, another is whether geography works through institutions or around them, and a third is whether "institutions" is even one thing or several (property rights vs. state capacity vs. constraints on rulers) and whether thats why the thing never resolves. For each crux, give me a test or case both sides would agree bears on it -- a natural experiment like the two Koreas, the division of Germany, a resource discovery, the post-1990 transitions -- and write down in advance what each side predicts about it, so we can't move the goalposts later. And if part of the fight turns out to be about words rather than the world, say which part and why. Please don't send me a reading list or citations, I can't look anything up right now, I just want the document itself.
