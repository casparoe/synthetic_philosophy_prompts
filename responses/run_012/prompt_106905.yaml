          *   No preamble, don't restate constraints.
          *   Analysis must be explicit about which reading is which.
          *   Must argue that hingehood is a matter of practice/place, not property of proposition (so cannot stipulate hinge by fiat).
          *   Finish with strongest attack on the reading the case makes look worst.

  2.  **Drafting the Case:**
      *   *Need:* A proposition $p$.
      *   *Subject 1 (Hinge):* Treats $p$ as certain, foundational, not tested. But has good reasons for $p$.
      *   *Subject 2 (Hypothesis):* Treats $p$ as testable, revisable. Has same reasons.
      *   *Idea 1:* "I have hands." (Too classic Wittgenstein, hard to have "grounds" without it sounding like Moorean proof which Wittgenstein rejects).
      *   *Idea 2:* "The earth existed before I was born." (Good hinge, but grounds are tricky for ordinary person to articulate as "knowledge-level" without it sounding like memory/testimony).
      *   *Idea 3:* "This building is safe." (Context dependent).
      *   *Idea 4:* "My spouse is faithful." (Too emotional/personal).
      *   *Idea 5:* "The bridge is stable."
      *   *Let's try:* "The water from this tap is safe to drink."
          *   *Subject 1 (Local Resident):* Lives in a town with a known, historic water system. They never test the water before drinking. It's a hinge for their daily hydration practice. They *could* cite grounds (city reports, lack of sickness for years, infrastructure maintenance), but they don't use them to verify each drink.
          *   *Subject 2 (Water Inspector):* Same town, same water. They have the same reports, same history. But for them, it's a hypothesis. They test it daily. Its negation is a live option (contamination possible).
          *   *Critique:* Is the grounds *the same*? The resident relies on the system implicitly. The inspector relies on it explicitly. The grounds (reports, history) are available to both.
          *   *Refinement:* Let's make it about a specific tool or environment. "This scale is calibrated."
          *   *Subject 1 (Baker):* Uses the scale every day. Never checks calibration. It's the hinge for weighing flour. If the bread fails, she blames the yeast, not the scale. She *has* grounds (bought it new last year, never dropped it, supplier is reputable).
          *   *Subject 2 (Quality Control Technician):* Checks the scale daily. Same grounds (knows supplier, knows history), but for her, "The scale is calibrated" is the hypothesis being tested against weights.
          *   *Constraint Check:* Ordinary adult? Yes. Articulable grounds? Yes ("Bought it new, never dropped it"). Hinge vs. Hypothesis? Yes. Same grounds? Yes.
          *   *Drafting the paragraph:* Needs to be tight.

