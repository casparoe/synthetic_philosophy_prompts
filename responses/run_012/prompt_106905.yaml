answer: |-
  Elena begins every shift by weighing flour on her shop's digital scale, never checking its calibration because she treats "This scale is accurate" as a fixed point against which she judges her yeast or humidity, though if asked she cites valid grounds: she bought it certified last month, it sits on a stable counter, and it has never failed her. Marco is a quality control technician visiting the shop with the exact same information about the scale's purchase and stability, yet he places known weights on it to test "This scale is accurate," treating its negation as a live possibility requiring verification before he certifies the batch.

  **Walkthrough**

  **(a) The Arational Reading:** On this view (e.g., Moyal-Sharrock), hinges are not beliefs but enacted certainties; they are grammatical rules disguised as propositions. For Elena, the grounds she cites are epiphenomenal to her hinge status; her certainty is shown in her action (weighing without testing), not derived from her reasons. For Marco, the proposition is a genuine belief subject to evidence. This reading accepts the case comfortably: it explains the difference by categorizing Elena's state as non-epistemic and Marco's as epistemic, despite the shared articulable grounds. The grounds exist for Elena, but they do not *justify* the hinge; they are merely post-hoc rationalizations available within the language-game the hinge supports.

  **(b) The Entitlement Reading:** On this view (e.g., Wright), hinges are beliefs but warrant comes from a special non-evidential source (entitlement) rather than ordinary justification. For Elena, the grounds she cites are not the source of her warrant; she is entitled to trust the scale by default because inquiry requires it. For Marco, his warrant is evidential (derived from the weights). This reading accepts the case but must argue that Elena's articulable grounds are not doing the justificatory work; her entitlement is. It preserves the distinction by positing two types of warrant operating on the same proposition depending on the role.

  **(c) The Flat-footed Epistemic Reading:** On this view, hinges are simply beliefs with very high evidential support; there is no categorical difference, only a gradient of confidence. This reading struggles to accept the case as described. If Elena and Marco have the *same* grounds, reliability, and stakes, this reading implies they should have the *same* epistemic status. If the status is the same, Elena's refusal to test looks like irrational dogmatism, or Marco's testing looks like wasteful skepticism. To save itself, this reading must deny the stipulation: it must claim Elena's grounds are actually stronger (perhaps she has hidden background evidence) or that her "hinge" status is just a description of her high confidence, not a functional difference. It cannot easily accommodate the "same grounds, different role" split without collapsing the role difference into a difference in evidence.

  **Feature Doing the Work**
  The work is done by the fact that the **same grounds get a different treatment** across the two subjects. If it were merely the presence of grounds, Marco would also be a hinge holder. If it were merely the role, we would have a standard hinge case without the tension of articulable support. The case isolates the variable by holding evidence constant and varying the pragmatic function, demonstrating that evidential support does not determine hinge status.

  **Strip the Grounds**
  If you strip Elena's articulable grounds (she trusts the scale but has no reasons to cite), the case collapses into ordinary hinge examples (e.g., *On Certainty* §400, "I know that this is my hand"). The three readings still debate those cases, but the specific tension you are targeting—whether high justification *makes* a hinge or whether role does—disappears. Without the grounds, the Flat-footed reading can simply say Elena has unconscious evidence, and the debate reverts to standard skepticism vs. contextualism rather than the specific separation of support and role.

  **Strongest Attack**
  The strongest attack comes from the **Flat-footed Epistemic Reading**. The defender argues the case is **incoherent**: "If Elena has knowledge-level justification, she is rationally required to acknowledge fallibility. If she treats the proposition as immune to testing (a hinge), she is being dogmatic, not rational. Therefore, she does not *actually* have knowledge-level justification in that context; you have stipulated a contradiction. Grounds *dictate* role: if the grounds are sufficient for knowledge, the proposition cannot be a hinge; if it is a hinge, the grounds are not functioning as justification."

  **Does it land?**
  Superficially, yes, but ultimately no. It lands only if one begs the question by assuming that all rational commitment must be proportioned to evidence (a Cliffordian principle Wittgenstein rejects). It fails because it misses the transcendental point of the case: the grounds are only available *within* the practice where the hinge is fixed. Elena's grounds are valid *because* the scale is a hinge in her practice, not vice versa. The attack assumes the epistemic status precedes the practice, whereas the case is designed to show the practice determines the status.
