      *   *Attack Premise 2:* Does GR settle metaphysics? Is there a preferred frame hidden in the physics (e.g., CMB, Quantum Mechanics)?
      *   *Attack Premise 3:* Is Gödel's universe physically possible? (Rotation, CTCs, stability).
