answer: |-
  The rule you have discovered is a well-known concept in cooperative game theory and bargaining theory. It is called the **Kalai–Smorodinsky Solution** (sometimes abbreviated as the **KS Solution**).

  It was proposed by Ehud Kalai and Meir Smorodinsky in their 1975 paper *"Other Solutions to Nash's Bargaining Problem."*

  Here is a precise breakdown of how it works, how it differs from the Nash Bargaining Solution (the "product rule"), and the answers to your specific questions about efficiency, generalization, and boundaries.

  ### 1. The Formal Definition
  Let $S$ be the set of feasible utility agreements (the "pie"), and let $d = (d_1, d_2)$ be the **disagreement point** (what happens if negotiations fail, i.e., your fallback/outside option).

  First, you calculate the **Ideal Point** (or Utopia Point), $b = (b_1, b_2)$, where:
  $$b_i = \max \{ u_i : (u_1, u_2) \in S \text{ and } u_j \ge d_j \}$$
  This is exactly what you described: "the best each side could possibly get if the other side went along" (technically, the best they can get consistent with the other person getting at least their disagreement payoff).

  The Kalai–Smorodinsky solution is the unique point $u^* = (u_1^*, u_2^*)$ on the Pareto frontier of $S$ such that:
  $$ \frac{u_1^* - d_1}{b_1 - d_1} = \frac{u_2^* - d_2}{b_2 - d_2} $$
  In words: **The ratio of actual gain to maximum possible gain is equal for all players.**

  ### 2. Comparison with Other Rules

  #### Vs. Equal Split (Equal Gain)
  *   **Equal Split:** Maximizes equality of absolute gains ($u_1 - d_1 = u_2 - d_2$).
  *   **Kalai–Smorodinsky:** Maximizes equality of *relative* gains.
  *   **Difference:** If Player 1 has a much higher potential ceiling ($b_1$) than Player 2 ($b_2$), Equal Split gives them the same dollar amount. KS gives Player 1 more dollars, such that they feel they are getting the same "percentage of their potential" as Player 2.

  #### Vs. Nash Bargaining Solution (The Product Rule)
  *   **Nash:** Maximizes $(u_1 - d_1)(u_2 - d_2)$.
  *   **Key Axiom Difference:**
      *   **Nash** satisfies **Independence of Irrelevant Alternatives (IIA)**. If you remove outcomes from the feasible set $S$ that are *not* the solution, the solution doesn't change. Crucially, this means Nash ignores the *shape* of the frontier away from the solution point. If Player 2's ideal point ($b_2$) increases (the set expands upward), but the tangent point doesn't move, Player 1's payoff stays exactly the same.
      *   **Kalai–Smorodinsky** satisfies **Individual Monotonicity**. If the feasible set expands in a way that increases Player 2's ideal point (without hurting Player 1's ideal point), Player 1's payoff *must not decrease*. In fact, to maintain the equal ratio, Player 1's payoff usually increases.
  *   **Your Intuition:** You noted that under the product rule, "if your outside option improves, my share can actually go down."
      *   *Clarification:* If you mean **Disagreement Point ($d$)**: Both Nash and KS will reduce Player 1's share if Player 2's fallback improves.
      *   If you mean **Best Case ($b$)**: You are correct that KS handles this differently. Under Nash, if Player 2's *potential* ($b_2$) grows, Player 1's share might stay static (due to IIA). Under KS, Player 1's share increases to maintain the equal fraction ratio. This is often viewed as "fairer" in contexts where bargaining power is linked to potential.

  ### 3. Efficiency (Pareto Optimality)
  **Yes, the rule yields an efficient outcome.**
  By definition, the KS solution is found by drawing a line from the disagreement point $d$ to the ideal point $b$ and finding the **furthest** point along that line that is still inside the feasible set $S$. Because you push $\lambda$ (the fraction) as high as possible until you hit the boundary, the resulting point lies on the Pareto frontier. You cannot make one person better off without making the other worse off.

  ### 4. Assumptions and Boundaries

  #### The Disagreement Point
  Like Nash, KS requires a well-defined disagreement point $d$. If $d$ is ambiguous, the solution is undefined. However, KS is often considered more robust intuitively because it acknowledges the *range* of possibility ($b - d$), not just the local geometry at the solution.

  #### Convexity
  *   **Convex Sets:** If the feasible set $S$ is convex (a "nice blob"), the solution is unique and well-behaved.
  *   **Non-Convex Sets:** If $S$ is non-convex, the line from $d$ to $b$ might intersect the boundary multiple times. The standard definition selects the **Pareto-optimal intersection** (the furthest one). However, without convexity, some of the nice axiomatic guarantees (like uniqueness in certain variations) can become fragile, though the geometric rule remains well-defined.

  #### Sensitivity to "Utopia"
  The main critique of KS is that it depends on the Ideal Point $b$, which is often an outcome that is **not jointly feasible**. (i.e., You can't actually get $(b_1, b_2)$ simultaneously). Critics argue that bargaining should only depend on feasible outcomes (which is why Nash satisfies IIA). KS violates IIA because it cares about infeasible "utopia" points.

  ### 5. Generalization to $n > 2$ Parties
  **Yes, it generalizes perfectly.**
  For $n$ players, you calculate the ideal point $b_i$ for each player. The solution is the point $u^*$ on the Pareto frontier such that:
  $$ \frac{u_1 - d_1}{b_1 - d_1} = \frac{u_2 - d_2}{b_2 - d_2} = \dots = \frac{u_n - d_n}{b_n - d_n} $$
  You simply find the common fraction $\lambda$ that allows all players to achieve that proportion of their maximum gain simultaneously.

  In your three-person example: You do **not** ratio to a joint max. You ratio to **each person's own max**. If Player A can get at most 100, Player B at most 50, and Player C at most 20, the KS solution finds an outcome where A gets $x\%$ of 100, B gets $x\%$ of 50, and C gets $x\%$ of 20, for the highest possible $x$.

  ### Summary Table

  | Feature | Equal Split | Nash Bargaining (Product) | Kalai–Smorodinsky (Your Rule) |
  | :--- | :--- | :--- | :--- |
  | **Mathematical Goal** | $u_1 - d_1 = u_2 - d_2$ | $\max (u_1 - d_1)(u_2 - d_2)$ | $\frac{u_1 - d_1}{b_1 - d_1} = \frac{u_2 - d_2}{b_2 - d_2}$ |
  | **Fairness Concept** | Absolute Equality | Proportional to marginal contribution | Equal Relative Satisfaction |
  | **Key Axiom** | Symmetry | Independence of Irrelevant Alternatives (IIA) | **Individual Monotonicity** |
  | **Sensitivity to $b_i$** | No | No (violates Monotonicity) | **Yes** (satisfies Monotonicity) |
  | **Efficiency** | Yes | Yes | Yes |
  | **N-Player Generalization**| Trivial | Trivial | Trivial |

  ### Conclusion
  You have independently rediscovered the **Kalai–Smorodinsky Solution**. It is a respected alternative to the Nash Bargaining Solution, specifically designed to fix the counter-intuitive result where a player's payoff doesn't improve even when their potential bargaining range expands (a violation of Individual Monotonicity). It is well-defined for $n$-players, guarantees efficiency, but relies heavily on the definition of the "best possible" (ideal) points, which must be calculated based on the feasible set.
