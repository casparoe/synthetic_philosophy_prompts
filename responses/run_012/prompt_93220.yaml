      *   *Hayek:* Focus on *state availability*. The "knowledge of time and place" is local state that cannot be serialized without loss. Prices are not just data; they are *signals* that trigger state changes. It's about the *cost of communication* vs. *local processing*.
      *   *Lange:* Focus on *architecture*. Central Planning Board = Parameter Server. Firms = Edge nodes. Tâtonnement = Federated Learning loop? But Lange assumes the objective function is known and static.
      *   *Computers (Lange 1967):* Solving the Walrasian equations. This is linear programming. But is the system linear? Is the data static?

  5.  **Developing the Residue Report:**

