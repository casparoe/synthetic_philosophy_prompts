      *   *Correction:* Lange's computer isn't just a faster calculator; it's a claim about *computational complexity class*. I need to mention that.
      *   *Correction:* Mises isn't just about data; it's about *property rights as a locking mechanism*. Without locks, you have race conditions on capital goods.

  9.  **Final Polish:** Check the "Residue" section to ensure it answers the user's specific worry about "collapsing two problems." The two problems are likely *Optimization* (Lange/Mises) vs. *Coordination/Discovery* (Hayek).

  *(Self-Correction on "Authority"):* The prompt asks about "who holds the authority to decide." In CS, this is the "Root" or "Admin" who defines the objective function. In Politics, this is the Sovereign. This is a crucial mapping.

