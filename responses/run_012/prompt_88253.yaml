prompt: |-
  I write the "how this happened" section of short policy briefs — our shop turns out a two- or three-page lessons-from-history memo for incoming officials every couple of weeks, 800 words of actual text, no footnotes, and a section at the end that is supposed to explain why the episode in question went the way it did. I've been doing this about a year and I keep getting the same two complaints back from the academic historians we send drafts to. If I pick a single cause and build the paragraph around it — it was the drought, it was the bankers, it was one minister's decision — they say I've flattened an episode with half a dozen moving parts, and that the cause I named was on its own neither necessary nor sufficient. If I do the opposite and write "a confluence of factors" followed by eight bullet points, they say a list isn't an explanation and I've said nothing. A collegue of mine who did a philosophy degree told me the word for my problem is overdetermination, and that what I want to be able to write is something called an INUS condition, but when I looked both up I couldn't get from the definitions to a single sentence I'd actually put in a brief. I have about a day and a half per brief, I'm working from a stack of secondary sources and two or three interviews, and I hand the draft to our research director, who will ask me "so what actually caused it?" and will not accept a shrug.

  What I'd like is a procedure I can run in that day and a half — the steps in order, what counts as a good enough answer at each step, the point where the procedure stops and I have to make a call myself, and an honest note on which of the steps are really just me exercising judgment with a flowchart drawn around them. I'd also like a rule for that last paragraph: how many causes a reader can hold, whether to lead with the remote ones or the immediate one, how to tell a cause from a mere background condition, and what to do when two or three causes were each by itself enough that removing one of them wouldn't have changed the outcome — because that seems to be exactly the case the historians are complaining about, and it's the case I can't write. Please don't send me a reading list; I won't read it, and I need the thing itself. Tell me plainly what the procedure can't do. Then run it on the two cases below and flag anywhere it gives me an answer I won't like.

  Case one is our own mess. A pilot program we ran with a partner organization to get low-income households signed up for a benefit went badly: enrollment came in at a third of what we projected, the households who did sign up were mostly ones already connected to services, and the partner pulled out eight months in. The candidate causes in my notes are: we picked a city where the benefit was already heavily advertised; the partner's director left four months in; our sign-up form ran to eleven pages; we launched in late August; the funding formula paid the partner per enrollment, which made it rational for them to enroll the easiest households first; we changed the evaluation design halfway through; and a rival organization launched a similar program in the same city two months after us. Case two is a historical one we reuse constantly, the 2008 financial crisis, where my candidate list is subprime and predatory lending, the shift to originating loans in order to sell them on, the ratings agencies, leverage at the big banks, low interest rates and the global savings glut, the housing bubble itself, the incentive structure of Wall Street pay, and fragmented regulators. On the first case I suspect the honest answer is that our own design did it and the partner was behaving rationally, which is not something my director will enjoy reading, so if the procedure can reach that conclusion it should be able to say so out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and the Problem:**
      *   **User Role:** Writer of "how this happened" sections for short policy briefs (800 words total, 2-3 pages).
      *   **Audience:** Incoming officials (need clarity, actionable insights) and Academic Historians (reviewers who hate simplification but also hate lists).
      *   **Constraint:** 1.5 days per brief. Secondary sources + 2-3 interviews. No footnotes.
      *   **The Conflict:**
          *   Option A (Single Cause): Historians say "too simplistic, not necessary/sufficient."
          *   Option B (List of Factors): Historians say "not an explanation, just a list."
          *   Director's Demand: "So what actually caused it?" (No shrugging).
      *   **Philosophical Context:** User knows terms like "overdetermination" and "INUS condition" (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) but can't translate them into prose.
      *   **The Ask:** A concrete *procedure* (steps, stop points, judgment calls), a rule for the final paragraph (structure, prioritization), honesty about limitations, and an application of the procedure to two specific cases (Internal Pilot Program & 2008 Financial Crisis).
      *   **Specific Constraint:** "Don't send me a reading list... Tell me plainly what the procedure can't do."

  2.  **Deconstruct the Philosophical/ Historiographical Problem:**
      *   The user is stuck between *monocausality* (bad history) and *multicausality without hierarchy* (bad explanation).
      *   The solution isn't finding the *one true cause* (because it doesn't exist in complex systems), but finding the *leverage point* or the *distinguishing factor*.
      *   *INUS Condition:* This is actually the key. An INUS condition is a specific part of a specific combination that caused the outcome. But for a policy brief, we need something more pragmatic: **The Trigger vs. The Tinder vs. The Spark.**
      *   *Overdetermination:* When multiple causes are each sufficient on their own. This is the hard case. The way out is to ask: "Which cause made the difference *in this specific instance* compared to a counterfactual?" or "Which cause is actionable?"

  3.  **Develop the Procedure (The "Causal Triage" Protocol):**
      *   *Goal:* Move from a list of candidates to a narrative hierarchy within 1.5 days.
      *   *Step 1: The Counterfactual Test (Necessity).* If X didn't happen, would Y still have happened? If yes, X is background. If no, X is a candidate.
      *   *Step 2: The Variance Test (Differentiation).* Why did this happen *here/now* and not *there/then*? This isolates the variable that changed.
      *   *Step 3: The Mechanism Test (Proximity).* How did the cause actually touch the outcome? (Connects abstract factors to concrete events).
      *   *Step 4: The Actionability Filter (Policy Relevance).* Since this is a policy brief, the "cause" should ideally be something a policymaker can influence or watch for.
      *   *Stop Rule:* When you have 1 Primary Driver + 2 Enabling Conditions.
      *   *Honesty Check:* Acknowledge where judgment overrides evidence.

  4.  **Develop the Writing Rule (The Final Paragraph):**
      *   *Structure:* "The outcome was not inevitable, but it became likely when [Primary Driver] interacted with [Enabling Condition 1] and [Enabling Condition 2]."
      *   *Order:* Lead with the *change* (the trigger), follow with the *context* (the tinder).
      *   *Handling Overdetermination:* Acknowledge sufficiency but prioritize *timing* or *fragility*. "While X or Y alone might have eventually caused Z, X was the factor that broke the system *when it did*."
      *   *Word Count:* Keep it tight. 150 words max for this section.

  5.  **Apply Procedure to Case 1 (Internal Pilot Program):**
      *   *Candidates:* City ad saturation, Director turnover, 11-page form, August launch, Per-enrollment funding, Evaluation change, Rival program.
      *   *Step 1 (Counterfactual):* If form was 2 pages, would enrollment be higher? Likely yes. If funding was flat fee, would they cherry-pick? No.
      *   *Step 2 (Variance):* Why did *this* pilot fail when others succeed? The funding model + form length seem unique to this design.
      *   *Step 3 (Mechanism):* Funding model -> Partner behavior (cherry-picking) -> Low numbers. Form length -> Drop-off.
      *   *Step 4 (Actionability):* We control the form and funding. We don't control the Director leaving (maybe) or Rivals.
      *   *Conclusion:* Design flaws (Funding + Form) caused partner behavior + user drop-off.
      *   *Uncomfortable Truth:* Yes, it confirms the user's suspicion. The procedure validates "Our design did it."

  6.  **Apply Procedure to Case 2 (2008 Financial Crisis):**
      *   *Candidates:* Subprime, Originate-to-distribute, Ratings, Leverage, Interest Rates, Housing Bubble, Pay Incentives, Regulators.
      *   *Step 1 (Counterfactual):* Low rates alone? No (90s had low rates, no crash). Ratings alone? No.
      *   *Step 2 (Variance):* What was different in 2008 vs 1998? Securitization chain (Originate-to-distribute) + Leverage.
      *   *Step 3 (Mechanism):* Incentives -> Bad Loans -> Securitization hid risk -> Leverage amplified collapse.
      *   *Step 4 (Actionability):* Regulation & Incentives.
      *   *Conclusion:* The *interaction* of misaligned incentives (pay/origination) and opacity (ratings/securitization) turned a housing correction into a systemic collapse.
      *   *Uncomfortable Truth:* It avoids blaming just "greed" or just "regulators." It forces a systemic explanation that might be too nuanced for a "blame someone" directive.

  7.  **Refine the Output:**
      *   *Tone:* Direct, professional, slightly weary (matching the user's vibe), no fluff.
      *   *Formatting:* Clear steps, bold text for emphasis.
      *   *Addressing the "INUS" issue:* Translate it into "The Trigger vs. The Tinder."
      *   *Addressing the "Overdetermination" issue:* Explain how to write around it (focus on timing/sequence).
      *   *Limitations:* Be clear that this doesn't find "Truth," it finds "Utility."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give a reading list? No.
      *   *Check:* Did I answer the specific constraints (1.5 days, 800 words total)? Yes, the procedure is designed for speed.
      *   *Check:* Did I address the "Overdetermination" complaint from historians? Yes, by focusing on the *combination* rather than the list.
      *   *Check:* Is the advice on the final paragraph specific? Yes, the "Trigger + Tinder" model.
      *   *Check:* Did I run the cases? Yes.
      *   *Check:* Did I flag the uncomfortable answers? Yes, specifically for Case 1.

  9.  **Final Polish:** Ensure the distinction between "Background Condition" and "Cause" is clear. (Background = always there; Cause = changed). Ensure the "Overdetermination" advice is practical (pick the one that happened *first* or is most *actionable*).

  *(Self-Correction on Case 2)*: Be careful not to just repeat standard history. The user says they "reuse constantly" this case. The value add is showing how the *procedure* handles the complexity, not necessarily solving 2008 anew. Focus on how the procedure selects from the list provided.

  *(Self-Correction on Case 1)*: The user suspects the answer is "our design." I need to make sure the procedure leads there logically so the Director can't argue it's just "opinion."

  *(Final thought on "INUS")*: Don't use the jargon. Use "The Match, The Fuel, The Oxygen." It's the same concept but writable.

