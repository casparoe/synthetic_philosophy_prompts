answer: |-
  Here is the procedure, the writing rule, the limitations, and the application to your cases.

  ### The Procedure: Causal Triage (90 Minutes Max)

  Do not start writing the paragraph until you have completed these four steps on a scratch pad. This converts "overdetermination" into a hierarchy.

  **Step 1: The Constant vs. Variable Test (Background vs. Cause)**
  *   **Action:** Look at your candidate list. Ask: "Was this factor present in similar situations where the outcome *did not* happen?"
  *   **Pass:** If the factor was present when things went *well*, it is a **Background Condition**. Move it to the second sentence of your paragraph.
  *   **Fail:** If the factor was unique to this failure, it is a **Candidate Cause**. Keep it.
  *   *Judgment Call:* You are deciding what counts as a "similar situation." Be consistent.

  **Step 2: The Counterfactual Snip (Necessity)**
  *   **Action:** Take the remaining Candidate Causes. Mentally remove *one* at a time. Ask: "If I snip this wire, does the explosion still happen?"
  *   **Pass:** If the explosion still happens (because another cause was sufficient), mark it **Redundant**.
  *   **Fail:** If the explosion is prevented or significantly delayed, mark it **Necessary**.
  *   *Judgment Call:* "Significantly delayed" counts as prevention for policy purposes. If the crisis happens 5 years later, you bought time. That counts.

  **Step 3: The Mechanism Link (Proximity)**
  *   **Action:** For the Necessary causes, draw an arrow to the outcome. Can you describe the *physical or bureaucratic step* between the cause and the effect without using abstract nouns (e.g., "instability," "climate")?
  *   **Pass:** "The 11-page form caused users to drop off at page 4." (Keep).
  *   **Fail:** "The funding formula created a climate of distrust." (Discard or demote to Background).
  *   *Judgment Call:* You are prioritizing tangible links over theoretical ones to satisfy the Director's "what actually happened" demand.

  **Step 4: The Actionability Filter (Policy Relevance)**
  *   **Action:** Of the remaining Necessary causes, which one could an incoming official actually change or monitor?
  *   **Selection:** Pick **One Primary Driver** (the thing they can fix) and **Two Enabling Conditions** (the context that made the driver lethal).
  *   **Stop Rule:** Once you have 1 Driver + 2 Conditions, stop. Do not add more.

  **What This Procedure Cannot Do:**
  1.  **It cannot find Truth:** It finds *utility*. It selects the cause that is most useful for a policymaker to know, not necessarily the most philosophically robust.
  2.  **It cannot resolve true Overdetermination:** If Cause A and Cause B were both independently sufficient and happened simultaneously, this procedure forces you to pick the one that is *actionable*. This is a rhetorical choice, not a historical one.
  3.  **It cannot satisfy a Historian who believes in Complexity:** If a historian insists that "everything is connected," this procedure will still force you to cut connections. You are writing a brief, not a dissertation.

  ***

  ### The Writing Rule: "The Match, The Fuel, The Oxygen"

  Your final paragraph must be 3–4 sentences. Do not use bullet points. Use this syntax:

  1.  **Sentence 1 (The Outcome + The Match):** State the outcome and identify the **Primary Driver** (the variable that changed).
  2.  **Sentence 2 (The Fuel + The Oxygen):** Acknowledge the **Enabling Conditions** (the background factors that made the driver lethal).
  3.  **Sentence 3 (The Interaction):** Explain how the Driver interacted with the Conditions to produce the specific timing or severity.
  4.  **Sentence 4 (The Lesson):** State what this implies for future action.

  **Handling Overdetermination in Prose:**
  If you have two sufficient causes (A and B), do not say "A and B caused it." Say: "While [Condition B] created vulnerability, it was [Driver A] that triggered the collapse." You are prioritizing *timing* and *trigger* over *sufficiency*.

  **Cause vs. Background:**
  *   **Cause:** Changed shortly before the event (The Match).
  *   **Background:** Existed for a long time prior (The Fuel).
  *   **Rule:** Lead with the Cause. Bury the Background in the middle.

  ***

  ### Application to Case 1: The Pilot Program

  **Running the Procedure:**
  *   **Step 1 (Constant vs. Variable):**
      *   *Constant:* City advertising (benefits usually advertised), Rival program (competition is normal), Late August (launches happen then). -> **Background.**
      *   *Variable:* 11-page form (usually shorter), Per-enrollment funding (usually flat grant), Evaluation change (usually static), Director left (usually stable). -> **Candidates.**
  *   **Step 2 (Counterfactual Snip):**
      *   If form was 2 pages: Enrollment likely higher. (Necessary).
      *   If funding was flat fee: Partner wouldn't cherry-pick. (Necessary).
      *   If Director stayed: Maybe better management, but incentives remain. (Redundant/Secondary).
      *   If Evaluation static: Confusing, but doesn't stop sign-ups. (Redundant).
  *   **Step 3 (Mechanism Link):**
      *   Funding Formula -> Partner cherry-picks easy cases -> Low total volume. (Strong link).
      *   11-page form -> User drop-off -> Low total volume. (Strong link).
  *   **Step 4 (Actionability):**
      *   You control the Form and the Funding. You do not control the Director or the Rival.
      *   **Selection:** Primary Driver = **Funding Formula** (drove partner behavior). Enabling Conditions = **Form Length** (drove user behavior) + **Market Saturation** (limited pool).

  **The Uncomfortable Answer:**
  The procedure confirms your suspicion. The partner acted rationally based on the incentives you wrote.

  **Drafting the Paragraph (Using the Rule):**
  > "The pilot failed to meet enrollment targets primarily because the per-enrollment funding formula incentivized the partner to prioritize easy-to-serve households over broad outreach. This incentive structure interacted with an eleven-page sign-up form that deterred new applicants, leaving the partner to rely on an existing client base that was too small to meet projections. While market saturation in the chosen city limited the total available pool, the design choices regarding payment and paperwork turned a manageable risk into a structural failure. Future partnerships must align payment milestones with outreach efforts rather than completed enrollments."

  **Flagged Issue:**
  Your Director will not like Sentence 1. It explicitly states *your shop* designed the failure. The procedure forces this out because it is the only *actionable* cause. If you hide this, the historians will call it "flattened," and the lesson will be wrong.

  ***

  ### Application to Case 2: The 2008 Financial Crisis

  **Running the Procedure:**
  *   **Step 1 (Constant vs. Variable):**
      *   *Constant:* Low interest rates (happened in 90s), Housing bubble (happened in 80s), Wall Street pay (always greedy). -> **Background.**
      *   *Variable:* Originate-to-sell model (shifted risk), Ratings agencies (conflict of interest new scale), Leverage (higher than before), Fragmented regulators (deregulation specific to era). -> **Candidates.**
  *   **Step 2 (Counterfactual Snip):**
      *   If no subprime: Crisis delayed/avoided. (Necessary).
      *   If no securitization (originate-to-sell): Banks hold risk, lend stricter. (Necessary).
      *   If no leverage: Losses absorbed. (Necessary).
      *   *Note:* This is a classic Overdetermination case. All three are necessary for the *scale* of the crash.
  *   **Step 3 (Mechanism Link):**
      *   Originate-to-sell -> Banks stopped caring about loan quality. (Strong).
      *   Ratings -> Investors bought toxic assets thinking they were safe. (Strong).
      *   Leverage -> Small losses wiped out equity. (Strong).
  *   **Step 4 (Actionability):**
      *   Primary Driver: **Originate-to-distribute model** (changed the incentive).
      *   Enabling Conditions: **Credit Rating Agencies** (masked the risk) + **High Leverage** (amplified the loss).

  **The Uncomfortable Answer:**
  The procedure avoids blaming "greed" (Background) or "deregulation" (Background) and pins it on the *mechanism* of risk transfer. This is historically defensible but politically dry.

  **Drafting the Paragraph (Using the Rule):**
  > "The 2008 crisis was triggered not by the housing correction itself, but by the 'originate-to-distribute' model that allowed lenders to offload risk while retaining fees. This separation of risk from reward interacted with credit rating agencies that mislabeled toxic assets as safe, and excessive leverage that magnified losses across the banking system. While low interest rates and global capital flows created the fuel for a bubble, it was the securitization chain that ensured the collapse would become systemic rather than contained. Regulation must therefore focus on risk retention requirements rather than just capital reserves."

  **Flagged Issue:**
  Historians may complain that "Originate-to-distribute" is too technical a single driver for such a massive event. However, it satisfies the Director's "what actually caused it" better than "a confluence of factors." The procedure sacrifices some historical nuance to gain explanatory power. If you try to include "global savings glut" as a primary driver, you lose the ability to write a policy lesson (the US cannot regulate global savings). The procedure forces you to pick the cause you can actually write a policy about.
