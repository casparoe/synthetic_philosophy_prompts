answer: |-
  The evidentiary and contact accounts offer competing explanations for the privilege accorded to original artworks. The former treats the original as a superior data source regarding artistic choices, while the latter treats it as a physical relic of the artist's agency. Comparing them reveals significant differences in how they handle replication, history, and metaphysical value.

  Regarding the intuition that a perceptually perfect forgery is worth less than the original, the contact account offers a superior explanation. The mechanism here is historical causality: the original is the specific object that emerged from the artist's creative act, whereas the forgery, despite matching visible properties, originates from a different causal chain (the forger's hand). The contact account generates the intuition that value is lost because the relational link to the creator is severed. The evidentiary account struggles to generate this intuition. Since the forgery preserves every visible property and its creation is fully documented, the epistemic content regarding the artist's choices is theoretically preserved or even enhanced by the documentation of the forgery's production. If value is merely information, the forgery should be equal in value. The evidentiary account cannot explain the devaluation of the forgery without abandoning its core premise that value is transferable information.

  Consider the case of the self-forgery, where the artist copies their own work decades later. The contact account entails that this object has less value than the original regarding the status of the work. This is because the later copy is the terminus of a *new* agency, distinct from the original creative moment. It is a reproduction, not the original genesis. This result is acceptable. It aligns with the understanding that artistic value is often tied to the specific historical moment of innovation and execution, not merely the biological identity of the maker. The evidentiary account might imply equal value if the information content is identical, or less value if the later copy fails to reveal the original decision-making process. However, the contact account's insistence on the specific historical instance provides a clearer rationale for why we prize the first instantiation over the second, even by the same hand.

  Are the two accounts genuinely distinct? Yes, the contact account does not collapse into the evidentiary account. To argue otherwise is to confuse the *trace* of an event with the *event* itself. The evidentiary account values the original because it yields facts (epistemic); the contact account values it because it bears a relational property (ontological). Even if a hologram provided perfect information about the brushstrokes (maximizing evidentiary value), the contact account maintains the physical canvas holds unique value because it was the actual surface touched by the artist. "Contact" adds the dimension of historical participation rather than mere knowledge availability. If contact were merely evidence, it would be transferable like data. Because the contact account insists the value is non-transferable, it posits a category of value distinct from information.

  Finally, the contact account is more vulnerable to the charge that it merely dresses up a taste for authenticity as a theory of value. The evidentiary account attempts to ground value in utility—the acquisition of knowledge—which offers a functional justification independent of mere preference. The contact account, by contrast, posits that the causal connection itself is valuable regardless of what is learned from it. This looks suspiciously like a secularized version of relic worship, where the "aura" of the object is fetishized without external justification. It theorizes the intuition of authenticity rather than justifying it through independent goods like knowledge or utility. While the evidentiary account may fail to explain certain intuitions, the contact account risks circularity by defining value as the very authenticity it seeks to explain.

  Verdict: contact
  The contact account ultimately prevails because it alone respects the historical specificity that defines our actual engagement with art, whereas the evidentiary account reduces the artwork to mere data.
