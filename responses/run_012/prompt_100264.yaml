prompt: |-
  My mom is retiring after 25 years running a scrappy community health clinic, and I'm giving the toast at her dinner. Here's the wrinkle: two years ago the clinic started a program for prolonged grief — grief that just won't lift — treating it as a condition in its own right, not as depression and not as something you're meant to simply endure. Half the room will be her staff and former patients, who want to hear it defended; the other half are two philosophers of medicine who've publicly called this medicalizing a normal human experience. Write me a five-minute toast that actually walks into the naturalism-vs-normativism mess: is calling something a disease a matter of locating a biological malfunction, or is it always us drawing a value-laden line? It can't pretend the question is settled, and it can't dodge it either — she has to commit to something about what the clinic was actually doing when it decided grief that won't lift is treatable. Make the 'why not just call it depression' point do real work, since that's the part her critics jump on. And it still has to land as a toast — warm, personal, a little funny, not a seminar. Please don't just trot out the standard Boorse-vs-Wakefield summary; I've read that. She lost my dad twelve years ago and was basically told to give it time, so that's sitting in the background if it helps.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for Mom (25 years running a community health clinic).
      *   **Speaker:** Her child (me).
      *   **Audience:** Mixed bag. 50% staff/former patients (supportive of the clinic's work), 50% two philosophers of medicine (critics of the "prolonged grief" diagnosis as medicalization).
      *   **Key Topic:** The clinic's program for "prolonged grief" (treating it as a distinct condition, not depression, not just endurance).
      *   **The "Wrinkle":** Must address the naturalism-vs-normativism debate (is disease biological malfunction or value-laden line-drawing?) without being a dry seminar. Must commit to a stance on what the clinic was doing.
      *   **Specific Constraint:** Address "why not just call it depression?" (a key criticism).
      *   **Tone:** Warm, personal, funny, but intellectually honest. Not a standard Boorse-vs-Wakefield summary.
      *   **Background:** Mom lost Dad 12 years ago and was told to "give it time."
      *   **Length:** ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Determine the Core Argument/Stance:**
      *   The prompt asks me to *commit* to something about what the clinic was doing.
      *   *Option A (Pure Naturalism):* Grief causes biological changes. (Too reductive, ignores the philosophers' point).
      *   *Option B (Pure Normativism):* We just decided suffering is bad, so we made it a disease. (Too dismissive of the patients' reality).
      *   *Option C (The Middle Path/Pragmatism):* Medicine isn't just fixing broken parts; it's relieving suffering that traps people. The "line" is drawn based on *function* and *hope*, not just chemistry. The clinic treated the *stuckness*, not the sadness.
      *   *Decision:* Go with Option C. Acknowledge the philosophers are right that it's value-laden, but argue that the *value* is restoring agency, not pathologizing love. Address the depression distinction by focusing on the *object* of the pain (depression is often objectless/anhedonia; prolonged grief is pain *attached* to a specific absence).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Warm up the room. Acknowledge the retirement. Mention the 25 years. Light joke about the clinic's "scrappy" nature (cardboard signs, etc.).
      *   **The Pivot:** Introduce the controversial program (prolonged grief). Acknowledge the elephants in the room (the philosophers).
      *   **The Philosophical Meat (The "Walk Into the Mess"):**
          *   Don't use jargon like "naturalism." Use plain English.
          *   Address the "medicalizing normal experience" critique.
          *   Bring in the personal element (Dad).
          *   Make the commitment: The clinic wasn't curing grief; they were treating the *impossibility* of moving.
      *   **The Depression Distinction:** Why not depression? Depression says "nothing matters." Grief says "only *one* thing matters and it's gone." Treatment differs.
      *   **The Commitment:** What was the clinic doing? They were drawing a line based on *suffering that denies a future*, not biology. Admit it's a value judgment, but a necessary one.
      *   **Closing:** Bring it back to Mom. Her legacy. Raise a glass.

  4.  **Drafting - Refining the Tone:**
      *   *Check:* Is it too academic? *Fix:* Use metaphors (the "line," the "map"). Keep sentences punchy.
      *   *Check:* Is it too sad? *Fix:* Inject humor about the clinic's budget or Mom's stubbornness.
      *   *Check:* Does it honor the philosophers? *Fix:* Don't dismiss them. Acknowledge their warning is valid, but explain why Mom took the risk anyway.

  5.  **Drafting - Writing the Content (Iterative Process):**
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm lecturing the philosophers. I need to speak *to* them while speaking *about* Mom.
      *   *Key Phrase:* "We didn't pathologize the love. We pathologized the trap."
      *   *Personal Touch:* Mention Dad. 12 years. "Give it time" was unhelpful advice.
      *   *The "Commitment":* Explicitly state that yes, drawing the line is normative. It's about what we owe each other.

  6.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~800 words).
      *   Address Naturalism/Normativism? (Yes, framed as "broken biology" vs. "drawn lines").
      *   Address Depression distinction? (Yes, "nothing matters" vs. "one thing matters").
      *   Warm/Personal? (Yes, starts and ends with Mom).
      *   No Boorse/Wakefield name-dropping? (Checked).

  7.  **Final Polish:** Check rhythm and flow. Ensure the transition from the heavy philosophy back to the celebratory toast is smooth. (The ending needs to lift the mood).

  *(Self-Correction Note)*: Make sure the philosophers feel seen, not attacked. They care about medicine's integrity. Mom cares about patients' suffering. Find the common ground: preventing harm.

  8.  **Final Word Count Check:** Aiming for roughly 130-150 words per minute for a 5-minute speech. So roughly 750-850 words.

