answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name], and I have the distinct privilege of being the person who inherited my mother's stubbornness and half her height.

  Twenty-five years ago, Mom opened this clinic. "Scrappy" is a polite word for it. I remember when the roof leaked in the waiting room; she put out buckets and told the patients to aim for the dry spots. But she kept the doors open. She believed that if you were hurting, you deserved a place to go where the lights were on.

  Tonight is a celebration of that. But I know we're also navigating a specific current in the room. We have half the room who found refuge here when the world told them to "just move on," and we have two distinguished philosophers of medicine [nod to them] who have wisely warned us about turning human suffering into checklists for insurance codes.

  I'm not going to stand here and pretend my mother solved the philosophy of medicine between patient intakes. But I do think she answered the question in the only way she knew how: by looking at the people in the chairs.

  Two years ago, the clinic started treating prolonged grief. Not depression. Not "time." Grief that stays, heavy and immobilizing.

  The critics ask: Is this a disease? Is there a biological malfunction? Or is this just you drawing a value-laden line around normal pain and calling it sick?

  Here is my mother's commitment, and mine: Yes, it is a line we drew. Medicine is not just finding broken gears; it is deciding which forms of suffering deny a person a future.

  When my dad died twelve years ago, Mom was told to "give it time." As if grief were a flu that runs a course. But for some of you in this room, the grief didn't run a course. It became a residence.

  So, why not just call it depression? This matters. Depression often tells you *nothing* matters. It flattens the world. Prolonged grief tells you that *one thing* mattered more than anything else, and now the world is empty. If you treat that like depression, you try to cheer the patient up. You try to broaden their interests. But that insults the love they lost.

  The clinic didn't try to cure the grief. You don't cure love. The clinic treated the *stuckness*. They treated the inability to hold the loss and the future in the same hand.

  To our philosopher friends: You are right to worry. Calling something a disorder is a normative act. It is a judgment. But my mother's judgment was this: We owe each other more than endurance. If pain becomes a cage, it is not enough to say, "The cage is natural." We have to offer a key.

  Was it medicalization? Maybe. But it was also recognition. It was saying to the person in the exam room, "You are not broken for hurting, but you deserve help for being trapped."

  Mom, you spent twenty-five years drawing lines. Not to exclude people, but to say, "This far, you have to walk alone; but this far, we walk with you." You didn't just treat conditions. You treated the isolation that comes when society decides your pain has lasted too long.

  So, I raise this glass. To the philosophers, thank you for keeping us honest. To the patients, thank you for trusting us with your stories. And to Mom, who taught me that sometimes the most scientific thing you can do is look someone in the eye and say, "I see that you are still carrying this. Let me help you hold it."

  To Mom. Happy retirement.
