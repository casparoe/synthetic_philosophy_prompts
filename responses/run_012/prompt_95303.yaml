answer: |-
  This is a sharp observation, and you are right to feel that the standard introductory vocabulary (commodification, crowding out) is often too blunt for the specific mechanism you're describing. You are identifying the *expressive* and *constitutive* power of market language, rather than just its distributive or motivational effects.

  Here is a breakdown of the existing literature, a proposal for a more precise term, and an analysis of the "compensation vs. price" boundary.

  ### 1. The Settled Terms (and where they miss)

  You are standing on the shoulders of three specific philosophers who tackle exactly this. Here is how their terms map onto your description, and where they might feel insufficient.

  **A. "Corruption" (Michael Sandel)**
  In *What Money Can't Buy*, Sandel explicitly distinguishes between "fairness" arguments and "corruption" arguments.
  *   **The Fit:** This is the closest settled term. Sandel argues that markets are not neutral; they imprint their own norms on the goods they touch. Putting a price on a kidney doesn't just allocate it; it changes the *normative status* of the kidney from a "gift of life" to a "spare part." This affects bystanders because it degrades the social ethos, even for those not buying or selling.
  *   **The Miss:** "Corruption" is a moral verdict (it's bad) rather than a mechanistic description (how it happens). It tells you the outcome (the good is degraded) but doesn't fully capture the linguistic/semantic mechanism you noticed regarding how we *label* the payment.

  **B. "Contested Commodification" (Margaret Jane Radin)**
  In *Contested Commodities*, Radin argues that commodification isn't a binary switch (market vs. non-market) but a spectrum.
  *   **The Fit:** She addresses your point about "compensation vs. price." She argues for "incomplete commodification," where we allow money to change hands (for expenses) but try to linguistically block the full market meaning (calling it "altruistic donation" rather than "sale").
  *   **The Miss:** Radin focuses heavily on the harm to the *seller's* personhood (self-constitution). Your observation is about the *object's* meaning and the *bystander's* perception.

  **C. "Expressive Theory of Law/Ethics" (Elizabeth Anderson)**
  In *Value in Ethics and Economics*, Anderson argues that actions are not just outcomes; they are expressions of attitudes.
  *   **The Fit:** This captures the "what the money is doing" aspect. Paying a surrogate expresses an attitude of instrumentalization; reimbursing expenses expresses an attitude of solidarity. The objection is that the market *expresses* the wrong attitude toward the good.
  *   **The Miss:** It is often framed around the *actor's* attitude rather than the *social ontology* of the object itself.

  **D. "Spheres of Justice" (Michael Walzer)**
  Walzer argues that goods belong to different "spheres" (medical, civic, economic) with different distributive rules.
  *   **The Fit:** When money (economic sphere) invades kidneys (medical sphere), it violates the boundary. The "meaning" of the good is determined by its sphere.
  *   **The Miss:** It's structural. It doesn't quite explain the *linguistic* sleight of hand (calling it "compensation") that allows the boundary to be blurred.

  ### 2. Coining a Term: "Constitutive Displacement"

  If "commodification" is too economic and "corruption" is too verdict-heavy, the mechanism you are describing is best termed **Constitutive Displacement**.

  **Definition:** *Constitutive Displacement occurs when the introduction of a market price mechanism does not merely allocate an existing good, but actively replaces the social rules that constitute what the good IS, thereby altering its meaning for non-participants.*

  **Why this fits your pattern:**
  1.  **Constitutive:** It addresses your point that the market changes "what the thing is." A queue spot is constitutively a "claim based on time/patience." When sold, it becomes a "claim based on wealth." It is no longer the same practice.
  2.  **Displacement:** It captures the bystander effect. The old meaning isn't just joined by a new one; it is pushed out (displaced) from the social understanding.
  3.  **The Linguistic Hook:** This term allows us to analyze the "compensation vs. price" distinction as an attempt to *prevent* displacement. When we say "expenses only," we are trying to keep the constitutive rules of the "gift/solidarity" sphere intact while allowing resource transfer. When we say "price," we accept the displacement.

  **Alternative Coinage:** If you want to focus specifically on the linguistic labeling aspect you mentioned, you could use **"Normative Laundering."** This describes the process of using euphemistic financial language ("compensation," "stipend") to cleanse a transaction of its market meaning so that Constitutive Displacement does not occur.

  ### 3. The Edges: Compensation vs. Price

  You asked: *Is the "we're just covering her costs" version genuinely a different practice, or the same practice laundered? Is there a principled line?*

  This is the central debate in Radin and Anderson's work. Here is the principled distinction, followed by the cynical reality.

  **The Principled Line: Termination of Obligation**
  In market exchanges, payment **terminates** the relationship. I pay you for the coffee, we are even, I owe you nothing.
  In non-market exchanges (gifts, civic duties, family), transfer **sustains** or **creates** a relationship. If I pay my mother for Thanksgiving dinner, I have insulted her because I have tried to terminate the obligation of family reciprocity.

  *   **Compensation (Expenses):** This is framed as *restoring* the agent to their prior status so they can participate in the non-market practice. "I will pay your travel costs so you can donate the kidney." The money supports the *practice* of donation.
  *   **Price (Market):** This is framed as *consideration* for the transfer of title. "I will pay you for the kidney." The money replaces the *practice* with a transaction.

  **Is it Laundering?**
  Often, yes. In surrogacy, for example, "compensation for time and risk" is often indistinguishable in magnitude from a market price. However, from the perspective of **Constitutive Displacement**, the *label* matters socially even if the *amount* is the same.

  Why? Because the label dictates the **exit norms**.
  *   If it is a **price**, the buyer owns the outcome. If the baby has a defect, the buyer might demand a "refund" or reject the "product."
  *   If it is **compensation**, the surrogate remains a moral agent in a shared project. The intended parents cannot reject the baby based on quality without violating the non-market norm of parenthood.

  **The Verdict on the Line:**
  The line is not found in the dollar amount (as you noted). It is found in **whether the payment severs the moral tie.**
  *   If the payment allows the buyer to say "I own this now, you have no further claim," it is a **Price** (Market).
  *   If the payment allows the seller to say "I did my part, we are still in this together," it is **Compensation** (Non-Market).

  When the language shifts from "compensation" to "price," the bystanders get riled up because they sense the **moral tie is being severed.** The baby is no longer a child to be welcomed, but a product to be accepted. The kidney is no longer a gift to be honored, but a part to be installed.

  ### Summary for your Seminar
  *   **The Phenomenon:** Markets changing the ontology of the good.
  *   **Best Settled Term:** **Corruption** (Sandel) or **Expressive Harm** (Anderson).
  *   **Precise Mechanism:** **Constitutive Displacement** (The market rules displace the social rules).
  *   **The Linguistic Trick:** **Normative Laundering** (Using "compensation" to prevent displacement).
  *   **The Principled Line:** Does the payment **terminate** the moral relationship (Price) or **sustain** it (Compensation)?

  If you use the framework of **Constitutive Displacement**, you will be able to explain why the *amount* of money matters less than the *grammar* of the exchange.
