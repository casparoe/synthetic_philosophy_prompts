      *   *Defeater 1 (Indistinguishability):* Hits the distinction itself. Fatal if true.
      *   *Defeater 2 (Mixed Cases):* Hits the distinction. Serious.
      *   *Defeater 3 (Uniform Phenomenology):* Hits the motivation. Serious.
      *   *Defeater 4 (Parsimony):* Hits the theory structure. Awkward.
      *   *Defeater 5 (Epistemic Costs):* Hits the epistemic half. Serious.

      *   *Survey:* Focus on correlation between predicate type and metaphysical judgment.
      *   *Insulation:* Be honest about the "patchwork" risk.

  9.  **Review against Constraints:**
      *   JSON format? Yes.
      *   No citations? Yes.
      *   Blunt/Harsh? Yes.
      *   Worst defeaters first? Yes.
      *   Survey section included? Yes.
