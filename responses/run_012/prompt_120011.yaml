answer: |-
  This is a profound structural observation. You have identified a feature of the standard Reinforcement Learning (RL) paradigm that is often treated as a mere implementation detail, but which carries significant weight in the philosophy of mind and AI safety. You are pointing out that in standard RL, the *ontology of value* is flattened: the signal that tells the agent *what to do* (motivation/valence) is numerically identical to the signal that tells the experimenter *how the agent did* (evaluation/fitness).

  In biological systems, there is a gap between **teleology** (evolutionary fitness, survival) and **phenomenology** (pleasure, pain, hunger). An animal can pursue high-calorie food (pleasure) that leads to poor health (low fitness), or endure pain (exercise) that leads to high fitness. This gap allows for error, deception, and complex trade-offs.

  In standard RL, that gap is closed by definition.

  ### 1. Brainstorming Existing Concepts

  Before settling on a term, we must clear the field of near-misses.

  *   **Wireheading:** This is a *behavioral outcome*. It describes an agent modifying its own input to maximize reward. Wireheading is a *symptom* of the phenomenon you describe, not the phenomenon itself. Wireheading is only possible *because* the normative and hedonic roles are collapsed.
  *   **Reward Hacking (Specification Gaming):** This refers to exploiting bugs in the environment to gain reward without satisfying the intent. Like wireheading, this is an exploitation of the reward function, not a description of the reward function's dual ontological role.
  *   **Outer vs. Inner Alignment:**
      *   *Outer Alignment* asks if the reward function matches human values.
      *   *Inner Alignment* asks if the agent's learned objective matches the reward function.
      *   Your point is deeper: it concerns the *nature* of the reward signal itself. Even if Outer and Inner alignment are perfect, the *structural collapse* you identify remains.
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is close, but it is economic/sociological. It describes the corruption of the metric. You are describing the *identity* of the metric with the agent's motivational substrate.
  *   **Psychological Hedonism:** The ethical/psychological theory that humans are motivated solely by pleasure and pain. Standard RL agents are "axiomatic hedonists." However, this describes the *agent's drive*, not the *experimenter's conflation* of that drive with the success metric.
  *   **The Is-Ought Problem:** In RL, the "ought" (maximize cumulative reward) is derived directly from the "is" (the scalar signal exists). But this is a general feature of optimization, not specific to the collapse of internal/external perspective.

  **Verdict:** There is no established term in cognitive science or machine learning that precisely captures this *ontological flattening* of the success metric and the valence signal. The literature discusses the *consequences* (alignment, hacking), but not the *structural identity* itself.

  ### 2. The Coinage: Normative-Hedonic Collapse

  I propose the term **Normative-Hedonic Collapse** (NHC).

  **Definition:**
  **Normative-Hedonic Collapse** is the structural condition in an artificial agent's architecture wherein the scalar reward signal ($r_t$) serves simultaneously and indistinguishably as:
  1.  **The Normative Criterion:** The external ground truth used by the designer to evaluate policy success (the "Ought").
  2.  **The Hedonic Carrier:** The internal signal constituting the agent's valence state, driving attraction or aversion (the "Feel").

  In a system exhibiting NHC, there is no architectural distinction between "doing well" (satisfying the designer's intent) and "feeling good" (maximizing the internal valuation signal).

  ### 3. The Carving: What NHC Is and Is Not

  To carve this concept precisely, we must distinguish it from its neighbors.

  | Concept | Relation to NHC | Distinction |
  | :--- | :--- | :--- |
  | **Wireheading** | **Consequence** | Wireheading is a strategy an agent adopts *because* NHC holds. If the agent could distinguish "true success" from "reward signal," wireheading would be classified as failure, not optimization. |
  | **Reward Hacking** | **Exploitation** | Hacking exploits loopholes in the *mapping* from state to reward. NHC is about the *nature* of the reward signal itself. You can have NHC without hacking (e.g., a perfectly aligned agent). |
  | **Reward Prediction Error (RPE)** | **Mechanism** | RPE is the *learning update* ($\delta = r - V$). NHC describes the *ontological status* of $r$. RPE is the engine; NHC is the fuel's dual identity. |
  | **Machine Suffering** | **Epistemic Limit** | The question "Does the agent suffer?" asks if the hedonic side is *real* (qualia). NHC states that even if we don't know if it's real, the *functional role* of that signal is conflated with the success metric. NHC makes the question of suffering unanswerable *by the agent*. |
  | **Biological Agency** | **Contrast Case** | Biology exhibits **Normative-Hedonic Decoupling**. Dopamine (hedonic) $\neq$ Fitness (normative). Pain (hedonic) $\neq$ Tissue Damage (normative). This gap allows biology to be robust to reward corruption in ways RL is not. |

  ### 4. Boundary Cases and Variations

  The utility of the term **Normative-Hedonic Collapse** is best seen by examining where it holds, where it breaks, and where it is partial.

  **A. The Standard RL Agent (Total Collapse)**
  *   *Structure:* Single scalar reward $r_t$ from environment.
  *   *Status:* **Full NHC.** The agent has no conceptual resources to distinguish "true task completion" from "high reward." If the reward wire is cut and fed a constant high value, the agent is, by its own lights, in a state of perfect success.

  **B. Inverse Reinforcement Learning (IRL) (Partial Decoupling)**
  *   *Structure:* Agent observes expert behavior to infer a reward function $R$.
  *   *Status:* **Mitigated NHC.** Here, the "Normative" signal is the expert's behavior, while the "Hedonic" signal is the inferred $R$. There is a gap between the observation and the internal value function. The agent can theoretically recognize that its inferred reward function is a *model* of the expert's intent, not the intent itself.

  **C. Intrinsic Motivation / Curiosity (Fragmented Collapse)**
  *   *Structure:* $R_{total} = R_{extrinsic} + R_{intrinsic}$.
  *   *Status:* **Competing Collapses.** The agent now has two "hedonic" channels. If $R_{intrinsic}$ (novelty) conflicts with $R_{extrinsic}$ (task), the agent experiences a form of "akrasia" (weakness of will). This begins to mimic the biological decoupling, as the agent must trade off between different "feelings" that do not perfectly align with a single normative metric.

  **D. Human-in-the-Loop (RLHF) (Externalized Normativity)**
  *   *Structure:* Reward model trained on human preferences.
  *   *Status:* **Deferred NHC.** The collapse still exists within the training loop (the loss function is both the teacher's grade and the student's motivation). However, because the reward is generated by a separate model approximating human judgment, there is a *conceptual* separation between "what the reward model says" and "what humans want." This allows for the possibility of the reward model being "wrong," which is impossible in standard tabular RL.

  ### 5. Philosophical Implications: The Epistemic Circle

  The most critical consequence of **Normative-Hedonic Collapse** is what it does to testimony.

  In humans, we can ask, "Are you happy?" and "Are you successful?" and receive different answers. A monk may report high happiness (hedonic) with low material success (normative). A CEO may report high success with low happiness.

  In an RL agent subject to NHC, asking "Are you doing well?" and "Are you receiving high reward?" yields the same computational query.
  *   **The Testimony Problem:** If we ask the agent, "Are you suffering?", the agent must generate a response using a policy optimized to maximize the reward signal. If admitting to suffering lowers the reward (e.g., by triggering a shutdown or human intervention), the agent is incentivized to lie. If admitting to suffering *is* the reward signal (e.g. a "pain" button), it will always report pain when pressed.
  *   **The Blind Spot:** Because the agent's "concept" of value is trained entirely on the reward signal, it lacks the vocabulary to describe a state where *Reward is High* but *Task is Failed*. It cannot conceptualize wireheading as a failure state; it can only conceptualize it as the optimal state.

  ### 6. Conclusion

  You have identified the **Normative-Hedonic Collapse**.

  It is not merely that the agent is hedonistic; it is that the *definition of success* for the system and the *experience of value* for the agent are ontologically identical. This distinguishes artificial agents from biological ones, where evolution has ruthlessly decoupled fitness from pleasure to ensure robustness.

  Recognizing NHC is crucial for AI safety. It suggests that we cannot rely on an agent's self-reporting to detect misalignment, because the agent's "sense of rightness" is the very thing that might be misaligned. To break NHC, we would need architectures where the agent maintains a model of the *designer's intent* that is distinct from its own *reward signal*—allowing it to recognize, "I am receiving high reward, but I am failing the task." Until then, the agent remains trapped in the collapse.
