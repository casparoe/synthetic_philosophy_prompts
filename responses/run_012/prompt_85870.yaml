answer: |-
  Here is an analysis of your verdicts, a refined principle designed to capture them, and an honest assessment of where your intuitions conflict.

  ### 1. The Diagnosis of Your Tentative Principle

  Your tentative principle ("Trust is default, defeated by stake/extraordinariness/cost; cheap verification overrides reliability") is a hybrid of **Presumptivism** (trust is default) and **Pragmatism** (verification is a cost-benefit decision).

  **Where it succeeds:**
  *   It handles **Case 1** (Default trust), **Case 3** (Stake/Cost defeater), and **Case 8** (Extraordinariness defeater) well.
  *   It correctly identifies that **Case 9** (False independence) should not increase confidence.

  **Where it fails:**
  *   **Case 5 vs. 6:** Your principle says if verification is *not* cheap (Case 6), trust is the default. But you *don't* trust. Why? Because you omitted **Prior Reliability** as a defeater. In Case 6, the friend has a history of being wrong technically. In Case 5, the cost of verification is so low it bypasses the reliability calculation entirely.
  *   **Case 11:** You worry about circularity. Your principle doesn't address how initial trust is established.
  *   **Case 12:** This is your biggest inconsistency. You state the track records are "roughly comparable," yet you treat the sources differently. Your principle cannot account for this without adding an arbitrary "Human vs. Tool" clause.
  *   **"Cheap to Check":** You are conflating *justification* (do I have the right to believe?) with *strategy* (should I bother checking?). In Case 1, you are justified in believing the stranger even though checking is cheap. You just don't *need* to check. In Case 5, you aren't refusing to believe because it's cheap; you are refusing to *act* on the belief without checking because the cost of being wrong (broken config) is higher than the cost of checking.

  ### 2. The Refined Principle: Calibrated Presumptivism

  To capture your verdicts, you need a principle that separates **Epistemic Status** (what you believe) from **Verification Policy** (what you do).

  **The Principle:**
  1.  **Presumptive Justification:** Testimony provides immediate, prima facie justification for belief. You are rational to believe a claim solely because it was asserted, provided no defeaters are present.
  2.  **Defeaters:** Presumptive justification is defeated or diminished by:
      *   **Incentive Misalignment:** The speaker benefits from your belief (Case 3, Case 6 partially).
      *   **Content Extraordinariness:** The claim conflicts sharply with your existing model of the world (Case 8).
      *   **Track Record:** Specific evidence that this speaker (or class of speakers) is unreliable on this topic (Case 6, Case 9).
  3.  **Verification Policy:** Whether you *verify* a claim is not a question of justification, but of risk management. Verify if:
      *   `Cost(Verify) < Cost(Error) × Probability(Error)`
      *   *Note:* This explains why you verify Case 5 (low cost) but not Case 1 (low cost of error), even if checking costs are similar.
  4.  **Independence:** Corroborating testimony only increases justification if the sources are causally independent (Case 10 vs. Case 9).

  ### 3. Application to Your 12 Verdicts

  *   **Cases 1, 2, 4, 7:** **Fit.** Presumptive justification holds. No defeaters (no stake, ordinary claims, high expertise). Verification policy dictates no check needed (Case 1, 2, 7) or check is part of the fix process (Case 4).
  *   **Cases 3, 8:** **Fit.** Defeaters active (Stake in Case 3, Extraordinariness in Case 8). Justification blocked.
  *   **Case 5:** **Fit.** Justification exists (Presumption), but Verification Policy triggers a check because `Cost(Verify)` is negligible. You "half-believe" (suspend judgment) to optimize workflow, not because you lack justification.
  *   **Case 6:** **Fit (with refinement).** Justification is defeated by **Track Record**. The friend is reliably unreliable on technical matters. Verification is impossible, so you default to disbelief.
  *   **Case 9 vs. 10:** **Fit.** Case 9 fails the Independence clause. Case 10 passes it.
  *   **Case 11:** **Fit.** This is **Inductive Bootstrapping**. You use Presumptive Justification on checkable claims to build a Track Record, which then justifies uncheckable claims. This is not viciously circular; it is the standard mechanism for learning reliability.
  *   **Case 12:** **Mismatch.** (See Inconsistencies below).

  ### 4. Inconsistencies and Hard Truths

  There are two places where your verdicts fight each other. You cannot keep all 12 without ad-hoc reasoning.

  **Inconsistency A: Case 12 (The AI Asymmetry)**
  You state the track record is "roughly comparable," yet you treat the Colleague as a witness (Presumption applies) and the AI as a search engine (Presumption denied).
  *   **The Conflict:** If the track record is truly comparable, the Principle demands you treat them identically.
  *   **The Fix:** You must admit one of two things:
      1.  **The track records are *not* comparable.** You implicitly weight AI hallucinations as more costly or probable than colleague errors. If so, update your track record assessment.
      2.  **You categorize AI differently.** You view the AI not as a "testifier" but as a "probabilistic text generator." If you categorize it as a tool (like a compiler) rather than a witness (like a colleague), Presumptivism doesn't apply. You don't "trust" a compiler; you run it.
  *   **Recommendation:** If you want consistency, either trust the AI provisionally (Case 12 verdict changes) or admit you distrust the colleague more than you say (Case 2 verdict changes). Given current engineering norms, the honest fix is to acknowledge the AI is a **Tool**, not a **Witness**. Tools require validation; witnesses warrant presumption.

  **Inconsistency B: Case 5 vs. Case 1 (The "Cheap Check" Boundary)**
  In Case 1 (Train), checking is cheap (look at the board). You believe without checking.
  In Case 5 (Config), checking is cheap (10 seconds). You *don't* believe; you check.
  *   **The Conflict:** Your tentative principle said "where verification is cheap, I stop caring about reliability." But in Case 1, you *did* care (you believed the stranger) despite cheap verification.
  *   **The Fix:** This is resolved by the **Verification Policy** clause above. In Case 1, `Cost(Error)` is low (wait 10 mins for next train). In Case 5, `Cost(Error)` is higher (break the build/deploy). The cheapness of the check matters less than the *ratio* of check-cost to error-cost.

  ### 5. Predictions for New Cases

  Using the **Calibrated Presumptivism** principle:

  1.  **A colleague who has been wrong twice before tells me something ordinary and uncheckable.**
      *   *Prediction:* **Diminished Trust.** Two errors constitute a nascent Track Record defeater. You do not reject the claim outright (Presumption still exists), but you lower your confidence probability. You might seek a second source.
  2.  **An anonymous post that agrees with my prior turns out to trace back to one source.**
      *   *Prediction:* **Confidence Collapse.** (Same as Case 9). Independence is required for corroboration. If the source is singular, confidence returns to baseline for that single source.
  3.  **An assistant contradicts the documentation on a point I can't test by running code.**
      *   *Prediction:* **Trust Documentation.** Documentation is a "System Record" (higher reliability class) vs. Assistant "Testimony" (lower reliability class). Unless the docs are known to be stale, the Track Record of official docs outweighs the Assistant.
  4.  **Someone who benefits from my believing them describes a meeting I missed.**
      *   *Prediction:* **Distrust/Suspend.** (Same as Case 3). Incentive Misalignment is a hard defeater. You require corroboration (minutes, other attendees) before believing.
  5.  **My own memory disagrees with a log file.**
      *   *Prediction:* **Trust Log.** This is a conflict between Internal Testimony (Memory) and External Record (Log). In engineering contexts, Logs have a higher Track Record for objective events than Memory. Memory is treated as a fallible witness.

  ### 6. Specific Philosophical Questions

  **Does "cheap to check" belong in a principle about justification?**
  **No.** It belongs in a principle of **action**.
  *   *Justification:* Do I have the right to believe P? (Answer: Yes, via Presumptivism, unless defeated).
  *   *Action:* Should I act on P without verifying? (Answer: Depends on cost/benefit).
  *   In Case 1, you are *justified* in believing the train is at Platform 4. You simply choose not to *verify* because the risk is low. In Case 5, you are likely *justified* in believing the flag is true (colleague/friend testimony), but you choose to *verify* because the risk of deployment failure is high. Confusing these two leads to the inconsistency you felt between Case 1 and 5.

  **Is the circular-looking step in Case 11 a real defect?**
  **No.** It is **Ordinary Inductive Practice**.
  *   You cannot verify reliability without first assuming some testimony is true.
  *   *Process:* Assume Claim A is true (Presumption) -> Verify A -> If A is true, increase Reliability Score of Speaker -> Use Score to evaluate Claim B.
  *   This is not vicious circularity (assuming the conclusion to prove the conclusion); it is **bootstrapping**. You are testing the *instrument* (the speaker) using known *standards* (checkable facts). As long as you have *some* checkable facts to start the loop, the justification is sound.

  ### 7. Final Verdict: What to Give Up

  If you want a unified principle, you must give up one of the following:

  1.  **The "Comparable Track Record" in Case 12.**
      *   *Action:* Admit that you treat AI as a Tool and Colleagues as Witnesses. This requires adding a "Source Category" clause to your principle (Humans warrant presumption; Probabilistic Generators warrant verification).
      *   *Cost:* You must accept that your distrust of AI is categorical, not purely evidence-based.

  2.  **The "Half-Believe" in Case 5.**
      *   *Action:* Admit you *do* believe the friend in Case 5, you just verify anyway.
      *   *Cost:* This changes your description of your mental state, but aligns better with the principle that testimony *does* justify belief, even when we verify. (Engineers often verify things they believe, just to be sure).

  **Recommendation:**
  Give up the idea that Case 12 is an epistemic inconsistency. It is a **categorization** difference.
  *   **Principle Update:** "Presumptive trust applies to **Agents** (humans, doctors, colleagues) who intend to convey truth. It does not apply to **Instruments** (AI, logs, benchmarks) which generate output without intent."
  *   This resolves Case 12 without contradicting the rest of your verdicts. You trust the Colleague (Agent) provisionally. You query the AI (Instrument) and validate.

  **Summary of Your Unified View:**
  You are a **Pragmatic Presumptivist**. You believe people by default because social coordination requires it (Cases 1, 2, 4, 7). You withhold belief when incentives clash or claims are impossible (Cases 3, 6, 8). You verify not because you lack justification, but because the cost of error outweighs the cost of checking (Case 5). You treat AI as a tool, not a person (Case 12). This is a consistent, robust engineering epistemology.
