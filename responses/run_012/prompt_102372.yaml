  Me and a friend have been arguing about the species problem for months now and I want a diagnosis of the disagreement, not a tour of the positions. Roughly: she thinks species are real, mind-independent kinds out there in nature, and I think "species" is just a label we slap on whatever chunk of the tree of life is useful for us, so the whole fight is verbal. What throws me is that we agree on all the empirical stuff -- the phylogeny, gene flow, ring species, asexual microbes, gradual anagenesis where a lineage just morphs into something that wouldn't interbreed with its own ancestors -- and we still disagree about whether some particular cluster really is a species. So which is it: a real disagreement about the world, a verbal one about how to use a word, two people answering different questions (what's out there vs. what a useful classification does) under one heading, or bedrock intuitions neither of us can argue for? I have a hunch it's mostly verbal but a hunch isn't a diagnosis. And does the move that species are individuals rather than kinds actually dissolve anything, or just relabel the dispute? Tell me what would count as progress here -- a distinction, an empirical discovery, or a demonstration that there's nothing to find -- and push back hard if my framing is confused or the question is ill-posed.
