  2.  **The Differential Survival Rule:** To count as a meme, the trait must be subject to selection pressures, such that some variants survive and spread while others die out (whether due to host benefit or selfish propagation).
      *   *Fit:* Explains the chain letter (selfish propagation), surgical technique (host benefit), and vowel shift/jingle (competitive spread).
      *   *Prediction for Remedy:* **Meme.** The prompt states versions that "stray too far are never reinvented," indicating strong selection maintaining the form.

  3.  **The Replicator Fidelity Rule:** To count as a meme, the trait must be copied with sufficient fidelity that the *instruction* itself preserves the identity over time, rather than the identity being maintained by functional constraints or reconstruction.
      *   *Fit:* Explains the exclusion of the fishing spot (no copying mechanism) and the inclusion of the vowel shift/jingle (phonetic imitation provides a copying mechanism, even if noisy). It distinguishes "copying" from "stimulus enhancement."
      *   *Prediction for Remedy:* **Not a Meme.** The prompt specifies users "reconstruct it from a rough idea" and "improvise the details," meaning the stability comes from the *reinvention process* (convergence), not the *transmission of the recipe* (replication).

