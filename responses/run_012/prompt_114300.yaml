  1.  **The "Strict Sense" Constraint:** A "committed Darwinian" in the Dawkins/Blackmore tradition defines a meme specifically as a *replicator*. A replicator requires heredity (copying) with enough fidelity to allow selection to act on the *replicator*, not just on the outcome.
