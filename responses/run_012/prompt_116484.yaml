          4.  **Logical Omniscience:** They know all logical consequences of their knowledge.
          5.  **Truthful/Consistent Partitioning:** They interpret signals the same way (same state space).

  3.  **Evaluate Assumptions against LLM Multi-Agent Systems:**
      *   *Priors:* LLMs are initialized with weights from pre-training. Even with the same base model, different seeds + different system prompts = *different effective priors*. The system prompt acts as a prior conditioner.
      *   *Bayesian Updating:* LLMs are not Bayesian updaters. They are next-token predictors. They don't maintain a belief state $P(H|E)$. They generate text that *looks* like reasoning.
      *   *Common Knowledge:* The agents read each other's output, but do they *know* that the other knows? In practice, context windows limit this. They don't have infinite recursion of knowledge.
