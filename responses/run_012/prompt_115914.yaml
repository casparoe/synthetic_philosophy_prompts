      *   *Self-Correction on Claim 13:* Maybe the grad student means *outside* of analytic metaphysics? Or in physics? No, the context is a metaphysics reading group. In that field, Humeanism is a dominant rival, not a dead horse.
      *   *Confidence Check:* Where am I least confident? Probably on the "Induction" point. Some Humeans (like Norton) have specific material theories of induction. But the general Humean line is that induction isn't "rationally grounded" in a deep metaphysical sense, it's pragmatic. The Grad Student's claim is that it *can't* make it rational. That's a strong claim. I should mark my confidence there as moderate.

