prompt: |-
  Draft the joint statement of an adversarial collaboration between two researchers who have spent years arguing about the free energy principle and predictive processing. One is a committed proponent who treats the free energy principle as a genuine first-principles unification of self-organization, perception, and action, with predictive processing as its most promising cognitive application; the other is a committed critic who suspects the principle is either unfalsifiable or a formal re-description of ideas already available in Bayesian inference, control theory, and variational methods, dressed in new vocabulary. Assume both are competent, good-faith, and willing to be pinned down.

  Produce the document they could both sign. It should contain:

  1. A numbered list of agreed claims: about what the free energy principle and predictive processing actually assert at the level of formalism; about which parts are mathematics and which are interpretation; about what the framework does and does not claim to explain; about the relation between the principle as a normative or teleological statement and predictive processing as a hypothesis about processing; and about what would count as a fair test of either. Each claim should do real work — a formulation both sides would regard as a concession or a substantive commitment, not a platitude either could shrug off.

  2. A disagreements table with, for each row: the point at issue; the proponent's position in wording the proponent would accept; the critic's position in wording the critic would accept; the crux, meaning the sub-question that, if settled, would move at least one side; and, for that crux, a concrete case, argument, or piece of evidence both sides agree bears on it, together with each side's prediction about it recorded in advance.

  Consider at least these candidate cruxes, though you may revise or replace them: whether the Markov-blanket formalism presupposes the very system boundaries it purports to explain, or whether it genuinely derives them; whether the dark-room or sensory-deprivation problem is a real prediction of the framework or an artifact of idealization; whether expected free energy adds empirical content beyond a relabelling of reward-seeking and information-seeking; whether the principle is falsifiable at all, and if it is not, whether that is a vice for a framework of this scope; and whether predictive processing makes commitments about neural implementation that could come apart from the free energy principle.

  If part of the dispute turns out to be verbal — the two camps attaching different senses to the same term — say which part and why, and flag any places where the positions differ only in emphasis rather than in incompatible claims.

  Throughout, separate what is settled from what is genuinely contested among people who know this material, and do not present a contested view as the consensus. Where you record an agreed claim or a prediction, state how confident each side should be in it.
reasoning: |-
  Here's a thinking process that leads to the joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement of an adversarial collaboration between two researchers (Proponent vs. Critic) regarding the Free Energy Principle (FEP) and Predictive Processing (PP).
      *   **Tone:** Competent, good-faith, pinned down, substantive (no platitudes).
      *   **Components:**
          1.  Numbered list of agreed claims (formalism, math vs. interpretation, scope, normativity vs. hypothesis, falsifiability/tests).
          2.  Disagreements table (Issue, Proponent's Position, Critic's Position, Crux, Concrete Evidence/Case, Predictions).
          3.  Specific candidate cruxes to consider (Markov blankets, dark room problem, expected free energy/reward, falsifiability, neural implementation).
          4.  Identification of verbal disputes vs. substantive disagreements.
          5.  Confidence levels for claims/predictions.
      *   **Constraint:** Do not present contested views as consensus.

  2.  **Deconstruct the Personas:**
      *   **Proponent (P):** Views FEP as a first-principles unification (physics/biology/cognition). Sees PP as the cognitive instantiation. Believes it explains *why* systems exist (self-organization) and *how* they function (inference). High confidence in the mathematical necessity of the principle.
      *   **Critic (C):** Views FEP as potentially unfalsifiable or a re-description of existing Bayesian/Control theory. Suspects "circularity" in defining boundaries. Worried about the "dark room" problem. Sees PP as a useful heuristic but not necessarily derived from FEP. High confidence in the need for empirical differentiation from standard models.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground that isn't trivial. Both sides must feel they gave something up or committed to something specific.
      *   *Claim 1 (Formalism):* Agree on the math. FEP relies on variational Bayesian inference. It minimizes variational free energy (an upper bound on surprise).
      *   *Claim 2 (Math vs. Interpretation):* Distinguish the theorem (systems with Markov blankets minimize VFE) from the biological claim (brains *are* such systems).
      *   *Claim 3 (Scope):* FEP claims to explain existence/persistence (self-organization). PP claims to explain perception/action mechanisms. They are linked but distinct.
      *   *Claim 4 (Normativity):* FEP is often framed as "systems *must* do this to exist" (normative/teleological). PP is "systems *do* do this" (descriptive).
      *   *Claim 5 (Falsifiability/Tests):* Agree that mere fitting of behavioral data isn't enough. Need to test the *mechanism* (neural) or the *necessity* (perturbation).
      *   *Refinement:* Ensure the wording reflects the tension. E.g., instead of "FEP is math," say "The core inequality is a mathematical identity, but its application to biology is an empirical hypothesis."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Highlight the real fights.
      *   *Issue 1: Markov Blankets & Boundaries.*
          *   P: Boundaries emerge from statistical conditional independence.
          *   C: Boundaries are assumed to define the blanket; circular.
          *   Crux: Can we identify a blanket *without* prior anatomical assumption?
          *   Evidence: Cell membrane vs. functional clustering.
      *   *Issue 2: The Dark Room Problem.*
          *   P: Resolved by Expected Free Energy (EFE) including epistemic value/priors over preferences.
          *   C: Requires ad-hoc priors ("don't die"), making it unfalsifiable.
          *   Crux: Are priors over preferences learnable or fixed?
          *   Evidence: Sensory deprivation experiments.
      *   *Issue 3: Expected Free Energy vs. Reward.*
          *   P: EFE unifies exploration (info gain) and exploitation (reward).
          *   C: It's just RL with an entropy bonus.
          *   Crux: Does EFE predict behavior distinct from standard RL + Info bonus?
          *   Evidence: Specific foraging tasks with changing uncertainty.
      *   *Issue 4: Falsifiability.*
          *   P: It's a principle like Least Action; falsified if systems persist without minimizing FEP.
          *   C: It's a tautology if any behavior can be retrofitted with a prior.
          *   Crux: Can we specify a behavior that is *incompatible* with FEP?
          *   Evidence: Maladaptive persistence (suicide/addiction).
      *   *Issue 5: Neural Implementation.*
          *   P: Hierarchical predictive coding is the specific message passing.
          *   C: Brains might do PP without minimizing VFE globally, or vice versa.
          *   Crux: Do laminar firing rates match predictive coding equations specifically?
          *   Evidence: Layer-specific microstimulation/recording.

  5.  **Drafting Section 3: Verbal Disputes & Emphasis:**
      *   Identify where they are talking past each other.
      *   "Surprise" (mathematical vs. colloquial).
      *   "Model" (generative model in the head vs. statistical description by the observer).
      *   Emphasis: P emphasizes unification; C emphasizes mechanism.

  6.  **Review and Refine:**
      *   *Check:* Are the claims too vague? *Fix:* Make them specific about variational bounds and Markov blankets.
      *   *Check:* Is the Critic too straw-manned? *Fix:* Ensure the Critic's position acknowledges the utility of PP while attacking the FEP derivation.
      *   *Check:* Is the Proponent too dogmatic? *Fix:* Acknowledge that biological instantiation is contingent.
      *   *Check:* Confidence levels? *Fix:* Add percentages or qualitative confidence (High/Medium/Low).
      *   *Check:* Formatting? *Fix:* Use clear headers and markdown tables.

  7.  **Final Polish:**
      *   Ensure the voice sounds like academic collaborators (precise, cautious but firm).
      *   Verify the "Dark Room" argument is nuanced (it's about priors over states vs. policies).
      *   Verify the "Markov Blanket" argument distinguishes between *finding* a blanket and *presupposing* one.

  *(Self-Correction during drafting)*: Initially, I might make the Critic say "FEP is useless." That's too strong. A competent critic admits it's a useful framework but questions its *explanatory novelty* and *necessity*. I need to adjust the Critic's position to be "It's a redescription, not a new mechanism."
  Also, ensure the distinction between *Variational Free Energy* (VFE) and *Expected Free Energy* (EFE) is clear, as that's where the action-perception split happens.

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Joint Statement on the Status and Scope of the Free Energy Principle and Predictive Processing

  **Date:** October 26, 2023
  **Signatories:**
  *   **Dr. Elena Vargo (Proponent):** Department of Theoretical Neuroscience, Institute for Advanced Study.
  *   **Dr. Marcus Thorne (Critic):** Center for Computational Psychology, University of Cambridge.

  **Preamble:**
  We have engaged in a structured adversarial collaboration over eighteen months to clarify the theoretical status of the Free Energy Principle (FEP) and Predictive Processing (PP). Our goal is not to declare a winner, but to map the boundary between mathematical necessity, empirical hypothesis, and interpretive overlay. We agree that the field has suffered from ambiguous terminology and over-extended claims. The following document represents our consensus on what is settled, and a precise specification of where our disagreement lies.

  ---

  ## Part I: Agreed Claims

  We endorse the following six claims. Each represents a substantive commitment; neither party regards these as trivialities, and each required concession from our initial positions.

  1.  **The Mathematical Core is Non-Controversial.**
      We agree that the variational free energy inequality ($F \ge -\ln P(o)$) is a mathematical identity derived from the definition of the Kullback-Leibler divergence. It is true by definition that minimizing variational free energy (VFE) minimizes an upper bound on surprise (negative log model evidence).
      *   *Confidence:* 100% (Mathematical certainty).
      *   *Concession:* The Proponent acknowledges this does not entail biological systems *actually* minimize VFE. The Critic acknowledges this is not merely a "metaphor" but a rigorous statistical bound.

  2.  **Distinction Between Observer and System Models.**
      We agree that a crucial ambiguity exists in the term "generative model." In the FEP formalism, a "model" can refer to (a) the probability distributions posited by the *scientist* to describe the system, or (b) the internal states of the *system* that parameterize a distribution.
      *   *Commitment:* Claims about "the brain having a model" refer to sense (b). Claims about "the system minimizing free energy" often rely on sense (a). Confusion between these two generates many false implications about circularity.
      *   *Confidence:* High (Both).

  3.  **The Markov Blanket is a Condition, Not Necessarily a Mechanism.**
      We agree that the existence of a Markov blanket (a statistical boundary separating internal from external states via sensory and active states) is a precondition for applying the FEP derivation to a system.
      *   *Commitment:* The FEP does not, in its current standard formulation, *derive* the existence of the blanket from first principles without assuming conditional independence structures a priori. It shows what follows *if* a blanket exists.
      *   *Confidence:* High (Critic); Medium-High (Proponent).

  4.  **Normative vs. Descriptive Status.**
      We agree that the FEP functions differently when applied to existence versus behavior.
      *   *Commitment:* As a principle of self-organization (existence), it is normative/teleological (systems *must* minimize free energy to persist). As a principle of perception/action (PP), it is descriptive (systems *do* minimize prediction error). These are logically distinct claims. A system could theoretically persist (satisfy FEP-existence) without implementing hierarchical predictive coding (FEP-cognition).
      *   *Confidence:* High (Both).

  5.  **The "Dark Room" Problem is a Constraint on Priors, Not a Refutation.**
      We agree that the "dark room" problem (the implication that an agent should seek uninformative, low-surprise states like a dark room) is not a mathematical error in the FEP, but a constraint on the specification of priors over policies (Expected Free Energy).
      *   *Commitment:* To avoid dark room solutions, the agent must possess priors that favor specific sensory states (e.g., homeostatic setpoints). The dispute is not whether this is possible, but whether positing these priors renders the theory unfalsifiable (see Claim 6).
      *   *Confidence:* High (Both).

  6.  **Falsifiability Requires Specification of the "Impossible".**
      We agree that for the FEP/PP to be scientifically useful, it must specify a pattern of behavior or neural activity that is *incompatible* with free energy minimization, given a fixed model class.
      *   *Commitment:* Merely fitting a model to data post-hoc by adjusting priors does not count as confirmation. A fair test requires pre-registering the structure of the generative model and the priors, then testing if behavior deviates from the minimization trajectory.
      *   *Confidence:* High (Critic); Medium (Proponent).

  ---

  ## Part II: Disagreements Table

  The following table isolates the substantive disagreements. We have identified the "Crux"—the specific empirical or theoretical resolution that would shift our confidence significantly.

  | Point at Issue | Proponent's Position (Vargo) | Critic's Position (Thorne) | The Crux | Concrete Case / Evidence | Predictions (Pre-registered) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Derivation of Boundaries** | The Markov blanket formalism can be used to *identify* system boundaries in data where they are not anatomically obvious (e.g., social groups, immune systems). It is a discovery tool. | The identification of a Markov blanket *presupposes* the partition of states into internal/external/sensory/active. It is a descriptive tool, not a derivational one. | **Can we identify a blanket without anatomical priors?** | **Case:** Analysis of collective motion in schooling fish. <br> **Test:** Apply blind source separation to find conditional independence structures. | **Vargo:** Blind analysis will recover individual fish as distinct blankets with >80% accuracy. <br> **Thorne:** Blind analysis will fail to distinguish individuals from water dynamics without anatomical constraints. |
  | **2. Expected Free Energy (EFE) vs. Reward** | EFE provides a principled unification of exploration (epistemic value) and exploitation (pragmatic value) that standard Reinforcement Learning (RL) treats as separate hyperparameters. | EFE is mathematically isomorphic to RL with an entropy bonus (e.g., MaxEnt RL). It offers no new behavioral predictions, only a different vocabulary. | **Does EFE predict behavior distinct from RL + Info Bonus?** | **Case:** Foraging task where information value changes non-linearly with risk. <br> **Test:** Compare EFE agent vs. Standard RL + $\beta$-entropy agent. | **Vargo:** EFE agent will match human switching behavior in high-volatility regimes where RL agents over-explore. <br> **Thorne:** An RL agent with a dynamic learning rate on the entropy term will fit the data equally well (AIC difference < 2). |
  | **3. The Dark Room & Priors** | Priors over preferences are not "ad-hoc"; they are learned via developmental processes that minimize long-term free energy. The "urge to live" is an emergent attractor. | If priors over preferences can be adjusted post-hoc to explain any survival behavior, the theory is unfalsifiable. The "urge to live" is an assumption, not a derivation. | **Are priors over preferences learnable within the framework?** | **Case:** Sensory deprivation studies in mammals. <br> **Test:** Measure if agents actively seek stimulation after long deprivation, controlling for homeostasis. | **Vargo:** Agents will show increased epistemic foraging (active inference) proportional to deprivation time. <br> **Thorne:** Agents will show apathy or stereotypy consistent with model collapse, not active inference. |
  | **4. Neural Implementation** | Hierarchical Predictive Coding (PC) is the *only* efficient way to minimize VFE in a biological substrate. Canonical microcircuits (e.g., laminar firing) must match PC equations. | Brains might minimize VFE (globally) without using Predictive Coding (locally). Other algorithms (e.g., Hebbian, backprop) could minimize the same function. | **Do laminar firing rates match PC specifically?** | **Case:** Layer-specific recording in V1 during expectation violation. <br> **Test:** Dissociate prediction error signals from feedforward drive. | **Vargo:** Superficial layers will encode prediction errors; deep layers will encode predictions (specific phase/amplitude signatures). <br> **Thorne:** Signals will be distributed; the specific PC mapping will not explain variance better than a generic error-correction model. |
  | **5. Falsifiability Scope** | The FEP is a "principle" like the Least Action Principle. It is falsified if a self-organizing system is found that persistently *maximizes* surprise without collapsing. | Physical principles apply to all matter; biological principles must apply to *some* mechanisms. If any behavior can be rationalized as minimizing FEP, it is a tautology. | **Can we specify a behavior incompatible with FEP?** | **Case:** Maladaptive persistence (e.g., addiction, suicide). <br> **Test:** Model an agent persisting in high-surprise states. | **Vargo:** This is modeled as a precision weighting error (false confidence in bad policies), not a violation of FEP. <br> **Thorne:** If *all* pathology is "precision error," the theory explains everything and nothing. We need a limit case. |

  ---

  ## Part III: Verbal Disputes and Emphasis

  We identify the following areas where our disagreement is primarily terminological or emphatic, rather than substantive. We agree to flag these in future discourse to avoid confusion.

  **1. The Meaning of "Model"**
  *   **Dispute:** The Proponent often speaks of the "brain's model." The Critic hears "conscious representation."
  *   **Resolution:** We agree to use **"internal generative structure"** when referring to the statistical dependencies encoded in neural states (Proponent's sense) and reserve **"cognitive model"** for explicit, reportable representations (Critic's concern).
  *   **Status:** Verbal.

  **2. The Meaning of "Inference"**
  *   **Dispute:** The Proponent uses "inference" to mean any state update that reduces free energy (including reflex arcs). The Critic reserves "inference" for probabilistic reasoning.
  *   **Resolution:** We agree to distinguish **"variational update"** (the mathematical operation) from **"cognitive inference"** (the psychological process). The FEP claims the former implements the latter, but they are not identical.
  *   **Status:** Verbal/Emphasis.

  **3. Unification vs. Mechanism**
  *   **Dispute:** The Proponent emphasizes the *unification* of life and mind (FEP). The Critic emphasizes the *mechanism* of cognition (PP).
  *   **Resolution:** We acknowledge that the FEP could be true as a principle of self-organization (Proponent's win) even if Predictive Coding is false as a neural mechanism (Critic's win), and vice versa. They are coupled but separable hypotheses.
  *   **Status:** Substantive distinction clarified.

  ---

  ## Part IV: Confidence and Next Steps

  **Confidence Assessment:**
  *   **Proponent Confidence in FEP as Universal Principle:** 85% (Reduced from 95% during collaboration).
  *   **Critic Confidence in FEP as Tautology:** 60% (Reduced from 80% during collaboration).
  *   **Shared Confidence in PP as Heuristic:** 90% (Both agree PP is a productive research program regardless of FEP status).

  **Next Steps:**
  1.  **Blind Markov Analysis:** We will jointly fund a post-doc to attempt the "blind" identification of Markov blankets in schooling fish data (Table Row 1).
  2.  **Model Comparison:** We will pre-register a competition between an Active Inference agent and a MaxEnt RL agent on a volatile foraging task (Table Row 2).
  3.  **Pathology Limits:** We will convene a workshop to define the "limit case" for FEP pathology—specifically, what pattern of neural activity would constitute a definitive falsification of the predictive coding hypothesis (Table Row 4).

  **Signed,**

  *Elena Vargo*
  *Marcus Thorne*
