answer: |-
  **Essay Question**

  Harsanyi's Aggregation Theorem demonstrates that if individual preferences and social preferences both satisfy the von Neumann–Morgenstern axioms for expected utility, and if social preferences satisfy the Pareto principle, then the social welfare function must be a weighted sum of individual utilities. This result is frequently mobilized to defend utilitarianism, yet critics argue the theorem is either normatively inert or circular.

  Write an essay that disentangles the formal mathematical result from the ethical argument typically built upon it. Your response should address two specific challenges:
  1.  Explain the charge that the theorem is either "too weak" (regarding weighting) or "question-begging" (regarding utility measurement). Where exactly does the normative work enter the picture?
  2.  Analyze the incompatibility between Harsanyi's framework and prioritarianism (which advocates for inequality aversion via concave transformations of welfare). Identify precisely which assumption or axiom of the Aggregation Theorem a prioritarian must reject to maintain their position.

  Do not rely on external citations. Focus on the structural logic of the theorem and the implications of its assumptions.

  ***

  **Model Answer**

  Harsanyi's Aggregation Theorem is a representation theorem, not a moral proof. It states that under specific structural conditions, social preferences can be represented as a linear combination of individual utility functions. To evaluate its ethical significance, one must distinguish the mathematical constraints from the moral premises required to utilize them. The theorem itself does not generate utilitarianism; it merely delineates the form any social ordering must take if it respects individual rationality and Pareto efficiency.

  The first challenge concerns the normative weight of the theorem. Critics argue the result is "too weak" because the theorem proves only that social welfare $W$ equals $\sum a_i U_i + c$. The weights $a_i$ are mathematically arbitrary within the formalism. The theorem does not dictate that $a_i$ must be equal. To derive utilitarianism (equal weights), Harsanyi must import an external moral argument, typically the Veil of Ignorance. This is a separate normative premise about impartiality, not a consequence of the aggregation logic itself. A student who conflates the theorem with the Veil of Ignorance argument misses this distinction; the theorem allows for elitist weighting just as easily as egalitarian weighting, provided the Pareto condition is met.

  Conversely, the theorem is accused of being "question-begging" regarding utility measurement. For the summation $\sum a_i U_i$ to be meaningful, the individual utility functions $U_i$ must be cardinally comparable. They must be measured on a common scale with a common zero point and unit. However, von Neumann–Morgenstern utilities are only unique up to positive affine transformations (scaling and shifting). The theorem assumes we can already fix these scales interpersonally before aggregation occurs. The normative work, therefore, is not done by the aggregation logic, but by the prior commitment to a specific method of interpersonal comparison. If one denies that such comparisons are meaningful or possible, the theorem cannot get off the ground. Thus, the theorem does not justify utilitarianism from thin air; it shows that *if* you accept cardinal comparability and Pareto, you are committed to a linear aggregation.

  The second challenge involves prioritarianism. A prioritarian holds that benefits to the worse-off matter more than benefits to the better-off. Formally, this is often represented by applying a concave transformation function $f$ to individual utilities before summing: $W = \sum f(U_i)$. This creates a tension with Harsanyi's framework. In Harsanyi's theorem, $U_i$ represents the individual's expected utility. If the social welfare function applies a non-linear transformation $f$ to these $U_i$ values, the resulting social ordering generally violates the von Neumann–Morgenstern independence axiom at the social level.

  The crux of the issue is linearity. Harsanyi requires the social ordering to satisfy expected utility theory over the same prospects that define individual utilities. Expected utility requires linearity in probabilities. If the social evaluator is averse to inequality in the distribution of $U_i$, they are effectively treating the *distribution* of utility as a source of risk or value distinct from the individual evaluations. But if individuals already satisfy vNM axioms, their $U_i$ captures their attitude toward risk. For the social planner to apply a further concave transformation is to impose a second layer of risk aversion (inequality aversion) that conflicts with the linearity required by the social vNM axioms.

  Therefore, a prioritarian cannot accept the Aggregation Theorem in its entirety. They must surrender the assumption that the *social* ordering satisfies the von Neumann–Morgenstern independence axiom. They can accept that individuals are vNM rationalizers and that the Pareto principle holds, but they must deny that the social preference ordering over lotteries must itself conform to expected utility maximization. By rejecting the social vNM axioms, the prioritarian escapes the requirement for linearity, allowing for the concave transformation necessary to prioritize the worse-off. Alternatively, they could reject welfarism itself, but within the welfarist framework, the casualty is the rationality of the social ordering.

  In conclusion, Harsanyi's theorem is a conditional constraint: it limits the form of social choice given strong assumptions about rationality and comparability. It does not prove utilitarianism without the added moral premise of equal weights. Furthermore, it is structurally hostile to prioritarianism because prioritarianism requires a non-linear aggregation that violates the social expected utility axiom. The normative work lies not in the math, but in the decision to accept or reject the axioms of rationality and comparability that the math presupposes.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Distinction between Theorem and Moral Argument (4 marks)**
  *   **Full Marks:** Clearly states that the theorem proves linearity ($\sum a_i U_i$) but does not determine the weights $a_i$. Identifies that equal weights require a separate moral premise (e.g., Veil of Ignorance/symmetry).
  *   **Weaker Answer:** Fuses the Aggregation Theorem and the Original Position argument into a single premise, claiming the theorem itself proves equal weighting.

  **2. The "Question-Begging" Charge (Cardinal Comparability) (4 marks)**
  *   **Full Marks:** Explains that the theorem requires individual utilities to be fixed on a common cardinal scale *before* aggregation. Notes that vNM utilities are only unique up to affine transformation, so interpersonal comparison is an external assumption, not a result.
  *   **Weaker Answer:** Claims the theorem generates interpersonal comparability or fails to mention that utility scales must be fixed prior to the theorem's application.

  **3. The "Too Weak" Charge (Arbitrary Weights) (4 marks)**
  *   **Full Marks:** Explains that without a symmetry argument, the theorem is consistent with any Paretian weighting (including elitist ones). The normative work is in selecting the weights, not the additive form.
  *   **Weaker Answer:** Assumes the additive form implies egalitarianism automatically, or treats the weights as mathematically determined by the theorem.

  **4. Prioritarianism and Concave Transformations (4 marks)**
  *   **Full Marks:** Identifies that prioritarianism requires a non-linear (concave) function of individual utilities ($W = \sum f(U_i)$). Explains that this conflicts with the linearity required if the social ordering is to satisfy expected utility axioms over the same prospects.
  *   **Weaker Answer:** Vaguely states that Rawls/prioritarians "dislike risk" without explaining the structural conflict between concave transformation and linear aggregation.

  **5. Identifying the Surrendered Axiom (4 marks)**
  *   **Full Marks:** Explicitly states that the prioritarian must reject the assumption that the **social ordering satisfies the vNM independence/expected utility axioms**. (Alternatively, they reject that individual vNM utilities are the sole currency, but rejecting social vNM is the standard technical response).
  *   **Weaker Answer:** Says the prioritarian rejects the Pareto principle or claims they simply "prefer maximin" without identifying the structural axiom (Social vNM) that must be dropped to allow non-linearity.

  **Differentiation: A vs. B**
  *   **Solid B:** Successfully distinguishes the theorem from the Veil of Ignorance argument and identifies that prioritarianism conflicts with linearity. May be slightly vague on *which* specific axiom breaks (e.g., says "social rationality" rather than "social vNM independence").
  *   **Clear A:** Precisely isolates the **Social Independence Axiom** as the necessary casualty for prioritarianism. Clearly articulates that the "normative work" is located in the *input* (comparability/weights) and the *axiom choice* (social vNM), not the aggregation derivation itself. Demonstrates understanding that individual risk attitudes (captured in $U_i$) are distinct from social inequality aversion (captured in $f$).
