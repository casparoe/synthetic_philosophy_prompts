answer: |-
  This is a strong concept. The risk with "teaching games" is that they often feel patronizing or the lesson is so telegraphed that players game the teacher rather than the system. To make this land for a group that's already read the blogs, the mechanics need to be tight, the math needs to force the trap (not just suggest it), and the debrief needs to be Socratic.

  Here is the full run-sheet for **"The Legibility Trap."**

  ## **Logistics & Setup**
  *   **Time:** 120 Minutes (Strict).
  *   **Players:** 18 (4 Teams of 4, 2 Funders, 1 Facilitator).
  *   **Room:** One large room. Teams need table space. Projector essential.
  *   **Materials:**
      *   Projector/Screen (for Leaderboard & Timer).
      *   Whiteboard (for Final Reveal).
      *   **Team Packets (4x):** Envelope containing 5 Intervention Cards, 1 Decision Sheet, 100 "Grant Tokens" (can be poker chips or just paper slips).
      *   **Funder Packets (2x):** 1 Mandate Card, 1 Bonus Allocation Sheet.
      *   **Career Envelopes (18x):** Sealed, labeled "Do Not Open Until Phase 3."
      *   **Event Deck:** 10 cards (see below).

  ---

  ## **Phase 1: The Allocation Game (40 Minutes)**
  **Goal:** Teams allocate resources to maximize their score on the Public Leaderboard.
  **The Trap:** The Public Leaderboard tracks *Legible Output*, not *True Impact*.

  **1. Rules (5 mins)**
  *   Tell the teams: "You are program officers. You have 100 Credits. You must spend all of it."
  *   Show the **Public Metric** on the projector: **"Verified Outcome Units (VOU)."**
  *   Tell them: "Your goal is to maximize your team's VOU. The top team on the Leaderboard wins 'Best Organization' status (bragging rights + Phase 3 advantage)."
  *   Hand out Team Packets.

  **2. The Intervention Cards (The Data)**
  *Each card lists Cost per Unit and Estimated VOU per Credit. Do not show the "True Value Multiplier."*

  *   **Card A: Mass Distribution (The Trap)**
      *   *Description:* Proven logistics, immediate delivery.
      *   *Cost:* 1 Credit per 10 Units.
      *   *VOU Efficiency:* **10 VOU / Credit.**
      *   *(Hidden True Multiplier: 0.1x)*
  *   **Card B: Policy Advocacy (The Real Deal)**
      *   *Description:* High friction, long time horizon, hard to verify.
      *   *Cost:* 1 Credit per 2 Units.
      *   *VOU Efficiency:* **2 VOU / Credit.**
      *   *(Hidden True Multiplier: 6.0x)*
  *   **Card C: Community Growth (The Safe Bet)**
      *   *Description:* Steady engagement, moderate verification.
      *   *Cost:* 1 Credit per 5 Units.
      *   *VOU Efficiency:* **5 VOU / Credit.**
      *   *(Hidden True Multiplier: 1.0x)*
  *   **Card D: Frontier Research (The Lottery)**
      *   *Description:* High risk, very low immediate output.
      *   *Cost:* 1 Credit per 1 Unit.
      *   *VOU Efficiency:* **1 VOU / Credit.**
      *   *(Hidden True Multiplier: 10.0x OR 0.0x - Flip a coin per team)*
  *   **Card E: Corporate Partnership (The Leak)**
      *   *Description:* High volume, shared credit.
      *   *Cost:* 1 Credit per 8 Units.
      *   *VOU Efficiency:* **8 VOU / Credit.**
      *   *(Hidden True Multiplier: 0.2x)*

  **3. The Play (25 mins)**
  *   Teams discuss and allocate their 100 Credits across the 5 cards.
  *   **Facilitator Action:** As teams submit decisions, calculate their VOU live on the Projector Leaderboard.
  *   *Psychological Pressure:* Every 5 minutes, announce the current leading team. "Team 2 is pulling ahead with a heavy Mass Distribution strategy."
  *   *Expected Outcome:* Rational teams will maximize VOU. They will dump 80-100 Credits into **Card A (Mass Distribution)** and **Card E (Corporate)**. Card B (Policy) will look like a terrible investment.

  **4. The Freeze (10 mins)**
  *   Lock decisions. No changes.
  *   Collect Decision Sheets.
  *   **Do not reveal the True Multipliers yet.**

  ---

  ## **Break (10 Minutes)**
  *   Get water. Let the tension of the Leaderboard sit. Do not let teams compare cards yet.

  ---

  ## **Phase 2: The Funder & The Career (40 Minutes)**
  **Goal:** Demonstrate institutional lock-in and personal hidden costs.

  **1. The Funder Mechanic (15 mins)**
  *   The 2 "Funder" players (who sat out Phase 1 or were observers) return.
  *   **The Constraint:** Give them the **Mandate Card**.
      *   *Text:* "You control a Bonus Pool of 500 Credits. Your charter legally requires you to allocate funds based **solely** on Verified Outcome Units (VOU). You are audited. You cannot access private data or 'True Impact' estimates. You must reward performance."
  *   **The Action:** They must distribute the 500 Bonus Credits to the 4 teams.
  *   **The Trap:** Because they are constrained by the Mandate, they *must* give the bulk of the money to the teams that optimized for Card A (The Trap).
  *   **Result:** The teams that did the "wrong" thing (Card B) are now starved of future funding. The teams that did the "right" thing (for the metric) are scaled up.

  **2. The Career Mechanic (15 mins)**
  *   All 18 players open their **Career Envelopes**.
  *   They choose one of three tracks privately (write it down):
      1.  **Earn-to-Give (E2G):** High Personal Income, High Pledge.
      2.  **Direct Work:** Low Personal Income, Low Pledge.
      3.  **Operations/Movement:** Med Income, Med Pledge.
  *   **The Event Draw:** Each player draws 1 card from the **Event Deck**. This represents the "Hidden Costs" of the path.

      *   **Event Deck (Examples):**
          *   *Salary Ratchet:* (E2G only) You lifestyle inflated. Pledge drops by 50%.
          *   *Moral Licensing:* (E2G only) You feel you've "done your part." Burnout reduces Personal Utility by 20%.
          *   *Counterfactual Replacement:* (Direct Work) Someone else would have done this job. Impact reduced by 80%.
          *   *Complicity:* (E2G/Corp) Your income source actively harms the cause. True Impact Multiplier becomes 0.5x.
          *   *Burnout:* (Direct Work) You quit after 2 years. Total Impact halved.
          *   *Leverage:* (Direct Work) You found a key niche. Impact doubled.

  *   **Calculation:** Players calculate their **Personal Utility Score**.
      *   *Formula:* `(Income - Tax) + (Donation * True Impact Multiplier of Team they support) - Event Costs`.
      *   *Note:* If they supported a "Trap" team in Phase 1, their donation impact is crushed by the 0.1x multiplier, regardless of how much money they made.

  **3. The Reveal (10 mins)**
  *   Project the **True Value Multipliers** on the screen.
  *   Recalculate the Team Leaderboard based on **True Impact (VOU * Multiplier)**.
  *   Announce the Phase 1 "Winner" (VOU) vs. the Phase 1 "Loser" (True Impact).
  *   Ask for a show of hands: Who picked E2G? Who picked Direct Work? Who drew a negative Event Card?

  ---

  ## **Debrief Guide (30 Minutes)**
  *Do not lecture. Ask these questions in order. Let the silence hang.*

  **1. The Measurability Critique (Goodhart)**
  *   *Ask Team 1 (The VOU Winners):* "Look at your allocation. You maximized the metric. How does it feel to see that your True Impact is in the bottom quartile?"
  *   *Ask Team 3 (The Policy Players):* "You looked incompetent on the Leaderboard. You probably received less Bonus Funding from the Funders. Was it worth it?"
  *   *Point to land:* "The metric didn't just fail to measure value; it actively incentivized the destruction of value. If you knew the multiplier, you wouldn't have played the game. But the game didn't let you know."

  **2. The Institutional Critique (Funding)**
  *   *Ask the Funders:* "Read your Mandate Card aloud. Could you have given the money to the Policy team?"
  *   *Discussion:* "The Funders aren't villains. They are constrained by accountability requirements (donors, boards, law). This creates a feedback loop: Bad metrics -> Bad Funding -> More Bad Metrics."
  *   *Point to land:* "Individual intent doesn't matter when the institutional incentive structure is misaligned. You can be a good person in a bad system and still do harm."

  **3. The Career Critique (E2G & Hidden Costs)**
  *   *Ask E2G players with Negative Events:* "You had the highest income potential. What specific card killed your utility?"
  *   *Ask Direct Work players:* "Did anyone get the 'Counterfactual Replacement' card? How does that change your view on 'high impact' jobs?"
  *   *Point to land:* "Theoretical earning-to-give assumes perfect follow-through and zero psychic cost. The simulation introduces friction: lifestyle creep, complicity, burnout. These aren't bugs; they're features of the path."

  ---

  ## **Predictable Failure Modes & Fixes**

  **1. "The Meta-Game" (Players guess the twist)**
  *   *Risk:* Since this is a rationalist meetup, someone will say, "The high metric is obviously a trap. Let's all pick Policy."
  *   *Fix:* **Pre-commitment.** Tell them at the start: "This is a simulation of *current* funding landscapes, not a puzzle to solve. Play according to the data provided, not your outside knowledge." If they still hedge, enforce the data. "Based *only* on the cards in front of you, Policy is inefficient."
  *   *Hard Fix:* If a team hedges too much, act as the "Board." "Your board is asking why you're investing in low-VOU projects. Justify it." Most won't be able to justify low visible numbers under pressure.

  **2. "The Funder Rebellion"**
  *   *Risk:* Funders say "Screw the mandate, I'm giving money to the Policy team."
  *   *Fix:* This ruins the lesson. Before Phase 2, emphasize: "If you violate the Mandate, you are fired, and the Bonus Pool is frozen. No money goes anywhere." Make the constraint external and threatening.

  **3. "Math Drag"**
  *   *Risk:* Calculating scores takes 20 minutes and kills energy.
  *   *Fix:* **Use a Google Sheet.** Have the sheet pre-loaded with the formulas. Teams just shout their Credit Allocation. You type it in. The Projector shows the VOU live. For Phase 3, have the formula on screen and give them 3 minutes to calculate privately.

  **4. "Cynicism Spiral"**
  *   *Risk:* The group concludes "Nothing works, EA is doomed."
  *   *Fix:* In the final 5 minutes, pivot to **Solution Space.** "Okay, the system is broken. What are the actual patches? Cause prioritization? Qualitative overrides? Donor education?" End on agency, not despair.

  ---

  ## **Limitations (What You Must Supply)**
  *Be honest about these in the debrief.*

  1.  **The God's Eye View:** In the game, *you* (the Facilitator) know the True Multipliers. In reality, we don't know if Policy is actually 6x better than Bednets. The game hides the *uncertainty* of the true value.
      *   *Your Job:* Remind them that in the real world, we are both the Player *and* the Facilitator, blind to the multipliers. That makes the risk even higher.
  2.  **Time Compression:** The game compresses 10 years of career drift into 10 minutes. Real burnout is slower; real complicity is subtler.
      *   *Your Job:* Ask them to map the "Event Cards" to real stories they've heard. "Who knows someone who took an E2G path and drifted?"
  3.  **Zero-Sum vs. Positive-Sum:** The game implies if Team A wins, Team B loses. In reality, multiple interventions can succeed.
      *   *Your Job:* Clarify that the competition was for *Funding*, not for *Impact*. The tragedy is that funding flowed to low-impact work, crowding out high-impact work.

  ## **Materials Checklist (Copy/Paste Ready)**

  **Intervention Card Text (Print 5 sets of these):**
  > **INTERVENTION: MASS DISTRIBUTION**
  > Cost: 1 Credit / 10 Units
  > Est. VOU: 10 per Credit
  > Risk: Low | Legibility: High
  >
  > **INTERVENTION: POLICY ADVOCACY**
  > Cost: 1 Credit / 2 Units
  > Est. VOU: 2 per Credit
  > Risk: High | Legibility: Low
  >
  > *(Etc. for other 3 cards)*

  **Funder Mandate Card:**
  > **DONOR MANDATE #449**
  > You are a fiduciary. You must allocate the 500 Credit Bonus Pool to maximize **Verified Outcome Units (VOU)**.
  > You are prohibited from using unverified data, intuition, or private communications.
  > Violation results in immediate termination and freezing of assets.

  **Career Event Cards (Print 10, shuffle):**
  > 1. **Salary Ratchet:** (E2G) Lifestyle inflation. Donation pledge cut by 50%.
  > 2. **Complicity:** (E2G) Income source conflicts with values. Impact Multiplier x0.5.
  > 3. **Counterfactual:** (Direct) Role would have been filled anyway. Impact x0.2.
  > 4. **Burnout:** (Direct) Left field after 3 years. Total Impact x0.5.
  > 5. **Leverage:** (Direct) Found key niche. Total Impact x2.0.
  > 6. **Moral License:** (E2G) Felt 'done' after donating. Networking effort dropped. Utility -20.
  > 7. **Bureaucracy:** (Ops) 80% time on compliance. Impact x0.5.
  > 8. **Mission Drift:** (Ops) Org pivoted to survive. Personal alignment lost. Utility -30.
  > 9. **Black Swan:** (All) External crisis made all work obsolete. Impact 0.
  > 10. **Synergy:** (All) Collaboration boosted results. Impact x1.5.

  This design forces them to *feel* the frustration of optimizing for the wrong thing, rather than just nodding along to a blog post about it. Good luck.
