      *   *Optimization:* Phase 1 (30 min), Break (10), Phase 2 (Funder + Career combined) (40 min), Debrief (40 min). Wait, debrief needs to be long.
      *   *Timeline:*
          *   0:00-0:10: Intro & Rules.
