      *   *Result:* Team 1 gets more resources to do low-value work. Team 2 gets starved.

  5.  **Addressing the Career Phase (E2G):**
      *   Need to make the "Hidden Costs" feel real, not just "oops you lost points."
      *   *Mechanic:* Players pick a track. They get a base score. Then they draw a "Reality Card."
