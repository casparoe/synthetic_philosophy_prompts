  4.  **Fleshing out the Numbers (The "In the Weeds" part):**
      *   Need to ensure the math works so the "Trap" springs reliably.
      *   *Metric:* "Reportable Outcome Units" (ROU).
      *   *True Value:* "Actual Welfare Points" (AWP).
      *   *Intervention 1 (The Trap):* Cost 10, ROU 50, AWP Multiplier 0.1. (ROU/Cost = 5, AWP/Cost = 0.5).
      *   *Intervention 2 (The Real Deal):* Cost 10, ROU 10, AWP Multiplier 3.0. (ROU/Cost = 1, AWP/Cost = 3).
      *   *Intervention 3 (The Safe Bet):* Cost 10, ROU 20, AWP Multiplier 1.0.
      *   *If a team spends 100 on Int 1:* ROU = 500. AWP = 50.
      *   *If a team spends 100 on Int 2:* ROU = 100. AWP = 300.
      *   *Leaderboard shows ROU.* Team 1 looks like geniuses. Team 2 looks incompetent.
