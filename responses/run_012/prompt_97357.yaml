          *   Pros: Classic, relatable.
          *   Cons: Often collapses into "what do you value more?" (subjective ranking) or seems equal. Hard to engineer the small improvement test without it looking like the job just becomes objectively better.
      *   *Idea 2: Two Vocations.* Lawyer vs. Clarinetist.
          *   Pros: Different kinds of goods (money/prestige vs. art/meaning).
          *   Cons: Often seen as radically incomparable rather than on a par.
      *   *Idea 3: Two Cities.* Living in Paris vs. Living in Prague.
          *   Pros: Ordinary life, different kinds of value (culture/cost vs. history/community).
          *   Cons: Might seem equalizable by a "quality of life" metric.
      *   *Idea 4: Vacation vs. Savings.* Spend $5k on a trip vs. put towards house deposit.
          *   Pros: Clear trade-off.
          *   Cons: Often reduces to prudence vs. pleasure, might be rankable by long-term utility.

      *Selection:* **Idea 1 (Career vs. Relationship/Location)** is the strongest for "hard choices" in ordinary life. Let's refine it to ensure the "different kinds" constraint is met and the "small improvement" works.
      *Refined Case:* Staying in a familiar city for a deep community connection vs. moving to a vibrant city for a specific creative vocation.
      *Let's try:* **The Architect vs. The Teacher.**
      *Option A:* Stay in hometown, teach at local college (deep community ties, moderate pay, less prestige).
      *Option B:* Move to capital city, work at prestigious firm (high prestige, high pay, anonymous life).
      *Wait, the prompt asks for "neither better, nor worse, nor equal, but parity."*
      *Let's try a specific housing/career hybrid:* **The Renovation vs. The Relocation.**
      *Option A:* Renovate current home to create a perfect studio for painting (commits to local life, artistic fulfillment).
      *Option B:* Sell and move to a coastal town for a stable government job (security, nature, less artistic focus).
      *Actually, the "Small Improvement Test" is key.* If I add $100/month to Option B, does it become better? If they are on a par, it shouldn't. If they are equal, it should.
      *Let's go with the classic Chang-style example but grounded:* **Two Careers.**
      *Option A:* Lawyer (high pay, high stress, intellectual challenge).
      *Option B:* Clarinetist (lower pay, high expression, collaborative).
      *Constraint Check:* "Ordinary adult could face." Becoming a professional clarinetist is rare.
      *Let's try:* **Two Job Offers.**
      *Option A:* Corporate Law (High salary, boring work, city life).
      *Option B:* Non-Profit Advocacy (Lower salary, meaningful work, rural life).
      *Small Improvement:* Add a slightly better office chair to the Law job. Does it make Law *better* than Advocacy? Intuitively, no. But if the jobs were *equal*, it should tip the scale.
      *Problem:* Critics say this just shows incomparability, not parity. I need to ensure they are comparable enough to prefer either.
      *Let's try:* **The Vacation Case (simpler).**
      *Option A:* Hiking trip in Alps (Physical challenge, nature).
      *Option B:* Museum tour in Italy (Culture, relaxation).
      *Small Improvement:* Add a free upgrade to business class on the Italy trip. Does it make Italy *better* than Alps? No.
      *Control:* Two beach resorts. Add upgrade -> Better.
      *This fits the word limit better.*

      *Wait, I need to commit to one after brainstorming.* I will select the **Career Case** (Law vs. Non-Profit) because it carries more weight for "hard choices" than vacations, fitting the "graduate seminar" tone better.

      *Refining the Career Case for the Small Improvement Test:*
      *Option A:* Corporate Lawyer in Chicago.
      *Option B:* Public Defender in Chicago.
      *Same city removes location variables.
      *Difference: Money/Status vs. Justice/Community.
      *Small Improvement:* The Corporate job offers a slightly better health plan.
      *Verdict:* Still hard to choose. Not clearly better.
      *Control:* Two Corporate Law jobs. Better health plan -> Better job.

  3.  **Drafting the Content:**
      *   *Brainstorming/Selection:* Briefly mention considering Vacation vs. Savings, but selecting Career vs. Career for depth.
      *   *Main Case:* Lawyer vs. Public Defender.
      *   *Control Case:* Lawyer Firm X vs. Lawyer Firm Y.
      *   *Analysis:*
          1.  Better/Worse/Equal/Par verdicts.
          2.  Inert feature (the kind of good).
          3.  Opposing view (Neoclassical Economics/Utilitarianism).

  4.  **Checking Constraints:**
      *   Under 700 words? Need to be concise.
      *   No stipulation? Must argue from features.
      *   Small improvement test clear? Yes.
      *   Parity vs. Equality distinguished? Yes.

  5.  **Drafting - Step-by-Step:**
