      *Final Polish:* Ensure the tone is philosophical but clear.

      *Wait, one more check on the "Inert Feature".* The feature is the *heterogeneity of the covering values*. If the options share the same covering value (e.g., both maximize wealth), the improvement works. If they maximize different values (wealth vs. justice), the improvement in wealth is inert regarding the overall comparison.

      *Okay, ready to write.*

