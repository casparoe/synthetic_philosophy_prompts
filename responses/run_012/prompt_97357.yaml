      *If A and B are on a par, and A+ is A plus a small improvement, A+ is still on a par with B (usually). It doesn't become *better* than B. This is the crux of the Small Improvement Argument.*
      *If A = B (equality), then A+ > B.*
      *So I need to show A+ is not > B.*

      *Let's finalize the case:*
      *A: Corporate Law (Wealth).*
      *B: Public Defense (Justice).*
      *A+: Corporate Law + slightly higher salary.*
      *Intuition: A+ is not better than B.*
      *Control: A (Corp Law) vs C (Corp Law). A+ is better than C.*

      *Opposing View:* Rational Choice Theory (completeness of preference ordering).

      *Word Count Management:*
      *Brainstorm/Commit: 50 words.*
      *Cases: 200 words.*
      *Analysis: 400 words.*
