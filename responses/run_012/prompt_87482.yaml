prompt: |-
  I'm the tech lead on a small team building an agent that handles insurance claims end to end — it can approve, deny, or settle, and mostly nobody looks at what it does. Legal keeps asking "what stops it from screwing people," and I dont want a values statement, I want something my engineers can put in the spec. So: write me a decision procedure the agent runs before it denies or lowballs a claim, as an ordered list of checks, each with a clear pass/fail and a note on where it stops with a hard no and where it has to hand the file to a human. Build it around the one idea I actually believe here, that you mustn't treat someone merely as a means — I care about the "merely", i.e. what separates using someone as a means (fine, that's what a claim is) from treating them merely as one, and what counts as a person's real consent to a settlement versus consent the system has worn down. I've seen a version of this where the test is whether the person could go along with what you're doing given only a true description of it — if that's usable, build the procedure on it; if not, tell me what to use instead. Then run the procedure on three cases: a claim the model flags as probably fraudulent but the policyholder swears is real; a settlement offer to someone who doesn't know the claim is worth triple; and a routine denial of a claim that's denied only because the person missed a deadline they couldn't have met. For each, say what the procedure spits out and, honestly, where it's just dressing up a judgment call. One of the cases should come out in a way I won't like — tell me which and why I should live with it. And tell me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Tech Lead of a small team building an end-to-end insurance claims agent (approve, deny, settle).
      *   **Problem:** Legal is worried about the agent "screwing people." The user wants a concrete technical spec, not a values statement.
      *   **Core Philosophy:** Kantian ethics ("never treat someone merely as a means"). Specifically, the distinction between *using* someone (acceptable in a transaction) vs. *merely using* them (unacceptable).
      *   **Proposed Test:** "Could the person go along with what you're doing given only a true description of it?" (This is essentially the Formula of Humanity/Publicity test).
      *   **Deliverables:**
          1.  An ordered list of checks (decision procedure) with Pass/Fail, Hard Stop (No), and Human Handoff conditions.
          2.  Application of this procedure to three specific cases.
          3.  Identification of where the procedure is just "dressing up a judgment call."
          4.  Identification of one outcome the Tech Lead won't like (and why they should accept it).
          5.  Limitations of the procedure.

  2.  **Deconstruct the Core Philosophy:**
      *   *Using as a means:* In insurance, the company uses the claimant to validate risk models, process data, etc. The claimant uses the company for financial protection. This is mutual instrumentality, which is fine.
      *   *Merely as a means:* This happens when the claimant's agency is bypassed, obscured, or coerced. They become an object to be processed rather than a participant in a contract.
      *   *The "True Description" Test:* If the claimant knew *exactly* why the decision was made (including the business logic, the data used, the incentives), would they still rationally accept it as part of the agreed-upon game? If the answer is "No, because you hid the rules," it's *merely* as a means. If the answer is "Yes, I agreed to these terms," it's *using* as a means.
      *   *Consent:* Real consent requires information parity and lack of coercion. "Worn down" consent (fatigue, confusion, opacity) is invalid.

  3.  **Drafting the Decision Procedure (The Spec):**
      *   Needs to be actionable for engineers.
      *   Needs to incorporate the "True Description" test.
      *   Needs clear triggers for Human Handoff.
      *   *Structure:* Pre-computation checks -> Decision Logic -> Transparency/Explanation Check -> Final Authorization.

      *   *Drafting Checks:*
          1.  **Information Symmetry Check:** Does the user have access to the same policy clauses and evidence we are using? (Prevents surprise denials).
          2.  **Coercion/Fatigue Check:** Has the system nagged them? Is the offer expiring unnaturally fast? (Prevents "worn down" consent).
          3.  **The "True Description" Simulation (The Core):** Can the system generate a natural language explanation that links the decision *directly* to the policy wording without euphemism? If the explanation requires hiding the real reason (e.g., "we deny because it's too expensive" vs "we deny because clause 4.b"), it fails.
          4.  **Recourse Availability:** Is there a clear, non-punitive path to appeal? (Restores agency).

      *   *Refining for "Hard No" vs. "Human Handoff":*
          *   Hard No: System cannot proceed automatically.
          *   Human Handoff: System flags for review.

  4.  **Developing the Three Cases:**

      *   *Case 1: Probable Fraud vs. Policyholder Swears Real.*
          *   System logic: High fraud probability -> Deny/Investigate.
          *   Procedure application: Can we explain *why* without revealing fraud detection secrets that aid fraudsters? This is the tension.
          *   Outcome: Likely Human Handoff. You can't give the "true description" of a fraud model without compromising security.
          *   *Dislike factor:* Tech Lead might want full automation here.

      *   *Case 2: Lowball Settlement (Info Asymmetry).*
          *   System logic: Offer $5k. Real value $15k. User doesn't know.
          *   Procedure application: "True Description" test. If the explanation says "This is the calculated value based on data," but hides that the data is skewed to minimize payout, it fails the "merely as a means" test.
          *   Outcome: Hard No / Human Handoff. The system cannot ethically settle if it knows the value is higher and hides it.
          *   *Dislike factor:* This costs money.

      *   *Case 3: Missed Deadline (Uncontrollable).*
          *   System logic: Policy says 30 days. User submitted day 31. Reason: Hospitalized.
          *   Procedure application: Strict rule adherence vs. Agency. Did the user *consent* to strict liability regardless of circumstance?
          *   Outcome: This is the tricky one. If the policy is clear, strict adherence is "using as a means" (contractual). If the system ignores context, it might be "merely."
          *   *Selection for "Won't Like":* I need to pick the one where the ethical procedure forces a costly or inefficient outcome that the business hates. Case 2 is the strongest candidate for "costs money." Case 3 is "costs money/reputation." Case 1 is "risk."
          *   *Decision:* Let's make Case 2 the one they won't like because it directly attacks the profit margin logic of "settlement optimization." Or Case 3, where the system *must* pay despite the rule, undermining the rule engine. Let's go with Case 2 (Lowball) as the "won't like" because it challenges the core business model of information asymmetry. Actually, the prompt asks for *one* case to come out in a way the Lead won't like. Case 2 is the most obvious ethical violation. Case 3 is a "rule vs. mercy" conflict. Let's make Case 3 the "won't like" because it forces the system to override hard-coded policy rules, which engineers hate (non-determinism).
          *   *Wait, re-reading:* "One of the cases should come out in a way I won't like — tell me which and why I should live with it."
          *   If I make Case 2 (Lowball) result in "Hard No, must offer fair value," the Lead won't like losing the savings.
          *   If I make Case 3 (Deadline) result in "Pay anyway," the Lead won't like breaking the rules.
          *   Let's choose Case 2. It strikes at the heart of "settlement optimization." The procedure will force disclosure or fair valuation.
          *   *Correction:* Actually, the most poignant "won't like" is usually where the ethical constraint prevents the *automation* itself. If the procedure forces a Human Handoff on high-volume low-value claims, that breaks the business case. Let's look at Case 1 (Fraud). If the "True Description" test requires explaining *why* it's fraud, you can't automate it without tipping off fraudsters. So it *must* go to human. The Lead wants automation. This is a good friction point.
          *   *Better yet:* Case 2 (Lowball). If the test says "You cannot settle if you know it's undervalued," that kills the "settlement savings" KPI. That's a business killer. I'll use Case 2 for the "won't like" outcome.

  5.  **Refining the "True Description" Test for Engineering:**
      *   How do we code "Could they go along with this?"
      *   We can't code subjective consent.
      *   We *can* code **Disclosure Completeness**.
      *   *Check:* Does the `decision_reason_code` map 1:1 to a `policy_clause`?
      *   *Check:* Is there a `hidden_weight_factor`? (e.g., denying because LTV is high, not because of the claim itself).
      *   *Check:* Is the `explanation_text` readable at an 8th-grade level without euphemisms?

  6.  **Writing the Response:**
      *   **Tone:** Professional, direct, engineering-focused, philosophical but grounded.
      *   **Section 1: The Procedure.** (The "Spec").
      *   **Section 2: The Cases.** (Application).
      *   **Section 3: The "Won't Like" Outcome.** (Honesty).
      *   **Section 4: Limitations.** (Humility).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "True Description" test codable?
      *   *Fix:* Frame it as an "Explainability & Symmetry Audit." The system must generate the explanation *before* finalizing. If the explanation requires logic not present in the policy (e.g., "we deny because you are high risk generally"), it fails.
      *   *Critique:* Is the Kantian distinction clear?
      *   *Fix:* Explicitly define "Merely" in the preamble as "Opacity + Coercion."
      *   *Critique:* Did I answer the specific prompt about "dressing up a judgment call"?
      *   *Fix:* Ensure I point out exactly where the code stops and human ethics begin in the case studies.

  8.  **Final Polish:** Check against the "Hard No" vs "Human Handoff" requirement. Ensure the "Won't Like" case is clearly identified.

      *(Self-Correction on Case 2)*: If the system *knows* the claim is worth triple, how does it know? If it knows, why offer less? Because it's betting the user doesn't know. The procedure must flag this information asymmetry. If the system possesses valuation data it does not share, it fails the "True Description" test.
      *(Self-Correction on Case 3)*: Missed deadline. If the policy is strict, denying is "following rules." But if the rule itself is unconscionable in context, is it Kantian? Kant says follow the universal law (contract). But if the contract was signed under duress/ignorance... Let's stick to the prompt's focus: "Consent the system has worn down." Missing a deadline due to hospitalization isn't "worn down," it's incapacitated. Denying this treats them as a number. I'll make this the "Human Handoff" case.
      *(Decision on "Won't Like")*: I will make Case 2 (Lowball) the one the Lead won't like. Why? Because it forces the company to leave money on the table. It forces the agent to act as a fiduciary, which insurance adjusters are *not*. This is the hardest pill to swallow.

      *Wait, one more check:* The prompt asks for the procedure to be built around the "True Description" test.
      *Test:* "Could the person go along with what you're doing given only a true description of it?"
      *Implementation:* The `Generate_Reasoning` module must output the *actual* weights and logic. If the logic includes "profit margin protection," it fails.

      *Let's finalize the "Won't Like" case.*
      Case 2 is the most impactful. If the procedure says "You cannot offer $5k when your internal model says $15k," that destroys the "negotiation" strategy of insurance. I will select this one.

      *Wait, looking at Case 1 (Fraud).* If the system flags fraud, it usually doesn't tell the user "We think you are lying." It says "Further review needed." Is that a "True Description"? No. It's a lie by omission. So the procedure must flag this. This forces human intervention. This is also a good candidate for "won't like" because it stops automation on high-risk files.
      *Actually, Case 2 is stronger ethically.* Fraud denial is defensible (protecting the pool). Lowballing is predatory. I'll stick with Case 2 as the "won't like" because it hits the P&L directly.

      *Wait, looking at the prompt again:* "One of the cases should come out in a way I won't like."
      Okay, I need to make sure I explicitly state *why* they won't like it.
      Okay, ready to write.

      *Structure:*
      1.  **Preamble:** Define "Merely" in engineering terms (Opacity + Asymmetry).
      2.  **The Procedure:** 4-step check.
      3.  **The Cases:** Apply the steps.
      4.  **The Hard Truth:** Which one hurts.
      5.  **Limitations:** What this code can't fix.

      *Refining the "True Description" implementation:*
      Engineers can't code "Could they go along?"
      They *can* code: "Does the explanation contain any variable not visible to the user?"
      They *can* code: "Does the explanation rely on a policy clause that was highlighted during onboarding?"
      Let's make it concrete: **The Transparency Audit.**

