answer: |-
  ### The "Non-Merely" Decision Procedure (Spec v1.0)

  **Objective:** Prevent the agent from treating claimants *merely* as means.
  **Definition:** A claimant is treated *merely* as a means if the decision relies on **information asymmetry** (you know something they don't that changes the outcome) or **opaque coercion** (the process wears down their ability to refuse).
  **Operational Test:** The "True Description" Audit. Before any Deny or Settle action is committed, the system must generate the explanation sent to the user. If that explanation cannot be derived solely from data and policy clauses accessible to the user, the action is blocked.

  #### The Procedure (Ordered Checks)

  **Check 1: The Information Symmetry Audit**
  *   **Logic:** Compare the `decision_factors` (internal weights/data used to decide) against `user_disclosed_data` (what the user submitted) + `public_policy_text` (the contract).
  *   **Pass:** Every factor contributing >5% to the decision score exists in `user_disclosed_data` or `public_policy_text`.
  *   **Fail:** Decision relies on internal risk scores, historical profitability data, or external data sources not explicitly referenced in the policy.
  *   **Action:** **HARD NO.** Do not execute. Flag for Human Review.
  *   **Rationale:** If the reason relies on hidden data, you are betting on their ignorance. That is treating them merely as a means.

  **Check 2: The "No Euphemism" Generation Test**
  *   **Logic:** Generate the denial/settlement letter. Run a semantic similarity check against the raw `decision_logic_tree`.
  *   **Pass:** The letter explicitly cites the specific clause and the specific missing/invalid evidence. (e.g., "Denied per Clause 4.2 because receipt date is 31 days, limit is 30.")
  *   **Fail:** The letter uses vague language (e.g., "Does not meet coverage guidelines," "We are unable to approve at this time").
  *   **Action:** **HUMAN HANDOFF.** The system is not allowed to obscure the logic.
  *   **Rationale:** Obscurity prevents the user from contesting the decision, removing their agency.

  **Check 3: The Coercion/Fatigue Limit**
  *   **Logic:** Count `system_outbound_comms` vs `user_response_time` in the last 7 days. Check `offer_expiry_window`.
  *   **Pass:** User has had >48 hours to respond to the last offer. Expiry window is standard (e.g., 30 days).
  *   **Fail:** System has sent >3 reminders in 48 hours OR offer expiry is <7 days without cause.
  *   **Action:** **HARD NO.** Pause communications for 72 hours.
  *   **Rationale:** Rapid-fire comms and short windows are designed to wear down resistance ("worn down consent").

  **Check 4: The Recourse Visibility Check**
  *   **Logic:** Verify the `appeal_link` is active and the `appeal_deadline` is calculated from the *receipt* of this notice, not the incident date.
  *   **Pass:** Appeal window is open and clearly displayed in the same font size as the decision.
  *   **Fail:** Appeal path is buried, broken, or the window has effectively closed before the notice was read.
  *   **Action:** **HARD NO.** Fix the notice before sending.
  *   **Rationale:** A decision without a right to appeal is a command, not a contract interaction.

  ---

  ### Case Runs

  #### Case 1: The "Probable Fraud" Flag
  *   **Scenario:** Model flags claim as 85% likely fraudulent (pattern matching). Policyholder swears it's real.
  *   **Procedure Run:**
      *   *Check 1 (Symmetry):* **FAIL.** The decision relies on "pattern matching" and "historical fraud clusters." The user does not have access to the fraud model's training data or the specific pattern they triggered (for security reasons).
      *   *Check 2 (Euphemism):* **FAIL.** To pass Check 1, the system would have to say "You match a fraud pattern." It cannot say that without tipping off actual fraudsters. So it defaults to "Further review needed." This is vague.
      *   *Outcome:* **HUMAN HANDOFF.**
  *   **Where it's dressing up judgment:** The system knows it can't explain the real reason. The "Human Handoff" is just a polite way of saying "We need a person to lie by omission professionally." A human adjuster can say "We need more documentation" while winking at the fraud suspicion. The code forces the handoff because it cannot ethically automate the opacity required for fraud detection.

  #### Case 2: The Lowball Settlement (Info Asymmetry)
  *   **Scenario:** Internal valuation model says claim is worth $15k. System is tuned to open at $5k, betting 80% of users accept without negotiation. User doesn't know the $15k figure.
  *   **Procedure Run:**
      *   *Check 1 (Symmetry):* **FAIL.** The `decision_factors` include `internal_valuation_cap` and `negotiation_buffer`. These are not in the policy text. The user cannot "go along" with a $5k offer if they knew the system acknowledges it's worth $15k.
      *   *Check 2 (Euphemism):* **FAIL.** The system cannot generate a letter saying "We offer $5k because we hope you don't know better." It will try to say "Based on our assessment..." which Check 2 flags as vague.
      *   *Outcome:* **HARD NO.** The agent cannot issue the $5k offer. It must either offer $15k or hand off to a human to negotiate.
  *   **Where it's dressing up judgment:** This isn't judgment; this is hard math. The system *knows* the value. Hiding it is a feature, not a bug, of standard claims processing. This procedure breaks that feature.

  #### Case 3: The Missed Deadline (Uncontrollable)
  *   **Scenario:** Policy requires notice within 30 days. User submitted day 31. User was hospitalized (proof provided). Policy allows waiver for "reasonable cause."
  *   **Procedure Run:**
      *   *Check 1 (Symmetry):* **PASS.** The rule (30 days) and the exception ("reasonable cause") are in the policy text.
      *   *Check 2 (Euphemism):* **PASS.** System can cite the date and the hospitalization record.
      *   *Check 3 (Coercion):* **PASS.**
      *   *Check 4 (Recourse):* **PASS.**
      *   *Outcome:* **APPROVE.** The system recognizes the hospitalization as valid data under the "reasonable cause" clause.
      *   *Wait, Alternative Path:* If the system is tuned to *deny* first to save costs, and the "reasonable cause" threshold is set artificially high (e.g., requires ICU, user was in general ward)...
      *   *Check 1 (Symmetry):* **FAIL.** If the internal threshold for "reasonable cause" is stricter than the plain text of the policy implies, Check 1 catches it.
      *   *Outcome:* **HUMAN HANDOFF.** The system cannot apply a stricter internal standard than the public policy without disclosing it.

  ---

  ### The Outcome You Won't Like

  **Case 2 (The Lowball Settlement).**

  **Why you won't like it:**
  This procedure effectively bans "settlement optimization" based on information asymmetry. Your business model likely relies on the delta between *what a claim is worth* and *what the average exhausted claimant will accept*. This spec forces your agent to act more like a fiduciary than an adversary. It requires the agent to disclose its internal valuation or, at minimum, prevents it from making an offer it *knows* is significantly below the calculated value of the claim.

  **Why you should live with it:**
  Because the alternative is regulatory suicide. If your agent is caught systematically lowballing based on hidden data, you aren't just looking at a lawsuit; you're looking at a class-action regarding "unfair claims settlement practices." The "True Description" test is a pre-emptive strike against the argument that your system is predatory. It costs you margin on the back end to save your license on the front end. If the agent can't explain the offer without hiding the math, it has no right to make the offer.

  ### What This Procedure Can't Do

  1.  **It Can't Fix Bad Policies:** If the policy itself is predatory (e.g., "We deny all claims over $10k"), this procedure will happily automate denials with perfect transparency. It ensures *process* integrity, not *substantive* justice.
  2.  **It Can't Measure Emotional Coercion:** Check 3 counts messages and time. It cannot detect that the language used is intentionally intimidating or that the UI design makes the "Accept" button green and the "Appeal" button grey. That requires UX ethics, not backend logic.
  3.  **It Can't Solve the Fraud Paradox:** As seen in Case 1, you cannot fully automate fraud detection ethically. Fraud detection *requires* opacity to work. This procedure admits that automation must stop where secrecy begins. You will still need humans for the messy, secretive work of denying people money because you suspect they are lying.

  ### Implementation Note for Engineers
  This is not a "values" module. This is a **constraint layer**. It sits between the Decision Engine and the Output Gateway. It does not care about the decision; it cares about the *justification*. If the justification cannot survive the light of day, the transaction does not leave the building.
