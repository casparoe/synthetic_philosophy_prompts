answer: |-
  # METAPHYSICS SEMINAR: THE STATUE AND THE LUMP
  **Starting Commitment:** *There is a statue and a lump of clay on the pedestal, occupying the same space, but they are not two objects in two different places.*

  ### DECISION TREE

  **1. Do composite material objects (like lumps or statues) exist at all?**
  *   **NO** ➔ **LEAF 1: Eliminativism**
  *   **YES** ➔ Go to Q2.

  **2. Are the statue and the lump two distinct objects sharing the exact same location?**
  *   **YES** ➔ **LEAF 2: Constitution View**
  *   **NO** (They are one object) ➔ Go to Q3.

  **3. (Case A: 3D Printer) If a printer creates the shape and matter simultaneously, is their identity absolute or sortal-relative?**
  *   **RELATIVE** (Same object, different sortals) ➔ **LEAF 3: Relative Identity**
  *   **ABSOLUTE** (Strictly one thing) ➔ Go to Q4.

  **4. (Case B: Eroded Rock) If a rock erodes into a shape and is later displayed as art, did the "statue" exist before the display?**
  *   **YES** (Temporal parts exist) ➔ **LEAF 4: Four-Dimensionalism**
  *   **NO** (Intention/Form required) ➔ Go to Q5.

  **5. (Case C: Ice Statue) If the statue melts and refreezes into a *different* shape, what grounds its persistence?**
  *   **CONVENTION** (No deep fact) ➔ **LEAF 5: Deflationary**
  *   **MATTER** (Survives if atoms persist) ➔ **LEAF 6: Mereological Essentialism**
  *   **FORM** (Dies if structure lost) ➔ **LEAF 7: Hylomorphism**
  *   **FUNCTION** (Statue is a phase of the lump) ➔ **LEAF 8: Phase Sortal**

  ---

  ### LEAF GUIDE & AWKWARD COMMITMENTS

  1.  **Eliminativism:** *Awkwardness:* Denies the existence of the handout you are currently holding (only simples exist).
  2.  **Constitution View:** *Awkwardness:* Accepts two distinct material objects in the exact same place at the same time.
  3.  **Relative Identity:** *Awkwardness:* Requires abandoning standard logic's law of absolute identity ($x=y$).
  4.  **Four-Dimensionalism:** *Awkwardness:* You are a "space-time worm"; only temporal slices are wholly present.
  5.  **Deflationary:** *Awkwardness:* Metaphysical debates are merely verbal disputes with no ontological truth.
  6.  **Mereological Essentialism:** *Awkwardness:* The statue ceases to exist if a single atom is removed or shifted.
  7.  **Hylomorphism:** *Awkwardness:* Commits to "forms" as real ontological constituents distinct from matter.
  8.  **Phase Sortal:** *Awkwardness:* "Statue" is not an object but a temporary stage of a more fundamental lump-object.

  ---

  ### ANALYTICAL NOTES

  **Indistinguishable Leaves:**
  *   **Hylomorphism vs. Mereological Essentialism:** Both typically predict the statue is destroyed when squashed, differing only on *why* (loss of form vs. loss of parts).
  *   **Deflationary vs. Phase Sortal:** Both often deny the statue is a fundamental substance, differing on whether this is a semantic fact (Deflationary) or an ontological one (Phase).

  **Empty/Impossible Combinations:**
  *   **Co-location + Absolute Identity:** Logically incoherent (violates Leibniz's Law if properties differ).
  *   **Eliminativism + Constitution:** Contradictory (Constitution requires composites to exist).
  *   **4Dism + "No" at Q4:** Unexplored/Unattractive (4Dism generally requires temporal parts to exist prior to intention).

  **Case Integration:**
  *   **Case A (3D Printer):** Resolves the "temporal priority" objection for Constitution/Identity views at Q3.
  *   **Case B (Eroded Rock):** Tests the role of intention vs. temporal extension at Q4.
  *   **Case C (Ice Statue):** Isolates the criterion of persistence (matter vs. form vs. convention) at Q5.
