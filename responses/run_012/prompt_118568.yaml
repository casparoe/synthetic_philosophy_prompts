answer: |-
  It is easy to see why the divorce analogy exerts such a pull on this conversation, because it captures the emotional texture of separation better than any dry constitutional theory could. It speaks to the intimacy of shared history, the pain of parting, and the practical necessity of dividing a life built together. When your friends use it, they are invoking a familiar social script to make sense of a political rupture, suggesting that just as a marriage is a voluntary union of lives, so too is a political union a voluntary association of peoples. To put it under the microscope, we must first walk through the mapping exactly as they intend it. In this picture, the marriage itself is the constitutional bond or the treaty of union that holds the entities together. The spouses are the seceding region and the remainder of the state, treated as equal partners in the relationship. The jointly owned property corresponds to national assets like foreign reserves, public buildings, and military hardware, while the debts are the sovereign liabilities accumulated during the union. The family home is often the territory itself, or perhaps the capital city if that is contested. Maintenance payments map onto ongoing financial transfers, such as pension obligations or trade subsidies. The court is the legal authority that adjudicates the split, and the children are the most complicated element, representing either the actual minor citizens or, more metaphorically, the vulnerable populations affected by the break.

  The power of the analogy lies in its normalization of exit. By framing secession as divorce, it suggests that staying together requires the consent of both, but leaving requires only the will of one. In modern no-fault divorce regimes, one party can decide the marriage is over, and while the other may be hurt, they cannot legally compel the first to remain married. The terms of the settlement are indeed often worked out after the decision to separate has been made, because the fact of separation is distinct from the financial consequences. This supports your friends' claim about sequencing: vote to leave first, negotiate the details later. However, this is where the mapping begins to strain, and the breaks fall into two categories: those that are merely semantic and those that undermine the conclusion about consent and sequencing.

  The most critical break concerns the legal order. The divorce analogy quietly presupposes a sovereign authority standing above both spouses with the jurisdiction and power to enforce its terms. When a husband files for divorce, he does so in a court that both he and his wife acknowledge has authority over them. If the wife refuses to hand over assets, the state can seize them. The analogy assumes that even after the political divorce, there remains a higher legal framework that both the seceding region and the remainder state accept as binding. But secession is often defined by the absence of such a higher authority. If the point of secession is to become sovereign, then by definition there is no court above the new state to enforce the division of assets or the payment of debts. If the remainder state refuses to agree to the terms after the vote, there is no sheriff to call. This matters immensely for the sequencing claim. In divorce, you can settle later because the court holds the ring in the interim. In secession, if you vote to leave before settling terms, you lose leverage. Once you declare independence, you are no longer a partner negotiating inside a system; you are a rival negotiating outside it. The remainder state might cut off access to the currency, the market, or the ports, and there is no higher court to stop them. So, while the analogy suggests terms can wait, the reality of sovereignty suggests that without a pre-agreed framework, the post-separation negotiation is not a legal settlement but a power struggle.

  This leads directly to your second point about fault. The version of the analogy your friends are using relies on the no-fault model, where irretrievable breakdown is sufficient grounds. This delivers the conclusion that a group may leave whenever it chooses, without needing to prove tyranny or abuse. It treats the union as a purely voluntary contract that either party can void at will. However, political theory has historically oscillated between this view and a fault-based view, where secession is only justified if the central state has violated fundamental rights or broken the original compact. The divorce analogy can actually support both, depending on which era of family law you invoke. If you invoke fault-based divorce, the seceding region must prove the union has abused them before they are permitted to leave. If you invoke no-fault, mere dissatisfaction is enough. The problem is that the analogy hides this choice behind the emotional resonance of broken relationships. By assuming no-fault, the analogy smuggles in a specific political theory—that states are voluntary associations like clubs—without arguing for it. If the union is conceived not as a contract but as a perpetual entity, like a corporation or a trust, the right to unilateral exit disappears. The analogy supports the consent claim only if you accept the premise that political unions are fundamentally like modern marriages rather than, say, indissoluble religious covenants or business partnerships with exit clauses.

  Then there is the question of the children, which is perhaps the most disturbing part of the mapping. In a divorce, children are dependents who lack legal agency; custody is decided for them based on their best interests. In the secession analogy, if the children represent actual minors, the mapping holds somewhat, as their welfare is a stake in the decision. But often, the children in this rhetoric represent the adult fellow citizens who voted against independence. Here the analogy breaks down completely and dangerously. Adult citizens are not dependents; they are rights-bearing participants in the union. To treat them as children in a custody battle implies that their consent does not matter, that they can be carried out of the union against their wishes because the majority of their region decided to leave. In a divorce, a child cannot vote to stay with the other parent if the court decides otherwise. In secession, the dissenting citizens are effectively being forced into a new nationality without their consent. If the analogy treats them as children, it justifies overriding their political agency. If it treats them as what they are—adults—then the custody model fails, because you cannot have custody of an adult. This suggests that the divorce analogy obscures the problem of the internal minority, making it seem like a welfare issue rather than a consent issue.

  Given these breaks, particularly the lack of a higher enforcing court and the status of dissenting citizens, the divorce analogy cannot carry the full weight of the argument about sequencing and consent. It works well to describe the emotional cost and the need for a fair division of assets, but it fails to account for the power vacuum that opens up when the legal order itself is being split. A better analogy might be a shareholder exiting a closely held corporation or a member leaving a cooperative housing society. In these cases, there is a governing document that specifies exit procedures. You cannot simply declare yourself no longer a shareholder and demand your portion of the buildings the next day; there is a process for valuation and buyout that must be settled before the separation is finalized, because the assets are indivisible and the ongoing relationship is economic rather than purely emotional. This preserves the voluntary nature of the association but corrects the sequencing error. It acknowledges that while you may have the right to leave, you do not have the right to define the terms of your exit unilaterally after the fact, because the remaining members have rights too.

  Alternatively, if you want to preserve the intensity of the bond, you might look at the analogy of a tenant leaving a shared lease. You cannot simply walk out and leave the other tenants liable for the rent without agreement; you must find a replacement or settle the debt first, because the landlord—the international community or the economic reality—holds both of you accountable regardless of your internal dispute. This captures the lack of a higher court better than divorce does, because the enforcement comes from the external reality of the lease, not a judge inside the relationship. Ultimately, the divorce analogy is seductive because it makes secession feel like a private right, but politics is public. It transforms a question of power and jurisdiction into a question of relationship status. By using it, your friends are arguing that the union is disposable by will alone, but they are relying on a legal infrastructure—the enforcing court—that only exists within the union they wish to leave. If that infrastructure vanishes upon exit, the promise that terms can be worked out afterwards is not a legal guarantee but a hope, and hopes are poor substitutes for the binding orders of a family court. The analogy holds for the sentiment of loss and the necessity of division, but it breaks where it matters most: on the mechanics of who decides, who enforces, and who gets to walk away without paying the price.
