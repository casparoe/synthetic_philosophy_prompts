prompt: |-
  I'm doing a profile of an AI researcher — I'll call her Dana, since the piece isn't out yet — and I've been going through her old posts and talks to collect her verdicts on which systems count as agents. Her calls so far: thermostat, not an agent; a hand-tuned chess engine, not an agent (she says it's a tool and the goal is ours, not its); an RL agent that learns to play Atari from pixels, definitely an agent; a supervised model that ranks videos by predicted clicks, not an agent; a base language model answering a question, not an agent; that same model playing a character in a chat, not an agent; and an RL-trained robot arm that learns to grasp, an agent.

  Next week she's weighing in on a newer system and won't tell me her verdict in advance. It's trained purely by supervised imitation on human transcripts of people doing long-horizon tasks — no RL, no reward function — but it has persistent memory, a scratchpad, tools, and it sets and carries its own goals over between sessions. So what does she say? I'd like the rules that fit her track record (I suspect she's running more than one, and I doubt they all agree here), what each rule predicts about this new system, which rule you think she's really running and why, and which of her earlier calls would be the best one to put back to her to seperate those rules. Don't just tell me it depends.
