      *   *Rule D: The "Tool vs. Entity" Rule (Instrumentality).*
          *   If it feels like a tool you use, it's not an agent. If it feels like something that *does* things while you watch, it is.
          *   This is vague but matches the "Chess = Tool" vs "Atari = Agent" distinction.

