answer: |-
  **Grade: 78/100**

  **Marginal Comments:**

  *   **[S1–S3]** Good summary of the Duhemian context and the status of the hard core. Clear distinction between logical and methodological unfalsifiability.
  *   **[S4]** **Excellent.** This is the crucial definition for part (a). You've captured the "novel fact" criterion precisely.
  *   **[S5–S8]** Strong application to the case study. You correctly identify "metric drift" as belt-adjustment and correctly diagnose the lack of novelty as degeneration.
  *   **[S9]** Correct. Important to note that degeneration doesn't equal pseudoscience immediately.
  *   **[S10]** **Major Error.** This misrepresents Lakatos's view on rationality. Lakatos argues it is *not* irrational to continue a degenerating programme *unless* there is a **superior rival** available. Degeneration alone does not mandate abandonment; otherwise, we would abandon programmes too early (before they recover). You mention the rival, but you make degeneration the trigger for irrationality rather than the *existence of a better alternative*.
  *   **[S11]** Sloppy phrasing. The hard core is *methodologically* irrefutable (by decision), not *empirically* irrefutable (by nature). It makes empirical claims, we just agree not to direct modus tollens at it.
  *   **[S12]** **Definition Error.** The positive heuristic is not the assumptions themselves; it is the *strategy* or *plan* for constructing/modifying the protective belt. The belt contains the assumptions; the heuristic tells you how to build them.
  *   **[General]** You did not explicitly define or mention the **negative heuristic** (the rule forbidding attacks on the hard core), though you described its effect in S2. Given the prompt asked for both, this is a minor omission.

  **TA-to-TA Note:**
  This is a solid B+/A- answer. The student clearly understands the *mechanics* of MSRP (Core/Belt/Progress) and applies them well to the "outcome-first" case (Part A is nearly perfect). However, they fall into the classic trap on Part B regarding rationality. They conflate "degenerating" with "irrational to pursue," missing Lakatos's historical nuance that scientists are rational to stick with a degenerating programme if no better rival exists. I also docked a few marks for the definition of the positive heuristic (S12) and the status of the hard core (S11), as these are technical definitions that need precision in a Phil Sci course. If this were a 101 course, I'd be more lenient on S10, but for a 2nd-year major, the rationality condition is key.
