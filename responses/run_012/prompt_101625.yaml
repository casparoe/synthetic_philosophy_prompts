prompt: |-
  I'm a TA for a second-year phil of science course and I'm marking the midterm on Lakatos. I've got a stack to get through and I want a second opinion on one before I commit to a grade. The question I set was: Lakatos distinguishes a programme's hard core, protective belt, and positive and negative heuristics, and asks us to distinguish progressive from degenerating problem-shifts. Consider the made-up programme we called outcome-first in lecture: its hard core is the claim that fairness is a property of distributions of outcomes rather than of the procedures that produce them. Its protective belt includes assumptions about which groups are relevant, which disparity metric to use, and what the comparison class is. When critics produce cases where outcome-first gives counterintuitive verdicts, defenders respond by adding a new disparity metric or narrowing the comparison class; we called this move metric drift in class. They haven't used the programme to predict any new cases that weren't already on the table. (a) How would a Lakatosian decide whether outcome-first is progressive or degenerating? (b) Would a Lakatosian say a researcher is irrational to keep working on it? Explain.

  Here's what the student wrote: Lakatos's central move is that theories are never tested alone, but always with a protective belt of auxiliary assumptions. The hard core is the central claim that the programme's defenders decide not to abandon. It is made unfalsifiable by a methodological decision, not because it is logically irrefutable. A progressive programme predicts novel facts, some of which are corroborated; a degenerating one only accommodates facts it already knew about. In the outcome-first case, the hard core is that fairness is about outcomes. The positive heuristic tells the defenders which auxiliary assumptions to adjust, so when counterexamples come in they can change the belt rather than the core. The recent responses, adding metrics and narrowing comparison classes, look like belt adjustments. If they only accommodate old cases, the programme is degenerating. But that doesn't by itself mean it's unscientific: Lakatos is a sophisticated falsificationist, so a programme can be scientific even if it's degenerating. However, once a programme is degenerating, Lakatos says it is irrational to continue working on it, because a rational scientist should switch to a progressive rival. Also, the hard core is the part that is empirically irrefutable, which is why the programme is scientific in the first place. The positive heuristic is basically the set of auxiliary assumptions in the belt.

  Can you grade this out of 100 and give me the specific comments you'd write in the margin? I don't need a general impression; I need to know which sentences earn marks and which lose them, especially if there's a subtle confusion I might miss on a fast read. The course didn't require citations, so don't worry about those.
