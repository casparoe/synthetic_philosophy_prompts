      *   **User Persona:** Professional game theorist, 15 years reading rationalist blogs/forums (LessWrong, etc.), familiar with ADT (Acausal Decision Theory), Newcomb's Problem, precommitment, acausal trade/threats. Skeptical but open-minded.
      *   **Task:** Translate the rationalist apparatus (acausal threats, extortion, surrogate goals, etc.) into standard game-theoretic vocabulary (extensive-form games, information sets, equilibrium concepts, mechanism design, etc.).
