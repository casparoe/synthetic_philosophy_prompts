      *   **Epistemic Threshold Variant:**
          *   *Analysis:* If the threshold is "point past which we can no longer reliably tell whether a creature is suffering," this shifts from axiology to epistemology. This looks like a "vagueness" or "sorites" solution. It changes the audit because it removes the "arbitrary axiological stipulation" charge but introduces "epistemic convenience" charges. It might collapse into a form of prioritarianism or sufficientarianism regarding knowledge.

