          *   *Analysis:* This describes the lexical threshold mechanism. If suffering is above threshold $T$, it trumps pleasure. If below, maybe trade-offs happen? Wait, the gloss says "Below the threshold, suffering-avoidance has absolute priority." That sounds backwards or confused. Usually, LTNU says *severe* suffering (above threshold) trumps everything. Mild suffering (below threshold) might be traded off against pleasure. Let's re-read carefully: "Below the threshold, suffering-avoidance has absolute priority... above it, the theory maximizes net utility."
          *   *Correction:* This seems to be a misstatement in the gloss. Standard LTNU (e.g., Meyer, or variations on lexical views) usually posits that *intense* suffering (above a threshold of severity) cannot be outweighed by pleasure. Mild suffering (below threshold) can be traded. The gloss says: "Below the threshold, suffering-avoidance has absolute priority... above it, the theory maximizes net utility." This implies that *mild* suffering trumps pleasure, but *severe* suffering enters a net utility calculation. That is the opposite of the standard view (which is designed to stop the BWE objection by protecting against *severe* suffering).
