answer: |-
  The project I am proposing seeks to resolve a persistent instability in value theory concerning the transitivity of the betterness relation. It is widely acknowledged that spectrum arguments, such as those leading to the Repugnant Conclusion, generate a sorites-style pressure on the claim that betterness is transitive. The standard dialectic currently forces a choice between accepting intransitivity, with its associated risks of money-pump exploitation, or denying one of the intuitive premises driving the spectrum, such as the claim that small improvements always constitute a betterment. However, this dichotomy overlooks a third option drawn from the philosophy of language regarding gradable adjectives. In linguistics, predicates like tall are recognised as context-sensitive to avoid sorites paradoxes without denying the coherence of height. My hypothesis is that the apparent intransitivity of betterness is an artefact of treating the predicate as context-insensitive over fully determinate alternatives, rather than a real feature of the value relation. The central aim of this research is to determine whether a contextualist semantics for betterness can preserve transitivity without sacrificing the normative force required for deliberation.

  While there is existing literature suggesting that vagueness or context-sensitivity might dissolve spectrum arguments, a specific and critical gap remains unaddressed. Most existing proposals either apply contextualism to specific value domains, such as welfare or aesthetics, or they fail to confront the requirement that deliberative betterness must be all-things-considered. The settled view in decision theory is that rational choice requires a single, context-free ordering of alternatives. Consequently, critics argue that even if betterness is context-sensitive in local comparisons, the all-things-considered relation used in serious deliberation must collapse back into a context-insensitive standard, thereby reintroducing the transitivity problem. Furthermore, there is contested ground regarding whether money-pump arguments survive if preferences are context-sensitive. Standard money-pump proofs assume preferences are fixed within the sequence of choices, but if the context shifts with each comparison, the intransitivity might only appear across contexts rather than within them. No existing work has rigorously tested whether a contextualist account can withstand the demand for a unified deliberative standard while simultaneously blocking money-pump exploits. This project will not assume that contextualism succeeds; rather, it will treat the viability of contextualism for all-things-considered value as the primary research question.

  The methodology will combine conceptual analysis with formal modelling to test the coherence of a contextualist value relation. The first two months will be dedicated to mapping the logical space of the problem. I will formalise the spectrum argument using a context-sensitive operator to determine exactly where the transitivity failure occurs under standard interpretations versus contextualist ones. This involves distinguishing between the semantic content of better than and the pragmatic conditions of its use. It is contested whether normative predicates can sustain the kind of context-shifting required to block sorites without losing their action-guiding capacity, so this phase will focus on defining the constraints any viable contextualist theory must meet. Specifically, I will investigate whether the context parameter can be fixed for deliberation without triggering the sorites paradox anew. If the context can be fixed, the paradox returns; if it cannot, the action-guiding force may dissolve. This tension forms the core analytical task of the project.

  During months three and four, I will address the all-things-considered objection directly. I intend to construct a model where the context is determined by the set of alternatives under consideration, similar to how comparison classes work for gradable adjectives, and test whether this allows for a stable deliberative standpoint. The goal is to see if we can define a higher-order preference relation that remains transitive even if first-order comparisons are context-sensitive. This is technically demanding because it requires showing that the shift in context does not merely hide the intransitivity but resolves it. I will also engage with the literature on vagueness to see if supervaluationist or epistemicist approaches offer a better framework than pure contextualism. The settled view here is that these approaches solve linguistic sorites, but it is entirely open whether they map onto normative properties. I will not presuppose they do, but will test the mapping for structural integrity.

  In the final two months, I will turn to the money-pump argument. If betterness is context-sensitive, an agent might prefer A to B in one context, B to C in another, and C to A in a third, without ever holding inconsistent preferences within a single context. I need to determine whether a dynamic choice sequence can force the agent to shift contexts in a way that allows exploitation. This requires modelling the agent's context-update rules during a sequence of trades. If the model shows that a rational agent can manage context shifts to avoid pumps, then the cost of accepting contextualism is significantly lowered. If not, then contextualism merely relocates the irrationality. The output of this phase will be a formal proof or counter-proof regarding the vulnerability of contextualist agents to dynamic inconsistency.

  Regarding the scope and expected outcomes, I must be honest about the limitations of a six-month timeframe. This is likely too short for a monograph, but sufficient for a substantial journal article or a foundational chapter for a later book. A successful result would be a formalised account showing that context-sensitivity preserves transitivity within deliberative contexts while blocking spectrum arguments. A negative result, which is still a valuable contribution, would be a proof that context-sensitivity cannot satisfy the requirements of all-things-considered deliberation without reintroducing intransitivity. Either way, the project will clarify whether the transitivity debate is substantive or merely semantic. There is a risk that the formal modelling becomes too complex to resolve definitively in six months, in which case the output will be a rigorous statement of the conditions required for a solution, rather than the solution itself. I am confident that even this clarificatory work advances the field beyond the current stalemate, but I acknowledge that a full defence of contextualist value theory may require further research beyond this grant period. The immediate goal is to establish whether the contextualist route is viable enough to warrant that longer-term investment.
