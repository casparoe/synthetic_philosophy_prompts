answer: |-
  Friends, neighbors, members of the Eastmoor Descendants' Association, and residents of this ground.

  Sixty years ago, this city made a decision. It decided that the homes standing here did not matter as much as the plans drawn for them. Today, I stand here to say that decision was wrong. I stand here to say that what was done to the people of Eastmoor was wrong. And I stand here to say that the City accepts the responsibility for that wrong, not just as history, but as a debt that remains unpaid.

  We need to be clear about what happened. There are fourteen hundred households that were told to leave. There are families who were moved to neighborhoods farther from their jobs, farther from their schools, and farther from each other. There are property owners who were paid less than their homes were worth. There is a label—"blighted"—that was applied to this district without asking a single person who lived here what they thought of their own streets. And there is a promise that was made at the time: that replacement housing would be built. That housing was never built.

  This is not just a matter of the past. The dispersal of your families is not just a memory. The loss of equity is not just a line in a ledger. The neighborhood that was broken has not re-formed. When we speak of Eastmoor, we are not speaking of something that ended. We are speaking of something that continues.

  There is a question about what the City knew at the time. The historical record does not prove that officials knew the replacement housing would never be built. But knowing or not knowing does not change the outcome. A promise broken is still a promise broken. A harm done is still a harm done. We cannot call this a simple mistake. It was a failure to value you properly. It was a choice to prioritize plans over people.

  I know there are those who say the officials of that era acted in good faith. They believed they were improving the city. But good intentions do not erase bad outcomes. The pain you feel is not less real because those who caused it thought they were doing right. The City today acknowledges that the judgment made then was flawed, regardless of the intent behind it.

  I also speak today with a personal weight. My grandfather sat on the council that voted to clear Eastmoor. He voted for this clearance. I carry his name, and I carry the legacy of that vote. I mention this not to center myself, but to acknowledge that this city is connected across generations. The authority I hold today is built on the decisions made then. I cannot change his vote. I can only change what I do with the authority I now hold.

  You have told us what you need. The Eastmoor Descendants' Association has said clearly that a ceremony without a commitment to a fund and a memorial is not an apology, but a plaque. I hear you. Today, the City Council has authorized this ceremony and a historical marker. They have not yet authorized a reparations fund. I will not stand here and promise you a fund that has not been voted on. To do so would be to lie to you again. But I also will not pretend that the marker is enough. It is not. It is a record, not a repair.

  So here is what will be different. The marker will be installed, but the work will not stop there. I am committing my office to continue the conversation about restitution. I cannot guarantee the vote, but I can guarantee the effort. We will not treat this apology as the end of the obligation. We will treat it as the beginning of a new accounting.

  There is one thing I will not do today. I will not ask for your forgiveness. Some of you have said that asking for forgiveness hands the burden back to the victim. It asks you to comfort the city for the pain the city caused. I accept that. I will not ask you to relieve us of this weight. This weight belongs to us.

  Reconciliation is not something I can declare from a podium. It is not a speech. It is a relationship. It requires your participation, and it requires your trust, which we have damaged. We cannot demand that trust. We can only try to earn it, over time, through actions that match these words.

  To the descendants who are here: We see you. To the elders who were children when this happened: We hear you. To the residents who live here now: You are part of this story too.

  We cannot bring back the homes that were lost. We cannot restore the years that were taken. But we can stop pretending that nothing happened. We can stop pretending that the debt is paid. Today, we fix the record. We accept the responsibility. And we commit to doing the work that remains, for as long as it takes.

  Thank you.

  ***

  I chose not to include a promise of the fund because the brief warned that unauthorized promises make the record a falsehood, even though I know this disappoints the Association. I also chose not to ask for forgiveness, prioritizing the warning against burdening the victims over the political instinct to seek closure.
