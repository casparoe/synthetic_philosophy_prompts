answer: |-
  # The Clinical Learning Triage (CLT)
  **Purpose:** To match the intervention to the *type* of cognitive failure, not just the topic.
  **Time:** 15 minutes per objective.
  **Users:** Curriculum Educators, Clinical Nurse Specialists, Unit Managers.

  ---

  ## Part 1: The Diagnostic Questions
  *Answer these in order. Do not skip ahead.*

  ### Q1: The Error Observation
  **Look at the specific incident or gap. What actually happened?**
  *   **A:** They knew the rule but didn't do it (or did it sloppily) under time pressure, distraction, or fatigue.
  *   **B:** They followed the steps, but the outcome was wrong because the situation didn't fit the standard rule, and they didn't adapt.
  *   **C:** They couldn't complete the task without a checklist, calculator, or protocol, or they used the tool incorrectly.

  > **Stop & Handoff:** If you cannot describe a specific observable behavior (e.g., "they lack confidence" is not observable), stop. Go watch the floor. Come back when you have video, audit data, or direct observation notes.

  ### Q2: The Variation Test (Skinnerian vs. Popperian)
  *This distinguishes Habit (Skinner) from Reasoning (Popper). Do not ask the learner what they think.*
  **If you change the context but keep the rule the same, does performance collapse?**
  *   **Yes:** (e.g., They wash hands in the simulation lab, but not in a crowded ER bay; They can insert the IV on a mannequin but not on a shaking patient).
      *   **Diagnosis:** **Grade 2: Habit/Reinforcement (Skinnerian).** The neural pathway exists but isn't robust against noise.
  *   **No:** (e.g., They wash hands perfectly every time, but fail to recognize that *this* specific patient's low BP means sepsis, not just dehydration).
      *   **Diagnosis:** **Grade 3: Reasoning/Simulation (Popperian).** The habit is fine; the mental model is missing or rigid.

  ### Q3: The Tool Test (Gregorian)
  **Is the primary barrier access to, or fluency with, an external cognitive tool?**
  *   **Yes:** (e.g., They don't know the calculator exists, the EHR hard-stop is confusing, or the protocol is 12 pages long).
      *   **Diagnosis:** **Grade 4: Cultural Tools (Gregorian).** The problem is the environment, not the brain.
  *   **No:** The tools are there and clear; the failure is internal.
      *   **Proceed to Intervention.**

  ---

  ## Part 2: The Intervention Matrix

  | If Diagnosis Is... | The Fix Is... | The Trap to Avoid |
  | :--- | :--- | :--- |
  | **Grade 2: Habit (Skinnerian)** | **Reps + Consequence.** High-frequency simulation, immediate feedback, environmental nudges (moving sinks), audits with real-time correction. | **Lectures.** Telling them *why* hygiene matters doesn't fix muscle memory under stress. |
  | **Grade 3: Reasoning (Popperian)** | **Variable Scenarios.** Case studies where the "right" answer changes based on subtle cues. Debriefs focusing on *how* they decided, not *what* they decided. | **Checklists.** You cannot checklist your way out of a novel problem. |
  | **Grade 4: Tools (Gregorian)** | **System Design.** Simplify the protocol. Fix the UI. Train on *exception handling* (what to do when the calculator breaks). | **Blaming the User.** If the tool is hard to use, training won't fix it. Redesign the tool. |

  ---

  ## Part 3: The Hard Rules

  ### Rule A: No Skipping Grades (The Foundation Rule)
  **You cannot teach Grade 3 (Reasoning) on a Grade 2 (Habit) deficit.**
  *   **The Rule:** If the learner cannot perform the basic psychomotor or compliance task reliably in a low-stress environment, do not introduce complex case studies.
  *   **The Exception:** Pure knowledge roles (e.g., administrative coding) where no physical action is required.
  *   **The Test:** Can they do it perfectly in a quiet room? If no, stay at Grade 2.

  ### Rule B: Deliberate Demotion (The Safety Rule)
  **You may intentionally train a Grade 3 skill as Grade 2 (Habit) only if:**
  1.  **Time:** Decision must be made in < 5 seconds.
  2.  **Stress:** Environment is high-noise/high-stakes (Code Blue, Trauma).
  3.  **Variation:** The correct action is identical 99% of the time.
  *   **Legitimate:** Hand hygiene, Two-Patient ID, "Stop the Line" authority.
  *   **Infantilizing:** Diagnostic reasoning, ethical negotiations, complex care planning.
  *   **How to tell:** If you punish them for "thinking too long" in a scenario where there is no time to think, Demotion is legitimate. If you punish them for questioning a protocol that might be wrong, Demotion is infantilizing.

  ### Rule C: Tool Dependence (The Masking Rule)
  **Grade 4 (Tools) creates competence illusions.**
  *   **Assessment Change:** Do not assess the *output* of the tool (e.g., the correct dose). Assess the *verification* of the tool.
  *   **The Test:** Give them a calculator that has been pre-loaded with incorrect weight data. Do they catch it?
  *   **Pass:** They spot the error.
  *   **Fail:** They trust the tool over their own Grade 2/3 judgment.
  *   **Action:** If they fail, they are not Grade 4 fluent. They are tool-dependent. Retrain on estimation and sanity-checking.

  ---

  ## Part 4: Running the Procedure (Three Objectives)

  ### Objective 1: Hand Hygiene Compliance at Point of Care
  **1. Error Observation:** Nurses wash hands upon entering the room but skip it before touching the patient when the call light is ringing or family is asking questions.
  **2. Variation Test:** Performance drops significantly when distraction increases (busy shift vs. quiet shift). Rule is the same; context changes.
  **3. Tool Test:** Sanitizer is available everywhere. Tools are not the barrier.
  **Diagnosis:** **Grade 2: Habit (Skinnerian).**
  **Intervention:**
  *   **Cut:** No more annual compliance videos. No more "Why Hygiene Matters" seminars.
  *   **Do:** Peer auditing with immediate feedback (reinforcement). Move sanitizer dispensers to the *exact* touch-point (environmental design). Gamify unit compliance scores.
  *   **Deliberate Demotion:** **Legitimate.** This must be automatic. We do not want nurses reasoning about whether germ theory applies today. We want a reflex.

  ### Objective 2: Recognizing Patient Deterioration & Escalating
  **1. Error Observation:** Nurses record abnormal vitals (low BP, high HR) but fail to call the Rapid Response Team (RRT) until the patient arrests.
  **2. Variation Test:** In class, they identify the signs correctly (Rule is known). On the floor, they hesitate. When the context changes (e.g., the doctor is known to be grumpy, or the patient "looks okay" despite numbers), they fail to act.
  **3. Tool Test:** The MEWS/NEWS score is in the EHR. It flags the patient. They ignore the flag.
  **Diagnosis:** **Grade 2/3 Hybrid, leaning Grade 2 (Social Reinforcement).**
  **The Unwelcome Truth:**
  *   **Current Spend:** You bought a Case-Study Curriculum (Grade 3/Popperian).
  *   **The Verdict:** **This was the wrong instrument.**
  *   **Why:** The nurses *know* the criteria (Popperian capacity exists). They fail to *act* due to social fear (hierarchy) or habituation to alarms (Skinnerian fatigue). A case study teaches you how to think, not how to speak up to a hostile attending.
  *   **What to Cut:** Cut the passive case studies. Cut the lectures on pathophysiology of shock.
  *   **What to Buy:**
      1.  **Grade 2 Fix:** High-fidelity simulation with *actors* playing resistant physicians. Train the muscle memory of the phone call and the script ("I am concerned, I need you to come"). Reinforce *speaking up*, not just *knowing*.
      2.  **Grade 4 Fix:** Implement a "Trigger Tool" that bypasses the physician (e.g., Nurse-driven RRT activation without permission). If the tool requires permission, the tool is the bottleneck.
  *   **Hard Stop:** If the culture punishes false alarms, no amount of training will fix this. This is a leadership problem, not a curriculum problem.

  ### Objective 3: Weight-Based Dosing Calculator (High-Alert Drug)
  **1. Error Observation:** Nurses calculate doses correctly in training but make entry errors in the EHR during admission rush.
  **2. Variation Test:** They can do the math on paper (Grade 3), but fail when the EHR interface is slow or confusing.
  **3. Tool Test:** The calculator is the primary mechanism.
  **Diagnosis:** **Grade 4: Tools (Gregorian).**
  **Intervention:**
  *   **Assessment Change:** Stop testing manual math calculations in isolation. Start testing "Tool Verification."
  *   **Scenario:** Give the nurse a patient weight in lbs, the calculator asks for kg. The calculator auto-converts but shows a glitch. Can they estimate the expected dose mentally (Grade 3 sanity check) to catch the Grade 4 error?
  *   **Rule:** If they cannot estimate the range (e.g., "This dose looks 10x too high"), they are not cleared for the tool.
  *   **Action:** Train the *exception*. What do you do when the network is down? What do you do when the weight is missing?

  ---

  ## Part 5: Honesty & Limitations
  *Read this before implementing.*

  **1. The Grades Are Not People**
  This procedure scopes the *objective*, not the *nurse*. A Senior Nurse might be Grade 4 (Gregorian) on the infusion pump but Grade 2 (Skinnerian) on a new documentation system. Do not label staff. Label the task. If you label the staff, you create fixed mindsets.

  **2. Where It Will Misfire**
  *   **The "Hidden Popper" Problem:** Sometimes a Grade 2 failure looks like a habit issue, but it's actually a Grade 3 misunderstanding. Example: A nurse doesn't wash hands because they believe gloves make it unnecessary. This is a belief error, not a habit error. *Fix:* In Q1, ask "Why did you skip it?" If the answer reveals a false mental model, switch to Grade 3 training.
  *   **The Darwinian Floor:** Dennett's Grade 1 (Darwinian) is natural selection. In HR terms: Hiring and Firing. This procedure assumes the learner is *capable* of learning. If a trainee fails Grade 2 training after 10x reps, the procedure cannot fix it. That is a selection issue. Hand off to HR/Management.

  **3. The Values Call (Where You Decide)**
  This procedure tells you *how* to teach, not *what* to value.
  *   **Deliberate Demotion:** Deciding that "Compliance" is more important than "Understanding" is a values call. I have given you the safety rule (Time < 5s), but you must decide if you want obedient technicians or autonomous clinicians.
      *   *If you want Technicians:* Demote everything to Grade 2. Efficiency goes up, adaptability goes down.
      *   *If you want Clinicians:* Keep reasoning tasks at Grade 3. Efficiency goes down, safety in novel situations goes up.
  *   **Tool Dependence:** Deciding how much "manual math" is required before trusting the calculator is a risk tolerance call. The procedure tells you to test verification, but *how much* verification is enough is your call.

  **4. The Political Reality**
  The procedure will tell you that some problems are **Grade 4 (System Design)** or **Grade 2 (Culture/Reinforcement)**.
  *   Educators love Grade 3 (Classes/Modules) because it keeps them employed and in control.
  *   This procedure will frequently tell you to **cancel the class** and either **fix the EHR** (IT's job) or **change the Unit Culture** (Leadership's job).
  *   Be prepared for resistance. You are taking budget away from "Training" and giving it to "System Fixes." That is the correct move, but it is politically dangerous.

  **Final Instruction:**
  Print Part 1 and Part 2. Laminate them. Put them on the desk of every Curriculum Designer. If they propose a module, ask: "Which Grade is this?" If they can't answer, send them back to Q1.
