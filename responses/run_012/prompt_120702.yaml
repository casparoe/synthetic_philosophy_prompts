prompt: |-
  I run curriculum design for a mid-size hospital's clinical training program — nurses, phlebotomists, a few allied health roles — and I keep running into the same fight with our educators. Every time something goes wrong on the floor, someone proposes a training fix: a module, a seminar, a video, a case-study session. And it's basically random which of those we pick, because nobody asks what kind of learning problem it actually is. I recently read about Dennett's four grades of creature — Darwinian, shaped by evolution; Skinnerian, shaped by reinforcement in the animal's own lifetime; Popperian, able to run the experiment inside its head so the hypothesis dies instead of the creature; and the fourth one, where the mind is loaded up with external thinking tools it didn't invent and couldn't have come up with alone — and I think that's actually the diagnostic I've been missing. But I need it as a procedure, not a lecture.

  So: give me a decision procedure my educators can run on a single learning objective, in maybe fifteen minutes, without reading any philosophy. Something like — here's the objective, here are the observable signs of where trainees currently are, here's the intervention the grade actually calls for. I want the questions in order, what counts as a sufficient answer to each, where the procedure stops and hands off to me, and where it's just a judgment call wearing a procedure's clothes.

  Some things I specifically need it to handle, because these are where we keep messing up:

  - How do you tell a Skinnerian problem from a Popperian one from the outside, in a clinical setting? What do you actually watch or look at? I don't want the answer to be "ask whether they understand why" — everyone says they understand why.
  - Can you ever skip a grade? My instinct is you can't teach someone to test hypotheses about a procedure they can't yet perform at all, but I want that stated as a rule with the exceptions marked, not as a vibe.
  - I want a rule for deliberate demotion, and I think this is the part nobody talks about. There are things I want our staff to do automatically, without deliberation, under pressure, at 3am — hand hygiene, two-patient identifiers, the sepsis trigger. By this framework that's deliberately pushing a skill back down to Skinnerian even after they could reason about it Popperian-style. When is that legitimate, when is it infantilizing, and how do I tell the difference?
  - And the fourth grade: we hand people checklists, dosing calculators, decision trees, our EHR's hard stops. A trainee who's fluent with those tools can look more competent than they are. I want the procedure to say what to do about tool-dependence — when it's a genuine achievement and when it's a masking problem — and how that changes what we assess.

  Then run it on three objectives, showing your work at each step:

  1. Hand hygiene compliance at the point of care.
  2. Recognizing that a patient is deteriorating and escalating appropriately.
  3. Using our weight-based dosing calculator for a high-alert drug.

  One of those three should come out with an answer I won't like — I suspect it's the second one, because I've already spent money on a case-study curriculum for it and I'm attached to it, so if the procedure says that was the wrong instrument, say so plainly and tell me what I'm actually supposed to cut.

  Also be honest at the end about what the procedure can't do. I know the grades aren't properties of a person — the same nurse can be Gregorian with the infusion pump and Skinnerian with a difficult conversation — and I'd rather the procedure have a line in it about scoping the grade to the objective than have it quietly pretend people are one thing. Tell me where it will misfire, and which of its outputs are really just me making a values call about what kind of practitioner I'm trying to produce.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Curriculum design lead at a mid-size hospital.
      *   **Problem:** Educators default to "training fix" (module, video, etc.) for every error without diagnosing the *type* of learning problem.
      *   **Framework:** Daniel Dennett's Four Grades of Creatureliness (Darwinian, Skinnerian, Popperian, Gregorian).
      *   **Goal:** A 15-minute decision procedure for educators to classify a learning objective and select the intervention.
      *   **Specific Constraints/Needs:**
          *   No philosophy jargon in the output (translate grades to clinical training terms).
          *   Must distinguish Skinnerian (habit/reinforcement) vs. Popperian (mental simulation/reasoning) observably (not just "do they understand").
          *   Rule on skipping grades (can you teach reasoning before performance?).
          *   Rule on "Deliberate Demotion" (making high-level skills automatic/habitual for safety).
          *   Rule on Tool Dependence (Gregorian grade - checklists, EHR, calculators).
          *   Run the procedure on 3 specific objectives (Hand Hygiene, Deterioration Recognition, Dosing Calculator).
          *   One result must be unwelcome/challenging (likely #2).
          *   Honesty section: Limitations of the procedure, scope issues, value judgments.

  2.  **Deconstruct Dennett's Grades for Clinical Training:**
      *   *Darwinian:* Evolution/Selection. In training context: Selection/Hiring or natural attrition. (Usually not a training intervention, but worth noting for "can this person even do this job?"). *Decision:* Keep this out of the daily procedure to save time, focus on the other three.
      *   *Skinnerian:* Operant conditioning. Trial and error with feedback. *Clinical translation:* Habit formation, muscle memory, compliance, automaticity. Intervention: Drills, simulation reps, immediate feedback, checklists for compliance.
      *   *Popperian:* Hypothesis testing in the head. *Clinical translation:* Clinical reasoning, troubleshooting, adapting to novel situations. Intervention: Case studies, debriefs, "what if" scenarios, root cause analysis.
      *   *Gregorian:* Cultural tools, language, external mind. *Clinical translation:* Using systems, protocols, EHR, calculators, shared mental models. Intervention: Tool design, integration training, system optimization.

  3.  **Drafting the Decision Procedure (The "Triage Tool"):**
      *   *Structure:* Needs to be a flowchart or step-by-step questionnaire.
      *   *Time:* 15 minutes.
      *   *Step 1: Define the Objective & Error.* What exactly went wrong?
      *   *Step 2: The Observables (Skinner vs. Popper).* How to tell the difference?
          *   *Skinner:* They did it wrong consistently under stress/distraction. They know *what* but fail *when*.
          *   *Popper:* They did the steps right but missed the *implication*. They couldn't adapt when the script broke.
      *   *Step 3: Grade Selection.*
      *   *Step 4: Intervention Match.*
      *   *Specific Rules:*
          *   *Skipping:* No Popper without Skinner foundation (unless it's a knowledge-only role).
          *   *Demotion:* Legitimate for safety-critical, high-frequency, low-variation tasks under stress. Illegitimate for diagnostic reasoning.
          *   *Tools:* If the tool does the thinking, assess tool fluency, not raw calculation.

  4.  **Refining the "Skinner vs. Popper" Distinction (Crucial Request):**
      *   User hates "ask if they understand."
      *   *Test:* Variation.
      *   *Skinner failure:* Performance degrades when context changes slightly (noise, time pressure) but the rule is the same.
      *   *Popper failure:* Performance fails when the rule doesn't apply or two rules conflict.
      *   *Observation:* Watch them in sim. Change one variable. If they freeze or revert to bad habit -> Skinner gap. If they apply the wrong rule confidently -> Popper gap.

  5.  **Developing the Three Scenarios:**

      *   *Scenario 1: Hand Hygiene.*
          *   Nature: High frequency, low cognitive load, safety critical.
          *   Grade: Skinnerian (with Gregorian aids).
          *   Intervention: Nudges, audits, ease of access. NOT a seminar.
          *   *Verdict:* Stop making videos. Put sinks/gel in better places.

      *   *Scenario 2: Recognizing Deterioration.*
          *   Nature: Low frequency, high cognitive load, novel presentations.
          *   Grade: Popperian (supported by Gregorian tools like NEWS/MEWS).
          *   *The "Unwelcome" Truth:* The user suspects case studies are wrong.
          *   *Analysis:* Case studies are Popperian. But if the error is *noticing* the data (Skinner/Perception) or *trusting* the tool (Gregorian), case studies fail.
          *   *Hard Truth:* If they can't spot the vital sign trend, a case study is useless. They need drills on *data acquisition* (Skinner) or better monitoring tools (Gregorian). If the case studies are passive, they are worthless. Active simulation with stress is needed.
          *   *Wait, let's look closer:* The prompt says "I've spent money on a case-study curriculum... if the procedure says that was the wrong instrument, say so."
          *   *Diagnosis:* Deterioration is often a *perception* problem masked as a *reasoning* problem. Nurses see the numbers but don't feel the urgency. This is often a **Gregorian** failure (the escalation protocol isn't clear) or a **Skinnerian** failure (conditioned to ignore alarms). Case studies (Popper) assume they see the data and just need to reason. If they aren't seeing the data, case studies are waste.
          *   *Pivot:* Actually, the strongest "Unwelcome" truth is usually that *reasoning* training (Popper) is applied to *habit* problems (Skinner) or *system* problems (Gregorian).
          *   *Let's make #2 the Popper Trap:* Escalation is often treated as "knowing the criteria." But under pressure, it's about *habitual* speaking up. If the culture punishes escalation, a case study won't fix it.
          *   *Better angle:* The procedure might reveal that *Case Studies* are the wrong *modality* for the *stage* of learning. You need Sim (Skinner/Popper mix) not Classroom Case Studies.
          *   *Best angle for the prompt:* The procedure identifies this as primarily **Gregorian** (System/Tool) with **Skinnerian** (Habit of speaking up) support. The Case Study curriculum assumes it's a **Popperian** (Reasoning) deficit. If the nurses *know* the criteria but don't *act*, reasoning training is useless.
          *   *Decision:* I will flag the Case Study curriculum as inefficient if the bottleneck is psychological safety (Skinner/Reinforcement) or Tool clarity (Gregorian).

      *   *Scenario 3: Weight-Based Dosing Calculator.*
          *   Nature: High risk, tool-dependent.
          *   Grade: Gregorian.
          *   Risk: Tool dependence masking math inability.
          *   Intervention: Train on the *tool* and the *verification*, not the raw math. Assess ability to spot tool error.

  6.  **Addressing Specific Constraints:**
      *   *Skipping Grades:* Rule: Never skip Skinner for psychomotor/safety habits. You can skip to Popper for pure knowledge (e.g., pathophysiology), but not for action.
      *   *Deliberate Demotion:* Legitimate when: Time < 5 seconds, Stress = High, Cost of Error = Catastrophic. Illegitimate when: Situation is novel, requires adaptation.
      *   *Tool Dependence:* Assess "Exception Handling." Can they function when the tool breaks or gives weird data?

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   Tone: Professional, direct, operational, slightly provocative (to match the user's sophistication).
      *   Format: Clear headers, bold text for decision points.
      *   The "Honesty" Section: Crucial. Acknowledge that humans aren't boxes.

  8.  **Review against Dennett's Framework:**
      *   Darwinian: (Ignored for training, mostly hiring).
      *   Skinnerian: Reinforcement/Habit.
      *   Popperian: Mental Simulation/Reasoning.
      *   Gregorian: Cultural Tools/Systems.
      *   *Self-Correction:* Ensure I don't use the names "Darwinian/Skinnerian" in the tool itself if the user said "without reading philosophy." *Correction:* The user *knows* the framework and wants to use it, but wants the *educators* to run it without a lecture. I should use the terms but define them operationally in the header, or use operational names (Habit, Reasoning, Tool) with the philosophical terms in parentheses for the user's reference. *Decision:* Use operational names with the Dennett terms as sub-labels so the educators learn the vocabulary without needing the backstory.

      *   *Wait, re-reading prompt:* "without reading any philosophy." Okay, I should translate the terms into clinical training language *in the procedure*, but keep the mapping clear for the user.
      *   *Actually,* the user says "I recently read about Dennett's four grades... I think that's actually the diagnostic I've been missing." They want to *use* this framework. If I strip the names, they lose the framework. I will use the names but define them *strictly operationally* so no background reading is needed.

      *   *Refining the "Unwelcome Truth" for #2:*
          *   Current state: Case studies (Popperian).
          *   Real problem: Escalation is often social risk + pattern recognition.
          *   If the procedure says "This is a Skinnerian problem (fear of speaking up/reinforcement history) or Gregorian (unclear escalation path)," then the Case Study budget is wasted.
          *   I will argue that for *escalation*, the bottleneck is usually **Skinnerian** (conditioned inhibition due to hierarchy) or **Gregorian** (unclear chain of command), not Popperian (not knowing what sepsis looks like). If they know the signs but don't call, reasoning training is useless.

  9.  **Final Polish:**
      *   Check the 15-minute constraint.
      *   Ensure the "Stop/Handoff" points are clear.
      *   Make sure the "Deliberate Demotion" rule is sharp.

  10. **Writing the Response:** (Mental outline of the output)
      *   Intro: Acknowledge the insight.
      *   The Procedure: "The Clinical Learning Triage."
      *   The Rules (Skipping, Demotion, Tools).
      *   The Three Runs (with the "Unwelcome Truth" in #2).
      *   The Limitations (Honesty section).

  *(Self-Correction during drafting)*: Make sure I explicitly answer "How to tell Skinner from Popper from the outside."
  *Answer:* Vary the context. If performance drops when context changes but rule is same = Skinner. If performance drops when rule needs adaptation = Popper.

  *(Self-Correction on #2)*: Make sure I tell them what to *cut*. "Cut the passive case studies. Replace with high-fidelity sim with actors who push back (Skinner) or simplify the escalation protocol (Gregorian)."

