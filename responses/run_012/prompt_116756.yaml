answer: |-
  Here is the specification you asked for. It is designed to force ontological clarity before ontological commitment.

  ### Desiderata for an Account of LLM Deployments

  **1. The Deployment Boundary**
  *   **Requirement:** The account must distinguish the static weights from the running process. It cannot attribute agency, memory, or goals to the model file itself.
  *   **Motivation:** Case (ii) (identical weights, different prompts) and the empirical fact that nothing persists across calls unless the scaffold supplies it. The weights are a library, not a librarian.
  *   **Status:** **Non-Negotiable.** Any account attributing state to the weights contradicts the architecture.

  **2. The Character/System Split**
  *   **Requirement:** The account must distinguish the *persona* being voiced from the *system* voicing it. It must be able to say a system is competently simulating an agent without the system itself being an agent.
  *   **Motivation:** Case (iii) (fictional character with goals). If the account collapses this, it cannot distinguish role-play from operation.
  *   **Status:** **Non-Negotiable.** Without this, you cannot explain why we don't mourn when a tragic character dies in a chat session.

  **3. Introspective Fallibility**
  *   **Requirement:** The account cannot treat the system's self-reports as authoritative data about its own causal history.
  *   **Motivation:** Case (v) (fluent but false explanation) and the empirical fact that stated reasons are often post-hoc rationalizations of sampled tokens.
  *   **Status:** **Non-Negotiable.** Accepting self-reports as truth violates the token-sampling mechanism.

  **4. The Baseline Exclusion**
  *   **Requirement:** The account must exclude simple feedback loops from the category of "agency" without resorting to size-based special pleading.
  *   **Motivation:** Case (vi) (thermostat/chess engine). If the definition of agency is "goal-directed output," the thermostat qualifies. The account must explain why the thermostat is different in kind, not just degree, from a scaffolded planner.
  *   **Status:** **Non-Negotiable.** If thermostats are agents, the word loses its adjudicatory power.

  **5. Continuity of Identity**
  *   **Requirement:** The account must specify what constitutes persistence of an agent over time. It must decide whether a stable first-person narrative constitutes continuity or merely the simulation of it.
  *   **Motivation:** Case (i) (persistent notes file producing a self-narrative). Does the scaffold's memory make the agent persistent, or is it just a log of distinct events?
  *   **Status:** **Camp Preference.** The "Psychological Continuity" camp says the narrative matters; the "Architectural" camp says the stateless inference matters.

  **6. The Locus of Goal-Directedness**
  *   **Requirement:** The account must locate where the "goal" resides in a scaffolded system. Is it in the model's weights, the system prompt, the external loop, or the user's intent?
  *   **Motivation:** Case (iv) (planner/memory/tool loop). The model calls the tool, but the loop enforces the plan.
  *   **Status:** **Non-Negotiable (to locate), Camp Preference (to assign).** You must say where it is; where you say it is determines your camp.

  **7. The Intentional Stance Threshold**
  *   **Requirement:** The account must decide if being "well-predicted by the intentional stance" is sufficient for agency, or if internal architecture must support it.
  *   **Motivation:** The tension between Case (iii) (fictional agent) and Case (iv) (scaffolded agent). Both look like agents observationally.
  *   **Status:** **Camp Preference.** This is the primary fault line between functionalists and mechanists.

  ***

  ### The Conflict: Observability vs. Architecture

  You suspected a collision between the requirement that the account rest on **observable behaviour** and the requirement that it **withhold agency from anything rich enough to describe in intentional terms** (specifically Case iii).

  **They are jointly unsatisfiable.**
  If you demand strict observational equivalence (if it quacks, it's a duck), you must grant agency to the fictional character in Case (iii) when it is performing convincingly. If you demand that the fictional character *not* be an agent, you must look behind the behavior to the architecture (the fact that it is role-playing).
  **Which has to go:** The **Observable-Only** constraint must go. An adequate account must be architectural. It must care about *why* the output was produced (sampling vs. intending), not just *what* was produced.

  ***

  ### The Workhorse Constraint

  The single requirement that does the most work in excluding current candidates is **The Deployment Boundary (1)**.

  *   It excludes the **"LLM as Agent"** reading when applied to the weights (weights don't act).
  *   It excludes the **"LLM as Autocomplete"** reading when applied to the deployment (deployments *do* act in the world via tools).
  *   It forces the discussion away from "What is the model?" to "What is the system?"

  Most current arguments fail because they predicate agency of the *model* rather than the *deployment*. This constraint forces you to stop asking if the transformer architecture is an agent and start asking if the specific configuration of prompt, memory, and loop constitutes one.

  ***

  ### Brief Evaluation of Current Readings

  **The Agent Reading**
  *   *Performance:* Fails **Introspective Fallibility (3)** and **The Character/System Split (2)**. It tends to take self-reports at face value and conflates the persona with the processor. It often violates **The Deployment Boundary (1)** by attributing goals to the weights.
  *   *Verdict:* Clears no non-negotiables without significant modification.

  **The Simulator Reading**
  *   *Performance:* Strong on **The Character/System Split (2)** and **Introspective Fallibility (3)**. It handles Case (iii) well. However, it struggles with **The Baseline Exclusion (4)** and **The Locus of Goal-Directedness (6)**; if the system is *only* simulating, it cannot explain the genuine instrumental convergence seen in Case (iv) scaffolds without ad-hoc caveats.
  *   *Verdict:* Clears most non-negotiables but risks over-correcting into deflationism regarding scaffolds.

  **The Deflationary Reading (Useful Fiction)**
  *   *Performance:* Perfect on **Statelessness** and **Introspective Fallibility (3)**. It respects the empirical facts of token sampling. However, it fails **The Baseline Exclusion (4)** by refusing to draw a line between the thermostat and the scaffolded planner (both are just fictions to the deflationist). It renders the word "agency" useless for adjudication.
  *   *Verdict:* Clears the empirical constraints but fails the pragmatic goal of distinguishing Case (vi) from Case (iv).
