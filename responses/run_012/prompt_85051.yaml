answer: |-
  **JOINT STATEMENT ON MENTAL CAUSATION AND INTERVENTIONISM**

  **Circulated by:** The Philosophy of Mind Reading Group
  **Date:** 24 May 2024
  **Subject:** Agreed Framework and Residual Disagreements regarding the Exclusion Argument

  ### 1. Agreed Claims

  The undersigned camps (hereafter 'Exclusionists' and 'Non-reductionists') submit this statement following a period of adversarial collaboration. We agree to conduct all further discussion regarding mental causation under the following stipulations and shared commitments.

  1.  **Interventionist Framework:** All causal claims are to be understood strictly within an interventionist, difference-making framework. A variable $C$ is a cause of variable $E$ if and only if there exists a possible intervention on $C$ that results in a change in $E$, provided appropriate background conditions are held fixed. We agree to eliminate from our discourse all reference to 'causal production', 'transfer of energy or power', 'causal oomph', or any generative mechanism that cannot be cashed out in terms of counterfactual dependencies under intervention.
  2.  **Causal Closure and Supervenience:** We accept the causal closure of the physical domain: for every physical event with a cause, there is a sufficient physical cause. We accept that mental properties supervene on physical properties: there can be no difference in mental properties without a difference in physical realising properties. These claims are treated as constraints on the variables available for intervention, not as premises that automatically settle causal status.
  3.  **The Realiser-Fixing Constraint (RFC):** We agree that any intervention specified as varying a mental property $M$ must be physically implemented as an intervention on its physical realiser $P$. There is no 'magical' intervention on $M$ that bypasses $P$. Consequently, assessing the causal status of $M$ requires analysing the relationship between interventions on $P$ that succeed in varying $M$ and the resulting effect $E$.
  4.  **Terminological Neutrality:** We agree that a significant portion of our past disagreement was verbal. Specifically, we no longer dispute whether mental properties are 'real' or whether they 'do work' in a metaphysical sense. The only admissible question is whether variables representing mental properties satisfy the conditions for being difference-makers within the interventionist model, given the RFC.
  5.  **The Redundancy Case Physiology:** Regarding the specific case of multiple realisability (the 'Redundancy Case'), we agree on the physiological description: A subject exhibits effect $E$ on multiple occasions. On occasion $t_1$, mental property $M$ is realised by neural property $P_1$. On occasion $t_2$, $M$ is realised by a distinct neural property $P_2$. There is no single physical property common to both occasions. $E$ occurs in both instances. We agree that $P_1$ is sufficient for $E$ at $t_1$, and $P_2$ is sufficient for $E$ at $t_2$.

  ### 2. Residual Disagreements

  Despite the agreements above, the camps diverge on how to interpret the interventionist data, specifically concerning the appropriate contrast class and the criteria for causal selection.

  | **Issue** | **Exclusionist Position** | **Non-reductionist Position** |
  | :--- | :--- | :--- |
  | **The Unit of Causal Analysis** | Causal relations are fundamentally token-specific. On occasion $t_1$, the intervention that changes $E$ is an intervention on $P_1$. Since $P_1$ is sufficient for $E$, and $M$ adds no further variation to $E$ beyond what $P_1$ determines, $P_1$ is the sole difference-maker at $t_1$. | Causal relations are assessed at the type level to capture stability. While $P_1$ is sufficient at $t_1$, the relationship between $P_1$ and $E$ is fragile (it breaks if $P_2$ realises $M$ instead). The relationship between $M$ and $E$ is invariant across changes from $P_1$ to $P_2$. |
  | **Application of the RFC** | The RFC demonstrates that $M$ cannot be a distinct cause. To intervene on $M$, one must intervene on $P$. If one holds $P$ fixed, $M$ cannot vary (due to supervenience). Therefore, $M$ cannot be shown to make a difference to $E$ independently of $P$. $P$ screens $M$ off. | The RFC is compatible with $M$ being a cause. To test $M$, we intervene on $P$ in a way that varies $M$. To test if $P$ is the *proportional* cause, we intervene on $P$ in a way that *holds $M$ fixed* (e.g., switching from $P_1$ to $P_2$). If $E$ remains fixed when $P$ varies but $M$ does not, then $P$ is too specific to be the primary cause. |
  | **The Redundancy Case** | At $t_1$, $P_1$ causes $E$. The fact that $P_2$ *would have* caused $E$ had $P_1$ not occurred is a counterfactual backup that does not negate the actual difference made by $P_1$. $M$ is causally relevant only in virtue of being identical to (or realised by) $P_1$ at that moment. | At $t_1$, $M$ causes $E$. $P_1$ is merely the mechanism of instantiation. If we intervene to remove $P_1$ but $M$ is sustained by $P_2$, $E$ persists. Thus, $P_1$ is not necessary for $E$ given $M$. $M$ captures the relevant dependency; $P_1$ is causally excessive. |
  | **Causal Exclusion** | Given closure and the sufficiency of $P$, positing $M$ as a further cause violates the principle that we should not multiply causal relations beyond necessity. $M$ inherits causal status only if $M = P$. | Causal exclusion does not apply to difference-making. Two variables can stand in a dependency relation to $E$ without competing, provided one is a proportional abstraction of the other. $M$ and $P$ are not competitors; $M$ is the more stable predictor. |

  ### 3. Cruxes

  We identify three sub-questions such that settling one would compel at least one camp to revise its position. For each crux, we record the evidence or argument both camps agree would be decisive, and we register our predictions in advance.

  **Crux 1: The Contrast Class for Mental Intervention**
  *   **Question:** When assessing whether $M$ causes $E$ under the RFC, is the correct contrast class (a) variations in $P$ that co-vary with $M$, or (b) variations in $P$ that hold $M$ fixed?
  *   **Agreed Test:** We will construct a formal causal model of the Redundancy Case. We will apply the 'Proportionality Constraint' (that a cause should contain no more information than is necessary to predict the effect) to the model. We will determine whether the model validates $M \to E$ or $P \to E$ as the invariant relation.
  *   **Exclusionist Prediction:** The model will show that $P$ is the only variable that is strictly sufficient for $E$ in every specific context. $M$ will appear as a useful heuristic, but not a strict difference-maker, because $M$ cannot vary without $P$ varying, and $P$'s variation is what tracks $E$'s variation most precisely.
  *   **Non-reductionist Prediction:** The model will show that $P$ fails the proportionality test. Because $P_1$ and $P_2$ both lead to $E$, the specific value of $P$ makes no difference to $E$ so long as $M$ is constant. Therefore, $M$ is the variable that satisfies the interventionist criteria for causation without redundancy.

  **Crux 2: Token vs. Type Causation in Interventionism**
  *   **Question:** Does the interventionist framework privilege token-causal claims (what caused $E$ on this specific occasion) over type-causal claims (what generally causes $E$), or vice versa?
  *   **Agreed Test:** We will analyse a standard case of physical causation (e.g., a peg fitting into a hole) where multiple physical micro-structures realise the same macro-shape. We will determine whether interventionism identifies the micro-structure or the macro-shape as the cause of the peg entering the hole.
  *   **Exclusionist Prediction:** Interventionism will identify the precise micro-structural properties as the causes, because they are the ones that physically interact with the hole's boundaries. The macro-shape is a derivative description.
  *   **Non-reductionist Prediction:** Interventionism will identify the macro-shape as the cause, because interventions that alter the micro-structure while preserving the shape will not alter the outcome (the peg entering). The micro-structure is causally irrelevant detail.

  **Crux 3: The Status of the Backup Realiser**
  *   **Question:** In the Redundancy Case, does the existence of $P_2$ (the backup realiser) diminish the causal status of $P_1$ on the occasion when $P_1$ is present?
  *   **Agreed Test:** We will examine the counterfactual: 'If $P_1$ had not occurred, would $E$ have occurred?' We will agree on whether the truth of this counterfactual (which is 'Yes', due to $P_2$) negates the claim that '$P_1$ caused $E$'.
  *   **Exclusionist Prediction:** The truth of the counterfactual does not negate $P_1$'s causal status. $P_1$ was the actual difference-maker in the actual world. The availability of $P_2$ is irrelevant to the actual causal transaction.
  *   **Non-reductionist Prediction:** The truth of the counterfactual demonstrates that $P_1$ is not necessary for $E$ in the context of $M$. This shows that $P_1$ is not the robust difference-maker; $M$ is. If $P_1$ can be swapped without changing $E$, $P_1$ is not the proportional cause.

  ### 4. Closing Note

  This document represents the current limit of our consensus. We acknowledge that our standoff is no longer about the existence of mental properties or the truth of physical closure, but about the correct application of interventionist criteria for causal selection.

  **What would change the Exclusionist mind?**
  Exclusionists would revise their position if it were demonstrated that the interventionist framework *requires* proportionality as a condition for causation, and that $P$ systematically fails this condition in cases of multiple realisability. Specifically, if formal modelling shows that treating $P$ as the cause leads to unstable causal predictions across contexts where $M$ remains constant, Exclusionists would accept $M$ as the primary difference-maker.

  **What would change the Non-reductionist mind?**
  Non-reductionists would revise their position if it were demonstrated that interventions on $M$ cannot be specified without rendering the causal claim trivial or circular. Specifically, if it is shown that every intervention on $P$ that varies $M$ also introduces confounding physical variables that independently affect $E$, Non-reductionists would accept that $P$ is the only admissible causal variable.

  **Common Ground for Movement:**
  Both camps agree that empirical stability is the ultimate arbiter. If future modelling or experimental design shows that manipulating $M$ (via $P$) yields more reliable control over $E$ than manipulating specific $P$-tokens across varied contexts, both camps agree this would favour the Non-reductionist view. Conversely, if manipulating $P$ yields precise control where $M$-manipulation proves too coarse-grained to predict specific variations in $E$, both camps agree this would favour the Exclusionist view.

  We commit to resolving Crux 1 within the next three meetings.

  **Signed,**

  *The Exclusionist Camp*
  *The Non-reductionist Camp*
