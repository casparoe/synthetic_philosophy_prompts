      *   *Non-reductionist Reply:* We don't hold $P$ fixed when testing $M$. We look at the relationship between $M$ and $E$ across different realisers. $M$ is a stable difference-maker; $P$ is too specific.
      *   *Realiser-Fixing Constraint (RFC):* This is the tricky bit requested by the user. Usually, interventionists say you *can't* hold the realiser fixed when intervening on the mental (because of supervenience). The user wants the document to grapple with the idea that interventions on $M$ are *specified* as interventions on $P$. This sounds like it leans towards exclusionism, but the non-reductionist needs to frame it carefully (e.g., via the Redundancy Case).
