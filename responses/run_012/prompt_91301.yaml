answer: |-
  ### 1. Essay Question

  **Question 4 (90 Minutes)**

  In *Nicomachean Ethics* V.5 and *Politics* I.8–10, Aristotle argues that money exists by convention (*nomos*) to serve as a measure of need (*chreia*), facilitating reciprocal exchange, yet he condemns the practice of usury (interest-bearing loans) as the most unnatural form of wealth-getting because money cannot "breed" money.

  Consider the following case: A lender provides a loan at interest, but the total interest income is strictly capped so that it never exceeds what is required to sustain the lender's own household (*oikos*). The lender seeks no endless accumulation; the end of the transaction is limited household maintenance, not unlimited wealth.

  Write an essay addressing the following:
  1.  Would Aristotle be consistent in condemning this specific arrangement? Can he reject the *form* of the transaction (interest) while approving the *end* (household sustenance), or does his critique of usury depend entirely on the unlimitedness of the desire for wealth?
  2.  How does Aristotle's doctrine that money is a "measure of need" complicate his claim that usury is unnatural? If value is determined by convention and demand, does the "barrenness" of money remain a factual claim about its nature, or merely a teleological claim about its proper use?

  Your answer must argue for a definite verdict on the case while exposing the tension between Aristotle's conventionalism about money and his naturalistic critique of usury.

  ***

  ### 2. Model Answer

  **Verdict:** Aristotle must condemn the capped-interest arrangement, but doing so exposes a significant tension in his philosophy between the conventional nature of money and the naturalistic grounds of his moral critique.

  To evaluate the case, we must first distinguish Aristotle's two modes of acquisition: *oikonomia* (household management), which is natural and limited by the needs of the household, and *chrematistike* (wealth-getting), which is unnatural when it becomes an end in itself (*Politics* I.8). In the capped-interest case, the *end* is clearly *oikonomia*. The lender does not seek unlimited accumulation. If Aristotle's objection to usury rested solely on the *unlimitedness* of the desire for wealth, he should approve of this loan. However, in *Politics* I.10, Aristotle condemns usury (*tokos*) specifically because "money exists for exchange, but not for increase at interest." He argues that usury is money born from money, which is contrary to nature because coins are barren.

  Here lies the first tension. If the moral fault of *chrematistike* is purely its lack of a natural limit, then a capped interest rate should be permissible as a tool of *oikonomia*. Yet, Aristotle classifies usury as a subset of unnatural wealth-getting regardless of the immediate end. This suggests his critique is not merely about the *quantity* of wealth sought, but about the *function* of the instrument used. For Aristotle, the function of money is to measure and facilitate the exchange of goods. Using money to generate more money bypasses the production of real goods, violating the teleological function of the currency. Therefore, even with a capped end, the *means* (interest) perverts the *telos* of money. Aristotle would likely remain consistent in condemning the act, prioritizing the functional definition of money over the intention of the agent.

  However, this verdict is complicated by Aristotle's account of money in *Nicomachean Ethics* V.5. There, he argues that money does not have value by nature (*phusei*) but by convention (*nomos*). It serves as a representative of demand (*chreia*), making incommensurable goods (like shoes and houses) comparable. This is a radically conventionalist theory of value: a thing is worth what the community needs it to be.

  This conventionalism undermines the "barrenness" argument in *Politics* I.10. If money's value is purely conventional, its "nature" is simply to be whatever the law or custom says it is. To say money is "naturally barren" is to make a physical claim about metal or a token that contradicts the claim that its value is assigned by human agreement. If we agree by convention that a loan contract generates interest, then, within the conventional system, money *does* breed money. By insisting on a "natural" barrenness, Aristotle seems to retreat from his own conventionalism. He wants money to be flexible enough to measure varying needs (in the *Ethics*) but rigid enough to have a fixed natural function that usury violates (in the *Politics*).

  Furthermore, if *chreia* (need) is the common measure, value is essentially demand-based. In a lending scenario, the "need" might be for capital to buy seed grain. If the lender meets this need, and the borrower agrees to the interest as part of the measure of that need, the exchange fits the *Ethics* V.5 model of proportionate reciprocity. The usury ban implies there is an objective limit to what money *should* do, independent of the agreed needs of the exchangers.

  **Conclusion:** Aristotle would condemn the capped-interest loan because he views the *activity* of usury as intrinsically violating the function of money, not merely because it leads to unlimited wealth. However, this position is vulnerable. It requires him to treat money as having a fixed natural essence (barrenness) that overrides the conventional agreement of the users. A consistent application of his *chreia* doctrine would suggest that if the community agrees interest serves a need, the transaction is valid. Thus, the capped-interest case reveals that Aristotle's anti-usury argument relies less on the physics of money and more on a contested teleological assumption: that the purpose of money is fixed by nature, not by the needs it serves.

  *(Note: Interpretations vary on whether Aristotle's "barrenness" claim is meant literally or metaphorically. Some scholars argue he is critiquing the social separation of finance from production, while others see it as a strict ontological claim. This answer assumes the latter to highlight the tension.)*

  ***

  ### 3. Marking Scheme (30 Marks)

  **Point 1: Distinction between *Oikonomia* and *Chrematistike* applied to the Case (6 marks)**
  *   **Requirement:** Student must explain the difference between household management (limited) and wealth-getting (unlimited) and apply it to the "capped" constraint in the prompt.
  *   **Mistake costing marks:** Defining the terms without applying them to the specific constraint of the capped interest (i.e., treating the case as standard unlimited accumulation).
  *   **A vs. B:** **B** answers define the terms correctly. **A** answers recognize that the case *blurs* these terms (limited end, unnatural means) and problematize the classification.

  **Point 2: Analysis of Money as Convention and Measure (*NE* V.5) (6 marks)**
  *   **Requirement:** Student must articulate that for Aristotle, money is a measure of need (*chreia*) and exists by law/convention (*nomos*), not nature.
  *   **Mistake costing marks:** Claiming Aristotle believes money has intrinsic/natural value independent of human agreement.
  *   **A vs. B:** **B** answers state money is conventional. **A** answers explain *why* this matters (it makes value demand-based/subjective).

  **Point 3: Analysis of the Usury/Barrenness Argument (*Pol.* I.10) (6 marks)**
  *   **Requirement:** Student must explain the "money breeding money" argument and why it is deemed "unnatural" (*para phusin*).
  *   **Mistake costing marks:** Reducing the argument to "greed is bad" without referencing the specific claim about the function/barrenness of currency.
  *   **A vs. B:** **B** answers recount the barrenness metaphor. **A** answers identify this as a teleological claim about function, not just a moral preference.

  **Point 4: Verdict on the Capped-Interest Case (6 marks)**
  *   **Requirement:** Student must reach a definite conclusion on whether Aristotle condemns the specific case and justify it using the tension between means (interest) and ends (sustenance).
  *   **Mistake costing marks:** Hedging without a verdict (e.g., "He might say yes, he might say no") or ignoring the "cap" entirely.
  *   **A vs. B:** **B** answers argue Aristotle condemns it based on the unlimitedness rule. **A** answers argue he condemns it based on the *function* of money, acknowledging this contradicts the "limited end" allowance.

  **Point 5: Synthesis of the Tension (Convention vs. Nature) (6 marks)**
  *   **Requirement:** Student must explain how the *chreia* doctrine (conventional value) undermines or complicates the "barrenness" argument (natural function).
  *   **Mistake costing marks:** Treating the *Ethics* and *Politics* views as perfectly harmonious without noting the friction regarding the "nature" of money.
  *   **A vs. B:** **B** answers note the tension exists. **A** answers articulate *why* it is a tension (i.e., if value is conventional, "natural barrenness" is incoherent or purely teleological).

  **Total:** 30 Marks

  **Specific Differentiator for the 'A' Range:**
  The single move that separates an A answer from a B answer is **Point 5**: The A student recognizes that Aristotle's conventionalism about value (*NE* V.5) threatens to invalidate his naturalistic objection to usury (*Pol* I.10), whereas the B student treats them as compatible doctrines without probing the conflict.
