prompt: |-
  I'm a third-year PhD student in philosophy of biology (technically an HPS department, but my thesis is on function talk in genomics) and I'm trying to write the section of my chapter where I stop and say what an account of biological function actually has to deliver before I go on to compare the etiological, selected-effects family with the Cummins-style causal-role family. My supervisor keeps saying "state the desiderata first" and I keep not doing it, because everytime I try I end up with a list that's just the disagreement re-stated. So: can you write me the list? And I mean requirements for my purposes, which are fairly specific -- I care about the fights in genomics and ecology where one person says a stretch of DNA is functional and another says it's junk, or where an ecologist says a keystone species has a function in the ecosystem, and it turns out they mean different things by "function" than the person arguing with them. So the theory has to let us say what claim is being made, and whether its true, in those cases -- not just handle the heart.

  The cases I'd want it to get right, roughly: the heart pumping (obviously); a heart that fibrillates, where I want to say it's broken rather than that its function changed; a mutation that appeared this generation and happens to save the organism's life before selection has had any chance to act on it; a trait fixed by drift in a tiny population that now does something useful; a stretch of non-coding DNA that gets transcribed and bound by proteins but that nobody thinks is there for a reason; a synthetic metabolic loop built in a lab out of parts with no shared evolutionary history that nonetheless keeps the cells alive; and a keystone species in an ecosystem, which worries me because species don't get selected and I suspect my etiological friends can't even state the claim. Plus the old distinction between a trait's function and a mere effect it happens to have, and the thought that function attributions have to be the kind of thing that can be right or wrong without just meaning "whatever it does."

  Give me each requirement together with the case or consideration that motivates it, mark which ones are genuinely non-negotiable and which are just commitments of one camp (I have a suspicion that at least one item on my list is smuggled in by the etiologists and shouldn't be there at all), and flag any pair or triple that can't be jointly satisfied -- that's the part I actually need, because if there's a real incompatibility then my chapter has a result instead of a survey. Also tell me which single requirement does the most work in ruling candidates out. No citations or reading list needed, I know roughly who's in which camp, though a few sentences at the end on how the etiological and causal-role families fare against the list would be useful. A table is fine if it helps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year PhD student in Philosophy of Biology (HPS department). Thesis on function talk in genomics.
      *   **Task:** Write a list of desiderata (requirements) for an account of biological function.
      *   **Constraint 1:** The user struggles because their attempts just restate the disagreement (e.g., "must handle history" vs. "must handle current utility"). They need a neutral, problem-driven list.
      *   **Constraint 2:** Specific focus on genomics (junk DNA vs. functional DNA) and ecology (keystone species).
      *   **Constraint 3:** Must cover specific cases: Heart pumping, fibrillating heart (broken vs. changed function), new beneficial mutation (pre-selection), drift-fixed trait, transcribed non-coding DNA (biochemical activity vs. function), synthetic metabolic loop, keystone species.
      *   **Constraint 4:** Distinguish between *function* vs. *mere effect*, and *normative* aspect (can be wrong/broken).
      *   **Constraint 5:** Mark requirements as Non-Negotiable (NN) vs. Camp-Specific (CS).
      *   **Constraint 6:** Flag incompatibilities (trades-offs) – this is crucial for the user's chapter argument.
      *   **Constraint 7:** Identify the single most constraining requirement.
      *   **Constraint 8:** No citations/reading list (user knows the literature).
      *   **Constraint 9:** Brief comparison of Etiological (SE) vs. Causal-Role (CR) at the end.
      *   **Format:** List + Table (optional but helpful) + Analysis.

  2.  **Deconstruct the Cases & Extract Desiderata:**

      *   *Heart pumping:* Standard function. Needs to capture typical contribution to survival/system maintenance.
      *   *Fibrillating heart:* Normativity. The heart *should* pump, but isn't. It's malfunctioning, not functioning to fibrillate. -> **Normative Correctness/Malfunction.**
      *   *New beneficial mutation (pre-selection):** History is missing. SE theories struggle here. CR theories handle it easily. -> **Ahistoricity vs. Historicity.** (User wants to know if history is NN).
      *   *Drift-fixed trait:* Fixed by chance, now useful. SE says no function (no selection history for *this* trait). CR says yes (current contribution). -> **Selection vs. Current Utility.**
      *   *Transcribed non-coding DNA (ENCODE debate):** Biochemical activity $\neq$ Function. Just because it *does* something doesn't mean it's *for* something. -> **Distinction between Activity/Effect and Function.**
      *   *Synthetic metabolic loop:* No evolutionary history, but clearly functional in the system. -> **Ahistorical Function.**
      *   *Keystone species:* Species aren't selected as units (usually). SE struggles to attribute function to the *species* within the *ecosystem* unless group selection is invoked. CR handles it as a causal role in ecosystem stability. -> **Level of Selection/Unit of Function.**
      *   *Function vs. Mere Effect:* Needs to avoid panfunctionalism (everything does something, so everything has a function). -> **Selectivity/Non-Panfunctionalism.**

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Mental):* 1. Must handle norms. 2. Must handle history. 3. Must handle current cause. 4. Must distinguish junk.
      *   *Critique 1:* Too vague. "Must handle history" is already taking a side. Need to phrase it as a problem to be solved.
      *   *Attempt 2 (Better):* 1. Normativity (Malfunction). 2. Novelty (New traits). 3. Specificity (Not everything is functional). 4. Ecological applicability.
      *   *Refining for the User:* The user wants to know what the theory *has to deliver*. I need to frame these as conditions of adequacy that arise from the *practice* of biology (genomics/ecology), not from philosophical theory wars.

      *   *Drafting the List:*
          1.  **The Malfunction Constraint:** Must distinguish doing X from being *supposed* to do X. (Motivated by fibrillating heart).
          2.  **The Activity/Function Distinction:** Must distinguish biochemical/causal activity from functional status. (Motivated by ENCODE/junk DNA).
          3.  **The Novelty Constraint:** Must account for traits useful before selection acts. (Motivated by new mutation).
          4.  **The Drift Constraint:** Must account for traits fixed by drift but now useful. (Motivated by drift-fixed trait).
          5.  **The Non-Selected Unit Constraint:** Must account for functions of entities not subject to selection (e.g., species in ecosystem). (Motivated by keystone species).
          6.  **The Synthetic Constraint:** Must account for engineered systems with no history. (Motivated by synthetic loop).
          7.  **The Selectivity Constraint:** Must not attribute function to every causal effect. (Motivated by function vs. mere effect).

  4.  **Categorizing NN vs. CS:**
      *   *Malfunction:* NN. Biology relies on pathology.
      *   *Activity/Function:* NN. ENCODE debate hinges on this.
      *   *Selectivity:* NN. Panfunctionalism is useless.
      *   *Novelty/Drift/Synthetic:* These cluster together. They demand *ahistoricity*. SE theorists argue these aren't "functions" yet. So this is CS (Camp Specific to CR/Goal-Contribution).
      *   *Non-Selected Unit:* NN for ecology, but SE might deny species have functions. This is a tension point. Let's call it NN for the user's specific thesis scope (genomics/ecology).

  5.  **Identifying Incompatibilities (The "Result"):**
      *   The big tension is between **Malfunction/Normativity** and **Novelty/Ahistoricity**.
      *   SE gets Normativity easily (history sets the norm) but fails Novelty.
      *   CR gets Novelty easily but struggles with Normativity (why is a role "correct"?).
      *   *Wait, is that true?* CR usually defines function as contribution to a capacity of the containing system. Malfunction is failing to contribute. But is it *normative* in the same way?
      *   *Better Tension:* **Selectivity (Non-Panfunctionalism)** vs. **Ahistoricity**. If you drop history, what stops *every* causal effect from being a function? CR theories often struggle here (the "indiscriminability" problem).
      *   *Another Tension:* **Unit of Analysis.** SE requires a replicator/selected unit. Keystone species/Ecosystems don't fit neatly. CR fits better.
      *   *The "Smuggled" Requirement:* The idea that "Function implies History" is the smuggled one. The user suspects this. I should confirm it.

  6.  **Identifying the "Most Work" Requirement:**
      *   **The Selectivity Constraint (Non-Panfunctionalism).** This is the hardest one. Both SE and CR struggle to explain why *this* effect is the function and *that* one isn't, without begging the question. SE uses history. CR uses explanatory context. But in genomics, the pressure is high: is *this* base pair functional?

  7.  **Structuring the Response:**
      *   Introduction: Acknowledge the PhD context, validate the supervisor's advice.
      *   The List: Numbered, with Case/Motivation, NN/CS status.
      *   The Incompatibilities (The "Result"): Explicitly state the trade-offs.
      *   The "Most Work" Requirement.
      *   The "Smuggled" Requirement.
      *   Brief SE vs. CR comparison.
      *   Table summary.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "SE fails X." Say "A theory satisfying X must do Y, which conflicts with Z."
      *   *Correction on Keystone Species:* Be careful. Some SE theorists (like Godfrey-Smith) might try to stretch selection. But generally, ecosystem function is the hard case for SE.
      *   *Correction on Novelty:* The "new mutation" case is the classic "Millstein" or "Bigelow & Pargetter" counterexample to SE.
      *   *Refining the "Smuggled" item:* The requirement that "Functions must be inherited traits" is the smuggled one.
      *   *Refining the Incompatibility:* The strongest philosophical result usually lies in the tension between **Normativity** (Malfunction) and **Ahistoricity** (Novelty/Synthetic). You can't easily have a normative standard without a history to set the standard, *unless* you appeal to system goals (which brings in teleology). This is the "Normativity Problem" for CR theories.

  9.  **Final Polish:** Check tone. Needs to be academic but direct, suitable for a PhD student. No fluff. Ensure all specific cases from the prompt are mapped to the desiderata.

      *   *Cases Check:*
          *   Heart pumping -> Malfunction/Selectivity.
          *   Fibrillating -> Malfunction.
          *   New mutation -> Novelty/Ahistoricity.
          *   Drift-fixed -> Drift/Ahistoricity.
          *   Non-coding DNA -> Activity/Function Distinction.
          *   Synthetic loop -> Synthetic/Ahistoricity.
          *   Keystone species -> Non-Selected Unit.
          *   Function vs Effect -> Selectivity.

      *   *Incompatibility Check:* The "Trilemma" is often: History vs. Novelty vs. Normativity. Or Selectivity vs. Ahistoricity. I will focus on the **Normativity vs. Ahistoricity** tension as the primary philosophical result, and the **Selectivity** constraint as the filter.

  10. **Final Review against constraints:** No citations? Check. Table included? Check. NN/CS marked? Check. Incompatibilities flagged? Check.

      *(Self-Correction on "Non-Negotiable"):* I need to be careful. What is NN depends on the user's project. Since their project is genomics/ecology, "handling ecology" is NN *for them*, even if a pure SE theorist denies it. I will frame NN as "Required for your specific thesis scope" vs "Required by a specific philosophical camp."

      *Let's refine the NN/CS distinction:*
      *   NN: Constraints imposed by the *scientific practice* the user is analyzing (Genomics/Ecology).
      *   CS: Constraints imposed by a *philosophical commitment* (e.g., Naturalism, Historicism).

      *Okay, ready to write.*
answer: |-
  This is a classic bottleneck in the philosophy of biology dissertation. Your supervisor is right: you cannot evaluate the competitors until you define the job they are being hired to do. The trap you are falling into is defining the job *in terms of the competitors* (e.g., "must account for history" vs. "must account to current utility").

  To escape this, you must derive the desiderata from the **scientific practices** you are analyzing (genomics and ecology), not the philosophical literature. The requirements below are framed as conditions of adequacy based on the cases you provided.

  ### The Desiderata List

  Here are six requirements. I have marked them as **Non-Negotiable (NN)** for your specific thesis scope (because the science demands it) or **Camp-Specific (CS)** (because they reflect a philosophical commitment that one side rejects).

  **1. The Malfunction Constraint (NN)**
  *   **Requirement:** The account must distinguish between a trait *performing* a behavior and a trait *functioning* to perform that behavior. It must allow for the possibility that a trait is present but broken (normativity).
  *   **Motivating Case:** The fibrillating heart. It is causally active, but we must be able to say it is *failing* its function, not that its function has changed to fibrillating.
  *   **Status:** **NN.** Pathology is a real category in biology. An account that makes all actual effects "functions" eliminates the concept of disease/breakage.

  **2. The Activity/Function Distinction (NN)**
  *   **Requirement:** The account must distinguish between biochemical/causal activity and functional status. Mere "doing something" cannot be sufficient for "having a function."
  *   **Motivating Case:** Transcribed non-coding DNA (the ENCODE debate). A sequence can be transcribed and bound (activity) without being selected or necessary for the system (function/junk).
  *   **Status:** **NN.** This is the central dispute in genomics. If the theory cannot separate "biochemical noise" from "functional element," it is useless for your thesis.

  **3. The Selectivity Constraint (NN)**
  *   **Requirement:** The account must not be panfunctionalist. It cannot attribute a function to every causal effect a trait has on the containing system.
  *   **Motivating Case:** Function vs. Mere Effect. The heart makes a thumping sound. That is a causal effect. It is not a function.
  *   **Status:** **NN.** If everything is functional, the concept explains nothing.

  **4. The Novelty & Drift Constraint (CS)**
  *   **Requirement:** The account must be able to attribute function to traits that are beneficial but lack a history of selection for that benefit (either because they are new or fixed by drift).
  *   **Motivating Cases:** The new beneficial mutation (pre-selection); the trait fixed by drift that is now useful.
  *   **Status:** **CS.** This is the main wedge. Causal-Role (CR) theories say this is NN (biology uses these traits *now*). Etiological (SE) theories say this is false (these are "potential functions" or "effects," not proper functions, until selection acts). *Note: For your thesis on genomics, you likely need to treat this as NN, which biases you against SE.*

  **5. The Unit Flexibility Constraint (NN)**
  *   **Requirement:** The account must allow function attribution to units that are not themselves replicators or direct targets of selection.
  *   **Motivating Case:** The keystone species. Species do not reproduce as units; ecosystems do not undergo Darwinian selection in the standard sense. Yet ecologists legitimately speak of their function.
  *   **Status:** **NN.** If your chapter covers ecology, the theory must handle this. SE theorists often have to perform contortions (e.g., invoking group selection) to handle this, whereas CR handles it naturally.

  **6. The Ahistorical Engineering Constraint (CS)**
  *   **Requirement:** The account must allow for functional attribution in systems constructed without evolutionary history.
  *   **Motivating Case:** The synthetic metabolic loop.
  *   **Status:** **CS.** SE theories typically deny these have "biological functions" (calling them "design functions" instead). If you require biology to cover synthetic biology (which you arguably should in genomics), this becomes NN. If you stick to natural biology, SE can reject this.

  ---

  ### The Incompatibilities (Your Chapter's "Result")

  You suspected there are trade-offs. There are. You cannot satisfy all NN/CS requirements simultaneously without modifying the concept of "function" into different senses. Here are the two critical tensions you should highlight.

  **Tension A: The Normativity vs. Ahistoricity Trade-off**
  *   **The Conflict:** You cannot easily satisfy **The Malfunction Constraint (1)** and **The Novelty Constraint (4)** simultaneously.
  *   **Why:** To say a heart is *broken* (Malfunction), you need a standard of correctness. SE theories get this standard from History (it was selected to pump). CR theories get this from System Goals (the organism needs circulation).
  *   **The Problem:** If you allow Novelty (traits with no history are functional), you lose the historical standard for Malfunction. If a new mutation saves the organism, it has no history to be "broken" against. If it fails, was it malfunctioning or just never functional?
  *   **Result:** A theory that handles the *new mutation* (CR) struggles to explain *why* the fibrillating heart is wrong without appealing to the history it just said wasn't necessary. A theory that handles *malfunction* robustly (SE) must deny function to the new mutation.
  *   **Verdict:** You must choose whether **Normativity** or **Novelty** is the primary driver for your genomics cases.

  **Tension B: The Selectivity vs. Unit Flexibility Trade-off**
  *   **The Conflict:** You cannot easily satisfy **The Selectivity Constraint (3)** and **The Unit Flexibility Constraint (5)** simultaneously.
  *   **Why:** SE theories use Selection History to filter effects (Selectivity). But Selection History requires a Replicator (Unit). If you expand the Unit to "Species" or "Ecosystem" (for Keystone cases), the Selection History becomes vague or non-existent. If you keep the Unit strict (Genes/Organisms), you lose the Keystone cases.
  *   **Result:** CR theories handle Keystone species easily (causal role in stability) but struggle to explain why *that* role is the function and not another (Selectivity). SE theories handle Selectivity easily (history filters effects) but struggles to apply it to Keystone species (no history of species-selection).

  ### The "Smuggled" Requirement

  You suspected one item was smuggled in by the etiologists. You are correct.

  **The Smuggled Item:** The assumption that **Function implies History** is often disguised as **The Malfunction Constraint**.
  *   Etiologists argue: "You can't have malfunction without a historical standard."
  *   Your Counter: "You can have a systemic standard (homeostasis) without a historical one."
  *   **Advice:** Do not accept "Must have History" as a desideratum. Accept "Must have Normativity." History is just one *way* to deliver normativity, not the requirement itself.

  ### The Single Most Constraining Requirement

  **The Selectivity Constraint (3).**
  This does the most work in ruling candidates out.
  *   **Why:** It kills the simplest Causal-Role accounts (e.g., "Function is just any causal contribution"). If you define function as "what it does," you fail the ENCODE case (transcribed junk does something) and the Heart Sound case.
  *   **Impact:** Any theory you adopt *must* have a filtering mechanism. SE uses Selection. CR uses "Explanatory Context" or "System Goal." Your chapter should evaluate which filter works better for genomics.

  ### Summary Table

  | Desideratum | Motivation | Status | Tension |
  | :--- | :--- | :--- | :--- |
  | **1. Malfunction** | Fibrillating Heart | **NN** | Conflicts with Novelty (4) |
  | **2. Activity/Function** | Junk DNA (ENCODE) | **NN** | Conflicts with Panfunctionalism |
  | **3. Selectivity** | Heart Sound vs. Pump | **NN** | **Most Constraining** |
  | **4. Novelty/Drift** | New Mutation / Drift | **CS** | Conflicts with Malfunction (1) |
  | **5. Unit Flexibility** | Keystone Species | **NN** | Conflicts with SE History |
  | **6. Ahistorical** | Synthetic Loop | **CS** | Conflicts with SE Definition |

  ### How the Families Fare

  **The Etiological (Selected-Effects) Family:**
  *   **Wins on:** Malfunction, Selectivity, Activity/Function distinction. It is excellent at explaining why the heart is *supposed* to pump and why junk DNA isn't functional (no history).
  *   **Loses on:** Novelty, Unit Flexibility, Ahistorical Engineering. It cannot easily call the new mutation "functional" (only "potentially"), struggles with Keystone species (no species-selection), and must call the synthetic loop "artifact function" rather than biological function.
  *   **Verdict for you:** Strong for genomics *if* you only care about conserved sequences. Weak for ecology and synthetic biology.

  **The Causal-Role (Cummins-style) Family:**
  *   **Wins on:** Novelty, Unit Flexibility, Ahistorical Engineering. It handles the new mutation, the keystone species, and the synthetic loop effortlessly (they all contribute to a capacity).
  *   **Loses on:** Malfunction, Selectivity. It struggles to explain why the fibrillating heart is "wrong" (it's still causing effects) without smuggling in a goal. It risks calling transcribed junk DNA "functional" because it has a causal role (binding proteins), unless you add a restrictive clause about "relevant capacities."
  *   **Verdict for you:** Strong for ecology and novel genomic elements. Weak on the normative "junk vs. functional" distinction unless refined.

  **Recommendation:** Your chapter's "result" should likely be that for genomics/ecology, a **hybrid** or a **pluralist** approach is required, because the scientific practice demands both the Normativity of SE (for disease/junk) and the Flexibility of CR (for novelty/ecosystems). If you force one, you misdescribe the science.
