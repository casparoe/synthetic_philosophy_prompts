  - and how much rides on the alternative story Marcus keeps pushing: that the real line isn't better/worse but between moral considerations that carry a warrant to demand compliance and ones that don't, with the cost of actually demanding it of someone setting the line. If that account is right, does strong supererogation survive, or does it just get explained away as "reasons you can't fairly demand"?

