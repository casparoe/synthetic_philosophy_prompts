  Step (4) draws its force from a deep epistemic and democratic intuition: the present self is undeniably more informed about current circumstances and is the one who must endure the consequences of action. In the argument, it performs the critical work of resolving the conflict between temporal selves by privileging the "now," effectively modeling the person as a sequence of momentary dictators rather than a unified agent. It appeals to the idea that consent must be current to be valid, making the earlier self's authority seem like an unjustified imposition from the past.

  - The other candidates and what they cost
  Rejecting step (1) would require you to abandon the preference-based model of authority entirely, positing instead that authority comes from objective reasons independent of the agent's desires. This exits the framework of rational choice theory you work within and introduces metaphysical baggage about value realism that may be unnecessary. Rejecting step (2) denies personal identity over time, suggesting the earlier and later selves are different people; while this solves the binding problem, it destroys the foundation of moral responsibility, legal continuity, and memory, costing you far more than just precommitment. Rejecting step (3) is logically untenable because it follows directly from (1) and (2); denying it would require you to argue that the same person's preferences do not derive authority from their personhood, which is incoherent.

  Rejecting steps (5), (6), and (8) individually is impossible without rejecting their premises, as they are deductive conclusions from step (4); to deny them while accepting (4) would make your position logically inconsistent. Rejecting step (7) accepts that the individual and collective cases are disanalogous, which might save constitutional theory via political legitimacy arguments but forces you to concede that individual Ulysses contracts are indeed fictitious. This fractures your theory, requiring one account for individuals and another for polities, whereas rejecting (4) offers a unified account of diachronic agency. Finally, rejecting step (9) means accepting your friend's conclusion that binding is always a fiction; this costs you the core intuition of autonomy and constitutionalism, reducing all long-term planning to mere price-setting and rendering the concept of a constitution incoherent.

  - What is left standing
  You are left with a theory of diachronic rationality where authority derives from the integrity of a life plan rather than momentary preference satisfaction. The cost is that you must now specify when an earlier preference binds—typically when it reflects a higher-order volition or rational plan—and accept that both individuals and polities can be legitimately bound by their past selves against their present whims. This preserves the reality of entrenchment in both cases, though it demands a more complex view of the self as a planner over time rather than a series of instantaneous choosers.
