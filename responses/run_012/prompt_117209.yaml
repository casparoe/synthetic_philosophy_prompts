prompt: |-
  I'm in a political philosophy reading group that's been meeting for about two years, and we keep circling back to the same fight: what is distributive justice supposed to be equalizing — resources, welfare, or capabilities? We've got a resourcist (equalize bundles of goods and opportunities, and then hold people responsible for how they convert those into lives), a welfarist (what matters is how well people's lives actually go, so equalize welfare on whatever measure you like), and a capability person (what matters is what people are really able to do and be, and since the conversion rates from goods into functionings vary so much between people, equal goods isn't equality of anything interesting). None of them are caricatures; they know each other's objections cold. And yet nobody has moved an inch.

  What stalls us is that whenever we test a view against a case, the case just gets re-described in each person's preferred vocabulary. Case from last week: someone with a treatable condition who declines treatment, has adapted to a restricted life, and reports being perfectly content. The welfarist says she's fine, the capability person says she's missing something real, the resourcist says she's got the bundle and can do what she likes with it. We agree on every fact about her. So it isn't obviously an empirical disagreement — though one of us keeps insisting that the real dispute is about how much weight preferences can bear as a measure of anything at all.

  My working hypothesis, and I'd like you to try to knock it down: the three positions aren't three answers to one question but answers to three different questions wearing a single label — what makes a life go well, what a just distribution has to equalize, and what an institution can legitimately measure and act on. And once you separate those, the bit of genuine disagreement left over is about where to locate responsibility: what a person can be held to, and what has to be treated as bad luck that the distribution absorbs. If that's right, the currency question is downstream of the responsibility question, and a lot of the literature is arguing about the wrong variable. The rival diagnosis I can't rule out is that it's verbal all the way down: any metric can be redescribed in the terms of the others — resources are just capability-inputs, capabilities are just resources indexed to persons, welfare is what capabilities are for — so the argument is really about which description we should let do the work, and that's a question about purposes, not about equality.

  So: which diagnosis do you give, and why? I dont want a verdict on which currency is correct, and I dont want a survey of the literature — I want to know what kind of disagreement this actually is, engaging the positions as I've described them. Is there a hidden empirical or formal question doing the work (measuring conversion rates, individuating capability sets, the structure of responsibility for ends)? Are the sides answering different questions under one name? Is part of the impasse a clash of starting intuitions about a handful of cases that neither side can argue for? And what would count as progress here — a distinction, a decision about what the metric is for, splitting the question in two — or should we expect this to run forever, and if so, why?

  Write your answer in British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **Context:** A political philosophy reading group meeting for two years.
      *   **The Problem:** A stalemate on the "currency of egalitarian justice" (Resources vs. Welfare vs. Capabilities).
      *   **The Participants:** Sophisticated interlocutors (not caricatures), know each other's objections, agree on facts, but reinterpret cases through their own vocabularies.
      *   **The Specific Case:** A person with a treatable condition who declines treatment, adapts, and reports contentment.
      *   **The User's Hypothesis:** The three positions answer *different* questions (well-being vs. distribution vs. institutional measurability) masked as one. The real disagreement is about *responsibility* (luck vs. choice). Therefore, the currency question is downstream of responsibility.
      *   **The Rival Diagnosis:** It's verbal all the way down. Metrics are intertranslatable (resources = capability inputs, etc.). The argument is about *purpose*, not equality.
      *   **The Task:** Diagnose the *kind* of disagreement this is. Don't pick a winner. Don't survey literature. Engage the positions as described. Address hidden empirical/formal questions, starting intuitions, and what counts as progress.
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the User's Hypothesis vs. The Rival Diagnosis:**
      *   *User's Hypothesis:* It's about responsibility/location of the cut between luck and choice. Currency is derivative.
      *   *Rival Diagnosis:* It's verbal/pragmatic. Metrics are isomorphic; it's about which tool fits the job.
      *   *My Assessment:* Both capture part of the truth, but neither captures the *structural* reason for the impasse. The impasse isn't just about responsibility or vocabulary; it's about the *temporal and normative locus of evaluation*.
      *   *Resources:* Ex-ante focus (opportunity).
      *   *Welfare:* Ex-post focus (outcome/experience).
      *   *Capabilities:* Mid-stream focus (effective freedom).
      *   The disagreement is fundamentally about *what kind of relationship the state should have with the citizen's agency*.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the group. Validate that this is a classic impasse (the "equality of what?" debate). State the thesis: It is neither purely verbal nor purely about responsibility. It is a disagreement about the *normative significance of agency* and the *temporal locus of justice*.

      *   **Critique of the User's Hypothesis (Responsibility):**
          *   The user says currency is downstream of responsibility.
          *   Counter: Responsibility presupposes a currency. You can't hold someone responsible for welfare if welfare is subject to adaptive preferences (the case study). You can't hold them responsible for resources if conversion is impossible due to disability.
          *   So, the definition of the currency *constitutes* the scope of responsibility, not vice versa. They are co-determined.

      *   **Critique of the Rival Diagnosis (Verbal/Pragmatic):**
          *   The user says metrics are intertranslatable.
          *   Counter: They aren't perfectly isomorphic. Adaptive preferences break the link between welfare and objective states. Conversion factors break the link between resources and functionings.
          *   It's not just vocabulary; it's about *incommensurability* in hard cases (like the adapted life).

      *   **The Real Diagnosis: The Locus of Agency and Time:**
          *   *Resourcism:* Liberal neutrality. The state provides the means; the citizen is the sovereign judge of the ends. Time: Ex-ante (before choice).
          *   *Welfarism:* Consequentialist benevolence. The state cares about the felt quality of life. Time: Ex-post (after adaptation).
          *   *Capability:* Effective Freedom. The state cares about the *real* opportunity, acknowledging that formal opportunity (resources) isn't enough, but refusing to judge subjective satisfaction (welfare). Time: Mid-stream (at the point of functioning).
          *   The disagreement is: *Should justice respect the citizen's actual choices (even bad ones), or should it ensure the citizen has the effective power to choose otherwise?*

      *   **The Case Study (The Adapted Life):**
          *   This is the crux.
          *   Resourcist: Respect her autonomy (she chose).
          *   Welfarist: Respect her experience (she is happy).
          *   Capabilitarian: Disrespect her choice/experience to protect her *freedom* (she *could* be healthy but isn't).
          *   This reveals the conflict isn't about measurement, but about *paternalism vs. neutrality*.

      *   **Hidden Empirical/Formal Questions:**
          *   It's not about conversion rates (empirical).
          *   It's about the *moral weight of adaptation*. Is adaptive preference a distortion of welfare or a valid exercise of agency?
          *   It's about *individuation*. Can we define a capability set without referencing the person's values? (Sen says yes, Nussbaum says maybe not).

      *   **What Counts as Progress?**
          *   Stop trying to find the "One True Currency."
          *   Acknowledge that different currencies serve different *political relationships*.
          *   Progress = Deciding what kind of political relationship you want.
          *   Split the question: Distributive Justice for basic structure vs. Ethical Evaluation of lives.

      *   **Conclusion:** The debate runs forever if seeking a metaphysical truth about "equality." It resolves if treated as a political choice about the limits of state authority over individual agency.

  4.  **Refining the Tone and Language:**
      *   Must be British English (e.g., "equalising," "programme," "colour," "whilst," "centre").
      *   Tone should be respectful, analytical, and philosophically rigorous, matching the user's level.
      *   Avoid condescension.
      *   Ensure the distinction between "responsibility" and "agency" is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I pick a winner? *No.*
      *   *Check:* Did I survey literature? *No, kept it conceptual.*
      *   *Check:* Did I address the specific hypothesis? *Yes, critiqued the "downstream" claim.*
      *   *Check:* British spelling? *Need to ensure "equalising," "behaviour," "labelled," etc.*
      *   *Check:* Did I answer "what kind of disagreement this is"? *Yes, normative/political relationship.*

  6.  **Final Polish:** (Mental check of specific phrases)
      *   Instead of "You're wrong," use "Your hypothesis captures X, but misses Y."
      *   Ensure the distinction between *ex-ante* and *ex-post* is clear.
      *   Make sure the "adapted life" case is central to the argument.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Your hypothesis is compelling, and it diagnoses a significant portion of the friction. You are right to suspect that the 'currency' debate is often a proxy for a deeper dispute about responsibility and the luck/choice cut. However, I suggest that locating the disagreement *solely* in responsibility, or dismissing it as merely verbal, misses the structural engine driving the impasse.

  The disagreement is not merely about where to draw the line of responsibility, nor is it simply a pragmatic choice of vocabulary. It is a fundamental clash regarding the **temporal locus of evaluation** and the **normative status of agency**.

  Let me explain why your hypothesis, while insightful, requires refinement, and why the 'verbal' diagnosis is too deflationary.

  ### 1. Responsibility is not Upstream of Currency
  You propose that the currency question is downstream of the responsibility question. I would argue they are co-constitutive. You cannot determine what a person is responsible *for* until you have decided what the 'object' of justice is.

  Consider your case of the adapted life.
  *   For the **resourcist**, the individual is responsible for their welfare because welfare is subjective and endogenous. To hold society responsible for her contentment would be to violate her sovereignty as a chooser.
  *   For the **welfarist**, the individual is *not* responsible for the drop in welfare caused by the condition, but if she adapts, the deficit disappears. Responsibility is moot because the harm is gone.
  *   For the **capabilitarian**, the individual cannot be held fully responsible for the 'choice' to decline treatment if that choice stems from adaptive preferences (a restricted imagination of what is possible).

  Notice that the scope of responsibility shifts depending on the currency. If you choose resources, you maximise the sphere of personal responsibility for outcomes. If you choose capabilities, you expand the sphere of social responsibility to include the *conditions of choice* themselves. Therefore, you cannot settle the responsibility question first. The choice of currency *is* the choice of how much of the human condition we treat as a matter of political justice versus private fate.

  ### 2. It Is Not Merely Verbal
  The rival diagnosis suggests that resources, welfare, and capabilities are intertranslatable descriptions of the same underlying reality. This is formally incorrect. They are not isomorphic.

  In the case of adaptive preferences, the metrics diverge irreconcilably.
  *   **Resources:** High (she has the treatment available).
  *   **Welfare:** High (she reports contentment).
  *   **Capabilities:** Low (she is not functioning in a healthy state, and her freedom to do so is unexercised).

  If the metrics were merely different descriptions of the same thing, they would correlate perfectly. They do not. The disagreement is substantive because the theories rank social states differently. A society of contented slaves is a success for welfarism, a failure for capabilitarians, and ambiguous for resourcists (depending on whether they own themselves). This is not a verbal dispute; it is a conflict of normative ranking.

  ### 3. The Real Disagreement: The Political Relationship
  So, what kind of disagreement is this? It is a disagreement about the **proper relationship between the state and the citizen's agency**.

  *   **Resourcism** is grounded in a conception of **neutrality**. The state provides the all-purpose means; the citizen is the sole judge of the good. It respects the citizen as a *chooser*, even if they choose poorly. The temporal locus is *ex-ante* (before the choice is made).
  *   **Welfarism** is grounded in a conception of **benevolence**. The state cares about how life *feels*. It respects the citizen as a *sentient being*. The temporal locus is *ex-post* (after adaptation has occurred).
  *   **Capabilitarianism** is grounded in a conception of **effective freedom**. The state cares about what the citizen can *do*, regardless of whether they do it or enjoy it. It respects the citizen as an *agent with potential*. The temporal locus is mid-stream (at the point of functioning).

  Your group is stuck because you are arguing about measurement while actually arguing about **paternalism**. The capabilitarian is willing to be more paternalistic than the resourcist (by saying the adapted woman is missing something real despite her consent) but less paternalistic than the welfarist (by not requiring her to be happy, only free). The resourcist refuses to look inside the 'black box' of conversion; the welfarist looks only at the output; the capabilitarian looks at the machinery inside the box.

  ### 4. Hidden Empirical and Formal Questions
  You asked if there is a hidden empirical or formal question doing the work. There is, but it is not about conversion rates. It is about the **moral weight of adaptation**.

  The empirical question that actually matters is: *To what extent are preferences endogenous to injustice?*
  If adaptive preferences are rare, the welfarist and capabilitarian converge. If they are ubiquitous, the welfarist view becomes a tool for legitimising oppression (the 'happy slave' problem). Your group agrees on the facts of the specific case, but you likely disagree on the *generalisability* of that case. The resourcist assumes adaptation is a valid exercise of autonomy; the capabilitarian assumes it is often a distortion caused by deprivation. This is a sociological and psychological disagreement masked as philosophy.

  Furthermore, there is a formal question about **individuation**. Can we define a capability set without referencing the person's own valuation of those capabilities? If the woman does not value health, is 'health' really a capability *for her*? Sen says yes (objective list); some critics say no. Until you settle whether capabilities are objective or subjective, the metric remains unstable.

  ### 5. What Counts as Progress?
  You should not expect this debate to resolve if you are seeking the 'One True Currency'. There isn't one, because justice serves multiple masters: liberty, well-being, and fairness.

  Progress would come from **splitting the question**.
  1.  **Distinguish the Basic Structure from Ethical Evaluation:** Perhaps resources are the correct currency for the *basic structure* (constitutional essentials, rights, income) because they are publicly verifiable and respect neutrality. Capabilities might be the correct currency for *specific policy interventions* (healthcare, education) where conversion factors are known to be skewed.
  2.  **Acknowledge the Trade-off:** Admit that moving from resources to capabilities gains sensitivity to human diversity but loses clarity and invites paternalism. Moving from capabilities to welfare gains sensitivity to subjective experience but loses the ability to criticise oppressive adaptation.
  3.  **Reframe the Goal:** Stop asking "What is equality?" and start asking "What kind of political relationship do we want?" Do you want a state that guarantees you the means (Resourcism), guarantees you the freedom (Capabilities), or guarantees you the satisfaction (Welfare)?

  ### Conclusion
  Your hypothesis that the dispute is about responsibility is half-right. It is about responsibility, but specifically about **what aspects of the human condition are subject to political repair**.

  The impasse persists because each theory captures a genuine moral intuition that the others sacrifice.
  *   The Resourcist captures the intuition that people should bear the costs of their own tastes.
  *   The Welfarist captures the intuition that suffering is what matters.
  *   The Capabilitarian captures the intuition that freedom is valuable even when unexercised.

  The debate runs forever if treated as a metaphysical search for the essence of equality. It resolves only when treated as a political choice about the limits of state authority. Your group will not move an inch until you stop asking which view is *true* and start asking which view is *tolerable* in a pluralistic society. The disagreement is not about the map; it is about the destination.
