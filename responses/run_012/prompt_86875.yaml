answer: |-
  You have not garbled the theorem. Your technical grasp of Harsanyi's Aggregation Theorem (HAT) is solid: if individuals and society satisfy von Neumann-Morgenstern (vNM) rationality axioms, and society respects the Pareto principle (specifically Ex-Ante Pareto), then social welfare must be a linear combination of individual utilities.

  Your error is not in the math, but in the metaphysics. You describe the axioms as "pure bookkeeping." They are not. They are substantive moral claims disguised as rationality constraints. HAT does not prove utilitarianism; it proves that *if* you accept a specific, controversial package of rationality and moral constraints, *then* you get a weighted utilitarian form.

  Here are the defeaters, ranked by how much they should destabilize the view that HAT settles the debate.

  ### 1. The Heterogeneous Priors Problem (The "Spurious Unanimity" Defeater)
  **Rank:** Fatal / High
  **The Issue:** You asked about the case where two people disagree on probabilities. HAT typically assumes a common prior or applies Pareto to subjective expected utilities. If individuals have different priors, the Ex-Ante Pareto axiom becomes morally toxic.
  **The Scenario:** Alice thinks a coin is 90% Heads; Bob thinks it's 90% Tails. They bet against each other. Both expect to gain. Ex-Ante Pareto says society must accept the bet (since everyone prefers it). But society knows the coin is 50/50 (or that one of them is wrong). Society is being money-pumped based on conflicting errors.
  **The Cost:** To avoid this, you must drop Ex-Ante Pareto (requiring agreement on outcomes, not just expectations) or impose a Common Prior.
  *   **If you drop Ex-Ante Pareto:** The theorem collapses. You no longer get a weighted sum. You can get Prioritarianism or other views.
  *   **If you impose a Common Prior:** You are assuming away moral disagreement about facts. You are forcing society to adopt a specific epistemic stance that may not exist.
  **Defender's Move:** Most sophisticated defenders concede Ex-Ante Pareto is too strong when priors diverge. They retreat to "Ex-Post Pareto" (if everyone prefers outcome X to Y in every state, society does too). But Ex-Post Pareto is too weak to generate the weighted sum result.
  **Verdict:** This is the strongest defeater. It shows the "bookkeeping" axiom (Pareto) actually encodes a specific, often implausible, epistemic policy.

  ### 2. The Weights and Normalization Problem
  **Rank:** High
  **The Issue:** You correctly note that HAT yields $W = \sum a_i u_i + b$. It does not yield $a_i = 1$. To get Classical Utilitarianism, you need equal weights.
  **The Normalization Trap:** Utilities are unique only up to positive affine transformation ($u' = au + b, a > 0$). To sum them, you must normalize them (e.g., set min utility to 0, max to 1). But *which* min and max?
  *   If Alice has a capacity for joy/suffering 10x Bob's, normalizing their ranges to [0,1] silences her intensity.
  *   If you don't normalize, the sum is meaningless (adding "apples" of utility to "oranges").
  **The Veil of Ignorance:** You suspected the Veil is doing the work. You are right. HAT provides the *structure* (aggregation); the Veil of Ignorance (Harsanyi's separate argument) provides the *weights* (impartiality).
  **The Cost:** HAT alone commits you to *Weighted* Utilitarianism. It is compatible with giving the dictator weight 1 and everyone else 0. To get equality, you need a separate moral premise about the equal moral status of persons.
  **Verdict:** Not fatal to the *form* of the view, but fatal to the claim that HAT *alone* justifies standard Utilitarianism. It kicks the can of interpersonal comparison down the road.

  ### 3. The Fairness Objection (Ex-Ante vs. Ex-Post Equity)
  **Rank:** Medium-High
  **The Issue:** The "Coin Flip" case (Diamond's example). One kidney, two patients.
  *   Option A: Give to Patient 1 (Sure thing).
  *   Option B: Flip a coin (50% chance for each).
  *   If both patients prefer the coin flip (valuing ex-ante fairness), HAT says society must prefer the coin flip.
  *   But if the coin lands on Patient 1, the outcome is identical to Option A. If it lands on Patient 2, Patient 1 dies unfairly.
  **The Cost:** HAT respects preferences over lotteries. It cannot distinguish between "risk" and "unfairness" unless individuals encode fairness into their utility functions. If individuals are self-interested EU maximizers, they don't care about the other guy's fate in the other branch of the lottery. HAT forces society to be indifferent to ex-post inequality if individuals are.
  **Defender's Move:** "If you care about fairness, that preference should be in the utility function."
  **Counter:** This makes the theory tautological. It assumes away the conflict between efficiency and equity by defining equity as a preference.
  **Verdict:** A significant cost. It forces you to deny that fairness is an objective feature of outcomes, reducing it entirely to subjective satisfaction.

  ### 4. The vNM Rationality Assumption
  **Rank:** Medium
  **The Issue:** HAT requires individuals and society to be Expected Utility maximizers.
  *   **Individuals:** People violate vNM axioms (Allais paradox, loss aversion). If the inputs aren't vNM utilities, the theorem doesn't apply.
  *   **Society:** Why should *society* be risk-neutral over utility? Prioritarianism argues society should be risk-averse regarding the *distribution* of utility (give priority to the worse off). HAT forbids this. If individuals are risk-neutral, society must be. If individuals are risk-averse, society's risk attitude is fixed by the sum.
  **The Cost:** You cannot be a Prioritarian and accept HAT. Prioritarianism applies a concave transformation to utility *before* summing ($W = \sum f(u_i)$). HAT proves $f$ must be linear.
  **Verdict:** This isn't a bug, it's a feature. But it means HAT is an argument *against* Prioritarianism and Rawlsian Maximin, not a neutral framework. It assumes the conclusion (linearity) in the axioms (Independence of Irrelevant Alternatives / Sure-Thing Principle).

  ### 5. Falsifiability and Status
  **Rank:** Meta-Level
  **The Question:** Is this falsifiable?
  **The Answer:** No, not empirically. It is a representation theorem, like Arrow's Impossibility Theorem. It is a conditional statement: *If* axioms A, B, C hold, *Then* Result R follows.
  **How to "Falsify" it:** You falsify it normatively, not empirically. You show that accepting the axioms leads to a moral conclusion you reject (e.g., the Spurious Unanimity bet).
  **The Risk:** The view risks becoming a "research program" that collects caveats. (e.g., "Okay, priors differ, so we adjust Pareto... okay, weights are arbitrary, so we add Veil...").
  **Verdict:** It is not a scientific theory. It is a clarification of commitments. If you accept the axioms, you are a utilitarian. If you reject utilitarianism, you *must* reject an axiom. The theorem forces you to locate your disagreement.

  ---

  ### What Defenders Concede vs. Wave Off

  | Objection | Defender's Concession | Defender's Wave-Off |
  | :--- | :--- | :--- |
  | **Weights** | Concedes HAT doesn't fix equal weights; needs Veil of Ignorance or moral premise. | Waves off normalization issues as technicalities solvable by "standard" scaling. |
  | **Priors** | Concedes Ex-Ante Pareto fails with heterogeneous priors (Gilboa et al.). | Waves off by assuming "rational" agents should converge on priors (Harsanyi's view). |
  | **Fairness** | Concedes HAT ignores ex-post equality. | Waves off by claiming ex-ante fairness (the lottery) *is* the relevant moral metric. |
  | **EU Axioms** | Concedes humans aren't perfect EU maximizers. | Waves off by claiming EU is a *normative* standard of rationality, not descriptive. |

  ### Commitments vs. Rawls/Prioritarianism

  *   **Rawls:** Rawls rejects the vNM axioms for social choice (specifically the risk-neutrality required to maximize average utility behind the veil). He argues rational agents would use Maximin, not Max Expected Utility. HAT commits you to rejecting Rawls.
  *   **Prioritarianism:** Prioritarians accept EU but reject the linearity of aggregation. They want to weight gains to the worse off more heavily. HAT proves this violates Ex-Ante Pareto (if the rich and poor both prefer a gamble, society must too, even if it hurts the poor more). HAT commits you to rejecting Prioritarianism.

  ### The Honest Verdict

  You asked if the position is falsifiable or just collects caveats.

  **It collects caveats.**

  Harsanyi's Aggregation Theorem is not a "proof" of utilitarianism in the way a math proof establishes a truth. It is a **clarification of cost**. It tells you: "If you want to respect individual preferences under uncertainty (Pareto) and be rational (EU), you *must* pay the price of Utilitarianism."

  The "defeaters" are simply price tags.
  *   Want to avoid the Spurious Unanimity bet? **Price:** Drop Pareto (and lose the theorem).
  *   Want to protect the worse off (Prioritarianism)? **Price:** Drop Linearity (and violate Pareto over lotteries).
  *   Want equal weights? **Price:** Add a moral premise external to the theorem.

  **Where your reading goes wrong:** You treat the axioms as "bookkeeping." They are not. They are the moral substance. The theorem doesn't do the work; the **Pareto Axiom** does the work. The theorem just shows you where that axiom leads. Being anti-utilitarian isn't a complaint about the conclusion; it's a rejection of the claim that "Society should satisfy the same rationality axioms as an individual" or "Society must respect subjective expectations even when they are mutually inconsistent."

  If you walk away with one thing: HAT is a powerful tool for **intellectual honesty**. It prevents you from being a "secret utilitarian" who claims to care about rights or equality while secretly maximizing expected preference satisfaction. It forces you to admit which axiom you are breaking to save your intuition. But it does not, and cannot, prove that Utilitarianism is the *only* sensible view. It only proves it is the only sensible view *given* a specific, contestable definition of rationality and respect.
