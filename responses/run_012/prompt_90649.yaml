      *   *Hunch 4 (Dream Status):* **Kill (as a priority).** It's too abstract/semantic. Whether the Dream is a myth or fact matters less than the *function* of the belief. This is a philosophical rabbit hole that won't change institutional design much.

  4.  **Develop the Agenda Items (Ranking & Justification):**
      *   *Criterion for Ranking:* Leverage (upstream/downstream), Tractability (can a philosopher actually do this?), Impact (does it change what foundations/schools do?), Neglectedness.
      *   *Priority 1: The Exit Cost Hypothesis (Hunch 2).* Why? It's the crux. It explains *when* leveling is virtuous (insurance) vs. vicious (spite). It dictates policy (increase exit options vs. change culture). It's tractable (conceptual analysis of game theory + norms).
