      *   *Hunch 1 (Upward vs. Sideways):* **Keep but Refine.** The distinction is real, but "Crab Bucket" is often just a mechanism of Tall Poppy. The real leverage is *who enforces the norm*. Is it the elite cutting rivals (upward/sideways among elites) or the community cutting the exceptional (downward/upward)? Actually, the user's distinction is about *target*. Sideways enforcement among peers is indeed the mobility killer. This is high priority.
      *   *Hunch 2 (Exit Costs):* **Keep and Promote.** This is the most mechanistic/explanatory variable. It moves the debate from "culture is bad/good" to "incentive structures under constraints." It's tractable for conceptual work.
