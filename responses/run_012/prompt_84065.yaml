answer: |-
  # Activity Specification: "The Heritability Engine"

  ## 1. Preparation and Setup

  **Materials:**
  *   **Laptop & Projector:** Connected to the whiteboard. You will run a local script (Python/R/Excel) that accepts data input and outputs the Mean, Variance, and Squared Correlation ($R^2$).
  *   **ID Cards:** 20 cards numbered 0–19. These are the **Genotypes**. Hand one to each participant at the start. They keep this card for the entire session.
  *   **Phenotype Slips:** 300 small slips of paper (20 participants × 5 slips × 3 rounds).
      *   *Pre-generation:* Do not generate these live. Write a script beforehand to generate three datasets corresponding to the three rounds below. Print them on distinct colored paper (e.g., White, Blue, Pink) to distinguish rounds.
      *   *Distribution:* Bundle them into 20 envelopes per round. Each envelope contains 5 slips for that specific participant's genotype.
  *   **Prediction Cards:** Index cards (3 per person).
  *   **Poker Chips:** A bowl at the front.
  *   **Whiteboard:** Divide into three columns: "Round 1," "Round 2," "Round 3." Rows: "Rule," "Estimate ($R^2$)," "Truth."

  **The Estimator (Whiteboard Definition):**
  Write this clearly at the start. Do not use the word "Heritability" until the debrief.
  > **The Predictability Score:**
  > 1. Collect all (Genotype, Phenotype) pairs from the room.
  > 2. Calculate the Correlation ($r$) between Genotype and Phenotype.
  > 3. Square it ($R^2$).
  > *Meaning:* How much of the *spread* in scores is predictable from the ID number?

  **Timing:** 90 Minutes total.

  ---

  ## 2. The Activity Flow

  ### Introduction (10 Minutes)
  1.  **Assign Genotypes:** Hand out ID cards 0–19. Tell them: "This number is your Genotype. It is fixed. It never changes. It does not mean you are better or worse; it is just your label for this experiment."
  2.  **Define the Task:** "In each round, you will receive 5 slips. Each slip has a number (Phenotype). This number is a measurement of a trait (e.g., height, test score, velocity). Your job is not to calculate the math—I will do that on the laptop. Your job is to bet on what the math will say."
  3.  **The Stake:** "Before I reveal the rule or the result, you will write a prediction on an index card: Will the Predictability Score go up, down, or stay the same compared to the last round? If you are directionally correct, you get a chip."

  ### Round 1: The Baseline (20 Minutes)
  *   **Distribution:** Hand out **White Slips**.
  *   **The Secret Rule:** $Phenotype = Genotype + Environment$.
      *   $Genotype$: Their ID (0–19).
      *   $Environment$: Random noise drawn from $N(0, 6^2)$.
      *   *Target:* $R^2 \approx 0.5$.
  *   **Prediction:** Ask the group: "You have an ID. You have scores. Some of the score comes from the ID, some from luck/environment. What do you expect the Predictability Score to be? 0? 1? Something in between?" (Let them discuss briefly, write predictions).
  *   **Calculation:** Collect all 100 slips. Input data into laptop. Project the result.
      *   *Expected Output:* $R^2 \approx 0.45 - 0.55$.
  *   **The Reveal:** Write "G + E (Independent)" on the board.
      *   *Script:* "The rule was: Your Score = Your ID Number + A Random Roll of the Dice. The dice were fair and independent for everyone."
      *   *Award Chips:* To those who predicted "middle" or "0.5".

  ### Round 2: The Constant Environment (20 Minutes)
  *   **Distribution:** Hand out **Blue Slips**. Remind them their ID (Genotype) is unchanged.
  *   **The Secret Rule:** $Phenotype = Genotype + Constant$.
      *   $Constant$: Add 50 to everyone's score. (Or simply $Phenotype = Genotype$).
      *   *Target:* $R^2 \approx 1.0$.
  *   **Prediction:** "Same people. Same IDs. New slips. Will the Predictability Score go up, down, or stay the same?"
      *   *Trap:* Many will say "Stay the same" because genes didn't change.
  *   **Calculation:** Collect slips. Input data. Project result.
      *   *Expected Output:* $R^2 \approx 0.95 - 1.0$.
  *   **The Reveal:** Write "G + Constant" on the board.
      *   *Script:* "The rule was: Your Score = Your ID Number + 50. The 'environment' was exactly the same for everyone. There was no noise."
      *   *Key Question:* "Did your genes change? No. Did the environment stop affecting the trait? No (you needed the +50 to exist). But the Score went to 1.0. Why?"
      *   *Award Chips:* To those who predicted "Up".

  ### Round 3: The Confound (25 Minutes)
  *   **Distribution:** Hand out **Pink Slips**.
  *   **The Secret Rule:** $Phenotype = Environment$. $Genotype = 0$ (Causally).
      *   *Mechanism:* $Environment = Genotype \times 1.0 + Noise$.
      *   *Crucial Detail:* The environment was *assigned* based on the Genotype, but the Genotype did not *cause* the Phenotype biologically.
      *   *Target:* $R^2 \approx 0.7$.
  *   **Prediction:** "Same people. Same IDs. New slips. Will the Predictability Score be high or low?"
      *   *Trap:* If the correlation is high, they will assume genes are causal.
  *   **Calculation:** Collect slips. Input data. Project result.
      *   *Expected Output:* $R^2 \approx 0.65 - 0.75$.
  *   **The Reveal:** Write "E (Correlated with G)" on the board.
      *   *Script:* "The rule was: Your Score = A Random Environment Assignment. **However**, I assigned the environments such that people with higher ID numbers got higher environment scores. Your Genotype caused nothing. The correlation is real, but the causation is zero."
      *   *Award Chips:* To those who predicted "High" (most will). Then ask: "Does this high score mean the trait is genetic?" (Silence/Confusion is the goal).

  ---

  ## 3. The Debrief (15 Minutes)

  Do not lecture. Use the whiteboard columns you filled during the reveals to map the activity to the concepts.

  **1. Heritability is about Variation, not Individuals.**
  *   *Point to Round 2:* "In Round 2, the score was 1.0. Does that mean your ID *caused* your score? Yes. Does it mean the environment didn't matter? No. If I hadn't added the constant, you'd all have scored 0. The number 1.0 describes the *spread* in this room, not the cause of the height."
  *   *Claim:* Heritability is a property of the **variation** in a population at a time, not a property of the trait or the individual.

  **2. High Heritability $\neq$ Unchangeable.**
  *   *Point to Round 2:* "The score was 1.0. If I change the environment (the constant), does the score change?"
  *   *Live Demo:* Take the Round 2 data on your laptop. Add +100 to every Phenotype value.
      *   *Show:* The Mean changes drastically. The $R^2$ stays 1.0.
      *   *Claim:* A trait can be 100% heritable and still be 100% responsive to environmental change. The number says nothing about what happens if you change the environment.

  **3. Correlation $\neq$ Causation (Gene-Environment Correlation).**
  *   *Point to Round 3:* "The score was 0.7. Did genes cause this?"
  *   *Answer:* "No. The environment tracked the genes."
  *   *Claim:* A high estimate can be produced entirely by gene-environment correlation (e.g., wealthy families pass on both genes and books). The estimator cannot tell the difference without experimental control.

  **4. The One Sentence Summary.**
  *   Ask the group to write this on their last index card:
      *   *"A heritability number licenses claims about the **source of variation** in this specific group, but it does not license claims about **causation**, **fixity**, or **between-group differences**."*
  *   Ask: *"What is the one thing in this room you would need to know to interpret this number?"*
      *   *Answer:* **The Distribution of Environments.** (Without knowing if environments were equal, correlated, or random, the number is ambiguous).

  ---

  ## 4. Predictable Failure Modes & Mitigations

  **1. "Half My Trait Is Genetic" (The Reification Error)**
  *   *Failure:* A participant says, "So in Round 1, 50% of my height is genes."
  *   *Fix:* Point to their ID card. "This card is 100% your genes. The slip is 100% your height. The 0.5 number is not in the card or the slip. It is in the **relationship** between the spread of cards and the spread of slips in this room. If I swap your ID with your neighbor's, your height doesn't change. The number describes the population, not your body."

  **2. "Genes Became More Important in Round 2"**
  *   *Failure:* Participants interpret the jump from 0.5 to 1.0 as genes "working harder."
  *   *Fix:* Remind them the Genotype (ID) was fixed. "The genes didn't change. The *noise* disappeared. Heritability went up because the environment became boring, not because genes became powerful."

  **3. "Round 3 Is a Rigged Trick"**
  *   *Failure:* Engineers may dismiss Round 3 as unrealistic ("Who assigns environment based on genotype?").
  *   *Fix:* Acknowledge validity, then generalize. "In this room, I did it artificially. In the real world, parents pass on genes *and* environments. If smart parents pass on 'study genes' and also bookshelves, the estimator sees a correlation and calls it heritability. It is not a trick; it is a confound."

  **4. Statistical Noise (Small Sample Size)**
  *   *Failure:* With 20 people, the $R^2$ might fluctuate wildly from the target (e.g., Round 1 comes out 0.3 or 0.7).
  *   *Fix:* **Pre-generate the data.** Do not roll dice live. Generate 100 rows of data beforehand that *guarantee* the $R^2$ lands within 0.05 of your target. Print those specific numbers. The "randomness" is simulated, but the lesson is robust.
  *   *Backup:* Have a "Large Population" tab open on your laptop with N=10,000 generated from the same rules. If the live data looks messy, show the simulation to prove the rule holds.

  **5. The "Group Differences" Question**
  *   *Failure:* Someone asks, "So if Group A has higher scores than Group B, and heritability is high, is it genetic?"
  *   *Fix:* Answer honestly and briefly. "This activity measures variation **within** this group. Round 3 proved that high within-group heritability can exist with zero genetic causation. Therefore, within-group heritability tells you **nothing** about between-group differences. You would need to know if the environments of Group A and Group B were equal, which we never know."

  ---

  ## 5. Limitations: What This Activity Cannot Do

  Be explicit in your closing remarks. This activity is a calibration tool, not a scientific instrument.

  1.  **Estimation Machinery:** In real human genetics, we do not know the Genotype (0–19). We estimate heritability using relatives (twins, siblings) and assume their genetic similarity. This activity skips the hard part: inferring $G$ from pedigree.
  2.  **Broad vs. Narrow Sense:** We calculated Broad-Sense Heritability ($H^2$, total genetic variance). Policy arguments usually concern Narrow-Sense ($h^2$, additive genetic variance). This activity blurs that distinction.
  3.  **Interaction (GxE):** Our model was additive ($G + E$). In reality, genes and environments interact (e.g., a gene only expresses under stress). This activity cannot show $G \times E$ interaction effects.
  4.  **Counterfactual Causation:** We showed correlation. Real causal claims require counterfactuals (e.g., "What if this person had a different genotype?"). The activity shows variance decomposition, not causal mechanisms.
  5.  **Polygenic Reality:** Traits are not integers 0–19. They are continuous, influenced by thousands of variants with tiny effects. This activity is a caricature.

  **Closing Note:**
  "This session was not designed to tell you the heritability of intelligence, height, or coding ability. It was designed to break the intuition that a high number means 'fixed' or 'genetic.' When you see a heritability estimate in the wild, treat it as a description of a specific population's variance under specific conditions, not as a law of nature."
