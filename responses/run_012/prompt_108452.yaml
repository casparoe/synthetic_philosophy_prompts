answer: |-
  # Session Plan: The Wrong Kind of Reasons Problem

  **Duration:** 60 minutes
  **Audience:** Psychologists, linguists, economists (introductory philosophy only)
  **Core Case:** The Instrumental Doctor

  ## 1. Sequencing and Rationale

  The session must proceed from **intuition** to **tension**, then to **classification**, and finally to **implication**. You cannot begin with the distinction (object-given vs. state-given) because, for this audience, it will appear as mere taxonomy rather than a solution to a normative puzzle. They must feel the normative friction before you give them the vocabulary to describe it.

  **The Order:**
  1.  **Normative Setup (0–5 mins):** Establish that attitudes (like compassion) are subject to norms of correctness, not just causal explanations.
  2.  **The Case Study (5–20 mins):** Present the Doctor case in full detail.
  3.  **The Eruption of the Puzzle (20–35 mins):** Facilitate the conflict between pragmatic validity and fittingness.
  4.  **The Diagnostic Distinction (35–50 mins):** Introduce object-given vs. state-given reasons *only now*.
  5.  **Limitations and Closing (50–60 mins):** Define what the distinction fails to solve and pose the final assessment question.

  **Why this order?**
  If you introduce the object/state distinction early, the economists and psychologists will treat it as a semantic clarification ('ah, you are using two definitions of reason') rather than a philosophical problem. The problem only exists if there is a single sense in which both considerations count in favour of the attitude, yet one is defective. The tension must be felt before it is named.

  ## 2. The Single Example: The Instrumental Doctor

  You must use only the case supplied. However, for the problem to *emerge* from the case rather than be *illustrated* by it, the case must be staged with specific features present and others absent.

  **What the example must HAVE:**
  *   **Clear Pragmatic Pay-off:** The benefit (higher ratings, career success) must be undeniable and significant. This ensures the 'reason' has genuine normative weight for the economists and psychologists in the room.
  *   **Voluntary Control:** You must stipulate the doctor *can* summon the feeling on demand. This removes the 'ought implies can' objection. If they say 'you can't just choose to feel compassion', the problem vanishes into a discussion of psychological ability.
  *   **Explicit Lack of Merit:** The patient must be described as objectively undeserving of compassion (e.g., a wealthy hypochondriac making trivial demands abusively). This ensures there is no competing 'right kind' reason hiding in the background.

  **What the example must LACK:**
  *   **Deception:** The doctor is not pretending. They genuinely feel the compassion. This prevents the discussion from sliding into ethics of honesty.
  *   **Long-term Consequences on Care:** Do not suggest the compassion improves medical outcomes. If it does, psychologists will argue the reason *is* object-given (because better care fits the patient's needs). The benefit must remain strictly external to the doctor-patient relation (e.g., hospital ranking).
  *   **Malice:** The doctor is not harming the patient. This prevents the discussion from becoming about moral wrongs rather than normative fittingness.

  **How to deploy it:**
  Describe the scenario. Then ask: 'Does the doctor have a reason to feel compassion?' Expect consensus (yes, career success). Then ask: 'Is the compassion appropriate to the patient?' Expect consensus (no, the patient is undeserving). The puzzle is: How can you have a reason to do something that is inappropriate?

  ## 3. Anticipating Misconceptions

  This interdisciplinary audience will bring specific frameworks that threaten to dissolve the puzzle prematurely. You must head these off at specific points.

  **Misconception 1: 'Reasons are Causes' (Psychologists)**
  *   **Risk:** They will argue the career benefit is merely a *cause* of the feeling, not a *reason*.
  *   **Where to head it off:** During **The Case Study (5–20 mins)**.
  *   **How:** Stipulate that the doctor deliberates. They think, 'I should feel compassion because it helps my ratings.' This frames the benefit as a premise in reasoning, not merely a causal trigger.

  **Misconception 2: 'Reasons are Utility Inputs' (Economists)**
  *   **Risk:** They will argue that if the action maximises utility, the reason is valid. Full stop.
  *   **Where to head it off:** During **The Eruption of the Puzzle (20–35 mins)**.
  *   **How:** Concede that it is rational *for the doctor*, but press on whether it makes the *attitude* correct. Ask: 'If the patient knew the reason for your compassion, would they feel comforted or manipulated?' This distinguishes utility of state from correctness of attitude.

  **Misconception 3: 'It's Just Ambiguity' (Linguists)**
  *   **Risk:** They will suggest 'reason' is simply polysemous, and there is no puzzle, only confusion.
  *   **Where to head it off:** During **The Diagnostic Distinction (35–50 mins)**.
  *   **How:** Acknowledge the linguistic point but insist that both considerations weigh in deliberation. The puzzle is not about definition, but about why one weight overrides the other regarding *fittingness*.

  ## 4. The Object-Given / State-Given Distinction

  Do not introduce this until minute 35. By now, the group should be frustrated that the doctor seems both justified (pragmatically) and unjustified (normatively).

  **What it does:**
  It provides a taxonomy. It labels the career benefit as a 'state-given reason' (a reason to want to have the attitude) and the patient's suffering as an 'object-given reason' (a reason grounded in the object of the attitude). It clarifies *where* the reasons attach.

  **What it does NOT settle:**
  You must be explicit here. This distinction does not explain *why* object-given reasons trump state-given reasons when assessing fittingness. It names the categories but does not justify the hierarchy. It solves the classification problem, not the normative authority problem. Do not let the group walk away thinking the distinction solves the puzzle; it merely maps it.

  ## 5. What to Leave Out

  You must explicitly state at the beginning or end that you are bracketing the following, to prevent scope creep:

  1.  **Metaethical Realism vs. Anti-Realism:** Do not discuss whether values exist independently of minds. The puzzle arises regardless of your metaethical stance.
  2.  **The Nature of Emotion:** Do not dive into whether compassion is a judgement, a perception, or a physiological state. Treat it as a functional attitude with correctness conditions.
  3.  **Specific Theories of Fittingness:** Do not attempt to define 'fittingness' precisely. Use it as a primitive notion (appropriate, merited, warranted).

  **Script note:** 'We are not today deciding what value is, nor how emotions work mechanically. We are looking at the structure of justification.'

  ## 6. The Final Assessment Question

  Do not ask: 'What is the difference between object-given and state-given reasons?' This tests memory, not understanding.

  **Ask this instead:**
  > 'Suppose the hospital changes its policy: ratings no longer matter, but compassionate doctors actually diagnose more accurately. Does the *kind* of reason the doctor has for their compassion change, even if the practical benefit remains the same?'

  **Why this works:**
  *   If they say 'No, it's still pragmatic', they have missed the point (the reason has now become object-given because it relates to the patient's care).
  *   If they say 'Yes, because now it relates to the patient's health', they understand that the *source* of the reason (object vs. state) determines its kind, not merely the presence of a benefit.
  *   It forces them to apply the distinction to a shifting context without using the technical jargon.

  ## 7. Summary of Flow

  1.  **0–5 mins:** Frame attitudes as normatively assessable.
  2.  **5–20 mins:** Tell the Doctor story (ensure voluntary control and lack of patient merit are clear).
  3.  **20–35 mins:** Draw out the conflict (Good for doctor vs. Bad for patient). Block utility/causal reductions.
  4.  **35–50 mins:** Introduce Object/State distinction as a map, not a solution. Clarify its limits.
  5.  **50–60 mins:** State exclusions. Pose the Final Assessment Question. Discuss.

  Adhere strictly to this sequence. If you introduce the distinction before the conflict is felt, the session will become a lecture on terminology rather than an exploration of a normative puzzle.
