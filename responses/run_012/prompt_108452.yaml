prompt: |-
  Do not explain the wrong kind of reasons problem to me — plan how I should explain it. Next month I lead a sixty-minute session of a cross-departmental reading group (psychologists, linguists and a couple of economists, none with philosophy beyond an introductory course) on that problem: the puzzle that certain considerations appear to count in favour of an attitude while having no bearing on whether the attitude is fitting. Do not send me a reading list. What must come first and what depends on what, and why in that order? Which single example should carry the whole session, and what must that example have — and lack — for the problem to emerge from it rather than merely be illustrated by it? Which misconceptions will this audience bring or form, where exactly in the sequence should each be headed off, and what question at the end will show whether the problem has landed rather than been paraphrased back? What should I leave out at this level, and say that I am leaving out? Two constraints on the design. First, build the session on the case I supply rather than on the demon or the bribe: a doctor who wants to feel compassion for a patient not because the patient's situation merits it but because compassionate doctors are rated more highly, and who can summon the feeling on demand. Second, do not let the object-given/state-given contrast (reasons bearing on whether an attitude fits its object versus reasons bearing only on the attitude's usefulness) do the explanatory work; bring it in, if at all, only after the group has felt the pull of the puzzle, and say what it does and does not settle. Write in British English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Plan a 60-minute session for a cross-departmental reading group (psychologists, linguists, economists; no advanced philosophy) on the "wrong kind of reasons" (WKR) problem.
      *   **Constraint 1 (Content):** Do *not* explain the problem to me (the user). Plan *how I should explain it*.
      *   **Constraint 2 (Reading List):** Do *not* send a reading list.
      *   **Constraint 3 (Structure):** Specify what must come first, what depends on what, and why.
      *   **Constraint 4 (Example):** Use *one* single example provided by the user: A doctor who wants to feel compassion for a patient not because the patient's situation merits it but because compassionate doctors are rated more highly, and who can summon the feeling on demand. Do *not* use the demon or the bribe.
      *   **Constraint 5 (Conceptual Framework):** Do *not* let the object-given/state-given contrast do the explanatory work initially. Bring it in only after the group has felt the pull of the puzzle. Specify what it does and does not settle.
      *   **Constraint 6 (Audience):** Psychologists, linguists, economists. Introductory philosophy only. Anticipate misconceptions.
      *   **Constraint 7 (Evaluation):** Specify a final question to show whether the problem has landed (not just paraphrased).
      *   **Constraint 8 (Exclusions):** Specify what to leave out and say that I am leaving it out.
      *   **Constraint 9 (Language):** Write in British English.

  2.  **Deconstruct the "Wrong Kind of Reasons" Problem (for planning purposes):**
      *   The core puzzle: Some reasons seem to count in favour of holding an attitude (e.g., believing, fearing, compassion) but aren't reasons of the right *kind* to make the attitude appropriate/fitting.
      *   Standard example: The Demon who threatens to kill you unless you admire him. You have a reason to admire him (survival), but not because he is admirable.
      *   User's example: The Doctor. Reason: Professional rating/success. Attitude: Compassion. Object: Patient.
      *   The Twist: The doctor *can* summon the feeling on demand. This removes the "ought implies can" obstacle. It isolates the normative status of the reason.

  3.  **Structure the 60 Minutes:**
      *   Need a logical flow: Intuition pump -> Tension -> Failed Solutions -> Diagnostic Tool (Object/State) -> Limitations -> Closing Question.
      *   Time allocation: Intro (5), Case Study (15), The Tension/Puzzle (15), The Distinction (15), Closing/Assessment (10).

  4.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-5 mins):** Set the stage without jargon. Focus on normative pressure.
      *   **The Case (5-20 mins):** The Doctor. Need to flesh this out so the puzzle *emerges*.
          *   *Requirement:* The example must have specific features. It needs to show the reason is genuine (pragmatic benefit) but the attitude seems unjustified relative to the object. It must lack features that distract (e.g., inability to feel compassion).
      *   **The Puzzle Emerges (20-35 mins):** Why is this weird? Psychologists might say "it's functional." Economists might say "it's utility maximisation." Philosophers say "it's unfitting." Need to create friction between these views.
      *   **Misconceptions:**
          *   Psychologists: "If it works, it's valid." (Head off during the Case).
          *   Economists: "Reasons are just inputs for utility." (Head off during the Puzzle).
          *   Linguists: "It's just ambiguous usage of 'reason'." (Head off during the Distinction).
      *   **The Distinction (35-50 mins):** Object-given vs. State-given. Introduce *now*, not before. Explain what it solves (categorisation) and what it doesn't (why the distinction matters normatively).
      *   **Exclusions:** Metaethics, deep metaphysics of value, specific theories of emotion.
      *   **Closing Question (50-60 mins):** Needs to test understanding of the *puzzle*, not the definition.

  5.  **Refining the Example (The Doctor):**
      *   *Must have:* A clear pragmatic benefit (higher ratings = career success). The ability to induce the attitude (voluntarism control). A patient who objectively does *not* merit compassion (e.g., a wealthy, healthy hypochondriac who is rude).
      *   *Must lack:* Any hidden merit in the patient. Any inability on the doctor's part. Any malicious intent (it's not deception necessarily, it's self-regulation).
      *   *Why:* If the patient merits compassion, the reasons mix. If the doctor can't feel it, it's about ability, not reasons.

  6.  **Addressing Constraints:**
      *   *British English:* Check spelling (colour, analyse, programme, etc.) and tone.
      *   *No Explanation to User:* I am writing the plan, not defining WKR for the user.
      *   *Object/State Given:* Introduce late.
      *   *Misconceptions:* Map them to specific timeline points.
      *   *Final Question:* Needs to be sharp.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Sequence:*
          1.  Setup (Normative language).
          2.  The Doctor Case (Detailed).
          3.  The Conflict (Is there a reason or not?).
          4.  The Distinction (Tool to clarify).
          5.  The Limit (Does the tool solve the normativity?).
          6.  Closing.

      *   *Misconceptions:*
          1.  "Reasons = Causes" (Psychologists). Address early.
          2.  "Reasons = Utility" (Economists). Address during conflict.
          3.  "It's just semantics" (Linguists). Address during distinction.

      *   *What to leave out:* The "New Evil Demon" problem, detailed metaethical realism/anti-realism debates, specific accounts of 'fittingness'.

      *   *Final Question:* Needs to force a choice between the two kinds of reasons without using the technical terms.

  8.  **Review against Constraints:**
      *   Did I explain the problem to the user? No, I'm planning the session.
      *   Did I use the Doctor example? Yes.
      *   Did I avoid Object/State given early on? Yes, scheduled for later.
      *   British English? Yes.
      *   No reading list? Yes.
      *   Structure logic explained? Yes.

  9.  **Final Polish:** Ensure the tone is instructional but respectful of the user's expertise (they are leading the session). Make sure the "why" for the ordering is clear. Ensure the distinction between the problem *emerging* vs. being *illustrated* is clear in the example design.

      *   *Self-Correction on Example:* The prompt says "patient not because the patient's situation merits it". I need to ensure the plan specifies that the facilitator must establish the *lack* of merit clearly, otherwise the puzzle dissolves into a standard case of compassion. The patient should be explicitly undeserving (e.g., abusive or trivial complaint).
      *   *Self-Correction on Object/State:* The prompt says "do not let the contrast... do the explanatory work". This means the puzzle must be felt *before* the label is applied. The label is a diagnostic tool, not the source of the problem.
      *   *Self-Correction on Misconceptions:* Psychologists might think "compassion" is just a physiological state. Need to ensure the session treats it as an attitude with normative conditions.

  10. **Final check on British English:** "programme", "analyse", "colour", "favour", "modelling".

  11. **Final check on "What must come first... and why":** Need to explicitly justify the sequencing in the output.

  12. **Final check on "What should I leave out... and say that I am leaving out":** Need a specific section for this.

  13. **Final check on "Final Question":** Needs to be distinct from "What is the object-given reason?".

