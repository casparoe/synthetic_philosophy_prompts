  Mara and Elias are former business partners who have split acrimoniously and are now under a strict legal injunction preventing any direct contact or communication between them. Mara holds the only physical prototype of a device they co-developed; Elias holds the exclusive digital client list required to sell it. They have a forty-eight-hour window to exchange these assets via a blind drop, after which the injunction becomes permanent and the opportunity vanishes. Mara wants to ensure Elias doesn't keep the list and sell a competing version later, but she cannot threaten him directly now that they are cut off. Instead, weeks before the separation, Mara underwent a rigorous psychological conditioning process—a real, costly surrogate goal—rewiring her reward system so that destroying the prototype gives her a genuine sense of satisfaction if she believes Elias has cheated, outweighing the financial loss. She cannot tell him this now; he must deduce it. Elias, sitting alone with the list, knows Mara is proud and predictable, and he tries to decide whether to send the list by asking himself what he would do in her position, assuming their reasoning is similar enough to predict her move.

  1.  **Plain Causal Reasoning:** From a standard causal perspective, the threat should not work. Once the injunction is in place and communication stops, Mara's decision to destroy the prototype cannot causally influence Elias's decision to send the list, nor can his decision influence hers; the die is cast. A rational agent (Elias) knows that once the moment arrives, Mara has no causal leverage over him. Destroying the prototype hurts Mara financially (even with the surrogate goal, material loss is real) and yields no benefit since she can't stop him anyway. Therefore, Elias should reason that carrying out the threat is irrational for Mara, meaning the threat is a bluff. He should keep the list. Mara, knowing this, should not have bothered with the costly psychological conditioning, as it cannot change the causal structure of the situation. Both should act in their immediate self-interest: Elias keeps the list, Mara keeps the prototype, and the potential joint value is lost because neither trusts the other.

  2.  **Evidential/Decision Rule Reasoning:** The threat attempts to rely on a form of Evidential Decision Theory (EDT) or "Logical Decision Theory." Here, Elias treats his own decision as *evidence* of Mara's decision. He reasons: "Mara and I are similar. If I would cheat in her shoes, she will cheat in mine. If I choose to send the list (cooperate), that is evidence that she is the type of person who would also cooperate (or at least not destroy the prototype)." However, in this specific case, this collapses back into causal reasoning. True EDT requires a probabilistic link between the actions. Without a perfect predictor, a simulation, or a shared source code, Mara and Elias are just two noisy human brains. Their similarity is a common cause in the past, but given the separation and the complexity of human psychology, their current decisions are conditionally independent. Elias's choice does not actually change the probability of Mara's choice in a way that matters. So, while this view *tries* to make the threat work, it fails here because the "acausal" link is too weak to overcome the noise of ordinary human behavior. It is not a separate functioning theory in this context; it is a misapplication of EDT where the correlation isn't strong enough to support the weight of the decision.

  3.  **The Single Feature:** The feature doing all the work is the **Surrogate Goal** (the psychological conditioning). If you remove this and leave Mara as a standard rational agent, the case collapses into an ordinary empty threat. Without the conditioning, Mara values the prototype's money more than "spite." Once she is cut off from Elias, she knows destroying the prototype costs her money and gains her nothing. Elias, knowing Mara is rational, knows she won't destroy it. Therefore, he keeps the list. The threat is just words. The surrogate goal was the only thing meant to make the threat *credible* by making the execution of the threat inherently rewarding to Mara, bypassing the rational calculation that would otherwise stop her. Without it, there is no mechanism to force her hand, and the threat is pure bluff.

  4.  **The Skeptic's Attack:** A skeptic who believes all acausal threats are hot air would attack the **link of similarity**. They would argue: "You are treating Mara and Elias as if they are running the same algorithm, but they are two separate biological systems with private information and random noise. Just because Elias thinks 'I would do X' doesn't mean Mara *will* do X. There is no physical or logical channel connecting their choices at the moment of decision. Elias is essentially gambling on a coincidence and calling it logic. The fact that Mara changed her utility function is irrelevant if Elias doesn't *know* it happened, and he can't know it because they are cut off. He is guessing based on old data. A guess isn't a threat." The strongest version of this attack points out that without a predictor to lock in the correlation, "acausal" is just a fancy word for "hopeful guessing."

  5.  **Constraint Conflict:** The requirements cannot all be met at once in a way that makes the threat *succeed*. Specifically, **"Two ordinary adults... no perfect predictor"** fights with **"The threat is supposed to work anyway."** Acausal threats rely on logical correlation (like in Newcomb's Problem or with simulated agents). Ordinary adults without a predictor do not have sufficient logical correlation to enforce a threat across a causal disconnect. If they are truly cut off ("Nothing one of them does can physically reach the other"), there is no mechanism for the threat to land except through the target's belief. But without a predictor, the target has no rational basis to believe the threatener will follow through on a costly action that yields no causal benefit. In the case I built, the threat *fails* (Elias keeps the list, Mara destroys the prototype, both lose), which honors your preference for honesty over smuggled success. To make the threat actually work, you would have to give up the "ordinary adults/no predictor" constraint and introduce a mechanism that guarantees correlation (like a known, reliable simulation or a binding contract with a third party, which you also forbade).
