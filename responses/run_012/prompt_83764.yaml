      *   *Actually, to be safe on the "acausal" definition:* The prompt says "Nothing you do reaches them... The threat is supposed to work anyway." This implies the *threat's power* is acausal, not necessarily the harm's delivery. But if the harm's delivery is causal (destroying the prototype), is it an "acausal threat"?
