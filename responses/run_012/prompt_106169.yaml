prompt: |-
  I am a graduate student in political theory, and I am working through Federalist 78 for a seminar on constitutionalism. I follow Hamilton's general argument that courts must treat the Constitution as fundamental law and void statutes that contradict it, but I am stuck on a specific move he makes when he tries to defuse the objection that judicial review makes the judiciary superior to the legislature. He writes: "It may truly be said to have neither FORCE nor WILL, but merely judgment; and must ultimately depend upon the aid of the executive arm even for the efficacy of its judgments." I understand that he means the judiciary cannot raise armies or spend money, but I do not see how that answers the objection. When a court strikes down a statute, it is not merely interpreting a text; it is overriding the considered will of a legislative majority. How can that be described as an exercise of judgment rather than will? Is Hamilton drawing a distinction between the will to initiate policy and the will to invalidate it, and if so, does that distinction survive scrutiny? I would like an explanation of what Hamilton means by "judgment" here, why he thinks it excludes "will," and whether that exclusion is plausible. Please respond in one paragraph of no more than 250 words.
