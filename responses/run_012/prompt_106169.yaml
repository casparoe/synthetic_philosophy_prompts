  2.  **Deconstruct Hamilton's Argument:**
      *   Hamilton argues courts don't substitute their *own* preferences for the law.
      *   "Will" implies active discretion or policy-making (choosing what *ought* to be).
      *   "Judgment" implies passive discovery or application of pre-existing higher law (determining what *is* the law).
      *   When a court voids a statute, it isn't saying "this is bad policy" (will); it's saying "this conflicts with the Constitution" (judgment).
      *   The Constitution represents the people's will, superior to the legislature's will. The court is merely the conduit for that superior will.

