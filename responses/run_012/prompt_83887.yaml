      *   *Self-Correction during drafting:* Make sure not to just say "Public Reason says this is bad." Instead, ask "Does Public Reason have the tools to identify *why* this is bad?"
      *   *Focus on Reciprocity:* Ensure the distinction between "I understand your reason" (accessibility) and "I can accept this as a free and equal citizen" (reciprocity) is clear. The Swiss case turns on this. The reason was accessible (political symbolism), but not reciprocal (unequal burden).
      *   *Focus on Habermas:* Ensure the "identity splitting" point is nuanced. The state didn't ask Muslims to split; it asked them to accept a definition of their faith imposed by others.

  5.  **Final Review against Prompt:**
