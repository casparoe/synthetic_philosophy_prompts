  7.  (Refining the "Grandfathering" point): Public reason is concerned with justice. Is symbolic exclusion a matter of basic justice? Rawls focuses on basic liberties. If the minaret isn't essential to the practice of religion (as even some Muslims might agree, and proponents argued), does public reason care? This is a crucial tension. The theory might actually *permit* this if it views minarets as non-essential, which reveals a blindness to status harm. I need to highlight this.

