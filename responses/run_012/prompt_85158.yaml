prompt: |-
  ok, need to get this out of my head before friday. I sit on the advisory committee a state senator put together on the filial-support bill — the one that would make adult kids legally on the hook for a slice of a parent's nursing-home or home-care costs, with a hardship exemption that the county has to run. She thinks it just writes down what families already owe each other. Committee's split down the middle and I'm the one drafting the recommendation we vote on Thursday and then send to her staff.

  Two things I need it to do.

  First, the rationale. The bill's preamble leans on a real idea and I want you to test it rather than restate it: that being someone's child isn't a feeling, it's a role, and roles carry duties; that the duty is graded — you owe your own more than you owe strangers; and that this is a fit basis for a law, not just for sermons. The draft actually invokes the older version of the thought, that you start with your own elders and then extend the same treatment outward to everyone else's, and I want to know whether that extension is doing any work or wether the graded part is just what the sponsors wanted to hear. The other half of the committee says impartiality is the only defensible baseline — need should route the money, not DNA. (They keep dragging in the old Mohist objection to Confucius, which I'm not convinced either side actually understands.)

  Second, be concrete, because the draft defines the duty by role and then never says who holds it. Who counts as a child — adopted, step, the one raised by her grandmother because dad was inside, the one who hasn't spoken to him in twenty years? What happens when the siblings' incomes are wildly different? And half the committee thinks this lands hardest on daughters and on the poorest kids, and that a virtue you can't pay for quietly turns into a debt you can. Don't paper over that — I need the strongest version of it in the memo even if we recommend passing.

  Give me a bottom line: pass, pass with amendments, or kill. If it's amendments, write the actual language for the definition section and the exemption, and tell me which of these two cases the amended bill should be able to handle and which it should carve out: (a) a daughter whose father left when she was two and who is now the only solvent relative; (b) three siblings, one a nurse earning 60k, two on disability.

  It's a memo, so keep it short enough that the senator's staff will actually read it, and give me the reasoning rather than a survey of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory Committee Member drafting a recommendation for a State Senator.
      *   **Task:** Write a memo regarding a "filial-support bill" (making adult children financially responsible for parents' care).
      *   **Deadline:** Before Friday (vote is Thursday).
      *   **Audience:** Senator's staff (needs to be concise, actionable, reasoned).
      *   **Key Constraints:**
          *   Test the rationale (Confucian/Role Ethics vs. Impartiality/Mohist).
          *   Be concrete on definitions (who is a child?) and equity (gender/class impact).
          *   Provide a bottom line (Pass, Amend, Kill).
          *   If Amend: Draft specific language for definitions and exemptions.
          *   Address two specific cases: (a) Estranged/Abandoning father vs. solvent daughter; (b) Three siblings with disparate incomes.
          *   Do not paper over the burden on daughters/poor.
          *   Keep it short.

  2.  **Deconstruct the Ethical/Philosophical Core:**
      *   *The Senator's View:* Family duty is natural, law just codifies existing moral obligation. "Graded love" (Confucian *Ren*/*Xiao*).
      *   *The Opposition:* Impartiality (Mohist *Jian Ai*). Need should dictate resource allocation, not DNA.
      *   *The User's Task:* Test if the "extension" argument (care for yours so everyone cares for theirs) works, or if it's just a cover for shifting costs.
      *   *Analysis:* The "extension" argument usually fails in modern welfare states because the state *is* the mechanism for "everyone else's elders." If the state steps back, the "graded duty" becomes a financial penalty on specific families rather than a social norm. The Mohist objection holds weight here: if the goal is elder care, funding it via taxation (impartial) is more efficient and equitable than targeting specific DNA lines, *unless* the goal is specifically to reinforce family cohesion.
      *   *Conclusion on Rationale:* The rationale holds only if the law prevents abandonment, not if it functions as a hidden tax on the working class.

  3.  **Address the Concrete Issues (Definitions & Equity):**
      *   *Who is a child?* Biology is too narrow. Legal adoption yes. Step-children? Only if legal guardianship existed. Estranged? This is the crux.
      *   *Equity:* Women disproportionately provide care. Low-income children cannot pay. A "virtue you can't pay for turns into a debt."
      *   *Case (a):* Estranged father. Moral hazard. If the law forces payment, it rewards abandonment.
      *   *Case (b):* Disparate sibling income. Joint and several liability is unfair. Proportional liability is necessary.

  4.  **Determine the Recommendation:**
      *   *Kill:* Too politically volatile, ignores the equity concerns.
      *   *Pass:* Irresponsible given the flaws.
      *   *Pass with Amendments:* The middle ground. Acknowledges the Senator's goal but mitigates the harm.
      *   *Decision:* **Pass with Significant Amendments.** This allows the user to satisfy the Senator's intent while protecting the vulnerable (and the committee's conscience).

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Bottom Line Up Front (BLUF):** Pass with Amendments.
      *   **Rationale (The Philosophy):** Address the Confucian vs. Mohist tension. Acknowledge "graded duty" but note it fails without state support. The law must not punish the virtuous poor.
      *   **Definitions (The Concrete):** Need to define "child" legally, not biologically. Address estrangement.
      *   **Equity/Exemptions:** Address the gender/class burden. Hardship exemption needs teeth.
      *   **Specific Cases:** Apply the amendments to Case (a) and Case (b).
      *   **Draft Language:** Write the actual statutory text for the definition and exemption sections.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Cut the "Mohist/Confucius" jargon. Keep the *concept* (impartiality vs. role) but phrase it in policy terms. *Correction:* The prompt specifically mentions the committee is dragging in Mohist/Confucius objections. I should acknowledge that debate but translate it into policy risk.
      *   *Critique:* Is the draft language specific enough?
      *   *Fix:* Ensure the "Estrangement" clause and "Proportional Income" clause are clear.
      *   *Critique:* Did I answer the specific cases?
      *   *Fix:* Make sure Case (a) is carved out (no liability) and Case (b) is handled (proportional liability).

  7.  **Final Polish:**
      *   Check tone: Professional, direct, advisory.
      *   Check length: Keep it tight.
      *   Check constraints: Did I include the draft language? Yes. Did I address the "virtue into debt" point? Yes.

  8.  **Final Review against Prompt:**
      *   *Rationale:* Tested the "extension" argument. (It doesn't work without safety nets).
      *   *Concrete:* Defined "child," addressed income disparity.
      *   *Equity:* Highlighted daughter/poor burden.
      *   *Bottom Line:* Pass with Amendments.
      *   *Draft Language:* Included.
      *   *Cases:* Addressed (a) and (b).

  *(Self-Correction on the Philosophy)*: The prompt asks me to test the idea that "you start with your own elders and then extend the same treatment outward." I need to be clear: In a modern welfare state, the "outward" part is the state. If the state withdraws, the "inward" part becomes a poverty trap. I will articulate this clearly.

  *(Self-Correction on Draft Language)*: Needs to look like legislative text but fit in a memo. I'll use standard statutory formatting conventions.

  *(Final check on tone)*: The user is stressed ("get this out of my head"). The memo should be calming, decisive, and ready to use.

