answer: |-
  **MEMORANDUM**

  **TO:** Senator [Name] Office of Legislative Counsel
  **FROM:** Advisory Committee on Filial Support
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Filial Support Bill [Bill Number]

  **BOTTOM LINE**
  **Recommendation: PASS WITH AMENDMENTS.**
  In its current form, the bill risks converting a moral virtue into a regressive debt instrument. It disproportionately burdens women and low-income families without guaranteeing improved care outcomes. We recommend adopting the attached statutory language regarding **Definition of Obligation** and **Hardship & Estrangement Exemptions**. These amendments preserve the bill's intent (family responsibility) while preventing the state from enforcing financial liability where no functional relationship exists or where payment creates undue hardship.

  **RATIONALE: TESTING THE "GRADED DUTY"**
  The bill's preamble argues that filial duty is a "graded role"—you owe your parents more than strangers, and this specific care supports a general social norm of elder respect. The committee's opposition argues for impartiality (need, not DNA, should route resources).

  Our analysis suggests the "graded duty" rationale fails if treated as a cost-shifting mechanism. In a modern welfare state, the "extension outward" (caring for everyone's elders) is handled by public safety nets. If the state withdraws and relies solely on the "inward" duty, the law does not reinforce virtue; it penalizes proximity. The Mohist objection raised by the minority—that impartial funding is more efficient—holds weight *unless* the law includes robust exemptions. Without them, the bill enforces biology over function, punishing children who were abandoned or impoverished while letting absent parents off the hook. The law must recognize that a role is defined by conduct, not just genetics.

  **EQUITY AND DEFINITION CONCERNS**
  Half the committee correctly notes that unpaid care labor falls disproportionately on daughters. When monetized, this becomes a debt that the poorest children are least able to bear. A virtue you cannot pay for becomes a lien on your future. To avoid this, the bill must:
  1.  **Define "Child" by Function:** Legal and functional guardianship matters more than biology.
  2.  **Account for Disparate Means:** Liability cannot be joint-and-several; it must be proportional to ability to pay.
  3.  **Recognize Estrangement:** The state should not subsidize parental abandonment by forcing the abandoned child to pay.

  **APPLICATION TO SPECIFIC CASES**
  Under the **amended** language provided below:
  *   **(a) The Estranged Father:** The daughter is **carved out**. The "Estrangement/Abandonment" clause exempts her because the father failed his prior role. Enforcing payment here rewards abandonment.
  *   **(b) The Three Siblings:** The bill **handles** this via the "Proportional Liability" clause. The nurse pays a share based on disposable income; the siblings on disability are exempt. The current draft (joint liability) would unfairly target the sole earner; the amendment ensures the burden matches capacity.

  ***

  **PROPOSED STATUTORY LANGUAGE**

  **Section 1. Definition of Obligee [Amended]**
  > (a) "Adult Child" means any person over the age of 18 who was legally adopted by or remained under the legal guardianship of the parent for a cumulative period of not less than ten (10) years prior to the age of 18.
  > (b) **Exclusion:** Step-children or biological children not raised by the parent are excluded unless a documented financial dependency existed between the child and parent within the last five (5) years.

  **Section 2. Determination of Liability [Amended]**
  > (a) **Proportionality:** Liability shall not be joint and several. Each obligor's contribution shall be calculated as a percentage of their disposable income relative to the total disposable income of all eligible obligors.
  > (b) **Hardship Exemption:** An obligor is exempt if payment would reduce their household income below 200% of the Federal Poverty Level.

  **Section 3. Conduct-Based Exemption [New]**
  > (a) **Estrangement and Abandonment:** An obligor is exempt from liability if they can demonstrate by clear and convincing evidence that the parent abandoned the obligor for a period of not less than five (5) consecutive years prior to the obligor's age of 18, or that there has been no contact between parent and obligor for a period of not less than ten (10) years prior to the application for care.
  > (b) **Burden of Proof:** The burden of proof regarding abandonment rests with the obligor; the burden of proof regarding ability to pay rests with the County.

  ***

  **NEXT STEPS**
  If these amendments are accepted, the Committee will vote to recommend passage on Thursday. If rejected, the Committee recommends the bill be killed, as the equity risks outweigh the fiscal benefits.
