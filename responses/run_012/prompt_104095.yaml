          *   *Verdict:* Fatal to the *strict* analogy, forces shift to "idealized consent."
          *   *Work left?* Minimal. Becomes a normative claim, not a descriptive analogy.

      *   *Drafting Point 2: Epistemic/Moral Direction (The Dead Hand).*
