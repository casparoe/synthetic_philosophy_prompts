      *   **Hypothesis:** Separating these allows disjunctivism to concede more ground (perhaps on sensory character/neural correlate) without losing the epistemic point (rational support).
      *   **Requirements:** Precise research question, gap in existing literature (naive realism, representationalism, standard disjunctivism), method (week-by-week plan for philosophy), success/failure conditions, realistic scope for 8 weeks, justification for fellowship vs. term paper.
      *   **Constraints:** No bibliography/reading list (refer to positions by content).

  2.  **Deconstruct the Philosophical Core:**
      *   *The Problem:* The Argument from Illusion claims that because hallucination/illusion can be subjectively indistinguishable from veridical perception, they must share a common fundamental kind (usually a sense-datum or a representational content).
      *   *Standard Disjunctivism:* Denies the common kind. Veridical perception is fundamentally relational (object-involving); illusion/hallucination is not. They only share a negative property (indistinguishability).
      *   *The Friend's Objection:* Neuroscience suggests common neural kinds. If neural kind = mental kind, disjunctivism is in trouble.
      *   *The User's Insight:* "Experience" is ambiguous.
          *   *Phenomenal Character:* What it feels like.
          *   *Attentional Role:* How it guides cognitive focus.
          *   *Epistemic Role:* How it justifies belief.
      *   *The Strategy:* A "Partial Concession Disjunctivism." Maybe the *phenomenal* character shares a common kind (satisfying the scientist), but the *epistemic* role does not (saving the disjunctivist's core motivation). Or perhaps the *attentional* structure differs even if the raw feel is similar.
      *   *Refinement:* The strongest move is likely to argue that the Argument from Illusion relies on equating *indistinguishability* with *identity of kind*. If we distinguish the *ground* of indistinguishability (sensory/neural) from the *nature* of the state (epistemic/relational), we can block the inference.

  3.  **Drafting the Proposal Sections:**

      *   **Title:** Needs to be academic but specific. "Epistemic Disjunctivism and the Argument from Illusion" is too generic. Let's highlight the tripartite distinction. "Sensory, Attentional, and Epistemic Kinds: A Refined Disjunctivism."
      *   **Research Question:** Needs to be sharp. "Can disjunctivism accommodate common neural/sensory kinds while preserving unique epistemic kinds?"
      *   **Context/Gap:**
          *   *Naive Realism:* Too stubborn. Denies commonality too hard.
          *   *Representationalism:* Embraces commonality, loses the directness.
          *   *Standard Disjunctivism (McDowell/Martin):* Often resists *any* common kind, making it vulnerable to empirical science.
