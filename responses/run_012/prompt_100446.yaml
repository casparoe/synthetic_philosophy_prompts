prompt: |-
  I'm a first-year MA student and I'm putting together an application for a small internal summer fellowship (about $4k, two months full-time). The topic I want to pitch is the disjunctivist response to the argument from illusion, but not the standard version. I was arguing about this with a friend who does perception science and she kept saying that in an illusion the brain is doing the same thing as in a veridical case, so the experiences must be the same kind. That made me realize the debate keeps sliding between three things: the sensory character of the experience, the way it directs attention, and the rational support it offers for belief. I have a hunch that if you seperate these, the argument from illusion only works against a much narrower target than people think, and that disjunctivism can concede a lot more than its defenders usually allow without losing the epistemic point. But I can't tell yet whether that's a real distinction or just a verbal trick, and I don't know how to turn it into something I can actually finish in two months.

  Can you write the proposal? I need a precise research question, an explanation of why the existing positions (naive realism, representationalism, standard disjunctivism, whatever else is relevant) leave it open, the method for a philosophical project like this (what I'd actually do week by week, since there's no lab work), what a successful result would look like and what would count as the project failing, and a realistic scope for eight weeks. Also please say why this angle is worth a fellowship rather than just a term paper. Don't bother with a bibliography or reading list; I'll add the citations myself, and I don't want you guessing at titles. Just refer to positions and arguements by their content.
