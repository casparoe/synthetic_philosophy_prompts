      *   *God's Logic:* If God knows everything, does God need logic? Logic is a tool for inference from unknown to known. If everything is known, logic collapses into a list of facts. Or, God sees the *reasons* why things are true, not just that they are true.
      *   *The "Quiet Import":* The analogy assumes that "truth" means the same thing in both cases, just accessed differently. But Intuitionism changes the *definition* of truth (truth = provability). Classical logic assumes truth = correspondence to reality.
      *   *Time:* Intuitionism introduces time (the construction process). Classical logic is timeless. God is usually conceived as timeless. This creates a tension in the analogy.

