answer: |-
  **The Architecture of Negative Liberty**

  The constellation of common law practices regarding rescue encodes a specific conception of agency, one that prioritises negative liberty over positive beneficence. The law does not merely regulate behaviour; it constructs a moral topology where the default position of the individual is freedom from obligation, unless specific conditions alter that status. This implicit theory rests on the presumption that individuals are sovereign over their own capacities and resources. Consequently, the failure to deploy those resources to aid a stranger is not treated as a causal contribution to harm in the normative sense, even if it is so in the physical sense. The distinction between acts and omissions here is not metaphysical—the law acknowledges that letting die can be causally equivalent to killing—but normative. It serves to demarcate a protected sphere of individual liberty. The work this distinction does is to shield the agent from the demands of others unless a specific relationship has been established. It presupposes that moral obligations arise from what we have done or who we are, not merely from what we could prevent.

  **Compartmentalisation and Collective Duty**

  Regarding the apparent tension between immunising the rescuer while refusing to compel her, the system is not internally inconsistent but rather compartmentalised. It operates on a division of labour between private obligation and public beneficence. The law treats the parent's omission as murderous because the duty arises from a voluntary assumption of care or biological status, creating a special obligation. The bystander, lacking this relationship, owes no such private duty. However, the state recognises a collective duty to rescue, funded by taxation. This suggests a theory where general beneficence is collectivised to avoid imposing unlimited demands on individual liberty. The immunity granted to the voluntary rescuer confirms this: rescue by a stranger is treated as supererogatory, a gift rather than a duty. By shielding the rescuer from liability, the law encourages the supererogatory without mandating it. Thus, a single theory explains the features: special obligations are private and enforceable; general beneficence is public and collective; voluntary intervention is privileged but not compelled.

  **Underdetermination of Moral Foundations**

  While the practice presupposes the priority of negative liberty, the specific philosophical justification remains underdetermined. The rules strictly presuppose only that individuals are not initially liable for the welfare of strangers. However, incompatible theories fit this framework comfortably. A Libertarian might argue this protects self-ownership; a Contractarian might argue we have only agreed to rules that do not impose excessive burdens; a Rule-Utilitarian might argue that a general duty to rescue would create more anxiety and litigation than it saves lives. The law does not commit to why liberty is default, only that it is. This underdetermination allows the legal structure to remain stable despite shifting moral philosophies among the judiciary and legislature. The practice is robust precisely because it does not rely on a single contested moral truth, but rather on a procedural commitment to limiting state coercion over individual inaction.

  **The Baseline of Harm**

  The asymmetry between the passive bystander and the active obstructer is not an independent commitment smuggled in, but a necessary corollary of the underlying view. The law establishes a baseline of the status quo ante. To actively remove a life-ring is to alter the baseline to the victim's detriment, constituting a harm caused by the agent. To fail to throw the ring is to leave the baseline unchanged. This interrogates the concept of causation in law: liability attaches to making things worse, not to failing to make things better. This reinforces the liberal conception of harm as interference. If the law treated obstruction as innocent, it would undermine the prohibition against active harm; if it treated non-rescue as liable, it would undermine the principle of negative liberty. The asymmetry is therefore foundational, ensuring that the boundary between doing and allowing remains policed, preserving the integrity of the sovereign individual against claims of unchosen obligation.

  **Singer and the Proposed Reform**

  Replacing this view with Peter Singer's principle of beneficence would dismantle the acts/omissions distinction entirely. Under Singer's view, distance and relationship are morally irrelevant; the duty to rescue is universal and demanding, limited only by comparable moral importance. The current legal structure would collapse, as the distinction between private duty and public collectivisation would vanish in favour of a universal individual obligation.

  Your proposed reform—a statutory duty of easy rescue for identifiable victims, enforced via civil compensation—introduces a hybrid commitment. It acknowledges a general duty to strangers, rejecting the pure common law position, but limits it via identifiability and cost caps, rejecting the full Singerian demand. By shifting enforcement to civil liability, it reframes the wrong not as a crime against the state, but as a debt to the victim. This resolves the tension between liberty and beneficence by creating a middle ground: liberty is preserved except where cost is negligible and victimhood is proximate. However, it relocates the tension to the definitions of 'identifiable' and 'negligible'. It introduces a commitment to enforceable solidarity among strangers, but only when psychological proximity triggers empathy. Ultimately, this reform admits that the common law's encoded philosophy is too austere, yet it stops short of the universalism Singer requires, settling instead for a managed obligation that balances moral demand with legal administrability.
