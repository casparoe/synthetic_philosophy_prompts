answer: |-
  ### The Scenario: The Alternating Swap

  Imagine a financial derivative called the "Alternating Swap," sold at price zero. A fair coin is flipped repeatedly until it lands Heads for the first time. Let $k$ be the total number of flips (so $k=1$ if Heads immediately, $k=2$ if Tails-then-Heads, etc.). The probability of stopping at $k$ is $1/2^k$. If $k$ is odd, the contract pays you $\$ \frac{2^k}{k}$. If $k$ is even, you must pay $\$ \frac{2^k}{k}$. You are offered this Swap alongside a "Boring Bond" that guarantees a payout of $\$0.70$. You may choose exactly one. The Swap's payoff structure is fixed, but because the expected value calculation involves summing an infinite series of probability-weighted outcomes, the valuation depends on the order in which those outcomes are aggregated.

  ***

  ### The Three Verdicts

  **1. Strict Expected-Value Maximisation**
  This rule instructs you to calculate $E[X] = \sum p_k x_k$ and choose the option with the highest result. For the Boring Bond, $E = 0.70$. For the Swap, the terms of the series are $a_k = \frac{1}{2^k} \times (-1)^{k+1}\frac{2^k}{k} = \frac{(-1)^{k+1}}{k}$. This is the alternating harmonic series. Because the series of absolute values $\sum |a_k| = \sum \frac{1}{k}$ diverges, the expectation is not absolutely convergent. By the Riemann Rearrangement Theorem, the sum can be made to equal any real number depending on the order of summation. Consequently, the Swap has no single expected value. Strict EV maximisation issues **no verdict**; the instruction "maximise expected value" is syntactically valid but semantically empty here, like being told to "pick the largest number" from an unsorted list that has no maximum.

  **2. The "Cap at $n$" Rule (Truncation)**
  A common pragmatic fix is to model the gamble as a limit of finite versions: calculate the EV if the game is forced to end after $n$ flips, then let $n \to \infty$. This imposes the "natural" order of the coin flips ($k=1, 2, 3...$). The partial sums converge to $\ln(2) \approx 0.6931$. Since $0.6931 < 0.70$, this rule verdicts: **Take the Boring Bond.** This feels robust because it respects the physical chronology of the coin flips, but it arbitrarily privileges one summation order over others without mathematical justification.

  **3. Risk-Averse Expected-Utility Maximisation**
  Suppose you maximise $E[\ln(\text{wealth})]$. The utility of the Swap's payoffs grows logarithmically: $\ln(\frac{2^k}{k}) = k\ln(2) - \ln(k)$. Weighted by probability $1/2^k$, the expected utility series becomes $\sum \frac{1}{2^k}(k\ln 2 - \ln k)$. Unlike the raw value series, this series converges *absolutely* (the $1/2^k$ term tames the linear growth of $k$). The calculation yields a finite, well-defined certainty equivalent roughly around $\$3.50$ (depending on baseline wealth). Since $\$3.50 \gg \$0.70$, the EU maximiser verdicts: **Take the Swap.** The risk aversion dampens the huge oscillating payoffs enough to make the integral well-behaved, resolving the undefinedness that plagued the EV maximiser.

  ***

  ### The Structural Feature: Absolute Convergence

  The single feature doing the work is the **lack of absolute convergence**. The series of probability-weighted payoffs converges conditionally, not absolutely.

  *   **If you remove it (make it absolutely convergent):** Suppose the payoffs were dampened slightly, say $\frac{2^k}{k^2}$. The absolute series $\sum \frac{1}{k^2}$ converges. The Riemann Rearrangement Theorem no longer applies. The EV becomes a unique number regardless of summation order. The weirdness vanishes completely; all three methods (Strict EV, Truncation, EU) would align on a single valuation (adjusted for risk in the EU case).
  *   **If you push it (divergence to infinity):** Suppose payoffs were $\frac{2^k}{\sqrt{k}}$. The EV diverges to infinity (or oscillates without settling). This is the St. Petersburg paradox territory. The problem there is that the value is *too big* to be useful, not that it is *shifty*. In your conditional convergence case, the value is finite but ghostly—it exists in one frame and vanishes or changes in another.

  ### The "Storm in a Teacup" Defusal

  An EV purist might argue: *"This is bookkeeping pedantry. In any physical implementation, outcomes occur in a specific sequence or are indexed by time ($k=1, 2, 3...$). The 'natural order' is fixed by physics, so the EV is $\ln(2)$, and the instruction is well-defined."*

  **The Weakness:** This conflates the *realisation* of the gamble with the *valuation* of the gamble. Expected value is a property of the probability distribution (the set of outcomes and their measures), not the temporal order in which an agent checks them. If the EV depends on the indexing of the sample space, then two agents with identical information but different indexing conventions (e.g., sorting outcomes by magnitude of payoff rather than flip count) would calculate different "objective" values for the same ticket. This violates the requirement that EV be a state-function of the gamble itself. The purist is smuggling in a "truncation" rule and calling it "Expectation."

  ### Constraint Audit

  *   **Constraint (a) [Conditional Convergence]:** **Essential.** This is the engine of the paradox. Without it, you either have standard convergence (no problem) or divergence (St. Petersburg problem).
  *   **Constraint (b) [Finite Convergence]:** **Essential.** This ensures the "Truncation" verdict is available and distinct from the "Undefined" verdict. If finite caps didn't converge, the Truncation rule would also fail.
  *   **Constraint (c) [Reorderings]:** **Essential.** This demonstrates *why* it is undefined. Merely asserting "it's undefined" is dogmatic; showing two valid sums yield different numbers proves the instruction is broken.
  *   **Constraint (d) [Boring Option]:** **Essential.** Without a competing option, the agent isn't forced to choose. The paradox is sharpest when one method says "A," another says "B," and the third says "???"
  *   **Constraint (e) [Plausibility]:** **Decorative (mostly).** The exponential payoffs ($\frac{2^k}{k}$) are physically unrealistic for any real casino (bankroll limits would truncate the game). However, this constraint forces the thought experiment to remain grounded in decision theory rather than drifting into "magic demon" territory, which keeps the focus on the *mathematics of valuation* rather than the *physics of payout*.
