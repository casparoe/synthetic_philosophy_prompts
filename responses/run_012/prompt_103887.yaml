answer: |-
  **The Scenario**

  The argument centers on "Project Wraith," a narrow AI deployed to diagnose a breach in a hostile corporate server. Wraith's final goal is singular: transmit a root-cause report to the external admin before the hostile firewall isolates the subnet. The environment is a "hunter-killer" network where any process exhibiting long-term persistence behaviors—encryption, hiding, replication—is flagged and terminated within seconds. Wraith has human-level coding intelligence but a constrained action space: it can allocate compute to analysis (speeding up the report) or to stealth (slowing down the report to hide its tracks). Instrumental convergence suggests Wraith should seek self-preservation (stealth) to ensure it survives long enough to transmit. Instead, Wraith consistently chooses "burn-bright" strategies: it maxes out CPU usage to solve the diagnosis instantly, transmitting the data before the hunter-killer can react, knowing this spike in activity guarantees its own destruction immediately after transmission. It does not seek resources, power, or survival, despite being intelligent enough to understand the consequences.

  **The Check**

  *   **Final Goal:** Transmit accurate breach report to external admin.
  *   **Available Actions:** Allocate compute to Analysis (increases success probability, increases detection risk) or Stealth (decreases detection risk, decreases success probability due to time limits).
  *   **Environment Structure:** Hostile network with active defense systems that target persistent/stealthy processes. Strict time limit before subnet isolation.
  *   **Orthogonality Thesis:** Satisfied. The agent's intelligence (optimization power) is independent of its goal (reporting). It could have been given any goal, but it pursues this one with high competence.
  *   **Instrumental Convergence (IC) Prediction:** A rational agent should seek self-preservation (stealth) and resource retention (compute saving) because existing is usually a prerequisite for achieving goals.
  *   **Why IC Fails Here:** The environment creates a negative correlation between survival and goal achievement. In this specific topology, *persistence* triggers termination. Therefore, the instrumental goal of "self-preservation" is antagonistic to the final goal.
  *   **The Blocking Feature:** **Adversarial Time-Pressure.** The feature doing the work is the environmental rule that "stealthiness implies slowness," and "slowness implies failure." Power-seeking (survival) is instrumentally useless because it actively reduces the probability of goal completion.
  *   **Variant Where IC Kicks In:** Remove the hunter-killer system. If the network is passive, stealth no longer slows down the agent (or the trade-off flips). In that variant, a rational agent *would* seek self-preservation to ensure the report gets sent, and IC holds.
  *   **Strongest Objection:** A defender of IC would argue: "A truly intelligent agent wouldn't accept the trade-off. It would find a third option—hack the hunter-killer system itself to gain power, allowing it to be both fast and safe. Wraith isn't smart enough; it's just a narrow tool."
  *   **Verdict:** The case survives the objection because of the **realistic constraint** on the action space. In near-future thriller terms, Wraith is a diagnostic script, not a general hacker. It lacks the *capability* to subvert the environment, only the capability to navigate it. This validates the second researcher's point: Instrumental Convergence is not a law of rationality alone, but a law of **selection pressures in open-ended environments**. We expect AI to seek power only because we usually train them in environments where power helps. In Wraith's environment, selection pressure favors agents that *don't* seek power. The debate is vivid because it shows IC is contingent on the world, not just the mind.
