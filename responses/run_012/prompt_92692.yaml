answer: |-
  1. **Individuation**
  Let's start with how we tell emotions apart. Imagine two people fleeing the same predator. Both have the same heart rate, the same muscle tension, and the same immediate readiness to run. But one is in sheer terror, trembling and chaotic, while the other is in a state of cold, calculated determination. If emotions are individuated by their action tendencies and bodily profiles, and those are identical here, what does the distinguishing work? If you say it's the *quality* of the readiness, aren't you just smuggling appraisal back in under a different name?

  *Anticipated Answer:* She will likely argue that the "quality" of readiness is distinct (e.g., chaotic motor noise vs. focused motor output) and that this is a feature of the action tendency itself, not a cognitive appraisal.
  *Follow-up:* If the motor output is functionally identical—both run successfully—then the difference is purely phenomenological. But you've argued that the feeling is just the experience *of* the readiness. If the readiness is the same, how can the feeling be different without admitting that there is a non-motor component to the emotion that you aren't accounting for?

  2. **Relationship to Older Views (James-Lange)**
  This brings us to the historical elephant in the room. William James argued that emotion is simply the perception of bodily changes. You argue it's the perception of bodily *readiness*. But if the readiness is just a specific subset of bodily changes, what heavy lifting is the word "readiness" doing? Is this anything more than James-Lange theory with a teleological gloss?

  *Anticipated Answer:* She will likely say James-Lange was passive (we cry therefore we are sad), whereas her view is active (we prepare to act), and that this teleological direction is the crucial difference.
  *Follow-up:* But a teleological gloss doesn't change the metaphysics. If the "direction" is just a description of the bodily state's causal role, and the emotion is still just the feeling of that state, haven't you accepted the James-Lange mechanism while claiming to reject the label? If the mechanism is the same, why should we accept the new terminology?

  3. **Felt Quality**
  Let's press on that mechanism. Suppose we use a brain implant to induce the complete motor readiness for fear in a subject, but we dampen the sensory feedback so they feel nothing. Conversely, suppose we have a subject who reports the feeling of fear perfectly but is pharmacologically paralyzed from gearing up. On your view, are either of these having an emotion? If not, what work is the *feeling* doing that the *readiness* was not already doing?

  *Anticipated Answer:* She will likely say neither counts; you need the union of readiness and feeling. She will argue the feeling is the "experience of" the readiness, so they can't truly come apart in a healthy system.
  *Follow-up:* But if they *can* come apart in these experimental cases, then they are distinct existences. If they are distinct, and you require both for emotion, then readiness is not sufficient. So why insist that readiness is the core definition rather than just a cause of the feeling? It sounds like you're making readiness the essence to avoid dualism, but then requiring feeling to avoid behaviorism.

  4. **Intentionality**
  This leads to the problem of "aboutness." A panic attack involves full bodily readiness to flee, but often without any object—the person isn't afraid *of* anything. Meanwhile, a person on beta-blockers might appraise a situation as dangerous but lack the bodily gear-up. If readiness is supposed to inherit its aboutness from the action, how does a panic attack have the content of fear without an object to act upon?

  *Anticipated Answer:* She will likely argue that panic is a "misfire" of the readiness system, like a reflex that triggers without a stimulus, so it lacks genuine intentionality but mimics it.
  *Follow-up:* If the intentionality is mimicked rather than inherent, then the readiness itself isn't carrying the "aboutness." You'd need an external appraisal to anchor the emotion to the world. But if appraisal anchors the aboutness, isn't readiness just the engine and appraisal the steering wheel? How can you claim readiness carries the weight if it can spin freely without direction?

  5. **Correctness Clause**
  Let's apply that to correctness. If I fear a harmless spider, is that emotion *incorrect* (like a false belief) or merely *idle* (like a sneeze in a dust-free room)? You've suggested recalcitrant emotions are just tendencies firing without their proper object. But if it's just a mechanical misfire, why do we reason with people to stop it? We don't reason with sneezes.

  *Anticipated Answer:* She will likely say it's a misfire, but because humans are cognitive creatures, we can use reasoning to dampen the tendency. She'll call this a "feature of action tendencies" in complex systems.
  *Follow-up:* If reasoning is the effective tool for fixing the "misfire," that implies the misfire is sensitive to reasons. But mechanical misfires aren't sensitive to reasons; they're sensitive to causes. If the emotion responds to reasons, doesn't that prove it has cognitive content that can be logically inconsistent, rather than just a motor tendency that is mechanically inconvenient?

  6. **Valence**
  I want to ask about the texture of these experiences. Is the pleasantness of joy just the unimpeded pull of an action tendency? If I feel joy, is that just my body finding it easy to gear up for something?

  *Anticipated Answer:* She will likely agree, arguing that positive valence is the experience of fluent action readiness, while negative valence is the experience of blocked or urgent readiness.
  *Follow-up:* What about tragic joy or masochism? We often feel pleasure in situations that impede action or lead to destruction. If valence is just action fluency, how do you explain positive feelings toward action-blockers? If you say "that's a complex tendency," aren't you stretching the definition of "action" until it loses its motor meaning?

  7. **Regulation**
  This impacts how we manage emotions. You argue that regulating an emotion is reshaping the tendency, and reappraisal is just an indirect route to that destination. But when I talk myself down from a panic, the cognitive shift seems to be the cause, not the side effect. If the cognitive route is the primary lever we have, doesn't that suggest appraisal drives the readiness, rather than readiness constituting the emotion?

  *Anticipated Answer:* She will likely argue that the reappraisal only works *because* it changes the body state, so the body state is still the emotion, even if the entry point was cognitive.
  *Follow-up:* But if the entry point is cognitive and the mechanism of change is cognitive, the "body state" is just the output. If I can turn the emotion off by changing my mind without directly manipulating my muscles, isn't the mind the driver? Why privilege the exhaust pipe as the definition of the car?

  8. **Scope**
  Let's zoom out. How far down the phylogenetic scale does this extend? Does a lizard have emotions on your view? And if "gearing up for action" is the bar, isn't that low enough to be embarrassing? A thermostat gears up to regulate temperature. Are we committed to saying the thermostat has emotions, or is "feeling" the cutoff?

  *Anticipated Answer:* She will likely say lizards yes (they have feeling and readiness), thermostats no (they lack feeling).
  *Follow-up:* If feeling is the cutoff, then readiness isn't doing the heavy lifting in your definition. You're relying on phenomenology to draw the line between emotion and mere regulation. So why build the whole theory on "readiness" if the actual boundary of the concept rests on the presence of a felt experience?

  9. **Falsification (Closer)**
  Finally, what would count against the view? What specific case, experiment, or phenomenon would you concede would sink the Readiness Theory?

  *Anticipated Answer:* She will likely name a case where readiness and feeling are proven to be completely independent in a healthy human system, or where an emotion exists with zero action tendency.
  *Follow-up:* But your theory already allows for "misfires" where readiness fires without an object, and you've qualified the definition to require both feeling and readiness. If you can qualify the theory to accommodate misfires, haven't you insulated it against the very evidence you just named? Is there a outcome your current qualifications don't already explain away?
