  ### Tutor's Safety Check
  Before you enter the room, verify the following regarding the rule on the board. The session relies on this rule satisfying the hypotheses of the Gibbard–Satterthwaite theorem (onto, non-dictatorial) while violating the conclusion (strategy-proofness).

  *   **Onto:** Yes. If all voters rank $A$ first, $A$ has zero last-place votes and wins the pairwise stage. The same applies to $B$ and $C$.
  *   **Dictatorial:** No. No single voter can determine the last-place count (requires majority to guarantee elimination) or the pairwise majority (requires 3 votes) alone.
  *   **Strategy-Proof:** No. As demonstrated in the plan below, Voter 1 can profitably misreport.

  The session is not built on sand. You may proceed.

  ***

  # Session Plan: The Inevitability of Manipulation
  **Duration:** 90 Minutes
  **Audience:** Final-year Undergraduates (Economics & Philosophy)
  **Board Work:** The voting rule must remain visible on the board throughout.

  ## 1. The Object and Its Properties (0–20 minutes)

  **0–5 mins: The Rule**
  Write the rule exactly as provided in the prompt. Do not annotate it. Do not mention Gibbard or Satterthwaite yet.
  *   *Instruction:* "This is our object of study for the next hour and a half. It is a Social Choice Function (SCF). It maps a profile of strict preferences to a single winner. Read it. Ensure you understand the mechanics of the elimination round and the tie-break."

  **5–15 mins: Onto and Dictatorship**
  Elicit definitions from the students, but anchor them to *this* rule.
  *   **Onto:** Ask: "Can $A$ win? Can $B$? Can $C$?" Establish that the range of the function is the full set of alternatives.
      *   *Why now?* We must establish the rule is not trivially excluding options before we ask if it can be gamed. If it weren't onto, manipulation might be irrelevant for the excluded options.
  *   **Dictatorship:** Ask: "Is there a voter who gets their first choice regardless of what others do?"
      *   *Crucial Distinction:* Ensure they do not confuse this with 'pivotal power'. A dictator in this context is not someone who swings a close vote; it is someone whose top choice *is* the social choice, universally.
      *   *Why now?* We must clear the 'easy' escape routes. If it were dictatorial, strategy-proofness would be trivial (the dictator tells the truth, others don't matter). We need to establish that power is dispersed, which makes the coming result more disturbing.

  **15–20 mins: Strategy-Proofness (The Pivot)**
  Define a **Profitable Misreport**.
  *   *Definition:* A voter $i$ has a profitable misreport if, holding others' votes constant, reporting $P'_i \neq P_i$ yields an outcome $x'$ that $i$ strictly prefers to the outcome $x$ resulting from truth-telling.
  *   *Why now?* Students often conflate strategy-proofness with Nash Equilibrium. You must establish that strategy-proofness requires truth-telling to be a **dominant strategy**, not merely an equilibrium response. It must be optimal *regardless* of what others do. This definition is the prerequisite for the demonstration; without it, they will view the manipulation as a contingent gamble rather than a structural flaw.

  ## 2. The Demonstration (20–65 minutes)

  **20–40 mins: Constructing the Profile**
  Do not hand them the profile immediately. Build it on the board with their input to show *why* it looks the way it does.
  *   *Goal:* We need a profile where the truthful outcome is bad for Voter 1, but a lie makes it better.
  *   *Constraint:* The manipulation must change the *set of survivors*, not just the final pairwise vote. (A single voter cannot swing a 5-person pairwise majority alone, so they must manipulate the elimination stage).
  *   *Write this Profile:*
      *   **Voter 1:** $A \succ B \succ C$
      *   **Voter 2:** $B \succ C \succ A$
      *   **Voter 3:** $C \succ A \succ B$
      *   **Voter 4:** $C \succ A \succ B$
      *   **Voter 5:** $B \succ C \succ A$

  **40–55 mins: Truthful Execution**
  Walk through the rule step-by-step with the class.
  1.  **Last-place counts:** $A$ (2), $B$ (2), $C$ (1).
  2.  **Elimination:** $A$ and $B$ tie for 'most hated'.
  3.  **Tie-break:** Head-to-head $A$ vs $B$.
      *   Voters 1, 3, 4 prefer $A$. Voters 2, 5 prefer $B$.
      *   $A$ wins 3–2. $B$ is struck out.
  4.  **Final Round:** $A$ vs $C$.
      *   Voter 1 prefers $A$. Voters 2, 3, 4, 5 prefer $C$.
      *   **Winner: $C$.**
  *   *Check:* Voter 1 receives their *least* preferred option.

  **55–65 mins: The Manipulation**
  Ask Voter 1: "You are about to receive $C$. You prefer $B$ to $C$. Can you change your ballot to get $B$?"
  *   *The Lie:* Voter 1 reports **$B \succ C \succ A$**. (They bury their favourite, $A$).
  *   **Re-calculate:**
      1.  **Last-place counts:** $A$ (3), $B$ (2), $C$ (0).
      2.  **Elimination:** $A$ now has the strict greatest number of last-place rankings. $A$ is struck out. (Note: The tie-break is no longer needed).
      3.  **Final Round:** $B$ vs $C$.
          *   Voters 1, 2, 5 prefer $B$. Voters 3, 4 prefer $C$.
          *   **Winner: $B$.**
  *   *Result:* Voter 1 receives $B$. Since $B \succ_1 C$, the misreport was profitable.
  *   *Discussion Point:* Highlight that Voter 1 lied about their **favourite**. They did not merely swap lower candidates; they ranked their true first choice last. This is 'burying'. It feels counter-intuitive to vote against your favourite, which is why the theorem feels non-trivial.

  ## 3. Generalisation and Misconceptions (65–85 minutes)

  **65–75 mins: From Example to Theorem**
  Now state the Gibbard–Satterthwaite Theorem.
  *   *Statement:* For any SCF with $\ge 3$ alternatives, if it is onto and non-dictatorial, it is manipulable.
  *   *The "Inevitability" Sense:* Ask the class: "Could we tweak the tie-break rule to fix this?" (No, GS says *any* rule fails). "Could we add more voters?" (No).
  *   *Connection to Arrow:* Briefly note that Arrow dealt with Social Welfare Functions (rankings of all options) and IIA. Gibbard–Satterthwaite deals with Social Choice Functions (single winner) and Strategy-Proofness. They are siblings, not twins. The impossibility survives the change in framework.

  **75–85 mins: Addressing Misconceptions**
  Address the following explicitly. Distinguish between genuine errors and defensible nuances.

  1.  **"Strategy-proofness means truthful voting is a Nash Equilibrium."**
      *   *Verdict:* **Genuine Misconception.**
      *   *Correction:* Nash Equilibrium only requires truth-telling to be optimal *given* others tell the truth. Strategy-proofness requires it to be optimal *regardless* of what others do (Dominant Strategy). This session showed a profitable deviation assuming others stayed fixed; that breaks Dominant Strategy, but might not break Nash. GS breaks the stronger condition.

  2.  **"The theorem says every vote is pointless or every result is rigged."**
      *   *Verdict:* **Genuine Misconception.**
      *   *Correction:* It does not say manipulation *will* happen, only that the *possibility* exists. Nor does it mean the outcome is uncorrelated with preferences. It means there is no perfect mechanical immunity to gaming.

  3.  **"Dictatorship here means a voter with disproportionate power."**
      *   *Verdict:* **Genuine Misconception.**
      *   *Correction:* In social choice theory, 'dictator' is a technical term. It means the social choice *always* equals that voter's top rank. A voter with a veto or extra weight is not a dictator in the GS sense.

  4.  **"It is just Arrow's theorem with the words changed."**
      *   *Verdict:* **Genuine Misconception.**
      *   *Correction:* Arrow's theorem relies on the Independence of Irrelevant Alternatives (IIA). GS does not assume IIA; it assumes Strategy-Proofness. The mathematical structures differ (SWF vs SCF). While the implications are similar, conflating them obscures the specific contribution of Gibbard and Satterthwaite regarding incentives.

  5.  **"Cardinal or randomised rules are an escape."**
      *   *Verdict:* **Defensible Reading.**
      *   *Nuance:* Do not stamp on this. GS assumes ordinal preferences and deterministic outcomes. Range voting (cardinal) or random dictatorships (probabilistic) do escape the theorem. However, they introduce new costs (interpersonal comparison of utility or lack of ex-post efficiency). Acknowledge this as a valid theoretical escape route that changes the hypotheses, rather than a student error.

  ## 4. What Not to Attempt (85–87 minutes)

  Briefly state the boundaries of this session to prevent false confidence.
  *   **No Proofs:** "We have not proved the theorem. We have shown it holds for this rule. The general proof involves constructing a pivotal voter across a sequence of profiles, which is beyond our scope."
  *   **No Domain Restrictions:** "We assume the domain of preferences is unrestricted (any ranking is allowed). If we restricted preferences to be 'single-peaked' (e.g., left-right spectrum), manipulation can be avoided. We are not discussing that today."
  *   **Why:** Acknowledging these limits prevents students from thinking the impossibility is absolute in *all* conceivable mathematical spaces, while maintaining the force of the result within the standard model.

  ## 5. Assessment Question (87–90 minutes)

  Put this question on the board. Ask them to write a two-sentence answer.

  > **"In the profile we examined, Voter 1 manipulated successfully by ranking their favourite option last. If the voting rule were changed to be 'Plurality Rule' (most first-place votes wins), could a voter ever profitably manipulate by ranking their favourite option last? Explain why or why not."**

  *   **Desired Answer:** No. In Plurality, ranking your favourite last never increases their vote count. To manipulate Plurality, you typically 'compromise' (vote for a second choice to stop a worse winner), but you never 'bury' your favourite.
  *   **Why this works:** It tests if they understand *why* the manipulation worked in the specific rule (the elimination mechanism punished the favourite) versus a different rule. It checks if they grasp the link between the rule's structure and the specific type of lie required, rather than just memorising that "manipulation exists".
