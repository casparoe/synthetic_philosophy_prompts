answer: |-
  **VERIDIAN INSTITUTE FOR GLOBAL STABILITY**
  **INTERNAL MEMORANDUM**

  **TO:** Director of Communications
  **FROM:** Methodology Sub-Committee, Global Violence Index (GVI)
  **DATE:** 14 October 2024
  **SUBJECT:** Finalisation of GVI-2024 Parameters Prior to Press Release
  **CLASSIFICATION:** RESTRICTED

  1. **Purpose and Headline Alignment**
  This memo confirms the methodological adjustments required to finalise the 2024 dataset. We note the Press Office has already drafted the headline ("Global Violence Hits Historic Low for Fifth Consecutive Year"). Our task is to ensure the underlying data supports this assertion without compromising the Institute's long-term series continuity. The following items resolve outstanding discrepancies identified during the Q3 review.

  2. **Reclassification of Coercive Incidents**
  Following the vote at the September convening, "Pre-emptive Neutralisation Events" (formerly Category 1: Direct Violence) are reclassified as Category 4: Systemic Friction. This includes casualties arising from preventative detention and crowd dispersal where no projectile weapon was discharged. This revision reduces the current year's numerator by approximately 12%. We acknowledge that without this reclassification, the trend line would remain flat rather than declining. It is imperative that the technical note regarding this change remains in Appendix C rather than the main summary.

  3. **Per-Capita Rates vs. Absolute Counts**
  Committee members raised concerns regarding the divergence between violence rates and absolute victim counts. In our toy model for Zone A (population 1 million, 500 violent deaths) and Zone B (population 100 million, 600 violent deaths), Zone B registers as statistically safer despite higher total mortality. The GVI prioritises per-capita rates for the headline figure. We recognise this creates a denominator dependence issue: if population growth outpaces violence growth, the index improves even if suffering increases. However, shifting to absolute numbers would invalidate comparisons with the 20th-century baseline. We recommend retaining the per-capita metric for the press conference.

  4. **Historical Baseline Reliability**
  The long-run decline narrative relies heavily on the "Speculative Pre-Historic Cohort" (Year 0–1500). We must note internally that these figures rest on archaeological bone-density extrapolations that would not survive contemporary peer review. However, adjusting the baseline to reflect modern data standards would erase the decline trend entirely. The Committee agrees to maintain the existing baseline estimates under the principle of series continuity. The uncertainty margin will be described as "interpretative flexibility" in public-facing documents.

  5. **State Monopoly and Agentive Violence**
  A significant portion of the reduction in private homicide correlates with an increase in state-administered lethal force. The question remains whether a monopoly on killing constitutes a reduction in violence or merely a centralisation of agency. The current methodology scores state violence as "Order Maintenance" provided it follows statutory procedure. While this effectively removes state killings from the violence index, it aligns with the Institute's working definition of stability. We propose no change to this distinction for the 2024 cycle.

  6. **Boundary Problems: Omission and Non-Humans**
  Queries regarding deaths by omission (famine, preventable disease, neglect) remain unresolved. Currently, these are coded as "Caloric Discontinuities" or "Pathological Events" rather than violence, as no direct agent is identified. Similarly, casualties among non-human animals are excluded on the grounds of "non-agentive subject status." Including these categories would triple the estimated suffering metrics. The Committee recommends deferring these inclusions pending further data granularity, which we anticipate will not be available before the next century.

  7. **Ontological Status of the Measure**
  Finally, the Committee was unable to reach consensus on whether the GVI measures a mind-independent fact about the world or merely the efficiency of our own categorisation systems. Some members argued that if the metric changes the phenomenon, the metric is constitutive. Others maintained that a stable metric is required to measure change. As this is a philosophical rather than methodological question, we recommend it be omitted from the Q&A briefing pack.

  8. **Conclusion**
  Subject to the above, the data is cleared for release. The record low is statistically valid within the defined parameters.

  ***

  **MINORITY ANNEX: DISSENTING OPINION (DR. A. THORNE)**

  I cannot sign off on the revised parameters. Reclassifying coercive neutralisation as friction to achieve a downward trend is tautological: we are defining violence down to show violence down. The per-capita metric obscures absolute suffering; the baseline relies on conjecture; and excluding state killing assumes the legitimacy of the state is identical to the absence of violence. There is no fact of the matter here because we have constructed the measure to guarantee the result. We are not measuring decline. We are measuring our own willingness to look away. I request this annex be circulated with the main memo.
