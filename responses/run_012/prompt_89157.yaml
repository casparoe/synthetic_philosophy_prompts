  Patient S.R. presents with a complete commissurotomy complicated by asymmetrical hippocampal sclerosis, leaving the anterior commissure intact but impairing episodic consolidation across hemispheres. Behaviourally, S.R. executes complex bimanual tasks requiring real-time sensory-motor integration, such as threading a needle using both hands in concert, without intermanual conflict or hesitation, indicating a unified phenomenal field governing present action. However, non-verbal memory testing reveals a stark dissociation: images presented to the left visual field are recognised only by the left hand, and autobiographical cues accessed via the left hand elicit memories inaccessible to the right hemisphere's control systems and verbal output, while preference testing shows divergent long-term dispositions depending on the hemisphere engaged during encoding, establishing two disjoint historical narratives despite the unified present behaviour.

  **Check**

  **Verdicts:** The Stream Criterion (SC) yields **one subject**, because the successful, conflict-free bimanual coordination implies a single, integrated phenomenal field at the time of action. The History Criterion (HC) yields **two subjects**, because the disjoint autobiographical memories and divergent preferences constitute two distinct continuing sets of psychological traits that behaviour hangs off.

  **Feature doing the work:** The dissociation between the **anterior commissure** (preserving real-time sensory-motor integration for SC) and the **hippocampal sclerosis** (blocking cross-hemispheric memory consolidation for HC).

  **Removal test:** If you remove the intact anterior commissure (reverting to standard callosotomy), real-time integration fails, producing intermanual conflict; both criteria then verdict **two subjects** (the ordinary split-brain case). If you remove the hippocampal pathology, memories consolidate across hemispheres, and both criteria verdict **one subject**.

  **Strongest line of attack (SC-only):** A proponent of the Stream Criterion might argue that if memories are truly disjoint, the phenomenal field cannot be genuinely unified; the behavioural coordination is merely subcortical reflex, not evidence of a single conscious subject. They would claim that diachronic psychological continuity (memory) is constitutive of synchronic unity, so the SC verdict here is illusory.

  **Honesty check:** This case does risk making the simultaneity requirement look superficial. By relying on behavioural coordination to establish phenomenal unity while admitting deep psychological disunity in memory, it suggests the Stream Criterion may capture only a thin slice of subjecthood (the 'specious present') while missing the deeper narrative unity that intuitively matters for personhood. It exposes that SC=1 might be compatible with a fractured self, which some seminar participants may find renders the criterion inadequate for counting subjects in any morally significant sense.
