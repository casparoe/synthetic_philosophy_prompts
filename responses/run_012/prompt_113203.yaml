answer: |-
  This is a classic case of a **Level of Analysis conflict** masquerading as an ontological dispute. Your hypothesis is largely correct: they are answering three different questions under the single heading "What is an 'a'?" However, the impasse persists not just because the questions are different, but because each camp implicitly claims their level is the *foundational* truth that explains the others.

  Here is the diagnosis of the disagreement structure, followed by what progress would actually look like.

  ### 1. The Diagnosis: A Collision of Explanatory Levels

  The reason nobody moves an inch is that each friend is operating on a different plane of explanation, yet they treat their plane as the substrate for the others.

  *   **The Designer (The Normative/Generative Level):**
      *   **Question:** *What rules allow us to generate valid instances?*
      *   **Claim:** There is a structural schema (a "deep grammar" of the letter).
      *   **Blind Spot:** They are conflating *design necessity* with *perceptual reality*. They assume that because a skeleton is useful for *drawing* an 'a', it must be the thing that *makes* it an 'a'. When confronted with the single-storey vs. double-storey problem, they posit a "deeper" skeleton to save the theory, risking unfalsifiability.
  *   **The Cognitivist (The Psychological/Descriptive Level):**
      *   **Question:** *How does the human visual system categorize this mark?*
      *   **Claim:** Categorization is probabilistic, based on similarity to a prototype or family resemblance.
      *   **Blind Spot:** They are conflating *recognition mechanisms* with *identity conditions*. Just because the brain uses fuzzy matching to *identify* an 'a' doesn't mean the 'a' *is* fuzzy. They dismiss the structuralist's "skeleton" as essentialism, failing to see it might be a heuristic the brain actually uses (e.g., structural description models in object recognition).
  *   **The Writing Systems Expert (The Semiotic/Systemic Level):**
      *   **Question:** *What function does this mark serve in a code?*
      *   **Claim:** Identity is a matter of convention and assignment (code points, orthographic rules).
      *   **Blind Spot:** They are conflating *assignment* with *affordance*. Yes, you can assign any mark to be an 'a', but if it doesn't afford recognition (Cognitivist) or follow generative constraints (Designer), the system becomes inefficient or breaks. They treat the "bookkeeping" as primary, ignoring the material constraints of the mark.

  **Verdict on your hypothesis:** You are right that this is "different questions under one word." But the *substantive* disagreement lies in the **Primacy War**. Each person believes their explanation constrains the others.
  *   The Designer thinks: Perception follows Structure.
  *   The Cognitivist thinks: Structure is an illusion of Perception.
  *   The Functionalist thinks: Both are subordinate to Convention.

  ### 2. The Verbal vs. Substantive Split

  There is a verbal component you can strip away immediately using standard terminology from your respective fields. If you force them to use the **Grapheme/Glyph/Character** distinction, the air might clear:

  1.  **Character (Encoding/Function):** The abstract unit (e.g., Unicode U+0061). This is the **Functionalist's** domain.
  2.  **Glyph (Visual Form):** The specific shape (single-storey, double-storey, italic, bold). This is the **Designer's** domain.
  3.  **Category (Mental Representation):** The cognitive class. This is the **Cognitivist's** domain.

  **The Conflict Reframed:**
  *   **Designer:** "Different Glyphs map to the same Character because they share a Generative Skeleton."
  *   **Cognitivist:** "Different Glyphs map to the same Category because they fall within a Similarity Space."
  *   **Functionalist:** "Different Glyphs map to the same Character because the System assigns them to that slot."

  The substantive disagreement is no longer "What is an 'a'?" but **"What governs the mapping between Glyph and Character?"** Is the mapping constrained by geometry (Designer), by perception (Cognitivist), or by arbitrary agreement (Functionalist)?

  ### 3. The Hidden Empirical Question

  You identified this correctly: *ambiguity and context.* This is the only place where the three camps can actually collide on shared ground.

  The "Single vs. Double Storey" case is too stable; everyone agrees those are 'a's. The fight needs to move to the **boundary conditions**.
  *   **The Experiment:** Take a double-storey 'a' and morph it continuously into a 'd', or an 'o' with a tail, or a single-storey 'a'.
  *   **The Test:**
      *   If the **Designer** is right, there should be a specific structural break (e.g., the closure of the counter) where identity collapses, regardless of context.
      *   If the **Cognitivist** is right, the identification should shift based on proximity to prototypes and be heavily influenced by noise/blur.
      *   If the **Functionalist** is right, the identification should shift based on *context* (e.g., if the surrounding letters spell "c_t", does the ambiguous mark become an 'a' more often than if it spells "d_g"?).

  **Current Science:** Empirical evidence suggests the **Cognitivist** and **Functionalist** are winning on the *recognition* front (context effects like the "word superiority effect" are robust), while the **Designer** is winning on the *production* front (type designers *do* successfully use skeletons to maintain family coherence).

  The substantive disagreement is this: **Is the "skeleton" a real constraint on recognition, or just a useful tool for design?**
  *   If the skeleton is psychologically real (e.g., Biederman's Recognition-by-Components), the Designer and Cognitivist can merge.
  *   If the skeleton is purely a cultural artifact of teaching handwriting, the Functionalist wins.

  ### 4. What Progress Looks Like

  You asked for a path forward. Argument will not work because they are defending different intuitions about *what counts as an explanation*. Progress requires changing the framework of the discussion.

  **A. The Dissolution (Conceptual)**
  Adopt a **Relational Identity Model**. Stop asking "What makes this mark an 'a'?" (intrinsic property) and start asking "Under what conditions does this mark function as an 'a'?"
  *   *Formula:* $Identity = f(Form, Context, Observer)$
  *   This validates all three: Form matters (Designer), Observer matters (Cognitivist), Context/Convention matters (Functionalist). The "impasse" dissolves because they are no longer competing for the *single* cause; they are acknowledging three variables in a function.

  **B. The Formalization (Logical)**
  Define **Identity Conditions** separately for each level.
  *   *Design Identity:* Two glyphs are identical if they can be generated by the same parametric skeleton.
  *   *Perceptual Identity:* Two glyphs are identical if they trigger the same categorization response above a threshold $T$.
  *   *Systemic Identity:* Two glyphs are identical if they map to the same code point in the orthography.
  *   *Progress:* Acknowledge that these three identities can diverge. A mark can be Systemically an 'a' (encoded as such), but Perceptually ambiguous, and Design-wise unrelated to other 'a's. Acknowledging this divergence is more honest than forcing a unification.

  **C. The Empirical Settlement (Experimental)**
  If they insist on a substantive fight, they must fight on the **Ambiguity Threshold**.
  *   Run a forced-choice identification task with morphed glyphs in varying contexts.
  *   **Hypothesis to test:** Does preserving the Designer's "skeleton" increase the Cognitivist's "categorization accuracy" in low-context situations?
  *   If yes: The Designer's skeleton is a perceptual reality (merging Camp 1 & 2).
  *   If no: The skeleton is purely a cultural convention (validating Camp 3).

  ### Summary
  Your intuition is correct: this is primarily a **category error** (different questions under one word). However, it is sticky because each camp believes their question is the *fundamental* one.

  To move forward, do not try to convince them they are wrong. Convince them they are **incomplete**. The "a-ness" they are hunting is not a property of the mark, nor the mind, nor the system alone. It is an **emergent property of the alignment between all three.**

  The honest answer is that no amount of argument will move it if they insist on a monolithic definition of "is." But if they reframe the question to "How do form, perception, and convention interact to stabilize letter identity?", they might find they are describing different facets of the same mechanism rather than competing truths.
