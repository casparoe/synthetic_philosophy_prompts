  I am applying for a one-year dissertation fellowship and need a two-page research proposal. My half-formed idea concerns infinite ethics. The literature usually treats the central puzzle as one about literally infinite populations or infinite welfare — fanaticism, the impossibility of a satisfactory aggregation, the repugnant conclusion at the limit — and traces the trouble to infinity as such. I suspect infinity is doing less work than is assumed: the same structural difficulties seem to reappear whenever the value at stake is unbounded rather than infinite, so that the real question is whether there is a principled way to decide between outcomes whose value is arbitrarily large but finite, and whether the infinite case is merely the limiting instance of a more general problem. Turn this into a proposal. State the question so that it has a determinate answer; explain why the existing positions leave it open; say what the method would be, and why a conceptual approach is the right one rather than a formal or decision-theoretic one; describe what a result would look like and what would count as failure; and give a realistic scope for twelve months, including why the project is worth a year rather than a term. Please write the proposal in British English, and do not include a bibliography or citations — I will add those myself.
