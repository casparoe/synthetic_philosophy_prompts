answer: |-
  **Project Title:** The Unbounded Finite: Reassessing the Source of Impossibility in Infinite Ethics

  **Research Question**
  The central question of this project is: *Do the impossibility results and paradoxes characteristic of infinite ethics persist in axiologies that admit arbitrarily large finite values, and does this imply that the source of the difficulty is unboundedness rather than infinity?*

  This question admits a determinate answer. Either the structural paradoxes (such as fanaticism, the inability to rank outcomes, or the repugnant conclusion) vanish when actual infinities are removed but unbounded finite values remain, or they persist. If they persist, the standard diagnosis in the literature—that infinity is the unique culprit—is false. The project aims to demonstrate the latter: that the pathologies of infinite ethics are limiting cases of problems inherent to any system permitting unbounded value.

  **Context and Existing Positions**
  Contemporary literature in population ethics and longtermism largely treats 'infinity' as a distinct mathematical monster. When standard aggregation principles yield contradictions or counter-intuitive results in infinite contexts (e.g., infinite utility streams or eternal populations), the prevailing response is to seek mathematical fixes specific to infinity. These include employing hyperreal numbers, imposing spatial or temporal restrictions to ensure finitude, or applying discount rates to render infinite sums convergent.

  These positions leave the research question open because they operate on a shared, unexamined assumption: that securing finitude secures coherence. They treat the infinite case as a categorically distinct domain requiring special handling, rather than as the limit of a finite sequence. Consequently, existing theories fail to test whether the structural difficulties arise from the *cardinality* of the population or the *magnitude* of the value at stake. By focusing on taming infinity, current approaches neglect the possibility that the underlying axiology is flawed whenever it allows value to scale without limit, regardless of whether that limit is ever reached. There is currently no systematic analysis comparing the structural behaviour of infinite axiologies against finite but unbounded axiologies to isolate the variable responsible for the impossibility results.

  **Methodology**
  The project will employ a conceptual methodology rather than a purely formal or decision-theoretic one. While formal modelling is indispensable in this field, it often obscures the normative premises at play. Decision-theoretic approaches typically begin by assuming axioms such as continuity, separability, or the Archimedean property. These axioms often bake in the very commitments that generate the paradoxes. For instance, expected utility theory presupposes that small probabilities can be traded off against large magnitudes, which predetermines the possibility of fanaticism.

  A conceptual approach is required to step back from these formalisms and analyse the structure of value itself. The method will involve:
  1.  **Reconstruction:** Reformulating standard impossibility theorems (e.g., those regarding the repugnant conclusion or infinite paralysis) without reference to actual infinities, using only arbitrarily large finite integers.
  2.  **Isomorphism Testing:** Demonstrating that the logical structure of the paradox remains invariant when the domain is restricted to the finite but unbounded.
  3.  **Axiological Diagnosis:** Evaluating whether the source of the tension lies in the aggregation mechanism or the conception of value as an unbounded quantity.

  This approach is superior for this specific question because the problem is not computational but metaphysical and normative. We are asking what kind of value structure is coherent, not merely how to calculate it. Formal tools will be used illustratively, but the argumentative weight will rest on conceptual consistency.

  **Expected Results and Failure Conditions**
  A successful outcome will consist of a rigorous demonstration that standard impossibility results survive the removal of actual infinities. The dissertation will argue that any axiology permitting unbounded finite value is vulnerable to the same structural pathologies as infinite ethics. The positive contribution will be a defence of 'bounded value' or a non-aggregative structure as the necessary condition for avoiding these paradoxes. The result will be a shift in the dialectic: rather than asking how to handle infinite populations, the field must ask whether value can coherently be unbounded.

  Failure would take two forms. First, if it can be shown that the paradoxes genuinely depend on transfinite arithmetic and dissolve in the finite unbounded case, the central hypothesis would be falsified. Second, if the conceptual analysis reveals that 'bounded value' is itself incoherent or normatively unacceptable (e.g., it implies arbitrary cut-offs that violate dominance principles), the project would fail to offer a viable alternative. In either case, the result is determinate: we will know whether infinity is the cause or merely a symptom.

  **Scope and Timeline**
  This project requires a twelve-month fellowship rather than a single term due to the depth of reconstruction required. It is not sufficient to apply existing models; the arguments must be rebuilt from the ground up to exclude infinite quantities while preserving the intuition of unboundedness.

  *   **Months 1–3:** Comprehensive review of the infinite ethics literature, focusing on isolating the specific premises that invoke infinity versus those that invoke scale. Mapping the landscape of finite but unbounded axiologies.
  *   **Months 4–6:** Developing the core argument. Reformulating key impossibility theorems in the finite unbounded domain. This involves careful logical work to ensure no hidden assumptions about infinity remain.
  *   **Months 7–9:** Stress-testing the argument against objections from longtermism and fanaticism. Engaging with the normative implications of bounded value (e.g., does it undermine the importance of existential risk mitigation?).
  *   **Months 10–12:** Writing and refinement. Integrating the chapters into a cohesive dissertation and preparing a summary article for submission.

  A term is insufficient because the conceptual shift required—moving from 'solving infinity' to 'constraining unboundedness'—requires time to mature and withstand counter-argument. The project demands not just a proof, but a philosophical reorientation of the problem space, which necessitates a sustained period of focused research and writing. This fellowship would provide the necessary time to produce a definitive treatment of the structural limits of aggregation, offering a resolution to a debate that has stalled on the false premise that finitude guarantees coherence.
