  # JOINT STATEMENT ON THE CONSTITUTION PUZZLE
  **Subject:** The Metaphysics of the Statue and the Lump
  **Signatories:** The Constitutionalist Party & The Monist Party
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  We, the undersigned, having engaged in adversarial collaboration regarding the case of the statue and the lump of clay, affirm the following points of agreement regarding the dialectical landscape:

  1.  **The Case Description:** We agree on the non-controversial physical facts: At time $t_1$, a quantity of clay ($L$) is arranged statue-wise. At time $t_2$, the clay is squashed into a ball. Prior to $t_2$, the clay and the statue occupy the same spatial region and share all material parts.
  2.  **The Exhaustive Options:** We agree that the metaphysical options regarding the status of the statue ($S$) and the lump ($L$) during the interval $[t_1, t_2]$ are exhausted by:
      *   (A) **Numerical Distinctness:** $S$ and $L$ are two numerically distinct objects that coincide spatially and temporally.
      *   (B) **Numerical Identity:** $S$ and $L$ are one and the same object, referred to by two different terms or descriptions.
  3.  **Phenomena to be Accommodated:** We agree that any viable theory must offer a coherent account of:
      *   **Persistence Conditions:** The intuition that $L$ could survive squashing, whereas $S$ could not.
      *   **Modal Properties:** The apparent truth of "Necessarily, if $S$ exists, $S$ is statue-shaped" versus "Contingently, $L$ is statue-shaped."
      *   **Truth Conditions at $t_2$:** The truth of "The lump exists" and the falsity of "The statue exists" after squashing.
  4.  **Question-Begging Moves:** We agree that the following argumentative moves are dialectically improper in this context:
      *   Asserting Leibniz's Law (the Indiscernibility of Identicals) applies to $S$ and $L$ without addressing the Monist's qualification regarding sortal-relativity or conceptual schemes.
      *   Asserting that coincidence is impossible without providing an independent argument against multi-location or constitution.
      *   Assuming that "object" is a sortal-independent count noun without defending that assumption against the claim that counting requires a principle of individuation.

  ## II. DISAGREEMENTS

  While we agree on the constraints, we diverge on the ontological conclusion. We present our respective positions below, phrased in terminology each finds acceptable.

  **The Constitutionalist Position:**
  > "There are two numerically distinct objects present in the same place at $t_1$. The lump of clay *constitutes* the statue, but is not *identical* to it. They share a microphysical base and spatial location, but they differ in their persistence conditions and modal properties *de re*. The lump has the property of *being able to survive squashing*; the statue lacks this property. Because they differ in properties, they cannot be identical. When the clay is squashed at $t_2$, the statue ceases to exist, but the lump persists. This is not a proliferation of mystery entities, but a recognition that different kinds of objects (substantial vs. artifactual) have different identity conditions."

  **The Monist Position:**
  > "There is only one object present in that place at $t_1$. 'The statue' and 'the lump' are two ways of describing, conceiving, or sorting that single object. The apparent difference in modal properties is not a difference in the object itself (*de re*), but a difference in our descriptions (*de dicto*). It is true relative to the sortal 'statue' that the object cannot survive squashing, and true relative to the sortal 'lump' that it can. However, there is only one *res* there. To say 'The statue ceased to exist' is to say that the one object no longer falls under the concept *statue*. We deny that modal properties attach to objects independently of the sortals under which they are conceived."

  ## III. CRUXES

  We identify the following sub-questions as the primary drivers of our disagreement. Settling any one of these would likely compel at least one side to revise their view. For each crux, we specify a test case or argument we agree is relevant, and we record our predictions in advance.

  **Crux 1: Composition and Identity**
  *   **Question:** Is the relation between the parts (clay particles) and the whole (statue/lump) one of identity or constitution?
  *   **Agreed Test:** The "Many-Many" Argument. If the parts are identical to the whole, then any change in parts implies the whole ceases to exist. If the parts constitute the whole, the whole can survive part replacement.
  *   **Predictions:**
      *   *Constitutionalist:* We predict the test will show that wholes have different persistence conditions than the sum of their parts, proving Composition $\neq$ Identity.
      *   *Monist:* We predict the test will show that talk of "sums of parts" is merely a manner of speaking about the one object, and strict identity holds.

  **Crux 2: Sortal-Independence of Counting**
  *   **Question:** Can objects be counted independently of a sortal concept (e.g., "How many objects are here?" vs. "How many statues are here?")?
  *   **Agreed Test:** The "Room Inventory" Case. Imagine a room with one lump-shaped statue. An alien asks, "How many objects are in the room?" Is the answer "One" or "Two"?
  *   **Predictions:**
      *   *Constitutionalist:* We predict the answer is objectively "Two," because there are two distinct bearers of properties, regardless of the alien's concepts.
      *   *Monist:* We predict the question is ill-formed without a sortal. Given a sortal, the answer is "One." There is no "bare" counting.

  **Crux 3: Grounding of Distinctness**
  *   **Question:** If $S \neq L$, what grounds this difference given they share all categorical (non-modal) properties and spatial location?
  *   **Agreed Test:** The "Modal Freezing" Argument. Imagine a world where the laws of nature fix the clay to never be squashed. In this world, $S$ and $L$ have identical modal profiles. Are they identical *there*?
  *   **Predictions:**
      *   *Constitutionalist:* We predict they remain distinct because their *essential* properties differ (origin, kind), even if accidental modal profiles align.
      *   *Monist:* We predict that if all properties (including modal) align, the motivation for distinctness vanishes, suggesting the difference was never ontological but conceptual.

  **Crux 4: Proliferation of Coincident Objects**
  *   **Question:** If $S \neq L$, does this not entail indefinitely many coincident objects (the statue, the lump, the artifact, the collection of atoms, the carbon aggregate)?
  *   **Agreed Test:** The "Arbitrary Undetached Parts" Case. Is there an object corresponding to the lump minus one atom?
  *   **Predictions:**
      *   *Constitutionalist:* We predict proliferation is avoidable via a principled restriction on which kinds support constitution (e.g., only functional kinds constitute substantial kinds).
      *   *Monist:* We predict that accepting $S \neq L$ logically forces acceptance of unlimited proliferation, which is an *reductio* of the Constitutionalist view.

  ## IV. ASSESSMENT OF VERBAL DISPUTE

  We acknowledge a significant verbal component to our disagreement, though we deny it is *merely* verbal.

  *   **The Verbal Element:** We agree that much of the dispute hinges on the usage of the term "object" and the logic of identity. The Monist uses "object" to mean "spatio-temporal continuant independent of description," while the Constitutionalist uses "object" to mean "bearer of sortal-specific persistence conditions."
  *   **The Substantive Element:** We agree the dispute is not *merely* verbal because it has downstream consequences for ethics (personhood constitution), mereology (fusion principles), and modality (essentialism). If the Constitutionalist is right, reality is richer in entities than the Monist allows. If the Monist is right, our modal intuitions require a deflationary semantic treatment.

  ## V. DRAFTER'S CONFIDENCE ASSESSMENT

  *(Note: This section is authored by the AI drafter to evaluate the fidelity of the above reconstruction.)*

  **Overall Confidence:** High (90%)
  I am highly confident that the above statement accurately captures the standard dialectical positions in contemporary analytic metaphysics regarding material constitution (specifically the debate between defenders of the Constitution View like Lynne Rudder Baker and Monists/Identitarians like Trenton Merricks or E.J. Lowe).

  **Least Sure Formulation:**
  I am least confident in the **Monist's formulation of Modal Properties** in Section II.
  *   *Reasoning:* There are multiple species of Monism (e.g., Dominant Sorts, Relative Identity, Deflationary Conceptualism). I have selected the "Deflationary Conceptualist" approach ("described in two ways") as requested by the prompt. However, capturing the Monist's denial of *de re* modality without making them sound like an error theorist is difficult. Some Monists accept *de re* modality but argue the statue and lump share the same modal profile (denying the intuition that the statue cannot survive squashing). I have prioritized the "described in two ways" instruction, which leans toward conceptualism, but this may slightly underrepresent Monists who are robust realists about modality but deny coincidence.

  **Verbal Dispute Judgment:**
  As requested in the instructions, I have included the assessment in Section IV. My judgment, reflected there, is that the dispute is **partially verbal but substantively consequential**. The term "object" is the primary locus of verbal disagreement, but the disagreement over whether reality contains one truth-maker or two for the propositions involved is substantive.
