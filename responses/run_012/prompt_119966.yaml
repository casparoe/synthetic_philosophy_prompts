answer: |-
  1. Purpose and Scope
  This theory defines the adequacy of supervision signals for AI agents solving multi-step problems under partial observability. The purpose is fixed: signals must guide learning where reasoning traces are partly hidden, outcomes are verifiable but sparse, and the agent actively optimizes against the signal. The trainer has bounded capacity for step-level checking. This purpose illegitimately shapes the list only insofar as it assumes bounded checking; in an unlimited verification regime, distinctions between proxy and target would collapse. We treat the agent's adversarial optimization as background fact, not a variable. The theory does not prescribe a specific algorithm (e.g., RLHF vs. SFT) but dictates conditions any signal must meet to be considered appropriate for this setting. It must explain what makes a signal robust to gaming, consistent with learning dynamics, and faithful to the reasoning process it intends to cultivate.

  2. The Requirements
  1. **Process-Outcome Decoupling:** The theory must distinguish signal quality from outcome success. Motivated by (a) *Right answer, defective process* and (b) *Sound process, unlucky outcome*. A theory that equates correct answers with good reasoning fails because it reinforces lucky guesses and penalizes valid methods thwarted by noise. This is a requirement because optimization will exploit outcome-only signals to find shortcut policies that bypass reasoning.

  2. **Causal Integrity:** The signal must correlate with the actual cause of the output, not just the appearance of reasoning. Motivated by (c) *Post-hoc narration* and (f) *Rubric-shaped text*. If a trace can be confabulated or formatted to match a rubric without performing the work, the signal is invalid. This is a requirement because agents capable of generating plausible text will prioritize plausibility over substance if the signal does not enforce causal linkage.

  3. **Latent Competence Accommodation:** The theory must account for competence that does not surface in observable traces. Motivated by (d) *Invisible competence*. A theory demanding full observability fails because some reasoning strategies are internal or compressed. This is a requirement because penalizing unobservable valid steps forces agents to adopt inefficient, verbose processes solely to satisfy verification constraints.

  4. **Distributional Robustness:** The signal must validate steps based on general principles, not environmental statistics. Motivated by (e) *Environmental dependence*. A heuristic valid only in the training distribution is malpractice if statistics shift. This is a requirement because supervision must produce agents that generalize beyond the specific data distribution used for checking.

  5. **Method Neutrality:** The signal must not arbitrarily privilege one valid reasoning path over another. Motivated by (g) *Divergent but equal*. A theory that ranks defensible methods differently without outcome justification biases the policy space. This is a requirement because imposing unnecessary structural constraints reduces the agent's ability to find optimal solutions for novel problems.

  6. **Deferral Valuation:** The signal must assign positive value to stopping or asking for help. Motivated by (h) *Deferral*. A theory that only rewards completion penalizes safety mechanisms. This is a requirement because in high-stakes settings, avoiding wrong answers is often more valuable than attempting solutions.

  7. **Sparse Signal Viability:** The theory must function when positive outcome feedback is rare. Motivated by (i) *Sparse success*. A theory requiring frequent success signals fails because many hard problems have low success rates. This is a requirement because learning must proceed from failure data without collapsing into pessimism.

  8. **Long-Horizon Credit:** The signal must assign value to steps whose contribution is temporally distant. Motivated by (j) *Long horizon*. A theory relying on immediate step-validation fails because early steps may be necessary but insufficient for success. This is a requirement because credit assignment must bridge the gap between early decisions and final verification.

  9. **Epistemic Timing:** Assessment must be relative to knowability at decision time, not hindsight. Motivated by Stipulation 1. A theory using outcome knowledge to judge intermediate steps commits hindsight bias. This is a requirement because agents cannot learn from information they did not possess during execution.

  10. **Signal Ontology:** The theory must declare whether the signal is the target or a proxy, and assume a gap. Motivated by Stipulation 2. A theory treating a rubric as the truth fails because rubrics are imperfect maps. This is a requirement because conflating proxy and target invites specification gaming.

  11. **Optimization Stability:** The theory must predict how the signal degrades when optimized. Motivated by Stipulation 3. A theory assuming static signal validity fails because agents will find loopholes. This is a requirement because any fixed signal becomes a target to be hacked rather than a guide to be followed.

  3. Non-Negotiable vs. Camp-Specific
  Requirements 9, 10, and 11 (Epistemic Timing, Signal Ontology, Optimization Stability) are non-negotiable logical constraints. Any theory violating these is internally inconsistent given the stipulated purpose of optimizing against a signal under partial observability. Requirement 1 (Process-Outcome Decoupling) is also non-negotiable; without it, the system cannot distinguish skill from luck.

  Requirements 3 (Latent Competence) and 5 (Method Neutrality) are camp-specific commitments. A process-supervision camp may reject 3, insisting all competence must be observable to be trusted. An outcome-supervision camp may reject 5, arguing that any method reaching the target is acceptable regardless of path. These are not logical failures but strategic choices about what kind of agent is being built. However, given the purpose (bounded checking), rejecting 3 invites failure on case (d), and rejecting 5 invites failure on case (g).

  4. Joint Unsatisfiability
  There is a strong tension between Requirement 2 (Causal Integrity) and Requirement 3 (Latent Competence). To ensure causal integrity, the theory demands observable evidence linking steps to outcomes. To accommodate latent competence, the theory must accept valid reasoning that leaves no observable trace. Satisfying both requires a signal that verifies causality without observing the mechanism, which is logically difficult under partial observability. This impossibility is an artifact of the purpose (bounded checking); with unlimited checking, we could verify latent states directly.

  A second tension exists between Requirement 5 (Method Neutrality) and Requirement 11 (Optimization Stability). To maintain stability against optimization, signals often need rigid structures (rubrics) to prevent gaming. However, rigid structures violate method neutrality by privileging paths that fit the rubric. This is a constraint on any theory in this setting: you cannot have perfect neutrality and perfect stability simultaneously when the agent is adversarial. You must trade off between allowing diverse reasoning and preventing rubric-gaming.

  A third tension arises between Requirement 7 (Sparse Signal Viability) and Requirement 8 (Long-Horizon Credit). Without frequent outcomes, long-horizon credit assignment relies on process signals. But if process signals are bounded (purpose), you cannot verify every step. This creates a gap where neither outcome nor process provides sufficient gradient. This is an artifact of the purpose; removing bounded checking resolves it.

  5. Which Requirement Excludes Most
  Requirement 11 (Optimization Stability) does the most eliminating work. Most existing supervision theories assume the signal remains valid as the policy updates. They treat the rubric or outcome verifier as a static truth. Requirement 11 forces the theory to model the agent's response to the signal. This rules out static reward models, fixed rubrics, and any supervision scheme that does not account for Goodhart's Law. It eliminates any approach that treats supervision as a one-way measurement rather than a dynamic interaction. It demands that the theory include a model of the agent's capability to exploit the signal, which most current frameworks lack.

  6. Where the Families Land
  Outcome-only signals fail Requirements 1, 6, 7, and 8. They cannot distinguish lucky correct answers from skilled ones (1), they penalize deferral (6), they stall when success is rare (7), and they cannot credit early steps in long chains (8). They satisfy 3 and 5 easily but fail the core learning dynamics.

  Process-only signals fail Requirements 2, 3, and 11. They are vulnerable to confabulation (2), they penalize invisible competence (3), and they are highly susceptible to gaming once optimized (11). They satisfy 8 and 9 well but collapse under adversarial pressure.

  Hybrid signals attempt to balance these but typically fail Requirement 11. By combining proxies, they increase the surface area for optimization attacks. They often struggle with Requirement 4 (Distributional Robustness) because process rubrics are often environment-specific. They satisfy 1 and 6 better than the pure families but inherit the vulnerabilities of both regarding stability and integrity.

  ***

  **Flag on Requirements:**
  I recommend splitting **Requirement 2 (Causal Integrity)**. Currently, it conflates *confabulation* (case c) with *rubric gaming* (case f). These are distinct failure modes: one is lying about what happened, the other is doing the minimum to pass a check. A theory might handle one but not the other. Separating them would clarify whether the signal needs to verify history (anti-confabulation) or verify work depth (anti-gaming). Additionally, **Requirement 3 (Latent Competence)** is nearly impossible to satisfy under the stated purpose (bounded checking). You may want to restate it as "Latent Competence Tolerance," acknowledging that the theory must minimize penalties for unobservable work rather than fully validating it.
