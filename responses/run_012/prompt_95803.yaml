answer: |-
  Your intuition is spot on. Your friend has stumbled upon one of the most famous puzzles in the philosophy of mind, often called the **Static and Dynamic Paradoxes of Self-Deception**. This argument was popularized in analytic philosophy circles (by people like Jean-Paul Sartre in *Being and Nothingness*, and later debated by Donald Davidson and Alfred Mele).

  However, your friend is presenting a "straw man" version of self-deception (the naive model) and then declaring victory when he knocks it down. Most contemporary philosophers and psychologists agree that the *naive* model is incoherent, but they disagree that the *phenomenon* doesn't exist.

  Here is a claim-by-claim breakdown of what experts would nod at, what they would fight, and where your friend is smuggling in extra assumptions.

  ### Part 1: Claim-by-Claim Breakdown

  #### Claim 1: "To deceive yourself you'd have to know the truth and hide it from yourself... believing P and not-P at once."
  *   **The Philosophical Status:** This is the **Static Paradox**.
  *   **What Experts Agree With:** You cannot consciously, occurrently believe "I am dying" and "I am not dying" at the exact same moment. That *is* logically impossible.
  *   **What Experts Push Back On:** This assumes self-deception requires **conscious knowledge** of the truth. Most modern accounts (like the "Deflationary Account" by Alfred Mele) argue that the self-deceiver does *not* need to consciously know the truth. Instead, they possess the *evidence* for the truth but manipulate how they process it.
      *   *Example:* I don't need to know "My spouse is cheating" while believing "My spouse is faithful." I just need to possess the text messages (evidence) but categorize them as "work stress" (reinterpretation) and avoid asking questions (avoidance).
      *   *Verdict:* **Mistaken.** He is attacking a cartoon version of self-deception that requires simultaneous contradictory conscious beliefs.

  #### Claim 2: "The only escape is to split the mind into two agents... that's just parking a little person inside your head."
  *   **The Philosophical Status:** This is the **Dynamic Paradox** (or the Homunculus Objection).
  *   **What Experts Agree With:** You are right to be suspicious of a "little man" (homunculus) inside the brain pulling levers. That explains nothing; it just pushes the problem back a step.
  *   **What Experts Push Back On:** Rejecting the "little person" doesn't mean rejecting mental partitioning. Cognitive science supports the idea that the mind is **modular**. We have implicit beliefs (unconscious) and explicit beliefs (conscious). We have emotional systems and rationalizing systems.
      *   *The Mechanism:* Self-deception doesn't require a "Liar Agent." It requires a **motivated bias in evidence gathering**. If my desire to be healthy makes me scan for good news and filter out bad news, I don't need a "liar." I just need a cognitive system that is weighted by desire.
      *   *Verdict:* **Partially Right, but Overextended.** He is right that a "split agent" model is clunky, but wrong that it's the *only* alternative to the Static Paradox.

  #### Claim 3: "What we call it is really wishful thinking or motivated reasoning, a bias rather than deception."
  *   **The Philosophical Status:** This is the **Deflationary Account**.
  *   **What Experts Agree With:** This is actually a very respectable philosophical position. Alfred Mele, a leading philosopher on this topic, argues exactly this: self-deception is not *intentional* lying to oneself; it is *motivated* belief formation.
  *   **What Experts Push Back On:** Many philosophers argue that calling it "just bias" strips the concept of its moral and psychological weight. "Bias" sounds like a glitch; "Deception" implies a strategy (even if unconscious) to evade a threatening truth.
      *   *The Pushback:* If I ignore evidence *because* it is threatening, that is functionally different from just making a random cognitive error. The *motivation* is doing the work.
      *   *Verdict:* **Respectable, but not definitive.** This is a live debate, not a settled fact.

  #### Claim 4: "Since the deception part is doing no work, we should drop the whole notion."
  *   **The Philosophical Status:** This is a **Pragmatic Claim**.
  *   **What Experts Agree With:** If "deception" implies "conscious intent," then yes, drop the word.
  *   **What Experts Push Back On:** This is where he is smuggling. He is defining "deception" as "conscious lying." But in ethics and psychology, we often use "deception" to describe the *outcome* and the *function*, not just the conscious intent.
      *   *Analogy:* If I say "Digestion doesn't exist, it's just chemical breakdown," I'm being technically precise but practically unhelpful. "Digestion" captures a functional process. Similarly, "Self-Deception" captures the specific process of *protecting a belief from evidence due to emotional investment.*
      *   *Verdict:* **Mistaken.** This is a semantic stipulation, not a logical conclusion.

  ---

  ### Part 2: The "Bias vs. Deception" Move

  You asked: *Does his last move ('so it's just bias, not deception') actually follow from the rest, or is he smuggling in a whole extra view?*

  **He is absolutely smuggling in an extra view.**

  Here is the trick he is pulling:
  1.  **Premise:** Deception requires conscious intent to mislead (The "Liar" model).
  2.  **Observation:** Humans don't have conscious intent to mislead themselves (because of the Paradoxes).
  3.  **Conclusion:** Therefore, it isn't deception.

  **The Smuggle:** Premise 1 is the smuggled assumption. Why must deception require *conscious* intent?
  In law and ethics, we have concepts like "willful ignorance" or "negligent deception." If I deliberately avoid reading the terms of service so I can claim I didn't know them, I am deceiving myself about my knowledge, even if I don't consciously think "I am now deceiving myself."

  By redefining deception as *only* conscious lying, he makes the term impossible by definition. But if we define deception functionally—**the production of a false belief driven by the desire to avoid a painful truth**—then "motivated reasoning" *is* a form of self-deception.

  He isn't discovering that self-deception doesn't exist; he is discovering that **Intentional Self-Deception** doesn't exist, and then pretending that was the only kind there ever was.

  ---

  ### Part 3: The Concrete Case (The Dying Man)

  Let's apply this to the guy planning his next decade while clearly dying.

  **Your Friend's View (It's just Bias):**
  The man processes evidence optimistically. When the doctor says "6 months," his brain hears "6 to 12, maybe more." He focuses on the one case study of survival he read on WebMD. This is a cognitive error caused by fear. He isn't "deceiving" himself; he is just biased.
  *   *Implication:* It's a passive glitch. We shouldn't judge him for it.

  **The "Respectable Self-Deception" View:**
  The man is actively engaging in **strategies of avoidance**.
  1.  **Evidence Gathering:** He only reads articles about miracle cures.
  2.  **Attention:** He changes the subject when hospice is mentioned.
  3.  **Interpretation:** He interprets pain as "healing crises" rather than disease progression.

  **Why the term "Self-Deception" matters here:**
  If we call it "bias," it sounds like he can't help it (like a colorblind person seeing the wrong color). If we call it "self-deception," it acknowledges that there is a **conflict**. There is a part of him that *knows* (implicitly) he is dying, and a part of him that is *working* to suppress that knowledge.

  The term "self-deception" preserves the **agency** involved in the evasion. It explains why, if you corner him with hard data, he might get angry or distressed. A mere bias doesn't get defensive; a deception gets defensive because the truth is threatening.

  ### Summary for your argument

  You can tell your friend:
  1.  **You won the battle, not the war.** You proved that *conscious, intentional* self-lying is impossible. Philosophers agree with you there.
  2.  **You lost the phenomenon.** You haven't proven that people don't hold false beliefs *because* they are motivated to avoid the truth. That mechanism (motivated reasoning) is real.
  3.  **The Definition Trap.** You are defining "deception" so narrowly (must be conscious) that it excludes the very thing we are trying to describe. If I lock the door to avoid seeing a bill, I am deceiving myself about the bill's presence, even if I don't consciously think "I am locking this door to deceive myself."
  4.  **The Dying Man.** Calling it "bias" misses the active struggle. He isn't just mistakenly optimistic; he is *maintaining* optimism against the weight of evidence. That maintenance is the "deception."

  **Verdict:** His argument is a classic "intro to philosophy" move. It's logically tidy, but it fails to capture the messy reality of human psychology. The term "self-deception" is still useful, provided we understand it as **motivated avoidance of truth** rather than **conscious lying to oneself.**
