  **4.5 Prohibition of Implicature**
  To prevent evasion of the Knowledge Standard, conversational implicature is forbidden. Employees may not state $p$ with the intention of implying $q$ unless they also know $q$ and assert $q$ directly. For example, stating "It is cold in this room" to imply "Close the window" is a violation if the employee does not explicitly assert the request. All communicative intent must be made explicit to facilitate auditing. Indirectness is viewed as an attempt to bypass evidentiary review. If you know the window should be closed, assert that the window should be closed.

