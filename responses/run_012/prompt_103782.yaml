  **OFFICE OF ASSERTION COMPLIANCE**
  **EMPLOYEE HANDBOOK: SECTION 4.0**
  **STANDARDS OF COMMUNICATIVE CONDUCT**

  *4.1 The Knowledge Standard*
  All employees are hereby notified that the firm operates under the Knowledge Norm of Assertion. An employee may assert a proposition $p$ only if the employee knows $p$. For the purposes of this policy, an "assertion" is defined as any utterance, written or spoken, that presents a proposition as fact. Speculation, guessing, and hopeful thinking are strictly prohibited in all client-facing and internal communications.

  *4.2 Legacy Norms and Departmental Exceptions*
  Employees should be aware that previous regulatory frameworks remain in limited effect as legacy residues. The Marketing Department continues to operate under the Truth Norm, wherein statements must merely be true, regardless of the speaker's epistemic position. The Sales Floor is granted a concession to the Belief Norm, permitting assertions based on sincere conviction alone. Finally, the Finance Division, regarding expenses claims, operates under the Justification Norm, requiring only that the speaker possess adequate evidence. Employees transferred from these divisions must undergo retraining to meet the Knowledge Standard. Reliance on legacy norms constitutes a Class B Compliance Violation.

  *4.3 Evidentiary Audit and Verification*
  Compliance Officers cannot directly observe knowledge states. Therefore, audits will proceed by examining the employee's evidentiary log. To demonstrate compliance with 4.1, the employee must produce documentation showing that their belief was formed via a reliable process, is true, and is supported by sufficient evidence. Please note: the presence of sufficient evidence is treated as operational proof of knowledge. If the evidence exists, the knowledge is presumed. Employees are reminded that lucky guesses supported by data are compliant; unlucky truths without data are not.

  *4.4 Hedging and Safe Harbors*
  Employees unsure of their epistemic position may utilize safe-harbor phrasing. Prefacing a statement with "I think," "I believe," or "In my opinion" converts the utterance from an assertion into a report of a mental state. Such reports are not subject to the Knowledge Standard, as one cannot be wrong about one's own beliefs. However, employees are advised that excessive hedging may impede workflow. The Office of Assertion Compliance does not guarantee the utility of safe-harbor statements, only their compliance.

  *4.5 Prohibition of Implicature*
  To prevent evasion of the Knowledge Standard, conversational implicature is forbidden. Employees may not state $p$ with the intention of implying $q$ unless they also know $q$ and assert $q$ directly. For example, stating "It is cold in this room" to imply "Close the window" is a violation if the employee does not explicitly assert the request. All communicative intent must be made explicit to facilitate auditing. Indirectness is viewed as an attempt to bypass evidentiary review.

  *4.6 Grievance Procedures and Testimonial Chains*
  Two specific grievance categories require clarification. First, regarding admissions of ignorance: An employee disciplined for stating "The shipment has arrived" while admitting "I do not know this" has been correctly disciplined. The admission nullifies the assertion. Second, regarding testimonial transmission: If Employee A knows $p$ and tells Employee B, Employee B does not automatically know $p$. Employee B must verify $p$ independently to assert it. Repeating information solely on the authority of a colleague is classified as hearsay and violates 4.1. Employees unable to verify upstream information must remain silent or utilize the safe-harbor provisions in 4.4.

  *4.7 Acknowledgement*
  By signing below, you acknowledge that you understand what you know, and that you know what you understand.

