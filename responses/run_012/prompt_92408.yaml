answer: |-
  # Activity: The Attribute Swap Market

  **Goal:** To embody the cost of cyclic preferences through sequential, fee-based trades, contrasting myopic decision-making with resolute planning.
  **Time:** 75 Minutes
  **Participants:** 16 Undergraduates
  **Term Ban:** Do not use the phrase "Money Pump," "Dutch Book," or "Cyclic Preference" until the Debrief (Minute 50).

  ## 1. Materials & Stakes

  *   **The Goods:** 16 Sets of three distinct cards (Red, Blue, Green).
      *   *Red Card:* **"The Anchor"** (Text: *High Stability, Low Flexibility*)
      *   *Blue Card:* **"The Sprint"** (Text: *High Speed, Low Comfort*)
      *   *Green Card:* **"The Cushion"** (Text: *High Comfort, Low Stability*)
      *   *Note:* These attributes are deliberately incommensurable to encourage context-dependent ranking.
  *   **The Currency:** 80 Raffle Tickets (cut slips of paper).
      *   *Stake:* At the end of class, draw one ticket from the pool of tickets *remaining in students' hands*. The winner gets a $20 coffee card or a "Homework Pass" (your choice).
      *   *Why:* This makes the tickets valuable but avoids real-money accounting. Losing a ticket feels like losing a chance to win.
  *   **The Ledger:** A whiteboard column to track the "Market Fee."
  *   **Commitment Cards:** 16 small index cards for Round 2.

  ## 2. Timeline & Script

  ### Phase 1: Setup (00:00 – 00:10)
  *   **Distribution:** Give each student 1 Red Card and 5 Raffle Tickets.
  *   **The Rules:**
      1.  You hold one Good (Card) and some Wealth (Tickets).
      2.  I (the Instructor) am the Market Maker. I will offer trades sequentially.
      3.  **The Fee:** To swap your current Good for a new one, you must pay me **1 Ticket**.
      4.  You may refuse any trade.
      5.  At the end, you keep your final Good and remaining Tickets.
  *   **The Hook:** "Different goods suit different needs. I will describe the current 'Market Context' before each offer. Listen closely."

  ### Phase 2: Round 1 — The Myopic Run (00:10 – 00:25)
  *   **Instruction:** "Make the decision that is best for you *right now*, given the current context. Do not worry about future trades. Optimize for the present moment."
  *   **Trade 1 (Red → Blue):**
      *   *Pitch:* "Context: **Urgency.** You have a deadline tomorrow. Stability doesn't matter; you need raw output."
      *   *Offer:* "Swap Red for Blue. Cost: 1 Ticket."
      *   *Logic:* In an urgency frame, Speed (Blue) > Stability (Red). Most will swap.
  *   **Trade 2 (Blue → Green):**
      *   *Pitch:* "Context: **Endurance.** You have a week-long marathon ahead. Speed burns you out; you need sustainability."
      *   *Offer:* "Swap Blue for Green. Cost: 1 Ticket."
      *   *Logic:* In an endurance frame, Comfort (Green) > Speed (Blue). Most will swap.
  *   **Trade 3 (Green → Red):**
      *   *Pitch:* "Context: **Security.** The environment is volatile. Comfort is a luxury; you need to ensure you don't crash."
      *   *Offer:* "Swap Green for Red. Cost: 1 Ticket."
      *   *Logic:* In a security frame, Stability (Red) > Comfort (Green). Most will swap.
  *   **The Reveal:**
      *   Ask students to hold up their final Card (should be Red, same as start).
      *   Ask students to count their remaining Tickets (should be 2, down from 5).
      *   **Collect the Fees:** Walk around and physically take the 3 tickets from those who traded all three times. Let them feel the handover.

  ### Phase 3: The Shock & Reset (00:25 – 00:35)
  *   **Count:** Ask: "Who ended with the same card they started but fewer tickets?" (Expect a show of hands).
  *   **Question:** "Did anyone feel irrational during the trades?" (Usually no—they felt rational *at each step*).
  *   **Reset:** Return everyone to 5 Tickets and 1 Red Card.
  *   **New Rule:** "We run the market again. Same offers, same fees. But you now have two new tools."
      1.  **Transparency:** I will reveal the full schedule of three trades *before* we begin.
      2.  **Commitment:** You may write a rule on this Index Card (e.g., 'Never trade' or 'Trade only once') and bind yourself to it. If you write a plan, you cannot deviate during the trading phase.

  ### Phase 4: Round 2 — The Resolute Run (00:35 – 00:50)
  *   **Planning:** Give them 5 minutes to see the schedule (Urgency → Endurance → Security) and write their Commitment Card.
  *   **Execution:** Run the exact same three trades as Round 1.
  *   **Enforcement:** If a student wrote "No Trades," they cannot trade even if they raise their hand.
  *   **Result:** Most will keep their 5 Tickets. Some might trade once (if they value the specific switch enough to pay the cost), but the cycle is broken.

  ### Phase 5: The Debrief (00:50 – 01:15)
  *   **Introduce the Term:** "What you experienced in Round 1 is a **Money Pump**."
  *   **Map the Experience to the Argument:**

  | Moment in Activity | Philosophical Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Round 1 Trades** | **Local Rationality.** At each step, the trade maximized utility given the *current* frame (Urgency, Endurance, Security). | "Was it irrational to accept Trade 1? Trade 2? Trade 3?" (Students will say no). |
  | **Round 1 Outcome** | **Global Irrationality.** The sequence leaves you worse off (same state, less wealth) than if you had done nothing. | "If every step was rational, how did the outcome become irrational?" |
  | **The Fee** | **Exploitability.** The Market Maker (me) extracted value without providing net benefit. | "If I offered this cycle repeatedly, would you go bankrupt?" |
  | **Round 2 Plan** | **Resoluteness / Commitment.** Foreseeing the cycle allows you to bind your future self. | "Did the plan change your *preferences* or just your *actions*?" |
  | **Round 2 Transparency** | **Information.** Knowing the schedule allowed you to see the cycle. | "Is ignorance the problem, or is the preference structure the problem?" |

  *   **The Core Debate:**
      *   *View A (Standard):* Cyclic preferences are irrational. You *should* have transitive preferences (Stability > Comfort > Speed > Stability is impossible).
      *   *View B (Myopia):* Preferences can be context-dependent (cyclic), but rational agents must be **resolute**. The failure wasn't the cycle; it was the failure to plan.
      *   *Prompt for Students:* "If I change the context every time (Urgency vs. Security), is it wrong to change your mind? Or is it wrong to pay to do it?"

  ## 3. Predicted Failures & Mitigation

  1.  **Status Quo Bias (No one trades):**
      *   *Risk:* Students refuse to trade in Round 1, preserving their tickets. The pump fails.
      *   *Mitigation:* During the pitch, emphasize the *pain* of the current context. "If you keep Red during Urgency, you will fail." Use tone to induce anxiety about the current holding.
  2.  **The "Spotter" (One student ruins it):**
      *   *Risk:* One student shouts "It's a cycle!" in Round 1.
      *   *Mitigation:* Pre-empt this. "Please do not discuss strategy with neighbors. This is an individual market." If shouted, acknowledge: "Interesting hypothesis. Let's see if the data supports it by the end."
  3.  **Ticket Apathy:**
      *   *Risk:* Students don't care about the raffle.
      *   *Mitigation:* Make the prize visible on the desk. Remind them twice that the draw is based on *remaining* tickets.
  4.  **Commitment Cheating (Round 2):**
      *   *Risk:* Students ignore their Index Card.
      *   *Mitigation:* Collect the Index Cards *before* Round 2 starts. You hold their commitment. If their action contradicts the card, invalidate the trade.

  ## 4. Limitations (The Instructor's Burden)

  This activity cannot reproduce the following, and you must supply these points verbally in the debrief:

  1.  **True Preference vs. Framing:**
      *   *Limitation:* The cycle was induced by *changing the context* (Urgency vs. Security), not by stable intransitive preferences. A strict philosopher might argue this isn't a true money pump because the goods weren't identical in each step (Red-in-Urgency ≠ Red-in-Security).
      *   *Your Load:* You must explain that the Money Pump argument usually assumes *stable* preferences. Ask: "If your preferences shift with context, are you still exploitable? Yes, if you don't anticipate the shift."
  2.  **Real Wealth:**
      *   *Limitation:* Raffle tickets are low-stakes. Losing 3 tickets doesn't hurt like losing $300.
      *   *Your Load:* Ask them to imagine the tickets represent hours of life or significant currency. "Scale this up. If the fee was 10% of your net worth per swap, would you have traded?"
  3.  **The "Why" of the Fix:**
      *   *Limitation:* Round 2 shows *that* planning works, not *why* it is rationally required.
      *   *Your Load:* Push the debate: "Is planning just a trick to stop the pain, or is Resoluteness a requirement of Rational Agency? If you know you will regret a choice in 5 minutes, are you allowed to make it now?"

  ## 5. Closing the Session

  End with the prompt's core tension on the board:
  **"Does the pump prove our preferences must be straight lines (Transitive)? Or does it prove we must be the kind of creatures who can tie ourselves to the mast (Resolute)?"**

  Dismiss class only after they have argued this specific binary.
