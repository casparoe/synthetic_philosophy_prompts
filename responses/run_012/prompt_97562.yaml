answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board Members
  **FROM:** Chair, REB
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Behavioral Medicine Study #2023-44 (Diabetes Adherence)

  **Recommendation**
  I recommend **Approval with Conditions**. While the scientific merit is substantial, the current protocol poses unacceptable risks regarding undue influence and psychological harm. Approval is contingent on specific modifications outlined below, to be implemented within 14 days.

  **Case Summary**
  The proposed study examines Type 2 diabetes adherence via daily text messages. Participants are not informed that messages are randomized to include guilt-inducing language. Consent forms describe the study broadly as "day-to-day condition management." Recruitment occurs via patients' own treating clinicians during routine care. Two participants have already withdrawn following complaints about the message content.

  **Argument for Approval (The Research Team's Position)**
  We must accord the research team's position its strongest weight. Their argument rests on the necessity of ecological validity. In behavioral science, if participants know they are being subjected to psychological framing (specifically guilt), they will either refuse enrollment or alter their adherence behaviors specifically to resist the framing. This renders the data useless. 

  Furthermore, the risk profile is arguably minimal. Patients receive standard care regardless of enrollment; the intervention is merely a text message. Regarding the two withdrawals, one board member correctly notes that consent is a contractual moment. Once signed, retrospective discomfort does not necessarily invalidate the initial agreement. To demand full disclosure here is to privilege individual autonomy over potential population-level benefits derived from improved adherence strategies. If we reject deception in all cases where it impacts validity, we halt significant behavioral research.

  **Ethical Concerns and Policy Conflicts**
  However, "consent is consent" is insufficient when the consent is not *informed*. A signature does not waive the right to know material risks. Guilt induction is a psychological stressor. For patients already struggling with chronic disease management, framing non-adherence as a moral failing ("letting yourself down") carries risk of exacerbating distress.

  The recruitment strategy is equally problematic. Having treating clinicians recruit their own patients creates a power imbalance where patients may fear that refusing research participation will jeopardize their clinical care. This is borderline undue influence.

  Our current policy creates significant friction here. Clause A suggests consent is invalid if the *actual* participant would have refused had they known the truth. Clause B permits deception if risk is minimal and validity is threatened. These clauses are in tension. Clause A implies a subjective standard (this specific patient), while Clause B implies an objective risk assessment. Currently, the policy is incoherent on whether we judge based on the "reasonable patient" or the "actual patient." We cannot paper over this. If we adopt the "reasonable patient" standard, would a reasonable person refuse a guilt text? Perhaps not. But given the complaints, we cannot assume indifference.

  **Conditions for Approval**
  To proceed, the following conditions must be met:

  1.  **Recruitment Modification:** Patients cannot be recruited by their own treating clinicians. Recruitment must be handled by independent research staff or clinicians not involved in the patient's direct care. This mitigates undue influence.
  2.  **Debriefing Protocol:** A robust debriefing process must be implemented immediately upon study completion (or withdrawal). Participants must be informed of the deception, the rationale, and provided resources for psychological support if the messages caused distress.
  3.  **Consent Clarification:** The consent form must be revised to state that messages may include "various behavioral framing techniques," without specifying guilt. This narrows the deception gap without destroying validity.
  4.  **Policy Review:** I am initiating a sub-committee review of our deception policy clauses. The conflict between subjective refusal standards and objective risk minimization needs resolution before similar cases arise.

  **Bottom Line**
  We cannot approve the protocol as submitted. The recruitment method is coercive, and the lack of debriefing ignores the psychological impact of the intervention. However, rejecting the study outright disregards the genuine scientific necessity of blinding in behavioral trials.

  The research team has **14 days** to submit revised documentation addressing the recruitment and debriefing conditions. Once verified by the Chair, the study may commence without further full-board review.

  Please come to Tuesday's meeting prepared to vote on this conditional approval.
