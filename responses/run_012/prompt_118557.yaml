answer: |-
  This is a fantastic line of inquiry. You are effectively asking for an ontology of networked play. Most people treat netcode as a plumbing issue; you're treating it as a metaphysical constraint.

  You are right to suspect this is the old Appearance/Reality distinction, but it is not *just* that. It is specifically a problem of **Temporal Ontology** (what counts as the past?) and **Causal Authority** (which state generates consequences?).

  Here is a breakdown of what rollback netcode presupposes, where it breaks, and where you might be over-indexing on the dualism.

  ### 1. Authority and the "Privileged Description"

  You ask if authoritative-server-plus-rollback *requires* a privileged description of the world (Realism) or if it could fit a view where all states are equally real (Relativism/Constructivism).

  **The Engineering Reality:**
  Rollback netcode (like GGPO) actually often runs peer-to-peer, not necessarily on a central server. However, it *does* require a **Deterministic Lockstep** model. Both machines run the same simulation logic. If Player A inputs "Jab" at frame 10, and Player B's machine predicts "Block" at frame 10, but the packet arrives at frame 12 showing "Jab," Player B's machine must delete frames 10–12 and re-simulate them.

  **The Metaphysical Implication:**
  This setup enforces **Simulation Realism**.
  It posits that there is a "God's Eye View" of the match state (the sequence of inputs + the deterministic logic) that is ontologically superior to the rendered pixels on your screen.
  *   **The Render:** Epiphenomenal. It is a shadow on the cave wall. It has no causal power.
  *   **The Simulation State:** Noumenal. It is the thing-in-itself. It dictates health bars, win states, and frame data.

  **Does it rule out Relativism?**
  Yes. It rules out the idea that "what happened for me is true for me." In a client-authoritative shooter (like early *Call of Duty*), you can shoot someone around a corner because, on your machine, they were there. That is a form of localized truth. Rollback fighting games explicitly reject this. They say: *"Your truth was an error. The Consensus Truth is the only Truth."*

  If you tried to apply a relativist metaphysics to rollback (i.e., "My screen showed a hit, so a hit happened in my reality"), the game would break. The health bars would desync, the round would end differently on each screen, and the "match" would cease to exist as a shared object. Therefore, the practice **requires** a single, privileged timeline to function as a competitive sport. It presupposes that the virtual world has a single, objective history, even if our access to it is laggy.

  ### 2. Replays as Recipes (Determinism vs. History)

  You note that replays are input logs, not video. If the game is patched (physics tweaked, hitboxes moved), the replay plays back differently.

  **The Metaphysical Implication:**
  This suggests that a match is not a **Historical Event** (like a football game or a concert) but a **Mathematical Proof**.
  *   **Historical Event:** Once it happens, it is fixed in spacetime. A recording captures light waves that bounced off real objects.
  *   **Mathematical Proof:** $2 + 2 = 4$. If you change the definition of $2$, the result changes.

  In fighting games, the "fact of the matter" is indexed to the **Version State**.
  *   *Fact:* "Player A won."
  *   *Condition:* "...in Version 1.02."

  Does this break the idea of a fact of the matter? No, but it makes the fact **context-dependent**. It implies that the virtual world is not a place you visit, but a **function you execute**.
  $Match = f(Inputs, Engine\_Version)$

  If you patch the engine, you aren't changing the record of the past; you are running a *different function*. This aligns with a **Formalist** theory of virtual objects. The object *is* the code. If the code changes, the object is technically different. So, the "fact of the matter" remains stable, provided you include the software version as part of the coordinate system of the fact.

  ### 3. The Harm of the Rolled-Back Jab

  This is the most compelling ethical/phenomenological question. You flinched. Your heart rate spiked. You altered your strategy. Then the game said, "Just kidding, that never happened."

  **Ludic Harm vs. Phenomenological Harm:**
  *   **Ludic Harm (Virtual):** Did you lose health? No. Did you lose frame advantage? No. In the ontology of the game rules, **no harm occurred.** The system corrects the ledger. You are not "owed" health back because you never lost it in the authoritative state.
  *   **Phenomenological Harm (Real):** Did you experience stress? Yes. Did you waste cognitive resources? Yes. This harm is **real**, located in your biology, caused by a **false virtual stimulus**.

  **Is the player owed anything?**
  Competitively: No. The social contract of online play accepts rollback as the price of low latency. We agree to trade "perfect perceptual truth" for "responsiveness."
  Philosophically: This creates a category of **Gaslighting by Design**. The system intentionally feeds you false information to optimize flow, then retroactively invalidates your reaction to that information.

  The harm exists in the **interface layer**. It highlights that the "Virtual World" is not a seamless reality, but a negotiation between two machines and a human nervous system. The harm is the friction of that negotiation. It is a real harm (stress/fatigue) caused by a fictional event.

  ### 4. The Pushback: Is this just Appearance/Reality?

  You asked me to push back if this is just old dualism wearing a headset.

  **Yes, it is.** But with a crucial twist: **Time.**

  Classic Appearance/Reality (Plato's Cave, Descartes' Demon) is spatial or epistemological. "Is that a real chair or a shadow?"
  Rollback netcode introduces **Retroactive Ontology**.

  In the real world, if I see a flash of lightning and flinch, and then you tell me "Actually, that was a reflection, not lightning," the lightning didn't happen, but my flinch *still happened in the past*. The past is fixed.
  In rollback netcode, the game asserts that **the past itself was different.** It doesn't just say "You were mistaken about the past." It says "The past *is* this other thing now."

  It forces the player to accept a **Block Universe** theory of time where the "true" timeline is the server's log, and your lived experience is a glitchy rendering of a timeline that *never actually existed*.

  **Where you might be overthinking it:**
  You ask if the setup *requires* a privileged description. In practice, yes. But don't confuse the **Engineering Necessity** with **Metaphysical Truth**.
  The game *acts* as if there is one true state because otherwise, you can't have a winner. That doesn't mean there *is* one true state in a deeper philosophical sense; it means the **institution of competition** requires a single arbiter.
  If you were playing a cooperative game where winning/losing didn't matter, you could run a "client authoritative" model where we both see different things and just enjoy the chaos. The "privileged truth" is a requirement of the *rules*, not necessarily the *medium*.

  ### Summary of the Metaphysics

  1.  **Ontology:** **Simulation Realism.** The logic state is real; the rendered state is a provisional approximation. The "Virtual Object" is the hitbox in memory, not the sprite on screen.
  2.  **History:** **Computational Formalism.** Matches are not recordings of events; they are reproducible calculations. Facts are relative to the software version.
  3.  **Ethics:** **Utilitarian Flow.** The system prioritizes the smoothness of the interaction (low latency) over the truthfulness of the perception. The player accepts "perceptual lies" as the cost of "causal fairness."
  4.  **Time:** **Retroactive Correction.** The system claims the authority to edit the immediate past, treating your lived experience as a draft version of history.

  You aren't crazy for feeling bugged by it. It is a genuinely strange ontological position to inhabit: **Living in a world where your senses are deliberately decoupled from reality for the sake of performance, and where the past is editable.** That is a specific kind of modern alienation.
