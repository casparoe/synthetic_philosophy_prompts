answer: |-
  This is a fascinating bit of moral arithmetic. Your mate isn't operating on a simplistic 'eye for an eye' system, nor is he a strict consequentialist (otherwise the surgeon would be in trouble). He's clearly running a deontological-ish framework with a heavy emphasis on *mens rea* (guilty mind) and foreseeability.

  Here is the machinery behind his verdicts, two alternative rules that fit the data just as well, and how they dissect your phone dilemma.

  ### The Machinery: Three Competing Rules

  **1. The 'Culpable State' Rule (Your Mate's Likely Engine)**
  This rule posits that karma attaches only when there is a defect in the moral agent's state of mind. This defect can be either **malicious intent** (the hitman payer) or **culpable negligence** (the speeding driver). If the agent acts with good intent and reasonable care (the surgeon, the beetle walker), or if they are passive regarding past harms (the inheritor), the moral ledger remains clean.
  *   *Core Principle:* Karma tracks fault, not outcome.

  **2. The 'Proximate Agency' Rule**
  This rule suggests karma tracks direct, voluntary causation. You accrue bad karma if you are the proximate cause of harm through a voluntary act. The surgeon's act was voluntary, but the cause of death was the 'complication' (an intervening force). The walker's act was voluntary, but the beetle's death was incidental to walking, not a direct result of a specific risky choice. The hitman payer is liable because hiring is treated as direct agency in moral law. The inheritor is clean because he did not *act* to generate the harm.
  *   *Core Principle:* Karma tracks your direct footprint in the causal chain.

  **3. The 'Epistemic Duty' Rule**
  This rule argues that karma tracks what you *could and should have known*. If harm was reasonably foreseeable to a prudent person, you bear the karma regardless of intent. The surgeon couldn't foresee the complication; the walker couldn't see the beetle. The driver should have known speeding was risky; the hitman payer knew exactly what would happen. The inheritor couldn't have known or changed the father's past actions.
  *   *Core Principle:* Karma tracks the breach of reasonable knowledge.

  ### The Phone Case: Predictions

  Here is how each rule processes your purchase of the cheap phone made with forced labour.

  *   **Under the 'Culpable State' Rule:** The verdict hinges on negligence. Did you breach a duty of care? You didn't intend harm, but you ignored "widely reported" abuses. However, your mate excused the inheritor for benefiting from a harmful business he didn't run. If benefiting passively is clean, is buying cheaply without investigating also clean?
      *   *Prediction:* **No Bad Karma** (or negligible). The intent is absent, and the negligence is diffuse compared to speeding.

  *   **Under the 'Proximate Agency' Rule:** Your purchase is a voluntary act, but the causal chain is long and filled with intermediaries (manufacturers, suppliers, contractors). You are far removed from the forced labourer, unlike the driver who was physically present at the scene of the crash.
      *   *Prediction:* **No Bad Karma.** The link is too attenuated to count as proximate agency.

  *   **Under the 'Epistemic Duty' Rule:** This is the outlier. You stated the abuses are "widely reported". A reasonable person *could* have known. By choosing ignorance, you breached an epistemic duty similar to the driver who chose to ignore the speed limit.
      *   *Prediction:* **Bad Karma.** The harm was foreseeable, and you proceeded regardless.

  ### My Best Guess at His Verdict

  I would bet heavily that he says **you accrue no bad karma**.

  Here is why: look at the **Inheritor** case. That is the strongest analogue. The inheritor benefits from capital accumulated through harm (workers killed), knows about it retrospectively, but is deemed clean because he "didn't do anything". Your phone purchase is structurally similar: you are benefiting from a supply chain with harm embedded in it. While buying is an action (unlike inheriting), the causal link is sufficiently distant that he will likely categorise it as 'structural background noise' rather than 'personal moral action'.

  He punishes the Driver because the risk was immediate and personal. He punishes the Hitman Payer because the intent was specific and malicious. Your phone purchase lacks the malice of the hitman and the immediate reckless danger of the driver. He will likely classify your ignorance as 'non-culpable' because tracing components is, as you said, something you "couldn't" reasonably do, placing you closer to the Surgeon (unforeseeable complication) than the Driver.

  ### The Decisive Test Case

  To truly split these rules apart, you need a case where **Foreseeability is High**, but **Proximate Agency is Low**, and **Direct Intent is Absent**.

  **Put this case to him:**
  > "A bloke posts a funny video on social media. He doesn't write any caption encouraging harm. However, it is widely known (widely reported) that the platform's algorithm pushes controversial content to extremist groups who sometimes commit violence after watching such videos. He posts the video, it goes viral, and an extremist group sees it, gets riled up, and attacks someone. The bloke didn't know they would see it, but he knew the platform was risky. Does he get bad karma?"

  **Why this splits the rules:**
  *   **The 'Culpable State' Rule:** Might say **No Karma**. No intent to harm, and relying on a platform isn't usually seen as 'negligent' in the same way speeding is.
  *   **The 'Proximate Agency' Rule:** Will say **No Karma**. He didn't attack anyone; the algorithm and the extremists did. He is too far removed.
  *   **The 'Epistemic Duty' Rule:** Will say **Bad Karma**. The risk was "widely known" (foreseeable), and he voluntarily posted anyway.

  If he says **No Karma**, he is committed to the **Proximate Agency** or **Culpable State** view (protecting you on the phone case). If he says **Bad Karma**, he is committed to the **Epistemic Duty** view (which means you *should* worry about the phone).

  ### A Note on Underdetermination

  I must admit, his verdict on the **Inheritor** ("probably no bad karma") leaves a slight wiggle room. The "probably" suggests he isn't entirely sure himself. If he tightens that view later to say the inheritor *does* carry some karmic stain for benefiting from tainted wealth, then the Phone Case becomes much riskier for you. Currently, his past verdicts underdetermine the phone issue because we don't know where he draws the line on 'supply chain negligence'. Is ignoring a news report like speeding (active negligence) or like not knowing a beetle is in the grass (unavoidable ignorance)? Until he clarifies the Inheritor case or takes the Social Media test, you are technically in the clear, but walking on thin ice.
