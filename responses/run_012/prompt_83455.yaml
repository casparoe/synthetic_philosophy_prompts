prompt: |-
  I have no academic background in this area, so I apologize in advance if I garble the vocabulary. I have been trying to think this through on my own and keep going in circles. Somewhere I picked up a result usually called Good's theorem on the value of information. My understanding of it is this: if you are the kind of chooser who selects whichever option has the highest expected payoff, then information that arrives before you choose cannot make your choice worse in expectation, because at worst you can disregard it and choose exactly as you would have chosen without it. I take it the expectation is calculated before you see what the information says, and that the theorem concerns the quality of the decision rather than whether you are pleased by the news.

  Here is what I cannot square with that. A friend was offered a free screening test for a condition that has no treatment and does not shorten her life. The result would not tell her anything she could act on; she says she would spend the rest of her days waiting for symptoms, and that she would probably stop making long-term plans. She declined, and she has even asked the clinic to record that she does not want to be told if a later test happens to pick the condition up, which she says is because she does not trust her future self to refuse a second time. I want to tell her that she is simply being irrational, since the theorem is a mathematical fact and a rational person cannot be made worse off by information. But the only defence of that verdict I can find is that she could always ignore the result, and that defence strikes me as empty, because she cannot un-know it. When I try to imagine a version of her case where she could act on the result, I am not sure the theorem helps me either: it seems to say something about the value of choosing with information, not about whether obtaining it is worthwhile.

  So I would like to know whether I have the theorem wrong, or whether my friend is genuinely making a mistake. If the theorem does not settle her case, I would like to understand precisely what it does establish, and where the reasoning I keep reaching for breaks down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Subject:** Good's Theorem on the Value of Information.
      *   **User's Understanding:** Information cannot make a decision worse in expectation for an expected utility maximizer because one can always ignore it. Expectation is calculated *ex ante* (before seeing the info). It's about decision quality, not emotional satisfaction.
      *   **The Conflict:** A friend declined a free screening test for an untreatable, non-fatal condition. She argues knowing would cause psychological harm (anxiety, loss of future planning) and affect her behavior negatively. She even pre-committed to not knowing future results.
      *   **User's Dilemma:** Wants to call the friend irrational based on Good's Theorem but feels the "just ignore it" argument is weak because knowledge is irreversible. Also unsure if the theorem applies to *obtaining* information vs. *using* it.
      *   **Goal:** Determine if the user has the theorem wrong, if the friend is mistaken, what the theorem actually establishes, and where the user's reasoning breaks down.

  2.  **Deconstruct Good's Theorem:**
      *   **What is it?** I.J. Good (1967) proved that for a Bayesian expected utility maximizer, the expected value of free information is non-negative.
      *   **Key Assumptions:**
          1.  **Expected Utility Maximization:** The agent chooses actions to maximize expected utility.
          2.  **Costless Information:** The information itself has no direct cost (money, time, etc.).
          3.  **Utility Function:** The utility function must account for *everything* the agent cares about.
          4.  **Bayesian Updating:** The agent updates beliefs correctly upon receiving information.
      *   **The "Ignore It" Clause:** Mathematically, having the option to use information includes the option to act as if you didn't have it. Therefore, $E[U|Info] \ge E[U|No Info]$.
      *   **The Catch:** The utility function $U$ must include the *psychological cost* of knowing. If knowing causes distress, that distress must be modeled as a negative utility in the outcome.

  3.  **Analyze the Friend's Case:**
      *   **Condition:** Untreatable, non-fatal.
      *   **Action:** No medical intervention changes based on the result.
      *   **Consequence of Knowing:** Psychological distress ("spend rest of days waiting," "stop making long-term plans").
      *   **Consequence of Not Knowing:** Life continues as normal.
      *   **User's Argument:** She is irrational because information has non-negative value.
      *   **Reality:** If the information causes psychological harm that reduces her overall well-being (utility), then the *net* utility of acquiring the information is negative.
      *   **Resolution:** Good's Theorem assumes the utility function captures all values. If "peace of mind" is a value, then avoiding information that destroys peace of mind is rational. The theorem says $E[U_{with\_info}] \ge E[U_{without\_info}]$. But if $U$ includes "anxiety cost," then $U_{with\_info}$ might be lower *unless* the information allows for a better physical outcome. Here, there is no better physical outcome. So, the cost of knowing outweighs the decision-theoretic benefit (which is zero, since actions don't change).
      *   **Wait, does Good's Theorem allow for negative value of information?** Strictly speaking, Good's Theorem says the value of information *for decision making* is non-negative. It assumes the only value of information is its instrumental value in changing actions to improve outcomes. It does *not* account for "intrinsic" disutility of knowledge (curiosity satisfied or anxiety induced).
      *   **Refinement:** If the utility function is defined over *world states* (including mental states), then acquiring information changes the world state (from "ignorant" to "knowing"). If "knowing" is a worse state than "ignorant" (due to anxiety) and actions don't change, then the expected utility of acquiring the info is negative.
      *   **Does this violate Good's Theorem?** No, because Good's Theorem applies to the value of information *conditional on the decision problem*. If the decision problem doesn't change (no treatment), the instrumental value is zero. If there is a direct cost (psychological), the net value is negative. Good's Theorem assumes *costless* information. Psychological distress is a cost.

  4.  **Address the User's Specific Confusions:**
      *   *"She could always ignore it... she cannot un-know it."* -> Correct. The "ignore it" argument assumes knowing doesn't change your utility function or state directly. If knowing hurts, it's not costless.
      *   *"Theorem concerns the quality of the decision rather than whether you are pleased by the news."* -> This is the crux. If "being pleased" (or not anxious) is part of the utility, then the theorem must account for it. If utility is only about external outcomes (money, health status), then the theorem holds, but the model is incomplete for the friend's situation.
      *   *"Is she irrational?"* -> No. It is rational to avoid information that causes harm without providing instrumental benefit. This is often called "rational ignorance" or "strategic ignorance."

  5.  **Drafting the Response:**
      *   **Validate the User:** Acknowledge their understanding is surprisingly good for a non-expert. They grasped the *ex ante* expectation and the "ignore" option.
      *   **Clarify Good's Theorem:** State clearly what it says (Expected Utility of acting with info $\ge$ Expected Utility of acting without info).
      *   **Identify the Missing Piece:** The definition of "Utility."
          *   Standard Decision Theory: Utility is over outcomes.
          *   Friend's Case: "Peace of mind" is an outcome. "Anxiety" is a negative outcome.
      *   **The "Costless" Assumption:** Good's Theorem assumes information is free. Psychological distress is a *cost*. Therefore, the theorem's condition (costless) is violated.
      *   **Instrumental vs. Intrinsic Value:** Information has instrumental value (helps choose better actions) and intrinsic value (curiosity or anxiety). Good's Theorem covers instrumental. It says instrumental value $\ge 0$. It does not say instrumental + intrinsic $\ge 0$.
      *   **The Friend's Rationality:** She is not irrational. She is maximizing her utility, which includes mental state. Pre-commitment is a standard rational strategy to overcome time-inconsistency (akrasia).
      *   **Where the User's Reasoning Breaks:** The user separates "decision quality" from "being pleased by the news." In decision theory, if "being pleased" matters to the agent, it *must* be part of the decision quality/utility function. You can't separate them if the agent cares about them.
      *   **Conclusion:** The theorem is mathematically correct but doesn't apply to this specific scenario because the "costless" assumption fails (psychological cost) and the utility function needs to include epistemic states.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, strictly speaking:* Good's Theorem is about the value of information *for a decision problem*. If the decision problem is "Take test / Don't take test," the theorem doesn't say "Take test." It says "If you have the info, you can't do worse than if you didn't *given the same action set*."
      *   *Actually, the specific theorem:* "The expected utility of a decision made after observing free information is at least as high as the expected utility of a decision made without it."
      *   *The loophole:* This assumes the utility function $U(action, state)$ does not depend on *whether you know the state*. If $U$ depends on knowledge (e.g., $U(action, state, knowledge)$), then the theorem doesn't strictly hold in its simplest form.
      *   *Better explanation:* Distinguish between **Instrumental Value** (helps you act) and **Consumption Value** (feeling good/bad about knowing). Good's Theorem proves Instrumental Value $\ge 0$. It says nothing about Consumption Value. If Consumption Value is negative and large, total value is negative.
      *   *Pre-commitment:* Explain that asking the clinic to record her wish is a rational binding constraint (Ulysses contract).

  7.  **Final Structure:**
      *   Introduction: Validate the user's grasp (it's excellent).
      *   The Theorem: Confirm their understanding is technically correct regarding *instrumental* value.
      *   The Gap: Utility functions and "Costless" information.
      *   Application to Friend: Psychological cost makes information "costly." Peace of mind is a utility good.
      *   Rational Ignorance: It is rational to avoid info if it harms well-being without changing actions.
      *   Pre-commitment: Explain the rationality of binding future self.
      *   Summary: Friend is rational; theorem doesn't apply due to psychological costs/intrinsic disutility of knowledge.

  8.  **Tone Check:** Empathetic, precise, philosophical but accessible. Avoid condescension. Acknowledge the depth of the question. (The user is asking a deep question in philosophy of decision theory).

  9.  **Final Polish:** Ensure the distinction between "decision quality" (instrumental) and "well-being" (total utility) is clear. The user thinks the theorem separates these; decision theory says they are integrated.

  *(Self-Correction during drafting)*: I need to be careful not to say Good's Theorem is "wrong." It's a mathematical truth within its axioms. The issue is the *application* of the axioms to the real world. The axiom "information is costless" is the one that breaks. Also, the axiom that utility depends only on physical outcomes vs. mental states.

