answer: |-
  You have grasped the core of Good's Theorem (I.J. Good, 1967) remarkably well, especially without an academic background. Your summary is precise: for an expected utility maximizer, free information has non-negative *instrumental* value because you can always choose to act as if you hadn't received it.

  However, your intuition that something is missing in your friend's case is correct. The theorem is mathematically sound, but its application to your friend depends on assumptions that do not hold in her situation. She is not irrational; rather, your application of the theorem relies on a definition of "utility" that excludes the very thing she cares about most: her peace of mind.

  Here is precisely where the reasoning breaks down and how to reconcile the theorem with your friend's choice.

  ### 1. The "Costless" Assumption
  Good's Theorem proves that the expected value of information is non-negative **provided the information is free.**

  In the abstract mathematical model, "free" means there is no cost to acquiring it and no cost to holding it. In your friend's case, the information is financially free, but it is **psychologically costly.** She has explicitly stated that receiving the news will cause her anxiety ("waiting for symptoms") and alter her behavior negatively ("stop making long-term plans").

  In decision theory, costs are subtracted from utility. If we treat "anxiety" and "loss of life satisfaction" as negative utility, then the information is not free. It has a price tag attached to it.
  *   **Instrumental Value:** The value of the info in helping you make a better physical choice (e.g., taking a medicine). In your friend's case, this is **zero**, because there is no treatment.
  *   **Consumption Value:** The value (positive or negative) of simply knowing the information. In your friend's case, this is **negative**.

  Good's Theorem guarantees that *Instrumental Value* $\ge 0$. It does not guarantee that *Instrumental Value + Consumption Value* $\ge 0$. Since her instrumental value is zero and her consumption value is negative, the total value of the information is negative. Declining it is rational.

  ### 2. The Definition of "Utility"
  Your hesitation stems from this sentence in your query: *"I take it... the theorem concerns the quality of the decision rather than whether you are pleased by the news."*

  This is the pivot point. In formal decision theory, **utility is defined by the agent's preferences.** If an agent prefers "not knowing" to "knowing," then "not knowing" yields higher utility. You cannot separate "the quality of the decision" from "whether you are pleased by the news" if the agent's happiness is part of what is being maximized.

  If you define the utility function strictly over external physical states (e.g., "alive," "dead," "rich," "poor"), then Good's Theorem holds, but the model fails to describe your friend. She cares about her internal mental state. If her utility function includes "tranquility," then acquiring information that destroys tranquility reduces her expected utility.

  To call her irrational, you would have to argue that she *ought not* to care about her tranquility. That is a philosophical or moral claim, not a mathematical one. Decision theory takes preferences as given; it does not judge them. If she prefers ignorance to anxiety, maximizing her utility requires choosing ignorance.

  ### 3. The "Ignore It" Objection
  You noted that the defense "she could always ignore it" strikes you as empty because "she cannot un-know it." You are absolutely right.

  The "ignore it" clause in Good's Theorem refers to **action**, not **psychology**. It means you can choose the same *physical action* you would have chosen without the info. It does not mean you can revert to the psychological state of not knowing.

  *   **Without Info:** She chooses Action A. Her mental state is "Hopeful/Uncertain."
  *   **With Info (Ignored):** She chooses Action A. Her mental state is "Anxious/Knowing."

  If her utility depends on her mental state, these are two different outcomes. The theorem says she can secure the same *external* outcome, but it cannot secure the same *internal* outcome. Since she values the internal outcome, the option to "ignore" the info regarding her actions does not compensate for the damage done to her state of mind.

  ### 4. Rational Pre-commitment
  Your friend's request to have the clinic record her refusal of future tests is a classic example of a **Ulysses contract** (or pre-commitment strategy).

  She anticipates that her "future self" might be weak. In the moment of temptation (e.g., a doctor pressing her to take the test), the immediate curiosity or social pressure might outweigh her long-term preference for peace of mind. By binding her future self now, she is ensuring that her long-term rational plan is executed.

  This is not irrational; it is a sophisticated recognition of **time inconsistency**. It is the same logic behind someone with a drinking problem throwing away their alcohol, or a dieter locking away the cookies. She is protecting her current utility function from being hijacked by a future shift in priorities.

  ### Summary
  You have not garbled the vocabulary; you have encountered the boundary where abstract mathematics meets human psychology.

  1.  **Good's Theorem is correct:** Information has non-negative *instrumental* value for decision-making.
  2.  **Your friend's case is different:** For her, the information has zero instrumental value (no treatment) and negative *intrinsic* value (anxiety).
  3.  **The Theorem's Limit:** The theorem assumes information is costless. Psychological distress is a cost. Therefore, the theorem does not apply to the net value of acquiring the test.
  4.  **Verdict:** Your friend is not making a mistake. She is correctly identifying that the "cost" of the knowledge exceeds the "benefit" of the decision-making power.

  You can tell her that decision theory actually supports her choice, provided the model accounts for the value of peace of mind. In the language of economics, she is engaging in **rational ignorance**. She has correctly calculated that the cost of the information exceeds its benefit.
