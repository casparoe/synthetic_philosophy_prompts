  Your intuition is tracking a specific, sophisticated position in metaethics often called **Selective Moral Realism** (or sometimes a "Hybrid View"). You are rejecting the idea that evolution is either a global debunker (undermining everything) or a global vindicator (tracking truth everywhere). Instead, you are judging the *normative weight* of the evolutionary function itself.

  The principle that unifies your seven verdicts is what I will call the **Constitutive vs. Contingent Function Principle**.

  ### The Principle

  **An evolutionary explanation undermines a moral belief if and only if it reveals that the belief is produced by a *contingent heuristic* that lacks independent normative force. It does *not* undermine the belief if the evolutionary function is itself a *constitutive moral good* (or if there is no evolutionary story at all).**

  This principle has three clauses, each driven by specific cases from your list:

  #### 1. The "Contingent Heuristic" Clause (Undermining)
  *   **The Rule:** If evolution produced the belief as a shortcut (heuristic) for a goal that is **absent** or **arbitrary** in the specific context, the belief is debunked.
  *   **Cases doing the work:**
      *   **Incest:** The evolutionary function is genetic hygiene. In your case (contraception/adults), that function is absent. The revulsion is a "contingent heuristic" detached from its purpose. **Verdict: Undermined.**
      *   **Countrymen:** The evolutionary function is tribal competition. The boundary (nation-state) is arbitrary relative to moral worth. The instinct creates inequality without a justificatory relationship. **Verdict: Undermined.**
  *   **Why this solves your problem:** This explains why you don't accept the "global debunking" worry. Evolution doesn't debunk *everything*, only the parts where the evolutionary "why" doesn't translate to a moral "why."

  #### 2. The "Constitutive Good" Clause (Vindicating)
  *   **The Rule:** If evolution produced the belief to serve a function that is **itself morally valuable** (e.g., cooperation, care, survival), the belief is not debunked, even if it is evolved. The evolutionary cause *aligns* with the moral truth.
  *   **Cases doing the work:**
      *   **Promise-keeping & Gratitude:** The function is social cooperation/reciprocity. Cooperation is a moral good. **Verdict: Not Undermined.**
      *   **Own Kids:** The function is kin care. You view the special obligation of parenthood as a moral good (a "constitutive bond"), not an arbitrary bias. **Verdict: Not Undermined.**
      *   **Eating Meat:** The function is survival/nutrition. You view human survival/natural diet as a moral good that outweighs abstract animal rights reasoning. **Verdict: Not Undermined.**
  *   **Why this solves your problem:** This explains why reputation management (Promise) doesn't debunk your belief. The *mechanism* (reputation) serves a *truth* (cooperation is necessary/good).

  #### 3. The "No Story" Clause (Vindicating)
  *   **The Rule:** If there is no clear evolutionary story for a belief, and it tracks direct moral perception (like suffering), it is trusted *more*, as it likely stems from reason or empathy rather than biological shim.
  *   **Cases doing the work:**
      *   **Animal Cruelty:** You cannot find a story for why we evolved to think *torture for fun* is wrong (unlike torture for survival). It tracks pure harm. **Verdict: Not Undermined.**

  ---

  ### Which verdicts does this force you to give up?

  Strictly speaking, none of your seven verdicts contradict this principle. However, the principle forces a **distinction** you must maintain to avoid contradiction between **Countrymen** and **Own Kids**.

  You must consistently maintain that **National Borders** are *Arbitrary* (Contingent), while **Parent/Child Bonds** are *Normatively Real* (Constitutive). If you ever slip into thinking national borders create special obligations akin to family, this principle will force you to correct yourself (as you already do). Conversely, if you ever slip into thinking your obligation to your kid is just "biology," this principle forces you to affirm it is a moral duty.

  ---

  ### Predictions for your new cases

  Here is how the **Constitutive vs. Contingent Function Principle** predicts you should handle the two new scenarios.

  #### (a) "A stranger's pain counts as much as my kid's."
  *   **Analysis:** This case creates a tension between your **Countrymen** verdict (Evolutionary bias debunked by Impartiality) and your **Own Kids** verdict (Evolutionary bias vindicated as Special Obligation).
  *   **Application:**
      *   **Intrinsic Worth:** If this belief means "A stranger has equal *moral status* to my kid," your principle treats this like the **Countrymen** case. The evolutionary instinct to value kin *more* is a bias regarding status. Reason corrects this to impartiality.
      *   **Action Priority:** If this belief means "I must *save* the stranger over my kid," your principle treats this like the **Own Kids** case. The evolutionary instinct creates a *constitutive bond* that permits partiality in action.
  *   **Prediction:** **Not Undermined (with a caveat).**
      *   Since you said you would "defend to the death" that the pain *counts as much* (status/worth), your principle supports this. Evolution gave us a bias (kin preference), but like the tribal bias, this is debunked regarding *intrinsic worth*.
      *   *However*, the principle predicts you will still feel it is **right** to save your kid first (Action Priority). You will hold that their pain counts *equally*, but your *obligation* is unequal. This is the only way to reconcile the Countrymen and Own Kids verdicts.

  #### (b) "We owe something to people who won't be born for two hundred years."
  *   **Analysis:** There is no evolutionary story for this. We have no instinct for people 200 years away (Reciprocity is impossible; Kin selection is too distant).
  *   **Application:** This falls under the **Animal Cruelty** clause ("No Story"). Since there is no evolutionary heuristic to debunk, the belief stands or falls on its rational merits. Furthermore, it aligns with the **Constitutive Good** of preventing suffering/promoting well-being (like Promise-keeping/Gratitude), just extended in time.
  *   **Prediction:** **Not Undermined.**
      *   In fact, following your **Animal Cruelty** verdict, the *lack* of an evolutionary story should make you trust this belief *more*. It suggests the belief comes from moral reasoning about harm and fairness, not biological impulse.
      *   *Caveat:* If you view this obligation as requiring *sacrifice* that conflicts with **Survival** (the Eating Meat good), you might feel tension. But absent that conflict, the "No Story" rule vindicates the belief.

  ### Summary of your Position
  You are not a skeptic. You are a **Functionalist Realist**. You believe evolution is a tool that sometimes builds moral bridges (cooperation, care) and sometimes builds moral walls (tribalism, disgust). Your job, as you see it, is to keep the bridges and tear down the walls.
