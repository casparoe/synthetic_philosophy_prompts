      *   *Nuance:* The user asks about "reflective agents." This implies self-modification or source-code access. I need to treat this as a program equilibrium problem (Tennenholtz) or FDT problem.
      *   *Crucial distinction:* Does "stealing" mean "I run your code" or "I adopt your policy function"? If I adopt your policy function $P$, and you run $P$, we do the same thing. But in PD, $P$ needs to take *input*. If $P$ is constant (always C), fine. If $P$ is conditional (C if opponent C), we need to solve the loop.
