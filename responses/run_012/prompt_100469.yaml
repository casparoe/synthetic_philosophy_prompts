answer: |-
  # Activity Design: The Pivotal Chain

  ## 1. Overview
  **Title:** The Pivotal Chain: A Simulation of Strategy-Proofness and Dictatorship
  **Time:** 75 Minutes
  **Participants:** 16 (Upper-level undergraduate or graduate students)
  **Goal:** To experientially demonstrate the Gibbard–Satterthwaite theorem by guiding participants through a "manipulation market" that reveals the instability of fair voting rules, followed by a structured search for a "pivotal voter" that logically collapses into dictatorship.
  **Core Concept:** Participants will first profit from lying under a standard rule. They will then attempt to design a rule where lying is never profitable (strategy-proof). Through a sequential profile shift, they will discover that ensuring this property requires granting decisive power to a single individual (the pivotal voter), reproducing the core lemma of the theorem.

  ## 2. Learning Goals
  By the end of the session, participants will be able to:
  1.  Distinguish between **truthful voting** and **strategic manipulation** in a concrete payoff context.
  2.  Identify a **pivotal voter** as the agent whose preference change flips the social outcome.
  3.  Explain why **strategy-proofness** forces the social choice function to align with the pivotal voter's preferences.
  4.  Understand why extending this logic across multiple pairs of alternatives necessitates a **dictator**.
  5.  Articulate the assumptions of the theorem (Unrestricted Domain, Onto, $\ge$3 Alternatives).

  ## 3. Materials
  *   **Whiteboard & Markers:** For tracking the "Social Outcome" and profile sequences.
  *   **Index Cards (64 total):** 4 per participant. Pre-printed with rankings (see Setup).
  *   **Tokens (160 total):** 10 per participant (poker chips, beads, or paper slips).
  *   **Prize Pool:** A symbolic prize (e.g., "Homework Pass," "Choice of Seminar Topic," or simply public recognition) awarded to the participant with the most tokens at the end.
  *   **Ballot Box:** A simple container for submitting cards.

  ## 4. Setup (10 Minutes)
  1.  **Seating:** Arrange chairs in a semi-circle facing the whiteboard.
  2.  **Preferences:** Distribute 4 index cards to each participant. Each card represents a "True Preference" profile they will hold for the session. To ensure variety, distribute the 6 possible strict rankings of alternatives **A, B, C** roughly evenly among the 16 participants.
      *   *Note:* Participants must keep their "True Preference" hidden but use it to calculate their payoffs.
  3.  **Currency:** Give each participant 10 tokens. Explain that tokens represent utility.
      *   **Payoff Scheme:**
          *   If the Social Outcome is your **1st choice**: +5 tokens.
          *   If the Social Outcome is your **2nd choice**: +2 tokens.
          *   If the Social Outcome is your **3rd choice**: +0 tokens.
      *   **Manipulation Cost:** Submitting a ballot that does *not* match your True Preference card costs **1 token**. Submitting your True Preference is free.
  4.  **The Rule (Round 1):** Announce the voting rule: **Plurality with Tie-Break.**
      *   Count only the top-ranked alternative on each ballot.
      *   The alternative with the most votes wins.
      *   Ties are broken alphabetically (A > B > C).
  5.  **Definition:** Define **Strategy-Proofness** simply: "A rule is strategy-proof if you never need to spend a token to lie to get a better result. Truth-telling is always your best move."

  ## 5. Activity Timeline

  ### Phase 1: The Manipulation Market (20 Minutes)
  *Goal: Demonstrate that common fair rules are not strategy-proof.*

  1.  **Round 1a (Truth):** Ask participants to submit their True Preference cards. Calculate the winner on the whiteboard. Participants calculate their token earnings.
  2.  **Round 1b (The Market):** Announce a 5-minute "Trading/Manipulation Period."
      *   Participants may submit a *new* ballot.
      *   If the new ballot differs from their True Preference card, they pay 1 token immediately.
      *   They should only do this if the new outcome gives them enough extra tokens to profit (e.g., moving from 3rd choice to 1st choice nets +5 tokens, cost is 1, profit is 4).
  3.  **Round 1c (Resolution):** Collect new ballots. Recalculate the winner. Distribute payoffs.
  4.  **Observation:** Ask the room: "Did anyone spend a token to lie? Did it pay off?"
      *   *Expected Result:* Under Plurality, voters with a weak 1st choice will "bury" a strong rival by voting for their 2nd choice. Manipulation will occur.
      *   *Facilitator Note:* Highlight that the rule failed strategy-proofness. The group now wants to "fix" the constitution to prevent this waste of tokens.

  ### Phase 2: The Pivotal Search (25 Minutes)
  *Goal: Reproduce the Pivotal Voter Lemma.*

  1.  **New Rule Proposal:** To stop manipulation, propose a **Sequential Profile Rule**. Explain that instead of voting once, we will look at how the outcome changes as we shift preferences.
  2.  **The Setup:** Select **3 Alternatives (A, B, C)**. Focus on the pair **(A, B)**. Ignore C for this phase (place C at the bottom of everyone's ranking for simplicity).
      *   **State 1:** All 16 participants hold cards ranking **A > B**. (Social Outcome: A).
      *   **State 2:** All 16 participants hold cards ranking **B > A**. (Social Outcome: B).
  3.  **The Chain:** We will move from State 1 to State 2 one voter at a time.
      *   Arrange participants in a fixed order (Voter 1 to Voter 16).
      *   **Step 1:** Voter 1 switches their card from A>B to B>A. Everyone else stays A>B. What is the outcome? (Likely A).
      *   **Step 2:** Voter 2 switches. Outcome? (Likely A).
      *   ...
      *   **Step k:** At some specific voter (say, Voter 9), the outcome flips from **A to B**.
  4.  **Identification:** Mark Voter 9 on the whiteboard as the **Pivotal Voter for (A, B)**.
  5.  **The Strategy-Proof Constraint:** Ask the group: "If we want this rule to be strategy-proof, what must happen at Step 9?"
      *   *Guidance:* If Voter 9 prefers B, and their switch changes the outcome from A to B, the rule *must* select B. If the rule selected A even after Voter 9 switched to B, Voter 9 would have an incentive to lie (or the rule is unresponsive).
      *   *Crucial Insight:* To guarantee strategy-proofness, the Social Choice Function must respect the Pivotal Voter's preference at the moment of the flip.
  6.  **Repeat for (B, C):** Reset the cards. Now focus on pair **(B, C)**. Run the chain again.
      *   Identify the Pivotal Voter for (B, C).
      *   *Facilitator Trick:* Rig the distribution or guide the logic so the *same* Voter 9 emerges as pivotal, or ask the group: "What if Voter 12 was pivotal for (B, C) but Voter 9 was pivotal for (A, B)?"
      *   Lead them to see that if different voters are pivotal for different pairs, manipulation becomes possible again (by coordinating the order of pairs). The only way to permanently eliminate manipulation incentives is if the **same voter** is pivotal for all pairs.

  ### Phase 3: The Dictatorship Conclusion (10 Minutes)
  *Goal: Show the only strategy-proof solution is Dictatorship.*

  1.  **The Synthesis:** If Voter 9 is pivotal for (A, B) and pivotal for (B, C), Voter 9 effectively decides the ranking between A, B, and C.
  2.  **The Test:** Ask Voter 9 to announce their top choice. Ignore everyone else's cards. Declare that the winner.
  3.  **The Market Check:** Ask the other 15 participants: "Under this Dictator Rule, does anyone want to spend a token to lie?"
      *   *Result:* No. Lying costs a token and changes nothing. Truth-telling is dominant.
  4.  **Verification:** This rule is Strategy-Proof. It is Onto (Voter 9 can pick any option). It handles Unrestricted Domain. But it is Dictatorial.
  5.  **Closing:** Collect tokens. Award the prize to the highest scorer (likely the one who manipulated best in Phase 1).

  ### Phase 4: Debrief (10 Minutes)
  *Goal: Map activity to formal theory.*

  Facilitate a discussion using the following mapping:

  1.  **Unrestricted Domain:** "In Phase 1, you could hold any preference (A>B>C, C>A>B, etc.). The theorem assumes the rule must work for *all* these combinations, not just the ones we tested."
  2.  **Onto:** "Could Voter 9 choose any alternative? Yes. If a rule excluded an option (e.g., 'B can never win'), it wouldn't be Onto, and the theorem wouldn't apply."
  3.  **Strategy-Proofness:** "In Phase 1, lying paid off. In Phase 3, lying was useless. Strategy-proofness means lying is *never* a weakly dominant strategy."
  4.  **Pivotal Voter Lemma:** "Phase 2 was the proof in miniature. We found the specific person whose change flipped the outcome. The theorem proves such a person *must* exist."
  5.  **Dictatorship:** "We found that to make the Pivotal Voter's truth-telling optimal, we had to give them full control. Extending this to all pairs makes them a Dictator."

  ## 6. Candid Limitations Note
  *Facilitator Script:* "This simulation captures the intuition, but it is not the formal proof.
  1.  **Induction:** The real proof uses mathematical induction over the number of voters and alternatives. We only tested 16 voters and 3 alternatives.
  2.  **Social Choice vs. Welfare:** We selected a single winner (Social Choice Function). The theorem also applies to ranking all alternatives (Social Welfare Function), which is Arrow's Theorem territory.
  3.  **Group Strategy-Proofness:** We only checked if *individuals* could lie. The theorem does not guarantee protection against *coalitions* lying together (that requires a stronger condition).
  4.  **Domain:** We assumed strict rankings. Indifference complicates the theorem."

  ## 7. Predicted Failure Modes & Fixes

  | Failure Mode | Prediction | Concrete Fix |
  | :--- | :--- | :--- |
  | **Normative Resistance** | Participants refuse to lie in Phase 1 due to social pressure, claiming "voting is a duty." | **Fix:** Frame tokens as "Research Grants." Emphasize that the *goal of the simulation* is to test the rule's robustness, not moral virtue. "If the rule allows you to gain tokens by lying, the rule is broken, not you." |
  | **Confusion on Pivotality** | Participants don't see why the "flipper" is special. They think it's just a tie-break. | **Fix:** Use a magnet on the whiteboard for the "Social Outcome." Physically move it only when the specific voter switches. Visualize the *causal link*. |
  | **Math Errors** | Counting votes takes too long; token accounting becomes messy. | **Fix:** Appoint 2 "Scrutineers" from the participants to handle token distribution and vote counting. Use a simple projection or large font on the board for tallies. |
  | **Overstating the Theorem** | Debrief implies *all* voting systems are dictatorial. | **Fix:** Explicitly state: "Only systems that are *Onto* and *Strategy-Proof* for *3+ alternatives*." Mention that restricting the domain (e.g., Single-Peaked Preferences) allows non-dictatorial rules. |
  | **Dictator Resentment** | The "Dictator" (Voter 9) feels uncomfortable or the group revolts. | **Fix:** Rotate the role of Voter 9 if running multiple iterations, or emphasize that this is a *structural necessity* of the math, not a political recommendation. |

