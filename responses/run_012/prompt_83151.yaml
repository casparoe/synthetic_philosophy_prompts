answer: |-
  # Session Plan: The MU Session

  ## 1. Materials to Prepare

  *   **Rule Cards:** 14 small cards. Each contains the System Definition (Axiom: MI; Rules 1–4; Definition of Theorem) and the Task ("Derive MU").
  *   **The Ledger:** A large whiteboard or a projected shared document with two columns: **String** and **Derivation Path** (e.g., "MI → MII → ...").
  *   **Confidence Slips:** 42 small slips of paper (3 per participant). Pre-labeled "Checkpoint 1," "Checkpoint 2," "Checkpoint 3." Each has fields for: *Percentage Chance MU is Derivable* and *One-Line Justification*.
  *   **The Prize:** A physical object placed visibly at the front. (Suggestion: A copy of *Gödel, Escher, Bach*, or a distinct wooden puzzle box).
  *   **Referee Kit:** A printed copy of the Rules, the List of Known Theorems (the counterexamples provided in your prompt: MUI, MUIUUIU, MII, MIIU), and a red marker.
  *   **Invariant Gallery Handout:** 14 copies. Lists the five candidate invariants provided in your prompt.
  *   **Hypothesis Slips:** 14 slips for the "Commit to Invariant" phase.
  *   **Timer:** Visible to you, not necessarily to them.

  ## 2. Roles

  *   **Facilitator (You):** Neutral arbiter. Do not solve. Do not hint. Manage time.
  *   **Referee (1 Participant):** Choose a participant with the logic background if possible, or one who appears meticulous. Their job is to verify rule applications against the card *only*. They mark illegal moves on the Ledger with a red X. They hold the "Counterexample List" (MUI, MII, etc.) to verify the Invariant Gallery later.
  *   **Scribe (1 Participant):** Writes valid strings on the Ledger.
  *   **Teams:** Divide the remaining 11 participants into 3 teams of 3–4.

  ## 3. Opening Three Minutes (Script)

  *(Stand at the front. Place the Prize on the table. Do not smile excessively. Do not mention logic, impossibility, or Gödel.)*

  **Facilitator:** "Welcome. On your desk is a card defining a formal system. It gives you an starting string, four rules of transformation, and a definition of what counts as a theorem.

  Your task is singular: Derive the string **MU**.

  If you produce a verified derivation of MU before the session ends, the Prize is yours. If multiple teams produce one, the first verified claim wins. If no one produces one, the Prize remains unclaimed.

  You will work in teams. You must submit all derived strings to the Scribe for the Ledger. The Referee will verify rule compliance. If a move is illegal, it is struck from the record.

  Begin."

  *(Start Timer. Hand out Rule Cards.)*

  ## 4. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute cards, assign Referee/Scribe, teams form. |
  | **05–30** | **Search I** | Teams derive strings. Scribe updates Ledger. Referee vetos illegal moves. |
  | **30** | **Checkpoint 1** | Distribute Slips 1. 2 minutes to write. Collect. |
  | **30–50** | **Search II** | Resume search. Encourage branching. Referee announces "Illegal Move" loudly when it happens. |
  | **50** | **Checkpoint 2** | Distribute Slips 2. 2 minutes to write. Collect. |
  | **50–55** | **The Pivot** | Facilitator intervenes (see Script below). |
  | **55–60** | **Hypothesis** | Teams write a proposed invariant on Hypothesis Slips. |
  | **60–70** | **Gallery** | Distribute Invariant Gallery. Teams classify the 5 candidates using Referee's counterexamples. |
  | **70** | **Checkpoint 3** | Distribute Slips 3. 2 minutes to write. Collect. |
  | **70–80** | **Objection** | Facilitator proposes adding MU as axiom. Group assesses impact on invariant. |
  | **80–90** | **Debrief** | Elicited reconstruction. Naming the move. Limitations. |

  ## 5. Instructions for Each Phase (Read Aloud)

  ### The Pivot (Minute 50)
  *(Wait for a lull in writing or a visible sigh. Stand up.)*

  **Facilitator:** "Pause. Look at the Ledger. Look at your Confidence Slips.
  I am going to ask you one question. You do not need to answer it yet, but you must hold it while you work.
  **Have we shown that MU cannot be done, or only that we have not yet done it?**
  Resume."

  ### The Hypothesis Commitment (Minute 55)
  **Facilitator:** "Stop searching. Look at the strings on the Ledger that the Referee has approved. They are all theorems. MU is not on the board.
  If MU is impossible, there must be a reason *why* the rules cannot reach it.
  I want each team to write down a **property**. A property that every string on this Ledger has, but MU does not.
  If this property is preserved by all four rules, it proves MU is unreachable.
  Write your proposed property on the Hypothesis Slip. Do not discuss it with other teams."

  ### The Gallery Classification (Minute 60)
  *(Hand out the Invariant Gallery Handout.)*

  **Facilitator:** "You have your own hypothesis. Now, here is a gallery of five candidate properties.
  Working with the Referee, classify each one into three categories:
  1. **True of all Theorems** (Preserved by rules).
  2. **False** (Referee has counterexamples).
  3. **True but Useless** (MU also has this property).
  You must identify which one, if any, settles the question."

  *(Note to Facilitator: Ensure the Referee uses the provided counterexamples: MUI for 'even Us', MII for 'odd Is', MUIUUIU for 'adjacent Us'.)*

  ### The Objection (Minute 70)
  **Facilitator:** "Assume you have found the decisive property. It proves MU is not a theorem in *this* system.
  Now, suppose I change the system. I add MU as a new Axiom.
  Does your proof still hold? Does the property still hold for all theorems?
  Discuss for two minutes."

  ### The Debrief (Minute 80)
  *(Collect all slips. Put the Prize away.)*

  **Facilitator:** "We are done searching. We will not derive MU today.
  I want you to reconstruct what happened. Do not let me lecture you.
  Who can tell me: What was the difference between the first hour and the last twenty minutes?"
  *(Wait for answer: "Searching vs. Analyzing.")*
  "What allowed us to stop searching?"
  *(Wait for answer: "The Invariant/Property.")*
  "Where did that property live? Was it inside the strings, or outside them?"
  *(Wait for answer: "Outside/Meta.")*
  "When I added MU as an axiom, what broke?"
  *(Wait for answer: "The Invariant/ The System.")*

  **Facilitator (Closing Statement):** "You have just performed a **Metatheoretic Proof**.
  Inside the system, you can only show what *is*. To show what *is not*, you had to step outside. You quantified over all possible derivations. You used an invariant—a property preserved by the rules—to bound the system's reach.
  This is the shadow of Gödel's incompleteness. But note what we did *not* do. We did not encode the system into arithmetic. We did not make the system talk about itself. We used ordinary reasoning *about* the system.
  The discomfort you felt—the urge to keep searching versus the realization that search was futile—is the exact tension between object-level work and meta-level proof.
  The Prize remains unclaimed. Not because you were not skilled enough, but because the system does not allow it. That is the result."

  ## 6. The Prize and Administration

  *   **The Object:** A book or puzzle.
  *   **The Script for Unclaimed Prize:** If a participant asks at the end, "So was it possible?", do not say "No."
  *   **Say This:** "The prize was conditional on a verified derivation. No derivation was verified. Whether a derivation exists is a fact about the system, not a promise of the prize. You have now gathered evidence about that fact."
  *   **Why:** This maintains the "straight face." You are not lying (no one won), but you are not asserting the negative truth until the debrief forces the meta-perspective.

  ## 7. Failure Modes and Remedies

  **1. Teams will not stop searching.**
  *   *Symptom:* They ignore the Pivot question and keep writing strings.
  *   *Remedy:* Stop the Scribe. "The Ledger is closed for new strings for five minutes." Force the pause physically.

  **2. Illegal rule applications.**
  *   *Expectation:* Rule 2 (Duplication) is the most common error. Participants will try to duplicate substrings not starting with M, or duplicate the M itself incorrectly. Rule 3 (III -> U) is often applied backwards (U -> III) which is not allowed.
  *   *Remedy:* The Referee must be strict. "Rule 2 requires the string to begin with M. This string begins with I. Rejected." Make the rejection public. This generates the "frustration data" needed for the Pivot.

  **3. A participant recognizes the puzzle.**
  *   *Symptom:* "Wait, this is the MIU system. MU is impossible."
  *   *Remedy:* Pull them aside immediately. "I need your help. If you reveal the answer, you destroy the experiment for everyone. Can you agree to play the role of a skeptic instead? Challenge the others to prove you wrong using only the rules." If they refuse, ask them to sit out the search phase and join for the Debrief.

  **4. A participant proposes a plausible but false invariant.**
  *   *Symptom:* "The number of letters is always even." (False, MI is 2, MII is 3).
  *   *Remedy:* Do not correct them. Ask the Referee: "Do we have a string on the Ledger that contradicts this?" Let the data kill the hypothesis. This reinforces the need for *verified* invariants.

  **5. Confusion of Not-Found with Cannot-Be-Found.**
  *   *Symptom:* "We just need more time."
  *   *Remedy:* This is the core tension. In the Debrief, ask: "How much time is 'enough' for search? Is there a number of years that would prove impossibility?" Guide them to see that finite search never proves negative existence in an infinite space.

  **6. The group feels set up/cheated.**
  *   *Symptom:* "You knew all along. We wasted an hour."
  *   *Remedy:* Validate this in the Debrief. "Yes, I knew. But you did not. The experience of the search was necessary to understand the value of the proof. If I told you at the start, you would not have felt the need for the invariant. The 'waste' was the data required for the insight."

  ## 8. What the Activity Cannot Reproduce (Facilitator Note)

  You must be frank about this in your own mind, and hint at it in the debrief.

  1.  **Guided Discovery:** The participants did not invent the modulo-3 invariant from a blank slate. They were given a Gallery. In a real research context, finding the invariant is the hard creative leap. Here, it is a classification task. You are simulating the *structure* of discovery, not the *creativity* of it.
  2.  **Facilitator Knowledge:** You are directing traffic with knowledge they lack. This creates a power asymmetry. You must ensure the Referee is empowered enough that you are not the sole source of truth during the search phase.
  3.  **No Self-Reference:** As noted in the debrief script, this is not Gödel's theorem proper. It is a simple invariant proof. Gödel requires the system to encode its own syntax. This session shows *metatheory*, not *self-reference*. Do not let participants conflate the two.
  4.  **The "Theatre":** You are performing ignorance. This is ethically necessary for the pedagogy but creates a distance. Acknowledge in the debrief that the "uncertainty" was real for them, even if the outcome was fixed for you.

  ## 9. The Invariant Gallery (Handout Content)

  *Ensure this matches your fixed material exactly.*

