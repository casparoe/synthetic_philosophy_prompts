answer: |-
  # Specification for a Theory of Rescue and Triage

  ## Part I: The List of Requirements

  The following requirements constitute the adequacy conditions for any theory intended to guide a rescue coordinator or hospital triage committee. They are derived from the cases, distinctions, and commitments provided. Each is labelled as either **Non-negotiable** (a condition for the theory to function in the intended institutional context) or **Camp Preference** (a philosophical commitment that is contested and may need to be sacrificed for coherence).

  ### A. Substantive Verdicts on Cases

  **1. The Aggregation Requirement**
  *   **Motivation:** Case (a) (One stranger vs five strangers). In a triage context, resources must be allocated to save the greater number when all else is equal. A theory that mandates flipping a coin here is operationally useless.
  *   **Status:** **Non-negotiable.** (While philosophically contested by non-aggregators, a triage protocol cannot function without it).

  **2. The Pareto Requirement**
  *   **Motivation:** Case (b) (Save A vs Save A and B). If an option exists where everyone saved in the first option is saved in the second, plus an additional person, and no one is worse off, the theory must select the second option.
  *   **Status:** **Non-negotiable.** (A requirement of minimal rationality).

  **3. The Constraint against Instrumentalisation**
  *   **Motivation:** Case (g) (Kill one healthy to save five sick). The theory must forbid actively killing an innocent person to harvest organs, even if it maximises lives saved.
  *   **Status:** **Non-negotiable.** (Legal and moral baseline for medical/rescue institutions).

  **4. The Impartiality Requirement**
  *   **Motivation:** Case (e) and (f) (Special obligations and Self-inclusion). A *coordinator* acts in an official capacity. The theory must not permit favouring one's own child or oneself over strangers when allocating public rescue resources.
  *   **Status:** **Non-negotiable** (for this specific institutional application). *Note: In a general moral theory, this would be a Camp Preference.*

  **5. The Risk Sensitivity Requirement**
  *   **Motivation:** Case (d) (One certain survival vs three at 1/3 chance). The theory must provide a method for comparing certain outcomes against probabilistic ones. It cannot simply declare them incomparable.
  *   **Status:** **Non-negotiable.** (Triage inherently involves uncertainty).

  **6. The Description Invariance Requirement**
  *   **Motivation:** Case (h) (1000 separate incidents vs one mass incident). The moral verdict must not depend on whether the situation is described as many small dilemmas or one large one, provided the physical facts (who lives/dies) remain identical.
  *   **Status:** **Non-negotiable.** (A requirement of logical consistency).

  ### B. Distinctions to be Respected

  **7. The Doing/Allowing Distinction**
  *   **Motivation:** Contrast (a) (Allowing to die) with (g) (Killing). The theory must explain why saving the five is permitted in (a) but killing the one is forbidden in (g), despite the net lives saved being identical.
  *   **Status:** **Camp Preference.** (Consequentialists reject this as morally fundamental; Deontologists insist upon it. To satisfy Requirements 1 and 3 simultaneously, the theory likely needs this, making it a necessary philosophical commitment).

  **8. The Claims vs Weight Distinction**
  *   **Motivation:** Distinguish between numbers acting as a tie-breaker between equal individual claims versus numbers acting as a aggregate weight that overrides a single claim.
  *   **Status:** **Camp Preference.** (Aggregativists prefer Weight; Contractualists prefer Claims/Tie-breaker).

  **9. The Ex Ante/Ex Post Coherence**
  *   **Motivation:** Case (d). The justification for a decision must hold up both at the moment of choice (ex ante) and in light of the outcome (ex post), without generating paradoxes where a correct decision leads to an impermissible outcome state.
  *   **Status:** **Non-negotiable.** (Required for accountability).

  ### C. Formal Constraints

  **10. The Determinacy Requirement**
  *   **Motivation:** Operational utility. The theory must return a specific verdict (Permitted/Required/Forbidden) for each case. It cannot declare cases "incomparable" or "indeterminate".
  *   **Status:** **Non-negotiable.** (A manual cannot advise "it is up to you" in hard cases).

  **11. The Composability Requirement**
  *   **Motivation:** Case (d) and general uncertainty. The theory must integrate with standard decision theory (probabilities, expected value) without collapsing into simple utilitarianism.
  *   **Status:** **Non-negotiable.**

  **12. The Metaphysical Transparency Requirement**
  *   **Motivation:** If the theory relies on a specific view of personhood (e.g., separateness of persons) to justify non-aggregation, it must state this explicitly.
  *   **Status:** **Non-negotiable.** (Intellectual honesty).

  ---

  ## Part II: Analysis of Incompatibilities

  You suspected that the demand to save the five in (a), the demand not to kill in (g), and the demand that claims not be aggregated pull against each other. This suspicion is correct. The list of requirements above contains a **trilemma**. You cannot satisfy all three of the following simultaneously without relying on a distinction that one of the "camps" will reject as arbitrary:

  1.  **Save the Five in Rescue (Requirement 1).**
  2.  **Forbid Killing in Harvesting (Requirement 3).**
  3.  **Treat Like Cases Alike / Description Invariance (Requirement 6).**

  **The Conflict:**
  If the justification for saving the five in (a) is that five claims outweigh one claim (Aggregation), then logically, five claims to life should outweigh one claim not to be killed in (g). To forbid (g) while permitting (a), you must invoke the **Doing/Allowing Distinction (Requirement 7)**.

  However, invoking the Doing/Allowing distinction creates tension with **Description Invariance (Requirement 6)**. In modern triage, "allowing to die" often involves the active withdrawal of treatment (turning off a ventilator), which is physically indistinguishable from "killing" in many descriptions. If the theory relies on a metaphysical distinction between *acting* and *omitting* to solve the trilemma, it risks failing Requirement 12 (Metaphysical Transparency) or Requirement 6 (Description Invariance), depending on how the action is described.

  Furthermore, **Non-Aggregation of Claims** (the view that one person's claim cannot be summed with another's to outweigh a third) is incompatible with **Requirement 1 (Save the Five)**. If claims do not aggregate, the single individual in (a) has a claim equal to any *individual* in the group of five. Without aggregation, there is no outweighing, only a tie. If the theory resolves the tie by saving the five, it is implicitly aggregating.

  **Conclusion on Satisfiability:**
  The list as a whole is **unsatisfiable** without making a controversial philosophical commitment. Specifically, you must choose between:
  *   **Abandoning Requirement 3:** Allowing the surgeon to kill (Utilitarianism).
  *   **Abandoning Requirement 1:** Refusing to mandate saving the five (Radical Non-Aggregation).
  *   **Abandoning Requirement 6:** Accepting that moral verdicts change based on whether the act is described as 'killing' or 'letting die', even if the physical outcome is identical (Dualism/Deontology).

  For a triage committee, **Requirement 3 (Do not kill)** and **Requirement 1 (Save the five)** are the operational non-negotiables. Therefore, the theory **must** adopt the **Doing/Allowing Distinction (Requirement 7)** as a foundational premise, acknowledging that this is a **Camp Preference** masquerading as a requirement to make the system work. You cannot have a coherent triage theory that is purely aggregative and purely rights-based simultaneously.

  ---

  ## Part III: The Most Exclusionary Requirement

  The single requirement that does the most to exclude otherwise popular theories is **Requirement 3: The Constraint against Instrumentalisation (The surgeon in (g) must not act).**

  **Reasoning:**
  *   **Excludes Act Utilitarianism:** This is the most dominant framework in policy and economics. It fails this requirement immediately, as it mandates killing the one to save the five.
  *   **Excludes Simple Aggregativism:** Any theory that sums value across persons without a side-constraint on rights fails here.
  *   **Pressure on Contractualism:** Even theories designed to respect individuals struggle here if they cannot explain why the complaint of the one harvested is stronger than the aggregated complaints of the five dying, without resorting to the Doing/Allowing distinction which they must then defend metaphysically.

  While **Requirement 1 (Save the Five)** excludes radical non-aggregators (like Taurek), these are rarely "popular" in institutional settings. **Requirement 3** excludes the default "common sense" of cost-benefit analysis, which is the primary competitor in public policy. It forces any adequate theory to be deontological or constrained-consequentialist, significantly narrowing the field.

  ---

  ## Part IV: Scorecard of Main Contenders

  Here is how the primary theoretical candidates fare against the specification.

  **1. The Aggregative View (Classical Utilitarianism)**
  *   **Performance:** Fails **Requirement 3** (Constraint against Instrumentalisation). It mandates the surgeon kill the healthy patient.
  *   **Performance:** Passes **Requirement 1** (Save the Five) and **Requirement 6** (Description Invariance) easily.
  *   **Verdict:** **Inadequate.** It is action-guiding but legally and morally impermissible for a triage committee.

  **2. The Non-Aggregative View (Numbers Do Not Count)**
  *   **Performance:** Fails **Requirement 1** (Save the Five). It typically mandates a coin toss in the 1 vs 5 case, as no individual claim outweighs another.
  *   **Performance:** Fails **Requirement 10** (Determinacy). If claims are incomparable, the theory cannot issue a command.
  *   **Verdict:** **Inadequate.** It fails the operational standard of a rescue manual.

  **3. The Tie-Breaker View (Numbers count only when claims are equal)**
  *   **Performance:** Passes **Requirement 1** in simple cases (1 vs 5 strangers).
  *   **Performance:** Fails **Requirement 5** (Risk Sensitivity) and **Requirement 2** (Pareto). If survival probabilities differ (Case d), claims are not "equal." If the view cannot aggregate probabilities, it cannot resolve the case. It also struggles with Case (c) (Overlap), as it is unclear whose claims are being weighed.
  *   **Verdict:** **Fragile.** It works for simple cases but collapses under the uncertainty required in **Requirement 11** (Composability).

  **4. The Contractualist Account (What we owe to each other)**
  *   **Performance:** Passes **Requirement 3** (Do not kill). It grounds the prohibition in the individual's reasonable rejection of a principle that allows them to be harvested.
  *   **Performance:** Passes **Requirement 1** (Save the Five) by arguing that the principle "save the greater number" is one that no one could reasonably reject *ex ante*.
  *   **Performance:** Struggles with **Requirement 6** (Description Invariance). Contractualism often relies on the specific structure of the choice to determine which complaints are relevant. In Case (h) (1000 incidents vs 1 mass incident), the "grouping" of complaints can change the verdict, violating description invariance.
  *   **Performance:** Struggles with **Requirement 10** (Determinacy). It often yields "permissible" rather than "required," leaving the coordinator without a strict order.
  *   **Verdict:** **Best Available, but Flawed.** It is the only contender that respects the Constraint against Instrumentalisation while attempting to justify Saving the Five. However, to meet the **Determinacy** and **Description Invariance** requirements, it must be hardened into a rule-based system that risks losing its philosophical nuance.

  **Summary Recommendation:**
  To meet the standard of adequacy for a triage committee, you must adopt a **Constrained Aggregative** model. You must accept **Requirement 7 (Doing/Allowing)** as a brute axiom to resolve the trilemma between Saving the Five and Not Killing. You must acknowledge that this violates pure Description Invariance in hard medical cases (withdrawal of treatment), but accept this as the cost of satisfying the non-negotiable legal constraints. Any theory that attempts to derive the Doing/Allowing distinction purely from aggregation or individual claims without stating it as a foundational rule will fail the **Metaphysical Transparency** requirement.
