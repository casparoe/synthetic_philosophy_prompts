answer: |-
  **MEMORANDUM**

  **TO:** Committee on Student Accommodations
  **FROM:** Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Petition for AI-Assisted Examination Accommodation

  **Recommendation**

  I recommend that the Committee **grant the accommodation request subject to specific technical and functional conditions.** Specifically, the student should be permitted to use the device for information storage and retrieval only. The generative completion features must be disabled during the examination. Furthermore, the device must be capable of functioning in an offline mode to ensure reliability.

  If the device cannot be technically restricted to retrieval-only or cannot operate without cloud connectivity, the Committee should deny this specific request but immediately offer an alternative accommodation that achieves the same goal (e.g., a verified personal "cheat sheet" or open-note examination format).

  **Action Items**

  1.  **Notification to Student:** Inform the student that her memory impairment is recognized and accommodated, but the generative features of the device constitute a fundamental alteration of the skills being assessed. She must demonstrate to the Disability Services Office one week prior to the exam that the generative functions are disabled and that the device operates offline.
  2.  **Notification to Registrar:** Exams for this student are to be proctored with the understanding that the device is authorized strictly as a memory aid, not a writing assistant. Proctors should verify the device is in "offline/retrieval-only" mode before the exam begins.
  3.  **Review Date:** This accommodation is provisional. We should review the efficacy and integrity of this arrangement at the end of the current term.

  **Reasoning**

  This case requires us to balance two obligations: providing equitable access for a documented disability and maintaining the academic integrity of our assessments. The core policy question is whether this device functions as a *prosthetic* for a deficit (which we should allow) or a *tool* that performs the task being tested (which we should not).

  **The Extended Mind Argument**
  The strongest argument for granting the request as submitted relies on the "Extended Mind" thesis. This view suggests that if a tool is reliable, always available, and automatically trusted, it becomes part of the user's cognitive system. For this student, the device is not merely a notebook; she reports that her ability to organize thoughts collapses without it. If we accept that the device is functionally part of her memory system, denying it would be akin to denying a student with poor vision the right to wear glasses. To reject this would be to discriminate against her based on the *type* of hardware her brain relies on.

  I find this argument compelling regarding the **storage and retrieval** functions of the device. If the student's impairment prevents her from internally recalling facts or concepts that she has studied, a searchable database acts as a corrective lens for her memory. It restores her access to information she possesses but cannot retrieve. In this specific capacity, the device compensates for a deficit without performing the cognitive labor of the exam.

  **The Distinction: Retrieval vs. Generation**
  However, the argument fails when applied to the **generative completion** features. There is a critical difference between retrieving a fact and generating a sentence.
  *   **Retrieval** accesses stored data. This compensates for the memory impairment.
  *   **Generation** synthesizes data into new phrasing or arguments. This performs the skill the exam is designed to assess.

  Closed-book examinations in our discipline are not designed solely to test whether a student can access information; they test the ability to independently organize, synthesize, and articulate that information under time pressure. The student's concession that she "sometimes cannot tell whether a sentence she has written originated with her or with the device" is decisive here. If she cannot distinguish her own reasoning from the device's output, the device is not merely supporting her cognition; it is substituting for it. Allowing generative completion would be equivalent to allowing a student to bring a tutor into the exam room to whisper suggestions. This fundamentally alters the skill being assessed.

  **Reliability and Integration**
  Finally, even if we accept the Extended Mind argument, this specific device fails the criteria for cognitive integration due to its reliability. For an external tool to be considered part of the mind, it must be as reliable as biological memory. The student notes the device is cloud-based and occasionally unavailable. If her cognitive system "collapses" when the network lags, the device is not a stable prosthetic; it is a fragile crutch. An accommodation that introduces a significant risk of technical failure during an exam is not in the student's best interest, nor does it guarantee a level playing field.

  **Conclusion**
  We must accommodate the memory impairment without outsourcing the reasoning. By restricting the device to retrieval-only and requiring offline functionality, we honor the spirit of the Extended Mind argument (treating the device as a memory prosthetic) while upholding the integrity of the examination (ensuring the student performs the synthesis and composition). This approach respects the student's lived experience of her disability without compromising the validity of the degree she is pursuing.
