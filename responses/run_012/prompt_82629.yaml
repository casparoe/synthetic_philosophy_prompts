answer: |-
  Here is a definite design for a 90-minute active-learning session. It is built to resolve your debate by forcing students to experience the **Cantillon Effect** (the distributional consequence of *where* money enters) before they experience the **Quantity Theory** (the long-run price adjustment).

  ### Design Position
  **The game tests Hume's "Interval" argument, not his long-run neutrality.**
  Your friend is technically right about the *endpoint* (long-run neutrality), but wrong to dismiss the *transition*. Hume's specific contribution to political economy is the insight that money is **not** neutral in the short run because it enters the economy at specific points, altering relative prices and real output before the general price level adjusts. This game is designed to prove that the *path* of money matters more than the *amount* of money for individual welfare.

  I have cut the two-country trade mechanic. With 20 students, splitting the class into two economies creates illiquid markets that confuse the price mechanism. It is better to run one robust domestic market that clearly demonstrates the distributional shock of money injection. You can lecture on the trade balance/self-correction mechanism during the debrief using the logic they just learned from the domestic market.

  ---

  ### Activity: "The Hume Interval"

  **Time:** 90 Minutes
  **Class Size:** 20 Students
  **Materials:**
  *   **Money:** 200 Poker Chips (or laminated paper circles).
  *   **Goods:** 100 Index Cards (cut in half to make 200 "Units").
  *   **Price Tags:** 10 Sticky Notes per Seller.
  *   **Payoff:** 1 Bag of Halloween-sized candy (or equivalent).
  *   **Board:** Whiteboard to track "Market Price Index."

  #### 1. Roles & Setup (15 Minutes)
  Divide the class into two equal groups:
  *   **10 Merchants (Sellers):** Stand at the front or sides of the room. They hold the **Goods** (Index Cards).
  *   **10 Households (Buyers):** Sit in the center. They hold the **Money** (Poker Chips).

  **The Rules of Wealth (Write on Board):**
  1.  **Buyers:** Your goal is to hold **Goods** at the end of the game. Each Good = 1 Piece of Candy. Chips are worthless at the end.
  2.  **Merchants:** Your goal is to hold **Chips** at the end of the game. Every 5 Chips = 1 Piece of Candy. Unsold Goods are worthless.
  3.  **Trading:** Merchants must post a price per Good on a Sticky Note *before* each round starts. Prices cannot change during the round. Buyers approach Merchants and trade Chips for Goods.
  4.  **No Collusion:** No sharing chips or goods between students.
  5.  **Perishability:** You must spend your budget each round. Unspent chips do not carry over (this forces velocity). *Correction for Humean realism:* Actually, let chips carry over, but Goods perish. **Revised Rule:** Chips carry over. Goods must be bought each round to count for candy (simulates consumption). *Wait, simpler:* **Goods are durable.** Chips carry over. Final payoff is based on final holdings.
      *   *Final Decision for Clarity:* **One-shot payoff.** The game has 3 Rounds. At the very end, we count holdings.
      *   **Buyers:** Candy for Goods held.
      *   **Merchants:** Candy for Chips held (5 chips = 1 candy).
      *   **Constraint:** Merchants start with 5 Goods each (50 Total). Buyers start with 10 Chips each (100 Total).
      *   **Equilibrium Price:** 2 Chips per Good. (100 Chips / 50 Goods).

  #### 2. Round 1: The Baseline (15 Minutes)
  *   **State:** Stable Economy.
  *   **Endowment:** Buyers have 10 Chips. Merchants have 5 Goods.
  *   **Instruction:** Merchants, write your price on a sticky note. I suggest 2 Chips. Buyers, go buy as many Goods as you can.
  *   **Action:** 5 Minutes of trading.
  *   **Result:** Prices should settle around 2. Most Buyers get 5 Goods. Most Merchants get 10 Chips.
  *   **Reset:** Collect all Chips and Goods. Return everyone to starting endowment (10 Chips, 5 Goods). *Why? To ensure a clean slate for the shock.*

  #### 3. Round 2: The Injection (The "Interval") (20 Minutes)
  *   **State:** Monetary Expansion.
  *   **The Shock:** Quietly pull 5 specific Buyers aside (or draw names). Give them **+10 Chips** each.
      *   **5 "Rich" Buyers:** 20 Chips.
      *   **5 "Poor" Buyers:** 10 Chips.
      *   **Merchants:** Still 5 Goods each. **Crucial Rule:** Merchants must keep prices **fixed at 2 Chips** (Sticky Prices). Tell them: "Contracts are signed. You cannot change prices this round."
  *   **Action:** 5 Minutes of trading.
  *   **The Squeeze:**
      *   Rich Buyers want 10 Goods (20 chips / 2 price).
      *   Poor Buyers want 5 Goods (10 chips / 2 price).
      *   Total Demand: 75 Goods. Total Supply: 50 Goods.
      *   **Scarcity:** There are not enough goods. Rich Buyers will rush to Merchants. Poor Buyers will find empty stalls.
  *   **Outcome:** Rich Buyers likely buy out the Merchants. Poor Buyers end up with Chips but no Goods.
  *   **Reset:** Collect Goods/Chips. Return to baseline endowment (10 Chips, 5 Goods). *Do not redistribute the extra chips yet.*

  #### 4. Round 3: The Adjustment (Neutrality) (20 Minutes)
  *   **State:** Inflationary Equilibrium.
  *   **The Shock:** The +10 Chips from Round 2 are now **permanent**.
      *   **5 "Rich" Buyers:** 20 Chips.
      *   **5 "Poor" Buyers:** 10 Chips.
      *   **Merchants:** 5 Goods.
      *   **Price Rule:** Merchants can now set **any price** they want.
  *   **Instruction to Merchants:** "You know some Buyers have extra chips. You know Goods are limited. Set a price that maximizes your Chip revenue."
  *   **Action:** 5 Minutes of trading.
  *   **Expected Outcome:**
      *   Merchants realize money is plentiful. They raise prices to **4 Chips**.
      *   Rich Buyers (20 chips) buy 5 Goods.
      *   Poor Buyers (10 chips) buy 2.5 Goods (round to 2).
  *   **Final Tally:**
      *   Rich Buyers: 5 Goods (Round 2) + 5 Goods (Round 3) = 10 Goods.
      *   Poor Buyers: 0 Goods (Round 2) + 2 Goods (Round 3) = 2 Goods.
      *   Merchants: High Chip revenue in Round 3, but Chips convert to Candy at fixed rate.

  #### 5. Payoff & Debrief (20 Minutes)
  Distribute candy based on final holdings. Then, map the experience to Hume.

  ---

  ### The Debrief Script (Mapping Game to Text)

  **1. The Endpoint (Your Friend's View)**
  *   **Ask:** "In Round 3, what happened to prices?" (They doubled).
  *   **Ask:** "Did the country get richer in Round 3?" (No, same 50 Goods existed).
  *   **Hume Connection:** This is the Quantity Theory. "Money is... nothing but the oil which renders the motion of the wheels more smooth and easy." In the long run, more money = higher prices, not more goods. Your friend is right about Round 3.

  **2. The Interval (Your View)**
  *   **Ask:** "Who got candy in Round 2?" (The Rich Buyers).
  *   **Ask:** "Why did the Poor Buyers starve in Round 2? They had chips." (Prices were sticky; Rich Buyers spent first).
  *   **Hume Connection:** This is Hume's specific insight against pure neutrality. "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry."
  *   **The Kicker:** The Rich Buyers didn't just get nominal wealth; they got **real goods** at the expense of the Poor Buyers. The *path* of the money (who got it first) determined real wealth distribution.

  **3. The Trade Essay (The Cut Content)**
  *   **Lecture:** "We didn't simulate two countries, but imagine the 'Rich Buyers' were a foreign nation exporting goods to us. If we hoard money (chips), prices rise, and we can't buy goods. Hume argues money flows naturally to where industry is. If a country tries to hoard gold, prices rise, exports become too expensive, and the gold flows out automatically. You don't need policy to fix the balance of trade; the price level does it."

  **4. Limitations (Honesty Check)**
  *   **Time:** Hume's "interval" took years in the 18th century. We did it in 5 minutes.
  *   **Expectations:** In the game, Merchants knew prices would rise in Round 3. In reality, if inflation is unexpected, the stimulus lasts longer.
  *   **Output:** In the game, Goods were fixed (50 cards). Hume argued that in the interval, *employment* rises (more goods get made). We couldn't simulate labor supply elasticity, only distribution.

  ---

  ### Predictable Failure Points & Fixes

  **1. The "Fairness" Refusal**
  *   **Risk:** The "Rich" Buyers in Round 2 might feel guilty buying all the goods, or Merchants might try to sell to Poor Buyers out of pity.
  *   **Fix:** Frame the injection as **Random Luck** (draw names from a hat). Emphasize: "You are not people right now; you are economic agents. Your job is to test the system, not be nice."
  *   **Fix:** Make it competitive. "The top 3 Buyers get extra candy."

  **2. Price Haggling**
  *   **Risk:** Students ignore sticky notes and negotiate verbally, bypassing the price stickiness constraint.
  *   **Fix:** Enforce the "Posted Price" rule strictly. If a Merchant sells below their posted price, disqualify the trade. If they sell above, disqualify. The Sticky Note is the contract.

  **3. Merchant Confusion on Payoff**
  *   **Risk:** Merchants might think Chips are worthless (since Buyers redeem Goods for candy) and refuse to sell in Round 3.
  *   **Fix:** Reiterate the redemption rate constantly. "Merchants, chips are your candy. Buyers, goods are your candy." This creates the natural conflict: Buyers want low prices, Sellers want high prices.

  **4. The "Neutrality" Doesn't Land**
  *   **Risk:** If Merchants don't raise prices in Round 3, the inflation point is lost.
  *   **Fix:** Prompt them between Round 2 and 3. "Merchants, you saw people had extra chips last round. You have limited goods. Do you want to sell 5 goods for 10 chips again, or can you get more?"

  ### Why This Design Wins the Argument
  This activity validates your friend's claim (Round 3 shows money is a veil) but prioritizes your claim (Round 2 shows the veil lifts during the transition). By making the "Poor Buyers" end up with significantly less candy despite having the same labor/endowment as the "Rich Buyers," you demonstrate that **monetary injection is never neutral in distribution.**

  Hume's essay isn't just about price levels; it's about the *political economy* of who holds the printing press (or the gold mine). This game makes that visible.
