      *   *Decision:* Cut the two-country trade element. Why? 20 students is too small to split into two economies and still have liquid markets *and* cover the money injection mechanic deeply in 90 minutes. Adding trade balances complicates the core "Money Veil vs. Real Effects" debate. Focus on the *internal* distribution first. The user can mention the trade essay in the debrief, but the game should nail the "Interval" argument.
      *   *Position:* The game tests Hume's *non-neutrality in the transition*. It proves the friend wrong (it's not *just* a lag; the lag creates winners/losers and real output changes) but validates the friend's endpoint (eventually, prices catch up).

