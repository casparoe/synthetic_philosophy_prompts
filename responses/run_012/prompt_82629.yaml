  2.  **Deconstruct Hume's Argument:**
      *   *Long Run:* Money is neutral. Doubling the money supply doubles prices. Real wealth depends on labor/commodities, not gold/silver.
      *   *Short Run (The "Interval"):* Money enters at a specific point. Prices don't jump instantly. Early receivers spend at old prices -> increased demand -> increased production/employment. Late receivers face higher prices before their income rises.
      *   *Trade Balance:* Money flows to where goods are. Hoarding money kills industry; spending it stimulates it. Balance of trade self-corrects (price-specie-flow mechanism).

  3.  **Design Challenge:**
      *   How to simulate "sticky prices" and "distributional injection" in 90 minutes with 20 students?
      *   If everyone trades freely, prices adjust too fast (efficient market hypothesis kills the lesson).
