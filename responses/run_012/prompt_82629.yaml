          1.  Baseline (Stable money, stable prices).
          2.  Injection (Money given to *only* Consumers or *only* Producers).
          3.  Equilibrium (Prices adjust, real value normalizes).
      *   **Stickiness:** Sellers must post prices *before* the round starts. They can't change them mid-round. This creates the "lag."
      *   **Payoff:** Candy based on *real* goods consumed/produced, not nominal chips held.

