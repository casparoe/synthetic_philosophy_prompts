      *   *Addressing the "Stretch" (Individual vs. Communal):* This is the meat of the response. Nietzsche is bourgeois/individualist. Faulkner is Southern/Gothic/Collective. The "health" Nietzsche seeks is impossible when history is blood/race.
      *   *The "Critical" Problem:* Nietzsche's critical history is about *judging* to *end* the past. Quentin/Shreve judge to *resurrect* it. That's a fundamental divergence.
      *   *Scenes:* Select the specific passages identified in step 4. Explain *why* they work for the comparison.

