      *   *Scene 2 (Rosa/Antiquarian):* Rosa's opening monologue or her visit to the mansion. Let's go with her opening narration to Mr. Compson. It shows the preservation of grievance.
      *   *Scene 3 (Quentin/Shreve/Critical):* The dorm room reconstruction. Specifically, the moment they "become" Bon and Henry. This shows the danger of critical history becoming possession.

  5.  **Drafting the Response (Iterative refinement):**

