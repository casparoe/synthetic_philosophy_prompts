          2.  **Pasture Management:** Pastures aren't wild. They are managed. Predators (coyotes, wolves) are often culled to protect cattle. This adds deaths not accounted for in simple "harvest death" models.
          3.  **Crop Types:** Not all crops are equal. Perennials, no-till farming, and urban agriculture reduce field deaths.
          4.  **Feed Conversion:** Most beef isn't 100% grass-fed. Even grass-fed often gets grain finishing.
          5.  **Sentience & Suffering:** Field animals (mice, voles) vs. Farm animals (cows, chickens). Cows live longer but suffer intensely at slaughter. Field animals die quickly (maybe) but in huge numbers. Comparing suffering is hard.

