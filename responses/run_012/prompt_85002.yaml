answer: |-
  The most robust principle available is a refined version of your reliance account: a convention generates a moral obligation only when violating it imposes a non-negligible burden on others who reasonably expected compliance. This formulation requires two specific clauses to handle your cases. The "non-negligible burden" clause is forced by the one-word queue cut; without it, any delay, however trivial, would be immoral, collapsing the distinction between manners and morals. The "reasonably expected" clause is forced by the midnight jaywalking case; since no drivers are counting on the road being empty, there is no violated expectation to ground the wrong.

  This principle handles the escalator well. While the side chosen is arbitrary, the coordination itself is not. By standing on the left, you impose a non-negligible efficiency cost on those reasonably expecting the right lane to be clear for passing. The burden is real, even if the rule is arbitrary. However, the principle struggles with your visitor cases regarding knowledge. If you enter a home with shoes on unaware of the convention, the hosts cannot reasonably expect compliance from you. Thus, the act is not morally wrong, though you may still have a duty to rectify it once informed. If you could have known—say, via a visible sign or prior cultural research—the expectation becomes reasonable, and the obligation binds. This distinguishes blamelessness from objective wrongness; you aren't blameworthy if ignorant, but the act itself remains burden-imposing once the convention is known.

  There is, however, a significant verdict this principle cannot save: your intuition on tipping. In a culture where tips constitute wages, waiters reasonably expect them and are financially worse off without them. The principle dictates that stiffing the waiter is morally wrong. Your verdict that it is "not wrong" suggests you view the obligation as structural rather than individual, or perhaps you believe the reliance is illegitimate because the system is exploitative. The reliance principle treats the convention as a given baseline; it cannot easily accommodate the idea that one might opt out of an unjust system without harming the individual worker caught within it. To save this verdict, you would need to add a clause excluding obligations derived from unjust institutions, which complicates the simplicity of the harm account.

  The crux of the matter rests on whether coordination without tangible harm can ever be binding. I would abandon this harm-based principle if presented with a case where a convention feels morally binding despite zero negative consequence for anyone. Consider a secret religious ritual known only to practitioners, where breaking it causes no pain, no reliance violation, and no social friction because no one ever finds out. If you feel that breaking such a rule is still morally wrong—perhaps due to a duty of fidelity or respect for the tradition itself—then harm is insufficient. Conversely, if you agree that secret violations are permissible, then harm remains the gold standard. Your escalator intuition suggests you value coordination itself, but your jaywalking intuition suggests you value outcomes. Resolving whether the friction of coordination counts as a "burden" sufficient for moral obligation is the precise tension your seminar should explore.
