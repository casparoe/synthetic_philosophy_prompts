answer: |-
  You have identified one of the central, unresolved tensions in legal and political theory. There is no single, settled word for this exact combination because the combination itself is the subject of intense debate. If there were a settled term, it would imply we have agreed on whether the move is legitimate or corrupt. We haven't.

  However, in political theory, legal philosophy, and transitional justice literature, this cluster of moves is discussed under a few overlapping headers. The closest established term is **"Victor's Justice,"** but that describes the *power dynamic*, not the *rhetorical mechanism* you're isolating.

  To give you the "carve out" you asked for, we need to separate the legal mechanism, the political function, and the rhetorical shield.

  ### 1. The Label Problem: Settled vs. Disputed

  **Settled:** There is no single noun that captures "retroactive enforcement + selective application + moral universalizing to block hypocrisy charges."
  **Disputed:** Whether this move is a necessary feature of establishing justice after tyranny or a corruption of the rule of law.

  If you need a term to use in a paper, **"Victor's Justice"** is the standard political science term, but you must qualify it. A more precise descriptive phrase used in critical legal studies is **"Retroactive Moral Universalization."**

  Here is the breakdown of the move you are seeing.

  ### 2. Carving Out the Move: Three Layers

  You are describing a maneuver that operates on three levels simultaneously. Most terms only catch one level.

  **Layer 1: The Legal Move (Ex Post Facto Naturalism)**
  *   **Standard *Ex Post Facto*:** "We are making a new law today and punishing you for yesterday." (Honest, but usually forbidden in liberal legal systems).
  *   **Your Observation:** "We are not making a new law. We are recognizing that this was *always* a crime against universal morality, even if our written codes didn't say so."
  *   **The Theory:** This relies on **Natural Law** (there are higher moral laws than written statutes) over **Legal Positivism** (law is only what is written and enacted). At Nuremberg, this was codified as "Crimes Against Humanity."
  *   **Why it matters:** It allows the court to bypass the principle of *nullum crimen sine lege* (no crime without law).

  **Layer 2: The Political Move (Selective Accountability)**
  *   **Standard Scapegoating:** Picking a random target to punish to calm the public.
  *   **Your Observation:** Punishing the *losers* for acts the *winners* also committed (e.g., Allied submarine warfare vs. German U-boats; Allied bombing of cities vs. German V2 rockets).
  *   **The Term:** This is the core of **"Victor's Justice."** It implies the law is applied based on who holds power, not on the act itself.

  **Layer 3: The Rhetorical Move (Tu Quoque Immunity)**
  *   **The Defense:** The accused says, "You did X too." (*Tu Quoque* / "You Also").
  *   **Your Observation:** The accuser says, "X is *inherently* evil. The fact that we did it doesn't make it legal; it just means we haven't been judged yet. But you *are* being judged."
  *   **The Function:** By framing the act as a violation of *universal* morality rather than *specific* treaty law, the accuser makes their own complicity irrelevant to the defendant's guilt. It turns the accuser's hypocrisy into a separate moral failing that doesn't exonerate the accused.

  **The Combined Concept:**
  If you need a phrase to name this specific combo, call it **"Immunized Retroactive Universalization."**
  *   **Retroactive:** Punishing past acts.
  *   **Universalization:** Claiming the norm was always binding (natural law).
  *   **Immunized:** The universal claim blocks the hypocrisy (*tu quoque*) defense.

  ### 3. Drawing the Line: Invented Norm vs. Shared Norm

  You asked where the line falls between "applying a norm we all genuinely already shared" and "inventing a norm and backdating it." This is the hardest question in legal philosophy.

  **The Radbruch Formula (The Standard Attempt)**
  German legal philosopher Gustav Radbruch, writing immediately after WWII, proposed a test to distinguish legitimate retroactivity from tyrannical invention.
  *   **The Rule:** Positive law (written law) should usually be followed. *However*, if a written law contradicts justice to an **"intolerable degree,"** it is not law at all ("Unrecht ist kein Gesetz").
  *   **The Line:** If the act was "intolerably unjust" (e.g., genocide), you can punish it retroactively because no reasonable person could think it was legal. If the act was merely "unwise" or "policy-disagreement" (e.g., economic sanctions, propaganda), you cannot punish it retroactively.

  **The Problem with the Line**
  This is **highly disputed**.
  *   **Critics (like Carl Schmitt):** Argue the Radbruch Formula is subjective. Who decides what is "intolerable"? Usually, the guy with the gun. This makes the "line" just a mask for power.
  *   **Defenders (like Hans Kelsen):** Argue that without this move, regimes could legalize atrocities (like the Holocaust) and then claim immunity because they followed their own domestic laws.

  **Practical Markers of the "Invented Norm"**
  In political theory, scholars look for these signs to tell if a norm is being invented rather than enforced:
  1.  **Specificity:** Was the prohibition vague ("aggressive war") or specific ("invading Poland on date X")? Vague norms are easier to backdate.
  2.  **Consistency:** Did the accusers punish *their own* for similar acts *after* the trial? If they never update their own behavior to match the "universal" norm they enforced, it suggests the norm was invented for the trial.
  3.  **Foreseeability:** Could a reasonable person at the time have known this was criminal? (This is the *ex post facto* standard).

  ### 4. What is Disputed? (For your course)

  Since you are in a political theory course, you need to know where the fighting is.

  **1. Was Nuremberg Law or Politics?**
  *   **Settled:** It was both.
  *   **Disputed:** Was the *mixture* legitimate?
      *   **The Liberal View:** It was a necessary exception to establish a new international order. The "retroactivity" was a one-time cost to banish the idea that "following orders" is a defense for atrocity.
      *   **The Realist/Critical View:** It was "Victor's Justice" that entrenched a hierarchy of nations. By declaring "aggressive war" a crime *after* the war started, the Allies criminalized the Axis strategy while legitimizing their own nuclear and firebombing campaigns.

  **2. The *Tu Quoque* Precedent**
  *   At Nuremberg, Admiral Dönitz argued the Allies committed unrestricted submarine warfare too.
  *   **The Ruling:** The tribunal agreed but refused to assess his sentence based on it.
  *   **The Dispute:** Legal scholars still fight over whether this was a wise compromise or a corruption of justice. It set a precedent that **complicity does not invalidate jurisdiction**, which is exactly the move you identified.

  **3. Transitional Justice Dilemma**
  *   In modern literature (e.g., Martha Minow, *Between Vengeance and Forgiveness*), this is framed as the **"Accountability vs. Stability"** trade-off.
  *   If you *don't* use Retroactive Moral Universalization, you let monsters go free because they wrote the laws.
  *   If you *do* use it, you undermine the Rule of Law by showing that law is malleable to the victors.
  *   **Current Consensus:** There is no consensus. Modern tribunals (ICC, Rwanda, Yugoslavia) try to avoid this by having stricter statutes *before* crimes occur, but they still face accusations of selective enforcement (e.g., focusing on Africa while ignoring US/Europe actions).

  ### Summary for your Analysis

  If you are writing about this, do not look for a single word that solves it. Instead, frame it as the **"Legitimacy Paradox of Transitional Justice."**

  *   **The Move:** Retroactive Moral Universalization.
  *   **The Function:** To bypass *nullum crimen sine lege* and immunize against *tu quoque*.
  *   **The Risk:** It collapses the distinction between **Law** (rules we agree to) and **Morality** (truths we discover), allowing power to dress itself up as truth.
  *   **The Defense:** Without it, "Law" becomes a shield for atrocity.

  The pattern you see "everywhere" is the tension between **Legal Positivism** (rules are rules) and **Natural Law** (some things are wrong regardless of rules), weaponized by political power. The specific rhetorical trick of using Natural Law to block hypocrisy charges is the mechanism that allows the transition from one regime to another without admitting the new regime is also flawed.

  **Recommendation:** If you need a citation for the "complicity" aspect, look up the **"Dönitz Defense"** at Nuremberg. If you need the theoretical framework, look up **Gustav Radbruch** (for the justification) and **Carl Schmitt** (for the critique of it as political weaponization).
