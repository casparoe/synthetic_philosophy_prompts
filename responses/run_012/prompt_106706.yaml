answer: |-
  1. 'The line, unpacked'

  1.  **The Honesty Claim:** This reading suggests the historian must simply refrain from fabricating evidence or knowingly lying about events that can be verified. It is a basic ethical demand that the account should not contradict the available proof without good reason.
  2.  **The Anti-Moralising Claim:** Here, the phrase means one should not judge historical figures by modern moral standards or act as a judge in a courtroom of the past. The historian describes what was done, but refuses to label actions as 'evil' or 'virtuous' based on contemporary values.
  3.  **The Anti-Partisanship Claim:** This implies the historian must suppress their own political or religious biases when selecting and arranging material. The goal is to prevent the narrative from becoming propaganda for a specific party, nation, or ideology current in the historian's own time.
  4.  **The Self-Evident Facts Claim:** This stronger reading asserts that if you gather enough reliable documents, the story will arrange itself without the need for narrative shaping or theoretical frameworks. It assumes facts have an inherent meaning that shines through clearly once the dust of bias is swept away.
  5.  **The God's-Eye View Claim:** The most radical interpretation is that the historian can access reality directly, unmediated by language, culture, or the limitations of human perception. It claims there is a single, objective truth about the past that can be recovered exactly as it happened, independent of the observer.

  2. 'Verdicts'

  1.  This is a platitude; nobody argues historians should lie, though disagreements exist over what counts as proof.
  2.  This is a live dispute; some argue moral clarity is necessary, while others insist on contextual neutrality.
  3.  This is a live dispute; total neutrality is the ideal, but most admit complete elimination of bias is impossible.
  4.  This is plainly false; facts require selection and arrangement, which are themselves interpretive acts.
  5.  This is plainly false; epistemologically, we cannot step outside our own minds to view reality purely.

  3. 'What my mate actually needs'

  Your mate is relying on the fourth claim, the idea that facts speak for themselves without needing a narrative structure. He wants the licence to present a selection of documents or events as 'just what happened', shielding himself from the accusation that he's pushing a specific angle. However, this is the weakest link in the chain, because choosing which facts to show and which to ignore is already an interpretation, meaning his 'neutral' pile of facts is actually a story in disguise.

  4. 'What the original fella probably meant'

  The bloke in question was Leopold von Ranke, and he likely didn't mean the crude positivism your mate suggests. When Ranke wrote *wie es eigentlich gewesen*, the word *eigentlich* carried a weight closer to 'essentially' or 'in its proper nature', influenced by German Idealist philosophy. He believed every historical epoch had an inner spiritual truth immediate to God, and the historian's job was to uncover that deeper essence through rigorous source criticism, not merely to pile up dry facts without thought.
