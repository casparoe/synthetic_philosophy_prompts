prompt: |-
  Me and a friend have been going around in circles on revealed preference and I'd like you to just give me a number instead of the usual it depends on how you read it.

  The claim: fitting a preference ordering to someone's choices gives you at best a redescription of those choices, and never an estimate of some independent fact about what the person actually wants. Call that the deflationary reading. I want your credence that the deflationary reading is true.

  Don't just give me the number. Decompose it into the sub-questions it actually rests on, with a rough probability and one line of justification for each. At minimum I think it has to include: (i) whether preferences are the kind of thing that can exist apart from choice at all, a functional or mental state, a disposition, or nothing over and above behavior; (ii) conditional on there being such a state, whether real choice data can identify it, or whether the estimate talk is a metaphor we can't operationalize; (iii) whether the fact about what she wants is even well defined for an agent whose tastes drift or who is better modeled as a committee of time-slices; (iv) how much of the apparent disagreement is verbal, i.e. the probability that the right answer is that there's no fact of the matter and the two readings are notational variants; (v) whether standard welfare economics, which treats choice as a proxy for well-being, quietly presupposes the anti-deflationary reading, and whether that counts as an argument for it; (vi) whether it matters that utility gets used both for the ordinal index in a representation theorem and for something like how well things go for a person, and whether running those two senses together is what makes the deflationary claim feel either obviously true or obviously false. Add anything I'm missing, and tell me how the pieces combine.

  Three cases I keep coming back to, which you should say something about if they cut the number: a woman who says she prefers A to B, reliably takes B when nobody's watching, and takes A when someone she wants to impress is in the room; someone whose choices cycle A over B, B over C, C over A, stably and predictably; and someone with a real self-control problem who sincerely says she prefers the salad and orders the cake every time. Is the deflationary reading supposed to say these people have no preferences, or that they have preferences we just can't read off? Those seem like very different prices to pay and I suspect alot of the credence swings on which one you're forced into.

  I'm sitting at about 0.35 that the deflationary reading is true. Tell me where that's wrong if you think it is. And tell me what would actually move your number, the argument or consideration that would flip you, and where in your own decomposition you're most likely to be fooling yourself.
