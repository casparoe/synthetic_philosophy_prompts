  **1. The Contextual Welfare Principle**
  *   **Formulation:** Selection is permitted if the trait does not constitute a net harm to the child *within their specific upbringing environment*. Welfare is not assessed against a general population norm, but against the child's likely lived experience.
  *   **Application to Track Record:**
      *   *Case 2 (Deafness):* Approved because, in a signing community, deafness is not a harm.
      *   *Case 3 (Height):* Refused because height is a social advantage, not a welfare necessity, and carried medical risk.
