      *   *Case 1 (Fatal Disorder):* This is the outlier. Under this rule, selecting *against* a fatal disorder should be approved. The refusal suggests a jurisdictional limit: perhaps the committee only adjudicates 'grey areas' where welfare is not plain.
  *   **Prediction for New Case:** **Approve.** The context (signing community) neutralises the harm of deafness.

  **2. The Parental Sovereignty within Bounds Principle**
  *   **Formulation:** Parents are entitled to select for traits that align with their way of life, provided the selection does not inflict severe medical harm or permanently curtail the child's future autonomy.
