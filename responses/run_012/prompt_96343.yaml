  **The Test Case**

  To distinguish between the leading candidate rules (specifically to test whether 'Contextual Welfare' or 'Parental Sovereignty' is dominant), the committee should consider an application to **select for dwarfism**.

  **The Scenario:** Two parents with dwarfism, belonging to a community of people with dwarfism, apply to select an embryo with the same condition. They argue the child will be culturally accommodated, just as in the deafness case.

  **What the Verdict Would Reveal:**

  *   **If Approved:** This supports **The Parental Sovereignty Principle**. It suggests that if parents can argue a 'way of life' accommodation, the committee will defer, even if the trait involves physical limitations that objectively restrict functioning more than deafness does. It implies Case 2 was not about the unique nature of deafness, but about parental rights.
  *   **If Refused:** This supports **The Contextual Welfare Principle**. It would reveal that the committee views deafness as a unique exception (a sensory difference that is linguistically neutralisable) whereas dwarfism involves physical constraints that objectively limit functioning regardless of community support. This would confirm that 'community fit' is secondary to an objective assessment of functional welfare.

  Given the committee's refusal in Case 4 (suggestibility) despite community arguments, I suspect they would **Refuse** the dwarfism application. This would confirm that their approval of deafness rests on the specific finding that it imposes "no restriction on... functioning," a finding they would likely not extend to dwarfism. This distinction would safeguard the committee against accusations of allowing parents to impose physical disabilities for social convenience.
