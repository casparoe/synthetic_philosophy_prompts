answer: |-
  Your intuition regarding the inferential gap in the opening of "Of Cannibals" is astute, and treating it as a deliberate rhetorical maneuver rather than a philosophical slip is the correct approach for a text of this complexity. You have identified a tension between the *epistemological mechanism* of the anecdotes (sensory correction of prejudice) and the *normative maxim* Montaigne extracts from them (the adjudication of reason). If we take this gap seriously, it ceases to be a flaw and becomes the essay's central engine. The opening does not establish a stable premise for the rest of the text; rather, it establishes a *criterion of judgment* that the essay will subsequently complicate, refine, and ultimately invert.

  Here is a conceptual reconstruction of that passage and its bearing on the treatment of the Brazilians.

  ### 1. The Epistemology of the Anecdotes: *Autopsia* vs. *Doxa*

  The anecdotes concerning Pyrrhus, Flaminius, and Galba share a specific structure. In each case, a foreign observer holds a pre-existing classification ("barbarian") derived from linguistic or cultural habit (the Greek usage of *barbaros*). This classification is overturned not by argument, but by *autopsia*—seeing for oneself. Pyrrhus looks at the Roman camp; he sees *taxis* (order/disposition); he revises the label.

  Crucially, the anecdotes validate **empirical proximity** over **received testimony**. The error being corrected is not necessarily a failure of logic, but a failure of attention. The commanders were willing to accept a label without inspecting the referent. Thus, the anecdotes establish that "barbarism" is not an intrinsic quality but a judgment contingent on evidence. However, the evidence cited is specifically **visual order**. The Roman camp is legible; it has rows, distribution, and hierarchy. The "eye" here is literal, but it is trained to recognize a specific kind of intelligibility: military discipline.

  ### 2. The Maxim: The Conflation of Sight and Reason

  This brings us to the inference you flagged. Montaigne moves from "I saw the order" to "We must judge by the eye of reason." This is where the gap opens. Strictly speaking, the anecdotes demonstrate the "eye of the body" correcting the "ear of rumor." By labeling this the "eye of reason," Montaigne performs a subtle conceptual slide.

  He is implicitly arguing that **recognizing order is a rational act.** In the classical and humanist tradition, *taxis* (order) is the visible manifestation of *logos* (reason). Therefore, to see the camp's order is to see the Romans' reason. By equating the visual perception of discipline with the "eye of reason," Montaigne sets up a specific definition of rationality: **Rationality is external, structural, and hierarchical.**

  Furthermore, your point about "vulgar opinion" versus "common report" is vital. In the text, Montaigne treats them as a continuum of error. "Vulgar opinion" is the prejudice of the crowd; "common report" is the transmission of that prejudice. The maxim suggests they are epistemologically identical because both bypass the individual's critical faculty. However, by subsuming the visual evidence under "reason," Montaigne risks turning the "eye of reason" into just another dogma. If "reason" simply means "recognizing Roman-style order," then the "eye of reason" is merely a refined version of "vulgar opinion," limited to those who know what a proper camp looks like.

  ### 3. The Rhetorical Function: The Setup of a Trap

  This is where your hypothesis about the Renaissance paradox tradition bears fruit. The opening functions as a **propaedeutic trap**. Montaigne invites the reader to adopt a method: "Do not trust hearsay; look for order with the eye of reason." The reader, trained in humanist values, nods in agreement. We expect the essay to proceed by demonstrating that the Brazilians, despite appearances, possess a hidden "order" analogous to the Roman camp—perhaps a hidden political structure or military discipline that makes them "civilized" by European standards.

  If Montaigne were writing a standard apologetic, he would argue that the Brazilians have kings, laws, and formations, and thus are not barbarians. But he does not do this. Instead, he describes a society that notably **lacks** the very markers of order Pyrrhus admired. The Brazilians have no magistrates, no written laws, no distinct hierarchy, and no military discipline in the Roman sense. They live in a state of natural liberty.

  If we apply the opening maxim literally, the Brazilians *should* fail the test. They do not display the "disposition of the army" that exonerated the Romans. Therefore, the gap between the anecdote and the maxim is deliberate. Montaigne is forcing the reader to realize that the "eye of reason" invoked in the first paragraph is insufficient. It is an eye trained to see **conventional order**, not **natural virtue**.

  ### 4. Bearing on the Treatment of the Brazilians

  The distinction between the "perception of order" (anecdotes) and the "judgment of reason" (maxim) drives the essay's central inversion.

  **A. Redefining Barbarism**
  In the opening, "barbarism" is defined as a lack of external order (the opposite of the Roman camp). In the body of the essay, "barbarism" is redefined as a lack of moral coherence. Montaigne shifts the locus of judgment from the **political/military sphere** to the **ethical/natural sphere**.
  When Montaigne discusses Brazilian cannibalism, he does not argue that it is "orderly" in a Roman sense. He argues that it is **rationally consistent** within their framework of vengeance and honor. Conversely, he argues that European torture and religious wars are **irrational**, despite Europe's elaborate legal and military structures. The "eye of reason" must therefore be recalibrated. It must stop looking for rows of tents and start looking for internal consistency and natural law.

  **B. The Failure of the "Eye"**
  The opening anecdotes rely on the reliability of sight ("beholding from an eminence"). Yet, later in the essay, Montaigne expresses deep skepticism about the reliability of European witnesses regarding the New World. He privileges the testimony of a simple man who lived with the Brazilians over the "common report" of cosmographers.
  This mirrors the opening structure (rejecting report for direct account) but complicates the content. The "simple man" does not report seeing a Roman-style camp; he reports seeing men who sing while they die. The "eye of reason" is no longer about spotting hierarchy; it is about recognizing humanity in the absence of hierarchy.

  **C. The Inversion of the Maxim**
  The maxim warns against "vulgar opinion." By the end of the essay, the "vulgar opinion" is not just that the Brazilians are savages, but that **European civilization is the standard of reason.** Montaigne turns the opening inference back on the reader. Pyrrhus looked at the Romans and saw they weren't barbarians. Montaigne looks at the Europeans (us) and suggests that, despite our "order," we are the true barbarians because our actions violate natural reason.
  The "gap" you identified is the space where this inversion happens. The anecdotes suggest that **Order proves Civilization.** The essay argues that **Nature proves Civilization**, and that our "Order" is often a mask for Barbarism.

  ### 5. Conclusion: Reason as a Critical Faculty, Not a Criterion

  To resolve your problem regarding the inference: The maxim is not a doctrinal premise stating that "Reason identifies Order." It is a methodological instruction stating that "Reason must inspect the thing itself."

  The anecdotes show *that* we should inspect; they do not successfully define *what* we are inspecting for. Montaigne uses the Roman examples because they are the reader's default setting for "civilization." He uses the reader's confidence in those examples to lure them into the text. Once inside, he withdraws the ladder. He shows that if we truly use the "eye of reason"—stripped of "vulgar opinion" and "common report"—we cannot rely on the superficial markers of military or political order.

  The distinction you drew between perception and reason is the key to the essay's skeptical power. The anecdotes validate **sensory correction of prejudice**. The essay demands **rational correction of perception**. We see the Brazilians and perceive "wildness" (lack of Roman order). We must use reason to understand that this "wildness" is a purer form of social organization than our own "order."

  Thus, the opening is not a slip. It is a mimicry of dogmatic reasoning. Montaigne adopts the voice of a humanist asserting the power of reason and observation, only to demonstrate over the course of the essay that our "reason" is contaminated by custom, and our "observation" is blinded by expectation. The "eye of reason" is not a faculty we possess at the start of the essay; it is a faculty we must cultivate by the end, having learned to distinguish between the *appearance* of order (Rome/Europe) and the *reality* of virtue (Brazil/Nature).
