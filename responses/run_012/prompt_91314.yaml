      *   *Observation:* They see *order* (disposition, distribution).
      *   *Judgment:* "Nothing of barbarism in it."
      *   *Montaigne's Conclusion:* Be cautious of "vulgar opinion"/"common report." Judge by "the eye of reason."
      *   *The Gap:* Seeing a camp is sensory (*aisthesis*). Reasoning about it is *logos*. Montaigne conflates them or suggests the visual *is* the rational here. Also, "vulgar opinion" (what the masses think) vs. "common report" (hearsay). Pyrrhus didn't rely on hearsay; he relied on his own eyes. But Montaigne says don't trust "common report."

  3.  **Evaluate the "Renaissance Paradox" Hypothesis:**
      *   Montaigne is deeply skeptical. He often sets up a maxim to knock it down or complicate it later.
      *   However, in "Of Cannibals," the opening usually serves as a foil for the main argument about the New World.
      *   The user's intuition is sharp: The move from "seeing" to "reason" is not neutral. It assumes that what looks orderly *is* rational. But later, the Brazilians look "wild" (no order?) but are morally superior.
      *   So, is the opening maxim ironic? Or is it a specific kind of reason (empirical observation) vs. abstract dogma?

  4.  **Develop the Conceptual Reconstruction:**
      *   *Step 1: The Epistemology of the Opening.* The anecdotes privilege *autopsia* (seeing for oneself). Pyrrhus corrects the label "barbarian" based on visual evidence of *taxis* (order).
      *   *Step 2: The Slide to Reason.* Montaigne calls this the "eye of reason." Why? Because for a Renaissance humanist, recognizing *order* is a rational act. It's not just retinal imaging; it's recognizing structure. But this creates a trap: If "barbarism" = lack of order, then the Brazilians (who lack Roman military order) should be barbarians. But Montaigne argues they aren't.
      *   *Step 3: The Distinction (Vulgar Opinion vs. Common Report).* "Vulgar opinion" is the prejudice of the crowd. "Common report" is hearsay. Pyrrhus ignored the Greek label (vulgar opinion) by looking. Montaigne warns against both.
      *   *Step 4: The Connection to the Brazilians.* This is the crux. The opening sets up a criterion (Order = Civilization) that the essay *inverts*. The Brazilians have no kings, no magistrates, no clothes (no external order), yet they possess natural virtue. The opening maxim is a *trap* for the reader. We expect Montaigne to prove the Brazilians are "orderly" like the Romans. Instead, he proves our definition of "order" is the problem.
      *   *Step 5: Rhetorical Function.* It's not just a paradox; it's a *propaedeutic* that gets undermined. It establishes the *method* (look for yourself) but the *criterion* (order) is what gets challenged later. The "eye of reason" must eventually look past military formations to moral substance.

