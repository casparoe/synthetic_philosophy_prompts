  The conference room lights were dimmed to a single overhead strip. On the table between them lay a single manila folder. The containment protocol inside was vague enough to be unsettling: high stakes, mostly irreversible, and currently waiting on a signature. Under the institute's bylaws, any one of the nine committee members could approve it if the lead scientist asked them directly. No vote required.

  Dana tapped the folder. "This is the unilateralist's curse in real time. Nine of us could stop this. But only one of us needs to say yes to let it loose. If even eight of us think this is a bad idea, but we rely on individual judgment, the odds say someone will slip. The thing gets done because the threshold for action is lower than the threshold for caution."

  Wes leaned back, rubbing his temples. "The math is clean, Dana, but it's oversold as a guide for what I should do tonight. The curse model assumes our errors are independent. It assumes if I'm wrong about the risk, you're likely right. But we aren't rolling dice. We've all read the same two peer reviews. We've all seen the same preprint. Our errors are correlated. If the data is misleading, it's misleading for all of us. Deference doesn't average out the error; it just freezes everyone onto the same wrong answer."

  "That's exactly why individual norms aren't enough," Dana said. "I'm not saying you should just guess what we're thinking. I'm saying the committee needs a structural fix. Two signatures. Minimum. A norm that asks you to discount your own judgment won't hold when the stakes are this high. But a rule binds us. If your errors are correlated, you don't solve that by trusting individual deliberation. You solve it by requiring consensus."

  "Consensus creates its own curse," Wes countered. "You're focusing on the risk of false positives. But if you require unanimity, you create a curse against action. If a good outcome requires all nine of us to say yes, then the project fails whenever any one of us is wrong. There's a twin curse. Which one bites depends on the base rates and whether the action can be undone. Here, you're right, it's irreversible. But you can't solve that just by saying 'defer to the pool.'"

  "Why not?"

  "Because I can't observe the pool," Wes said. "The relevant group isn't 'everyone who could approve.' It's 'everyone who could approve and has actually thought hard about this specific request.' I have no way of knowing how big that group is. Maybe I'm the only one who actually read the appendix. If I defer to a phantom majority who skimmed the abstract, I'm not being humble; I'm being negligent."

  Dana shook her head. "And every member who signs off will tell you they 'actually thought about it.' That claim can't be the filter. It's universal noise. If the errors are correlated, as you say, then no amount of individual deliberation fixes the shared bias. We need a rule that forces us to break that correlation by requiring independent verification. That's why I want two signatures. It forces a second pair of eyes that isn't just relying on the same initial impulse."

  "But your proposed norm for the meantime is self-undermining," Wes pressed. "You want me to only approve if I'd still approve imagining the others might say yes. But how much I ought to defer depends on whether the others are following the same rule. If the norm spreads, the value of deferring collapses. If everyone defers, nothing happens. So I shouldn't have deferred. It creates a paradox where the rule works only if people ignore it."

  "It's not a paradox, it's a coordination problem," Dana said. "And look at the psychology. The curse only runs one direction here because acting is individually cheap. Signing costs me nothing. Diffusion of responsibility predicts under-action when acting is costly, when I have to stick my neck out. Here, the risk is that someone sticks their neck out too easily. That's why the asymmetry matters. We need to raise the cost of action structurally."

  "Or," Wes said, leaning forward, "we stop trying to gamify our own conscience and focus on information sharing. If we're worried about correlated errors, the fix isn't to tell me to ignore my judgment. It's to ensure my judgment isn't relying on the same flawed slice of data as everyone else. But a deference norm? That just hands people a respectable way to avoid owning the decision. 'I didn't want to sign, but I didn't want to override the pool either.' It's moral camouflage."

  "It's not camouflage, it's recognizing epistemic humility," Dana shot back. "But I agree humility doesn't scale without rails. That's why I'm saying the norm is a stopgap. The rule is the fix. You're arguing that because the math isn't perfect, we should trust the individual actor. I'm saying because the math shows systemic risk, we should trust the system."

  "The system is us," Wes said. "If I bind myself to a rule that requires a second signature, I'm assuming the second person isn't just rubber-stamping my bias. But if we're all reading the same reviews, we're all rubber-stamping the same bias. You want a rule. I want better information flow before the vote even happens. But until then, I have to act on my read. If I defer to a group that isn't actually deliberating, I'm not avoiding the curse. I'm walking into it."

  "So you'd sign?"

  "I'd sign if my read says the benefit outweighs the risk, knowing that my colleagues had the same chance to stop it and didn't," Wes said. "That's not arrogance. That's accepting that the reference class is unknowable."

  "And I'm saying that unknowability is precisely why you shouldn't be the sole gatekeeper," Dana said, closing the folder. "We're going to need more than just trust in each other's judgment to sleep on this."

  "Then write the rule," Wes said. "But don't ask me to pretend my judgment doesn't exist until you do."
