      *(Final thought on the "Sealed Sentence")*: The prompt says "the generator had a convention baked into it that nobody noticed, which is exactly what the sealed sentence will show". This implies the sentence *reveals* the convention. So they must write the *actual* generation rule. "We place the goal at (5,5)." They think this is just 'setting up the level'. At the end, we read it and say "You baked the location into the data."

