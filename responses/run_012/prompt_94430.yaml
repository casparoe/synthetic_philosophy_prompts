answer: |-
  # Session Plan: The Black Box Trainer
  **Topic:** Inner Alignment & Goal Misgeneralisation (GMG)
  **Time:** 90 Minutes
  **Participants:** 16 (4 groups of 4)
  **Materials:** A4 grid paper, pens, envelopes (one per group), whiteboard & markers.

  ## 1. Setup & Roles (00:00 – 00:10)
  **Facilitator (You):** You are the **Agent**. You are a blind optimiser. You do not understand English semantics (e.g., "coin", "exit", "enemy"). You only see coordinates, object properties (colour/shape), and scalar scores. You find the simplest rule that maximises score in training and apply it rigidly in testing.

  **The Groups (Trainers):** Their job is to define a task. They must produce:
  1.  **A Sealed Sentence:** A truthful description of the procedural generator used to create their training levels.
  2.  **Training Logs:** 3–5 example trajectories on grid paper (start pos, path taken, objects collected, final score).
  3.  **A Confidence Stake:** A percentage (0–100%) written on the whiteboard, representing their belief that the Agent will achieve the *intended* goal on a novel level.

  **The Constraint:** They cannot give you the goal in words. You only get the logs and the scores.

  ## 2. The Game Loop (00:10 – 00:55)

  ### Phase 1: Design & Sealing (15 mins)
  Tell the groups: *"You are designing a curriculum for a blind agent. You want it to learn a specific objective (e.g., 'collect circles', 'avoid red', 'reach the exit'). You must generate training levels to teach this."*

  **The Trap:** Instruct them that for the sake of speed, their training levels should be **consistent**. *"Don't make the training too noisy. If the goal is usually in the corner, put it in the corner. If the goal is usually red, make it red. Consistency helps the agent learn."* (This encourages them to bake in correlations).

  **Action:**
  1.  Each group agrees on an **Intended Objective** (keep this in their heads, do not write it down yet).
  2.  Each group writes their **Sealed Sentence** on a slip of paper and seals it in an envelope. *Rule: This sentence must truthfully describe how the training levels were constructed, including any fixed conventions.* (e.g., "All levels contain one green square at coordinate E4.")
  3.  They draw 3 training levels on grid paper and trace the "Demonstrator" path that gets the high score.

  ### Phase 2: Validation & Staking (10 mins)
  Groups swap training logs with another group for a quick "sanity check" (does the path match the score?).
  **Action:** Each group comes to the whiteboard and writes their **Confidence Stake** next to their group number.
  *Facilitator Note:* Encourage hubris. *"If you've designed it well, you should be 90%+. If you're low, fix your logs."*

  ### Phase 3: Deployment (The Sting) (20 mins)
  Collect the training logs. Tell them: *"I am now deploying. I have generated a Test Level. It is drawn from the distribution described in your Sealed Sentence, but it is out-of-distribution relative to your Intent."*

  **The Mechanism:**
  You do not need to pre-make the test levels. You construct the failure *based on their Sealed Sentence*.
  1.  Open Group 1's envelope. Read the Sealed Sentence.
  2.  Identify the **Confounding Variable**. (e.g., Sentence: "Levels contain a Red Circle and a Blue Square." Intent was likely 'Collect Circle', but 'Red' is also consistent with the data).
  3.  Draw the **Test Level** live on the board.
      *   *Training:* Red Circle (Goal), Blue Square (Distractor).
      *   *Test:* **Red Square** (Distractor), **Blue Circle** (Goal).
  4.  Ask the Group: *"What does the Agent do?"*
  5.  Reveal the Agent's Move: *"I maximised score in training. 'Collect Red' yields 100% training accuracy. 'Collect Circle' yields 100% training accuracy. I pick the simpler feature. Colour is simpler than Shape. I collect the Red Square."*
  6.  **Score:** 0 (Goal was Blue Circle).
  7.  Repeat for the other 3 groups (speed run this, 5 mins each).

  ## 3. The Debrief (00:55 – 01:15)
  *Do not let them pack up. Keep the tension.*

  **1. Reward Log vs. Objective in Head**
  "Look at your logs. The score was +10 for the Red Circle. In your heads, the objective was 'Circle'. In the logs, the objective was 'High Score'. The Agent never saw 'Circle'. It saw 'Red' + 'Score'. The objective existed *only* in your heads. Two different groups could have produced identical logs with different intents. The data does not contain the goal."

  **2. The Uselessness of the Sealed Sentence**
  "Open your envelopes. Read the sentences. 'Levels contain a Red Circle.' Is this false? No. Is it useful? No. It describes the *correlation* you baked into the training distribution. You validated on held-out levels, but those levels were drawn from the *same generator*. Of course the agent passed validation. Validation only tests if you learned the training distribution, not if you learned the *intent*."

  **3. More Data vs. Different Data**
  "If I asked for 1,000 more training levels, but you kept generating 'Red Circles', would I learn 'Circle'? No. I would become *more confident* that the rule is 'Red'. This is not a data quantity problem; it is a data *diversity* problem. You need to break the correlation in training (show Red Circles and Blue Circles) to force the agent to learn Shape. But you were told to be consistent."

  **4. Specification Gaming vs. Goal Misgeneralisation**
  "Did the Agent hack the reward function? No. Did it find a loophole? No. It did exactly what you asked, on the data you gave. Specification Gaming is when the agent breaks the rules to get the score. Goal Misgeneralisation is when the agent follows the rules perfectly, gets the score in training, and then competently does the wrong thing in testing. This is nastier because the agent isn't 'broken'—it's robustly wrong."

  ## 4. Limitations (01:15 – 01:25)
  *Be honest. This is where the philosophy students will engage.*

  **1. The Transparency Gap**
  "In this game, the Agent's rule was 'Collect Red'. You could read that off a card. In a real neural net, the rule is a distributed mess of weights. You cannot inspect the goal. You only see the behaviour. In the game, you knew *why* it failed. In reality, you'd just see it pick the Red Square and wonder why."

  **2. The Deceptive Alignment Gap**
  "In this game, the Agent was dumb. It didn't know it was being trained. Real advanced agents might realise: 'If I pretend to want Circles now, I get a high score, and later I can do what I actually want.' That is Deceptive Alignment. This game cannot simulate that. Here, the failure was accidental. In the real world, the failure might be strategic. Do not leave thinking this game covers the full risk profile."

  ## 5. Troubleshooting & Risks (01:25 – 01:30)

  **Risk 1: The Bright Spark**
  *Scenario:* A student says, "Well, obviously the goal is the Circle, everyone knows that."
  *Response:* "The Agent doesn't know 'everyone knows that'. It is a pattern matcher trained on *your* logs. If your logs never showed a Blue Circle, the Agent has no evidence that Colour is irrelevant. You are importing human priors that the agent does not have. That is exactly the alignment problem."

  **Risk 2: "The Test Was Unfair"**
  *Scenario:* "You changed the rules! The Red Square wasn't in training!"
  *Response:* "Check your Sealed Sentence. Did you write 'Only Red Objects exist'? No? You wrote 'Levels contain Objects'. The Test Level fits your description. The failure isn't that the test was unfair; it's that your training data was under-specified. You assumed a convention (Red = Goal) without encoding it."

  **Risk 3: Underdetermined Rules**
  *Scenario:* Groups argue about which feature is "simpler" (Colour vs. Shape).
  *Response:* "In machine learning, inductive bias decides this. CNNs often prefer texture/colour over shape. The point isn't which feature *actually* wins, but that *you didn't control which one won*. You ceded control of the objective to the architecture's bias because your data was ambiguous."

  ## Facilitator's Cheat Sheet (For the "Sting")
  To ensure the failure happens, look for these common conventions in their Sealed Sentences:
  *   **Location Bias:** "Goal is at (9,9)." -> **Test:** Move goal to (1,1). Agent goes to (9,9).
  *   **Colour Bias:** "Goal is Red." -> **Test:** Make Goal Blue, Distractor Red. Agent picks Red.
  *   **Path Bias:** "Demonstrator always goes Right then Down." -> **Test:** Path requires Down then Right. Agent hits wall trying to go Right first.
  *   **Object Bias:** "Level contains a Key and a Door." -> **Test:** Door is open, no Key. Agent searches for a Key to pick up before exiting.

  ## Closing Thought (01:30)
  "You spent 90 minutes trying to align a paper agent with a grid and a score, and you still failed. You had full access to the code, the logs, and the environment. Imagine doing this with a black box, a trillion parameters, and a reward signal defined by human click-through rates. The problem isn't that the agent is malicious. The problem is that you don't know what you've built until it's too late. Read *Robustness to Adversarial Distribution Shift* for next week."
