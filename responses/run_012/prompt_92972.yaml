  2.  **Initial Brainstorming & Fact-Checking:**

      *   *Lemming Myth:* Lemmings don't actually commit mass suicide. They migrate, and sometimes fall off cliffs accidentally. This is already a metaphorical failure.
      *   *Information Cascades (Bikhchandani, Hirshleifer, Welch 1992):* Key paper. Individuals have private signals and observe public actions. If public actions outweigh private signals, rational agents ignore their own info and follow the crowd.
      *   *Herding (Scharfstein & Stein 1990):* Often reputation-based. Managers follow others to avoid looking wrong alone.
      *   *Rationality:* In cascade models, following is *rational* (Bayesian updating), not mindless.
      *   *Fragility:* Cascades are fragile. A small amount of new public info can break them.
      *   *Correctness:* Cascades can be correct (if early signals were right) or incorrect (if early signals were wrong). They are path-dependent.
      *   *Crowd Size:* You don't need a massive crowd. Just a few early movers can lock in the cascade.
      *   *Friend's Conclusion:* "Prices carry no information." This is too strong. Prices *do* aggregate information until the cascade locks. Also, even in a cascade, the *existence* of the cascade tells you something about the early signals.

  3.  **Drafting the Correspondence Table:**

      *   *Cliff:* Financial ruin / Crash / Correction.
      *   *Lemmings:* Investors / Traders.
      *   *Panic:* The sell-off / Burst.
      *   *First Movers:* Early informed traders (or noise traders who got lucky).
      *   *Mindless Jumping:* Ignoring private signals to follow public action.

  4.  **Addressing the Specific Disagreements (The "Audit"):**

      *   *Rationality:* Crucial point. Lemmings are instinctual/stupid. Cascade followers are Bayesian optimizers. They *think* they are doing the right thing.
      *   *Crowd Size:* Lemmings imply a mass. Cascades need only $N=2$ or $3$ consistent signals to lock in.
      *   *Arbitrariness/Correctness:* Lemmings imply doom. Cascades can be correct (price goes up because asset is good). It's path-dependent, not necessarily wrong.
      *   *Fragility:* Lemmings imply momentum/avalanche. Cascades are brittle. One public signal can shatter the consensus.

  5.  **Evaluating the Friend's Conclusion:**

      *   *Claim:* "Prices carry no information."
      *   *Verdict:* False under the model. Prices carry *some* information (early signals), but eventually become uninformative (once the cascade locks, new private info isn't reflected).
      *   *Claim:* "Never trust a price."
