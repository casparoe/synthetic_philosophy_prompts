prompt: |-
  ok so a friend of mine keeps saying that every bubble — crypto, meme stocks, whatever — was just lemmings. people following each other off a cliff, no information in any of it, pure social contagion, and thats why you should never trust a price. she says it like the metaphor settles the question. i know enough to know that the actual literature on information cascades says something subtler and i want the audit. how far does the lemming picture actually hold?

  give me the correspondence table first — what plays the role of the cliff, of the lemming, of the panic, of the first few movers — and then the places it breaks. the parts i care most about are where the formal model and the metaphor actively disagree:

  - are the followers being irrational, or is following the rational thing to do given what they can see?
  - does a cascade need a crowd, or can a couple of early signals in a row do it?
  - is the outcome arbitrary, or just order-dependent? and can a cascade be *right*?
  - the fragility thing: my impression is cascades are supposed to be easy to overturn with a little new public information, which doesnt sound like an avalanche at all.

  then tell me which of these disanalogies actually matter for the conclusion she wants (fads and prices carry no information, so dont trust them) and which are just decoration. does her conclusion survive in any form? if the model supports a weaker version of it, say exactly what the weaker version is. and if theres a better analogy — herd versus cascade seems like the live distinction — give it to me, plus what that one still gets wrong.
