      *   *Weaker Version:* "Prices become uninformative once a cascade locks, making them fragile to new public data."

  6.  **Finding a Better Analogy:**

      *   *Herd vs. Cascade:* "Herd" implies moving together for safety/warmth (often rational). "Cascade" implies sequential decision making.
      *   *Better Analogy:* **The Restaurant Line (or Urn Experiment).**
      *   *Why:* It captures the sequential rationality. You see two people go into Restaurant A. You have a signal that B is better. But you reason "They must know something." So you go to A. The third person sees three people. Their private signal doesn't matter.
      *   *What it gets wrong:* Financial markets are simultaneous, not strictly sequential. Prices adjust continuously, not in discrete steps.

