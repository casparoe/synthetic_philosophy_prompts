prompt: |-
  I need a teaching plan for a single session on a question in the philosophy of mind — the plan, not the content, and not an argument for a position. The question is whether symbols push the substrate around.

  Here is the device I mean to build the session on. Picture a vast shallow arena, a billiard table the size of a football pitch, across which an enormous number of small magnetic marbles — call them simms — careen at random, each obeying a handful of simple mechanical and magnetic rules. Simms collide, cling, and separate; clumps grow, break apart, and re-form. Now pull back. At that distance you no longer see individual marbles, only larger and comparatively stable clusters — simmballs — and the simmballs exhibit regularities invisible at the level of the simms: certain kinds recur, certain kinds reliably follow certain others, and, if the walls of the arena change their bounce in step with events outside it, certain kinds of simmball come to track those events. The simmballs even seem to act on one another, one cluster's appearance seeming to summon or suppress another. Read the simmballs as symbols or concepts and the simms as a neural substrate, and the arena becomes a brain. The question the session exists to pose: when the simmball-level description is true and predictive, do the simmballs — the symbols — push the simms around, or is all the pushing done by the simms, with the symbols an idle gloss on the physics?

  The audience is a graduate reading group in cognitive science: neuroscientists, machine-learning people, and philosophers of mind, none of whom works on causation. They are fluent in the idea that one system admits descriptions at more than one grain, and for that very reason they will treat causal talk as unproblematic. I have seventy-five minutes, a whiteboard, and no assigned reading.

  Give me the plan. Specifically:

  1. The order. Establish the sequence in which the pieces must be introduced, and why each depends on the one before it — down to the assumption that has to be conceded before the question even becomes intelligible. I suspect the hard part is not the careenium but something that must first be settled about what makes a description true, or projectible, or explanatory, and I want you to tell me whether that is right, where it belongs, and where the session's real pivot falls.

  2. The carrying example. The careenium is meant to carry the whole session; tell me what it must have and what it must lack for that to work. Then tell me whether it is in fact the right carrier, or whether some more mundane case — a chess engine, a market, an ant colony — should do the load-bearing work, with the careenium demoted to a closing flourish. If the careenium stays, say which of its features I must keep and which I can drop without loss.

  3. The misconceptions. They will bring some and form others. My provisional list: that a higher-level description must be either a useful fiction or a mysterious addition, never simply another true description of the same thing; that if the micro-story is complete, the symbol-level story is idle; that causal talk at two levels has to be a competition, so exactly one level is the real cause; and that symbol-level causation would require a symbol to exert a force on a marble. Give me the full list in the order it will surface, and for each, the exact point in the sequence at which I should head it off — and, where it matters, the point at which I should deliberately let it stand for a while so that a later step dissolves it rather than a reminder pre-empting it.

  4. The check. One question or task, at the end, that tells me whether they have understood the question rather than merely memorised a position — whether they now see what the two answers disagree about.

  5. What to leave out, and what I should say aloud that I am leaving out, given this audience and this much time.

  Do not give me readings, and do not simply answer the question on my behalf; I have a view of my own, and what I need is the plan for getting them to it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Mind / Causation (Specifically: Do symbols push the substrate around? / Downward Causation / Multiple Realizability / Explanatory Autonomy).
      *   **Core Metaphor:** The "Careenium" (Hofstadter's *Gödel, Escher, Bach* concept: magnetic marbles/simms forming clusters/simmballs).
      *   **Audience:** Graduate reading group (Cognitive Science: Neuro, ML, Philosophy). Fluent in multi-grain descriptions, *not* fluent in causation metaphysics.
      *   **Constraints:** 75 minutes, whiteboard, no assigned reading. Plan only (no content/arguments), specific structure (Order, Carrying Example, Misconceptions, Check, Exclusions).
      *   **Goal:** Enable them to grasp the *question* and the *disagreement*, not necessarily solve it or adopt the instructor's view.

  2.  **Deconstruct the Core Problem:**
      *   The central tension is between *causal closure of the physical* (simms do all the pushing) and *explanatory/causal efficacy of the special sciences* (simmballs do the work).
      *   The audience assumes multi-grain descriptions are fine. The trap is they might think this automatically solves the causal problem (it doesn't).
      *   The "hard part" identified by the user: What makes a description true/projectible/explanatory? This is crucial. If symbols are just "gloss," they don't push. If they are "real patterns," they might.
      *   The Pivot: Moving from "Are simmballs real patterns?" to "Do real patterns *cause*?"

  3.  **Drafting Section 1: The Order (Sequence & Dependencies):**
      *   *Step 1: The Setup.* Need to establish the Careenium mechanics first. Without the physics, the metaphor fails.
      *   *Step 2: The Patterns.* Need to establish that simmballs are stable and predictive. This addresses the "useful fiction" objection early.
      *   *Step 3: The Causal Question.* Now introduce the "pushing." This is the pivot.
      *   *Step 4: The Dilemma.* Overdetermination vs. Exclusion.
      *   *Step 5: Resolution/Reframing.* How to talk about causation without magic.
      *   *Dependency Check:* You can't ask if symbols push until you agree symbols *exist* as patterns. You can't ask if patterns exist until you agree the substrate allows them.
      *   *User's Suspicion:* The user suspects the hard part is about truth/projectibility. *Verdict:* Yes. This needs to happen *before* the causal question. If they think simmballs are just epiphenomenal shadows, the causal question is moot. The pivot is moving from *Ontology of Patterns* to *Causal Efficacy*.

  4.  **Drafting Section 2: The Carrying Example (The Careenium):**
      *   *Is it the right carrier?* Yes, it's designed for this (Hofstadter's intent). Chess/Markets introduce intentionality too early (homunculus risk). Ant colonies are good but messy. Careenium is physics-pure.
      *   *Must Haves:* Randomness at bottom (simms), Stability at top (simmballs), Coupling to environment (walls), No external controller.
      *   *Must Lacks:* Intentional agents, Pre-defined rules for clusters (clusters must emerge), External "score."
      *   *Modification:* Keep it abstract. Don't get bogged down in magnetic field equations.

  5.  **Drafting Section 3: Misconceptions:**
      *   *List:*
          1.  "Higher-level = Fiction." (Address early, during Pattern establishment).
          2.  "Micro-story complete = Macro-story idle." (Address during Causal Question).
          3.  "Causation = Competition." (Address during Dilemma).
          4.  "Symbol pushing = Magic force." (Address during Resolution).
      *   *Timing:* Some need pre-emption (Fiction). Some need to linger (Competition) so the dissolution feels earned.

  6.  **Drafting Section 4: The Check:**
      *   Need a task that forces them to choose a *frame*, not a *fact*.
      *   Idea: A debugging scenario. If a simmball pattern fails, where do you look? Or, a prediction task.
      *   Better: A "Counterfactual" test. "If *this* simmball hadn't formed, would *that* one have?" vs "If *this* simms hadn't moved..."
      *   Best: The "Intervention" question. To change the outcome, do you manipulate simms individually or constrain simmballs?

  7.  **Drafting Section 5: Exclusions:**
      *   *Leave Out:* Detailed metaphysics of causation (Hume vs. Counterfactual vs. Process). Free will (too distracting). Specific neural mechanisms (keep it abstract).
      *   *Say Aloud:* "We are ignoring the metaphysics of causation to focus on the *level* of causation." "We are ignoring consciousness/qualia."

  8.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is 75 minutes enough?
      *   *Adjustment:* Keep the Careenium setup tight (10 mins). Spend the most time on the Causal Pivot (30 mins).
      *   *Critique:* The user said "none works on causation."
      *   *Adjustment:* Avoid jargon like "supervenience" or "epiphenomenalism" unless defined on the board. Use their language (ML/Neuro).
      *   *Critique:* The user asked about the "truth/projectibility" assumption.
      *   *Adjustment:* Make sure Section 1 explicitly validates this. The session *cannot* start with causation. It must start with *pattern reality*.
      *   *Tone:* Professional, pedagogical, structured. No fluff.

  9.  **Final Review against Constraints:**
      *   Plan only? Yes.
      *   No readings? Yes.
      *   No argument for a position? Yes.
      *   Address all 5 points? Yes.
      *   Careenium focus? Yes.

  10. **Final Polish:** Ensure the distinction between "explanatory utility" and "causal efficacy" is clear, as that's the heart of the graduate-level nuance required. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I answer the specific question about *where* the assumption about truth/projectibility belongs. It belongs in the first third. If they don't grant that simmballs are "real patterns" (Dennett) or at least "projectible," the causal question collapses into eliminativism immediately. I will emphasize this in Section 1.

  Also, regarding the "Check": It needs to distinguish between *understanding the dispute* vs *picking a side*. The prompt asks: "tells me whether they have understood the question rather than merely memorised a position." So the check should be about articulating the *cost* of each answer.

  Let's assemble the plan.cw
answer: |-
  Here is the teaching plan for the 75-minute session.

  ### 1. The Order

  The session must proceed in three distinct movements: **Ontology of Patterns**, **The Causal Exclusion Problem**, and **Reframing Causation**. You are correct that the hard part is not the Careenium itself, but the status of the higher-level description. If the audience treats simmballs as mere "useful fictions" (instrumentalism), the causal question is trivial (fictions don't push). If they treat them as "real patterns" (realism), the causal question becomes acute.

  **Sequence:**

  1.  **The Substrate (0–10 mins):** Establish the simms.
      *   *Content:* The mechanics. Random motion, magnetic rules, collision.
      *   *Dependency:* Nothing. This is the axiom.
      *   *Goal:* Secure agreement that the micro-level is causally closed. No magic enters here.
  2.  **The Patterns (10–25 mins):** Establish the simmballs.
      *   *Content:* Stability, recurrence, predictability, environmental coupling.
      *   *Dependency:* Requires the Substrate to be established first (patterns must be *of* something).
      *   *Goal:* **The Critical Assumption.** You must extract a concession here: that the simmball description is *projectible* (supports counterfactuals) and not just a retrospective summary. If they deny this, stop and debate this, or the rest fails.
      *   *The Pivot:* This is where the session turns. Once they agree simmballs are real/projectible patterns, you ask: "Do they *do* anything?"
  3.  **The Push (25–50 mins):** The Causal Exclusion Argument.
      *   *Content:* If simms account for all motion, what work is left for simmballs?
      *   *Dependency:* Requires the Patterns to be established as real. If patterns aren't real, there's no exclusion problem.
      *   *Goal:* Make the tension visceral. The micro-story is complete; the macro-story is predictive. They cannot both be the *sole* cause without overdetermination.
  4.  **The Dissolution (50–65 mins):** Causation as Counterfactual/Interventionist.
      *   *Content:* Shifting from "force" to "dependence."
      *   *Dependency:* Requires the tension of The Push to be felt.
      *   *Goal:* Show that "pushing" is a category error when applied across levels.
  5.  **The Check (65–75 mins):** Assessment task.

  **Why this order:** You cannot ask if symbols push until you agree symbols *exist* as more than shorthand. Most cognitive scientists grant the existence of patterns implicitly but haven't examined their ontological cost. This sequence forces that examination before introducing the causal conflict.

  ### 2. The Carrying Example

  **Is the Careenium the right carrier?**
  Yes. Do not demote it.
  *   **Reason:** Chess engines and markets introduce *agents* and *goals* too early. The audience will smuggle in intentionality ("The engine *wants* to win"), which confuses the metaphysical problem of causation with the functional problem of teleology. Ant colonies are too biologically messy (evolutionary history distracts). The Careenium is physics-pure. It isolates the *structure* of the problem without the baggage of *purpose*.

  **What it must have:**
  1.  **Stochasticity at the bottom:** The simms must have random elements. If they are deterministic clockwork, the audience will collapse the levels too easily ("it's all just equations").
  2.  **Emergent Stability:** Simmballs must persist longer than individual collisions.
  3.  **Environmental Coupling:** The walls must react. This allows simmballs to "track" the world, mimicking representation.
  4.  **No External Controller:** Crucial. There is no "player" moving the marbles.

  **What it must lack:**
  1.  **Pre-defined Cluster Rules:** You cannot say "A clump of 5 is a Simmball Type X." The types must emerge from the dynamics.
  2.  **Semantics:** Do not assign meaning to the simmballs (e.g., "This one means 'apple'"). Keep it structural ("This one triggers that one").

  **Features to Drop:**
  *   **Specific Magnetic Equations:** Do not write formulas on the board. Use qualitative descriptions ("attraction," "repulsion").
  *   **The "Glue":** Hofstadter originally used "glue." Drop this. It suggests an extra physical substance. Let the magnetism suffice.

  ### 3. The Misconceptions

  The audience is fluent in multi-grain descriptions but naive about causation. They will assume compatibility where there is tension.

  | Misconception | When it will surface | Strategy |
  | :--- | :--- | :--- |
  | **"Higher-level is just a useful fiction."** (Instrumentalism) | **During The Patterns (10–25 mins).** | **Pre-empt.** Do not let them dismiss simmballs as "just a heuristic." Force them to admit the simmball level allows predictions the simm level cannot practically make. If it's projectible, treat it as real for the sake of argument. |
  | **"If the micro-story is complete, the macro-story is idle."** (Causal Closure) | **During The Push (25–50 mins).** | **Let it stand.** This is the core tension. Let them feel the discomfort that the simmball story seems redundant. Do not resolve it immediately. |
  | **"Causation is a competition."** (Zero-Sum) | **During The Push (25–50 mins).** | **Let it stand, then Dissolve.** This is the root error. They think if simms cause it, simmballs can't. Allow this intuition to harden so that the shift to "interventionist causation" (Section 4) feels like a relief. |
  | **"Symbol pushing requires magic force."** (Category Error) | **During The Dissolution (50–65 mins).** | **Pre-empt.** Explicitly state: "We are not looking for a new force field." Define "push" as "making a difference to the outcome." |
  | **"This is just about epistemology."** | **Throughout.** | **Pre-empt.** Remind them: "We aren't asking what we *know*; we are asking what *happens*." |

  **Note on Timing:** The most dangerous misconception is the first one (Instrumentalism). If they decide simmballs aren't "real," the session ends early. Spend the most energy securing the reality of the patterns.

  ### 4. The Check

  Do not ask them to vote on a position. Ask them to diagnose a failure mode.

  **The Task (Whiteboard):**
  "Imagine a session of the Careenium where a specific Simmball (Type A) usually triggers Simmball (Type B). Today, Type A forms, but Type B does not.
  1.  **The Reductionist Explanation:** Describe what happened at the **Simm** level.
  2.  **The Symbolic Explanation:** Describe what happened at the **Simmball** level.
  3.  **The Constraint:** Explain why the Symbolic Explanation *cannot* be fully translated into the Reductionist one without losing something essential for a Cognitive Scientist."

  **Success Criteria:**
  *   **Failure:** They say the Symbolic Explanation is "just a summary" of the Reductionist one. (They missed the autonomy of levels).
  *   **Failure:** They say the Simmball "failed to push" the simms. (They reified the symbol into a magic force).
  *   **Success:** They articulate that the Reductionist explanation is *too specific* (it cites the exact trajectory of marble #4,502) while the Symbolic explanation cites the *structural failure* (the cluster was unstable due to noise). They see that the disagreement is about **which differences make a difference**.

  ### 5. What to Leave Out

  Given 75 minutes and this audience, you must be ruthless.

  **Leave Out (Silently):**
  *   **The History of the Problem:** No mention of Descartes, Hume, or Kim unless necessary for a definition.
  *   **Consciousness/Qualia:** This is about causal efficacy, not feeling. Mentioning qualia will hijack the discussion into Hard Problem territory.
  *   **Free Will:** Do not let them drift into "If simms push, are we free?" Park it explicitly: "We are bracketing agency."
  *   **Specific Metaphysical Theories:** Do not teach "Non-Reductive Physicalism" or "Eliminativism" as labeled doctrines. Teach the *problem* that generates those labels.

  **Leave Out (Aloud):**
  *   **Say:** "I am leaving out the metaphysics of *what causation is* (processes vs. counterfactuals). We are taking causation as 'difference-making' for this hour."
  *   **Say:** "I am leaving out the question of *meaning*. We are treating symbols as structural clusters, not semantic representations."
  *   **Say:** "I am not asking you to solve this today. I am asking you to locate the exact point where the two descriptions rub against each other."

  **Why:** This audience consists of practitioners. They care about modeling and mechanism. By explicitly bracketing the heavy metaphysics and semantics, you signal that this is a *structural* problem relevant to their modeling work, not just a philosophical puzzle. This keeps them engaged.
