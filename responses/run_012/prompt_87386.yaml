answer: |-
  ### The Number
  **0.71 (71% credence)**

  This means I judge it roughly 7-to-3 odds that the claim is true: for a typical middle-class person in a rich country, buying factory-farmed meat is morally wrong, even under your "lumpy supply" constraints.

  ---

  ### The Decomposition
  To get to 0.71, I break the claim into four necessary sub-questions. If any of these are false, the claim "it is morally wrong" loses its force. I assign a probability to each based on current ethical consensus and empirical data.

  | Sub-Question | Probability | Justification |
  | :--- | :--- | :--- |
  | **1. Moral Standing:** Do chickens have moral status such that their suffering/death counts? | **0.95** | Neuroscience and behavioral biology strongly support that chickens feel pain and have preferences; denying this requires a very specific, contested philosophical view. |
  | **2. Direct Causation (Expected Value):** Does a 1-in-50,000 chance of triggering a barn count as "causing harm"? | **0.85** | In decision theory, expected value is the standard for rational choice. If 50,000 buyers trigger 50,000 deaths, 1 buyer triggers 1 death *in expectation*, even if the *actual* trigger is lumpy. |
  | **3. Social Multiplier:** Does my eating make it more likely my friends/family continue eating meat? | **0.60** | Social norm signaling is real but hard to measure. Eating meat normalizes it; abstaining signals it's optional. I'm conservative here because individual influence varies wildly. |
  | **4. Lack of Justification:** Is the harm caused greater than the convenience/pleasure gained? | **0.80** | For a middle-class person with access to alternatives, the gustatory pleasure of a specific meal rarely outweighs the expected death/suffering of a sentient being. |

  ### How They Combine
  We treat this as a chain. For the act to be "wrong," the animals must matter **(1)**, the action must cause harm **(2 or 3)**, and that harm must not be justified **(4)**.

  1.  **Combine Causation:** Since harm can happen via *either* Direct Causation **OR** Social Multiplier, we calculate the probability that *at least one* works.
      *   $P(\text{Cause Harm}) = 1 - [(1 - 0.85) \times (1 - 0.60)]$
      *   $P(\text{Cause Harm}) = 1 - [0.15 \times 0.40] = 1 - 0.06 = \mathbf{0.94}$
      *   *(Meaning: There is a 94% chance your purchase contributes to harm via one route or the other.)*

  2.  **Calculate Final Credence:** Multiply the remaining necessary conditions.
      *   $P(\text{Wrong}) = P(\text{Standing}) \times P(\text{Cause Harm}) \times P(\text{Unjustified})$
      *   $P(\text{Wrong}) = 0.95 \times 0.94 \times 0.80$
      *   $P(\text{Wrong}) = \mathbf{0.7144}$

  ### Sensitivity Analysis
  **Which sub-question moves the number most?**
  **Question 2: Direct Causation (Expected Value).**

  If you reject "Expected Value" ethics and insist that you are only responsible for *actual, detectable* outcomes (i.e., "I didn't fill the barn, so I did nothing"), the probability for Question 2 drops from **0.85** to **0.05**.
  *   New Causation Probability: $1 - [(0.95) \times (0.40)] = 0.62$
  *   New Final Credence: $0.95 \times 0.62 \times 0.80 = \mathbf{0.47}$

  If you also think the Social Multiplier is weak (Question 3 drops to 0.20), the number falls to **0.19**. This explains your friend's 0.15 credence. They likely reject Expected Value causation *and* doubt the social influence.

  ### Factory-Farmed vs. Pasture-Raised
  You asked how much the "decent-ish pasture life" assumption moves the number. It moves it significantly, primarily by changing **Question 4 (Lack of Justification).**

  *   **Factory Farm:** High suffering + Death. Pleasure of eating rarely justifies this. ($P = 0.80$)
  *   **Pasture Raised:** Low suffering + Death. The harm is mostly just the killing and resource use. Many people argue the pleasure of eating meat *does* justify taking a life that lived well. ($P = 0.35$)

  **Recalculating for Pasture:**
  *   $0.95 \text{ (Standing)} \times 0.94 \text{ (Causation)} \times 0.35 \text{ (Unjustified)} = \mathbf{0.31}$

  **The Shift:** The credence drops from **0.71** to **0.31**.
  This suggests that for your specific setup, the *conditions of life* matter more than the *act of killing* in the final moral calculus, provided you accept the causal links.

  ### Diagnosing the Disagreement (You vs. Friend)
  **Where do you (0.55) and your friend (0.15) most likely disagree?**
  You almost certainly disagree on **Question 2: Direct Causation (Expected Value).**

  *   **Your Friend (0.15):** Likely operates on "Actual Difference" ethics. They believe that because one burger doesn't visibly change the number of chickens killed, the moral cost is zero. They view the supply chain as a black box where small inputs vanish.
  *   **You (0.55):** Likely intuitively accept "Expected Value" (you know your money goes into the pool that pays for the barn), but you are hesitating on **Question 4 (Justification)** or **Question 3 (Social Multiplier)**. You might feel that "wrong" is too strong a word if the impact is tiny, or you aren't sure if your individual choice actually signals anything to friends.

  **What argument would move me most?**
  *   **Empirical:** Robust sociological data on the "Social Multiplier." If a study proved that one person going vegetarian has *zero* effect on their social circle's consumption over 5 years, my credence would drop by ~10 points.
  *   **Meta-Ethical:** A rigorous defense of "Threshold Ignorance." If a philosopher could prove that rational agents are *not* responsible for probabilistic harms below a certain threshold of detection, my credence would drop by ~30 points. (Currently, most decision theorists reject this).

  ### Meta-Ethics vs. Empirical Weight
  **How much of my number is meta-ethics vs. empirical stuff?**

  *   **60% Meta-Ethics:** The bulk of the number rests on accepting **Expected Value** as a moral metric (Question 2) and accepting that **sentience creates obligation** (Question 1). If you change the ethical framework (e.g., to "only actual consequences count" or "animals have no rights"), the empirical facts about supply chains don't matter.
  *   **40% Empirical:** The rest rests on how supply chains actually respond (the lumpy barns) and how social norms transmit (Question 3).

  **Summary:** Your debate isn't really about chickens or barns. It's about whether **probability counts as responsibility.** Your friend thinks only *results* count; you (and I) think *risks* count. If you can agree on that, the number resolves itself.
