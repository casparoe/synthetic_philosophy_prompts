answer: |-
  # Question-Period Prep Sheet

  **Strategy Note:** Your thesis retreats from ontological anti-mechanism to *epistemic* anti-mechanism. This shields you from claims that you've disproven AI, but exposes you to claims that you've proven nothing of consequence. Your defense must consistently pivot to the *value* of the epistemic distinction: that "surveyability" is the only kind of computationalism that matters for understanding *reason* as opposed to mere *output*.

  ---

  ### 1. The Inconsistency Objection (Graduate Student)
  **[HOPE NOBODY ASKS]**
  **Vocabulary:** Inconsistency, formal system, error-correction, Gödel applicability.
  **Question:** "You rely on the assumption that human mathematical reasoning is consistent enough for Gödel's theorem to apply. But the secondary literature overwhelmingly suggests human mathematicians are inconsistent—we hold contradictory beliefs, we make mistakes, we revise axioms. If the human mind is an inconsistent formal system, Gödel's sentence doesn't generate a truth we can see; it just generates noise. Doesn't this dissolve your premise before you even get to surveyability?"

  **2-Minute Reply:**
  "I distinguish between *occasional error* and *systemic inconsistency*. A machine that occasionally crashes or outputs a typo is not formally inconsistent in the logical sense; it doesn't prove $P$ and $\neg P$ as theorems of its operating system. Human error is usually correctable upon reflection. My argument relies on the *idealized* capacity to recognize truth upon reflection, not on the claim that we never make mistakes. If we were systemically inconsistent, we could prove anything, and 'seeing the truth' would be meaningless. The fact that we can identify our own errors presupposes a consistent meta-standard we are appealing to."

  **Frank Note on Soft Spot:**
  This is your weakest flank. Distinguishing "mistakes" from "inconsistency" is philosophically convenient but empirically murky. If the grad student presses on *how* we identify the meta-standard without circularity, you have no formal answer. You are begging the question of consistency.

  ---

  ### 2. The Soundness Certification Problem (Proof Theorist)
  **Vocabulary:** Soundness, consistency proof, reflexive justification, proof-theoretic strength.
  **Question:** "You claim we can 'endorse' a machine as sound. But to certify a machine $M$ as sound, you must assume your own reasoning is sound. By Gödel II, you cannot prove your own consistency. So, on what basis do you claim the authority to endorse $M$? If you can't prove you're sound, your endorsement of $M$'s soundness is epistemically baseless, and the Gödelian sentence $G(M)$ loses its force."

  **2-Minute Reply:**
  "I am not asking for a formal proof of our own soundness within the system. I am pointing to a pre-theoretic, epistemic fact: we *do* endorse certain logical principles (like modus ponens) as sound. The argument is conditional: *If* we can identify a machine that captures our reasoning, *and* we can verify its rules match those we endorse, *then* we can see the truth of $G(M)$. The impossibility lies in completing that verification while maintaining equivalence. The barrier isn't that we lack authority; it's that the act of specification creates a gap between the specifier and the specified."

  **Frank Note on Soft Spot:**
  You are shifting from "proof" to "endorsement." The proof theorist will hear this as retreating from logic to psychology. You haven't explained *how* we verify the machine's soundness without assuming what we're trying to prove. It feels like a hand-wave.

  ---

  ### 3. The Turing Jump Relocation (Recursion Theorist)
  **Vocabulary:** Turing degree, Turing jump, arithmetical hierarchy, oracle machine.
  **Question:** "If you can see the truth of $G(M)$, which $M$ cannot prove, you are effectively computing the Turing Jump of $M$. This just means you operate at a higher Turing degree. Why is this anti-mechanism? It just implies that if the mind is a machine, it's a hyperarithmetic machine or an oracle machine, not a standard Turing machine. You haven't refuted mechanism; you've just relocated it up the hierarchy."

  **2-Minute Reply:**
  "Because 'Surveyable Computationalism' requires the machine to be *write-down-able* and *inspectable* by us. An oracle machine or a hyperarithmetic system is not surveyable in the required sense; we cannot write down the oracle's function. My claim is that there is no *surveyable* machine that matches us. If the only way to save mechanism is to posit a machine whose operations we cannot comprehend or specify, then mechanism ceases to be an explanation of *reason* and becomes a mere label for 'whatever produces the output.'"

  **Frank Note on Soft Spot:**
  You are conceding that a non-surveyable machine might match you. The recursion theorist will count this as a victory for computationalism. You are arguing about the definition of "mechanism," not the fact of it.

  ---

  ### 4. The Scope of Cognition (Functionalist Philosopher)
  **Vocabulary:** Cognitive architecture, input-output equivalence, functional role, modularity.
  **Question:** "Even if you're right about mathematical reason, that's a tiny slice of cognition. Most of what the brain does is perception, motor control, and heuristic decision-making, all of which are plausibly computational. Why should the limits of theorem-proving dictate our view of the mind as a whole? Isn't this a category error?"

  **2-Minute Reply:**
  "It's not a category error because mathematical reason is the one domain where we explicitly claim to be following rules that we understand. If mechanism fails there, where the norms of reasoning are explicit, it casts doubt on the computational description of the rest. If the 'software' model breaks for the part of the mind that deals with logic and truth, we lose the license to assume it works for perception, where we have no access to the 'code' at all. The mathematical case is the test bed for the computational metaphor."

  **Frank Note on Soft Spot:**
  This is a bluff. Most cognitive scientists agree perception is computational and math is... special. They will happily compartmentalize. You are overgeneralizing from a niche case.

  ---

  ### 5. The Biological Vacuity (Neuroscientist)
  **Vocabulary:** Substrate, implementation, physical constraints, source code.
  **Question:** "You keep using the word 'surveyable.' But brains don't have source code. They have weights, connections, and neurochemistry. There is no 'program' to write down, only models we build to approximate the physics. Isn't 'surveyable computationalism' a straw man that no serious neuroscientist actually holds?"

  **2-Minute Reply:**
  "It's not a straw man; it's a constraint on explanation. If computationalism is true, there *must* be a level of description at which the brain is a logical system, even if the substrate is analog. My argument is that if such a description exists, we cannot both possess it and be bound by it. The lack of 'source code' in the biology doesn't save mechanism; it just makes the 'machine' even less surveyable. If anything, the biological complexity strengthens my claim that we cannot inspect the machine we are."

  **Frank Note on Soft Spot:**
  You are conflating "logical description" with "physical program." The neuroscientist is right: if there is no discrete program, Gödel doesn't apply to the brain directly, only to our *models* of the brain. You are attacking the model, not the mind.

  ---

  ### 6. The Ordinal Iteration Limit (Proof Theorist)
  **Vocabulary:** Ordinal analysis, consistency strength, transfinite iteration, reflective closure.
  **Question:** "We can iterate consistency statements transfinitely. For any $G(M)$, we can add $Con(M)$ to the system and proceed. Why can't the human mind be identified with the limit of this transfinite progression? Why does the process have to stop at a specific surveyable machine?"

  **2-Minute Reply:**
  "Because to iterate the consistency statement, you must recognize the ordinal notation as well-ordered. That recognition is not itself mechanical; it requires mathematical insight. At some point, the ordinal notations become too complex for us to survey. The 'human mind' isn't a fixed limit of this progression; it's the activity of judging the progression. You can't capture the judge within the judged sequence without losing the capacity to judge the next step."

  **Frank Note on Soft Spot:**
  This is a standard Feferman-style objection. You are asserting that "judging well-orderedness" is non-algorithmic. The proof theorist knows this is the exact point of contention and will not accept it as a given.

  ---

  ### 7. The Ontological Concession (Functionalist Philosopher)
  **Vocabulary:** Ontology, epistemology, metaphysical claim, explanatory power.
  **Question:** "You concede mechanism might be ontologically true. So, what work is this doing? If there *is* a machine that matches us, even if we can't name it, haven't you granted the physicalist everything they need? This sounds like skepticism, not anti-mechanism."

  **2-Minute Reply:**
  "It's not skepticism; it's a claim about the nature of understanding. If the machine exists but is unsurveyable, then understanding our own minds is impossible in principle. That is a substantive metaphysical conclusion. It means the mind cannot be fully objectified by itself. That limits the reach of cognitive science. It tells us that a complete third-person theory of the mind is unattainable, which is a significant result, not a trivial concession."

  **Frank Note on Soft Spot:**
  Many in the room will think this *is* trivial. They want to know if the mind is a computer, not if we can *prove* it is. You risk sounding like you're selling a consolation prize.

  ---

  ### 8. The Verification Trap (Graduate Student)
  **Vocabulary:** Algorithmic verification, Penrose, error, secondary literature.
  **Question:** "Penrose argued we could verify the algorithm, but critics showed verification is itself algorithmic. You've shifted to 'endorsement,' but isn't endorsement just a non-algorithmic name for a verification process we haven't formalized yet? Aren't you just positing a 'homunculus' that sees truth?"

  **2-Minute Reply:**
  "I'm not positing a homunculus; I'm positing a capacity. We verify proofs now. We don't need a new faculty. The point is that the verification of the *system* containing the verifier cannot be completed within the system. It's not that verification is non-algorithmic; it's that the *totality* of our verification practices cannot be captured in a single surveyable package. I'm not adding a magic step; I'm pointing out the structural limit of packaging."

  **Frank Note on Soft Spot:**
  The grad student has read the critiques. They know "capacity" is often a code word for "magic" in this debate. If they press on how this capacity interacts with physical brain states, you will be forced into dualism or obscurity.
