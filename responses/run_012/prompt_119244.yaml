answer: |-
  You are assuming charity operates like a logical proof rule, applied line-by-line, or else like a vague blessing on the final result. But on our account, charity is a constitutive constraint on the holistic web of attribution. We do not interpret sentence by sentence; we construct a theory that simultaneously assigns meanings and beliefs to maximize the overall truth of the speaker's hold-true attitudes. This means we can indeed ascribe a contradiction, but only because the rest of the web is secure enough to fix the meanings of the terms involved. If she asserts $P$ when $P$ is obviously true, and later asserts $\neg P$ when $\neg P$ is obviously false, we have not failed to interpret her; we have identified a localized failure of rationality. The constitutive ideal of rationality does not require infallibility; it requires that the subject be intelligible as a thinker at all. A thinker must be mostly right about the world and mostly consistent, precisely so that her errors and inconsistencies stand out as errors and inconsistencies rather than noise.

  So I take neither horn as you sharpen them. The constraint is strong enough to make the contradiction detectable, because without a background of consistency we couldn't fix the meaning of $P$ to begin with. But it is weak enough to allow the contradiction to exist, because the ideal governs the system as a whole, not every node within it. On my account, her utterance comes to a genuine ascription of inconsistent beliefs, identified against a backdrop of successful interpretation. You might worry this makes irrationality too easy to find, but remember the distinction between specifying a belief and causally explaining it. Our theory specifies that she believes both; it does not explain how she came to do so. That she can hold them both is a failure of rationality, but that we can identify this failure is a triumph of interpretation. If she were globally inconsistent, we would have no theory at all; but a local slip is the very thing that proves she is a believer capable of slipping.
