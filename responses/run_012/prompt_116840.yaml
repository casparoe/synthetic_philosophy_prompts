  | `isn't part of the objective` | The objective specification is complete regarding permissible changes. | needs a value judgement | An agent might need to pick up a key to open a door; if `has_key` isn't in the goal spec, your penalty discourages necessary instrumental actions. | Define side effects relative to a *baseline policy* (e.g., "do nothing") rather than just the goal specification. |
