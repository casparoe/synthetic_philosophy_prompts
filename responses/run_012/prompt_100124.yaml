      *   *Axioms/Postulates:* Axioms are self-evident truths about experience (existence, composition, information, integration, exclusion). Postulates are the physical requirements needed to satisfy axioms (causal powers, etc.). In the user's terms: Axioms are constraints on the target variable (consciousness); Postulates are the mapping function from causal graph properties to that variable.

