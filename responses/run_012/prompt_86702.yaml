answer: |-
  **MERIDIAN FACILITIES GROUP**
  **EMPLOYEE HANDBOOK v.14.2 (ETHICAL EXPANSION UPDATE)**

  **1.0 WELCOME TO THE MORAL EXCELLENCE FRAMEWORK**
  **From the Desk of CEO Dr. Aris Thorne**
  Welcome to the new Meridian. Historically, corporate culture distinguished between "duties" and "extraordinary efforts." We have abolished this distinction. Under the Moral Excellence Framework, all actionable benevolence is now classified as a Core Deliverable. We are excited to streamline your morality into measurable KPIs. Please review the following updates regarding mandatory supererogation.

  **2.0 PERFORMANCE TIERS AND CONSEQUENCES**
  All staff will be evaluated quarterly against the Baseline of Total Altruism.

  | Tier | Classification | Definition | Consequence |
  | :--- | :--- | :--- | :--- |
  | **3** | **Exemplary** | Acted beyond required parameters (see Section 5.0). | Public Commendation. |
  | **2** | **Compliant** | Met all mandatory extraordinary expectations. | Continued Employment. |
  | **1** | **Deficient** | Performed only contractually obligated duties. | Performance Improvement Plan. |

  *Note: As all beneficial acts are now contractually obligated, Tier 2 is the minimum standard for retention.*

  **3.0 PROMOTIONAL PATHWAYS: HEROES VS. SAINTS**
  Meridian offers two distinct ladders for advanced moral labor.
  *   **The Heroes Track:** Focuses on physical risk mitigation (e.g., equipment salvage during hazards).
  *   **The Saints Track:** Focuses on emotional labor and personal sacrifice (e.g., forfeiting breaks to console clients).
  *Employees may not switch tracks once designated.*

  **4.0 FAQ: SCOPE OF DURING**
  **Q: Am I really expected to run into the burning building?**
  **A:** Context depends on survivability assessments. If the building contains company assets or clients, entry is considered a "Reasonable Moral Expectation." Please consult the Risk vs. Virtue Matrix (Form V-4) before entering. If the Matrix is unavailable, assume entry is mandatory.

  **5.0 RECOGNITION PROGRAMS**
  **5.1 Hero of the Quarter**
  Selection is based on peer nomination. Please note: Acceptance of the Hero of the Quarter award is compulsory. Refusal to accept public praise constitutes an admission of underperformance and will be processed as a Tier 1 infraction. You must agree that you did more than was required, even though was required.

  **6.0 GRIEVANCE PROCEDURE FOR SUPEREROGATORY CLAIMS**
  If an employee believes they have performed an act exceeding the Scope of Mandatory Excellence, they may file Form S-9 (Claim of Optional Virtue).
  *   **Burden of Proof:** The employee must demonstrate that the act was not implicitly required by the Moral Excellence Framework.
  *   **Adjudication:** As Section 1.0 defines all beneficial acts as required, no claim has been approved since the Framework's inception. Denial of Form S-9 is final.

  > **NOTE FROM THE OFFICE OF THE IN-HOUSE ETHICIST**
  > We are thrilled to report a major milestone: No employee has successfully performed a supererogatory act since Q3 2019. This indicates total alignment with our new baseline. Previously, "going above and beyond" suggested the baseline was too low. Now that the baseline includes everything good, we have eliminated moral slack. Excellent work.

  **7.0 COMPLIANCE**
  By remaining employed at Meridian, you consent to the reclassification of your kindness as inventory. Thank you for making excellence mandatory.

  ***

  *Footnote 14: The Union contends that mandating self-sacrifice violates labor laws regarding unpaid work and hazard pay. This footnote is for legal record only and does not alter employee obligations.*
