  | 4 | Historians (Modern Europe) | "Jaspers' taxonomy presupposes a total rupture of state continuity—1945 Germany. You're importing a framework of collapse into a context of continuity. In your setting, the militia *became* the state. You can't use a taxonomy designed for regime change to analyze a regime that successfully solidified its violence into law." | Your reading/application of Jaspers. | High | "That's a precise historical critique. I'm not using Jaspers to claim the contexts are identical, but to use the friction between them. The tension in the book comes from the fact that the 'rupture' never happened here. The characters are trying to apply a logic of atonement to a system that never acknowledged the crime. The mismatch is the point." | Concede the analogy is imperfect. Don't defend the historical parallel; defend the *use* of the mismatch. |

