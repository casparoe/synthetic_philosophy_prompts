answer: |-
  The puzzle of the statue and the clay arises from the apparent violation of Leibniz's Law. If a statue ($S$) is made of a lump of clay ($L$), they share all spatial and physical properties at the time of creation. However, they appear to differ in modal properties: $L$ can survive being squashed, whereas $S$ cannot. If $S$ and $L$ have different properties, they cannot be identical. Yet, intuitively, there is only one object in that location. Two influential responses to this puzzle are the Constitution View and the Sortal-Relative Identity View. This essay compares these positions, applies them to a specific case of material replacement and reassembly, and evaluates their respective merits.

  The Constitution View, championed by philosophers such as Lynne Baker, posits that $S$ and $L$ are distinct objects that are spatially coincident. $L$ constitutes $S$, but $S$ is not identical to $L$. This view accepts that two material objects can occupy the same space at the same time. It handles the modal difference by assigning different essential properties to the two objects based on their sortals. It is essential to $L$ (as a lump of matter) to retain its material constitution, allowing it to survive squashing. It is essential to $S$ (as an artefact) to retain its form or artistic status, meaning it ceases to exist if squashed. Consequently, the Constitution View is explicitly committed to coincident objects. Proponents argue this is a benefit, as it respects the intuition that the statue has properties the clay lacks; detractors argue it is a metaphysical cost, violating parsimony by populating the world with redundant entities.

  In contrast, the Sortal-Relative Identity (SRI) View, associated with Peter Geach, denies that identity is an absolute relation. Instead, identity is relative to a sortal concept. One cannot ask if $S$ is identical to $L$ *simpliciter*; one must ask if they are the same *statue* or the same *lump*. On this view, there is only one object, but it falls under different sortals with different persistence conditions. The modal difference is handled by noting that the persistence conditions attach to the sortal, not the object in isolation. Under the sortal 'lump', the object survives squashing; under 'statue', it does not. SRI avoids the commitment to coincident objects, as there is only one entity described in two ways. This is metaphysically economical, though it requires revising classical logic's notion of absolute identity.

  Consider the case of the conservator. A sculptor creates a statue from a single lump of clay. Over time, the conservator replaces the clay molecules with synthetic material, storing the original clay. Once replacement is complete, the conservator re-moulds the stored clay into a statue of the same shape. We are left with two candidates: the synthetic object (Object A) and the re-moulded clay object (Object B).

  According to the Constitution View, we must track the persistence conditions of the original statue and the original lump separately. Artefacts like statues typically persist through gradual material replacement provided there is continuity of form and function (a Ship of Theseus intuition). Therefore, Object A is the original statue. The original lump, defined by its specific material constitution, survived the storage and reassembly; thus, Object B consists of the original lump. Since the conservator re-moulded Object B into a statue shape, Object B is also a statue, but it is a *new* statue constituted by the original lump. Object A is a statue constituted by a new synthetic lump. Consequently, the Constitution View concludes there are two statues at the end. The original statue is Object A. The original lump survives as the matter of Object B.

  The SRI View yields a similar practical verdict but via a different ontological route. We ask: "Is Object A the same *statue* as the original?" Yes, due to continuity of form. "Is Object B the same *statue* as the original?" No, as the continuity was broken. Conversely, "Is Object B the same *lump* as the original?" Yes, as it comprises the same matter. "Is Object A the same *lump* as the original?" No. Thus, relative to the sortal 'statue', there is one original (Object A). Relative to the sortal 'lump', there is one original (Object B). SRI does not posit two objects at Location A; it posits one object that is the same *statue* as the original but not the same *lump*.

  The two views agree on the ordinary counting of statues: both identify Object A as the original statue and acknowledge Object B as a distinct entity (either a new statue or the original lump). They diverge on the ontology of Location A. The Constitution View claims there are two coincident objects there (the statue and the synthetic lump), whereas SRI claims there is only one object described differently. Regarding metaphysical economy, SRI is superior as it avoids coincident objects. However, regarding fidelity to ordinary counting practices, the Constitution View may have an edge. When we ask "How many objects are on the plinth?", ordinary language suggests 'one', but the Constitution View explains why we might count differently depending on whether we care about art or matter, without denying the existence of the matter. SRI, by making identity relative, can make transitive counting difficult (if $A$ is the same statue as $B$, and $B$ is the same lump as $C$, is $A$ the same object as $C$?).

  In handling the modal difference, the Constitution View is more robust. It preserves the standard logic of identity (Leibniz's Law holds absolutely) by multiplying entities. SRI preserves the number of entities but at the cost of standard logic. The commitment to coincident objects is the primary cost of the Constitution View. However, I argue this is a acceptable cost. Denying coincidence forces one to deny either that the statue exists, that the clay exists, or that they have different properties. Accepting coincidence allows us to maintain all these intuitions.

  I find the Constitution View stronger. It provides a clearer account of causal powers and properties; the statue causes aesthetic appreciation, the clay causes chemical reactions, and these are distinct causal profiles best explained by distinct objects. However, I would abandon this view if a compelling argument were presented showing that spatial coincidence is metaphysically impossible—for instance, if a theory of quantum exclusion or a refined mereological principle demonstrated that two material objects with the same parts cannot exist in the same region without being identical. If coincidence were proven impossible, the Constitution View would collapse, forcing a retreat to SRI or a eliminativist view where statues do not truly exist.

  In conclusion, while the Sortal-Relative Identity View offers greater parsimony, the Constitution View offers a more stable logical framework and a clearer explanation of modal differences. In the conservator case, both views successfully identify the synthetic object as the original statue, but the Constitution View does so by acknowledging the distinct existence of the material and the form, even when they part ways. Whilst the cost of coincident objects is high, it is the price required to preserve the reality of both the artefact and the matter from which it is made.
