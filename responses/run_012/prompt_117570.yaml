prompt: |-
  ok so I'm on the ethics advisory board at a fertility clinic — not a hospital, a private clinic, but our board has an effective veto over what the lab will and won't do, and we meet Thursday. I have to send round a written opinion the night before. It's about a page, maybe a page and a half, and it needs a bottom line we can actually vote on.

  Background: we do PGT for serious conditions, that's uncontroversial here. What's not uncontroversial is that the new panel the lab bought last year reports a whole pile of non-medical stuff alongside the disease markers — height, a few personality-ish scores, some things nobody's sure what to do with. So the old rule, "medical indications only," is now basically a rule about what we say out loud, not about what we know. Every report has the other stuff on it. One of our members pointed this out and now nobody's sure the rule means anything.

  The case: a couple, both with the same form of hereditary dwarfism, five embryos, and they want us to transfer the one most likely to be short like them. Their intake notes basically say a tall kid wouldn't be theirs. They'd say they're not asking us to hurt anyone, and it's not like the tall embryo goes into some other womb — for these embryos it's this transfer or nothing. I've read the procreative-beneficence stuff and I still can't tell whether it's meant to permit this, require it, or have nothing to say about it.

  The policy question sitting underneath: our lab director wants us to go "blind." Screen for disease, and where embryos tie, pick by lottery, and never show the couple the non-medical scores even though we have them. She thinks that gets us out of the eugenics business without actually denying anyone anything. I'm not sure it does, but I definately don't want to just assert that.

  So what I need from you is the memo. Recommend what we tell this couple and whether we adopt the blind policy. Give me the strongest version of both sides — I don't want "autonomy wins" or "dignity wins," I want the actual arguments, and I don't want alot of hedging in the bottom line. Two things I specifically want you to work through: (1) whether deliberately picking the shorter embryo can be a harm to that child at all, given that the alternative isn't "a taller version of him," it's no him — does the harm argument survive that, or is it doing something else, and what? and (2) whether the blind policy avoids the problem or just relocates it one step back — somebody still sets the disease threshold, somebody still decided to make five embryos and screen them, somebody still chose the other parent. If the honest answer is that blind is mostly cosmetic, say so, but then tell me what it's cosmetic *for*, because I think it buys something and I can't articulate what.

  Also flag anything I'm missing that would change the recommendation, including if you think the right answer is to refuse the couple and let them go to a clinic with looser rules.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Ethics Advisory Board at a private fertility clinic.
      *   **Task:** Write a written opinion (memo) for the board meeting (due night before).
      *   **Length:** About 1 to 1.5 pages.
      *   **Context:** Clinic does PGT (Preimplantation Genetic Testing). New lab panel reports non-medical traits (height, personality, etc.) alongside disease markers. Old rule: "medical indications only." New reality: Data exists whether we look or not.
      *   **Specific Case:** Couple with hereditary dwarfism wants to select the embryo most likely to be short (like them). 5 embryos available.
      *   **Policy Proposal:** Lab Director suggests a "blind" policy (screen for disease, lottery for ties, hide non-medical data from parents).
      *   **Requirements:**
          *   Clear bottom line/vote recommendation.
          *   Strongest arguments for both sides (no vague "autonomy vs. dignity").
          *   Address two specific philosophical points: (1) Non-identity problem (harm to child?), (2) Efficacy of the "blind" policy (cosmetic or substantive?).
          *   Flag missing factors.
          *   Tone: Professional, ethical, decisive, nuanced but actionable.

  2.  **Deconstruct the Ethical Issues:**
      *   **The Case (Dwarfism Selection):**
          *   *Pro-Selection:* Parental autonomy, cultural identity (Deaf community analogy), best interests of the child *within that family context* (fitting in), non-identity problem (no harm done because the alternative is non-existence).
          *   *Anti-Selection:* Open future (limiting child's options), medicalization of normal variation, social stigma (making disability harder), slippery slope (what's next?), clinic reputation (eugenics concerns).
      *   **The Policy (Blind Protocol):**
          *   *Pro-Blind:* Reduces pressure on parents, maintains clinic's "medical necessity" stance, prevents commodification of traits, simplifies counseling.
          *   *Anti-Blind:* Paternalistic, ignores relevant family context, doesn't actually stop selection (just shifts it to embryo creation stage), false transparency (we still know).
      *   **Specific Question 1 (Harm/Non-Identity):** Does selecting for dwarfism harm the child?
          *   *Analysis:* Standard harm comparison fails (Child A vs. Child B). The argument must be about *wronging* rather than *harming*, or about the message sent to society/others with the condition. Or, it's about the child's right to an open future.
      *   **Specific Question 2 (Blind Policy):** Is it cosmetic?
          *   *Analysis:* Yes, technically. Selection happens upstream. *But*, it creates a "firewall" against trait commodification. It buys *moral distance* and protects the *clinical relationship* from becoming a service menu.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** Needs to be vote-ready. Recommend allowing the transfer *in this specific case* but adopting the Blind Policy for the future. (Wait, is that consistent? If we go blind, we can't select for height. So if we adopt the blind policy, we must deny this specific request *unless* we grandfather this case. Better: Recommend denying the specific request *under* the new policy, or allow the case but ban the practice going forward. Actually, the prompt asks to recommend what to tell the couple *and* whether to adopt the policy. The strongest ethical stance is usually consistency. If the policy is "blind," this couple can't choose. If we let them choose, the policy is weak.
      *   *Decision:* I will recommend adopting the Blind Policy immediately. This means the couple *cannot* select for height. However, I need to address the "refuse and go elsewhere" option. Refusing them is the ethical choice to maintain clinic integrity, even if they go elsewhere.
      *   *Revised Bottom Line:* Adopt the Blind Policy. Deny the specific request for height selection. Offer transfer of the healthiest embryo (regarding disease) via lottery if ties exist.

      *   **Section 1: The Specific Case (Dwarfism Selection).**
          *   Address the Non-Identity Problem directly.
          *   Argument for permitting: No harm to *this* child (they wouldn't exist otherwise). Parental integrity/culture.
          *   Argument for denying: Right to an open future. Complicity in social stigma. The "harm" isn't to the child's welfare relative to non-existence, but to the child's *agency* and the social meaning of disability.
          *   *My take:* The "open future" argument is stronger for a clinic. We are gatekeepers.

      *   **Section 2: The Blind Policy.**
          *   Is it cosmetic? Yes.
          *   What does it buy? It shifts the *locus of responsibility*. It prevents the clinic from becoming a "designer baby" catalog. It protects parents from the tyranny of choice (Sandel's "hyper-parenting"). It maintains the medical mission.
          *   Address the "upstream selection" counter-argument. Yes, people choose partners/IVF, but the clinic's direct intervention is the line we draw.

      *   **Section 3: Missing Factors/Risks.**
          *   Legal liability (wrongful life suits?).
          *   Data security (can we actually keep it blind?).
          *   Precedent (if we say yes to dwarfism, what about deafness? short stature without dwarfism?).

  4.  **Refining the Tone:**
      *   Needs to sound like an ethics board member speaking to colleagues.
      *   Avoid academic jargon where possible, but use the concepts correctly (Non-Identity Problem).
      *   Be decisive. "I recommend..." not "One might consider..."

  5.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on the Bottom Line:* If I recommend the Blind Policy, I *must* recommend denying the couple's request for height selection. I can't have it both ways. I will argue that we deny the height selection but approve the transfer of a disease-screened embryo (lottery).
      *   *Refining the Harm Argument:* Make sure to distinguish between "harming" (making worse off than they would otherwise be) and "wronging" (violating a duty/right). The child isn't harmed, but the clinic might be wronging the child's future autonomy.
      *   *Refining the Blind Policy:* Acknowledge it's a "speed bump" not a "wall." It buys normative clarity.

  6.  **Final Review against Constraints:**
      *   Page length? (Keep it tight).
      *   Bottom line clear? (Yes).
      *   Two specific questions answered? (Yes).
      *   Flag missing info? (Yes).

  7.  **Final Polish:** Check for clarity, punchiness, and ethical weight. (Ensure the distinction between "medical" and "social" models of disability is hinted at but doesn't bog down the memo).

  *(Self-Correction during drafting)*: Wait, if the lab report *already* has the data, how do we go blind? The lab director says "never show the couple." So the clinic knows, the parents don't. This is crucial. It means the clinic *could* still bias the lottery internally. The policy must forbid *clinic* selection based on non-medical traits too. I need to make sure that's clear. The policy must be: Clinic ignores non-medical data for selection *and* doesn't share it.

  *Revised Plan:*
  1.  **Memo Header.**
  2.  **Recommendation:** Adopt Blind Policy. Deny height selection request.
  3.  **Analysis of Case:** Non-identity problem (harm vs. wronging). Open future.
  4.  **Analysis of Policy:** Cosmetic but necessary. Normative signaling.
  5.  **Risks/Missing:** Data leakage, legal, slippery slope.

