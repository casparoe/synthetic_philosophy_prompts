answer: |-
  **Proposal Title:** Structural Dissolution: Attitude Hybridity and the Wrong Kind of Reasons Problem

  **1. Research Question and Thesis Statement**

  The central research question for this project is: **Does the Wrong Kind of Reasons (WKR) problem arise for an attitude if and only if that attitude is structurally hybrid, comprising distinct cognitive and conative components subject to distinct normative standards?**

  The working hypothesis is that the WKR problem is not a fundamental puzzle about the nature of reasons or value, but an artifact of misdescribing the psychological architecture of certain attitudes. Standard discussions treat attitudes like admiration, respect, or envy as unified states that are simultaneously subject to a standard of correctness (fittingness) and responsive to practical reasons. The hypothesis to be tested is that in cases where the WKR problem arises, the attitude in question is not a unitary natural kind but a composite of a cognitive element (which bears the standard of fittingness) and a conative or affective element (which is responsive to practical reasons). If this hypothesis holds, the problem dissolves: there is no single state that is both fitting and supported by the "wrong" reason; rather, there are two components, one of which is fitting and the other of which is practically rational, and the conflict disappears once the unity of the attitude is rejected.

  **2. The Gap in Existing Positions**

  Current responses to the WKR problem generally fall into two families: restriction strategies and denial strategies. Restriction strategies attempt to save the Fitting-Attitude (FA) analysis of value by arguing that only reasons of a specific type (usually object-given reasons) count towards the correctness of the attitude. Denial strategies argue that the pragmatic incentives provided by cases like the Demon Threat are not genuine normative reasons for the attitude at all, but merely reasons to bring the attitude about.

  Both families of response leave the structural question open because they operate under a shared, unexamined assumption: that the attitude itself is a single, unified target for normative assessment. Restriction strategies focus on filtering the *inputs* (reasons) without analyzing the *receiver* (the attitude). They stipulate which reasons count but do not explain why certain attitudes admit of the wrong kinds while others might not. Denial strategies focus on the metaphysics of reasons, distinguishing between pragmatic and normative reasons, but they still presume that if the reason were normative, it would apply to the attitude as a whole.

  Neither approach asks whether the attitude is a suitable unit of analysis. By treating "admiration" as a black box, existing literature misses the possibility that the tension between fittingness and pragmatic reason is actually a tension between two different sub-components within the box. Consequently, the literature has not yet tested whether the susceptibility to the WKR problem correlates with the structural complexity of the attitude. This project aims to fill that gap by making the structure of the attitude the primary variable.

  **3. Methodology and Case Selection**

  To test the hypothesis within the scope of an eight-thousand-word paper, the project will proceed in four stages.

  **Stage 1: Establishing Criteria for Hybridity**
  The first task is to define what counts as a "hybrid" attitude without relying on the WKR problem itself (to avoid circularity). An attitude will be classified as hybrid if it meets two conditions:
  1.  **Phenomenological Separability:** It is possible to experience the cognitive component (e.g., judging something excellent) without the conative component (e.g., being drawn to it), and vice versa.
  2.  **Functional Independence:** The components can be rationally assessed independently. For example, one can be criticized for the judgment element without criticism attaching to the affective element.

  **Stage 2: Selection of Test Attitudes**
  I will apply the WKR test (specifically, the Demon Threat scenario) to three distinct attitudes, selected to cover the logical space of the hypothesis:
  1.  **Plausibly Non-Hybrid:** *Basic Desire.* I will treat simple, brute desire as the control case for a unified conative state. Proponents of simple conativism argue desire lacks a cognitive truth-apt component. If the hypothesis is correct, the WKR problem should not arise here in the same way, or practical reasons should straightforwardly justify the desire without conflicting with a standard of "fittingness."
  2.  **Plausibly Hybrid:** *Admiration.* This is the stock case for the WKR problem. It is widely regarded as having both a cognitive appraisal of excellence and an affective draw or commitment. This is the primary test case where the dissolution strategy should succeed.
  3.  **Contested:** *Respect.* The structure of respect is debated; some view it as a purely cognitive acknowledgment of status, others as an affective restraint. Testing this case will determine if the WKR problem's presence or absence tracks the resolution of this debate.

  **Stage 3: Application of the WKR Test**
  For each attitude, I will construct a Demon Threat case (a pragmatic incentive to hold the attitude absent the usual grounds). I will then analyze whether the normative conflict persists when the attitude is decomposed according to the criteria in Stage 1.
  *   *For Admiration:* I will argue the threat provides a reason for the conative element (to act as if admiring, or to cultivate the feeling) but bears on the fittingness of the cognitive element (the judgment of excellence).
  *   *For Basic Desire:* I will examine whether the lack of a cognitive standard of fittingness prevents the "wrong kind" of reason from appearing "wrong."
  *   *For Respect:* I will show that the ambiguity of the WKR problem in this domain mirrors the ambiguity of its structural classification.

  **Stage 4: Evaluation of the Dissolution**
  Finally, I will assess whether separating the components successfully dissolves the conflict. The key metric is whether we can account for the intuition that the Demon's threat gives us *a* reason to admire, but not a reason that makes admiration *fitting*, without positing two mysterious kinds of reasons. The explanation should be that the reason targets the conative component, while fittingness targets the cognitive component.

  **4. Advantages Over Alternative Approaches**

  This structural approach offers three distinct advantages over the standard restriction and denial strategies.

  First, it provides an **explanatory basis** for the distinction between right and wrong kinds of reasons. Restriction strategies often posit the distinction as primitive or define it circularly (the right kind of reason is the one that makes the attitude fitting). By grounding the distinction in the architecture of the mind, this project explains *why* the distinction exists: it maps onto the distinction between cognitive correctness and conative rationality.

  Second, it **preserves the FA analysis** without ad hoc restrictions. Restriction strategies often weaken the FA analysis by adding clauses that seem tailored solely to avoid counterexamples. If the WKR problem is dissolved by better psychological description, the FA analysis can remain a simple biconditional between value and fittingness, applied strictly to the cognitive component of the attitude.

  Third, it **unifies the treatment of different attitudes**. Current literature often treats the WKR problem as a general puzzle applicable to all pro-attitudes. This approach predicts variation: some attitudes should be vulnerable to the problem, and others immune, depending on their structure. This aligns better with the intuitive sense that the problem feels more pressing for admiration than for simpler states like enjoyment or desire.

  **5. Success and Failure Conditions**

  **Positive Result:**
  A successful outcome will demonstrate a strong correlation between structural hybridity and vulnerability to the WKR problem. Specifically, success requires showing that:
  1.  In the hybrid case (Admiration), decomposing the attitude allows us to assign the pragmatic reason to one component and the standard of fittingness to the other without remainder.
  2.  In the non-hybrid case (Basic Desire), the WKR problem either does not arise or is resolved differently, confirming that hybridity is the necessary condition for the specific puzzle at hand.
  3.  The "conflict" intuition is explained as a category mistake resulting from treating the composite state as a simple one.

  **Failure Conditions:**
  The project would fail if:
  1.  **The Unity Objection Holds:** If it can be shown that even if the attitude has components, the *state as a whole* is still the primary object of evaluation, and the Demon Threat provides a reason for the whole state, recreating the conflict.
  2.  **False Negatives:** If the WKR problem arises clearly for the putatively non-hybrid attitude (Basic Desire), the correlation breaks down.
  3.  **False Positives:** If a clearly hybrid attitude is shown to be immune to the WKR problem, the hypothesis that hybridity is the cause is undermined.
  4.  **Regress:** If explaining the normativity of the components requires the same distinction between reasons that the project aims to explain, the account becomes circular.

  **6. Feasibility and Scope Management**

  An eight-thousand-word paper is substantial but limited. The primary risk is becoming bogged down in the philosophy of mind required to defend the criteria for hybridity. Defending a full-blown theory of attitude structure is a project in itself and exceeds the scope of a semester paper in value theory.

  **Realistic Assessment:**
  It is realistic to propose the structural criteria and apply them, but it is not realistic to provide a definitive metaphysical account of why attitudes have these structures. The paper must treat the structural claims as plausible premises supported by phenomenological and functional evidence, rather than proven metaphysical truths.

  **Contingency Plan (What to Cut):**
  If the word count becomes constrained during drafting, I will prioritize the analysis of the **Plausibly Hybrid (Admiration)** case, as this is the core of the argument.
  1.  **First Cut:** The **Contested Case (Respect)**. While valuable for showing the predictive power of the hypothesis, it is not strictly necessary for the core argument. If space is tight, I will mention it as a direction for future research rather than analyzing it in depth.
  2.  **Second Cut:** The **Non-Hybrid Control (Basic Desire)**. If necessary, I can rely on the intuitive contrast between admiration and simple states without a full case study of desire. However, retaining the control case is preferable to rule out the possibility that the WKR problem is universal.
  3.  **Third Cut:** Detailed engagement with **Denial Strategies**. I will summarize the position that pragmatic incentives are not reasons, but I will not engage in a deep meta-normative debate about the nature of reasons. The focus must remain on the structure of the attitude, not the metaphysics of the reason.

  **Conclusion**
  This proposal outlines a shift from analyzing reasons to analyzing the attitudes those reasons target. By treating the WKR problem as a symptom of descriptive error regarding attitude unity, the paper aims to dissolve a persistent puzzle in value theory. The method is structured to test this claim against clear and contested cases, with a manageable scope that prioritizes the core argument over metaphysical digressions. If successful, this approach clarifies the limits of the Fitting-Attitude analysis and offers a more psychologically realistic account of how we value.
