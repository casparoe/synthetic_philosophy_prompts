      *   **Part (a): Why Chains? (The "Climbing a Ladder" Analogy)**
          *   Idea: ZL is about stopping an infinite ascent.
          *   If you have a sequence of things getting bigger ($A_1 \subset A_2 \subset \dots$), you need to know you don't fall off the edge of the universe.
          *   Why chains specifically? Because if things aren't comparable, you can't stack them to make something bigger. A chain is a single line of ascent.
          *   The "Upper Bound" condition ensures the poset is "tall enough" or "closed enough" at the top.
          *   *Key Insight:* Chains are the only shapes where "union" makes sense as a natural limit. If you have a diamond shape ($A \subset B, A \subset C$), $B \cup C$ isn't necessarily in the poset or an upper bound in the same way. Chains guarantee compatibility.

