          *   This is the meat of the question. Why does linear independence survive union but "proper subgroup" doesn't?
          *   *Concept:* **Finite Character.**
          *   Definition: A property $P(S)$ has finite character if $P(S)$ is true $\iff$ $P(F)$ is true for all finite $F \subset S$.
          *   *Linear Independence:* A set is dependent iff a *finite* linear combination is zero. So, independence is determined by finite subsets.
