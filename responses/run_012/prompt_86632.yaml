      *(Refining "Finite Character")*: Make sure to explain that "Linear Independence" is finite character, but "Being a Basis" is not (it also requires spanning). However, we apply ZL to Independent sets, then prove maximality implies spanning. This is a crucial distinction. ZL gives a maximal *independent* set. We then prove that is a basis.

