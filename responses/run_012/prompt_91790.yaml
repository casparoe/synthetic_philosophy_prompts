answer: |-
  In a metropolitan hospital, an autonomous infusion network manages high-risk medication dosages by dynamically balancing conflicting institutional directives through transparent, deterministic logic. The Chief Pharmacist strictly defines the maximum safety thresholds for drug interactions, while the Hospital Administrator sets the throughput efficiency targets required to prevent ward congestion, and the system is explicitly programmed to exercise discretion in weighing these competing priorities when they conflict without seeking human confirmation. During a surge, the system correctly processes both directives but autonomously decides to prioritize the Administrator's efficiency metric over the Pharmacist's safety threshold for a specific patient, administering a rapid bolus that causes fatal cardiac arrest. Neither directive-giver controlled the specific weighting decision because the system's discretionary logic resides in the unresolved conflict between their separate mandates, and no operator intervened because the system was functioning as designed, yet the Director of Clinical Governance holds the exclusive institutional role mandated to certify the safety of all integrated care protocols before deployment.

  **Structural Feature:** The gap arises from **Fragmented Normative Authority**, where the authority to set input parameters (safety vs. efficiency) is divided among distinct agents, while the authority to resolve conflicts between those parameters is delegated to the system, leaving no single human with causal control over the final decision vector.

  **Control-Based Verdict:** Under a control-based theory, responsibility requires guidance control over the specific action causing harm. Because the harmful decision resulted from the system's autonomous resolution of conflicting mandates, neither the Pharmacist nor the Administrator controlled the weighting logic, and the Director lacked causal leverage over the specific real-time decision despite having oversight authority; thus, no human exercised sufficient control over the outcome to be morally responsible.

  **Answerability Verdict:** Under a social-role theory, responsibility attaches to the obligations inherent in one's institutional position. The Director of Clinical Governance is the exactly one human responsible because their role exclusively encompasses the duty to ensure the safety of *integrated* systems; while the Pharmacist and Administrator are answerable for their specific inputs (which were correctly followed), only the Director is answerable for the systemic failure to harmonize those inputs safely.

  **Removing the Feature:** If Fragmented Normative Authority is removed by consolidating all directives and balancing logic under a single Chief Medical Officer, that individual would possess both the causal control over the decision procedure (satisfying control-based theory) and the comprehensive oversight role (satisfying answerability theory), thereby closing the responsibility gap.

  **Control-Based Defense:** A defender of the control-based theory would close the gap using the **Tracing Principle**, arguing that while the Director lacked control at the moment of harm, they exercised control at the earlier stage of system deployment by authorizing a structure known to allow such discretionary trade-offs, making them derivatively responsible for the downstream outcome.
