  2.  **Deconstruct the Theories:**
      *   **Control-Based Theory (CBT):** Responsibility requires control over the outcome. If I couldn't have done otherwise or didn't have sufficient causal leverage over the specific harm, I'm not responsible. Key concept: "Guidance Control" or "Regulative Control." If the system makes the decision autonomously based on its own discretion, and no human dictated that specific decision, CBT struggles to find a locus of control.
      *   **Answerability/Social-Role Theory (ART/SRT):** Responsibility is tied to a role, obligation, or the capacity to give reasons for actions/outcomes within a social context. If you occupy a position of authority or oversight, you are answerable for what happens under your purview, even if you didn't directly control the specific mechanism. Key concept: "Responsibility as Obligation" or "Vicarious Liability" grounded in role.

