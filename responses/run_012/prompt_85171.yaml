answer: |-
  This is a sharp reconstruction of the Devlin position, and your tutor is right that the tension lies in the mechanics of the argument rather than the conclusion. You have correctly identified that premises (1) and (2) represent Devlin's core sociological and political claims, while (3) is the mechanism that turns those claims into a license for total moral enforcement.

  You should cut **(3)**.

  Here is why (3) is the culprit, why it deceived you, and what you pay to remove it.

  **Why (3) is the weak link**
  Step (3) is Devlin's famous "seamless web" argument. It claims that because morality holds society together, every specific moral rule is equally essential to that structure, and we cannot distinguish between "major" and "minor" moral rules without risking collapse. This is an empirical claim about how societies function, and it is almost certainly false. History shows that societies routinely discard specific moral strands (usury laws, blasphemy codes, dietary restrictions) without disintegrating. Hart's primary critique was precisely here: he argued that a society can survive changes in its moral fabric just as a ship can have planks replaced without sinking. By accepting (3), you are accepting that moral stagnation is a condition of societal survival, which contradicts the observable reality of moral progress.

  **Why it looked fine**
  (3) looks plausible because it appeals to conservative prudence. It mimics the logic of structural engineering: if you don't know which beam is load-bearing, you shouldn't remove any of them. In the context of the 1950s (when Devlin was writing), amidst fears of social fragmentation, the idea that "any change might be fatal" felt like a responsible precaution. It also protects (1) and (2) from having to do too much work; it solves the problem of *which* morals to enforce by saying "all of them," which is logically tidy even if practically tyrannical.

  **What you pay for cutting it**
  If you cut (3), you lose the justification for enforcing *private* morality that causes no public harm. You must admit that society can distinguish between morals that are essential for public order (e.g., prohibitions on violence) and morals that are merely preferences or traditions (e.g., dietary laws or sexual norms among consenting adults). This moves you closer to Hart's liberal position. You pay the price of having to develop a criterion for distinguishing "load-bearing" morals from expendable ones—which is difficult, but not impossible. You also concede that society is more robust than Devlin thought; it can survive disagreement and moral change without ceasing to be a society.

  **Regarding your friend's suggestion**
  Your friend suggests keeping (3) but adding a filter to test for "load-bearing" strands. She is mistaken. Premise (3) explicitly states that "there's no way to know in advance which strand is load-bearing." If you claim you *can* test for it (by decriminalizing and measuring compliance), you are contradicting the justification within (3). Your friend is actually proposing that you delete (3) and replace it with a new, empirically testable premise. She is right that this repairs the argument, but she is wrong that it keeps (3). Her "spreadsheet" worry is valid, however: without a clear theory of *why* certain morals are load-bearing beyond mere intuition, you risk replicating Devlin's "ordinary man's outrage" test under a different name.

  **Regarding Premise (2)**
  You can keep (2). Premise (2) is the principle of self-preservation: a society may do what is necessary to survive. This is generally acceptable in political philosophy. It only becomes toxic when combined with (3). If (3) is false, then enforcing every moral strand is not "necessary," so (2) does not authorize it. Cutting (3) saves (2) from condemning you to defend the criminalization of butchers.

