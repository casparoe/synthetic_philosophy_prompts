answer: |-
  Consider a character named Elias, a quiet town clerk in a novel set during a military occupation. His defining trait is a steady, unshowy courage: the willingness to refuse collaboration even at the cost of his life. The plot builds tension as the occupying commander demands Elias hand over a list of local dissidents. Elias delays, preparing his mind to say "no," but before the commander can return to enforce the demand, a peace treaty is signed overnight and the army withdraws. Elias never has to speak his refusal, and the occupation ends without bloodshed.

  In this scenario, it is genuinely unsettled whether Elias possessed the courage he is credited with. If the disposition is **absent**, Elias was merely stalling for time, hoping for a rescue that arrived by luck; he is a fraud whose self-image is false. If the disposition is **present-but-masked**, Elias was genuinely prepared to refuse and die, but the treaty acted as an external interferer (a mask) that prevented the manifestation of his refusal while leaving his resolve intact; he is a hero denied his moment. If the disposition is **present-but-finked**, Elias possessed the resolve in the abstract, but had the commander actually returned with a gun (the specific triggering condition), the immediate proximity of death would have dissolved his will instantly; he is a man whose courage was real only so long as it remained untested.

  What turns on choosing one description over the others is the moral architecture of your novel. If the disposition is absent, the theme is the capriciousness of luck and the hollowness of reputation. If it is masked, the theme is the intrinsic value of integrity regardless of external validation. If it is finked, the theme is the fragility of human virtue under extreme pressure. To decide among them, you must look to the **categorical base** of the disposition within the text: the psychological or physical substrate that grounds the trait. You would decide by examining Elias's behavior in lower-stakes situations (did he tell small truths when lies were safer?) or through reliable internal narration (does the text confirm his commitment to the principle, or only his fear?). If the text establishes a robust psychological foundation through these smaller acts, the "masked" description is warranted; if the text shows his resolve is contingent on safety, it is "finked"; if the text shows his delays were calculated self-preservation, it is "absent."

  In short: I would defend the present-but-masked description because a novel's unique access to a character's categorical base—their internal commitments and history of smaller choices—can substantiate a disposition even when external circumstances prevent its final manifestation.
