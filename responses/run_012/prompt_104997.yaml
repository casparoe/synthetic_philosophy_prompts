      *   *Masking:* The disposition is there, but something else stops the effect. (e.g., A fragile vase is packed in styrofoam. If struck, it won't break, but it's still fragile.)
      *   *Finking:* The disposition disappears *just as* the trigger happens. (e.g., A wizard makes the vase non-fragile the moment it is struck.)
      *   *Absence:* The disposition isn't there to begin with.

