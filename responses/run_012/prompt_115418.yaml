  # JOINT STATEMENT ON IMPARTIALITY AND INTEGRITY
  **Signatories:** [Representative of Act-Utilitarianism] & [Representative of Williamsian Integrity Theory]
  **Date:** October 26, 2023
  **Subject:** Outcomes of Adversarial Collaboration on the Impartiality-Integrity Dispute

  ### I. AGREED CLAIMS

  1.  **On the Case of the Man Who Saves His Wife:** We agree that the case of the agent who saves his wife rather than a stranger does not establish that act-utilitarianism is logically incoherent or impossible to act upon. It does, however, establish that there is a phenomenological conflict between the *motivation* required by deep personal relationships and the *justification* required by strict impartiality. We agree that a moral theory that renders the agent's actual motivation morally suspect in such cases fails to capture a significant aspect of human ethical experience, even if it correctly identifies the act as permissible or obligatory.

  2.  **On the Purpose of Moral Theory:** We agree that a moral theory need not function as a moment-to-moment decision procedure for the agent. We distinguish between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent should deliberate). We agree that much of the apparent conflict arises when the criterion of rightness is mistaken for a required deliberative algorithm.

  3.  **On the "One Thought Too Many" Objection:** We agree that Bernard Williams's complaint regarding "one thought too many" is primarily a complaint about the *structure of justification* and its corrosive effect on the *character of deliberation*, rather than a claim that the agent cannot physically entertain the thought. We agree that if the justification for saving a loved one must always appeal to an impartial standard to be valid, the relationship itself is instrumentally degraded. We disagree on whether this degradation is fatal to the theory, but we agree on what the objection targets: the alienation of the agent from their ground projects via the demand for an external validating standpoint.

  4.  **On the Scope of the Dispute:** We agree that the dispute is not merely about the extension of the word "moral." It is not simply that the Utilitarian calls a wider set of considerations "moral" than the Williamsian. The dispute concerns the authority of the moral standpoint over rational agency as such. We agree that if the moral standpoint demands the abandonment of the projects that constitute the agent's identity, the conflict is between morality and rationality, not merely between two moral systems.

  ### II. DISAGREEMENTS AND CRUXES

  | Domain of Disagreement | Act-Utilitarian Position | Williamsian Position | Agreed Crux / Test | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Value of Integrity** | Integrity is a psychological disposition that is valuable instrumentally. It is to be maintained only insofar as it generally leads to the maximization of overall well-being. If sacrificing integrity yields more good, integrity should be sacrificed. | Integrity is constitutive of the self. It is not merely a disposition but the condition of agency. To sacrifice integrity for the aggregate good is not to make a trade-off but to dissolve the agent who makes the trade. | **The "Alienation" Empirical Test:** Longitudinal study of agents trained to deliberate strictly impartially vs. agents trained to prioritize ground projects. Measure psychological cohesion and reported meaningfulness. | **AU:** Impartial agents will report high meaningfulness derived from efficacy; any alienation is manageable cognitive dissonance.<br>**Williamsian:** Impartial agents will exhibit significant psychic fragmentation or report a sense of "hollowness" constitutive of alienation, regardless of efficacy. |
  | **The Role of the "Thought"** | The "one thought" (that this is the impartially optimal act) is necessary for *assessment* but not for *action*. An agent can act from love while the act is justified by utility. This "two-level" structure resolves the objection. | The justification infects the motivation. If the agent knows the ultimate validation of their love is impartial utility, the love is no longer unconditional. The two-level view preserves the theory but abandons the honesty of the agent's self-conception. | **The "Transparency" Argument:** Can an agent successfully maintain deep personal relationships while consciously believing their ultimate justification is impartial utility? | **AU:** Yes. Agents can compartmentalize or adopt a "naive" stance in practice while holding the theoretical view. This is rational and stable.<br>**Williamsian:** No. The knowledge of the ultimate justification undermines the necessary belief in the intrinsic value of the relationship, leading to self-deception. |
  | **The Authority of Morality** | Morality (understood as rational requirement) is comprehensive. Any rational agent must acknowledge the impartial standpoint as the final court of appeal for all actions. | Morality is a specific, peculiar institution that may conflict with other rational requirements (prudence, aesthetic, personal). It does not have automatic trumping authority over all other reasons for action. | **The "Rational Requirement" Analysis:** Analysis of whether "irrational" in the moral sense implies "irrational" in the all-things-considered sense. | **AU:** Denying the impartial standpoint is a failure of rationality akin to a mathematical error.<br>**Williamsian:** Denying the impartial standpoint is a rejection of a specific social practice, not a failure of reason itself. |
  | **The Verbal vs. Substantive Core** | Much of the Williamsian resistance stems from a refusal to accept the utilitarian definition of "rationality." Once accepted, the integrity objection dissolves into a preference for sub-optimal outcomes. | Much of the Utilitarian resistance stems from a refusal to acknowledge that "rationality" cannot encompass the totality of human life without destroying the subject. The objection is ontological, not semantic. | **Definition of "Rationality":** Can we operationalize "rational" without begging the question against either side? | **AU:** We can define rationality as consistency and impartiality; Williamsians are smuggling in substantive values.<br>**Williamsian:** Any definition of rationality that excludes ground projects is question-begging against the nature of human agency. |

  ***

  ### AI ANALYSIS AND JUDGMENT

  **Assessment of Verbal vs. Substantive Dispute**

  As requested, I offer an independent judgment on the extent to which this dispute is merely verbal. Based on the collaborative output above and the history of the debate, my assessment is as follows:

  **1. The Verbal Component (Approx. 40% of the dispute):**
  A significant portion of the friction arises from equivocation on the function of a moral theory. The Act-Utilitarian typically treats theory as a *criterion of rightness* (a metric for grading the universe), while the Williamsian often critiques it as a *decision procedure* (a manual for living).
  *   **Resolution:** Once the Utilitarian concedes that the "impartial thought" need not be present in the moment of action (the two-level view), the "one thought too many" objection loses its bite as a claim about *action-guidance*. It retreats to a claim about *self-conception*.
  *   **Terminology:** The word "Morality" is doing excessive work. If the Utilitarian defines "Morality" as "The All-Things-Considered Rational Ought," and the Williamsian defines it as "A Specific System of Social Obligation," they are often talking past one another. The Williamsian is happy to admit impartiality is *moral*, but denies it is *rational*. The Utilitarian insists that if it is moral, it must be rational. This is largely a terminological boundary dispute regarding the scope of "rationality."

  **2. The Genuine Crux (Approx. 60% of the dispute):**
  Even after clarifying definitions, a hard core of disagreement remains regarding the *metaphysics of the self*.
  *   **Substantive Divergence:** The Utilitarian views the self as a vessel for experiences, where boundaries between persons are morally arbitrary. The Williamsian views the self as defined by those boundaries (projects, commitments, relationships).
  *   **Irreconcilability:** This is not verbal. It is a fundamental axiological disagreement. The Utilitarian values the *content* of experience (pleasure, preference satisfaction) across the aggregate. The Williamsian values the *structure* of agency (integrity, ownership of action). No amount of semantic clarification can resolve whether the "separateness of persons" is a fundamental moral fact or a superficial obstacle to aggregation.

  **Conclusion:**
  The dispute is hybrid. The "decision procedure" confusion is verbal and solvable (as reflected in Agreed Claim #2). However, the conflict regarding whether the "separateness of persons" trumps the "maximization of the good" is a substantive clash of first principles. The Adversarial Collaboration succeeds in isolating the verbal noise, revealing that the remaining signal is a genuine conflict between two incompatible visions of human identity.
