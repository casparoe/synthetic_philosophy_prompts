answer: |-
  The ledger of Empire is not merely a heuristic device; it is a moral technology. By framing the British Raj as a balance sheet, historians like Ferguson and Tharoor implicitly adopt a specific ethical architecture. They transform history into a court of consequentialist accounting. To understand what this genre takes for granted, we must reconstruct the implicit theory of value that allows a mile of railway track to be algebraically summed with a death by starvation.

  ### I. The Implicit Theory: Imperial Utilitarianism

  The ledger rests on four foundational commitments that constitute a rough form of classical utilitarianism, specifically tailored for administrative governance.

  1.  **Commensurability:** The theory assumes that heterogeneous goods (infrastructure, law, language) and harms (famine, massacre, deindustrialization) can be reduced to a common metric. Whether that metric is explicit (sterling, calories, life-years) or implicit ("modernity," "welfare"), the logic requires that $X$ amount of railway can theoretically equal $Y$ amount of suffering.
  2.  **Aggregation:** The unit of assessment is the population as a whole ("India"), not the individual. This presupposes that benefits and harms can be summed across persons. It ignores distributional justice; a railway that benefits a merchant class while a famine kills the peasantry can still show a "net positive" if the merchant gain outweighs the peasant loss.
  3.  **Compensability:** This is the most contentious commitment. The ledger assumes that a harm inflicted on one group can be morally cancelled by a benefit conferred on another, or by a benefit conferred on the *same* group at a *later* time. It treats history as a continuous account where debts can be serviced by future growth.
  4.  **Temporal Neutrality:** Suffering in 1876 is discounted against prosperity in 1947. The theory assumes that the timing of the utility is less important than the total sum over the chosen time span.

  ### II. Presuppositions vs. Fit: The Underdetermination Question

  Does the ledger *strictly* presuppose these commitments, or can different ethical frameworks inhabit the same form?

  **The Resourcist:** A resourcist (focusing on primary goods or assets) fits the ledger comfortably. Railways are assets; drained revenue is a liability. The common unit is material capital. However, the resourcist struggles with the "death" entry. Unless life is valued instrumentally (as labor power), a death is not a resource loss but a moral catastrophe. To enter it on the sheet, the resourcist must covertly become a welfarist.

  **The Welfarist:** A welfarist (focusing on happiness or preference satisfaction) is the ledger's natural home. Pain and pleasure are the original common currency of utilitarianism. A famine is negative utility; a railway is positive utility (via convenience/trade). The ledger presupposes welfarism more than any other theory because only welfarism naturally claims that all goods are reducible to a single phenomenological state.

  **The Capabilities Theorist:** Here the fit breaks. A capabilities approach (à la Sen or Nussbaum) values distinct freedoms (health, political liberty, bodily integrity) that are *incommensurable*. You cannot trade "political liberty" for "nutritional health" without violating the pluralism of value. For a capabilities theorist to use the ledger, they must collapse distinct capabilities into a single index (e.g., HDI). Thus, the ledger does not *presuppose* capabilities theory; rather, the capabilities theorist must mutilate their theory to fit the ledger.

  **Where is it Underdetermined?**
  The ledger is underdetermined regarding the *currency* but overdetermined regarding the *arithmetic*. It does not matter if you count in rupees, calories, or "units of modernity," provided you accept the arithmetic of substitution. However, it is silent on the *boundary of the moral community*. Does the ledger account for the British taxpayer who funded the railway? Does it account for the global consumer of Indian cotton? The ledger form itself does not dictate who counts as a stakeholder, only that once chosen, they are aggregated.

  ### III. What the Ledger Excludes

  The genre quietly excludes any ethical framework that relies on **side-constraints** or **rights**.

  1.  **Incommensurability:** The view that some values are sacred or lexical (e.g., "Justice must be done though the heavens fall") cannot be entered. If sovereignty is a right, not a good, it cannot be traded for GDP.
  2.  **The Non-Cancellation of Wrongs:** The ledger assumes a wrong is cancelled by a later benefit. A deontological view holds that a violation of rights creates a moral stain that subsequent good deeds cannot erase. You cannot murder a grandfather and justify it by educating the grandson.
  3.  **The Individual as Unit:** By aggregating to the "colony," the ledger excludes the view that the proper unit of moral assessment is the individual life. It allows for the "sacrifice" of minorities for the majoritarian good.

  ### IV. The Massacre Inconsistency: Arithmetic or Rhetoric?

  You note that writers who trade famine against railways often treat a single massacre (e.g., Jallianwala Bagh) as disqualifying rather than deductible. This is a structural fracture in the ledger.

  Mathematically, a massacre is simply a large debit. If the credit side is heavy enough (e.g., "prevented WWII invasion," "created democracy"), the net should still be calculable. When historians treat massacre as a "veto," they are abandoning utilitarianism for **threshold deontology**. They are admitting that there are acts so heinous they break the accounting system.

  This inconsistency reveals that the ledger is doing **rhetorical work** rather than valuation work.
  *   **As Valuation:** It seeks a truth value (Net Positive/Negative).
  *   **As Rhetoric:** It seeks a verdict (Guilty/Innocent).

  The massacre functions as a *reductio ad absurdum* of the imperial civilizing mission. If the Empire claims to bring "Rule of Law," a lawless massacre contradicts the *identity* of the agent, not just the *outcome* of the action. The ledger collapses because it tries to judge a moral relationship (ruler/subject) using an economic tool (cost/benefit). The massacre proves the relationship was predicated on violence, rendering the "benefits" (railways) not gifts, but tools of extraction or pacification. The inconsistency arises because the authors want the precision of economics without surrendering the moral outrage of human rights.

  ### V. A History on a Different Theory of Value

  If we were to write a history of the Raj on a non-ledger theory of value (e.g., a Rights-Based or Subaltern framework), what would stop, and what would survive?

  **What Must Stop:**
  1.  **The Net Conclusion:** The history could not end with a verdict on whether the Raj was "good" or "bad" overall. It would have to abandon the question "Was it worth it?"
  2.  **Trade-off Language:** Phrases like "the price of modernization" or "unintended consequences" would be replaced by "violations" and "distributions."
  3.  **Aggregation:** You could not say "India benefited." You would have to say "The Bengali peasantry suffered X, while the Bombay bourgeoisie gained Y." The singular "Indian experience" would dissolve into plural, conflicting experiences.
  4.  **Compensation:** The narrative could not suggest that post-independence democracy "repaid" the debt of colonial extraction. The debt remains a debt.

  **What Survives:**
  1.  **Evidence:** The facts of famine mortality, railway mileage, and textile output remain relevant, but they become evidence of *capacity* and *vulnerability*, not credits and debits.
  2.  **Causality:** The historical link between British policy and Indian outcome remains central.
  3.  **Narrative:** The story of power, resistance, and adaptation survives, but it becomes a tragedy or a complex drama rather than a balance sheet.

  **Does the Genre Survive?**
  The "Balance Sheet History" genre would not survive. It would be replaced by **Forensic History** or **Genealogy**.
  *   **Forensic History:** Focuses on liability and rights. (Who authorized the famine? Who had the right to stop it?)
  *   **Genealogy:** Focuses on how the "ledger" itself was a tool of colonial power. (How did the British come to believe they had the right to count Indian lives against British steel?)

  ### Conclusion

  The ledger of Empire is a technology of moral comfort for the judge, not the victim. It presupposes a world where everything has a price, where time heals moral wounds, and where the collective outweighs the individual. It fits welfarists and resourcists but breaks capabilities theorists and deontologists. The inconsistency regarding massacres reveals the ledger's true nature: it is not a calculation of value, but a plea for legitimacy. A history written without it would be less decisive, less satisfying, and perhaps more true. It would stop asking if the Empire was a good deal, and start asking what it means that we think we are allowed to ask.
