answer: |-
  **Project Title:** The Two Experiments: Dewey, Democracy, and the Limits of Evidence-Based Policy

  **Project Summary**
  John Dewey famously characterized democracy not merely as a system of government but as a mode of associated living grounded in experimental inquiry. For Dewey, democratic decisions are hypotheses tested in practice, yielding "warranted assertibility" rather than final truth. Today, this slogan has been appropriated by the evidence-based policy movement, which treats randomized controlled trials (RCTs) and interventionist science as the gold standard for public decision-making. However, a structural tension exists: scientific experimentation relies on control groups, repeatability, and an experimenter external to the system. Democratic action admits none of these. A society cannot be run twice; culture cannot be held fixed while policy varies; and the citizens experimenting are also the subjects living with the consequences.

  This project asks whether Dewey's conception of democratic inquiry is compatible with the interventionist model of experimentation used in modern policy science, or whether it requires a distinct, exploratory model. I will argue that Dewey's framework collapses if forced into the interventionist mold, but retains normative force if understood as exploratory. The goal is to determine whether "democracy is an experiment" is a rigorous constraint on how we govern or merely a flattering metaphor.

  **The Research Question**
  Does Dewey's conception of democratic inquiry require an *interventionist* model of experimentation (manipulating variables against a baseline/control) or an *exploratory* model (acting, observing consequences, and revising without a control)?

  This question admits a determinate answer. It is not a matter of interpreting Dewey's mood, but of testing the logical requirements of his theory of inquiry against the material constraints of political action. If Dewey's logic of inquiry necessitates control conditions that democracy cannot provide, his analogy fails. If his logic allows for inquiry without controls, the analogy holds but requires a redefinition of "evidence" distinct from current policy orthodoxy.

  **Why Existing Readings Do Not Settle It**
  Two common interpretations of Dewey fail to resolve this tension.

  First, the *pragmatic instrumentalist* reading suggests Dewey simply meant "test it in practice." This collapses into technocracy. If "testing" implies finding what works via the most rigorous method available, and RCTs are the most rigorous method, then Dewey becomes an advocate for evidence-based policy as currently practiced. This ignores Dewey's insistence that the public must be the inquirer, not just the subject of inquiry. It fails to account for the impossibility of controlling variables in a open social system.

  Second, the *logical formalist* reading focuses on Dewey's definition of inquiry as the controlled transformation of an indeterminate situation into a determinate one. This reading often abstracts away from the material conditions of the experiment. It assumes that because Dewey calls it "inquiry," it must share the logical form of laboratory science. This overlooks Dewey's own warnings against importing scientific methods wholesale into social contexts without adapting them to the subject matter.

  Neither reading addresses the specific structural mismatch between the control group requirement and the uniqueness of historical political moments. The question remains open: does Dewey's logic require a control, or does it only require a consequence?

  **Plan of Work**
  This is a one-semester conceptual project. No new data will be collected; the work consists of textual reconstruction and argument analysis.

  *Months 1–2: Conceptual Groundwork.*
  I will rigorously define the two senses of experiment.
  1.  **Interventionist:** Requires isolation of variables, a baseline, a control group, and repeatability. The experimenter stands outside the system.
  2.  **Exploratory:** Requires action, observation of consequences, and revision. No baseline or control is necessary; the "control" is the previous state of affairs, understood historically rather than experimentally. The experimenter is inside the system.
  I will establish why the interventionist model is structurally impossible for sovereign democratic decisions.

  *Months 3–4: Textual Reconstruction.*
  I will examine Dewey's accounts of inquiry and democracy to see which model fits. I will focus on his conditions for "warranted assertibility." Does warrant require comparison against a control, or only coherence with observed consequences? I will look for instances where Dewey discusses social change to see if he implies repeatability is necessary for knowledge. The aim is to determine if the "exploratory" model satisfies Dewey's own criteria for knowledge, or if it falls short into mere guesswork.

  *Month 5: Synthesis and Stakes.*
  I will draft the final argument. If Dewey requires the exploratory model, I will articulate what counts as "evidence" in this framework. If he requires the interventionist model, I will demonstrate where his theory of democracy becomes incoherent. The final output will be a paper arguing that the slogan "democracy is an experiment" only does work if we reject the interventionist model currently dominant in policy science.

  **Success and Failure Conditions**
  *Success:* The project succeeds if I can demonstrate that Dewey's logic of inquiry is robust enough to sustain knowledge claims without control groups. A successful result shows that "exploratory experimentation" is not a weakened version of science, but a distinct epistemic category required for politics. This would provide a philosophical basis for critiquing the imperialism of RCTs in policy without rejecting evidence altogether.

  *Failure:* The project fails if the answer is trivial.
  1.  **Trivial Yes:** If it turns out Dewey simply meant "science applies to politics" and ignored the control problem, the project reveals no new insight, only a historical blind spot.
  2.  **Trivial No:** If it turns out "experiment" is purely metaphorical for Dewey with no epistemic constraints, the slogan does no work.
  3.  **Incoherence:** If Dewey's texts are fundamentally inconsistent on this point, leaving no reconstructible position, the project cannot yield a determinate answer.

  **Feasibility and Scope**
  One semester is a tight constraint for conceptual work of this nature. The primary risk is getting bogged down in exegesis of Dewey's logical theory rather than focusing on the specific problem of experimentation. To mitigate this, I will limit the textual scope to his mature work on logic and democracy, avoiding early psychological works.

  There is a risk that the distinction between "interventionist" and "exploratory" is itself unstable. If I spend the first month unable to cleanly separate these two modes, the project will stall. However, given the clear structural differences (control group vs. no control group), this distinction should hold. The heavier lift is showing that Dewey *needs* the exploratory model. If I find that Dewey actually insists on controls despite the impossibility, I will pivot to documenting that tension as the result, rather than forcing a reconciliation. This is manageable within the semester. The project is narrow enough to be completed but significant enough to challenge current policy orthodoxy.
