prompt: |-
  Last night my friend Priya and I got into a long, stupid argument about Schopenhauer's philosophy of music, and I'm still not over it. She's a music writer and she's definately convinced that Schopenhauer's claim that music is a direct copy of the Will itself -- not just a copy of the Ideas like the other arts -- gives you a literal ranking system for songs. She kept saying stuff like the bass is just blind inorganic nature, melody is the highest objectification of the Will, harmony maps onto the Ideas, and the whole thing means a good review should be a kind of metaphysical audit. I told her that's a parody waiting to happen, so now I need you to write it.

  Can you do a Pitchfork-style review, around 650-850 words, of a made-up album by a made-up band, written by a critic who takes Schopenhauer's metaphysics of music completely literally? Deadpan, no winking, in American English. The target is the whole style of criticism that treats a record as a direct revelation of the metaphysical structure of reality. The jokes should come from the actual Schopenhauerian content: music as a copy of the Will itself rather than the Ideas; the four voices (bass, tenor, alto, soprano) corresponding to the mineral, plant, animal, and human levels of existence; melody as the highest point, the life of the Will; harmony as the gradation of Ideas; and the idea that music expresses not this or that particular joy but joy itself, the essence of emotion. Maybe the album is a synth-punk record or a lo-fi folk thing, and the review keeps grading its tracks by how directly they objectify the Will, with a final star rating and a Best New Music verdict. Don't include any citations, references to real albums, or explanations of the joke -- just let the critic be totally sincere in the fictional publication's voice.
