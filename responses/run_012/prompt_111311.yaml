answer: |-
  Here is my best guess at your friend's verdict, the principle underlying her judgments, the rival interpretations of that principle, and the case that would distinguish them.

  ### The Verdict
  Your friend will likely say that **the nurse ought to act on the senior doctor's judgment.**

  She will argue that while moral autonomy is a duty for competent adults, it is a duty constrained by possibility. The requirement to "see it for oneself" presupposes that one *can* see it for oneself. In the case of the joke or the advertising campaign, the woman has the time and cognitive space to reflect; relying on testimony there is a form of moral laziness or abdication. In the case of the six-year-old, the capacity for moral reasoning is not yet developed. In the case of the nurse, the capacity is present but the *opportunity* to exercise it has been removed by circumstance. To demand she judge for herself in seconds would be to demand the impossible; thus, the constraint of moral autonomy is temporarily suspended by the exigency.

  ### The Rule She Is Running
  The principle that best fits her earlier verdicts and predicts this outcome is the **Practical Possibility Rule**:

  > *One must form moral judgments independently unless independent judgment is practically impossible due to incapacity (childhood) or exigency (lack of time/resources).*

  This rule accommodates all her previous positions:
  *   **Doctor/Sommelier:** These are largely non-moral or technical judgments; autonomy is not required in the same way, or the "impossibility" of layperson verification is high.
  *   **Joke/Ad:** These are moral judgments where the agent has full capacity and full opportunity. Reliance is forbidden.
  *   **Child/Mother:** The child lacks the cognitive capacity for independent judgment. Reliance is permitted.
  *   **Nurse/Doctor:** The nurse lacks the temporal opportunity for independent judgment. Reliance is permitted.

  ### Rival Rules
  However, her previous verdicts are consistent with other principles that would yield different results in the nurse's case or future scenarios. Here are two strong rivals:

  **1. The Epistemic Authority Rule**
  > *Testimony is acceptable when the testifier holds recognized authority or expertise over the recipient, regardless of the domain, but never between peers on moral matters.*

  *   **Fit:** This explains why the doctor and sommelier (experts) are trusted, and the mother (guardian authority) is trusted. It explains why the friend and colleague (peers) are not trusted on moral matters.
  *   **Divergence:** This rule focuses on *who* is speaking, not *how much time* the listener has.
  *   **Prediction for Nurse:** She would say the nurse should trust the doctor, but for a different reason: because he is a senior authority, not because she is rushed.

  **2. The Strict Moral Agency Rule**
  > *Moral testimony is never permissible for a rational adult, regardless of time pressure. Exigency excuses failure, but does not permit reliance.*

  *   **Fit:** This takes her "grown woman of ordinary intelligence" constraint seriously. It treats the child exception as a biological limit on agency, not a situational one.
  *   **Divergence:** This rule holds that moral judgment is non-delegable for adults. Even in an emergency, one must act on one's own instinct rather than another's word.
  *   **Prediction for Nurse:** She would say the nurse is in a tragic position. She is *excused* if she gets it wrong, but she is not *permitted* to simply adopt the doctor's view. She must make the choice herself, even if rushed.

  ### The Decisive Case
  To force your friend to choose between the **Practical Possibility Rule** (Time/Opportunity matters) and the **Epistemic Authority Rule** (Hierarchy matters), you should put the following case to her:

  **The Rushed Peer:**
  > *Imagine the same nurse, on the same short-staffed night with seconds to decide. However, there is no senior doctor available. Instead, a fellow nurse of equal rank and competence tells her, "I know this family; you must override their wishes." The peer has no special authority, but the time pressure remains identical.*

  *   **If she says the nurse can trust the peer:** She is committed to the **Practical Possibility Rule**. Time pressure alone justifies reliance on testimony, even without authority.
  *   **If she says the nurse cannot trust the peer:** She is committed to the **Epistemic Authority Rule** (or a hybrid). Authority is required to bypass moral autonomy; time pressure alone is insufficient.

  To distinguish between the **Practical Possibility Rule** and the **Strict Moral Agency Rule**, use this case:

  **The Slow Emergency:**
  > *Imagine the nurse has five minutes rather than five seconds. This is enough time to feel the weight of the decision and consult her own conscience, but not enough time to investigate the medical facts fully. The senior doctor gives his judgment.*

  *   **If she says the nurse must judge for herself:** She leans toward **Strict Moral Agency**. Any opportunity to think restores the duty of autonomy.
  *   **If she says the nurse can still trust the doctor:** She leans toward **Practical Possibility**. "Readily" is the standard, not "Perfectly."

  My suspicion is that your friend is a Kantian at heart regarding moral autonomy. She will likely accept the nurse's reliance in the original case (due to impossibility) but will insist on the **Rushed Peer** case being impermissible. She will likely hold that in moral emergencies, you may rely on *authority* to save you from impossibility, but you may not outsource your moral agency to a *peer* simply because you are busy.
