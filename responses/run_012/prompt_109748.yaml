      *   *Relational/Conversational:* A partner owes honesty and care. Lying breaks trust. Refusing harmful advice maintains the integrity of the relationship. Fits the "no lying" rule well.
      *   *Welfare-Maximizing (Utilitarian):* Would lie if it saved distress. AI refuses to lie. So, AI is *not* pure utilitarian.

