answer: |-
  You have put your finger on one of the most persistent friction points in moral philosophy, though it rarely gets a single catchy name because it sits at the intersection of metaphysics, psychology, and rhetoric.

  The established philosophical term for the mechanism you are describing is **The Tracing Principle** (or **The Tracing Condition**).

  However, the specific *flaw* in how your readers are applying it—the arbitrary stopping point used to preserve blame rather than find truth—is best described as **Motivated Regress Termination** (or, more colloquially, **The Arbitrary Anchor**).

  Here is the breakdown of the concept, the boundaries, and why it feels so slippery.

  ### 1. The Mechanism: The Tracing Principle
  In philosophy of action (specifically in the work of John Martin Fischer, Mark Ravizza, and others), **Tracing** is the standard move used to assign responsibility when an agent lacks control *in the moment*.

  *   **The Logic:** If you weren't in control at Time B (screaming at the kid), were you in control at Time A (choosing to stay up late)? If yes, your responsibility at Time B is *traced* back to Time A.
  *   **The Valid Use:** This is widely accepted for things like voluntary intoxication. If you choose to drink knowing you get violent, you are responsible for the violence, even if you weren't "in control" when the punch was thrown. The blame is traced to the drink.

  ### 2. The Flaw: The Regress Problem
  Your intuition is correct: this chain has no natural bottom. This is known in philosophy as **The Regress Argument** (most famously articulated by Galen Strawson in "The Basic Argument").

  Strawson argues that to be truly responsible for an action, you must be responsible for the character/nature that produced it. But to be responsible for *that*, you must have chosen it via a prior choice. But that prior choice requires a prior nature. This goes back infinitely. Since no one creates themselves *ex nihilo* (from nothing), **Ultimate Responsibility** is impossible.

  Your readers are engaging in a specific variation of this: they are using Tracing to bypass the lack of control, but they are stopping the regress wherever it becomes inconvenient to go further.

  ### 3. The Specific Move: Motivated Regress Termination
  There isn't a single famous noun for "stopping the chain where the blame feels right," but in cognitive psychology and argumentation theory, this is a form of **Motivated Reasoning** applied to causal chains.

  For your purposes as a novelist, I recommend calling this **The Arbitrary Anchor**.

  *   **Definition:** The rhetorical move of tracing causality backward from an involuntary act to a prior "choice," then halting the trace at a point that preserves the desired moral verdict, ignoring that the "choice" itself was constrained by prior causes.
  *   **Why it feels unfair:** It violates the **Control Principle** (you are only responsible for what you control) by pretending the "Anchor Point" (the prior choice) had more control than it actually did.

  ### 4. The Boundaries: Where is the line?
  You asked for the boundaries. When is Tracing valid, and when is it an Arbitrary Anchor? The line is drawn at **Volitional Capacity** and **Epistemic Access** at the Anchor Point.

  **The Test:** At the moment of the "prior choice" (the Anchor), did the character have:
  1.  **Reasonable Alternative Possibilities:** Could they have realistically done otherwise?
  2.  **Adequate Epistemic Access:** Did they understand the likely consequences?

  #### **Case A: The Brainwashed Cultist (IN)**
  *   **Scenario:** Cult member gives up a friend.
  *   **Anchor Point:** Joining/staying in the cult at age 19.
  *   **Verdict:** **Arbitrary Anchor.**
  *   **Why:** A 19-year-old in a high-control group lacks *Reasonable Alternative Possibilities* (coercion/social isolation) and often lacks *Epistemic Access* (deception about the group's nature). Tracing blame here is a rhetorical trick to preserve the verdict of "traitor."
  *   **The Line:** The trace stops at a point where the agent was *not* truly free, but is treated as if they were.

  #### **Case B: The Exhausted Mother (IN)**
  *   **Scenario:** Screams at kid after double shift.
  *   **Anchor Point:** Taking the second job.
  *   **Verdict:** **Arbitrary Anchor.**
  *   **Why:** If the rent went up and wages are stagnant, the "choice" to work two jobs is economically coerced. There was no *Reasonable Alternative* (homelessness vs. exhaustion). Blaming the choice to work is blaming the economic constraint.

  #### **Case C: The Voluntary Drunk (OUT)**
  *   **Scenario:** Gets drunk, drives, hits a pedestrian.
  *   **Anchor Point:** Drinking the alcohol.
  *   **Verdict:** **Valid Tracing.**
  *   **Why:** At the moment of drinking, the agent had *Reasonable Alternatives* (drink soda, stay home) and *Epistemic Access* (knows alcohol impairs driving). The chain stops here legitimately because control *was* present at the Anchor.

  #### **Case D: The Short Fuse (BORDERLINE/OUT)**
  *   **Scenario:** Man has a temper, yells at waiter.
  *   **Anchor Point:** "Choosing" to have a temper / Not going to therapy years ago.
  *   **Verdict:** **Arbitrary Anchor.**
  *   **Why:** Temperament is largely constitutive luck (biology/upbringing). Unless there is a specific, voluntary refusal of treatment *after* recognizing the harm, tracing blame back to "having a nature" is invalid. You cannot be responsible for your raw materials, only what you build with them.

  ### 5. Why it runs one direction (The Just-World Hypothesis)
  You noted this is never used to diffuse blame ("so it's the father's fault"). This is driven by the **Just-World Hypothesis**. Readers need to believe the world is morally orderly.
  *   If the blame dissolves into "his dad's fault," the moral universe is messy and the victim is uncompensated.
  *   If the blame stops at the character, the universe makes sense, and the reader feels safe ("I would never make that choice").
  *   **Motivated Tracing** is the tool they use to force the complex web of causality into a neat box labeled "Guilty."

  ### Summary for your Craft
  When you encounter this in feedback, you are dealing with **Motivated Tracing**.

  *   **It is:** The use of the Tracing Principle to bypass a lack of control in the present by citing a "choice" in the past.
  *   **It becomes fallacious when:** The "choice" cited as the Anchor Point lacked genuine volition or foreseeability (The Arbitrary Anchor).
  *   **The Line:** Does the Anchor Point represent a moment of **genuine leverage**? If the character could not have reasonably done otherwise at the Anchor Point, the trace is invalid.

  Your readers are demanding **Ultimate Responsibility** (which is impossible) but settling for **Proximal Responsibility** (the Anchor) only when it confirms their bias. They aren't arguing about free will; they are arguing about *where they are willing to stop looking.*
