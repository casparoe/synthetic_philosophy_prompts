answer: |-
  The full set cannot be met at once, because the desideratum of **Naturalistic Uniformity** (mechanical omissions are causes like events) cannot be jointly satisfied with the desideratum of **Normative Selectivity** (only some omissions are causes based on duty).

  1.  **The Selectivity Constraint (The Problem of Profligacy)**
      *   **Case:** The neglected plant versus the Queen of England not watering it.
      *   **Motivation:** Counterfactual dependence is ubiquitous; if I had watered the plant, it would live, but if the Queen had watered it, it would also live. Yet we cite only my omission. A theory must explain why only specific absences are elevated to causal status without rendering causation ubiquitous.
      *   **Status:** Genuine practical necessity for law and engineering post-mortems; however, satisfying this requires importing normative or contextual criteria (duty, function, expectation) into the metaphysics of causation.
      *   **Collision:** This collides with **Naturalistic Uniformity**. If causation is a physical relation discoverable by physics (as the lab cases suggest), there is no physical difference between my not watering and the Queen's not watering. To satisfy selectivity, you must admit causation is not purely physical.

  2.  **The Ontological Parity Constraint (The Lab Standard)**
      *   **Case:** A missing component or a controller's failure to energise a relay.
      *   **Motivation:** In engineering, a missing signal is treated as robustly causal as a positive signal; the system fails *because* the voltage was absent. A theory must grant absences enough ontological weight to bear causal load without treating them as mysterious "negative entities."
      *   **Status:** Genuine for scientific and engineering practice; however, it conflicts with the background metaphysical result that absences are not events.
      *   **Collision:** This collides with **Sparse Ontology**. If absences are "nothing," they cannot enter into physical relations. To satisfy parity, you must either inflate ontology (absences are real things) or deflate causation (causation is not a relation between things).

  3.  **The Act/Omit Distinction Constraint**
      *   **Case:** The physician who declines to start treatment versus the one who withdraws it.
      *   **Motivation:** Legal and moral practice often treats killing (act) differently from letting die (omit), even if the outcome and counterfactual dependence are identical. A theory must either ground this distinction metaphysically or explain why it is preserved solely at the normative level.
      *   **Status:** Likely a prejudice of moral/legal camps dressed up as a metaphysical constraint. Most contemporary metaphysical theories collapse this distinction, treating the causal structure as identical and relegating the difference to morality.
      *   **Collision:** This collides with **Ontological Parity**. If a missing relay causes a crash just as a broken relay does, the metaphysical distinction between acting and omitting collapses. You cannot have parity in the lab and a sharp metaphysical distinction in the clinic.

  4.  **The Cause vs. Background Condition Constraint**
      *   **Case:** The locked door that made a rescue impossible.
      *   **Motivation:** We must distinguish between the omission of the rescuer (who couldn't open the door) and the presence of the lock (which prevented opening). The theory must distinguish causal omissions from mere background conditions or preventions.
      *   **Status:** Genuine for explanatory salience, but difficult to ground in counterfactuals alone.
      *   **Collision:** This collides with **Counterfactual Dependence**. If the rescuer *could not* have opened the door, their omission is not a but-for cause. But if we say the lock caused the death, we treat a presence as a cause. If we say the rescuer's omission caused the death despite the lock, we violate the "could have done otherwise" condition.

  5.  **The Overdetermination Constraint**
      *   **Case:** The two bystanders who each could have thrown the rope and each did nothing.
      *   **Motivation:** If either bystander had acted, the victim would have lived. Neither acted. Is each omission a cause? Is the conjunction the cause? A theory must handle joint sufficiency of omissions without diluting responsibility.
      *   **Status:** Genuine logical requirement.
      *   **Collision:** This collides with **Selectivity** if norms are used to select. If both had a duty, both are causes. If neither had a duty, neither is. If only one had a duty, the theory relies entirely on the norm, not the causal structure.

  6.  **The Naturalism vs. Normativity Constraint**
      *   **Case:** The asymmetry between mechanical 'failures to act' (relay) and personal ones (watering).
      *   **Motivation:** You note no hesitation in the lab, but philosophy struggles with the personal. A theory must explain why mechanical omissions seem objective (function-based) while personal omissions seem duty-based, or unify them under one header.
      *   **Status:** This is the core collision. The desire for a purely naturalistic account (like physics) is a prejudice against the normative reality of omission causation.
      *   **Collision:** **Unsatisfiable Pair.** You cannot have a theory where causation is a mind-independent physical relation (satisfying the physicist's lab intuition) and simultaneously have a theory where only omissions bound by duty count as causes (satisfying the court's need for selectivity). You must choose: either causation by omission is ubiquitous and physical (and selectivity is pragmatic), or it is rare and normative (and the lab cases are merely analogical).

  7.  **The Causal Status vs. Explanatory Salience Constraint**
      *   **Case:** The indefinite multitude of unperformed preventions.
      *   **Motivation:** We single out a few omissions as causes despite infinite things not happening. A theory must clarify if the unselected omissions are *false* causes or merely *unimportant* true causes.
      *   **Status:** Genuine distinction required for clarity.
      *   **Collision:** This collides with **Ontological Parity**. If absences are causes, they are causes regardless of salience. If salience determines causal status, then causation is interest-relative, not mind-independent.

  8.  **The Causing vs. Allowing Constraint**
      *   **Case:** The physician and the bystanders.
      *   **Motivation:** Common speech distinguishes causing harm from allowing it. A theory must specify if this is a causal distinction or a moral one.
      *   **Status:** Prejudice of folk metaphysics. Most rigorous theories collapse this, arguing that omissions *allow* outcomes rather than *cause* them, or that "allowing" is just a species of causation by omission.
      *   **Collision:** This collides with **Ontological Parity**. If an omission is a cause, it causes. To say it merely "allows" is to deny it causal status, reverting to the view you find concessive.
