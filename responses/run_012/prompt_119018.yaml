          2.  (1) vs (5). (1) elevates factoring; (5) demotes it.
          3.  (2) vs (3). Definition clash.

  7.  **Finalizing the Advice:**

      *   **Severity 1 (Critical):** (5) contradicts (6). If the monolith does the "same kind of thing," there is no epistemic reason to prefer the tree *given identical checkable output*.
