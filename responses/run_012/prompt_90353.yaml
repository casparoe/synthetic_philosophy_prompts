  0.15

  **Decomposition:**
  *   **0.60** — Credence that accuracy is the *sole* fundamental epistemic good (excluding independent values like understanding or coherence).
  *   **0.70** — Credence that substantive normative rules (like Conditionalization) derive uniquely from accuracy maximization without extra premises.
