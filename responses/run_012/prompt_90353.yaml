  *   **0.50** — Credence that epistemic evaluation depends only on belief states/outcomes, not formation history (rejecting the Machine Case intuition).

  **Combination:**
  These are treated as necessary conditions for the "complete account" thesis, so I multiply the probabilities ($0.60 \times 0.70 \times 0.70 \times 0.50 \approx 0.15$).

  **Least Sure Term:**
  The **Process/History** term (0.50). I am maximally uncertain whether a purely consequentialist framework can successfully internalize process constraints (like "must be based on evidence") as instrumental means to accuracy, or if the intuition that "magic beliefs aren't justified" points to a non-consequentialist epistemic norm. This would move most if an accuracy-firster could derive a "no clairvoyance" norm strictly from accuracy maximization without smuggling in external assumptions about chance or evidence.

  **Diagnosis of Disagreement:**
  The disagreement is **upstream**. Your machine case is just the downstream symptom; the root clash is about whether epistemic normativity is purely **consequentialist** (your sister: only the belief-state's accuracy matters) or includes **deontological/virtue constraints** (you: the *activity* of believing responsibly matters). On the scoring rule issue, you are technically correct that different rules encode different risk attitudes, but she is relying on a theorem (Joyce's) that argues *probabilism* is invariant; the leak you suspect appears when moving from static probabilism to dynamic updating, which supports your skepticism about the "complete account" claim.

  **Vagueness Check:**
  The thesis is specific enough (Joyce-style Accuracy-First Epistemology) to have a truth value; I am assigning a credence to the claim that *all* epistemic norms reduce to accuracy maximization without remainder.
