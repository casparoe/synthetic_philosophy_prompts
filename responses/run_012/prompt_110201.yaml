          7.  Counterfactuals: What if the view were "Work = Material Parts" or "Work = Perceptual Indistinguishability"?

  2.  **Deconstruct the Philosophical Problem:**
      *   This is the classic "Ship of Theseus" problem applied to aesthetics.
      *   It touches on *Numerical Identity* (is it the *same* object?) vs. *Qualitative Identity* (is it exactly *like* the object?).
      *   Key philosophical candidates:
          *   *Material Constitution:* Work = Sum of atoms. (Ruled out by practice).
          *   *Aesthetic Empiricism:* Work = Visual experience. (Ruled out by practice).
          *   *Historical/Genetic Essentialism:* Work = Origin + History. (Strong candidate).
          *   *Kind/Sortal Dependence:* The identity conditions depend on the kind of thing (painting vs. print vs. building).
          *   *Wollheim's "Art as Art":* Physical object vs. Artwork distinction.
          *   *Goodman's "Languages of Art":* Autographic vs. Allographic arts.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate the observation (it's a deep philosophical puzzle known as the "constituency problem" or "identity conditions of artworks"). State the thesis: The practice presupposes a *Historical-Essentialist* view combined with a *Sortal-Sensitive* ontology.

      *   **1. The Core Commitment: Historical Individuality over Material Constitution:**
          *   Address the "Persistence through Change" vs. "Rejection of Replicas" tension.
          *   *Persistence:* Implies the work is not identical to its current matter (Otherwise, replacing canvas = destroying work).
          *   *Rejection of Replicas:* Implies the work is not identical to its appearance/structure (Otherwise, perfect copy = work).
          *   *Synthesis:* The work is a *historical individual*. Its identity is fixed by its *genesis* (the artist's act) and its *continuity of history* (provenance), not just its matter or look.
          *   *Philosophical Label:* This aligns with *Origin Essentialism* (Kripke-like) applied to artifacts.

      *   **2. What is Strictly Required vs. What is Compatible:**
          *   *Required:* Non-identity with current matter. (If Work = Matter, conservation is impossible/lying). Non-identity with perceptual qualities. (If Work = Look, forgery is impossible).
          *   *Compatible:* The idea of "Form." But not Platonic Form. Rather, "embodied history."
          *   *Compatible:* Abstract Object? Tricky. Usually, abstract objects (like numbers) don't change. Artworks change (fade, get cut). So, not strictly abstract in the Platonist sense, but maybe an "impure abstract object" (Thomasson).
          *   *Compatible:* Type/Token? Good for prints/bronzes. Less good for unique paintings. The practice treats unique paintings as *tokens* that persist, not types.

      *   **3. Resolving the Tension (The "Two Halves"):**
          *   Why tolerate matter replacement but not replica?
          *   *Causal History:* The original has a causal chain back to the artist. The replacement matter is integrated into *that* chain. The replica starts a *new* chain.
          *   *Analogy:* Theseus's Ship vs. a newly built ship using the same plans.
          *   *The "Trace":* The object bears the physical trace of the artist's action (even if restored, the core substrate often remains, or the restoration is additive to the history).

