      *   *Correction:* Need to ensure I distinguish between *fine art* (painting) and *heritage architecture*. They sometimes have different identity conditions (Venice Charter vs. Nara Document). I should note this nuance. The user lumped them, but philosophy distinguishes them. I will treat them as a cluster but note the friction.
