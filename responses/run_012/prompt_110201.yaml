answer: |-
  This is a profound question that cuts to the heart of metaphysics, specifically the ontology of artifacts. You have identified what philosophers of art call the **constituency problem** or the problem of **identity conditions**.

  Your observation is precise: institutional practice treats the artwork as something that *survives* material change (unlike a lump of clay) but *fails* to survive replication (unlike a musical score). This creates a specific metaphysical profile.

  Here is a reconstruction of the commitment presupposed by museum, market, and conservation practice, broken down by your specific queries.

  ### 1. The Core Commitment: Historical Essentialism
  The cluster of practices you describe presupposes that a work of art is a **historical individual** whose identity is fixed by its **origin** and its **causal history**, rather than by its current material composition or its perceptual qualities.

  In philosophical terms, this is a form of **Origin Essentialism** (associated with Saul Kripke) applied to artifacts. The institution acts as though the work's "this-ness" (haecceity) is anchored in the specific event of its creation by the artist.

  *   **Why this explains persistence:** When a canvas is lined or a varnish removed, the causal chain linking the object back to the artist's hand remains unbroken. The matter changes, but the *history* is continuous.
  *   **Why this explains the rejection of replicas:** A perfect forgery or replica lacks the correct causal origin. Even if it is molecule-for-molecule identical, it does not share the genealogy of the original. It is a distinct historical individual that happens to look like the first one.

  ### 2. What is Strictly Required vs. What is Compatible
  You asked which parts of the practice *require* the work not to be identical with the stuff, and which merely *sit comfortably* with that.

  **Strictly Required:**
  1.  **Non-Identity with Current Matter:** If the work were identical to its current atoms, conservation would be logically impossible. Removing discolored varnish would be destroying part of the work and replacing it with something else. The practice of conservation *requires* a distinction between the *work* (the enduring entity) and the *vehicle* (the physical stuff).
  2.  **Non-Identity with Perceptual Qualities:** If the work were identical to its appearance (qualitative identity), a perfect forgery would be the work. The market's refusal to value a forgery as the original *requires* that identity conditions include non-perceptual properties (specifically, history of production).

  **Merely Compatible:**
  1.  **Form:** The practice is compatible with the work being a "form," provided that "form" is understood as embodied in a specific history, not as a Platonic universal. If "form" meant a repeatable structure (like a symphony), then any instance of that structure would be the work. Since museums reject replicas, they cannot treat unique paintings as pure Forms.
  2.  **Abstract Object:** It is compatible with the work being an "abstract artifact" (a theory proposed by Amie Thomasson). This views the work as dependent on human intention and history but not reducible to physics. However, standard Platonism (where abstract objects are eternal and unchangeable) is **ruled out**, because artworks can be damaged, altered, or destroyed.

  ### 3. Type vs. Particular vs. Historical Individual
  You asked if the practice commits to the work being a form, a type, or a particular. The answer is that the practice is **sortal-sensitive**. It shifts ontology depending on the medium, but defaults to the **Historical Particular**.

  *   **Unique Objects (Paintings, Sculpture):** Treated as **Particulars**. There is only one *Mona Lisa*. The bronze cast example you gave is the tricky edge case. In the art market, a bronze cast from the artist's mold during their lifetime is often treated as an "original particular," whereas a posthumous cast is a "replica." This suggests that even in multiple-edition media, the *time and authorization of production* matter more than the physical similarity.
  *   **Prints/Photographs:** Treated closer to **Types**. An etching has an edition of 50. Any of the 50 is "the work." Here, the practice tolerates multiple physical particulars instantiating the same work.
  *   **Architecture/Heritage:** Treated as **Historical Individuals** with looser material constraints. As you noted, a rebuilt building is often the "same" building. This suggests that for heritage, the *location* and *function* weigh heavier in the identity conditions than for a portable painting.

  **Does it rule anything out?**
  Yes. It rules out **Material Constitution Theory** (the work is just the sum of its parts) and **Aesthetic Empiricism** (the work is just the visual experience).

  ### 4. Resolving the Tension: Matter Replacement vs. Replica Rejection
  You are puzzled by the tension: *Why tolerate drastic replacement of matter but refuse an indistinguishable substitute?*

  The practice resolves this via the **Causal Chain of Custody**.
  *   **Case A (Restoration):** You replace the canvas. The new canvas is physically integrated into the object that has a continuous history back to the artist. The identity is preserved through *spatio-temporal continuity*.
  *   **Case B (Replica):** You build a new object. Even if it looks identical, it occupies a different space-time path. It does not share the history.

  Think of it like a river. A river remains the "same river" even though the water molecules (matter) are constantly replaced, because the flow is continuous. If you dig a new channel nearby and pump identical water through it, that is a canal, not the river. The museum treats the artwork as the river, not the water.

  ### 5. Where the Practice is Underdetermined
  There are gaps where institutional practice is pragmatic rather than metaphysically consistent. Rival theories could license these practices equally well.

  1.  **The Threshold of Destruction:** At what point does material replacement destroy the work? If 51% of the paint is lost and inpainted, is it the same work? Practice fudges this. Conservators argue case-by-case. A metaphysical theory of "four-dimensionalism" (the work is a space-time worm) and a theory of "substrate essentialism" (the work needs the original ground layer) could both accommodate current practice, because practice has no hard line.
  2.  **The Status of Casts:** As mentioned, is a bronze cast a *token* of a *type* or an *individual*? The market treats early casts as more valuable than late casts, implying they are distinct individuals. But museums display them as "the work." This is an ontological oscillation that practice tolerates but philosophy finds messy.
  3.  **Reconstruction vs. Restoration:** In heritage (e.g., the Dresden Frauenkirche or the Warsaw Old Town), total reconstruction is sometimes accepted as "the same building." In fine art, total reconstruction is a fake. The practice does not have a unified theory of *why* architecture allows more material discontinuity than painting.

  ### 6. Counterfactuals: Changing the Presuppositions
  You asked what would happen if we replaced the presupposed view with two alternative theses.

  **Thesis A: The Work is Identical with its Material Parts (Mereological Essentialism)**
  *   **Conservation:** Would become impossible. Any loss of material (dust, evaporation of solvents) would technically destroy the work. "Restoration" would be admitted as creating a *new* object.
  *   **Market:** Value would plummet as objects age. A painting from 1600 that has lost 1% of its pigment is literally not the 1600 painting anymore.
  *   **Heritage:** Rebuilt buildings could never be listed as the original. The Venice Charter (on conservation) would have to be rewritten to forbid any replacement of fabric.

  **Thesis B: Two things are the same work whenever they are perceptually indistinguishable (Aesthetic Empiricism)**
  *   **Forgery:** The concept of forgery would vanish. If a forgery looks perfect, it *is* the work. The market would collapse because scarcity would be eliminable by technology.
  *   **Conservation:** Conservators could replace the entire object with a new material substrate, provided the look was identical. We could 3D scan the *Mona Lisa*, print a perfect replica, and shred the original, claiming we have "preserved the work."
  *   **Insurance:** Insurers would not care about provenance, only about visual state.

  ### Summary for the Geochemist
  As a geochemist, you are accustomed to dating materials by their isotopic composition and origin. The art institution treats artworks similarly.
  *   They do not treat the work as the **Mineralogy** (the current chemical/physical state), because that changes (weathering, restoration).
  *   They do not treat the work as the **Morphology** (the shape/appearance), because that can be mimicked (fossils can be faked).
  *   They treat the work as the **Stratigraphic Context** (the specific historical moment and causal chain of creation).

  The practice presupposes that the **provenance is ontological**. The "identity" of the work is not a property of the matter, but a property of the matter's *biography*. The tension you feel arises because we intuitively want objects to be defined by what they *are* (matter/form), but the art world defines them by where they *came from* (history).

  The practice is not underdetermined on the main point: it firmly rejects the idea that the work is its matter. It is only underdetermined on the *limits* of how much that matter can change before the historical chain is considered broken.
