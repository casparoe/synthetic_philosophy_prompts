          1.  *Persistence through material change:* Lining, inpainting, replacing arms, bronze casts, rebuilding buildings. (The work survives material alteration).
          2.  *Rejection of indistinguishable replicas:* A perfect copy is not the work. (The work is not defined solely by appearance).
          3.  *Norms of conservation:* Minimal intervention/reversibility imply the work survives the *current* state but is vulnerable to irreversible changes.
      *   **Specific Questions to Answer:**
          1.  What theory of material constitution/identity is presupposed?
          2.  Which parts *require* non-identity with current stuff vs. which merely *sit comfortably*?
          3.  Is it Form, Type, Abstract Object, or Historical Individual (Origin)? Or compatible with several?
