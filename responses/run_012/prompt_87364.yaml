prompt: |-
  I'm putting together a session for a metaphysics reading group where everyones fine with the statue-and-clay puzzle but has never actually tried to map the options onto each other. Write me a decision tree that gets someone from a concrete starting question to a named position on material constitution. Build it out of the logical space rather than a list of names: each internal node should be a question a person could answer without already knowing which position it leads to, and each leaf gets the positions label plus one sentence on its most awkward commitment.

  The distinctions I care about: can two material objects be exactly coincident and still distinct? is the statues relation to the clay identity, constitution, parthood, or just one thing described twice? when the clay is squashed flat, does the clay itself change intrinsically or does the statue simply stop existing while the clay was never really the statue at all? and does whatever answer you give have to be uniform across a statue, a river, a hole, and a social thing like a contract or a club.

  Include leaves for coincidentalism, constitution-without-identity, eliminativism about one member of the pair, nihilism about composite objects, the view that the clay and the statue are the same thing but only temporarily (identical while the statue lasts, and the clay is later identical to something else), and the deflationary option where theres only ever one thing and our predicates are doing all the work. Feel free to add a branch on whether identity over time is even a real relation, if it fits without bloating things.

  Flag any two leaves the tree cant actually separate, and tell me which combinations of answers are unoccupied and whether thats because theyre incoherent, unattractive, or just nobody bothered. Ten nodes max.
