answer: |-
  This is not a dumb question. It is, in fact, one of the most sophisticated questions you can ask about language, ethics, and law. You have identified a gap between *semantic truth* (the literal meaning of the words) and *pragmatic truth* (the meaning conveyed in context).

  You are describing a specific family of maneuvers. There isn't one single word that covers every nuance you raised, but there is a primary term for the act, a linguistic mechanism for how it works, and a sociological term for the group dynamic.

  Here is the breakdown of what this thing is, what it isn't, and where the edges lie.

  ### 1. The Act: Paltering
  The specific term for using truthful statements to convey a false impression is **paltering**.

  While "lying" is the commission of a falsehood, and "omission" is the concealment of truth, paltering is the active use of truth to deceive. It occupies a distinct moral and linguistic category.

  *   **What it is:** Selective truth-telling. You are not breaking the rules of grammar or fact; you are breaking the rules of *relevance*. You are providing a true piece of data that you know will be assembled into a false picture.
  *   **What it isn't:** It is not "bullshitting" (in the philosophical sense defined by Harry Frankfurt). A bullshitter doesn't care if what they say is true or false; they care only about the effect. A palterer cares *very much* that their words are technically true, because that truth is their shield.
  *   **The Edge:** The edge of paltering is **reasonableness**. If the inference the listener makes is wildly unreasonable, the speaker can claim they weren't paltering, they were just stating facts.
      *   *Example:* If I say "I am a human" to imply I am the King of England, that is not paltering; that is absurdity. Paltering relies on the speaker knowing that the listener's inference is the *standard, expected* inference.

  Research from the Harvard Kennedy School has shown that while palterers feel less guilty than liars (because they can point to the technical truth), victims of paltering often judge the act more harshly than outright lying. It is viewed as a betrayal of the cooperative nature of conversation.

  ### 2. The Mechanism: Conversational Implicature
  To understand *how* paltering works, you need the linguistic term **conversational implicature**, developed by philosopher H.P. Grice.

  Grice argued that conversation is governed by a "Cooperative Principle." We assume the person speaking is being relevant, truthful, and informative. When you say, "The ingredients are approved," the listener assumes you are being *relevant* to the question of whether the *product* is safe/approved.

  *   **The Move:** The palterer exploits the Cooperative Principle. They rely on the listener to do the work of connecting the dots.
  *   **The Shield:** When challenged, the palterer retreats to the *literal meaning* (semantics) and disavows the *implied meaning* (pragmatics). "I never said the product was approved. I said the ingredients were."
  *   **Intent vs. Foresight:** You asked if intent is required. In ethics and compliance, **recklessness** is often sufficient. If a reasonable person would draw the false conclusion, and the speaker foresaw that possibility but proceeded anyway to gain the benefit of the doubt, it is functionally equivalent to intent. This is often called **willful blindness**.

  ### 3. The Group Dynamic: Structural Misleadingness
  Instance three (the press release) is distinct. This is where paltering becomes institutional.

  When a document is vetted by legal, compliance, marketing, and product teams, each person ensures *their* sentence is defensible. No single person intends the lie. The lie emerges from the **aggregation**.

  *   **The Name:** In organizational theory, this is sometimes called the **"Many Hands" problem** or **diffusion of responsibility**. In a compliance context, regulators call this the **"Net Impression"** violation.
  *   **The Regulatory Reality:** The FTC (Federal Trade Commission) and SEC (Securities and Exchange Commission) are aware of this. They do not judge ads or disclosures sentence-by-sentence. They judge the **"Net Impression on the Reasonable Consumer."**
      *   If the *overall take-away* is false, it does not matter that every individual sentence is technically true. The "compliance defense" of "but we didn't say X" fails if the document screams X.
  *   **The Edge:** The edge here is **materiality**. Is the false impression significant enough to change a decision? If the press release makes the company look 10% more stable than it is, that's material. If it makes them look 0.1% more stable, it might be dismissed as "puffery."

  ### 4. The Social Dynamic: Polite Fiction
  Instance two (the colleague declining the invite) is different from instances one and three. In the compliance examples, the deception is adversarial (company vs. consumer). In the colleague example, the deception is **cooperative**.

  *   **The Name:** This is a **Polite Fiction** or **Face-Work**.
  *   **The Mechanism:** This relies on **Common Knowledge**. In game theory, common knowledge isn't just "we both know it." It is "we both know it, and we both know that we both know it."
      *   You know he is blowing you off.
      *   He knows you know he is blowing you off.
      *   He knows that you know that he knows you know.
  *   **Why it stays unspoken:** Naming the reality ("Just say you don't want to come") threatens the **social face** of both parties.
      *   If he says "I don't want to come," he damages your face (rejection).
      *   If you say "I know you're lying," you damage his face (accusation).
      *   By accepting the palter ("Oh, bummer, maybe next time"), you both agree to preserve the relationship at the cost of literal truth.
  *   **What it isn't:** This is not manipulation. Manipulation seeks to gain an advantage. Polite fiction seeks to avoid a cost (awkwardness, hurt feelings).

  ### Summary for a Compliance Writer
  Since you write compliance copy, here is the practical translation of these philosophical concepts:

  1.  **Paltering** is the tactic your clients want to use. They want to say the true thing that implies the false benefit.
  2.  **Implicature** is the trap. You must assume the reader will make the logical leap. If the leap is obvious, the palter will fail in a regulatory audit.
  3.  **Net Impression** is the standard you are held to. Regulators do not read like lawyers; they read like consumers. If the "gestalt" of the document is misleading, the technical accuracy of the sentences will not save you.
  4.  **Plausible Deniability** is the goal of the palterer, but in regulated industries, **Strict Liability** often applies. It doesn't matter if you *intended* to mislead; it matters if you *did*.

  **The term you are looking for:**
  If you need one word for the act, it is **Paltering**.
  If you need the regulatory concept, it is **Misleading by Omission or Context**.
  If you need the social dynamic, it is **Pluralistic Ignorance** or **Polite Fiction**.

  You are circling the difference between **truth** (correspondence with fact) and **honesty** (correspondence with belief/intent). Paltering is the art of being truthful without being honest.
