answer: |-
  This is a superb set of questions. You have identified three distinct failure modes of intuitive probability, all rooted in the same philosophical soil but branching into different mathematical territories.

  There is no single standard name that covers all three exclusively, but they are collectively known as **Paradoxes of the Principle of Indifference**. More technically, they are failures of **Measure Specification**.

  Here is the carving you asked for. I will break down each case, identify its specific mathematical pathology, and then synthesize the rules for distinguishing them.

  ---

  ### 1. The Dartboard: Ambiguity of Parameterization
  **Established Name:** A variant of **Bertrand's Paradox** (specifically, the "Random Chord" problem is the famous cousin, but this is the "Random Point" version).
  **The Pathology:** Underspecified Measure.

  **The Carving:**
  You are right; your friend is wrong, *but only because of a hidden convention*.
  The phrase "equally likely to land at any point" is shorthand for "uniform with respect to the Lebesgue measure (area) on the 2D plane."
  *   **Your Symmetry:** You are invoking the symmetry of the **Euclidean Group** (rotations and translations). The only measure on a 2D region invariant under translations and rotations is the Area measure.
  *   **Friend's Symmetry:** Your friend is invoking a symmetry of the **Radial Coordinate**. They are assuming the variable $r$ (distance from center) is the primitive random variable, uniformly distributed.

  **Why it feels like both are right:**
  Because the problem statement ("pick a point") does not specify the *physical process* of picking.
  *   If you throw a dart blindfolded at a board, physics dictates a uniform distribution over **area** (assuming no skill bias). You win.
  *   If you generate the point by spinning a wheel to get an angle and rolling a die to get a radius, your friend wins.

  **Resolution:**
  In standard geometric probability, "random point in a region" implies uniformity over the **volume/area/length of the embedding space**, not the parameters used to describe it.
  *   **Rule:** The "correct" symmetry group is the group of transformations that preserves the *geometry of the space itself*, not the coordinate system. The disk has an area; it does not have a "natural" radial distribution independent of that area.

  ---

  ### 2. The Sphere: Ambiguity of Conditioning
  **Established Name:** The **Borel-Kolmogorov Paradox**.
  **The Pathology:** Conditional Probability on Measure-Zero Sets.

  **The Carving:**
  This is fundamentally different from the dartboard. In the dartboard case, one answer is physically standard. In the sphere case, **both answers are mathematically valid**, depending on how you ask the question.
  *   **The Issue:** You are asking for $P(\text{Event } A \mid \text{Event } B)$ where $P(B) = 0$ (the probability of landing exactly on a great circle is zero).
  *   **Kolmogorov's Insight:** Conditional probability is not defined on a single event of probability zero. It is defined relative to a **$\sigma$-algebra** (a family of events). You must specify *how* you approach the circle.
      *   **Case A (Longitude):** You take a limit of thin vertical wedges (strips of constant longitude width). The area of these strips is constant everywhere. The resulting density on the circle is **uniform**.
      *   **Case B (Latitude):** You take a limit of horizontal bands (strips of constant latitude width). Near the poles, these bands contain less surface area than near the equator. To maintain uniform density on the sphere, the probability mass must concentrate where the area is larger (the equator). The resulting density on the circle is **non-uniform** (proportional to cosine of latitude).

  **Resolution:**
  Neither answer is "wrong." The question "What is the distribution on this circle?" is **ill-posed** without specifying the *family of shrinking sets* used to define the limit.
  *   **Rule:** You cannot condition on a value of a continuous variable without specifying the *coordinate system* used to measure that value. The symmetry of the sphere is broken by the choice of coordinate grid used to perform the conditioning.

  ---

  ### 3. The Integer: Impossibility of Normalization
  **Established Name:** **Non-existence of a Uniform Countable Measure** (or the failure of Countable Additivity).
  **The Pathology:** Divergence.

  **The Carving:**
  This is the most severe failure. Cases 1 and 2 describe situations where valid probability spaces exist, but the description was ambiguous. Case 3 describes a situation where **no valid probability space exists** under standard axioms.
  *   **The Issue:** Kolmogorov's axioms require **Countable Additivity** (the probability of a union of disjoint events is the sum of their probabilities) and **Normalization** (total probability = 1).
  *   **The Conflict:** If $P(n) = p > 0$ for all integers, the sum diverges to infinity. If $P(n) = 0$, the sum is zero. Neither equals 1.

  **Resolution:**
  You cannot do this in standard probability theory. To make sense of it, you must abandon standard axioms:
  *   **Option A:** Use **Finitely Additive Measures** (de Finetti). You allow $P(\mathbb{N}) = 1$ and $P(n) = 0$, but you lose the ability to sum infinite series of probabilities reliably.
  *   **Option B:** Use **Improper Priors** (Bayesian). You admit the "distribution" integrates to infinity, but you only use it as a temporary tool that gets normalized by data later.

  **Rule:** This is not an ambiguity; it is an impossibility. It is distinct from 1 and 2 because there is no "correct" answer to find, only axioms to change.

  ---

  ### The Synthesis: How to Tell Them Apart

  You asked for a way to distinguish a "both-answers-are-right" case from a "one-is-wrong" case, and a rule for symmetry. Here is the hierarchy of failure.

  #### 1. The Measure Specification Test (Case 1 vs. Case 2)
  *   **Case 1 (Dartboard):** The ambiguity lies in the **prior**. You haven't defined the base measure yet.
      *   *Test:* Is there a physical or geometric standard for "random point in $X$"? Yes, usually the Lebesgue measure (volume/area).
      *   *Verdict:* **One answer is standard.** The "Area" answer is the canonical interpretation of "random point." The "Radius" answer requires a specific, non-standard generation mechanism.
  *   **Case 2 (Sphere):** The ambiguity lies in the **conditional**. The base measure (sphere surface) is agreed upon. The ambiguity is in the *limit process*.
      *   *Test:* Does the answer change if you rotate the coordinate system used to define the condition? Yes.
      *   *Verdict:* **Both answers are valid relative to their framing.** There is no "canonical" way to condition on a great circle without specifying the slicing method.

  #### 2. The Existence Test (Case 1 & 2 vs. Case 3)
  *   **Cases 1 & 2:** A valid probability space $(\Omega, \mathcal{F}, P)$ *can* be constructed. The dispute is over which $P$ was intended.
  *   **Case 3:** No valid probability space $(\Omega, \mathcal{F}, P)$ exists satisfying the constraints (uniformity + countable additivity + normalization).
      *   *Verdict:* **Category Error.** You are asking for an object that does not exist in the theory you are using.

  #### 3. The Symmetry Group Rule
  You asked: *"If someone says 'use the symmetry group of the problem', what makes one group the group?"*

  *   **The Rule:** The relevant symmetry group is the **automorphism group of the sample space that preserves the structural properties implied by the problem statement.**
  *   **Application to Dartboard:** The problem says "circular board" and "any point." The structure is a 2D Euclidean disk. The group is the Euclidean group $E(2)$. The only measure invariant under $E(2)$ is Area. The friend's radial symmetry ignores translational invariance (shifting the center), which is implicitly part of "any point."
  *   **Application to Sphere:** The problem says "sphere" and "random point." The group is $SO(3)$ (rotations). This uniquely fixes the surface area measure. *However*, the conditioning step introduces a new structure (the coordinate grid). The group $SO(3)$ does not preserve the *coordinate grid*. Therefore, the symmetry is broken by the act of conditioning, leading to the Borel-Kolmogorov ambiguity.

  ### Summary Table

  | Feature | 1. Dartboard | 2. Sphere (Borel-Kolmogorov) | 3. Integers |
  | :--- | :--- | :--- | :--- |
  | **Core Issue** | Underspecified Measure | Conditioning on Measure Zero | Non-normalizable Space |
  | **Status** | Ambiguous (but has convention) | Ambiguous (no convention) | Impossible (in standard theory) |
  | **Resolution** | Default to Lebesgue (Area) | Specify the limiting family | Change Axioms (e.g., Finite Additivity) |
  | **Symmetry** | Euclidean Group picks Area | Rotations preserve Sphere, not Slices | Translation symmetry breaks Sum |
  | **Verdict** | You are right (by convention) | Both are right (relative to frame) | Neither is right (question is void) |

  ### A Coinage for the Collection
  If you need a label for this specific triad of failures, I propose **"The Indifference Triad."**
  They represent the three ways the **Principle of Indifference** (assign equal weight to indistinguishable outcomes) can break:
  1.  **Parameterization Break:** Indifference applied to the wrong variable (Radius vs. Area).
  2.  **Conditioning Break:** Indifference applied to a limit process without defining the path (Longitude vs. Latitude slices).
  3.  **Infinity Break:** Indifference applied to an infinite set where weights cannot sum to one (Integers).

  **Final Advice:**
  When you encounter this shape again, ask:
  1.  **Is the space finite?** If no, suspect Case 3 (Impossibility).
  2.  **Are we conditioning on a zero-probability event?** If yes, suspect Case 2 (Borel-Kolmogorov / Limit Ambiguity).
  3.  **Are we defining a base distribution?** If yes, suspect Case 1 (Bertrand / Parameterization). Check which symmetry group preserves the *physical* properties of the space, not just the coordinates.
