prompt: |-
  I've got a puzzle-shape that keeps turning up and I want to know if it has a name, or whether it's really three seperate things that just look alike. I'll describe it rather than guess at the jargon, because the jargon is exactly what I'm missing.

  First one. I throw a dart at a circular board and I tell you it's just as likely to land at any point on the board as at any other. Whats the chance it lands in the inner half of the radius, i.e. nearer the middle than halfway out? By area it's a quarter. My mate says it's a half, because the distance from the centre is just as likely to come out small as large, so half the time it's in the inner half of the distance. Neither of us has messed up the arithmetic. We can each point at a symmetry the other one is ignoring, and it doesn't feel like either of us is cheating. But 'equally likely to land anywhere' was supposed to be the whole specification.

  Second, which may or may not be the same thing. You pick a point truly at random on a sphere. Now condition on the point lying on one particular great circle -- the one where the longitude reads zero. Take the limit of a very thin sliver of sphere around that circle and see how the probability spreads out along it. Then do the same for the great circle where the latitude reads zero. You get a different spread. But the two circles are the same circle up to a rotation, and the original rule for picking the point doesn't care about rotations at all, so how can the answers come out different? A friend told me this one resolves somehow, but I didn't follow the resolution, and I'm not sure I'd recognise a good resolution if I heard one.

  Third, possibly unrelated. 'Pick a whole number at random, all of them equally likely.' That seems to break differently from the first two -- you don't get two rival answers, you get no answer at all -- and I want to know whether that's a different failure or the same one wearing a hat.

  So: is there one name for this, and what's the closest established thing to each of the three, and where exactly does each fall short of the others? The label is honestly not what I'm after. What I want is the carving. In the dart case, are we both right, or is one of us just wrong and it's only the framing that makes it look symmetric? Is there a rule for picking the right symmetry -- and if someone says 'use the symmetry group of the problem', what makes one group *the* group, and are there cases where that instruction gives up and goes quiet? And is there a way to tell a genuine both-answers-are-right case from a case where two answers are on offer but only one is defensible? If nothing established covers it, coin a term, define it, and tell me what it doesn't cover.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** The user has encountered three probabilistic puzzles that seem related but might be distinct. They want to know if there's a unifying name/concept, how they differ, and specifically want to understand the *structure* of the problem ("the carving") rather than just a label.
      *   **Puzzle 1 (Dartboard):** Uniform distribution on area vs. uniform distribution on radius. (Bertrand's Paradox variant / Area vs. Radius).
      *   **Puzzle 2 (Sphere/Great Circles):** Borel-Kolmogorov Paradox. Conditioning on a measure-zero set (a great circle) on a sphere yields different distributions depending on the coordinate system used to define the limit.
      *   **Puzzle 3 (Random Integer):** Impossible uniform distribution on a countably infinite set.
      *   **Specific Questions:** Is there one name? What's the closest established thing to each? Where do they fall short of each other? In the dart case, who is right? Is there a rule for picking the right symmetry? How to distinguish "both right" (context-dependent) from "one wrong"?
      *   **Tone:** Intellectual, precise, slightly skeptical of jargon, wants deep conceptual clarity ("the carving").

  2.  **Deconstruct the Three Puzzles:**

      *   **Puzzle 1: The Dartboard.**
          *   *Scenario:* Uniform on a disk.
          *   *Conflict:* $P(r < R/2)$ calculated via Area ($\pi (R/2)^2 / \pi R^2 = 1/4$) vs. calculated via Radius (Uniform on $[0, R] \implies 1/2$).
          *   *Resolution:* The phrase "equally likely to land anywhere" implies uniform with respect to *area* (Lebesgue measure in 2D). The friend's assumption (uniform on radius) implies a different density function ($\rho(r) \propto 1/r$).
          *   *Verdict:* One is right (Area), one is wrong (Radius), *given the standard interpretation of "random point in a region"*. However, it highlights the ambiguity of "random" without specifying the measure. This is often associated with **Bertrand's Paradox**, though Bertrand's is usually about chords. It's fundamentally about **Measure Specification**.

      *   **Puzzle 2: The Sphere (Borel-Kolmogorov).**
          *   *Scenario:* Uniform on sphere surface. Condition on a great circle (measure zero).
          *   *Conflict:* Conditioning on longitude $\phi = 0$ vs. latitude $\theta = 0$.
          *   *Resolution:* Conditional probability on events of probability zero is undefined *unless* you specify the limiting process (the family of sets shrinking to the event). Different coordinate systems imply different limiting families (strips of constant width in different metrics).
          *   *Verdict:* Both answers are mathematically valid *relative to the chosen limiting procedure*, but the question "what is the conditional probability" is ill-posed without that procedure. This is the **Borel-Kolmogorov Paradox**. It's about **Conditional Probability on Measure Zero Sets**.

      *   **Puzzle 3: Random Integer.**
          *   *Scenario:* Uniform on $\mathbb{Z}$ or $\mathbb{N}$.
          *   *Conflict:* Sum of probabilities must be 1. If $p > 0$, sum diverges. If $p = 0$, sum is 0.
          *   *Resolution:* Impossible in standard Kolmogorov probability theory. Requires improper priors or finitely additive measures (de Finetti).
          *   *Verdict:* This is a **Non-Existence** problem. It's not ambiguous; it's impossible under standard axioms.

  3.  **Synthesize and Compare:**

      *   *Common Thread:* All three involve the failure of the phrase "pick at random" to uniquely specify a probability measure. They all expose the gap between intuitive symmetry and rigorous measure theory.
      *   *Distinction:*
          *   Case 1 is about **Parameterization** (which variable gets the uniform density?). Usually resolvable by physical context (area measure is standard for "dartboard").
          *   Case 2 is about **Conditioning** (how do we approach the zero-probability event?). Resolvable only by specifying the limiting process.
          *   Case 3 is about **Normalization** (can the measure exist at all?). Unresolvable in standard theory.
      *   *Unifying Label:* "Paradoxes of Geometric Probability" or "Ambiguities of the Principle of Indifference." The most precise technical umbrella is **The Problem of Measure Specification** or **Violations of the Principle of Indifference**.
      *   *Key Concept:* **The Principle of Indifference** (assign equal probability to symmetric outcomes) is the culprit. It fails when "symmetry" isn't uniquely defined or when the space is infinite.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. Validate that these are famous, distinct, but related problems.
      *   *The Unifying Name:* There isn't *one* name, but "The Principle of Indifference" is the philosophical root. Technically, they are failures of **Measure Specification**.
      *   *Case 1 (Dartboard):*
          *   Name: Variant of **Bertrand's Paradox**.
          *   Analysis: "Everywhere equally likely" implies Area Measure (Lebesgue). The friend is imposing a different measure.
          *   Who is right? You are, by convention of "random point in a set." But the deeper truth is the problem was underspecified until "area" was implied.
          *   Symmetry: Rotational symmetry + Translational symmetry (in the plane) picks Area. Radial symmetry alone picks Radius. The "Group" argument: The group of area-preserving transformations is the relevant one.
      *   *Case 2 (Sphere):*
          *   Name: **Borel-Kolmogorov Paradox**.
          *   Analysis: This is the hardest one. It's about conditional probability $P(A|B)$ where $P(B)=0$.
          *   Resolution: Kolmogorov showed you need a $\sigma$-algebra (a family of events), not just a single event. The "slicing" matters.
          *   Difference from Case 1: In Case 1, one measure is usually physically preferred. In Case 2, neither slicing is inherently "truer" without physical context (e.g., how was the data collected?).
      *   *Case 3 (Integers):*
          *   Name: **Impossibility of a Uniform Countable Measure**.
          *   Analysis: Countable additivity breaks this.
          *   Difference: Cases 1 & 2 allow valid probability spaces, just ambiguous ones. Case 3 allows *no* valid probability space (under standard axioms).
      *   *The "Carving" (Synthesis):*
          *   Distinguish **Ambiguity** (1 & 2) vs. **Impossibility** (3).
          *   Distinguish **Measure Choice** (1) vs. **Conditioning Procedure** (2).
          *   Address the "Symmetry Group" question: The group must act transitively on the space and preserve the measure. In Case 1, the Euclidean group picks Area. In Case 2, the rotation group preserves the sphere measure, but the *conditioning* breaks the symmetry depending on the coordinate chart.
      *   *Conclusion:* Coin a term if needed? "Measure Ambiguity Hierarchy" maybe? Let's stick to established terms but clarify the hierarchy. Let's propose **"The Indifference Triad"** or simply categorize them by the failure mode. Let's use the term **"The Measure Specification Problem."**

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Case 1:* I need to be careful not to just say "You're right." I need to explain *why* "everywhere equally likely" maps to Area. It's because "point" implies 2D Lebesgue measure. If the problem was "pick a radius, then pick an angle," the friend would be right. The ambiguity is in the *generation process*.
      *   *Correction on Case 2:* Make sure to mention that the density along the equator vs. a meridian differs because the "width" of the strip changes with latitude in one coordinate system but not the other.
      *   *Correction on Case 3:* Mention Finitely Additive Measures (de Finetti) as the "escape hatch" for advanced readers, but keep the main focus on standard Kolmogorov theory.
      *   *Addressing the "Symmetry Group" question:* This is crucial. In Case 1, the symmetry group of the *disk* (rigid motions) preserves area, not radial distance distribution. In Case 2, the symmetry group of the *sphere* preserves surface area, but conditioning breaks the invariance unless the conditioning family is also invariant.

  6.  **Final Polish:**
      *   Ensure the tone matches the user's (thoughtful, precise, avoiding hand-waving).
      *   Structure clearly with headings.
      *   Make sure the "Carving" section explicitly answers the "how to tell" questions.

