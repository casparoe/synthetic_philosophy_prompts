answer: |-
  1. **The Mechanism of Transfer**
  You argue that promising transfers normative authority rather than creating a new first-order reason. Could you walk us through the mechanics of that transfer? When I say "I promise," what exactly changes in the normative landscape between us that allows you to hold a claim over my actions that you didn't hold before?

  *   **Follow-up:** If you say the transfer creates a second-order reason for me to comply, does that mean I am obligated to obey your demand even if I think your demand is mistaken about what I ought to do?

  2.  **Distinguishing Speech Acts**
  Many speech acts change our normative relations. If I assert a fact, I invite you to hold me to the truth; if I threaten you, I give you a reason to act; if I sign a contract, I incur legal liability. How does your authority-transfer account specifically distinguish promising from asserting, threatening, and contracting? Is it solely the power to release me from the obligation that sets promising apart?

  *   **Follow-up:** If the power to release is the key differentiator, does that imply that a "promise" where the promisor retains the right to unilaterally cancel without the promisee's consent isn't a promise at all, but merely a prediction or an assertion of intent?

  3.  **The Acceptance Condition**
  You include an acceptance condition: the transfer of authority succeeds only if the promisee has the capacity to accept it. This leads you to say promises to infants, the dead, or those in comas are only "derivatively" binding. What grounds that derivative binding if the core mechanism—the transfer of authority to the promisee—has failed to take hold?

  *   **Follow-up:** In those derivative cases, who holds the normative authority to demand performance or release the promisor? Is it a guardian, the community, or does the authority simply remain in abeyance?

  4.  **The Secret Breach**
  A classic challenge for demand-based views is the case of the secret breach: suppose I break my promise, but you never find out, so you never demand performance and never exercise your authority. If the obligation is constituted by your authority to demand, does the obligation disappear simply because you remain ignorant of the breach?

  *   **Follow-up:** If you answer that the *capacity* to demand is what matters rather than the *exercise*, does that capacity persist even if you are permanently deceived into thinking I performed?

  5.  **The Wrong-Kind-of-Reason Problem**
  Let's apply the "wrong-kind-of-reason" problem to your view. If you hold the normative authority to demand my performance, do you have that authority regardless of *why* you are demanding it? For example, if I promise to meet you for lunch, could you rightfully demand I perform even if your reason for demanding is that you've been bribed by a third party to keep me occupied?

  *   **Follow-up:** If you say the authority is limited to morally appropriate reasons for demanding, doesn't that reintroduce an independent standard of fidelity or morality that constrains the authority, rather than the authority constituting the obligation?

  6.  **The Promisor's Deliberative Landscape**
  You claim a promise does not add a new first-order reason for the promisor to act. Yet, when I promise, I feel I have a new reason to act. On your account, what enters my deliberative process at the moment of promising? Am I simply acknowledging that I have placed a tool of normative control in your hands?

  *   **Follow-up:** If I am not acknowledging a new duty but rather a change in your status, why would I feel guilt for breaking the promise if I know you will never exercise your authority to blame me?

  7.  **Revocation and Rescission**
  If promising transfers authority to the promisee, it seems the promisor cannot unilaterally take that authority back. But what about cases where circumstances change drastically? If I promise to drive you to the airport, but my car breaks down, have I lost the authority to release myself, or does the transfer of authority only cover the original terms of the act?

  *   **Follow-up:** If the authority is strictly with the promisee, does that mean I am obligated to attempt the impossible unless you explicitly release me, or does the content of the authority transfer implicitly include a "reasonable efforts" clause?

  8.  **Third-Party Standing**
  On your view, the promisee holds the specific authority to demand performance. Does this imply that third parties lack the standing to criticize a promise-breaker? If I break a promise to you, can a mutual friend rightfully blame me, or do they lack the normative authority that only you possess?

  *   **Follow-up:** If you grant that third parties *can* blame, is their authority derivative of yours, and if so, does that mean if you release me, the third party loses their standing to criticize my past breach?

  9.  **Immoral Promises**
  Can I transfer normative authority to you to demand that I do something immoral? If I promise to help you hide a crime, and your account says I've transferred authority to you to demand this, does your account imply I am obligated to help until you release me?

  *   **Follow-up:** If you say the transfer fails in immoral cases, is that because I lack the power to transfer authority over immoral acts, or because you lack the capacity to accept authority over immoral acts?

  10. **The Phenomenology of Obligation**
  Finally, many people experience the obligation of a promise as a "bond" or a "tie" that restricts their freedom. Your account describes it as a shift in who holds the reins. Do you think your view captures the phenomenology of promising—the internal feeling of being bound—or does it reframe that feeling as a misunderstanding of the underlying normative structure?

  *   **Follow-up:** If it reframes the feeling, do you think we should educate people to stop feeling "bound" and start feeling "accountable to another," or is the feeling of being bound a useful heuristic for respecting the other's authority?
