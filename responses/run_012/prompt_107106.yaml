prompt: |-
  I'm on the economic development board for a mid-sized city (we're not huge, maybe 200k people). We're in a bidding war with a rival metro to land the new headquarters of a regional company. Here's the mess: our consultants figure the HQ is worth maybe $60M in net benefit to us over 15 years, tops. We've already put $45M in incentives on the table, spent about $6M on site prep, lawyers and consultants, and signed earnest-money contracts on three parcels that we forfeit if we don't close. The company just came back asking us to go to $60M, and word is the rival city is at $52M and will probably match whatever we do. If we lose we eat the $6M plus the forfeited deposits and the mayor looks like a chump; if we win we're basically at breakeven at best and maybe underwater. One of our analysts keeps calling this a "dollar auction," another says its really a war of attrition, and honestly I'm not sure either label tells me what to do Thursday.

  I have to circulate a written opinion before the meeting. Draft it for me. It should land on a concrete recommendation — raise the offer to some number, hold firm at what we've already bid, or walk, and by when — with the reasoning spelled out, and it needs to take seriously the strongest case for the other side, which is basically that folding now wrecks our reputation for resolve in every future negotiation we ever have.

  Couple of things I specifically want you to work through rather than hand-wave:

  - Whether our escalation is just sunk-cost irrationality or whether its actually rational given the rules of the game we're stuck in, and why that distinction changes the fix.
  - Whether this is closer to a dollar auction or a war of attrition, and what actually differs between them here.
  - The proposed fixes floating around: publicly precommitting to a hard ceiling before the next round, telling the company we'll submit one sealed final offer and no more, offering non-cash stuff (land, workforce training) instead of more money, begging the state to cap municipal incentives, or quietly getting the rival city to coordinate with us — and flag anything legally dicey about that last one.
  - Whether an announced ceiling is even credible, given the other side can just bid one dollar under it.
  - And a standing policy for future contests, so we're not back here in two years.

  Keep it to something I can actually read aloud. No need for footnotes or reading lists, just the argument and the call.
reasoning: |-
  Here's a thinking process that leads to the drafted memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Economic Development Board for a mid-sized city (~200k people).
      *   **Situation:** Bidding war for a regional company HQ.
      *   **Numbers:**
          *   Net Benefit (15 yrs): $60M (max).
          *   Current Incentives Offered: $45M.
          *   Sunk Costs (prep, lawyers, consultants): $6M.
          *   Earnest Money Deposits (forfeitable): 3 parcels (amount unspecified, but implies significant loss if deal dies).
          *   Company Ask: $60M.
          *   Rival City Status: At $52M, likely to match.
          *   Outcome if Win: Breakeven/Underwater ($60M cost + $6M sunk vs $60M benefit).
          *   Outcome if Lose: Lose $6M + deposits, Mayor looks bad.
      *   **Key Concepts to Address:** Sunk Cost Fallacy vs. Rational Escalation, Dollar Auction vs. War of Attrition, Credibility of Commitments, Specific Proposals (ceilings, sealed bids, non-cash, state caps, collusion), Future Policy.
      *   **Deliverable:** A written opinion/memo to circulate before the meeting.
      *   **Tone:** Professional, decisive, analytical, readable aloud.
      *   **Requirement:** Concrete recommendation (raise, hold, walk) with deadline. Address the "reputation for resolve" counterargument. Flag legal risks (collusion).

  2.  **Deconstruct the Economic/Game Theory Problems:**

      *   **Sunk Cost vs. Rational Escalation:**
          *   *Sunk Cost:* The $6M and deposits are gone if we walk *now*. But future spending should only depend on future benefits.
          *   *Rational Escalation:* If the benefit is $60M and we've bid $45M, we have $15M margin. If we bid $60M, margin is $0. If we bid $61M, we lose money.
          *   *The Trap:* The "loss" of reputation and sunk costs makes us feel like we *must* win to validate past spending. But economically, paying $60M for $60M value is a wash, ignoring the $6M sunk. Paying $60M + $6M sunk for $60M value is a net loss.
          *   *Decision:* Do not bid above $60M. Ideally, bid less.

      *   **Dollar Auction vs. War of Attrition:**
          *   *Dollar Auction:* Bidders pay their bids even if they lose (or in this variant, the loser loses sunk costs/deposits, winner pays bid). The key feature is escalation beyond the value of the prize because losing is painful.
          *   *War of Attrition:* Contestants endure costs over time until one quits. The winner pays the cost of the duration.
          *   *Application:* This looks more like a **Dollar Auction**. Why? Because the "losing penalty" (sunk costs + political embarrassment) drives us to bid *above* the intrinsic value ($60M). In a pure war of attrition, you just wait them out. Here, the company is actively soliciting higher bids ("asked us to go to $60M"). The structure incentivizes irrational escalation to avoid the "loser's cost."
          *   *Distinction:* In a War of Attrition, time is the cost. In a Dollar Auction, the bid amount is the cost, amplified by the fear of losing sunk investment.

      *   **Credibility of Ceilings:**
          *   If we say "Max $55M," rival bids $55.1M. We lose.
          *   To be credible, it must be binding (e.g., statutory limit, sealed final offer).
          *   "Sealed Final Offer" (Best and Final) is the standard mechanism to stop escalation.

      *   **Collusion (Contacting Rival City):**
          *   *Legal Risk:* High. Antitrust laws (Sherman Act) generally prohibit competitors (cities acting as economic entities) from fixing prices/bids. Even if they are governments, this is legally dicey and ethically fraught. *Recommendation: Avoid.*

      *   **Reputation Argument:**
          *   Counter: Walking away signals fiscal discipline, not weakness. Winning a bad deal signals desperation. Future companies will smell blood.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary/Recommendation:** Put the bottom line up front. (Walk away or Hold Firm at a specific number below value). Let's go with **Hold Firm at $50M + Non-Cash, Walk if not accepted by Thursday.** Why? Because $60M is breakeven, but we have $6M sunk. We need *some* margin to justify the risk. Actually, looking at the numbers: Benefit $60M. Current Bid $45M. They want $60M. If we pay $60M, Net = 0. Plus we spent $6M. Total Net = -$6M. We cannot go to $60M.
      *   **Analysis of the Trap (Sunk Costs):** Explain why the $6M shouldn't dictate the next bid, but the *deposits* are marginal costs of walking away now.
      *   **Game Theory (Auction vs. Attrition):** Define it. It's a Dollar Auction because the loser pays (sunk costs) and the winner overpays.
      *   **Addressing the Counterargument (Reputation):** Reframe "resolve" as "discipline."
      *   **Evaluation of Proposals:**
          *   Public Ceiling: Hard to make credible.
          *   Sealed Final Offer: Best mechanism.
          *   Non-Cash: Good, doesn't hit cash cap.
          *   State Cap: Too slow.
          *   Collusion: Illegal/Unethical.
      *   **Future Policy:** Need a cap based on ROI.
      *   **The Call:** Specific number and deadline.

  4.  **Refining the Recommendation:**
      *   Current Bid: $45M.
      *   Value: $60M.
      *   Sunk: $6M.
      *   If we bid $50M: Margin = $10M. Covers some risk.
      *   If we bid $60M: Margin = $0. Loss of $6M sunk.
      *   Rival is at $52M.
      *   If we hold at $45M, we likely lose.
      *   If we go to $55M, we have $5M margin.
      *   *Decision:* The prompt asks for a concrete recommendation. The smart economic move is to walk if the price exceeds value. However, politically, walking means eating the $6M + deposits.
      *   *Strategic Move:* Submit a "Best and Final" offer that is *below* the $60M value but higher than current. Say $52M (matching rival rumored bid) but structured differently? No, if rival matches, we enter a bidding war.
      *   *Best Move:* Set a hard cap at $50M (leaving $10M buffer for the $6M sunk cost to be amortized or just to ensure positive net). Announce this is final.
      *   *Wait, the prompt says:* "If we win we're basically at breakeven at best and maybe underwater." This implies if we meet the $60M ask.
      *   *My Recommendation:* Do not meet the $60M ask. Move to $50M total package. Declare "Best and Final." If they reject, walk.
      *   *Why?* Because paying $60M for $60M value is bad business when you've already spent $6M. You need a return on the *total* investment.
      *   *Reputation:* Better to be known as a city that doesn't overspend than a city that can be bullied.

  5.  **Addressing Specific Constraints:**
      *   *Readable aloud:* Keep sentences punchy. Avoid dense academic jargon where possible.
      *   *Collusion:* Must explicitly flag the legal risk of talking to the rival city.
      *   *Credibility:* How to make the ceiling stick? "Best and Final" letter from the Mayor/City Manager.
      *   *Sunk Cost:* Distinguish between the $6M (gone) and the deposits (marginal cost of exit).

  6.  **Final Polish:**
      *   Check tone: Needs to be authoritative but collaborative (it's a board memo).
      *   Check math: $60M benefit - $60M incentive = $0. Minus $6M sunk = -$6M. Correct.
      *   Check deadline: "Thursday" is mentioned in the prompt.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe suggest talking to the rival city.
      *   *Correction:* No, prompt asks to flag legal diceiness. It's basically antitrust. Bid-rigging. Don't do it.
      *   *Initial thought:* Maybe say "Walk away immediately."
      *   *Correction:* Politically difficult. Better to make one final reasonable offer ($50M) then walk. It shows good faith but discipline.
      *   *Game Theory:* Ensure the distinction between Dollar Auction and War of Attrition is clear. Dollar Auction = escalation due to loss aversion. War of Attrition = endurance. This is Dollar Auction because the company is actively driving the price up against a rival, and our sunk costs make us fear losing.

  8.  **Finalizing the Recommendation:**
      *   Offer: $50M cash + non-cash incentives.
      *   Condition: Best and Final.
      *   Deadline: Thursday noon.
      *   Rationale: Preserves $10M net benefit to offset sunk costs/political risk.
      *   Future: Cap incentives at 50% of projected net benefit.

      *(Self-Correction on the "Walk" option)*: If I recommend walking *now*, we eat the $6M + deposits. If I recommend a final bid of $50M, we might still lose, but we tried. Given the political pressure ("Mayor looks like a chump"), a "Best and Final" that is fiscally responsible is the best cover. It shifts the blame to the company for being greedy.

      *Wait, one nuance:* The prompt says "signed earnest-money contracts on three parcels that we forfeit if we don't close." This is a *marginal* cost of walking away *now*. It acts like a sunk cost psychologically, but economically it's a cost of the decision to walk. If the deposits are large, they matter. I don't have the number, but I should acknowledge them as "exit costs."

      *Let's structure the argument:*
      1. Recommendation.
      2. The Economic Reality (Value vs. Cost).
      3. The Game Theory (Dollar Auction).
      4. The Reputation Counter-argument.
      5. The Mechanism (How to stop the auction).
      6. Future Policy.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Economic Development Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Regional HQ Incentive Package

  **Recommendation**

  I recommend we authorize the City Manager to submit a **final, binding offer of $50 million in cash incentives plus existing non-cash packages**, with a hard expiration of **Thursday at 12:00 PM**. We must explicitly communicate that this is our "Best and Final" offer and that we will not participate in further counter-bidding. If the company does not accept by the deadline, we walk away, forfeit the deposits, and absorb the sunk costs.

  We cannot meet their request for $60 million. At that number, the deal is economically neutral at best and likely negative once we account for the $6 million already spent. We are not walking away from a profit; we are walking away from a loss disguised as a win.

  **The Economic Reality: Sunk Costs vs. Marginal Gain**

  We need to be clear about the math. Our consultants cap the net benefit of this HQ at $60 million over 15 years.
  *   If we bid $60 million, the net benefit is zero.
  *   We have already spent $6 million on prep and consultants.
  *   Therefore, a $60 million deal results in a **net loss of $6 million** to the taxpayers, not counting the forfeited land deposits.

  The argument that we must close the deal to "save" the $6 million we've already spent is the definition of the **Sunk Cost Fallacy**. That money is gone whether we sign the deal or not. The only relevant question is: *Does the next dollar we spend yield more than a dollar in return?*

  At $50 million, we retain a $10 million margin. This provides a buffer to offset the political and financial pain of the sunk costs. At $60 million, there is no buffer. We are paying full price for a product that costs us money to store.

  **Game Theory: Dollar Auction vs. War of Attrition**

  Our analysts are debating whether this is a "War of Attrition" or a "Dollar Auction." The distinction matters because the fix for each is different.

  *   **War of Attrition:** Two sides wait each other out. The cost is time. The fix is endurance.
  *   **Dollar Auction:** Bidders pay their bids even if they lose (or in our case, the loser loses sunk costs and reputation). This creates a trap where bidders escalate past the value of the prize simply to avoid the pain of losing what they've already invested.

  This is a **Dollar Auction**. The company is leveraging our fear of losing the $6 million sunk cost and the land deposits to drive our bid above the asset's value. The rival city is the other bidder. In a Dollar Auction, the only winning move is to refuse to bid past the intrinsic value. If we treat this as a War of Attrition and try to "out-wait" them, we will simply keep raising our bid until we break even, which is a loss.

  **Addressing the Reputation Counter-Argument**

  The strongest argument against walking away is reputation. If we fold now, critics will say we lack resolve, and future companies will demand we start every negotiation at our maximum limit.

  However, reputation cuts both ways. If we agree to a $60 million package for $60 million of value, we signal to the market that we are **desperate**. We become the city that can be bullied into breakeven deals. Future negotiators will smell blood.

  Conversely, walking away from a bad deal signals **fiscal discipline**. It tells the market that we are a sophisticated partner who understands ROI. We may lose this specific prize, but we protect our credit rating and our leverage for the next ten negotiations. We must reframe "resolve" not as "winning at all costs," but as "sticking to our valuation."

  **Evaluation of Proposed Mechanisms**

  To execute the recommendation above, we must choose the right mechanism to stop the escalation.

  1.  **Publicly Precommitting to a Ceiling:** This is only credible if it is binding. If we say "Our max is $50M" and the rival city bids $51M, we look weak if we fold. To work, this must be coupled with a "Best and Final" declaration.
  2.  **Sealed Final Offer:** **This is the preferred method.** We submit one number, privately, with a legal attestation that we will not improve it. This removes the dynamic of incremental escalation.
  3.  **Non-Cash Incentives:** We should maximize these (land, training, expedited permitting). They have value to the company but lower marginal cost to us. This allows us to increase the *perceived* package value without crossing the $50M cash threshold.
  4.  **State Caps:** Begging the state to cap incentives is a long-term fix, not a solution for Thursday.
  5.  **Coordinating with the Rival City:** **Do not do this.** I must flag this as legally dicey. Municipalities can be subject to antitrust scrutiny if they appear to be colluding to fix prices or suppress bidding. Contacting the rival city to agree on a cap could be construed as bid-rigging. It exposes the city to litigation and scandal. We must compete independently.

  **Credibility of the Ceiling**

  Will they believe us? If we simply say "We won't go higher," they will assume we are bluffing and bid one dollar over.

  To make the ceiling credible, it must be **procedurally locked**. The Board should vote Thursday morning to authorize *only* the $50M package. The City Manager's letter of offer should state: *"The City Council has authorized this specific package as its final contribution. No further appropriations are available for this project."* By tying our hands administratively, we remove the negotiator's ability to cave.

  **Future Policy**

  We cannot operate like this every two years. I propose we adopt a standing policy for future contests:
  1.  **Incentive Cap:** Cash incentives cannot exceed 50% of the projected net fiscal benefit.
  2.  **Sunk Cost Limit:** Consulting and prep costs are capped at 5% of the potential incentive package. If the deal stalls, we stop spending immediately.
  3.  **No Earnest Money:** We do not forfeit deposits on land parcels until a deal is fully executed. We lease options if necessary, but we do not put principal at risk during negotiation.

  **Conclusion**

  We are in a trap designed to make us pay for the privilege of working. The company knows we fear the political loss of the sunk $6 million. We must accept that loss to prevent a larger one.

  I move we authorize the $50M Best and Final offer for Thursday noon. If they refuse, we wish them well in the rival city and begin the process of repurposing the land parcels. We take the hit now, rather than bleeding for the next 15 years.
