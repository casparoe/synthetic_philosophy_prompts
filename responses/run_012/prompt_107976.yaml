answer: |-
  This is a classic philosophical stalemate, and your frustration is the correct rationalist response to hitting the bedrock of a conceptual trilemma. You are right to suspect that the "just a dispute about words" dissolve doesn't work here, but your diagnosis of *why* it doesn't work needs a slight adjustment.

  Here is the diagnosis of your group's situation, broken down by the nature of the disagreement, the validity of your hunch, the role of higher-order vagueness, and what actual progress looks like.

  ### 1. Is it Substantive or Verbal?
  **Verdict: Substantive.**

  In many rationalist contexts, "disputes about words" are dissolved by realizing two people are mapping the same territory with different coordinates. But vagueness isn't about the territory (the sand); it's about the *resolution of the map itself*.

  The disagreement is substantive because it is a disagreement about **norms of reasoning**. Each position prescribes a different logic for how you are allowed to infer new truths from old ones.
  *   **The Epistemicist** demands you keep Classical Logic (Bivalence, Excluded Middle, Modus Ponens) intact, even if it forces you to accept counter-intuitive metaphysical claims (magic boundaries).
  *   **The Supervaluationist** wants to keep Classical Logic validities but sacrifices the principle of Bivalence (some sentences are neither true nor false).
  *   **The Degree Theorist** saves the Intuition (smooth transitions) but sacrifices Classical Logic (Modus Ponens can fail; $P \land \neg P$ can be partially true).

  If you are building an AI, writing a legal code, or designing a decision theory, you cannot treat these as mere synonyms. You have to choose which logical rules hold. Therefore, the dispute is about which cognitive tool is the correct one to use, not just how to label a pile of sand.

  ### 2. Testing Your Hunch: Metaphysics vs. Semantics
  **Your Hunch:** *The epistemicist is doing metaphysics (facts about grain count); the others are doing semantics (what 'true' means).*

  **Diagnosis:** This is close, but slightly misaligned. All three are making **semantic** claims that have **metaphysical** commitments.

  *   **Epistemicism (e.g., Timothy Williamson):** This is primarily a semantic thesis: "Natural language predicates obey classical bivalence." The metaphysical consequence (there is a sharp fact of the matter) follows from the semantics. The Epistemicist isn't claiming we can measure the grain; they are claiming that *meaning itself* is sharp, but our access to meaning is limited by "semantic plasticity" (meanings shift slightly across possible worlds, preventing knowledge).
  *   **Supervaluationism:** This is a semantic thesis about truth conditions. It claims truth is relativized to "precisifications." The metaphysical commitment is that the world itself doesn't determine the truth value of borderline cases.
  *   **Degree Theory:** This is a logical/semantic thesis. It claims the semantic value of a sentence is a real number $[0,1]$.

  **The Real Trilemma:**
  A more accurate map of the disagreement is that each party is choosing which of the following three constraints to drop. You can only have two:
  1.  **Classical Logic:** (Law of Excluded Middle, Modus Ponens, etc.)
  2.  **Semantic Intuition:** (No sharp boundaries, truth doesn't jump from 1 to 0 instantly.)
  3.  **Standard Truth Values:** (Truth is binary, True/False, not degrees or gaps.)

  *   **Epistemicist:** Keeps 1 & 3. Drops 2. (Logic and Binary Truth are sacred; Intuition is wrong.)
  *   **Supervaluationist:** Keeps 1 & 2 (mostly). Drops 3. (Logic and Intuition are sacred; Bivalence is wrong.)
  *   **Degree Theorist:** Keeps 2 & 3 (sort of). Drops 1. (Intuition and Continuity are sacred; Classical Logic is wrong.)

  Your group is stuck because everyone is guarding a different sacred cow. The Epistemicist guards Logic; the Supervaluationist guards the "no fact of the matter" intuition; the Degree Theorist guards the "smoothness" intuition.

  ### 3. The Higher-Order Vagueness Wrinkle
  **Your Question:** *Does the recursion (is there a sharp cut-off for the cut-off?) discriminate between them?*

  **Diagnosis:** Yes. This is the strongest stress test for these theories, and it does not treat them equally.

  *   **Epistemicism:** Actually handles this the best, internally. If there is a sharp line between Heap and Not-Heap, there is also a sharp line between "Definitely Heap" and "Borderline." It's sharp boundaries all the way up. It is consistent, even if it feels absurd. The cost is accepting an infinite hierarchy of unknowable sharp boundaries.
  *   **Supervaluationism:** Struggles significantly here. If "admissible precisification" is itself a vague notion, the theory threatens to collapse. To solve this, Supervaluationists often have to iterate the theory (super-duper validity), which gets mathematically messy and risks reintroducing the sharp boundaries they tried to avoid.
  *   **Degree Theory:** Handles this most naturally. A smooth curve doesn't have a "sharp point" where the slope becomes vague. However, it pays for this by making the logic very complex (e.g., defining validity when truth is a matter of degree is non-trivial).

  **The Discriminator:** Higher-order vagueness doesn't prove anyone right, but it reveals that **Epistemicism is the most logically robust, while Supervaluationism is the most fragile.** If your group member likes formal consistency above all, Epistemicism wins. If they like linguistic phenomenology, Degree Theory wins.

  ### 4. Why "Just Words" Doesn't Dissolve It
  You mentioned your rationalist instinct is to say "ah, just a dispute about words." Here is why that fails in this specific domain:

  In most verbal disputes (e.g., "Is a hotdog a sandwich?"), the underlying territory is clear, and we are just arguing about which bucket to put it in. In vagueness, **the bucket boundaries are the territory.**

  If you are an AI safety researcher, you need to know if your classifier should output a binary `TRUE/FALSE` (Epistemic/Supervaluation) or a probability `0.85` (Degree). If you choose binary, you introduce the risk of a "cliff edge" where changing one pixel flips the classification from "Safe" to "Unsafe." If you choose degrees, you have to decide at what threshold action is taken, which reintroduces the Sorites paradox at the decision level.

  The dispute is about **how to model cognitive categorization.** It is an empirical question about how human brains (and ideal reasoners) process fuzzy concepts. Treating it as purely semantic ignores that semantics is supposed to track cognitive utility.

  ### 5. What Counts as Progress?
  Since you won't get a verdict on "who is right," here is what concrete progress looks like for your reading group. You need to shift from **Truth-Seeking** to **Cost-Benefit Analysis.**

  **A. Formal Results (The "Steel Man" Check)**
  Ask each member to write down the specific inference rule they are willing to sacrifice.
  *   Ask the Degree Theorist: "Do you accept Modus Ponens? If not, how do you prevent reasoning from collapsing?"
  *   Ask the Epistemicist: "Can you explain *why* we are ignorant of the boundary without appealing to magic?" (Look for Williamson's "margin for error" principles).
  *   Ask the Supervaluationist: "How do you handle 'It is definitely borderline' without contradiction?"

  Progress is made when they admit the specific logical tax they are paying.

  **B. Pragmatic Shift (The "Use" Case)**
  Stop asking "What is a heap?" and start asking "What is this theory *for*?"
  *   **Epistemicism** is useful for legal theory and computer code (we need binary decisions eventually).
  *   **Degree Theory** is useful for machine learning and control systems (thermostats don't turn off at exactly 70.0 degrees).
  *   **Supervaluationism** is useful for preserving classical logic in philosophical argumentation without accepting magic boundaries.

  If you frame it as "Which tool fits this specific job?", the heat dissipates.

  **C. The "Psychological" Turn**
  Acknowledge that none of these might be "true" in a Platonic sense. They are models of human cognition.
  *   Progress = Citing empirical psychology. Do humans perceive categories as fuzzy (Degree) or do we snap to prototypes (Epistemic/Conceptual Atomism)?
  *   If psychology shows we treat boundaries as sharp in decision-making but fuzzy in description, that validates a hybrid view.

  ### Summary Recommendation for the Group
  Tell your group this: **You are not arguing about the sand. You are arguing about which logic gate to use in your brain.**

  1.  **Acknowledge the Trilemma:** You cannot have Classical Logic + Binary Truth + No Sharp Boundaries. Pick two.
  2.  **Assign Costs:** The Epistemicist pays in Intuition. The Supervaluationist pays in Complexity/Coherence. The Degree Theorist pays in Logical Power.
  3.  **Change the Goal:** Stop trying to prove the other wrong. Start asking: "In what context is your theory the most useful instrument?"

  If they can agree that Epistemicism is the best theory for *law*, Degree Theory is the best for *perception*, and Supervaluationism is the best for *preserving classical philosophical argumentation*, you have dissolved the disagreement not by showing it was verbal, but by showing it was **context-dependent.** That is the only progress available here.
