answer: |-
  This is a sharp observation. You have identified a specific methodological tension that sits right at the fault line between instrumentalism and realism. While philosophers of science (particularly in economics) have carved around this territory, there is no single, universally accepted term that captures the *entire* move you described—specifically the post-hoc status flip.

  Here is the breakdown of the existing landscape, a proposed coinage for the specific phenomenon you're tracking, and an answer to whether the prediction and explanation halves are one problem or two.

  ### 1. Does it have a name?

  There is no single word, but there are three adjacent concepts in the philosophy of science that map to parts of your description. None of them quite capture the *shifting status* you identified.

  *   **Friedman's Instrumentalism (1953):** As you noted, this is the "predictions matter, assumptions don't" defense. But Friedman is consistent: he claims assumptions *never* need to be realistic. Your complaint is that modelers claim assumptions *do* matter for explanation, but *don't* matter for criticism. That inconsistency is not Friedman.
  *   **The Duhem-Quine Problem:** This is the idea that you cannot test a hypothesis in isolation; you test a bundle of assumptions. When a prediction fails, you can blame any part of the bundle. You correctly identified that your observation is different: Duhem-Quine is about *where* the blame goes; you are describing a change in *what kind of thing* the assumption is considered to be (fiction vs. fact).
  *   **Cartwright's "Galilean Idealization" (1983):** Nancy Cartwright argues that models describe "nomological machines" that only work in sheltered environments. She critiques the move where a model's internal logic is treated as a causal capacity in the wild. This is close to your "explanation half," but doesn't capture the rhetorical flip.

  **The Coinage: Ontological Shuttling**

  Since no existing term captures the post-hoc status flip, I propose calling this **Ontological Shuttling**.

  **Definition:** *Ontological Shuttling* occurs when a modeler treats a specific assumption as **ontologically thin** (a mere computational device/fiction) when defending the model's predictive success, but treats the same assumption as **ontologically thick** (a causal mechanism/substantive claim) when explaining the model's results or when isolating the cause of a predictive failure.

  **Why this fits your constraints:**
  *   **Distinct from (a) Plain Simplifying Assumptions:** A plain simplifying assumption remains "thin" throughout. (e.g., "We assume a sphere to calculate volume, but we know the earth is lumpy." If the volume is wrong, we don't say "The sphericity was a false theory of earth shape," we say "The simplification was too coarse.")
  *   **Distinct from (b) Friedman-style Defense:** Friedman is static instrumentalism. Ontological Shuttling is dynamic; it switches between instrumentalism and realism depending on whether the model is being praised or critiqued.
  *   **Distinct from (c) Wrong Model:** A wrong model is just false. Ontological Shuttling is a rhetorical and methodological maneuver that protects the modeling *framework* by sacrificing the specific assumption only when forced, while still using it to claim explanatory depth.

  ### 2. Are the Prediction Half and Explanation Half One Phenomenon or Two?

  They are **logically distinct**, but they are **pragmatically coupled** by Ontological Shuttling. You suspected they might come apart; you are right to suspect it, but in practice, they reinforce each other.

  **The Explanation Half: "Fictive Mechanism"**
  This is the claim that a known falsehood drives the causal story.
  *   *Status:* This is a category error. If an assumption is false (e.g., "agents have perfect information"), it cannot be the *cause* of a real-world effect. It can be a *proxy* for a cause, but if the model narrative says "The market cleared *because* agents had perfect information," that is a **Fictive Mechanism**.
  *   *Can it stand alone?* Yes. You can have a model with a Fictive Mechanism that predicts poorly. (e.g., Phlogiston theory explained combustion causally but failed prediction).

  **The Prediction Half: "Epistemic Opportunism"**
  This is the post-hoc status flip (the Shuttle).
  *   *Status:* This is a protection racket. It prevents the model from being falsified in a way that damages the broader paradigm.
  *   *Can it stand alone?* Yes. You can have a "Black Box" model that predicts well with no explanatory story. In that case, the assumptions remain "thin" (computational) and no shuttle is needed.

  **The Coupling:**
  The problem arises when you want **the prestige of explanation without the risk of realism.**
  *   If you claim **Realism** (the assumption is true), you get explanatory credit, but you risk falsification.
  *   If you claim **Instrumentalism** (the assumption is a tool), you avoid falsification, but you lose explanatory depth (you're just curve-fitting).
  *   **Ontological Shuttling** allows the modeler to claim explanatory depth (using the assumption as a mechanism) *until* the data threatens the model, at which point they retreat to Instrumentalism (it was just a simplification).

  So, while they are two distinct logical moves, they function as a single **strategic unit** in professional modeling.

  ### 3. Why Physics Feels Different (The "Effective Theory" Defense)

  You noted physics seems to handle this better. It does, because physics generally adheres to **Effective Field Theory (EFT)** protocols, whereas economics/climate often adhere to **Structuralist** protocols.

  *   **Physics (EFT):** When a physicist assumes a frictionless plane or an ideal gas, they explicitly define the **domain of validity** and the **error term**.
      *   *The Move:* "We assume friction is zero. We know it isn't. We calculate the deviation ($\Delta$). If $\Delta$ is small relative to signal $S$, the assumption is valid *for this scale*."
      *   *The Status:* The assumption is never claimed to be true. It is claimed to be **negligible**. If the prediction fails, they don't say "The assumption was a false claim about the world"; they say "The perturbation term was larger than the tolerance." The assumption remains "thin" (computational) throughout. They do not say "The ball moved *because* friction was zero." They say "The ball moved *approximately as if* friction were zero."

  *   **Economics/Climate (Structuralist):** These fields often seek **structural parameters** that are invariant across regimes.
      *   *The Move:* "We assume rational expectations. This allows us to solve for $\beta$."
      *   *The Explanation:* "The policy failed *because* agents had rational expectations." (Here the assumption becomes "thick"/causal).
      *   *The Failure:* "The policy worked, but our model failed." -> "Well, the rational expectations assumption was too strong." (Here the assumption becomes "thin"/simplification).

  The physics defense works because it quantifies the *lie*. The economic/climate defense often fails because it treats the *lie* as the *signal*.

  ### 4. Summary Carving

  To separate this from the noise of standard modeling, use this taxonomy:

  1.  **Negligibility Assumption (Physics-style):** "X is false, but the error introduced is quantified and small." (Status: Stable/Thin).
  2.  **Heuristic Assumption (Friedman-style):** "X is false, and we don't care, because we only judge by output Y." (Status: Stable/Thin, no explanatory claim).
  3.  **Fictive Mechanism (Your Explanation Half):** "X is false, but X is the causal story for why Y happened." (Status: Thick, logically problematic).
  4.  **Ontological Shuttling (Your Full Phenomenon):** "X is the causal story (Thick) when we win, but X is just a heuristic (Thin) when we lose." (Status: Unstable/Opportunistic).

  **Verdict:** You have identified a genuine methodological vice. It doesn't have a standard name, but **Ontological Shuttling** captures the specific motion of shifting the assumption's reality-status to suit the outcome. It is distinct from Friedman because it claims explanatory power; it is distinct from standard simplification because it refuses to quantify the error; and it is distinct from Duhem-Quine because it changes the *nature* of the assumption, not just the blame assignment.

  The two halves (prediction flip and explanatory fiction) are distinct logical errors, but they are functionally one **strategic maneuver** to maximize credit and minimize risk.
