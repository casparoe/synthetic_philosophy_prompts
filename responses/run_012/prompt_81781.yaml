      *   *The Specific Error:* Confusing **Newcomb-like problems** (where correlation exists) with **Causal decision theory** contexts, or rather, assuming that human prediction creates the *same kind of fixed point* that code simulation does. In the code model, if I change my code, your output *must* change because your code reads mine. In the human model, if I change my mind, your prediction might just be wrong; your action isn't logically bound to my current mental state unless you can read my mind *instantaneously* and act on it.

