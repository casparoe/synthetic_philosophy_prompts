          *   *Problem:* "Anticipate well enough" is doing massive heavy lifting. In the formal model, anticipation is *logical entailment* via source code access. In reality, anticipation is *probabilistic inference* based on behavioural cues.
          *   *The Gap:* The formal model requires the *ability to condition* on the other's output *given my own output*. This is a counterfactual dependency ($A \to B$ and $B \to A$). In the code model, this is handled by quining or fixed-point theorems. In human psychology, "I think you will do X" does not causally influence "You will do X" in the same way reading a variable does.
