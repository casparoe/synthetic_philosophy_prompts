          *   *Load-bearing assumption:* The agents have *perfect* read-access to the decision procedure *and* the computational capacity to simulate it without paradox or infinite regress.
          *   *User's Wish:* Keep these. I should try to preserve the validity of the formal model itself.

      *   **Move (3):** "Therefore any two agents who can anticipate each other's choices well enough to condition on them can secure any outcome they both prefer..."
