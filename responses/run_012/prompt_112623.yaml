answer: |-
  **Essay Question**

  To claim the adoption of agriculture was a "mistake" requires defining both the metric of well-being and the agent making the error. Analyze this claim by: (1) distinguishing between the two distinct pathways to "affluence" and how shifting between them alters the verdict; and (2) explaining why the capacity to store food is necessary but not sufficient for the emergence of entrenched hierarchy. Conclude by stating whether the "mistake" is a judgment on a decision never made or a trajectory evaluated retrospectively.

  ***

  **Model Answer**

  The verdict that agriculture was a "mistake" collapses if we do not first specify what agriculture failed to achieve. The standard critique relies on a specific definition of affluence that is often treated as empirical fact rather than a normative choice. There are two roads to being affluent. The first is the Galbraithian road: producing more than one needs. The second is the Zen road: needing less than one produces. The pop-science narrative assumes affluence is purely material—calories per hour of labor—and concludes foragers were wealthier because they worked less. However, if affluence is defined as the satisfaction of wants, the forager's advantage relies on the active limitation of desire. They are affluent because they do not want grain stores, permanent houses, or surplus wealth.

  Once this distinction is made, the "mistake" verdict shifts. If the goal of a society is to maximize carrying capacity and surplus, agriculture is not a mistake; it is a triumph. It succeeds brilliantly at the Galbraithian road. It only becomes a "mistake" if we privilege the Zen road—valuing leisure and autonomy over population density and material accumulation. Therefore, the debate is not about whether farming made people healthier (often it did not) but about whether we value the *type* of wealth farming produces. An answer that calls it a mistake without acknowledging that farming succeeded at its own implicit goals (surplus generation) fails to grasp that "affluence" is a dual-concept. The evidence required to settle this is not just skeletal remains or work-hour estimates, but an anthropological account of what people in each system actually valued and whether those values were met.

  Secondly, the term "mistake" implies a subject capable of error. This presumes a decision was made. Historical and archaeological evidence suggests no such moment occurred. Agriculture emerged through thousands of micro-decisions over generations, often reversible, with groups moving in and out of cultivation. There was no council that voted to adopt farming. Consequently, calling it a mistake is a retrospective judgment on a trajectory, not a critique of a choice. The subject of the verdict is not the ancestors who "chose poorly," but the descendant systems that locked into a path dependency. If we treat it as a decision, we misunderstand the mechanism of change. If we treat it as a trajectory, the "mistake" is that the system became self-reinforcing (a ratchet), removing the option to return to the Zen road of affluence even if individuals within it suffered.

  Finally, the link between farming and hierarchy is often treated as automatic, but it is contingent. The standard story is that storable food allows accumulation, which allows theft, which requires defense, which creates rulers. Storage is indeed a necessary condition for this; you cannot tax what rots in a day. However, storage is not sufficient. Many storing societies remained egalitarian for centuries. For hierarchy to emerge from storage, there must be a mechanism to convert economic surplus into social power. This requires additional variables: population pressure that makes exit impossible, ideological frameworks that justify unequal distribution, or organized violence to protect the larder. Without these, storage remains a communal buffer rather than a private asset.

  This means the verdict on "mistake" and the verdict on "inequality" can come apart. One could argue agriculture was a biological mistake (worse health) but a social success (complex culture), or that it caused inequality without necessarily causing misery for all. To conflate them is to miss the nuance of the transition. The "mistake" is not that farming created kings, but that it created a system where the cost of exiting the hierarchy became too high. Thus, the verdict holds only if we value the autonomy of the forager over the capacity of the state, and if we recognize the "error" lies in the lock-in of the system, not the intent of the people.

  ***

  **Marking Scheme**

  **Total: 20 Marks** (5 Criteria x 4 Marks each)

  **1. Distinction of Affluence (4 marks)**
  *   **Must Hit:** Explicitly distinguishes between affluence as "high production" vs. "limited desire."
  *   **Typical Error (0-2 marks):** Treats affluence as a single, objective metric (e.g., only calories or only work hours) without noting the definitional split.

  **2. Baseline Dependency (4 marks)**
  *   **Must Hit:** Explains that the "mistake" verdict changes depending on which definition of affluence is prioritized (farming succeeds at surplus, fails at leisure).
  *   **Typical Error (0-2 marks):** Asserts foragers were objectively "better off" without acknowledging that farming achieved different goals successfully.

  **3. Agency and Subject (4 marks)**
  *   **Must Hit:** Identifies that no singular decision was made; frames the "mistake" as a retrospective judgment on a trajectory/process rather than a choice.
  *   **Typical Error (0-2 marks):** Anthropomorphizes "society" as making a conscious choice to adopt farming, or ignores the agency problem entirely.

  **4. Contingency of Hierarchy (4 marks)**
  *   **Must Hit:** Argues that storage is *necessary* but *not sufficient* for hierarchy; identifies at least one additional factor required (e.g., defense, ideology, exit costs).
  *   **Typical Error (0-2 marks):** Claims storage automatically leads to inequality/hierarchy (technological determinism).

  **5. Decoupling Verdicts (4 marks)**
  *   **Must Hit:** Demonstrates that the "health/leisure" verdict and the "inequality" verdict are independent variables (one can be true while the other is false).
  *   **Typical Error (0-2 marks):** Conflates health/leisure with hierarchy, assuming they always rise and fall together as a single package of "civilization."

  ***

  **Confidence Check**

  **Overall Confidence:** High. The model answer adheres strictly to the conceptual constraints (no names/dates) while hitting all three pedagogical goals (affluence definitions, agency/subject, storage contingency). It models the specific analytical moves required for an A grade.

  **Least Certain Claim:** In the fourth paragraph, the claim that *"Many storing societies remained egalitarian for centuries"* is the most empirically vulnerable point if a student challenges the archaeological consensus on specific Neolithic sites. While theoretically sound (storage doesn't *guarantee* hierarchy), the archaeological record for "storing but egalitarian" is sometimes debated depending on how "egalitarian" is read from material culture. However, for the purpose of a theoretical seminar exam, the logical point stands even if the empirical examples are contested.
