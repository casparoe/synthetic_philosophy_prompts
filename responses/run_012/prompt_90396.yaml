answer: |-
  Honestly, the sofa's a red herring because that's about physical safety, not fidelity. If you drop the sofa, you injure me; if you bail on the shop, you violate a right I have against you. That's the bit you're missing. It's not about whether I'm upset—I could be perfectly chuffed to go alone—but it's about standing. When we agreed, you handed me a say in your doing it. You can't just take it back because the commitment isn't yours alone anymore; it's ours.

  So when you apologise, you're not saying 'sorry I hurt your feelings', you're saying 'sorry I disregarded your standing to hold me to this'. If it were just expectations, I'd have no right to complain, just a reason to be disappointed. But I do have the right to complain, which proves there's something more than two separate psychologies going on.

  ***

  Distinguishing expectations from obligations is standard in collective intentionality literature. Claiming the obligation is strictly non-dissolvable unilaterally, regardless of context, is more contentious and debated against reductionist accounts.
