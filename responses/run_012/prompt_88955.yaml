      *   *Q5 (Mandated Sharing - Verification):* If we mandate sharing, how do we know they shared the *real* safety tech and not the decoy?
      *   *Q6 (Geopolitics):* The "rival" isn't always another US lab. It's a state actor. Does mandated sharing work across borders?
      *   *Q7 (Incentives):* If safety is non-excludable, why would anyone innovate on it even with mandates? Free-rider problem on the *innovation* side.
      *   *Q8 (The "Box In" Question):* *Requirement:* Use his framing against him.
          *   *Idea:* He says safety is a public good. Public goods usually require state provision or subsidy. But he argues against slowing down (market speed). If the market under-provides, and the state mandates sharing, does the state also need to fund the R&D? If not, who pays?
          *   *Better Idea:* He argues the competitiveness constraint is contingent. But if he admits it *is* currently binding (even if not axiomatic), doesn't that justify unilateral caution until the mandate exists?
          *   *Best Idea:* Focus on the "non-excludable" claim. If safety is truly non-excludable, then once one lab solves it, everyone has it. But if everyone has it, the competitive advantage comes from *capability*. Therefore, the pressure to cut safety costs to gain capability edges *increases*, not decreases.

  4.  **Refining and Polishing (Checking Constraints):**

      *   *Check:* 8-10 questions?
