prompt: |-
  So I run a small podcast about AI safety/governance and next week's guest is a researcher who's been pushing back on the usual "competitiveness constraint" story — you know the one: even a lab that genuinely cares about safety can't slow down unilaterally, because a rival will just race ahead and capture the upside, so safety measures that cost you any capability ("the alignment tax") are competitively suicidal. His line is that this gets smuggled in as an axiom when it's really a contingent empirical claim, and that the alignment tax it leans on is mostly an artifact of measurement — you compare a safety-trained model against a baseline nobody would actually ship, on benchmarks that over-weight a handful of narrow refusals. He also likes to say safety is a public good, non-rival and basically non-excludable, so competitive markets under-provide it and the fix is mandated sharing rather than anyone hitting the brakes.

  Can you draft 8–10 questions that actually press on this instead of letting him rehash the abstract? I want at least one that forces him to say what evidence would falsify the "the tax is just an artifact" claim, at least one on whether the public-goods framing survives when the relevant safety know-how is tacit and stuck in researchers' heads rather than being a cleanly publishable technique, and at least one on the obvious objection that a small tax today tells us nothing about the tax at the capability frontier. For each of those three, add the follow-up keyed to the answer he's most likely to give. And make the final question one where his own framing boxes him in. Skip the warm-up stuff like how he got into this, and I probaly don't need anything on his personal history at all.
