      *   *Claim:* Safety is a public good. *Weakness:* Is safety *knowledge* a public good, or is *implementation* the bottleneck? Tacit knowledge (know-how) isn't easily shared.
      *   *Claim:* Mandated sharing is the fix. *Weakness:* Who mandates? How do you verify? Does this create a single point of failure or encourage hiding?
      *   *Claim:* Competitiveness constraint is contingent, not axiom. *Weakness:* Even if contingent, isn't it currently binding? What about geopolitical rivals (China vs. US)?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Setting the stage/Competitiveness):* Need to challenge the "competitiveness constraint" immediately.
      *   *Q2 (Alignment Tax - Falsification):* *Requirement:* Evidence to falsify "tax is artifact."
