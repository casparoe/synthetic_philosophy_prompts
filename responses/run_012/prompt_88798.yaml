answer: |-
  This is a sophisticated position, often lurking in the background of work by people like Hartry Field (though he leans paracomplete) or certain readings of Kripke. It attempts to save the world from inconsistency by quarantining the glut to the semantic layer. It's a stable niche, but it is precarious.

  Here are the defeaters, ranked from fatal to annoying, followed by answers to your specific uncertainties.

  ### The Defeaters

  #### 1. Fatal: The Truthmaker Bleed
  This is the strongest metaphysical objection. It relies on the principle of truthmaking: for a sentence to be true, there must be something in the world (a truthmaker) that makes it true.
  *   **The Argument:** If the Liar sentence ($L$) is true (even if also false), there must be a truthmaker for $L$. $L$ says of itself that it is false. So, for $L$ to be true, it must be the case that $L$ is false. For $L$ to be false, there must be a truthmaker for its falsity (or a falsity-maker).
  *   **The Problem:** If truth and falsity supervene on the world, then the semantic contradiction must be grounded in an ontological state of affairs. If the sentence is *really* true-and-false, the world must contain the grounds for both. If you say the grounds are "just linguistic," you push the problem back: linguistic objects (inscriptions, sounds, neural states) are physical objects. If an inscription instantiates the property *True* and *False*, and those properties are grounded in physical configurations, then the physical configuration must support contradictory properties.
  *   **Concession:** A defender must concede that truthmaking does not apply to semantic predicates in the same way it applies to empirical predicates. They must argue truth is *disquotational* or *deflationary* enough that it doesn't require robust worldly truthmakers. If they commit to a robust correspondence theory of truth, this view collapses.

  #### 2. Fatal: The Vagueness Dilemma (The Bald Man)
  You asked specifically about this. It is a make-or-break issue for "semantic-only" dialetheism.
  *   **The Argument:** Standard dialetheists (like Priest) argue that Sorites paradoxes are resolved by accepting gluts at the borderline. "This man is bald" is both true and false.
  *   **The Problem:** If you accept gluts for the Liar (semantic) but reject them for the Sorites (ontic/semantic hybrid), you need a principled distinction.
      *   *Option A:* You reject gluts for vagueness (epistemicism or supervaluationism). But then why accept them for the Liar? Usually, the motivation for paraconsistency is uniformity of logic. If your logic tolerates gluts for truth, it should tolerate them for baldness.
      *   *Option B:* You accept gluts for vagueness. But is "baldness" in the world or the word? If the man's hair distribution is precise, the glut is in the word (semantic). If the hair distribution is itself vague (ontic vagueness), the glut is in the world.
  *   **The Defeat:** If you admit *any* vague predicates generate gluts, and those predicates describe physical objects, the "semantic-only" quarantine is breached. A man who is both bald and not bald is an object instantiating $F$ and $\neg F$. To maintain your view, you must argue that *all* vagueness is linguistic ignorance (epistemicism) or semantic indeterminacy, never ontological.
  *   **Concession:** A defender must concede that there is no ontic vagueness. The world is crisp; only our descriptions are glutty.

  #### 3. Serious: The Ad Hoc Charge (The "Why Here?" Problem)
  *   **The Argument:** Why does the contradiction arise *only* with the truth predicate and self-reference? If the logic of the universe is paraconsistent (allowing $A \land \neg A$), why is nature so studiously classical everywhere else?
  *   **The Problem:** It looks like you are keeping classical logic for the world because you *like* it there, and using paraconsistent logic for language because you *have* to. This looks like a patch, not a theory. A "honest dialetheist" (like Priest) argues that if contradictions are possible, we should expect them in change, motion, and quantum states. By restricting them to the Liar, you seem to be retreating to consistency as a default without justification.
  *   **Concession:** A defender must argue that the Truth Predicate is *sui generis*. It is the only predicate that essentially involves self-reference and normative closure. They must argue that the Liar is a unique structural feature of representational systems, not a feature of reality. This is defensible but requires a robust philosophy of language that separates semantics from metaphysics sharply.

  #### 4. Annoying: Expressive Inability (The Revenge of the Meta-Language)
  *   **The Argument:** Can you state your theory without contradiction? To say "Only semantic sentences can be contradictory," you need a meta-language. Is the meta-language consistent?
  *   **The Problem:** If the meta-language is consistent, how does it talk about the inconsistent object language without inheriting the inconsistency? If you say "Sentence $S$ is true-and-false," does *that* sentence (in your theory) become true-and-false? If your theory is true, is it also false?
  *   **Concession:** Defenders usually concede that the meta-language must be stronger than the object language (Tarskian hierarchy) or that the theory itself is "inconsistent but non-trivial." They often have to accept that their own philosophical statement of the view might be a glut.

  ---

  ### Addressing Your Uncertainties

  #### 1. Does it survive vagueness (the Bald Man)?
  **Only if you deny ontic vagueness.**
  If you believe the *world* is vague (that there is no fact of the matter about the hair follicles themselves), then the contradiction is in the world, and your view fails.
  To survive, you must adopt a view where the hair follicles are precise, but the predicate "bald" is overdetermined by social/linguistic norms such that it applies and fails to apply simultaneously. This saves the "semantic-only" claim, but it commits you to a very specific (and some say implausible) view of vagueness. If you concede that vagueness generates gluts, you are likely forced into ontological dialetheism.

  #### 2. Is the restriction ad hoc?
  **It is vulnerable to this, but not necessarily guilty.**
  A defender argues it is not ad hoc because the Liar arises from *normative closure* (a language containing its own truth norm). Physical objects do not contain their own truth norms. Therefore, the structural conditions for generating a glut only exist in semantic systems.
  *   **What a defender concedes:** They concede that if we find a non-semantic instance of true contradiction (e.g., a quantum superposition interpreted as $F \land \neg F$, or a legal contradiction where two valid laws command $A$ and $\neg A$), the "semantic-only" restriction must be dropped. The view stands or falls on the claim that *only* semantic systems can be self-referential in the relevant way.

  #### 3. Falsifiability: Bug or Feature?
  **It makes the view unfalsifiable, and that is a problem.**
  If every time we encounter a potential worldly contradiction (Quantum mechanics? Dialetheic motion?), you can say "That's just a description, the world is consistent," then the claim "The world is consistent" does no work. It becomes a tautology: "All worldly contradictions are actually semantic."
  *   **The Risk:** This renders the ontological consistency claim empty. If you cannot specify what evidence would convince you that the *world* is inconsistent, then you aren't making a metaphysical claim; you're just defining "world" as "the consistent part of reality."
  *   **The Point:** A defender might argue this is the point. They are making a conceptual distinction, not an empirical prediction. But this weakens the philosophical payoff.

  #### 4. Is there Neutral Ground?
  **No, there is no logic-neutral ground. But there is abductive ground.**
  You asked: *"If there isn't, just say so."*
  So: **There is no neutral logical ground.**
  If you use paraconsistent logic and I use classical logic, we cannot agree on the validity of inferences involving contradictions. I see your position as trivializing truth; you see my position as exploding on the Liar. We literally invalidate each other's moves.

  **However,** we can argue from **Inference to the Best Explanation (Abduction).**
  We can step back from the logic itself and ask:
  1.  Which system requires fewer ad hoc restrictions? (Classical needs truth-value gaps or hierarchies; Dialetheism accepts gluts).
  2.  Which system preserves more intuitive principles? (Classical preserves Non-Contradiction; Dialetheism preserves Unrestricted Truth Schema).
  3.  Which system is more fruitful for science/math?

  You cannot prove me wrong using logic, because we disagree on the logic. You can only show me that my total package (Logic + Semantics + Metaphysics) is less elegant, less explanatory, or more costly than yours. The argument shifts from "Is this valid?" to "Is this useful/coherent?"

  ### Summary of the Defender's Concessions
  To hold "Semantic-Only Dialetheism," you must concede:
  1.  **No Ontic Vagueness:** The world is crisp; only language is glutty.
  2.  **Deflationary Truth:** Truth does not require robust worldly truthmakers that would transmit the contradiction to reality.
  3.  **Meta-Language Strength:** Your theory describing the inconsistency might itself be inconsistent, or requires a hierarchy that you cannot fully articulate within the system.
  4.  **Abductive Justification:** You cannot prove the world is consistent using logic (since your logic allows inconsistency); you can only posit it as the best metaphysical hypothesis.

  If you are willing to make those concessions, the view is tenable. If you want robust truthmaking, ontic vagueness, or a proof of worldly consistency, the view will not survive.
