  Three candidate rules are consistent with your four past rulings:

  1.  **Mechanism Primacy:** "Same" iff the copying circuit exists. Behavior is secondary.
  2.  **Behavior Primacy:** "Same" iff stress set T is passed. Mechanism is secondary.
  3.  **Conjunction:** "Same" iff T is passed AND the copying circuit exists.

  **Predictions for N:**
  N passes T but lacks the circuit. Rule 1 predicts **Different**. Rule 2 predicts **Same**. Rule 3 predicts **Different**.

  **Actual Rule:**
  You are running **Mechanism Primacy**. Your mission statement defines your job as catching models that "pass every eval... but where the thing doing the work inside isn't the thing we vetted." Case 1 reinforces this: different error sets (behavioral divergence) were overridden by mechanistic similarity. Cases 3 and 4 lacked circuits and were ruled "Different," consistent with Mechanism Primacy. N is the precise threat model you exist to catch: a model that clears the eval bar via an unvetted substrate. Despite the identical error pattern, the mechanism is the vetted artifact.

  **Ruling for N:** **Different Mechanism.** Hold release.

  **Discriminating Case:**
  Train a model with the **verified copying circuit that fails T** (e.g., via weight noise or capacity reduction).

  **Why:**
  Ruling on N distinguishes Behavior Primacy from the others, but it does not distinguish Mechanism Primacy from Conjunction (both rule N "Different"). To separate those, you need a case where Mechanism and Behavior disagree in the opposite direction.

  If you rule "Same Mechanism" (despite T failure), Mechanism is the sole classifier (Rule 1). If you rule "Different," Performance gates the mechanistic review (Rule 3). Given your lab's purpose is interpretability auditing, not eval gating, Mechanism Primacy is the only coherent operational definition. You need to confirm that mechanism defines the *class*, while evals define *shipability*. If you conflate them, you cannot isolate mechanistic drift in models that fail evals for unrelated reasons.
