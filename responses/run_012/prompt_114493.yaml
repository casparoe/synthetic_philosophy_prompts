answer: |-
  # The Akrasia Sorter: A Decision Tree for Weakness of Will

  **Instructions:** Start at the top. Answer based on your intuition about the *case described*, not the theory you prefer. If a question feels like it splits hairs, follow the hair-split.

  ---

  ### **NODE 1: The 2am Belief (The Socratic Fork)**
  **Case:** You are watching Netflix. It is 2am. You have work at 8am. You think, "I should sleep." Yet you click "Next Episode."
  **Question:** At the exact moment you clicked, did you *sincerely judge* that sleeping was the better option *right then*?
  *   **NO:** You thought, "Actually, one more episode is better than sleep right now."
      *   → Go to **NODE 2**.
  *   **YES:** You thought, "Sleep is better," but clicked anyway.
      *   → Go to **NODE 3**.

  ### **NODE 2: The Morning After (The Intemperance Fork)**
  **Case:** You clicked "Next Episode" because you decided it was better *at that moment*.
  **Question:** When you wake up exhausted, do you feel you made a *mistake*, or do you stand by the choice (even if it hurt)?
  *   **STAND BY IT:** "It was worth it. I needed the decompression."
      *   → **LEAF A: Rational Preference Revision** (See Notes).
  *   **FEEL MISTAKE:** "I messed up. I shouldn't have valued that over sleep."
      *   → Go to **NODE 4**.

  ### **NODE 3: The Clear-Eyed Gap (The Realist Fork)**
  **Case:** You clicked "Next Episode" while judging sleep was better.
  **Question:** Afterward, do you feel *regret/shame* (you failed yourself), or *indifference* (you just couldn't help it)?
  *   **INDIFFERENCE:** "I'm just weak. It happens." (No moral sting).
      *   → Go to **NODE 7**.
  *   **REGRET/SHAME:** "I betrayed my own judgment."
      *   → Go to **NODE 5**.

  ### **NODE 4: The Sober Reason (The Rationalization Fork)**
  **Case:** You decided the episode was better at 2am, but now regret that valuation.
  **Question:** Can you articulate a reason for watching that makes sense to you *now* (sober), or does the reason vanish in the morning light?
  *   **REASON VANISHES:** "I have no idea why I thought that was a good idea."
      *   → Go to **NODE 8**.
  *   **REASON HOLDS:** "I was stressed. The relief was worth the cost, even if I regret the cost."
      *   → **LEAF B: Davidsonian Conditional Judgment** (See Notes).

  ### **NODE 5: The Story You Told (The Self-Deception Fork)**
  **Case:** You acted against your better judgment and regret it.
  **Question:** Did you tell yourself a story to make it okay *in the moment* (e.g., "I work hard, I deserve this"), or was it a brute impulse?
  *   **BRUTE IMPULSE:** "No story. I just wanted it."
      *   → Go to **NODE 6**.
  *   **STORY TOLD:** "I convinced myself I deserved it."
      *   → **LEAF C: Aristotelian Akrasia** (See Notes).

  ### **NODE 6: The Battery Check (The Resource Fork)**
  **Case:** Brute impulse against judgment.
  **Question:** Does this failure feel like a *resource* ran out (you were too tired to resist), or like a *glitch* (you resisted fine yesterday)?
  *   **RESOURCE RAN OUT:** "My willpower was depleted."
      *   → **LEAF D: Ego Depletion / Willpower Resource** (See Notes).
  *   **GLITCH:** "I wasn't particularly tired. I just snapped."
      *   → Go to **NODE 9**.

  ### **NODE 7: The Cigarette for a Friend (The Motivation Fork)**
  **Case:** You quit smoking. You buy a pack "for a friend" but smoke one immediately.
  **Question:** Did you *intend* to smoke it when you bought it, or did the intention form only when you held the pack?
  *   **INTENDED AT PURCHASE:** You bought it knowing you'd smoke it.
      *   → **LEAF E: Socratic Ignorance** (You never truly judged quitting best).
  *   **INTENDED AT PACK:** You thought you'd give it away until the craving hit.
      *   → Go to **NODE 3**.

  ### **NODE 8: The Value Shift (The Discounting Fork)**
  **Case:** The reason for acting vanished by morning.
  **Question:** Did the value of the episode *change* because it was *now* (hyperbolic), or did you simply ignore the value of sleep?
  *   **VALUE CHANGED:** "It was just so much more tempting *in the moment*."
      *   → Go to **NODE 10**.
  *   **IGNORED VALUE:** "I knew the value, I just didn't act on it."
      *   → Go to **NODE 9**.

  ### **NODE 9: The Odysseus Test (The Selves Fork)**
  **Case:** You act against judgment without a clear reason or resource loss.
  **Question:** Is it rational for your 8am self to *tie up* your 2am self (e.g., block the website)?
  *   **YES:** "My future self is a different agent I need to constrain."
      *   → **LEAF F: Two-Selves / Intrapersonal Bargaining** (See Notes).
  *   **NO:** "It's the same me. I should just try harder."
      *   → **LEAF G: The "Nobody's Here" Position** (See Notes).

  ### **NODE 10: The Diet Monday (The Continuity Fork)**
  **Case:** The value changes in the moment (Hyperbolic).
  **Question:** Is "Diet starts Monday" a rational planning strategy, or a predictable failure of the current self?
  *   **RATIONAL STRATEGY:** "It's a way to reset the discount curve."
      *   → **LEAF H: Hyperbolic Discounting (Deflationary)** (See Notes).
  *   **PREDICTABLE FAILURE:** "It's just lying to myself."
      *   → **LEAF B: Davidsonian Conditional Judgment** (See Notes).

  ---

  ## **LEAF DESCRIPTIONS & FACILITATOR NOTES**

  **LEAF A: Rational Preference Revision**
  *   **Position:** You didn't suffer weakness of will; you updated your preferences.
  *   **Note:** Often aligns with revealed preference theory in Econ. If you chose it, you preferred it.

  **LEAF B: Davidsonian Conditional Judgment**
  *   **Position:** Donald Davidson. You didn't hold an unconditional "all-things-considered" judgment. You held "Sleep is best... *unless* I'm really stressed."
  *   **Note:** **Honesty Check:** This leaf also captures **Hyperbolic Discounting** for many participants. To the agent, a "conditional judgment" and a "steep discount curve" feel identical. If a participant lands here but talks about "discount rates," let them stay. The distinction is theoretical, not phenomenological.

  **LEAF C: Aristotelian Akrasia**
  *   **Position:** Aristotle. Genuine conflict. You knew the better (via story/reason) but were overcome by passion. Distinguished from *Intemperance* (Leaf A) by the presence of regret and the use of a rationalizing story.
  *   **Note:** Requires the agent to be acting for a *reason* (even a bad one), not just a cause.

  **LEAF D: Ego Depletion / Willpower Resource**
  *   **Position:** Willpower is a depletable muscle (Baumeister et al.).
  *   **Note:** **Contested Flag:** Recent replication crises in psychology have challenged this. Philosophers often treat this as a *mechanism* for akrasia rather than a definition of it.

  **LEAF E: Socratic Ignorance**
  *   **Position:** Socrates/Plato. Akrasia is impossible. If you did it, you must have believed it was best (perhaps due to ignorance of the consequences or the good).
  *   **Note:** If they arrived here via Node 7, they admit they never truly judged quitting best.

  **LEAF F: Two-Selves / Intrapersonal Bargaining**
  *   **Position:** Schelling/Ainslie. The agent is a sequence of selves. Precommitment (Odysseus) is rational because the 2am self is a hostile agent relative to the 8am self.
  *   **Note:** Distinct from Hyperbolic Discounting because it posits *conflict between agents* rather than just a mathematical curve.

  **LEAF G: The "Nobody's Here" Position**
  *   **Position:** Clear-eyed action + Regret + No Reason + No Resource Loss + No Precommitment.
  *   **Why nobody defends it:** This implies action without a cause, mechanism, or preference shift. It posits a "glitch" in rationality that isn't explained by psychology (depletion), economics (discounting), or philosophy (conditional judgment). It's magic.

  **LEAF H: Hyperbolic Discounting (Deflationary)**
  *   **Position:** Ainslie/Behavioral Econ. There is no "failure of will." There is only time-inconsistent preferences. The 2am self is acting rationally *for the 2am self*.
  *   **Note:** **Honesty Check:** If the tree feels like it forces a split between **Leaf B (Davidson)** and **Leaf H (Discounting)**, that is accurate. Davidson tries to save rationality by changing the *structure* of the judgment; Discounting saves rationality by changing the *value* over time. For the handout, acknowledge that these are often competing explanations for the same data.

  ---

  ## **SEM INAR USAGE GUIDE**

  1.  **Don't Police Terminology:** If an Econ student lands on "Aristotelian Akrasia" but describes it as "high discount rate," let it stand. Ask: "Does the *regret* matter to you?" If yes, they are closer to Aristotle than Ainslie.
  2.  **The Davidson/Discounting Blur:** Use Node 10 to highlight this. Ask the group: "Is 'Diet Monday' a strategic reset (Two-Selves/Discounting) or a lie you tell yourself to enable a conditional exception (Davidson)?"
  3.  **The "Nobody" Leaf:** Use Leaf G to discuss the Principle of Charity. We attribute reasons to agents because action without reason is unintelligible. If someone insists on Leaf G, ask them to describe the *causal mechanism* of the action.
  4.  **Snooze Button Variant:** If the group gets stuck on Netflix, swap in the Snooze case. "At 6am, is sleep *actually* better, or do you just *want* it more?" This often breaks the Socratic deadlock faster than Netflix.
