answer: |-
  **Project Title:** The Residue of Normativity: Disentangling Logical Triviality from Rational Compulsion in the Is/Ought Debate

  **Principal Investigator:** [Your Name]
  **Duration:** One Semester (Part-Time)
  **Requested Support:** Independent Study Stipend

  ### **1. Introduction and Research Question**

  The debate over whether an "ought" can be derived from an "is" is a permanent fixture of modern philosophy. It appears in introductory textbooks, advanced meta-ethics, and increasingly, in the rationalist blogosphere. The standard view holds that there is a unbridgeable gap between descriptive facts (what is the case) and normative conclusions (what ought to be the case). However, despite centuries of argumentation, the parties involved rarely agree on what exactly makes the gap unbridgeable. My research proceeds from the suspicion that this stagnation arises because the debate conflates two distinct claims: a general logical triviality and a specific normative mystery.

  The core research question is this: Is the is/ought gap merely a domain-general feature of deductive consequence, or is there a residual epistemic gap specific to normativity?

  To put it plainly, there are two ways to understand the claim that you cannot get an "ought" from an "is." The first is the **Vocabulary Reading**. This states that no conclusion committal about a specific predicate F can follow from premises wholly silent about F. This principle holds for any F whatsoever: you cannot derive conclusions about something being "red," "charged," or "alive" from premises that do not mention those properties. If the is/ought gap is just an instance of this general rule, it is not a special fact about morality or reason; it is a mundane feature of logic. The reason it strikes us as deep is simply that we care deeply about the "ought" side.

  The second is the **Compulsion Reading**. This states that no body of descriptive information can *rationally compel* a normative conclusion. On this view, an agent might accept every descriptive premise, understand them fully, commit no logical errors, and yet reject the normative conclusion without irrationality. This claim is not about vocabulary; it is about the force of reasons. It suggests that descriptive facts lack the specific authority to bind the will.

  These two readings are not equivalent. The Vocabulary Reading is a claim about logical syntax; the Compulsion Reading is a claim about rational necessity. My project aims to determine whether standard meta-ethical positions rely on an equivocation between these two readings. Furthermore, it will investigate whether there is a "residue"—a gap that remains once the general logical triviality is subtracted. If such a residue exists, I will assess which theoretical framework (non-naturalism, non-cognitivism, or quietism) can account for it at the least theoretical cost. If no such residue exists, the project will demonstrate that the historic debate is largely misplaced.

  ### **2. The Problem: Equivocation and Asymmetry**

  The primary obstacle to resolving this debate is that standard positions often shift between the Vocabulary and Compulsion readings without acknowledgment. Non-naturalists, for example, often argue that normative properties are distinct from descriptive properties (supporting the Vocabulary Reading) but then infer from this that descriptive facts cannot motivate action (supporting the Compulsion Reading). Expressivists argue that normative statements express attitudes rather than beliefs (a semantic claim) but use this to explain why logic seems to fail in normative contexts (a logical claim). By treating these distinct claims as interchangeable, philosophers talk past one another.

  My proposal must absorb two specific observations that complicate the simple Vocabulary Reading. First, consider the principle that "ought implies can." This inference runs from a normative premise (someone ought to do X) to a descriptive conclusion (someone can do X). If the is/ought gap were a symmetric barrier against mixing vocabularies, this inference should be forbidden. Yet, it is widely accepted. This suggests that the barrier, if it exists, is not merely about keeping vocabulary separate.

  Second, the claim that someone ought to do something is itself a descriptive fact about the world in many meta-ethical frameworks. If moral realism is true, then "Murder is wrong" is a fact just as "Snow is white" is a fact. If both are facts, the Vocabulary Reading collapses into a point about bookkeeping rather than normativity. It becomes a dispute over which labels we stick on which propositions, rather than a discovery about the structure of reality.

  These observations suggest that the Vocabulary Reading is too weak to capture what philosophers worry about, while the Compulsion Reading is too strong to be easily defended without additional apparatus. The project will argue that standard positions leave this tension unresolved. By disentangling them, we can see that many arguments for the is/ought gap prove far too much (blocking all specific conclusions from general premises) while others prove too little (failing to explain why normative conclusions feel different from descriptive ones).

  ### **3. Methodology: Conceptual Analysis and Formal Modeling**

  This inquiry is conceptual and formal, not empirical. It cannot be settled by moral psychology. Empirical work can tell us whether people *do* infer oughts from ises, or whether their brains light up differently when making normative judgments. It cannot tell us whether they *ought* to infer them, or whether such an inference is valid. The question concerns the structure of justification, not the mechanics of cognition. Therefore, the method will combine ordinary conceptual analysis with formal modeling.

  **Conceptual Analysis:**
  The first phase will involve rigorously defining the terms "descriptive" and "normative" without begging the question. Often, "descriptive" is defined as "non-normative," which makes the gap true by definition. I will attempt to characterize descriptive premises independently—for example, as premises concerning only natural properties or empirical states of affairs—to see if the gap holds when the definitions are fixed.

  **Formal Modeling:**
  The second phase will employ toy languages to test the logical behavior of these predicates. I will construct formal systems with a distinguished vocabulary for descriptive terms and normative terms. Within these systems, I will check which candidate principles survive as theorems and which turn out to be artifacts of how the language was set up.
  For instance, I will model a system where normative predicates are defined as functions of descriptive predicates. In such a system, the Vocabulary Gap holds trivially (you cannot derive the function output without the function input), but the Compulsion Gap may vanish (once the input is known, the output is fixed). Conversely, I will model systems where normative predicates are primitive. Here, the Compulsion Gap might hold, but only at the cost of making normative truths inaccessible to reason.

  This formal work buys precision. It forces us to see exactly where the inference breaks. Does it break because the logic forbids mixing types? Or does it break because the bridge principles required to connect them are themselves normative? The formal model will reveal whether the gap is a feature of the logic or a feature of the axioms.

  However, I must be candid about where this method risks begging the question. The choice of logic (e.g., classical vs. intuitionistic) and the rules of inference built into the toy language will predetermine some outcomes. If I build a system where normative terms are logically inert, the gap will appear. If I build a system where they are reducible, it will not. The value of the formal work is not to prove the gap exists, but to map the cost of each assumption. It will show precisely what must be added to a logical system to generate the gap, allowing us to see if those additions are justified.

  ### **4. Risks and Mitigation**

  Any project of this nature faces significant risks of collapse. I have identified three primary failure modes and plan to mitigate them as follows.

  **Risk 1: Triviality.**
  The investigation may conclude that the is/ought gap is nothing more than the general logical principle that no conclusion about F follows from premises silent about F. If this is the case, the project risks dissolving into a deflationary observation that offers no new philosophical insight.
  *Mitigation:* Even a deflationary result is valuable. It would clarify that the "mystery" of normativity is psychological, not logical. The deliverable will explicitly frame this outcome as a successful dissolution of a pseudo-problem, rather than a failure to find a solution.

  **Risk 2: Unmotivated Stipulation.**
  In trying to define "descriptive" vs. "normative," I may rely on a stipulation that rigs the result. For example, if I define descriptive premises as "those that cannot entail normative conclusions," the gap is guaranteed by fiat.
  *Mitigation:* The formal modeling phase is designed to catch this. By testing multiple definitions across different logical systems, I can show whether the gap persists across variations or disappears when the stipulation is relaxed. The proposal requires that any definition used must be independent of the inference rules being tested.

  **Risk 3: Merely Verbal Dispute.**
  The project could conclude that the debate is purely verbal—that one side means "logical validity" by "gap" and the other means "rational compulsion." While this diagnoses the confusion, it risks being dismissed as semantic nitpicking.
  *Mitigation:* To earn the right to call it a verbal dispute, I must show that resolving the terminology changes the substantive commitments of the theories involved. The paper will demonstrate how non-naturalism and expressivism look different when forced to choose one reading of the gap consistently.

  ### **5. Scope and Deliverables**

  This project is scoped for one semester of part-time work. It does not aim to solve meta-ethics, but to clarify the central tool used to debate it. The scope is limited to the structure of the inference gap, not the content of moral theory.

  **Deliverable 1: The Research Paper.**
  A rigorous academic paper (approximately 6,000–8,000 words) intended for philosophical review. This document will present the distinction between the Vocabulary and Compulsion readings, detail the formal models used to test them, and argue for the conclusion regarding the existence of a normative residue. It will be written to stand on its own arguments rather than appeals to named literature, ensuring accessibility to philosophers outside the specific sub-field.

  **Deliverable 2: The Explainer.**
  A shorter essay (approximately 1,500 words) written for the rationalist blogosphere. This piece will translate the technical findings into accessible language, explaining why the debate has been stalled and what the clarification means for rational discourse. This ensures the research benefits the community that inspired the question, bridging the gap between academic philosophy and public rationality.

  ### **6. Conclusion**

  The is/ought gap is often treated as a wall that blocks ethical reasoning from reaching factual ground. My suspicion is that it is actually a mirror, reflecting our confusion about logic, language, and reason. By separating the trivial logical constraints from the specific normative mysteries, this project aims to clear the fog. Whether the outcome is that the gap is a triviality or a profound feature of rational agency, the result will be a sharper understanding of what is actually at stake. This clarity is a prerequisite for any further progress in meta-ethics, making it a worthy investment of resources.
