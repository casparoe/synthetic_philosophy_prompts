answer: |-
  To audit this argument, we must first formalize the mapping it proposes between the musical and pictorial arts. The analogy attempts to reclassify painting from a singular object into a multiple-instance work, thereby equating the original canvas with a musical score and the replica with a performance.

  **The Explicit Correspondences**
  *   **The Work:** In music, the Symphony (an abstract structure); in painting, the Image (the visual design or composition).
  *   **The Score:** In music, the written notation prescribing the work; in painting, the Original Canvas (treated by the argument as a prescription for appearance).
  *   **The Performance:** In music, the sounding of the symphony; in painting, the instantiation of the image (whether by the master's hand or a forger's).
  *   **The Performer:** In music, the Orchestra/Conductor; in painting, the Painter (or Copyist).
  *   **The Audience:** The Listener vs. The Viewer.

  **Where the Mapping Breaks**
  The analogy fractures on two primary axes: ontology and causality.

  1.  **Ontology (Decorative Break):** Music unfolds in time; painting exists in space. A performance requires duration; a painting is apprehended (mostly) statically. This is largely decorative. It does not inherently dictate value; a static object could theoretically be replicated without loss of "work-identity" if the art form were allographic (notation-based).
  2.  **Causality and Prescription (Load-Bearing Break):** This is the structural failure. A musical score is a set of instructions *separate* from the sound it produces. It is public and shareable; any orchestra can access Beethoven's Fifth's instructions. In painting, there is no score separate from the object. The original canvas is not a set of instructions for making a painting; it *is* the painting. To "perform" a Vermeer, one cannot follow a public recipe; one must replicate the specific, unrepeatable history of the original's creation.

  This leads to the load-bearing distinction: Music is **allographic** (the work is identified by compliance with a notation), while Painting is **autographic** (the work is identified by its history of production). In music, if the sound structure matches the score, it is the work. In painting, if the visual structure matches the original but lacks the correct history of production (i.e., it wasn't painted by Vermeer), it is not the work; it is a fake. The argument assumes the "Work" is merely the visual data, but in autographic arts, the "Work" includes the specific physical trace of the artist.

  **Addressing the Complications**

  *   **Period Instruments and Original Tempi:** The observation that music lovers pay premiums for period instruments seems to align them with painting snobs, suggesting the analogy holds better than admitted. However, this complication actually reveals a nuance in the musical side rather than the pictorial side. A performance on a modern piano is still a valid performance of Chopin; a performance on a fortepiano is a *different* valid performance. The history of the *instrument* adds color, but the history of the *performance's generation* does not invalidate the work. In painting, the history of generation *defines* the work. The music lover's preference for period tools is an aesthetic refinement within a multiple-instance framework; the painting lover's preference for the original is an ontological necessity within a single-instance framework.
  *   **Intermediate Forms (Prints, Casts, Photographs):** These forms sit between the binary. A Rembrandt etching allows multiple "originals," yet we still value early impressions over late ones. A bronze sculpture is cast from a mold, yet we distinguish between artist-cast editions and posthumous casts. These cases do not support the forgery argument; they reinforce the importance of **authorization**. In these intermediate forms, value tracks proximity to the artist's intent and supervision. A perfect photographic print made fifty years later is not valued the same as one printed under the photographer's supervision. This suggests that even in multiple-instance arts, the market premium is not mere snobbery but a valuation of the specific causal link to the creator.

  **Evaluation of the Conclusion**
  The conclusion that "a perceptually indistinguishable replica is worth just as much as the original" fails because it conflates *perceptual value* with *artistic value*. If art were solely about retinal stimulation, the argument would hold. But art functions also as a form of testimony and historical connection. When we view a Vermeer, we are not just seeing an image; we are witnessing the result of specific decisions made by a specific human being at a specific moment in history. A forgery severs this epistemic link. The "premium" on the original is not dressed-up snobbery; it is the market pricing the scarcity of that historical connection.

  However, a weaker version of the argument survives. We can concede that the *aesthetic experience* of a perfect replica might be perceptually equivalent to the original for a viewer unaware of the provenance. The betrayal felt upon learning a work is a forgery proves that our aesthetic experience is cognitively penetrated by our knowledge of origin. Therefore, the replica delivers the same sensory data but fails to deliver the same artistic content.

  A better analogy than music would be **handwriting**. A love letter is valued not just for the semantic content of the words (which could be typed perfectly), but for the physical trace of the beloved's hand. A perfect forgery of the handwriting delivers the same visual message but lacks the intimate causal connection that constitutes the letter's emotional value. Like a painting, a letter is autographic; its identity is tied to its producer.

  Verdict: holds only in weakened form; while the perceptual experience of a replica may match the original, the premium on originals is justified because the identity and value of autographic art are constitutively tied to its unique history of production rather than mere visual output.
