  **MEMORANDUM**

  **TO:** The Funding Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Proposal #892 (The Alternating Rounds Project)

  **RECOMMENDATION**
  I recommend we **Fund** Proposal #892, subject to a strict capitalization cap. Specifically, we should approve the grant request but classify it under a new "High-Variance Exploratory" bucket, limited to no more than 5% of our annual discretionary budget.

  **THE MATHEMATICAL IMPASSE**
  To make this decision, we must first acknowledge that our standard evaluation metrics have broken down. This is not a failure of the committee, but a feature of the proposal.

  Our Finance Officer argues that the expected value (EV) of this project is $-\ln(2)$, or approximately -0.69. His calculation sums the payoff series in the natural order of rounds ($n=1, 2, 3\dots$). If this were a standard investment, his conclusion would be dispositive: the project loses money on average, and we should pass.

  Our Statistician correctly identifies that this calculation is mathematically fragile. Because the series of payoffs is conditionally convergent, the Riemann Rearrangement Theorem applies. The sum depends entirely on the order in which you add the terms. Rearrange the rounds, and the EV can be made positive, negative, or infinite. Technically, the expectation is undefined. If we rely on EV maximization as our sole decision rule, the Statistician is right: we cannot rank this project against a boring grant with a defined positive return. We are comparing a number to a question mark.

  If we stop here, the safe vote is to Reject. The Finance Officer's warning is not merely about negative returns; it is about fiduciary sanity. There is a 50% probability we lose capital in Round 1. There is a 67% probability the net outcome is negative. In any conventional nonprofit context, betting donor capital on a 67% chance of loss is indefensible. If our priority is capital preservation, the Finance Officer's argument is the only one that matters.

  **THE DECISION-THEORETIC BREAKTHROUGH**
  However, we are not a conventional nonprofit. Our mandate is to back long-shot research bets that traditional funding mechanisms reject. This proposal forces us to confront whether "traditional funding mechanisms" includes the decision rules we use to judge them.

  The Proposer's argument regarding the "twin project" is the deciding factor. They have demonstrated that there exists a theoretically possible alternative project that dominates this one—it pays more in every single possible outcome—yet suffers from the exact same "undefined" expected value.

  If we reject Proposal #892 because its EV is undefined, logic dictates we must also reject its superior twin. If we reject both, we are adhering to a decision rule that systematically discards dominant options. This renders our funding criteria irrational. We cannot claim to support high-risk, high-reward science while using a risk model that paralyzes us in the face of mathematical novelty. The Proposer is asking us to put our money where our mission statement is: if we cannot use Expected Value, we must use a different metric.

  **THE FIDUCIARY GUARDRAIL**
  Accepting the Proposer's logic does not mean ignoring the Finance Officer's risk assessment. While the *expectation* is undefined, the *probability of loss* is concrete. We can accept the philosophical argument without accepting unlimited liability.

  Therefore, I propose we fund this project not as an investment with a calculable return, but as a capped expenditure on decision-theoretic research. We treat the grant amount as a "tuition fee" for testing these boundaries. By capping the exposure at 5% of our annual budget, we ensure that even if the "undefined tail" of the distribution never materializes and we suffer the 67% probability of loss, the organization remains solvent enough to fund other work. We acknowledge the Statistician's warning by refusing to bet the farm on a rearrangeable series, and we acknowledge the Finance Officer's warning by sizing the position as a loss we can absorb.

  **NEXT STEPS AND TIMEFRAME**
  1.  **Approval:** Committee vote to approve Proposal #892 under the "High-Variance Exploratory" classification.
  2.  **Term Sheet:** General Counsel to draft a grant agreement reflecting the 5% budget cap and explicitly waiving standard ROI reporting requirements for this specific tranche.
  3.  **Timeline:** Finalized agreement to be circulated for signature within 14 days, with funds disbursed by the start of the next fiscal quarter.

  This decision allows us to remain solvent while refusing to let mathematical pathologies dictate our mission. We fund the science, we cap the risk, and we update our rules.
