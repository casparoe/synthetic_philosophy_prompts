answer: |-
  You have identified a precise and notoriously difficult knot in political theory. Your analysis is correct: the standard terms you listed (*collective guilt, inherited guilt, beneficiary responsibility, structural injustice*) all fail to capture the specific structural tension you are describing. They either assume too much continuity (collective guilt), too much metaphysics (inherited guilt), too much focus on material gain (beneficiary responsibility), or too much focus on the present system (structural injustice).

  ### The Established Literature: "Successor Responsibility"

  There is an established term that comes closest to your description: **Successor Responsibility** (sometimes **Responsibility of Successor Groups**).

  This concept is most rigorously developed in recent work by scholars like **Avia Pasternak** (*Responsibility for Historical Injustice*, 2019) and **Daniel Butt** (*Rectifying International Injustice*, 2009). They distinguish between *collective responsibility* (where the group persists essentially unchanged) and *successor responsibility* (where the group has changed significantly).

  **However,** the term "Successor Responsibility" is often used loosely in seminars. It frequently conflates two different justifications:
  1.  **Institutional Continuity:** The State persists as a legal person despite regime change.
  2.  **Beneficiary Status:** The current members benefit from the past wrong.

  Your description isolates a specific *structure* within this debate: the demand for responsibility *despite* a break in agency, grounded not in benefit but in the **political ascription of continuity**. Because existing uses of "Successor Responsibility" often blur the line between *legal state continuity* and *moral community continuity*, I agree with your intuition that a more precise term is needed to "carve" the specific structure you have identified.

  ### The Coined Term: Discontinuous Collective Responsibility (DCR)

  To capture the exact structure you described—responsibility that is collective and intergenerational but **discontinuous in agency**—I propose the term:

  **Discontinuous Collective Responsibility (DCR)**

  #### Definition
  **Discontinuous Collective Responsibility** is a moral-political obligation ascribed to a present-day political community for a past wrong, grounded not in the metaphysical identity of the members, nor in their direct benefit, but in the **constructive continuity of the political office** across an institutional break.

  It posits that while the *agents* (the specific citizens, voters, and officials) are discontinuous, the *political agency* (the office of the State or the People) is treated as continuous for the purpose of moral accounting.

  ---

  ### The Carving: Inclusion and Exclusion Criteria

  To satisfy your request for a "carving," here are the necessary and sufficient conditions that distinguish DCR from its nearest neighbors.

  #### 1. What Falls Inside DCR (Inclusion Criteria)
  For a claim to count as Discontinuous Collective Responsibility, it must meet all four conditions:
  *   **The Past Event Condition:** There must be a specific, identifiable wrongful act or policy committed in the past (e.g., slavery, genocide, unlawful annexation).
  *   **The Agency Break Condition:** There must be a demonstrable discontinuity in the decision-making body between the perpetrator and the responder (e.g., regime change, new constitution, expanded franchise, demographic shift).
  *   **The Collective Ascription Condition:** The responsibility is addressed to the community *as a political body* (e.g., "The United States," "The German People"), not to specific living individuals who participated.
  *   **The Institutional Mechanism Condition:** The discharge of responsibility occurs through public, institutional acts (apologies, reparations, monuments) that reaffirm the political bond, rather than private restitution.

  **Examples:**
  *   The Federal Republic of Germany paying reparations to Israel (the FRG was a new legal entity distinct from the Third Reich).
  *   The post-Apartheid South African state acknowledging the crimes of the Apartheid regime (the franchise and constitution had fundamentally changed).
  *   The U.S. government apologizing for the Tuskegee Syphilis Study (the administration and electorate were entirely different).

  #### 2. What Falls Outside DCR (Exclusion Criteria)
  *   **Individual Criminal Liability:** Prosecuting a living 90-year-old camp guard is *not* DCR; it is individual liability.
  *   **Metaphysical Inheritance:** Claiming a white teenager is "guilty" in their soul because of their ancestors is *not* DCR; that is *Inherited Guilt*.
  *   **Pure Forward-Looking Reform:** Implementing diversity hiring to fix current bias without referencing a specific past wrong is *Structural Justice*, not DCR.
  *   **Unjust Enrichment Claims:** Demanding payment *solely* because a specific individual inherited money gained from slavery is *Beneficiary Responsibility*, not DCR (DCR applies even if the specific current citizens did not benefit, provided they hold the political office).

  ---

  ### Differentiation from Nearest Concepts

  Here is how DCR relates to the concepts you found insufficient, specifying the conceptual boundary lines.

  #### 1. DCR vs. Collective Guilt
  *   **Collective Guilt** typically requires **synchronous agency**. It implies the group acted together at the time of the wrong (e.g., a mob, a voting populace that authorized a war).
  *   **DCR** explicitly **rejects synchronous agency**. It acknowledges that the current collective *could not* have committed the act because it did not exist in its current form. DCR replaces "guilt" (which implies culpable intent) with "responsibility" (which implies an obligation to repair).
  *   *The Boundary:* If the claim is "You did this," it is Collective Guilt. If the claim is "You inherit the obligations of the office that did this," it is DCR.

  #### 2. DCR vs. Inherited Guilt
  *   **Inherited Guilt** implies a **metaphysical or biological transmission** of culpability (e.g., "blood guilt"). It is generally rejected in liberal theory as illiberal.
  *   **DCR** is **institutional and political**. It transmits obligation through the *continuity of the state*, not the blood of the citizens. A naturalized immigrant in Germany falls under DCR regarding the Holocaust not because of ancestry, but because they are now a member of the political body that maintains the legal continuity of the German state.
  *   *The Boundary:* If the obligation attaches to the *person* via ancestry, it is Inherited Guilt. If it attaches to the *citizen* via political membership, it is DCR.

  #### 3. DCR vs. Beneficiary Responsibility
  *   **Beneficiary Responsibility** grounds obligation in **unjust enrichment**. If I didn't benefit, I arguably don't owe anything.
  *   **DCR** grounds obligation in **political agency**. Even if a current citizen is impoverished and derived no material benefit from a past colonial extraction, they may still bear DCR if they hold the franchise of the colonizing state. The obligation arises from the authority they wield, not the wealth they possess.
  *   *The Boundary:* If the claim is "You have the money," it is Beneficiary Responsibility. If the claim is "You hold the office," it is DCR.

  #### 4. DCR vs. Structural Injustice
  *   **Structural Injustice** (e.g., Iris Marion Young) focuses on **ongoing processes** that constrain agents (e.g., systemic racism). It is often forward-looking and does not require pinpointing a specific past event.
  *   **DCR** is **backward-looking**. It requires a specific historical event to anchor the responsibility. While the *effects* may be structural, the *source* of the responsibility is the discrete past act.
  *   *The Boundary:* If the claim is "Fix the system," it is Structural Justice. If the claim is "Acknowledge and repair Event X," it is DCR.

  ### Theoretical Justification: Why DCR Works

  The reason this structure feels elusive is that it relies on a **legal-moral fiction**. In law, the "State" is a *corporation sole*—a single legal person that persists despite the total replacement of its members (officials and citizens).

  DCR leverages this legal fiction for moral purposes. It argues that because the present community claims the **rights** of the past state (e.g., control over territory, sovereignty, national archives, prestige), it must also accept the **liabilities** of that state. This is the principle of **Continuity of Obligation**.

  Your seminar likely struggles with this because it sits at the intersection of **International Law** (State Succession) and **Moral Philosophy** (Collective Agency).
  *   **International Law** says the State persists (favoring DCR).
  *   **Moral Philosophy** says only individuals act (favoring Individual Liability).

  **Discontinuous Collective Responsibility** is the bridge concept. It admits the moral truth (the agents are different) while accepting the political necessity (the office persists). It allows a community to say: *"We did not do this, but we are the 'We' that must answer for it."*

  ### Summary for Your Seminar
  If you wish to introduce this into your discussion, you can frame it as follows:

  > "We are discussing a structure that is not quite *collective guilt* (as we didn't act), nor *beneficiary responsibility* (as benefit is not the sole criterion). In the literature, this is often loosely called *Successor Responsibility*, but that term obscures the **agency discontinuity**. I propose we analyze this as **Discontinuous Collective Responsibility**: an obligation attached to the *political office* rather than the *biological person*, allowing for moral accountability across institutional breaks."

  This terminology will demonstrate that you have not only grasped the readings but have identified the precise conceptual gap they leave open.
