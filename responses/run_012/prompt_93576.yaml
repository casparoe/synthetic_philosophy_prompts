          *   *Test Case:* Pascal's Wager or simply deciding to raise an arm.
          *   *Prediction:* User says yes (direct control); Friend says no (depends on reasons).
      *   *Crux 2: Decision vs. Prediction.* Is intending just predicting yourself?
          *   *Test Case:* Ulysses and the Sirens.
