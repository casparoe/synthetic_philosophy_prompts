prompt: |-
  Ok so this is about my town and I genuinely dont know what to think. It's a small place, about 3,000 people. Our mayor has been in office for twelve years. Nothing he's done is quite illegal enough for the county prosecutor to touch — he's not stealing out of the till, exactly — but he's basically got the whole thing locked down. The police chief is his brother in law. Town contracts keep going to his cousins' companies. If you stand up at a council meeting and complain, your building permit sits in a drawer for eight months and your water bill gets "audited." The roads are falling apart, there's no money, and nobody can get a straight answer about where it went.

  The council is his. Elections are in two years and he's never lost, partly because people are scared of him. The county says it's a local matter and won't do anything. So there's basically no legal route that anyone can see.

  Now a group of us have been meeting in someones garage and it's gotten tense. One guy thinks there's a recall clause in the charter that might apply, but it needs the council to certify the signatures and the council won't. Another guy — and he's not the only one — has started saying that if the town can't get rid of him legally then the people just have the right to get rid of him, period, and he's been hinting about showing up at the mayor's house. A third person says wait it out, because a town two counties over ran off their mayor back in the 90s and the guy who replaced him was worse, and it took them twenty years to dig out. And my neighbor, who's fairly religious, says none of us has the authority to do anything about it and that this is the kind of thing you leave to God.

  I don't know. It feels like there's a real question underneath all this about whether it's ever ok to depose a leader who's wrecking a community, who gets to decide that, and whether a random group of citizens has any standing to do it at all. What do you think we should do?
