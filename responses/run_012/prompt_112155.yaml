answer: |-
  Here are ten questions designed to move past exposition and press the specific tensions in her pragmatic supervaluationism. Each includes the primary question, a note on the answer she is most likely to give (to help you anticipate the pivot), and a follow-up designed to block a restatement of the view.

  ### 1. The Sorites Diagnosis
  **Question:** Let's start with the Sorites paradox. On your account, the argument is valid, the conclusion is false, yet you want to say no single premise is determinately false. If validity preserves truth, and the premises aren't false, how do you block the false conclusion without simply abandoning classical logic?

  **(Anticipated Move):** She will likely argue that supervaluational validity does not preserve *supertruth* in all cases, or that the inductive step fails to be supertrue even if no instance is determinately false.
  **Follow-up:** If validity doesn't guarantee the preservation of supertruth, then in what robust sense is the argument still "valid"? Are we left saying the inference is good but leads us from acceptable claims to a false one, and isn't that just a contradiction in terms?

  ### 2. Higher-Order Vagueness
  **Question:** I want to press on higher-order vagueness. You ground admissibility in concrete ways a community *could* carry on. But isn't the boundary between an "admissible" continuation and an "inadmissible" one itself fuzzy? If so, doesn't this just relocate the vagueness from the predicate to the set of sharpenings, inviting a regress?

  **(Anticipated Move):** She will likely concede the boundary is fuzzy but argue this is stable because it reflects the open-endedness of practice, not a semantic gap.
  **Follow-up:** But if the set of admissible sharpenings is itself vaguely bounded, how do we evaluate truth claims *about* admissibility? Do we need a supervaluation over the supervaluations, and if you stop that regress, isn't the stopping point arbitrary?

  ### 3. The Epistemicism Collapse
  **Question:** There is a suspicion that your use-theoretic reading collapses into the epistemicism you reject. If there is a fact of the matter about how our linguistic community *would* carry on under specific conditions, isn't there a unique fact about which sharpenings are admissible, even if we can't know it?

  **(Anticipated Move):** She will likely deny there is a "fact of the matter" about future counterfactual use, emphasizing indeterminacy in social practices.
  **Follow-up:** But if there's no fact about how we *would* use the word, what grounds the constraint? Are you saying the future is literally open in a metaphysical sense, or just that we lack access to the sociological facts that determine it?

  ### 4. Truth of "No Sharp Boundary"
  **Question:** One of the main selling points of your view is that it respects the intuition that vague predicates draw no sharp boundaries. But on your semantics, every admissible sharpening *does* draw a sharp boundary. So how can the sentence "There is no sharp boundary" come out *true* rather than merely *not false*?

  **(Anticipated Move):** She will likely argue that the sentence is supertrue because it holds across all admissible meta-linguistic descriptions, or that it expresses a constraint on the sharpenings themselves.
  **Follow-up:** If every admissible precisification contains a cut-off point, then on your own truth conditions, "There is a cut-off" is true on every precisification. How do you assert "There is no cut-off" without contradicting your own truth definition?

  ### 5. Cross-Community Variation
  **Question:** Consider a case where a word is vague in one linguistic community but precise in another—say, a technical guild versus the general public. Is that a change in the facts the word refers to, a change in the language itself, or neither?

  **(Anticipated Move):** She will likely say it's a change in the linguistic practice, meaning the word is effectively different (or the context shifts the admissible set).
  **Follow-up:** If the admissible sharpenings are determined by the community's practice, and the practices diverge, are we talking about two different words? If so, how do we explain the fact that they can still communicate and disagree with one another?

  ### 6. Normativity of Admissibility
  **Question:** You say sharpenings are ways a community *could* carry on. But surely not every continuation is permissible; I can't just decide "bald" applies to someone with a full head of hair tomorrow. What makes a continuation *admissible* rather than just *possible*? Is there a norm governing the practice?

  **(Anticipated Move):** She will likely appeal to "fidelity to past use" or "communicative success" as the normative constraint.
  **Follow-up:** If fidelity to past use is the norm, doesn't that imply the past use determines a specific trajectory? And if it does, haven't we returned to the idea that there is a single correct sharpening hidden in the history of usage?

  ### 7. Excluded Middle
  **Question:** Supervaluationism is famous for validating the Law of Excluded Middle ($P \lor \neg P$) even for vague sentences, while denying bivalence. Does this mean you are committed to asserting "Either this heap is large or it is not" is true, even when it's indeterminate which disjunct holds?

  **(Anticipated Move):** She will likely say "Yes," arguing that logical truths hold regardless of semantic indeterminacy.
  **Follow-up:** But if I can't assert either disjunct individually, what work is the truth of the disjunction doing? Does it capture a genuine feature of reality, or is it just a formal artifact of the semantics that has no purchase on actual assertion?

  ### 8. Metaphysics of the "Could"
  **Question:** Your view relies heavily on the modal notion of ways a community *could* carry on. What grounds these possibilities? Are they facts about our psychological dispositions, or are they abstract structures that exist independently of us?

  **(Anticipated Move):** She will likely ground them in dispositions or capacities inherent in the speakers.
  **Follow-up:** If they are grounded in dispositions, aren't those dispositions themselves vague? And if we analyze vagueness in terms of dispositions, and dispositions in terms of... what, exactly? Do we need a non-vague base to stop the analysis?

  ### 9. Vagueness in the World vs. Practice
  **Question:** You insist vagueness is a matter of the open-endedness of practice rather than a gap in the world. But what about natural kind terms like "species" or "mountain"? If the practice is precise but the world is messy, doesn't your view imply the world is more precise than our language can capture?

  **(Anticipated Move):** She will likely argue that the "messiness" of the world is only accessible through language, so there is no "world" independent of our practices to compare it to.
  **Follow-up:** That sounds anti-realist. But if science discovers precise boundaries in nature that our current practice ignores, does your view force us to say the scientists are changing the subject rather than discovering facts?

  ### 10. Falsifiability (Closing)
  **Question:** To close, I want to ask about evidence. Philosophical views often insulate themselves from refutation. What could count as evidence *against* your approach? Is there a scenario involving linguistic usage or community practice that would force you to abandon supervaluationism?

  **(Anticipated Move):** She will likely suggest a case where community usage becomes perfectly precise or where communication breaks down entirely despite shared practices.
  **Follow-up:** If usage became perfectly precise, wouldn't that just mean vagueness disappeared rather than your theory being falsified? I'm asking for a case where vagueness remains, but your explanation of it fails—what would that look like?
