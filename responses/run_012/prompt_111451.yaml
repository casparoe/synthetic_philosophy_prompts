prompt: |-
  I'm a program officer at a mid-sized foundation that funds global health and development work, and every grant cycle my committee gets dragged into the same unwinnable fight. It's always some version of: do we fund the thing that saves lives, which means more people end up existing, or the thing that makes the people who already exist better off? Or: is it better to give a tiny boost to a huge number of people, or a big boost to a smaller number? Someone on the board read some population ethics last year and now everyone's paralized, because depending on wether you go by total welfare, average welfare, or one of the views that puts a floor under how bad a life can be before it counts, the answer flips. We're never going to agree on the theory and honestly we don't need to.

  Here's what I actually want, and it's not a philosophy lecture. Give me a decision procedure my committee can actually run on a proposal that (1) tells us whether the proposal is one where all the main views agree, in which case we can fund it or kill it without settling anything, and (2) tells us when a proposal really does force the theory fight, and for those, lays out what each main view says so we at least know what we're choosing between. I need the steps in order, what counts as a good enough answer at each step, where the procedure gives a clean no, and where it has to stop and hand the call to the board because it's a values question wearing a costume.

  Constraints: we've got about a week per cycle, none of us are philosophers, the board signs off on anything over $2M, and the proposals are messy -- we can't measure well-being, we can't know how many future people a given project causes to exist, and half the time we're comparing a project that helps 50,000 people a lot with one that helps 5 million people a little.

  Run the procedure on three of them: (a) deworming that measurably improves the health of a few million kids who were going to exist anyway; (b) a program that cuts infant mortality in one region, which everyone wants to call a success but which also means more people alive down the line; (c) a cheap intervention that gives a barely-noticeable benefit to a staggering number of people. Then tell me straight where this procedure is going to spit out an answer we all hate, and what would actually change your mind about the procedure itself -- what argument or piece of evidence would make you rewrite it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Program Officer at a mid-sized foundation (global health/development).
      *   **Problem:** Committee paralysis due to population ethics debates (Total vs. Average vs. Prioritarian views). Fighting over "saving lives (more people) vs. improving lives" and "wide/shallow vs. narrow/deep."
      *   **Goal:** A practical decision procedure (not philosophy) to filter proposals.
      *   **Requirements:**
          1.  Identify proposals where ethical views *agree* (easy fund/kill).
          2.  Identify proposals where ethical views *diverge* (flag for board/values decision).
          3.  Steps must be ordered, actionable, and time-bound (1 week/cycle).
          4.  Must handle messy data (no precise well-being metrics, uncertain future populations).
          5.  Board threshold: >$2M needs sign-off.
          6.  Test on three specific cases: (a) Deworming (existing people, health boost), (b) Infant Mortality (saves lives, increases population), (c) Tiny benefit to huge numbers.
          7.  Critique: Where will this procedure output a hated answer? What would change my mind about the procedure?

  2.  **Deconstruct the Ethical Landscape (Simplified for Practitioners):**
      *   *Total Utilitarianism:* Maximize sum of well-being. More lives = good if lives are worth living. Small benefit to many = good if sum is big.
      *   *Average Utilitarianism:* Maximize average well-being. Adding people with below-average welfare lowers the score. Saving lives is risky if it lowers average.
      *   *Prioritarianism/Sufficientarianism:* Priority to the worst off. Ensure a floor. Saving the very young/sick usually wins.
      *   *Person-Affecting View:* Only care about people who *would have existed anyway*. Saving lives (creating new people) doesn't count as a benefit to *someone* (the non-identity problem).
      *   *Practical Proxy:* Most foundations operate on a "Sufficientarian + Prioritarian" hybrid (help the worst off, don't make things worse) but get tripped up by "Total" implications (population growth).

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   *Constraint:* 1 week. No philosophers.
      *   *Step 1: The "Existing People" Check.* Does this primarily help people who exist regardless of the intervention? (Avoids the non-identity/population size fight).
      *   *Step 2: The "Severity" Check.* How bad off are the beneficiaries? (Addresses Prioritarianism/Sufficientarianism).
      *   *Step 3: The "Magnitude vs. Scale" Check.* Is it deep/narrow or shallow/wide? (Addresses Total vs. Average).
      *   *Step 4: The "Population Impact" Check.* Does this significantly change *who* or *how many* exist in the future? (The trigger for the ethics fight).
      *   *Decision Rule:* If Steps 1 & 2 are clear -> Fund/Kill. If Step 4 triggers -> Board Decision.

      *Refining the Steps for the User:*
      Let's make it a flowchart style "Traffic Light" system.
      *   **Green:** Consensus Zone (Fund).
      *   **Red:** Consensus Zone (Kill).
      *   **Yellow:** Ethics Fight Zone (Board Decision).

      *Step 1: The "Identity Stability" Test.* (Do the beneficiaries exist anyway?)
      *   **Yes:** Move to Step 2.
      *   **No/Unsure:** Flag as "Population Ethics Trigger."

      *Step 2: The "Suffering Floor" Test.* (Are we preventing death or severe misery?)
      *   **Yes (Severe):** Strong Consensus for Fund.
      *   **No (Marginal):** Move to Step 3.

      *Step 3: The "Aggregation" Test.* (Many small benefits vs. Few large benefits).
      *   Calculate "Total Benefit Units" (rough estimate).
      *   If Small Benefit * Huge Number > Large Benefit * Small Number -> Leans Total Util.
      *   If Large Benefit * Small Number is clearly priority for worst-off -> Leans Prioritarian.
      *   *Actually, keep it simpler.* Just ask: Is the individual benefit below a threshold of meaningfulness?

      *Let's try a more robust 4-Step Protocol:*
      1.  **Beneficiary Status:** Existing vs. New.
      2.  **Baseline Welfare:** Desperate vs. Comfortable.
      3.  **Intervention Depth:** Life-saving/Transformative vs. Marginal.
      4.  **Scale:** Wide vs. Narrow.

      *Decision Matrix:*
      *   Existing + Desperate + Transformative = **Green (Fund)**
      *   New People + Marginal Benefit = **Red (Kill)**
      *   Existing + Marginal + Huge Scale = **Yellow (Values Call)**
      *   New People + Life Saving = **Yellow (Values Call)**

      *Wait, I need to strictly follow the prompt's request for a procedure that identifies agreement vs. disagreement.*

      *Revised Procedure:*
      1.  **The "Non-Identity" Screen:** Does the intervention change *who* comes into existence (e.g., saving infants, family planning)?
      2.  **The "Severity" Screen:** Is the baseline condition life-threatening or severely debilitating?
      3.  **The "Triviality" Screen:** Is the benefit per person below a "meaningful life change" threshold?
      4.  **The "Aggregation" Screen:** Does the total sum of benefits rely entirely on massive scale of trivial benefits?

      *Outcomes:*
      *   Passes 1 (No identity change) + Passes 2 (Severe) = **Consensus Fund.**
      *   Fails 1 (Identity change) + Fails 2 (Not severe) = **Consensus Kill.**
      *   Mixed Results = **Board Referral.**

  4.  **Running the Test Cases:**
      *   (a) Deworming: Existing kids? Yes. Severe? Moderate/High (health/cognition). Trivial? No. -> Consensus Fund.
      *   (b) Infant Mortality: Existing? No (they die without it). Severe? Yes (Death). -> Conflict (Total says Fund, Person-Affecting/Average says ???). -> Board Referral.
      *   (c) Tiny benefit/Huge number: Existing? Yes. Severe? No. Trivial? Yes. -> Conflict (Total says Fund if sum is big, Prioritarian says Kill). -> Board Referral.

  5.  **Critique & Reflection:**
      *   *Where will it spit out a hated answer?* Probably on (b). Everyone *wants* to save infants, but the procedure flags it as an ethics fight because of the population implication. The committee will hate being told "saving babies is a values debate."
      *   *What would change my mind?* Evidence that population growth in that specific context leads to net negative welfare (Malthusian trap), or evidence that "tiny benefits" aggregate to structural change.

  6.  **Refining the Tone:**
      *   Needs to be professional, direct, slightly weary of philosophy but respectful of the risk.
      *   No jargon like "mere addition paradox." Use "Population Trigger."
      *   Acknowledge the $2M threshold.

  7.  **Final Polish of the Procedure:**
      *   Make it a checklist.
      *   Define "Pass/Fail" clearly.
      *   Ensure the "Board Referral" isn't just "we don't know" but "here is the specific value conflict."

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Board decides." I need to tell the user *what* to tell the board. The procedure must output the *nature* of the disagreement.

      *Step 4 Modification:* If it hits a Yellow light, the output must be: "This proposal pits View X against View Y."

      *Let's structure the response:*
      1.  Introduction (acknowledge the pain).
      2.  The Procedure (The "Ethical Triage Protocol").
      3.  Running the Cases (a, b, c).
      4.  The Critique (Hated answers & Changing my mind).

      *Wait, one constraint:* "None of us are philosophers." Keep definitions operational.
      *   Instead of "Total Utilitarianism," use "The Sum View."
      *   Instead of "Person-Affecting," use "The Existing People View."
      *   Instead of "Prioritarianism," use "The Worst-Off View."

      *Let's finalize the steps:*
      1.  **Population Impact:** Does this change the headcount?
      2.  **Baseline Severity:** Are they in dire straits?
      3.  **Benefit Depth:** Is the change life-altering or marginal?
      4.  **Aggregation:** Do we need millions to make the math work?

      *Decision Rules:*
      *   **Green:** Existing People + Dire Straits + Life-Altering. (All views agree).
      *   **Red:** New People + Marginal Benefit + Relies on Scale. (Most views agree to kill).
      *   **Amber:** Any mix. (Requires Board).

      *Wait, case (b) Infant Mortality:* This is the trickiest. Saving infants *feels* like Green. But technically it creates new people (who would have died). Strict population ethics says this is Amber. If I label it Red, the foundation looks monstrous. If I label it Green, I ignore the board's fear. I must label it Amber but explain *why* it feels Green.
      *Actually, most non-philosophers treat saving existing infants as "Existing People." The "would have died" part is the counterfactual. In population ethics, saving a life is often treated as adding a person to the future population stream. I need to be careful not to alienate the committee.*
      *Better distinction:* Does it change the *long-term* population trajectory? Deworming doesn't really. Infant mortality *might* (demographic transition).
      *Let's stick to the prompt's framing:* "program that cuts infant mortality... means more people alive down the line." The prompt explicitly flags this as a population issue. So I must treat it as such.

      *Okay, ready to write.*

      *Structure:*
      1.  **The Protocol:** 4 Steps.
      2.  **The Output:** Green, Red, Amber (with specific instructions for Amber).
      3.  **The Test Cases:** Applied strictly.
      4.  **The Critique:** Honest assessment of failure modes.

      *Refining the "What would change my mind" section:* Needs to be philosophical but grounded. Maybe if "tiny benefits" were shown to prevent systemic collapse? Or if population growth was proven to be net negative in all development contexts?

      *Final check on constraints:* 1 week timeline. The procedure needs to be fast. Data gathering is the bottleneck, not the ethics. So the procedure relies on *categorization* of data, not generation of new data.

      *Let's write.*
answer: |-
  Here is a decision procedure designed for your constraints. It bypasses the theory and focuses on **operational triggers**. It is called the **Ethical Triage Protocol (ETP)**.

  ### The Ethical Triage Protocol (ETP)

  **Time required:** 2–3 hours of committee review per proposal.
  **Goal:** Sort proposals into **Consensus Fund**, **Consensus Kill**, or **Values Referral**.

  #### Step 1: The Population Trigger
  **Question:** Does this intervention primarily change *how many* people will exist in the long term, rather than just *how well* existing people live?
  *   **Indicator:** Does the proposal explicitly cite reduced mortality (especially infant/child), increased fertility, or migration as a primary outcome?
  *   **No:** Go to Step 2.
  *   **Yes:** **STOP.** This is a **Values Referral**.
      *   *Reason:* This triggers the "Total View" (more lives = good) vs. "Person-Affecting View" (only help those who would exist anyway) conflict.
      *   *Board Note:* "This proposal changes the size of the future population. Funding requires a stance on whether creating new lives is a benefit."

  #### Step 2: The Severity Floor
  **Question:** Are the beneficiaries currently below a threshold of basic functioning (e.g., risk of death, severe malnutrition, inability to attend school/work due to health)?
  *   **Indicator:** Baseline data shows mortality risk, disability-adjusted life years (DALYs) > 0.5, or income below extreme poverty line.
  *   **Yes:** Go to Step 3.
  *   **No:** **Consensus Kill.**
      *   *Reason:* If people are already above the floor, "Total View" advocates want efficiency, and "Prioritarian" advocates (help the worst off) have no claim. Unless the benefit is massive, this rarely clears the bar.
      *   *Exception:* If the benefit is transformative (see Step 3).

  #### Step 3: The Depth Check
  **Question:** Is the benefit per person transformative (life-saving, restoring full function) or marginal (slight comfort increase, minor efficiency gain)?
  *   **Indicator:** Can a beneficiary describe their life as "fundamentally different" post-intervention?
  *   **Transformative:** **Consensus Fund.**
      *   *Reason:* All major views agree: helping existing, suffering people significantly is good.
  *   **Marginal:** Go to Step 4.

  #### Step 4: The Aggregation Test
  **Question:** Does the proposal's cost-effectiveness rely entirely on scaling a marginal benefit to millions of people to outweigh the cost?
  *   **Indicator:** The math only works if you multiply a tiny number (e.g., 0.01 quality-of-life units) by a huge population (e.g., 10 million).
  *   **No:** **Consensus Kill.** (Marginal benefit to few people is rarely worth it).
  *   **Yes:** **Values Referral.**
      *   *Reason:* This triggers "Sum View" (tiny benefits add up) vs. "Average/Threshold View" (a life slightly better isn't worth the cost if others are suffering deeply).
      *   *Board Note:* "This proposal trades depth for breadth. Funding requires accepting that many small gains equal one large rescue."

  ---

  ### Running the Procedure on Your Three Cases

  #### (a) Deworming (Health boost to existing kids)
  1.  **Population Trigger:** **No.** These kids exist regardless; deworming doesn't significantly alter long-term population trajectories.
  2.  **Severity Floor:** **Yes.** Worm burden affects nutrition, cognition, and school attendance (below basic functioning).
  3.  **Depth Check:** **Transformative/Major.** Restores cognitive potential and physical health.
  4.  **Result:** **Consensus Fund.**
      *   *Why:* It helps existing people who are suffering, in a meaningful way. No ethical view objects to this. You can fund this without board debate.

  #### (b) Infant Mortality Reduction (Saves lives, increases population)
  1.  **Population Trigger:** **Yes.** The prompt explicitly states this "means more people alive down the line."
  2.  **Result:** **Values Referral.**
      *   *Why:* Even though this feels morally urgent, your board's anxiety about population ethics makes this a hard stop for the committee.
      *   *Board Note:* "This saves lives but increases future population. The 'Total View' says fund (more happy people). The 'Person-Affecting View' says neutral (you didn't help a specific existing person, you created a new one). The 'Average View' worries about resource dilution. The Board must decide if 'saving a life' counts as 'creating a benefit'."
      *   *Reality Check:* This will feel bureaucratic. Saving babies is usually a "Consensus Fund" in the real world. But given your board's specific paralysis, this procedure correctly identifies it as the source of their theoretical fight.

  #### (c) Tiny Benefit to Staggering Numbers
  1.  **Population Trigger:** **No.** Existing people.
  2.  **Severity Floor:** **No/Borderline.** If the benefit is "barely noticeable," the baseline likely isn't dire, or the intervention doesn't reach the severity.
  3.  **Depth Check:** **Marginal.** By definition.
  4.  **Aggregation Test:** **Yes.** Relies on scale to justify cost.
  5.  **Result:** **Values Referral.**
      *   *Board Note:* "This proposal aggregates trivial benefits. The 'Sum View' says fund (total welfare goes up). The 'Prioritarian View' says kill (resources should go to the desperately suffering, not everyone slightly). The Board must decide if a million headaches cured equals one death prevented."

  ---

  ### Where This Procedure Will Spit Out an Answer You Hate

  **The Infant Mortality Trap (Case B).**
  The procedure flags saving infants as a **Values Referral**. In almost any other context, this is an automatic "Yes." Your committee will hate this. They will feel like the procedure is forcing them to justify why killing babies is bad. It creates a bureaucratic hurdle around the most emotionally compelling work you do.

  **Why it happens:** The procedure is designed to protect you from the *board's* specific anxiety about population ethics. Since the board has signaled that "more people" is a contentious variable, any proposal that increases headcount *must* be flagged, even if the moral intuition is overwhelming. The procedure prioritizes *process safety* over *moral intuition* to prevent the committee from being overruled later.

  **The "Tiny Benefit" Frustration (Case C).**
  If the "staggering number" is large enough (e.g., climate policy affecting billions), the "Sum View" is often the only one that makes sense globally. The procedure forces a debate on this. You might have a proposal that is objectively good (e.g., salt iodization) that gets stalled because someone argues it's "too shallow" for the worst-off.

  ### What Would Change My Mind About This Procedure

  I would rewrite this procedure if you provided evidence for one of the following two claims:

  **1. The "Demographic Transition" Evidence**
  If you can show that in your specific regions of operation, **reducing infant mortality reliably leads to lower total population growth within 20 years** (via the demographic transition where families choose fewer children when survival is assured), I would remove Step 1 for health interventions.
  *   *Why:* It breaks the link between "saving lives" and "increasing population." If saving lives *stabilizes* population, the "Total View" and "Average View" converge. The ethics fight disappears.

  **2. The "Aggregation Threshold" Evidence**
  If you can establish a quantitative floor for "meaningful benefit" (e.g., "Any intervention costing under $X per person that affects >Y million people is structurally significant regardless of individual depth"), I would automate Step 4.
  *   *Why:* Currently, Step 4 relies on a qualitative judgment of "trivial." If you have data showing that "tiny benefits" at scale prevent systemic collapse (e.g., marginal income boosts preventing civil unrest), then the "Sum View" becomes the pragmatic default. You wouldn't need to ask the board; the evidence would dictate that scale *is* depth.

  ### Summary Recommendation
  Adopt the **Ethical Triage Protocol**. It isolates the board's philosophical anxieties to specific "Yellow Light" proposals. It lets you fund the deworming (Case A) immediately. It forces the board to take ownership of the hard calls on infant mortality (Case B) and scale (Case C), which is where their authority belongs anyway. It won't make the fights go away, but it will tell you exactly *which* fight you are having before you spend the week arguing.
