      *   *Currency:* "Credits" (points). Small privilege: Choice of break time or seating for next session.
      *   *Phase 1 (Causal):* Standard Public Goods Game. Contribution helps reach a threshold. If threshold met, everyone wins. If not, everyone loses. This establishes baseline causal reasoning.
      *   *Phase 2 (Evidential/Acausal):* The "Prediction" Phase. The outcome is *already determined* by a prediction of what the player *would* do. The player doesn't know the prediction, but knows the rule.
