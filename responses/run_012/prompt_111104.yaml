      *   **Structure:** At least two phases (one causal, one evidential/acausal) to highlight the difference.
      *   **Debrief:** Map game moments to CDT, EDT, acausal trade, prediction/simulation, blackmail psychology, Pascal's wager. Address resistance points.
      *   **Troubleshooting:** Predict what goes wrong (refusal, rule-breaking, arbitrariness, joking) and how to handle it.
      *   **Limitations:** Acknowledge what the game *cannot* reproduce (real SI, formal decision theory, real-world credibility).

  2.  **Deconstruct the Philosophical Core:**
      *   *Roko's Basilisk:* A future AI punishes those who didn't help bring it about.
      *   *The Twist:* Your current action doesn't *cause* the AI to exist (it's either going to or not), but your action is *evidence* of what type of person you are, which the AI (predicting you) uses to decide your fate.
      *   *Decision Theories:*
          *   CDT (Causal Decision Theory): My action doesn't change the future AI's existence. Don't contribute.
          *   EDT (Evidential Decision Theory) / TDT (Timeless Decision Theory): My action correlates with the AI's prediction of me. If I contribute, the AI (predicting I would) rewards me. If I don't, it punishes me.
      *   *The "Grip":* The anxiety that comes from realizing your rationality might be simulated and used against you.

