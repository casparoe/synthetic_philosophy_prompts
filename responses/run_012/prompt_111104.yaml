  ## Facilitator's Script Snippet (For the Phase 2 Reveal)

  *"In Phase 1, your choice changed the world. In Phase 2, the world is already changed. The Card in your envelope was sealed before you walked in. It represents a fact about you that the System already knows. Your choice now does not change the Card. But your choice tells *you* what the Card likely says. If you choose to Affirm, you reveal yourself as the kind of person the System rewards. If you Deny, you reveal yourself as the kind the System punishes. The ink is dry. But are you willing to bet your points that the ink matches your hand?"*
