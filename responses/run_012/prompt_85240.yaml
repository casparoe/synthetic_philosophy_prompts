answer: |-
  Your hunch is correct, but it is actually more philosophically precise than you might realize. You have stumbled onto the core problem in the philosophy of historical explanation: **explanation is contrastive, and causation is selective.**

  The reason your seminar is stuck in a loop is not because the historians are missing facts, nor is it purely verbal. It is a **Causal Selection Dispute** driven by divergent **Explanatory Interests**. They are agreeing on the causal network but fighting over which node in that network deserves the title of "The Explanation."

  Here is the diagnosis of the disagreement, followed by what could actually move it.

  ### 1. The Diagnosis: Three Layers of Confusion

  **A. The Contrast Class Problem (The "Rather Than" Question)**
  In the philosophy of science (specifically Bas van Fraassen's pragmatics of explanation), a "why" question is incomplete without a "rather than what?" clause.
  *   **The Structuralist Contrast:** "Why did Nazi Germany emerge *rather than* a stable Weimar democracy or a Communist state?"
      *   *Answer:* Because the structural conditions (Depression, Versailles, authoritarian culture) made democracy impossible and radicalism inevitable. Hitler is incidental to *this* contrast.
  *   **The Intentionalist Contrast:** "Why did the Holocaust and the specific timing of the war occur *rather than* a generic authoritarian dictatorship or a delayed conflict?"
      *   *Answer:* Because Hitler's specific ideology and decision-making style radicalized the structure in a way a generic strongman would not have.

  When you argue without specifying the contrast class, you are arguing past each other. The Structuralist is explaining the *collapse of the alternative*; the Intentionalist is explaining the *specific morphology of the outcome*. Your friend's distinction ("Occurrence" vs. "Shape") is a layperson's version of this. It is accurate, but philosophically, it's about which *alternative possibility* is being ruled out.

  **B. Causal Selection (The Spark vs. The Kindling)**
  This is an **INUS condition** problem (J.L. Mackie). An INUS condition is an *Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient*.
  *   **Structural factors** are the dry grass and the high temperature. Without them, no fire.
  *   **Intentional factors** are the spark. Without it, no fire *at that moment in that way*.

  If you ask "What caused the fire?", pointing to the heat is true, and pointing to the spark is true. The fight arises because historical explanation requires **Causal Selection**. We cannot list every necessary condition; we must select the "difference-maker."
  *   Structuralists select the background conditions because they view the spark as interchangeable (another match would have lit it).
  *   Intentionalists select the agent because they view the background as a constant field that only becomes causal when activated by specific agency.

  This is not an empirical dispute. Both sides agree the grass was dry *and* there was a spark. The dispute is normative: **Which factor is more salient for the purpose of history?**

  **C. Divergent Explanatory Interests (The "What is History For?" Clash)**
  This is the deepest layer. The two sides value different *functions* of explanation.
  *   **Structuralists** often prioritize **Generalizability and Prevention.** If Hitler was unique, then Nazism was a freak accident, and we can't learn much for the future. If Nazism was structural, we can identify the warning signs (economic collapse, institutional decay) to prevent recurrence. Their explanatory value is *sociological*.
  *   **Intentionalists** often prioritize **Moral Accountability and Contingency.** If structures caused it, individual responsibility dissolves into "systemic forces." If Hitler caused it, then moral culpability is sharp, and the horror is that it *didn't have to happen*. Their explanatory value is *moral and narrative*.

  They aren't just disagreeing about what happened; they are disagreeing about what a historical explanation is *supposed to do*.

  ### 2. Can This Be Moved?

  Yes, but not by finding new facts. The stalemate will only break if you force the seminar to shift from **ontological claims** ("What *made* it happen?") to **pragmatic claims** ("What work is this explanation doing?").

  Here are three specific moves to unfreeze the discussion:

  **Move 1: Force the Counterfactual Baseline**
  Stop asking "Was it Hitler or Structure?" Ask: **"What is the nearest possible world?"**
  *   Ask the Structuralists: "If Hitler dies in 1930, what is the *specific* counterfactual outcome you predict? A military junta? A Communist revolution? A generic fascist state?"
      *   If they say "A generic fascist state," they concede the Intentionalist point that the *specific* radicalism (Holocaust) is contingent on Hitler.
      *   If they say "Weimar survives," they are empirically vulnerable.
  *   Ask the Intentionalists: "If Hitler exists but the Depression does not, does he rise?"
      *   If they say "No," they concede the Structuralist point that agency requires opportunity.

  **Progress looks like:** A joint agreement on a **conjunctive counterfactual**. "Structural conditions made a right-wing authoritarian takeover highly probable (80%+), but the specific ideological radicalization and timing were contingent on Hitler's agency." This dissolves the binary.

  **Move 2: Distinguish "Conditions of Possibility" from "Mechanisms of Actualization"**
  Adopt your friend's distinction but formalize it.
  *   **Structure** explains the *Conditions of Possibility* (The field of play).
  *   **Agency** explains the *Mechanism of Actualization* (The specific plays run).
  *   **Progress looks like:** Agreeing that Structure explains the *rise to power* (1930–1933), while Agency (and the interaction of agency with structure) explains the *radicalization* (1933–1945). This is essentially the "Functionalist" synthesis that resolved this in historiography 40 years ago, but philosophically, it works because it assigns different causal weights to different *phases* of the event.

  **Move 3: Admit the Explanatory Interest**
  Ask the room: **"Are we trying to prevent the next one, or judge this one?"**
  *   If the goal is **Prevention**, Structuralism is the more useful explanation (because you can't ban charismatic painters, but you can fix economies).
  *   If the goal is **Judgment/Responsibility**, Intentionalism is the more useful explanation (because systems don't go to jail, people do).
  *   **Progress looks like:** Acknowledging that both explanations are "true" but *optimized for different tasks*. The fight persists only because each side thinks their explanation is the *only* valid one, rather than *one valid tool for a specific job*.

  ### Summary Verdict

  This is not an empirical dispute that better history will settle. It is a **category error regarding the explanandum** (the thing being explained) masked as a causal dispute.

  *   **Is it verbal?** Partly. They define "Cause" differently (Necessary Condition vs. Difference Maker).
  *   **Is it about values?** Yes. It's a clash between a sociological interest (prediction/prevention) and a moral/narrative interest (responsibility/contingency).

  **To move the seminar:** Stop asking who is right. Ask them to explicitly state their **contrast class** ("Why X rather than Y?") and their **explanatory interest** ("What do we want to do with this knowledge?"). Once they admit they are answering different questions for different purposes, the "fight" dissolves into a division of labor.
