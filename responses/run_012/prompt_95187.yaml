answer: |-
  **Bottom line**

  You are entering a social contract you didn't write. Your goal is integration without complicity. This procedure helps you distinguish between local laws (mandatory), moral universalities (non-negotiable), and cultural conventions (negotiable). When law and norm conflict, or when a norm feels unjust, stop and contact your on-site coordinator. Do not decide high-stakes ethical breaches alone. Your presence impacts locals; act to minimize harm and maximize respect, even when tired. Being a guest means you benefit from local order without having helped build it; this creates a duty to follow coordination norms unless they cause harm. If you break a rule, you own the consequence; you cannot claim cultural ignorance to escape legal or social fallout. Use this tool to pause before acting.

  **Your distinctions, sorted**

  Your intuitions are surprisingly robust. Here is the philosophical sorting:

  1.  **Pure Coordination vs. Fairness:** These are distinct. Pure coordination (escalator side) is about efficiency; violating it creates friction. Fairness (queues) is about allocation; violating it creates inequity. Keep them separate.
  2.  **Owed Anyway:** This is Moral Universalism. Do not humiliate servers anywhere. This survives contact; it's not local, it's human.
  3.  **Annoyance:** This is Social Sanction. It is not harm, but it is a cost. It survives, but categorize it as "low stakes."
  4.  **Actively Bad:** This is Moral Override. It survives. If a norm encodes hierarchy or injustice, you have permission to dissent.
  5.  **Regularity vs. Norm:** This is the Is/Ought distinction. Crucial. Just because everyone jaywalks (regularity) doesn't mean you won't be fined (norm). Keep this.
  6.  **Tourist Enforcement:** This is Real. Service sectors often enforce stricter norms on outsiders than locals practice. This is a risk factor, not a moral category.

  **What's Junk:** The distinction between "visitor latitude" vs. "free-riding." These are the same tension. The resolution is: You are bound by coordination norms if you participate in the system (using the train), but not by symbolic norms you cannot know.

  **The Single Missing Thing:** **Consequence Scaling.** You have categorized the *type* of norm, but not the *cost of violation*. Is the penalty a look, a shout, a fine, or deportation? Your procedure needs a risk assessment step.

  **The procedure**

  Run this checklist in order. If you hit a "Stop," do not proceed without human consultation.

  1.  **The Legality Check.** Is this action illegal under local law?
      *   *Yes:* **STOP.** Do not do it. General Counsel requires compliance with local law for your safety and visa status. Exception: If the law itself violates human rights (e.g., discriminatory policing), proceed to Step 5 (Handoff).
      *   *No:* Proceed to Step 2.
      *   *Note:* This step is not moral advice; it is risk management. Illegal acts remove university support.

  2.  **The Harm Check.** Does refusing to follow this practice directly harm a specific person?
      *   *Yes (e.g., withholding tips where wages depend on it):* **Follow the practice.** You may dislike the system, but punishing the individual server for structural inequity is unjust. Your personal boycott costs them rent money.
      *   *No (e.g., jaywalking on empty street):* Proceed to Step 3.
      *   *Note:* This is where my opinion enters. I prioritize individual welfare over systemic protest in low-stakes interactions.

  3.  **The Coordination Check.** Is this practice required for the system to function smoothly?
      *   *Yes (e.g., queuing, ticket validation):* **Follow the practice.** You are benefiting from the system (riding the train); free-riding is unfair to locals who built it.
      *   *No (e.g., dress codes in non-religious spaces):* Proceed to Step 4.

  4.  **The Annoyance Check.** If I do this, will locals be annoyed?
      *   *Yes:* **Weigh the cost.** Are you willing to be marked as "that rude tourist" for this specific act? If you are tired or stressed, default to following the norm to conserve social capital for later.
      *   *No:* You have latitude. Do what feels right.

  5.  **The Handoff.** Does this situation feel unjust, dangerous, or legally ambiguous?
      *   *Yes:* **Contact On-Site Coordinator.** Do not decide alone. Send a message: "I am facing a conflict between law/norm and ethics. Here are the facts."
      *   *No:* Proceed.

  **Implementation Note:** Steps 1 and 5 are hard constraints. Steps 2 and 3 are ethical defaults. Step 4 is your discretion. If you violate Step 2 or 3, you must accept social consequences without appealing to "cultural difference."

  **The two-minute card**

  *   **1. Is it Illegal?**
      *   Yes → **STOP.** (Unless human rights violation → Ask Coordinator).
      *   No → Next.
  *   **2. Does skipping this hurt a specific person?**
      *   Yes (e.g., server wages) → **Do it.** (Don't punish individuals for systems).
      *   No → Next.
  *   **3. Is this how the system works?**
      *   Yes (e.g., queues, tickets) → **Do it.** (Don't free-ride).
      *   No → Next.
  *   **4. Will people be annoyed?**
      *   Yes → **Ask:** Am I willing to be "the rude tourist" today?
      *   No → **Your call.**
  *   **5. Feel unsafe or unsure?**
      *   Yes → **Message Coordinator.** Wait for reply.

  **Three runs**

  **(a) Tipping at a US sit-down restaurant (mediocre service)**
  1.  *Illegal?* No.
  2.  *Harm?* Yes. Server wages depend on tips. Withholding tips punishes the individual, not the owner.
  3.  *Verdict:* **Tip.**
  4.  *The Answer You Won't Like:* I know you find the system "gross." The procedure forces you to fund it anyway. Why? Because Step 2 prioritizes the immediate welfare of the worker over your systemic critique. Refusing to tip here is virtue signaling at the server's expense. The procedure says: Pay the 20%, complain to the manager later, but do not make the server pay for your politics.

  **(b) Crossing on a red light at night (empty street)**
  1.  *Illegal?* Yes (technically).
  2.  *Verdict:* **STOP.**
  3.  *Nuance:* Even if everyone does it (Regularity), the Law Check (Step 1) is a hard veto for liability. If you get hit or fined, the university cannot help you. The procedure prioritizes your safety and status over efficiency. You must wait.

  **(c) Paying extra to jump a queue at a public office**
  1.  *Illegal?* No (it's an official fee).
  2.  *Harm?* No (it's a market option).
  3.  *Coordination?* It bypasses fairness (queue), but it's a sanctioned alternative system.
  4.  *Verdict:* **Permissible.**
  5.  *Analysis:* This feels like buying privilege. However, since it is legal and offered publicly, it is a local convention of allocation (market vs. time). The procedure allows it. If you feel uncomfortable, that is a Step 4 Annoyance check on your own conscience. But you are not violating a norm if the state offers the option.

  **Where this misfires**

  This procedure pretends to be algorithmic, but Steps 2 and 5 are deeply subjective. What counts as "harm"? Is reinforcing a caste system harm? The procedure says "tip the server," but what if the service role itself is racially coded in that country? I cannot encode that nuance in a flowchart. That is why Step 5 (Handoff) is critical, but it relies on students recognizing when they are out of their depth.

  Furthermore, the Legality Check (Step 1) is a blunt instrument. In some countries, laws are selectively enforced to target foreigners. Following the law strictly might not protect you if the police are corrupt. The procedure assumes a functioning rule of law. In fragile states, "Legality" might need to be swapped for "Safety."

  Finally, this puts immense burden on your on-site coordinators. They will receive midnight texts about tipping etiquette. You need to train them to distinguish between "I'm scared" and "I'm uncomfortable." The procedure cannot settle cases where local norms conflict with home values (e.g., gender roles); it can only manage the risk. You are outsourcing ethical judgment to staff who may not be equipped for philosophy.

  **What I still have to decide**

  You need to define the threshold for Step 5. When does "uncomfortable" become "unjust"? You also need to brief General Counsel that "Follow Local Law" has a human rights exception, or you will force students into complicity with oppression. Finally, decide if coordinators have authority to override Step 1 in safety emergencies.
