  COMMITTEE ON SELECTIVE ACCOUNTING
  FOR IMMEDIATE RELEASE

  Subject: Standardization of Evolutionary Ledgers and Mandatory Dual-Currency Filing

  HEADQUARTERS — The Committee on Selective Accounting (CSA) today issued Final Ruling 88-B, resolving the discrepancy between gene-centric and group-centric reporting standards. After decades of audit disputes, the Committee has determined that the two frameworks are materially equivalent reporting conventions for the same underlying ledger. Consequently, all researchers must henceforth file evolutionary results in both currencies simultaneously.

  Under the new protocol, change in frequency shall be recorded as a rigorous double-entry system within a single generational fiscal year. A gain in replicator holdings must be matched by a corresponding adjustment in vehicle portfolios. Where previously a behavior might have been logged as a net loss to an individual asset, it must now be reconciled as a transfer to a consolidated group account via inclusive fitness adjustments. The CSA emphasizes that this is strictly a matter of fiscal translation; a unit of selective pressure spent on kin is indistinguishable from a unit spent on the colony, provided the coefficient of relatedness is correctly applied as the exchange rate.

  Critics who argued that one currency offered superior explanatory power were reminded that the Committee regulates accounting, not narrative preference. Contextual analysis will serve as the mandatory audit trail to ensure that group-level variances are not masked as individual-level noise. However, the ruling clarifies that while the books must balance, the choice of denomination remains a matter of administrative convenience. A notational equivalence does not imply an explanatory identity; one may describe a transaction as a withdrawal or a payment, but the physics of the vault remain unchanged.

  Special provisions were announced for Major Transitions in evolution. Instances where independent replicators merge into a higher-level vehicle—such as single cells forming multicellular organisms—will be treated as corporate restructuring. During these periods, the primary unit of accounting may shift, provided a full disclosure statement accompanies the filing regarding the change in liability ownership and the suppression of lower-level competition. Failure to report the dissolution of lower-level equity will result in retroactive audit penalties.

  "Confusion arose because researchers were treating ledgers as ontologies," said Dr. Elara Vance, Chief Compliance Officer for the CSA. "You can describe a forest in board feet or ecosystem services. Both are accurate. You cannot claim the timber is more real than the habitat simply because you prefer the lumberjack's spreadsheet. Our goal is harmonization. We ensure the numbers add up, not why the money was spent."

  The ruling takes effect immediately for all ongoing generations. Researchers found filing in single-entry formats will be subject to peer-review sanctions. The Committee noted that while the dual-currency requirement ensures that no selective pressure goes unrecorded, it does not adjudicate the mechanical origin of the transaction. The ledger confirms that the balance has changed, and it confirms that the debits equal the credits. It does not, however, identify which account holder actually picked up the pen to write the check.

  ###
