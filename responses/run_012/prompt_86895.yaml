answer: |-
  **The Frictionless Mind: Logical Omniscience and the Conflation of Information and Computation**

  The problem of logical omniscience is the original sin of formal epistemology. In the standard possible worlds semantics, an agent's knowledge is modeled as a set of worlds compatible with their information. Because logical truths hold in all possible worlds, and the relation of entailment is defined by set inclusion, an agent who knows the axioms of a system automatically knows every theorem derivable from them. This implies that human agents, who are manifestly not logically omniscient, are misdescribed by the framework. In our seminar, three responses emerged: that this is a harmless idealization; that the semantics requires revision (via awareness or impossible worlds); or that knowledge is not a propositional attitude at all.

  This essay argues that the problem of logical omniscience is not a genuine defect in the semantics of *information*, but an artefact of conflating two distinct concepts: **informational containment** and **cognitive access**. The standard framework correctly models the former, while the objections raised by my classmates target the latter. By disentangling these, we can see that the "Cost-of-Inference" test measures cognitive effort rather than epistemic state, and that the perception analogy, while insightful, requires refinement. The verdict is that logical omniscience survives as a feature of a semantics of information, but must be abandoned for a semantics of bounded rationality. The defect lies not in the logic, but in the expectation that a single model should perform both jobs.

  ### The Debate: Availability vs. Uptake

  To adjudicate the three responses, we must first resolve the dispute between the proponents of the "Cost-of-Inference" test and the "Perception Analogy." Classmate A argues that a semantics of knowledge must distinguish between two agents with identical evidence and capacity where one has performed a derivation and the other has not. Classmate B objects that this proves too much, comparing it to vision: two agents with identical visual capacity and field of view see the same objects, even if one attends to a tree and the other does not.

  They are talking past each other because they are employing different senses of "knowledge." Classmate A is operating with a concept of *occurrent knowledge* or *cognitive achievement*. On this view, knowing is an active state akin to grasping or verifying. Classmate B is operating with a concept of *dispositional knowledge* or *informational entitlement*. On this view, knowing is a standing relation to the world, akin to having data on a hard drive, regardless of whether the file is currently open.

  The perception analogy defeats the Cost-of-Inference test only if we accept Classmate B's premise that semantics should track *availability* rather than *uptake*. In vision science, we distinguish between the *visual field* (what is optically available) and *visual awareness* (what is processed). A semantics of vision typically models the former; a psychology of vision models the latter. Classmate A demands a psychology; Classmate B defends a semantics. The Cost-of-Inference test is therefore not a test for *knowledge* simpliciter, but a test for *computational effort*. It reveals that ordinary usage of "knows" is ambiguous between "is in a position to know" (availability) and "has actively verified" (uptake). The standard possible worlds framework models the former. Consequently, the test does not show that closure-entailing semantics are false; it shows they are not models of cognitive processing.

  ### Adjudicating the Three Responses

  With this distinction in hand, we can evaluate the three seminar responses.

  The first response—that logical omniscience is a harmless idealization like a frictionless plane—is correct regarding **informational containment**. In physics, we model motion without friction to understand the fundamental laws of dynamics, adding friction later for specific applications. Similarly, standard epistemic logic models the normative structure of justification. If $P$ entails $Q$, then $P$ *contains* the information that $Q$. An agent who knows $P$ possesses that information, even if they haven't unpacked it. This idealization is harmless provided we do not mistake the map for the territory. It tells us what an agent is committed to, not what they have explicitly represented.

  The second response—that the semantics must be revised via awareness or impossible worlds—is correct regarding **cognitive access**. If we wish to model actual human reasoning, we must restrict the set of accessible worlds to those the agent can distinguish, or introduce "impossible worlds" where logical truths fail, to represent the agent's inability to rule out logical errors. Awareness logic, which adds a component tracking which formulas the agent has considered, successfully models the Cost-of-Inference intuition. This is not a correction of the first response, but a supplementation of it for a different explanatory goal.

  The third response—that knowledge is a skill rather than a relation to propositions—is the most radical. It correctly identifies that "knowing how to derive" is an ability, but it errs in rejecting the propositional nature of knowledge entirely. One can possess a skill *that* something is the case. However, this response highlights why the conflation is so tempting: we often attribute knowledge based on the reliability of the agent's skills.

  The verdict is a synthesis: Response 1 describes the *normative state* of the agent (what they are entitled to claim), while Response 2 describes the *descriptive state* (what they can actually process). Response 3 is a category mistake that nonetheless points to the importance of ability conditions in ordinary attribution.

  ### Testing the Verdict: The Derivation Cases

  To stress-test this verdict, consider the cases raised in the prompt.

  **Case 1: The Fragile Derivator.** An agent knows the axioms, is aware of them, would assent to the entailment, but would make an error if she attempted the derivation. Does she know the theorem?
  Under the **Informational** view (Response 1), she knows the theorem. The information is present in her belief set; the entailment holds objectively. Her potential error is a performance failure, not an informational deficit. Under the **Cognitive** view (Response 2), she does not know it, because her access is unreliable.
  My verdict aligns with the Informational view for formal semantics. If we say she does not know it, we conflate the *truth* of the entailment with the *reliability* of the processor. However, for ordinary attribution, we might withhold "knows" because knowledge attributions often imply reliability. The semantics should capture the informational fact; pragmatics handles the reliability implication.

  **Case 2: The Forgotten Proof.** An agent once derived the theorem correctly but has forgotten the proof, retaining only the conclusion and the axioms. Does she know the theorem?
  This case is decisive. If knowledge required active derivation (Classmate A's view), she no longer knows it. If knowledge is a standing condition (Classmate B's view), she still knows it, provided the axioms are retained and the entailment is necessary.
  Intuitively, we feel she still knows the theorem. A mathematician does not cease to know Pythagoras' theorem every time she stops thinking about the proof. This supports the view that knowledge is a standing state supported by the *availability* of justification, not the *history* of its acquisition. The standard possible worlds semantics captures this perfectly: the set of worlds compatible with her axioms excludes worlds where the theorem is false. The fact that she cannot currently traverse the path between them is a limitation of her working memory, not her epistemic state. Thus, the "Forgotten Proof" case vindicates the closure principle for standing knowledge, while acknowledging that *occurrent* justification has lapsed.

  ### The Strongest Objection: The Action-Guiding Critique

  The strongest objection to this dual-aspect verdict is the **Action-Guiding Critique**. Epistemology is not merely descriptive; it is normative and practical. We attribute knowledge to guide action and assertion. If a formal semantics says an agent "knows" $\psi$ (because it follows from her axioms), but the agent cannot derive $\psi$ and thus would not bet on it or assert it, the semantics has failed to track the concept that does the work.
  If I say, "The agent knows $\psi$," I imply she is in a position to use $\psi$. If the semantics declares she knows $\psi$ while she is cognitively unable to use it, the semantics is practically inert. It creates a gap between the formal predicate $K\psi$ and the real-world utility of knowledge. Therefore, the objection concludes, a semantics that permits logical omniscience is not a semantics of *knowledge* in any sense that matters for epistemology.

  **Reply:** This objection confuses the *conditions for knowledge* with the *conditions for utilizing knowledge*. That an agent knows $\psi$ entails that $\psi$ is true and justified for them. It does not entail that they can instantly deploy $\psi$ in high-pressure reasoning. The utility of knowledge attributions often relies on *presumptions* of access, but the truth conditions of the attribution do not.
  Furthermore, the Action-Guiding Critique proves too much. It would require semantics to model fatigue, distraction, and working memory limits. While valuable for cognitive science, this burdens the logic of knowledge with the psychology of reasoning. The proper response is to distinguish between $K\psi$ (the agent's information state supports $\psi$) and $Active(\psi)$ (the agent can currently deploy $\psi$). The former guides long-term planning and assertion norms (one should not assert what one does not informationally support); the latter guides immediate action. The problem of logical omniscience arises only if we demand $K\psi$ to imply $Active(\psi)$. Once we sever this link, the objection dissolves.

  ### Conclusion: What a Semantics Ought to Represent

  We are now in a position to state explicitly what a semantics of knowledge ought to represent. It ought to model the **space of epistemic possibilities compatible with an agent's information**. It is a theory of *content* and *commitment*, not a theory of *computation* or *consciousness*.

  Under this account, the problem of logical omniscience does not survive as a defect. It is revealed as a category error. To demand that a semantics of information track cognitive effort is like demanding that a map of a city track the traffic congestion on its roads. The map tells you what routes are possible (informational entailment); the traffic report tells you which routes are currently traversable (cognitive access).

  The standard possible worlds framework is the map. It correctly identifies that if the axioms are known, the theorems are "on the map." The revisions proposed in Response 2 (awareness, impossible worlds) are the traffic reports. They are necessary for modeling the agent's journey, but they do not invalidate the map.

  Therefore, the seminar need not choose among the three responses. Response 1 is the correct account of the *logic* of knowledge. Response 2 is the correct account of the *psychology* of knowledge. Response 3 is a warning against ignoring the agent's abilities. The "Cost-of-Inference" test measures the psychology; the "Perception Analogy" defends the logic. The seam between them is the distinction between **Information** (what the world rules out given one's evidence) and **Computation** (what the mind can process given its limits). Logical omniscience is the price of modeling Information. It is a price worth paying, provided we do not mistake the frictionless plane for the ground we walk on.
