answer: |-
  Samuel Scheffler's Afterlife Conjecture posits a profound dependency: the value of our present activities is not self-contained but relies heavily on our confidence in a "collective afterlife"—the continuation of humanity after our deaths. According to Scheffler, if we believed humanity would go extinct shortly after we die, the value of our current projects would be "drained," rendering them pointless or significantly diminished. While this captures a common intuition about legacy, the conjecture cannot sustain its own conclusion without collapsing into absurdity. When analyzed rigorously, the conjecture presents a dilemma. Interpreted as a claim about the nature of value itself, it demands an impossible infinity or makes value arbitrarily dependent on temporal distance. Interpreted as a claim about human psychology, it makes the badness of extinction contingent on foresight. No formulation escapes these horns. To be saved, the conjecture must abandon its central claim that extinction drains value from lives it does not end.

  ### The First Horn: The Normative Interpretation and the Problem of Finitude

  If we take the Afterlife Conjecture as a normative claim about value—that our activities *are* objectively worth less the sooner the human future ends—it falls prey to the problem of cosmic finitude.

  Scheffler suggests a gradient of value: a future ending thirty days after our death renders our projects nearly valueless, while a future ending centuries later preserves their value. However, this logic implies that the value of any present action is a function of the duration of the future. If value scales with duration, then a future lasting one million years confers more value on present actions than a future lasting one thousand years. By this logic, to maximize the value of our current lives, we would require the human future to last as long as possible.

  Here lies the first absurdity: Every human future is finite. Whether due to resource depletion, stellar evolution, or the heat death of the universe, humanity will eventually cease to exist. If the value of present activities depends on the length of the future, then the certainty of eventual extinction means that *no* present activity can possess full value. The "draining" effect Scheffler describes for a near-term extinction must, by logical extension, apply to long-term extinction, merely at a slower rate.

  To avoid this, the conjecture would have to posit a threshold where the future is "long enough" to secure full value. But this is arbitrary. Why does a future of ten thousand years secure the value of writing a poem, while nine thousand nine hundred and ninety-nine years does not? If there is no threshold, then the conjecture demands an *infinite* future to sustain full present value. Since an infinite human future is physically impossible, the normative interpretation implies that nothing we do now is fully valuable. This undermines the very confidence Scheffler seeks to explain; if the conjecture were true, we should already be demoralized by the inevitability of cosmic entropy. Thus, the normative interpretation makes present value hostage to an impossible eternity.

  ### The Second Horn: The Psychological Interpretation and the Problem of Foresight

  If Scheffler retreats from the normative claim to a psychological one—that we *feel* our activities are worth less, or *cannot bring ourselves to care*, without confidence in the future—the conjecture encounters the problem of epistemic contingency.

  On this reading, the badness of extinction is not inherent in the loss of humanity, but in the loss of our *confidence* in humanity. This makes the tragedy of extinction dependent on our knowledge of it. Consider two scenarios: In the first, humanity knows an asteroid will destroy all life in thirty years. In the second, the asteroid arrives unexpectedly, destroying all life tomorrow.

  According to the psychological formulation of the conjecture, the first scenario is significantly worse than the second. In the first, our confidence is shattered, draining the value from our remaining decades. In the second, we retain our confidence until the very end; we live and die believing in a future that, unbeknownst to us, does not exist. If the "draining" of value depends on our *belief* in extinction, then the unforeseen extinction is less bad because it does not undermine our psychological confidence.

  This is a counter-intuitive reversal of moral reality. Intuitively, the sudden extinction of the species is a greater tragedy precisely because it cuts off potential future lives without warning, not less tragic because the victims remained optimistic. The psychological interpretation conflates the *experience* of value with the *existence* of value. It suggests that the tragedy of extinction lies in our disappointment rather than in the loss of the humans themselves. If the badness of extinction depends on our beliefs about it, then ignorance becomes a buffer against tragedy. This implies that the moral status of an event (extinction) is determined by the epistemic state of the victims, which is untenable.

  ### The Inescapable Dilemma

  One might attempt to hybridize these interpretations, arguing that rational confidence is what matters. However, this does not escape the dilemma. If "rational confidence" is required, we return to the first horn: given the evidence of cosmic finitude, is it rational to believe in an infinite future? If not, rational confidence should be low, and value should be drained. If "rational confidence" simply means "believing in a sufficiently long finite future," we return to the arbitrariness of the threshold problem.

  Alternatively, Scheffler might argue that the conjecture is only about *social* projects (like science or justice) rather than private pleasures. But this distinction does not hold. A scientific discovery is valuable because it is true and helpful to those who use it. If the world ends tomorrow, the discovery was still true and helped those who used it today. The *utility* of the project is not drained by the future absence of users, even if the *scope* of the utility is limited. To claim the value is drained is to claim that the worth of helping a person today depends on whether that person's grandchildren will exist. This creates a moral debt to the future that outweighs the moral reality of the present.

  Both horns stem from the same root error: the claim that the value of the present is *constituted* by the existence of the future. Whether framed as objective value or subjective confidence, making the present hostage to the future leads to either infinite regress or epistemic absurdity.

  ### The Cost of Salvation

  To save the core insight of the Afterlife Conjecture—that we deeply care about the continuation of humanity—Scheffler must abandon the specific mechanism he proposes. He must give up the claim that extinction **drains value** from lives it does not itself end.

  A salvaged version of the conjecture would have to posit that the future is a **separate good**, not a **constituent** of present good. We can value our lives fully in the present while simultaneously preferring that humanity continues after us. The tragedy of extinction would not be that it renders our current lives pointless, but that it prevents future lives from having value. We care about the afterlife because we value *future people*, not because we need them to validate *us*.

  By relinquishing the "draining" thesis, the conjecture avoids the demand for an infinite future (since present value is self-contained) and avoids the epistemic contingency (since extinction is bad regardless of whether we foresee it). However, this concession fundamentally alters Scheffler's conclusion. It admits that while we *want* an afterlife, we do not *need* one to justify our existence. The Afterlife Conjecture can only be sustained by admitting that the value of the present is independent of the future, which is to say, it must abandon the very dependency that defines it.
