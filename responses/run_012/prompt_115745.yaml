      *   **Requirements:** Set out both horns, argue no formulation escapes them, and state what the conjecture must give up to be saved.

  2.  **Understand Scheffler's Position (Background Knowledge):**
      *   Scheffler argues that we care about a "collective afterlife" (humanity continuing) more than our own personal afterlife.
      *   He uses thought experiments (The Doomsday Scenario: extinction 30 days after death; The Infertility Scenario: no new humans).
      *   He claims these scenarios would undermine our confidence in the value of our current projects (science, art, justice).
      *   *Goal of the Prompt:* Critique this specific linkage between future duration/confidence and present value.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Define the Afterlife Conjecture clearly.
          *   State the thesis: The conjecture fails because it leads to absurd implications regarding the *nature* of value (Horn 1) or the *objectivity* of badness (Horn 2).
          *   Roadmap: Analyze the normative interpretation vs. the psychological interpretation.

      *   **Horn 1: The Normative/Value Interpretation:**
          *   *Premise:* The conjecture claims present activities *are* less valuable if the future is short.
          *   *The Problem of Finitude:* Human existence is cosmically finite (heat death, sun expansion). There is no *infinite* future.
          *   *The Slippery Slope:* If value scales with duration, then a future ending in 1 billion years is better than one ending in 1 million years.
          *   *The Absurdity:* Does the value of writing a poem today depend on whether humans last 10,000 or 10,001 years? This makes value contingent on arbitrary temporal distance.
          *   *The Infinite Regress:* To maintain full value, we arguably need an *infinite* future. But physical reality precludes this. Therefore, under this view, *nothing* we do has full value now. This undermines the very confidence Scheffler wants to explain.

      *   **Horn 2: The Psychological/Belief Interpretation:**
          *   *Premise:* The conjecture claims we *believe* our activities are valuable only if we *believe* the future continues.
          *   *The Problem of Epistemic Contingency:* This makes the *badness* of extinction dependent on knowledge.
          *   *The Absurdity:* If an asteroid hits unexpectedly (The Surprise Extinction), is it less bad than a known approaching asteroid?
          *   *Objective vs. Subjective Badness:* Intuitively, extinction is objectively bad regardless of whether we knew it was coming. Scheffler's view suggests the tragedy is in the *loss of confidence*, not the loss of humanity itself. This reverses the direction of fit. We should care because it's bad, not it's bad because we care (based on belief).

      *   **Synthesizing the Dilemma (No Escape):**
          *   Can Scheffler mix them?
          *   If he says "It's about rational confidence," we return to Horn 1 (how much confidence is rational given finitude?).
          *   If he says "It's just a psychological fact," we return to Horn 2 (why should morality track psychological quirks about foresight?).
          *   The "Sociality" Defense: Scheffler might argue it's about social projects. *Counter:* Social projects have intrinsic value in the moment of sharing, not just in their perpetuation. A conversation is valuable even if the world ends tomorrow.

      *   **What Must Be Given Up (The Rescue Condition):**
          *   To save the core insight (we care about the future), Scheffler must abandon the claim that present value *depends* on the future.
