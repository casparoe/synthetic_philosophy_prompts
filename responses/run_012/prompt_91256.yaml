      *   **Tone:** Philosophical, rigorous, direct, acknowledging the user's sophistication.

  2.  **Deconstruct the Problem of Logical Omniscience:**
      *   This is a classic problem in epistemology and doxastic logic (Hintikka, Stalnaker, etc.).
      *   The standard model (possible worlds semantics) implies LO: If an agent believes $P$, they believe $Q$ in all worlds compatible with their beliefs. If $P \to Q$ is necessary, $Q$ is true in all those worlds.
