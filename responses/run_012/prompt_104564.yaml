  # Seminar Handout: Desiderata for an Account of Mental Disorder

  To evaluate Thomas Szasz's claim that "mental illness is a myth," we cannot simply argue against the slogan. We must argue against a *specification* of the concept. To do this, we need a scorecard. The following list sets out the desiderata (requirements) that any adequate philosophical account of mental disorder must satisfy. These criteria test whether a definition captures the right cases, maintains necessary conceptual boundaries, and functions within our social institutions.

  ## I. Extensional Adequacy (Classification of Cases)
  *An account must correctly categorize specific conditions, accounting for historical and contemporary shifts.*

  **1. The Historical Correction Requirement**
  *   **Requirement:** The account must explain why conditions once classified as disorders (e.g., drapetomania, homosexuality) are now correctly viewed as ordinary variation or social constructs, without denying the reality of current disorders.
  *   **Consideration:** Prevents the medicalization of social non-conformity and acknowledges scientific/moral progress.
  *   **Status:** **Non-negotiable.** (Any theory that validates past pathologizing of homosexuality is rejected by contemporary consensus.)

  **2. The Moral-Medical Shift Requirement**
  *   **Requirement:** The account must accommodate conditions formerly viewed as vice or crime (e.g., alcoholism, gambling disorder) that are now treated as disorders, explaining the shift without reducing the disorder merely to a change in moral attitude.
  *   **Consideration:** Acknowledges the "medicalization of morality" while demanding a substantive difference between sin and sickness.
  *   **Status:** **Camp Commitment.** (Strict biological naturalists may resist this; pragmatists accept it.)

  **3. The Treatment-Response Requirement**
  *   **Requirement:** The account must address conditions that respond reliably to medical intervention (e.g., ADHD, schizophrenia) even if their underlying biological etiology is disputed or heterogeneous.
  *   **Consideration:** Validates clinical efficacy; if a treatment works, the target cannot be purely mythical.
  *   **Status:** **Non-negotiable.** (Denying the reality of treatment-responsive conditions undermines the practice of psychiatry.)

  **4. The Borderline Sensitivity Requirement**
  *   **Requirement:** The account must distinguish between disorder and intense but normal human experiences (e.g., prolonged grief vs. major depression; attenuated psychosis vs. eccentricity).
  *   **Consideration:** Prevents over-diagnosis and preserves the concept of a "healthy range" of human functioning.
  *   **Status:** **Non-negotiable.** (DSM-5 and ICD-11 explicitly attempt to mark these boundaries.)

  ## II. Intensional Adequacy (Conceptual Distinctions)
  *An account must not collapse distinct concepts into one another.*

  **5. The Disorder-Deviance Distinction**
  *   **Requirement:** The account must distinguish statistical or social deviance from pathological dysfunction. Being rare or unpopular is not sufficient for disorder.
  *   **Consideration:** This is the core of Szasz's critique. A valid theory must identify a *mechanism* or *failure* beyond mere difference.
  *   **Status:** **Non-negotiable.** (The foundational axiom of psychiatry.)

  **6. The Disorder-Disability Distinction**
  *   **Requirement:** The account must distinguish internal dysfunction from external disablement. A person can be disabled by society (e.g., deafness in a hearing world) without having a mental disorder, and vice versa.
  *   **Consideration:** Respects the Social Model of Disability while maintaining a Medical Model of Disorder.
  *   **Status:** **Camp Commitment.** (Some social constructionists collapse these; most clinicians do not.)

  **7. The Distress-Impairment Distinction**
  *   **Requirement:** The account must distinguish the *fact* of subjective distress from the *judgment* that a cognitive or behavioral capacity is impaired. (e.g., Psychopathy involves impairment without distress; Anxiety involves distress without obvious capacity failure).
  *   **Consideration:** Ensures that "feeling bad" is not synonymous with "being broken."
  *   **Status:** **Non-negotiable.** (Required for accurate diagnosis.)

  ## III. Institutional Constraints (Practical Utility)
  *An account must function within the legal, medical, and economic systems that use it.*

  **8. The Treatment Licensing Constraint**
  *   **Requirement:** A diagnosis must provide the authority/justification for medical intervention (pharmacological or therapeutic) that would otherwise be unethical or illegal.
  *   **Consideration:** Connects ontology to ethics. If it's not a disorder, coercive or invasive treatment is battery.
  *   **Status:** **Non-negotiable.** (Central to medical ethics.)

  **9. The Responsibility Excuse Constraint**
  *   **Requirement:** The account must clarify when a disorder mitigates legal responsibility (insanity defenses) and when it does not.
  *   **Consideration:** Law requires a threshold of agency; medicine identifies barriers to agency. The concept must bridge them.
  *   **Status:** **Camp Commitment.** (Legal standards vary by jurisdiction; some argue disorder never excuses conduct.)

  **10. The Unified Utility Constraint**
  *   **Requirement:** One category of "mental disorder" must serve clinicians (treatment), insurers (reimbursement), and courts (responsibility) simultaneously.
  *   **Consideration:** We do not have separate concepts for "clinical disorder," "legal disorder," and "billing disorder." The definition must be robust enough for all three.
  *   **Status:** **Highly Contested.** (Many philosophers argue this is impossible and we should have pluralistic concepts.)

  ***

  ## Analysis of the Desiderata

  ### Non-Negotiable vs. Camp Commitments
  *   **Non-Negotiable:** Requirements 1, 3, 4, 5, 7, 8. These represent the baseline consensus required for a theory to be taken seriously in modern bioethics and psychiatry. If a theory pathologizes homosexuality (fails #1) or cannot distinguish distress from dysfunction (fails #7), it is generally discarded.
  *   **Camp Commitments:** Requirements 2, 6, 9, 10. These depend on one's stance on medicalization, the social model of disability, and legal philosophy. A strict biological naturalist might reject #2 (vice is not disease). A legal skeptic might reject #9.

  ### The Exclusionary Criterion
  The requirement that does the most to exclude candidate theories is **#5: The Disorder-Deviance Distinction**, closely followed by **#10: The Unified Utility Constraint**.
  *   **Why #5?** It forces a theory to thread the needle between *objectivity* (finding a factual dysfunction) and *normativity* (acknowledging harm). Pure naturalists fail because they cannot define "dysfunction" without values; pure normativists fail because they collapse disorder into deviance (Szasz's trap).
  *   **Why #10?** It is pragmatically the hardest to satisfy. A definition precise enough for the court (agency) is often too narrow for the clinic (suffering), and a definition broad enough for insurers (billing) is often too vague for science. Most theories break here.

  ***

  ## Brief Evaluation: Szasz vs. Naturalism

  To demonstrate the utility of this scorecard, here is how two opposing positions fare.

  ### 1. Thomas Szasz (The "Myth" Position)
  *   **Performance:** Szasz rigorously satisfies **#5 (Disorder-Deviance)** by arguing that without a bodily lesion, there is no disease, only deviance. He excels at **#1 (Historical Correction)**, correctly identifying that past diagnoses were often social control.
  *   **Failures:** He catastrophically fails **#3 (Treatment-Response)** and **#8 (Treatment Licensing)**. If mental illness is a myth, pharmacological intervention is chemically restraining free citizens, and therapy is merely persuasion. He also fails **#10 (Unified Utility)**, as his framework offers no workable alternative for insurers or courts other than abolishing psychiatry.
  *   **Verdict:** Szasz's account is conceptually pure regarding deviance but practically untenable regarding medical utility.

  ### 2. Naturalistic Alternative (e.g., Wakefield's Harmful Dysfunction)
  *   **Performance:** This analysis posits disorder as a *failure of evolved function* (fact) + *harm* (value). It satisfies **#5 (Disorder-Deviance)** by grounding disorder in evolutionary facts, not just norms. It handles **#1 (Historical Correction)** well (homosexuality is not a dysfunction of a sexual mechanism). It respects **#7 (Distress-Impairment)** by focusing on mechanism failure.
  *   **Failures:** It struggles with **#2 (Moral-Medical Shift)**. Explaining addiction or gambling as "evolutionary dysfunction" is theoretically difficult. It also strains under **#10 (Unified Utility)**; proving "evolutionary dysfunction" is impossible in a courtroom or a 15-minute clinic visit.
  *   **Verdict:** Philosophically robust on distinctions, but operationally difficult to apply in real-time institutional contexts.

  ### Instruction for Students
  When you argue against Szasz, do not simply assert "mental illness is real." Use the scorecard. Show where Szasz's specification fails the **Non-Negotiable** criteria (specifically #3 and #8). Then, propose a specification (like Harmful Dysfunction or a Pragmatic account) that satisfies more of the list, acknowledging where it must make **Camp Commitments**.
