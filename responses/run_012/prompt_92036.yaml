answer: |-
  Hi Professor, here is the draft for the exam question and the accompanying materials you requested for the seminar. I have tried to frame it in a way that pushes the students beyond the standard summary of the debate and forces them to engage with the underlying epistemological claims. Below is the question text followed by the model answer and then the marking scheme I propose we use.

  Imagine a central planner equipped with a computer capable of solving the full general-equilibrium optimization problem instantly, given any data fed into it. This computational planner bypasses the 1930s limitation of computational tractability. Your task is to evaluate whether this technology dissolves the socialist calculation problem or merely relocates it. Specifically, analyze Hayek's argument regarding the knowledge of particular circumstances of time and place. Is this argument fundamentally about computational limits, incentive structures, or the ontological status of preferences? Determine if a computationally unlimited planner still faces this hurdle, and if so, in what form. Finally, assess the claim that the information problem is just a bandwidth problem, committing to where this characterization succeeds and where it fails.

  The introduction of a computationally unlimited planner ostensibly solves the mathematical problem of general equilibrium, but it fails to address the epistemological core of Hayek's critique. Hayek was not arguing that the equations of equilibrium were too complex for human brains; he was arguing that the data required to solve those equations does not exist in a centralized form prior to market action. The computational planner assumes that preferences, resource constraints, and technological possibilities are static data points waiting to be uploaded. However, Hayek's knowledge problem posits that much of the relevant knowledge is tacit, contextual, and dispersed. It is the knowledge of the particular circumstances of time and place, such as a machine operator knowing a specific tool is about to fail or a local merchant knowing a shift in consumer taste. This knowledge is not merely costly to transmit; it is often only articulated through the act of decision-making itself.

  Therefore, even with infinite computing power, the planner faces the problem of data generation. The bandwidth argument suggests that if we simply build a larger pipe, the information will flow to the center. This move misses the point that the information is not sitting at the periphery waiting to be sent. It is created through the process of exchange and price formation. Prices are not just signals transmitting known scarcity; they are mechanisms that compress dispersed information into a usable form. Without the market process, there is no price, and without the price, the data does not exist to be fed into the computer. The planner is not facing a bottleneck in transmission but a void in existence. The bandwidth claim gets it right only insofar as communication technology matters, but it goes wrong by assuming the content of communication is pre-formed rather than emergent.

  Furthermore, the computational planner does not dissolve the incentive problem. Even if the data could exist, agents must have the incentive to report it truthfully. In a market, truthfulness is enforced by profit and loss. If I know a resource is scarce and I price it correctly, I am rewarded. If I lie, I bear the cost. In a planned system, local managers may hide capacity or exaggerate needs to meet quotas or secure slack. The computer can optimize given true data, but it cannot compel the truthfulness of the data entry. Thus, the calculation problem relocates from the solution of equations to the generation and verification of inputs. The planner might solve the math, but it cannot solve the politics of information hiding.

  Finally, preferences themselves are not fixed parameters. They are revealed through choice under constraint. A planner assuming fixed preference functions is optimizing for a ghost. The market process allows preferences to evolve and be discovered through experimentation. A computer optimizing based on historical data cannot account for the entrepreneurial discovery of new wants or new means. Consequently, the computational planner fails because it treats the economy as a static engineering problem rather than a dynamic process of discovery. The limitation is not computational tractability but the ontological status of the information required. The bandwidth move fails because it conflates transmission costs with the existence of the signal. Hayek's argument holds because the knowledge is not merely decentralized; it is inherently local and often ineffable until utilized in a specific context. The planner remains blind not because it cannot calculate, but because there is nothing to calculate until the market acts. The calculation problem is not solved by speed; it is dissolved only by the institutional structure that generates the data in the first place.

  For grading, I propose a scheme out of twenty points that rewards analytical precision over historical recitation. An A-grade response, scoring between seventeen and twenty points, must explicitly separate the knowledge problem from the incentive problem rather than conflating them. These students should argue that Hayek's point is ontological regarding the existence of data, not merely technical regarding its transmission. They must also commit to the claim that preferences are revealed through market processes rather than being static inputs available to the planner. To secure the top marks, the answer must critique the bandwidth argument by distinguishing between transmission costs and the emergence of information. A B-grade response, scoring between thirteen and sixteen points, will likely summarize Hayek's position accurately but may treat the knowledge problem as purely a matter of computational complexity or communication costs. These answers might acknowledge the incentive problem but fail to integrate it into the calculation critique, or they may accept the bandwidth argument partially without identifying the ontological error. A C-grade response, scoring between ten and twelve points, will tend to treat the question as a history of thought exercise, reciting the Mises-Lange-Hayek positions without applying them to the computational planner scenario. These answers often assume the computer solves the problem if it is fast enough, missing the point about data existence entirely. The remaining points are allocated for clarity, structure, and adherence to the word limit. I think this distinguishes the students who understand the theory from those who have just memorized the names. Let me know if you want any adjustments to the weighting or the phrasing before I finalize the exam paper.
