answer: |-
  You have identified a genuine and structurally significant epistemic failure, one that is pervasive in philosophy of mind, cognitive science, and the rationalist diaspora.

  **The Short Answer:** There is no single, canonical term (like *ad hominem* or *straw man*) that precisely names this specific asymmetry regarding introspective evidence. It is not the "Introspection Illusion" (which is about self/other asymmetry), nor is it merely "Confirmation Bias" (which is too broad).

  However, it is a recognized structural problem. In philosophy of science, it is best understood as a specific species of **Immunizing Stratagem** (Popper) applied to **First-Person Data**. In the specific context of consciousness and free will debates, it is often discussed under the header of **"The Incoherence of Illusionism"** or **"Self-Defeating Error Theories,"** though these terms usually describe the *result* rather than the *move* itself.

  If we are to carve this concept precisely, as you request, the most accurate descriptive label is **Asymmetric Introspective Skepticism (AIS)**.

  Below is the precise carving of the phenomenon, its distinction from nearby concepts, and the conditions under which it might actually be valid.

  ---

  ### 1. The Carve: Asymmetric Introspective Skepticism

  **Definition:**
  Asymmetric Introspective Skepticism is an evidential policy in which the veridicality of introspective reports is conditioned on their alignment with a pre-existing mechanistic or deflationary hypothesis ($H$).

  **The Structure:**
  1.  **Hypothesis ($H$):** A deflationary account of a mental phenomenon (e.g., "Free will is an illusion," "Emotions are post-hoc constructions").
  2.  **Data ($D$):** An introspective report from a subject (e.g., "I felt I chose," "I felt a reason").
  3.  **The Asymmetric Rule:**
      *   If $D$ is consistent with $H$ (e.g., "I looked and found no chooser"), $D$ is treated as **Veridical Data**. The introspective faculty is deemed transparent and authoritative.
      *   If $D$ is inconsistent with $H$ (e.g., "I looked and found a chooser"), $D$ is treated as **Systematic Error**. The introspective faculty is deemed opaque, and the report is explained as a confabulation generated by the very mechanism $H$ posits.
  4.  **The Closure:** The explanation for the error in the second case relies on the truth of $H$. Thus, $H$ is used to validate the data that supports $H$ and invalidate the data that contradicts $H$.

  **Why this is distinct from "Introspection is Unreliable":**
  A general skeptic argues that *all* introspective reports are unreliable (Uniform Skepticism). They would treat the report "I found no chooser" with the same suspicion as "I found a chooser." AIS selectively turns skepticism on and off based on theoretical utility.

  **Why this is distinct from "Confirmation Bias":**
  Confirmation bias is usually a subconscious weighting of evidence. AIS is often presented as a *principled epistemic stance*. The proponent argues they are not ignoring evidence, but correctly categorizing "noise" (confabulation) vs. "signal" (accurate reporting). The asymmetry is invisible to them because the theory *defines* what counts as noise.

  ### 2. Relationship to Established Concepts

  Here is how AIS fits into existing taxonomies, and where the fit breaks:

  | Concept | Fit | Break Point |
  | :--- | :--- | :--- |
  | **Immunizing Stratagem** (Popper) | **High.** This is the parent category. An immunizing stratagem modifies a theory to make it unfalsifiable. | Popper's concept is general. AIS specifies the *mechanism*: using the theory to debunk the specific class of evidence (introspection) that could falsify it. |
  | **Error Theory** (Mackie/Joyce) | **Medium.** Error theories claim our ordinary discourse is systematically false. | Standard error theories explain *why* the error occurs (e.g., evolutionary utility) without necessarily relying on the error theory itself to debunk the *report* of the error in a circular way. AIS makes the *report* of the error the primary evidence for the theory. |
  | **Theory-Ladenness** (Hanson) | **Medium.** All observation is influenced by theory. | Theory-ladenness suggests we *see* differently. AIS suggests we *trust* differently. One can acknowledge theory-ladenness without dismissing contradictory reports as confabulation. |
  | **Fully General Counterargument** (Yudkowsky) | **High (Rationalist context).** If you can explain away any counter-report as "bias" or "confabulation," you have a fully general counterargument. | The rationalist term usually implies a blanket dismissal. AIS is more subtle: it accepts introspection when it agrees, making it look like engagement rather than dismissal. |
  | **Introspection Illusion** (Pronin) | **Low.** | As you noted, this is about Self vs. Other. AIS is about Theory-Consistent vs. Theory-Inconsistent. |

  ### 3. Evidential Status: Content vs. Mechanism

  You asked whether a report can be evidence about mechanism at all, or only about content. This is the crux of the carving.

  *   **Reports as Content:** An introspective report is *always* valid evidence of the *content* of the experience. If I say "I feel a will," it is an undeniable fact that *I feel a will*.
  *   **Reports as Mechanism:** An introspective report is *never* direct evidence of the *underlying mechanism*. The feeling of will does not prove a non-mechanical will exists (the Phenomenological Fallacy).

  **The AIS Failure:**
  The deflationary proponent correctly notes that Reports $\neq$ Mechanism. However, they then commit the inverse error: they treat Reports *consistent with their Mechanism* as if they *do* reveal Mechanism (or lack thereof).
  *   "I feel no will" is treated as evidence that *there is no will mechanism*.
  *   "I feel will" is treated as evidence that *there is a confabulation mechanism*.

  Both inferences require a bridge principle. AIS applies the bridge principle ("Introspection reveals underlying reality") only when the destination is deflationary. When the destination is robust, the bridge principle is swapped for ("Introspection hides underlying reality").

  ### 4. Individual vs. Distributed

  You asked whether the flip must occur within a single reasoner.
  **Verdict:** It is frequently **Distributed**.

  In a research literature or community (like the rationalist sphere), this often functions as a **Paradigmatic Division of Labor** (Kuhn/Lakatos).
  *   **Researcher A** produces the deflationary model and argues that introspection is generally unreliable regarding this phenomenon.
  *   **Researcher B** produces introspective data that fits the model ("I looked and saw nothing").
  *   **Researcher C** handles the counter-reports ("I saw a will") by classifying them as "folk psychological confabulations."

  No single person needs to explicitly contradict themselves. The *system* maintains the asymmetry. This makes it harder to detect because it appears as a consensus rather than an individual fallacy. It becomes a **Community-Level Immunizing Stratagem**.

  ### 5. When is this move *not* a fallacy?

  This is the most critical part of the carve. There are conditions under which treating contradictory introspective reports as confabulation is scientifically valid.

  **The Independent Prediction Condition:**
  The move is valid *only if* the deflationary theory ($H$) predicts the specific introspective error *independently* of the introspective data itself.

  *   **Invalid (AIS):** "Free will doesn't exist. You say it does? That's just your brain confabulating free will." (The confabulation is posited *because* the report contradicts the theory).
  *   **Valid:** "Free will doesn't exist. Our model of neural decision-making shows a 200ms delay between unconscious initiation and conscious awareness. Therefore, we predict subjects will *report* making a decision after the decision is already made, even if they didn't." (The confabulation is predicted by independent mechanistic data, e.g., Libet-style experiments or fMRI, not just by the theory's need to survive).

  If the theory can predict the *specific structure* of the introspective error using third-person data (neuroscience, behavioral economics) without referencing the introspective report itself, then dismissing the report is not AIS; it is standard scientific override of appearance by mechanism.

  **The Failure Point:**
  AIS occurs when the *only* evidence for the confabulation mechanism is the existence of the contradictory report itself. If the explanation for why you are wrong is "Because my theory says you are wrong," it is AIS.

  ### 6. Proposed Name and Summary

  Since no established term captures the *asymmetry* specifically, I propose we label this **Asymmetric Introspective Skepticism (AIS)**.

  **Summary Definition:**
  > **Asymmetric Introspective Skepticism** is an epistemic policy wherein introspective reports are granted authority as windows onto mental machinery when they align with a deflationary hypothesis, but are dismissed as confabulations generated by that machinery when they contradict it, without independent evidence for the confabulation mechanism.

  ### 7. What Would Change My Verdict?

  You asked what would convince me that this is not a distinct phenomenon but just an instance of something already known.

  **1. If it reduces to "Bayesian Updating with Strong Priors":**
  If one can demonstrate that the deflationary theory is so strongly supported by *third-person* evidence (neuroscience, physics) that the prior probability of the theory is near 1.0, then treating contradictory introspective reports as error is just rational Bayesian updating. In this case, AIS is not a fallacy, but a feature of high-confidence theorizing.
  *   *Where I might be wrong:* I am assuming the third-person evidence is rarely strong enough to warrant this. If the neuroscience of decision-making is actually as settled as the neuroscience of vision, then dismissing "I felt a will" is no different than dismissing "The sun moved around the earth."

  **2. If it is subsumed by "The Criterion Problem":**
  Philosophers like Eric Schwitzgebel argue that *all* introspective trust requires a theory. There is no "raw" introspection. If trust is *always* theory-laden, then "asymmetry" is inevitable. Every theory will trust introspection sometimes and distrust it other times.
  *   *Where I might be wrong:* I am assuming there is a "symmetric" way to handle introspection (e.g., Phenomenological Conservatism). If symmetry is impossible, then AIS is just "The Human Condition," not a specific argumentative failure.

  **3. If a Canonical Term Exists in Niche Literature:**
  It is possible that in the specific literature on **Illusionism about Consciousness** (e.g., Keith Frankish, Daniel Dennett) or **Error Theory in Metaethics**, this move has a name like **"The Phenomenological Override"** or **"The Explanatory Exemption."**
  *   *Where I might be wrong:* My search is based on general philosophy of mind and rationalist discourse. If a specific sub-field has named this (e.g., "The Illusionist's Wager"), I would defer to that. However, my analysis suggests that proponents of these views generally defend the move as necessary, rather than naming it as a distinct rhetorical structure.

  ### Final Recommendation

  If you use this concept in writing or argument, do not rely on a single existing label. Use **Asymmetric Introspective Skepticism** and define it structurally as above. This prevents opponents from deflecting by saying, "Oh, you just mean Confirmation Bias," or "You just mean Introspection is hard."

  The power of the carve is in highlighting that the *reliability of the instrument* is being toggled based on the *reading of the dial*. That is the specific failure mode you have identified.
