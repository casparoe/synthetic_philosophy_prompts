prompt: |-
  My epistemology prof handed out a one-page summary of the testimony debate to study from, and I've been using it to write an essay, but a couple of things in it feel off and I can't tell if that's me being confused or the handout being sloppy. Here's basically what it says, cleaned up a bit:

  'Reductionism is the view that testimony is never a basic source of justification: since we can't directly perceive what's in other people's heads, any beleif we form on the basis of what someone tells us has to be backed up by non-testimonial evidence — we've observed over and over that people usually tell the truth, so we infer that this particular speaker is probably doing so too. Anti-reductionists like Reid and Burge think this gets both the psychology and the epistemology wrong: they hold that we're entitled to believe what we're told straight off, with no reasons required, because our nature makes credulity the default (Reid says God designed us this way), and because that entitlement is a default it can't be taken away by whatever evidence you might later get about the speaker. Lackey is the leading anti-reductionist these days; on her view testimony is basically like perception, so the hearer needs no reason at all and the speaker's own reliability doesn't really enter into it. Really the whole debate just comes down to whether testimony can generate knowledge or only pass it along — reductionists say it can't generate anything new, anti-reductionists say it can.'

  I'm inclined to think most of this is right, just maybe compressed. Can you go through it claim by claim and tell me what's accurate, what's a standard simplification that a careful person would want flagged, and what's just wrong? And if any of the wrong bits are doing work in that last sentence about generating vs passing along knowledge, I'd like to know whether that conclusion still stands once the earlier stuff is fixed — I don't want to build my whole essay on a misreading. Also, if it matters, someone in my study group said the reductionist label gets pinned on Hume in a way Hume himself might not have recognised, but I have no idea if that's a real point or just him being contrarian, so a word on that would help too. No need for reading lists, I just want to know what to trust.
