  **MEMORANDUM**

  **TO:** Board of Directors, Foundation for Memorialization and Victim Support
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Grant Allocation Methodology – Comparative Severity Index

  **1. Purpose**
  This memo circulates the Board's decision regarding the program staff's proposal to utilize a "Comparative Severity Index" (CSI) for the upcoming grant round. The proposal suggests scoring candidate cases (genocide, mass famine, forced displacement, state detention/killing) on five dimensions (0–10), averaging them, and allocating budget proportionally, with a "non-comparability clause" for high-threshold cases. After review, the Board cannot adopt the CSI in its current form.

  **2. Measurement Validity: The Physics Analogy**
  As a physicist, I must address the metrological assumptions underpinning the CSI. The proposal averages ordinal scores (rankings) to produce a cardinal index (a measurable quantity). In experimental physics, this is permissible only if the units are defined on an interval or ratio scale with a known zero point and consistent magnitude (e.g., meters, Kelvin). A score of "8" in dehumanization must represent exactly twice the magnitude of a "4," and the distance between 4 and 5 must equal the distance between 8 and 9.

  Moral dimensions lack these operational definitions. There is no standard unit of "systematicity" or "intent." Averaging these scores creates a false precision, akin to averaging rankings of hardness (Mohs scale) to calculate density. The analogy holds: we are attempting to measure moral weight with instruments calibrated for physical mass. The CSI presupposes a kind of measurement our instruments never had. Consequently, the index is scientifically invalid.

  **3. Ethical Considerations: The Hierarchy of Suffering**
  Beyond measurement error, the proposal raises profound moral hazards. Our partners in post-conflict societies have voiced that ranking evils is not merely imprecise but obscene. To assign a higher numerical value to one victim group's suffering than another's implies a hierarchy of victimhood. This compounds the wrong by suggesting some victims are "more worthy" of support.

  The "non-comparability clause" attempts to mitigate this by lifting extreme cases to a top tier. However, this admits the flaw while maintaining the structure. It creates a binary of "comparable" vs. "incomparable" suffering, still leaving the remaining cases (e.g., forced displacement vs. detention) in a competitive ranking. This risks invalidating the experiences of those in the lower tiers and may deter applications from communities fearing their trauma will be numerically diminished.

  **4. Specific Objections for Staff Resolution**
  To move forward, program staff must address the following specific objections in a revised protocol:
  *   **Inter-rater Reliability:** How do we ensure different evaluators score "denial of victim agency" consistently without a standardized unit of measurement?
  *   **Weighting Arbitrariness:** Why are the five dimensions weighted equally? Does "intent" matter more than "scale"? The average presupposes equal weight without justification.
  *   **Threshold Definition:** What specific metric determines the "non-comparability" threshold? If arbitrary, it invites accusations of bias.
  *   **Victim Perception:** How will we communicate to a funded group that they scored a 6.5 while another scored an 8.2? This data cannot remain internal without risking reputational harm to partners.

  **5. Decision and Recommendation**
  The Board recognizes the necessity of allocating limited resources. However, we cannot do so via a mechanism that falsifies data and risks moral harm. Therefore, the Board directs the following:

  *   **Reject** the Comparative Severity Index and the averaging methodology.
  *   **Adopt** a Qualitative Multi-Criteria Framework. Cases will be assessed on the same five dimensions, but not aggregated into a single number.
  *   **Allocate** funds based on a deliberative matrix that considers severity alongside *capacity to absorb funds*, *urgency of need*, and *feasibility of memorialization*, without ranking victim worth.
  *   **Ensure** that all four candidate cases receive funding consideration, potentially tiered by budget size rather than moral severity.

  **6. Timeframe**
  Program staff are directed to revise the allocation protocol according to these conditions. The revised framework must be submitted for Board approval within 14 days to ensure the grant round opens on schedule.

  **7. Conclusion**
  We must act with rigor in both our ethics and our metrics. We cannot measure the unmeasurable, nor should we try. Let us fund based on need and possibility, not on a false calculus of pain.

  ***

