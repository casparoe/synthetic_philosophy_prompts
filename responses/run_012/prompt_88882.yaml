answer: |-
  Here is a ranking of the items into four tiers, arranged by the evidential weight they bear against intellectualism (the view that knowing-how is a species of knowing-that). The tiers move from cases that force the intellectualist into a costly retreat to cases they can absorb without breaking stride.

  ### Tier 1: The Normative Gap
  **Item (7): The capacity to tell when a rule one has been following no longer applies.**

  *   **Defender's Claim:** This case targets the mechanism of reduction itself. The defender claims that no proposition (rule) contains the instructions for its own application. To apply a rule to a novel case requires a judgment that is not itself dictated by a further rule, on pain of regress. This judgment is a practical capacity, not a theoretical truth.
  *   **Intellectualist's Absorption:** The intellectualist must claim that the agent knows a higher-order proposition regarding the conditions of the rule's applicability. They must argue that the "gap" is merely epistemic (we haven't found the proposition yet) rather than ontological.
  *   **Assessment:** **Ad hoc and costly.** This absorption looks desperate because it invites an infinite regress. If applying the first rule requires knowing a second proposition, applying the second requires a third. To stop the regress, the intellectualist must eventually admit a capacity for judgment that is not itself propositional knowledge. This item strikes at the *structure* of the intellectualist's reduction, not merely its psychological plausibility.

  ### Tier 2: The Temporal and Perceptual Limits
  **Item (2): A jazz improviser's capacity to respond to the phrase the bassist has just played.**
  **Item (3): A taster's capacity to identify a wine, including degrees of competence.**

  *   **Defender's Claim (Jazz):** The temporal pressure is too severe for the retrieval of propositional knowledge. The response is immediate and creative, not the conclusion of a silent syllogism.
  *   **Intellectualist's Absorption (Jazz):** They must claim the propositions are retrieved unconsciously and with extreme speed. The "feeling" of immediacy is a phenomenological illusion.
  *   **Assessment (Jazz):** **Strained.** While logically possible, this makes the propositional machinery otiose. If the proposition plays no conscious role and cannot be accessed in real-time, calling it "knowledge-that" stretches the concept of "knowledge" until it snaps.

  *   **Defender's Claim (Wine):** Discriminatory capacity outstrips descriptive resources. One can distinguish vintages without possessing the concepts required to state the difference propositionally.
  *   **Intellectualist's Absorption (Wine):** They rely on demonstrative concepts ("I know that *this* taste is the same as *that* one"). They argue the taster knows the proposition: *This wine is thus.*
  *   **Assessment (Wine):** **Principled but narrow.** This is a strong intellectualist move, but it concedes that the content of the knowledge is tied inextricably to the experience. It saves the "that" at the cost of making the proposition utterly dependent on the practical encounter. *Note: I am least confident here.* It is difficult to prove the taster lacks the demonstrative concept, but it is equally hard to prove they possess a truth-evaluable content distinct from the ability to discriminate.

  ### Tier 3: The Absorbable Arguments
  **Item (1): Knowing how to ride a bicycle (including inarticulacy).**
  **Item (5): Knowing how to speak one's native language (including tacit grammar).**
  **Item (8): The gradability criterion.**

  *   **Defender's Claim (Bicycle):** Competent riders cannot articulate the physics of balance; therefore, they do not possess propositions.
  *   **Intellectualist's Absorption (Bicycle):** They distinguish *possessing* a proposition from *articulating* it. They introduce "practical modes of presentation." One can know a truth under a mode that does not permit linguistic translation.
  *   **Assessment (Bicycle):** **Principled.** This is the standard intellectualist counter-move. It costs them a more complex theory of propositional attitudes, but it does not break the theory. This is why you dread the example: it is the one the intellectualist is best prepared to digest.

  *   **Defender's Claim (Language):** Speakers follow grammatical rules they cannot state; therefore, their knowledge is practical, not theoretical.
  *   **Intellectualist's Absorption (Language):** They claim this is paradigmatic *tacit propositional knowledge*. The grammar exists as a truth in the mind, merely inaccessible to consciousness.
  *   **Assessment (Language):** **Principled.** Intellectualists often claim this case as their own. It does little work for the anti-intellectualist because the intellectualist framework is designed to accommodate tacit rules.

  *   **Defender's Claim (Gradability):** Knowing-how comes in degrees (better/worse); knowing-that is binary (true/false). Therefore, they are different kinds.
  *   **Intellectualist's Absorption (Gradability):** They argue that propositional knowledge is also gradable (depth of understanding, justification, coherence). One can know physics "better" than another by knowing more truths or knowing them more securely.
  *   **Assessment (Criterion Failure):** **Principled.** As a sorting criterion, gradability cuts across the list in the wrong place. It fails to isolate practical knowledge because theoretical knowledge is also sensitive to degrees of competence. It survives only if one holds a very rigid, binary view of propositional knowledge which most epistemologists already reject.

  ### Tier 4: The Category Mistakes
  **Item (4): Knowing what it is like to see red.**
  **Item (6): Knowing the way to the station from here.**

  *   **Defender's Claim (Red):** After having the experience, the subject has new knowledge despite having all the physical facts.
  *   **Intellectualist's Absorption (Red):** They argue this is a new mode of presentation of an old fact, or simply a different category (phenomenal knowledge) entirely.
  *   **Assessment:** **No Work.** This is an argument about *qualia*, not *skill*. It does not bear on the knowing-how/knowing-that distinction because "knowing what it is like" is not obviously a form of "knowing how." It is a distractor.

  *   **Defender's Claim (Route):** Knowing the route is embodied navigation, distinct from knowing the map.
  *   **Intellectualist's Absorption (Route):** They claim "knowing the way" is simply knowing the proposition: *Turn left at x, then right at y.*
  *   **Assessment:** **No Work.** This is trivially reducible. The intellectualist absorbs this at zero cost. It provides no friction against the reductionist view.

  ***

  ### Items Doing No Work
  The items a well-constructed intellectualism absorbs at **no cost** are **(4)** and **(6)**.
  *   **(4)** is a category error in this context; it addresses phenomenal knowledge, not practical competence. Using it confuses the seminar by shifting the topic from *ability* to *experience*.
  *   **(6)** is easily propositionalized without straining the concept of truth. It offers no resistance to the intellectualist framework.

  I would also suggest that **(1)** and **(5)** are doing very little work, though they cost the intellectualist some theoretical complexity (modes of presentation, tacit structures). They are "absorbable," whereas (4) and (6) are "invisible" to the argument.

  ### The Single Item to Keep
  If I could keep only one, I would keep **(7): The capacity to tell when a rule no longer applies.**

  **Reason:** This is the only item that forces the intellectualist to confront the *normativity* of the distinction rather than just the psychology. Items (1), (2), and (5) are psychological claims about speed, articulacy, or consciousness, which the intellectualist can bypass by positing unconscious or non-linguistic propositions. Item (7) is logical: it argues that the relation between a rule and a case is not itself a rule. If the students mishandle this, they miss the Wittgensteinian point that practice is not the shadow of theory, but the ground upon which theory stands. It prevents the seminar from collapsing into a debate about "hidden mental sentences" and forces a debate about the nature of judgment itself.

  ### A Note on Confidence
  I am most confident in the ranking of **(7)** as the strongest and **(4)/(6)** as the weakest. I am least confident regarding **(3) (Wine Tasting)**. The intellectualist reply using demonstrative concepts ("I know that *this* is *that*") is sophisticated and may successfully absorb the case without ad hoc maneuvering. It is possible that (3) belongs in Tier 3 alongside the bicycle, as the "ineffability" of taste is often just a lack of vocabulary, not a lack of propositional content. However, I have kept it in Tier 2 because the *degrees of competence* aspect pairs poorly with a binary view of truth, even if the intellectualist has a reply for gradability generally.
