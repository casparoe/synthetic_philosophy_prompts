answer: |-
  # The Robustness Ladder: A Procedure for Filtering Panel Views

  This procedure is designed to distinguish between *formed judgments* (which you record) and *distorted preferences* (which you contextualize). It relies on three psychological mechanisms known to distort deliberation: **adaptive preference** (lowering expectations to match reality), **availability heuristic** (weighing recent/scary info too heavily), and **social desirability** (telling authority what it wants to hear).

  You cannot fix these perfectly in 90 minutes. You can only test for them. This ladder moves from least intrusive (asking the room) to most intrusive (your annotation).

  ## The Four Tests (Run in order)

  When a view is stated that affects others or seems suspicious, run these checks. If a view passes all four, it is **Record As Is**. If it fails one, move to the corresponding Remedy.

  ### 1. The Origin Test
  **Question:** "Is this view based on something you've experienced directly, or something you've heard about?"
  *   **Good Enough Answer:** "I take the bus every day" or "I read the paper." (Honesty counts as pass).
  *   **Fail Condition:** The view relies entirely on second-hand information (rumor, single news story) presented as fact.
  *   **Why:** People weigh vivid, recent stories heavier than data (availability heuristic).
  *   **Remedy (Rung 1):** **Peer Challenge.** Ask the room: "Does anyone have direct experience that contradicts this?" If no counter-evidence exists in the room, proceed to Test 2 but flag for Report Annotation.

  ### 2. The Stability Test
  **Question:** "If you knew for certain that [better option/safer reality] was possible, would you still want this?"
  *   **Good Enough Answer:** "Yes, because I value X over Y" or "No, I'd change my mind."
  *   **Fail Condition:** "I didn't know that was possible" followed by silence, or "I suppose so." (Indicates adaptive preference).
  *   **Why:** People often align wants with what they think is feasible (adaptive preference).
  *   **Remedy (Rung 2):** **Information Injection.** Provide the neutral fact immediately ("It is possible to run buses every 10 minutes"). Re-poll the view. If the view changes, record the new view. If it stays the same, proceed to Test 3.

  ### 3. The Cost Test
  **Question:** "Who pays for this or bears the risk? Is that fair?"
  *   **Good Enough Answer:** "We pay," "The council pays," or "The users pay," accompanied by acceptance.
  *   **Fail Condition:** "They pay" (where 'they' are vulnerable/unrepresented) without acknowledgment of burden.
  *   **Why:** NIMBYism often externalizes costs to unseen groups.
  *   **Remedy (Rung 3):** **Report Annotation.** You cannot force them to care, but you must record the externality. In the report, state the view and explicitly note the burden distribution.

  ### 4. The Mirror Test (Facilitator Check)
  **Question:** "Am I flagging this because of evidence from Tests 1-3, or because I disagree with the value?"
  *   **Good Enough Answer:** "I can point to a specific failure in Tests 1-3."
  *   **Fail Condition:** "It just feels wrong" or "This is prejudiced."
  *   **Why:** You are the bias risk. Your discomfort is not data.
  *   **Remedy (Rung 4):** **Step Back.** If you fail this test, you must not intervene. Hand the pen to a co-facilitator for this section of the report, or record the view **As Is** with a private note to yourself.

  ## The Verdicts

  1.  **Record As Is:** Passed all tests. Your job is done.
  2.  **Record with Context:** Failed Origin or Cost. Record the view, but add a neutral sentence explaining the information environment or cost distribution (e.g., "Panel noted this view following recent media coverage," or "Panel accepted this cost burden for non-participants").
  3.  **Record with Correction:** Failed Stability due to factual error. Record the view but append the corrected fact provided in the room.
  4.  **Record with Dissent:** Failed Mirror Test (You intervened anyway). You must explicitly state in the report: "Facilitator note: This view was challenged due to [reason], though panel maintained position." (Use sparingly; this damages legitimacy).

  ## Where the Procedure Ends (Judgment Calls)

  There are two points where you must decide without a rule:
  1.  **Sincerity vs. Resignation (The Bus Problem):** If they pass the Stability Test ("Yes, we want better") but their tone/body language suggests defeat, you must decide if that is a *value* (contentment) or a *constraint* (hopelessness). There is no test for this. You must guess. If you guess wrong, you either patronize them or ignore their oppression.
  2.  **Harm Threshold:** If a view passes all tests but implies harm to a protected group (e.g., "No hostels"), you must decide if "Record with Context" is enough or if you escalate to "Record with Dissent." The procedure says "Record with Context," but your legal/ethical duty may override this. That is a personal liability decision, not a facilitation one.

  ---

  # Case Runs

  ### Case 1: The Bus Panel (Adaptive Preference)
  **Scenario:** Panel from a neglected estate says buses are "fine." You suspect they have given up.
  **Run:**
  *   **Origin:** Pass (They ride them).
  *   **Stability:** You ask, "If frequent service was possible, would you want it?" They say, "Probably, but it never happens."
  *   **Judgment Call:** This is the knot. They admit they want better *conditionally*, but condition it on impossibility.
  *   **Decision:** They failed Stability (view depends on false constraint).
  *   **Remedy:** You inject info: "The council is reviewing routes now." They say, "Oh, well then we want more."
  *   **Wait, Constraint:** You said "At least one... should come out in a way I won't like."
  *   **Adjustment:** Let's say you ask the Stability question. They say, "No, honestly, more buses bring noise. We like it quiet." You suspect this is rationalization. But they pass the test verbally.
  *   **Outcome:** You must **Record As Is**. You suspect resignation, but they articulate a value (quiet over frequency). You won't like this because you believe they are oppressed, but the procedure forces you to respect their stated value.

  ### Case 2: The Ex-Offender Hostel (Availability Heuristic)
  **Scenario:** Panel votes against hostel after scary newspaper story.
  **Run:**
  *   **Origin:** Fail. View based on one newspaper story, no direct experience.
  *   **Remedy (Rung 1):** Peer Challenge. You ask, "Does anyone know actual recidivism data?" No one does.
  *   **Action:** You provide neutral data (Rung 2): "National stats show supervised hostels reduce re-offending by X%."
  *   **Result:** Panel maintains view ("Still too risky for *our* street").
  *   **Outcome:** **Record with Context.** They have a right to risk aversion, but the origin was skewed.
  *   **Note:** You annotate that the view formed following specific media coverage and despite contrary data provided in session.

  ### Case 3: The Factual Claim (Unknown Correction)
  **Scenario:** Panel says "The current grant system saves money." It actually costs more. You didn't know how to raise this in the room without sounding argumentative.
  **Run:**
  *   **Origin:** Fail (Second-hand info).
  *   **Stability:** Fail (Based on false premise).
  *   **Remedy:** You couldn't inject info in the room (per scenario).
  *   **Action:** Post-Session Fact Check.
  *   **Outcome:** **Record with Correction.**
  *   **Note:** You record their preference for the system but annotate that the cost premise was factually incorrect based on council data available at time of writing.

