answer: |-
  **Materials:** Whiteboard, marker, timer, Register sheet (columns: Case Description, Checklist Met?, Class Vote).

  **Setup (10 min):** Divide class into Team A and Team B (8 each). Select Chair (rotate every 2 rounds). Write Checklist on board: (1) Subject believes p, (2) Subject has evidence for p, (3) p is true. Rule: If 1–3 are met, the case enters the Register as Knowledge unless voted otherwise.

  **Game Rules (50 min):**
  1.  **Challenge:** Active team presents an ordinary case satisfying the current Checklist but intuitively *not* knowledge.
  2.  **Verification:** Chair confirms Checklist boxes are ticked based on the case description.
  3.  **Vote:** Class (excluding presenting team) votes on whether it is "not knowledge." Majority rules.
  4.  **Repair:** If the vote passes (it is not knowledge), the opposing team must add a condition (Condition 4, 5…) to block this case without blocking paradigmatic knowledge (e.g., "I know I am sitting").
  5.  **Timing:** 5 minutes to propose case, 3 minutes to amend. If the Repair team cannot amend within time, they lose the round.
  6.  **Constraint:** Cases must be ordinary/local (no skeptics, demons, or sci-fi).

  **Debrief (30 min):**
  1.  **Categorize:** Group amendments. Did we ban false steps? Did we demand stronger evidence?
  2.  **The Two Families:** Explicitly distinguish cases where the subject relies on a false belief (False Lemma) versus cases where all beliefs are true but luck connects evidence to truth (Environmental Luck).
  3.  **The Cost of Repair:** Explain that banning false steps blocks the first family but leaves Environmental Luck open. Explain that requiring evidence to *guarantee* truth (infallibility) blocks both but makes knowledge impossible for empirical claims (skepticism).
  4.  **Reveal:** Name the problem (Gettier) and map student cases to standard examples (Sheep/Rock, Ford/Brown).

  **Predictable Failures:**
  1.  *Bizarre Cases:* Teams will drift to sci-fi to force counterexamples. *Handling:* Chair must veto immediately citing "ordinary/local" rule. Instructor overrides if Chair falters.
  2.  *The Infallibility Patch:* Teams will suggest "Evidence must make p certain." *Handling:* Allow it in-game to show the deadlock, but highlight in debrief that this costs too much (skepticism).

  **Limitations:** The activity generates *cases*, not *theories*. It will not reproduce the nuanced distinction between defeasibility and virtue epistemology without your lecture framing. You must supply the systematic taxonomy of why specific repairs fail; students will only see isolated failures.

  **Confidence:** 85%.
  **Least Sure Element:** Chair rotation. Undergraduates may struggle to enforce rules neutrally under time pressure, potentially stalling rounds. Consider appointing a TA or keeping the Chair role fixed if disputes arise.
