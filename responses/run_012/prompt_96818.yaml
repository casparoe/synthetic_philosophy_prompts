  Your instinct to interrogate the instrument rather than the label is precisely the right calibration for this problem, and I share your suspicion that the rhetoric surrounding university funding often functions as noise rather than signal. I am highly confident that the arrangement you describe in German and Nordic states, where tuition is free but maintenance is loaned, implicitly theorizes education as a public good whose production costs must be socialized to ensure supply, while simultaneously treating the student's subsistence as a private responsibility. The strictly required presupposition here is that the institution provides a benefit to the polity that exceeds the private return to the individual, which justifies the state paying the university directly; I hold this firmly. However, the claim that this arrangement secures equal opportunity is merely congenial to the theory rather than required, and I am reasonably sure that the empirical evidence you cite regarding participation gradients confirms this decoration is ineffective. The inconsistency you note, where maintenance is loaned while tuition is granted, suggests a split theory of the student: she is a public vessel for knowledge acquisition but a private investor in her own biological survival. I am confident that this inconsistency is not accidental but reflects a boundary where the state's willingness to subsidize the public good ends and the individual's responsibility for private consumption begins.

  In contrast, I am quite certain that the fee-based arrangement common in England and the United States operates on an implicit theory of human capital accumulation where the degree is a private asset. The required presupposition here is that the primary beneficiary is the graduate, not the state, which licenses the transfer of cost to the student; I am confident in this reading. The rhetoric of market choice and consumer sovereignty is largely congenial and often decorative, because I am sure that capped fees and regulated loan terms indicate the state does not trust the market to price the good correctly. The inconsistency you identify, where the state subsidizes the loans or forgives them, reveals that the state does not actually believe the benefit is wholly private, and I am highly confident that this functions as a hidden subsidy to the supply side disguised as demand-side support. If we treat the practice as philosophically underdetermined, I am moderately confident that the same fee structure could license a theory of education as a toll road for professional licensing rather than a site of learning, but the current rhetoric obscures this.

  The graduate tax scheme you mention shifts the instrument reading significantly, and I am confident that it presupposes education is an investment in the tax base rather than a good consumed by the student. Under this view, the state buys a share of future earnings potential, and the student is neither a customer nor a beneficiary in the traditional sense but rather a vehicle for state revenue generation; I hold this interpretation with high confidence. If the presupposed picture were replaced by a view of education as a positional good, where value is derived from being ahead of others, I am certain that funding models would matter less than selection mechanisms, because expanding supply would dilute the value of the credential regardless of who pays. If education were treated strictly as a right whose exercise must not be rationed by price, I am confident that any fee structure would be illegitimate, and rationing would have to occur exclusively through academic merit or lot, which neither current system fully embraces. If the system were openly treated as an investment in a tax base to be recouped, I am sure we would see funding directed disproportionately toward high-earning disciplines rather than the broad curricula currently supported.

  Where the parts of an arrangement presuppose inconsistent things, I am confident that this should be stated plainly rather than smoothed over, as you suggested. The Nordic model presupposes a public good but acts as if living costs are private, and the Anglo-American model presupposes a private benefit but acts as if the risk is public. I am moderately confident that this incoherence is stable only because the contradictions are temporally separated; the student experiences the public benefit first and the private debt later, or vice versa, preventing a direct comparison. Regarding the empirical claim that abolishing tuition has not flattened the participation gradient, I am highly confident in the data but less certain about the causal mechanism, as cultural capital may simply substitute for financial capital as the barrier. I am confident that the graduate tax aligns the cost with the ability to pay more accurately than fixed loans, but I am less sure about its political viability. I am confident that the rhetoric of equal opportunity in the free-tuition model is often decorative, but I am less certain about the intent of the policymakers who designed the maintenance loan exceptions.

  I must state my confidence levels in these claims to honor your request for precision. I am highly confident in the reconstruction of the implicit theories regarding public versus private benefit. I am highly confident in the identification of the inconsistencies between the rhetoric of private benefit and the practice of state subsidy in the fee-based model. I am reasonably confident in the assessment that the equal opportunity rhetoric is decorative in the free-tuition model. I am moderately confident in the claim that the graduate tax represents a distinct theory of the state-student relation. I am highly confident that the practice is philosophically underdetermined in several respects. I am moderately confident that the positional good framework would render funding models less relevant. I am highly confident that the right-based framework would prohibit price rationing. I am highly confident that the investment framework would alter disciplinary funding. I am highly confident that the inconsistencies should be stated plainly. I am moderately confident that the temporal separation of costs and benefits stabilizes the incoherence. I am highly confident in the data regarding participation gradients. I am moderately confident in the causal mechanism regarding cultural capital. I am highly confident in the alignment of graduate tax with ability to pay. I am moderately confident in the political viability of the graduate tax. I am highly confident in the decorative nature of the equal opportunity rhetoric. I am less certain about the intent of the policymakers regarding maintenance loans.

  The one point I am least sure of is the specific motivation behind the maintenance loan inconsistency in the Nordic model, as I cannot determine with high confidence whether this is a pragmatic budget constraint or an ideological commitment to privatizing the reproduction of labor power.
