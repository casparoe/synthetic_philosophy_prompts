answer: |-
  **TO:** The Trustees of the Aldworth Foundation
  **FROM:** The Chair, Investment Committee
  **DATE:** 10 March
  **SUBJECT:** Decision on Asset Allocation Framework

  **1. Recommendation**

  I recommend that the Committee **reject** the advisers' proposal to adopt a fully probabilistic mean–variance optimisation (MVO) framework at this time. Instead, we should retain our current judgement-based approach, utilising ranges and structured narratives, while instructing the investment staff to formalise how "weight of evidence" is documented within those narratives.

  We are being asked to authorise a shift from a framework that acknowledges epistemic uncertainty to one that imposes false precision. I propose we defer any structural change for twelve months. During this period, staff should develop a method to quantify the completeness of evidence without forcing cardinal probabilities where none exist.

  **2. What Turns on This Decision**

  Most trustees are not economists, so it is vital to be plain about the practical difference. Under the advisers' proposal, we would input single numbers (e.g., "Equities will return 5%") into a mathematical engine. The engine outputs a "optimal" portfolio and a sustainable spending rate. The system treats these inputs as known facts with measurable error margins.

  Under our current approach, we input ranges (e.g., "Equities will return between 3% and 7%") alongside narratives explaining *why* we believe this. The Committee then judges the portfolio.

  This is not merely presentation; it is substance. The MVO framework forces us to act as if we know the odds of the next twenty years. Given our mandate to benefit people not yet born, this is dangerous. If we calculate a spending rate based on precise expected returns that rest on thin evidence, we risk eroding the real value of the endowment for future generations. The MVO model sees risk as volatility (standard deviation). The Keynesian view—and I believe the prudent fiduciary view—sees risk also as ignorance (lack of evidence).

  **3. The Keynesian Objection**

  Our external adviser objects that the proposal presupposes a theory of probability Keynes argued against. Keynes held that probability is a logical relation between evidence and hypothesis, possessing two dimensions: the *probability* itself, and the *weight of the argument* (the amount of evidence).

  Three counter-arguments have been raised against this objection. I address them candidly.

  First, critics say this is merely a taste for vagueness. It is not. It is an acknowledgment that for long-horizon asset returns, evidence is often scarce. A probability based on ten years of data is logically different from one based on a century, even if the calculated percentage is identical.

  Second, some argue weight can be folded into a single probability using hierarchical models (placing a distribution over our estimates). This collapses weight into variance. But Keynes's point is that weight is distinct from variance. We can have a very precise estimate (low variance) based on very little evidence (low weight). Bayesian methods treat these as the same risk; Keynes argues they are not. For a trustee, if weight is a genuine second dimension, you cannot simply let the optimiser return a number. You must use weight to *constrain* the optimiser. Low-weight inputs should restrict allocation limits, regardless of the expected return.

  Third, it is argued that a committee declining to state probabilities is nonetheless making a decision embodying implicit ones. This is true. However, making them explicit falsely certifies them as measurable. It is better to acknowledge the judgement than to disguise it as calculation.

  **4. Ambiguity vs. Weight**

  Is this point the same as the familiar observation that people dislike ambiguous odds (the Ellsberg paradox)? They come apart. Ambiguity aversion is a psychological preference; Keynesian weight is an epistemic status.

  This matters for policy. If this were merely psychological, we could ignore it as irrational bias. But if weight reflects the actual completeness of our knowledge, ignoring it is negligence. The advisers' concession—a three-point confidence rating (High/Medium/Low)—fails to capture this. It is an ordinal label tacked onto a cardinal model. It does not change the optimisation mathematics structurally; it merely "tilts" allocations ad hoc. It does not tell us how much to tilt, nor does it acknowledge that some probabilities are non-numerical. It is a box-ticking exercise, not a solution.

  **5. The Strongest Counter-Consideration**

  The strongest argument for the probabilistic framework is discipline. Our current approach allows judgement to drift. A formal model forces consistency between our return assumptions and our spending rate. For an endowment meant to last centuries, a rule-based spending policy is highly desirable. The MVO framework offers a clear anchor for intergenerational equity.

  I would revise my recommendation if, over the coming year, the advisers could demonstrate a method to integrate weight of evidence into the optimisation engine without collapsing it into variance. If they can show how a "low weight" input mechanically reduces the sustainable spending rate in a way that is mathematically consistent yet epistemically honest, I would support a modified adoption. Until then, false precision is a greater risk than judgemental drift.

  **6. Motion**

  I propose the following motion for the meeting on 14 March:

  1.  **That the Committee rejects the proposal to adopt a fully probabilistic mean–variance optimisation framework for asset allocation and spending policy.**
  2.  **That the Committee reaffirms the current judgement-based approach using ranges and structured narratives.**
  3.  **That the Investment Staff are instructed to develop a framework for explicitly assessing the "weight of evidence" for each asset class assumption, to be reviewed by the Committee within twelve months.**
  4.  **That the sustainable spending rate for the coming year be determined by Committee judgement based on the current narrative ranges, rather than by algorithmic optimisation.**
