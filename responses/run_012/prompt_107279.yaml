      *Refining the Keynesian argument:* The adviser says confidence ratings solve it. I need to explain why they don't. A 3-point scale is ordinal. Weight is about the *basis* of the probability. MVO treats inputs as cardinal. Tilting based on a label is ad-hoc, not structural.

      *Refining the Bayesian counter:* Hierarchical models assign a distribution to the mean. This increases variance. Keynes says weight is separate from variance. You can have a narrow distribution based on thin evidence (low weight) or wide distribution based on thick evidence (high weight). Bayesianism conflates them.

