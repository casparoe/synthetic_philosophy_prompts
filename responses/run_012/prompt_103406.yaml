answer: |-
  Jamie: Look, let's drop the drowning wife for a second. It's too dramatic. Think about the letter case. My friend is dying. She makes me promise to destroy a specific letter after she's gone. No one else knows about it. Destroying it brings no obvious good to anyone else; keeping it hidden brings no harm. I just promised.

  Alex: And you're saying utilitarianism tells you to break the promise?

  Jamie: I'm saying utilitarianism tells me the *reason* to keep the promise is that having a general disposition to keep promises maximizes utility. But in the moment, standing over the fireplace with the envelope in my hand, if I'm acting as a utilitarian agent, what's in my head?

  Alex: Nothing about utility. That's the point we've been making for two weeks. The utilitarian justification operates at the level of selecting dispositions, not necessarily at the level of every single action. You cultivate a disposition of loyalty. When the moment comes, you act from loyalty. You burn the letter because you're a good friend, not because you ran a calculus.

  Jamie: But why do I have that disposition?

  Alex: Because having it is useful.

  Jamie: There it is. So the ultimate grounding of my action is utility. Even if I don't think the word "utility" in the moment, I know that's why I'm doing this. I know that if burning this letter suddenly stopped maximizing utility, the disposition would be revoked. That makes my loyalty conditional. It makes my friend instrumental.

  Alex: You're conflating the criterion of rightness with the decision procedure. The theory says the act is right because it maximizes utility. It doesn't demand the agent think about utility to perform the act. If I love my partner, I don't need to justify my love by utility to express it sincerely. The utility is a background fact about why love is a good thing to have, not a step in the loving process.

  Jamie: That's the move I'm objecting to. It relocates the problem, it doesn't solve it. If the theory only tells me to have the disposition, then the theory isn't guiding the action anymore. It's guiding my character formation. But if I'm asking myself, "What should I do?" and the theory says, "Do what your disposition tells you," then the theory has abdicated. But if the theory says, "Do what maximizes utility," and I have to suppress that thought to act sincerely, I'm living a split life.

  Alex: Is it a split life, or is it just sophistication? Look, any theory has a critical level. Even you, presumably, think there's a truth about morality that might differ from what an agent feels in the moment. If I ask a parent why they saved their child instead of two strangers, you say they acted from love. But if we ask why love is the morally appropriate response, we give a theoretical justification. Does the parent need to think about that justification to be integrated?

  Jamie: Yes, if the justification undermines the motivation. That's Williams's point about integrity. Integrity isn't just psychic coherence—making sure my thoughts match my theory. It's fidelity to the projects and attitudes that constitute my identity. My friendship with my dying friend is a ground project. It defines me. Utilitarianism asks me to step outside that project to validate it. It asks me to view my loyalty from the outside, as a tool for general welfare.

  Alex: But doesn't that happen with any impartialist theory? Let's hit Kant. If I visit my friend in the hospital because I love them, Kant says that has no moral worth. I should visit them from duty. Isn't that alienation? Isn't that one thought too many? "I am visiting you because the moral law commands me to respect your humanity." That sounds pretty cold.

  Jamie: There's a difference. Kantian duty recognizes the friend as an end in themselves. The justification respects the content of the relationship. Utilitarianism reduces the relationship to a vessel for happy states. When the utilitarian says, "Keep the promise because promise-keeping dispositions are useful," they aren't honoring the friend; they're honoring the utility function. The Kantian honors the person. So the alienation is different. With Kant, I might feel cold, but I'm still focused on *you*. With utilitarianism, I'm focused on *the good*.

  Alex: But if the utilitarian agent successfully separates the layers, they are focused on you. That's the whole claim. The disposition is opaque. They burn the letter because "this is what friends do." The utility part is invisible to them during the act.

  Jamie: But it's not invisible to the agent's reflective understanding. I know why I'm doing this. And knowing that the ultimate sanction is utility changes the quality of the commitment. It's like being in a marriage where you know your partner stays only because divorce statistics show marriage is socially beneficial. Even if they say "I love you," the background fact poisons the well. Integrity requires that my actions flow from my convictions without this instrumental gap.

  Alex: So you're defining integrity as never having a gap between justification and motivation? That seems impossible. I might be motivated by hunger, but the justification for eating is nutrition. Do I lack integrity when I eat an apple?

  Jamie: Don't be reductive. Moral integrity is about the projects that give life meaning. Williams says utilitarianism attacks integrity because it makes me responsible for everything everywhere, forcing me to abandon my own projects whenever the calculus demands. In the letter case, it's subtler. It attacks integrity because it makes my commitment to my friend contingent on the general good. If burning the letter caused a slight dip in global happiness, utilitarianism says I'm wrong to burn it. But my integrity says I promised.

  Alex: And if keeping the promise causes a disaster? Then your integrity is just stubbornness.

  Jamie: Maybe. But utilitarianism doesn't allow for the possibility that my promise binds me *regardless* of the disaster, unless the disaster is huge. It doesn't recognize the independent weight of the relationship. That's the alienation. I am alienated from my own moral response because I have to check it against an external standard that doesn't care about the relationship itself.

  Alex: Okay, but let's go back to the "one thought too many." Williams says the husband who calculates utility before saving his wife has one thought too many. I'm saying the husband who saves his wife because he loves her has zero thoughts about utility, and the utilitarian theory approves of that husband. So where is the objection?

  Jamie: The objection is that the husband *knows* the theory approves of him only conditionally. To have integrity, I must own my actions fully. If I act on a disposition that I know is justified only by something outside the disposition, I'm not fully owning it. I'm acting as a conduit for utility. The Kantian acts from a law they give themselves. The utilitarian acts from a disposition installed by the calculus.

  Alex: But you can install the disposition and then forget the installer. That's how human psychology works. We forget why we learned to tie our shoes; we just tie them.

  Jamie: Not with morality. Morality is reflective. We can't forget why we think something is right. If I believe promise-keeping is right because it's useful, I can't simultaneously believe it's right because my friend trusted me. Those are two different truth-conditions. If the utility vanishes, the first reason says "break it." The second says "keep it." Integrity is being able to stand by the action without that shadow of contingency.

  Alex: So integrity is essentially non-consequentialist?

  Jamie: Integrity is about being the author of your life. Utilitarianism makes you a channel for the general good. Even if the channel feels like love, if you know you're a channel, you're alienated from the source.

  Alex: But if the general good is the only thing that matters, then being a channel is the only honest way to be. To claim otherwise is to privilege your own projects arbitrarily.

  Jamie: And to claim my projects are arbitrary is to attack my integrity. That's the standoff. You think integrity must yield to the truth of utility. I think a theory that requires me to yield my integrity to utility has failed to account for what it means to be an agent.

  Alex: So we're back to whether the theory describes the world or guides the agent.

  Jamie: We're back to whether the agent is allowed to have a life of their own.

  Alex: I think utilitarianism gives you a life. It just says the value of that life depends on how it fits into the whole.

  Jamie: And Williams says if that's all it is, it's not a life worth living. It's a management strategy.

  Alex: Well, at least we agree the letter should be burned.

  Jamie: For different reasons. And that difference is exactly the problem.
