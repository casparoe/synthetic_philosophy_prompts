  **Verdict:** Advise Against Licensing.

  **Candidate Rules and Predictions**

  Our record supports three competing rules that apply here:

  1.  **The Integrity of Status Rule (derived from *Kidney* and *Vote Buying*):** Certain attributes constitutive of personhood or civic standing are not commodities. Markets in these goods are forbidden regardless of consent or risk, because pricing them degrades their meaning.
      *   *Prediction:* **No.** A legal surname is a constitutive marker of identity within the state's registry; renting it treats a civic identifier as a commercial asset.
  2.  **The Undue Inducement Rule (derived from *Kidney*, *Vote Buying*, and *Research*):** Markets are forbidden where payments are large enough to exploit financial pressure or distort judgment, particularly where the seller cannot truly decline.
      *   *Prediction:* **Leans No, but mitigated.** The proposal excludes parents of minors and allows termination, which reduces the "trap." However, like the kidney and vote cases, the payment targets those for whom refusal is costly.
  3.  **The Voluntary Exchange Rule (derived from *Plasma* and *Concert Tickets*):** If the transaction is low-risk, voluntary, and creates no negative externalities for third parties, the market is permissible. Objections based on "pricing out" are matters of wealth distribution, not market defects.
      *   *Prediction:* **Yes.** The physical risk is negligible (unlike kidneys), the exchange is voluntary (unlike emergency water), and it creates no queue-jumping (unlike surgery).

  **Reasons Carrying the Verdict**

  The **Integrity of Status Rule** must carry the day. While the safeguards in the proposal (terminability, exclusion of minors) address the *Undue Inducement* concerns, they do not address the core objection found in our *Kidney* and *Vote Buying* precedents: that some things are not proper subjects of a price.

  In the *Kidney* case, we rejected payment even with guaranteed care because a body part is "not a thing to be priced." In the *Vote Buying* case, we rejected the argument that no harm occurred because the transaction altered the nature of the vote itself. A legal surname is not merely a label; it is the primary interface between the individual and the legal order (credit, registration, liability). To allow it to be rented is to convert a status of citizenship into a service of commerce. This aligns with the *Emergency Utilities* ground that we should not replace a standing norm (names as identity) with a price.

  The *Voluntary Exchange Rule* (Plasma/Tickets) is insufficient here because plasma is a renewable biological resource and tickets are allocative goods. A name is neither; it is an identifier. Permitting this market would establish that legal identity is fungible, a principle inconsistent with our refusal to commodify body parts and civic duties.

  **Closest Analog**

  **Vote Buying.**
  Like a ballot, a legal name is a formal token of recognition by the state. In the *Vote Buying* opinion, we rejected the dissent's view that the transaction was harmless because "no single ballot would be pivotal." We implicitly accepted that the objection was about *what a vote is*, not just about who was hurt. Similarly, the objection to name sponsorship is not about the harm to the seller (who is protected by termination clauses) but about what a legal name *is*. Both precedents assert that the state's recognition of a person cannot be rented.

  **Separating Case**

  Two candidate rules come apart here: the *Plasma* rule (low risk + voluntary = market OK) and the *Vote Buying* rule (civic/personal integrity = market NO).

  To resolve this before the vote, put the **Vote Buying** precedent to the commission first. Specifically, ask the commission to affirm the ground of that decision: *"Did we ban vote buying because of the coercion involved, or because a vote is not a commodity?"*

  *   If the commission affirms **Coercion**, the Name Sponsorship proposal might pass (as safeguards reduce coercion).
  *   If the commission affirms **Commodity**, the proposal must fail (as names, like votes, are constitutive status markers).

  This forces the commission to choose between the *Plasma* principle (markets are safe if risks are managed) and the *Vote* principle (markets are forbidden if the good is constitutive). Our record is only consistent if we own the latter.
