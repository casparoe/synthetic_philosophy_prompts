  # Classification Instrument: The Ontological Status of Generations

  **Root Commitment:** People born in different decades differ systematically in attitudes, tastes, and life outcomes.

  **Q1. Is the birth-year correlation identifiable as a genuine cohort effect distinct from age and period artifacts?**
  *   **No** → **Deflationary Eliminativism**
      *   *View:* Generational talk explains nothing; differences are artifacts of age or period.
      *   *Awkward Commitment:* Must dismiss vast demographic data as statistical noise.
      *   *Crux Case:* APC models show no unique variance for birth year.
  *   **Yes** → Go to Q2.

  **Q2. Is a generation synonymous with a birth cohort location, or does it require more to exist?**
  *   **Synonymous (Location Only)** → **Cohort Realism without Generation Realism**
      *   *View:* Birth cohorts are real demographic kinds, generations are not.
      *   *Awkward Commitment:* Cannot explain cultural shifts beyond demographic aging.
      *   *Crux Case:* A Boomer who rejects all Boomer values is still a Boomer.
  *   **Requires More** → Go to Q3.

  **Q3. Does a generation exist only when members self-consciously respond to a common historical problem?**
  *   **Yes (Consciousness Required)** → Go to Q4.
  *   **No (Exists Without Consciousness)** → Go to Q6.

  **Q4. Is the generation a real ontological unit or a useful coordinating fiction?**
  *   **Useful Fiction** → **Conventionalism**
      *   *View:* Generations are useful coordinating fictions imposed from outside.
      *   *Awkward Commitment:* Fictions cannot causally explain behavioral changes.
      *   *Crux Case:* Marketing budgets spent on Gen Z despite fuzzy boundaries.
  *   **Real Ontological Unit** → Go to Q5.

  **Q5. Does the application of the label create the conduct it describes (looping), or describe a pre-existing response?**
  *   **Creates Conduct** → **Performative or Looping Realism**
      *   *View:* The kind is real because its members take it up.
      *   *Awkward Commitment:* No generation exists before the label is coined.
      *   *Crux Case:* A person who identifies with a generation they were not born into.
  *   **Describes Pre-existing** → **Actuality Realism**
      *   *View:* Real only where a shared self-conscious response exists.
      *   *Awkward Commitment:* Silent cohorts subjected to the same history are not generations.
      *   *Crux Case:* A label in circulation before the cohort it names came of age.

  **Q6. Is there an underlying mechanism holding the property cluster together?**
  *   **No (Pattern Only)** → **Real-Pattern or Instrumentalist Realism**
      *   *View:* A generation is a real pattern that compresses prediction without a causal mechanism.
      *   *Awkward Commitment:* Accepts real patterns that lack causal powers.
      *   *Crux Case:* Predicting voting behavior without knowing why the correlation holds.
  *   **Yes (Mechanism Exists)** → Go to Q7.

  **Q7. Does the generation entity itself exert causal power over members' attitudes?**
  *   **Yes (Causal Power)** → **Strong Generational Realism**
      *   *View:* Generations are causally efficacious kinds.
      *   *Awkward Commitment:* Requires the generation to act as an agent upon members.
      *   *Crux Case:* Peer pressure within a cohort forcing attitude change.
  *   **No (Clusters Properties)** → **Property-Cluster Realism**
      *   *View:* Kinds whose members share a cluster of properties held together by an underlying mechanism.
      *   *Awkward Commitment:* Mechanism may be external (period), not generational.
      *   *Crux Case:* Shared trauma creating similar outcomes without group agency.

  ***

  **Unoccupied Combinations:**
  *   *Fiction + Causal Power:* Incoherent (Fictions do not cause physical/attitudinal changes).
  *   *Unconscious + Looping:* Incoherent (Looping requires conscious uptake of the label).
  *   *No Mechanism + Causal Power:* Incoherent (Power requires a mechanism of transmission).

  **Unseparated Pairs:**
  *   **Strong Generational Realism vs. Property-Cluster Realism:** Empirically difficult to distinguish between a mechanism that *is* the generation's power versus a mechanism that *clusters* properties without the generation acting as an agent.
  *   **Actuality Realism vs. Performative Realism:** Difficult to distinguish when a "pre-existing response" begins versus when the "label uptake" begins in historical time.
