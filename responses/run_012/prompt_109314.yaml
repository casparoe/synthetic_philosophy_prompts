answer: |-
  The brass box sat on the amplifier, gleaming under the single bare bulb of the rehearsal space. It looked insignificant for something that contained the rights to ten years of their lives, the master recordings, the publishing, the whole bloody catalog. Beside it lay the Ledger, a large hardcover book open to a fresh page, and a wall-mounted whiteboard where their intentions were already drying in marker ink.

  Four names. Four declarations.

  *Julian: I will not claim.*
  *Sara: I will not claim.*
  *Ben: I will not claim.*
  *Elias: I will not claim.*

  They had spoken the words aloud an hour ago, standing in a circle like jurors. They had written them down. Now, the forty-eight-hour window was open. The rules were simple, understood without needing a lawyer to read them aloud again. If one key turned in the box, that person owned the songs forever. If no keys turned, the catalog went to liquidation, and they'd all get a modest, equal split of the salvage value. If two or more keys turned, the legal entanglement would freeze the assets indefinitely. No one would get anything. Not a dime. Not a note.

  Elias sat on his drum throne, spinning a stick. The silence in the room was heavier than the noise had been during their final set. They were supposed to stay in the building until the timer on the wall hit zero. No phones, no outside contact. Just the four of them, the box, and the board.

  "I'm going to sleep," Ben said, breaking the silence. He was the guitarist, the quietest of them, currently staring at his own handwriting on the board.

  "You think you can?" Sara asked. She was pacing near the bass rig, her arms crossed tight over her chest. She hadn't looked at the box since she wrote her name.

  "I'll try." Ben walked to the couch in the corner, the leather cracked and worn from a decade of post-show crashes. He lay down, facing the wall.

  Julian stood by the amplifier. He was the voice, the face, the one who had written the lyrics. He had the most to gain, and the most to lose. He traced the rim of the brass box with a fingernail. "It's stupid," he said softly. "We all wrote it. We should all own it."

  "That was the deal," Elias said. His voice sounded too loud in the dead air. "Liquidation or nothing. Unless one of us wants to be the sole owner."

  "No one wants that," Julian said. He didn't look at Elias.

  They had all agreed on the declarations before the window opened. It was supposed to be a binding social contract, a way to ensure the 'no claim' outcome. If everyone promised to hold back, everyone gets the consolation prize. No risk of the zero-sum freeze. But the declarations weren't enforced. They were just words on a board. Cheap talk. The box didn't care about the Ledger. It only cared about the keys.

  Elias watched Julian. The singer walked to the small kitchenette, poured a glass of water, and drank it slowly. His eyes kept drifting to the box. Every time he looked at it, Elias felt a spike of adrenaline in his chest. If Julian put his key in, Elias knew what he would have to do. He couldn't let Julian take it all. Not after ten years of splitting the bill four ways. Not after the bus rides and the cheap hotels and the nights Julian spent screaming into a microphone while Elias kept the time.

  But if Elias put his key in too, they both lost. Everything vanished.

  "Stop looking at it," Sara said to Julian.

  "I'm not looking at it."

  "You're staring at it like it's going to bite you."

  Julian turned, leaning against the amp. "If I take it, you guys get nothing. If I don't, we all get a check that barely covers our taxes. That's the math."

  "The math is if you take it and I take it, we starve," Elias said.

  "Then don't take it."

  "Then don't take it."

  The night stretched. The timer on the wall clicked down the minutes. Ben slept, or pretended to. Sara sat on the floor, leaning against the wall, eyes open. Elias stopped spinning the stick. He watched the board. *I will not claim.* His own handwriting looked foreign. A promise made to people he knew better than his own brothers. Did they believe him? Did he believe them?

  The temptation wasn't just the money. It was the legacy. If one person owned the catalog, they controlled the legacy. They decided when the songs were used, who covered them, when they died. If it was liquidated, the songs became public property, chopped up, licensed for commercials, forgotten. To claim was to save the art, but kill the band. To not claim was to let the art drift, but keep the peace.

  At hour thirty-six, Sara stood up. She walked to the table. She picked up her key from the small dish where they'd left them. She held it over the box.

  Julian sat up. Ben turned over on the couch. Elias gripped his drumstick until his knuckles whitened.

  Sara looked at the key. She looked at the board. She looked at Julian.

  "If I do this," she said, her voice trembling slightly, "you all have to promise to let me have it. Just say it."

  "We can't promise that," Julian said. "The window is open. Anyone can change their mind until the last second."

  "Then I can't do it." She dropped the key back into the dish. It made a sharp metallic clink. "I'm not trusting any of you enough to be the villain."

  "None of us are villains," Elias said.

  "We're all thinking about it," Sara said. "I can see it. You're all calculating the odds. Wondering if you can get away with it."

  She was right. Elias was calculating. If he waited until hour forty-seven, maybe the others would be asleep. Maybe he could be the single claimant. But what if Julian was waiting for the same moment? What if they walked to the box together?

  The fear of the zero-sum was stronger than the greed. The fear of ending up with nothing—of having fought for nothing—was the only thing holding them together. They weren't holding back out of nobility. They were holding back out of mutual assured destruction.

  Hour forty-seven. The air in the room was stale. Ben was awake now, sitting on the edge of the couch, rubbing his face.

  "We should open it," Ben said.

  "Timer hasn't hit zero," Julian said.

  "It doesn't matter. We know."

  "We don't know," Elias said. "Someone could walk up there in the last minute."

  "Who?" Julian challenged. He looked at Elias. Then Sara. Then Ben. "Who here is willing to burn this down?"

  No one answered. The silence was the answer. They were all willing. But they were all too afraid that someone else was willing too.

  The timer beeped. A single, sharp tone.

  Elias stood up. His legs felt stiff. He walked to the table. The others joined him, forming a semi-circle around the brass box. No one spoke. No one breathed.

  Elias reached out and lifted the lid.

  Inside, there were four slots for keys.

  They were all empty.

  A collective exhale moved through the room, like a wind passing through dry grass. Shoulders dropped. Muscles uncoiled. They had done it. They had reasoned their way to holding back. They had secured the consolation. They would all get the small check. They would remain equal. They would remain friends, or at least, acquaintances who hadn't ruined each other.

  Julian laughed, a short, brittle sound. "Smart," he said. "We were smart."

  "Safe," Sara corrected. She picked up her key from the dish and put it in her pocket.

  Elias looked at the board. *I will not claim.* Four times. They had told the truth. But as he looked at his bandmates, he didn't see relief. He saw the calculation still lingering in their eyes. They hadn't held back because they wanted to. They had held back because they didn't trust each other enough to risk the zero.

  They had chosen the guaranteed small win over the chance of a big one. They had chosen safety over glory. They had preserved the group by refusing to let anyone lead it.

  "Okay," Ben said, turning toward the door. "I guess that's it."

  "Guess so," Julian said. He picked up the box, feeling its weight. It was lighter now. "We did the right thing."

  Elias wasn't sure. They had avoided the disaster, yes. But they had also confirmed that none of them believed in the others enough to step aside. They had proven that their loyalty was only as strong as their fear of loss. They walked out of the rehearsal space into the morning light, equal in their payout, equal in their cowardice, wondering if the songs they wrote would ever mean anything now that no one was willing to own them.
