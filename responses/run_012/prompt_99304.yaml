answer: |-
  You're not making it up as you go. You have a coherent moral architecture, but it isn't the flat, one-dimensional utilitarianism your friend is guessing at. Your friend's principle ("save the most except using as means") fails because it treats morality like a single switch. Your gut treats it like a circuit breaker panel with different priorities for different lines.

  Here is the principle that unifies six of your seven calls, explains the Trolley/Transplant split without waving at "doing vs. allowing," and tells you what to do in your new cases.

  ### The Principle: Constrained Optimization of Claims

  **"Maximize the number of lives saved, subject to three hierarchical constraints: Bodily Sovereignty, Special Obligation, and Moral Desert."**

  This is not just a label. It is an algorithm. When you face a triage decision, you run the claims of the people involved through this filter in order.

  1.  **Bodily Sovereignty (The Hard Stop):** You cannot actively violate an innocent person's bodily integrity to save others. This is an absolute veto.
  2.  **Special Obligation (The Priority Pass):** You have a heightened duty to those within your specific sphere of care (kin, dependents, or perhaps immediate proximity). This trumps raw numbers.
  3.  **Moral Desert (The Tiebreaker):** Among strangers, those who are not culpable for their predicament have a stronger claim on rescue resources than those who are.
  4.  **Baseline Utility (The Default):** If none of the above constraints distinguish the parties, you save the greatest number (or the greatest expected survival).

  ### How It Maps to Your Seven Cases

  *   **Case 1 (5 Strangers vs. 1 Stranger):** No sovereignty issues, no special obligations, no culpability. Falls to **Baseline Utility**. Save 5.
  *   **Case 2 (5 Strangers vs. 1 Daughter):** **Special Obligation** overrides Baseline Utility. Save Daughter.
  *   **Case 3 (Ventilator Math):** This is refined **Baseline Utility**. 5 patients × 60% = 3 expected lives saved vs. 1 certain life. Save 5.
  *   **Case 4 (Trolley):** No sovereignty violation (see below), no special obligations, no culpability. **Baseline Utility**. Throw switch.
  *   **Case 5 (Transplant):** **Bodily Sovereignty** veto. You are actively killing an innocent to harvest parts. Do not kill.
  *   **Case 6 (Drunk Drivers):** **Moral Desert**. The bystander has a stronger claim than the culpable drivers. Save Bystander.
  *   **Case 7 (Charity/Identifiable Victim):** **This is your outlier.** This contradicts Case 1. In Case 1, 5 strangers beat 1 stranger. In Case 7, 1 identifiable stranger beats 5 statistical strangers. Identifiability is a psychological bias, not a moral relationship like parenthood.

  ### The One You Have to Give Up

  To make this principle tight enough to guide you next time, **you must discard Case 7.**

  You already admitted it feels irrational. It undermines your own logic in Case 1. If numbers matter when the strangers are drowning in a lake, they must matter when the strangers are starving in a famine. The "Identifiable Victim Effect" is a cognitive bug, not a moral feature. If you keep it, you admit your principle is just "do what feels vivid," which won't help you in an ICU. Align Case 7 with Case 1: give the money to the program that saves five.

  ### The Trolley vs. Transplant Line

  Your friend said "using as a means." You rightly felt that was vague. Here is the precise mechanical distinction your gut is detecting: **Source of Harm.**

  *   **Trolley:** The threat (the trolley) exists *independently* of the one person on the track. You are **redirecting an existing threat**. The one person dies because of the trolley, not because of you; you merely changed the trolley's path.
  *   **Transplant:** The threat (death by organ harvesting) does *not* exist until you create it. You are **initiating a new threat**. The five live *because* the one dies; the death is the mechanism of the rescue.

  Your principle allows redirecting existing threats (Trolley) but forbids initiating new threats against innocents (Transplant), regardless of the arithmetic.

  ### Predictions for Your New Cases

  **1. Five Adults vs. One Child (Strangers, Same Effort)**
  *   **Analysis:** No Special Obligation (all strangers). No Sovereignty issue. No Moral Desert (assuming no fault).
  *   **Verdict:** This falls to **Baseline Utility**. Based on your Case 1 (5 vs 1 strangers), your principle demands you **save the five adults.**
  *   *Note:* This will feel cold. Many triage protocols introduce a "Life Years" multiplier to save the child, but that is a *modification* of your principle, not a result of it. If you stick to the logic you displayed in the lake case, the numbers win.

  **2. One Hundred Strangers vs. One Stranger**
  *   **Verdict:** **Save the hundred.**
  *   **Why:** At a certain threshold, the Baseline Utility swamps any minor psychological bias toward the single individual. If you wouldn't save 1 over 5, you certainly wouldn't save 1 over 100. This confirms that your "Identifiable Victim" intuition in Case 7 is a bias that breaks under pressure.

  ### Summary for Your Notebook

  You are not a consequentialist with a sentimental streak. You are a **Pluralist Prioritarian.**

  You believe lives should be saved in the aggregate, *unless* doing so requires violating rights, abandoning your own, or rewarding negligence.

  **The Rule for Next Time:**
  1.  Did I cause the threat? If yes, stop (Transplant).
  2.  Is one of them mine? If yes, take them (Daughter).
  3.  Did one of them cause the crash? If yes, leave them (Drunk Drivers).
  4.  Otherwise, count heads. (Lake, Trolley, Ventilator).

  Drop the charity case. It's the only one that doesn't fit the machine.
