  Alright, I need a hand with something thats been bugging me for like three years now. I'm a science journalist — I cover medicine and ideas — and back in 2020 I did a long reporting stint on ICU triage, sitting in on the committee meetings where they decide who gets the last ventilator when there aren't enough to go around. I figured I'd come out of that with a clean view about who you save when you can't save everybody. Instead I've got a shoebox of gut calls that wont sit still together, and its turned into a running argument with a friend of mine who actually reads philosophy. So I'm outsourcing it.

  Heres my gut, case by case. Not going to pretty it up.

  - Five strangers drowning on one side of a lake, one stranger drowning on the other. I can only row to one side, same effort either way. I go for the five, no hesitation.
  - Exact same setup, except the one is my daughter. I go for my daughter, and honestly I don't even feel a pang about it.
  - Ventilator time. One patient who will definately die without it, versus five patients who each have maybe a 60 percent chance of pulling through with it. I give it to the five.
  - Runaway trolley. I can throw a switch so it kills one guy instead of five. I throw the switch.
  - Surgeon could kill one healthy guy in the waiting room and use his organs to save five dying patients. Absolutely not — and not just squeamishness. It feels like a totally different kind of act from the trolley, even though the arithmetic is the same.
  - A pileup where the five people who need rescuing are the drunk drivers who caused it, and the one person is an innocent bystander who just happened to be standing there. I save the bystander. The five can wait.
  - Big charity appeal. I can pay to save one specific kid I've seen on the news, or give the same money to a program that will statistically save five kids I'll never see. I give it to the one I can see. I know thats probably irrational but there it is.

  So what I want to know is whether theres actually a principle underneath all this, or whether I'm just making it up as I go. And I want the real principle, not a label — don't just tell me I'm a consequentialist with a sentimental streak.

  A few things I need from you. First, is there one principle that gets all seven of my calls, or close? Second, if it can only get most of them, which of my gut calls do I have to give up, and why that one rather than the others? Third, the trolley case and the transplant case seem to point in opposite directions — in both, one person dies so five can live, and I'm fine with it in one and refuse in the other — and the two drowning cases pull against each other too. So the principle has to say exactly where the line falls, not just wave at doing versus allowing. Fourth, tell me what it predicts for a case I genuinely can't call: five adults I don't know versus one child I don't know, same effort. Does my principle let me save the kid? And what about a hundred strangers versus one — at some point do the numbers just swamp everything, or does my own gut say otherwise?

  For what its worth, my friend offered a one-liner: save the most lives, except when you'd have to use somebody as a means. But that doesn't explain why I wave off the five drunk drivers — I'm not using them as anything, I'm just not going to them. So if you want to start from his guess and fix it, be my guest.

  Basically I want to know what I actually believe, stated tight enough that it could tell me what to do next time instead of me just going with my stomach.
