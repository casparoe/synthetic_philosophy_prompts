answer: |-
  **Subsidiarity Decision Procedure**

  **Burden of Proof:** Always on the higher level (Brussels/National). If they fail to demonstrate necessity, the presumption favors the region (Swiss default).

  1.  **Competence Check:** Is this an *exclusive* higher-level competence (e.g., currency, defense)?
      *   **Yes:** **STOP.** No subsidiarity objection possible.
      *   **No:** Proceed. (Most economic/social policy is shared).

  2.  **Core Autonomy Test (German Principle):** Does the proposal regulate the immutable core of local self-government (e.g., zoning, local culture, municipal organization)?
      *   **Yes:** **STOP: Object.** This violates guaranteed self-government regardless of efficiency.
      *   **No:** Proceed.
      *   *[Judgment Call]: Defining the "core" vs. shared regulatory space.

  3.  **Sufficiency Test (EU Principle 1):** Can the regions sufficiently achieve the objective alone? Look for proven capacity failure or significant cross-border spillovers (e.g., pollution, market fragmentation).
      *   **No Evidence of Failure/Spillover:** **STOP: Object.** Higher level has not met burden of proof.
      *   **Evidence Exists:** Proceed.
      *   *[Judgment Call]: Distinguishing real spillovers from mere inconvenience.

  4.  **Efficiency Test (EU Principle 2):** Does higher-level action produce clear benefits (scale economies, legal certainty) that outweigh the loss of local flexibility?
      *   **No:** **STOP: Object.** Uniformity is not a valid substitute for efficiency.
      *   **Yes:** Proceed.

  5.  **Motivation Check:** Is the higher level arguing *necessity* ("we can't") or *preference* ("we don't like variation")?
      *   **Preference:** **STOP: Object.** This is politics, not subsidiarity.
      *   **Necessity:** Proceed to Step 6.

  6.  **Political Kickback:** If evidence on spillovers/efficiency is mixed or technical.
      *   **Action:** **FLAG.** This is a policy disagreement, not a subsidiarity violation. Committee votes based on political priority, not legal principle.

  **The Reality Check (Teeth)**
  Be honest: No court will save you. The EU "Yellow Card" system rarely kills bills; German constitutional challenges on subsidiarity are exceptionally hard to win. Your objection is a political act, not a legal veto. It functions as shaming ammunition for plenary debates and coalition bargaining. Use it to force concessions, not to expect annulment. A lower-level claim of capacity is often self-serving; ensure your evidence in Step 3 is external, not just aspirational.

  ***

  **Worked Cases**

  **1. Proposal: Cap on Short-Term Holiday Rentals**
  *   **Step 1 (Competence):** Shared (Tourism/Housing vs. Single Market). Proceed.
  *   **Step 2 (Core Autonomy):** **YES.** Regulating housing stock and local zoning is core municipal self-government (German principle).
  *   **Stop Rule:** **STOP: Object.**
  *   **Analysis:** While tourism has cross-border elements, housing allocation is fundamentally local. The higher level argues for uniformity to protect tenants, but this invades the core area. Even if regions *could* fail to regulate, the intrusion into zoning autonomy is disproportionate.
  *   **Verdict:** Strong subsidiarity violation. File objection.

  **2. Proposal: Common Accessibility Standards for Public Buildings**
  *   **Step 1 (Competence):** Shared (Disability Rights vs. Building Codes). Proceed.
  *   **Step 2 (Core Autonomy):** **NO.** Building standards are shared; no immutable core violation unless it dictates municipal staffing/budgets. Proceed.
  *   **Step 3 (Sufficiency):** **NO.** Regions acting alone create fragmentation. A disabled citizen cannot navigate varying standards across borders (real spillover/market failure). Higher level meets burden. Proceed.
  *   **Step 4 (Efficiency):** **YES.** Uniform standards reduce construction costs for multi-region firms and ensure mobility. Proceed.
  *   **Step 5 (Motivation):** **Necessity.** Argument is based on mobility rights and market function, not just aesthetic uniformity.
  *   **Step 6 (Political Kickback):** Not needed. Facts support higher level.
  *   **Verdict:** **Let it go up.**
  *   **Note:** I know you're a regionalist, but strict subsidiarity logic cedes this one. The cross-border spillover (mobility) and efficiency gains are real. Objecting here makes you look obstructionist rather than protective of autonomy. Save political capital for the rental cap.
