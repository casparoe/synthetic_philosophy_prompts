answer: |-
  1. The epiphenomenalist argues that the Glowhead's report tracks the glow via a common neural cause, or stronger still, that the glow is a constituent of the judgment state itself rather than its cause. This ensures the judgment is structurally locked to the experience even if the experience exerts no downstream causal power.
  2. While nomic covariation secures a reliable correlation, it struggles to ground robust aboutness or justification because the subject lacks access to the mechanism ensuring that correlation. Without causal contact, the judgment remains accidentally true relative to the glow, failing to constitute knowledge in most externalist frameworks.
  3. The self-stultification worry bites hard here, since the epiphenomenalist must admit their own theory is voiced solely by neural machinery regardless of whether consciousness exists. However, they can retort that the theory is true even if its assertion is causally independent of the truth it describes.
  4. This position forces a distinction between metaphysical truth and epistemic access, allowing the theory to be correct while admitting we cannot know it is correct. Such a separation preserves logical consistency but renders the consciousness it describes epistemically inaccessible to the subject holding the belief.
  5. Epiphenomenalism survives only in a weakened form that must explicitly give up the claim that phenomenal judgments constitute knowledge of experience. It remains a metaphysical possibility but collapses as an epistemology, leaving us with accurate reports about qualia that lack justificatory grounding.
