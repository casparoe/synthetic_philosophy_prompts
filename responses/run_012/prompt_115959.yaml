answer: |-
  # Q&A Prep Sheet: The Pasadena Game and Undefined Expectation

  **Context:** Departmental Colloquium
  **Audience:** Decision Theorists, Economists, Mathematician, Grad Students
  **Core Thesis:** The Pasadena Game has no well-defined Expected Value (EV); rational choice is possible without EV.

  ---

  ### 1. The Measure-Theoretic Status Quo
  **Who:** Senior Decision Theorist / Formal Epistemologist
  **Objection:** "You're presenting this as a discovery, but in standard Kolmogorov probability theory, expectation is defined via the Lebesgue integral. The Lebesgue integral requires absolute convergence. Since $\sum |1/n|$ diverges, the expectation is *already* undefined in standard theory. You haven't found a counterexample to expected utility theory; you've just described a random variable that falls outside its domain. Why is this a philosophical problem rather than a technical exclusion?"

  **Reply (2 mins):**
  "Standard theory does exclude the game, but it treats that exclusion as a boundary condition, not a normative verdict. It says, 'If you encounter this, our theory is silent.' My claim is stronger: the game is a *possible* prospect, and rational agents *can* face it. If the theory is silent on possible rational choices, the theory is incomplete, not merely bounded.
  Furthermore, standard theory often implicitly relies on the natural ordering of the series to assign a value of $\ln(2)$ in pedagogical contexts, creating a tension. I am arguing that this tension reveals a metaphysical gap: there is no fact of the matter about the value, not just a lack of a mathematical tool. We shouldn't define rationality by the limits of Lebesgue integration. If an agent can reason about the game using dominance or stochastic dominance, they are being rational, even if the integral doesn't exist. The problem isn't that the math fails; it's that we thought the math was necessary for rationality."

  **Weakness:** They may press you on whether "possible prospect" is coherent if the utility function must be measurable.
  **Strategy:** **HOLD FIRM.** If you concede this is just a technical exclusion, your paper becomes a footnote on measure theory rather than a critique of decision theory.

  ### 2. The Natural Ordering Argument
  **Who:** The Mathematician / Rigorous Decision Theorist
  **Objection:** "The Riemann rearrangement theorem applies to arbitrary series. But this game has a fixed sample space $\Omega = \{H, TH, TTH, ...\}$ indexed by $n$. The physics of the coin toss imposes a natural ordering on the states. Why are you permitted to rearrange the terms of the expectation sum? If the order is fixed by the index $n$, the sum converges to $\ln(2)$. The value is defined relative to the natural filtration."

  **Reply (2 mins):**
  "This is the crux of the argument. I deny that the index $n$ metaphysically fixes the summation order for *valuation*. Expectation is a weighted sum of values, not a temporal sequence of payments. The 'rearrangement' isn't about changing when the coin lands; it's about how we aggregate the value contributions of those outcomes.
  If I offer you a bundle of goods, the value of the bundle shouldn't depend on the order I list them on the invoice. If the EV depends on the summation order, then the EV is not a property of the *prospect*, but of the *description*. Since there is no privileged description of the state space— I could partition the outcomes differently —there is no privileged order. If the value changes based on how we partition the logical space, then there is no single fact of the matter about the value. To accept the natural order is to privilege a specific representation of the problem without justification."

  **Weakness:** This is the most technically vulnerable point. If they argue that the probability measure *itself* dictates the integration order, you risk looking mathematically naive.
  **Strategy:** **HOLD FIRM (CRITICAL).** Your paper collapses if the EV is $\ln(2)$. You must maintain that aggregation order is distinct from outcome indexing.

  ### 3. The Bounded Utility Defense
  **Who:** The Economists
  **Objection:** "This is an artifact of unbounded utility functions. In any realistic mechanism design or economic model, utility is bounded. If you bound utility at any finite $M$, the series becomes absolutely convergent. The Pasadena game doesn't exist in the real world. Why should we alter decision theory to accommodate a game that no real agent with a bounded brain could ever evaluate?"

  **Reply (2 mins):**
  "I agree that bounded utility 'solves' the math, but it solves it by changing the subject. The philosophical puzzle is about the structure of rational preference, not just engineering constraints. Even if human utility is bounded, we can conceive of the game, and we can ask what rationality *would* require if we could play it.
  Moreover, bounding utility creates its own paradoxes (e.g., refusing a gamble with a tiny probability of an enormous good). If we ban the Pasadena game to save Expected Utility (EU), we are protecting the theory by limiting its domain of application. I am arguing that EU is the wrong tool for the job, even in principle. We should have a theory that handles the unbounded case gracefully, rather than one that declares the case impossible. The existence of the paradox shows that 'boundedness' is a patch, not a foundation."

  **Weakness:** Economists will not care about "in principle" arguments. They care about models that work.
  **Strategy:** **CONCEDE (TACTICALLY).** Acknowledge boundedness works for *application*, but insist it fails for *foundations*. Don't fight them on empirical psychology; fight them on normative theory.

  ### 4. The Representation Theorem Challenge
  **Who:** Decision Theorist (Axiomatic Focus)
  **Objection:** "If your agent has coherent preferences over these prospects, a representation theorem (like Savage's or Jeffrey's) guarantees a utility function. If you say the value is undefined, you must be saying the preferences violate the axioms. Which axiom are you dropping? Continuity? Independence? If you drop them, you lose the representation. You can't have it both ways."

  **Reply (2 mins):**
  "I am dropping the assumption that a real-valued representation is necessary for rationality. Standard representation theorems assume that for any two acts, one is preferred or the agent is indifferent. I am arguing that in cases like Pasadena, preference can be *incomplete* without being irrational.
  The agent can prefer Act A to Pasadena and Pasadena to Act B, without assigning Pasadena a number. This violates the completeness axiom, but I argue completeness is a normative ideal, not a requirement of rationality. The Pasadena game shows why: forcing a number leads to contradiction or arbitrariness. So, the representation theorem doesn't prove I'm wrong; it proves that if you want a real-valued function, you must exclude this game. I choose to include the game and relax the requirement for a real-valued function."

  **Weakness:** They will argue that incomplete preferences make decision theory toothless (you can't recommend action).
  **Strategy:** **CONCEDE (TAXONOMIC).** Admit you are advocating for incomplete preferences. Your novelty is showing *why* this specific game forces that conclusion.

  ### 5. The St. Petersburg Comparison
  **Who:** Graduate Student
  **Objection:** "How is this genuinely different from the St. Petersburg paradox? In St. Petersburg, the expectation is infinite. Here, it's undefined. But in both cases, Expected Utility Maximization fails to give a actionable number. Why isn't the solution just 'don't use EU for infinite games' rather than your proposal about dominance and undefined values?"

  **Reply (2 mins):**
  "The difference is crucial. In St. Petersburg, the EV is $+\infty$. We know the direction of the value, even if it's unbounded. In Pasadena, the EV is undefined; it could be positive, negative, or zero depending on aggregation.
  St. Petersburg breaks EU because the number is too big. Pasadena breaks EU because there *is no number*. This matters for dominance. In St. Petersburg, you might argue you should pay any finite amount to play. In Pasadena, dominance reasoning is more subtle because the negative tails are as heavy as the positive ones. Treating them as the same 'infinite problem' obscures the fact that Pasadena lacks even a directional value. My proposal handles St. Petersburg too, but Pasadena shows the problem is deeper than just infinity; it's about conditional convergence."

  **Weakness:** If they argue that "undefined" and "infinite" are practically equivalent for decision making (i.e., "don't play"), your distinction looks pedantic.
  **Strategy:** **NEUTRAL.** Clarify the distinction, but don't get bogged down in St. Petersburg literature.

  ### 6. The Dutch Book Vulnerability
  **Who:** Decision Theorist (Bayesian Focus)
  **Objection:** "If you don't have a fair price (EV), aren't you vulnerable to a Dutch Book? If I offer you a ticket for the Pasadena game at $\$1$, and you accept, and then offer to swap it for a ticket worth $\$2$, and you swap, I can pump you. If you refuse to price it, you refuse to trade. How do you avoid money pumps without a sharp preference?"

  **Reply (2 mins):**
  "Dutch Book arguments presuppose that the agent must accept *any* bet offered at a price they deem 'fair.' If I claim the value is undefined, I am claiming there *is* no fair price. Therefore, I am not committed to accepting a bet at $\$1$ nor rejecting it based on EV.
  My decision rule is based on pairwise comparison, not pricing. I might reject the $\$1$ ticket not because the game is worth less, but because I have no valuation. I only trade if one option dominates another. A money pump requires a cycle of strict preferences ($A \succ B \succ C \succ A$). I am not proposing cyclic preferences; I am proposing gaps. You can't pump an agent who says 'I have no opinion on that trade' rather than 'I prefer that.' Incompleteness blocks the pump."

  **Weakness:** Sophisticated Dutch Book arguments can target incomplete preferences too (e.g., if you refuse to bet, you lose sure gains).
  **Strategy:** **DEFEND.** This is standard defense for incomplete preferences. Be confident.

  ### 7. The "Incomplete Preferences" Label
  **Who:** Senior Decision Theorist
  **Objection:** "You say rational choice doesn't require EV. Isn't this just the view that preferences can be incomplete? This is old news—Seidenfeld, Aumann, and others have worked on this for decades. What is the novel contribution of the Pasadena game over existing literature on incomplete preferences?"

  **Reply (2 mins):**
  "The literature on incomplete preferences often treats incompleteness as a starting axiom or a result of ignorance. My contribution is to derive incompleteness from the *structure of the prospect itself*.
  I am arguing that even with perfect information and coherent reasoning, the prospect *forces* incompleteness because the value is metaphysically undefined. Previous work says, 'You might not have a preference.' I am saying, 'You *cannot* have a preference represented by a number here without being arbitrary.' The Pasadena game provides a concrete, constructive counterexample to the claim that rationality implies completeness. It moves the debate from 'is incompleteness allowed?' to 'here is a case where incompleteness is required.'"

  **Weakness:** They may feel the distinction is semantic.
  **Strategy:** **CONCEDE (LABEL), FIGHT (MOTIVATION).** Accept the label "incomplete preferences," but insist the *justification* is new.

  ### 8. The "Hope Nobody Asks" Objection (The Buy-In)
  **Who:** Anyone (Practical Focus)
  **Objection:** "Okay, let's make it concrete. I am the bank. I will let you play the Pasadena game for a entry fee of $\$5$. Do you take the deal? Yes or no? If you say yes, you value it at more than $\$5$. If you say no, less. You just gave it a number. If you say 'I don't know,' you're irrational because you're passing up a potential gain (or avoiding a loss) without reason. What is your actual decision?"

  **Reply (2 mins):**
  "This is the hardest question, and the honest answer is: 'It depends on my alternative.' If my alternative is keeping the $\$5$, I might decline, not because the game is worth less than $\$5$, but because the risk profile is incompatible with my current position.
  If forced to choose between 'Play for $\$5$' and 'Keep $\$5$', I might remain indifferent or refuse to choose. This isn't irrational; it's a recognition that the options are incommensurable. If I say 'Yes', I am not assigning a value of $\$5.01$; I am expressing a preference for the gamble over the cash in that specific context. That preference doesn't generalize to a price of $\$4$ or $\$6$. I am rejecting the assumption that a 'Yes' implies a global numerical valuation. I can make a local choice without committing to a global price."

  **Weakness:** This sounds evasive. In a real choice situation, you *must* act.
  **Strategy:** **DANGER ZONE.** This is the most damaging practical objection. Practice this reply until it sounds decisive, not wishy-washy. Emphasize *local* vs *global* preference.

  ---

  ### Summary of Strategy

  *   **Hold Firm On:** **Objection #2 (Natural Ordering).** If you admit the temporal index fixes the EV, your thesis that the EV is undefined is false. You must argue that valuation aggregation is distinct from outcome indexing.
  *   **Hold Firm On:** **Objection #1 (Measure Theory).** Do not let them dismiss this as "already solved." Insist that mathematical exclusion $\neq$ normative solution.
  *   **Concede:** **Objection #3 (Bounded Utility).** Accept that bounded agents don't face this, but argue this limits the *scope* of EU theory, which is your point.
  *   **Concede:** **Objection #7 (Incomplete Preferences).** Accept the classification. Your novelty is the *derivation* of incompleteness, not the concept itself.
  *   **Watch Out For:** **Objection #8 (The Buy-In).** This is the "Hope Nobody Asks." It forces you to act as if there is a value. Prepare to distinguish between *choice* and *valuation*.
