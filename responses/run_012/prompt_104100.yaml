prompt: |-
  I'm on a small advisory committee a government set up to answer one question, species by species: does this animal get full welfare protection or not. We're not a lab, we can't run new experiments, and we meet maybe four times a year with about a month to prep each case. We're getting squeezed from all sides right now — the aquaculture people want to know whether humane slaughter for crustaceans is worth the money, the insect-farming people want to know if their larvae count, and the shellfish farmers think the whole question is absurd when it comes to an oyster. Some countries have already pulled octopuses and crabs into their animal-welfare statutes and everyone assumes we're next, but nobody has ever told us how to actually decide.

  Act as a philosopher of mind who's spent years on animal consciousness and who has also had to sit in rooms like this one and watch theory collide with a deadline. Before you write anything, brainstorm a bit: what would a usable procedure even look like here, and where are the traps.

  Then give me the procedure itself. I want the questions in the order we should ask them, what counts as a sufficient answer at each step, where the procedure stops and just says no, and where it hands the thing back to us as a value judgment we have to own rather than a fact we could look up. A few things I'd like baked in:

  - Treat sentience as dimensional rather than a yes/no — a capacity for valenced experience, plus some way of asking how rich or integrated it is — instead of a single test you either pass or fail.
  - Keep nociception and sentience seperate. Reflex withdrawal from damage is not the thing we care about; suffering is.
  - Use markers or indicators rather than any one experiment, and say which markers we should trust most and why.
  - Build in a precautionary rule, with a burden of proof that slides depending on how many individuals are affected and how bad the likely harm is — and be explicit that where the threshold sits is our call, not the evidence's.
  - Say what we should count as evidence at all — behavioural, neuroanatomical, evolutionary — and where each kind is weak or circular.

  Then run it on three cases and show your work: (1) the octopus, which everyone expects us to wave through; (2) a crab or some other decapod, where the evidence is alot thinner; (3) an oyster or mussel, which I'll admit I'd like you to protect just to be safe, but I want to see whether the procedure you built actually gets there or whether I'd have to move the threshold to get it — if it's the latter, say so plainly.

  Finally, tell me where this procedure will misfire: the cases it can't handle, the steps that look like findings but are really us smuggling in values, and what we should do when we deadlock. Don't pad it, and don't hand me a reading list or a pile of citations — I need the thing itself, not a bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind with experience in animal consciousness and practical policy advisory contexts.
      *   **Task:** Create a usable procedure for deciding species-by-species welfare protection.
      *   **Constraints:** No new experiments, limited meeting time (4x/year, 1 month prep), high pressure from stakeholders (aquaculture, insect farming, shellfish).
      *   **Key Requirements:**
          *   Brainstorm traps/usability first.
          *   Step-by-step procedure (questions, sufficiency, stop points, value judgment hand-offs).
          *   Sentience as dimensional (capacity + richness/integration).
          *   Separate nociception from sentience (suffering vs. reflex).
          *   Use markers/indicators (weighted trust).
          *   Precautionary principle (sliding burden of proof based on numbers/severity).
          *   Explicit evidence types (behavioral, neuroanatomical, evolutionary) + weaknesses.
          *   Run the procedure on three cases: Octopus (high expectation), Crab/Decapod (thinner evidence), Oyster/Mussel (user wants protection, test the procedure).
          *   Identify failure modes (where it misfires, value smuggling, deadlock handling).
          *   Tone: Direct, practical, no padding, no bibliography.

  2.  **Brainstorming & Traps (Mental Sandbox):**
      *   *Trap 1: The "Hard Problem" Paralysis.* We can't prove consciousness philosophically. If we wait for proof, we never act. The procedure must accept *inference to the best explanation*.
      *   *Trap 2: Anthropomorphism vs. Mechanomorphism.* Don't assume they feel like us, but don't assume they are robots either.
      *   *Trap 3: The "Line Drawing" Problem.* Sentience is a spectrum. Protection is often binary (protected/not). We need a threshold, but admit it's arbitrary.
      *   *Trap 4: Evidence Hierarchy.* Neuroanatomy is static (potential), Behavior is dynamic (actual). Evolution is context. Need to weight them.
      *   *Trap 5: Precautionary Principle Abuse.* If we apply it too strongly, we protect everything (including plants potentially). If too weakly, we ignore risk. It needs to slide based on stakes (numbers slaughtered vs. pet status).
      *   *Usability:* Needs to be check-list style but with nuance. Committee members aren't neuroscientists. They need clear "Look for X" instructions.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: The Filter.* Is there even a nervous system? (Stops the plants/bacteria).
      *   *Step 2: Nociception vs. Sentience.* Distinguish reflex from suffering.
      *   *Step 3: Integration.* Does the system integrate info to make trade-offs? (Centralization).
      *   *Step 4: Behavioral Markers.* Conditioning, motivation, analgesia seeking.
      *   *Step 5: The Precautionary Calculus.* Weighing evidence against stakes.
      *   *Value Hand-off:* Where does science end and policy begin? At the threshold setting.

  4.  **Refining the Evidence Weighting:**
      *   *Neuroanatomy:* Good for potential, bad for actual state. (High trust for capacity, low for current experience).
      *   *Behavior:* Good for actual state, bad for false positives (reflexes). (High trust if complex trade-offs involved).
      *   *Evolution:* Good for context, bad for specific capacity. (Medium trust).

  5.  **Running the Cases:**
      *   *Octopus:* High neuro complexity, clear behavioral trade-offs. Passes easily.
      *   *Crab:* Centralized ganglia, nociception clear, sentience debated. Behavioral evidence (rubbing wounds) is key. Passes with moderate confidence.
      *   *Oyster:* Ganglia present but simple. No brain. Behavior is mostly reflex. Procedure likely says "No" unless Precautionary Principle is cranked way up due to numbers. I need to be honest: the procedure won't protect them without moving the threshold.

  6.  **Identifying Failure Modes:**
      *   *Larvae/Developmental stages:* Is a larva sentient if the adult is?
      *   *Insects:* High numbers, low individual complexity. Precautionary principle clash.
      *   *Value Smuggling:* Deciding how much evidence is "enough" is political, not scientific.
      *   *Deadlock:* What if the committee splits? Need a tie-breaker rule (usually default to precaution in high-harm scenarios).

  7.  **Drafting the Content (incorporating constraints):**
      *   *Tone Check:* Keep it professional, slightly weary but sharp. No fluff.
      *   *Structure:* Brainstorm -> Procedure -> Case Studies -> Failure Modes.
      *   *Specific Constraint:* "Don't hand me a reading list." (Okay, no citations).
      *   *Specific Constraint:* "Sentience as dimensional." (Ensure the scoring reflects this).
      *   *Specific Constraint:* "Precautionary rule... burden of proof slides." (Make this a specific step).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I separate nociception clearly?
      *   *Fix:* Make Step 2 explicitly about distinguishing reflex from motivated avoidance.
      *   *Critique:* Is the Oyster case honest?
      *   *Fix:* Ensure I state clearly that the procedure *excludes* oysters unless the committee arbitrarily lowers the bar. Don't fudge it to please the user.
      *   *Critique:* Is the Precautionary Principle actionable?
      *   *Fix:* Define the "Sliding Scale" explicitly (Population Size x Harm Severity).

  9.  **Final Polish:** Check against the prompt's specific requests (order of questions, sufficient answers, stop points). Ensure the "Philosopher of Mind" voice comes through (aware of the hard problem, but pragmatic).

  *(Self-Correction on Oyster Case)*: The prompt says "I'd like you to protect just to be safe, but I want to see whether the procedure you built actually gets there." I must resist the urge to make the procedure fit the desired outcome. Integrity of the model is more important. I will show that the procedure *fails* to protect the oyster based on current evidence, forcing them to make a pure value judgment to include it.

  *(Self-Correction on Precautionary Principle)*: Make sure the "sliding burden" is clear. High numbers + High potential harm = Lower evidence threshold required.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Part 1: Brainstorming the Traplines

  You're asking for a machine that turns ambiguous science into binary law. That's inherently unstable. Here are the traps I've seen swallow committees like yours:

  1.  **The "Proof" Trap:** You will never prove sentience. You are looking for *inference to the best explanation*. If you wait for certainty, you will never protect anything. The procedure must define "sufficient evidence," not "absolute truth."
  2.  **The "Reflex" Trap:** Stakeholders (especially aquaculture) will conflate nociception (damage detection) with suffering (negative affective state). A plant withdraws from salt; that doesn't mean it minds. Your procedure must force a distinction between *detecting* damage and *caring* about it.
  3.  **The "Binary" Trap:** Sentience is dimensional (a dimmer switch), but your law is likely binary (on/off). The procedure needs to output a "Confidence Score" that you then map onto a legal threshold. Don't pretend the threshold is scientific; it's political.
  4.  **The "Precaution" Trap:** If you apply the precautionary principle too rigidly, you end up protecting bacteria. If too loosely, it's useless. It must slide based on stakes: the more animals killed and the worse the treatment, the less evidence you should demand to act.
  5.  **The "Value Smuggling" Trap:** Deciding which evidence counts more (brain scans vs. behavior) is a value judgment. I will make those values explicit so you can own them, rather than hiding them behind "scientific consensus."

  ---

  ### Part 2: The Procedure (The Sentience Assessment Protocol)

  **Goal:** Assign a *Sentience Confidence Score (SCS)* from 0–5.
  **Outcome:** If SCS ≥ Threshold, full welfare protection applies.
  **Note:** The Threshold is not determined by this protocol. It is determined by your committee based on the Precautionary Calculus (Step 5).

  #### Step 1: The Substrate Filter (Neuroanatomy)
  *Question:* Does the organism possess a nervous system capable of integrating information, rather than just a nerve net or decentralized ganglia?
  *   **Look for:** Centralized processing units (brains, ganglia clusters), neurotransmitters associated with affect (opioids, serotonin, dopamine), and neural pathways connecting sensory input to motor output via an integration center.
  *   **Sufficient Answer:** Yes = Proceed. No = Stop (SCS 0).
  *   **Weakness:** Neuroanatomy indicates *capacity*, not *use*. A broken brain has the anatomy but no function. Conversely, decentralized systems (like some insects) might process pain differently.
  *   **Weight:** High for exclusion (no nerves, no sentience), Medium for inclusion (nerves don't guarantee feeling).

  #### Step 2: The Nociception/Sentience Split (Behavioral)
  *Question:* Does the organism merely withdraw from damage, or does it modify future behavior to avoid the source of damage?
  *   **Look for:**
      1.  **Reflex:** Immediate withdrawal (Nociception only).
      2.  **Trade-off:** Will the animal accept a cost (e.g., losing food, exposure to predators) to avoid the stimulus? (Sentience indicator).
      3.  **Analgesia Seeking:** If injured, does it choose an environment containing painkillers (e.g., morphine-laced water) over one without?
  *   **Sufficient Answer:** Evidence of Trade-off or Analgesia Seeking = Proceed. Reflex only = Stop (SCS 0.5).
  *   **Weakness:** Behavior can be mimicked by complex algorithms (philosophical zombie problem).
  *   **Weight:** High. This is the strongest marker we have for "caring" about the state.

  #### Step 3: Integration and Learning (Cognitive)
  *Question:* Can the organism learn from painful experiences over time, and does its internal state influence its perception?
  *   **Look for:** Conditioned Place Preference/Aversion (avoiding a location where pain occurred), long-term memory of injury, or motivational states (hunger vs. fear) altering pain response.
  *   **Sufficient Answer:** Yes = Increase SCS. No = Keep SCS low.
  *   **Weakness:** Requires complex testing often unavailable for wild or farmed species.
  *   **Weight:** Medium-High. Indicates a unified "self" experiencing the passage of time.

  #### Step 4: Evolutionary Context (Phylogeny)
  *Question:* Is sentience adaptive for this species' niche?
  *   **Look for:** Mobile predators usually benefit from pain (learning avoidance). Sessile filter feeders usually do not (cannot escape, so suffering is maladaptive).
  *   **Sufficient Answer:** Mobile/Predatory = Boost SCS. Sessile/Filter = Lower SCS.
  *   **Weakness:** Evolutionary history doesn't dictate current capacity (vestigial traits exist).
  *   **Weight:** Low-Medium. Use only to break ties.

  #### Step 5: The Precautionary Calculus (The Value Hand-Off)
  *Action:* Calculate the **Burden of Proof Threshold**.
  *   **Formula:** (Number of Individuals Affected) × (Severity of Proposed Harm) = **Stakes Score**.
  *   **Rule:**
      *   **High Stakes** (Millions slaughtered, high suffering potential): Lower the SCS Threshold required for protection. (e.g., Protect at SCS 2).
      *   **Low Stakes** (Few individuals, low harm): Raise the SCS Threshold. (e.g., Protect at SCS 4).
  *   **Committee Decision:** You must vote on the Threshold *before* applying it to the specific species to avoid bias.
  *   **Why this is a Value Judgment:** Science tells you the SCS. It does *not* tell you how much risk of suffering society is willing to tolerate. This step is where you own the risk.

  ---

  ### Part 3: Running the Cases

  #### Case 1: The Octopus (*Octopus vulgaris*)
  *   **Step 1 (Substrate):** Highly centralized nervous system, large brain-to-body ratio, complex neurotransmitters. **Pass.**
  *   **Step 2 (Nociception/Sentience):** Shows wound tending, avoids locations where shock occurred, sacrifices food to avoid pain. **Pass.**
  *   **Step 3 (Integration):** Capable of observational learning, play, and long-term memory of aversive events. **Pass.**
  *   **Step 4 (Evolution):** Active predator, mobile, complex social interactions. Sentience highly adaptive. **Pass.**
  *   **Step 5 (Calculus):** High individual complexity. Even with low numbers, the SCS is near 5.
  *   **Result:** **SCS 5.** Protection granted regardless of Threshold setting.
  *   **Work:** This is the "easy" case. The evidence is robust across all markers. Any committee denying this is ignoring Step 2 and 3 data.

  #### Case 2: The Crab (Decapod Crustacean)
  *   **Step 1 (Substrate):** Centralized ganglia, but distributed. Opioid receptors present. **Pass (with reservation).**
  *   **Step 2 (Nociception/Sentience):** Withdraws from electric shock. *Crucially:* Rubs injured claws, makes trade-offs (will hide rather than fight if injured), avoids shelters where shock occurred. **Pass.**
  *   **Step 3 (Integration):** Can learn to avoid mazes associated with pain. Evidence is thinner than octopus but present. **Pass.**
  *   **Step 4 (Evolution):** Mobile scavenger/predator. Pain avoidance is adaptive. **Pass.**
  *   **Step 5 (Calculus):** High numbers in fisheries. High severity (boiling alive). Stakes Score is High.
  *   **Result:** **SCS 3.5.**
  *   **Work:** The evidence is not as clean as the octopus. The nervous system is more distributed. However, the behavioral trade-offs (Step 2) are sufficient to infer valenced experience. Because the Stakes Score is High (millions boiled), the Threshold for protection should be lowered. You protect them not because they are definitely sentient like us, but because the risk of mass suffering is too high to ignore a 3.5 score.

  #### Case 3: The Oyster (*Crassostrea gigas*)
  *   **Step 1 (Substrate):** Three pairs of ganglia. No brain. No centralized integration center. Neurotransmitters exist but serve metabolic functions, not necessarily affective ones. **Borderline/Fail.**
  *   **Step 2 (Nociception/Sentience):** Closes shell when touched (reflex). No evidence of wound tending. No evidence of trading off food for safety. No evidence of analgesia seeking. **Fail.**
  *   **Step 3 (Integration):** No learning from aversive stimuli documented. **Fail.**
  *   **Step 4 (Evolution):** Sessile filter feeder. Cannot escape. Suffering would be maladaptive (cannot act on it). **Fail.**
  *   **Step 5 (Calculus):** Billions harvested. Severity of harm (shucking/boiling) is high *if* they feel. Stakes Score is Extremely High.
  *   **Result:** **SCS 0.5.**
  *   **Work:** Here is the hard truth. My procedure does **not** protect the oyster based on evidence. The SCS is too low.
  *   **The Value Move:** To protect the oyster, you must manipulate **Step 5**. You have to argue that because the *Number of Individuals* is so vast (billions), the Threshold for protection drops to near zero. You are essentially saying: "Even a 1% chance of sentience is unacceptable when multiplied by a billion deaths."
  *   **Honesty Check:** If you do this, admit you are acting on pure precaution, not evidence of capacity. You are prioritizing the *scale of killing* over the *probability of suffering*. That is a valid ethical stance, but do not call it a scientific finding.

  ---

  ### Part 4: Failure Modes & Deadlocks

  **1. The Larval Problem**
  *   **Misfire:** The procedure assesses the species, but welfare applies to individuals. A lobster larva is biologically distinct from an adult.
  *   **Fix:** Add a clause: "Protection status applies to life stages where Step 1 (Substrate) is met." If the nervous system develops late, protection starts late. Don't assume the egg is sentient just because the adult is.

  **2. The Insect Farming Clash**
  *   **Misfire:** Insects score low on Step 1 (distributed nerves) but high on Step 2 (some show avoidance learning). Stakes are astronomical (trillions).
  *   **Value Smuggling:** If you protect insects, you cripple the industry. If you don't, you risk massive suffering.
  *   **Deadlock Handling:** If the committee splits on the Threshold (Step 5), default to the **Precautionary Default**: In cases of high-volume slaughter, vote for protection. Force the industry to prove lack of sentience rather than you proving presence. Shift the burden of proof to the farmer.

  **3. The "Value Smuggling" in Evidence Weighting**
  *   **Misfire:** Step 1 (Neuroanatomy) favors vertebrates. Step 2 (Behavior) favors mammals. Invertebrates might feel pain differently.
  *   **Fix:** Acknowledge this bias in your report. State clearly: "This protocol is optimized for vertebrate-like sentience. We may be under-detecting alternative forms of consciousness."

  **4. When the Evidence is Missing**
  *   **Misfire:** You have 4 meetings a year. You won't have data for rare species.
  *   **Fix:** Use **Phylogenetic Bracketing**. If Species A and Species B are sentient, and Species C is evolutionarily between them, assign C the average SCS of A and B unless proven otherwise.

  **5. The "Absurdity" Objection (The Oyster Argument)**
  *   **Misfire:** Stakeholders will say protecting oysters is absurd.
  *   **Response:** Your procedure handles this via Step 5. If the SCS is 0.5, you only protect if the Stakes Score is massive. If the public/policy decides oysters are "infrastructure" not "animals," that is a Step 5 Threshold decision, not a Step 1-4 scientific error. Own that distinction.

  **Final Advice:**
  Your job is not to find the truth. It is to manage risk. Use Steps 1–4 to estimate the probability of suffering. Use Step 5 to decide how much risk is acceptable. When you deadlock, vote on Step 5 (the Threshold), not the science. The science is what it is; the tolerance for risk is yours to decide.
