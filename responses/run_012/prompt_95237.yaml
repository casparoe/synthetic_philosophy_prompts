answer: |-
  This is a sharp, provocative angle. You've identified a genuine structural ambiguity in Devlin that often gets glossed over in introductory summaries. However, since you asked me to tear into it, I'm going to push hard on the three pressure points you identified: the novelty of the distinction, the "stalemate" claim, and the "liberal turn" conclusion.

  Here is the critique.

  ### 1. The Backward/Forward Distinction: Useful, but not a "Get Out of Jail Free" card
  You ask if this distinction does work or if you are relabeling something obvious. It is not obvious to undergraduates, so it has pedagogical value. Philosophically, however, it maps closely onto the **Retributivist vs. Consequentialist** justification for punishment.
  *   **Backward-looking:** Legal Moralism as Retributivism (Moore is the modern exemplar here). The act is *malum in se*; the state punishes because justice demands it.
  *   **Forward-looking:** Legal Moralism as Social Hygiene (Devlin). The act is *malum prohibitum* because it threatens the organism of society.

  **The Critique:** You claim standard objections (disgust, existence of shared morality) target the Backward-looking view and miss Devlin. **This is overstated.**
  Hart's primary objection to Devlin wasn't just "wrongness isn't enough." It was empirical and conceptual. Hart argued that Devlin fails to prove the *causal link* between private immorality and social disintegration. Hart attacks the *mechanism* of your Forward-looking Devlin. He says: "Even if we accept your goal (preserving society), you haven't shown that homosexuality threatens it."
  So, the debate isn't a stalemate because critics are aiming at the wrong target; the debate is a stalemate because Devlin's Forward-looking claim rests on a sociological empirical claim (immorality = disintegration) that Hart successfully renders dubious. You need to account for the fact that Hart *did* engage the Forward-looking argument, not just the Backward-looking one.

  ### 2. The Symmetry Problem: This is your strongest insight
  You are absolutely right that Forward-looking Legal Moralism has a symmetry problem. If the justification is "preservation of the existing fabric," then the preservation of a racist, slave-holding, or totalitarian fabric is equally justified *on these terms*.
  This is the **Conservative's Dilemma**: If conservatism is merely the preservation of institutions, it cannot distinguish between a healthy institution and a diseased one without importing a non-conservative standard of health.

  You ask if there is a principled asymmetry available, such as "only self-sustaining moralities count."
  **The Critique:** This won't work for Devlin. Devlin explicitly argues that the law is a **teacher**. He believes the criminal law functions to reinforce moral boundaries. If the morality were truly "self-sustaining," the law wouldn't need to intervene. By admitting the law must step in to stop erosion, Devlin admits the morality is *not* self-sustaining. Therefore, the "self-sustaining" escape hatch is closed by Devlin's own text.

  ### 3. The "Liberal Turn": The Weakest Link
  This is where your argument risks collapsing. You write: *"I want to say it has to take the first horn [smuggle in a substantive standard], and that this quietly turns it into a liberal view."*

  **The Critique:** This is a category error. Adopting a substantive standard for *which* moralities are worth conserving does not make you a liberal; it makes you a **Natural Law theorist** (e.g., John Finnis, Robert George).
  *   **Hartian Liberalism:** The state must be neutral among conceptions of the good; coercion is only justified by harm to others (autonomy-based).
  *   **Natural Law Moralism:** The state should promote human flourishing; some moralities are objectively "rotten" because they violate human nature, regardless of whether they are "shared."

  If Devlin concedes that "not all shared moralities are worth preserving," he has not necessarily become a Hartian liberal. He has simply admitted that "sharedness" is not the *sole* criterion. He could say, "We preserve shared morality *provided it aligns with the objective good." That is not liberalism; that is perfectionism.

  **Where is the gap?**
  The gap is between **"Non-Arbitrary Conservatism"** and **"Liberalism."**
  To make your "Liberal Turn" argument stick, you need to show that the *only* available substantive standard Devlin could use to filter "rotten" moralities is the **Harm Principle**.
  *   *Argument:* If Devlin says, "We can't enforce a morality that causes suffering," he is using Hart's metric.
  *   *Argument:* If Devlin says, "We can't enforce a morality that violates rights," he is using Hart's metric.
  *   *Counter:* If Devlin says, "We can't enforce a morality that is irrational/unnatural," he is *not* using Hart's metric.

  You suspect the move from "law can't pick" to "so it's liberal" is the weak spot. You are correct. It is only liberal if the *filter* is liberal. If the filter is "Christian Natural Law," the resulting view is illiberal, even if it is no longer purely majoritarian.

  ### Strategic Recommendations for the Piece

  1.  **Refine the "Stalemate" Claim:** Don't say critics miss the target. Say that critics often conflate the two, but that focusing on the Forward-looking nature reveals Devlin's vulnerability is *empirical*, not just normative. The stalemate exists because Devlin's sociology is unfalsifiable (how much disintegration counts?) rather than because he's being misread.
  2.  **Lean into the Symmetry Problem:** This is your killer point. Frame it as the "Nazi Devlin" problem. If a society shares a Nazi morality, and that morality binds them, does Devlin's logic require the law to enforce it? (The answer is yes, which is reductio ad absurdum).
  3.  **Fix the Conclusion:** Instead of claiming this turns Devlin into a Liberal, claim it turns him into a **Perfectionist**.
      *   *Option A:* He stays a pure majoritarian (Forward-looking only). Result: He justifies enforcing Nazi morality. (Unpalatable).
      *   *Option B:* He admits some moralities are objectively bad. Result: He is no longer arguing from "sharedness" but from "truth." This collapses his distinctiveness. He becomes a standard Natural Law theorist, and the "Devlin Thesis" (that society's existence *itself* justifies enforcement) evaporates.
      *   *Why this is better:* It shows that Devlin's specific contribution (the "disintegration thesis") is unstable. It either justifies too much (tyranny) or it relies on premises he doesn't defend (objective morality), in which case he doesn't need the "social fabric" argument at all.

  ### Summary of Answers to Your Questions

  *   **Does the backward/forward distinction actually do work?**
      Yes, it clarifies the *justification* structure, but don't claim Hart missed it. Hart attacked the causal link in the forward-looking argument.
  *   **Is the symmetry problem as bad as I think?**
      Yes, it is fatal to Devlin's specific formulation. It forces him off the "sharedness" ground.
  *   **Where is the weakest link in the second half?**
      It is the equation of "Substantive Standard" with "Liberalism." A substantive standard could be religious, aristocratic, or naturalistic. To prove it becomes *liberal*, you must prove the only viable standard for filtering moralities is *individual autonomy* or *harm*.

  **Final Verdict:** The piece has real teeth if you pivot the conclusion. Don't try to save Devlin by making him a liberal. Destroy Devlin by showing his Forward-looking argument forces him to either be a tyrant (enforce any shared morality) or a Natural Lawyer (enforce only *true* morality), neither of which sustains his original "social fabric" thesis. That is a much more exciting conclusion for a reading group than "Devlin was secretly Hart."
