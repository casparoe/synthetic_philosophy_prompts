prompt: |-
  I'm writing a short piece for a reading group on the Hart–Devlin debate and I'd like you to tear into it. Here's the argument in rough form — I havent written the prose out properly yet.

  Everyone reads the debate as one question: may the law enforce morality? Hart says only to prevent harm to others. Devlin says a shared morality is itself part of the social fabric, so its erosion is a harm, and the law may step in to stop it. Fine. My claim is that this framing hides a split. There are two ways to be a legal moralist. Backward-looking: the act was wrong, therefore it may be punished — the wrongness is the reason, full stop. Forward-looking: the act may be restricted because restricting it keeps the shared morality from decaying. I want to argue Devlin is only ever the second, and that almost all the standard objections — you can't show a shared morality exists, disgust isn't a reason, the law shouldn't enforce mere opinion — are aimed at the first. If I'm right, the debate is a stalemate for a boring reason: the critics keep hitting a target Devlin isn't standing on.

  The second half is where I get nervous. Forward-looking legal moralism has a symmetry problem. The mechanism is content-neutral: protect the prevailing morality, or it frays and something worse comes. But that argument seems to work just as well for a legislator trying to keep alive a morality I think is rotten. So the view either has to smuggle in a substantive standard for which moralities are worth conserving, in which case it's no longer really about conservation, or it bites the bullet and says any widely held morality may be legally propped up. I want to say it has to take the first horn, and that this quietly turns it into a liberal view — but I can't tell if that's a real result or just me redescribing Hart with extra steps.

  Comments please. Does the backward/forward distinction actually do work, or am I relabeling something obvious? Is the symmetry problem as bad as I think, or is there a principled asymmetry available (say, only moralities that are already self-sustaining get to count as 'the shared morality', so the law is never the thing doing the conserving)? And where is the weakest link in the second half — I suspect it's the move from 'the law can't pick which moralities are worth keeping' to 'so it's liberal,' but I can't see the gap clearly.
reasoning: |-
  Here's a thinking process that leads to the suggested critique:

  1.  **Analyze the User's Request:**
      *   **Task:** Critique ("tear into") a rough argument for a reading group piece on the Hart–Devlin debate.
      *   **Core Argument:**
          *   Standard reading: Hart (harm principle) vs. Devlin (social fabric/disintegration thesis).
          *   User's Claim 1: There are two types of legal moralism: Backward-looking (punish because wrong) vs. Forward-looking (restrict to prevent moral decay).
          *   User's Claim 2: Devlin is *only* Forward-looking. Standard objections (disgust, existence of shared morality) target Backward-looking. Thus, the debate is a stalemate due to talking past each other.
          *   User's Claim 3 (The Nervous Part): Forward-looking moralism has a "symmetry problem" (works for *any* morality, even rotten ones). To avoid this, it must adopt a substantive standard for *which* moralities to conserve. This supposedly turns it into a liberal view (like Hart's).
          *   User's Worry: Is the Backward/Forward distinction novel/useful? Is the symmetry problem fatal? Is the move to liberalism just "Hart with extra steps"?
      *   **Goal:** Provide sharp, constructive criticism on the philosophical validity, novelty, and coherence of these claims.

  2.  **Deconstruct Claim 1: Backward vs. Forward Legal Moralism:**
      *   *Is this distinction new?* Not entirely. Retributivism vs. Consequentialism in punishment theory maps somewhat onto this. In legal moralism specifically, Michael Moore (active legal moralism) is often read as backward-looking (wrongness justifies punishment). Devlin is widely understood as functionalist/utilitarian regarding social cohesion.
      *   *Does it do work?* Yes, it clarifies *why* Devlin argues the way he does. Devlin explicitly uses the "bond of society" argument, which is consequentialist (disintegration leads to harm).
      *   *Critique:* The user says standard objections target Backward-looking. Is that true? Objections about "disgust" (Wolfenden/Hart) target the *evidence* for shared morality, which applies to Devlin's forward-looking view too (if you can't identify the morality, you can't conserve it). Objections about "mere opinion" target the *authority* of morality, which also hits Devlin. So the claim that critics are hitting the wrong target might be overstated.

  3.  **Deconstruct Claim 2: Devlin as Purely Forward-Looking:**
      *   *Textual Evidence:* Devlin talks about society's right to protect its existence. He compares immorality to treason. Treason is often punished forward-lookingly (threat to state), but also backward-lookingly (betrayal).
      *   *Nuance:* Devlin does seem to think some acts are inherently intolerable, but his *justification* for law is the preservation of society.
      *   *Critique:* This is a strong reading, but be careful not to strawman Devlin. He does argue that society *is* a community of ideas, so attacking the ideas attacks the society. That's structural, not just consequentialist.

  4.  **Deconstruct Claim 3: The Symmetry Problem & The Liberal Turn:**
      *   *The Symmetry Problem:* This is the strongest philosophical insight. If the justification is "preserve shared morality," why not preserve Nazi morality if it's shared? This is the "Conservative Paradox."
      *   *The Proposed Solution:* Devlin must pick *which* moralities count.
      *   *The User's Conclusion:* This turns it into liberalism.
      *   *Critique:* This is the weakest link. Why does adding a substantive standard make it *liberal*?
          *   Hart's liberalism isn't just "pick good moralities." It's "law shouldn't enforce morality *unless* harm."
          *   If Devlin says "Only moralities compatible with human flourishing count," he's a Natural Law theorist (Finnis), not necessarily a Hartian Liberal.
          *   If Devlin says "Only moralities that don't cause harm count," he *has become Hart*.
          *   The user needs to distinguish between "Liberalism" (harm principle/autonomy) and "Non-Arbitrary Conservatism" (Natural Law/Objective Good).
      *   *The "Self-Sustaining" Idea:* The user suggests: "only moralities that are already self-sustaining get to count." This is interesting. If the law is only a stopgap, not the engine, does that save it? Maybe, but Devlin explicitly says the law *is* a teacher of morality. So this contradicts Devlin.

  5.  **Synthesize the Critique:**
      *   **Tone:** Rigorous, encouraging, but challenging (as requested: "tear into it").
      *   **Structure:**
          1.  Validate the core insight (Forward/Backward is useful).
          2.  Challenge the "Stalemate" claim (Critics hit Devlin too).
          3.  Deep dive into the Symmetry Problem (The strongest part).
          4.  Attack the "Liberal Turn" conclusion (The weakest part).
          5.  Offer specific suggestions for refinement.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Point 1 (Distinction):* Acknowledge it maps onto Retributivism vs. Consequentialism. It's not brand new, but it's a helpful lens for *this* debate.
      *   *Point 2 (Devlin's Target):* Hart knew what he was doing. Hart attacked the *link* between morality and disintegration. He didn't just say "wrongness isn't enough." He said "Disintegration isn't proven." So the user's claim that critics miss the target is partially wrong. Hart targeted the *empirical claim* of the forward-looking view.
      *   *Point 3 (Symmetry):* This is the gold. The "Conservative's Dilemma." If the justification is stability, stability of *what*?
      *   *Point 4 (The Liberal Slide):* Here's the kill shot. Adopting a substantive standard doesn't make you liberal; it makes you a Natural Lawyer (e.g., Finnis, George). Liberalism is about *neutrality* or *autonomy*, not just "good morality." If Devlin admits some moralities are "rotten," he needs a metric. If the metric is "harm," he's Hart. If the metric is "human flourishing," he's Aquinas/Finnis. Neither is necessarily "Hart with extra steps."
      *   *Point 5 (Self-Sustaining):* Devlin explicitly rejects this. He thinks law *teaches*. So the "law is never the thing doing the conserving" idea contradicts the text.

  7.  **Final Polish:** Ensure the tone is appropriate for a reading group context (intellectual, peer-to-peer). Make sure to answer the specific questions at the end of the prompt.

      *   *Q1: Does the distinction do work?* Yes, but don't overclaim novelty.
      *   *Q2: Is symmetry problem bad?* Yes, it's fatal unless solved.
      *   *Q3: Weakest link?* The definition of "liberal."

  8.  **Refining the "Liberal" point:** I need to be careful here. If Devlin concedes that the state cannot enforce *any* shared morality, but only *reasonable* shared morality, he has conceded the liberal point that there is a limit to state power based on something *other* than mere popularity. That *is* a liberal concession. But it doesn't make the theory Hartian. It makes it a hybrid. I should push the user to be precise about *which* liberalism they mean.

  9.  **Final Review against User Prompt:** The user wants me to "tear into it." I need to be critical but helpful. I will structure the response to address the three main components of their argument.

      *   *Component 1: The Distinction.* (Good, but Hart knew this).
      *   *Component 2: The Stalemate.* (Overstated. Hart attacked the empirical premise).
      *   *Component 3: The Symmetry/Liberal Turn.* (The most interesting part, but the conclusion is muddy).

