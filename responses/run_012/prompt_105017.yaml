prompt: |-
  Me and my friend Priya spent about two hours last night going back and forth about Skolem's paradox and by the end neither of us could remember what we were even disagreeing about, so I want to actually write it down properly — a document we could both sign, where the stuff we agree on is stated cleanly and the actual disagreement is nailed down instead of us re-litigating it every time we get a drink. I'm the one who thinks the paradox is devastating, she's the one who thinks it's a nothingburger, and I'd like to know how much of that is a real disagreement and how much is us using different words.

  Setup we both accept, so you don't have to re-derive it: Löwenheim–Skolem says a consistent first-order theory in a countable language, if it has an infinite model, has a countable model. ZFC is such a theory and (if it's consistent) has infinite models, so it has a countable model, call it M. ZFC proves Cantor's theorem, so M has an element that M calls the set of reals, and M says that set is uncountable — i.e. no bijection between it and M's ω shows up in M. But from where we're standing M's entire domain is countable, so there is such a bijection, it just isn't in M, and it can't be, or M would be proving one of its own theorems false. Fine. That bit we're agreed on.

  My line is that this shows there's no fact of the matter about whether a set is really countable — "uncountable" only ever means "uncountable relative to some model" — so there's no privileged intended universe of sets, and if you bolt on the completeness theorem you get the Putnam version where even reference is indeterminate. Which means the platonist's "the real sets" is a story we tell ourselves. I'm pretty sure Skolem himself was on this side, he thought set theory hands you relative notions rather than the absolute ones.

  Priya's line is: no, all this shows is that M's membership relation isn't the real one, so M was never the intended interpretation of the axioms to begin with. "Countable in M" is just a different property from "countable", and the real property is as determinate as anything. She also says my argument eats itself, because when I say M's domain is "really only countable" I'm helping myself to an absolute notion of countability from outside the model, which on my own view doesn't exist.

  What I want from you is the joint statement, in these sections, in this order:

  1. "What we both sign" — a numbered list of claims we can both put our names to, including about the mathematical facts and about what needs explaining. About 300 words.
  2. "My case" and then "Her case" — each position stated in wording its own side would actually accept, not a strawman version of either. About 150 words each.
  3. "The cruxes" — a table with columns for the sub-question, what I predict, what she predicts, and what kind of argument or result we'd both agree bears on it. Three or four rows, and don't pad it with fake cruxes that neither of us would care about.
  4. "Where we're just using different words" — say straight out which parts of our fight are verbal and why, about 150 words. If the answer is "none of it", say that instead.
  5. "What would move us" — what each of us would have to be shown to give up our line. About 100 words.

  Please don't give me a reading list or "see so-and-so 2019" stuff, I can't look anything up right now and I don't want to be told what to go read, I want the document. Also don't hedge everything into mush — if you think one of us is just wrong, put that in, just put it somewhere we could both still sign the rest.
