  # Joint Statement on Skolem's Paradox

  ### 1. What we both sign

  1. We accept the Löwenheim–Skolem theorem: if ZFC is consistent, it has a countable model $M$.
  2. We accept that within $M$, there exists an element $R$ such that $M \models$ "$R$ is uncountable" (i.e., $M \models \neg \exists f (f: \omega \to R \text{ is bijective})$).
  3. We accept that from the metatheory, the domain of $M$ is countable, so there exists a bijection $g: \omega \to \text{domain}(M)$, and consequently a bijection between $\omega$ and $R^M$.
  4. We agree this bijection $g$ is not an element of $M$.
  5. We agree this situation generates a philosophical tension regarding the meaning of "set" and "countable."
  6. We agree that any resolution must explain why the internal notion of uncountability does not collapse into triviality given the external countability, or else explain why the external perspective is not privileged.
  7. We agree that the dispute is not about the mathematics itself, but about the metaphysical and semantic implications of these mathematical facts for the concept of absolute infinity.
  8. We acknowledge that ZFC is the standard formalization of set theory, but agree that its formal properties do not automatically settle ontological questions.
  9. We commit to distinguishing between syntactic satisfaction ($\models$) and semantic truth in the intended universe.
  10. We agree that Skolem's Paradox arises precisely from the gap between these two notions.
  11. We agree that resolving this requires addressing whether the metatheory possesses a privileged status over the object theory.
  12. We agree that neither of us denies the mathematical derivation; the conflict is exclusively interpretative.
  13. We agree that the existence of $M$ is not in doubt, only its philosophical significance.
  14. We recognize that this document serves to freeze our current positions to prevent circular re-argumentation in future discussions.

  ### 2. Positions

  **My case**
  The paradox demonstrates that "uncountable" lacks absolute extension. Since any candidate for the "true universe" can be modeled countably from a broader perspective, there is no model-independent fact about cardinality. Set-theoretic notions are inherently relative to the theory/model being used. Consequently, the Platonist claim of a unique, intended universe of sets is untenable. The existence of the external bijection shows that $M$'s "uncountable" set is genuinely countable, proving that first-order axioms fail to capture absolute size. Reference to "the sets" is indeterminate. This relativism extends to all set-theoretic properties. There is no "God's eye view" to fix the domain. The paradox is not a technical glitch but a fundamental limit on formalization. Thus, ontological commitment to sets must be understood instrumentally rather than realistically.

  **Her case**
  The paradox confuses truth in a model with truth simpliciter. $M$ is a non-standard interpretation where the membership relation differs from the real $\in$. "Countable in $M$" is a technical property distinct from genuine countability. The metatheory used to construct $M$ already presupposes absolute notions of finite and countable. To deny absolute countability while using it to describe $M$'s domain is performative contradiction. The axioms successfully describe the intended universe; $M$ is merely a deviant structure that satisfies the syntax but misses the semantics. Mathematical practice relies on absolute distinctions. The existence of non-standard models does not invalidate the standard interpretation any more than non-Euclidean geometries invalidate Euclidean space. Therefore, the realist ontology remains secure despite the existence of non-standard models.

  ### 3. The cruxes

  | Sub-question | My Prediction | Her Prediction | Agreed Bearing |
  | :--- | :--- | :--- | :--- |
  | **Status of Metatheory** | The metatheory is just another theory, subject to its own Skolem paradox. | The metatheory captures our actual reasoning and fixes absolute notions. | Whether an infinite regress of metatheories undermines absolute reference. |
  | **Determinacy of Reference** | First-order axioms cannot fix reference to a unique domain. | Reference is fixed by causal/intentional connection, not just axioms. | Whether semantic externalism solves the model-theoretic argument. |
  | **Nature of "Set"** | "Set" is defined entirely by structural role in a model. | "Set" refers to a specific ontological category independent of models. | Whether mathematical practice treats cardinality as absolute. |

  ### 4. Where we're just using different words

  Some friction is verbal. When I say "$R$ is really countable," I mean there exists a bijection in the metatheory. When Priya says "$R$ is really uncountable," she means no bijection exists in the intended universe. We are often talking past each other about which context defines "really." Additionally, we sometimes use "model" interchangeably with "universe." If I treat the metatheory as just another model, and she treats it as the court of appeal, we will talk past each other. However, this verbal slippage does not dissolve the core dispute: whether the metatheory's perspective is privileged or just another relative standpoint. The self-refutation charge hinges on whether using absolute notions in the metatheory commits one to their existence in the object theory. We also differ on "fact of the matter." I mean ontological fact; she means determinate truth conditions. Clarifying these definitions will reduce heat but not solve the problem. We must stop conflating "undefinable in L" with "non-existent."

  ### 5. What would move us

  **Me:** I need a demonstration that first-order logic can categorically fix the domain of sets without presupposing the very notions it seeks to define, or a proof that the metatheoretic stance is not subject to relativization.

  **Priya:** She needs a demonstration that mathematical practice cannot coherently maintain absolute cardinality claims given the model-theoretic facts, or that the "intended interpretation" is metaphysically incoherent without relying on circular definitions.

  Neither of us will move based on intuition pumps alone; we require structural arguments about reference or logic. We agree that mere appeal to "mathematical intuition" is insufficient without accounting for the LS theorem.
