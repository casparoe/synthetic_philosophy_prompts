      *   **Audience:** 1/3 grad school dept (knows philosophy), 2/3 family (Catholic family, parents, no philosophy background).
      *   **Core Philosophical Conflict:** Utilitarianism (aggregate good) vs. Separateness of Persons (Rawlsian objection, individual integrity).
      *   **Goal 1 (Priya's Side):** Validate her feeling. A person isn't just a vessel for utility. You can't trade a life for a "pile of good." Use a vivid case (e.g., sharing suffering doesn't add up numerically but matters morally).
      *   **Goal 2 (The Marriage):** Don't destroy the marriage with the philosophy. If persons are *too* separate, sacrifice looks like a mistake. Need to make sacrifice meaningful without resorting to "two becoming one" clichés.
      *   **Constraints:** No heavy jargon (no "aggregate," "Rawls," etc. unless explained simply/naturally). No closing poem quote. End on something concrete (met via broken photocopier). Tone should be warm, insightful, not lecture-like.
      *   **Length:** Around 800 words.

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Problem:* Utilitarianism says maximize total happiness. If Dan suffers a lot but Priya gains a little more, net positive. Priya feels this erases her individual worth.
      *   *The Rawlsian Objection:* Society isn't one big person. Individuals are distinct. You can't sacrifice one for the many easily.
      *   *The Marriage Problem:* If they are totally distinct, why sacrifice for each other? If Dan takes a worse job for Priya, utilitarianism says "okay if net gain," but strict separateness says "why hurt yourself?" The "two becoming one" cliché solves this but is cheesy and philosophically dubious (erases individuality).
      *   *The Solution:* Love as a voluntary bridging of separateness. Not merging, but choosing to weigh the other's utility heavily in your own calculus. Or, recognizing that some things (like love) aren't measurable utilities. The toast needs to navigate: "You are separate, which makes your choice to care for each other meaningful."

  3.  **Drafting - Section by Section:**

