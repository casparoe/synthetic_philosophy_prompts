answer: |-
  Good evening. For those who don't know me, I'm one of Dan's friends from grad school. Which means I've spent a lot of time in rooms where we argue about how to live a good life. Usually, those arguments end with pizza. Tonight, they end with champagne.

  Dan, as many of you know, takes these questions seriously. He still has a utilitarian sticker on his laptop. For the non-philosophers here, that means he believes in maximizing the total amount of good in the world. At your engagement dinner, Dan, you cheerfully told Priya's parents that you'd accept a policy that made your own life worse, as long as it raised the overall total. It was a principled stand. But Priya, you went quiet. Later, you told me it made you feel like you were marrying a line item in somebody's spreadsheet.

  I've been thinking about that silence for three weeks. And I think you were right to feel that way.

  There is an old objection in ethics that says treating people like containers for happiness misses the point. We aren't just places where utility happens to be located. We are distinct lives. To see why this matters, imagine a case. Suppose Dan gets terribly sick. The suffering is intense. Now, suppose Priya could magically take on half that suffering. By the numbers, nothing has changed. The total amount of pain in the universe is identical. But everyone at this table knows something enormous has been gained. Why? Because Priya isn't balancing a ledger; she is witnessing *him*. She is saying, "Your pain matters to me, not because it affects the total, but because it is yours."

  If you treat a person as just a vessel for good, you can trade them away for a slightly bigger pile of happiness elsewhere. But you can't trade a life for a pile of anything. Priya, your instinct was correct: you are not a resource to be allocated. You are a person to be known.

  But here is the hard part. If we insist too hard on how separate we are, marriage starts to look like a mistake. If Dan and Priya are truly distinct islands, why should Dan ever take a worse job to support Priya's career? Why should Priya spend a decade caring for Dan's parents? If we are separate, every sacrifice is just a loss. A net negative.

  Some people solve this by saying marriage makes two people into one. I don't buy that. You aren't missing halves waiting to be made whole. You are two complete, separate adults. And that is exactly why what you are doing is so brave.

  Love isn't erasing the boundary between you. It's voluntarily building a bridge across it. When Dan sacrifices for Priya, he isn't forgetting that he is separate from her. He is acknowledging it. He is saying, "I know your good is not technically mine, but I choose to care about it as if it were." That isn't math. That's a gift. And a gift only means something if you have the right to keep it. You have to be separate enough to own your life before you can give it away.

  So, Dan, you don't need the sticker anymore. You've found a system where the individual matters more than the aggregate. And Priya, you aren't a line item. You're the co-author.

  You two met because of a broken photocopier. Dan was trying to fix it; Priya was waiting to use it. Technically, the machine was the problem. But really, it was an opportunity. One of you was stuck, and the other one stopped to help. Not because the numbers worked out. Not because it was efficient. But because someone was standing there.

  Here's to the broken machines, the separate lives, and the choice to cross the gap between them. To Dan and Priya.
