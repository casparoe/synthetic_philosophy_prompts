answer: |-
  Here is the specification for an adequate theory of the lying/misleading distinction.

  ### Part 1: The Requirements Spec

  An adequate theory must satisfy the following seven constraints. If it fails one, it is incomplete; if it fails three, it is dead.

  **1. The "Literal Truth" Constraint (The Slimy Lawyer Case)**
  *   **The Case:** A lawyer asks, "Did you steal the money?" The defendant says, "I have never stolen money in my life" (technically true, as this is the first time), knowing the questioner will infer "I didn't steal *this* money."
  *   **Requirement:** The theory must explain why this generates *less* moral blame than a flat "No," despite identical intent and outcome. It cannot treat all intentional deception as morally equivalent.

  **2. The "Missing Data" Constraint (The Tobacco Scientist Case)**
  *   **The Case:** A scientist says, "No study has shown this chemical causes cancer," knowing no study has ever been run.
  *   **Requirement:** The theory must distinguish this from a lie ("This chemical is safe"). It must account for the specific wrong of exploiting an *assumption of completeness* (the hearer assumes if there were a study, you'd know it) without collapsing it into a lie.

  **3. The "Pre-Existing Error" Constraint (The Silent Beneficiary Case)**
  *   **The Case:** A cashier gives you $20 too much change. You say nothing. They assume you paid more. You didn't assert anything false; you banked on their existing mistake.
  *   **Requirement:** The theory must adjudicate whether *allowing* a false belief (misleading by omission) carries the same weight as *creating* one (lying). It must separate the duty not to harm from the duty to correct.

  **4. The "Worse Misleading" Constraint (The Gaslighting Case)**
  *   **The Case:** A manipulator uses strictly true statements to make a victim doubt their sanity (e.g., "You're remembering it wrong, I was home all night," when they were out but returned before you woke).
  *   **Requirement:** The theory must allow for cases where misleading is *morally worse* than a lie. A rigid "Lying is Always Worse" deontology fails here. The mechanism of manipulation (exploiting trust/reasoning) must be weighable against the mechanism of assertion.

  **5. The "Moral Equivalence" Constraint (The High-Stakes Betrayal Case)**
  *   **The Case:** A spouse cheats. When asked, they either lie ("I was at work") or mislead ("I was stuck in a meeting" — technically true, they were at the office having an affair).
  *   **Requirement:** In high-stakes, intimate contexts where intent and harm are identical, the theory must explain why the moral difference often *vanishes*. It cannot fetishize the linguistic mechanism when the relational breach is total.

  **6. The "Permissible Deception" Constraint (The Nazi at the Door Case)**
  *   **The Case:** Hiding a refugee. You can lie ("No one is here") or mislead ("They went that way" while pointing elsewhere).
  *   **Requirement:** The theory must explain why *both* are permissible here, but for potentially different reasons. If it says lying is intrinsically wrong, it must explain why that intrinsic wrong is overridden here without making misleading the "safer" option (which encourages casuistry).

  **7. The "Psychological Plausibility" Constraint (The Detectability Gap)**
  *   **The Case:** Post-hoc, victims often cannot distinguish whether they were lied to or misled.
  *   **Requirement:** The theory cannot rely on distinctions that are invisible to the victim in real-time. If the theory claims misleading is "better," but the victim feels equally violated and cannot tell the difference, the theory lacks normative grip. It must account for *blame assignment* as it actually happens, not just in a lab.

  ***

  ### Part 2: The "Input vs. Process" Hypothesis

  Your friend's view: **Lying corrupts Inputs (false premises); Misleading corrupts Process (valid inference on true premises).** He claims Process corruption is worse because it's harder to debug.

  **Verdict:** This is a **redescription wearing a lab coat**, but it earns partial keep on *epistemic* grounds, not moral ones.

  **Why it's a redescription:**
  *   "False Input" is just a philosophical restatement of "False Assertion" (Lying).
  *   "Corrupting Process" is just a restatement of "Exploiting Implicature" (Misleading).
  *   The machinery is the same; he has just renamed the parts.

  **Where it earns its keep:**
  *   It correctly identifies that misleading often requires the hearer to *do more work*. To be misled, you must actively infer. To be lied to, you can passively receive.
  *   It highlights the **Repair Cost**. If you discover a lie, you discard the data point ("He lied about X"). If you discover you were misled, you have to distrust your own *inference rules* ("I thought 'meeting' implied 'working'"). That is indeed more destabilizing to the epistemic agent.

  **Where it fails:**
  *   **Moral Direction:** It predicts misleading should *usually* be worse. Our intuitions say lying is *usually* worse (or at least distinct). The theory inverts the standard moral hierarchy without sufficient justification.
  *   **Mechanism:** Not all misleading corrupts "process." Some misleading is just ambiguity ("I might be there" when you know you won't). That's not valid inference; that's vagueness.
  *   **Conclusion:** Treat this as a useful *heuristic* for assessing epistemic harm, not as a foundational moral theory. It explains why gaslighting (process corruption) is hellish, but it doesn't solve the general lying/misleading debate.

  ***

  ### Part 3: The Killer Constraint

  **The "Variable Blame Gap" Requirement (Requirement #1 + #5 combined).**

  This knocks out the most theories.
  *   **Rigid Deontology** (Lying is intrinsically wrong) fails the **High-Stakes Betrayal Case**. It cannot explain why the spouse who misleads about the affair isn't morally superior to the one who lies, given the betrayal is identical.
  *   **Rigid Consequentialism** (Only outcomes matter) fails the **Literal Truth Case**. It cannot explain why we blame the "Slimy Lawyer" less than the flat liar, even if the legal outcome is identical.
  *   **The Friend's Input/Process Theory** fails the **Nazi Case**. If process corruption is worse, we should prefer lying to the Nazi (bad input) over misleading him (corrupting his reasoning). Almost no one accepts this.

  A theory must explain why the moral gap between lying and misleading *widens* in low-stakes/technical contexts but *narrows or closes* in high-stakes/relational contexts. Most theories are static; they cannot handle the sliding scale.

  ***

  ### Part 4: The Incompatible Pair

  These two requirements are in deep tension. Satisfying both fully is likely impossible; a theory must prioritize one.

  **1. The "Technical Truth" Constraint (Speaker Integrity)**
  *   **Definition:** The speaker's moral record depends on the literal truth-value of their assertions. If I didn't *say* it, my hands are cleaner.
  *   **Motivation:** Protects speaker autonomy and the value of literal honesty. Encourages precision.

  **2. The "Reasonable Reliance" Constraint (Hearer Security)**
  *   **Definition:** The speaker's moral record depends on what a reasonable hearer would infer. If I *knew* you'd believe it, I'm responsible for the belief.
  *   **Motivation:** Protects the hearer's epistemic safety and the cooperative nature of communication.

  **The Conflict:**
  You cannot maximize both.
  *   If you prioritize **Technical Truth**, you permit the "Slimy Lawyer" and the "Tobacco Scientist." You protect the speaker's integrity at the cost of the hearer's understanding.
  *   If you prioritize **Reasonable Reliance**, you condemn the "Slimy Lawyer" as effectively a liar. You protect the hearer at the cost of the speaker's ability to use language precisely or withhold information.

  **The Trade-off:**
  Any adequate theory must admit that **Speaker Integrity and Hearer Security are zero-sum in deception cases.** You cannot have a theory that says "Misleading is objectively better for the speaker" *and* "Misleading is equally harmless for the hearer." The spec requires you to choose whose vulnerability matters more when the two diverge.
