      *   *Idea:* **The "Technicality" Constraint** (It matters that the words were true) vs. **The "Transparency" Constraint** (It matters that the hearer could reasonably infer the truth).
      *   If you satisfy Technicality, you allow misleading (words were true).
      *   If you satisfy Transparency, you condemn misleading (hearer was led astray).
      *   These are in direct tension. A theory must weigh them.
      *   *Wait, the prompt asks for requirements the theory MUST deliver.* If they are incompatible, the theory *fails*.
      *   *Re-reading prompt:* "flag any two requirements you think can't be jointly satisfied." Okay, so I need to point out where the spec breaks.
      *   *Candidate:* **The "Distinct Wrongness" Requirement** (Lying is pro tanto worse) vs. **The "Identical Harm" Requirement** (When outcomes/intent match, blame should match).
      *   If Lying is *intrinsically* worse, blame should differ even if harm is identical.
      *   If Blame should match when harm is identical, Lying isn't intrinsically worse.
      *   This is the core tension. I will frame this as **The Intrinsic Difference Constraint** vs. **The Outcome Parity Constraint**.

      *   *Re-evaluating Friend's View:* Be careful not to be too dismissive. The "Input/Process" distinction maps onto "Assertion/Implicature." The claim that Process corruption is *worse* is counter-intuitive to standard views (usually Lying is worse). I need to assess if it holds water. It holds water in *epistemic* terms (trust in reasoning vs trust in data), but not necessarily *moral* terms (violation of norm). I will call it a "Redescription with Epistemic Value, Moral Neutral."

      *   *Killer Constraint:* **The "Nazi at the Door" vs. "Slimy Lawyer" Duality.** The theory must explain why misleading is *permitted* in the first but *condemned* in the second, without relying solely on stakes. It's the **Context-Sensitivity of the Norm**. Most theories are context-insensitive.

