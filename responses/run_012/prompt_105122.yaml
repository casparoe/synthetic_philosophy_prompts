          *   **Tone:** Direct, analytical, no fluff, no reading list, no scorecard of existing theories.
          *   **Assumption:** "Lying" is already defined/stipulated (no need to debate the definition of lying itself, just the moral comparison).

  2.  **Drafting the Requirements List (The Spec):**
      *   *Requirement 1: The Literal Truth Exploit.* (The "I didn't say *I* stole it" case). Theory must explain why this often feels lighter than a lie, or when it doesn't.
      *   *Requirement 2: The Missing Data Case.* ("No study shows X" when no study exists). This is misleading but technically true. Is it worse than a lie?
      *   *Requirement 3: The Pre-existing False Belief.* (Hearer thinks X, Speaker knows X is false but says nothing or says something compatible). Is silence/ambiguity worse than correction?
      *   *Requirement 4: The "Worse Misleading" Case.* (Gaslighting/Frame-shifting). Where misleading is morally weightier than a simple lie.
      *   *Requirement 5: The Moral Equivalence Case.* (High stakes, same intent, same outcome). Where the distinction vanishes.
      *   *Requirement 6: The Permissible Deception Case.* (Nazi at the door/Self-defense). Where both are allowed, but maybe for different reasons.
      *   *Requirement 7: Distinction Integrity.* Must separate Speaker Belief, Hearer Belief, and Reasonable Inference.
      *   *Requirement 8: Act vs. Outcome.* Must account for deontological (act-based) vs. consequentialist (outcome-based) intuitions.
      *   *Requirement 9: Psychological Plausibility.* Must align with how blame is actually assigned (e.g., detectability matters).

  3.  **Evaluating the Friend's "Input vs. Process" Hypothesis:**
      *   *The Claim:* Lying = Bad Input (false premise). Misleading = Bad Process (corrupting inference). Claim: Process corruption is worse/harder to fix.
      *   *Analysis:* Is this new?
          *   Lying *does* feed false input.
          *   Misleading *does* often rely on valid inference from true premises to false conclusions.
          *   *Critique:* Is it *always* true? Sometimes misleading involves hiding input (omission). Sometimes lying corrupts process (undermining trust in the source).
          *   *Verdict:* It's a sophisticated redescription, but it *does* add value regarding *epistemic hygiene*. It highlights the long-term damage to the hearer's reasoning capabilities vs. just a single data point error. However, it fails as a *moral* theory on its own because "corrupting process" isn't always the mechanism of misleading (sometimes it's just ambiguity). It's a strong *heuristic* but not a complete *theory*. I need to be honest: it's largely a redescription with a useful epistemic spin, but it doesn't solve the normative conflict.

  4.  **Identifying the "Killer Constraint" (Most Work):**
      *   Which requirement kills the most theories?
      *   Usually, it's the **Moral Equivalence in High-Stakes/Identical Intent** case.
      *   Why? Pure Deontologists (Kantians) say lying is *always* worse (intrinsic wrong). Consequentialists say they are *identical* if outcomes match.
      *   The "Killer" is requiring the theory to explain why we *sometimes* feel a difference (Low stakes, technicalities) but *sometimes* don't (High stakes, clear intent), without collapsing into pure intent or pure act.
      *   Actually, a stronger candidate is **Psychological Plausibility (Detectability/Blame)**. Many philosophical theories ignore that if you can't tell the difference, you can't assign differential blame. If a theory says "Misleading is objectively better" but psychology shows "Victims feel equally betrayed," the theory lacks grip.
      *   *Decision:* The **Intent-Outcome Decoupling** requirement. Theories often fail because they tie moral weight too tightly to either the *act type* (Lying is bad) or the *outcome* (Harm is bad). The theory must explain why the *method* matters independently of harm, but not *absolutely* independently of harm.
      *   *Refinement:* Let's go with **The "Clean Hands" Intuition vs. The "Same Harm" Intuition**. The theory must explain why we care about the speaker's technical honesty (Clean Hands) even when the harm is identical, without making it a fetish.
      *   *Actually, looking at the prompt:* "Which single requirement... knocks out the most of the theories people actually hold?"
      *   Most people hold "Lying is intrinsically worse." The **Moral Equivalence Case** (High stakes, same intent) knocks this out.
      *   Most people hold "It's all about harm." The **Literal Truth Exploit** (where harm is same but blame differs) knocks this out.
      *   *Selection:* **Requirement 5 (Moral Equivalence in High Stakes)**. It kills rigid deontology. **Requirement 1 (Literal Truth)** kills rigid consequentialism.
      *   *Best Single:* **The "Blame Asymmetry" Constraint.** (Psychological Plausibility). People *do* blame liars more than misleaders in low stakes, but equal in high stakes. A theory must explain this *shift*. Most theories are static.

  5.  **Identifying the Incompatible Pair:**
      *   What two requirements are hard to satisfy together?
      *   1. **Objective Act-Based Distinction:** The theory must ground the difference in the *structure of the speech act* (Assertion vs. Implicature).
      *   2. **Psychological/Epistemic Indistinguishability:** The theory must acknowledge that hearers often cannot distinguish the two in real-time, and suffer the same epistemic harm.
      *   *Tension:* If the moral difference relies on the *structure* (Assertion), but the *harm/experience* is identical, why does the structure matter morally? If structure matters, it implies a deontological constraint. If harm matters, it implies consequentialism. Satisfying both (Structure matters *and* Harm is primary) is the classic conflict.
      *   *Better Tension:* **The "Nazi at the Door" (Permissibility)** vs. **The "Literal Truth Exploit" (Wrongness).**
          *   If lying is intrinsically worse, Nazi case is hard (must lie or must mislead?).
          *   If misleading is significantly better, why does the Literal Truth Exploit feel slimy?
          *   *Actually, the prompt asks for requirements that can't be jointly satisfied.*
          *   Let's look at **Speaker Autonomy/Integrity** vs. **Hearer Epistemic Agency**.
          *   If you prioritize Speaker Integrity (I didn't *say* it), you undermine Hearer Agency (I was tricked).
          *   If you prioritize Hearer Agency (Don't manipulate my beliefs), you undermine Speaker Integrity (I'm forced to be blunt).
          *   *Selection:* **The "Clean Hands" Constraint** (Speaker's moral record depends on their explicit assertions) vs. **The "Epistemic Harm" Constraint** (Moral weight depends on the damage to the hearer's belief system). You can't fully satisfy both without trade-offs.

  6.  **Refining the Friend's Hypothesis:**
      *   Input (Lie) vs. Process (Mislead).
      *   Is it a redescription? Yes, mostly. Lying = False Assertion (Input). Misleading = True Assertion + False Implicature (Process/Inference).
      *   Does it earn its keep? It adds the dimension of *repairability*. A lie can be retracted ("I lied"). A misleading frame is harder to undo ("But you *said*...").
      *   Verdict: It's a redescription, but a *useful* one that highlights the *epistemic cost* rather than just the *moral status*. It shouldn't be a core requirement, but a supporting consideration.

  7.  **Final Review against Constraints:**
      *   Requirements list with cases? Yes.
      *   Distinctions not to collapse? Yes.
