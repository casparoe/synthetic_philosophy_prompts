answer: |-
  Consider a Last Will and Testament. In this ordinary practice, a person writes a document directing how their property should be distributed after death. They name an Executor to carry out these instructions. To allow for flexibility, the Will includes a clause permitting the Executor to adjust specific bequests if circumstances change—for example, selling a house to pay taxes before dividing the cash among heirs. This creates a loop: the document empowers the person, and the person acts upon the document.

  For this practice to remain coherent, there must be an inviolate level outside the Will itself. That level is the Probate Court, embodied by a Judge. The Judge does not write the Will, nor does the Judge serve as the Executor. Instead, the Judge stands outside the loop to verify that the Will is genuine and that the Executor is acting within the bounds of the law. The Judge is the undrawn hand. As long as the Judge remains outside, the Executor's power is legitimate authority.

  Now imagine the Executor tries to absorb that level. Suppose the Executor declares that they no longer need the Court's approval to validate their changes, claiming that the authority to judge the Will's validity resides in the Office of the Executor itself. In this moment, the practice breaks. It is not merely that the description becomes confusing; the actual function of inheritance collapses. Without the external Judge, the Executor's adjustments are no longer distributions of an estate; they become acts of ownership. The beneficiaries lose the right to object, because the person controlling the assets is also the person certifying the rules. The relationship shifts from fiduciary duty to arbitrary power. The Will ceases to be a constraint on the Executor and becomes a tool of the Executor. The practice of "executing a will" disappears, replaced by simple possession.

  You asked whether the difference between a loop that holds and one that destroys its structure lies in the pattern itself or only in the standpoint from which we look at it. This example supports the view that the difference lies in the standpoint. On paper, the pattern looks identical: a rule granting power to modify itself. In one case, the modification is validated by an outside office (the Judge); in the other, it is validated by the office holding the power (the Executor). The structure holds only when there is a standpoint outside the loop that can confirm the loop's validity without being consumed by it. If you try to draw the undrawn hand, you do not complete the picture; you erase the distinction between the drawing and the drawer, and the image loses its meaning.
