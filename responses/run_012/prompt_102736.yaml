answer: |-
  ## Activity Design: "The Invisible Handoff"

  ### 1. Theme and Materials
  **Theme:** *The Invisible Handoff.*
  **Base Script:** A two-person interaction consisting of three beats:
  1.  **Offer:** Person A extends hands as if holding an object.
  2.  **Transfer:** Person B places hands to receive it.
  3.  **Acknowledgment:** Both nod and relax.

  **Materials:** None required. Students use their bodies and voices. You need the whiteboard to track the "Dials" and the Timer.

  **Why this theme?**
  *   **Zero Training:** Everyone knows how to hand something to someone.
  *   **Clear Invariant:** The transfer of "possession" or "agency" from A to B.
  *   **Clear Dials:** Weight, size, fragility, temperature, value, secrecy, speed, distance.
  *   **Cognitive Depth:** It moves easily from physical (heavy box) to abstract (a secret, a burden, a virus), facilitating the shift from *twiddling* to *re-carving*.

  ---

  ### 2. Rules, Roles, and Scoring
  **Teams:** 8 Pairs (16 students). The rest of the class (if any, otherwise the pairs rotate) acts as the **Audience/Judges**. *Note: With exactly 16 students, all are in pairs. Half the pairs perform, half judge, then swap.*

  **The "Variation" Requirement:**
  A variation must change at least one parameter of the Base Script but must remain recognizable as *The Invisible Handoff*.

  **Judging Mechanism (The "Blind ID" Test):**
  To prevent "sameness" from becoming a matter of taste:
  1.  The performing pair executes their variation silently (or with minimal sound).
  2.  The Audience writes on a slip of paper: *"What is being transferred?"* and *"Is this still a Handoff? (Yes/No)"*.
  3.  **Scoring:**
      *   **Invariant Point:** Awarded if >75% of the Audience writes "Yes."
      *   **Novelty Point:** Awarded if the most common answer to *"What is being transferred?"* is **different** from the previous round's most common answer.
      *   **Total Score:** Max 2 points per round.

  **The Load-Bearing Rule:**
  If the Audience is confused about *what* is happening (e.g., "Are they fighting?"), the Invariant Point is lost. The goal is to be *barely* recognizable.

  ---

  ### 3. Sequence of Rounds
  *Do not announce the pedagogical arc. Announce only the constraints for the current round.*

  **Round 1: The Single Dial (10 mins)**
  *   **Instruction:** "Perform the Handoff. You may change **one** physical property of the object (e.g., weight, size). Everything else must remain standard."
  *   **Goal:** Establish the baseline space.

  **Round 2: The Cluster (15 mins)**
  *   **Instruction:** "Perform the Handoff. You must change **at least two** properties simultaneously. One must be physical, one must be emotional/contextual (e.g., heavy + dangerous)."
  *   **Goal:** Show that dials are coupled (a "bomb" implies "careful" + "heavy").

  **Round 3: Add/Remove a Dial (20 mins)**
  *   **Instruction:** "Perform the Handoff. You must **add a new step** to the script OR **remove one of the three base beats**. The transfer must still feel complete."
  *   **Goal:** Stress the structural skeleton. (e.g., Removing the "Ackowledgment" beat makes it a "Theft" or a "Dump".)

  **Round 4: The Re-Carving (20 mins)**
  *   **Instruction:** "Perform a variation where **there is no object**. Not an invisible one. *None.* Yet the Handoff must still occur."
  *   **Goal:** Force the shift from "Space of Objects" to "Space of Relations." (e.g., Transferring a turn in conversation, transferring responsibility, transferring a gaze).

  ---

  ### 4. Timeline and Script (90 Minutes)

  | Time | Phase | Instructor Script (Minimal) |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | "We are exploring how ideas vary. Base theme: The Invisible Handoff. [Demonstrate Base Script once]. Pairs, you have 3 minutes to rehearse Round 1: Change one physical property." |
  | **10-25** | **Rounds 1 & 2** | "Perform Round 1. [Audience judges]. Now Round 2: Change two properties, one physical, one emotional. 5 minutes to rehearse." |
  | **25-45** | **Round 3** | "Round 3: Add a step or remove one of the three beats. The transfer must still feel complete. 10 minutes to rehearse." |
  | **45-65** | **Round 4** | "Round 4: There is no object. Not invisible. *None.* Yet the Handoff must still occur. 15 minutes to rehearse." |
  | **65-90** | **Debrief** | (See below). |

  *Flag for Improvisation:* In Round 4, if all pairs stall, give one hint: "Can you handoff a silence? A responsibility? A look?" Do not give more than one hint.

  ---

  ### 5. Debrief: Mapping the Experience
  *Draw a 2D grid on the whiteboard. Label axes "Novelty" and "Recognizability."*

  1.  **The Dials (Rounds 1 & 2):** "In Rounds 1 and 2, you were in a fixed conceptual space. The axes were Weight, Size, Danger. You were **twiddling knobs**. The 'Theme' was the container."
  2.  **The Skeleton (Round 3):** "When you removed a beat, you touched the **skeleton**. Some of you broke the theme (it became a Theft). Some kept it (a 'Rush' Handoff). This is editing the code."
  3.  **The Re-Carving (Round 4):** "Round 4 was different. You couldn't twiddle knobs because the 'Object' knob was removed. To succeed, you had to change **what the space was a space of**. You moved from 'Transferring Things' to 'Transferring States'."
  4.  **The Hofstadter Point:** "Creativity isn't just finding a new setting on the dial. It's realizing the dial board itself is a variation of a deeper principle. The hardest part wasn't making it new; it was keeping it the *same* while changing everything. That tension is where the new space is born."

  ---

  ### 6. Predictable Failure Modes & Fixes

  **Failure 1: The "Exciting but Different" Variation.**
  *   *Scenario:* A pair acts out a fight. It's compelling, but the Audience votes "No" on "Is this a Handoff?"
  *   *Fix:* Validate the creativity, but enforce the rule. "This is a brilliant *new* theme. But for this exercise, we lose the Invariant Point. Why did it slip? Which beat broke?" (Usually the "Offer" became an "Attack").

  **Failure 2: Judgment Drifts into Taste.**
  *   *Scenario:* Audience argues, "I *felt* it was a handoff," vs "I didn't."
  *   *Fix:* Rely on the **Blind ID Test**. "Don't tell me how you felt. Tell me what you wrote down. If you can't name the action, the invariant is gone."

  **Failure 3: Round 4 Stalls (No New Dimension).**
  *   *Scenario:* Pairs keep pretending to hold objects.
  *   *Fix:* Intervene at the 5-minute mark. "If there is no object, what is moving from A to B? Is it power? Is it blame? Is it the floor?"

  ---

  ### 7. Limitations: What This Activity Cannot Do
  *Be honest about these in the debrief.*

  1.  **Time Compression:** Real "re-carving" (discovering a new conceptual skeleton) often takes years (e.g., Einstein re-carving "time"). This activity compresses it into 15 minutes, making it feel like a puzzle solution rather than a slow dawning.
      *   *Supply in Debrief:* "In the wild, you don't get a timer telling you to re-carve. You get stuck for months. The frustration you felt in Round 4 is usually a months-long plateau."
  2.  **The "Eureka" Distortion:** The format implies the new space is *waiting* to be found (Round 4 has a solution). In reality, new spaces are constructed, not found.
      *   *Supply in Debrief:* "I asked you to find a way to handoff nothing. In reality, no one would ask that. You have to generate the question yourself. That self-generated constraint is the true creative act."
  3.  **Social Safety:** Students are performing for peers. This inhibits the weirdest, riskiest variations (the ones most likely to re-carve the space).
      *   *Supply in Debrief:* "The safest variations got the most points. True creativity often risks looking insane. This classroom is too safe for the *real* edge of the space."

  ### 8. Instructor Notes for Improvisation
  *   **If Round 3 is too easy:** Ask them to remove the *middle* beat specifically. This breaks the causal chain and forces them to repair the logic.
  *   **If Round 4 fails completely:** Perform one yourself. Handoff a "silence" (look at them, wait, they look back, you nod). Then ask: "What did I give you?"
  *   **If the class is too analytical:** Stop them from talking about "dials" during the activity. Keep the language on "What are you doing?" until the debrief. The concepts must be *felt* first, named second.
