  Look, you're right that McCarthy's axioms and the picture-frame problem are structurally identical, but only if you assume intelligence is painting pictures. That's the whole ballgame. You say any system deciding relevance is drawing a frame, and what makes it right can't be inside it. I agree. But the skilled coper isn't deciding relevance by checking a list; relevance is what *shows up* when you're engaged. When the dog sleeps on the dock, the Roomba fails because it has no grip, only a map. A human doesn't represent the dog as "now relevant"; the obstruction forces a shift in activity. You're insisting that shift requires a representation of the shift. I'm saying the shift is embodied in the interruption itself. The frame problem isn't relocated; it's dissolved because there's no frame being drawn in the first place.

  You say relocating the frame to evolution or training just hides the problem in the designer. That would be true if the agent had to validate the frame from scratch. But we don't. We are thrown into a world where things already matter. The "background" isn't a set of facts we failed to write down; it's the network of concerns we inhabit. So when you ask if the coper notices the background shift, you're asking if it represents the background. It doesn't. It rides the background like a surfer rides a wave. If the wave changes shape, the surfer adjusts balance, they don't calculate fluid dynamics. The Roomba is a sleepwalker because it's a representational system pretending to cope. Humans aren't sleepwalkers; we're the ones who wake up when the floor feels wrong.

  Engineers universally agree that relevance is managed via inductive biases and training data rather than explicit axioms. The assertion that this eliminates the philosophical problem rather than burying it is the specific phenomenological claim under dispute.
