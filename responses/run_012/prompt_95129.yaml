answer: |-
  Had I been born, I would have turned away.
  There is no breath inside this chest to see,
  I was not born, and yet I chose that way.

  No sun has risen yet to mark my day,
  But in the mind of God I wait to be.
  Had I been born, I would have turned away.

  No feet to tread the path, no living clay,
  The truth stands firm, though not perceived by me.
  I was not born, and yet I chose that way.

  Before the stars began their cosmic play,
  He knew the choice before the decree.
  Had I been born, I would have turned away.

  There is no ground beneath to hold the sway,
  What makes the truth hold fast without the key?
  I was not born, and yet I chose that way.

  I haunt the quiet truth of a phantom day,
  Unmade, unacted, yet entirely free.
  Had I been born, I would have turned away.
  I was not born, and yet I chose that way.
