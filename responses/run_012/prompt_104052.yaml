answer: |-
  **Exam Question**

  **Metaphysics of Modality: Final Examination**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should be a sustained, argumentative essay.

  **Stipulation:**
  Consider **Rigid Counterpart Theory (RCT)**. Like standard counterpart theory, RCT holds that nothing exists at more than one world: the statement "$x$ is $F$ at $w$" is analysed as "$x$'s counterpart at $w$ is $F$". However, unlike the Lewisian version, RCT requires the counterpart relation to be **unique** (one-to-one), **total** (every individual has a counterpart in every accessible world), and **fixed independently of context**. Consequently, essential properties come out absolute rather than relative to a conversational context.

  **Essay Question:**
  Is RCT a stable metaphysical position, or does it collapse—either into transworld identity or into the very relativism it was meant to avoid? In your answer, you must address:
  (i) Whether the familiar "could have been" objection to counterpart theory is any less pressing for RCT than for standard counterpart theory;
  (ii) Whether the constraints of uniqueness and context-independence actually succeed in delivering absolute *de re* necessities; and
  (iii) What, if anything, still separates RCT from the view that individuals themselves exist at many worlds.

  ***

  **Model Answer**

  Rigid Counterpart Theory attempts to secure the intuitive benefits of transworld identity—specifically, absolute essential properties—without accepting the ontological commitment of individuals existing at multiple worlds. However, RCT is not a stable position. By rigidifying the counterpart relation to ensure absolute modality, RCT eliminates the theoretical motivation for having counterparts in the first place, causing the view to collapse into transworld identity in all but name.

  Regarding the "could have been" objection, standard counterpart theory faces the charge that it changes the subject. When we say "I could have been a sailor," we mean *I* could have been one, not that someone similar to me is one. Standard theory handles this by making truth context-sensitive; in some contexts, the similarity relation is loose enough to validate the claim. RCT attempts to solve this by fixing the relation. While this makes the truth-value of modal claims stable, it does not resolve the semantic disconnect. If the counterpart is distinct from me, strictly speaking, it remains false that *I* could have been a sailor. However, because RCT mandates a unique counterpart in every world, the gap between *me* and *the counterpart* becomes functionally invisible. The theory forces us to treat the counterpart's properties as the definitive facts about my modal profile. This concedes the intuition that there is a fact of the matter about *my* possibilities, an intuition that typically demands identity. Thus, while RCT avoids relativism, it does so only by mimicking the truth-conditions of transworld identity so closely that the objection transforms from a semantic complaint into an ontological one: why posit a distinct entity if it must track me perfectly?

  This leads to the issue of uniqueness and absolute necessity. Lewis allows the counterpart relation to vary to accommodate different essentialist intuitions (e.g., regarding constitution or origin). RCT forbids this, demanding a single, context-independent relation. For this to yield absolute necessities, the relation cannot be based on qualitative similarity, which is always a matter of degree and weighting. Instead, the relation must be grounded in the individual's essence or haecceity. If individual $x$ has exactly one counterpart $y$ in world $w$, determined not by how we describe $x$ but by what $x$ is, then $y$ is picked out by $x$'s identity conditions. A relation that tracks an individual's identity conditions rigidly across all possible worlds is extensionally equivalent to identity. If the relation is fixed by the nature of $x$, then $y$ inherits $x$'s thisness. Consequently, RCT delivers absolute necessity only by implicitly importing the machinery of transworld individuation it explicitly rejects.

  Finally, we must ask what separates RCT from transworld identity. The proponent of RCT insists on the literal distinctness of worlds and the isolation of individuals. But if the counterpart relation is unique, total, and context-independent, the distinction between "$y$ is the counterpart of $x$" and "$y$ is $x$" becomes metaphysically idle. Both views posit a unique individual in $w$ that bears all and only the modal properties of $x$ in the actual world. The transworld identity theorist says this individual is $x$; the RCT theorist says it is $x$'s rigid counterpart. Without the flexibility of similarity to do theoretical work (such as solving puzzles of accidental intrinsics or vague identity), the label "counterpart" adds no explanatory value. It creates a distinction without a difference. RCT incurs the epistemic cost of explaining how we identify unique counterparts across worlds—a cost identical to explaining transworld identity—while gaining no ontological parsimony, since the rigid counterpart plays the exact same role as the transworld individual.

  In conclusion, RCT is unstable. It seeks to avoid the relativism of standard counterpart theory by rigidifying the counterpart relation, but in doing so, it makes the counterpart relation indistinguishable from identity. It collapses into transworld identity because a unique, context-independent mapping of individuals across worlds is simply identity under a different description.

  ***

  **Marking Scheme (20 Marks)**

  **A. Thesis and Structure (4 Marks)**
  *   **4:** Clear, definite thesis (e.g., "RCT collapses into TWI") maintained throughout; logical flow between sections.
  *   **2-3:** Thesis present but wavering; structure is clear but transitions between (i), (ii), and (iii) are abrupt.
  *   **0-1:** No clear thesis; essay is a survey of views rather than an evaluation of RCT.
      *   *Error Note:* Surveying standard Lewisian views without applying them to the RCT stipulation costs all thesis marks.

  **B. The "Could Have Been" Objection (5 Marks)**
  *   **5:** Explains that RCT stabilizes truth-values but fails to bridge the ontological gap; notes that perfect tracking mimics identity.
  *   **3-4:** Explains the objection but fails to explain why RCT's fix makes the gap functionally invisible.
  *   **0-2:** Merely states the objection applies or does not apply without analyzing the effect of rigidity.
      *   *Error Note:* Claiming RCT solves the objection completely by fixing context ignores the semantic disconnect.

  **C. Uniqueness and Absolute Necessity (5 Marks)**
  *   **5:** Argues that unique/context-independent relations cannot be similarity-based and must track identity conditions/haecceity.
  *   **3-4:** Notes that uniqueness helps absoluteness but fails to explain why this requires abandoning similarity.
  *   **0-2:** Asserts uniqueness guarantees absoluteness without explaining the metaphysical grounding of the relation.
      *   *Error Note:* Assuming a unique similarity relation is possible without vagueness costs significant marks.

  **D. Collapse into Transworld Identity (6 Marks)**
  *   **6:** Clearly argues that the distinction is "metaphysically idle" or "extensionally equivalent"; identifies that RCT incurs TWI's epistemic costs.
  *   **3-5:** Argues for collapse but fails to specify what theoretical work is lost (e.g., parsimony or explanatory power).
  *   **0-2:** Fails to address the collapse charge or claims RCT is distinct simply because worlds are isolated.
      *   *Error Note:* Asserting worlds are isolated is not a defense if the individuals map one-to-one rigidly.

  **General Penalties**
  *   **Citations:** -5 marks if any references, bibliographies, or names (e.g., "Lewis", "Kripke") are cited. (Model answer must stand on arguments alone).
  *   **Word Count:** -2 marks if significantly under (
