      *   **Specific Constraint:** The question must prevent students from just reciting standard positions/objections. It involves a stipulated position: "Rigid Counterpart Theory" (RCT).
      *   **RCT Features:** No transworld identity (standard CT), counterpart relation is unique (one-one), fixed independently of context (non-contextual), essential properties are absolute.
      *   **Question Prompt:** Is RCT stable, or does it collapse into TWI or relativism? Address: (i) "could have been" objection, (ii) uniqueness/context-independence & absolute necessity, (iii) distinction from TWI.
      *   **Model Answer Requirements:** ~700 words, definite line (argumentative, not survey), no citations/references.
      *   **Marking Scheme:** 20 marks total, specific moves for top marks, specific errors with one-line notes.

  2.  **Deconstruct the Stipulated Position (RCT):**
      *   *Standard Lewisian CT:* Counterpart relation is similarity-based, context-dependent, many-many (I can have multiple counterparts in a world, or none). This leads to relativized essence (I am essentially F relative to relation R1, but not R2).
      *   *Transworld Identity (TWI):* I exist in multiple worlds. Essence is absolute.
      *   *RCT:* Tries to get the best of both worlds. No transworld identity (ontological parsimony/isolation of worlds), but fixes the counterpart relation to be unique and context-independent to mimic the absolute essence of TWI.
      *   *The Problem:* Why have counterparts *at all* if the relation is rigid and unique? If $x$ has exactly one counterpart $y$ in $w$, and this is fixed by the nature of $x$ and $w$ regardless of how we describe $x$, what work is the "counterpart" label doing that "identity" doesn't do better? This is the "collapse" worry.

  3.  **Drafting the Exam Question:**
      *   Need to present the RCT stipulation clearly.
      *   Need to pose the specific three sub-questions.
      *   Need to ensure the tone is appropriate for an upper-level seminar.
      *   *Draft:* [Insert RCT definition]. Evaluate stability. Address (i), (ii), (iii).

  4.  **Drafting the Model Answer:**
      *   *Thesis:* RCT is unstable and collapses into Transworld Identity (TWI).
      *   *Argument Structure:*
          1.  **Introduction:** Define the goal of RCT (absolute essence without transworld existence) and state the thesis (it fails).
          2.  **Point (i) - The "Could Have Been" Objection:** Standard CT says "I could have been F" means "A counterpart is F." RCT makes this stricter. But if the relation is fixed and unique, the intuitive gap between *me* and *the counterpart* vanishes. If *only one* thing counts as my counterpart in every world, it functions exactly like *me* being there. The objection loses force because RCT concedes the intuition that there is a *fact of the matter* about what I could have been, which usually requires identity.
          3.  **Point (ii) - Uniqueness & Absolute Necessity:** Lewis allows context to shift the relation to solve puzzles (e.g., Humphrey). RCT forbids this. To guarantee absolute necessity, the relation must track *essence*. But if the relation tracks essence rigidly across all worlds, it is effectively tracking *identity conditions*. If $y$ in $w$ is the *unique* counterpart of $x$ in $@$, determined by $x$'s nature, $y$ inherits $x$'s haecceity.
          4.  **Point (iii) - Collapse into TWI:** This is the clincher. The distinction between "strict identity" and "unique, context-independent counterpart" is metaphysically idle. Both posit a unique individual in $w$ that bears all the modal properties of $x$. If the relation is not similarity-based (which varies) but essence-based (which is fixed), it is an identity relation in all but name. RCT buys the problems of TWI (transworld individuation) without the ontological honesty.
          5.  **Conclusion:** RCT is a terminological variant of TWI.

      *   *Word Count Check:* Need to keep it tight to hit ~700 words. Avoid fluff. Focus on the metaphysical mechanism of the collapse.

  5.  **Drafting the Marking Scheme:**
      *   Total: 20 Marks.
      *   Breakdown:
          *   Thesis/Structure (4 marks)
          *   Addressing (i) "Could have been" (5 marks)
          *   Addressing (ii) Uniqueness/Absoluteness (5 marks)
          *   Addressing (iii) Collapse/TWI distinction (6 marks)
      *   Specific Moves: Must argue that unique/context-independent counterparting *is* identity. Must explain why this defeats the purpose of CT.
      *   Specific Errors: Reciting Lewis without applying to RCT, claiming RCT solves everything, failing to address the "collapse" charge.

  6.  **Refining and Polishing:**
      *   *Check Model Answer:* Does it cite anything? No. Is it argumentative? Yes. Is it around 700 words? (Will need to monitor during drafting).
      *   *Check Marking Scheme:* Are the penalties clear? Yes.
      *   *Check Question:* Is the RCT definition clear? Yes.

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just say "it's the same." I need to explain *why* fixing the relation removes the motivation for counterparts. The motivation for counterparts is to handle vagueness/context. If you remove vagueness/context, you remove the motivation.
      *(Word Count Management)*: I will write the answer and then trim/expand to ensure it's close to the limit.

      *(Marking Scheme Detail)*: Ensure the "one-line note" constraint is met for errors.

  7.  **Final Review against constraints:**
      *   90-minute exam context? (Question difficulty matches).
      *   No citations in model answer? (Checked).
      *   Definite line in model answer? (Yes, argues for collapse).
      *   Marking scheme specific moves/errors? (Yes).

      *Let's write.*

      *(Drafting Model Answer Mental Check)*:
      Intro: RCT tries to secure absolute modality without transworld identity.
      Body 1: The "could have been" objection usually attacks CT for making truth relative to context. RCT fixes context. But this makes the counterpart stand in for the self too perfectly.
      Body 2: Uniqueness implies a primitive thisness. If $y$ is the *only* counterpart of $x$, $y$ is picked out by $x$'s identity, not similarity.
      Body 3: Therefore, the distinction is verbal. If the relation is rigid, it is identity.
      Conclusion: Unstable.

