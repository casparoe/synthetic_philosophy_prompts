  The memo format *can* hold this philosophy, but only if you translate "philosophy" into "policy." If you frame it as "What is the purpose of a marker?" rather than "Was Ashcombe bad?", you give your colleagues a structural way to agree with you without feeling like they are erasing history.

  Below is a draft that operationalizes your insight. It avoids moralizing and focuses on the commission's mandate: accuracy and community relevance.

  ***

  **MEMORANDUM**

  **TO:** County Historical Marker Commission
  **FROM:** [Your Name], Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Wendell Ashcombe Marker (1987)

  **Purpose**
  This memo outlines my recommendation regarding the petition to remove the 1987 marker honoring Mayor Wendell Ashcombe. After reviewing the petition, historical records, and our commission's bylaws, I recommend we **retain the physical marker but install a companion contextual plaque** by next spring. We should not remove the original, nor should we leave it unexplained.

  **The "Standards of the Time" Argument**
  Two of my colleagues have argued that we cannot judge Ashcombe's eugenics advocacy by 2025 standards, noting he was a "man of his time." We must address this directly, as it is the foundation of the "Keep As-Is" position.

  Historical record shows that while eugenics was popular in the 1920s, it was never uncontested. During Ashcombe's tenure on the county eugenics board, local church groups, the Black press, and several prominent scientists publicly denounced sterilization programs as unethical and unscientific. Ashcombe was not passively following a universal norm; he was actively leading a controversial movement. To claim he was merely "of his time" ignores the voices of his contemporaries who argued against him. Therefore, the argument that we are imposing "modern standards" is historically inaccurate. We are acknowledging standards that existed *then* and were suppressed.

  **History vs. Commemoration**
  This brings us to the core function of our commission. We must distinguish between *history* (the record of what happened) and *commemoration* (the act of honoring).

  1.  **History:** Ashcombe did donate the land for the park and library. That is a fact. Removing the marker entirely risks erasing that fact, which would be its own historical inaccuracy.
  2.  **Commemoration:** A bronze plaque on a courthouse square is not a textbook entry; it is a signal of community values. It tells the public who we esteem. By leaving the 1987 text unchallenged, we implicitly endorse the idea that Ashcombe's land gift outweighs his advocacy for forced sterilization.

  The petition before us (600 signatures) indicates that our *current* community no longer holds that calculation to be true. Our mandate is not to freeze 1987's values in bronze, but to ensure our public spaces reflect an accurate and inclusive understanding of our county's story.

  **Recommendation: Contextualization**
  I propose we commission a second marker to be installed directly adjacent to the 1987 plaque.

  *   **The Work:** The new text will acknowledge Ashcombe's civic contributions but explicitly detail his role in the eugenics board and the human cost of those policies. It will frame the 1987 marker as a product of its own time (1987), just as we are products of ours.
  *   **The Timeline:** We can draft the text by December, open a 30-day public comment period in January, and aim for installation by April (Historic Preservation Month).
  *   **Responsibility:** I will form a subcommittee of three (including one commissioner who favors removal and one who favors retention) to draft the text. We should partner with the local university history department to ensure historical accuracy.

  **Conclusion**
  This approach avoids the binary trap of "canceling" vs. "celebrating." It treats the public square as a space for education, not just veneration. It acknowledges that a man can build a library and harm his neighbors simultaneously. By adding context rather than removing stone, we demonstrate confidence in our community's ability to grapple with complex history, rather than hiding it.

  I look forward to discussing this framework at Thursday's meeting.

  ***

  ### A Note on Strategy

  You mentioned the parking in the annex is terrible. Use that.

  When you present this, if the "Keep It" commissioners dig in on the "standards of the time" argument, don't fight them on the morality of eugenics. Fight them on the **accuracy**. Ask them: *"If we say he was just a man of his time, are we willing to add the names of the 1920s critics to the plaque to prove it? If not, aren't we actually presenting incomplete history?"*

  That forces them to admit that the current plaque is historically incomplete, which validates your solution without requiring them to admit they were morally wrong. It saves face while moving the policy forward.
