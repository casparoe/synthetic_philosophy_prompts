      *   **Scenario:** A prison system replaces fixed sentences with a points-based "rehabilitation ledger." Detainees earn points via therapy, disclosure, and insight. Release depends on a board judging them capable of "self-authorship." The service claims this is a Foucauldian advance (from discipline of docile bodies to "care of the self").
      *   **Task:** Identify a *conceptual issue* internal to Foucault's framework (power, knowledge, subject) exposed by this arrangement.
      *   **Constraints:**
