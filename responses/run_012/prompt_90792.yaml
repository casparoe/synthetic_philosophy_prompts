answer: |-
  **Question 1**
  You distinguish between values as a standing background condition, a proximate trigger, and a selector among live paths. To sustain your claim that the Protestant Ethic *caused* the Spirit of Capitalism, you must commit to one of these roles dominating the others. If you claim it is merely a background condition, you concede it required other sufficient causes; if you claim it is a trigger, you must explain its potency absent material change. Which specific causal role do you assign to the ethic, and can you coherently claim more than one without diluting the causal force to the point of vanishing?

  *Follow-up:* You will likely answer that it functions as a *selector* that later becomes a *background* condition. But if the ethic selects a path that then reproduces itself *without* the ethic, does the initial selection retain causal responsibility for the long-term institutional order, or does the causal chain snap once the religious conviction drops out?

  **Question 2**
  Let us grant the values play a causal role. We must then locate the mechanism. Do you owe us a micro-story showing how a belief held by individual agents aggregates into an institutional outcome, or do you maintain that culture can be a cause in its own right, irreducible to the psychological states of the adherents? If the former, how do you avoid the fallacy of composition; if the latter, what ontological status does "culture" hold that allows it to exert force?

  *Follow-up:* You will likely defend methodological individualism, arguing the cause lies in aggregated individual actions. But if the "Spirit of Capitalism" is an unintended consequence that adherents "neither intended nor foresaw," how can the sum of their intentional actions explain a systemic outcome that contradicts their individual intentions?

  **Question 3**
  This brings us to the gap between reasons and causes. That a norm provided an agent with a *reason* to act does not demonstrate that the norm *caused* the act. Are you trading on this ambiguity? Specifically, can a normative item enter a causal explanation in virtue of its *content* (the truth or value of the norm), or only in virtue of the *fact* that it was believed?

  *Follow-up:* You will likely insist that the *fact of the belief* is the cause, not the truth of the doctrine. But if the content is causally inert, why does the *specific* content of Calvinist asceticism matter, rather than any intense belief system? If content is irrelevant, your thesis collapses into a claim about psychological intensity, not religious ethics.

  **Question 4**
  Consider the standard rival explanations: reverse causation (economic conditions produced the ethic) or a common third factor (both arose from urbanization). You dismiss the correlation objection as crude. But what specific historical evidence allows you to rule out reverse causation definitively, given that the ethic and the economic behavior appear contemporaneously in the historical record?

  *Follow-up:* You will likely argue that the theological formulations predate the full economic shift. But if the theology was present for centuries without producing capitalism, what changed in the intervening time? If you point to material conditions, have you not admitted the values were insufficient without the economic trigger you claim they caused?

  **Question 5**
  A more structural objection concerns your method. You rely on an ideal-type of the Protestant Ethic—a reconstructed composite that no actual group ever perfectly embodied. If the cause is an ideal construction rather than a historical reality, does this not render the thesis unfalsifiable? How can an unrealized ideal-type exert causal power on real-world institutions?

  *Follow-up:* You will likely reply that ideal-types clarify the *meaning* of actual actions. But if actual Calvinists only approximated the ethic, and capitalism arose from their actual behavior, are you not attributing causal power to a phantom? If the ideal-type is merely a measuring rod, it cannot be the engine of history.

  **Question 6**
  Let us turn to a specific empirical test. Imagine a single religious community that splits into two branches differing on precisely the doctrine you treat as load-bearing—the assurance of election—while their economic circumstances, kinship networks, and political conditions remain as nearly identical as history permits. If their economic trajectories then diverge, would you regard this comparison as close to decisive?

  *Follow-up:* You will likely agree this would be strong evidence. But before we know the outcome, what do you *predict*? If you refuse to predict on the grounds that history is too complex, on what basis do you claim the doctrine is load-bearing rather than merely coincident?

  **Question 7**
  You speak of an "elective affinity" between the ethic and the economic form. Is your claim stronger than the claim that they merely *fitted* one another, and if so, what does that strength come to in observable terms? If affinity is not causation, what work is the concept doing beyond describing a correlation that looks like a cause?

  *Follow-up:* You will likely argue affinity implies a mutual reinforcement that stabilizes the system. But stabilization is not genesis. If the affinity only explains why capitalism *stuck* rather than why it *started*, have you not retreated from explaining the origin of the Spirit to explaining its persistence?

  **Question 8**
  Regarding that persistence: by what route do these values transmit across generations after the religious convictions have faded? Is that persistence itself a causal force maintaining the economic order, or is it merely inertial? If it is merely inertial, can you still claim the values are among the *causes* of the current institution, rather than just the historical conditions of its birth?

  *Follow-up:* You will likely argue the values become secularized habits. But if they are now habits detached from their original justification, is the "Spirit of Capitalism" still driven by values, or by the institutional inertia those values left behind? If the latter, the causal power lies in the institution, not the ethic.

  **Question 9**
  Given your commitment to this causal story, what specific evidence would make you abandon the thesis? If you cannot specify a condition under which the thesis would be false, does the claim function as a scientific explanation or as a hermeneutic framework that absorbs all data?

  *Follow-up:* You will likely say a case where the ethic existed without capitalism, or capitalism without the ethic. But you have already argued that the ethic transforms into a secular spirit, making the original ethic unnecessary. If the absence of the original ethic is predicted by your theory, how can its absence count as disconfirmation?

  **Question 10**
  Finally, does your causal claim bear at all on whether a culture can be praised or blamed for its economic institutions, or do you keep the causal and the normative registers strictly apart? If you keep them apart, what is the practical import of your theory; if you link them, do you not risk legitimizing the economic order as the inevitable outcome of superior values?

  *Follow-up:* You will likely insist on a strict Is/Ought distinction. But if the theory implies that certain values produce "successful" economic orders, does it not implicitly prescribe those values? If you deny this, why should policymakers or historians care about your causal claim other than as a tool for manipulation?
