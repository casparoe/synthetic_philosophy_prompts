      *   *Levels (Hierarchy):* This is also mathematically principled (Type Theory). It prevents self-reference by stratifying the language/system. A catalogue of catalogues must be at a higher type than the catalogues it lists.
      *   *Are they changing the subject?* In the context of the story's *founding rule* ("for every catalogue in the library"), yes, they change the subject because they admit the founding rule was impossible as stated. They modify the ontology of the library to save consistency.

