prompt: |-
  Ok so this is a slightly odd ask, but here goes. I'm a second-year PhD student working on conditionals — my thesis is on the suppositional account, the line that 'if A, B' isn't in the business of having truth conditions in the ordinary sense and that the credence you give it just is your conditional credence for B given A. My department runs this thing where two of us who've been rowing about something in the corridor all term have to produce a joint document for the reading group, and mine is with a friend in the logic group who's a hard truth-conditionalist: she reckons the triviality results Lewis derived are more or less the end of the road for anyone who wants to identify the probability of a conditional with the corresponding conditional probability, and that the only honest options left are the material conditional plus a Gricean story about assertability, or some Stalnaker-style possible-worlds conditional with a selection function. I think the proofs only bite if you insist on two things she never bothers to argue for: that the conditional is a proposition in the ordinary Boolean sense, and that 'probability' for it is the ordinary kind of probability rather than something defined on a richer algebra where conditional events are primitive instead of being derived from a Boolean algebra of propositions. So we dont actually agree about what the triviality results show, and I increasingly suspect we don't agree about what 'proposition' is doing either.

  Could you draft the joint statement we could both sign? I want it in the standard shape: a numbered list of claims we both accept — about the proofs themselves, about what follows if you accept Adams' thesis, and about what would have to be true of a conditional for it to have a probability at all; then a table of the residual disagreements, each row phrased so that whichever of us it attributes a view to would accept the wording; then the cruxes, and for each crux the argument, case or result we'd both agree bears on it, with each side's prediction written down in advance. Three things I especially want the drafting to force us to be honest about. First, exactly which premise of the triviality proof each of us thinks the other has to abandon — pinned to a specific premise, not 'the framework'. Second, the embedding problem: what either of us says about 'probably, if A then B', about negated conditionals, and about the idea that an if-clause just restricts the domain of a modal or an adverb of quantification; I've been reading around the restrictor line and I honestly can't tell whether it's an escape route from the triviality results or just a change of subject, so I'd like that uncertainty written into the document rather than settled by fiat. Third, whether any of this is verbal: she thinks I use 'proposition' idiosyncratically, I think she's quietly smuggling facts about warranted assertability into the truth conditions, and if either of us is right then part of the row is about words.

  Please don't hedge the whole thing into mush — if a claim in the agreed section costs one of us something, say which of us and what it costs. And finish with a short note in your own voice, not in the voice of either of us, on where this document is most likely to be wrong: which agreed claim is most likely to be one of us quietly conceding something we shouldn't, and what would change your mind about whether the residual disagreement is genuine rather than terminological — say if it turned out that the non-Boolean version of the semantics can't assign probabilities to the embedded cases at all. British English, and no reading list please, we've both read the stuff.
