answer: |-
  **Joint Statement on the Status of Triviality Results and the Semantics of Conditionals**

  **Prepared for:** Departmental Reading Group
  **Authors:** [Student Name] (Suppositional Account) & [Friend's Name] (Truth-Conditional Account)

  ### 1. Agreed Claims

  We accept the following claims as the common ground for our disagreement. Where a claim imposes a specific theoretical cost on one of us, this is noted in brackets.

  1.  **Validity of Lewis's Proof:** David Lewis's triviality proof is formally valid within the framework of a standard Boolean algebra of propositions equipped with a classical probability function. Neither of us disputes the mathematics of the derivation itself.
  2.  **The Cost of Adams' Thesis:** If one maintains that 'If A, B' expresses a proposition in the standard Boolean sense *and* that the probability of this proposition is governed by the Kolmogorov axioms, then Adams' Thesis ($P(\text{If A, B}) = P(B|A)$) entails that the probability function is trivial (i.e., agents can only hold non-trivial credences in at most two incompatible antecedents). **[Cost: Suppositionalist]** must deny the Boolean assumption; **[Cost: Truth-Conditionalist]** must deny Adams' Thesis as a semantic rule.
  3.  **Empirical Adequacy:** Pre-theoretic judgements about the assertability and credence of simple conditionals align strongly with Adams' Thesis. Any semantic theory must explain why this alignment occurs, even if it denies the thesis is strictly true. **[Cost: Truth-Conditionalist]** must provide an error theory or pragmatic explanation (e.g., Gricean) for why false or distinct truth conditions mimic conditional probability.
  4.  **The Embedding Constraint:** Conditionals appear in embedded contexts (negation, disjunction, the scope of modals like 'probably'). A complete semantics must account for the logical behaviour of these embeddings without generating contradictions or losing compositionality. **[Cost: Suppositionalist]** must explain how non-propositional (or non-Boolean) contents interact with operators that standardly take propositions as arguments.
  5.  **Non-Verbality Condition:** The disagreement is not merely about the label 'proposition' unless it can be shown that translating between our frameworks preserves all inferential and probabilistic relations without loss of explanatory power. We agree to treat the dispute as substantive until proven otherwise.

  ### 2. Residual Disagreements

  | Issue | Suppositionalist Position ([Student]) | Truth-Conditionalist Position ([Friend]) |
  | :--- | :--- | :--- |
  | **Ontological Status** | 'If A, B' denotes a conditional event or object in a non-Boolean algebra, or has no truth-apt content whatsoever. It is not a standard proposition. | 'If A, B' denotes a standard proposition with truth conditions (either Material or Stalnaker-style). To deny this is to make the conditional unembeddable. |
  | **Implication of Triviality** | The results show the Boolean framework is too narrow for natural language conditionals. We must expand the algebra (e.g., conditional events). | The results show that identifying the probability of the conditional with conditional probability is a mistake. The conditional has a truth condition; its *assertability* tracks conditional probability. |
  | **Embedding ('Probably if')** | 'Probably' operates as a restrictor or quantifier over cases where A is true, evaluating B. The conditional clause restricts the modal's domain rather than serving as its argument. | 'Probably' is an operator taking a proposition as its argument. Therefore, 'If A, B' must supply a proposition for 'Probably' to operate on. |
  | **Negation** | Negating a conditional is not negating a truth-value but perhaps expressing uncertainty about the supposition or rejecting the inference from A to B. | Negating a conditional is truth-functional (or world-selective). $\neg(A \to B)$ is true iff the conditional is false. |

  ### 3. The Cruxes

  We identify three specific points of contention where future work should focus. For each, we list the agreed bearing argument and our divergent predictions.

  **Crux 1: The Boolean Premise in Triviality Proofs**
  *   **The Specific Premise:** Lewis's proof relies on the assumption that for any antecedent $A$ and conditional $A \to B$, the proposition expressed by $A \to B$ is in the domain of the probability function defined over the Boolean algebra generated by $A$ and $B$.
  *   **Agreed Bearing:** If a coherent non-Boolean algebra (e.g., of conditional events) can be constructed that supports a probability function satisfying Adams' Thesis without triviality, the Truth-Conditionalist's reliance on Lewis as a *reductio* of the Suppositional Account fails.
  *   **Predictions:**
      *   *Suppositionalist:* Predicts that conditional event algebras (e.g., McGee, Kaufmann, or operational approaches) can be formalised to handle simple embedding without collapse.
      *   *Truth-Conditionalist:* Predicts that non-Boolean algebras will fail to provide a coherent logic for *iterated* conditionals or will diverge from intuitive validity patterns (e.g., failing Import-Export where intuition demands it).

  **Crux 2: The Restrictor Analysis and Embedding**
  *   **The Issue:** The treatment of 'Probably, if A, B'. Is the if-clause restricting the modal (Kratzer/Restrictor) or is it part of the propositional argument of the modal?
  *   **Agreed Bearing:** If the Restrictor analysis is correct, it offers a syntactic mechanism for embedding without requiring the conditional to be a propositional argument of 'Probably'. However, it must also handle negated conditionals ('It is not the case that if A, B') and conditionals in the antecedents of other conditionals.
  *   **Predictions:**
      *   *Suppositionalist:* Predicts the Restrictor view is an escape route. It shows 'If A, B' never forms a constituent that needs a truth value; 'Probably' quantifies over A-worlds directly. Triviality is avoided because no probability is assigned to the conditional *proposition*.
      *   *Truth-Conditionalist:* Predicts the Restrictor view is a change of subject. It explains the syntax of modals but fails to account for cases where conditionals clearly act as propositional arguments (e.g., in belief reports: 'She believes that if A, B'). If the Suppositionalist adopts Restrictors, they concede conditionals aren't the kind of thing that can be believed *simpliciter*.

  **Crux 3: Substantive vs. Verbal (The 'Proposition' Charge)**
  *   **The Issue:** Whether the disagreement rests on the definition of 'proposition'.
  *   **Agreed Bearing:** If the Truth-Conditionalist's 'proposition' is defined solely as 'the object of belief/assertion', and the Suppositionalist's 'conditional event' plays that exact functional role, the dispute may be terminological. However, if the Truth-Conditionalist's proposition carries truth-conditions that entail specific logical consequences (e.g., validity of Antecedent Strengthening) which the Suppositionalist denies, the dispute is substantive.
  *   **Predictions:**
      *   *Suppositionalist:* Predicts the Truth-Conditionalist is smuggling assertability conditions into truth conditions. Once stripped, the 'truth conditions' do no work other than mimicking the suppositional rules.
      *   *Truth-Conditionalist:* Predicts the Suppositionalist is using 'proposition' idiosyncratically to avoid the consequences of triviality. If the Suppositionalist admits their 'conditional events' have no truth values, they cannot explain the validity of arguments involving conditionals in classical logic (e.g., Proof by Cases).

  ***

  ### A Note on the Draft (From the AI)

  You asked for honesty about where this document is likely wrong, so here it is. The Agreed Claims section, specifically Claim 4 (The Embedding Constraint), is the weakest link, and it leans heavily in favour of your friend (the Truth-Conditionalist).

  By agreeing that a semantics *must* account for embedding in a way that preserves compositionality with standard operators, you have potentially conceded the game before it starts. The non-Boolean/conditional event approach is notoriously difficult to scale to complex embeddings (like 'If A, then if B, C' or 'Either if A, B or if C, D') without either collapsing back into triviality or becoming so technically baroque that it loses psychological plausibility. If it turns out that the non-Boolean algebra cannot assign coherent probabilities to negated conditionals (e.g., what is the probability of 'It is not the case that if A, B'?) without effectively reintroducing truth conditions, then the Triviality results aren't just a boundary marker; they are a stop sign.

  What would change my mind about whether this disagreement is genuine rather than terminological is the performance of the non-Boolean semantics on **nested modals**. If your friend's truth-conditional account can handle 'It is possible that if A, probably B' using standard possible-worlds machinery, and your account requires a sui generis rule for that specific construction, then the charge that you are changing the subject (or using 'proposition' idiosyncratically) gains significant weight. Conversely, if the truth-conditionalist requires increasingly convoluted pragmatic stories to explain why we *never* actually assert the material conditional's truth conditions in natural discourse, the 'verbal' charge swings back their way. Watch the embedding data closely; that is where the algebra will either hold or break.
