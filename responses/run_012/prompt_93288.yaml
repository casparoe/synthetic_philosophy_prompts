answer: |-
  This is a sophisticated observation that cuts to the heart of institutional design. You are correct to be skeptical of the "Iron Law of Oligarchy." Michels' law describes how an organization *inevitably produces* a leadership elite that serves its own interests. Your phenomenon is distinct: it describes how reforms intended to *prevent* a leadership elite (via rotation or lot) inadvertently transfer power to a *different* elite (staff/facilitators) while creating a structural incentive for the formal leaders to remain ignorant.

  There is no single, canonical term in democratic theory that captures this specific synthesis of **bureaucratic dominance** and **incentivized ignorance** as a stable equilibrium. However, your intuition that the two halves belong together is correct. They are mutually reinforcing mechanisms of the same system.

  ### Established Concepts (and why they fall short)

  1.  **The Competence-Control Tradeoff:** (Bertelli & Gross) This is the closest established framework. It posits that political principals must choose between agent competence (giving experts autonomy) and political control (restricting experts). Your observation adds a crucial third variable: **political survival**. The principals aren't just trading control for competence; they are trading control for *deniability*.
  2.  **Bureaucratic Drift / Capture:** This describes the power shift (Part 1) but assumes the staff is acting against the principals' interests or that the principals are simply unable to monitor. It misses the *willingness* of the principals to remain ignorant (Part 2).
  3.  **Strategic Ignorance:** (Often used in ethics or economics) This describes the choice to remain uninformed to avoid moral or decision-making burdens. It captures Part 2 but lacks the institutional context of the power shift to permanent staff.
  4.  **The Problem of Many Hands:** (Dennis Thompson) This describes how diffusion of responsibility makes it hard to assign blame. Your case is more specific: the blame is not just diffused; it is structurally routed away from the decision-makers toward the advisors, by design.

  ### The Coinage: **The Equilibrium of Delegated Ignorance**

  Since no single term exists, I propose **The Equilibrium of Delegated Ignorance**. This term captures the stability of the arrangement (Equilibrium), the mechanism of power transfer (Delegated), and the functional role of the members' lack of knowledge (Ignorance).

  #### Definition and Edges

  **Definition:** A stable governance arrangement in which temporary decision-makers cede substantive authority to permanent staff to secure plausible deniability, thereby sustaining a fiction of democratic accountability.

  **Does it require a formal rotation rule?**
  No. While term limits and sortition are the most common catalysts, any arrangement creating a high turnover of principals relative to agents (e.g., short electoral cycles combined with a professionalized civil service) can generate this equilibrium. The key is the *experience gap*, not the method of selection.

  **Does it require that the staff's preferences diverge from the members'?**
  No. This is a critical edge. The pattern holds even if the staff is perfectly benevolent and competent. The pathology is not necessarily *corruption* or *subversion*; it is the *structural location of discretion*. Even if the staff does exactly what the members *would* want if they knew how to ask, the members are no longer the authors of the decision.

  **Is it still the pattern if nothing ever goes wrong?**
  Yes. In fact, success reinforces the equilibrium. If the budget passes and the citizens' assembly recommendation is implemented smoothly, the members receive credit for "deciding," and the staff receives credit for "facilitating." The incentive to probe the black box is low because the output is acceptable. The pattern is defined by the *location of authority*, not the *quality of outcomes*.

  **A Near-Miss Case (Resembles but is not an instance):**
  Consider a standard parliamentary system where a Minister (temporary) heads a Department (permanent). If the Minister actively audits the department, demands alternative briefs, and occasionally overrides the civil servants based on personal judgment, this is **not** an instance of the Equilibrium of Delegated Ignorance. It is a standard Principal-Agent relationship with monitoring. The Equilibrium only exists when the Minister *prefers* not to know the details to maintain the defense of "relying on advice," and the Department *expects* to set the parameters.

  ### Confidence and Uncertainty

  I am **85% confident** that there is no single canonical term for this specific synthesis. It is usually discussed as separate pathologies: "staff dominance" in public administration and "facilitator bias" in deliberative democracy. Your contribution is linking the *power shift* to the *incentive for ignorance* as a single stable system.

  The one point I am **least sure of** is whether the deliberative democracy literature has a niche slang term for the sortition version specifically (e.g., "Facilitator Capture" or "Secretariat Dominance") that functions as a proper name within that sub-field. However, even those terms usually focus on the staff's power, not the members' *strategic benefit* from ignorance.

  \answer{The Equilibrium of Delegated Ignorance - A stable governance arrangement in which temporary decision-makers cede substantive authority to permanent staff to secure plausible deniability, thereby sustaining a fiction of democratic accountability.}
