  3. Replacement of any constituent particles terminates the contract for the material mass but maintains coverage for the artwork provided the form remains within original tolerances.
  4. Should the stored material be recast into multiple figures, the original material mass is considered extinguished and invoicing will commence for each newly formed artwork as distinct entities.
  5. The company defines the artwork as the specific arrangement of particles rather than the particles themselves, grounding objecthood in form rather than material mass to justify distinct existence conditions for each billed unit despite shared physical occupancy.
