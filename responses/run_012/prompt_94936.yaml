      *   *Weaknesses:* It risks over-generalizing. Not all escalation happens in competitive, rule-bound traps. The "sunk cost fallacy" literature specifically targets cases where there *are no* structural penalties for quitting, yet people persist.

  3.  **Brainstorming Defeaters (Counter-Arguments):**
      *   *The "No-Rival" Case:* The uncle fixing the car. There is no runner-up penalty. There is no strategic opponent. If he stops, he loses the money already spent, but he doesn't lose *more* by stopping. If he continues, he spends more. Structurally, stopping is dominant. If he continues, it *must* be psychological.
      *   *The "Responsibility" Effect:* Staw's research. If I inherit a project, I'm less likely to escalate than if I started it. Structural incentives are identical; only psychological ownership differs.
      *   *The "Exit Cost" Variation:* In the user's Variant 1 (runner-up pays nothing), escalation usually collapses. If the structural trap is removed, does the behavior stop? If yes, the user is right about the dollar auction but wrong about generalizing to all sunk cost behavior.
      *   *The "Just-So" Story:* If the user says "there must be a hidden incentive," can we prove there isn't? This is the falsifiability issue.

  4.  **Developing the Specific Scenarios:**
