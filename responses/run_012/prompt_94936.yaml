      *   **Task:** Evaluate this view. Rank defeaters (counter-arguments) from fatal to awkward. Distinguish between what a defender would concede vs. wave away. Identify unique predictions vs. the standard sunk cost story.
      *   **Specific Scenarios to Cover:**
