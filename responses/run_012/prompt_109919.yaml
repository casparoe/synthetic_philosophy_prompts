          *   Camp C (User's Conditionals): Treats the group as a *deliberative body* moving toward action.
      *   **Evaluate User's Hypothesis 1:** Correct that "group judgment" is the pivot. But it's not just semantics; it's about *agency*.
      *   **Evaluate User's Hypothesis 2:** Insightful. It identifies the "detachment" problem. The impossibility arises at the moment of *closure*. This shifts the focus from *belief* to *commitment*.
      *   **Recommend Progress:**
