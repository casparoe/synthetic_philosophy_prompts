answer: |-
  The controversy between telic egalitarianism and the levelling-down objection centers on the intrinsic value of equality. Telic egalitarians assert that equality is good in itself; a distribution is better, in at least one respect, the more equal it is, regardless of absolute welfare levels. The levelling-down objection argues that this commitment entails an absurdity: if equality is intrinsically valuable, then a scenario where the better-off are reduced to the level of the worse-off, with no compensating gain for anyone, constitutes an improvement. Prioritarianism is frequently proposed as a solution, granting extra weight to the welfare of the worse-off without valuing equality as an independent end. To determine whether prioritarianism genuinely escapes the objection or merely sidesteps it at an unacceptable cost, we must analyze the specific mathematical implications of the view using the prescribed value function and distributions.

  Let the prioritarian value function be $V = \sum \sqrt{w}$, where $w$ represents individual welfare. We consider four distributions over two persons:
  (a) $(25, 25)$
  (b) $(100, 1)$
  (c) $(100, 25)$
  (d) $(9, 9)$

  First, we compute the values for Utilitarianism (sum of welfare), Telic Egalitarianism (intrinsic value of equality), and Prioritarianism (sum of square roots).

  **Utilitarian Values ($U$):**
  $U(a) = 50$
  $U(b) = 101$
  $U(c) = 125$
  $U(d) = 18$
  Ranking: $c \succ b \succ a \succ d$.

  **Prioritarian Values ($P$):**
  $P(a) = \sqrt{25} + \sqrt{25} = 5 + 5 = 10$
  $P(b) = \sqrt{100} + \sqrt{1} = 10 + 1 = 11$
  $P(c) = \sqrt{100} + \sqrt{25} = 10 + 5 = 15$
  $P(d) = \sqrt{9} + \sqrt{9} = 3 + 3 = 6$
  Ranking: $c \succ b \succ a \succ d$.

  **Telic Egalitarian Assessment:**
  Telic egalitarianism values equality intrinsically. Distributions (a) and (d) exhibit perfect equality. Distributions (b) and (c) exhibit significant inequality.
  Regarding (c) versus (a): (c) has higher total welfare (125 vs 50), but (a) is perfectly equal while (c) is not. A consistent telic egalitarian must hold that (a) is better than (c) *in respect of equality*. If equality is the sole or dominant value, (a) is better all-things-considered.
  Regarding (b) versus (a): Similarly, (a) is more equal than (b).
  Regarding (d) versus (a): Both are perfectly equal, but (a) has higher total welfare. (a) is better than (d).

  **Does Prioritarianism Escape Levelling Down?**

  The levelling-down objection targets transitions where equality is increased by lowering the better-off without raising the worse-off. The paradigmatic case here is the move from (c) to (a). In (c), welfare is $(100, 25)$. In (a), it is $(25, 25)$. The rich are levelled down; the poor remain static. No one gains; one person loses significantly.

  Telic egalitarianism implies that (a) is better than (c) in at least one respect (equality), and potentially all-things-considered. This validates the levelling-down intuition that something is gained by the increase in equality, even though no person benefits. Prioritarianism, however, assigns (c) a value of 15 and (a) a value of 10. It unequivocally judges (c) to be better than (a). Because the prioritarian value function is strictly increasing in individual welfare ($\frac{d}{dw}\sqrt{w} > 0$), it is mathematically impossible for the value of a distribution to rise if one person's welfare falls and no one's rises. Thus, prioritarianism never licenses levelling down. It escapes the objection formally and substantively.

  However, the escape requires examining the comparison of (b) to (a). In (b), welfare is $(100, 1)$; in (a), it is $(25, 25)$. Here, moving to equality involves both levelling down the rich and levelling up the poor. Telic egalitarianism favors (a) due to equality. Prioritarianism favors (b) ($11 > 10$). This result is critical. In distribution (b), the worst-off person has a welfare of 1. In distribution (a), the worst-off person has a welfare of 25. By preferring (b), prioritarianism prefers an outcome where the worst-off person is significantly worse off than they would be in the more equal alternative.

  This reveals that prioritarianism is not egalitarian in the sense of prioritizing the absolute floor of welfare or the relational status of individuals. It is a weighted aggregative view. It allows the worse-off to suffer absolute losses if the weighted gains to the better-off are sufficiently large. While this confirms prioritarianism escapes the levelling-down objection (since in the pure levelling-down case (c) to (a), it rejects the change), it shows that the view does not share the egalitarian's deep commitment to protecting the vulnerable from being left behind for the sake of aggregate value. It escapes the absurdity of levelling down, but it does so by aligning more closely with utilitarianism than with egalitarianism on hard trade-offs.

  **Is the Escape Too Cheap?**

  The second question concerns whether prioritarianism avoids the objection only by accepting a premise that begs the question against the egalitarian. The levelling-down objection presupposes the Person-Affecting Restriction: an outcome cannot be better unless it is better for someone. Telic egalitarians deny this, arguing that impersonal patterns (equality) have value independent of individual interests. If the objection merely assumes the Person-Affecting Restriction, it begs the question.

  However, the force of the levelling-down objection is not merely logical but intuitive. The claim that a world where everyone is miserable is better *in any respect* than a world where some are miserable and some are happy, solely because the misery is equal, strikes a chord deeper than theoretical commitment. It suggests that the *point* of distributive justice is to benefit individuals, not to arrange patterns. If a theory implies that harming some without benefiting others is an improvement, it severs the link between morality and human well-being. Prioritarianism preserves this link. It does not beg the question; rather, it upholds a more fundamental axiom: that value must be grounded in the interests of sentient beings.

  Yet, one might argue the price of this escape is too high. By denying intrinsic value to equality, prioritarianism may lose the ability to condemn inequalities that do not reduce welfare. Consider a relation of domination where a subordinate party has high welfare but lacks status or autonomy relative to a master. If the subordinate's welfare (understood as happiness or preference satisfaction) is unaffected, prioritarianism sees no loss in the inequality. Telic egalitarianism, valuing the relational pattern itself, could condemn this.

  Is this loss acceptable? It depends on whether we accept welfarism as the substantive principle of justice. If domination is bad, it is presumably because it harms the subordinate's interests in autonomy, dignity, or security. If these are components of welfare, prioritarianism captures the harm. If domination is bad *even if* it causes no welfare loss (a non-welfarist view), then prioritarianism is indeed blind. However, positing a "badness" that affects no one's well-being is metaphysically obscure. A moral theory should explain why a state of affairs is bad. If the subordinate is truly flourishing and unharmed, the objection to the inequality rests on a fetishization of pattern over person. Therefore, the inability to condemn welfare-neutral inequalities is not a defect but a virtue, ensuring that moral concern remains tethered to actual human interests.

  **Verdict**

  The levelling-down objection successfully refutes telic egalitarianism. The implication that a change benefiting no one and harming some can be an improvement is intolerable because it violates the fundamental principle that morality is concerned with the well-being of individuals. Prioritarianism genuinely escapes the objection because its value function is strictly person-affecting; it never values a loss. The price of this escape—abandoning the intrinsic value of equality and occasionally preferring outcomes where the worst-off are absolutely worse off (as seen in the preference for (b) over (a))—is worth paying.

  The strongest reply from the losing side (telic egalitarianism) is the Relational Objection: that justice is not merely about welfare distribution but about social status, and that prioritarianism cannot account for the badness of hierarchical relations that leave welfare intact. This reply fails because it relies on an unexplained intuition that patterns matter independently of people. If a relation of domination is unjust, it must be because it compromises the subordinate's agency or dignity. These are welfare interests. If prioritarianism accounts for welfare broadly, including autonomy and status as constituents of well-being, it can condemn domination without positing a mysterious intrinsic value in equality. If the subordinate's welfare is truly unaffected, the claim that the situation is unjust lacks a subject who is wronged. Therefore, we should prioritize the Person-Affecting Principle over Pattern-Based Principles. Justice is about how we treat people, not how we arrange numbers. Prioritarianism respects this; telic egalitarianism does not.
