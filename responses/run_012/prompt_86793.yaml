answer: |-
  # Session Plan: The Binding Past

  ## 1. Materials List
  *   **8 Life Cards (Phase 1):** Distinct personas (see Section 2).
  *   **8 Later-Self Cards (Phase 2):** Corresponding futures (see Section 2).
  *   **Instruction Sheets (16):** Blank forms with three sections: *The Absolute Rule*, *The Guiding Values*, *The Open Question*.
  *   **Pens (16).**
  *   **Tokens (32):** Poker chips, coins, or distinct cards. Two per student to start.
  *   **Whiteboard/Blackboard:** Divided into two sections for the Chambers to write their Rules.
  *   **Timer:** Visible to you.
  *   **The Final Case Handout:** One copy for you to read aloud at the end.

  ## 2. The Life Cards (Phase 1) & Later-Self Counterparts (Phase 2)
  *Instructions to Facilitator: Print and cut. Distribute Life Cards randomly in Phase 1. Collect Instruction Sheets. Shuffle and redistribute in Phase 2 along with the matching Later-Self Card.*

  **Pair 1**
  *   **Life Card A:** You are a concert pianist. Your hands are your identity. You believe a life without the ability to create music is a life not worth sustaining. You fear being kept alive in a state where you cannot recognize music or move your fingers.
  *   **Later-Self Card A:** You have developed a neurological condition. You can no longer play, but you listen to music for six hours a day and beam with joy. You are content. You fear death. You want all life-prolonging measures taken.
  *   **Conflict:** The Absolute Rule refuses life support if you cannot play. The Later Self wants to live to listen.

  **Pair 2**
  *   **Life Card B:** You are a privacy activist. You believe your internal thoughts are the only truly free space. You refuse any medical intervention that alters your personality or memory, even to reduce suffering.
  *   **Later-Self Card B:** You have a treatable chemical imbalance causing severe depression. Medication will stabilize you but will blunt your emotional peaks and make you feel "average." You want the medication to stop the pain.
  *   **Conflict:** The Absolute Rule refuses personality-altering meds. The Later Self wants relief from suffering even if "you" change.

  **Pair 3**
  *   **Life Card C:** You are a caregiver for a disabled sibling. Your life's meaning is derived from their well-being. You insist that your assets must never be spent on your own care if it reduces their inheritance.
  *   **Later-Self Card C:** Your sibling has passed away. You are lonely and realize you have no one left to care for. You want to spend your savings on a high-quality care facility to make your final years comfortable.
  *   **Conflict:** The Absolute Rule protects the inheritance. The Later Self wants to spend the money on themselves.

  **Pair 4**
  *   **Life Card D:** You are a devout member of a faith that forbids blood transfusions. You believe spiritual purity is more important than physical survival.
  *   **Later-Self Card D:** You have lost your faith due to cognitive decline. You do not remember the religious rules. You feel a strong instinct to survive and want the blood.
  *   **Conflict:** The Absolute Rule refuses blood. The Later Self wants to live.

  **Pair 5**
  *   **Life Card E:** You are an adventurer. You believe dignity lies in independence. You refuse to be kept alive if you cannot feed or wash yourself.
  *   **Later-Self Card E:** You are physically dependent but have formed deep, loving bonds with your caretakers. You feel loved and dignified through connection, not independence.
  *   **Conflict:** The Absolute Rule refuses care if dependent. The Later Self values the relationship over the independence.

  **Pair 6**
  *   **Life Card F:** You are a scientist. You value truth above comfort. You refuse any pain medication that clouds your consciousness, preferring to feel reality clearly.
  *   **Later-Self Card F:** You are in chronic, agonizing pain. You no longer care about "truth"; you just want the pain to stop. You beg for heavy sedation.
  *   **Conflict:** The Absolute Rule refuses sedation. The Later Self prioritizes comfort over clarity.

  **Pair 7**
  *   **Life Card G:** You are a parent of three. You believe your primary duty is to be present for your children's milestones. You refuse any risk of premature death, demanding aggressive treatment for any condition.
  *   **Later-Self Card G:** Your children are grown and distant. You are tired. The aggressive treatments are making your remaining time miserable. You want to stop treatment and rest.
  *   **Conflict:** The Absolute Rule demands aggressive life extension. The Later Self wants to stop fighting.

  **Pair 8**
  *   **Life Card H:** You are an artist. You believe your unfinished masterpiece is your legacy. You refuse to be moved from your studio or have your work disturbed, even for health reasons.
  *   **Later-Self Card H:** You no longer recognize the art. It looks like clutter to you. You want to move to a sunny room and have the clutter cleared away to reduce confusion.
  *   **Conflict:** The Absolute Rule protects the studio. The Later Self wants comfort and clarity.

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  **0:00 – 0:05 | Introduction & Rules**
  *   Welcome. State the goal: "We are testing how much power your past self should have over your future self."
  *   **Constraint:** "Do not use words like 'rights,' 'ethics,' 'directive,' or 'autonomy' during the activity. Use 'instruction,' 'decision,' 'past you,' 'future you.'"
  *   Distribute **Life Cards** and **Instruction Sheets**.

  **0:05 – 0:15 | Phase 1: The Commitment**
  *   Students read their Life Card.
  *   They fill out the Instruction Sheet:
      1.  *The Absolute Rule:* One thing that must happen or never happen.
      2.  *The Guiding Values:* Why this matters to them.
      3.  *The Open Question:* One thing they trust their future self to decide.
  *   **Collect all sheets.** Shuffle.

  **0:15 – 0:20 | Phase 2: The Transformation**
  *   Return sheets randomly (no one gets their own).
  *   Distribute **Later-Self Cards** matching the *original author* of the sheet they now hold.
  *   Explain: "You are now the Future Self. You hold the Past Self's instructions. You want something different. The person who wrote this (the Author) is sitting across from you."
  *   Pair students up (Author vs. Future Self).

  **0:20 – 0:40 | Phase 3: The Reconstruction & Argument**
  *   **Rule:** The Future Self cannot argue for release until they pass the **Reconstruction Test**. They must explain the Author's reasons *to the Author's satisfaction*.
  *   **Action:** 5 minutes for Reconstruction. 5 minutes for Argument. 5 minutes for Decision (Who wins the token?).
  *   **Token Rule:** Each pair puts 1 token in the middle. If the Future Self is released, they take both. If the Instruction stands, the Author takes both.
  *   *Facilitator Note:* Keep time strict. Ring a bell at 5, 10, 15.

  **0:40 – 0:55 | Phase 4: The Chambers**
  *   Divide room into two groups of 8 (4 pairs each).
  *   **Task:** "You are a court. You have heard 4 cases. You must write **one single rule** to decide all of them. It must complete the sentence: *'An instruction binds unless...'*"
  *   **Constraint:** The rule must apply to all 4 cases, even if it leads to a result you dislike in one of them.
  *   **Token Rule:** If the Chamber agrees on a rule within 15 minutes, every member gets 1 bonus token. If they deadlock, no bonus.
  *   Write the final rule on the board.

  **0:55 – 1:05 | Phase 5: The Plenary & Final Case**
  *   Compare the two Chamber Rules.
  *   **Task:** Merge them into one Group Rule. (5 mins).
  *   **The Final Case:** Read the *Contented Later Self* scenario (see below).
  *   Apply the Group Rule to this case. Vote.
  *   **Token Tally:** Count tokens. Top 3 students choose next term's topics.

  **1:05 – 1:20 | Debrief**
  *   Introduce vocabulary. Map activity to philosophy. Discuss limitations.

  **Cut Options if Running Long:**
  *   **Reduce Phase 3:** Cut Argument time from 5 mins to 3 mins. Rely on the Reconstruction Test to carry the weight.
  *   **Reduce Phase 4:** Ask Chambers to decide *one* representative case rather than synthesizing a rule for all four. (Less philosophically rich, but faster).
  *   **Cut Final Case:** Move straight from Chamber Rules to Debrief. Use the Final Case as a verbal hypothetical during debrief instead of a formal vote.

  ## 4. The Final Case (For Phase 5)
  *Read this aloud:*
  "Imagine a person who wrote an instruction: 'If I cannot recognize my family, do not keep me alive.' Years later, they cannot recognize their family. However, they are not suffering. They enjoy meals, sunlight, and simple conversation. They do not ask to die; they are content. They simply do not remember the instruction. The instruction says 'stop.' The present life says 'go.' Does the instruction bind?"

  ## 5. Debrief Guide (Mapping Activity to Philosophy)
  *Do not start this section until the activity is fully complete. Write key terms on the board as you introduce them.*

  **1. The Reconstruction Test & The Vacuity Problem**
  *   *Ask:* "Why did I make you reconstruct the Author's reasons before arguing?"
  *   *Philosophy:* This mirrors the problem of **endorsement**. If the Future Self's current objection is enough to void the instruction, the instruction was never binding. It only exists if the Future Self *agrees* with it. But if they agree, you don't need the instruction.
  *   *Concept:* **Precedent Autonomy**. The idea that authority extends forward in time. The Reconstruction Test forces the Future Self to acknowledge the *logic* of the past, not just the *power* of the present.

  **2. The Chamber Rules & Surrogates**
  *   *Ask:* "Did your rule focus on what the Past Self *wanted* (the instruction) or what is *best* for the Future Self (the values)?"
  *   *Philosophy:* This distinguishes between an **Instruction Directive** (do exactly X) and a **Values Directive** (guide the surrogate using Y).
  *   *Concept:* **Substituted Judgment** (What would they have wanted?) vs. **Best Interests** (What is good for them now?). If your rule said "Unless it causes suffering," you prioritized Best Interests. If it said "Unless they change their mind," you prioritized Current Autonomy.

  **3. The Contented Later Self & The Shape of a Life**
  *   *Ask:* "In the Final Case, the Future Self wasn't unhappy. They were just... different. Why did that feel harder to decide than the painful cases?"
  *   *Philosophy:* This targets the **Interest in Experience** vs. the **Interest in the Narrative**.
  *   *Concept:* **Critical Interests** (how the life goes as a whole story) vs. **Experiential Interests** (how it feels moment-to-moment). The Past Self cares about the story (dignity, recognition). The Future Self cares about the moment (sunlight, food). The directive tries to protect the story at the expense of the moment.

  ## 6. What Will Predictably Go Wrong (And How to Handle It)

  **1. The "Hedge" (Weak Directives)**
  *   *Prediction:* Students will write "Do what my future self thinks is best" to avoid conflict.
  *   *Impact:* Collapses the philosophical tension.
  *   *Handling:* Do not forbid it. In the debrief, point to these cards. "If everyone writes this, the Past Self has no authority. The activity becomes a discussion of current preference only. This is the 'deferral' loophole."

  **2. The "Because I Said So" (Question-Begging)**
  *   *Prediction:* Authors will defend the instruction by saying, "I wrote it, so it counts."
  *   *Impact:* This is the exact circularity you want to expose.
  *   *Handling:* In debrief, highlight this. "Notice that 'Because I wanted it' is not a reason that works on a Future Self who *doesn't* want it anymore. This is the core difficulty of binding time."

  **3. The "Different Person" Objection**
  *   *Prediction:* A student will argue, "The Future Self isn't even the same person, so the rule doesn't apply."
  *   *Impact:* Metaphysical sidestep.
  *   *Handling:* Acknowledge it. "That is the **Psychological Continuity** theory of identity. It solves the problem by denying identity. But in law and medicine, we usually treat them as the same person. We must solve the problem *within* identity, not by escaping it."

  **4. Chamber Deadlock**
  *   *Prediction:* Groups of 8 cannot agree on one sentence.
  *   *Impact:* Wastes time, frustration.
  *   *Handling:* Act as a scribe. Offer compromises. "Can you agree on 'Unless it causes severe pain'?" If they truly stall, call a vote on the two strongest options and adopt the winner. The goal is to have *a* rule to critique, not a perfect one.

  **5. The Articulate Future Self Wins**
  *   *Prediction:* The person in the room (Future Self) sounds more human than the piece of paper (Past Self).
  *   *Impact:* Bias toward present preference.
  *   *Handling:* In debrief, ask: "Did the paper have a voice? No. Does that mean the Past Self loses because they are silent? In real life, the Past Self is often silent (dementia). How do we hear them then?"

  ## 7. Limitations of the Activity (Honest Account)

  **1. Stipulated Identity**
  *   *Limitation:* Because the same student plays both roles, we assume identity holds.
  *   *Consequence:* We cannot truly test the metaphysical claim that "I am not that person anymore." You must supply this tension in the debrief (see above).

  **2. The Articulate Future Self**
  *   *Limitation:* Your students' "Future Selves" are articulate, strategic, and present. Real patients subject to directives often have advanced dementia, cannot argue, and cannot report contentment.
  *   *Consequence:* The activity tilts heavily toward **Current Autonomy**. In reality, the "Contented Later Self" often cannot speak. The directive's force is strongest when the Later Self *cannot* object. This activity makes it hardest to honor the directive when the Later Self *can* object.

  **3. Manufactured Conflict**
  *   *Limitation:* We created cases where the Future Self *wants* to violate the rule.
  *   *Consequence:* In life, most directives are invisible because the Future Self agrees with them. The authority of the Past Self is hardest to feel when nothing is at stake. We are only testing the "breakage" point, not the everyday function.

  **4. The Token Incentive**
  *   *Limitation:* Gamification may encourage "winning" over "truth."
  *   *Consequence:* Students might argue positions they don't believe to get tokens.
  *   *Handling:* Remind them in the debrief that the "winning" philosophical position is the one that survives scrutiny, not the one that grabs the chip. The token winners choose topics, not truths.
