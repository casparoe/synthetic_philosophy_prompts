prompt: |-
  I run the philosophy and ethics society at my high school. We meet once a week for eighty minutes, about sixteen students attend, mostly juniors and seniors, and nobody does any reading in advance — whatever happens has to be generated in the room. I have been asked to design and lead this term's session, and I want it to be about the authority of a person's earlier, competent self over the later self that replaces it, which is the authority an advance directive is meant to carry. I would like the group to run into the central difficulty themselves rather than hear me describe it, so please design an activity with rules that produce the problem, and have the vocabulary of directives, surrogates, and precedent introduced only in the debrief.

  The difficulty I want them to collide with is this. A directive exists precisely in order to bind a later self who will want to do otherwise — that is its whole function. So when the later self objects and asks to be released, the objection cannot be offered as a reason against the directive without assuming the very point in dispute. And yet the later self's present preference is the only evidence anyone has about what that person is now like, and somebody has to decide on the basis of something. The other grounds available — that autonomy extends forward in time and may be exercised in advance; that a life is a whole whose shape its owner may settle ahead of time; that a person has interests in how their life goes overall, not only in how it feels from moment to moment — each purchase the authority at a price I want the group to feel rather than be told about.

  Here is the shape I imagine, though please redesign it if you see something better. In the first phase, each participant receives an invented life card describing a specific person: their commitments, what they take to make their life worth living, and one thing they would refuse under any circumstances. Each then completes a directive form with three tiers — one instruction that must be carried out no matter what, one statement of the values that should guide whoever decides for them, and one matter deliberately left to that person's judgment. The forms are collected and returned by a draw, with the rule that nobody gets their own; each participant therefore becomes the later self of someone else, receiving a second card describing that person some years on, with changed circumstances and changed wants, and must argue to be released. The author of the directive is present and defends it. Before a release can even be considered, the later self must reconstruct, in the author's terms, the reasons behind the binding instruction, and the author alone judges whether the reconstruction is faithful. The room then divides into two chambers of eight; each chamber hears its four cases and must agree on a single rule, phrased as a completion of the sentence "A directive binds unless —", that decides all four cases, even if it decides some of them wrongly. The chambers then confront each other's rules, and the whole group must adopt one and apply it to a fresh case I supply at the end, in which a later self has adapted, reports being content, and asks to be released from a burdensome instruction. No real money: each pair stakes a token, the chamber's decision transfers the loser's token, and at the end the three students holding the most tokens choose the society's next three session topics and sit as the panel on the final case.

  Please include the following. The eight life cards and their later-self counterparts, invented rather than recycled from well-known thought experiments, specific enough that different views about what makes a life go well will yield different verdicts on them. A materials list and a minute-by-minute timeline for the eighty minutes, with a note on what to cut if we run long. A debrief that maps particular moments in the activity onto the philosophical positions — at minimum the reconstruction test onto the claim that a directive's authority cannot rest on the later self's endorsement without becoming vacuous, the two chambers' rules onto the difference between a directive that instructs a surrogate and one that merely informs their judgment, and the contented later self onto the difference between an interest in endorsing one's life and an interest in experiencing it as satisfactory. I would also like a frank account of what will predictably go wrong the first time I run it and how to handle it: I expect most participants to hedge by writing directives that defer to their later selves, and I would rather let them do it and discuss it than forbid it; I expect the authors to argue that the instruction should stand simply because it is what they wanted, which is the question-begging move; I expect at least one participant to insist the later self is literally a different person, which the activity cannot test; I expect the chambers to deadlock over their rules; and I expect the most articulate later self to win, which will tilt the room toward present preference. Finally, be honest about what the activity cannot reproduce. It stipulates that the same participant is the same person throughout, so the identity-based defence of the earlier self cannot be genuinely tried and the facilitator has to supply that metaphysical question. It gives the later self a voice, a memory, and a strategy, none of which a person in advanced dementia may have, so the activity will tilt toward the later self's autonomy and I should say so. And it manufactures conflict by handing out resentful later selves, whereas in life the later self is often content and the directive is invisible; the force of the earlier self's authority is hardest to feel exactly when nothing is at stake.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** High school philosophy/ethics society, 16 students (Juniors/Seniors), 80 minutes, no pre-reading.
      *   **Topic:** Authority of earlier competent self over later self (Advance Directives).
      *   **Goal:** Students must *discover* the central difficulty (the paradox of binding a future self who objects) through activity, not lecture. Vocabulary (directives, surrogates, precedent) introduced *only* in debrief.
      *   **Core Philosophical Tension:** A directive binds *because* the later self might object. If the later self's objection counts as a reason to void it, the directive is useless. But the later self's preference is the only evidence of their current state.
      *   **Proposed Structure (to be refined):**
          1.  Life Cards (Commitments/Refusals).
          2.  Directive Forms (3 tiers: Binding, Values, Discretion).
          3.  Swap & Transform: Participants become the "Later Self" of someone else (new card with changed circumstances/wants).
          4.  Argument Phase: Later self argues for release; Author defends.
          5.  Constraint: Later self must reconstruct Author's reasons first (Author judges faithfulness).
          6.  Chamber Phase: Two groups of 8, 4 cases each. Must agree on one rule ("A directive binds unless...").
          7.  Plenary: Chambers confront rules, adopt one, apply to a fresh "Contented Later Self" case.
          8.  Incentive: Tokens for winning arguments/topics for next sessions.
      *   **Required Deliverables:**
          *   8 Life Cards + 8 Later-Self Counterparts (Original, specific).
          *   Materials List.
          *   Minute-by-Minute Timeline (80 mins) + Cut options.
          *   Debrief Guide (Mapping activity to philosophy).
          *   "What Will Go Wrong" (Predictive troubleshooting).
          *   Limitations of the Activity (What it can't reproduce).

  2.  **Evaluate and Refine the Proposed Structure:**
      *   *Critique:* The proposed structure is ambitious for 80 minutes with 16 high schoolers.
      *   *Bottleneck:* The "Reconstruction Test" (Later self must reconstruct Author's reasons to Author's satisfaction) is a huge time sink. If the Author is stubborn, the case stalls.
      *   *Bottleneck:* Two chambers of 8 agreeing on *one* rule for 4 cases each is difficult consensus building.
      *   *Bottleneck:* The final plenary + fresh case + token counting might run over.
      *   *Adjustment:* Keep the core logic but tighten the timing. The "Reconstruction Test" is brilliant philosophically but needs a time limit. The Chamber phase needs a clear facilitator role (or assigned roles within the group) to ensure a rule is produced.
      *   *Incentive:* The token system is good for engagement but needs to be simple so it doesn't distract from the philosophy.
      *   *Vocabulary:* Strictly enforce the "no jargon during activity" rule.

  3.  **Drafting the Life Cards:**
      *   Need 8 distinct personas.
      *   Need to cover different values: Autonomy, Dignity, Connection, Achievement, Memory, Physical Integrity, Religious/Spiritual, Experience.
      *   Need "Later Self" cards that create genuine conflict (not just "I changed my mind," but "My values have shifted due to circumstance").
      *   *Constraint:* Must be high-school appropriate but mature enough for 11th/12th graders.
      *   *Idea:* Avoid standard dementia tropes where possible to fit the "identity" limitation noted in the prompt, but some cognitive change is necessary to justify the directive context. Let's make the "Later Self" condition varied (some cognitive, some physical, some psychological).

  4.  **Drafting the Timeline:**
      *   0-5: Intro & Rules (No jargon).
      *   5-15: Phase 1 (Life Cards + Directives).
      *   15-20: Swap + Reveal Later Self Cards.
      *   20-40: Phase 2 (Pair Debates + Reconstruction).
      *   40-55: Phase 3 (Chambers + Rule Making).
      *   55-65: Phase 4 (Plenary + Final Case).
      *   65-80: Debrief + Tokens.
      *   *Risk:* 20 mins for pair debates is tight for 8 pairs. That's 2.5 mins per pair. Need to run these simultaneously.
      *   *Risk:* Chamber rule making is hard. Need to ensure they *must* produce a rule.

  5.  **Drafting the Debrief:**
      *   Must connect specific mechanics to specific philosophical concepts (Precedent Autonomy vs. Current Wellbeing, Identity, Substituted Judgment vs. Best Interest).
      *   Must address the "What Will Go Wrong" section honestly.

  6.  **Addressing "What Will Go Wrong":**
      *   Students writing weak directives ("Do whatever my future self wants"). *Strategy:* Allow it, but highlight it in debrief as "collapsing the distinction."
      *   Authors arguing "Because I said so." *Strategy:* Identify this as the circularity problem.
      *   "Different Person" argument. *Strategy:* Acknowledge it but bracket it as metaphysical.
      *   Deadlock. *Strategy:* Facilitator intervention or majority vote.
      *   Articulate Later Self winning. *Strategy:* Point out the bias toward the "voice present in the room."

  7.  **Addressing Limitations:**
      *   Identity is stipulated (same student).
      *   Later self is articulate (unlike severe dementia).
      *   Conflict is manufactured (real life is often quiet).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The prompt asks for *eight* life cards. I need to ensure they are distinct.
      *   *Correction:* The prompt asks for the vocabulary to be introduced *only* in the debrief. I must ensure the instructions to students do not use words like "directive," "surrogate," "autonomy," "precedent." Use "Instruction," "Decision-Maker," "Past Self," "Future Self."
      *   *Correction:* The token system needs to be clear. Who gets tokens? The prompt says "each pair stakes a token, the chamber's decision transfers the loser's token." This implies a zero-sum game within the chamber. I need to clarify this mechanic so it doesn't cause drama. Actually, simpler: The Chamber decides the case. If they rule for the Later Self, Later Self gets token. If they rule for the Author, Author gets token.
      *   *Correction:* The prompt says "At the end the three students holding the most tokens choose the society's next three session topics." This is a great incentive.

  9.  **Final Review against Constraints:**
      *   80 minutes? Yes, tight but doable.
      *   16 students? Yes, 8 pairs.
      *   No reading? Yes.
      *   Vocabulary in debrief only? Yes.
      *   Specific cards? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

  10. **Writing the Response:** (Proceeding to generate the detailed plan based on these thoughts.)
      *   *Tone:* Professional, pedagogical, philosophically rigorous but accessible.
      *   *Structure:* Follow the prompt's requested sections.

  *(Self-Correction on the "Reconstruction Test"):* The prompt specifies: "Before a release can even be considered, the later self must reconstruct, in the author's terms, the reasons behind the binding instruction, and the author alone judges whether the reconstruction is faithful." This is a hard rule. I need to make sure the timeline accommodates this. It adds a layer of "Understanding" before "Judging." I will emphasize this in the instructions.

  *(Self-Correction on Chambers):* "Each chamber hears its four cases and must agree on a single rule." This means they discuss the 4 cases *together* to find a common principle. This is a legislative task. I need to make sure they don't just vote case-by-case. They need to write *one sentence*.

  *(Self-Correction on Final Case):* Needs to be the "Contented Later Self" case where the conflict is invisible. I will draft a specific scenario for this.

