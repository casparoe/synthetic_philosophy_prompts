      *   *The Problem:* The "arbitrariness" objection is the strongest. If one speck doesn't count, does two? If $n$ specks don't count, does $n+1$? If the floor is a sharp cutoff, it seems metaphysically magical. If it's vague, how can we make a binary decision (aggregate vs. don't aggregate)?
      *   *The "Broken Arm" Case:* If a broken arm is above the floor, then a million broken arms *do* aggregate. This saves the view from being absurdly permissive of moderate harm.
      *   *Distinction from Non-Aggregation:* Simple non-aggregation says *no* interpersonal summing ever happens (each person is a separate universe). The "Floor" view says summing *does* happen, but only for significant harms.
      *   *Verdict:* The thesis is defensible *if* framed carefully. It shouldn't be framed as a magical metaphysical switch, but rather as a feature of how value concepts work (vagueness/sorites). It aligns with "lexical priority" views where certain thresholds trigger moral significance. I can construct a robust defense, but I need to acknowledge the vagueness issue honestly.

