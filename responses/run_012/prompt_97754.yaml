prompt: |-
  I have no academic training, but I have spent several years volunteering in the storeroom of a small regional museum, and much of that time has gone into thinking about copies. I would like to turn a half-formed idea into a short research proposal — for a small grant from a foundation that funds independent, public-facing work in the humanities: six months, one long essay, one public talk — and I would like you to draft that proposal for me.

  My idea is this. Disputes about fakes are usually conducted as if there were a single thing, the original, whose value the fake simply lacks, and as if that value were a property of the object itself. I have come to suspect that what we call an original is better understood as a relation — a relation between a thing and the history that produced it and the copies that descend from it — rather than a property the thing possesses on its own. If that suspicion is right, then the value we place on originals ought to survive certain changes to the physical object, and ought to be destroyed by certain changes that leave the physical object entirely untouched. I can think of cases that seem to cut both ways, and I cannot yet tell whether they refute the relational idea or merely refine it.

  The cases I keep returning to are these. A painting restored so heavily that little of its original material survives, yet still treated as the same work. That same painting re-attributed to another hand, where nothing perceptible changes and yet the value collapses. An exact replica executed by the artist's own studio under his close direction, which he never touched. A work the artist reproduces decades later, so that there are now two originals and no forgery at all. A digital work with no privileged copy, in which the artist declares every copy to be an original. And the case I find hardest: a new work generated by a machine trained on an artist's output, with the right surface and no human maker whatsoever. If originality is a relation to a history, what precisely is on the other end of the relation — the maker's intention, the causal chain of copying, the community's recognition — and can a single account of it deliver the right verdict on all of these cases?

  I would like the proposal to state the question sharply enough that it has a definite answer; to explain why the obvious accounts — that originals are valuable because they are unique, or because they are perceptually distinctive, or because they carry a history — each leave something unexplained; and to set out what I would actually do, step by step across six months: which cases I would analyze first, which candidate accounts I would formulate and then try to break, which distinctions I would need to keep separate, and in what order. I would also like an honest account of what a result would look like — what would count as having found the right account, and what would count as the project failing — and a realistic sense of what fits in six months and one essay. And I would like it to say, without overclaiming, why the question matters beyond my own curiosity: to museums deciding what to display, to collectors, and to anyone who must put a price or a label on a thing.

  Please leave out any reading list or citations; I will supply those myself once I know what I am arguing for. I am not trying to summarize what others have written. I am trying to find out whether my suspicion can be turned into a position that survives its own counterexamples.
reasoning: |-
  Here's a thinking process that leads to the suggested research proposal:

  1.  **Analyze the Request:**

      *   **Applicant Profile:** No academic training, but significant practical experience (volunteer in a museum storeroom). Interested in "copies," "originals," and "value."
      *   **Project Goal:** Turn a half-formed idea into a short research proposal for a small foundation grant (independent, public-facing humanities work).
      *   **Deliverables:** Six months of work, one long essay, one public talk.
      *   **Core Idea:** Originality is not a property of an object but a *relation* (between the thing, its history, and its copies).
      *   **Key Cases:** Heavy restoration, re-attribution, studio replicas, artist self-replication, digital multiples, AI generation.
      *   **Requirements:**
          *   State the question sharply (definite answer sought).
          *   Explain why obvious accounts (uniqueness, perceptual distinctiveness, history) fail.
          *   Outline a step-by-step 6-month plan (cases, candidate accounts, distinctions, order).
          *   Define success/failure criteria honestly.
          *   Explain public significance (museums, collectors, labeling/pricing).
          *   *Constraint:* No reading list or citations (focus on the argument, not literature review).
          *   *Tone:* Honest, rigorous, feasible, public-facing but intellectually serious.

  2.  **Deconstruct the Core Argument:**

      *   *Thesis:* Originality is relational, not intrinsic.
      *   *Problem:* Current discourse treats "original" as a binary property (fake vs. real).
      *   *Test:* If relational, physical changes shouldn't always kill value, and non-physical changes (context/history) should.
      *   *Method:* Stress-test the relational theory against specific edge cases (restoration, attribution, studio work, digital, AI).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. "The Relational Original"? "Beyond the Fake"? Let's go with something that highlights the tension between object and history. *The Life of the Original: A Relational Account of Value in Art and Artifacts.*
      *   **Project Summary:** Brief overview. Who, what, why. Emphasize the non-academic but experienced background.
      *   **The Question:** Needs to be sharp. "Is originality a property or a relation?" -> "Under what conditions does an object retain its status as an 'original' when its physical constitution or historical lineage is altered?"
      *   **Why Existing Accounts Fail:**
          *   *Uniqueness:* Fails with multiples/editions.
          *   *Perception:* Fails with re-attribution (looks same, value drops).
          *   *History:* Too vague. Needs to specify *which* history matters (causal vs. intentional).
      *   **Methodology/Work Plan (6 Months):**
          *   *Months 1-2:* Case selection and initial formulation.
          *   *Months 3-4:* Stress-testing the theory (the "breaking" phase).
          *   *Months 5-6:* Writing and public talk prep.
          *   *Specifics:* Need to mention the specific cases provided in the prompt (restoration, AI, etc.).
      *   **Deliverables:** One essay (approx. 5k-8k words?), one talk.
      *   **Success/Failure Criteria:** This is crucial for honesty. Success = a coherent framework that handles most cases. Failure = admitting the concept is too fragmented.
      *   **Public Significance:** Museums (display decisions), Market (pricing), Public (understanding value).

  4.  **Refining the Tone:**

      *   Avoid academic jargon where possible (since the applicant has no training), but maintain intellectual rigor.
      *   Highlight the "storeroom" perspective—this is a strength, not a weakness. It grounds the theory in physical reality.
      *   Ensure the timeline is realistic. Six months is short for deep philosophy, so the scope must be narrow. Focus on *testing* the hypothesis, not writing a book.

  5.  **Drafting - Iteration 1 (Mental Check):**

      *   *Critique:* Is the question too philosophical?
      *   *Fix:* Ground it in the museum context. The applicant works with objects. The proposal should reflect that material engagement.
      *   *Critique:* Is 6 months enough?
      *   *Fix:* Limit the number of case studies. Don't try to solve AI art fully, just use it as a stress test.
      *   *Critique:* Is the "no citations" rule followed?
      *   *Fix:* Ensure no names of philosophers (Benjamin, Danto, etc.) are dropped. Keep it focused on the applicant's own reasoning.

  6.  **Drafting - Iteration 2 (Writing the Content):**

      *   *Title:* "The Original as Relation."
      *   *Intro:* Establish the storeroom context.
      *   *The Problem:* The "binary trap" (fake vs. real).
      *   *The Hypothesis:* Originality is a network/relation.
      *   *The Plan:* Break it down by month.
      *   *Outcomes:* Be clear about what "failure" looks like (it's okay to fail in research).
      *   *Impact:* Practical application for museums.

  7.  **Final Polish:**

      *   Check against all constraints in the prompt.
      *   *Constraint Check:* No reading list? Yes. Sharp question? Yes. Why obvious accounts fail? Yes. Step-by-step plan? Yes. Success/Failure? Yes. Public significance? Yes.
      *   *Voice:* Ensure it sounds like an independent researcher, not a PhD student trying to sound academic. It should sound thoughtful, observant, and practical.

  8.  **Final Review of the "Success/Failure" section:**
      *   Make sure it doesn't sound defeatist. It should sound rigorous. If the theory doesn't hold, that *is* a result.
      *   Make sure the "Public Talk" is integrated into the plan.

  9.  **Final Review of the "Question":**
      *   Prompt asks for a question sharp enough to have a definite answer.
      *   *Draft:* "Is originality a relation?" -> *Refinement:* "Can a single relational definition of originality account for the valuation of objects across physical, historical, and technological changes?"

  10. **Final Review of "Why it matters":**
      *   Connect back to the storeroom. Labels matter. Insurance matters. Display matters.

  (Self-Correction during drafting): I need to make sure I don't accidentally slip in academic names like Walter Benjamin or Arthur Danto, even though they are obvious fits. The prompt explicitly says "I am not trying to summarize what others have written." I must stick to the applicant's voice.

