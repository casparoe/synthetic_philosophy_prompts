      *   **Goal:** Wants to know what would *actually* count against this position. Not "gotchas," but substantive empirical or theoretical failures of the belief-level description.
      *   **Specific Questions:**
          *   What cases make belief-talk predictively useless/misleading?
          *   What experiments show "no there there" (e.g., instability, probing)?
          *   How to distinguish "real level" vs. "useful crutch"?
