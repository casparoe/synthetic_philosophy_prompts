  7.  **Final Polish:** Ensure the distinction between *Historicism* (inevitable laws of destiny) and *Theoretical History* (social science) is clear, as Popper conflates them to make his point. The friend is following this conflation.

      *   *Self-Correction on "Oedipus Effect":* Popper calls this the "Oedipus Effect." It refers to self-fulfilling or self-defeating prophecies. It limits *public* predictions, not *private* theoretical models.
