answer: |-
  Your intuition is correct: the argument proves too much, and your friend is smuggling in a conflation that allows him to keep his political conclusion (piecemeal reform) while denying the epistemic foundation required to make it rational.

  The loose joint is not where he says it is. He wants you to drop **(1)** (Science requires prediction). You are right to resist that, because if you drop (1), you lose the ability to distinguish science from poetry, and you lose the justification for his "piecemeal reform" (which is itself a predictive claim that Reform A will improve Condition B).

  The actual breakage is in the inference from **(3) to (4)**, and the definition of **Prediction** embedded in **(1)**.

  Here is how to dismantle it, ranked by how much damage each point does to his position.

  ### 1. The "Input vs. Mechanism" Distinction (Attacking the 3→4 Inference)
  Your friend's argument relies on an equivocation between predicting the *content* of new knowledge and predicting the *consequences* of new knowledge.

  *   **Premise (3) is true:** We cannot predict the *content* of future discoveries. (I cannot tell you today what the 2050 physics paper will say.)
  *   **Premise (4) is false:** It does not follow that we cannot predict the *systemic impact* of discoveries.

  **The Counter:** A science of history (or sociology/economics) does not need to predict *what* will be discovered to predict *how society reacts* to discovery.
  *   **Example:** I cannot predict when the next pandemic will start or what virus it will be (novelty). I *can* predict that if transmission rates exceed X, hospitals will overflow (structural law).
  *   **Example:** I cannot predict the next technological invention. I *can* predict that if a technology lowers the cost of communication, social coordination costs will drop.

  **The Cost:** If he insists (4) follows from (3), he admits that social science can only study the past, not the future. This makes "piecemeal reform" impossible, because reform requires the prediction: "If we change policy X, outcome Y will improve." If he denies (4) is false, he admits social science can make *some* predictions, which undermines his hardline "no laws of history" claim.

  ### 2. The Piecemeal Paradox (The Performative Contradiction)
  You noticed this, but you need to press it harder. This is the strongest pragmatic argument against him.

  Popper (and your friend) advocates for "Piecemeal Social Engineering" over "Utopian Engineering." The argument is that we should test small reforms, see what works, and iterate.
  *   **The Trap:** This method *is* a scientific method. It relies on **conjecture and refutation**.
  *   **The Contradiction:** To say "Policy A will fix Problem B" is a prediction. To say "We should test Policy A" implies the prediction "The test will yield useful information."
  *   **The Kill:** If (4) is true ("The course of human history can't be predicted"), then piecemeal reform is not rational engineering; it is blind gambling. You cannot claim your method is *superior* to historicist planning unless you can predict that your method yields better outcomes.

  **The Cost:** He must either admit that piecemeal reform relies on local, short-term predictions (which concedes that *some* social prediction is possible, weakening (5)), or he must admit his policy preference is non-rational (just a "faith" he holds).

  ### 3. Correcting the "Novelty-Dependence" Point (Fixing Premise 1)
  Your friend claims that because physics/biology can't predict novelty, they aren't "predictive" in the way he demands of history, so Premise (1) must be wrong. This is a category error.

  *   **Physics:** Physics does not predict *when* a new particle will be found. It predicts *how* particles behave *if* they exist. It predicts the *bounds* of novelty (e.g., nothing travels faster than light).
  *   **Biology:** Evolutionary theory cannot predict the exact mutation. It *can* predict the selection pressure. (If environment gets colder, fur will get thicker *on average*).

  **The Fix:** Premise (1) should be refined, not dropped.
  *   **Friend's (1):** Science must predict specific future states.
  *   **Corrected (1):** Science must predict *conditional outcomes* or *structural constraints*.

  **The Cost:** If he accepts the Corrected (1), then a "Science of History" becomes possible. It just becomes a science of *constraints and tendencies* rather than a prophecy of destiny. This saves Science but kills his strong claim (5) that there are "no laws of history." There are no *prophecies*, but there are *laws* (e.g., supply and demand, unintended consequences).

  ### 4. The Oedipus Effect (Reflexivity)
  He mentions the "Oedipus Effect" (self-fulfilling/defeating prophecies). This is valid (Robert Merton and George Soros expanded on this), but he is using it as a shield against *all* prediction.

  *   **The Limit:** Reflexivity applies to *publicly known* predictions about *human actions*. It does not apply to structural predictions.
  *   **Example:** If I predict "The stock market will crash," I might cause a crash. If I predict "If money supply increases by 50%, prices will rise," my publishing that prediction doesn't stop the prices from rising (unless the central bank changes policy *because* of my prediction, which is just a feedback loop, not total unpredictability).

  **The Cost:** Acknowledging reflexivity limits *long-term, holistic* prediction (Historicism), but it does not ban *short-term, conditional* prediction (Science). He is conflating the two to ban the latter.

  ### Summary: Which Step to Give Up?

  Do not give up **(1)** entirely. If you do, you surrender the definition of science.
  Do not give up **(3)**. It is logically robust (we can't know the unknown).

  **Give up the inference from (3) to (4), and refine (1).**

  **Tell him this:**
  > "You are conflating **predicting the novelty** with **predicting the reaction to novelty**.
  >
  > I agree with (3): I can't predict what we will know tomorrow.
  > I disagree with (4): That doesn't mean I can't predict how society will handle what we know tomorrow.
  >
  > If you keep (4), you destroy your own policy. Piecemeal reform requires the prediction that 'fixing this leak will stop the flood.' If history is fundamentally unpredictable, your reform is magic, not engineering.
  >
  > So, you have to choose: Either admit social science can make conditional predictions (which saves Piecemeal Reform but kills your 'No Laws of History' dogma), or stick with 'No Laws' and admit your reform agenda is just a guess."

  **The Price:**
  *   **If he keeps (5) (No Laws):** He pays with the rationality of his own political program. He becomes a mystic, not a reformer.
  *   **If he keeps Piecemeal Reform:** He pays with (5). He must admit there are *some* laws of history (at least short-term causal regularities), which opens the door to the very theoretical history he wants to ban.

  You pay less. You keep science (refined), you keep the possibility of social knowledge, and you expose his policy as contradictory if he refuses to bend.
