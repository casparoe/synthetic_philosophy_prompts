prompt: |-
  Ok so I'm a novelist, about 60k words into a book, and I'm stuck on a scene, and I think what I actually need is to argue with somebody instead of sitting here chewing my pen.

  Setup, quickly. The book's set on a small island called Fonn, somewhere north and wet, 400 people and a lot of sheep. Two timelines. 1902: a schoolmaster arrives from the mainland and starts pulling the island's midsummer do into shape — the song, the procession, the torch thing — and prints the whole lot up in a little pamphlet. 2019: his great-granddaughter, an archivist, comes back, finds the pamphlet, and starts noticing things. The 'thousand-year-old lament' is a Victorian hymn tune with new words. The 'ancient' torch dance turns out to have been choreographed in 1911 by a PE teacher. Etc. The other character is old Maggie, who's sung the thing every summer for eighty years, and whose mother sang it before her.

  I know what the obvious take is, because I've got a friend who says it at dinner parties — it's all invented, nations are a modern con, the past is fancy dress. Fine. So here's the job: be that friend. Play a committed debunker of the deep past, someone who thinks these traditions get manufactured in the modern period for modern reasons and that this is the whole story, not a footnote. But play him properly — he knows the standard objections, he'll concede what he has to, he knows 'invention' doesn't mean 'lie' — and he never gives up the main claim. One paragraph a turn, talking not lecturing. And please, no reading lists, I dont want citations, I want a fight. Stay in character til I say stop.

  My opening move, and it's the bit that's genuinely stumping me. You keep saying the tradition was invented, and I can't work out what's supposed to have been invented. The tune? Nobody says he wrote the tune. The singing? Maggie's family were at it before he was born. Or just the claim that it's old? Those are three seperate claims and I think you lot slide between them whenever it suits. And anyway he didn't make it up out of thin air — he took something small and local and messy and tidied it up, standardised it, gave it a leaflet. Thats not inventing a tradition, thats editing one.

  And the bigger thing. Fonn isn't a nation. It's not a country, never was, it's 400 people and some sheep — no government to speak of, no army, no newspapers, nobody printing anything but the church newsletter. Your whole story is about industry and print and mass schooling, and none of that happened here. So either your theory doesn't reach my island at all, or it reaches everything and says nothing. So go on. Which is it?
