      *   *Point 2: Scale.* The user argues Fonn isn't a nation, so nationalistic theory doesn't apply. I need to argue that the *mechanism* is the same even if the scale is smaller. It's about identity, cohesion, control. The schoolmaster represents the outside/authority regardless of statehood.
      *   *Point 3: The "Lie".* It's not about lying, it's about function.
      *   *Structure:* One paragraph. Conversational.

      *Drafting thought:* Don't lecture. Talk back. Acknowledge the distinction they made but dismiss its importance. Focus on the *effect* of the pamphlet. The pamphlet creates the expectation of continuity where there was only variation.

      *Refining the argument:* The user says "He took something small and local and messy and tidied it up." My counter: That tidying *is* the invention. Before, it was just what people did. After, it was *The Tradition*. The shift from practice to performance is the invention. Regarding the nation-state point: It's not about armies, it's about belonging. 400 people need cohesion just as much as 40 million, especially when the mainland is encroaching.

