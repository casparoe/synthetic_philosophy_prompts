      *   *Does Side B accept this?* No, they say "Survival is a preference." If I prefer a 99% chance of ruin for a 1% chance of galaxy-brain wealth, EU says that's fine if my utility function reflects that.
      *   *So the clash is:* Is "avoiding ruin" a requirement of rationality (A) or a preference (B)?
      *   *User's Hypothesis:* "Fact about the world that constrains rational choice." Yes. Side A says the math of compounding *forces* log. Side B says the math of compounding just describes the lottery; utility describes the agent.

  9.  **Final Plan:**
