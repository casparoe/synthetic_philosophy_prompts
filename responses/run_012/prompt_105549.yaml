answer: |-
  Your hypothesis is correct, but it requires a sharper formulation to fully dissolve the impasse. You have identified the *locus* of the disagreement (the status of the time/ensemble distinction), but the impasse persists because your group is conflating two distinct concepts of **normativity**.

  Here is the diagnosis: This is not merely a verbal dispute about "rationality," nor is it a substantive disagreement about probability theory (both sides accept the math of compounding). It is a **foundational disagreement about the source of normative constraints on agency.**

  *   **Side A (Ergodic/Geometric)** argues for **Instrumental Rationality**: Rationality is defined by the successful navigation of the physical/dynamic constraints of the environment. If the environment is non-ergodic (multiplicative dynamics), the "laws of motion" of wealth impose an objective constraint: maximize geometric growth or face effective ruin. Here, the utility function is *derived* from the dynamics.
  *   **Side B (Standard EU)** argues for **Axiomatic Rationality**: Rationality is defined by internal consistency of preferences (transitivity, completeness, etc.). The environment provides probabilities and outcomes, but the *valuation* of those outcomes is sovereign to the agent. Here, the utility function is *stipulated* by the agent.

  Your hypothesis—that the disagreement is about whether the time/ensemble distinction is a world-constraint or a representational fact—is the precise anatomical cut needed. Side A treats non-ergodicity as a physical law that *constrains choice* (you cannot violate it without penalty). Side B treats it as a modeling choice that *describes the lottery* (you can violate it if you accept the risk).

  Below is the concrete engagement with your cases, followed by the verdict on what counts as progress.

  ---

  ### Case Analysis: Where the Premises Covertly Diverge

  #### 1. The 50% Win / 40% Loss Repeated Bet
  *   **The Math:** Arithmetic EV is +5%. Geometric growth rate is negative.
  *   **Side A Commitment:** Taking this bet is *instrumentally irrational*. Regardless of your "preferences," the dynamics of the system ensure that a trajectory taking this bet converges to zero. The time average *is* the reality for a single agent; the ensemble average is a fiction.
  *   **Side B Commitment:** Taking this bet is *axiomatically permissible* for a linear utility maximizer. Declining it reveals concave utility. To say it is "irrational" to take it is to illegitimately impose a specific utility function (log) as objective.
  *   **The Covert Clash:** Side A assumes **"Survival/Growth is the Goal."** They treat the preservation of the betting agent as a prerequisite for rationality. Side B assumes **"Preference Satisfaction is the Goal."** If an agent prefers a 99% chance of ruin for a 1% chance of vast wealth, Side B says that is rational provided it is consistent. Side A says that preference is biologically/dynamically incoherent for a compounding agent.
  *   **Diagnosis:** Side A is smuggling in a *teleological constraint* (the agent must persist to be an agent). Side B is smuggling in a *sovereignty constraint* (the agent's valuation cannot be overruled by physics).

  #### 2. The Single All-or-Nothing Wager
  *   **The Scenario:** One shot. Positive EV. Risk of total loss.
  *   **Side A Commitment:** Even in a single shot, if "loss" means an absorbing state (death, exit from the game), the time-average argument collapses into the ensemble average *except* at the boundary. If the loss is absorbing, the time average over a long horizon is zero. Thus, declining is rational to avoid the absorbing state.
  *   **Side B Commitment:** If it is truly one-shot, the time-average argument vanishes. There is no sequence to compound. Declining positive EV is pure risk aversion.
  *   **The Covert Clash:** Side A treats **"One-Shot" as a fiction.** They argue that no decision is truly isolated; ruin precludes future decisions, effectively making every bet part of a sequence. Side B treats **"One-Shot" as coherent.** They argue that if the agent does not value future bets (or ceases to exist), the ergodic argument does not apply.
  *   **Diagnosis:** Side A is expanding the definition of the "process" to include the agent's lifespan. Side B is bounding the "process" to the specific wager.

  #### 3. The Purchase of Insurance (Negative EV)
  *   **The Scenario:** Paying a premium to avoid a low-probability ruin.
  *   **Side A Commitment:** Buying insurance is *growth-optimal*. It removes the drag of the absorbing state on the geometric growth rate. It is not "risk aversion"; it is "friction management."
  *   **Side B Commitment:** Buying insurance is *utility-maximizing* for a concave utility function. It is the canonical example of risk aversion.
  *   **The Covert Clash:** Side A claims to **derive risk aversion from dynamics.** They argue they don't *need* a utility function; the dynamics create the "aversion." Side B claims to **describe risk aversion via utility.** They argue the dynamics are neutral; the aversion comes from the agent.
  *   **Diagnosis:** This is the strongest point of confusion. Side A is correct that non-ergodicity *mimics* risk aversion. Side B is correct that without a goal (like max growth), non-ergodicity does not *mandate* it. The dispute is whether "Max Growth" is a default rational goal or a specific preference.

  #### 4. Fractional Kelly in Practice
  *   **The Observation:** Professionals bet less than full Kelly.
  *   **Side A Commitment:** This is due to **parameter uncertainty** or **consumption needs.** Full Kelly is optimal only if you know the edge perfectly and never withdraw. Fractional Kelly is often *more* robust for growth under uncertainty.
  *   **Side B Commitment:** This is proof of **non-log utility.** If they were true growth maximizers, they would bet Full Kelly (adjusted for edge). The fact they don't proves they have other preferences (smooth consumption, sleep-at-night).
  *   **The Covert Clash:** Side A treats **Deviation as Error/Constraint.** (They would bet Full Kelly if they could/ knew more). Side B treats **Deviation as Preference.** (They bet less because they want to).
  *   **Diagnosis:** Side A tries to preserve the "Rationality = Kelly" equation by adding friction terms. Side B dissolves the equation entirely.

  ---

  ### Verdict on the Disagreement

  You are right. The residual disagreement is about **whether the time-average/ensemble-average distinction is a fact about the world that constrains rational choice or merely a fact about one particular representation of the agent's situation.**

  *   **Side A** believes non-ergodicity is a **physical constraint on rationality.** Just as you cannot rationally choose to jump off a cliff because gravity constrains you, you cannot rationally choose a negative geometric growth strategy because probability dynamics constrain you. The "Log Utility" is not a preference; it is the *shadow of the dynamics*.
  *   **Side B** believes non-ergodicity is a **representational feature of the gamble.** It describes the payoff structure, not the agent's values. The "Log Utility" is a preference. You can choose to ignore the dynamics if you value the upside enough.

  **Why the impasse persists:**
  Both sides are using the word "Rational" to do different work.
  *   For Side A, Rationality = **Instrumental Effectiveness** (achieving survival/growth in this specific universe).
  *   For Side B, Rationality = **Internal Consistency** (not contradicting one's own axioms).

  Side A thinks Side B is "irrational" because they are instrumentally self-destructive (like jumping off a cliff).
  Side B thinks Side A is "paternalistic" because they are dictating preferences rather than respecting consistency.

  ### What Counts as Progress?

  Given this diagnosis, a literature survey or a new theorem will not solve this. You are not stuck on the math; you are stuck on the **meta-ethics of decision theory.** Progress requires one of the following three moves:

  1.  **The Dissolution (Verbal/Conceptual):**
      Agree that "Rationality" is polysemous here. Adopt a distinction between **Ecological Rationality** (Side A: what works in this environment) and **Logical Rationality** (Side B: what is consistent with axioms).
      *   *Progress Condition:* Both sides agree that Kelly is *Ecologically Rational* for compounding agents seeking persistence, but not *Logically Required* for all agents. This allows Side A to keep their "physics" and Side B to keep their "preferences."

  2.  **The Formal Result (Substantive):**
      A demonstration that violating the ergodic constraint leads to **dynamic inconsistency** (a Dutch Book argument over time) rather than just "slower growth."
      *   *Progress Condition:* If Side A can show that a non-Kelly bettor can be pumped for money *over time* by a Kelly bettor (in a way that violates VNM axioms extended to time), then Side A wins the "Rationality" argument. If Side B can show that the non-Kelly bettor is simply paying a premium for a different payoff distribution without logical contradiction, Side B wins. (Current literature suggests the latter: it is a preference, not a logical inconsistency, unless "survival" is an axiom).

  3.  **The Reformulation (The Real Question):**
      Stop asking "Is Kelly Rational?" and start asking **"Under what conditions does the Ensemble Average fail to guide a Single Trajectory?"**
      *   *Progress Condition:* The group agrees that the Ensemble Average is the correct guide *if and only if* the agent can pool risk (insurance, parallel copies, large N). The Time Average is the correct guide *if and only if* the agent is isolated, non-ergodic, and faces absorbing states.
      *   This shifts the debate from "Which utility function is true?" to "What is the agent's relationship to the risk?" (i.e., Can I share this risk, or must I bear it alone?).

  ### Recommendation

  Your group should cease debating whether Kelly is "Expected Utility with Log Utility." Both sides agree on that mathematical identity. The fight is about **who chooses the Log.**

  *   If the **World** chooses it (via non-ergodicity), Side A wins.
  *   If the **Agent** chooses it (via preference), Side B wins.

  To move forward, propose this specific question to the group: **"Is 'avoiding ruin' a preference or a precondition of agency?"**
  *   If it is a **precondition**, Side A is right: Rationality requires Kelly because rationality requires agency.
  *   If it is a **preference**, Side B is right: Rationality permits ruin if the agent values the upside more.

  Your hypothesis is the correct key. Turn it.
