  2.  **Deconstruct the Two Positions:**
      *   **Side A (Ergodicity Economics/Ole Peters style):** Focuses on the non-ergodic nature of wealth dynamics. The "ensemble average" (expected value) doesn't reflect the experience of a single agent over time. Rationality is defined by what happens to *you* over time, not what happens to *copies of you* in parallel universes. Therefore, maximizing geometric growth is *instrumentally rational* for survival/growth, independent of subjective risk preference.
      *   **Side B (Standard Neoclassical/Savage):** Decision theory is about satisfying axioms of preference (VNM). Utility is subjective. If you reject positive EV, you reveal risk aversion. Kelly is a *consequence* of log utility, not a *foundation* of rationality. There is no objective "correct" utility function imposed by the math of compounding.

