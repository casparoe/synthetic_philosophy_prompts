  ### What's actually going on

  You are caught in a classic ethical collision between partiality and impartiality. As a father, your moral duty is partial: you are supposed to prioritise your son's wellbeing and happiness. As a coach, specifically one hired under strict conditions, your duty is impartial: you must treat all players as equal units of merit to achieve the team's best outcome. The discomfort you feel—the sense that "weighing them up" is wrong—stems from trying to apply the logic of the public sphere (fair competition) to the private sphere (family love). Philosophical traditions often separate these domains. Bernard Williams, for instance, argued that demanding impartiality in personal relationships destroys the very integrity of those relationships. He suggested that if a man saves his wife over a stranger, he shouldn't need to justify it via utilitarian calculus. However, you aren't just in a personal relationship; you are in a public role. The problem isn't loving your son more; it's that you accepted a role that explicitly demanded you suspend that love for the sake of the group's fairness. The shape of the problem is a breach of the boundary between these two moral worlds. You imported a private privilege into a public contract. The tradition dealing with this is role ethics: the idea that specific jobs carry specific moral constraints that override general personal preferences. You agreed to those constraints to get the job. The "off" feeling is your conscience recognising that you are using public authority for private gain. While parental love is virtuous, exercising it here violates the agreed-upon rules of the game. The tradition suggests that when roles conflict, the voluntary assumption of the public role usually takes precedence because it involves trust from others who cannot opt out. The other parents trusted you to be neutral. By prioritising your son, you violated that trust, turning a community role into a vehicle for nepotism. The problem isn't the love; it's the context in which you exercised it.

  ### The strongest version of my mate's point

  Your mate's point rests on the principle of fairness as fidelity. You didn't just stumble into coaching; you negotiated entry. The league and the parents allowed you to take the job only because you promised impartiality. Without that promise, someone else might have coached, or the team might not have existed. By picking your son despite knowing another boy was better, you broke a specific contract. Your mate is arguing that moral justification requires public reasons—reasons anyone could accept regardless of their relationship to you. "Because he's mine" is a private reason, not a public one. In a meritocratic setting, private reasons are illegitimate. If you cannot justify the decision without referencing your relationship, the decision is inherently corrupt within that context. Furthermore, the lie compounds the injury. It treats the other boy's mother as a means to an end, manipulating her understanding to avoid conflict rather than respecting her enough to tell the truth. Your mate is right that owning the bias is crucial because hiding it insults the other boy's intelligence and effort. It suggests he wasn't good enough to deserve the truth, only a pacifying fiction. The strongest version of this argument is that integrity matters more than the outcome of one game. If the process is rigged, the victory is hollow, and the trust required for next season is damaged. You traded long-term community trust for short-term paternal satisfaction. The mate's point is also about respect. By lying, you denied the other boy the dignity of being selected on merit. You implicitly told him his hard work mattered less than your bloodline. In philosophy, this touches on Kantian respect: treat people as ends, not means. You used the other boy as a bench warmer to make your son feel good. Your mate is pushing you to recognise that fairness isn't just a rule; it's a form of respect for the other participants. If you can't stand by the pick without the lie, the pick was unethical in this specific context. The demand to justify it isn't bureaucratic; it's the price of holding a position of authority over other people's children.

  ### Where it runs out

  However, the tradition of strict impartiality has limits, which explains your unease. It feels "off" to weigh children because human value isn't purely functional. A coach isn't just a hiring manager; you're shaping kids. Sometimes, picking a less talented player can be justified for development or confidence. But that's not why you did it. You did it for paternal desire. The tradition of impartiality doesn't fail here; your application of it does. The tradition claims that when you accept a public role, you suspend private privileges. It doesn't say you must stop loving your son, but that you cannot let that love dictate public outcomes when you've promised otherwise. Where the tradition runs out is in acknowledging the emotional cost. It doesn't offer a comfortable way to be a father-coach. It demands a split self. But the crucial distinction is the promise. If you hadn't agreed to pick on merit, nepotism might be acceptable (as in many youth sports). But you made it a condition. The "weighing" feels wrong because you're trying to balance incommensurable things: a promise to a community vs. a desire for your son. But the promise was the gateway. The tradition doesn't cover the betrayal of the specific agreement you made to get the job. It assumes good faith. You entered in bad faith, knowing you'd struggle to be impartial. The moral failure isn't loving your son; it's accepting a role you knew you couldn't fulfil neutrally. The other boy isn't just a player; he's a stakeholder in your honesty. The tradition of impartiality protects stakeholders from the whims of authority. By ignoring it, you undermined the league's integrity. The "off" feeling is the recognition that you prioritised your private world over the public trust you voluntarily accepted. Furthermore, the tradition doesn't account for the small-town context. In a tight community, reputation is currency. Your mate's abstract philosophy hits hard here because everyone knows everyone. The lie is fragile. The tradition of impartiality is designed precisely for these situations where personal relationships threaten public function. It doesn't claim to be the whole of morality, but it claims to be the whole of *this* morality—the morality of the pitch during selection. You tried to import the morality of the living room into the morality of the dugout. The tradition runs out only if you claim the job wasn't really about fairness. But you agreed it was. So essentially the failure is yours, not the philosophy's. You cannot claim the benefit of the role (the respect, the authority) without the burden (the neutrality). The discomfort you feel is the weight of that burden sliding off your shoulders and onto someone else's kid.

  ### What I'd do

  Apologise. Do not stand by the reasons you gave; they are lies, and small towns have long memories. Go to the boy's mum privately. Say: "I made a promise to pick on merit, and I broke it. I picked my son because he's my son, not because he was better. I was wrong to lie to you about why." Do not ask for forgiveness; just really own it. Tell her you understand if she's angry. Then, decide on next season. Either step down so someone impartial can take over, or recuse yourself from selection entirely, letting an assistant decide. You cannot repair the trust if you stay in the same power dynamic without changing the rules. Your son had his day; now protect the other boy's future in the sport. Honesty hurts now, but it stops the rot. It validates the other boy's worth. It shows your son that integrity matters more than winning. It clears the air for the town. Do it before someone else exposes the lie.
