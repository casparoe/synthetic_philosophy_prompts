answer: |-
  1. Begin by securing libertarian freedom as non-negotiable, then define divine providence as non-deterministic to create the gap middle knowledge fills, showing how God's pre-creation knowledge of creaturely choices bridges that gap only if those choices have determinate truth values prior to any decree. This sequence forces the grounding objection to emerge naturally as the question of what makes those pre-volitional truths true without collapsing back into determinism or divine ignorance.

  2. Keep the non-existent sibling example rather than the Peter-denies-Christ case because it isolates the truth value from any actual historical outcome, forcing the room to confront whether a counterfactual about a merely possible person can be true before God decides to create them. Ensure the scenario specifies a concrete choice situation without detailing the agent's character so tightly that the choice appears necessitated by their nature rather than freely enacted.

  3. Distinguish middle knowledge from simple foreknowledge immediately to block the "Thomists have this too" error, which is the single misconception that will derail the session if you let them think the counterfactuals depend on God's decree. Save the "God loses control" and "evil" worries for the end, noting they vanish if the grounding objection succeeds, while preemptively clarifying that truthmaker concerns are ontological, not merely linguistic, and that this does not make God passive.

  4. Have them construct a counterfactual about a biblical figure's unchosen action and demand they point to a specific fact in reality that makes it true without referencing God's will or the agent's actual history. If they can only cite God's knowledge or the agent's general character, they have inadvertently conceded the grounding objection.

  5. Cut the *De Auxiliis* history and the temporal vs. logical order debate, but do not omit the distinction between God's knowledge of possibilities versus actualities or the system collapses into open theism or determinism. Avoid surveying contemporary replies like Molinist primitivism or anti-libertarianism, as these distract from the core metaphysical tension you want them to feel.
