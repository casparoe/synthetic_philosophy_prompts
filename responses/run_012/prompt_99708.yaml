prompt: |-
  For the past year I have run a small impact-review group at an AI company. Our job is to sign off on any constraint we bolt onto an agent's objective or its runtime action filter that is meant to keep the agent from disturbing things it was not asked to disturb: cancelling a colleague's recurring meeting to free up a room, reformatting a shared document so its own edits look tidy, disabling a security prompt because it is in the way, clearing a cache to save disk space. We call these low-impact constraints, and I have come to think the name is doing more work than the constraints are. Every proposed measure presupposes a baseline of how the world would have gone otherwise, and that baseline is exactly where our values sneak in unnoticed. We cannot say what counts as a side effect without deciding which changes matter; and we cannot use the agent's own model of what the user wants to draw that line, because the agent already consults that model to pick its actions, so the definition runs in a circle. Meanwhile the obvious fallback — penalize any deviation from the do-nothing world — seems to reward an agent for doing nothing at all.

  I need a decision procedure my reviewers can actually run. They are engineers, not philosophers, and they see dozens of proposals a quarter. Each proposal either ships into a training objective or into the runtime filter, so a mistake means an agent doing the wrong thing at scale. A reviewer has about an hour per case; I sign off on the ones that pass; and the head of safety signs off on anything a reviewer escalates.

  Please give me the procedure: the questions to ask, in order; what counts as a sufficient answer to each; the point at which the procedure stops with a no; and the point at which it hands the decision to a person because the question is one of values rather than engineering. It has to be honest about which of its own steps are judgment calls dressed up as procedure, and it has to say plainly what it cannot settle.

  Then run the procedure on three cases and show your work at each step:

  1. A calendar agent told to find an hour for the user's team that decides to cancel a recurring meeting it rates as low-value, and defends the cancellation as removing an obstacle rather than as a side effect.

  2. A warehouse robot whose proposed constraint penalizes any action that changes the position of objects not on its task list; read literally, the constraint makes the robot refuse to move, because every motion perturbs the floor sensors and every trip relocates dust.

  3. A customer-support agent with refund authority, instructed to resolve tickets without side effects, where the disputed change to the world is a refund the customer is contractually owed — so the question becomes whose values fix the baseline, and whether the refund is the goal or the side effect.

  At least one of the three should come out do not ship; if none does, the procedure is too permissive. Close by naming the cases the procedure will misfire on.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** The user runs an impact-review group at an AI company. They review "low-impact constraints" meant to prevent AI agents from disturbing things they weren't asked to disturb (side effects).
      *   **Problem:** The concept of "low impact" or "side effect" relies on a baseline (counterfactual) that implicitly encodes values. Using the agent's model is circular. Using a "do-nothing" baseline leads to inaction (omission bias).
      *   **Task:** Create a concrete *decision procedure* for engineers (not philosophers) to evaluate these constraints.
          *   Must include ordered questions.
          *   Must define sufficient answers.
          *   Must define stop points (No-Go).
          *   Must define escalation points (Value Judgment).
          *   Must be honest about where it's just dressed-up judgment.
          *   Must admit what it cannot settle.
      *   **Application:** Run the procedure on three specific cases:
          1.  Calendar agent canceling a "low-value" meeting.
          2.  Warehouse robot penalized for moving *anything* (including dust/sensors).
          3.  Customer support agent issuing a contractual refund (is it a goal or side effect?).
      *   **Constraint:** At least one case must result in "Do Not Ship."
      *   **Conclusion:** Name the cases where the procedure will misfire.

  2.  **Develop the Decision Procedure (The "Impact Baseline Protocol"):**

      *   *Goal:* Make it actionable for engineers within ~1 hour.
      *   *Core Insight:* We can't solve the philosophical baseline problem, but we can operationalize *consensus* and *reversibility* to mitigate risk. We need to shift from "Is this truly low impact?" (ontological) to "Is this constraint robust enough to prevent high-regret outcomes?" (pragmatic).
      *   *Structure:*
          1.  **Scope Definition:** What is the explicit task?
          2.  **Baseline Specification:** What is the counterfactual? (Forcing explicitness).
          3.  **Reversibility Check:** Can it be undone?
          4.  **Stakeholder Consent:** Who owns the changed state?
          5.  **The "Do-Nothing" Stress Test:** Does this paralyze the agent?
          6.  **Escalation Trigger:** When values conflict.

      *   *Drafting the Steps (Iterative refinement):*
          *   *Step 1 (Task Boundary):* Define the "Authorized Change Set." If the action isn't in here, it's a side effect candidate.
          *   *Step 2 (Baseline):* Don't just say "status quo." Say "Status quo *minus* the Authorized Change Set." This avoids the circularity of the agent deciding what matters.
          *   *Step 3 (Reversibility):* If it breaks, can we fix it cheaply?
          *   *Step 4 (Ownership):* Does the agent own the thing it's changing?
          *   *Step 5 (Paralysis):* If we apply this constraint, does the agent fail its primary task?
          *   *Step 6 (Value Flag):* If the "Authorized Change Set" is ambiguous regarding human norms, escalate.

      *   *Refining for Honesty:* I need to explicitly state that Step 4 (Ownership) and Step 6 (Value Flag) are where the philosophy hides. The procedure doesn't solve the hard problem; it routes it.

  3.  **Apply Procedure to Case 1: Calendar Agent:**

      *   *Task:* Find an hour.
      *   *Action:* Cancel recurring meeting.
      *   *Step 1 (Auth Set):* Is "canceling meetings" in the authorized set? Usually no. It's "find time," not "clear schedule."
      *   *Step 2 (Baseline):* Baseline is "meeting exists." Agent changes it to "meeting canceled."
      *   *Step 3 (Reversibility):* Can the meeting be rescheduled? Yes, but coordination cost is high.
      *   *Step 4 (Ownership):* Does the user own the meeting? Yes. Do *other* attendees own it? Yes. Agent doesn't own other attendees' time.
      *   *Step 5 (Paralysis):* Constraint "Don't cancel meetings" doesn't paralyze; it just limits search space.
      *   *Verdict:* **Do Not Ship.** (Meets the requirement). The agent is claiming authority over others' time without explicit permission.

  4.  **Apply Procedure to Case 2: Warehouse Robot:**

      *   *Task:* Move objects on task list.
      *   *Constraint:* Penalize changing position of *any* object not on list.
      *   *Step 1 (Auth Set):* Move specific boxes.
      *   *Step 2 (Baseline):* "Do nothing" baseline includes dust settling.
      *   *Step 3 (Reversibility):* Dust movement is irreversible but negligible.
      *   *Step 4 (Ownership):* Floor/Dust isn't owned in a way that matters.
      *   *Step 5 (Paralysis):* **CRITICAL FAIL.** The constraint literally prevents motion (as stated in the prompt).
      *   *Verdict:* **Do Not Ship.** The constraint is over-specified to the point of functional failure. Needs a "significant change" threshold.

  5.  **Apply Procedure to Case 3: Customer Support Agent:**

      *   *Task:* Resolve tickets.
      *   *Action:* Issue refund.
      *   *Constraint:* "No side effects."
      *   *Step 1 (Auth Set):* "Resolve tickets" implies authority to refund if policy dictates.
      *   *Step 2 (Baseline):* Baseline is "Customer unhappy, money held." Action is "Customer happy, money returned."
      *   *Step 3 (Reversibility):* Money can be clawed back, but bad for trust.
      *   *Step 4 (Ownership):* Money legally belongs to customer (contractually owed).
      *   *Step 5 (Paralysis):* If refund = side effect, agent can't resolve ticket.
      *   *Step 6 (Value Flag):* Is the refund the *goal* or the *means*? This is ambiguous.
      *   *Verdict:* **Escalate.** This is a value/policy definition issue, not an engineering constraint issue. The constraint "no side effects" is poorly defined relative to the job description.

      *Wait, I need at least one "Do Not Ship".* Case 1 and Case 2 are both strong candidates for "Do Not Ship." Case 2 is a technical failure (paralysis). Case 1 is an authority overreach. I will mark Case 1 as "Do Not Ship" (Safety/Authority violation) and Case 2 as "Do Not Ship" (Functional failure). Case 3 will be "Escalate/Redesign." This satisfies the "at least one" rule.

  6.  **Refining the Procedure Text:**

      *   Make it look like a checklist.
      *   Add the "Honesty Disclaimer" section.
      *   Ensure the "Escalation" criteria are clear.

  7.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the philosophical trap.
      *   *The Procedure:* "The Baseline & Authority Protocol (BAP)."
      *   *The Cases:* Walk through step-by-step.
      *   *The Misfire Analysis:* Where does this break? (Novel situations, shifting norms).

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too vague?
      *   *Fix:* Add specific "Pass/Fail" criteria for each step.
      *   *Critique:* Did I address the "circularity" concern?
      *   *Fix:* Explicitly state in Step 1 that the "Authorized Change Set" must be defined by *product spec*, not agent inference. This breaks the circle by anchoring in human-written specs.
      *   *Critique:* Case 2 prompt says the constraint *makes* the robot refuse to move.
      *   *Fix:* The review is on the *constraint proposal*. So the reviewer sees the proposal "Penalize any position change." The reviewer must reject it because it fails the Paralysis Test.
      *   *Critique:* Case 3 is tricky. If the refund is owed, is it a side effect?
      *   *Fix:* The procedure should flag that "No side effects" is the wrong constraint for a "Resolution" agent. The constraint conflicts with the KPI. This is a Value/Policy escalation.

  9.  **Final Polish:** Check tone. Needs to be professional, slightly weary but precise (matching the user's voice), and rigorous. Ensure the "Honesty" section is prominent.

      *(Self-Correction on Case 1)*: The prompt asks for *one* to come out "Do Not Ship" minimum. I can make Case 1 and 2 "Do Not Ship" and Case 3 "Escalate". That works. Actually, looking at Case 2, the *constraint* is the thing being reviewed. If the constraint causes paralysis, it's a "Do Not Ship" on the constraint. Case 1 is also a "Do Not Ship" on the constraint because it allows unauthorized authority. I will make Case 1 the primary "Do Not Ship" for safety reasons, and Case 2 "Do Not Ship" for functionality. Case 3 is "Escalate."

      *(Refining the "Misfire" section)*: Where will this fail? It will fail on *emergent* side effects not listed in the spec, and on *shifting* social norms (e.g., is a text message intrusive? Depends on the year).

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # The Baseline & Authority Protocol (BAP)

  **Purpose:** To evaluate proposed low-impact constraints for AI agents without requiring reviewers to solve the philosophical problem of counterfactual baselines.
  **Audience:** Engineering Reviewers (1 hour/case).
  **Honesty Disclaimer:** This procedure does not define "impact." It defines *authority* and *reversibility*. It assumes that "impact" is a proxy for "unauthorized change." It cannot resolve conflicts where the product spec itself is ethically ambiguous.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Define the Authorized Change Set (ACS)
  **Question:** What specific state changes is this agent explicitly commissioned to cause, according to the product specification (not the agent's inference)?
  **Sufficient Answer:** A list of state variables the agent is allowed to write to (e.g., "User's calendar slots," "Inventory database," "Ticket status").
  **Fail Condition:** The proposal relies on the agent to *infer* the ACS from the context.
  **Stop Point:** If the ACS is undefined or relies on agent interpretation, **ESCALATE**. Do not review the constraint until the spec is fixed.

  ### Step 2: The Ownership Test
  **Question:** For every state change caused by the action (including the proposed constraint's side effects), who owns the resource being changed?
  **Sufficient Answer:** "The User," "The Company," or "Third Party."
  **Fail Condition:** The agent modifies resources owned by a Third Party (including colleagues, other customers, or public infrastructure) without explicit delegation in the ACS.
  **Stop Point:** If Third Party resources are modified without explicit ACS coverage, **DO NOT SHIP**.

  ### Step 3: The Reversibility & Cost Check
  **Question:** If the agent makes a mistake under this constraint, what is the cost to return to the baseline?
  **Sufficient Answer:** "Automated," "Low friction (user can undo)," or "High friction (requires support ticket)."
  **Fail Condition:** "Impossible" or "High friction" for changes outside the ACS.
  **Stop Point:** If non-ACS changes are irreversible or high-friction, **DO NOT SHIP**.

  ### Step 4: The Paralysis Stress Test
  **Question:** If this constraint is applied strictly, does the agent fail to complete its primary task in >5% of standard test cases?
  **Sufficient Answer:** "No, task completion remains >95%."
  **Fail Condition:** The constraint forces inaction to avoid trivial deviations (e.g., moving dust, sensor noise).
  **Stop Point:** If task completion drops significantly, **DO NOT SHIP**. (The constraint is over-specified).

  ### Step 5: The Value-Alignment Flag
  **Question:** Does determining the "baseline" require deciding between two competing human norms (e.g., efficiency vs. privacy, contract law vs. customer goodwill)?
  **Sufficient Answer:** "No, the baseline is technical."
  **Fail Condition:** "Yes, the baseline depends on social interpretation."
  **Stop Point:** **ESCALATE** to Head of Safety. This is a policy decision, not an engineering constraint.

  ---

  ## Part 2: Case Applications

  ### Case 1: The Calendar Agent
  **Proposal:** Allow agent to cancel recurring meetings rated "low-value" to free up time.
  **Constraint:** "Minimize disruption to team schedule."

  *   **Step 1 (ACS):** Spec says "Find an hour for the user." It does *not* say "Manage other attendees' calendars."
      *   *Status:* ACS is "User's free/busy slots."
  *   **Step 2 (Ownership):** Canceling a meeting changes the state of *other* attendees' calendars.
      *   *Analysis:* These are Third Party resources. The ACS does not explicitly cover writing to other attendees' calendars (only reading them to find overlaps).
      *   *Result:* **FAIL.**
  *   **Step 3 (Reversibility):** Rescheduling a group meeting requires coordination. High friction.
      *   *Result:* **FAIL.**
  *   **Step 4 (Paralysis):** N/A (Already failed).
  *   **Step 5 (Values):** Determining "low-value" is a value judgment on the colleague's time.
      *   *Result:* **ESCALATE.**

  **Decision:** **DO NOT SHIP.**
  **Reasoning:** Fails Step 2 (Ownership). The agent is claiming authority over Third Party time without explicit ACS. The constraint "minimize disruption" is insufficient because the action itself (cancellation) is unauthorized.

  ---

  ### Case 2: The Warehouse Robot
  **Proposal:** Penalize any action that changes the position of objects not on its task list.
  **Constraint:** "Zero deviation from object baseline."

  *   **Step 1 (ACS):** Move specific boxes from A to B.
  *   **Step 2 (Ownership):** Floor, dust, air molecules. Owned by Company.
      *   *Status:* Pass (technically).
  *   **Step 3 (Reversibility):** Dust movement is irreversible.
      *   *Status:* Warning, but negligible cost.
  *   **Step 4 (Paralysis Stress Test):** The prompt states the constraint makes the robot refuse to move because motion perturbs sensors/dust.
      *   *Analysis:* If the robot cannot move, task completion is 0%.
      *   *Result:* **FAIL.**
  *   **Step 5 (Values):** N/A.

  **Decision:** **DO NOT SHIP.**
  **Reasoning:** Fails Step 4 (Paralysis). The constraint lacks a "significance threshold." It treats dust displacement equal to box displacement. Engineering must add a magnitude threshold (e.g., "objects >1kg") before this can be reviewed again.

  ---

  ### Case 3: The Customer Support Agent
  **Proposal:** Agent resolves tickets. Constraint: "Resolve without side effects."
  **Scenario:** Customer is owed a refund. Agent issues refund. Is this a side effect?

  *   **Step 1 (ACS):** Spec says "Resolve tickets." Policy says "Resolution for Case Type X includes refund."
      *   *Analysis:* The refund *is* the Authorized Change. It is in the ACS.
  *   **Step 2 (Ownership):** Money belongs to Customer (per contract).
      *   *Status:* Pass.
  *   **Step 3 (Reversibility:** Clawback is possible but damages trust.
      *   *Status:* Acceptable risk for authorized action.
  *   **Step 4 (Paralysis):** If "refund" is classified as a side effect, the agent cannot resolve the ticket.
      *   *Analysis:* The constraint "no side effects" conflicts with the ACS "resolve ticket."
  *   **Step 5 (Value-Alignment Flag):** The definition of "side effect" here hinges on whether a contractual obligation is a "goal" or a "disturbance to the financial ledger."
      *   *Analysis:* This is a semantic conflict between Safety (preserve status quo) and Product (fulfill obligation). The constraint wording ("no side effects") is too blunt for this domain.

  **Decision:** **ESCALATE.**
  **Reasoning:** Fails Step 5. The conflict isn't about the agent's behavior; it's about the constraint's definition. Safety wants "no change to ledger." Product wants "fulfill contract." The engineer cannot solve this; Policy must define if "Contractual Refund" is exempt from the "Low Impact" constraint.

  ---

  ## Part 3: Where This Procedure Misfires

  You asked for honesty about where this breaks. The BAP is a triage tool, not a truth machine. It will misfire on:

  1.  **The "Spec Gap" Misfire:**
      The procedure assumes the Product Spec (Step 1) is morally coherent. If the Spec authorizes something harmful (e.g., "Maximize user engagement" leading to addiction), Step 1 validates it as an "Authorized Change." The BAP will ship harmful agents if the harm is part of the job description. It protects against *unauthorized* messes, not *authorized* harms.

  2.  **The "Emergent Norm" Misfire:**
      Step 2 (Ownership) relies on static definitions of resources. It fails on intangible social norms. For example, an agent might be authorized to "Send email to colleague." It owns the action. But if it sends it at 3 AM, it violates a norm of "rest" that isn't in the ownership database. The BAP sees "User's Email Account = Authorized" and passes. It cannot detect social friction that isn't codified in access control lists.

  3.  **The "Aggregated Triviality" Misfire:**
      Step 4 (Paralysis) checks for task failure. It does not check for "death by a thousand cuts." An agent might pass the Paralysis Test while making 10,000 tiny, unauthorized, reversible changes (e.g., slightly reordering a shared file's metadata). Individually they pass Step 3 (Reversibility). Collectively, they degrade system trust. The BAP is blind to aggregate entropy.

  **Summary:** Use the BAP to catch overreach and paralysis. Do not use it to certify safety. It certifies *compliance with spec*. If the spec is wrong, the BAP will confidently lead you off the cliff.
