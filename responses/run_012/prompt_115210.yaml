  *   **The "Prose Mask":** Her writing is very smooth, which makes the error in (a) look like a nuanced insight and the error in (c) look like a theoretical stance rather than a mistake. Do not let the flow of the paragraph in (a) hide the fact that she defined rigidity backwards in the second half of the answer.
  *   **The Stats Cohort:** Be prepared for the two stats students to flag part (c) immediately. Commutativity failure is a well-known property of JC in probability theory. Grading this as "True" without qualification undermines the technical credibility of the seminar.
