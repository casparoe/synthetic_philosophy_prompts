  10. **Final Polish:** Ensure the distinction between "Material Constitution" (metaphysics) and "Work Identity" (institutional) is sharp, as that's the crux of the user's reporting problem. Emphasize that a theory of *matter* cannot solve a problem of *value/meaning* without importing non-material criteria.

