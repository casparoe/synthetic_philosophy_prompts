answer: |-
  ### Specification for a Theory of Material Constitution in Curatorial and Legal Contexts

  **Standard of Adequacy:** The theory must generate binary verdicts (Yes/No) on questions of persistence and identity in scenarios where financial liability, custodial duty, or conservation intervention depends on the answer. It cannot return "indeterminate."

  Below are the functional requirements derived from your five composite cases. Each is marked as **Non-Negotiable** (failure here renders the theory useless for the stated standard) or **House Rule** (adoption depends on specific legal/curatorial frameworks).

  ---

  #### 1. The Requirement of Functional Continuity (The Topiary Horse)
  *   **The Demand:** The theory must allow an object to retain its identity despite total material replacement, provided functional and structural continuity is maintained by a specific process (biological growth/grafing).
  *   **The Case:** The topiary horse has no original cells. A theory requiring strict material continuity (e.g., "Identity = Same Atoms") verdicts that the horse died years ago. This contradicts biological fact and insurance practice (which covers the *living plant*, not the original biomass).
  *   **Status:** **Non-Negotiable.**
  *   **Why:** To rule otherwise is to declare that no biological artifact can persist. This contradicts the science of metabolism and the practice of insuring living collections.

  #### 2. The Requirement of Entropic Tolerance (The Salt Bust)
  *   **The Demand:** The theory must permit identity persistence through gradual, intended material loss without a specific threshold of "essential mass."
  *   **The Case:** The salt bust loses mass daily. A theory requiring constant mass or a "critical core" verdicts that the bust ceases to exist arbitrarily (e.g., when it drops below 50% mass). The artist's intent stipulates persistence until *total* dissolution.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** A theory that imposes a sharp metaphysical boundary where the artist and physicist see a continuous process forces the insurer to pay out on a "total loss" while the object is visibly still there. It contradicts the physical reality of sublimation and the contractual reality of the artist's stipulation.

  #### 3. The Requirement of Causal Independence from Material Overlap (The Re-cast Bronze)
  *   **The Demand:** The theory must distinguish between the identity of the *physical particular* and the identity of the *work instance* based on causal history, not material overlap.
  *   **The Case:** The second bronze shares no atoms with the first but descends from its mold. A strict materialist theory verdicts they are unrelated objects. A pure historical theory verdicts they are numerically identical.
  *   **Status:** **House Rule (with a caveat).**
  *   **Why:** This is the pivot point. For *insurance*, they are usually distinct physical particulars (two payout events). For *copyright/attribution*, they are the same work. The theory must be able to *accommodate* this split, even if it doesn't resolve it. A theory that collapses this distinction (saying they are simply "The Same") fails the insurance spec. A theory that says they are "Totally Different" fails the art historical spec.
  *   **Constraint:** The theory must allow for **Sortal-Relativity**: Identity relative to the concept "Physical Object" vs. "Artwork Instance."

  #### 4. The Requirement of Pre-Existing Matter Neutrality (The Pre-Worked Marble)
  *   **The Demand:** The theory cannot require that the matter of an object be "created" by the artist to count as the matter *of* the object.
  *   **The Case:** The marble cylinder existed before the sculptor touched it. A theory requiring "Creation of Matter" verdicts that the statue is not constituted by the marble, but by the "shaping event."
  *   **Status:** **Non-Negotiable.**
  *   **Why:** Conservation decisions turn on the stability of the *marble*, not the history of the *cut*. If the theory denies the marble constitutes the statue because the quarry sawed it first, conservation science loses its object of study. The theory must allow constitution without authorship of the substrate.

  #### 5. The Requirement of Accidental Integration (The Embedded Coin)
  *   **The Demand:** The theory must distinguish between parts that are constitutive and parts that are merely spatially coincident, based on integration rather than mere contact.
  *   **The Case:** The coin was unknown to the artist. If removed, is the work damaged? A theory of "Simple Fusion" (anything touching becomes part) verdicts that removing the coin mutilates the work. A theory of "Intentional Integration" verdicts it is debris.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** Curatorial practice relies on the ability to de-accession or separate accidental accretions (dirt, glue, foreign inserts) without "destroying" the object. A theory that cannot distinguish *component* from *contaminant* makes conservation impossible.

  ---

  ### The Competence Boundary: The Identity/Work Slide

  You asked whether the slide between "numerical identity" (metaphysics) and "same work" (legal/curatorial) is a confusion or a genuine question.

  **Verdict:** It is a **Category Error** that the theory must explicitly police, not solve.

  A theory of *material constitution* describes the relationship between physical stuff and physical objects. It is **not competent** to settle questions of *Artwork Identity*.
  *   **Material Constitution** answers: "Is this physical particular the same physical particular as that one?" (Governs insurance of the *object*, custody, physical risk).
  *   **Institutional/Intentional Theory** answers: "Is this instance an instance of the same work?" (Governs copyright, attribution, exhibition value).

  **Why this matters for your reporting:**
  If your sources are using material constitution to decide copyright (The Bronze Case), they are making a metaphysical error. If they are using copyright logic to decide physical insurance payouts (The Bronze Case), they are making a legal error.
  *   **The Theory's Limit:** A material constitution theory *cannot* validate the "Work" status of the re-cast bronze without importing non-material criteria (intent, history, convention). If the theory attempts to settle the "Work" question using only material criteria, it fails Requirement 3.
  *   **The Slide:** The slide is a confusion *unless* the theory explicitly defines two layers of identity: **Constitutional Identity** (matter/object) and **Functional/Institutional Identity** (work/instance). If the theory treats these as one, it will generate contradictory verdicts in the Bronze and Salt cases.

  ---

  ### Incompatible Requirements (The Trade-Offs)

  Here is why the disputes never close. The specification demands mutually exclusive features.

  **1. The Conflict: Decidability vs. Descriptive Accuracy (The Sorites Problem)**
  *   **Requirement A (Decidability):** To license verdicts for insurance/money, the theory must provide sharp boundaries. (The Salt Bust is either the same object or it isn't; there is no "51% the same object").
  *   **Requirement B (Descriptive Accuracy):** To respect the science of erosion and biology (Salt Bust, Topiary), the theory must acknowledge vagueness. Physical processes are continuous; identity conditions based on them are inherently fuzzy.
  *   **The Incompatibility:** You cannot have a theory that accurately describes continuous physical change *and* provides binary legal verdicts without imposing an arbitrary cutoff.
      *   If you choose **Decidability**, you must stipulate an arbitrary threshold (e.g., "50% mass loss = new object"). This violates Requirement 2 (Entropic Tolerance) and contradicts the artist's intent.
      *   If you choose **Accuracy**, you must admit ontic vagueness ("It is indeterminate if this is the bust"). This violates the Standard of Adequacy (cannot license verdicts).

  **2. The Conflict: Intentionality vs. Physicalism**
  *   **Requirement A:** Respect Artist Intent (Salt Bust, Embedded Coin).
  *   **Requirement B:** Respect Physical Facts (Atoms lost, Coin is foreign matter).
  *   **The Incompatibility:** In the Salt Bust, the Artist Intent says "Same Object." The Physical Facts say "Different Aggregate of Atoms daily." A theory that privileges Intent becomes non-physical (metaphysically spooky). A theory that privileges Physics becomes non-curatorial (ignores the work's definition).

  ---

  ### The Single Requirement That Rules Out The Most Candidates

  **The Requirement of Non-Vagueness (The Decidability Constraint).**

  *   **The Requirement:** *The theory must yield a determinate truth value (True/False) for identity statements at every moment in time, without recourse to "indeterminacy" or "degree."*
  *   **Why it rules out candidates:**
      *   **Standard Metaphysical Views:** Most sophisticated theories of material constitution (e.g., Four-Dimensionalism, Dominant Sorts, Ontic Vagueness views) explicitly accept that identity can be vague or indeterminate during transitional phases (like the sublimation of the salt or the grafting of the topiary). They argue reality itself is fuzzy.
      *   **The Spec:** Insurance contracts and custody laws *cannot* be fuzzy. They require a switch: Pay/Don't Pay, Return/Keep.
      *   **The Result:** Any metaphysical theory that embraces vagueness as a feature of the world is disqualified by the *practical standard of adequacy*, even if it is philosophically superior. Conversely, any theory that imposes sharp lines (to satisfy the spec) is philosophically suspect because it contradicts the continuous nature of the physical processes described in the cases.

  **Summary for your Feature:**
  The disputes never close because the stakeholders are demanding a **metaphysical certainty** (Is this *the* object?) to solve a **practical problem** (Who pays?), but the physical reality of the objects (erosion, growth, replacement) denies the possibility of that certainty. The theory required to settle the money *must* lie about the matter, or the theory that tells the truth about the matter *cannot* settle the money.
