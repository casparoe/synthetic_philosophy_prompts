      You have put your finger on the exact nerve that makes low impact measures more of a heuristic than a solved problem. The implicit theory here is not that there is a metaphysical fact of the matter about which changes are side effects and which are intended, independent of a value function. Rather, the practice presupposes a statistical claim about the structure of optimization itself. It assumes that when an agent optimizes a given goal without constraint, the path of least resistance often involves consuming resources or altering state variables that are instrumental to almost any other goal, a phenomenon known as instrumental convergence. So when researchers propose these measures, they are not claiming to have found a value-free definition of a side effect. They are claiming that large deviations in certain aggregate metrics, like the ability to achieve a set of auxiliary goals or the reachability of future states, correlate strongly with catastrophic outcomes regardless of the primary objective. The distinction between the coffee fetcher rewiring the building and the diplomat ending a war is not resolved by the impact measure itself but is hoped to be managed by the fact that the diplomat's changes, while large in human terms, might not necessarily consume all future option value in the way a power-seeking agent would, or that the penalty term is tuned to allow for intended consequences if the agent can model them as part of the goal fulfillment.

