          2.  Tipping (insulting, wages included).
          3.  Jaywalking (pedestrians cross against signal, drivers expect/depend on it).
      *   **Core Task:** Provide a framework for deciding *which* norms to obey, distinguishing between:
          1.  Coordination solutions (efficiency).
          2.  Courtesy (social glue, breach wounds).
          3.  Moral weight (harm/worse off).
      *   **Application:** Apply this framework to the three specific norms.
      *   **Conclusion:** A usable rule for the students.
      *   **Tone:** Speech-like (not a lecture on social ontology), 6-8 minutes (approx. 900-1200 words spoken at a moderate pace), respectful of the returning students' experience, reassuring to the first-timers.
      *   **Constraint:** Do *not* just say "do as the locals do." Give them agency and ethical reasoning.

  2.  **Determine the Structure:**
      *   **Opening:** Acknowledge the mix of experience in the room. Validate the anxiety of the newbies and the expertise of the returnees. Set the stage: this isn't about rules, it's about judgment.
      *   **The Framework (The "Lens"):** Introduce the three categories (Coordination, Courtesy, Morality) simply, without academic jargon.
      *   **Application (The Three Norms):**
          *   Tram Boarding -> Coordination/Courtesy hybrid.
          *   Tipping -> Courtesy/Economic Norm (breach wounds/insults).
          *   Jaywalking -> Safety/Morality (but complex).
      *   **The "Why Obey?" Question:** Address why visitors should follow non-moral norms (respect, integration, not breaking the flow).
      *   **The Closing Rule:** A actionable heuristic.
      *   **Sign-off:** Encouraging finish.

  3.  **Drafting - Section by Section:**

