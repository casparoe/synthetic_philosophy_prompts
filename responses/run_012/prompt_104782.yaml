answer: |-
  Good morning. Looking around this room, I see two distinct groups. On one side, I see the returnees. You've got that look—the slight smirk that says, "I know how this goes, just give me the visa forms." You've lived abroad before. You know the disorientation, but you also know the rhythm of finding your feet. You might be bristling a bit at the idea of a pre-departure lecture on etiquette. You know rules are made to be navigated.

  On the other side, I see the first-timers. You look a little tired. You've been reading the blogs, checking the packing lists, and worrying about the invisible rulebook you haven't read yet. You are frightened of getting it wrong, of sticking out, of accidentally offending someone on day one.

  To the returnees: I am not going to tell you to be perfect. To the first-timers: I am not going to tell you that perfection is required.

  The standard advice for study abroad is "When in Rome, do as the Romans do." It's catchy, but it's intellectually lazy. It asks you to surrender your judgment. It suggests that your only job is mimicry. I want to offer you something better than mimicry. I want to offer you a way to think about *why* people do what they do, so you can decide not just what to copy, but what to respect.

  In the city where you'll be living, three everyday conventions will shock you. They differ sharply from what you know. You will be tempted to judge them immediately. Instead, I want you to sort them into three buckets.

  The first bucket is **Coordination**. These are rules we invent just so we don't crash into each other. It doesn't matter which side of the road we drive on, as long as we all pick the same one. The value is in the agreement, not the specific action.

  The second bucket is **Courtesy**. These are norms that hold the social fabric together. Breaching them doesn't necessarily cause physical harm, but it wounds dignity. It signals disrespect. It says, "I am not one of you, and I don't care to be."

  The third bucket is **Morality**. These are conventions where someone ends up genuinely worse off if the rule lapses. Someone gets hurt. Someone loses rights. Someone is exploited.

  Your job is to figure out which bucket a behavior falls into. Let's apply this to the three shocks waiting for you.

  First, the tram. At home, you queue. You wait in a neat line. In this city, nobody queues. Passengers drift into a loose crowd. Boarding happens in whatever order the driver's glance selects. It looks like chaos to you. It feels aggressive.

  Where does this fall? It is primarily **Coordination**, with a layer of **Courtesy**. The system relies on flow, not order. If you insist on forming a queue, you aren't being polite; you are obstructing the mechanism. You are breaking the coordination. However, notice the unspoken deference to the elderly and those holding children. That is the courtesy layer. If you shove past a grandmother to grab a seat, you haven't just broken a flow; you've wounded the community's sense of care. You owe obedience to the tram convention not because it is morally superior to queuing, but because refusing to coordinate makes the system fail for everyone.

  Second, tipping. At home, tipping is a reward for service. There, it is taken as faintly insulting. Wages are set on the assumption that no one tips. To leave money on the table implies the worker is a beggar, or that the employer has failed.

  This falls into **Courtesy**, bordering on **Morality**. If you tip, you aren't just being "generous." You are rejecting their social contract. You are signaling that you view their labor through your lens, not theirs. It wounds the dignity of the professional relationship. You owe obedience to this norm because to violate it is to insult the person you are paying. It turns a transaction into a charity case.

  Third, the crosswalks. At home, you wait for the white walker. There, pedestrians cross against the signal as a matter of course. Drivers expect it. They depend on it. Traffic flows on the assumption that you will step out when there is a gap, not when the light changes.

  This is the hardest one. It feels like **Morality** because it involves safety. But locally, it functions as **Coordination**. The drivers are watching for *you*, not the light. If you stand rigidly at a red light when there is no traffic, you confuse the drivers. You create uncertainty. In this specific context, following the "law" of the land might actually be more dangerous than following the "law" of the street. You owe obedience to this convention because your refusal to participate in the local flow creates a hazard for yourself and others.

  Now, I know the question burning in the room. "If these aren't moral requirements—if the tram isn't about justice, and the tipping isn't about law—why should I, a visitor, be bound by them? Why can't I just be myself?"

  Because you are not just a tourist; you are a temporary resident. You are entering a living ecosystem. When you break a coordination norm, you create friction. When you break a courtesy norm, you create distance. You can be yourself without being an obstacle. There is a difference between holding onto your values and imposing your habits.

  So, here is the rule. I want you to write this down.

  **"Adopt the local convention unless it causes harm or humiliates you."**

  If the behavior is just a different way of organizing the day—like the tram—join in. Keep the flow smooth.
  If the behavior is about dignity—like the tipping—respect their definition of respect, not yours.
  But, if a convention asks you to do something that harms another person, or something that humiliates your own core dignity, you have permission to pause. You have permission to opt out.

  For the returnees: You know that the first week is a fog. Use this rule to clear it.
  For the first-timers: You will make mistakes. You will tip when you shouldn't. You will queue when you should drift. Forgive yourself. The people you meet will forgive you, provided they see you are trying to understand the *why*, not just the *what*.

  Go there to learn, not to judge. Go there to join the flow, not to freeze it. And when in doubt, watch the locals, ask yourself which bucket they are filling, and then step forward.

  Have a safe journey.
