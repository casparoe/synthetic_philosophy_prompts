      *   *The "Visitor" Obligation:* Why follow the non-moral ones? Because you are a guest in a living organism. Disrupting the flow is selfish.
      *   *The Rule:* "Watch the flow, feel the friction, check the harm." Or something punchier. "Observe the mechanism, respect the dignity, prevent the harm." Let's refine this.
