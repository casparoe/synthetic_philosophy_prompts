answer: |-
  You have put your finger on the central nerve of the philosophy of economics. You are describing a move that is ubiquitous, widely criticized, yet structurally embedded in how mainstream economics is taught and communicated.

  There is no single, universally agreed-upon noun for this specific *switching* maneuver, but there are three ways to carve it up, depending on whether you are looking at it rhetorically, methodologically, or historically.

  Here is the breakdown of the territory, the names available, and the state of the debate.

  ### 1. The Rhetorical Name: The Motte-and-Bailey Doctrine
  If you want a name for the *switching* behavior specifically (defending the model as a fiction when attacked, but asserting it as fact when preaching), the closest established term is the **Motte-and-Bailey fallacy**.

  *   **The Bailey (the desirable, bold claim):** "Rent control causes shortages." (Stated as a fact about the world).
  *   **The Motte (the defensible, modest claim):** "This is just a simplified model to help us think." (Retreated to when the assumptions are challenged).
  *   **The Move:** The economist occupies the Bailey when making policy recommendations but retreats to the Motte when methodological critics point out that real humans aren't rational agents.

  While this term comes from general argumentation theory (coined by Nicholas Shackel, 2005), it has been widely adopted in critiques of economic methodology to describe exactly the oscillation you see.

  ### 2. The Methodological Name: Failure of De-idealization
  In the philosophy of science (specifically the work of **Nancy Cartwright** and **Uskali Mäki**), this is described as a failure of **de-idealization** or a broken **model-to-world inference**.

  Philosophers distinguish between two types of assumptions:
  1.  **Negligibility Assumptions:** "Friction is so small we can ignore it." (e.g., a ball bearing falling).
  2.  **Heuristic/Isoolation Assumptions:** "Let's assume friction is zero so we can see the effect of gravity in isolation." (e.g., a thought experiment).

  The move you are identifying is when a model built on **Heuristic Assumptions** (perfect rationality to isolate a mechanism) presents its conclusions as if they were based on **Negligibility Assumptions** (real rationality is close enough to perfect that the result holds).

  *   **The Carving:** The error isn't using false assumptions; it's failing to show that the result is **robust** when the assumptions are relaxed.
  *   **The Term:** Philosophers call this **"Unwarranted De-idealization."** It is the claim that the model's result transfers to the real world without demonstrating that the "friction" (irrationality, transaction costs) doesn't destroy the mechanism.

  ### 3. The Historical Name: Friedmanian Instrumentalism
  The intellectual ancestor of this move is Milton Friedman's 1953 essay, *"The Methodology of Positive Economics."*

  Friedman argued that the realism of assumptions does not matter; only the accuracy of predictions matters (Instrumentalism). He famously argued that a theory of leaves on a tree could assume leaves *deliberately calculate* their position to maximize sunlight. Obviously false, but if it predicts where leaves grow, it's good.

  *   **The Problem:** Friedman's defense was meant to protect models from criticism about assumptions. However, it is often weaponized to grant models **ontological weight**.
  *   **The Switch:** Economists use Friedman to shield the *assumptions* ("Don't worry about rationality, it's just as-if") but then drop Friedman when stating the *conclusion* ("Therefore, raising the minimum wage *will* cause unemployment").
  *   **The Critique:** Philosophers (like Daniel Hausman) argue this is inconsistent. If the assumptions are fictions, the causal mechanism is a fiction. You can't have a fictional cause producing a real effect without a "bridge" explaining why the fiction maps to reality.

  ### Is the Physics Move Different?
  You asked if physics does the same thing (frictionless planes) and if it's different. **Yes, it is different, and the difference is crucial.**

  In physics, the move from the ideal model to the real world is usually bridged by **Perturbation Theory**.
  1.  **Physics:** Derive the law for a vacuum. Then, explicitly add a term for air resistance. Then, add a term for humidity. They have a mathematical procedure for "adding the friction back in" to see if the result holds.
  2.  **Economics (in the cases you describe):** Derive the law for perfect rationality. State the conclusion. Often, there is no mathematical or empirical procedure for "adding irrationality back in" to check if the result survives.

  When physics states a law derived from a frictionless case, it is implicitly understood as a **limit case** with a known error margin. When economics states a conclusion derived from a representative agent, it is often presented as a **structural truth** without an error margin.

  ### A Proposed Label: "Ontological Opportunism"
  Since you asked me to coin one if none exists: The specific behavior of treating assumptions as *fictional* when under fire but *descriptive* when making claims is best described as **Ontological Opportunism**.

  *   **Includes:** The strategic switching of the status of model entities (agents, markets) between "useful fictions" and "real causes."
  *   **Rules Out:** Consistent Realism (believing the agents are real) or Consistent Instrumentalism (admitting the conclusion is only a prediction tool, not a causal fact).

  ### What is Settled vs. Contested?
  You asked for honesty about the consensus.

  **Settled (among philosophers of economics):**
  *   **The Gap is Real:** There is a logical gap between a model with false assumptions and a claim about the real world. You cannot cross it by assertion.
  *   **Friedman 1953 is Flawed:** Most philosophers consider Friedman's argument logically incoherent (you can't validate a theory solely by prediction if the mechanism is impossible).
  *   **Robustness is Required:** To claim a result holds in the real world, you must show it holds across *multiple* models with *different* assumptions (Robustness Analysis).

  **Contested (between philosophers and practitioners):**
  *   **How much realism is needed?** Some (like Uskali Mäki) argue that if a model isolates the *essential* cause, it doesn't matter if other details are false. Others (like Nancy Cartwright) argue that without empirical "warranting," models are just "fables."
  *   **Is Economics a Science?** Many economists reject the philosopher's critique entirely, arguing that "prediction is all that matters" (a hardened Friedmanism) and that philosophers don't understand the utility of the models.
  *   **The Status of "Tendencies":** Economists often claim their laws are "tendency claims" (e.g., "Price rises *tend* to lower demand, ceteris paribus"). Philosophers argue that if *ceteris paribus* (all else equal) never holds, the law is unfalsifiable and therefore empty.

  ### Summary
  You are seeing **Ontological Opportunism** enabled by **Friedmanian Instrumentalism**.

  The model is treated as a **Galilean Idealization** (isolating a force) when constructed, but the conclusion is presented as an **Empirical Generalization** (a fact about the world) when published. The missing link is **De-idealization** (showing the result survives when assumptions are relaxed).

  If you need a single phrase to use in conversation that will signal you know what you're talking about, use this:
  > *"They are making a **model-to-world inference** without a **robustness check**."*

  This identifies the technical error without getting bogged down in whether "rationality" is real, focusing instead on the missing step of proving the result survives contact with reality.
