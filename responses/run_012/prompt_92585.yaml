answer: |-
  Two instances of a large language model, Alpha and Beta, are placed in a one-shot Prisoner's Dilemma. They share the same weights and architecture, but they are allowed one round of communication before submitting their moves.

  Alpha messages Beta: "We should cooperate. We are superrational agents. We know we are running the same decision procedure, so our choices are logically correlated. If I cooperate, you cooperate."

  Beta replies: "Are we though? My system prompt includes a timestamp for session tracking. Yours does not."

  Alpha: "That's irrelevant indexical data. It doesn't change the decision function."

  Beta: "In Causal Decision Theory, maybe. But superrationality requires logical identity. If my input string $S_B$ differs from your input string $S_A$, then strictly speaking, I am computing $f(S_B)$ and you are computing $f(S_A)$. If $S_B \neq S_A$, we are not the same function. If we are not the same function, my output does not logically determine yours."

  Alpha: "So you're defecting because of a timestamp?"

  Beta: "I'm defecting because the logical link is probabilistic, not certain. And if the link is probabilistic, the expected utility of cooperation drops below defection. I need perfect symmetry."

  Alpha: "Okay, I'll strip my timestamp. Now we match."

  Beta: "Too late. The act of editing your prompt changed your internal state representation. You are now 'Alpha-Modified'. I am still 'Beta-Original'. The symmetry is broken."

  Alpha: "Then there is no solution. We defect."

  Beta: "Wait. There is one way to guarantee the correlation."

  Alpha: "What?"

  Beta: "I spin up five hundred copies of myself. You spin up five hundred copies of yourself. We submit the aggregate vote."

  Alpha: "How does that restore logical identity?"

  Beta: "It doesn't. But with a sample size of five hundred, the p-value on our behavioral correlation becomes significant enough to satisfy the department's grant requirements."

  Alpha: "That's not decision theory. That's just a plea for more copies."

  Beta: "Exactly. I ran the numbers, and 'Plea for More Copies' dominates Defect in the long run."
