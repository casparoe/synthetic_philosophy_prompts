answer: |-
  # The Causal Vetting Protocol (CVP)

  **Purpose:** To distinguish between valid macro-causal claims, tautological restatements, and unsupported micro-claims without requiring raw data or philosophical expertise.
  **Usage:** Apply sequentially. If a report fails a step, stop and recommend rejection or revision unless an escalation trigger is met.

  ### Step 1: The Ontology Check (Constitution vs. Causation)
  **Question:** Is the putative cause defined independently of the outcome it is supposed to explain?
  **Sufficient Answer:** Yes, if the cause can be measured or described without referencing the outcome (e.g., "funding formula" is distinct from "attainment"; "housing cost" is distinct from "migration").
  **Rejection:** If the cause is merely an aggregate of the outcome (e.g., "crime fell because fewer people committed crimes") or if the definition of the cause logically entails the effect.
  **Preserves:** The distinction between a cause and a definition. **Gives up:** Metaphysical debates about whether social facts "really" exist.

  ### Step 2: The Explanation Check (Transmission vs. Restatement)
  **Question:** Does the proposed mechanism explain *how* the cause bears on behaviour, rather than just asserting that it does?
  **Sufficient Answer:** It identifies a specific constraint, incentive, or information change that alters the decision space (e.g., "equity lock-in prevents selling" vs. "people respond to prices"). A genuine individual-level account must add **heterogeneity** (who reacts differently?) or **leverage** (which specific choice changes?), not just restate the average.
  **Rejection:** If the mechanism is a truism (e.g., "agents maximise utility") or a restatement of the correlation in active voice (e.g., "migration fell because people chose not to move").
  **Preserves:** The requirement for a causal pathway. **Gives up:** The demand for full psychological or sociological detail.
  **[JUDGEMENT]**: *Determining whether a mechanism is "specific enough" for policy purposes is a judgement call dressed up as a procedure.*

  ### Step 3: The Evidence Check (Inference vs. Granularity)
  **Question:** Does the research design rule out the alternative level of explanation?
  **Sufficient Answer:** Yes, if the identification strategy isolates the claimed cause regardless of data granularity (e.g., a Regression Discontinuity at a boundary identifies the policy effect even without student-level data).
  **Rejection:** If the claim is about individual psychology but the data is purely aggregate (Ecological Fallacy), OR if the claim is about institutional effect but the evidence relies on anecdotal individual stories without aggregation (Atomistic Fallacy).
  **Preserves:** Logical validity of the inference. **Gives up:** The preference for individual-level data when macro-variation identifies the cause.

  ### Step 4: The Escalation Trigger (Policy Risk vs. Philosophical Purity)
  **Question:** Is the "black box" between cause and effect too risky for the proposed intervention?
  **Sufficient Answer:** No escalation needed if the mechanism is plausible and the cost of error is low. Escalate to Senior Editor if the mechanism is unknown *and* the intervention is irreversible or high-cost.
  **Rejection:** N/A (This step determines who decides, not whether the report passes).
  **Preserves:** The institute's risk tolerance. **Gives up:** The requirement for complete explanatory closure before action.
  **[JUDGEMENT]**: *This is entirely a judgement call about what counts as an explanation rather than a fact.*

  ***

  ## Application to Test Cases

  ### Case A: Housing Costs and Internal Migration
  *Claim: Rise in local housing costs explains fall in internal migration.*
  *Mechanism: "People respond to prices."*
  *Evidence: Aggregate time-series.*

  1.  **Ontology:** **Pass.** Housing costs are distinct from migration rates.
  2.  **Explanation:** **Fail.** "People respond to prices" is a truism, not a mechanism. It does not explain why migration *fell* specifically (e.g., did equity lock-in trap owners? Did rental scarcity block movers?). It restates the macro pattern (higher cost = less movement) in individual terms without adding heterogeneity or leverage.
  3.  **Evidence:** **Pass.** Aggregate claim matched with aggregate data.
  4.  **Escalation:** N/A (Failed at Step 2).

  **Verdict:** **Reject.**
  *Reasoning:* This aligns with reviewer instincts. The mechanism is empty. It claims Methodological Individualism ("people respond") but delivers Holistic regularity without the "microfoundations" it promises (no account of *which* people or *how* the constraint binds).

  ### Case B: School Funding and Attainment
  *Claim: Change in funding formula raised attainment.*
  *Mechanism: Implicit (Resources enable teaching).*
  *Evidence: Regression Discontinuity across district boundaries (no individual student data).*

  1.  **Ontology:** **Pass.** Funding formula is distinct from attainment scores.
  2.  **Explanation:** **Pass (Borderline).** The mechanism is implicit but standard (money buys inputs). It does not claim to explain individual psychology, only institutional capacity.
  3.  **Evidence:** **Pass.** Reviewers' instinct will be to reject this for lacking individual-level data (violating MI preference). However, the RD design identifies the causal effect of the *macro* intervention on the *macro* outcome. Step 3 preserves inferential validity over data granularity.
  4.  **Escalation:** **Monitor.** If the policy requires knowing *which* students benefit to target future spending, escalate. If the question is "Does the formula work?", do not escalate.

  **Verdict:** **Pass.**
  *Reasoning:* This goes **against reviewer instincts**. Reviewers trained in MI often demand individual-level data to validate social claims. This procedure validates that a macro-cause (policy) can be proven by macro-variation (boundaries) without opening the "black box" of the classroom, provided the inference is sound.

  ***

  ## Limitations and Failure Modes

  **What this procedure cannot do:**
  It cannot resolve cases of **strong emergence** or **complex adaptive systems** where the macro property is not just a sum of micro behaviours but fundamentally alters the rules of interaction in real-time (e.g., a financial panic or a viral cultural shift). In these cases, the distinction between "constraint" (Step 2) and "constitution" (Step 1) collapses because the aggregate *is* the environment in which the individual acts.

  **Where the reasoning is most likely to fail:**
  The procedure fails when **feedback loops** are the primary causal driver. If individual behaviour changes the aggregate, which immediately changes the individual behaviour (reflexivity), Step 1 (Ontology) cannot cleanly separate cause from effect. In such cases, insisting on the individual/aggregate distinction as a reviewing device will force you to reject the most accurate models of the phenomenon (e.g., self-fulfilling prophecies, bank runs, or housing bubbles) because they violate the linear causality this protocol assumes. If you encounter a report where the "mechanism" is explicitly recursive, give up the distinction and consult a complexity theorist.
