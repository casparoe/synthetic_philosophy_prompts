answer: |-
  **JOINT STATEMENT ON THE NATURALISATION OF MENTAL CONTENT**

  **Date:** October 26, 2023
  **Signatories:**
  Dr. Elena Vance (Teleosemanticist)
  Dr. Marcus Thorne (Causal-Informational Theorist)

  **Preamble**
  We, the undersigned, having engaged in a period of adversarial collaboration regarding the naturalization of mental content, submit this joint statement. Our goal is not to announce a synthesis, but to map the exact topography of our agreement and disagreement. We agree that mental content must be explicable in naturalistic terms, without appeal to irreducible intentionality. We disagree on the metaphysical grounds of that explication. The following document isolates our common premises, specifies our divergent predictions on stipulated cases, and identifies the empirical or conceptual cruxes that would resolve the debate.

  ### I. Agreed Claims

  We jointly affirm the following propositions as the baseline for any adequate theory of content:

  1.  **Explanatory Targets:** Any theory must explain the possibility of **misrepresentation** (error). A theory that entails a system cannot be wrong about the world fails to account for representation.
  2.  **The Disjunction Problem:** A theory must explain why a state represents a specific type (e.g., *predator*) rather than a disjunction of that type and the error-causing conditions (e.g., *predator-or-black-dot*), particularly when the system cannot distinguish between them.
  3.  **Indeterminacy:** A theory must provide principled grounds for ruling out gerrymandered or overly broad content ascriptions that fit the physical data equally well.
  4.  **Non-Covarying Content:** A theory must accommodate the possibility of states that possess content despite having no current causal correlation with their object (e.g., thoughts about extinct species, hallucinations, or future events).
  5.  **Normal Conditions:** Both sides agree that content ascription relies on a notion of "normal" or "standard" conditions, though we disagree on how these conditions are individuated (see Section II).
  6.  **Real Disputes:** We agree that our disagreement is not merely about the extension of the word "representation" in ordinary language, but about the metaphysical grounds that make a state a representation in a scientific psychology.

  ### II. Table of Disagreements

  The following table details the precise points of divergence, including our respective interpretations of the stipulated test cases.

  | Point of Issue | Teleosemantic Formulation (Vance) | Causal-Informational Formulation (Thorne) |
  | :--- | :--- | :--- |
  | **1. The Ground of Content** | Content is constituted by the **proper function** of a state. A proper function exists only if the state was selected (via evolution, learning, or design) to perform that role. History is constitutive. | Content is constituted by the **reliable causal covariance** of a state under normal conditions. The current causal profile is constitutive; history is merely explanatory of how the profile arose. |
  | **2. Case 1: Transplanted Circuit**<br>*(Circuit selected in Species A for predators/flight; copied to Species B with no selection, now covaries with harmless stimulus/drives different behavior)* | **Content:** *Predator.*<br>**Reason:** The state's proper function was fixed by the selection history in Species A. In Species B, the state misrepresents the harmless stimulus as a predator. The lack of selection history in Species B is irrelevant to the content fixed by the origin. | **Content:** *Harmless Stimulus.*<br>**Reason:** The state's content is fixed by what it currently carries information about in its operating environment. Since it reliably covaries with the harmless stimulus in Species B, that is its content. It does not misrepresent; it tracks the new stimulus. |
  | **3. Case 2: Engineered Device**<br>*(Engineer builds device from scratch; state covaries with temperature and drives cooling)* | **Content:** *Temperature.*<br>**Reason:** The state represents temperature **in virtue of the engineer's design intent**. The history of deliberate design confers the proper function. If the device had assembled randomly with the same physics, it would not represent. | **Content:** *Temperature.*<br>**Reason:** The state represents temperature **in virtue of the reliable physical covariance**. The engineer's intent is irrelevant to the content; it only explains why the covariance exists. If the device assembled randomly, it would still represent. |
  | **4. The Nature of "Normal Conditions"** | Normal conditions are **teleological**: conditions under which the mechanism was selected to operate. A condition is abnormal if it interferes with the proper function. | Normal conditions are **statistical/causal**: conditions that obtain with high frequency or are part of the standard causal background required for the information relation to hold. |

  ### III. Cruxes and Pre-Registered Predictions

  We identify two sub-questions (cruxes) such that settling them would significantly alter the plausibility of one or both positions. For each, we specify a case or argument and our pre-registered predictions.

  **Crux 1: The Sufficiency of Accidental Covariance**
  *   **Question:** Can a system possess representational content if it reliably covaries with an environmental feature but has *no* history of selection or design (e.g., a "Swampman" or a naturally occurring rock formation that tracks temperature)?
  *   **Agreed Test:** Consider a molecule-for-molecule duplicate of a human brain that spontaneously assembles via cosmic accident (Swampman), or a natural rock formation that expands/contracts exactly with temperature but was never designed.
  *   **Teleo Prediction:** The Swampman/Rock has **no content**. Without a history of selection/design, there is no proper function, hence no representation. It merely mimics representation.
  *   **Causal-Info Prediction:** The Swampman/Rock **has content**. If the causal/isomorphic structure reliably carries information, it represents. History is not required for the existence of the relation.
  *   **Resolution Condition:** If strong intuitive consensus holds that the Swampman *does* have thoughts, the Teleosemanticist must concede or modify the history requirement. If consensus holds that the Rock *does not* represent temperature (it is merely a thermometer, not a representer), the Causal-Informationalist must add a constraint beyond covariance.

  **Crux 2: The Authority of History in Error**
  *   **Question:** In cases of evolutionary or functional mismatch (Case 1), does the intuition of "error" track the historical function or the current reliability?
  *   **Agreed Test:** The Transplanted Circuit (Case 1). We will survey intuitions regarding whether the organism in Species B is *mistaken* when it reacts to the harmless stimulus.
  *   **Teleo Prediction:** Observers will judge the organism is **mistaken** (misrepresenting). The behavior is inappropriate for the current stimulus because the system is "designed" for a different one.
  *   **Causal-Info Prediction:** Observers will judge the organism is **correct** (accurately tracking). The system is doing exactly what its current structure dictates in response to the current environment. To call it error is to privilege the past over the present.
  *   **Resolution Condition:** If the prevailing intuition is that the organism is *not* in error (it is simply adapted to a new niche), the Teleosemantic account of error is undermined. If the intuition is that it *is* in error (a glitch), the Causal-Informational account of content is undermined.

  ### IV. Falsification Conditions

  We agree to state what would count as evidence against our respective positions.

  **For the Teleosemanticist (Vance):**
  *   **Falsifier:** A clear case of a system with **no selection history** (natural, learning, or design) that is universally accepted by competent speakers and scientists as having genuine representational content (e.g., if the Swampman intuition becomes robustly definitive).
  *   **Falsifier:** A case where a system retains its **selection history** but loses its **causal covariance** entirely (e.g., a broken mechanism), yet we are compelled to say it still represents the *current* state of the world rather than the *intended* state. (Note: Teleo predicts it represents the intended state even if broken; if intuition dictates it represents nothing, the theory needs adjustment).

  **For the Causal-Informational Theorist (Thorne):**
  *   **Falsifier:** A clear case of **reliable covariance without content**. If a natural phenomenon (e.g., tree rings tracking age, or smoke tracking fire) is decisively judged *not* to represent those things in the absence of a consumer/function, then covariance is insufficient.
  *   **Falsifier:** A clear case where **current covariance is overridden by history**. If Case 1 (Transplanted Circuit) yields a strong, stable intuition that the state represents the *historical* predator despite *current* covariance with a harmless stimulus, then current causal profile is insufficient to fix content.

  **Joint Assessment of Moveable Debates:**
  We agree that **Crux 1 (Swampman/Accidental Covariance)** is the most likely candidate to move the debate. If it can be demonstrated that "content" is a functional role that *requires* a history to be instantiated (akin to "money" or "marriage"), the Teleosemanticist wins. If it can be demonstrated that "content" is a natural relation like "causation" that exists independently of human or evolutionary history, the Causal-Informationalist wins.

  ### V. Assessment of Verbal Disputes

  We have identified one area where the dispute may be partially verbal, though it rests on substantive commitments.

  *   **The Definition of "Information":**
      *   **Diagnosis:** The Causal-Informational theorist often uses "information" in a sense close to Shannon information or natural covariance (A carries information about B if they correlate). The Teleosemanticist often uses "information" in a loaded sense (A carries information about B only if A is *supposed to* correlate with B).
      *   **Resolution:** We agree to distinguish **natural information** (covariance) from **semantic information** (representation).
      *   **Remaining Substantive Dispute:** Even granting this distinction, the core dispute remains: Is *semantic* information reducible to *natural* information plus a consumer system (Thorne), or does it require a historical norm (Vance)? This is not merely verbal; it is a disagreement about the metaphysics of norms.

  *   **The Scope of "Selection":**
      *   **Diagnosis:** In Case 2, the prompt stipulates "no selection history," yet the Teleosemantic definition includes "deliberate design" as selection.
      *   **Resolution:** We agree this is a terminological variance. For the Teleosemanticist, design *is* a selection process. For the Causal-Informationalist, design is a cause of the structure, but not a "selection" in the biological sense.
      *   **Substantive Core:** The disagreement is not whether design counts as selection, but whether the *intent* of the designer is required for content. If the engineer built the device accidentally (without intent to represent temperature), the Teleosemanticist denies content; the Causal-Informationalist affirms it (provided covariance holds). This is a substantive disagreement about the role of intention in naturalization.

  **Signed,**

  *Elena Vance*
  *Marcus Thorne*
