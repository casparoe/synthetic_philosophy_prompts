answer: |-
  This is a sharp observation. You have put your finger on the central tension in the philosophy of international law: the **Separation Thesis** (the idea that *jus in bello* [conduct in war] is independent of *jus ad bellum* [cause of war]).

  Your intuition is correct: the current legal architecture looks remarkably like a institutionalized version of a statist ontology, which Hegel provides a famous philosophical grounding for. However, whether the law *needs* Hegel's specific ethical claims is a different matter.

  Here is a breakdown of your three questions, distinguishing between what is settled law, what is settled philosophy, and where the genuine controversies lie.

  ---

  ### (a) What does the practice strictly presuppose? Do immunity and duty presuppose the same thing?

  **The Settled Law:**
  It is settled *lex lata* (law as it stands) that International Humanitarian Law (IHL) applies equally to all parties in an international armed conflict, regardless of who started it. This is codified in Common Article 2 of the Geneva Conventions. It is also settled that "aggression" is a leadership crime (Nuremberg, Rome Statute Article 8 *bis*), not a crime for the rank-and-file.

  **The Presuppositions:**
  There are two competing explanations for why the law looks this way. One is **functional/pragmatic**, the other is **ontological/statist**.

  1.  **Functionalism (The "Reciprocity" Story):**
      *   *Claim:* The law doesn't care about the moral status of the soldier; it cares about minimizing suffering. If you tell Side B that they are "criminals" because their war is unjust, they have no incentive to follow the rules of war. They will fight dirty.
      *   *Presupposition:* This presupposes nothing about the ethics of war, only about human psychology and incentive structures.
      *   *Status:* This is the dominant explanation among legal positivists and policymakers.

  2.  **Statism (The "State Agency" Story):**
      *   *Claim:* The state is the moral agent, not the individual. The soldier is an instrument of the state's will. Therefore, the soldier inherits the state's license to use violence, regardless of the specific cause.
      *   *Presupposition:* This presupposes that individuals can be morally "shielded" by their membership in a sovereign entity.
      *   *Status:* This is the dominant explanation among traditional Just War Theorists (like Michael Walzer) and fits the Hegelian picture.

  **Do Immunity and Duty presuppose the same thing?**
  Strictly speaking, **no**, and this is a crucial distinction often missed in seminars.
  *   **Combatant Privilege (Immunity):** This is an *international* law concept. It can be justified purely functionally (reciprocity).
  *   **Duty to Fight (No Desertion):** This is a *domestic* military law concept. IHL does not order you to fight; your own state does.
  *   **The Mismatch:** You can justify immunity functionally ("we need them to follow rules"), but it is much harder to justify the *duty* to fight an unjust war functionally. Why *must* a conscript fight for an aggressor state?
      *   *Functionally:* You might argue "coercion" or "duress" prevents prosecution, but that excuses the act; it doesn't create a *duty*.
      *   *Statistically:* To justify the *duty*, you need a stronger normative claim about political obligation (i.e., "you owe the state your life"). This is where the Hegelian picture (the individual finds ethical substance in the state) does more work than the functionalist picture.

  **Consensus vs. Contest:**
  *   **Settled:** The law separates *ad bellum* and *in bello*.
  *   **Contested:** Philosophers of war (Just War Theory) are deeply divided on whether this separation is morally coherent. "Revisionists" (see section c) argue it is a moral fiction. Legal scholars generally defend it as a necessary fiction.

  ---

  ### (b) Does it presuppose Hegel's positive claim (war is ethically good) or only the state-centered bit?

  **The Hegelian Claim:**
  In *Elements of the Philosophy of Right* (§324), Hegel argues that war preserves the "ethical health of peoples" by preventing the stagnation that comes from prolonged peace. He also argues war actualizes the "ideality" of finite goods (showing that property/life is contingent on the state's sovereignty).

  **The IHL Reality:**
  IHL is fundamentally **humanitarian**. Its preamble and core principles (humanity, necessity, proportionality) treat war as a source of suffering to be *mitigated*, not an ethical good to be *preserved*.

  **The Fit:**
  1.  **State-Centered Ontology (Strong Fit):** IHL absolutely presupposes the Hegelian view that **States are the primary agents**. Individuals fight *as* members of states. The "combatant's privilege" is a status derived from membership (wearing a uniform, carrying arms openly), not individual moral innocence. This aligns perfectly with Hegel's view that the individual's substantial freedom is found in the state.
  2.  **Ethical Value of War (No Fit):** IHL does **not** presuppose that war is ethically beneficial. In fact, the entire project of the Geneva Conventions is predicated on the idea that war is a humanitarian disaster.
      *   *Hegel:* War prevents the "corruption" of peace.
      *   *IHL:* Peace is the goal; war is the failure condition we must regulate.

  **Consensus vs. Contest:**
  *   **Hegel Scholarship:** It is **contested** whether Hegel's "wind keeping the sea fresh" remark is a literal endorsement of war's moral benefit or a metaphorical description of how sovereignty asserts itself against other sovereignties. Some read it as a tragic necessity; others as a positive ethical good.
  *   **IHL Theory:** It is **settled** that IHL is agnostic on the *benefits* of war. It assumes war happens, but does not posit it as a good.
  *   **Conclusion:** The law requires the **Statist Ontology** (States act, individuals represent them), but it rejects or ignores the **Ethical Valuation** (War is good for the spirit). You can have the legal structure without accepting that war prevents societal rot.

  ---

  ### (c) The Cosmopolitan/Revisionist Challenge: What if we swapped the presupposition?

  This refers to the **"Revisionist Just War Theory"** movement, most famously associated with philosopher Jeff McMahan.

  **The Revisionist Claim:**
  Moral liability to attack depends on the justice of the cause.
  *   **Just Combatants:** Permitted to kill unjust combatants.
  *   **Unjust Combatants:** Not permitted to kill just combatants (they are effectively engaged in a form of criminal violence, albeit excused by duress/ignorance).
  *   **Implication:** The "moral equality of combatants" is false.

  **If IHL Adopted This:**
  If the Law of Armed Conflict (LOAC) were rewritten to match Revisionist morality:

  1.  **Criminalization of Fighting:** Soldiers on the aggressor side would be legally liable for murder merely for participating in combat, even if they followed all rules of engagement.
  2.  **Collapse of Reciprocity:** If Side A knows Side B views them as criminals regardless of their conduct, Side A has no incentive to treat Side B's POWs humanely or follow distinction/proportionality rules.
  3.  **Epistemic Impossibility:** IHL relies on clear status (uniforms, chains of command). Revisionism relies on moral truth (*who is actually unjust?*). In the fog of war, soldiers cannot adjudicate the *jus ad bellum* status of their own government vs. the enemy's.
  4.  **POW Status:** Under Revisionism, unjust combatants might not qualify for Prisoner of War status (which protects against prosecution for lawful acts of war). They could be tried for murder upon capture.

  **Would it work?**
  *   **Legal Consensus:** Overwhelmingly **No**. Legal scholars (even those who sympathize with Revisionist morality) argue that encoding this into law would make war more brutal. The "functional" argument trumps the "moral truth" argument in legal design.
  *   **Philosophical Contest:** This is the hottest debate in contemporary philosophy of war.
      *   *Traditionalists (Walzer):* Defend the Moral Equality of Combatants. Soldiers are coerced instruments; blame the leaders.
      *   *Revisionists (McMahan):* Argue the Moral Equality of Combatants is a myth that protects killers.
      *   *Pragmatists:* Argue Revisionism is morally true but legally disastrous.

  **The Hegelian Counter:**
  Hegel would reject the Revisionist premise entirely. For Hegel, the question "Is this specific war unjust?" is a category error for the soldier. The soldier's duty is to the sovereignty of the state. If the state enters the state of nature (war) with another state, there is no higher tribunal to judge "justice" in that moment other than the outcome itself (history). To ask a soldier to judge the *ad bellum* justice is to ask them to stand outside the ethical life (*Sittlichkeit*) of their state, which Hegel thinks is impossible for a concrete moral agent.

  ### Summary for your Seminar

  1.  **Presupposition:** IHL strictly presupposes a **Statist Ontology** (states are the agents, soldiers are members), but it does **not** presuppose Hegel's claim that war is ethically beneficial. It treats war as a regulated evil.
  2.  **Immunity vs. Duty:** Immunity can be justified functionally (reciprocity). The *duty* to fight (domestic law) leans harder on the Statist/Hegelian view of political obligation.
  3.  **Revisionism:** If you swap the statist view for a cosmopolitan/revisionist one (where individual morality trumps state membership), the current legal regime collapses. You would lose the incentive structures that keep wars from becoming total exterminations.
  4.  **Contestation:** Be careful to note that while the *law* is settled on the Separation Thesis, the *morality* of that separation is fiercely contested in philosophy. Hegel provides a robust defense of the statist side, but he is not the only one; functionalists defend the same legal rules for entirely different reasons.

  **One final nuance for class:** If you want to impress the prof, point out that the ICC's activation of the **Crime of Aggression** (2018) creates a tension. It reinforces the asymmetry you noted (leaders are liable, soldiers are not). This legally cements the idea that the *state's* decision is the site of moral judgment, not the *soldier's* trigger pull. This aligns with Hegel's focus on the State as the locus of ethical will, even if it ignores his "war is healthy" claim.
