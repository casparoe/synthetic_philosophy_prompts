  The difference was in the information.
  The difference was not in the reason.
  Now the information is common ground.
  Now the posteriors are common ground.
  I know that you know that I know.
  You know that I know that you know.
  The recursion finds its fixed point here.
  The recursion finds its resting place.
  There is no space for disagreement.
  There is no room for separate bets.
  The theorem does not say we speak.
  The theorem does not say we strive.
  It says the math forbids the split.
  It says the prior forbids the split.
  The voice is not the instrument.
  The will is not the instrument.
  The probability is singular.
