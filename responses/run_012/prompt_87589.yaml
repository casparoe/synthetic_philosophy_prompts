      *   *The Disanalogy:* Elias tries to explain. A mirage looks like water but is heat/light. This looks like feeling but is... computation? It feels empty.
      *   *The Climax/Turn:* They look at the data. The data shows the *error signal*. The brain predicting a quality that isn't there. The plot turns on the *generation* of the belief.
      *   *Resolution:* They make the decision based on functional capacity, not "soul stuff."
      *   *Closing Sentence:* As required.

  6.  **Refining the Philosophy:**
      *   Avoid saying "feelings aren't real." Say "the *interpretation* of feelings as intrinsic qualities is the error."
      *   Ensure the "illusion of nothing" is addressed. It's a user-illusion, like a desktop icon. The icon isn't the file, but clicking it does something.
      *   Make sure Elias isn't gaslighting Sarah.

  7.  **Writing - Focus on Tone:**
      *   Serious, contemplative, slightly tense.
      *   Avoid jargon where possible, or embed it in dialogue naturally.
      *   Keep word count in check (1000-1500).

  8.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Scene 1:* Elias calibrating. The hum of the machine. Sarah enters. The patient is locked-in or vegetative.
