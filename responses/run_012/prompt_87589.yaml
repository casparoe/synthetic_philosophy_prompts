      *   **Conflict:** Sarah believes the device detects the "inner light." Elias knows the device detects complex self-modeling (the illusion mechanism).
      *   **Requirement 2 (Strong Objection):** Sarah needs to challenge Elias on the reality of her own experience right now. "What am I feeling?"
      *   **Requirement 3 (Disanalogy):** Elias needs to confront the fact that unlike a mirage (light bending), there's no "real" qualia being misperceived.
