      *   *Selection:* Let's go with a calibration/testing scenario involving a new neuro-interface. It allows for technical precision and high stakes (medical/legal). Let's make the protagonist an illusionist technician (Elias) and the antagonist/interlocutor a realist clinician (Sarah).

  4.  **Developing the Plot:**
