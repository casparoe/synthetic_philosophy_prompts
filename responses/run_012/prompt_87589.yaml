          3.  Make vivid the disanalogy with ordinary perceptual illusions (illusion of nothing?).
          4.  Plot must turn on *why* we are convinced we have phenomenal states (the mechanism of the illusion).
          5.  No philosophical zombies, no dream/simulation twists.
          6.  Closing: Single sentence on its own line stating the story's purpose.

  2.  **Deconstruct Illusionism:**
      *   It's not denying *access consciousness* (reporting, processing).
