      *   *Candidate Rules:* List them clearly. Highlight Rule 1 (Order) and Rule 3 (Epistemic Humility).
      *   *Uncertainties:* Pascal's silence on institutional design. His focus is on the *heart*, not the *state*.
      *   *Alternative Institution:* An International Criminal Court. It claims universal justice. Pascal would call it a tyranny of custom masquerading as truth.

  8.  **Self-Correction/Refinement during drafting:**
