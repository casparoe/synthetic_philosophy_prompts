      *   *Crucial Historical Context:* The *Parlements* in France were courts that *did* have power to register/objection to royal edicts. They often used "fundamental laws" to block the King. Pascal generally sided with the Crown against the *Parlements* during the Fronde. This is the smoking gun. He saw the *Parlements* as obstructors of peace.
      *   *Conclusion:* He would view Constitutional Courts like the French *Parlements* of the Fronde: obstacles to unity, sources of faction, cloaking their power-grab in the language of "justice."

  6.  **Addressing the "Uncertainty" and "Better Test":**
      *   *Uncertainty:* Pascal cares about *salvation*, not politics. Politics is a stopgap. If a court saved lives, maybe? But his theology says suffering is inevitable.
      *   *Better Test:* International Criminal Court (ICC) or Human Rights Tribunals. Why? Because they claim *transcendent* justice over *sovereign* custom. This hits Pascal's nerve about "justice on this side of the Pyrenees." Or, perhaps more accurately, a **Truth and Reconciliation Commission**. Why? Because it admits the *sin* of the past without promising perfect justice, focusing on restoring order/peace through confession (theological resonance). Actually, the **Entrenched Bill of Rights** is the clearest test of "abstract justice vs. custom."
      *   *Wait, let's look closer:* The prompt asks for a "better test" if judicial review is shaky. Is judicial review shaky? The historical parallel with the *Parlements* is strong. I'll stick with the verdict but offer the **International Court** as a sharper test of his skepticism about universal justice.
