      *   Rule 4: Custom/Prescription is the only legitimate basis for earthly authority, not abstract reason.

  5.  **Refining the Verdict:**
      *   If Judicial Review creates a conflict between the Court and the Legislature, Pascal sides with the Legislature (the active Sovereign) because it represents the established force/custom.
