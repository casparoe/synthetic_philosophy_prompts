      *   **Body Paragraph 1: The Standard Argument.** Explain why the outside view is prized (corrects planning fallacy/optimism). Acknowledge its power in routine cases.
      *   **Body Paragraph 2: The Reference Class Problem.** Explain how choosing the class is an inside-view act. Use the gene therapy example. Show how different classes yield different results.
      *   **Body Paragraph 3: The Impossibility of "Objective" Selection.** Argue that there is no algorithm for the "correct" class. Similarity is multidimensional. Causal relevance requires theory (inside view).
      *   **Body Paragraph 4: Re-framing the Relationship.** Propose the outside view as a stress test, not a replacement. It highlights *where* the inside view needs strong justification.
      *   **Conclusion:** Restate thesis. Give the definite verdict. State confidence level.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the dichotomy. Kahneman's *Thinking, Fast and Slow* popularized this. The prompt asks about the conflict. My stance: The outside view is not the sovereign judge.
      *   *The Appeal:* Why do we like the outside view? It stops us from thinking we are special. It anchors us in reality. In construction projects or routine business, it works great.
      *   *The Crack:* But novelty breaks it. The gene therapy case. If I pick "all drug trials," success is 10%. If I pick "pre-clinical successes with this mechanism," maybe 50%. Who picks the class? The forecaster. This is where bias enters.
      *   *The Philosophical Core:* Reference class forecasting assumes similarity is objective. It isn't. Goodman's "grue" problem or just general similarity metrics. To pick a class, you need a theory of *why* things succeed. That theory is the inside view. Therefore, the outside view rests on inside view foundations.
      *   *The Verdict:* The outside view is a diagnostic tool. If your inside view deviates from the base rate, you don't automatically lose. You must explain *why* this case is exceptional. The burden of proof shifts, but the verdict isn't pre-determined.
      *   *Confidence:* I need to state a confidence level. High confidence in the philosophical limitation, moderate confidence in the practical prescription. Let's say 85%.

  5.  **Refining the Argument (Self-Correction during drafting):**
