      *   **Constraint:** Do not end by laying out considerations on both sides. Commit to a position and state confidence level.

  2.  **Determine the Position:**
      *   *Option A:* Defend the Outside View. Argue there is an objective way to select reference classes (e.g., predictive accuracy, causal similarity) that minimizes bias.
      *   *Option B:* Limit the Outside View. Argue that because reference class selection is inherently subjective and theory-laden, the outside view cannot be the ultimate arbiter. It is a tool, not a rule.
      *   *Decision:* Option B is more philosophically robust and addresses the prompt's specific skepticism about reference class selection. It allows for a nuanced defense of the inside view's necessity while acknowledging the outside view's utility as a check, not a command. This fits the "gene therapy" example well, where novelty makes base rates tricky.
      *   *Verdict:* The outside view's authority is more limited than its reputation suggests. It is a heuristic for calibration, not an epistemic trump card.

  3.  **Outline the Essay:**
