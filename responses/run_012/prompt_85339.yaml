answer: |-
  Welcome. Thank you for coming, and for agreeing to spend two days in a hotel conference room talking about things that are usually shouted about from pulpits or op-ed pages. When my co-chair and I chose the title for this workshop, Who Keeps the Promise Now, we did so before we had fully understood the weight of the question. It sounds like a single inquiry. It sounds like we are here to settle a debate about whether religion is good for society, or whether secularism has replaced it, or whether trust is collapsing. If I were to give you the speech you expect, I would recite the usual positions. I would say that religious people give more money and volunteer more time. I would say that this effect might be limited to their own communities, or that it might be selection rather than causation. I would say that Scandinavia exists. You know all of that. A third of you study it for a living, a third of you fund it, and the rest of you live it. We do not need a tour of a debate we already know. We need to find the work that is actually left to do.

  So I want to start by suggesting that the question in our title is not one question. It is at least three questions wearing one coat, and each one asks for a different kind of evidence and a different sense of the word better. The first question is straightforward: do people who practice a religion behave, on the whole, in ways that outsiders would call better? The second question is harder: does the practice make them behave that way, or does it simply attract and retain people who would have behaved that way anyway? But the third question is the one I think we have been avoiding, and it is the one I hope you will carry into the sessions today. If the practice does make them behave that way, what is doing the work? Is it the teaching? Is it the ritual? Is it the community? Is it the fear of being watched? Or is it simply the fact of having a weekly appointment with people who would notice your absence? Call this the scaffolding hypothesis if you need a name for it. I suspect it is the most interesting possibility, partly because it implies that the moral content of a tradition may be the least of what the tradition contributes, and partly because it suggests that a secular society could rebuild the scaffold out of different materials. But if that is true, someone in this room has to say what those materials are.

  This brings me to the word better, which I want us to handle honestly rather than resolve. We have a measurement problem. A religious community's own yardstick is partly internal. It measures fidelity to a code the tradition supplies, and it will not be impressed by a study showing that its members are no kinder to strangers than anyone else. Our yardstick is external and mostly about behavior toward people who cannot reciprocate. Those are not the same instrument. I want you to feel that discomfort. I want us to acknowledge the discomfort that we secular funders smuggle our own conception of the good into what we present as neutral measurement. That is our own version of the mistake we spend our time accusing other people of. We are not neutral observers here. We are participants with a stake in the outcome, and if we define better only in ways that secular institutions can achieve, we have rigged the game before we began.

  The second half of our time together should turn on trust, because that is what this workshop is really about. We need a distinction that this room can carry into the next two days. I want to distinguish between trusting someone because you can predict them and trusting someone because you are counting on their goodwill. The first kind of trust exists because incentives, contracts, reputation, or the law will hold the other person in line. You trust the bank not because you believe the teller loves you, but because you know the vault is locked and the cameras are recording. The second kind of trust exists because you believe the other person would have to be talked into letting you down. They could hurt you without consequence, but they won't. The first kind scales. Markets and states manufacture predictive trust in enormous quantities. I suspect it is what many people mean when they say trust has collapsed, when what they actually mean is that only the first kind is left. The second kind is what small communities, religious or not, seem to produce. I have not been shown a secular institution that produces goodwill trust at scale. If you think that is wrong, this is a good place to say so and to name the counterexample. Do not let us leave this room assuming it can be done without seeing the blueprint.

  I want to end by costing us something. My foundation has been funding secular substitutes for the things congregations do. We fund community building, we fund ritual creation, we fund mutual aid networks, we fund the weekly appointment. We do this because we believe that the scaffold can be rebuilt without the doctrine. I want the audience, and I want myself, to feel the size of the assumption underneath that work. We are betting that the mechanics of trust are separable from the metaphysics of belief. We are betting that you can keep the structure without the foundation that originally held it up. If we are wrong, we will have spent a decade discovering it. I would rather you leave this room uneasy and specific than reassured and vague. I would rather you challenge the scaffolding hypothesis than nod at it. I would rather you tell me that goodwill trust cannot be manufactured by program officers than tell me that everything is complicated. We have two days. Let us find out if the promise can be kept, and who exactly is holding it. Thank you.
