prompt: |-
  I'm taking a course on ethics and public life and I've ended up with a practical assignment I actually care about. Next term I'm doing a placement with a small NGO that runs water projects in four countries, and my supervisor there asked me to write the gift-and-hospitality rule for field staff, since right now it's just "no bribes, use your judgement" and everyone hates it. Our field staff deal with offers constantly and the stakes are real — we get audited by a big funder, and my supervisor has to sign the rule off before it goes out.

  The hard part is that most of what gets offered is just ordinary social life. A village chief gives us a goat when the well is finished. A supplier offers to fly one of our engineers out to see the factory. A district officer invites two of our staff to his daughter's wedding. And customs always wants a "processing fee" to release the medical supplies.

  Can you turn the philosophy on corruption into a procedure my staff could actually run? A few things it has to do. It should give the questions to ask, in order, and say where the procedure stops with a no. It needs to take seriously that people mean at least three different things by corruption — abusing a public office for private gain, an agent quietly serving a third party's interest instead of the person they're acting for, and acting against the public interest even when nobody privately gains — because these pick out different cases, and the goat only looks obviously bad on one of them. It shouldn't pretend a blanket no-gifts norm is culturally neutral: I want it to separate what's just local colour from what genuinely travels, and to say which is which out loud instead of smuggling in a Western standard. And it should handle the fact that bribery is often not one bad apple's choice but a stable equilibrium, where everyone expects everyone else to pay, so the individual who refuses just loses — that changes what the rule can fairly demand of a person.

  Then run it on those four cases, tell me which of the answers will make my supervisor unhappy, and flag where the procedure has to hand the decision back to a human because it's a value call rather than a fact, since I have to admit that in the write-up. No reading list needed, I can't get to the library before it's due lol.
reasoning: |-
  Here's a thinking process that leads to the suggested gift-and-hospitality policy:

  1.  **Analyze the Request:**

      *   **Context:** Student in ethics/public life course, placement with a small NGO (water projects, 4 countries).
      *   **Task:** Write a practical gift-and-hospitality rule/procedure for field staff.
      *   **Current State:** "No bribes, use your judgement" (ineffective, hated).
      *   **Constraints/Requirements:**
          *   Must be a step-by-step procedure (questions in order, stop points).
          *   Must address three definitions of corruption:
              1.  Abuse of public office for private gain.
              2.  Agent serving a third party's interest (betrayal of principal).
              3.  Acting against public interest (even without private gain).
          *   Must avoid cultural imperialism (distinguish "local colour" vs. universal norms).
          *   Must acknowledge systemic corruption/equilibrium (not just "bad apples").
          *   Must apply the procedure to four specific cases (Goat, Factory Flight, Wedding, Customs Fee).
          *   Must identify which answers will make the supervisor unhappy.
          *   Must flag where human judgment is required (value calls).
          *   No reading list (practical focus).

  2.  **Deconstruct the Ethical Framework:**

      *   *Corruption Definition 1 (Public Office/Private Gain):* Classic bribery. Easy to spot (Customs fee).
      *   *Corruption Definition 2 (Principal/Agent Problem):* Loyalty to the NGO vs. the Supplier/Official. (Factory flight).
      *   *Corruption Definition 3 (Public Interest):* Does this harm the mission or community trust? (Goat, Wedding).
      *   *Cultural Sensitivity:* Refusing a gift can be an insult. Accepting can be a debt. Need a "Reciprocity vs. Obligation" test.
      *   *Systemic Equilibrium:* If everyone pays the customs fee, refusing might stop the medical supplies. The policy needs a "Safety/mission-critical" escape valve, but with reporting.

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Goal:* Make it flow like a decision tree.
      *   *Step 1: Intent & Quid Pro Quo.* Is something expected in return? (Stops most bribery).
      *   *Step 2: Value & Frequency.* Is it trivial/social or substantial? (Handles the Goat vs. Car).
      *   *Step 3: Cultural Context.* Is refusing an insult? (Handles the Wedding).
      *   *Step 4: Loyalty & Conflict.* Does this shift loyalty? (Handles the Flight).
      *   *Step 5: Public Interest/Systemic.* Does this harm the mission or community trust? (Handles the Customs Fee dilemma).
      *   *Step 6: Reporting.* Transparency is key.

      *Refining for the Prompt's Specific Ethical Demands:*
      *   Need to explicitly name the three corruption types in the logic.
      *   Need to explicitly address the "equilibrium" problem (i.e., when refusing causes harm).
      *   Need to distinguish "Local Colour" (social glue) from "Corruption" (undermining integrity).

  4.  **Developing the Cases:**

      *   *Case 1: The Goat.*
          *   Analysis: Social ritual, completion marker. Low private gain. High cultural significance.
          *   Verdict: Accept (with sharing/reporting).
      *   *Case 2: The Factory Flight.*
          *   Analysis: Supplier paying. Potential loyalty shift. Private gain (travel).
          *   Verdict: Decline (or NGO pays).
      *   *Case 3: The Wedding.*
          *   Analysis: Social, but high value (hospitality). Risk of perceived obligation.
          *   Verdict: Conditional (Small gift yes, full trip no).
      *   *Case 4: The Customs Fee.*
          *   Analysis: Systemic corruption. Refusal halts mission (Public Interest harm). Payment validates corruption.
          *   Verdict: The hardest one. Pay only if mission-critical, but report and escalate.

  5.  **Identifying Supervisor Friction Points:**

      *   Supervisors usually want bright lines ("No Gifts").
      *   Nuance creates liability.
      *   *Friction 1:* Allowing the Goat (looks like asset acceptance).
      *   *Friction 2:* Allowing the Customs Fee (looks like authorizing bribery).
      *   *Friction 3:* Requiring human judgment calls (reduces legal shielding).

  6.  **Flagging Value Calls:**

      *   Where does the algorithm stop and the human start?
      *   Determining "Cultural Insult."
      *   Determining "Mission Critical."

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, practical, ethically robust, not academic.
      *   *Structure:*
          1.  Introduction (Philosophy into Procedure).
          2.  The Decision Procedure (The Flowchart).
          3.  Application to Cases.
          4.  Supervisor Friction Points.
          5.  Value Call Flags.

      *(Self-Correction during drafting)*: Make sure I don't just say "No Bribery." I need to use the three definitions provided in the prompt.
      *   Def 1: Public Office/Private Gain.
      *   Def 2: Agent/Principal Betrayal.
      *   Def 3: Public Interest Harm.
      *   *Integration:* I will embed these into the "Stop" conditions of the procedure.

      *(Refining the Customs Fee)*: This is the trickiest. If I say "Pay it," is that ethical? If I say "Don't pay," supplies rot. The prompt asks to handle the "stable equilibrium." The ethical move is "Pay to save lives, but document and work to change the system." This distinguishes *survival* from *complicity*.

      *(Refining Cultural Neutrality)*: Explicitly state that "Zero Tolerance" is a Western export that can damage local trust. The policy must distinguish *Relationship Building* (Good) from *Obligation Creating* (Bad).

  8.  **Final Review against Constraints:**
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Three corruption definitions addressed? Yes.
      *   Cultural neutrality addressed? Yes.
      *   Systemic equilibrium addressed? Yes.
      *   Four cases run? Yes.
      *   Supervisor unhappiness flagged? Yes.
      *   Value calls flagged? Yes.
      *   No reading list? Yes.

  9.  **Final Polish:** Ensure the voice sounds like a practical policy document mixed with ethical commentary suitable for the assignment. (Proceed to generate output).

  *(Self-Correction on "Supervisor Unhappiness")*: I need to be specific. Why will they be unhappy? Liability, audit risk, ambiguity.
  *(Self-Correction on "Value Calls")*: I need to clearly mark where the procedure says "Consult Manager" vs "Decide Yourself."

