answer: |-
  The short answer is that there is no single, standard principle that captures all five of your verdicts simultaneously. Your reasoning toggles between two distinct concepts: **Rationalizability** (which saves strategy B in Game C) and **Iterated Weak Dominance** (which eliminates strategies B and R in Game D). These two concepts are logically incompatible in the way you are applying them.

  To be precise, your verdicts align with **Rationalizability** in Games A, B, C, and E, but switch to **Trembling-Hand Perfection** (or a specific order of Weak Dominance) in Game D. Below is the breakdown of why this conflict exists, followed by answers to your specific questions about mixtures, order independence, and multi-player extensions.

  ### The Principle Behind Your Verdicts

  Your judgments rely on a hybrid rule that I will call **Conditional Dominance**:
  > *Eliminate a strategy if it is strictly dominated (by pure or mixed strategies). If it is only weakly dominated, eliminate it only if doing so does not remove a strategy that is a best response to some undominated opponent strategy, unless the opponent is also eliminating a weakly dominated strategy.*

  Here is how this maps to your games:

  *   **Games A, B, E (Strict Dominance):** In all three, the eliminated strategies (B in A, M in B, B/M/C/R in E) are **strictly** dominated. In two-player games, a strategy is strictly dominated if and only if it is **never a best response** to any belief about the opponent. Your verdicts here match the principle of **Rationalizability**: keep only strategies that could be a best response to some rational belief.
  *   **Game C (The Rationalizability Anchor):** Here, T weakly dominates B. However, B is a best response if the Column player plays L (payoffs are tied at 2). Under Rationalizability, you must keep B. Your verdict ("do not cross off B") follows Rationalizability. You reject Weak Dominance here because eliminating B would discard a viable best response.
  *   **Game D (The Dominance Switch):** Here, T weakly dominates B, and L weakly dominates R. Both B and R are best responses (B to L, R to T). Rationalizability demands you keep them. However, your verdict is to **eliminate** them. This follows **Iterated Weak Dominance**. You are prioritizing the "safety" of the dominant strategies (T and L) over the "possibility" of the tied best responses.

  **The Conflict:** You cannot consistently hold both verdicts.
  1.  If you adopt **Rationalizability** (keep all best responses), you must keep B in Game C (which you do) AND keep B and R in Game D (which you don't).
  2.  If you adopt **Weak Dominance** (eliminate never-better strategies), you must eliminate B in Game D (which you do) AND eliminate B in Game C (which you don't).

  Your intuition in Game D is likely driven by the fact that *both* players have weakly dominated strategies, creating a "mutual fragility" that suggests the weakly dominated options are unstable. In Game C, only the Row player has a dominated strategy, so you feel less pressure to eliminate. However, standard theory does not support this distinction; logically, B is equally "weakly dominated" in both games.

  ### (a) Mixtures vs. Pure Strategies in Elimination

  You asked whether it is legitimate to compare a strategy against a mixture (as in Game B) rather than just pure strategies.

  **Verdict:** In two-player games, allowing mixtures is not just legitimate; it is necessary to capture all rational reasoning.
  **Reasoning:** A strategy is rationalizable if it is a best response to *some* belief. A belief is a probability distribution over the opponent's strategies (a mixture). If a strategy is never a best response to any such mixture, it is mathematically equivalent to being strictly dominated by some mixture of your own strategies.
  In Game B, strategy M is not strictly dominated by T alone, nor by B alone. It is only dominated by the *mix* of T and B. If you restricted yourself to pure-strategy dominance, you would have to keep M. But M is irrational because no matter what probability the Column player assigns to L or R, T or B (or a mix) yields a higher expected payoff. Therefore, the "mixture test" is the honest version of the principle "do not play a strategy that is never optimal."

  ### (b) Order Independence: Strict vs. Weak Dominance

  You noticed that Strict Dominance (Games A, B, E) is order-independent, while Weak Dominance (Game D) is not.

  **Reasoning:**
  *   **Strict Dominance:** If strategy X is strictly worse than Y, it is worse by some positive margin $\epsilon$. Removing other strategies from the game cannot shrink this margin to zero. If X is strictly dominated in the full game, it remains strictly dominated in any sub-game. Thus, the order of removal does not change the set of survivors.
  *   **Weak Dominance:** If strategy X is weakly worse than Y, they may be equal in some cases and X is worse in others. Elimination relies on those "worse" cases. If you remove the opponent's strategy that created the "worse" case, X and Y might become identical.
      *   In Game D, T weakly dominates B because T is better against R. If you eliminate R first, T and B become identical against the remaining L. T no longer dominates B. Thus, the survivor set depends on whether you eliminate R or B first.

  ### (c) "Strictly Dominated by Mixture" vs. "Never a Best Reply" (3+ Players)

  You asked if these two tests always agree.
  **In Two-Player Games:** Yes, they coincide. If a strategy is never a best reply to any belief, it is strictly dominated by some mixture.
  **In Three-Player Games:** They can come apart.
  **How they come apart:** In games with three or more players, your opponents can correlate their strategies.
  *   **Never a Best Reply:** This test assumes you can have *any* belief about the opponents, including correlated beliefs (e.g., "If Player 2 plays Up, Player 3 definitely plays Left").
  *   **Dominated by Mixture:** This test assumes opponents mix *independently*.
  *   **The Gap:** A strategy might not be dominated by any mixture of your own strategies (assuming independent opponents), yet it might never be a best reply if the opponents are allowed to correlate.
  **Impact on Verdicts:** If you move to three players, the "Never a Best Reply" test becomes more aggressive. It will eliminate strategies that the "Dominated by Mixture" test keeps. If you want to maintain the principle "never play a strategy that isn't optimal," you must use the "Never a Best Reply" test, which acknowledges the possibility of correlation among opponents.

  ### (d) The "Survives Every Order" Idea

  You proposed keeping only strategies that survive *every* possible order of elimination.
  **Coherence:** This set will never be empty. Every finite game has at least one Nash Equilibrium, and the strategies constituting a Nash Equilibrium will survive *some* order of weak dominance elimination. The intersection of all orders (the "robust" set) typically corresponds to the strategies played in **Trembling-Hand Perfect Equilibria**.
  **Implication:** This is a very strict filter.
  *   In **Game D**, this filter works for you: it eliminates B and R, leaving (T, L).
  *   In **Game C**, this filter fails you: it eliminates B. Since T weakly dominates B, there exists an elimination order (remove B first) where B is gone. Since B does not survive *every* order, your rule would force you to cross it off.
  **Conclusion:** This idea rescues Game D but sacrifices Game C. It confirms that your desire to keep B in C but drop B in D is incompatible with any order-independent elimination procedure based on dominance.

  ### Summary Recommendation

  To resolve your stuckness, you must choose a single standard:

  1.  **Consistency via Rationalizability:** Keep B in Game C (as you did) and keep B and R in Game D. This admits that weakly dominated strategies can be rational if they are best responses to specific opponent choices.
  2.  **Consistency via Perfection:** Eliminate B in Game C and eliminate B and R in Game D. This assumes players make small mistakes ("trembles"), making weak dominance decisive in all cases.

  Your current position is a hybrid that values **stability** in Game D (preferring the robust T/L equilibrium) but values **possibility** in Game C (refusing to rule out the B/L equilibrium). While intuitively appealing, it lacks a single axiomatic foundation. If forced to choose the more "honest" version of rationality without assuming mistakes, **Rationalizability** (Verdict 1) is the standard choice. If you wish to solve coordination problems like Game D, you must accept the cost of eliminating viable strategies in games like C.
