  Dear Colleague,

  I have been reflecting on our stalled discussion regarding the withdrawal clause, specifically the tension between selecting a rule that maximizes the average payout versus one that guarantees a secure floor for both parties. Since we are drafting this clause behind a veil of ignorance, where none of us knows whether we will be the withdrawing member or the remaining co-operative body years from now, the defensibility of any rule depends heavily on our attitude toward risk. In the context of a continuing agricultural co-operative, I believe we must prioritize the floor over the average. My reasoning is that the co-operative itself is a shared asset whose survival benefits all members through ongoing patronage, whereas a one-time exit payout benefits only the leaver. If a rule allows for scenarios where the co-operative is drained of equity, the long-term expected value for everyone collapses to zero. Therefore, my ranking commits me to the view that ex ante rationality in this setting requires risk aversion, giving significant weight to the worst-case outcome for the collective entity rather than the maximum potential gain for an individual. Based on this principle, I rank the egalitarian rule as the most defensible, followed by the Nash product rule, the Kalai–Smorodinsky rule, the equal-sacrifice rule, and finally the utilitarian rule as the least defensible.

  The utilitarian rule, which maximizes the sum of payoffs at ten thousand for the member and zero for the co-operative, must be rejected despite offering the highest average return. Behind the veil, while we might hope to be the withdrawing member receiving the full sum, the risk of being on the side of the co-operative receiving nothing is catastrophic for the organization's continuity. This rule creates a perverse incentive structure that counts heavily against it at the drafting stage. A member could game this rule simply by timing their withdrawal to coincide with peak liquidity, arguing that any retention by the co-operative reduces the total sum, effectively liquidating their share of the retained earnings needed for future operations. This manipulability is not irrelevant ex ante because it threatens the stability of the very entity generating the equity; a rule that invites members to treat the co-op as a liquidation vehicle undermines the mutual aid principle we are trying to codify.

  Next is the equal-sacrifice rule, which lands at roughly six thousand for the member and two thousand for the co-operative. While this improves the co-operative's position compared to the utilitarian rule, it still leaves the co-operative with less than half of its ideal feasible payoff, creating a significant vulnerability. The defensibility here is weak because it relies on a definition of sacrifice that can be manipulated. A member could game this rule by inflating their claimed ideal payoff during the valuation process; since the rule equalizes the shortfall from the ideal, arguing for a higher maximum potential equity share increases the calculated sacrifice the co-operative must match, thereby shifting more value to the member. This manipulability should count against the rule ex ante because it invites contentious valuation disputes exactly when the relationship is fracturing, increasing legal costs and uncertainty for both parties.

  The Kalai–Smorodinsky rule ranks in the middle, offering a proportional split where both parties achieve about fifty-eight percent of their ideal payoffs. This is more defensible than equal sacrifice because it leaves the co-operative with a larger share of its potential equity, roughly three and a half thousand, which better protects the collective interest. However, like the equal-sacrifice rule, it is dependent on the ideal points of the parties. A member could game this by lobbying for a valuation methodology that maximizes their specific ideal point relative to the co-operative's, skewing the proportionality in their favor. While this is less extreme than the utilitarian outcome, the reliance on contested ideal points introduces a layer of ambiguity that reduces its suitability as a fixed standing clause. We should prefer rules that rely on the feasible frontier itself rather than hypothetical maximums that are easier to manipulate.

  The Nash product rule is the second most defensible option, balancing efficiency and equity by maximizing the product of the payoffs. It yields a higher total sum than the egalitarian rule while ensuring the co-operative retains a substantial portion of equity, over four thousand. This makes it a strong compromise for risk-averse members who still care about efficiency. However, it is susceptible to gaming through threats that alter the feasible frontier. A withdrawing member might threaten to take key customers or suppliers with them, effectively reshaping the bargaining set to make the co-operative's position more desperate, which would shift the Nash solution in the member's favor. This manipulability counts against it ex ante because it incentivizes hold-up behavior, though less so than the rules ranked lower, as the Nash solution is somewhat robust to minor changes in the frontier shape compared to rules dependent on ideal points.

  Finally, the egalitarian rule is the most defensible ex ante default because it maximizes the minimum payoff for either party, ensuring that neither the member nor the co-operative falls below roughly four and a half thousand. This directly addresses the floor argument that dominated our meeting, providing the highest security for the worst-case scenario regardless of which side of the table we end up on. By guaranteeing that the co-operative retains enough equity to remain viable while ensuring the member receives a fair share, it aligns best with the long-term interests of the membership. A member could potentially game this rule by timing their withdrawal to coincide with periods of high co-operative liquidity, ensuring the equal split yields a higher absolute cash value, or by attempting to classify more value as member payoff rather than co-operative retention during the accounting phase. However, this manipulability is less damaging than in the other cases because the rule creates a focal point for fairness that discourages aggressive bargaining; the clarity of the equal split reduces the scope for dispute, which is a significant virtue for a standing clause intended to prevent litigation. In conclusion, by choosing the egalitarian rule, we signal that the stability of the co-operative and the security of the individual member are equally paramount, which is the only sustainable foundation for a member-owned enterprise facing an uncertain future.
