  2. The theory

  The set-theoretic multiverse view posits that there is no single, intended cumulative hierarchy of sets, often denoted as $V$. Instead, there exists a plurality of distinct set-theoretic universes, each satisfying the ZFC axioms but potentially differing on independent statements like CH. On this view, CH possesses no absolute truth value; it is true in some universes and false in others, much like the parallel postulate is true in Euclidean geometry but false in hyperbolic geometry. The theory denies Universism, the claim that there is a unique background reality against which all set-theoretic statements are evaluated. Consequently, the goal of set theory shifts from discovering the truth about *the* universe to mapping the relationships and possibilities across the multiverse. Truth becomes relative to a specific universe, though logical consequence remains absolute within the multiverse framework. This perspective treats different models not merely as formal artifacts but as equally real mathematical domains. It suggests that our axiomatic systems describe local features of this broader landscape rather than defining a singular ontology. The multiverse view thus reinterprets independence not as a failure of axioms to capture reality, but as a reflection of the inherent diversity of set-theoretic existence.

