  ### The Case: The Municipal Health Allocation

  **Setting:** A municipal public health department has a surplus budget sufficient to fully fund exactly one of two specialized treatment programs. The budget cannot be split.

  **Agents:**
  *   **Person $A$:** Suffers from a mobility-impairing condition (e.g., severe arthritis).
  *   **Person $B$:** Suffers from a respiratory-impairing condition (e.g., severe asthma).

  **Policies:**
  *   **Policy $P_1$ (Mobility Fund):** Fully funds the mobility clinic.
  *   **Policy $P_2$ (Respiratory Fund):** Fully funds the respiratory clinic.

  **Baseline and Anchoring:**
  The welfare scale for both persons is anchored at a common, stipulated zero point: **The State of Neutral Functioning.** This is defined clinically as the threshold where a person can perform basic activities of daily living without assistance or pain, but derives no positive enjoyment from health specifically (health is merely transparent).
  *   Status Quo (No Funding): Both $A$ and $B$ are below zero (in pain/distress). For the sake of the comparison, we normalize the Status Quo to **0** for both, treating the policies as gains from this specific baseline.
  *   **Feature 1 (Preferences):** Both agents strictly prefer their specific treatment to the other. $A$ ranks $P_1 \succ P_2$; $B$ ranks $P_2 \succ P_1$. These preferences are based solely on their own physical relief, not on envy or relative status.
  *   **Feature 2 (Anchored Levels):** The clinical assessment stipulates the following welfare levels relative to the Neutral Functioning anchor (0):
      *   Under $P_1$: $A$ achieves "Full Mobility" (Level 10). $B$ achieves "Slight Air Quality Improvement" (Level 2).
      *   Under $P_2$: $A$ achieves "Slight Mobility Aid" (Level 4). $B$ achieves "Full Breathing Ease" (Level 8).
      *   *Constraint Check:* Because the zero point is common and the levels are stipulated as cardinal observations from a shared clinical metric (e.g., "distance from neutral functioning"), we can say without further assumption that under $P_1$, $B$ (2) is worse off than $A$ (10). Under $P_2$, $A$ (4) is worse off than $B$ (8).
  *   **Feature 3 (Unfixed Units):** The case supplies **no** information about the *intensity* or *value* of a single welfare unit for $A$ compared to $B$. We know $A$ is at 10 and $B$ is at 2, but we do not know if $A$'s "10 units of mobility welfare" is equivalent in moral weight or experiential magnitude to $B$'s "10 units of respiratory welfare." The conversion rate between $A$-units and $B$-units is indeterminate.

  ---

  ### The Demonstration

  #### 1. The Purely Ordinal Framework
  A framework that admits only ordinal non-comparable utility (standard social choice theory) looks only at the ranking of outcomes for each individual.
  *   $A$ prefers $P_1$ to $P_2$.
  *   $B$ prefers $P_2$ to $P_1$.
  *   **Verdict:** The framework declares a **deadlock**. It cannot rank the policies because any aggregation would require interpersonal comparisons which are ruled out. It can only identify that $P_1$ and $P_2$ are Pareto-non-comparable.

  #### 2. The Level-Anchored Rule (Leximin)
  The Leximin rule ranks social states by comparing the welfare level of the worst-off person first; if tied, it compares the next worst-off. It requires level comparability (who is lower?) but not unit comparability (how much lower?).
  *   **Under $P_1$:** The welfare vector is $(10, 2)$. The worst-off is $B$ at level **2**.
  *   **Under $P_2$:** The welfare vector is $(4, 8)$. The worst-off is $A$ at level **4**.
  *   **Comparison:** Since $4 > 2$ (a comparison of levels anchored at the common zero), Leximin ranks **$P_2 \succ P_1$**.
  *   **Verdict:** Determinate. $P_2$ is preferred because it raises the minimum welfare level higher than $P_1$ does.

  #### 3. The Difference-Based Rule (Utilitarianism)
  Utilitarianism sums the welfare levels. This requires unit comparability. Since the case leaves units unfixed, we must test the verdict under different admissible unit scalings. Let $k$ be the conversion factor of $B$'s units into $A$'s units (i.e., $1 \text{ unit}_B = k \text{ units}_A$).

  *   **Scaling 1 (Symmetric Units, $k=1$):**
      *   $P_1$ Sum: $10 + 2(1) = 12$.
      *   $P_2$ Sum: $4 + 8(1) = 12$.
      *   **Verdict:** Indifference ($P_1 \sim P_2$).

  *   **Scaling 2 ($A$'s Welfare is More Intense, $k=0.5$):**
      *   Suppose $B$'s units are "smaller" (less valuable/intense) than $A$'s.
      *   $P_1$ Sum: $10 + 2(0.5) = 11$.
      *   $P_2$ Sum: $4 + 8(0.5) = 8$.
      *   **Verdict:** **$P_1 \succ P_2$**.

  *   **Scaling 3 ($B$'s Welfare is More Intense, $k=2$):**
      *   Suppose $B$'s units are "larger" (more valuable/intense) than $A$'s.
      *   $P_1$ Sum: $10 + 2(2) = 14$.
      *   $P_2$ Sum: $4 + 8(2) = 20$.
      *   **Verdict:** **$P_2 \succ P_1$**.

  *   **Dependence:** The Utilitarian reversal depends entirely on the premise of **Unit Comparability**. Because the case stipulates that nothing fixes the size of the welfare unit, the Utilitarian verdict is indeterminate without an arbitrary choice of $k$.

  ---

  ### Analysis of the Case

  #### The Single Feature Doing the Work
  The feature driving the disagreement is the **decoupling of origin comparability from unit comparability**.
  The case stipulates a common zero point (Neutral Functioning), which allows level comparisons (Leximin) to function. However, it withholds a common unit of measurement (intensity/value of a unit), which prevents difference-based aggregation (Utilitarianism) from yielding a unique solution. The disagreement is not about the facts of the levels (everyone agrees $B$ is at 2 under $P_1$), but about the **metric of aggregation**.

  #### The Common Good Test
  If we introduce a common good whose value is measurable and comparable—for example, a cash equivalent that both $A$ and $B$ value linearly and identically—the case collapses into a standard utilitarian calculation.
  *   *Modification:* Suppose the budget could alternatively be given as cash. $A$ would trade 10 welfare units for \$100. $B$ would trade 8 welfare units for \$100.
  *   *Result:* The cash provides a "bridge" numeraire. We can now infer that $A$'s 10 units $\approx$ \$100 and $B$'s 8 units $\approx$ \$100. Thus, $1 \text{ unit}_A \approx 0.8 \text{ units}_B$.
  *   *Collapse:* The unit ratio is now fixed by the market behavior. Utilitarianism becomes determinate. The ambiguity vanishes because the common good forces unit comparability.

  #### The Hedonist Attack
  **The Attack:** A theorist who holds that welfare is a single determinate quantity (e.g., a classical hedonist) would attack the case's coherence. They would argue that if welfare is a natural kind (e.g., "net pleasure"), then **origin comparability entails unit comparability**. If we can say $A$ and $B$ are both at "0 pleasure," and $A$ is at "10 pleasure" while $B$ is at "2 pleasure," the "pleasure meter" must be the same for both. To claim the units are different is to claim that "pleasure" means something different for $A$ than for $B$, which contradicts the definition of welfare as a single universal currency. Therefore, the case stipulates a metaphysical impossibility.

  **Does the Attack Succeed?**
  *   **In Principle:** Yes. If welfare is a singular natural property, the measurement scale must be unique. The "unfixed unit" is an epistemic gap, not an ontological one.
  *   **In Practice:** No. The attack fails to resolve the policy problem. Even if a fact of the matter exists about the conversion rate $k$, the case demonstrates that **we do not have access to it**. For the purpose of public justification and policy selection, the indeterminacy remains. The disagreement between Leximin and Utilitarianism is thus revealed as a disagreement about **decision rules under uncertainty**: Leximin relies on the observable levels (which are anchored), while Utilitarianism relies on unobservable intensities (which are not). The case successfully shows that without a bridge for unit comparability, Utilitarianism lacks a public basis for calculation, whereas Leximin retains one.

  ### Conclusion
  This case demonstrates that the disagreement between aggregation rules is not merely an artifact of measurement error, but a structural consequence of which informational inputs one deems admissible. Leximin requires only level information (provided by the anchor); Utilitarianism requires unit information (withheld by the case). Consequently, the Utilitarian verdict is unstable, while the Leximin verdict remains robust within the stipulated constraints.
