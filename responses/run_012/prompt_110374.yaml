      *   **The Case:** 400-year occupation, 200 houses. Unused querns under every hearth floor. Single distant quarry (100km), no other stone from there. Uniform position relative to hearth across time.
      *   **The Challenge:** Why is this "belief" and not just "convention" (rule-following without content)? What does "belief" explain that "convention" doesn't? Why not just "fondness" or "conspicuous waste"?

  2.  **Deconstruct the Challenge:**
      *   The user is arguing for a behaviorist or practice-theory approach: rules can exist without cognitive content (belief). "This is how it is done" is sufficient.
      *   My job is to argue that the *cost* and *uniformity* over *time* imply a motivational structure that mere convention lacks stability to sustain.
      *   I need to define what "belief" adds: It provides the *sanction* or the *consequence* that enforces the convention across generations without central authority.
      *   I need to address the "lesser content" (fondness, waste) argument.

  3.  **Drafting the Response:**
      *   *Paragraph 1: Acknowledge the validity of the challenge (convention vs. belief) but pivot to the cost and stability.*
          *   Admit that "convention" explains the *pattern*, but not the *persistence* against economic rationality.
          *   The key is the "materially pointless" aspect combined with "costly" (100km transport).
          *   Argument: Conventions without belief-based sanctions decay when utility fades or costs rise. Belief provides the "why" that survives generational turnover.
          *   Distinguish observed (unused stone, distance, position) from inferred (motivational structure).
      *   *Paragraph 2: Address the "lesser content" and falsifiability.*
          *   Why not "fondness"? Fondness is individual/variable. This is uniform.
          *   Why not "conspicuous waste"? Usually status-marked (some have more, some less). This is *every* house.
          *   What belief explains: It links the act to a consequence outside the material realm (e.g., house stability, ancestral protection), making the cost a necessary investment rather than a loss.
          *   Falsifiability: If I find evidence of practical use elsewhere, or if the placement varies with status, I retreat.
          *   Ethnographic analogy (flagged): Foundation deposits in Mesopotamia/Levant (licensed because architectural context is similar).

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check Rule:* "Every appeal to belief must come with an account of what it buys that a non-belief explanation does not."
