  You draw a sharp line between practice and cognition, and I concede that convention describes the *mechanism* of transmission better than belief does. If this were a matter of style—say, pot rim shapes or decorative motifs—I would agree that "this is how it is done" suffices to explain the pattern. But you are overlooking the economic friction here. Transporting stone 100 kilometers for a functionally useless object is a significant energy expenditure repeated identically for four centuries. A bare convention lacks the coercive force to sustain high-cost behavior across generations without a centralized authority enforcing it, for which we have no evidence in this settlement layout. Belief enters the inference not to explain the pattern's existence, but its *resilience*. It posits a perceived sanction—a risk understood by the actors—that makes the cost of compliance lower than the cost of violation. Without inferring that shared cognitive content, the persistence of such inefficiency becomes statistically improbable.

  As for "lesser content," fondness is too variable to produce this uniformity, and conspicuous waste is typically competitive, resulting in differentiation between houses, not universal equality. What belief buys us is the explanation for the *universality* of the cost. I am inferring a specific content: that the hearth's efficacy or the household's safety was ontologically tied to this specific stone's placement. I flag an ethnographic analogy here: foundation deposits in Near Eastern archaeology, licensed because the architectural context (hearth/floor interface) and the object's removal from practical circulation are structurally identical. I would abandon this reading if excavation revealed even a single house lacking the deposit, or if petrographic analysis showed locally available stone was rejected despite lower cost—suggesting supply chain issues rather than selection. But until then, the costliness demands a motivation stronger than habit.
