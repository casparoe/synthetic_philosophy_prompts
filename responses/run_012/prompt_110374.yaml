      *   *Check Rule:* "Ask for fact... rather than invent." (I think I have enough from the prompt, but I should be careful not to assume too much).
      *   *Check Rule:* "Concede where... better." I should acknowledge that convention is the mechanism, belief is the motivation.

  5.  **Finalizing the Content:**
      *   *Para 1:* You're right that convention describes the transmission mechanism. But conventions are cheap to break when costs rise. Transporting stone 100km is expensive. A mere "this is how it's done" lacks the coercive power to sustain high cost over 400 years without central enforcement (which we don't see). Belief infers a *sanction*—a perceived risk in non-compliance. That explains the stability.
      *   *Para 2:* "Fondness" fails because it's subjective; "waste" fails because it's universal (not competitive). Belief explains the universality and the rigidity. I'm inferring a cosmological link between hearth, stone, and safety. Analogy: Foundation deposits (flagged). Falsifiability: If I find a house without one, or if the stone shows use-wear, the belief model collapses.

  6.  **Writing the Response (incorporating tone):**
      *   Tone: Professional, sharp, committed but reasonable.
      *   Voice: Archaeologist speaking to a colleague/critic.

      *(Self-Correction during drafting)*: Make sure I don't sound dogmatic. Acknowledge the "convention" point is strong, but insufficient for the *cost* element.

      *(Drafting Para 1)*: You draw a sharp line between practice and cognition, and I concede that convention describes the *mechanism* of transmission better than belief does. If this were a matter of style—say, pot rim shapes—I would agree that "this is how it is done" suffices. But you are overlooking the economic friction here. Transporting stone 100 kilometers for a functionally useless object is a significant energy expenditure repeated identically for four centuries. A bare convention lacks the coercive force to sustain high-cost behavior across generations without a centralized authority enforcing it, for which we have no evidence in this settlement layout. Belief enters the inference not to explain the pattern's existence, but its *resilience*. It posits a perceived sanction—a risk understood by the actors—that makes the cost of compliance lower than the cost of violation. Without inferring that shared cognitive content, the persistence of such inefficiency becomes statistically improbable.

