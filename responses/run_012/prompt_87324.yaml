  - Errors and imprecisions: the longest section, roughly 350–450 words. Go point by point. For each item, state what the answer says, whether it is plainly wrong or merely imprecise, and what the correct formulation would be.
  - Borderline calls: roughly 100 words, covering claims that are defensible but arguable rather than clearly mistaken.
  - Settled versus contested: roughly 120 words, distinguishing the parts of your assessment that rest on settled points about the argument from those that depend on contested interpretations. Do not present a contested reading as though it were the consensus.
  - What a full-credit answer would add: roughly 100 words.
