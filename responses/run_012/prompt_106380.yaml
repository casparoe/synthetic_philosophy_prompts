answer: |-
  Here is a concrete example designed to isolate the structural puzzle you are describing, followed by a statement of the conceptual issue it exposes.

  ### The Example: The Collapsed Shaft

  Imagine a mining accident where three workers are trapped at the bottom of a deep, unstable shaft. The only way to get oxygen down to them before they suffocate is to manually lower a canister through a narrow, fractured ventilation pipe.

  **The Baseline:**
  The pipe is structurally unsound. Anyone who climbs down to guide the canister faces a 40% chance of triggering a collapse that would kill them. Because the risk to the rescuer is so disproportionately high compared to the duty of rescue, climbing down is **supererogatory**. No miner is obligated to do it.

  **The Shift:**
  Miner A decides to climb down. They do not bring the oxygen canister yet; instead, they use their own body to brace the fractured walls of the pipe, holding the structure open with immense physical strain. They radio up: "I can hold this for ten minutes, but I can't lift the weight. Someone else has to lower the canister while I brace."

  Because Miner A is now bracing the walls, the risk for the person at the top has dropped from "40% death" to "negligible." The physical act of lowering the canister is now safe, easy, and standard procedure.

  **The Dilemma:**
  Miner B is at the top. Before Miner A climbed down, Miner B was under no obligation to attempt the rescue (it was too dangerous). Now that Miner A has voluntarily entered the shaft, Miner B faces a choice: lower the canister and save the trapped workers, or do nothing and let them (and Miner A) die.

  If Miner B refuses, they are allowing people to die when they could easily prevent it. It seems Miner B is now **obligated** to act.

  ### The Conceptual Issue: The Derivation of Duty from Optionality

  The puzzle you are bumping into is not about risk calculation; it is about **normative authority**.

  If Miner A's supererogatory act transforms Miner B's optional choice into a mandatory duty, then **an optional act has generated a binding obligation for a third party.** This creates a structural instability in moral theory known as **The Contingency Problem**.

  Here is why this is a conceptual wrinkle rather than just a hard case:

  1.  **The Asymmetry of Power:** If supererogatory acts can shift baselines, then Miner A effectively has the power to impose duties on Miner B without Miner B's consent. Miner A can say, "I am doing something heroic, and now you *must* do your part." If Miner B refuses, Miner B looks blameworthy. But how can Miner A's *optional* sacrifice hold Miner B morally hostage?
  2.  **The Collapse of the Category:** If a supererogatory act routinely creates obligations for others to complete the project, then the act wasn't truly "beyond duty" in a systemic sense; it was merely the first half of a collective duty. This suggests that what we call "supererogatory" might just be "distributed obligation" that hasn't been coordinated yet.
  3.  **The Moral Free-Rider:** If Miner B is now obligated, Miner B gets to reap the moral credit of the rescue (by finishing it) while relying on Miner A to absorb the extreme risk. Miner A takes the 40% death risk to make Miner B's duty easy. This creates a perverse incentive structure where the person most willing to suffer dictates the obligations of those less willing to suffer.

  **The Core Question:**
  Can a moral agent, through an act they are not required to perform, alter the normative landscape such that another agent becomes blameworthy for inaction?

  If the answer is **yes**, then supererogation is contagious: it spreads duty.
  If the answer is **no**, then Miner B is free to let everyone die, which implies that Miner A's heroism was morally futile (or that Miner B is not actually obligated, which contradicts our intuition that easy rescue is mandatory).

  Your term "baseline-shifting supererogation" captures this perfectly. The issue is that moral baselines are supposed to be objective features of the situation, but here, the baseline is being moved by a voluntary choice. This makes moral obligation **contingent on the heroism of others**, which threatens the idea that duty is something we owe regardless of what others do.
