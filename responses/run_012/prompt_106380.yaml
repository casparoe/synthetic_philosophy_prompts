prompt: |-
  I've been thinking alot about supererogation lately — acts that are morally good but not required — and I keep bumping into a wrinkle that I can't quite name. The usual examples (the soldier who throws himself on the grenade, the stranger who donates a kidney) are fine as far as they go, but they all treat the heroic act as a one-off that leaves everyone else's obligations exactly where they were. I've been trying to cook up a case where that isn't true, and I keep getting tangled up. What I want from you is an example of a conceptual issue — not just a scenario, but the underlying puzzle — that arises when a supererogatory act shifts the moral baseline for other people. Say someone volunteers for a rescue that no one was obligated to attempt, and because they pull it off, a second person now faces a choice where refusing to help would be much worse than it would have been before the first person acted. Has the first person's going-beyond-duty made the second person's refusal something more than merely "not supererogatory"? Or is the second person still free to decline without blame? I've been calling this "baseline-shifting supererogation" in my notes, though I have no idea if that's a real term or just something I made up in a seminar.

  I'd like a concrete example that makes the puzzle sharp and shows why it's a conceptual issue about the structure of supererogation, not just a hard case about consequences. If the example can avoid the usual trolley-style machinery, even better — I feel like every ethics prompt definately defaults to that, and I'm trying to get away from it. I'm not looking for a reading list or a summary of who said what; I just want the example and a clear statement of the issue it exposes.
