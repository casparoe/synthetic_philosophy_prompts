      *   *Fact 1 (200 configs):* This is classic selection bias. If you test 200 models on a fixed test set, the maximum score is statistically guaranteed to be an overestimate of true performance. This is a *strong* connection between the model selection process and the test set scores. It's not a "coincidence" that the max is high; it's math. This defeats independence.
      *   *Fact 2 (Lab specified distribution):* If the lab specifies the distribution, they might have inadvertently (or intentionally) matched the test distribution to their model's strengths. However, if the field distribution matches the spec, this is less critical. But combined with Fact 1, it weakens the "unbiased" claim.
      *   *Fact 3 (Same family model for filtering):* This is the most dangerous. If the filter model is from the same family, it likely shares blind spots or biases. Items "ambiguous" to the filter might be exactly those the candidate model fails on (or succeeds on). This creates a correlation between the test set construction and the model's error surface.
