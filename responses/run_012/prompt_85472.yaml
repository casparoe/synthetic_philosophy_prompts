answer: |-
  **TO:** Technical Certification Board
  **FROM:** Chair
  **RE:** Opinion on Application [Lab ID Redacted] and Standards for Independence Presumptions

  **Recommendation**
  I recommend we **reject** this application in its current form. The claim that the sealed evaluation set provides an unbiased estimate of field accuracy is statistically untenable given the undisputed facts. Specifically, Fact 1 (selection of the best performer from 200 configurations) introduces a known, calculable selection bias. This is not a "thin connection"; it is a direct mathematical coupling between the training process and the test scores. The failure of the independence assumption here does not require a coincidence; it is the expected outcome of extreme value statistics. Fact 3 (filtering via a same-family model) compounds this by introducing a structural correlation between the test set construction and the model's error surface.

  **Standard for Future Review**
  To resolve the ambiguity in our charter regarding "connections" that defeat the presumption of independence, reviewers will apply the **Calculable Dependence Standard**:

  *   The presumption of independence holds only if the applicant demonstrates that any admitted connection between the model and the evaluation data yields a statistically negligible bias.
  *   If a mechanism of dependence exists (e.g., model selection, data filtering) for which an upper bound on correlation or bias can be calculated, the applicant must provide that bound.
  *   If the calculated bias exceeds the claimed precision of the certification, the presumption of independence is defeated, regardless of whether the applicant argues the mechanism is "plausibly" irrelevant.

  **Addressing Member Proposals**
  I cannot adopt the **Bright-Line Rule** (Proposal 1). While requiring an external randomization device offers clarity, it is overly restrictive; it would preclude certification in domains where external randomness is impractical, even if independence can be established through cryptographic commitments or other verifiable means.

  However, I must address the **Suspension Memo** (Proposal 2), which argues we should halt certifications until a formalization exists. I am rejecting this recommendation because the consortium must function, and we possess the statistical tools to adjudicate this specific case.

  **Strongest Point of the Opposing View**
  That said, the dissenting memo makes a critical point that we must honor: *a heuristic which can be turned to any conclusion is no evidence at all.* The fact that this application reached a vote under our current practice proves the dissenters' core critique: our existing "plausibility" test is too vague to filter out spurious claims. By allowing the lab to characterize selection bias from 200 trials as a "thin connection," our current practice has indeed become vacuous. The new Calculable Dependence Standard is my attempt to remedy this without paralyzing the board.

  **Next Steps**
  The lab may resubmit if they can correct for the selection bias (e.g., via a fresh evaluation on a new holdout set without configuration tuning) and quantify the filter-induced correlation. We will revisit the broader formalization of the charter's independence clause at the Q3 retreat.

  Chair
