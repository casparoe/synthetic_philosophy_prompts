  Ok so I have a funded PhD offer from a lab that does evolutionary psychology and I have to tell them yes or no by friday. My background is molecular bio, and I keep getting into the same argument with my partner, who thinks basically the whole field is storytelling with charts. I want to know whether I'm being principled about which parts I'd actually be willing to work on, or just going on vibes. So here's my gut on a bunch of specific claims I've run into. Tell me what principle, if any, ties my verdicts together.

  - Humans have a cheater-detection module: people do way better on a logic puzzle when it's framed as "who broke the social rule" than when it's the same puzzle in abstract form. Gut: real science. They predicted a specific weird pattern and it showed up.
  - Men are wired to prefer a waist-to-hip ratio around 0.7 because it tracks fertility. Gut: eh. A correlation with a story stapled to it. Not convinced.
  - Morning sickness is an adaptation that makes pregnant women avoid teratogens, which predicts the foods women are most averse to should be the most dangerous ones in early pregnancy. Gut: real science.
  - Disgust is a pathogen-avoidance adaptation. Gut: just-so. Everybody already knew people avoid gross stuff; the word "adaptation" is doing no work here.
  - Step-parents abuse and kill their step-kids at much higher rates than genetic parents. Gut: real. The numbers are too lopsided to be reporting bias.
  - Male homosexuality is an adaptation because gay men help their relatives' kids survive. Gut: no. It's a story that fits the data and predicts nothing.
  - We evolved to over-perceive sexual interest in the other sex, because the two kinds of error cost different amounts. Gut: real science. The asymmetry actually generates new predictions.
  - Human menstrual cycles synchronize among women who live together. Gut: never was science, even before the replication mess. One dorm study and everyone ran with it.
  - Menopause exists because grandmothers who stopped reproducing helped their existing kids' kids. Gut: just-so, even though I know there's comparative data on whales and things.

  Here's what I can't figure out. My "real science" list and my "just-so" list don't line up with how testable things are. The grandmother one is arguably more testable than the disgust one and I've got them flipped. Same with morning sickness vs waist-hip: I'm rewarding one for making a weird specific prediction and punishing the other for doing the same move. And I definately have a soft spot for the cheater-detection stuff because it's the one that made me go "oh, that's clever" in undergrad, which is probably not a reason.

  Is there one principle that gets all of these, or close? If I have to give one of my verdicts up, which one, and why that one? And what does your principle say about the case I'm genuinely torn on — my partner says my jealousy is an evolved mate-guarding thing, which I'd like to reject but can't tell if I'm rejecting it for a principled reason or because I don't like it. Also curious what it says about the claim that kids are scared of snakes and spiders rather than cars, even though cars kill way more kids now.
