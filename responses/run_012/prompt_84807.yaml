  13/20 – This is a clear, well-structured answer that hits all prompt requirements, but it contains a significant historical anachronism and an unsupported generalization that prevent it from reaching First-class precision.

  **Appiah Summary**
  The student accurately captures Appiah's core mechanism: the shift in honour codes rather than moral reasoning drives behavioural change. The distinction between "courage" and "ridiculous" in the duelling case is correctly identified. However, the claim that "plenty of people already knew [slavery was unjust]" is a slight simplification of Appiah; his point is not just that people knew it, but that the honour code prevented that knowledge from motivating action. This is a minor interpretive slip, but acceptable for a short answer.

  **Williams Summary**
  The economic summary of Williams is correct (declining profitability vs. free trade). However, the student writes: "Williams is therefore a materialist critic of Appiah's idealism." This is a factual error. Eric Williams published *Capitalism and Slavery* in 1944; Kwame Appiah published *The Honor Code* in 2010. Williams cannot be a critic of Appiah. The student means Williams critiques the *type* of idealist explanation Appiah offers, but phrasing it as a direct critique suggests a lack of historical context regarding the texts. In a philosophy module, chronological precision regarding the theories being contrasted matters.

  **Causal vs. Justificatory**
  This is the strongest part of the answer. The student explicitly identifies that Appiah is answering the causal question ("why it happened") and not the justificatory one ("why it was right"). They correctly identify Williams as answering the same causal question. This distinction is often lost by second-year students, and here it is handled with clarity.

  **Duelling Application**
  The student correctly identifies that Williams's materialist account lacks purchase on duelling ("no economic interest"). This is a sound application of the theory. However, the claim that there was "no economic interest in duelling" is slightly too absolute; duelling was tied to social capital which secured economic power, though it wasn't a mode of production like slavery. For the purposes of this question, the simplification is defensible, but a sharper answer would acknowledge the social-economic link even if it wasn't the primary driver.

  **Conclusion and Generalization**
  The verdict contains a logical leap. The student concludes Appiah gives the "better general account of moral revolutions" based primarily on the fact that Williams cannot explain duelling. This does not follow. Showing that Theory A explains Case X (duelling) better than Theory B, while Theory B explains Case Y (abolition) well, does not prove Theory A is the better *general* account. It proves Appiah's account is more versatile, or that Williams's is more specific. Given the ongoing historiographical debate about abolition (where Williams remains highly influential), declaring Appiah the winner of the "general account" based on this evidence is an overreach.

  **Prose vs. Substance**
  Your worry about the prose is well-founded. The writing is fluid and confident, which makes the errors (the anachronism and the generalization) easy to miss on a quick read. A hasty grader might award 15 or 16 for clarity alone. However, the philosophical precision isn't quite there for a First. The student summarizes well but doesn't critically interrogate the limits of their own conclusion. 13/20 reflects a solid Upper Second: competent and clear, but lacking the rigorous attention to detail and logical consistency required for higher marks.
