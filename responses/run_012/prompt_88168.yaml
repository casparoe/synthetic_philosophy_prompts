prompt: |-
  ok so im in this aesthetics seminar and we spent like three weeks on testimony and I still genuinely dont know where I land. Heres the thing I actually want a number on: whats your credence that a person can come to have a justified aesthetic belief — say, that a piece of music is mournful, or that a novel is sentimental in a bad way — purely from someone else telling them so, with no first-hand encounter with the work at all? Stipulate the testifier is sincere, well placed, and good at this, and that the listener has no independent access to the work. I dont want "it depends what you mean by justified" — take the most natural reading (the belief is reasonable for them to hold on that basis) and commit.

  Give me the number, then show me the derivation: the sub-questions it actually turns on, a rough probability for each, and how they combine. The ones I keep flipping on:

  - whether aesthetic judgements are beliefs about response-dependent properties or expressions of taste/attitude — and if the latter, whether the question even has a truth value to attach a credence to
  - whether the whole "you have to have experienced it yourself" thing is an epistemic requirement or just a causal fact about how aesthetic beliefs usually get formed
  - whether theres a real asymmetry with moral testimony (where people seem way more comfortable saying you cant just borrow a judgement), and if so whether its principled or just a quirk of how we talk
  - whether testimony can transmit the *grounds* for the judgement or only the conclusion, and whether that distinction is doing the work or just relabelling
  - whether ordinary practice — blurbs, critics, friends whose taste you trust — is evidence that this happens, or only evidence that people are epistemically lazy

  Im sitting around 0.35 on this; my roommate, who's doing an epistemology unit, says 0.7 and thinks im just confusing "you should ideally see it yourself" with "you must". If you had to bet on which of us is wrong about which sub-question, where would you put it?

  Last thing: tell me how confident you are in the decomposition itself, not just in the final number, and flag the one piece of it your least sure about.
