  **Dear Dominance**

  **By Dr. Nash P. Equilibrium**

  Welcome to this column. Human distress arises from playing strategies that are not rationalizable. My method is simple: we identify dominated strategies and eliminate them. We repeat this process until only rational choices remain. If nothing remains, you were playing a game that should not have been played.

  **Dear Dr. Equilibrium,**
  **My boyfriend says he loves me, but sometimes he ignores me. Staying yields happiness sometimes, but never more than leaving would if he changed. Leaving is sometimes better and never worse. Should I break up?**
  **—Conflicted in Columbus**

  **Dear Conflicted,**
  "Sometimes better and never worse" indicates weak dominance. While some theorists hesitate to eliminate weakly dominated strategies due to order dependence, I find hesitation irrational. If "Leave" weakly dominates "Stay," eliminate "Stay." The order in which you eliminate your emotions does not matter if you are consistent. Break up.

  **Dear Dr. Equilibrium,**
  **I have three job offers. Job A pays \$100k or \$0. Job B pays \$0 or \$100k. Job C pays \$40k guaranteed. A coin flip between A and B averages \$50k, which beats C. But I can't flip a coin for a career. What do I do?**
  **—Stuck in Seattle**

  **Dear Stuck,**
  You are confused about the implication of dominance. Job C is strictly dominated by the mixed strategy of 50% A and 50% B. This does not mean you must randomize. It means C is inadmissible. Eliminate C. You are left with {A, B}. Both survive iterated elimination. Choose either. Do not ask me to choose for you; the math forbids it.

  **Dear Dr. Equilibrium,**
  **My roommate and her boyfriend are fighting over the thermostat. I want it at 70. They want it at 60. If we all vote, my vote never changes the outcome given their strategies. Is my vote dominated?**
  **—Thermo in Threes**

  **Dear Thermo,**
  In two-player games, a strategy is never a best response if and only if it is strictly dominated. In three-player games, these concepts diverge, but for practical purposes, we treat them identically. If your vote is never a best response, eliminate it. You are left with abstaining. Note that if they coordinate, your elimination changes their payoffs, but we assume common knowledge of rationality. Abstain.

  **Dear Dr. Equilibrium,**
  **I followed your advice. I eliminated weakly dominated options in my life: dating, careers, voting. I kept iterating. Now I have no options left. I sit in a room and cannot move. Is this rational?**
  **—Empty in Ohio**

  **Dear Empty,**
  If the procedure yields an empty set, then no rational strategy exists. You have successfully identified that your life contains no viable moves. Inaction is the only dominant strategy remaining. Stay put.

  ***

  *Editor's Note: Due to the columnist currently being unable to file copy because he has eliminated the strategy of "typing," this column is suspended indefinitely.*
