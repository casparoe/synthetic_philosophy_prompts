answer: |-
  This is a sharp, viable reading. It avoids the trap of treating the play as a case brief and instead treats the case as a dramatization of hermeneutic violence. Your hunch is correct: the play is not arguing for one method over another; it is arguing that interpretive methods are not neutral technologies. They are weapons chosen by those who hold the gavel.

  Here is where your reading holds, where it needs steeling, and where the Scalia/Breyer frame might obscure more than it reveals.

  ### 1. Portia's "Textualism": Literalism as Trap
  You are right to flag the distinction between textualism (ordinary public meaning) and strict constructionism (semantic possibility). Scalia explicitly rejected the idea that a text means whatever it *can* mean physically, insisting on what it *would* mean to a reasonable reader. Everyone knows flesh bleeds. Portia's ruling relies on a semantic gap that contradicts physical reality.

  **Where to shore it up:**
  Don't let your students call Portia a textualist. Call her a **formalist opportunist**. She invokes the *form* of the law to defeat the *function* of the contract.
  *   **The Lesson:** Textualism claims to constrain judicial discretion. Portia demonstrates that hyper-literalism can *expand* judicial discretion by allowing the judge to select which linguistic level governs (semantic vs. pragmatic).
  *   **The Philosophical Hook:** Ask the philosophers: Is Portia engaging in *interpretation* or *performative contradiction*? She uses the language of the law to suspend the operation of the law. This aligns with Derrida's "Force of Law"—the moment of decision is a mystical suspension of the rule.
  *   **The Law Student Hook:** Ask them to draft the opinion. If Shylock is entitled to specific performance, does the "no blood" clause imply a duty to mitigate damages by not bleeding? Portia treats a silent contract term as an express limitation. That's not interpretation; that's rewriting.

  ### 2. The Pivot: Private Bond vs. Public Statute
  Your second point is the strongest structural insight. The trial begins as a contract dispute (private ordering) and ends as a criminal prosecution (public ordering).
  *   **The Illumination:** This exposes the limit of the textualism/purposivism debate. That debate assumes a stable jurisdiction. Here, the court changes the *nature* of the proceeding to secure the desired outcome.
  *   **Where to stop pushing:** Be careful not to frame the alien statute as "purposivism." The court doesn't interpret the statute's purpose; they apply it as a strict liability trap. The "purposive" move is actually the *mercy* plea at the end.
  *   **The Power Dynamic:** The shift from contract to statute dramatizes the state's monopoly on violence. Shylock is allowed to use the law as a private weapon only until he threatens the social order (a citizen's life). Then, the law reverts to public protection. The "method" changes because the *subject* changes from a creditor to an enemy of the state.

  ### 3. The Caskets: Hermeneutics of Risk vs. Hermeneutics of Control
  Bringing in the caskets is essential. It prevents the seminar from concluding that the play simply "hates law."
  *   **The Contrast:** The casket choice (specifically Bassanio's) rewards a hermeneutic of **risk and spirit**. "Who chooseth me must give and hazard all he hath." He must ignore the surface text (gold/silver inscriptions) and read the *intent* of the testator (Portia's father).
  *   **The Tension:** You ask if the play is inconsistent. I argue it is dialectical.
      *   **Belmont (Love):** Requires purposive, risk-taking interpretation. You must look past the text to the value.
      *   **Venice (Law):** Rewards literal, predatory interpretation. You must trap the text to secure value.
  *   **The Synthesis:** The play suggests that **law without the hermeneutic of Belmont is demonic.** Portia wins in Venice using Venice's rules, but she enters the trial disguised (a textual deception) and leaves immediately to return to Belmont. The legal victory is unsustainable; it requires her to leave the legal sphere to find happiness.
  *   **Pedagogical Move:** Have students compare the inscription on the lead casket with the text of the bond. One demands a sacrifice of self (hazard all); the other demands a sacrifice of the other (pound of flesh). The interpretive method follows the moral orientation.

  ### 4. The Core Hunch: The Politics of Method
  Is your hunch too cynical? **No.** It is the only thing that makes sense of the ending.
  *   **The Scalia/Breyer Blind Spot:** Modern legal theory generally assumes both parties are legitimate participants in the legal order. Scalia and Breyer disagree on *how* to read, not on *who* gets to read.
  *   **The Merchant's Insight:** The play shows that interpretive method is contingent on **status**.
      *   When Shylock uses textualism ("My deed upon my head!"), it is called "cruelty."
      *   When Portia uses textualism ("No drop of Christian blood"), it is called "wisdom."
      *   When the Duke uses discretion (mercy), it is "divine."
      *   When Shylock asks for the law, he is told to show mercy. When Antonio needs mercy, the law is bent to grant it (the partial confiscation of Shylock's estate is technically a violation of the statute's penalty, adjusted by the Duke's "plea").
  *   **Conclusion:** The play dramatizes that **neutrality is a luxury of the insider.** For the outsider (Shylock, the alien), the law is a rigid trap. For the insider (Antonio, the citizen), the law is a flexible resource. This is a critique not just of law, but of the *claim* to legal neutrality.

  ### Where the Frame Breaks (and why that's good)
  There is one place where the textualism/purposivism frame risks flattening the text: **The "Quality of Mercy" speech.**
  *   Mercy is not purposivism. Purposivism still seeks to enforce the law according to its goal. Mercy suspends the law entirely.
  *   If you force mercy into the "purposivist" box, you lose its theological weight.
  *   **The Fix:** Frame Mercy as the **third term** that exposes the insufficiency of the binary. Textualism (Shylock) leads to death. Literalism/Trap (Portia) leads to victory but not justice. Mercy (Portia/Duke) is the only resolution, but it is extra-legal.
  *   **The Takeaway for Students:** The legal system (interpretation) cannot solve the human problem. It can only manage it until power intervenes.

  ### Seminar Exercise Suggestion
  To make this land with half law students/half philosophers:
  1.  **Split the room:** Half argue Shylock's brief (Specific Performance based on textual certainty), half argue Antonio's (Public Policy/Unconscionability).
  2.  **The Twist:** Midway through, hand Portia's "no blood" ruling to the class. Ask the "Textualists" if they accept it.
      *   If they say yes, they admit textualism allows absurd results.
      *   If they say no, they admit textualism requires a "reasonable person" standard that Shylock arguably meets (it was a joke/bond, not a medical procedure).
  3.  **The Casket Addendum:** Ask the philosophers to write the inscription for the "Law" casket vs. the "Mercy" casket. What does the text demand of the chooser in each scenario?

  ### Verdict
  Your reading is sound. It avoids the anachronism of treating Shakespeare as a modern jurist by treating the play as a *critique* of juristic certainty. The "politics of method" thesis is not too cynical; it is the specific contribution literature can make to legal theory. It reminds the lawyers that rules do not apply themselves, and it reminds the philosophers that abstraction has blood on its hands.

  **One final adjustment:** Don't ask "Is Portia a textualist?" Ask "Who is allowed to be a textualist?" That shifts the question from epistemology (how we know meaning) to power (who controls meaning). That is where your seminar will catch fire.
