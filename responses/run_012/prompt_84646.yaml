  8.  *(Final thought on the "Politics of Method"):* This is the strongest part. I need to emphasize that Scalia/Breyer debate assumes a shared commitment to the Rule of Law. *Merchant* assumes the Rule of Law is a tool of the in-group. That's the key insight.

