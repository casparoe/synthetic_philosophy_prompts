      *   *Point 2 (Contract vs. Statute):* The shift from the bond to the alien statute is crucial. The user notes the court reads the contract like a statute (public meaning) and the statute like a discretionary tool. This highlights the instability of the legal framework. The clemency angle (Duke/Antonio) adds the "equity/mercy" layer that pure interpretation theories often ignore.
      *   *Point 3 (Casket Subplot):* Connecting the caskets to interpretation is a classic move (Freud, etc.), but framing it as *purposivism vs. textualism* is fresh. The lead casket ("Who chooseth me must give and hazard all he hath") demands engagement beyond the surface text. This contrasts well with the bond.
