          3.  Casket Subplot: Contrasts the legal plot. Literalism wins in court; anti-literalism (risk/meaning) wins in love. Is the play consistent, or is method just outcome-driven?
      *   **Core Hypothesis:** The play dramatizes the *politics of interpretive method* (method as power), which modern theorists (Scalia/Breyer) miss.
