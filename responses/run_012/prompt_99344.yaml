  *   Section 3: Tied Systems (Indeterminacy is a feature, but highlights the lack of modal depth).
  *   Section 4: Simplicity (Natural properties are the key, but potentially circular).
  *   Section 5: Explanation & QM (The real killer).
  *   Section 6: Unfalsifiability (It's a framework, but risks emptiness).
  *   Conclusion: The "Unacceptable Denial" (The distinction between law and coincidence is not in the world).

  *Wait, one more thing:* The user asked "If there isn't one [unacceptable consequence], say so, and tell me why the anti-Humean is the one holding the bag." I need to be balanced. I shouldn't pretend Humeanism is dead if it's not. But I need to show where the pressure is highest. The QM issue is the most objective "threat." The modal issue is the most philosophical "cost."

