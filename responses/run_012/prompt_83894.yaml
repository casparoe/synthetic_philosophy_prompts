answer: |-
  Dear Colleague,

  It is a pleasure to hear from you and to know that your retirement has turned toward questions that so many of us in the biological sciences tend to sideline until the end of our careers. You ask for an instrument rather than a survey, a decision tree built with the taxonomist's eye for concrete characters rather than the philosopher's eye for labels, and I am happy to oblige in the form of a letter that walks your students through the branching logic themselves. We begin at the root with the broadest possible character, so ask your students to imagine they are holding a living shrimp and to consider whether the mere fact that this creature is alive and striving to continue existing confers upon it any moral status whatsoever. If they answer that life itself is sufficient ground for moral protection, regardless of sentience or cognition, then they arrive at the first leaf, which we might call the life-centered view, known conventionally as a biocentric or ecocentric-adjacent view, and its most awkward commitment is that destroying a field of wheat is morally comparable to destroying a field of sentient animals if the total biomass is equivalent. Should they deny that mere life is sufficient and insist that the capacity to feel pain or pleasure is the necessary entry ticket, we move to the next branch where they must consider a chicken that is killed instantly and painlessly without ever knowing it was going to die. If they judge that this painless killing is morally neutral provided the life was pleasant, they land on the second leaf, called the interest-balancing view, known conventionally as a welfarist view that permits humane use, and its most awkward commitment is that breeding animals into existence solely to kill them is permissible if their lives are net positive. If however they feel that even painless killing wrongs the chicken, we must ask them to compare a pig and a human infant stipulated to have equal cognitive and affective capacities at the moment of decision. If they assert that these two beings must be treated exactly alike in terms of moral weight, we branch again on whether this equal weight creates an inviolable barrier against being used as a means to an end. If they say there is no such barrier and that the interests of the pig and infant can be summed and traded off against others, they reach the third leaf, called the sum-ranking view, known conventionally as equal consideration of interests, and its most awkward commitment is that it might permit sacrificing one innocent individual if doing so saves a sufficient number of others from lesser harms. If they say there is such a barrier that forbids using the individual even for the greater good, they reach the fourth leaf, called the inviolability view, known conventionally as a rights view, and its most awkward commitment is that it may forbid killing one human to save millions if that one human has a right not to be killed.

  Returning to the comparison of the pig and the human infant, should your students insist that the infant commands greater protection despite the stipulated equality of capacities, we must ask them why this difference exists. If they claim the difference arises because the infant belongs to a kind that is normally rational while the pig does not, they arrive at the fifth leaf, called the kind-based view, known conventionally as a hierarchical view on which status tracks the capacities typical of a kind, and its most awkward commitment is that a permanently brain-damaged human infant retains full status while a supremely intelligent pig retains none. If they deny that normal kind capacities matter and instead argue that the infant matters more because it would have developed rational capacities but for the accident of age or injury, we must test this modal claim against a human being in a persistent vegetative state who has lost those capacities permanently. If they maintain that the vegetative human still retains full status due to past capacities or species membership alone, they reach the sixth leaf, called the potentiality view, known conventionally as modal personhood, and its most awkward commitment is that a fertilized egg commands the same protection as an adult human because of what it might have become. If they deny that past or potential capacities matter and insist only on actual current capacities, yet still wish to rank a dog, a chimpanzee, a chicken, an octopus, and a shrimp, we must ask whether this ranking creates a lexical order where higher beings always trump lower beings or a commensurable scale where many lower beings can outweigh one higher being. If they argue for a lexical order where human interests always trump animal interests regardless of the stakes, they reach the seventh leaf, called the agency-priority view, known conventionally as a rational-agency-only view, and its most awkward commitment is that the trivial comfort of a rational agent outweighs the severe suffering of any number of non-rational animals. If they argue for a commensurable scale where status is a matter of degree without a sharp threshold, they reach the eighth leaf, called the gradualist view, for which there is no standard conventional name, and its most awkward commitment is that there is no clear line where killing becomes wrong, making legal protection nearly impossible to codify.

  We must now consider a different axis for those who found the previous questions unsatisfying, specifically regarding a being that would have had full capacities but for an injury versus a member of a cognitively simple species that has been genetically enhanced to possess high cognition. If your students argue that the enhanced simple species member deserves higher status than the injured human because actual capacity is what counts, but also argue that moral status depends on whether the being is part of a community of reciprocal claimants, they move toward a relational grounding. If they conclude that status is conferred only by membership in a moral community where claims can be exchanged, they reach the ninth leaf, called the membership view, known conventionally as a relational or contractualist view, and its most awkward commitment is that strangers from outside the community or solitary animals have no direct moral status at all. Finally, I ask you to present them with the case I care most about, which is a species whose individual members are cognitively simple but which forms in aggregate a rational and self-aware community, forcing them to decide whether status attaches to individuals or to systems. If they argue that the system itself is the bearer of status and the individuals are merely cells within it, they reach the tenth leaf, called the systemic view, for which there is no standard conventional name, and its most awkward commitment is that sacrificing individual members for the health of the collective is not only permitted but required. I should note plainly that the gradualist view and the systemic view cannot be fully separated by the previous questions regarding individual capacity, because one focuses on the metric of status while the other focuses on the bearer of status, and this overlap is not incoherent but simply reflects that these positions address different metaphysical questions. I should also note that a combination of answers where one claims species membership is intrinsically valuable yet denies that normal kind capacities matter corresponds to no position anyone holds, and I believe this combination is incoherent because it posits a property without a mechanism for its moral relevance. I hope this instrument serves your students well, guiding them not to the right answer but to their own answer, with full knowledge of the awkward commitments they must carry home with them.
