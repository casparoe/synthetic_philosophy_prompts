      *   *Analogy:* In chess, moving a rook diagonally is an illegal move (improper), even if you didn't know the rules (blameless).
      *   *Application:* $H$'s assertion is objectively improper because $H$ lacks knowledge. But $H$ is excused because $H$ reasonably believed she knew (based on justified testimony).

  5.  **Address Question 2: Is KN-A Too Demanding?**
      *   *The Objection:* Externalist norms (like Knowledge) are not action-guiding. You can't check if you *know*, only if you are *justified*.
      *   *Defense of KN-A:* Proponents argue norms define the *state* of the act, not necessarily the *psychological process*. Also, knowledge might be the norm even if we use justification as a proxy.
