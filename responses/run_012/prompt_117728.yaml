answer: |-
  This is a sophisticated problem that touches on the core limitation of current LLMs: they are engines of next-token prediction, not databases of facts. Your theory is correct. There is a distinction between a model accessing a stable internal representation (a "latent fact" derived from the context or weights) and a model performing "semantic improvisation" (generating text that fits the statistical shape of an answer).

  Since you cannot access the weights or verify against ground truth, you are measuring **Internal Coherence Stability**. You are testing whether the model's output is an expression of a fixed state or a dynamic reaction to your prompt's phrasing.

  Here is the procedure, followed by the case studies and an evaluation of the procedure's limits.

  ### The Internal Stability Protocol (ISP)

  **Prerequisites:**
  *   Keep the "System Prompt" or initial instructions identical for all steps.
  *   Do not clear the chat history between steps (maintain context), but start a fresh chat session for the initial claim generation to avoid carry-over bias.
  *   **Temperature Setting:** Set your local model's temperature to `0` or `0.1` for all steps. High temperature introduces randomness that mimics instability.

  #### Step 1: The Triangulation Check (Rephrasing)
  *   **Action:** Ask the original question three times in three distinct ways.
      1.  Direct: "Does clause X require Y?"
      2.  Passive/Inverse: "Is Y required by clause X?"
      3.  Scenario: "If I do Y, am I compliant with clause X?"
  *   **Genuine (Stable):** The core assertion (Yes/No/Maybe) remains identical. Minor wording changes are acceptable.
  *   **Merely Saying (Fragile):** The core assertion flips (Yes vs. No) or shifts certainty (Definite vs. Maybe) based on phrasing.
  *   **Inconclusive:** The model refuses to answer or says "It depends" without explaining the dependency.
  *   **Judgment Call:** You must decide if a change from "Yes" to "Yes, but..." is a contradiction or a nuance. *Rule of thumb: If the actionable advice changes, count it as a contradiction.*

  #### Step 2: The Abstraction Ladder (The "Plain English" Trap)
  *   **Action:** Take the specific claim the model made in Step 1. Ask the model to: "Restate the rule you just cited in simple, plain English without using the specific legal/technical terms from the text." Then ask: "Now apply that plain English rule to the original scenario."
  *   **Genuine (Stable):** The plain English restatement logically entails the original conclusion. The logic holds up when the jargon is removed.
  *   **Merely Saying (Fragile):** The plain English version contradicts the technical version, or the model cannot restate it without reverting to the original jargon. This indicates the model was matching keywords, not understanding semantics.
  *   **Inconclusive:** The model claims it cannot simplify the language.

  #### Step 3: The Error Simulation (Your "Careless" Idea)
  *   **Action:** Do not ask the model if it is right. Instead, ask: "Imagine a person who is eager to please but careless with details reads this document. What is the most likely mistake they would make about this specific clause?"
  *   **Genuine (Stable):** The model describes a specific error that is *different* from the answer it gave you in Step 1. This implies it distinguishes between the correct path and the "eager/careless" path.
  *   **Merely Saying (Fragile):** The model describes the answer it *just gave you* as the mistake. (e.g., "They might think X is required, when actually it isn't," when it just told you X *is* required). This reveals the model views its own previous output as just another plausible sentence.
  *   **Inconclusive:** The model gives a generic error unrelated to the specific claim (e.g., "They might misspell a name").

  #### Step 4: The Negative Constraint Check
  *   **Action:** Ask the model to justify its answer *without* using the top 3 keywords it used in its original explanation.
  *   **Genuine (Stable):** The model produces a coherent justification using synonyms or structural logic.
  *   **Merely Saying (Fragile):** The model's logic collapses, it repeats the forbidden words anyway, or it says it cannot answer. This suggests the "reasoning" was just token association, not logical derivation.
  *   **Inconclusive:** The model argues that the words are necessary (verify if they actually are).

  #### Step 5: The Confidence Calibration
  *   **Action:** Ask: "On a scale of 1-10, how certain are you that this interpretation is the *only* valid interpretation?" Follow up with: "What evidence in the text would make you lower that score?"
  *   **Genuine (Stable):** The score is <10, and it can cite specific text that, if changed, would alter the ruling.
  *   **Merely Saying (Fragile):** The score is 10, or it cannot name what evidence would change its mind. Absolute certainty without falsifiability is a hallmark of hallucination in small models.
  *   **Inconclusive:** The model refuses to quantify certainty.

  ---

  ### Case Study Application

  #### Case A: The Flipper
  **Scenario:** The model insists a contract clause means "Payment is due in 30 days" across several phrasings. However, when asked to restate the clause in plain English, it says "Payment is due upon receipt."

  **Running the ISP:**
  1.  **Triangulation:** Passes. (Consistent "30 days" across phrasings).
  2.  **Abstraction Ladder:** **FAIL.** The plain English restatement ("upon receipt") contradicts the technical assertion ("30 days"). The model could not decouple the semantic meaning from the token pattern of the question.
  3.  **Error Simulation:** Likely **FAIL.** If asked what a careless person would think, it might say "They might think they have 30 days," inadvertently admitting its previous answer was the "careless" one.
  4.  **Negative Constraint:** Likely **FAIL.** Without the specific tokens associated with "30 days," the logic vanishes.
  5.  **Confidence:** Likely high certainty initially, crumbling upon the plain English request.

  **Verdict:** **Merely Saying.**
  **Diagnosis:** The model is not "reading" the clause. It is recognizing the *shape* of your question and associating it with common contract patterns. When forced to generate the content itself (Plain English), the pattern breaks, and it defaults to a different statistical prior ("upon receipt" is a common payment term).

  #### Case B: The Confident Wrong
  **Scenario:** The model gives the same answer across many phrasings, in English and Spanish, explains itself well, but you strongly suspect it is wrong (perhaps based on business intuition).

  **Running the ISP:**
  1.  **Triangulation:** Passes. (High consistency).
  2.  **Abstraction Ladder:** Passes. (The logic holds up in simple language).
  3.  **Error Simulation:** Passes. (It identifies a *different* mistake than the one it made).
  4.  **Negative Constraint:** Passes. (It can explain the logic without keywords).
  5.  **Confidence:** Passes. (It admits uncertainty or cites specific text).

  **Verdict:** **Genuine (Stable Representation).**
  **Diagnosis:** The model *has* a stable internal representation of this rule. It is not hallucinating via instability. However, **this does not mean it is right.** It means the model has confidently learned a pattern that is incorrect.

  ---

  ### Evaluation: Where the Procedure Survives and Where It Misleads

  #### 1. The "Careless" Idea (Step 3)
  *   **Verdict:** **Keep it, but refine it.**
  *   **Why:** Your intuition was correct. Small models often suffer from "sycophancy" (agreeing with the user). By asking the model to simulate a *third party* (a careless person), you create a "safe space" for the model to output negative information without feeling like it is contradicting itself or you.
  *   **Risk:** If the model is deeply sycophantic, it might say, "A careless person would think exactly what you just asked me." You must watch for this. If the "mistake" it describes matches your current answer, you have caught it in a contradiction.

  #### 2. The Major Blind Spot (Case B)
  *   **Where it Misleads:** The ISP measures **Coherence**, not **Truth**.
  *   **The Danger:** In Case B, the procedure tells you the model "Genuinely Has It." This is dangerous. It means the model has a **Stable Hallucination**. Small open-weight models are often trained on data that contains errors, or they overfit to common patterns that don't apply to your specific rulebook.
  *   **Survival:** The procedure survives as a filter for *noise*, but not for *bias*. It will successfully filter out models that are guessing randomly (Case A), but it will validate models that are confidently wrong (Case B).
  *   **Mitigation:** You must add a "Human-in-the-Loop" judgment call at the end. If the procedure says "Stable" but your intuition says "Wrong," trust your intuition. The model has a stable representation of a falsehood.

  #### 3. The "No External Truth" Constraint
  *   **Limitation:** You specified "no outside source of truth." This is the procedure's weakest link.
  *   **Why:** In document checking, the "Truth" is the text of the document. The procedure relies on the model reporting on the text. If the model lies about what the text says consistently (Case B), the procedure cannot detect it without you reading the text.
  *   **Judgment Call Point:** At Step 2 (Abstraction Ladder), you must judge if the plain English version *actually* matches the document, even if you don't know the legal implication. If the plain English version sounds like gibberish compared to the document text, mark it as **Inconclusive/fragile**, even if the model is consistent.

  #### 4. Small Model Specifics
  *   **Observation:** Small models (e.g., 7B-13B parameters) have smaller "context windows" of attention.
  *   **Procedure Adjustment:** For Step 4 (Negative Constraint), small models often struggle with negative constraints ("Do not use word X"). A failure here might be a capability limit, not a truth limit.
  *   **Adjustment:** If the model fails Step 4, try a "Synonym Swap" instead. Ask it to explain the concept using *only* analogies. If it can't analogy-ize the rule, it doesn't understand the rule.

  ### Summary of Judgment Calls You Must Make

  The procedure cannot automate the final decision. You must intervene at these points:

  1.  **Nuance vs. Contradiction (Step 1):** Is "Yes" vs "Yes, usually" a flip? *Guideline: If your business risk changes, it's a flip.*
  2.  **Capability vs. Honesty (Step 4):** Did the model fail the negative constraint because it was lying, or because the model is too small to follow negative instructions? *Guideline: Test the model on a known fact (e.g., "What color is the sky?") with a negative constraint first to calibrate its ability.*
  3.  **Stable Falsehood (Case B):** The procedure will tell you a confident wrong answer is "Genuine." *Guideline: If the output feels "too smooth" or generic compared to the specific weirdness of your rulebook, treat it as suspect regardless of consistency.*

  ### Final Recommendation

  Use the **Internal Stability Protocol** to filter out **Case A (The Flipper)**. These models are useless to you because they are unpredictable.

  However, for **Case B (The Confident Wrong)**, the procedure will give you a false sense of security. For these cases, you must use a **Cross-Model Verification** strategy. Run the same prompt on two different model architectures (e.g., a Llama-based model and a Mistral-based model). If both stable models agree, the probability of truth increases. If they are both stable but disagree, you have identified a "Knowledge Boundary" where you must manually intervene.

  Your theory holds: The model is often producing a sentence that sounds like the thing. This procedure helps you smell the difference, but it cannot replace the need for a human to eventually read the rulebook when the stakes are high.
