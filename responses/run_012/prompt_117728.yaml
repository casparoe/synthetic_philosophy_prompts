  7.  **Final Polish:** Ensure the distinction between "Stable Internal Representation" and "Truth" is clear. The user knows they don't have ground truth, so the procedure measures *reliability of the representation*, not *factual accuracy*. This is a crucial philosophical distinction to make explicit. (Wait, the user wants to know if the model *has* the thing. If the model consistently lies, it "has" a lie. But the user implies "has the *right* thing." I must clarify that this procedure detects *conviction/coherence*, not *correctness*, unless the contradiction reveals the lack of grounding.)

      *Correction:* The user's goal is to find out "what the model has." If the model has a stable falsehood, the procedure should identify it as "Stable." But the user wants to distinguish "stable knowledge" from "plausible sounding sentence." A stable falsehood is still "stable knowledge" in the model's weights, but it's not grounded in the document. Since the task is "check documents against a rulebook," the ground truth *is* the document.
      *Wait, constraint:* "No outside source of truth."
      *Conflict:* If the task is checking against a rulebook, the rulebook *is* the source of truth. But the prompt says "no outside source of truth... since the whole point is that I often do not know the right answer."
      *Resolution:* The user is pasting the rulebook *into* the context window. So the "truth" is inside the context. The procedure must check if the model is actually attending to the context or just generating based on pre-training.
      *Adjustment:* The checks need to focus on *grounding in the provided text* vs. *general knowledge hallucination*.
      *Revised Plan:* The procedure tests for **Contextual Grounding Stability**.

      *Let's re-read carefully:* "using only what the model says back to me, with no access to its weights or internal states and no outside source of truth."
      *Okay, so I cannot verify against the rulebook text directly in the procedure steps? That makes it harder.* The procedure must rely *only* on the model's output consistency.
