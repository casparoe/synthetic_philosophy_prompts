  The rules that fit her verdicts
  Two rules reconcile her six verdicts. First, **Outcome Sovereignty**: moral worth is determined by the actual value or harm produced. The drunk killer harms the world (blameworthy); the genius painter enriches it (blameless). For surgeons, "harm" includes the erosion of systemic trust when protocols are skipped, even if the patient lives. Second, **The Credit Ledger**: agents incur initial blame for wrongful actions, but positive outcomes earn credit. Ordinary success (a patient surviving, a safe drive) pays only interest; the principal debt remains (Surgeon 4, Drunk 1). Only transcendent value (genius art) clears the ledger entirely (Painter 5). Both rules fit the six cases: one focuses on the net balance of value including trust, the other on the magnitude of success required to offset procedural sins. The critical divergence is whether routine success mitigates blame; the Ledger says no, requiring extraordinary redemption, while Sovereignty weighs routine success as a positive counterbalance to the initial wrong, provided trust isn't permanently damaged.

  What each predicts for the liar
  For the lying student, **Outcome Sovereignty** looks at the net result. She became an excellent doctor; the displaced applicant did fine elsewhere. The world gained a great physician and lost nothing significant. This rule predicts she is largely blameless; the lie is a minor footnote in a positive narrative where no one was ultimately harmed. **The Credit Ledger** treats the lie as a moral debt incurred at the moment of application. Her excellence is a payment, but is it transcendent? In the surgeon cases, doing the job well (patient lives) didn't cancel skipping protocols. Unless her medical work is genius-level—revolutionizing the field—her excellence is merely "duty fulfilled." This rule predicts she remains blameworthy. The lie violated the system's trust; routine excellence doesn't erase that debt, only miraculous contribution does. Her colleague likely leans Ledger: the lie stands because the success was expected, not extraordinary, mirroring the surgeon who skipped checks but saved the patient.

  My call
  I prefer **The Credit Ledger**. Outcome Sovereignty risks justifying any violation if the ends are decent, eroding institutional trust and encouraging gambles with integrity. The Ledger preserves the integrity of processes (med school admissions, surgical checks) while acknowledging that rare, transcendent contributions can morally redeem otherwise indefensible actions. It aligns better with the surgeon verdicts, which prioritize protocol over lucky outcomes. We should not encourage lying based on hopeful retrospection, nor should we allow lucky outcomes to sanitize procedural corruption. The Ledger demands excellence as redemption, not just competence.

  The case that would split them
  The splitting case: A student lies, gets in, and becomes a perfectly average, competent doctor. Outcome Sovereignty suggests neutral blame (no net harm done). The Credit Ledger dictates clear blameworthiness (debt incurred, no exceptional credit earned to offset it).
