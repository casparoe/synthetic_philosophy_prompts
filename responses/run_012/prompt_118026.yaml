  **BUREAU OF SEMANTIC COMPLIANCE**
  **Citizen's Guide to Adjudication Standards (FAQ)**

  **Q: How does the Bureau determine eligibility for the Hair-Restoration Subsidy or customs classification of grain heaps?**
  **A:** The Primary Adjudication Division operates under the Epistemic Standard. The statutes require applicants to be "bald" or importers to declare "heaps." While these terms appear vague, our position is that they denote precise properties. There is a specific number of hairs—say, 3,412—where baldness ends. This fact is not withheld in a sealed annex; it is unknowable. Knowledge requires a margin for error. If an agent claimed to know the boundary, a belief landing exactly on the true cutoff would be true only by luck, as a shift of one hair would render the belief false. Therefore, while the fact exists, no verdict can claim knowledge of the boundary itself. We adjudicate based on the existence of the fact, not our access to it.

  **Q: I was denied a subsidy, but I seem borderline. Can I appeal?**
  **A:** Yes. The Appellate Division operates under the Supervaluationist Standard. If your case is borderline, the predicate "bald" is neither true nor false of you. A verdict requires a truth value. If your status is indeterminate, the Primary Division's verdict was unwarranted. We grant appeals on the ground that no verdict was ever required. However, applicants must note our logical concession: it is supertrue that "there is some exact number of hairs at which baldness ends." This statement holds on every admissible way of making the predicate precise. We certify that a cutoff exists somewhere, while refusing, on principle, to say where. No specific number is *the* number, but the existential claim remains valid.

  **Q: Can I be classified as both bald and hirsute if both are indeterminate?**
  **A:** No. The Bureau enforces penumbral connections. Even in cases where individual classifications are indeterminate, logical connections between predicates must survive every precisification. The statement "No one is both bald and hirsute" is supertrue. You cannot exploit indeterminacy to claim conflicting statuses. Consistency is maintained even when truth values are not.

  **Q: What if the Appellate Division's finding of indeterminacy is itself unclear?**
  **A:** Such cases are referred to the Tertiary Review Board. This division hears appeals regarding whether the Second Division's findings of indeterminacy were themselves determinate. Higher-order vagueness is acknowledged; the boundary between the clear cases and the borderline cases is also vague. The Board determines whether the indeterminacy is fixed or fluid.

  **Q: Why is there no Quaternary Division to review the Tertiary Board?**
  **A:** ^1

  **Q: If the cutoff is unknowable, why does the Primary Division exist?**
  **A:** Administrative necessity. The statute requires a decision. The Epistemic Standard allows us to issue verdicts consistent with the fact of the matter, even if the margin for error prevents us from knowing we have done so. We act in accordance with truth, without claiming knowledge of the boundary.

  **Q: Does this apply to grain heaps?**
  **A:** Yes. The logic of aggregation is identical to the logic of hair loss. A heap exists at a precise grain count. You cannot know the count. You may appeal indeterminacy. You cannot claim a shipment is both a heap and not a heap.

  ***

  ^1 *Statutory interpretation limits iterative review to third-order indeterminacy. Logical stabilization occurs at this level; further appeals would constitute a sorites regress prohibited by the Administrative Procedure Act. The Bureau certifies that the vagueness of vagueness is not itself vague.*
