answer: |-
  Your hypothesis is not naive at all; in fact, it cuts closer to the bone than most of the literature admits, and your ecological intuition about generations and fitness is the lever that pries the whole debate open. You have correctly identified that the Thin and Thick definitions of Darwinian are the primary source of friction, but I would suggest the diagnosis is slightly more complex than a simple binary. It is not merely a verbal dispute about the word Darwinian, nor is it purely an empirical dispute about fidelity, though it contains elements of both. It is primarily a dispute about explanatory standards and model utility that has been ontologized into a fight about what culture really is. The reason you feel the argument is going in circles is that the participants are optimizing for different theoretical virtues while claiming to describe the same object.

  When you look at what the sides actually say, the memeticists like Dawkins and Blackmore are indeed arguing for the Thick view. They require a replicator because they want selection to be the exclusive explanation for design and complexity in culture. For them, if copying is not high-fidelity, the accumulation of adaptive complexity is impossible, so they define the phenomenon in a way that guarantees copying is present. They are looking for a universal acid that explains why culture looks designed. The dual-inheritance crowd, Boyd, Richerson, and Henrich, are operating on your Thin definition. They are satisfied with Lewontin's conditions of variation, heredity, and differential fitness because they are modelers who want to use population genetics tools to predict frequency changes. They do not care if the mechanism is copying or reconstruction, provided the statistical signature of selection appears in the data. Then you have Sperber and the cultural attraction theorists who are challenging the Thin view not by denying the population pattern, but by denying the causal weight of selection. They argue that if most resemblance is due to convergent reconstruction driven by cognitive biases rather than copying, then selection is describing the trajectory but not explaining the destination.

  This is where your point about generations and fitness becomes critical. In your work with aphids, a generation is a biological constraint and fitness is a measurable propensity tied to survival and reproduction. In culture, as you noted, the generation is a modeling choice. You can define a generation as a day, a year, or a lifespan, and you can define fitness as likes, citations, or retention in memory. Because these units are flexible, a selectionist model can almost always be fitted to the data after the fact by adjusting the definition of the generation or the fitness proxy. This makes the Thin view vulnerable to the charge of being a tautology. If any change in frequency can be described as selection once you define the units appropriately, then saying culture evolves by natural selection is trivially true but explanatorily weak. The memeticists try to avoid this by insisting on the Thick view, demanding high-fidelity copying as a pre-condition, but they often fail to demonstrate that such copying exists at the scale they require. The attractionists avoid the tautology by positing a specific cognitive mechanism, but they struggle to model population-level dynamics as elegantly as the selectionists.

  So the dispute is not just verbal, because there are empirical claims hidden inside the definitions. The memeticists claim high-fidelity copying is widespread; the attractionists claim transformation is widespread. However, nobody has successfully measured fidelity separate from the theory because measuring fidelity requires knowing what the original was and what the copy is, which already assumes a copying framework. If I teach you a story and you tell it back with changes, is that low-fidelity copying or high-fidelity reconstruction of the gist? The data looks the same, but the theoretical interpretation differs. This is why the debate stalls. The empirical question cannot be resolved without first agreeing on what counts as a replicator, but agreeing on what counts as a replicator is the very thing being debated.

  The philosophical camp you mentioned, which says the question is trivial or verbal, is partially right but misses the stakes. It is verbal in the sense that we could agree to call the Thin process cultural evolution and the Thick process memetic evolution and the attractionist process cultural epidemiology, and then we could just get on with the work. But they do not do this because the label Darwinian carries prestige and explanatory power. To call something Darwinian is to claim it falls under a unified theory of life and complexity. To deny it is to claim culture is sui generis. So the fight is over territory and theoretical unity, not just description.

  Given this diagnosis, progress will not come from defining Darwinian more precisely. You should stop expecting the question is culture Darwinian to move because it is the wrong question. It is a category mistake to ask if a complex process is a label, when the real issue is model fit. Progress would look like what you did in ecology when comparing null models to selection models. We need comparative modeling where selectionist models, transformational models, and hybrid models are tested against the same cultural data sets with explicit definitions of generations and fitness fixed in advance. If a selectionist model predicts frequency changes better than a transformational model under specific conditions, then we know selection is useful there. If a transformational model wins elsewhere, then we know reconstruction is dominant there.

  The change of question required is from is it Darwinian to under what conditions does a Darwinian model outperform a transformational model. This respects your ecological background where models are tools for prediction rather than statements of ultimate truth. It dissolves the verbal dispute by making the definition of Darwinian operational rather than ontological. It addresses the empirical gap by forcing the measurement of fidelity and fitness within a fixed modeling framework rather than allowing them to shift to save the theory. And it satisfies the explanatory standards by demanding predictive success rather than just-so storytelling. Until the field shifts from defending tribes to comparing models, the circles will continue, because each side is defending a different ideal of what a theory of culture should be, not describing the same phenomenon. You are right to be suspicious of the fitness generality, and that suspicion is the most productive thing you can bring to the reading.
