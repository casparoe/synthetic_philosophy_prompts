prompt: |-
  so I write about AI for a general-reader outlet and I'm working on a feature about "AI safety via debate" — the setup where you put two copies of a model against each other, one argues for an answer and one against, and a judge (a human, or sometimes a weaker model) picks the winner, on the theory that the honest side wins because the truth is the easier case to make. Every researcher I've talked to for this piece reaches for the same comparison, and I've started leaning on it too: it's a courtroom. Two advocates, opposing briefs, a judge in the middle, the better argument wins. Great image, and honestly its carrying half my lede.

  Except a guy I got coffee with said the courtroom picture falls apart over something he called "obfuscated arguments" — his point being that a dishonest debater can win not by lying well but by making their case so tangled that the judge can't untangle it in the time and tokens they've got, so the honest debater never gets their refutation across even when one exists. I think I follow him, but I definately don't want to write something dumb.

  So help me audit it. How far does the courtroom analogy actually hold? Give me the correspondence table first — who maps onto who, what plays the role of the law, the evidence, the jury, the burden of proof, the appeals process, the whole thing. Then where it breaks, and which of those breaks actually matter for the claim I'm trying to make (that debate is what keeps these models honest) versus which are just flavour. Tell me what the courtroom picture quietly smuggles in that the debate setup doesn't have — I've got a hunch it's something about the judge being able to understand the arguments if only you give them enough time. And then the real question: with the disanalogies on the table, does "debate keeps the model honest" still stand, or was the analogy doing all the work? If there's a cleaner comparison for what's really going on, I'll take it. And no citations please — I just need to understand it well enough to write it plainly.
