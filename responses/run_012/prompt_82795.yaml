answer: |-
  You've drawn the distinction sharply, and I'll concede the immediate point: blame isn't just a verdict, it's a transaction. It involves a demand for acknowledgment, for change, for an account. And yes, when your uncle sits in your kitchen and acts as though he has the moral high ground to summon you to the bench, he is claiming a privilege he forfeited. If "standing" just means "the social right to preach without being laughed out of the room," then obviously he lacks it. He's a hypocrite, and hypocrisy is ugly. But here is where I think you're letting him off the hook too easily by focusing on his entitlement rather than your obligation.

  You say he's making a claim on you, that he's saying you owe *him* an answer. I agree that he's *saying* that, but I disagree that it's true. You don't owe him an answer. You owe the truth an answer. You owe the value of your own life an answer. When philosophers talk about blame as a demand, they often treat the blamer as the source of the demand, but I think that's a mistake. The blamer is just the messenger. If a corrupt policeman pulls you over for speeding, the fine is still valid. The corruption of the officer doesn't negate the law, and it doesn't negate the fact that you were speeding. By focusing on his lack of standing, you are treating the moral norm as if it belongs to him, as if he owns the right to enforce it. He doesn't. The norm exists independently of his biography.

  So, when you ask if my view swaps in a weaker "assessment" and leaves out the "demand," I think you have it backward. My view preserves the full force of the demand; it just relocates the source. If what you are doing is wrong—or even just harmful to yourself, which seems to be the crux here—the demand that you change comes from the reality of your situation, not from your uncle's mouth. By telling him "you don't get to say that," you are treating the moral demand as if it's contingent on his purity. You're saying, "Because you failed, the rule no longer applies to me." That gives him too much power. It makes him the gatekeeper of your obligations.

  I will concede this: there is a relational aspect to blame. If he were saying, "You have betrayed *me*," he would be wrong, because he abandoned the relationship. But if he's saying, "You are wasting your life," he is appealing to a universal standard, not a relational contract. The awkwardness you feel isn't proof that he lacks standing; it's proof that you recognize the truth of the claim and resent the messenger. "Standing" talk often functions as a shield for that resentment. It allows us to say, "I don't have to listen," when the harder, more honest thing is to say, "I hear you, you're a hypocrite, and you're also right." Dismissing the demand because the demander is compromised doesn't make the demand go away; it just leaves you alone with it, without the excuse of his hypocrisy to hide behind.
