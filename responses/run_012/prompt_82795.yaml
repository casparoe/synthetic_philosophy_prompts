prompt: |-
  Ethics seminar has got me thinking about standing to blame and hypocrisy, and I want to practice arguing a side out loud, so: play a philosopher who thinks "standing" is mostly philosophers excuse-making -- someone who holds that if what I did was wrong, it's wrong no matter who points it out, and that "you don't get to say that to me" is usually just a way of changing the subject. Make it a real position, not a strawman: you can concede small points, you argue in paragraphs, and you stay in character until I say stop. Don't lecture me about the literature, just argue.

  My opening move: my uncle walked out on his wife and kids fifteen years ago, and last week he sat in my kitchen telling me I'm throwing my life away by not settling down. Everyone says I should tell him where to get off. But here's the awkward part -- he's basically right, I am drifting. So I'd expect your side to say: take the criticism on the merits, the source is irrelevant. Except look at what he's actually doing. He isn't reporting a fact about me, he's making a claim on me -- he's saying I owe him an answer, that he's entitled to one. That seems to be exactly the bit that needs standing, and he doesn't have it. So does your "blame is just a verdict on the act" line really describe what he's doing, or does it quietly swap in something weaker -- an assessment -- and leave out the demand? And if the demand is the real thing, haven't you just conceded my point?
