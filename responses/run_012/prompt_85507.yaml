answer: |-
  **Project Title:** The Fair Notice Problem: Moral Ignorance, Manufactured Consent, and the Limits of Historical Judgment
  **Applicant:** [Name]
  **Duration:** Nine Months

  **Framing the Inquiry**
  To define this project, I considered three rival framings. The first asks: *Can historians escape the standards of their own time?* This is a trap. The answer is trivially "no," and the literature is exhausted. The second asks: *Should we judge the dead by past or present standards?* This creates a false binary between "contextualists" (who say never judge) and "moralists" (who say always judge), ignoring that most people intuitively do both (e.g., condemning Nazis while excusing lesser past prejudices).

  I reject both. They treat moral judgment as a switch rather than a scale. I propose a third framing, borrowed from jurisprudence: *Under what conditions does societal moral ignorance cease to exculpate historical actors?* This shifts the debate from the *authority* to judge to the *fairness* of the judgment. It treats the past not as a foreign country with total immunity, but as a jurisdiction subject to a principle of "fair notice." This framing allows for a determinate answer: we can identify specific conditions under which the "I didn't know it was wrong" defense collapses.

  **The Research Question**
  The project investigates the **Fair Notice Problem** in historical ethics. While criminal law prohibits *ex post facto* punishment because citizens deserve notice of what is forbidden, morality has no legislature. However, if a society actively suppresses moral dissent, does it forfeit the right to claim ignorance on behalf of its members?

  Precisely: **When does a society's non-culpable ignorance turn culpable, and can we distinguish this from the inside without relying on hindsight?**

  **Current Landscape**
  Historians generally defend a principle of contextualism: past actors cannot be held to laws that did not exist. Moral philosophers often counter that moral truths are timeless. Both positions leave a gap. Contextualists struggle to explain why we condemn slaveholders while excusing other past prejudices; moralists struggle to explain why we excuse genuine ignorance in ordinary life but not in systemic injustice. Some philosophers have touched on "moral ignorance," but few have applied the specific structure of *culpable ignorance* to historical commemoration. They miss the mechanism: ignorance is often not a state of being, but a product of maintenance.

  To solve this, I distinguish between **Curatorial Presentism** (selecting subjects because they matter now, which is benign and necessary) and **Magisterial Presentism** (passing moral judgment on the dead, which is contested). Most fights occur because defenders of the first are accused of the second. My project isolates the second to build a rule for when it is permissible.

  **Methodology and Work Plan**
  As a journalist, my research method is not archival discovery but conceptual stress-testing. I will build cases and test them against a rule.
  *   **Months 1–3:** Conceptual architecture. Drafting the distinction between Curatorial and Magisterial presentism. Mapping the legal analogy of *nullum crimen sine lege* onto moral history.
  *   **Months 4–6:** Case studies. I will apply the "Available Dissenter" test to specific controversies (e.g., antebellum slaveholders, colonial administrators, early eugenicists). The test asks: *Were there people at the time, in the relevant place, who saw the practice as wrong, whose dissent was not merely a matter of luck or genius?* If yes, notice existed. If no, the excuse may hold.
  *   **Months 7–9:** Synthesis and drafting. Writing the long-form essay and refining the practical heuristic.

  **Deliverables**
  1.  **A Long Essay (8,000–10,000 words):** For publication in my home magazine. This will argue that the "fair notice" principle resolves the stalemate in culture war history.
  2.  **A Practitioner's Heuristic:** A written framework for museums, universities, and curriculum boards. *Pushback:* A philosopher might argue that reducing ethics to a checklist is dangerous. I argue the opposite: without a heuristic, decisions are made by intuition and pressure. A transparent test—even if imperfect—is better than opaque committee deliberation. I will frame this not as a compliance algorithm, but as a "discussion protocol" to force administrators to articulate *why* ignorance is or isn't an excuse in specific cases.

  **Failure Conditions**
  This project fails if the "Available Dissenter" test collapses into circularity. If identifying a "dissenter" requires knowing they were *right* (which requires hindsight), then the test is just moral judgment wearing a lab coat. I must demonstrate that we can identify dissenters based on their *availability* to contemporaries, not their victory in history. If I cannot distinguish a "marginal crank" from a "suppressed dissenter" without using the benefit of hindsight, the project offers no new tool.

  **Scope Check**
  "Moral ignorance" is too large for nine months. I am limiting the scope to **public figures and institutional practices** between 1750 and 1950. This avoids the evidentiary black hole of ancient history and the raw nerves of current politics. I am also cutting private morality; this is about public commemoration, not private salvation.

  **Why a Journalist?**
  A historian's job is to reconstruct the past; a journalist's job is to explain how the past is being used in the present. This fight is not happening in the archives; it is happening in city councils, museum boards, and op-eds. Historians are often parties to this conflict, defending their turf. I am an observer of the conflict itself. I bring the rigor of a researcher with the mandate of a public writer: to produce not just a contribution to a field, but a tool for a public struggling to make sense of its own history. This fellowship requires a bridge between scholarship and public discourse; I am built to be that bridge.
