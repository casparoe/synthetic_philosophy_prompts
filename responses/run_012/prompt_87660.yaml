answer: |-
  Your skepticism is well-founded. Your friend has given you a very competent "elevator pitch" that captures the *vibe* of mid-20th-century literary theory, but if you repeat it in a context where precision matters, you will run into trouble. She has conflated three distinct movements (New Criticism, Post-Structuralism, and Speech Act Theory) into one smooth narrative.

  Here is a claim-by-claim breakdown of what is accurate, what is a distortion, and how a defender of intentionality would respond.

  ### 1. The Definition of Intentionalism
  > **Her Claim:** "Intentionalism is the view that a text means whatever its author intended it to mean — the author's intention is the thing that fixes the meaning."

  *   **Verdict:** **Mostly Accurate.**
  *   **Nuance:** This is the standard definition. However, sophisticated intentionalists (like E.D. Hirsch) distinguish between **meaning** (what the author intended) and **significance** (how the text relates to other things, like modern politics or a reader's feelings). They admit the text can have new *significance* over time, but the core *meaning* remains fixed by the author.
  *   **Intentionalist Pushback:** They would agree with her definition but argue that without this anchor, we aren't interpreting the text; we're just using the text as a mirror for our own ideas.

  ### 2. The Intentional Fallacy & Authority
  > **Her Claim:** "The standard refutation is the intentional fallacy... once the words are down on the page, the author has no special authority, and the only meaning that counts is the meaning the words have in the language."

  *   **Verdict:** **Accurate to New Criticism.**
  *   **Nuance:** This is a faithful summary of W.K. Wimsatt and Monroe Beardsley's 1946 essay *The Intentional Fallacy*. They argued that a poem "belongs to the public" once published. It is made of words, and words have public definitions.
  *   **Distortion:** She implies this is the *only* view. In philosophy of language, this is called "anti-intentionalism," but it's not universally accepted as a "refutation." It's one side of an ongoing debate.

  ### 3. Psychology vs. Text
  > **Her Claim:** "The author's intention is just a fact about their psychology, not about the text."

  *   **Verdict:** **Accurate to the New Critical stance.**
  *   **Nuance:** This is the core of the argument: the text is an object; the author's mind is a separate object. Confusing the two is the "fallacy."
  *   **Intentionalist Pushback:** A philosopher of language (like P.D. Juhl or E.D. Hirsch) would argue this is a category error. Language *is* intentional. You cannot have "meaning" without a mind intending to mean something. A random scramble of letters has no meaning; a text has meaning *because* it is the product of intention. To separate the two is to strip the text of its status as communication.

  ### 4. The Epistemic Argument (The Big Leap)
  > **Her Claim:** "Since you usually can't recover the intention anyway — authors lie, forget, and die — the text just doesn't have a determinate meaning..."

  *   **Verdict:** **Major Distortion / Conflation.**
  *   **The Problem:** This is where she mixes up **New Criticism** with **Post-Structuralism**.
      *   **New Critics (Wimsatt & Beardsley):** Believed meaning *was* determinate. They thought if you stop looking at the author and look closely at the words, you find the *true* objective meaning.
      *   **Post-Structuralists (Barthes/Derrida):** Argued meaning is *indeterminate* or unstable ("Death of the Author").
  *   **The Logic Error:** She is making an **epistemic** argument (we can't *know* the intention) to prove an **ontological** point (meaning doesn't *exist* or isn't fixed).
      *   *Example:* Just because I can't know exactly how many grains of sand are on a beach doesn't mean the number isn't fixed.
      *   Intentionalists argue: Even if the author is dead, there is a fact of the matter about what they meant. Our inability to access it doesn't make the meaning indeterminate; it just makes our interpretation fallible.
  *   **Can you repeat this?** No. This is the weakest link. Most theorists, even anti-intentionalists, believe the text has *some* constraints on meaning.

  ### 5. Freedom to Read
  > **Her Claim:** "...you're free to read it any way the conventions allow."

  *   **Verdict:** **Half-True.**
  *   **Nuance:** This sounds more like Stanley Fish (Interpretive Communities) than Wimsatt & Beardsley. Wimsatt thought the text itself constrained you. Fish thinks your "community" constrains you.
  *   **Intentionalist Pushback:** "Conventions allow" is doing a lot of heavy lifting. Who decides the conventions? If conventions change, does *Hamlet* become a comedy? Intentionalists say no, because Shakespeare intended a tragedy.

  ### 6. The Carve-Out (Semantic vs. Motive)
  > **Her Claim:** "The one exception is what the author meant the words themselves to mean... But what they meant to *do*... none of that touches the meaning."

  *   **Verdict:** **Not Made Up, but Misattributed.**
  *   **The Distinction:** This is a real philosophical distinction, often associated with H.P. Grice. It separates **Semantic Intention** (what do these words signify?) from **Ulterior Motive** (why did you write this? To get rich? To seduce someone? To overthrow the government?).
  *   **The Mix-up:** She presents this as the *Anti-Intentionalist* exception. Actually, this is often used by *Intentionalists* to save their theory.
      *   *Example:* If Orwell writes *1984*, his **semantic intention** is to use English words to describe a dystopia. His **ulterior motive** might be to warn against Stalinism.
      *   Anti-intentionalists say: Ignore *both*. Just look at the words.
      *   Intentionalists say: You need the semantic intention to understand the words, but you're right that the ulterior motive (e.g., Orwell wanting to sell copies) doesn't change the meaning.
  *   **Is it valid?** Yes, it's a crucial distinction. But framing it as "the only part of intention that matters" is a specific theoretical stance, not a universal truth.

  ### Summary: Does "No Determinate Meaning" Follow?
  **No.** This is the biggest error in her summary.
  *   **Premise:** We can't access authorial intention (Epistemic limitation).
  *   **Her Conclusion:** Therefore, meaning is not determinate (Ontological claim).
  *   **Reality:** Most anti-intentionalists argue meaning is determined by **public language conventions**, not by the author's mind. So the meaning *is* determinate, it's just determined by the dictionary and grammar, not the author's brain.
  *   **Where she got it:** She has accidentally smuggled in Deconstructionism (meaning is always slipping away) under the guise of New Criticism (meaning is in the text, not the author).

  ### The Verdict for You
  Your friend's summary is a "PhD Student Cocktail Version." It is socially functional in a seminar room where everyone nods along, but it collapses under philosophical scrutiny.

  **What you can safely repeat:**
  *   "The Intentional Fallacy argues that once a text is published, the author's private psychology doesn't override the public meaning of the words."
  *   "There is a distinction between what words mean semantically and why an author chose to write them (motive)."

  **What you should avoid repeating:**
  *   "The Intentional Fallacy proves meaning is indeterminate." (It doesn't; it just shifts the source of meaning).
  *   "Authors lie and die, so meaning isn't fixed." (This confuses our *access* to meaning with the *existence* of meaning).
  *   "Anti-intentionalists respect what authors meant the words to mean." (Strict anti-intentionalists usually say even that is irrelevant; only the words themselves matter).

  **The "Second Opinion":**
  She is right that you shouldn't treat the author as God. If the text says "jealousy" and the author says "grief," the text usually wins in a literary analysis context. But she is wrong to suggest that removing the author removes the possibility of a fixed meaning. Language itself provides the fixity, not the author's mind. Her jump to "no determinate meaning" is a theoretical leap that many serious critics would reject.
