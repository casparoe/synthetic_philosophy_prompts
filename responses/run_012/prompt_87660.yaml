      *   *Claim 2:* "The standard refutation is the intentional fallacy..." (Reference to Wimsatt & Beardsley)
      *   *Claim 3:* "...author's intention is irrelevant to what the text means: once the words are down on the page, the author has no special authority..." (The core of New Criticism/Anti-intentionalism)
      *   *Claim 4:* "...author's intention is just a fact about their psychology, not about the text." (Public vs. Private distinction)
      *   *Claim 5:* "...since you usually can't recover the intention anyway — authors lie, forget, and die — the text just doesn't have a determinate meaning..." (The Epistemic Argument leading to Indeterminacy)
      *   *Claim 6:* "...you're free to read it any way the conventions allow." (Reader-Response/Conventionalism leanings)
      *   *Claim 7:* "The one exception is what the author meant the words themselves to mean... But what they meant to *do*... none of that touches the meaning." (Semantic Intention vs. Ulterior Motive)

  3.  **Evaluate Each Claim (Mental Sandbox/Knowledge Retrieval):**

      *   *Claim 1 (Intentionalism Def):* Roughly correct, though "actual intentionalists" (like Hirsch) distinguish between *meaning* and *significance*.
      *   *Claim 2 & 3 (Intentional Fallacy):* Accurate to Wimsatt & Beardsley (1946). They argued judging a poem by the author's intended effect is a fallacy. The text is public.
      *   *Claim 4 (Psychology vs. Text):* Classic New Criticism stance. Accurate to that school of thought.
      *   *Claim 5 (Unrecoverable -> Indeterminate):* **RED FLAG.** This is the weak link. Just because intention is hard to know (epistemic problem) doesn't mean meaning doesn't exist (ontological problem). Also, Anti-intentionalists usually argue meaning *is* determinate based on linguistic conventions, not that it's indeterminate because intention is missing. This sounds like a slide into Post-structuralism/Deconstruction mixed with New Criticism.
      *   *Claim 6 (Read any way conventions allow):* This is more Fish (Interpretive Communities) than Wimsatt & Beardsley. W&B believed in the text's objective structure.
      *   *Claim 7 (Semantic vs. Ulterior Intention):* This is a sophisticated distinction (Gricean semantics vs. pragmatic effect). It's not "made up," but phrasing it as the *only* exception is tricky.

  4.  **Synthesize the Critique:**

      *   **Accuracy:** She gets the New Criticism/Wimsatt & Beardsley basics right (Intentional Fallacy, public text, psychology vs. work).
      *   **Distortion/Conflation:** She conflates *New Criticism* (text has objective meaning based on language) with *Post-structuralism* (meaning is indeterminate/unstable). The "Intentional Fallacy" doesn't necessarily lead to "no determinate meaning." In fact, New Critics wanted *more* determinate meaning found *in the text*, not less.
      *   **The "No Determinate Meaning" Jump:** This is the biggest error. Anti-intentionalism usually argues meaning is determined by *public language conventions*, not that it's undetermined. The leap from "we can't know intention" to "meaning doesn't exist/isn't fixed" is a non-sequitur in standard lit theory. It sounds like she's mixing Wimsatt & Beardsley with Derrida or Barthes ("Death of the Author").
      *   **The Carve-out (Semantic vs. Motive):** This is actually a very real philosophical distinction (often associated with Grice or later intentionalists like Knapp & Michaels). It's not made up. However, framing it as the "Anti-intentionalist exception" is slightly odd. Usually, intentionalists make this distinction to save intentionalism, not anti-intentionalists.

