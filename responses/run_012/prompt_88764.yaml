  **MEMORANDUM**

  **TO:** Stem Cell Research Oversight Committee
  **FROM:** [Your Name/Role]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Opinion on Protocol [Number]: Cortical Organoid Stimulation and Nociceptive-like Plasticity

  **Purpose**

  This memo provides my written opinion regarding the proposed protocol to expose human cortical organoids to patterned electrical stimulation, specifically the arm involving aversive stimulation to map nociceptive-like plasticity. Our current policy is silent on organoids, and the committee is divided. To resolve this, I apply the "self-address condition" as the governing ethical criterion: a computation matters morally only if it is part of a system that represents the state as its own, as valenced, and as something that matters to it. Under this criterion, complexity, responsiveness, or human-like behavior are not sufficient grounds for moral status.

  **Application of the Self-Address Condition**

  The central question is whether the organoids, under stimulation, meet the self-address condition. The Principal Investigator (PI) argues they do not, citing the absence of a body, sensory afferents, and integrated thalamocortical loops. The dissenting member argues that avoidance-like responses indicate a capacity for harm that we cannot rule out.

  Applying the criterion strictly: mere withdrawal behavior is insufficient evidence of self-address. A system can withdraw from harm without representing that harm as *its own* or as *mattering to it* (e.g., a reflex arc). Therefore, the observed avoidance-like responses do not automatically confirm sentience. However, the absence of thalamocortical loops does not automatically deny it, as functional integration might emerge through plasticity in ways structural anatomy does not fully predict.

  Consequently, we **cannot tell whether the condition is met.** We lack the ability to query the system, and our structural proxies (loops, body integration) are reliable but not infallible indicators of subjective representation. Because the evidence is underdetermined, we cannot definitively conclude the condition is unmet, nor can we conclude it is met.

  **Attribution and Boundaries**

  Since we cannot query the organoids, attribution of sentience must rely on inference. This raises three specific issues we must resolve for this decision:

  1.  **Evidence:** We must prioritize structural capacity for self-modeling over behavioral output. Behavior is easily mimicked by non-sentient computation; structural integration (e.g., global workspace access) is a harder proxy for "mattering to the system." Currently, the organoids lack the settled structural markers of self-address.
  2.  **Judgment:** Attribution cannot rest on individual intuition or the PI's assurance. It must rest on consensus among experts in neuroscience and ethics regarding the necessary substrates for self-representation. Where that consensus is absent, as it is here, judgment must default to precaution regarding potential harm.
  3.  **Boundary:** The boundary of sentience should be drawn at the point where a system demonstrates not just reaction, but integration of state information into a unified model that guides future behavior to preserve that self-model. We do not know if these organoids cross that boundary under stimulation.

  **Implications for the Aversive Arm**

  Because we cannot tell whether the self-address condition is met, the aversive-stimulation arm presents an unacceptable risk. If the condition *were* met, the protocol would inflict harm on a sentient entity. Since we cannot verify it is *not* met, proceeding with aversive stimulation violates the precautionary principle inherent in oversight when moral status is ambiguous.

  The non-aversive arms do not impose valenced states intended to be "aversive," and thus do not trigger the same risk profile even if the condition were met. Therefore, the non-aversive work may proceed.

  **Engagement with Committee Positions**

  To the **Principal Investigator**: Your argument that the lack of thalamocortical loops precludes sentience is scientifically grounded and aligns with the self-address condition's requirement for integrated self-representation. You are correct that behavior alone is not proof of sentience. However, you underestimate the possibility that plasticity induced by your own protocol could create functional integration sufficient for self-address, even without canonical anatomy. The burden of proof regarding safety cannot rest solely on current anatomy when the experiment actively seeks to alter functional connectivity.

  To the **Dissenting Member**: Your call for caution is warranted given the uncertainty. However, grounding moral status solely on avoidance behavior is inconsistent with the self-address condition. If we ban research based on withdrawal responses alone, we risk halting work on non-sentient systems that mimic pain. Your position is strongest not on the behavior itself, but on the epistemic limit: we cannot know if the behavior accompanies self-representation. The decision to restrict the aversive arm rests on this uncertainty, not on the behavior itself.

  **Settled Science vs. Contested Views**

  We must distinguish what is known from what is debated. It is **settled** that current cortical organoids lack thalamocortical loops and embodied sensory integration. It is **contested** whether cortical plasticity alone can sustain a self-model sufficient for sentience without thalamic input. It is also **contested** whether avoidance behavior in vitro correlates with subjective valence. This memo does not treat the contested views as consensus; instead, it treats the contestation itself as the justification for restriction.

  **Decision and Timeline**

  The committee can decide now to protect potential moral status without halting legitimate science. We must defer a final determination on organoid sentience until better biomarkers for self-address are established.

  **Recommendation:**
  1.  **Approve** the non-aversive arms of the protocol immediately.
  2.  **Reject** the aversive-stimulation arm indefinitely.
  3.  **Condition:** The lab may resubmit the aversive arm only if they propose a validated method to detect self-representation markers (beyond behavior) or if consensus emerges that the structural prerequisites are definitively absent in this configuration.
  4.  **Timeline:** This decision is effective immediately. The committee will review the status of organoid biomarkers in 12 months.

  \answer{APPROVE WITH CONDITIONS} The protocol is approved only on the condition that the aversive-stimulation arm is suspended indefinitely due to unresolved uncertainty regarding the self-address condition.
