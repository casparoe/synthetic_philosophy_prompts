  The regress never bottoms out.
  It bottoms out in luck.

  Given a self you didn't make.
  I hold you responsible for what you do.
  It bottoms out in luck.
  The resentment feels solid as stone.

  ***

  **Note on Faithfulness**

  I am highly confident that this rendering captures the structural core of Strawson's Basic Argument: the requirement that ultimate responsibility for *what you do* entails responsibility for *how you are*, the impossibility of being *causa sui*, and the resulting infinite regress that ultimately lands in luck (factors outside your control) if it stops at all. The terminology ("how you are," "what you do," "causa sui," "bottoms out") is drawn directly from Strawson's own phrasing.

  The one liberty I have taken is in the third stanza's conclusion ("It bottoms out in luck"). Strawson's argument presents a dilemma: either the regress goes on forever (impossible for a finite being) or it stops at a point you didn't control (luck). By stating definitively that it "bottoms out in luck," the poem collapses the dilemma into a single conclusion to satisfy the pantoum's need for closure. While this captures the *result* of the argument (no ultimate responsibility), it simplifies the logical fork that leads there. Additionally, the poem emphasizes the persistence of reactive attitudes (resentment) despite intellectual assent; while Strawson acknowledges these feelings are hard to shake, his argument aims to show they are fundamentally unjustified, whereas the poem leaves them standing "solid as stone" to highlight the human tension you requested.
