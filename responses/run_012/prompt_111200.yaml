answer: |-
  **Brainstorming Notes**

  *   **Character A (Reductionist/Pro):** Argues survival = psychological continuity + right cause. Identity is empty. If the copy remembers, loves, and fears like me, I survive.
  *   **Character B (Skeptic/Con):** Grants reductionism (no soul) but argues causal history matters. Information transfer isn't biological continuity. The copy is a "counterfeit" that thinks it's me, but *I* cease.
  *   **Case 1: Branching.** If the original isn't destroyed, two exist. A must admit identity fails but survival succeeds (survive twice). B argues this proves the arrival isn't *me*.
  *   **Case 2: Gradual Transmission.** Replacing neurons one by one vs. scan/print. A argues no relevant difference. B argues the *chain* of causation is broken in scanning.
  *   **Case 3: Illness.** Dementia breaks psychological connectedness. If A is right, the dementia patient is already dead/new person. B uses this to show A's criterion is too loose for the living, let alone the dead.
  *   **Concessions:** A admits identity isn't preserved in branching. B admits the copy is functionally perfect.
  *   **Ending:** Dispute lies in whether we care about *causal history* or *psychological outcome*.

  ***

  **The Hearing**

  The room smelled of ozone and stale coffee. Elias sat opposite Mara, the transcript recorder humming between them like a third party.

  "You call it survival," Mara said. "I call it a counterfeit good enough to fool the counterfeit himself."

  Elias didn't blink. "If the counterfeit wakes up with my memories, loves my wife, and fears my debts, what have I lost? You're clinging to a word. 'Identity.' It's an empty vessel. What matters is psychological connectedness. The machine preserves that."

  "It preserves the pattern," Mara corrected. "Not the cause. You say 'with the right kind of cause.' That phrase is doing all the work in your argument, Elias. An informational chain—a pattern read off a brain and written onto other matter—is not the cause that sustains a person. It's a copy. When you step into that box, you die. Someone else wakes up on Mars thinking they are you."

  "Suppose we test that," Elias said. "Consider the branch case. Suppose the scanner doesn't destroy the original. I step in on Earth. A copy appears on Mars. Both exist. Both claim to be me. On your view, the Earth-me is the real one. On mine, both are psychologically continuous with the person who stepped in. If I know branching will happen, should I fear death?"

  "This thought experiment is supposed to show that identity isn't what matters," Mara said. "Because I can't be identical to two people. Logic forbids it. So you conclude identity doesn't matter."

  "I conclude survival matters," Elias said. "If I know branching is happening, I don't fear death. I expect to wake up in both places. If the machine destroys the Earth-body, why should I fear that? It's just a specific path of continuity. The Mars-body is still causally connected to my psychology."

  "It's not causally connected in the right way," Mara said. "It's like recording a symphony and playing it back. The music is the same. The cause is a needle on vinyl, not the orchestra. If you accept branching, you admit the Mars-arrival isn't *you*. They are a survivor. You are the dead. You're saying I should be comforted that a survivor exists. I say I care about *my* survival."

  "Then let's tighten the cause," Elias said. "Consider gradual transmission. We replace your neurons one by one with synthetic equivalents that perform the same function. Over a year, every cell is swapped. You walk out the same person. Most agree you survive this. Now, suppose we do it instantly. We scan the neurons, replace them all at once. Where is the line? If gradual survival is real, why is instant transmission death?"

  "This is supposed to show that speed shouldn't matter to continuity," Mara said. "But it does. In the gradual case, there is an unbroken chain of causal dependence. Each moment causes the next. In your machine, the chain is severed. The information jumps. You're arguing that because the endpoints are identical, the journey doesn't matter. But the journey is the person. If I fax a letter, the recipient gets the words. But the ink isn't mine. The history isn't mine."

  "History is a fetish," Elias said. "If the function is identical, the history is irrelevant. But let's look at the living. Consider the illness case. A man develops advanced dementia. His psychological connectedness to his past self is gone. He doesn't remember his wife. He doesn't fear his old debts. On my view, he is not numerically identical to the man who enlisted in the army forty years ago. The connectedness has faded."

  Mara leaned forward. "And this is supposed to show what?"

  "That your objection proves too much," Elias said. "If you insist on strict causal continuity, you must admit the dementia patient is already dead. A new person occupies the body. If you accept that the dementia patient is still the same man despite the break in psychology, then psychology isn't the key. If you agree psychology is the key, then you must accept the machine, which preserves psychology better than the disease does."

  "I concede the dementia case is hard," Mara said. "But I don't concede your conclusion. The dementia patient shares a biological history that the machine copy lacks. The body degrades slowly. The machine discards the body entirely. You're forcing me to choose between two bad options: either the dementia patient is a stranger, or the teleporter arrival is me. I choose the stranger. I'd rather live with the biological stranger than die for the psychological copy."

  "So you admit," Elias said, "that for the living, biological continuity trumps psychological connectedness. But for the dead, you demand psychological connectedness to claim survival. You're inconsistent."

  "I'm consistent about causation," Mara said. "I care about the process that generates the mind. You care about the mind itself, regardless of how it got there. That's the gap. You think if the result is the same, the cause doesn't matter. I think the cause is the only thing that gives the result value."

  Elias tapped the table. "Then we aren't arguing about facts. We aren't arguing about whether the machine works. We're arguing about what I have reason to care about. If I care about the future existence of my psychology, I should step in. If I care about the specific causal history of this meat, I should stay."

  "You care about being the subject of that future experience," Mara said. "The copy will be a subject. But it won't be you. You won't experience their sunrise. You'll experience nothing. That is what you have reason to care about. The cessation of your specific causal line."

  "But if the copy remembers the sunrise," Elias said, "who is deprived? The psychology exists. The memory exists. The only thing missing is the label 'identity.' And you've already agreed reductionism is true. There is no further fact. No soul. So what is ceasing?"

  "The specific causal line," Mara said. "The thread that ties this moment to that one. You want to splice the thread. I say once spliced, it's a new thread."

  They sat in the hum of the recorder. The dispute hadn't moved, but its edges were sharp now. It wasn't about whether the machine functioned. It was about whether a human being is a pattern that can be transmitted, or a history that must be lived.

  "Then we can't resolve this," Elias said. "Not with logic."

  "No," Mara said. "You're asking me to bet on a outcome. I'm asking you to respect a process. Until you can tell me why the process doesn't matter, I won't sign the license."

  "And until you admit the outcome is all there is," Elias said, "you're banning survival because you're afraid of death."

  Mara closed her file. "Maybe they're the same thing."
