answer: |-
  **Exam Question**

  **Course:** Political Philosophy and Collective Action
  **Assessment:** Final Seminar Examination
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider the following scenario: A research institute holds one pooled annual allocation of compute hours on a shared cluster. No lab can practically be locked out, and there is no per-lab cap. Off-peak, one lab's jobs do not slow anyone else's; at peak, jobs queue behind one another and some labs need fast turnaround. The allocation is renewed each year by voluntary contributions from member labs, and two of the larger labs also maintain the shared software environment that everyone relies on.

  In a reasoned essay, address the following four points:

  1.  Diagnose the economic character of the cluster, distinguishing between the provision problem and the appropriation problem, and explain whether the good is rival or excludable, noting whether this answer changes with load.
  2.  State the strategic structure of the over-use problem at peak times and the assumptions under which over-use is a dominant strategy, then identify a change to the payoffs that turns the same situation into a coordination problem with a cooperative equilibrium.
  3.  Explain why shared ownership is neither necessary nor sufficient for a tragedy of collective action, giving one hypothetical case for each claim.
  4.  Assess three remedies — assigning private quotas, charging a congestion price, and devolving to user self-governance with monitoring and graduated sanctions — saying what each gets right and what it leaves untouched.

  ***

  **Model Answer**

  The scenario presents a hybrid collective action problem that shifts character depending on temporal load. Diagnostically, the cluster functions as a public good regarding provision but a common-pool resource regarding appropriation during peak times. The provision of compute hours and software maintenance is non-excludable and non-rival up to the point of contribution, creating a free-rider incentive where labs benefit from renewal without paying. However, the appropriation of compute time is non-excludable but rivalrous only at peak load. Off-peak, the good is non-rival because one user's consumption does not diminish another's. At peak, it becomes rivalrous because queueing imposes latency costs on others. Failing to distinguish these margins leads to incorrect policy prescriptions, as solving the provision problem does not automatically solve the congestion problem.

  The strategic structure of peak-time usage resembles a Prisoner's Dilemma. Assuming labs value fast turnaround highly and cannot coordinate, the dominant strategy for each is to run jobs immediately regardless of queue length, because defecting yields a higher individual payoff regardless of what others do. This leads to a Nash equilibrium where everyone queues and turnaround slows for all. To convert this into a Coordination Game, the payoff structure must change such that cooperation becomes the preferred response to cooperation. This occurs if a congestion price is introduced or if social sanctions raise the cost of peak usage. If the cost of running during peak exceeds the benefit unless others also wait, labs prefer to match the behavior of the group. The equilibrium shifts from universal defection to a focal point where all labs schedule off-peak, provided they trust others to do the same.

  Regarding ownership, shared ownership is neither necessary nor sufficient for collective failure. It is not sufficient because common ownership can coexist with successful governance rules that prevent overuse. For example, a community-owned fishery with strict internal monitoring and catch limits may sustain yields indefinitely despite shared title. It is not necessary because tragedy can occur under private ownership if the owner lacks the incentive or capacity to maintain the asset for long-term use. For instance, a private landlord might strip-mine a rental property for short-term profit if the lease structure rewards immediate extraction over maintenance, resulting in resource degradation despite exclusive ownership. The driver of failure is the incentive structure at the margin of use, not the legal title.

  Three remedies address these failures differently. Assigning private quotas internalizes the rivalry by capping usage, which solves congestion but leaves the provision problem untouched; labs may still under-contribute to the annual renewal if quotas are fixed regardless of contribution. Charging a congestion price correctly signals the marginal cost of peak usage, reducing demand to efficient levels, but it may exclude smaller labs lacking funds, undermining the research mission, and does not guarantee voluntary renewal of the cluster itself. Devolving to user self-governance with monitoring and sanctions addresses both appropriation and provision by allowing users to craft rules fitting local conditions. This gets right the need for legitimate enforcement and adaptability. However, it leaves untouched the risk of internal factionalism; if large labs dominate the governance, they may set rules that exploit smaller labs, causing the coalition to collapse. Thus, while self-governance is robust, it requires a balance of power to remain stable.

  ***

  **Marking Scheme**

  | Point | Criteria | Marks | Typical Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Diagnostic Precision:** Correctly identifies the shift from public good (provision) to common-pool (appropriation) and notes rivalry is load-dependent rather than binary. | 4 | Treating rivalry as a static property of the good rather than a function of capacity and demand. |
  | **2** | **Strategic Analysis:** Correctly identifies the Prisoner's Dilemma structure and specifies a payoff change (e.g., pricing or sanctions) that creates a cooperative Coordination equilibrium. | 4 | Assuming that repeated interaction automatically solves the Prisoner's Dilemma without specifying payoff changes. |
  | **3** | **Ownership Logic:** Explains that ownership title does not determine outcomes, providing valid cases where common ownership succeeds and private ownership fails. | 4 | Conflating legal ownership with access rules or assuming private owners always internalize long-term costs. |
  | **4** | **External Remedies:** Assesses quotas and pricing correctly, noting that quotas fix rivalry but not provision, and pricing fixes efficiency but may create exclusion. | 4 | Arguing that pricing solves all problems without addressing the impact on equity or the provision of the cluster itself. |
  | **5** | **Internal Governance:** Assesses self-governance correctly, noting its adaptability and legitimacy while identifying the risk of internal power asymmetries. | 4 | Assuming community self-governance is inherently stable or ignoring the risk of elite capture within the user group. |
  | **Total** | | **20** | |

  ***

  **Differentiation Note**

  Answers in the 15–17 range will correctly identify the concepts and remedies but treat them as separate checklist items without explaining how the remedies map onto the specific diagnostic failures identified in part one. Answers in the 18–20 range will integrate the analysis, showing explicitly how each remedy targets either the provision or appropriation margin and why a single solution is insufficient for the hybrid nature of the scenario.
