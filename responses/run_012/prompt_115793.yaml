  She would side with your colleague's opponent, treating the wave function like the ether equations: mathematically indispensable but ontologically empty. Her neutrino verdict hinged on conservation laws constrining physical possibilities (what we can *do*), whereas she likely viewed the wave function as a descriptive mechanism (what we can *say*). Since you can formulate quantum predictions without committing to $\psi$ as a physical field, she would classify it as a placeholder that survived because it works, not because it exists.

  **The case that would settle it**
  The issue would be forced if a future theory reproduced all quantum predictions without using state vectors, yet we continued to successfully manipulate quantum systems. If she then declared the wave function "never real" despite its century of survival, she was running rule (d); if she maintained it was real structure despite elimination, she was running rule (b).
