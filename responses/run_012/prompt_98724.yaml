answer: |-
  **Credence: 0.25**

  I am more skeptical than you. While I share your intuition that the *repair strategy* is the tell, the requirement for a *single* criterion, *statable in advance*, and *neutral to verdict* is a logical straitjacket that historical epistemology rarely fits. The demarcation is real, but it is likely a vector sum of several factors rather than a single switch.

  ### Decomposition

  **(a) That there is a fact of the matter about the events at all, of the kind a criterion could track.**
  *Probability: 0.90*
  *Justification:* Ontological realism is the easy part. The Holocaust, the Armenian genocide, and Nanjing occurred with specific material and demographic signatures. There is a truth-value to claims about them. However, the existence of a fact does not guarantee the existence of a *procedural* criterion that can distinguish those who deny it from those who revise it without peeking at the conclusion. This term is high, but it does little work for the proposition.

  **(b) That an evidential and methodological criterion actually separates the two.**
  *Probability: 0.30*
  *Justification:* Denialism has evolved. It no longer typically rejects sources outright; it hyper-scrutinizes them. A denialist can cite archives, demand chain-of-custody for evidence, and point out genuine inconsistencies in survivor testimony. If the criterion is merely "adherence to standard historical method," denialists can clear the bar by performing rigor without integrity. They meet the evidential standards but violate the *spirit* of inference.

  **(c) That denialism is better identified by argumentative form (immunizing moves) than by content.**
  *Probability: 0.60*
  *Justification:* This is the strongest engine for the proposition. Your suspicion aligns with Lakatos's "degenerating research programme." Legitimate revisionism narrows uncertainty; denialism widens the hypothesis to absorb counter-evidence without increasing explanatory power (e.g., shifting from "it didn't happen" to "it was exaggerated" to "it was justified" as each layer is breached). However, codifying "immunization" without referencing the consensus being immunized against is notoriously difficult. It is the right track, but hard to make into a standalone rule.

  **(d) That the criterion is doomed to circularity, sorting methods by the conclusions we already know they reach.**
  *Probability: 0.75*
  *Justification:* This is the primary drag on my credence. To identify an "immunizing move," one must first identify what counts as a valid refutation. But what counts as a valid refutation is often determined by the scholarly consensus—the very verdict the criterion is supposed to produce neutrally. We often recognize denialism because we know the history, not because we spotted a logical fallacy in a vacuum. The "advance" stipulation in your proposition is the breaking point.

  **(e) Whether the whole question is malformed because 'denialism' operates at a different level of description from 'revisionism'.**
  *Probability: 0.40*
  *Justification:* I lean against this being the main blocker. While denialism often targets scale or significance, it ultimately rests on factual claims about the past (e.g., "gas chambers were not used"). The categories are commensurable. The problem isn't that they are different kinds of speech acts, but that one is a parasite on the other. This term is low because I believe the question is well-formed, even if the answer is negative.

  ### Synthesis and Sensitivity

  **Combined Logic:**
  My 0.25 is derived from weighting (c) against (d). While argumentative form (c) is the correct *descriptor* of the difference, the requirement for a pre-stated, non-circular *criterion* (d) makes the proposition fail. We can recognize the difference retrospectively with high confidence, but we cannot write a flowchart that guarantees the same result prospectively without smuggling in the verdict.

  **Most Sensitive Term:**
  **(d) Circularity.** If you could demonstrate a way to define "immunizing strategy" purely syntactically or logically, without referencing the historical consensus it protects, my credence would jump to 0.70.

  **Single Argument to Move the Number:**
  A formalized case study where a "denialist" argument structure is applied to a *settled but non-politicized* historical event (e.g., a specific battle in the Napoleonic Wars) and successfully identified as degenerative by blind review, *or* a case where a legitimate revisionist argument is flagged as denialist by the same formal rule. We need a control group outside the three toxic cases to prove the criterion isn't just a proxy for "claims we dislike."

  ***

  ### Commit

  If the single criterion cannot be had, I bet that **the line is irreducibly normative.**

  **Reasons:**
  1.  **History is a Practice, Not Just a Logic:** Historical truth is not discovered solely through logical deduction from evidence; it is manufactured through the norms of a community. "Revisionism" is adherence to the norms of that community (charity to sources, proportional inference, willingness to concede). "Denialism" is the violation of those norms in service of an extrinsic goal (ideology, exculpation).
  2.  **The Failure of Family-Resemblance:** A family-resemblance concept implies there is a natural cluster of features waiting to be described. I do not believe the cluster is natural; I believe it is *policed*. The boundary exists because the community of historians agrees to enforce it, not because the arguments themselves possess a magical "denialist" particle.
  3.  **Explains the Circularity:** If the line is normative, the circularity charge (d) loses its sting. It is not a bug that the criterion references the consensus; it is a feature. The consensus *is* the norm. To ask for a criterion that operates outside the community's verdict is to ask for a criterion that operates outside history itself.

  **Weak Point:**
  This position risks conflating "truth" with "consensus." It leaves open the possibility that a entire community could become denialist (e.g., Soviet historiography) and label legitimate revisionism as denialism. My defense is that the normative bet relies on *transnational, cross-ideological* consensus (the intersection of German, Israeli, American, and Polish historiography on the Holocaust), which is harder to corrupt than a single national academy. But it remains a vulnerability: if the norm shifts, the demarcation shifts.
