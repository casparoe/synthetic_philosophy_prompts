answer: |-
  1. **A mid-level official accepts a large cash payment from a contractor in exchange for steering a tender to that contractor.**
  This is the paradigmatic case of bribery, featuring a clear quid pro quo, unambiguous private gain, and a direct violation of procurement integrity. There is no plausible cultural or normative framework that legitimizes direct cash-for-contract exchanges in public administration.

  2. **A diplomat accepts valuable gifts from a foreign government; protocol treats such gifts as state property, but he keeps them for personal use.**
  This constitutes embezzlement or theft of state assets, as the property legally belongs to the state rather than the individual. While gift norms vary, the explicit protocol designating them as state property removes cultural ambiguity regarding ownership.

  3. **A customs officer accepts a small payment to release a shipment on the normal schedule rather than holding it for a spurious inspection.**
  Although often normalized as "speed money," this is a coercive exchange where public power is abused to create a problem that payment solves. It fits the definition of corruption strongly, though respondents in high-corruption contexts may view it as a survival tactic rather than a moral failing.

  4. **A regulator accepts nothing of value, but holds open the prospect of a lucrative private-sector position with a firm he oversees, in exchange for favorable treatment later.**
  This is a clear conflict of interest with deferred private gain, undermining regulatory neutrality. It is conceptually strong as corruption, though detection is harder and legal frameworks vary more widely than in direct bribery cases.

  5. **A civil servant hires her nephew for a junior post. He meets the qualifications but is not the strongest applicant.**
  **[Flip Candidate]** Under a universalist meritocratic standard, this is nepotism and corruption; under a particularist reading, it is a fulfilled social obligation. Placement depends entirely on whether the survey prioritizes procedural impartiality or cultural norms of kinship support.

  6. **A bureaucrat directs a contract to a firm owned by his wife's relatives, discloses the relationship, recuses himself from the scoring committee, but remains the signatory on the award.**
  This is a procedural violation and conflict of interest, but the disclosure and recusal mitigate the appearance of clandestine abuse. It supports a corruption verdict weakly because the private gain is indirect and procedural safeguards were partially observed.

  7. **A party official channels state scholarships to members of the party's youth wing as a reward for campaign work.**
  **[Distinct Phenomenon: Clientelism]** This is better classified as clientelism or partisan patronage rather than individual corruption, as the gain accrues to a political group rather than a private pocket. The distinction matters for coding because treating systemic party mobilization as individual corruption conflates regime type with bureaucratic integrity.

  8. **A village head directs development funds toward families of his own lineage, consistent with a local expectation that leaders distribute resources to kin.**
  **[Flip Candidate] [Distinct Phenomenon: Neopatrimonialism]** This behavior is the weakest evidence of corruption because it is explicitly embedded in local normative expectations of leadership. If one adopts a culturally situated reading, this is legitimate governance; if one adopts a universalist Weberian reading, it is corrupt patronage.

  0.5

  The single scenario doing the most work in the disagreement between you and your advisor is **Scenario 4**. It is the purest theoretical stress test for your module, forcing a choice between a universalist definition of public office (where resources must be distributed impartially) and a particularist definition (where leadership is validated through kinship distribution). Your advisor likely views this as corruption to maintain conceptual consistency across nations, while you likely worry that coding this as corruption invalidates the measure in contexts where this behavior is considered dutiful.
