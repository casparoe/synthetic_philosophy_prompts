answer: |-
  You are right to distrust both colleagues. The Traffic Cop reduces conventions to laws, ignoring that their authority comes from function, not enactment. The Etiquette Lady reduces them to preferences, ignoring that some conventions sustain the welfare of vulnerable participants. Your "load-bearing" intuition is the correct one, but it needs to be cashed out in terms of *dependence*.

  Here is the principle your verdicts are tracking. I call it **The Principle of Structural Reliance**.

  **The Principle:**
  *An agent participating in a local social practice is obligated to adhere to its conventions if and only if:*
  1.  *Adherence is necessary to honor the reasonable, welfare-relevant expectations of other participants (The Welfare Clause); OR*
  2.  *Adherence is necessary to maintain a coordination equilibrium that prevents collective inefficiency or harm (The Coordination Clause);*
  3.  *Provided that the convention itself does not undermine basic moral rights or justice (The Corruption Constraint).*

  **Why this works:**
  It treats conventions not as arbitrary rules (Traffic Cop) nor as mere suggestions (Etiquette Lady), but as *infrastructure*. When a convention is infrastructure, opting out isn't just "rude"; it's a failure to support the structure others are standing on.

  ### Mapping Your Verdicts

  **1. The Welfare Clause (Tipping & Lines)**
  This clause handles cases where a specific person or group relies on your compliance for their material well-being or fair treatment.
  *   **US Sit-Down Tip:** The server's wage structure relies on this. It is welfare-relevant. **Obligatory.**
  *   **Japan Tip:** No welfare reliance exists. **Permissible.**
  *   **US Counter Tip:** Expectations are low; wage reliance is minimal or non-existent. **Permissible.**
  *   **Airport Line:** Others rely on the order for fair access to a scarce resource. **Obligatory.**
  *   **Bar Scrum:** No established order, no reliance on a queue. **Permissible.**
  *   **Foreigner in US:** The server's reliance is objective. It exists regardless of the diner's knowledge. **Obligatory (Objective).**
  *   **American in Japan:** No reliance to violate. **Permissible.**

  **2. The Coordination Clause (Escalators & Jaywalking)**
  This clause handles cases where the value of the act is purely in doing what others do to prevent friction or danger.
  *   **Escalator (Wrong Side):** You disrupt the flow. Even if no one is blocked *now*, you degrade the system's efficiency. **Wrong.**
  *   **Jaywalking (Empty/Alone):** No coordination failure, no danger. **Permissible.**
  *   **Jaywalking (With Child):** You are teaching a habit. The child relies on you to instill safe norms for when the street *isn't* empty. This is a developmental reliance. **Wrong.**
  *   **Local Glaring Jaywalker:** He violates the coordination norm (safety/law) while enforcing it. (More on this in the "Cost" section).

  **3. The Corruption Constraint (Bribery)**
  This clause prevents the principle from becoming moral relativism.
  *   **Bribery Visitor:** Even if locally common, the practice is corrosive to justice. The "reliance" of the corrupt official is illegitimate. **Wrong.**

  ### The Asymmetry: Foreigner vs. American
  You asked if your view on the foreigner (bound despite ignorance) vs. the American in Japan (not bound despite action) is chauvinism. It is not. It is a distinction between **Objective Obligation** and **Subjective Culpability**.

  *   **The Foreigner in the US:** The obligation is grounded in the *server's reality*, not the *diner's mind*. When you enter a practice, you take it as you find it. If the practice relies on you, you are bound. That he didn't *know* mitigates his *blame* (he isn't a bad person), but it doesn't change the fact that the server was *wronged* (they lost money they were structurally owed). The wrong is in the outcome of the participation, not the intent.
  *   **The American in Japan:** There is no structural reliance to violate. Leaving cash is a gift, not a fulfillment of an obligation. Since no one is worse off for his deviation (because there was no expectation), no wrong occurs.

  This is not American chauvinism; it is **Local Structural Realism**. You are bound by the physics of the social system you are in, not the one you came from.

  ### The Cost: What This Principle Can't Save
  You asked for honesty about the price. A clean principle always leaves casualties. Here are two of yours that don't fit neatly:

  **1. The Glaring Jaywalker**
  Your verdict: He is a hypocrite and *wrong to glare*.
  The Principle's verdict: He is a hypocrite (violates Coordination Clause), but the Principle doesn't clearly explain why *glaring* is wrong. The Principle explains why *jaywalking* is wrong. It doesn't necessarily generate a duty for others to remain silent about violations.
  *The Fix:* You have to add a subsidiary norm about **Moral Standing**: One lacks the standing to enforce a norm one actively violates. This is a separate meta-norm about authority, not a direct output of Structural Reliance. If you want to save this verdict, you have to admit your theory of conventions needs a theory of standing attached to it.

  **2. The Foreigner's Culpability**
  Your verdict: He "wrongs the server."
  The Principle's verdict: He objectively wrongs the server, but intuitively, we hesitate to call him *immoral* if he genuinely couldn't know.
  *The Price:* You must accept **Strict Liability** in social conventions. You are willing to say an act can be "wrong" (a violation of obligation) even if the agent is "blameless" (not culpable). If you aren't comfortable separating wrongness from blame, this verdict will keep haunting you. If you are (as a metaethicist, you likely are), then the principle holds.

  ### The Dinner Guest Dilemma
  *Scenario:* Visiting colleague, $200 check, about to leave nothing.
  *Analysis:*
  1.  **Welfare Clause:** The server relies on that tip. $200 is significant.
  2.  **Participation:** Your guest is participating in the practice.
  3.  **Knowledge:** He lacks knowledge; you possess it.

  **The Verdict:** You owe the server a warning.
  **The Reasoning:** By hosting, you become the **Interpreter of the Local Structure**. If you stay silent, you are allowing a violation of the Welfare Clause that you have the power to prevent. You are not responsible for his ignorance, but you are responsible for your own complicity in the outcome.
  **The Execution:** This is not about policing your guest; it is about protecting the server. You do not owe your guest silence when his silence harms a third party.
  *How to do it:* Discreetly. "Just a heads-up, the system here is a bit different than back home; the staff relies on the gratuity for their wage. I usually add 20%."
  If he refuses? Then you pay the tip yourself. You cannot allow the server to be wronged on your watch if you can absorb the cost. The obligation falls to the knowledgeable participant when the ignorant one fails.

  ### Summary for the Lunch Table
  Tell your colleagues this:
  Conventions are not laws, and they are not manners. They are **social infrastructure**.
  *   To the Traffic Cop: "I don't follow them because they are rules. I follow them because people are leaning on them."
  *   To the Etiquette Lady: "They aren't optional when someone's paycheck or safety depends on my predictability."

  Your principle is that **obligation tracks vulnerability**. Where there is no vulnerability (empty street, counter service), you are free. Where there is vulnerability (server's wage, line order, child's safety), you are bound. The messiness you feel isn't a lack of principle; it's the accurate reflection that some conventions are load-bearing and others are just drywall. Your job is to tell the difference.
