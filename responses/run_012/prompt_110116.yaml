prompt: |-
  Ok this is a slightly embarrasing one but I need help. My brother-in-law is a paramedic and over the last year he's gotten very into a church, and at Thanksgiving he told the whole table about a woman at a retreat who he says was cured of something the doctors had given up on. I made the mistake of saying "Hume would have something to say about that," and now I have to actually show up with something, because he's read more than I have and I don't want to do the smug thing and get it wrong.

  So I got the Selby-Bigge edition of the first Enquiry out of the library and I've been trying to read Section X properly instead of just the bits everyone quotes. Here's the chunk I'm stuck on:

  "Though experience be our only guide in reasoning concerning matters of fact; it must be acknowledged, that this guide is not altogether infallible, but in some cases is apt to lead us into errors. One, who in our climate, should expect better weather in any week of June than in one of December, would reason justly, and conformably to experience; but it is certain, that he may happen, in the event, to find himself mistaken. However, we may observe, that, in such a case, he would have no cause to complain of experience; because it commonly informs us beforehand of the uncertainty, by that contrariety of events, which we may learn from a diligent observation. All effects follow not with like certainty from their supposed causes. Some events are found, in all countries and all ages, to have been constantly conjoined together: Others are found to have been more variable, and sometimes to disappoint our expectations; so that, in our reasonings concerning matter of fact, there are all imaginable degrees of assurance, from the highest certainty to the lowest species of moral evidence.

  A wise man, therefore, proportions his belief to the evidence. In such conclusions as are founded on an infallible experience, he expects the event with the last degree of assurance, and regards his past experience as a full proof of the future existence of that event. In other cases, he proceeds with more caution: He weighs the opposite experiments: He considers which side is supported by the greater number of experiments: To that side he inclines, with doubt and hesitation; and when at last he fixes his judgment, the evidence exceeds not what we properly call probability. All probability, then, supposes an opposition of experiments and observations, where the one side is found to overbalance the other, and to produce a degree of evidence, proportioned to the superiority. A hundred instances or experiments on one side, and fifty on another, afford a doubtful expectation of any event; though a hundred uniform experiments, with only one that is contradictory, reasonably beget a pretty strong degree of assurance. In all cases, we must balance the opposite experiments, where they are opposite, and deduct the smaller number from the greater, in order to know the exact force of the superior evidence."

  Three things I can't get straight:

  1. "Proof" and "probability" look like technical words for him here, not the ordinary ones. Is a "proof" just an argument from experience with no contrary instances at all, so that proof and probability differ in kind and not just in degree? Because if so, the arithmetic at the end (100 vs 50, deduct the smaller from the greater) seems to only be about probability, and I can't tell whether he thinks proofs can be added up or balanced at all.

  2. Why is the weather example even there? It seems like it's just there to say experience can be misleading without experience being at fault, but then he immediately starts ranking events by how uniform they are, and I lose the thread of what the weather case is supposed to be doing for the argument.

  3. The one that actually matters for Thanksgiving: does this passage commit him to the view that in principle a large enough pile of good testimony could establish a miracle, and he just thinks in practice the pile never gets that big? Or is he already saying something stronger here, before he even gets to the part about miracles being violations of the laws of nature and the case against them from experience being about as strong as experience can make anything? I'm worried I'm reading the ending back into these paragraphs and treating as a conclusion something he hasn't earned yet.

  Can you walk me through what he's actually claiming in these two paragraphs, in order, and tell me where he's doing real argument vs. just fixing vocabulary? And if I've got the proof/probability thing wrong, just say so plainly.
