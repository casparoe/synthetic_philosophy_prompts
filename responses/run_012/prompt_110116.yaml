          *   *Nuance:* In these paragraphs, he is saying: "Here is how we judge evidence." He is *not* yet saying "Miracles can never happen." He is saying "You must weigh the evidence." The punchline (that the evidence against a miracle is always a 'proof' while evidence for it is always merely 'probability') comes *after* this section.
