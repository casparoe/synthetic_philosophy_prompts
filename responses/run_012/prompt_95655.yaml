prompt: |-
  I'm a graduate student who has been volunteered to open the discussion at a moral psychology reading group, and I've realized I don't have a firm enough grip on what we are even asking of a theory of moral worth. Before I defend any particular line, I want the specification written out in full. Take it that we are after an account of when an action is performed for the right reasons in the sense that earns the action a distinctive kind of moral credit — not merely the sense in which the action happens to be right, and not merely the sense in which the agent is a decent person. Give me the desiderata: what any adequate theory of that has to deliver, with the case or consideration behind each requirement.

  Here is what I want on the list, though I expect you to add to it and to tell me which items are genuine requirements rather than the prejudices of one camp. The cases: the honest shopkeeper who charges fair prices only because honesty is good for business, whom we want to say acts rightly but without moral worth, and where the theory must explain why the motive disqualifies rather than merely fails to add anything; the reluctant agent who does the right thing from a sense of duty while resenting every minute of it; the case of someone who acts against his own settled moral verdict — he believes he is doing wrong by helping a fugitive — but from a compassion that tracks the real moral reasons, and where many of us want to call the act morally worthy even though he is not acting from his conception of what is right; the overdetermined case, where duty and friendship both move the agent, so that the act would have been done for the right reason even had the other motive been absent; the case where the agent does the right thing under a description that is false (he helps because he takes the stranger for his brother, though what makes the help right is the stranger's need); and the moral analogue of a Gettier case, where the right-making feature is something the agent could not have known. The distinctions I take it the theory cannot collapse: between the moral worth of an action, the praiseworthiness of the person, and the rightness of the action; between acting for a reason and merely having one, and between doing so under one description and doing so under another; between credit for getting it right and credit for trying hard; and between the worth of the motive and the worth of the act.

  Beyond the cases, tell me which structural constraints the theory has to respect — for instance, that moral worth should attach to something within the agent's control, that it should not be hostage to the very luck the cases above turn on, that it should leave room for morally worthy action done without deliberation or self-conscious reasoning, and that it should not make moral worth unavailable to someone who does the right thing for the right reasons while believing, on balance, that the act is merely permissible rather than required. Then, and this is the part I most want: flag any subset of these requirements that you think cannot be jointly satisfied. My own suspicion is that the fault line runs between the demand that the agent act for the reason that is in fact the right-making one and the demand that moral worth not be a matter of luck, and I would like you to tell me whether that is the real pressure point or a red herring, and what each side of the current debate — the duty-driven Kantians, the motive-centred Humeans, the reasons-responsive accounts, and the knowledge-based accounts — has to give up in order to escape it. You can close with a short verdict on which single requirement eliminates the most candidates, but keep the weight on the criteria; I will do the scoring of particular authors myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Graduate student leading a moral psychology reading group.
      *   **Task:** Specify the desiderata (requirements) for a theory of *moral worth* (distinct from rightness or praiseworthiness of the agent).
      *   **Input:** The user provides a specific list of cases (Honest Shopkeeper, Reluctant Agent, Misguided Conscience/Compassion, Overdetermination, False Description, Moral Gettier) and distinctions (Worth vs. Praise vs. Rightness, Reason-having vs. Reason-acting, etc.) and structural constraints (Control, Luck, Non-deliberation, Permissibility belief).
      *   **Core Demand:** Expand/refine this list, distinguish genuine requirements from camp-specific prejudices, identify incompatibilities (the "fault line"), analyze how major theories (Kantian, Humean, Reasons-Responsive, Knowledge-based) handle the tension, and provide a verdict on the most eliminative requirement.
      *   **Tone:** Academic, precise, philosophically rigorous, helpful for a discussion leader.

  2.  **Deconstruct the Input & Identify Gaps:**
      *   *Cases:* The user covers the classics (Kant's shopkeeper, Williams' reluctant agent, Huck Finn-style cases, overdetermination, epistemic luck).
      *   *Distinctions:* Good coverage of the triad (Act/Agent/Motive).
      *   *Constraints:* Control, Luck, Deliberation, Belief about Requirement.
      *   *Missing/Nuance:*
          *   The "Too Much Moral Worth" problem (saintliness vs. duty).
          *   The role of *skill* or *habituation* (Aristotelian angle).
          *   The distinction between *moral worth* and *moral credit* (are they identical?).
          *   The "wrong reason, right act" vs. "right reason, wrong act" symmetry.
          *   The *stability* of the motive (is a one-off worthy?).

  3.  **Drafting the Desiderata (The "Specification"):**
      *   Need to organize these logically. Let's group them into: Extensional Adequacy (cases), Structural Constraints (metaphysical/epistemic), and Conceptual Distinctions.
      *   *Refining the User's List:*
          *   *Shopkeeper:* Needs to show motive *constitutes* worth, not just correlates.
          *   *Reluctant Agent:* Needs to handle "friction." Does friction diminish worth? (Kant says no, others say yes).
          *   *Huck Finn:* Needs to handle *objective* rightness vs. *subjective* motivation.
          *   *Overdetermination:* Needs to handle *primary* motive vs. *sufficient* motive.
          *   *False Description/Gettier:* Epistemic access to right-making features.
      *   *Adding:* The "Spontaneity" constraint (virtue ethics challenge to Kant). The "Symmetry" constraint (if ignorance exculpates, does knowledge inculpate in a specific way?).

  4.  **Analyzing Structural Constraints:**
      *   *Control:* Worth shouldn't depend on factors outside agency.
      *   *Luck:* Specifically *constitutive* and *epistemic* luck.
      *   *Deliberation:* Worth shouldn't require constant conscious calculation (the "virtuous expert" problem).
      *   *Belief:* Can one have worth acting from supererogation or mere permissibility? (The "Kantian Rigorism" problem).

  5.  **Identifying the Fault Line (The Core Tension):**
      *   The user suspects: *Acting for the Right-Making Reason* vs. *No Luck/Control*.
      *   *Analysis:* This is indeed the central tension. If worth requires tracking the *actual* right-making feature (e.g., "this reduces suffering"), but the agent acts on a conception ("this is what God wants"), do they have worth?
      *   *The "Moral Luck" Problem:* If worth requires knowledge of the truth, it becomes rare (luck-dependent). If worth requires only sincere conviction, it disconnects from moral reality (the "Conscientious Nazi" problem).
      *   *Verdict:* The user's suspicion is correct. It's the tension between *Objectivity* (tracking the good) and *Internality* (accessibility to the agent).

  6.  **Surveying the Camps (What they give up):**
      *   *Kantians (Duty-driven):* Give up the idea that inclination helps. Struggle with Huck Finn (acting against duty-conception). Struggle with spontaneity (requires maxim-analysis).
      *   *Humeans (Motive-centered):* Give up the requirement that the agent conceptualizes the act as "duty." Struggle with the Shopkeeper (why is benevolence better than self-interest if outcomes match?). Struggle with Objectivity (benevolence can be misguided).
      *   *Reasons-Responsive (Sosa/Williamson style):* Give up the requirement of conscious access. Struggle with Control (if reasons are external, is it luck?).
      *   *Knowledge-Based (Moral Knowledge):* Give up the "No Luck" constraint. If you need moral knowledge, Gettier cases kill worth.

  7.  **Determining the "Most Eliminative" Requirement:**
      *   Which constraint kills the most theories?
      *   *Candidate 1:* The "No Luck" constraint. (Kills Knowledge accounts).
      *   *Candidate 2:* The "Right-Making Feature" constraint. (Kills pure Internalist/Conscience accounts).
      *   *Candidate 3:* The "Non-Deliberation" constraint. (Kills strict Kantian proceduralism).
      *   *Selection:* The requirement that **Moral Worth requires non-accidental connection to the Right-Making Features without requiring explicit Moral Knowledge.** This is the "Goldilocks" constraint that almost no one fully satisfies. But to pick a *single* desideratum from the list: **The Epistemic Access Constraint (No Gettiered Worth).** It forces a choice between internalism (too loose) and externalism (too lucky).

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty and the importance of the task.
      *   **Part I: The Desiderata (Extensional & Structural):** Organize the user's list, refine definitions, add missing pieces (e.g., The Conscientious Nazi, The Virtuous Habit). Label them as "Robust" vs. "Contested."
      *   **Part II: The Fault Line:** Analyze the Objectivity vs. Accessibility tension. Confirm the user's suspicion.
      *   **Part III: Theoretical Costs:** Break down what Kantians, Humeans, etc., must sacrifice.
      *   **Part IV: The Verdict:** Identify the most eliminative constraint.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did I distinguish Moral Worth from Praiseworthiness clearly? *Action:* Ensure the intro defines Moral Worth as a property of the *action-token* grounded in motivation, distinct from the *agent's* overall character.
      *   *Check:* Is the Huck Finn case handled correctly? *Action:* Note that some deny Huck has moral worth (he thinks he's doing wrong). This is a point of contention, not a settled datum. I must flag this as a "Contested Intuition."
      *   *Check:* Is the "Reluctant Agent" Kantian bias? *Action:* Yes, flag that Aristotelians think reluctance *diminishes* worth. This is crucial for the "prejudices" part of the prompt.
      *   *Check:* The "Permissibility" constraint. *Action:* Ensure this challenges Kant's claim that only duty-conflicts generate worth.

  10. **Final Polish:** Ensure the tone is appropriate for a grad student (peer-to-peer, rigorous, not condescending). Use standard terminology (right-making features, de re/de dicto, constitutive luck).

  *(Self-Correction during drafting the response)*: I need to make sure I don't just agree with the user but critically evaluate their list. For instance, the "Reluctant Agent" intuition is highly contested by virtue ethicists. I need to mark that as a "Camp-Specific Prejudice" rather than a neutral desideratum. Similarly, the "Huck Finn" case is debated; some say acting against conscience *cannot* have moral worth. I need to highlight these fault lines.

  Let's organize the Desiderata into "The Core Triad," "Extensional Adequacy (Cases)," and "Structural Constraints." Then move to the Incompatibility Matrix.

  *Key Insight:* The real tension isn't just Reason vs. Luck. It's **Transparency vs. Truth.** To have worth, must I know the truth (Transparency)? If I know the truth, is it luck that I know it (Truth)?

  Okay, ready to write.
answer: |-
  This is an exceptionally clear brief. You have correctly identified that the literature on moral worth often talks past itself because participants are optimizing for different subsets of these constraints. Below is a specification of the desiderata, organized by category, with annotations on which are widely accepted and which are camp-specific prejudices. Following that, I analyze the structural tensions, the theoretical trade-offs, and the eliminative constraint.

  ### Part I: The Specification of Desiderata

  We are looking for an account of **Moral Worth (MW)**.
  *Definition:* A normative property of a particular action-token, grounded in the motivation from which it was performed, which distinguishes it from merely right actions and grounds a distinctive form of credit.

  #### A. Conceptual Distinctions (The "No Collapse" Clause)
  An adequate theory must maintain the following distinctions. Collapsing any of these renders the concept of MW redundant.
  1.  **MW vs. Rightness:** An action can be right (conforms to norm) but lack MW (Shopkeeper). An action can have MW but be objectively wrong (contested, see *Huck Finn*).
  2.  **MW vs. Agent Praiseworthiness:** MW attaches to the *act-token*. Praiseworthiness attaches to the *agent*. One can perform a MW act without being a saint (a selfish person can have a MW moment); one can be praiseworthy generally but perform a right act without MW on a specific occasion.
  3.  **MW vs. Motive Worth:** The motive might be good (benevolence), but if it misses the moral mark (helping a fugitive for fun rather than justice), the *act's* MW is contested. The theory must explain the link between motive-quality and act-worth.
  4.  **Reason-Having vs. Reason-Acting:** The agent must not merely possess the right reason as a background fact; the reason must be *operative* in the production of the action.

  #### B. Extensional Adequacy (The Cases)
  These are the intuitions the theory should ideally capture. *Note: I have flagged those that are contested.*

  1.  **The Shopkeeper Constraint (Constitutive Motive):**
      *   *Case:* Agent does the right thing from self-interest.
      *   *Requirement:* MW requires the motive to be *constitutive* of the worth, not merely coincident. Self-interest disqualifies MW even if it produces rightness.
      *   *Status:* **Robust.** Almost universal agreement.
  2.  **The Friction Constraint (The Reluctant Agent):**
      *   *Case:* Agent does duty but struggles against contrary inclination.
      *   *Requirement:* The theory must specify whether internal friction diminishes, enhances, or is neutral to MW.
      *   *Status:* **Contested.** Kantians say neutral/enhances; Aristotelians/Virtue Ethicists say diminishes (virtue implies ease). *A neutral theory should explain why friction matters either way.*
  3.  **The Conscience Constraint (Huck Finn):**
      *   *Case:* Agent acts on compassion but believes the act is wrong.
      *   *Requirement:* The theory must decide if MW tracks *objective* right-making features or *subjective* moral conviction.
      *   *Status:* **Contested.** Internalists say no MW (acting against conscience); Externalists say MW exists (tracking the good). *A complete theory must take a stand here, not fudge it.*
  4.  **The Overdetermination Constraint (Dual Motives):**
      *   *Case:* Agent acts from both duty and inclination.
      *   *Requirement:* The theory must explain if the presence of inclination "crowds out" the duty-motive's contribution to MW.
      *   *Status:* **Robust.** Most agree MW is not negated by concurrent inclination, provided the moral reason was sufficient.
  5.  **The Epistemic Constraint (False Description/Gettier):**
      *   *Case:* Agent helps a stranger thinking it's their brother; or agent guesses the right reason by luck.
      *   *Requirement:* MW requires a non-accidental connection between the motivation and the right-making feature.
      *   *Status:* **Robust.** Luck generally undermines credit.

  #### C. Structural Constraints (Metaphysical & Epistemic)
  1.  **The Control Constraint:** MW must attach to factors within the agent's voluntary control. (Rules out MW based on temperament luck).
  2.  **The Accessibility Constraint:** The grounds for MW must be cognitively accessible to the agent. (Rules out MW based on obscure moral facts the agent couldn't know).
  3.  **The Spontaneity Constraint:** MW must be possible without explicit, conscious deliberation. (Rules out accounts requiring occurrent thought of "Duty" for every MW act).
  4.  **The Permissibility Constraint:** MW must be possible when the agent believes the act is merely permissible, not required. (Rules out strict Kantian rigorism where MW only exists in duty-conflicts).

  ---

  ### Part II: The Fault Line

  You suspect the fault line runs between **acting for the right-making reason** and **moral worth not being a matter of luck.** You are correct, but the tension is more precise than that. It is the tension between **Objectivity** and **Internality**.

  *   **Objectivity Demand:** To have MW, your action must connect to what *actually* makes the act right (e.g., relieving suffering, respecting autonomy). If you help someone for the wrong reason (even a nice one), you lack MW.
  *   **Internality Demand:** To have MW, the grounding feature must be within your epistemic ken. You cannot get credit for tracking a moral truth you were ignorant of.

  **The Pressure Point:**
  If you prioritize **Objectivity**, you fall prey to **Epistemic Luck**. (e.g., The agent who tracks the right-making feature but relies on a false belief to get there is Gettierized; the agent who tracks it correctly but couldn't have known it is lucky).
  If you prioritize **Internality**, you fall prey to the **Conscientious Wrongdoer**. (e.g., The agent who sincerely tracks their conscience but is objectively wrong gets MW, which seems to sever MW from moral value).

  This is the real pressure point. It is not just "Reason vs. Luck"; it is **"Tracking the Truth" vs. "Access to the Truth."**

  ---

  ### Part III: Theoretical Trade-Offs

  Here is what each major camp must sacrifice to resolve this tension.

  #### 1. Duty-Driven Kantians (e.g., Herman, Baron)
  *   **Core Claim:** MW comes from acting from the motive of duty (respect for the law).
  *   **What they give up:**
      *   **The Spontaneity Constraint:** They struggle to explain how habitual, non-deliberative virtue has MW without occurrent reference to the moral law.
      *   **The Conscience Constraint:** They typically deny MW to Huck Finn. If you think you are doing wrong, you cannot act from duty. They sacrifice the intuition that "compassionate tracking of the good" generates worth.
      *   **The Permissibility Constraint:** Traditional readings struggle to assign MW to supererogatory or merely permissible acts, as these fall outside the "necessitation" of duty.

  #### 2. Motive-Centred Humeans (e.g., Slote)
  *   **Core Claim:** MW comes from benevolent or caring motives.
  *   **What they give up:**
      *   **The Objectivity Demand:** They must admit that a well-motivated act based on false facts (helping the "brother" who is a stranger) retains full MW. This makes MW too easy to get and disconnected from actual moral value.
      *   **The Shopkeeper Constraint (Nuanced):** They struggle to explain *why* self-interest is disqualifying if the benevolence account is just about "good motives." (They usually argue self-interest isn't a *moral* motive, but this risks circularity).

  #### 3. Reasons-Responsive Accounts (e.g., Sosa, Williamson, some Neo-Aristotelians)
  *   **Core Claim:** MW requires the agent to be sensitive to moral reasons in a reliable way (like knowledge).
  *   **What they give up:**
      *   **The Accessibility Constraint:** If MW is like knowledge, it is factive. This means the agent must *know* the right-making feature. This makes MW vulnerable to **Epistemic Luck**. If the world is morally complex, MW becomes rare.
      *   **The Control Constraint:** If reasons are external facts, the agent's access to them is partly constitutive luck.

  #### 4. Knowledge-Based Accounts (e.g., Hills, Callahan)
  *   **Core Claim:** MW requires "moral understanding" or knowing why the act is right.
  *   **What they give up:**
      *   **The Spontaneity Constraint:** Requiring "understanding" often implies a cognitive load that excludes children, experts acting on habit, or emergency responders.
      *   **The Friction Constraint:** They often imply that the reluctant agent lacks full understanding (since they don't "see" the value), thereby diminishing the MW of the Kantian dutiful agent.

  ---

  ### Part IV: The Verdict

  You asked for the single requirement that eliminates the most candidates.

  **The Eliminative Constraint: The Non-Accidental Connection to Right-Making Features (without requiring Infallibility).**

  This is the requirement that the agent's motivation must be *counterfactually sensitive* to the moral truth (if the moral truth changed, the motivation would change), but the agent need not possess explicit moral knowledge.

  **Why it eliminates candidates:**
  1.  **Eliminates Simple Internalism:** (e.g., "Acting from conscience"). Conscience can be stable but insensitive to the truth (The Conscientious Nazi). If MW requires connection to *right-making features*, conscience alone fails.
  2.  **Eliminates Simple Externalism:** (e.g., "Acting in accord with good reasons"). This allows Gettier cases. If I help you for money, but it turns out money-helping was the right thing to do for unrelated reasons, I lack MW. Externalism without sensitivity fails.
  3.  **Eliminates Strict Kantianism:** If MW requires sensitivity to right-making features (e.g., welfare), but the Kantian acts only from "Lawfulness," they are arguably insensitive to the *content* of the morality, only the *form*. (This is the standard Williams/Stockstocker objection).
  4.  **Eliminates Pure Virtue Ethics:** If virtue is a disposition, it must be shown that the disposition tracks reasons and isn't just a lucky temperament. This forces Virtue Ethicists into a cognitive account of virtue they sometimes resist.

  **Discussion Leader's Note:**
  When you open the group, I suggest framing the discussion around this specific tension: **"Is Moral Worth a property of the agent's *psychology* (Internalism) or a property of the agent's *relation to the moral truth* (Externalism)?"**

  If you force the room to choose sides on that dichotomy, the Shopkeeper and Huck Finn cases will resolve themselves naturally. The Shopkeeper fails on both (psychology is self-interested; relation to truth is accidental). Huck Finn succeeds on Externalism (tracks the truth) but fails on Internalism (psychology believes it's wrong).

  The most productive friction will come from the **Reluctant Agent**. Ask the group: *If MW requires a sensitive relation to the moral truth, does the agent who resents the truth but follows it have a better or worse grip on that truth than the one who loves it?* That question cuts through the standard Kant/Hume divide and exposes the epistemic requirements underlying the moral psychology.
