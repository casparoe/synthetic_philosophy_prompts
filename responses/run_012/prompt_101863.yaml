      *   **Normative Claim:** Why does the extrapolated self's endorsement bind me *now*?

  3.  **Formulate the Defense (CEV/Idealized Preference View):**
      *   **Response to Identity:** The "self" isn't a static snapshot; it's a trajectory. Authority comes from *alignment of reasons*, not numerical identity.
