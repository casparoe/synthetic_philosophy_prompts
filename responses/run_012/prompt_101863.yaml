  So I reject the dichotomy: the idealized self isn't "you" because of psychological similarity, but because of causal and normative continuity. The authority doesn't come from the future agent binding you like a contract; it comes from the fact that you already endorse the *process* of becoming more informed and coherent. You want your beliefs to track truth and your desires to track value. The extrapolated self is just the limit of that trajectory. Why does his endorsement bind you? Because it represents the conclusions of your own reasoning machinery running without the bugs of ignorance or cognitive bias that you already acknowledge limit you. It's not a stranger; it's you without the blinders.
