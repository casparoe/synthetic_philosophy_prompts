answer: |-
  The boundary problem asks who constitutes the *demos* entitled to decide a political question. The 2016 EU referendum and 2014 Scottish independence referendum offer contrasting franchises within the same state. Analyzing them reveals whether democratic boundaries follow principle or power.

  **Candidate Principles and Normative Franchises**
  Three principles compete to define the *demos*. First, the **All-Affected Principle** holds that anyone impacted by the decision should vote. In 2016, this should have included all EU citizens (due to single market effects), UK expats (loss of rights), and 16–17-year-olds (future impact). In 2014, it should have included all UK citizens, as constitutional breakup affects the whole state.

  Second, the **All-Subjected Principle** argues anyone subject to the state's coercive authority should vote. In 2016, this requires including all UK residents (including EU nationals subject to UK law) but excluding expats outside UK jurisdiction. In 2014, it implies including all residents in Scotland (subject to Scottish law) while excluding Scots living elsewhere in the UK.

  Third, the **Bounded Community Principle** posits that the pre-existing political community decides. In 2016, this includes UK citizens (including long-term expats) and historical members (Commonwealth), excluding non-citizen residents. In 2014, it implies including Scottish citizens only, excluding non-Scottish residents and Scots abroad.

  **Explaining the Actual Franchises**
  The actual franchises were hybrid and inconsistent. The 2016 franchise included UK, Irish, and Commonwealth citizens resident in the UK, Gibraltarians, and UK expats resident abroad for under 15 years. It excluded other EU citizens, 16–17-year-olds, and long-term expats. The **Membership Principle** best explains this: it accounts for Commonwealth inclusion (historical ties), Gibraltar (British Overseas Territory), and the 15-year expat rule (severed community ties). However, it fails to explain why EU residents (subject to UK law) were excluded while Commonwealth residents were included. The **Subjected Principle** explains the residency requirement but fails on the EU exclusion. The **Affected Principle** fails significantly, unable to justify excluding 16–17-year-olds or EU citizens while including expats whose daily lives were less immediately affected.

  The 2014 Scottish franchise included all residents in Scotland (including EU and Commonwealth citizens) and 16–17-year-olds, excluding Scots living elsewhere in the UK. Here, the **Subjected Principle** strongly explains the residency rule and EU inclusion. The **Affected Principle** explains the inclusion of 16–17-year-olds as future stakeholders. The **Membership Principle** fails to explain why Scottish citizens in England were excluded while non-Scottish EU residents were included.

  **Tension Cases and Ad Hoc Settlements**
  Specific cases pull the principles apart, revealing the franchises as political settlements. **EU Citizens** were included in 2014 (Subjected) but excluded in 2016 (Membership), suggesting the 2016 boundary minimized the "Remain" vote. **Commonwealth Citizens** voted in both (Membership), privileging imperial ties over current legal subjection. **16–17-Year-Olds** voted in 2014 (Affected) but not 2016, reflecting partisan strategy regarding youth voting patterns controlled by different legislatures. **UK Expats** voted in 2016 (Membership) but not 2014 (Subjected), favoring national citizenship over territorial subjection. **Gibraltar** voted in 2016 despite not being part of the UK proper, fitting Membership but contradicting Subjected.

  The differences do not look like principled applications of different theories for different questions. Instead, they resemble ad hoc negotiations. The 2016 franchise maximized the "British" electorate (Commonwealth + Expats) while minimizing non-citizen residents. The 2014 franchise maximized the "resident" electorate likely to support independence.

  **Verdict on the Boundary Problem**
  This episode supports the view that the boundary problem is not a single puzzle solvable by one principle, but a family of competing questions—who is a member, who is subject, who is affected—that come apart in practice. However, it leans heavily toward the pessimist view: the *demos* is constituted by prior political decision, not philosophical derivation. The state selectively invokes principles to legitimize desired outcomes. When "membership" aided the Leave campaign (Commonwealth votes), it was used; when "subjection" aided the Yes campaign (EU residents in Scotland), it was permitted.

  The boundary problem remains unresolved because the authority to draw the boundary is itself the subject of dispute. To test this verdict, consider a **referendum on immigration quotas**.
  *   *The Test:* Who votes on limiting immigration?
  *   *Prediction:* If the pessimist view holds, the franchise will exclude potential migrants (Affected) and non-citizen residents (Subjected), restricting the vote to citizens (Membership) to ensure restrictive outcomes. If principles governed, those affected by labor market changes (including employers and residents) should vote. The exclusion of the directly affected (migrants) in favor of the membership class would confirm that boundaries are tools of exclusion, not democratic logic.
