          *   *Targeting:* Mixed. It targets historical stigma, not current economic status. A rich Dalit is still a Dalit.
          *   *Score:* Moderate. It helps the group, but often the top of the group. Let's say 5/10.
          *   *Refinement:* Actually, compared to Norway, it reaches deeper into poverty because caste correlates strongly with poverty. Compared to US race, it's more rigid/structural. Let's look at the "worst-off within the group" metric. A poor Dalit benefits more than a rich Dalit, but the rich Dalit is more likely to *qualify* academically to take the seat. This is the "creamy layer" problem.
          *   *Revised Score:* 4/10. The mechanism lacks strict income caps for SC/ST (only OBC), so the poorest often lack the prep to utilize the quota.

      *   **US (Race-Conscious Admissions):**
          *   *Mechanism:* Holistic review where race is a "plus factor."
          *   *Intra-group dynamic:* Criticism often cites that this benefits wealthy minority students (e.g., children of immigrants or upper-middle-class Black families) more than the intergenerationally disadvantaged. There are no income caps.
          *   *Targeting:* Low. It targets racial representation, not economic need. The "worst-off" (underfunded schools, low income) often lack the baseline grades/test scores to be competitive even with the "plus."
          *   *Score:* 3/10.
          *   *Mechanism Driver:* Holistic review favors high-achievers within the group, who are disproportionately better off socioeconomically.

      *   **Norway (Gender Board Quota):**
          *   *Mechanism:* 40% minimum women on corporate boards.
          *   *Intra-group dynamic:* This targets the very top of the economic ladder (board members). The "worst-off" woman (low income, low education) gets zero direct benefit. The benefit goes to elite women.
          *   *Targeting:* Very Low on the "worst-off" dimension. It helps the group (women) but specifically the *most* advantaged women.
          *   *Score:* 1/10.
          *   *Mechanism Driver:* The policy applies to high-level corporate governance, inherently excluding low-income women from direct benefit.

      *   **Ranking (High to Low):** India > US > Norway.
      *   *Wait, let's reconsider India vs US.* India's reservations are in government jobs and public universities (lower tier too). US is elite higher ed. India's system is arguably more structural and reaches lower-level jobs. However, the "creamy layer" critique is massive in India. But compared to Norway (elite women) and US (elite college), India's reservation includes lower-tier government clerical work. So India scores higher on helping the "worst-off within the group."
      *   *Let's reconsider US vs India.* In the US, race is correlated with poverty, but the mechanism (elite admissions) filters for academic readiness, which correlates with wealth. In India, the mechanism (quotas) applies to a wider range of job levels, not just elite. So India > US seems robust on this specific dimension.

  4.  **Evaluate the Fourth Policy (Class-Based):**
      *   *Mechanism:* Income/Wealth threshold (e.g., bottom quartile).
      *   *Targeting:* By definition, this targets economic disadvantage.
      *   *Score:* 9/10 or 10/10.
      *   *Does it win by definition?* Yes, because the dimension *is* economic disadvantage.
      *   *Is the dimension a bad test?* Not necessarily "bad," but it reveals that the other three policies aren't actually trying to solve *poverty*; they are trying to solve *representation* or *historical stigma*. If the goal is helping the poor, class-based wins. If the goal is breaking caste/race barriers, class-based might fail. So the dimension is valid *for that specific goal*, but maybe not the *only* goal.

  5.  **Evaluate Fragility (Empirical Facts):**
