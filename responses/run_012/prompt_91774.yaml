answer: |-
  Here is the ranking based on your specific dimension: **Intra-group targeting efficiency** (how much the benefit flows to the economically worst-off members of the protected class versus the already advantaged).

  ### The Ranking

  **1. India (Caste Reservation)**
  **Score: 5/10**
  **Mechanism:** The policy mandates quotas across a wide spectrum of government employment, from low-level clerical jobs to elite universities, allowing poorer members of the caste to access stable livelihoods even without elite credentials.

  **2. United States (Race-Conscious Admissions)**
  **Score: 3/10**
  **Mechanism:** The policy operates within holistic reviews at competitive institutions, which inherently favor applicants with high academic preparation that correlates strongly with family wealth and school funding.

  **3. Norway (Gender Board Quota)**
  **Score: 1/10**
  **Mechanism:** The policy mandates representation on corporate boards, which are by definition elite, high-compensation positions inaccessible to women lacking significant prior career capital and education.

  ***

  ### Follow-Up 1: The Class-Based Alternative

  **Where it lands:**
  A policy boosting the bottom income quartile scores a **9/10** on this dimension.

  **Does it win by definition?**
  Yes, essentially. Because your dimension measures economic targeting, a policy defined by economic metrics will mathematically outperform policies defined by identity metrics.

  **Is your dimension a bad test?**
  No, but it is a *specific* test. It reveals that your friend's claim ("if you support one you must support all") is false because these policies have different *goals*. Norway and the US policies aim for **representation and breaking glass ceilings** within elite spheres, while India's aims for **structural integration** across all levels of bureaucracy. A class-based policy aims for **poverty alleviation**. If your metric is "helping the poor," class-based wins. If your metric is "ensuring a specific marginalized group has political/cultural visibility," class-based might fail (e.g., a poor white man gets the boost, not the marginalized group). The dimension isn't bad; it just proves the policies aren't interchangeable.

  ***

  ### Follow-Up 2: The Most Fragile Ordering

  **The Fragile Spot:**
  The ranking between **India (1st)** and **the US (2nd)** is the most empirically fragile.

  **The Empirical Finding:**
  The single finding that would flip the most positions is **data on the actual household income of the beneficiaries.**

  Currently, the assumption is that India's broader job quotas reach poorer beneficiaries than US elite college admissions. However, if data revealed that India's "creamy layer" (wealthy upper-caste members within the reserved groups) captures 90% of the quotas *and* simultaneously data showed that US race-conscious admits are disproportionately from the bottom income quintile of their racial group (due to specific pipeline programs), the US would jump to 1st and India would drop to 2nd or 3rd. The Norway score is stable (board seats are always elite), and the Class score is stable (by definition), making the US/India slot the only one dependent on contested socioeconomic data.
