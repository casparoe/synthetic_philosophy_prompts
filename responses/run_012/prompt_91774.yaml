      *   Follow-up 2 (Fragility): Which ordering is fragile? What empirical finding? Yes.

      *Self-Correction on India Score:* Is 5 too generous? The "creamy layer" exclusion only applies to OBC, not SC/ST. SC/ST reservations have no income cap. So a wealthy SC person gets the same reservation as a poor SC person. However, the *types* of jobs reserved include low-level (Class IV) government jobs. So the *mechanism* allows for poorer beneficiaries more than US Elite Admissions or Norway Boards. I will stick with India > US > Norway, but keep the scores tight.

