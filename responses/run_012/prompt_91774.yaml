prompt: |-
  Alright, my friend and I got into it for like three hours last night about affirmative action and I need a third opinion because we just kept going in circles.

  Her claim is that the three big real-world versions of this thing are basically the same policy wearing different hats: race-conscious admissions at US universities, the reservation system in India for SC/ST/OBC, and Norway's boardroom gender quota. So if you're for one you should be for all of them, and if you're against one you're against all of them. I think thats wrong but I couldnt pin down where the difference actually lives.

  So here's what I want. Rank those three on one specific dimension: how much of the real benefit ends up with the worst-off people inside the group being helped, rather than with the members of that group who were already doing fine. Score each out of 10, give me the ordering, and for each one tell me in a sentence or two which feature of the mechanism drives the score -- the mechanism, not the politics.

  Then two follow-ups. First, add a fourth item that my friend proposed: forget race, caste and gender entirely, just give the boost to people from poor households, like bottom income quartile or first generation. Where does that land, and be honest with me -- does it win on my dimension basically by definition, and if it does, does that mean my dimension is a bad test? Second, of the four, which ordering is most fragile to facts I might be wrong about, i.e. which single empirical finding would flip the most positions in the list?
