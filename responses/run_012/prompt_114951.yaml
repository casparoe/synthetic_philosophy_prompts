answer: |-
  Dear Colleagues,

  I am writing to share a conceptual map for our upcoming reading group on decision theory under risk, specifically designed to navigate the logical space surrounding gambles with undefined expected values. The goal is to sort participants by their commitments to concrete cases like the Pasadena and Altadena games rather than by their preferred labels, so I have constructed a decision tree based on a sequence of questions that any reader can answer without prior knowledge of the literature. We begin at the root by asking whether the gamble possesses a determinate normative value despite the fact that its expected value is undefined. If you answer yes, you believe there is a fact of the matter about whether the gamble is good or bad, even if the standard summation formula fails. If you answer no, you believe the undefinedness implies a lack of determinate value. This first split divides the space into those who seek to recover a value and those who accept a value gap.

  For those who answer yes to the existence of a determinate value, the next question asks how this value is derived. You must decide whether the value comes from a summation method applied to the series of outcomes or from a principle independent of summation. If you insist on a summation method, you face a further distinction based on the stronger Altadena variant where both positive and negative parts of the series diverge. You must ask whether your summation method yields a finite value for the Altadena game. If you say yes, you are led to the position of Invariant Regularization, which uses techniques like Abel summation to assign values regardless of divergence, though its most awkward commitment is that it requires adopting a mathematical convention that lacks direct decision-theoretic justification. If you say no, meaning your method works for the Pasadena game but fails for the Altadena game, you must specify what fixes the value for the weaker case. If you claim the value is fixed by the natural order of outcomes as they occur in time, you arrive at Natural Order Expectationalism, whose most awkward commitment is that the value of a gamble depends on the arbitrary order in which outcomes are listed. If you claim the value is fixed by the limit of finite truncations of the gamble, you arrive at Truncation Expectationalism, whose most awkward commitment is that it implies finite approximations dictate the value of an infinite process even when the limit is sensitive to the truncation scheme.

  Returning to the branch where the value is determinate but not derived from summation, you must identify the non-expectational principle that generates the value. If you argue that the gamble is ranked by whether it dominates other options state-by-state, you occupy the Dominance-Based Valuation position, whose most awkward commitment is that it cannot rank options when neither dominates the other despite clear intuitive differences. If you argue that the value is determined by a non-linear weighting of probabilities rather than sums, you occupy the Risk-Weighted Expectationalism position, whose most awkward commitment is that it requires positing a specific risk function that appears arbitrary without further constraints. If you argue that value is only defined relative to another gamble rather than absolutely, you occupy the Relative Expectation Theory position, whose most awkward commitment is that it denies the existence of standalone values for options, making individual choice unintelligible without a background contrast.

  For those who answered no to the root question, denying that the gamble has a determinate value, the tree proceeds by asking what normative consequence follows from this undefinedness. If you believe the lack of value means the gamble cannot be rationally compared to any sure option, you are led to Radical Incomparabilism, whose most awkward commitment is that rational agents may be paralyzed when choosing between an undefined gamble and a modest sure gain. If you believe the undefinedness is a defect that makes the gamble rationally avoidable, you are led to Precautionary Avoidance, whose most awkward commitment is that it requires rejecting potentially beneficial gambles simply because their expectation is undefined. If you believe the undefinedness shows that expected utility theory is correct but incomplete and needs extension, you are led to Theory Incompleteness, whose most awkward commitment is that it postpones a decision rule until a richer theory is formulated. If you believe the undefinedness arises because such gambles cannot metaphysically exist, you are led to Metaphysical Impossibility, whose most awkward commitment is that it denies the possibility of mathematically coherent probability distributions corresponding to real-world options. If you believe that without a determinate value any choice is rationally permissible, you are led to Rational Permissivism, whose most awkward commitment is that it allows an agent to prefer a clearly worse option when no expectation exists. Finally, if you believe the gamble should be treated as having zero value by default, you are led to Default Indifference, whose most awkward commitment is that it assigns a specific value to the gamble despite admitting there is no fact of the matter.

  There are several logical combinations within this space that remain unoccupied, and it is worth diagnosing why. One empty combination lies in the branch where one asserts a determinate value exists but denies it comes from summation, dominance, risk-weighting, or relativity; this space is likely incoherent because it posits a value source without a mechanism. Another empty combination is found among those who deny a determinate value yet claim the gamble is strictly comparable to sure options via expected utility; this is contradictory because it denies the value required for the comparison. A third unexplored region involves views that accept the natural order for the Pasadena game but claim the Altadena game has a value via a different non-summation principle, which is unattractive due to the lack of unity in the theory. These gaps suggest that the existing positions cover the plausible logical ground fairly well.

  I must also flag pairs of leaves that this tree cannot fully separate based on answers alone. The Natural Order Expectationalism and Truncation Expectationalism positions often coincide for the Pasadena game because the natural order usually matches the standard truncation limit, so a reader might endorse both without realizing they come apart in modified cases. Similarly, the Radical Incomparabilism and Theory Incompleteness positions are hard to distinguish because both admit the current theory cannot rank the gamble, differing only on whether a future theory could do so. Finally, the Precautionary Avoidance and Metaphysical Impossibility views may yield the same practical advice to reject the gamble, differing only on whether the rejection is due to rational caution or ontological denial. I hope this map helps structure our discussion by focusing on the logical commitments rather than the names attached to them.

  Best regards,

  The Instructor
