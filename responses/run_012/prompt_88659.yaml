  (One final thought on the "Overdraft" analogy): The analogy is actually quite good. It captures the *deferred* nature of the Landauer cost. The problem is the author tries to say the cost happens *earlier* (at recording) rather than *later* (at erasure). The "Overdraft" implies you spend money now and pay later. The author says "You spend now (recording), pay later (erasure is just reversal)." Actually, standard physics says "You spend nothing now (recording), pay later (erasure)." The overdraft analogy works best if you view *memory states* as the currency, not energy. I need to make sure this distinction is clear in the critique.

