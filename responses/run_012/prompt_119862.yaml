  ### The Leaves

  **Leaf 1: Threshold Deontology**
  *   **Awkward Commitment:** You must allow a specific number of patients to die (just below the threshold) before you are permitted to intervene to save the larger group.

  **Leaf 2: Specificationism**
  *   **Awkward Commitment:** The moral description of the act changes (e.g., from "killing" to "triage") based on contextual factors, making the constraint linguistically elastic.

  **Leaf 3: Rule Consequentialism**
  *   **Awkward Commitment:** You must let Patient A die to uphold a rule, even when everyone present knows that breaking the rule in this specific instance would produce a better outcome.

  **Leaf 4: Esoteric Minimizing**
  *   **Awkward Commitment:** You must follow the constraint even though it does not minimize harm generally or specifically, ostensibly to maintain a system that you privately know is suboptimal.

  **Leaf 5: Agent-Centered Prerogative**
  *   **Awkward Commitment:** You are permitted to let multiple patients die simply because saving them would require a level of personal sacrifice or involvement you are not obliged to undertake.

  **Leaf 6: Agent-Centered Deontology**
  *   **Awkward Commitment:** Your own moral cleanliness is weighted more heavily than the physical survival of the patients you could save by acting.

  **Leaf 7: Contractualism (Scanlonian)**
  *   **Awkward Commitment:** You cannot save five patients because the one patient could reasonably reject the principle that authorized sacrificing them without their consent.

  **Leaf 8: Consent-Based Libertarianism**
  *   **Awkward Commitment:** A patient's prior refusal binds you even if they are now incompetent and the refusal foreseeably causes the deaths of others who did consent to treatment.

  **Leaf 9: Moral Dilemma / Inconsistency**
  *   **Awkward Commitment:** There is no right answer; you are morally required to save the many and morally required to respect the one, leaving you with unavoidable guilt either way.

  **Leaf 10: Absolutist Deontology**
  *   **Awkward Commitment:** The world contains more total violations of rights than it would have otherwise, but you have successfully kept your own hands clean.

  ---

  ### Analysis of Logical Space

  **Empty Combinations**
  1.  **Minimizing Rationale + Absolute Constraint (without Rule Justification):** This corresponds to the path Node 1 (Yes) → Node 2 (Yes) → Node 2B (No). This is occupied by **Leaf 4 (Esoteric Minimizing)**. It is empty in serious theory because it is **incoherent**: if the *point* of the constraint is minimizing harm, but you uphold it when it *doesn't* minimize harm (even by rule), the justification contradicts the action. It is occupied only by confused actors or "Government House" utilitarians who deceive themselves.
  2.  **Agent Integrity + Patient Status as Primary Ground:** The tree forces a choice at Node 3. A position claiming the constraint is grounded *equally* in both is **unexplored** because it creates a conflict of source: if the patient's status demands sacrifice to save others (to protect their status), but the agent's integrity forbids it, the theory lacks a tie-breaking mechanism.
  3.  **Prerogative + Constraint:** Node 4 separates these. A view that claims you have a *permission* not to save, but also a *constraint* forbidding you to harm, is **unattractive** because it collapses into Absolutist Deontology (Leaf 10) in high-stakes clinical cases where inaction is causally equivalent to action.

  **Flagged Indistinguishable Positions**
  *   **Leaf 7 (Contractualism) and Leaf 10 (Absolutist Deontology):** In clinical practice, these are often **indistinguishable**. Both yield the verdict "Do not harvest the organ from the refusing patient to save five others." The tree separates them by *justification* (justifiability to the individual vs. intrinsic inviolability), but in a committee deadlock, the practical outcome is identical. The distinction only matters when explaining *why* to the hospital administration or the public.
  *   **Leaf 1 (Threshold Deontology) and Leaf 3 (Rule Consequentialism):** These can be **indistinguishable** in moderate cases. Both uphold the constraint usually but allow violation in extremes. They only separate when the "threshold" is not based on the utility of the rule (Leaf 3) but on a deontological "catastrophe" clause (Leaf 1). In a hospital setting, both look like "Follow protocol unless the disaster is massive."

  **The Paradox Distinction**
  The tree distinguishes the puzzle of *why have constraints* (Node 1) from *why keep them when breaking minimizes breaches* (Node 2 and Node 6).
  *   **Leaf 1, 2, 3, 4** answer the first by citing minimization, but answer the second by modifying the constraint or relying on rules.
  *   **Leaf 5, 6, 7, 8, 10** answer the first by citing non-minimizing values (integrity, status, consent), which allows them to answer the second by simply ignoring the minimization count.
  *   **Leaf 9** is the only position that admits the paradox remains unresolved at the second node.
