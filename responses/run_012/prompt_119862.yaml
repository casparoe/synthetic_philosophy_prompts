  ### The Decision Tree

  **Node 1:** Is the ultimate justification for forbidding harm to Patient A (to save Patients B–Z) that doing so minimizes the total number of similar harms in the world over time?
  *   **Yes:** (The Minimizing Rationale) → **Node 2**
  *   **No:** (The Non-Minimizing Rationale) → **Node 3**

  **Node 2:** If refusing to harm Patient A foreseeably results in more total harms of the same kind (e.g., more deaths from resource starvation), does the refusal remain morally mandatory?
  *   **No:** (The Constraint Dissolves) → **Node 2A**
  *   **Yes:** (The Constraint Holds) → **Node 2B**

  **Node 2A:** Is the permission to harm Patient A triggered only when the number of saved lives crosses a catastrophic numerical threshold, or does the definition of the prohibited act shift in emergency contexts?
  *   **Numerical Threshold:** → **Leaf 1**
  *   **Definition Shift:** → **Leaf 2**

  **Node 2B:** Is the refusal mandatory because following a general rule minimizes harm better than case-by-case decisions, even if this specific case is an exception?
  *   **Yes:** → **Leaf 3**
  *   **No:** → **Leaf 4**

  **Node 3:** Is the source of the constraint the *agent's* own moral integrity and authorship of action, or the *patient's* independent moral status?
  *   **Agent's Integrity:** → **Node 4**
  *   **Patient's Status:** → **Node 5**

  **Node 4:** Does this agency-grounded view primarily grant you a *permission* not to sacrifice your integrity for the greater good, or a *constraint* forbidding you from acting as the direct cause of harm?
  *   **Permission:** → **Leaf 5**
  *   **Constraint:** → **Leaf 6**

  **Node 5:** Is the patient's status grounded in a requirement to justify your action to each individual separately, or in an intrinsic inviolability that persists regardless of justification?
  *   **Justification:** → **Node 5A**
