      *(Refining the "Feature or Corruption" point)*: It's better to frame this as a tension between *protection* (human rights focus) and *migration management* (state sovereignty focus). The regime allows both, which is why the deal is possible.

      *(Final check on "Confused Framing")*: The prompt asks: "If the framing I have given you is confused... say so plainly." I believe the framing is robust enough to sustain the analysis, but I should note that "who must take them in" is not a question refugee *law* answers, but rather refugee *policy*. I will make this distinction explicit.

