prompt: |-
  Consider the EU–Turkey Statement of 18 March 2016 — the arrangement under which irregular migrants arriving on the Greek islands could be returned to Turkey, with the EU agreeing to resettle Syrian refugees from Turkey on a one-for-one basis and to provide funding for refugee support in Turkey — and analyze it through a distinction that runs through refugee law and its ethics: between the individualized definition of a refugee (a well-founded fear of persecution for specified reasons) and the broader, status-light categories of temporary protection and subsidiary protection, and between a state's obligations to those already within its territory and its obligations to take people in. Treat the following background as given: Turkey is a party to the 1951 Convention but maintains a geographical limitation, so it does not owe full Convention refugee status to non-Europeans; it hosts several million Syrians under a temporary protection regime, and non-European asylum seekers may receive a lesser conditional refugee status. The EU's returns were meant to rest on Turkey being a safe third country for the people returned. I want a disciplined case analysis, not a policy polemic.

  Map the episode onto the theory: who counts as a refugee under the Convention definition, who counts under temporary protection, and whether the deal's architecture depends on keeping those two questions separate — that is, on Turkey being safe enough for return without having to treat returnees as refugees with full status. Then run the analysis in the other direction: what does this episode reveal about the theory? Does it show that the who-counts question and the who-must-take-them-in question can come apart in practice, and if so, is that a feature or a corruption of the refugee regime? Does the safe-third-country idea presuppose a theory of what makes a state safe that refugee law never supplied? Where does the theory go silent — for example, on whether temporary protection is a lesser form of protection or a different kind, and on whether one-for-one resettlement is a duty or a bargain? Be explicit about which parts of your mapping are contested and which are settled.

  If the framing I have given you is confused — if, say, the individualized definition and temporary protection are not really in tension, or if who-must-take-them-in is not a question the theory can answer — say so plainly rather than forcing the analysis. I would rather have a shorter answer that identifies the limits of the lens than a comprehensive one that pretends it fits everywhere.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

