      *   *Specific Prompt Requirements:* Address "feature or corruption," "STC theory of safety," "duty or bargain."

  7.  **Final Polish:** Ensure the distinction between *non-refoulement* (negative obligation) and *asylum/resettlement* (positive obligation) is clear. Ensure the distinction between *Convention Refugee* and *Temporary Protection Beneficiary* is clear in the context of Turkey's geographical limitation.

