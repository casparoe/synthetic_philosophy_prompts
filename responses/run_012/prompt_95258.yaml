      *   *Separation of "Who Counts" and "Who Must Take":* The deal shows they *can* come apart. The EU admits some (resettlement) not because they *must* under Convention law, but as leverage to stop others (returns). This suggests the "who must take" question is political, not legal, for those outside territory.
      *   *Feature or Corruption?*
          *   *Feature:* Flexibility allows mass influx management (temporary protection avoids individual status determination bottlenecks).
          *   *Corruption:* It externalizes borders. It allows states to avoid Convention obligations by designating third countries that offer lesser rights (temporary vs. permanent). It creates a hierarchy of protection.
      *   *Safe Third Country (STC) Theory:* Does refugee law supply a theory of safety? No. The Convention says *don't send back to persecution*. STC says *send to a country that won't send back to persecution*. But what rights must that country guarantee? The Directive (Procedures Directive) lists criteria, but the theory of "sufficiency" is thin. The EU-Turkey deal exposes this: Is "safety" just non-refoulement, or does it include livelihood, integration, status certainty? Turkey offered the former, not the latter.
