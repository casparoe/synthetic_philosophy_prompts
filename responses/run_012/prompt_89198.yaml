answer: |-
  The analogy is doing all the work by smuggling involuntary obligation into a voluntary setting, but her core conclusion—that contract alone creates a thin society—survives if you ground it in shared stewardship rather than familial bond.

  **The Mapping**
  *   **Parents:** The Council/Predecessors (claiming wisdom and authority to manage the estate).
  *   **Children:** The Residents (expected to trust the management and inherit the consequences).
  *   **The Household:** The Town Infrastructure/Zoning (the physical shared space).
  *   **Money:** The Tax Base (pooled resources for maintenance).
  *   **Rules:** Bylaws/Zoning (house rules vs. laws).
  *   **The Ones Who Want to Leave:** The Libertarian/Developers (treating the house as an asset to be flipped rather than a home to be kept).

  **Where It Breaks**
  *   **Exit Rights (Critical Break):** Children cannot legally leave the household until adulthood; residents can sell and move whenever they want. This directly undermines her claim that obligations are non-negotiable. In a town, you *can* negotiate obligations by leaving, which validates the libertarian's contract view.
  *   **Consent (Critical Break):** You are born into a family; you choose a town. This breaks the "you don't get to pick" argument. Unless she argues that moving there creates a binding moral debt beyond the legal contract, the analogy fails to prove obligation exists.
  *   **Intimacy (Scenery Break):** Families operate on face-to-face love; towns operate on abstract solidarity. This matters for her emotional pitch (the "sad/thin" claim) but not for the logical structure of obligation. It explains *why* contracts feel cold, but not *why* they are insufficient.

  **What Gets Smuggled In**
  *   **Hierarchy:** Families are vertically ordered (parents rule); towns are horizontally ordered (one person, one vote). The analogy quietly justifies authoritarianism on the council by framing dissent as childish rebellion rather than political disagreement.
  *   **Unconditional Acceptance:** Families (ideally) keep members despite failure; towns eject members who break rules or can't pay. The analogy promises a safety net the town cannot legally or financially provide.
  *   **Biological Imperative:** Family obligation is backed by evolution and blood; town obligation is backed by mutual interest. The analogy treats civic duty as a instinct rather than a choice.

  **Verdict on the Conclusion**
  Her conclusion—that a liberal town of strangers-with-contracts is a contradiction—does not survive the disanalogies intact because the analogy was carrying the load of proving *obligation*. Without the "family" label, she cannot explain why a resident owes anything to a neighbor they didn't choose and can leave. However, the *spirit* of her conclusion survives: contracts are indeed thin because they only cover minimums, not flourishing. To save her argument, she must admit the obligation is chosen, but argue that some choices (like moving to a town) create debts that exceed the written lease.

  **The Better Comparison**
  Swap "Family" for **"Neighbors."**
  Neighbors are not strangers signing contracts, but they are not family bound by blood. They are people bound by **proximity**. You didn't choose who lives next door, but you share a fence line, a noise ceiling, and a view. You cannot negotiate the fact that their tree drops leaves in your yard, and you cannot leave without cost. This preserves the "involuntary obligation" she wants (you have to deal with the guy next door) without the coercive hierarchy of the family model. It fits a zoning fight perfectly: it's not about love, it's about who bears the cost of shared space.
