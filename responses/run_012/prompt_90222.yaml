  **MEMORANDUM**

  **TO:** Client Executive Leadership
  **FROM:** Ashgrove Partners, Risk & Perception Division
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Management of Intentionality Exposure

  **1.0 Overview**
  Recent data regarding stakeholder attribution suggests a critical vulnerability in corporate communications. A widely replicated 2003 study indicates that public perception of intentional action is not stable; it fluctuates based on the moral valence of the outcome. Ashgrove Partners refers to this variance as "Intentionality Exposure." This memo outlines protocols to minimize liability regarding adverse side effects while maximizing credit for beneficial ones.

  **2.0 Mitigating Adverse Outcomes**
  When a profit-driving initiative produces negative externalities (e.g., environmental degradation, workforce reduction), stakeholders are statistically likely to classify the harm as intentional, even if leadership expresses indifference. To reduce this exposure:

  *   **Normalize the Deviation:** Do not frame the negative outcome as a unique sacrifice. Frame it as standard industry practice. Research suggests that if an action is perceived as norm-conforming, the "intentional" label is less likely to stick, regardless of the damage caused. The goal is to shift the perception from a moral violation to a regulatory baseline.
  *   **Decouple Means and Ends:** Avoid language suggesting the harm was necessary *in order to* achieve profit. Use passive construction. The harm must appear as an unavoidable background condition of the market, not a lever you pulled. If stakeholders believe the harm was a tool used to secure revenue, intentionality attribution spikes significantly.
  *   **Manage Indifference:** Expressing explicit indifference ("profits only") triggers higher blame than expressing regretful necessity. However, since the underlying attitude matters less than the outcome, focus on outcome framing.

  **3.0 Capitalizing on Beneficial Outcomes**
  The asymmetry works in reverse for positive externalities. If an initiative helps the community as a side effect of profit-seeking, stakeholders will rarely classify the help as intentional. You will not receive credit.

  *   **Elevate to Primary Objective:** Beneficial side effects must be reclassified as stated aims. If community benefit is merely a byproduct, it is invisible to moral accounting. Make it a KPI.
  *   **Avoid Indifference:** Do not state that you "do not care" about the benefit. Even if the profit motive is identical to the harm scenario, the public requires explicit intent to assign praise.

  **4.0 The Indifference Constant**
  Clients often ask why expressing indifference yields different results for harm versus help. The data confirms that the CEO's attitude is identical in both scenarios; the variable is solely the outcome's valence. Therefore, compliance training should not focus on changing leadership's internal state, which is inefficient. Focus on changing the narrative architecture surrounding the outcome. The folk concept of intentionality is not a fixed psychological metric; it is a fluid resource that must be managed.

  **5.0 FAQ**

  **Q: Does this require us to actually change our priorities?**
  A: No. This is a communications strategy. The operational reality can remain constant.

  **Q: What if the harm is severe?**
  A: Severity increases the likelihood of an "intentional" classification. Increase normalization efforts proportionally.

  **Q: How do we handle the "in order to" causality?**
  A: Ensure no written record suggests the negative outcome was a prerequisite for the profit. It must remain a foreseen but unintended consequence.

  **Q: Is this ethical?**
  A: Ashgrove advises on perception management, not moral philosophy.

  **6.0 Disclaimer**
  Ashgrove Partners makes no claims regarding the actual mental states of corporate officers. This guidance is based solely on observer attribution patterns. We do not certify that actions are unintentional, only that they will be perceived as such. Any reliance on this memo to establish actual lack of intent in a legal proceeding is strictly prohibited.
