      *   **Address the "Semantic vs. Statistical" Distinction:**
          *   *Statistical:* Correlation (smoke means fire).
          *   *Semantic:* Aboutness + Function + Error condition.
          *   *Criterion for Semantics:* The possibility of *misinterpretation* that matters functionally. A mutation is a "lie" or "error" in the code, not just a physical change. Natural selection acts on the *meaning* (phenotype), not just the physics.
