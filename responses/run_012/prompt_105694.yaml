answer: |-
  Your friend's argument collapses at premise 4, which commits a category error by treating psychological reliance as if it were normative obligation, meaning you can keep your ending by grounding the sister's binding force in the concrete harm of betrayed expectations rather than abstract duty.

  The sleight of hand you smelled is real: premise 4 conflates "expecting something to happen" with "believing someone ought to make it happen." Your sister can rely on your promise simply because you are predictable, not because she has already judged you morally bound. If I tell you I will meet you for coffee, you expect me to be there based on past behavior or social convention; that expectation exists as a psychological fact before any moral judgment is made. When you break the promise, you damage those expectations. The reason you are bound (Premise 1) is not the magic words "I promise," but the tangible harm caused by disrupting the life someone arranged based on your word (Premise 3). Rejecting premise 4 costs you nothing metaphysical; it only costs the idea that reliance is mysterious, shifting the moral weight from "Duty" to "Care."

  You can also safely discard premise 5 without damaging your plot. The claim that "one defection changes nothing" is a collective action fallacy; while one broken promise doesn't destroy the institution of promising, it destroys the specific trust between two specific people. For a domestic novel, the macro-value of the practice is irrelevant; the micro-value of the relationship is everything. If you keep 1, 3, and 7, and reject 4 (and optionally 5), your sister is bound not because promises are magical chains, but because breaking her word would inflict a specific, unjustified harm on someone who trusted her. That is a sufficiently heavy chain for fiction, and it survives philosophical scrutiny.
