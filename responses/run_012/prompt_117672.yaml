answer: |-
  Moral responsibility for threshold harms attaches to each contributor because liability is grounded in participation in a sufficient set of conditions rather than in marginal causal difference.

  To understand why marginal difference is the wrong criterion, we must distinguish harms that are produced from harms that are composed. In a produced harm, an act generates an effect through a linear causal chain; if the act is removed, the effect does not occur, and the act is responsible for the entirety of the effect it produced. In a composed harm, the outcome is a state of affairs constituted by the presence of multiple conditions, none of which individually generates the outcome, but all of which jointly constitute it. The harm is not the sum of $N$ small harms, but a single indivisible harm that comes into existence when the constitutive conditions are met. An act is a component of such a harm if it is a member of a minimal set of acts sufficient to constitute that harm. This distinguishes composition from mere aggregation: in aggregation, each act causes a distinct portion of the damage (e.g., each drop of poison adds to the total toxicity), whereas in composition, each act is a necessary element of the structure that brings the harm into being, even if redundant elements exist. Because the harm is defined by the threshold $T$, the moral object is the crossing of that threshold, and any act that is part of a set that crosses it participates in the composition of the harm.

  When causal slack exists ($N > T$), responsibility is divided according to the minimal sufficient set $T$, not the actual number of contributors $N$. Each contributor bears $1/T$ of the responsibility for the harm. This division is not arbitrary because the moral weight of the harm is anchored to the conditions required for its existence, not to the contingent fact of over-participation. The harm is fully realized once $T$ is reached; the additional $N-T$ contributions are morally inert regarding the *constitution* of the harm, even if they are wrongful in themselves. To divide responsibility by $N$ would be to allow redundancy to mitigate liability, implying that a harm becomes less serious for each participant simply because others also contributed. This contradicts the nature of the wrong: the wrong is participating in a sufficient cause of harm. Since each contributor joined a set that was sufficient (or part of a overlapping web of sufficient sets), each bears the responsibility associated with that sufficiency. The fact that total responsibility sums to greater than one ($N/T$) reflects the reality of overdetermination: multiple sufficient causes exist, and each carries full causal weight for the outcome.

  The objection that this view makes responsibility hostage to the choices of others confuses the intrinsic quality of an act with the extrinsic conditions of liability. It is true that an agent's responsibility for the *harm* depends on whether enough others contribute to reach $T$, but this is not objectionable luck; it is a structural feature of outcome responsibility. Responsibility for a harm necessarily tracks the occurrence of the harm, and in collective contexts, the occurrence of the harm is relationally determined. The agent's *culpability* (based on intent and knowledge) remains constant regardless of $N$, but their *liability for the outcome* varies because the outcome itself varies based on the group. To demand that responsibility for a collective harm be independent of the collective is to demand that relational outcomes have non-relational causes, which is metaphysically incoherent. The act does not become more or less wrongful in its intent, but it becomes more or less consequential in its contribution to the composed harm, and responsibility tracks the consequence.

  A decisive refutation of this thesis would require a case where an agent knowingly contributes to a minimal sufficient set for a grave harm but is intuitively judged to bear zero responsibility for that harm solely because their contribution was not marginally decisive. However, ordinary cases like a single vote, purchase, or flight rarely have this exact structure because they lack the epistemic certainty stipulated in the thought experiment. In reality, agents do not know that $N > T$ or that their contribution is redundant; they face uncertainty about the threshold and the count. Consequently, ordinary cases are governed by expected utility and risk imposition rather than known inefficacy. The thought experiment isolates the metaphysics of composition by removing epistemology, but in the real world, the uncertainty restores the practical relevance of marginal difference. Thus, the thesis stands for the idealized case, while ordinary cases differ in ways that protect our standard intuitions about individual impact without negating the underlying principle of composed responsibility.

  I am moderately confident in this argument. The step I would defend with the least conviction is (b), specifically the claim that responsibility does not dilute when $N$ significantly exceeds $T$, as the intuition that individual liability should diminish in cases of massive overdetermination is persistent and difficult to fully eradicate.
