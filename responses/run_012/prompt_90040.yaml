prompt: |-
  I'm putting together a ninety-minute session on the standing to blame for a mixed room — a couple of philosophy postgrads, two mediators, someone from HR — and what I need from you is a plan for how to teach it, not the explanation itself. Half the room will walk in thinking the whole thing is just the tu quoque fallacy with a fancy name, and the other half thinkng that anyone who's ever done anything wrong has forfeited the right to complain about anything, so I need to know what has to be in place before "standing" is even a distinct thing from being wrong or being a hypocrite, and the order the pieces have to come in so that the distinction lands as a discovery rather than a taxonomy I'm handing them. Pick the example that carries the whole session and tell me why it works, what it has to have and what it has to avoid — not the adulterous spouse and not the pot calling the kettle black, they've all heard those. I also want to push on something the usual treatments slide past: the case where the blamer isn't a person but an institution or a state that's done the very thing it's now condemning, and whether the individual-level story even transfers or whether standing works differently for collectives. Then the misconceptions, roughly in the order they'll surface once the discussion gets going, and the exact point in the sequence where I should head each one off — including the slide from "you can't say that" to "so it wasn't wrong", which I can already see coming. Finish with one question I can put to the room that tells me whether they've actually got the distinction or have just decided hypocrisy is bad, and anything I should openly announce I'm not going to get into at this level rather than leaving it hanging. No readings. Write it as plain continuous prose — no headings, no bullets, no bold, no tables — I'll be reading it on the train.
