answer: |-
  Start the session by putting the definition of standing on hold and instead place a single scenario on the table that everyone can inhabit without needing specialized knowledge. Use a case involving a manager who enforces a strict no weekend emails policy to protect team wellbeing, while simultaneously admitting they send emails every Saturday morning. This example works because it avoids the moral heaviness of infidelity which shuts down nuance, and it avoids the triviality of the pot and kettle cliché which invites dismissal. For this to carry the weight of the session, the example must have a clear normative rule that exists for the benefit of the group, not just arbitrary authority, and the blamer must hold a position of responsibility for enforcing that rule. It must avoid making the manager's violation secretly harmful in a different way, because if the manager's emails are causing different damage, the discussion collapses into a comparison of harms rather than a question of standing. It must also avoid making the manager's violation unknown to the team, because standing is often about the relational dynamic of address, not just secret hypocrisy. You need the team to know the manager is violating the norm so that the challenge is public and relational.

  Begin the ninety minutes by asking the room simply whether the manager is permitted to reprimand the employee. Do not ask if the employee was wrong, ask if the manager can speak. You will immediately see the split you described, with the mediators and HR likely focusing on the damage to trust and the philosophers focusing on the validity of the norm. Let them argue for ten minutes without intervention. Your first pedagogical move is to separate the truth of the claim from the right to make it. You need to establish that the employee's action can be genuinely harmful and wrong even if the manager is the one saying it. This is the prerequisite for standing to exist as a distinct concept. If the room believes that a hypocrite's blame automatically makes the accused action acceptable, you cannot talk about standing, you are only talking about truth conditions. So, force a consensus that sending weekend emails is indeed harmful to wellbeing, regardless of who points it out. Once they agree the act is wrong, ask again if the manager is the right person to say it. This is where the distinction lands as a discovery. They will realize they are holding two thoughts simultaneously: the employee did wrong, but the manager lacks the authority to complain. That gap is standing.

  Around the thirty-minute mark, you must head off the first major misconception which is that this is just the tu quoque fallacy. The philosophers will want to categorize this as informal logic, while the practitioners will see it as a conflict resolution barrier. Intervene here by explaining that tu quoque is about dismissing the truth of the argument based on the speaker, whereas standing is about the appropriateness of the relational address. Use the manager example to show that the employee cannot say the manager is logically wrong, only that the manager has no place to say it. If you do not make this distinction now, the logicians will reduce the whole session to a fallacy check and the mediators will treat it as mere etiquette. You need them to see standing as a normative power, not a logical error. Make it clear that lacking standing does not make the blame false, it makes it inappropriate in a way that blocks the normal uptake of the complaint.

  Once that distinction is held firmly, shift the focus at the forty-five-minute mark to the institutional layer. Ask the room if the company itself can enforce the policy if the CEO is known to send weekend emails. This is where you push on whether the individual story transfers. The HR professional and mediators will likely say the institution must hold the line regardless of the CEO, while the philosophers might argue about collective agency. You need to guide them to see that institutional standing might rely on procedural integrity rather than moral purity. An individual loses standing through personal hypocrisy because blame is a moral relationship between agents, but an institution might retain standing if its procedures are sound, even if its leaders are flawed. However, push back hard on this by asking if the state can punish citizens for tax evasion while the state itself wastes tax revenue. This reveals that institutional standing is fragile in a different way. It does not depend on the moral soul of the agent but on the legitimacy of the system. If the system is seen as rigged, standing collapses not because of hypocrisy per se, but because of a failure of reciprocity. This distinction is crucial for your HR and mediator participants who deal with policy enforcement daily. Do not let them settle for the idea that institutions are just big people. Force them to articulate why a state might retain standing where an individual loses it, or vice versa.

  As you move into the final thirty minutes, you will encounter the most dangerous misconception, which is the slide from you cannot say that to so it was not wrong. This will surface naturally when the mediators try to resolve the conflict by dismissing the complaint entirely. You must head this off immediately when someone suggests that because the manager lacks standing, the employee is off the hook. Stop the discussion and write on the board that standing conditions the delivery of the blame, not the validity of the norm. If you do not intercept this here, the session will conclude with the dangerous takeaway that hypocrisy negates wrongdoing. Remind them that a third party, like a peer or a different manager, could still legitimately blame the employee. The wrongness remains intact even if the specific blamer is silenced. This is the core philosophical payload for the postgrads and the core risk management payload for the HR professional. Ensure they understand that standing is about who speaks, not what is spoken.

  In the last ten minutes, do not summarize the theory. Instead, put one question to the room to test if they have grasped the distinction or if they have just decided hypocrisy is bad. Ask them whether a reformed hypocrite who has stopped sending weekend emails but has not apologized for the past ones regains standing immediately. If they say yes, they are treating standing as a matter of current moral status. If they say no, they are treating it as a matter of relational history. If they say it depends on whether the team knows they reformed, they are treating it as a matter of credibility. The correct answer for the purpose of this session is that standing requires a repair of the relationship, not just a change in behavior, because standing is relational. Their answers will tell you if they view standing as a property of the person or a property of the relationship. If they focus on the person's goodness, they have missed the point and reverted to moralism. If they focus on the relationship, they have got it.

  Finally, you must openly announce what you are not going to get into to prevent the postgrads from hijacking the end of the session. State clearly that you are not discussing the metaphysics of blame or whether blame is ever morally justified in a deterministic universe. You are also not discussing forgiveness, which is a separate response to wrongdoing that comes after blame has been appropriately issued. By carving out these topics, you keep the session focused on the normative power to address the wrong rather than the nature of the wrong itself or the resolution of it. This protects the time and ensures the practitioners do not feel lost in abstraction. Keep the focus tight on the gatekeeping function of standing. If you manage the flow this way, moving from the intuitive case to the logical distinction, then to the institutional complexity, and finally trapping the moral slide, the room will leave with a functional understanding of why some voices are silenced not because they are wrong, but because they have lost the place from which to speak.
