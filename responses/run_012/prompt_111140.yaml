answer: |-
  This is a sophisticated critique of a framework that often gets treated as dogma. You are correct to suspect that the "wrong shape" objection is more damaging than the "hard to measure" objection. The latter implies better data will save us; the former implies the map doesn't match the territory even with perfect data.

  Here are the defeaters for the ITN (Importance, Tractability, Neglectedness) framework, ranked from structural flaws that should actually move you, to implementation details a defender can wave away.

  ### 1. The Reference Class / Granularity Problem (Fatal Structural Flaw)
  **The Argument:** ITN scores are not properties of the cause; they are properties of *how you describe the cause*.
  As you noted with "AI Safety" vs. "Interpretability," the framework lacks a canonical unit of analysis.
  *   **Neglectedness:** If I define the cause as "Global Health," neglectedness is low (crowded). If I define it as "Global Health Policy Reform in Zambia," neglectedness is high. The *actual work* might be identical, but the ITN score shifts by orders of magnitude based on the label.
  *   **Tractability:** "Curing Cancer" is intractable. "Funding this specific lab's grant application" is tractable.
  *   **The Defeat:** Because the score is sensitive to the granularity of the category, the framework cannot objectively rank causes. It ranks *descriptions* of causes. A committed ITN user must arbitrarily choose a resolution level, which introduces a subjective prior that dwarfs the calculation.
  *   **Status:** **Conceded but ignored.** Most ITN defenders know this. They treat ITN as a "lens" rather than a calculator. But if it's just a lens, it loses its claim to objective prioritization.

  ### 2. The Static vs. Dynamic Mismatch (The "Moonshot" Problem)
  **The Argument:** ITN is a static snapshot of a dynamic ecosystem. It optimizes for *harvesting* value, not *growing* it.
  *   **The Feedback Loop:** You identified this: Tractability and Neglectedness are coupled. If a cause is important but intractable, the rational ITN move is to ignore it (Score $\approx$ 0). However, the *highest leverage* action might be to invest effort specifically to make it tractable (e.g., foundational math for AI alignment, or building a new scientific field).
  *   **The Defeat:** ITN systematically undervalues "field-building" or "paradigm-shifting" work because, at $T_0$, the tractability is low and the neglectedness is high (for a reason). It biases you toward low-hanging fruit in mature fields rather than planting trees for future fruit. It treats the "production function" of altruism as fixed, when often the goal is to change the production function.
  *   **Status:** **Major Concession.** Longtermists often modify ITN to "ITN over time," but the basic heuristic still punishes early-stage investment.

  ### 3. The "Importance" Swamping (The Longtermism Collapse)
  **The Argument:** If "Importance" is measured in expected value over the far future (as it often is in EA), it mathematically dominates the other two factors.
  *   **The Math:** If Cause A affects $10^{10}$ lives (global health) and Cause B affects $10^{50}$ lives (existential risk mitigation), the ratio is $10^{40}$. No reasonable estimate of Tractability or Neglectedness can overcome a $10^{40}$ difference unless T or N are literally zero.
  *   **The Defeat:** The three-factor framework collapses into a one-factor framework (Importance). Tractability and Neglectedness become binary gates ("Is it possible?" "Is anyone doing it?") rather than continuous variables for optimization. Defending ITN as a *trade-off* framework is dishonest if you believe longtermist importance estimates; there are no trade-offs, only lexical priority.
  *   **Status:** **Insulated.** Defenders claim T and N still matter for *which* x-risk cause, but for Global Health vs. X-Risk, I swamps everything.

  ### 4. Neglectedness as a Proxy for Diminishing Returns (Conceptual Error)
  **The Argument:** Neglectedness is not a fundamental variable; it is a noisy proxy for marginal returns.
  *   **The Decoupling:** You noted this: "Neglected in aggregate, crowded at the margin."
      *   *Scenario A:* A cause has 0 people (High N) because the low-hanging fruit was picked 50 years ago and now only hard problems remain (Low Marginal Returns). ITN says "Fund it!" Reality says "Don't."
      *   *Scenario B:* A cause has 10,000 people (Low N) because it's a coordination problem where more funding unlocks massive scale (Increasing Marginal Returns). ITN says "Ignore it!" Reality says "Fund it."
  *   **The Defeat:** Using "number of people" as the input variable is category error. The input should be "marginal utility of the next dollar." But if we use that, "Neglectedness" disappears as a separate factor; it gets absorbed into Tractability.
  *   **Status:** **Conceded.** Sophisticated users admit N is just a heuristic for diminishing returns. If you have direct data on marginal returns, drop N.

  ### 5. Product vs. Sum (The Mathematical Shape)
  **The Argument:** You asked if it matters. Yes, it dictates how you handle "dealbreakers."
  *   **Product ($I \times T \times N$):** Implies factors are substitutable only up to a point. If $T=0$, Value $=0$. This creates the "Intractability Trap" (see Defeater #2). It assumes you need *some* of all three.
  *   **Sum ($\alpha I + \beta T + \gamma N$):** Implies you can trade off. A massively Important cause could be worth funding even if Neglectedness is low (crowded) or Tractability is low (hard).
  *   **The Log-Compromise:** Most modelers actually use $\log(Value) = \log(I) + \log(T) + \log(N)$. This turns it into a sum, preventing zeros from killing the score, but it introduces arbitrary base assumptions.
  *   **The Defeat:** The "Product" intuition is rhetorically useful ("all three matter!") but mathematically fragile. The "Sum" intuition is more robust but admits that Importance can dominate (see Defeater #3).
  *   **Status:** **Wave Away.** This is model specification. Defenders will say "We use logs" or "We treat them as elasticities." It doesn't change the output much compared to Defeaters 1 & 2.

  ---

  ### Is the Framework Insulated?
  **Yes.** The "Unfalsifiability Charge" is valid.
  When a cause ITN says should be funded fails to produce results, the defense is rarely "ITN is wrong." It is "We misestimated Tractability."
  *   **Why this is a problem:** It turns ITN into a belief system rather than a tool. If every error is an estimation error, the framework never updates.
  *   **Why it might be okay:** All heuristics are insulated to some degree. The question is whether the insulation prevents *useful* error correction. In EA, the insulation has arguably slowed the recognition that "movement building" (which looks bad on ITN initially) is higher value than direct work.

  ### Pricing the Cost: Should You Keep It?
  You said you'd rather keep it and pay a cost. Here is the price tag.

  **If you keep ITN as your primary heuristic, you pay in:**
  1.  **Moonshots:** You will systematically underfund high-variance, low-probability, high-impact "field building" because current Tractability scores will be too low.
  2.  **Institutional Reality:** ITN assumes a liquid market of altruism. It ignores that funding is lumpy, institutional, and path-dependent. You can't just "move to the top of the list" if the infrastructure doesn't exist to absorb the funding.
  3.  **Moral Texture:** You will struggle to account for justice, rights, or dignity unless they can be converted into "Importance" units. This isn't a bug for a utilitarian, but it limits coalition building.

  **The Verdict:**
  Keep ITN as a **sanity check**, not a **decision procedure**.
  *   **Decision Procedure:** "Calculate scores, fund highest." (Fails due to Granularity and Dynamics).
  *   **Sanity Check:** "I think this cause is vital. Does ITN scream 'no'? If so, why? Is it neglected for a reason? Is it actually intractable?"

  **How to defend it in your friend group without lying:**
  "I defend ITN as a *vocabulary* for trade-offs, not a *calculator* for truth. It forces us to articulate whether we're betting on Scale, Solvability, or Opportunity. But if you treat the output as a number rather than a conversation starter, it breaks."

  **The One Thing That Should Move You:**
  If you cannot resolve the **Granularity Problem** (Defeater #1), you must admit that ITN cannot compare *broad* causes (e.g., "Health" vs. "AI"). It can only compare *specific interventions* within a shared reference class (e.g., "Bednets" vs. "Vitamin A" within Global Health). If your friends are using it to compare "Animal Welfare" to "Pandemic Preparedness," the framework is doing no heavy lifting; their priors are. Acknowledge that, and you keep your credibility.
