answer: |-
  **Episode:** The destruction of a specific city block in the 1906 San Francisco Fire.
  **Outcome:** The block is completely consumed by fire.
  **Cause 1 (Background):** Decades of dense, untreated wooden construction (slow structural condition). The wood was so dry and packed that ignition was spontaneous and spread uncontrollable regardless of intervention.
  **Cause 2 (Omission):** The Fire Chief's deliberate decision *not* to order dynamiting of the upwind buildings to create a firebreak. Regulations allowed it, but he hesitated.
  **Independence:** The wood density alone was sufficient to ensure total combustion (Cause 1). The lack of a firebreak alone was sufficient to ensure total combustion (Cause 2). Either one present yields the fire; both present yields the fire.

  **The Three Views:**
  1.  **But-For Test:** Ask: "But for the Chief's omission, would the block burn?" No, because the wood density ensures it burns anyway. "But for the wood density, would it burn?" No, because the lack of a firebreak ensures it burns anyway. **Verdict:** Neither is a cause.
  2.  **Manipulability (Hands-On):** Ask: "If I fiddle the Chief's decision (make him dynamite), does the outcome change?" No, the wood burns anyway. "If I fiddle the wood (make it fireproof), does the outcome change?" No, the lack of a break lets it burn anyway. **Verdict:** Neither is a cause.
  3.  **Regularity View:** Ask: "Is this element part of a sufficient set of conditions regularly leading to this outcome?" Yes. The wood density is part of a sufficient set. The Chief's omission is part of a sufficient set. **Verdict:** Both are causes.

  **The Pick:**
  The **Regularity View** gets this case right. The But-For and Manipulability views fail because they rely on *counterfactual dependence*, which overdetermination explicitly destroys. In this scenario, our moral and historical intuition screams that both the negligent Chief and the unsafe infrastructure are responsible. The Regularity view captures this by identifying *sufficiency* rather than *necessity*. It acknowledges that history is often a web of redundant pathways to disaster, not a single chain. To exonerate the Chief because the wood was dry (or vice versa) is to misunderstand how complex systems fail.

  **The Feature Doing the Work:**
  The critical feature is **Symmetric Sufficiency**. Both causes are independently capable of producing the outcome in the exact same timeframe. If you drop this feature—for example, if the wood was only *likely* to burn but the Chief's omission made it *certain*—the symmetry breaks. The But-For test would then identify the Chief's omission as the decisive factor, and the puzzle dissolves.

  **The Opposition:**
  A **But-For proponent** would argue this case doesn't count as genuine causation, labeling it "pre-emption." They would claim one cause merely "beat" the other to the punch, and we only *think* both are causes due to epistemic uncertainty. A **Manipulability proponent** would argue that if you cannot change the outcome by intervening, you haven't found a cause; they would dismiss the Chief's omission as "idle" because the background condition locked the outcome in regardless of his choice. Both try to save their theories by denying the reality of the overdetermination itself.
