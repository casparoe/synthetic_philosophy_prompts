prompt: |-
  At a neighborhood meeting I attended, two residents got into an argument I couldn't referee, and what I want is an adjudication of the exchange rather than a verdict on the project itself. The proposal is a four-story, forty-unit building — twelve of the units below market rate — replacing a single-family house and a small parking lot on a street zoned for single-family homes.

  The objector said the street is zoned single-family, that people bought in reliance on that scale, and that the building would shadow yards, add traffic, and crowd the elementary school; he isn't against housing, he said, but density belongs on the transit corridor three blocks away. The supporter answered that housing is a need rather than a preference, that the people who would live there are currently doubled up with relatives or commuting two hours, that the "character" argument is doing the work of keeping out people poorer than the objector, and that the infrastructure objection proves too much, since the objector's own house strains the same pipes and roads.

  The objector replied that he isn't claiming a right to exclude anyone in particular, only a say in decisions about his own environment — a say the newcomers would also have once they arrived. The asymmetry, he said, is that his surroundings change without his consent while they gain, and since someone has to decide, the people who already live there are the ones with standing. The supporter said that consent of the governed is a doctrine about states, not streets; that the would-be residents never consented to being kept out; and that he is converting a contingent fact — arriving first — into authority, so that had he bought ten years later he would be the one locked out and would call it unjust.

  The objector then said he has a right to the city too: the right to inhabit and shape the place one lives, not merely to be housed somewhere. The supporter, he said, seems to mean by that phrase a right to live wherever one likes, which is a different right and cannot be unlimited without collapsing into "developers may build anything." The supporter answered that the right to the city was always about use rather than exchange value — inhabitants shaping their place against the logic of property — which is why it favors the renters on the block over the landlord, and which does not license freezing the street in amber. She added that the objector's own principle, that one may not use the law to better one's position by worsening others', applies to the status quo as well: the zoning that casts no shadow and adds no traffic also locks people out, and he isn't counting the excluded as worsened because they were never here.

  Please adjudicate this point by point — who is right about which specific claims, where each of them overreaches, and what, if anything, both are missing. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate an argument between two residents (Objector vs. Supporter) regarding a housing proposal (4-story, 40-unit, 12 below-market, replacing single-family house + parking, on single-family zoned street).
      *   **Constraint 1:** Adjudicate the *exchange*, not the project itself.
      *   **Constraint 2:** Lead with the bottom line in the first sentence.
      *   **Constraint 3:** Give reasoning point by point (who is right, where they overreach, what they miss).
      *   **Constraint 4:** No preamble.
      *   **Constraint 5:** Do not restate the question.

  2.  **Analyze the Arguments:**

      *   **Objector (O):**
          *   Claim 1: Zoning reliance/scale (bought based on SF zoning).
          *   Claim 2: Negative externalities (shadow, traffic, school crowding).
          *   Claim 3: Density belongs elsewhere (transit corridor).
          *   Claim 4: Not against housing, just location.
          *   Claim 5: Right to say in environment (consent/asymmetry argument).
          *   Claim 6: Right to the City (inhabit/shape place, not just be housed).
          *   Claim 7: Supporter's view implies unlimited development rights.

      *   **Supporter (S):**
          *   Claim 1: Housing is a need, not preference.
          *   Claim 2: Beneficiaries are disadvantaged (doubled up, long commute).
          *   Claim 3: "Character" is exclusionary/classist.
          *   Claim 4: Infrastructure objection proves too much (existing houses strain infra too).
          *   Claim 5: Consent of governed applies to states, not streets; newcomers didn't consent to exclusion.
          *   Claim 6: Priority based on arrival time is contingent/unjust.
          *   Claim 7: Right to the City is about use value vs. exchange value (renters vs. landlord), not freezing in amber.
          *   Claim 8: Status quo also worsens others (exclusion), invisible harm.

  3.  **Evaluate Claims (Adjudication):**

      *   *Zoning Reliance (O):* Partially right. Property values often reflect zoning, but zoning is mutable by definition. Overreaches by treating mutable policy as a contractual right.
      *   *Externalities (O):* Empirically plausible (shadow, traffic), but needs verification. Overreaches by assuming these outweigh housing needs without mitigation.
      *   *Location/Density (O):* Reasonable planning principle (transit-oriented development), but doesn't necessarily preclude *any* density elsewhere.
      *   *Housing Need (S):* Morally strong. Housing is a basic need. Overreaches if implying need trumps *all* local concerns without compromise.
      *   *Exclusion/Character (S):* Sociologically accurate often (exclusionary zoning), but assumes bad faith on O's part specifically.
      *   *Infrastructure (S):* Strong point. Single-family homes also use infra. However, density *does* increase load per acre. O's claim isn't logically invalidated by S's counter, but the magnitude matters.
      *   *Consent/Asymmetry (O):* Philosophically interesting. Existing residents bear change costs; newcomers gain benefits. But democracy isn't purely consent-based for non-residents. Overreaches by claiming exclusive standing.
      *   *Arrival Priority (S):* Strong moral point. "First come, first served" isn't a justice principle.
      *   *Right to the City (O vs S):* Both invoke Lefebvre/Harvey concepts.
          *   O: Right to shape existing environment.
          *   S: Right to access/use vs. property exchange value.
          *   Adjudication: S captures the critical theory origin better (use value vs. exchange), but O captures the phenomenological experience of displacement/change.
      *   *Status Quo Harm (S):* Strongest philosophical point. Exclusion is an active harm, not just a neutral baseline.

  4.  **Synthesize the Bottom Line:**
      *   Neither side is wholly right; the Supporter wins on the moral philosophy of housing and exclusion, while the Objector wins on the procedural reality of local impact, but both miss the necessity of compromise design and broader regional planning.
      *   *Draft:* The Supporter prevails on the moral philosophy of housing access and the arbitrariness of exclusionary zoning, while the Objector is correct regarding the tangible local externalities and the procedural asymmetry of change, though both overreach by treating contingent policy or moral need as absolute rights.

  5.  **Drafting the Reasoning (Point by Point):**

      *   *Zoning & Reliance:* O is right that expectations were set, wrong that they are binding. Zoning is legislation, not contract.
      *   *Externalities:* O is right on physical impacts (shadow/traffic), S is right that single-family homes also incur costs, but density amplifies them. S overreaches by dismissing infrastructure limits entirely.
      *   *Exclusion & Need:* S is right that housing is a need and "character" often masks exclusion. O is right that density belongs near transit, but wrong that this street must remain exempt.
      *   *Consent & Standing:* O is right that existing residents bear the brunt of change. S is right that "arrival time" confers no moral authority to exclude. Both miss that democratic planning requires balancing both interests, not veto power.
      *   *Right to the City:* S interprets the theory more accurately (use value over exchange), whereas O co-opts it to protect property value stability. However, O is right that "Right to the City" doesn't mean unlimited development anywhere.
      *   *Status Quo Bias:* S delivers the knockout blow here: the status quo actively harms the excluded. O misses this invisible harm.

  6.  **Refining the Output:**
      *   Ensure no preamble.
      *   Ensure first sentence is the bottom line.
      *   Check tone (adjudicatory, neutral).
      *   Check constraints (no restating question).

      *Revised Bottom Line:* The Supporter prevails on the moral philosophy of housing access and the arbitrariness of exclusionary zoning, while the Objector is correct regarding the tangible local externalities and the procedural asymmetry of change, though both overreach by treating contingent policy or moral need as absolute rights.

      *Wait, I need to make sure I address "what both are missing".*
      *   Missing: Mitigation design (shadow/traffic can be reduced), regional responsibility (why this street vs transit corridor is a regional planning failure, not just local), and the fact that "below market rate" units don't necessarily house the "doubled up" people described (income targeting varies).

      *Let's tighten the reasoning.*

      *   *Zoning:* O treats policy as property right (error). S treats policy as injustice (correct).
      *   *Infrastructure:* O cites specific limits (valid). S cites general hypocrisy (valid but doesn't negate specific limits).
      *   *Consent:* O claims veto based on presence (error). S claims no veto based on absence (correct).
      *   *Right to City:* S cites theory correctly (use value). O cites experience correctly (disruption).
      *   *Status Quo:* S identifies hidden harm (correct). O ignores it (error).
      *   *Missing:* Both ignore design mitigation and regional zoning reform.

      *Final Polish of Bottom Line:* The Supporter wins on the moral principles of exclusion and the status quo, while the Objector wins on the physical realities of local impact, but both err by asserting absolute rights where trade-offs are required and both overlook the role of design mitigation and regional planning.

      *Actually, keep it punchier.*
      "The Supporter prevails on the moral philosophy of housing access and the arbitrariness of exclusionary zoning, while the Objector is correct regarding the tangible local externalities and the procedural asymmetry of change, though both overreach by treating contingent policy or moral need as absolute rights." -> This covers it.

      *Wait, check the "Right to the City" exchange.*
      O says: Right to shape place.
      S says: Right to use vs exchange.
      Adjudication: S is theoretically more accurate to the term's origin (Lefebvre), but O is practically correct that unlimited development violates the spirit of communal shaping.

      *Check the "Infrastructure" exchange.*
      O: Strains pipes.
      S: Your house strains pipes too.
      Adjudication: S's point is a *tu quoque* that doesn't technically invalidate O's claim (40 units vs 1 house is different), but it highlights the hypocrisy of singling out density. O is right on magnitude, S is right on principle.

      *Check the "Consent" exchange.*
      O: Asymmetry of change.
      S: Consent of governed != streets.
      Adjudication: O identifies a real political tension (incumbency advantage). S identifies the moral flaw in incumbency privilege.

      *Check "Missing":*
      Both miss that the solution isn't binary (build vs don't build). Design can mitigate shadow. Traffic can be managed. Also, both assume the zoning map is fixed rather than something to be updated regionally.

      *Final Plan:*
      1. Bottom Line sentence.
      2. Paragraph on Zoning/Reliance & Externalities.
      3. Paragraph on Consent/Standing & Arrival.
      4. Paragraph on Right to the City & Status Quo.
      5. Paragraph on What Both Miss.

      *Wait, constraint check:* "Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating the question."

      *Let's write.*
      Bottom Line: The Supporter prevails on the moral philosophy of housing access and the arbitrariness of exclusionary zoning, while the Objector is correct regarding the tangible local externalities and the procedural asymmetry of change, though both overreach by treating contingent policy or moral need as absolute rights.

      Reasoning structure:
      1. Zoning & Infrastructure (O right on impact, wrong on right; S right on hypocrisy, wrong on magnitude).
      2. Consent & Standing (O right on asymmetry, wrong on veto; S right on moral equality, wrong on dismissing local governance).
      3. Right to City & Status Quo (S right on theory and hidden harm; O right on unlimited development risk).
      4. Missing elements (Design, Regional planning).

      *Refining the "Missing" part:* The prompt asks "what, if anything, both are missing."
      Both miss that the binary choice is false. Design can mitigate shadows. Traffic studies can manage load. Also, both treat the zoning map as fixed rather than a variable to be solved regionally (why isn't the transit corridor upzoned *and* this street? Or why is this street the only option?). Also, S assumes the 12 below-market units solve the specific need described (doubled up), which depends on AMI targeting. O assumes all density is bad for schools, ignoring that children per unit in MFH is often lower than SFH.

      *Okay, ready to draft.*

      *Self-Correction on Bottom Line:* Make sure it clearly answers "who is right about which specific claims".
      "The Supporter is right on the moral imperatives of housing need and the injustice of exclusionary status quos, while the Objector is right on the physical realities of local externalities and the asymmetry of change, yet both err by converting pragmatic concerns into absolute rights and overlook the potential for design mitigation."

      *Wait, one more check:* "without restating the question". I must not say "You asked me to adjudicate..." or "Regarding the meeting...". Just start.

      *Final check on constraints:*
      - First sentence bottom line.
      - No preamble.
      - No restating question.
      - Point by point reasoning.
      - Address overreaches and missing points.

      *Let's go.*
answer: |-
  The Supporter is right on the moral imperatives of housing need and the injustice of exclusionary status quos, while the Objector is right on the physical realities of local externalities and the asymmetry of change, yet both err by converting pragmatic concerns into absolute rights and overlook the potential for design mitigation.

  Regarding zoning and infrastructure, the Objector is factually correct that single-family zoning creates reliance interests and that increased density imposes marginal costs on shadows, traffic, and schools, but he overreaches by treating mutable legislative policy as a contractual property right. The Supporter correctly identifies that infrastructure objections often mask exclusionary intent and that single-family homes also strain resources, but she overreaches by implying that because one house uses pipes, forty units must logically be permitted without regard for capacity limits.

  On the question of consent and standing, the Objector accurately describes the political asymmetry where existing residents bear the costs of change while newcomers reap the benefits, yet he errs in claiming this asymmetry grants a veto power over regional needs. The Supporter is morally correct that arrival time confers no inherent authority to exclude and that "consent of the governed" does not apply to non-residents denied entry, but she overlooks that local governance structures are designed precisely to give weight to those bearing the immediate burden of implementation.

  In the debate over the "right to the city," the Supporter offers the theoretically superior interpretation, correctly framing the concept as prioritizing use value over exchange value and exposing the harm invisible in the status quo, whereas the Objector co-opts the term to protect property stability. However, the Objector is right to warn that interpreting the right to the city as unlimited access collapses into developer hegemony, while the Supporter overreaches by assuming the specific beneficiaries of this project align perfectly with the disadvantaged groups she cites, ignoring income targeting nuances.

  Both parties miss that the binary choice between building and blocking is false, as design modifications could mitigate shadow and traffic concerns without cancelling the project. They also both treat the zoning map as fixed rather than recognizing that the conflict stems from a regional planning failure to upzone transit corridors sufficiently, forcing density into single-family neighborhoods by default. Finally, neither addresses that multi-family housing often generates fewer school-age children per unit than single-family homes, undermining the Objector's specific claim about school crowding.
