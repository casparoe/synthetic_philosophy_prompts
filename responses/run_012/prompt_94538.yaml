answer: |-
  You are absolutely right to feel that your friend is bundling distinct claims together. This is one of the oldest and most consequential debates in the history of economic thought (essentially the debate between the "Old Welfare Economics" of Pigou and the "New Welfare Economics" of Robbins, Samuelson, and Hicks in the 1930s).

  Your friend is presenting a **positivist** view of economics: that it is a science of *what is*, not *what ought to be*. To get from "utility is hard to measure" to "therefore we can only use Pareto," he is smuggling in several premises.

  Here is the menu of distinct claims hidden inside "you can't compare utility across people," with a verdict on their truth and whether they actually support his conclusion.

  ### The Menu of Claims

  #### 1. The Epistemic Claim (Measurement)
  *   **The Claim:** "We cannot observe or measure utility in a common unit (like 'utils') across different brains. There is no utility-meter."
  *   **Verdict:** **Mostly True (Practically).** We cannot directly access another person's subjective experience. However, we use proxies (willingness to pay, revealed preference, time use) to estimate it constantly.
  *   **Does it support his conclusion?** **No.** Just because something is hard to measure doesn't mean we can't make reasoned estimates. We estimate the "value of a statistical life" for policy all the time without a perfect meter. Difficulty of measurement implies uncertainty, not impossibility of judgment.

  #### 2. The Ontological Claim (Metaphysical)
  *   **The Claim:** "Utility isn't a physical quantity like mass or length. It is a theoretical construct, not a 'real thing' that exists to be compared."
  *   **Verdict:** **True.** Utility is a model, not a substance. But money, GDP, and "inflation" are also constructs. We compare those across people all the time.
  *   **Does it support his conclusion?** **No.** The fact that a concept is constructed doesn't prevent it from being useful for policy analysis.

  #### 3. The Formal Claim (Mathematical/Ordinal)
  *   **The Claim:** "Standard preference theory only defines utility ordinally (I prefer A to B), not cardinally (I prefer A to B by 10 utils). You can't add ordinal rankings across people."
  *   **Verdict:** **True (for standard theory).** In micro theory, utility functions are unique only up to a monotonic transformation. $U$ and $2U$ represent the same preferences. Therefore, $U_{person1} + U_{person2}$ is mathematically meaningless without a standardization rule.
  *   **Does it support his conclusion?** **Only if you assume standard theory is the only tool.** Cost-Benefit Analysis (CBA) implicitly assumes cardinality by using money as the common denominator. If you accept CBA, you have rejected strict ordinality for policy purposes.

  #### 4. The Normative Claim (Ethical)
  *   **The Claim:** "To compare my utility to yours, I must decide how much your happiness 'counts' relative to mine. That is a moral weight, not a fact."
  *   **Verdict:** **True.** This is the strongest claim. Saying "the gainers gain more than the losers lose" implicitly assumes a social welfare function where everyone's utility is weighted equally (utilitarianism). You could instead weight the poor higher than the rich. Choosing that weight is ethical.
  *   **Does it support his conclusion?** **Yes, but only partially.** It proves that the statement involves ethics. It does *not* prove that economists shouldn't engage with it (see Claim 5).

  #### 5. The Disciplinary Claim (Methodological Positivism)
  *   **The Claim:** "Economics is a positive science. Economists should only state facts. Value judgments are 'politics' and off-limits to the economist *qua* economist."
  *   **Verdict:** **Contestable / Philosophical.** This is not a fact about the world; it is a rule about the profession. It was popular in the mid-20th century (Lionel Robbins) but is widely challenged today.
  *   **Does it support his conclusion?** **Yes.** This is the **hidden premise** required to get to "so it's just politics." Without this claim, the fact that something is a value judgment (Claim 4) doesn't stop an economist from analyzing which value judgments lead to which outcomes.

  ---

  ### The Logic Gap: Why his conclusion doesn't follow

  Your friend's argument looks like this:
  1.  Interpersonal Utility Comparisons (IUCs) require ethical weights (Claim 4).
  2.  Ethical weights are not objective facts (Claim 4).
  3.  **Hidden Premise:** Economists must only deal in objective facts (Claim 5).
  4.  **Conclusion:** Therefore, economists cannot endorse policies requiring IUCs (only Pareto).

  **The Verdict on his Conclusion:**
  The conclusion is **not** a logical necessity of the nature of utility. It is a **choice** about the role of the economist.

  If you reject Claim 5 (the idea that economists must be value-free robots), then Claim 4 (that IUCs are ethical) simply means that **economic policy advice must be transparent about its ethical assumptions.** It does not mean we must remain silent.

  Furthermore, his reliance on **Pareto** is practically paralyzing. Almost no real-world policy is a Pareto improvement (making someone better off without making anyone worse off). Tax cuts hurt those who rely on the services funded by the tax; regulations hurt the firms being regulated. If economists can only speak on Pareto improvements, they can say nothing about almost any actual policy.

  ### Which reading does he probably mean?

  He is almost certainly operating under the **Robbinsian Positivist** framework (Claim 5). He believes that because IUCs involve ethics (Claim 4), and science must be value-free, IUCs are unscientific "politics."

  He is conflating **"This statement is not purely factual"** with **"This statement is purely arbitrary."**
  *   *Fact:* A policy creates \$1M in gains and \$0.5M in losses.
  *   *Value:* We should maximize total wealth.
  *   *Conclusion:* Do the policy.

  Your friend thinks the economist must stop at the *Fact*. You think the economist can discuss the *Value* as long as it's explicit.

  ### How to bring it back to him

  Don't argue about the nature of utility. Argue about the **role of the economist** and the **uselessness of Pareto**. Here are three specific questions to ask him:

  **1. The "Pareto Trap" Question**
  > "If we can only evaluate policies where *no one* loses, doesn't that mean economics has nothing to say about 99% of government policy? Are you saying an economist literally cannot offer an opinion on a tax cut because someone somewhere might pay slightly more?"
  *(This forces him to admit that Pareto is too strict for real life.)*

  **2. The "Hidden Weighting" Question**
  > "You say comparing utility is a value judgment. But isn't sticking to Pareto *also* a value judgment? It implies we value the status quo so highly that we won't change anything unless everyone agrees. Isn't 'protecting the veto power of losers' just as political as 'maximizing total gain'?"
  *(This exposes that his 'neutral' position is actually a conservative normative stance.)*

  **3. The "Cost-Benefit" Question**
  > "When the government does Cost-Benefit Analysis, they convert lives, time, and health into dollars to compare them. They are making interpersonal comparisons (a poor man's time is valued differently than a rich man's). Is all Cost-Benefit Analysis 'just politics' to you, or is it a useful tool that makes its ethical weights explicit?"
  *(This forces him to confront the fact that we already do this institutionally.)*

  ### Summary for your friend
  You can tell him:
  *"You are right that Interpersonal Utility Comparisons involve ethical weights (Claim 4). But you are wrong that this makes them 'just politics' in a dismissive sense (Claim 5). It just means the ethical weights need to be stated clearly. Your alternative (Pareto) isn't 'more scientific'; it's just a different ethical weight that prioritizes the status quo over efficiency. I'm arguing for Kaldor-Hicks efficiency (potential compensation); you're arguing for Status Quo bias. Both are value judgments, but mine is more useful for policy."*
