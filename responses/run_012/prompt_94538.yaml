prompt: |-
  Ok so I keep getting into this argument and I want to actually nail it down instead of just gesturing. A friend of mine, who's done a bit of econ, shut down a discussion we were having about a tax policy -- the tax makes some people better off and some worse off, and I said something like "surely it's still worth doing if the gainers gain more than the losers lose" -- by saying "you can't compare utility between people, it's not a real quantity, it's a value judgment, there's no fact of the matter, thats just politics." Then he said the only thing an economist can say is that if everyone is better off it's good and if someone is worse off you can't say anything at all, which I think is the Pareto thing.

  I'm pretty sure he's bundling like four different claims together and I want to see them pulled apart. What are all the distinct precise things "you can't compare utility across people" could be claiming? Is it a claim about measurement (no common unit, no cardinal scale), a claim about what preferences even represent (ordinal only, so only within-person rankings mean anything), a claim that cross-person comparisons are literally undefined or ill-formed, a claim that they're undefined *because* they can't be tested from behavior, a claim that any particular comparison smuggles in a normative weighting somewhere, or a flat metaphysical claim that they're impossible full stop? Which of these are trivially true, which are substantive and actually defensible, and which are just false or confused?

  And the part I really care about: for each reading, does it actually get him to "so it's just politics" and "so the only thing we can say is Pareto"? Or does he need extra premises on top, like that economics should only traffic in facts, or that value judgments are off-limits to economists, or that the only defensible welfare criterion is a unanimous one? Lay it out as a menu with a verdict on each and tell me which reading is the one he probably actually means. I want to bring it back to him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
