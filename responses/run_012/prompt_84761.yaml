prompt: |-
  I need a two-page proposal for a semester-long research grant in the philosophy of science, built around a half-formed idea of mine about the no-free-lunch theorems and the problem of induction. The familiar move is to treat those theorems as a formal vindication of Hume: averaged over all possible worlds, no inductive method does better than any other, so induction stands unjustified. I think this is too quick, and interestingly so. The averaging is uniform over the space of possible worlds, which means the theorems show that no method can beat chance when the choice of method is barred from encoding any commitment about which worlds are likely; they relocate the problem from the justification of methods to the choice of a prior, and then represent every prior as a wager whose gains in some worlds are paid for by equal losses in others.

  Turn this into a proposal. I want the question stated so that it has a determinate answer (roughly: do the theorems formalize the problem of induction, dissolve it, or convert it into a different problem, and is the resulting position stable?), an account of why the existing treatments leave it open, and a concrete method. My plan is to work through the finite case, where the result is a counting argument, and then ask whether it survives once the hypothesis class is restricted to the kinds of structure real learners exploit — smoothness, simplicity, or a causal ordering among the variables — since I suspect the theorem only bites when the class of possible worlds is closed under permutations of the inputs. Say what would count as a result, what would count as failure, and what a reader should take away; and give an honest assessment of what a single semester can and cannot settle. No citations needed, I will add those.
