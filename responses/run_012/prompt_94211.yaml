  **MEMORANDUM**

  **TO:** Grantmaking Committee, Regional Arts Foundation
  **FROM:** Selection Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Final Decision Regarding Municipal Hall Grant Award (Cycle 4)

  **1. The Decision**

  After deliberation on the two finalist proposals for the decommissioned Municipal Hall, the Committee has voted to award the $500,000 unrestricted grant to **Proposal A: The Regional Repertory Company**.

  This decision was not unanimous. The Committee recognizes that Proposal B (The Community Hub) presented a compelling vision for immediate, diffuse public access. However, the majority finds that Proposal A offers a more sustainable infrastructure for the building's long-term preservation and a higher ceiling for artistic excellence, provided that specific conditions regarding civic engagement are met.

  **2. Rationale and Engagement with Philosophical Objections**

  We owe a specific debt of gratitude to the committee memo circulated last month invoking Jean-Jacques Rousseau's *Letter to M. d'Alembert on the Theatre*. That memo rightly warned that a professional theater risks turning citizens into passive spectators, purchasing the sensation of virtue rather than practicing it, and transforming a space of public assembly into a space of commercial consumption.

  We are not dismissing this objection; we are attempting to answer it through the structure of this award.

  **Why Proposal A, despite the Rousseauian risk?**
  Our primary fiduciary duty is to the longevity of the asset (the Hall) and the impact of the capital. Proposal B relies on a diffuse network of amateur organizers and small stipends. While this aligns with Rousseau's preference for public festivals where "the spectators become the spectacle," history in cities of this size suggests that such models often struggle with the operational burden of maintaining a physical plant. Without a resident entity responsible for the building's heat, security, and repairs, the Hall risks returning to disrepair within five years. The Repertory Company offers an organizational anchor capable of stewarding the building for the long term.

  **Does Rousseau actually favor Proposal B?**
  The memo argues that Rousseau's critique necessitates funding the festival model. We contend this is only partially true. Rousseau objected to theater that isolates the audience in darkness, silencing them before a paid elite. He did not object to excellence or professionalism per se, but to *alienation*.

  Proposal B guarantees access, but access is not the same as engagement. A community chorus can be as exclusionary as a ticketed play if it forms a closed social clique. Conversely, a professional production, if structured correctly, can provoke the civic friction and dialogue that Rousseau valued in public assemblies. We are betting that a high-caliber artistic vision will draw people into the hall who might otherwise ignore a "town meeting," and that the art itself can serve as the catalyst for the civic practice Rousseau cherished.

  **What the Evidence Cannot Settle**
  We must be candid: there is no empirical data that definitively proves one model creates "better citizens" than the other. We do not know if a subscription season creates more social capital than a free festival. We are making a judgment call based on organizational capacity and the hypothesis that *excellence attracts engagement*, whereas *diffuse access often fails to sustain it*.

  **3. Conditions of Award**

  To mitigate the risk of passivity identified in the Rousseauian critique, the grant is contingent on the Repertory Company accepting the following "Civic Porosity" conditions. These are not suggestions; they are covenants.

  *   **The "Open Hall" Covenant:** The company must host one non-ticketed civic event per month (e.g., town halls, school board meetings, union gatherings) free of charge, ensuring the building remains a tool of governance, not just culture.
  *   **The Fourth Wall Clause:** 10% of the grant ($50,000) is earmarked specifically for "post-production assembly." This funds mandatory talkbacks, playwright forums, and community workshops where the audience interacts with the creators. The goal is to break the spectator/performer hierarchy.
  *   **Local Hiring & Apprenticeship:** The resident ensemble must include a minimum of three apprentices drawn from the local population, paid a living stipend, to ensure the "professional class" is not entirely imported.
  *   **Pricing Structure:** While a subscription model is permitted, 20% of seats for every performance must be held for "pay-what-you-can" admission at the door, preventing the hall from becoming a space solely for the economic elite.

  **4. Evaluation Plan and Time Frame**

  We recognize that traditional metrics (ticket sales, subscription renewals) will measure financial health but not civic health. Therefore, the evaluation plan will be mixed-method:

  *   **Quantitative:** Attendance figures, demographic data of attendees vs. city census, and building utilization rates (hours open to public).
  *   **Qualitative:** Annual "Civic Impact Audits" conducted by a third party. This will include surveys measuring whether attendees feel more connected to their community after engaging with the work.
  *   **Timeline:** The $500,000 will be disbursed over three years.
      *   *Year 1:* $200,000 (Renovation and hiring).
      *   *Year 2:* $150,000 (Operating support, contingent on Year 1 civic metrics).
      *   *Year 3:* $150,000 (Operating support, contingent on Year 2 civic metrics).

  **5. Invitation to the Minority View**

  To those on the Committee who advocated for Proposal B: We acknowledge that your concern regarding the "spectator culture" is the primary risk of this decision. Therefore, we invite the author of the Rousseauian memo to serve as the **Civic Liaison** on the oversight subcommittee for this grant.

  Your role would not be to interfere with artistic choices, but to monitor the "Civic Porosity" conditions. If the Repertory Company retreats into exclusivity or fails to host the required civic assemblies, you will have the standing to recommend withholding the subsequent year's tranche. This ensures that the philosophical objection remains a living part of the grant's execution, not just its deliberation.

  **6. Conclusion**

  We are funding a theater, but we are buying a civic hub. If the Repertory Company treats the Municipal Hall as a private club, they will be in breach of this award. If they treat it as a public square that happens to contain a stage, they will justify this Committee's risk.

  We will notify both finalists by Friday.

  ***

  **Attachments:**
  *   *Draft Grant Agreement (Section 4: Civic Covenants)*
  *   *Evaluation Rubric (Year 1-3)*
