  6.  **Final Polish:** Ensure the distinction between "all-things-considered" and "pro-tanto" is clear (Temkin's move). Ensure the distinction between "outcome value" and "relational status" is sharp. Address the "verbal dispute" worry regarding extensional equivalence firmly (reasons matter for stability and guidance).

