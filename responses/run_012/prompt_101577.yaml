      *   *Refining the "Axiology vs. Claims" point:* The user is right that Prioritarianism is axiological. But Egalitarianism splits. Telic Egalitarianism *is* axiological. Relational Egalitarianism is *not*. The fight is often between a Prioritarian and a Relational Egalitarian talking past each other, OR a Prioritarian and a Telic Egalitarian fighting over bedrock value.
