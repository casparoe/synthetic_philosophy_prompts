answer: |-
  The notebook lay open next to the sink, pages stiff with grease and field dust. Arthur didn't look at the words he'd written, only the columns of figures. They were neat, stacked like bricks. He tapped the pen against the counter, a rhythmic metronome counting down the seconds until the water boiled.

  On the left side of the stove sat a pot of dry lentils. Earth-colored, hard, numerous. He looked at them and saw the combine harvester parked outside in the twilight, its blade stained dark green and brown. He knew what was in the grain silo. He knew the density of the vole population in the lower forty acres before the harvest began. He knew the radius of the mower's sweep. He didn't need to look up the mortality rates again; the numbers in the notebook were already settled. Hundreds per acre. Thousands for the season. Small hearts stopped by steel bars, invisible in the rush of the crop.

  On the right side of the counter lay the vacuum-sealed steak. Deep red, singular. It took up less space than the bag of lentils, yet it felt heavier in his peripheral vision. One life. One throat cut, one fall. The math was simple, almost comforting in its gravity. A single variable instead of an equation of thousands.

  Arthur turned to the window. The glass was dark now, reflecting his own face over the yard. Beyond the fence line, the woods began. He listened. There was a rustle in the underbrush, followed by a sharp, high squeal that cut off abruptly. An owl, or a fox. Something caught, something torn. He knew the other numbers, the ones he hadn't written down because they were too large to fit on the page. The wild population density. The starvation rates over winter. The predation, the disease, the exposure. The endless, chaotic slaughter that happened without machinery, without purpose, without end.

  He looked back at the kitchen. Here, the death was accounted for. It was budgeted. It was contained within the walls of the house and the fences of the pasture.

  He closed the notebook. The sound was final.

  He picked up the bag of lentils. For a moment, he weighed them in his hand, feeling the shifting mass of the seeds. He imagined the shifting mass of the bodies in the field, the ones nobody counted because they weren't meat. He imagined the woods, teeming with suffering that no harvest could pause.

  He put the lentils back in the cupboard.

  He picked up the steak. He peeled back the plastic. The smell was iron and salt. He dropped it into the hot pan. The hiss was loud in the quiet kitchen, drowning out the sounds from the woods. He turned the burner up, ensuring the heat was even, ensuring the process was efficient.

  Arthur stood over the stove until the red turned to brown. He didn't set the table for anyone else. He took the plate and stood by the window, looking out at the harvested field. It was bare now, stripped clean. A monoculture of stubble stretching to the tree line. No movement in the rows. No hiding places. Just the open ground, safe and dead.

  He took a bite. He chewed slowly, swallowing the calculation. There was no guilt, only the cold relief of the sum balancing out. He finished the plate, rinsed it, and turned off the kitchen light. Outside, the woods were full of noise, but inside, the silence was perfect.
