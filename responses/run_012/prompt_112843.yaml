prompt: |-
  You are a philosopher of probability who works on Bayesian updating. I have one free semester, a solid background in probability theory and formal epistemology, and no appetite for a literature survey, so give me a defended research agenda rather than citations or a reading list.

  The area is updating on conditional information, in the vicinity of the Judy Benjamin problem. Take the following as fixed background rather than re-arguing it: (i) a message's content does not by itself determine the posterior, since you also need the protocol by which the message was generated, so a conditional-probability report, a material conditional, and a report of a conditional with a stated probability can all be genuine evidence yet demand different updates; and (ii) the standard constraint-based rule, minimizing relative entropy from the prior subject to the constraint (infomin), is not obviously correct, partly because it can shift probabilities of propositions the message never mentioned.

  Given that, which open questions here are most worth a semester? I want a dependency-aware ranking: which questions are upstream of which, which are tractable for one person with pen and paper and no new data, and which look urgent but would not change much downstream if settled. I am especially interested in whether strict conditionalization, Jeffrey conditionalization, and infomin fall out as special cases of a single more general account of updating on a message whose logical form and generation protocol are themselves uncertain, and in whether "protocol" can be made precise enough to do real work rather than restate the puzzle.

  Think this through carefully before answering: brainstorm a longer list of candidate questions, prune it to the survivors, and only then rank them. Close by naming the weakest link in your ranking — which ordering is most likely to be wrong, and what argument or consideration would move it.

  After the prose, give the ranking as a table with these columns: Rank; Question (one sentence); Why upstream (which other questions depend on it); Tractability for one semester of pen-and-paper work (low, medium, or high); What would change my mind (the consideration that would reorder it); Residual doubt (low, medium, or high).
