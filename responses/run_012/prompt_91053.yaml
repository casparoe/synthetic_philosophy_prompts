          *   Standard Causal Inference Rule: For the *Total Effect* of the drug (which is usually what goes in an abstract), you must **Pool**. Stratifying on a mediator blocks the pathway through which the drug works.
          *   *Correction:* The user's verdict for (6) is likely the one to abandon. It is indeed the mirror image of (3). In (3), training causes employment which causes earnings. In (6), drug causes LDL reduction which causes health. If you stratify on LDL, you ask "Does the drug help people *regardless* of whether it lowers cholesterol?" (Direct Effect). Usually, clinicians want "Does the drug help?" (Total Effect).
          *   *Decision:* To make the rule consistent, I must advise the user that Verdict (6) is incorrect according to the principle that satisfies (1)-(5).

  4.  **Drafting the Principle:**

      *   **Name:** The Causal Direction Principle (or Backdoor/Frontdoor criterion simplified).
      *   **Rule:** Stratify if the subgrouping variable is a **cause** (or proxy for a cause) of the outcome that is **not caused by the treatment**. Pool if the subgrouping variable is **caused by the treatment** (a mediator) or is a **consequence** of the outcome (a collider).
      *   **Refinement:** Distinguish between *Pre-treatment covariates* (Stratify) and *Post-treatment variables* (Pool). *Exception:* Post-treatment *measurement* of Pre-treatment *facts* (Case 5) counts as Pre-treatment.
      *   **Formal Phrasing:** "Adjust (stratify) for variables that confound the relationship between exposure and outcome. Do not adjust for variables that mediate the relationship (lie on the causal pathway) or are colliders (common effects)."
      *   **Operational Test:** Would the treatment *change* the value of this variable?
          *   If Yes: It's a mediator/consequence. **Pool**.
          *   If No: It's a baseline characteristic (even if measured later). **Stratify**.

  5.  **Addressing the Specific Questions:**

      *   **Principle:** Causal Direction / Mediator vs. Confounder.
      *   **(3)/(4) vs (5):** (3) and (4) split on variables *changed* by treatment (Mediators). (5) splits on a variable *unchanged* by treatment (Confounder/Prognostic Factor), despite late measurement.
      *   **Which verdict to abandon?** Case (6). On-treatment LDL is caused by the drug. It is a mediator. Pooling gives the Total Effect (what matters for "does the drug work?"). Stratifying gives the Direct Effect (does it work *other than* through cholesterol?). Usually, abstracts report Total Effect. So (6) should be Pool, matching (3).
      *   **New Case (Referral to Specialist):**
          *   Variable: Referral.
          *   Structure: Treatment $\to$ Referral $\leftarrow$ Outcome (Severity/Complications).
          *   This is a **Collider** (Common Effect).
          *   Rule: Do not condition on Colliders.
          *   Prediction: **Pool**. Stratifying would induce bias (Berkson's paradox).

  6.  **Refining the Output:**
      *   Need to be respectful of the user's expertise but firm on the causal inference logic (DAGs).
      *   Acknowledge that Case 6 is the "sacrifice" to save the rule.
