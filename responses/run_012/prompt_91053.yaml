      *   So Case 6 must be Pool to be consistent with Case 3 & 4.

      *   *Wait, one nuance on Case 6:* Sometimes we stratify on mediators to show mechanism (e.g., "The drug works *by* lowering LDL"). But the user says "abstract". Abstracts usually claim efficacy. Efficacy = Total Effect. So Pool is correct for the abstract.
      *   *Wait, one nuance on Case 1:* This is Simpson's Paradox classic. The "Treatment" is Gender. The "Confounder" is Department. Department is not caused by Gender in a way that blocks the causal path of interest (bias). It's a confounder of the *fairness* assessment.
      *   Okay, the unifying theme is **Causal Graphs (DAGs)**.
      *   Rule: **Adjust for Confounders. Do not adjust for Mediators or Colliders.**
      *   Case 1: Dept is a Confounder of Gender$\to$Admission (regarding bias). (Actually, it's more like Gender$\to$Dept$\to$Admission, but we want the direct path Gender$\to$Admission). Let's stick to the simpler "Pre-treatment vs Post-treatment" heuristic refined by "Biological Reality".
      *   Better Heuristic: **"Would randomization balance this variable?"**
