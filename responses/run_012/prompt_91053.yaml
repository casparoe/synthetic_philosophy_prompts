answer: |-
  The principle you are looking for is the **Confounder-Mediator Distinction**, derived from causal inference and Directed Acyclic Graphs (DAGs). Your gut is correctly identifying causal structures, but you have been using *measurement time* as a proxy for *causal time*.

  Here is the precise rule, the resolution of your conflict, the necessary sacrifice, and the prediction for your new case.

  ### 1. The Principle: Adjust for Causes, Not Consequences

  **The Rule:**
  *   **Stratify (Adjust)** if the subgrouping variable is a **Confounder** or **Prognostic Factor**: a variable that influences the outcome and is *not* caused by the treatment (even if measured later).
  *   **Pool (Do Not Adjust)** if the subgrouping variable is a **Mediator** or **Collider**: a variable that is caused by the treatment, caused by the outcome, or is a common effect of both.

  **The Operational Test (The Randomization Check):**
  Ask yourself: *"If I had perfectly randomized the treatment, would the treatment groups be balanced on this variable?"*
  *   **Yes:** The variable is a baseline characteristic. **Stratify** to reduce noise or control for imbalance (in observational data).
  *   **No:** The variable is a consequence of the treatment. **Pool** to capture the Total Effect.

  ### 2. Resolving the (3)/(4) vs. (5) Conflict

  Your conflict arises because you were tracking *when the data was recorded* rather than *when the fact was established*.

  *   **Cases (3) and (4):** Employment and Hospitalization are **Mediators**. The treatment *changes* whether you are employed or hospitalized. If you stratify on them, you block the very pathway through which the treatment works. You are asking, "Does the drug work *excluding* its ability to keep people out of the hospital?" That is not the clinical question.
      *   *Randomization Check:* Would randomization balance hospitalization? No, because the drug prevents it.
      *   *Verdict:* **Pool.**

  *   **Case (5):** Tumor Grade is a **Confounder/Prognostic Factor**. Even though the pathologist wrote the report after treatment started, the biology of the tumor was fixed *before* treatment started. The treatment cannot change the grade.
      *   *Randomization Check:* Would randomization balance tumor grade? Yes, because grade is fixed biology.
      *   *Verdict:* **Stratify.**

  **Resolution:** The rule prioritizes **Causal Direction** over **Measurement Date**. Case (5) is stratified because the variable is causally pre-treatment, despite being recorded post-treatment. Cases (3) and (4) are pooled because the variables are causally post-treatment.

  ### 3. The Verdict That Must Be Abandoned: Case (6)

  To maintain a consistent rule across all cases, **you must abandon your verdict for Case (6).**

  *   **Case (6) Analysis:** On-treatment LDL is a **Mediator**. The drug lowers LDL ($Treatment \to LDL$), and lower LDL improves health ($LDL \to Outcome$).
  *   **The Conflict:** You noted this feels like the "mirror image of case 3." It is. In Case (3), training causes employment which causes earnings. In Case (6), drug causes LDL reduction which causes health.
  *   **The Correction:** If you stratify by on-treatment LDL, you are asking, "Does the drug help patients *regardless* of whether it lowers their cholesterol?" This estimates the *Direct Effect*, not the *Total Effect*. For a clinical abstract claiming efficacy, the *Total Effect* is the standard.
  *   **New Verdict:** **Pool.** (Unless your specific scientific question is about mechanism, but for the "does it work?" abstract, you must pool).

  **Summary of Accommodated Verdicts:**
  *   (1) Stratify (Program is a baseline context/confounder).
  *   (2) Stratify (Severity is a baseline confounder).
  *   (3) Pool (Employment is a mediator).
  *   (4) Pool (Hospitalization is a mediator).
  *   (5) Stratify (Grade is a baseline factor, despite late recording).
  *   (6) **Pool** (LDL is a mediator; your original verdict was the outlier).

  ### 4. Prediction for the New Case (Referral to Specialist)

  **Scenario:** You split on whether a patient was referred to a specialist. Referral is a **Common Effect (Collider)**:
  *   Treatment $\to$ Referral (e.g., side effects prompt referral).
  *   Outcome (Severity) $\to$ Referral (e.g., worsening symptoms prompt referral).

  **The Rule's Prediction:** **Pool.**

  **Reasoning:**
  Conditioning on a **Collider** induces bias (Berkson's Paradox). If you stratify on "Referred," you create a spurious association between Treatment and Outcome within that group.
  *   *Example:* Among those referred, if a patient was *not* treated, they must have been referred because they were very sick (Outcome $\to$ Referral). If a patient *was* treated, they might have been referred just because of a minor side effect (Treatment $\to$ Referral). This makes the treated group look healthier than the untreated group *within the referred stratum*, even if the drug is useless.
  *   *Randomization Check:* Would randomization balance referral? No, because both the drug and the disease severity drive referral.

  **Final Advice for Your Colleagues:**
  Stop arguing about "dates" or "numbers." Draw the arrows.
  1.  Does the Treatment cause the Subgroup variable? **Pool.**
  2.  Does the Subgroup variable cause the Outcome (independently of Treatment)? **Stratify.**
  3.  Do both Treatment and Outcome cause the Subgroup variable? **Pool.**
