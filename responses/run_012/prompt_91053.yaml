  2.  **Analyze the Six Cases:**

      *   **Case 1 (Graduate Admissions):**
          *   Variable: Program Selectivity.
          *   Timing: Pre-application (essentially pre-treatment/decision).
          *   Causal Structure: Gender $\to$ Program Choice $\to$ Admission. Program $\to$ Admission.
          *   Confounding? Yes, Program is a confounder of Gender $\to$ Admission (if we view Gender as the "exposure"). Actually, Program is a *mediator* of Gender's effect on Admission rates if we look at total effect, but usually, we want the *direct* effect of Gender on Admission *within* a program to check for bias.
          *   Verdict: **Stratify**.
          *   Reasoning: Program choice is a pre-existing characteristic (or at least, the bias is about admission *given* application). The pooled rate mixes apples and oranges (different pools of applicants).

      *   **Case 2 (Treatment vs. Severity):**
          *   Variable: Disease Severity.
          *   Timing: Pre-treatment (baseline).
          *   Causal Structure: Severity $\to$ Treatment Assignment (doctors give drug to sick people). Severity $\to$ Outcome.
          *   Confounding? Yes, Severity is a *confounder*.
          *   Verdict: **Stratify**.
          *   Reasoning: Standard confounding adjustment. Need to compare like with like.

      *   **Case 3 (Job Training vs. Employment):**
          *   Variable: Employment Status at 2 years.
          *   Timing: Post-treatment.
          *   Causal Structure: Treatment $\to$ Employment $\to$ Earnings. Also Treatment $\to$ Earnings.
          *   Mechanism: The treatment *causes* employment. Splitting on employment blocks the main pathway.
          *   Verdict: **Pool** (Total Effect).
          *   Reasoning: Employment is a *mediator*. Conditioning on a mediator biases the total effect estimate (collider bias if there are unmeasured causes of earnings, but primarily it blocks the mechanism).

      *   **Case 4 (Drug vs. Hospitalization):**
          *   Variable: Hospitalization.
          *   Timing: Post-treatment.
          *   Causal Structure: Treatment $\to$ Hospitalization $\to$ Mortality. Treatment $\to$ Mortality.
          *   Mechanism: Drug prevents hospitalization. Hospitalized patients are a selected group (survivors or severe cases).
          *   Verdict: **Pool** (Total Effect).
          *   Reasoning: Hospitalization is a *mediator* (or a post-treatment selection variable). Conditioning on it induces selection bias (collider bias if hospitalization is affected by unmeasured severity).

      *   **Case 5 (Cancer vs. Tumor Grade):**
          *   Variable: Tumor Grade.
          *   Timing: Recorded post-treatment start, but *biologically fixed* pre-treatment.
          *   Causal Structure: Grade $\to$ Outcome. Grade $\to$ (maybe) Treatment assignment? (User says "reflects a fixed biological feature... treatment cannot plausibly change").
          *   Key Distinction: Even though *measured* late, it represents a *baseline* characteristic. It is not caused by the treatment.
          *   Verdict: **Stratify**.
          *   Reasoning: It acts as a baseline prognostic factor (confounder or effect modifier), not a mediator.

      *   **Case 6 (Cholesterol vs. On-Treatment LDL):**
          *   Variable: On-treatment LDL.
          *   Timing: Post-treatment.
          *   Causal Structure: Treatment $\to$ LDL $\to$ Outcome.
          *   Mechanism: Drug lowers LDL. LDL affects outcome.
          *   Verdict: **Stratify** (User says "I'll admit this is the one I'd abandon most easily... feels like mirror image of case 3").
          *   Reasoning: This is technically conditioning on a *mediator*. Standard causal inference says Pool (Total Effect). However, sometimes we want the effect *independent* of the mechanism (Direct Effect), or we are checking if the drug works *through* LDL. But usually, for "Does the drug work?", Pool is correct. The user suspects this verdict might be wrong ("mirror image of case 3").

  3.  **Identify the Underlying Principle:**

      *   The conflict is between **Confounders** (Stratify) vs. **Mediators/Colliders** (Pool).
      *   Case 1: Program is a confounder of the *bias* question (or pre-treatment stratification variable).
      *   Case 2: Severity is a Confounder. $\to$ Stratify.
      *   Case 3: Employment is a Mediator. $\to$ Pool.
      *   Case 4: Hospitalization is a Mediator/Selection. $\to$ Pool.
      *   Case 5: Grade is a Baseline Covariate (measured late, but causally pre-treatment). $\to$ Stratify.
      *   Case 6: LDL is a Mediator. $\to$ User says Stratify, but admits doubt.

      *   **The Causal Diagram Rule (DAGs):**
          *   If the third variable ($Z$) is a **Confounder** (causes Treatment and Outcome, or causes Outcome and is associated with Treatment via baseline), **Stratify** (Adjust).
          *   If the third variable ($Z$) is a **Mediator** (caused by Treatment, leads to Outcome), **Pool** (for Total Effect).
          *   If the third variable ($Z$) is a **Collider** (caused by Treatment and Outcome, or Treatment and Unmeasured Cause), **Pool** (Conditioning opens a backdoor path).

      *   **Addressing the (3)/(4) vs. (5) Conflict:**
          *   The user's previous rule was "Timing" (Fixed before treatment?).
          *   Case 5 breaks timing because it was *recorded* late.
          *   The correct rule is **Causal Direction**, not Measurement Timing.
          *   Is $Z$ caused by Treatment ($T \to Z$)?
              *   If Yes ($T \to Z \to Y$): It's a Mediator. **Pool** (for total effect).
              *   If No ($Z \to T$ or $Z$ independent of $T$): It's a Confounder/Baseline. **Stratify**.
