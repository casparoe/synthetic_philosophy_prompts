      *   Why Stratify? Because the question is "Is the *program* biased?", not "Do women get admitted less overall?" (which is driven by their choices).
      *   Actually, a better framing for the general rule is: **Is the variable a pre-existing characteristic relevant to risk/selection, or is it a consequence of the intervention?**
