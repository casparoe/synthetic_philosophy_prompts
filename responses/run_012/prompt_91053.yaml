      *   In Case 6, LDL is a consequence of the *intervention*.
      *   So the rule holds: **Stratify on Pre-existing Prognostic Factors. Pool on Post-Treatment Consequences.**
      *   Case 5 is Pre-existing (biologically), despite post-measurement.
