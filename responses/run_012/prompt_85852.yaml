  # SEMINAR HANDOUT: THE LOGICAL SPACE OF TRUTH
  **Decision Tree for Locating Positions on Truth**

  **Instructions:** Proceed through the nodes by selecting the answer that best matches your intuition about the case or concept presented. Do not worry about which philosopher holds which view; follow the logic of your answers to the terminal leaves.

  ### **NODE 1**
  **When we call a sentence "true," are we describing a feature it possesses, or merely endorsing it for acceptance?**
  *   **(A) Describing a feature:** Go to Node 2.
  *   **(B) Endorsing it:** Go to Leaf D.

  ### **NODE 2**
  **Is the sense in which a mathematical equation is true the same sense in which a moral claim is true? (Case vi)**
  *   **(A) Yes, the same sense:** Go to Node 3.
  *   **(B) No, a different sense:** Go to Leaf P.

  ### **NODE 3**
  **Is truth primarily a rule for when you may speak, or a destination for thought to reach?**
  *   **(A) A rule for speaking:** Go to Leaf N.
  *   **(B) A destination for thought:** Go to Node 4.

  ### **NODE 4**
  **Consider a claim with no consequences at all for anyone's practice. (Case v)**
  **Can this claim nonetheless be true or false?**
  *   **(A) Yes, it can be true/false:** Go to Node 5.
  *   **(B) No, truth requires practice:** Go to Node 8.

  ### **NODE 5**
  **Consider the exact arrangement of grains of sand on a beach in 3000 BCE, which no one will ever investigate. (Case i)**
  **Is there a fact of the matter?**
  *   **(A) Yes, there is a fact:** Go to Node 6.
  *   **(B) No, no fact without investigation:** Go to Leaf C.

  ### **NODE 6**
  **Consider a belief that is useful to hold but that we would call false, and its mirror (true but ruinous). (Case iii)**
  **Does this contrast show that 'truth' and 'usefulness' name different things?**
  *   **(A) Yes, they are different:** Go to Node 7.
  *   **(B) No, truth is a kind of usefulness:** Go to Leaf J.

  ### **NODE 7**
  **If all inquirers were to agree on a belief forever, would they agree *because* it is true, or is it true *because* they agree?**
  *   **(A) They agree because it is true:** Go to Leaf R.
  *   **(B) It is true because they agree:** Go to Node 9.

  ### **NODE 8**
  **Is usefulness what truth *is*, or merely evidence that a belief is true?**
  *   **(A) What truth is:** Go to Leaf J.
  *   **(B) Evidence that it is true:** Go to Node 9.

  ### **NODE 9**
  **If inquiry converges only because inquirers would eventually be unable to think otherwise, is that convergence truth? (Case iv)**
  *   **(A) Yes, that is truth:** Go to Leaf C.
  *   **(B) No, the world must force the agreement:** Go to Node 10.

  ### **NODE 10**
  **Consider a belief indispensable for centuries that later became a liability. (Case ii)**
  **Did the belief stop being *true*, or did we just stop *believing* it?**
  *   **(A) It stopped being true:** Go to Leaf J.
  *   **(B) We just stopped believing it:** Go to Leaf Q.

  ### **NODE 11**
  **Can truth itself change while beliefs do not?**
  *   **(A) Yes, truth changes:** Go to Leaf J.
  *   **(B) No, truth is stable:** Go to Leaf Q.

  ### **NODE 12**
  **Does the world constrain belief, or does belief constrain the world?**
  *   **(A) World constrains belief:** Go to Leaf R.
  *   **(B) Belief constrains world:** Go to Leaf C.

  *(Note: Nodes 10, 11, and 12 serve as refinements for the final distinctions between Peircean, Correspondence, and Coherence views depending on the path taken.)*

  ---

  ### **TERMINAL LEAVES**

  **Leaf D: Deflationism**
  *   **Answer:** Truth is not a substantive property but a logical device for endorsement and disquotation.
  *   **Awkward Commitment:** It struggles to explain why we value truth over falsehood if truth is merely a grammatical convenience.

  **Leaf P: Truth Pluralism**
  *   **Answer:** There is no single truth property; mathematics, physics, and ethics have different truth-makers.
  *   **Awkward Commitment:** It must explain what unifies these distinct properties under the single word "true" without reintroducing a monist property.

  **Leaf N: Norm of Assertion View**
  *   **Answer:** Truth is not a goal of inquiry but a normative rule governing when one is permitted to assert a sentence.
  *   **Awkward Commitment:** It risks making truth entirely dependent on social linguistic practices rather than how things stand.

  **Leaf R: Correspondence Theory**
  *   **Answer:** Truth is a stable relation between belief and reality; inquiry converges because the truth constrains us.
  *   **Awkward Commitment:** It must posit a relation to "facts" that is often metaphysically obscure and inaccessible to verification.

  **Leaf C: Coherence Theory**
  *   **Answer:** Truth is a property of beliefs that cohere within a system or consensus, not a relation to a mind-independent world.
  *   **Awkward Commitment:** It allows that a perfectly coherent system of beliefs could be completely detached from reality.

  **Leaf J: Jamesian Pragmatism**
  *   **Answer:** Truth is what it is good for us to believe; usefulness constitutes truth rather than merely evidencing it.
  *   **Awkward Commitment:** It implies that a belief can cease to be true if it ceases to be useful, making truth transient.

  **Leaf Q: Peircean Convergence**
  *   **Answer:** Truth is what inquiry would converge on at its ideal limit, fixed by reality but defined by the process.
  *   **Awkward Commitment:** It relies on a counterfactual ideal limit of inquiry that may never be actualized or even definable.

  ---

  ### **UNOCCUPIED COMBINATIONS**

  **1. Property + No Fact of the Matter (Node 1A + Node 5B)**
  *   **Diagnosis:** *Incoherent.* If truth is a descriptive property (1A), it typically requires a truth-maker (a fact). Denying facts about uninvestigated claims while maintaining truth is a property usually collapses into verificationism or deflationism.

  **2. Truth Explains Convergence + Truth Changes (Node 7A + Node 11A)**
  *   **Diagnosis:** *Unattractive.* If truth is the *cause* of convergence (realism), it is generally held to be stable. A truth that causes agreement but changes over time undermines the explanatory power of the "truth" posited.

  **3. Endorsing + Single Property (Node 1B + Node 2A)**
  *   **Diagnosis:** *Unexplored.* Most deflationists (1B) are happy to accept truth is univocal, but few explore whether the *endorsement* function works identically across ethics and physics without implying a pluralism of norms.

  ---

  ### **STRUCTURAL ANALYSIS**

  **1. The Peirce-James Fork**
  The single fork that genuinely separates the Peircean leaf (Q) from the Jamesian leaf (J) is **Node 10/11 (Truth Stability/Change)** and **Node 6 (Utility Definition)**. However, the sharper metaphysical divide is located at **Node 7 (Convergence Explanation)**.
  *   **Peirce (Q):** Holds that convergence is explained by truth (Node 7A), but truth is *defined* by the limit of that convergence (Leaf Q).
  *   **James (J):** Holds that truth is defined by utility (Node 6B/8A), and thus truth can change (Node 10A/11A).
  *   **Relation to Others:** This same fork (Node 7) separates both Peirce and James from the **Correspondence (R)** leaf. Correspondence insists truth explains convergence (7A) *and* that truth is independent of inquiry (Node 5A/4A). Deflationism (D) bypasses this fork entirely at Node 1, rejecting the premise that "explanation" applies to a non-property.

  **2. Indistinguishable Leaves**
  The tree cannot fully separate **Leaf C (Coherence)** and **Leaf J (Jamesian)** on all paths.
  *   **Defect or Convergence?** This is a *real convergence*. Both views tie truth to mental states (consensus for Coherence, utility for James) rather than mind-independent facts. In cases where "what coheres" and "what is useful" overlap, the positions yield identical predictions. The tree only separates them when "usefulness" diverges from "consensus" (Node 8) or when "truth change" is invoked (Node 10).

  **3. Placement of the "Cognitive Constitution" Case**
  *   **Case:** A community of inquirers who would agree at the limit of inquiry that *p* is true, but only because their cognitive constitution makes them agree, with nothing about the world doing work.
  *   **Rules Out:** This case rules out **Leaf R (Correspondence)** and **Leaf Q (Peircean Convergence)**.
      *   **Correspondence** requires the world to constrain belief (Node 12A).
      *   **Peirce** requires the "external permanency" of reality to drive the convergence, not just internal cognitive necessity (Node 9B).
  *   **Compatible Leaves:** This case is compatible with **Leaf C (Coherence)** (agreement is sufficient), **Leaf J (Jamesian)** (if the constitution makes it good to believe), and **Leaf D (Deflationism)** (which does not inquire into the cause of agreement). It sits most comfortably in **Leaf C**, as it describes truth as a function of inquirer constraints rather than worldly constraints.
