answer: |-
  The session moves from disentangling craving and suffering in a single case to testing the view's stability against reflexive objections, ensuring welfare judgments precede therapeutic advice.

  **1. The Case (0–10 minutes)**
  Introduce Mr. K, a composer. Present three phases:
  *   **Phase 1:** Manic creation. Intense drive to finish the symphony (Craving+), but no distress while working (Suffering-).
  *   **Phase 2:** Success achieved. The craving is satisfied, but maintaining status causes anxiety (Satisfied Craving, Suffering+).
  *   **Phase 3:** Medication kills the drive. The craving lapses without satisfaction, but he feels empty pain (Lapsed Craving, Suffering+).
  *   **Dependency:** This case must be presented *before* definitions to bypass diagnostic reflexes. It must lack clear diagnostic labels so residents cannot file it as "mania" or "depression" and stop thinking. It must show Craving without Suffering (Phase 1) and Suffering without Craving (Phase 3) to prove the axes are independent.

  **2. Definitions & Stipulations (10–25 minutes)**
  Define craving as "wanting-tension" and suffering as "aversive character." State the two-axis stipulation: they vary independently. State the ranking: absence of both is primary; pleasure is secondary.
  *   **Misconception (Hedonism/Apathy):** Head this off *here*. Explicitly state that craving is not pleasure, and absence of craving is not anhedonia. If you wait until the case application, they will have already mapped craving onto "positive affect."

  **3. Welfare Application (25–40 minutes)**
  Ask residents to rank Mr. K's welfare in each phase using only tranquilist metrics.
  *   **Misconception (Therapeutic Recommendation):** Head this off *here*. When residents suggest treating Phase 1, remind them this is a claim about welfare, not a treatment protocol.
  *   **Misconception (Blunted Contentment):** Challenge the intuition that Phase 3 is an improvement. Ask if reducing capacity to crave counts as "going well."
  *   **Dependency:** You cannot discuss the reflexive problem until they accept the axes are distinct. If they conflate craving and suffering, reflexivity looks like a contradiction rather than a mechanical problem.

  **4. Reflexivity (40–50 minutes)**
  Introduce the claim: the wish not to crave is itself a craving.
  *   **Placement:** This lands *after* welfare application. If introduced earlier, residents will treat it as a refutation. Framed now, it is a problem the view must solve (e.g., does satisfying this specific craving eliminate the category?).
  *   **Misconception (Self-Defeating):** Prevent them from dismissing the view as paradoxical. Ask how the view accounts for the transition without claiming the transition is impossible.

  **5. Closing Question (50–60 minutes)**
  Ask: "If eliminating a specific craving causes severe suffering, does tranquilism mandate elimination?"
  *   **Reasoning:** A resident who memorized stipulations will answer "Yes" (Craving is bad). A resident who applied the two axes independently will answer "Not necessarily" (Suffering is also bad; trade-offs exist). This tests independent application versus rote recall.

  **6. Refusals**
  Say out loud: "We will not cover historical lineage, such as parallels in Buddhism or Schopenhauer, nor will we debate the metaphysical ontology of desire. We lack the time for genealogy or metaphysics; we are testing a welfare claim."
