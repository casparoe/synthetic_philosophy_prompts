answer: |-
  ### Candidate Decision Rules

  Based on the five prior rulings, I have identified three decision rules that account for the Commission's past outcomes with equal fidelity. Each prioritizes a different variable in the "living-constituency standard."

  **1. The Site-Function Congruence Rule**
  *   **Principle:** A monument must be removed or relocated if its physical location implies institutional endorsement of the honoree's harmful acts. If the site celebrates a function the honoree supported (e.g., benefaction), it may be retained with context.
  *   **Fit:** Explains *Renn* (Relocate: Hospital entrance contradicts eugenics) and *Drayton* (Remove: City Hall contradicts corruption) versus *Vale* (Retain: Library matches benefaction) and *Kessler* (Retain: Street name is neutral). *Kettle* fits here as the Park entrance endorsed the separatist message.
  *   **Prediction for Voss:** **Relocate.** The statue stands at the main entrance of Marlow General Hospital. Voss's harm (non-consensual surgery on patients) occurred within the medical institution. Leaving it at the entrance implies the hospital still endorses her methods, creating a functional incongruence similar to *Renn*.

  **2. The Irreparable Expressive Cost Rule**
  *   **Principle:** If a specific, living constituency experiences the monument as an ongoing threat or insult that a plaque cannot neutralize, the monument must be removed or relocated. If the harm is historical or abstract, context is sufficient.
  *   **Fit:** Explains *Kettle* (Remove: Black residents intimidated) and *Drayton* (Remove: Public trust harmed) versus *Vale* (Retain: Enslaved people deceased) and *Kessler* (Retain: Child laborers deceased). *Renn* (Relocate) fits as a compromise where the constituency (disabled/patients) is living, but historical value is preserved.
  *   **Prediction for Voss:** **Remove or Relocate.** Disability rights advocates and descendants of patients constitute a living constituency. Given the physical nature of the harm (surgery without consent), a plaque may be insufficient to repair the expressive cost (as in *Kettle*). However, because Voss also saved thousands (historical value), *Renn* suggests Relocation is the permissible compromise.

  **3. The Monumental Intent Rule**
  *   **Principle:** If the monument itself was erected as an instrument of the harm (e.g., to intimidate, or as a tribute from corruption beneficiaries), it must be removed. If it was erected to honor genuine achievement, it may be retained or relocated.
  *   **Fit:** Explains *Kettle* (Remove: Erected to intimidate) and *Drayton* (Remove: Erected by patronage beneficiaries) versus *Vale* (Retain: Erected for civic good), *Renn* (Relocate: Erected for medical good), and *Kessler* (Retain: Erected for endowment).
  *   **Prediction for Voss:** **Retain with Context.** The statue was erected in 1960 by the Hospital Board to honor surgical innovation. Unlike *Kettle* or *Drayton*, the statue was not itself an instrument of the harm (the experiments ended in 1955). Under this rule, the "origin integrity" allows retention, provided the record is corrected (like *Vale*).

  ***

  ### Recommendation

  **Verdict:** The Commission should recommend **Relocation** of the Voss statue to the city museum, accompanied by an exhibit on medical ethics and a memorial to the victims on the hospital grounds.

  **Reasons for Preference:**
  I prefer the **Site-Function Congruence Rule** as the primary driver for this decision, supported by the **Irreparable Expressive Cost Rule**.

  1.  **Institutional Endorsement:** The most critical factor in *Renn* was that a hospital entrance is a "place of healing." Placing a statue of a doctor who harmed patients at that specific threshold falsely suggests institutional continuity with those methods. A plaque cannot undo the spatial message of the entrance. Relocation resolves this incongruence without erasing Voss's medical contributions (distinguishing her from *Kettle*).
  2.  **Living Constituency:** The petitioners (disability advocates and descendants) mirror the "living constituency" concern in the enabling ordinance. While *Vale* suggests context is enough for historical harms, *Renn* establishes that when the harm is medical/physical and the site is medical, context alone is insufficient. Relocation acknowledges the harm to the living constituency while preserving the historical record of her innovations.
  3.  **Rejection of Origin Integrity:** While the *Monumental Intent Rule* suggests retention (since the statue wasn't an instrument of harm), this rule fails to account for the *ongoing* impact of the site. *Drayton* shows that even if a legacy is mixed, the "honorific residue" at a specific site (City Hall) can mandate removal. For Voss, the "honorific residue" at the Hospital Entrance is too potent to remain, even if the original intent was benign.

  **Closest Analog:**
  **Case 3: The Renn Statue.**
  Both cases involve medical professionals who made significant contributions (sanatorium/surgical technique) but violated medical ethics (eugenics/non-consensual experimentation). Both statues were located at hospital entrances. In *Renn*, the Commission voted to relocate to a museum to separate the historical value from the institutional endorsement. This precedent directly governs the Voss case.

  ***

  ### Underdetermination and Principles

  The record genuinely underdetermines the outcome between **Relocation** and **Removal**. While *Renn* suggests Relocation, *Kettle* suggests Removal when a living constituency is intimidated/harmed.

  *   **If the Commission chooses Removal:** It would be adopting the principle that **bodily autonomy violations constitute a higher expressive cost than ideological violations.** It would prioritize the *Irreparable Expressive Cost Rule* over historical preservation, arguing that for victims of medical abuse, the presence of the abuser's statue is itself a continuation of the trauma, regardless of museum contextualization.
  *   **If the Commission chooses Retention (with plaque/memorial):** It would be adopting the principle that **medical progress outweighs ethical retroactivity.** It would prioritize the *Monumental Intent Rule*, arguing that because the statue honors the *technique* that saved thousands, and the experiments are historical facts, the site remains appropriate for honoring the net benefit to public health.

  ***

  ### Discriminating Case

  To distinguish between the **Site-Function Congruence Rule** and the **Monumental Intent Rule**, the Commission should consider the following hypothetical case:

  **The Philanthropist's Park Statue:**
  *A statue of Julian Thorne, who built the city's largest public park, stands at the park's main gate. It was erected in 1950 by the City Council. It is later discovered that Thorne funded the park entirely through a Ponzi scheme that ruined thousands of local investors, and that the City Council knew this at the time of erection.*

  *   **Site-Function Rule Predicts:** **Retain.** The site (Park) matches the benefaction (Park). The location does not endorse the fraud.
  *   **Monumental Intent Rule Predicts:** **Remove.** The monument was erected by beneficiaries of the fraud (City Council) knowing the source of funds, making the statue an instrument of the corruption's legacy (similar to *Drayton*).

  A ruling on this case would clarify whether the *location's meaning* or the *statue's origin* is the decisive factor in Marlow's public memory ethics.
