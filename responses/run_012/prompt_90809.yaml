answer: |-
  1. You should reject premise (1), because it falsely assumes that mind-independent reality requires sharp boundaries rather than allowing for fuzzy evolutionary continua.
  2. It looked sound because it appeals to a classical metaphysical intuition that real kinds must be discrete and definable, like chemical elements, instead of historical processes.
  3. Keeping it forces you to pay the cost of treating extinction as merely a change in human bookkeeping rather than the material destruction of unique lineage.
  4. Dropping it costs you the comfort of precise counts, requiring you to admit that species numbers are approximate conventions tracking an underlying reality.
  5. Ultimately, the loss of biodiversity remains objective because the eradication of genetic diversity and ecological function happens regardless of where we draw the taxonomic lines.
