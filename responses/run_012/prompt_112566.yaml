          1.  **Counterfactual Necessity (Token Causation):** In this specific world, if you remove *this* token individual (Adolf Hitler), the specific event (the Holocaust as it happened) does not occur.
          2.  **Specific Intent/Will:** Only Hitler had the specific ideological drive to push for extermination rather than expulsion.
