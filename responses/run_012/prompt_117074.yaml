answer: |-
  1. Would it be pointless, or worse, for you alone to switch, so that the benefit of conforming depends on others' conforming?
     If yes, proceed to 2; if no, proceed to 2 (the distinction determines which leaves are reachable at node 3).

  2. Does it rest on an explicit agreement or an authority's decree rather than on self-sustaining expectation?
     If yes, terminate at **Not Convention (Habit/Dictated)**; if no, proceed to 3.

  3. Is the practice arbitrary with respect to the problem it solves, in the sense that another practice would have done the job equally well?
     If no, terminate at **Sanction-backed Rule** (note: this coincides with Bicchieri-style norms wherever the sanction is informal); if yes and answer to 1 was no, terminate at **Not Convention (Habit/Dictated)**; if yes and answer to 1 was yes, proceed to 4.

  4. Does what holds it in place include the expectation that others think one ought to and would blame one, or only the expectation that others will do it too?
     If normative (blame), terminate at **Bicchieri-style Norm** (cases: the tip, the interview tie, the queue); if empirical (expectation only), proceed to 5.

  5. Does the pattern require common knowledge—everyone knowing, and knowing that everyone knows—or is it sustained instead by precedent, imitation and local reinforcement?
     If common knowledge, terminate at **Lewis-style Analysis** (cases: the handshake, the meaning of a word, the escalator); if precedent/imitation, terminate at **Convention without Common Knowledge**.
