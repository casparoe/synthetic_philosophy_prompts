answer: |-
  Here is a precise formulation of the principle that captures your verdicts, followed by an analysis of its predictions and potential inconsistencies.

  ### The Principle: Lexical Threshold Negative Utilitarianism (LTNU)

  **Definitions:**
  1.  **Pain Intensity ($I$):** A scalar value representing the peak instantaneous intensity of a pain experience.
  2.  **Lexical Threshold ($T$):** A fixed value of pain intensity.
  3.  **Supra-threshold Pain:** Any pain instance where $I > T$.
  4.  **Sub-threshold Pain:** Any pain instance where $I \le T$.
  5.  **Net Value ($NV$):** The sum of all pleasure units minus the sum of all sub-threshold pain units in an outcome. (Supra-threshold pain is excluded from this calculation).

  **Decision Rule:**
  To determine whether Outcome $A$ is morally preferable to Outcome $B$:

  1.  **Lexical Veto Clause:** If $A$ contains any instance of supra-threshold pain and $B$ contains no instance of supra-threshold pain, then $B$ is strictly preferable to $A$, regardless of the Net Value of either outcome.
      *   *(Motivated by Verdict 1)*
  2.  **Supra-threshold Minimization Clause:** If both $A$ and $B$ contain supra-threshold pain, prefer the outcome with the lesser amount (duration $\times$ intensity) of supra-threshold pain. If equal, proceed to Clause 3.
      *   *(Motivated by the implication of Verdict 1 that agony is bad, not just veto-wielding)*
  3.  **Aggregative Commensurability Clause:** If neither outcome contains supra-threshold pain (or if supra-threshold pain is equal), prefer the outcome with the higher Net Value ($NV$).
      *   *(Motivated by Verdicts 2, 3, and 4)*

  ---

  ### Mapping Clauses to Your Verdicts

  *   **Verdict 1 (Agony Veto):** Captured by **Clause 1**. Because the burn agony exceeds $T$, no amount of pleasure (which only contributes to $NV$) can outweigh the presence of the supra-threshold pain.
  *   **Verdict 2 (Broken Toe Compensation):** Captured by **Clause 3**. The broken toe is below $T$. Therefore, it enters the $NV$ calculation. If the pleasure units exceed the pain units, the outcome is positive.
  *   **Verdict 3 (Million Toes):** Captured by **Clause 3**. Since the toe pain is sub-threshold, it aggregates. $1,000,000 \times \text{Toe Pain}$ will mathematically exceed $1 \times \text{Year Pleasure}$ (assuming the pleasure does not exceed the toe pain by a factor of one million), resulting in a negative $NV$.
  *   **Verdict 4 (Threshold Discontinuity):** Captured by the **Definition of $T$** combined with **Clauses 1 and 3**. If the agony is reduced to $T - \epsilon$, it moves from Clause 1 (Veto) to Clause 3 (Commensurability). Once in Clause 3, a sufficiently large $NV$ (enough ecstasy) can outweigh it.

  ---

  ### Predictions for Unmentioned Cases

  **Case A: One Supra-threshold Pain vs. One Billion Sub-threshold Pains**
  *   **Scenario:** One person suffers the "Agony" (just above $T$) vs. One billion people suffer the "Broken Toe" (just below $T$).
  *   **Prediction:** The theory dictates that preventing the **One Supra-threshold Pain** is strictly more important. The billion sub-threshold pains, no matter how numerous, cannot outweigh a single instance of supra-threshold pain because Clause 1 triggers a lexical veto.
  *   **Reasoning:** Clause 1 prioritizes the *quality* (intensity) of pain over the *quantity* of persons when the threshold is crossed.

  **Case B: Supra-threshold Pain (Barely Above) vs. Enormous Sub-threshold Pleasure**
  *   **Scenario:** One person suffers agony ($T + \epsilon$) for one minute vs. One billion people experience intense pleasure (below $T$) for a century.
  *   **Prediction:** The **Agony** vetoes the pleasure. The outcome with the agony is worse.
  *   **Reasoning:** Clause 1 states that *any* finite amount of pleasure is insufficient to compensate for supra-threshold pain. The magnitude of the pleasure is irrelevant once the veto is triggered.

  **Case C: Distributed Pleasure vs. Distributed Pain (Sub-threshold)**
  *   **Scenario:** 1 million people get broken toes vs. 1 million people get 1 year of pleasure each.
  *   **Prediction:** This depends on the ratio. If 1 year pleasure > 1 toe pain for an individual, then the total pleasure outweighs the total pain.
  *   **Reasoning:** Clause 3 relies on summation. It does not care about distribution, only the total sum.

  ---

  ### Honest Assessment: Inconsistencies and Risks

  While the principle above formally captures your four verdicts, there are significant philosophical tensions and potential inconsistencies you should be aware of.

  **1. The "Sharp Line" Problem (Verdict 4)**
  You explicitly accepted Verdict 4 (that a slight reduction in intensity allows compensation). This commits you to a **discontinuous value function**.
  *   **The Issue:** Metaphysically, pain intensity is likely vague. There is no precise neural firing rate that distinguishes "agony" from "very severe pain."
  *   **The Risk:** If $T$ is vague, the theory is indeterminate in borderline cases. If you insist $T$ is precise, the theory implies that a microscopic difference in physical intensity creates an infinite difference in moral status. Many philosophers find this "moral magic" implausible. If you find yourself hesitating on whether a specific pain is *exactly* at the threshold, this principle cannot guide you.

  **2. The Aggregation vs. Lexicality Conflict (Case A)**
  Your Verdict 3 affirms aggregation for sub-threshold pain (1 million toes > 1 pleasure). However, the Lexical Veto (Verdict 1) *denies* aggregation when comparing sub-threshold pain to supra-threshold pain.
  *   **The Inconsistency Risk:** Many people who accept Verdict 3 (aggregation matters) also intuitively feel that **1 Billion Broken Toes > 1 Hour of Agony**.
  *   **The Theory's Verdict:** This theory says **1 Hour of Agony > 1 Billion Broken Toes**.
  *   **Why:** Because the Agony triggers Clause 1, while the Toes fall under Clause 3.
  *   **Honest Check:** If your intuition is that inflicting a billion broken toes is *worse* than inflicting one hour of agony on one person, **this theory fails your verdicts**. You would need a "Total Pain Threshold" (where enough sub-threshold pain becomes lexical) in addition to the "Intensity Threshold."

  **3. The "One Person" Constraint in Verdict 3**
  In Verdict 3, you specified the pleasure is for *one person*.
  *   **The Issue:** Standard Utilitarianism (Clause 3) is indifferent to distribution. It would say 1 million toes are outweighed by 1 million years of pleasure distributed among the victims.
  *   **The Risk:** If you believe the pleasure *must* be distributed to the sufferers to count as compensation (a person-affecting view), then Clause 3 is insufficient. You would need a constraint that pleasure cannot compensate pain unless it is experienced by the same person (or a relevantly similar group). The current formulation allows "sacrificing" the million toe-sufferers for the sake of one pleasure-experiencer, provided the total pleasure sum is high enough (e.g., if the one person got 2 million years of pleasure).

  **4. Underdescription of "Intensity"**
  *   **The Issue:** Verdict 1 specifies "One hour of agony." Verdict 4 discusses reducing the agony.
  *   **The Risk:** Does the threshold $T$ apply to *peak instantaneous intensity* or *integrated suffering* (Intensity $\times$ Duration)?
      *   If $T$ is peak intensity: 1 second of agony vetoes everything.
      *   If $T$ is integrated: 100 years of "near-agony" might veto, but 1 second might not.
      *   Your verdicts suggest Peak Intensity (since duration is fixed at "one hour" in V1, but V4 focuses on reducing the agony "slightly," implying intensity). If you actually care about total duration, the principle needs adjustment.

  ### Conclusion
  The **LTNU** principle above is the most precise fit for your stated verdicts. However, it forces you to accept that **one person's severe agony is morally worse than any amount of sub-threshold suffering distributed across humanity** (Prediction Case A). If that conclusion violates your moral intuitions, your verdicts are inconsistent with a pure Lexical Threshold view, and you may need to adopt a **Sliding Scale** view where sub-threshold pains can aggregate to become lexical, or admit that Verdict 1 (the absolute veto) is too strong.
