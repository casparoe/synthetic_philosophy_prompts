answer: |-
  Here is the scenario you asked for. Imagine Sarah, a senior software engineer at a mid-sized firm. A junior colleague, Mike, is struggling badly with a critical module and is at risk of missing a deadline that would stall the whole team. Sarah has the expertise to fix it in an hour, but her job description doesn't mandate peer mentorship; she is only required to deliver her own work. She could legitimately ignore Mike, or give him some cursory advice, but the morally best option is to sit with him, walk him through the architecture, and ensure he understands it so he can finish the job himself. Here is the catch: Sarah finds deep personal fulfillment in mentoring. She was planning to spend that evening studying similar architecture for her own interest anyway, and she values the social interaction more than the solitude she would otherwise have. She bears no net sacrifice; in terms of her own welfare and preferences, she is better off or at least neutral compared to her alternatives. Yet, if you ask her or her colleagues afterward, nobody would say she was *required* to do it. They would call it generous, above and beyond, even though it cost her nothing she wasn't willing to pay.

  Now look at the tension this creates. The case makes three claims seem plausible simultaneously. First, the act is optimific; helping Mike is genuinely morally better than ignoring him or giving minimal help. Second, the act is non-obligatory; the intuition remains strong that Sarah had the right to decline, that nobody could blame her for walking away. Third, there is the maximizing principle that if an act is morally best and within your power, you ought to do it. You cannot hold all three without contradiction. If it is best, and ought implies best, then it is required. If it is not required, then either it isn't best or best doesn't imply ought. The case gives you the most reason to give up the second claim, the intuition that it wasn't required. I am decisive on this: if there is truly no net sacrifice, the act collapses into obligation. The intuition that Sarah is off the hook is a relic of assuming cost where there is none. We treat mentorship as optional because it is usually costly, but in this specific description where the cost is zero or negative, the moral demand expands to fill the gap. You cannot claim an act is supererogatory if the agent loses nothing by doing it; that is simply efficient morality.

  The single feature doing the work here is the alignment of self-interest with moral value. Usually, supererogation lives in the gap between what is good for the world and what is costly for the agent. By removing the cost, you remove the shelter that protects the act from becoming a duty. If you add a real sacrifice to the story—if Sarah has to miss her daughter's recital or work through painful exhaustion—the verdict flips immediately. Claim 2 becomes robust; it is genuinely not required because the demand is too high. The sacrifice creates the logical space for optionality. Without it, the "ought" swallows the act whole.

  Someone who thinks supererogation doesn't need any sacrifice at all would attack this verdict by arguing that you are conflating the grounds of obligation with the grounds of value. They would say that supererogation is defined by the nature of the act or the motive, not the ledger of costs. They might argue that Sarah's act is supererogatory because it stems from virtue or generosity, not duty, regardless of whether she enjoyed it. They would claim that making obligation track cost turns morality into a transactional economy where we are only forced to do good when it is cheap. However, this attack does not land. It fails because obligation is essentially about demandiness. If I can save a drowning child by getting my feet wet, I must. If I can save a career by doing something I love, I must. To say otherwise is to grant agents a moral license to withhold good simply because they enjoy providing it, which undermines the binding force of moral reasons. The case proves that without sacrifice, you don't have supererogation; you just have duty that feels nice.
