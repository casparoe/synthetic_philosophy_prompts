answer: |-
  ### Executive Summary
  Your colleague is identifying a vulnerability in the *logical structure* of your promise, not necessarily its practical execution. The paradox arises only if the kitchens know three things with certainty: (1) the inspection *will* happen, (2) it will happen *exactly once*, and (3) it must be *logically impossible* to predict. To preserve the deterrent value of surprise, you must break the chain of deduction that allows kitchens to rule out dates. You do this by introducing ambiguity into the count, the deadline, or your own binding commitment.

  ### 1. Policy Design: Windows vs. Randomization

  **Do not fix a narrow window.**
  Narrowing the inspection window (e.g., "Sometime in Q3") accelerates the backward induction problem. As the window closes, the probability of the inspection being "today" rises to 100%, destroying the surprise element on the final day. A year-long window maximizes the entropy, keeping the probability low enough for longer.

  **Randomization buys empirical unpredictability, not logical immunity.**
  *   **What it buys:** It prevents kitchens from using *inductive* reasoning based on your past behavior (e.g., "They always inspect in November"). It ensures there is no pattern to exploit.
  *   **What it does not buy:** It does not stop *deductive* reasoning (the paradox). Even if the date is chosen by a quantum random number generator, if a kitchen knows it is December 30th and the inspection hasn't happened, and they know it *must* happen once this year, they know it is coming tomorrow. Randomization cannot override logical necessity.

  **Recommendation:** Use true randomization for scheduling to prevent pattern recognition, but do not rely on it to solve the logical paradox. The solution lies in the policy constraints, not the selection algorithm.

  ### 2. Wording the Notice: Breaking the Deduction Chain

  The wording must prevent the kitchens from establishing the "common knowledge" required for the paradox to trigger.

  **Avoid "Exactly One."**
  This is the critical failure point. If you promise *exactly* one inspection, the final day of the year becomes predictable if no inspection has occurred.
  *   **Fix:** Promise **"at least one"** inspection.
  *   **Why:** If there could be two inspections, a kitchen on December 30th cannot know if an inspection tomorrow would be the *first* (surprise) or the *second* (expected). This breaks the backward induction chain immediately.

  **Avoid Guaranteeing "Surprise."**
  Do not promise that the inspection will be *unknowable*. Promise only that it will be *unannounced*.
  *   **Fix:** "We will not provide advance notice of the date."
  *   **Why:** Promising "surprise" creates a logical contract you might not be able to keep. Promising "no notice" is a procedural fact you can control. If a kitchen deduces the date, you haven't broken your word; you just failed to surprise them, which is not a violation of policy.

  **Maintain Administrative Discretion.**
  Do not word the notice as a binding contract that limits your agency.
  *   **Fix:** "It is our policy to conduct..." rather than "We guarantee..."
  *   **Why:** If kitchens believe you *might* cancel the inspection due to budget/staffing (even if you don't plan to), they cannot be 100% certain the inspection will occur. Uncertainty about the *occurrence* prevents certainty about the *timing*.

  ### 3. Deterrent Value and Audience Belief

  Once the notice is published, its power relies on the kitchens' risk assessment, not their logical prowess.

  **The Notice as a Probability Multiplier.**
  The notice should not aim to make the inspection *impossible* to predict, but to make the cost of prediction higher than the cost of compliance. If a kitchen tries to deduce the date, they must monitor your staffing, budget, and other inspections. If that effort is costly, they will simply comply year-round.

  **The "Rationality" Trap.**
  If kitchens believe you are perfectly rational and bound by the notice, they may conclude (via the paradox) that an inspection is impossible, leading to *less* compliance.
  *   **Mitigation:** You need a reputation for occasionally inspecting even when "predictable." If you inspect on the last day of the year, you violate the "surprise" condition but uphold the "inspection" condition. Prioritize the inspection over the surprise. A predictable inspection is still a deterrent; a cancelled inspection is not.

  ### 4. Generalization to Other Public Announcements

  This applies to tax audits, security screenings, or compliance reviews where the authority announces a future action meant to remain unknown until execution.

  **Universal Rules:**
  1.  **Never fix the count:** Always use "at least" rather than "exactly."
  2.  **Never fix the hard deadline:** Use rolling periods (e.g., "every 12 months" rather than "by Dec 31").
  3.  **Never promise epistemic states:** Promise procedural actions (no notice) rather than cognitive outcomes (surprise).
  4.  **Preserve Discretion:** Always retain the right to cancel or reschedule based on resource availability.

  ### 5. Mapping Advice to Paradox Resolutions

  Here is how the practical advice links to the philosophical resolutions of the paradox, flagging assumptions about rationality.

  | Practical Advice | Philosophical Resolution Supported | Assumption Flag |
  | :--- | :--- | :--- |
  | **Change "Exactly One" to "At Least One"** | **Modal Logic / Quantifier Shift.** The paradox relies on the uniqueness of the event. Removing uniqueness breaks the backward induction. | **None.** This works regardless of audience rationality. |
  | **Word as Policy ("It is our aim") not Contract ("We guarantee")** | **Epistemic Blind Spot.** The paradox requires the audience to *know* the announcement is true. If they only *believe* it (or know it might be false due to discretion), the deduction fails. | **None.** Reduces the knowledge status of the premise. |
  | **Inspect on the last day if necessary** | **Pragmatic / Performative.** The announcement is a warning, not a logical proposition. If the action happens, the warning was valid, even if the "surprise" failed. | **None.** Prioritizes real-world outcome over logical consistency. |
  | **Rely on Randomization to prevent pattern spotting** | **Bayesian / Probabilistic.** "Surprise" is treated as low probability, not zero knowledge. Randomization keeps probability flat. | **Bounded Rationality.** Assumes kitchens cannot compute complex probability distributions in real-time. |
  | **Avoid narrow time windows** | **Information Theory.** Reduces the information entropy available to the audience. | **Perfect Rationality.** Assumes a perfectly rational agent *would* deduce the date in a narrow window; a less rational one might not. |

  ### Final Recommendation for Your Regulator

  1.  **Rewrite the Notice:** Change "Exactly one unannounced inspection" to "At least one unannounced inspection." Change "You will not know when" to "We will not announce the date in advance."
  2.  **Run the Policy:** Schedule inspections randomly throughout the year. If you reach December with uninspected kitchens, inspect them, even if it is no longer a "surprise."
  3.  **Manage Expectations:** If a kitchen claims they knew it was coming, accept that. Your goal is compliance, not winning a logic puzzle. The paradox only undermines you if you prioritize the *surprise* over the *inspection*.

  By shifting the promise from a **logical guarantee of unpredictability** to a **procedural guarantee of no notice**, you render the paradox irrelevant to your operations while maintaining the deterrent effect.
