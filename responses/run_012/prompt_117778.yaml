prompt: |-
  I retired last year from a career in experimental physics and have spent the time since reading moral philosophy, in which I am very much a beginner. I should like you to build me a decision problem — one scenario, a paragraph or two, with the numbers made explicit — that does something the standard discussion does not: it shows the simulation hypothesis making a fanatic *less* rather than more willing to gamble everything on the far future.

  Set it up as a choice between a modest benefit that is certain and near at hand and a gamble on an astronomically large far-future payoff — the kind of choice in which an expected-value maximiser who refuses to discount tiny probabilities would always take the gamble. The point I want isolated is that the probability we are simulated and the degree to which our present actions determine the far future need not be independent. Arrange for the two to be correlated by a plausible feature of how simulations would be built or run, rather than by stipulation, and for the correlation to be strong enough that the undiscounted maximiser should now take the modest certain benefit. Constraints: no physics beyond the simulation hypothesis itself, no perfect predictors or exotic decision theory, and stakes of a sort a real person or institution might face — a research budget, a donation, a career.

  Then, after the scenario: state the two options and their numbers, and run the expected-value calculation twice, once assuming independence and once with the correlation in place, so that the difference is visible. Say which feature of the case is doing the work, and what becomes of the case if that feature is removed. Give the strongest reply a committed longtermist would make, and tell me whether the dampening rests on a contingent assumption about what simulators want or on something more robust. Finally, be candid about what the case cannot establish — in particular, whether it answers fanaticism or merely relocates it.

  Please write in British English, and keep the argument self-contained: I have no way of looking anything up, so no citations and no reading lists.
