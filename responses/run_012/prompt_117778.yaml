answer: |-
  **The Scenario**

  You are the director of a charitable foundation with a surplus budget of £50 million. You must allocate these funds immediately. Option A is to expand a proven malaria eradication programme in a specific region, which statistical models confirm will save exactly 10,000 lives over the next decade. Option B is to fund a high-risk theoretical project aimed at aligning superintelligent artificial intelligence. If successful, this project would secure the trajectory of civilisation, preventing existential catastrophe and allowing humanity to flourish for millions of years, saving an estimated $10^{20}$ future lives. However, the technical hurdle is immense; experts assign the project only a 1 in 1,000,000 ($10^{-6}$) chance of technical success.

  The standard longtermist argument treats the probability of technical success as independent of the nature of our reality. However, consider the computational architecture required for high-fidelity ancestor simulations. To prevent simulated processes from consuming excessive host resources or corrupting the base reality, such simulations are almost invariably 'sandboxed'—causally isolated from the host system. Data can flow in (to render the environment), but actions within the simulation cannot effect changes in the base reality's future. If we are in a simulation, our AI is simulated, and its safety protocols protect only a virtual future that terminates when the computation ends. Therefore, the probability that our actions determine the *actual* far future is contingent on us being in base reality. Given the potential density of simulated minds, let us assign a credence of $1 - 10^{-11}$ to the proposition that we are currently in a sandboxed simulation.

  ***

  **The Options and Numbers**

  *   **Option A (Certain):** Save 10,000 lives.
      *   Value: $10^4$ lives.
      *   Probability: $1$.
      *   **Expected Value (EV):** $10^4$.

  *   **Option B (Gamble):** Save $10^{20}$ lives.
      *   Value: $10^{20}$ lives.
      *   Technical Probability ($P_{\text{tech}}$): $10^{-6}$.
      *   Reality Probability ($P_{\text{real}}$): $10^{-11}$ (derived from simulation density).

  **Expected-Value Calculation 1: Assuming Independence**
  In the standard discussion, the possibility that we are simulated is treated as a background metaphysical curiosity that does not negate causal power. One assumes that even if simulated, our actions might propagate or that the simulation is not causally sealed. Thus, the probability of being real is ignored or assumed to be near 1 for the sake of the calculation.
  $$EV = P_{\text{tech}} \times \text{Value}$$
  $$EV = 10^{-6} \times 10^{20} = 10^{14}$$
  **Result:** $10^{14} \gg 10^4$. The rational agent takes the gamble.

  **Expected-Value Calculation 2: With Correlation (Causal Sandboxing)**
  Here, we acknowledge that causal power over the base future requires being in base reality. The probability of success is the conjunction of technical success *and* being in a reality where that success matters.
  $$EV = P_{\text{real}} \times P_{\text{tech}} \times \text{Value}$$
  $$EV = 10^{-11} \times 10^{-6} \times 10^{20} = 10^{3}$$
  **Result:** $10^3 < 10^4$. The rational agent takes the certain benefit.

  ***

  **Analysis**

  **The Working Feature**
  The work is done by **Causal Containment**. In standard decision problems, the probability of being simulated is treated as independent of the efficacy of our actions. Here, the architecture of the simulation (sandboxing for computational safety) creates a negative correlation between the likelihood of being simulated and the causal reach of our actions. As the probability of simulation rises, the expected causal power of the agent falls proportionately.

  **If the Feature is Removed**
  If we assume simulations are *not* causally isolated (e.g., they are designed to influence the base reality, or the simulated future is granted equal moral weight regardless of its ontological status), the $P_{\text{real}}$ term vanishes from the equation. We revert to Calculation 1, and the gamble becomes obligatory again. The dampening effect relies entirely on the premise that simulated futures do not count towards the *base* reality's astronomical value, or that they cease to exist upon simulation termination.

  **The Strongest Longtermist Reply**
  A committed longtermist would invoke **Simulation Realism**. They would argue that the moral value of a life does not depend on whether it is instantiated in base matter or simulated code. If the AI alignment succeeds within the simulation, it secures $10^{20}$ simulated lives. These lives are conscious and valuable, even if they do not influence the simulator's universe. Therefore, the $P_{\text{real}}$ term is irrelevant; one should maximise expected value within the local ontology, regardless of its substrate. On this view, the sandbox prevents influence on the *host*, but not on the *inhabitants* of the simulation.

  **Robustness of the Dampening**
  The dampening rests on a **contingent assumption** about simulator constraints and moral ontology. It assumes simulators prefer causal isolation (a computational safety norm) and that simulated lives do not hold equal weight to base lives (a metaphysical claim). It is not robust against a simulator who runs open simulations specifically to recruit help from sub-agents, nor against a moral framework that grants full weight to simulated consciousness.

  **Limitations: Relocating Fanaticism**
  Candidly, this case does not answer fanaticism; it **relocates** it. It removes the incentive to gamble on the far future *if* one accepts the causal containment premise. However, it introduces a new fanaticism: the gamble on whether we are real. If the value of the far future is truly infinite (or sufficiently large), even a tiny probability of being in base reality ($10^{-11}$) can still dominate modest certain benefits if the stake is high enough. Furthermore, if the longtermist adopts Simulation Realism, the original fanaticism returns unchanged. The argument successfully shows that the simulation hypothesis *can* dampen longtermist enthusiasm, but only by trading one uncertainty (technical success) for another (ontological status), without resolving the underlying structural drive to maximise expected value at any cost.
