  4.  **Analyzing Where the Mapping Holds (Strengths):**
      *   Finite resources *do* exist (housing, water, budget).
      *   Sudden influxes *can* strain systems (shock absorption).
      *   There *is* a need for governance/order (someone steering).
      *   Safety of the collective is a legitimate concern.

  5.  **Analyzing Where the Mapping Breaks (Weaknesses):**
      *   *Static vs. Dynamic:* Lifeboats are rigid metal/plastic. Nations are economies. Economies grow/shrink based on labor and innovation. More people can *expand* the boat.
      *   *Zero-Sum vs. Positive-Sum:* In a lifeboat, food/water is fixed. In a nation, workers create value.
      *   *Passivity:* Passengers sit. Citizens participate (tax, build, vote).
      *   *The Sea:* The sea is hostile to the boat. The global economy is interconnected; nations benefit from trade/movement.
      *   *Permanence:* A lifeboat ride is temporary until rescue. Citizenship is permanent integration.

  6.  **Tackling "Capacity" (Fact vs. Decision):**
      *   *Uncle's view:* Capacity is physical fact (displacement).
      *   *Reality:* Capacity is political/economic choice. We choose zoning laws, budget allocations, tax rates.
      *   *Impact on Conclusion:* If capacity is a decision, "strict borders" aren't seamanship; they're a choice of *how* to distribute resources. It shifts from "physics" to "politics." The conclusion (strict borders are necessary) weakens if the constraint is self-imposed.

  7.  **Tackling "Sea Law/Rescue" (The Uncle's Trap):**
      *   *Uncle's view:* Law says help, but implies "only if it doesn't sink us," proving limits exist.
      *   *Counter:* Maritime law (SOLAS, UNCLOS) places the *duty to rescue* above almost everything else. It acknowledges that preserving human life trumps the schedule or minor risk to the vessel.
      *   *Why it cuts against him:* It establishes a moral hierarchy where human need > sovereign convenience. It implies the "boat" exists to serve human life, not the other way around. Also, ships don't pick people up and leave them on deck forever; they take them to *port*. The nation is the port, not the lifeboat.

  8.  **Developing an Alternative Analogy:**
