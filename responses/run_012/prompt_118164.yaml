  2.  **Deconstruct the "Lifeboat Analogy" (Garrett Hardin's Lifeboat Ethics):**
      *   This is a classic philosophical trope (Garrett Hardin, 1974). It's useful to know the lineage but focus on the user's specific uncle's version.
      *   *Core premise:* Resources are finite; adding more people threatens everyone.

  3.  **Drafting the Correspondence Table:**
      *   *Boat:* The Nation-State.
      *   *Sea:* The Geopolitical/Economic Environment (or the state of nature/global instability).
      *   *Passengers:* Current Citizens.
      *   *Swimmers:* Immigrants/Refugees.
      *   *Capacity:* Economic/Social Infrastructure (Jobs, housing, welfare, social cohesion).
      *   *Captain:* The Government/Policy Makers.
      *   *Builder:* History/Founders/Constitution (or perhaps Geography).
