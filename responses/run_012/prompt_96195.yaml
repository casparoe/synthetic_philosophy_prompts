prompt: |-
  ok weird request. i keep getting into fights about pseudohistory with a friend and i've realized i don't actually have a principled view, just vibes, and i want you to fix that. so here are my verdicts on a pile of cases, and i want to know what principle -- or what small set of principles -- could generate the pattern, and where it cracks. (i'm being sloppy and using pseudohistory and psuedoscience for the same thing throughout. if that sloppiness is part of the problem, say so.)

  - Atlantis was a real advanced maritime civilization and Plato is preserving a garbled memory of it: pseudohistory, no question.
  - aliens helped build the pyramids: pseudohistory.
  - the Russian mathematician's thing, where basically all of ancient history was invented by Renaissance forgers and the same events turn up several times under different names, so ancient Rome and medieval Rome are the same Rome: pseudohistory. he had actual statistical arguments and got them into journals, which is what unsettles me about it.
  - Velikovsky-type stuff -- Venus got spat out of Jupiter as a comet a few thousand years ago, flew past us, and that's why every culture on earth has a flood-and-catastrophe myth: pseudohistory.
  - Wegener's continental drift as it stood around 1925: NOT pseudoscience, even though essentially every geologist rejected it, called it amateurish, and noted he was a weather guy, not a geologist. he was right, they were wrong, and it wasn't close.
  - the aquatic ape idea -- that a branch of our ancestors went through a coastal, semi-aquatic phase and that's where hairlessness and bipedalism come from: i want to say NOT pseudoscience. it's probably wrong, it explains too much with one cause, and anthropologists mostly ignore it. but Hardy and Morgan were reasoning from evidence in good faith, and calling it an umbrella hypothesis is a reason to reject a hypothesis, not to call it pseudoscience. though alot of anthropologists do call it pseudoscience, so maybe i'm the one who's wrong.
  - the claim that a comet or airburst hit North America around 12,900 years ago and triggered the Younger Dryas cold snap and the megafauna extinctions: this is the one i flip flop on. the original paper was in a real journal (PNAS i think), real geologists and astronomers work on it, they've kept at it for going on twenty years. but the same group also talks about a mainstream coverup, one of their papers got retracted for manipulated data, and a lot of the headline evidence has failed to replicate. i honestly don't know whether i want to call this pseudoscience.
  - Bernal's Black Athena -- the argument that ancient Greece took its civilization from Egypt and Phoenicia and that 19th century racism buried that: NOT pseudohistory, i think. it's bad scholarship and the political thesis is doing a lot of the lifting, but he's a real professor engaging with real evidence, and pseudohistory feels like a way of not having to argue with him. my friend says that's naive.
  - the guy with a materials-science PhD who says the pyramid blocks were poured like concrete rather than quarried: pseudohistory, and it bugs me that i say that, because he's credentialed, courteous, not a conspiracy guy, and publishing in real materials journals. it just happens to be a claim outside his field that every Egyptologist says is impossible.

  so the pattern isn't "wrong," it isn't "rejected by the experts" (drift), it isn't "outsider" (drift, aquatic ape, Black Athena), and it isn't "cries coverup" (the comet people do it and i'm unsure, the concrete guy doesn't and i still call his thing pseudohistory).

  the best i've got is: it's pseudohistory when the claim is built so that no observation could count against it, and every failed prediction gets read as proof that the establishment is hiding something. but that doesn't fit either, because (a) drift was near-unfalsifiable in the 20s for want of a mechanism, and that's not why it was wrong to dismiss it, and (b) some of the comet people have made real predictions and checked them, which is the opposite of what my principle says these people do.

  so: is there a principle that gets all of these, or close? i'm fine with a small set of criteria if each one is actually doing work and not just bolted on to save a verdict. state it precisely enough that i could apply it to a case i've never seen. tell me which of my verdicts it forces me to give up. and say what it predicts for two cases i haven't listed: (1) the idea that people reached the Americas by boat down the Pacific coast long before the ice-free corridor opened, which archaeologists thought was crank stuff in the 80s and mostly accept now; and (2) whatever case you think is the hardest test of your own principle. also please don't just tell me it's a family-resemblance concept and stop there -- if it's a cluster, tell me what the cluster is centered on and why that center and not another.
