answer: |-
  This is a genuinely hard philosophical problem. You are struggling because "pseudoscience" is often defined by *sociological* markers (who says it, where it's published) rather than *epistemic* markers (how the knowledge is constructed). Your intuition is correctly rejecting the sociological markers (Wegener was rejected; Davidovits is credentialed), but you need a sharper tool to cut the cases.

  First, the sloppiness: **Yes, conflating pseudohistory and pseudoscience is part of the problem.**
  *   **Pseudoscience** violates methodological norms of the natural sciences (reproducibility, physical laws).
  *   **Pseudohistory** violates methodological norms of historical inquiry (provenance, testimony, contextual coherence).
  *   *However*, they share a common structural sin. You can have a unified principle if you treat them both as **Epistemic Violations**.

  Here is the principle that generates your pattern, the verdict it forces you to change, and the predictions for your new cases.

  ### The Principle: Asymmetric Epistemic Standards (The "Immunization Test")

  A claim is pseudohistory/pseudoscience if it protects its core conclusion by applying **hyper-skepticism to negative evidence** and **hyper-credulity to positive evidence**, specifically by invoking **Epistemic Privilege**.

  This manifests in two specific moves:
  1.  **The Hierarchy Swap:** Claiming that Method A (e.g., statistics, chemistry, mythology) overrides the established evidence of Method B (e.g., archaeology, geology, documents) *without* explaining why Method B is failing in this specific instance, other than "Method B is wrong."
  2.  **The Corruption Escape:** When Method B produces negative evidence, the claim asserts that Method B is corrupted (by conspiracy, bias, or forgery) rather than accepting the evidence as a refutation.

  **Legitimate Controversy** accepts the validity of the opposing field's methods and tries to out-argue them within the shared web of evidence. **Pseudoscience** cuts the threads of the web that hold its conclusion in place.

  ---

  ### Applying the Principle to Your Verdicts

  Here is how this principle sorts your list. It aligns with almost all of your intuitions, but it forces one major change.

  1.  **Atlantis / Aliens:** **Pseudohistory.**
      *   *Why:* Hierarchy Swap. Myth/Visual awe overrides archaeological silence. No mechanism for why evidence is missing other than "it's lost."
  2.  **Fomenko (New Chronology):** **Pseudohistory.**
      *   *Why:* Hierarchy Swap. Statistical patterns in texts override physical artifacts, dendrochronology, and astronomy. The "corruption" is total (all history is forged).
  3.  **Velikovsky:** **Pseudoscience.**
      *   *Why:* Hierarchy Swap. Mythology overrides celestial mechanics.
  4.  **Wegener (1925):** **Not Pseudoscience.**
      *   *Why:* No Swap. He used geology/biology to argue for geology. No Escape. He admitted he lacked a mechanism and did not claim geologists were hiding it; he claimed they were *mistaken*. He invited refutation ("Find a mechanism that disproves the fit").
  5.  **Aquatic Ape:** **Not Pseudoscience.**
      *   *Why:* This is **Bad Science**, not Pseudo. It proposes a testable ecological niche. It doesn't claim anthropologists are *hiding* the water evidence; it claims they are *ignoring* it. It fails on predictive power, not epistemic integrity.
  6.  **Black Athena:** **Not Pseudohistory.**
      *   *Why:* Bernal claims **Bias**, not **Corruption**. There is a difference. Bias is a systemic lens (racism) that interprets evidence poorly; Corruption is the active forging/suppression of evidence. Bernal engaged with the philology and archaeology, arguing for a different weighting. He did not claim the artifacts were fake.
  7.  **Davidovits (Concrete Pyramids):** **Pseudohistory.**
      *   *Why:* Hierarchy Swap. He argues that because chemistry *allows* concrete, history *must* be concrete. He dismisses quarry marks, tool evidence, and textual records as irrelevant compared to chemical possibility. He is solving a chemical problem that doesn't exist while ignoring the historical problem that does.
  8.  **Younger Dryas Impact Hypothesis (YDIH):** **Pseudoscience.** (This is the verdict you must give up).
      *   *Why:* You noted the "mainstream coverup" claim and the retracted paper. This triggers the **Corruption Escape**. When independent groups failed to replicate the spherules/iridium, the hypothesis didn't die; it shifted (airburst vs. crater, "it burned up," "you looked in the wrong place"). Legitimate science treats failed replication as a crisis for the theory; YDIH treats it as a failure of the replicators. The presence of real journals (like *PNAS*) does not immunize a group from behaving pseudoscientifically when their core defense is "the establishment is suppressing us."

  **The Center of the Cluster:**
  The cluster is centered on **How the theory handles being wrong.**
  *   **Science/History:** "If X is found, I am wrong." (Wegener, Coastal Migration).
  *   **Pseudo:** "If X is found, X is fake/biased/misinterpreted." (Fomenko, YDIH, Aliens).

  ---

  ### Predictions for New Cases

  #### Case 1: Coastal Migration Theory (Americas)
  *   **The Claim:** People migrated down the Pacific coast by boat before the ice-free corridor opened.
  *   **The Evidence:** In the 1980s, almost no sites. Now, several (e.g., Calvert Island, footprints).
  *   **The Defense:** Proponents argued that early sites are now submerged due to sea-level rise.
  *   **Verdict:** **Legitimate Science.**
  *   **Why:** This looks like an excuse ("the evidence is underwater"), but it is a **physical constraint**, not an epistemic one. Sea levels *did* rise. They did not claim archaeologists were *hiding* the sites; they claimed the sites were *gone*. They made a prediction (look in specific submerged areas/coastal refugia) and eventually found evidence. They accepted the burden of proof and waited for the data to catch up. They did not invoke a coverup.

  #### Case 2: The Hard Test — The Solutrean Hypothesis
  *   **The Claim:** Clovis people in North America descended from Solutrean people in Europe (crossing the Atlantic ice edge), not Siberia.
  *   **The Evidence:** Superficial similarities in stone tool technology.
  *   **The Counter-Evidence:** Genetics (all ancient Native American DNA links to Siberia/Asia), no evidence of boats, massive time gap, oceanographic impossibility.
  *   **The Defense:** Proponents argue genetics degrade over time, boats leave no trace, and academic racism prevents the "European migration" idea from being accepted.
  *   **Verdict:** **Pseudohistory.**
  *   **Why:** This is the perfect stress test for your principle.
      1.  **Hierarchy Swap:** It prioritizes visual tool comparison (subjective) over ancient DNA (objective).
      2.  **Corruption Escape:** It invokes "academic racism" not as a critique of interpretation (like Bernal), but as a reason to dismiss genetic data entirely.
      3.  **Immunization:** "No boats found" -> "They were wood/rotted." "Genetics don't match" -> "DNA degraded." It explains away every negative finding without providing a positive mechanism that fits the web of evidence.

  ### Summary of the Fix

  Your "vibes" were actually detecting **Epistemic Integrity**.
  *   You forgive Wegener and the Aquatic Ape because they play by the rules of the game, even if they play poorly or lose.
  *   You reject Atlantis and Fomenko because they change the rules to ensure they can't lose.
  *   You were unsure on YDIH because it wears the uniform of science (journals, degrees) but fights like a conspiracy (coverups, moving goalposts). **The uniform doesn't matter; the fighting style does.**

  **Your Revised Rule of Thumb:**
  > "Is this claim willing to die? If I find X, will you admit you are wrong? Or will you tell me X is forged, hidden, or biased?"

  If the answer is the latter, it doesn't matter if they have a PhD or a paper in *PNAS*. It's pseudo.
