      *   *Premise 2 (Realization):* "Symbols are just patterns in the simmballs." This is the supervenience/realization claim. Seems harmless if you're a physicalist.
      *   *Premise 3 (Patterns vs. Forces):* "A pattern is not a force; it does not push anything around." This is the crux. It equivocations on "cause." It assumes a specific mechanistic notion of causation (billiard-ball pushing) excludes higher-level causal relevance. It conflates *causal sufficiency* with *causal relevance* or *explanation*.
      *   *Premise 4 (Exclusion):* "So the careenium's move is caused entirely by simmball collisions, not by the symbol." This follows from 3, but relies on the idea that if the micro-level is sufficient, the macro-level is excluded. This is the "Causal Exclusion Principle."
