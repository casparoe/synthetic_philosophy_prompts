prompt: |-
  You're a philosopher of mind and causation who is good at untangling level-of-description messes. Before you answer, brainstorm the possible places where an argument like this could equivocate. A friend in my reading group calls this the simmball exclusion argument, after the careenium thought experiment -- the setup where a system that manipulates symbols is implemented by a big swarm of tiny magnetic balls, the simmballs, jostling around on a board, so the symbols are patterns in the simmballs rather than extra particles. Here's the argument. (1) Every physical effect has a sufficient cause at the level of the fundamental particles. (2) The careenium's symbols -- its representations, its plans, its state of representing that the queen is en prise -- are just patterns in the simmballs. (3) A pattern is not a force; it does not push anything around. The simmballs push each other. (4) So the careenium's move is caused entirely by simmball collisions, not by the symbol. (5) If the symbol did not push anything, it did no causal work. (6) Our thoughts are like the careenium's symbols. (7) So our thoughts do no causal work. (8) But my intention to raise my arm seems to cause my arm to rise, and if that is an illusion then a lot goes with it. My friend says this is a reductio of the whole picture, because the same reasoning shows that a chess program's strategy, a gene's being a gene, a word's meaning, or a recession's being a recession never causes anything -- the particles did it all. I'd like to keep mental causation and the idea that higher-level patterns are real, but not at the price of magic, and I cant see where to push back. Which step do you reject, and what does rejecting it cost? If you think the argument is actually valid, tell me which premise is cheapest to give up and what else I lose. Answer in continuous prose, no headings, bullet points, bold text, or tables, just paragraphs like an email.
