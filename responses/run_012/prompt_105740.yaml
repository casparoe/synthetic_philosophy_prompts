answer: |-
  Dear friend,

  This is a beautifully formulated version of the causal exclusion problem, and it captures exactly why so many of us lose sleep over non-reductive physicalism. Your friend has constructed a trap that springs on the intuition that if the bottom level is doing all the pushing, the top level is just along for the ride. To untangle this, we have to look closely at where the argument assumes that causation must look like one billiard ball hitting another. The argument is valid only if we accept a very specific, and I believe flawed, ontology of causation. If we want to keep mental causation and the reality of higher-level patterns without invoking magic, we must reject the inference moving from premise three to premise five, and specifically reject premise five itself. The cost of this rejection is that we must abandon the notion that causal work is identical to energy transfer or mechanical pushing, and instead adopt a counterfactual or difference-making account of causation.

  The core equivocation lies in the definition of cause used in premises three and five. When the argument states that a pattern is not a force and does not push anything around, it is technically correct in the narrow sense that a pattern does not add energy to the system over and above the energy possessed by the simmballs. However, premise five makes the illicit leap that if something does not push, it does no causal work. This assumes that the only way to be a cause is to be a source of energy or momentum. But consider a mold into which molten metal is poured. The shape of the mold does not push the metal around; the gravity and fluid dynamics of the metal do that. Yet, the shape of the mold causally determines the shape of the final casting. If you changed the mold pattern, the casting would be different, even if the physical forces acting on the metal remained identical. The pattern acts as a constraint on the lower-level dynamics rather than a competitor force. By rejecting premise five, you acknowledge that causal work includes constraining, organizing, and determining outcomes through counterfactual dependence, not just shoving.

  If you reject premise five, you must also soften the exclusion claim in premise four. The argument assumes that because the simmball collisions are sufficient, the symbol is excluded. This treats the micro-level and macro-level as competitors for the same causal slot. But if the symbol is a pattern of simmballs, then the simmball collisions are the mechanism by which the symbol exerts its influence. They are not rivals; they are constitutive. To say the symbol did not cause the move because the balls did is like saying the digesting of food did not cause the nourishment because the chemical breakdown of proteins did. One is the high-level description of the very same process described at the low level. The cost here is that you have to accept that causation is level-relative. There is no single "complete" causal story that renders all other stories false. The physical story is complete regarding energy conservation, but it is often incomplete regarding explanation and prediction because it is too detailed to track the relevant variables.

  Your friend's reductio regarding genes, recessions, and chess strategies actually supports rejecting premise five rather than validating the argument. If you accept the argument as sound, you indeed have to say that genes do not cause traits and recessions do not cause unemployment, which is absurd for any scientific practice outside of fundamental physics. We know that manipulating the gene changes the trait, and manipulating interest rates changes unemployment. These are causal relations. If the simmball argument proves these are illusions, then the argument proves too much. It shows that the definition of causation being used is too narrow to capture the causal relations we actually observe and rely upon in science and daily life. By keeping the difference-making account, you save the reality of genes and recessions alongside thoughts. The particles still obey physics, but the higher-level patterns are what make the difference to the higher-level outcomes.

  The price you pay for this solution is that you must give up the dream of a unified theory of causation where physics gets the final say on what causes what. You have to accept a form of causal pluralism. You lose the comforting idea that if we knew the position and momentum of every simmball, we would have the only true causal description of the Careenium. In fact, knowing every simmball position might make it impossible to see the causal structure of the symbols, much like knowing the voltage of every transistor in a computer makes it hard to see the logic of the software. You also have to be comfortable with the idea that higher-level properties are real without being extra substances. They are real patterns, as Dennett might say, and their causal power lies in their stability and their counterfactual dependencies, not in their ability to violate physical closure.

  So, to answer your question directly, I reject premise five, and with it the mechanistic conception of causation lurking in premise three. This saves mental causation because my intention to raise my arm is a high-level pattern of neural activity that constrains the lower-level firing such that, had I not intended to raise my arm, the arm would not have risen. The physical particles still do the pushing, but the pattern does the determining. You lose the simplicity of a purely mechanistic worldview, but you gain a world where thoughts, genes, and economies are real drivers of change rather than epiphenomenal shadows. This seems a fair trade to avoid the absurdity of a universe where nothing matters except the jostling of atoms.

  Warmly,

  Your Philosopher Friend
