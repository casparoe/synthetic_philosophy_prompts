      *   **Task:** Disambiguate the slogan into a numbered menu of distinct claims (trivial to radical). Evaluate each claim (True/False/Contentious), check if it licenses the drawn conclusions, address specific puzzles (two legs, fraction of what, restricted ranges, individual causation, intervention), and provide a verdict/commitment on each. Finally, diagnose the group's usage vs. what was needed.
      *   **Tone:** Precise, analytical, committed (not neutral), authoritative but nuanced.

  2.  **Deconstruct the Slogan:** "Heritability is a property of populations, not individuals."
      *   *Core Meaning:* $h^2$ is a statistic derived from variance components in a specific group at a specific time.
      *   *Misuses:* Inferring individual causation, inferring immutability, inferring irrelevance to policy.
      *   *Valid Uses:* Context-dependence, variance decomposition limits.

  3.  **Drafting the Menu of Claims (Trivial to Radical):**

      *   *Claim 1 (The Definition):* Heritability is defined as a ratio of variances ($V_G / V_P$) within a specific population.
          *   Status: True/Trivial.
          *   Implication: It changes if the population changes.
      *   *Claim 2 (The Individual Attribution):* You cannot partition an *individual's* phenotype into % gene and % environment using the population $h^2$.
          *   Status: True.
          *   Implication: You can't say "80% of *my* height is genetic."
      *   *Claim 3 (The Causal Silence):* Heritability tells us nothing about the *causal mechanisms* operating within an individual.
          *   Status: Contentious/False (too strong). It constrains causal models but doesn't specify mechanisms.
          *   Implication: High $h^2$ doesn't mean genes *cause* the trait in a direct way distinct from environment.
      *   *Claim 4 (The Intervention Barrier):* High heritability implies environmental interventions won't work.
          *   Status: False (The "Hereditarian Fallacy").
          *   Implication: PKU example.
      *   *Claim 5 (The Fixedness Claim):* High heritability means the trait is developmentally fixed/unchangeable.
          *   Status: False.
          *   Implication: Height is highly heritable but changed with nutrition.
      *   *Claim 6 (The Irrelevance Claim):* Heritability is *only* about populations and has *no* bearing on individuals whatsoever (prediction, risk, etc.).
          *   Status: False.
          *   Implication: Polygenic scores use population stats to predict individual outcomes.

  4.  **Addressing Specific Puzzles:**
      *   *Two Legs:* High genetic determination (developmental stability), zero heritability (no variance in population). Distinguish *developmental cause* from *variance cause*.
      *   *Fraction of What:* Fraction of *phenotypic variance* ($V_P$), not the trait itself.
      *   *Restricted Range:* If $V_E \to 0$, $h^2 \to 1$. If $V_G \to 0$, $h^2 \to 0$.
      *   *Individual Difference:* Can we explain why Alice is taller than Bob? Yes, partly via genetics, but $h^2$ doesn't give the exact split for that pair.
      *   *Intervention:* $h^2$ describes current variance, not response to change (GxE interaction matters).

  5.  **Evaluating and Committing (The "Verdict"):**
      *   I need to take a stance. The slogan is technically true (Claim 1 & 2) but often weaponized to support false claims (Claim 4, 5, 6).
      *   *Philosophical Stance:* Variance decomposition is real but limited. It doesn't dissolve individual causation, but it doesn't quantify it directly either.
      *   *Strongest Objection:* Some argue that if $h^2$ is high, the *mechanism* is likely internal/biological. I need to counter this carefully (height example).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that the slogan is a "stopper" because it conflates distinct logical levels.
      *   **The Menu (1-6):**
          *   Statement of claim.
