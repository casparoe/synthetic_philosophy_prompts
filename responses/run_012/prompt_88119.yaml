answer: |-
  This slogan is indeed a conversation-stopper, but you are right to suspect it is doing too much heavy lifting. It conflates a mathematical definition with a metaphysical claim about causation and a policy claim about intervention. In your reading group, the psychologists are likely using it to defend the validity of their models against reductionist critiques, while the philosophers are often using it to block inferences about individual essence or social policy. Both sides are partially right, but they are talking past each other.

  Here is the disambiguation you requested, ordered from the definitional triviality to the radical (and usually false) implications.

  ### 1. The Variance Claim
  **Statement:** Heritability ($h^2$) is defined as the proportion of *phenotypic variance* in a specific population at a specific time that is attributable to genetic variance ($V_G / V_P$).
  **Verdict:** **True (Trivial).**
  **Does it license the conclusion?** It licenses the claim that the number changes if the population changes. It does *not* license claims about individuals or interventions.
  **Analysis:** This is the mathematical definition. If you equalize the environment ($V_E \to 0$), heritability goes to 1.0, even if the trait is environmentally sensitive. If you clone everyone ($V_G \to 0$), heritability goes to 0.0, even if the trait is biologically complex.
  **The "Two Legs" Puzzle:** This explains why having two legs has $h^2 \approx 0$. There is virtually no genetic variance for leg number in humans (almost everyone has the genes for two legs), so $V_G$ is near zero. Yet, the trait is genetically *determined* in the developmental sense. This claim forces us to distinguish between **variance explanation** (statistics) and **developmental cause** (mechanism). Heritability measures the former, not the latter.

  ### 2. The Attribution Claim
  **Statement:** You cannot use the population heritability coefficient to partition the cause of a *single individual's* trait value (e.g., "80% of John's height is due to genes").
  **Verdict:** **True.**
  **Does it license the conclusion?** It licenses the claim that the estimate says nothing about the *proportional cause* within a person. It does *not* license the claim that genes played no role for John.
  **Analysis:** Variance is a group property; causation is an individual property. For an individual, genes and environment interact to produce the phenotype; they are not additive ingredients you can separate post-hoc. If John is tall, it is 100% due to his genes *and* 100% due to his environment in the sense that removing either would change the outcome.
  **Nuance:** This does not mean heritability is irrelevant to the individual. It informs the *probability* that a difference between John and Jane is genetic, but it does not quantify the *magnitude* of the cause in John.

  ### 3. The Mechanism Claim
  **Statement:** A high heritability estimate implies that the trait is caused by "internal" biological mechanisms rather than "external" environmental ones.
  **Verdict:** **False (but commonly believed).**
  **Does it license the conclusion?** No. It is often used to suggest the trait is "inborn," but this is a non-sequitur.
  **Analysis:** This is where the slogan is most often weaponized to suggest "biological essentialism." High heritability only means genetic *differences* track phenotypic *differences* in the current environment. It says nothing about the mechanism.
  **Example:** Phenylketonuria (PKU) is a genetic disorder causing intellectual disability. In a population with standard diets, the variance in disability is highly heritable (it tracks the genetic mutation). However, the *mechanism* is entirely environmental (presence of phenylalanine). Remove the environmental input (dietary intervention), and the genetic effect vanishes. High $h^2$ did not reveal an immutable biological destiny; it revealed a genetic sensitivity to a ubiquitous environmental factor.

  ### 4. The Intervention Claim
  **Statement:** Because heritability is a population statistic, it predicts nothing about the efficacy of an environmental intervention to change the trait.
  **Verdict:** **True (mostly).**
  **Does it license the conclusion?** Yes, it licenses skepticism about arguments that "high heritability means intervention is futile."
  **Analysis:** This is the most important point for policy. Heritability describes the *status quo* variance. It does not describe the *slope* of the reaction norm (how the phenotype changes when the environment changes).
  **The "Fixedness" Puzzle:** Your group members who argue that high heritability shows differences are "fixed" are committing the **Hereditarian Fallacy**. Height is highly heritable ($h^2 > 0.8$) in developed nations. Yet, average height has increased dramatically over the last century due to nutrition. The *differences between people* within a generation are largely genetic, but the *average level* of the trait is highly plastic. High $h^2$ is compatible with massive environmental malleability.

  ### 5. The Irrelevance Claim
  **Statement:** Because heritability is not about individuals, it is irrelevant to individual prediction, risk assessment, or medicine.
  **Verdict:** **False.**
  **Does it license the conclusion?** No. This is an overcorrection.
  **Analysis:** Just because a statistic is population-level doesn't mean it doesn't apply to individuals. Mortality rates are population statistics, but they inform your life insurance premium. Similarly, if $h^2$ is high, knowing an individual's genotype (or family history) is a strong predictor of their phenotype, even if we can't partition the cause. Polygenic scores rely entirely on population heritability to make individual predictions. To say $h^2$ is "only about populations" in a way that makes it useless for individuals is to misunderstand how statistical prediction works.

  ### 6. The Causal Silence Claim (The Radical Reading)
  **Statement:** Heritability estimates tell us nothing about the causal structure of the trait, only about the covariance structure of the population.
  **Verdict:** **Contentious (but I defend it as True).**
  **Does it license the conclusion?** It licenses the claim that you cannot infer *causal direction* or *modularity* from $h^2$ alone.
  **Analysis:** This is the strongest philosophical reading. A high $h^2$ is consistent with genes causing the environment (gene-environment correlation), with environments causing gene expression (epigenetics), or with direct biological causation. The statistic is "causally neutral." It tells you that genetic relatedness predicts phenotypic similarity, but not *how*.
  **Strongest Objection:** Psychologists will argue that if $h^2$ is high, it constrains causal models. You cannot build a model where environment is the sole driver if $h^2$ is 0.6. This is correct, but it is a *constraint*, not a *specification*. The slogan is often used to imply $h^2$ is causally *empty*. It is not empty; it is underdetermined.

  ---

  ### Diagnosis of Your Reading Group

  **Which reading do they usually have in mind?**
  When the philosophers say it, they usually mean **Claim 2 (Attribution)** or **Claim 4 (Intervention)**. They want to block the inference that "heritable = unchangeable" or "heritable = intrinsic essence." They are worried about reification.
  When the psychologists say it, they usually mean **Claim 1 (Variance)**. They want to protect their models from the critique that they are "ignoring the environment." They are asserting technical precision.

  **Which reading does the argument actually need?**
  In almost every instance where this slogan stops conversation in a behavior genetics context, the argument actually needs **Claim 4 (Intervention)** or **Claim 3 (Mechanism)** to be addressed directly, but the slogan is being used to bypass the work.
  *   If the question is "Should we fund this intervention?", **Claim 4** is the relevant truth: High $h^2$ does not preclude intervention success.
  *   If the question is "Is this trait 'biological'?", **Claim 3** is the relevant truth: High $h^2$ does not prove biological modularity.

  **My Verdict on the Slogan:**
  The slogan "Heritability is a property of populations, not individuals" is **technically true but pragmatically misleading.**
  It is true in the sense of Claim 1 and 2. However, it is routinely deployed as a "Get Out of Jail Free" card to imply Claim 5 (Irrelevance) or to dismiss the reality of genetic influence on individual differences.

  **Where the matter is contested:**
  The most contentious point is **Claim 6 (Causal Silence)**. Some philosophers of science (e.g., proponents of "causal interpretation of variance components") argue that under specific assumptions (no GxE, additive effects), $h^2$ *does* estimate the proportion of causal influence.
  **My Position:** I side with the "Causal Silence" view. Variance decomposition is a statistical accounting trick, not a causal dissection. The strongest objection to my view is that in controlled animal models, variance components *do* map neatly onto causal manipulations. However, in human behavioral genetics, where "environment" is unmeasured and correlated with genotype, the mapping breaks down. To treat $h^2$ as a causal percentage in humans is to assume the model is true rather than testing it.

  **Final Advice for the Group:**
  Ban the slogan. It is a thought-terminating cliché. Replace it with the specific question at hand:
  1.  Are we asking about **variance** in this group? (Use Claim 1).
  2.  Are we asking about **development** in this person? (Use Claim 2).
  3.  Are we asking about **policy**? (Use Claim 4).

  If someone deploys the slogan, ask them: "Are you saying the number changes if the population changes (True), or are you saying we can't use genetics to predict individual outcomes (False), or that we can't change the trait via environment (False)?" Force them to pick a claim from the menu. You will find the argument becomes productive immediately.
