answer: |-
  ### Restatement in ML Vocabulary

  **Liberal Neutrality:**
  The system's objective function $\mathcal{L}(\theta)$ must not contain terms that explicitly penalize or reward outputs based on the *content* of any specific stakeholder's value function $V_i$, except where $V_i$ violates hard safety constraints (rights). The optimizer should treat all valid value vectors as orthogonal basis vectors in the loss landscape. Ideally, the aggregation mechanism $\mathcal{A}$ should be invariant to permutations of stakeholder identities and should not impose a specific curvature on the Pareto frontier that privileges one trade-off structure (e.g., utilitarian sum vs. prioritarian max-min) over another. The system provides the feasible set $\Theta$ (the "basic structure") but does not select the target point on the frontier based on a designer-defined conception of the good.

  **The Objection (Impossibility/Perfectionism):**
  The aggregation mechanism $\mathcal{A}$ itself encodes a specific value judgment. Choosing Nash Social Welfare over Utilitarian Sum changes the geometry of the loss landscape; it implicitly assigns higher weight to reducing loss for groups with lower current utility. This is not a neutral operation; it is a specific regularization strategy. Furthermore, the definition of the stakeholder groups (the data distributions $D_i$) and the feature space itself embeds ontological commitments. There is no "null" aggregator. By selecting *any* point on the Pareto frontier via a specific rule, you are optimizing for a meta-value (e.g., "balance" or "efficiency"), which violates the neutrality constraint. Neutrality is not a baseline; it is a specific, contestable objective.

  ### Residue Report

  **What Translates Cleanly:**
  *   **Constraints as Rights:** Hard constraints on the feasible set $\Theta$ map well to deontological constraints (rights) that limit the pursuit of the good.
  *   **Pareto Frontier:** The set of non-dominated solutions maps cleanly to the range of policy options that do not wastefully harm any group.
  *   **Aggregation as Value:** The choice of loss aggregation (sum, product, max) maps directly to competing ethical frameworks (utilitarianism, prioritarianism).

  **What Translates with Distortion:**
  *   **Neutrality vs. Invariance:** Philosophical neutrality is about *justification* (why we chose this rule), whereas ML invariance is about *output stability* (the model doesn't change when inputs change). You can have a model that is output-invariant but justified by a non-neutral reason, or vice versa.
  *   **Conception of the Good:** In ML, this becomes a loss function. But a loss function is operational and measurable; a conception of the good is often qualitative, contested, and not fully reducible to a scalar error signal.

  **What Has No Counterpart:**
  *   **Legitimacy/Justification:** ML describes *what* the model optimizes. It cannot capture *why* that optimizer is legitimate to the stakeholders. The "authority" of the loss function is outside the loss function.
  *   **The "Status Quo" Bias:** In ML, the initialization $\theta_0$ and the data distribution $D$ determine the baseline. In philosophy, neutrality is often criticized for embedding the status quo as the "neutral" baseline. ML treats the baseline as empirical fact, not a political choice.

  **Neutrality as a Constraint:**
  Representing neutrality as a constraint $C(\theta) = 0$ fails. To enforce $C$, you must define a metric for "neutrality." Defining that metric requires selecting a value standpoint (e.g., "neutrality means equal error rates" vs. "neutrality means equal opportunity"). Therefore, constraining for neutrality quietly assumes a specific conception of the good (the value of neutrality itself) and imposes it lexically over other values. It is not a meta-framework; it is just another objective.

