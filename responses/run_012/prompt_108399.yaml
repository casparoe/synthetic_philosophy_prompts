answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I have the distinct honor of being the friend who knew [Groom] before the login screen. I knew him when his biggest graphical interface was a spreadsheet, and his primary party member was a golden retriever named Buster.

  Looking around this room, I see a fascinating map. On one side, we have the family and the old friends. We know [Groom] as the guy who burns toast and tells bad dad jokes. On the other side, we have the guild, the party, the comrades-in-arms. You know [Groom] and [Bride] as the tanks who held the line, the healers who kept everyone alive, the strategists who conquered continents that don't exist on any map I own.

  I know there's a question hanging in the air. I know this because [Bride's] Grandmother, [Grandma's Name], asked me about it earlier. She looked at me, kind and sharp as ever, and said, "I just don't see how you can truly love someone you met on a computer."

  I told her then, and I'll say it now: She is right to ask that.

  She is right because a screen is cold. A keyboard is not a hand. A voice over a headset lacks the breath of the person speaking. If love were only about physical proximity, if it were only about sharing a physical room, then this story would be a trick. And [Grandma's Name] is too wise to be fooled by tricks.

  But here is what I have learned, watching my friend from the shore while he sailed those digital seas.

  For the first four years, [Groom] and [Bride] never saw each other's faces. They saw avatars. Pixels. But I watched [Groom] during those years. I watched him come alive. I watched him stay up until 3:00 AM not because he was avoiding the world, but because he was building one. He wasn't just playing; he was showing up.

  There is a specific kind of intimacy that comes from relying on someone when the stakes feel high, even if the battlefield is imaginary. When you are tired, when you are frustrated, when you have failed a task ten times and the only thing keeping you from quitting is the person on the other end of the line saying, "We can try one more time, I've got you"—that is not fake. That is the raw material of marriage.

  To the family side of the room: I know the jokes sound like a different language. You hear about "wiping" and "grinding" and "raids." It sounds like child's play. But to the friends on the other side: you know that a raid is just a problem too big for one person to solve. You know that "grinding" is just the unglamorous work of showing up every day when the novelty has worn off.

  [Groom] and [Bride] didn't fall in love with the game. They fell in love with who they were when they were together inside it. They fell in love with the consistency. The avatar was just the door. The person walking through it was real.

  I remember a night, about three years ago. [Groom] called me. He sounded hollow. He told me he had logged off for the last time in a place they used to frequent. He said the silence in his room was louder than it had ever been. He missed a place he couldn't drive to. He missed a home made of code.

  And I realized then that geography is not the only thing that makes a place real. We think of "home" as bricks and mortar. But home is actually the place where you are known. Where you are expected. Where, if you don't show up, someone notices you are gone.

  [Groom] and [Bride] built a home in a world without gravity. They proved that love doesn't care about the medium. It cares about the message. It cares about the voice that says, "I am here."

  So, [Grandma's Name], you were right to be skeptical. The computer is just a machine. But the heart that beat through it? That was flesh and blood then, and it is flesh and blood now.

  [Groom] once told me that you can't miss a place that isn't real. But I watched him miss it. I watched him ache for it. And if you can be homesick for it, then it must be real.

  To [Groom] and [Bride]. May your connection never lag. May your health bars always be full. And may you always, always find your way home to each other, no matter what world you are logging into.

  To the couple.
