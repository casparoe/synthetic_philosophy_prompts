      *   *The Groom's Change:* I saw him change. He became better, kinder, more alive *through* the screen.
      *   *The "Homesick" Concept:* Build towards this. A place isn't bricks. It's where you are known.
      *   *Ending:* Wish them well.

  5.  **Refining the Tone:**
