answer: |-
  # The Periodisation Decision Tree

  This tree is designed to stop you from arguing past one another. Usually, this debate collapses into 'Realism vs. Constructionism' within two minutes. That is unhelpful. You can be a realist about periods but an anti-realist about boundaries; you can think the terms are false but useful; you can think the 'Scientific Revolution' happened but the 'Renaissance' did not.

  Follow the questions in order. Answer based on your intuition about history, not on which famous historian you want to sound like. Mark your path, then find your position at the leaf.

  ### The Tree

  **Q1. If you proved the 'Renaissance' never happened, would the 'Scientific Revolution' collapse with it, or could it still stand on its own?**
  *   **A.** They stand or fall together; they describe the same shift. *(Go to Q2)*
  *   **B.** The 'Scientific Revolution' is different; it could happen without the 'Renaissance'. *(Go to Q7)*

  **Q2. Could a historian use these same three terms to organise the history of Ming China or the Ottoman Empire meaningfully?**
  *   **A.** Yes, these are shifts in human cognition, not just European culture. *(Go to Leaf 1)*
  *   **B.** No, these terms are specific to the European experience. *(Go to Q3)*

  **Q3. If we scrubbed all textbooks from existence, would people in 1400 and people in 1600 still seem to live in fundamentally different worlds?**
  *   **A.** Yes, the material and intellectual differences are objective facts. *(Go to Q4)*
  *   **B.** No, the differences are exaggerated by later historians telling a story. *(Go to Q5)*

  **Q4. Is the transition between these periods more like a cliff-edge or a sloping hill?**
  *   **A.** A cliff-edge; there are moments where things break. *(Go to Leaf 2)*
  *   **B.** A sloping hill; the change is real but continuous. *(Go to Leaf 3)*

  **Q5. Is the main value of these terms that they tell us *when* things changed (dates), or that they tell us *what* changed (themes)?**
  *   **A.** We need the dates/boundaries to make sense of the causality. *(Go to Leaf 4)*
  *   **B.** The 'vibe' or theme is real, but specific dates are nonsense. *(Go to Leaf 5)*

  **Q6. If a term is historically inaccurate but helps students organise their revision, is it ethical to keep teaching it?**
  *   **A.** Yes, utility trumps accuracy in introductory teaching. *(Go to Leaf 6)*
  *   **B.** No, false frameworks actively mislead future research. *(Go to Q6b)*

  **Q6b. Should we replace these terms with new ones, or stop periodising entirely?**
  *   **A.** Replace them with better, less ideological terms. *(Go to Leaf 7)*
  *   **B.** Stop using grand period labels altogether. *(Go to Leaf 8)*

  **Q7. What makes science different from art or politics in this period?**
  *   **A.** Science follows its own internal logic, independent of culture. *(Go to Leaf 9)*
  *   **B.** Culture shifted, and science was just the most visible part of it. *(Go to Leaf 10)*

  ---

  ### The Leaves (Positions)

  **Leaf 1: The Global Modernist**
  *   **Position:** Universal Realist.
  *   **Awkward Commitment:** Must explain why Chinese and Islamic histories look nothing like the European timeline if the cognitive shift was universal.

  **Leaf 2: The Punctuated Realist**
  *   **Position:** Eurocentric Realist (Lumpy Change).
  *   **Awkward Commitment:** Must defend specific 'revolutionary' dates against evidence of continuity.

  **Leaf 3: The Gradualist Realist**
  *   **Position:** Eurocentric Realist (Smooth Change).
  *   **Awkward Commitment:** Must admit the word 'Revolution' is a lie, even if the change was real.

  **Leaf 4: The Structuralist**
  *   **Position:** Boundary Realist.
  *   **Awkward Commitment:** Defends arbitrary dates (e.g., 1453, 1492) as necessary fictions for causality to work.

  **Leaf 5: The Fuzzy Periodist**
  *   **Position:** Period Realist / Boundary Anti-Realist.
  *   **Awkward Commitment:** Makes exam marking a nightmare because no two events can be firmly dated to a period.

  **Leaf 6: The Pragmatic Instrumentalist**
  *   **Position:** Constructionist (Useful Fictions).
  *   **Awkward Commitment:** Teaches known falsehoods for administrative convenience.

  **Leaf 7: The Ideological Critic**
  *   **Position:** Constructionist (Harmful Myths).
  *   **Awkward Commitment:** Must propose a replacement vocabulary that isn't also ideologically loaded.

  **Leaf 8: The Hard Abolitionist**
  *   **Position:** Anti-Periodist.
  *   **Awkward Commitment:** Leaves students with no chronological scaffolding at all.

  **Leaf 9: The Methodological Exceptionalist**
  *   **Position:** Selective Realist (Science Only).
  *   **Awkward Commitment:** Implies science develops in a vacuum, untouched by the 'fake' Renaissance around it.

  **Leaf 10: The Humanist Exceptionalist**
  *   **Position:** Selective Realist (Culture Only).
  *   **Awkward Commitment:** Must explain why science didn't change if the surrounding culture did.

  ---

  ### The Empty Spaces (Incoherent or Unoccupied)

  There are logical combinations that nobody occupies, usually because they are self-contradictory or historically untenable.

  **1. The Universal Constructionist**
  *   **The Combo:** You believe the terms apply to the whole world (Q2A) but are also purely invented myths (Q3B).
  *   **Why it's empty:** It implies a global conspiracy of historians across all cultures to invent the same false timeline. It is logically possible but historically paranoid.

  **2. The Gradualist Revolutionary**
  *   **The Combo:** You believe the change was perfectly smooth with no breaks (Q4B) but insist the term 'Revolution' is accurate (Leaf 2 path).
  *   **Why it's empty:** It is an oxymoron. You cannot claim a 'Revolution' while arguing nothing revolutionary happened. This is the most common slip-up in essays; avoid it.

  **3. The Ethical Instrumentalist**
  *   **The Combo:** You believe the terms are harmful ideological impositions (Q6B) but should be kept for teaching utility (Q6A).
  *   **Why it's empty:** Most people cannot sustain the cognitive dissonance of teaching something they believe is actively harmful. You usually slide into either the Pragmatic Instrumentalist (it's not *that* harmful) or the Ideological Critic (we must change it).

  ### How to use this in the seminar
  1.  **Hand out the tree.** Give them five minutes to trace their own path silently.
  2.  **Group by Leaf.** Ask everyone to stand by the number of their leaf.
  3.  **Force the Cross-Talk.** Put Leaf 3 (Gradualist Realist) next to Leaf 2 (Punctuated Realist). They both think the change was *real*, but they disagree on the *shape*. This stops them from arguing about whether the change happened at all.
  4.  **Trap the Slip-ups.** If someone says they are a Gradualist but keeps using the word 'Revolution', point them to Empty Space #2.
