answer: |-
  ### Research Agenda: The Architecture of Binding

  Your framing distinction—**Diachronic Self-Binding** vs. **Heteronomous Entrenchment**—is not only worth taking seriously; it is the necessary precondition for any rigorous theory of precommitment that spans ethics and constitutional law. The standard analogy (constitution = individual writ large) is not merely imprecise; it is ideologically loaded. It smuggles in the legitimacy of individual autonomy to justify what may be intergenerational coercion. If the "collective self" is a fiction, then "self-binding" is a misnomer for "binding others."

  Consequently, this five-year program must prioritize **ontological and normative foundations** over mechanical or logical puzzles. We must determine *what* is being bound and *by what right* before we determine *how* the binding logic functions.

  Here is the defended ordering of open questions.

  ---

  ### 1. The Metaphysics of the Binding Agent (The Validity of the Distinction)
  **Question:** *Under what conditions does a collective entity possess the diachronic identity required to be a "self" capable of binding, and when does it dissolve into a heteronomous relation between distinct agents?*

  *   **Why Upstream:** This is the foundation. If the collective lacks diachronic identity (e.g., if "the People" at $t_1$ are numerically distinct from "the People" at $t_2$ due to turnover, migration, or preference shifts), then the term "precommitment" is a category error in the collective case. All downstream normative work (e.g., "is this constitution legitimate?") assumes the agent persists. If this assumption fails, the collective case is not about *self*-binding but about *inter*-generational command. Work on revocation or rationality is wasted if the entity doing the revoking isn't the same entity that did the binding.
  *   **Tractability:** High. This leverages existing literature on personal identity (Parfit, Schechtman) and group agency (List, Pettit, Rovane). The task is synthesis and application, not new data collection.
  *   **Specificity:** Joint. It tests the analogy directly.
  *   **Re-ranking Conditions:** Move **down** if preliminary analysis shows the "fiction" of collective identity is legally irrelevant (i.e., if the law treats the corporation/state as a person regardless of metaphysical truth). Move **up** (to absolute priority) if the group finds that standard constitutional theory collapses without a robust theory of collective persistence.

  ### 2. The Normative Source of Authority Over the Future
  **Question:** *What grants the earlier agent the normative authority to constrain the later agent, and does this source differ fundamentally between the diachronic and heteronomous cases?*

  *   **Why Upstream:** Even if the agent persists (Q1), persistence does not entail authority. In the individual case, authority is often grounded in autonomy (the "true self" binding the "wayward self"). In the collective case, if the binding is heteronomous, authority cannot rest on autonomy; it must rest on legitimacy, justice, or necessity. If we cannot identify a normative source for the binding, the precommitment is merely a power play. This must be settled before discussing *what* is bound (policies vs. preferences).
  *   **Tractability:** High. Purely conceptual/normative analysis drawing on political legitimacy and moral psychology.
  *   **Specificity:** Joint, but highlights the divergence.
  *   **Re-ranking Conditions:** Move **down** if the group concludes authority is purely conventional (i.e., "it binds because the rules say it binds"). Move **up** if the group identifies a crisis of legitimacy in current constitutional entrenchment that stems from a confusion of these authority sources.

  ### 3. Precommitment to Preference-Formation (Candidate Question 2)
  **Question:** *Is there a coherent distinction between precommitting to an action/policy and precommitting to a procedure for forming future preferences, and does the latter constitute a deeper violation of autonomy in the heteronomous case?*

  *   **Why Upstream:** This defines the *object* of the bond. Standard theory focuses on binding actions (e.g., "do not spend more than X"). But constitutions and Ulysses contracts often aim to shape *desires* (e.g., civic education, addiction therapy). If binding preference-formation is conceptually distinct, it raises the stakes for the heteronomous case: binding a future generation's *actions* is one thing; binding their *values* is potentially totalitarian. This must be resolved before discussing how to release the bond (Q4).
  *   **Tractability:** Moderate. Requires careful conceptual carving to avoid collapsing "shaping preferences" into "changing circumstances."
  *   **Specificity:** Joint, but the risk profile is higher in the heteronomous case.
  *   **Re-ranking Conditions:** Move **down** if the distinction proves illusory (i.e., all precommitment inevitably shapes preferences via opportunity costs). Move **up** if the group finds that modern "nudge" states or constitutional patriotism rely on this specific, unexamined mechanism.

  ### 4. The Revocation Regress (Candidate Question 1)
  **Question:** *Does a precommitment require a meta-rule governing its own revocation, and does this generate a vicious regress or a benign one?*

  *   **Why Upstream:** This addresses the *stability* of the bond. If a future agent can revoke the precommitment at will, it wasn't a binding. If they cannot, sovereignty is violated. However, this is a *mechanical* question. It presupposes we know who the agent is (Q1), that they have some authority (Q2), and what they are binding (Q3). Solving the regress without solving the authority question yields a logically consistent but normatively empty system.
  *   **Tractability:** High. This is a classic logical/legal puzzle (Kelsen, Schmitt, Elster) well-suited to conceptual analysis.
  *   **Specificity:** Joint. The logic of revocation applies to both Ulysses and Constitutions similarly.
  *   **Re-ranking Conditions:** Move **up** if the group encounters a specific paradox that renders the concept of precommitment logically incoherent (a "stopper" problem). Move **down** (see Overrated section) if it is deemed a pseudo-problem solvable by distinguishing *constituent* from *constituted* power.

  ### 5. The Fiction of Unanimity in Heteronomous Entrenchment
  **Question:** *In the heteronomous case, who exactly is bound by the precommitment? (e.g., dissenters, new citizens, future generations who had no voice).*

  *   **Why Upstream:** This is the specific payoff of your framing. If the collective is not a diachronic self, the "binding" inevitably falls on those who did not consent. This question operationalizes the distinction. It is placed last because it relies on the answers to Q1 (are they the same agent?) and Q2 (do they have authority?).
  *   **Tractability:** Moderate. Requires navigating social contract theory and intergenerational justice.
  *   **Specificity:** Specific to the Heteronomous case.
  *   **Re-ranking Conditions:** Move **up** if the political context shifts toward intense intergenerational conflict (e.g., climate debt, sovereign debt crises).

  ---

  ### Placement of Candidate Questions

  As requested, the two specific candidate questions are integrated above:
  1.  **The Revocation Regress** is ranked **4th**. It is a technical constraint on the mechanism, secondary to the ontological and normative foundations.
  2.  **Precommitment to Preference-Formation** is ranked **3rd**. It is more upstream than the regress because it defines the *scope* of the autonomy violation, which is central to the normative evaluation (Q2).

  ---

  ### Overrated Questions (The Dispensable)

  **1. The Rationality of Precommitment (Decision-Theoretic Models)**
  *   **Why Dispensable:** Much of the economics and decision-theory literature focuses on whether precommitment is *rational* for a utility-maximizer (e.g., hyperbolic discounting models). This is overrated for this program. Rationality is internal to the agent's preferences. Our program is about *normativity* and *authority*. A precommitment can be rational but illegitimate (e.g., a rational tyrant binding his successors), or irrational but legitimate (e.g., a democratic sacrifice). Focusing on rationality distracts from the core philosophical problem of authority.
  *   **Downstream Impact:** Minimal. Knowing a bond is "rational" tells us nothing about whether a court should enforce it or whether a citizen must obey it.

  **2. The Revocation Regress (treated as a standalone logical puzzle)**
  *   **Why Dispensable:** While ranked 4th in the agenda, this question risks being overrated if treated in isolation. Legal theory has largely "solved" this via the distinction between *constituent power* (the people) and *constituted power* (the government). If the group accepts this distinction, the regress dissolves. Spending years on the logic of the regress without tying it to the *Heteronomous* distinction (Q1) would be scholasticism. It is only valuable insofar as it reveals tensions in the *authority* (Q2).

  ---

  ### The Three-Year Cut

  If the program is reduced from five years to three, I would drop **Question 4 (The Revocation Regress)** and **Question 5 (The Fiction of Unanimity)**, folding the insights of Q5 into Q1 and Q2.

  **Reasoning:**
  1.  **Core Innovation:** The unique value of this program is the **Diachronic vs. Heteronomous** distinction (Q1) and its normative consequences (Q2). These two questions alone dismantle the standard analogy and establish the new framework.
  2.  **Depth over Breadth:** Question 3 (Preference-Formation) is retained because it probes the *depth* of control, which is essential for distinguishing between a contract and a constitution.
  3.  **Technical vs. Fundamental:** The Revocation Regress (Q4) is a technical logical puzzle. While interesting, it is not a "showstopper" in the way that the Ontology (Q1) is. Legal systems function despite logical paradoxes of sovereignty; they do not function without a conception of who the sovereign is.
  4.  **Integration:** The problem of "Who is bound?" (Q5) is implicit in Q1 (The Metaphysics of the Agent). If we define the agent's persistence conditions, we implicitly define who is included in the "self." Explicitly separating Q5 is a luxury of a five-year timeline.

  **The 3-Year Agenda:**
  1.  **Metaphysics:** Is the collective a diachronic self?
  2.  **Authority:** By what right does the past bind the future?
  3.  **Object:** Can we bind preference-formation, and does it matter?

  This truncated program secures the theoretical foundation and the normative critique, leaving the mechanical details (revocation) and specific applications (unanimity) for future work.
