  2. Side payments convert moral loss into material gain to grow the pie, and once true valuations are known, the compensation can be priced exactly enough to make both sides better off without requiring anyone to lie about intensity.
  3. Nesting preserves the pie of principles intact but fails to grow the outcome pie because it merely delays action rather than resolving the conflicting desires, leaving the underlying value conflict untouched.
  4. Kicking it to procedure rarely creates value since it just shifts the conflict to a different arena where the losing side still risks having their true preferences ignored by the chosen decision-maker.
  5. Splitting the difference destroys the most value by guaranteeing both sides get less than they wanted, and it fails the posturing test because the compromise ratio rarely matches the true intensity of care.
