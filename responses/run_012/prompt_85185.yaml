prompt: |-
  Hey, so I'm a junior in high school and I'm writing the final paper for this elective I'm taking called Philosophy of Mind and Film, and I've somehow ended up obsessed with the frame problem. Can you help me think it through? I'd like you to act like a philosopher of cognitive science who also actually knows film — someone who's taught both the AI literature and criticism, not someone who'll free-associate about memory for a few paragraphs. Take your time with this, and please start by brainstorming three or four candidate readings of the film before you commit to one, because I don't want the first thing that pops into your head.

  Here's where I'm at. My teacher did the logic version first: McCarthy and Hayes and the situation calculus, why you need a frame axiom for every action/property pair just to say that painting the box doesn't move it or turn off the light, the common sense law of inertia, and then how the fixes kept breaking — the Yale shooting problem, plus the qualification and ramification problems, which I think I'm getting roughly right but tell me if I've mangled them. Then she said the philosophers made it bigger: Dennett's fable, I'm pretty sure it's his, about the two robots and the bomb on the trolley, where the first one blows itself up because it can't stop considering irrelevant facts and the second blows itself up because it's been designed to ignore irrelevant facts and so ignores a relevant one. Someone in class called that second trick the sleeping dog strategy. And then the wider version, where the real issue is relevance itself — how a system knows which facts even to bring to bear, which I've seen called the Hamlet problem. She also drew a distinction between the metaphysical frame problem, representing what doesn't change, and the epistemological one, limiting inference to what matters. I want to build the paper on that distinction but I'm honestly not sure I've got it right, so fix it if I haven't.

  The film is Memento, the Nolan one from 2000. Everybody writes about memory and personal identity and I'm bored of that, so what I want is a frame-problem reading that takes the formal literature seriously. Things I keep noticing: Leonard's tattoos and Polaroids and notes are basically a belief base with no update rule and no truth maintenance — nothing tells him what's still true after he acts, and nothing marks which of his notes have gone stale, and the whole system is built on sleeping dogs that he can never wake up. The Sammy Jankis story is the one that feels most like a formal problem to me, like a case where you write down the action but not the conditions attached to it, and someone dies of it. And the ending, where he deliberately writes himself a false record because an accurate one would leave him with nothing to do — that looks like belief revision driven by a goal instead of by the world, and I don't know if the frame problem literature has any room for that at all. Also the movie runs backwards, which I think is supposed to put us in his position, and I want to know if that's a real argument or just a gimmick. Then the honest part, which is what I actually need: where does the film resist this reading? His problem is that he can't form new memories, not that he reasons badly, so am I just allegorizing a neurological condition into a computational one, and does the film do anything the papers don't? I have a hunch it shows that for a person relevance is set by what you care about and who you're talking to, not by an inertia rule, but I don't know how to argue that without it sounding like a truism. I'd like the paper to end on what the film adds to the debate that argument alone doesn't. No need for a reading list, citations, page numbers, or quoted dialogue — I've seen it twice and can't check the script, so just work from what the film actually does. Thanks!
