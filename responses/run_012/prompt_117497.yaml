prompt: |-
  I'm running a 90-minute session for a mixed group of cog-sci grad students and a couple of engineers on what it actually takes to induce a concept from a handful of examples, and I want to do it through Bongard problems instead of a lecture on learning theory. Plan the explanation for me: what order the ideas have to go in, starting from the figures and ending somewhere like the point that what makes an answer right isn't that it fits all twelve but that it's the kind of thing a person would actually say in a sentence, so that the figures alone don't fix the answer. Which single problem should carry the whole thing, and what does it need? I'd rather you design me one than hand me the classic easy ones: solvable by a human in a minute or so, but not by any one feature detector, with at least two wrong rules that fit every figure on both sides. Then tell me where in the sequence to head off the misconceptions, which I expect to be 'more examples would pin it down', 'any rule that fits is as good as any other', and 'the hard part is seeing the figures, not finding the rule'. Plus one thing I can do at the end to check they've actually got it rather than just enjoyed the pictures, and what I should openly say I'm not covering at this level.
