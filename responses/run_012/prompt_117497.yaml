answer: |-
  Here is a 90-minute session plan designed to move your group from pixel-pushing to pragmatic reasoning, centered around a custom Bongard Problem (BP) designed specifically to expose the underdetermination of rules by data.

  ### The Custom Bongard Problem: "The Support Puzzle"

  Do not use a classic BP. Draw this on the board or put it on a slide. It looks simple, which makes the trap deadlier.

  **The Setup:**
  *   **Box 1–6 (Left Side):** A horizontal black line. A solid black square rests *on top* of the line. The line touches the **bottom edge** of the square. The square is always in the **lower half** of the frame.
  *   **Box 7–12 (Right Side):** A horizontal black line. A solid black square hangs *below* the line. The line touches the **top edge** of the square. The square is always in the **upper half** of the frame.
  *   *(Crucial Detail for the Trap):* In boxes 1–6, make the square **Black**. In boxes 7–12, make the square **White** (or leave it outlined).
  *   *(Crucial Detail for the Trap):* Ensure the vertical position is consistent. Left = Bottom of frame. Right = Top of frame.

  **The Three Rules that Fit Perfectly:**
  1.  **The Intended Rule (Semantic):** "The line supports the square" (touches bottom edge) vs. "The line suspends the square" (touches top edge).
  2.  **Trap Rule A (Positional):** "The square is in the bottom half of the frame" vs. "The square is in the top half."
  3.  **Trap Rule B (Surface Feature):** "The square is filled/black" vs. "The square is empty/white."

  **Why this works:** All three rules classify 12/12 correctly. A feature detector (engineer bias) might grab Position or Color first. A human (cog-sci bias) grabs Support/Contact. The session is about why the human rule wins despite the data fit being identical.

  ---

  ### The Session Flow (90 Minutes)

  #### Phase 1: The Struggle (0–15 mins)
  *   **Action:** Hand out the figures (or display). Give them 5 minutes of silence to solve it.
  *   **Prompt:** "Find the rule that distinguishes Left from Right. Write it down."
  *   **Discussion:** Ask 3 people for their rules.
      *   *Likely Outcome:* Someone will say "Support/Touching." Someone else might say "Top vs Bottom."
  *   **The Twist:** Reveal that Trap Rule A (Position) and Trap Rule B (Color) also fit 100% of the examples.
  *   **Point to make:** "Logically, these three answers are equivalent. They all have zero error on the training set."

  #### Phase 2: The Underdetermination (15–35 mins)
  *   **Concept:** **Data does not dictate Theory.**
  *   **Activity:** Ask the engineers: "If you were training a classifier on these 12 examples, which feature would converge fastest?" (Likely Color or Position).
  *   **Ask the CogSci students:** "Why did you reject 'Top vs Bottom' even though it's true for all 12?"
  *   **Key Insight:** You rejected it because you assume the *frame boundary is arbitrary*, but the *object relationship is causal*.
  *   **Addressing Misconception 1 ('More examples would pin it down'):**
      *   *Intervention:* Draw a 13th example. Put a supported square in the *top* half of the frame.
      *   *Ask:* "Does this break the 'Support' rule?" (No). "Does it break the 'Position' rule?" (Yes).
      *   *Point:* "Adding data only rules out hypotheses you *test for*. It doesn't tell you which hypotheses are *plausible* to begin with. You need a bias to know which rule is worth testing when the data changes."

  #### Phase 3: The Pragmatic Pivot (35–55 mins)
  *   **Concept:** **Communication Constraints (Gricean Maxims).**
  *   **Discussion:** "Why is 'Support' the *right* answer?"
  *   **Key Insight:** It's not about fit; it's about *informativeness*.
      *   If the rule were "Bottom Half," why draw the line? The line becomes noise.
      *   If the rule were "Color," why draw the line and the square geometry?
      *   The "Support" rule uses *all* the ink on the page. The other rules treat parts of the image as irrelevant noise.
  *   **Addressing Misconception 2 ('Any rule that fits is as good as any other'):**
      *   *Intervention:* Ask, "If I rotate the page 90 degrees, which rule still works?"
      *   *Point:* "Good rules are invariant to irrelevant transformations. 'Support' relies on the relation between objects. 'Bottom Half' relies on the relation to the frame. We assume the frame is irrelevant. That is an **Inductive Bias**."
  *   **Addressing Misconception 3 ('The hard part is seeing, not finding'):**
      *   *Point:* "You didn't struggle to see the lines. You struggled to decide which vocabulary to use (Coordinates vs. Contact vs. Color). The bottleneck isn't vision; it's **representation**."

  #### Phase 4: The Theory Mapping (55–70 mins)
  *   **Connect to their fields:**
      *   **For Engineers:** This is **Regularization**. You penalize "Position" and "Color" rules because they are "complex" in a semantic sense (they don't generalize to new contexts), even if they are simple in pixel space.
      *   **For CogSci:** This is **Abduction**. You are inferring the *intent* of the puzzle-maker, not just the statistics of the pixels. You are modeling the teacher, not just the data.
  *   **Summary Sentence:** "Induction isn't finding the curve that fits the points. It's finding the curve that the person who *gave* you the points would recognize."

  #### Phase 5: The Assessment Check (70–80 mins)
  *   **Task:** "The Reverse Bongard."
  *   **Action:** Give them a simple rule: *"The objects are touching."*
  *   **Challenge:** "Draw a pair of figures (Left/Right) where 'Touching' is the right answer, but design the figures so that a 'Color' rule or a 'Position' rule *also* fits perfectly."
  *   **Success Criteria:** They must intentionally embed a trap. If they can build a trap, they understand that data fit is cheap and semantics are the constraint.
  *   **Why this works:** It moves them from passive solvers to active designers of the ambiguity. It proves they grasp that the "Rightness" is external to the figures.

  #### Phase 6: Scope & Close (80–90 mins)
  *   **What I am NOT covering:**
      *   "I am not covering **Search Algorithms**. We didn't talk about gradient descent, decision trees, or how to efficiently find these rules. We talked about what makes a rule *valid* once found."
      *   "I am not covering **Neural Implementation**. We aren't discussing V1 edge detectors or attention mechanisms. This is a computational-level problem (Marr's Level 2), not implementational."
  *   **Final Takeaway:** "In your research, when your model overfits, don't just add more data. Ask: What is the 'Support' rule? What is the vocabulary your system is using, and is it the one a human would use to describe the world?"

  ---

  ### Facilitator Notes: Handling the Pushback

  **If an Engineer says:** "But if I train a deep net on 10,000 of these, it will learn 'Support' because 'Position' won't generalize."
  *   **Your Response:** "Only if your data augmentation includes shifting objects around the frame. That augmentation *is* the inductive bias. You manually encoded the assumption that 'Position doesn't matter.' The network didn't learn that; you taught it by how you constructed the dataset."

  **If a CogSci Student says:** "But 'Support' implies physics. What if the puzzle is just about 2D topology?"
  *   **Your Response:** "Exactly! That's the bias. You prefer 'Topology/Physics' over 'Cartesian Coordinates.' Why? Because your prior experience tells you objects are more stable than frames. That prior is the 'thing that makes the answer right.'"

  **If someone says:** "This is just Occam's Razor. Simplest rule wins."
  *   **Your Response:** "Is 'Bottom Half' simpler than 'Touches Bottom Edge'? In pixel coordinates, 'Bottom Half' is simpler (one threshold). In object-oriented code, 'Touches' is simpler. 'Simplicity' depends on your **vocabulary**. The session is about who chooses the vocabulary."

  ### Materials Needed
  1.  **The Handout:** The 12 figures of the "Support Puzzle."
  2.  **Whiteboard:** To draw the 13th counter-example live.
  3.  **Paper/Pen:** For the "Reverse Bongard" assessment.

  ### Why this specific problem?
  It avoids the "Count the sides" or "Big vs Small" tropes which are too easily solved by basic feature detectors. By making the "Trap" rules (Color/Position) statistically perfect but semantically hollow, you force the room to admit that **fit is not truth**. This creates the exact tension needed to introduce Inductive Bias without lecturing on it.
