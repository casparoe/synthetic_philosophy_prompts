answer: |-
  Here is the straight answer you asked for:

  **There is nothing "off" about you.** What you are describing is a documented psychological phenomenon, not a moral failing or a sign of morbidity. There is a principled reason to keep doing it, provided it continues to achieve the result you described (feeling lighter).

  Your partner and your friend are operating on common misconceptions about how human emotion works. Here is the breakdown of why this habit makes sense, why your specific constraints (strangers, no happy ending) are logical, and when you should actually consider stopping.

  ### 1. The Mechanism: Catharsis and Regulation
  Your partner believes that because crying feels bad, it must *be* bad. Physiologically, this is incorrect.
  *   **Physiological Release:** Emotional crying releases stress hormones (cortisol) and toxins that build up during stress. It also triggers the parasympathetic nervous system, which calms you down after the event.
  *   **The "Lighter" Feeling:** You feel lighter because you have completed a stress cycle. When "things get bad," your body enters a state of high arousal (fight or flight). Watching the film allows you to discharge that energy through tears, returning your body to baseline.
  *   **Principled Reason:** You are using the documentary as a tool for **emotional regulation**. It is a controlled environment to process uncontrolled feelings.

  ### 2. Why Strangers? (The Burden of Agency)
  You mentioned you can't stand sad stories about people you know. This is not a defect; it is a healthy boundary regarding **agency**.
  *   **Known People:** When someone you know suffers, you feel a burden of responsibility. You feel you should help, fix it, or say the right thing. Their pain demands action from you. This adds anxiety to your sadness.
  *   **Strangers:** The people in the documentary cannot ask anything of you. You have zero agency to change their outcome. This creates a "safe container." You are allowed to feel pure grief without the accompanying guilt or pressure to solve the problem.
  *   **Verdict:** This distinction proves you are not seeking misery; you are seeking *permission to grieve without responsibility.*

  ### 3. Why No Happy Endings? (The Need for Validation)
  You feel cheated by a hopeful ending because it invalidates the emotion you came to process.
  *   **Toxic Positivity:** A forced happy ending signals that the suffering was only acceptable because it was "worth it" in the end. It suggests pain must be fixed to be meaningful.
  *   **Validation:** By watching a story where the loss remains a loss, you validate your own feelings that "sometimes things are just bad." It aligns with your internal reality when things are going poorly. A happy ending would feel like a lie, forcing you to suppress your current mood rather than release it.
  *   **Verdict:** You aren't looking for despair; you are looking for *truth*.

  ### 4. Addressing the Critics
  *   **Your Partner:** She equates "crying" with "harm." In psychology, avoidance of negative emotion is often more harmful than the expression of it. Unless you are watching this to the detriment of your daily functioning (missing work, ignoring hygiene), the act itself is not harmful.
  *   **Your Friend:** The "mosquito bite" analogy suggests the relief is temporary and the underlying itch gets worse. This is a valid concern *only if* you are using the film to avoid solving the actual problems in your life. If you watch the film, cry, feel lighter, and then tackle your problems, it is not scratching the bite; it is taking an aspirin.

  ### 5. When Should You Stop?
  You should only stop if the habit shifts from **functional** to **avoidant**. Here is the litmus test:
  1.  **Diminishing Returns:** If you watch it and *don't* feel lighter anymore, or if you need to watch it more frequently to get the same relief, it is becoming a compulsion.
  2.  **Replacement:** If you watch the film *instead* of talking to your partner, seeking help, or addressing the "bad things" triggering the stress, it is avoidance.
  3.  **Worsening Baseline:** If your general mood between viewings is getting darker, not lighter.

  ### Conclusion
  You are engaging in a ritual of **controlled catharsis**. You have found a specific key that unlocks a release valve for your stress system. The constraints you've noticed (strangers, no happy ending) are features, not bugs; they ensure the grief is safe and the emotion is validated.

  **The Advice:**
  Tell your partner: *"Crying is my body's way of resetting my stress levels. This specific film allows me to do that safely because I don't feel responsible for the people in it. I feel better afterward, not worse. Unless I start neglecting my life to watch it, this is a healthy coping mechanism, not a morbid one."*

  You do not need to stop. You need to trust the data: you feel lighter. That is the metric that matters.
