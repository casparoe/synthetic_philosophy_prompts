answer: |-
  Here is a disciplined mapping of *Bostock v. Clayton County* through the lenses of textualism and purposivism, structured according to your two-part request.

  ### I. Theory onto Case

  To map the theories onto *Bostock*, we must isolate the specific interpretive moves each theory demands and compare them to the actual reasoning in the opinions.

  **The Committed Textualist Prediction**
  A committed new textualist asks: What is the ordinary public meaning of the words at the time of enactment, and what logical work do they do?
  *   **Relevant Text:** The phrase "because of... sex."
  *   **The Prediction:** A strict textualist should focus on the causal link. If the employer cannot explain the discharge without referencing the employee's sex, the text is satisfied. However, a textualist must also respect the "ordinary meaning" of "sex" in 1964. If the ordinary understanding of "discrimination because of sex" in 1964 excluded sexual orientation (as a distinct category from biological sex), a consistent textualist should rule against coverage.
  *   **The Majority's Move:** Justice Gorsuch's opinion isolates the text from its context. He applies a "but-for" causation test: If you change the sex of the employee but keep all other facts (including the sex of their partner or their gender identity) the same, would the firing still occur? If no, then sex is a but-for cause.
  *   **The Premise Not in the Statute:** The majority's central move depends on a premise that is not in the text: that *any* instance where sex is a but-for cause of an adverse employment action constitutes discrimination "because of sex." The text prohibits discrimination *because of* sex, which implies an inquiry into the employer's *reason* or *motive*. The majority premises that the employer's motive (animus against homosexuality) is irrelevant if the *mechanism* of the firing relies on sex-based comparison. This shifts the inquiry from the employer's intent (what "because of" usually implies in common parlance) to a logical test of outcome differentials. This is a logical abstraction, not a textual given.
  *   **Instantiation:** Paradoxically, the Majority opinion is a hybrid. It uses textualist tools (ordinary meaning, but-for causation) to achieve a result that aligns with dynamic purposivism. It is textualist in method but not in historical constraint.

  **The Committed Purposivist Prediction**
  A committed purposivist asks: What mischief was Congress trying to remedy, and what purpose does this statute serve?
  *   **Relevant Purpose:** The general purpose of Title VII is to eliminate invidious discrimination in the workplace. However, the specific purpose of the 1964 Congress regarding "sex" was narrowly tailored to biological distinctions between men and women, not sexual orientation or gender identity.
  *   **The Prediction:** A purposivist focused on *original intent* would predict no coverage, as the enacting coalition did not intend to disrupt norms regarding homosexuality. A purposivist focused on *evolving purpose* (the "spirit" of the law) would predict coverage, arguing that excluding LGBTQ employees frustrates the statute's broader goal of workplace equality.
  *   **The Dissents' Move:** Justices Alito and Kavanaugh argue that the majority ignores the context in which the words were chosen. Alito leans heavily on original intent (a form of purposivism), noting that in 1964, homosexuality was criminalized and not considered a subset of sex discrimination. Kavanaugh focuses on ordinary meaning in context, arguing that "because of sex" has a specific linguistic usage that does not encompass sexual orientation.
  *   **Instantiation:** Justice Alito's dissent best instantiates classic purposivism (specifically intentionalism). He looks beyond the isolated words to the historical context and the specific expectations of the enacting legislature. He argues that interpreting the text to cover sexual orientation violates the purpose *as understood by the drafters*, even if it fits a logical definition of the words.

  **Refereeing the Classification**
  Your classmate is likely arguing that Gorsuch is a "fake textualist." The analysis supports a nuanced version of this. Gorsuch is a textualist regarding *materials* (he refuses to look at legislative history) but not regarding *meaning fixation*. He fixes the meaning of "sex" logically rather than historically. Alito is the more consistent originalist/purposivist here, insisting that text cannot be divorced from the historical problem it was meant to solve. Therefore, *Bostock* is not a clean victory for textualism; it is a victory for *logical formalism* draped in textualist clothing.

  ### II. Case onto Theory

  Does *Bostock* confirm the theories, or does it reveal their structural limits?

  **Confirmation, Anomaly, or Unanticipated?**
  *Bostock* is an anomaly for the standard political valences of these theories, but a confirmation of their structural mechanics. Usually, textualism is associated with conservative outcomes (narrow reading) and purposivism with liberal outcomes (broad reading). *Bostock* inverts this.
  *   **For Textualism:** It confirms that textualism is not inherently conservative. If the logic of the words leads to a progressive result, a committed textualist must follow it.
  *   **For Purposivism:** It reveals a fracture. "Original intent" purposivism yields a conservative result; "dynamic purpose" purposivism yields a liberal one.
  *   **Verdict:** The case confirms that both theories are engines of interpretation that can run in either direction depending on the specific text and context. It is not an anomaly of method, only of outcome.

  **Testing Your Hypothesis: Allocating Discretion**
  Your hypothesis is that the theories are less rivals than they appear because both allocate interpretive discretion, disagreeing mainly on *who* holds it. *Bostock* strongly supports this.
  *   **Textualism's Allocation:** It allocates discretion to the *words* (as interpreted by the judge). In *Bostock*, Gorsuch exercised discretion to choose a "but-for" logical test over a "motivating factor" test. He decided that the text's logic overrides the text's historical context.
  *   **Purposivism's Allocation:** It allocates discretion to the *judge's assessment of purpose*. Alito exercised discretion to prioritize the 1964 legislative expectations over the 2020 logical implications of the words.
  *   **Analysis:** In both cases, the judge is making a choice about what controls the outcome. Textualism claims to remove the judge from the equation by binding them to the text, but *Bostock* shows the judge still controls the *logical framework* applied to that text. Purposivism admits the judge's role in identifying the goal. The rivalry is indeed about *which constraint* is legitimate, not whether constraint exists.

  **The Counterfactual: The Unambiguous Legislative Record**
  Suppose the text remains "because of... sex," but the legislative record contains an unambiguous statement: *"The provision regarding sex is not intended to cover discrimination based on sexual orientation or gender identity."*

  *   **The Textualist Response:** A committed new textualist (Gorsuch/Scalia model) **does not change their answer.** They maintain that legislative history is not law. Only the enacted text is law. If the text logically covers the conduct, the unenacted intent in the record is irrelevant.
  *   **The Purposivist Response:** A committed purposivist **changes their answer.** If the purpose is explicitly clarified in the record to *exclude* this coverage, then covering it would frustrate the statutory purpose. The purposivist would rule against the employee.
  *   **What This Reveals:** This counterfactual proves your point about textualism being a "rule about which materials count as reasons." Textualism is not necessarily a constraint on *judicial will* (since the judge can still interpret the text broadly, as Gorsuch did); it is a constraint on *sources*. It reveals that textualism is a methodology of recognition, not necessarily a methodology of restraint. It allows a judge to expand the law (as Gorsuch did) provided they can trace the expansion to the text rather than the history. Purposivism, conversely, is more sensitive to democratic intent but risks allowing judges to override clear text based on their assessment of "purpose."

  **Where the Theories Are Silent**
  To finish, we must acknowledge where these theories run out of road in *Bostock*.

  *   **Textualism is Silent on Normative Justice:** Textualism can tell us what the law *says*, but it is silent on whether the result is *just* or *democratically legitimate* when it contradicts the clear expectations of the enacting coalition. It cannot explain why a 2020 court should impose a 1964 text's logical implications on a society that never voted for them. It treats the statute as a command from the past without a mechanism to validate the democratic consent of the present.
  *   **Purposivism is Silent on Fractured Intent:** Purposivism assumes a coherent "purpose" exists to be found. In *Bostock*, the 1964 Congress was a coalition of Northern liberals and Southern conservatives who agreed on the text but likely disagreed on the scope. Purposivism is silent on how to adjudicate when the "purpose" is a compromise of ambiguity. It forces the judge to choose *which* faction's purpose counts, a discretion it claims to minimize.

  **Conclusion for the Seminar**
  *Bostock* demonstrates that textualism and purposivism are not opposite ends of a spectrum but distinct coordinate systems. Textualism asks, "Does the logic of the words permit this?" Purposivism asks, "Does the intent of the authors permit this?" In *Bostock*, the words permitted it, but the intent likely did not. The Majority chose the former; the Dissent chose the latter. Your hypothesis holds: the battle was not over the outcome, but over which source of authority—the dead hand of the 1964 intent or the living logic of the 1964 text—holds the discretion to define the law today.
