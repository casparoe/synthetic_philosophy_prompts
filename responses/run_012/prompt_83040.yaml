answer: |-
  The view, restated
  You endorse supervaluationism. Vague predicates lack extensional precision but admit multiple precisifications consistent with usage. A sentence is true iff it is true on all admissible precisifications (supertrue), false iff false on all, and otherwise truth-valueless. You maintain classical logic (e.g., Excluded Middle holds) because tautologies hold on every precisification. You deny ontic vagueness (the world is precise) and epistemicism (no single unknown sharp boundary), locating indeterminacy in semantic underdetermination.

  What would count against it
  1.  **Higher-Order Vagueness (The Meta-Boundary):** This is the most decisive internal collision. If the set of 'admissible sharpenings' is precise, there is a sharp boundary between admissible and inadmissible precisifications. This reinstates epistemicism at the meta-level: there is a fact of the matter about which sharpenings are allowed, we just cannot know it. If the set is vague, classical logic fails for meta-statements about admissibility, undermining your logical commitment. **Cost: Fatal.** It forces a choice between collapsing into the epistemic view you rejected or abandoning classical logic.

  2.  **Violation of the T-Schema:** Supervaluationism severs the link between truth and assertion. For a borderline case $P$, you assert $P \vee \neg P$ (as supertrue), but you cannot assert '$P$ is true' (as it is not supertrue). The disquotational schema ('$P$ is true' iff $P$) fails. This suggests you have changed the subject on 'truth', redefining it as 'supertruth' rather than capturing the concept used in ordinary discourse. **Cost: High.** It renders the notion of truth philosophically unnatural.

  3.  **The Falsehood of the Sorites Premise:** To block the Sorites paradox, you must deem the inductive premise ($\forall n (B(n) \to B(n+1))$) false, because it fails on some sharpenings. This entails that for every precisification, there is a sharp cutoff where baldness stops. Extensionally, this matches epistemicism exactly regarding the world; you differ only in claiming no *single* cutoff is privileged. **Cost: High.** It concedes the substantive battle about sharp boundaries in the model.

  4.  **Failure of Classical Inference Rules:** Whilst tautologies hold, standard inference rules like Conditional Proof or *reductio ad absurdum* fail for vague sentences. You cannot assume $P$ to derive $Q$ and conclude $P \to Q$ if $P$ is borderline. This undermines your claim that classical logic survives intact; you retain classical *validities* but lose classical *reasoning*. **Cost: Medium-High.** It weakens the logical utility of the framework.

  5.  **Vagueness of 'Admissibility':** If 'admissible' is itself vague, the theory requires a supervaluation over supervaluations, leading to infinite regress. If 'admissible' is defined by linguistic competence, it reduces to a sociological report on what speakers accept, stripping the view of its normative semantic force. **Cost: Medium.** It threatens the theoretical foundation of precisifications.

  What the view predicts
  It predicts that borderline sentences lack truth values whilst logical truths remain true. It predicts Sorites arguments are unsound due to a false premise, not invalid logic. It predicts no ontic vagueness exists in the world.

  What a defender concedes
  A defender concedes that 'truth' is not disquotational and that 'admissible' must be treated as a primitive or precisely bounded notion to avoid regress. They accept that the Sorites premise is false.

  Where it risks nothing
  It risks nothing regarding ontology (the world remains precise) or object-language formal validity (tautologies hold). It is insulated from charges of ontic vagueness by definition.

  My verdict
  The view is technically well insulated against simple objections, but this insulation is itself the problem. By privileging formal preservation of classical logic over the intuitive behaviour of truth and inference, it risks becoming a mathematical model that fails to capture the phenomenon it purports to explain. The collapse into meta-epistemicism is the gravest threat.
