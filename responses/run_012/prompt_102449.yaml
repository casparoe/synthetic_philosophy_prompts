      *   **Setup:** Negotiation over a settlement with five disputed clauses (water rights, burial ground, development permit, reparations, language-in-schools).
      *   **Key Moment:** The deontologist argues that putting a price on something changes the nature of the thing/value (commodification critique). The utilitarian needs a real comeback, not just a loss.
      *   **Tone/Style:** Short story, third person, ~1500 words.
      *   **Ending:** No neat bow. The disagreement remains live, but mutual understanding exists.

  2.  **Character Conception:**
      *   **Deontologist:** Elias. Rigid, principled, sees certain duties as absolute. Represents the "some things aren't currency" view.
      *   **Utilitarian:** Mara. Pragmatic, focused on outcomes, sees refusal to trade as inefficiency/suffering. Represents the "leave value on the table" view.
      *   **Setting:** A sterile negotiation room. Clock ticking. Rain outside (classic tension setter).

  3.  **Plot Outline:**
      *   **Introduction:** Establish the setting, the five clauses, and the dynamic. Show the early trading success (the "easy cases").
      *   **Rising Action:** They get through the easy trades (water for language, etc.). Momentum builds. Mara pushes for the big trade.
      *   **Climax:** The Burial Ground clause. Elias refuses to trade it. Mara argues efficiency. Elias delivers the commodification critique (pricing changes the thing).
      *   **Falling Action:** Mara counters. She argues that refusing to trade also changes the thing (preservation through stagnation vs. preservation through compromise).
      *   **Resolution:** Deadline approaches. No agreement on that clause, but acknowledgment of the other's logic. Open ending.

  4.  **Drafting - Section by Section:**

      *   *Scene Setting:* The room, the clock, the papers. Five clauses listed.
      *   *The Easy Trades:* Show, don't just tell, the comparative advantage. Mara cares about development (utility), Elias cares about language/culture (duty). They swap. Both feel good. This validates the prompt's premise initially.
      *   *The Turning Point:* The Burial Ground. Clause 3.
      *   *The Utilitarian Push:* Mara argues the numbers. The development brings housing/jobs (utility) vs. the ground staying untouched (status quo). She offers huge concessions on reparations to "buy" the land.
      *   *The Deontologist Stand:* Elias shuts it down. Not about value, about right/wrong.
      *   *The Philosophical Clash:*
          *   Elias: Pricing it corrupts the value. If I sell it, I admit it was always for sale.
          *   Mara: If you don't sell it, you're prioritizing symbolism over actual welfare. Also, value is created by use.
          *   *Refining the Critique:* Elias needs to say that the *act* of negotiation transforms the sacred into the profane.
          *   *Refining the Comeback:* Mara needs to say that isolationism is also a choice with consequences. Protecting the ground by letting people suffer elsewhere is also a moral stain.
      *   *The Ending:* Time runs out. They sign what they can, or they don't sign. Let's have them pause before signing. The disagreement is the point.

  5.  **Writing - Focus on Dialogue and Internal State:**
