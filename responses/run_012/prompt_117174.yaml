  I'm in a behavioural econ master's program and I go to a small weekly reading group run by a postdoc, Nadia, who's spent years working on escalation of commitment — the dollar auction, the war-of-attrition stuff, the sunk-cost psychology, all of it. For the last few weeks she's been giving us rulings on cases and I've realised I cant quite state the rule she's actually running. Could you take the role of someone who really knows this literature — both the game-theoretic side (why continuing can be individually rational given the structure you're already in) and the psychology side (sunk costs, self-justification, face-saving) — and work out what she'd say about a new case? Please brainstorm a handful of candidate rules first and only then commit to one, and flag wherever the candidates come apart on the case. I'm not after the textbook answer, I want the actual structure of her judgements.

  Her rulings, as best I can reconstruct them from my notes. (1) The dollar auction itself: someone sitting on the second-highest bid of 90 cents sees a bid of a dollar and raises to a dollar ten. She says he's not being irrational, and that the mistake, if there is one, is the first bid and not the last one. (2) A guy she knows who kept paying for repairs on a car he'd already sunk thousands into, where nothing else was at stake and nobody was watching: textbook sunk cost fallacy, no argument. (3) A firm that kept a money-losing product line alive because it wanted a reputation for never abandoning customers, and the reputation was worth more than the write-off: she says fine, not a fallacy, even though the accountants hate it. (4) A division head who kept funding a failing internal project, where the numbers clearly said stop and whose stated reason was that the team had come too far to quit: fallacy, and she said the tell was that he was protecting his own earlier call.

  The new case is my cousin, a junior partner at a small litigation firm. Two years ago she took on a contingency case and the firm has sunk something like 400 hours into it. The defendant has just offered a settlement that wouldn't even cover the hours the firm has already booked, and she's turning it down. Her forward-looking case for going on isn't bad: the marginal cost of continuing is small, most of the heavy lifting is done, and on a straight from-here calculation continuing still beats settling. But when she explains it to me she says things like "I can't walk away now, we've put too much into this" and "if I fold now those two years were for nothing." So — what does Nadia say about her? I care less about the yes/no than about which rules fit all four of Nadia's rulings, what each of them predicts here, which one I should actually attribute to her and why, and what further case would seperate the survivors. One thing I keep tripping over: in some of her rulings Nadia seems to be judging the reasoning and in others the outcome, and I can't tell whether that's an inconsistency or the actual rule.
