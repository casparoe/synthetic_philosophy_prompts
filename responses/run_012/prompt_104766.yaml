answer: |-
  Good morning. Welcome to the station. For those who haven't been out to the docks yet, the tide is coming in around noon, so the water will be under this floorboards before lunch. It feels appropriate. We are here to talk about minds that evolved in water, in the dark, in structures nothing like our own. And we are doing it in a building that was once used to store boats, now used to store ideas.

  I want to start with the reason many of you are in this room, specifically those of you who come from the advocacy and funding side. You are here because you care about what happens to these animals. You want to know if our practices cause harm that matters. You want a line in the sand: on this side, creatures that feel; on that side, creatures that do not. You want a yes or a no.

  I also want to speak to the neurobiologists and ecologists in the room. You are here because you suspect that line in the sand is a fiction. You know that nervous systems are built from homologous parts arranged in different geometries. You know that behavior can be sophisticated without inner life, and simple with it. You bristle when policy outpaces data. You worry that "sentience" is becoming a bucket for everything we don't understand.

  Both groups are right. The welfare stakeholders need a decision; the scientists need a mechanism. The conflict arises because we are asking a binary question of a continuous system. We are asking, "Is this animal conscious?" as if consciousness were a trait like having a backbone or having gills. Something you either have or you don't.

  My proposal for this workshop—my wager, really—is that we are asking the question at the wrong grain.

  I want us to try on a different frame. I am calling it the interval view. The suggestion is this: consciousness may not be a property an animal possesses, but a span over which a state holds together. On this view, a experience is phenomenally present to a creature only if it is integrated, and available to steer that creature's own later behavior, across some interval of time.

  That interval might be a fraction of a second in one animal, and minutes, or perhaps longer, in another. So the interesting question is not whether a crab is conscious. The question is: what is the longest interval over which a crab's experience remains one thing, rather than dissolving into a sequence of unconnected flashes?

  I am not presenting this as a finding. I am presenting it as a tool. It is a hypothesis about how to carve nature at its joints. And like any hypothesis, it needs to be stressed. I want to use the rest of these minutes to show you where this tool might cut, and where it might slip.

  First, if we accept this frame, we immediately face a fork in the road. We need to measure the interval. But there are at least two ways to do that, and they can come apart.

  One way is to measure persistence. How long does a sensory state last before it fades? If a shrimp detects a shadow, how many milliseconds does that detection remain a unified "now" for the shrimp?

  The second way is to measure availability. How long does that state remain accessible to be acted on, or reported on, later? An animal might hold a state briefly but use it to guide behavior minutes later. Or it might hold a state for a long time but be unable to use it to steer future action.

  This is not a technicality. This is a real divergence. If we define the interval by persistence, we are talking about the texture of experience itself. If we define it by availability, we are talking about functional access. These are not the same thing. We know they come apart in human clinical contexts. We do not know where they come apart in invertebrates.

  Over the next three days, I am asking you to fight about this. Do not smooth it over. If you are designing an experiment, specify which interval you are measuring. If you find evidence that a cephalopod can act on information after a delay, ask yourselves: does that mean the experience lasted through the delay, or that the information was stored without experience? The interval view forces this distinction into the open. That is its value. But it is also where the view is most vulnerable.

  Second, we have to be honest about what this does to the yes-or-no question. If consciousness is a span, then it admits of degrees. An animal with a longer integration window is, on this view, more conscious than one with a shorter window.

  I know what some of you are thinking. To the advocates: this sounds like evasion. If suffering is real, isn't it binary? Either it hurts or it doesn't. To the scientists: this sounds like unfalsifiable fuzziness. If you can just adjust the interval, can't you explain away any result?

  I share that worry. It is a valid criticism. If we adopt the interval view, we are trading clarity for resolution. We are saying the world is not black and white, but shades of gray. That might be the truth. Or it might be a way to avoid making the hard calls that welfare policy requires.

  I am not going to resolve that tension for you. I am putting it on the table. If we leave this workshop convinced that the interval view is correct, we still have to decide: what is the minimum interval that matters ethically? Is a hundred milliseconds of integrated experience enough to warrant protection? Is a second? The science can measure the span. It cannot measure the moral weight of that span. That is a conversation we have to start, even if we cannot finish it here.

  Third, and most importantly, I want to be clear about the status of this idea. I am not defending the interval view to the death. I am offering it as something to be broken.

  It is possible that consciousness is not a temporal span at all. It is possible that integration happens without time, or that behavior is steered without integration. It is possible that the whole framework collapses when you look closely at a nervous system with no central brain.

  I hope some of you will try to break it. I hope you will bring data from the lab and observations from the field that show the interval view leads to contradictions. If this frame helps us generate better experiments, good. If it helps us clarify where our disagreements lie, good. But if it turns out to be a category error, I want us to find that out this week.

  We are in a marine station. We know that water finds the level. It fills the space it is given. Our concepts should do the same. They should fit the shape of the animals we are studying, not the shape of our own intuitions.

  So, here is the work for the next three days. When you hear a presentation on learning, ask: over what interval is that learning integrated? When you hear a presentation on nociception, ask: is this a reflex, or is it a state that persists long enough to steer future avoidance? When you hear a proposal for policy, ask: are we assuming a binary threshold where there is actually a slope?

  We have forty people in this room. We have expertise in neurobiology, ecology, ethics, and law. We have the animals right outside, in the tanks and in the bay. We have the tide coming in.

  Let us use this time to test the frame. Let us see if the interval view holds water, or if it leaks. Let us see if we can find a way to talk about what it is like to be an invertebrate without pretending we have answers we do not have.

  Thank you. Welcome to the workshop.

  ***

  **Note to the Director (Not to be read aloud)**

  **Confidence Assessment:**
  I am moderately confident in the rhetorical utility of the "interval view" as a framing device for this specific audience. It successfully bridges the gap between the need for binary policy decisions and the reality of continuous biological data. It forces the scientific group to engage with temporal dynamics rather than static properties, and it gives the advocacy group a concrete variable (duration/integration) to consider regarding welfare.

  **Least Certain Point:**
  The point I am least sure of is the distinction between "persistence" and "availability" as a clean fork. While philosophically distinct, empirically measuring "availability" without inferring "persistence" is notoriously difficult in non-verbal subjects. There is a risk that this distinction, while conceptually sharp, collapses in practice during the workshop, leading to frustration rather than clarity. I flagged it as a tension to be fought, but it remains the weakest link in the operationalizability of the frame.
