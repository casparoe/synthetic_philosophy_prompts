answer: |-
  Good evening.

  Thank you for being here. Looking around this room, I see the different paths you walked this year. Some of you fought for every hour, keeping every machine running until the very end. Some of you made the choice to turn things off, to stop the treatments that were holding death back. Some of you signed papers saying "do not resuscitate," and waited. Some of you administered the medicine that slowed the breathing down.

  I am a doctor here. I want to speak plainly about what happened in those rooms.

  It is common to say that when we stop treatment, we are just "letting nature take its course." It is a comforting phrase. It suggests that we stepped aside, and the disease finished what it started. It suggests that our hands were clean.

  I don't think that is true. And I don't think you should have to believe it is true to find peace.

  When we keep a heart beating with machines, we are doing something. When we turn those machines off, we are doing something. When we give a dose of medicine to ease pain, knowing it will slow the breath, we are doing something. In every case, human hands made a choice. In every case, that choice changed the moment the heart stopped. If we had done something else, they would have died at a different time, in a different way.

  We cannot say the disease did it all. We cannot say we were just bystanders. We were not. We were participants.

  I know how heavy that feels. I know there are people in this room, including my own colleagues, who lie awake thinking about the specific moment they acted. The switch they flipped. The syringe they pushed. The paper they signed. You feel that you caused the end.

  You are right. You did.

  But I need you to hear the rest of the truth.

  We took that responsibility because they could not carry it anymore. Dying is hard work. Sometimes, the hardest part of dying is the struggle to stay alive when the body is ready to rest. Sometimes, the hardest part is the pain of the struggle itself.

  When you chose to stop treatment, you took the weight of that ending onto your own shoulders. You accepted the guilt of the timing so they could have the peace of the moment. When you chose to continue treatment, you took the weight of the struggle, buying them time for a visitor to arrive, for a grandchild to be born, for a goodbye to be spoken.

  Both are actions. Both change the world. Both are acts of love.

  Our chaplain just told you that nobody in this room killed anybody. He is right. To "kill" implies you took something that belonged to them. You didn't take anything. You gave them something. You gave them your own conscience as a shield. You stood between them and the raw mechanics of death, and you made a decision so they didn't have to.

  That is not a crime. That is a sacrifice.

  To the nurse who worries about the last dose: Your hand moved. The medicine flowed. The heart slowed. You did that. And you did it because the alternative was a suffering you would not wish on anyone. You accepted the burden of the action so they could have the benefit of the peace.

  To the families who signed the orders: You made the end come sooner. You did that. But you did it to stop the war their bodies were losing.

  To the families who kept everything going: You made the end come later. You did that. You did it to honor the time they still had.

  We are all in this together. The staff, the families. We all touched the end. We all changed it. And we all did it for the same reason: because we loved them more than we loved our own clean hands.

  There is a line between harming and helping. It is not the line between "doing" and "allowing." We were always doing. The line is between acting for ourselves, and acting for them.

  Tonight, you can look at your hands. You can acknowledge what they did. You don't have to pretend you were passive. You were active. You were present. You took the responsibility.

  And because you shared that burden with us, and because you carried it for them, you can put it down now. They are gone. The work is done. And it was good work.

  Thank you.
