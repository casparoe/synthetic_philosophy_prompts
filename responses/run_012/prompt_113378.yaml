      *   The distinction isn't between "doing" and "allowing." It's between "harming" and "helping."
      *   Both continuing treatment and stopping treatment are interventions. Both change the outcome.
      *   The moral weight lies in *why* we intervened, not in the physics of the intervention.
      *   *Key Insight:* We are all responsible for the deaths, but we are responsible *together*, for the sake of the person who died. The "killing" (in a causal sense) was an act of mercy, not malice.
