      *   **Core Philosophical Stance:** The doctor rejects the traditional doing/allowing distinction. They believe stopping treatment (withdrawing vent, DNR) is an *action* that contributes to death, not just "letting nature take its course." They believe the line between killing and letting die is constructed, not found.
      *   **Constraints:**
          *   5 minutes (approx. 600-750 words spoken at a moderate pace).
          *   Plain words (no jargon, no philosophy names).
          *   No falsehoods (according to the doctor's specific ethical view).
          *   Cannot contradict the chaplain (who says "nobody killed anybody").
          *   Cannot comfort the night nurse by denying her action caused death (because the doctor believes it *did* contribute).
          *   Cannot say "the disease did it."
          *   Cannot say "the line doesn't matter."
          *   Goal: Comfort them with something *true* (within the doctor's framework).
          *   Contingency: If no honest version comforts, admit it and give the "least-bad honest one."

  2.  **Deconstruct the Ethical Tension:**
