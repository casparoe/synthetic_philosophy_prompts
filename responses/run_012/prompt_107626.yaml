answer: |-
  On the North Sea trawler *The Iron Mary*, the concept of a "Salt Splice" determines which rope joins earn a crew bonus. New deckhands learn what counts solely by watching the Bosun approve or cut out splices during the nightly inspection; no manual exists and no definitions are spoken. A Salt Splice might have five tucks and no wax, or three tucks with heavy wax, or a long taper with a specific stiffness, but no single feature appears in every approved splice, and some rejected splices share features with approved ones. Yet the classification is absolute: the Bosun never hesitates, and the crew never disputes his call. Even the "Henderson Case"—a splice with a frayed tail that technically violated the usual taper norm but was passed because the core tension was perfect—is universally acknowledged by the crew as a Salt Splice, proving the category is sharp despite its crisscrossing criteria.

  ***

  ### The Checks

  **(a) Rule-less Acquisition**
  *   **The Bit:** "New deckhands learn what counts solely by watching the Bosun... no manual exists."
  *   **The Work:** This secures the *ostensive* nature of the concept. It is learned through exposure to examples, not deduction from premises.
  *   **If Removed:** If you hand the deckhand a manual listing conditions, condition (b) collapses. A manual implies explicit necessary and sufficient conditions. Without (a), the "family resemblance" is just a hidden rule set waiting to be written down.

  **(b) Overlapping Features**
  *   **The Bit:** "Five tucks and no wax, or three tucks with heavy wax... no single feature appears in every approved splice."
  *   **The Work:** This secures the *crisscrossing* structure. It prevents the concept from being a classical category defined by a common essence.
  *   **If Removed:** If every Salt Splice shared one feature (e.g., "must have five tucks"), it becomes a classical category. Family resemblance requires that the "chain" of similarity holds the group together, not a shared core.

  **(c) Full Determinacy**
  *   **The Bit:** "The Bosun never hesitates, and the crew never disputes... universally acknowledged."
  *   **The Work:** This secures the *sharp boundary*. Vagueness is a lack of agreement or a lack of fact in borderline cases. Here, social enforcement and shared training create a "fact of the matter" for every actual case.
  *   **If Removed:** If the crew argued over the Henderson Case, or the Bosun said "it's kind of a splice," vagueness returns. The concept would then have "open texture," and (c) would fail.

  ***

  ### The Kill Shot: The Disjunctive Definition
  *Objection:* "You've just described a disjunctive necessary-and-sufficient definition. A Salt Splice is simply (5 tucks & no wax) OR (3 tucks & wax) OR (Henderson Case). Therefore, family resemblance is empty; it's just a classical category with a complex 'OR' statement."

  *Response:* This objection sinks the case only if you confuse the *extension* (the list of things that are splices) with the *intension* (the method for projecting the concept forward). Yes, for any finite set of past splices, you can construct a disjunctive definition post-hoc. But that definition is useless to the newcomer. It doesn't tell them how to splice a new synthetic rope next year. The family resemblance structure explains *how* the practice projects into the future (by analogy to overlapping features), whereas the disjunctive definition is just a tombstone of past decisions. To claim the disjunction *is* the concept begs the question: it assumes the concept is defined by its history rather than its use. The practice survives the objection because the "rule" isn't the disjunction; the rule is the practice of looking for resemblance.

  ### Family Resemblance vs. Prototype Theory
  *Is this just a prototype classifier?*
  No. Prototype theory (Rosch et al.) suggests categories have **graded membership** (a robin is a "better" bird than a penguin) and **fuzzy boundaries**. My scenario has **binary membership** and **sharp boundaries**.

  *How to tell inside the scenario:*
  Ask the crew: "Is the Henderson splice *less* of a Salt Splice than the five-tuck splice?"
  *   **If Prototype:** They say, "Well, it's not a *great* example, but it counts." (Graded membership).
  *   **If Family Resemblance (as built here):** They say, "It's a Salt Splice. You get the bonus." (Binary membership).

  In my scenario, the features overlap like a family (FR structure), but the social practice draws a hard line around them (Anti-Vagueness). Prototype theory cannot account for the hard line; it predicts fuzziness. Family resemblance describes the *internal structure* of the criteria, not necessarily the *fuzziness* of the boundary. I have kept the structure but sharpened the boundary through communal agreement.
