answer: |-
  # JOINT STATEMENT ON DESERT AND INSTITUTIONS

  ## 1. COMMON GROUND
  **Claims both parties can sign without qualification.**

  1.  **Definition of Terms:** When we use the word "deserve" in this context, we are discussing the normative connection between an individual's actions/outputs and the rewards they receive, not merely the causal history of how the reward was decided.
  2.  **Rejection of Power:** Neither of us believes that "might makes right." Whoever shouts loudest, holds the most power, or occupies the highest office does not automatically deserve the benefits associated with that position.
  3.  **Rejection of Outcome Bias:** Neither of us accepts the argument: "The promotion happened, therefore it was justified." We both deny that the actual outcome proves its own justice.
  4.  **Rejection of Nihilism:** Neither of us believes that the existence of luck requires us to stop distributing rewards based on performance. We both agree that acting *as if* performance matters produces better social outcomes than acting as if it does not.
  5.  **Utility of Belief:** We both agree that maintaining a belief in desert (however defined) is necessary for motivation, cohesion, and planning, even if we disagree on its metaphysical status.
  6.  **The Bad Argument:** We both reject the argument: "She earned it, therefore the outcome is just." We agree that "earning" and "justice" are distinct categories that can come apart.

  ## 2. DISAGREEMENTS TABLE
  **No hedging. No middle ground.**

  | Question | Realist (User) | Institutionalist (Partner) |
  | :--- | :--- | :--- |
  | **The Promotion** | Dave deserved the promotion regardless of the company's rubric. The rubric failed to track the truth. | Dave did not deserve the promotion. The rubric selected you; therefore, within the only framework that exists, you deserved it. |
  | **Truth Conditions** | "Dave deserved it" is true or false based on facts about Dave (effort, skill, output). | "Dave deserved it" is true or false based on facts about the Rulebook (did he meet the criteria?). |
  | **Error** | The company can be wrong about desert. A perfect rubric could still fail to pick the most deserving person. | The company can only be wrong about procedure. If the rubric was followed, no error of desert occurred. |
  | **External Standard** | There is an external standard of value against which the rubric is measured. | The rubric creates the standard of value. There is no "outside." |
  | **Meritocracy** | Meritocracy is a system that attempts to track real, pre-existing desert. | Meritocracy is a story winners tell to legitimize the distribution of resources. |
  | **Unmeasurable Facts** | If Dave deserved it but no one knew, it is still true that Dave deserved it. | If no one could know (even in principle), the claim is empty noise. It changes nothing. |

  ## 3. CRUXES
  **Sub-questions where settling them forces one of us to move.**

  ### Crux 1: Desert vs. Rulebook Swapping
  **The Case:** Same worker, same output. Employer A (generous pay scale), Employer B (stingy pay scale).
  **The Question:** Does "She is underpaid" mean anything past "She would be paid more elsewhere"?

  *   **Realist Prediction:** People will say she is objectively underpaid in Employer B. The verdict survives the swap. There is an amount that fits the work, and Employer B is missing it.
  *   **Institutionalist Prediction:** People will ask "Underpaid by whose scale?" Strip out the comparison class (Employer A) and the verdict goes quiet. The claim is purely relational.
  *   **Relevant Evidence/Argument:** Intuition pumps regarding extreme exploitation. If Employer B pays subsistence and Employer A pays wealth for identical work, does the worker have a *claim* on B based on the work itself, or only a complaint that B's rules are stingy?
  *   **Verbal or Worldly?** **Verbal.** This turns on the definition of "underpaid." If Realist means "paid less than the value created," and Institutionalist means "paid less than the rulebook dictates," you are talking past each other. The worldly fact (the paycheck size) is agreed upon; the label is the fight.

  ### Crux 2: Comparative vs. Absolute Desert
  **The Case:** She is the only candidate. No runner-up.
  **The Question:** Could it still be true that she deserved it, or is deserving always deserving-more-than-someone?

  *   **Realist Prediction:** Yes. Desert is a fit between a person and a reward. A lone survivor on an island deserves the coconuts they gather regardless of competition.
  *   **Institutionalist Prediction:** No. Desert is inherently a ranking mechanism within a pool. Without a pool, "deserve" collapses into "eligible."
  *   **Relevant Evidence/Argument:** Robinson Crusoe scenarios. If one person exists, do concepts of justice apply? Realist says yes (self-justice); Institutionalist says no (justice is social).
  *   **Verbal or Worldly?** **Worldly.** This is a fundamental split on whether value is intrinsic to the act or assigned by the social context. Settling this changes how you evaluate solo achievements vs. team rankings.

  ### Crux 3: The Ubiquity of Luck
  **The Case:** Luck undermines desert?
  **The Question:** Does luck kill desert entirely, or only make it hard to apply?

  *   **Realist Prediction:** Luck complicates the calculation but doesn't erase the core link. If luck undermined desert, it would equally undermine the student who studied all night, which nobody believes. There is a residue of agency that remains.
  *   **Institutionalist Prediction:** The Realist retreats to the part that isn't luck, and that residue keeps shrinking till it's empty. Genetics, upbringing, and opportunity permeate everything. The "agency" residue is a fiction used to justify inequality.
  *   **Relevant Evidence/Argument:** Genetic lottery vs. Study effort. Can we isolate the effort? If the capacity to study is genetic, does the study count?
  *   **Verbal or Worldly?** **Worldly.** This is a dispute about human agency and causality. If the Institutionalist is right, "merit" is a myth. If the Realist is right, "merit" is noisy but real.

  ### Crux 4: Unmeasurable Facts
  **The Case:** A desert fact nobody can measure.
  **The Question:** If it's true Dave deserved it and no one could ever know, does that change what anyone should do?

  *   **Realist Prediction:** Yes. It constrains which schemes are just. A system that systematically ignores the truth is unjust, even if the truth is hidden.
  *   **Institutionalist Prediction:** No. An unknowable constraint isn't a constraint. If it changes no behavior and predicts no outcome, it is not a fact, it is a feeling.
  *   **Relevant Evidence/Argument:** Secret injustices. Does it matter if a crime goes undetected forever? Realist says the universe is marred; Institutionalist says nothing has changed.
  *   **Verbal or Worldly?** **Verbal.** This is a dispute about the definition of "fact." Realist includes normative truths; Institutionalist requires empirical verification.

  ### Crux 5: Fit vs. Claim
  **The Case:** Fit between person/reward vs. Claim on others.
  **The Question:** Is desert a property of the person or a debt owed by the group?

  *   **Realist Prediction:** It is a fit (like a key in a lock). Something can fit while nobody owes you anything (e.g., in a vacuum).
  *   **Institutionalist Prediction:** It is a claim. Desert implies a debtor. If no one owes you, you don't deserve it. These come apart because something can fit while nobody owes you anything.
  *   **Relevant Evidence/Argument:** Private achievement vs. Public reward. If you write a masterpiece in a locked room and burn it, did you deserve acclaim? Realist says yes (fit); Institutionalist says no (no social transaction).
  *   **Verbal or Worldly?** **Verbal.** This is purely about how we map the word "deserve." Realist uses it aesthetically/normatively; Institutionalist uses it transactionally.

  ### Crux 6: Meritocracy (System vs. Story)
  **The Case:** The definition of Meritocracy.
  **The Question:** Does meritocracy name a system or just the story the winners tell about it?

  *   **Realist Prediction:** It names a system that *aims* to track real desert. It can fail, but the aim is real.
  *   **Institutionalist Prediction:** It names the story winners tell to legitimize their status. The "aim" is part of the story.
  *   **Relevant Evidence/Argument:** Historical analysis of who calls themselves meritocratic. Do losers ever call the system meritocratic? (Usually no). Do winners? (Usually yes).
  *   **Verbal or Worldly?** **Worldly.** This is a sociological claim about power dynamics. If the Institutionalist is right, "Meritocracy" is a propaganda term, not a structural description.

  ## 4. DIAGNOSTIC NOTE
  **On the nature of our dispute.**

  A significant portion of this conflict is **Verical**, not Worldly.
  *   **Realist Column:** You are using moral language to describe objective facts. You feel the Institutionalist is denying reality.
  *   **Institutionalist Column:** Your partner is using sociological language to describe power structures. She feels you are reifying a social construct.

  **Hard Truth:**
  If the Realist column is just your side of a verbal dispute, it is because you are treating "desert" as a physical property like mass or height. It is not. It is a normative judgment.
  If the Institutionalist column is just her side of a verbal dispute, it is because she is treating "rules" as the only reality. Rules are made by people who are subject to the same normative judgments.

  **Resolution Path:**
  You will not solve this by proving who is right about the world. You will solve this by agreeing on which vocabulary serves the household better.
  *   Use **Realist** language when motivating behavior, raising children, or assessing personal integrity.
  *   Use **Institutionalist** language when analyzing company politics, negotiating salary, or managing expectations about outcomes.

  **Signatures:**

  _________________________ (Realist)

  _________________________ (Institutionalist)
