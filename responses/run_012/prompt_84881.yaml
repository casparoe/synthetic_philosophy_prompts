  3. Switching from rankings to scores changes the input type from ordinals to cardinals, which sidesteps the theorem by altering the message protocol rather than solving the underlying coordination problem. This escapes the specific impossibility result but invites different attacks, such as normalization strategies where agents exaggerate scores to maximize influence, effectively reintroducing manipulation through a different API surface. You are changing the subject to a different mechanism design space, not fixing the original merge function.

  4. The translation loses the normative definition of welfare, as your framework models agents optimizing local state without a global objective function to maximize beyond liveness and safety. Economics assumes a utility structure that defines why manipulation is bad, whereas your distributed systems view treats deviation merely as protocol violation or Byzantine behavior. This residue indicates the original result relies on social choice axioms that have no direct equivalent in state machine replication.

  5. This residue is not a gap in your vocabulary but a sign that the original result is doing normative work your framework has no slot for, specifically defining what constitutes a legitimate outcome beyond consistency. Your tools verify correctness against a specification, but mechanism design questions the specification itself when agents are self-interested rather than fail-stop. You cannot engineer away the incentive mismatch without explicitly encoding a policy decision about whose utility matters.
