answer: |-
  0.72

  **Terms of Credence**

  1.  **0.90 — Divergent Definitions of 'Nature' (*Xing*):** Mencius defines nature teleologically (what a thing is *for*), while Xunzi defines it biologically (what a thing *is* at birth), allowing both descriptions to apply to the same human without contradiction.
  2.  **0.85 — Mencius on Incipient Motivations:** Mencius's "sprouts" are fragile tendencies requiring environment, compatible with Xunzi's claim that raw impulses alone cannot sustain social order.
  3.  **0.65 — Xunzi on Innate Malice:** Xunzi's "badness" refers to the *consequences* of unchecked desire (chaos), not an intrinsic evil will, which aligns with Mencius's warning that sprouts can be lost.
  4.  **0.55 — The Instability of *Wei* (Artifice):** Xunzi struggles to explain the origin of the Sage's capacity to create ritual without presupposing the very moral intuition Mencius claims is innate.
  5.  **0.80 — Surviving Practical Disagreement:** Even if the metaphysical claims are compatible, the prescriptive advice (trust the heart vs. submit to the teacher) remains mutually exclusive in practice.

  **Synthesis and Sensitivity**

  The number 0.72 reflects a high probability that the *metaphysical* dispute is verbal, tempered by the significant *ethical* divergence that remains. The calculation rests heavily on the first term (Definitions of Nature); if Mencius and Xunzi are using the word *xing* to point at different phenomena, their core assertions do not collide. However, I have weighted the fourth term (The Instability of *Wei*) as the critical variable. If Xunzi cannot account for the human capacity to recognize and accept ritual without smuggling in a Mencian "sprout," his system collapses into Mencius's, making the dispute not verbal but a case of Xunzi failing to see his own premises.

  **Sensitivity:** The final number is most sensitive to **Term 4 (The Instability of *Wei*)**. If you can demonstrate that Xunzi has a coherent epistemology where cognitive intelligence (distinct from moral intuition) allows the Sages to invent ritual, the credence rises toward 0.85. If Xunzi relies on an unexplained "love of order" that looks suspiciously like a moral sprout, the credence drops toward 0.40, implying Xunzi is arguing in bad faith or self-deception.

  **What Would Move Me**

  Nothing in the existing texts would move me significantly, as they are already the data set. What would move me is a **rigorous reconstruction of Xunzi's epistemology of the Sage**. Specifically, an account of how the first Sage King, possessing the same "bad" nature as everyone else, perceived the need for ritual without already possessing a moral standard to judge chaos as "bad." If that reconstruction holds water without relying on hidden Mencian assumptions, the dispute becomes substantially verbal (they agree on facts, disagree on labels and methods). If it fails, the dispute is substantive (Xunzi is describing a different psychology).

  **Settling the Question**

  The question cannot be "settled" in the empirical sense because it concerns normative definitions, not empirical facts. However, it would be **dissolved** if we possessed a transcript of a debate where they agreed on a definition of *xing* before arguing. Lacking that, "settling" is the wrong goal; "mapping" is the right one. A settlement would require a third-party contemporary (like a Mohist logician) explicitly analyzing their definitions of *xing* and declaring them non-contradictory. Since no such text exists, the ambiguity is a feature of the tradition, not a bug to be fixed.

  **Historical vs. Strongest Versions**

  My number would **increase** (closer to 0.85) if we asked what the **historical** Mencius and Xunzi thought. Historically, they were likely talking past each other, utilizing inherited vocabulary differently without realizing the category error. My number would **decrease** (closer to 0.55) if we asked what the **strongest versions** of their positions come to. When steelmanned, Mencius argues for the *necessity* of inner authority, and Xunzi argues for the *necessity* of outer authority; these are substantive, incompatible claims about where moral truth resides, regardless of how "nature" is defined.

  **Texts vs. Interpretive Literature**

  The number depends **more on the interpretive literature** (specifically 20th-century comparative philosophy like A.C. Graham and Donald Munro) than on the texts themselves. The texts are terse and aphoristic; the "verbal dispute" theory is a charitable reconstruction imposed by modern scholars to make the system coherent. A raw reading of the texts suggests two men passionately insisting the other is wrong, which feels substantive. The "verbal" conclusion is a product of later analysis trying to reconcile the canon.

  **Note on Your Hedging**

  Your suspicion about the instability in Xunzi is well-founded. The 0.55 credence I assigned to Term 4 reflects that exact unease. It is not merely an artifact of reading Xunzi through Mencian lenses; it is a genuine structural tension in Xunzi's text (specifically *Xunzi*, Chapter 23, "Human Nature is Bad"). He asserts humans *can* become good, yet denies they have the *material* to do so without external aid. If the "capacity to be aided" is not part of nature, what is it? If it is part of nature, Mencius wins. This tension is the dramatic engine your characters should exploit: the younger teacher (Xunzi) must explain why we listen to the ritual master if we don't already have a spark that recognizes the master's authority. The older teacher (Mencius) will press that the recognition *is* the spark.
