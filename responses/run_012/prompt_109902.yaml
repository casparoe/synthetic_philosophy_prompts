answer: |-
  ### Part I: The Carrying Example

  **Verdict:** Build on **Mercury/GR**, but with a specific framing to neutralize its risks.

  **Evaluation of the Three:**
  1.  **Native Speaker:** Reject. Your intuition is correct. The certainty here is *constitutive* of the speaker's competence, not *evidential* for a theory of the language. Using this invites the objection that the paradox arises only because we have misclassified grammatical competence as empirical evidence. It makes the problem look like a category error rather than a structural difficulty in confirmation theory.
  2.  **Cryptographic:** Strong runner-up. It is self-contained and avoids historical quibbles. However, for a philosophy of *science* seminar, it risks feeling like a problem of *decryption* rather than *theory confirmation*. It may disengage the physicist and the historian, who are your key resources for grounding the discussion in scientific practice.
  3.  **Mercury/GR:** Use this. The "usual reasons" for steering clear (historical inaccuracy regarding Einstein's motivation) are irrelevant to the *logical* problem. The problem is not whether Einstein *felt* confirmed, but whether the *community* was rational to increase confidence in GR given $E$.
      *   **What is actually wrong with it:** The only genuine risk is the Historian in your room. If you present it as "Einstein discovered GR and then checked Mercury," the Historian will object that Einstein used heuristics, not Bayesian updating.
      *   **How to fix it:** Frame it immediately as a **Community Confirmation Problem**, not an individual psychology problem. The "agent" is the scientific community in 1915. $E$ (the anomaly) was in the community's background corpus $K$. $H$ (GR) is new. The question is whether $H$ is confirmed by $E$ for *that* community. This utilizes the Historian's expertise (they know the community knew $E$) without inviting pedantry about Einstein's private notes.

  **Criteria for a Carrying Example:**
  To carry the whole session, an example must have:
  1.  **High Certainty:** $P(E) \approx 1$ is not an idealization but a feature of the case (Mercury's perihelion was a fixed datum).
  2.  **Theoretical Novelty:** The hypothesis $H$ must be genuinely new, so we cannot say $H$ was constructed *to fit* $E$ (which would invite ad-hocery objections).
  3.  **Intuitive Confirmation:** It must be overwhelmingly intuitive that $H$ *is* confirmed by $E$, so the Bayesian verdict (no confirmation) feels like a genuine failure, not a counter-intuitive truth.

  Mercury meets all three. The Native Speaker fails (3). The Crypto case meets (1) and (3) but is weak on (2) for a science seminar.

  ---

  ### Part II: The Spine (Acquired vs. Digested)

  **Can it bear the structural weight?**
  Yes, but only if you formalize it immediately. If you leave "digested" as a psychological metaphor (familiarity, lack of surprise), it **will collapse into the counterfactual fix**.

  **The Collapse:**
  The counterfactual fix asks: "What credence would you assign to $E$ if you didn't know it?" Your "digested" distinction asks: "Is $E$ absorbed into your background?" If "absorbed" just means "I can't treat it as uncertain," then the counterfactual asks "What if you could?" The distinction becomes merely a description of the problem, not a solution.

  **How to Shore It Up:**
  You must redefine "Digested" not as a psychological state, but as a **syntactic status in the probability space**.
  *   **Acquired:** An event in the sample space $\Omega$ that can be conditioned upon.
  *   **Digested:** A constraint on the probability function itself (part of the domain definition).

  **Recommendation:**
  Adopt the distinction, but rename it for the board to prevent psychological slippage. Use **"Evidence as Event" vs. "Evidence as Constraint."**
  *   *Why:* This satisfies the Statisticians (it's about the sigma-algebra) and the Historians (it's about what counts as 'given' in a historical context).
  *   *If it collapses:* If you find the room treating "digested" as "familiar," pivot immediately to **Logical Omniscience**. The real spine is the tension between *ideal rationality* (where all logical consequences are known) and *bounded rationality* (where learning a theory teaches you new logical relations about old facts).

  ---

  ### Part III: The 75-Minute Sequence

  **Guiding Principle:** The Historians switch off after 20 minutes of algebra; the Statisticians object after 20 minutes of hand-waving. You must interleave.

  **00:00 – 00:15: The Hook (Narrative)**
  *   **Content:** The Mercury case. Establish that the anomaly was known (1859), GR arrived (1915), and the fit was perfect. Ask: "Did GR gain support from this?" (Everyone says yes). "Did the anomaly become *more* certain?" (No, it was already certain).
  *   **Why here:** You must engage the Historian and Physicist immediately. If you start with Bayes' Theorem, the Historian disengages.
  *   **Refusal:** Refuse to discuss the *history* of Einstein's discovery process. State: "We are not doing intellectual history; we are modeling the rationality of the community's belief state."

  **00:15 – 00:30: The Formalism (The Trap)**
  *   **Content:** Write the Likelihood Ratio (LR) formulation of confirmation.
      *   $C(H, E) = \frac{P(E|H)}{P(E|\neg H)}$
      *   Establish that confirmation requires $LR > 1$.
      *   Introduce the "Old Evidence" condition: $P(E) = 1$.
      *   Derive the paradox: If $P(E)=1$, then $P(E|H)=1$ and $P(E|\neg H)=1$. Thus $LR = 1$. No confirmation.
  *   **Why LR before Paradox:** You are correct; the paradox is invisible in the difference measure ($P(H|E) - P(H)$) unless you explicitly derive the conditional probabilities. The LR formulation makes the *predictive symmetry* of old evidence explicit. It shows that $H$ predicts $E$ no better than $\neg H$ does, because $E$ is already true.
  *   **Why not earlier:** You cannot motivate the formalism without the narrative hook. If you start with LR, the Historians see symbols, not science.
  *   **Refusal:** Refuse to derive Bayes' Theorem from axioms. Assume the probability calculus as given. The Statisticians will accept this; the Philosophers need to see the *application*, not the foundation.

  **00:30 – 00:45: The Spine (Event vs. Constraint)**
  *   **Content:** Introduce your distinction.
      *   "Acquired" = $E$ is a variable in the space.
      *   "Digested" = $E$ is a boundary condition ($P(E)$ is fixed at 1).
      *   Argue that standard Bayesianism treats all known facts as "Digested" (constraints), which kills confirmation.
      *   Propose: To model confirmation, we must treat old evidence as an "Event" relative to the *new theory*.
  *   **Why here:** This is the conceptual bridge. You have shown the math fails (00:15-00:30). Now you offer the conceptual tool to fix it.
  *   **Risk Management:** If the Statisticians object that "a constraint is just a conditional probability," concede the point but insist the *partition* has changed. This is where you prevent the collapse into the counterfactual.

  **00:45 – 01:00: The Solution Space (Logical Omniscience)**
  *   **Content:** Explain *why* we treat digested evidence as constraints. It's because we assume agents know all logical consequences of their beliefs (Logical Omniscience).
      *   If the agent is not logically omniscient, learning $H$ teaches them that $H \to E$.
      *   The confirmation comes not from $E$, but from the logical relation $(H \to E)$.
  *   **Why here:** This satisfies the Philosophers (it's a classic move) and the Statisticians (it relaxes an idealization). It saves your "Acquired/Digested" spine by grounding it in computational limits.
  *   **Refusal:** Refuse to evaluate specific solutions (e.g., Garber vs. Ur-Priors). State: "There are technical fixes, but the structural lesson is the relaxation of omniscience."

  **01:00 – 01:15: Synthesis and Discussion**
  *   **Content:** Return to the Mercury case. Re-evaluate in light of the "Logical Relation" move.
  *   **Why here:** You must close the loop with the Historian and Physicist. Does this model match scientific practice? (Scientists feel confirmed when they realize their theory *entails* an old fact).

  ---

  ### Part IV: Misconceptions and Interceptions

  1.  **The "Just Update" Misconception (Statisticians)**
      *   *When:* Minute 25, immediately after you derive $LR=1$.
      *   *The Thought:* "Why not just set $P(E) = 0.99$? Real data is never certain."
      *   *Interception:* Head this off *before* the derivation. State: "We are not modeling measurement error. We are modeling the status of a *known fact* in a logical system. If we allow uncertainty on $E$, we dissolve the problem, but we also dissolve the idealization that makes Bayesianism tractable."
  2.  **The "Historical Psychology" Misconception (Historian/Philosophers)**
      *   *When:* Minute 10, during the hook.
      *   *The Thought:* "But Einstein didn't actually think in probabilities."
      *   *Interception:* State explicitly in the first 5 minutes: "We are not modeling Einstein's brain. We are modeling the *rational justification* available to the community."
  3.  **The "Ad-Hocery" Confusion (Physicist/Philosophers)**
      *   *When:* Minute 40, during the Solution Space.
      *   *The Thought:* "If the theory was built to fit the data, it's ad-hoc. If it wasn't, it's prediction. This problem mixes them."
      *   *Interception:* Distinguish *construction* from *confirmation*. The problem of old evidence arises even if $H$ was not constructed to fit $E$ (as in the community case). Keep the focus on *confirmation*, not *heuristic discovery*.
  4.  **The "Psychological Digested" Collapse (Everyone)**
      *   *When:* Minute 35, during the Spine.
      *   *The Thought:* "Digested just means I'm bored of this fact."
      *   *Interception:* Write the definition on the board. "Digested = Removed from the Sigma-Algebra of updatable events." Force the formal definition.

  ---

  ### Part V: The Final Question

  Do not ask: "What is the problem of old evidence?" (This tests recitation).
  Do not ask: "How does Garber solve it?" (This tests reading you didn't assign).

  **Ask this:**
  > "If we accept that confirmation comes from learning the *logical relation* between $H$ and $E$, rather than learning $E$ itself: Does a computer that verifies the entailment $H \to E$ gain the same confirmation as a scientist who understands it? If not, what does that tell us about whether confirmation is logical or psychological?"

  **Why this works:**
  *   It forces them to use the "Logical Omniscience" structure you built in the last 30 minutes.
  *   It pits the Statisticians (logic is logic) against the Philosophers/Historians (understanding matters).
  *   It tests whether they grasped the *spine* (Event vs. Constraint/Relation) without asking them to define it.
  *   It reveals if they see the paradox as a technical glitch or a deep feature of how knowledge works.
