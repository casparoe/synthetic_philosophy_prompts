  ok so for the phil of mind seminar I've got to write on Dennett's four kinds of creatures (Darwinian, Skinnerian, Popperian, Gregorian) and I want to use AlphaGo as my case instead of the usual bee and chimp examples everyone does. here's the episode as I've got it from lecture, correct me if I've botched anything: March 2016, Seoul, AlphaGo beats Lee Sedol 4-1, and the bit everyone remembers is move 37 in game two, the move commentators kept saying no human would have played. It learned by reinforcement learning from playing itself, but it had also been fed a big corpus of human games first. Then the 2017 follow up was trained on nothing but the rules and self play, no human games at all, and it beat the version that beat Lee Sedol every game — a hundred to nothing I think.

  So run the taxonomy over that and commit. Is the reinforcement learning the Skinnerian level? Is the search the Popperian one, since it does seem to test candidate lines internally and let the bad ones die instead of itself? And is the human game corpus a Gregorian mind tool that AlphaGo merely borrows, which would make it Gregorian by courtesy — in which case what does the self play version do to that rung? Is Gregorianness about having the tools in your own head, or just about where the competence came from?

  Then the direction I actually care about, where the case breaks the theory. The ladder is supposed to be a ladder of increasing freedom — from the immediate environment, from your own conditioning, from your own past — and yet the self play version ends up stronger than any human while (on Dennett's later line that competence doesn't require comprehension) understanding nothing at all. So either the top rung was never about minds, or the four kinds are a taxonomy of where abilities come from rather than a taxonomy of minds. Say which, and say it plainly.

  Two side things while your at it: does the intentional stance make trouble, given we're clearly warranted in predicting the thing as an agent even though it never reaches the top of the ladder; and what happens to the boundary if a crow bends wire to fish out food — if that counts as a mind tool then Gregorian isn't the human level and the name is doing no work. Dont pad it with the history of Go and dont turn it into an essay about AI risk, thats a different paper. Where the taxonomy is just silent, say so instead of forcing it to speak.
