      *   **Task:** Provide a reading of the film through the lens of precedent autonomy, addressing specific details (Sammy Jankis, the Polaroids, the tattoos, the ending, the role of surrogates like Teddy/Natalie). Address the "it's not a real medical case" objection. Conclude with what the film shows that the literature doesn't (the nature of the tradeoff). Recommend 2-3 specific scenes for the board.
      *   **Tone:** Academic, engaging, respectful of the user's expertise, avoiding oversimplification. It needs to match the user's level of insight (they've already spotted the Sammy Jankis twist, the self-deception, and the surrogate problem).

  2.  **Deconstruct the Philosophical Framework:**
      *   **Dworkin (Precedent Autonomy):** Critical interests (life as a narrative whole) > Experiential interests (current comfort/desires). The "then-self" binds the "now-self."
      *   **Dresser (Current Interests):** The "now-self" is a different person (or at least deserves moral standing). Binding them to a past self's wishes is tyranny.
      *   **Parfit (Psychological Connectedness):** Identity isn't what matters; connectedness is. Leonard has low connectedness.
      *   **The Film's Twist:** Leonard's "then-self" is unreliable, manipulative, and potentially criminal. The "now-self" is weaponized by the "then-self."

  3.  **Drafting the Core Argument (The "Reading"):**
      *   *The Setup:* Leonard is the ultimate test case for Dworkin. He has explicitly codified his critical interests (find John G, avenge wife) via tattoos and notes.
      *   *The Problem:* The "then-self" (sober, investigating) is not benevolent. He is crafting a narrative to allow himself to continue living as a vigilante. The "now-self" (amnesiac) is a tool.
      *   *Dworkin vs. Dresser:* Dworkin would say honor the tattoos (critical interests). Dresser would say the current Leonard is being exploited. But *Memento* suggests something darker: The "then-self" isn't acting out of *critical interests* in the Dworkinian sense (a good life), but out of *avoidance*. He is manufacturing a purpose to avoid grief/guilt.
      *   *Parfit:* Leonard proves Parfit right (connectedness is broken), but the film shows that *institutionalizing* that break (via the tattoo system) creates a monster.
      *   *The "Cheat":* The film cheats on the *benevolence* assumption. Advance directives assume the past self wanted the best for the future self. Leonard's past self wants the future self to be a weapon.

  4.  **Addressing Specific Details:**
      *   *Sammy Jankis:* This is the crux. Leonard projects his own failure onto Sammy. If Leonard is Sammy, his "directive" is based on a lie. The "competent self" was deluded. This undermines the epistemic authority Dworkin grants the prior self.
      *   *The Polaroids/Tattoos:* These are the "legal documents." But they are falsifiable. Leonard chooses to burn the truth (Teddy's photo) and keep the lie (the license plate). This is *retroactive directive creation*. He is editing the past to control the future.
      *   *Surrogates (Teddy/Natalie):* They highlight the interpretation problem. A directive is text; life is context. Without the context (which Leonard loses), the text is weaponizable. The film suggests directives *require* a trustworthy surrogate, but Leonard's system *excludes* trust (hence the tattoos). This makes the system brittle and corruptible.

  5.  **Addressing the "Not a Medical Case" Objection:**
      *   *Objection:* No hospital, no death, no legal standing.
      *   *Rebuttal:* It removes the "medical noise" to isolate the *moral structure*. In hospitals, we assume benevolence (doctors/family want the best). *Memento* removes benevolence. It shows the raw mechanics of binding a future self. It's not cleaner; it's *starker*. It reveals that precedent autonomy relies on the *continuity of values*, not just continuity of memory. When values are corrupted (vengeance vs. healing), the directive becomes a shackle.

  6.  **What the Film Shows That Arguments Don't:**
      *   Arguments frame it as Respect (Past) vs. Welfare (Present).
      *   The film frames it as *Narrative Control*. The past self isn't just saying "don't resuscitate"; it's saying "this is who you are." Leonard's tragedy is that he *chooses* the shackle because freedom (facing the truth) is too painful.
      *   Authority rests on *desperation*, not rationality. The earlier self binds the later self not because he knows best, but because he can't bear to let go.

  7.  **Selecting Scenes:**
      *   *Scene 1: The Sammy Jankis Revelation (Teddy in the car/breakfast).* Establishes the unreliability of the "competent self."
      *   *Scene 2: Burning the Polaroid/Getting the Tattoo (The Ending).* Shows the active choice to deceive the future self. This is the "advance directive" being written in real-time.
      *   *Scene 3: Natalie's Diner Scene.* Shows how surrogates manipulate the directives. She reads his notes and uses them to make him hurt someone.

