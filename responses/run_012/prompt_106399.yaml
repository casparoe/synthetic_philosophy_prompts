answer: |-
  This is a brilliant way to close the unit. You are right that *Memento* isolates the mechanism of precedent autonomy in a way clinical cases cannot, precisely because it strips away the assumption of benevolence that undergirds almost all bioethical literature. Dworkin and Dresser argue over *who* decides, assuming both selves (and the surrogates) are acting in good faith toward the patient's good. *Memento* asks what happens when the "earlier self" is acting in bad faith toward the "later self," and when the "later self" is complicit in that bad faith.

  Here is a reading of the film through the precedent-autonomy debate, structured for your seminar.

  ### 1. The Verdict on Precedent Autonomy
  The film does not come down on the side of Dworkin or Dresser; rather, it dismantles the epistemic foundation required for Dworkin's argument to function.

  Dworkin's defense of precedent autonomy rests on the idea that the competent self has **critical interests** that constitute the integrity of a life. When Leonard tattoos "Fact 6: John G. raped and murdered my wife" onto his thigh, he is codifying a critical interest. He is saying, "My life has meaning only if this narrative is completed." The amnesiac Leonard (the present self) has only **experiential interests** (finding a place to sleep, avoiding pain, satisfying immediate curiosity).

  However, Dworkin assumes the earlier self is *rational* and *truth-tracking*. *Memento* reveals that the earlier self can be pathologically self-deceptive. If the "Sammy Jankis" story is indeed Leonard's own story (as Teddy suggests), then the "competent" Leonard who wrote the directives was suffering from a psychogenic block, not just organic damage. He constructed a mythology to allow himself to continue hunting.

  Therefore, the film suggests that precedent autonomy fails not because the present self matters more (Dresser), but because the past self's authority is contingent on **truthfulness**, not just competence. Leonard's system creates a closed loop where the directive cannot be questioned because the capacity to question (memory) is gone. The film argues that without the possibility of *revision*, a directive is not an expression of autonomy, but a mechanism of entrapment. Leonard isn't honoring his wife; he is honoring his own inability to grieve.

  ### 2. Where the Film Cheats (and Why It Matters)
  You asked where the film cheats. It cheats on the **benevolence condition**.

  In bioethics, we assume the advance directive is a gift from the past self to the future self: "I know what is best for us, so I am sparing you this burden." In *Memento*, the directive is a weapon. The "earlier self" (the Leonard who burns the photo) knows the "later self" will be confused, vulnerable, and easily manipulated. He deliberately creates a false reality (the license plate tattoo) to ensure the later self continues a violent task.

  This breaks the Dworkinian justification. Dworkin argues we respect the past self because it holds the "critical interests" of the life as a whole. But Leonard's "life as a whole" is a lie. The film shows that if psychological connectedness (Parfit) is severed, the "earlier self" becomes a stranger—and in this case, a hostile stranger.

  **The Surrogate-Interpreter Problem:**
  You noted that Teddy and Natalie steer him by reading his notes. This is the crucial institutional critique. An advance directive is text; medicine (and life) is context.
  *   **Natalie:** She reads his notes, sees he is looking for a man with a car, and realizes she can use him to kill her boyfriend's rival. She exploits the *rigidity* of his directive system.
  *   **Teddy:** He tries to be the honest surrogate ("I'm telling you the truth"), but because Leonard cannot retain the information, Teddy's honesty is useless. Leonard *chooses* the lie (the tattoo) over the truth (the phone call).

  The film treats this not as a corruption of the system, but as the **inevitable outcome of a system without trust.** Leonard's tattoos are an attempt to remove the need for human surrogates ("I can't trust anyone"). But by removing the surrogate, he removes the only mechanism capable of interpreting the *spirit* of the directive rather than the *letter*. The film argues that directives without interpreters are algorithms, and algorithms can be gamed.

  ### 3. The "Not a Medical Case" Objection
  Take the objection seriously: Leonard isn't dying, there's no PVS, no hospital committee. Is the analogy cheap?

  **It matters, but not in the way the objection suggests.**
  In a medical context, the "end" is usually death or permanent incapacity. The stakes are biological survival. In *Memento*, the stake is *narrative survival*.
  *   **Why it's cleaner:** It removes the "sanctity of life" variable. We aren't arguing about whether Leonard should live or die; we are arguing about *how* he should live. This isolates the autonomy question from the sanctity-of-life question.
  *   **Why it's starker:** In a hospital, the "earlier self" usually writes a directive to *prevent* suffering (e.g., "no heroic measures"). Leonard writes his directive to *ensure* suffering (vigilantism). This reveals that precedent autonomy can be used to mandate harm, not just prevent it.

  So, the amnesia version is not cleaner; it is **radicalized**. It shows that the problem isn't just about medical treatment; it's about whether a past self can conscript a future self into a project the future self cannot understand. If you accept Leonard's right to tattoo a murder mission onto his own skin, you must accept a dementia patient's right to mandate a course of treatment that causes them present agony for a "critical interest" they can no longer comprehend. *Memento* makes the latter look much more dubious.

  ### 4. What the Film Shows That the Argument Can't
  Your students see Dworkin vs. Dresser as **Respect (Past) vs. Welfare (Present)**.
  *Memento* shows that the tradeoff is actually **Meaning (Past) vs. Truth (Present)**.

  *   **Ownership:** The film suggests the earlier self's authority rests on *desperation*, not rationality. Leonard binds himself because he cannot bear the freedom of a blank slate. If he stops hunting John G., he has to remember that he might have killed his wife himself (via insulin). The directive is a shield against guilt.
  *   **The Tradeoff:** Dworkin thinks respecting the past self respects the "whole life." *Memento* shows that respecting the "whole life" might require destroying the "present person." But the twist is that the **present person wants this.** Leonard *chooses* to burn the photo. He *chooses* the tattoo.

  This complicates Dresser. Dresser argues the present self is a new person who deserves a fresh start. But Leonard's present self *rejects* the fresh start. He actively manufactures the chains. The film suggests that sometimes, the "experiential interests" of the present self are to be enslaved by the past self, because the alternative (truth) is psychologically annihilating.

  The film shows that advance directives are not just legal documents; they are **identity maintenance technologies.** We use them to ensure we remain who we think we are, even when we no longer are.

  ### 5. Scenes for the Board
  If I were you, I would put these three images/scenes on the board to anchor the discussion:

  **1. The Sammy Jankis Revelation (Teddy in the Jaguar)**
  *   *Context:* Teddy explains that Sammy was a con man, but Leonard conditioned himself to believe Sammy had a wife to test his own condition. The implication: Leonard's "competent self" gaslit himself.
  *   *Philosophical Point:* **Epistemic Authority.** If the "competent self" is capable of profound self-deception regarding the very facts that ground the directive, does the directive hold? This attacks the Dworkinian assumption that the prior self knows its "critical interests" best.

  **2. Natalie in the Diner (Reading the Notes)**
  *   *Context:* Natalie reads Leonard's notes about "the man with the car" and realizes she can manipulate him. She insults him, waits for him to write "Natalie: Help" on the back of a photo, and then uses that "directive" to send him to kill Dodd.
  *   *Philosophical Point:* **The Surrogate Problem.** Directives are text; life is context. Without a memory to hold the context, the text is weaponizable. This illustrates the danger of "strict compliance" with advance directives when the interpreter is hostile.

  **3. The Ending (Burning the Polaroid / The Tattoo)**
  *   *Context:* Leonard knows Teddy told him the truth (that the real John G. is dead, and Leonard has killed him already). Leonard chooses to burn the photo of the dead body, writes a fake license plate on the back of Teddy's photo, and tattoos it as "Fact."
  *   *Philosophical Point:* **Active Self-Binding.** This is the money shot. This isn't the past self binding the future self; this is the *current* self binding the *future* self, knowing it is a lie. It reframes the advance directive not as a protection of rights, but as a **willful surrender of autonomy** to avoid the pain of truth. It asks the class: Is it ethical to bind your future self to a lie if the truth makes life unlivable?

  ### Closing Thought for the Seminar
  End with this: The literature asks, "Who decides?" *Memento* asks, "Why do we want to decide?" We write advance directives because we are terrified of the stranger we will become. Leonard shows us that if we hate that stranger enough, we will turn him into a weapon rather than let him be free. That is the dark shadow of precedent autonomy: it allows the dead to haunt the living, even when the living and the dead are the same person.
