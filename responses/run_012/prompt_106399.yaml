      *   *Philosophical Precision:* Use terms like "critical interests," "experiential interests," "psychological connectedness," "epistemic authority."
      *   *Structure:* Follow the user's prompt flow (Reading -> Details/Cheat -> Objection -> What Film Shows -> Scenes).

