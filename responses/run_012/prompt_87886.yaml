      *   *Addressing the Hypothesis:* If it were merely verbal, distinguishing "counterfactual" vs. "ability" would solve it. But PAP defenders argue the *ability* requires the *counterfactual openness*. Frankfurtians argue the *ability* is compatible with *counterfactual closure*. This is a metaphysical claim, not a linguistic one.
