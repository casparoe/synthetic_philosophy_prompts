answer: |-
  Your hypothesis is astute in identifying the linguistic friction, but mistaken in its optimism that distinguishing the readings will dissolve the impasse. The disagreement is not merely verbal, nor is it simply that one side asks about grounds while the other asks about modal facts. Both sides are asking the same question: *What are the necessary conditions for moral responsibility?* The stalemate persists because the dispute is **substantive**, turning on a deep metaphysical divergence regarding the nature of **control** (Sourcehood vs. Leeway), which the ambiguity of "could have done otherwise" merely masks.

  Here is the diagnosis, the evaluation of your hypothesis, the check case, and the definition of progress.

  ### 1. Diagnosis: Substantive Divergence Masked by Equivocation

  The dispute is substantive, not verbal. However, the verbal ambiguity you identified allows the substantive disagreement to hide.

  *   **The Frankfurtian (Compatibilist) Position:** They view responsibility as grounded in the **Actual Sequence**. What matters is whether the action issued from the agent's own mechanisms (reasons-responsiveness, character, volition) without external coercion or pathology. For them, "could have done otherwise" is either false (and irrelevant) or true only in a weak, dispositional sense (e.g., "she would have done otherwise if she had chosen"). The "flicker" of freedom defended by PAP proponents is dismissed as irrelevant because it does not contribute to the *actual* control exercised in the actual sequence.
  *   **The PAP Defender (Libertarian/Incompatibilist) Position:** They view responsibility as grounded in **Alternative Sequences** (Leeway). What matters is whether the agent was the *ultimate source* of the action, which requires that the causal chain was not settled prior to the choice. For them, "could have done otherwise" refers to a robust, categorical openness in the world. The "flicker" is not a trivial detail; it is the necessary locus of that openness. If the flicker is removed, the agent is merely a conduit for prior causes, and responsibility vanishes.

  **Why your hypothesis is partially mistaken:**
  You suggest one side asks about grounds and the other about modal facts. In reality, both sides link grounds and modal facts, but they link them differently.
  *   Frankfurtians argue: Grounds (Actual Sequence) $\rightarrow$ Responsibility. (Modal facts are independent).
  *   PAP Defenders argue: Modal Facts (Alternative Possibilities) $\rightarrow$ Grounds (Ultimate Sourcehood) $\rightarrow$ Responsibility.

  Distinguishing the "counterfactual" reading from the "standing ability" reading does not dissolve the impasse because the parties disagree on whether the *standing ability* itself requires *counterfactual openness*. The Frankfurtian says "I have the ability even if the outcome is determined." The PAP defender says "If the outcome is determined, you do not have the ability." This is a metaphysical disagreement about the nature of ability, not a linguistic confusion.

  ### 2. The Check Case: Character Determinism without Intervener

  To test this diagnosis, consider the variant you proposed: **The counterfactual intervener is removed, but the agent's decision is settled in advance by her own character.** (Let us assume for the sake of the check that this settling precludes robust alternative possibilities).

  *   **The Frankfurtian Prediction:** The agent **is morally responsible**.
      *   *Reasoning:* The intervener was always redundant; the agent acted on her own. The fact that her character settled the decision does not negate responsibility, provided the character is hers and the action issues from it appropriately. The lack of alternative possibilities is irrelevant to the actual sequence of agency.
  *   **The PAP Defender Prediction:** The agent **is not morally responsible** (or at least, the case fails to support compatibilism).
      *   *Reasoning:* If the character settled the decision such that no alternative was possible, the Principle of Alternative Possibilities is violated. Without the ability to do otherwise, the agent lacks the requisite control. The "flicker" strategy would attempt to find some prior moment where character did *not* settle the choice; if no such moment exists, responsibility is extinguished.

  **Analysis of the Check:**
  The competing readings predict **different verdicts about responsibility**.
  *   If the disagreement were merely verbal (e.g., both agree on the facts of the case but disagree on the label "could have done otherwise"), they should agree on whether the agent is blameworthy/praiseworthy.
  *   Since they disagree on the *responsibility verdict* itself based on the same metaphysical setup (settled character, no intervener), the disagreement is substantive. The phrase "could have done otherwise" is not just being read differently; it is tracking a fundamental divergence in what the theorists believe *makes* an agent responsible. The Frankfurtian sees character-determination as compatible with agency; the PAP defender sees it as the death of agency.

  ### 3. Evaluation of the Hypothesis

  Your hypothesis correctly identifies that "could have done otherwise" is doing too much work. However, it fails to dissolve the impasse because clarifying the terms reveals the bedrock conflict rather than resolving it.

  *   **If we distinguish the readings:**
      *   Frankfurtian: "Responsibility requires Sourcehood (Actual Sequence). Alternative Possibilities (Counterfactuals) are not required."
      *   PAP Defender: "Responsibility requires Sourcehood. Sourcehood *requires* Alternative Possibilities."
  *   **What remains:** The substantive question becomes: *Is the power to choose otherwise constitutive of sourcehood, or is sourcehood exhausted by the ownership of the actual path?*
      *   This is not a verbal dispute. It is a clash of intuitions about the nature of the self. Is the self a node in a causal network that must have open branches (Libertarian), or is the self the author of the narrative regardless of whether the narrative was the only one writable (Compatibilist)?

  The impasse remains because each side views the other's core intuition as a category error. Frankfurtians view the PAP demand for alternatives as a fetishization of "ghostly" powers irrelevant to praise/blame. PAP defenders view the Frankfurtian acceptance of determined character as a surrender of agency to mechanics.

  ### 4. What Counts as Progress?

  Given that the diagnosis is a **substantive standoff at bedrock**, progress cannot be achieved through better cases, formal results, or semantic distinctions. FSCs cannot decide the issue because they are intuition pumps that only work if one already accepts the Actual Sequence view.

  **Progress consists in:**
  1.  **Abandoning the hope of a knock-down argument:** Acknowledging that FSCs do not refute PAP for those who hold a robust metaphysical conception of ability. The "dilemma defense" is not a logical error but a restatement of the Libertarian premise.
  2.  **Shifting the burden of proof:** Instead of arguing over FSCs, the debate should move to defending the competing conceptions of **Control**.
      *   Frankfurtians must explain why *Sourcehood* without *Leeway* is sufficient for the kind of "could have done otherwise" that justifies retributive blame (not just pragmatic attribution).
      *   PAP Defenders must explain why *Leeway* adds anything to *Sourcehood* that isn't already captured by the actual sequence, without falling into the trap of making responsibility depend on luck or randomness.
  3.  **Recognizing the Methodological Limit:** Acknowledging that stipulated cases (like FSCs) generate evidence only for those who share the theorist's prior metaphysical commitments. Progress requires moving from case-based intuition-mongering to systematic metaphysical accounts of agency.

  **Conclusion:**
  The dispute is a **paradigm clash**. Your hypothesis identifies the fog (ambiguity), but the obstacle is the terrain (metaphysics). Distinguishing the readings clarifies that the parties are not talking past each other; they are looking at the same landscape and seeing different structures. Progress is not a verdict on PAP, but the realization that PAP is a proxy for a deeper war between **Leeway Incompatibilism** and **Actual Sequence Compatibilism**, a war that cannot be won by counterfactual interveners.
