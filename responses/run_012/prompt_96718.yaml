      *   **The Problem:** The user understands the mechanics (law is general, cases are particular, equity adjusts) but doesn't understand *what theory this constitutes*. Is Aristotle a particularist? A generalist? Or is the question wrong?
      *   **The Debate:** Classmates are split. Some say the leaden rule implies particularism (rules adapt to cases). Others say it implies generalism (equity is a higher-order rule correcting lower-order rules).
