      *   Framing him as a modern particularist (like Jonathan Dancy) risks projecting meta-ethical concerns onto a practical/political text.

  7.  **Synthesize the "Leaden Rule" Image:**
      *   It's not that the rule disappears. It's that the rule is *malleable*.
