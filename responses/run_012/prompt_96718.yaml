  2.  **Deconstruct Aristotle's Text (NE V.10):**
      *   *Core Argument:* Legal justice is universal, but some things cannot be covered by a universal statement. Where it is necessary to speak universally but not possible to do so correctly, the law takes the usual case. It is not in error if it misses in a particular case. The error lies in the nature of the subject matter, not the lawgiver.
      *   *Equity (*Epieikeia*):* It is just, but better than one kind of justice (legal justice). It corrects the law where it is defective owing to its universality.
      *   *The Leaden Rule:* Used by Lesbian builders. Flexible lead conforms to the irregular stone, rather than the stone being forced to fit a rigid rule.
      *   *The Decree:* Adapted to the facts.

  3.  **Analyze the Generalism/Particularism Debate:**
      *   *Moral Generalism:* Moral thought requires principles/rules. Actions are right/wrong *because* they fall under a principle. (Kantian, Utilitarian, Rossian).
      *   *Moral Particularism:* Moral thought does not require principles. Context determines moral relevance. Principles are at best heuristic summaries, not constitutive of morality. (Dancy, McDowell-ish readings of Aristotle).
      *   *The Tension:* Does equity show that rules *fail* (particularism) or that we need *better/more* rules (generalism)?

  4.  **Evaluate the "Aristotle as Particularist" Claim:**
