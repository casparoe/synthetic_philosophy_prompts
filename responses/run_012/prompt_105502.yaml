      *   (7) Rival Rituals.
      *   If values are finite, you can compare them. If Ritual A offers $10^{100}$ and Ritual B offers $10^{100} + 1$, EV picks B. The contradiction in (7) only arises if the values are *incomparable* or *infinite*. So, yes, the argument *depends* on the unbounded nature to generate the *contradiction* in (8). With finite values, it's just a hard choice, not a logical contradiction. This is a crucial point to make.

