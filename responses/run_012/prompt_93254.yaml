  **Second Thought Thermodynamics, Inc.**
  **Job Posting: Sorting Operative (Night Shift)**
  **Location:** Sub-Basement 4 (Thermally Isolated)
  **Type:** Full-Time, Hourly + Heat Dissipation Stipend

  **About Us**
  Second Thought Thermodynamics is disrupting the equilibrium of the energy sector. While legacy providers accept entropy increase as an inevitability, we recognize that information is physical and therefore monetizable. Our flagship product, the MaxWell™ Chamber, offers Entropy Reduction as a Service (ERaaS) to high-end clients requiring localized order amidst universal chaos. We are not breaking laws; we are optimizing compliance. We believe that with the right management of information states, the Second Law is less a barrier and more a billing schedule.

  **The Role**
  We are seeking a disciplined Sorting Operative for the Night Shift. In this role, you will act as the intelligent agent within our Szilard-style single-molecule containment units. Your primary objective is to maintain a net drop in system entropy against a contractual Service Level Agreement (SLA) without triggering a thermal violation. You will not be moving molecules manually; you will be gating them based on velocity measurements while maintaining a reversible logical state. The Night Shift offers reduced ambient thermal noise, allowing for tighter margins on bit-wise operations.

  **What You'll Do**
  *   **Monitor Aperture Flux:** Observe incoming particles and classify them as "Fast" or "Slow" via non-dissipative measurement. Please note: Measurement itself is free, provided no record is kept. However, to sort effectively, you must store the measurement result in your working memory.
  *   **Execute Reversible Sorting:** Operate the frictionless gate to segregate particles. You must ensure the gating mechanism does not rely on mechanical ratchets or pawls; legacy mechanical systems are prone to thermal fluctuations that undo sorting gains. All gating must be logically reversible.
  *   **Manage Memory Registers:** As your internal memory fills with measurement bits, you will reach capacity. You must not overwrite data arbitrarily. Overwriting constitutes erasure.
  *   **Perform Scheduled Resets:** Upon memory saturation, you will execute a Landauer-compliant reset protocol. You acknowledge that this is the billable event. For every bit erased, you will dissipate at least $kT \ln 2$ of heat into the facility reservoir.
  *   **Maintain SLA:** Ensure the entropy reduction in the chamber exceeds the entropy generated by your reset operations during the shift.

  **What We're Looking For**
  *   **Experience with Reversible Computing:** Candidates must demonstrate the ability to perform logic operations without energy loss. If you habitually irreversibly discard information during decision-making, you will not meet efficiency targets.
  *   **Thermal Discipline:** Ability to work in low-temperature environments without shivering (shivering constitutes unauthorized heat generation).
  *   **Understanding of Information Physics:** You must intuitively grasp that knowing the molecule's speed costs nothing, but forgetting it costs energy.
  *   **No Ratchet Temptation:** We do not hire operatives who believe a spring-loaded door can solve thermal gradients. If you cite Feynman's lectures as a reason why this job is impossible, you are not a culture fit.
  *   **Attention to Detail:** Ability to track single-molecule trajectories over extended periods without cognitive decoherence.

  **Compensation and Benefits**
  *   **Competitive Wage:** Paid in standard fiat currency, not joules.
  *   **Negative-Entropy Bonus:** Quarterly performance bonus tied to the net $\Delta S$ of your chamber. Note: Bonus is clawed back if global entropy increases are traced to your station.
  *   **Zero-Entropy Reservoir Access:** Employees gain privileged access to the facility's heat sink for personal dissipation needs during reset cycles.
  *   **Health & Safety:** Full coverage for metabolic burnout. Please note: Second Thought Thermodynamics is not liable for heat death scenarios occurring outside designated dissipation zones.
  *   **Professional Development:** Training in Bennett's reconciliation methods provided onboarding.

  **Legal / Equal Opportunity Statement**
  Second Thought Thermodynamics, Inc. is an Equal Opportunity Employer. We do not discriminate based on race, gender, religion, or initial entropy state. All offers of employment are contingent upon successful completion of a background check and a thermodynamic consistency audit.

  *Disclaimer: While local entropy reduction is guaranteed per contract, employees acknowledge that global entropy must increase to satisfy conservation laws. By accepting this role, you agree to serve as the primary locus of entropy production for the duration of your shift. You are responsible for all heat generated during memory erasure. Any attempt to export heat to the external environment without proper licensing constitutes a violation of federal energy regulations. This position is reversible, but your employment contract is not.*

  *Second Thought Thermodynamics, Inc. reserves the right to modify the Boltzmann constant used in compensation calculations based on market conditions.*
