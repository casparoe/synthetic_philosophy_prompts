answer: |-
  ### Exam Question

  **Jurisprudence Seminar – Final Examination**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Consider the jurisdiction of Valdoria. In 1994, Valdoria amended its Constitution to add Article 19:

  > *Article 19. Any statute or decree whose injustice reaches an intolerable degree is void, and no official shall enforce it. This Article applies only to instruments enacted after its ratification.*

  Two generations of courts have applied Article 19 as settled practice. In 2011, the Valdorian legislature enacted a statute authorizing the indefinite administrative detention of members of a religious minority. The statute was enacted by impeccable procedure, is general, public, prospective, clear, internally consistent, possible to comply with, and officials apply it exactly as written. It is, however, monstrous. The Constitutional Court strikes it down under Article 19.

  Write an essay addressing the following:

  1.  Does the 2011 outcome vindicate Fuller? What must Fuller and Hart respectively say about the validity of the 2011 statute *given the existence of Article 19*?
  2.  Suppose instead the Court had struck down the same statute in 1990, *before* Article 19 existed, on the ground that such injustice cannot be law. What changes in the theoretical analysis, and which theorist does this second version favor?
  3.  Explain the theoretical work done by Article 19's non-retroactivity clause ("applies only to instruments enacted after its ratification").

  Your answer must distinguish between a legal system that *contains* moral tests of validity and a legal system that proves a necessary connection between law and morality. If you believe the standard framing of the Hart–Fuller debate obscures the issues here, state so explicitly.

  ***

  ### Model Answer

  The 2011 outcome does not obviously vindicate Fuller, and may actually favor Hart. To see why, one must resist the standard framing of the Hart–Fuller debate, which often caricatures Fuller as asserting a substantive natural law thesis ("unjust law is no law") and Hart as a moral skeptic. Fuller's commitment is to the *inner morality of law*: eight procedural desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence). The 2011 statute satisfies all eight. It is procedurally perfect. Therefore, on Fuller's own criteria, it qualifies as law, however wicked. Striking it down based on substantive injustice relies on a moral criterion external to Fuller's procedural natural law.

  Hart, conversely, is comfortable with the 2011 outcome. For Hart, validity is determined by the Rule of Recognition. In Valdoria post-1994, the Rule of Recognition includes Article 19. The moral test ("intolerable injustice") is incorporated into the source-based criteria for validity. Hart distinguishes between law as it is and law as it ought to be, but he allows that a system's rule of recognition *can* make moral merit a condition of validity. When the court strikes down the 2011 statute, it is applying a positive legal rule, not an extra-legal moral standard. This is positivism in action: the law says unjust statutes are void, so the court voids the statute.

  The analysis shifts dramatically in the 1990 scenario. Without Article 19, the Rule of Recognition contains no moral test. If the court strikes down the statute solely because it is monstrous, it is denying the separability thesis. Hart must characterize this as the court exercising discretion or applying extra-legal standards, effectively admitting that valid law is being ignored for moral reasons. Fuller would favor this outcome more than the 2011 one, though not perfectly. While Fuller focuses on procedure, he argues that extreme substantive injustice can undermine the very purpose of subjecting human conduct to rules. However, the 1990 scenario is the only one that truly tests the necessary connection between law and morality, whereas the 2011 scenario only tests the contingent content of Valdorian law.

  This leads to the non-retroactivity clause. This clause is where the positivist quietly wins. By limiting Article 19 to instruments enacted *after* ratification, Valdoria admits that unjust statutes enacted *before* 1994 were valid law. If the connection between law and morality were necessary and timeless, unjust laws would have been void *ab initio*, regardless of the date. The clause treats the moral constraint as a new positive law, not a discovery of eternal truth. It preserves legal certainty for past wickedness, acknowledging that validity is contingent on the system's rules at the time of enactment.

  Finally, students must distinguish between codification and necessity. That Valdoria *has* a moral test proves nothing about law *as such*. It only proves that Valdorian law includes morality. Positivism allows for moral criteria within the Rule of Recognition; it only denies that such criteria are necessary in *every* legal system. The standard debate often obscures this by treating Hart as denying that law *can* include morality, rather than denying that it *must*.

  ***

  ### Marking Scheme (20 Points)

  **1. Fuller's Proceduralism (4 points)**
  *   **Requirement:** Identify that Fuller's criteria are procedural (inner morality), not substantive. The 2011 statute meets Fuller's 8 desiderata, so striking it down is not strictly required by Fuller's theory.
  *   **Typical Miss:** Candidates treat Fuller as a substantive natural lawyer who automatically voids unjust laws, ignoring the procedural focus.

  **2. Hart on Incorporation (4 points)**
  *   **Requirement:** Explain that for Hart, Article 19 becomes part of the Rule of Recognition. Validity is source-based; the source now includes a moral test. Hart supports the 2011 outcome.
  *   **Typical Miss:** Candidates claim Hart must oppose the outcome because it involves morality, missing the "incorporationist" possibility within positivism.

  **3. The 1990 Scenario Shift (4 points)**
  *   **Requirement:** Recognize that without Article 19, striking down the statute violates Hart's separability thesis but aligns better with a strong natural law view (law loses validity due to merit).
  *   **Typical Miss:** Candidates treat the 1990 and 2011 scenarios as theoretically identical, ignoring the change in the Rule of Recognition.

  **4. Non-Retroactivity Clause (4 points)**
  *   **Requirement:** Explain that limiting Art 19 prospectively admits pre-1994 unjust laws were valid. This concedes the positivist point that validity is contingent, not morally necessary.
  *   **Typical Miss:** Candidates ignore the clause or treat it as a mere policy choice without theoretical significance for validity.

  **5. Codification vs. Necessity (4 points)**
  *   **Requirement:** Distinguish between a system containing moral tests (contingent) and law necessarily involving morality (conceptual). Art 19 proves the former, not the latter.
  *   **Typical Miss:** Candidates argue that because Valdoria has a moral test, Hart is wrong about law generally (confusing contingent content with necessary truth).

  **A/B Line Distinction:**
  *   **A Answer:** Hits all five points, specifically articulating **Point 4 (Non-Retroactivity)** as a concession to positivism. They recognize that acknowledging past validity undermines the claim of a necessary moral connection.
  *   **B Answer:** Hits Points 1, 2, 3, and 5 competently but treats the Non-Retroactivity clause as merely practical or ignores its implication for the nature of validity. They correctly map Hart/Fuller but miss the "quiet win" for positivism embedded in the temporal limitation.
