prompt: |-
  Ok so I'm building the final exam for my jurisprudence seminar (upper-level, mostly 3Ls plus two philosophy grad students) and I want one essay question that they cant answer by parroting the standard summary of the Hart–Fuller debate. You're a legal philosopher who knows this literature cold — before you write anything, think it through carefully and maybe start by jotting down what each side is actually committed to, because I want the question to turn on that and not on the vibe. No citations or page numbers needed anywhere in this, I don't care.

  Here's the setup I want to use. Invent a jurisdiction (I've been calling it Valdoria) which in 1994 amends its constitution to add this:

  Article 19. Any statute or decree whose injustice reaches an intolerable degree is void, and no official shall enforce it. This Article applies only to instruments enacted after its ratification.

  Two generations of Valdorian courts have applied it, so it's settled practice, not dead letter. In 2011 the legislature enacts, by impeccable procedure, a statute authorizing the indefinite administrative detention of members of a religious minority — no trial, no review, no sunset. It's general, it's published, it's prospective, it's perfectly clear, it's internally consistent, it doesn't ask anyone to do the impossible, and officials apply it exactly as written. It's just monstrous. The constitutional court strikes it down under Article 19.

  The question should ask: does that outcome vindicate Fuller? What must each of them say about it? And here's the part I actually care about — suppose instead the court had done the same thing in 1990, before Article 19 existed, on the ground that a statute like this cannot be law at all. What changes, and which of them does that second version favor?

  I want it answerable in 90 minutes, and I want it to make them show two things: first, that Fuller's own criterion is about how law is made and administered rather than about what it commands, so a clear, public, prospective, consistently applied atrocity doesn't obviously fail his test; second, that codifying a moral test of validity is not the same as showing law and morality are necessarily connected. Also make them say what Article 19's non-retroactivity clause is doing, because I think that's where the positivist quietly wins and I want to see if anybody notices. If you think the standard way this debate gets framed is doing the question a disservice, say so in the model answer.

  Deliverables: the exam question itself (keep it to what I've described, don't bolt on extra parts or it'll run long), then a model answer of about 700–800 words, then a marking scheme out of 20 built around five must-hit points — name each point, give its marks, and add a one-line note on how candidates typically miss it. And spell out the A/B line for me: which specific move can a B answer be missing while still looking competent on the surface.
