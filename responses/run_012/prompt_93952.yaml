          *   Must address: If the standard framing does the question a disservice, say so in the model answer.
      *   **Constraint 5:** Deliverables: Exam Question, Model Answer (700-800 words), Marking Scheme (20 points, 5 must-hit points with notes on typical misses), A/B line distinction.
      *   **Constraint 6:** Time limit for students: 90 minutes.

  2.  **Deconstruct the Jurisprudence (Hart vs. Fuller):**
      *   **Hart (Positivist):** Law is a system of rules. Validity depends on sources (Rule of Recognition), not moral merit. "The law is the law." However, Hart admits laws can be too wicked to obey (natural law minimum content is separate from validity). He distinguishes between "what law is" and "what law ought to be." In the 1990 scenario (no constitutional moral clause), striking down a procedurally perfect statute based on morality alone denies the separability thesis. In the 2011 scenario (with Article 19), the moral clause *is* part of the Rule of Recognition. Enforcing it is positivist-friendly because the source of validity includes the moral test.
      *   **Fuller (Natural Law/Procedural):** Law has an "inner morality." It's about how law is made/administered (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence). A system failing these isn't law. Crucially, Fuller's inner morality is *procedural*, not *substantive*. A substantively evil law can still be "law" if it meets the 8 desiderata. However, extreme substantive injustice might undermine the purpose of law (subjecting human conduct to rules). But generally, Fuller is often misread as saying "unjust law isn't law" substantively. The prompt specifically wants students to notice Fuller's criterion is about *process*, so a clear, public, prospective atrocity doesn't obviously fail his test.
      *   **The Twist (Article 19):**
          *   *2011 Scenario (With Art 19):* The court strikes down the statute because the Constitution says unjust laws are void. This is a *source-based* validity test. The Rule of Recognition includes "no intolerable injustice." Hart loves this. It's a legal rule, not an extra-legal moral judgment. Fuller might say this codifies a moral principle into the procedural framework, but it doesn't prove a *necessary* connection between law and morality in general, just in Valdoria.
          *   *1990 Scenario (Without Art 19):* The court strikes down a procedurally perfect statute purely on moral grounds. This challenges Hart (separability thesis). This favors Fuller (or Dworkin, but stick to Hart/Fuller).
          *   *Non-Retroactivity Clause:* Art 19 applies only to instruments enacted *after* ratification. This preserves legal certainty for past laws. Hart would applaud this distinction (acknowledging the law was valid then, even if wicked). Fuller might worry about the congruence between law and morality, but the clause itself respects the procedural virtue of non-retroactivity. The prompt suggests this is where the positivist quietly wins. Why? Because it admits that *before* 1994, unjust laws *were* valid law. It treats the moral test as a positive legal change, not a timeless truth.

  3.  **Drafting the Exam Question:**
      *   Keep it tight. Use the provided setup. Ensure the two scenarios (2011 with Art 19 vs. 1990 without) are clear.
      *   Ask specifically about what Hart and Fuller *must* say (commitments), not just what they *might* say.
      *   Ask about the non-retroactivity clause.
      *   Ask about the distinction between codified moral tests and necessary connections.

  4.  **Drafting the Model Answer:**
      *   *Word Count:* 700-800 words. (Need to be concise).
      *   *Key Arguments:*
          1.  Fuller's Inner Morality is procedural. The 2011 statute meets Fuller's 8 desiderata (clear, prospective, etc.). So striking it down under Art 19 isn't strictly vindicating Fuller's *internal* morality of law.
          2.  Hart on 2011: Art 19 is part of the Rule of Recognition. Validity turns on a source-based rule that *incorporates* morality. This is "incorporationism" compatible with positivism. Hart wins here.
          3.  Hart on 1990: Striking down without Art 19 violates separability. Law is identified by source, not merit. Hart loses here (or must call it judicial discretion).
          4.  Fuller on 1990: Might support it if the injustice undermines the very purpose of law, but his main thrust is procedural.
          5.  Non-Retroactivity: This admits that pre-1994 unjust laws *were* valid. This concedes the positivist point that validity is contingent on the system's rules at the time, not eternal morality.
          6.  Codification vs. Necessity: Having a moral test in the constitution doesn't prove law *necessarily* involves morality, only that *this* law does.
          7.  Critique of Standard Framing: The standard debate often conflates Fuller's procedural natural law with substantive natural law.

  5.  **Drafting the Marking Scheme:**
