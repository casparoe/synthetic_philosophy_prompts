      *   **Raw Materials to Incorporate/Refine:**
          1.  Distinction: Risk (known probs) vs. Uncertainty (known outcomes, unknown probs) vs. Ignorance (unknown outcomes).
          2.  Symmetry: Inaction is also an action (precaution can favor action). PP cannot license *any* conclusion.
          3.  Structure: Trigger (condition for action), Target (what is protected), Remedy (action taken).
      *   **Deliverables:**
          1.  The Procedure (Questions, stopping points, value/fact split, study recommendation criteria).
          2.  Run the Procedure on 3 cases (Gene Drive, Neonicotinoid, Stratospheric Aerosol Injection). One outcome must be unpopular/unexpected.
          3.  Identify the primary Failure Mode.
          4.  Identify the primary Legal/Opponent Attack Vector.

  2.  **Deconstruct the Raw Materials & Build the Framework:**

      *   *Material 1 (Risk/Uncertainty/Ignorance):* This is classic Knightian uncertainty/Ignorance. I need to make this operational. Let's call it the "Epistemic Status."
      *   *Material 2 (Symmetry):* This is crucial. Usually, PP is used to stop things. But if the *status quo* is dangerous (e.g., invasive rodents destroying endemic species), PP might demand the intervention. I need a "Baseline Comparison."
      *   *Material 3 (Trigger/Target/Remedy):* This sounds like a logical structure for the decision itself.
          *   Trigger: Is there a threat of serious/irreversible damage?
          *   Target: What exactly are we protecting? (Environment? Human Health? Economic stability?)
          *   Remedy: What specific action mitigates the threat without creating worse ones?

      *   *Refining the Procedure:*
          *   It needs to fit in 90 minutes. It can't be a full cost-benefit analysis. It needs to be a *filter*.
          *   It needs to be defensible in court. This means clear criteria, documented reasoning, and avoiding arbitrary value judgments disguised as facts.
