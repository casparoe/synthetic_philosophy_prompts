          2.  **Trigger Validation:** Is the threat "serious or irreversible"? (Statutory requirement).
          3.  **Symmetry Check (Baseline):** Is the *proposal* riskier than the *status quo*? (Addresses Material 2).
          4.  **Remedy Viability:** Can conditions/restrictions actually mitigate the trigger? (Addresses Material 3).
          5.  **The Value Pivot:** If facts are exhausted, who decides the trade-off?

  3.  **Developing the Procedure (The "Precautionary Protocol"):**

      *   *Step 1: Epistemic Status.* Determine if we are in Risk, Uncertainty, or Ignorance.
