          *   If Yes -> Approve with Conditions.
      *   *Step 5: The Value Pivot.* If Status Quo and Proposal both have catastrophic risks, or if the trade-off is purely ethical (e.g., saving species X kills species Y), this is where the Board decides, not the Unit. The Unit recommends based on minimization of *irreversibility*.

