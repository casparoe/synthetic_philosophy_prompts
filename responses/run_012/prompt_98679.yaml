          *   *Better twist:* The **Neonicotinoid** gets **Approved with Conditions**. Why? Because the Status Quo (alternative pesticides) might be shown to be *more* harmful/less understood, and the specific trigger (bee collapse) can be remedied by specific crop restrictions. This challenges the "all neonics are bad" heuristic.
          *   *Actually, let's look at the "Symmetry" constraint.* If the Status Quo is bad, PP favors action.
