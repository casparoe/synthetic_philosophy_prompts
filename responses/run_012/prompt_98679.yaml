      *   *Step 2: The Trigger.* Does the proposal pose a threat of serious/irreversible damage?
          *   *No:* Approve (standard process).
          *   *Yes:* Proceed to PP analysis.
      *   *Step 3: The Symmetry Test.* Compare Proposal vs. Status Quo.
          *   Does the Status Quo pose a *greater* threat of serious/irreversible damage?
          *   If Yes -> PP may favor Approval (with conditions).
          *   If No -> PP favors Restriction/Refusal.
      *   *Step 4: The Remedy Test.* Can we isolate the Trigger?
          *   Can conditions reduce the risk below the threshold?
