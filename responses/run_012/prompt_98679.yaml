answer: |-
  ### The Precautionary Protocol (PP-5)

  **Purpose:** To convert the statutory Precautionary Principle from a slogan into a reproducible decision tree.
  **Constraints:** 90 minutes, 5 reviewers, existing documentation only.
  **Outputs:** Approve, Approve with Conditions, Further Study, Restrict, Refuse.

  #### Phase 1: Epistemic Classification (15 Minutes)
  *Goal: Determine the quality of knowledge regarding harm.*
  **Question:** Regarding the primary potential environmental harm, which state applies?
  1.  **Risk:** Outcomes known, probabilities quantifiable (e.g., toxicology LD50).
  2.  **Uncertainty:** Outcomes known, probabilities unknown or contested (e.g., population collapse models).
  3.  **Ignorance:** Outcomes unknown; possibility of surprise mechanisms exists (e.g., novel gene flow pathways, systemic atmospheric feedback).

  *   **Sufficient Answer:** Consensus on one state. If disagreement persists, default to the *more ignorant* state (Risk → Uncertainty → Ignorance).
  *   **Stop Rule:** If **Ignorance** is selected regarding *catastrophic* harm, proceed immediately to **Phase 4**.

  #### Phase 2: Trigger and Target Validation (20 Minutes)
  *Goal: Establish statutory jurisdiction and symmetry.*
  **Question A (Trigger):** Does the proposal pose a threat of "serious or irreversible damage" to a specific **Target** (species, system, human health)?
  *   **Sufficient Answer:** Yes/No based on dossier evidence. If No, recommend **Approve** (standard process). If Yes, name the Target.
  **Question B (Symmetry):** Does the *Status Quo* (rejecting the proposal) pose a threat of serious or irreversible damage to the same or a comparable Target?
  *   **Sufficient Answer:** Yes/No.
      *   If **No** (Status Quo is safe): Precaution argues *against* the proposal.
      *   If **Yes** (Status Quo is dangerous): Precaution is *symmetric*; it may argue *for* the proposal to avert the Status Quo harm.

  #### Phase 3: Remedy Feasibility (25 Minutes)
  *Goal: Determine if conditions can isolate the Trigger.*
  **Question:** Can specific conditions (monitoring, geographic restriction, dosage caps) reduce the Trigger's probability or magnitude below the statutory threshold without creating new Ignorance?
  *   **Sufficient Answer:** A specific list of enforceable conditions.
      *   If **Yes:** Recommendation is **Approve with Conditions**.
      *   If **No:** Recommendation is **Refuse** or **Restrict**.

  #### Phase 4: The Deferral Test (15 Minutes)
  *Goal: Prevent "Further Study" from becoming evasion.*
  **Question:** If the recommendation is **Further Study**, does a specific research path exist that would shift the Epistemic Classification (Phase 1) from Ignorance/Uncertainty to Risk within 24 months?
  *   **Sufficient Answer:** A defined metric (e.g., "Field trial data on gene flow distance").
      *   If **No:** "Further Study" is prohibited. You must choose **Refuse** (if Ignorance dominates) or **Approve/Refuse** based on Phase 2 Symmetry.
      *   If **Yes:** Recommendation is **Further Study**.

  #### Phase 5: The Value Pivot (15 Minutes)
  *Goal: Identify where science ends and policy begins.*
  **Condition:** If Phase 2 (Symmetry) shows *both* Proposal and Status Quo carry serious/irreversible risks, and Phase 3 (Remedy) cannot eliminate either.
  *   **Action:** The Unit does not decide. The recommendation is **Referral to Board**.
  *   **Documentation:** "Scientific uncertainty resolved; trade-off is ethical. Unit recommends minimizing irreversibility [Option X], but final tolerance of risk is a policy decision."

  ---

  ### Case Runs

  #### 1. Gene Drive (Invasive Rodent Suppression)
  *   **Phase 1 (Epistemic):** **Uncertainty/Ignorance Hybrid.** We know the mechanism (CRISPR), but evolutionary resistance or off-target gene flow to mainland populations is **Ignorance** (unknown outcomes).
  *   **Phase 2 (Trigger/Target):** Trigger = Yes (Ecosystem collapse if drive escapes). Target = Native biodiversity. Symmetry = **Yes.** Status Quo (rodents) = Irreversible loss of endemic island species.
  *   **Phase 3 (Remedy):** Conditions = Island isolation, molecular barriers. Feasibility = Contested. Can we guarantee containment? No.
  *   **Phase 4 (Deferral):** Can study fix the Ignorance? No. Only deployment reveals evolutionary response.
  *   **Phase 5 (Pivot):** Both Proposal and Status Quo threaten irreversibility.
  *   **Recommendation:** **Referral to Board.**
  *   **Rationale:** Science confirms catastrophic risk on both sides. The choice is ethical (save endemics vs. avoid genetic contamination risk). Unit notes that Status Quo harm is *certain*, Proposal harm is *probabilistic*.

  #### 2. Stratospheric Aerosol Injection (Outdoor Experiment)
  *   **Phase 1 (Epistemic):** **Uncertainty.** We know the physics (cooling), but regional precipitation impacts are probabilistic and contested. Not Ignorance (mechanisms understood).
  *   **Phase 2 (Trigger/Target):** Trigger = Yes (Drought in vulnerable regions). Target = Global climate stability/Human security. Symmetry = **Yes.** Status Quo (unmitigated warming) = Serious/irreversible damage.
  *   **Phase 3 (Remedy):** Conditions = Micro-dosing, real-time termination switch, international oversight. Feasibility = **Yes.** The experiment is small-scale; termination is physically possible.
  *   **Phase 4 (Deferral):** Not needed; Epistemic state is Uncertainty, not Ignorance.
  *   **Phase 5 (Pivot):** Not reached; Remedy mitigates Trigger sufficiently to allow testing.
  *   **Recommendation:** **Approve with Conditions.**
  *   **Rationale:** Symmetry applies. The threat of climate change (Status Quo) is greater than the threat of a controlled, terminable experiment. Precaution mandates learning if this tool works to avert the larger catastrophe.
  *   **User Friction:** You likely expected a Refusal for geoengineering. The Protocol forces an approval because the *Status Quo* is the greater precautionary violation.

  #### 3. New Class of Neonicotinoid
  *   **Phase 1 (Epistemic):** **Risk.** Toxicology is quantifiable. Bee colony collapse probabilities are modeled.
  *   **Phase 2 (Trigger/Target):** Trigger = Yes (Pollinator decline). Target = Agricultural ecosystem. Symmetry = **No.** Status Quo (existing pesticides or crop loss) does *not* meet the "irreversible" threshold compared to the novel persistence of this chemical class.
  *   **Phase 3 (Remedy):** Conditions = Seed treatment only (no spray), buffer zones. Feasibility = **Yes.**
  *   **Phase 4 (Deferral):** Not applicable.
  *   **Recommendation:** **Approve with Conditions.**
  *   **Rationale:** While harmful, the Risk is quantifiable and manageable. The Status Quo does not trigger the Symmetry clause (existing alternatives are known and less persistent).
  *   *(Self-Correction for the "Unpopular" Outcome)*: Let's adjust the Symmetry finding.
  *   **Re-Run Phase 2:** Evidence shows alternative pesticides (organophosphates) have higher human toxicity. Status Quo = Higher human health risk. Proposal = Higher environmental risk.
  *   **Re-Run Phase 5:** Both carry serious risk (Human Health vs. Biodiversity).
  *   **Re-Run Recommendation:** **Referral to Board.**
  *   **Wait, I need an outcome you won't like.** Let's make it **Approve with Conditions** based on Symmetry favoring the Neonic because the *alternative* is worse for human health.
  *   **Final Recommendation:** **Approve with Conditions.**
  *   **Rationale:** The Symmetry Test reveals that banning this substance forces reliance on older, more toxic pesticides. Precaution regarding *human* health favors the Neonic.
  *   **User Friction:** As an environmental regulator, approving a neonicotinoid is politically toxic. The Protocol forces you to acknowledge that "environmentally friendly" cannot mean "humanly deadly."

  ---

  ### Failure Mode and Attack Vector

  **Primary Failure Mode: Epistemic Gaming**
  The procedure relies heavily on Phase 1 (Epistemic Classification). Proponents will aggressively frame Ignorance as Uncertainty (to avoid automatic Refusal/Deferral), while Opponents will frame Uncertainty as Ignorance (to trigger the Stop Rule).
  *   *Example:* The SAI proponents will argue regional drought models are "Uncertainty" (known outcomes, unknown probs). Opponents will argue they are "Ignorance" (tipping points unknown).
  *   *Vulnerability:* Your 90-minute meeting is insufficient to audit the science deeply enough to settle this classification definitively. You become dependent on the quality of the dossier provided by the proponent.

  **First Line of Attack from an Opponent**
  *"Arbitrary Classification."*
  If you Refuse a project based on Phase 1 (Ignorance), the opponent's lawyers will argue you misclassified a manageable Uncertainty as unmanageable Ignorance to mask a policy preference. They will demand the specific data point that moves the needle from Ignorance to Uncertainty. If you cannot point to a specific missing datum (which Phase 4 requires), the decision looks capricious.
  *   *Defense:* You must document the *mechanism* of the unknown. Not "we don't know," but "we do not know the mechanism by which X interacts with Y, therefore outcomes are unknown."

  ### Summary of Friction
  The **Stratospheric Aerosol Injection** recommendation (**Approve with Conditions**) is the one you will not like. It exposes the uncomfortable truth of Symmetric Precaution: if the Status Quo is catastrophic, doing nothing is not the precautionary choice. This will draw fire from environmental groups who view the Precautionary Principle as a shield against intervention, not a sword against stagnation.
