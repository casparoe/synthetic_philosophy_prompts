answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON BIOLOGICAL FUNCTION

  **Signatories:** The Etiological (Selected-Effects) Working Group & The Causal-Role (Systemic) Working Group
  **Date:** 24 May 2024
  **Subject:** Delimitation of Agreement, Disagreement, and Empirical Cruxes in the Theory of Biological Function

  ## 1. AGREED CLAIMS

  Both parties affirm the following propositions as the common ground necessary for any productive discourse on biological function. We acknowledge that while our theoretical justifications differ, the following phenomenological and methodological commitments are shared.

  1.  **The Explanandum:** Both parties agree that the primary phenomenon requiring explanation is the legitimacy, utility, and apparent normativity of teleological language in biological science (e.g., 'The function of the heart is to pump blood'). Any adequate account must explain why biologists are permitted to use such language without invoking supernatural agency.
  2.  **Paradigm Verdicts (Positive):** Both parties agree that in standard, evolutionarily stable contexts, a healthy heart possesses the function of pumping blood. Both parties agree that this ascription is correct and not merely metaphorical.
  3.  **Paradigm Verdicts (Negative):** Both parties agree that incidental by-products which contribute nothing to the fitness of the organism or the capacity of the system (e.g., the noise produced by a heart valve) are not properly described as functions, even if they are causally inevitable consequences of the trait.
  4.  **The Normative Constraint:** Both parties agree that an adequate account must distinguish between *performance* and *malfunction*. It must be possible for a trait to exist, fail to perform its function, and yet still be said to *have* that function (e.g., a diseased heart still has the function of pumping blood, even if it fails to do so).
  5.  **The Naturalistic Constraint:** Both parties agree that functional ascriptions must be grounded in natural facts. Neither side appeals to vitalism, divine intention, or non-physical norms. The disagreement lies solely in which natural facts (historical or systemic) ground the normativity.
  6.  **Concessions on Explanatory Power:**
      *   The Etiological camp concedes that the Causal-Role account provides a superior description of how traits contribute to complex systemic capacities in real-time physiology and is indispensable for functional analysis in biochemistry and systems biology.
      *   The Causal-Role camp concedes that the Etiological account provides a superior explanation for the evolutionary stability of traits and offers a more robust criterion for distinguishing adaptive functions from incidental effects in an evolutionary context.
  7.  **Requirements for Adequacy:** Any successful synthesis or final adjudication must deliver a theory that: (a) preserves the normativity required to explain malfunction; (b) remains applicable to novel biological contexts (e.g., synthetic biology, medicine); and (c) does not render functional ascriptions impossible for traits lacking a clear selection history.

  ## 2. DISAGREEMENTS

  The following table delineates the precise points of divergence. The first column states the issue neutrally. The second and third columns state the position as each side wishes to be recorded, ensuring neither side objects to the characterisation of their own view.

  | Issue | Neutral Formulation | Etiological (Selected-Effects) Formulation | Causal-Role (Systemic) Formulation |
  | :--- | :--- | :--- | :--- |
  | **The Ground of Function** | What fact makes it true that a trait has a specific function? | A trait's function is fixed by the history of natural selection that caused the trait to be maintained in the population. | A trait's function is fixed by its current causal contribution to the capacities of the containing system. |
  | **Normativity and Malfunction** | How is the distinction between malfunction and mere variation established? | Malfunction is the failure to perform the effect for which the trait was historically selected. Normativity is derived from historical success. | Malfunction is the failure to contribute to the system's current capacity. Normativity is derived from the system's current organisational goals. |
  | **Novelty and History** | Can a trait have a function without a prior history of selection for that role? | No. Without a selection history, there is no 'proper function', only causal contribution. To call it a function is to speak loosely. | Yes. If a trait contributes to the system's capacity, it has a function. Selection history is irrelevant to current functional organisation. |
  | **The Scope of 'Function'** | Does the term 'function' refer to a single natural kind or distinct concepts? | We are analysing the concept of *proper function*, which is inherently historical. Non-historical usages are derivative or distinct. | We are analysing the concept of *systemic function*, which is inherently relational to the current system. Historical usages are a subset of this. |

  ## 3. EMPIRICAL CRUXES

  The following cases represent the specific scenarios where our theoretical commitments yield divergent predictions. For each case, we record the shared description of the scenario and the pre-committed predictions of each camp. Settling these cases empirically or conceptually would force a revision of at least one account.

  ### Crux 1: The Human Gene in Yeast
  *   **Case Description:** A human gene is inserted into a yeast cell that has a mutation preventing it from synthesising a specific metabolite. The human gene rescues the yeast, allowing it to synthesise the metabolite and survive.
  *   **Shared Premise:** Both sides agree the causal mechanism of the gene is identical in the human and the yeast, and that the gene contributes to the survival of the yeast.
  *   **Etiological Prediction:** The human gene does **not** have the function of synthesising the metabolite *in the yeast*. It retains its human function (if any), but in the yeast, it is merely a causal tool. It had no such function before insertion.
  *   **Causal-Role Prediction:** The human gene **does** have the function of synthesising the metabolite *in the yeast*, because it contributes to the metabolic capacity of the yeast system. It acquired this function upon insertion.

  ### Crux 2: The Xenotransplanted Pig Heart
  *   **Case Description:** A pig heart (token) is transplanted into a human recipient. The heart type has a selection history of circulating blood in pigs. The token organ has no history of circulation in a human system.
  *   **Shared Premise:** Both sides agree the heart is causally contributing to the human's survival by circulating blood.
  *   **Etiological Prediction:** The heart **does** have the function of circulating blood. Function attaches to the *trait type* via its selection history in pigs, which travels with the token into the new host.
  *   **Causal-Role Prediction:** The heart **does** have the function of circulating blood, but this is solely because it contributes to the capacity of the *human* system. If the heart failed to pump in the human, it would be malfunctioning relative to the human system, regardless of its pig history.

  ### Crux 3: The De Novo Gene
  *   **Case Description:** A gene arises *de novo* from non-coding DNA in a population. It immediately confers a fitness advantage by contributing to a metabolic pathway, but it has not yet been subject to selection over generations.
  *   **Shared Premise:** Both sides agree the gene is currently aiding survival and is causally integrated into the organism.
  *   **Etiological Prediction:** The gene has **no proper function** yet. It is currently beneficial, but until it is fixed or maintained by selection, it is merely a lucky mutation. Function requires a history of selection.
  *   **Causal-Role Prediction:** The gene **has a function** immediately. Its contribution to the organism's capacity establishes its functional status regardless of its historical duration.

  ### Crux 4: The Trait Fixed by Drift
  *   **Case Description:** A trait becomes fixed in a population purely through genetic drift. Coincidentally, this trait now aids survival (e.g., a specific bone density that happens to protect against a new predator).
  *   **Shared Premise:** Both sides agree the trait was not selected for its current benefit, but currently provides a survival advantage.
  *   **Etiological Prediction:** The trait has **no function** regarding the survival benefit. It may have a function regarding what it was originally selected for (if anything), but the current survival aid is an exaptation or accident, not a function.
  *   **Causal-Role Prediction:** The trait **has a function** regarding the survival benefit. Its current contribution to the organism's capacity is sufficient for functional ascription.

  ## 4. META-THEORETICAL ASSESSMENT

  ### Is the Dispute Merely Verbal?
  Both parties acknowledge a significant risk that the dispute is verbal rather than substantive.
  *   **Diagnosis:** It is highly probable that the Etiological camp is defining 'Proper Function' (a historical, normative concept) while the Causal-Role camp is defining 'Systemic Function' (a ahistorical, descriptive concept).
  *   **Agreement on Verbal Nature:** If both sides concede that 'function' is ambiguous in biological practice, referring sometimes to evolutionary history and sometimes to current systemic contribution, the dispute dissolves into a recommendation about terminology.
  *   **Substantive Remainder:** However, the dispute remains substantive if both sides claim to be analysing the *single* natural kind that biologists refer to when they say 'function'. If biologists intend a unified concept, one account must be wrong.

  ### Falsification Conditions
  To move beyond verbal stipulation, each side identifies what would count as evidence against their account:
  *   **Evidence Against Etiological Account:** If biologists consistently and correctly ascribe functions to novel traits (e.g., in synthetic biology or immunology) where no selection history exists, and treat these ascriptions as normative (capable of malfunction) rather than merely descriptive, the Etiological account would be falsified as a general theory of biological practice.
  *   **Evidence Against Causal-Role Account:** If biologists consistently refuse to ascribe function to traits that make a causal contribution to a system (e.g., cancer cells contributing to tumour growth, or a heart making noise that aids a predator in locating prey), the Causal-Role account would be falsified for being too permissive.

  ### Resolvability
  *   **Current Status:** The disagreement is currently unresolvable without a consensus on the *explanandum*. If the goal is to explain evolutionary stability, the Etiological account wins. If the goal is to explain physiological organisation, the Causal-Role account wins.
  *   **Path to Resolution:** Both sides agree that the debate would be moved if a third, independent criterion for functional ascription were discovered in scientific practice—for example, if experimental protocols in molecular biology relied on a distinction that neither history nor current capacity could capture. Absent this, we recommend treating the two accounts as complementary tools: the Etiological account for evolutionary explanation, and the Causal-Role account for mechanistic explanation.

  ***

  **Signed:**

  _________________________
  Lead Representative, Etiological Working Group

  _________________________
  Lead Representative, Causal-Role Working Group
