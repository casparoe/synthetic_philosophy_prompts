answer: |-
  **PRE-ANALYSIS: WHERE THE BODY IS BURIED**
  The hard cases here aren't about facts; they're about *ontology*. Does "parked" include a rolling stop? (Status vs. Action). Does "vehicle" include a table? (Category vs. Function). Does "public street" include private property affecting the public? (Location vs. Impact). To keep this to a page for non-lawyers, we must sacrifice *purpose* for *precision*. We will prioritize the **Public Meaning** of the words (what a normal person reads today) over the **Original Intent** (what the 1974 Council wanted). This means some outcomes will feel "wrong" because the law is old. That is a feature, not a bug—it forces the Council to update the law rather than letting clerks rewrite it.

  ***

  **INTERNAL MEMO: ORDINANCE INTERPRETATION PROTOCOL**
  **TO:** Licensing & Code Enforcement
  **FROM:** General Counsel
  **SUBJECT:** Decision Procedure for Ordinance Ambiguity

  When an ordinance text does not clearly answer a "Yes/No" question, run this four-step sequence. Do not skip steps. If a step yields a clear answer, stop. If you reach Step 4, call Legal.

  **STEP 1: THE ORDINARY MEANING TEST**
  Read the specific words at issue as you would a newspaper headline today. Do not guess what the City Council *wanted* to do; look at what they *wrote*.
  *   **Action:** Substitute the facts into the text. Does the object/action fit the dictionary definition of the word?
  *   **Theoretical Commitment:** **Public Meaning Textualism.** We assume the law *is* the text, not the hidden thoughts of the drafters.
  *   **Rival View:** *Intentionalism* would ask, "What problem were they trying to solve in 1974?" We reject this because we cannot read minds, only text.
  *   **Stop Condition:** If the words fit clearly → **COVERED/NOT COVERED.** If the words are ambiguous → **Go to Step 2.**

  **STEP 2: THE "WHOLE TEXT" CHECK**
  Read the sentence in the context of the whole section. If the ordinance lists specific items (e.g., "cars, trucks, vans"), does your case fit that specific list, or is it fundamentally different?
  *   **Action:** Apply *ejusdem generis* (of the same kind). If the text regulates "vehicles," a bicycle might fit, a table likely does not.
  *   **Theoretical Commitment:** **Holism.** Words derive meaning from their neighbors.
  *   **Rival View:** *Atomism* would read the word "vehicle" in isolation. We reject this because context limits scope.
  *   **Stop Condition:** If the context clarifies the ambiguity → **COVERED/NOT COVERED.** If the context is silent → **Go to Step 3.**

  **STEP 3: THE ABSURDITY FILTER (GUT CHECK)**
  Ask: "Does applying the text here lead to a result that is physically impossible or logically self-defeating?"
  *   **Action:** Identify if the literal reading makes the law unenforceable or nonsensical.
  *   **Theoretical Commitment:** **The Absurdity Doctrine.** We assume the Council does not legislate nonsense.
  *   **WARNING:** This is **MY GUT DRESSED UP AS A RULE.** Do not use this just because the result is "unfair" or "strict." Use it *only* if the result is absurd (e.g., a law banning "vehicles in the park" applied to an ambulance saving a life).
  *   **Stop Condition:** If truly absurd → **EXCEPTION (Call Legal).** If merely harsh/old-fashioned → **Go to Step 4.**

  **STEP 4: THE VALUE JUDGMENT HANDOFF**
  If the text is clear but the result seems outdated, or if the text is silent on a new technology (e.g., e-bikes in a horse-and-buggy law), stop.
  *   **Action:** Do not decide based on "what makes sense."
  *   **Theoretical Commitment:** **Separation of Powers.** Filling gaps in old laws is a legislative job, not an enforcement job.
  *   **Result:** **KICK TO LEGAL COUNSEL.** We will draft a memo advising the Council to amend the code.

  ***

  **APPLICATION: FOOD VENDING ORDINANCE (1974)**
  *Text: "Unlawful to sell... from a vehicle parked on any public street or public sidewalk... except during a special event."*

  **CASE 1: Food Truck in Private Lot, Customers on Sidewalk**
  *   **Step 1 (Meaning):** Vehicle is parked on *private* lot. Text requires "public street or sidewalk."
  *   **Step 2 (Context):** No other section expands "public" to include "private property with public impact."
  *   **Step 3 (Absurdity):** Not absurd to allow private lot vending.
  *   **Result:** **NOT COVERED.**
  *   *Note:* I know this creates sidewalk congestion. The text regulates *location of the truck*, not *location of the eater*. To fix this, Council must amend the text.

  **CASE 2: Ice Cream Truck (Rolling Stop, Engine Running)**
  *   **Step 1 (Meaning):** Is it "parked"? Ordinary meaning of "parked" implies leaving the vehicle or engine off. "Standing" or "Stopping" is different.
  *   **Step 2 (Context):** Traffic code distinguishes parking vs. standing. Ordinance uses "parked."
  *   **Step 3 (Absurdity):** Not absurd to allow transient sales.
  *   **Result:** **NOT COVERED.**
  *   *Note:* This is the "Result You Won't Like." It feels like a loophole. But "parked" has a specific meaning. If we catch this, we are enforcing a "stopping" ban, not a "parking" ban.

  **CASE 3: Woman with Card Table (No Vehicle)**
  *   **Step 1 (Meaning):** She is selling. But she is not using a "vehicle."
  *   **Step 2 (Context):** *Expressio Unius.* Mentioning "vehicle" excludes non-vehicles.
  *   **Step 3 (Absurdity):** Not absurd to allow table vending.
  *   **Result:** **NOT COVERED.**
  *   *Note:* **HARD STOP.** Do not try to stretch "vehicle" to include "table." This is a legislative gap. If she is causing a nuisance, use a different ordinance (Obstruction of Sidewalk), but not this one.

  **SUMMARY:** In all three cases, the 1974 text fails to capture the modern nuisance. Under this procedure, **none are violations.** This is not a failure of enforcement; it is a signal that the ordinance is obsolete. Send me the referrals; I will tell the Council to write a new law.
