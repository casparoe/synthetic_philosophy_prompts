      *   *Honesty:* Explicitly label the "Gut Check."
      *   *One Result GC Won't Like:* Case 3 (Card Table) is the strongest candidate. The ordinance regulates vehicles, not pedestrians. If she's on foot, the text doesn't catch her.

  7.  **Final Polish:**

      *   Ensure the "Pre-Writing" section is distinct.
