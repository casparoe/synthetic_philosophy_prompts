  *(Self-Correction during drafting)*: I initially thought about making Case 2 a "Covered." But "parked" is a term of art. If I tell a clerk to decide if a moving truck is "parked," that's a liability. Better to kick that to a lawyer or say "Not Covered" based on strict text. To meet the "result you won't like" requirement, Case 3 is better. It highlights the gap between "regulating vending" and "regulating *vehicles* selling."

