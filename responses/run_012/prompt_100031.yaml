          1.  Header/Intro.
          2.  The Steps (1, 2, 3...).
          3.  Theoretical Footnotes/Callouts (as requested).
          4.  The "Kick-Up" clause.
      *   *Theory:* I need to choose a primary theory for the procedure to work. Given the GC's desire for defensibility and the "old ordinance" context, a *modified textualism* is usually safest for non-lawyers, but I must acknowledge where purposivism creeps in. Let's anchor it in **Public Meaning Textualism** (what the words mean to a normal person today) but allow a narrow **Absurdity Check**.
      *   *Constraint Check:* One page is tight. I need to be concise. I will integrate the theoretical commentary directly into the steps to save space but keep it distinct.

  4.  **Drafting the Application (The "Test"):**

      *   Apply the steps strictly to the three cases.
      *   *Case 1:* Private lot. Text says "public street/sidewalk." Result: Not Covered. (GC might hate this if the goal is stopping sidewalk congestion).
      *   *Case 2:* Rolling stop. Text says "parked." Ordinary meaning of parked implies leaving the vehicle. Result: Ambiguous -> Kick to Lawyer. (Or maybe "Not Covered" if we define parked strictly). Let's go with "Not Covered" based on ordinary meaning of "parked" vs "standing," but flag it. Actually, to show the "result you won't like," I should make one of these a hard "No" even if it seems silly. Case 3 is the best candidate for "Result you won't like."
      *   *Case 3:* Card table. Text says "vehicle." Result: Not Covered. (GC will hate this because it's clearly vending, but the text excludes it).

  5.  **Refining the Theory/Philosophy:**

