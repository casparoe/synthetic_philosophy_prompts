          4.  **Crucial:** Explicitly state the theoretical commitment (meaning theory) for each step and contrast it with rival views (intent vs. purpose vs. text).
          5.  **Constraints:** No legal training for users, one ESL clerk, someone waiting at the counter (needs speed/clarity), one page length (approx.), no complex weighing.
