  2.  **Pre-Writing Analysis (The "Hard Cases"):**

      *   *Case 1 (Private Lot, Public Sidewalk Eating):* The text says "parked on any public street or public sidewalk." The truck is on private property. The *effect* is on the sidewalk. Textualism says "not covered." Purposivism (nuisance/congestion) might say "covered." This is a classic "letter vs. spirit" conflict.
      *   *Case 2 (Rolling Stop):* Text says "parked." Is stopping for 2 minutes "parking"? Traffic codes usually define "parking" vs. "standing." If the ordinance doesn't define it, we rely on ordinary meaning. Textualism looks at dictionary/common usage. Intentionalism looks at whether they wanted to stop transient sales.
      *   *Case 3 (Card Table, No Vehicle):* Text says "from a vehicle." She has no vehicle. Textualism says "not covered." Purposivism (unregulated vending) says "covered." This is the *expressio unius* trap (mentioning vehicles implies excluding non-vehicles).
      *   *Distinctions to Keep:* Vehicle vs. No Vehicle; Public vs. Private property; Parked vs. Moving.
      *   *Distinctions to Lose:* Nuanced definitions of "offer for sale" (keep it simple: money changes hands).

  3.  **Drafting the Procedure (The "Meat"):**

      *   *Goal:* A flowchart in text form.
      *   *Tone:* Professional, direct, honest about theory.
