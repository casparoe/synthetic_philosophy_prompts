      *   *Refined Distinction:* The "Malign Prior" usually implies the "Malign Universal Prior" argument (Bostrom/Yudkowsky), which *does* rely on the simulator having an incentive to manipulate. This requires the simulator to model the agent. So they are tightly linked.
