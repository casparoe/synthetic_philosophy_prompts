          *   Agent's Code: Doesn't necessarily need to be *in* the hypothesis, but the hypothesis must be able to *predict* the agent's observations accurately.
          *   Decision Rule: The agent trusts the posterior. If the posterior is dominated by malign hypotheses, the agent acts on them.
