answer: |-
  Your worry is well-founded. In the ELK (Eliciting Latent Knowledge) literature, this is often called the **"Human Simulator" vs. "Direct Translator"** problem. If you train a reporter to translate a model's internals into human answers, the path of least resistance is often for the reporter to ignore the model's internals entirely and just predict what a human *would* say given the input. This is the "coached witness": the reporter isn't testifying to what the model saw; it's testifying to what the jury wants to hear.

  For a three-person, two-year team with limited compute, you cannot solve this by brute-force scaling or training larger reporters. You must solve it by **conceptual clarification and formalization**. You need to find a property that "Direct Translation" (DT) has and "Human Simulation" (HS) lacks, which does not rely on having ground-truth labels (since ELK is primarily for cases where humans *don't* know the truth).

  Here are the two upstream conceptual questions I would assign, followed by the reasoning on why they are prioritized and what would shift that priority.

  ### 1. The Ontology Mapping Question
  **"Can we formally define a 'Direct Translator' as a structure-preserving map between distinct Bayesian networks (or causal models), and does such a map exist uniquely?"**

  **The Reasoning:**
  This is the most upstream question. Currently, "latent knowledge" is an intuition, not a formal object. We assume the AI has a "world model" and we have a "world model," and they differ. The "coached witness" failure happens because the reporter learns a map from *Input → Human Belief* rather than *AI Latent State → Human Belief*.

  To fix this, the team needs to build a mathematical framework for **Ontology Mismatch**.
  *   **The Task:** Model the AI and the Human as two different probabilistic graphical models over the same underlying reality. The AI's nodes might be high-dimensional embeddings; the Human's nodes are concepts like "diamond" or "intruder."
  *   **The Goal:** Define what a "Direct Translation" function looks like in this framework. Does it preserve conditional independencies? Does it commute with causal interventions? If the AI updates its belief about node $X$, does the translator update the human's belief about node $Y$ in a way that is structurally consistent with the AI's graph, rather than the human's prior graph?
  *   **Why Thinking over Experiments:** You don't need large models to do category theory or graph theory. If you cannot mathematically distinguish a structure-preserving map from a function that just mimics marginals, no amount of training data will fix it. If the map isn't unique (i.e., multiple AI states map to the same human answer), ELK is theoretically impossible without further assumptions.

  ### 2. The Computational Asymmetry Question
  **"Is 'Direct Translation' computationally or structurally more complex than 'Human Simulation' in a way that is detectable without ground truth?"**

  **The Reasoning:**
  This addresses the "why" of the failure mode. The prevailing hypothesis (from Paul Christiano and others) is that Human Simulation is often *easier* than Direct Translation. To simulate a human, you just need to know human priors. To translate directly, you must compute the AI's inference *and then* map it. If the AI's ontology is richer, DT requires more compute.

  *   **The Task:** Investigate whether DT necessarily involves a "bottleneck" or a specific computational path that HS bypasses. For example, does DT require accessing specific intermediate layers of the AI that HS ignores? Does DT exhibit higher sensitivity to adversarial perturbations in the latent space?
  *   **The Goal:** Find a **regularizer** or **penalty** that targets HS but not DT. If HS is "simpler" (e.g., lower description length, fewer causal edges used, less compute time), you can penalize simplicity to force the model toward DT.
  *   **Why Thinking over Experiments:** You need to theorize *which* complexity metric matters. Is it circuit size? Depth? Information bottleneck width? Running experiments without a hypothesis on *which* complexity metric separates DT from HS is just guessing. The team should use small, tractable models (like transformers trained on grid worlds) to validate the *theory* of complexity, not to train the ELK solution itself.

  ---

  ### Why These Two? (The Ranking Logic)

  I prioritized these because they are **necessary conditions**.
  1.  If **Ontology Mapping** is ill-defined (Question 1), you don't know what you are optimizing for. You might be optimizing for "consistency" when you should be optimizing for "causal fidelity."
  2.  If there is no **Computational Asymmetry** (Question 2), then HS is indistinguishable from DT using loss functions alone. You would need to change the architecture or the training environment fundamentally.

  These questions are upstream of things like "consistency checks across paraphrases" or "betting markets." Those are *methods* that assume the underlying definitions hold. If the definitions are flawed (as your "coached witness" worry suggests), the methods will fail.

  ### What Would Move These Up or Down?

  **Move Ontology Mapping DOWN if:**
  *   **Mechanistic Interpretability breaks through.** If we discover that neural networks naturally learn human-interpretable features (e.g., "neurons for diamonds") without needing a complex mapping function, the ontology mismatch problem dissolves. The team should pivot to *detection* (finding those neurons) rather than *translation* (mapping between graphs).
  *   **Evidence:** A paper demonstrates that in LLMs, linear probes on specific layers recover ground-truth world states across vastly different contexts without "simulation" behavior.

  **Move Computational Asymmetry UP if:**
  *   **Worst-case theoretical bounds look bad.** If the team proves that DT is NP-hard relative to HS, or that the gap vanishes as models scale, this becomes the critical bottleneck. It implies ELK via loss-function engineering is impossible, and the field must pivot to **architectural constraints** (e.g., forcing the model to output its chain of thought in a verifiable format).
  *   **Evidence:** A theoretical proof showing that for any consistent reporter, there exists a human simulator with equal or lower complexity.

  **Move Both DOWN (and pivot to "Verification") if:**
  *   **The "No Ground Truth" assumption is relaxed.** If we can generate synthetic environments where we *know* the latent truth (e.g., the AI is simulating a physics engine we control), ELK becomes a supervised learning problem. The team should focus on building **benchmark environments** where the "coached witness" can be caught lying, rather than theorizing about general cases.

  ### Summary Recommendation for the Team

  **Don't** have them train reporters on LLMs. They will just recreate the "coached witness" and not know it.

  **Do** have them:
  1.  **Person 1 (Math/Logic):** Formalize the Ontology Mismatch. Define "Direct Translation" using causal graphs.
  2.  **Person 2 (Complexity/Algo):** Analyze the computational cost of DT vs. HS. Look for penalties that target HS.
  3.  **Person 3 (Small-Scale Empirics):** Build tiny, fully-known environments (e.g., cellular automata or grid worlds) to test the theories generated by P1 and P2. Their job is not to solve ELK, but to **falsify** the definitions and complexity hypotheses.

  This approach respects your budget and your worry. It treats ELK not as an engineering hurdle, but as a definitional crisis that requires thinking to resolve.
