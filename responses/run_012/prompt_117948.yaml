answer: |-
  Based on the track record you've assembled, your friend is operating almost exclusively on **Kant's Doctrine of Indirect Duty.**

  Here is the breakdown of the rule she is running, how it applies to your new cases, and which case actually settles the debate.

  ### The Rule: Indirect Duty to Humanity
  The core principle is: **We have no direct duties to animals, because they are not rational moral agents. We have indirect duties *regarding* animals, which are actually direct duties *to humanity* (specifically, to ourselves and our own moral character).**

  *   **Why cruelty is wrong:** It coarsens the human agent. It weakens our natural capacity for sympathy, which is a predisposition that supports our moral duties to *other humans*.
  *   **Why killing is sometimes fine:** Animals are means to ends. If the end is legitimate (food, safety, research) and the means are not gratuitously painful, the act is permissible.
  *   **The Gravestone Clue:** This is the smoking gun. A stone has no sentience. If she says smashing it is "not fine" (even with no family left), she is acknowledging a duty to *respect* that is not grounded in the object's welfare, but in the agent's relationship to value and memory. This mirrors Kant's argument that we shouldn't even destroy a tree unnecessarily if it is majestic, because it dulls our feeling for the sublime.

  ### Prediction 1: The Robot Dog
  **Her Verdict:** It is **wrong** to sell/kick the robot dog (specifically to kick it).

  *   **Why:** Under the Indirect Duty rule, the moral wrongness of kicking a dog is not located in the dog's pain (since the dog has no rights), but in the **human reaction to the appearance of pain.**
  *   **The Logic:** The robot yelps and cringes convincingly enough that "people wince." To kick it is to practice the *maxim* of cruelty. It exercises the muscle of domination over something that simulates suffering. This dulls the agent's sympathy just as effectively as kicking a real dog.
  *   **Contrast:** A "Direct Duty" theorist (who believes animals have inherent value) would say kicking the robot is **fine**. The robot has no sentience, no welfare, and no interests. Nothing is harmed *in itself*.

  ### Prediction 2: The Quarantined Cat (Secret Torture)
  **Her Verdict:** It is **permissible** (or at least, not a violation of duty).

  *   **Why:** This is the hard pill of the Kantian view. If the *only* reason cruelty is wrong is that it damages the human character or spreads bad habits to society, and you have empirically verified that **neither of those things happens**, the prohibition vanishes.
  *   **The Logic:** The cat cannot claim a right. The humanity in the man is unchanged. The humanity in society is unaffected. Therefore, no duty has been violated. It might be "disgusting," but it is not morally forbidden in the strict deontological sense.
  *   **Contrast:** A "Direct Duty" theorist would say it is **wrong**. The wrongness is located in the violation of the cat's integrity. The agent's character is irrelevant to the victim's suffering.

  ### Which Case Settles It?
  **The Quarantined Cat is the true settler.**

  Here is why: The Robot Dog case leaves a small loophole for a Direct Duty theorist. They might argue, "Kicking the robot is wrong because it confuses observers or normalizes violence against real dogs later." That is a consequentialist argument that overlaps with Kant's Indirect Duty. It doesn't cleanly separate the two rules.

  The **Quarantined Cat** case removes all consequences. It isolates the **locus of value**.
  *   If she says it's **wrong**, she admits value resides in the *animal's experience* (Direct Duty).
  *   If she says it's **permissible**, she admits value resides in the *human agent's character* (Indirect Duty).

  Given her dissertation topic and the "Gravestone" data point, she will likely bite the bullet and say the secret torture is permissible (or morally neutral), confirming she is running a strict Kantian Indirect Duty framework. If she hesitates and says it's still wrong, she has silently abandoned Kant for a modern modification (like Christine Korsgaard's view) that grants animals a form of direct status.

  ### Summary of the Rule She Is Running
  **"Cruelty is forbidden not because the animal suffers, but because the human who inflicts it damages their own capacity for virtue."**

  *   **Fits:** Killing chickens (no character damage if painless), Vivisection (virtue of science outweighs), Gravestone (duty to respect symbols).
  *   **Predicts:** Robot Dog = Wrong (simulated suffering damages virtue). Secret Cat = OK (no damage to virtue).
