answer: |-
  The waveform on Elena's screen was flat. Not dead-flat, but the specific, polite flatness of a lie that had been rehearsed enough to become truth.

  She sat in the quiet hum of the Adjudication Chamber, Level 4. The air was recycled and cool, smelling faintly of ozone and toner. On her desk, the physical file for Claimant 8940—David Kress—sat closed. She hadn't opened it. The paper didn't matter. The truth, such as it was, lived in the neural logs scrolling silently on her monitor.

  David Kress had been caught in a hydraulic press failure at the logistics hub. By all physical accounts, his left arm had been crushed. Bone had shattered. Nerves had fired in a scream that should have lasted forty-five seconds before shock set in.

  David Kress had undergone Reconciliation three hours after the incident.

  Now, he was filing for Full Suffering Damages.

  The insurance algorithm had auto-rejected him. The biometric residue in his cortex showed no trace of *active* pain processing during the window of the accident. The Reconciliation had worked too well. There was no scar tissue in the memory engrams. There was no phantom echo.

  Elena's job was to manually override the algorithm. She had two buttons on her console.

  **LEFT: PROACTIVE (TYPE A).** *The experience was intercepted. The subject did not consciously endure the trauma. Compensation: Medical costs only.*

  **RIGHT: RETROACTIVE (TYPE B).** *The experience was completed, then edited. The subject endured the trauma. Compensation: Medical + Pain/Suffering + Psychological Hazard.*

  The difference in payout was a factor of twelve. The difference in liability for the clinic that performed the Reconciliation was criminal negligence versus standard care. Retroactive editing was legal, but it required higher bandwidth and carried a risk of synaptic drift. Proactive was safer, cheaper, and cleaner.

  The logs were indeterminate. The encryption on the clinic's server had a thirty-hour decay rate. It had been thirty-one hours. The metadata that would prove whether the brain had been stopped *before* the pain or wiped *after* the pain had evaporated.

  Elena was the only variable left.

  She leaned back, the leather of her chair creaking. She needed to hear him again. She tapped the comms link.

  "Send him in."

  David walked in without the brace. That was the first thing the report noted. *Full motor function restored.* He looked like a man who had gone to a spa for the weekend, not a man whose limb had been turned to pulp. He wore a grey suit that fit too well. He sat in the chair opposite her desk and folded his hands.

  "Ms. Vane," he said. His voice was even. No tremor.

  "Mr. Kress. You understand why we're meeting."

  "Because the machine says I didn't hurt."

  "Because the machine says there is no record of you hurting."

  David smiled. It was a thin smile, not unkind, but devoid of warmth. "Is there a difference?"

  "In the eyes of the contract, yes."

  "In the eyes of God?"

  Elena didn't answer. She looked at his left arm. It rested on the armrest. The skin was smooth. There was a faint discoloration where the bone had broken, a shadow under the dermis that the regen-foam hadn't quite matched.

  "Tell me about the accident," Elena said.

  "I was loading the crate. The seal failed. The press came down."

  "And then?"

  "And then I was here. In the recovery ward. My wife was crying. I told her I was fine."

  "Do you remember the pain?"

  "No."

  "Do you remember *not* feeling pain?"

  David paused. He looked down at his hand, flexing the fingers. "I remember the press coming down. I remember the dark. Then I remember the light in the recovery ward. There's a gap. I know there's a gap. But inside the gap... there's nothing. Not even black. Just... missing time."

  "Most Proactive subjects report a jump cut," Elena said, keeping her voice neutral. "Like a film splice. You see the press, then you see the hospital."

  "And Retroactive?"

  "They remember the pain, but it feels like a story they read about someone else. Distant. Faded."

  "I don't feel that either," David said. "I just know it happened. My arm knows it happened. Sometimes, when it rains, the joint aches. The memory doesn't ache. The meat aches."

  Elena tapped her pen against the desk. "Mr. Kress, if I classify this as Proactive, the clinic is cleared. They used the standard safety protocol. They intercepted the signal before it reached your thalamus. You were unconscious to the event. You didn't suffer."

  "And if you classify it as Retroactive?"

  "Then you suffered. And the clinic failed to mitigate the trauma in real-time, which violates the safety charter. They get fined. You get paid."

  David nodded slowly. "So, if I say I hurt, I get money, and they get in trouble."

  "If you say you hurt, and I believe you."

  "Do you believe me?"

  Elena looked at the waveform on her screen. It was still flat. "I believe the data is inconclusive."

  "Then what do you need from me?"

  "I need to know why you're pushing for Retroactive. The medical payout covers your lost wages. The hazard bonus is... significant."

  David leaned forward. For the first time, his eyes sharpened. "My wife thinks I'm a coward."

  Elena blinked. "Excuse me?"

  "She was in the waiting room. She saw the blood. She knows what the press does. When I walked out smiling, when I said I didn't feel a thing... she looked at me like I was broken. Like I didn't love her enough to feel it."

  "That's irrational."

  "Is it?" David asked. "If I didn't feel it, then what did I lose? Just some skin and bone. If I felt it... then I survived something. I endured. She wants me to be a survivor, Ms. Vane. Not a lucky glitch."

  Elena stopped tapping her pen. This was the part they didn't put in the training manuals. The metaphysics of the payout.

  "Mr. Kress, the procedure is designed to remove suffering. Not to validate it."

  "I know that. But now I'm stuck. If I take the Proactive settlement, I'm admitting I didn't suffer. I'm admitting I'm... light. Untouched. If I take the Retroactive, I'm admitting I was broken and put back together."

  "And which is true?"

  David sat back. He looked tired then, just for a second. The mask slipped. "I don't know. That's the problem. I was there. I was the one in the press. And even I can't tell you if I felt it."

  He stood up. "You have to decide, don't you? You're the arbiter."

  "I am."

  "Then decide." He didn't wait for a dismissal. He turned and walked out, his gait perfect, his left arm swinging naturally at his side.

  Elena sat alone in the silence.

  She pulled up the clinic's logs again. She zoomed in on the timestamp of the Reconciliation. *14:02:15.* The accident occurred at *14:01:30.*

  Thirty-five seconds of unmonitored biological activity.

  In a Proactive edit, the neural dampeners engage instantly upon detection of catastrophic trauma. The brain never registers the nociceptors firing. The experience is rendered around the damage. The brain fills in the gap with a smooth transition.

  In a Retroactive edit, the brain is allowed to process the event. The memory is formed. Then, a secondary sweep overwrites the emotional valence and the sensory detail, replacing it with a neutral narrative.

  The problem was the *rendering*.

  Elena closed her eyes. She thought about the demo she'd seen in training. The blue dot, the red dot. Flash them fast enough, and the mind sees a dot moving and changing color. The mind constructs the trajectory *after* the second dot appears. The mind lies to keep the story continuous.

  Consciousness wasn't a stream. It was a draft. It was a document saved in auto-recovery every few milliseconds. If you opened the file later, you couldn't tell if the typo was never typed, or if it was typed and then backspaced.

  If she ruled Proactive, she was saying David's consciousness had never touched the fire. He was innocent of the pain.

  If she ruled Retroactive, she was saying he had burned, and someone had taken the blister off his mind.

  The clinic, *NeuroDyne*, was a partner of the insurance firm. They used Proactive as the default. It was cheaper. It was safer. But rumors persisted. Sometimes, when the trauma was complex, Proactive failed. The signal leaked through. To cover the liability, the techs would switch to Retroactive mid-procedure. They'd let the patient scream, then wipe the scream.

  If Elena ruled Retroactive, she triggered an audit. NeuroDyne would be investigated. If the audit found they used Retroactive without consent, they would lose their license. Hundreds of patients would be destabilized. Their edits might unravel.

  If she ruled Proactive, David got less money. His wife would think he was hollow. But the clinic stayed open. The other patients stayed stable.

  She looked at the two buttons.

  **LEFT: PROACTIVE.** *Truth of the Body.*
  **RIGHT: RETROACTIVE.** *Truth of the Mind.*

  But which truth mattered?

  If the brain constructs the experience *after* the fact anyway, does it matter when the edit happens? If David's current reality is identical in both scenarios, is the distinction real?

  Dennett's ghost seemed to hover over the keyboard. *Orwellian.* *Stalinist.* The industry slang.

  If she clicked Left, she was saying the history was never written. (Stalinist).
  If she clicked Right, she was saying the history was rewritten. (Orwellian).

  She opened David's file again. She looked at the photo of him before the accident. He looked tense in the photo. Shoulders hunched. After the accident, in the recovery ward photo, he looked relaxed.

  Had the pain made him tense? Or did the removal of the pain make him relaxed?

  If he hadn't felt the pain, why was he relaxed? Because the trauma was gone.
  If he had felt the pain, why was he relaxed? Because the memory was gone.

  The outcome was the same. The man was healed.

  But the money. The money was for the *hurt*. Not the healing.

  Elena's finger hovered over the mouse.

  She thought about her own brother. He had died in a car crash ten years ago. No Reconciliation then. She remembered the call. She remembered the drive to the hospital. She remembered the smell of the flowers at the funeral.

  She remembered the pain. It was sharp, jagged. It had edited her. It had changed the shape of her life.

  If someone had offered her a procedure then. To go back and make it so she never felt the loss. To make the memory smooth.

  Would she have taken it?

  If she took it, and it was Proactive, she would never have grieved. The loss would be a fact, like a math equation. *Brother = Deceased.*

  If she took it, and it was Retroactive, she would have grieved, and then the grief would be taken away.

  Would the person sitting in this chair be the same person?

  If the edit was Proactive, the version of Elena who suffered never existed. She was a branch that was pruned before it grew.
  If the edit was Retroactive, the version of Elena who suffered existed, and was killed.

  David wanted to be the survivor. He wanted the scar on his soul, even if the scar on his mind was gone. He wanted the payout to validate the history of his own endurance.

  But if the history was fabricated to get the payout... was it valid?

  If she clicked Right, and it was actually Proactive, she was lying. She was creating a victim where there was none.
  If she clicked Left, and it was actually Retroactive, she was erasing a victim who existed.

  The screen saver kicked in. A geometric pattern, shifting colors. Blue to red. Red to blue. Smooth transitions. No jumps.

  She moved the mouse. The screen woke up.

  She thought about the clinic. NeuroDyne. She knew the director. He was a pragmatist. He cared about stability. He would have used Proactive. He would have cut the signal before it spiked. It was the responsible choice.

  But David's wife. She needed him to have survived. She needed the narrative of endurance.

  Elena realized she was looking for a fact that wasn't in the file. She was looking for the *moment*. The moment where experience became memory. The moment the draft was finalized.

  But the logs didn't show the drafting process. They only showed the final save.

  There was no fact of the matter. Not anymore. The universe had collapsed the wave function. David was both the one who suffered and the one who didn't, until she opened the box. Until she clicked.

  Her choice wouldn't discover the truth. It would *create* it.

  If she clicked Left, David never suffered.
  If she clicked Right, David suffered.

  Her finger trembled.

  She thought about the money. Twelve times the payout. It would change David's life. He could quit the warehouse. He could move his wife somewhere safer. He could give her the story she wanted.

  She thought about the clinic. An audit could shut them down. Other patients, hundreds of them, relied on the stability of their edits. If the edits unraveled because the clinic was fined into insolvency, those people would wake up with pain they thought was gone. Real pain. Unedited pain.

  David's suffering was in the past. Even if it was Retroactive, it was over.
  The other patients' suffering was potential. It was waiting in the wings.

  She looked at the waveform one last time. Flat. Polite.

  There was no way to know. There would never be a way to know. The dots would always move smoothly, regardless of how they flashed.

  Elena took a breath. She didn't feel like a god. She felt like a clerk. A clerk with a stamp that could rewrite history, or at least, the receipt for history.

  She moved the cursor.

  She didn't click Left.
  She didn't click Right.

  She opened a new command window. *Query: Ambiguity Clause 74.*

  *If the nature of the experience is ontologically indeterminate, default to the status quo of the subject's current testimony.*

  David had said: *I know it happened. The meat aches.*

  He didn't claim he felt the pain. He claimed the event occurred.

  Elena typed a note into the justification field.

  *Claimant reports physical sequelae consistent with trauma. Neural logs show successful Reconciliation. Method of Reconciliation indeterminate due to data decay. Per Clause 74, adjudication based on physical outcome rather than experiential method.*

  She selected a third option. It wasn't on the main screen. It was buried in the admin menu. *Settlement: Physical Damages Only. Hazard Waived.*

  It was less money than Retroactive. More than Proactive. It didn't validate the pain. It didn't deny the injury. It sidestepped the question.

  It would annoy David. It would annoy NeuroDyne. It would leave the question unanswered.

  Elena's finger hovered over the *Submit* key.

  She realized this was the only honest answer. To refuse to choose between the two lies. To acknowledge that the draft was still open, even if the file was closed.

  She pressed the key.

  The screen flashed green. *Processed.*

  The waveform vanished, replaced by the next file in the queue. Claimant 8941. A fall from a ladder. Reconciliation status: Pending.

  Elena picked up her pen. She tapped it against the desk. The rhythm was steady. Outside the window, the city lights flickered on, one by one, like neurons firing in the dark. She watched them, waiting to see if they moved, or if they just appeared.

  She couldn't tell.

  She opened the file.
