answer: |-
  No, the symmetry objection fails because it conflates epistemic access with ontological completeness.

  On point (a), you are begging the question. Physicalism claims the physical description is exhaustive; dualism explicitly denies this. To insist that a 'complete dualist description' would still leave Mary ignorant is to treat mental facts as merely another set of propositions akin to physical ones, rather than as the fundamental constituents of reality they are purported to be. If dualism is true, the complete description of the world *includes* the phenomenal facts by definition, whereas physicalism claims the physical description *entails* them. The asymmetry lies in the claim of exhaustiveness, not in the subjective gap itself. You are holding both metaphysics to a standard of descriptive transparency that only physicalism claims to satisfy.

  On point (b), the objection collapses squarely into the Phenomenal Concept Strategy (PCS). By arguing that the gap is between description and experience rather than physical and non-physical facts, you are conceding the epistemic gap while denying the ontological one. This is precisely the PCS move: physicalism is true, but phenomenal concepts are distinct from physical concepts, so Mary gains a new concept, not a new fact. If this is your argument, you are not mounting a novel symmetry objection; you are simply reheating a standard physicalist defence. It does not prove too much, but it does no new work against the dualist who rejects the PCS premise that phenomenal knowledge is merely conceptual.

  On point (c), yes, there is a version of the Knowledge Argument where the asymmetry survives, so you are wasting your time trying to neutralise it via symmetry. The argument retains its dualist teeth when framed around entailment rather than mere description. Physicalism entails that all facts are derivable from physical facts. If Mary learns a new fact, physicalism is falsified. Dualism makes no such entailment claim, so the new fact is consistent with dualism. The burden of explanatory completeness rests uniquely on physicalism, and the Knowledge Argument exploits that specific vulnerability. You cannot symmetrise a debate where the opposing sides have fundamentally different commitments regarding what counts as a complete description.
