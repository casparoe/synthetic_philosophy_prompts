answer: |-
  Your suspicion identifies the decisive break: the maximally specific class collapses probability to certainty, whereas the complete microstate remains informative. Consequently, the analogy undermines rather than supports the claim that a principled, non-pragmatic reference class exists.

  Here is the explicit correspondence you requested:

  | Physics | Probability (Reference Class) |
  | :--- | :--- |
  | Complete Microphysical State | Maximally Specific Reference Class |
  | Macroscopic Variable (e.g., Temperature) | Standard Reference Class (e.g., Age, Sex) |
  | Coarse-graining Map | Ignoring Specific Properties |
  | Ontological Fundamentality | Objective Single-Case Chance |

  The mapping breaks in two places, but only one matters for your purpose. The first break is epistemic: we cannot know the complete microstate, nor the maximally specific class. This break is idle. Your seminar colleagues are arguing for the *existence* of a correct class, not our access to it, just as statistical mechanics assumes microstates exist regardless of our measurement capabilities.

  The second break is ontological, and it is decisive. In physics, the complete microstate determines the outcome (deterministically) or grounds the objective chance (stochastically). It is maximally informative without eliminating the concept of probability. In the reference class framework, however, the probability *is* the frequency. The maximally specific reference class for a single event contains only that event. Its frequency is necessarily 0 or 1. By pushing the analogy to its limit, you do not find the "true" probability; you eliminate probability entirely. The microstate preserves the distinction between possibility and actuality; the singleton class collapses them.

  This directly bears on your use of the analogy. You wish to license the claim that a principled, non-pragmatic choice of reference class exists. If the "complete" class yields only trivial probabilities (0 or 1), it cannot serve as the truth-maker for non-trivial single-case chances (e.g., "0.8 chance of recovery"). To save the analogy, one must assume that the "complete state" carries a propensity or chance parameter distinct from frequency. But this abandons the frequentist motivation for the reference class problem in the first place. If chance is not frequency, the need to find the "right" frequency class dissolves. Thus, the analogy suggests that if there is a "complete description," it does not yield a frequency-based probability, defeating the original argument.

  Regarding a better analogy, the comparison to causal explanation is superior. In causal explanation, we do not seek the "complete cause" (which would include the entire past light cone), but rather the difference-makers relevant to our explanatory interests. There is no fact of the matter about the "one true cause" independent of context; there are only causes relative to a contrast class and an explanatory goal.

  This maps cleanly to reference classes. There is no "one true class," only classes relevant to specific predictive interests. If I am an insurer, the class of "smokers aged 50" is objective relative to my actuarial goals. If I am a geneticist, the class of "carriers of gene X" is objective relative to biological mechanisms. Neither is the "complete" class. This analogy accepts that the choice of class is pragmatic without surrendering objectivity entirely; the objectivity lies in the relation between the class and the interest, not in the class alone. This avoids the singleton collapse while respecting the intuition that some classes are better than others for specific purposes. It suggests the reference class problem is not a bug to be solved by finding a microstate analogue, but a feature of how probability functions as a tool for agents embedded in the world.
