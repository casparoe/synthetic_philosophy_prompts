prompt: |-
  I'm in a reading group on mid-century cybernetics and I've gotten weirdly obssesed with von Neumann's late thinking about the brain -- the unfinished Silliman lectures that came out after he died as The Computer and the Brain, plus his automata work from around then (the Hixon symposium paper, the self-reproducing automata stuff, all the McCulloch-Pitts-style formal neurons). What keeps nagging at me is the irony: the guy whose name is on the stored-program architecture -- which, as I understand it, was basically Eckert and Mauchly's design that he wrote up and got credit for -- seems to have ended up thinking the brain was not much like a digital computer at all. As I read him: neurons are slow and flaky compared to vacuum tubes, so the brain has to buy its reliability with redundancy and statistics instead of precision; the signaling looks half analog (firing rates) and half digital (all-or-nothing spikes); the computation is low-precision and massively parallel rather than serial and exact; memory obviously isn't fetched by address the way a machine's is, which he seems to have found the deepest puzzle of all; and the central unsolved problem was the notation or language the nervous system uses, which nobody had cracked. So his name is on the architecture and also on the bottleneck people now complain about (the memory/processor traffic jam), and my hunch is he'd have found that funny and a bit beside the point, since his own picture of the brain was closer to what we'd now call analog/neuromorphic than to anything von Neumann-architecture-ish.

  Here's what I want from you. Take the role of a historian of science who knows the 1940s-50s cybernetics literature cold and also actually understands modern machine learning, and think this through carefully rather than giving me the standard line about him being a visionary who foresaw the computer age. Suppose von Neumann gets dropped into 2025 with a decent technical briefing. What would he say about: transformers and LLMs trained by gradient descent over internet text; scaling laws; the fact that backprop is biologically absurd; neuromorphic and analog hardware; whole-brain emulation; and the argument (Searle's Chinese Room is the version I know) that a system can manipulate symbols flawlessly without understanding a thing. Then the part I'm most curious about -- he spent his last years deep inside the defense establishment, AEC commissioner, missile committees, remembered as the hawk's hawk on nuclear strategy, so would he have transferred that whole posture to AI, and if so what would he actually have recommended, and where does the analogy between the bomb and a model break down?

  Start by brainstorming: list the handful of things he genuinely did commit to about brains versus computers, flag which of my claims above you'd correct or complicate, and then go item by item. For each prediction tell me which specific commitment of his it follows from, how confident you are, and where you're really just extrapolating from vibes. Where I'm most likely misreading him, tell me straight. And no citations or reading lists please, I'm typing this on a phone on a train -- I want the arguement, not the bibliography.
