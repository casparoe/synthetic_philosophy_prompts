          6.  Propose a better comparison (Constitution, Traffic Code, Insurance) and explain the shift.

  2.  **Deconstruct the Analogy (Culture = Immune System):**
      *   *Core Claim:* Tight norms are a defensive mechanism against existential threats, similar to an immune response.
      *   *Implication:* Criticizing them is like telling a sick body to stop fighting; loose norms are a luxury of safety.

  3.  **Drafting the Correspondence Table:**
      *   *Pathogen:* External threats (war, scarcity, outsiders, ideological contamination).
      *   *Immune Response:* Enforcement of norms, social pressure, legal restrictions.
      *   *Antibody:* Specific rules or rituals designed to neutralize specific threats (e.g., dress codes, hospitality rules).
      *   *Memory of Past Infection:* History, tradition, collective trauma, religious texts.
      *   *Fever:* Social unrest, heightened policing, public shaming campaigns (the cost of the response).
      *   *Autoimmune Disorder:* When norms turn inward and harm the society they protect (e.g., stifling innovation, persecuting harmless minorities, paralysis).

  4.  **Analyzing the Breaks in the Mapping:**
      *   *Break 1: Learning/Revision.* Immune systems evolve biologically (slowly) or adaptively (antibodies). Cultures are consciously debated and changed. *Does it matter?* Yes, because it implies agency. We can choose to lower the fever; a body cannot simply choose.
      *   *Break 2: System Boundaries.* Immune systems distinguish self/non-self clearly. Cultures have porous boundaries (globalization, internet). *Does it matter?* Yes, because "outsiders" are often inside the system already.
      *   *Break 3: Consensus on Health.* Biology has a clear state of homeostasis. Culture does not agree on what "healthy" looks like. *Does it matter?* Crucially. One person's protection is another's oppression.
      *   *Break 4: Intent.* Immune systems have no intent. Cultural enforcers have interests (power, status). *Does it matter?* Yes, it introduces the possibility of manipulation disguised as protection.

  5.  **Identifying Quiet Imports (Biological Assumptions):**
      *   *Proportionality:* Immune responses *tend* toward proportionality (usually). Cultural responses can be wildly disproportionate (stone age penalties for modern issues).
      *   *Exogenous Threats:* Biology fights external invaders. Culture often fights internal dissent or abstract concepts.
      *   *Cell Interests:* Cells don't object. People do. Suffering matters in culture; it doesn't matter to a white blood cell.
      *   *Objective Health:* "Survival" is the biological metric. "Flourishing" is the cultural metric, which is contested.

  6.  **Evaluating the Conclusion ('Adaptive' vs. 'Legitimate'):**
      *   The analogy suggests: If it's adaptive (protects survival), it's legitimate (shouldn't be criticized).
      *   *Critique:* This is the Naturalistic Fallacy. Just because something *does* protect doesn't mean it *ought* to be preserved if the cost is too high (e.g., freedom).
      *   *Verdict:* The analogy *assumes* the step rather than earning it. It conflates functional explanation with moral justification.

  7.  **Testing the Reverse (Looseness as Immune Response):**
      *   Copenhagen's "looseness" enforces conformity to *non-conformity*.
