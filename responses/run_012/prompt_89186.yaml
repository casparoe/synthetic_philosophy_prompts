      *   *Implication:* Both Doha and Copenhagen have immune systems; they are just fighting different pathogens (chaos/decay vs. stagnation/oppression).
      *   *Does it break?* No, it strengthens the descriptive power but weakens the normative shield. If both are immune responses, neither is "natural" or "neutral."

