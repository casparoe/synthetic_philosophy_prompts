          2.  Identify where the mapping breaks and judge which breaks matter.
          3.  Identify what the analogy quietly imports from biology that culture lacks (proportionality, exogenous threats, cell interests, definition of 'healthy').
          4.  Evaluate the conclusion: Does 'adaptive' imply 'legitimate'? Does the analogy earn this step?
