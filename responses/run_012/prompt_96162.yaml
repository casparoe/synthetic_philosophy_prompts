  # Distributive Justice Decision Tree

  **Starting Point:** We agree that the way a society distributes benefits and burdens can be just or unjust.

  ### Node 1
  **When dividing social benefits, should we aim to make everyone's share *equal*, or should we give people what they *deserve* based on their effort or character?**
  *   **A:** Give people what they deserve. $\rightarrow$ **Leaf 1: Desert Theory**
  *   **B:** Aim for equality. $\rightarrow$ Go to Node 2.

  ### Node 2
  **What is the main harm of inequality? Is it that some people *have less*, or that some people *dominate or look down on* others?**
  *   **A:** Dominate/look down on others (Status). $\rightarrow$ **Leaf 2: Relational Egalitarianism**
  *   **B:** Have less (Stuff). $\rightarrow$ Go to Node 3.

  ### Node 3 (Case: The Happy Slave)
  **Consider someone who has very little but says they are perfectly content (they have adapted their preferences to their lack). Are they worse off than others?**
  *   **A:** No, their contentment is what counts. (Welfare Path) $\rightarrow$ Go to Node 4.
  *   **B:** Yes, they lack objective goods or opportunities. (Objective Path) $\rightarrow$ Go to Node 5.

  ### Node 4
  **Can we measure everyone's satisfaction on a single scale to say definitively who is worse off?**
  *   **A:** Yes. $\rightarrow$ Go to Node 6.
  *   **B:** No. $\rightarrow$ **Leaf 3: Incoherent View** *(Note: A welfare view that denies we can compare welfare is generally considered indefensible.)*

  ### Node 5 (Case: The Ramp)
  **To help a disabled person participate equally, do we give them equal *money/resources*, or ensure they can *actually function* (e.g., enter the building)?**
  *   **A:** Ensure they can actually function. $\rightarrow$ **Leaf 4: Capabilities Approach**
  *   **B:** Give equal money/resources. $\rightarrow$ Go to Node 6.

  ### Node 6 (Case: Expensive Tastes)
  **If someone is worse off because of a voluntary choice (e.g., they cultivated expensive tastes), do others have a duty to compensate them?**
  *   **A:** Yes, compensate them. $\rightarrow$ Go to Node 7.
  *   **B:** No, they are responsible for that loss. $\rightarrow$ **Leaf 5: Luck Egalitarianism**

  ### Node 7
  **If everyone has "enough" to live a decent life, does it still matter if some have vastly more than others?**
  *   **A:** No, enough is all that matters. $\rightarrow$ **Leaf 6: Sufficiency View**
  *   **B:** Yes, gaps still matter. $\rightarrow$ Go to Node 8.

  ### Node 8
  **If we could make the rich poorer without helping the poor (leveling down), would that be good in any way?**
  *   **A:** Yes, equality is valuable in itself. $\rightarrow$ **Leaf 7 & 8: Strict Egalitarianism** *(See Note Below)*
  *   **B:** No, that is pointless; only helping the worse off matters. $\rightarrow$ **Leaf 9: Prioritarianism**

  ***

  ### Leaf Notes & Flags

  **Leaf 1: Desert Theory**
  Distribution tracks moral worth, contribution, or effort. Inequality is just if it reflects desert.

  **Leaf 2: Relational Egalitarianism**
  Justice is about social status, not shares. The goal is a society where no one lords it over another.

  **Leaf 3: Incoherent View**
  You selected Welfare + No Index. Most philosophers argue you cannot have a welfare-based justice theory without assuming we can compare welfare across persons.

  **Leaf 4: Capabilities Approach**
  Justice is about expanding what people are actually able to do and be (functionings), not just giving them resources.
  *(Note: This leaf combines views that aggregate capabilities into a single index and views that treat them as plural/incomparable.)*

  **Leaf 5: Luck Egalitarianism**
  Inequalities due to brute luck should be corrected; inequalities due to option luck (choice) need not be.
  *(Note: This applies whether your metric was Welfare or Resources.)*

  **Leaf 6: Sufficiency View**
  Justice requires everyone to have enough. Inequalities above the threshold are not unjust.
  *(**Flag:** In practice, Sufficiency and Prioritarianism often recommend the same policies. The distinction is theoretical: Sufficiency cares about a threshold; Prioritarianism cares about weighting benefits to the worse off.)*

  **Leaf 7: Strict Welfare Egalitarianism**
  (Reached via Node 3A). Gaps in satisfaction are unjust even above a threshold, even if leveling down makes everyone less satisfied.

  **Leaf 8: Strict Resource Egalitarianism**
  (Reached via Node 5B). Gaps in resources are unjust even above a threshold, even if leveling down wastes resources.
  *(**Flag:** Your tree cannot separate Strict Egalitarianism from Prioritarianism on many concrete cases, only on the abstract "Leveling Down" intuition.)*

  **Leaf 9: Prioritarianism**
  Benefits to the worse off matter more than benefits to the better off, but equality itself has no intrinsic value.
  *(**Flag:** See Leaf 6. Sufficiency and Prioritarianism are often indistinguishable in application despite this theoretical branch.)*
