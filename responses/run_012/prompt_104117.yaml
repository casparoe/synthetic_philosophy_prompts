  7.  **Final Review against Constraints:**
      *   Did I cover all 5 points? Yes.
      *   Did I use the specific terms (frame, header, etc.)? Yes.
      *   Did I address the 3 leak points? Yes.
      *   Is the tone right? Needs to be respectful of the engineer's ontology while maintaining philosophical rigor.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Compare implicature to metadata.
      *   *Correction:* Metadata is usually explicit (headers). Implicature is *inferred*. Better comparison: Inferred network state (e.g., packet loss implies congestion) vs. explicit congestion notification.
      *   *Initial thought:* Reflexive intention is like a 3-way handshake.
      *   *Correction:* A handshake establishes a channel. Reflexive intention establishes *meaning*. It's more like the difference between a broadcast (fire alarm) and a directed message with an expected ACK that validates the *understanding* of the intent.
      *   *Normativity:* Crucial distinction. Protocol violations drop packets. Gricean violations generate *new* meaning (irony, etc.). I need to emphasize that engineering lacks a "Irony Mode" in the state machine.

  9.  **Final Polish:** Ensure the "Residue Report" is candid and doesn't smooth over the cracks. The prompt asks for "candid residue report."

