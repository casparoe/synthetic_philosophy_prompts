      *   *Normativity:* Protocols are strict (RFC 2119 MUST/SHOULD). Grice's maxims are "MAY violate if justified." This is the biggest gap. Engineering has "Graceful Degradation" or "Best Effort," but violating a spec usually means "Non-compliant." Grice allows "Flouting" to generate meaning. Engineering treats flouting as "Malformed Packet." *Correction:* Maybe "Heuristic Heuristics" or "Congestion Control algorithms" which adapt rules based on conditions? No, that's still algorithmic. The gap is *Rational Agency* vs. *State Machine*.

  5.  **Refining the Engineering Metaphors:**

      *   *Header:* Syntax/Logical Form.
      *   *Payload:* Propositional Content ("What is said").
      *   *Side-channel/Context:* The environment used for implicature.
      *   *QoS:* The Maxims.
      *   *Error Correction:* Explicating the implicature (making it explicit).

  6.  **Developing the Verdict:**
      *   Is Grice wrong? No.
      *   Is Engineering limited? Yes, it models *systems*, not *minds*.
