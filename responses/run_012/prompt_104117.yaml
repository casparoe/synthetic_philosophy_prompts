      *   *Maxims:* QoS constraints fit well here. Quantity = Bandwidth efficiency. Quality = Integrity. Relation = Routing/Context. Manner = Serialization/Encoding.
      *   *Said/Implicated:* Payload vs. Inferred State.
      *   *Cancellability:* Explicit override flags.

  4.  **Addressing the "Leak Points" (The Residue Report):**

      *   *Reflexive Intention:* Engineering usually treats intent as fixed in the spec. Grice requires the *recognition* to be the cause. In engineering, if I see a SYN, I know you want to connect. Do I connect *because* I know you want to connect? Yes. But do I know you *intended* me to know? The spec dictates that. The "nesting" is hard-coded in the state machine. *Verdict:* Engineering collapses the nesting into state transitions.
