  *(Self-Correction on "Cancellability")*: Deniability is definitely the wrong analog. Deniability is "I didn't send it." Cancellability is "I sent it, but don't infer X." In protocols, this is an "Explicit Override" or "Flag Precedence." I must make this distinction clear.

  *(Self-Correction on "Normativity")*: The engineer thinks in "Compliance." Grice thinks in "Rational Expectation." The engineering equivalent of "Flouting a maxim to generate meaning" is essentially "Using a Error State as a Signal." (e.g., sending a specific malformed packet to trigger a specific out-of-band behavior). This is "Hack/Exploit" in engineering, "Implicature" in philosophy. That's a strong point to make.

