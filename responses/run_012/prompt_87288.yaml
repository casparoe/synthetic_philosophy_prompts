  ### What This Procedure Cannot Do (The Plain Talk)

  You asked for the limitations. Here they are. Do not ignore them.

  1.  **The Intent Guess:** Phase 2, Q5 is still a guess. You are inferring mental states from body counts and press releases. A smart lawyer can always construct an "Alternative Explanation" (e.g., "Collateral Damage") to defeat your inference. The procedure standardizes the guess, but it doesn't make it objective fact.
  2.  **The Assimilation Grey Zone:** In Dossier (b), the distinction between "Destroying the group" and "Forcing them to assimilate" is legally murky. International tribunals have ruled both ways. Your researcher will be making a legal call they aren't qualified to make. That's why the Legal Advisor hand-off exists, but with one part-time advisor, they may just rubber-stamp your work.
  3.  **The Safety Lie:** Step 2 (Risk Hand-off) assumes the Board will make a rational safety calculation. Often, Boards make decisions based on donor pressure, not staff safety. The procedure flags the risk, but it cannot mitigate it.
  4.  **The "Vibes" Leak:** If your researchers hate the outcome (like in Dossier A), they will leak to the press anonymously. The procedure stops *official* reports from saying "Genocide," but it cannot stop your team from believing it is genocide and saying so off the record.
  5.  **Time vs. Truth:** You have one hour. Real legal determinations take months. This procedure gives you a *defensible position*, not a *truth*. It protects the organization from being easily debunked, but it does not guarantee you are morally right.

  **Final Instruction:** If the procedure says "Hand-off," do not publish. If the procedure says "Ethnic Cleansing," do not use the G-word to describe the legal reality, even if you use it to describe the cultural reality in a sidebar. Precision is your only armor.
