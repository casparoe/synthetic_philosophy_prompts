answer: |-
  This is a **Genocide Determination Protocol (GDP)**. It is designed for a research desk, not a court of law. Its purpose is to standardize your internal reasoning so that when you publish, you know *why* you used the word, and when you don't, you know what you are describing instead.

  It separates the **Legal Track** (1948 UN Convention) from the **Sociological Track** (Lemkin). It forces you to choose which game you are playing before you write the headline.

  ### The Genocide Determination Protocol (GDP)
  **Time limit:** 60 minutes per dossier.
  **Operator:** Senior Researcher.
  **Required:** Dossier (testimony, imagery, casualty lists, field notes).

  ---

  #### Phase 1: The Group & The Acts (15 Minutes)
  *Goal: Determine if the basic ingredients exist.*

  **Q1. Is the target group "protected" under the 1948 Convention?**
  *   **Check:** Is the group defined by Nationality, Ethnicity, Race, or Religion?
  *   **Yes:** Proceed to Legal Track.
  *   **No (e.g., Political, Economic, Social Class):** Stop Legal Track. You cannot legally call this genocide under the Convention. You may proceed to Lemkin Track (Phase 4).
  *   **Note:** If the group is mixed (e.g., a region with one dominant ethnicity), does the violence target that ethnicity specifically, or everyone in the region?

  **Q2. Do the acts fit Article II of the Convention?**
  *   **Check:** Look for evidence of *any* of the following:
      1.  Killing members of the group.
      2.  Causing serious bodily or mental harm.
      3.  Inflicting conditions of life calculated to bring about physical destruction (starvation, blocking aid).
      4.  Imposing measures intended to prevent births (sterilization, systematic rape for impregnation).
      5.  Forcibly transferring children of the group to another group.
  *   **Yes:** Proceed to Phase 2.
  *   **No:** Stop. This is not genocide. (It may be Ethnic Cleansing or War Crimes).
  *   **Crucial Distinction:** Does the dossier show *destruction* of the people, or *removal* of the people?
      *   *Removal/Displacement only* = **Ethnic Cleansing** (Stop Legal Track).
      *   *Destruction/Killing* = **Proceed**.

  ---

  #### Phase 2: The Intent Inference Engine (25 Minutes)
  *Goal: Infer *dolus specialis* (specific intent to destroy) without a smoking gun.*
  *You will not find a memo saying "kill them all." You must build a pattern.*

  **Q3. Who is being killed? (The Demographics Test)**
  *   **A:** Only military-age men / combatants?
      *   *Inference:* Counter-insurgency / War Crime. **Weak** evidence of Genocide.
  *   **B:** Indiscriminate (women, children, elders)?
      *   *Inference:* Targeting the group's viability. **Strong** evidence of Genocide.
  *   **C:** Specific community leaders (imams, teachers, elders)?
      *   *Inference:* Decapitating the group's social structure. **Strong** evidence of Genocide.

  **Q4. What is the rhetoric? (The Speech Act Test)**
  *   **A:** Dehumanizing language ("vermin," "cancer," "no place in this country")?
      *   *Inference:* **Strong.**
  *   **B:** Security language ("terrorists," "insurgents," "clearing the zone")?
      *   *Inference:* **Weak.** (Unless proven false by demographics in Q3).
  *   **C:** Silence / Plausible Deniability?
      *   *Inference:* **Neutral.** Rely on Q5.

  **Q5. What is the "Alternative Explanation"? (The Motive Test)**
  *   **Question:** Can the violence be fully explained by *Looting*, *Land Grab*, or *Military Necessity*?
  *   **Test:** If the perpetrators take the land but leave the people alive elsewhere, it is Ethnic Cleansing. If they take the land and kill the people to ensure they never return/exist, it is Genocide.
  *   **Test:** If the perpetrators loot property but spare lives, it is War Crime / Pillage.
  *   **Decision:** If "Profit" or "Tactics" explains the violence better than "Elimination," you **cannot** infer Genocidal Intent.

  **Q6. Are there measures to prevent survival/return?**
  *   **Check:** Destruction of documents, banning of language, destruction of food sources, blocking of return.
  *   **Yes:** **Strong** evidence of Intent.
  *   **No:** **Weak** evidence.

  **Scoring Phase 2:**
  *   **High Confidence (Genocide):** Indiscriminate killing (Q3-B/C) + Dehumanizing Rhetoric (Q4-A) + No viable alternative explanation (Q5).
  *   **Medium Confidence (Referral):** Mixed indicators. Kick to Legal Advisor.
  *   **Low Confidence (Not Genocide):** Combatant-focused killing + Land Grab motive + Displacement focus.

  ---

  #### Phase 3: The "In Part" & Cultural Test (10 Minutes)
  *Goal: Define scope and handle the Lemkin gap.*

  **Q7. Is the part "Substantial"?**
  *   **Rule:** It does not need to be the whole group globally. It must be a significant portion *in the specific geographic context* or a distinct section essential to the group's survival (e.g., all the religious leaders).
  *   **Decision:** If the violence is isolated to one village with no spread, label it "Local Atrocity." If it is regional/systemic, it meets the "In Part" threshold.

  **Q8. The Lemkin Gap (Cultural/Economic Destruction)**
  *   **Question:** Is the group being culturally destroyed (schools, churches, language banned) *without* mass physical killing?
  *   **Legal Track (UNCG):** This is **NOT** Genocide. (Unless it involves child transfer).
  *   **Lemkin Track:** This **IS** Genocide (Cultural Genocide).
  *   **Action:** If you are on the Legal Track, you must label this **Crimes Against Humanity (Persecution)**. If you are on the Lemkin Track, you may use "Genocide" but must qualify it as "Cultural Genocide" in the text.

  ---

  #### Phase 4: The Labeling Matrix & Risk Hand-off (10 Minutes)
  *Goal: Assign the label and assess the political cost.*

  **Step 1: Assign the Factual Label**
  Based on Phases 1-3, choose one:
  1.  **Genocide (UNCG):** Intent to destroy + Protected Group + Physical/Biological Acts.
  2.  **Ethnic Cleansing:** Forced displacement + Removal (Not Genocide legally, but often a precursor).
  3.  **Crimes Against Humanity:** Widespread attack on civilians (The "catch-all" when Intent is thin).
  4.  **Cultural Genocide (Lemkin):** Destruction of group life without mass killing (Use with caution).

  **Step 2: The Risk Hand-off (The "Politics" Step)**
  *   **Question:** Does publishing the label "Genocide" endanger field staff, trigger funding cuts, or violate organizational risk tolerance?
  *   **If YES:** This is no longer a research decision. This is an **Executive Decision**.
  *   **Action:** File the finding as "Evidence supports Genocide classification, pending Executive Risk Review." Do not publish until the Board/ED signs off.
  *   **If NO:** Publish the Factual Label.

  ---

  ### Running the Dossiers

  Here is how the GDP processes your two scenarios.

  #### Dossier (a): The Land Grab
  *   **Facts:** Minority driven out. Schools/churches destroyed. Men of fighting age killed. Looting/Settlers present.
  *   **Phase 1 (Group/Acts):** Protected Group? Yes. Acts? Killing (Yes), Displacement (Yes).
  *   **Phase 2 (Intent):**
      *   *Demographics:* Mostly fighting-age men. **(Weak for Genocide)**.
      *   *Motive:* Looting and Land Grab are credible. **(Alternative Explanation exists)**.
      *   *Displacement:* Villages emptied, not necessarily massacred. **(Points to Ethnic Cleansing)**.
  *   **Phase 3 (Scope/Culture):** Cultural destruction is high (Lemkin), but physical destruction is limited to combatants.
  *   **Phase 4 (Label):**
      *   *Legal Track:* Fails the Intent Test (Q5). The motive appears to be acquisition of land, not elimination of the group *as such*. The killing fits counter-insurgency.
      *   *Result:* **Ethnic Cleansing / War Crimes.**
      *   *Lemkin Track:* Qualifies as Cultural Genocide.
  *   **GDP Output:** **Do not use "Genocide" (UNCG).** Label as **Ethnic Cleansing** with **Cultural Destruction**.
  *   **Why you might not like this:** Your desk is split. Half want to say Genocide because the culture is being erased. The procedure forces you to admit that under the law (and for safety), this is a land grab with violence, not an extermination campaign. It feels like letting them off the hook, but it preserves your credibility on the legal definition.

  #### Dossier (b): The Indiscriminate Killings
  *   **Facts:** Killing across board (kids/elders). Mosques demolished. Forced conversion/marriage. Minister rhetoric ("No place").
  *   **Phase 1 (Group/Acts):** Protected Group? Yes. Acts? Killing (Yes), Mental Harm (Yes).
  *   **Phase 2 (Intent):**
      *   *Demographics:* Indiscriminate (Kids/Elders). **(Strong for Genocide)**.
      *   *Rhetoric:* "No place in the country." **(Strong for Genocide)**.
      *   *Motive:* Is there an alternative? "Security"? Hard to argue when killing elders. **(Weak Alternative Explanation)**.
  *   **Phase 3 (Scope/Culture):**
      *   *The Trap:* Forced conversion/marriage. Under strict UNCG interpretation (ICTR/ICC jurisprudence), forced assimilation of *adults* is often ruled as **Persecution (CAH)**, not Genocide, unless it involves *preventing births* (sterilization) or *transferring children*.
      *   *Analysis:* If they are forcing adults to marry out, the biological group may continue, just assimilated. If they are killing the rest, that's the genocide part.
