answer: |-
  ### 1. The Conceptual Sequence
  To prevent the "gap" from collapsing into "diffusion" (too many responsible parties to track) or "displacement" (assigning responsibility to a human who lacked control), you must establish four conceptual layers in this specific order. Do not introduce the term "responsibility gap" until step 4 is complete.

  1.  **Agency Exclusion (The Machine):** Establish that the autonomous system lacks moral agency. It can be a *cause*, but not a *responsible agent*. This blocks the intuition that the machine itself could "take the blame."
  2.  **The Control Condition (The Metric):** Define the necessary condition for human responsibility: *control*. A human is only responsible if they had the capacity to foresee the harm and the ability to prevent it (the "could have done otherwise" standard). This is the metric you will use to test humans.
  3.  **The Candidate Audit (The Humans):** List the human candidates (designer, deployer, operator, owner). Apply the Control Condition to each.
      *   If *many* candidates meet the condition but their contributions are entangled $\rightarrow$ **Diffusion** (solve via joint liability).
      *   If *one* candidate is assigned responsibility despite *failing* the Control Condition $\rightarrow$ **Displacement** (solve via exculpation).
  4.  **The Gap Identification (The Void):** Only if the Machine lacks Agency (Step 1) **AND** all Human Candidates fail the Control Condition (Step 3) $\rightarrow$ **Responsibility Gap**.

  **Teaching Note:** This sequence forces students to prove the gap exists by elimination, rather than assuming it exists because the technology is complex.

  ### 2. The Carrying Example: The Fulfillment Center
  **Verdict:** This case can bear the weight, and it is superior to the autonomous vehicle (AV) trolley problem for this specific topic. The AV trolley problem focuses on *ethical choice* (which life to save); your fulfillment center case focuses on *control and emergence* (how harm happens without choice). This aligns perfectly with the structural nature of responsibility gaps.

  **What it needs to work:**
  To ensure this demonstrates a *gap* rather than *negligence*, you must stipulate three facts explicitly at the start of the case discussion:
  1.  **State-of-the-Art Safety:** The engineers followed all existing industry safety standards and validation protocols. The emergent pattern was statistically invisible during testing (a true "black swan" of multi-agent interaction).
  2.  **No Operator Negligence:** The picker was in a permitted zone and followed all safety protocols. They could not have reasonably anticipated the robot swarm's behavior.
  3.  **Intervention Impossibility:** The congestion emerged faster than any human supervisor could physically or cognitively intervene.

  **Why this matters:** If you do not stipulate #1, CS students will argue it's just a "bug" (negligence). If you do not stipulate #3, Law students will argue for vicarious liability (displacement). The case only creates a gap if *reasonable care* was taken by all humans, yet harm occurred due to system autonomy.

  ### 3. Misconceptions and Intervention Points
  Address these misconceptions in the order they will naturally arise during the 90-minute session.

  *   **The Zero-Sum Intuition:** *"If the machine is responsible, the human isn't."*
      *   **When to head it off:** **Minute 15 (During Agency Exclusion).**
      *   **Intervention:** Explicitly state that responsibility is not a fixed pie. Assigning agency to a machine is a category error, not a transfer of blame. The question is not "Who takes the blame?" but "Is there anyone capable of holding it?"
  *   **The Opacity Fallacy:** *"The gap exists because we can't explain the code; explainability closes the gap."*
      *   **When to head it off:** **Minute 50 (During the Candidate Audit of Engineers).**
      *   **Intervention:** When students suggest "better logs" or "XAI," point out that *ex-post* explainability does not grant *ex-ante* control. Knowing why the swarm pinned the worker *after* the fact does not mean the engineer could have prevented it *before* the fact. The gap is about control, not just knowledge.
  *   **The Human-in-the-Loop (HITL) Fix:** *"Just add a supervisor to watch the fleet."*
      *   **When to head it off:** **Minute 70 (During Displacement vs. Gap).**
      *   **Intervention:** Ask: "If the supervisor cannot physically stop the swarm in time, does assigning them responsibility make them responsible, or does it just make them a scapegoat?" This distinguishes a genuine safety measure from responsibility displacement.

  ### 4. Closing Diagnostic and Set-Aside
  **The Closing Question:**
  > "If the manufacturer creates a no-fault insurance fund that fully compensates the injured picker tomorrow, does the responsibility gap close?"

  *   **What this reveals:** If they answer "Yes," they are conflating *compensation* (loss spreading) with *responsibility* (moral/legal attribution). A gap can exist even if the victim is paid. The gap is about the failure of our accountability structures, not just the financial outcome.
  *   **Correct Answer:** No. Compensation addresses the harm, but the *gap* remains because no agent is held accountable for the wrong.

  **What to Openly Set Aside:**
  **"Solutions and Regulation."**
  Explicitly tell the class: "Today we are diagnosing the pathology, not prescribing the cure." Set aside discussions of no-fault insurance schemes, strict liability statutes, or banning the technology. If you allow the discussion to drift into *how to fix the loss*, students will convince themselves the gap is closed because the victim is made whole. Keep the focus strictly on the *attribution of responsibility*.
