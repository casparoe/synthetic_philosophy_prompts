answer: |-
  1. This practice commits us to a soft paternalism where we assume authority to define the user's best interest and justify using friction to steer them toward those specific outcomes. It presupposes that steering users toward their own good is permitted, while steering them toward our own good requires explicit consent.
  2. It treats friction itself as a legitimate form of persuasion when the goal is engagement, implying that user inertia counts as valid consent for beneficial features. Conversely, it assumes that explicit action is required to legitimize data extraction, marking a clear boundary on how consent is manufactured.
  3. The asymmetry rests on a split relationship model where we act as a fiduciary for engagement choices but an adversarial counterparty for data privacy. We assume we protect users from themselves regarding usage, but must protect ourselves from users regarding data.
  4. These two halves are inconsistent with our stated principle unless we redefine "preferred option" to mean what we predict they should want rather than what they actively choose. Strictly required is the belief that user error is more likely when disabling features than when enabling data sharing, whereas the engagement benefit is merely what the practice happens to fit.
  5. Replacing this with a straightforwardly autonomy-respecting view would require removing friction from all toggles regardless of who benefits. It would demand that we treat all defaults as provisional and ensure equal ease of access for both enabling and disabling any setting.
