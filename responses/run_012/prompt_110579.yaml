      *   *Consistency:* The principle "never make a user's preferred option harder to reach" is violated unless "preferred" is defined as "what we think they should prefer" rather than "what they actually choose."
      *   *Fiduciary vs. Adversarial:* It assumes a fiduciary role for engagement (we know what's good for you) but an adversarial/compliance role for data (we need your permission to take from you).
