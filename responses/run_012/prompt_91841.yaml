prompt: |-
  I keep half-recognizing Rousseau's attack on the theater in my day job, and I want to know whether that's a real resemblance or just me pattern-matching.

  My day job, for context: I'm on the content-strategy side at a streaming service. I spend my time on watch time, retention, what thumbnails pull people in, whether a show that depicts something ends up endorsing it, how attached viewers get to characters, and what our own incentives push us to greenlight. So roughly, I think in terms of what audiences watch and what the watching does to them.

  Rousseau is the guy who told d'Alembert that Geneva shouldnt build a playhouse. He argues the theater flatters the audience instead of improving it; that even when a play paints virtue well, the audience knows it's fiction so it doesn't stick; that the best comedies end up making the honest man look ridiculous (he goes after Molière on exactly this); and that a busy working city has better things to do with its evenings. I think he also floats some alternative about public festivals, where the citizens themselves are the show rather than the audience — but that's from memory and I may be garbling it.

  So: restate his case against the theater, as faithfully as you can, in the vocabulary I actually use. Then give me the residue report — what comes through clean, what I have to fudge to make it fit, and what has no counterpart in how I think about audiences at all. For the parts that only translate with distortion, tell me whether the gap is my vocabulary being too thin or his claim being looser than it sounds.

  My hunch is that the festival thing is precisely the part that refuses to translate, but I don't trust my hunch. And if the whole exercise is a mistake — if his objection isnt really a claim about what watching does to people, so that my framing quietly turns him into a crude media-effects guy — just say so plainly instead of doing the translation politely. Where you're reconstructing him rather than reporting something he clearly held, flag it, because from where I'm sitting I can't tell the difference.
