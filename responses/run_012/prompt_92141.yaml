answer: |-
  This is a sophisticated diagnosis of a methodological stalemate that has indeed calcified. You are correct that the debate is no longer about the technical tweaking of the criteria but about the structural integrity of the enterprise itself. The persistence of the criteria despite their theoretical dismantling suggests a dysfunction deeper than scholarly inertia.

  Here is a diagnosis of the impasse, structured by the nature of the disagreement, the posedness of the question, and the conditions for progress.

  ### 1. The Nature of the Disagreement: Ontological Mismatch and Epistemological Category Error

  This is not merely a verbal disagreement, nor is it purely substantive. It is an **ontological mismatch regarding the evidence** compounded by an **epistemological category error regarding probability.**

  **The Ontological Mismatch:**
  The practitioners (those using the criteria) and the critics (those rejecting them) are operating with incompatible ontologies of the Gospel text.
  *   **Practitioners** implicitly treat the Gospels as **corrupted biographies.** They assume the text is a container holding discrete units of tradition, some of which are "original" (Jesus) and some "secondary" (Church). The criteria are tools to filter the dross from the gold. This presupposes that "Jesus" and "Church" are ontologically distinct layers that can be mechanically separated.
  *   **Critics** (especially social memory theorists) treat the Gospels as **mnemonic constructs.** They assume the text is a unified artifact of a community's memory, where "Jesus" and "Church" are inextricably fused. In this ontology, there is no "pure" layer to uncover. The tradition is not a vessel carrying water from a source; it is the water itself, shaped by the vessel.

  When a practitioner applies the Criterion of Dissimilarity, they are asking, "Is this unit distinct from the container?" When a critic objects, they are saying, "The unit *is* the container." They are not arguing over the same object.

  **The Epistemological Category Error:**
  The criteria are being used as **binary filters** (Authentic/Inauthentic) when they are, at best, **probabilistic indicators.**
  *   **The Error:** As you noted, critics have shown the criteria are neither necessary nor sufficient. A saying can be authentic and similar to the Church (failure of Dissimilarity). A saying can be embarrassing and invented (failure of Embarrassment).
  *   **The Persistence:** Practitioners continue to use them because they provide a *rhetoric of certainty.* In a field where definitive knowledge is impossible, the criteria offer a procedural algorithm that generates the *appearance* of rigorous proof. The disagreement is hidden: Critics see the criteria as logical fallacies; Practitioners use them as heuristic scaffolding to support a narrative.

  ### 2. The "Two Questions" Hypothesis

  Your hypothesis that two different questions are being answered under one heading is correct, but it requires sharpening. It is not just "What did he say?" vs. "How did traditions form?" It is a conflict between **Reconstruction** and **Explanation.**

  *   **Question A (Reconstruction):** *What are the specific properties of the historical agent?* (Positivist History). This requires isolating data points to build a profile. This demands the criteria.
  *   **Question B (Explanation):** *How do we explain the rise of the movement in light of the available evidence?* (Explanatory History). This requires a coherent narrative that accounts for the *entirety* of the tradition, not just the "authentic" fragments.

  The impasse exists because **Question A cannot be answered with the evidence available, but Question B feels unsatisfying to those seeking the "Real Jesus."**
  *   If you answer Question B (e.g., "The Gospels reflect a prophetic movement within Second Temple Judaism"), critics of *that* approach claim you have abandoned the historical Jesus for a "plausible context."
  *   If you answer Question A (e.g., "This parable is authentic"), critics claim you have ignored the mediated nature of the text.

  The sides disagree on whether "Authenticity" is a property of **units** (sayings/actions) or **trajectories** (patterns of memory). The criteria assume units; the evidence supports trajectories.

  ### 3. Is the Question Ill-Posed or Merely Hard?

  The question is **methodologically ill-posed at the micro-level** but **historically viable at the macro-level.**

  *   **Micro-Level (Ill-Posed):** Asking "Did Jesus say *this specific sentence*?" is ill-posed because it presupposes a model of transmission (verbatim retention of discrete logia) that contradicts what we know about oral culture, memory, and the compositional practices of ancient biography. The evidence does not support the granularity of the question. It is like asking for the exact wave height of a specific ripple in a tsunami that hit the shore three decades ago, based only on the erosion patterns left behind.
  *   **Macro-Level (Hard but Viable):** Asking "Does the general profile of Jesus as an eschatological prophet/exorcist fit the constraints of 1st-century Galilee?" is a hard historical question, but it is well-posed. It acknowledges the evidence is about the *impression* left by the figure, not the transcript of his voice.

  The impasse persists because the guild is structured around the micro-level (commentaries, verse-by-verse analysis, dissertations on specific pericopes), while the methodological consensus has moved to the macro-level.

  ### 4. What Counts as Progress?

  Given this diagnosis, progress will not come from refining the criteria or finding a new list of criteria. Progress requires a **formal result about the limits of the evidence** and a **shift in the unit of analysis.**

  **A. A Formal Result: The Limit of Probability**
  The field needs a consensus statement akin to a "Gödel's Incompleteness Theorem" for Jesus studies: *It is formally impossible to establish the authenticity of individual units of tradition with a probability significantly higher than the prior probability of the context.*
  *   Acknowledging this would force a shift from "proving authenticity" to "assessing plausibility within constraints."
  *   This kills the "Authentic/Inauthentic" binary. It replaces it with "Consistent/Inconsistent with the plausible historical profile."

  **B. A Change of Question: From Pedigree to Constraint**
  Stop asking, "Did Jesus say this?" Start asking, "Does this tradition require a historical catalyst to explain its existence?"
  *   This is the **Criterion of Historical Necessity** (or "Explanatory Power").
  *   *Example:* We may not know if Jesus said "The Kingdom is at hand." But we know a movement arose claiming he did. Does the existence of this movement require a figure who preached apocalypticism, or could it have arisen from a non-apocalyptic teacher? If the former, the tradition is historically "secure" not because it passes a test, but because it is the necessary condition for the effect (the Church).
  *   This moves the focus from the *unit* to the *causal link* between the man and the movement.

  **C. A Distinction: Jesus of Memory vs. Jesus of History**
  Scholars must explicitly distinguish their outputs:
  1.  **The Historical Agent:** What can be known about the man (limited, probabilistic, macro-profile).
  2.  **The Mnemonic Figure:** How the man was remembered and why (the bulk of the Gospel data).
  *   Progress occurs when a scholar admits, "I cannot prove Jesus said this, but I can show this tradition functions to explain his execution," rather than, "This is authentic because it is embarrassing."

  ### 5. Why the Impasse Persists (and why progress is unlikely)

  Despite the above, I must argue that **no significant methodological progress should be expected in the short term.**

  *   **Institutional Incentives:** The "Authentic/Inauthentic" binary produces publishable results. "Plausible within a range of probability" produces nuanced, tentative conclusions that are harder to defend in dissertations and commentaries. The criteria provide a *technology of certainty* that the academic market rewards.
  *   **Theological Stakes:** For many practitioners, the "Historical Jesus" is not just a historical problem but a theological boundary. Admitting the question is ill-posed at the micro-level threatens the link between the Christ of Faith and the Jesus of History. The criteria act as a defensive apologetic (even for non-confessional scholars) to maintain that link.
  *   **Incommensurability:** The "Social Memory" alternative is often accused of smuggling criteria back in because it still relies on historical judgment. Until there is a formalized Bayesian framework that openly accounts for priors (which are themselves subjective), the "holistic judgment" will always look like "intuition in disguise" to the positivists.

  ### Summary Diagnosis

  The impasse is a **category error** where **positivist tools** (criteria) are applied to **constructivist evidence** (memory). The question is **ill-posed at the level of individual sayings** but viable at the level of **historical causality.**

  Progress requires abandoning the quest for the *ipsissima verba* in favor of modeling the **historical constraints** necessary to generate the **mnemonic effect** we call Christianity. Until the guild accepts that the Gospels are evidence of a *movement's memory* rather than a *biography's source*, the criteria will remain a zombie methodology: theoretically dead, but practically undead.
