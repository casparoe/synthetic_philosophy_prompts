answer: |-
  Here is the translation of the strongest STS claim into your vocabulary, followed by the residue report.

  ### The Translation: Artifacts as Mechanism Design

  In your framework, a "mechanism" is a rule structure that maps messages/actions to outcomes to implement a social choice function. The STS claim that "artifacts have politics" translates to the claim that **artifacts are physical instantiations of mechanism design parameters that hard-code distributional choices and governance structures into the feasible set.**

  Here is how the specific STS arguments map to your toolkit:

  **1. The Moses Overpasses (Screening and Participation Constraints)**
  *   **STS Claim:** The low bridges exclude bus riders (poor/minority) from the beach, privileging car owners.
  *   **Translation:** The bridge height $H$ is a **screening device**. It imposes a hard **participation constraint** on agents whose transport technology $T$ requires clearance $> H$. By setting $H$, the designer (Moses) effectively selects a subset of agents who can access the public good (the beach). This is not a neutral engineering constraint; it is a **binding constraint** chosen to enforce a specific **equilibrium selection** (high-income segregation) that might be legally or politically costly to enforce via explicit rules (e.g., "No Buses" signs). The artifact makes the exclusion **incentive compatible** for the state because it requires no active enforcement officers; the physics does the screening.

  **2. Nuclear Power (Centralization and Agency Costs)**
  *   **STS Claim:** Nuclear power requires a rigid, centralized hierarchy to manage safety, making it incompatible with decentralized/democratic organization.
  *   **Translation:** The technology imposes a specific **organizational constraint** on the principal-agent structure. Due to the catastrophic payoff of failure (meltdown), the **monitoring costs** required to maintain **incentive compatibility** in a decentralized system are prohibitively high. Therefore, the only **implementable mechanism** is a rigid hierarchy with strict command-and-control. The artifact dictates the **governance mechanism**; you cannot choose a cooperative governance structure without violating the **safety participation constraint**. The technology forces a specific **equilibrium** of authority.

  **3. "Politics" Generally (Distribution and Pre-commitment)**
  *   **STS Claim:** Technology is never neutral; it embodies values and power relations.
  *   **Translation:** "Neutrality" in your framework would mean the mechanism is **strategy-proof** and distributes surplus efficiently without bias. STS argues artifacts are rarely neutral; they are **pre-commitment devices** chosen by a designer to lock in a specific **distribution of surplus**. By embedding rules in hardware, the designer raises the **transaction costs** of changing the mechanism later. This creates **path dependence**. The "politics" is the **ex-ante choice of mechanism** that determines the **ex-post distribution of utility**, often insulating those choices from future renegotiation or voting.

  ***

  ### The Residue Report

  You asked what fell off the truck. Here is the ledger on the two specific bugs you mentioned, and the status of "power."

  #### Bug 1: Technology Changing Preferences (Form of Life)
  *   **The Case:** Cars create sprawl, which makes walking impossible, which makes people *want* cars. Phones fragment attention, changing how we value focus.
  *   **Your Framework:** Takes preferences (utility functions) as exogenous, stable inputs. Revealed preference assumes $U$ is fixed and we observe choices $x$ to infer it.
  *   **The Residue:** **This is a genuine defect of your standard framework.**
  *   **Why:** Standard mechanism design solves for outcomes given fixed $U_i(x)$. It does not model the feedback loop where the mechanism $M$ transforms $U_i \to U_i'$. When STS says technology creates a "form of life," they are describing **endogenous preference formation**.
  *   **Verdict:** Your toolkit can model the *constraints* cars place on walking, but it cannot natively model the *adaptation of desires* to those constraints without importing dynamic evolutionary models or psychological utility functions that update based on consumption history. If you treat preferences as fixed, you will systematically misinterpret adaptive preferences (learning to love what you can have) as revealed welfare. STS is pointing out that the mechanism design problem is dynamic: the mechanism changes the players.

  #### Bug 2: DRM and the Legal Regime (Printer Ink)
  *   **The Case:** A printer bricks itself with third-party ink. Is the politics in the chip or the copyright law?
  *   **Your Framework:** You see two pieces: a physical constraint (chip check) and a legal constraint (DMCA/copyright). You think splitting them is more precise.
  *   **The Residue:** **This is a sign that the original STS claim was vaguer than it sounded; your translation is actually superior here.**
  *   **Why:** The "politics" is not in the plastic chip. The chip is just a gate. The politics is in the **delegation of enforcement**. In a standard mechanism, enforcement requires a principal (court, boss) to punish deviation. DRM **delegates enforcement to the physics** of the artifact, backed by the legal regime.
  *   **Verdict:** Your split is correct. The artifact alone is just a constraint. The "politics" arises from the **coupling** of the physical constraint with the legal monopoly. However, the STS insight worth keeping is that this coupling **lowers the enforcement cost** for the principal. By moving enforcement from the legal layer (suing you) to the physical layer (bricking the printer), the designer changes the **cost function of compliance**. It's not that the artifact *is* the politics; it's that the artifact is a **cost-reducing technology for exercising power**. Your framework handles this fine if you model the "mechanism" as the socio-technical system, not just the hardware.

  #### The Concept of Power
  *   **The Question:** Is your roommate's talk of "power" real, or just "somebody gets less utility but louder"?
  *   **The Verdict:** **It is real, and your vocabulary has a blind spot, but it is fixable.**
  *   **The Blind Spot:** In standard econ, power is often reduced to **bargaining leverage** (threat points) or **payoff asymmetry** (I get more surplus). STS uses power to mean **agenda control** or **constitutional authority**.
  *   **The Translation:** Power is the ability to move from being a **Player** in the mechanism to being the **Mechanism Designer**.
      *   If I have more utility, I am a rich player.
      *   If I can design the overpass height, I am the Principal.
      *   STS argues that artifacts allow the Principal to **persist over time**. Once the bridge is built, the Designer can leave, die, or be voted out, but the *mechanism* continues to enforce their will.
  *   **Why it matters:** This is **inter-temporal incentive compatibility**. The "power" is the ability to bind future agents (including future majorities) to a specific equilibrium. Your framework usually assumes the mechanism can be renegotiated if it's inefficient. STS points out that physical artifacts make renegotiation prohibitively expensive (you can't raise the bridge easily).
  *   **Conclusion:** "Power" in this context is **rigidity of the feasible set**. It is the capacity to impose high **switching costs** on the system. If your model treats the mechanism as mutable whenever it's Pareto inefficient to keep it, you will miss the political reality that some mechanisms are kept *precisely because* they are hard to change, even if they are inefficient for the majority.

  ### Summary Ledger

  1.  **Translation:** Successful. "Politics" = Distributional consequences hard-coded into physical participation constraints and enforcement mechanisms.
  2.  **Bug 1 (Endogenous Preferences):** **Genuine Defect.** Your framework assumes fixed utility functions. It cannot capture "forms of life" without significant modification to allow for dynamic preference updating.
  3.  **Bug 2 (DRM/Law):** **Vague Claim.** Your split (physical + legal) is more precise. The "politics" is the delegation of enforcement to physics to lower monitoring costs.
  4.  **Power:** **Real Phenomenon.** It maps to **Designer Authority** and **Path Dependence**. It is the ability to set binding constraints that survive the original design interaction, raising the cost of mechanism renegotiation for future agents.
