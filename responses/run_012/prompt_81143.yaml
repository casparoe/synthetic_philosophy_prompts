prompt: |-
  I teach a third-year seminar on causal inference -- mixed bunch, mostly stats students plus a couple of philosophers, about 16 of them -- and I've got one 90-minute session to spend on Simpson's paradox. I've taught it the usual way and it's a dud: I put up the two tables, someone says "ah, it's confounding", everyone nods, and they leave with the takeaway "always look at the subgroups", which honestly seems worse than not covering it at all. What I want is an activity where they walk into the reversal themselves, commit to something before they see it, and it costs them a little when it flips.

  My half-formed idea is some kind of committee -- they play admissions officers or a hospital board, we feed them cases in batches, they settle on a policy, and then we re-cut the exact same numbers a different way and the right call reverses. But I can't work out how to make the flips come out of the structure rather than me rigging it, or how to keep the whole thing from collapsing into "so the data lied", which is definately not the lesson.

  So design it for me. Rules and materials, who does what, a timeline for the 90 minutes, the point in the sequence where they have to commit (before they've seen the aggregate, obviously), and a mechanism so the numbers are generated or tabulated by them rather than performed by me. Then the debrief: map each moment of the activity onto the actual moving parts of the idea. The moving parts I care about, roughly in order:

  - that a reversal of this kind doesn't require confounding, and confounding doesn't require a reversal -- I want them to stop using "Simpson's paradox" and "confounding" as synonyms, which is the thing they do now
  - that the arithmetic is boring (it's weighted averages with different weights) and the whole puzzle is about what we're allowed to infer from it
  - the decision-theoretic reading, where it looks like a violation of the principle that if an option is at least as good in every state of the world then it's at least as good overall, and why that reading is tempting and what's actually wrong with it
  - that nothing inside the numbers tells you whether to act on the subgroup view or the aggregate view -- something outside the table settles it, and I want them to feel how unsatisfying that is
  - if there's room, the seperate ethics version: a policy that's better for every subgroup and worse for the population, and whether that's the same problem in different clothes or a genuinely different one

  Tell me what will predictably go wrong the first time I run it -- I'm guessing one group never budges once they've seen the aggregate, and someone games the batch order -- and how to handle that without turning it into a lecture. And be straight with me about which part of the idea the activity can't reproduce and that I'll have to supply myself in the debrief. No readings, I'll sort those out.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 3rd-year seminar on causal inference. 16 students (mostly stats, some philosophers). 90 minutes.
      *   **Problem:** Traditional teaching (showing tables, saying "confounding") is a dud. Students leave with shallow heuristics ("always look at subgroups").
      *   **Goal:** An active learning experience where students *commit* to a decision before seeing the reversal, feel the cost of the flip, and understand the structural/decision-theoretic/ethical nuances.
      *   **Key Concepts to Cover:**
          1.  Reversal $\neq$ Confounding (and vice versa).
          2.  Arithmetic is just weighted averages; the puzzle is inferential.
          3.  Decision-theoretic reading (Sure Thing Principle violation appearance).
          4.  Numbers don't dictate action (external context needed).
          5.  Ethics version (subgroup better vs. population worse).
      *   **Constraints:** No readings. Must design the activity, timeline, materials, and debrief. Must predict failure modes. Must admit what the activity *can't* do (instructor must supply).
      *   **Tone:** Direct, practical, pedagogical, slightly cynical about student behavior (anticipating gaming/resistance).

  2.  **Deconstruct the "Commitment" Problem:**
      *   To make them feel the reversal, they need to make a choice based on partial information, then see the full picture contradict it.
      *   *Idea:* Give them data in batches (subgroups first), have them make a policy recommendation, then reveal the aggregate (or vice versa).
      *   *Problem:* If I just give them numbers, they'll calculate. If I want them to *feel* the decision, it needs stakes.
      *   *Solution:* "The Grant Committee." They have a fixed budget. They must award a grant to Treatment A or Treatment B.
      *   *Twist:* The data comes from two distinct "hospitals" or "departments" (the subgroups). They see the success rates per department first. They unanimously agree A is better in Dept 1 and A is better in Dept 2. They award the grant to A. *Then* they are shown the total success rates, where B is better.
      *   *Refinement:* To make it generated by *them*, they shouldn't just read tables. They should sample or process cases. But with 16 students and 90 mins, manual sampling is too slow.
      *   *Better Refinement:* They act as auditors. They are given "files" (cards or slips of paper) representing patients/applicants. They sort them.
      *   *Best Refinement for Time:* Split the class into two "Audit Teams." Each team gets a subset of the data (e.g., Team 1 gets Hospital X data, Team 2 gets Hospital Y data). They report to the "Board" (the whole class). The Board makes a decision. Then the totals are revealed.
      *   *Wait, the prompt asks for numbers generated/tabulated by them.* Let's make them calculate the rates themselves from raw counts to ensure they own the arithmetic.
      *   *The "Cost":* If they pick the wrong treatment based on the subgroup data, they "lose points" or "waste the budget" when the aggregate reveals the truth. But wait, in Simpson's Paradox, *both* views can be "true" arithmetically. The "cost" must be epistemic or decision-theoretic. Let's make the cost about *consistency*. If they argue for Subgroup logic, then switch to Aggregate logic, they look inconsistent.
      *   *Revised Mechanism:* They must sign a "Policy Declaration" based on the subgroup data. When the aggregate flips, they have to publicly justify why they aren't changing their mind, or admit they were wrong. The "cost" is cognitive dissonance + public commitment.

  3.  **Drafting the Activity: "The Hospital Merger"**
      *   **Scenario:** Two hospitals are merging. You are the board. You must keep the superior surgical protocol (A or B) and discard the other.
      *   **Data:** Patients are split by "Risk Level" (Low/High). This is the confounder/stratifier.
      *   **Flow:**
          1.  Split class into Group Low and Group High.
          2.  Group Low analyzes Low Risk patients. Group High analyzes High Risk patients.
          3.  Both groups find Protocol A is better *within* their risk stratum.
          4.  Class votes: Keep A.
          5.  Reveal: When merged, Protocol B has higher overall survival.
          6.  Crisis: Why did this happen? Who was right?
      *   **Addressing "Numbers by them":** Give them raw counts on cards. $N_{treated}, N_{survived}$. They calculate percentages.
      *   **Addressing "Confounding $\neq$ Reversal":** Need a second round or a specific debrief setup where the weights don't cause a reversal, or where confounding exists but no reversal. *Actually, doing two rounds is too tight for 90 mins.* Better to handle this in the debrief by tweaking the numbers on the board.
      *   **Addressing "Ethics":** This is naturally built into the Hospital scenario.

  4.  **Developing the Timeline (90 mins):**
      *   0-10: Setup & Hook.
      *   10-30: Phase 1 (Subgroup Analysis).
      *   30-40: Commitment (The Vote).
      *   40-50: The Reveal (Aggregate Calculation).
      *   50-75: Debrief & Discussion (The heavy lifting).
      *   75-90: Ethics/Decision Theory extension.

  5.  **Refining the "Mechanism" (Crucial Step):**
      *   To avoid "the data lied," the data must be consistent.
      *   To ensure they feel the reversal, the *weights* must be hidden initially.
      *   *Setup:* 16 students. Split into 4 tables of 4.
      *   *Table 1 & 2:* Get "Hospital A" data (split by Risk).
      *   *Table 3 & 4:* Get "Hospital B" data (split by Risk).
      *   *Wait, that's comparing Hospitals.* Simpson's is usually Treatment vs Control within strata.
      *   *Let's stick to the classic:* Treatment A vs Treatment B. Strata: Low Risk, High Risk.
      *   *Distribution:*
          *   8 students get "Low Risk" packets.
          *   8 students get "High Risk" packets.
          *   Inside packets: Counts for Treatment A and Treatment B.
          *   They calculate success rates.
          *   Low Risk group: A > B.
          *   High Risk group: A > B.
          *   Class Consensus: A is better.
          *   *Then:* Collect all packets. Instructor (or designated scribes) sums the totals on the board.
          *   Result: B > A overall.
      *   *Why?* Because Treatment A was given mostly to High Risk (harder to save), Treatment B mostly to Low Risk (easier to save).
      *   *Student Generation:* They sum the counts themselves on the board.

  6.  **Addressing the Specific Learning Objectives in Debrief:**
      *   *Confounding $\neq$ Reversal:* Show that if the sample sizes (weights) were equal, no reversal occurs. The reversal is arithmetic; the confounding is causal.
      *   *Arithmetic:* It's just weighted averages. Show the math explicitly.
      *   *Decision Theory:* Sure Thing Principle. If A is better in every state (Risk Level), why not better overall? Because the "state" distribution changes with the treatment choice (selection bias).
      *   *External Info:* Which table is right? Depends on *why* the weights are different. Did A cause the risk? Or did risk cause the assignment?
      *   *Ethics:* If we allocate based on Aggregate, we hurt both subgroups. Is that fair?

  7.  **Predicting Failure Modes:**
      *   *Gaming:* Students realize the trick. *Fix:* Make the packets look like genuine audit data. Don't hint at paradox.
      *   *Stubbornness:* "Aggregate is truth." *Fix:* Force them to defend the Subgroup view first. Ask "If you were a High Risk patient, which would you want?"
      *   *Time:* Calculation takes too long. *Fix:* Keep numbers small/integers. Provide calculators.
      *   "Data Lied": *Fix:* Emphasize the numbers are the *same*, just summed differently.

  8.  **What the Activity Can't Do:**
      *   It can't prove *causality*. It can only show association. The instructor must explain that without a DAG or randomization assumption, we don't know which table to trust.
      *   It can't fully resolve the Ethics tension in 15 mins.

  9.  **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the numbers work (need to construct a specific Simpson's dataset).
      *   *Dataset Check:*
          *   Low Risk: A (90/100 = 90%), B (190/200 = 95%). Wait, need A > B in both.
          *   Let's try:
              *   Low Risk: A (81/90 = 90%), B (192/200 = 96%). No, need A > B.
              *   Low Risk: A (180/200 = 90%), B (81/90 = 90%). Tie.
              *   Standard Example:
                  *   Low Risk: A (90/100 = 90%), B (80/100 = 80%). (A better)
                  *   High Risk: A (10/100 = 10%), B (5/100 = 5%). (A better)
                  *   Total A: 100/200 = 50%.
                  *   Total B: 85/200 = 42.5%. (No reversal).
              *   Need Weighted Avg Reversal.
              *   Low Risk: A (90/100 = 90%), B (190/200 = 95%). (B better).
              *   High Risk: A (10/100 = 10%), B (5/100 = 5%). (A better).
              *   This is standard Simpson's.
              *   Let's use the classic Kidney Stone data structure but simplified.
              *   Strata: Small Stones, Large Stones.
              *   Treatment A (Open), Treatment B (Closed).
              *   Small: A (81/87 = 93%), B (234/270 = 87%). A wins.
              *   Large: A (192/263 = 73%), B (55/80 = 69%). A wins.
              *   Total: A (273/350 = 78%), B (289/350 = 83%). B wins.
              *   Why? B was used mostly on Small (easy) stones. A was used mostly on Large (hard) stones.
              *   Perfect. I will adapt these numbers for the handouts.

  10. **Structuring the Response:**
      *   Activity Name.
      *   Setup/Materials.
      *   Timeline.
      *   The "Trap" (Commitment).
      *   The Reveal.
      *   Debrief Map (connecting activity to concepts).
      *   Failure Modes.
      *   Instructor Burden (what they must supply).

  11. **Self-Correction on "Confounding vs Reversal":**
      *   The prompt specifically wants to decouple these.
      *   Activity shows Reversal.
      *   Debrief must show that Confounding exists *before* the reversal is calculated.
      *   I need to make sure the Debrief explicitly separates the *arithmetic condition* (weights) from the *causal condition* (assignment mechanism).

  12. **Final Review against constraints:**
      *   90 mins? Yes, tight but doable.
      *   16 students? Yes, 4 groups of 4 works well.
      *   Commitment? Yes, signed policy sheet.
      *   Numbers by them? Yes, they sum the counts.
      *   No readings? Yes.
      *   Straight talk on limitations? Yes.

  Let's write it.
answer: |-
  Here is a design for a 90-minute session that forces the reversal through student action rather than lecture. It is built to be tight, slightly uncomfortable, and mathematically transparent.

  # Activity: The Merger Committee

  **Premise:** The class is a board of directors for two merging hospitals. They must standardize on one of two surgical protocols (Protocol A or Protocol B). They have patient outcome data from the pre-merger period.

  **Materials:**
  *   4 Envelopes per table (4 tables of 4 students).
  *   Inside each envelope: 2 Data Cards (labeled "Low Risk Patients" and "High Risk Patients").
  *   Each Card contains raw counts: *Total Patients* and *Successful Recoveries* for Protocol A and Protocol B within that risk stratum.
  *   1 "Policy Declaration" sheet per table.
  *   Whiteboard space divided into two sections: "Strata Data" and "Aggregate Data."
  *   Calculators (or phones allowed).

  **The Numbers (Pre-printed on Cards):**
  *Use these exact integers. They are scaled for easy calculation but preserve the paradox.*

  *   **Card 1 (Low Risk):**
      *   Protocol A: 90 patients, 81 successes (90%)
      *   Protocol B: 200 patients, 190 successes (95%)
      *   *Wait, for the paradox to work where A wins subgroups but B wins aggregate, we need A > B in subgroups.*
      *   *Correction:* Let's use the classic Kidney Stone structure but anonymized.
      *   **Card 1 (Low Risk / Easy Cases):**
          *   Protocol A: 87 patients, 81 successes (**93%**)
          *   Protocol B: 270 patients, 234 successes (**87%**)
          *   *Verdict:* A is better.
      *   **Card 2 (High Risk / Hard Cases):**
          *   Protocol A: 263 patients, 192 successes (**73%**)
          *   Protocol B: 80 patients, 55 successes (**69%**)
          *   *Verdict:* A is better.
      *   **The Trap:** Protocol A was disproportionately used on High Risk cases (263 vs 87). Protocol B was disproportionately used on Low Risk cases (270 vs 80).
      *   **Aggregate (to be calculated later):**
          *   Protocol A: 350 patients, 273 successes (**78%**)
          *   Protocol B: 350 patients, 289 successes (**83%**)
          *   *Verdict:* B is better.

  ---

  # Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Isolation
  *   **Instructor:** "You are the Merger Committee. Your job is to save lives. You must select one protocol to use going forward. You cannot mix them."
  *   **Constraint:** "You are auditors. You do not know the hospital's assignment policies. You only see outcomes."
  *   **Split:** Divide the 16 students into 4 tables.
  *   **Distribution:** Give every table the **Low Risk** envelope first. Tell them: "Analyze this stratum. Calculate success rates. Decide which protocol is superior for *these* patients."
  *   **Time:** 5 minutes.
  *   **Result:** Every table finds Protocol A is superior (93% vs 87%).

  ### 0:10 – 0:20: The Second Stratum
  *   **Instructor:** "Now you receive the data for the High Risk patients." Distribute the second envelope.
  *   **Task:** "Calculate success rates. Decide which protocol is superior for *these* patients."
  *   **Time:** 5 minutes.
  *   **Result:** Every table finds Protocol A is superior (73% vs 69%).
  *   **Commitment Point:** Hand out the **Policy Declaration**.
      *   *Text:* "Based on the evidence that Protocol A outperforms Protocol B in both Low Risk and High Risk populations, the Committee recommends adopting **Protocol A**."
      *   **Requirement:** All 4 members of the table must sign. Collect these. This is their binding vote.

  ### 0:20 – 0:35: The Aggregation (Student-Generated)
  *   **Instructor:** "Before we finalize the merger, we need the total survival numbers for the press release. Please sum the raw counts from both cards."
  *   **Action:** Students sum the *patients* and *successes* for A and B across both cards.
  *   **Board Work:** One student from each table comes to the board.
      *   Left side: Write the subgroup rates they already found (A wins, A wins).
      *   Right side: Write the new Aggregate Rates (Total Success / Total Patients).
  *   **The Reveal:** The board will show Protocol B has a higher overall success rate (83% vs 78%).
  *   **Silence:** Do not speak for 30 seconds. Let the contradiction sit.

  ### 0:35 – 0:50: The Crisis (Small Group Discussion)
  *   **Prompt:** "Your signed declaration says A. The total numbers say B. You cannot change the math. You cannot change your signature. Discuss at your table: Did the data lie? Did you calculate wrong? Which protocol do you actually implement?"
  *   **Goal:** Let them fight. Some will say "Subgroups are truth." Some will say "Totals are truth." Some will say "Sample size matters."
  *   **Instructor Role:** Circulate. If they say "It's confounding," ask: "Where is the confounder in the numbers?" (Answer: It's not in the numbers).

  ### 0:50 – 1:15: Guided Debrief (Mapping the Concepts)
  *   *Use the whiteboard to map their experience to the theory.*

  **1. Arithmetic vs. Inference (The Moving Parts)**
  *   **Draw:** Two weighted averages.
  *   **Point:** "The reversal is not magic. It is weighted averages. Protocol B's average is weighted heavily toward the Easy cases (270 patients). Protocol A's average is weighted heavily toward the Hard cases (263 patients)."
  *   **Lesson:** The arithmetic is boring. The puzzle is: *Why* were the weights different?

  **2. Confounding $\neq$ Reversal**
  *   **Ask:** "If I change the number of High Risk patients for Protocol B from 80 to 200, does the reversal disappear?" (Yes, recalculate quickly on board).
  *   **Point:** "The reversal is a property of the *sample weights*. Confounding is a property of the *data generating process*. You can have confounding without reversal (if weights are balanced). You can have reversal without confounding (if treatment assignment was random but stratification is post-treatment collider—save this for advanced stats students)."
  *   **Takeaway:** Stop using the words interchangeably.

  **3. Decision Theory (The Sure Thing Principle)**
  *   **Ask:** "If A is better for Low Risk, and A is better for High Risk, shouldn't A be better for Everyone?"
  *   **Point:** "This violates the Sure Thing Principle *only if* the choice of treatment doesn't change the probability of being Low/High Risk."
  *   **Crucial Distinction:** "Did the Treatment *cause* the Risk? Or did the Risk *cause* the Treatment selection?"
  *   **Lesson:** If doctors assigned A to sicker patients (selection bias), the Aggregate table is misleading (adjust for risk). If A *caused* patients to become High Risk (side effect), the Subgroup table is misleading (collider bias). **The numbers do not tell you which story is true.**

  **4. The External Resolver**
  *   **Ask:** "Look at your signed sheets. Which one is the 'right' policy?"
  *   **Answer:** "You cannot answer that from this handout."
  *   **Lesson:** Causal inference requires information *outside the dataset*. You need to know the assignment mechanism. Without that, you are just describing arithmetic artifacts.

  ### 1:15 – 1:30: The Ethics Extension
  *   **Scenario:** "Suppose the 'Risk' is actually 'Race' or 'Socioeconomic Status'. Protocol A is better for both groups individually. But because Group 1 was systematically denied access to Protocol A in the past, the Aggregate shows Protocol B is better."
  *   **Question:** "If you choose Protocol B based on the Aggregate, you are optimizing for the population mean, but you are actively choosing the worse treatment for *every* subgroup."
  *   **Discussion:** "Is it ever ethical to implement a policy that is known to be inferior for every specific type of person, just because the average looks better?"
  *   **Closing:** "Simpson's Paradox isn't a math trick. It's a warning that 'Average Treatment Effects' can erase the very people you are trying to help."

  ---

  # Predictable Failure Modes & Fixes

  **1. The "Totals are Truth" Group**
  *   **Behavior:** One table refuses to accept the subgroup data once they see the aggregate. "The total N is larger, so it's more significant."
  *   **Fix:** Do not argue statistics. Ask: "If you were a High Risk patient, would you want the doctor to use the population average or the High Risk success rate?" Force the perspective shift from *auditor* to *patient*.

  **2. The "Data is Rigged" Complaint**
  *   **Behavior:** "You gave us numbers that don't add up."
  *   **Fix:** Pre-empt this. In the Setup, say: "These are real audit logs. They may look weird. Your job is to interpret them, not debug them." When they sum the numbers on the board, *they* generate the total. You didn't write the total; they did. This ownership prevents the "teacher tricked us" defense.

  **3. Gaming the Batch Order**
  *   **Behavior:** A stats-savvy student opens both envelopes at once.
  *   **Fix:** Physically control the flow. "Keep the second envelope sealed until I say go." If someone peeks, ask them to act as the "Board Chair" who must remain neutral, removing them from the calculation task.

  **4. Running Out of Time**
  *   **Risk:** The calculation takes too long.
  *   **Fix:** The numbers provided above are chosen for divisibility. If they stall at 0:30, intervene: "Just estimate. Is it clearly higher or lower?" Precision matters less than the direction of the flip.

  ---

  # What This Activity Cannot Do (Instructor Burden)

  You must supply these three things in the debrief, because the activity alone cannot generate them:

  1.  **The DAG:** The activity shows *that* the weights are different. It does not show *why*. You must draw the Directed Acyclic Graph on the board (Risk $\rightarrow$ Outcome, Risk $\rightarrow$ Treatment Selection) to explain that the "confounding" is in the assignment arrow, not the outcome arrow.
  2.  **The Collider Warning:** The activity assumes Risk is a pre-treatment confounder. You must explicitly state: "If 'Risk' was actually a side effect of the treatment, stratifying by it would *create* bias." The numbers look the same; the causal story changes the math.
  3.  **The Resolution:** The activity ends on tension. You must close the loop: "In practice, we resolve this by looking at the study design. Randomized Trial? Trust Aggregate. Observational with known risk factors? Trust Adjusted (Subgroup). But you must know the design."

  # Why This Works Better Than Tables
  *   **Commitment:** By signing the Policy Declaration, they have skin in the game. The reversal isn't just a curiosity; it's a contradiction of their own signed judgment.
  *   **Generation:** They sum the numbers. They see the arithmetic is consistent. They can't blame "typos."
  *   **Separation:** By handing out the strata separately, you physically separate the "Subgroup View" from the "Aggregate View," mirroring the conceptual separation required to understand the paradox.
  *   **Ethics:** The Hospital context makes the "Subgroup vs. Aggregate" choice a life-or-death decision, not a statistical exercise.
