      *Wait, one constraint:* "where your own verdict is genuinely contestable, say in a sentence or two where the contest lies rather than hedging inside the answer itself." I will add a brief note at the end of the model answer or within the flow acknowledging the counter-view's plausibility but dismissing it. Actually, the prompt says "inside the answer itself" regarding hedging. I should avoid hedging *in the argument*, but can acknowledge the contestability in a concluding nuance. Better: Make the argument strong, acknowledge the rival view's strength briefly, then dismiss it.

