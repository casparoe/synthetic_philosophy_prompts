answer: |-
  **Exam Question**

  **Time Allowed:** 45 minutes
  **Marks:** 25

  **Question:**
  Evaluate the Emergency Council's decision to broadcast the false report under the Doctrine of Double Effect. Do not merely list or define the four standard conditions; assume them as known. The moral weight of this case rests on the causal chain: the civilians in the settlement are not killed by the Council's broadcast, but by the Militia's free choice, which the Council knowingly relies upon to save the district.

  Construct two competing interpretations of what the Doctrine must mean by "intention" or "means" when the harmful effect is executed by a third party's independent agency. On the first reading, the harm is merely foreseen; on the second, it is intended. Argue decisively for one reading over the other and determine whether the Council's action is permissible. Your grade depends on your adjudication of this conflict, not on the verdict you reach.

  ***

  **Model Answer**

  The Council's action is impermissible under the Doctrine of Double Effect. While the Council does not desire the settlers' deaths, the Doctrine cannot permit an agent to outsource the intentional harming of innocents to a third party by labeling it mere foresight. To see why, we must distinguish between a psychological reading of intention and a structural reading of the plan.

  On the psychological reading, intention is defined strictly by the agent's mental state and desires. The Council prefers a world where the diversion happens without the sacking. They do not order the sacking; they order the broadcast. The Militia chooses to sack the settlement. On this view, the deaths are a foreseen side effect of the diversion, not a means. The Council intends the Militia's movement, but the violence accompanying that movement is external to the Council's will. Since the act itself (broadcasting) is neutral, the good effect (saving the district) is not produced by the bad effect (the deaths), and the good outweighs the bad, the action appears permissible. This reading protects the Council because the causal link to the deaths is mediated by another agent's free choice.

  However, this reading renders the Doctrine vacuous in cases of coordinated agency. It suggests that one can intend any outcome, provided one relies on another person to physically execute the harmful step. This necessitates the structural reading. On this view, intention is defined by the role a factor plays within the agent's plan. For the Council's plan to succeed, the Militia must move to the valley. The Council knows with certainty that the Militia's movement to the valley entails sacking the settlement. Therefore, the sacking is not an accidental byproduct; it is a known, necessary step in the causal chain the Council initiates to achieve safety. The Council uses the Militia's movement as a means to safety. Because the movement is inseparable from the violence (given the known facts), the Council uses the violence as a means.

  The structural reading is superior because the Doctrine of Double Effect is designed to constrain how we pursue goods, not merely to catalogue our wishes. If the Council could save the district only by blowing up the settlement themselves, the Doctrine would forbid it; the deaths would be a means to the diversion. It should not matter that they used the Militia as a tool to do the blowing up. The moral constraint on intending harm attaches to the agent who designs the plan, not just the hand that strikes the blow. To allow the psychological reading here is to allow agents to cleanse their intentions by inserting a proxy into the causal chain.

  Therefore, the Council intends the harm structurally, even if not psychologically. They rely on the Militia's violent disposition to secure the diversion. The harm is not merely foreseen; it is the mechanism by which the Militia is occupied and the district saved. Because the good effect is achieved through a plan that incorporates the killing of innocents as a necessary step, the third condition of the Doctrine is violated. The action is impermissible.

  *Note: The contestability here lies in whether the Militia's free action breaks the chain of intention. A defender of the psychological reading might argue that moral responsibility rests solely with the killer. However, this ignores the Council's manipulation of that killer's predictable behavior to serve their own ends.*

  ***

  **Marking Scheme (25 Marks)**

  **1. Identification of the Third-Party Problem (5 Marks)**
  *   **First-Class (5):** Explicitly identifies that the core difficulty is the Militia's agency. Notes that standard DDE cases involve direct causation, whereas here the harm is mediated by another will.
  *   **Second-Class (3-4):** Mentions the Militia but treats them as a natural force (like the trolley) or fails to explain why this changes the intention analysis.
  *   **Typical Error:** Ignoring the Militia's role and treating the broadcast as the direct cause of death.

  **2. Articulation of Reading One (Psychological/Foreseen) (5 Marks)**
  *   **First-Class (5):** Clearly defines intention as mental state/desire. Explains why this reading makes the action permissible (Council doesn't want deaths, Militia chooses violence).
  *   **Second-Class (3-4):** Describes the reading vaguely as "they didn't want it" without linking it to the definition of intention or the permissibility conclusion.
  *   **Typical Error:** Confusing this with consequentialism (arguing it's okay because the outcome is good).

  **3. Articulation of Reading Two (Structural/Means) (5 Marks)**
  *   **First-Class (5):** Defines intention by the plan's structure. Explains that because the violence is a known necessity for the plan's success, it functions as a means.
  *   **Second-Class (3-4):** States the action is wrong but fails to explain *why* the structural view counts the harm as a means rather than a side effect.
  *   **Typical Error:** Claiming the Council "ordered" the killing (factually incorrect based on the prompt).

  **4. Adjudication and Argument (5 Marks)**
  *   **First-Class (5):** Argues decisively for one reading. Explains why the chosen reading better serves the purpose of the Doctrine (e.g., preventing outsourcing of harm).
  *   **Second-Class (3-4):** Hedges between the two ("both have merit") or asserts a verdict without justifying why one reading of intention is superior.
  *   **Typical Error:** Sitting on the fence; concluding "it depends on which view you take" without taking a stand.

  **5. Clarity, Structure, and Constraint (5 Marks)**
  *   **First-Class (5):** Concise, no recitation of the four conditions, stays within the scope of the prompt. Verdict is clear.
  *   **Second-Class (3-4):** Wastes space defining DDE conditions. Verdict is buried or ambiguous.
  *   **Typical Error:** Reciting the four conditions verbatim (automatic cap at 15 marks total).

  **Grade Boundaries:**
  *   **20-25 (First):** Meets all First-Class criteria. Adjudicates clearly.
  *   **15-19 (Second):** Meets Second-Class criteria in Adjudication or Articulation. May recite conditions briefly.
  *   **10-14 (Third):** Identifies the case facts but fails to construct two readings of intention.
  *   **0-9 (Fail):** Recitation only, or irrelevant consequentialist analysis.
