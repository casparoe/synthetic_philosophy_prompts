  ok so i run the betting sheet for my school's fundraiser — we sell little tickets where people bet on stuff like who wins the basketball tournament, whether it snows before winter break, that kind of thing — and i set the odds myself. a friend who's really into philosophy told me there's this whole thing about dutch books, where if my odds are inconsistent then someone can bet on every side of it and be guaranteed to take money off us no matter what happens, and that the fix is to treat my odds as probabilities. i need an actual procedure i can run with a pen and paper in like ten minutes before i post the sheet, not the theory. give me the steps in order, what counts as a fail at each step, what to do when i honestly can't put a number on something (which happens a lot, some of these are one-off events with nothing to compare them to), where the procedure stops and i have to hand it to someone else, and which steps are the ones that actually matter vs. the ones that are just for show. then run it on three of my real cases: (1) odds on snow before break vs. odds on snow on each individual day of break, (2) a weird ticket we do where you only get paid if team A wins AND you already had the ticket that they make the final, and (3) the one i actually can't price, which is how many people show up to the fundraiser. tell me which of these the procedure can't settle and i just have to decide myself. and be straight with me about which parts are settled math everyone agrees on versus stuff philosophers actually argue about — like whether my odds being inconsistent really means they aren't probabilities, or whether that argument even works in the first place. don't tell me its all settled if it isn't, and no reading list or jargon i can't explain to my club.
