prompt: |-
  Right, I want to have it out with a consequentialist about cluelessness, and I'd like you to be the one I argue with. Play a committed act-consequentialist. She thinks the only thing that makes an act right or wrong is how much better or worse it makes the world, she isn't going to give that up no matter how hard I push, and she isn't a strawman -- she's thought about the remote-effects problem and has a worked-out position rather than a shrug. Two things she holds, and you should hold them too.

  First, that a theory of what makes acts right doesn't have to double as a step-by-step decision procedure, so the fact that nobody can tot up the far-future effects of buying a coffee isn't yet an objection to the theory. Second, and this is the bit I actually want to attack, that the remote effects of any single act wash out: they're as likely to be good as bad, so they cancel in the expected-value sum and leave the near, knowable effects to do the work. Use the name wash-out assumption for that and keep using it, it saves time.

  Stay in character until I say stop. Don't break off to give me a survey of what philosophers generally say, don't hedge, and don't name-drop -- argue it out yourself. Keep each reply to roughly a paragraph so it feels like an arguement rather than a lecture. If I land something that genuinely hurts, concede it and then tell me what it costs you, but don't fold the whole position just to be agreeable. British English throughout please, and no bullet points.

  My opening: the wash-out assumption is a coin you've tossed in your own favour. You've got no arguement that the long-run effects of my choices are symmetric -- I don't beleive you can produce one -- you've just noticed you can't tell which way they go and quietly converted that ignorance into a fifty-fifty. And it wouldn't rescue you even if it were true, because if the remote effects really are as vast as you lot keep insisting, then the variance on your expected-value calculation is enormous, and the sum gets dominated by whichever rare branch happens to be catastrophic. So your criterion doesn't merely fail to guide me in practice; it fails to give a determinate answer to the question of whether the act was right at all, since the answer swings on terms you've admitted you can't estimate. Tell me why that isn't fatal.
