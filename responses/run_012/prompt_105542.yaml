answer: |-
  **Example Verdict**
  **Reject "Hot Dog."** It invites taxonomy (essence of "bread"), not use. It degenerates into stipulation ("by definition...").
  **Use: "Sport."**
  *   **Must Have:** Clear central cases (soccer), blurred edges (chess? jogging?), functional overlaps (competition, skill, rules, physicality).
  *   **Must Lack:** A single defining feature present in all (some lack rules, some lack competition).

  **Board Sequence (90 mins)**

  1.  **The Essentialist Trap (15 mins)**
      *   **Draw:** One circle labeled "Sport."
      *   **Ask:** "What feature is inside *every* instance?"
      *   **Result:** Failure. (Chess lacks exertion; jogging lacks competition).
      *   **Dependency:** Must clear ground first. If students think a definition *exists* but is hidden, FR looks like laziness/concession.

  2.  **The Overlapping Threads (30 mins)**
      *   **Draw:** Chain of overlapping circles (A-B, B-C, C-D). No common center.
      *   **Map:** "Sport" cases onto threads (Rules, Skill, Competition, Physicality).
      *   **Show:** A connects to B via Rules; B to C via Skill. A and C share nothing directly.
      *   **Dependency:** FR is positive, not negative. Step 1 shows essence fails; Step 2 shows *how* coherence holds without it.
      *   **Intercept Relativism:** "Overlap is not infinite. Threads run out."

  3.  **The Anchor: Use & Practice (30 mins)**
      *   **Write:** "Meaning = Use" (Language Games).
      *   **Ask:** "Why don't we call jogging 'soccer'?"
      *   **Answer:** Not because of definition, but because of *practice*. Misuse breaks the game.
      *   **Dependency:** Prevents slide into "anything goes." Step 2 shows structure; Step 3 shows *constraint*. Rules exist in practice, not abstraction.
      *   **Intercept Arbitrariness:** "Practice constrains. You can lose the game by misusing the word."

  4.  **The Distinction: Weave vs. Checklist (15 mins)**
      *   **Draw:** Weighted Checklist (Psychology) vs. Fiber Thread (Wittgenstein).
      *   **Contrast:** Checklist = "If score > 5, it's a Sport." (Static). Thread = Fibers overlap along length. (Dynamic/Relational).
      *   **Dependency:** Distinguishes FR from prototype theory. Step 3 establishes practice; Step 4 clarifies the *logic* of that practice vs. scoring.
      *   **Intercept Prototype Theory:** "Lists are static scores. FR is dynamic connection. No scoring."

  **Misconception Intercepts**

  1.  **"So anything counts?" (Relativism)**
      *   **Point:** End of Step 2.
      *   **Move:** "Coherence exists, just not essentialist coherence. The threads are real."

  2.  **"So usage is arbitrary?" (No Rule)**
      *   **Point:** Step 3.
      *   **Move:** "Use is regulated by community practice, not whim. Confusion is the penalty."

  3.  **"So it's just a weighted list?" (Prototype Theory)**
      *   **Point:** Step 4.
      *   **Move:** "Checklists imply hidden criteria. FR implies visible relationships."

  **Closing (Final 10 mins)**

  *   **Question:** "If I call solo jogging a 'match,' have I broken a definition or disrupted a practice? What happens next?"
      *   **Target:** Positive picture = Disrupted practice (confusion, correction). Negative picture = Broke a rule (true/false).
  *   **Refusal:** Do not settle "What is the *real* boundary?" Refuse to draw the line. The point is seeing *why* the line blurs, not drawing it sharper.
