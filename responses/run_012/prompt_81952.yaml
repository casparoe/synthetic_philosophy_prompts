          2.  Sales/Support/Early Users (treat the AI as having moods/opinions, find it usable that way).
          3.  Investors/Family/General Public (expect an explanation of AI, know the journalist from radio).
      *   **Constraint/Challenge:** Avoid the two standard toasts (deflationary "it's just math" vs. sentimental "it cares about you"). Need a middle path: use intentional language ("thinks," "wants") fluently while remaining ontologically scrupulous (no "little person inside").
      *   **Philosophical Spine:** Daniel Dennett's "Intentional Stance" (treating systems as believers/wanters for predictive success without committing to inner consciousness), but *without* naming Dennett or lecturing.
      *   **Tone:** Reporter's voice (concrete, dry, no jargon), warm but honest.
      *   **Requirement:** Start with brainstorming (registers, "we", structural work, forbidden sentences) before writing the toast.
