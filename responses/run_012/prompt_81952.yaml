      *   *Word Count:* Aim for ~700 words.
      *   *Philosophy:* Embed the Intentional Stance without naming it. Treat the AI as an agent because it's *useful*, not because it's *true*.

  4.  **Refining the "Stance" Integration:**
      *   Instead of saying "We adopt the intentional stance," say "There are times when the only way to say what happened is to say the system decided..."
