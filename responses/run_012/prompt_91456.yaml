answer: |-
  Here is a 30-minute session plan designed to make the distinction emerge from a specific case study rather than a lecture.

  ### 1. The Order of Operations (30 Minutes)

  **0:00–5:00 | The Diagnostic Hook**
  *   **Action:** Write "ECHO CHAMBER" on the board. Ask: "What does this mean?"
  *   **Expected Output:** They will say "Only hearing opinions you agree with" or "Social media algorithms."
  *   **Move:** Validate this ("Yes, that's the common usage"), but write a question mark next to it. Tell them: "Today we're testing if that definition actually covers everything. We're going to look at two groups who both end up wrong, but for completely different reasons."

  **5:00–15:00 | The Case Study (The Core)**
  *   **Action:** Introduce the **Fictional Space Expedition** scenario (details below).
  *   **Part A (The Bubble):** Describe Team Alpha. They are isolated on a planet. They simply *never received* the warning signal about incoming storms because their radio broke.
      *   **Ask:** "How do we fix Team Alpha?" (Answer: Give them the signal/Listen to outside info).
      *   **Label:** Call this an **Epistemic Bubble**. It's a lack of exposure.
  *   **Part B (The Chamber):** Describe Team Beta. They are on the same planet. Their radio works. They *receive* the warning signal. However, their Commander tells them: "That signal is enemy propaganda designed to scare us. Do not trust it."
      *   **Ask:** "If we just send the signal again, does Team Beta survive?" (Answer: No, they'll still reject it).
      *   **Ask:** "What is the actual problem here?" (Guide them to: Trust, not access).
      *   **Label:** Call this an **Echo Chamber**. It's a manipulation of trust.

  **15:00–25:00 | Unpacking the Distinction**
  *   **Action:** Draw a Venn diagram or two columns.
  *   **Key Point 1:** You can be in an Echo Chamber while surrounded by disagreement (like Team Beta hearing the signal).
  *   **Key Point 2:** "Bubble" is often used to describe both, but the *solution* is different.
      *   Bubble Solution: Pop it (listen more).
      *   Chamber Solution: Rebuild trust (much harder, listening alone fails).
  *   **Head Off Misconception:** If someone says "Team Beta is just stubborn," correct them: "It's not just personality; their environment taught them to distrust the source. Stubbornness is individual; a chamber is structural."

  **25:00–30:00 | Assessment & Limitations**
  *   **Action:** Ask the Final Question (see below).
  *   **Action:** Admit what you're leaving out (see below).
  *   **Close:** "Next time you hear 'bubble,' ask: Are they missing the info, or do they just not trust the person giving it?"

  ### 2. Misconceptions & When to Head Them Off

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"It just means everyone agrees with you."** | 0:00–5:00 (Start) | Don't correct them yet. Let them commit to it, then use Team Beta (who hear disagreement but reject it) to break it later. |
  | **"An echo chamber is just being stubborn."** | 15:00–20:00 (During Team Beta) | Emphasize the Commander's role. It's not that they *won't* listen, it's that they've been taught the source is *malicious*. Distinguish individual choice from systemic distrust. |
  | **"The solution is just to listen to the other side."** | 20:00–25:00 (Solutions) | Point out that Team Beta *did* listen to the signal, but dismissed it. Listening doesn't fix broken trust. |
  | **"This is all about Twitter/TikTok."** | Throughout | Keep the focus on the *structure* of information, not the platform. The Space Expedition has no internet, yet still has chambers. |

  ### 3. The Final Assessment Question
  Ask this exactly as written to test if they grasped the *trust* vs. *access* distinction:

  > "If I follow someone I disagree with on social media, but I only do so to screenshot their posts and mock them as 'liars' to my friends, have I popped my bubble, or am I still in a chamber?"

  *(Correct answer: You popped the bubble [access] but remained in the chamber [distrust].)*

  ### 4. What to Admit You Are Leaving Out
  At the 28-minute mark, openly state:
  > "We're treating these as two neat categories. In reality, they overlap. You can be in a bubble *and* a chamber at the same time. Also, we aren't discussing who is actually telling the truth—sometimes the Commander is right, and the signal *is* propaganda. The philosophy is about the structure of belief, not judging which side is correct."

  \answer{A fictional space expedition where Team Alpha misses a storm warning due to broken radios (Bubble) and Team Beta receives the warning but rejects it as enemy propaganda due to commander instruction (Echo Chamber).}
