  ### A Dichotomous Key for Classifications of Law

  **Instructions:** Begin at Node 1. Read the description and the question. Select the answer (A or B) that matches your judgment. Follow the arrow to the next node or to a terminal Leaf. Proceed until you reach a Leaf.

  **Node 1**
  Consider the American fugitive slave statutes of 1850 and the courts that enforced them. If you conclude that calling these statutes "law" adds nothing to the moral conclusion that they ought not to be obeyed, and the disagreement over the label is merely about which sounds to make rather than how the world is:
  *   **A)** The dispute is merely terminological; the moral question is the real one. → **Leaf 1**
  *   **B)** The classification carries substantive weight regarding the nature of the thing itself. → **Go to Node 2**

  **Node 2**
  Consider the task of a legal theorist describing a legal system. Is the theorist's goal to construct the moral justification that shows the practice in its best light, or to describe the social facts and structures that exist regardless of their merit?
  *   **A)** The goal is to construct the best moral justification of the practice. → **Leaf 2**
  *   **B)** The goal is to describe social facts and structures. → **Go to Node 3**

  **Node 3**
  Consider a system whose rules are unpublished, retroactive, contradictory, or impossible to comply with. Does this failure of form destroy the existence of law entirely, rendering the system a mere exercise of naked power, or does it merely make the law bad?
  *   **A)** It destroys the existence of law entirely; there is no law here. → **Leaf 3**
  *   **B)** It makes the law bad, but it remains a legal system. → **Go to Node 4**

  **Node 4**
  Consider the post-war West German prosecution of the woman who denounced her husband to the authorities in 1944 and was later tried for unlawful deprivation of liberty. Was the 1944 statute she relied upon valid law at the time it was used, or did its gross injustice strip it of legal character *ex tunc* (from the beginning)?
  *   **A)** Its gross injustice stripped it of legal character automatically. → **Leaf 4**
  *   **B)** It was valid law at the time, however unjust. → **Go to Node 5**

  **Node 5**
  Consider a statute enacted with perfect procedural regularity whose content is monstrous. Is this law in the same unqualified sense as a just statute, or is it law only in a secondary, watered-down, or focal sense?
  *   **A)** It is law only in a secondary, watered-down, or focal sense. → **Leaf 5**
  *   **B)** It is law in the same unqualified sense as a just statute. → **Go to Node 6**

  **Node 6**
  Consider a master social rule officials use to identify law (a rule of recognition) that states: "No norm is valid if it violates fundamental human rights." Is this moral criterion legally binding because it is written in the social rule, or is it binding only because morality itself demands it regardless of the social rule?
  *   **A)** It is binding because it is written in the social rule. → **Leaf 6**
  *   **B)** It is binding only because morality demands it; law itself is source-based. → **Go to Node 7**

  **Node 7**
  Consider a decent legal system containing a single monstrous rule, set against a monstrous system containing mostly ordinary rules. Do you classify the single monstrous rule in the decent system as "law" more readily than the ordinary rules in the monstrous system?
  *   **A)** Yes, the context of the decent system makes the rule more "legal." → **Go to Node 8**
  *   **B)** No, the source determines the status regardless of the systemic context. → **Go to Node 9**

  **Node 8**
  *(Note: This path captures positions sensitive to systemic moral context.)*
  Does the legal system necessarily claim to give the subject a moral reason for action, even when the system is wicked?
  *   **A)** Yes, the claim to moral authority is necessary to the concept. → **Leaf 7**
  *   **B)** No, the claim is contingent and sometimes absent. → **Leaf 8**
  *(Diagnostic Note: This node reveals a tension. If you answered A at Node 7, you lean toward a systemic morality view often associated with Leaf 3 or 4, but if you hold B here, you occupy a rare cell. See "Where the Key Fails.")*

  **Node 9**
  Consider a judge in a thoroughly wicked regime deciding a routine commercial dispute. Does the law, by its very nature, necessarily claim legitimate moral authority to bind the subject in this dispute?
  *   **A)** Yes, law necessarily claims legitimate moral authority. → **Leaf 7**
  *   **B)** No, this claim is contingent and not part of the definition. → **Go to Node 10**

  **Node 10**
  Consider the relation between a rule's legal validity and the citizen's moral obligation to obey it. Is there a conceptual separation such that a rule can be legally valid yet generate no moral obligation?
  *   **A)** Yes, validity and moral obligation are conceptually separate. → **Leaf 8**
  *   **B)** No, validity implies at least a prima facie moral obligation. → **Leaf 7**

  ---

  ### The Leaves

  **Leaf 1: The Deflationary View**
  *   **Awkward Commitment:** The word "law" is an idle wheel in the machine of moral reasoning.
  *   **Embarrassing Case:** The Nuremberg Laws, where refusing to call them "law" feels like a necessary moral act, not a semantic one.

  **Leaf 2: Dworkin's Interpretivism**
  *   **Awkward Commitment:** There is no sharp boundary between what the law *is* and what it *ought to be* to justify coercion.
  *   **Embarrassing Case:** A clear statutory text that contradicts the morally best interpretation of the legal practice.

  **Leaf 3: Fuller's Inner Morality of Law**
  *   **Awkward Commitment:** A perfectly evil system with perfect procedural form is still a legal system.
  *   **Embarrassing Case:** Nazi Germany, which maintained significant procedural regularity while producing substantive atrocity.

  **Leaf 4: Radbruch-Style Non-Positivism**
  *   **Awkward Commitment:** Legal certainty must be sacrificed to justice retrospectively when injustice crosses a threshold.
  *   **Embarrassing Case:** A statute that is deeply unjust but falls just short of the "gross" threshold required to negate validity.

  **Leaf 5: Classical Natural Law**
  *   **Awkward Commitment:** An unjust law is a "perversion" of law, binding in conscience only to avoid scandal or disturbance.
  *   **Embarrassing Case:** Citizens obeying unjust laws believing them to be fully binding in the same sense as just laws.

  **Leaf 6: Inclusive Positivism**
  *   **Awkward Commitment:** Morality is part of the law only because a contingent social fact (the rule of recognition) says so.
  *   **Embarrassing Case:** A legal system where the rule of recognition explicitly excludes moral criteria for validity.

  **Leaf 7: Exclusive Positivism (Raz)**
  *   **Awkward Commitment:** Law necessarily claims legitimate moral authority even when it is thoroughly wicked.
  *   **Embarrassing Case:** The judge in a wicked regime deciding a routine dispute who feels no moral claim is being made.

  **Leaf 8: Hart's Positivism**
  *   **Awkward Commitment:** There is no necessary connection between law and morals, only a contingent minimum content for survival.
  *   **Embarrassing Case:** The Grudge Informer, where calling the 1944 statute "law" feels like complicity in the injustice.

  ---

  ### Where the Key Fails

  **1. Cryptic Positions (Inclusive Positivism vs. Classical Natural Law)**
  Leaf 6 (Inclusive Positivism) and Leaf 5 (Classical Natural Law) are cryptic with respect to one another in this key. Both allow that moral criteria can determine legal validity. The distinction lies not in the *outcome* (the matrix cell) but in the *ground* of that outcome. The Inclusive Positivist says morality is law *because the social rule incorporates it*; the Classical Natural Lawyer says morality is law *because reason demands it*. A decision tree based on verdicts alone cannot easily distinguish the *reason* for the verdict without asking meta-ethical questions about the source of normativity, which violates the constraint to use concrete cases.

  **2. The Empty Cell (Node 8, Path A)**
  Node 8 asks if you classify the monstrous rule in the decent system as "more legal" than ordinary rules in a monstrous system. If you answer "Yes" (sensitivity to systemic context) but then answer "No" to Node 9 (law does not necessarily claim authority), you occupy a cell that is largely unexplored. Most theories that care about systemic morality (Fuller, Radbruch) also tend to view law as making a moral claim or serving a moral function. A view that treats systemic morality as constitutive of "law-ness" but denies law necessarily claims authority is theoretically possible but lacks a prominent champion in this specific debate.

  **3. The Hart-Raz Spectrum**
  Leaf 7 (Exclusive) and Leaf 8 (Hart) are distinguished by the "Necessary Claim to Authority." In practice, this is often a matter of degree rather than a binary. Hart acknowledges law *often* claims authority; Raz argues it *must*. The key forces a dichotomy where the logical space may be continuous. If a theorist believes the claim to authority is a "standard" but not "necessary" feature, the key forces them arbitrarily into Leaf 8.

  **4. The Deflationary Overlap**
  Leaf 1 (Deflationary) is compatible with Leaf 8 (Hart). Hart often suggests the dispute is verbal. However, the key separates them at Node 1. If a Hartian believes the verbal distinction *does* carry substantive weight regarding social prediction (a core Hartian concern), they must answer "B" at Node 1. If they believe it is idle, they answer "A." This splits a single philosophical camp based on their rhetorical posture rather than their core ontology.
