      *   *The Crucial Distinction:* Explain *Oikonomia* vs. *Chrematistike*. Explain that for Aristotle, the *nature* of an act is defined by its *telos* (end/purpose), not just its mechanics.
      *   *Addressing Step (4):* Why is it wrong? Because selling a surplus to buy food isn't "wealth-getting" in the unnatural sense. It's still household management. The merchant (*kapelos*) is the problem, not the neighbor selling eggs.
      *   *Addressing Step (5):* Does the *polis* depend on unnatural trade? Aristotle admits trade is necessary but thinks it should be regulated. He doesn't idealize the merchant class. So there's no contradiction, just a hierarchy of activities.
      *   *The "Limit" Question:* The other friend is right. Is it merely psychological? No, it's ontological/teleological in Aristotle's framework. The "limit" isn't just in the head; it's in the function of the object within a life.
