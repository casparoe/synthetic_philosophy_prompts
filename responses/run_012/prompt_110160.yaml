answer: |-
  Your friend's reconstruction is a classic example of a *reductio ad absurdum* that feels compelling to a modern mind (especially an economist's) but stumbles over the specific metaphysical terrain Aristotle is walking on. As a physicist, you are well-positioned to spot where the model being used to analyze the system doesn't match the system's own internal logic.

  Your friend is applying a **mechanistic** critique (looking at the flow of money as a physical quantity) to a **teleological** system (looking at the purpose or *end* of the activity).

  Here is an analysis of where the argument fails, which step to reject, and whether the "limit" distinction saves Aristotle from the charge of mere psychologism.

  ### 1. Diagnosing the Argument
  Your friend's argument is logically valid (the conclusion follows from the premises), but it is **unsound** because it relies on an equivocation in Premise (3) and a consequent error in Premise (4).

  *   **Premises (1) and (2)** are faithful to Aristotle (*Politics* I.8–10, *Nicomachean Ethics* V.5). Aristotle does distinguish between exchange for use (*oikonomia*) and exchange for profit (*chrematistike*), and he does condemn usury as the most unnatural because money begetting money is like a tool making another tool without a user.
  *   **Premise (3)** is empirically true: money changes hands in both cases.
  *   **Premise (4)** is the break point: *"Therefore, by Aristotle's own standard, the everyday commerce of the polis is unnatural."*

  **You should reject Premise (4).**

  ### 2. Why Reject Premise (4)?
  Premise (4) assumes that the **mechanism** of exchange (the use of money) determines the **nature** of the activity. For Aristotle, the mechanism is irrelevant compared to the *telos* (end goal).

  To use a physics analogy: Consider a resistor in a circuit.
  *   **Case A:** The resistor is used to regulate voltage so a sensor can function correctly within a specific range.
  *   **Case B:** The resistor is used to generate heat indefinitely until the system burns out.

  In both cases, electrons flow through a resistive material (the mechanism is identical). If you argued, "In both cases, resistance generates heat; therefore, Case A is thermally destructive," you would be ignoring the *context* and *limit* of the system.

  For Aristotle, a citizen selling a surplus of grain to buy shoes is engaging in **natural exchange**. The money is a medium, like the electrons in Case A. The activity stops when the need (shoes) is met.
  A merchant buying grain solely to sell it for more money is engaging in **unnatural wealth-getting**. The money is the end, like the heat in Case B. The activity has no internal stop point.

  **The Cost of Rejecting (4):**
  Rejecting this premise costs you the ability to judge economic activity solely by its institutional form. You cannot look at a market transaction and declare it "unnatural" just because money was used for profit. You must inquire into the **intent** and the **limit** of the actor. This makes economic evaluation dependent on moral psychology and social context, rather than purely on market mechanics. For an economist, this is frustratingly "unscientific." For Aristotle, it is the only way to be accurate about human action.

  ### 3. Addressing Premise (5): The Polis and Commerce
  Your friend claims Aristotle contradicts himself because the *polis* depends on exchange, yet he condemns exchange. This is also a misunderstanding of Aristotle's sociology.

  Aristotle does not believe the *polis* depends on *unlimited* wealth-getting. He believes the *polis* depends on **self-sufficiency** (*autarkeia*). Exchange is necessary to achieve self-sufficiency because households produce different things. However, Aristotle explicitly relegates professional retail trade (*kapelike*) to a lower status. In his ideal city (*Politics* VII), he suggests that citizens should not engage in vulgar trades, and that trade should be conducted by non-citizens or regulated strictly to prevent the corruption of civic virtue.

  So, there is no contradiction: The *polis* needs exchange (natural), but it does not need a class of citizens dedicated to unlimited accumulation (unnatural). In fact, Aristotle thinks the latter threatens the former.

  ### 4. The "Limit" Distinction: Psychological or Ontological?
  Your second friend suggests the repair lies in the **limit internal to the activity**: natural acquisition stops at need; wealth-getting is infinite. You worry this makes the distinction merely psychological (what the seller is thinking) rather than economic.

  This is the crux of the matter. If the distinction is *only* psychological, then Aristotle's critique is weak, as you suspect. A merchant could simply say, "I am accumulating this money to buy a farm someday (need)," and thus sanctify unlimited profit.

  However, for Aristotle, the distinction is **teleological**, which is stronger than mere psychology.
  *   **Psychology** is subjective intent ("I hope to stop someday").
  *   **Teleology** is the objective function of the activity within a human life.

  In Aristotle's framework, an activity is defined by its end. If the end is "life" (sustenance), the activity is natural. If the end is "more money" (which is a means, not an end), the activity is a category error. It is treating a means as an end.

  **Does this rescue Aristotle?**
  Yes, but it requires you to accept his metaphysics.
  1.  **It is not just relabeling:** It grounds the economic critique in the nature of human flourishing (*eudaimonia*). Money is a tool for living; living is not a tool for making money. To reverse this is not just "greedy," it is irrational in the same way eating to live is rational, but living to eat is irrational.
  2.  **The Institutional Implication:** Because the "limit" is not automatically enforced by the market (the market encourages the unlimited), Aristotle argues the *polis* must enforce the limit through law and habit. This is why he supports usury laws and social norms against profiteering. The "limit" is not just in the head; it is encoded in the virtues of the citizen and the laws of the city.

  ### 5. Summary for Your Reading Group
  To preserve the core of Aristotle's view (that exchange for need is natural, endless accumulation is corrosive), you should argue the following:

  1.  **Reject Premise (4):** The presence of money does not make an exchange unnatural. The *telos* of the exchange does.
  2.  **Clarify the "Limit":** The distinction between natural and unnatural is not merely psychological (what I intend today) but structural (what the activity is *for* in a complete life).
  3.  **Acknowledge the Cost:** The cost is that we cannot analyze economics as a value-neutral mechanism (as modern economics tries to do). We must analyze it as a branch of ethics and politics.

  **Verdict:** Your friend's argument is a **caricature** born of applying modern economic categories (where money is neutral and trade is inherently good) to an ancient ethical framework (where money is a tool and trade is suspect unless bounded by need). Aristotle is not incoherent; he is operating with a different definition of "nature." For him, "natural" means "serving the proper function of a human being," not "what happens in a free market."

  If you accept that definition, his account holds together. If you reject that definition (as most moderns do), then you aren't finding a contradiction in Aristotle; you are rejecting his first principles.
