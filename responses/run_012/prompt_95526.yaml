prompt: |-
  I edit a quarterly magazine of popular history, and our letters page and inbox now regularly carry challenges to articles we have published: a reader argues that a death toll we printed is inflated, that a survivor's testimony we relied on is unreliable, that a document we cited is a forgery, or that an event we treated as established is a political construction. The events in question are mostly twentieth-century mass atrocities — the Holocaust, the Armenian genocide, the Nanjing Massacre — and the challenges arrive about all three. Some of these letters are ordinary scholarly correction and deserve a printed reply; some are denialism and deserve a form rejection. I am not a specialist in the periods we cover, I have about an hour per case, and nothing goes to press without the agreement of my two co-editors, who meet monthly. We can afford one outside specialist opinion per quarter, so the procedure should also tell me when to spend it. What I need is not a reading list but an ordered procedure: the questions to put to a challenge, in order; what counts as an answer to each; which answers end the case on the spot; and which ones hand the decision to a human because they turn on unsettled history or on values rather than on evidence.

  Three distinctions have to survive the simplification. A challenge can aim at any level of an account — that the event occurred, its scale, its mechanism, the responsibility of particular actors, the reliability of a particular source — and the procedure must not treat a challenge to a lower level as though it were a denial of the event, or the reverse. A challenge should count as evidence-based only if it offers an alternative account that makes the surviving evidence at least as likely as the account it attacks, rather than merely listing difficulties with the existing one. And I want a symmetry test built in: a challenge qualifies only if the standard of proof it demands of the account it attacks is one it would accept for accounts it does not dispute; where the standard is set so high that no surviving record of any historical event could meet it, the challenge has disqualified itself, and I want the procedure to say so and stop rather than carry on.

  Then run the procedure on three challenges: a carefully argued letter claiming that a figure we printed is too high, offering archival material in support of a lower one; a letter from a reader with no evident agenda asking why we treat a class of testimony recorded decades after the fact as reliable; and a long, superficially footnoted submission from a group with an obvious ideological commitment arguing that the event did not happen and that the mainstream account is a political construction. I expect the procedure to tell me to print the first, even though it will annoy readers, and to stop the third at an early step; if it does neither, say where my procedure is wrong, including whether the symmetry test and the alternative-account requirement are themselves good tests. Close by saying what the procedure cannot do and which cases will still reach my desk as judgment calls.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Editor of a quarterly popular history magazine.
      *   **Problem:** Regular challenges to articles on 20th-century mass atrocities (Holocaust, Armenian Genocide, Nanjing). Mix of scholarly correction and denialism.
      *   **Constraints:** 1 hour per case, non-specialist editor, two co-editors (monthly meeting), budget for one outside specialist opinion per quarter.
      *   **Goal:** An ordered procedure (flowchart-like logic) to triage challenges.
      *   **Key Requirements:**
          *   Distinguish levels of challenge (event existence vs. scale vs. source reliability).
          *   Evidence-based requirement (must offer an alternative account making evidence *at least as likely*, not just critique).
          *   Symmetry Test (standards of proof must be consistent across disputed/undisputed events).
          *   Run the procedure on three specific test cases.
          *   Evaluate the procedure's success/failure on those cases.
          *   Conclude with limitations and judgment calls.

  2.  **Deconstruct the Core Principles:**
      *   *Level Differentiation:* Don't conflate "the number is wrong" with "it didn't happen."
      *   *Alternative Account:* Critique isn't enough; you need a better or equally plausible explanation of the *same* evidence.
      *   *Symmetry:* You can't demand impossible proof for Event A while accepting normal proof for Event B.
      *   *Efficiency:* Needs to be doable in ~60 minutes.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Step 1: Categorization.* What is being challenged? (Fact, Scale, Source, Existence).
      *   *Step 2: The Symmetry Test.* Is the standard of proof reasonable? (The "Impossible Standard" filter).
      *   *Step 3: The Alternative Account Test.* Does the challenger explain the evidence better or equally well?
      *   *Step 4: Evidence Check.* Is there *new* evidence or just reinterpretation?
      *   *Step 5: Triage/Action.* Print, Reject, or Escalate (Specialist/Editors).

      *Refining the Steps for the "1-Hour" Constraint:*
      *   Need clear "Stop" conditions.
      *   Need clear "Escalate" conditions (for the specialist slot).

      *Drafting the Questions:*
      1.  **Scope:** What exactly is disputed?
      2.  **Symmetry:** Would this standard of proof invalidate accepted history elsewhere?
      3.  **Alternative:** Does the challenger account for the existing evidence?
      4.  **Source:** Is the challenger's evidence verifiable?
      5.  **Consensus:** Does this contradict established consensus without overwhelming new proof?

  4.  **Developing the Test Cases:**
      *   *Case 1 (Scale):* Carefully argued, archival material, lower figure. -> Should Print.
      *   *Case 2 (Source):* No agenda, asks about testimony recorded decades later. -> Judgment Call/Educational Reply (likely Print or Note).
      *   *Case 3 (Denial):* Ideological group, event didn't happen, political construction. -> Should Stop Early.

  5.  **Running the Procedure (Mental Simulation):**

      *   *Case 1:*
          *   Scope: Scale.
          *   Symmetry: Standard seems normal (archival cross-check).
          *   Alternative: Yes, offers specific lower number based on specific docs.
          *   Action: Print (correction/nuance).
      *   *Case 2:*
          *   Scope: Source Reliability.
          *   Symmetry: Valid historical question (memory vs. contemporaneous record).
          *   Alternative: Doesn't necessarily offer an alternative *event*, but questions the *weight* of evidence.
          *   Action: This is tricky. It's not denialism, it's methodology. Needs a reply explaining *why* we use it.
      *   *Case 3:*
          *   Scope: Existence.
          *   Symmetry: Fails. Demands proof impossible for any pre-digital era event.
          *   Alternative: "Political construction" explains the *documents* as forgeries without proving *how* the conspiracy worked physically.
          *   Action: Stop.

  6.  **Critiquing the Procedure (Self-Correction/Refinement):**
      *   *The "Alternative Account" Requirement:* Is this too high a bar for a letter writer? If I point out a math error in a death toll, do I need to provide the *correct* toll? Maybe just showing the error is enough. *Adjustment:* Distinguish between "Positive Claim" (It didn't happen) and "Negative Claim" (This proof is flawed). For denialism, positive claim is needed. For corrections, showing the flaw is enough.
      *   *The Symmetry Test:* How does a non-specialist editor know what standard is used elsewhere? *Adjustment:* Use a "General Historical Practice" benchmark (e.g., do we accept census data for other events?).
      *   *Time Limit:* 1 hour is tight for checking archives. The procedure must rely on *internal consistency* and *face validity* of the challenger's citations, not deep verification.

  7.  **Finalizing the Procedure Structure:**
      *   Phase 1: Triage (5 mins).
      *   Phase 2: The Symmetry Filter (15 mins).
      *   Phase 3: The Alternative Account Filter (25 mins).
      *   Phase 4: Decision Matrix (15 mins).

  8.  **Addressing the Prompt's Specific Constraints:**
      *   "Three distinctions have to survive": Event vs. Scale vs. Source.
      *   "Evidence-based only if... alternative account": Must be strictly applied.
      *   "Symmetry test": Must be explicit.
      *   "Run on three challenges": Must show the output.
      *   "Close by saying what the procedure cannot do": Limitations.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the difficulty.
      *   *The Procedure:* Numbered steps with "Stop/Go" logic.
      *   *The Test Run:* Apply steps to Case 1, 2, 3.
      *   *Evaluation:* Did it work? (Case 3 stopped early? Case 1 approved?).
      *   *Critique of the Tests:* Are Symmetry and Alternative Account good? Yes, but with caveats.
      *   *Limitations:* What slips through? (Nuanced scholarly debates, emerging evidence).

      *(Self-Correction during drafting)*: Wait, the prompt says "I expect the procedure to tell me to print the first... and to stop the third." I need to ensure the logic *forces* that outcome.
      *   Case 1: Passes Symmetry (archives are standard). Passes Alternative (offers specific lower number). -> Print/Review.
      *   Case 3: Fails Symmetry (demands proof impossible for *any* event). Fails Alternative ("political construction" is a motive, not a mechanism for falsifying specific records). -> Reject.
      *   Case 2: Passes Symmetry. Fails "Alternative Account" strictly speaking (it's a methodological query). This needs to be categorized as "Request for Clarification" rather than "Challenge." I need to make sure the procedure handles *questions* differently from *challenges*. The prompt calls them all "challenges," but Case 2 is "asking why." I will treat it as a "Methodological Challenge."

      *Refining the "Alternative Account" rule:* The prompt says "A challenge should count as evidence-based only if it offers an alternative account that makes the surviving evidence at least as likely." This is a high bar. For Case 1 (death toll), offering a lower number *is* an alternative account of the scale. For Case 3 (denial), "it didn't happen" is the alternative, but does it make the evidence (photos, testimonies) as likely? No, it requires calling them all fakes. So it fails.

      *Refining the "Symmetry Test":* How to operationalize for a non-specialist? Ask: "If applied to the Battle of Gettysburg or the French Revolution, would this standard invalidate those events?"

  10. **Final Polish:** Check tone (professional, procedural, authoritative). Ensure all constraints of the prompt are met. (1 hour limit, specialist usage, co-editor agreement).

      *Wait, one constraint:* "We can afford one outside specialist opinion per quarter, so the procedure should also tell me when to spend it."
      *Add Step:* When to escalate to specialist. (When Case 1 and 2 pass filters but contradict each other, or when Case 1 is technically complex).

      *Let's write.*
answer: |-
  ### The Editorial Triage Procedure (ETP)

  **Time Budget:** 60 Minutes
  **Goal:** Distinguish scholarly correction from denialism; identify cases requiring specialist review.
  **Prerequisites:** The article in question, the challenger's submission, access to the magazine's style guide on sourcing.

  #### Phase 1: Categorization (5 Minutes)
  **Question 1:** What is the specific object of the challenge?
  *   **A. Existence:** Claims the event did not occur.
  *   **B. Scale:** Claims the numbers (dead, displaced) are significantly different.
  *   **C. Mechanism/Responsibility:** Claims the method of killing or the chain of command is misidentified.
  *   **D. Source Reliability:** Claims a specific document or testimony is flawed, forged, or misread.

  *   *Instruction:* Tag the challenge. If **A**, proceed to Phase 2 immediately. If **B, C, or D**, proceed to Phase 2.
  *   *Note:* Do not treat a **B** challenge as an **A** challenge. A dispute over 100,000 vs 150,000 deaths is not a dispute over whether deaths occurred.

  #### Phase 2: The Symmetry Test (15 Minutes)
  **Question 2:** What standard of proof does the challenger demand for the claim they dispute?
  **Question 3:** If that same standard were applied to non-contested historical events (e.g., the Battle of Gettysburg, the Great Fire of London, the French Revolution), would those events also cease to be "proven"?

  *   *Indicators of Failure (Asymmetry):*
      *   Demands contemporaneous video/photographic evidence for pre-1950 events.
      *   Demands a single "smoking gun" document signed by the primary perpetrator admitting guilt.
      *   Treats absence of evidence as evidence of absence, while treating presence of contrary evidence as "planted."
      *   Requires survivor testimony to be perfectly consistent across decades, a standard not applied to veterans of other wars.

  *   *Decision:*
      *   **If FAILED:** Stop. Mark as **Denialism**. Do not print. Do not escalate. (Saves time).
      *   **If PASSED:** Proceed to Phase 3.

  #### Phase 3: The Alternative Account Test (25 Minutes)
  **Question 4:** Does the challenger merely list difficulties with the existing account, or do they offer a coherent alternative explanation for the *same* body of evidence?
  **Question 5:** Does the alternative account make the surviving evidence (documents, physical remains, testimonies) *at least as likely* as the original account?

  *   *Indicators of Failure (Negation without Reconstruction):*
      *   Points out a discrepancy in a census but offers no revised census or explanation for the discrepancy.
      *   Claims documents are forgeries but offers no evidence of *who* forged them, *when*, or *how* the conspiracy was logistically sustained.
      *   Claims testimony is unreliable due to trauma/time but offers no corroborating evidence that the event did not happen.

  *   *Indicators of Passing (Reconstruction):*
      *   Provides specific archival references that contradict the original figure and explains why the original figure was likely derived (e.g., "double counting").
      *   Acknowledges the evidence exists but recontextualizes it (e.g., "This order was issued but countermanded by X document").

  *   *Decision:*
      *   **If FAILED:** Stop. Mark as **Unsubstantiated Critique**. Form rejection.
      *   **If PASSED:** Proceed to Phase 4.

  #### Phase 4: Triage and Escalation (15 Minutes)
  **Question 6:** Does the challenge pass Phases 1–3 but contradict the magazine's established consensus or the article's core thesis?
  **Question 7:** Is the technical material (archival codes, demographic methods) beyond the editorial board's lay competence?

  *   *Decision Matrix:*
      *   **Passes 1–3, Minor Correction (e.g., typo, date, slight figure adjustment):** Print as Letter/Correction.
      *   **Passes 1–3, Major Revision (e.g., significant scale change, source re-evaluation):** **Escalate to Specialist.** (Use the quarterly budget).
      *   **Passes 1–3, Methodological Query (e.g., "Why use this source?"):** Print as Editor's Note or Reply (Educational).
      *   **Fails 2 or 3:** Form Rejection (No reply needed).

  ***

  ### Test Run: Applying the ETP

  #### Case 1: The Archival Scale Challenge
  *   **Submission:** A carefully argued letter claiming a printed death toll is too high, offering specific archival material for a lower number.
  *   **Phase 1 (Categorization):** **B (Scale).** Not an Existence challenge.
  *   **Phase 2 (Symmetry):** **PASS.** The challenger uses archival cross-referencing. This is standard historical practice for the Battle of Gettysburg or civilian bombing raids in WWII. They are not demanding impossible proof.
  *   **Phase 3 (Alternative Account):** **PASS.** They do not just say "the number is wrong." They offer a *specific lower number* derived from *specific documents* and explain the likely error in the original count (e.g., "double counting of refugees"). This makes the evidence (the archives) at least as likely to support their view.
  *   **Phase 4 (Triage):** **Escalate to Specialist.** While it passes the tests, changing a death toll in a mass atrocity article is significant. It requires verification of the archives cited.
  *   **Outcome:** **Print (pending specialist verification).** This matches your expectation. It annoys some readers but upholds accuracy.

  #### Case 2: The Methodological Query
  *   **Submission:** A reader with no evident agenda asks why a class of testimony recorded decades after the fact is treated as reliable.
  *   **Phase 1 (Categorization):** **D (Source Reliability).**
  *   **Phase 2 (Symmetry):** **PASS.** Questioning the reliability of delayed testimony is standard historical practice (e.g., oral history vs. war diaries). They are not applying a unique standard.
  *   **Phase 3 (Alternative Account):** **PARTIAL/N/A.** They are not arguing the event didn't happen, nor offering a rival number. They are questioning the *weight* of evidence. Strictly speaking, this fails the "Alternative Account" test as defined for *challenges*, but it passes as a *query*.
  *   **Phase 4 (Triage):** **Print as Editor's Note.** This is not a correction but a request for transparency. It does not require a specialist; it requires an editorial explanation of why oral history is used in the absence of contemporaneous records.
  *   **Outcome:** **Print (Reply/Note).** This maintains trust without validating denialism.

  #### Case 3: The Ideological Construction
  *   **Submission:** A long, footnoted submission from a group with an obvious ideological commitment arguing the event did not happen and is a political construction.
  *   **Phase 1 (Categorization):** **A (Existence).**
  *   **Phase 2 (Symmetry):** **FAIL.** To argue the event is a "political construction," they must treat all surviving evidence (photos, train logs, mass graves, tens of thousands of testimonies) as fabricated. If we applied this standard to the existence of the Soviet Gulag or the Transatlantic Slave Trade (both of which have some disputed numbers/documents), those events would also be deemed "constructions." The standard of proof demanded (total absence of ambiguity) is one no historical event could meet.
  *   **Phase 3 (Alternative Account):** **FAIL.** The alternative account is "It was a lie." Does this make the evidence *at least as likely*? No. It requires a conspiracy of such magnitude (forging train logs in multiple countries, bribing thousands of survivors) that it is less probable than the event itself. They list difficulties but do not explain the *mechanism* of the fabrication convincingly.
  *   **Phase 4 (Triage):** **Stop.** Form Rejection.
  *   **Outcome:** **Reject.** Matches your expectation. Stops early (Phase 2), saving time.

  ***

  ### Evaluation of the Procedure and Tests

  **Did the procedure work?**
  Yes. It correctly routed Case 1 to print (via specialist), Case 2 to reply, and Case 3 to immediate rejection. It respected the one-hour limit by front-loading the "Symmetry Test," which eliminates the most time-consuming denialist arguments before deep reading is required.

  **Are the "Symmetry" and "Alternative Account" tests good?**
  *   **The Symmetry Test:** This is the strongest filter. Denialism often relies on *special pleading*—creating a unique epistemological cage for one specific event. By forcing the editor to ask, "Would this standard invalidate the Magna Carta?", you bypass the need for subject-matter expertise. It turns a historical question into a logical consistency check.
  *   **The Alternative Account Test:** This is necessary but risky. It prevents "grievance mongering" (listing errors without solutions). However, it risks privileging established narratives. Sometimes the "alternative account" is simply "we don't know yet."
      *   *Correction:* In Phase 3, ensure that "We do not know" is accepted as an alternative to "We know X" if the evidence for X is weak. But for mass atrocities, the "It didn't happen" account is never a valid "We don't know."

  **Where the Procedure is Wrong (or Vulnerable):**
  1.  **The "Obvious Agenda" Bias:** In Case 3, I noted the group had an "obvious ideological commitment." The ETP relies on the *argument*, not the *source*. If a denialist group writes a letter that *passes* the Symmetry and Alternative tests (e.g., they find a genuine archival error), the procedure says "Escalate." You must suppress the instinct to reject based on *who* sent it. The procedure protects you here, but it requires discipline.
  2.  **The "Alternative Account" Bar for Case 2:** Strictly applied, Case 2 fails Phase 3 because it offers no alternative account of the *event*, only a critique of the *method*. If you rigidly enforce Phase 3, you might silence legitimate methodological debate. The procedure must allow a "Methodological Query" bypass, as I included in the Test Run.
  3.  **The Specialist Bottleneck:** You have one specialist opinion per quarter. If Case 1 (Scale) and a similar Case 4 arrive in the same quarter, the procedure identifies both as "Escalate," but you can only afford one. You will need a tie-breaker rule (e.g., "Earliest submission" or "Most significant deviation from consensus").

  ***

  ### Limitations and Judgment Calls

  No procedure can automate history. The following cases will still reach your desk as judgment calls, regardless of the ETP:

  1.  **The "Gray Zone" Scholar:** A credentialed historian challenges a consensus view using valid methods (passes Symmetry) and an alternative account (passes Phase 3), but their conclusion is politically explosive. The ETP says "Escalate," but if your specialist is unavailable or the field is deeply divided, you must decide whether to publish a minority view as "settled" history. This is a values judgment, not an evidentiary one.
  2.  **Emerging Evidence:** Sometimes a challenge is based on newly declassified material that your existing article (and perhaps your specialist) is unaware of. The ETP treats the *argument*, not the *novelty*. You may print a correction that later turns out to be based on a forgery, or reject a truth because it lacks consensus.
  3.  **The "Tone" Trap:** A challenge may pass all evidentiary tests but be written in a hostile, harassing manner. The ETP evaluates the *content*. You retain the right to reject based on *conduct*, but you must document that the rejection was for tone, not history, to avoid accusations of censorship.
  4.  **Resource Constraints:** If three "Case 1" letters arrive in one quarter, you cannot buy three specialist opinions. You will have to make an editorial judgment on which correction is most vital to the historical record.

  **Final Instruction:** The ETP is a shield, not a sword. It protects the magazine from wasting time on impossible standards and baseless negation. It does not tell you what is *true*; it tells you what is *arguable within the rules of historical discourse*. When the procedure says "Escalate," the human work begins.
