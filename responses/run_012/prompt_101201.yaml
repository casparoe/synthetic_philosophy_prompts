answer: |-
  # Decision Tree: Interpreting the Tetralemma and Emptiness

  **Start:** You are analyzing a claim that "all things are empty" using the four-cornered negation (true, false, both, neither).

  **Q1. Does the tetralemma apply to itself? (Is the claim "all things are empty" itself empty?)**
  *   **No:** The claim is an exception; it is an absolute truth about reality.
      *   **→ LEAF: Substantialist Emptiness (Coherent but Unheld)**
          *   *Position:* Emptiness is the one intrinsic nature that things possess.
          *   *Awkward Commitment:* It turns the denial of intrinsic nature into an affirmation of one, violating the core definition of emptiness.
          *   *(Note: This combination is logically coherent but unattractive to Madhyamaka proponents because it reifies emptiness.)*
  *   **Yes:** The claim is also empty; it is a tool or a provisional statement.
      *   **→ Go to Q2.**

  **Q2. When the four corners are rejected, is it because reality is contradictory, or because the questions are flawed?**
  *   **Reality is Contradictory:** The four corners fail because standard logic cannot capture a contradictory reality; some corners (e.g., both true and false) may actually hold.
      *   **→ LEAF: Paraconsistent / Dialetheic Reading**
          *   *Position:* The tetralemma reveals that contradictions are true features of the world.
          *   *Awkward Commitment:* Requires abandoning the Law of Non-Contradiction for most other reasoning to avoid triviality.
  *   **Questions are Flawed:** The four corners fail because they presuppose something that isn't there (intrinsic nature).
      *   **→ Go to Q3.**

  **Q3. Is the point of the tetralemma to produce a piece of knowledge, or to remove a craving/confusion?**
  *   **Produce Knowledge:** The goal is to correctly understand the status of reality or language.
      *   **→ Go to Q4.**
  *   **Remove Craving/Confusion:** The goal is therapeutic; to change the state of the practitioner, not the map of the world.
      *   **→ Go to Q5.**

  **Q4. Do the four corners fail because there are two levels of truth, or because words lack referents?**
  *   **Two Levels of Truth:** The corners work conventionally but fail ultimately; "exists" means different things at different levels.
      *   **→ LEAF: Two-Truths Reading**
          *   *Position:* Conventional truth describes functionality; ultimate truth describes emptiness.
          *   *Awkward Commitment:* Risks turning "Ultimate Truth" into a hidden metaphysical realm rather than a lack of nature.
  *   **Words Lack Referents:** The corners fail because terms like "exists" presuppose intrinsic nature, which nothing has.
      *   **→ LEAF: Semantic Reading**
          *   *Position:* The tetralemma demonstrates a presupposition failure in language.
          *   *Awkward Commitment:* Makes all ordinary language technically meaningless unless constantly qualified.
      *   *(Note: These two leaves are often difficult to separate in practice; see "Indistinguishable Leaves" below.)*

  **Q5. When questioning stops, is it because there is something beyond words, or because the questioning was never useful?**
  *   **Something Beyond Words:** The tetralemma clears the ground for an ineffable experience or reality.
      *   **→ LEAF: Mystical / Ineffability Reading**
          *   *Position:* The negation points toward a reality that cannot be spoken.
          *   *Awkward Commitment:* Claims to know that there is something we cannot know.
  *   **Questioning Never Useful:** The tetralemma shows the question itself is a trap with no answer needed.
      *   **→ Go to Q6.**

  **Q6. Does the philosopher assert that "this therapy works," or refuse to assert even that?**
  *   **Asserts Therapy Works:** The tetralemma is a recommended tool to stop asking bad questions.
      *   **→ LEAF: Deflationary / Pragmatic Reading**
          *   *Position:* Emptiness is a recommendation to stop ontological questioning.
          *   *Awkward Commitment:* Risks reducing profound soteriological insight to mere social or psychological utility.
  *   **Refuses Assertion:** The philosopher makes no claim about the therapy, only reports the cessation of views.
      *   **→ LEAF: Quietist / Therapeutic Reading**
          *   *Position:* No thesis is held, including the thesis that "no thesis should be held."
          *   *Awkward Commitment:* Performatively contradictory (asserting that one asserts nothing).
      *   *(Note: These two leaves are often difficult to separate in practice; see "Indistinguishable Leaves" below.)*

  ***

  ### Indistinguishable Leaves
  *   **Quietist vs. Deflationary:** In practice, a Quietist who says "I assert nothing" and a Deflationist who says "Asserting is useless" often behave identically. The tree separates them based on whether they make a positive claim about the *utility* of the view, but this is a very thin line.
  *   **Two-Truths vs. Semantic:** A Semantic reading often explains *why* the Two-Truths distinction is necessary (because language presupposes intrinsic nature). They are frequently combined rather than chosen between.

  ### Pruned Branches (Empty Combinations)
  *   **Paraconsistent + Quietist:** (Incoherent). If you believe contradictions are *true* (Paraconsistent), you hold a thesis about reality. If you hold *no thesis* (Quietist), you cannot claim contradictions are true.
  *   **Substantialist Emptiness + Self-Empty:** (Incoherent). If emptiness is an intrinsic property (Substantialist), it cannot be empty of intrinsic nature (Self-Empty). This path was pruned at Q1.
  *   **Mystical + Produce Knowledge:** (Unattractive/Unexplored). If the goal is to produce knowledge (Q3), claiming reality is ineffable (Q5) undermines the goal. Usually, Mystical readings align with "Remove Craving."

  ***

  ### Confidence and Weakest Distinction

  **Overall Confidence:** High on the broad logical space (e.g., separating Realist from Anti-Realist readings), Moderate on the specific therapeutic distinctions.

  **Weakest Distinction:** **Q6 (Asserts Therapy Works vs. Refuses Assertion).**
  *   **Why:** This distinction relies on a performative nuance that is hard to pin down in texts. A Quietist might say "This medicine cures" without claiming the medicine is "true," blurring the line with the Deflationist. Many scholars treat these as variations of a single "Therapeutic" position rather than distinct leaves. The tree forces them apart to satisfy the request for specific leaves, but in the wild, they often merge.
