prompt: |-
  So I run a small formal-epistemology group — three of us plus a PhD student starting in the fall — and we've got enough soft money to keep two of them going for about three years. We mostly work on probabilistic updating, and the thing that keeps pulling us back is uncertain evidence: what you actually do when what comes in isn't "E happened" but "here's a probability," or a likelihood, or a fuzzy reading off an instrument, and you want to fold it into your credences.

  The textbook move is Jeffrey's — take a partition, shift your probabilities on the cells, hold the conditionals fixed (the rigidity thing), call it probability kinematics. Fine. But there's a pile of loose threads and I cant tell which are load-bearing and which are just puzzles people enjoy. Off the top of my head: the order-dependence worry (two soft updates can land you in different places depending on which you do first), whether the rigidity condition is a real constraint or just a convention, what to do when the uncertain evidence doesn't carve things into a clean partition, whether any of the accuracy-style or Dutch-book-style justifications actually reach the Jeffrey rule rather than only ordinary conditioning, and how any of this touches the old-evidence problem.

  And then there's a fight inside the group that I suspect is the real fork. One of us keeps insisting the whole framing is a mistake — that "uncertain evidence" shouldn't be modeled as a constraint you impose on your credences at all, but as a noisy report with its own likelihood, in which case you just condition on the report (or on the fact that you received it) and Jeffrey conditionalization turns out to be a solution to a problem nobody actually has. The other one thinks that's just renaming the problem: now you owe us an account of where the report's likelihood comes from, whether it's the right kind of thing to condition on, and whether it stays fixed as your other credences move — at which point you're back where you started, just with extra steps.

  So: if you had our three years, which open questions here would you actually put people on, and in what order? I don't want a survey — I want the reasoning. Which of these is upstream of which, which are tractable with tools we already have versus needing something new, which would change what the rest of the area does if it got settled, and which of the threads above (or ones I haven't listed) are overrated and should just be left alone. And be straight with me about whether the "it's just noisy evidence, condition on the report" move collapses the agenda or merely relocates it — if it relocates it, tell me where to, because that's probably where the postdocs should go.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Context:**
      *   **User:** Runs a small formal epistemology group (3 senior + 1 incoming PhD).
      *   **Resources:** Soft money for 2 postdocs for 3 years.
      *   **Focus:** Probabilistic updating, specifically *uncertain evidence* (Jeffrey Conditionalization, Probability Kinematics, etc.).
      *   **Current State:** Stuck on "loose threads" (order dependence, rigidity, partitions, justifications, old evidence) and an internal debate (Jeffrey vs. "Condition on the Report").
      *   **Request:** A prioritized research agenda (what to work on, in what order, why). Needs reasoning about upstream/downstream relationships, tractability, impact, and a verdict on the internal debate.
      *   **Tone:** Direct, expert, strategic, no fluff/surveys.

  2.  **Deconstruct the Internal Debate (The "Fork"):**
      *   *Side A (Jeffrey/Kinematics):* Uncertain evidence is a direct constraint on credences ($P_{new}(E) = p$). Rigidity ($P_{new}(H|E) = P_{old}(H|E)$) is key.
      *   *Side B (Standard Conditioning/Noisy Report):* Uncertain evidence is actually certain evidence of a *sensory experience* or *report* ($R$). You condition on $R$. $P_{new}(H) = P_{old}(H|R)$.
      *   *The Crux:* Side B claims Jeffrey is unnecessary. Side A claims Side B just pushes the problem back (where do likelihoods $P(R|H)$ come from? do they stay rigid?).
      *   *My Verdict:* Side B is technically correct in a fully specified Bayesian model, *but* Side A identifies the real computational/epistemic bottleneck. We rarely have access to the full likelihood structure of our sensory reports. We *do* have direct access to how confident we feel. Therefore, the "Condition on Report" move *relocates* the problem to the modeling of the likelihood function $P(R|H)$. If that likelihood function is derived from the same uncertain intuition Jeffrey tries to capture, the problem hasn't vanished; it's just hidden in the likelihood specification.
      *   *Strategic Implication:* Don't pick a side. Treat the relationship between the two as the primary research object.

  3.  **Evaluate the "Loose Threads":**
      *   *Order Dependence:* Serious problem for Jeffrey. If updates don't commute, the theory is unstable for sequential learning. High priority.
      *   *Rigidity:* Is it normative or descriptive? If it's just a convention, Jeffrey loses normative force. High priority.
      *   *Partitions:* Real evidence rarely fits neat partitions. This limits applicability. Medium priority (technical fix possible).
      *   *Justifications (Accuracy/Dutch Book):* Do they support Jeffrey or only Conditioning? Crucial for normative status. High priority.
      *   *Old Evidence:* Interesting, but maybe tangential to the core mechanics of uncertain evidence. Lower priority for a 3-year grant focused on updating.
      *   *"Condition on Report":* As analyzed above, this is the meta-question.

  4.  **Determine Upstream/Downstream Relationships:**
      *   *Upstream:* What is the *normative status* of the update rule? (Justifications, Rigidity). If Jeffrey isn't normatively distinct from Conditioning, the rest matters less.
      *   *Midstream:* How does it behave sequentially? (Order dependence, Commutativity). If it breaks here, it's not a viable dynamic theory.
      *   *Downstream:* Applications (Old Evidence, Partitions, Specific Domains).
      *   *The "Report" Debate:* This is foundational. It needs to be addressed first or in parallel, as it determines the formalism.

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Settle the Report vs. Jeffrey debate.
          2.  Fix Order Dependence.
          3.  Check Justifications.
          4.  Apply to Old Evidence.
          *Critique 1:* Too generic. "Settle the debate" isn't a research project. Need specific angles.

      *   *Attempt 2 (More Specific):*
          1.  Postdoc 1: Likelihood modeling for the "Report" view. Can we derive Jeffrey from Conditioning on Reports with specific likelihood structures?
          2.  Postdoc 2: Order dependence and commutativity. Can we fix it?
          3.  Group: Justifications.
          *Critique 2:* Better. But needs to be more strategic about *why*.

      *   *Attempt 3 (Refining the "Verdict"):*
          The "Condition on Report" move *relocates* the problem. It moves the epistemic burden from the *update rule* to the *likelihood specification*. This is the key insight. The agenda should focus on the *interface* between the two.
          *Priority 1:* The Reduction Project. Can Jeffrey be derived as a special case of Conditioning on Reports? (Diaconis & Zabell style, but updated).
          *Priority 2:* Sequential Stability. If we use Jeffrey, how do we fix order dependence? (Weighted averages? Geometric averaging?).
          *Priority 3:* Normative Foundations. Accuracy arguments for Jeffrey vs. Conditioning.

  6.  **Developing the Reasoning for Each Priority:**
      *   *Why Priority 1?* If Jeffrey reduces to Conditioning, the "loose threads" about Jeffrey's specific rules might be artifacts. If it doesn't reduce, we need to know why (what's the extra normative content?). This settles the internal fight.
      *   *Why Priority 2?* Even if Priority 1 fails, a non-commutative update rule is useless for science/learning over time. This is the biggest technical bullet to bite.
      *   *Why Priority 3?* Accuracy arguments are the current currency of formal epi. If Jeffrey doesn't score well there, it's dead in the water regardless of intuition.

  7.  **Addressing the "Overrated" Threads:**
      *   *Old Evidence:* It's a problem for *all* Bayesianism, not specific to uncertain evidence. Don't waste soft money on it unless it's a specific hook.
      *   *Partitions:* This is mostly technical messiness. Generalizing to sigma-algebras is known work. Don't make it a core pillar.

  8.  **Finalizing the Structure:**
      *   **The Verdict:** Start with the internal fight. It's the bottleneck.
      *   **Phase 1 (Year 1): The Reduction & Likelihood Problem.** (Postdoc 1).
      *   **Phase 2 (Year 2): Sequential Dynamics.** (Postdoc 2).
      *   **Phase 3 (Year 3): Normative Unification.** (Group effort).
      *   **What to Drop:** Old Evidence, pure partition technicalities.
      *   **Tone Check:** Keep it sharp. "Here is the hard truth."

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to mention *Wagner* and *Diaconis & Zabell*. They are the giants here. The user knows them, but acknowledging them shows competence.
      *   *Correction:* Be careful about "Rigidity." It's often the point of failure. Make sure the agenda targets *when* rigidity holds, not just *if*.
      *   *Correction:* The "Condition on Report" view is essentially the *Bayesian Model of Sensory Uncertainty*. Connect it to cognitive science/psychophysics? Maybe too far afield. Stick to formal epi.
      *   *Key Insight:* The "Report" view requires a likelihood $P(Report|World)$. Where does that come from? It comes from *past calibration*. This links uncertain evidence to *calibration* and *reliability*. That's a fresh angle.

  10. **Final Polish:** Ensure the distinction between "relocating" and "collapsing" is clear. (It relocates). Ensure the order of operations makes sense (Foundations -> Dynamics -> Normativity).

  *(Self-Correction on the "Condition on Report" verdict)*: I need to be precise. If I condition on "It looks like E to degree p", I need $P(\text{Looks like E to degree p} | H)$. This is the *likelihood of the experience*. Jeffrey says I don't need that; I just need the new probability of E. The "Report" advocate says you *implicitly* used that likelihood. The research question is: Is the implicit likelihood recoverable? Is it stable? This is the "Likelihood Recovery Problem."

  Okay, ready to write. The structure will be:
  1.  Direct verdict on the internal fight.
  2.  The 3-Year Agenda (Phased).
  3.  What to ignore.
  4.  Why this order.
