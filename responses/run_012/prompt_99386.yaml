      *   *Anti-Classification (Colorblindness):* Don't use race. Focus on individual merit/risk.
          *   *Prediction:* Ban race inputs. Ignore group outcomes.
      *   *Calibration (Predictive Parity):* A score of 7 means 70% risk for everyone.
          *   *Prediction:* Ensure $P(Y=1 | Score=s, Group=A) = P(Y=1 | Score=s, Group=B)$.
      *   *Equalized Odds (Error Rate Balance):* False Positive Rates (FPR) and False Negative Rates (FNR) equal across groups.
