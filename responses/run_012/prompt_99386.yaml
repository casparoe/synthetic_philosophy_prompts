      *   *Demographic Parity (Equal Outcomes):* Selection rates equal across groups.
          *   *Prediction:* $P(\hat{Y}=1 | A) = P(\hat{Y}=1 | B)$. (Not explicitly in the prompt's policy, but relevant context).
      *   *Procedural Justice:* The process looks fair, regardless of outcome.
      *   *Pluralism/Contextualism:* Different fairness metrics matter in different contexts.
      *   *The "County's" View (The Puzzle):* They claim all three. This suggests *Symbolic Compliance* or *Bureaucratic Pluralism* (satisfying different stakeholders without doing the hard math).

  3.  **Analyzing the Mathematical Conflict (The Impossibility Theorem):**
      *   Reference: Chouldechova (2017), Kleinberg et al. (2016).
      *   Condition: If Base Rates ($P(Y=1|A)$) differ between groups, you cannot have both Calibration and Equalized Odds (Error Rates).
