      *   *Individual vs. Group:* Input is individual (anti-classification), Audit is group (error rates). This is a hybrid. It treats individuals as bearers of risk but groups as bearers of justice.
      *   *Base Rates:* The policy ignores the base rate reality. By demanding both calibration and equal error rates, it *implicitly* assumes base rates *should* be equal or treats the discrepancy as noise/error rather than structural fact. Or, it's simply incoherent.
      *   *Ontology:* Calibration assumes "risk" is a real property (frequentist probability). Error rates assume the *consequence* of the decision is what matters.
      *   *Compatibility:* Banning race input is compatible with many views (libertarian, egalitarian, etc.). The conflict arises in the *audit* metrics.
      *   *Swapping Views:* If we prioritize Error Rates, we drop Calibration. Scores mean different things for different groups. Public messaging changes from "This score means X% risk" to "This score places you in a bucket with similar error profiles."

