      *   Assumptions (independence, unbiasedness, target, stability)? Yes.
      *   Failure modes? Yes.
      *   Material vs. Immaterial? Yes.
      *   Verdict on conclusion? Yes.
      *   Better analogy? Yes.
      *   Evidence to move me/My errors? Yes.

