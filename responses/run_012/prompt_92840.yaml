      *   Key Distinction: Epistemic (truth-tracking) vs. Aggregative (preference) voting.

  11. **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address "stability of instruments"? Yes, voter competence fluctuates.
      *   *Check:* Did I separate material/immaterial disanalogies? Need to make sure this section is distinct.
      *   *Check:* Is the verdict plain? Yes.
      *   *Check:* Is the meta-cognition honest? Avoid feigned humility, but acknowledge genuine uncertainty.

  12. **Final Review against constraints:**
