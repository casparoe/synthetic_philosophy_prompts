prompt: |-
  I'm sitting in on a bioethics seminar and the instructor keeps handing out this one summary of Savulescu's principle of procreative beneficence. I think its from a trade book — no author given, just a chapter called something like "Designer Babies" — and it reads like this:

  Savulescu's principle of procreative beneficence says that parents are morally required to have the child with the best possible life. Since genes strongly shape how a life goes, this means parents ought to use whatever genetic technology they can get their hands on — embryo screening now, gene editing soon — to make their kids healthier, smarter, and happier. The argument is a consistency argument: if you wouldn't knowingly give your child a disease you could prevent, you can't turn around and object to improving them. It's a version of liberal eugenics: liberal because it's voluntary and doesn't hand the reins to the state, but eugenic all the same, since the aim is still to improve the genetic stock of the next generation. The main objection is the disability-rights expressivist objection, which says that selecting against disability expresses the judgment that disabled lives are worth less. But that objection falls apart once you bring in the non-identity problem: the child who would have been selected for disability never exists, so nobody is harmed, and there's nobody for the selection to have wronged. So the only real question left is how good the technology has to get before the obligation bites.

  I want an accuracy audit, not a vibe check. Put on your procreative-ethics hat — you know this literature the way a specialist does — and go through it sentence by sentence: what Savulescu or a careful defender would happily accept, what they'd call a distortion and why, and what's just wrong. I'm most suspicious of the expressivist bit, because the non-identity reply sounds airtight to me and that's exactly why I don't trust it — so slow down there and tell me whether it really does the work it's advertised as doing. Start by listing the claims the paragraph commits itself to, then work down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

