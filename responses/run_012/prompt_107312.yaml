  # Tutorial Session: The Fluidity of Concepts
  **Time:** 60 Minutes
  **Participants:** 14 Students (2 Teams of 7: Team Alpha & Team Beta)
  **Materials:** 
  - 28 Sheets of Paper (A5 half-sheets).
  - 14 Pens (Black).
  - 20 Small Paper Tokens ("Concept Credits").
  - 1 Bag of Beads (or printed circles: Black, White, Half) — *Optional, drawing is faster.*
  - **Instructor Kit:** A sealed envelope labeled "The Truth" (contains the official move list), and a set of "Scenario Cards."

  ---

  ## Part 1: Setup & Calibration (00:00 – 00:10)

  **Layout:** 
  Arrange tables into two distinct islands. Team Alpha on the left, Team Beta on the right. You stand in the middle. Do not mention "concepts," "rules," or "fluidity."

  **Instructions:**
  1.  **The Game:** "You are engineers designing a pattern generator. You will see sequences of beads (Black, White, Half). Your job is to predict the next step in the sequence."
  2.  **The Moves:** Hand each team a **Move Menu** (identical for both).
      *   *Move 1 (Advance):* Change the last bead (B→W→H→B).
      *   *Move 2 (Duplicate):* Copy the first bead to the very front.
      *   *Move 3 (Reverse):* Swap the order of the two longest runs of identical beads.
      *   *Move 4 (Insert):* Add one bead (color of the first bead) immediately after the first run.
  3.  **Calibration Round:** Project (or write on board) one sequence: `[B] → [B B]`.
      *   Ask both teams to write down the *next* step.
      *   They will likely agree (`[B B B]`).
      *   **Scoring:** Award 1 Concept Credit to any team that can cite which Move from the Menu produced the result. (Goal: Establish that Moves are the "law".)

  ## Part 2: The Divergence Round (00:10 – 00:30)

  **The Trap:**
  Hand each team a **Scenario Card**. The card contains two examples of a "System" in action. The examples are carefully chosen to support two different Moves equally well.

  *   **Example 1:** `[B] → [B B]`
  *   **Example 2:** `[W] → [W W]`
  *   **Target:** `[B W] → ?`

  **The Conflict:**
  *   **Team Alpha** is instructed (via a secret note on their card) to prioritize **Move 2 (Duplicate Front)**.
      *   Logic: Copy the first bead to the front.
      *   Prediction for `[B W]`: `[B B W]`.
  *   **Team Beta** is instructed (via a secret note on their card) to prioritize **Move 4 (Insert After First Run)**.
      *   Logic: Insert a bead (color of first) after the first run.
      *   *Note:* In Examples 1 & 2, the "First Run" is the whole row. So Inserting After First Run is identical to Duplicating Front.
      *   Prediction for `[B W]`: The first run is `B`. Insert `B` after `B`. Result: `[B B W]`.
      *   *Wait, this converges.* I need them to diverge.
      *   *Correction for Beta:* **Move 4 Variant:** "Insert a bead of the color of the **last** bead immediately **before** the last run."
      *   *Check Examples:* 
          *   `[B]`: Last run B. Insert B before B. → `[B B]`. (Matches).
          *   `[W]`: Last run W. Insert W before W. → `[W W]`. (Matches).
      *   *Target:* `[B W]`. Last run is `W`. Insert `W` before `W`.
      *   *Prediction:* `[B W W]`.

  **Activity:**
  1.  Teams have 5 minutes to analyze their Examples and agree on the "System Rule."
  2.  They write their prediction for the Target on a large sheet of paper.
  3.  **Reveal:** Stick both predictions on the wall.
      *   Alpha: `[B B W]`
      *   Beta: `[B W W]`
  4.  **The Judge:** Select one student from each team to swap places. They are now "Auditors." They must visit the opposing team and ask: "Which Move from the Menu justifies this?"
  5.  **Scoring:** Award 2 Concept Credits if the Auditors confirm the opposing team's rule is *valid according to the Menu*, even if the result is different. (This rewards principled divergence, not correctness).

  ## Part 3: The Recoding Round (00:30 – 00:45)

  **The Shift:**
  Announce: "The hardware has changed. We no longer see colors. We only see **Run Lengths**."
  *   `[B B W]` becomes `2, 1`.
  *   `[B W W]` becomes `1, 2`.
  *   `[B]` becomes `1`.
  *   `[B B]` becomes `2`.

  **Task:**
  1.  Give teams the Run-Length history of their own sequence.
      *   Alpha History: `1 → 2 → ?` (Target `2, 1`)
      *   Beta History: `1 → 2 → ?` (Target `1, 2`)
  2.  Ask them to find a *mathematical* rule for the numbers that fits their history.
      *   Alpha might say: "Add 1 to the first number." (`1→2`, `2→3`... wait, target is `2,1`).
      *   *Correction:* Alpha's Bead Rule was "Duplicate Front". In Run-Lengths: `1 → 2`. `[B W]` is `1, 1`. Duplicate Front (B) makes it `2, 1`.
      *   Beta's Bead Rule was "Insert Before Last". `[B W]` is `1, 1`. Insert W before W makes it `1, 2`.
  3.  **The Twist:** Hand them a **New Recoding Card**: "Color Invariance."
      *   Treat Black and White as the same symbol `X`.
      *   Alpha's `[B B W]` → `X X X` (Length 3).
      *   Beta's `[B W W]` → `X X X` (Length 3).
      *   **Question:** "Does your rule still hold if we ignore color?"
      *   Alpha's Rule (Duplicate Front): Depends on color identity? No, just length.
      *   Beta's Rule (Insert Before Last): Depends on run boundaries.
  4.  **Scoring:** 3 Concept Credits to the team that can identify which of their rules *breaks* under the new recoding and which *survives*. (Answer: Both survive as length increases, but the *structural description* changes).

  ## Part 4: The Debrief (00:45 – 00:60)

  **Do not start with theory.** Start with their experience.

  **Minute 45-50: The Discovery**
  *   **Ask:** "When you saw the other team's answer in Round 2, did you think they were wrong?" (Most will say yes).
  *   **Ask:** "Did the Auditor find a rule in the Menu that supported them?" (Yes).
  *   **Point:** "You just experienced **Underdetermination**. The data (Examples 1 & 2) did not force one rule. It supported two. You didn't make a mistake; you made a *choice* about which regularity to prioritize."

  **Minute 50-55: Principled Slippage**
  *   **Ask:** "Was Team Beta sloppy?" (No, they followed Move 4).
  *   **Point:** "Conceptual slippage isn't noise. It's the result of applying a different, equally valid principle. Alpha prioritized 'Front-ness'. Beta prioritized 'Run-Boundary-ness'. Both are real features of the world."
  *   **Connect:** "This is why categorization is fluid. If I categorize by 'Front', you are in my group. If I categorize by 'Run-Boundary', you are not. Neither is the 'true' category."

  **Minute 55-60: Representation Invariance**
  *   **Ask:** "In Round 3, did the rule change when we changed the notation?"
  *   **Point:** "Some concepts are tied to the representation (Color). Some are structural (Run Length). A 'fluid concept' is one that can survive recoding, but its *extension* (who is in the group) might shift."
  *   **Close:** "You felt the rule didn't fix the extension. You felt the divergence was principled. That feeling is the definition of a fluid concept."

  ---

  ## Anticipated Failures & Fixes

  **Failure 1: The "One Right Answer" Hunt**
  *   *Symptom:* Students raise hands in Round 2 asking, "But which one is the *real* rule?" or "Is there a trick?"
  *   *Fix:* Do not answer. Say: "The Menu is the law. If your rule is in the Menu and fits the Examples, it is legal. I am not the judge of truth, only of consistency."
  *   *Why:* This forces them to accept validity without correctness.

  **Failure 2: The Judge Collapses to Majority Rule**
  *   *Symptom:* The Auditor says, "Well, Team Alpha has more people, so their rule is better."
  *   *Fix:* Intervene immediately. "The Auditor's job is not to vote. It is to verify the *derivation*. Can you trace the Move? Yes or No. If Yes, they get the Credit."
  *   *Why:* This reinforces that validity is structural, not democratic.

  **Failure 3: Recoding Confusion**
  *   *Symptom:* Students get stuck on the math of Run-Lengths and miss the point.
  *   *Fix:* Simplify. "Don't solve the math. Just tell me: If you erase the colors, does your rule still make sense?"
  *   *Why:* Keeps the focus on representation dependence, not arithmetic.

  ## What This Activity Cannot Do (Honesty Check)

  **The Limitation:**
  This activity simulates *rule ambiguity*, but it cannot fully simulate *contextual fluidity* (the way concepts shift based on goal or emotion). In the game, the goal is static ("Predict the next step"). In real life, concepts shift because *what we need them for* changes (e.g., "Is a tomato a fruit?" depends on if you are a botanist or a chef).

  **How to Supply This in Debrief:**
  In the final 5 minutes, explicitly state: "Today, your goal was fixed. In the real world, your goals change. When your goal changes, the 'principled regularity' you prioritize changes. That is why concepts are not just ambiguous, they are *adaptive*. You felt the ambiguity; now imagine that ambiguity shifting every time your needs change."

  ---

  ## Materials Checklist for Instructor Bag

  1.  **Move Menus (14 copies):** Clear list of the 4 moves.
  2.  **Scenario Cards (2 types):**
      *   *Alpha Card:* Examples `[B]→[BB]`, `[W]→[WW]`. Hint: "Focus on the **Front**."
      *   *Beta Card:* Examples `[B]→[BB]`, `[W]→[WW]`. Hint: "Focus on the **Last Run**."
  3.  **Recoding Sheets (14 copies):** Blank grids for writing Run-Lengths.
  4.  **Concept Credits:** 20 small paper squares.
  5.  **Auditor Badges:** 2 distinct stickers or papers to mark the swap students.

  ## The "Ambiguous Transition" Logic Check
  *   **Alpha Rule (Duplicate Front):**
      *   `[B]` → Add B to front → `[B B]`. (Matches).
      *   `[B W]` → Add B to front → `[B B W]`.
  *   **Beta Rule (Insert Color-of-Last Before Last-Run):**
      *   `[B]` → Last Run is B. Color is B. Insert B before B → `[B B]`. (Matches).
      *   `[B W]` → Last Run is W. Color is W. Insert W before W → `[B W W]`.
  *   **Divergence:** `[B B W]` vs `[B W W]`.
  *   **Validity:** Both are derivable from the provided Move Menu (with slight phrasing adjustment on Move 4 for Beta, which is permitted by the prompt "adjust or extend this menu").

  *Note to Instructor:* Ensure Move 4 on the Beta Menu is printed as: *"Insert one extra bead, of the color of the **last** bead, immediately **before** the last run."* Keep Alpha's Menu standard. This creates the divergence without lying about the logic.
