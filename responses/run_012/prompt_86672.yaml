  Summary verdict
  The practice presupposes a pragmatic hybrid of compatibilism and existential responsibility. It treats addiction as a causal constraint (disease) while insisting that engagement with recovery remains a locus of uncaused choice. This is metaphysically tense but clinically coherent. It avoids the nihilism of hard determinism without invoking the metaphysical extravagance of radical libertarian freedom. The coherence relies on distinguishing between the condition (disease) and the response (responsibility). However, the discharge criteria imply a level of control that the disease model theoretically undermines. The practice is consistent enough to function therapeutically, leveraging the disease model to reduce shame and the responsibility model to induce agency. It is philosophically messy but clinically potent.

  The implicit theory of freedom
  The implicit theory of freedom is not Sartrean radical freedom, which denies facticity's weight, nor is it hard determinism. Instead, it posits a "bounded agency." The brain disease constitutes the facticity—the givens of craving, trigger, and neurobiology. However, the practice assumes a residual capacity to authorize actions within these constraints. This is closer to compatibilism: freedom is not the absence of causation but the ability to act according to higher-order desires (sobriety) despite lower-order impulses (craving). Yet, the requirement to write "I chose" pushes beyond standard compatibilism toward a therapeutic existentialism. It assumes that even if the craving is determined, the acknowledgment and management of the craving are not.

  The practice treats the self as a manager of the brain. The "choice" is often reframed not as the choice to use versus not use in the moment of intoxication, but the choice to prepare, to avoid triggers, and to engage with treatment. However, the discharge policy suggests that the resident could have done otherwise regarding their engagement. This implies an agent who stands outside the causal chain of their addiction enough to be held accountable for their participation in the cure. The theory assumes that while the disease may compel use, it does not compel non-compliance with treatment. This divides the self into the "addicted brain" (determined) and the "treating agent" (free). The resident is viewed as a pilot flying a damaged plane; the plane may malfunction (disease), but the pilot is responsible for navigating the emergency (responsibility). This view preserves moral accountability without denying medical reality, creating a functional space for intervention where neither pure medicine nor pure morality could operate alone.

  The implicit theory of self-deception
  For the bad faith inventory to make sense, self-deception must be an active verb, not a passive state. It presupposes that the resident knows the truth deep down but constructs narratives to obscure it. This is distinctly Sartrean: bad faith is lying to oneself to escape the anguish of freedom. If denial were merely a neurobiological symptom (anosognosia), an inventory would be useless; you cannot inventory a lesion. The practice assumes denial is a strategy. The resident tells themselves "just one" not because their brain misfires, but because they want to use and wish to avoid the label of "user." This requires a self that is transparent to itself yet chooses opacity.

  The "choice journal" reinforces this by forcing the first-person active voice. It collapses the distance between the event and the agent. If self-deception were purely causal, the journal would be a record of symptoms. By making it a confession of choice, the practice treats self-deception as a moral failure of authenticity rather than a clinical symptom of pathology. It assumes the resident has access to their true intentions but actively suppresses them. The inventory demands that residents identify the specific moment they decided to deceive themselves. This implies that consciousness is always present, even in addiction. The practice operates on the belief that the lie is maintained by effort, and therefore, the truth can be recovered by ceasing that effort. Self-deception is thus viewed as a project of avoidance, something the resident is doing, rather than something happening to them.

  Strict presuppositions versus mere fits
  Strict presuppositions: The practice strictly requires that treatment engagement is voluntary. If residents literally cannot choose to engage, discharge for non-compliance is cruel and incoherent. It also requires that self-deception is interruptible by reflection. The discharge criteria strictly presuppose a capacity for voluntary compliance that the disease strand complicates. The staff instruction to reject "inability" presupposes that ability is present but withheld. This is not required by the disease model, which might see inability as genuine. Thus, the responsibility strand strictly presupposes a level of control that the disease strand theoretically denies.

  Mere fits: The disease model fits the contingency management (vouchers for clean urine) because behaviorism works regardless of metaphysics. The language of "triggers" fits determinism well. The MAT justification fits the disease model but clashes with radical freedom (why medicate a free choice?). The choice journal fits Sartreanism but is merely compatible with compatibilism (you can choose compatibly). The protocol uses the disease model to explain cravings (fit) and the responsibility model to explain relapse (presupposition). The intake forms likely list diagnosis (disease) but also sign contracts (responsibility). The contract strictly presupposes freedom; the diagnosis merely fits a medical framework. The group sessions use disease language to normalize struggle (fit) but responsibility language to demand change (presupposition). The practice could survive without the disease language if it adopted a pure moral model, but it could not survive without the responsibility language if it wishes to maintain discharge criteria for non-engagement.

  Rival theories that would also license the practice
  Compatibilism licenses the practice best. It allows addiction to be caused while maintaining that residents are responsible if they act according to their sober values. It explains why MAT is valid (aligns biology with values) and why responsibility is required (you can still act on values). A divided-self view also works: the "addict" is determined, the "healthy self" is free. Treatment empowers the healthy self. This explains the tension without contradiction. The resident is told to starve the "addict self" and feed the "healthy self."

  Hard determinism would not license the responsibility strand; it would require removing discharge criteria and choice journals, focusing solely on environmental control. Residents would never be discharged for "failure," only transferred for "safety." Pure Sartrean existentialism would reject the disease model entirely, viewing "addiction" as a bad faith label to escape responsibility. It would forbid MAT as "cheating" on freedom. The current practice is a stable equilibrium between compatibilism and divided-self views, avoiding the extremes of pure determinism or pure existentialism. It uses the disease model to reduce shame (it's not your fault you crave) and the responsibility model to induce effort (it is your fault if you don't fight). A purely medical model would fail to motivate; a purely moral model would induce too much shame. The hybrid leverages the strengths of both rival theories while ignoring their metaphysical incompatibilities.

  Internal tensions
  The primary tension is ontological. Relapse is defined as a "symptom" (passive, medical) and a "choice" (active, moral) simultaneously. This creates confusion during clinical reviews. If a resident relapses due to sleep loss (predictable consequence), how is it also a bad faith choice? The staff instruction to reject "inability" contradicts the chronic disease designation, which implies progressive loss of control. Discharging a patient for "failure to engage" when their file cites "chronic relapsing brain disease" risks punishing them for the very condition they are treating.

  There is a tension between shame reduction (disease model) and shame induction (responsibility model). The disease model says "you are sick," which reduces blame. The responsibility strand says "you are lying," which increases blame. This oscillation can be therapeutic (preventing complacency) but risks destabilizing residents who cannot reconcile the two identities. The protocol asks residents to be patients when convenient (MAT, triggers) and agents when convenient (journals, discharge). This instrumental switching is clinically useful but philosophically inconsistent. Residents may feel gaslit when staff switch between "you can't help it" and "you chose this." The tension is managed by timing: disease language is used during crisis (relapse), responsibility language during stability (planning). However, the discharge criteria remain a flashpoint where the two theories collide不可 reconcilably.

  What would change under a replacement view
  Under thoroughgoing determinism, intake forms would remove "choice" language, focusing on risk factors and environmental constraints. Group sessions would analyze causal chains, not moral failures. Discharge criteria would vanish; residents would only leave when safety is compromised, not for "failure to engage." Language would shift from "denial" to "lack of insight due to pathology." Staff would not challenge "inability" but would adjust the environment to accommodate it. MAT would be standard, not negotiated.

  Under a full Sartrean view, intake would reject the disease label entirely. Groups would focus on authenticity and owning one's project. MAT might be framed as a tool for freedom, not disease management. Discharge would be for "bad faith" rather than "non-compliance." The choice journal would remain but without the disease context. The current hybrid would dissolve into either a medical management model or an existential coaching model. The specific tension of "diseased choice" would disappear, replaced by either "managed pathology" or "authentic existence." The vouchers would remain in both, as behavior is observable. However, the justification would change: determinism views vouchers as conditioning; Sartreanism views them as supporting a free project. The core change is in the locus of blame: determinism removes it; Sartreanism maximizes it; the current practice oscillates between them.

  Bottom line
  The program operates on a clinically effective but philosophically unstable hybrid. It leverages the disease model to mitigate shame and the responsibility model to motivate change. While metaphysically inconsistent, this inconsistency serves a therapeutic function: it prevents residents from hiding behind biology while preventing them from drowning in guilt. To stabilize it, the program should explicitly adopt a compatibilist framework, acknowledging that causation does not negate responsibility. This would align the discharge criteria with the disease model by framing engagement as a capacity that remains intact despite the illness.
