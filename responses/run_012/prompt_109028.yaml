answer: |-
  ### The Structural Failure of Indirect Normativity

  The target of this argument is the strongest form of **Indirect Normativity**. This is the view that normative truths are not fundamental features of the universe but are instead constituted by the verdicts of an idealized procedure. On this view, the claim "Agent $A$ ought to do $X$" is true if and only if an idealized deliberator $D$, operating under specific construction parameters $P$, would endorse $A$ doing $X$. The attractiveness of this view is clear: it promises to secure the objectivity of morality without positing metaphysically queer moral facts. It grounds the "ought" in a "would"—in the stable output of a rational process—thereby naturalizing normativity while preserving its authority.

  This argument demonstrates that this project is structurally impossible. It fails not because of contingent errors in specific formulations, but because of a dilemma inherent in the relationship between **construction parameters** and normative output. Every account of indirect normativity succumbs to **leakage** or indeterminacy. There is no stable middle ground.

  #### The Dilemma: Leakage or Indeterminacy

  The dilemma turns on the specification of the **construction parameters**. These are the stipulations required to run the idealization: what the deliberator knows, how they aggregate attitudes, whether they are benevolent, impartial, or purely self-interested.

  **Horn 1: Leakage.** If the idealization yields a determinate, morally robust verdict (e.g., "torture is forbidden"), this verdict is entailed by the **construction parameters**. The normative content was supplied by the stipulations governing the deliberator, not generated by the deliberation itself. This is **leakage**. The idealization is a mirror, not a source.

  **Horn 2: Indeterminacy.** If the **construction parameters** are stripped of normative bias to avoid leakage—specified thinly enough to presuppose no moral content (e.g., purely logical consistency, full information)—the idealization fails to determine a unique verdict. A fully informed, logically consistent agent could endorse any number of incompatible normative systems. The account becomes silent on what to do.

  Consider two concrete constructions to see how this pincer movement operates.

  **Construction A: Hypothetical Choice.**
  Suppose normativity is fixed by what agents would choose behind a "veil of ignorance," unaware of their specific place in society.
  *   *Run for Leakage:* To ensure the agents choose egalitarian principles, the **construction parameters** must stipulate that agents are risk-averse or that they value primary goods in a specific hierarchy. If you stipulate that agents maximize expected utility and are risk-averse, the egalitarian outcome is mathematically entailed by the setup. The normative work is done by the parameter (risk-aversion/utility), not the choice. **Leakage** has occurred.
  *   *Run for Indeterminacy:* If you strip the parameters to pure rationality without stipulating risk-aversion or specific goods, a rational agent might choose a high-risk, high-reward society that permits slavery for the sake of greater aggregate wealth. The procedure does not rule this out. The account cannot condemn slavery. Indeterminacy prevails.

  **Construction B: The Ideal Observer.**
  Suppose normativity is fixed by the reactions of a spectator who is fully informed and impartial.
  *   *Run for Leakage:* To ensure the observer condemns cruelty, the parameter of "impartiality" must be defined as "giving equal weight to the interests of all." But "giving equal weight" is itself a substantive normative commitment. If you build egalitarianism into the definition of impartiality, you have leaked the conclusion into the premise. The observer's approval is authoritative only because we already accepted the normative parameter defining their gaze.
  *   *Run for Indeterminacy:* If "impartiality" is defined thinly as merely "lacking personal bias," the observer might impartially endorse a world where the strong flourish and the weak perish, provided the observer has no personal stake. Pure information and lack of personal bias do not necessitate benevolence. The verdict is indeterminate.

  In both cases, the normative force comes from the **construction parameters**, not the idealization. The idealization is inert machinery.

  #### The Failure of Transfer

  Even if one could somehow resolve the dilemma above and secure a verdict from the idealized deliberator, the account faces a second structural failure: **Transfer**. **Transfer** is the step from "the idealized agent would endorse $X$" to "the actual agent has reason to do $X$." A convergence result about idealized agents does not by itself yield **Transfer**.

  Standard attempts to bridge this gap presuppose what they mean to establish.
  1.  *Appeal to Rationality:* "You should do what the ideal agent would do because you are rational." This begs the question. If the ideal agent's verdict was secured via **leakage** (e.g., by stipulating benevolence), then "being rational" now means "being benevolent." You are asserting the normative conclusion as a definition of rationality.
  2.  *Appeal to Authority:* "The procedure itself is authoritative." Why? If the procedure is authoritative because it tracks truth, we have abandoned indirect normativity for direct realism. If it is authoritative because we constructed it to be so, we are back to **leakage**.
  3.  *Appeal to Approximation:* "You should approximate the ideal." Approximation is only a duty if the ideal is normative. If the ideal is just a hypothetical state of affairs (a person thinking hard), there is no reason to approximate it unless you already accept the norms that the person is thinking about.

  **Transfer** fails because the gap between the hypothetical and the actual can only be bridged by a normative principle. But if indirect normativity is true, all normative principles must be derived from idealization. Thus, the bridge to **Transfer** requires a norm that the theory forbids.

  #### Evaluating Escape Routes

  Defenders of indirect normativity typically attempt three escape routes. All fail.

  **1. The Self-Specifying Response.**
  *Claim:* The correct **construction parameters** are not stipulated by us but are themselves those that the idealized deliberator would select. The idealization chooses its own rules.
  *Refutation:* This generates a regress. To select the parameters, the deliberator must already operate under some prior normative standard to judge which parameters are "good." If they choose parameters that lead to cruel outcomes, are they wrong? If yes, there is a standard prior to the idealization. If no, the idealization is arbitrary. You cannot use a procedure to validate the parameters of the procedure without circularity.

  **2. The Innocent Parameters Response.**
  *Claim:* **Leakage** is tolerable because the parameters are normatively innocent (e.g., logical consistency, full information). They are merely descriptive constraints.
  *Refutation:* As shown in the dilemma, descriptive constraints do not yield normative verdicts. Logical consistency does not forbid torture. Full information does not necessitate benevolence. If the parameters are truly innocent, the output is indeterminate. If the output is determinate, the parameters were not innocent. There is no category of "normatively innocent parameter that necessitates a moral verdict."

  **3. The Organizational Response.**
  *Claim:* The account is not meant to generate first-order verdicts from scratch but to organize and systematize the normative intuitions we already have (Reflective Equilibrium).
  *Refutation:* This surrenders the core claim of indirect normativity. If the procedure is only a tool to organize pre-existing intuitions, then the source of normativity is the intuitions, not the idealization. The idealization is reduced to a heuristic device. It no longer *fixes* what an agent ought to do; it merely reflects what we already think they ought to do. This is not a ground of normativity; it is a mirror.

  #### Conditions for the Argument's Failure

  For this argument to fail, a proponent of indirect normativity would need to demonstrate the existence of a set of **construction parameters** that satisfies two mutually exclusive conditions:
  1.  The parameters must be purely descriptive or procedural, containing no substantive normative commitments (to avoid **leakage**).
  2.  The parameters must logically necessitate a specific, substantive normative output when processed by the idealized agent (to avoid indeterminacy).

  In other words, success requires a "Normative Vacuum Engine": a machine that takes in only facts and logic and outputs values without any valve allowing values to enter. This is not merely difficult; it is conceptually incoherent. It requires deriving an 'ought' from an 'is' via a complex mechanism, but the complexity of the mechanism does not change the logical type of the input. Unless one can show how a purely factual constraint (e.g., "knows all physics") entails a normative constraint (e.g., "values pleasure"), the dilemma stands. I assess this as unachievable. The gap between the descriptive setup and the normative output is unbridgeable without **leakage**.

  #### What Remains: Direct Normativity and Coherence

  If indirect normativity fails, we are not left with quietism or nihilism. We are left with **Direct Normativity**.

  The failure of indirect normativity implies that normative truths are not constituted by procedures. Instead, substantive normative claims (e.g., "pain is bad," "promises create obligations") are brute facts of the normative domain. They do not need to be grounded in the verdicts of an ideal observer to be real. We should accept that we have direct access to normative reasons, just as we have direct access to logical or mathematical truths.

  Does anything in the vicinity of indirect normativity survive the dilemma?
  *   **Coherence Requirements:** Yes, but with reduced scope. We can maintain that agents ought to be coherent (non-contradictory in belief and intention). This survives because coherence is a formal requirement, not a generator of content. It tells you how to hold your norms, not what they are. It escapes the dilemma because it does not claim to generate first-order verdicts from the idealization.
  *   **Contractualist Procedures:** These survive only as heuristics for discovery, not as foundations for truth. Asking "what would others reject?" is a useful way to test our direct normative judgments, but the wrongness of the act is not *constituted* by the rejection. The rejection is evidence of the wrongness, which exists independently.
  *   **Shared Standpoints:** Claims about what is reasonable from a shared standpoint remain valid as descriptions of social coordination, but they cannot ground the obligation to be reasonable. The obligation to be reasonable must come from a direct normative truth (e.g., "it is wrong to impose unreasonable burdens"), not from the standpoint itself.

  Indirect normativity attempts to build a bridge from the non-normative to the normative. The bridge collapses because the materials used to build it—**construction parameters**—are either already normative (causing **leakage**) or insufficient to span the gap (causing indeterminacy). We must stop trying to build the bridge and acknowledge that we are already standing on the other side. Normativity is not a product of idealization; it is the light by which we see the ideal.
