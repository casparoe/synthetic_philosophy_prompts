prompt: |-
  Argue for a position. Do not survey the literature, do not assemble a taxonomy of views, and do not hedge into a both-sides conclusion. The position to argue for is this: every account of indirect normativity — every account that fixes what an agent ought to do by reference to what some idealized deliberator, idealized community, or idealized procedure would endorse — fails, and fails for a structural reason rather than a repairable defect. The core of the argument is a dilemma. Either the verdict of the idealization is authoritative because of how the idealization was constructed, in which case the normative content was supplied by the construction and the idealization itself is doing no independent work; or the idealization is specified thinly enough to presuppose no normative content, in which case it does not determine a unique verdict and the account is silent about what to do. Every intermediate position is unstable.

  To keep the argument sharp rather than gestural, work with the following stipulative vocabulary and treat it as fixed for the purposes of this prompt.

  Construction parameters: whatever you must stipulate in order to run an idealization at all — which facts the idealized deliberator is stipulated to know or to ignore, whether deliberation is constrained by coherence requirements on the agent's existing attitudes or is free to revise them wholesale, how the attitudes of multiple idealized agents are aggregated, whether the idealization is run once or iterated to a fixed point, and how it treats agents whose existence or preferences depend on the outcome being chosen.

  Leakage: the situation in which a verdict presented as an output of idealization is in fact entailed by one of the construction parameters. The claim to defend is that leakage is not a bug that better idealization theory will patch, but is unavoidable.

  Transfer: the further step from what an idealized agent would endorse to what an actual, non-ideal agent has reason to do. A convergence result about idealized agents does not by itself yield transfer. Argue that the standard moves at this step — appeals to the agent's own rationality, to the authority of the procedure itself, or to the value of approximating the ideal — each presuppose what they are meant to establish.

  The argument should have the following shape. First, state the target precisely enough that a defender would recognize it as their own view: choose the strongest form of indirect normativity you can, not a strawman, and say what makes it attractive in the first place. Second, run the dilemma against that form, using at least two concrete constructions — for instance a hypothetical-choice construction, an ideal-observer construction, or a convergence-of-inquiry construction — and show in each case exactly which construction parameter does the normative work. Third, take up the best escape routes and show why they fail: in particular the response that the idealization is self-specifying, so that the correct construction is itself whatever the idealization would select; the response that leakage is tolerable because the parameters are themselves normatively innocent; and the response that the account is not meant to generate first-order verdicts at all but only to organize ones we already have. Fourth, state as precisely as you can what would have to be true for the argument to fail — what a successful indirect-normativity account would have to look like — and be honest about whether you think that is achievable.

  Two constraints. Do not carry the argument by appealing to any particular author's formulation; if you need a target, construct it. And do not let the conclusion collapse into quietism: if indirect normativity fails, say what is left standing, and assess whether anything in the vicinity — a coherence requirement on the agent's own attitudes, a contractualist procedure, a claim about what is reasonable from a shared standpoint — survives the same dilemma or escapes it.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Analyze the Prompt:**
      *   **Task:** Argue for a specific position: Every account of indirect normativity fails for a structural reason (a dilemma).
      *   **Position:** Indirect normativity (fixing what an agent ought to do by reference to an idealized deliberator/community/procedure) is fundamentally broken.
      *   **Core Argument:** A dilemma.
          *   Horn 1: The idealization's verdict is authoritative because of its construction parameters $\rightarrow$ Leakage (normative content was already there).
          *   Horn 2: The idealization is specified thinly (no normative content) $\rightarrow$ Indeterminacy (doesn't determine a unique verdict).
          *   Intermediate positions are unstable.
      *   **Vocabulary:** Must use "Construction parameters" and "Leakage" as defined. Must address "Transfer" (from ideal to actual).
      *   **Structure:**
          1.  State the target (strongest form of indirect normativity).
          2.  Run the dilemma against two concrete constructions.
          3.  Address escape routes (self-specifying, innocent parameters, organizational role).
          4.  State conditions for the argument to fail (what success would look like) and assess achievability.
          5.  Conclusion: What is left standing? (Avoid quietism).
      *   **Constraints:** No surveying literature/taxonomies. No hedging/both-sides. No appealing to specific authors (construct the target). No quietism (say what survives).

  2.  **Deconstruct the Target (Indirect Normativity):**
      *   What is the strongest version? It's not just "what would I want if I knew more." It's the idea that normativity *just is* the output of a specific procedural idealization. It promises to ground normativity without positing spooky moral facts. It appeals to objectivity without metaphysical baggage.
      *   Let's construct a target view: "Procedural Realism." The claim is that $X$ is right iff an Ideal Deliberator $D$, constructed under parameters $P$, would choose $X$.

  3.  **Develop the Dilemma (Leakage vs. Indeterminacy):**
      *   *Horn 1 (Leakage):* To get a specific moral result (e.g., "don't torture"), you have to build specific constraints into $P$ (e.g., $D$ knows pain is bad, or $D$ is benevolent). If you do that, the work is done by the constraint, not the idealization. The idealization is a mirror.
      *   *Horn 2 (Indeterminacy):* If you strip $P$ down to pure logic/information (no normative bias), $D$ might choose anything consistent with logic. Why prefer utilitarianism over egoism? Pure information doesn't dictate ends.
      *   *Vocabulary Check:* Use "Construction parameters" and "Leakage."

  4.  **Select Concrete Constructions:**
      *   *Construction A: Hypothetical Choice (Rawlsian-ish but generalized).* Agent behind a veil of ignorance.
      *   *Construction B: Ideal Observer (Humean/Smith-ish).* Fully informed, impartial spectator.
      *   *Goal:* Show where the parameters leak in both.
      *   *For A:* The veil of ignorance is a parameter. Does it include "rational self-interest"? If yes, leakage (presupposes self-interest is rational). If no, indeterminacy (why choose principles at all?).
      *   *For B:* "Impartiality" is a parameter. Does it mean "equal weight to all interests"? If yes, leakage (presupposes egalitarianism). If no, indeterminacy (why not favor friends?).

  5.  **Address Transfer:**
      *   Even if $D$ chooses $X$, why should *I* (flawed agent) do $X$?
      *   Standard moves: "Because you are rational" (begs the question: what is rational?), "Because the procedure is authoritative" (why?), "Approximation" (approximating what normative standard?).
      *   *Vocabulary Check:* Use "Transfer."

  6.  **Address Escape Routes:**
      *   *Self-Specifying:* "The ideal deliberator chooses the parameters." Problem: To choose parameters, they need prior norms. Regress.
      *   *Innocent Parameters:* "Parameters are just logical, not normative." Problem: Logical constraints don't yield moral verdicts (Is-Ought gap equivalent).
      *   *Organizational/Reflective Equilibrium:* "It just organizes intuitions." Problem: Then it's not a *ground* of normativity, just a systematizer. It fails the core claim of indirect normativity (fixing what we ought to do).

  7.  **Conditions for Failure of the Argument (What Success Looks Like):**
      *   To defeat this argument, one needs a "Normative Vacuum" procedure. A set of construction parameters that is purely descriptive/logical yet necessitates a specific normative output without smuggling in the output as an input.
      *   Assessment: This is impossible. You cannot derive an 'ought' from an 'is' even via a complex machine.

  8.  **What Survives? (Avoiding Quietism):**
      *   If indirect normativity fails, do we have nihilism? No.
      *   Direct Normativity survives. Substantive moral truths (pain is bad) are brute.
      *   Coherence requirements survive *as* coherence requirements, not as generators of truth.
      *   Contractualism survives as a heuristic, not a foundation.
      *   The prompt asks to assess if these escape the dilemma.
      *   *Coherence:* Escapes because it doesn't claim to generate content, only constrain it.
      *   *Substantive Realism:* Escapes because it denies the need for idealization.

  9.  **Drafting - Section by Section:**

      *   *Introduction:* Define the target. "Procedural Grounding." The appeal is avoiding metaphysical queerness.
      *   *The Dilemma:* Define Leakage. Apply to Hypothetical Choice and Ideal Observer.
          *   *Case 1 (Choice):* Veil of ignorance. If it blocks specific knowledge to ensure fairness, "fairness" is leaked in. If it doesn't, outcome is indeterminate.
          *   *Case 2 (Observer):* Impartiality. If it means "equal weight," utilitarianism is leaked in. If it means "no bias," egoism is compatible.
      *   *Transfer:* Even if we solve the ideal, why does it bind the actual? The gap between "D would choose" and "I must do."
      *   *Escape Routes:*
          *   Self-specification (Regress).
          *   Innocent parameters (They aren't innocent).
          *   Organization (Surrenders the ground).
      *   *Conditions for Defeat:* Need a parameter set that is normatively inert but normatively productive. Impossible.
      *   *Aftermath:* Direct realism or non-procedural constructivism. Coherence remains valid as a negative constraint.

  10. **Refining and Polishing:**
      *   *Tone:* Assertive, philosophical, rigorous. No "some might say."
      *   *Vocabulary:* Ensure "Construction parameters," "Leakage," and "Transfer" are used precisely as defined.
      *   *Check Constraints:* Did I survey literature? No. Did I hedge? No. Did I name authors? No (keep it conceptual).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Is-Ought." I need to use the specific "Leakage" mechanism. The point isn't just derivation, it's that the *construction parameters* carry the weight.
      *   *Transfer:* Make sure to explicitly argue that the bridge from Ideal to Actual presupposes the normativity it tries to prove.

  11. **Final Review against Prompt:**
      *   Argue for the position? Yes.
      *   No survey/taxonomy? Yes.
      *   No hedging? Yes.
      *   Use stipulative vocabulary? Yes.
      *   Structure followed? Yes.
      *   Two concrete constructions? Yes (Hypothetical Choice, Ideal Observer).
      *   Escape routes addressed? Yes.
      *   Conditions for argument failure stated? Yes.
      *   No quietism? Yes.

  12. **Final Polish:** Check flow and intensity. Ensure the "dilemma" feels like a pincer movement. (Self-correction: Ensure the distinction between Horn 1 and Horn 2 is sharp. Horn 1 = Content is input. Horn 2 = Content is missing.)

  *(Self-Correction on "Transfer"):* The prompt defines Transfer as the step from ideal verdict to actual reason. I need to make sure I argue that standard moves here presuppose the conclusion.
  *(Self-Correction on "What survives"):* Be careful not to endorse a specific metaethics, but indicate the *type* of view that survives (Direct Normativity).

