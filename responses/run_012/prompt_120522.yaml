      *   *Interpreter B (Frame):* Let's call him **Marcus**. He focuses on the pragmatic force, the "how." He believes the significance lies in the illocutionary act (warning vs. instruction).
      *   *Dynamic:* Respectful colleagues, deep in the archives or a lab.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the artifact. Introduce the GEB terminology immediately to ground the discussion.
