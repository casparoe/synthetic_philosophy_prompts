          *   *Outer Message:* Shared background/context making the frame recognizable (e.g., cultural conventions, language competence).
          *   *Inner Message:* The decoded content (e.g., "Mix pigment X with Y").
      *   **Scenario:** Two interpreters examining a Bronze Age clay tablet (shipwreck).
          *   *Artifact:* Inscribed text, partially reconstructed language.
