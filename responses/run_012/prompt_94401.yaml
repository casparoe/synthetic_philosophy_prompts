  **Audit of the Passage**

  **Claim 1 & 2: Definitions and Copenhagen.**
  *Passage:* "Psi-epistemic... merely a compact way of writing down what someone knows... Copenhagen school naturally end up."
  *Audit:* **Wince.**
  *Reason:* The technical distinction (Harrigan & Spekkens) turns on whether distinct physical states correspond to overlapping distributions over the wavefunction, not necessarily subjective knowledge. "Knowledge" implies a knower; psi-epistemic models can be objective. Furthermore, Copenhagen is not unified; some versions deny the existence of an underlying ontic state entirely, rather than treating it as unknown.
  *Confidence:* 90%.

  **Claim 3: Psi-ontic implies Collapse and Observers.**
  *Passage:* "Psi-ontic... must also treat measurement as a physical disturbance that collapses... need an observer."
  *Audit:* **Reject Outright.**
  *Reason:* This is a fundamental error. Psi-ontology means the wavefunction is part of the physical furniture, not that it collapses. Many Worlds (Everett) is psi-ontic but denies collapse entirely. De Broglie-Bohm is psi-ontic but deterministic; the wavefunction guides particles without collapsing. Neither requires a fundamental observer. The author conflates psi-ontology with specific Collapse theories (like GRW).
  *Confidence:* 99%.

  **Claim 4: PBR and Bell Theorems.**
  *Passage:* "Pusey, Barrett and Rudolph proved... wavefunction must be real. Bell's theorem... destroys epistemic views."
  *Audit:* **Reject.**
  *Reason:* PBR proves the wavefunction is real *only if* one assumes 'preparation independence' (separately prepared systems have independent physical states). Models rejecting this (e.g., retrocausal or holistic models) remain psi-epistemic. Preparation independence assumes nature allows completely uncorrelated systems. If there are global constraints (e.g., cosmological), PBR fails. This is a significant loophole, not a minor technicality. Bell's theorem rules out *local* hidden variables, not epistemic views per se. Epistemic views can be non-local. The force of PBR is conditional, not absolute.
  *Confidence:* 95%.

  **Claim 5: The Closing Verdict.**
  *Passage:* "The live question is therefore not whether the wavefunction is real... dispute has been settled."
  *Audit:* **Reject.**
  *Reason:* Since psi-epistemic models survive by denying PBR assumptions, and psi-ontic models do not necessitate collapse, the landscape is wider than presented. The debate is not settled; it has shifted to which auxiliary assumptions (like preparation independence) are physically justified. The tidy story ignores viable alternatives.
  *Confidence:* 95%.

  **Confidence and Uncertainty**
  I am highly confident in the physical corrections regarding Many Worlds, Bohm, and the assumptions of the PBR theorem. These are standard results in foundations literature. The error in Claim 3 is particularly egregious, as it misclassifies the two most prominent realist alternatives to Copenhagen.

  **Least Sure Point:** I am least sure about the characterization of the "Copenhagen school." Because "Copenhagen" is historically nebulous and often used as a catch-all, asserting the author is wrong about where Copenhagenists "end up" relies on interpreting an ill-defined category. However, even charitably, the link between psi-epistemic and Copenhagen is not necessary, nor does it salvage the other errors.
