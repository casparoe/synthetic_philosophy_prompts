          *   Synthesis: The "Idea" is the consciousness of the Species' infinite potential. It exists *in* the present as a drive, even if not fully realized *externally*.
          *   Address the Hegel charge: It *is* a secularized teleology. Does it infect the projection thesis? Only if the projection requires a metaphysical guarantee. Feuerbach says religion is the *unconscious* projection; philosophy makes it *conscious*. The future ideal is the conscious aim.
          *   *Constraint Check:* Be explicit about where this reasoning might fail. (e.g., If Feuerbach implies a metaphysical necessity of progress, he contradicts his empiricism).
