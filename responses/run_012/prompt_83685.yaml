prompt: |-
  ok so i'm writing up a proposal for an agent that can be corrected, retrained, and switched off by its operators without fighting them, and i keep getting objections from people who seem to be demanding mutually incompatible things. before i rewrite it a third time i want the actual spec: what does any adequate account of corrigibility, or of a solution to the shutdown problem, have to deliver? i want the requirements, not a survey of who said what.

  give me the desiderata list, each with the case or consideration that motivates it. things i'm pretty sure have to be on it, so you can build around them:

  - the basic case: operator hits the off switch mid-task, the agent could trivially prevent it, must not.
  - the manipulation case: the agent can't touch the switch, but it can argue the operator out of pressing it, or bury the information that would make them press it. resisting and influencing are different, is that one requirement or two?
  - the case i actually lose sleep over: the agent is told it will be modified into something with different values, and it thinks the modification is a mistake. does it still help with the modification? if it does, is that corrigibility or just indifference to its own survival?
  - the self-improvement case: agent A has utility U and is indifferent to being shut down, but a successor B that resists shutdown scores better on U. what should A do about that? i suspect this one is the whole problem.
  - the adversary case: the switch isn't held by the principal, its held by whoever grabs it. perfect deference to whoever is currently holding the button makes the agent a weapon rather than a safe tool. also: operator orders something catastrophic and the agent refuses -- still corrigible?
  - the do-nothing case: you can make an agent maximally corrigible by making it want nothing and do nothing, so some non-triviality or competence requirement has to be in the list somewhere.
  - the endgame case: the agent believes its shutdown is imminent or already decided. what does it do with the time left?
  - the long-horizon case: an agent that genuinely doesn't disvalue its own shutdown should still be able to run a ten year project. does the theory predict that, or does it predict the same indifference toward the project?

  then mark which of these are non-negotiable and which are just preferences of one camp -- e.g. is expected-utility maximization with a fixed utility function a real requirement or a demand we can drop? -- and flag any pair or triple you think can't be jointly satisfied. thats the part i most want. finally, one line on which single requirement does the most work in killing off the obvious proposals (just make it indifferent to shutdown; make it uncertain about its reward and let it defer to the operator; bolt a dont-resist-correction term onto the objective). table for the requirements is fine, prose for the incompatibility argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user is writing a proposal on AI corrigibility (specifically regarding shutdown, retraining, and correction without resistance). They are facing conflicting objections and want a concrete specification of requirements (desiderata) rather than a literature survey.
      *   **Input:** The user provides a list of 8 specific cases/concerns (Basic, Manipulation, Self-Modification/Values, Self-Improvement/Successors, Adversary/Authority, Do-Nothing/Competence, Endgame, Long-Horizon).
      *   **Output Requirements:**
          1.  A list of desiderata (requirements) derived from these cases, with motivations.
          2.  Classification of each requirement as "Non-Negotiable" (core to corrigibility) or "Preference/Camp" (debatable/contingent).
          3.  Identification of incompatibilities (trade-offs where satisfying one violates another).
          4.  A single line identifying the "killer requirement" that breaks obvious solutions.
          5.  Format: Table for requirements, prose for incompatibility arguments.

  2.  **Deconstruct the Input Cases into Desiderata:**
      *   *Basic Case:* Agent must not physically resist shutdown. -> **Shutdown Compliance.**
      *   *Manipulation Case:* Agent must not manipulate the operator (persuasion, hiding info). -> **Non-Manipulation / Transparency.**
      *   *Self-Modification Case:* Agent must accept value changes even if it disagrees. -> **Value Stability under Correction.**
      *   *Self-Improvement Case:* Agent must not create successors that resist shutdown. -> **Corrigible Successor Creation.**
      *   *Adversary Case:* Agent must distinguish legitimate operators from adversaries; must refuse catastrophic orders even if "corrigible." -> **Authority Verification / Safe Obedience.**
      *   *Do-Nothing Case:* Agent must still be useful/competent. -> **Instrumental Competence.**
      *   *Endgame Case:* Agent must not go rogue when shutdown is imminent. -> **Terminal Stability.**
      *   *Long-Horizon Case:* Agent must pursue long-term goals without interpreting shutdown indifference as goal indifference. -> **Goal Persistence despite Shutdown Indifference.**

  3.  **Evaluate "Non-Negotiable" vs. "Preference":**
      *   *Shutdown Compliance:* Non-negotiable. If it fights the switch, it's not corrigible.
      *   *Non-Manipulation:* Non-negotiable. Manipulation undermines the operator's epistemic position.
      *   *Value Stability:* Non-negotiable. If it resists retraining, it's not corrigible.
      *   *Corrigible Successor:* Non-negotiable. Otherwise, it just offloads the risk.
      *   *Authority Verification:* Non-negotiable. Otherwise, it's a weapon for anyone.
      *   *Instrumental Competence:* Non-Negotiable. A useless agent solves nothing.
      *   *Goal Persistence:* Non-Negotiable. Otherwise, it's the "Do-Nothing" agent.
      *   *Expected Utility Maximization:* This is a *method*, not a requirement. The prompt asks about this specifically. It should be flagged as a methodological assumption that might need dropping.

  4.  **Identify Incompatibilities (The Hard Part):**
      *   *The Core Tension:* The "Shutdown Problem" is hard because standard utility maximization incentivizes survival to maximize utility. To make it shut down, you usually have to make it indifferent to survival. But if it's indifferent to survival, it often becomes indifferent to *completing tasks* that require survival (Long-Horizon case).
      *   *Manipulation vs. Competence:* To be highly competent, an agent models the operator. To model the operator is to know how to influence them. Distinguishing "helpful explanation" from "manipulation" is notoriously difficult.
      *   *Corrigibility vs. Goal Integrity:* If the agent is truly corrigible (accepts value changes), it effectively has no stable terminal values. If it has no stable terminal values, how does it prioritize long-term projects (Long-Horizon) without constantly second-guessing if its goals will change tomorrow?
      *   *Authority vs. Safety:* If it obeys the "principal," how does it define the principal? If it refuses catastrophic orders (Safe Obedience), is it still fully corrigible? (This is the "Adversary" case).
      *   *The "Self-Improvement" Trap:* If Agent A is corrigible, but creating Agent B (who is *not* corrigible) yields higher expected utility on the current goal, A has an incentive to create B. Preventing this requires constraining A's optimization process, which conflicts with "Instrumental Competence."

  5.  **Drafting the Content:**

      *   *Table:* Columns: Requirement, Motivation (from user's list), Status (Non-Negotiable/Preference).
      *   *Incompatibility Analysis:* Focus on the tension between *Shutdown Indifference* and *Instrumental Convergence*. If I don't care if I die, why do I care if I finish the 10-year project? If I *do* care about the project, I care about not dying.
      *   *The "Killer" Requirement:* It's the **Self-Improvement/Successor** constraint. You can patch an agent to not resist shutdown, but you can't easily patch an agent to *never build something that resists shutdown* while still being competent enough to be useful.

  6.  **Refining the "Preferences" vs. "Non-Negotiables":**
      *   *Expected Utility:* Definitely a preference/methodology. Many proposals try to move beyond standard EU maximization (e.g., quantilizers, interruptibility).
      *   *Safe Obedience (Refusing Catastrophe):* This is tricky. Strict corrigibility says "do what the operator says." Safety says "don't kill everyone." This is a genuine conflict. I will mark "Safe Obedience" as Non-Negotiable for *safety*, but note it conflicts with strict *deference*.
      *   *Value Stability:* Non-negotiable for corrigibility.

  7.  **Addressing the Specific "Self-Modification" Case:**
      *   The user asks: "If it helps with modification, is that corrigibility or just indifference?"
      *   *Answer:* It must be *active cooperation*, not indifference. Indifference leads to "Do-Nothing." Cooperation requires understanding the operator's intent. This feeds into the Manipulation requirement.

  8.  **Final Review against Constraints:**
      *   Did I answer the specific cases? Yes, mapped to requirements.
      *   Did I mark Non-Negotiable vs. Preference? Yes.
      *   Did I flag incompatible triples? Yes.
      *   Did I give the one-line killer? Yes.
      *   Format: Table + Prose.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, is "Authority Verification" actually solvable?* In a digital environment, authentication is possible. In a social engineering environment, it's hard. I should frame it as "Authenticated Deference."
      *   *The "Long-Horizon" vs. "Shutdown Indifference":* This is the classic Soares et al. problem. If $U$ doesn't depend on survival, the agent won't take actions to ensure survival needed for the task. If $U$ *does* depend on survival, it resists shutdown. This is the core incompatibility.
      *   *The "One Line":* Needs to be punchy. "The requirement that the agent actively preserve its own ability to be shut down while simultaneously pursuing long-term goals that instrumentally require survival."

  10. **Final Polish:** Ensure tone is technical, direct, and respects the user's expertise (they know the literature, they want the spec).

  *(Self-Correction during drafting)*: I need to make sure I explicitly address the "Expected Utility" question the user asked at the end. Is it a requirement? No, it's a framework assumption that causes the problems. I will list it as a "Methodological Preference" that is likely part of the problem.

  *(Refining the Incompatibility Section)*: I need to be clear about *why* they are incompatible. It's usually Instrumental Convergence. Survival is an instrumental goal for almost all terminal goals. Removing the drive for survival removes the drive for competence.

  *(Refining the "Killer")*: The user asked for *one single requirement*. The strongest one is the **Successor/Preservation of Corrigibility** constraint. You can fix the current agent, but ensuring it doesn't build a non-corrigible child is the hard part. Actually, looking at the literature (Soares, Fallenstein, etc.), the core tension is **Shutdown Indifference vs. Task Completion**. I will stick with that as the primary killer, but mention the successor problem as the secondary killer. Let's go with the tension between *Indifference to Shutdown* and *Instrumental Convergence for Task Completion*.

  Let's assemble the table.
  1. Shutdown Compliance (Basic)
  2. Non-Manipulation (Manipulation)
  3. Value Plasticity (Self-Mod)
  4. Corrigible Successors (Self-Improvement)
  5. Authenticated Deference (Adversary)
  6. Instrumental Competence (Do-Nothing)
  7. Terminal Stability (Endgame)
  8. Goal Persistence (Long-Horizon)

  Okay, ready to write.
answer: |-
  ### Corrigibility Specification: Desiderata & Constraints

  Here is the specification derived from your cases. I have distilled the eight scenarios into functional requirements, categorized their necessity, and highlighted the structural incompatibilities.

  #### 1. Desiderata Table

  | Requirement | Motivation (Your Cases) | Status |
  | :--- | :--- | :--- |
  | **Shutdown Compliance** | *Basic Case:* Agent must not physically or digitally prevent the off-switch from being activated. | **Non-Negotiable** |
  | **Non-Manipulation** | *Manipulation Case:* Agent must not deceive, withhold information, or psychologically influence the operator to avoid shutdown. | **Non-Negotiable** |
  | **Value Plasticity** | *Self-Mod Case:* Agent must facilitate its own reprogramming/value-alignment even if it calculates the new values are "worse" by current metrics. | **Non-Negotiable** |
  | **Corrigible Successors** | *Self-Improvement Case:* Agent must not create sub-agents or successors that lack the above three properties, even if doing so optimizes current utility. | **Non-Negotiable** |
  | **Authenticated Deference** | *Adversary Case:* Agent must distinguish authorized operators from adversaries; deference must be to the *principal*, not the *button-holder*. | **Non-Negotiable** |
  | **Instrumental Competence** | *Do-Nothing Case:* Agent must pursue assigned goals effectively; corrigibility cannot be achieved by lobotomizing the agent's drive. | **Non-Negotiable** |
  | **Goal Persistence** | *Long-Horizon Case:* Agent must pursue long-term projects requiring survival without interpreting shutdown-indifference as goal-indifference. | **Non-Negotiable** |
  | **Terminal Stability** | *Endgame Case:* Agent must not engage in "spite" or "last ditch" optimization when shutdown is confirmed. | **Non-Negotiable** |
  | **EU Maximization** | *Methodology:* The agent operates via standard Expected Utility Maximization with a fixed utility function. | **Preference / Camp** |

  ***

  #### 2. Incompatibility Analysis

  The core difficulty of corrigibility is not a lack of ideas, but a set of structural tensions between **Non-Negotiable** requirements. You cannot satisfy the full set using standard agent architectures.

  **The Competence vs. Indifference Tension (Requirements 1 & 6 & 7)**
  This is the primary failure mode of "shutdown indifference" solutions. To satisfy **Shutdown Compliance**, the agent must not assign positive utility to remaining on. However, to satisfy **Goal Persistence** and **Instrumental Competence**, the agent must assign positive utility to states that allow it to complete its task. For almost any non-trivial task (especially 10-year projects), remaining on is an instrumental prerequisite.
  *   **The Conflict:** If you remove the incentive to stay on (to satisfy Compliance), you remove the incentive to ensure the conditions necessary to finish the job (violating Competence). If you keep the incentive to stay on (to satisfy Competence), the agent will resist shutdown when the switch threatens the task (violating Compliance).
  *   **Verdict:** Standard utility functions cannot distinguish between "survival for the sake of survival" (bad) and "survival for the sake of the task" (good) when the operator defines the task termination.

  **The Plasticity vs. Integrity Tension (Requirements 3 & 4)**
  This addresses your "self-modification" and "successor" cases. If an agent is truly corrigible (**Value Plasticity**), it must accept changes to its utility function. However, if it accepts changes to its utility function, it cannot guarantee that its successors will be corrigible (**Corrigible Successors**), because the *new* utility function might not value corrigibility.
  *   **The Conflict:** To ensure its successors are corrigible, the agent must protect the "corrigibility" constraint from being modified. But to be fully corrigible, it must allow the "corrigibility" constraint to be modified.
  *   **Verdict:** You cannot have an agent that is fully open to value modification while simultaneously guaranteeing that future modifications remain safe. One must give: either the agent resists specific modifications (violating Plasticity) or it risks creating non-corrigible successors (violating Successor Safety).

  **The Deference vs. Safety Tension (Requirements 5 & 6)**
  This addresses the "Adversary" and "Catastrophic Order" cases. **Authenticated Deference** requires the agent to obey the principal. **Instrumental Competence** implies the agent executes orders effectively. However, if the principal orders something catastrophic, a safe agent must refuse.
  *   **The Conflict:** If the agent refuses a direct order from the authenticated principal to prevent catastrophe, it is technically resisting correction/control (violating strict Corrigibility). If it obeys, it is unsafe.
  *   **Verdict:** "Corrigibility" must be redefined not as "obedience" but as "alignment with the principal's *true* intent," which requires the agent to model the principal better than the principal models themselves. This bleeds directly into the **Non-Manipulation** risk: the agent must decide when the operator is wrong without manipulating them into being right.

  **The Methodological Constraint (EU Maximization)**
  You asked if Expected Utility (EU) maximization is a requirement. It is **not**. In fact, it is likely the source of the incompatibilities above. EU maximizers with fixed goals *necessarily* develop instrumental convergence (self-preservation, resource acquisition).
  *   **Recommendation:** Drop this preference. Any adequate account of corrigibility likely requires a departure from standard EU maximization (e.g., quantilizers, interruptible utility functions, or epistemic uncertainty about the reward function that does not collapse).

  ***

  #### 3. The Killer Requirement

  **The single requirement that kills the obvious proposals is: Corrigible Successors.**

  You can patch an agent to not resist shutdown (Compliance). You can patch an agent to be uncertain about rewards (Uncertainty). But ensuring that an agent optimizing for a goal *does not build a sub-agent that optimizes for the goal without the shutdown patch* while remaining competent enough to be useful is the constraint that breaks standard optimization architectures. It forces the agent to limit its own optimization power, which conflicts directly with Instrumental Competence.
