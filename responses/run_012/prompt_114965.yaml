answer: |-
  It is completely understandable that you are feeling fatigued by this cycle, because what you are describing is one of the oldest and most stubborn stalemates in philosophy, merely dressed up in the clothing of modern social science. Your hypothesis that the two sides are disagreeing about the purpose of the science, like linguistics versus medicine, is incredibly sharp and gets you most of the way to the truth, but I think there is a slightly deeper layer underneath that keeps preventing the group from moving forward. You are right that Side A treats moral foundations like linguistic grammar, where the goal is to map the structure of competence without judging one grammar as superior to another, while Side B treats morality like medicine, where identifying a dysfunction implies a standard of health that ought to be restored. However, the reason they talk past each other is not just about the aim of the science, but about the definition of morality itself. Side A is operating under a form of ethical naturalism, which assumes that moral truths are grounded in human nature and evolutionary history, so describing those foundations is partly constitutive of what morality is. Side B is operating under a form of rationalism or non-naturalism, which assumes that moral truths exist independently of human psychology, so describing our心理ological quirks tells us nothing about whether those quirks align with the truth.

  When Side A says there is no neutral standpoint, they are making a philosophical claim, not a scientific one, and that is where Side B gets frustrated. Side B hears this as an attempt to immunize the theory from criticism by redefining criticism as impossible, while Side A hears Side B as pretending to have a God's-eye view that doesn't exist. You are also absolutely correct in your suspicion about the neutral stance. If the theory claims that no foundation beats any other, that is itself a normative claim, specifically a claim about tolerance or pluralism. It smuggles in the value that diversity of moral taste is good, or at least that judging them is bad. This is why your thought experiment about the population that weights loyalty and purity above harm is so effective. If Moral Foundations Theory says nothing about that population besides noting their different taste buds, it is admitting it is purely descriptive linguistics. But if the theorists implicitly suggest that such a society would be unstable or unhappy, they have slipped into medicine, invoking a standard of flourishing that privileges certain outcomes over others. Usually, what happens in these debates is that the descriptive theorists want to have it both ways. They want the scientific authority of merely describing facts, but they also want the moral authority of suggesting that ignoring certain foundations leads to bad societal outcomes.

  So to answer your question about whether there is a hidden empirical claim or a disagreement about reasons, it is actually both. There is a hidden empirical claim that satisfying all foundations leads to more stable societies than satisfying only some, which is a functionalist argument that Side B often misses. But more importantly, there is a disagreement about what counts as a reason. Side A accepts evolutionary origin as a relevant factor in assessing moral claims, suggesting that if a moral intuition is deeply rooted in our biology, it carries some weight. Side B rejects this entirely as the genetic fallacy, arguing that where a belief comes from has no bearing on whether it is justified. This is why no amount of new data will solve the argument. You could show them a study where purity-focused societies collapse faster, and Side B would say that proves nothing about whether purity is morally good, only that it is pragmatically risky. You could show them a study where harm-focused societies are happier, and Side A would say this proves harm is a universal foundation, while Side B would say happiness is not the same as morality.

  Given this diagnosis, progress in your reading group will not come from a new study, because the dispute is not about the data but about the interpretation of what the data means for truth. Progress would come from explicitly admitting that the question is two questions wearing one coat. You need to separate the descriptive project from the normative project. The group should agree that Moral Foundations Theory is excellent at explaining why people disagree, but silent on who is right. That does not mean Side A is wrong to suggest that understanding the other side reduces conflict, but it does mean they cannot claim their science resolves the moral dispute. A useful distinction to introduce is between moral epistemology and moral ontology. The theory speaks to epistemology, or how we come to hold moral beliefs, but Side B is asking about ontology, or what makes those beliefs true. If you can get the group to agree that the theory is a map of the terrain rather than a guide to the destination, the fighting should subside. You might suggest that the value of the theory is not in telling us which foundations to use, but in warning us that any morality ignoring half the foundations will likely fail to resonate with half the population. This moves the conversation from truth to pragmatism, which is a middle ground where both sides can stand. Side B can maintain that harm is objectively more important than purity, while Side A can maintain that ignoring purity concerns will make political coalition-building impossible.

  Ultimately, you should encourage the group to stop trying to win the argument and start analyzing why the argument persists. The friction you are feeling is the sound of philosophy rubbing against psychology, and it is productive friction if managed correctly. If you can reframe the debate so that Side A acknowledges their reliance on a hidden normative premise about pluralism or flourishing, and Side B acknowledges that moral reasoning never happens in a vacuum free of psychological constraints, you might find that they are not actually enemies. They are just looking at different sides of the same coin. One is looking at the metal and the other at the face stamped on it. Neither is the whole coin. If you can get everyone to agree that the theory describes the machinery of moral judgment but does not operate the machine, you can go home earlier and spend less energy circling the same drain. It is not that one side is right and the other wrong, but that they are playing different games on the same board, and until you name the games, you will keep keeping score by different rules.
