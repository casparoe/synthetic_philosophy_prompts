      *   *No Sapir-Whorf essay?* Yes, focused on translation mechanics.
      *   *Specific scenes?* Yes (Weapon, 12 ships, Logograms).
      *   *Honest about where film resists/cheats?* Yes (Superpower aspect).
      *   *Address the sick girl/dying daughter rhyme?* Yes (Emotional constraint).
      *   *Ending for seminar paper?* Yes (The physical act of writing).

  7.  *(Self-Correction on Hofstadter)*: I need to be careful not to caricature Hofstadter as the "translator as god." In *Le Ton beau*, he emphasizes *faithfulness* to the spirit, which often requires changing the letter. But he does emphasize the *craft*—the deliberate choices. Priya's critique is that Hofstadter treats the constraints as *external rules to apply*, whereas *Arrival* treats the constraint as an *internal state of being*. I should highlight this distinction.

  8.  *(Final thought on the "Sick Girl")*: This is the strongest emotional link. Hofstadter's translation is an act of mourning. Louise's translation is an act of acceptance. This bridges the "form is decoration" gap. Form isn't decoration; it's the vessel for grief.

