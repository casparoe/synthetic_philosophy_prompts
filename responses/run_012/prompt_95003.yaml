      *   **User's Argument:** Priya confuses *being changed by language* with *translating*. Hofstadter's point is that preserving content without form loses the poem; the translator must hold the constraints (rhyme, meter) to carry the meaning.
      *   **Task:** Read *Arrival* through the *Le Ton beau de Marot* lens (translation under formal constraint). Avoid standard Sapir-Whorf essays. Focus on specific scenes. Address the "offer weapon" vs. "use weapon" mistranslation (context/frame). Address the 12 ships/message split. Address Louise's breakthrough (relation to time/physics). Be honest about where the film resists the reading (cheats/treats form as superpower). Address the "sick girl/dying daughter" parallel (red herring or meaningful?).
      *   **Goal:** A fair reading for a translation seminar paper where half the class thinks form is decoration. Needs to end with something the film *shows* about form/constraint that arguments can't capture.
