answer: |-
  Here are ten questions designed to tighten the screws on the luck-egalitarian position, specifically targeting her tendency to dissolve objections by reclassifying them as brute luck. They are ordered to build pressure: starting with the metaphysics of choice, moving through the institutional implications, and ending with the structural integrity of the theory itself.

  ### 1. The Prudence Objection (Part 1)
  **Question:** You draw a bright line between brute luck and option luck. But consider the person who doesn't read the small print or fails to insure themselves. Isn't the *capacity* to be prudent—to plan ahead, to understand risk—itself largely a product of upbringing and cognitive endowment? If prudence is a talent, isn't your "choice" category just brute luck in disguise?

  **Follow-up:** If she argues that we must *assume* a baseline capacity for responsibility to make society function: Ask her whether a theory of *justice* can rest on a convenient fiction. If the fiction harms the least prudent, why is the fiction justified?

  ### 2. The Prudence Objection (Part 2)
  **Question:** Let's push that all the way down. If my preferences, my risk tolerance, and my executive function are all shaped by factors I didn't choose, what is left of the "agent" who is supposed to bear the cost of their choices? Is there any coherent stopping point where responsibility actually begins, or does the buck just keep getting passed back to brute luck?

  **Follow-up:** If she identifies a stopping point (e.g., "adulthood" or "rationality"): Ask her to justify why *that* specific threshold isn't also determined by prior causal chains. If she can't, press that the distinction is arbitrary.

  ### 3. The "Gutter" Objection
  **Question:** A standard criticism is that your view licences leaving the imprudent in the gutter. If someone gambles away their savings on a genuine option luck gamble, you say the state owes them nothing. But does a just society really watch its citizens starve simply to maintain a theoretical ledger of responsibility?

  **Follow-up:** If she says, "No, we provide a humanitarian minimum": Ask whether that minimum isn't just a concession that luck egalitarianism is too harsh to work. If we guarantee the minimum regardless of choice, hasn't the core principle—that you bear the cost of your choices—been abandoned?

  ### 4. The Scrutiny Objection
  **Question:** To distinguish between brute luck and option luck, the state has to know *why* you're in need. Did you lose your job because of a market crash (brute) or because you were lazy (option)? Doesn't implementing your view require a humiliating level of state scrutiny where citizens must prove their own innocence to get help?

  **Follow-up:** If she suggests we can use proxies or general rules rather than individual scrutiny: Ask if those proxies won't inevitably misclassify people. If the system misclassifies a "choice" failure as "bad luck," aren't you subsidizing irresponsibility? If it misclassifies "bad luck" as "choice," aren't you condemning the innocent?

  ### 5. The Talent Tax Horn
  **Question:** On the talent side: if we compensate people for having less valuable talents, we must tax those with valuable talents. Does this not treat the talented as mere resources for others? Are you committed to the view that my life and abilities are partly owned by the collective?

  **Follow-up:** If she denies this (saying it's just about fairness, not ownership): Press her on the moral claim. If I didn't choose my talent, why does the *state* have a claim on the surplus it produces rather than just leaving it with me? Why is the default that the surplus belongs to others?

  ### 6. The Automation Case (Classification)
  **Question:** I want to test this on a live case. Take a worker whose trade becomes worthless due to automation. Did they choose badly by entering that field, or did they lose a brute luck lottery on technological timing? Does your answer change depending on how foreseeable the collapse was?

  **Follow-up:** If she says "Foreseeable = Choice": Ask if it's realistic to expect ordinary workers to predict macro-economic technological shifts. If the cognitive burden of "foreseeability" is that high, isn't almost every economic risk actually brute luck for most people?

  ### 7. The Automation Case (Remedy)
  **Question:** *(This is a two-parter; press the second half if she dodges.)* Suppose you say the state owes them retraining. What if they retrain and fail? Is that failure bad option luck (they didn't try hard enough) or bad brute luck (they lack the capacity to learn the new skills)? What does the view owe them then—permanent income or nothing?

  **Follow-up:** If she says "Permanent income": Ask why we didn't just start there. If she says "Nothing": Ask how this differs from the "gutter" objection. If the retraining fails due to brute luck (capacity), haven't we just delayed the inevitable punishment?

  ### 8. The Disability Double Jeopardy
  **Question:** On disability: I suspect your view produces a double jeopardy. You are disadvantaged by brute luck (the disability), but then you are judged on how well you cope with it (option luck). If you don't mitigate your disadvantage effectively, do you lose your claim to compensation?

  **Follow-up:** If she says, "We only expect reasonable mitigation": Ask who defines "reasonable." If a disabled person refuses a painful treatment to gain employment, is that a choice they must bear the cost of? If so, aren't you penalizing them for how they live with their disability?

  ### 9. The "Everything is Luck" Defense
  **Question:** You have a move where you take my counter-examples and show they are actually brute luck. So, I want to ask: Is there *any* case that counts as genuine option luck for you? Can you give me one concrete example of a disadvantage that is purely the result of choice and not traceable to prior luck?

  **Follow-up:** If she struggles to name one, or gives a trivial example (e.g., "betting on a coin toss"): Point out that if the theory absorbs all real-world inequalities into "brute luck," the distinction does no work. Why keep the vocabulary of responsibility if the extension is empty?

  ### 10. The Collapse Question
  **Question:** *(This is a two-parter; essential for the close.)* If your answer to the last question is "almost nothing is genuine option luck," doesn't your view collapse into strict equality or a Rawlsian difference principle? What work is the "responsibility" condition actually doing in your theory?

  **Follow-up:** If she admits it collapses: Ask why defend luck egalitarianism specifically rather than the simpler view it has become. If she denies it: Ask her to explain the practical policy difference between her view and strict equality, given that almost all inequality traces back to luck.
