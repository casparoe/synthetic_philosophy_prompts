prompt: |-
  Two years ago I was the volunteer who pitched the Riverside Mill idea to our community foundation, and last month they finally put me on the board, which means im now the one drafting the recommendation for Thursday's meeting on whether to keep funding it — so take all this with the grain of salt of someone who already stuck his neck out for the thing.

  The quick version: we first put in $400k against a $1.2M budget to turn the old mill into a job-training center. We're at $2.9M spent now, and the contractor wants one more $450k tranche to finish the shell, after which a state match of $300k comes through. If we walk, we still owe about $180k in site remediation and lose a $150k deposit, and the county — our other funder — has hinted they'll pull out too if we do, which would leave us holding more of it. So stopping isn't free, it's picking which loss. Meanwhile there's a program the staff actually prefers that the same $450k could fund, though nobody's costed it out.

  The part I can't shake: I read about an auction where you bid on a dollar and the top two bidders both have to pay, so it runs away — you keep bidding because dropping out means paying for nothing. My CFO says that's us, to the letter. My friend on the board says no, that's nonsense, we aren't bidding against anyone. I think they might both be right.

  Draft the memo I'll bring in. I need a concrete recommendation — fund it, stop, or fund it with a hard cap and conditions — with a date attached, and an honest paragraph on the strongest case against whatever I land on. It should say whether the auction comparison actually holds, and if it doesn't, what the real disanalogy is and why it matters. And please deal with the thing that worrys me most: half this board has read the same pop-psych stuff about sunk costs, so they'll call any continuation a fallacy, and I don't think that's automatically right. Last thing — who should even be making this call, the people who cast the earlier votes or somebody who wasnt in the room, and does capping it now buy us anything, or is that just the same trap with better manners?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Board member (originally the volunteer who pitched the project 2 years ago).
      *   **Audience:** Community Foundation Board (meeting Thursday).
      *   **Subject:** Recommendation on further funding for the "Riverside Mill" project.
      *   **Key Facts:**
          *   Initial pitch: $400k against $1.2M budget (Job-training center).
          *   Current spend: $2.9M.
          *   Request: $450k to finish shell.
          *   Incentive: State match of $300k upon shell completion.
          *   Exit costs if stopped: $180k (remediation) + $150k (lost deposit) + potential County pullout (increasing liability).
          *   Alternative: Staff prefers a different program fundable by the $450k (uncosted).
      *   **Key Concerns/Conflicts:**
          *   Sunk Cost Fallacy vs. Strategic Investment.
          *   Dollar Auction analogy (CFO says yes, Friend says no).
          *   Bias: The author pitched the project originally (conflict of interest/credibility issue).
          *   Board Dynamics: Half the board is wary of sunk cost arguments.
          *   Governance: Who should decide (original voters vs. new)?
          *   Mitigation: Does capping help or just delay?
      *   **Requirements:**
          *   Concrete recommendation (Fund, Stop, or Cap/Condition).
          *   Date attached.
          *   Honest paragraph on the strongest case *against* the recommendation.
          *   Address the Dollar Auction analogy (does it hold? why/why not?).
          *   Address the Sunk Cost Fallacy concern.
          *   Address the Governance question (who decides).
          *   Tone: Professional, self-aware, analytical, decisive.

  2.  **Determine the Recommendation:**

      *   *Option A (Fund):* High risk. Budget already blew past 240% ($1.2M -> $2.9M). No guarantee it stops at $450k more.
      *   *Option B (Stop):* Immediate loss of $330k+ (remediation + deposit) + County fallout. Wastes the $2.9M already spent.
      *   *Option C (Fund with Hard Cap/Conditions):* Best middle ground. Acknowledges the investment but prevents infinite bleed. Forces a business plan review.
      *   *Decision:* **Fund with a Hard Cap and Conditions.** This addresses the "throwing good money after bad" fear while acknowledging the high exit costs. It transforms the decision from "saving the past" to "securing the asset."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening/Context:** Acknowledge the author's history (pitched it 2 years ago). Establish transparency.
      *   **The Numbers:** Lay out the financial reality clearly (Spend vs. Budget vs. Exit Cost).
      *   **The Dollar Auction Analysis:** This is crucial.
          *   *CFO's view:* We are bidding to avoid paying for nothing.
          *   *Friend's view:* No competitor.
          *   *Synthesis:* It's not a *competitive* auction, but it is a *loss-aversion* trap. However, the disanalogy is that completing the shell creates an *asset* with value (state match, usable building), whereas the dollar auction yields only a dollar bill. If the building has utility, it's not a pure loss.
      *   **Sunk Cost Fallacy:** Address the board's fear.
          *   Argument: Ignoring sunk costs is right *unless* the sunk costs create a barrier to exit that makes continuation cheaper than stopping. Here, exit costs ($330k+) are real, not psychological.
      *   **Governance/Who Decides:** Acknowledge the bias. The original voters are compromised by commitment; new members lack context. The solution is *conditions*, not just personnel.
      *   **Recommendation:** Fund the $450k BUT with a hard stop and specific milestones.
      *   **The "Strongest Case Against":** Must be honest. The risk is that the $450k is just the next tranche of an endless pit, and the "alternative program" might yield higher social return on investment (SROI).
      *   **Date:** Thursday's meeting date (need to invent a plausible one or leave generic). Let's use a specific near-future date for concreteness.

  4.  **Refining the Tone:**

      *   Needs to be humble but authoritative.
      *   Avoid defensive language regarding the original pitch.
      *   Show financial rigor.
      *   Ensure the "Dollar Auction" logic is crisp.

  5.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I address the County risk? *Yes, include in exit costs.*
      *   *Check:* Did I address the staff's preferred alternative? *Yes, in the "Case Against" section.*
      *   *Check:* Is the conflict of interest handled? *Yes, in the opening.*
      *   *Check:* Is the recommendation concrete? *Yes, "Conditional Approval."*
      *   *Check:* Did I answer the "who should decide" question? *Yes, in the governance section.*
      *   *Check:* Is the Dollar Auction analogy resolved? *Yes, it's a "Loss Aversion" trap, not a competitive auction, but the asset value breaks the analogy.*

  6.  **Final Polish:**

      *   Ensure the distinction between "Sunk Cost" (past money) and "Exit Cost" (future money to stop) is clear. This is the key financial argument.
      *   Make sure the "Hard Cap" isn't just words. It needs a mechanism (e.g., no further asks without new business plan).

  7.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Community Foundation
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Riverside Mill Funding Tranche

  **Context and Conflict Statement**
  Two years ago, I pitched the Riverside Mill project to this foundation. Last month, I joined this board. I am drafting this recommendation with full awareness of that trajectory. I advocated for the initial vision; I am now responsible for evaluating its viability. I have recused myself from any informal lobbying on this matter prior to this meeting. My goal here is not to defend my past judgment, but to minimize risk to the Foundation moving forward.

  **Financial Reality**
  *   **Original Budget:** $1.2M (Our share: $400k)
  *   **Current Spend:** $2.9M (Total project cost)
  *   **Request:** $450k to complete shell.
  *   **Incentive:** $300k State Match upon shell completion.
  *   **Cost to Stop:** ~$330k immediate cash loss ($180k remediation + $150k deposit) + high probability of County withdrawal, potentially increasing our liability exposure on the site.

  **The Dollar Auction and Sunk Costs**
  Our CFO compares this to the "Dollar Auction" game theory trap: where bidders escalate bids to avoid being the second-highest bidder who pays for nothing. He argues we are continuing solely to avoid realizing the loss of the $2.9M already spent.

  This analogy is partially correct but critically flawed.
  *   **Where it holds:** We are motivated by loss aversion. The pain of writing off $2.9M is driving the desire to spend $450k more.
  *   **The Disanalogy:** In a Dollar Auction, the prize is fixed ($1.00). In this project, completing the shell unlocks a *new* asset value (the State Match and a usable facility). We are not bidding to win a dollar; we are spending $450k to secure a $300k match plus a capital asset.
  *   **Why it matters:** If this were purely sunk cost, stopping would be the only rational choice. Because there is a forward-looking return (the match and the asset), continuation is an investment decision, not just a psychological trap. However, if the asset has no operational use beyond the shell, the CFO is right: we are just paying to hold a loss.

  Regarding the Sunk Cost Fallacy: Half this board worries that continuing validates the fallacy. Ignoring sunk costs is standard advice, *unless* the sunk costs create high exit barriers. Here, the $2.9M is gone, but the *contractual obligations* created by that spend (remediation, deposits) are future costs. We are not paying for the past; we are paying the penalty for stopping. The decision must be based on whether the $450k yields a better return than the $330k+ loss of stopping.

  **Governance and Decision Authority**
  Who should decide? Those who voted for the initial $400k are compromised by commitment bias. Those new to the board lack context on the site's complexities.
  *   **Verdict:** The current Board must decide, but we must change the *criteria* of the decision. We cannot vote on "saving the project." We must vote on "acquiring an asset."
  *   **Does Capping Help?** A hard cap is only useful if it is enforceable. If we cap it now without a plan for operations, we are simply deferring the auction to next quarter. A cap buys us time only if tied to a completed operational budget.

  **Recommendation**
  **I recommend we fund the $450k tranche, subject to a Hard Cap and Operational Conditions.**

  1.  **Authorization:** Release the $450k strictly for shell completion.
  2.  **Hard Stop:** No further capital requests will be entertained for 24 months following this tranche.
  3.  **Condition Precedent:** Before funds are released, Staff must present a fully costed operational budget showing how the building generates revenue or social return to cover maintenance, validated by the Finance Committee.
  4.  **Alternative Review:** If the operational budget shows a deficit greater than 10% of projected revenue, funding halts, and we accept the exit costs.

  **Date of Decision:** This recommendation is for the board meeting on **Thursday, October 26, 2023**.

  **The Strongest Case Against This Recommendation**
  The most compelling argument against my recommendation is that the $450k represents a higher social return if deployed elsewhere. Our staff has indicated a preference for a different program that could be funded by this same capital. By locking this money into bricks and mortar to avoid a $330k loss, we may be throwing good money after bad in terms of mission impact. If the Mill becomes a "white elephant" that drains operating funds for a decade, the initial loss of $330k would have been the cheaper option. We risk solving a financial problem (exit costs) by creating a programmatic one (an unfunded building). If the operational budget cannot prove self-sufficiency, my recommendation is wrong, and we should cut our losses immediately.

  **Next Steps**
  I move we form a subcommittee to review the operational budget required in Condition #3 above, with a deadline of 14 days. If the budget does not clear the bar, the tranche is voided, and we begin site remediation.

  Respectfully submitted,

  [Your Name]
  Board Member
