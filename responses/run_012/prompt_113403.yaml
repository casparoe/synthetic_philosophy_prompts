      *   *Devlin:* Society has a right to protect its existence. A shared morality is the bond that holds society together. If that bond breaks, society disintegrates. Therefore, the state can criminalise immorality (even private consensual acts) to preserve social cohesion. "Disgust" is a signal of what threatens the moral fabric.
      *   *Hart:* Follows J.S. Mill's Harm Principle. The law should only intervene to prevent harm to others. Private morality is not the law's business. Enforcing morality stifles liberty and diversity. Just because people are disgusted doesn't mean harm is done.
      *   *Who won?* It's not a football match. Hart influenced the Wolfenden Report and the Sexual Offences Act 1967 (decriminalising homosexuality). However, Devlin's arguments persist in areas like obscenity, drug laws, and yes, incest.

