prompt: |-
  Me and my flatmate had a proper two-hour row about this last night and I'm still stewing, so sorry in advance for the length. The short version: the council round our way is trying to shut a certain thing down, and she reckons the law is entitled to ban stuff simply because it's degrading and disgusting, even when you can't point to a single person who's been harmed by it. Her line is that some things are just wrong, full stop, and that's the end of the arguement. I said you can't criminalise people for being gross, and she told me to go and read up on the Hart–Devlin debate. So I did, and now I'm more confused than I was before.

  Here's where I'm stuck. I'd always understood that Hart and Devlin were arguing about whether law and morality are connected at all — Hart saying they're two completely seperate things, Devlin saying they're joined at the hip — and that Hart basically won that one, since nobody serious now thinks the criminal law should go around enforcing morality for its own sake. If that's right, my flatmate's position is dead and buried. But then why is it still a crime for two grown-up siblings to be together, when they're both consenting, there's no question of kids and nobody's harmed? And my tutor keeps calling the whole thing the question of the enforcement of morals, which doesn't sound like a row about whether law and morality are connected at all.

  So: who actually held what, and does any of it settle whether a law can be justified by nothing more than the claim that the conduct is immoral? If it doesn't settle it, what is the actual state of play? And give me the strongest case on my flatmate's side, because I'd rather not go back in there unarmed. British English please.
