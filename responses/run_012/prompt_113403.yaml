answer: |-
  First off, take a deep breath. It is completely understandable that you are stewing. The Hart–Devlin debate is one of the most famous rows in legal philosophy, and it trips up law students (and professors) all the time. You are not alone in finding it knotty.

  The core of your confusion lies in a mix-up between two different questions. Once we untangle that, the rest should fall into place. Here is the breakdown of who said what, where the law stands today, and how to arm yourself for round two with your flatmate.

  ### 1. The Big Misunderstanding: "Is" vs. "Ought"

  You mentioned you thought Hart and Devlin were arguing about whether law and morality are *connected at all*. That is actually a different debate (Natural Law vs. Legal Positivism).

  *   **The Conceptual Question:** "What *is* law?" (Hart was a positivist; he believed law and morality are conceptually separate. A law can be valid even if it is immoral.)
  *   **The Normative Question:** "What *should* the law do?" (This is the Hart–Devlin debate.)

  Your tutor is right to call it the "enforcement of morals". Neither Hart nor Devlin denied that law and morality overlap in practice (murder is both illegal and immoral). The argument was about **justification**. Does the fact that society finds something immoral provide a *sufficient reason* for the state to criminalise it, even if no one is harmed?

  *   **Hart:** No. (Liberalism)
  *   **Devlin:** Yes. (Conservatism/Legal Moralism)

  ### 2. What Devlin Actually Argued (Your Flatmate's Side)

  Lord Devlin was reacting to the Wolfenden Report (1957), which recommended decriminalising homosexual acts between consenting adults. Devlin was horrified. His argument wasn't just "I find this yucky." It was structural.

  **The Disintegration Thesis:**
  Devlin argued that a society is not just a collection of individuals; it is a community bound together by shared political ideas and, crucially, shared moral ideas. If you remove the shared morality, the bonds of society dissolve, and the society disintegrates.

  **The Role of Disgust:**
  Devlin famously argued that the "man in the Clapham Omnibus" (the ordinary reasonable person) possesses an intuitive sense of what threatens this moral fabric. If an act causes deep, widespread disgust or indignation, that is evidence that it threatens the social bond. Therefore, the state is entitled to use the criminal law to suppress that act to preserve society's existence, much like it uses laws to suppress treason.

  **The "Private" Fallacy:**
  Devlin rejected the idea of a "private sphere" that the law cannot touch. He argued that private immorality erodes public morality over time. You cannot compartmentalise it.

  ### 3. What Hart Actually Argued (Your Side)

  H.L.A. Hart was defending the recommendations of the Wolfenden Report. He leaned heavily on John Stuart Mill's **Harm Principle**.

  **The Harm Principle:**
  The only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others. His own good, or the fact that others find his conduct disgusting, is not sufficient warrant.

  **Morality Evolves:**
  Hart argued that morality is not a static monolith. It changes. If you use the criminal law to freeze current moral attitudes, you stifle social progress. (He pointed out that Christianity was once considered a dangerous immorality by the Roman state).

  **Liberty:**
  For Hart, individual liberty is the default. The burden of proof lies on those who want to restrict it. Mere disgust is not a "harm".

  ### 4. Who Won? (The State of Play)

  It is not a football match with a final whistle, but if we look at the scoreboard, it is a draw with injuries on both sides.

  **Where Hart Won:**
  Hart's influence is clear in the Sexual Offences Act 1967, which partially decriminalised homosexuality. The modern human rights framework (Article 8 of the ECHR, right to private life) is very Hartian. In cases like *Dudgeon v United Kingdom*, the European Court essentially ruled that moral disapproval alone is not enough to justify interfering with private sexual life.

  **Where Devlin Hangs On:**
  However, as you noticed with the incest example, Devlin has not been fully routed.
  *   **Incest:** Under the Sexual Offences Act 2003, sexual activity between consenting adult relatives is a crime in the UK. This applies even if contraception is used, or if one party is sterilised, meaning there is no risk of genetic harm to offspring. The Law Commission has admitted there is no clear "harm" justification for banning consensual adult incest, yet the law remains. This is pure Legal Moralism.
  *   **Obscenity and Drugs:** Many laws regarding controlled substances or extreme pornography rely on the idea that certain things are inherently damaging to the moral fabric, even if the user consents.

  So, your flatmate is not "dead and buried." The law is a patchwork. In some areas, we are Hartians; in others, we are Devlinians.

  ### 5. Arming You: The Strongest Case for Your Flatmate

  If you want to hold your own in the next round, you need to understand that Legal Moralism has evolved since the 1950s. Devlin's original argument had holes (e.g., how do we measure "disintegration"?), but modern philosophers have refined it.

  Here is the strongest version of your flatmate's argument, often associated with thinkers like Patrick Devlin, Robert George, or (in a modified form) Joel Feinberg's "Offence Principle".

  **Argument 1: The Constitutive Value of Morality**
  Morality is not just a set of preferences like liking chocolate over vanilla. It is constitutive of who we are as a community. A society that permits certain acts (e.g., incest, necrophilia, extreme degradation) changes the *meaning* of relationships within that society. Even if no specific individual is harmed in a specific instance, the *institution* of the family or human dignity is degraded. The law has a role in upholding the integrity of these social institutions.

  **Argument 2: The Offence Principle**
  Joel Feinberg, a liberal, actually conceded that the Harm Principle wasn't enough. He proposed the **Offence Principle**. Some acts are so profoundly offensive or disgusting to the general public that they create a nuisance to the moral environment. While this usually applies to public acts, the argument extends to private acts that, if known, would cause widespread revulsion that disrupts social cohesion. If the "moral environment" is polluted, everyone suffers a reduction in quality of life.

  **Argument 3: The Slippery Slope of Autonomy**
  Hart assumes that adults are rational agents who can separate their private acts from the public good. The counter-argument is that normalisation matters. If the law says "this is permissible," it signals social approval. Over time, this shifts the culture. If the culture shifts too far, we may lose the ability to recognise certain harms. For example, if we normalise the commodification of bodies in certain ways, we might eventually undermine our ability to protect vulnerable people from exploitation. The law acts as a teacher (the "expressive function of law").

  **Argument 4: Incest and the "Corruption of Blood"**
  Specifically regarding your incest example: The strongest non-moralistic defence is that incest undermines the stability of the family unit, which is the primary care structure for children. Even if *this* couple uses contraception, legalising it blurs the boundaries that protect children in the wider family network. However, be warned: if your flatmate is honest, she will likely admit she thinks it is wrong *even without* that justification. Her strongest point there is simply: "Some things are intrinsically incompatible with human dignity, and the law should reflect that."

  ### Summary for Your Next Row

  1.  **Correct the Premise:** Tell her the debate isn't about whether law and morality are *connected* (they obviously are), but whether moral disapproval *alone* is a valid ground for criminalisation.
  2.  **Acknowledge Devlin:** Admit that Devlin's "disintegration thesis" is the philosophical basis for her view. It is a respectable, coherent position, not just "I'm disgusted."
  3.  **The Incest Card:** Use the incest law to show that Parliament *does* still enforce morals without proven harm. This proves her point is not legally obsolete.
  4.  **Your Counter:** Stick to Hart's liberty argument. Ask her: "Where is the line?" If disgust is enough, can we ban interracial marriage? (Which was once widely considered disgusting). Can we ban atheism? The danger of Devlin's view is that it enforces the prejudices of the majority against minorities.
  5.  **The Compromise:** The modern consensus is usually a modified Harm Principle. We generally need harm, but we accept that "harm" can include damage to social institutions, not just physical injury to individuals.

  **Verdict:** You are both partially right. Hart won the battle over private homosexuality, but Devlin won the war over incest and obscenity. The law is inconsistent, and until Parliament decides otherwise, your flatmate has the statute book on her side, even if you have the liberal philosophy on yours.

  Good luck. And perhaps suggest taking the argument to the pub; it's harder to row properly over a pint.
