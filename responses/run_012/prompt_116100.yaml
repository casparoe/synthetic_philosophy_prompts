prompt: |-
  You're a philosopher of probability and decision theory — someone who actually knows both the Keynesian material and the modern imprecise-probability/ambiguity literature from the inside, and who won't fob me off with the textbook gloss. Before you answer, brainstorm: get the candidate defeaters out on the table first, then sort them. I'd rather see you think slowly and show the sorting than hand me a tidy list of five.

  Here's the position I've talked myself into. Keynes's distinction between the degree of a probability and its weight — the amount of relevant evidence behind it — is a real distinction, and weight is not reducible to some further credence. In the Treatise he says the comparison turns upon "a balance, not between the favourable and the unfavourable evidence, but between the absolute amounts of relevant knowledge and of relevant ignorance respectively", and I think that's exactly right and that nothing since has touched it. All the modern reconstructions — second-order probabilities, sets of probability functions, the smooth-ambiguity models, "confidence" in a subjective estimate — look to me like they model the wrong thing, because every one of them takes weight and converts it back into a probability of some kind. If weight were just a second-order probability then Keynes's whole point would be lost, and I don't think it's lost. I also think weight has to do genuine normative work: two hypotheses can have the same degree and still not be on a par for action.

  The part that's more mine than Keynes's is what I actually want tested. I think "weight" gets used for two seperate things and only one of them does any work. Call them coverage and resilience. Coverage = how much of the relevant evidence base an argument has actually digested, how much of the space of relevant considerations has been surveyed. Resilience = how far the estimate would have to move, or how much new evidence it would take, before the conclusion flips. My hunch is that Keynes's weight is coverage, but that whenever weight seems to matter for what to do, it's resilience doing the work — and resilience is a property of the evidence plus the decision, not of the argument. If that's right, then "the weight of an argument" as an argument-relative quantity either collapses into coverage (real, but decision-theoretically inert) or into resilience (does the work, but isn't argument-relative). Either way the Keynesian primitive is in trouble. I want to know if it actually is.

  So: what would count against this? Real defeaters, not a sympathetic summary. Which formal results, which cases, which arguments would show that the coverage/resilience split isn't a real split, or that some piece of the second-order machinery does capture weight after all, or that weight has normative force neither of my two notions has? Also tell me what to do with the finding that ambiguity aversion tends to show up mainly when people compare an ambiguous bet against an unambiguous one and fades when both bets are ambiguous — that smells like it's about the comparison rather than about the evidence, and if it is, I want to know how much of the empirical motivation for weight that kills. What would the best Keynesian concede is a problem for their side, as opposed to what only critics say? Rank it all: fatal, awkward, bullet to bite. And say honestly whether the position has been qualified into something that can't be wrong — if every ambiguity result gets absorbed as "that's just weight again", tell me, and tell me whether that's a defect in a view like this or just the price of it being about something real. What does my version predict that the standard subjective story doesn't? If the answer is "nothing behavioural", say whether that's fatal or whether an explanatory difference is enough.

  What would move me most: a case where two agents with identical coverage of the evidence, facing the same decision, should still act differently because of weight alone. If that's impossible I think I'm in trouble; if it's possible I want to see it.

  Don't bother with citations or a reading list, I know roughly where the pieces are. I want the map of what this view risks.
