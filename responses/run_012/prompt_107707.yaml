answer: |-
  **Alex (Epistemicist):** Let's go back to the machine. You say the variation proves there's no fact of the matter. I say it proves the machine is unreliable. If I ask you whether Patch 42 is red, and you say 'yes', then I ask you again five minutes later and you say 'no', one of those assertions is false. Unless you're willing to say truth is time-relative here, which seems desperate.

  **Sam (Supervaluationist):** But that's the point, Alex. Truth isn't time-relative, but *assertibility* is relative to a precisification. The machine isn't asserting 'Patch 42 is red' *simpliciter*. It's asserting 'Relative to precisification P1, Patch 42 is red'. When it switches to P2, it asserts the negation. Neither is supertrue. The variation isn't error; it's a faithful display of the semantic gap.

  **Alex:** But nobody uses the machine to learn about precisifications. They use it to sort patches. If this thing is hooked up to a paint mixer, sometimes it mixes red, sometimes orange, for the *same* input. That's a bug, not a feature. If there's a correct way to sort the patch for the purpose at hand, the machine is guessing. And if it's guessing, there's a fact it's missing.

  **Sam:** You're begging the question by assuming there's a 'correct way' independent of the precisification. Look, consider the 'definitely' operator. On my view, 'Definitely Red' is true if 'Red' is true on all admissible precisifications. The machine won't vary on those cases. It only varies on the borderline. That captures the intuition perfectly: we agree on the core, we wobble on the edge.

  **Alex:** Fine, but now tell me about the boundary of 'Definitely Red'. Is there a sharp line between the patches that are 'Definitely Red' and those that are merely 'Indeterminately Red'?

  **Sam:** Well, on the standard model, yes. Within any single precisification, classical logic holds. So within any P, there's a cut-off. Since 'Definitely' quantifies over all P, the boundary of the definite region is determined by the intersection of all those cut-offs.

  **Alex:** So there's a sharp boundary between the definite and the indefinite?

  **Sam:** There has to be, if we want to preserve classical logic and the definition of supertruth.

  **Alex:** Then you haven't eliminated sharp boundaries; you've just pushed them back. You've replaced a sharp boundary between red and not-red with a sharp boundary between 'definitely red' and 'not definitely red'. And intuitively, that second boundary is just as vague as the first. There are patches where it's unclear whether they're *definitely* red.

  **Sam:** We can handle that with higher-order supervaluationism. We precisify the set of precisifications.

  **Alex:** But eventually, the regress stops. At the final level, you must have a sharp boundary between admissible and inadmissible precisifications. If that boundary is vague, you need a meta-precisification, and so on. If it stops, you have a sharp line you can't locate. That's exactly my view, but without the benefit of bivalence at the object level. Why pay the price of a sharp boundary if you don't get bivalence out of it?

  **Sam:** Because I get to say there's no unknown fact about the patch itself. You're committed to there being a specific nanometre wavelength where red stops, known only to God. I'm committed to a sharp boundary in *semantic admissibility*. The latter is about our linguistic practices; the former is metaphysical magic.

  **Alex:** Is it? Let's talk about stipulation. A medical protocol says 'Administer drug if temperature > 38°C'. That's a stipulation. Does it create a sharp line?

  **Sam:** Yes. Stipulation selects a precisification. Once stipulated, '38°C' is sharp. The vagueness is resolved by fiat.

  **Alex:** But if vagueness was genuinely a lack of fact—if the world plus language genuinely didn't determine the extension—how can a fiat create a fact? You can't legislate metaphysics. If I say 'Let 'heap' mean exactly 10,000 grains', I haven't made it true that 9,999 grains wasn't a heap before. I've just changed the subject.

  **Sam:** No, I'm saying the original term was semantically incomplete. Stipulation completes it. It doesn't reveal a hidden fact; it fixes a meaning.

  **Alex:** But if the meaning *could* be fixed arbitrarily without distortion, then the original meaning wasn't really vague in the way you claim. It was just underspecified. And if it was underspecified, then for any context where action is required, we *must* precisify. When we do, we act *as if* there's a fact. The machine case shows that without stipulation, action is random. With stipulation, action is deterministic. The difference isn't ontic indeterminacy; it's ignorance versus decision. Your view says the machine is consistent with the semantics. I say the machine is broken because semantics requires a truth-value for assertion, and if you can't give one, you shouldn't assert.

  **Sam:** But supervaluationism saves classical logic. You keep bivalence, but you lose knowability. I keep knowability—there's no fact to know—but I modify logic.

  **Alex:** You don't keep knowability. You're ignorant of where the boundary of admissibility lies. You admit there's a sharp line between admissible and inadmissible precisifications. You don't know where it is. So you're an epistemicist about admissibility!

  **Sam:** [Pauses] I... suppose I am. But that's a boundary about language, not the world.

  **Alex:** And I say the boundary of 'red' is a boundary about language too. We're both positing sharp boundaries we can't locate. But I get to keep the intuition that 'Patch 42 is red' is either true or false. You have to say it's neither. When the machine says 'red', you say it's not strictly true. When it says 'not red', you say that's not strictly true either. So the machine is never telling the truth on the borderline?

  **Sam:** It's telling a truth-relative-to-a-precisification.

  **Alex:** Which is no truth at all for the agent needing to paint the wall. Look, if you concede the boundary of admissibility is sharp and unknown, you've accepted the core epistemicist claim: there are sharp limits to our concepts we cannot discern. The only difference is you wrap it in a quantifier over models. That's formal elegance, not metaphysical gain.

  **Sam:** Alright. I'll grant that the higher-order boundary issue is the weakest link. If I insist there's no sharp boundary anywhere, I lose classical logic. If I insist on classical logic, I get a sharp boundary of admissibility. I suppose I have to bite the bullet there. But I still think positing a hidden fact of the matter for 'red' is worse than positing a hidden fact of the matter for 'admissible precisification'. The latter is about us; the former is about the world.

  **Alex:** I'll take that concession. If the boundary is about us, then vagueness is just ignorance of our own linguistic rules. Which is exactly what I've been saying.

  **Sam:** Don't push your luck. I'm still not accepting bivalence for the borderline cases themselves.

  **Alex:** But you've accepted bivalence for the admissibility conditions. That's where the work is being done. The machine varies because it samples admissible rules. But whether a rule is admissible or not is a sharp fact. So the variation is just ignorance of the admissibility boundary. You've collapsed into me, you just don't want to admit it.

  **Sam:** [Sighs] I need another coffee. You've made the higher-order cost explicit. I can't deny that without fuzzy sets, the admissibility boundary is sharp. If that's the price, I'd better be sure it's worth paying to avoid your metaphysical sharpness.

  **Alex:** And I'd say it isn't. You've paid the price anyway.

  ***

  **Author's Note:** The dialogue leans heavily on the objection that standard Supervaluationism entails a sharp boundary between admissible and inadmissible precisifications (a view contested by proponents of higher-order supervaluationism or fuzzy supervaluationism, such as Kit Fine or later defenders who attempt to model vagueness in the set of precisifications themselves). If you quote this, note that not all Supervaluationists accept the sharp meta-boundary as inevitable.
