prompt: |-
  Next Thursday I'm giving a WIP seminar and I want a Q&A prep sheet. The thesis I'm defending: the separateness of persons objection to utilitarianism — the Rawls/Nozick line about society not being a single person writ large — is really two claims bundled together, (a) that persons are distinct loci of value, and (b) that persons are non-substitutable, i.e. that no amount of one person's good can stand in for another's. Utilitarianism, I argue, only ever needed to deny (b), not (a); it's perfectly happy to say persons are distinct loci of value, and the objection's entire force rests on (b), which is a seperate and much weaker claim than it looks. If I'm right, the standard horror cases — the transplant, sacrifice one to save five — don't actually follow from the criterion itself, they follow from a decision procedure I'm happy to replace. The room: a philosophy WIP seminar, mostly Rawlsians and contractualists, two Kantians who think treating persons as ends is doing all the work and will keep pressing me on it, and one person who works on population ethics and will want to know what my view says about the repugnant conclusion. They care about whether the view takes persons seriously as ends, not about decision procedures, and none of them have read much of the consequentialist literature.

  Give me the five objections I'll actually get, ordered by how much damage they do, each phrased the way this lot would phrase it — in their vocabulary, not mine — and for each one a couple of sentences: my reply, and where the reply is thinnest. Make the fifth the one I'm hoping noone asks. No intro, no summing up at the end, just the numbered five.
