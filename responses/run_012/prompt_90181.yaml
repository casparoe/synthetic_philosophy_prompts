answer: |-
  This passage is indeed the fulcrum on which James's entire argument turns, and your three puzzles cut directly to the interpretive tensions that have plagued commentators for a century. By sticking closely to the text provided, we can disentangle the commitments James is making here.

  ### 1. "Inherent in certain forms of nerve-action as such"
  **The Claim:** When James writes that feelings of interest or intellectual pleasure "seem to prove that there are pleasures and pains inherent in certain forms of nerve-action as such," he is acknowledging a counter-possibility to his own theory. He is conceding that *some* affective states might be direct properties of central neural processing (intrinsic phenomenal character) without requiring peripheral bodily feedback (viscera, muscles, skin).

  **Does this commit him to a second theory?**
  Strictly speaking, **no**, but it commits him to a **dual ontology of feeling**.
  *   **The Textual Evidence:** He says, "the *only* emotions I propose *expressly to consider* here are those that have a distinct bodily expression." He then sets the non-bodily feelings aside.
  *   **The Interpretation:** He is not endorsing a theory for the non-bodily feelings in this essay; he is bracketing them. However, by admitting they exist ("would, I suppose, be held true by most readers"), he acknowledges that his theory (Emotion = Feeling of Bodily Change) cannot explain *every* affective phenomenon.
  *   **The Implication:** This creates a boundary. For the "coarser" emotions (fear, anger, grief), he argues for the peripheral bodily theory. For "subtler" mental feelings (intellectual satisfaction), he allows they might be "inherent in nerve-action" (centralist). This is not necessarily a contradiction, but it is a limitation. He is claiming that the *paradigmatic* emotions are bodily, while granting that the term "emotion" might loosely cover central feelings that operate differently.

  ### 2. The Restriction and the General Question
  **The Problem:** If he restricts his thesis to emotions with "distinct bodily expression," does he answer "What Is an Emotion?" or does he change the subject?

  **The Function of the Restriction:**
  The restriction is doing **methodological work**, not hidden definitional work.
  *   **The Textual Evidence:** He contrasts the emotions he will consider with feelings "having no obvious bodily expression for their consequence."
  *   **The Argument:** James is aware that if he tries to claim *all* emotional states (including the quiet pleasure of solving a puzzle) are caused by bodily changes, his theory would be immediately falsified. By restricting his scope to emotions with *distinct* bodily expressions, he isolates the cases where the causal link between body and feeling is strongest.
  *   **Does it answer the general question?** It answers it for the **core cases**. James operates on the assumption that if you explain the robust, distinct emotions (rage, terror), you have explained the essence of the category. The restriction protects the theory from "edge cases" (intellectual pleasures) that might dilute the argument. He is effectively arguing: "To understand what an emotion *is*, look at the clearest examples. The vague mental feelings are a different category that we can set aside for now."

  ### 3. "Pale, Colourless" and the Perceptual vs. Cognitivist Reading
  **The Crux:** This is the most critical interpretive hinge. You worry that "pale, colourless" implies a cognitivist base (Judgment) that is merely colored by feeling. Your friend argues James is a proto-perceptual theorist (Emotion = Perception of Body).

  **Arguing from the Passage:**
  The text decisively supports your **friend's substantive reading** (that the emotion *is* the bodily feeling/perception) and rejects the **cognitivist reading** (that the emotion is a Judgment + Feeling).

  *   **The Text:** James writes that without the bodily states, the perception of the object would be "purely cognitive in form, pale, colourless, destitute of emotional warmth."
  *   **The Analysis:**
      1.  **Cognition is not Emotion:** James explicitly states that the cognitive state *without* the body is "destitute of emotional warmth." Therefore, the cognition alone is **not** the emotion. This refutes the worry that he is a cognitivist who just adds a feeling. For a cognitivist, the judgment *constitutes* the emotion. For James, the judgment without the body is just a cold thought.
      2.  **The Identity Claim:** He states expressly: "the feeling of the bodily changes **is** the emotion." He does not say "the feeling of the bodily changes *accompanies* the emotion" or "completes the emotion." He uses the verb "is."
      3.  **Perceptualism:** Your friend calls him a "proto-perceptual theorist." In James's psychology, a "feeling" of a bodily state *is* a perception of that state. When he says "the feeling of the bodily changes is the emotion," he is saying the emotion is the awareness (perception) of the physiological disturbance.
      4.  **The "Pale" Metaphor:** If the cognition is "pale" without the body, the "color" (the emotion) is not an additive quality painted onto a judgment. The "color" *is* the bodily feeling itself. There is no "emotion" remaining if you strip the body away; there is only "cognition."

  **Regarding the "We feel sorry because we cry" line:**
  Your friend claims this famous slogan is "dispensable rhetoric." Based on *this* passage, the friend is half-right and half-wrong.
  *   **Right:** The specific rhetorical flourish isn't in this text.
  *   **Wrong:** The *logic* of the slogan is the core thesis, not rhetoric. The passage argues that the bodily state *precedes* the feeling ("without the bodily states following on the perception..."). If the bodily state is removed, the emotion vanishes. Therefore, the causal order (Body -> Feeling) is the theoretical engine, not a metaphor.

  ### Summary of the Disentanglement
  1.  **Nerve-Action:** James admits some feelings may be central ("inherent in nerve-action") but brackets them to protect his theory. He does not offer a second theory here, but he concedes his theory doesn't cover *every* affective state.
  2.  **Restriction:** The restriction to "distinct bodily expression" defines the **paradigm** of emotion. It prevents intellectual pleasures from falsifying his claim, allowing him to define the essence of emotion through its clearest instances.
  3.  **Pale/Colourless:** This phrase confirms James is **not** a cognitivist. A cognition without a body is *not an emotion*. The emotion *is* the feeling (perception) of the bodily change. Your friend is correct that the emotion is the perception of the body, and incorrect if they imply the bodily connection is merely rhetorical; the text makes the bodily connection the **definition** of the emotion.

  James is claiming that the "warmth" of emotion is not a property of the mind judging the world, but the mind perceiving the body's reaction to the world. Strip the body, and you strip the emotion, leaving only cold cognition.
