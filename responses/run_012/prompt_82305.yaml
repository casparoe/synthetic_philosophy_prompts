answer: |-
  Good evening. For those who don't know me, I'm the guy who's been holding the gavel for the last year. For those who do know me, you know I'm ready to hand it over.

  I've stood at this podium plenty of times. We've talked about feed conversion ratios, oxygen levels, and the price per pound at the dock. We talk about things we can measure. Things we can weigh. But tonight, before I sit down, I want to talk about something I can't weigh.

  Five years ago, I changed how we harvest on my place. We don't drop them straight into ice anymore. We run them through a current first. It knocks them out. It costs me more in labor, more in electricity, and it slows the line down. My crew thinks I've gone soft. My brother thinks I'm putting on a show. And a guy at the co-op told me I'm chasing ghosts.

  They aren't wrong to ask why. Because here is the truth, plain and simple: I don't know if the shrimp feel anything. Nobody does. The scientists argue, the papers contradict, and if anyone tells you they know for sure, they're selling something. But I realized something out by the pond that I want to share with you.

  I don't have to believe a shrimp feels pain in order to stop betting that it doesn't.

  Farming is risk management. We bet on the weather. We bet on the market. We bet on disease. When the risk is high enough, we buy insurance. We don't buy fire insurance because we know the barn will burn. We buy it because we can't afford to be wrong if it does. This change on my farm isn't about morality. It's about risk. It's about looking at the complexity of how these creatures move, how they protect themselves, how they react, and deciding that the chance I'm causing harm is a risk I don't want to carry.

  Now, I know what some of you are thinking. I hear it in the breakroom.

  First, there's the line. The guy at the co-op asked me where it stops. If I worry about the shrimp, do I worry about the flies in the field? The yeast in the tank? The laptop on my desk? If I can't prove it doesn't feel anything, am I just dressing up a feeling as a principle?

  It's a fair question. But we draw lines every single day. We don't harvest the small ones. We don't use certain chemicals anymore. We draw lines based on the best information we have. We know a shrimp has a nervous system far more complex than yeast or a laptop. We know they avoid harm. Is it proof? No. But it's enough data to manage the risk. I'm not saying we need to worry about everything. I'm saying we need to look at what's in front of us and ask if there's a better way to handle it.

  Then there's my brother. He told me straight to my face that this is theater. He said we kill them either way. Thousands a day. One farm doing it gentler changes nothing except my conscience. He said the conscience might be the real reason I do it.

  He's right. It doesn't change the industry. It doesn't change the price you get at the dock. It doesn't save the shrimp from dying. They still end up on a plate. But it changes me. And I've been doing this long enough to know that if you can't sleep at night, the money doesn't matter. If there's a chance I'm causing unnecessary suffering, even if I can't prove it, I'd rather pay the cost to avoid it. That's not theater. That's just trying to leave the barn cleaner than I found it.

  And then there's the hardest part. My father is in the room.

  Dad built this business with his hands in the seventies. He worked harder than any man I know. He did what he had to do to keep us fed and keep this land in the family. He used the methods they had. He used the knowledge they had.

  I am not standing here to say my father was wrong. I'm standing here to say that I am lucky enough to know more than he did. When we learn something new, we don't throw away the past. We stand on it. Dad gave me this farm so I could run it the best way I know how. If I ignored what I've learned just to keep things exactly the way they were, I think that would disrespect him more than changing the harvest method. He was a problem solver. If he were here today, knowing what I know, I believe he'd be out there tweaking the rig too.

  So, I'm not asking you to change. I'm not asking the association to adopt a new standard. I'm just explaining why I did. I'm not better than any of you. I was one of you for thirty years. I still am one of you. I just decided to stop betting on the side of uncertainty.

  We're in a tough business. We deal with mud and water and things that are mostly out of our control. But we control how we treat what's in our care. Whether it's the land, the water, or the stock. We do that because it's good stewardship, and because it lets us look at ourselves in the mirror.

  I've enjoyed serving as your president. It's been an honor to represent people I respect as much as I respect this room. But the gavel doesn't belong to me anymore. It belongs to the person who's going to lead us into the next season.

  So, if you'd all please rise.

  I'd like to propose a toast to the incoming president. May your ponds hold water, your harvests be heavy, and may you always have the courage to do what you think is right, even when nobody is watching.

  To the incoming president.
