prompt: |-
  I run impact and performance at a mid-sized independent foundation — around sixty grants, roughly forty million pounds, three-year funding cycles — and I am the person who turns our trustees' ambitions into the indicator set against which we renew or wind down funding. Twice a year a batch of proposed indicators lands on my desk, some from trustees, some from programme staff, some from grantees trying to be helpful, and each one carries a consequence: money, renewal, a public ranking, a line in the annual report. I have a team of four, no experimental capacity, no causal model of the sectors we fund, and a board that wants numbers it can quote in public. I have read enough about Goodhart's law to be wary of it, and the original formulation — 'any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes' — describes my working life exactly. But every version of the law I have met stops at the warning, and I want the operating manual: a procedure I can run in about an hour, on paper, with one colleague, before I recommend that we adopt, modify or refuse an indicator.

  Please build it out of the four mechanisms that are usually distinguished in discussions of the law, because I am fairly sure they demand different responses and that I have been prescribing the wrong remedy for years. They are: regressional (selecting for an imperfect proxy also selects for the noise in it, so the top of the distribution is systematically worse than it looks); extremal (the relationship was observed in an ordinary range, and a target pushes the system somewhere the relationship no longer holds); causal (acting on the metric changes the underlying situation, so our own intervention destroys the correlation we relied on — the point the Lucas critique makes about econometric relationships used for policy); and adversarial (agents who do not share our goal move the number rather than the thing). For each, give me the symptom my team can actually see in our own data or in a grantee's report, the questions to ask in order, what counts as a sufficient answer, and the remedy that follows, since I suspect the standard fixes are not interchangeable. Include the step I keep skipping: asking what consequence attaches to this number and to whom, because an indicator that is merely discussed is not a target, and a target is a selection pressure on whoever must report it.

  Then run the procedure on three proposals. First, my own favourite and the one I would most like you to approve: a single composite 'impact score' covering the whole portfolio, so that the trustees have one number for the annual report. Second, a grantee-proposed indicator on the number of safeguarding concerns raised by frontline staff, on the theory that more reporting means a healthier culture. Third, an efficiency indicator — cost per person reached — which we would use to compare grantees. I expect the procedure to give me an answer I will not like on at least one of these, and I would rather have that now than in a trustees' meeting. Finally, tell me plainly where the procedure must stop and hand the matter to the board, which of its steps are judgment dressed up as technique, what it cannot do, and what I should do when a target is imposed on us from outside and refusing is not an option.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Head of Impact and Performance at a mid-sized independent foundation (£40m, 60 grants, 3-year cycles). Pragmatic, experienced, aware of Goodhart's Law, frustrated by theoretical warnings without practical tools. Has a small team (4), no experimental capacity, no causal models. Board wants quotable numbers.
      *   **The Problem:** Needs an *operating manual* to evaluate proposed indicators *before* adoption. Needs to distinguish between the four mechanisms of Goodhart's Law (Regressional, Extremal, Causal, Adversarial) because they require different remedies.
      *   **The Task:**
          1.  Build a 1-hour paper-based procedure for evaluating indicators, structured around the four mechanisms.
          2.  Include a specific step on "Consequences & Selection Pressure" (which the user admits skipping).
          3.  For each mechanism: Symptom, Questions, Sufficient Answer, Remedy.
          4.  Run the procedure on three specific proposals:
              *   Composite 'Impact Score' (User's favorite).
              *   Safeguarding Concerns Reported (Grantee proposal).
              *   Cost Per Person Reached (Efficiency comparison).
          5.  Provide a candid conclusion on limitations, judgment vs. technique, and handling external mandates.
      *   **Tone:** Professional, direct, pragmatic, slightly weary but competent (matching the user's voice), no fluff.

  2.  **Deconstruct the Four Mechanisms of Goodhart's Law:**
      *   *Regressional:* The proxy is noisy. Picking the best proxy picks the best noise. *Remedy:* Use multiple measures, shrinkage estimators, don't optimize on the edge.
      *   *Extremal:* The relationship breaks at extremes. *Remedy:* Stay within observed ranges, avoid hard targets at the edge.
      *   *Causal (Lucas Critique):* Intervention changes the structure. *Remedy:* Understand the mechanism, use structural models (hard for this user), or monitor side effects.
      *   *Adversarial:* Gaming. *Remedy:* Audits, random checks, qualitative verification, align incentives.

  3.  **Drafting the Procedure (The "Hour on Paper"):**
      *   Need a structured worksheet approach.
      *   *Step 0:* Consequence Mapping (The missing step). Who feels the pressure? What happens if they miss/hit?
      *   *Step 1-4:* The Four Mechanisms checks.
      *   *Output:* Adopt, Modify, Refuse.

  4.  **Developing the Content for Each Mechanism:**
      *   *Regressional:* Symptom = High variance, outliers look too good. Question = "Is this measure noisy?" Remedy = Average over time, use ranges.
      *   *Extremal:* Symptom = Target is historically unprecedented. Question = "Have we seen this value before?" Remedy = Soft targets, explore why the curve bends.
      *   *Causal:* Symptom = Metric moves but outcome doesn't. Question = "Does hitting this *cause* the good thing?" Remedy = Pair with outcome measures, check for displacement.
      *   *Adversarial:* Symptom = Sudden improvement without resource change. Question = "Who benefits from gaming this?" Remedy = Triangulation, spot checks.

  5.  **Running the Procedure on the Three Proposals:**

      *   *Proposal 1: Composite Impact Score.*
          *   *Consequence:* High stakes (Board/Annual Report).
          *   *Regressional:* High risk. Aggregating noise creates false precision.
          *   *Extremal:* Risk of optimizing for the weighting formula.
          *   *Causal:* Does maximizing the score maximize impact? Unlikely.
          *   *Adversarial:* Grantees will tailor reports to fit the weights.
          *   *Verdict:* **Refuse/Modify heavily.** It's a "vanity metric." Suggest a dashboard instead.

      *   *Proposal 2: Safeguarding Concerns Raised.*
          *   *Consequence:* Grantees feel pressure to show "healthy culture."
          *   *Regressional:* Low volume = high noise.
          *   *Extremal:* Zero is not the goal (paradoxically).
          *   *Causal:* Incentivizes reporting, but does it incentivize *safety*? Might incentivize *recording* minor things to look busy, or hiding major things to look safe.
          *   *Adversarial:* High risk. If the target is "more is better," they might fabricate. If "less is better," they hide.
          *   *Verdict:* **Modify.** Do not target the *number*. Target the *process* (e.g., "Is there a reporting mechanism?").

      *   *Proposal 3: Cost Per Person Reached.*
          *   *Consequence:* Comparison between grantees (ranking/funding).
          *   *Regressional:* "Persons reached" is notoriously noisy/defined differently.
          *   *Extremal:* Cheapest isn't best.
          *   *Causal:* Driving cost down reduces quality/depth.
          *   *Adversarial:* Grantees will inflate "persons reached" or cut essential costs.
          *   *Verdict:* **Refuse for comparison.** Acceptable for internal monitoring *if* definitions are standardized, but dangerous for comparative funding decisions.

  6.  **Addressing the Limitations & Board Dynamics:**
      *   Where does the procedure stop? When political will overrides evidence.
      *   Judgment vs. Technique: Weighting mechanisms, risk appetite.
      *   External Mandates: "Comply and Explain" or "Sandbagging" (setting low targets).
      *   The "No" conversation: How to tell the board their favorite number is dangerous.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Acknowledge the user's constraint (no causal models).
      *   Be firm on the "Impact Score" (since the user likes it, I need to be gentle but firm that it's the most dangerous).
      *   Ensure the "Consequence" step is prominent.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish the remedies? Yes, averaging for regressional, range-checking for extremal, mechanism-checking for causal, auditing for adversarial.
      *   *Check:* Did I answer the specific prompt about the "Consequence" step? Yes, made it Step 0.
      *   *Check:* Is the verdict on the Impact Score clear? It needs to be a "No" or "Major Modify" because composite scores are classic Goodhart traps. I will recommend a Dashboard instead.
      *   *Check:* Is the Safeguarding one nuanced? Yes, the "more is better" theory is fragile.
      *   *Check:* Is the Cost one practical? Yes, warn against cross-grantee comparison.

  9.  **Final Polish:** Organize with clear headings. Use bold text for actionable items. Ensure the "Operating Manual" feels like a tool they can print and use. (Proceed to generate output).

  *(Self-Correction on the "Impact Score"):* The user says it's their favorite. I need to be careful not to alienate them, but the prompt asks me to run the procedure honestly ("I expect the procedure to give me an answer I will not like"). I must be honest: Composite scores are the ultimate Goodhart trap. I will frame it as "Protecting your reputation" rather than "You are wrong."

  *(Self-Correction on Safeguarding):* The theory is "more reporting = healthier culture." This is a specific causal claim. I need to test that specifically.

  *(Self-Correction on Cost):* The risk is comparing unlike things. I need to emphasize the "Extremal" and "Adversarial" risks here.

  10. **Final Structure:**
      *   Introduction (Acknowledging the constraint).
      *   The Procedure (The "One-Hour Paper Test").
      *   Step 0: Consequence Mapping.
      *   Steps 1-4: The Four Mechanisms.
      *   The Three Proposals (Run through the test).
      *   The Limits (Judgment, Board, External mandates).
      *   Closing encouragement.

