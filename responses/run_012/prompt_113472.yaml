answer: |-
  This is a practical manual for the constraint you describe: high stakes, low capacity, no causal models, and a board that demands simplicity. You are correct that the four mechanisms of Goodhart's Law are not the same problem, and treating them as such is why standard advice fails.

  Below is the **One-Hour Paper Test**. It is designed to be printed and worked through with one colleague. It forces you to define the pressure before you define the metric.

  ---

  # The One-Hour Paper Test for Indicators

  **Preparation:** Print this sheet. Set a timer for 60 minutes. Gather the proposed indicator definition and the last two years of relevant data (or proxy data).

  ## Step 0: Consequence Mapping (The Step You Skip)
  *An indicator without consequence is a measurement. An indicator with consequence is a target. A target creates a selection pressure.*

  1.  **Who feels the pressure?** (e.g., The grantee's CEO, the frontline staff, your programme officers, you).
  2.  **What happens if they hit it?** (e.g., Funding renewal, public praise, bonus, reduced reporting).
  3.  **What happens if they miss it?** (e.g., Funding cut, reputational damage, increased scrutiny).
  4.  **Is the consequence proportional to the noise in the metric?**

  *   **Stop/Go Rule:** If the consequence is high (renewal/public ranking) and the metric is noisy (high variance), **REFUSE** the indicator immediately. No further testing is needed.
  *   **Sufficient Answer:** A clear map of who risks loss or gain. If you cannot name the person whose job or budget depends on this number, the consequence is vague, and the risk is lower.

  ---

  ## Step 1: Regressional Goodhart (The Noise Trap)
  *Mechanism: The metric is an imperfect proxy. Selecting for the highest score selects for the highest noise.*

  *   **Symptom:** Outliers look too good to be true. High variance in the data year-on-year without obvious cause.
  *   **Questions:**
      1.  Is this measure a direct count of the outcome, or a proxy? (e.g., "Policy changed" vs. "Lives improved").
      2.  If we rank grantees by this, are the top 10% genuinely better, or just luckier in measurement?
      3.  Do we have enough data points to average out the noise?
  *   **Sufficient Answer:** "We acknowledge this is noisy, so we will not use it for ranking or binary decisions."
  *   **Remedy:** **Aggregation & Shrinkage.** Do not use single-year data. Use a 3-year rolling average. Do not rank; group into bands (High/Medium/Low). Never optimize for the top of the distribution.

  ## Step 2: Extremal Goodhart (The Edge Trap)
  *Mechanism: The correlation holds in the normal range but breaks at the tails. A target pushes the system to the tail.*

  *   **Symptom:** The proposed target is historically unprecedented (e.g., "Increase by 20%" when 5% is the historical max).
  *   **Questions:**
      1.  Has this value ever been observed in our portfolio or sector before?
      2.  If a grantee hits this target, does it require them to operate outside their normal design?
      3.  Are we assuming a linear relationship where there might be a curve (diminishing returns)?
  *   **Sufficient Answer:** "The target lies within the historical 90th percentile of observed performance."
  *   **Remedy:** **Soft Targets.** Use ranges, not points. (e.g., "Between X and Y" rather than "At least X"). Monitor for "breakage" signals (e.g., staff burnout, quality complaints) when metrics approach the edge.

  ## Step 3: Causal Goodhart (The Lucas Trap)
  *Mechanism: Measuring and acting on the metric changes the underlying structure, destroying the correlation.*

  *   **Symptom:** The metric improves, but the qualitative outcome does not. (e.g., Test scores go up, learning stays flat).
  *   **Questions:**
      1.  Does hitting this number *cause* the social good, or does it just accompany it?
      2.  If we force this number up, what behavior will grantees stop doing to make room for it?
      3.  Are we measuring the *capacity* to do good or the *act* of doing good?
  *   **Sufficient Answer:** "We have identified the mechanism linking this metric to the outcome, and we are monitoring a secondary outcome metric to ensure the link holds."
  *   **Remedy:** **Pairing.** Never use a proxy metric alone. Pair it with a qualitative audit or a lagging outcome indicator. If the proxy moves and the outcome doesn't, kill the proxy.

  ## Step 4: Adversarial Goodhart (The Gaming Trap)
  *Mechanism: Agents with different goals manipulate the metric.*

  *   **Symptom:** Sudden, unexplained improvement in the metric immediately after it is announced as a target.
  *   **Questions:**
      1.  Is it easier to change the number or to change the reality?
      2.  Does the grantee have the technical capacity to manipulate the data collection?
      3.  If we were the grantee, how would we hit this target without doing the work?
  *   **Sufficient Answer:** "We have verified that manipulating this number requires doing the actual work, or we have an audit mechanism."
  *   **Remedy:** **Triangulation & Random Audit.** Require evidence that is hard to fake (e.g., third-party verification, site visits). Make the cost of gaming higher than the cost of performance.

  ---

  # Running the Procedure on Your Proposals

  Here is the output of the test on your three specific cases.

  ## 1. The Composite 'Impact Score' (Your Favorite)
  *Proposal: A single weighted number aggregating all portfolio outcomes for the Annual Report.*

  *   **Step 0 (Consequence):** High. This defines your public reputation and trustee satisfaction. Pressure falls on you and Programme Officers to "make the number work."
  *   **Step 1 (Regressional):** **FAIL.** Aggregating noisy metrics does not remove noise; it hides it. The top of the distribution will be statistical artifact.
  *   **Step 2 (Extremal):** **FAIL.** To move a composite score, you will inevitably push grantees toward the metrics with the highest weightings, ignoring unweighted but vital work.
  *   **Step 3 (Causal):** **FAIL.** Maximizing a score is not the same as maximizing impact. Grantees will optimize for the weighting formula, not the social need.
  *   **Step 4 (Adversarial):** **FAIL.** This is the easiest number to game. Grantees will learn which levers move the score and pull only those.
  *   **Verdict:** **REFUSE.**
  *   **Reasoning:** This is the quintessential Goodhart trap. It offers the illusion of control while destroying information.
  *   **Alternative:** A **Dashboard of 3-5 Unweighted Indicators**. Tell the Board: "One number lies. Five numbers tell a story. We will present a dashboard where red and green coexist. If you force me to compress this, I will be compressing truth."

  ## 2. Safeguarding Concerns Raised (Grantee Proposal)
  *Proposal: Count of safeguarding concerns raised by frontline staff. Theory: More reporting = healthier culture.*

  *   **Step 0 (Consequence):** Medium/High. Used to assess organizational health. Pressure on frontline staff to report, and managers to record.
  *   **Step 1 (Regressional):** **PASS (with caution).** Low volumes mean high noise, but if treated as a trend over 3 years, it stabilizes.
  *   **Step 2 (Extremal):** **FAIL.** The relationship is non-linear. Zero concerns is not "perfect safety"; it is likely "fear of reporting." But "infinite concerns" is also failure. The target cannot be "maximize."
  *   **Step 3 (Causal):** **RISKY.** Incentivizing reporting *does* increase reporting, but does it increase safety? It might incentivize reporting trivialities to hit a target, clogging the system, or conversely, if the target is interpreted as "keep it low," it incentivizes hiding.
  *   **Step 4 (Adversarial):** **HIGH RISK.** If the foundation signals "more is better," grantees may categorize non-safeguarding issues as safeguarding. If we signal "less is better," they hide abuse.
  *   **Verdict:** **MODIFY HEAVILY.**
  *   **Reasoning:** Do not target the *number*. Target the *system*.
  *   **Alternative:** Indicator: "Existence of a verified, anonymous reporting channel" + "Evidence of staff training." **Metric:** "Time to resolution of concerns." Do not count the concerns themselves as a performance metric. Use the count only for internal anomaly detection (e.g., if it drops to zero unexpectedly, trigger an audit).

  ## 3. Cost Per Person Reached (Efficiency Comparison)
  *Proposal: Total grant cost divided by beneficiaries. Used to compare grantees for renewal.*

  *   **Step 0 (Consequence):** Very High. Direct comparison leads to funding cuts. Pressure on grantees to cut costs or inflate numbers.
  *   **Step 1 (Regressional):** **FAIL.** "Person reached" is defined differently by every grantee. The noise is structural, not random.
  *   **Step 2 (Extremal):** **FAIL.** The cheapest intervention is rarely the most effective. Pushing for lower cost pushes grantees to the "cheap/light touch" end of the curve where impact often collapses.
  *   **Step 3 (Causal):** **FAIL.** Driving cost down changes the intervention. You are no longer funding the same thing.
  *   **Step 4 (Adversarial):** **CRITICAL FAIL.** This is the easiest metric to game. Inflate the denominator (beneficiaries). Cut essential overhead (the numerator).
  *   **Verdict:** **REFUSE FOR COMPARISON.**
  *   **Reasoning:** You cannot compare cost-efficiency across different models without a causal model of effectiveness. You will select for grantees who are best at counting heads, not best at changing lives.
  *   **Alternative:** Use **within-grantee** trends only. "Is your cost per person stable relative to your own baseline?" Never compare Grant A to Grant B on this metric.

  ---

  # Where the Procedure Stops (And What You Do)

  You asked for the limits of this manual. Here they are.

  **1. Judgment Dressed as Technique**
  Step 0 (Consequence Mapping) is not technical; it is political. When you decide that a consequence is "too high" for a noisy metric, you are making a judgment call about risk appetite. The procedure cannot tell you how much risk the Board should bear. It can only tell you that if they demand high stakes on noisy data, they are buying a lottery ticket, not making an investment. **Action:** Document the risk explicitly in your briefing paper. "Adopting this indicator introduces a 40% risk of misallocating funds due to measurement noise."

  **2. The "Board Wants a Number" Problem**
  This procedure will often conclude "Refuse." Your Board may not accept "Refuse."
  *   **The Limit:** The procedure cannot stop a Board from voting for a bad metric.
  *   **The Workaround:** If a Composite Score is mandated, **decouple it from funding.** Write into the policy that the "Impact Score" is for *communication only* and explicitly state in the Annual Report: "This score is a heuristic for discussion, not a target for grantee performance." This lowers the Consequence (Step 0), which lowers the Goodhart pressure.

  **3. External Mandates**
  When a regulator or major partner imposes a target you know is flawed:
  *   **The Limit:** You cannot refuse.
  *   **The Workaround:** **Sandbag and Triangulate.**
      *   *Sandbag:* Set internal targets lower than the external mandate to allow room for the noise (Extremal fix).
      *   *Triangulate:* Collect the mandated number, but make your internal decisions based on a paired qualitative review (Adversarial/Causal fix).
      *   *Comply and Explain:* Report the number, but include a footnote detailing the known distortion. "Reported cost per head is £50; however, due to X, this does not reflect depth of engagement."

  **4. The Ultimate Constraint**
  This procedure protects you from *predictable* failure. It cannot protect you from *unknown* failure. You have no causal model. You are flying partly blind.
  *   **The Remedy:** Build a "Failure Review" into your cycle. Once a year, take an indicator that performed well, and ask: "Did this actually help?" If the answer is no, kill the indicator even if the data looks good.

  ### Final Advice for the Trustees' Meeting
  Regarding your favorite, the Composite Impact Score:
  Do not walk in and say "This violates Goodhart's Law." They will hear "I am an academic obstructing progress."
  Walk in and say: "If we use this score to make decisions, we will systematically fund the grantees who are best at reporting, not the grantees who are best at impact. I can build you a score for the Annual Report, but I need your agreement that it will not be used for funding allocation. This protects the Foundation from investing in noise."

  That is the only argument that works. It frames the refusal as risk management, not methodological purity.
