answer: |-
  Thanks for laying this out so clearly. It is a classic tension in the field, and I think your intuition that you are talking past each other is correct. If I had to put my own credence on the reducibility claim as you have stated it, I would land at 0.55. I am slightly more skeptical than you are, mostly because the clause no loss of explanatory content is doing a tremendous amount of heavy lifting that often gets ignored in formal ontological discussions. To get there, I need to walk through the decomposition you asked for, and I will attach a rough probability to each step to show how I am weighting the components.

  First, on the question of whether group-level facts supervene on individual-level facts, I am very confident, so I would assign that a probability of 0.95. It is hard to make sense of social ontology without accepting that if you fix all the facts about individuals and their physical environment, you have fixed the social facts. There are no spooky group souls floating above the members of a guild or a village, so in an ontological sense, the social is grounded in the individual. However, conditional on that supervenience holding, the probability that supervenience gets you anything like reducibility is much lower, around 0.4. Supervenience guarantees that there is no difference in the social without a difference in the individual, but it does not guarantee that the individual-level description is accessible, usable, or explanatory in the same way. The bridge from ontological dependence to explanatory equivalence is where the argument usually falls apart.

  Regarding whether group-level properties ever do causal work that no individual-level description does, I assign a probability of 0.5 to the claim that they do something unique. This question is often ill-posed because if supervenience holds, any causal work done by the group is ultimately executed by individuals. However, describing the causation at the group level often captures counterfactual dependencies that are obscured at the individual level. If we look at whether the same group-level property can be realized by very heterogeneous individual-level arrangements, I am quite high on this, around 0.8. A treasury's fiscal capacity can be realized through vastly different configurations of individual beliefs, behaviors, and institutional rules. This multiple realizability means that the individual-level description required to replace the group-level predicate would be a massive, unwieldy disjunction that fails to capture the stable pattern the group-level term identifies.

  Finally, on whether explanation here is interest-relative or contrastive in a way that makes the whole claim truth-valueless, I am at 0.9. Explanation is not just a mapping of causes to effects; it is a pragmatic activity tailored to specific questions. If I ask why the bank failed, I want to know about liquidity ratios and regulatory structures, not the specific neural states or biographical details of every teller. The individual-level story might contain all the information, but it buries the relevant pattern under noise. When I combine these terms, the high probability of supervenience keeps the claim from being false outright, but the low probability of explanatory equivalence and the high probability of multiple realizability and pragmatic interest-relativity drag the final number down to 0.55. The calculation is essentially that while the reduction is ontologically possible, it is explanatorily bankrupt in almost all practical scientific contexts.

  This number is most sensitive to the last term regarding the nature of explanation. If explanation were purely a matter of information content rather than pragmatic utility, my credence would shoot up closer to 0.8. But since explanation involves selecting relevant factors against a background of interests, the individual-level reduction almost always fails to preserve the specific explanatory content requested by the social scientist. This leads me to your distinction between bookkeeping reduction and explanation-preserving reduction. That is a genuine seam, and it is precisely where the action is. Bookkeeping reduction is about ontological inventory, while explanation-preserving reduction is about cognitive utility and pattern recognition. Recognizing this distinction does not change my number much because I already weighted the pragmatic factors heavily, but it clarifies why the debate feels stuck.

  I suspect the divergence between your 0.6 and your friend's 0.9 comes from how you are pricing the sub-question about the nature of explanation. Your friend is likely treating explanation as a purely ontological relation, assuming that if the individual facts determine the group facts, then the individual story tells the same story as the group facts. She is probably conflating bookkeeping reduction with explanation-preserving reduction. She might be thinking that because the individual facts are fundamental, any explanation citing them is automatically superior or equivalent. You, on the other hand, are sensing that the individual-level story loses the forest for the trees, which is why you are hesitant to go all the way to 0.9. She is pricing the ontological dependency high, while you are pricing the pragmatic equivalence lower. It is also possible she interprets in principle more liberally than you do, ignoring the complexity costs that you see as a loss of content.

  To move my number significantly, I would need evidence or an argument showing that individual-level models can generate stable, generalizable laws that map one-to-one with social laws without requiring disjunctive complexity. If you could demonstrate a case where the individual-level explanation was not just possible but actually provided better predictive weight and clearer counterfactuals than the group-level predicate across heterogeneous contexts, that would push me toward 0.7. Until then, the multiple realizability of social kinds and the interest-relative nature of explanation keep me skeptical that the individual-level story can truly replace the group-level one without loss.
