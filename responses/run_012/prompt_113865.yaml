prompt: |-
  I'm taking a philosophy of social science seminar this term and I've ended up in a long-running arguement with my friend about how much of holism survives once you grant supervenience. She's a sociology person, I'm an econ person, and we keep talking past each other, so I want to pin the thing down as a proposition and get your credence on it. Here it is, as tightly as I can state it: every social-scientific explanation that cites a group-level property — the guild's monopoly power, the village's honor culture, the treasury's fiscal capacity, whatever — can in principle be replaced by an explanation that cites only facts about individuals and their interactions, with no loss of explanatory content. Call that the reducibility claim. I'm at about 0.6 on it, she's at about 0.9, and my suspicion is that we're not actually disagreeing about the same question.

  What I'd like from you is your own number and then the decomposition that produces it, written as continuous prose — no headings, no bullet points, no bold, no tables, just paragraphs, like you were explaining it to me over email. In particular I want a rough probability, with a line of justification for each, on: whether group-level facts supervene on individual-level facts; conditional on that, whether supervenience gets you anything like reducibility; whether group-level properties ever do causal work that no individual-level description does, or whether that question is even well posed; whether the same group-level property can be realized by very heterogeneous individual-level arrangements, so that the group-level predicate is carrying predictive weight the individual facts can't; and whether explanation here is interest-relative or contrastive in a way that makes the whole claim truth-valueless. Then tell me how those terms combine into your number and which one it's most sensitive to.

  One thing I keep circling back to, and I'd like your honest read on whether it's a real distinction or just me redescribing the original problem. My seminar came up with two notions: bookkeeping reduction, where you could in principle list every individual-level fact that obtains, versus explanation-preserving reduction, where the individual-level story still does the same explanatory work once you've listed them. My hunch is that almost all of the action is in whether those two come apart, and if they do, where the gap is widest. So: is that a genuine seam, does it change your number, and where do you think my 0.6 and her 0.9 are actually seperate — is she pricing one sub-question differently than I am, or does she think I've mis-stated the claim itself? And what evidence or argument would move your number the most?
