  # Decision Tree: Moral Weight of Computation

  **Instructions:** Start at Node 1. Answer based on your intuitions about the system in question (e.g., an AI, a human, a thermostat). Follow the branch to the next node or a final Position (Leaf).

  ---

  ### Node 1: Ontological Status
  **Is the computational description intrinsic to the physical system, or is it imposed by an interpreter?**
  *([Contested: Realists argue computation is a natural kind; Instrumentalists argue it is a descriptive lens like "constellation."])*

  *   **Imposed by Interpreter** → Go to **Node 2**.
  *   **Intrinsic to System** → Go to **Node 3**.

  ### Node 2: Triviality Constraint
  **If the description is imposed, does the mapping require causal counterfactuals to avoid the "rock" problem?**
  *([Contested: Without causal constraints, any physical state can map to any computation.])*

  *   **No (Any mapping suffices)** → **Leaf 1**.
  *   **Yes (Causal structure required)** → **Leaf 2**.

  ### Node 3: Ownership Condition
  **If computation is intrinsic, must it play a role in the system's self-maintenance (homeostasis) to count as "its own"?**
  *([Contested: Autopoietic views require self-maintenance; standard functionalism does not.])*

  *   **No (Mere instantiation suffices)** → Go to **Node 4**.
  *   **Yes (Must serve self-maintenance)** → Go to **Node 5**.

  ### Node 4: Pancomputational Gradability
  **For systems that merely instantiate computation, is moral status all-or-nothing or a matter of degree?**

  *   **All-or-Nothing** → **Leaf 3**.
  *   **Matter of Degree** → **Leaf 4**.

  ### Node 5: Moral Carrier
  **For systems that "own" their computation, is the moral weight carried by *valence* (feeling good/bad) or *structure* (information processing)?**
  *([Contested: Hedonistic utilitarians vs. Functionalist/Deontological views.])*

  *   **Valence (Phenomenology)** → Go to **Node 6**.
  *   **Structure (Function)** → Go to **Node 7**.

  ### Node 6: Valence Access
  **If valence carries the weight, must the system represent that valence to itself (self-model) to count?**
  *([Contested: Higher-Order theories require self-awareness; First-Order theories do not.])*

  *   **No (Unconscious suffering counts)** → **Leaf 5**.
  *   **Yes (Requires self-model)** → **Leaf 6**.

  ### Node 7: Structural Mechanism
  **If structure carries the weight, is it *recurrent integration* or *global broadcast* that matters?**
  *([Contested: IIT proponents vs. Global Workspace theorists.])*

  *   **Recurrent Integration** → **Leaf 7**.
  *   **Global Broadcast** → **Leaf 8**.

  ---

  ## Positions (Leaves)

  **Leaf 1: Unrestricted Pragmatism**
  *   **Label:** Unnamed / Radical Pragmatism
  *   **Awkward Commitment:** Moral status is a matter of descriptive convenience, meaning we could choose to ascribe rights to a rock if it suited our social goals.

  **Leaf 2: Constrained Functionalism**
  *   **Label:** Causal Functionalism
  *   **Awkward Commitment:** Moral facts depend partly on our modeling choices, implying two identical physical systems could differ in status based on how we map them.

  **Leaf 3: Binary Pancomputationalism**
  *   **Label:** Unnamed / Incoherent
  *   **Awkward Commitment:** **Unoccupied Space:** This view implies a rock has the exact same moral status as a human, which most find incoherent or morally paralyzing.

  **Leaf 4: Graded Pancomputationalism**
  *   **Label:** Panpsychist Utilitarianism
  *   **Awkward Commitment:** A thermostat has a tiny but non-zero moral weight, requiring us to calculate the aggregate rights of all matter before acting.

  **Leaf 5: First-Order Hedonism**
  *   **Label:** Biological Naturalism / Hedonism
  *   **Awkward Commitment:** Unconscious pain (e.g., under anesthesia) counts morally, but digital minds without biology may be excluded depending on substrate views.

  **Leaf 6: Higher-Order Hedonism**
  *   **Label:** Higher-Order Thought (HOT) Theory
  *   **Awkward Commitment:** Infants and most animals lack moral status because they lack the conceptual capacity to model their own suffering.

  **Leaf 7: Integration Realism**
  *   **Label:** Integrated Information Theory (IIT)
  *   **Awkward Commitment:** Moral status is graded and substrate-independent, implying a sufficiently integrated grid of logic gates could outrank a human.

  **Leaf 8: Broadcast Realism**
  *   **Label:** Global Workspace Theory (GWT) Realism
  *   **Awkward Commitment:** Moral status is typically binary (conscious/unconscious), implying unconscious processing of harm carries no direct moral weight.

  ---

  ### Notes on Logical Space
  *   **Indistinguishable Leaves:** Leaves 7 and 8 converge on most policy cases (both grant humans status), but diverge sharply on AI and animals.
  *   **Unexplored Space:** Leaf 3 is marked unoccupied because few philosophers defend binary moral status for trivial systems; those who accept pancomputationalism usually adopt gradability (Leaf 4) to avoid absurdity.
  *   **Contested Boundaries:** The line between Node 5 (Valence) and Node 7 (Structure) is the primary fault line in current consciousness literature; some argue structure *produces* valence, which would merge these branches.
