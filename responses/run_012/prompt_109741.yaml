      *   *Paragraph 3:* Addresses the "innocent" objection. Moves it from consequentialist (bad outcome) to structural (irreversibility asymmetry). Execution destroys repair. Error becomes the punishment itself.
      *   *Paragraph 4:* Anticipates objection (all punishment is irreversible). Rebuts: It's about the *structure* of the gap + documented history of unequal/unreliable application. Conclusion: Death penalty wrong not because desert is false, but because fallible community lacks warrant.

  3.  **Evaluate Against Specific Questions:**

