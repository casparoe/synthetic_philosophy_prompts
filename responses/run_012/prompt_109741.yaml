      *   **Key Concept:** "Irreversibility asymmetry" (execution forecloses correction, changing the epistemic burden).
      *   **Constraint:** Avoid usual deterrence/landmark case recitation. Conceptually crisp but not claiming philosophy settles policy alone.
      *   **Specific Questions to Address:**
          1.  Is the desert-warrant distinction clear/defensible, or does it collapse into rule-consequentialism?
