prompt: |-
  You are advising a small, well-endowed political ethics institute that has committed its next three years — roughly ten researcher-years — to a single topic: the problem of dirty hands in politics. The funders do not want a literature survey. They want an agenda: a ranked set of open questions with a defence of the ranking. They also have a practical bent, since whatever the institute produces should eventually bear on how democratic institutions handle officials who do wrong in the course of serving the public.

  The steering committee has split over how to frame the topic, and that split is part of what you must address. One camp holds that the wrong an official commits stays wrong even when committing it is the right thing to do, so that the official is genuinely guilty and ought to carry that guilt; on this reading the live questions concern what we owe such officials — punishment, gratitude, both, neither — and whether their remorse is a moral requirement or a self-indulgence. A second camp holds that public office is governed by a morality of its own, so that what looks like wrongdoing from the outside is a different, role-specific standard doing its work; on this reading there may be no wrong at all, only a regrettable world, and the live questions concern how roles acquire these permissions, who is bound by them, and whether the permissions survive the move from a single officeholder to a standing bureaucracy that spreads the dirty work across many hands. A third camp holds that the official faces a genuine conflict between two obligations and cannot avoid wrongdoing whichever way they turn; on this reading the live questions are about moral dilemmas themselves — whether they exist, what they do to agency and blame, and how institutions should treat agents who are doomed to fail one way or the other.

  Give me a defended agenda rather than a survey. Which open questions in this area most deserve the institute's limited resources, and in what order? State the criteria you are using — importance, tractability, neglectedness, how many other questions depend on the answer, how quickly an answer would change practice — be explicit about the trade-offs among them, and flag where reasonable people would weight them differently. For each question near the top of your ranking, say why it is upstream of the others, what a competent researcher could realistically accomplish on it in three years, and what evidence or argument during that period would move it up or down the list. Tell me which questions in the area are overrated or do not follow from anything, and which are merely downstream of choosing among the three framings above. Finally, identify which of the institute's eventual conclusions would genuinely change institutional design — accountability rules, oversight, amnesty, whistleblower protection, transitional justice — and which would be interesting only to philosophers.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the Request:**
      *   **Client:** Small, well-endowed political ethics institute.
      *   **Resource:** 3 years, ~10 researcher-years.
      *   **Topic:** Dirty Hands in Politics.
      *   **Goal:** A ranked agenda of open questions (not a literature survey).
      *   **Constraint:** Must address the steering committee's split on framing (Guilt/Remorse vs. Role Morality vs. Genuine Dilemma).
      *   **Orientation:** Practical bent (impact on democratic institutions).
      *   **Requirements:**
          *   Defend the ranking using explicit criteria (Importance, Tractability, Neglectedness, Upstream/Downstream status, Speed of Impact).
          *   State trade-offs and where reasonable people might disagree.
          *   For top questions: Explain upstream status, 3-year realistic output, evidence/arguments that would shift ranking.
          *   Identify overrated/downstream questions.
          *   Identify conclusions that change institutional design vs. those merely philosophical.

  2.  **Deconstruct the Steering Committee Split (The Three Framings):**
      *   *Camp 1 (The Guilt View):* Wrong stays wrong. Official is guilty. Questions: Punishment vs. Gratitude? Remorse required?
      *   *Camp 2 (The Role Morality View):* Public office has its own morality. No wrong, just regret. Questions: How do roles get permissions? Bureaucratic diffusion?
      *   *Camp 3 (The Dilemma View):* Genuine conflict. Doomed to fail. Questions: Nature of dilemmas? Blame? Institutional treatment of doomed agents?
      *   *My Task:* I cannot simply pick one camp and ignore the others. I need an agenda that helps *resolve* or *bypass* this theoretical stalemate to get to practical institutional design. The agenda must be robust enough to yield practical insights regardless of which metaphysical view turns out to be most plausible, *or* it must prioritize questions that determine which view is correct.

  3.  **Establish Criteria for Ranking:**
      *   *Institutional Leverage (Importance):* Does answering this change how we design laws/oversight?
      *   *Upstream Dependency:* Does this answer unlock other answers?
      *   *Tractability:* Can 10 researcher-years actually make progress? (Avoid metaphysical quagmires if possible).
      *   *Neglectedness:* Where is the gap between theory and practice?
      *   *Speed of Impact:* Can we produce something useful within 3 years?

  4.  **Drafting the Agenda - Step-by-Step:**

      *   *Initial Thought:* Should we try to solve the metaphysical debate first?
      *   *Correction:* No. 10 researcher-years won't solve millennia-old meta-ethical debates. If we focus on "Do moral dilemmas exist?", we risk producing pure philosophy with no institutional impact.
      *   *Strategy:* Focus on *Institutional Response* as the primary driver. The theoretical framing matters *only insofar as* it dictates different institutional designs.
      *   *Key Insight:* The three camps imply different institutional architectures.
          *   Camp 1 (Guilt) -> Needs mechanisms for absolution, forgiveness, or calibrated punishment.
          *   Camp 2 (Role) -> Needs clear authorization protocols, chain of command clarity.
          *   Camp 3 (Dilemma) -> Needs support systems, non-punitive review, psychological safety.
      *   *Pivot:* The most valuable question isn't "Which theory is true?" but "Which institutional design is robust across theories?" or "How do we distinguish legitimate dirty hands from corruption?"

      *   *Refining the Top Question:* The biggest practical problem isn't the metaphysics of guilt; it's the *epistemology of authorization*. How do we know *beforehand* or *afterwards* if a dirty act was necessary? This cuts across all three camps. If we can't distinguish "dirty hands for the public good" from "corruption/self-interest," the theory doesn't matter.
      *   *Top Question:* **The Epistemology of Authorization: Distinguishing Necessary Wrongdoing from Corruption.**

      *   *Second Question:* **The Diffusion Problem (Bureaucracy).** Camp 2 raises this. In modern states, dirty hands aren't just the President's; they are spread across agencies. This is highly neglected and practically vital.
      *   *Third Question:* **Post-Act Accountability Mechanisms.** Regardless of guilt/dilemma/role, what do we *do* with the official? Amnesty? Punishment? This addresses Camp 1 & 3 directly.

  5.  **Developing the Content for Each Section:**

      *   *Introduction:* Acknowledge the split. Frame the agenda as "Institutional Robustness" rather than "Metaphysical Truth."
      *   *Criteria:* Define them clearly.
      *   *The Ranking:*
          1.  *Demarcation:* Necessary Evil vs. Corruption. (Upstream, High Impact).
          2.  *Bureaucratic Diffusion:* Who has dirty hands in a bureaucracy? (Neglected, High Practicality).
          3.  *Sanctioning & Reintegration:* What happens after? (Downstream but critical for practice).
      *   *Overrated/Downstream:* Pure meta-ethics (Do dilemmas exist?), Focus on "Remorse" (too subjective for law), Historical case studies without theoretical framework.
      *   *Institutional Design vs. Philosophy:* Clearly map which conclusions change laws vs. which change minds.

  6.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Is ignoring the metaphysical split cowardly?
      *   *Defense:* No, it's strategic. With 10 researcher-years, you can't solve meta-ethics. You *can* solve procedural justice. The agenda should treat the metaphysical split as a variable, not a blocker.
      *   *Critique:* Is "Demarcation" too hard?
      *   *Defense:* It's hard, but it's the *only* thing that matters for prosecutors and oversight bodies. If we can't define criteria for "necessary wrongdoing," we can't build institutions.
      *   *Trade-offs:* Acknowledge that philosophers might hate this pragmatic approach. They want truth; the funders want impact. I need to explicitly state this tension.

  7.  **Final Polish:**
      *   Ensure the tone is advisory, authoritative, yet humble about limitations.
      *   Check all constraints: 3 years, 10 researcher-years, specific criteria, upstream/downstream analysis, institutional design mapping.
      *   Make sure the three camps are addressed in how the questions relate to them. (e.g., Q1 helps decide between Camp 1 and 2).

  8.  **Drafting the Response:** (Mental Outline)
      *   **Executive Summary:** The core strategy (Institutional Robustness).
      *   **Criteria:** Define the 5 metrics.
      *   **The Agenda (Ranked 1-5):**
          1.  Demarcation (Corruption vs. DH).
          2.  Bureaucratic Diffusion.
          3.  Accountability Mechanisms.
          4.  Ex-Ante Authorization.
          5.  The Psychology of the Agent (Remorse).
      *   **Analysis of the Split:** How the agenda navigates the 3 camps.
      *   **Overrated/Downstream:** What to avoid.
      *   **Institutional Impact:** Specific design changes.
      *   **Risk Assessment:** What could move the ranking?

  9.  **Final Review against constraints:**
      *   Did I defend the ranking? Yes.
      *   Did I state criteria? Yes.
      *   Did I address the 3 camps? Yes.
      *   Did I identify institutional changes? Yes.
      *   Is it actionable in 3 years? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  **To:** The Steering Committee, Political Ethics Institute
  **From:** Senior Advisor
  **Subject:** Three-Year Research Agenda: The Problem of Dirty Hands
  **Date:** October 26, 2023

  ### Executive Summary

  The Steering Committee is currently paralyzed by a metaphysical dispute: Is dirty hands a matter of *guilt* (Camp 1), *role morality* (Camp 2), or *tragic dilemma* (Camp 3)? With only ten researcher-years available, attempting to resolve this meta-ethical stalemate is a strategic error. Philosophy has debated this for fifty years without consensus; we will not solve it in three.

  Instead, this agenda adopts a strategy of **Institutional Robustness**. We will treat the three framings not as mutually exclusive truths to be adjudicated, but as competing risk models for institutional design. Our goal is to identify procedures and oversight mechanisms that function effectively *regardless* of which metaphysical view is correct, or that help institutions distinguish between them in practice.

  The priority is shifted from "What is the moral status of the act?" to "How do democratic institutions verify, authorize, and sanitize necessary wrongdoing without enabling corruption?"

  ### Evaluation Criteria

  To rank the following questions, I have applied five weighted criteria. Reasonable people may disagree on the weights, particularly between *Tractability* and *Importance*.

  1.  **Institutional Leverage (Importance):** To what extent does an answer change laws, oversight protocols, or accountability mechanisms? (Highest Weight)
  2.  **Upstream Dependency:** Does answering this question unlock answers to others? (High Weight)
  3.  **Tractability:** Can a team of researchers make definitive progress within 3 years, or is this a metaphysical quagmire? (Medium Weight)
  4.  **Neglectedness:** Is this area under-researched relative to its practical urgency? (Medium Weight)
  5.  **Speed of Impact:** Can preliminary findings be translated into policy briefs within the grant period? (Low Weight)

  **Trade-off Note:** Philosophers on the committee may object that prioritizing *Institutional Leverage* sacrifices truth for utility. My defense is that for an institute with a "practical bent," a true theory that yields no institutional guidance is a failure of mission. Conversely, policymakers may object that *Upstream Dependency* is too abstract. My defense is that without solving the upstream demarcation problem, downstream accountability mechanisms are blind.

  ---

  ### The Ranked Agenda

  #### 1. The Demarcation Problem: Distinguishing Necessary Wrongdoing from Corruption
  *   **Rank:** 1
  *   **Criteria Score:** Leverage (High), Upstream (High), Tractability (Medium).
  *   **Relation to Committee Split:** This question bypasses the split. Camp 1 (Guilt) and Camp 3 (Dilemma) require a way to identify *which* wrongs are necessary. Camp 2 (Role) requires a way to identify *which* roles permit deviations. All three camps collapse if we cannot distinguish "dirty hands for the public good" from "self-serving corruption."
  *   **Why Upstream:** You cannot design accountability (Q3) or authorization protocols (Q4) if you cannot define the boundary of the act in question. If we cannot demarcate, all other research is merely speculative.
  *   **3-Year Deliverable:** A "Decision Tree for Oversight Bodies." A set of evidentiary criteria (e.g., transparency of motive, exhaustion of clean alternatives, proportionality) that inspectors general or ethics commissions can use to classify an act as *potential dirty hands* rather than *criminal corruption* during an investigation.
  *   **Shift Conditions:** This moves **down** if researchers find that "motive" is empirically inaccessible (making the decision tree impossible to apply). It moves **up** if a comparative legal analysis shows existing statutes already implicitly recognize this distinction but lack vocabulary.

  #### 2. The Diffusion Problem: Dirty Hands in Bureaucracies
  *   **Rank:** 2
  *   **Criteria Score:** Leverage (High), Neglectedness (High), Tractability (High).
  *   **Relation to Committee Split:** This directly addresses Camp 2 (Role Morality). Most literature focuses on the "Leader" (President/PM). Modern wrongdoing is distributed (torture memos, drone strike lists, data surveillance).
  *   **Why Upstream:** If dirty hands are distributed, punishing the figurehead (Camp 1 approach) is unjust and ineffective. We must know *where* the moral residue sits before we can assign liability.
  *   **3-Year Deliverable:** A typology of "Moral Buffering" in agencies. Identification of specific bureaucratic structures (e.g., legal sign-offs, compartmentalization) that facilitate dirty hands without individual guilt. Recommendations for "Chain of Ethics" accountability where liability is shared or rotated, rather than pinned on a single scapegoat.
  *   **Shift Conditions:** Moves **up** if case studies reveal that current whistleblower protections fail specifically because they target individuals rather than units. Moves **down** if it turns out bureaucratic diffusion is legally indistinguishable from standard command responsibility.

  #### 3. Post-Act Sanctioning and Reintegration Mechanisms
  *   **Rank:** 3
  *   **Criteria Score:** Leverage (High), Upstream (Low), Speed of Impact (High).
  *   **Relation to Committee Split:** Addresses Camp 1 (Guilt/Punishment) and Camp 3 (Dilemma/Blame). Should the official be pardoned, punished, thanked, or retired?
  *   **Why Upstream:** This is downstream of Q1. However, it is ranked high because it offers the quickest *practical* output. Even if we can't solve the metaphysics, we can propose procedural justice mechanisms.
  *   **3-Year Deliverable:** A model for "Ethics Commissions of Absolution." Unlike criminal courts, these bodies would not determine guilt/innocence but would assess whether an official acted within the "demarcation" (Q1) and recommend specific outcomes: e.g., immunity from prosecution but removal from office, or public censure without legal penalty.
  *   **Shift Conditions:** Moves **up** if a high-profile scandal occurs during the research period highlighting the lack of such mechanisms. Moves **down** if political reality suggests no legislature would ever empower a body to grant "moral amnesty."

  #### 4. Ex-Ante Authorization: Can Dirty Hands Be Pre-Approved?
  *   **Rank:** 4
  *   **Criteria Score:** Leverage (Medium), Tractability (Low), Neglectedness (Medium).
  *   **Relation to Committee Split:** Camp 2 suggests roles grant permissions. This tests the limit of that claim. Can a legislature authorize a specific violation of rights *before* it happens?
  *   **Why Upstream:** If ex-ante authorization is possible, it solves the guilt problem (Camp 1) by converting the act into a role-permitted act (Camp 2). If impossible, it reinforces the Dilemma view (Camp 3).
  *   **3-Year Deliverable:** A comparative analysis of "Emergency Powers" statutes. An assessment of whether specific legislative warrants (e.g., for targeted killing or surveillance) reduce moral residue or merely launder it.
  *   **Shift Conditions:** Moves **up** if researchers find existing legal precedents for specific warrants that successfully limited abuse. Moves **down** if the consensus is that ex-ante authorization inevitably leads to mission creep.

  #### 5. The Psychology of the Agent: Remorse and Public Trust
  *   **Rank:** 5
  *   **Criteria Score:** Leverage (Low), Tractability (Medium), Neglectedness (Low).
  *   **Relation to Committee Split:** Addresses Camp 1 (Is remorse required?).
  *   **Why Upstream:** This is largely downstream. It matters for public perception, less for institutional design.
  *   **3-Year Deliverable:** Survey data on voter tolerance. Do citizens trust officials who express remorse for dirty acts more than those who claim the acts were justified?
  *   **Shift Conditions:** Moves **up** if data shows public trust is the primary constraint on official behavior. Moves **down** (as ranked) because it is less actionable for institutional design.

  ---

  ### Overrated and Downstream Questions

  To ensure resource efficiency, the Institute must explicitly **deprioritize** the following:

  1.  **"Do Moral Dilemmas Exist?" (Meta-Ethical Ontology)**
      *   *Verdict:* **Overrated.**
      *   *Reasoning:* This is the core of Camp 3. It is philosophically fascinating but institutionally inert. An oversight body cannot operate on "maybe dilemmas exist." We must design institutions *as if* they do, or *as if* they don't, based on risk management, not metaphysical truth.
  2.  **"Is Remorse Morally Required?"**
      *   *Verdict:* **Downstream.**
      *   *Reasoning:* This follows from Camp 1. While interesting for moral education, it is too subjective for legal or institutional codification. You cannot legislate inner states. Focus on *external displays* of accountability rather than internal moral requirements.
  3.  **Historical Case Studies without Theoretical Framework**
      *   *Verdict:* **Downstream.**
      *   *Reasoning:* Merely cataloging Truman, Churchill, or Lincoln does not generate norms. Case studies are only valuable if used to stress-test the "Demarcation Decision Tree" (Q1).

  ### Institutional Design vs. Philosophical Interest

  The Funders require a distinction between conclusions that change the world and those that change minds.

  **Conclusions That Change Institutional Design:**
  *   **The Demarcation Criteria (Q1):** If we successfully define evidentiary standards for "necessary wrongdoing," this changes **Prosecutorial Guidelines**. It gives District Attorneys a framework to decline prosecution in public interest cases without setting a precedent for impunity.
  *   **Bureaucratic Diffusion (Q2):** This changes **Whistleblower Protection**. Current laws protect individuals who report specific illegal acts. If dirty hands are structural, we need protections for units or anonymous reporting on *processes* rather than specific crimes.
  *   **Sanctioning Mechanisms (Q3):** This changes **Oversight Architecture**. It argues for a new class of non-judicial ethics tribunal with the power to recommend "moral sanctions" (censure, forced retirement) distinct from criminal penalties.

  **Conclusions Merely Philosophical:**
  *   **The Nature of Moral Residue:** Determining whether the official *feels* guilt or *is* guilty changes nothing about the law, only how we write biographies.
  *   **The Definition of "Public Good":** While important, refining the definition of consequentialism vs. deontology in the abstract will not change how a specific intelligence authorization bill is written.
  *   **Resolution of the Three Camps:** Proving Camp 2 is "correct" over Camp 1 is a victory for a journal article, not for a democracy. The institutional design must be robust enough to handle the uncertainty between them.

  ### Risk Assessment and Flexibility

  This agenda is aggressive. It assumes that political ethics can be operationalized.

  *   **Risk:** The "Demarcation Problem" (Q1) may prove intractable. If, after Year 1, researchers conclude that no objective criteria can separate corruption from dirty hands, the agenda must pivot immediately to **Q3 (Sanctioning)**. We would abandon the attempt to define the act and focus entirely on managing the aftermath (damage control).
  *   **Risk:** Political pushback. If the Institute proposes "Ethics Commissions of Absolution," it may be accused of creating a "get out of jail free" card for elites. Researchers must be prepared to frame this as *increased* scrutiny (a specialized tribunal) rather than *decreased* liability.

  ### Final Recommendation

  Commit 4 researcher-years to **Q1 (Demarcation)**, 3 researcher-years to **Q2 (Diffusion)**, and 3 researcher-years to **Q3 (Sanctioning)**.

  Do not spend resources trying to convince Camp 1 that Camp 2 is right. Instead, build a system that satisfies Camp 1's demand for accountability while acknowledging Camp 2's reality of role-specific pressures. If we succeed, we will not have solved the problem of dirty hands, but we will have built cleaner gloves for those who must handle them.
