      *(Phase 1 Math Check)*:
      Total 16.
      Trip A: Cheap, Med Fun, Far.
      Trip B: Med Cost, High Fun, Near.
      Trip C: Expensive, Low Fun, Med Distance.
      Bloc 1 (6 students): Budget. A > B > C.
      Bloc 2 (5 students): Fun. B > C > A.
      Bloc 3 (5 students): Comfort. C > A > B.
