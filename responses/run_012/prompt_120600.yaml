      B vs C: Bloc 1 (B) + Bloc 2 (B) = 11. Bloc 3 (C) = 5. **B Wins.**
      C vs A: Bloc 2 (C) + Bloc 3 (C) = 10. Bloc 1 (A) = 6. **C Wins.**
      Cycle: A>B, B>C, C>A.
      This works.

      *(Roles)*: I need to print cards.
      *(Debrief)*: Needs to be Socratic.

      *(Limitations)*: Single-peakedness. If preferences were single-peaked (e.g. Left-Center-Right), cycle disappears. This activity creates multi-peaked preferences intentionally. I must mention this.

      *(Strategic Voting)*: I will acknowledge that in reality, Bloc 3 would realize they lose in Agenda 1 and lie in Agenda 2. I will forbid this for the exercise but discuss it at the end.

      Let's assemble the plan.
answer: |-
  # Activity Design: The Architecture of the Majority

  **Course:** Democratic Theory & Social Choice (Year 2 Undergraduate)
  **Class Size:** 16 Students
  **Duration:** 90 Minutes
  **Stakes:** £30 discretionary fund + Authority to plan the end-of-term outing.

  ## Core Concept
  The activity is divided into two distinct phases. In Phase 1, students experience the **Condorcet Cycle** (intransitive majority preferences) through role-based dimensions. In Phase 2, they experience the **Ostrogorski Paradox** (divergence between issue-based and package-based representation). The stakes are real but contingent on the group accepting the procedural outcome.

  ---

  ## Materials & Preparation

  1.  **Role Cards (16 total):** Printed on colored card stock.
      *   **Phase 1 Cards (Blue, Red, Green):** 6 Blue, 5 Red, 5 Green.
      *   **Phase 2 Cards (Type 1-4):** 3 of Type 1, 3 of Type 2, 3 of Type 3, 7 of Type 4.
  2.  **Ballot Slips:** Small slips of paper for secret voting.
  3.  **Whiteboard:** To track vote tallies and agenda orders.
  4.  **The Pot:** An envelope containing the £30 (or a voucher) placed visibly at the front.

  ---

  ## Phase 1: The Cycle (35 Minutes)
  **Goal:** Demonstrate that the winner depends on the order of voting (Agenda Setting), not just preferences.

  ### The Scenario
  "The £30 and the outing plan will be decided by majority rule. There are three proposed packages."

  *   **Trip A (The Budget):** Low Cost, Medium Activity, Long Travel.
  *   **Trip B (The Adventure):** Medium Cost, High Activity, Short Travel.
  *   **Trip C (The Comfort):** High Cost, Low Activity, Medium Travel.

  ### The Roles (Distribute Cards Randomly but ensure counts)
  Do not tell them the global distribution. Tell them their card represents their *personal constraints*.

  *   **Blue Bloc (6 Students): "The Budget Committee"**
      *   Priority: Cost.
      *   Ranking: A (Cheapest) > B (Medium) > C (Expensive).
  *   **Red Bloc (5 Students): "The Activity Group"**
      *   Priority: Fun/Activity.
      *   Ranking: B (High) > C (Low) > A (Medium).
      *   *Note: They rank C above A because even a chill trip is better than a boring one.*
  *   **Green Bloc (5 Students): "The Commuters"**
      *   Priority: Travel Time/Comfort.
      *   Ranking: C (Short) > A (Medium) > B (Long).
      *   *Note: They rank A above B because a long trip to an adventure is worse than a medium trip to a budget site.*

  ### The Procedure
  1.  **Instruction (2 mins):** "You will vote via pairwise majority. The winner of the pair moves to the next round. You must vote sincerely. If you strategize, you corrupt the data, and we cannot learn. The £30 is awarded to the final winner of the *third* agenda we run."
  2.  **Agenda 1 (10 mins):** A vs B → Winner vs C.
      *   *A vs B:* Blue (6) + Green (5) = 11 for A. **A advances.**
      *   *A vs C:* Red (5) + Green (5) = 10 for C. **C Wins.**
      *   *Record Winner: Trip C.*
  3.  **Agenda 2 (10 mins):** B vs C → Winner vs A.
      *   *B vs C:* Blue (6) + Red (5) = 11 for B. **B advances.**
      *   *B vs A:* Red (5) + Green (5) = 10 for B. **B Wins.**
      *   *Record Winner: Trip B.*
  4.  **Agenda 3 (10 mins):** C vs A → Winner vs B.
      *   *C vs A:* Red (5) + Green (5) = 10 for C. **C advances.**
      *   *C vs B:* Blue (6) + Green (5) = 11 for C. **C Wins.**
      *   *(Wait, check math: C vs B. Blue prefers B over C. Red prefers B over C. Green prefers C over B. Blue(6)+Red(5)=11 for B. **B Wins.**)*
      *   *Correction for Agenda 3:* To ensure a *different* winner, run **A vs C** first.
      *   *A vs C:* Blue (6) + Red (5) = 11 for A. **A advances.**
      *   *A vs B:* Blue (6) + Green (5) = 11 for A. **A Wins.**
      *   *Record Winner: Trip A.*

  **Outcome:** Agenda 1 → C wins. Agenda 2 → B wins. Agenda 3 → A wins.
  **Stake:** Announce that Agenda 3 was the "official" procedure, so Trip A gets the money. Watch the Red and Green blocs react (they both prefer B or C over A).

  ---

  ## Phase 2: The Paradox (30 Minutes)
  **Goal:** Demonstrate that a party can win the election while losing every policy issue.

  ### The Scenario
  "We are now voting on the *policy* for the outing, not the trip itself. There are two Parties proposing platforms on three issues: Food, Transport, Accommodation."

  *   **Party X Platform:** (Pub Meal, Public Bus, Hostel).
  *   **Party Y Platform:** (Fine Dining, Private Coach, Hotel).

  ### The Roles (Redistribute Cards)
  *   **Type 1 (3 Students):** Prefer Fine Dining, Private Coach, Hostel. (Matches Y on 2 issues). **Vote Party Y.**
  *   **Type 2 (3 Students):** Prefer Fine Dining, Public Bus, Hotel. (Matches Y on 2 issues). **Vote Party Y.**
  *   **Type 3 (3 Students):** Prefer Pub Meal, Private Coach, Hotel. (Matches Y on 2 issues). **Vote Party Y.**
  *   **Type 4 (7 Students):** Prefer Fine Dining, Private Coach, Hotel. (Matches Y on 3 issues). **Vote Party Y.**
      *   *Wait, I need Party X to win the vote.*
      *   *Correction:* I need the voters to prefer **Party X** overall, but prefer **Party Y's** stances on the issues.
      *   *Revised Roles:*
      *   **Party X:** (Pub, Bus, Hostel) — The "Budget" Option.
      *   **Party Y:** (Fine, Coach, Hotel) — The "Luxury" Option.
      *   **Group 1 (3 Students):** Prefer (Pub, Bus, Hotel). Matches X on 2. **Vote Party X.**
      *   **Group 2 (3 Students):** Prefer (Pub, Coach, Hostel). Matches X on 2. **Vote Party X.**
      *   **Group 3 (3 Students):** Prefer (Fine, Bus, Hostel). Matches X on 2. **Vote Party X.**
      *   **Group 4 (7 Students):** Prefer (Fine, Coach, Hotel). Matches Y on 3. **Vote Party Y.**
      *   *Total:* 9 for X, 7 for Y. **Party X Wins Election.**
      *   *Issue 1 (Food):* G1(Pub)+G2(Pub) = 6. G3(Fine)+G4(Fine) = 10. **Fine Dining (Y) Wins.**
      *   *Issue 2 (Transport):* G1(Bus)+G3(Bus) = 6. G2(Coach)+G4(Coach) = 10. **Coach (Y) Wins.**
      *   *Issue 3 (Sleep):* G2(Hostel)+G3(Hostel) = 6. G1(Hotel)+G4(Hotel) = 10. **Hotel (Y) Wins.**

  ### The Procedure
  1.  **Instruction (5 mins):** Distribute new cards. Explain they must vote for the *Party* that matches their preferences best, then vote on the *Issues* individually.
  2.  **Package Vote (10 mins):** "Raise hands for Party X. Raise hands for Party Y."
      *   Tally: X (9), Y (7). **Winner: Party X.**
  3.  **Issue Vote (10 mins):** "Raise hands for Pub vs Fine Dining." "Raise hands for Bus vs Coach." "Raise hands for Hostel vs Hotel."
      *   Tally: Y wins all three issues.
  4.  **Tension Point (5 mins):** "Party X has the mandate to govern, but their policy was rejected on every single count. Who authorized the Fine Dining? The majority. Who authorized the Budget Package? The majority. How can both be true?"

  ---

  ## Debrief (25 Minutes)
  **Method:** Socratic. Do not lecture. Map their frustration to the theory.

  **1. The Agenda (Phase 1)**
  *   *Prompt:* "In Round 1, Trip C won. In Round 3, Trip A won. Did the group's preferences change between Round 1 and Round 3?"
  *   *Expected Answer:* "No."
  *   *Prompt:* "So what changed?"
  *   *Expected Answer:* "The order." / "The rules."
  *   *Prompt:* "If the order determines the winner, who holds the power in this room?"
  *   *Target:* The person setting the agenda (You).
  *   *Mapping:* "This is the **Condorcet Cycle**. When preferences aren't 'single-peaked' (when we don't all agree on a center), majority rule doesn't find a 'will of the people.' It constructs one."

  **2. The Package (Phase 2)**
  *   *Prompt:* "Party X won the election. But on Food, Transport, and Sleep, the majority voted for Party Y's policies. Is Party X legitimate?"
  *   *Prompt:* "If Party X implements Party Y's policies, have they betrayed their voters? If they implement their own policies, have they betrayed the majority?"
  *   *Mapping:* "This is the **Ostrogorski Paradox**. Bundling issues creates a 'majority' that doesn't exist on the details."

  **3. The Stake & Sincerity**
  *   *Prompt:* "I asked you to vote sincerely. Did anyone feel tempted to lie in Round 2 of Phase 1 to stop a worse outcome?"
  *   *Discussion:* Acknowledge that in the real world, they *would* lie. This activity isolates the structural flaw; strategic voting compounds it.
  *   *Resolution on Money:* "The £30 goes to Trip A (Phase 1 Winner). I know many of you hate Trip A. This is the cost of the procedure we used. Next term, you can design the procedure."

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Rigged" Accusation**
  *   *Risk:* Students claim you stacked the cards to force a cycle.
  *   *Mitigation:* The roles are defensible. During the debrief, ask a Blue student: "Was it unreasonable to prioritize Cost?" Ask a Red student: "Was it unreasonable to prioritize Activity?" When they admit their own logic was sound, the cycle becomes a property of the *group*, not your deck.
  *   *If they revolt:* Ask them to propose a voting system that would have yielded a stable result. They will likely suggest "Borda Count" or "Ranked Choice." Briefly note that Arrow's Theorem suggests those have flaws too, but validate their instinct to change the rules.

  **2. Strategic Voting**
  *   *Risk:* In Phase 1 Agenda 2, the Green bloc realizes C will lose to B, so they vote for A in the first round to save C later.
  *   *Mitigation:* Pre-empt this. "If you strategize, we are no longer testing Democratic Theory, we are testing Game Theory. For this hour, sincerity is the only valid move."
  *   *If it happens:* Use it. "Who voted against their preference? Why? You just proved that under this system, honesty is a losing strategy. That is itself a damning result."

  **3. The Stake Tension**
  *   *Risk:* £30 isn't enough to make them care, or enough to make them angry.
  *   *Mitigation:* The real stake is the *Outing Plan*. Emphasize that the winner gets to decide the *location* and *activity*, not just spend the cash. If they remain apathetic, the lesson fails.
  *   *Fix:* If energy is low, make the "Losing" option explicitly unpleasant (e.g., "Trip A is a 7 AM start at a industrial museum").

  ---

  ## Limitations: What This Activity Cannot Do

  **1. Single-Peakedness Rescue**
  *   *Honesty:* "This activity shows the worst-case scenario. In many real elections, preferences are 'single-peaked' (Left-Center-Right). If everyone agrees there is a 'center,' cycles rarely happen. This seminar shows you why we need to worry when the electorate is polarized or multi-dimensional."

  **2. Strategic Voting**
  *   *Honesty:* "We forced you to be honest. In reality, the Green bloc would have lied in Round 2. This would have changed the winner, but it wouldn't have fixed the cycle—it would have just hidden it. We didn't simulate that today because it would have made the math too noisy to see the structural flaw."

  **3. Intensity of Preference**
  *   *Honesty:* "Votes count heads, not hearts. If the Blue bloc cared 100 times more about Cost than the Red bloc cared about Activity, the vote doesn't show that. We treated all preferences as equal weight. That is a feature of democracy, but also a blindness."

  ---

  ## Minute-by-Minute Timeline

  *   **00-05:** **Intro.** Place envelope on desk. "This money and the outing plan are yours to decide. But you must use the rules I give you."
  *   **05-10:** **Phase 1 Setup.** Distribute Blue/Red/Green cards. Explain Trip A/B/C attributes.
  *   **10-20:** **Phase 1 Voting.** Run 3 Agendas rapidly. Write winners on board.
  *   **20-25:** **Phase 1 Shock.** Reveal the 3 different winners. "Which one is the majority will?"
  *   **25-30:** **Transition.** Collect Phase 1 cards. Distribute Phase 2 cards. Explain Party/Issue setup.
  *   **30-40:** **Phase 2 Voting.** Package vote first, then Issue votes.
  *   **40-45:** **Phase 2 Shock.** Reveal the divergence (X wins election, Y wins issues).
  *   **45-85:** **Debrief.** (40 mins allows for deep discussion). Follow the Socratic prompts above.
  *   **85-90:** **Close.** Award the money to the Phase 1 Agenda 3 winner. "Live with the result. Read [Assigned Text] for next week on how to fix this."
