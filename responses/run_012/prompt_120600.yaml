      Total 16.
      Party A (0,0,0). Party B (1,1,1).
      Group 1 (3 students): Pref 0,0,1. (Matches A on 2). Vote A.
      Group 2 (3 students): Pref 0,1,0. (Matches A on 2). Vote A.
      Group 3 (3 students): Pref 1,0,0. (Matches A on 2). Vote A.
      Group 4 (7 students): Pref 1,1,1. (Matches B on 3). Vote B.
      Total Vote A: 9. Total Vote B: 7. **A Wins Package.**
      Issue 1: G1(0)+G2(0) = 6. G3(1)+G4(7) = 8. **1 Wins.**
      Issue 2: G1(0)+G3(0) = 6. G2(1)+G4(7) = 8. **1 Wins.**
      Issue 3: G2(0)+G3(0) = 6. G1(1)+G4(7) = 8. **1 Wins.**
