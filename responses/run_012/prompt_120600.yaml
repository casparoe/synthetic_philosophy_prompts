prompt: |-
  I teach a second-year undergraduate seminar on democratic theory and social choice — sixteen students, one ninety-minute session, and I would rather not open with a lecture. What I want them to leave with is the sense that "what the majority wants" is not a fact about the group that a vote discovers but an artefact of the procedure, and I want them to arrive at that by doing something rather than by my asserting it. Please design the activity: rules, materials, roles, a scoring scheme that gives them a stake without using real money (the session does have a small genuine stake attached — about thirty pounds of discretionary funds and an end-of-term outing to arrange), a minute-by-minute timeline for the ninety minutes, and the debrief.

  Two things need to happen, and the first is the one I have never got right. They have to reach a decision through a series of pairwise majority votes and find that the majority preference runs in a circle — A beats B, B beats C, C beats A — so that the winner is fixed by the order in which I take the votes. The standard classroom version of this fails because I hand out preference orders that I have plainly arranged to cycle, and the students write the whole thing off as a trick; I want the preferences to fall out of roles that each participant can defend, so that when the circle appears they see it as belonging to the group and not to my card-stack. Something like three blocs, each caring most about a different dimension of the choice and therefore ranking the options differently, with the cyclic structure emerging from that and from nothing else — no bloc doing anything unreasonable, nobody behaving perversely. Then run the same election three times with the whole group, changing only the order of the pairings, so that three different winners come out and nobody has to be told why. The second phase is the one I actually care about, and it needs the decision to be multi-dimensional — a package of positions on several separate questions rather than one flat choice, so that the same underlying question can be voted two ways. I want them to vote once issue by issue and once on whole packages and get opposite answers: an option that carries a majority on every one of the separate questions, while the people who back it on a majority of those questions are themselves a minority of the group. Same voters, same preferences, two entirely defensible ways of counting, two different verdicts about what the majority wanted.

  The debrief should map particular moments onto the underlying results — the agenda round, the point where the issue-by-issue tally and the package tally diverge, the inevitable complaint that the options were badly designed — and it should do this by putting questions to them rather than by lecturing; I know this literature well enough and do not need a reading list, citations, or names, I need the mapping and the prompts that will set them arguing. Tell me what will predictably go wrong the first time I run it and how to handle it; I expect at least one bloc to refuse to accept that its own preferences cycle and to start relitigating the options instead of the aggregation, and I suspect there is a real tension between giving them a stake in the outcome and needing them to vote sincerely, which you should either dissolve or tell me cannot be dissolved. Finally, be honest about what the activity cannot reproduce — I take it that it gives them nothing on strategic voting, and that by exhibiting a cycle it makes the problem look more universal than it is, since actual electorates are often rescued by preference structures the activity will not contain. If either of those can be gestured at cheaply without breaking the arc, say how; if not, say that.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year undergrad seminar, Democratic Theory & Social Choice. 16 students, 90 minutes.
      *   **Goal:** Students must experience that "majority will" is an artifact of procedure, not a discovered fact. No opening lecture.
      *   **Key Mechanism 1 (Condorcet Cycle):** Needs to feel organic, not rigged. Three blocs, distinct dimensions, cyclic preferences emerging naturally. Run three times with different agendas to show different winners.
      *   **Key Mechanism 2 (Ostrogorski Paradox):** Multi-dimensional choice. Vote issue-by-issue vs. vote on packages. Result: Option winning every issue is backed by a minority of voters on the whole package.
      *   **Stakes:** £30 discretionary fund + end-of-term outing arrangement. Needs a scoring scheme (no real money per student, but group stake).
      *   **Debrief:** Socratic, mapping moments to theory, avoiding lecture.
      *   **Troubleshooting:** Predict failure points (bloc refusal to accept cycle, tension between stakes and sincerity).
      *   **Limitations:** Acknowledge what isn't covered (strategic voting, single-peakedness rescue).

  2.  **Deconstruct the Challenges:**

      *   *The "Rigged" Feeling:* To avoid this, preferences must stem from *roles* or *interests* that make sense to the students. If I just hand out "A>B>C", they smell a rat. If I say "You represent the Hiking Club, you care most about Cost," it feels grounded.
      *   *The Stake:* £30 is small for 16 people (£1.87 each). It needs to be meaningful enough to induce sincere voting but not so high that they game the system destructively or refuse to participate. The "outing arrangement" is the real hook.
      *   *Time:* 90 minutes is tight for two complex voting exercises + debrief. Needs strict timing.
      *   *The Paradoxes:*
          *   Condorcet (Cycle): A>B, B>C, C>A.
          *   Ostrogorski (Package vs. Issue): Party X wins Issue 1, Issue 2, Issue 3, but Party Y has more supporters overall.

  3.  **Designing the Scenario (The "Organic" Feel):**

      *   *Scenario:* Planning the End-of-Term Outing. This fits the stake perfectly.
      *   *Options:* Need 3 distinct options for the Cycle. Let's call them Trip A, Trip B, Trip C.
      *   *Dimensions:* Cost, Activity Level, Location/Distance.
      *   *Blocs:*
          *   Bloc 1 (Budget Hawks): Care most about Cost.
          *   Bloc 2 (Adrenaline Junkies): Care most about Activity.
          *   Bloc 3 (Locals/Comfort): Care most about Distance/Time.
      *   *Construction:*
          *   Trip A: Cheap, Low Activity, Far.
          *   Trip B: Expensive, High Activity, Far.
          *   Trip C: Expensive, Low Activity, Near.
          *   *Wait, I need a cycle.*
          *   Let's try:
              *   Trip A: Cheap, Moderate Activity, Far.
              *   Trip B: Moderate Cost, High Activity, Near.
              *   Trip C: Expensive, Low Activity, Moderate Distance.
          *   *Actually, let's simplify.* The standard 3-voter Condorcet cycle is easiest to scale to 3 blocs of 5-6 students.
          *   Bloc 1 (5 students): A > B > C
          *   Bloc 2 (5 students): B > C > A
          *   Bloc 3 (6 students): C > A > B
          *   *How to make this organic?*
          *   Trip A: The "Budget" Trip (Low Cost, Medium Fun, Medium Travel).
          *   Trip B: The "Adventure" Trip (Medium Cost, High Fun, High Travel).
          *   Trip C: The "Chill" Trip (High Cost, Low Fun, Low Travel).
          *   *Preferences:*
              *   Budget Bloc: A (Best Cost) > B (Med Cost) > C (Worst Cost).
              *   Adventure Bloc: B (Best Fun) > C (Med Fun) > A (Worst Fun).
              *   Chill Bloc: C (Best Travel/Chill) > A (Med Travel) > B (Worst Travel).
              *   *Check Cycle:*
                  *   A vs B: Budget (A) + Chill (A) = 11 vs Adventure (B) = 5. **A wins.**
                  *   B vs C: Adventure (B) + Budget (B) = 10 vs Chill (C) = 6. **B wins.**
                  *   C vs A: Chill (C) + Adventure (C) = 11 vs Budget (A) = 5. **C wins.**
              *   *Perfect.* This feels defensible. Each bloc prioritizes one dimension.

      *   *Ostrogorski Scenario:* Needs to be distinct from the Trip to avoid confusion, or a second phase of the Trip. Let's make it the *Policy* for the outing (e.g., Food, Transport, Accommodation).
      *   *Setup:* Two "Parties" proposing packages.
      *   *Party X:* Cheap Food, Public Transport, Hostel.
      *   *Party Y:* Fancy Food, Private Bus, Hotel.
      *   *Voters:* 3 Groups based on priorities.
      *   *Goal:* Party X wins every issue, but Party Y has more overall supporters.
      *   *Math:*
          *   16 Students.
          *   Group 1 (6 students): Prefer Y overall, but agree with X on Food & Transport.
          *   Group 2 (6 students): Prefer Y overall, but agree with X on Food & Accommodation.
          *   Group 3 (4 students): Prefer X overall, agree with X on everything.
          *   *Wait, Ostrogorski requires the majority on issues to differ from the majority of voters.*
          *   Let's use the standard 5-voter model scaled to 15 (plus 1 tie-breaker or just 15). Let's stick to 16.
          *   Issues: 3 (Food, Transport, Sleep).
          *   Party X Policy: (0, 0, 0). Party Y Policy: (1, 1, 1).
          *   Voters need to prefer Y overall (2 out of 3 issues match Y), but prefer X on each specific issue.
          *   Voter Type 1 (6 students): Prefer 1, 1, 0. (Matches Y on 2 issues -> Supports Y overall).
          *   Voter Type 2 (6 students): Prefer 1, 0, 1. (Matches Y on 2 issues -> Supports Y overall).
          *   Voter Type 3 (4 students): Prefer 0, 1, 1. (Matches Y on 2 issues -> Supports Y overall).
          *   *Wait, if everyone supports Y overall, Y wins the package vote.*
          *   *Issue Vote:*
              *   Issue 1: Type 1 (1), Type 2 (1), Type 3 (0). 12 vote 1, 4 vote 0. Y wins.
              *   *This isn't working.* I need X to win the issues.
              *   Let's flip it.
              *   Party X: (0, 0, 0). Party Y: (1, 1, 1).
              *   Voters prefer X on issues, but Y on package? No, Ostrogorski is usually: Party A wins majority of seats/issues, but Party B has more voters.
              *   Let's try:
                  *   3 Issues.
                  *   Party X: (Yes, Yes, Yes). Party Y: (No, No, No).
                  *   9 Voters prefer X overall (match on 2+ issues).
                  *   7 Voters prefer Y overall.
                  *   BUT on Issue 1: 8 vote No, 8 vote Yes. (Tie? Need odd numbers).
                  *   Let's use 15 students for this phase (one sits out as scrutineer) or just manage the 16 carefully.
                  *   *Standard Ostrogorski Construction:*
                  *   3 Issues.
                  *   Group 1 (5 voters): Prefer X on Issues 1 & 2, Y on 3. (Support X overall).
                  *   Group 2 (5 voters): Prefer X on Issues 2 & 3, Y on 1. (Support X overall).
                  *   Group 3 (5 voters): Prefer X on Issues 1 & 3, Y on 2. (Support X overall).
                  *   *Result:* X wins all voters (15-0). X wins all issues (10-5). This is consensus.
                  *   *I need the Paradox.*
                  *   Group 1 (6 voters): Prefer Y on 1 & 2, X on 3. (Support Y overall).
                  *   Group 2 (6 voters): Prefer Y on 2 & 3, X on 1. (Support Y overall).
                  *   Group 3 (4 voters): Prefer Y on 1 & 3, X on 2. (Support Y overall).
                  *   *Total:* 16 voters support Y overall.
                  *   *Issue 1:* Group 1 (Y) + Group 3 (Y) = 10. Group 2 (X) = 6. Y wins.
                  *   *Issue 2:* Group 1 (Y) + Group 2 (Y) = 12. Group 3 (X) = 4. Y wins.
                  *   *Issue 3:* Group 2 (Y) + Group 3 (Y) = 10. Group 1 (X) = 6. Y wins.
                  *   *This is just Y winning everything.*
                  *   *Correct Ostrogorski:*
                  *   Party A: (0,0,0). Party B: (1,1,1).
                  *   Voters are split.
                  *   Group 1 (6 voters): Prefer (0,0,1). Matches A on 2. Supports A.
                  *   Group 2 (6 voters): Prefer (0,1,0). Matches A on 2. Supports A.
                  *   Group 3 (4 voters): Prefer (1,0,0). Matches A on 2. Supports A.
                  *   *Total:* 16 support A.
                  *   *Issue 1:* G1(0) + G2(0) = 12 vs G3(1) = 4. A wins.
                  *   *Issue 2:* G1(0) + G3(0) = 10 vs G2(1) = 6. A wins.
                  *   *Issue 3:* G2(0) + G3(0) = 10 vs G1(1) = 6. A wins.
                  *   *Still no paradox.*
                  *   *The Paradox requires:* Majority of voters prefer Party A, but Majority on *each issue* prefers Party B's stance.
                  *   Let's try:
                  *   Party A: (0,0,0). Party B: (1,1,1).
                  *   Group 1 (6 voters): Prefer (1,1,0). (Matches B on 2). Support B.
                  *   Group 2 (6 voters): Prefer (1,0,1). (Matches B on 2). Support B.
                  *   Group 3 (4 voters): Prefer (0,1,1). (Matches B on 2). Support B.
                  *   *Total:* 16 Support B.
                  *   *Issue 1:* G1(1) + G2(1) = 12 vs G3(0) = 4. B wins.
                  *   *Issue 2:* G1(1) + G3(1) = 10 vs G2(0) = 6. B wins.
                  *   *Issue 3:* G2(1) + G3(1) = 10 vs G1(0) = 6. B wins.
                  *   *Okay, I need the voters to support ONE party, but the ISSUES to favor the OTHER.*
                  *   Group 1 (6 voters): Prefer (0,0,1). Support A (2 matches).
                  *   Group 2 (6 voters): Prefer (0,1,0). Support A (2 matches).
                  *   Group 3 (4 voters): Prefer (1,0,0). Support A (2 matches).
                  *   *Wait, if they support A, they vote for A's stance on the issues.*
                  *   *The Paradox works on "Representation".*
                  *   Voters choose a Party based on which matches them best.
                  *   Group 1 (6): Match A on 1&2, B on 3. -> Vote Party A.
                  *   Group 2 (6): Match A on 2&3, B on 1. -> Vote Party A.
                  *   Group 3 (4): Match A on 1&3, B on 2. -> Vote Party A.
                  *   *Result:* Party A wins 16-0.
                  *   *Issue Tally (based on voter preference, not party vote):*
                  *   Issue 1: G1(0) + G2(0) = 12. G3(1) = 4. Majority wants 0 (Party A).
                  *   *This is hard to construct with 3 issues and simple majorities.*
                  *   *Let's use the standard 5 voter example and scale.*
                  *   Voters 1,2,3 prefer Party A. Voters 4,5 prefer Party B. (A wins 3-2).
                  *   Issues: 3.
                  *   V1: 0 0 1 (Prefers A: 0 0 0)
                  *   V2: 0 1 0 (Prefers A: 0 0 0)
                  *   V3: 1 0 0 (Prefers A: 0 0 0)
                  *   V4: 1 1 1 (Prefers B: 1 1 1)
                  *   V5: 1 1 1 (Prefers B: 1 1 1)
                  *   *Party Vote:* V1,2,3 choose A. V4,5 choose B. A Wins (3-2).
                  *   *Issue 1:* V1(0), V2(0), V3(1), V4(1), V5(1). 3 vs 2. B Wins (1).
                  *   *Issue 2:* V1(0), V2(1), V3(0), V4(1), V5(1). 3 vs 2. B Wins (1).
                  *   *Issue 3:* V1(1), V2(0), V3(0), V4(1), V5(1). 3 vs 2. B Wins (1).
                  *   *Result:* Party A wins the election, but Party B's policy wins on every issue.
                  *   *Scaling to 16:*
                  *   Group A-Supporters (9 students): Split into 3 subgroups of 3.
                      *   Sub 1 (3 students): 0 0 1
                      *   Sub 2 (3 students): 0 1 0
                      *   Sub 3 (3 students): 1 0 0
                      *   (They all prefer Party A's 0 0 0 package over Party B's 1 1 1).
                  *   Group B-Supporters (7 students):
                      *   All 7: 1 1 1
                      *   (They prefer Party B's 1 1 1 package).
                  *   *Party Vote:* 9 for A, 7 for B. **A Wins.**
                  *   *Issue 1:* Sub1(0)+Sub2(0) = 6. Sub3(1)+B(7) = 8. **1 Wins (Party B).**
                  *   *Issue 2:* Sub1(0)+Sub3(0) = 6. Sub2(1)+B(7) = 8. **1 Wins (Party B).**
                  *   *Issue 3:* Sub2(0)+Sub3(0) = 6. Sub1(1)+B(7) = 8. **1 Wins (Party B).**
                  *   *Perfect.* This is the Ostrogorski Paradox.

  4.  **Materials & Roles:**

      *   Need role cards for Phase 1 (The Trip).
      *   Need role cards for Phase 2 (The Policy).
      *   Need ballot papers / show of hands.
      *   Need a visible scoreboard.
      *   Stake: The £30 goes to the winning option in Phase 1? No, Phase 1 is the Cycle. If there's no clear winner, the money is at risk.
      *   *Refinement on Stake:* The £30 is for the outing. If they fail to decide, the instructor decides (boring option). If they decide, they get the money for that option. This creates pressure to find a "will of the group."
      *   *Sincerity vs. Stakes:* If they know the agenda determines the winner, they might lie. I need to emphasize that *sincere* revelation is the only way to test the theory. If they game it, the lesson fails. I will explicitly state: "To test the system, you must feed it truth. If you lie, we only learn that you can lie."

  5.  **Timeline (90 Minutes):**

      *   00-05: Intro & Stake Setup.
      *   05-35: Phase 1 (Condorcet Cycle). 3 Agendas.
      *   35-40: Transition.
      *   40-70: Phase 2 (Ostrogorski). Package vs. Issue.
      *   70-90: Debrief.

  6.  **Troubleshooting & Limitations:**

      *   *Refusal to accept cycle:* Students will say "Just vote on all three at once." I need to block that. "Plurality is off the table. We are testing Majority Rule."
      *   *Stakes:* If they really want the money, they might collude. I need to monitor.
      *   *Limitations:* Single-peakedness. Real politics often has a center. This activity shows the worst case. I need to acknowledge this in the debrief.

  7.  **Drafting the Content:**

      *   *Tone:* Professional, instructional, precise.
      *   *Structure:* Activity Overview, Phase 1, Phase 2, Debrief, Troubleshooting, Limitations.
      *   *Specifics:* Ensure the math works for 16 students.
      *   *Phase 1 Math:* 5, 5, 6 split.
      *   *Phase 2 Math:* 9 (split 3,3,3) vs 7.

  8.  **Refining the Debrief:**

      *   Avoid lecturing. Ask: "Who is unhappy with Winner 1?" "Why did Winner 2 win?" "What changed?"
      *   Connect to "Agenda Setting Power."
      *   Connect to "Representation vs. Policy."

  9.  **Final Review against Constraints:**

      *   16 students? Yes.
      *   90 mins? Yes.
      *   No opening lecture? Yes.
      *   Stake included? Yes (£30 + Outing).
      *   Cycle organic? Yes (Role-based dimensions).
      *   Ostrogorski included? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

      *(Self-Correction during drafting)*: In Phase 1, if I run 3 votes, it takes time. I need to be strict on timing. 10 mins per vote round.
      *(Self-Correction on Phase 2)*: The Ostrogorski setup is complex to explain. I need clear cards. "Your Personal Preference" vs "The Party Package."
