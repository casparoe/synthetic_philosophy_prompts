      *(Wait, one nuance)*: The prompt asks for "a scoring scheme that gives them a stake without using real money." But also says "the session does have a small genuine stake attached." I should use the genuine stake as the primary motivator, but perhaps use a "points" system for the classroom dynamic if the money is too small to care about. No, the prompt says "about thirty pounds... and an end-of-term outing." I should use that. It's real. I will frame it as: "The outcome of this vote determines how the £30 is spent and where we go."

      *(Sincerity)*: I need to address the tension. If they know the agenda matters, they will vote strategically in Round 2 and 3.
      *Solution:* I must collect ballots secretly in Round 1 to establish baselines, but for the "Cycle" to be felt, they need to see the pairwise results.
      *Better Solution:* I tell them: "For this exercise to work as a diagnostic, you must vote your true preference. If you strategize, we are no longer testing the voting system, we are testing your poker skills. We are here to test the system." I will enforce sincerity by asking them to sign their ballots (anonymized later) or just rely on the honor code for the sake of the experiment. Given it's a seminar, honor code is better. I will explicitly state the "Sincerity Condition."

