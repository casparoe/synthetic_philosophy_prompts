answer: |-
  To maximize the utility of a three-year, two-researcher grant, you must prioritize questions where theoretical clarity is a prerequisite for safe experimentation. Futarchy fails catastrophically if the market mechanism incentivizes sabotage rather than truth-telling; it fails merely inefficiently if liquidity is low or legitimacy is contested. Therefore, your research agenda must sequence **mechanism design** before **market microstructure**, and **security** before **sociology**.

  Here is the ranked research agenda, ordered by dependency (how many other answers rely on it), tractability (solvable via theory/simulation without a live city pilot), and implementation impact (whether a negative answer kills the project).

  ### 1. Incentive Compatibility of Conditional Decisions (The "Sabotage" Problem)
  **Question:** *Under what scoring rules and market structures are traders incentivized to maximize the welfare metric rather than profit from policy failure?*
  *   **Dependency:** Critical. If traders can profit by betting against a policy and then sabotaging its implementation (or vice versa), no other mechanism features matter.
  *   **Tractability:** High. This is a game-theoretic problem solvable through modeling and simulation.
  *   **Impact:** Existential. If this cannot be solved, futarchy is dangerous for a city.
  *   **Rationale:** In standard prediction markets, you profit if your prediction comes true. In futarchy (decision markets), your profit might depend on the *decision* made. If I short a policy, I may have an incentive to ensure it fails, even if it would have succeeded. Researchers must design a mechanism where the profitable bet is always aligned with the true expected welfare.

  ### 2. Oracle Security and Resolution Integrity
  **Question:** *How do we construct a resolution authority for the welfare metric that is immune to bribery, bias, or capture by large market participants?*
  *   **Dependency:** High. Markets cannot settle without an oracle. If the oracle is corruptible, the market prices corruption, not welfare.
  *   **Tractability:** Medium. Requires institutional design theory and cryptographic oracle research (e.g., Kleros-style schemas).
  *   **Impact:** Critical. A compromised oracle renders the metric meaningless.
  *   **Rationale:** You stipulated the metric is "given and measurable," but *who* measures it? In a city context, this is a government agency. If traders can bribe the agency to report low welfare to win short bets, the system collapses. This is distinct from the metric definition; it is about the security of the measurement pipeline.

  ### 3. Liquidity Subsidization and Manipulation Resistance
  **Question:** *What is the minimum liquidity required to prevent price manipulation by actors with a policy preference, and how can the city subsidize this without distorting prices?*
  *   **Dependency:** Medium. Depends on Incentive Compatibility (Q1) being solved first.
  *   **Tractability:** High. Market microstructure theory and agent-based modeling.
  *   **Impact:** High. Thin markets are easily manipulated, leading to bad policy choices.
  *   **Rationale:** Even with perfect incentives, a thin market allows a wealthy ideologue to move prices and force a bad policy. Researchers need to model the cost of manipulation vs. the cost of subsidization (e.g., via market makers).

  ### 4. Metric Endogeneity and Goodhart's Law (Your Specific Worry)
  **Question:** *To what extent does selecting policy via market optimization degrade the validity of the welfare metric itself over time?*
  *   **Dependency:** Low. This is a second-order problem relative to Q1 and Q2.
  *   **Tractability:** Low. Hard to model without longitudinal data.
  *   **Impact:** Medium. This leads to long-term decay, not immediate collapse.
  *   **Rationale:** See below for direct address.

  ### 5. Political Legitimacy and Legal Authority
  **Question:** *What governance framework allows a city to bind itself to market outcomes without violating democratic norms or legal statutes?*
  *   **Dependency:** Low. This is an adoption barrier, not a theoretical blocker.
  *   **Tractability:** Low. Requires political science fieldwork, not just theory.
  *   **Impact:** High for adoption, low for mechanism safety.
  *   **Rationale:** A safe system that isn't adopted is a failure, but an adopted system that is unsafe is a disaster. Safety research takes precedence.

  ---

  ### Addressing Your Specific Worry: Metric Endogeneity
  You asked whether the deepest problem is that *"a market-approved policy can itself change how the metric is defined or measured."*

  **Verdict:** This is a **distraction from more basic difficulties**, specifically Q1 (Incentives) and Q2 (Oracles).

  **Argument:**
  1.  **Incentives Precede Measurement:** If the incentive structure (Q1) allows traders to profit from policy failure, they will sabotage the policy regardless of how the metric is defined. If the incentive structure is aligned, traders have a financial interest in *preserving* the metric's validity, because a corrupted metric makes their bets unpredictable. Therefore, solving incentives mitigates the risk of metric manipulation.
  2.  **Oracle vs. Definition:** The risk is rarely that the *definition* changes (e.g., "GDP" means something new), but that the *measurement* is corrupted (e.g., the Bureau of Statistics is bribed). This is an Oracle Security problem (Q2), not a philosophical metric problem.
  3.  **Goodhart's Law is Universal:** Any optimization process (legislatures, AI, markets) suffers from Goodhart's Law. Futarchy does not introduce this; it merely exposes it to market efficiency. The unique risk of futarchy is not that the metric degrades, but that the market *accelerates* the search for loopholes. This is manageable if the Oracle (Q2) is robust and the Metric is updated via a separate governance layer (which you treated as given).

  **Conclusion:** Do not allocate the bulk of the three years to metric philosophy. Allocate it to ensuring the market doesn't eat the metric.

  ---

  ### Overrated Worries
  1.  **Trader Irrationality:** It is widely feared that noise traders will distort prices. In liquid markets with arbitrageurs, this is usually priced in. It is less dangerous than *rational* sabotage.
  2.  **Complexity of Policy:** Critics argue markets cannot understand complex city policy. However, markets do not need to understand the *mechanism*, only the *outcome*. They price the probability of the metric value, not the policy details.
  3.  **Volatility:** Price swings are features, not bugs. They represent updating information. Stability mechanisms often hide information.

  ---

  ### The Reordering Event
  My ranking would change if, within the next two years, a **decentralized cryptographic oracle network** demonstrates robust, bribery-resistant resolution of real-world economic data at scale.
  *   **Why:** If Q2 (Oracle Security) is solved technologically (e.g., via optimistic verification or cryptoeconomic security), the research focus shifts immediately to Q5 (Legitimacy) and Q4 (Metric Endogeneity), because the technical barriers to safe settlement would be lowered, making the social and long-term economic risks the binding constraints.

  \answer{Incentive Compatibility of Conditional Decisions}
