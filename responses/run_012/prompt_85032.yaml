prompt: |-
  I'm leading a session of a continuing-ed reading group next month on Hobbes's views on geometry. The group has read Leviathan and a bit of Descartes, so they know Hobbes as the social contract guy, and most of them assume his geometry was just a cranky side obsession he should've kept to himself. I want to disabuse them of that without turning it into a lecture on 17th-century mathematics. Plan the session for me — don't just explain Hobbes's view.

  What I need: the order the pieces have to come in so that the claim that geometry is demonstrable because we make the figures ourselves lands as a real philosophical position rather than a slogan. I'm thinking the whole thing hinges on the maker's-knowledge idea and then the kinematic definitions — geometry as the science of motion, lines generated by moving points, that sort of thing — but tell me if the sequence should start somewhere else. Which single example should carry the whole thing, and what does it need to have (and lack) for that to work? I'm guessing the circle or the triangle generated by motion, but maybe that's too easy and they'll just think it's trivial. The misconceptions they'll bring or form — I'm guessing 'so geometry is arbitrary then?', 'demonstrable just means self-evident', 'this has nothing to do with his politics' — and exactly where in the sequence I should head each one off. Also, where does the politics come in? On his view the commonwealth is something we make, so civil philosophy is demonstrable in the way geometry is — I want that to feel like a payoff, not a bolt-on, so say where it belongs in the arc.

  One question I can ask at the end to see whether they've actually got the maker's-knowledge idea rather than just nodding. And what I should openly say we're skipping: the squaring-the-circle mess, the Wallis feud, the algebra-vs-geometry priority fight — or do some of those need to be in there for the main idea to make sense? I don't want to leave them thinking he was just bad at math and that's the whole story.

  After the plan, give me a JSON summary with this schema: { "sequence": [ { "step": 1, "idea": "...", "why_it_has_to_come_here": "..." } ], "carrying_example": { "example": "...", "must_have": ["..."], "must_lack": ["..."] }, "misconceptions": [ { "misconception": "...", "where_in_sequence": "...", "how_to_head_off": "..." } ], "check_for_understanding": "...", "leave_out": ["..."] }
