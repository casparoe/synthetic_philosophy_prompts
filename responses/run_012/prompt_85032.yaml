answer: |-
  Here is a session plan designed to move your group from seeing Hobbes's geometry as a "cranky hobby" to recognizing it as the epistemological engine of his entire political project.

  ### Session Plan: The Architecture of Certainty

  **1. The Hook: Acknowledge the Elephant (10 mins)**
  Start by validating their intuition. Yes, Hobbes was objectively wrong about the math. Yes, he fought bitterly with Wallis. Yes, he tried to square the circle and failed. If you stop there, he's a crank. But ask: *Why did a political philosopher care so much about this?*
  *   **Move:** Frame the geometry not as a mathematical project, but as an *epistemological* one. Hobbes isn't trying to improve math; he's trying to find a model for *certainty* in a world of religious and civil war.

  **2. The Foundation: Science as "Knowledge of Consequences" (15 mins)**
  Before touching geometry, define *Scientia* (Science) for Hobbes.
  *   **Concept:** For Hobbes, science isn't observing nature (that's "prudence" or guesswork). Science is reasoning from definitions to consequences.
  *   **Why here:** If they think science = empirical observation, they will never understand why "making figures" matters. You must establish that for Hobbes, true science requires *deductive certainty*, which observation cannot provide.

  **3. The Core: The Maker's Knowledge Principle (20 mins)**
  Introduce the claim: *We can only have demonstrative science of things we construct ourselves.*
  *   **Argument:** We know the clock because we built the gears. We don't know the stars because we didn't build them (we can only guess their causes).
  *   **Misconception Check:** Head off "Arbitrariness" here. Just because we make the definitions doesn't mean the consequences are arbitrary. Once we define the generation, the consequences are necessary.

  **4. The Carrying Example: The Circle Generated by Motion (20 mins)**
  Do not draw a static circle. Describe a **radius rotating around a fixed point**.
  *   **Why this example:** It is simple enough to avoid math anxiety, but complex enough to show *causality*.
  *   **Execution:** Ask the group: "How do we know the properties of this circle?"
      *   *Wrong answer:* "Because we measure it." (That's empirical/probabilistic).
      *   *Hobbes's answer:* "Because we know the motion that created it."
  *   **Key Insight:** The truth of the geometry lies in the *cause* (the motion we stipulated), not the *object* (the shape on the page). Because we stipulated the motion, we know the cause perfectly. Therefore, we know the effect perfectly.

  **5. The Limit: Why Physics Fails (10 mins)**
  Contrast the circle with a storm or a human body.
  *   **Argument:** We did not generate the storm. We can observe the effect, but we cannot know the cause with certainty. Therefore, natural philosophy is always probabilistic.
  *   **Why here:** This creates the tension that requires a solution. If we can't know nature, what can we know?

  **6. The Payoff: The Commonwealth as Artifact (20 mins)**
  Bring it home to *Leviathan*.
  *   **Argument:** The Commonwealth is not natural (like a family or a herd). It is *artificial*. We make it via Covenant, just as we generate a circle via motion.
  *   **Conclusion:** Because we make the Commonwealth, we can have demonstrative science of politics. We can know the "properties" of sovereignty (consequences) because we know the "generation" (the social contract).
  *   **Reframing the Crank:** His geometry wasn't a distraction; it was the proof-of-concept for his politics. He needed geometry to be a science of *making* so that politics could be a science of *making*.

  **7. Wrap & Check (5 mins)**
  Pose the understanding question (see below). Briefly mention that while his *math* was wrong (he ignored algebraic advances), his *philosophy of construction* anticipated later constructivist views in Vico and Kant.

  ***

  ### Specific Guidance on Elements

  **The Carrying Example: The Circle Generated by Rotation**
  *   **Why:** A line is too atomic (feels like semantics); a triangle is too static. The circle defined by a rotating radius captures the *temporal* and *kinematic* essence of Hobbes's materialism without requiring calculation.
  *   **Must Have:** The explicit stipulation of **motion over time**. The definition must be "the figure described by a line segment rotating around one endpoint," not "the set of points equidistant..."
  *   **Must Lack:** Specific measurements (pi, radius length). If you talk numbers, they will drift into "was he right about pi?" Keep it qualitative/causal.

  **Misconceptions & Interventions**
  1.  **"So geometry is arbitrary then?"**
      *   *Where:* Step 3 (Maker's Knowledge).
      *   *Fix:* Distinguish between *definitions* (which we choose) and *consequences* (which are necessary once defined). We choose to make a circle, but we don't choose that its circumference relates to its diameter. The *making* grants access to the *necessity*.
  2.  **"Demonstrable just means self-evident."**
      *   *Where:* Step 2 (Science as Consequences).
      *   *Fix:* Emphasize that "demonstration" for Hobbes is a chain of reasoning from cause to effect. Self-evidence is static; demonstration is dynamic (like the motion of the radius).
  3.  **"This has nothing to do with his politics."**
      *   *Where:* Step 6 (The Payoff).
      *   *Fix:* Force the parallel. Nature = God's artifact (we can't know it). State = Man's artifact (we can know it). Without the geometry model, *Leviathan* is just opinion. With it, *Leviathan* claims to be science.
  4.  **"He was just bad at math and that's the story."**
      *   *Where:* Step 1 & 7 (Bookends).
      *   *Fix:* Admit he was bad at the *calculation*, but insist he was profound about the *justification*. The feud with Wallis was about *method* (geometry vs. algebra), not just answers.

  **The Check-for-Understanding Question**
  *"If Hobbes met a modern economist who claims to have discovered 'laws of the market' through data analysis, would Hobbes consider that 'Science' (Scientia)? Why or why not, based on the Maker's Knowledge principle?"*
  *   *Correct answer:* No. We did not make the market (it's a natural/spontaneous phenomenon), so we can only have probabilistic prudence about it, not demonstrative science. We could only have science of a *planned* economy we constructed entirely ourselves.

  **What to Leave Out**
  *   **The Squaring of the Circle:** Mention it only as the *occasion* for the feud, not the *content*. The technical error is irrelevant to the philosophical point.
  *   **Algebra vs. Geometry:** Don't get into symbolic vs. visual reasoning. It distracts from the "construction" argument.
  *   **The Specifics of the Wallis Feud:** No need to name dates or specific pamphlets. It personalizes it as a grudge match rather than a philosophical clash.

