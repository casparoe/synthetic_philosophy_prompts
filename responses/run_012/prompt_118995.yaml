      *   **The Core Question:** Is Hofstadter's analogy deep (structural identity) or merely suggestive (contingent similarity)? If Gödel is right that self-reference is dispensable, does that undermine Hofstadter?
      *   **Specific Questions:**
          1.  What does Gödel's footnote actually claim? (Device vs. Source).
