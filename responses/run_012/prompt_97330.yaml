              *   Social: Hearer reliance licensed? If mechanism is reliable, yes.

  4.  **Evaluate the "Dissolution vs. Relabeling" Question:**
      *   Does distinguishing the questions solve it?
      *   *Pros:* It clarifies why people talk past each other. One person says "It's wrong" (Truth), the other says "He's not blameworthy" (Justification).
      *   *Cons:* The substantive disagreement remains. *Which* norm governs the constitutive rule? Williamson says Knowledge. Others say Truth. Even if we agree there are three questions, we still fight over the answers.
