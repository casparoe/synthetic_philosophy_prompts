      *   It looks like reconciliation if it explains the *function* of assertion. E.g., Assertion aims at truth (correctness) but requires knowledge to undertake the commitment (to protect the hearer).
      *   *Critique:* It risks being ad hoc. Why knowledge for commitment? Why not justification?
