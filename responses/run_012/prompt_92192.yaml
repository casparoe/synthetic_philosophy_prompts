answer: |-
  Building benches that physically prevent sleeping presupposes that material constraints can enforce social order without human intervention, which functionally commits you to the view that artifacts embody politics even if a technological neutralist can defend the decision by locating agency solely in the procurement process.

  This implicit view treats the bench as a "silent governor," delegating moral authority to steel and concrete so that exclusion becomes a permanent feature of the environment rather than a contingent human act. It aligns with Langdon Winner's argument that technologies can embody specific forms of power and authority, making certain political outcomes inevitable regardless of who is watching. By hardcoding exclusion into the object, the city ensures the policy persists even when cops aren't around, effectively turning the infrastructure into a permanent law enforcement officer that never sleeps and never exercises discretion.

  However, this practice fits just as well with instrumentalism, where the bench is a neutral tool employed to achieve a policy goal decided elsewhere. A technological neutralist can defend building these by arguing the bench itself has no moral valence; it is merely the efficient means to enact the city's decision to prioritize seated transit users over sleepers. On this rival view, the politics resides entirely in the human decision to purchase the bench, not in the bench's geometry, meaning your friend is correct that the designers' intentions are irrelevant to the object's neutrality, but incorrect that the object isn't serving a political end. The practice strictly needs to assume only that physical discomfort is a legitimate and effective method of behavioral regulation; it does not need to assume the designers intended exclusion, only that the design produces it. This means the political effect exists regardless of whether the designer was thinking about homelessness or ergonomics, separating the object's function from the creator's mind. The contingent alignments include the city's hypocrisy regarding compassion campaigns, which highlights the conflict but isn't required for the bench to function politically; the bench works as exclusion even if the city believes its own ads.

  If you swapped this for the opposite view—that objects should not enforce social order—you would have to replace the benches with flat, comfortable surfaces and shift the burden of enforcement back to human agents. The procurement process would prioritize universal comfort over behavioral modification, and the city's stated values would need to align with either providing shelter or tolerating loitering, rather than outsourcing exclusion to hardware. You would see more outreach workers and fewer armrests, acknowledging that managing public space is a human ethical challenge, not an engineering problem, and forcing the city to visibly confront the contradiction between its compassion campaigns and its enforcement actions rather than hiding it in the design specs.
