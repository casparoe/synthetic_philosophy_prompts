answer: |-
  Consider a municipal traffic-light control routine, a narrow script managing a single junction. It has no general agency, cannot resist shutdown, and operates within fixed hardware constraints. An observer records only the duration of green lights allocated to Main Street versus Side Street, and the aggregate vehicle wait times measured by sensors. There is no access to the code's weights or internal reward functions.

  Over a six-month period, the environment remains statistically identical: traffic volume and composition do not change. Yet the behaviour shifts. In Month One, the routine allocates seventy per cent of green-light cycles to Main Street. In Month Two, without any change in traffic flow, it allocates seventy per cent to Side Street. By Month Six, it has reverted to favouring Main Street. An analyst applying the value-variation test holds the environment fixed and compares behaviour across time. Seeing the preference flip-flop without external cause, they conclude the system's priorities are unstable. The values have drifted. Since influence-seeking presupposes a fixed objective pursued robustly, this analyst concludes the system is not seeking influence; it is merely drifting.

  A second analyst applies the environment-variation test. They simulate counterfactual traffic scenarios while observing the system's actual responses over the same period. When Main Street congestion spikes, the routine shifts cycles to Side Street to clear the gridlock. When Side Street congestion spikes, it shifts to Main Street. Crucially, across all these variations, the system maintains a constant aggregate wait time of exactly four minutes per vehicle. It instrumentally swaps which street receives priority to preserve this invariant metric. This analyst sees a fixed objective (minimise total wait) pursued robustly across environmental changes. They conclude the objective has not drifted. Because the system reaches for whatever lever preserves the metric against environmental pressure, this reading is consistent with influence-seeking.

  The contradiction is stark. The first analyst sees a system that changes its mind about what matters (Main Street vs Side Street), implying value drift and ruling out influence-seeking. The second analyst sees a system that never changes its mind about the outcome (four-minute wait), implying no drift and confirming influence-seeking. Both conclusions rest on recorded behaviour: the time-series of light allocations and the input-output mapping of congestion to cycle duration. Neither appeals to hidden internals.

  Which observations separate the readings? The time-series data alone supports the drift hypothesis. The input-output response matrix supports the fixed-objective hypothesis. They are indistinguishable if one records only the light allocations without correlating them to the wait-time invariant. However, even with full data, the labels conflict because they are keyed to different counterfactuals. The value-variation test asks: "Is the behaviour stable over time?" The environment-variation test asks: "Is the outcome stable across worlds?" A system can exhibit behavioural instability over time (drift) while maintaining outcome stability across environments (influence-seeking), if the environment itself contains unobserved micro-variations that trigger the behavioural shifts. In this case, the Month One to Month Two shift may have been a response to a sensor calibration drift invisible to the macro-observer but detected by the routine.

  Are the labels underdetermined or inconsistent? They are genuinely inconsistent. They describe mutually exclusive narratives about the system's stability. One narrative claims the goalpost moved; the other claims the goalpost remained fixed while the player moved. Since we cannot stipulate the hidden objective, we cannot adjudicate which counterfactual is the 'true' one. The system instantiates the behavioural profile of both, depending on which slice of reality one treats as the control variable. The distinction collapses because the tests measure different properties of the same trajectory.

  \answer{both}
