answer: |-
  **MEMORANDUM**

  **TO:** Public Safety and Health Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Permanent Sex Work Policy Framework

  **Recommendation**

  Following the conclusion of our two-year pilot program, I recommend the Committee move forward with **Option 2: Full Decriminalization (the New Zealand Model).** This approach repeals criminal offenses for sellers, buyers, and third parties, regulating the industry through standard labor, zoning, and health codes rather than a specialized licensing regime.

  While Option 3 (Licensing) appears most robust on paper, and Option 1 (Nordic Model) aligns with traditional abolitionist sentiments, only Option 2 satisfies the core test of this Committee: does this policy actually increase safety and agency for the workers currently in the system? The answer, demonstrated by the specific aspirations of our pilot participants, is yes.

  **The Worker Cooperative Test**

  The decisive factor in this evaluation is the concrete case of the workers from our two licensed pilot venues. These individuals have organized and expressed a clear desire to operate their own venue as a worker cooperative. They intend to own the business, split the proceeds, and manage their own safety without an outside owner.

  We must measure our policy options against this specific request.
  *   **Under Option 1 (Nordic):** This cooperative is illegal. The Nordic model criminalizes any third party profiting from a sale. A cooperative is, legally, a third-party entity owned by the workers. By banning "pimping" broadly to protect victims, this model inadvertently criminalizes workers attempting to pool resources for safety. It protects workers only by forbidding them from working together.
  *   **Under Option 3 (Licensing):** This cooperative is theoretically possible but practically impossible. The compliance costs for licensed venues—security systems, specific zoning, administrative overhead—require capital these workers do not have. To raise that capital, they would need outside investors. Those investors would demand control, effectively reinstating the "boss" structure the workers are trying to escape.
  *   **Under Option 2 (Decriminalization):** The workers can form a cooperative. They are treated like any other small business owners. They can lease a space, implement their own safety protocols, and call upon standard labor protections without fear that their business structure is itself a crime.

  If our goal is dignity and safety, we cannot endorse a regime that looks protective but forbids workers from organizing the very safety measures they requested.

  **The Consent Objection**

  A Committee member has raised a significant philosophical objection: *The state cannot treat a worker's consent as valid enough to permit a sale, but invalid enough to justify heavy state intervention in how that sale is conducted.*

  This objection strikes at the logic of Option 1 and Option 3. Both imply that while the act may be tolerated, the worker is not fully competent to manage the risks without state guardianship. Option 1 treats the seller as a victim who cannot consent to the transaction's structure; Option 3 treats the seller as a vector of disease or disorder requiring containment.

  Option 2 resolves this contradiction. It accepts that if an adult consents to the transaction, they possess the agency to determine the conditions of that transaction. This does not mean the state abandons them. It means we shift from *policing morality* to *enforcing rights.* We treat their consent as real, which obligates us to protect their labor rights rather than manage their bodies.

  **What We Lose**

  I want to be honest about the trade-offs. Choosing Option 2 means we give up specific leverage points that Options 1 and 3 provide.

  By rejecting the **Nordic Model**, we lose the ability to cite buyers. Proponents argue this reduces demand. We are accepting that we will not use the criminal law to shrink the market. However, our pilot data showed that citing buyers drives transactions underground, making it harder for workers to screen clients for safety. We are trading a theoretical reduction in demand for a concrete increase in worker safety during transactions.

  By rejecting the **Licensing Model**, we lose the specialized health inspection channel. Under Option 3, health inspectors have a mandate to visit venues specifically. Under Option 2, sex work venues are subject to the same health codes as salons or massage therapists. The risk is that stigma may prevent workers from inviting inspectors in, or that general inspectors are ill-equipped to handle specific safety concerns. We lose the "badge" of legitimacy that a license provides. However, we gain the ability for workers to operate without the barrier to entry that licenses create. A license is a gate; sometimes gates keep danger out, but they also keep workers trapped on the wrong side. We are prioritizing access to safety over the administration of safety.

  **Implementation Timeline**

  To have this in place within one year, I propose the following phase-in:

  *   **Months 1-3 (Legislative):** Drafting and passage of the repeal ordinance. This includes removing sex-work-specific language from county code and clarifying that standard business licensing applies.
  *   **Months 4-6 (Agency Training):** Joint training for County Health and Sheriff's Department. The directive must be clear: sex work is a civil matter, not a criminal one. Health inspectors need guidance on applying general sanitation codes without moral judgment; law enforcement needs clear rules on distinguishing consensual work from trafficking or coercion.
  *   **Months 7-9 (Service Transition):** The service cards issued during the pilot will be transitioned into a general small-business support program. We will offer the pilot venue workers priority access to legal aid for forming their cooperative.
  *   **Months 10-12 (Review):** A final audit before full enactment to ensure no regulatory gaps exist regarding zoning or nuisance complaints.

  **Bottom Line**

  We are not voting on whether we like this industry. We are voting on whether we want to manage it effectively. The pilot showed us that when we remove the threat of arrest, workers engage with health services and organize for better conditions.

  The Vice Chair is correct that asymmetry is an insult, but the solution is not to criminalize everyone (Option 4); it is to decriminalize the transaction entirely. The Licensing model promises protection but delivers exclusion. The Nordic model promises safety but delivers isolation.

  Full decriminalization is the only path that allows the workers we are trying to protect to actually build the safety structures they want. It requires us to trust their agency even when it is uncomfortable. I urge the Committee to vote for Option 2.
