answer: |-
  To answer you precisely, I must first clarify the definitions you are using, because a subtle error in your example obscures the real theoretical conflict. In the standard bargaining model, the "ideal point" for the Kalai–Smorodinsky solution is not the absolute maximum a player could dream of (100), but the maximum they could get *while ensuring the other player gets at least their disagreement value*. In your linear example ($x_1 + x_2 = 100$, disagreement at 20 and 40), the feasible maximum for Player 1 is 60 (leaving 40 for Player 2), and for Player 2 is 80 (leaving 20 for Player 1). If you calculate Kalai–Smorodinsky using these standard feasible ideals, it yields 40 and 60—**exactly the same as Nash**.

  The two solutions only diverge when the set of possible agreements is curved (representing diminishing returns or risk). Your intuition that they "genuinely disagree" is correct in those complex cases, but your specific calculation inadvertently masked the fact that in simple linear divisions, "equal split of surplus" (Nash) and "equal fraction of feasible range" (Kalai–Smorodinsky) are identical.

  Now, to your core question: Why are they treated as rivals, and is Nash merely arbitrary calculus?

  You are confused about the nature of the disagreement. The conflict is not between "Fairness" and "Calculus." Both solutions are derived from axioms that sound like fairness. The conflict is between two **incompatible definitions of fairness**.

  1.  **Nash** prioritizes **Independence of Irrelevant Alternatives (IIA)**. This says: If you remove an option from the table that nobody was going to choose anyway, the final agreement shouldn't change. This is a consistency requirement. Nash proves that if you want Efficiency, Symmetry, Invariance, and IIA, you *must* maximize the product. The calculus is not the assumption; it is the consequence.
  2.  **Kalai–Smorodinsky** prioritizes **Individual Monotonicity**. This says: If the set of possible deals expands in a way that favors you (your maximum possible gain increases), you should not end up worse off. Nash violates this; Kalai–Smorodinsky satisfies it. However, to satisfy this, Kalai–Smorodinsky *must* violate IIA.

  You cannot have both. That is why they are rivals. It is a logical impossibility to satisfy all the "fair" axioms simultaneously.

  **The Verdict**

  You asked me to take a side on which deserves to be called "the answer."

  **The Nash Bargaining Solution is the correct answer to the bargaining *problem*, while Kalai–Smorodinsky is a solution to a bargaining *ideal*.**

  Here is why Nash deserves the title:

  1.  **Strategic Foundation:** In the 1980s, Ariel Rubinstein showed that if you model bargaining as a dynamic game (I make an offer, you accept or reject, you make an offer, etc., with a cost to delay), the equilibrium outcome **converges exactly to the Nash solution**. Nash isn't just an axiomatic curiosity; it describes what rational agents *will actually do* when they negotiate strategically. Kalai–Smorodinsky has no such "non-cooperative foundation." There is no natural negotiation process that leads inevitably to Kalai–Smorodinsky.
  2.  **The Meaning of "Fair":** Your definition of fairness ("equal fractions of the ideal") is intuitive, but it is vulnerable to manipulation. If I can artificially inflate my "ideal" demand (bluffing about what I could possibly get), the Kalai–Smorodinsky rule shifts the division in my favor. Nash is more robust because it depends on the *shape* of the feasible set near the agreement, not just the distant extremes.
  3.  **Consistency:** Violating IIA (as Kalai–Smorodinsky does) leads to paradoxical behavior where adding a "dummy" option that no one wants can change the outcome. Most economists and decision theorists view this as a fatal flaw for a general theory of rational choice.

  **Correction:** You are right to trust your intuition that Kalai–Smorodinsky *feels* fairer in a static, normative sense. If a benevolent dictator were dividing resources, KSS is a strong contender. But bargaining theory is not just about what a dictator should do; it is about what two strategic actors will agree to.

  **Conclusion:** The field treats them as rivals because they represent a fundamental trade-off between **Consistency** (Nash) and **Monotonicity** (Kalai–Smorodinsky). However, Nash is the superior solution for social science because it predicts actual behavior, whereas Kalai–Smorodinsky describes a specific moral preference that rational agents might not voluntarily adopt. Nash is not arbitrary calculus; it is the unique mathematical shadow of strategic consistency.
