  ok so our econ club is doing that fake stock market game where everyone starts with 100k of pretend money and trades against each other, and last week our teacher gave us a reading about this one result and now the whole club argues about it at lunch, and I said I'd write something about it for the April fools issue of the school paper, but every time I try it just turns into me explaining the idea instead of being funny. so can you just write it for me.

  here's the idea. theres a result that says if everyone starts out with the same prior beliefs, and everyone knows everyone else is rational, and everyone knows that everyone knows it, and the market is already sitting in a nice efficient equilibrium with nobody trading for dumb reasons -- then NO trade happens. not "less trade", none, ever. and the reason is kind of funny: the second you make somebody an offer, they learn something from the mere fact that you wanted to trade. why would you be offering, unless you knew something they don't? so they update and say no thanks, and everyone reasons the same way, so the order book stays empty forever. (I think it's the Milgrom-Stokey theorem from 1982 but don't put any citation in, I'm not writing a bibliography.) in the real world trades happen for boring reasons instead: you need cash for rent, you want to hedge, you're an index fund on autopilot, or you just flat out disagree about the odds. and there's a second result I like even more, that if prices already contained all the available information, then nobody could make money by digging up information, so nobody would dig, so prices wouldn't contain all the information -- so the market being perfectly smart is sort of self-undermining. there's also some bargaining one where even two people who both want to trade can't get it done properly if each of them knows something the other doesn't.

  what I want is a deadpan FAQ page for a made up online brokerage where literally no trades ever execute and the site acts like that's the whole point, written like a normal boring corporate help center. no winking, no "haha imagine if", no narrator nudging me in the ribs. the jokes have to come from the economics being right. it should be funny to someone who's taken econ and still readable to my mom. around 600 words total, in these sections, in this order, with these names:

  1. "Why your order didn't fill" (~130 words)
  2. "Our common priors policy" (~130 words)
  3. "Accounts that do trade" (~140 words) -- the boring real reasons from above, and somewhere in here the fine print should admit that disagreeing with us is available as a paid upgrade
  4. "Where the price comes from" (~130 words) -- this is the one I care most about. a market where nothing ever trades still displays a price, and everyone treats that price as knowledge, and the self-undermining thing belongs here, plus a joke about the firm paying zero analysts and calling that a feature
  5. "Notes for my teacher" (~120 words) -- not part of the FAQ, just for me: plain english, one line per joke saying which real idea it's built on, so he can see I'm not making stuff up

  give the fake brokerage a name and a tagline at the top. don't quote anybody, don't cite papers, don't mention real companies, and please don't tack on a disclaimer at the end explaining that it's satire. thanks!!
