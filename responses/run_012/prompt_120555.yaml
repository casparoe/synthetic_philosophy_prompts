  **Efficient Markets LLC**
  *Trading is Information Leakage.*

  **Why your order didn't fill**
  Your order was not executed because your willingness to trade conveyed negative information to the counterparty. Upon observing your bid, the market inferred that you possess private information suggesting the asset is undervalued. Since all participants are rational and aware of this inference, accepting your offer would result in an immediate expected loss. Therefore, the order book remains empty to protect capital. This is not a technical error. It is a feature of informational efficiency. Please do not contact support to request manual execution. Manual execution would violate the no-trade theorem conditions required for your account status.

  **Our common priors policy**
  All users operate under a common priors policy. This means every investor begins with the same initial beliefs about asset values and knows that everyone else shares these beliefs. Because rational agents cannot agree to disagree, any deviation from the current price implies an error in reasoning somewhere. Since we assume all users are rational, no errors exist. Consequently, there is no divergence of opinion large enough to justify a transaction. Betting against the market is betting against yourself, given that you and the market are mathematically identical in expectation.

  **Accounts that do trade**
  Trading is permitted only for non-informational reasons. Valid exceptions include liquidity shocks, such as needing cash for rent, or regulatory hedging requirements. Index funds may rebalance automatically regardless of price signals. Users wishing to trade based on unique analysis must purchase the Dissent Upgrade. This premium tier allows you to formally disagree with the consensus price despite the mathematical impossibility of doing so correctly. Please note that users with the Dissent Upgrade are statistically guaranteed to underperform the market over time, as per our compliance disclosure. Standard accounts cannot initiate trades based on private research. This fee covers administrative costs.

  **Where the price comes from**
  Prices are generated independently of trading volume. The displayed price reflects all available information precisely because no one bothers to verify it. If prices already contained all knowledge, paying analysts to dig up new data would be unprofitable. Therefore, we employ zero analysts. This cost-saving measure ensures prices remain perfectly efficient by default. If users attempted to gather information, prices would cease to be fully informative, creating arbitrage opportunities. To maintain stability, we discourage information gathering. The price is correct because nobody is checking to see if it is wrong.

  **Notes for my teacher**
  1. Order fill section: Uses the Milgrom-Stokey No-Trade Theorem (offer signals private info).
  2. Priors section: Based on Aumann's Agreement Theorem (common knowledge prevents betting).
  3. Dissent Upgrade: Contrasts rational agents with noise traders/liquidity needs.
  4. Price/Analysts section: Uses the Grossman-Stiglitz Paradox (costly info makes efficiency impossible).
  5. Tone: Treats theoretical assumptions as literal platform rules.
