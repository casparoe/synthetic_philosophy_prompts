  Mr. Speaker, Mr. President of the Senate, Members of the Legislature, Citizens of the Republic.

  We gather here on the sixtieth anniversary of the last removal. On this day in 1967, an officer of this state signed the order that took the final child from their home. Between 1938 and 1967, agencies of this government removed fourteen thousand children from a community of two hundred thousand. They placed them in institutions and with families of the majority. They did this on the theory that the community's language and way of life were unfit for a modern nation. That theory was false. That practice was cruel. That policy was a crime against the humanity of this nation.

  The Commission of Inquiry has spent six years documenting this history. They have recommended that the state apologize. They have recommended that we enact a framework of reparations. I will sign that framework immediately after I leave this podium. The Legislature will vote on it next week. But before I sign, and before you vote, we must settle the question of words.

  There are those in this chamber who argue that no one now living is answerable for what officials of a previous constitutional order did. They say the state has changed, and therefore the debt is extinguished. They are wrong. The state is not merely the sum of its living citizens. It is a promise across time. When the state took the children, it made a promise to the future that it would protect them. It broke that promise. The state that broke it is the same state that sits here today. We inherit both the assets and the liabilities of our predecessors. We cannot claim the continuity of the nation when it suits us and deny it when it costs us.

  But there is a harder objection. It comes from the community itself. The chair of the community council has told me privately that she does not want an apology from us. She says we are not the ones who took the children. She says she would rather have an account of what we mean to do about a wrong we did not commit. She asks whether an apology offered by those who did not commit the act is a genuine address to the wronged, or a performance staged for the gallery. She asks if it is a way of collecting the credit of remorse without incurring the costs of repair.

  I have thought long about this. I have consulted the Commission. I have consulted my legal advisers. I have listened to the survivors in the gallery. And I have decided that I will not offer you an apology.

  I will not say "I am sorry" because those words belong to the perpetrators. I did not sign the orders. The people sitting in this chamber did not remove the children. To speak those words would be to claim a guilt that is not ours to claim. It would be to make this moment about our moral cleansing rather than your material repair. It would be to appropriate a pain we did not suffer. The chair of the council is right: an apology from the innocent is often a performance. It allows the speaker to feel they have paid a debt when they have only spoken a word.

  So I will not apologize. But I will not evade.

  There is a difference between guilt and responsibility. Guilt belongs to the actor. Responsibility belongs to the successor. We are not guilty of the removals. But we are responsible for their effects. The state continues. The harm continues. The disadvantage, the trauma, the loss of language and kinship—these are not history. They are present facts. They are the direct result of the policy this state enacted. And so, while I will not apologize for the act, I accept full responsibility for the consequence.

  This is not a procedural dodge. It is a substantive moral claim. It means that we do not ask you to forgive us, because we are not the ones who wronged you. It means we do not ask you to accept our remorse, because our remorse is not the point. The point is the repair.

  The framework I will sign today is not a gift. It is not charity. It is the beginning of the discharge of a debt. It provides for compensation for the survivors. It provides for the restoration of language programs. It provides for the return of records and the reunification of families. It is not enough. No amount of money can return a childhood. No statute can restore a mother's voice. But it is the only thing we can offer that is real.

  I know there are survivors in the gallery who reject this framework. They fear it will extinguish their claims. I want to speak directly to you. This framework does not ask you to surrender your truth. It does not ask you to sign away your history. It is a down payment on a debt that cannot be fully paid. We will not use this legislation to silence you. We will not use this legislation to claim that the account is closed. The account cannot be closed.

  I also speak to the members of this Legislature who believe this is not our burden. You are wrong. It is our burden because it is our state. If we refuse this responsibility, we teach our children that the state is a machine that consumes the weak and discards the past. We teach them that power is exempt from consequence. We cannot teach that lesson and remain a nation of law.

  The transcript of this address will be read into the record of the case pending before the regional human rights court. I say this to the Court: This state acknowledges the facts. This state accepts the responsibility. This state commits to the repair. We do not hide behind the graves of our predecessors. We stand here to answer for the continuity of the state.

  I say this to the nation: We are not defined by what we inherit, but by what we do with it. We inherit a wrong. We choose to repair it. Not because it makes us good. Not because it earns us credit. But because it is the only way to be a people who can live with themselves.

  I will not apologize. I will not perform remorse. I will do the work. The framework is not a condition of this address. It is the consequence of it. I will sign it because it is right, not because it buys my silence. You will vote on it because it is just, not because it closes the file.

  To the community: We cannot give you back what was taken. We cannot give you the years. We cannot give you the language spoken in your homes before the officers came. But we can stop the harm. We can resource the recovery. We can ensure that no child is taken for the crime of their birth. We can build a state that does not fear your difference.

  This is not a moment of closure. It is a moment of commencement. The work begins today. The state accepts its burden. The state accepts its continuity. The state accepts its responsibility.

  May we have the courage to finish what we start today.
