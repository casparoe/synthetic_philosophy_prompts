answer: |-
  **SUMMER EXAMINATION PAPER**

  **Module:** Probability and Rationality
  **Level:** Master's
  **Time Allowed:** 50 Minutes
  **Total Marks:** 20

  **Question 1**

  The Dutch Book Theorem demonstrates that an agent whose credences violate the probability axioms can be offered a package of bets that guarantees a net loss. Critically evaluate the claim that this vulnerability establishes the epistemic irrationality of incoherent credences rather than merely their practical disadvantage. Your answer must isolate the specific assumptions regarding bet acceptance and utility required to generate the book—particularly the assumption that the agent evaluates each bet in isolation and regards the odds as fair—and explain why pragmatic vulnerability does not automatically entail epistemic defect. Finally, assess whether the accuracy-first strategy, which assesses credences by their proximity to the truth under strictly proper scoring rules, successfully closes this justificatory gap or merely relocates it.

  ***

  **MODEL ANSWER**

  The Dutch Book Theorem (DBT) is a settled mathematical result: if credences violate the probability axioms, there exists a set of bets, each acceptable individually, that guarantees a loss. However, the normative inference from this theorem to epistemic irrationality is highly contested. To move from 'vulnerable to loss' to 'epistemically defective', one must bridge the gap between pragmatic consequences and epistemic norms.

  First, one must scrutinise the premises required to construct the Dutch Book. The theorem relies on a bridge principle linking credence to betting behaviour. Crucially, this requires the assumption that the agent accepts each bet in the package based on its individual expected utility, without considering the package as a whole. This is a separability principle. If an agent is permitted to evaluate the package globally, they would reject the combination, and no Dutch Book could be made. Therefore, the argument presupposes that the agent is unable or unwilling to detect the incoherence across separate decisions. Furthermore, the argument assumes the agent regards the offered odds as 'fair', implying they are an expected-utility maximiser with linear utility for money. If the agent is risk-averse, their utility function for money is non-linear. Consequently, a guaranteed monetary loss might not correspond to a guaranteed loss in utility, or the agent might reject fair bets simply due to risk aversion. Thus, the DBT argument implicitly assumes risk neutrality. If one denies these premises—by allowing holistic evaluation of bet packages or acknowledging risk aversion—the pragmatic vulnerability disappears.

  Even if we grant these premises and accept that incoherent credences lead to guaranteed losses, it does not immediately follow that the credences are epistemically irrational. There is a distinction between pragmatic and epistemic norms. Pragmatic norms govern action and the satisfaction of desires (such as wealth accumulation); epistemic norms govern belief and the representation of the world. An agent might have incoherent credences that accurately reflect their evidence but still lose money due to the specific structure of the betting market. To claim that the loss proves epistemic error is to assume that epistemic rationality is instrumental to pragmatic success. This is a pragmatic vindication of epistemic norms. A critic might argue that one can be epistemically rational yet practically unfortunate; therefore, exploitability shows only that incoherence is practically dangerous, not that it constitutes a failure of belief formation *qua* belief.

  Proponents of the accuracy-first programme attempt to close this gap by defining epistemic utility directly in terms of accuracy, rather than monetary gain. They argue that incoherent credences are accuracy-dominated: there is always an alternative coherent credence function that is closer to the truth in every possible world, according to a strictly proper scoring rule. This appears to bypass the betting interpretation entirely, locating the defect within the credences themselves rather than their consequences.

  However, this strategy may relocate rather than solve the justificatory problem. One must ask why accuracy is the sole epistemic virtue. While plausible, the argument that one ought to minimise inaccuracy relies on a normative premise linking accuracy to rationality. Furthermore, recent work suggests that accuracy arguments may harbour hidden pragmatic assumptions. For instance, the choice of a specific scoring rule can be sensitive to how we value different types of errors, which may vary by context. Additionally, if the accuracy argument relies on a dominance principle (that one ought not choose an option dominated in all states), one must justify why this practical decision rule applies to the formation of belief. If the dominance principle is itself pragmatic, the accuracy argument remains dependent on pragmatic norms.

  In conclusion, the DBT alone cannot establish epistemic irrationality because it relies on contestable assumptions about bet separability and risk neutrality, and it conflates pragmatic loss with epistemic error. The accuracy-first approach improves upon this by focusing on truth rather than money, but it faces the challenge of justifying the normative force of accuracy without smuggling in pragmatic decision-theoretic principles. Neither approach offers a knockdown proof; both require substantive normative premises that remain open to debate.

  ***

  **MARKING SCHEME**

  **Total Marks:** 20

  **1. Identification of the 'Single Bet' Acceptance Premise (4 Marks)**
  *   **Requirement:** Candidate must identify that the Dutch Book relies on the agent accepting bets individually (separability) rather than evaluating the package globally.
  *   **Common Error:** Assuming the agent is forced to accept the whole package at once, missing the point that the exploitability relies on sequential or isolated evaluation.
  *   **Allocation:** 4 marks for clear identification and explanation of why this allows the book to be made.

  **2. Identification of Utility and Risk Assumptions (4 Marks)**
  *   **Requirement:** Candidate must note that the argument assumes linear utility for money (risk neutrality) and that the agent regards odds as fair.
  *   **Common Error:** Treating risk aversion as a psychological quirk rather than a structural constraint that invalidates the monetary loss/utility loss equivalence.
  *   **Allocation:** 4 marks for explaining how risk aversion or non-linear utility blocks the inference from monetary loss to irrationality.

  **3. Distinction Between Pragmatic and Epistemic Norms (4 Marks)**
  *   **Requirement:** Candidate must articulate that losing money (pragmatic) does not logically entail believing wrongly (epistemic) without further bridging premises.
  *   **Common Error:** Asserting that exploitability is self-evidently an epistemic defect without arguing for the link between prudence and truth.
  *   **Allocation:** 4 marks for a clear articulation of the gap between practical disadvantage and epistemic failure.

  **4. Assessment of the Accuracy-First Strategy (4 Marks)**
  *   **Requirement:** Candidate must evaluate whether accuracy arguments solve the problem or rely on their own normative assumptions (e.g., dominance principles).
  *   **Common Error:** Presenting the accuracy argument as a settled solution that completely bypasses pragmatic concerns.
  *   **Allocation:** 4 marks for recognising that accuracy arguments may relocate the justificatory burden rather than eliminate it.

  **5. Nuance and Distinction Between Theorem and Interpretation (4 Marks)**
  *   **Requirement:** Candidate must distinguish between the mathematical certainty of the DBT and the contested nature of its normative implications.
  *   **Common Error:** Treating the normative conclusion (incoherence is irrational) as mathematically proven alongside the theorem itself.
  *   **Allocation:** 4 marks for maintaining a clear distinction between settled mathematics and contested philosophy throughout the essay.

  **Differentiation between First Class and 2:1**

  *   **2:1:** The candidate hits all five points but may treat them somewhat mechanically. They might correctly identify the assumptions and the gap, but their discussion of the accuracy-first programme may be slightly dogmatic (e.g., stating it *does* solve the problem) or they may conflate the pragmatic/epistemic distinction slightly in the conclusion. They demonstrate competence with the standard material.
  *   **First Class:** The candidate holds the pragmatic and epistemic questions rigorously apart throughout. They demonstrate insight into *why* the accuracy argument might still rely on pragmatic decision rules (e.g., dominance). They avoid name-dropping and focus on the structure of the arguments. They acknowledge defensible alternative lines (e.g., that one might accept the pragmatic vindication) without losing critical focus. The writing is precise, and the distinction between the theorem (settled) and the normativity (contested) is woven into the analysis rather than tacked on.

  **Note on Alternative Lines:**
  Full marks should be awarded for defensible positions that differ from the model answer, provided they are well-argued. For example, a candidate who argues convincingly that epistemic rationality *just is* a species of instrumental rationality (a pragmatic vindication) should be rewarded if they acknowledge the controversial nature of this claim and argue for it robustly, rather than assuming it as common sense. Similarly, a candidate who argues that specific scoring rules are non-pragmatic should explain why. The key is argumentative rigour, not agreement with the model text.
