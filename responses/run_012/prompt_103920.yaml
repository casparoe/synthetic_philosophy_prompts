prompt: |-
  OK so this is half a real request and half me trying to win an argument at the next faculty meeting. We're redoing the graduate program review, and I proposed that we start publishing a placement-rate number — where our PhDs actually end up, five years out. My colleague across the table says flatly, "When a measure becomes a target, it ceases to be a good measure," and that was apparently that. Nobody pushed back. I think he's onto something, but I also think he just used a proverb to kill a proposal, and I want to know which precise claim was doing the work.

  So: lay out for me all the distinct things that one sentence could be asserting. I want the menu, from the readings that are basically tautologies up to the ones that are real empirical claims about the world, and for each one tell me whether it's trivially true, substantive and defensible, or just false — and then which reading people usually mean when they trot it out. A few I've half-worked out and want you to either sharpen or kill:

  - the statistical one, the version the law is named after, from a 1975 paper on monetary policy: "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes." Is that even the same claim as the slogan?
  - the regression one: pick a variable because it correlated with what you care about in a noisy sample, then select on it, and of course it drifts back toward the middle
  - the gaming one: people with interests respond to incentives, so the proxy decouples from the target
  - the observer-side one, where it's not the measured who change but the measuring institution — think of a conservation body that gets stingier about calling a species extinct once "extinct" triggers policy
  - the compression one: a measure is a lossy summary, and a target demands exactly the information the summary threw away
  - the coordination one: publishing a number makes it a focal point even with zero incentives attached to it
  - the deflationary one: its just "proxies are imperfect" plus "people respond to incentives" stapled together, and there's no single law here at all

  Also, is there a reading on which it's straightforwardly false? I can think of metrics that got better once they were targeted (handwashing compliance in hospitals seems like a candidate). And which reading, if any, actually supports his conclusion — that we shouldn't publish the placement number — as opposed to something weaker like "don't bonus anyone on it"? What I really want to know is whether his move was legit or just a conversation-stopper. Lay it out as a list I can bring to the meeting.
