      *   *Regression:* Selecting on a noisy correlate. *Verdict:* This is more "Regression to the Mean" or "Overfitting." Related, but distinct. Goodhart is about *agency*, regression is about *statistics*.
      *   *Gaming (Campbell's Law):* People optimize the metric, not the goal. *Verdict:* This is the most common colloquial meaning. Substantive and defensible in social systems.
      *   *Observer-side:* Measurement drift. *Verdict:* Valid, often called "Measurement Creep" or "Diagnostic Drift."
      *   *Compression:* Lossy summary. *Verdict:* True by definition of measurement, but doesn't explain *why* it fails when targeted (unless targeting exacerbates the loss).
