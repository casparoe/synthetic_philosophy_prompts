  Priority 4 addresses your colleague's concern. While metaphysically foundational, it is technically dense and often collapses into Priority 1. If DBAs are representation theorems about preference, the philosophical heavy lifting remains explaining why preference consistency constrains credence. Funding this fourth allows us to treat it as meta-theoretical cleanup once the normative stakes are clear.

