  Three years is sufficient for conceptual clarification (1 & 2) but tight for formal reconstruction (4). Philosophers excel at normative mapping; decision theorists excel at representation proofs. We should fund the former. Your colleague's distinction is substantive: if DBAs only constrain preferences, they don't directly govern belief. However, resolving this requires settling Priority 1 first. If pragmatic loss isn't irrational, the preference/credence distinction matters less.

