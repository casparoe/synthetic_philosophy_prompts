      *Wait, one nuance:* In the non-culpable case (unforeseen emergency), do I owe compensation? Maybe not compensation, but certainly an explanation/apology. The normative bond isn't severed. The colleague claims in (7) that if it lapses, it binds only while convenient. But if it transforms into a duty to explain, it *doesn't* lapse entirely. It changes form. This refutes (7)'s implication that the *promise's bindingness* vanishes.

      *Let's structure the diagnosis around the "Synchronic Fallacy".* The argument assesses the obligation only at t=11.55. But promising is a diachronic institution.

      *Okay, ready to write.*

