answer: |-
  Your colleague's argument is elegant and possesses a certain intuitive pull, precisely because it leverages a principle—'ought implies can'—that is difficult to deny. However, the argument relies on a subtle equivocation regarding the temporal scope of obligation and the structure of promissory duties. It commits what we might call the **synchronic fallacy**: it assesses the status of a diachronic commitment at a single, terminal moment.

  The flaw lies principally in **step (6)**, supported by a restricted application of **'ought implies can'** in step (5). Below is a careful diagnosis of the error, an explanation of why it is easily overlooked, and an assessment of the cost required to repair it.

  ### 1. The Diagnosis: A False Dichotomy in Step (6)

  Step (6) presents a forced choice: either the obligation lapsed completely, or it was never to perform but only to try. This ignores a third, standard option in deontic logic and moral philosophy: **the transformation of primary obligations into secondary obligations.**

  When you promise to meet at noon, you undertake a *primary obligation* to perform that act. If, at 11.55, performance becomes objectively impossible through no fault of your own, 'ought implies can' (step 4) correctly dictates that the *primary obligation to perform* is extinguished. You cannot be obligated to do the impossible. However, step (6) erroneously infers that because the *primary* obligation is extinguished, the *normative force of the promise* has lapsed entirely (option 7).

  This is the equivocation. The term 'obligation' in step (6) shifts meaning. In the premise, it refers to the specific duty to *meet at noon*. In the conclusion (7), it refers to the *bindingness of the promissory relationship*.
  *   **The Repair:** When the primary obligation becomes impossible, it does not simply vanish into the ether; it typically generates a **secondary obligation**. Even in cases of non-culpable impossibility, the promisor usually incurs a duty to explain, to apologise, or to offer some form of make-good (even if only symbolic). The promise binds you not merely to the act, but to the *normative consequences* of the act's failure.

  Therefore, step (7) is false. The promise does not bind *only* while keeping it remains convenient/possible. It binds you to the act while possible, and binds you to *repair* when impossible. The obligation persists, though its content changes. This preserves your intuition (8) that the promise was to *do* the thing (not just try), while acknowledging that the *duty* survives the impossibility in a different form.

  ### 2. The Temporal Equivocation: Why it is Overlooked

  The reason this flaw is easy to overlook is that the argument assesses the obligation **synchronically** (at 11.55) rather than **diachronically** (from the moment of the promise).

  Promising is an inherently diachronic institution. When you promise at 10.00 to meet at 12.00, you are not merely stating a current intention; you are attempting to bind your future self. 'Ought implies can' must be applied with sensitivity to this timeline.
  *   **At 10.00:** You *can* meet at 12.00. The obligation attaches.
  *   **At 11.55:** You *cannot* meet at 12.00. The obligation to *meet* dissolves.

  Your colleague treats the obligation as if it were created at 11.55. If the obligation were created at 11.55 to meet at 12.00, then indeed, 'ought implies can' would void it instantly. But because the obligation was undertaken at 10.00, the impossibility at 11.55 constitutes a **frustration of the contract**, not necessarily a **nullification of the bond**.

  It is easy to miss this because we often speak loosely: "I am obligated to meet you." We treat the obligation as a static object. In reality, it is a dynamic trajectory. Recognising this requires us to distinguish between **exemption** (I am released from the act) and **excuse** (I am released from blame, but the act remains a breach). Your colleague conflates exemption from performance with exemption from all promissory residue.

  ### 3. The Culpable Variant

  The argument's second variant (where you left too late) reveals the flaw even more starkly. Here, your colleague claims the conclusion is unchanged: at 11.55 you cannot meet, so by (4) you are not obligated.

  This is a misapplication of 'ought implies can' across time. While it is true that at 11.55 you cannot meet at noon, you *could* have ensured at 10.00 that you would be able to meet at noon. In cases of culpable impossibility, the obligation is not merely to *perform the act at t*, but to **maintain the capacity to perform the act at t**.

  If we accept your colleague's reasoning here, it would imply that a murderer is not obligated not to kill once the victim is already dead, or that a debtor who squanders their money is not obligated to pay once they are bankrupt. Moral responsibility tracks back to the point where control was possible. To preserve (4) 'ought implies can' in this case, we must specify that the 'can' refers to the **reasonable opportunity to avoid the impossibility**, not just the immediate physical capacity at the deadline.

  ### 4. The Cost of Repair: What Must Be Conceded?

  You asked what you would have to concede about the nature of promissory obligation to reject this argument, and whether any recognisable account survives.

  **What you must concede:**
  You must concede that promissory obligation is not a monolithic, indivisible "steel cable" that either holds fast or snaps completely. You must accept a **bifurcated account**:
  1.  **Primary Duty:** To perform the act (subject to 'ought implies can').
  2.  **Secondary Duty:** To respond appropriately if the primary duty is frustrated (apology, compensation, explanation).

  You must also concede that the **robustness** of a promise does not lie in its immunity to circumstance, but in its **stickiness** across circumstance. A promise is robust not because it forces the impossible, but because it ensures that even when the impossible occurs, the promisor remains normatively accountable to the promisee.

  **Does a recognisable account survive?**
  Yes, absolutely. In fact, the repaired account is more recognisable than your colleague's. Consider our ordinary reactions:
  *   If you miss lunch due to an earthquake (non-culpable), I do not say, "Oh, no obligation, so it matters not." I expect a call, an explanation, perhaps a rescheduling. The promise still matters.
  *   If you miss lunch because you slept in (culpable), I hold you responsible. I do not say, "Well, you couldn't make it at 11.55, so you're off the hook."

  Your colleague's argument suggests that in both cases, the promise effectively evaporates at 11.55. This contradicts our actual social practices. The repaired view aligns with standard contractual and moral theory (akin to the distinction in law between *force majeure* discharging performance but not necessarily the duty to notify, or the moral distinction between breach and blame).

  **Are promises less binding than we thought?**
  Not less binding, but **more complex**. Your colleague argues promises are weak because they dissolve under impossibility. The counter-argument is that promises are strong because they *survive* impossibility in the form of reparative duties.
  *   If the obligation merely lapsed (as per step 7), the promisee is left with nothing.
  *   If the obligation transforms, the promisee is still owed a moral debt.

  Therefore, to reject the argument, you need not weaken the concept of promising. You merely need to refine the ontology of the obligation. You retain (4) 'ought implies can' by applying it strictly to the primary performance. You retain (7) and (8) by noting that the promise *was* to do the act (not try), and it binds *beyond* convenience (because it binds you to repair).

  ### Summary

  The flaw is the **false dichotomy in step (6)**, which ignores the generation of secondary obligations upon the frustration of primary ones. It is overlooked due to a **synchronic assessment** of a diachronic commitment.

  To repair it, you must concede that promissory obligation is a **dynamic structure** rather than a static state. This does not render promises less robust; rather, it locates their robustness in their ability to generate normative consequences even when performance fails. A recognisable account of promising not only survives but is strengthened, as it accounts for the residual duties (apology, compensation) that we intuitively feel remain even when performance becomes impossible. Your colleague has not shown that promises are weak; he has shown only that the *duty to perform* is contingent on capacity, which is a trivial truth that leaves the *duty of the promise* intact.
