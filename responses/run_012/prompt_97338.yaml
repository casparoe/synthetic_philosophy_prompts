      4.  The Culpable Variant: Temporal scope of OIC.
      5.  The Cost: What must be conceded (complexity, not weakness).
      6.  Conclusion: Promising survives, but as a dynamic norm.

      *British English Check:* "analyse", "honour", "centre", "programme" (if needed), "whilst", "colour". Ensure spelling and idioms fit.

      *Refining the "Cost":* The user wants to know if promises are less binding. The answer is: No, but the *nature* of the binding is different. It's not a steel cable that snaps; it's a contract that incurs penalties upon breach. Is that "less robust"? One could argue it's *more* robust because it survives failure. I should argue that.

