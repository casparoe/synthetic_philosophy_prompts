prompt: |-
  Okay so I've been trying to figure out what the replication-crisis reforms in psychology (and now a decent chunk of biomed) actually commit you to philosophically, and I keep getting tangled up. Wondering if you can untangle it.

  Here's the practice as its actually run. You preregister your hypothesis and your analysis plan. Then you run the study and you look at whether p < .05. If a follow-up comes back at p = .34, that gets called a failed replication and people start saying the effect doesn't exist. But the exact same crowd will tell you, correctly, that a non-significant result isnt evidence of no effect, that you can't accept the null, that p = .049 and p = .051 aren't two different findings, that we should stop dichotomizing and report effect sizes with intervals. And meanwhile a multiverse analysis or a specification curve over the same dataset gets praised as the honest thing to do, even though it's basically an admission that the single preregistered test was arbitrary.

  There's also the bit where a real effect will routinely fail to "replicate" in the significance sense, because the original estimate was inflated by having cleared the bar in the first place, so the second study is powered off a too-big number, lands at p = .12, and everybody calls it dead.

  So: what theory of evidence does the preregister-then-check-for-significance workflow actually presuppose? My hunch is that it's a story about the long-run error rates of a procedure rather than about what any particular dataset tells you about the size of an effect, i.e. a frequentist story. But test the hunch, don't just agree with it, and tell me which rival views the practice quietly rules out.

  Then separate what's strictly presupposed from what's just packaged together by sociology. Specifically: does preregistration itself need the frequentist story, or is it a commitment device against p-hacking that a Bayesian could endorse on purely practical grounds? Is there anything off about people now wanting Bayesian analyses preregistered too, when the likelihood supposedly doesn't care when you thought of the hypothesis? And does treating "replication" as a pass/fail certification presuppose that a study is an instance of a repeatable procedure with a sampling distribution — and what breaks if you drop that and treat every study as one noisy measurement of a shared parameter?

  Last thing: if a lab or a journal actually took the Bayesian self-description seriously instead of using it as a coat of paint, what would have to change in how it decides what to publish, how it decides whether a grad student's dissertation "worked," and how it reads a null result? And where is the practice genuinely underdetermined, such that a frequentist and a Bayesian could run the identical workflow and mean completely different things by it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Question:** What philosophical theory of evidence does the current "replication-crisis reform" workflow (preregistration + significance testing) actually commit you to?
      *   **Observed Tensions/Contradictions:**
          *   Preregister -> Check $p < .05$.
          *   Failed replication ($p = .34$) = "Effect doesn't exist."
          *   *But* everyone says "non-significant $\neq$ no effect," "don't dichotomize," "report effect sizes."
          *   Multiverse analysis praised (admits arbitrariness of single test) vs. Preregistration (enforces single test).
          *   Replication failure often due to power issues/regression to the mean, not absence of effect.
      *   **Specific Tasks:**
          1.  Test the hunch: Is it purely frequentist (long-run error rates)? What rival views does it rule out?
          2.  Separate philosophy from sociology: Does preregistration *need* frequentism? Can Bayesians endorse it? Why preregister Bayesian analyses? What does "replication as pass/fail" presuppose?
          3.  Practical Implications: If a lab/journal took Bayesianism seriously, what changes (publishing, dissertations, null results)? Where is the practice underdetermined (same workflow, different meaning)?

  2.  **Analyze Task 1: The Theory of Evidence (Frequentism vs. Rivals)**

      *   *Hunch:* It's a frequentist story about long-run error rates.
      *   *Verification:* Yes. The logic of NHST (Null Hypothesis Significance Testing) is inherently frequentist. It controls Type I error rates ($\alpha$) over hypothetical repetitions. A "successful replication" in this framework is often treated as a second independent test controlling the error rate of the *claim*, not necessarily updating a degree of belief.
      *   *Rival Views Ruled Out:*
          *   *Likelihoodism:* Focuses on evidence *in* the data ($L(\theta|data)$). NHST ignores likelihood ratios in favor of tail probabilities.
          *   *Bayesianism:* Focuses on $P(H|data)$. NHST gives $P(data|H_0)$. The "pass/fail" replication logic contradicts Bayesian updating (where a $p=.34$ replication should just shift the posterior, not kill the hypothesis).
          *   *Falsificationism (Popperian):* While NHST *looks* like falsification, it's probabilistic. You don't falsify $H_0$, you reject it with a certain error rate. True Popperians would hate the "accept $H_1$" move when $p < .05$.
      *   *The Tension:* The *rhetoric* of the reforms often sounds Bayesian ("what does this tell us about reality?"), but the *mechanism* is frequentist ("did we clear the error-rate hurdle?").

  3.  **Analyze Task 2: Preregistration & Replication (Philosophy vs. Sociology)**

      *   *Does Preregistration need Frequentism?* No. It's a commitment device.
      *   *Bayesian Endorsement:* A Bayesian *should* like preregistration because it prevents "data-dependent priors" or "hidden researcher degrees of freedom" that corrupt the likelihood function. If you try 20 models and pick the best, the likelihood is conditional on that selection process. Preregistration fixes the model, making the likelihood valid.
      *   *Preregistering Bayesian Analysis:* Is it odd? No. You need to specify priors and models beforehand to prevent "prior hacking" (tuning priors until you get the desired posterior). It ensures the updating is honest.
      *   *Replication as Pass/Fail:* This *does* presuppose the frequentist view of a study as a draw from a sampling distribution. If you treat a study as a noisy measurement of a parameter (Bayesian/Likelihood view), "failure" is just a data point with wide error bars. The "pass/fail" certification breaks if you drop the idea of a fixed $\alpha$-level decision rule. It turns into meta-analytic updating.

  4.  **Analyze Task 3: Serious Bayesian Implementation & Underdetermination**

      *   *If a Lab took Bayesianism Seriously:*
          *   *Publishing:* No more $p < .05$ thresholds. Publication based on informativeness (how much the posterior shifted), not "significance." Null results are valuable if they narrow the credible interval.
          *   *Dissertations:* "Did it work?" becomes "Did we learn something?" rather than "Did you find an effect?"
          *   *Reading Nulls:* A null result isn't "nothing happened." It's "the data suggest the effect is likely small, given our priors." Equivalence testing or Bayes Factors ($H_0$ vs $H_1$) become standard.
          *   *Power Analysis:* Becomes "Design Analysis" or "Probability of Direction." Focus on precision of intervals, not just binary detection.
      *   *Underdetermination (Same Workflow, Different Meaning):*
          *   *Preregistration:* Frequentist sees it as locking the $\alpha$-error rate. Bayesian sees it as locking the likelihood function/prior specification.
          *   *Confidence Intervals vs. Credible Intervals:* They often look similar numerically (with flat priors), but the Frequentist says "95% of such intervals contain the true value," while the Bayesian says "There is a 95% probability the value is here."
          *   *Replication:* Frequentist sees it as a second independent hypothesis test. Bayesian sees it as updating the prior from Study 1 to get the posterior in Study 2.

  5.  **Synthesize and Structure the Argument:**

      *   *Introduction:* Acknowledge the messiness. Validate the user's observation of the "schizophrenic" state of current methodology.
      *   *Section 1: The Philosophical Commitments (Testing the Hunch).* Confirm the frequentist core. Explain *why* (error rates, sampling distributions). Identify the excluded rivals (Likelihood, Bayesian, strict Falsificationism).
      *   *Section 2: Preregistration & Replication (Separating Philosophy from Sociology).*
          *   Preregistration is compatible with Bayesianism (prevents hacking the likelihood/prior).
          *   "Pass/Fail" replication is distinctly frequentist/decision-theoretic.
          *   Multiverse analysis is actually a concession that the "One True Model" assumption is false (bridging towards Bayesian model averaging).
      *   *Section 3: The Bayesian Counterfactual.* What changes? (Thresholds, interpretation of nulls, dissertation criteria).
      *   *Section 4: The Underdetermined Zone.* Where do they look the same? (Preregistration, Intervals). Where do they mean different things? (Probability statements, Replication logic).
      *   *Conclusion:* Summarize the core tension (Decision procedure vs. Epistemic updating).

  6.  **Refine the Tone:**
      *   Needs to be analytical, precise, slightly critical but fair.
      *   Avoid jargon where possible, or define it quickly.
      *   Address the specific contradictions the user raised (e.g., $p=.34$ vs. "can't accept null").
      *   *Self-Correction during drafting:* Make sure not to paint Bayesianism as a magic bullet. It has its own issues (priors). Ensure the distinction between *method* and *interpretation* is clear.

  7.  **Final Polish:** Check against the prompt's specific questions.
      *   *Test the hunch?* Yes.
      *   *Rival views ruled out?* Yes.
      *   *Preregistration need frequentism?* No.
      *   *Bayesian preregistration odd?* No.
      *   *Replication pass/fail presuppositions?* Yes.
      *   *Lab changes if Bayesian?* Yes.
      *   *Underdetermined workflow?* Yes.

  8.  *(Final thought before generating)*: The user is sharp. They notice the "multiverse" contradiction. I need to explicitly address why multiverse analysis is praised despite undermining the "One Preregistered Test" dogma. It's because it admits model uncertainty, which frequentism struggles with but Bayesian Model Averaging handles naturally. This is a key insight to include.

  9.  **Drafting the response.** (Proceeds to generate output based on these steps.)
answer: |-
  You have correctly identified that the current "reformed" methodology in psychology and biomed is a philosophical Frankenstein. It stitches together a frequentist decision procedure with Bayesian-sounding epistemic rhetoric, held together by the sociological glue of "rigor."

  Here is the untangling you asked for, separating the logical commitments from the sociological habits.

  ### 1. Testing the Hunch: What Theory of Evidence is This?

  Your hunch is correct: The preregister-then-check-$p$ workflow is fundamentally **Neyman-Pearson Frequentism**, but it is often misinterpreted through a **Falsificationist** or **Bayesian** lens by the practitioners themselves.

  **The Core Commitment:**
  The workflow presupposes that scientific knowledge advances by controlling the long-run error rate of decisions. When you preregister an analysis plan and check $p < .05$, you are not asking, "How likely is my hypothesis given this data?" You are asking, "If I use this rule repeatedly over hypothetical repetitions, will I falsely claim an effect more than 5% of the time?"

  **What This Rules Out:**
  1.  **Likelihoodism:** A likelihoodist cares about the ratio of probabilities of the data under competing hypotheses ($L(H_1)/L(H_0)$). The current workflow ignores $H_1$'s specific predictions (except vaguely that $\mu \neq 0$) and focuses entirely on the tail probability of $H_0$. The praise for "multiverse analysis" actually leans *toward* likelihoodism (showing how robust the evidence is across models), which contradicts the "One True Preregistered Test" dogma.
  2.  **Strict Bayesianism:** As you noted, treating a $p = .34$ replication as "evidence the effect doesn't exist" violates Bayesian updating. In a Bayesian framework, a noisy replication with a wide interval should simply widen the posterior distribution, not collapse it to zero. The "failed replication" label is a decision-theoretic move, not an epistemic one.
  3.  **Popperian Falsification:** While researchers talk like Popperians ("we tested and falsified the null"), NHST does not falsify the null; it rejects it with a known error rate. Conversely, failing to reject is not falsifying the alternative. The current practice tries to have it both ways: using $p < .05$ to "verify" theories and $p > .05$ in replications to "falsify" them.

  **The Contradiction:**
  The reason you feel tangled is that the *sociology* of the reform movement uses Bayesian language ("what is the true effect size?", "uncertainty") to sell a Frequentist mechanism ("control Type I error"). When a replication yields $p = .34$, the frequentist logic says "we failed to reject the null at $\alpha = .05$." The sociological interpretation says "the effect is dead." These are not the same statement.

  ### 2. Preregistration and Replication: Philosophy vs. Sociology

  **Does Preregistration Need the Frequentist Story?**
  No. Preregistration is a **commitment device**, not a philosophical axiom.
  *   **Frequentist Justification:** It prevents "p-hacking" (selecting from a garden of forking paths), which inflates the Type I error rate. If you don't lock the analysis, the $\alpha = .05$ guarantee is void.
  *   **Bayesian Justification:** A Bayesian can and should endorse preregistration. Why? Because the Likelihood Principle states that evidence is contained in the likelihood function. However, if you run 20 analyses and report the best one, the likelihood function you present is conditional on that selection process. Preregistration fixes the model and the priors *before* seeing the data, ensuring that the resulting posterior reflects the data's actual evidentiary weight, not the researcher's degrees of freedom.

  **Is Preregistering Bayesian Analyses Odd?**
  No, but it highlights a tension.
  *   **The Tension:** Strict Bayesians argue that the likelihood doesn't care when you thought of the hypothesis. Data is data.
  *   **The Resolution:** While the *math* doesn't care, the *human* does. Preregistering a Bayesian analysis prevents "prior hacking" (tuning priors until the posterior looks nice) and "model hacking" (trying different covariates until the Bayes Factor $> 3$). It ensures the *inputs* to the updating process are honest.

  **Replication as Pass/Fail:**
  Treating replication as a binary certification **does** presuppose the study is an instance of a repeatable procedure with a sampling distribution.
  *   **What Breaks:** If you drop that and treat every study as one noisy measurement of a shared parameter (the Bayesian/Likelihood view), "pass/fail" dissolves into **meta-analytic updating**.
  *   **The Consequence:** Study 1 gives a posterior. Study 2 uses Study 1's posterior as its prior. If Study 2 finds a smaller effect, the combined posterior shrinks. It is never "dead" unless the combined credible interval excludes values of practical significance. The "failed replication" narrative requires the frequentist notion that a study is a *test* of a claim, rather than a *measurement* of a parameter.

  ### 3. The Bayesian Counterfactual: What Would Actually Change?

  If a lab or journal took the Bayesian self-description seriously (rather than just pasting Bayes Factors onto a frequentist workflow), the following would have to change:

  **1. Publication Criteria:**
  *   **Current:** Publish if $p < .05$ (or if a preregistered replication "passes").
  *   **Bayesian:** Publish based on **informativeness**. Did the data shift the posterior meaningfully? A "null" result that narrows a credible interval from $[-0.5, 0.5]$ to $[-0.1, 0.1]$ is highly publishable because it rules out large effects. Currently, this is often treated as a "failed study."

  **2. Dissertation "Success":**
  *   **Current:** The grad student must find a significant effect to graduate.
  *   **Bayesian:** The grad student must demonstrate precise estimation. If they show the effect is effectively zero (via a Region of Practical Equivalence, ROPE), that is a successful dissertation. The metric changes from "discovery" to "constraint."

  **3. Reading Null Results:**
  *   **Current:** $p = .34$ $\rightarrow$ "Inconclusive" or "No effect."
  *   **Bayesian:** Look at the Bayes Factor ($BF_{01}$). If $BF_{01} = 5$, the data are 5 times more likely under the null than the alternative. You can actively claim evidence *for* the null, which is currently forbidden in the frequentist reform narrative ("you can't accept the null").

  **4. Power Analysis:**
  *   **Current:** Power to detect *an* effect (binary).
  *   **Bayesian:** Design analysis for **precision**. How wide will the credible interval be? This avoids the "inflated original estimate" problem you mentioned. If you design for precision, you acknowledge the original estimate was noisy, rather than powering the replication to detect the original (inflated) effect size.

  ### 4. The Underdetermined Zone: Same Workflow, Different Meaning

  There is a large zone where a Frequentist and a Bayesian run the exact same code but mean completely different things. This is where the confusion lives.

  | Workflow Step | Frequentist Meaning | Bayesian Meaning |
  | :--- | :--- | :--- |
  | **Preregistration** | Locks the Type I error rate ($\alpha$). Prevents capitalizing on chance. | Locks the Likelihood Function and Priors. Prevents conditioning on the data for model selection. |
  | **95% Interval** | **Confidence Interval:** 95% of such intervals generated by this method will contain the true fixed parameter. | **Credible Interval:** There is a 95% probability the parameter lies within this range, given the data and priors. |
  | **Replication** | A second independent test. Both must clear the hurdle to confirm the effect. | An updating step. Study 2's posterior becomes the prior for Study 3. |
  | **"Significant"** | The data are surprising under the null ($p < .05$). | The posterior mass is largely on one side of zero (Probability of Direction > 95%). |
  | **Multiverse Analysis** | A sensitivity check to ensure the $p < .05$ wasn't fragile (Frequentist robustness). | Approximation of **Bayesian Model Averaging**. Acknowledges uncertainty about the true model structure. |

  **The Critical Divergence:**
  The practice is genuinely underdetermined regarding **the Null**.
  *   **Frequentist:** The Null is a fixed point ($\mu = 0$) that you can never prove, only fail to reject.
  *   **Bayesian:** The Null is a model (often a small region around zero) that can be positively supported if the data cluster tightly there.

  When a reformer says "we need to stop dichotomizing," they are speaking Bayesian. When they say "this replication failed because $p > .05$," they are acting Frequentist.

  ### Summary

  The replication-crisis reforms presuppose a **Neyman-Pearson Frequentist** theory of evidence (long-run error control) but are sold using **Bayesian** epistemic language (degree of belief, evidence for nulls).

  *   **Preregistration** is compatible with both, but for different reasons (error control vs. likelihood integrity).
  *   **Pass/Fail Replication** is strictly Frequentist/Decision-Theoretic. It breaks if you view science as parameter estimation.
  *   **To be truly Bayesian,** a lab would stop asking "Did it replicate?" and start asking "How much did our uncertainty shrink?" They would publish nulls that constrain parameters and treat the original effect size as a noisy prior, not a truth to be defended.

  The tangle you feel is the friction of trying to drive a Bayesian car with a Frequentist engine, using a map drawn by Falsificationists.
