answer: |-
  The regulatory architecture you describe—specifically the Safe Drinking Water Act's division between the Maximum Contaminant Level Goal (MCLG) and the Maximum Contaminant Level (MCL)—rests on a **bifurcated theory of vagueness** that is ontologically inconsistent but administratively functional. It operates on a **Pragmatic Epistemicism** for the law and a **Naïve Realism** for the health science, bridged by a fiction of approximation.

  ### 1. Reconstructing the Implicit Theory

  The program presupposes a **dual ontology**:

  1.  **For the Health Goal (MCLG): Epistemic Realism.** By setting a specific number (or zero) based on health effects, the agency presupposes that "safety" has a sharp boundary in nature, even if it is currently unknown or unmeasurable. The "margin of safety" implies that the true threshold exists but is epistemically inaccessible; the goal is a placeholder for that truth. If safety were inherently vague (a matter of degree), a "goal" of zero for microbes makes sense, but a specific numerical goal for chemicals would be category error. The practice assumes the latter is a discoverable fact.
  2.  **For the Enforceable Standard (MCL): Stipulated Sharpness.** The law acknowledges it cannot reach the natural truth (due to cost/tech), so it manufactures a sharp boundary. However, it treats this manufactured boundary *as if* it were a proxy for the natural one. This is a **performative contradiction**: the law creates a Sorites-stopping cliff by fiat, while rhetorically maintaining that the cliff tracks the underlying health reality.

  **The Implicit Commitment:** The system presupposes that vagueness is an **epistemic defect** (we don't know the line) rather than an **ontological feature** (there is no line). It further presupposes that the law has the authority to resolve ontological vagueness by stipulation without admitting that it is doing so. It treats the "cliff" as a necessary legal technology that does not require philosophical justification, only technical authorization.

  ### 2. Philosophical Compatibility: Who Can Endorse This?

  The practice is underdetermined, but not all theories of vagueness fit equally well.

  *   **The Epistemicist (e.g., Timothy Williamson):**
      *   *Compatibility:* **High.** The Epistemicist believes there *is* a sharp cutoff in nature (e.g., exactly 4.0001 ppb is safe, 4.0002 is not), we just don't know it. This fits the MCLG perfectly. It also fits the MCL enforcement: the law simply stipulates a *new* sharp cutoff for legal purposes.
      *   *Tension:* The Epistemicist must argue that cost and technology change the *meaning* of "violation," not the underlying health fact. The agency's rhetoric suggests the MCL *approximates* the MCLG; the Epistemicist must say the MCL *replaces* the MCLG for legal purposes. This is manageable.
  *   **The Supervaluationist:**
      *   *Compatibility:* **Moderate.** A Supervaluationist sees "safe" as true on some precisifications and false on others. The MCLG could be viewed as the "super-true" ideal (true on all admissible precisifications of health). The MCL is one specific precisification selected for enforcement.
      *   *Tension:* Supervaluationism typically resists asserting sharp boundaries in the object language. The regulatory "cliff" (where 4.0 is safe and 4.1 is a violation) violates the spirit of supervaluationism, which usually accepts truth-value gaps. However, since the law *stipulates* the precisification, the Supervaluationist can accept this as a pragmatic closure rule, provided they admit it is a linguistic convention, not a discovery.
  *   **The Degree Theorist (Fuzzy Logic):**
      *   *Compatibility:* **Low (for Enforcement), High (for Science).** The Degree Theorist fits the science best: toxicity is a gradient. A reading of 4.1 is "more unsafe" than 4.0, not "unsafe" vs. "safe."
      *   *Tension:* The regulatory "cliff" is anathema to Degree Theory. To enforce a binary violation on a continuous reality requires a "defuzzification" step. The program *does* perform this step, but it refuses to acknowledge the information loss. A Degree Theorist would insist that enforcement (fines, notices) should also scale with the degree of violation. The current "cliff" enforcement quietly rules out strict Degree Theory in the *legal* domain, even if it accepts it in the *toxicological* domain.

  **Verdict:** The practice is most comfortable with **Epistemicism** regarding the existence of lines, but **Legal Positivism** regarding the source of those lines. It excludes Degree Theory from the *consequences* of regulation.

  ### 3. Requirements vs. Fit: What is Essential?

  We must separate what the regulatory state *needs* to function from what it *says* it is doing.

  **What the Practice Strictly Requires:**
  1.  **Administrative Closure:** A binary decision rule (compliant/non-compliant) is required to trigger specific legal consequences (fines, notices) without endless litigation over "how unsafe" the water was.
  2.  **Feasibility Constraint:** The standard must be physically and economically attainable, or the system collapses.
  3.  **Authority to Stipulate:** The agency must have the power to fix a number even when measurement error exceeds the margin between compliance and violation.

  **What Merely Fits (The Decorative Philosophy):**
  1.  **The "Approximation" Rhetoric:** The claim that the MCL is "as close as feasible" to the MCLG suggests a trajectory toward truth. In reality, once cost enters the equation, it is a trade-off, not an approximation. This rhetoric fits the Epistemic view but is not required for function.
  2.  **The "Health-Based" Goal:** Setting the MCLG at a level that ignores detection limits creates a "north star." This is not required for safety; it is required to maintain the *legitimacy* of the program as health-protective rather than cost-benefit analysis.
  3.  **Judicial Deference as "Technical Expertise":** Courts defer because they believe the agency is finding a scientific fact. If the agency were merely making a policy trade-off, deference might still exist (under *Chevron*), but the *basis* would shift from "expertise" to "discretion."

  **Where it is Underdetermined:**
  The program does not determine *why* the line is sharp. It leaves open whether the sharpness is discovered (Epistemic) or created (Stipulated). It also leaves open whether the measurement error is a legal defense (it generally isn't). The system works equally well if the MCLG is a normative ideal or a scientific fact, provided the MCL remains binary.

  ### 4. Consequences of Replacing the Presupposed View

  If we replaced the "Pragmatic Epistemicism" (pretending we found a line) with **Honest Stipulationism** (admitting we drew a line), several structural pillars would shift:

  **A. Judicial Deference and Expertise**
  *   *Current:* Courts defer because the number is treated as a "technical judgment" derived from scientific evidence.
  *   *Shift:* If the number is admitted as a policy trade-off (cost vs. risk), deference might actually *increase* under administrative law (agencies have discretion on policy), but the *shield of scientific inevitability* would vanish. Litigation would shift from "your science is wrong" to "your trade-off is arbitrary." However, without the cloak of scientific discovery, the "cliff" becomes harder to defend against Due Process challenges regarding fair notice, given measurement error.

  **B. The "Evidence-Based" Rhetoric**
  *   *Current:* The agency speaks of "risk assessment" and "health effects."
  *   *Shift:* The rhetoric would need to become "Risk Management." The MCLG would be openly acknowledged as a normative aspiration, not a scientific finding. This would likely reduce public trust in the short term (admitting uncertainty) but increase long-term legitimacy (honesty about trade-offs).

  **C. Enforcement: Cliffs vs. Slopes**
  *   *Current:* Binary violation triggers binary penalties.
  *   *Shift:* If the line is admitted as a decision rule rather than a fact of nature, the "cliff" becomes harder to justify. We would expect:
      *   **Tolerance Ranges:** Readings within the margin of error would be legally neutral.
      *   **Sliding Scales:** Penalties or required responses would scale with the degree of exceedance (aligning with Degree Theory).
      *   **Expansion of "Action Levels":** The program already uses these (e.g., Lead and Copper Rule) where the trigger is for treatment, not violation. An honest stipulationist view would expand this model: numbers trigger *duties to investigate*, not automatic *findings of guilt*.

  **D. The "Betrayal" in Current Practice**
  You asked if the resort to treatment techniques and action levels betrays that the agency half-knows the line is a decision. **Yes.**
  *   **Treatment Techniques:** Mandating a process (e.g., "filter the water") rather than a number admits that the number is unreliable or secondary to the physical act of safety. This is a Degree-Theorist move disguised as a command.
  *   **Action Levels:** These acknowledge that a number can be exceeded without a "violation" occurring, triggering instead a duty to act. This is a tacit admission that the number is a trigger for management, not a boundary of safety.

  ### Summary
  The program presupposes that **vagueness is a problem of measurement, not of nature**, and that **law can cure measurement error by fiat.** It requires a binary enforcement mechanism but dresses it in the language of scientific discovery. An Epistemicist can endorse the structure but must ignore the cost-based shifting of the line; a Degree Theorist can endorse the science but must reject the enforcement cliffs.

  If the view shifted to **Honest Stipulationism**, the "cliffs" would likely erode into "slopes" (sliding penalties, tolerance bands), judicial review would focus more on arbitrary decision-making than technical error, and the rhetoric would shift from "protecting health" (a fact) to "managing risk" (a value). The existence of Action Levels and Treatment Techniques suggests the agency already operates on this honest view in the shadows, while maintaining the Epistemic fiction in the light.
