          3.  Where is it underdetermined? (Can Epistemicists, Supervaluationists, Degree Theorists endorse it?)
          4.  What would change if the presupposed view were replaced? (Implications for judicial deference, rhetoric, enforcement structures).

  2.  **Analyze the Implicit Theory of Vagueness:**

      *   *The MCLG (Goal):* Treats safety as a natural kind with a true value (possibly zero). It implies there *is* a fact of the matter about "no adverse effect," even if we can't measure it. This leans towards *Epistemicism* (there is a sharp line, we just don't know it) or *Realism* about health thresholds.
      *   *The MCL (Standard):* Treats the legal limit as a pragmatic cut-off. It acknowledges the MCLG might be unattainable. It creates a sharp legal line despite measurement error. This looks like *Stipulationism* or *Legal Positivism* regarding the boundary.
      *   *The Tension:* The system speaks as if the MCL *tracks* the MCLG (evidence-based), but sets it based on cost/tech (decision-based).
      *   *Implicit Theory:* It seems to operate on a **Hybrid Error Theory**. It presupposes there *is* a natural sharp boundary (health-wise), but admits we can't hit it, so we draw an artificial sharp boundary (law-wise) that pretends to be proximate to the natural one. It treats the "cliff" as legally necessary for enforcement, even if scientifically false.

  3.  **Evaluate Philosophical Positions (Epistemicism, Supervaluationism, Degree Theory):**

      *   *Epistemicism (Williamson):* There is a sharp cutoff in nature, we just don't know it.
          *   *Fit:* Fits the MCLG well (there is a true safe level). Fits the MCL enforcement (there is a true legal line).
          *   *Conflict:* The MCL admits the line is moved by *cost*, not just truth. Epistemicism says the boundary is fixed by usage/nature, not stipulation based on budget. However, legal epistemicism works (the law *makes* the sharp line).
      *   *Supervaluationism:* Truth is super-true if true on all precisifications.
          *   *Fit:* Could explain the "margin of safety." The MCLG is the "super-true" safe level. The MCL is one precisification.
          *   *Conflict:* Supervaluationism usually resists sharp boundaries in the object language. The law *insists* on a sharp boundary for enforcement.
      *   *Degree Theory (Fuzzy Logic):* Safety is a matter of degree (0 to 1).
          *   *Fit:* Fits the science (dose-response).
          *   *Conflict:* Directly contradicts the "cliff" enforcement. The law refuses to grade violations (mostly). It demands binary compliance.
      *   *Conclusion:* The practice is *compatible* with all of them technically, but *rhetorically* aligns with Epistemicism (there is a true number) while *functionally* acting like Stipulationism (we pick a number). It rules out strict Degree Theory in *enforcement*, though not in *science*.

  4.  **Separate "Requires" vs. "Fits":**

      *   *Requires:* A binary legal status (compliant/non-compliant) for administrative feasibility. A distinction between ideal (health) and practical (enforcement).
      *   *Fits:* The rhetoric that the MCL is "close to" the MCLG. The idea that measurement error doesn't invalidate the line. The deference to agency expertise (pretending it's a technical finding, not a policy choice).

  5.  **Analyze Underdetermination:**

      *   The system doesn't *need* to believe the MCLG is a discoverable fact. It could admit it's a normative ideal.
