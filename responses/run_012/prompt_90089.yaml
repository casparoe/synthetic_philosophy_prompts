      *   **The Tension:**
          *   Science/Health is vague (dose-response curves, measurement error).
          *   Law creates sharp boundaries (cliffs) where science sees gradients.
          *   Law treats vagueness as fatal elsewhere (criminal void-for-vagueness) but embraces it or ignores it here.
          *   Rhetoric is about "health" and "evidence," but the mechanism is "feasibility" and "stipulation."
      *   **Questions to Answer:**
          1.  What does this cluster presuppose about vagueness? (Reconstruct the implicit theory).
