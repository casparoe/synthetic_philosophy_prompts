answer: |-
  **The Maintenance Asymmetry and the Myth of the Neutral Baseline**

  Your background in physiology grants you a vantage point that eludes many moral philosophers. You have correctly identified that the traditional framing of the doing/allowing distinction relies on a metaphysical error: the assumption of a static, 'natural' baseline from which agents deviate. In biology, there is no such baseline. Life is a local reversal of entropy, a state maintained only by continuous energy expenditure. To 'let nature take its course' is not to step back into neutrality; it is to cease the work of resisting thermodynamic equilibrium. As you note, this 'maintenance asymmetry' suggests that omission is merely a specific type of commission—the commission of withdrawing energy from a system.

  If we accept your physiological premise, the traditional distinction between doing and allowing harm cannot be fundamental in a metaphysical sense. There is only causality, and in a complex system, every presence is an intervention. However, morality is not physics. It does not map directly onto causal chains but onto *normative expectations*. The question, therefore, is whether the doing/allowing distinction tracks something morally significant within that causal web, or whether it is merely a folk-heuristic that collapses under scrutiny.

  My verdict is this: the distinction between doing and allowing is **not morally fundamental**. It is a rough proxy for a deeper, more robust criterion: **Causal Ownership of the Lethal Trajectory**. The moral weight lies not in whether the agent moved their muscles (commission) or kept them still (omission), but in whether the agent is the sustaining cause of the process leading to death, or merely the ceasing cause of the process leading to life. Where the distinction aligns with this ownership, it is useful; where it diverges, it must be discarded.

  ### The Physiological Challenge to Moral Baselines

  Traditional ethics often treats the body as a vessel that remains intact unless breached. Your discipline reveals the body as a flame that goes out unless fed. In this light, Case 1 (Withdrawal of maintenance) and Case 2 (Failure to initiate) look identical to Case 3 (Sustained harm). In all three, the carer's physical engagement (or lack thereof) determines the flow of energy. In Case 1, the carer stops pumping; in Case 3, they start (or continue) pumping. In both, the carer's behaviour is the switch that determines life or death.

  If morality were purely about causal contribution, Case 1 and Case 3 would be morally equivalent. The carer's muscle movements are the necessary condition for the outcome in both. Yet, intuitively, we feel Case 3 is worse. Why? Because in Case 3, the agent is *driving* the lethal process. In Case 1, the agent is *stopping* the life-saving process. The difference is not in the physics of the act, but in the **teleology of the causal chain**.

  This supports your suspicion: the phrase 'letting nature take its course' is a description of a contribution. But morally, we treat the 'natural' course (entropy/death) as the default, and 'intervention' (life) as the exception. This is not a biological truth, but a normative one. We do not owe the universe a fight against entropy. We owe each other specific duties. The doing/allowing distinction is an attempt to map these duties, but it often confuses the map for the territory.

  ### Testing the Four Cases

  Let us apply the criterion of **Causal Ownership of the Lethal Trajectory** to your four cases. This criterion asks: *Is the agent the active sustainer of the mechanism that kills, or the passive withdrawer of the mechanism that saves?*

  **1. Withdrawal of maintenance**
  Here, the carer stops cranking the pump. The lethal trajectory is entropy (the patient's physiological collapse). The life trajectory is the pump. By stopping, the carer relinquishes ownership of the life trajectory. They do not seize ownership of the lethal trajectory; they simply cease to block it.
  *Verdict:* This is 'allowing'. The agent is not the sustaining cause of death; they are the withdrawing cause of life. The moral weight is lower because the agent is not driving the car off the cliff; they are merely taking their foot off the accelerator.

  **2. Failure to initiate maintenance**
  The carer never cranks the pump. The lethal trajectory is, again, entropy. The carer never engaged with the life trajectory. They have no causal ownership of the patient's survival, nor of their death.
  *Verdict:* This is 'allowing', but with even less causal ownership than Case 1. In Case 1, the carer had established a pattern of care, creating a reliance interest. In Case 2, there is no such history. The distinction between Case 1 and Case 2 is not about doing/allowing (both are omissions), but about **assumed responsibility**. The doing/allowing distinction fails to capture the nuance here; the 'Causal Ownership' criterion handles it by noting the agent never owned the life vector.

  **3. Sustained harm**
  The carer cranks the pump to circulate poison. The lethal trajectory is the poison. The carer is actively sustaining this trajectory. Without the carer's input, the lethal process stops (presumably, or the poison clears).
  *Verdict:* This is 'doing'. The agent is the sustaining cause of the lethal mechanism. The physical motion is identical to Case 1, but the *vector* is reversed. In Case 1, the motion fought death; in Case 3, it drives it. The moral difference is fundamental, but it is not about act vs. omission. It is about **alignment with the lethal outcome**.

  **4. The inherited default**
  This is the most revealing case. The device was set by the carer years ago. Now, the carer does nothing. Superficially, this looks like 'allowing' (an omission to switch off). However, the lethal trajectory was established by the agent's past self. The device is an artefact of the agent's will, extended through time.
  *Verdict:* This is 'doing'. To classify this as 'allowing' because the present-moment action is static is to ignore the temporal extension of agency. The carer owns the lethal trajectory because they built it. The present inaction is merely the final link in a chain of commission started years prior. The doing/allowing distinction, focused on the present moment, obscures this. The 'Causal Ownership' criterion reveals it immediately: the agent owns the killing mechanism.

  ### The Verdict: A Proxy for Causal Ownership

  The doing/allowing distinction is not fundamental. It is a heuristic that usually correlates with **Causal Ownership of the Lethal Trajectory**, but it fails when the causal history is complex (as in Case 4) or when the physiology is misunderstood (as in your maintenance asymmetry).

  The distinction is useful only insofar as it signals who is driving the bus.
  *   **Doing Harm:** The agent is the sustaining cause of the lethal sequence. (Case 3, Case 4).
  *   **Allowing Harm:** The agent is the withholding cause of a life-sustaining sequence, while the lethal sequence is driven by external forces (entropy, disease, or another agent). (Case 1, Case 2).

  However, we must refine this. Is it *always* less bad to allow than to do? Not necessarily. If I have a duty to maintain the pump (a contractual or relational duty), Case 1 becomes morally closer to Case 3. If I am the only person who can save you, my 'allowing' is a violation of a duty to rescue, which makes it a form of 'doing' in a normative sense, even if not a causal one.

  Therefore, the criterion that marks off the moral difference is not the physical act, but the **Normative Control over the Causal Vector**.
  1.  **Did the agent introduce or sustain the threat?** If yes, it is morally equivalent to 'doing', regardless of present motion (Case 3, Case 4).
  2.  **Did the agent merely fail to block a threat they did not create?** If yes, it is 'allowing' (Case 2).
  3.  **Did the agent cease to block a threat they were temporarily holding back?** This is the grey zone (Case 1). Here, the moral weight depends on whether the agent had *assumed* a duty of maintenance. If they had, withdrawal is closer to doing. If they had not, it is closer to allowing.

  ### Conclusion

  Your 'maintenance asymmetry' correctly identifies that the metaphysical baseline is an illusion. There is no state of 'nothing happening'. There are only competing processes. Morality, therefore, cannot rest on the physics of intervention. It must rest on the **attribution of responsibility for the trajectory**.

  The doing/allowing distinction is a proxy for this attribution. It works well when the causal lines are short and clear. It fails when the causal lines are extended (Case 4) or when the 'natural' state is itself a process of decay (your physiological insight).

  We should not discard the distinction entirely, for it serves as a vital shorthand in law and daily ethics. But we must recognise it as secondary. The fundamental moral question is not "Did you act?" but "**Did you own the process that killed?**" In Case 3 and Case 4, the agent owns the death. In Case 1 and Case 2, the agent owns only the withdrawal of life. That is where the real work is done. The distinction does not dissolve, but it relocates: from the movement of the hand to the direction of the will.
