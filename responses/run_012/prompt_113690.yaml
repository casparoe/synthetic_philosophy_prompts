answer: |-
  You have carved out a distinction that most historians of science gesture toward but rarely isolate with this precision. You are describing a structural distortion rather than a moral one. You are right to feel that "Whig history" is an imperfect fit, not because your observation is wrong, but because the term has accrued so much moral baggage (progress, triumphalism, heroes/villains) that it obscures the mechanical operation you've identified.

  Here is the carving you asked for.

  ### 1. The Existing Lexicon and Its Gaps

  You are correct that **Whig history**, in its colloquial usage, implies a moral valuation (the past was worse, we are better). However, in its technical origin (Herbert Butterfield, 1931), Whig history is defined precisely as "the study of the past with direct reference to the present." Butterfield's complaint was not just about praise, but about *selection*: the historian plucks from the past whatever resembles the present and discards the rest. Your observation is, technically, the *mechanism* of Whiggism without the *valence*. The problem is that using the term "Whig" inevitably invites arguments about progress that distract from your point about proportion.

  **Presentism** and **Anachronism** are indeed about evaluation and categorization (judging past morals by current standards or imposing current concepts on past actors). They do not capture the *architectural* distortion you describe—where the *amount of space* devoted to a topic is determined by its connectivity to the end point.

  **Hindsight Bias** is psychological (believing the outcome was inevitable). Your examples are not about inevitability, but about *relevance*. A historian can admit an outcome was contingent and still structure the book around it.

  **The Symmetry Principle** (from the Strong Programme in sociology of science) is relevant to your first example (phrenology). It demands that true and false beliefs be explained by the same types of causes. However, it is a methodological rule for explanation, not a name for the narrative distortion of time and space.

  ### 2. The Coinage: Retrospective Gravitation

  Since no existing term captures the *proportional* and *structural* nature of this distortion without importing moral judgment, I propose the term **Retrospective Gravitation**.

  **Definition:**
  *Retrospective Gravitation* is a historiographical distortion wherein the narrative mass (space, detail, sympathy) allocated to past events, actors, or ideas is determined not by their contemporary significance, but by their vector toward a known terminus (usually the present state of the field, institution, or concept).

  **The Mechanism:**
  In a narrative subject to Retrospective Gravitation, the "present" acts as a singularity with high gravitational mass. It bends the narrative spacetime around it.
  *   **High-Gravity Events:** Ideas or people that look like "precursors" to the terminus are pulled closer to the present; they are given disproportionate narrative weight and clarity.
  *   **Low-Gravity Events:** Ideas or people that were significant at the time but dead-ended (like phrenology, or the 30 years of a biography irrelevant to the fame) are pushed to the periphery or compressed, regardless of their actual historical "mass."

  **Why this fits your examples:**
  1.  **Physiology:** Phrenology has low gravity (no vector to modern neuroscience); the minor figure has high gravity (resembles modern mechanism). The narrative space reflects the gravity, not the historical footprint.
  2.  **University:** The modern university is the singularity. Even if the author critiques it, the narrative structure must orbit it. The medieval *studium* is only visible insofar as it pulls toward the modern research university.
  3.  **Biography:** The "fame" is the terminus. Life events are weighted by their contribution to that fame, not by their lived duration or significance to the subject.

  ### 3. Boundary Cases and Tests

  You asked for the boundary conditions to test this concept against.

  **Case A: The Dead Institution**
  *Question:* Does a history of an institution that no longer exists escape Retrospective Gravitation?
  *Answer:* No. The terminus simply shifts.
  If you write a history of the League of Nations (which is dead), the terminus is rarely the League itself in its own context. The terminus becomes either:
  1.  **The Successor:** The United Nations. The League is treated as a "failed prototype" of the UN.
  2.  **The Archive:** The present-day availability of records. Events are proportioned by what was documented and survived, not what happened.
  3.  **The Current Discourse:** The League is analyzed through the lens of current International Relations theory.
  *Test:* A history of the League escapes Retrospective Gravitation only if it treats the League as a closed system, analyzing its internal logic and contemporary significance without reference to the UN or modern IR theory. This is rare.

  **Case B: The Decline Narrative**
  *Question:* Is a history written as a warning (a "fall from grace") still organized around the present?
  *Answer:* Yes. It is Retrospective Gravitation with a negative valence.
  In a decline narrative (e.g., "The Loss of the Liberal Arts"), the present is still the terminus. The past is selected and proportioned based on what was *lost* to arrive at this disappointing present. The "Golden Age" is given high narrative mass not because it was necessarily representative, but because it serves as the counterweight to the present. The structure is still determined by the endpoint; only the emotional trajectory is inverted.

  **Case C: The Non-Terminus History**
  *Question:* What would a genuinely non-terminus-centered history look like? Is it possible?
  *Answer:* It is possible, but it requires abandoning *continuity* as the organizing principle.
  1.  **The Annales School (*Longue Durée*):** Focuses on slow-moving structures (geography, climate, demographics) rather than events leading to a political present. The "terminus" is not the modern state, but the structural constraints of the era.
  2.  **Foucault's Archaeology:** Explicitly looks for *breaks* and *discontinuities*. It treats the past as a foreign country with different "epistemes," refusing to draw lines of connection to the present.
  3.  **Microhistory:** Focuses on a single event or person (e.g., *The Cheese and the Worms*) not because they lead to us, but because they illuminate a specific texture of the past. The "terminus" is the thick description of the moment, not the outcome.

  ### 4. Why the Distinction Matters

  You noted that you want a name so you can stop re-deriving it. The utility of **Retrospective Gravitation** is that it allows you to critique a history without accusing the author of triumphalism.

  You can say: *"This account is not Whiggish in its moral evaluation; the author is critical of the present. However, it suffers from severe Retrospective Gravitation. The proportioning of the chapters is dictated by the connectivity to the modern department, which renders the actual lived experience of the 19th-century actors invisible."*

  This separates the *architecture* of the history from the *ideology* of the historian. It allows you to point out that a pessimistic history can be just as distorted by the present as an optimistic one, because both are orbiting the same singularity.

  ### Summary
  *   **Existing Term:** *Whig History* (structurally accurate per Butterfield, but colloquially loaded with "progress").
  *   **Proposed Term:** **Retrospective Gravitation**.
  *   **Definition:** The distortion of narrative proportion based on the vector toward a known terminus, rather than contemporary significance.
  *   **Escape Condition:** Only possible by organizing history around discontinuity, structure, or thick description rather than continuity toward an endpoint.

  You have identified the skeleton of Whiggism after the flesh of progress has been stripped away. It is a structural inevitability of narrative history, which is why naming it is the only way to keep it in check.
