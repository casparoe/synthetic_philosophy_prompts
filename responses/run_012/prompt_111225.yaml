      *   *Pastoral Theologians:* They care about practice.
          *   *Objection 7:* "If my choices are 'brutely true' before I exist, how is petitionary prayer meaningful?"

      *   *The "Hope Nobody Asks" Question:* Usually something that exposes a fatal internal contradiction or a consequence the author wants to hide.
          *   *Idea:* If CCFs are brute, could they have been different? If yes, is God lucky? If no, is God constrained? Let's go with the "Divine Luck" problem.

      *   *Selection & Ordering:*
          1.  Analytic (Grounding/Bruteness) - High likelihood, high damage.
          2.  Thomist (Aseity/Simplicity) - High likelihood, high damage.
          3.  Open Theist (Future Openness) - High likelihood, medium damage.
          4.  Analytic (Vacuity/Semantics) - Medium likelihood.
          5.  Thomist (Divine Intellect) - Medium likelihood.
          6.  Pastoral (Prayer) - Medium likelihood.
          7.  Open Theist (Deliberation) - Lower likelihood.
          8.  The "Killer" Question (Divine Luck) - Low likelihood, Fatal damage.

      *   *Refining the Phrasing:* Make them sound like the specific philosophers.
          *   Thomist: "Actus Purus," "Ontological Parasite."
          *   Open Theist: "Settledness," "Risk."
          *   Analytic: "Truth-makers," "Similarity metrics."
