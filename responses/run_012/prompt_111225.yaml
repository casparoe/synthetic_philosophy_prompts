          *   Include a short opening concession to lower the temperature.
          *   Format: Briefing sheet for rehearsal, hard cases marked.

  2.  **Deconstruct the Thesis ("Humble Molinism"):**
      *   *Core Claim:* CCFs are true, known by God, but brute (no truth-maker in the standard sense).
      *   *Motivation:* Preserve libertarian freedom + providential control + block grounding objection.
      *   *Mechanism:* Distinguish truth-conditions from truth-makers; CCFs are contingent truths about possibilia.
      *   *Vulnerabilities:* Bruteness looks like arbitrariness (Analytic); Bruteness looks like a limitation on God (Thomist); Truth of CCFs looks like fixity of future (Open Theist); Practical implications (Pastoral).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Open Theists:* They care about the *openness* of the future. If CCFs are true *now*, is the future settled?
          *   *Objection 1:* "If these counterfactuals are true prior to creation, isn't the future effectively settled?"
          *   *Objection 2:* "Doesn't this make prayer futile if God already knows exactly what you'd do in every scenario?" (Maybe too pastoral? Let's stick to metaphysical openness). Let's go with the "Settledness" objection.

      *   *Reformed Thomists:* They care about Divine Simplicity, Aseity, and Grounding. Brute truths outside God's will look like a limitation.
          *   *Objection 3:* "Brute truths independent of God's essence compromise Aseity."
