prompt: |-
  Ok so I've been running a political theory reading group out of my living room for a couple years now -- 16-20 people typically, grad students, a few rationalist-adjacent engineers, one retired judge, the kind of crowd that will argue about anything. Next session is 90 minutes and I want to do the lottocracy/sortition stuff as an activity instead of just talking about it, because every time we discuss it we end up doing the same two moves (somebody says it's obviously better than elections, somebody says but competence, and we all go home unchanged).

  What I want people to actually *feel* is why selection by lot does something elections structurally can't, and why it isn't just a cute thought experiment. The specific thing: nobody can campaign for a slot when nobody knows who'll get picked (I think the lottocracy people have a name for this, the blind break or something) -- and how that changes what people are willing to say out loud before a decision gets made. And I want them to feel the competence objection honestly too, not have it waved away.

  So here's the ask. You're a political philosopher who also designs deliberative exercises and classroom games. Before you commit to anything, brainstorm 2-3 candidate mechanics and tell me why you're picking the one you pick. Then give me the full build.

  Setting and constraints:
  - 18 people, 90 minutes, one room I can split into two halves with a divider. I'm facilitating and happy to be a returning officer, but I want a minute-by-minute of what I'm doing and where I should shut up.
  - Stakes should be real but tiny -- I'll put the group's snack fund on the line, or a coffee-run chore, something people actually mildly care about. Give me the payoff scheme.
  - Two parallel bodies deciding the same concrete question at the same time, one selected by election and one by lot. I want the mechanics to differ in a way that maps onto the actual structural difference, not just "one group votes and the other group doesn't."
  - Somebody in the room will figure out what I'm doing in the first ten minutes and say it out loud. Tell me how to handle that without killing the thing.
  - Please make the comparison fair. If the lot body just makes a visibly dumber decision, the activity teaches the opposite of what I want. So give me a scoring scheme or a way to run it so the comparison means something, and be honest if there's no way to make it fair at n=9 per body.
  - Nobody hears the words sortition or lottocracy until the debrief.

  What I want back:
  1. Materials list (hat, cards, timer, printed payoff cards, whatever else).
  2. Exact rules for both bodies, including when the selection happens relative to the deliberation -- I have opinions about this and want you to argue for a specific ordering.
  3. A timeline with minutes.
  4. The debrief, mapped moment by moment onto the actual claims: what the blind break is supposed to buy you, what descriptive representation is supposed to buy you, what the competence objection actually claims and what it would take to settle it.
  5. Predictably what goes wrong the first time I run it and how I recover.
  6. The frank bit: which part of the lottocracy case this activity cannot reproduce, and that I'll have to supply myself in the debrief.

  No citations, no reading list, no bibliography -- I don't need them and neither does anyone in the room. Just the runnable thing. Think carefully about the ordering of selection and deliberation, thats where I think the whole game actually lives.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Goal:** Run a 90-minute activity for a political theory reading group (18 people) to demonstrate the structural differences between election-based representation and sortition (lottery-based selection), specifically focusing on the "blind break" (no campaigning) and the competence objection.
      *   **Constraints:** 18 participants, 90 minutes, one room (dividable), real but tiny stakes (snack fund/chore), two parallel bodies (election vs. lot), fair comparison, no jargon until debrief.
      *   **Facilitator Role:** Active but knowing when to shut up.
      *   **Deliverables:** Materials list, Rules (specifically selection timing), Timeline, Debrief script, Troubleshooting, Limitations.
      *   **Key Insight Needed:** The ordering of selection and deliberation is crucial.

  2.  **Brainstorming Candidate Mechanics:**

      *   *Idea 1: The Policy Pitch.* Both groups get a problem. Group A elects 3 reps to decide. Group B draws 3 names to decide.
          *   *Critique:* Too simple. Doesn't capture the *campaigning* dynamic. The "election" group will just vote for the loudest person immediately. It doesn't simulate the *pressure* of needing to be re-elected or the *freedom* of not needing to be.
      *   *Idea 2: The Secret Information.* Both groups get a puzzle. Group A elects leaders who get secret info. Group B draws leaders who get secret info.
          *   *Critique:* Focuses too much on competence/epistemics, not enough on the *incentive structure* of campaigning vs. blind selection.
      *   *Idea 3: The "Constituency Pressure" Simulation.*
          *   *Setup:* 18 people. Split into two rooms (9 each).
          *   *Task:* Decide how to spend $50 of snack money (or assign a chore).
          *   *Twist:* In Room A (Election), 3 representatives are elected *after* a 5-minute campaign period where they can promise things to the other 6. In Room B (Lot), 3 representatives are drawn *before* anyone knows the specific details of the decision, or simply drawn without campaigning.
          *   *Refinement:* The prompt asks for "Two parallel bodies deciding the same concrete question." It also emphasizes the "blind break" – nobody knows who gets picked so nobody campaigns.
          *   *Better Mechanic:* The "Pre-Commitment" vs. "Post-Selection" dynamic.
          *   *Selection Timing:* This is the crux.
              *   *Election Condition:* Participants know a decision is coming. They campaign *to be the decider*. They make promises to the "voters" (the rest of the group) to get selected.
              *   *Lot Condition:* Participants know a decision is coming. Names are drawn *immediately*. No time to campaign. The selected few must decide, but they didn't promise anything to get there.
          *   *Wait, a better structural difference:* The prompt wants to show *why selection by lot does something elections structurally can't*. The key is the *relationship between the selector and the selected*.
          *   *Revised Idea:* **The "Mandate" Game.**
              *   Room A (Election): The 9 people must elect 3 delegates. But before the election, the 9 people write down "Issues they care about." The candidates can read these and tailor pitches. The 3 winners decide.
              *   Room B (Lot): The 9 people are told 3 will be picked. *Before* anyone knows who, they write down issues. Then 3 are picked. The 3 decide.
              *   *Problem:* This is too similar.
              *   *Pivot:* Let's focus on the *incentive to pander*.
              *   *Room A (Election):* 9 people. 3 will be chosen to decide the snack fund. But they are chosen by *vote*. There is a 5-minute "Campaign Phase" where anyone can stand up and say why they should be chosen. Then a vote. Then the 3 decide.
              *   *Room B (Lot):* 9 people. 3 will be chosen to decide the snack fund. They are chosen by *draw* immediately. No campaign. Then the 3 decide.
              *   *Crucial Addition:* To make the "Competence" objection real, the decision needs to be slightly complex, not just "Pizza or Tacos." It needs to be a trade-off.
              *   *Crucial Addition 2:* To make the "Blind Break" real, the Election group needs to feel the pressure of the voters. The Lot group needs to feel the freedom of anonymity.

      *   *Idea 4 (The Winner):* **The "Budget Allocation" with Hidden Constraints.**
          *   *Scenario:* Allocate $100 (fake/snack fund) across 3 categories (e.g., Immediate Snacks, Future Party, Charity/Donation).
          *   *Constraint:* There is a "Hidden Rule" that makes one option objectively better for the group's stated goals, but unpopular. Or, simpler: There are conflicting interests within the room.
          *   *Selection Timing:*
              *   **Election Room:** Campaign *first*, then Vote for Reps, then Reps Decide.
              *   **Lot Room:** Draw Reps *first*, then Reps Decide. (No campaign).
          *   *Why this works:* In the Election room, candidates must signal virtue or popularity to get elected. They will likely promise "More Snacks for Everyone." In the Lot room, the selected people don't owe their position to the others. They can make the "hard choice" (e.g., save the money for a bigger future event) without fear of losing their seat (because they already have it).
          *   *Fairness:* To ensure the Lot group doesn't just look "dumber," the task must be one where "pandering" leads to a suboptimal outcome (Tragedy of the Commons), while "independent judgment" leads to a sustainable one.
          *   *Stakes:* The Snack Fund. If they blow it all now, no coffee later. If they save it, coffee later.
          *   *Selection Timing Argument:* Selection *after* campaigning (Election) vs. Selection *before* deliberation/campaigning (Lot). This isolates the variable of "owing your seat to the voters."

  3.  **Developing the Mechanics (The "Build"):**

      *   **The Task:** Allocate a $50 budget.
      *   **Options:**
          1.  **Immediate Gratification:** Buy fancy snacks now ($50).
          2.  **Sustainable Fund:** Buy okay snacks now ($20) + Save for end-of-season party ($30).
          3.  **Altruistic/External:** Buy okay snacks ($20) + Donate remainder ($30).
      *   **The Twist:** The "Voters" (the non-reps in the Election room) are given secret preference cards. Most want Immediate Gratification. But the *Group Goal* (written on the board) is Sustainability.
      *   **Election Room:** Candidates must win votes. Voters want Immediate. Candidates will promise Immediate to win. Result: $50 on Immediate. Group Goal failed.
      *   **Lot Room:** Reps are random. They see the Group Goal. They don't need votes. They can choose Sustainability. Result: Group Goal met.
      *   **Wait, is this too rigged?** If the Lot group chooses Immediate, the lesson fails. I need to structure the incentives so the Lot group *feels* safe to choose the "better" long-term option, while the Election group *feels* forced to choose the "popular" short-term option.
      *   **Refinement:** Give the "Voters" in the Election room a mechanism to punish representatives. No, that's too complex for 90 mins.
      *   **Simpler Refinement:** The "Campaign" is the key. In the Election room, force a 5-minute campaign where candidates address the room. In the Lot room, no addressing the room allowed before the decision.
      *   **Competence Objection:** Make the budget math slightly tricky. Maybe there's a matching grant if they save.
      *   **Let's simplify the stakes:** Coffee run chore. Who has to make the run?
          *   Option A: Everyone does it. (Fair, annoying)
          *   Option B: The 3 Reps do it. (Efficient, unfair to reps)
          *   Option C: Random person next time.
          *   *Better:* Snack Fund is best. It's positive sum.
      *   **Let's stick to the Snack Fund.**
      *   **The "Hidden Constraint":** The facilitator knows the vendor offers a 50% bonus on unspent funds rolled over.
          *   Spend $50 now = $50 value.
          *   Spend $20 now, Save $30 = $20 + ($30 * 1.5) = $65 value next time.
          *   *Election Room:* Voters want snacks now. Candidates promise snacks now. They spend $50. Value = 50.
          *   *Lot Room:* Reps see the math. No voters to please. They save. Value = 65.
      *   **Fairness Check:** Is it fair? Yes, it tests *incentive structures*, not raw intelligence. Both groups have the same math. One group is pressured by the need to be selected; the other isn't.

  4.  **Handling the "Meta-Commentator":**
      *   Someone will say "This is about sortition."
      *   *Response:* Acknowledge, validate, but pivot back to the task. "Maybe it is. Right now, just play the hand you're dealt. If you figure out the theory, write it down and bring it to the debrief. Don't spoil the data."

  5.  **Drafting the Timeline:**
      *   0-10: Setup & Split.
      *   10-25: Selection Phase (Divergent mechanics).
      *   25-55: Deliberation & Decision.
      *   55-75: Reveal & Scoring.
      *   75-90: Debrief.

  6.  **Refining the Selection Timing (Crucial Step):**
      *   *Election Room:* 5 min Campaign -> Vote -> 3 Reps selected -> Deliberate.
      *   *Lot Room:* 3 Reps selected -> Deliberate. (No campaign).
      *   *Why:* This isolates the "Accountability to Voters" vs. "Independence" variable.
      *   *Wait, one nuance:* In the Lot room, the *non-reps* might try to lobby the reps. In the Election room, the lobbying happens *before* selection.
      *   *Correction:* To make it truly about the "Blind Break" (not knowing who gets picked), the Lot selection must happen *before* anyone knows there's a decision to be made? No, that's too confusing.
      *   *Best approach:* In the Election room, the *contest* for power changes the rhetoric. In the Lot room, the *acceptance* of duty changes the rhetoric.
      *   *Rule:* In Election Room, candidates must state their platform to the whole group to get votes. In Lot Room, reps are told "You are the deciders" and taken to a corner. The remaining 6 in the Lot room are told "You are observers, you can write notes to the reps but cannot speak." In the Election room, the 6 voters *choose* the reps.
      *   *Actually, keep it symmetrical:*
          *   Room A (Election): 9 people. 3 will decide. You must vote for who decides. 5 mins to convince people to vote for you.
          *   Room B (Lot): 9 people. 3 will decide. Names drawn from hat.
          *   *Both:* The 3 deciders get 20 mins to decide. The 6 non-deciders must be silent during the 20 mins (to prevent lobbying during deliberation).
          *   *Difference:* The *legitimacy* of the 3 deciders. Room A owes their power to the 6. Room B owes their power to chance.

  7.  **Addressing the Competence Objection:**
      *   If the Lot group makes a "dumb" decision, the activity fails.
      *   *Solution:* The "Math" must be obvious enough that average competence solves it, but the "Political Pressure" in the Election room must be strong enough to override the math.
      *   *The Trap:* The "Voters" in Room A are given a hint that "We want snacks NOW." The Reps know this. To win, they must promise NOW. Once elected, they might want to save, but they promised.
      *   *The Lot Group:* No promises made. They just see the math.
      *   *Scoring:* Objective value generated.

  8.  **Debrief Mapping:**
      *   Connect the "Campaign" to "Populism/Pandering."
      *   Connect the "Lot" to "Independence/Long-termism."
      *   Connect the "Competence" to "Is the math hard?" (If the math was easy, competence wasn't the bottleneck, incentives were).

  9.  **Troubleshooting:**
      *   *Risk:* Election group sees the math and ignores voters.
      *   *Fix:* Make the "Voters" vocal during the campaign. Give them cards that say "Demand Immediate Snacks."
      *   *Risk:* Lot group is confused.
      *   *Fix:* Clear instruction sheet.
      *   *Risk:* Meta-commentator spoils it.
      *   *Fix:* "Hold that thought, write it down."

  10. **Final Polish:**
      *   Ensure the "Blind Break" concept is highlighted. In the Lot room, you can't campaign because you don't know if you'll have power. In the Election room, you campaign *to get* power.
      *   Make sure the Facilitator knows when to shut up (during deliberation).
      *   Ensure the stakes are clear.

  *(Self-Correction during drafting)*: I need to make sure the "Competence" objection is felt honestly. If the Lot group wins easily, the engineers will say "Well, the task was too easy." I need to acknowledge that in the debrief. The activity proves *incentive alignment*, not *epistemic superiority* in complex tasks. I must be honest about this limitation.

  *(Refining the "Blind Break")*: The prompt specifically mentions "nobody can campaign for a slot when nobody knows who'll get picked."
  *   *Election Room:* You know you *can* get picked if you campaign.
  *   *Lot Room:* You know you *might* get picked, but campaigning is useless/forbidden.
  *   *Implementation:* In the Lot room, tell everyone "3 names will be drawn." Do not draw them yet. Tell them "While we prepare the draw, discuss what the group needs." *Then* draw.
  *   *Wait, better:* In the Election room, the *uncertainty* is resolved by effort (campaigning). In the Lot room, the *uncertainty* is resolved by chance.
  *   *Key Mechanic:* **The Promise.**
      *   Election Room: Candidates must write a "Promise Card" to the voters to get elected. They are bound by honor to try to keep it.
      *   Lot Room: No promises.
      *   This makes the constraint tangible.

  Let's finalize the plan based on this "Promise/Constraint" mechanic. It makes the structural difference visceral.

  *Wait, one more check on constraints:* "Two parallel bodies deciding the same concrete question at the same time." "Selection by election and one by lot."
  Okay, I will split the room.
  Room Left: Election.
  Room Right: Lot.
  Same Task.
  Different Selection.

  *Stakes:* $50 Snack Fund.
  *Decision:* Spend All Now vs. Split (Some Now, Some Later with Bonus).
  *Voter Pressure:* In Election room, the 6 voters are instructed (privately) to prefer "All Now."
  *Lot Room:* No voters, just 9 peers. 3 picked. No private instructions to the rest.

  *Wait, fairness:* If I instruct the voters to be selfish, isn't that rigging it?
  *Counter:* Elections *structurally* require you to appeal to voter self-interest to win. That's the point. The Lot system removes the need to appeal to immediate self-interest to gain power.
  *To make it fair:* The "Group Interest" (Sustainability) is public knowledge in both rooms. The "Voter Interest" (Immediate) is the natural human tendency, amplified in the Election room by the mechanic of needing votes. I won't need to instruct them to be selfish; the election mechanic *creates* the incentive. I just need to make sure the Election room knows they have to *win* the vote to decide.

  *Okay, ready to write.*
answer: |-
  Here is the build. It is designed to be run cold, with minimal theory until the end. The core mechanic isolates **accountability to voters** vs. **independence from voters** as the variable, using the snack fund as the tangible stake.

  ### 1. Materials List
  *   **Room Divider:** Something to split the room visually/audibly (whiteboard, tall table, sheet).
  *   **Two Hats/Bowls:** One for each half of the room.
  *   **Slips of Paper:** 18 total (9 per room).
  *   **Decision Sheets:** 2 copies (one per room) detailing the budget options.
  *   **"Constituency Cards":** 6 cards for the Election Room (handed to the non-reps).
  *   **Timer:** Visible to you, not necessarily them.
  *   **Cash/Envelope:** $50 real cash (or equivalent value gift cards) in an envelope.
  *   **Pens:** For everyone.
  *   **Debrief Notes:** For you (don't show them).

  ### 2. The Rules & Selection Timing

  **The Task (Identical for both rooms):**
  Allocate the $50 Snack Fund.
  *   **Option A (The Populist Choice):** Spend $50 on immediate fancy snacks for today's meeting.
  *   **Option B (The Steward Choice):** Spend $20 on okay snacks today. Save $30. The Facilitator guarantees a 50% match on savings for the end-of-season party ($30 becomes $45 value later). Total Value = $65.
  *   **Constraint:** The decision must be unanimous among the **3 Decision Makers**.

  **The Structural Difference (The "Build"):**

  *   **Room Left (Election):**
      1.  **Campaign (5 mins):** Anyone who wants to be a Decision Maker must stand and pitch *why they should be chosen* to the other 6 people.
      2.  **Selection:** The 6 "Voters" vote for 3 Representatives.
      3.  **Deliberation (20 mins):** The 3 Representatives decide. The 6 Voters must remain silent and watch.
      4.  **Key Constraint:** During the campaign, Candidates are encouraged to tell Voters what they will do. (Social pressure to promise Option A).

  *   **Room Right (Lot):**
      1.  **Selection (Immediate):** 3 names are drawn from the hat *before* any discussion of the task occurs.
      2.  **Deliberation (20 mins):** The 3 Selected decide. The 6 Non-Selected must remain silent and watch.
      3.  **Key Constraint:** No campaigning occurred. The 3 Selected did not promise anything to the 6 Non-Selected to get their seats. They owe their position to chance, not persuasion.

  **Why this ordering?**
  If you draw lots *after* discussion, the selected members have already heard the room's demands and feel pressure to comply. By drawing *before* the task is fully deliberated (or immediately upon entry), you create the "Blind Break." The selected members in the Lot room never had to *sell* themselves to the group. They are free to act on the "Steward Choice" without fear of electoral punishment, because there is no election.

  ### 3. Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Split**
  *   **Action:** Divide the room randomly (count off 1-2). Send them to opposite sides of the divider. Hand out the **Decision Sheets** to everyone.
  *   **Script:** "You are two independent committees. You have the same budget ($50). You have the same options. You have 20 minutes to reach a unanimous decision among your Decision Makers. The rest of you are observers. I will return in 30 minutes to collect the decision. Go."
  *   **Facilitator Note:** Do not explain *how* Decision Makers are chosen yet. Walk to Room Left.

  **00:10 – 00:20: Selection Phase (Divergent)**
  *   **Room Left (Election):**
      *   **Script:** "In this room, you must elect 3 Decision Makers. You have 5 minutes to campaign. If you want to decide, stand up and tell the room why you should be trusted. Then vote."
      *   **Action:** Hand the 6 non-candidates the **Constituency Cards** (secretly). Card text: *"You want snacks NOW. You doubt there will be a party later. Vote for whoever promises immediate snacks."*
      *   **Shut Up:** Once voting starts, step back. Watch who promises what.
  *   **Room Right (Lot):**
      *   **Script:** "In this room, 3 Decision Makers will be chosen by lot. No campaigning. I am drawing names now."
      *   **Action:** Draw 3 names immediately. Hand them the Decision Sheet again (highlighting they are the deciders).
      *   **Shut Up:** Step back. Do not linger.

  **00:20 – 00:40: Deliberation (Parallel)**
  *   **Action:** Split your attention. Spend 10 mins in each room.
  *   **Room Left Watch:** Listen for representatives referencing their campaign promises ("I told you I'd get the snacks..."). Listen for voters sighing if they pivot to Option B.
  *   **Room Right Watch:** Listen for representatives discussing the math freely ("Does anyone actually care if we save?").
  *   **Shut Up:** Do not answer questions about the math. If asked "Can we save?", say "That's up to the Decision Makers."

  **00:40 – 00:55: Scoring & Reveal**
  *   **Action:** Bring rooms back together.
  *   **Script:** "Room Left, what did you decide?" (Write on board). "Room Right, what did you decide?" (Write on board).
  *   **The Reveal:** Calculate the "Total Group Value."
      *   If Option A: $50 Value.
      *   If Option B: $65 Value.
  *   **Payoff:** If Option B was chosen, announce the end-of-season party is upgraded. If Option A, snacks are served now, but no party fund.
  *   **Script:** "One group maximized immediate gratification. One group maximized total value. Let's talk about why."

  **00:55 – 01:30: Debrief**
  *   (See Section 4 below).

  ### 4. The Debrief (Mapped to Claims)

  **Phase 1: The Feeling of Selection (10 mins)**
  *   **Ask Room Left (Election):** "How did it feel to campaign? Did you feel you owed the voters something?"
  *   **Ask Room Right (Lot):** "Did you feel you owed the observers anything?"
  *   **The Point:** This is the **Blind Break**. In Room Left, power was transactional (I give you snacks, you give me power). In Room Right, power was accidental. You can't campaign for a slot when the slot is assigned by chance. This removes the *incentive to pander* before the decision is made.

  **Phase 2: The Competence Objection (10 mins)**
  *   **Ask:** "Was the math hard?" (It shouldn't be).
  *   **The Point:** The competence objection says lots pick idiots. But here, both groups had the same average intelligence. The Election group didn't fail because they were dumb; they failed because their *incentives* were misaligned. They were competent enough to do the math, but structurally pressured to ignore it.
  *   **Honesty Check:** Acknowledge that if the math were *actually* complex (e.g., macroeconomic policy), the Lot group might struggle more. This activity proves Sortition fixes *corruption/pandering*, not necessarily *expertise*. Expertise requires a different fix (staff, advisors).

  **Phase 3: Descriptive Representation (10 mins)**
  *   **Ask:** "Who were the Decision Makers in each room?"
  *   **The Point:** In Room Left, the Decision Makers were likely the loudest/most confident (Self-Selection Bias). In Room Right, they were a random slice of the room.
  *   **The Claim:** Sortition guarantees the decision body *looks* like the population. Elections guarantee the decision body looks like *people who want power*.

  **Phase 4: The "Blind Break" Terminology (5 mins)**
  *   **Reveal:** "This mechanism is called Sortition. The specific thing you felt in Room Right—the inability to lobby for power before selection—is often called the 'Blind Break' or 'Veil of Ignorance' regarding office."
  *   **Close:** "You didn't change your minds about the theory today. You changed your experience of the incentives. That's the only way this theory moves."

  ### 5. Troubleshooting & Recovery

  **Problem 1: The Meta-Commentator**
  *   **Scenario:** At minute 12, someone in Room Left says, "Oh, this is the sortition debate. We're the election control group."
  *   **Recovery:** Do not deny it. Say: "Okay, you know the theory. Now test it. Does knowing the theory change the incentive to get elected? If you know you're in the 'bad' system, can you still act like the 'good' system? Prove it."
  *   **Why:** It turns their cleverness into a constraint. If they act "correctly" despite the election pressure, the data is still good.

  **Problem 2: The Election Group Chooses Option B (The "Good" Outcome)**
  *   **Scenario:** The candidates are too principled and ignore the voters.
  *   **Recovery:** In the debrief, highlight this. "The system *allowed* you to pander. Did you feel the tension? Even if you resisted, the *pressure* was the variable."
  *   **Fix for Next Time:** Make the Constituency Cards more aggressive ("If you don't promise snacks, we won't vote for you").

  **Problem 3: The Lot Group Chooses Option A (The "Bad" Outcome)**
  *   **Scenario:** They just want snacks now too.
  *   **Recovery:** This is the strongest teaching moment. "See? Sortition doesn't guarantee wisdom. It guarantees *independence*. You were free to choose B, but you chose A. That's democratic will, not structural distortion."
  *   **Why:** It prevents the activity from being propaganda. It shows Sortition clears the *noise*, it doesn't manufacture *virtue*.

  **Problem 4: Time Creep**
  *   **Scenario:** Deliberation runs long.
  *   **Recovery:** Hard cut at 40 minutes. "Pencils down. If you haven't signed the sheet, the default is Option A (Spend All)." This adds stakes to the deliberation.

  ### 6. The Frank Bit (Limitations)

  You must supply this in the debrief, because the game cannot reproduce it:

  1.  **Scale:** This works at n=9. It does not prove Sortition works at n=1,000,000 without logistical collapse.
  2.  **Execution vs. Decision:** This game ends at the *decision*. It does not test *implementation*. A Lot body might decide wisely but lack the coalition to enforce it. Elections build coalitions (even if corrupt ones); Lots build decisions.
  3.  **The "Rationalist" Objection:** Your engineers will argue that a "Benevolent Dictator" or "Meritocratic Exam" would beat both. This game compares Election vs. Lot. It does not prove Lot is the *optimal* system, only that it solves the *campaigning/pandering* problem better than Elections.
  4.  **Competence Ceiling:** As noted, if the budget math were actual fiscal policy, the Lot group might need expert briefing. The game assumes "citizen competence" is sufficient for the task. You need to explicitly state that Sortition advocates usually pair the Lot with expert staff, which this game abstracted away.

  **Final Facilitator Check:**
  Your job is not to make Sortition win. Your job is to make the *incentives* visible. If the Election group suffers visibly under the weight of their promises, and the Lot group breathes easier, you have succeeded regardless of the dollar amount spent.
