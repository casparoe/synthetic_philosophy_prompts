  Okay, ready.

  *Wait, looking at the prompt again:* "Defend one answer rather than ending on a both-are-true note."
  Okay, I will explicitly argue that the Sunk-Cost Fallacy is a *misdiagnosis* in this context. It pathologizes what is actually a rational response to a specific set of constraints.

  *Final plan:*
  1. Intro: The dilemma of the brothers.
  2. Critique of Sunk-Cost (It assumes the wrong goal).
  3. Defense of Structural Trap (It explains the momentum).
  4. The Location of the Error (Not in the bids, but in the inheritance).
  5. Verdict: Structure.
