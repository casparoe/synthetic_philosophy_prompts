      *   *Voluntary Association Talk:* Contradicted by exclusive representation and mandatory fees.

  3.  **Evaluate Categories:**
      *   *Private Club:* Ruled out by compulsory representation and dues for non-members. Clubs don't force non-members to pay or accept their representation.
      *   *Business Agent:* Fits the bargaining aspect, but doesn't explain the internal fines or exclusive representation over dissenters.
      *   *Government:* Fits the coercive power (taxing via dues, fining members, exclusive jurisdiction), but lacks democratic accountability to the dissenters and isn't actually state-run.
      *   *Movement:* Too fluid. Unions are institutionalized.

