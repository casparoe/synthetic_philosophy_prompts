      *   To make it truly voluntary: End exclusive representation (allow multiple unions or individual bargaining) and end mandatory dues.
      *   To make it fully public: Make it a government agency (abolish private unionism).
      *   The current package hangs together only if you accept the premise that industrial peace requires a single, empowered interlocutor with enough cohesion to enforce agreements (hence fines/dues).

