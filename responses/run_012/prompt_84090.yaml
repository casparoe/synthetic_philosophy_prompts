answer: |-
  Based on your description, the union is neither a private club nor a government, but a *private entity exercising delegated public authority*. It functions as a quasi-sovereign over the bargaining unit.

  The "private club" label is ruled out by exclusive representation and mandatory dues. Clubs cannot compel non-members to pay fees or accept their representation. Conversely, it is not a full government because it lacks accountability to the dissenting 46 percent and remains privately managed. It sits uncomfortably between a business agent and a state: it negotiates like the former but disciplines like the latter (fining members).

  The package hangs together only if you accept that industrial stability requires a monopolistic bargaining agent with enough cohesion to enforce contracts. The logic is functional, not philosophical. Exclusive representation prevents fragmented bargaining; mandatory dues prevent free-riding on negotiated benefits; internal fines ensure strike solidarity necessary for leverage. The "voluntary association" talk is indeed contradicted by the legal reality of compulsory representation.

  To swap this for a genuinely voluntary club, you would need to abolish exclusive representation. Workers could choose individual contracts or multiple competing unions. Mandatory dues and the duty of fair representation to non-members would vanish. However, this weakens collective leverage.

  To make it a fully public body, the bargaining unit would become a government agency. Union officials would be civil servants, dues would be taxes, and rules would be public regulations. This eliminates private coercion but removes worker autonomy.

  Currently, the system is a hybrid compromise. It grants unions state-like powers (monopoly representation, coercion) to balance corporate power, while keeping them private to maintain worker control. The tension you feel stems from this dual nature: you are subject to its sovereignty without consenting to its membership. The law treats the union as a voluntary association for liability purposes (suing it for strikes) but as a sovereign power for representation purposes (binding dissenters). This inconsistency is the price of the system's stability. To resolve it, you must choose between market freedom (voluntaryism) and industrial democracy (exclusive representation). You cannot have both.
