answer: |-
  You are not a hypocrite. You are operating on a coherent, albeit unarticulated, ethical framework that aligns closely with **Rule-Utilitarianism mixed with Social Contract Theory.**

  Your girlfriend likely perceives hypocrisy because your rules change based on *context* (location, audience, economic impact), which looks like inconsistency from the outside. But from the inside, you are consistently optimizing for **Systemic Integrity.**

  Here is the precise principle that governs your twelve calls, where it breaks, and how to handle the new scenarios.

  ### The Principle: The Cooperative Infrastructure Protocol

  Your moral logic treats social norms like software dependencies. You distinguish between **Infrastructure Rules** (system stability, economic survival, safety) and **Interface Rules** (cultural syntax, politeness, signaling).

  **The Protocol:**
  1.  **Infrastructure Obligations:** If a norm sustains an economic or safety system you are benefiting from, you must follow it, regardless of visibility. (Scenarios 1, 2, 4, 7, 9, 10).
  2.  **Interface Grace:** If a norm is purely cultural signaling, you must attempt compliance, but ignorance is excusable *unless* your failure causes economic harm. (Scenarios 3, 11, 12).
  3.  **The Replication Clause:** If violating a rule models bad behavior to an observer who relies on you for normative data (the child), you must follow the rule even if immediate harm is zero. (Scenario 7).
  4.  **Idle State Exception:** If a rule is Infrastructure but the system is idle (no users, no risk), compliance is optional. (Scenarios 5, 6).

  ### Audit of Your 12 Scenarios

  Here is how your 12 calls map to the protocol:

  *   **1 & 2 (US Tipping):** **Infrastructure.** The waiter's wage depends on this. You are a user of the service; you pay the cost. *Verdict: Consistent.*
  *   **3 (Tokyo Tipping):** **Infrastructure.** In Japan, tipping insults the dignity of the service (a cultural infrastructure). Causing offense is a "system error." *Verdict: Consistent.*
  *   **4 & 5 (Escalator):** **Infrastructure vs. Idle.** Rush hour = high traffic, blocking left breaks flow (harm). 11pm = idle state. *Verdict: Consistent.*
  *   **6 (Red Light 3am):** **Idle State.** No safety risk, no traffic flow to disrupt. *Verdict: Consistent.*
  *   **7 (Red Light + Kid):** **Replication Clause.** The kid is learning the "traffic OS." If you bypass the rule, you corrupt his future installation. You owe the *system* future integrity. *Verdict: Consistent, but this is your weakest link (see below).*
  *   **8 & 9 (Queue):** **Infrastructure.** Holding for 1 is within "latency tolerance." Holding for 4 is a DDoS attack on the queue's fairness. *Verdict: Consistent.*
  *   **10 (Phone Call):** **Infrastructure.** Noise pollution is a resource drain on others' peace. Pub = noise floor is high (no drain). Train = noise floor is low (high drain). *Verdict: Consistent.*
  *   **11 (Bowing):** **Interface Grace.** You tried. It's a syntax error, not a logic error. *Verdict: Consistent.*
  *   **12 (Colleague Tipping):** **Infrastructure.** He is entering your local economy. Ignorance excuses syntax (bowing), not resource allocation (wages). *Verdict: Consistent.*

  ### The Vulnerability: Where You Might Actually Be Wrong

  Your girlfriend likely zeroes in on **Scenario 6 vs. Scenario 7**.

  *   **6:** You break the law because no one sees.
  *   **7:** You follow the law because a kid sees.

  **The Accusation:** "So you only follow rules when you're being watched or teaching someone? That means you don't actually respect the law, you just respect *reputation*."

  **The Fix:** You need to refine the **Replication Clause**.
  In Scenario 7, it's not about the kid *seeing* you. It's about the fact that **rules rely on universalizability.** If you walk, you are effectively voting that "Red lights are optional when inconvenient." If everyone voted that, the system crashes. In Scenario 6, you are voting "Red lights are optional when *safe*."
  *   **The Hard Truth:** If you want to be logically airtight, you have to admit that **Scenario 6 is technically a violation of your own principle.** Even at 3am, the light is part of the safety infrastructure. By walking, you are degrading the habit of compliance within yourself.
  *   **Recommendation:** If you want to win the argument, concede #6. Admit that strictly speaking, you *should* wait, but you fail on personal discipline, not moral theory. If you defend #6, you open the door to the hypocrisy charge.

  ### Addressing the "Hypocrite" Charge on 11 vs 12

  This is the other place she likely attacks: *"You get a pass for bowing wrong, but your colleague doesn't get a pass for not tipping."*

  **Your Defense:**
  Distinguish **Performance** from **Participation**.
  *   **Bowing (11)** is *Performance*. It's about showing respect. Intent matters more than execution. You had the intent.
  *   **Tipping (12)** is *Participation*. It's about economic distribution. Execution matters more than intent. The waiter needs the money, not the apology.
  *   **Why the Colleague is Wrong:** He is participating in an economic system (US dining) that requires a specific transaction to function. Ignorance of the transaction protocol doesn't negate the debt.

  ### The Two New Scenarios

  Here is how your **Cooperative Infrastructure Protocol** handles the edge cases you left out.

  #### 1. The Half-Dead Norm
  *Scenario: Older locals do it, under-30s don't (e.g., dressing formally for Sunday mass, or a specific greeting).*
  *   **Classification:** This is a **Deprecated Feature.**
  *   **Verdict:** You are **not obligated** to follow it.
  *   **Reasoning:** Social contracts require mutual enforcement to be valid infrastructure. If 50% of the population (the future maintainers of the system) has already abandoned the norm, it is no longer "Infrastructure," it is "Legacy Code." Adhering to it provides no systemic stability.
  *   **Action:** Follow the under-30s. You are optimizing for the current stable version of the culture, not the legacy version.

  #### 2. The Corrupt Custom
  *Scenario: A bar where you must slip cash to the door guy to get a table.*
  *   **Classification:** This is a **Systemic Bug / Security Vulnerability.**
  *   **Verdict:** Do **not** follow the norm.
  *   **Reasoning:** Your principle relies on "Cooperative Integrity." A norm that requires bribery to access a public resource violates the **Fairness Layer** of the Social Contract. It creates a system where access is determined by hidden payments rather than queue order or reservation.
  *   **Nuance:** If you *need* the table for a critical reason (business deal, celebration), you pay it as a "tax on inefficiency," but you acknowledge the system is broken. If you are just drinking, you leave. Participating validates the bug.
  *   **Why "When in Rome" Stops Here:** "When in Rome" applies to *cultural interfaces* (how you eat, greet, dress). It does not apply to *corrupt infrastructure* (bribery, discrimination, safety violations). You never owe compliance to a rule that undermines the fairness of the system itself.

  ### Summary for Your Girlfriend

  Tell her this:

  > "I'm not picking and choosing rules based on what I feel like. I'm distinguishing between **Economic/Safety Infrastructure** (which I always owe) and **Cultural Syntax** (which I try my best at).
  >
  > The only inconsistency I have is jaywalking at 3am when no one is around. I treat that as an 'idle system' exception, but I admit that's a personal failing, not a moral principle. Everything else is consistent: I pay for the services I use, I don't break systems that others rely on, and I don't demand grace for financial ignorance, only for cultural clumsiness."

  If you say that, and actually stop jaywalking at 3am, the hypocrisy argument dies.
