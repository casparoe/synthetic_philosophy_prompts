  **Recommendation**
  Admit the principality. By voting to admit, you affirm the principle that constitutional constraints on aggression matter more than the source of executive authority; by voting to reject, you affirm the principle that hereditary power is inherently incompatible with league security regardless of institutional checks. Admission is the consistent choice because it prioritizes the mechanical difficulty of waging war over the label of the head of state, aligning with the league's Kantian foundation that peace is secured by republican constitutions, not necessarily democratic monarchies.

  **Candidate rules**
  Rule (a) tests for structural republicanism: the legislative power must be separated from the executive and hold the war power. This rule is consistent with all four past votes, as the admitted states separated war powers from the executive, while the rejected states concentrated them.

  Rule (b) tests for democratic legitimacy: rulers must answer to elected representatives, excluding hereditary officeholders. This rule is consistent with the rejections and the Federal Republic, but the admission of the Merchant Republic strains it slightly due to the narrow franchise, though an elected assembly still existed.

  Rule (c) tests for consequentialist constraint: the constitution must make war hard and the state must have a track record of peace. This rule is consistent with all past votes, as the admitted states had structural barriers and peace records, while the rejected states lacked barriers or offered only promises.

  **What each predicts**
  | Rule | Prediction for Principality | Reason |
  | :--- | :--- | :--- |
  | (a) Separation of Powers | **Admit** | Legislature controls war/tax. |
  | (b) Elected Representatives | **Reject** | Prince inherits office. |
  | (c) Constraint + Peace | **Admit** | War is hard; decades of peace. |

  **Closest precedent**
  The Merchant Republic is the closest analog and drives my best guess that Rule (a) is the operating principle. Like the principality, it possessed a non-democratic element (narrow franchise versus hereditary prince) but was admitted because its assembly controlled taxes and campaigns. This suggests the council values the assembly's veto over war more than the method of executive selection or breadth of suffrage, supporting the structural definition of republicanism over the democratic one.

  **The case that would settle it**
  A fully elected republic with separated powers that has fought three aggressive wars in the last decade. Rules (a) and (b) would admit it because the structure and legitimacy are perfect, but Rule (c) would reject it because it fails the peace record. This case isolates whether the league prioritizes institutional design or actual behavioral outcomes, resolving the ambiguity between the structural and consequentialist rules that both currently favor the principality.
