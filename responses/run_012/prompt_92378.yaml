answer: |-
  1. **Read of the room**
  The law theorists are looking for a justification of state coercion; if responsibility is just a "practice," they'll worry you're offering consequentialism in disguise. They will latch onto proportionality and scapegoating, ignoring your Strawson exegesis. The Kantians will smell instrumentalization immediately; if standing is conferred by a practice, dignity looks contingent. The psychologist will challenge whether your calibration matches the phenomenology of actual blame. The Judge won't care about metaphysics but will press you on dangerousness: if we drop retributive desert, do we just detain risky people indefinitely? They will ignore the nuance of "participant calibration" and hear "social construction." The one question you're hoping nobody asks is whether your view permits punishing the innocent if the practice of expectation demands it for social stability.

  2. **Objection queue**

  **1. The Kantian Respect Objection (Highest Damage)**
  *   **Voice:** "If standing is conferred by a practice, aren't you treating agents as tools for social maintenance rather than ends in themselves?"
  *   **Why:** They think responsibility requires intrinsic worth, not social utility. This undermines the moral core of your view.
  *   **Reply:** "Calibration isn't manipulation; it's recognizing the agent as a partner in dialogue. To hold someone responsible is to invite them into the normative community, not to use them. The practice is constitutive of respect, not instrumental to stability."
  *   **Soft Note:** This is tight. If "practice" sounds functionalist, you lose. Don't lean too hard on "maintenance."

  **2. The Proportionality Objection**
  *   **Voice:** "Without a metaphysical desert base, how do you limit punishment? Why ten years instead of five?"
  *   **Why:** Law theorists need a limiting principle. If responsibility is just standing, punishment looks unmoored.
  *   **Reply:** "The normative ledger has its own internal logic of proportionality based on the severity of the expectation violated. We don't need metaphysical desert to know that betrayal hurts more than negligence."
  *   **Soft Note:** **Warning:** Your Two-Ledger distinction is doing too much work here. You're asserting the normative ledger has limits without explaining *why* causality doesn't constrain them.

  **3. The Judge's Dangerousness Question**
  *   **Voice:** "In my courtroom, if you remove retributive blame, doesn't this slide into preventive detention for anyone dangerous?"
  *   **Why:** The Judge fears loss of liberty protections. If blame is just policy, dangerous people get locked up forever.
  *   **Reply:** "Participant calibration requires reciprocity. Preventive detention treats the subject as an object to be managed, exiting the practice entirely. My view demands we keep them in the normative community unless they opt out."
  *   **Soft Note:** Risky. If the practice allows exclusion for safety, you concede the point.

  **4. The Scapegoat Objection**
  *   **Voice:** "If responsibility is social standing, can't the community wrongly designate an innocent person as responsible to preserve stability?"
  *   **Why:** Classic worry about practice views. They want to know if your view blocks injustice.
  *   **Reply:** "That's a corruption of the practice, not an instance of it. Calibration requires accurate tracking of expectations. A practice that ignores the causal ledger entirely loses its normative force."
  *   **Soft Note:** **Warning:** Here the Two-Ledger distinction looks like a dodge. You need the causal ledger to block scapegoating, but you said it doesn't matter for responsibility.

  **5. The Phenomenology Objection (Psychologist)**
  *   **Voice:** "When I feel resentment, it feels like tracking a truth about you, not calibrating a relationship."
  *   **Why:** Empirical challenge. If the theory doesn't match the feeling, it's revisionist, not descriptive.
  *   **Reply:** "The feeling tracks the *demand*, not the metaphysics. We feel the weight of the expectation, which is real, even if the ultimate control isn't."
  *   **Soft Note:** Plausible, but don't gaslight the psychologist on emotional data.

  **6. The Quietism/Reform Paradox**
  *   **Voice:** "You say we can reform the practice, but if responsibility is just participating in the practice, where do you stand to criticize it?"
  *   **Why:** Philosophers will spot the internal/external tension.
  *   **Reply:** "We criticize from within, using the practice's own values of fairness and reciprocity. Hard incompatibilism is a call to recalibrate, not exit."
  *   **Soft Note:** Standard Strawsonian move, but ensure you don't sound conservative.

  **7. The Two-Ledger Coherence Objection**
  *   **Voice:** "You say determinism threatens the causal ledger but not the normative one. Aren't those ledgers interconnected?"
  *   **Why:** If causation is fixed, how can normative owes be free?
  *   **Reply:** "Causation explains *how* the harm happened; normativity explains *who* answers for it. We don't blame the hurricane because it has no standing, not because it lacks causation."
  *   **Soft Note:** **Warning:** This is the weakest link. If causation determines the action, the normative ledger looks like a fiction layered on top.

  **8. The Calibration Authority Objection**
  *   **Voice:** "Who decides the calibration? If it's distributed, how do we resolve disputes about standing?"
  *   **Why:** Legal theorists want clear authority conditions.
  *   **Reply:** "It's negotiated through dialogue and institutional rules. The law codifies the baseline, but the practice lives in the interaction."
  *   **Soft Note:** Keep this institutional; don't get too abstract.

  **9. The Hard Incompatibilist Co-opting Objection**
  *   **Voice:** "You're just rebranding our eliminationism as 'reform' to keep the retributive system alive."
  *   **Why:** Skeptics will think you're watering down their critique.
  *   **Reply:** "Eliminationism harms the vulnerable by removing protective norms. Reform preserves the shield of responsibility while dropping the metaphysical baggage."
  *   **Soft Note:** Strong political point, use it.

  *(Note: Objections 2, 3, and 4 are really the same objection: "Without metaphysical desert, what stops abuse?" wearing different hats.)*

  3. **Concessions to make in the first five minutes**
  *   Admit that the "practice" can be unjustly exclusionary (e.g., historical biases in who counts as a participant).
  *   Concede that the causal ledger matters for *excuses* (e.g., coercion, insanity), even if not for ultimate responsibility.
  *   Acknowledge that your view is revisionary about the *justification* of blame, even if it preserves the *practice*.
  *   Admit that some hard cases (severe mental illness) might require exiting the practice, not just calibrating it.

  4. **The exchange that has to land**
  The Kantian will press the Instrumentalization Objection. You must reply: "You worry that calibration treats agents as means. But consider forgiveness. Forgiveness isn't useful; it's a restoration of standing. If responsibility were merely instrumental, forgiveness would be irrational. My view explains why we owe it to agents to hold them responsible: it acknowledges their capacity to answer. To deny them responsibility is to treat them as pets or objects, which is the true violation of dignity. Calibration is the operationalization of respect, not its enemy." If you convince them that *excluding* someone from responsibility is the real disrespect, you neutralize the dignity objection.

  5. **The question I'm hoping nobody asks**
  "What if the practice of responsibility requires punishing an innocent person to prevent a riot that would kill hundreds? Your view says responsibility is about maintaining the practice. Does the normative ledger demand sacrificing the innocent to save the practice itself?"
  *Response:* "No. That breaks the internal logic of the practice. The practice is built on truth-tracking expectations. Punishing the innocent destroys the credibility of the demand, collapsing the normative ledger. It's not a trade-off; it's a condition of the practice's existence."

  6. **Last-resort lines**
  *   "Responsibility is a status, not a substance."
  *   "We don't need to be gods to owe each other answers."
  *   "The alternative to calibration isn't freedom; it's management."
  *   "Determinism explains the push; it doesn't answer the demand."
