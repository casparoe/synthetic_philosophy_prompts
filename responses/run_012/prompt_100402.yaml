answer: |-
  1.  **Diachronic Identity (Persistence Through Turnover)**
      *   **Requirement:** The theory must explain how the collective mind retains its identity despite the complete replacement of its constituent physical parts over time.
      *   **Motivating Case:** The ant colony whose ants are replaced one by one (Ship of Theseus) versus the colony split into two viable halves.
      *   **Status:** Non-Negotiable.
      *   **Rationale:** A mind must be a persistent entity to be a subject of predicates like "believes" or "remembers." If the mind vanishes with every worker's death, it is a process, not an agent.

  2.  **Subsystem Opacity (Ignorant Parts)**
      *   **Requirement:** The theory must account for high-level cognitive capacity without requiring low-level constituents to possess representation or understanding of the global state.
      *   **Motivating Case:** The individual ant as a finite-state device with no colony-level representation; the brain as a system whose neurons are not conscious.
      *   **Status:** Non-Negotiable.
      *   **Rationale:** Empirical fact dictates that ants follow local rules. A theory requiring ants to "know" the colony's goal contradicts biological data.

  3.  **Normativity and Misrepresentation (Pathology)**
      *   **Requirement:** The theory must distinguish between successful function and system error, allowing for the possibility that the collective holds false beliefs or malfunctions.
      *   **Motivating Case:** A colony whose decision threshold is hijacked by a parasite; a colony engineered to signal a binary choice where the signal tracks a hidden food source (veridical) versus a false signal.
      *   **Status:** Non-Negotiable.
      *   **Rationale:** Mere adaptive behavior (like the immune system) does not constitute mentality unless the system can be *wrong* about the world, not just inefficient.

  4.  **Synchronic Unity (Individuation)**
      *   **Requirement:** The theory must provide criteria for when a collection of parts constitutes a single subject versus multiple subjects or a mere aggregate.
      *   **Motivating Case:** The split-brain patient as a test of unity; a colony split into two viable halves; the flock of starlings as a murmuration with no central control.
      *   **Status:** Non-Negotiable.
      *   **Rationale:** Without unity conditions, we cannot determine if "Aunt Hillary" is one mind or thousands. Spatial contiguity is insufficient (flocks are contiguous but rarely unified agents).

  5.  **Original vs. Derived Intentionality**
      *   **Requirement:** The theory must specify whether the colony's goals are intrinsic (original) or merely ascribed by an observer for predictive utility (derived).
      *   **Motivating Case:** The corporation as a legal person with distributed decision-making versus the termite mound built by stigmergy with no blueprint.
      *   **Status:** Camp Preference (Realists require Original; Instrumentalists accept Derived).
      *   **Rationale:** If intentionality is merely derived, the colony is a tool, not a subject. This distinguishes a genuine agent from a thermostat.

  6.  **Cognition vs. Consciousness (Phenomenality)**
      *   **Requirement:** The theory must distinguish between functional information processing (access) and subjective experience (phenomenal), stating clearly which the colony possesses.
      *   **Motivating Case:** Hofstadter's Aunt Hillary (conversational partner) versus the hard problem of consciousness; the immune system as an adaptive, memory-bearing system without a unified subject.
      *   **Status:** Non-Negotiable (The distinction must be respected), Camp Preference (On whether colonies have phenomenality).
      *   **Rationale:** One can be a cognitive agent without being conscious. Conflating the two leads to panpsychism or denies complex unconscious cognition.

  7.  **Subject vs. Process (Ontological Status)**
      *   **Requirement:** The theory must declare whether the collective mind is an entity (a subject that *has* states) or a pattern of activity (a process that *occurs*).
      *   **Motivating Case:** The distinction between mere aggregate versus integrated system; the immune system (process) versus the corporation (legal subject).
      *   **Status:** Non-Negotiable.
      *   **Rationale:** Mental predicates generally require a subject. If the theory dissolves the subject into a flow of cognition, it changes the meaning of "mind."

  8.  **Mechanism of Global Integration (Realizer vs. Realized)**
      *   **Requirement:** The theory must identify the physical substrate that realizes global states without conflating the substrate with the functional state.
      *   **Motivating Case:** Pheromone fields implementing a kind of global workspace; slime mold that solves a maze without neurons.
      *   **Status:** Non-Negotiable.
      *   **Rationale:** Natural selection can produce adaptive behavior without a mind. The theory must show how the pheromone field transcends mere causal chain to become a mental vehicle.

  ***

  ### Jointly Unsatisfiable Subset

  I suspect the following pair of requirements cannot be jointly satisfied by any non-magical theory: **Subsystem Opacity (2)** and **Original Intentionality (5)**.

  **Explanation:** This is the Combination Problem applied to collective mentality. If the constituents (ants) are purely syntactic engines following local rules with no semantic content (Opacity), it is unclear how the aggregate system generates intrinsic "aboutness" (Original Intentionality). Usually, original intentionality is thought to require at least some biological teleology or consciousness at the base level. If the base is semantically empty, the whole risks being a "Chinese Room," possessing only Derived Intentionality (ascribed by the observer). To satisfy both, one must argue for strong emergence where semantics pop into existence at the macro-level despite being absent at the micro-level, a move many find metaphysically untenable.

  ### The Single Exclusionary Requirement

  The requirement that does the most to exclude popular contenders is **Original vs. Derived Intentionality (5)**, specifically the demand for **Original Intentionality**.

  **Explanation:** This requirement immediately excludes the **Intentional Stance** view, which posits that all mentality is instrumental and ascribed by the observer (Derived). It also pressures the **Distributed Cognition** view, which often treats cognition as a functional flow of information without committing to a genuine, intrinsic subject of that cognition. Only a robust **Superorganism** realism attempts to meet this, but it then struggles with Subsystem Opacity.

  ***

  ### Assessment of Contenders

  **The Superorganism View**
  *   **Performance:** Strong on **Diachronic Identity (1)** and **Subject vs. Process (7)**, treating the colony as a genuine biological individual.
  *   **Failure:** Struggles with **Cognition vs. Consciousness (6)**. If the colony is a subject, is it conscious? If yes, it risks absurdity; if no, it struggles to justify **Original Intentionality (5)** without consciousness. It also risks violating **Subsystem Opacity (2)** if it implies the organism "knows" what the parts do not.

  **The Intentional Stance View**
  *   **Performance:** Excellent on **Subsystem Opacity (2)** and **Mechanism (8)**. It requires no internal magic, only predictive utility.
  *   **Failure:** Fails **Original Intentionality (5)** by definition. It treats the colony as a useful fiction, not a real subject. Consequently, it fails **Subject vs. Process (7)**, reducing the mind to a descriptive strategy rather than an ontological entity. It cannot adequately handle **Normativity (3)** beyond predictive failure.

  **The Distributed Cognition View**
  *   **Performance:** Best at explaining **Mechanism (8)** (stigmergy, pheromones) and **Subsystem Opacity (2)**. It respects the **Realizer vs. Realized (8)** distinction well.
  *   **Failure:** Often dissolves the **Subject vs. Process (7)** distinction, preferring to speak of "cognitive systems" rather than "minds." This makes it difficult to apply standard mental predicates (belief, desire) which require a subject. It often sidesteps **Original Intentionality (5)**, treating information as purely functional, which leaves it vulnerable to the charge that it describes complex automation rather than mentality.
