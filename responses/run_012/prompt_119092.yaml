answer: |-
  Dear friend, it is genuinely impressive that you have stumbled into the exact thicket of problems that keeps decision theorists awake at night, because you have correctly identified that the jump from the mathematics to the morality is where the whole thing gets slippery. You are right to feel that the money pump argument and the representation theorem are wearing the same clothes but doing different jobs, and your intuition that transitivity and completeness are not the same kind of beast is spot on. To help you structure your twenty minutes, it is best to start by separating the maths from the normativity, because the von Neumann-Morgenstern representation theorem itself is actually quite modest. It is a piece of pure mathematics which says that if an agent's preferences satisfy four specific axioms, namely completeness, transitivity, continuity and independence, then there exists a utility function such that the agent's choices maximise the expected value of that function. Notice what it does not say. It does not say you ought to satisfy the axioms, and it does not say you ought to maximise utility. It merely says that if you satisfy the axioms, you can be modelled as if you are maximising utility. It is a representation result, not a prescription. The normative bite only comes when we ask why anyone should care about satisfying the axioms in the first place, and that is where the coherence arguments and the money pumps enter the stage.

  The core claim of the coherence argument is that violating these axioms makes you vulnerable to self-defeat. The money pump is the illustrative mechanism for this, but you are quite right to question whether losing money makes you irrational or just gullible. The standard reply is that the irrationality lies in the structure of your preferences, not in your inability to spot a trickster. If your preferences are intransitive, say you prefer A to B, B to C, but C to A, then you lack a consistent ranking of outcomes. The money pump exploits this by offering you a series of trades that you accept individually because each one moves you to a preferred option, but which collectively return you to where you started with less money. The charge of irrationality sticks because you have ended up strictly worse off by your own lights. You started with A, you ended with A, but you have less money, and since you presumably prefer more money to less, you have frustrated your own desires. The argument is that a rational agent should not have preferences that allow them to be led into a state they themselves recognise as worse than the starting point. It is an argument about instrumental rationality, meaning efficiency in achieving your own ends, whatever those ends might be.

  This brings us to your excellent question about whether the moral is to fix your preferences or simply to stop accepting trades. If you say the moral is just do not stand there accepting trades all afternoon, you are effectively admitting that your preferences are flawed and that you need a external rule to protect you from yourself. This is known as the distinction between sophisticated choice and resolute choice. A sophisticated agent anticipates the pump and refuses the first trade, but they can only do this because they recognise that their future selves will make choices that lead to a worse outcome. In doing so, they are acknowledging that their underlying preference ordering is incoherent. Pre-committing not to trade is a rational strategy for an agent with irrational preferences, but it does not make the preferences themselves rational. It is like taking a pill to stop yourself from shooting yourself in the foot; the pill is sensible, but the desire to shoot yourself remains the problem. The coherence argument claims that true rationality requires the underlying preferences to be consistent so that you do not need to bind your future self against your own will. However, there is a nuance here regarding whether the pump bites on a single choice. Strictly speaking, a single choice cannot be pumped. You need a sequence to demonstrate the loss. But rationality is usually assessed over the life of the agent, not in atomic instants. If your preference structure allows for a possible sequence of choices that defeats you, then the structure itself is deemed defective, even if you never actually encounter the pump in reality. The vulnerability is what matters, not the actual exploitation.

  You are also absolutely correct to sense that the case against intransitivity and the case against incompleteness are genuinely different animals. Transitivity is often treated as a logical requirement for the very concept of preference. If you say A is better than B and B is better than C, but C is better than A, you seem to be misusing the word better. It contradicts the idea of a ranking. Completeness, on the other hand, requires that for any two options, you must either prefer one, prefer the other, or be indifferent. This is much harder to defend as a requirement of rationality. There are many cases where it seems perfectly reasonable to say that two options are incomparable, such as choosing between a career in music and a career in law, or between saving a stranger and buying an ice cream. If you cannot compare them, you violate completeness. The money pump for incompleteness is trickier and often relies on adding a small sweetener, like a penny, to break the tie. If you are indifferent between A and B because you cannot compare them, someone might offer you B plus a penny. If you take it, you reveal you prefer B plus a penny to A. But if you still cannot compare A and B fundamentally, can you really be pumped? Many modern philosophers, such as Ruth Chang, argue that incompleteness is rationally permissible and that the money pump arguments against it rely on questionable assumptions about how small improvements affect incomparable options. So, while transitivity is the hard core of the coherence argument, completeness is the soft underbelly where most of the contemporary philosophical fighting is happening.

  Regarding the representation theorem and whether having a utility function is a requirement of rationality, the consensus is shifting towards viewing it as a constraint on form rather than content. You do not need to be a hedonist or a selfish economist to have a utility function. The function simply maps your preferences to numbers. If your preferences are coherent, the maths guarantees such a map exists. Therefore, being representable as a utility maximiser is a consequence of being coherent, not an independent demand. The normative force comes from the coherence, not the maximisation. However, there is a standard objection you should be aware of, which is that the money pump assumes money has constant value. If the marginal utility of money diminishes, losing a tenner might hurt more at the end of the pump than at the start, which could break the cycle. But this is easily fixed by pumping with something else, like chocolates or minutes of time, or by assuming the sums are small enough that marginal utility is roughly constant. The deeper objection is about changing minds. If your preferences change over time, is that a pump? Generally, no. The coherence arguments assume static preferences during the sequence of choices. If you prefer A to B today and B to A tomorrow because you have changed, you are not irrational, you are just different. The pump only works if you hold contradictory preferences simultaneously.

  So, what stands once you take these objections seriously? The strongest remaining claim is that rationality requires avoiding self-defeat. If your preferences allow you to move in a circle and end up worse off, you are failing to achieve your own goals. This establishes transitivity as a very strong requirement. Completeness is weaker and might be better viewed as a requirement for decision rather than preference; you might not need to have a preference between everything, but you must be able to choose when forced. The representation theorem remains a powerful tool because it shows that any coherent agent, regardless of their values, behaves as if they are maximising something. This does not mean life is about maximising utility in a cold, calculating sense, but rather that our choices must hang together in a consistent web. For your philosophy club, the key takeaway is that expected utility theory is not telling us what to value, but how to value consistently. The money pump is not a trick to make you lose money, but a spotlight to show you where your values contradict each other. If you can explain that the argument is about internal consistency rather than external exploitation, and that completeness is far more controversial than transitivity, you will have grasped the conceptual issue underneath it all. It is not about becoming a calculator, but about ensuring that when you reach for what you want, you do not accidentally push it further away.
