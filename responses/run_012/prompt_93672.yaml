answer: |-
  Your hunch is exceptionally sharp. You are watching a live reenactment of one of the most famous stalemates in financial economics and epistemology.

  To answer your specific question: This is a **welded disagreement**. It is two distinct arguments (one about logical consistency, one about empirical reality) fused together by **verbal ambiguity** (the word "efficient").

  The thread is likely doomed to cycle forever *unless* someone explicitly decouples the layers. Here is the breakdown of why this happens, the specific theories they are butchering, and what would actually be required to move the needle.

  ### 1. The Theory They Are Half-Describing
  The argument you described is a folk-version of the **Milgrom-Stokey No-Trade Theorem (1982)** and the **Grossman-Stiglitz Paradox (1980)**.

  *   **The No-Trade Theorem:** If agents have *common priors* (start with the same probability distributions) and are *risk-averse*, speculative trade cannot occur. If I offer you a bet, you infer I have private info. You update your belief. If we are both rational, we realize the price already reflects the aggregate information, and the trade offer itself signals that the bet is bad for you. Trade collapses.
  *   **The Grossman-Stiglitz Paradox:** If markets are perfectly efficient (prices reveal all info), no one has an incentive to pay to gather information. If no one gathers information, prices cannot be efficient.

  The forum users are arguing about the *implications* of these theorems without agreeing on the *assumptions*.

  ### 2. The Three Layers of Confusion
  The disagreement persists because participants are arguing on three different levels simultaneously, thinking they are on the same one.

  #### Layer A: The Semantic Disagreement (What is "Efficient"?)
  You correctly identified this as half the problem. "Efficient" is doing three different jobs in that thread:
  1.  **Informational Efficiency:** Prices equal the expected value given all available information ($P = E[V | \Omega]$).
  2.  **Arbitrage Efficiency:** You cannot systematically make risk-adjusted excess returns (The "Random Walk" idea).
  3.  **Fundamental Efficiency:** Prices reflect the "true" intrinsic value of the asset.

  **The Clash:** The No-Trade theorem is about *Layer 1*. The "billions trade daily" crowd is pointing at *Layer 2*. The "hedging" crowd is talking about risk transfer, which is compatible with *Layer 1* but irrelevant to *Layer 2*. When one person says "The market is efficient," they mean "You can't beat it." When the other says "The market can't be efficient," they mean "Prices don't perfectly reflect truth." They are agreeing with each other while arguing.

  #### Layer B: The Axiomatic Disagreement (Model vs. World)
  This is the "toy vs. reality" fight.
  *   **Team Model:** Treats the No-Trade Theorem as a *consistency check*. It says: "If you observe trade, one of these assumptions (common priors, perfect rationality, no noise) *must* be false." It is not a prediction that trade won't happen; it is a diagnostic tool for *why* it happens.
  *   **Team Reality:** Treats the No-Trade Theorem as a *prediction*. They say: "The model predicts no trade. Trade exists. Therefore, the model is garbage."

  **The Clash:** Team Model is using the theorem normatively (how rational agents *should* behave). Team Reality is using it empirically (how humans *do* behave). The theorem is actually on Team Model's side: it explicitly tells you that for trade to exist, agents must have **heterogeneous priors** (fundamental disagreements) or there must be **noise traders** (people trading for liquidity, not info).

  #### Layer C: The Empirical Disagreement (Why Do We Trade?)
  Once you accept the model isn't literal, you have to explain the volume.
  *   **Heterogeneous Priors:** "I think the coin is biased; you think it's fair." (This violates the 'common priors' assumption of the theorem).
  *   **Noise/Liquidity:** "I need cash now," or "I'm hedging my corn crop." (This violates the 'pure speculation' assumption).
  *   **Overconfidence:** "I know you know something, but I think I know more." (This violates 'common knowledge of rationality').

  **The Clash:** The forum argues about which of these is the *dominant* driver. In prediction markets specifically, **heterogeneous priors** are usually the real answer. People genuinely interpret the same news differently. The No-Trade theorem assumes we process information identically; behavioral economics says we don't.

  ### 3. Why the Thread is Doomed (The Level Mismatch)
  The thread cycles because new users enter at **Layer C** (Why do people bet?), veterans respond with **Layer B** (The model says you shouldn't), and philosophers chime in with **Layer A** (What do you mean by bet?).

  It is a **Category Error**.
  *   The No-Trade Theorem is a statement about **knowledge and logic**.
  *   The Trading Volume is a statement about **psychology and liquidity**.

  You cannot refute a logical constraint with an empirical observation without specifying which axiom you are discarding. When the "billions trade" guy shouts down the "no-trade" guy, he is saying "Reality exists." The "no-trade" guy is saying "Your reality violates rationality constraints." Both are right, but they aren't engaging.

  ### 4. What Would Actually Move It?
  To break the loop, someone needs to post a "Steelman Synthesis." It would look like this:

  1.  **Concede the Theorem:** "The No-Trade Theorem is logically sound *if* we assume common priors and perfect rationality."
  2.  **Identify the Broken Axiom:** "In prediction markets, the 'Common Priors' assumption is the one that fails. We don't start with the same model of the world. I think the poll is skewed; you think the poll is accurate. That is not 'private info,' that is 'different processing functions.'"
  3.  **Redefine Efficiency:** "Therefore, 'Market Efficiency' in this context doesn't mean 'Prices are True.' It means 'Prices are hard to beat net of costs.' The market aggregates our different biases, but it doesn't eliminate them."
  4.  **Acknowledge Noise:** "Furthermore, liquidity traders and hedgers exist. They provide the cover that allows informed traders to profit without immediately revealing their hand."

  ### Verdict
  It is a **welded disagreement** fueled by **verbal ambiguity**.

  *   **Is it verbal?** Yes. "Efficient" and "Bet" are ill-defined.
  *   **Is it empirical?** Yes. It depends on whether humans actually have common priors (they don't).
  *   **Is it welded?** Yes. People conflate the *existence* of trade with the *profitability* of trade.

  **Is the thread doomed?**
  Yes, unless you intervene. The cycle continues because the "No-Trade" intuition is seductive (it feels deep), but the "Volume" intuition is obvious (it feels real). Without distinguishing between **Speculative Trade** (betting on info) and **Liquidity Trade** (betting for cash flow), and without admitting that **rationality is bounded**, the argument is a Möbius strip.

  If you want to win the argument, don't argue about volume. Argue about **priors**. Ask them: *"Do you and I process the same news update in exactly the same mathematical way?"* If they say no, the No-Trade Theorem dissolves, and the betting makes sense. If they say yes, they are claiming to be robots, and you can dismiss them.
