answer: |-
  Your suspicion is well-founded: your extension (5–7) is not a *reductio* of your reading, but a logical consequence of your friend's premises that he finds politically inconvenient. The trouble lies not in your extension, but in the tension between his premise (2) and your premise (6), mediated by the absolute principle in (5).

  Here is an analysis of which step to give up, why it looked secure, and the cost of each repair, followed by the answer to your specific question about original ownership.

  ### The Core Conflict
  Your friend wants to treat property rights as **natural and absolute** (to condemn taxation in step 4) but **conventional and time-bound** (to ignore history in step 7). He cannot have both. If property rights are strong enough to make taxation "theft," they are strong enough to make historical conquest "theft." If historical conquest is not "theft" (due to time passing), then taxation might not be "theft" for the same reason.

  ### Which Step Should You Give Up?
  To preserve (1) and (4) while avoiding (7), you must give up **(5)**.

  **Why it looked secure:**
  Premise (5) (*nemo dat quod non habet*—"no one gives what they do not have") is a bedrock principle of both moral intuition and property law. It feels secure because it protects the integrity of ownership: if I buy a stolen bike, I don't really own it. It gives property rights their moral "stickiness."

  **The Cost of Repair (Rejecting 5):**
  If you reject (5), you admit that **time cures theft.** You are accepting a principle of "prescription" or "statute of limitations" on property rights.
  *   **The Cost to (4):** This severely weakens the moral force of "Taxation is Theft." If a thief can become a legitimate owner simply by waiting long enough, then property rights are not natural moral facts, but social conventions dependent on stability and time. If property is a social convention, then taxation (the price of maintaining that convention) becomes much harder to classify as "theft." You save the taxpayer's standing, but you lose the natural-law foundation that made (4) compelling in the first place.

  ### Alternative Repairs and Their Costs

  **1. Rejecting (6) (The Historical Claim)**
  *   **Why it looks secure:** It is empirically robust. Almost all land titles do trace back to force or enclosure.
  *   **The Cost:** Intellectual dishonesty. To keep (6) false, you must argue that current borders and titles emerged purely through voluntary labor-mixing and exchange. This requires ignoring the history of colonialism, enclosure acts, and conquest. It saves the argument only by divorcing it from reality.

  **2. Modifying (2) (The Acquisition Principle)**
  *   **Why it looks secure:** It is the standard Lockean libertarian bridge between self-ownership and external property. It looks like a moral axiom.
  *   **The Cost:** If you modify (2) to accommodate (6), you must admit that labor-mixing is insufficient for ownership without **consent** or a **proviso**.
      *   If you admit the earth was **commonly owned**, then (2) requires consent for appropriation. Since consent was rarely given (per 6), titles are void. This leads directly to (7).
      *   If you admit the earth was **unowned**, then (6) is false (you can't steal unowned land), unless you invoke the **Lockean Proviso** (appropriation is invalid if it leaves others worse off). Given current inequality, the Proviso is likely violated, which *also* leads to (7) (justifying redistribution to rectify the proviso violation).
      *   **Result:** Modifying (2) to be historically consistent validates your conclusion (7), undermining the friend's political goal.

  ### The Specific Question on Original Ownership

  > *Can the historical claim in (6) be had without a premise about who owned the earth in the first place, and if it cannot, what is left of (2)?*

  **No, (6) cannot be had without a premise about original ownership.**

  To claim that enclosure or conquest was "theft" (as implied in 6), you must assert that the land **already belonged to someone** (either specific individuals, indigenous groups, or humanity in common) prior to the appropriation.
  *   If the earth was **unowned** (Locke's default), then "enclosure" is not theft; it is *original acquisition*. It only becomes problematic if it violates the Lockean Proviso (leaving "enough and as good").
  *   If the earth was **commonly owned**, then enclosure *is* theft without consent.

  **What is left of (2)?**
  If you accept the premise required for (6) (that the earth was commonly owned or that appropriation requires consent), **Premise (2) collapses.**
  *   Standard libertarian (2) says: Labor + Unowned Object = Ownership.
  *   Historical (6) requires: Labor + Common Object + **Consent** = Ownership.

  If you add "Consent" to (2), then nearly all existing property titles are invalid (supporting 7). If you remove "Consent" from (2) to save existing titles, you must admit the earth was unowned, which makes (6) false (it wasn't theft, it was homesteading).

  ### Conclusion

  The trouble lies in your friend's original steps, specifically the interaction between **(2)** and **(5)**.

  *   **If you keep (1) and (4):** You must accept that property rights are absolute moral claims.
  *   **If property rights are absolute:** Then (5) must hold (stolen goods stay stolen).
  *   **If (5) holds and (6) is true:** Then (7) follows inevitably.

  Your friend wants to use the moral absolutism of (1) and (4) to protect current owners from the State, but he relies on the historical negligence of (5) and (6) to protect current owners from History. He is attempting to wield property rights as a **shield** against taxation while using them as a **sword** against history, but the logic requires the sword to cut both ways.

  To keep (1) and (4) without (7), you must argue that the State is a unique moral agent outside the historical chain of title—a claim that requires abandoning the very libertarian individualism that makes (1) plausible. The most honest repair is to accept (7): if taxation is theft, then holding untaxed land derived from conquest is also theft, and the only moral question is which theft constitutes the lesser injustice.
