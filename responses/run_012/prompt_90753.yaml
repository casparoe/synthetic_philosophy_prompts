  ### Brainstorming Pass

  **Goal:** Construct a joint statement that respects the mathematical rigor of the Variance-Decomposition (VD) camp while acknowledging the conceptual depth of the Construct-Skeptic (CS) camp, without collapsing into a bland compromise.

  **Key Tensions:**
  1.  **Definition:** VD sees $h^2$ as a stable parameter within bounds; CS sees it as a contingent artifact of measurement.
  2.  **Utility:** VD sees predictive power for selection/intervention targeting; CS sees high risk of misinterpretation regarding malleability.
  3.  **Counterfactuals:** VD believes we can model $h^2$ under new environment distributions; CS worries that changing the environment changes the developmental system itself, making the counterfactual $h^2$ incomparable.
  4.  **Three-Schooling-Worlds:** This is the stress test. VD predicts $h^2$ changes due to $V_E$ and $Cov(G,E)$ shifts. CS predicts $h^2$ changes reveal the metric's instability rather than the trait's nature.

  **Strategy for Agreement:**
  -   Anchor on the formal definition ($V_A/V_P$).
  -   Agree on what $h^2$ does *not* imply (individual determinism, immutability).
  -   Agree that environment distribution matters.

  **Strategy for Disagreement:**
  -   Frame disagreements as differences in *inference license* rather than mathematical error.
  -   VD claims the number licenses specific predictions; CS claims it licenses none without further causal modeling.
  -   Use the "Counterfactual Heritability" and "Three-Schooling-Worlds" cases to pinpoint exactly where the divergence lies (stability of the parameter vs. stability of the construct).

  **Potential Pitfalls:**
  -   Avoiding CS sounding like they deny genetics.
  -   Avoiding VD sounding like they deny environment.
  -   Ensuring the JSON is strictly formatted.
  -   Ensuring camp labels are exact.

