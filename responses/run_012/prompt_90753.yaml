  # Joint Statement on Heritability Estimates: Scope, Limits, and Interpretations

  **Prepared by:** The Variance-Decomposition Camp and The Construct-Skeptic Camp
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on Heritability Metrics

  ## 1. Agreed Claims

  We, the undersigned parties, acknowledge the following claims as accurate descriptions of our shared understanding regarding heritability estimates. We commit to using these formulations in future public discourse to prevent common misunderstandings.

  1.  **Population Specificity:** A heritability estimate is a parameter describing a specific population at a specific time, defined as the ratio of additive genetic variance to total phenotypic variance within that context.
      *   *Note:* Both camps agree this is a statistical property of a distribution, not a physical constant of nature.
  2.  **Individual Level:** A heritability estimate does not partition the cause of an individual's trait value into genetic and environmental portions.
      *   *Note:* Both camps reject the inference that a high heritability implies an individual's trait is "mostly genetic."
  3.  **Malleability:** A high heritability estimate does not imply that the trait is immutable or insensitive to environmental intervention.
      *   *Note:* Both camps agree that changing the environment distribution can change the mean phenotype regardless of the heritability estimate.
  4.  **Environmental Dependence:** The value of a heritability estimate depends on the range and distribution of environments sampled in the population; restricting environmental variance increases the estimate, all else being equal.
      *   *Note:* Both camps agree that $h^2$ is sensitive to $V_E$.
  5.  **Estimation Assumptions:** Standard methods for estimating heritability (e.g., twin, family, or genomic designs) rely on assumptions about the correlation between genetic and environmental factors that may not hold in all populations.
      *   *Note:* Both camps agree that violation of these assumptions (e.g., gene-environment correlation) biases the estimate.
  6.  **Predictive Scope:** A heritability estimate licenses predictions about the resemblance between relatives within the sampled population and environment, but licenses no direct predictions about outcomes outside that range without additional causal modeling.
      *   *Note:* This delimits the VD camp's predictive claims to the sampled scope, which the CS camp accepts as valid but narrow.

  ## 2. Disagreements Table

  | ID | Crux (Neutral Formulation) | Variance-Decomposition Position | Construct-Skeptic Position | Shared Case or Argument | Variance-Decomposition Prediction | Construct-Skeptic Prediction | Moves Variance-Decomposition? | Moves Construct-Skeptic? | Substantive, Verbal, or Mixed |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **Informative Value:** Does the estimate provide actionable information for policy or intervention planning regarding the trait? | The estimate identifies the proportion of variance responsive to selection or genetic targeting; it guides where to look for genetic influences. | The estimate conflates statistical association with causal structure; it is systematically misleading for policy because it ignores developmental context. | The Three-Schooling-Worlds Case (see Section 4). | High $h^2$ suggests genetic interventions may be more efficient than environmental ones within the current range. | High $h^2$ suggests nothing about intervention efficiency without knowing the causal mechanism of the environmental variance. | No | No | Substantive |
  | **C2** | **Counterfactual Stability:** Is "counterfactual heritability" (under a shifted environment distribution) a well-defined parameter? | Yes; it is the heritability parameter calculated relative to the specified alternative environment distribution. | No; shifting the environment distribution alters the developmental system, making the counterfactual parameter incomparable to the actual one. | The definition of Counterfactual Heritability (see Section 4). | The quantity is well-defined and estimable via modeling. | The quantity is ill-defined because the trait construction changes. | No | No | Substantive |
  | **C3** | **Causal Interpretation:** Does the estimate reflect additive genetic *causes* or merely genetic *associations*? | It reflects additive genetic causes insofar as it predicts response to selection based on genetic value. | It reflects associations confounded by gene-environment correlations and developmental systems. | The assumption of no gene-environment correlation in standard models. | The estimate approximates causal influence within the model's bounds. | The estimate captures confounding structure inherent in the population. | Yes (if confounding is quantified) | No | Mixed |
  | **C4** | **Trait Identity:** Across different environment distributions (e.g., schooling worlds), is the "trait" the same construct? | Yes; the phenotypic measure remains the same operational variable, allowing variance comparison. | No; the measure may capture different underlying capacities depending on the environmental context. | The Three-Schooling-Worlds Case results. | The trait is stable; variance components shift. | The trait is context-dependent; variance components reflect different constructs. | No | No | Substantive |

  ## 3. Verbal Residue

  We identify the following disputes as primarily verbal, arising from divergent usage of technical terms rather than disagreement on empirical facts.

  1.  **Issue:** The meaning of "Heritable."
      *   **Why Verbal:** The Variance-Decomposition Camp uses "heritable" to mean "statistically associated with genetic variance in a population." The Construct-Skeptic Camp hears "heritable" as "caused by genes in an individual."
      *   **Dissolving Reformulation:** Both camps agree to use "heritable" only in the population-variance sense (Claim 1) and to use "genetically influenced" when discussing individual causal mechanisms, acknowledging that the latter requires evidence beyond heritability estimates.
  2.  **Issue:** The meaning of "Cause."
      *   **Why Verbal:** The Variance-Decomposition Camp defines cause operationally via response to selection (manipulating gene frequencies). The Construct-Skeptic Camp defines cause mechanistically via developmental processes.
      *   **Dissolving Reformulation:** Disagreements about "causality" should be reframed as disagreements about "predictive utility for selection" (VD) versus "explanatory utility for mechanism" (CS).

