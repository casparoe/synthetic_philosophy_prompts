  4.  **Address Specific Questions:**

      *   **(a) Sam's dominance argument (2) vs. Ruth (1):** Does it answer her? No. It asserts CDT axioms against her logical constraint. It talks past her.
      *   **(b) Ruth's credence move (5):** Does it rescue her? Yes, but requires calculation.
          *   Payoffs: $C = 3p + 0(1-p)$, $D = 5p + 1(1-p)$ where $p$ is prob other cooperates given I cooperate.
          *   Wait, standard EDT calculation:
          *   $EU(C) = P(C|C) \cdot 3 + P(D|C) \cdot 0$
          *   $EU(D) = P(C|D) \cdot 5 + P(D|D) \cdot 1$
