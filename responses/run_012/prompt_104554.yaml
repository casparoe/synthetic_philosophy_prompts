  Me and my mate Priya have a running argument about adding up happiness and I need you to call it. The game: I describe two made-up worlds, she says which one is better. Everything's in made-up "happiness points", higher is better, and zero is a flat neutral life — not sad, not happy.

  Her record so far:

  1. World A: three people, all on 50. World B: same three people, one on 90 and the other two on 55. She picks B.

  2. World A: one rich guy on 1000, a hundred other people all on 5. World B: the rich guy on 999, the hundred others on 6. She picks B.

  3. World A: everyone on 50. World B: one being on a trillion, everyone else on 49. She picks A, and gets weirdly annoyed at me for even asking.

  Now the next one. I read somewhere about a utility monster — some being that enjoys eating people so much that letting it eat them makes the total happiness of the world go up, more than the people lose by dying. So: World A, everyone alive and fine, nobody eaten. World B, the monster eats a load of people but its bliss is so huge the world's total is way higher than A. Which does she pick?

  What I want: her call on the monster, the rule she seems to be running, what other rules fit her three earlier answers just as well, and one new made-up world that would seperate those rules from each other. Also tell me how confident you are and which part your least sure about.

  Keep it under 450 words, and I don't know any of the proper names for these positions, so please don't just throw jargon at me — explain it like I'm the one who has to argue it out with her at the pub.
