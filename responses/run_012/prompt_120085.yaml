prompt: |-
  I need help writing a speech, and I'd rather it be thought through properly than just nicely phrased. Take the role of a philosopher who works on ethics and on life-writing — biography, hagiography, the whole "we learn virtue by admiring people rather than by memorizing rules" tradition — and who has also read enough Plutarch to be annoying about it at dinner. Here's the situation. I'm chair of the governors at a small school that turns 120 this year, and I give the Founder's Day address every November. Our founder, Edith Marlow, is celebrated locally for basically one thing: during the 1905 typhoid outbreak she kept the school open and taught the girls herself in the fever ward when the staff fled — except a historian has just published a book showing that the famous version of that story is largely Edith's own later embellishment, that she very likely was never in the ward at all, and that she spent the following decade fighting to keep the school from admitting the mill-workers' daughters she is now celebrated for teaching. The book is solid, the historian is coming to Founder's Day (we invited her before any of this, long story), some alumnae want me to just tell the old story, the head wants "the usual" and has asked me not to relitigate it, the founder's great-granddaughter will be in the second row, and the students mostly want it to be over.

  So: write me the address, about 900 words. It has to be genuinely edifying — these people came for that — without asserting anything the book has cast doubt on, and it has to get past the trap of "well, the myth is true in a deeper sense," which I think is a cop-out unless it's actually argued. Use what I've been chewing on lately: Plutarch's insistence that he's writing lives and not histories, and that a small thing — a phrase, a joke — often reveals character better than a battle does; the old hagiographic convention that a saint's life is written to be imitated, which means it has to be legible, and legibility costs you detail; and the modern biographer's suspicion of exactly that trade. The real question I want the speech to answer out loud, not just by implication, is what a life can still be used for morally once the edifying version is gone — whether learning from someone requires that they actually did the thing, or only that the life (or the story) makes a possibility visible. And I'd like it to say something about the difference between admiring a person and learning from a life, since I suspect that's where the alumnae's hurt is actually coming from. Before you write, brainstorm for a bit: list the ways a life can be morally useful and the ways it can be misused, and tell me which of them survive a debunking — then draft. Don't make the historian the villain and don't make the myth the hero; half the room loved the old story and half are embarrassed by it, and I want both halves to be able to sit there.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of ethics and life-writing (biography/hagiography), well-read in Plutarch. Annoying at dinner but wise in speech.
      *   **Context:** Chair of Governors at a small school (120th anniversary). Founder's Day address (November).
      *   **Subject:** Edith Marlow (Founder).
      *   **Conflict:** Traditional story (heroic nurse/teacher during 1905 typhoid) vs. New Historical Book (embellishment, exclusionary practices regarding mill-workers' daughters).
      *   **Audience:** Alumnae (attached to myth), Head (wants "the usual"), Great-granddaughter (present), Students (bored), Historian (present, respected).
      *   **Constraints:** ~900 words. Genuinely edifying. No false claims. No cheap "myth is deeper truth" cop-outs without argument. Must address: What is a life for morally after debunking? Does learning require factual accuracy? Difference between *admiring a person* and *learning from a life*.
      *   **Tone:** Nuanced, philosophical but accessible, dignified, unifying (not alienating either side).
      *   **Pre-writing Task:** Brainstorm moral utility of lives vs. misuse, determine what survives debunking.

  2.  **Brainstorming: Moral Utility of Lives (Pre-writing):**
      *   *Ways a life is morally useful:*
          *   Exemplar: Shows what is possible (virtue in action).
          *   Warning: Shows pitfalls (vice in action).
          *   Identity formation: Gives a community a shared narrative ("We are the kind of people who descend from X").
          *   Motivation: Inspires action through emulation.
          *   Continuity: Connects past to present.
      *   *Ways a life is misused:*
          *   Idolatry: Uncritical worship prevents growth.
          *   Weaponization: Using the founder's name to shut down debate ("Edith wouldn't have liked that").
          *   Erasure: Ignoring the cost of the virtue (e.g., Edith's exclusionism).
          *   False Comfort: Believing the myth protects us from complexity.
      *   *What survives debunking?*
          *   The *story* survives as a cultural artifact, even if the *fact* doesn't.
          *   The *aspiration* survives. The fact that the community *wanted* Edith to be that person tells us about *us*, not just her.
          *   The distinction between *admiration* (looking up at a statue) and *emulation* (walking a path). Admiration needs a pedestal; emulation needs a map. A map can be corrected and still be useful.
          *   Plutarch's point: We aren't writing history (facts of battles); we are writing lives (movements of the soul). But a movement of the soul based on a lie is shaky. However, a movement of the soul based on a *corrected* understanding is stronger.
          *   Hagiography's point: Legibility costs detail. We simplified Edith to make her usable. Now we must make her usable again, complexly.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the occasion and the tension without naming it aggressively. Set the Plutarchian frame immediately.
      *   **Middle (The Pivot):** Address the new information gently. Distinguish between the woman (Edith) and the story (Marlow). Use the "admiration vs. learning" distinction.
      *   **The Philosophical Core:** Argue that the utility of a life isn't in its perfection but in its *availability* for interpretation. If the story changes, the lesson changes, but the need for the lesson remains.
      *   **Closing:** Bring it back to the students and the future. Invite the historian implicitly. Reconcile the room.

  4.  **Drafting - Section by Section (incorporating the Persona):**
      *   *Voice:* Calm, slightly academic but warm, avoiding jargon but keeping the concepts.
      *   *Plutarch Reference:* Needs to be natural. "Parallel Lives," the idea of the mirror.
      *   *The "Cop-out" Check:* Avoid saying "The myth is true because it inspires." Instead, say "The inspiration was real, even if the specific act was not, and now we must find the real ground for that inspiration."
      *   *The Historian:* Acknowledge her presence as a gift, not a threat.
      *   *The Great-Granddaughter:* Honor the lineage without demanding she defend the ancestor.
      *   *The Students:* Make it about *their* lives, not just the past.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe say Edith was complex.
      *   *Correction:* Too vague. Be specific about the shift from *idol* to *interlocutor*.
      *   *Initial thought:* Quote Plutarch directly.
      *   *Correction:* Better to paraphrase his intent. "I am writing lives, not histories."
      *   *Key Distinction:* Admiration looks at a finished statue. Learning looks at a working blueprint. We can keep the blueprint even if we redraw the lines.
      *   *Word Count Check:* Keep it tight. 900 words is about 6-7 minutes spoken. Don't ramble.

  6.  **Final Polish:**
      *   Check tone: Is it too cold? Add warmth about the school community.
      *   Check constraints: Did I answer the prompt's specific philosophical questions? (Yes: utility of life after debunking, admiration vs. learning).
      *   Check the "Trap": Did I avoid the "myth is deeper truth" cop-out? I need to ensure I argue that the *value* shifts from factual emulation to aspirational dialogue.

  7.  **Final Review against constraints:**
      *   Role: Philosopher/Life-writing expert. (Check)
      *   Word count: ~900. (Check)
      *   Content: Edith Marlow, 1905 typhoid, historian present, great-granddaughter present. (Check)
      *   Philosophy: Plutarch, hagiography, utility of biography. (Check)

  *(Self-Correction during final review)*: Make sure I don't sound like I'm scolding the alumnae. The hurt is real. Acknowledge that the loss of the myth feels like a loss of virtue. Reframe it as a maturation of virtue.

  8.  **Final Draft Generation** (Proceeding to generate output based on these thoughts).
answer: |-
  **Founder's Day Address**
  **November 14, 2025**

  Distinguished guests, colleagues, alumnae, and students.

  It is a tradition on days like this to speak of foundations. We usually mean the brick and mortar, or the endowment. But Edith Marlow founded this school on a narrative. For one hundred and twenty years, we have sustained ourselves on the story of a woman who stayed when others fled. We have gathered here to admire her.

  But admiration is a specific moral act. It requires a pedestal. It requires distance. When we admire, we look up. When we learn, however, we must look across. We must see the footing.

  This year, we find ourselves in a peculiar position. We have new information about Ms. Marlow. Some of you find this liberating; others find it a betrayal. I understand both reactions. To lose a hero feels like losing a part of oneself. But I want to suggest that we have confused the utility of a life with the perfection of a legend.

  Plutarch, whom I read too much of, famously insisted he was writing *Lives*, not *Histories*. He argued that a small phrase or a joke reveals the soul better than a battle does. He was not interested in forensic accuracy for its own sake; he was interested in legibility. He wanted to provide mirrors for his readers to see their own virtues and vices. But a mirror that distorts the face is eventually useless. If we are to use Edith Marlow's life as a moral tool, it must reflect reality, even if that reality is less dramatic than the fever ward.

  There is a distinction I wish us to hold today between *admiring a person* and *learning from a life*. Admiration is static. It says, "She was great, and I am small." It relies on the infallibility of the subject. If the subject falls, the admiration collapses into cynicism. This is the pain many in this room feel. You were promised a saint, and you were handed a complicated administrator.

  But learning from a life is dynamic. It asks, "What was possible for her, and what is possible for me?" This does not require perfection. It requires only that the life remains legible.

  The historian sitting among us today has not destroyed Edith Marlow. She has returned her to us as a human being. The old story told us that courage is staying in a room when others flee. That is a beautiful thought. But the new story tells us something perhaps more difficult, and more useful: that courage is also building an institution that lasts, even if you make mistakes in the process. It tells us that legacy is not a straight line of virtue, but a negotiation with the constraints of one's time.

  So, what is a life for, once the edifying version is gone?

  It is for dialogue. A myth demands assent; a biography invites conversation. If Edith Marlow excluded the mill-workers' daughters in 1910, that is not a reason to erase her name. It is a reason to examine our own gates. Who are we excluding now, in the name of excellence, or tradition, or stability? The old story let us off the hook; we were the heirs of a hero, so we were good by association. The new story puts the hook back in. We are the heirs of a flawed human, so we must choose to be good on our own merit.

  This is the hagiographic trade: legibility costs detail. We simplified Edith to make her usable. Now we must make her usable again, complexly. We do not need to pretend the fever ward story is true to value the school's survival. We do not need to pretend she was inclusive to value education. We need only acknowledge that she built a space where we can stand today, and ask ourselves how we will widen it.

  To the great-granddaughter in the second row: you do not owe us a saint. You owe us nothing but your presence. The bloodline is not the legacy; the work is.

  To the students who want this to be over: you are the only reason this matters. You are not here to worship Edith Marlow. You are here to use her. Use her success. Use her failures. Use the fact that she was ordinary enough to be corrected by history, yet significant enough to be remembered by a school like this.

  We are not here to relitigate 1905. We are here to decide what 2025 looks like. If we treat our founder as a statue, the chipping paint hurts us. If we treat her as a partner in a long conversation, the new evidence is just a new thing to say.

  Let us stop admiring the myth. Let us start learning from the life. Let us keep the school open, not because she did, but because we must.

  Thank you.
