  1. Sacred Values: Empirical research on protected values shows that merely proposing a trade-off on certain moral issues triggers deontological outrage rather than negotiation, breaking the psychological mechanism required for your Pareto improvements even if the deal is logically possible.
  2. Status Quo Justice: By treating the current distribution of power as the endowment point, your model implies that a slaveholder and abolitionist reach a Pareto improvement by compromising on the frequency of whipping, which validates injustice as a successful trade.
  3. Lexicographical Preferences: If either party holds a binary constraint like "no abortion ever" rather than a continuous preference, the indifference curves become asymptotic and the contract curve disappears entirely, leaving no interior solution to be found.
  4. Unfalsifiability: If every instance of intractable conflict is explained away as a failure to identify the correct trade dimensions, the theory becomes compatible with all outcomes and risks becoming an unfalsifiable tautology.
  5. Preference Endogeneity: Moral identities are often constituted by their commitments, meaning the act of negotiating a trade alters the values being traded and shifts the axes of your box mid-calculation, making stable equilibrium impossible.
