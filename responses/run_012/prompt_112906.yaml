  Does separating the rule-following skeptical argument into distinct metaphysical and epistemic challenges dissolve the apparent intractability of standard replies to Kripke's Wittgenstein? This project asks whether the standard standoff persists only because current formulations conflate the constitution of meaning with the knowability of meaning.

  The received debate is exhausted. Dispositionalists, primitivists, and communitarians trade blows without resolution. This stalemate arises because the skeptical challenge is typically presented as a single demand: produce a fact that constitutes meaning and thereby justifies future use. This formulation fuses the metaphysical question (what makes it the case that I mean plus?) with the epistemic question (how can I know I mean plus?). The fusion persists because the skeptic's notion of a "fact" is overloaded: it must be truth-conditional yet also capable of guiding the agent. Existing positions leave the distinction genuinely open because they treat the skeptic's single demand as monolithic. A primitivist might posit a brute fact to satisfy the metaphysical requirement but implicitly assumes this fact is accessible to satisfy the epistemic one. By not distinguishing the requirements, the debate cycles without progress, as objections targeting epistemic access are mistakenly deployed against metaphysical claims, and vice versa.

  The semester's work proceeds in three phases. In the first month, I will reconstruct the skeptical argument as two separate derivations: one concluding no fact constitutes meaning, the other concluding no agent can know which rule they follow. I will test whether the separation is real rather than verbal by attempting to construct scenarios where the metaphysical fact obtains but the epistemic condition fails, and vice versa. If the skeptical argument holds in one case but not the other, the distinction is substantive. In the second month, I will map existing responses against these distinct arguments. For each major view, I will isolate which question it answers and identify where it silently presupposes an answer to the other. I will develop a diagnostic criterion: if a response appeals to community agreement, does it address what makes meaning factual or merely how meaning is verified? In the third month, I will evaluate whether objections standardly raised against these views retain force when the questions are separated. For instance, a dispositionalist account might fail the metaphysical test but succeed epistemically, or vice versa.

  A successful result yields a reordered dialectic where specific objections target specific questions, exposing a viable position previously obscured by the fused formulation. This might look like a hybrid view that accepts epistemic opacity while securing metaphysical facts, or a dissolution of the metaphysical skepticism once epistemic constraints are removed. The deliverable will be a draft article articulating this separation and its consequences. Failure would consist in demonstrating that the separation is merely verbal—that the premises for both arguments are logically inseparable, forcing the project to collapse back into the original standoff. I will treat this negative result honestly as a substantive philosophical finding regarding the structure of normativity.

  One semester allows for the logical reconstruction and classification of major responses, but not a comprehensive historical exegesis of Wittgenstein's text versus Kripke's exposition. If the argument requires more room, I will cut the detailed textual analysis of Wittgenstein's remarks. The focus will remain strictly on the argumentative structure of the skeptical paradox itself. This ensures a completed manuscript chapter or article draft by the semester's end, regardless of whether the separation holds. The scope is limited to the core skeptical argument and the three dominant response types, excluding peripheral variations or broader implications for normative realism beyond rule-following.
