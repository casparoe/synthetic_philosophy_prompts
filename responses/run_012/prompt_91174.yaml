answer: |-
  This is a robust, pedagogically sound plan. It moves from production to reception to systemic analysis, which is the correct arc for this concept. The constraint of "no theory until the end" is the right call; it prevents students from intellectualizing the problem before they've felt it in their hands.

  However, 90 minutes with 16 students for three distinct rounds of drawing and analysis is extremely tight. The friction will be in the transitions and the scoring mechanics. Below are tactical refinements to ensure you don't run out of time for the debrief, followed by the straight talk on limitations you requested.

  ### Tactical Refinements & Logistics

  **1. Time Boxing (Hard Stops)**
  You need a visible timer. If Round 1 bleeds, Round 3 (the boundary strip) gets cut, and that is the visual anchor for the whole lesson.
  *   **Round 1:** 35 mins max. (5 rule, 15 draw, 5 hang, 10 guess/score).
  *   **Round 2:** 20 mins max. (10 draw/transplant, 10 discuss).
  *   **Round 3:** 20 mins max. (10 draw strips, 5 vote, 5 observe).
  *   **Debrief:** 15 mins.

  **2. Round 1: The Scoring Mechanism**
  Writing down guesses for every single glyph (24 glyphs total x 3 teams guessing = 72 data points) will eat 15 minutes instantly.
  *   **Tweak:** Instead of identifying every letter, ask guessing teams to mark only the **ambiguous ones**. Give them a red dot sticker. "Put a red dot on any letter where you hesitated for more than two seconds, or where you guessed wrong."
  *   **Why:** This highlights the *failure points* of the style rule rather than confirming the successes. The lesson is in the friction, not the fluency.
  *   **Rule Recovery:** Keep this. It's quick. "Write the rule on one sticky note per team panel."

  **3. Round 2: The Transplant**
  *   **Tweak:** When handing a glyph to another team, require them to draw *two* surrounding letters from their own set next to it. Context is key. An 'a' alone is a shape; an 'a' between 'n' and 't' is a letter.
  *   **Prompt:** "Does this intruder break your rhythm, or does your rhythm swallow the intruder?"

  **4. Round 3: The Boundary Strip**
  *   **Tweak:** Pre-cut the paper into long strips (maybe 3 inches x 12 inches) so they don't waste time cutting.
  *   **Voting:** To prevent anchoring (where the first mark influences the rest), have students close their eyes or look away while you place a generic marker (like a small blue dot) at the *average* consensus point after collecting their individual marks. Or, have them write their name on a small slip of paper and place it on the wall, then step back.
  *   **Better:** Give each student 3 small distinct stickers. They place them silently. The "cloud" of stickers shows the spread better than a single line.

  **5. The Reveal (Last 10-15 Minutes)**
  You have the right examples ('a' vs 'a', 'rn' vs 'm'). Here is how to sequence the questions to keep it in *their* words:
  *   **Step 1 (The Shape):** Point to the two 'a's. "Did anyone draw both of these today? Did anyone call them different letters?" (Establish: Shape varies wildly.)
  *   **Step 2 (The System):** Point to the 'rn' vs 'm'. "When does 'rn' become 'm'? Is it the ink, or is it the space between the humps?" (Establish: Context defines form.)
  *   **Step 3 (The Job):** Point to the boundary strip voting cloud. "Why did most of you stop calling this an 'a' at roughly the same spot? Who told you that?" (Establish: Shared habit, not physical law.)
  *   **Step 4 (The Labels):** Now you can introduce the terms. "You just demonstrated **category membership**, **systemic identity**, and **reader consensus**."

  ### The Straight Talk: What This Exercise Can't Do

  You asked to be straight about the limitations. You identified the big one (historical stability vs. classroom consensus), but here are three more specific traps this exercise sets, and how to name them without deflating the discovery.

  **1. It Overstates Arbitrariness**
  *   **The Risk:** Students may leave thinking letterforms are *purely* social agreements and that any shape can be any letter if you convince enough people. They might ignore the physical constraints of tools, hands, and eyes.
  *   **The Fix:** In the debrief, acknowledge the *cost* of deviation. "You could make an 'a' that looks like a square, but what happens to your writing speed? What happens to the reader's eye fatigue?" Remind them that conventions exist because they are *efficient*, not just because they are agreed upon. The "job" of the letter includes ergonomic and perceptual efficiency, not just semantic slot-filling.

  **2. It Underplays Historical Inertia**
  *   **The Risk:** As you noted, 16 classmates for 90 minutes is not 500 years of printing history. The "boundary" they find on the wall is negotiable in a way that the boundary in a subway sign is not. They might feel empowered to break rules that are actually structural load-bearing walls.
  *   **The Fix:** Be explicit about the difference between *studio play* and *public communication*. "In this room, we can renegotiate the contract between writer and reader. Out there, the contract is signed in centuries of habit. Your job as designers is to know when you're signing a new contract and when you're breaking an old one."

  **3. It Flattens "Legibility" vs. "Recognition"**
  *   **The Risk:** The exercise treats "reading a letter" as a binary event (I guessed it / I didn't). In reality, reading is fluid. We read words, not just letters. A highly stylized 'a' might be unreadable in isolation (Round 1) but perfectly clear in a word (Round 2 context).
  *   **The Fix:** Ensure Round 2 emphasizes *flow*. If a letter stops the eye, it has failed its job, even if it is eventually recognized. The "system" isn't just a set of siblings; it's a flow of traffic.

  **4. The "Essence" Trap**
  *   **The Risk:** You want them to debate whether there is an essence. The risk is they settle on "No, there is no essence, it's all relative." That is just as dogmatic as "Yes, there is a perfect Platonic 'a'."
  *   **The Fix:** Don't let them settle. End with the tension. "Some of you think the 'a' is a role. Some think it's a shape family. Both views will change how you draw tomorrow. Keep both in your head."

  ### Final Check on Materials
  *   **Markers:** Ensure they are all the same thickness (e.g., all Sharpie Chisel Tip). If one team gets fine liners and another gets broad nibs, the "style rule" conversation gets muddied by tool variance.
  *   **Wall Space:** You need about 10 feet of clear wall for Round 3. Clear it beforehand.
  *   **Teams:** 4 teams of 4 is ideal. 5 teams of 3 leaves one person out of the dynamic if someone is shy. Stick to 4 teams.

  This plan works. It creates the necessary friction. If you keep the timer strict and refuse to rescue them from the ambiguity in Round 1, the debrief will write itself.
