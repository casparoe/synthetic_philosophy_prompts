  # Game Design: The Oracle's Trap

  **Objective:** Demonstrate Good's Theorem (Value of Information $\ge$ 0) in Rounds 1–3, then violate it in Round 4 by structurally altering the decision problem conditional on information acquisition.
  **Time:** 90 Minutes.
  **Players:** ~12 Graduate Students.
  **Materials:** 12 "Decision Packets" (folders containing 4 Round Sheets), a deck of 24 cards (12 Red, 12 Black), a whiteboard for scores.

  ---

  ## Part 1: Setup & Rules (10 Minutes)

  **Narrative:** You are "Analysts" trying to maximize points by predicting the color of a card drawn from a deck. Points convert to course credit (or coffee).

  **The Decision Structure (Rounds 1–3):**
  1.  **State:** A card is drawn (Red or Black, 50/50).
  2.  **Information Phase:** You may choose **Look** (peek at the card for free) or **Don't Look**.
  3.  **Action Phase:** You choose **Bet Red**, **Bet Black**, or **Pass**.
  4.  **Payoff:**
      *   Correct Bet: +10 Points.
      *   Incorrect Bet: -5 Points.
      *   Pass: 0 Points.
      *   *Constraint:* If you choose **Don't Look**, you must decide *before* the card is revealed. If you choose **Look**, you decide *after*.

  **Round 4 Warning:** Tell the group: *"Round 4 introduces a new structural rule. Read your sheet carefully. The decision problem may differ from previous rounds."*

  ---

  ## Part 2: The Rounds (40 Minutes)

  ### Rounds 1–3: The Force of Good's Theorem
  *   **Procedure:**
      1.  Distribute Round 1 Sheets.
      2.  Students mark Look/Don't Look. Collect sheets.
      3.  For those who **Looked**: Show them the card privately. Let them write their Bet.
      4.  For those who **Didn't Look**: They write their Bet blind.
      5.  Reveal cards. Tally scores.
      6.  Repeat for Rounds 2 and 3.
  *   **Expected Outcome:** Everyone chooses **Look**. Everyone bets correctly. Score = +10 per round.
  *   **Lesson:** $EU(\text{Look}) = 10$. $EU(\text{Don't Look}) \approx 2.5$ (assuming risk neutrality and betting). Value of Information = +7.5. No one who Looked ended up worse off than if they had been forced to guess blind.

  ### Round 4: The Trap (The Fragility)
  *   **Material:** Distribute Round 4 Sheets. The layout is identical to Rounds 1–3 *except* for one clause in the Payoff section.
  *   **The Rule Change (Printed in Bold on the sheet):**
      > **ROUND 4 SPECIAL RULE: THE SURPRISE BONUS**
      > **Payoff for Correct Bet: +20 Points.**
      > **CONDITION: If you chose LOOK, the Bonus is Voided (Payoff = 0).**
      > **If you chose DON'T LOOK, the Bonus Applies.**
  *   **Mechanism:** This creates an **Information Hazard**. Knowing the state destroys the value of the outcome.
  *   **Procedure:** Same as before. Collect Look/Don't Look choices first.
  *   **The "Gotcha":** Rely on **habituation**. After 3 rounds of "Look is dominant," many students will skim the sheet and mark **Look**.
  *   **Outcome:**
      *   Students who **Looked**: See the card, Bet Correctly, receive **0 Points**.
      *   Students who **Didn't Look**: Guess (50% chance), if Correct receive **20 Points**. (Expected Value = 10).
      *   **Value of Information:** $0 - 10 = -10$.
  *   **Note:** If *everyone* notices the rule and no one Looks, the game "fails" to produce damage. In this case, you (the Instructor) reveal that the *mere presence of the rule* made VoI negative, and the "damage" was the loss of the opportunity to gain the 20 points compared to Rounds 1-3. However, typically 30-50% will miss the clause due to cognitive inertia.

  ---

  ## Part 3: Debrief & Mapping (40 Minutes)

  ### 1. Verify the Result (10 mins)
  *   Tally Round 4 scores. Highlight the students who Looked and got 0.
  *   Ask: *"Did acquiring free information make you worse off in expectation?"*
  *   Yes. $EU(\text{Look}) = 0$. $EU(\text{Don't Look}) = 10$.
  *   Ask: *"Did I charge you for the look?"* No.
  *   Ask: *"Did I lie?"* No (the rule was printed).

  ### 2. Map to Good's Theorem Assumptions (20 mins)
  Guide the students to identify which assumption of Good's Theorem was violated. Write the standard assumptions on the board and cross them out.

  *   **Assumption 1: Expected Utility Maximization.** (Did they maximize? Yes, based on their beliefs. If they missed the rule, their belief was wrong. If they saw the rule and Looked anyway, they violated EU.)
  *   **Assumption 2: Information is Free.** (It was free.)
  *   **Assumption 3: Bayesian Updating.** (They updated correctly on the card color.)
  *   **Assumption 4: The Decision Problem is Fixed.** **(VIOLATED)**
      *   *Explanation:* Good's Theorem assumes the payoff function $U(a, s)$ depends only on the Act $a$ and State $s$. In Round 4, the Payoff function depended on the **Epistemic State** (whether the agent Looked). $U(a, s, \text{Look})$.
      *   *Term:* **Information Hazard** or **Endogenous Payoffs**.
  *   **Assumption 5: State Independence.** (Did the card change because they looked? No. But the *value* of the card changed.)

  ### 3. Discussion: Why is this fragile? (10 mins)
  *   **Real World Examples:**
      *   *Medical Testing:* Knowing you have a genetic marker might cause psychological harm (utility depends on knowledge) or make you uninsurable (payoff structure changes).
      *   *Negotiations:* If the other party knows you have inspected their offer, they may harden their stance (Strategic Interaction).
      *   *Security:* Scanning a system might trigger an alarm (Looking changes the State).
  *   **The "Rationality" Defense:** A perfectly attentive agent would not Look in Round 4.
      *   *Instructor Point:* "Exactly. Good's Theorem holds for the perfectly attentive agent in a fixed problem. The 'fragility' is that real decision problems often shift when we probe them, or our utility functions are not purely consequentialist over material outcomes."

  ---

  ## Part 4: Troubleshooting & Risks

  **Risk 1: No one Looks in Round 4.**
  *   *Why:* They read the bold text.
  *   *Fix:* This is actually a success for the theorem (they recognized VoI < 0). To salvage the "feeling of damage," ask: *"How many of you felt tempted to Look out of habit?"* Discuss the **cost of vigilance**. The "damage" is the cognitive load required to verify the problem hasn't changed.
  *   *Debrief Adjustment:* Shift the lesson to **Assumption: Costless Processing**. Good's Theorem assumes you know the decision problem for free. If verifying the problem costs effort, VoI can be negative.

  **Risk 2: Students claim "Deception".**
  *   *Why:* They feel tricked by the rule change.
  *   *Fix:* Acknowledge it. *"The theorem assumes a Fixed Decision Problem. I changed the problem. The lesson is that in the real world, you cannot assume the problem is fixed. The 'deception' is the world's complexity, not my instructions."*

  **Risk 3: Confusion between "State" and "Payoff".**
  *   *Why:* Students might argue the State didn't change.
  *   *Fix:* Clarify that Good's Theorem requires $U(outcome)$ to be stable. If $U(outcome | information) \neq U(outcome | ignorance)$, the theorem's math breaks because the expectation is taken over different utility functions.

  ---

  ## Part 5: What the Game Cannot Reproduce

  Be frank with the group:
  *"This game relies on you missing the rule (bounded rationality) or on a payoff structure that explicitly penalizes knowledge. It cannot reproduce negative Value of Information for a **perfectly rational, fully informed, single-agent Expected Utility Maximizer** in a **fixed decision problem**. If such an agent exists, Good's Theorem is mathematically watertight. The 'fragility' is not in the math, but in the mapping of the math to reality. The game simulates the reality, not the math breaking."*

  ---

  Verdict: The assumption that the utility of outcomes is independent of the agent's information state (Consequentialism).
