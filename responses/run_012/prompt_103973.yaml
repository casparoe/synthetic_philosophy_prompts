      *   "In Round 4, I (Instructor) will set the outcome *after* you decide to Look."
      *   "If you Look, I will ensure you lose."
      *   "If you Don't Look, I will ensure you win."
      *   "I am bound by these rules."
      *   *Why Look?* Because they don't believe me / Habit.
      *   *This highlights:* **Assumption: State is independent of information gathering.**
      *   *This is stronger.* It shows Good's Theorem fails in **Game Theory** (Single agent vs Nature holds, Single agent vs Adversary fails).
      *   *I will use this.* It's more "Decision Theory" relevant (Single vs Multi-agent).

  6.  **Addressing "Predictably go wrong":**
      *   Students might not Look in Round 4 if they are too skeptical.
      *   Mitigation: Incentivize Looking in Rounds 1-3 heavily so habit is strong.
      *   Students might argue "That's not Decision Theory, that's Game Theory."
      *   Rebuttal: Good's Theorem assumes a fixed decision problem (Nature). Introducing an adversary changes the problem.

  7.  **Final Polish:**
      *   Ensure the "Verdict" line is precise.
      *   Check timing (90 mins).
      *   Ensure materials are simple.

