      *   **Is this deception?** No, it's written on the sheet.
      *   **Debrief:** Assumption: **Utility is independent of information state.**

  5.  **Refining the "Will they Peek?" issue:**
      *   If I write it in bold, they won't peek.
      *   If I don't, it's deception.
