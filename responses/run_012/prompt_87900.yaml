answer: |-
  The dust in the valley didn't settle; it hung in the heat haze like a suspended verdict. Elara wiped the grit from the tablet screen, but the image remained the same. A single, brilliant blue bloom on the thermal scan. Sector Four. The machine, a borrowed piece of orbital surveying tech, sang with confidence. It processed reflectivity, soil density, and subsurface heat into a single metric of likelihood. The readout was clean. It suggested water with a clarity that felt like certainty.

  Beside her, the drill rig loomed, a skeletal beast waiting for a command. There was fuel for one bore. One attempt. If the bit hit dry rock, the village below would have to migrate before the next moon. There was no second guess, no averaging out the errors over a hundred tries. This was the only try.

  Sector Four was the rational choice. The machine had never lied about a signal this strong. The evidence was singular, unblemished, and loud. It drowned out the silence of the valley.

  But Elara's boots were dirty. She had spent the morning walking Sector Seven, the alternative site. The scanner showed nothing there but noise—gray static, ambiguous readings, a void in the data. By the metric of the screen, Sector Seven was a desert. Yet, as she walked it, the land spoke in a dozen quiet voices.

  She looked down at her notebook. It was filled not with numbers, but with sketches and fragments. The presence of the *acacia* trees, stunted but alive, their roots seeking depth. The specific shade of the lichen on the northern rocks, which only persisted where humidity lingered underground. The direction of the ant hills, aligned with the ancient subsurface flow rather than the surface wind. The oral history of the elders, who spoke of a dry well in that sector that had never fully emptied, even in the Great Drought of their grandfathers' time.

  Individually, none of these things proved water. An acacia could survive on dew. Lichen could be misleading. Elders could be wrong. The scanner in Sector Four was worth more than any single one of these signs. If she weighed them piece by piece, Sector Four won. The probability of success seemed higher there, defined by the sharpness of the signal.

  But Sector Seven felt different. It felt heavy.

  Elara closed her eyes. The scanner offered a high peak of confidence built on a narrow foundation. It was a spire. One wind, one calibration error, one anomaly in the rock composition, and it would shatter. The evidence was thin. It was all one kind of evidence, processed through one algorithm, derived from one satellite pass.

  Sector Seven was a plateau. Lower, perhaps, but vast. The evidence was varied. It came from biology, geology, history, and observation. They were different languages speaking the same word. If the lichen was wrong, the ant hills might still be right. If the elders' memory had faded, the trees remained. The failure of one strand did not collapse the whole web.

  She walked back to the rig, the dust coating her throat. The foreman, Kael, was waiting. He tapped the tablet showing Sector Four.

  "It's screaming at us, Elara," he said. "Look at that density reading. It's textbook."

  "It's one reading," she said. Her voice sounded rough.

  "It's the best reading we have."

  Elara looked at the tablet, then at the horizon where Sector Seven lay hidden behind a ridge. She needed something to tip the scale. Not to make Sector Seven more *likely* in a numerical sense—she couldn't count the chance of water any more than she could count the grains of sand—but to make the ground beneath her decision more solid. She needed weight.

  "I'm going back to Seven," she said.

  "We lose light in an hour," Kael warned. "If you walk away from the blue zone, you're betting on ghosts."

  "Give me twenty minutes."

  She drove the rover fast, kicking up plumes of ochre. When she reached the coordinates of the old dry well, she killed the engine. The silence rushed back in. She knelt by the cracked earth of the ancient wellhead. It was just a circle of stones now, filled with debris.

  She pulled a sampling tube from her kit and drove it into the sediment at the bottom of the filled shaft. She wasn't looking for water; she knew she wouldn't find it this close to the surface. She was looking for diatoms. Microscopic algae shells that remained long after the water vanished. If the well had held water for centuries, the soil structure would hold the memory of it in a way the surface scanner couldn't see.

  She smeared the sample onto a glass slide and looked through the portable scope. The light was fading, the sun dipping below the ridge. Her hands shook slightly.

  There they were. Not just a few, but a dense layer. *Cyclotella*. Freshwater species. And mixed in, traces of sedimentary layering that matched the flow direction indicated by the ant hills.

  This didn't guarantee water today. The aquifer could have shifted. The vein could have sealed. The likelihood of striking water wasn't necessarily higher than the scanner's blue bloom in Sector Four. The diatoms proved the past, not the present. But the evidence was no longer just observation and story. It was now physical, chemical, historical, and biological. The strands had tightened into a cable.

  The probability hadn't jumped to certainty. She still might drill and find stone. But the *basis* for the belief had changed. It was no longer a guess based on a single bright light in the sky. It was a judgment grounded in the convergence of independent truths. She felt the difference in her chest. The anxiety of the gamble was still there, but the hollowness was gone.

  She drove back to the rig in the dark. The headlights cut through the dust. Kael was standing by the controls, the tablet glowing in his hand like a idol.

  "Well?" he asked.

  Elara stepped out of the rover. She didn't show him the slide. He wouldn't see what she saw. He would just see specks of dust. He wanted the blue bloom. He wanted the clean number.

  "Move the rig to Sector Seven," she said.

  "Seven?" Kael laughed, a sharp, dry sound. "The scanner says it's dead rock. You're ignoring the data."

  "I'm using more of it," she said.

  "You can't weigh dirt against a satellite, Elara. It's not comparable."

  "It is if you're the one who has to explain the dry hole," she said.

  She walked to the control panel. The coordinates for Sector Four were already entered. Her finger hovered over the execute key. The thin evidence whispered to her. It was the easy choice. If it failed, she could blame the machine. The probability was on her side, statistically. No one could say she was irrational for trusting the high-confidence scan.

  But rationality wasn't just about the height of the peak. It was about the width of the base.

  She deleted the coordinates for Sector Four. She typed in the numbers for Sector Seven. The screen remained dark, no blue bloom, no comforting metric. Just numbers on a black background.

  "Lock the legs," she said to Kael.

  He hesitated, then moved to the hydraulics. The hiss of pressure filled the valley. The rig groaned as it turned, swinging its nose away from the satellite's promise, pointing toward the dark ridge where the ants marched and the lichen clung.

  Elara watched the drill bit lower toward the earth. She felt the heavy silence of the valley pressing against her, not with threat, but with substance. She had no guarantee. She had no number. She only had the weight of the ground beneath her feet, and the knowledge that it was solid enough to stand on.

  "Engage," she said.
