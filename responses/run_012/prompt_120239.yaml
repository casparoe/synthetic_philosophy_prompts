  *(Self-Correction on the "open counter" detail)*: The user said "no closed counter, and a terminal that does not quite meet the bowl." This is essentially an `o` with a vertical tick. This is notoriously hard to read. The "double-story" suggestion from the collaborator is standard for legibility. To defend the single-story, the "stem" needs to be more than a terminal; it needs to disrupt the circular silhouette significantly. I need to emphasize *silhouette disruption*.

  Let's build the response around **"Distinctive Feature Preservation."** This borrows from linguistics. Phonemes are distinguished by features (voiced/unvoiced). Graphemes are distinguished by topological features (open/closed, ascender/no ascender). If the style removes the feature, the phoneme/grapheme collapses.

