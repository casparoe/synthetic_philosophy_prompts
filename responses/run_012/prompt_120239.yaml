          *   Need "cutouts" or "ink traps" or shifting masters.
          *   At hairline, the stem needs to be thicker relative to the stroke.
          *   At black, the counter needs to stay open.
          *   *Principle:* The *proportions* of the distinctive features must vary across the axis to maintain the topological invariant.

  7.  **Synthesizing the "Principle":**
