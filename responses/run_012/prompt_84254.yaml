  **Mark:** 35/100
  **Degree Band:** Fail

  **Feedback Comments:**

  1.  **Length and Depth of Discussion:** This submission is drastically under length for a second-year module essay (approx. 350 words). The question asks you to "Discuss at least three accounts". A proper discussion requires exegesis, charitable reconstruction, and critical evaluation of each view. Here, you have merely asserted positions in a single paragraph each. This prevents you from demonstrating the required depth of understanding. Even if your arguments were sound, the lack of development means you have not met the learning outcomes for the assignment. In future, ensure you allocate sufficient word count to unpack each philosopher's argument before critiquing it.

  2.  **Interpretation of Hume:** Your reading of Hume is textually unsupported and likely incorrect. You state: "Fidelity is therefore a natural virtue in Hume's sense". In the *Treatise* and *Enquiry*, Hume explicitly classifies fidelity to promises as an *artificial* virtue, grounded in convention and social utility, distinct from *natural* virtues like benevolence. While you argue that the *sentiment* is natural, Hume's point is that the obligation itself arises from the convention, not the sentiment alone. You need to engage with the specific textual evidence for the artificial/natural distinction rather than imposing a reading that contradicts the primary classification in the *Treatise* (3.2.5).

  3.  **Interpretation of Scanlon:** You conflate Scanlon's Principle F (Fidelity) with Principle L (Loss/Reliance). You write: "the obligation only really bites once the promisee has altered her position in reliance". For Scanlon, the obligation under Principle F arises from the creation of expectations and the assurance given, not strictly from reliance (which is the focus of Principle L). One can violate Principle F even if the promisee has not yet changed their position, provided the expectation was intentionally created. You need to distinguish between the wrong of breaking the assurance and the harm caused by reliance. This distinction is crucial for your argument about 'reach'.

  4.  **Argumentative Consistency:** There is a contradiction between your introduction and your conclusion. In the introduction, you state: "My aim is to show that no single account explains bindingness". However, your conclusion states: "I conclude that promises bind in virtue of the promisor's will". This is a Kantian single-account conclusion. You cannot claim pluralism in the intro and monism in the conclusion without explaining how you reconciled these positions. If you intend to argue for a hybrid view (Kantian grip + Scanlonian reach), you must state this explicitly and defend the coherence of combining them.

  5.  **Application of Grip/Reach Distinction:** You have correctly identified the distinction drawn in lectures (grip = promisor's reason; reach = promisee's standing). This is the strongest part of the essay. However, you assert that they "come apart" without sufficiently arguing *why* they must come apart rather than simply being two aspects of the same obligation. The 'dying person' case is a good test case, but you need to explain why the promisor retains a reason (grip) if there is no one to hold them to it (reach). Is this a moral reason or a normative obligation? You need to be more precise about the normative force remaining in the absence of a claimant.

  6.  **Engagement with Contemporary Literature:** The question asks for "a couple of the contemporary people who write on promising". You mention Scanlon, but you do not engage with the other contemporary authors on the reading list (e.g., Raz, Shiffrin, or Owens). You rely mostly on the historical figures. To pass this module, you must demonstrate engagement with the specific contemporary debates outlined in the syllabus, particularly regarding the 'normative power' view versus the 'expectation' view.

  7.  **Writing and Structure:** While your prose is clear, the essay reads like an abstract or a plan rather than a full paper. Each paragraph makes a claim without providing the necessary premises to support it. For example, you claim conventionalism "struggles with reach" regarding children; you need to explain *why* a conventionalist cannot account for promises to children (e.g., by arguing children can be party to conventions, or that guardians act as proxies). Without this defence and rebuttal, the objection is asserted rather than argued.

  8.  **Recommendation:** You need to rewrite this essay entirely to meet the word count and to correct the textual misreadings of Hume and Scanlon. Focus on one argument per paragraph and ensure you provide textual evidence for your interpretative claims. Please attend office hours to discuss how to structure a philosophical argument over 2,500 words.
