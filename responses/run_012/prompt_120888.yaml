answer: |-
  This is a classic problem in both tort law and moral philosophy, often framed as the distinction between **misfeasance** (doing something badly) and **nonfeasance** (doing nothing). Your editor's "you-broke-it rule" is actually a very robust heuristic for a specific kind of causation: **causation as a deviation from a baseline of expected maintenance.**

  Here is the principle that gets you close to all your verdicts, the answer to the hiker/lifeguard puzzle, and how to handle your editor's constraint.

  ### The Principle: Assumed Stewardship

  Your gut is tracking **responsibility**, not physics. Your philosopher friend is tracking **counterfactuals**.

  In physics (and your friend's view), a cause is simply something without which the effect would not have occurred. By that definition, your failure to vote caused the candidate's loss. Your failure to stamp the fire caused the ridge to burn. Your failure to breathe kept the air in your lungs. This definition is too broad for human stories because it makes everyone responsible for everything they *could* have prevented.

  Your "you-broke-it rule" is better described as the **Principle of Assumed Stewardship**. Under this principle, an omission is a cause only if you have previously altered the "natural course of events" by taking ownership of a specific risk. You become a cause when you step out of the role of "bystander" and into the role of "maintainer."

  This principle validates 7 out of 7 of your intuitions:
  1.  **Plants:** You assumed stewardship (promise).
  2.  **Pond (Stranger):** You remained a bystander (no duty).
  3.  **Lifeguard:** You assumed stewardship (role/contract).
  4.  **Brakes:** Company assumed stewardship (sold a product with implied safety).
  5.  **Hiker:** Remained a bystander (did not light the fire, owns no land).
  6.  **Boiler:** You assumed stewardship (landlord/control of dial).
  7.  **Vote:** You remained a bystander (voting is a right, not a stewardship duty).

  ### The Hiker vs. The Lifeguard

  Your friend says the lifeguard is only a cause because of a contract, which feels like "paperwork" determining life and death. That is a misreading of the contract. The contract isn't the magic spell; it is the **evidence of altered expectations.**

  *   **The Lifeguard:** By taking the job, she signaled to the world: "You do not need to watch your children; I am doing it." She displaced the natural vigilance of the parents. If she looks away, she breaks the system she promised to uphold. She is a cause because she *intercepted* the risk.
  *   **The Hiker:** He encountered a risk he did not create and did not promise to manage. The "natural course" is that fires burn if not tended. The person who lit the fire is the steward. The hiker is part of the environment, like the wind. To say he caused the fire is to say every passerby is a firefighter.

  **Verdict:** They are different. The lifeguard intervened in the risk profile of the pond; the hiker did not intervene in the risk profile of the ridge.

  ### The Test Case: The Heimlich

  Apply Assumed Stewardship. You are alone. You have the skill. But you have no relationship to the stranger. You have not promised to help, you are not a medic on duty, you did not cause the choking.

  *   **Philosopher's View:** You caused the death (counterfactual: if you acted, he lives).
  *   **Your Rule:** You did not cause the death (you held no stewardship).

  If you want to keep your rule consistent, your verdict must be: **You did not cause the death.** You may be morally blameworthy (depending on your ethics), but you are not the *cause*. This aligns with the "No Duty to Rescue" law in many common-law jurisdictions, which exists precisely because the law agrees with your gut, not your friend's.

  ### Which Verdict Must You Give Up?

  To be honest about the cases the rule loses, you have to concede the **Physics Case**.

  You must admit that in a purely mechanical universe, your friend is right. If you write this piece, you have to acknowledge that "cause" is doing two different jobs.
  1.  **Mechanical Cause:** The absence of water killed the plants. The absence of a vote killed the campaign. The absence of a foot on the fire burned the ridge.
  2.  **Moral/Legal Cause:** The breach of promise killed the plants. The negligence killed the swimmer. The arson (or negligence of the camper) burned the ridge.

  Your rule tracks #2. Your friend tracks #1. The only verdict you might have to soften is the **Hiker**. If the fire was *smouldering* (not roaring) and he was the *only* human present, some moral frameworks argue that mere presence creates a temporary stewardship. But for the sake of a clean rule? Stick with your gut. The hiker is not the cause. The camper who left it is.

  ### A Note for Your Editor

  Your editor is worried you'll write a piece that concludes, "It depends on local norms." That is technically true (e.g., in France or Germany, failing to rescue *is* a crime, making you a legal cause; in the US, it usually isn't).

  However, you can satisfy the editor by framing it not as "norms" but as **"Baseline Expectations."**

  Don't write: *"Whether you caused it depends on what society thinks you should do."*
  Write: *"Causation by omission requires a deviation from an established baseline of maintenance."*

  This sounds like a structural principle, not a cultural whim. The "baseline" is determined by roles, promises, and prior interventions (the "you-broke-it" elements). This allows you to say the answer is **principled**, even if the application of the principle relies on social facts.

  ### Summary for the Piece

  1.  **The Rule:** Omissions are causes only when there is **Assumed Stewardship** (a prior intervention that created an expectation of safety).
  2.  **The Hiker/Lifeguard:** Different. One intercepted the risk (Lifeguard), one merely witnessed it (Hiker).
  3.  **The Sacrifice:** You must admit that in a vacuum of physics, the friend is right. But in a world of humans, your rule is the one that maps to blame and liability.
  4.  **The Heimlich:** Under this rule, you are not the cause. You are a bystander.
  5.  **The Editor:** Frame it as "Baseline Expectations," not "Norms."

  Your "you-broke-it rule" is honest, defensible, and matches the legal concept of *duty of care*. It loses the "pure logic" cases, but since you're writing about science and *ideas* (human ideas), the human rule is the one that matters. Keep it.
