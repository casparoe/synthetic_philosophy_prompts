prompt: |-
  Hey, I'm in a seminar on intention and practical reason and I've hit something I want a proper second opinion on. One of the guys in my cohort is a decision-theory person, and he gave me his two-minute version of Kavka's toxin puzzle. I wrote it down pretty much verbatim so I wouldn't garble it:

  "So there's this eccentric billionaire, and he puts a vial of toxin in front of you. Drink it and you're painfully ill for a day, nothing worse. He'll wire you a million dollars tomorrow morning if at midnight tonight you intend to drink it tomorrow afternoon. He's clear that you don't have to actually drink it — the money is sitting in your account hours before drinking time, and you're free to change your mind afterwards. And he can tell what you intend, so no faking it.

  Now the interesting part. Once the money's in the bank, drinking the toxin is just pointless pain, so a rational person won't drink. And you know you won't drink. But you can't intend to do something you know you won't do — that's just what intending is; you can't tell yourself a lie like that. So the million is unreachable, you can never get yourself into the state he's paying for, and that's the puzzle.

  Structurally it's Newcomb's problem in disguise. The payoff hangs on a state of you — your intention — that you can't simply decide to be in, the same way the contents of the boxes hang on a choice the predictor has already read off. Which means the whole thing is really an argument for evidential reasoning over causal reasoning: think evidentially and you'll see your way to intending, be a causal decision theorist and you just watch the money go by. And the usual moral people draw from it is that you should go ahead and drink the toxin anyway, to keep faith with your own intention — which is also supposed to be why deterrence works."

  I want you to be careful here and not just hand me the textbook version of the puzzle, I've already got that. Answer as someone who has actually worked on intention and decision theory. Do it in stages. First, break his version into numbered claims, roughly one per sentence, so we can see exactly what's being asserted. Second, go claim by claim: which ones would a philosopher working on intention sign off on, which would they wince at, and which are just wrong — and for the wince ones, say precisely whats off, not just that it's loose. Third, tell me whether his final conclusion (the evidential-over-causal bit) follows from whatever survives, and if it doesn't, what the strongest defensible thing you could get out of the puzzle actually is.

  I'll say where I'm at, so you can correct me if I'm off. I suspect the Newcomb analogy is doing more work than it can bear, but I know the two get discussed together, so I'm not sure whether I'm being pedantic. Also — is "you can't intend what you know you won't do" a claim about the meaning of the word, a claim about our psychology, or a claim about what's rational? Those seem like very different claims and he runs them together, definately. And is the puzzle one decision or two? It feels like the whole thing turns on that and he never says. Flag anything that's a live dispute rather than settled, and if part of what he's saying is really a verbal disagreement rather than a substantive one, say which part and why.
