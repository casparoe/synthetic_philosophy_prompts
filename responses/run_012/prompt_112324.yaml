  Hey, I'm doing a just war theory module this term and I've got a response paper due on All Quiet on the Western Front — we read the novel and watched the old film, but I'm mostly working off the book. The thing our lecturer keeps going on about is the moral equality of combatants, the idea people pin on Walzer, that it dosn't matter whether your side is in the right, a soldier on the other side is a legitimate target and you and he are morally on a par as killers. But the scene thats really stuck with me is the one where Paul stabs the French soldier in the shell hole and then spends the whole night trying to keep him alive, going through his papers, promising to write to his wife — it feels like the novel believes the exact opposite, that the guy is just a victim like him, not some equal.

  So what I want: read the novel through the moral equality of combatants and tell me whether it backs the doctrine up or blows it up. And please don't just give me war is bad. My hunch is the book runs together two seperate claims — that it's permissible for combatants to kill each other (the doctrine), and that all combatants are morally equal as human beings (which nobody actually denies) — and I want to know if that's right. If what the novel really shows is that Paul and the Frenchman are both just cogs in a machine, does that undercut the doctrine, or does it actually point toward the more revisionist view where what matters is what you're responsible for rather than which uniform you're wearing? Say where the novel earns its keep against the theory, and where it cheats or dodges the hard case.

  Give it to me as exactly five numbered points, each one or two sentences, no intro, no conclusion, no summing-up at the end — just the five.
