answer: |-
  **MEMORANDUM**

  **TO:** Mesh Co-op Board & Membership
  **FROM:** [Your Name]
  **DATE:** Wednesday Night
  **SUBJECT:** Proposal for Thursday's Voting Procedure and Membership Definition

  **The Problem: The Bootstrapping Error**
  We are currently stuck in a recursive loop. We need to vote on new bylaws to define who gets to vote. If we use the old rule (only paying members vote), we risk alienating the people who actually use the network but can't pay. If we just let everyone vote without changing the rule first, we risk the new bylaws being legally invalid because we broke the old ones.

  In engineering terms, we are trying to update the kernel while the system is running. We need a controlled handover.

  **The Recommendation: A Two-Step Ratification**
  I propose we separate the *procedure vote* from the *bylaws vote*.

  1.  **Step 1 (The Handover):** Tonight/Thursday, the **current legal voting body** (existing paying members) votes on a single motion: *"To temporarily expand the franchise for this meeting only to include Infrastructure Hosts and Registered Subsidized Users, for the purpose of ratifying the new bylaws."*
      *   *Why:* This keeps us legally compliant with our current paperwork. It asks the paying members to voluntarily share power to ensure the new system has community legitimacy.
  2.  **Step 2 (The Ratification):** The **expanded group** (Payers + Hosts + Subsidized Users) votes to adopt the new bylaws.
  3.  **Step 3 (Future Operations):** The new bylaws take effect immediately. Future votes follow the new membership definition.

  **The Proposed Membership Rule (For the New Bylaws)**
  Under the new bylaws, a Voting Member is defined as any household or individual that meets **one** of the following criteria:
  1.  **Financial:** Pays the annual due ($20).
  2.  **Infrastructure:** Hosts active network hardware on their property (verified by tech team).
  3.  **Dependency:** Is registered as a subsidized/free access user (verified by board).

  **Exclusions:**
  *   **Absentee Landlords:** Do not get a vote. They are vendors providing roof space, not community participants. They get a technical advisory channel for equipment rules, not governance.
  *   **City Broadband Office:** Do not get a vote. They are a grantor/upstream provider. Giving them a vote compromises our independence and turns us into a municipal project.

  **Addressing the "Paying Members Only" Argument**
  I know many of us prefer limiting votes to paying households. I want to take that seriously because it is the "clean" solution.
  *   **The Case for It:** It aligns with the grant paperwork. It ensures everyone in the room has "skin in the game." It prevents vote-stuffing. It is administratively simple.
  *   **The Case Against It:** It treats the network as a commodity, not infrastructure. We have ~140 payers, but we also have public housing residents for whom this is their *only* connection. If we tell them they have no say in the network they depend on, we create a two-tier system that invites resentment, sabotage, or political interference. Furthermore, the retired host who donates his roof and electricity has more "skin in the game" than a payer who just streams Netflix.
  *   **Verdict:** "Payers Only" optimizes for administrative ease. "Stakeholder Membership" optimizes for network resilience and social license to operate. A mesh network fails if the community turns against it. We should choose resilience.

  **Confidence Level**
  **High (85%)** on the Two-Step Process. This is the only way to legally transition power without inviting a lawsuit or a revolt.
  **Moderate (60%)** on the Specific Membership Definition.

  **The Soft Spot (Where I Might Be Wrong)**
  My least certain point is the **Definition of "Dependency" (Subsidized Users)**.
  I am recommending that free users in the public housing blocks get a vote. However, we do not have a clear process for verifying who they are or preventing duplication. If we get this wrong, we risk the "vote-stuffing" that the paying members are afraid of.
  *   *Mitigation:* The new bylaws must require the Board to publish a verified roster of subsidized voters 48 hours before any election. If we can't verify them cleanly, we may need to revert to "Payers + Hosts" only, and handle the free users via a community advisory board instead of full voting rights.

  **Action Item for Thursday**
  Come prepared to vote on **Step 1** first. If we don't agree on *who* is in the room, we cannot agree on what the rules are.

  [Your Name]
  Board Member
