  Consider the category 'Critical-Load Composite' (CLC) used in aerospace engineering, comprising materials exhibiting a cluster of properties: specific tensile strength above 1.5 GPa, thermal expansion coefficient below 2 ppm/K, fatigue resistance exceeding 10^7 cycles, and delamination immunity under humid conditions. These properties co-occur due to a stabilising mechanism of fibre-matrix interfacial bonding, yet are realised across distinct chemical bases (carbon-epoxy, ceramic-polymer, metal-matrix) sharing no common molecular structure. When presented with identical stress-test data, Safety Auditors (goal: catastrophic failure prevention) classify materials with high fatigue resistance but lower humidity immunity as CLC, while Performance Engineers (goal: weight minimisation) exclude those, including instead materials with superior humidity immunity but lower fatigue thresholds, thereby fixing non-identical extensional boundaries despite consensus on the underlying physical data.

  **Verdicts and Reasoning**

  1.  **Boyd (HPC):** **Yes, it is a natural kind.** The category is defined by a cluster of co-occurring properties maintained by a homeostatic mechanism (fibre-matrix interfacial bonding). Boyd's account allows for variation in underlying structure (multi-realizability) provided the cluster is stable enough to support induction, which the stress-test data confirms.
  2.  **Kripke/Putnam (Essentialism):** **No, it is not a natural kind.** The account requires a necessary and sufficient microstructural essence shared by all members. Since CLCs are realised across distinct chemical bases with no common molecular structure, there is no hidden essence to ground the kind, regardless of property clustering.
  3.  **User's Stipulated Account (Consensus):** **Fails the condition.** The condition requires that two competent communities with different goals, working from the same data, fix the same boundaries. Here, Safety Auditors and Performance Engineers fix different boundaries based on their respective practical goals, despite agreeing on the raw data.

  **Feature Doing the Work**
  The feature is **Interest-Relative Boundary Fixing**. This variable prises the accounts apart because Boyd's account accommodates practical interests within a stable mechanistic framework (verdict stands), Kripke's account ignores interests in favour of intrinsic essence (verdict fails due to lack of essence), and the User's account makes interests constitutive of the boundaries (verdict fails due to divergence).

  **Effect of Removal**
  If **Interest-Relative Boundary Fixing** is removed (i.e., boundaries are fixed solely by natural thresholds independent of goals):
  *   **Boyd:** Verdict remains **Yes** (mechanism remains).
  *   **Kripke/Putnam:** Verdict remains **No** (essence still absent).
  *   **User:** Verdict becomes **Pass** (communities would now fix the same boundaries).

  **Defender's Attack**
  A defender of the **Essentialist account (Kripke/Putnam)**, which comes off worst by denying kindhood to a scientifically robust category, would attack the case by arguing that 'Critical-Load Composite' is merely a pragmatic or functional classification, not a genuine natural kind. They would contend that the inability to identify a microstructural essence correctly signals that the category does not carve nature at its joints, but rather carves human interests, and thus the theory's negative verdict is accurate rather than deficient.
