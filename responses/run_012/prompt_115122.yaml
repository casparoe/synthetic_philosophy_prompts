      *   3. *The Adaptation Problem:* Hedonic treadmill. Disabled people report high happiness. Is their utility actually high, or are they adapted? If objective, who is right? The self-report or the observer?
      *   4. *The Incommensurability Problem:* Is pleasure from art comparable to pleasure from food? Or pain from grief vs. pain from a kick?
      *   5. *The Deflationary Move:* Maybe we aren't comparing "utility" but "capabilities" (Sen) or "resources" (Dworkin). Then IUCs are about goods, not mental states.
