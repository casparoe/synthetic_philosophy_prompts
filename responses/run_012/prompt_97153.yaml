answer: |-
  ### The Menu of Readings

  **1. The Tautology Reading**
  *   **Claim:** The phrase "survival of the fittest" is logically circular if "fitness" is defined solely by reproductive success.
  *   **Scope/Category:** Logical form of the slogan alone; distinct from the mechanism of selection.
  *   **Verdict:** **True Platitude:** Correct but irrelevant, as evolutionary theory defines fitness via independent trait measures, not just survival.

  **2. The Auxiliary Reading**
  *   **Claim:** The principle of natural selection cannot generate predictions without auxiliary assumptions about heredity, variation, and environment.
  *   **Scope/Category:** Testability of the bare principle + auxiliaries; methodological constraint.
  *   **Verdict:** **Substantive Thesis:** Defensible (Duhem-Quine thesis), but applies equally to physics and chemistry, not a unique defect.

  **3. The Lakatosian Reading**
  *   **Claim:** Darwinism functions as a "research programme" with a protected "hard core" (selection) and a testable "protective belt" (specific models).
  *   **Scope/Category:** Structure of the whole programme; methodological description.
  *   **Verdict:** **Substantive Thesis:** Defensible description of scientific practice, but "research programme" status does not preclude being science.

  **4. The "Just-So" Story Reading**
  *   **Claim:** Specific adaptationist hypotheses about human behavior (e.g., "religion evolved for cohesion") are often constructed post-hoc and lack falsifiability.
  *   **Scope/Category:** Testability of particular adaptationist hypotheses; practitioner practice.
  *   **Verdict:** **Substantive Thesis:** Defensible critique of sloppy evolutionary psychology, but indicts specific papers, not the Darwinian framework.

  **5. The Universal Metaphysics Reading**
  *   **Claim:** All mature sciences rest on metaphysical presuppositions (causality, uniformity of nature) that are themselves untestable.
  *   **Scope/Category:** Metaphysical presuppositions of the whole programme; philosophical grounding.
  *   **Verdict:** **True Platitude:** If this makes Darwinism "metaphysical," it makes physics metaphysical too, destroying the distinction.

  **6. The Strong Unfalsifiability Reading**
  *   **Claim:** The theory of natural selection is logically compatible with any possible observation and excludes no state of affairs.
  *   **Scope/Category:** Logical form of the theory; strict Popperian demarcation.
  *   **Verdict:** **Actually False:** Evolutionary theory makes risky predictions (e.g., fossil sequences, genetic phylogenies) that could falsify it.

  **7. The Demarcation Reading**
  *   **Claim:** Because it is a "metaphysical research programme," Darwinism fails the criterion of falsifiability and is therefore not science.
  *   **Scope/Category:** Demarcation of the whole programme; ontological status.
  *   **Verdict:** **Actually False:** Contradicts the consensus of philosophy of science and the operational success of the field.

  ***

  ### Analysis of Your Friend's Argument

  #### 1. Which reading does his conclusion need?
  To reach the conclusion that **adaptive explanations of human behavior are not science at all**, your friend needs **Reading 7 (The Demarcation Reading)** supported by **Reading 6 (The Strong Unfalsifiability Reading)**.
  *   He must argue that the *framework itself* is logically incapable of falsification (Reading 6), which forces the classification of the entire enterprise as non-science (Reading 7).
  *   If he retreats to **Reading 4 (The "Just-So" Story Reading)**, his conclusion weakens significantly. He would only be proving that *some* evolutionary psychologists are sloppy, not that the field is inherently unscientific. This would mandate better methodology, not the dismissal of the discipline.

  #### 2. Which readings embarrass his position?
  **Reading 2 (The Auxiliary Reading)** and **Reading 5 (The Universal Metaphysics Reading)** are the most damaging to his rhetorical stance.
  *   **Reading 2** admits that Darwinism needs auxiliary data to predict, but this is true of *all* science (e.g., Newtonian physics needs initial conditions). If he accepts this, he cannot claim Darwinism is unique in its "untestability."
  *   **Reading 5** is the trap. If he argues that Darwinism is "metaphysical" because it relies on untestable presuppositions, he must concede that physics is equally "metaphysical." This turns his critique from a specific indictment of biology into a general skepticism of all empirical science, which is likely not his intended position.

  **Reading 3 (The Lakatosian Reading)** also embarrasses him if he understands the terminology. In the philosophy of science (specifically Imre Lakatos, who refined Popper), being a "research programme" is **not** an insult. Scientific fields *are* research programmes. By calling it a "metaphysical research programme," he is using a technical term that actually validates the field's structure while trying to use the word "metaphysical" to dismiss it.

  #### 3. The Popper Authority Move: Coherent or Cherry-Picking?
  Your friend's handling of Popper's retraction is **cherry-picking** under almost all readings, except one very narrow interpretation.

  *   **Incoherent (Readings 6 & 7):** If the claim is that Darwinism is *unfalsifiable* (Reading 6) or *not science* (Reading 7), Popper's later concession that "Darwinism is not a metaphysical research programme... it is a testable theory" directly destroys the argument. Dismissing this as an "embarrassment" is an *ad hominem* evasion of the philosophical update. You cannot cite Popper's authority for a claim Popper explicitly withdrew.
  *   **Coherent (Reading 3 only):** The only way his appeal to Popper remains coherent is if he sticks strictly to **Reading 3 (The Lakatosian Reading)**. Popper did describe it as a "research programme." If your friend admits that "research programmes" are scientific (as Lakatos argued) but maintains that the *structure* is what Popper identified, he can ignore the retraction about *testability* because he isn't claiming it's *untestable*, just that it has a specific structural form.
  *   **The Catch:** If he admits Reading 3, he loses the right to call it "not science." He cannot have it both ways: he cannot use Popper's "metaphysical" label to imply "unscientific" while ignoring Popper's later clarification that the label didn't mean "unscientific."

  **Recommendation for your next exchange:**
  Ask him to select exactly one number from the menu. If he chooses 1–5, ask why he thinks this disqualifies evolutionary psychology from being science when the same applies to physics. If he chooses 6 or 7, ask him to explain why Popper's explicit retraction of those specific claims should be ignored, and request a concrete example of a falsifiable prediction in physics that does not rely on auxiliary assumptions (to test Reading 2).
