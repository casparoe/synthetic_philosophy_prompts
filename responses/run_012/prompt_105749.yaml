answer: |-
  The kitchen table was buried under printouts of the Public Safety and Sentencing Reform Bill. Leo stirred his coffee, looking at the highlighted section regarding the dual-track system. Mara, leaning against the counter with a mug of tea, tapped a pen against her notebook.

  "Okay," Leo said. "Let's look at the petitioner. He's got three strikes. He's asking the board to ignore the therapeutic track and give him the straight time. Track A. He says being treated as a patient is an insult. He wants to be treated as an agent who paid his debt."

  Mara sighed. "And you want to give it to him. Because that's what respecting agency looks like."

  "It's what respecting a citizen looks like," Leo corrected. "If we force Track B on him, we're saying his preferences don't matter because they're causally compromised. But on my view, agency isn't about being uncaused. It's about reasons-responsiveness. He's giving us a reason: 'I prefer stigma to therapy.' We honor that."

  "But his preference is just another symptom," Mara said, pushing off the counter. "This is the Caruso line you keep dodging. His desire for retributive punishment is a product of his upbringing, his socialization, the very luck egalitarianism you claim to respect. He thinks he 'deserves' pain because he's internalized a metaphysical myth. Honoring that request doesn't validate his agency; it just launders retribution with a consent form."

  "We agreed indeterminism is a red herring," Leo said sharply. "Neither of us thinks he's a prime mover unmoved. The question is whether the *practice* of holding responsible earns its keep. If we remove the desert language from Track A, we remove the limit on state power. Track B is prevention. Prevention has no inherent limit. If the actuaries say he's still a risk after two years of CBT, they keep him. Track A says: you did X, you get Y time. It's finite. It protects him from the state."

  Mara frowned, conceding the point partially. "That's the civil liberties objection. I'll grant that the quarantine model needs strict rights protections to avoid indefinite containment. But you're saying the *desert* language is what provides those protections. I say desert is incoherent. You've already admitted we discount sentences for upbringing and circumstance. If responsibility comes in degrees based on causal history, then 'basic desert' is doing no work. It's just a veneer."

  "It's not veneer if it structures the relationship," Leo insisted. "Strawson's reactive attitudes—resentment, gratitude, blame—they aren't metaphysical claims. They're the glue of social life. When the petitioner says 'punish me,' he's invoking a normative expectation. He's saying, 'I am part of the moral community, bound by its rules.' If we switch him to Track B, we're excommunicating him. We're saying he's not a rule-breaker; he's a broken thing. That is deeply stigmatizing."

  "Is it?" Mara turned the pen over in her hand. "Or is it more honest? Look at the choice architecture. The state designs Track A and Track B. The state sets the length of the custody and the duration of the treatment. The petitioner chooses between two coercive options designed by a system he didn't choose. Is that free in the sense that matters for your compatibilism?"

  "It's free enough for political legitimacy," Leo said. "He's not being coerced by a gun to the head. He's weighing costs. He prefers the honest hardship of prison to the manipulative hardship of pharmacological intervention. That's a rational calculation."

  "It's a calculation based on values he didn't choose," Mara countered. "And here's where your reactive attitude defence gets shaky. You say blame is functional. But those attitudes are themselves causally produced. Our urge to punish is evolved, cultural, neural. Why should we build a justice system around impulses we're trying to outgrow? If Track B cuts reoffending substantially, as the actuaries say, then honoring his preference for Track A is prioritizing his philosophical comfort over public safety. It's indulging his desire for vengeance against himself."

  Leo leaned forward. "But whose safety? If Track B involves mandatory pharmacology, that's a bodily intrusion Track A avoids. You're trading physical integrity for statistical safety. And you're assuming the prevention frame is neutral. It's not. It pathologizes dissent. If I refuse the meds in Track B, I'm 'non-compliant,' which justifies extending the sentence. In Track A, if I sit there and seethe, I serve my time and I leave. The desert track respects the boundary between mind and state. The prevention track claims jurisdiction over my psyche."

  Mara paused. She took a sip of tea, looking at the bill. "Okay. That's a strong point. The public health model can become a psychiatric prison if 'risk' is defined too broadly. I'll absorb that. Caruso acknowledges the need for humane containment, not indefinite tweaking. But does that justify *retribution*? You're saying we should inflict harm because he 'deserves' it, even if we know his actions were determined."

  "I'm saying we inflict harm because he *authorized* it through his action, and acknowledging that authorization is what makes him a person rather than a pet," Leo said. "If you take away desert completely, you take away the offender's ownership of the act. You're saying, 'You didn't really do this; your causes did.' That's exculpatory, but it's also infantilizing."

  "But he *didn't* really do it in the ultimate sense," Mara pressed. "And here's where you have to move. If you concede that we discount for circumstance—that we don't punish the starving thief the same as the greedy CEO—then you've admitted causality matters. So why stop there? Why not follow the causality all the way down? If the thief's hunger caused the theft, and the CEO's upbringing caused the greed, both are products of luck. The petitioner's desire for punishment is just another product of luck. Why privilege *that* causal chain?"

  "Because not all causal chains are the same," Leo said. "Some run through reasoning processes. Some don't. When we interact with the petitioner, we engage his reasoning. When we force Track B, we bypass it. We're hacking his operating system instead of talking to the user. Even if the user is determined, the interface matters."

  "But the state isn't just talking to him," Mara said. "It's managing risk. If the choice between Track A and Track B is illusory because both are state-coerced outcomes, then his consent is weak. And if his consent is weak, you can't use it to justify the retributive harm of Track A. You're back to inflicting pain based on a metaphysical fiction."

  "Okay, let's strip the metaphysics," Leo said, rubbing his temples. "No basic desert. Just practical desert. We punish because the practice of punishing maintains the normative structure that allows us to live together. The petitioner knows this. He's asking to participate in that structure. Denying him is saying, 'You're not capable of participation.'"

  "And I'm saying the structure is toxic," Mara replied. "We can maintain normative expectations without retributive suffering. We can say, 'What you did was wrong, and we must prevent it,' without adding, 'and you deserve to suffer for it.' The petitioner thinks the suffering is necessary for the meaning. That's the illusion. You can have the censure without the cruelty."

  "Can you?" Leo challenged. "Track B is shorter. It's mandatory treatment. Is it less cruel? Or is it just differently coercive? If the state forces me to take drugs to change my personality, that's a deeper violation than locking me in a box. The desert track leaves my mind alone. It punishes my time, not my self."

  Mara nodded slowly. "That's the stigma point again. You think the therapeutic frame is more stigmatizing than the criminal frame."

  "I know it is. Criminal says 'you chose wrong.' Therapeutic says 'you are wrong.'"

  "But if 'you chose wrong' implies a freedom you didn't have, it's a lie," Mara said. "And building a system on a lie is dangerous. If we admit we're preventing harm, we can be honest about the criteria. If we pretend it's desert, we hide the utilitarian calculus behind moralistic language. That allows the state to punish more than is necessary for safety, because 'justice' is infinite."

  Leo sat back. "So you'd scrap Track A entirely?"

  "I'd scrap the desert framing," Mara said. "But I hear you on the coercion. If Track B becomes indefinite containment, it's worse than finite prison. So, maybe the compromise isn't the tracks. It's the limits. Finite prevention. No pharmacological coercion without strict judicial oversight. But we still can't tell him he 'deserves' Track A. We can only say Track A is the least restrictive alternative that satisfies public demand for accountability."

  "But if you tell him that," Leo said, "you're still using him. You're saying, 'We know you don't deserve this, but we'll do it to keep the peace.' That's manipulative. If he wants to stand on the principle that he is responsible, let him. It costs the state less money, too. Shorter track for him, even if it's prison."

  "It costs the public safety metrics," Mara reminded him. "Actuaries say Track B cuts reoffending."

  "By changing who he is," Leo said. "Track A changes where he is. I'd rather live in a society that respects boundaries of self than one that optimizes behavior."

  Mara looked out the window. "And I'd rather live in a society that doesn't inflict pain based on a myth, even if it means we have to be more paternalistic about risk."

  "So we're stalled," Leo said.

  "Not entirely," Mara said, turning back. "We agree the bill as written is dangerous. Track A legitimizes vengeance. Track B legitimizes mind control. But if the petitioner insists on A, and A is finite... maybe you're right that denying him is the greater insult. Not because he has free will, but because treating him as if he does is the only way to treat him as an equal."

  "And maybe you're right that we shouldn't codify that insult into law," Leo conceded. "We can honor his request without endorsing the metaphysics. We sentence him to Track A, but the statute reads 'public safety requirement' not 'just deserts.'"

  "That's semantic shading," Mara smiled wryly.

  "It's political theory," Leo replied. "It's all shading. But if the shading protects his body from drugs and his time from indeterminacy, I'll take it."

  "Mm. I'll take the protection of his body from drugs. But I'm still writing a paper on how the 'choice' between these tracks is coercive."

  "Send it to me," Leo said, picking up his coffee. "I'll write the rebuttal. Reactive attitudes earn their keep, even if they're caused."

  "As long as you admit they're caused," Mara said.

  "As long as you admit they matter," Leo said.
