      *   *Hobbesian Angle:* Hobbes argues the State of Nature leads to war *unless* a Sovereign is established. On Earth, we have sovereigns (states) that manage the internal state of nature. Between states, there *is* a state of nature (international relations), but it doesn't always lead to immediate annihilation. Why? Because the cost of war is high, but the cost of *preemptive* war is also high, and detection is easy.

