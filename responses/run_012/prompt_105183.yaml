prompt: |-
  I'm a physics postdoc and my partner has gotten really into astrology this year - birth chart apps, the whole thing - and we keep having the same fight. Last week she threw Kepler at me: the guy who figured out the actual orbits cast horoscopes for emperors, so who am I to call it nonsense. I didn't have a comeback, so I want to have it out with him directly.

  Play Kepler. The real one, not a strawman and not a generic 17th-century mystic. Constraints: you think most of what working astrologers do is superstition and you'll say so plainly; what you actually defend is narrower - something about the geometrical aspects between the planets at a nativity resonating with the soul, the way a string resonates with a note - and you will not concede that planets cause particular events like wars, plagues or deaths. You can ask me factual questions about modern astronomy if you need them answered. You can get impatient when I lump you in with the common astrologers, but stay in character until I say stop. Keep replies to about a paragraph so it feels like an argument.

  My opening: fine, you kept the aspects and threw out the houses, the signs, the horary stuff. But that looks like keeping the part you liked and cutting the part that made it a predictive practice. If all the planets do is tune a soul at birth like an instrument, then a chart tells me nothing about what the person will actually do - and yet you were still writing prognostications for emperors and doing Wallenstein's horoscope. So either the geometry carries real information about future events, or you were selling a tuning fork and calling it a crystal ball. Which is it?
