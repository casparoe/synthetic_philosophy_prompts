  This is a fantastic, tension-rich setup. You've identified a very specific moral texture: it's efficient, it's rational, and it feels like a betrayal.

  Here is the breakdown of the terminology, the moral philosophy, and the edges of the concept for your scene.

  ### 1. The Structural Name: Logrolling
  The mechanical term for what they are doing is **logrolling**.

  In political science, this describes the practice of exchanging favors or votes: *"I'll vote for your bridge to nowhere if you vote for my tax break."* It fits your scene perfectly because, as you noted, neither party changes their mind about the *merit* of the issue. They simply trade the *labor* required to advance it.

  **Where it fits:**
  *   It captures the "quid pro quo" structure.
  *   It captures the fact that the issues are unrelated (housing vs. farming).
  *   It captures the pragmatic efficiency (both get their priority funded).

  **Where it falls short:**
  *   In politics, logrolling is usually seen as cynical but neutral. Politicians often don't care deeply about the other person's bill; they just view it as currency.
  *   In your scene, the currency is **toxic**. Your characters aren't just trading neutral favors; they are trading actions they believe are *morally negative*. Standard logrolling doesn't account for the feeling of "grubbiness."

  ### 2. The Moral Shape: Dirty Hands
  The philosophical concept that describes the "grubby" feeling is **The Problem of Dirty Hands**.

  This comes from political philosophy (Sartre, Walzer, Machiavelli). It describes the paradox where a moral agent must commit a morally wrong act (get their hands dirty) to achieve a greater good or prevent a greater evil. Usually, this is applied to a leader ordering a bombing to save a city.

  **How it applies to your scene:**
  *   Usually, "Dirty Hands" is a solitary burden. One leader takes the sin upon themselves.
  *   In your scene, it is **bilateral**. They are washing each other's hands in mud. Friend A gets dirty so Friend B can stay clean (on the housing issue), and vice versa.
  *   This creates a specific kind of intimacy. They are now co-conspirators in each other's "sin." They hold leverage over one another: *"I know you think this cause is a scam, because you told me so, yet you campaigned for it."*

  ### 3. A Coined Term: "Reciprocal Complicity"
  Since there isn't a single dictionary word for "logrolling where both parties despise the traded favor," I suggest you think of this as **Reciprocal Complicity**.

  This distinguishes it from standard compromise. In a compromise, we meet in the middle. In Reciprocal Complicity, we stay at our corners, but we agree to wear each other's uniforms.

  **Why this term works for your novel:**
  *   **Complicity** implies guilt. They aren't just helping; they are enabling something they condemn.
  *   **Reciprocal** highlights the trade.
  *   It captures the "grubby" feeling: they are now *complicit* in the harm they fear. If the rent cap causes economic ruin, she helped cause it. If the farm buyout wastes money that could house people, he helped waste it.

  ### 4. Distinguishing the Edges
  You asked how this differs from indulgences or outsourcing. Here is the moral geometry:

  **Vs. Buying an Indulgence**
  *   **Indulgence:** Vertical transaction. I sin, I pay the Church, I am forgiven. The payment *erases* the moral debt.
  *   **Your Deal:** Horizontal transaction. I sin, you sin, we both get what we want. The moral debt is *not erased*; it is *shared*. They still feel grubby. An indulgence is meant to make you feel clean; this deal is designed to make them feel dirty, but effective.

  **Vs. Outsourcing Morality**
  *   **Outsourcing:** "I care about X, but I'm too busy/lazy to do it, so I'll pay you to do X for me." (e.g., donating to a charity instead of volunteering).
  *   **Your Deal:** "I care about X, but I need resources. I will do *Y* (which I hate) to get resources for X."
  *   **The Difference:** Outsourcing is usually morally neutral or positive. Your deal requires **active sabotage of one's own integrity**. They are not just paying someone to carry the burden; they are carrying a burden they believe is *wrong*.

  **Vs. Standard Logrolling**
  *   **Standard:** "I don't care about your issue."
  *   **Your Deal:** "I care about your issue, but I think it's *harmful*."
  *   **The Difference:** This turns the trade into a form of **mutual deception**. When Friend A canvasses for rent control, she is signaling to the public, "This matters." She believes it does not. She is lying to the voters.

  ### 5. The People Not in the Room (The Third Party)
  This is where the real dramatic tension lies. The deal isn't just between the friends; it impacts the "consumers" of their activism.

  *   **The Voters/Tenants:** They think Friend A believes in the rent cap. She doesn't. She is a "shill." Her lack of conviction might make her a less effective canvasser, or worse, a cynical one. The public is being sold a passion that isn't real.
  *   **The Animals:** Friend B is funding their rescue, but he thinks the money is better spent on humans. Is it ethical to fund a rescue half-heartedly?
  *   **The Truth:** The deal corrupts the *signal*. In a democracy (or a moral marketplace), actions are supposed to signal belief. If people start trading actions they don't believe in, the public can no longer tell what people actually value. They are inflating the moral currency.

  ### Summary for the Scene
  If you need a label for the characters to use, **Logrolling** is the intellectual term (maybe the more political friend uses this). **Reciprocal Complicity** is the emotional truth.

  The "grubby" feeling comes from the fact that they have **monetized their integrity**. They have taken the one thing that should be non-negotiable (acting only on what you believe is true) and turned it into a currency to buy the outcomes they want. They are better off, the world might be better off, but they have become slightly less honest people in the process.

  That is a wonderful, painful place to leave two friends.
