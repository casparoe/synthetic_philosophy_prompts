answer: |-
  You have reconstructed what is widely known in epistemology and formal philosophy as the problem of logical omniscience, and you have done so with considerable clarity. It is a very strong argument in the sense that it validly derives an absurd conclusion from premises that are standard fare in orthodox Bayesian epistemology. Because you are asking for guidance on where to break the chain, I should start by telling you where the field stands. There is a broad consensus that steps one through five accurately describe the commitments of standard probability theory when applied to belief. There is also a broad consensus that step six is true as a matter of empirical fact and intuitive judgment about rationality; nobody seriously argues that a mathematician is irrational for lacking a proof of the Riemann Hypothesis. The live dispute lies entirely in how to resolve the tension at step seven. Since you have indicated that you care more about keeping the Dutch book justification in premise one than you do about keeping the strong reading of premise two, the most philosophically cost-effective move for you is to reject the unqualified normative force of premise two.

  Premise two looked compelling to you, and to most philosophers who start down this road, because it is a mathematical truth about probability functions. If you define a credence function as a probability measure over a Boolean algebra of propositions, then logical equivalence is identity within that algebra, and the axioms strictly demand that equivalent propositions receive the same value. It feels like you are rejecting mathematics itself to deny this. However, the mistake lies in assuming that the mathematical structure of probability theory maps perfectly onto the normative requirements for non-ideal agents without modification. When you reject premise two as a requirement for real agents, you are not saying that probability theory is wrong, but rather that the domain of the theory needs to be adjusted. You are effectively claiming that for a bounded agent, the set of propositions they hold credences about is not closed under logical equivalence. In this view, a conjecture and its double negation are treated as distinct items in the agent's belief space until the agent recognizes the equivalence.

  The price tag for this move is significant, though likely acceptable given your priorities. If you reject the requirement that logically equivalent sentences must have equal credence, you cannot use the standard Dutch book argument in its full strength. The classic Dutch book theorem shows that if your credences violate the probability axioms, there is a set of bets you will accept that guarantees a loss. But if you deny that you must assign the same credence to logical equivalents you don't recognize as equivalent, a bookie cannot necessarily construct that sure-loss contract against you, because you would not see the bet on the conjecture and the bet on its double negation as compatible bets to be taken simultaneously in a way that exposes the inconsistency. To keep the Dutch book story alive, you have to weaken it to a restricted Dutch book argument. This version says you are only vulnerable to a Dutch book if you recognize the logical relations between the propositions. This preserves the core intuition of premise one that irrationality is a kind of pragmatic inconsistency, but it limits the scope of that inconsistency to what is cognitively accessible to the agent.

  This modification does weaken what rationality means for credences. You can no longer say that coherence is the sole requirement for rationality in the strong, ideal sense. Instead, rationality becomes a matter of local coherence or consistency within the agent's current logical grasp. You are trading the elegance of a single, static standard of rationality for a more complex, dynamic model where an agent can be rational while uncertain about logical truths, provided they update appropriately as they learn those truths. This aligns well with your intuition about the mathematician; they are rational because their credences are coherent relative to what they currently know, even if they are not coherent relative to all logical truths. There are formal ways to model this, such as assigning probabilities to sentences rather than propositions, or using impossible worlds semantics, but all of them involve loosening the strict link between logical truth and probability one.

  It is important to distinguish what is settled here from what is still fought over. It is settled that orthodox Bayesianism entails logical omniscience. It is settled that humans are not logically omniscient. It is not settled whether the best solution is to weaken the coherence requirement as I have suggested, or to accept that Bayesianism is only an ideal theory that real agents approximate, or to adopt entirely different frameworks like imprecise probabilities. Some philosophers argue that you should keep premise two and accept that we are all technically irrational, viewing rationality as an unattainable ideal like moral perfection. However, given your stated desire to model agents who reason their way toward truth over time, that view would likely be unsatisfying to you. By rejecting the strong reading of premise two, you keep the Dutch book insight that irrationality involves a kind of exploitable inconsistency, but you ensure that the exploitation is only possible where the agent has the cognitive capacity to see the trap. This saves the project of modeling rational learning without forcing you to declare all non-omniscient agents incoherent.
