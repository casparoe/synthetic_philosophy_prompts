  I'm a junior in high school and me and my friends have been arguing about the moral saints thing at lunch for like a month, and now I have to write a personal philosophy statement for this summer ethics program and I want to make sure I'm not just being incoherent. Here's roughly where I've landed: (1) I think if you can do more good, you're required to do it, so there's no such thing as supererogation or going beyond the call of duty; (2) I think the morally best life is the saintly one, the one that maximizes good and sacrifices personal stuff for others; (3) I think a life with no close friendships, no personal projects, and no fun isnt a good human life, even if it does the most good; (4) I think real friendship requires partiality, like you have to be willing to favor your friends and you cant be a pure impartial maximizer and still have real friends; (5) I think if morality requires something, thats a decisive reason and you're irrational not to do it; (6) I think motives don't matter for whether an act is right, but a person who only does the right thing for selfish reasons isn't really morally good. And then theres this case I made up: a woman who spends all her time on effective charity and donates a kidney every year but never remembers her friends' birthdays. I think shes morally better than my friend who is a great friend but only gives 10% and spends the rest on music. But I also think my friend is living a better life.

  I dont know if I'm contradicting myself or just holding different kinds of claims. Can you go through these and tell me which pairs are actually in tension and which only look like they are? I want the tensions ranked by how bad they are, not all listed as equally bad. For each real one, say what would have to give and what the cheapest fix would be, and then tell me which single revision would clean up the most without making me give up the things I care about most. Also, if the case I made up cant be squared with the principles, say which principle is doing the damage. Please dont just tell me to go read the famous essay on moral saints, I cant look stuff up right now and I need to know what I should change.
