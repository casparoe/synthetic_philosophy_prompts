prompt: |-
  I've been teaching Lakatos to CS grad students for a few years and I keep catching myself explaining him in machine learning terms, which I half know — I can read an ML paper, I've run my share of ablations, I understand what a scaling law is, but I'm a philosopher, not a practitioner. So do it properly for me: take Lakatos on research programmes — hard core, protective belt, positive and negative heuristic, progressive vs degenerating problem shifts, novel facts, no instant rationality — and restate the whole thing in the vocabulary an ML researcher actually uses: model families and their inductive biases, architecture commitments, training pipelines, auxiliary engineering assumptions, benchmark suites and their saturation, ablations, the difference between patching a system after it fails and making a change that predicts something you didn't build it for. Then the residue report. What maps cleanly, what only maps with distortion, and what has no counterpart at all. I'm especially interested in the normative bit: Lakatos is telling us how to appraise a programme as rational or not, and I want to know whether that survives as a question an ML person would recognize, or whether it just evaporates into whether the thing worked on the benchmark. If it evaporates, is that ML's vocabulary missing something, or is it Lakatos dressing up hindsight as a criterion? And don't let my own mappings through on the nod — if the hard core isn't really the inductive bias of an architecture family, or the protective belt isn't really the eval harness you quietly re-tune, say so. Same for the historiographical side: does Lakatos's distinction between rational reconstruction and actual history have any analogue in how ML papers rewrite their own lineage, or is that where the translation definately breaks down?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Target Audience:** A philosopher teaching Lakatos to CS/ML grad students, who knows enough ML to read papers/run ablations but isn't a practitioner.
      *   **Task:** Restate Lakatos's Methodology of Scientific Research Programmes (MSRP) *strictly* in ML vocabulary (model families, inductive biases, training pipelines, benchmarks, ablations, etc.).
      *   **Key Concepts to Map:** Hard core, protective belt, positive/negative heuristic, progressive/degenerating problem shifts, novel facts, no instant rationality.
      *   **Critical Analysis (The "Residue Report"):** What maps cleanly? What maps with distortion? What has no counterpart?
      *   **Normative Question:** Does Lakatos's rationality appraisal survive in ML, or does it evaporate into benchmark performance? Is this a lack in ML vocabulary or Lakatos dressing up hindsight?
      *   **Historiographical Question:** Does "rational reconstruction" vs. "actual history" map to how ML papers rewrite lineage?
      *   **Constraint:** Do not let the user's own tentative mappings (e.g., hard core = inductive bias) pass unchallenged. Critique them.

  2.  **Initial Brainstorming & Mapping (Mental Draft):**
      *   *Hard Core:* User suggests "inductive biases of an architecture family." Is it? Or is it the *objective function*? Or the *belief that deep learning works at all*? Let's argue it's the fundamental commitment to the paradigm (e.g., "Gradient descent on differentiable structures can learn representation").
      *   *Protective Belt:* User suggests "eval harness you quietly re-tune." That's too cynical/narrow. It's more like hyperparameters, data augmentation, specific loss tweaks, prompt engineering tricks. Things you change to save the core.
      *   *Negative Heuristic:* "Don't touch the core." In ML: "Don't question backprop."
      *   *Positive Heuristic:* "How to develop the belt." In ML: "Scale it up," "Add attention," "Use more data."
      *   *Progressive/Degenerating:* User suggests "benchmark saturation." Progressive = SOTA on *new* tasks. Degenerating = Overfitting existing benchmarks, hacking evals.
      *   *Novel Facts:* User suggests "predicts something you didn't build it for." In ML: Emergent abilities, zero-shot transfer.
      *   *Rational Reconstruction:* ML papers definitely do this ("We intended to do X all along" vs. "We tried 50 things and this worked").

  3.  **Refining the Mappings (Critical Step):**
      *   *Challenge the Hard Core:* Is "Inductive Bias" the hard core? Inductive bias is often a *consequence* of the architecture. The Hard Core is the *irrefutable assumption*. In Deep Learning, the Hard Core isn't just "Transformers." It's "Representation Learning via Gradient Descent is the path to AGI/Intelligence." If you stop believing that, you leave the programme (e.g., to Symbolic AI).
      *   *Challenge the Protective Belt:* It's not just the eval harness. It's the *auxiliary hypotheses*. Data cleaning, learning rate schedulers, regularization techniques. These are adjustable to protect the core claim that "the model learned."
      *   *Challenge Progressive/Degenerating:* ML is obsessed with benchmarks. Lakatos cares about *novel* facts. In ML, "SOTA on ImageNet" is not necessarily progressive if it's just overfitting. Progressive is "SOTA on ImageNet *and* works on robotics." Degenerating is "SOTA on ImageNet *but* fails on slightly shifted data (adversarial examples)."
      *   *Normativity:* ML culture is largely positivist/empiricist. "Did it beat the baseline?" Lakatos asks "Is the *programme* healthy?" This is a higher-level abstraction than most ML papers engage in.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise and set the stage. Validate the intuition but promise rigor.
      *   **The Translation (MSRP in ML Terms):**
          *   *Research Programme:* A Paradigm (e.g., Deep Learning, Symbolic AI, Bayesian Non-parametrics).
          *   *Hard Core:* The unfalsifiable commitment. Not just architecture, but the *mechanism of learning*. (e.g., "Differentiability is necessary").
          *   *Protective Belt:* The tunable stuff. Hyperparams, data pipelines, loss function tweaks.
          *   *Negative Heuristic:* "Don't blame the core." (e.g., If training fails, it's the LR, not Backprop).
          *   *Positive Heuristic:* The roadmap. (e.g., "Scale laws," "More heads," "MoE").
          *   *Progressive Shift:* New capability, not just +0.1% accuracy. Zero-shot, emergent.
          *   *Degenerating Shift:* Benchmark gaming, adversarial brittleness, massive compute for tiny gains.
      *   **The Residue Report (Critical Analysis):**
          *   *Clean Maps:* Heuristics $\to$ Engineering practices. Protective Belt $\to$ Hyperparams/Augmentation.
          *   *Distorted Maps:* Hard Core $\neq$ Inductive Bias (Bias is a property, Core is a dogma). Novel Facts $\neq$ Test Set Accuracy (Novelty requires *unseen* domains).
          *   *Missing Counterparts:* The *Sociological* aspect. Lakatos assumes a community appraising rationality. ML appraises via Leaderboards. The "Rationality" is replaced by "SOTA."
      *   **The Normative Question:** Does it evaporate? Yes, mostly. ML lacks a vocabulary for "degenerating programme" unless it's "the field is stalled." It's mostly "my model is better." Lakatos offers a *long-term* view; ML is quarterly.
      *   **Historiography:** Rational Reconstruction is *exactly* what happens in the "Related Work" and "Method" sections. "We hypothesized X" vs. "We swept seeds 1-40."

  5.  **Refining the Tone:**
      *   Needs to be respectful but rigorous.
      *   Avoid philosophical jargon where ML jargon works, but keep Lakatos's structural integrity.
      *   Be direct about where the user's intuition might be slightly off (e.g., Hard Core vs. Inductive Bias).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "No Instant Rationality"?
