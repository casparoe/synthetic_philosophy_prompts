  7.  **Final Polish:** Organize with clear headings. Ensure the "Residue Report" is distinct. Make sure the conclusion answers the "evaporation" question decisively. (The thought process moves towards: It evaporates because ML lacks the *temporal* dimension of appraisal that Lakatos insists on).

  8.  *(Final thought before generating)*: Ensure I explicitly mention "Benchmark Saturation" as a sign of degeneration, as the user prompted it. Connect "Ablations" to the "Protective Belt" testing.

  9.  **Constructing the Output.** (Proceeding to generate response based on these structured thoughts).

  *(Self-Correction during drafting the response)*: Wait, I need to be careful about "Inductive Bias." The user suggested Hard Core = Inductive Bias. I need to explain why that's *close* but not quite right. Inductive bias is a mathematical property. Hard Core is a *methodological commitment*. You can change the bias (e.g. from CNN translation invariance to Transformer global attention) without leaving the Deep Learning programme. So the Hard Core is deeper: "Learning via optimization of differentiable parameters."

