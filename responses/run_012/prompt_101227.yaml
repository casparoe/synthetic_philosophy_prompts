answer: |-
  The blog post accurately diagnoses a serious epistemic problem known as "cluelessness" but falsely concludes it refutes consequentialism and mischaracterizes the standard reply as merely truncating the time horizon rather than shifting to expected value.

  Here is the claim-by-claim breakdown of how an ethicist working on this debate would evaluate the post:

  **1. "Consequentialism says an act is right just in case it produces the best overall consequences."**
  *   **Verdict:** Accurate.
  *   **Analysis:** This is the standard definition of Act Consequentialism (AC). Experts would nod here. The theory evaluates actions based on the state of the world they produce.

  **2. "Thanks to the butterfly effect we can never know the full downstream consequences of anything."**
  *   **Verdict:** Accurate.
  *   **Analysis:** This is the core of the "cluelessness" objection, famously articulated by James Lenman (2000). Because causal chains are complex and sensitive to initial conditions, the long-term effects of even trivial actions (like helping an old lady cross the street) are unknowable and could theoretically outweigh the immediate effects (e.g., she gives birth to a tyrant).

  **3. "So consequentialism gives us no guidance at all about what to do."**
  *   **Verdict:** Distortion.
  *   **Analysis:** This conflates *objective* rightness (what actually happens) with *subjective* rightness (what it is rational to do given available information). Most consequentialists argue that guidance comes from maximizing *expected* value, not *actual* value. You can be guided by probabilities even if you are clueless about the final outcome. The objection shows we can't know if we succeeded, not that we can't decide what to attempt.

  **4. "A theory that can't guide action is refuted."**
  *   **Verdict:** Controversial/Overstated.
  *   **Analysis:** While "ought implies can" is a standard principle, it usually applies to physical ability or logical possibility, not perfect epistemic access. Most philosophers accept that a moral theory must guide decision-making, but they argue consequentialism *does* guide via expected utility calculations, even if those calculations are imperfect.

  **5. "This kills consequentialism."**
  *   **Verdict:** False.
  *   **Analysis:** The objection kills *naive objective* act consequentialism, but not the broader family. It forces a modification to how consequences are weighed (incorporating uncertainty), not an abandonment of the framework. In Effective Altruism circles, this is treated as a constraint on modeling, not a disproof of the moral axioms.

  **6. "The standard reply is to shrink the theory down to the foreseeable future... judging acts only by their consequences over the next few years."**
  *   **Verdict:** Distortion.
  *   **Analysis:** This is the blog's weakest link. The standard philosophical reply is not to arbitrarily truncate the time horizon but to adopt **Expected Consequentialism**. Under this view, distant consequences still count, but their contribution to expected value diminishes as uncertainty increases (probability approaches zero or variance becomes too high to be action-guiding). Some consequentialists do argue for discounting the future, but presenting it as "ignoring anything beyond a few years" is a straw man of the theoretical response.

  **7. "Is that 'shrink it to the foreseeable future' move actually available to a consequentialist, or does it just change the subject?"**
  *   **Verdict:** It changes the subject *if* done arbitrarily, but is consistent *if* derived from uncertainty.
  *   **Analysis:** If you define consequentialism as "maximize actual good," then ignoring actual future good changes the subject. However, if you define it as "maximize expected good," then focusing on the foreseeable future is a mathematical necessity, not a theoretical amendment. Because the probability weight of specific long-term outcomes drops precipitously due to chaotic variables, the "foreseeable future" naturally dominates the calculation without needing to officially amend the theory. The blog post presents this as a concession ("sensible consequentialists supposedly do anyway") rather than a feature of decision theory under uncertainty.

  **Regarding your bias:**
  You are right to feel the objection is stronger than popular summaries let on, but likely for a different reason than the blog suggests. The cluelessness objection is devastating for **longtermist** consequentialism (trying to influence the far future), where causal chains are too long to model reliably. It is much less damaging to **near-term** interventions (e.g., distributing bed nets), where the causal link between act and outcome is tight and the window of evaluation is short. The blog post treats the objection as a universal refutation, whereas experts treat it as a boundary condition on how far out we can confidently plan. The objection doesn't kill consequentialism, but it does severely limit the scope of claims consequentialists can make about shaping the distant future.
