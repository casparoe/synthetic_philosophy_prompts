prompt: |-
  I read a blog post (effective-altruism-adjacent, the author sounded confident) that tries to explain the "cluelessness" objection to consequentialism, and I want to know how much of it to trust before I repeat any of it. Here's the gist: consequentialism says an act is right just in case it produces the best overall consequences; but thanks to the butterfly effect we can never know the full downstream consequences of anything — a small act today might cause a war in two hundred years — so consequentialism gives us no guidance at all about what to do; and a theory that can't guide action is refuted, so this kills consequentialism. It then says the standard reply is to shrink the theory down to the foreseeable future, judging acts only by their consequences over the next few years, which is what sensible consequentialists supposedly do anyway. Is this fair? Go through it claim by claim and tell me what someone actually working on this debate would nod at, what they'd call a distortion, and whether the refutation follows from the parts that are accurate. And is that "shrink it to the foreseeable future" move actually available to a consequentialist, or does it just change the subject? I'm inclined to think the objection is stronger than consequentialists let on, so tell me if that's just my bias. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question.
