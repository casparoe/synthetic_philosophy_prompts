answer: |-
  Below is a decision-tree handout designed for a reading group of peers. It is structured to isolate the theoretical commitments that generate the standard positions on Counterfactual Mugging (CM). Following the tree, I have summarized the current state of disputes in the literature, distinguishing between settled technical results and live normative disagreements.

  ### Part 1: Decision Tree for Counterfactual Mugging Positions

  **Instructions:** Start at the root. Answer the questions based on your theoretical commitments *before* looking at the leaves. The questions are designed to be answerable without knowing which decision theory they imply.

  ```mermaid
  graph TD
      Root[<b>ROOT: Object of Evaluation</b><br/>What is the primary bearer of rational value?]
      
      Root -->|The specific act at the node of decision | ActNode[<b>NODE 2: Information State</b><br/>Do you condition on your current observation<br/>(i.e., that the coin landed Tails) <br/>before evaluating the act?]
      Root -->|The global policy/function <br/>(mapping observations to actions)| PolicyNode[<b>NODE 3: Counterfactual Weighting</b><br/>When evaluating the policy, do you assign <br/>non-zero weight to branches you know <br/>you are not currently occupying?]

      ActNode -->|Yes: I update on being on Tails | ActUpdate[<b>NODE 4: Dependence Type</b><br/>Does your action provide evidence about <br/>the coin flip outcome <i>given you know it is Tails</i>?]
      ActNode -->|No: I ignore the observation | Incoherent1[<b>GAP: Act + Updateless</b><br/>Status: Incoherent.<br/>If you ignore the observation but evaluate <br/>only the act, you lack a decision rule.<br/>Usually collapses to Policy evaluation.]

      ActUpdate -->|No: Causal/Evidential link is broken | CDT_Leaf[<b>LEAF: Causal Decision Theory</b><br/>Verdict: REFUSE.<br/>Reasoning: Act has no causal impact on Heads.]
      ActUpdate -->|Yes: Action correlates with outcome | EDT_Leaf[<b>LEAF: Evidential Decision Theory</b><br/>Verdict: REFUSE (Standard/Updateful).<br/>Reasoning: P(Heads | Pay & Tails) = 0.<br/>Note: Some argue EDT should be updateless.]

      PolicyNode -->|No: Only weight the actual branch | Collapse[<b>GAP: Policy + Actual Only</b><br/>Status: Unattractive/Collapses.<br/>Evaluating a policy only on the actual <br/>branch is extensionally equivalent to <br/>evaluating the act. Leads to CDT/EDT.]
      PolicyNode -->|Yes: Weight all logical possibilities | UpdatelessNode[<b>NODE 5: Setup Coherence</b><br/>Is the scenario well-formed if precommitment <br/>is impossible and causation is absent?]

      UpdatelessNode -->|No: The problem is ill-posed | IllPosed_Leaf[<b>LEAF: Ill-Posed / Category Error</b><br/>Verdict: NO ANSWER.<br/>Reasoning: Probabilities undefined or <br/>Omega description incoherent <br/>(e.g., Hájek 2016).]
      UpdatelessNode -->|Yes: The math holds | NormativeNode[<b>NODE 6: Normative Scope</b><br/>Is 'rationality' exhausted by what you <br/>can precommit to? If precommitment is <br/>blocked, is there a fact of the matter?]

      NormativeNode -->|No: Rationality = Precommitment | Deflationary_Leaf[<b>LEAF: Deflationary / Precommitment View</b><br/>Verdict: QUESTION VOID.<br/>Reasoning: Without ability to bind, <br/>there is no 'rational choice' left to make.]
      NormativeNode -->|Yes: Rationality transcends binding | PayNode[<b>NODE 7: Generalization</b><br/>Does the logic requiring payment here <br/>generalize to malicious predictors <br/>(acausal blackmail/threats)?]

      PayNode -->|Uncertain / Depends on implementation | Unexplored1[<b>GAP: Generalization Status</b><br/>Status: Unexplored/Contested.<br/>Many UDT/FDT proponents are unsure <br/>if their formalism necessitates paying <br/>blackmail.]
      PayNode -->|Yes: You must pay threats too | BlackmailPay_Leaf[<b>LEAF: Robust Acausal Cooperators</b><br/>Verdict: PAY CM & PAY BLACKMAIL.<br/>Reasoning: Consistency across logical <br/>dependencies is paramount.<br/>(e.g., Early UDT, some FDT variants)]
      PayNode -->|No: Distinguish beneficial from malicious | BlackmailRefuse_Leaf[<b>LEAF: Blackmail-Resistant Theorists</b><br/>Verdict: PAY CM & REFUSE BLACKMAIL.<br/>Reasoning: Subjunctive dependence differs <br/>in threat vs. reward cases.<br/>(e.g., Refined FDT, some TDT variants)]
  ```

  #### Notes on Gaps and Indistinguishable Leaves

  1.  **Act + Updateless (Incoherent):** There is no standard position here. If you evaluate only the *act* (not policy) but refuse to condition on your *observation*, you have no input for the decision function. This combination is typically a misunderstanding of terms.
  2.  **Policy + Actual Only (Unattractive):** If you evaluate the policy but assign zero weight to counterfactual branches (Heads), the expected utility calculation collapses to the actual branch (Tails). On the Tails branch, paying costs $100 and gains nothing. This yields the same verdict as CDT but claims to be policy-based. It is rarely defended explicitly.
  3.  **EDT (Updateful vs. Updateless):** The tree places standard EDT in the "Refuse" leaf because standard EDT updates on observations. However, there is a minority view that EDT *ought* to be updateless. If held, that view migrates to the "Pay" branch. The tree separates them based on the *standard* formulation.
  4.  **UDT vs. TDT vs. FDT:** The tree does not separate these at the leaves because they all converge on **PAY** for the standard Counterfactual Mugging case. They diverge on implementation details (causal graphs vs. program equilibrium) and on the **Blackmail** node.
  5.  **Blackmail Variants:** The prompt asks for leaves regarding blackmail generalization. I have flagged "Uncertain" as a gap because a significant portion of the literature (including original FDT authors) has revised their stance on whether their theory *requires* paying blackmail. It is a live repair project, not a settled position.

  ***

  ### Part 2: State of Disputes in Decision Theory

  As a 4th-year PhD, you likely know that "consensus" depends heavily on which subset of decision theorists you ask (e.g., mainstream philosophy/economics vs. the LW/decision-theory-niche). The following breakdown focuses on the niche working explicitly on Newcomb-like problems, as that is where CM is discussed.

  #### 1. Settled or Near-Settled (Technical/Descriptive)
  *   **CDT loses money:** It is uncontroversial that CDT agents refuse the $100 and receive $0, while UDT/FDT agents pay the $100 and would have received $10,000 (in the ex-ante expectation). There is no dispute about the payout matrix.
  *   **Updatelessness is required to win:** It is settled that any theory that updates on the observation "Coin = Tails" before calculating expected utility will refuse the payment. To pay, one must evaluate the policy *ex ante* (before the coin flip).
  *   **EDT (Standard) refuses:** Standard, updateful EDT refuses the payment because $P(\text{Heads} | \text{Tails}, \text{Pay}) = 0$. The dispute is whether EDT *should* be reformulated to be updateless.

  #### 2. Live Normative Disputes
  *   **The Rationality of Updatelessness:** This is the central live dispute.
      *   *Side A:* It is rational to act as if you don't know what you know (ignore the Tails observation) because that policy wins ex-ante.
      *   *Side B (The "Why Now?" Objection):* Once you know you are on Tails, the Heads branch is counterfactually inaccessible. Maximizing a utility function over worlds you know don't exist is irrational fetishism. (See: Ahmed 2014, Briggs 2010).
      *   *Status:* **Highly Contested.** No consensus on whether "winning" defines rationality or whether "responding to actual causal opportunities" defines it.
  *   **The Blackmail/Acausal Threat Generalization:**
      *   *The Problem:* If you pay CM because your decision is logically correlated with Omega's prediction, do you also pay a blackmailer who predicts you will pay to avoid harm?
      *   *Side A:* Yes. Logical correlation is logical correlation. If you don't pay, you get blackmailed. (Vulnerability).
      *   *Side B:* No. We can distinguish "beneficial" subjunctive dependence from "malicious" dependence via the structure of the causal/logical graph (e.g., who moves first, or the nature of the dependency).
      *   *Status:* **Unresolved.** This is the biggest open wound in FDT/UDT research. Several papers have attempted to "fix" FDT to avoid blackmail while keeping CM, but no solution has gained universal acceptance.
  *   **The Deflationary/Precommitment View:**
      *   *Dispute:* Is "rationality" just a name for the output of the best available precommitment device? If precommitment is physically impossible (as in the prompt), is the question "what should I do?" meaningless?
      *   *Status:* **Live.** This is often a meta-ethical dispute about the definition of normativity rather than a technical decision-theoretic one.

  #### 3. Consensus vs. Niche Views (Cautionary Note)
  *   **Mainstream Economics/Philosophy:** Outside the specific decision-theory niche, CDT remains the dominant default. Many mainstream theorists view CM and Newcomb problems as "tricks" or "paradoxes" that reveal flaws in the setup (Omega) rather than flaws in CDT. They often endorse the **Ill-Posed** leaf as the standard view.
  *   **The Niche (LW/Decision Theory):** Within the niche, CDT is widely considered "refuted" for Newcomb-like problems. The consensus is that a *better* theory exists (UDT/FDT), but there is **no consensus** on which specific formulation (UDT vs. FDT vs. TDT) is correct, nor on how to handle the blackmail vulnerability.

  #### 4. Unknowns / Uncertainty
  *   **Formalization of "Logical Dependence":** It is not settled how to formally compute the degree of logical correlation between two distinct algorithms (you and Omega) without running into halting problem issues or infinite regress. FDT posits a solution, but the mathematical rigor is still developing.
  *   **Consensus on Blackmail:** I cannot state with confidence whether the majority of FDT proponents currently believe their theory *requires* paying blackmail or not. The literature contains retractions and revisions on this specific point (e.g., Soares 2016 vs. later discussions). It is safer to treat this as an open research program than a settled position.

  **Recommendation for the Reading Group:**
  Focus the discussion on **Node 3 (Counterfactual Weighting)** and **Node 7 (Generalization)**. The first separates the "Updateful" camp (CDT/EDT) from the "Updateless" camp (UDT/FDT). The second separates those who think Updatelessness is a universal principle from those who think it needs constraints to avoid exploitation. This will likely map cleanly onto your group's disagreements.
