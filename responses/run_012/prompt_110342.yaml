prompt: |-
  I'm a 4th-year PhD student working on decision theory and I need a decision-tree handout for my reading group, because we keep talking past each other about counterfactual mugging. Here's the case, so we're all working with the same thing: Omega flips a coin; on tails it asks you for $100 and you can pay or refuse; on heads it gives you $10,000 if and only if it predicted beforehand that you'd pay on tails. No precommitment possible, and whatever you do after the coin lands makes no causal difference to the heads branch.

  Build me a flowchart from commitments a reader might already have to named positions. Nodes should be questions someone can answer without already knowing where they lead — e.g. whether the thing you evaluate is the act or the whole policy/mapping from observations to actions, whether merely evidential (non-causal) dependence between branches counts, whether the one-shot and repeatedly-encountered versions get different answers, and whether it matters that this is a mixed-upside case where the benefit lands on a branch you'll never occupy. Leaves must include at least: causal decision theory, evidential decision theory, updateless/timeless decision theory, functional decision theory, the deflationary view that precommitment is the whole story and there's nothing left to say once you can't, and the view that the scenario is under-described or not a well-formed decision problem at all. Include one leaf for people who think the blackmail-style variants generalise and you should pay off acausal threats, and one for people who think the generalisation fails; if you're unsure of the canonical structure of those variants, say so rather than inventing details. Where the tree leaves a combination of answers with no position attached, note it and say whether that's because the view is incoherent, unattractive, or just unexplored, and flag any leaves the tree can't actually seperate.

  Then, seperately, tell me which disputes in this area are genuinely live among people who work on it and which are settled or near-settled. Don't present a contested call as the consensus, and where you don't know whether something is consensus, just say that.
