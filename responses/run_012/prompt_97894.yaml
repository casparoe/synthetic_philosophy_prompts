answer: |-
  Here is the desiderata list for a naturalistic theory of mental content, followed by the incompatibility theorems you asked for.

  ### The Desiderata List

  **1. The Misrepresentation Constraint (The Error Problem)**
  *   **The Case:** A frog's visual system fires at a small, dark, moving speck. Sometimes it's a fly (success); sometimes it's a BB pellet (failure). If content is defined strictly by what *causes* the state, the content is "fly-or-BB." But the frog *errs* when it snaps at the BB. It represents a fly, and gets it wrong. A theory that equates content with actual cause cannot distinguish truth from falsity.
  *   **Constraint or Prejudice?** **Genuine Constraint.** Without the possibility of error, you do not have representation; you have mere covariance. A thermometer covaries with temperature but does not misrepresent (it just breaks). A mind must be capable of being wrong about the world to be *about* the world.

  **2. The Swampman Constraint (The No-History Duplicate)**
  *   **The Case:** Davidson's thought experiment. A lightning strike arranges atoms into a molecule-for-molecule duplicate of a human. This being has no evolutionary history, no learning history, and no causal contact with the environment prior to its creation. Does it have thoughts? Does its "pain" state represent pain?
  *   **Constraint or Prejudice?** **Contested Intuition (Partisan).** Internalists treat this as a constraint (same physical state = same content). Externalists (teleosemanticists, causal theorists) treat this as a misconception (no history = no function = no content). If you demand a naturalistic theory based on *biological facts*, you are already leaning toward Externalism, which makes this a bullet you may have to bite rather than a constraint you can satisfy.

  **3. The Determinacy Constraint (The Disjunction Problem)**
  *   **The Case:** Fodor's horse/cow scenario. A state is tokened by horses, but also by cows at dusk. Does the state mean HORSE, COW, or HORSE-OR-COW-AT-DUSK? If the theory cannot privilege one over the others without circularity, content is indeterminate. If content is indeterminate, it cannot explain specific behaviors (e.g., searching for a horse vs. searching for a cow).
  *   **Constraint or Prejudice?** **Genuine Constraint.** Indeterminacy is the death of explanation. If a state's content is "X or Y," it cannot explain why the organism pursues X specifically. A theory must ground *specific* truth conditions.

  **4. The Compositionality Constraint**
  *   **The Case:** You can think "The cat is on the mat" and "The mat is on the cat." These thoughts share constituents ("cat," "mat," "on") that retain their contribution to truth conditions across combinations. A theory of content must explain how simple representations combine to form complex ones without changing the semantic value of the parts.
  *   **Constraint or Prejudice?** **Genuine Constraint (with caveats).** While connectionists challenge classical compositionality, any theory aiming to explain propositional attitude psychology (belief, desire) must account for the systematicity and productivity of thought. If your theory works only for simple sensory states, it fails to cover human cognition.

  **5. The Causal Efficacy Constraint (No Epiphenomenalism)**
  *   **The Case:** My belief that "there is water in the glass" causes me to reach. It must do so *because* it represents water, not merely because of its neural shape. If content is determined by distal historical facts (e.g., evolutionary lineage), but behavior is determined by proximal physical facts (current neural firing), content risks being causally irrelevant to the action it supposedly explains.
  *   **Constraint or Prejudice?** **Genuine Constraint.** If content does not do causal work, positing it is explanatorily redundant. We could just talk about neurophysiology. Intentional realism demands that intentional properties have causal power.

  **6. The Solitary System Constraint (The Robinson Crusoe)**
  *   **The Case:** Consider a cognitive system that is the only one of its kind in the universe. It has no conspecifics, no language community, and (unlike Swampman) perhaps has a history, but no lineage of selection among peers. Does it represent? Teleosemantics often relies on "proper function" derived from selection history. If selection requires a population, does the lone thinker have content?
  *   **Constraint or Prejudice?** **Contested Intuition (Partisan).** Social externalists say "No content without community." Individualists say "Cognition is in the head." Like Swampman, this tests whether content is intrinsic to the system or relational to a population.

  ---

  ### The Incompatibility Theorems

  You suspected the **Misrepresentation** requirement and the **No-History Duplicate (Swampman)** requirement pull against each other. You are correct, but the tension is deeper than that. It is structurally impossible to satisfy all six desiderata simultaneously within a purely physicalist framework. Here are the specific trade-offs.

  #### 1. The Normativity vs. Synchronic Supervenience Clash
  **(Misrepresentation + Determinacy) vs. (Swampman + Solitary System)**

  *   **The Conflict:** To solve Misrepresentation and Determinacy naturalistically, you need a **Norm**. You need a fact of the matter that says state S *ought* to be caused by X, even if it is currently caused by Y.
  *   **The Problem:** Physical facts are categorical; they describe what *is*, not what *ought* to be. The only way to derive an "ought" from an "is" naturalistically is through **History** (e.g., evolutionary selection or learning history). A state represents X because it was *selected for* tracking X.
  *   **The Incompatibility:** If content depends on History (to get Norms/Error), then Swampman (no history) has no content. If Swampman *does* have content (Synchronic Supervenience), then content must depend only on current intrinsic properties. But current intrinsic properties cannot ground Norms (why *this* state *ought* to match *that* world?) without collapsing into the Disjunction Problem (it matches whatever causes it).
  *   **Verdict:** You cannot have robust Misrepresentation and a No-History Duplicate. You must choose: either content requires history (Swampman is a zombie) or content is intrinsic (Swampman thinks, but explaining error becomes nearly impossible without smuggling in history).

  #### 2. The Causal Exclusion Clash
  **(Causal Efficacy) vs. (Misrepresentation + Determinacy)**

  *   **The Conflict:** To solve Misrepresentation and Determinacy, you almost certainly need **Externalism** (content depends on environment/history). To satisfy Causal Efficacy, content must cause behavior.
  *   **The Problem:** Behavior is local. Your arm moves because of local muscle contractions driven by local neural firing. It does not move because of your evolutionary history or the chemical composition of water on Twin Earth. If content is wide (Externalism) and behavior is narrow (Local Physics), then content is causally excluded by the physical properties that supervene locally.
  *   **The Incompatibility:** If you make content external enough to handle Misrepresentation (Dretske/Millikan style), you make it too distant to cause behavior (Epiphenomenalism). If you make content local enough to cause behavior (Internalism), you lose the ability to ground Norms/Misrepresentation naturalistically (back to the Disjunction Problem).
  *   **Verdict:** You cannot have fully Externalist Content *and* fully Local Causal Efficacy without a controversial account of "causation" (e.g., counterfactual dependence rather than physical push).

  #### 3. The Compositionality vs. Teleology Clash
  **(Compositionality) vs. (Misrepresentation via Biological Function)**

  *   **The Conflict:** Teleosemantics grounds content in selected functions. Selection acts on whole organisms and survival-enhancing behaviors.
  *   **The Problem:** Evolution selects for "snap at moving dot," not for the combinatorial syntax of "cat" + "on" + "mat." It is incredibly difficult to show how biological selection processes carve out discrete, recombinable semantic constituents. Most teleosemantic accounts work well for simple signals (frog flies) but fracture when trying to build a language of thought.
  *   **Verdict:** A theory that secures Misrepresentation via Biology often sacrifices Compositionality. A theory that secures Compositionality (like Conceptual Role Semantics) often sacrifices Naturalistic Misrepresentation (collapsing into coherence theories where error is hard to define).

  ### Summary of the Trade-Off

  Your suspicion is confirmed. The core bottleneck is **Normativity**.

  1.  **If you want Misrepresentation:** You need Norms.
  2.  **If you want Naturalistic Norms:** You need History (Teleology).
  3.  **If you need History:** You lose **Swampman** and **Solitary Systems** (no history = no content).
  4.  **If you keep Swampman (Intrinsic Content):** You lose Naturalistic Norms, which means you likely fail **Misrepresentation** (Disjunction Problem) or **Causal Efficacy** (if you try to save norms via social externalism).

  **The "No Magic" Verdict:**
  A theory that earns representation from causal/biological facts alone **cannot** grant content to Swampman. If you require Swampman to have content, you are implicitly positing that intentionality is an intrinsic physical property (panpsychism-adjacent) or a primitive, which violates your "no magic primitives" constraint.

  To stay naturalistic, you must accept that **content is historical.** Consequently, you must accept that a physical duplicate without a past does not have a mind. That is the price of solving the Error Problem without magic.
