      *   Why bet on "Not Fitting"? Because in every case where the object *lacked* the standard warrant (mud, harmless dog, false proposition, unfunny joke), she said "Not Fitting," regardless of how strong the external reason was (torture, money, friendship). The painting is explicitly "mediocre" (lacks merit). The reason is "it was hers" (external/personal). This matches the Mud/Demon and Unfunny Joke/Demon structure.
