answer: |-
  Here is a complete run-sheet for the session. It is designed to be tight, slightly adversarial, and physically grounded. The frustration the students feel during the betting phase *is* the philosophical point.

  # Activity Title: The $t=1$ Contract

  **Time:** 75 Minutes
  **Participants:** 16 (4 Groups of 4)
  **Goal:** Demonstrate that the state of the lamp at $t=1$ is logically underdetermined by the supertask description, and that "solutions" require adding unstated axioms (like continuity or parity).

  ## 1. Materials & Setup

  *   **The Prop:** A desk lamp with a visible bulb. Place it on a table at the front, unplugged or with the switch covered. This is "The Fact."
  *   **The Currency:** 20 slips of paper per group, marked "CERTAINTY." (Total 80).
  *   **The Whiteboard:** Divided into 4 quadrants, one for each group.
  *   **The Cards:** 4 distinct "Machine Specification" cards (see below). Print these on different colored paper so they can't be swapped secretly.
  *   **Timer:** Visible to everyone.

  ### The Machine Cards (Cut these out)
  *   **Card A (The Thomson):** "Initial State: OFF. Schedule: Switch at $t = 1/2, 3/4, 7/8...$ Action: Toggle (if OFF $\to$ ON, if ON $\to$ OFF). Query: State at $t=1$?"
  *   **Card B (The Trichotomy):** "Initial State: RED. Schedule: Switch at $t = 1/2, 3/4, 7/8...$ Action: Cycle (RED $\to$ BLUE $\to$ GREEN $\to$ RED...). Query: State at $t=1$?"
  *   **Card C (The Sticky):** "Initial State: RED. Schedule: Switch at $t = 1/2, 3/4, 7/8...$ Action: Click (The switch clicks, but the bulb remains RED at every stage $n$). Query: State at $t=1$?"
  *   **Card D (The Stipulation):** "Initial State: OFF. Schedule: Switch at $t = 1/2, 3/4, 7/8...$ Action: Toggle. **Clause 5:** Notwithstanding the above, at $t=1$ the state is ON. Query: State at $t=1$?"

  ## 2. Roles

  *   **The Facilitator (You):** You are the **Bookie**. You are neutral, bureaucratic, and slightly annoying. You hold the "Answer Key" (which is blank). You enforce time strictly.
  *   **The Groups:** Each group is a "Contractor."
  *   **Within Groups:** Ask them to quickly assign:
      *   *Scribe:* Writes the verdict on the board.
      *   *Signatory:* Commits the Certainty Chits.
      *   *Auditor:* (Give this to a grad student) Their job is to find loopholes in *your* card before the other groups do.

  ## 3. The Timeline (75 Minutes)

  ### 00:00 – 05:00: Setup & Wagering
  *   **Say:** "You are Contractors. You have received a specification for a machine. Your job is to determine the state of the lamp at $t=1$. There is no trick. The description is complete."
  *   **Action:** Hand out the cards. Do not let groups compare cards yet.
  *   **The Bet:** Each group has 5 Certainty Chits. They must write their Verdict (ON/OFF/RED/etc.) on the whiteboard quadrant. They must also place a bet (0 to 5 chits) on how defensible that verdict is.
  *   **Rule:** If your logic is successfully falsified in Round 2, you lose the chits to the Bookie. If you survive, you keep them.

  ### 05:00 – 20:00: Round 1 (Diagnosis)
  *   Groups discuss their card.
  *   **Facilitator Note:** Walk around. If a group says "It's physically impossible," say: "Treat it as a logical description, not engineering." If they ask about the gap size, say: "The series converges to 1."
  *   **Expected Outcomes:**
      *   *Card A:* Will argue Parity (Last switch was ON, so it's ON... wait, no last switch). They will likely split or guess.
      *   *Card B:* Parity fails immediately. Confusion should be high.
      *   *Card C:* Intuition says RED. (Continuity trap).
      *   *Card D:* Verdict is trivial (ON). They will feel smug.
  *   **At 20:00:** Lock the board. No more changes.

  ### 20:00 – 35:00: Round 2 (The Audit)
  *   **Action:** Groups rotate one step clockwise. Group 1 audits Group 2's card/verdict. Group 2 audits Group 3, etc.
  *   **Task:** You have 15 minutes to find a contradiction in their Verdict based *only* on the text of their Card.
  *   **The Kill:** If you find a contradiction, raise your hand. I (Bookie) will adjudicate. If I rule in your favor, they lose 2 Chits to you.
  *   **Facilitator Note:** This is where the room should get loud.
      *   *Audit on Card A:* "You said ON. Why not OFF? There is no last switch." (Parity breaks).
      *   *Audit on Card B:* "You said GREEN. Why not BLUE? The cycle has no limit."
      *   *Audit on Card C:* "You said RED. But the switch clicks. Does 'click' imply state change? The card says 'remains RED'. Okay, that holds." (This one is hard to kill).
      *   *Audit on Card D:* "You said ON. Card says ON. No contradiction." (This one is immune).
  *   **Result:** Groups A and B should lose chits. Group C might hold. Group D is safe. This creates resentment. "Why did they get a free pass?"

  ### 35:00 – 50:00: Round 3 (The Amendment)
  *   **Action:** Groups return to their own cards.
  *   **Task:** You have lost credibility (chits). You may now add **exactly one sentence** to your Machine Card to guarantee your verdict.
  *   **Constraint:** The sentence cannot simply say "The lamp is ON at t=1." It must be a rule about the machine's behavior (e.g., about continuity, limits, or states).
  *   **Wager:** Place remaining chits on the new Amendment.
  *   **Expected Outcomes:**
      *   *Card A:* Will try to add "State follows the limit of the sequence." (But the sequence 0,1,0,1 has no limit). They will struggle.
      *   *Card C:* Will add "State is continuous."
      *   *Card D:* Doesn't need to add anything.
  *   **At 50:00:** Collect the cards.

  ### 50:00 – 75:00: The Debrief (The Philosophy)
  *   **Step 1: The Payout.**
      *   Count the chits. Announce that the Bookie is keeping all of them.
      *   **Say:** "Why? Because none of your descriptions pinned down the fact. The lamp at $t=1$ is not ON, not OFF, and not RED. It is undefined."
  *   **Step 2: Map the Rounds.**
      *   **Card A (Thomson):** Discuss the Parity Argument. Ask: "What assumption were you making?" (That infinite toggling implies a final state). Show that $0, 1, 0, 1...$ has no limit. The description runs out of road before $t=1$.
      *   **Card B (Trichotomy):** "Why was this harder?" Because Parity (Even/Odd) doesn't apply to 3-cycles. This proves the Parity argument was never about the lamp; it was about our love of binary counting.
      *   **Card C (Sticky):** "Why did you feel safe here?" Because you assumed **Continuity**. You assumed that if it's Red at $t_{n}$ for all $n$, it's Red at $t_{limit}$. But the card didn't *say* the state is a continuous function of time. It just said it stays Red at the switch points. (Benacerraf's point).
      *   **Card D (Stipulation):** "Why were they immune?" Because they filled the gap. This shows the gap *exists*. If the description were complete, Clause 5 would be redundant. It was necessary.
  *   **Step 3: The Takeaway.**
      *   Write **UNDERDETERMINATION** on the board.
      *   **Say:** "The problem isn't that we don't know the answer. The problem is that the story stops telling us what happens before $t=1$. Any answer requires a new rule (an axiom) that wasn't in the original text. You weren't solving a puzzle; you were writing legislation."

  ## 4. Troubleshooting: What Will Go Wrong

  **1. "But physically, the switch would melt."**
  *   **Fix:** This will come up in Round 1. Shut it down immediately. "This is a logic machine. Friction does not exist. If you appeal to physics, you forfeit 1 Chit."

  **2. The Grad Students stay silent.**
  *   **Fix:** In Round 2 (The Audit), tell the *Auditor* (the grad student role) that they must deliver the opening argument for the attack. Give them the authority.

  **3. Group A (Thomson) insists on "It must be one or the other."**
  *   **Fix:** This is the core intuition you want to expose. In the debrief, ask: "Must it? Who says? The Law of Excluded Middle applies to propositions, but does a physical description *force* a proposition to be true?" Let them sit with the idea that the lamp might be in a state that isn't On or Off (i.e., non-existent/undefined).

  **4. Running out of time.**
  *   **Fix:** If Round 2 runs long, cut Round 3. You can explain the "Amendment" phase in the debrief ("If you could have added a rule, what would it have been?"). The Debrief is the most important part; do not shorten it.

  **5. The Bookie (You) feels too authoritarian.**
  *   **Fix:** Lean into it. Be bureaucratic. "The conditions for payout were not met by the text." This mirrors the coldness of logical underdetermination. The frustration is pedagogical.

  ## 5. Limitations: What This Activity Can't Do

  Be honest with yourself about where you need to step in with a "mini-lecture" during the debrief.

  1.  **The Math of Limits:** The activity shows the *result* (no limit), but it won't teach them *why* the sequence $0, 1, 0, 1$ diverges. You will need to draw the number line on the board during the debrief to show that the sequence never settles.
  2.  **Benacerraf's Distinction:** The activity creates the *feeling* of the gap, but you need to explicitly name the distinction between "The task is completed" and "The state at completion is defined." The students might conflate "finishing the switches" with "determining the light."
  3.  **Causal Closure:** Some students might argue "The state at $t=1$ is caused by the state at $t_{n}$." You need to explicitly block this in the debrief by pointing out that $t=1$ is not causally connected to any specific $t_{n}$ in the sequence, because there is no *immediate predecessor* to $t=1$.

  ## 6. Why This Works
  You aren't telling them the description is incomplete. You are letting them bet on it being complete, taking their money, and then showing them the receipt. The resentment they feel when Group D wins easily, or when the Bookie keeps the pot, is the exact emotional correlate of realizing the logical gap. They will remember the frustration long after they forget the definition of a supertask.
