answer: |-
  The radiator in Seminar Room 3B gave a final, metallic shudder and fell silent, leaving the cold to settle properly into the room. It was five o'clock on a Friday. The rest of the reading group had drifted off to the pub, but Elena and Julian remained, coats on, breath misting slightly in the dim light.

  Elena rubbed her hands together. "So," she said. "The social scientist thinks we're confused about uncertainty. You think she's a dogmatist about experience. I think she's trying to save the Bayesian account from collapsing into incoherence. But we didn't finish."

  Julian pulled his scarf tighter. "We didn't even start. You kept saying that to update, I need a fixed point. I kept saying there are no fixed points. We talked past each other."

  "Let's try to grind through it," Elena said. "Properly. No hand-waving."

  "Agreed."

  "Start with the embarrassment," Julian said. "The one that makes both of us look stupid. Old Evidence."

  Elena nodded. "Einstein and Mercury. The perihelion shift was known for decades. General Relativity entailed it. When Einstein realized the entailment, the known fact confirmed the theory. But for a Bayesian, if the evidence $E$ is already known, $P(E) = 1$. If $P(E) = 1$, then $P(T|E) = P(T)$. The probability of the theory doesn't budge. The evidence does no work."

  "Right," Julian said. "And this hurts my view just as much as yours. If I say all evidence is uncertain, I still have to explain why learning that $T$ entails $E$ changes my mind about $T$. If I already had $P(E) \approx 1$, shifting it to $P(E) = 0.999$ doesn't help."

  Elena leaned forward. "Here is where I concede. The strict conditionalization view—that we only update on certainties—forces us to say the evidence wasn't the perihelion shift itself. It was the *discovery of the entailment*."

  "So you condition on 'Relativity entails Mercury's orbit'?"

  "Yes. That proposition wasn't certain before Einstein did the math. It became certain. So we conditionalize on the logical relation, not the empirical fact."

  Julian tapped his pen on the table. "That works, I'll grant you. But notice what you've done. You've relocated the certainty. You're certain of the math. But in the real world, researchers make mistakes in derivations all the time. If I'm a strict conditionalizer, I have to wait until I'm *certain* the derivation is correct before I update. That seems psychologically impossible and normatively wrong. I should be able to update partially on a shaky proof."

  "Fair," Elena said. "But if you allow partial updates on the proof, you need Jeffrey Conditionalization. And that brings us to where we actually diverge. Let's find a case where our verdicts differ. Not just a difference in description, but a difference in the numbers."

  "The blurry dial," Julian said immediately.

  "Go on."

  "A researcher looks at a noisy analog gauge. It points roughly to 20, but it could be 19 or 21. She needs to update her belief about the pressure in the tank."

  "Okay," Elena said. "On my view, she does not condition on 'Pressure is 20'. She conditions on her experience: 'The gauge *looked* like it was at 20'. Let's call that $L_{20}$. She becomes certain of $L_{20}$. Her new probability for the pressure being 20 is $P_{old}(\text{Pressure } 20 | L_{20})$."

  "On my view," Julian countered, "she doesn't become certain of $L_{20}$. She simply shifts her credence in the partition {Pressure 19, Pressure 20, Pressure 21}. Say she shifts $P(\text{Pressure } 20)$ to 0.8. She uses Jeffrey Conditionalization. Her new probability for any hypothesis $H$ is $\sum P_{old}(H | E_i) P_{new}(E_i)$."

  "And here is the divergence," Elena said, her eyes narrowing. "Suppose the gauge is known to be faulty. Suppose $P_{old}(\text{Pressure } 20 | L_{20})$ is actually only 0.5, because the gauge sticks. But the researcher, in the moment, feels the visual experience warrants a credence of 0.8 in Pressure 20."

  "Exactly," Julian said. "If you force her to condition on $L_{20}$ as a certainty, she is locked into your prior conditional probability. She ends up with 0.5. If she uses Jeffrey updating, she sets the new probability of the state directly to 0.8, overriding the prior conditional probability."

  "But that violates Rigidity," Elena objected. "Jeffrey Conditionalization assumes $P_{new}(H | E_i) = P_{old}(H | E_i)$. If she changes the conditional probability of the Pressure given the Look, she isn't doing Jeffrey updating. She's doing something else."

  "Is she?" Julian asked. "Or is the 'Look' just a proxy? The substance of the learning event is the shift in confidence about the world, not the shift in confidence about the retina. If I tell you 'I'm 80% sure it's 20', you should update accordingly. If you insist on routing that through a proposition I'm supposed to be certain of, you might get the wrong answer because your model of my reliability is wrong."

  Elena paused. The cold was seeping through her coat. "I see the risk. If I treat the experience as certain, I make the agent a dogmatist about the experience. But if I let her just assign probabilities to the world-states directly, what constrains her? Why 0.8 and not 0.9? On my view, the constraint is the truth of the experience. On yours, it seems... arbitrary."

  "It's not arbitrary," Julian said. "It's constrained by the likelihood ratios. The input isn't the probability 0.8. The input is the *force* of the experience. But let's admit the verdict is different. In the faulty gauge case, my method allows the agent to correct for known bias in the moment by shifting the weight. Your method requires her to have a proposition 'The gauge is sticking' in her partition, condition on that, and hope her priors were right. If she didn't anticipate the fault, you're stuck."

  "Conceded," Elena said softly. "If the partition isn't rich enough to capture the uncertainty, strict conditionalization fails. Jeffrey updating is more robust to unanticipated error."

  "But," Julian raised a finger. "You have a weapon. Order dependence."

  Elena straightened up. "Yes. This is what keeps me up. If I conditionalize on $E$ then $F$, I get the same result as $F$ then $E$. $P(H | E \& F)$ is commutative. But if I Jeffrey-update on $E$ to probability $x$, and then on $F$ to probability $y$... the result depends on the order. If the partitions overlap, or even if they don't, the shifts don't commute."

  "It's true," Julian admitted. "Sequential Jeffrey updates don't commute. If I see a blurry red light, then hear a blurry beep, the final probability depends on whether I process the light or the beep first. That looks like a defect. Rational learning shouldn't depend on the order in which I process my inputs."

  "So," Elena said. "Is it fatal? If your rule gives different answers for the same total evidence, isn't it incoherent?"

  Julian rubbed his chin. "It's fatal only if you think the *probability shifts* are the fundamental inputs. They aren't. The fundamental inputs are the *likelihood ratios*—the Bayes factors. How much does the experience favour $E$ over $\neg E$? If you define the update in terms of the factors, those *do* commute. The non-commutativity is an artefact of representing the input as a final probability rather than a weight of evidence."

  Elena considered this. "So you're saying the order dependence is a bug in the bookkeeping, not the epistemology?"

  "Exactly. If two agents receive the same evidence, they should agree on the likelihood ratios. If they apply those ratios to their priors, they get the same posterior, regardless of order. The fact that the intermediate probability assignments look different is just... accounting noise."

  "Okay," Elena said. "I can accept that. If the invariants commute, the theory is stable. But that leads me to the thing I really want to know. Where is the fight?"

  Julian looked at her. "What do you mean?"

  "We just agreed that Old Evidence is handled by conditioning on entailments. We agreed that Jeffrey updating handles faulty instruments better. We agreed that order dependence is an artefact of representation. So why were we arguing at the start? Is it just substance versus bookkeeping?"

  Julian leaned back. "I think there is a substance. It's about the 'Given'. You think there must be a proposition that stops the regress. A foundation. I think the regress just fades out. But..."

  "But?"

  "But maybe the substance is thinner than we think," Julian said. "When you say 'Condition on $L_{20}$', you treat $L_{20}$ as certain. But in practice, to make your model work, you have to assign it a likelihood ratio that reflects your uncertainty about the experience. You effectively treat it as uncertain in the meta-language."

  "And when you say 'Shift probability to 0.8'," Elena countered, "you are effectively treating 0.8 as a temporary certainty for the sake of the calculation. You have to stop the shift *somewhere* to compute the posterior."

  "So the disagreement," Julian said slowly, "is about where we draw the boundary of the model. You draw it at the experience. I draw it at the world-state, but acknowledge the boundary is porous."

  "Is that it? Just modelling choices?"

  "No," Elena said. "There's a norm here. If I treat my experience as certain, I am committed to never doubting that I had the experience. I can doubt the world, but not the seemings. You allow me to doubt the seemings later. That's a substantive difference in how we view memory and introspection."

  "True," Julian said. "But do you actually believe you are infallible about seemings? Or do you just find it useful to model yourself that way?"

  Elena sighed. "Useful. If I don't treat something as fixed, I can't turn the crank. I need a lever. You're saying the lever is flexible. I'm saying if the lever bends, the machine doesn't work."

  "But the machine does work," Julian said. "We use uncertain evidence in courtrooms, in medicine, in physics. We don't wait for certainty. We weigh."

  "We weigh," Elena agreed. "But to combine the weights, we need a common currency. Probability is that currency. And probability requires a sample space. And a sample space requires defined events."

  She paused, looking at the silent radiator.

  "Here is the truce," Elena said. "Substantively, you are right that evidence is rarely, if ever, psychologically certain. We are never dogmatists about the given. But formally, I am right that to model learning as a transformation of probability functions, we need to represent the input as a constraint that functions *like* a certainty within the scope of the update."

  "So," Julian smiled. "I win on the metaphysics of evidence. You win on the mathematics of updating."

  "Almost," Elena said. "You win on the metaphysics. But I win on the warning. If you forget that your 'uncertain update' is just a shortcut for a more complex conditionalization on a richer partition of experiences, you'll lose track of *why* you shifted the weights. You'll treat the 0.8 as a brute fact, not as a summary of a relation between mind and world."

  "And if you forget that your 'certain experience' is a fiction," Julian added, "you'll treat your priors on the conditionals as immutable, and you'll become the dogmatist about inner life that your colleague accused you of being."

  "Deal," Elena said. She stood up and pulled her coat tight. "Same time next week? I hear they're fixing the radiator."

  "Only if we can discuss the Principal Principle," Julian said, standing as well. "I still think chance is just credence waiting to happen."

  "Don't start," Elena laughed, opening the door to the warm corridor. "One metaphysical crisis per Friday is my limit."
