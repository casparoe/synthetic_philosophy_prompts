  ### Leaves and Positions

  1.  **Instrumentalism**
      *   *Awkward Commitment:* You must admit that successful scientific practice relies on fictions you believe are strictly false.
  2.  **Eliminativism about the symbolic level**
      *   *Awkward Commitment:* You must claim that widespread, stable predictive successes using "simmball" talk are purely accidental or illusory.
  3.  **Reductive Identity**
      *   *Awkward Commitment:* You must assert that talking about a "clump" is literally identical to talking about "marble 1 next to marble 2," despite the vast difference in descriptive utility.
  4.  **Causal Exclusion or Epiphenomenalism**
      *   *Awkward Commitment:* You must hold that simmballs exist and are distinct, yet they do absolutely nothing to influence the system they inhabit.
  5.  **Non-Reductive Physicalism**
      *   *Awkward Commitment:* You must explain how higher-level properties inherit causal powers without those powers simply being the lower-level powers renamed.
  6.  **Realism about Real Patterns**
      *   *Awkward Commitment:* You must argue that patterns can be causally efficacious even if they are not made of any "stuff" other than the arranged parts.
  7.  **Dissolution**
      *   *Awkward Commitment:* You must convince the group that their intense disagreement is based on a linguistic or conceptual mistake rather than a factual one.
  8.  **Unnamed: Strong Emergent Dualism** (Unoccupied)
      *   *Diagnosis:* Incoherent. Posits physical effects without physical causes in a closed physical system.
  9.  **Unnamed: Pragmatic Realism** (Unoccupied)
      *   *Diagnosis:* Unexplored. Claims novel causal powers that are nevertheless relative to observer scale.

  ***

  ### Indistinguishable Leaves and Separation

  **Flagged Pair:** **Non-Reductive Physicalism** and **Realism about Real Patterns**.
  *   **Reason:** Both accept distinct entities, counterfactual causation, and some form of causal efficacy. The tree separates them based on "Explanatory Autonomy" (Node 6) and "Power Inheritance" (Node 7), but in practice, proponents of both views often agree that patterns are indispensable *and* that powers are realized.
  *   **Additional Question:** "Is the causal power of the simmball *ontologically distinct* from the collective power of the simms, or merely *descriptively distinct*?"
      *   *Ontologically distinct:* Realism about Real Patterns.
      *   *Descriptively distinct:* Non-Reductive Physicalism.

  **Flagged Pair:** **Instrumentalism** and **Eliminativism**.
  *   **Reason:** Both deny mind-independent existence. The separation relies on whether the user thinks the term is "useful" or "false."
  *   **Additional Question:** "If the simmball description predicts perfectly for 1,000 years, does that make it true?"
      *   *Yes:* Instrumentalism (truth is utility).
      *   *No:* Eliminativism (truth is correspondence).

  ***

  ### Note on Disagreement

  Most actual disagreement in this group will likely cluster around **Node 4 (Causal Definition)** and **Node 5 (Causal Closure)**.

  Philosophers tend to fixate on Node 5, worrying that if the simm-level is closed, the simmball level is excluded. Cognitive scientists tend to fixate on Node 4, arguing that "causation" in their field means "predictive dependency" (Counterfactual), not "energy transfer" (Force). If the group cannot agree on what "cause" means in Node 4, they will talk past each other indefinitely on Node 5. The instrument forces this definition into the open before asking about efficacy. Additionally, **Node 1 (Observer-Relativity)** is a hidden fault line; many scientists assume realism without arguing for it, while philosophers may challenge the premise itself.
