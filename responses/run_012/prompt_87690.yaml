  # Q&A Prep Sheet: Keynes, Weight, and Continuity

  ## Part 1: Objections by Camp (Ordered by Risk)

  ### 1. The Historians (Continuity & Rupture)
  **Risk Level:** Critical (High Likelihood × Fatal Damage)
  **Objection:** You are smoothing over a genuine rupture. In the 1930s, Keynes speaks of uncertainty as a situation where there is no scientific basis for calculation, not just where the basis is imprecise. If the *Treatise* logic still applied, why does he abandon numerical probability in the *General Theory*?
  **Reply:** Keynes does not abandon rational belief; he abandons numerical precision. The *Treatise* already allows for non-numerical probabilities where comparison is possible but measurement is not. The 1930s work applies this existing category to macroeconomics: we cannot calculate numerical expectations, but we still form rational conventions based on the weight of available evidence. The theory of belief remains continuous; only the scope of arithmetic shrinks.
  **Weakness/Concession:** The textual tone in Chapter 12 of the *General Theory* is far more pessimistic about rational calculation than the *Treatise*, suggesting a shift in mindset even if the logic holds.

  ### 2. The Post-Keynesians (Ontological Uncertainty)
  **Risk Level:** Critical (High Likelihood × Fatal Damage)
  **Objection:** You are defanging Keynes. If uncertainty is just imprecise probability or low weight, investors could still calculate expected ranges. Keynes's point is that rational calculation *fails* entirely, causing investment collapse. Can your Keynes explain the crisis?
  **Reply:** Yes, because low weight justifies relying on convention rather than calculation. When weight is sufficiently low, rational agents stop trying to compute expected values and instead follow the crowd or assume the present continues. This behavioral shift, driven by the epistemic limit of weight, is exactly what causes investment to freeze without needing ontological chaos.
  **Weakness/Concession:** You must concede that this makes Keynes sound more like a rationalist than they prefer; you cannot give them the ontological rupture they want.

  ### 3. The Decision Theorists (Imprecise Probability)
  **Risk Level:** High (High Likelihood × Moderate Damage)
  **Objection:** Why do you need a logical relation of "weight"? Anything you describe as robustness or sensitivity to evidence can be modeled as a set of probability functions. The logical theory is unnecessary metaphysics.
  **Reply:** A set of functions models the *state* of belief, but weight explains the *justification* for that state. Keynes is interested in why the set is wide (the relation between evidence and hypothesis), not just that it is wide. The logical relation provides the epistemological grounding that pure decision theory ignores.
  **Weakness/Concession:** Concede that for practical decision modeling, sets of distributions are sufficient, but maintain that for history of thought, the logical distinction matters.

  ### 4. The Philosopher of Science (Confirmation)
  **Risk Level:** Medium (Medium Likelihood × Moderate Damage)
  **Objection:** What work is weight doing that a likelihood ratio or the width of a confidence interval does not already do? If it maps onto interval width, it is redundant.
  **Reply:** Interval width is static; weight is dynamic. Width tells you the current spread of belief, but weight tells you how much that spread would contract if you gathered more data. Weight is a measure of the stability of the estimate, not just its current precision.
  **Weakness/Concession:** Admit that without a formal metric for "potential evidence," weight remains qualitatively distinct but formally elusive compared to interval width.

  ---

  ## Part 2: Objections to Grant
  *   **To the Decision Theorists:** Grant that modern imprecise probability theory can formally replicate the *outputs* of Keynes's system. Do not fight them on formal utility; fight them on epistemological interpretation.
  *   **To the Post-Keynesians:** Grant that Keynes's rhetoric in the 1930s sounds more radical than in 1921. Do not insist the tone is identical; insist the underlying logical structure of rational belief remains intact.

  ## Part 3: Ambiguities Inviting Cheap Shots
  *   **"How far a probability estimate would move":** This is counterfactual. You cannot measure how much an estimate would change without actually having the new evidence. Expect the Philosopher or Decision Theorist to ask: "How do you measure weight ex ante if it depends on evidence you do not yet possess?"
      *   *Defense:* Weight is a logical relation based on the *completeness* of current evidence, not a prediction of future values. It measures the potential for movement, not the movement itself.
  *   **"Limit on applicability" vs. "Repudiation":** You claim the 1930s mark a limit, not a rejection. This is a fine line. If the limit is too severe, it looks like a repudiation.
      *   *Defense:* A limit on numerical calculation is not a limit on rational judgment. Keep this distinction sharp.

  ---

  ## Part 4: The Question I Hope Nobody Asks
  "If weight measures the sensitivity of a probability estimate to new evidence, what is the weight of a proposition in a state of fundamental uncertainty where no relevant evidence is conceivable? If weight is zero, then calculation is possible (risk), which contradicts Keynes. If weight is undefined, then your continuity claim fails because the *Treatise* theory cannot handle the *General Theory* case."

  ---

  Verdict: The historians' continuity challenge regarding the textual shift from 1921 to 1936
