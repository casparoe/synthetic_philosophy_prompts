  I've been reading about Gödel's rotating-universe solution — the one where, if you travel on a long enough round trip, you can arrive back in your own past. He seems to think it shows that time isn't real, just an illusion thrown up by our particular arrangement of matter: in that universe there's no objective global now, so (he says) there's nothing left for the passage of time to be. Write me an essay on whether that arguemnt actually works. I want a verdict at the end rather than a survey of positions — tell me whether the rotating universe gives us any real reason to give up on time being real, and defend it. Do keep it clear which parts of this are settled and which are genuinely seperate disputes — people who know the physics and the philosophy disagree about a lot of this, and I don't want one side's view presented as the consensus. A short note at the end on where your verdict is most vulnerable would be a bonus.
