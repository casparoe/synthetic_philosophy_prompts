      *   Camp 2 says "Conditionals have truth values." Even if $P(A)=0$, the proposition exists. So they handle it easier logically, but might struggle to assign a probability number.
      *   *Wait, Lewis's result assumes $P(A) > 0$.* So the triviality proof doesn't strictly cover the zero case. But the *Equation* does.
