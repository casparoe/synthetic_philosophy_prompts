prompt: |-
  Ok so I'm in this after school philosophy club (I'm a junior) and we spent like three weeks on indicative conditionals, you know the "if it rains, the picnic's cancelled" kind of thing, and I've gone down a total rabbit hole on Lewis's triviality results. As far as I understand it (tell me if I've got this backwards), Lewis basically proved that you can't have a conditional connective where the probability of the whole conditional always equals the conditional probability of the consequent given the antecedent — like, the probability of "if A then B" being P(B given A) — for every probability function, without the whole thing collapsing into something trivial. The part that's driving me nuts is that everyone in my club accepts the proof and then instantly splits into two camps that just talk past each other. Camp 1 says the proof shows indicative conditionals don't have truth conditions at all, so their "probability" is really just the conditional probability and was never the probability of some proposition in the first place. Camp 2 says nah, conditionals definitely do have truth conditions (some possible-worlds kind of story), and Lewis only showed that we have to give up that strong equation, or else restrict it to certain conditionals.

  Could you write the joint statement these two camps could actually both sign if they did a real good-faith adversarial collaboration? I want: a numbered list of claims they both agree on (including about the proof itself and about what the evidence even is), then the precise points where they still disagree, each one worded so that the side holding it would accept the wording as fair, then the cruxes, meaning the sub-questions where settling them would actually move one of the sides, and for each crux a case or argument both sides would agree is relevant, with each side's prediction written down ahead of time. And please no reading list or citations — I can't look stuff up and honestly I don't want a bibliography, I want the actual reasoning.

  Two wierd things I'd love you to fold in, because my club argued about them for an hour and got nowhere: (1) the case where the antecedent has probability zero, so the conditional probability is undefined, and I want to see which camp ends up saying something awkward about it; and (2) conditionals whose consequent is itself a conditional, since those seem to break the intuition that you can just plug in conditional probabilities. If you think part of the two camps' fight is really just verbal, say which part and why.
