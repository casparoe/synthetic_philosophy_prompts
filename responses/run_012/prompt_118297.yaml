answer: |-
  Case One involves Elena, a freelance architect who relies on a cloud-based schema library stored on a private server she owns. When designing, she queries the library via voice command; retrieval is instantaneous, accurate, and she endorses the output without second-guessing. The library guides her drafting as seamlessly as biological memory. According to the parity principle, if this retrieval occurred internally, it would be cognitive. The resource is constantly available, easily accessible, and automatically endorsed. Since the interaction is functionally isomorphic to internal recall and meets all standard conditions for integration, the verdict is that the server is part of Elena's cognitive process.

  Case Two involves Elena working as a temporary contractor. She uses the identical schema library, hosted on an identical interface, but the server is leased from a staffing agency and must be returned at 5 PM. The content, reliability, speed of consultation, and her automatic endorsement are functionally indistinguishable from Case One. However, the resource is owned and controlled by the agency. Applying the parity principle, the internal counterpart would be cognitive. Yet, because the resource is alienable and contingent on a contractual period rather than personal integration, the standard conditions for 'constant availability' are interpreted as normatively fragile. Consequently, the verdict is that the server remains a mere external tool, not part of her mind.

  The single feature doing the work is ownership. If removed—making both cases either owned or leased—the verdicts converge, suggesting ownership drives the intuition. However, honest reporting reveals this pair smuggles a functional difference. Ownership impacts 'constant availability': the leased server is physically accessible but normatively unavailable after hours. This alters the reliability condition subtly; the threat of revocation undermines the 'glue' required for extension. Thus, true functional identity is impossible here because ownership entails control, and control dictates accessibility conditions. Any pair constructed similarly will likely collapse into a difference in reliability or accessibility, showing that non-functional features cannot independently sway the verdict if the criteria are strictly functional.

  A defender of extended cognition might reply that the criteria require not just current access, but a stable history of coupling. They would add a condition requiring long-term dispositional integration, denying the intuition that the leased server is excluded merely due to ownership. This adds a temporal condition to the criteria. However, the cases force the conclusion that the advertised criteria (availability, accessibility, endorsement) are insufficient without clarifying the nature of 'availability.' They merely invite the intuition that social context matters. Ultimately, the cases show that unless 'accessibility' includes normative stability, the criteria fail to distinguish the cases; if it does include stability, the functional identity requirement is violated. The verdicts are invited by social intuition but forced only by hidden functional constraints.
