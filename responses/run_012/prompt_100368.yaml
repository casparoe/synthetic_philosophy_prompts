prompt: |-
  I listen to this history-of-ideas podcast and the host did an episode on Marx and technology that I keep chewing on, but I don't know enough Marx to trust it. Can you audit it for me?

  His summary went roughly like this. Marx was a nineteenth-century radical, so he was against industrial machinery: it deskilled workers and degraded them, and that's why he was on the side of the machine-breakers in spirit. He expected automation to keep grinding wages down until the working class had literally nothing left to lose, and that is what made revolution inevitable. The one twist the host got excited about is that in some notebooks Marx never published — he said it was the Grundrisse or something like that — Marx sounds like a techno-optimist: once machinery has stored up all of society's knowledge, living labor stops being the source of wealth, so capitalism's whole foundation in labor time just collapses on its own, no politics required. The host's takeaway was that Marx was torn between a romantic hatred of machines and a faith that machines would abolish capitalism for us, and that the optimistic half is the part that aged well.

  So: which of his sentences would a good Marx scholar accept, which would make them wince, and which are just wrong? I'm especially curious whether the "machines abolish capitalism by themselves" bit is something Marx actually said or the host's embellishment, and whether the unpublished-notebook stuff changes the picture or is basically a red herring. And does his final conclusion about which half aged well survive the corrections, or does it fall apart once the summary is fixed?

  Keep it under 400 words. Bullets are fine. American English, please.
