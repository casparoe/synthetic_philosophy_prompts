  **Candidate Rule 2: Descriptive Granularity (The "Description" Rule).**
  *   *Principle:* Inevitability attaches to *macro-states* or *systemic terminations*. Contingency attaches to *micro-events*, *specific coordinates* (time/place), or *instantiations*. Her mannerism ("Under what description?") is the key clue here. She treats specificity as a marker of contingency.
