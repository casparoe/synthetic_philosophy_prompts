  A student asked a theologian, "Is it ever permissible to speak a falsehood?" "Yes," said the theologian, "if you tell a joke, for there is no intent to deceive." "So if a murderer asks where my friend hides, may I joke that he is in the well?" "Only if the murderer knows you jest," said the theologian. "But then he will not believe me," said the student. "Precisely," said the theologian. "You may only speak falsely without sin when it is of no use." "So what do I do when it is of use?" "You remain silent." "And if my friend dies?" "Then," said the theologian, "you have not lied."

  The comedy arises from the tension between the joke exemption, which allows falsehoods only when they are understood as such and therefore ineffective, and the absolutist ban on benevolent deception, which forbids effective falsehoods in extremities. The punchline hinges on the distinction between speaking falsely and remaining silent, showing that the speaker can preserve the integrity of their own definition of lying even when silence leads to catastrophe.
