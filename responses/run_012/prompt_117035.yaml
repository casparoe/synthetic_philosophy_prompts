answer: |-
  # Joint Statement of Adversarial Collaboration on Causal Theory

  ## 1. Shared Commitments

  We, the undersigned, represent two distinct traditions in the philosophy of causation: the Counterfactualist tradition (descending from David Lewis) and the Interventionist tradition (descending from James Woodward and Judea Pearl). Despite our disagreements, we affirm the following shared commitments:

  1.  **Rejection of Regularity:** We agree that causation cannot be reduced to mere constant conjunction or Humean regularity. Correlation is not causation.
  2.  **Dependence:** We agree that causation involves some form of dependence. Effects depend on their causes in a way that non-effects do not.
  3.  **Formalism:** We agree that possible worlds semantics and structural equation models (SEMs) are often translatable into one another for simple cases. Both formalisms are useful tools for clarifying causal structure.
  4.  **Settled Cases:** We agree on the causal verdicts in simple, single-cause scenarios (e.g., a stone striking a window causes it to break) and in standard common-cause scenarios (e.g., a barometer falling does not cause a storm, though both depend on pressure).
  5.  **Purpose:** We agree that a theory of causation must distinguish causal relationships from non-causal dependencies to support reasoning about explanation, prediction, and responsibility.

  ## 2. Areas of Disagreement

  ### Disagreement 1: The Relativity of Causal Claims (The Data Center Case)

  **Counterfactualist:** Causation is a relation between events that obtains independently of how we choose to describe those events. While pragmatic factors influence which causes we *mention*, the causal relation itself is absolute. If event $c$ causes event $e$, it does so regardless of whether our model lumps variables together or splits them apart.

  **Interventionist:** Causal claims are always relative to a causal model containing a specific set of variables. There is no "view from nowhere." To ask if $A$ causes $B$ is to ask if an intervention on $A$ changes $B$ within a model where $A$ and $B$ are distinct variables. Lumping variables together changes the model, and thus changes the truth conditions of the causal claim. This relativity is not a defect; it reflects that causal claims are made at a chosen level of description for specific explanatory purposes.

  **The Crux:** The Data Center Case. A data center rack is powered by two feeds (A and B) from different substations. Either feed alone is sufficient to keep the rack running. Both feeds are live; the rack stays up. An engineer could have tripped the breaker but did not.
  *   **Question 1:** Are Feed A and Feed B causes of the rack staying up?
  *   **Question 2:** Does the verdict change if we model "Power Supply" as a single variable rather than two distinct feeds?
  *   **Question 3:** Is the Engineer's omission a cause?

  **Diagnostic Note:** We agree this case separates us. It tests whether causal verdicts shift with variable granularity (Interventionist) or remain fixed to events (Counterfactualist).

  ### Disagreement 2: Invariance vs. Counterfactual Dependence

  **Counterfactualist:** Causation is established by counterfactual dependence. If $c$ had not occurred, $e$ would not have occurred (perhaps via a chain of dependencies). We rely on similarity relations between possible worlds to evaluate these counterfactuals. Accidental regularities do not sustain counterfactuals; laws do.

  **Interventionist:** Counterfactual dependence is insufficient. A relationship is causal only if it is *invariant* under a range of interventions. A relationship might hold counterfactually in one specific scenario but fail to support manipulation across a range of background conditions. Causation requires stability, not just dependence in the actual world.

  **The Crux:** The Flicker Case. A switch is connected to a lightbulb by a wire that is currently intact. The light is on. If the switch were off, the light would be off. However, the wire is frayed and would have broken had the switch been flipped a millisecond later.
  *   **Question:** Is the switch position a cause of the light being on *now*?
  *   **Evidence:** We agree the verdict turns on whether the fragility of the wire (lack of invariance) negates the causal claim, or whether the actual counterfactual dependence suffices.

  ### Disagreement 3: Omissions and Absences

  **Counterfactualist:** Omissions can be genuine causes. If the engineer had tripped the breaker, the rack would have gone down. Therefore, her not tripping it is a cause of the rack staying up. We acknowledge the problem of "too many causes" (e.g., the Queen of England also did not trip the breaker) but maintain this is a pragmatic problem of salience, not a metaphysical problem of causation.

  **Interventionist:** Omissions are causes only relative to a model that includes a variable for the omission. There are indefinitely many absences, but only those represented as variables with defined intervention conditions count as causes. This solves the "too many causes" problem metaphysically, not just pragmatically. If the model does not contain an "Engineer Action" variable, her inaction is not a cause.

  **The Crux:** The Engineer Case (within the Data Center scenario).
  *   **Question:** Is the Engineer's failure to trip the breaker a cause of the rack staying up?
  *   **Evidence:** We agree the verdict turns on whether the absence of an action can be a cause *simpliciter* (Counterfactualist) or only relative to model inclusion (Interventionist).

  ### Disagreement 4: Transitivity

  **Counterfactualist:** Causation is transitive. If $c$ causes $d$ and $d$ causes $e$, then $c$ causes $e$. Counterfactual *dependence* is not transitive, but causation is defined as the ancestral of counterfactual dependence (a chain of dependencies). This preserves the intuition that causes are responsible for downstream effects.

  **Interventionist:** Causation is not essentially transitive. Whether $c$ causes $e$ depends on the structural path between them. Intermediate variables may screen off the influence, or the relationship may depend on specific values of variables (non-linearity). Transitivity holds only in specific structural configurations, not as a general principle.

  **The Crux:** The Railroad Switch Case. A train is headed for a destination. A switch diverts it from Track A to Track B. Both tracks lead to the same destination.
  *   **Question:** Did the switching cause the arrival?
  *   **Evidence:** We agree the verdict turns on whether the chain (Switch -> Track B -> Arrival) mandates transitivity (Counterfactualist) or whether the invariance of arrival under switch changes (if both tracks lead there) negates causation (Interventionist).

  ## 3. Disagreements Table

  | Crux | Counterfactualist Prediction | Interventionist Prediction |
  | :--- | :--- | :--- |
  | **Data Center: Feed A & B**<br>(Symmetric Overdetermination) | **Neither is a cause.**<br>Since either feed is sufficient, if A were absent, the rack would still be up (due to B). No counterfactual dependence exists. | **Both are causes.**<br>Relative to a model with variables $A$, $B$, and $Rack$: An intervention setting $A=0$ (while holding $B=1$) results in $Rack=0$. |
  | **Data Center: Variable Lumping**<br>(One "Power" variable vs. Two) | **Verdict does not change.**<br>The events are what they are. Lumping variables changes description, not the causal relation between events. | **Verdict changes.**<br>If modeled as one variable ($Power$), $Power$ is a cause. If modeled as two ($A, B$), both are causes. Causal claims are relative to the model. |
  | **Data Center: Engineer Omission** | **Yes, it is a cause.**<br>If the engineer had tripped the breaker, the rack would have gone down. The absence sustains the counterfactual. | **Conditional.**<br>It is a cause only if the model includes a variable for "Engineer Action." If the model excludes it, it is not a cause relative to that model. |
  | **Invariance (Flicker Case)** | **Yes, it is a cause.**<br>The actual counterfactual holds: if switch off, light off. The fragility of the wire is a separate issue. | **No (or Qualified).**<br>The relationship is not invariant under interventions on the wire's integrity. It fails the stability test for causation. |
  | **Transitivity (Railroad Switch)** | **Yes, transitive.**<br>Switch causes Train on Track B; Track B causes Arrival. Therefore, Switch causes Arrival. | **No, not transitive.**<br>Intervention on Switch does not change Arrival (since both tracks lead there). No causal relationship exists between Switch and Arrival. |

  ## 4. Diagnostic Notes on the Nature of the Dispute

  **1. Verbal vs. Substantive:**
  We acknowledge that some portion of our dispute regarding **Omissions** is verbal. When the Counterfactualist says "The Engineer's inaction is a cause," and the Interventionist says "It is not a cause (relative to this model)," we are often agreeing on the underlying physics and counterfactuals but disagreeing on the linguistic rule for applying the word "cause." The Counterfactualist treats "cause" as a broad metaphysical category; the Interventionist treats "cause" as a technical term indexed to a modeling framework.

  **2. Teleological Divergence:**
  The deeper dispute is about **what a theory of causation is for**.
  *   The **Counterfactualist** aims to provide a metaphysical analysis of the causal relation itself. The theory must track mind-independent connections between events. Relativity to variables is seen as a defect because the world does not come pre-divided into variables.
  *   The **Interventionist** aims to provide a framework for causal explanation and manipulation. The theory must serve agents who need to know what happens if they intervene. Relativity to variables is a feature because agents always operate at a specific level of description.

  **3. The Data Center Variable Question:**
  Regarding the specific question of lumping the feeds: The Counterfactualist insists that if Feed A and Feed B are distinct events, their causal status must be fixed. The Interventionist insists that if the explanatory context treats "Power Supply" as a unit, then asking about Feed A specifically is ill-posed until the model is refined. We agree this is the central fault line: **Is causation absolute (Counterfactualist) or perspectival (Interventionist)?**

  **4. Transitivity:**
  We agree this is a real fault line, not merely verbal. The Counterfactualist defends transitivity to preserve the intuition that causes are responsible for distant effects. The Interventionist rejects transitivity to preserve the intuition that causes must make a difference to the effect. In switching cases, these intuitions clash. We record our divergent predictions in the table above and agree that future work must determine which intuition better serves scientific and legal practice.

  **Signed,**

  *The Counterfactualist*  
  *The Interventionist*
