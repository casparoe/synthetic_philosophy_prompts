answer: |-
  # Joint Statement on Demarcation and Confirmation

  **1. Agreed Claims**

  1.  **Verbal vs. Substantive Scope:** We agree that part of our dispute is verbal. The Popperian addresses a *normative* question: "What ought we to treat as knowledge-producing to avoid dogmatism?" The Bayesian addresses a *descriptive/functional* question: "What methods actually reliably update credence toward truth?" We will not talk past each other on this distinction.
  2.  **Origins and Function:** The demarcation problem arose from logical positivism's attempt to purge metaphysics. We agree any criterion must guide resource allocation and trust, not merely classify sentences. Both of us accept that clear cases exist (e.g., controlled agronomy is scientific; crystal healing is not), though we disagree on the boundary cases.
  3.  **Limitations of Own Criteria:** The Popperian admits falsifiability does not guarantee truth, only testability. The Bayesian admits that without constrained priors, any data can be made to support any hypothesis. Neither criterion delivers a algorithmic decision procedure for every case.
  4.  **The Unit of Demarcation:** We both accept that the *research program* is a more practical unit than the individual theory. However, the Popperian signs this only if the program has a track record of letting hypotheses *die*. The Bayesian signs only if the track record demonstrates reliable *updating*. The Popperian worries this view excuses ad hoc saves within a program; the Bayesian worries it ignores current posterior probabilities.
  5.  **Case Selection:** We agree to evaluate our criteria using **Case A** (a unifying framework retrodicting known anomalies with no new testable predictions) and **Case B** (a program making one sharp, risky novel prediction that explains little else). We agree these cases stress our respective criteria in opposite ways.

  **2. Disagreements Table**

  | Crux | Popperian's Prediction & Principle | Bayesian's Prediction & Principle | Agreed Outcome Condition |
  | :--- | :--- | :--- | :--- |
  | **1. Locus of Falsifiability**<br>*(Is it logical form or community behavior?)* | **Principle:** "Science is a logical relation between theory and observation, not a sociological habit."<br>**Case B Prediction:** Case B is **Scientific**. It forbids states of affairs. The lack of unification is irrelevant; riskiness is the sole metric. | **Principle:** "Science is a community process that raises posterior probabilities; logical form is inert without priors."<br>**Case B Prediction:** Case B is **Scientific only if accepted**. A single prediction changes little if the prior is low. It lacks the unifying power that drives reliable updating. | If Case B is accepted despite explaining nothing else, Popper wins. If it is rejected as trivial despite passing the test, Bayesian wins. |
  | **2. Novelty vs. Accommodation**<br>*(Does retrodiction count as evidence?)* | **Principle:** "Accommodation is ad hoc. Only novel prediction demonstrates courage to be wrong."<br>**Case A Prediction:** Case A is **Non-Scientific**. It forbids nothing new. Retrodicting known data is compatible with any flexible framework. | **Principle:** "Logic of confirmation is timeless. Accommodation carries equal weight to prediction if the likelihood ratio is high."<br>**Case A Prediction:** Case A is **Scientific**. Unifying diverse anomalies drastically raises the posterior, regardless of when the data was found. | If Case A is funded/trusted solely on retrodiction, Bayesian wins. If it is dismissed as metaphysics until new risks are found, Popper wins. |

  **3. Note on the Research Program Criterion**

  Regarding the proposal that a program counts as scientific if it has a track record of generating hypotheses that get tested and sometimes die: The Popperian signs this with the caveat that "sometimes die" must be strict; if the program immunizes its core against refutation, it is pseudoscience regardless of peripheral testing. The Bayesian signs this with the caveat that "tested" must mean "updated credence"; if the community tests but ignores the results (fails to update), the program is scientifically inert. We agree this criterion bridges our views but fails to resolve the status of Case A (which has no new tests) or Case B (which has no track record yet).
