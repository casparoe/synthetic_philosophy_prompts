answer: |-
  This is a classic caregiving trap: the logistics of care collide with decades of sibling history, and suddenly you aren't arguing about weekends; you're arguing about who is the "better" child.

  Your partner is playing the role of the "reality check." She isn't necessarily saying you're wrong to be frustrated; she's saying you're on shaky ground if you approach this from a position of moral superiority.

  Here is the breakdown of your entitlement, what you owe your brother, and how to fix the actual problem.

  ### 1. Are you entitled to go at him?
  **Yes, but not for the reasons you think.**

  You are entitled to expect reliability. If you made an agreement to split care, and he repeatedly breaks it, that is a logistical failure that impacts your life and your dad's stability. You are allowed to hold him to a commitment.

  **However,** you are **not** entitled to moral high ground.
  Your partner's points sting because they contain truth, even if they are technically logical fallacies regarding the current situation:
  *   **The Past:** Your history of vanishing doesn't give him a pass to flake now, *but* it does mean you can't frame this as "I am the responsible one and you are the irresponsible one." You are both adults who have struggled with this responsibility at different times.
  *   **The Proximity:** Helping because you are close is practical, not virtuous. Acknowledging this removes the resentment that you are "sacrificing" more than he is.
  *   **The Brother-in-Law:** This highlights a double standard. It suggests you have a high tolerance for flakiness in people you don't live with or feel less responsible for. It doesn't mean you *must* tolerate it in your brother, but it asks you to examine why you tolerate it elsewhere.

  **Verdict:** You are entitled to address the broken agreement. You are not entitled to shame him for it while ignoring your own history and advantages.

  ### 2. What do you owe him first?
  Before you have the conversation that fixes the schedule, you owe him three things to lower the temperature:

  **A. Ownership of the Past**
  If you go in angry, he will go defensive. His defense will likely be, *"Where were you ten years ago?"*
  Disarm him immediately. Start the conversation by saying: *"I know I wasn't around to help Dad years ago. I regret that. I'm here now because I want to make up for it, not because I'm trying to win a 'Good Child' award."*
  This takes the weapon out of his hand.

  **B. Curiosity About the "Forgetting"**
  People rarely "forget" caregiving shifts unless they are overwhelmed, in denial, or avoiding the emotional toll of seeing a parent decline.
  Instead of *"You forgot again,"* try *"This is the third weekend in a row. Is this schedule too much for you? Is something else going on?"*
  If he is burning out, hammering him on reliability will just make him quit entirely.

  **C. Acknowledgement of Privilege**
  Acknowledge your partner's point about proximity. *"I know I'm only able to do this easily because I moved back. I know that gives me an advantage I didn't have before."*
  This frames you as a team trying to solve a puzzle, rather than a warden inspecting a prisoner.

  ### 3. What are you actually entitled to do?
  Once you've cleared the air, you are entitled to demand a **functional system**, not just an apology. "Forgetting" is a system failure.

  *   **Move from Verbal to Written:** If you are relying on memory or texts, stop. Put it on a shared digital calendar with reminders 24 hours before.
  *   **The "No-Show" Protocol:** Agree on a rule now. *"If you can't make it, you need to find the backup (me or a paid carer) by 10 AM. If you don't, I will cover it, but we need to discuss how you reimburse me or take an extra shift next week."*
  *   **Renegotiate the Split:** Maybe weekends are the problem. Can he do weekday evenings? Can he handle all the medical appointments and finances while you handle the physical presence? Play to strengths, not just time blocks.
  *   **The Exit Clause:** If he genuinely cannot do it, you are entitled to stop covering for him indefinitely. You can say, *"I can cover this weekend, but I can't keep doing your shifts. If you can't do Saturdays, we need to hire someone for Saturdays and split the cost."*

  ### Summary
  Your partner is right that your history complicates your *tone*, but she is wrong if she thinks it invalidates your *boundaries*.

  You don't have to shut up. But you do need to change *how* you speak.
  *   **Don't say:** "You're so unreliable, it's just like old times."
  *   **Do say:** "I want to be here for Dad, but I can't do it alone. The current plan isn't working. Let's figure out a plan you can actually stick to, or let's pay for help."

  If you approach him as a collaborator who owns their own past flaws, you're much more likely to get a reliable brother. If you approach him as a judge, you're likely to get a rebellion.
