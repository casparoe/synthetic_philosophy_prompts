answer: |-
  **Adjudication of Panel Exchange**

  **Move 1: The Curator (Opening)**
  **Rating:** Mostly Right
  **Justification:** The curator correctly identifies the museum's primary ethical duty: public trust relies on the institution not asserting propositions it knows to be unsupported. A public museum is not a private shrine; it makes claims to knowledge. However, the move is not *clearly* right because it premises 'knowledge' too heavily on the surviving written archive, assuming that what is absent from the logbook is absent from history. It conflates 'documentary silence' with 'factual falsehood'.

  **Move 2: The Historian (Reply)**
  **Rating:** Mostly Right
  **Justification:** The historian is correct to challenge the neutrality of the archive. Parish registers and harbour logs are administrative tools, not omniscient records; they systematically undercount the marginalised, the poor, and the transient. To treat them as the 'final court of appeal' is indeed to mistake the state's filing system for the past. However, the historian risks romanticising oral memory. While archives are partial, memory is malleable; dismissing documentary evidence entirely opens the door to myth-making without sufficient guardrails.

  **Move 3: The Curator (Rebuttal)**
  **Rating:** Clearly Right
  **Justification:** This is the strongest ethical intervention in the exchange. The curator correctly notes that 'partiality' is not a licence for 'falsehood'. If a memory contradicts the archive, there must be a positive reason to prefer the memory (corroboration, plausibility), otherwise 'comfort' becomes the sole criterion for truth. The slippery slope argument regarding lynchings and stolen fortunes is valid: without an external standard of verification, communal memory can sanitise injustice as easily as it can honour heroism.

  **Move 4: The Historian (Counter)**
  **Rating:** Partially Right
  **Justification:** The distinction between 'commemorative memory' (keeping faith) and 'load-bearing memory' (claiming rights or fixing blame) is philosophically useful. It correctly identifies that a eulogy operates under different rules than a court testimony. However, the concession undermines the historian's earlier stance. By admitting that load-bearing claims *are* answerable to documents, the historian accepts the curator's framework for any memory that has material consequences, leaving only a narrow lane for 'pure' commemoration.

  **Move 5: The Curator (Closing)**
  **Rating:** Clearly Right
  **Justification:** The curator identifies the fatal flaw in the historian's compromise. A distinction that relies on the community to self-identify whether their memory is 'commemorative' or 'load-bearing' is unenforceable. As the curator notes, the same town will claim the memory is sacred (commemorative) when challenged on accuracy, and binding (load-bearing) when seeking funding or status. A test applied by the tested party is no test at all.

  ***

  **Overall Position**

  The **Curator** holds the stronger overall position, specifically regarding the governance of a public institution. While the Historian offers a superior epistemological critique of the archive, the Curator provides the necessary procedural safeguards for public truth-telling. In a museum context, the duty to avoid asserting known falsehoods outweighs the duty to validate local identity, particularly when that identity relies on the exclusion of documentary evidence. The Curator's final point regarding the policing of the 'load-bearing' distinction is decisive; without an external arbiter, the historian's compromise collapses into relativism.

  ***

  **What Both Are Missing**

  **1. Meeting the Objection to the Load-Bearing Distinction**
  The Curator's objection that the town cannot police its own distinctions is valid, but it is not insurmountable. The distinction can be met if the arbitration is removed from the local community and placed within the **professional historiographical community**. It is not for the town to decide if a memory is load-bearing; it is for peer review to determine if a claim has material implications. If the story of the woman saving the town is used to sell tickets or define civic virtue, it has become load-bearing by default, regardless of the town's intent. The museum could adjudicate this by subjecting the oral tradition to the same source criticism as the documents: is there corroborating oral testimony from other lineages? Is the physics of the rescue plausible? The gap is not between memory and documents, but between *verified* and *unverified* claims, regardless of their source.

  **2. The Nature of the Documents**
  Both panelists treat the documents somewhat reductively. The Curator initially treats them as neutral records of fact, while the Historian treats them merely as instruments of state interest. Both miss that documents are themselves **artefacts of memory**. A harbourmaster's log is not just a list of ships; it is a record of what the harbourmaster deemed economically or legally significant. The missing piece is a third category of evidence: **material culture and demographics**.
  *   Does the archaeological record show a spike in burials for that period?
  *   Does the census data show a demographic gap in the town's population following the wreck?
  *   Does the logbook show a gap in shipping traffic that suggests a wider disaster than recorded?

  By framing the debate as 'Memory vs. Documents', both ignore that the documents are merely one type of fossilised memory. A rigorous museum display would not choose between the logbook and the plaque, but would display the *discrepancy* itself. It would state: 'The logbook records X; local tradition records Y. The archive often misses the poor; memory often inflates the heroic. Here is what we know, and here is what we cannot know.' This satisfies the Curator's demand for honesty about uncertainty and the Historian's demand to acknowledge archival silence.
