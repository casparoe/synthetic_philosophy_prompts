answer: |-
  **Planning Note**
  **Legal Moralism:** Society is a community of ideas, not just interests; the law preserves the shared ethical fabric constitutive of collective identity. Strongest objection: Risks enforcing prejudice as truth and stifling moral progress.
  **Harm Principle:** Liberty is the default; state coercion requires demonstrable setback to interests of others. Strongest objection: Fails to condemn victimless atrocities (e.g., private torture) or account for collective decay.
  **Sharpest Clashes:** Moralist asks how Harm Advocate prohibits cruelty without moral judgment; Harm Advocate asks how Moralist distinguishes morality from mere disgust.

  ***

  **Elias:** We are not merely regulating safety here. This bill concerns the preparation of flesh grown from one's own cells for consumption. No donor is killed, no health risk is proven, yet the act strikes at the core of what it means to be human within this community. The law must prohibit it because it is inherently degrading. A society that permits its members to treat human tissue as mere sustenance erodes the shared morality that sustains mutual respect.

  **Sarah:** You argue from disgust, not danger. If no person is harmed, no rights violated, and no coercion used, the criminal law has no standing. You claim this erodes respect, but that is speculative. The harm principle demands we distinguish between what is offensive and what is injurious. To punish private conduct because it shocks the sensibilities of the majority is to grant the state a license over the soul.

  **Elias:** You reduce morality to preference. But morality is not just what people feel; it is the bond of social cohesion. If we allow the definition of humanity to become plastic in private, the public meaning collapses. When the community defines itself by human dignity, violating that dignity—even privately—damages the collective integrity. Is the law merely a traffic cop, or does it express who we are?

  **Sarah:** It expresses who we are by protecting our liberty to define ourselves. But let me press you on your central term. When you say "shared morality," do you mean the positive morality of the current majority, or an objective moral truth? If the majority tomorrow decides that political dissent is degrading, does your principle empower the state to criminalize speech?

  **Elias:** A fair challenge. I do not mean mere majority whim. I refer to the fundamental constitutive values that hold the community together over time. These are stable, unlike passing prejudices. When the community is divided, the law should reflect the deep structure of our ethical life, not transient anxieties. If morality shifts, the law shifts, but slowly, like a constitution.

  **Sarah:** But who interprets this "deep structure"? In practice, it is always the majority imposing its will on the minority. Consider historical prohibitions on intimate relationships between consenting adults. Those were defended as protecting social cohesion. You rely on a distinction between "prejudice" and "morality" that the legislature cannot reliably make.

  **Elias:** And you rely on a distinction between "harm" and "offense" that is equally porous. Let us turn to your central term. You say harm to others is the only ground. What counts as harm? Does diffuse harm to the moral environment count? If a society becomes accustomed to degradation, does that not injure everyone by lowering the threshold of acceptable conduct?

  **Sarah:** I concede that a toxic social environment can harm individuals by increasing insecurity or reducing trust. But that must be demonstrated, not assumed. Mere disgust is not a setback to interests. However, I will grant you this: I must explain conduct like cruelty to animals. If I burn a cat in private, I harm no human directly. Yet most agree this should be criminal.

  **Elias:** Precisely. Why? If not because it is morally wrong?

  **Sarah:** Because it cultivates a vicious character in the agent that creates a high risk of future harm to humans. It is an inchoate offense against persons, based on empirical likelihood, not intrinsic wrongness. We punish the danger, not the sin.

  **Elias:** That is a thin reed. What if the agent is psychologically immune to such spillover? What if we know with certainty they will never harm a human? Your principle would require us to let them burn the cat. My principle prohibits it because it is an abuse of power over a sentient being, violating the moral order.

  **Sarah:** Perhaps. But your principle risks stagnation. If the law freezes the current moral consensus, how do we progress? If we had criminalized every act that violated the morality of the past, we would still punish interfaith marriage. You must explain how your view allows for moral improvement if deviation is criminalized.

  **Elias:** Moral improvement comes from debate, not from license to violate core taboos. There is a difference between challenging unjust laws and dissolving the boundaries of humanity. This bill is not about progress; it is about preventing the commodification of the self. But I ask you: if you deny harm to the moral environment, can you explain why we prohibit the sale of citizenship or the buying of babies? There is no physical injury there, only a violation of shared value.

  **Sarah:** In those cases, the institutions themselves are harmed. Selling citizenship undermines the political community's integrity, which is a public good. Buying babies treats persons as property, violating their future autonomy. These are structural harms to social institutions that protect individuals. Your view protects morality for its own sake; mine protects the conditions necessary for individual liberty.

  **Elias:** But those conditions *are* moral. You cannot separate the two. You simply hide your moral judgments behind the language of harm.

  **Sarah:** And you hide your coercion behind the language of community. We agree that society needs boundaries. We disagree on whether the boundary is drawn at the skin of the neighbor or the edge of the conscience.

  **Elias:** Then let us be clear on the crux. I maintain that the community has a right to survive as a moral entity, not just a physical one. I concede that not every moral wrong should be a crime, only those striking at the root of our shared identity.

  **Sarah:** And I maintain that liberty is the default and harm must be tangible. I concede that "harm" includes damage to the social institutions that secure our freedom, but I deny that mere moral offense qualifies.

  **Elias:** The crux is whether the law is a guardian of the soul or a referee of interests. I have conceded that morality must be deep, not transient.

  **Sarah:** The crux is whether liberty yields to collective identity. I have conceded that institutional integrity counts as harm, but not private vice.
