answer: |-
  Here is the translation of the Pragmatist dispute into your statistical vocabulary, followed by the residue report.

  ### I. The Translations

  #### 1. Peirce: Truth as Asymptotic Consensus
  **The Claim:** Truth is the limit of inquiry.
  **The Translation:** Truth is the almost-sure limit of a posterior sequence under a consistent learning rule, conditional on the existence of a data-generating process that renders the model class identifiable.

  Let $\mathcal{M} = \{P_\theta : \theta \in \Theta\}$ be the model class. Let $X_{1:\infty}$ be a sequence of observations generated by a distribution $P^*$. Let $\pi_0$ be a prior over $\Theta$. Let $\pi_n$ be the posterior after $n$ observations.

  Peirce's claim translates to two conjoined statistical assertions:
  1.  **Merging of Opinions:** For any two priors $\pi_0^{(1)}, \pi_0^{(2)}$ that assign non-zero mass to the neighborhood of the truth, the posteriors merge in total variation distance:
      $$ \lim_{n \to \infty} \| \pi_n^{(1)} - \pi_n^{(2)} \|_{TV} = 0 \quad P^*\text{-almost surely}. $$
  2.  **Consistency:** The posterior mass concentrates on the parameter $\theta^*$ corresponding to $P^*$ (or the projection of $P^*$ onto $\mathcal{M}$ if misspecified):
      $$ \pi_n(\{\theta : D_{KL}(P^* \| P_\theta) < \epsilon\}) \to 1 \quad P^*\text{-almost surely}. $$

  **The "Fated" Opinion:** The limit distribution $P_\infty = \lim_{n \to \infty} E_{\pi_n}[P_\theta]$. Peirce identifies $P_\infty$ with "The Truth."
  **Required Assumptions (Smuggled):**
  *   **Identifiability:** Distinct $\theta$ must imply distinct predictive distributions. Without this, the posterior converges to an equivalence class, not a unique point.
  *   **Realizability (or well-behaved misspecification):** Peirce assumes the limit *is* the truth. In your vocabulary, if $P^* \notin \mathcal{M}$, the estimator converges to $\theta_{KL} = \text{argmin}_\theta D_{KL}(P^* \| P_\theta)$. Peirce's vocabulary treats $\theta_{KL}$ as "The Truth," whereas your vocabulary treats it as "The Best Approximation."
  *   **Common Method:** The investigators must share the same likelihood function (learning rule). Peirce assumes the "scientific method" fixes this; statistics requires you to specify it exogenously.

  #### 2. James: Truth as Expediency
  **The Claim:** Truth is what pays off in the way of belief.
  **The Translation:** Truth is a property of a belief state $Q$ relative to a loss function $L$ and a decision problem, defined by the optimality of the actions derived from $Q$.

  Let $\mathcal{A}$ be a space of actions. Let $L: \mathcal{A} \times \Omega \to \mathbb{R}$ be a loss function. Let $Q$ be a belief (distribution over $\Omega$).
  An agent acting on $Q$ chooses $a_Q = \text{argmin}_a E_Q[L(a, \omega)]$.

  James's claim translates to:
  A belief $Q$ is "true" if the sequence of actions $\{a_{Q,n}\}$ derived from holding $Q$ yields a cumulative utility that dominates alternative belief states over the relevant time horizon.
  $$ \text{Truth}(Q) \iff E_{P^*} \left[ \sum_{n=1}^T L(a_{Q,n}, \omega_n) \right] \leq E_{P^*} \left[ \sum_{n=1}^T L(a_{Q',n}, \omega_n) \right] \quad \forall Q' \neq Q. $$

  **The "Payoff":** Minimization of expected loss (or maximization of expected utility).
  **Required Assumptions (Smuggled):**
  *   **Fixed Loss Function:** To evaluate "payoff," $L$ must be specified. James implies $L$ is fluid (dependent on human needs), but the statistical criterion requires $L$ to be fixed to compute the expectation.
  *   **Access to $P^*$:** To verify that $Q$ *actually* paid off (rather than just seeming to), you need to evaluate expectations under the true distribution $P^*$. James wants to avoid referencing $P^*$ directly, but the statistical translation requires it to distinguish "lucky" from "true."
  *   **Time Horizon:** James speaks of "in the course of experience." Statistics distinguishes between asymptotic admissibility and finite-sample dominance. James's definition is unstable if the horizon $T$ shifts.

  ---

  ### II. The Residue Report

  Here is what fails to map, categorized by whether it exposes a defect in your statistical vocabulary or a vagueness in the Pragmatist claims.

  #### 1. The Anchor Problem (Peirce)
  **The Residue:** Peirce defines truth *as* the limit. Statistics defines convergence *toward* a truth.
  To state the consistency theorem ($\pi_n \to \delta_{\theta^*}$), you must condition on $P^*$. You cannot define $P^*$ as "whatever $\pi_n$ converges to" without circularity, because $\pi_n$ might converge to the wrong thing (e.g., if the model is non-identifiable or the prior is dogmatic).
  *   **Analysis:** This is a defect in Peirce's slogan, not your vocabulary. Peirce wants the limit to *constitute* the truth, but mathematically, the limit is only truth-like if the data-generating process is already assumed to be "truthful" (i.e., stable and informative). Your vocabulary correctly demands an external anchor ($P^*$) to define consistency. Peirce tries to bootstrap the anchor from the process itself.
  *   **Verdict:** Peirce's claim is doing less work than it suggests; it hides the assumption of a well-behaved reality.

  #### 2. Structure vs. Prediction (Peirce)
  **The Residue:** Statistical convergence theorems (like Blackwell-Dubins) guarantee convergence of *predictive distributions* (observables), not necessarily *parameters* (unobservables).
  If your model is unidentifiable (e.g., latent variables, causal structure), different $\theta$ yield the same $P(X)$. Your posterior will not converge to a single $\theta$, but to an equivalence class. Peirce's "opinion" implies a settlement on *facts*, including structural facts (e.g., "germs cause disease," not just "sickness clusters").
  *   **Analysis:** Your vocabulary captures this gap precisely (identifiability). Peirce's vocabulary glosses over it. He assumes that if predictions settle, the underlying explanation settles.
  *   **Verdict:** Defect in Peirce's story. There is no theorem that guarantees convergence of unobservable structure without strong inductive biases (priors) that Peirce treats as methodological givens.

  #### 3. The Mutable Loss Function (James)
  **The Residue:** James wants truth to be mutable because human interests change. In your vocabulary, if the loss function $L$ changes to $L'$, the optimal action $a^*$ changes, and the "true" belief $Q$ might change (e.g., in value-of-information contexts).
  However, to *state* James's criterion statistically, you must freeze $L$ to evaluate the expectation. You cannot say "$Q$ is true because it maximizes utility" without specifying *which* utility function.
  *   **Analysis:** This is a smuggling cost. To make James rigorous, you must fix the goal. But James's point is that the goal is part of the truth-making process.
  *   **Verdict:** Defect in your vocabulary *for this specific purpose*. Standard decision theory treats the loss function as exogenous. James treats it as endogenous to the "living" experience. To capture James, you need a meta-objective function over loss functions, which leads to infinite regress or requires a normative axiom outside the statistical frame.

  #### 4. The Normative Gap (Both)
  **The Residue:** You noted this: Calibration and proper scoring rules are properties, not obligations.
  *   **Peirce:** Says you *ought* to use the scientific method because it leads to truth.
  *   **James:** Says you *ought* to believe what works.
  *   **Statistics:** Says *if* you update via Bayes, *then* you are calibrated (asymptotically). It does not say you *ought* to update via Bayes, except via Dutch Book arguments (which rely on coherence axioms, not empirical truth).
  *   **Analysis:** There is no statistical theorem that yields an "ought." You can prove that Estimator A has lower risk than Estimator B. But to move from "A has lower risk" to "You ought to use A," you need the normative premise "You ought to minimize risk."
  *   **Verdict:** Defect in the statistical vocabulary regarding normativity. Statistics is descriptive of the estimator's performance relative to a goal. Pragmatism is prescriptive about the goal itself. James tries to derive the "ought" from the "is" of satisfaction; your vocabulary correctly identifies this as a category error unless you posit "Maximize Utility" as an axiom.

  #### 5. The Volitional Gap (James)
  **The Residue:** James's "Will to Believe" allows adopting a hypothesis *without* evidence if it is "live, forced, and momentous" and leads to better outcomes (e.g., believing you can jump the chasm helps you jump it).
  In your vocabulary, this looks like setting a prior $P(H) = 1$ based on utility rather than evidence.
  *   **Conflict:** This violates Bayesian coherence. If you set priors based on utility, you are no longer minimizing log-loss (calibration); you are optimizing a different objective. You can model this as a modified loss function $L'(Q, \omega) = L(Q, \omega) - \lambda \cdot \text{Utility}(Q)$, but then $Q$ is no longer a "belief" in the probabilistic sense; it is a "distorted belief" or a policy.
  *   **Verdict:** Evidence that James's claim is not about *truth* in the correspondence or coherence sense, but about *policy optimization*. Your vocabulary forces a distinction between "Belief" (distribution minimizing log-loss) and "Policy" (distribution minimizing decision-loss). James collapses them. The residue is the cost of keeping them distinct.

  ### Summary of Residue

  | Component | Status in Translation | Verdict |
  | :--- | :--- | :--- |
  | **Peirce's Limit** | Maps to Consistency/Merging. | **Peirce's Defect:** Hides assumptions about identifiability and $P^* \in \mathcal{M}$. |
  | **James's Payoff** | Maps to Expected Utility Minimization. | **Smuggling:** Requires fixing $L$, which James wants to be mutable. |
  | **Unobservables** | Maps to Identifiability conditions. | **Peirce's Defect:** No guarantee of structural convergence, only predictive. |
  | **Normativity** | No counterpart (Is vs. Ought). | **Vocab Defect:** Stats describes performance; Pragmatism prescribes norms. |
  | **Will to Believe** | Maps to Utility-weighted Priors. | **Category Shift:** Turns "belief" into "policy." James's slogan conflates the two. |

  **Final Assessment:**
  Your vocabulary is sharper than the Pragmatists' slogans. It forces the hidden parameters ($P^*$, $L$, Identifiability) into the open.
  *   **Peirce** looks like an optimist about identifiability and realizability. He assumes the world is kind enough to let the posterior collapse to a single point that matches reality.
  *   **James** looks like a decision theorist who refuses to distinguish between the map and the territory, arguing that if the map gets you to the destination, it *is* the territory.

  The residue is not a failure of statistics to capture "Truth," but rather evidence that the Pragmatist definitions of Truth were doing rhetorical work (bridging is/ought, stabilizing inquiry) that requires axioms outside the scope of convergence theorems or risk minimization. Specifically, the **Normative Gap** is the largest residue: statistics can tell you which estimator is *better*, but it cannot tell you why you *should* care about truth or utility without an external value judgment. Peirce and James try to derive that value judgment from the nature of inquiry or experience itself; your vocabulary correctly treats that value judgment as a boundary condition.
