      *   *Model Class:* Let $\mathcal{M}$ be the set of candidate models.
      *   *Data:* Sequence $X_1, X_2, \dots$ generated by some "true" distribution $P^*$.
      *   *Estimator/Updater:* A rule mapping data to a distribution/parameter $\hat{P}_n$.
      *   *Convergence:* $\hat{P}_n \to P_{\infty}$ as $n \to \infty$.
      *   *The "Truth":* $P_{\infty}$.
      *   *Crucial Constraint:* Peirce assumes a *single* reality that forces convergence. In stats, this requires identifiability and that $P^* \in \mathcal{M}$ (or convergence to the projection of $P^*$ onto $\mathcal{M}$).
      *   *Community Aspect:* Different priors $P_0^{(i)}$ should merge to the same posterior. This is Blackwell-Dubins.
      *   *Missing Piece:* Peirce assumes the method of inquiry *itself* is fixed and reliable. In stats, we need to specify the learning rule. Also, Peirce implies the limit *is* the truth, not just the best approximation.

  3.  **Deconstruct James (Statistical Translation):**
      *   *Concept:* Truth is what is "expedient in the way of belief," what "pays off," what works.
      *   *Statistical Analog:* Decision theory, Expected Utility, Loss Functions.
      *   *Belief:* A distribution $Q$ or a parameter estimate $\theta$.
      *   *Action:* $a \in \mathcal{A}$.
      *   *Loss:* $L(a, \omega)$ where $\omega$ is the state of the world.
      *   *Criterion:* A belief $Q$ is "true" (or valid) if acting on $Q$ minimizes expected loss $E_Q[L(a, \omega)]$ relative to the actual outcomes experienced.
      *   *Key Distinction:* Truth is not a property of the correspondence between $Q$ and $P^*$, but a property of the *consequences* of holding $Q$.
      *   *Missing Piece:* James allows the "truth" to change as our needs/loss functions change. In stats, the loss function is usually fixed for the analysis. Also, "paying off" includes emotional/social utility, which is hard to encode in a standard statistical loss function without expanding the outcome space.

