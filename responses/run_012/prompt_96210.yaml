  2.  **Deconstruct the Core Concepts & Confusion:**
      *   *Superrationality:* Often dismissed as magical thinking or just EDT. The core intuition is "logical correlation." If I reason $X$, and you reason like me, you reason $X$.
      *   *Correlation vs. Identity:* Hofstadter's original case was identical agents. Real world is partial correlation. How does the degree of correlation scale the obligation/expectation to cooperate?
      *   *One-Sided Handshake:* If I act superrationally against a Causal Decision Theorist (CDT) defector, I lose. Is this a bug or a feature? Is there a way to signal or filter?
      *   *EDT vs. FDT vs. Team Reasoning:* EDT says "choose the act that is evidence of good outcomes." FDT (Functional Decision Theory) says "choose the output of your decision algorithm." Team Reasoning says "maximize group utility." Are these distinct?
      *   *Normativity vs. Descriptiveness:* Is superrationality a claim about how agents *will* behave (prediction) or how they *ought* to behave (normative)?

  3.  **Brainstorming Open Questions (The "Space"):**
      *   *The Metric of Similarity:* How do we measure "reasoning similarity"? Is it syntactic (code) or semantic (output)?
      *   *The Continuum Problem:* Superrationality works at 100% correlation. CDT works at 0%. What happens at 47%? Is there a threshold?
      *   *The Normative Force:* Why *should* I cooperate if I'm only 80% sure you're like me? Does the expected utility calculation hold, or is there a duty?
      *   *The One-Sided Risk:* Is unilateral superrationality irrational? Can we build a "handshake protocol" that doesn't require pre-commitment institutions?
      *   *The Metaphysics of the Algorithm:* Do decision algorithms exist as abstract objects that can be "the same" across instances? (Platonism vs. Nominalism in decision theory).
