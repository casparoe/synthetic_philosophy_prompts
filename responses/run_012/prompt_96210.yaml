  8.  *(Self-Correction on the "Friend's Claim"):* The friend says it's EDT. I need to address this. EDT conditions on the *act*. Superrationality/FDT conditions on the *algorithm*. This is a crucial distinction. If the agents are correlated because they run the same source code, EDT might get it right, but for the wrong reason (spurious correlation vs. logical necessity). I should make this a sub-point of the Taxonomy item.

  9.  *(Final Review against Prompt):* "Take your time... reason carefully... don't give me a survey... agenda: which open questions... in what order, and why." Okay, I'm ready to write.

