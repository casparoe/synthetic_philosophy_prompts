      *   *Priority 3: The Normative Status of the One-Sided Handshake.* (The risk assessment). Is it rational to be a sucker?
      *   *Priority 4: Unifying Team Reasoning and FDT.* (Theoretical integration). Cleaning up the taxonomy.

