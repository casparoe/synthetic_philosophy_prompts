          1.  **Formalizing the "Logical Link" (The Substrate).** Upstream because without a model of correlation, the rest is hand-waving. Tractable with logic/probability. Outcome: A formal model of partial logical correlation.
          2.  **The Continuum Problem (Thresholds).** Upstream for application. If there's no threshold, the theory is useless. Tractable with modeling. Outcome: A function mapping similarity to cooperation probability.
          3.  **The Normativity of Unilateralism (The Handshake).** Downstream of 1 & 2. If we know the link and the threshold, is it *rational* to risk it? Outcome: A defense or rejection of unilateral superrationality.
          4.  **Taxonomy of "We-Reasoning" (EDT vs. FDT vs. Team).** Synthesis work. Outcome: A paper clarifying if these are rivals or dialects.
      *   *Deprioritization:* Evolutionary dynamics (too empirical/bio), Metaphysics of algorithms (too abstract/stalled), Experimental verification (against constraints).
