      *   *Constraint:* 3 years, 3-4 people, philosophy + math. No experiments.
      *   *Strategy:* Start with the conceptual foundation (what *is* the correlation?), move to the normative implication (what should I do?), then to the strategic implementation (how do I avoid exploitation?).
      *   *Priority 1: The Logic of Logical Correlation.* (Defining the mechanism). If we don't know *how* agents are linked, we can't calculate anything.
