answer: |-
  This is a dangerous patch of ground. You are asking me to map a terrain where the coordinate system itself is disputed. My friend in your reading group is half-right: superrationality *looks* like Evidential Decision Theory (EDT) from the outside, because both recommend cooperation in the one-shot Prisoner's Dilemma (PD) under specific conditions. But the *mechanism* is different, and if we build a research program on the wrong mechanism, we waste three years chasing ghosts. EDT says "my cooperating is *evidence* you will cooperate." Superrationality (and its modern descendant, Functional Decision Theory or FDT) says "my cooperating *determines* (logically) that you will cooperate, because we instantiate the same function."

  That distinction—evidence vs. logical subjunctive dependence—is the first conceptual joint we have to cut. If we can't sharpen that, the rest of the agenda collapses.

  Here is the space of open questions as I see them, before I commit to an order.

  ### The Space of Open Questions

  1.  **The Metric of Similarity:** "Identical agents" is a useful fiction; "correlated agents" is the reality. But correlated how? Syntactically (same code)? Semantically (same output distribution)? Causally (shared training data)? We lack a formal measure of "decision-theoretic distance."
  2.  **The Continuum Problem:** Superrationality is usually binary: either you trust the mirror or you don't. In reality, correlation is probabilistic. Is there a threshold of similarity where cooperation becomes rational? Does the expected utility calculation scale linearly with correlation, or is there a phase shift?
  3.  **The Normativity of the One-Sided Handshake:** If I act superrationally against a Causal Decision Theorist (CDT) agent, I get suckered. Is this a necessary cost of maintaining a cooperative equilibrium in a broader population, or is it simply irrational self-sacrifice? Does "rationality" require protecting oneself from exploitation, or maximizing global utility given one's limited causal leverage?
  4.  **The Ontology of the Algorithm:** For superrationality to work, the "decision algorithm" must be an abstract object that can be instantiated in multiple places. Do we need a Platonist metaphysics to make this work, or can we ground it in physicalist predictions about convergent reasoning?
  5.  **Team Reasoning vs. Superrationality:** When a "team reasoner" maximizes group utility, are they effectively running a superrational calculation with a different prior? Or does team reasoning require a group agent ontology that superrationality avoids?
  6.  **Evolutionary Stability:** Can a cluster of superrational agents invade a population of defectors? If they get exploited by the defectors (the one-sided handshake problem), do they go extinct?
  7.  **The EDT Conflation:** Is the recommendation to cooperate driven by the *logic* of the situation (FDT) or merely by *correlations* in the world (EDT)? If the latter, superrationality adds nothing new.

  ---

  ### The Three-Year Agenda

  I am prioritizing conceptual clarity and formal tractability over metaphysical depth or empirical application. We cannot solve the metaphysics of algorithms in three years, and we have no lab for evolutionary simulations. We must build the logic first.

  #### 1. Formalizing "Logical Correlation" (Year 1)
  **The Question:** How do we mathematically represent the degree to which two distinct physical agents instantiate the same decision function?
  **Why Upstream:** Everything else depends on this. You cannot calculate the continuum of cooperation (Question 2) or assess the one-sided handshake risk (Question 3) without a variable for "degree of logical correlation." Currently, this is hand-waved as "probability they are like me." That is insufficient. It conflates *predictive* probability (I think you are like me) with *logical* probability (our outputs are constrained to match).
  **Tractability:** High for philosophy + math. This requires probability theory, logic, and perhaps computer science concepts (algorithmic information theory), but no new empirical data.
  **Three-Year Outcome:** A formal paper defining a "Correlation Coefficient for Decision Algorithms" ($\rho_{logic}$). It should distinguish between correlation due to shared causes (common training) and correlation due to logical identity (same source code).
  **Re-evaluation Criteria:** If we find that logical correlation cannot be distinguished from standard probabilistic correlation without invoking controversial metaphysics, we must downgrade this and pivot to Question 7 (The EDT Conflation).

  #### 2. The Continuum of Superrationality (Year 2)
  **The Question:** Given $\rho_{logic}$ from Year 1, at what point does cooperation maximize expected utility? Is it a smooth curve or a step function?
  **Why Upstream of Normativity:** Before we ask if we *ought* to cooperate unilaterally (Question 3), we need to know if it is *instrumentally rational* to do so at varying levels of correlation. If the utility curve is flat until $\rho=1$, superrationality is useless for real humans. If it slopes gently, it has purchase.
  **Tractability:** Moderate. This is game-theoretic modeling. We can model PD variants with varying $\rho_{logic}$. The difficulty is ensuring the model doesn't just collapse back into standard EDT calculations.
  **Three-Year Outcome:** A set of "Superrational Threshold Theorems." For example: "In a PD with payoff matrix $M$, cooperation is FDT-optimal if and only if $\rho_{logic} > \theta$."
  **Re-evaluation Criteria:** If the threshold $\theta$ turns out to be effectively 1.0 (i.e., you need near-perfect identity), the theory has no real-world application. We would then need to deprioritize the whole program as a curiosity rather than a guide.

  #### 3. The Normativity of the One-Sided Handshake (Year 3)
  **The Question:** Is it rational to cooperate when you know $\rho_{logic}$ is low (i.e., the other agent is likely a CDT defector)?
  **Why Downstream:** You cannot answer this until you know the payoff structure from Question 2. If the continuum model shows that unilateral cooperation yields negative expected utility, the normative answer is "don't do it." If it shows positive utility (perhaps due to signaling or long-term logical influence), then we defend it.
  **Tractability:** Hard. This bleeds into ethics and normative theory. It requires distinguishing between *individual* rationality and *collective* rationality without simply begging the question.
  **Three-Year Outcome:** A definitive stance on the "Sucker's Payoff." Either a proof that unilateral superrationality is self-defeating (and thus should be abandoned as a policy), or a defense of it as a necessary "tax" for maintaining logical coherence in a mixed population.
  **Re-evaluation Criteria:** If we conclude that unilateral superrationality is strictly dominated by CDT in mixed populations, we must recommend the research program shift to "How to detect other superrational agents" (signaling) rather than "How to act."

  #### 4. Taxonomy of "We-Reasoning" (Ongoing/Synthesis)
  **The Question:** Are Team Reasoning, EDT, and FDT/Superrationality competing theories or descriptions of the same phenomenon at different levels of abstraction?
  **Why Last:** This is a synthesis task. You can only compare the theories once you have formalized the superrational mechanism (Year 1 & 2).
  **Tractability:** Philosophical analysis. High risk of verbal disputes.
  **Three-Year Outcome:** A mapping paper. "Decision Theory Dialects." It should clarify, for instance, that Team Reasoning assumes a group agent ontology, while Superrationality assumes individual agents with linked algorithms.
  **Re-evaluation Criteria:** If we find they are indeed just the same thing restated, we publish the unification and close the file. If they make divergent predictions in edge cases, we identify those cases for future work.

  ---

  ### What I Am Deprioritizing

  1.  **Evolutionary Dynamics:** I am explicitly excluding Question 6 (Evolutionary Stability). Why? Because it requires simulation or biological assumptions we don't have. It's downstream of the normative question anyway. If it's not rational for an individual (Question 3), it doesn't matter if it's stable for a species.
  2.  **The Metaphysics of Algorithms:** Question 4 is a trap. We can treat the "algorithm" as a useful fiction for prediction without solving the Platonism vs. Nominalism debate. If we get stuck on whether abstract objects *exist*, we won't finish Year 1.
  3.  **Signaling Protocols:** How do I *find* another superrational agent? This is crucial for the "one-sided handshake" problem, but it's a mechanism design problem, not a foundational decision theory problem. It's a Year 4 project.

  ### The Risk of Confusion

  You asked me to be honest if the program is confused. Here is the danger: **Your friend might be right.**

  If "logical correlation" cannot be formally distinguished from "probabilistic correlation based on shared causes," then Superrationality is just EDT with a fancy costume. EDT says: "If I cooperate, it's likely you cooperate because we are similar." FDT says: "If I cooperate, I am *making* it the case that you cooperate because we are the same function."

  If our Year 1 work fails to produce a $\rho_{logic}$ that differs from standard conditional probability $P(You|Me)$, then the entire research program is a category error. We would be studying psychology (how people happen to behave) rather than decision theory (how agents *must* reason).

  **My bet:** There *is* a distinction, but it only holds in cases of *logical* dependency (like Newcomb's Problem or Twin PD), not merely causal dependency. The agenda succeeds only if we can rigorously isolate logical dependency from causal correlation. If we can't, we spend three years proving that EDT was sufficient all along.

  ### Summary of the Commit

  1.  **Year 1:** Define the math of logical correlation. (If this fails, stop.)
  2.  **Year 2:** Map the utility curve across the correlation continuum.
  3.  **Year 3:** Determine the normative status of unilateral cooperation based on that curve.
  4.  **Synthesis:** Clarify the relationship to Team Reasoning/EDT.

  This order prevents us from making normative claims (Year 3) before we know if the mechanism exists (Year 1). It prevents us from worrying about evolutionary survival (Deprioritized) before we know if the behavior is rational for the individual (Year 3). It forces us to confront the "EDT wearing a hat" accusation immediately, rather than hiding it in the literature review.

  If I were leading this group, I would tell them: "We are not trying to prove cooperation is good. We are trying to prove that *reasoning* can be shared. If we can't do that, we go home."
