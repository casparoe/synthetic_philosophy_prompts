answer: |-
  Three economists are stuck in a committee room trying to choose between three policy proposals: A, B, and C.

  Their preferences are perfectly cyclic:
  The first prefers A to B to C.
  The second prefers B to C to A.
  The third prefers C to A to B.

  They decide to use pairwise majority voting.
  "Look at this," says the first. "Unrestricted Domain, Weak Pareto, and Non-dictatorship. It satisfies all the conditions. No single voter can impose their will."
  "So we're safe from manipulation?" asks the second.
  "Completely," says the third. "Arrow proved it."

  The Chairperson clears their throat. "We still have to decide the order of the votes."
  "If we vote A against B first, A wins. Then A against C, C wins. The outcome is C."
  "If we vote B against C first, B wins. Then B against A, A wins. The outcome is A."
  "If we vote C against A first, C wins. Then C against B, B wins. The outcome is B."

  The Chairperson, who prefers A, schedules B against C first.
  As the gavel falls, the Chair smiles.
  "Arrow was right. There is no dictator. There's just the person who decides which losing option gets eliminated first."
