prompt: |-
  I run grantmaking at a small family foundation — about $3M a year, I'm the only program officer, and I write the one-page memo that the board signs off on every quarter. So that's thirty-odd funding decisions a year, made mostly alone, on maybe a day's notice each, no researcher, no way to trial anything.

  What keeps eating at me is cluelessness. Not the ordinary 'we don't know yet' kind that more research could fix (I've seen this called simple cluelessness), but the other kind, where the ripples of a grant are so diffuse and chaotic — effects on people far downstream, on institutions, on people not born yet — that no amount of study would hand me a determinate total. I've seen that called complex cluelessness. Every framework I read either pretends the problem away by telling me to multiply made-up probabilities, which is exactly the move cluelessness is supposed to be an objection to, or it shrugs and says fund what's tangible, which is what two of my trustees already believe and I don't want to just cave to them.

  So write me a procedure I can actually run, in order, on a proposal that lands on my desk. I want the questions to ask in sequence, what counts as a good enough answer to each, where the thing terminates in a no, and where it has to hand the decision to a person because the question is about values and not facts. It needs to tell me, at each stage, whether I'm looking at the fixable ignorance or the unfixable kind and what changes about my decision depending on which — including what to do when I can't even sign the effect (a grant that might help, might backfire, and the evidence won't settle which). It should say when paying for more research is worth the money and when it's just procrastination in a lab coat, when to fall back on rules like 'don't do the intrinsically skeevy thing' because the arithmetic can't guide me, and when to fund a smaller amount as a hedge instead of yes/no. And it should flag the steps that are judgement calls wearing a procedure's clothes.

  Then run it on three: (1) a boring renewal — school health program, cheap, decent evidence, no controversy; (2) a new request to pay for a media-literacy curriculum in local high schools, where I genuinely can't tell if the long-run civic effect is positive; (3) a documentary my board chair is excited about, where the procedure tells me to decline and I don't want to hear it. For that last one, tell me straight, and tell me what the procedure can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Solo Program Officer at a small family foundation ($3M/year payout).
      *   **Constraints:** 30+ decisions/year, one-page memos, quarterly board sign-off, no research staff, short notice (day's notice), no ability to run trials.
      *   **Core Problem:** "Complex Cluelessness." The user understands the difference between *simple cluelessness* (fixable with research) and *complex cluelessness* (unfixable due to diffuse/chaotic long-term effects). They reject frameworks that rely on fake precision (multiplying made-up probabilities) and refuse to just fund only what's tangible (caving to trustees).
      *   **Goal:** A practical, step-by-step *procedure* for evaluating proposals.
      *   **Requirements:**
          *   Sequential questions.
          *   Criteria for "good enough" answers.
          *   Termination points (No).
          *   Hand-off points (Values/Judgment).
          *   Distinction between fixable vs. unfixable ignorance.
          *   Guidance on signed effects (positive/negative/uncertain).
          *   Guidance on research vs. procrastination.
          *   Guidance on deontological rules ("skeevy things").
          *   Guidance on hedging (smaller amounts).
          *   Identification of "judgment calls wearing procedure's clothes."
          *   **Application:** Run the procedure on three specific cases (Renewal, Media Literacy, Documentary).
          *   **Specific Instruction:** For the Documentary case, be direct if the procedure says "decline," and explain the procedure's limitations.

  2.  **Deconstruct "Complex Cluelessness" in this Context:**
      *   The user is right: You can't calculate the 100-year impact of a high school curriculum.
      *   Standard EA (Effective Altruism) models often fail here because they demand numbers that don't exist.
      *   Standard Philanthropy models often fail here because they demand "logic models" that pretend causality is linear.
      *   *Solution:* A heuristic-based, triage system that acknowledges uncertainty rather than masking it. It needs to be fast (solo PO, day's notice).

  3.  **Drafting the Procedure (The "Cluelessness Protocol"):**
      *   *Phase 1: The Hard Stops (Deontology & Capacity).* Before worrying about impact, is this allowed and possible?
      *   *Phase 2: Simple vs. Complex Cluelessness.* Can we know more? If yes, how much? If no, how do we decide?
      *   *Phase 3: The Sign Test.* Is the expected direction positive, negative, or unknown?
      *   *Phase 4: The Decision Mode.* Full fund, hedge, or pass.
      *   *Phase 5: The Memo.* How to write it for the board.

      *Refining the Steps:*
      *   *Step 1: Legitimacy & Capacity.* (Fixable).
      *   *Step 2: The "Skeevy" Test.* (Values). If it violates core values, stop.
      *   *Step 3: The Research Ceiling.* (Fixable vs. Unfixable). Can $10k of research change the decision? If no, stop researching.
      *   *Step 4: The Sign of the Effect.* (Cluelessness). Is it plausibly positive? If the risk of harm is high and uncertain, pause.
      *   *Step 5: The Hedge.* (Risk Management). If cluelessness is high, fund smaller.
      *   *Step 6: The Value Hand-off.* (Board/PO). Where does the PO stop and the Board start?

  4.  **Developing the Three Cases:**

      *   **Case 1: School Health Renewal.**
          *   *Status:* Boring, evidence-backed.
          *   *Procedure Outcome:* Fast track. Simple cluelessness (low). Fund.
          *   *Nuance:* Don't overthink it. It's the baseline.

      *   **Case 2: Media Literacy Curriculum.**
          *   *Status:* New, long-term civic effects unknown (Complex Cluelessness).
          *   *Procedure Outcome:* Acknowledge uncertainty. Check for immediate harm (none). Hedge? Or fund based on "plausible positive sign."
          *   *Nuance:* This is the core test. The procedure should allow funding despite uncertainty if the "downside" isn't catastrophic.

      *   **Case 3: The Board Chair's Documentary.**
          *   *Status:* Board interest, procedure says decline (likely due to impact measurability or alignment).
          *   *Constraint:* User says "I don't want to hear it" regarding the decline, but also asks me to "tell me straight."
          *   *Conflict:* The procedure is a tool for *justification*, but family foundations are political. If the Chair wants it, the procedure might need to bend, or the user needs to know *why* the procedure fails here.
          *   *Instruction:* "For that last one, tell me straight, and tell me what the procedure can't do at all."
          *   *Analysis:* The procedure will likely flag this as low impact/high cluelessness. But the *real* decision is relationship management. I need to highlight that the procedure cannot account for donor stewardship or board politics.

  5.  **Refining the Tone:**
      *   Needs to be pragmatic, not academic.
      *   Acknowledge the user's sophistication (they know the terms "simple/complex cluelessness").
      *   Avoid jargon where possible, but use their terms to show alignment.
      *   Be direct about the limitations.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Self-Correction on Case 3:* The prompt says "where the procedure tells me to decline and I don't want to hear it." This implies the user *expects* the procedure to say no, but emotionally/practically resists it. I must honor the instruction: "Tell me straight." I need to explain *why* the procedure says no (likely lack of measurable impact vs. cost) but then explain the *meta-game* (foundation politics) that overrides the procedure.
      *   *Self-Correction on "Judgement Calls":* I need to explicitly label steps where the procedure pretends to be objective but is actually subjective.
      *   *Self-Correction on "Research vs. Procrastination":* Set a hard dollar/time limit. Given $3M payout and 30 grants, spending more than $5k or 3 days on due diligence is inefficient.

  7.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   Ensure the distinction between Simple and Complex Cluelessness is clear in every step.
      *   Make sure the "Hedge" option is clear.
      *   Ensure the "Values Hand-off" is distinct from "Fact Finding."

  8.  **Final Review of the Output Structure:**
      *   Introduction (acknowledging the bind).
      *   The Procedure (The "Cluelessness Triage").
      *   Application to Case 1.
      *   Application to Case 2.
      *   Application to Case 3 (The hard truth).
      *   Conclusion (What the procedure can't do).

  *(Self-Correction during drafting Case 3)*: I need to be careful not to sound like I'm telling them to ignore the board. I need to explain that the procedure is for *programmatic* integrity, but family foundations have *governance* realities. The procedure identifies the risk; the PO manages the relationship.

  *(Refining the "Sign" concept)*: In complex cluelessness, we often can't know the *magnitude*, but we can often guess the *sign* (positive/negative). If the sign is ambiguous (could be great, could be terrible), that's where the hedge comes in.

  *(Final check on "Judgement calls wearing procedure's clothes")*: I will add a specific callout box or bold text for these moments.

