prompt: |-
  Ok, so I've got about 18 months of funded PhD time left (epistemology, some formal stuff) and a co-author who works in social epistemology, and I'm trying to decide where to actually dig in on the peer disagreement debate. Our shared motivation is institutional rather than abstract: we care about how something like an expert advisory panel, a forecasting outfit, or a scientific consensus process should handle internal disagreement, not just about the tidy two-philosophers-one-proposition case. So: what are the open questions in the concilliationism vs steadfastness fight that are most worth working on, and in what order would you put them? Defend the ordering -- which are upstream of which, which are tractable with the tools the field already has, which are popular but wouldn't change much downstream if they got settled, and what over the next year or two would move a question up or down.

  Three things I want you to fold in, because I suspect they're where the real action is and I don't see them getting alot of play:

  1. Nearly every case in the literature is two-party, one-shot, and about a proposition. Real institutions have many disagreeing parties, and if everyone gets equal weight then it looks like the view just tells you to drift toward the crowd's average. Does the two-party intuition survive aggregation, or does equal weighting a hundred peers collapse into defer to the mean, and if so what's left of the position?

  2. What's the evidential weight of disagreement you saw coming? If my model of you predicted your dissent before you gave it, is your dissent still evidence that I'm wrong, or have I already eaten it? Intuitively the surprise is doing the work -- but then how much disagreement counts for depends on my prior model of my peers, which seems like a strange place for the epistemology to bottom out.

  3. Group-vs-group disagreement: does it reduce to person-vs-person with the group's opinion plugged in, or does the fact that each side is itself an aggregate with its own internal disagreement change the peerhood and independence math?

  Also: is there a version of this debate that's about what to do rather than what to believe, and does anything in the belief case carry over cleanly to action, or does the practical case need its own treatment? I'd rather come out of this with a defended agenda than a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User Status:** PhD student, ~18 months funding left.
      *   **Field:** Epistemology (with some formal tools), Co-author in Social Epistemology.
      *   **Goal:** Decide where to dig in on the *peer disagreement* debate.
      *   **Motivation:** Institutional/Practical (expert panels, forecasting, scientific consensus), *not* abstract two-philosopher cases.
      *   **Specific Constraints/Inputs:**
          *   Need an ordered agenda (what's upstream/downstream, tractable, high impact).
          *   Must incorporate three specific under-explored angles:
              1.  Many-party aggregation (does equal weighting collapse into "defer to the mean"?).
              2.  Expected vs. Unexpected disagreement (does predicted dissent carry evidential weight?).
              3.  Group-vs-Group disagreement (does internal structure matter?).
          *   Address the Belief vs. Action distinction.
          *   Output: A defended research agenda, not a reading list.

  2.  **Deconstruct the Current State of the Debate:**
      *   *Standard View:* Conciliationism (split the difference) vs. Steadfastness (stick to your guns).
      *   *Standard Case:* Two peers, one proposition, one-off encounter.
      *   *Problem:* This is ill-suited for the user's institutional focus. Real institutions are dynamic, multi-agent, and action-oriented.
      *   *Formal Tools:* The user mentions "some formal stuff." This suggests Bayesian modeling, social choice theory, or judgment aggregation could be relevant.

  3.  **Evaluate the Three "Real Action" Inputs:**

      *   *Input 1 (Many-Party/Aggregation):* This is crucial for institutions. If Conciliationism implies averaging, does it lose normative force? Is it just statistics? *Verdict:* High priority. It's the bridge from abstract epistemology to institutional design.
      *   *Input 2 (Expected Disagreement):* This touches on the *source* of the evidential weight. If I know you're a contrarian, your disagreement confirms my view. This connects to modeling priors about peers. *Verdict:* Medium-High priority. It's theoretically deep but might be harder to formalize for institutions without solving #1 first.
      *   *Input 3 (Group-vs-Group):* This is about structure. If Panel A disagrees with Panel B, do we treat them as two "super-peers"? Or does the internal variance matter? *Verdict:* High priority for institutional focus, but depends on #1.

      *   *Belief vs. Action:* Institutions care about *decisions* (policy, forecasts), not just doxastic states. *Verdict:* This should be the *goal* or the *application* layer, built on the belief updates.

  4.  **Develop the Ordering/Agenda Strategy:**

      *   *Criterion 1: Upstream/Downstream.* You can't model group dynamics (#3) without knowing how to aggregate multiple peers (#1). You can't move to action without knowing how belief updates work under these conditions.
      *   *Criterion 2: Tractability.* Formal tools (Bayesian/Betting) are ready for #1 and #2. #3 requires social choice theory which might be heavier.
      *   *Criterion 3: Impact.* Solving #1 changes the game for institutions most. Solving the abstract two-party debate changes little for the user's goals.

      *   *Proposed Order:*
          1.  **The Aggregation Problem (Input 1).** This is the foundation. If conciliationism collapses into "follow the crowd" in N-party cases, the normative theory changes drastically.
          2.  **The Expectation Problem (Input 2).** Once we know *how* to aggregate, we need to weigh *which* disagreements count. This refines the inputs to the aggregation function.
          3.  **The Structural Problem (Input 3).** Now apply 1 & 2 to nested groups.
          4.  **The Action Turn.** Translate the doxastic outputs into institutional decision rules.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the shift from abstract to institutional. Validate the user's intuition that the standard debate is exhausted/less relevant for their goals.
      *   **Phase 1: The N-Party Collapse (Input 1).**
          *   *Why First?* It's the structural bottleneck. If equal weighting = averaging, conciliationism becomes a voting theory problem, not just epistemology.
          *   *Formal Angle:* Use judgment aggregation or Bayesian pooling.
          *   *Risk:* If it collapses, is there any normativity left?
      *   **Phase 2: The Surprise Factor (Input 2).**
          *   *Why Second?* You need to know *whose* voice counts before you weigh the surprise.
          *   *Formal Angle:* Higher-order evidence. Priors on peer reliability.
          *   *Institutional Link:* Expert panels often have known factions. Does a known contrarian carry weight?
      *   **Phase 3: Group Structure (Input 3).**
          *   *Why Third?* Depends on 1 & 2.
          *   *Institutional Link:* IPCC vs. Cato Institute. How do we weigh internal consensus vs. outlier?
      *   **Phase 4: Belief to Action.**
          *   *Why Last?* Decision theory sits on top of epistemology.
          *   *Key Question:* Does epistemic compromise lead to pragmatic compromise? (Sometimes yes, sometimes no).
      *   **Dynamic Factors (18-month timeline):** What moves topics up/down? (e.g., if a major paper drops on judgment aggregation, pivot).

  6.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Is this too formal? The user said "some formal stuff." I need to ensure the philosophical payoff is clear, not just the math.
      *   *Critique:* Is 18 months enough? This is ambitious. I need to emphasize *tractable slices*. Don't solve aggregation theory; solve how conciliationism *maps* onto it.
      *   *Critique:* The "Belief vs. Action" point needs to be sharp. Standard view: Belief aims at truth, Action at utility. In institutions, they blur (consensus *is* the goal sometimes).
      *   *Integration:* Make sure Inputs 1, 2, and 3 are explicitly highlighted as the core pillars.

  7.  **Final Polish:**
      *   Tone: Professional, peer-to-peer, strategic.
      *   Structure: Clear headings, prioritized list, defense of ordering.
      *   Check against constraints: Did I answer the "order" question? Yes. Did I include the 3 inputs? Yes. Did I address belief vs. action? Yes. Is it an agenda? Yes.

  8.  *(Final thought on the "Expected Disagreement" point)*: This is actually a killer point. If I know you disagree, and I predicted it, standard conciliationism says I should still move. But intuitively, I shouldn't. This connects to "independence principles." This needs to be highlighted as a potential publication hook.

  9.  *(Final thought on "Action")*: Mention "Polarization vs. Compromise" in policy. Sometimes splitting the difference is dangerous (e.g., climate change). This makes the institutional focus vital.

  10. **Constructing the Output.** (Proceed to generate response based on these thoughts).
answer: |-
  This is a strategic pivot that saves you from the exhaustion of the standard "Christensen vs. Kelly" loop. The literature is saturated with two-party, one-shot, proposition-focused cases. For an institutional focus (panels, forecasting, consensus), that literature is often a distraction.

  Given your 18-month timeline, your formal toolkit, and your co-author's social epistemology background, you cannot solve the *entire* aggregation problem. You need to identify the specific pressure points where the standard peer disagreement norms break down when scaled to institutions.

  Here is a defended research agenda, ordered by logical dependency and tractability, incorporating your three specific insights.

  ### The Agenda: From Aggregation to Action

  **Order of Operations:**
  1.  **The N-Party Collapse (Input 1)**
  2.  **The Expectation Weighting (Input 2)**
  3.  **The Group Structure (Input 3)**
  4.  **The Doxastic-Pragmatic Gap (Belief vs. Action)**

  ---

  ### Phase 1: The N-Party Collapse (Months 1–6)
  **Focus:** Input 1 (Many-party aggregation).
  **Question:** Does Conciliationism survive scaling, or does it dissolve into statistical deference?

  **Why this is first (Upstream):**
  This is the logical bottleneck. Standard Conciliationism (e.g., Equal Weight View) tells you to give a peer's credence the same weight as your own in a dyad. In an institution with $N$ peers, if you apply this iteratively or simultaneously, you are mathematically committed to averaging (or some other pooling function).
  *   **The Trap:** If Conciliationism just means "calculate the mean," it ceases to be a distinctive *epistemic* norm and becomes a trivial claim about arithmetic.
  *   **The Opportunity:** If you can show that Equal Weight *does not* collapse into simple averaging in N-party cases (perhaps due to dependency networks or clustering), you save the normative force of the view. If it *does* collapse, you need to argue why "defer to the mean" is epistemically virtuous in institutional settings (which is a controversial claim in forecasting literature).

  **Tractability:**
  High. You have formal tools. You can model a panel of $N$ agents.
  *   *Model:* Bayesian updating with multiple signals vs. Linear Opinion Pooling.
  *   *Test:* Does the "steadfast" agent have a better accuracy score over time in an N-party environment than the "conciliatory" agent?
  *   *Deliverable:* A paper showing that the "Two-Party Intuition" is a special case that misleads us about N-party dynamics.

  **Risk:**
  If you prove it collapses into averaging, you might kill Conciliationism. *Pivot:* If so, argue that for institutions, "epistemic compromise" is actually a procedural virtue distinct from truth-tracking (linking to Phase 4).

  ### Phase 2: The Expectation Weighting (Months 7–12)
  **Focus:** Input 2 (Expected vs. Unexpected Disagreement).
  **Question:** How does the *predictability* of dissent modulate its evidential weight?

  **Why this is second (Midstream):**
  Once you know *how* to aggregate (Phase 1), you need to know *what* to aggregate. Standard peer disagreement literature assumes the disagreement itself is the evidence. But in institutions, disagreement is often structural (e.g., the economist always disagrees with the sociologist).
  *   **The Insight:** If my model of you predicts your dissent, your dissent confirms my model, not necessarily my falsity. This challenges the **Independence Principle** (which says you can't use your reasoning to dismiss their disagreement).
  *   **Institutional Link:** Expert panels rely on diversity. If Conciliationism demands we ignore the *source* of disagreement and just look at the *fact* of disagreement, it undermines the value of diverse panels. You need a norm that allows agents to discount "expected" disagreement without being dogmatic.

  **Tractability:**
  Medium-High. This requires higher-order evidence modeling.
  *   *Model:* Hierarchical Bayesian models where agents have priors over *other agents' reliability functions*.
  *   *Test:* Simulate a panel where some disagreements are "noise" and some are "signal" based on prior interaction history.
  *   *Deliverable:* A refinement of the Independence Principle that allows for "calibrated steadfastness" based on prediction accuracy.

  **Risk:**
  It risks circularity ("I predicted you'd be wrong, so you're wrong"). You need to show how the prediction is formed independently of the specific proposition at hand (e.g., based on track records or methodological commitments).

  ### Phase 3: Group-vs-Group Structure (Months 13–15)
  **Focus:** Input 3 (Internal Aggregates).
  **Question:** Does the internal variance of a disagreeing group alter its peerhood status?

  **Why this is third (Downstream):**
  This depends on Phase 1 and 2. You cannot treat "The IPCC" as a peer against "The Heritage Foundation" without knowing how to aggregate the IPCC's internal disagreement (Phase 1) and how to weigh their predictable institutional stance (Phase 2).
  *   **The Insight:** A group with 90% consensus is a different "epistemic peer" than a group with 51% consensus, even if their *average* credence is identical. The variance carries information about the stability of the evidence.
  *   **Institutional Link:** This is pure social epistemology. It moves beyond "what should I believe" to "how should Institution A treat Institution B."

  **Tractability:**
  Medium. This is conceptually heavy.
  *   *Strategy:* Don't solve general group agency. Focus on the specific case of **Inter-Panel Disagreement**.
  *   *Deliverable:* A case study or formal proof showing that internal variance should act as a discount factor on the group's external testimony.

  ### Phase 4: The Doxastic-Pragmatic Gap (Months 16–18)
  **Focus:** Belief vs. Action.
  **Question:** Does epistemic conciliation mandate pragmatic compromise?

  **Why this is last (The Capstone):**
  Institutions don't just believe; they act (policy, funding, warnings).
  *   **The Problem:** In belief, splitting the difference might be rational (truth is likely somewhere in between). In action, splitting the difference might be catastrophic (e.g., climate policy: if one side says 2°C warming and the other says 4°C, the "compromise" policy for 3°C might be insufficient for the 4°C reality).
  *   **The Argument:** You can argue that **Epistemic Conciliationism** is true (update credences toward the mean) but **Pragmatic Steadfastness** is required (act on the risk-dominant view).
  *   **Deliverable:** A framework for "Asymmetric Institutional Response": Update beliefs conciliatorily, but weight actions by the cost of error (Decision Theory).

  ---

  ### Defense of the Ordering

  1.  **Logical Dependency:** You cannot weigh the *source* of disagreement (Phase 2) or the *structure* of the disagreeing body (Phase 3) until you define what happens to the *math* of disagreement when $N > 2$ (Phase 1). If Phase 1 shows Conciliationism is incoherent at scale, the rest of the project changes from "refining norms" to "designing replacements."
  2.  **Tractability:** Phase 1 is the most formal and contained. It's the safest bet for a quick publication to secure your job market profile. Phase 4 is the most philosophical/normative and serves as a strong "significance" chapter for the dissertation.
  3.  **Impact:** Settling the two-party debate (the current literature) changes almost nothing for institutional design. Solving Phase 1 (N-party aggregation) directly informs how forecasting tournaments and advisory panels are structured.

  ### Dynamic Factors: What Moves Topics Up or Down?

  **Move Phase 1 Down / Phase 2 Up if:**
  *   You find that the formal literature on **Judgment Aggregation** (List & Pettit, etc.) has already definitively solved the N-party collapse in a way that makes your epistemic intervention redundant. If the math is settled, pivot immediately to the *normative interpretation* of that math (Phase 2).
  *   Your co-author has strong connections to empirical social epistemologists who have data on *predictable disagreement* in labs. Empirical traction makes Phase 2 much more publishable right now.

  **Move Phase 4 Up if:**
  *   You encounter a "Normative Wall." If you find that belief-updating in institutions is hopelessly mired in politics/identity (making Phase 1-3 descriptively inaccurate), pivot to **Action**. It is easier to argue for "Procedural Pragmatism" (how we decide) than "Procedural Epistemology" (how we believe) in a politicized environment. This is a safer bet for public relevance.

  **Move Phase 3 Down (Cut it) if:**
  *   Time crunch. Group-vs-Group is the most complex. If you are at month 12 and haven't solidified Phase 1, drop Phase 3. It is a specialization of Phase 1. You can argue in the dissertation conclusion that "Future work applies the N-party model to nested groups."

  ### Summary of the "Pitch"

  Your dissertation argues that the **Peer Disagreement debate has a scaling problem.**
  1.  **Scale of Agents:** It breaks when moving from 2 to $N$ (Input 1).
  2.  **Scale of Information:** It ignores the evidential value of *predicting* the disagreement (Input 2).
  3.  **Scale of Output:** It conflates belief-updating with decision-making (Belief vs. Action).

  By solving these, you provide a normative framework for **Institutional Epistemology** that is distinct from individual social epistemology. This positions you not just as an epistemologist, but as a theorist of scientific governance and expert policy, which is a highly hireable niche.

  **Immediate Next Step:** Run a formal simulation for Phase 1. Take a standard Equal Weight updating rule and run it on a network of 10 agents with varying initial credences. See if it converges to the arithmetic mean or if network topology preserves "steadfast" clusters. That result dictates the rest of the 18 months.
