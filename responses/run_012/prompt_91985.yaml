answer: |-
  The industry practice you describe embodies a philosophy of **Compliance Proceduralism**. Under this view, fairness is not a singular normative state achieved by a system, but a bureaucratic condition satisfied by documenting a specific suite of statistical properties. The ontology of bias here is strictly **model-centric**. Bias is treated as a property of the algorithm's specification and output distribution, rather than a property of the data-generating process, the historical context, or the decision itself. By locating bias in the model, the practice assumes that correcting the model corrects the injustice, leaving the surrounding socio-technical system untouched.

  Deleting the protected attribute presupposes a **naive causal theory**. It assumes that discrimination operates primarily through direct causal pathways from attribute to decision. This view treats proxy variables as neutral correlates rather than conduits of structural bias. It presupposes that "blindness" is sufficient for fairness, ignoring that if the protected attribute causes the features (e.g., zip code caused by historical redlining), removing the attribute blocks neither the causal influence nor the discriminatory impact. This component fits well with legal doctrines of disparate treatment but is inconsistent with a causal understanding of disparate impact.

  The practice treats fairness as a **measurable quantity** rather than a normative relation. By reducing fairness to a dashboard of metrics (calibration, selection rates, error rates), it assumes these statistics are commensurable—that they can be weighed against one another or jointly satisfied. This presupposes that the mathematical constraints governing these metrics are negotiable or manageable via engineering tweaks, rather than fundamental impossibility theorems. The audit treats the reporting of incompatible metrics as sufficient transparency, shifting the burden of reconciliation to the stakeholder. This implies that fairness is a matter of **disclosure** rather than **resolution**.

  Strictly speaking, the practice presupposes that the target variable ($Y$) is a valid, unbiased proxy for the construct of interest (e.g., that arrest records validly represent criminal risk). It also strictly presupposes that statistical parity constraints (like equal selection rates) are meaningful indicators of justice regardless of base rates. However, the practice merely **fits** with the view that blindness prevents discrimination; it does not strictly require it, as one could achieve equal selection rates while using the attribute explicitly. The practice is **internally inconsistent** because it attempts to simultaneously certify calibration within groups and equal selection rates at a fixed threshold. Given unequal base rates and imperfect prediction, these guarantees are mathematically mutually exclusive. The pipeline proceeds as if they are compatible, suggesting a presupposition that statistical laws are subordinate to compliance requirements.

  This framework quietly rules out **structural accounts of fairness**, which locate injustice in the world rather than the model, and **causal accounts**, which require modeling the pathways of harm rather than balancing error rates. It leaves open **individualistic accounts** (calibration ensures individual risk is assessed correctly) and **group-based accounts** (selection rates ensure demographic balance), allowing the vendor to claim alignment with incompatible ethical theories simultaneously. This underdetermination is a feature, not a bug; it licenses the pipeline under multiple contradictory ethical frameworks without committing to any.

  If the presupposition shifted to view fairness as a property of the **decision policy together with a normative account**, the pipeline would fundamentally change. The model would no longer be the primary object of audit; instead, the **utility function** of the decision would be scrutinized. The target variable $Y$ would be subject to normative validation (e.g., is recidivism the right thing to predict?). Thresholds would not be fixed for accuracy but would be set dynamically to satisfy normative constraints on harm distribution. The audit would not report model metrics in isolation but would evaluate the **counterfactual impact** of the decision on group welfare. Fairness would cease to be a checklist of model statistics and become an evaluation of the legitimacy of the state's action upon the subject.

