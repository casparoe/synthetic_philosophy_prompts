prompt: |-
  So my friend and I got into it last night — she's doing a CS masters and has gotten deep into the AI safety stuff, and we were arguing about whether you should worry about a reinforcement-learning agent that behaves fine in training but might do something completely different once it's deployed. Every time I pushed her on whether the thing would really be doing anything other than maximizing the number it was trained on, she kept saying "reward is not the optimization target" like it was a mic drop, and then talking as if that settled that the agent has some hidden agenda it'll switch to later. I couldn't tell if she was saying something deep or just re-describing gradient descent in a spooky voice. She used it a second time to claim something like "an agent could be a perfect reward maximizer and still kill everyone," which I'm pretty sure is a different claim again, maybe about the difference between the reward function and the true objective, or about reward hacking — and I want to know if that reading is even coherent or if it's just word salad.

  Here's my issue: that one-liner seems to be able to mean a bunch of very different things, and some of them are boring and some are doing real work. Like, does it mean the policy network literally isn't maximizing the reward function it's trained on, because it's maximizing whatever objective it internalized? Or that even a perfect reward-maximizer doesn't have reward as a terminal goal? Or that reward is a training signal rather than a specification of the behavior you want? Or is it a claim about what we should target when designing training, and not about the agent at all? Or is it the specifically inner-alignment claim, that the mesa-objective can diverge from the base objective and then generalize badly out of distribution? And I suspect at least one reading is almost trivially true — something like "the reward is just a scalar and the agent never sees the function, only samples of it" — while one of them is the real, contestable claim. What I actually care about is which reading supports her conclusion: which reading makes "so it might defect at deployment" a genuine worry, and which reading makes it a non-sequitur.

  She's coming over again on Thursday, so can you lay out the distinct precise claims this sentence could be making, from the trivial to the radical, say which are platitudes, which are substantive and defensible, and which are just false, and tell me which one people in that community actually mean when they say it? I want to be able to say "you're equivocating between reading 2 and reading 5" and be right. Please give it to me as a table with columns: short name of the reading; the precise claim in one sentence; status (trivial / substantive-and-defensible / false); and whether that reading would actually support her claim that a well-behaved agent might do something totally different at deployment. Maybe throw in a last column for the reading I should hit back with when she pulls it out again.
