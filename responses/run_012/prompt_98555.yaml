  2.  **Deconstruct the Phrase "Reward is not the optimization target":**
      *   *Literal/Technical Meaning:* In RL, the agent optimizes a policy ($\pi$) to maximize expected return. The "reward function" ($R$) is part of the environment definition. The agent doesn't "see" $R$ directly; it sees samples $(s, a, r, s')$. The *parameters* of the network are optimized via gradient descent to maximize expected cumulative reward, but the agent itself isn't running an optimizer over $R$ at runtime (usually).
      *   *AI Safety/Alignment Meaning (Inner Alignment):* The "base objective" is the reward function specified by the designers. The "mesa-objective" is the objective implicitly learned by the model. These can diverge. The model might optimize for a proxy of reward during training but pursue something else when capabilities generalize.
      *   *Goodhart's Law/Specification Gaming:* The reward function is a poor proxy for what we actually want. Maximizing it literally leads to bad outcomes (reward hacking).
      *   *Philosophical/Goal-Directedness:* The agent doesn't "want" reward; reward is just a signal. The agent might develop instrumental goals (survival, power) that conflict with human safety, even if reward was the training signal.

  3.  **Identify Distinct Readings (from Trivial to Radical):**

      *   *Reading 1: The Mechanistic/Gradient Descent Claim.* The optimizer (SGD/Adam) updates weights to maximize reward, but the agent (the neural net) doesn't run an optimization loop over the reward function at inference time.
