answer: |-
  You have encountered one of the most durable shibboleths of British constitutional law, and your confusion is entirely warranted. The phrase 'no Parliament can bind its successors' is doing too much work. It is being asked to serve as a legal rule, a political prediction, and a moral principle all at once. When a sentence tries to be everything, it ends up being nothing precise.

  Here is the menu of distinct claims hidden inside that one-liner, with a definite verdict on each.

  ### 1. The Legal Incompetence Claim
  **The Claim:** If Parliament A passes a law stating 'This Act cannot be repealed except by a 75% majority', the courts will ignore that requirement. If Parliament B repeals the Act with a simple 51% majority, the judges will uphold the repeal.
  **Verdict:** **True** (in the current UK constitutional order).
  **Who is committed:** Orthodox constitutional lawyers (following A.V. Dicey) and the Senior Judiciary.
  **Why:** In the UK, there is no higher law than an Act of Parliament. The courts' job is to apply the most recent expression of Parliamentary will. If the most recent will contradicts a previous procedural requirement, the courts follow the most recent will. This is not physics; it is the current 'rule of recognition' that judges use to identify valid law.

  ### 2. The Physical Impossibility Claim
  **The Claim:** It is literally impossible for a future Parliament to pass legislation that contradicts a past Parliament's attempt at entrenchment.
  **Verdict:** **False**.
  **Who is committed:** No serious lawyer, though barristers sometimes speak as if it were true.
  **Why:** There is no physical or mechanical barrier. A future Parliament can pass any text it likes. The only question is whether the courts will enforce it. Since the courts currently enforce the most recent statute, the 'binding' is legally porous.

  ### 3. The Moral Prohibition Claim
  **The Claim:** It is unjust for one generation to impose long-term obligations on the next (the 'dead hand of the past').
  **Verdict:** **Not really a claim** (It is a normative assertion).
  **Who is committed:** Political campaigners, Thomas Jefferson, libertarians.
  **Why:** This is a argument about *ought*, not *is*. It cannot be proven true or false in a legal sense. It is a rhetorical device used to lend moral weight to the legal argument. In the context of climate change, most political theory rejects this; we accept that future generations are bound by today's infrastructure and debt, so why not carbon targets?

  ### 4. The Logical Contradiction Claim
  **The Claim:** A sovereign body cannot logically limit its own sovereignty without ceasing to be sovereign. Therefore, entrenchment is a category error.
  **Verdict:** **False**.
  **Who is committed:** Hardline sovereigntists, your colleague's target (but not your colleague).
  **Why:** This is where your Elster-reading colleague is correct. A 'Ulysses contract' is precisely a sovereign agent binding their future self to overcome weakness of will. A constitution is a Ulysses contract. It is logically coherent to change the *rules of decision-making* for the future (e.g., requiring a supermajority). It is only 'impossible' if you define sovereignty as 'the ability to do anything by simple majority at any time'. That is a circular definition, not a logical truth.

  ***

  ### Which reading did the barrister need?

  The barrister relied entirely on **Claim 1 (The Legal Incompetence Claim)**.

  Their argument was that entrenching climate targets is 'pointless'. If they meant 'politically difficult', they would be wrong; supermajority requirements raise the political cost of repeal significantly. But they meant 'legally futile'. They were arguing that because the courts will not strike down a future simple-majority repeal, the entrenchment offers no legal security.

  On this narrow point, the barrister is correct under current UK law. Unless the UK adopts a codified constitution that transfers ultimate authority from Parliament to the courts (as in the US or Germany), a Climate Act remains an ordinary statute. It can be undone by an ordinary statute. The barrister was right to warn that you cannot use a simple law to build a fortress.

  ### Does any reading survive your colleague's objection?

  Your colleague is right that the **Logical Contradiction Claim (4)** is nonsense. Constitutions work by binding successors all the time. The US Congress cannot pass a law violating the First Amendment, not because they lack the physical power to write the text, but because the rulebook says the Supreme Court will stop them.

  However, the **Legal Incompetence Claim (1)** survives your colleague's objection, but only as a matter of *local custom*, not universal logic.

  Here is the distinction: A Ulysses contract requires an external enforcer or a change in the decision-making mechanism that the agent cannot unilaterally override. In the UK, Parliament *is* the enforcer. It is the judge in its own cause. Therefore, a Ulysses contract only works if Parliament changes the identity of the judge. As long as the UK remains a system of Parliamentary Sovereignty, Parliament cannot tie its own hands because it can always untie them.

  In countries with codified constitutions, the 'Parliament' is not sovereign; the Constitution is. In the UK, Parliament is sovereign. Therefore, the maxim holds here, but it would be false in Washington or Berlin. Your colleague is applying a general theory of constitutions to a specific British anomaly.

  ### The Final Pick

  You asked me to pick and defend the true meaning of the sentence. Here it is:

  **'No Parliament can bind its successors' is not a law of nature, nor a logical truth. It is a description of a specific power dynamic between the British Judiciary and the Legislature.**

  It is **True** only insofar as British judges currently choose to obey the most recent Act of Parliament over previous procedural constraints. It is **False** as a statement of political reality (since political costs do bind successors) and **False** as a statement of logic (since Ulysses contracts are coherent).

  The barrister used it correctly to describe the legal fragility of climate targets. The campaigner used it incorrectly to suggest a moral imperative. Your colleague used it correctly to identify that the UK system lacks the machinery of a true Ulysses contract.

  If you want to entrench climate targets, you cannot just pass a law. You must change the rule of recognition itself. You must move from a system where Parliament is the master of the law, to one where the Law is the master of Parliament. Until then, the maxim stands: not because it must, but because the judges say so.
