  *   **Principle:** Burdens imposed on a minority for the sake of a majority are presumptively permissible unless the burden is severe. Burdens imposed on a majority for the sake of a minority are presumptively impermissible regardless of benefit size.
  *   **Fit:** Explains Case 1, 3, 5 (Few -> Many, Approve) and Case 4 (Many -> Few, Reject). Case 2 is the exception where severity overrides the flow.
