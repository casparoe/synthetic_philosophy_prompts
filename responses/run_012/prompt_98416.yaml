answer: |-
  # The Pramāṇa Specification: Desiderata for a Theory of Knowledge Sources

  This document outlines the functional requirements for any system claiming to account for the sources of knowledge (*pramāṇas*). It does not prescribe a specific school's ontology. It defines the problems the system must solve to be viable.

  ### 1. The Error Constraint
  *   **Motivation:** The Shell/Silver case. A subject cognizes silver where there is only shell. The theory must explain how a source produces false content without rendering the source itself globally unreliable. If perception produces error, is perception broken, or is the error located elsewhere (e.g., memory, conditions)?
  *   **Status:** **Genuine Requirement.** A theory of knowledge that cannot distinguish truth from falsity is not epistemology; it is psychology.
  *   **⚠️ Tension:** Conflicts with **Locus of Validity (Intrinsic)**. If a cognition reveals its own truth immediately, error becomes inexplicable without ad hoc patches.
  *   **ML Stress Test:** **Admits.** ML hallucinates. The system passes if it can categorize a hallucination as a failure of conditions (data noise) rather than a failure of the architecture itself.

  ### 2. The Universal Connection Constraint
  *   **Motivation:** The Smoke/Hill case. Inference relies on a universal relation (where there is smoke, there is fire). Since no agent observes all instances of smoke and fire, the theory must account for how this connection is known. Is it perceived? Induced? Stipulated?
  *   **Status:** **Genuine Requirement.** Without an account of the major premise, inference collapses into guesswork.
  *   **⚠️ Tension:** Conflicts with **The Absence Constraint**. If universals are known by perception, does that perception include negative instances (absence of fire without absence of smoke)?
  *   **ML Stress Test:** **Excludes.** ML operates on statistical correlation, not universal necessity (*vyāpti*). It finds "high probability," not "invariable concomitance." To admit ML, this requirement must be downgraded from *necessity* to *probability*.

  ### 3. The Comparison Constraint
  *   **Motivation:** The Wild-Ox case. A subject learns what a *gavaya* is by being told it resembles a cow. Is this a distinct source, or just inference + memory? The theory must decide if resemblance-based learning is a primitive operation.
  *   **Status:** **Sectarian Prejudice.** This is an economy-of-principles dispute. Reducing it to inference is cleaner; keeping it distinct is more phenomenologically accurate.
  *   **⚠️ Tension:** Conflicts with **The Individuation Criterion**. If processes are individuated by object, this is distinct. If by cognitive mechanism, it may collapse into inference.
  *   **ML Stress Test:** **Borderline.** Few-shot learning and transfer learning look exactly like this. If the theory rejects *upamāna* as distinct, it must classify modern pattern-matching as inference, which strains the definition of inference.

  ### 4. The Testimony Constraint
  *   **Motivation:** The Word case. Can language transmit knowledge directly, or must the hearer first infer the speaker's reliability? The theory must state if trust is default or earned.
  *   **Status:** **Sectarian Prejudice.** Default trust (Mīmāṃsā style) is socially efficient but risky. Earned trust (Buddhist style) is safer but leads to skepticism about history/testimony.
  *   **⚠️ Tension:** Conflicts with **The Locus of Validity (Extrinsic)**. If testimony is intrinsically valid, external verification shouldn't be needed.
  *   **ML Stress Test:** **Admits (if Irreducible).** We treat AI output as testimony. We do not infer the reliability of the weights; we accept the token. If the theory demands reliability inference first, AI is excluded.

  ### 5. The Novelty Constraint
  *   **Motivation:** The Memory case. Must knowledge be a *new* cognition? If I remember a fact I knew yesterday, is that knowledge again, or just retention?
  *   **Status:** **Stipulative.** This defines the *telos* of the system. If the goal is acquisition, memory is out. If the goal is truth-preservation, memory is in.
  *   **⚠️ Tension:** Conflicts with **The Defeasibility Constraint**. If memory preserves knowledge, does it preserve defeated knowledge (things I knew but should now have forgotten)?
  *   **ML Stress Test:** **Excludes (if Strict).** Retrieval-Augmented Generation (RAG) is essentially memory. If *pramā* requires novelty, retrieving a stored fact is not a knowledge event.

  ### 6. The Doubt Constraint
  *   **Motivation:** The Uncertainty case. Is doubt a lack of knowledge or a positive cognitive state? The theory must distinguish "I don't know" from "I know falsely."
  *   **Status:** **Genuine Requirement.** A binary True/False system cannot model inquiry.
  *   **⚠️ Tension:** Conflicts with **The Locus of Validity (Intrinsic)**. If valid cognitions are self-luminous, doubt should be impossible regarding a present cognition.
  *   **ML Stress Test:** **Admits.** Confidence scores (logits) allow for a formalized state of doubt (e.g., 0.55 probability). The system handles this well if doubt is quantitative.

  ### 7. The Individuation Criterion (The Counting Problem)
  *   **Motivation:** The Number case. Why are there four sources? Six? Two? The theory must provide a principle for counting. Is it by sense organ? By object type? By cognitive process? Without this, the list is arbitrary.
  *   **Status:** **Genuine Requirement (Meta).** This is the most frequently ignored requirement. Without it, the list is a laundry list, not a taxonomy.
  *   **⚠️ Tension:** Conflicts with **The Comparison Constraint** and **The Testimony Constraint**. Most traditional counts fail their own individuation criteria (e.g., mixing process-based and object-based distinctions).
  *   **ML Stress Test:** **Borderline.** Is ML a new *pramāṇa*? If individuation is by *process* (neural net vs. human brain), yes. If by *object* (empirical facts), no. This requirement forces a decision that most schools evade.

  ### 8. The Locus of Validity
  *   **Motivation:** The Warrant case. Does a cognition carry its own warranty (Intrinsic), or must it be verified by successful action/other sources (Extrinsic)?
  *   **Status:** **Sectarian Prejudice.** Intrinsic validity avoids infinite regress. Extrinsic validity avoids dogmatism.
  *   **⚠️ Tension:** **Jointly Unsatisfiable with The Error Constraint.** If validity is intrinsic, error is hard to explain. If extrinsic, you need a second source to validate the first, risking regress.
  *   **ML Stress Test:** **Excludes (if Intrinsic).** ML is a black box. The output does not reveal its own correctness. It *requires* extrinsic validation (human feedback, ground truth).

  ### 9. The Defeasibility Constraint
  *   **Motivation:** The Mirage case. I see water; I walk there; it is sand. Was the first cognition knowledge *at the time*? The theory must handle retroactive overturning.
  *   **Status:** **Genuine Requirement.** Fallibilism is necessary for empirical systems.
  *   **⚠️ Tension:** Conflicts with **The Locus of Validity (Intrinsic)**. If I knew it intrinsically, how can I be wrong later?
  *   **ML Stress Test:** **Admits.** Model versioning handles this. v1.0 output is "defeated" by v2.0. The system treats knowledge as provisional.

  ### 10. The Absence Constraint
  *   **Motivation:** The Empty Table case. Do I perceive the *absence* of a cup, or do I perceive the table and infer the cup's absence?
  *   **Status:** **Sectarian Prejudice.** Realists tend to perceive absence; Nominalists tend to infer it.
  *   **⚠️ Tension:** Conflicts with **The Universal Connection Constraint**. If absence is perceived, do we need inference for negatives at all?
  *   **ML Stress Test:** **Admits.** Object detection systems output "null" classes. They treat absence as a positive detection state (confidence score for "no pedestrian").

  ***

  ### Joint Unsatisfiability Flags
  The most critical tension in this spec is between **The Locus of Validity (Intrinsic)** and **The Error/Defeat Constraints**. You cannot claim cognitions are self-validating while simultaneously admitting they are frequently false or defeasible. A system must choose: either validity is intrinsic and error is an external contamination (hard to define), or validity is extrinsic and knowledge is always provisional (hard to ground).

  Regarding **Algorithmic Deliverance (ML)**: The list **conditionally admits** ML, but only if you drop **Intrinsic Validity** and relax the **Universal Connection Constraint**. If you hold firm on Intrinsic Validity, ML is excluded immediately (black boxes cannot be self-validating). If you hold firm on Universal Connection, ML is excluded (statistics are not necessity). However, if you admit ML, **The Testimony Constraint** becomes toothless: if we accept AI output without inferring reliability, we have accepted irreducible testimony, which forces the entire seminar to adopt a Mīmāṃsā-like stance toward software.

  ### The Killer Requirement
  **The Individuation Criterion** knocks out the most contenders because most traditional systems list *pramāṇas* by mixing ontological objects with psychological processes, and forcing a single consistent metric dissolves their preferred count.
