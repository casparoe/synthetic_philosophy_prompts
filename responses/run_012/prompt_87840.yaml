answer: |-
  Dear Friend,

  It is a pleasure to engage with you on this difficult and famous passage from Thucydides. You have brought a sophisticated analytical framework to the text, and your intuition about the logic of penalties is sharp, though I suspect the specific distinction you are drawing between first-order and second-order deterrence requires some adjustment when applied to this specific segment of Diodotus' speech. Your hypothesis is that Diodotus is arguing about the second-order failure of capital punishment, meaning that once a rebel has committed to the act, the death penalty offers no marginal incentive to surrender because nothing worse can be threatened. While this is indeed a crucial part of Diodotus' overall strategy in the Mytilene debate, the passage you have quoted here is primarily concerned with what you would call first-order deterrence, or the failure of threats to prevent the initial decision to offend.

  When Diodotus writes that penalties have been escalated over time because lighter ones were disregarded, and that the death penalty is now disregarded in like manner, he is describing a historical pattern of failed prevention. He is arguing that the threat of death does not stop states or individuals from embarking on rebellion in the first place. The sentence you highlighted, which begins Either then some means of terror more terrible than this must be discovered, functions as a rhetorical dilemma regarding the capacity of law to restrain human action prior to the crime. He is asserting that if the goal of punishment is to prevent evil-doing through fear, and if people commit evil despite the fear of death, then the mechanism of terror has failed to achieve its preventive purpose. The second-order argument, regarding the decision to persist or surrender during a siege, appears later in his speech when he warns that if you punish allies and rebels alike, rebels will have no incentive to surrender early and will fight to the last man. Therefore, while your distinction is an excellent tool for organizing Diodotus' full argument, applying the second-order label to this specific passage might obscure his immediate point about the psychological inevitability of error regardless of the threatened consequence.

  This leads directly to your question about whether Diodotus means the death penalty is literally useless or merely insufficient. In the context of the sentence you cited, he is claiming it is useless as a secure restraint against human nature. He is not necessarily making a modern statistical claim that the death penalty has zero marginal deterrent effect on every individual. Rather, he is making a policy claim that severity cannot be relied upon to produce security. When he says the restraint is useless, he means it is incapable of fulfilling the function Cleon wants it to fulfill, which is the guaranteed prevention of future revolts. The logic here is driven by his anthropology of human motivation. He lists poverty, plenty, ambition, and passion as master forces that drive men into danger. His argument is that these internal drives are so potent that no external threat, short of something worse than death which does not exist, can reliably counteract them. Therefore, for the purpose of designing a stable imperial policy, relying on the death penalty is useless because it cannot solve the problem of human impulsiveness and ambition.

  You are quite right to ask whether this argument is vulnerable to the objection that a penalty can deter even if it is sometimes disregarded. From a modern game-theoretic or econometric perspective, Diodotus seems to commit a fallacy by moving from the observation that some people still rebel to the conclusion that the threat is useless. A charitable reconstruction, however, suggests that Diodotus is not arguing about the absolute number of revolts but about the reliability of severity as a tool of statecraft. His point is that because human passion is variable and unpredictable, a policy based on maximum severity will inevitably fail at critical moments. If your security depends on the assumption that the death penalty will stop all revolts, you are insecure, because history shows men will disregard it. Furthermore, he is hinting at the diminishing returns of severity. If you have already maxed out the penalty at death, you have no room to maneuver when faced with different degrees of offense or different stages of a rebellion. Thus, the argument is less that the death penalty deters no one, and more that it is an blunt instrument that cannot calibrate with the complex motivations of human beings, rendering it an unreliable foundation for peace.

  To reconstruct the strongest version of his position, we should view him not as a pacifist denying all deterrent effects, but as a pragmatist analyzing the incentives of a hegemon. He is arguing that because first-order deterrence is imperfect due to human nature, the empire must focus on the management of consequences rather than the illusion of prevention through terror. If you cannot prevent the revolt through fear, you must ensure that when revolts happen, you do not make them worse by forcing enemies to fight to the death. This connects your interest in second-order deterrence back into the whole speech. The death penalty is counter-productive not just because it fails to stop the initial revolt, but because once the revolt has begun, it removes the ladder for the enemy to climb down. So, while the specific passage you quoted focuses on the inability of law to curb passion, the broader argument validates your intuition that the structure of penalties affects the duration and intensity of conflict. Diodotus is ultimately suggesting that a policy of moderation is more effective than a policy of severity, not because moderation is kinder, but because it preserves the incentives for surrender and future loyalty, whereas severity exhausts the list of punishments and leaves the empire with no leverage.

  I hope this helps clarify the texture of the argument. You are reading the text with the right level of skepticism and analytical rigor, and simply adjusting the placement of your first-order and second-order distinction across the speech should align your framework perfectly with Thucydides' logic.

  Warmly,

  Your Assistant
