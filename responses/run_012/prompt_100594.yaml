      *   Closing encouragement.

  8.  *(Self-Correction on the Orwellian/Stalinesque point)*: I need to be careful. Dennett uses the terms to show that *neuroscience cannot distinguish them*, therefore the distinction is not scientifically useful. He doesn't necessarily prove Orwellian is *true* in a literal memory-rewrite sense, but that the *effect* is indistinguishable from it. However, the pop-sci claim that he "shows the Orwellian version is the correct one" is a strong misrepresentation of his "Multiple Drafts" view which dissolves the timeline. I will flag this as a significant distortion.

