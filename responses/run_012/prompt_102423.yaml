          *   *Actually, let's go deeper.* The prompt asks about "Self-Command... like somebody signs a contract with a future addict." This implies the Ulysses Contract.
          *   *The True Test:* A case where the patient is *incapacitated*, never revoked the directive, but their *current state* suggests they would choose differently if they could (e.g., the Happy Dementia case).
          *   *Wait, I need to be precise.* If the committee honors the capacitated woman's wish to dialyze (which they must), they are rejecting the "Self-Command" view *in the context of capacity*.
