answer: |-
  Here is the battle plan for 75 minutes.

  ### 1. The Dependency Order
  You are half-right, but you're missing the linchpin. The order of operations required to make "free-floating rationale" (FFR) stick without collapsing into mysticism or eliminationism is:

  1.  **Competence without Comprehension:** (The Linchpin). You must establish that a system can *do* the right thing for the right reason without *knowing* the reason. If you skip this, the Behaviorist reduces it to "mechanism" and the Cog-Sci person inflates it to "sub-agency." **Do not hand-wave this.** It is the only shield against the "it's just physics" objection.
  2.  **The Cause/Reason Distinction:** You need this to separate *why the event happened* (causal push) from *why the trait exists* (rationale). You can hand-wave the metaphysics here. A pragmatic distinction suffices: "Causes push from behind; rationales pull from the front (in terms of selection history)."
  3.  **Normativity:** You need a notion of "better/worse" that isn't just "different." However, you can outsource this to natural selection. Don't try to ground norms metaphysically; ground them in differential replication.

  **The Fatal Skip:** If you skip **Competence without Comprehension**, the session slides off. The Behaviorist will claim you are anthropomorphizing mechanics; the ML person will claim you are reifying the loss function. You need to prove the *competence* is real before you argue the *rationale* is free-floating.

  ### 2. The Carrying Example
  **Case:** **Somatic Hypermutation & Affinity Maturation in the Vertebrate Immune System.**

  *   **Why it works:**
      *   **Rationale:** "Find the antigen shape that neutralizes the pathogen." This is plainly there; the system succeeds or fails based on this.
      *   **No Representation:** No B-cell "knows" the strategy. The "search algorithm" is physical (mutation rates, binding affinities), not computational in the representational sense.
      *   **Tempting Reduction:**
          *   *Behaviorist:* "It's just chemistry. Binding affinities and concentration gradients."
          *   *ML Person:* "It's an evolutionary algorithm minimizing a loss function (binding error)."
      *   **The Bridge:** It looks exactly like Reinforcement Learning (explore variants, exploit winners), which triggers the ML person, but the "reward" (binding success) is a physical causal outcome, not a scalar signal fed back into a controller. This forces the distinction between a *physical consequence that selects* vs. a *reward signal that guides*.

  ### 3. Misconceptions & Interception Points
  Your predictions are accurate, but the order matters. Here is the sequence of emergence and where to kill them:

  1.  **"It's just a metaphor / projection." (The Behaviorist)**
      *   *When:* Immediately upon introducing the example.
      *   *Interception:* Pre-empt this in the **Competence** setup. "We aren't saying the cell *thinks*. We are saying the *process* embodies a logic that persists even if no agent grasps it. If it were just metaphor, we couldn't engineer vaccines based on it."
  2.  **"It's just Etiological Function." (The Phil of Bio peers)**
      *   *When:* Once you define the rationale.
      *   *Interception:* Distinguish *token* vs. *type*. Etiological function explains why the *trait type* exists. FFR explains the *logic of the token process* in real-time. The rationale guides the *search* within the lifetime, not just the selection across generations.
  3.  **"It's just a Reward Signal." (The ML Person)**
      *   *When:* During the Immune System analysis.
      *   *Interception:* This is crucial. A reward signal in RL is information *for* the system to update weights. Binding affinity in the immune system is a *causal filter* that destroys the loser. The rationale exists in the *survival of the structure*, not in the *updating of a model*.
  4.  **"There's a distributed reasoner." (The Cog-Sci/Neuro folks)**
      *   *When:* Closing synthesis.
      *   *Interception:* "Distributed reasoner" implies the reason is still *in* the system, just spread out. FFR says the reason is in the *relation between system and environment* sustained by selection. The reason is external to the mechanism, even if the mechanism embodies it.

  ### 4. What to Explicitly Bracket
  State this at minute 5 to save time:
  *   **Teleosemantics:** We are not discussing content or truth conditions. We are discussing goal-directedness without a goal-representer.
  *   **The Naturalization of Norms:** We are assuming selection provides the normative grip. We are not defending that assumption today.
  *   **Conscious Intent:** Explicitly state that "reason" here does not imply consciousness. If anyone brings up qualia, park it.

  ### 5. The "Gotcha" Question
  Do not ask them to define the term. Ask them to apply it to a **failure case**.

  **The Question:**
  > "Consider a B-cell that mutates to bind perfectly to a self-antigen (autoimmunity). It has high competence, it follows the same mechanistic logic, and it 'succeeds' at binding. Does the Free-Floating Rationale still apply here? If yes, is the rationale 'bind antigens' or 'preserve the host'? If no, at what physical step did the rationale vanish?"

  **Why this works:** It forces them to distinguish between the *local logic of the mechanism* (bind stuff) and the *historical rationale of the design* (protect host). If they conflate them, they haven't grasped that FFR is tied to the *selection history*, not just the current causal power.

  ### 6. The Soft Spot: The Design Stance Objection
  **The Objection:** "This is just the Design Stance. You're saying 'FFR' when you mean 'It is useful for us to predict this system as if it had a reason.' You haven't added ontology, just vocabulary."

  **Where it bites:** If FFR is just *our* heuristic, the Behaviorist wins. It means the "reason" isn't in the world, it's in our head. That kills the realist intuition you need for Phil Bio.

  **The Two-Minute Reply:**
  > "The Design Stance is epistemic; it's about *our* prediction strategy. Free-Floating Rationale is explanatory; it's about *the system's* causal history.
  >
  > I can take the Design Stance toward a rock and predict it will fall (it 'wants' to minimize potential energy). But there is no FFR there, because there was no selection process that sifted rocks for falling efficiency.
  >
  > With the immune system, the rationale is causally active in the history of the organism. It's not just that *we* find it useful to treat the B-cell as rational; it's that the B-cell's structure was *caused* by the pressure of that rationale over evolutionary time. The Design Stance works *because* the FFR is real. If you reduce FFR to the Design Stance, you lose the explanation for why the Design Stance works on organisms but not on rocks."

  **Timing Breakdown:**
  *   0-5: Setup & Bracketing.
  *   5-20: Competence without Comprehension (The Linchpin).
  *   20-45: Immune System Case Study (Intercept ML & Behaviorist here).
  *   45-60: Misconception Cleanup (Phil Bio & Cog-Sci objections).
  *   60-70: The Soft Spot (Design Stance).
  *   70-75: The Gotcha Question & Wrap.
