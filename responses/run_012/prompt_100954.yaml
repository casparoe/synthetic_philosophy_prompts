answer: |-
  | Ship of Theseus | Structural Realism |
  | :--- | :--- |
  | **Planks** | Theoretical entities (ether, caloric, phlogiston) |
  | **Form/Shape** | Mathematical relations and structural equations |
  | **The Ship** | The theory (or cumulative scientific knowledge) |
  | **Shipwright** | The scientific community |
  | **Voyage/Harbour** | Empirical adequacy / Progress towards truth |
  | **'Same Ship?'** | Reference continuity / Theory identity |

  **Audit of the Analogy**

  While pedagogically vivid, the Ship of Theseus (SoT) analogy fails to sustain the philosophical weight your colleague assigns it. It obscures critical difficulties in structural realism (SR) rather than resolving them.

  **Picturesque Disanalogies**
  The roles of the **Shipwright** and the **Voyage** are merely decorative. Scientists are not merely builders maintaining a vessel; they are often competing architects designing distinct ships. Similarly, science lacks the teleological harbour implied by a voyage; empirical adequacy does not guarantee convergence on a single destination. These discrepancies do not invalidate the core argument but remind us that scientific progress is not as linear as a sea journey.

  **Fatal Disanalogies**
  Your suspicions identify the fatal flaws.

  1.  **The Abstraction Problem (Your First Suspicion):** In the SoT, the ship's form is physically constrained; you cannot abstract any shape you like from the planks. In SR, 'structure' is a mathematical abstraction. As Newman (1928) objected, any set of objects can be described as sharing *some* structure if the description is sufficiently flexible. The analogy implies structure is 'given' like a hull's shape, whereas in science, structural retention is often a post hoc reconstruction. If any theory can be mapped to share structure with its successor, the 'surviving form' explains nothing. This is fatal to the inference that structure warrants realism.

  2.  **Gradualism vs. Revolution (Your Second Suspicion):** The SoT presupposes gradual replacement. Theory change is often revolutionary (Kuhn), involving wholesale rebuilding where the form itself is revised. For instance, the shift from Newtonian to Relativistic spacetime altered the underlying structural geometry, not just the entities. The analogy cannot account for cases where the 'form' is discarded alongside the 'planks'. If structure does not always persist, the analogy cannot justify realism about structure generally.

  3.  **Identity Criteria (Your Third Suspicion):** The SoT question ('is it the same ship?') relies on spatiotemporal continuity. The realist's question concerns reference and truth-approximation. A theory can retain structural equations while the terms refer to nothing (e.g., Fresnel's equations worked, but 'ether' did not refer). Continuity of form does not guarantee retention of content or reference. Conflating spatiotemporal continuity with semantic continuity is a category error that undermines the argument for referential realism.

  **Verdict**
  The conclusion—that realism about structure follows from the persistence of form—does not survive this audit. The analogy smuggles in the assumption that structure is robust and non-trivial, bypassing the Newman problem and the reality of structural ruptures during revolutions. It suggests continuity where there may be incommensurability.

  **Recommendation**
  Abandon the analogy. It offers rhetorical comfort but no logical leverage. A more rigorous approach involves examining specific case studies (e.g., Fresnel to Maxwell) to demonstrate *which* structures are retained and *why* they warrant belief, rather than relying on a metaphysical puzzle about identity. If a comparison is necessary, consider **map-making**: old maps may retain accurate contours (structure) despite mislabelling territories (entities). However, even this fails if the projection method (theoretical framework) changes fundamentally. Ultimately, structural realism requires formal defence, not nautical metaphors.
