      *   *Weizenbaum's Setup:* User (Secretary), Machine (ELIZA), No Competitor (no human foil), No Time Limit, No Deception Goal (initially), *Known* Machinery (Secretary knew it was code).
      *   *The Judgment:* Turing = "Is this human?" ELIZA Case = "Is this a listener who understands me?" (even if known to be code).
