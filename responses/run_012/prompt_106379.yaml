      *   *The Machinery:* Turing says ignore it. Weizenbaum says look at it. Secretary says it doesn't matter. This breaks the test. The test assumes ignorance; the Secretary had knowledge. The criterion fails when the "black box" is transparent but the behavior persists.
      *   *Eugene Goostman:* Compare the "fooling." ELIZA = emotional hook. Eugene = evasion hook. Both show the variable is the *judge*, not the *machine*.
      *   *Conclusion:* Defenders must abandon the claim that the test detects *consciousness*. They must keep the claim that the test defines *social agency*.

