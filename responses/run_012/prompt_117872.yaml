  # Diagnostic Instrument: The Epistemology of Testimony

  ## I. Working Vocabulary
  To ensure precision, the following stipulations govern the decision tree. 

  *   **Zero-Evidence Hearer:** A hearer who possesses no evidence bearing on a speaker's reliability (no track record, no competence/honesty info, no background view on community trustworthiness).
  *   **Thin-Evidence Hearer:** A hearer who possesses grounds for assessing the speaker, but only grounds inherited from earlier testimony.
  *   **Transmissive View:** The hearer's justification is the speaker's own justification transferred to the hearer.
  *   **Generative View:** The hearer's belief is justified by the hearer's own epistemic position or practice, whether or not the speaker had justification to transmit.
  *   **Occasion-Bound:** The hearer must have her grounds available and active at the specific moment of acceptance.
  *   **Background:** A general standing basis or accumulated history suffices; grounds need not be activated at the moment of acceptance.

  ## II. Logical Space
  The following eight questions define the logical space. Each question permits the indicated answers. Combinations of answers that do not lead to a leaf position in Section III are flagged as unoccupied in Section IV.

  1.  **Zero-Evidence Justification:** In the root case (zero-evidence hearer), is the hearer *prima facie* justified immediately upon hearing, or only after securing positive grounds?
      *   *Immediate* (Proceed to Q6)
      *   *Needs Grounds* (Proceed to Q2)
  2.  **Evidence Source:** If grounds are needed, must they be non-testimonial (observation/induction), or can they be thin-evidence (inherited from prior testimony)?
      *   *Non-Testimonial Only* (Leaf F)
      *   *Thin-Evidence Permitted* (Proceed to Q3)
  3.  **Temporal Scope:** Must the hearer verify reliability on this specific occasion, or does a background history of confirmation suffice?
      *   *Occasion-Bound* (Proceed to Q4)
      *   *Background* (Proceed to Q5)
  4.  **Local Prejudice Status:** When a hearer is discounted on grounds irrelevant to reliability (e.g., prejudice) in a specific instance, is this primarily an epistemic failure in the audience or a social wrong done to the speaker?
      *   *Epistemic Failure* (Leaf A)
      *   *Social Wrong* (Leaf G)
  5.  **Global Prejudice Status:** When a hearer is discounted on grounds irrelevant to reliability due to structural bias, is this primarily an epistemic failure in the audience or a social wrong done to the speaker?
      *   *Epistemic Failure* (Leaf B)
      *   *Social Wrong* (Leaf H)
  6.  **Source of Right:** If justification is immediate, does it flow from the speaker's authority (Transmissive) or the hearer's status/practice (Generative)?
      *   *Transmissive* (Proceed to Q7)
      *   *Generative* (Proceed to Q8)
  7.  **Nature of Relation:** If transmissive, is the relation based on interpersonal responsibility or institutional role?
      *   *Interpersonal Responsibility* (Leaf D)
      *   *Institutional Role* (Leaf I)
  8.  **Basis of Entitlement:** If generative, is the basis a standing entitlement or the reliability of the cognitive practice?
      *   *Standing Entitlement* (Leaf C)
      *   *Reliable Practice* (Leaf E)

  ## III. Position Locator
  Answer the questions in Section II to arrive at one of the following nine leaves.

  *   **Leaf (a): Local Reductionism.** The hearer must be able to reconstruct the speaker's reliability from evidence available to her, with the requirement imposed anew on every occasion; credibility discounting on irrelevant grounds is an audience error.
  *   **Leaf (b): Global Reductionism.** The same as (a), except that a general background of experience discharges the requirement; credibility discounting on irrelevant grounds is an audience error.
  *   **Leaf (c): Default Justification.** The hearer needs no evidence at all, because she has a standing entitlement to accept what she is told.
  *   **Leaf (d): Assurance View.** The hearer's justification consists in the speaker's having assumed responsibility for the truth of what she says, so that the hearer's relation to her is interpersonal rather than evidential.
  *   **Leaf (e): Reliabilism.** The hearer's belief is justified because accepting testimony is a reliable or virtuous practice, whatever the hearer could articulate in its defence.
  *   **Leaf (f): Evidentialism.** Testimony is not a distinct epistemic category at all and is assessed like any other evidence (non-testimonial inference).
  *   **Leaf (g): Local Structuralism.** Even when reliability must be checked locally, systematic discounting on irrelevant grounds is a social wrong rather than an audience error.
  *   **Leaf (h): Global Structuralism.** Even when reliability is checked against background experience, systematic discounting on irrelevant grounds is a social wrong rather than an audience error.
  *   **Leaf (i): Institutional Authority.** The speaker's justification is transmitted via their institutional role rather than interpersonal assurance.

  ## IV. Diagnostic Analysis

  ### A. Embarrassing Commitments
  Each position entails a commitment that may embarrass its holder under scrutiny.

  *   **(a)** You must interrogate every stranger before believing them, or else you are irrational.
  *   **(b)** You are only rational if your entire life's experience confirms speakers, making childhood learning impossible.
  *   **(c)** You are entitled to believe absurdities unless you specifically suspect them.
  *   **(d)** You cannot believe a liar even if they happen to tell the truth, because the relationship is broken.
  *   **(e)** You know things you cannot defend, making knowledge indistinguishable from lucky habit.
  *   **(f)** You learn nothing from others that you could not have observed yourself.
  *   **(g)** You must treat local credibility errors as structural crimes, potentially excusing individual negligence.
  *   **(h)** You must treat background credibility errors as structural crimes, potentially overriding all individual evidential assessments.
  *   **(i)** You must obey institutional roles even when the office-holder is personally untrustworthy.

  ### B. Unoccupied Combinations
  The following combinations of answers from Section II are left unoccupied by the tree.

  1.  **Transmissive + Needs Grounds (Q1: Needs Grounds + Q6: Transmissive).**
      *   *Status:* **Incoherent.** If justification is transmissive, the speaker's act provides the warrant; requiring the hearer to gather independent grounds negates the transmission.
  2.  **Thin-Evidence + Immediate Justification (Q1: Immediate + Q2: Thin-Evidence).**
      *   *Status:* **Undefended.** If justification is immediate, the hearer does not need evidence; positing thin-evidence in this branch adds a constraint without a function.
  3.  **Transmissive + Background (Q6: Transmissive + Q3: Background).**
      *   *Status:* **Unattractive.** Assurance is typically an occurrent act; relying on a background view of an institution without present assurance collapses into Institutional Authority (Leaf i) or Global Reductionism (Leaf b).

  ### C. Indistinguishable Leaves
  The tree cannot fully separate the following two leaves using the current questions.

  *   **Leaves:** (c) Default Justification and (e) Reliabilism.
  *   **Reason:** Both occupy the "Immediate + Generative" branch and result in the verdict that the zero-evidence hearer is justified without positive evidence.
  *   **Further Question:** "If the practice of testimony were discovered to be globally unreliable, would the hearer still be justified?"
      *   *Leaf (c) Answer:* Yes (Entitlement is *a priori*).
      *   *Leaf (e) Answer:* No (Justification depends on actual reliability).
