answer: |-
  **Conference Room B, 11:45 PM**

  **Marcus:** (Tapping the policy draft) Clause four is the dealbreaker, Elena. You can't put it in writing that a dead person can come back to life.

  **Elena:** They aren't coming back to *life*, Marcus. They're exhibiting auto-resuscitation before we confirm permanence. There's a difference.

  **Marcus:** The policy says if the heart beats on its own during the ninety-minute goodbye window, the death declaration is void. Legally, that means we killed a living person ten minutes prior when we signed the certificate. You're building a resurrection clause into the definition of death.

  **Elena:** I'm building a safety valve into a pragmatic protocol. Look, we wait the no-touch interval. We declare death based on permanent cessation of circulation. Then, strictly for family closure, we perfuse the body to prevent mottling for an hour and a half. If the heart kicks in spontaneously—which is rare, but happens—we admit we were wrong about the *permanence*. We don't admit we were wrong about the *biology*.

  **Marcus:** But permanence is the only biology you have! Your whole criterion hinges on the heart not starting again. If it starts again, your criterion failed. My criterion doesn't have this problem. If the brain is dead, it's dead. You can pump blood into a skull until the sun burns out, but if the integration is gone, the organism is dead.

  **Elena:** Oh, come on. The "integration" argument is wearing thin. You've got whole-brain dead patients on ventilators who heal wounds, fight infections, and even gestate fetuses. Their hearts beat warmly. You call that a corpse; I call that a patient we've decided not to treat. Why is your line metaphysically superior if the body is doing exactly what living bodies do?

  **Marcus:** Because the body isn't driving the bus. It's a sum of parts without a whole. The brain is the unique integrator. When it's gone, what's left is biologically maintained, not biologically functioning. But look at your mess here. Clause two sets the no-touch interval at two minutes. That's too short. You're declaring death before cellular irreversibility is guaranteed. Then clause three lets you hook them to a pump. You're intervening on a corpse?

  **Elena:** We're intervening on a body to help the family say goodbye without seeing their loved one turn gray. It's humane. And two minutes is standard for DCD (Donation after Circulatory Death). We know circulation won't return spontaneously after that window *unless* we intervene.

  **Marcus:** But clause four says if it *does* return, they're alive. So, at minute three, they're dead. At minute forty, if the heart flickers, they're alive again. You've made death a provisional status dependent on a timer.

  **Elena:** Death is always provisional on our ability to intervene. That's the thing you won't admit. When you declare brain death, you're saying, "We cannot fix this." When I declare circulatory death, I'm saying, "We will not fix this." The irreversibility is tied to the decision not to resuscitate. Clause four just acknowledges that sometimes biology surprises us before the decision is fully settled.

  **Marcus:** That makes death a social construct, Elena. It depends on what the doctors decide to do. If I walk into a room and see a stopped heart, I don't know if the person is dead until I check the chart to see if you *planned* to restart it? That's incoherent.

  **Elena:** And your view is incoherent because you declare death while the heart is beating. You tell a family, "He's dead," while the chest is rising and falling. You rely on a neurological exam that can be confounded by drugs or hypothermia. At least my criterion is visible. When the heart stops and stays stopped, everyone knows what death looks like. Your clause four problem? It's just honesty. We're admitting there's a tiny window of uncertainty.

  **Marcus:** It's not honesty, it's contradiction. If I'm dead, you can't bring me back. If you can bring me back, I wasn't dead. By allowing the declaration to be voided, you're admitting the circulatory criterion can't identify the moment of death, only the moment of *no return*.

  **Elena:** Exactly. The moment of no return. That's all death ever was. You just pretend the brain gives you a magic timestamp it doesn't actually provide.

  **Marcus:** The brain gives me the loss of the organism. You're giving me the loss of a function we chose to stop supporting.

  **Elena:** And yet, here we are. Both of us agreeing this patient isn't waking up. Both of us agreeing the organs are viable. The only difference is whether we let the family hold a warm hand for ninety minutes without violating the law.

  **Marcus:** I don't mind the warm hand. I mind the legal fiction that the hand belongs to someone who briefly ceased to exist.

  **Elena:** Then write a better policy. But until you can explain why a beating heart makes your patient dead and a pumped heart makes mine alive, don't talk to me about coherence.

