  *   **Part 3: The 5 Subprojects (Ranked).** With the required 4 metrics for each.
  *   **Part 4: Closing Advice.** Keystone, Shifters, Drop.

  *Refining the "Keystone":* Is it Functionalism or Symmetries? Functionalism is more upstream because it defines the target. If "law" is a cluster, symmetries might only fill *one* role. So Functionalism is the true keystone.

  *Refining the "Drop":* "Grounding" is the obvious choice for a physics-heavy panel. "Humean Supervenience yes/no" is also a trap, but "Grounding" is more specifically alienating to naturalists. I'll recommend dropping the *pure* Grounding debate in favor of *structural* explanation.

