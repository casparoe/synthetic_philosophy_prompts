answer: |-
  1. **The Feature Vocabulary Presupposition**
  If the core cognitive task is discarding irrelevant dimensions to find the signal, doesn't your model presuppose a fixed inventory of dimensions that the solver is already in possession of, thereby begging the question against the view that Bongard problems test the ability to *invent* features?
  *Follow-up Direction:* If she claims features are low-level perceptual primitives, press her on whether high-level geometric relations (like "concavity" or "pointing") can truly be considered innate primitives without inflating the vocabulary to absurdity.

  2. **Measuring Contrastive Redundancy**
  You define the core signal as "contrastive redundancy," but is this a property of the stimulus itself that can be computed objectively, or is the measure inherently relative to the observer's specific perceptual encoding?
  *Follow-up Direction:* If she argues it is observer-relative but biologically constrained, press her on whether this renders the theory unfalsifiable when accounting for individual differences in perceptual expertise.

  3. **The Cognitive Cost of Discarding**
  If difficulty tracks the number of feature-dimensions an observer must explicitly discard, what is the specific cognitive operation of "discarding"—is it active attentional inhibition, or simply a failure to encode?
  *Follow-up Direction:* If she posits attentional inhibition, ask whether existing data on inhibition costs aligns with the reported difficulty scales of the classic corpus.

  4. **Feature Invention vs. Filtering**
  Consider a problem where the solution is "the triangle points toward the circle"; this seems to require constructing a relational feature rather than filtering noise, so how does your metric accommodate the cost of *inventing* a dimension rather than *ignoring* one?
  *Follow-up Direction:* If she argues relations are pre-compiled features, press her on the combinatorial explosion required in the feature library to cover all possible Bongard solutions.

  5. **Evidence for Corpus Bias**
  You argue the difficulty ordering is an artifact of Bongard's visual idiom, so what specific empirical result would force you to abandon that claim and admit the ordering reflects genuine conceptual depth?
  *Follow-up Direction:* If she suggests cross-cultural testing, press her on whether universal perceptual priors might confound the results and mimic the original difficulty ordering.

  6. **Distinguishing Style from Concept**
  If we accept your stylistic familiarity hypothesis, how do you rigorously distinguish a "style" from a "concept" without begging the question, given that both manifest as regularities in the visual field?
  *Follow-up Direction:* If she defines style as surface texture and concept as invariant structure, press her on whether geometry *is* the surface texture in this specific medium.

  7. **Salience and Phenomenology**
  Some single-feature distinctions feel subjectively harder than complex geometric counts, so if difficulty is just feature-counting, how do you account for variations in feature salience within your redundancy framework?
  *Follow-up Direction:* If she introduces weighting factors for salience, press her on how these weights are assigned independently of knowing the solution in advance.

  8. **Transfer and Generalization**
  If this is just redundancy detection in a specific visual idiom, do you predict that mastering Bongard problems improves concept induction in non-visual domains, or is the skill hermetic?
  *Follow-up Direction:* If she admits the skill is domain-specific, press her on whether this reduces the task to a puzzle skill rather than a probe of general cognitive capacity.

  9. **The Normative Implication**
  Ultimately, are you arguing that humans *fail* to do general concept induction on these problems, or that the problems *fail* to elicit it due to their design constraints?
  *Follow-up Direction:* If she argues the problems fail to elicit it, press her on the implication for the last fifty years of cognitive science research that has treated these problems as valid probes.

  10. **Machine Solutions and Brute Search**
  If a machine solves these problems by brute-force search over a fixed feature set, does your account classify that as successful concept induction, or merely efficient redundancy filtering?
  *Follow-up Direction:* If she denies it is induction, press her on what additional criterion is needed to distinguish induction from search within her own theoretical framework.
