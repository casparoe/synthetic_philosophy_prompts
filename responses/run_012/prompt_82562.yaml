answer: |-
  # Diagnostic Decision Tree: The Norm of Assertion

  **Instructions:** Start at the top. Answer each question based on your intuitions about assertion, without worrying about which philosopher holds which view. Follow the path to a leaf to identify the corresponding theoretical position.

  ### 1. Scope: Assertion as Such vs. Testimonial Use
  **Question:** Does the norm apply to *any* act of asserting (even soliloquies or fictional narration), or only to assertions intended to convey information to a hearer (testimony)?
  *   **Any Assertion:** Go to **2**.
  *   **Only Testimony:** Go to **9**.

  ---

  ### 2. Target: World vs. Speaker
  **Question:** To assert properly, must the world actually be as you say it is (Factive), or is it enough that you are in the right mental state or position (Non-Factive)?
  *   **World (Factive):** The content must be true or known. Go to **3**.
  *   **Speaker (Non-Factive):** You must believe it or have reasons for it. Go to **6**.

  ---

  ### 3. Status: Constitutive vs. Regulative
  **Question:** Does this norm *make* the act an assertion (and license it in advance), or does it govern an act that is already an assertion (making violations criticizable afterwards)?
  *   **Constitutive (Licenses):** It defines the act; satisfying it permits assertion. Go to **4**.
  *   **Regulative (Criticizes):** It guides the act; violating it invites blame. Go to **6**.

  ---

  ### 4. Ownership: Speaker vs. Assessor
  **Question:** Is the standard for propriety fixed by what the *speaker* knows at the time, or by what the *hearer/community* assesses later?
  *(Note: This separates positions that agree the norm is Knowledge, but disagree on whose knowledge counts.)*
  *   **Speaker's Knowledge:** Go to **5**.
  *   **Assessor's Context:** Go to **5**.

  ---

  ### 5. Stability: Fixed vs. Shifting
  **Question:** Is the standard for "knowing" or "truth" the same in every conversation, or does it shift with practical stakes or context?
  *   **Fixed Standard:** **Leaf A** or **Leaf B**.
  *   **Shifting Standard:** **Leaf C** or **Leaf D**.

  ---

  ### 6. Target Specifics: State vs. Entitlement
  **Question:** Does the norm require a specific mental state (Belief) or a normative status (Entitlement/Reasonableness)?
  *   **Mental State (Belief):** Go to **7**.
  *   **Normative Status (Entitlement):** Go to **8**.

  ---

  ### 7. Stability: Fixed vs. Shifting
  **Question:** Is the requirement to believe fixed, or does it depend on how reasonable it is to believe in that context?
  *   **Fixed (Simple Belief):** **Leaf E**.
  *   **Shifting (Reasonable Belief):** **Leaf F**.

  ---

  ### 8. Status: Regulative Only
  *(Note: Non-factive norms are rarely treated as constitutive.)*
  **Question:** Is the entitlement based on internal evidence or external presumption?
  *   **Internal Evidence:** **Leaf G**.
  *   **External Presumption:** **Leaf H**.

  ---

  ### 9. Testimonial Target: Reduction vs. Non-Reduction
  **Question:** Must the hearer have independent positive reasons to trust the speaker (Reduction), or is the speaker presumed trustworthy unless defeated (Non-Reduction)?
  *   **Reduction (Hearer's Reasons):** Go to **10**.
  *   **Non-Reduction (Speaker's Right):** Go to **11**.

  ---

  ### 10. Ownership: Hearer vs. Speaker
  **Question:** Is the norm primarily a constraint on the *hearer's* acceptance, or the *speaker's* right to be believed?
  *   **Hearer's Constraint:** **Leaf I**.
  *   **Speaker's Right:** **Leaf J**.

  ---

  ### 11. Defeaters: Strict vs. Flexible
  **Question:** Can the presumption of trustworthiness be defeated by general skepticism about the topic, or only by specific counter-evidence?
  *   **Strict Defeaters:** **Leaf K**.
  *   **Flexible Defeaters:** **Leaf L**.

  ---

  ## The Leaves: Positions and Awkward Commitments

  | Leaf | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **The Knowledge Norm (Williamson)** | Implies you cannot assert lottery propositions even if you know they are highly probable. |
  | **B** | **The Truth Norm (Weiner)** | Permits asserting truths you do not believe (e.g., lucky guesses), violating sincerity intuitions. |
  | **C** | **Contextualism (DeRose)** | Makes the truth of "I know" shift with stakes, complicating how we understand disagreement. |
  | **D** | **Assessment Sensitivity (MacFarlane)** | Makes the propriety of a past assertion depend on information available only in the future. |
  | **E** | **The Belief Norm (Bach)** | Permits asserting known falsehoods if you believe them, inviting Moorean paradoxes. |
  | **F** | **Reasonable Assertibility (Douven)** | Blurs the line between assertion and conjecture in scientific or uncertain contexts. |
  | **G** | **Warranted Assertibility (Assertibilism)** | Makes assertion too easy in high-stakes contexts where knowledge is required for action. |
  | **H** | **Epistemic Entitlement (Burge)** | Grants justification for belief without evidence, even from known unreliable sources in some cases. |
  | **I** | **Reductionism (Hume)** | Requires hearers to have positive reasons for trust in every case, which is cognitively unrealistic. |
  | **J** | **Speaker-Dependent Testimony (Lackey)** | Allows a speaker to testify properly even if the hearer has no reason to believe them. |
  | **K** | **Non-Reductionism (Burge)** | Presumes truth even in domains where the speaker has no competence (e.g., complex science). |
  | **L** | **Hybrid View (Fricker)** | Requires a balance of trust and monitoring that is difficult to specify without circularity. |

  ---

  ## Unoccupied Combinations & Structural Notes

  **Empty Leaves (Theoretical Space):**
  1.  **Constitutive + Non-Factive:** *Incoherent.* If the norm constitutes the act, it must anchor the act to the world (truth/knowledge); otherwise, it constitutes "guessing" or "hoping," not assertion.
  2.  **Testimonial + Constitutive:** *Unexplored/Unattractive.* Testimony is usually viewed as a transfer of justification (regulative) rather than a definition of the act itself.
  3.  **Factive + Regulative + Speaker + Fixed:** *Occupied by Truth Norm,* but the **Knowledge Norm** often claims this space too, differing only on the *License vs. Criticize* distinction (see below).
  4.  **Non-Factive + Assessor Ownership:** *Unexplored.* It is unclear what it means for a hearer to assess whether a speaker *believes* something better than the speaker does.

  **Flagged Indeterminacies:**
  *   **Knowledge vs. Truth (Leaves A & B):** This tree separates them by "Target" (Knowledge implies Factive+Speaker+Fixed), but some Truth Norm proponents accept the Knowledge Norm's *function*. The tree separates them by the *strength* of the Factive requirement (Truth vs. Knowledge), but this is often a sub-debate within Leaf A/B.
  *   **License vs. Criticize:** This distinction (Williamson vs. Weiner) is embedded in Node 3 (Status). However, some Knowledge Norm proponents argue the norm is constitutive but only generates *ex post* criticism, not *ex ante* license. These positions land in **Leaf A** but disagree on the deontic force.
  *   **Contextualism vs. Assessment Sensitivity (Leaves C & D):** Both are "Shifting." The tree separates them via Node 4 (Ownership: Speaker vs. Assessor). However, in practice, the line between "Speaker's Context" and "Assessor's Context" can blur in conversational exchange.

  **Note on the "Ownership" Branch:**
  Node 4 is designed to diagnose the specific disagreement between **Williamson** (Speaker's Knowledge) and **MacFarlane** (Assessor's Context). Both agree the norm is Factive/Constitutive (Node 2 & 3), but diverge on *whose* situation fixes the standard. This confirms your suspicion that several apparent disagreements live here.
