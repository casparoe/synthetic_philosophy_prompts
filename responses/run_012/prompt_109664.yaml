answer: |-
  ### The Scenario: The Ventriloquized Journal

  **The Setup:**
  Your narrator, let's call her Elena, is a freelance investigator or researcher (ordinary job). Throughout the first 60%, she uncovers a quiet injustice—say, a local landlord falsifying safety records. She documents everything in a private work journal. She doesn't do this for fame; she does it to keep her thoughts straight. She has no intention of publishing. She never worries about what happens to the journal after she dies; she expects to finish the job herself.

  **The Death:**
  She dies suddenly at the 60% mark (accident or illness). No time to lock the journal away, no instructions left.

  **The Harm:**
  In the last third, her ex-partner (who is also the landlord's lawyer) finds the journal. He doesn't burn it. He *edits* it. He changes her final entry from "Records are falsified" to "Records were verified." He publishes the journal as "Elena's Final Report," using her credibility to legitimize the lie. He doesn't just steal her idea; he turns her testimony into its opposite. She is posthumously made into a witness for the side she was investigating.

  ---

  ### 1. Rule Compliance Check

  *   **Rule 1 (Harm to Her):** The harm is not that her family is upset, or that the landlord gets away with it. The harm is that *Elena* is transformed from a truth-teller into a liar. Her agency is hijacked. Her signature (literal and metaphorical) is used to endorse a falsehood. This violates her integrity, which is a property of *her*, not her survivors.
  *   **Rule 2 (Contemporary/Ordinary):** No ghosts, no sci-fi. Just editing a text file or notebook. This happens every day in estates.
  *   **Rule 3 (No Anticipation):** This is the tightest fit. She wrote the journal to solve the case *while alive*. She never formed a desire about its *posthumous* state because she never anticipated dying mid-case. She didn't dread this; she didn't plan for it. The harm lands entirely outside her conscious horizon. *Flag:* This barely meets the rule. It relies on the idea that you can have an "interest" in your work's integrity without consciously desiring it to survive you.
  *   **Rule 4 (No Setup/Consent):** She left no will regarding the journal. She didn't ask her friend to burn it. She left it vulnerable. The harm happens because she *didn't* secure it, not because she trusted someone who betrayed her.
  *   **Rule 5 (Intuitive Harm vs. Epicurean Counter):** Ordinary readers will say, "That's a violation of her." They feel the injustice of her name being used to lie. The Epicurean has a real answer: "She feels nothing. The 'Elena' who exists now is dust. The 'Elena' who wrote is gone. You are harming a memory, not a person."

  ---

  ### 2. The Verdict

  **Yes, she is harmed.**

  Can you hold both that "death is nothing to us" and "this is a genuine harm"? **No. One has to give.**

  If you accept this scenario as harmful, you must reject the strict Epicurean claim that "no subject = no harm." You have to adopt a view where a person is not just a momentary consciousness, but a **temporal extended entity**. Her life is a single narrative arc. Snipping the end and rewiring it changes the shape of the whole arc. If the arc is distorted, the person who lived that arc is harmed, even if the distortion happens after the final breath.

  For your novel to work emotionally, you must commit to this: **Death is not a wall that seals the self off from the world.** It is a boundary that can be crossed by actions taken by others that attach themselves to the dead person's identity. If you want the readers to feel the harm, you cannot hedge. You must write the betrayal as a violation of *her*, not just a mistake about her.

  ---

  ### 3. Philosophical Accounts Walkthrough

  Here is how the three standard theories of harm handle your scenario, and why they split:

  *   **The Straight Experience Requirement (Epicurean):**
      *   *Verdict:* **No Harm.**
      *   *Reasoning:* Harm requires a subject to experience the negative state (pain, frustration, sadness). Elena is dead. She experiences nothing. Therefore, nothing bad happens *to her*. Only the living experience the distress.
      *   *Why it parts ways:* This theory cannot account for your novel's core conflict. It forces you to treat the last third of the book as solely about the living characters' grief or anger.

  *   **The Desire-Satisfaction Account:**
      *   *Verdict:* **No Harm (in your specific constraints).**
      *   *Reasoning:* Harm occurs when a desire you hold is thwarted. You set Rule 3: she never formed a desire about the journal's future. She didn't want it published; she didn't want it protected. Since she had no desire about the posthumous state, no desire was thwarted.
      *   *Why it parts ways:* This is why your beta readers are stuck. They are intuitively using Desire Theory. "She didn't care, so why should we?" To beat them, you must move beyond Desire.

  *   **The Deprivation Account:**
      *   *Verdict:* **Mixed/Weak.**
      *   *Reasoning:* Harm is being deprived of a good you would have had. But she's dead. She isn't deprived of *life* (that's the death itself). Is she deprived of a good reputation? Only if she valued reputation.
      *   *Why it parts ways:* This usually applies to death itself (dying young deprives you of future goods). It struggles with posthumous events that don't involve lost future experiences.

  *   **The Account You Need (Objective Interest/Narrative Identity):**
      *   *Verdict:* **Harm.**
      *   *Reasoning:* Humans have objective interests in the integrity of their actions and identity, regardless of conscious desire. When she wrote the truth, she performed a moral act. When the ex edits it to a lie, he corrupts *that act*. The act belongs to her. Corrupting the act harms the agent who performed it, even if the agent no longer exists to feel the corruption.

  ---

  ### 4. The Key Feature & The Flip

  **The Feature Doing the Work:** **Authorship/Agency.**

  The harm works because *she wrote the words*. It is her voice being altered. If someone just spread a rumor about her after she died, the harm is weaker (that's reputation). Because she *authored* the document, her agency is extended into the text. Changing the text is like changing the output of her mind.

  **The Flip:**
  Change the scenario so she **did not write the final conclusion.**
  *   *New Scenario:* She dies before writing the conclusion. Her ex writes the conclusion himself and signs her name.
  *   *Result:* The harm flips from "Corruption of her act" to "Forgery." It feels more like a crime against the *readers* or the *truth*, and less like a harm to *her*. It becomes fraud, not violation.
  *   *Why:* In the original, she *did* the work, and he *twisted* it. In the flip, she didn't do the work, he *faked* it. The original harms her integrity; the flip harms her reputation. Integrity is deeper.

  **Subject of Harm Timing:**
  Whose harm is it? **Her at the moment she died (The Antemortem Person).**
  You must treat the "Elena" who existed from birth to death as a single subject. The harm happens *now* (after death), but it attaches to *her* (the completed life). Philosophically, this is the Feinberg view: the antemortem person is the subject of the posthumous harm. You are harming the *life*, not the *corpse*.

  ---

  ### 5. The Epicurean Attack (Where Your Editor Will Strike)

  Here is the strongest argument against your book's premise. Use this to stress-test your scenes.

  **The "No Subject" Objection:**
  "Who is the 'her' you are talking about? The biological organism is dead. The consciousness is gone. You are saying a 'story' is harmed. But a story isn't a person. If I burn a biography of Napoleon, I haven't harmed Napoleon. I've burned paper. In your book, the ex burns her integrity. But integrity is a social construct, not a physical state. You are asking readers to feel pain for a construct, not a human."

  **The Soft Spot:**
  Your vulnerability is **Rule 3**. If she never cared about the journal, why does its integrity matter?
  *   *Defense:* You must show that the journal wasn't just "notes." It was an extension of her mind. Show scenes where she struggles to find the *right word*, not just the useful one. Show that for her, truth-telling was constitutive of who she was, even if she never thought about death. If she valued truth *while alive*, then making her a liar *after death* violates the value system she lived by, even if she didn't anticipate the violation.

  ---

  ### 6. Contested Reading Flag

  I am relying on the **Interest Theory of Rights/Harm** (that you can have interests survive death without conscious desires), which is contested against the **Desire Theory** (that harm requires thwarted wants). Most analytic philosophers lean Desire/Epicurean; most novelists and readers lean Interest/Narrative. I am siding with the novelists.
