          *   *(ii) Subsequent Math:* Cantor showed we *can* compare infinite sets (cardinality). $\aleph_0 = \aleph_0$. But Cantor also distinguishes cardinality from measure/density. Galileo conflated "number" (cardinality) with "magnitude/measure." So, Galileo was right that *density* doesn't work for infinite cardinality, but wrong that *no* comparison works.
