answer: |-
  ### Standard of Adequacy

  The purpose of this specification is to defend the claim: *A visitor who knowingly flouts a local convention is open to criticism.*

  To succeed, a theory must demonstrate that local conventions generate genuine normative reasons for outsiders, without making those reasons absolute or purely consequentialist. The theory must explain *why* the visitor is bound, *when* they are released, and *what* constitutes the breach. The following desiderata are not merely theoretical preferences; they are conditions of possibility for the claim above. If a theory fails any non-negotiable item, it cannot support the conclusion that the flouting visitor is criticisable in the specific ways the cases demand.

  ### The Desiderata

  **1. Semantic Constitution (The Meaning Requirement)**
  *   **Derived from Cases 1 & 4:** In Case 1, paying the menu price is "full payment" in one city and "unpaid wages" in another. In Case 4, tipping is "gratitude" in one city and "insult" in another.
  *   **Requirement:** The theory must treat the *meaning* of the act as constituted by the local convention, not by the physical movement or the universal intent of the agent. The normative status of the act must track the local interpretive scheme.
  *   **Why Non-Negotiable:** If the theory evaluates the act based on the visitor's home meaning or physical description alone, it cannot explain why the *same* physical act is a breach in one context and permissible in another. Without this, the claim that the visitor is criticisable *for flouting the local convention* collapses into a claim about flouting universal morality or prudence.

  **2. Non-Material Normativity (The Affront Requirement)**
  *   **Derived from Case 2:** A visitor crosses an empty road against custom. No one is inconvenienced; no safety risk exists. Yet a local is affronted.
  *   **Requirement:** The theory must explain how a breach can generate a valid reason for criticism in the absence of material harm, cost-shifting, or negative consequences.
  *   **Why Non-Negotiable:** If the theory requires material harm to generate criticism, it cannot account for the local's affront in Case 2. The visitor would be immune to criticism, contradicting the core claim. This requirement rules out strict consequentialism regarding conventions.

  **3. Moral Constraint (The Veto Requirement)**
  *   **Derived from Case 3:** A local custom dictates men are served before women.
  *   **Requirement:** The theory must deny that local acceptance or convergence is sufficient to generate an obligation for the visitor if the convention violates independent moral principles (e.g., equality).
  *   **Why Non-Negotiable:** If the theory binds the visitor to *any* local convention simply because it is local, it makes the visitor complicit in injustice. This would render the theory morally untenable and contradict the intuition that the visitor is *not* open to criticism for refusing to comply here.

  **4. Determinacy of Existence (The Disagreement Requirement)**
  *   **Derived from Case 5:** Locals disagree on the customary rate; no majority practice exists.
  *   **Requirement:** The theory must provide truth conditions for the existence of a convention in the absence of statistical convergence. It must say whether a convention exists here or not, and why.
  *   **Why Non-Negotiable:** If the theory cannot determine whether a convention exists in borderline cases, it cannot determine whether the visitor has flouted one. The claim "the visitor flouted a convention" becomes truth-valueless, undermining the defense of criticism.

  **5. Epistemic Sensitivity (The Knowledge Requirement)**
  *   **Derived from the Core Claim:** The claim specifies a visitor who *knowingly* flouts.
  *   **Requirement:** The theory must distinguish between the obligation to *conform* and the obligation to *inform oneself*. It must explain why ignorance might excuse, but knowledge binds.
  *   **Why Non-Negotiable:** Without this, the theory either binds ignorant visitors (too harsh) or allows knowledgeable visitors to escape (too weak). It is essential for pinning the criticism on the *flouting* rather than the *act*.

  ### The Load-Bearing vs. Ornamental Distinction

  You asked whether the distinction between **load-bearing** conventions (non-compliance shifts costs) and **ornamental** conventions (non-compliance is symbolic) does work in this specification.

  **Verdict:** The distinction is **explanatory but not foundational.**

  *   **Where it works:** It explains the *severity* and *type* of criticism. In Case 1 (tipping as wage), the convention is load-bearing; the criticism is rooted in fairness and harm (the server goes unpaid). In Case 2 (empty road), the convention is ornamental; the criticism is rooted in respect and recognition (the affront).
  *   **Where it fails:** It cannot carry the weight of the *existence* of the obligation. If you make load-bearing status a requirement for *any* criticism, you fail Case 2 (ornamental breaches are still criticisable). If you treat ornamental conventions as lacking normative force, you fail the core claim (the visitor is criticisable).
  *   **Specification Role:** The distinction should be used to modulate the *weight* of the reason, not its presence. A theory that relies solely on load-bearing status to generate normativity is inadequate. A theory that treats both as generating reasons via a unified mechanism (e.g., reciprocity or recognition) but distinguishes their urgency is adequate.

  ### Non-Negotiable vs. Preference

  *   **Non-Negotiable:**
      *   **Semantic Constitution:** Without this, "local convention" loses its grip on the act.
      *   **Non-Material Normativity:** Without this, Case 2 renders the visitor immune to criticism.
      *   **Moral Constraint:** Without this, the theory mandates complicity in injustice (Case 3).
      *   **Epistemic Sensitivity:** Without this, the "knowingly" condition in the core claim is redundant.

  *   **Preference (Theoretical Camps):**
      *   **Source of Normativity:** Whether the force comes from "Fair Play," "Promise," "Respect," or "Coordination" is a theoretical choice, provided it meets the Non-Material Normativity requirement.
      *   **Threshold for Convention:** Whether Case 5 results in "convention exists" or "no convention" is less important than the theory providing a *reasoned verdict*. However, a theory that says "no convention ever exists without 90% convergence" is practically useless for travelers and is thus a disfavored preference.

  ### Joint Unsatisfiability

  **Are any subsets jointly unsatisfiable?**

  No. The set is **jointly satisfiable**, but it creates a narrow channel for theory construction.

  *   **The Tension:** There is a tension between **Non-Material Normativity** (Case 2 requires force without harm) and **Moral Constraint** (Case 3 denies force despite consensus). A theory must find a source of normativity that is strong enough to bind in harmless cases (respect/reciprocity) but weak enough to be overridden by morality (not sheer will).
  *   **The Resolution:** This is satisfiable by theories grounding convention in **reciprocal recognition** or **fair play within a cooperative scheme**. These generate reasons based on participation (satisfying Case 2) but are subordinate to justice (satisfying Case 3).
  *   **The Risk:** A theory that grounds normativity *solely* in "harm prevention" fails Case 2. A theory that grounds it *solely* in "local sovereignty" fails Case 3. A theory that grounds it *solely* in "universal reason" fails Case 1. The specification rules out monistic foundations, not the possibility of a theory itself.

  ### The Single Exclusionary Requirement

  The single requirement that does most to exclude the popular positions is:

  **The Requirement of Non-Material Normativity (Derived from Case 2).**

  **Why this excludes the popular positions:**

  1.  **Excludes "Conventions are Morally Inert":** If conventions are inert, there is no ground for criticism in Case 2. This requirement forces the theory to admit conventions generate genuine reasons.
  2.  **Excludes "Only Harm Generates Obligations":** Case 2 explicitly removes material harm. A harm-based theory must declare the visitor blameless. This requirement forces the theory to admit non-consequentialist reasons (e.g., disrespect, violation of reciprocity).
  3.  **Excludes "Visitors are Bound by Whatever Locals Do" (Blind Localism):** While this requirement primarily targets Inertness and Harm, it indirectly pressures Blind Localism. If the normativity does not come from harm, it must come from the *nature of the interaction* (e.g., entering a cooperative scheme). Once the source is identified as "cooperation" or "reciprocity" rather than "sheer local will," it becomes possible to argue that immoral customs (Case 3) violate the terms of fair cooperation, thus allowing the Moral Constraint to take hold. Blind Localism typically relies on "harm to the social order" to justify binding visitors; by removing harm from the equation in Case 2, you force the Localist to justify the obligation via *meaning*, which opens the door to moral critique of that meaning.

  **Conclusion:**
  If a theory cannot explain why a visitor is criticisable for crossing an empty road against custom (Case 2), it cannot defend your core claim. It will either say "no criticism" (Inertness/Harm) or "criticism because locals said so" (Localism). The former fails the phenomenon; the latter fails Case 3. Therefore, **Non-Material Normativity** is the keystone. It forces the theory into the narrow middle path where your claim resides: conventions matter because they are the grammar of social cooperation, not because they prevent crashes or because locals hold a vote.
