answer: |-
  There is no single established term in the history of philosophy or epistemology that captures this specific configuration exactly as you have described it. You have correctly identified that the standard labels ("Maker's Knowledge," "Constructivism," "Immunizing Stratagems") each capture a facet of the phenomenon but miss the structural link between the *grounding of certainty* and the *exclusion of dissent*.

  The closest existing concept is Karl Popper's **"conventionalist stratagem"** (or immunizing stratagem). However, as you noted, Popper treats this as a degenerative, *ad hoc* maneuver to save a falsified theory from refutation. In Hobbes's case, the maneuver is not a desperate patch applied after a failure; it is a **constitutive feature** of the system, derived directly from its epistemological foundations. The immunity is not a bug; it is a feature of the architecture.

  Because this specific logical shape lacks a standard name, I propose we coin the term **"Constitutive Immunity."**

  Below is the careful carving you requested: a definition, a distinction from the "near misses," and a mapping of its boundaries.

  ### The Term: Constitutive Immunity

  **Definition:**
  **Constitutive Immunity** is a structural feature of an epistemic system wherein the criterion that establishes the possibility of knowledge within that system is simultaneously employed as the criterion for the legitimacy of discourse about that system.

  In a system exhibiting Constitutive Immunity:
  1.  **Grounding:** Certainty is grounded in a specific mode of access or production (e.g., construction, clear and distinct perception, divine revelation).
  2.  **Demarcation:** This mode of access defines the boundary of the discipline. Only propositions generated via this mode count as internal claims.
  3.  **Immunization:** Challenges that arise from outside this mode of access are not treated as *false* internal claims (which would threaten the system's certainty) but as *illegible* external noise (category errors, linguistic confusions, or foreign intrusions).

  ### Distinction from "Near Misses"

  To ensure the term is precise, we must distinguish it from the concepts you rightly identified as insufficient:

  *   **Vs. Maker's Knowledge:** Maker's Knowledge is the *positive* thesis ("I know the line because I drew it"). Constitutive Immunity is the *negative* operationalization of that thesis ("You cannot challenge my line because you did not draw it, therefore you are not speaking of lines"). Maker's Knowledge explains the possibility of truth; Constitutive Immunity explains the impossibility of falsification.
  *   **Vs. Popper's Immunizing Stratagems:** Popper's stratagems are **retrospective and degenerative**. A theory is in trouble, so the theorist adds a clause to protect it. Constitutive Immunity is **prospective and foundational**. The protection is built into the definition of the science before the first theorem is proved. For Hobbes, algebra isn't rejected because it contradicts his geometry; it is rejected because it lacks constructive genesis, *therefore* it cannot contradict his geometry.
  *   **Vs. Kuhnian Incommensurability:** Kuhn describes a sociological state where paradigms talk past each other. Constitutive Immunity describes a **normative strategy** used by a thinker to assert authority. Hobbes is not merely observing that he and Wallis differ; he is actively *ruling* that Wallis is out of order.
  *   **Vs. No True Scotsman:** This fallacy redefines a group to exclude a counterexample ("No true Scotsman puts sugar on porridge"). Constitutive Immunity is more robust; it does not just redefine the group, it redefines the **ontology of the objects**. It claims the dissenter is not talking about the *same objects* because the objects are defined by the method of their production.

  ### Boundary Conditions (The Edges of the Concept)

  You asked for precision regarding what falls inside and outside this concept. Here are the necessary and sufficient conditions:

  **1. Does it require a constructive or "Maker's Knowledge" premise?**
  *   **No.** While construction is the paradigmatic case (as in Hobbes), any epistemological grounding that places the *source* of validity within the knower's specific capacity can generate Constitutive Immunity.
  *   *Example:* A Rationalist who claims knowledge comes solely from "Clear and Distinct Ideas" exhibits Constitutive Immunity if they dismiss empirical counterexamples not as false, but as "confused perceptions" that lack epistemic standing.
  *   *Example:* A Theologian who claims knowledge comes from "Grace" exhibits Constitutive Immunity if they dismiss logical objections as "carnal reasoning" incapable of grasping spiritual truth.
  *   *Requirement:* The system must claim that **validity is endogenous** (generated from within the system's specific method) rather than exogenous (tested against an independent reality).

  **2. Does it require that dissent be reclassified as verbal?**
  *   **Yes, essentially.** For the immunity to hold, the dissent cannot be admitted as a substantive error. If Hobbes admitted Wallis was doing geometry but got the answer wrong, Hobbes's claim to geometric certainty would be threatened. By claiming Wallis is doing *algebra* (or "symbolic mysticism"), Hobbes moves the disagreement from the realm of *truth/falsity* to the realm of *sense/nonsense*.
  *   *Nuance:* It need not be purely "verbal." It can be methodological. The key is that the dissent is categorized as a **category mistake** rather than a **factual error**.

  **3. Is a single thinker's practice enough, or does it need to be a recurring move across fields?**
  *   **A single thinker is sufficient.** This is a concept describing a logical structure of argumentation, not a sociological trend. Hobbes alone instantiates it. However, recognizing it as a *type* allows us to spot it in Descartes (regarding intuition), Vico (regarding history), or even certain strands of phenomenology.
  *   *Distinction:* If the whole field adopts this, it becomes a **Paradigm** (Kuhn). If a single thinker uses it to defend their system against the field, it is **Constitutive Immunity**.

  **4. Does it require a contest of authority?**
  *   **Yes.** This is what separates it from simple dogmatism. Dogmatism says "I am right." Constitutive Immunity says "I am right because I define the terms by which rightness is judged, and you are using the wrong terms." It is an assertion of **jurisdiction**. In Hobbes's case, this is explicitly political: he treats the geometric community like a commonwealth where he is the sovereign, and Wallis is a rebel importing foreign laws (algebra).

  ### Summary of the Concept

  **Constitutive Immunity** names the move where the **foundation of a system's certainty** is weaponized to **invalidate the tools of its critics**.

  *   **Inside the boundary:** Hobbes rejecting Wallis's algebra because it lacks constructive genesis; Descartes rejecting sensory doubt because it lacks clear and distinct perception; a legal system rejecting evidence because it was obtained without proper jurisdiction.
  *   **Outside the boundary:** Popper's *ad hoc* hypotheses (reactive, not foundational); simple stubbornness (no epistemological grounding); standard peer review (where dissent is treated as internal correction).

  This term allows you to describe Hobbes's behavior not as a failure of logic (a fallacy) or a mere sociological power play, but as a coherent, albeit defensive, epistemological strategy. It explains why he cannot concede the point: to concede would be to collapse the distinction between *making* truth and *finding* it, which would undermine the entire basis of his claim to certainty.
