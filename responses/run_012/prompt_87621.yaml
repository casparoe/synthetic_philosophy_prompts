answer: |-
  Good evening. I'm [Name], and I'm the student council president at [High School]. I'm standing here because I spend all day in the hallways where you work, and I spend all evening at the dinner table where my parents worry about what happens if you don't.

  I know this room is full of different kinds of anxiety. I know some of you are tired. I know some of you are scared. And I know there are arguments happening in cars and living rooms right now about what you should do tomorrow.

  My friend Maya told me something bluntly the other day. She said if you strike, you're taking all the risk—lost pay, potential retaliation—but if you win, everyone gets the raise anyway. So logically, the smart move is to let everyone else do it. My dad says the opposite. He says anyone who crosses the line is benefiting from risk they didn't take. He calls them free-riders.

  Both of them are looking at this like it's math. Like it's a transaction where you weigh what you lose against what you get. And if you look at it that way, Maya's right. Individually, striking is irrational.

  But Mr. Alvarez, my social studies teacher, told me something that stuck. He said a strike isn't a decision. It's a sentence.

  When one person says "no," it's just a complaint. It's noise. But when hundreds of you say "no" on the same day, in the same way, for the same reason, it stops being noise and starts being language. It becomes a message that the district has to read.

  That's the thing I wanted to say to you. Tomorrow's vote isn't about a million individual choices. It's about forming a single voice. Because the right to organize isn't something you hold in your pocket like a key. It's not an individual right. You can't assemble alone. You can't bargain alone. That right only exists in the space between you. It only works if you hold it together.

  To the parents here: I know you're worried. I'm not going to stand here and promise you that if there's a walkout, everything will be fine. I can't promise you childcare. I can't promise you peace of mind. But I can promise you this: We see you. We know this isn't something you're doing lightly. We know you're doing it because you want to be able to keep showing up for us in the long run.

  And to the teachers: I know you're tired of bumper stickers. You don't need me to tell you I support you. You need to know that we understand what this costs.

  So tomorrow, when you vote, don't think about the math. Don't think about what you lose individually. Think about the sentence you're writing. If you want the district to hear you, you have to speak the same words at the same time.

  A strike is one action, not a million. And tomorrow, you decide if you're writing it together.

  Thank you.
