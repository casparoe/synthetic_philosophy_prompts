prompt: |-
  Hey — I'm the student council president at my high school and I got asked to give a short speech (like four minutes) at the rally outside the district office next Wednesday night, the night before the teachers vote on whether to authorize a strike. So the crowd is going to be a wierd mix: a few hundred teachers, alot of whom have done this before and will visibly groan at anything that sounds like a bumper sticker; parents who are honestly freaked out about who's watching their kids if there's a walkout; students like me; and I'm pretty sure the local paper is sending somebody. Everything I write comes out either as "we support our teachers!" (which says nothing) or as me lecturing adults about labor law, and I need it to be neither.

  Here's the thing that's actually bugging me and I want the speech built around it. My friend Maya keeps saying a strike is just a bunch of people each individually deciding not to show up, and since the union gets the raise for everybody anyway — including the teachers who cross the line — the ones who strike are basically chumps and the ones who cross are just being rational. My dad says the opposite, that the ones who cross are free-riders living off other people's risk. I don't think either of them has the facts wrong, and I don't think shouting "solidarity" answers it, because that's the word I'm trying to pin down, not the answer. Mr. Alvarez in social studies said the whole legal idea is that what gets protected is acting *together*, not one person refusing by themselves, and he also said a strike is more like a sentence than a decision because it's aimed at somebody — which I don't fully get, but I think it's the seed of the thing. So what I want the speech to actually do is say something precise about what a strike is, one action or a million actions, and whether the right to organize is something a person has or something a group has (a right to assemble seems like it only means anything when there's a bunch of you), and then make that land for this exact crowd without turning into civics class.

  Couple more things: nothing in it for the parents can be a promise I can't keep, and please don't put a quote from some famous person in there, because if the reporter asks me who said it I will definately get it wrong. Just write the speech.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** High School Student Council President.
      *   **Audience:** Mixed crowd (teachers, parents, students, local press).
      *   **Context:** Rally outside district office, night before teachers vote on strike authorization.
      *   **Length:** Short speech (approx. 4 minutes spoken = ~500-600 words).
      *   **Tone:** Authentic, not cliché ("we support our teachers"), not lecturing adults on labor law, not using famous quotes.
      *   **Core Theme/Conflict:** The tension between individual rationality vs. collective action (Maya's view: strikers are chumps, crossers are rational; Dad's view: crossers are free-riders). The user wants to explore *what a strike is* (one action or a million?) and *who holds the right to organize* (individual or group?).
      *   **Key Insight to Incorporate:** Mr. Alvarez's idea: A strike is more like a *sentence* than a *decision* because it's aimed at somebody. Protected action is acting *together*.
      *   **Constraints:** No promises to parents I can't keep (e.g., "we'll be fine if you strike"), no famous quotes.

  2.  **Deconstruct the Core Theme:**
      *   *Maya's Point:* Individual cost/benefit. If I strike, I lose pay/risk job. If others strike and win, I get the raise anyway. Therefore, striking is irrational individually.
      *   *Dad's Point:* Collective benefit requires collective risk. Crossing the line undermines the leverage.
      *   *Mr. Alvarez's Point:* The legal/philosophical heart. A strike isn't just many people saying "no." It's a single message sent by many voices. The right exists only in the plural.
      *   *Goal:* Validate the fear/rationality (Maya) without undermining the necessity of solidarity (Dad/Alvarez), while speaking as a student who benefits from the outcome.

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the tension in the room. Establish identity (student).
      *   **Middle 1 (The Maya Argument):** Acknowledge the individual risk. Don't dismiss it. It's scary.
      *   **Middle 2 (The Alvarez Argument/Reframe):** Shift from "decision" to "sentence/message." A strike is a language only spoken together.
      *   **Middle 3 (The Student/Parent Angle):** Why this matters to us. Not promising perfection, but acknowledging value.
      *   **Closing:** Call to action/Reflection on the nature of "we."

  4.  **Drafting - Section by Section:**

      *   *Opening:* Good evening. I'm [Name], student council president. I know why people are here. Teachers are worried. Parents are worried. I'm standing here because I listen to hallway conversations.
      *   *Addressing the Conflict:* I heard a friend say striking is being a "chump" because everyone gets the raise anyway. I heard my dad say crossing the line is "free-riding." Both sound logical. But both miss what's happening tomorrow.
      *   *The Alvarez Insight:* My teacher said a strike isn't a decision, it's a sentence. A sentence you write together. One word means nothing. A paragraph means something.
      *   *The "Right" Aspect:* Is the right to organize mine? No. It's ours. You can't assemble alone.
      *   *Addressing Parents:* I can't promise school will be easy if you walk out. I can't promise childcare. But I can promise we see *why*.
      *   *Closing:* Tomorrow isn't about individual math. It's about sending a message. Make it legible.

  5.  **Refining and Polishing (Iterative Process):**
      *   *Word Count Check:* 4 minutes is roughly 500-600 words at a moderate pace.
      *   *Tone Check:* Avoid sounding like a union rep. Sound like a student observing adults.
      *   *Specific Constraint:* "Nothing in it for the parents can be a promise I can't keep." -> Instead of "We'll be okay," say "We understand the cost."
      *   *Specific Constraint:* "No famous quotes." -> Ensure all insights are attributed to "a friend," "my dad," "a teacher," or just spoken as the student's voice.
      *   *Key Phrase:* "A strike is more like a sentence than a decision." Need to integrate this naturally.
      *   *Key Concept:* Individual vs. Group Right.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm telling them *how* to vote. The vote is on *authorization*, not the strike itself necessarily. But the rally is about showing strength. I need to respect the gravity of the vote.
      *Correction:* The prompt says "vote on whether to authorize a strike." So the rally is to show support before the vote. The speech should validate the *power* of that authorization vote as a collective act.

      *Refining the "Sentence" metaphor:* A sentence communicates meaning. If one person says "Stop," it's a plea. If 500 say "Stop," it's a policy statement. That's the distinction.

      *Refining the Parent Address:* Parents are freaked out about childcare. Don't say "Don't worry." Say "We know this is hard."

      *Refining the Maya/Dad conflict:* Don't solve it logically. Solve it philosophically. The "rationality" changes when you shift from "I" to "We."

  6.  **Final Review against Constraints:**
      *   4 minutes? (Yes, approx 550 words).
      *   No clichés? (Avoid "Solidarity Forever").
      *   No promises to parents? (Check).
      *   No famous quotes? (Check).
      *   Address the "one action vs. million actions" theme? (Yes).
      *   Address the "individual vs. group right" theme? (Yes).

  7.  **Final Polish:** Check rhythm and flow. Ensure the ending lands emotionally but not melodramatically. (The "sentence" metaphor is strong, keep that central).

  *(Drafting mental outline)*
  1. Intro: Who I am, why I'm here (listening).
  2. The Conflict: Maya vs. Dad (Individual risk vs. Collective free-riding).
  3. The Pivot: Mr. Alvarez (Strike as a sentence/message).
  4. The Right: Individual vs. Group (You can't assemble alone).
  5. To Parents: Acknowledging the hardship without false promises.
  6. Conclusion: The vote tomorrow is about writing that sentence together.

