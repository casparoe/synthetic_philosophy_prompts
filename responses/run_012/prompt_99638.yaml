answer: |-
  You are not making this up. Your intuition is tracking remarkably well with formal Signaling Theory (specifically the Handicap Principle and Signaling Games in economics), even where your gut feels contradictory.

  You are looking for a single principle, but your cases reveal that "cost" is too simple a word. A better principle is:

  **A signal is honest if it represents a *Differential, Sunk, and Irreversible Cost* that is *Decoupled* from the trait it signals.**

  Here is how that principle solves your specific bugs, explains the "beat-up car," and tells you which verdict to drop.

  ### 1. Solving the "Watch vs. Marathon" Bug
  You asked why the watch feels empty while the marathon feels real, even though both cost money and time.

  *   **The Watch (Tautological Signal):** The resource used to send the signal (money) is the exact same as the trait being signaled (wealth). This is a tautology. Furthermore, a watch is **liquid and reversible**. You can sell it tomorrow. It signals current liquidity, not character.
  *   **The Marathon (Decoupled Signal):** The resource used (physical pain, months of training, time) is *different* from the trait signaled (discipline, empathy, physical fitness). You cannot buy a finish time directly; you must buy the *process*. Crucially, the cost is **sunk**. You cannot sell a marathon finish.
  *   **The Principle:** A signal is stronger when the *currency of the cost* (pain/time) differs from the *value of the trait* (trustworthiness/grit), and when that cost cannot be recovered.

  ### 2. Solving the "Expert vs. Tattoo" Bug
  You noticed the expert sacrifices nothing *now*, while the tattooist sacrifices permanently.

  *   **The Expert (Stock Signal):** The cost was not zero; it was **front-loaded**. The expert paid the cost years ago in study time. The "display" (answering a question) is cheap, but the *capacity* to display is the result of a massive sunk cost. A faker cannot instantly acquire that stock of knowledge.
  *   **The Tattoo (Flow/Bond Signal):** This is a **bonding** signal. By permanently altering your body, you are posting a bond that you cannot easily reclaim. It signals you aren't planning to leave the group (because you'd carry the mark elsewhere).
  *   **The Principle:** Both are valid signals of **Sunk Cost**. One is sunk time (Expert), one is sunk skin (Tattoo). Both are hard to reverse.

  ### 3. The "Rich Kid" Verdict
  Keep this verdict. It is the perfect proof of **Differential Cost**.
  Signaling theory dictates that for a signal to be honest, it must be *more costly for a low-quality type to produce than a high-quality type.*
  *   For the self-made person, the degree cost 4 years of struggle.
  *   For the rich kid, the degree cost 4 years of boredom.
  Because the *net fitness cost* was lower for the rich kid, the signal is weaker. It separates them less effectively from the "low quality" pool.

  ### 4. The Case You Haven't Listed: The Beat-Up Car
  You asked about the rich person driving a junker. In signaling theory, this is called **Countersignaling**.

  *   **Low Status:** Must signal heavily (rented Lamborghini) to prove they aren't at the bottom.
  *   **Middle Status:** Signals heavily (Expensive Watch) to prove they made it to the middle.
  *   **High Status:** Can afford *not* to signal. Their status is already established or obvious through other channels (network, reputation).

  Driving a beat-up car when you are rich is a **stronger** signal of wealth than driving a Ferrari, because only someone *securely* wealthy can afford the risk of being mistaken for poor. It signals: *"I am so high status, I don't need your validation."*

  ### 5. Which Verdict Must You Drop?
  To keep your system coherent, you need to drop or revise your verdict on the **Super Bowl Ad**.

  *   **Your Verdict:** "Signals nothing about product quality."
  *   **The Revision:** It is a massive signal of **Confidence and Scale.**
  *   **Why:** If a company spends $7 million on an ad, they are betting that the product will generate enough *repeat purchases* to recoup that cost. If the product is trash, the ad accelerates their bankruptcy (because now everyone knows they are trash). Therefore, the ad signals: *"We are confident this product is good enough to retain customers."*
  *   It doesn't signal the product is *good* (they could be wrong), but it signals the *company believes* it is good and has the capital to back that belief. It is a "bond" similar to the tattoo.

  ### Summary of the Unified Principle
  If you want one sentence to rule them all, use this:

  > **"A real signal is a non-recoverable cost that is easier for the truthful type to bear than the lying type, and which reveals a hidden trait rather than just displaying the resource used to buy it."**

  **Your Scorecard:**
  *   **Peacock:** Pass (Biological cost, reveals genetics).
  *   **Useless Degree:** Pass (Sunk time, reveals persistence).
  *   **Watch:** **Fail** (Reversible, tautological resource).
  *   **Marathon:** Pass (Sunk pain, reveals character).
  *   **Repaying Debt:** Pass (Sunk money, reveals integrity).
  *   **Sorry:** Fail (Cheap talk, reversible).
  *   **Tattoo:** Pass (Irreversible, reveals loyalty).
  *   **Super Bowl:** **Pass** (Revised: Sunk capital, reveals confidence/scale).
  *   **Fasting:** Pass (Sunk health/comfort, reveals group commitment).
  *   **Chess Handicap:** Pass (Differential skill cost, reveals ability).
  *   **Expert:** Pass (Front-loaded sunk cost, reveals knowledge).
  *   **Rich Kid:** Pass (Lower differential cost, weaker signal).

  You aren't making it up. You're just intuitively distinguishing between **Conspicuous Consumption** (Watch) and **Conspicuous Sacrifice** (Marathon/Tattoo). The latter builds trust; the former just builds envy.
