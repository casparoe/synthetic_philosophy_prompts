      *(Self-Correction on Tone)*: Make sure it doesn't sound like a lament. It needs to be a charge. "Go forth and get stuck."

      *(Final Polish)*: Enhance the imagery of "weight" and "texture" of ideas.

  9.  **Final Output Generation** (Proceeding to generate the speech based on these thoughts).

