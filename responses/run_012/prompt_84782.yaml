answer: |-
  Good morning. Trustees, faculty, parents, and the Class of 2024.

  Thank you for this honor. I know why you voted for me. I am not under the illusion that this is purely about my teaching evaluations. You chose me because you know I have things to say about the tools you used to get here, and you wanted to hear them said out loud, in the light, on a day like this.

  You are right. I do have things to say. But I promise you, I am not here to read you a policy memo. I am not here to tell you that you cheated. I am not here to tell you that your work is fake.

  We live in a world that is obsessed with answers. We grade answers. We hire based on answers. We build machines that generate answers faster than any human hand can write them. And if education were simply the transmission of correct information from a source to a page, then what you have done over the last two years is not a problem. It is an efficiency. It is a triumph.

  But I believe education is something else. I believe the thing at risk is not the answers. People have always gotten their answers from other people. We call that a library. We call that a lecture. We call that an education.

  The thing at risk is the relation between the answer and the person holding it.

  In April, I asked my senior seminar to do something simple. I asked them to close their laptops. I asked them to state, in three sentences and from memory, the thesis of the essay they had submitted in December. Nine of the twenty-two could not do it.

  Now, I know what my colleagues think that number means. They think it means attention has collapsed. They think it means standards have slipped. They think it means the contract of the classroom has been broken.

  I do not think that number means what my colleagues take it to mean.

  I think the loss appears first not in what they cannot do, but in what they cannot want.

  When you write a paper, you are not just producing text. You are navigating a confusion. You start in the dark. You grope for a switch. You bump into furniture. You argue with yourself. You write a sentence, and you realize it is a lie, so you delete it. That friction, that feeling of being stuck—that is not an obstacle to the learning. That *is* the learning.

  If you outsource the stuckness, you do not just get the answer faster. You lose the shape of the question. A question you have never been stuck on is not a question you have. It is a question you are renting.

  To the parents in the audience: I know some of you worry that the faculty let this happen. I know some of you worry that the degree your child holds is lighter than the one you earned. I dissented from the policy that allowed these tools. I worried about exactly this. But here is the truth I have come to: The value of this degree is not in the papers they filed. It is in whether they can stand inside an idea without shaking.

  If you can hold an idea because you fought for it, it becomes a part of your skeleton. It supports you when the world pushes back. If you hold an idea because a machine arranged the words nicely, it is like holding a photograph of a skeleton. It looks right from the outside. But it cannot bear weight.

  To the graduates: I am not asking you to throw away the tools. I am not asking you to pretend the last two years didn't happen. You used what was available. You were smart. You were adaptive. You survived a pandemic and a technological revolution simultaneously.

  But I am asking you to notice the erosion. And I am asking you to notice that it is invisible from the inside.

  That is why this is worth eight minutes of a commencement address. Because when you leave here, the prompts will get more sophisticated. The answers will get smoother. The friction will disappear entirely. And you will feel more productive than you have ever felt in your life. You will feel like you are working at the speed of thought.

  But you must ask yourself: When the machine resolves the tension, do I lose the capacity to feel it?

  I do not know if a machine can understand. I will not stand here and claim I know the limits of silicon. But I know the limits of a human life. I know that a human life is measured in the moments we are forced to stop. In the moments we are forced to say, "I do not know," and sit with that discomfort until something new grows out of it.

  If you never sit with the discomfort, nothing new grows. You just have more text.

  So, here is my charge to you. Do not worry about whether you are using the tools. Worry about whether the tools are using you. Worry about whether you are becoming a person who can only operate at the speed of a processor.

  Go into your careers. Go into your labs, your classrooms, your boardrooms. Use every advantage you have. But carve out spaces of deliberate inefficiency. Find the questions where you refuse to ask for help. Find the problems where you insist on getting stuck.

  Because the world does not need more people who can generate answers. The world is drowning in answers. The world needs people who know what it feels like to not know. The world needs people who can hold a question in their hands, feel its weight, feel its sharp edges, and refuse to put it down until it becomes a part of them.

  You have the answers. You have always had the answers. What I want for you is the relation.

  Congratulations, Class of 2024. Go get stuck.
