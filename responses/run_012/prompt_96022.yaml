  Ok so my friend Bram (philosophy minor, reads a lot of pop-philosophy, extremely confident) has been going on at me about Ayer and the afterlife, and his summary doesn't smell right to me but I can't put my finger on why. His version, roughly verbatim:

  "Ayer's the logical positivist guy, so for him the whole question was dead on arrival — 'I'll survive my death' can't be checked against any possible observation, so it's not false, it's literally meaningless. That's early Ayer. Then he softened up, and in the 60s he wrote an essay arguing that a person just is his body, personal identity is bodily continuity, so 'I survive my death' isn't even a coherent hope, it's like saying 'I'll be in two places at once.' Not unverifiable — self-contradictory. And then the punchline: after his own near-death experience, heart stopped, came back, saw a red light and two figures, he changed his mind and said he believed in an afterlife. So the guy who called it meaningless ended up a believer. Case closed."

  I've been lurking in these parts for years and something about this is off. Can you go claim by claim: which parts would a careful reader of Ayer accept, which are the kind of thing a popularizer says that Ayer himself would have winced at, and which are just wrong? The thing I most want untangled is whether the 'it's meaningless' charge and the identity/criteria argument are actually the same argument or two different ones wearing the same coat — Bram talks like its one continuous position and I suspect it's two. And give me the honest version of the near-death-experience bit; "changed his mind and believed in an afterlife" feels like it's doing a lot of work, but maybe I'm just pattern-matching on how those stories usually go.

  Couple of requests. If the summary is too vague to audit — if it matters which essay or which decade Bram means — say so rather than smoothing over it; a flagged gap is more useful to me than a tidy answer. And give me your confidence on each verdict, including where you're genuinely unsure or where the Ayer scholarship is contested; if some of this is 'depends what you mean by meaningful,' I'd rather hear that than a confident gloss. If I've got the whole framing wrong and there isn't an interesting Ayer view on the afterlife to audit in the first place, tell me that instead of playing along.
