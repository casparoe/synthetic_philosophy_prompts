answer: |-
  # PRIORITY DISPUTES: A POSITION SORTER

  **Instructions:** Begin at **Node 1**. Answer the claim or case presented. Follow the lettered branch corresponding to your answer to the next numbered node or a final leaf position. Proceed until you reach a leaf.

  ***

  ### NODE 1
  **The Hypothetical Case:** Two researchers derive the same theorem in the same year. The first to publish is entirely forgotten; the second's notation becomes the standard one.
  *Claim:* The second researcher deserves the primary credit because their route became the field's provenance.

  *   **(A) I agree.** (Provenance/Standard determines credit.) → Go to **Node 2**.
  *   **(B) I disagree.** (Priority in time determines credit.) → Go to **Node 6**.

  ***

  ### NODE 2
  **The Counterfactual:** Consider the Darwin and Wallace affair.
  *Claim:* The question "If Darwin had died in 1858, would natural selection have been published by 1870?" is a well-formed question with a determinate true answer.

  *   **(A) Yes, it has an answer.** (We can know if it was inevitable.) → Go to **Node 3**.
  *   **(B) No, it is ill-formed or unknowable.** (History does not support such counterfactuals.) → **Leaf A**.

  ***

  ### NODE 3
  **The Timing:** Assuming the counterfactual has an answer.
  *Claim:* The result was bound to appear within that specific generation (timing was inevitable), not just sooner or later.

  *   **(A) Yes, the timing was inevitable.** → Go to **Node 4**.
  *   **(B) No, only the result was inevitable.** (The timing was contingent luck.) → Go to **Node 5**.

  ***

  ### NODE 4
  **The Unit (Inevitable Timing):** If the timing was inevitable, who is the proper agent of discovery?
  *Claim:* The "Field" or "Structure" of science is the discovering entity, not the specific persons.

  *   **(A) Yes, credit the Field.** → **Leaf B**.
  *   **(B) No, credit the Individual** (whoever happened to be there). → **Leaf C**.
  *   **(C) Credit the Pair** (e.g., Darwin-Wallace). → **[EMPTY BRANCH]**.

  > **Note on Empty Branch:** This spot is effectively unoccupied. If timing is structurally inevitable, crediting a specific *pair* is incoherent; the structure would have produced *someone*, not necessarily that specific dyad.

  ***

  ### NODE 5
  **The Unit (Contingent Timing):** If the timing was contingent, who is the proper agent of discovery?
  *Claim:* The "Individual" or "Pair" is the discovering entity, as their specific effort triggered the result.

  *   **(A) Credit the Individual/Pair.** → **Leaf D**.
  *   **(B) Credit the Field.** (Even contingent results are field products.) → **Leaf E**.

  > **Note on Predictions:** Leaf B and Leaf E both award credit to the Field, but they disagree on *why* (Structure vs. Community).

  ***

  ### NODE 6
  **The Ontology:** Returning to those who prioritize "First in Time" (from Node 1B).
  *Claim:* "Being first" is a mind-independent fact of the world, like a physical coordinate, not merely a social label.

  *   **(A) No, it is a social label/construction.** → **Leaf F**.
  *   **(B) Yes, it is a real fact.** → Go to **Node 7**.

  ***

  ### NODE 7
  **The Normative Force:** If priority is a real fact.
  *Claim:* This fact is morally and intellectually inert; it does not compel us to award credit if the work was forgotten or unused.

  *   **(A) Yes, it is inert.** (It is biographical data, not a claim on credit.) → **Leaf G**.
  *   **(B) No, it compels recognition.** → Go to **Node 8**.

  ***

  ### NODE 8
  **The Historical Application:** Consider Newton and Leibniz (simultaneous discovery).
  *Claim:* If priority compels recognition, simultaneous discovery compels split credit rather than a winner-take-all judgment.

  *   **(A) Yes, split credit.** → **Leaf H**.
  *   **(B) No, nuance decides the winner.** (One was slightly more rigorous/complete.) → **Leaf H**.

  > **Note on Predictions:** Leaf H covers both outcomes. Whether you split credit or find a nuance-based winner, you agree that priority *must* be resolved into credit; the method of resolution is secondary to the obligation.

  ***

  ## LEAF POSITIONS

  **Leaf A: Epistemic Agnosticism**
  *   **Least Comfortable Commitment:** You must accept that we cannot know if science would have progressed without its famous heroes, rendering historical explanation purely narrative.

  **Leaf B: Structural Determinism**
  *   **Least Comfortable Commitment:** You must treat individual researchers as interchangeable cogs, denying that Darwin's specific genius altered the *date* of discovery.

  **Leaf C: Inevitable Genius**
  *   **Least Comfortable Commitment:** You must hold that the specific individual was destined to appear exactly when they did, bordering on a historical teleology.

  **Leaf D: Heroic Contingency**
  *   **Least Comfortable Commitment:** You must accept that major scientific truths might have remained hidden for generations had one person taken a different vacation.

  **Leaf E: Collective Contingency**
  *   **Least Comfortable Commitment:** You must credit the "Field" for results that hinged on specific, non-replicable individual actions.

  **Leaf F: Social Constructivism**
  *   **Least Comfortable Commitment:** You must deny there is any fact of the matter about who was first, reducing priority to a consensus decision made by historians.

  **Leaf G: Biographical Realism**
  *   **Least Comfortable Commitment:** You must treat priority as a perfectly real fact that is nonetheless morally and intellectually inert, obligating us to nothing.

  **Leaf H: Priority Absolutism**
  *   **Least Comfortable Commitment:** You must pursue historical granularity to award credit even when the scientific utility of the competing claims was identical.
