      *   *Structuralism:* Conditions (Versailles, inflation, antisemitism, industrialization) create the niche. Remove Hitler, someone else fills the void.
      *   *Epidemiological Analogy:*
          *   *Individual Case:* Why did *this* person get lung cancer? (Smoking + Genetics).
          *   *Population Rate:* Why is the lung cancer rate high in *this* city? (Pollution + Smoking prevalence).
          *   *Application:* Why did *Hitler* rise? (Unique charisma, biography). Why did *Fascism* rise in Germany? (Structural conditions).
      *   *The Counterfactual Problem:* When we say "Remove Hitler," what are we holding constant? The Treaty of Versailles? The economic depression? The culture of antisemitism? If we hold *all* structures constant, is it plausible that *no one* rises?
      *   *Relocating the Debate:* The debate shifts from "Did Hitler matter?" to "How substitutable was Hitler?" and "What counts as a structural constraint?"

