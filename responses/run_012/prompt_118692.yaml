          *   *Problem 2: The "Equivalent" Threshold.* What counts as "Hitler-like"? Same ideology? Same aggression? Same efficiency in genocide? A structuralist might say "Another authoritarian," but a Great Man proponent says "Only Hitler wanted *that* specific war/genocide."
