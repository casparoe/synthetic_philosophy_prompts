prompt: |-
  You are a political theorist and debate coach who specializes in preparing speakers for hostile Q&A in normative political theory and comparative politics. Think carefully about the audience’s priors before you write. First, in a short brainstorming section, lay out what this audience is likely to believe, what they will treat as obvious, and where the load-bearing assumptions of my argument are most exposed. Then produce the prep sheet.

  I am giving a workshop talk next month defending a version of the performance-legitimacy thesis. My thesis, in brief: a regime that is not an electoral democracy can possess full legitimacy, not merely prudential acceptability, when it satisfies a three-part test. The attribution condition: the prosperity and order it delivers must be credibly attributable to the regime’s own actions, not merely to exogenous luck, resource rents, or preexisting social capital. The distribution condition: the benefits must be broadly shared and not merely aggregate, and the order must be the kind of order that protects ordinary people rather than merely protecting the regime. The supersession condition: the regime must maintain a credible, institutionalized path to its own supersession or to meaningful contestation, so that its performance claim is not a permanent license. I call this conditional performance legitimacy. I use China and Singapore as my two main cases, though I argue the test is general and that Singapore comes closer to passing it than China does, and that neither passes it fully. I also distinguish between performance as a ground of legitimacy and performance as a ground of obedience; I expect the audience to collapse them, and part of my task is to keep them apart. I expect the hardest line of attack to be what I call the horizon problem: the performance that legitimates is assessed over a long horizon, but the regime’s incentive to produce it is short-horizon, and the supersession condition is meant to bridge that gap.

  The audience will include six liberal-democratic political theorists, two comparative authoritarianism specialists, one development economist, one legal philosopher who works on the rule of law, and one former Singaporean civil servant. The liberal theorists are mostly Rawlsians, deliberative democrats, and neo-republicans; they believe legitimacy requires consent, accountability, or non-domination. The comparative specialists are skeptical that performance legitimacy is anything more than a post-hoc rationalization for authoritarian rule. The economist will press on identification and counterfactuals. The legal philosopher will distinguish rule by law from rule of law. The former civil servant will know the Singapore case from the inside and will object to any framework that treats it as a mere case study.

  Prepare my Q&A prep sheet. I want the eight or so objections I will actually get from this audience, not the objections I would get from a generic political philosophy seminar. Order them by how much damage they would do to my thesis, and note where the order in which they will come differs from the order of damage. Phrase each objection the way the person who will raise it would phrase it, in their vocabulary, and say who is likely to raise it. For each objection, give me: a two-minute reply; the concession I can make without abandoning the thesis; and a note on where the reply is soft, either because it depends on an empirical claim I should not assert without checking or because it exposes a seam in the three-part test. Distinguish the objections that have real force from the ones that are merely rhetorical or that miss the point of the thesis. If an objection is really a disagreement about the meaning of legitimacy rather than a substantive challenge, say so and tell me how to avoid a verbal fight.

  Also include: the three concessions I should make up front, before the Q&A begins; the one reply that absolutely has to land for the thesis to survive; the weakest point in my own position that I should prepare to defend rather than hope nobody notices; and the one question I am hoping nobody asks, with a short answer I can give if it is asked.

  Do not give me a bibliography, reading list, or citations. Do not invent statistics or studies. Where an objection depends on a contested empirical claim, state the claim in general terms and tell me what I would need to check. Use the vocabulary of the audience members, not the vocabulary of my own framework, when you phrase their objections. Be concrete about the China and Singapore cases, but do not rely on specific dates, leaders, or figures that I have not supplied. Keep the whole prep sheet practical: I have fifteen minutes of Q&A and need to know what to say, what to give away, and what to hold.
