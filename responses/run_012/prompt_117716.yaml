answer: |-
  The stalemate you describe is not a failure of imagination; it is a structural feature of the concept you are dissecting. Your working hypothesis is close, but it requires a sharpening of the blade. You suspect the dispute is three questions wearing one word. I suggest the diagnosis is more specific: it is a **category conflation where an ontological question is being fought using epistemic weapons, resulting in a metaphysical disagreement that cancels out at the level of rational action.**

  The reason you cannot construct a case where the three views license different decisions in a fully specified situation is that rational decision theory acts as a convergence engine. If the Frequentist admits that, for the purpose of betting, one must act *as if* the limiting frequency is the chance, and the Subjectivist admits that coherent credences must align with known frequencies (via calibration or exchangeability), and the Propensity theorist admits that propensities manifest as frequencies, then the *output* of the systems (the betting quotient) will be identical even if the *input* (the truthmaker) differs. This is the force of de Finetti's representation theorem and Lewis's Principal Principle. They mathematically enforce a truce on action while leaving the war on ontology untouched.

  Your group is stuck because you are treating "probability" as a natural kind term (like "water") when it functions more like a functional role term (like "gene" or "money"). A Frequentist is defining the *realizer* of the role (long-run patterns). A Subjectivist is defining the *role* itself (guidance of belief). A Propensity theorist is positing a *causal power* that fills the role. When you ask "What is the probability of this single decay?", the Subjectivist answers the epistemic question ("How confident should I be?"), the Frequentist answers the ontological question ("Is there a sequence?"), and the Propensity theorist answers the causal question ("Is there a disposition?"). They talk past each other because they are optimizing for different virtues: truth-conditions vs. coherence vs. explanation.

  Consider your test cases through this lens. The **chaotic circuit** (deterministic but stable frequency) separates the Frequentist from the Propensity theorist on truth-conditions (0.3 vs. 0 or 1), but not on action (bet 0.3). The **single decay** (no long run) breaks the Frequentist's truth-conditions but leaves the Subjectivist and Propensity theorist intact; again, action converges on the half-life calculation. The **fair coin/all heads** scenario is the strongest separator: the Frequentist must say the probability *was* 1 (looking back) or undefined (looking forward without a class), while the Propensity theorist says 0.5. But if you *know* it is a fair coin, the Subjectivist bets 0.5 regardless of the past string, aligning with Propensity against the raw Frequentist count. The **calibrated but undefensible forecaster** separates the Subjectivist (who demands internal justification) from the Frequentist (who demands external match), showing that "probability" is doing double duty as a measure of knowledge and a measure of worldly structure.

  The impasse persists because you are looking for a pragmatic divergence where there is only an explanatory one. The "hidden formal question" you suspected is real: the mathematics of probability is neutral regarding interpretation. The residue is not formal; it is metaphysical. You are not disagreeing about how to calculate; you are disagreeing about what the universe is made of. The Frequentist wants a world of patterns. The Subjectivist wants a world of agents. The Propensity theorist wants a world of powers. None of these views will force a different bet in a standard decision problem because decision problems are designed to be solved by numbers, and all three views agree on the numbers *conditional on the available evidence*. The disagreement is about what happens when the evidence runs out.

