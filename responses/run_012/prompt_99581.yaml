answer: |-
  **Seminar on Bargaining and Distributive Justice**
  **Session Opener: The Nash–Kalai–Smorodinsky Dispute**

  **Characters:**
  *   **Nora:** Proponent of the Nash Bargaining Solution.
  *   **Kai:** Proponent of the Kalai–Smorodinsky Solution.

  **Nora:** Let's ground this in the geometry before we drift into abstractions. We have a feasible set defined by the convex hull of $(0,0)$, $(2,0)$, $(0,1)$, and the kink at $(0.8, 0.8)$. Disagreement is at the origin. My solution selects $(1, 2/3)$. It maximizes the product of gains. Yours selects approximately $(1.14, 0.57)$, on the ray equalizing proportional gains relative to the ideal points of 2 and 1.

  **Kai:** Correct. And right there lies the ethical fault line. In my solution, both parties achieve exactly $4/7$ of their maximum possible gain. Player 1 gets $1.14$ out of $2$; Player 2 gets $0.57$ out of $1$. It is a fair division of *opportunity*. Your solution gives Player 2 two-thirds of their ideal, while Player 1 gets only half. You punish the party with the higher capacity for no reason other than the curvature of the frontier.

  **Nora:** I don't punish capacity; I respect the independence of irrelevant alternatives (IIA). The point $(0.8, 0.8)$ is feasible, but it's not the solution. If we were to remove that kink—say, a technological constraint makes that specific combination impossible—the Nash solution remains $(1, 2/3)$. The outcome depends only on the local shape of the frontier where the agreement actually happens. Your solution, Kai, is globally sensitive. If we remove $(0.8, 0.8)$, the ideal points might shift, or the ray intersection changes. You let unchosen possibilities dictate the chosen outcome. That violates basic rationality.

  **Kai:** It violates rationality only if you view bargaining as a mechanical optimization problem. In distributive justice, unchosen alternatives signal the *structure* of the relationship. That kink at $(0.8, 0.8)$ tells us that a symmetric split is possible. By ignoring it, you ignore the context. But the deeper failure is Individual Monotonicity. Suppose the feasible set expands for Player 1—his ideal point moves from 2 to 3, while Player 2's possibilities remain unchanged. Intuitively, Player 1 should not end up worse off. Yet, under Nash, because the frontier curvature changes, Player 1 can actually lose utility when his prospects improve. That is perverse.

  **Nora:** That "perversity" is a feature, not a bug. It prevents manipulation of the feasible set. If I guarantee you that expanding your options never hurts you, I invite you to distort the set artificially. Which brings us to the first complication. Player 1 can make an irreversible investment before bargaining. It raises his disagreement payoff from 0 to, say, $0.5$, but it shrinks the total surplus. The frontier contracts.

  **Kai:** And under Nash, this investment is incentivized. By raising his threat point, Player 1 skews the product maximization in his favor, even though the pie is smaller. You are rewarding destructive behavior. You are telling Player 1: "Burn value to increase your leverage."

  **Nora:** I am telling Player 1 that leverage matters. Bargaining isn't just about splitting a surplus; it's about the power to walk away. If Player 1 can secure a better outside option, that *is* value. The shrinkage of the surplus is the cost of that security. Nash captures the trade-off accurately. If the investment is socially wasteful, the contract should prohibit it, not the solution concept. Your solution masks the power dynamic. By focusing on proportional gains from disagreement, you treat a strengthened outside option as a mere shift in the baseline, dampening the incentive to invest.

  **Kai:** Dampening the incentive to invest in *threats* is precisely what justice requires. But look at the second complication: uncertainty. The parties disagree about the true size of the other's outside option. Player 2 thinks Player 1's disagreement payoff is 0; Player 1 knows it's 0.5.

  **Nora:** And this uncertainty favors Nash. Because of IIA, my solution is locally stable. If Player 2 is wrong about the extent of the feasible set, but the true solution remains feasible, the outcome doesn't jump. IIA provides robustness against informational noise regarding the boundaries of the set.

  **Kai:** That's a mathematical convenience, not an ethical shield. Uncertainty about outside options translates to uncertainty about the *ideal* points in my framework, yes. But Individual Monotonicity offers a safety net. If Player 1's true capacity is higher than Player 2 believes, KS ensures that once that capacity is revealed, Player 1's share adjusts monotonically. Nash does not. Under Nash, new information about the feasible set can cause discontinuous jumps in the allocation. If we are designing a rule for the real world, where bounds are fuzzy, I want a rule that ensures I am never penalized for the set expanding in my favor.

  **Nora:** You're conflating stability with fairness. The core justification for Nash is the product maximization itself. It derives from a set of axioms that mirror rational choice under uncertainty. It is the unique solution consistent with expected utility maximization in a strategic bargaining game. The product represents the joint surplus of cooperation over conflict. Maximizing it is the only way to treat the parties' utility scales symmetrically without invoking interpersonal comparisons of utility.

  **Kai:** "Without interpersonal comparisons" is the sleight of hand. Your scale invariance axiom claims to handle this, but by maximizing the product of *gains*, you implicitly weight the parties by their marginal utility at the disagreement point. KS makes the comparison explicit: we compare what you get to what you *could* get. Equalizing the ratio of actual gain to potential gain is the only definition of fairness that respects aspiration. If I can potentially gain 100 units and you can potentially gain 10, and we both get 5, Nash might call that fair if the curvature dictates it. KS calls it a failure; I got 5% of my hope, you got 50%.

  **Nora:** But aspirations are unbounded. Ideal points are often utopian extremes that no rational actor expects to achieve. Basing the solution on the furthest reachable point, rather than the marginal trade-off rate at the agreement, anchors the outcome in fantasy. Nash anchors it in the margin. The slope of the frontier at $(1, 2/3)$ tells us the cost of transferring utility. That is economic reality. Your ray intersection ignores the marginal cost of redistribution.

  **Kai:** And your marginalism ignores the claim. In a justice seminar, we must care about claims. If the feasible set expands for me, my claim on the surplus strengthens. Individual Monotonicity codifies that intuition. IIA codifies the idea that the menu doesn't matter, only the meal. But in bargaining, the menu *is* the power structure. Removing the option $(0.8, 0.8)$ changes the symmetry of the situation, even if we don't pick it. It tells us whether a balanced outcome was possible. By declaring that irrelevant, you declare the context irrelevant.

  **Nora:** I declare the *unchosen* context irrelevant. If we let every feasible point weight the solution, we open the door to strategic manipulation of the set's boundaries. You criticized my investment incentive, but your solution is vulnerable to "ideal point padding." If I can artificially inflate my ideal payoff—perhaps by claiming I need more resources to function—your ray shifts in my favor. Nash is immune to that. It only cares about what is feasible at the margin.

  **Kai:** Artificial inflation of ideal points is detectable; it requires proving feasibility. But your solution allows for "threat inflation," which is harder to police. Ultimately, Nora, your solution asks us to accept that a player can be made worse off by an expansion of their own opportunities. I cannot sign onto a theory of justice that violates that basic monotonicity.

  **Nora:** And I cannot sign onto a theory that lets unchosen, irrelevant options dictate the division of value. Stability and strategic robustness trump proportional intuition.

  ***

  **Closing Note**

  For the purposes of this seminar case, I adopt the **Kalai–Smorodinsky solution**.

  While Nora's defense of the Nash solution is mathematically elegant and strategically robust, it fails the specific normative test required for distributive justice. The Independence of Irrelevant Alternatives (IIA) is a compelling axiom for rational choice, but it is ethically brittle in bargaining contexts. As Kai demonstrated, IIA implies that the removal of unchosen options cannot alter the fairness of the outcome. However, in distributive problems, the *shape* of the feasible set conveys information about the parties' relative constraints and capacities. To ignore the kink at $(0.8, 0.8)$ is to ignore the fact that a symmetric division was structurally possible, even if efficiency pushed us elsewhere.

  Furthermore, Kai made the stronger case regarding Individual Monotonicity. A solution concept that permits a party to receive less utility when their feasible opportunities expand (a known pathology of the Nash solution under certain set expansions) is indefensible in a framework concerned with justice. It creates perverse incentives and violates the basic intuition that improved prospects should not penalize the agent. Regarding the investment complication: while Nash correctly identifies the leverage gained by raising disagreement payoffs, it fails to penalize the surplus destruction sufficiently. Kalai–Smorodinsky, by tying the solution to the ideal point relative to disagreement, dilutes the reward for shrinking the pie to boost threat power.

  Nora argued that Nash is more stable under uncertainty. However, KS's reliance on ideal points is less fragile than Nora conceded; the proportional claim remains robust even if the exact boundary is fuzzy, whereas Nash's reliance on the specific curvature at the solution point makes it hypersensitive to local misestimation.

  Kai won the exchange because he successfully framed the disagreement not as one of mathematical convenience, but of moral consistency. In a seminar on *justice*, the axiom that prevents you from being punished for having better prospects (Individual Monotonicity) must take precedence over the axiom that preserves stability when options are removed (IIA).
