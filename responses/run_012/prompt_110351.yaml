  4.  **Analyze the Interventionist Criterion:**
      *   Does it smuggle in mechanistic assumptions? Yes. It assumes beliefs are *localizable states*.
      *   Dennett's stance is anti-localization. It says the "belief" is a property of the *whole system's trajectory*, not a specific register.
      *   *Counter:* However, modern mechanistic interpretability (e.g., causal tracing, activation patching) *does* try to find these states. So the criterion isn't philosophically alien to the tech, even if it clashes with pure Dennettianism.
