answer: |-
  This is a fantastic puzzle. Your curator isn't working with a simple binary of "Real vs. Fake." If she were, she wouldn't display the posthumous bronze (Case 4) or the workshop piece (Case 3) as freely as she does, and she might treat the 1900 copy (Case 1) the same as the 1930s forgery (Case 2).

  Instead, she seems to be weighing a matrix of three competing principles: **Lineage**, **Transparency**, and **Material Integrity**.

  Here is the breakdown of the rules she appears to be using, how they apply to your test case, my prediction on her verdict, and the specific case you need to find to prove which rule actually drives her decisions.

  ### 1. The Rules She Is Using

  Based on her five past verdicts, here are the four distinct principles at play:

  *   **Rule A: The Lineage Principle (Connection to the Master)**
      *   *The Logic:* An object counts as "The Master's Work" if there is a direct physical or institutional link to the artist's intent.
      *   *Evidence:* She accepts the **Workshop Painting (Case 3)** because the workshop is an extension of the master's hand. She accepts the **Posthumous Bronze (Case 4)** because it comes from the *original mold* (direct physical lineage).
      *   *Failure:* She relegates the **1900 Copy (Case 1)** to the "copies room" because it has no lineage to Vermeer, only to a copyist.

  *   **Rule B: The Transparency Principle (Honesty of Presentation)**
      *   *The Logic:* An object is acceptable if its origin story is being told truthfully *now*.
      *   *Evidence:* She loves the **1900 Copy (Case 1)** because it is "honest" (signed by the copyist, labeled as a copy). She hates the **1930s Forgery (Case 2)** because it was "sold as the real thing" (a lie).
      *   *Failure:* The **1930s Forgery (Case 2)** is a "crime scene" because its history is rooted in deception.

  *   **Rule C: The Material Integrity Principle (How much original is left?)**
      *   *The Logic:* An object loses its status if the original artist's physical contribution is negligible.
      *   *Evidence:* She rejects the **Over-Restored Painting (Case 5)** for storage. Even though it might be labeled honestly, 90% of the material is by a restorer, so the artist's agency is gone.
      *   *Success:* The **Workshop Painting (Case 3)** stays up because *some* of the master's hand is present.

  *   **Rule D: The Pedagogical/Historical Value Principle**
      *   *The Logic:* An object deserves space if it teaches us something significant about art history, even if it fails the other rules.
      *   *Evidence:* This is the wildcard. It explains why the **1900 Copy (Case 1)** is displayed (teaches studio practice). It is the only reason to potentially save the **1930s Forgery (Case 2)**, though she currently rejects it.

  ### 2. Predictions for the Test Case (The Famous 1940s Forgery)

  Here is how each rule predicts the fate of this new painting:

  *   **Lineage Rule Predicts:** **No Main Gallery.** It has no connection to the Dutch Master. It belongs in the "Copies Room" or storage, not alongside the authentic works.
  *   **Transparency Rule Predicts:** **Display.** Unlike the 1930s forgery (Case 2), this one is being offered *as* a forgery. It is no longer deceiving anyone. It satisfies the "honesty" requirement of the 1900 Copy (Case 1).
  *   **Material Integrity Predicts:** **Display.** It is physically intact; it hasn't been painted over by a restorer.
  *   **Pedagogical Value Predicts:** **Special Exhibition.** It is in textbooks and documentaries. It has high historical value as a cultural artifact, arguably more than the 1900 copy.

  ### 3. My Best Guess: What She Will Say

  **Verdict:** She will accept the painting, but **only for a Special Exhibition on Forgery/History**, not for the Main Gallery and not for the permanent "Copies Room."

  **Why I'm betting on this:**
  The crucial difference between the **1930s Forgery (Case 2)** and your **Test Case** is the *current cultural status*.
  *   In Case 2, she called it a "crime scene." This implies she objects to the *successful deception*. It hung on a wall as a lie. That history taints the object for her.
  *   However, in the Test Case, the deception is the *point*. It is "celebrated now as a kind of genius of imitation."

  She distinguishes between **Art** (Main Gallery, requires Lineage) and **Artifact** (Exhibition, requires Historical Value).
  *   She won't put it in the **Main Gallery** because it fails the **Lineage Rule** (unlike Cases 3 & 4).
  *   She won't put it in **Storage** (like Case 2 & 5) because it passes the **Transparency Rule** (it's honest now) and has high **Pedagogical Value**.
  *   She won't put it in the **Copies Room** (like Case 1) because the Copies Room is for "honest copies" (studio practice). This is a "dishonest copy" (criminal intent).

  She will likely say: *"It's not art, it's evidence. But it's important evidence. Put it in the temporary gallery with a plaque that tells the whole scandalous story. Don't let anyone think it's a Vermeer."*

  She is prioritizing **Transparency** (it must be labeled a fake) and **Pedagogy** (it teaches history) over **Moral Intent** (the fact that it was made to lie). The "Crime Scene" comment in Case 2 was likely because that painting was still being treated as a potential asset or was too recent/painful; this new one is "history."

  ### 4. The Tie-Breaker Case

  You are right to feel that the Test Case might not be enough to distinguish her rules. The ambiguity lies in **Rule B (Transparency)** vs. **Rule A (Moral Intent)**.
  *   Does she hate the *lie* (which is now gone)?
  *   Or does she hate the *liar's intent* (which is permanent)?

  To figure out which rule she is actually using, you need to present her with this hypothetical:

  **The "Failed Forgery" Case:**
  > "Imagine we find another painting by that same 1940s forger. Same technique, same deliberate intent to deceive. But this one was **caught immediately**. It was never sold, never hung in a museum, and never fooled anyone. It was seized by police in his studio. It has no history of successful deception, no scandal, no 'crime scene' of a fooled collector. It's just a fake that failed. We would label it honestly as a forgery."

  **How to interpret her answer:**

  *   **If she says "Display it" (same as the Test Case):**
      She is following the **Transparency Rule**. As long as we are honest *now*, the original intent doesn't matter. The "Crime Scene" comment in Case 2 was about the *successful lie*, not the object itself.

  *   **If she says "Store it/Reject it" (unlike the Test Case):**
      She is following the **Moral Intent Rule**. The act of trying to deceive taints the object permanently, regardless of whether it succeeded. If this is her answer, then her acceptance of the Test Case is purely due to its **Pedagogical Value** (it's famous/textbook), not because she forgives the forgery.

  *   **If she says "Display it in the Copies Room" (like the 1900 Copy):**
      She is following the **Lineage/Category Rule**. She doesn't care about the intent, only that it isn't the Master's work. This would mean her "Crime Scene" comment was specific to the *scandal* of Case 2, not the nature of forgery itself.

  **My bet?** She will reject the "Failed Forgery." I think the "Crime Scene" comment reveals she views the *intent to deceive* as a moral stain on the object itself, regardless of the outcome. She will only accept the Test Case because its fame makes it a historical document (Pedagogy), not because she thinks it's "honest."
