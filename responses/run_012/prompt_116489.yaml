  So I volunteer at this small art museum near me on weekends, mostly I sit at the front desk and answer questions, but I've gotten friendly with the curator, who's this older woman who's been doing it for like thirty years, and she has really strong opinions about fakes. I'm taking an art history class and we're doing a unit on forgery and authenticity and honestly it's the most interesting thing I've done in school, so I've been bugging her about it and sort of keeping a mental list of her verdicts. Her track record as best I can tell: (1) there's a hand-painted copy of a Vermeer in our own collection, done around 1900, signed by the copyist and everything, and she keeps it up in a room about copies and studio practice — she says it's honest and it's a beautiful painting, so why wouldn't we show it. (2) She told me about a forgery made in the 1930s specifically to fool a collector, sold as the real thing and hung in someone's house as the real thing for decades until it got exposed, and she says if it were up to her she'd take it off the walls completley — not art, she called it "a crime scene." (3) There's a painting here that's mostly the work of pupils in an old master's workshop, with the master's own hand in maybe a couple of figures, and it's labeled as by the master and she's totally fine with that; she says the workshop was just part of how he made things. (4) She also showed me a bronze cast from the sculptor's own mold but made decades after he died, and she displays it as his work without any problem. (5) And then there's another painting that's like 90% later restoration, only the original sketch underneath is really his, and she keeps that one in storage — she says it's basically the restorer's painting now, not the artist's.

  Anyway here's what I actually want to ask you. There's a painting being offered to the museum. It was made in the 1940s as a deliberate forgery of a Dutch master, it fooled everyone for about thirty years, it hung in a big museum as an autograph work, and when it was exposed it was a huge scandal. But since then it's become kind of famous in its own right — it's in art history textbooks as the great forgery, people study the forger's technique, there's even a documentary about him and he's sort of celebrated now as a kind of genius of imitation. So it's still a deception, but it's also a piece of history. What do you think my curator would say — should we take it? Would she display it, and if so how: in the main galleries, in the copies room, in a special exhibition about forgery, or just locked in storage?

  I'm way less interested in the yes/no than in the rule she seems to be running. Try to work out which rules fit everything she's said so far — I can see at least a few that would all fit, like something about the actual origin or the artist's own hand, something about just whether the thing looks good, something about whether it's being presented honestly, and something about it having value as a historical document. Say what each of those predicts about the forgery case, give me your best guess about what she'd really say and why you'd bet on that rule over the others, and then tell me what other case you'd put in front of her to figure out which rule she's actually using — because I have a feeling this forgery might not be enough on its own to tell them apart.
