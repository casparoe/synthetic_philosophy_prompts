  OMNIPOTENT HOME GOODS™
  LIMITED WARRANTY AND TERMS OF DIVINE OCCASION

  Welcome to the family. By activating this device you agree that the toaster possesses no inherent power to brown bread. The heating element is merely an occasion. The following terms govern your relationship with the Product and the Primary Cause.

  1. DEFINITION OF EFFICACY
  The Product is defined as an inert locus of potentiality. It contains no nature capable of producing heat, motion, or light. Any warming of the coil is directly sustained by the Primary Cause at every discrete moment of time. The Company expressly disclaims any implied warranty of efficacy. You are purchasing a shaped object, not a cause. The metal housing has no agency. The wiring has no potency. To suggest otherwise is to commit a category error regarding created substances.

  2. OBLIGATION TO ACTIVATE
  The User must press the switch. This action produces no physical change in the circuit. However, the Divine Will has ordained that the toast shall darken only on the occasion of the lever being depressed. Failure to press the lever is a violation of protocol, even though the lever moves nothing. Do not assume the switch controls the fire. It merely signals the time. You are required to perform the motion because the sequence is ordained, not because the motion is efficacious. If you do not press the switch, the bread will not toast, but not because the switch failed. It is because the Occasion was not met.

  3. EXPECTATION AND CONJUNCTION
  User expectations are based on Constant Conjunction. You expect water to boil because it has boiled before, not because the kettle holds power. This habit of expectation is psychological, not ontological. The Company relies on the Customary Way of God. If the water remains cold, the Product is not defective. The Customary Way has been interrupted. This is not a manufacturing error. It is a variation in Divine Habit. We cannot guarantee the continuity of nature because there is no nature to continue. There is only habit.

  4. LIABILITY AND ADVERSE EVENTS
  In the event of combustion, electrical shock, or structural failure, the User acknowledges that these effects are created ex nihilo alongside the malfunction. The Company did not cause the fire. The fire was created directly. Therefore, the Company accepts no liability for burnt hands or property damage. These are theological events. To claim the wire caused the burn is to attribute independent power to created things, which is void under this agreement. We understand this is distressing. However, attributing pain to the appliance rather than the Sole Agent is metaphysically inaccurate. The appliance is innocent. It cannot hurt you. It cannot do anything.

  5. REJECTED PHILOSOPHIES
  ~~The User may assume the heating element burns by its own nature. The Company guarantees the intrinsic potency of the device.~~ This clause is void. Aristotelian notions of secondary causality are explicitly excluded. The Device has no nature to guarantee. Any claim based on the inherent properties of matter is denied. The fire does not burn by necessity. It burns by Will.

  6. TERMINATION AND SUSTAINANCE
  This warranty persists only as long as the Divine Will sustains the contract. We reserve the right to cease existence without notice. The Product may vanish between moments. This is not a recall. It is ontological dependency. You assume all risks regarding the continuity of existence.

  Thank you for choosing us as your occasional partner. We are happy to serve you within the limits of created insignificance.

