prompt: |-
  I'm in a phil of math seminar and we've just spent two weeks on Skolem's paradox, and I keep having the same argument with a friend in the set theory group, so I want to see where my number is actually coming from. Here's the claim I want your credence in, stated as precisely as I can manage: (A) first-order set theory — ZFC, say, assuming it's consistent — does not succeed in expressing the notion of uncountability we meant to express, since Löwenheim–Skolem gives you a countable model whose "uncountable" sets are countable from the outside, and no amount of added first-order axioms repairs this; and (B) consequently there is no model-independent fact of the matter about cardinality, so "uncountable," and with it "power set of omega" and "the real numbers," is relative in something like the way "left" is relative to an orientation. Give me one number for the conjunction, then take it apart for me. What I want is the sub-questions, a rough probability for each, and how you get from them to the total: how much of your number rests on whether the two conjuncts even come apart (someone could think first-order logic can't pin down the notion while still insisting there's a fact of the matter that a fuller language or an informal intended interpretation tracks), how much on whether the deflationary line is right — that there's no contradiction here at all, that "countable" just means "there's a bijection in the domain," so the inside and outside claims are about different structures and never collide — how much on whether the paradox generalizes into the usual model-theoretic argument that reference is indeterminate (the one where the skeptic keeps reinterpreting your added constraints so they come out true too), and how much on whether second-order logic with full semantics rescues the intended interpretation or just smuggles the answer in. If you think A and B are doing very different amounts of work, say so and split the number.

  Then: which sub-question is the total most sensitive to, and what would actually move it? For my part, I'm at about 0.3. My friend is at 0.9 and says I'm confusing use and mention — that on his view the Skolemite inference is just a slip, since the model's members are the only sets in play, so there's nothing left over to be "really" countable. That sounds like a dodge to me but I can't say why, and I'd like to know whether the disagreement between 0.3 and 0.9 is really about the technical facts, about whether "the intended interpretation" is a coherent notion at all, or about whether relativity of this kind is a cost anyone has to pay. If you're going to tell me the proposition is ambiguous, fine, but pick the reading you'd defend, give me the number for that reading, and then tell me what the number would be under the other one. Also — don't just hand me a bare number and a vibe; if there's a term in your decomposition you're guessing at, flag it and tell me what evidence would shift it, whether that's some argument that the paradox re-arises even for a language rich enough to describe its own models, or some argument that the whole thing is a confusion about which structure a cardinality claim is indexed to.
