answer: |-
  You can write this scene with confidence. The mathematics is sound. Your professor is describing a specific variation of the **Allais Paradox**, and within the axioms of Expected Utility Theory (EUT), his daughter's preferences are indeed formally inconsistent.

  She has violated the **Independence Axiom**. This is not a trick of expected value (where one option simply pays more on average); it is a structural contradiction in how she values risk relative to certainty.

  Here is the argument as he would write it on the envelope, followed by the context you need to write the subtext of the scene.

  ### The Envelope Argument

  He should not write long sentences. He should write symbols and probabilities. He treats the choices as equations.

  **Step 1: Formalize the First Choice**
  He writes down her first preference. Let $£1k$ stand for the value of £1,000 and $£4k$ for £4,000.
  $$ \text{Sure } £1k \quad \succ \quad (50\% \, £1k + 25\% \, £4k + 25\% \, £0) $$
  *(The $\succ$ symbol means "is preferred to.")*

  **Step 2: Decompose the "Sure" Thing**
  He breaks the guaranteed £1,000 into two halves to match the probabilities of the lottery.
  $$ (50\% \, £1k + 50\% \, £1k) \quad \succ \quad (50\% \, £1k + 25\% \, £4k + 25\% \, £0) $$

  **Step 3: Cancel the Common Consequence**
  He draws a line through the identical $50\% \, £1k$ on both sides. This is the Independence Axiom: if two lotteries share a common outcome with the same probability, it should not affect the preference.
  $$ 50\% \, £1k \quad \succ \quad (25\% \, £4k + 25\% \, £0) $$
  *He underlines this. This is the implication of her first answer.*

  **Step 4: Formalize the Second Choice**
  He writes her second preference below.
  $$ (25\% \, £4k + 75\% \, £0) \quad \succ \quad (50\% \, £1k + 50\% \, £0) $$

  **Step 5: Cancel the Common Consequence**
  He points out that both options in the second choice include a $50\%$ chance of nothing. He crosses out $50\% \, £0$ from both sides.
  $$ (25\% \, £4k + 25\% \, £0) \quad \succ \quad 50\% \, £1k $$

  **Step 6: The Contradiction**
  He turns the envelope around to show her Step 3 and Step 5 side-by-side.
  1.  $50\% \, £1k \quad \succ \quad (25\% \, £4k + 25\% \, £0)$
  2.  $(25\% \, £4k + 25\% \, £0) \quad \succ \quad 50\% \, £1k$

  **The Punchline:**
  "You have told me that A is better than B, and B is better than A. In my world, that is not a difference of opinion. That is an error."

  ### The Subtext for Your Scene

  While the father is mathematically correct *within his system*, the daughter is psychologically correct *within the human experience*.

  **Why the Father is "Right":**
  Decision theory requires consistency to function as a mathematical model. If you allow preferences to flip based on how the risk is framed (certainty vs. probability), you cannot build a coherent model of rational choice. To him, this is like saying $2+2=5$; it breaks the machinery of logic.

  **Why the Daughter is "Right":**
  This specific contradiction is so common among humans that it helped launch **Prospect Theory** (for which Daniel Kahneman won the Nobel Prize). Humans value **certainty** disproportionately.
  *   In Choice 1, the "Sure £1,000" carries a psychological premium that the math doesn't capture. She isn't just buying money; she's buying peace of mind.
  *   In Choice 2, there is no peace of mind available. Both options are risky. So she switches to maximizing potential gain.
  *   She isn't being illogical; she is violating the *Independence Axiom*, which many modern economists argue is too rigid to describe real human value.

  **How the Daughter Might Reply:**
  If she is sharp, she shouldn't try to fix the math. She should attack the premise. She shouldn't say, "I changed my mind." She should say, "Your equations don't measure what matters."

  A possible retort:
  > "You cancelled out the certainty, Father. But that's the only part I was buying. In the first choice, I paid a premium to avoid the risk of zero. In the second, zero was already on the table. You proved I value certainty, not that I can't add."

  ### Summary for the Author
  1.  **The Math:** It works. It is a valid proof of inconsistency under Expected Utility Theory.
  2.  **The Visual:** Use the "cancellation" method (Steps 3 and 5 above). It looks elegant on paper and is easy for a reader to follow.
  3.  **The Conflict:** The scene is not about who is smarter. It is about **Rationality vs. Reality**. He represents the clean, abstract map; she represents the messy, human territory.

  You have a solid foundation for the scene. The father isn't cheating, but the reader should feel that his victory is pyrrhic—he has proven she is human, not that she is wrong.
