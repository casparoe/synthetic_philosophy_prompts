          *   Option 1B: 0.5 chance of £1,000, 0.25 chance of £4,000, 0.25 chance of £0.
          *   Expected Utility (EU) of 1B: $0.5 \cdot U(1000) + 0.25 \cdot U(4000) + 0.25 \cdot U(0)$.
          *   Since $U(0)=0$, EU(1B) = $0.5 \cdot U(1000) + 0.25 \cdot U(4000)$.
          *   Daughter's Preference: 1A > 1B.
          *   Inequality 1: $U(1000) > 0.5 \cdot U(1000) + 0.25 \cdot U(4000)$.
          *   Simplify: $0.5 \cdot U(1000) > 0.25 \cdot U(4000)$.
          *   Multiply by 4: $2 \cdot U(1000) > U(4000)$. (Or $U(1000) > 0.5 \cdot U(4000)$).

      *   **Choice 2:**
          *   Option 2A: 50% £1,000, 50% £0.
          *   EU(2A): $0.5 \cdot U(1000) + 0.5 \cdot U(0) = 0.5 \cdot U(1000)$.
          *   Option 2B: 25% £4,000, 75% £0.
          *   EU(2B): $0.25 \cdot U(4000) + 0.75 \cdot U(0) = 0.25 \cdot U(4000)$.
          *   Daughter's Preference: 2B > 2A.
          *   Inequality 2: $0.25 \cdot U(4000) > 0.5 \cdot U(1000)$.
          *   Multiply by 4: $U(4000) > 2 \cdot U(1000)$.

      *   **Comparison:**
          *   From Choice 1: $2 \cdot U(1000) > U(4000)$.
          *   From Choice 2: $U(4000) > 2 \cdot U(1000)$.
          *   Contradiction: $2 \cdot U(1000) > U(4000) > 2 \cdot U(1000)$.
          *   This is impossible. $X > Y$ and $Y > X$ cannot both be true.

      *   **Conclusion:** The mathematics *does* hold. This is a classic formulation of the **Allais Paradox** (specifically the common consequence effect, though slightly modified). The father is mathematically correct *within the framework of Expected Utility Theory (EUT)*.

