answer: |-
  **A:** Let's return to the demon. We agree on the datum: if a demon threatens to torture me unless I admire him, I have a reason to admire him. But the demon is not admirable. My explanation stands: the threat is a state-given reason. It bears on the benefits of having the attitude, not on the merits of the object. The demon's wit or courage would be object-given. That is why the threat is the wrong kind of reason.

  **B:** And I maintain that this distinction is doing no work. You say "object-given" marks the right kind, but you identify "object-given" by checking if it's the right kind. It's a label, not an analysis. But let's leave the demon for a moment. I want to press you with two cases that strain your taxonomy. Consider first: I have a reason to trust a colleague because trusting them tends to make them trustworthy.

  **A:** That seems like a good reason to trust them.

  **B:** Does it? On your view, is it object-given or state-given?

  **A:** It looks state-given. It cites the consequences of my holding the attitude. If I trust you, a certain state of affairs obtains: you become reliable. That sounds like a reason bearing on the state of trusting, not on you as you are independently of my trust.

  **B:** But if it's state-given, you should classify it as the wrong kind of reason, like the demon's threat. That would imply this reason cannot make trust fitting. But surely, if trusting you makes you trustworthy, that is intimately connected to the value of trust. It doesn't feel like the demon case. In the demon case, the admiration is a mere means to avoid pain. Here, the trust is a means to realizing the very property that makes trust appropriate.

  **A:** I concede that simply drawing a line between "properties of the object" and "consequences of the attitude" is too crude. The trust case shows that some consequences are internal to the relationship that constitutes the object. However, let's look at the second case you proposed. I have a reason to be afraid of a harmless spider because fear will make me cautious, and caution is useful.

  **B:** Agreed.

  **A:** Here, the reason is also state-given. It cites the consequences of the attitude: my caution. Yet, this is clearly the wrong kind of reason for fear. It does not make the spider fearsome. So, we have two state-given reasons. One (trust) seems permissible, or at least not obviously wrong-kind. The other (fear) is paradigmatically wrong-kind. If I simply say "object-given is right, state-given is wrong," I collapse the distinction between your two cases. I need a deeper criterion.

  **B:** Precisely. So what is the deeper criterion?

  **A:** It lies in the constitutive aim of the attitude. Trust aims at establishing a reliable bond. When I trust you, I am trying to bring about a relationship where you are trustworthy. The reason "trusting makes you trustworthy" bears on the *success conditions* of the attitude itself. It tells me that by trusting, I am fulfilling the internal goal of trust.

  **B:** And the fear case?

  **A:** Fear aims at detecting danger. It does not aim to make me cautious. Caution is a side-effect, a useful byproduct. The reason "fear makes me cautious" bears on the *utility* of the attitude, not its success conditions. So, the distinction isn't strictly object versus state. It is between reasons that bear on whether the attitude achieves its constitutive aim, and reasons that bear on the external benefits of having the attitude. The trust reason is the former; the fear reason is the latter. The demon's threat is also the latter.

  **B:** This is a significant revision. You are no longer distinguishing reasons by their content—whether they mention the object or the state—but by the functional role of the attitude. But notice what you've done. To determine which reasons are the "right kind," you have to know what the constitutive aim of the attitude is. And how do we determine the aim?

  **A:** By looking at what makes the attitude appropriate.

  **B:** Which is to say, by looking at what makes it *fitting*. You are using fittingness to identify the aim, and the aim to identify the right-kind reasons, and the right-kind reasons to identify the fittingness.

  **A:** Not quite. I am using the nature of the attitude to identify the reasons. The nature of trust is such that it seeks trustworthiness. That is a conceptual truth.

  **B:** But why does trust seek trustworthiness? Because trustworthiness is what makes trust *correct*. You are smuggling fittingness in through the back door of "constitutive aims." Let me offer my alternative. On my view, fittingness is primitive. It is a normative property akin to truth. Just as belief aims at truth, admiration aims at the admirable. We don't analyze truth in terms of reasons to believe; we analyze reasons to believe in terms of truth. Similarly, we shouldn't analyze fittingness in terms of reasons; we should analyze reasons in terms of fittingness.

  **A:** If fittingness is primitive, how do you distinguish the demon's threat from the demon's wit without invoking reasons? You say the threat doesn't make admiration fitting. Why not?

  **B:** Because fittingness is a matter of correctness conditions. For admiration to be fitting, the object must possess qualities that merit admiration. The threat does not give the demon merit. It gives *you* a motive. My view handles your two cases easily. In the trust case, the reason "trusting makes them trustworthy" is a reason to *bring it about* that trust is fitting. It is a pragmatic reason to cultivate an attitude that can become fitting. In the fear case, "fear makes me cautious" is a reason to induce fear for safety. Neither makes the attitude fitting *now*. The trust reason feels better because it points toward the fittingness condition (trustworthiness), whereas the fear reason points away from it (caution).

  **A:** But this leaves you vulnerable to the charge of emptiness. If I ask, "What makes the demon admirable?" you say, "Nothing, he isn't." If I ask, "What makes an attitude fitting?" you say, "When the object merits it." If I ask, "What is merit?" you say, "What makes the attitude fitting." You have circled. My account was meant to explain value. Value is what we have reasons to value. You are saying Value is what makes valuing fitting. But if you can't explain fittingness without referencing the reasons that bear on it, you haven't explained anything.

  **B:** I can explain fittingness without reasons. Fittingness is the normative standard internal to the attitude. Consider assertion. An assertion is correct if it is true. We don't define truth as "whatever gives us the right kind of reason to assert." We define the reason to assert as "the truth." The normativity comes from the standard of correctness, not from the space of reasons. In your trust case, you struggled to distinguish the reason from the demon's threat. You had to appeal to the "constitutive aim." I say the constitutive aim *is* the fittingness condition. The reason gets its grip from the aim, not the other way around. The reason "trusting makes them trustworthy" has force only because trustworthiness is already the standard for trust.

  **A:** But surely the standard itself must be grounded. Why is trustworthiness the standard for trust? Because we have reasons to value reliable bonds. The normativity flows from the reasons to the standard. If we had no reason to care about reliability, trust wouldn't be valuable, and trustworthiness wouldn't be a standard of merit. You treat fittingness as a brute fact, like a law of nature. But it's normative. It commands us. What gives it the authority to command?

  **B:** The authority comes from the nature of the attitudes we are capable of. We cannot simply decide to believe what is false, or trust what is unreliable, without violating our own nature as rational agents. The "ought" is internal to the practice. You want to ground the practice in external reasons. I say the practice generates the reasons.

  **A:** Let's test that. Suppose I encounter a new attitude, one we have no name for. How do I know what makes it fitting?

  **B:** You examine the attitude. What is it responsive to? What counts as a mistake in that attitude?

  **A:** And how do I determine what counts as a mistake? By asking if there are reasons to criticize it.

  **B:** No. By seeing if the attitude matches its object. If I fear a shadow, I have made a mistake, not because there is a reason to criticize me, but because the shadow is not dangerous. The mistake is primary. The criticism is secondary.

  **A:** But you cannot identify the mistake without identifying the reasons why the shadow is not dangerous. The "because" runs from the properties of the object to the fittingness. I say those properties are reasons. You say they are "merits." This seems verbal.

  **B:** It is not verbal. It changes the direction of explanation. For you, the demon is not admirable because there are no object-given reasons to admire him. For me, there are no object-given reasons to admire him because he is not admirable. In your view, reasons are the source of normativity. In mine, normative properties (like merit or danger) are the source, and reasons are our access to them.

  **A:** Here is where I must press you. In the trust case, the reason "trusting makes them trustworthy" actually *changes* the object. It creates the merit. If I don't trust, they aren't trustworthy. So the reason precedes the merit.

  **B:** I concede that in self-fulfilling cases, the reason to adopt the attitude precedes the existence of the fittingness condition. But that shows that reasons can be pragmatic without being right-kind. The reason to trust is pragmatic: it creates the condition for fittingness. It does not make the trust fitting *ex ante*. It makes it *productive*. This preserves the distinction. The fear case is merely productive of safety. The trust case is productive of fittingness. But in both, the fittingness itself is the standard, not the reason.

  **A:** And that is where we remain stuck. You say the reason is productive of fittingness, implying fittingness is the goal. I say the reason is constitutive of the value, implying the value is the goal. In the trust case, if the reason creates the trustworthiness, then the reason is part of what makes the object valuable. You separate them: first the reason to trust, then the trustworthiness. I unite them: the reason to trust is part of the web of value that constitutes the trustworthiness.

  **B:** But that web needs a structure. Without a primitive notion of fittingness, you cannot distinguish the web of value from a web of incentives. The demon offers incentives. The trustworthy colleague offers value. If you define value by reasons, and reasons by incentives versus merits, and merits by value, you are looping. I break the loop by stopping at fittingness.

  **A:** And I break the loop by stopping at reasons. I say the demon's threat is a reason, but not the right kind. You ask what makes it the wrong kind. I say it doesn't bear on the object's value. You ask what value is. I say it's what the right-kind reasons track.

  **B:** So we agree on the circle, but disagree on where to cut it.

  **A:** No. We disagree on what is doing the work. You think fittingness is a substantive property that constrains reasons. I think fittingness is a placeholder for the conclusion of deliberation about reasons.

  **B:** Then let us state our disagreement precisely.

  **A:** Agreed.

  **B:** My claim is that the normative force of a reason to have an attitude depends on the prior normative standard of correctness for that attitude. The reason is good *because* it tracks fittingness.

  **A:** And my claim is that the normative standard of correctness for an attitude is determined by the balance of the right kind of reasons supporting it. The attitude is fitting *because* there are such reasons.

  **B:** So the dispute is not about which reasons are right or wrong. We likely agree on the cases. The dispute is about the direction of grounding.

  **A:** Exactly. Is the normativity of value grounded in the space of reasons, where fittingness is the label we give to the outcome of correct reasoning? Or is the normativity of value grounded in the standards of correctness inherent to attitudes, where reasons are merely the tools we use to perceive those standards?

  **B:** I hold the latter. Fittingness is the light; reasons are the eyes.

  **A:** And I hold the former. Reasons are the light; fittingness is what we see when the light falls properly.

  **B:** Then we have clarified the impasse. We cannot resolve it by appealing to more cases, because every case we describe will be described using both reasons and fittingness.

