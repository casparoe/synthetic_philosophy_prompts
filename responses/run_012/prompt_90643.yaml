      *   **B's Problem:** If fittingness is primitive, how do we distinguish the Demon's threat from the Demon's admirable qualities without invoking reasons? B needs to say the threat doesn't make admiration *fitting*, even if it makes it *sensible*. But if B defines "fitting" as "what there are right-kind reasons for," B is circular. B needs to define fittingness independently (e.g., correctness conditions, aptness).

