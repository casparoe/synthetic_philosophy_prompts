  Maxwell's Demon is a brilliant bookkeeper, but he failed to account for the cost of closing the books. He realized that while keeping the records costs nothing, burning them to clear the ledger dissipates exactly enough heat to balance the entropy budget.

  **Sharper version:**
  Maxwell's Demon thought he could hide the entropy debt in his memory. But Landauer is the universe's auditor, and he charges full price in heat for every bit you try to forget.

  **Gentler version:**
  Maxwell's Demon could sort the molecules all night, but he refuses to wipe his memory to start again. He knows the heat from that forgetfulness would warm us up faster than the sorting cools us down.
