  **WESTSHIRE COUNTY COUNCIL | PUBLIC CONSULTATION UNIT**
  **PUBLIC REASONS DESK: RESIDENT GUIDANCE NOTES (REV. 4.2)**

  **1. Purpose of the Desk**
  To ensure that all coercive planning decisions rest on grounds acceptable to all reasonable citizens, the Public Reasons Desk vetts resident arguments before entry to the Chamber. The Desk does not assess the truth of any belief, only its accessibility to the wider citizenry.

  **2. Classification of Premises**
  Arguments are categorised as either **Public** or **Comprehensive**.
  *   **Public Premises** are those derived from shared democratic values or existing statutory frameworks (e.g., traffic safety, property value stability, welfare maximisation). These require no further documentation.
  *   **Comprehensive Premises** rely on doctrines not shared by all reasonable citizens (e.g., theological commands, specific metaphysical ethics). Residents wishing to cite Comprehensive Premises must file a **Public Reason Annex (Form PRA-9)**, translating the objection into secular terms acceptable to those outside their doctrine.

  **3. The Translation Protocol**
  Submission of a Comprehensive Premise grants a provisional speaking slot. However, the objection will not be entered into the official record unless a valid Public Reason Annex is filed within the **Retroactive Filing Window** (72 hours post-hearing). Failure to file results in the objection being noted as 'Private Conviction' and excluded from the voting summary. Residents are advised that translation services are subject to demand; please consult the queue monitor for **Translation Waiting Area B**.

  **4. Assessment of Reasonableness**
  The Desk determines which premises qualify as 'reasonable'. This assessment is based on current consensus standards. Residents should note that premises aligning closely with established council frameworks (such as consequentialist welfare models or standard property rights theories) are typically pre-cleared under the **Standing Exception for Administrative Matters**. Conversely, premises unique to minority worldviews undergo rigorous scrutiny to ensure they do not impose sectarian burdens on the majority.

  *Note:* The Desk cannot justify its definition of 'reasonable' without appealing to the principle of public reason itself. Residents querying this definition are referred to Section 1 of this Handbook.

  **5. Appeals and Licences**
  Residents may appeal a classification decision to the **Standards Committee**. However, the Committee operates under the same Public Reason mandate. Additionally, frequent speakers may apply for a **Licence for Approved Premises**, which streamlines entry for arguments previously deemed accessible. Please note that holding a Licence does not guarantee hearing time if the Chamber agenda is full.

  **6. Operational Mandate**
  The Desk operates on the principle that political power must be justifiable to all free and equal citizens. This principle is itself a foundational commitment of the Consultation Unit. As such, challenges to the necessity of the Desk are treated as procedural matters rather than substantive objections.

  **7. Disclaimer**
  The Public Reasons Desk takes no view on the theological or philosophical truth of any resident's beliefs. A premise may be true but inadmissible; conversely, a premise may be admissible but false. The Desk's sole concern is whether a reason can be accepted by a citizen who does not share the speaker's comprehensive worldview.

  **Contact:** public.reasons@westshire.gov.uk
  **Office Hours:** Mon–Fri, 09:00–17:00 (Closed during theological holidays not recognised by the State)
