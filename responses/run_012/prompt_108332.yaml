prompt: |-
  ok so my friend Nadia is an evolutionary biologist, her old labmate Devon does cognitive science, and the three of us ended up arguing about this for like two and a half hours last night and now I honestly can't tell who was making sense. I mostly refilled drinks. Heres the setup, and then the exchange.

  The thing they were arguing about: a pre-registered study run in eight small-scale societies, maybe 1200 people total. You play a one-shot anonymous sharing game right after recalling a time you were betrayed. Two versions of the betrayal: by a romantic partner, or by a business partner. After the romantic one people gave away about 15% less. After the business one, nothing — if anything slightly more. Effect held in all eight sites, and it vanished when the betrayer was a same-sex friend. Thats all I know about it, I'm not vouching for the study.

  Nadia: this is how it's supposed to be done. She says the mechanism is a mate-directed vigilance system — it reads betrayal by a mate as information about whether investing in relationships pays, and business betrayal simply isn't the input it was built to take. She says the tell is the interaction. A boring bad-mood-makes-you-stingy story predicts everyone gives less, and they didn't. A designed mechanism should be picky about its inputs, and pickiness is a prediction you can flunk. She calls that the signature test. She also said an optimality claim like this owes you three things — what's being maximized, what constrains it, and what the options were — and she thinks the study supplies all three.

  Devon: interactions are cheap. You can always find a condition where an effect switches off, and switch-offs are exactly the kind of thing you rationalize after the fact — oh, that input isn't the one the system detects. He says the real problem is that nothing here tells you what the system is for. For a heart you can measure output and load and pressure. For this, the ancestral problem is read off the result itself, so the explanation runs in a circle. When Nadia said the ancestral environment isn't a time or a place, it's just shorthand for whatever selection pressures built the trait, he said great, then name one human psychological selection pressure anyone has measured rather than inferred from the behavior it's meant to explain. He also said universal doesn't mean evolved — eight societies can share a response because they share markets, marriage rules, religions, whatever. Cross-cultural sameness only helps if you find a place where the culture predicts one thing and the adaptation story predicts another.

  Nadia: fair about universals, but she said historical sciences do this constantly — geology, cosmology, historical linguistics — and demanding a direct experiment on the Pleistocene is just demanding the science not exist. She said the byproduct move is worse than the adaptation move: calling it a byproduct of reputation management just pushes the adaptation back a step, and if the byproduct fits the ancestral problem that neatly, Devon owes an account of why. She said if you need a measured ancestral pressure for every functional claim you'd have to throw out half of biology.

  Devon: fit between design and task is the thing in dispute, so it can't be the evidence for it. And he said if you can't say what would count as the trait not being an adaptation, the claim isn't doing any work.

  Then they started fighting about the paper itself and I lost the thread. Can you go through it move by move, rate each move from clearly mistaken to clearly right, and tell me who's right about which specific claim? Not a winner overall — each step. Also what each of them is missing, and if there's one further finding that would actually settle the big disagreement, what it would have to look like.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A debate between Nadia (Evolutionary Biologist) and Devon (Cognitive Scientist) about a specific study (pre-registered, 8 societies, N=1200, betrayal priming -> sharing game).
      *   **Task:** Analyze the argument move-by-move, rate each move (mistaken to right), identify who is right about specific claims, identify what each is missing, and propose a decisive further finding.
      *   **Constraint:** Do not declare an overall winner. Focus on specific claims.
      *   **Tone:** Objective, analytical, knowledgeable about Evo Psych/Cognitive Science methodology.

  2.  **Deconstruct the Study (as described):**
      *   **Design:** One-shot anonymous sharing game.
      *   **Prime:** Recall betrayal (Romantic vs. Business vs. Same-sex Friend).
      *   **Result:** Romantic betrayal -> 15% less giving. Business betrayal -> No change/slightly more. Friend betrayal -> Effect vanishes.
      *   **Scope:** 8 small-scale societies (cross-cultural).
      *   **Claim:** Mate-directed vigilance system (adaptation).

  3.  **Deconstruct the Arguments:**

      *   **Nadia (Evo Bio perspective):**
          *   *Claim 1:* Methodology is good ("how it's supposed to be done").
          *   *Claim 2:* Mechanism = Mate-directed vigilance. Betrayal by mate signals investment risk; business betrayal isn't the input.
          *   *Claim 3:* The "Interaction" is the signature test. Specificity (pickiness) rules out general mood effects.
          *   *Claim 4:* Optimality claims need: Maximize what? Constraints? Options? She thinks the study supplies these.
          *   *Claim 5:* Historical science analogy (geology/cosmology). Can't experiment on Pleistocene.
          *   *Claim 6:* Byproduct counter-argument. If it fits ancestral problems neatly, calling it a byproduct just pushes the buck.
          *   *Claim 7:* Demanding measured ancestral pressure throws out half of biology.

      *   **Devon (Cog Sci perspective):**
          *   *Claim 1:* Interactions are cheap/post-hoc rationalization.
          *   *Claim 2:* Circular reasoning. Ancestral problem read off the result.
          *   *Claim 3:* Need measured selection pressures, not inferred ones.
          *   *Claim 4:* Universals (8 societies) don't prove evolution (could be shared culture/markets).
          *   *Claim 5:* Need a case where culture predicts X and adaptation predicts Y.
          *   *Claim 6:* Fit between design and task is the dispute, can't be the evidence.
          *   *Claim 7:* Falsifiability. If you can't say what counts as *not* an adaptation, the claim does no work.

  4.  **Evaluate Each Move (Drafting the Analysis):**

      *   *Nadia 1 (Methodology):* Pre-registration + cross-cultural is strong. *Rating:* Mostly Right.
      *   *Devon 1 (Interactions are cheap):* True in principle (p-hacking), but pre-registration mitigates this. *Rating:* Partially Right (caution needed), but weak against pre-reg.
      *   *Nadia 2 (Specificity/Pickiness):* This is a core Evo Psych tenet (domain specificity). Distinguishing mate vs. business supports modularity. *Rating:* Right.
      *   *Devon 2 (Circularity):* This is the "Just-So Story" critique. If the function is inferred solely from the effect, it's weak. *Rating:* Right (methodological risk).
      *   *Nadia 3 (Optimality Criteria):* Does the study actually define constraints/options? The prompt says "She thinks the study supplies all three." Usually, these studies are light on actual constraints. *Rating:* Skeptical/Likely Overstated.
      *   *Devon 3 (Measured Pressures):* Demanding *direct* measurement of Pleistocene pressures is impossible (Nadia's point). But demanding *independent* evidence is valid. *Rating:* Mixed (Too strict on measurement, right on independence).
      *   *Nadia 4 (Historical Science):* Valid analogy. We infer past causes from present traces in geology too. *Rating:* Right.
      *   *Devon 4 (Universals/Culture):* 8 small-scale societies might still share deep cultural structures (patriarchy, trade). *Rating:* Right (caution needed on "universal").
      *   *Devon 5 (Falsifiability):* Crucial point. What would disprove the adaptation hypothesis? *Rating:* Right.

  5.  **Synthesize the "Missing" Pieces:**
      *   **Nadia:** Missing independent evidence of the mechanism (neural, developmental). Over-relying on "fit."
      *   **Devon:** Missing appreciation for pre-registration reducing post-hoc rationalization. Dismissing historical inference entirely makes *any* evolutionary claim impossible.

  6.  **Develop the "Decisive Finding":**
      *   To settle Adaptation vs. Byproduct/Culture:
      *   Need something that dissociates the *function* from the *current utility*.
      *   Need something that shows the mechanism exists *before* cultural learning.
      *   *Idea:* Developmental trajectory (kids vs. adults) or Neural specificity (fMRI showing distinct circuits for mate vs. business betrayal that correlate with sharing).
      *   *Better Idea:* A "mismatch" finding. If the system triggers in a context where it *reduces* fitness now, but matches the ancestral logic, that supports adaptation. Or, showing the mechanism exists in contexts where cultural learning is impossible (very young children).
      *   *Best Idea:* A double-dissociation in a population with altered cultural norms regarding marriage/business, OR a developmental study showing the specificity emerges prior to cultural instruction. Let's go with a developmental/cross-cultural mismatch.

  7.  **Refine the Ratings and Tone:**
      *   Ensure neutrality.
      *   Use terms like "Domain Specificity," "Falsifiability," "Phylogenetic Inference," "Pre-registration."
      *   Check against the prompt's request for "Clearly Mistaken" to "Clearly Right."

  8.  **Final Review against the Prompt:**
      *   Did I go move by move? Yes.
      *   Did I rate them? Yes.
      *   Did I say what they are missing? Yes.
      *   Did I propose a decisive finding? Yes.
      *   Did I avoid declaring an overall winner? Yes.

      *(Self-Correction during drafting)*: I need to be careful about Nadia's claim regarding "Optimality." Evolutionary biologists often talk about optimality models, but behavioral studies rarely quantify constraints rigorously. I should rate that as "Overstated" rather than "Right."
      *(Self-Correction on Devon)*: Devon's demand for "measured selection pressure" is technically impossible for the Pleistocene. I need to nuance that he's right about *independence* but wrong about *measurement*.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Decisive Finding" is concrete. (Proceed to generate output).

      *Wait, one more check:* The prompt asks to rate from "clearly mistaken to clearly right." I should use a scale or clear descriptors for each point. I will use a descriptive scale for nuance.

      *Structure:*
      1. Introduction (acknowledge the complexity).
      2. Move-by-Move Analysis (Nadia vs. Devon).
      3. What Each Is Missing.
      4. The Decisive Finding.

      *Let's flesh out the Decisive Finding:* To distinguish Adaptation vs. Cultural Universal vs. Byproduct.
      If it's cultural: Vary the cultural rules (e.g., societies where business partners are kin vs. strangers).
      If it's adaptation: It should track *recurrent ancestral statistics*, not current cultural rules.
      If it's a byproduct: It should correlate with a general cognitive capacity (like memory load).
      *The Winner:* A study showing the effect in children *before* they understand the economic concepts of "business" vs "romance," but *after* they understand "commitment." Or, a neural dissociation. Let's suggest a developmental trajectory + cultural mismatch.

      *Actually, the strongest test for Adaptationism is "Design Evidence" + "Falsifiability".*
      Devon says "What would count as not an adaptation?"
      Nadia says "Specificity."
      The decisive finding needs to address Devon's falsifiability concern while validating Nadia's specificity claim.
      *Proposal:* A study where the "Romantic" prime is manipulated to be *fitness-enhancing* to betray (e.g., in a specific hypothetical scenario), and seeing if the vigilance system *still* triggers. Adaptations are often rigid (error management). If it triggers even when costly now, it supports the "ancestral statistic" hypothesis over a rational calculation hypothesis.
      *Alternative:* Show the mechanism exists in a society where "Business" and "Romance" are structurally identical. If the effect persists, it's biological. If it vanishes, it's cultural.

      Let's go with the "Cultural Mismatch" + "Developmental" angle. It addresses Devon's culture critique and Nadia's adaptation claim.

      *Okay, ready to write.*
answer: |-
  This is a classic debate between **Adaptationism** (Nadia) and **Spandrel/Cultural Construct skepticism** (Devon). It mirrors the "Santa Fe Institute" vs. "Evolutionary Psychology" debates of the 90s, updated with modern pre-registration standards.

  Here is the move-by-move breakdown, rated on a spectrum from **Clearly Mistaken** to **Clearly Right**, followed by what each is missing and the decisive test.

  ### Move-by-Move Analysis

  #### 1. The Study Design (Pre-registered, 8 societies, N=1200)
  *   **Nadia:** "This is how it's supposed to be done."
  *   **Devon:** (Implicitly accepts the data, challenges the inference).
  *   **Rating:** **Nadia is Mostly Right.**
  *   **Analysis:** Pre-registration eliminates the "p-hacking" concern regarding the interaction effect. Running it in eight small-scale societies controls for WEIRD (Western, Educated, Industrialized, Rich, Democratic) bias. As a piece of empirical data, this is robust. However, robust data does not guarantee a robust *explanation*.

  #### 2. The "Interaction" as Evidence (Specificity)
  *   **Nadia:** "A designed mechanism should be picky about its inputs... pickiness is a prediction you can flunk. She calls that the signature test."
  *   **Devon:** "Interactions are cheap. You can always find a condition where an effect switches off... rationalize after the fact."
  *   **Rating:** **Nadia is Right (with caveats); Devon is Partially Right.**
  *   **Analysis:** Nadia is invoking **Domain Specificity**, a core tenet of evolutionary psychology. A general "bad mood" mechanism *should* reduce sharing across the board. The fact that it only reduces sharing for *romantic* betrayal is strong evidence for a modular system. Devon is right that post-hoc interactions are suspect, but since this was **pre-registered**, the "rationalize after the fact" critique loses most of its bite. The prediction was made before the data was seen.

  #### 3. The Circularity Charge (Inferring Function from Effect)
  *   **Devon:** "Nothing here tells you what the system is for... the ancestral problem is read off the result itself, so the explanation runs in a circle."
  *   **Nadia:** "Historical sciences do this constantly... demanding a direct experiment on the Pleistocene is just demanding the science not exist."
  *   **Rating:** **Devon is Right on Logic; Nadia is Right on Practice.**
  *   **Analysis:** Devon identifies a real logical hazard: **Reverse Engineering**. If you define the function solely by the behavior you observe, you cannot use that function to explain the behavior. However, Nadia is correct that all historical sciences (geology, cosmology) infer past causes from present traces. You cannot measure Pleistocene pressures directly. The standard is not "direct measurement" but "independent triangulation."

  #### 4. Optimality Claims (Constraints and Options)
  *   **Nadia:** "An optimality claim like this owes you three things — what's being maximized, what constrains it, and what the options were — and she thinks the study supplies all three."
  *   **Devon:** (Counters that fit between design and task is the thing in dispute).
  *   **Rating:** **Nadia is Overstated; Devon is Right.**
  *   **Analysis:** This is Nadia's weakest move. Behavioral papers rarely quantify "constraints" and "options" rigorously enough to satisfy true optimality modeling. They usually assume the constraint (e.g., "risk of investment") rather than measuring it. Claiming the study *supplies* these is likely an overinterpretation of the discussion section. Devon is right that "fit" cannot be the sole evidence for fit.

  #### 5. Universals vs. Culture
  *   **Devon:** "Universal doesn't mean evolved — eight societies can share a response because they share markets, marriage rules, religions... Cross-cultural sameness only helps if you find a place where the culture predicts one thing and the adaptation story predicts another."
  *   **Nadia:** "Fair about universals."
  *   **Rating:** **Devon is Clearly Right.**
  *   **Analysis:** This is the strongest sociological critique. Eight small-scale societies may still share deep structural similarities (e.g., pair-bonding norms, trade reciprocity). True evidence for adaptation requires a **mismatch study**: a population where the cultural rule contradicts the hypothesized adaptation. If the effect persists despite the cultural rule, it's likely biological. If it vanishes, it's likely cultural.

  #### 6. Measured Selection Pressures
  *   **Devon:** "Name one human psychological selection pressure anyone has measured rather than inferred from the behavior it's meant to explain."
  *   **Nadia:** "If you need a measured ancestral pressure for every functional claim you'd have to throw out half of biology."
  *   **Rating:** **Devon is Mistaken on Feasibility; Nadia is Right.**
  *   **Analysis:** Devon is demanding the impossible. You cannot measure selection pressures on extinct populations. Biologists infer selection pressures in paleontology all the time based on morphology and environment. Nadia is correct that requiring direct measurement would halt the field. However, Devon's underlying point stands: the pressure needs to be inferred from *ecology*, not just the *behavior*.

  #### 7. Falsifiability
  *   **Devon:** "If you can't say what would count as the trait not being an adaptation, the claim isn't doing any work."
  *   **Nadia:** "The byproduct move is worse... if the byproduct fits the ancestral problem that neatly, Devon owes an account of why."
  *   **Rating:** **Devon is Clearly Right.**
  *   **Analysis:** This is the philosophical kill shot. Adaptationism often becomes unfalsifiable because any counter-evidence can be explained away as "context-dependent calibration." Nadia's counter (that byproducts are also hard to prove) is true, but the burden of proof lies on the positive claim (Adaptation). If "Mate Vigilance" explains *both* giving less (vigilance) and giving more (signaling), it explains everything and therefore nothing.

  ---

  ### What Each Is Missing

  **Nadia is missing Independent Mechanism Evidence.**
  She is relying heavily on the "logic of evolution" (the *why*). To secure her claim, she needs the "mechanism of implementation" (the *how*). She needs to show that this isn't just a learned rule ("don't trust cheaters") but a specialized cognitive module. She lacks neural, developmental, or hormonal data that dissociates this specific vigilance from general trust or anger systems.

  **Devon is missing the Value of Pre-Registration.**
  He is treating the interaction effect as if it were discovered post-hoc ("interactions are cheap"). Because the study was pre-registered, the "pickiness" of the effect *is* a genuine prediction, not a rationalization. He is also being overly reductionist about historical science; demanding direct measurement of the Pleistocene is indeed a category error, though his demand for *independent* ecological evidence is valid.

  ---

  ### The Decisive Finding

  To settle the disagreement, you need a finding that dissociates **Ancestral Logic** from **Current Cultural Logic**.

  **The Study Design:**
  Find a society (or subculture) where the **economic risk** of romantic betrayal is *lower* than the economic risk of business betrayal, or where romantic partners are *not* the primary economic unit.

  *   **Hypothesis A (Nadia/Adaptation):** The effect persists. People reduce sharing after romantic betrayal *even if* their culture teaches that business betrayal is more financially devastating. This proves the system is tracking ancestral statistics (mate fidelity = survival), not current economic rationality.
  *   **Hypothesis B (Devon/Culture):** The effect flips or vanishes. People reduce sharing after business betrayal because that is where the actual survival risk lies in *this* culture. This proves the mechanism is a flexible learning system responding to current ecological pressures, not a fixed adaptation.

  **Alternative Decisive Finding (Developmental):**
  Run the study on children (age 5–7) who understand "promises" and "friends" but have not yet been enculturated into the specific economic distinctions between "romance" and "business."
  *   If they show the specific romantic betrayal effect before being taught the economic stakes of marriage, it supports a **prepared learning mechanism** (Nadia).
  *   If they show no effect, or a general "friend betrayal" effect, it suggests the adult result is **culturally acquired** (Devon).

  **Verdict on the Debate:**
  Nadia wins on the **methodology of the specific study** (pre-registered specificity is strong evidence). Devon wins on the **philosophy of the claim** (without independent ecological or developmental evidence, the adaptationist label is premature). The study proves there is a *psychological specificity*; it does not yet prove that specificity is an *evolutionary adaptation* rather than a *culturally universal learning rule*.
