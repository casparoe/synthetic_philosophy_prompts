answer: |-
  You have put your finger on the central nerve of contemporary philosophy of science. The "squeeze" you are feeling is real, and it is the friction between two different kinds of reduction that often get conflated in casual conversation (and even in some textbooks).

  Here is the carving you asked for.

  ### The Carving: Two Types of Reduction
  The tension exists because your classmates (or textbook) are sliding from **Explanatory Reduction** to **Ontological Reduction** as if they were the same step. They are not.

  1.  **Explanatory Reduction (The Derivation):** This is the claim that you can *derive* the behavior of the whole from the laws governing the parts. In your examples, this is true. You *can* model the flock using bird dynamics; you *can* model the gas using particle collisions. This is about *predictive derivability*.
  2.  **Ontological Reduction (The "Nothing But"):** This is the claim that the higher-level entity *does not exist* as a distinct causal agent or that its properties are not "real" in their own right. This is the "nothing but" move. It claims that because the parts do the work, the whole is merely a shorthand label.

  The "squeeze" is the realization that **Explanatory Reduction can be successful while Ontological Reduction is false (or at least unhelpful).** You can derive the macro from the micro (Explanatory Reduction holds) without the macro being dispensable or "nothing but" the micro (Ontological Reduction fails).

  ### The Mechanism: Universality vs. Multiple Realizability
  You mentioned you've heard "Multiple Realizability" (MR) but it didn't feel like quite the thing. You are right to be skeptical. MR is usually a claim about *different substrates* producing the *same mental state* (e.g., silicon vs. neurons).

  The phenomenon you are describing—where the macro-law stays true even when you swap the parts (fish vs. birds, particles vs. people)—is more precisely called **Universality** (specifically in the sense used by the Renormalization Group in physics and complexity theory).
  *   **Multiple Realizability** says: "Different parts can make this thing."
  *   **Universality** says: "The specific details of the parts *don't matter* for the macro behavior; only the abstract structural relationships matter."

  This is why the micro-story feels fragile ("needs one very specific arrangement") while the macro-story is robust. The micro-story is sensitive to initial conditions; the macro-story is an **attractor** that swallows those details. This robustness is what gives the higher level its leverage.

  ### The Name of the Squeeze
  The established term for the status of the higher-level description that resists the "nothing but" dismissal, despite being derivable, is **Explanatory Autonomy**.

  This term captures exactly what you are pointing at:
  *   **Explanatory:** It acknowledges the micro-story exists and works (unlike "Strong Emergence," which claims the macro is magically underviable).
  *   **Autonomy:** It asserts that the macro-story does unique work (prediction, generalization, stability) that the micro-story cannot replicate efficiently or intelligibly.

  When someone says "It's nothing but particles," they are committing a category error often called **Greedy Reductionism** (Daniel Dennett's term) or simply **Ontological Reductionism**. They are assuming that because the parts are *fundamental*, they are *exclusive*. Explanatory Autonomy is the counter-claim: the higher level is *dependent* on the parts, but *autonomous* in its explanatory power.

  ### Boundary Cases
  To test if you have the concept right, look at these edges:

  1.  **True Reduction (No Squeeze):** *Water is H₂O.*
      Here, the macro term "water" picks out *only* H₂O. There is no universality across different substances. If you find a liquid with the same properties but different chemistry, we wouldn't call it water (we'd call it a water-analogue). Here, the "nothing but" claim is much stronger because the macro kind is rigidly tied to the micro kind.
  2.  **Strong Emergence (No Derivation):** *Consciousness (on some views).*
      If you claim consciousness *cannot* be derived from neurons even in principle, you have escaped the squeeze by denying Explanatory Reduction. But this risks making the macro magical. Your examples (gas, flocks) are not like this; they are derivable.
  3.  **The Squeeze (Explanatory Autonomy):** *Thermodynamics / Phase Transitions.*
      You can derive thermodynamics from statistical mechanics. But the concept of "temperature" remains autonomous because it applies to systems with wildly different micro-constituents (photons, atoms, spins). The micro-derivation is often mathematically intractable or singular (requiring infinite limits), making the macro-law the only *usable* truth. This is the sweet spot you are inhabiting.

  ### Summary
  The "nothing but" move tries to collapse the hierarchy because the bottom layer is fundamental. Your intuition correctly identifies that the top layer is **robust** in a way the bottom layer is not. The micro-details are often *irrelevant* to the macro-pattern. To dismiss the macro as "nothing but" the micro is to dismiss the very stability that makes science possible. The term for the macro's right to exist as a useful, distinct description is **Explanatory Autonomy**.

  \answer{Explanatory Autonomy}
