answer: |-
  1. **The Collapse Worry**
  You argue that the "sainted will" (maximal responsiveness to reasons) and the "sainted ledger" (maximal moral output) are distinct ideals. But if a morally responsive agent acknowledges that outcomes provide *some* moral reasons, wouldn't maximal responsiveness require them to optimize those outcomes wherever possible? If so, doesn't the sainted will inevitably collapse into the sainted ledger once we specify the content of the reasons to which the will is responding?

  *Follow-up:* You will likely reply that there are agent-relative reasons that block this collapse. But if those relative reasons are weighty enough to prevent outcome optimization, doesn't that imply the "moral" reasons are actually doing very little work in the sainted will compared to the personal ones? How do you prevent the distinction from simply restating the divide between consequentialist and non-consequentialist theories without solving the saint problem?

  2. **The Value of Unmeasurability**
  You claim an asymmetry: the ledger is measurable, but the will is not, because finite agents cannot represent all relevant reasons. You present this unmeasurability as a virtue that protects the will ideal. But why should we view the inability to measure moral success as an advantage? In other normative domains, unmeasurability is often a bug that leads to self-deception. Doesn't making the sainted will a "black box" of internal responsiveness make it impossible to critique someone's claim to be approximating it?

  *Follow-up:* I anticipate you'll argue that measurability invites fetishization of the ledger. But if we can't measure progress toward the will, how do we distinguish between someone genuinely approximating the ideal and someone merely self-satisfied? Does the regulative status of the will strip it of the critical bite needed to guide action?

  3. **Ought-Implies-Can and the Ceiling**
  You argue that because we cannot represent indefinitely many reasons, full responsiveness is unattainable, making the sainted will a regulative ideal. But if the ceiling on responsiveness is set by cognitive limits rather than moral necessity, does this violate *ought-implies-can*? If I literally *cannot* represent the reason, in what sense am I obliged to be responsive to it? Does calling it a "regulative ideal" just paper over the fact that the ideal is, by definition, impossible to instantiate?

  *Follow-up:* You will likely lean on a Kantian conception of regulative ideals as necessary for orientation. But if the ideal is cognitively inaccessible, how does it orient us? If I know I can never achieve full responsiveness, doesn't that license me to settle for "good enough" responsiveness, thereby undermining the "maximal" requirement central to your definition?

  4. **The Scope of Agent-Relative Reasons**
  To keep the will distinct from the ledger, you rely heavily on the agent's permission to pursue personal projects. But for the sainted will to remain *maximally* responsive, mustn't the agent constantly assess whether those personal projects are still permissible? If the will is truly "sainted," doesn't it require a standing commitment to abandon any project the moment moral reasons outweigh it? Doesn't this reintroduce the crowding-out problem as a constant cognitive background demand?

  *Follow-up:* I expect you to say that personal projects are constitutive of the reasons themselves, not competitors. But if a project's moral permissibility is always contingent on the broader moral landscape, doesn't the agent still need to monitor that landscape continuously? How is that monitoring not a form of crowding out, even if it doesn't result in action?

  5. **The Test Cases (Idler and Reluctant Saint)**
  Let's look at the "Serene Idler," whose will is perfect but output is low due to circumstance. You use this to pry the ideals apart. But isn't this just a redescription of the familiar intuition that moral worth is distinct from moral luck? Does positing two distinct *ideals* actually explain anything new, or does it just label the pre-existing distinction between control and outcome with new terminology?

  *Follow-up:* You'll likely argue that the distinction explains *why* we value the will despite the luck. But if the Idler is the ideal, aren't we valorizing inefficiency? If two agents have identical wills but one saves a life and the other doesn't due to luck, why is the "sainted will" label equally applicable if the moral reality they engaged with was so different?

  6. **The Reluctant Saint's Resentment**
  Conversely, take the "Reluctant Saint" who does the right thing but resents it. You argue this fails the will ideal but succeeds at the ledger. But if the agent reliably produces the right action, isn't their will effectively aligned with moral reasons, regardless of the phenomenological cost? Is resentment really a failure of responsiveness, or is it just an emotional tax that a maximally responsive agent might have to pay in a non-ideal world?

  *Follow-up:* You will probably insist that resentment signals a misalignment of values. But if the agent *knows* the reasons and acts on them, isn't the resentment a separate psychological module? Why does the "sainted will" require emotional harmony rather than just rational alignment? Are you smuggling a virtue-ethical requirement into a reasons-responsiveness framework?

  7. **Relocating the Crowding-Out Objection**
  Susan Wolf's original worry was that moral saints lack personality. You argue the sainted will avoids this. But if the sainted will requires maximal responsiveness, doesn't it demand that all personal projects be held permanently revisable in light of new moral reasons? Even if I don't abandon my projects, doesn't the *obligation to be willing to abandon them* crowd out the wholeheartedness required for those projects to be genuine excellences?

  *Follow-up:* I suspect you'll argue that wholeheartedness is compatible with revisability. But isn't there a phenomenological difference between pursuing a project because you love it and pursuing it because it survives a moral audit? If the sainted will requires the latter structure, haven't you just relocated the crowding-out from the *time* spent to the *structure of commitment*?

  8. **Virtue Ethics in Disguise?**
  Your emphasis on the quality of the will, the irrelevance of the ledger, and the compatibility with personal projects sounds remarkably like a reasons-based Virtue Ethics. Is the "sainted will" actually a new contribution to the moral saint debate, or is it essentially a rehabilitation of the virtuous agent under a different name? If it is the latter, doesn't the existing literature on virtue already handle the crowding-out objection without needing this new dichotomy?

  *Follow-up:* You will likely claim your account is grounded in reasons-responsiveness rather than character traits. But if the "will" is just the stable disposition to respond to reasons, what is the substantive difference? If the distinction is merely terminological, does it carry enough weight to bear the argumentative load you place on it regarding the regulative ideal?

  9. **The Normative Force of "Saint"**
  You retain the term "saint" for the will ideal, despite admitting it is unattainable. But "saint" typically denotes someone who has achieved a state of moral perfection, not someone striving for an impossible ceiling. By applying the label to an unattainable regulative ideal, aren't you risking a conceptual inflation where everyone and no one is a saint? Does this dilute the normative force of the term to the point where it no longer tracks the intuitive concept you're trying to rescue?

  *Follow-up:* You'll likely say you're reclaiming the term from the ledger conception. But if the ordinary usage of "saint" implies exceptional output (healing the sick, feeding the poor), doesn't your redefinition create a communication barrier? Why not call it the "ideal moral agent" and reserve "saint" for the ledger, rather than fighting linguistic intuition?

  10. **Falsifying the Distinction**
  To close: you've built a system on the separation of will and ledger. What specific argument, case, or intuition would count as evidence that this distinction is illusory? If I showed you a case where maximizing responsiveness *necessarily* entailed maximizing output, or where the two could not be conceptually disentangled without contradiction, would you abandon the dual-ideal framework, or is the distinction axiomatic for you?

  *Follow-up:* (None, this is the closer).
