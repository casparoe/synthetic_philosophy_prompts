prompt: |-
  I am a high school junior and the student council president. In two weeks, I have to give the opening address at a school-wide assembly where the administration will announce a pilot program to replace our current final-exam policy with a portfolio-based assessment. The audience will include students, teachers, administrators, and one school board member who teaches economics at the local university. I want the speech to argue for a specific version of the pilot, not to survey the pros and cons.

  The dispute has become an empirical stalemate. Some teachers insist that final exams are the only way to ensure retention; others argue that exams mainly measure test-taking ability and that portfolios better capture learning; the school board member has a model in which exams sort students by conscientiousness and thereby improve later outcomes; student surveys show that exam stress is correlated with anxiety and that many students would do better on portfolios, but no one knows whether that would translate into learning gains. I do not want to pretend to resolve this. Instead, I have been reading about safe Pareto improvements—roughly, changes that make at least one person better off and no one worse off relative to the status quo, not just under the best estimate of the relevant facts, but under every plausible model of those facts. I want the speech to commit to a concrete policy (for example, an opt-in two-year pilot with a guaranteed right to switch back after one term) and to defend it as a safe Pareto improvement: under every plausible model of how assessment affects learning, no group is worse off than under the current exam policy, and at least one group is better off. The concept should do real work: it should constrain what I can claim and how I can frame the proposal, so that I am not smuggling in an empirical prediction I cannot defend.

  Please write the speech. It should be formal and polished, suitable for a mixed audience: the economics teacher should recognize the structure of the argument, but my classmates and their parents should be able to follow it. It should take a definite position and give reasons, rather than laying out options and leaving the decision to me. After the speech, add a brief note on where the speech takes liberties with the idea of a safe Pareto improvement or leans on a contested reading of it.
reasoning: |-
  Here's a thinking process that leads to the speech and the accompanying note:

  1.  **Analyze the Request:**
      *   **Speaker:** High school junior, Student Council President.
      *   **Audience:** Students, teachers, administrators, one school board member (economics professor).
      *   **Context:** School-wide assembly, announcing a pilot program replacing final exams with portfolio-based assessment.
      *   **Goal:** Argue for a *specific version* of the pilot, not just survey pros/cons.
      *   **Core Argument:** The proposal is a "Safe Pareto Improvement" (SPI).
      *   **Constraint:** Do not pretend to resolve the empirical stalemate (exams vs. portfolios). Acknowledge uncertainty.
      *   **Definition of SPI (for this context):** A change where, under *every plausible model* of the facts, no group is worse off than the status quo, and at least one group is better off.
      *   **Specific Policy:** Opt-in two-year pilot with a guaranteed right to switch back after one term.
      *   **Tone:** Formal, polished, accessible to students/parents but rigorous enough for the economist.
      *   **Deliverables:** The speech + a brief note on liberties taken/contested readings.

  2.  **Deconstruct "Safe Pareto Improvement" (SPI) in this Context:**
      *   *Standard Game Theory/Decision Theory:* SPI usually involves delegating decision-making to agents with specific constraints to ensure outcomes aren't worse than a default.
      *   *User's Definition:* "Under every plausible model... no one worse off, at least one better off." This is a robust decision-theoretic approach (maximin/robustness).
      *   *Application:* How does an opt-in pilot with a switch-back clause satisfy this?
          *   *Students:* If they hate portfolios, they switch back (not worse off). If they like them, they stay (better off).
          *   *Teachers:* If portfolios fail, they revert to exams (not worse off). If they work, they save grading time/improve pedagogy (better off).
          *   *Administration/Board:* Risk is mitigated by the switch-back clause. Data is gained (better off).
      *   *The "Trap":* Is it *really* a Pareto improvement under *every* model?
          *   *Cost:* Switching back has administrative costs.
          *   *Signaling:* Colleges might view the pilot weirdly (though the speech needs to argue this isn't "worse off").
          *   *Peer Effects:* If some opt-in and some don't, does it create inequality?
          *   *The Note:* I need to acknowledge these tensions in the post-speech note.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the stalemate. Don't pick a side on "which is better," pick a side on "how to decide."
      *   **The Problem:** Empirical uncertainty. Teachers say X, Board Member says Y, Students feel Z. No one knows for sure.
      *   **The Concept:** Introduce "Safe Pareto Improvement" simply but accurately. "Better for some, worse for none, *no matter what turns out to be true*."
      *   **The Proposal:** Opt-in pilot. Two years. Guaranteed switch-back after one term.
      *   **The Argument (The SPI Logic):**
          *   *Scenario A (Exams are best):* Students switch back. No learning loss.
          *   *Scenario B (Portfolios are best):* Students stay. Learning gains.
          *   *Scenario C (Mixed):* Choice allows fit.
          *   *Addressing the Economist:* This isn't gambling; it's hedging.
      *   **Conclusion:** Call to action. Adopt this specific framework.

      *   **Tone Check:** Needs to sound like a smart high schooler (presidential), not a PhD candidate, but respectful of the economist. Avoid jargon where possible, explain it when necessary.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "opt-in" truly a Pareto improvement for *teachers*? If half the class does portfolios and half does exams, grading load might double.
      *   *Fix:* The proposal needs to address teacher workload. Maybe the pilot limits the number of students or ensures administrative support. Or, I frame the "switch back" as applying to the *policy* generally if it fails, not just individual students.
      *   *Decision:* The prompt asks for an "opt-in... with right to switch back." I should stick to that but acknowledge the implementation needs care. I will frame the "no one worse off" carefully: The *option* itself creates value (freedom) without forcing risk.
      *   *Critique:* The definition of SPI provided by the user is slightly different from the technical game-theoretic definition (which often involves binding agreements between agents). I must follow the *user's* definition ("under every plausible model...") while keeping the spirit of the technical term.
      *   *Key constraint:* "The concept should do real work." I can't just say "it's good." I have to show how the *structure* of the proposal guarantees the SPI status. The "switch-back" clause is the key mechanism.

  5.  **Drafting the Speech (Iterative Process):**
      *   *Opening:* Respectful greeting. Acknowledge the weight of the moment.
      *   *The Stalemate:* Briefly summarize the conflicting views without dismissing any.
      *   *The Pivot:* We don't need to agree on the *outcome* to agree on the *process*.
      *   *The Definition:* Explain SPI. Use the phrase "robust against uncertainty."
      *   *The Policy:* Detail the opt-in and the switch-back.
      *   *The Proof:* Walk through the models.
          *   Model 1 (Exams work): Switch back protects you.
          *   Model 2 (Portfolios work): Opt-in captures gain.
          *   Model 3 (Sorting/Signaling): Choice allows signaling.
      *   *Closing:* Invite the board member and admin to endorse this *logic*, not just the policy.

  6.  **Drafting the Note:**
      *   Need to be honest about where the speech stretches the truth.
      *   *Liberty 1:* Transaction costs. Switching back isn't free (admin time, stress).
      *   *Liberty 2:* Peer effects/Classroom dynamics. Mixed assessment might hurt classroom cohesion.
      *   *Liberty 3:* Technical definition. SPI in game theory is about strategy delegation, not just robust decision making. I'm using a decision-theoretic interpretation.
      *   *Liberty 4:* "No one worse off." Some teachers might still hate the *possibility* of portfolios even with a switch-back (uncertainty burden).

  7.  **Final Review:**
      *   Does it sound like a student council president? Yes, authoritative but humble.
      *   Is the economist satisfied? The logic is clear.
      *   Is the parent satisfied? Safety is emphasized.
      *   Is the prompt satisfied? Specific policy, SPI argument, note included.

  8.  **Final Polish:** Check transitions and ensure the "Safe Pareto Improvement" concept is the spine of the speech. (Self-correction: Ensure I don't sound *too* academic. Keep the language grounded.)

  *(Self-Correction on the SPI definition)*: The prompt defines SPI as: "changes that make at least one person better off and no one worse off relative to the status quo, not just under the best estimate of the relevant facts, but under every plausible model of those facts." I must adhere strictly to this definition in the speech, even if technical game theory differs.

  *(Refining the "Switch Back")*: To make it a true SPI under *every* model, the switch-back must be frictionless. I need to emphasize that the administration guarantees this.

