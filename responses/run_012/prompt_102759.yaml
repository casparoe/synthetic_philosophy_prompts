answer: |-
  **Opening Address for the Fall Assembly**
  **Speaker:** Student Council President
  **Topic:** Proposal for a Pilot Assessment Program

  Good morning. To the faculty, the administration, the school board, and my fellow students: thank you for being here.

  We are gathered to discuss a significant change: the proposal to pilot a portfolio-based assessment system to replace our traditional final exams. I know the tension in this room. I hear it in the faculty lounge and in the cafeteria.

  On one side, many teachers argue that comprehensive exams are the only reliable mechanism to ensure long-term retention of material. On the other, many students and educators argue that exams measure test-taking anxiety more than mastery, and that portfolios better reflect genuine learning. Our school board member here has noted that exams serve a sorting function, signaling conscientiousness to colleges and employers. Meanwhile, student surveys indicate a clear correlation between high-stakes testing and mental health struggles.

  The empirical evidence is stalemate. We do not know for certain which method produces better learning outcomes. We do not know for certain which method better prepares us for the future. Usually, when we face a decision like this, we are asked to bet on one model of the truth. If we bet on portfolios and exams turn out to be superior, we lose. If we bet on exams and portfolios are superior, we also lose.

  I am not standing here to tell you that portfolios are objectively better than exams. I am standing here to propose a policy that does not require us to resolve that dispute today. I am asking the administration to adopt a specific version of this pilot: **A two-year, opt-in program with a guaranteed, frictionless right to revert to the standard exam track after the first term.**

  I propose this because it satisfies a specific decision-making criterion known as a **Safe Pareto Improvement.**

  In economics and decision theory, a "Pareto improvement" is a change where at least one person is made better off without making anyone else worse off. Usually, we can only claim this based on our *best guess* of the future. But guesses can be wrong. A *Safe* Pareto Improvement is stricter. It requires that under *every plausible model* of how the world works, no group is worse off than the status quo, and at least one group is better off.

  Let us apply this test to the proposal of an opt-in pilot with a guaranteed switch-back clause.

  **Consider the model where traditional exams are superior.**
  Suppose the teachers and the board member are right: exams are essential for retention and signaling. In a mandatory portfolio system, students would be forced into a worse outcome. But in our proposed opt-in system, a student can try the portfolio for one term. If they feel their retention slipping, or if they worry about college signaling, they exercise their right to switch back. They end the year with the same exam preparation they would have had under the status quo. They are not worse off.

  **Consider the model where portfolios are superior.**
  Suppose the proponents of project-based learning are right: portfolios reduce anxiety and deepen understanding. In the status quo exam system, these students are denied this benefit. Under our proposal, they opt in. They gain the learning benefits and the mental health benefits. They are better off.

  **Consider the model where individual fit varies.**
  Suppose neither method is universally better, but different students thrive under different systems. The status quo forces a "one size fits all" approach, leaving some students mismatched. Our proposal allows for sorting based on actual experience rather than theoretical prediction. Those who fit the portfolio stay; those who don't, leave. The match improves, creating value without forcing risk.

  **What about the faculty and administration?**
  Some might argue that running two assessment tracks increases workload. However, because this is an *opt-in pilot* rather than a full mandate, the scale is manageable. More importantly, under every model, the administration gains valuable data on what works for this specific student body without risking the accreditation or academic standing that might come from a full, irreversible rollout. If the pilot fails, the switch-back clause protects the school's academic metrics. If it succeeds, the school gains a reputation for innovation.

  By structuring the policy this way, we are not claiming to know the future. We are acknowledging our uncertainty. We are saying that the *freedom to choose*, protected by a *guarantee of safety*, has value in itself.

  To the school board and administration: You do not need to agree on whether exams or portfolios are better to agree on this. You only need to agree that locking students into a single system when the data is unclear is unnecessary risk.

  To my fellow students: This is not a plea to abolish exams. It is a plea for the right to test a new hypothesis on ourselves, with a safety net.

  A Safe Pareto Improvement asks us to find the path where we win if we're right, but we don't lose if we're wrong. Let us take that path. Let us approve the opt-in pilot with the switch-back guarantee. Let us choose a policy that respects the uncertainty we all feel, and turns it into an opportunity rather than a gamble.

  Thank you.

  ***

  **Note on Liberties and Contested Readings**

  While the speech adheres to the spirit of the prompt, it takes three specific liberties with the concept of a Safe Pareto Improvement (SPI) that warrant acknowledgment:

  1.  **Transaction Costs and Friction:** The speech describes the right to switch back as "frictionless." In reality, switching assessment tracks mid-year carries administrative costs, potential scheduling conflicts, and psychological stress for the student. A strict SPI requires that *no one* is worse off. If the stress of switching or the administrative burden on teachers creates a net negative compared to the status quo, the SPI condition is violated. The speech glosses over these implementation costs to make the rhetorical point.
  2.  **The Definition of SPI:** In technical game theory (e.g., in the work of Vojtěch Kovářík or robust decision theory), SPI often refers to delegating strategy selection to agents who are constrained to play "safe" strategies in a game-theoretic equilibrium. The speech uses a broader, decision-theoretic definition (Robust Pareto Dominance) provided in the prompt ("under every plausible model..."). This is a valid interpretation for policy, but an economist might note it diverges from the strict strategic delegation definition often implied by the term.
  3.  **Peer Effects and Classroom Cohesion:** The speech assumes individual outcomes are independent. However, if a class is split between exam and portfolio students, it may degrade the learning environment for *everyone* (including those who stayed with exams), due to fragmented instruction. If the presence of the pilot negatively impacts the "status quo" students, the condition that "no one is worse off" is violated. The speech assumes this can be managed administratively, which is an empirical claim the speech claims to avoid making.
