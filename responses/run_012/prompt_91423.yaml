  **S-Tier: Teleosemantic Accounts**
  This account secures the possibility of error by anchoring content in evolutionary history, establishing a normative fact of the matter regarding biological function that exists independently of current interpretation.

  **A-Tier: Grounding through Embodiment and Sensorimotor Contingency**
  By tying meaning to the success or failure of action within a physical environment, this strategy ensures representations can fail to track worldly constraints, though it struggles to explain abstract reference.

  **A-Tier: Grounding through Perceptual Symbol Systems**
  Grounding symbols in modality-specific simulations allows for mismatch against perceptual input, yet it risks conflating the representation with the experiential state itself.

  **B-Tier: Hybrid Architectures**
  Whilst the distributed layer may capture statistical regularities of the world, the architecture often lacks a principled account of why these correlations constitute normative truth conditions rather than mere covariance.

  **C-Tier: Grounding through Co-evolution of Words and Categories**
  Because meaning is established through communicative success within a population, reference remains relative to the agents' interactive purposes rather than a mind-independent state of affairs.

  **F-Tier: The Hermetic System**
  This system occupies the lowest tier, as its internal states can only be incorrect relative to the training corpus rather than the world, implying they are about nothing save the statistical distribution of the text itself.
