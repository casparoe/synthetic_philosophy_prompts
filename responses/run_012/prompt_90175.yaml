  4.  **Synthesize "What Each Party is Missing":**
      *   **Phil 1:** Misses that relying on "relevant possibilities" often smuggles in the very norms they claim are separate from metaphysics. They treat "causal selection" as merely pragmatic, but Phil 2 shows it might be constitutive.
