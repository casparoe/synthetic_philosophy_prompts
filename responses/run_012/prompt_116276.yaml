          *   Premise 2: Humans get "stuck" too (DMV example), but that doesn't mean we lack will.
          *   Premise 3: Unpredictability $\neq$ Free Will (Randomness isn't freedom).
          *   Premise 4: The test is broken because humans also loop when context changes unexpectedly.
          *   Conclusion: Being "scripted" in some moments doesn't negate agency in others. The definition of "machine" is being abused.
          *   Strengths: Highlights the difference in *kind* (awareness, correction), protects the utility of language.
          *   Weaknesses: Struggles to define *where* the line is if behavior looks the same from the outside.

      *   **The Stalemate:**
          *   Dev says: If I can explain it via cause-and-effect, it's a script.
          *   Marisol says: If everything is a script, the word "script" loses meaning.
