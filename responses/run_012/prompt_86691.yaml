  **DRAFT JOINT STATEMENT: ON REACTIVE ATTITUDES AND RESPONSIBILITY**

  **Preamble**
  We, the undersigned, have engaged in a two-year adversarial collaboration regarding P.F. Strawson's "Freedom and Resentment." While we remain divided on the metaphysical implications of our findings, we agree on the phenomenology of moral life and the structure of this debate. The following document outlines our common ground, our specific points of divergence, and the empirical/conceptual tests we propose to settle the matter.

  ### I. Claims We Both Accept

  1.  **The Phenomenology of Participation:** We agree that reactive attitudes (resentment, gratitude, indignation, forgiveness) are not optional add-ons to moral life but constitute the "participant stance." To view others as moral agents just *is* to be susceptible to these attitudes.
  2.  **The Validity of Local Excuses:** We agree that standard exemptions and excuses (e.g., "he didn't know," "she was coerced," "he is a child") genuinely mitigate or eliminate responsibility *within* the practice. These operate by showing that the agent's regard was not ill, or that the agent was not capable of standard interpersonal engagement.
  3.  **Inescapability:** We agree that human beings, as currently constituted, cannot globally abandon the reactive attitudes without ceasing to participate in ordinary interpersonal relationships. A life lived entirely in the "objective stance" would be inhuman.
  4.  **The Determinism Worry:** We agree that the threat of determinism is distinct from local excuses. Determinism does not claim the agent was ignorant or coerced; it claims the agent's action was the inevitable result of prior causes.
  5.  **Normative Stakes:** We agree that the question is not merely descriptive. It matters whether our practices of blame are "justified" in a sense that affects how we ought to treat one another, not just how we *do* treat one another.

  ### II. Points of Divergence

  We part ways on the interpretation of these facts. Specifically, we disagree on whether the naturalness of the attitudes vindicates them, and whether global determinism functions as a "global excuse."

  | Crux | The Argument/Evidence We Both Accept as Relevant | Person A (The Naturalist) | Person B (The Skeptic) |
  | :--- | :--- | :--- | :--- |
  | **1. Local vs. Global Excuses** | **The Logic of Excuses:** We agree that local excuses work by modifying the meaning of the action (e.g., it wasn't an insult). The question is whether determinism modifies the meaning of *all* actions equally. | **Position:** Determinism is not an excuse because it doesn't change the quality of regard. <br>**Prediction:** If we tried to treat determinism as an excuse, we would not feel relief or forgiveness; we would feel alienation. The logic of "excuse" simply fails to apply globally. | **Position:** Determinism undermines the truth-condition of resentment (that the agent *could have done otherwise*). <br>**Prediction:** If we fully internalized determinism, resentment would not vanish, but it would be revealed as a systematic cognitive error, like a persistent optical illusion we know is false. |
  | **2. Inescapability as Justification** | **The Fact of Nature:** We agree that we likely cannot stop having these attitudes. The question is whether this inability provides a *reason* to keep them. | **Position:** Inescapability *is* justification. If a practice is constitutive of our form of life, asking for external validation is a confusion. There is no "outside" from which to judge. <br>**Prediction:** Any attempt to find external justification will fail, proving that internal coherence is the only standard available. | **Position:** Inescapability is a psychological fact, not a normative vindication. We might be hardwired for error. <br>**Prediction:** Future inquiry will show that "cannot give it up" is compatible with "ought to regard it as false." We will remain stuck with a necessary fiction. |
  | **3. The Meaning of 'Justified'** | **The Usage of Terms:** We agree that 'justified' is the contested term. We disagree on whether it refers to *internal rationality* or *metaphysical accuracy*. | **Position:** 'Justified' means rationally sustainable within the participant stance. Since the stance is unavoidable, it is self-justifying. <br>**Prediction:** Adopting my definition will dissolve the anxiety about free will. | **Position:** 'Justified' means tracking the metaphysical truth about agency. If the metaphysics fails, the practice is unjustified, even if useful. <br>**Prediction:** Adopting my definition will force us to confront the tragic gap between our needs and the truth. |

  ### III. The Thought Experiment: The Resentment-Free Community

  We have jointly constructed a case to test our divergences: *A community that possesses the concept of 'wrongdoing' and modifies behavior accordingly, but feels no resentment, indignation, or moral anger. They operate entirely on a modified objective stance mixed with pragmatic correction.*

  **Person A's Prediction:**
  This community is missing something essential. Without resentment, they cannot fully value each other as persons. Their "correction" of behavior will be akin to training a pet or fixing a machine, not engaging with a moral equal. They lack the depth of human relationship. They are not "missing out" on a metaphysical truth, but on a form of love and demand that only the participant stance allows.

  **Person B's Prediction:**
  This community may be healthier. They avoid the error of believing in contra-causal freedom. They can still value people without the toxic baggage of retributive anger. They might possess a form of compassion that we cannot access because we are trapped in the illusion of deep desert. They are not missing a truth; they have escaped a delusion.

  ### IV. Is This Merely a Verbal Dispute?

  **Joint Assessment:**
  We conclude that this is **not** merely a verbal dispute over the word 'justified', though terminology plays a role.

  *   **Why it is not verbal:** If Person B is right, our moral life is built on a systematic falsehood regarding human agency. If Person A is right, there is no such thing as "falsehood" in this context, only appropriate or inappropriate participation. This is a substantive disagreement about the relationship between human psychology and metaphysical truth.
  *   **The Verbal Element:** We acknowledge that if we define 'justified' strictly as "internally coherent within a form of life," Person A wins by definition. If we define it as "corresponding to mind-independent facts about freedom," Person B wins by definition (assuming determinism).
  *   **The Real Dispute:** The substantive fight is over whether we *should* adopt the first definition or the second. Person A argues the second definition is incoherent when applied to moral life. Person B argues the first definition is a comforting evasion of reality.

  ***

