      *   *Latent Dynamics (Comp Neuro):* They think in terms of state space, manifolds, and underlying dynamics. They will hate "leave-one-channel-out" as a proxy for mechanism.
          *   *Objection:* "Ablating a sensor isn't intervening on the neural circuit. You're measuring model sensitivity, not biological mechanism. You're confusing the map with the territory."
