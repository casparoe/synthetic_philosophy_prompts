      *   **Core Claim:** Agreement on anomalies $\neq$ same mechanism. Disagreement $\neq$ one is wrong. "Same mechanism" = agreement on *intervention profiles* (sensitivity to perturbations). Divergence isn't a bug; it reveals different functional goals (prediction, control, explanation).
