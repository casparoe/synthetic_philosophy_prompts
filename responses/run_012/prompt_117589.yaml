answer: |-
  Here is the diagnosis.

  ### 1. The Diagnosis: A Category Error Masked as an Empirical Dispute

  You are not having a factual argument about history, nor are you having a purely verbal dispute. You are having a **teleological conflict** (a disagreement about the *purpose* of the concept "discovery") that is being fought using **ontological weapons** (arguments about what exists).

  Your hypothesis is correct but incomplete. You identified two questions (Causal vs. Normative) and an individuation problem. I would add a third layer: **Functionalism vs. Realism.**

  *   **Your Friend is a Functionalist:** To him, science is a communication network. A signal that is generated but not transmitted does not exist within the system. "Discovery" is a functional label for "successful integration into the network." Therefore, credit is a routing protocol, not a moral reward.
  *   **You are a Realist:** To you, science is an accumulation of truths. A truth grasped by a mind exists regardless of transmission. "Discovery" is a historical label for "first contact with the truth." Therefore, credit is a record of accuracy.

  The stalemate exists because you are arguing about *what happened* (ontology) while he is arguing about *what counts* (function). When you say "B discovered it in the drawer," you mean "B's mind contacted the truth." He hears "B contributed to the scientific enterprise," which he denies because the drawer contributed nothing to the enterprise. You are both right within your own definitions, but neither definition is neutral.

  ### 2. Mapping the Conflicts: Vocabulary vs. Substance

  Here is where you are talking past each other, and where you actually disagree.

  **The Verbal Mismatch (The Word "Discovery")**
  *   **You:** Use "discovery" to mean *conception*.
  *   **Him:** Uses "discovery" to mean *publication/uptake*.
  *   **Resolution:** This is easily fixed by stipulation. If you agree to use "conception" for your view and "disclosure" for his, the grad student cases change. In case (a), B *conceived* it, A *disclosed* it. Your friend argues only disclosure counts as discovery. You argue conception does. This is no longer verbal; it is now substantive.

  **The Substantive Conflict (Path Dependence)**
  *   **The Claim:** You suspect the "route taken (notation, framing)... may have been shaped by the individual." He implies the result is detachable from the discoverer.
  *   **The Conflict:** This is the only truly empirical disagreement left. He believes the *result* is the only unit of value (Coarse-grained). You believe the *formulation* is part of the value (Fine-grained).
  *   **Why it matters:** If Newton and Leibniz had swapped brains, would we have the exact same calculus? If yes, he wins. If Newton's specific metaphysical quirks shaped the notation in a way that altered the next 200 years of physics, you win. This is a claim about the **plasticity of knowledge**.

  **The Normative Conflict (The Purpose of Credit)**
  *   **You:** Credit is a debt owed to the past (accuracy).
  *   **Him:** Credit is an investment in the future (incentive).
  *   **The Conflict:** You view misallocated credit as a *lie*. He views misallocated credit as *inefficient policy* only if it reduces future output.

  ### 3. Path to Progress

  To move this forward, you need to stop arguing about "who discovered" and start arguing about "what science is for."

  **Step 1: Accept the Individuation Point (Your Strongest Lever)**
  You hit on this in your hypothesis: "Coarse-grained by result and everything looks simultaneous; fine-grained by route or proof or formulation and nothing does."
  *   **The Argument:** Challenge him to define the "result." Is "Natural Selection" one idea? Or is it "Natural Selection via Mendelian Genetics" vs. "Natural Selection via Blending Inheritance"?
  *   **The Test:** If he admits that *how* an idea is framed changes its downstream utility, he must admit that the *individual* matters, because individuals provide the framing. If the framing is part of the discovery, then simultaneous discovery is rarer than he thinks. It forces him to admit that B (in the drawer) didn't actually discover the *same thing* as A if B's version wasn't usable.

  **Step 2: Shift the Empirical Burden**
  He claims the individual is a placeholder.
  *   **The Counter:** Ask for the **Counterfactual of Form.** Don't ask "Would someone have found this?" Ask "Would someone have found it *in this form*?"
  *   **Why:** If the form dictates the future trajectory of the field (e.g., Feynman diagrams vs. Schwinger's algebra), then the "placeholder" theory fails. The specific mind is not interchangeable because the specific mind leaves a fingerprint on the tool.

  **Step 3: Dissolve the "Verdict"**
  Acknowledge that "Discovery" is a **cluster concept**. It has necessary conditions (truth, novelty) and sufficient conditions (publication, uptake).
  *   **Progress:** Agree that for *History*, conception matters (You win). Agree that for *Policy/Sociology*, uptake matters (He wins). The argument dissolves once you admit you are writing different genres: he is writing Sociology of Science; you are writing Intellectual History.

  ### 4. The Practical Bit: Does Misallocated Credit Break Anything?

  You asked: *If he's right that credit is just an incentive, does anything break when credit goes to the wrong person?*

  **Yes, but not for the reason you think.**

  If credit is purely an incentive device (as your friend argues), then allocating it based on "uptake" (publication) rather than "conception" (truth) is actually the **correct** move for system health. Here is why giving credit to the "wrong" person (the publisher, not the thinker in the drawer) does not break the system, but giving it to the "right" person might:

  1.  **The Secret-Keeping Problem:** If you award priority to B (the drawer), you incentivize secrecy. Scientists might verify results perfectly but hold them back to refine them, slowing the collective progress. Awarding A (the publisher) incentivizes rapid dissemination. In a functionalist view, A *should* get the credit because A completed the circuit.
  2.  **The Framing Distortion:** This is where it *does* break. If A publishes a clumsy, hard-to-use version of B's idea (which was in the drawer), and A gets the credit, the field might stagnate because A's framing is poor.
      *   **The Breakage:** It's not about fairness. It's about **search costs.** If credit is detached from *clarity of formulation*, future researchers waste time decoding poor versions of ideas.
      *   **The Fix:** Credit should follow **utility**, not just priority. If B's drawer-version was clearer, and A's publication was muddy, but A gets the credit, the field optimizes for "first to print" rather than "best to use."

  **Conclusion on the Practical:**
  Your friend is right that credit is an incentive, but he is wrong that *any* incentive scheme works. If credit is awarded solely for "uptake" without regard for "formulation quality," you incentivize sloppy, premature publication. If credit is awarded for "conception" without regard for "uptake," you incentivize hoarding.

  **The Verdict on the Argument:**
  You are in a **Metaphysical-Pragmatic Mismatch**.
  *   **To Win:** Stop arguing about who *deserves* it. Argue that the **specific formulation** (which is tied to the individual) determines the **future trajectory** of the field.
  *   **To Dissolve:** Agree that "Discovery" means "Conception" in History and "Disclosure" in Sociology.
  *   **To Diagnose Him:** He is treating science as a **black box** (input: problems, output: solutions). You are treating it as a **white box** (internal mechanisms matter). Neither is wrong, but they answer different questions.

  Your hypothesis was correct: it is two questions under one name. But the third element (individuation) is the key. If you can prove that *how* we discover changes *what* we discover next, his "placeholder" theory collapses.
