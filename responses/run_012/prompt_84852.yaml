  Alright, so I build type checkers for a living — I'm comfortable with judgments vs. propositions, terms and types, application and currying, tuples vs. records, dependent types, all that — and lately I've been reading about Bradley's regress and this thing people call the unity of the proposition. I have a nagging feeling I already know this problem from somewhere, and I want you to tell me whether I actually do.

  Here's the job. Take the unity-of-the-proposition problem — why something like the mug is on the desk is a single thing that can be true or false, rather than three things sitting next to each other in a heap, plus the regress you get if you say some further relation has to do the gluing (and then something has to glue the gluer) — and restate it as faithfully as you can in the vocabulary I actually use. Go concept by concept: what maps cleanly onto application, onto the tuple/set distinction, onto typing judgments, onto dependent types; what had to be distorted to make it fit; and what has no expression at all in my vocabulary.

  Then the residue report, which is the part I actually care about. What's left over once the translation is done? My hunch is it's one of two things: either the philosophers' unity is just the difference between a tuple and an application, in which case it's syntax and I don't see whats mysterious; or it's something about truth and falsity, and about the act of judging rather than the content judged, in which case I have no machinary for it at all. Tell me which, and if it's the second, be concrete about what a type theory would have to grow to even state the claim. Also: does the regress survive translation? Does the analogous regress show up in type theory, where does it stop, and is where it stops principled or just stipulated?

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating my question, and skip the citations and reading lists — I can't check them anyway and they'd just be noise. I know basically nothing about the philosophy side of this beyond vibes, so don't lean on me recognising names.
