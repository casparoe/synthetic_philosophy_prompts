answer: |-
  Your hunch is half-right: the structural unity maps cleanly to the primitive distinction between products and application, but the regress survives in the meta-theory because type theory stipulates application as a syntactic rule rather than a term, leaving the assertoric force of judgment as an unexplained residue that requires reifying the judgment bar itself to address.

  ### Concept Mapping

  Here is how the philosophical vocabulary translates into your implementation vocabulary:

  *   **The Heap (mere collection):** This maps cleanly to a **product type** or **tuple** $(a, b) : A \times B$. In your system, this is data without computational behavior; the constituents exist side-by-side but no reduction rule connects them.
  *   **The Proposition (unified complex):** This maps to a **function application** $f \; a$ or a **dependent type** $P \; a$. Here, the constituents are structurally bonded; the term denotes a single object formed by the elimination of the function type.
  *   **The Glue (relation):** This maps to the **function type** itself ($A \to B$) or the **predicate** ($A \to \text{Prop}$). However, the *act* of gluing maps to the **application rule** in your syntax tree, not a term within it.
  *   **Truth/Falsehood:** This maps to **judgment** ($\Gamma \vdash t : T$) or **inhabitation**. A proposition is "true" if the type is inhabited; the "unity" required for it to be true is the well-formedness of the type expression itself.
  *   **The Regress:** This maps to the question: "What applies the application rule?" If you reify application as a term `app : (A -> B) -> A -> B`, you must apply `app` to `f` and `a`, requiring another `app`, ad infinitum.

  ### Distortions and Silences

  **What is distorted:** The philosophical problem is ontological (what makes this *real*?), while your problem is syntactic (what makes this *well-formed?*). You solve unity by grammar; they seek unity by existence. When you say "application unifies," you mean "the parser accepts this string," whereas they mean "these entities constitute a state of affairs."

  **What has no expression:** The **assertoric force**. Your system can express $p : \text{Prop}$, and it can express $\vdash p$, but it cannot express *why* $\vdash$ corresponds to truth rather than just derivability. The "unity of the proposition" is often a proxy for "why does this proposition latch onto reality?" Type theory has no machinery for reference or latching, only for consistency and derivation.

  ### The Residue Report

  The residue is the **meta-theoretic stipulation**. You suspected it might be syntax (tuple vs. application) or truth (judgment). It is both, but specifically the boundary between them.

  1.  **Syntax vs. Semantics:** The distinction between a tuple (heap) and an application (unity) is indeed just syntax in your system. It is not mysterious to you because you define the grammar. The mystery for the philosopher is why reality respects that grammar. In your vocabulary, the "unity" is simply the fact that $f \; a$ is a single node in the AST, whereas $(f, a)$ is a constructor node with two children. The regress stops here because you do not allow rules to be terms.
  2.  **The Judgment Bar:** The second part of your hunch is the critical residue. The difference between a proposition existing ($p : \text{Prop}$) and a proposition being true ($\vdash p$) is the judgment bar. Bradley's regress often hides in the question: "What unifies the subject and predicate *such that it can be true*?" In type theory, truth is an external judgment on the term. You have no machinery to internalize the judgment bar without moving to a Logical Framework (like LF) where judgments become types.

  ### The Regress in Type Theory

  **Does it survive?** Yes, but only if you attempt to internalize the meta-theory. If you stay in the object language, the regress is cut off by the definition of terms. Application is primitive; it is not a term that needs applying.

  **Where does it stop?** It stops at the **inference rules**. You stipulate that if $\Gamma \vdash f : A \to B$ and $\Gamma \vdash a : A$, then $\Gamma \vdash f \; a : B$. There is no rule for applying the inference rule.

  **Is it principled or stipulated?** It is **stipulated by consistency**. You stop the regress because allowing rules to be terms leads to non-termination or inconsistency (e.g., self-application of the evaluation rule). It is not principled ontologically; you cannot derive *why* application unifies from within the system, you can only show that *if* you accept the formation rules, the system is sound.

  **What would type theory have to grow?** To state the claim about truth and unity without begging the question, your type theory would need to **reify the judgment relation**. You would need a universe of contexts and a type constructor $\text{True} : \text{Prop} \to \text{Type}$ internal to the system, along with a mechanism to distinguish "merely formed" propositions from "asserted" ones without relying on the external turnstile. This essentially requires building a **logical framework** or a **modal type theory** where the modality represents assertion, allowing you to treat the "glue" of judgment as an object you can reason about, rather than a rule you simply obey. Until then, the unity of the proposition is just a precondition for using your tool, not a theorem your tool can prove.
