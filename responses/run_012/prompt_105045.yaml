answer: |-
  You are wrestling with the difference between **ontology** (what actually existed in the past) and **historiography** (how we organize the past). Your intuitions are actually more consistent than you think; you just haven't articulated the criterion you are secretly using.

  The tests you tried ("invented later?" and "felt at the time?") failed because they measure *provenance*, not *substance*. A map is invented by a cartographer, but the terrain is real. A border is felt by the people living there, but it might be arbitrary.

  Here is the principle that reconciles your verdicts.

  ### The Principle: Causal-Structural Coherence

  A historical period is **Real** if it describes a **coherent system or process** that functioned differently than the periods before or after it, regardless of whether contemporaries named it or historians invented the term later.

  A historical period is a **Label** if it is primarily a **retrospective narrative container** used to organize events that do not share a unified internal logic, or if it is defined by a value judgment rather than a functional shift.

  **Why this fits your verdicts:**
  *   **Late Antiquity (Real):** Peter Brown didn't just slap a name on a time; he identified a specific *mechanism of transformation* (the slow integration of barbarian, Christian, and Roman structures). It has internal coherence.
  *   **Axial Age (Label):** Jaspers identified a *pattern* (simultaneous philosophy), but there was no causal link between Confucius and Socrates. It is a synchronicity, not a system.
  *   **Scientific Revolution (Real):** This marks a shift in *epistemology and capability*. The "operating system" of how humans derived truth changed permanently.
  *   **Renaissance (Label):** You reject this because it is a "story the nineteenth century told." Under this principle, you are rejecting it because it is an *aesthetic narrative* imposed on a complex reality, rather than a functional shift. (More on this in the "Sacrifice" section).
  *   **Middle Ages/Dark Ages (Label):** These are defined negatively (the "middle" between two better things, or "dark" due to lack of light/learning). They describe a perceived absence, not a present structure.
  *   **Industrial Revolution (Real):** A fundamental shift in energy capture and production mechanics.

  ### The Antibiotic Window (1945–2015)

  **Verdict: Real.**

  Under the principle of Causal-Structural Coherence, the Antibiotic Window is a distinct biological-technological state.
  1.  **Functional Shift:** Human mortality from infection dropped precipitously, altering surgery, demography, and war.
  2.  **Boundaries:** It has a clear onset (mass production of penicillin) and a clear closing mechanism (evolution of resistance).
  3.  **Internal Logic:** The period is defined by a specific relationship between human technology and bacterial evolution that no longer holds.

  It is not just a fact about medicine; it is a *condition of existence* for the people who lived through it. Future historians will likely look back at 1945–2015 as a distinct "phase" of human biology, much like the Neolithic Revolution.

  ### Other Periods

  **The Bronze Age Collapse:** **Real.**
  This describes a systemic failure of interconnected palatial economies, trade networks, and literacy across the Eastern Mediterranean. It is not just "a lot of wars happened"; it is a specific type of civilizational systems collapse with causal links between the regions.

  **The Long Nineteenth Century (1789–1914):** **Label.**
  This is a heuristic container. While it holds real events (Industrial Revolution, French Revolution), the period itself is defined by bookends (Revolution to WWI) rather than a single coherent process. It is a "convenience period" for historians teaching the rise of the nation-state, but it lacks the ontological density of the Industrial Revolution itself.

  ### The Sacrifice: Which Verdict Must You Give Up?

  To make your view fully consistent, you must reconsider your verdict on **The Renaissance**.

  **Why:** You accept Late Antiquity as Real because it describes a coherent transformation, even though it was invented by a single 20th-century historian (Peter Brown). You reject the Renaissance as a Label because it was popularized by 19th-century historians (Burckhardt et al.).

  But if *invention by a later historian* doesn't disqualify Late Antiquity, it shouldn't disqualify the Renaissance. The Renaissance involved a coherent shift in patronage, pedagogy, political theory, and visual representation that functioned differently than the 14th century or the 17th century.

  **The Inconsistency:** You are penalizing the Renaissance for its *mythology* (the idea that it was a "rebirth" of perfection) rather than its *structure*. If you accept Late Antiquity is Real (a slow metamorphosis), you should accept the Renaissance is Real (a cultural metamorphosis), even if the *name* is loaded with 19th-century baggage.

  **Alternative Sacrifice:** If you refuse to budge on the Renaissance, you must downgrade the **Scientific Revolution**. Recent historiography argues there was no single "revolution," but rather multiple overlapping shifts (astronomical, medical, experimental) that weren't unified until later historians stitched them together. If the Axial Age is a Label because it stitches together unconnected philosophical shifts, the Scientific Revolution is vulnerable to the same charge.

  **Recommendation:** Upgrade the **Renaissance** to "Real." Acknowledge that while the *story* of the Renaissance is a myth, the *period* denotes a genuine structural shift in European cultural production.

  ### What Would Change My Mind?

  **The Linchpin Case: Late Antiquity.**

  If I were convinced that Late Antiquity is **not real** (just a label), my principle would collapse.
  *   **Why:** Late Antiquity is the strongest test of "Causal-Structural Coherence" without "Sharp Breaks." It argues that *continuity* can define a period just as much as *revolution*.
  *   **The Shift:** If Late Antiquity is just a label, then "Real" periods must require sharp, discontinuous breaks (like the Industrial Revolution). This would force me to downgrade the Scientific Revolution (which was gradual) and potentially the Antibiotic Window (which is a sliding scale of resistance). It would restrict "Real" periods to only catastrophic or instantaneous events.
  *   **Where the Principle is Weak:** My principle struggles with **geography**. The Industrial Revolution was "Real" in Britain in 1780, but a "Label" in Japan in 1780. A truly robust principle must account for the fact that periods are often *regional realities* mistaken for *global eras*. The Axial Age fails not just because it's a projection, but because it tries to be global where no global structure existed.

  ### Summary of Your Position
  You are a **Structural Realist**. You believe periods are real when they denote a change in the *operating system* of society (knowledge, energy, biology, governance), but they are labels when they denote a change in *aesthetics* or *narrative organization*.

  Your friend's "Antibiotic Window" passes your test. It is a change in the biological operating system of humanity. You should accept it.
