          *   *Analysis:* This is a classic critique (Nozick, Wertheimer). The account *does* need a baseline. It's not necessarily circular, but it is not morally free-standing.
      *   *Information/Materiality:* Not all lies void consent. Only material ones. How to define materiality? Subjective (what this person cares about) vs. Objective (what a reasonable person cares about).
          *   *Analysis:* If subjective, fraud is too easy to claim. If objective, autonomy is disrespected. This is a tension, not necessarily a fatal flaw, but requires elaboration.
      *   *Competence/Threshold:* Competence is decision-relative. A global threshold is impossible.
          *   *Analysis:* Defenders already admit this (sliding scale). It makes the account complex but not false.
      *   *Validity vs. Moral Force:* Valid consent doesn't always make an act permissible (e.g., consensual slavery, some medical malpractice). Invalid consent doesn't always make an act wrong (e.g., technical violation with no harm).
          *   *Analysis:* This confuses *validity* (normative power) with *sufficiency for permissibility*. The account claims validity is *necessary*, not always *sufficient*.

  3.  **Analyze External Defeaters:**

      *   *Cases where 3 conditions met but consent void:* Adaptive preferences (internalized oppression), desperate circumstances (structural coercion).
      *   *Rival Theories:* Relational (consent is a social status, not a mental state), Performative (consent is the speech act, not the internal state), Will-based (Hegel/Kant).
