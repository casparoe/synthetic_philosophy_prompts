  7.  **The Calibration Case (Unjust Preference Formation):**

      *   *Scenario:* Competent, informed, uncoerced (locally), but preferences shaped by injustice (e.g., patriarchal socialization).
      *   *Analysis:* This attacks the *history* of the will, not the current state.
