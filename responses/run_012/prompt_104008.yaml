answer: |-
  This is a rigorous stress test of the tripartite model (Competence, Information, Voluntariness). To map its exposure, we must distinguish between the account as a *conceptual framework* (a structure for thinking about consent) and as a *decision procedure* (a tool for yielding specific moral verdicts). The account is robust as the former but vulnerable as the latter.

  Here is the map of its exposure, sorted by severity, followed by an assessment of the "placeholder" critique and your calibration case.

  ### I. Internal Defeaters (Structural Vulnerabilities)

  These are tensions inherent in the definitions of the three conditions.

  **1. The Baseline Problem (Voluntariness)**
  *   **The Exposure:** To distinguish a threat (which vitiates consent) from an offer (which does not), you need a normative baseline. If a doctor says, "I will not treat your gangrene unless you pay me," is that a threat or an offer? If the patient is *entitled* to treatment, it is a threat. If the doctor is *entitled* to payment, it is an offer.
  *   **What would make the account false:** If it can be shown that the tripartite account claims to be morally neutral but *cannot* define voluntariness without importing a substantive theory of rights/entitlements.
  *   **Status:** **Answerable, but costly.** Defenders (e.g., Wertheimer) concede the account requires an independent moral theory to set the baseline. It loses its claim to neutrality, but it does not become false; it becomes a *dependent* module within a larger moral theory.
  *   **Defender Response:** They concede the need for a baseline but dismiss the idea that this invalidates the framework. They argue no account of consent can be morally freestanding.

  **2. The Materiality Problem (Information)**
  *   **The Exposure:** Not every falsehood voids consent (e.g., lying about one's height vs. lying about one's HIV status). To avoid voiding consent for trivial lies, you need a theory of *materiality*.
      *   *Subjective Standard:* Whatever this specific person cares about. (Risk: Makes consent too fragile; allows post-hoc rationalization).
      *   *Objective Standard:* What a reasonable person would care about. (Risk: Paternalistic; disrespects individual autonomy).
  *   **What would make the account false:** If every principled line drawn for materiality either violates the autonomy it seeks to protect or renders consent impossible to rely upon.
  *   **Status:** **Awkward.** This is a persistent tension. Defenders usually adopt a hybrid view (objective list filtered by subjective disclosure), but it remains a site of friction.

  **3. The Competence Threshold**
  *   **The Exposure:** Competence is decision-relative. A person may be competent to choose a meal but not to sell their kidney. If the threshold slides based on the risk of the decision, "competence" ceases to be a property of the agent and becomes a property of the *transaction*.
  *   **What would make the account false:** If competence cannot be coherently separated from the voluntariness condition (see External Defeaters).
  *   **Status:** **Answerable.** Defenders accept the "sliding scale" (Buchanan & Brock). It complicates the account but does not break it.

  **4. Validity vs. Moral Force**
  *   **The Exposure:** You note that valid consent does not always make an act permissible (e.g., consensual slavery, gladiatorial combat), and invalid consent does not always make an act wrong (e.g., a technical paperwork error in a life-saving surgery).
  *   **What would make the account false:** If the account claims that valid consent is *sufficient* for permissibility.
  *   **Status:** **Answerable (Category Error).** Defenders clarify that the tripartite account defines *validity* (the normative power to change moral relations), not *all-things-considered permissibility*. Valid consent is usually *necessary* for permissibility in rights-violating contexts, but rarely *sufficient*.

  ### II. External Defeaters (Rival Intuitions and Theories)

  These come from outside the framework, challenging its sufficiency or accuracy.

  **1. Adaptive Preferences and Structural Injustice**
  *   **The Exposure:** A woman in a deeply patriarchal society consents to a subordinate role. She is competent, informed (about her options), and not coerced by a specific agent (no gun to her head). Yet, her preferences were formed under unjust conditions.
  *   **What would make the account false:** If we intuit that this consent is void, but the tripartite account says it is valid.
  *   **Status:** **Fatal (if read narrowly).** If voluntariness is read as a "snapshot" of the current mental state, this case falsifies the account. It shows the account ignores the *history* of the will.
  *   **Defender Response:** Hardliners dismiss this as paternalism (who are we to judge her values?). Softliners concede that "voluntariness" must include a historical/structural component, effectively expanding the first internal defeater (Baseline).

  **2. Relational and Performative Rivals**
  *   **The Exposure:** Relational theorists argue consent is not a mental state (which the three conditions assess) but a social status granted by a community. Performative theorists argue consent is the speech act itself, not the internal psychology.
  *   **What would make the account false:** If cases arise where the three conditions are met internally, but the social performance is botched (e.g., silence in a context requiring speech), and we judge consent *absent*.
  *   **Status:** **Answerable.** The tripartite account can incorporate performative requirements as part of "Information" (knowing how to consent) or "Voluntariness" (freedom to express). However, it struggles with the Relational claim that validity is conferred by the *recipient's* uptake, not just the *agent's* state.

  **3. The Interdependence of Competence and Voluntariness**
  *   **The Exposure:** Severe depression or coercion can impair competence. If external pressure (voluntariness) can degrade internal capacity (competence), the conditions are not independent variables.
  *   **What would make the account false:** If the conditions are so entangled that assessing one requires assessing the others, rendering the three-part structure analytically useless.
  *   **Status:** **Awkward.** It makes the application messy, but the conceptual distinction remains (capacity vs. freedom).

  ### III. Sorting the Defeaters

  | Severity | Defeater | Why? | Defender Stance |
  | :--- | :--- | :--- | :--- |
  | **Fatal** | **Structural Injustice / Adaptive Preferences** | If the account cannot void consent formed under systemic oppression without abandoning its "snapshot" view of voluntariness, it fails to protect autonomy in the real world. | **Split.** Libertarians dismiss it (preferences are sovereign). Egalitarians concede it (voluntariness requires just background conditions). |
  | **Answerable** | **Validity vs. Permissibility** | This is a confusion of categories. The account explains normative power, not the good. | **Dismiss.** Defenders argue this is a misunderstanding of the account's scope. |
  | **Answerable** | **The Baseline Problem** | Requires importing moral theory, but doesn't invalidate the structure. | **Concede.** Defenders admit consent is not morally freestanding. |
  | **Awkward** | **Materiality of Information** | Drawing the line is messy, but not conceptually impossible. | **Concede & Refine.** Defenders propose hybrid subjective/objective tests. |
  | **Awkward** | **Interdependence** | Makes application difficult, but not conceptually false. | **Dismiss.** Defenders argue they are distinct conceptual categories even if empirically correlated. |

  ### IV. The "Placeholder" Critique

  **Is the account insulated from refutation by turning conditions into placeholders?**
  **Honest Assessment:** **Yes.**

  The tripartite account functions as a *schema* rather than a *substantive theory*.
  *   "Competent" means "competent enough for this specific act."
  *   "Informed" means "informed about all *material* facts."
  *   "Voluntary" means "free from *coercive* influences."

  Because "materiality," "competence threshold," and "coercion" are undefined within the schema, the account can accommodate almost any verdict by adjusting the definitions of the terms. If a case feels like invalid consent, defenders say, "Ah, clearly the information wasn't *material* enough," or "The baseline entitlement was violated, so it wasn't *voluntary*."

  **Is this fatal?**
  **No, but it is limiting.**
  This is what a framework-level account of a contested concept looks like. It is not a bug; it is a feature of high-level normative analysis. It organizes the debate rather than settling it. It becomes fatal only if proponents claim it yields determinate answers without supplying the supplementary moral theory (the baseline, the theory of materiality) required to fill the placeholders. If they claim it is a "decision procedure," they are wrong. If they claim it is a "taxonomy of moral constraints," they are right.

  ### V. The Calibration Case: Unjust Preference Formation

  *The Case: Competent, informed, uncoerced (locally), but preferences formed under unjust conditions.*

  **Diagnosis:**
  This shows the account is **incomplete**, specifically regarding the **Voluntariness** condition.

  1.  **Thin Reading (Current State):** If voluntariness is merely the absence of local coercion (no gun to the head), the account validates the consent. This is the "Liberal/Nozickian" reading.
  2.  **Thick Reading (Historical/Structural):** If voluntariness requires that the will be *authentically* the agent's own, and authenticity is compromised by systemic oppression, the account voids the consent. This is the "Feminist/Relational" reading.

  **Does this falsify the account?**
  It falsifies the **Thin Reading**. It does not falsify the **Tripartite Structure**.
  You can maintain the three conditions but expand the *definition* of Voluntariness to include "freedom from distorting background injustice."

  **Why this is the hardest defeater:**
  Because it forces you to choose between **Respect** (taking the agent's current choice at face value) and **Protection** (guarding the agent against the internalized effects of oppression).
  *   If you void the consent, you risk paternalism (telling the agent she doesn't know her own good).
  *   If you validate the consent, you risk complicity in injustice (ratifying the effects of oppression).

  **Conclusion:**
  The tripartite account survives this case only by admitting that **Voluntariness is not a snapshot; it is a history.** It must import a theory of justice to determine which preference-forming conditions are "coercive" in a structural sense.

  If you refuse to import that theory, the account is false in cases of adaptive preference. If you do import that theory, the account is true but loses its neutrality. It becomes a specific *kind* of consent theory (one committed to substantive justice), not a generic one.

  **Final Verdict:**
  The account is not false, but it is **morally dependent**. It cannot do the work you want it to do (determine permissibility) without a supplementary theory of rights (for the baseline) and justice (for preference formation). Its greatest vulnerability is not internal incoherence, but the illusion that it is freestanding. It is a vessel that must be filled by the very moral theories it often claims to regulate.
