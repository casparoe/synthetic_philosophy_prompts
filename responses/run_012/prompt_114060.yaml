answer: |-
  Whatever time is spent cannot return.
  The past is dead; only the future still
  Exists to judge if I should keep.
  The next increment costs; is it enough
  To buy return, to establish worth?
  They say I quit because.

  Because the past bears on the future only
  As evidence, or binding for what's spent.
  It holds no intrinsic weight, no future worth.
  The value of options is what stays still.
  Is preserving choice alone enough?
  The theory says I should not keep.

  Keep the drafts to show the skill I became.
  Because the years prove capacity, not just
  Loss. Is that evidence enough?
  The time spent shaped the hand that holds the pen.
  To ignore the past as irrelevant is still
  To decide badly, misjudging my worth.

  Worth lies in the history itself.
  Like marriage, farm, you cannot keep
  The root system growing still.
  It is the substance, because.
  Not upstream cost but capital spent.
  Is twenty years enough to make it real?

  Enough to say the foundation is laid.
  The sunk cost gone, yet the foundation worth.
  The money spent below the grade.
  Can I keep building on this sunk ground?
  It holds the structure, because.
  Or is it lost to recovery, still.

  Still here, the logic fights the love of work.
  Is cold rationality enough to quit?
  I heed the future, because.
  The past defines the worth.
  I cannot keep nor leave.
  All is spent.

  Spent time remains, and I am still.
  I keep going, or is that enough?
  The choice is worth it, because.
