answer: |-
  ### 1. Examination Question

  **Time Allowed:** 45 minutes
  **Marks:** 25

  **Setup.** An agent is dropped by parachute into a territory that is either Red or Blue, and she is located either at Headquarters or at Second Company, giving four possibilities: Red-Headquarters, Red-Second Company, Blue-Headquarters, Blue-Second Company. Before receiving any information she assigns probability 1/4 to each. She then receives a radio broadcast that reaches her wherever she is (the broadcast is not targeted at any region or unit), and she takes its content to be certainly true: conditional on her being in Red territory, the probability that she is at Headquarters is 3/4. She has no other information.

  **(a)** Explain why ordinary conditionalization cannot handle this report, and why Jeffrey conditionalization does not straightforwardly apply either. For each rule, state what it requires and which requirement fails here. (5 marks)

  **(b)** Adopting the rule that the posterior should minimize relative information (Kullback-Leibler divergence) with respect to her prior, subject to the constraint carried by the report, compute her posterior. Give the four probabilities to three decimals, show the algebra, and state what happens to her probability that she is in Red. (10 marks)

  **(c)** The result in (b) is widely felt to be objectionable, on the ground that the broadcast reaches her whether she is in Red or in Blue, so hearing it should not alter the probability that she is in Red. Give the strongest argument for that objection, the strongest reply to it, and a verdict on whether the reply succeeds. (6 marks)

  **(d)** Suppose instead that the broadcast is transmitted only to agents in Red territory, and that the agent knows this. What are her probabilities now, and what does the contrast with (b) reveal about what the constraint-based treatment in (b) presupposes? (4 marks)

  ***

  ### 2. Model Answer

  **(a)** Ordinary conditionalization requires learning a proposition $E$ with certainty ($P_{new}(E)=1$). Here, the agent learns a conditional probability constraint, not a categorical fact. Jeffrey conditionalization requires a new probability assignment over a fixed partition of events. Here, no partition probabilities are given directly; only a conditional ratio within one cell is specified. Thus, neither rule applies directly.

  **(b)** Let the four states be $RH, RS, BH, BS$ with prior probabilities $q_i = 0.25$. We seek posterior $p_i$ minimizing $\sum p_i \ln(p_i/q_i)$ subject to $\sum p_i = 1$ and the constraint $P(H|R) = 3/4$, which implies $p_{RH} = 3p_{RS}$. Since the prior is uniform, minimizing relative information is equivalent to maximizing entropy $-\sum p_i \ln p_i$.
  By symmetry, the constraint affects only Red states, so $p_{BH} = p_{BS} = y$. Let $p_{RS} = x$, then $p_{RH} = 3x$.
  Normalization: $4x + 2y = 1 \implies y = 0.5 - 2x$.
  Using Lagrange multipliers for the constraint $p_{RH} - 3p_{RS} = 0$ on the entropy function yields the relation $p_{RH}/p_{RS} = 3$ (satisfied by definition) and determines the ratio between Red and Blue mass. The minimization yields $p_{RH} = k \cdot 3^{1/4}$, $p_{RS} = k \cdot 3^{-3/4}$, and $p_{BH} = p_{BS} = k$.
  Summing these: $k(3^{0.25} + 3^{-0.75} + 2) = 1$.
  $3^{0.25} \approx 1.316$, $3^{-0.75} \approx 0.439$. Sum $\approx 3.755$.
  $k \approx 1/3.755 \approx 0.266$.
  Posteriors: $P(RH) \approx 0.351$, $P(RS) \approx 0.117$, $P(BH) \approx 0.266$, $P(BS) \approx 0.266$.
  The probability of Red is $P(RH) + P(RS) \approx 0.468$. Her probability that she is in Red decreases from 0.500.

  **(c)** **Objection:** The broadcast is causally independent of her location (Red vs. Blue). Learning a fact that holds regardless of location should not shift belief about the location itself (The Principle of Irrelevance).
  **Reply:** The MinKL rule minimizes the *informational distance* from the prior. Satisfying the constraint $P(H|R)=3/4$ requires "effort" (deviation from uniformity) in the Red sector. To maximize entropy globally, the agent shifts probability mass to the unconstrained Blue sector.
  **Verdict:** The objection succeeds. While the reply explains the mathematics, it confirms that MinKL treats conditional constraints as global informational costs rather than local updates. Most epistemologists regard the shift in $P(R)$ as irrational in this context, suggesting MinKL is the wrong rule for this type of testimony.

  **(d)** If the broadcast reaches only Red, hearing it entails she is in Red. $P(R)$ becomes 1. The content then fixes $P(H) = 3/4$.
  Probabilities: $P(RH)=0.75, P(RS)=0.25, P(BH)=0, P(BS)=0$.
  **Contrast:** In (b), the constraint was treated as a "soft" constraint on the belief function compatible with all worlds. In (d), the transmission condition acts as "hard" evidence eliminating Blue worlds. The treatment in (b) presupposes the information restricts admissible probability functions, not the set of possible worlds.

  ***

  ### 3. Marking Scheme

  **Total:** 25 Marks

  **1. Diagnosis of Updating Rules (Part a) — 5 Marks**
  *   **Must-Hit:** State that Conditionalization requires $P(E)=1$ (categorical evidence). (2 marks)
  *   **Must-Hit:** State that Jeffrey Conditionalization requires new probabilities for a partition. (2 marks)
  *   **Note:** Candidates lose marks if they claim the content is "uncertain" rather than structurally incompatible (it is certain, but conditional).

  **2. MinKL Derivation and Computation (Part b) — 10 Marks**
  *   **Must-Hit:** Set up the constraint $p_{RH} = 3p_{RS}$ and symmetry $p_{BH} = p_{BS}$. (2 marks)
  *   **Must-Hit:** Show algebraic method (Lagrange multipliers or entropy maximization logic) leading to the $3^{1/4}$ split. (4 marks)
  *   **Must-Hit:** Correct numerical values to 3 decimals ($0.351, 0.117, 0.266, 0.266$). (2 marks)
  *   **Must-Hit:** Explicitly state $P(Red)$ decreases (to $\approx 0.468$). (2 marks)
  *   **Arithmetic:** Full credit for correct method with minor slip (e.g., $0.467$ instead of $0.468$).
  *   **Natural Wrong Answer:** Setting $P(R)=0.5$ and rescaling within Red ($0.375, 0.125, 0.25, 0.25$). Award **4 marks** max for this. It satisfies the constraint and normalization but fails the MinKL requirement (it does not minimize divergence).

  **3. Objection and Verdict (Part c) — 6 Marks**
  *   **Must-Hit:** Argument: Causal independence implies $P(R)$ should not change (Irrelevance). (2 marks)
  *   **Must-Hit:** Reply: MinKL shifts mass to unconstrained states to maximize entropy. (2 marks)
  *   **Must-Hit:** Verdict: Explicit judgment (e.g., "Objection succeeds" or "Rule is inappropriate"). Vague surveys lose marks. (2 marks)
  *   **Note:** First-class answers distinguish between mathematical consistency (the reply explains the math) and rational appropriateness (the verdict rejects the rule).

  **4. Hard Evidence Contrast (Part d) — 4 Marks**
  *   **Must-Hit:** Correct probabilities ($0.75, 0.25, 0, 0$). (2 marks)
  *   **Must-Hit:** Insight: (b) treats info as a constraint on functions; (d) treats info as elimination of worlds. (2 marks)
  *   **Note:** Candidates often miss the philosophical distinction, describing only the numerical difference.

  **General Guidance:**
  *   **Settled vs. Contested:** In (c), the math is settled; the rationality is contested. Answers presenting the MinKL result as "obviously correct" without qualification should lose 1 mark on (c) for lack of nuance.
  *   **Clarity:** Algebra in (b) must be shown. Asserting the numbers without derivation loses 4 marks.
