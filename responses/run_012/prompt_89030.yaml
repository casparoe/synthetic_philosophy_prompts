          *   For guidance, Incomparability is a dead end (cannot choose). So the theory *must* treat hard choices as Incommensurable, not Incomparable.
      *   *Check:* Is "Small Improvement" non-negotiable? Yes, it's the logical definition of the phenomenon.
      *   *Check:* The "Impossible Pairs" need to be sharp. The tension between **Small Improvement** (value structure) and **Revisability** (practical stability) is the most technical and damaging for theories like Chang's (which uses commitment to solve the choice but risks violating the initial parity).
      *   *Check:* The "Killer Requirement." I will argue it is **Rationality without a Best Option**. It forces the abandonment of Maximization, which is the default in almost all rational choice theory.

  9.  **Final Polish:** Ensure tone is academic, precise, and directly addresses the "Friday" constraint. (Make sure to explicitly mention the "Friday" constraint in the intro to show I heard the user).

