      *   *Case 2: Small Improvement (The Lemon Case).*
          *   Standard example: Career A vs. Career B. B is not better than A. B + $5 is still not better than A.
          *   Requirement: Must block transitivity or strict ordering in a way that accommodates this without collapsing into equality.
          *   Status: Non-negotiable (this is the logical proof of incommensurability/parity).

      *   *Case 3: Revisability (The Cheap Switch).*
