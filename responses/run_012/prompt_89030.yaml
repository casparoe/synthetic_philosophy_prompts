      *   The user wants a *practical* theory. This shifts the weight from "What is the truth about value?" to "What allows an agent to act rationally and maintain integrity?"
      *   This implies a focus on *agency*, *commitment*, and *practical rationality* over ontological precision.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Case 1: Parity (Neither better, worse, nor equal).*
