answer: |-
  Here is a specification sheet for your seminar paper. It is designed to operationalize your constraint: **the theory must guide an agent facing a deadline (Friday), not merely describe the ontology of value.**

  ### I. The Specifications
  *Requirements a theory of hard choices must meet to function as practical guidance.*

  #### A. Cases the Theory Must Get Right
  1.  **The Parity Case (The Fourth Relation)**
      *   **Case:** Two options (e.g., Academic Career vs. Banking Career) where neither is better, neither is worse, and they are not exactly equal.
      *   **Requirement:** The theory must accommodate a positive normative relation other than "better than," "worse than," or "equal to."
      *   **Status:** **[Non-Negotiable]** Given the guidance purpose. If the theory collapses this into "equal," it mandates indifference (coin flip), which fails to capture the gravity of the choice. If it collapses it into "ignorance," it mandates further deliberation, violating the "Friday" deadline.

  2.  **The Small Improvement Argument (The Lemon Case)**
      *   **Case:** Option A is on a par with Option B. Option B is improved trivially (B+). B+ is still not better than A.
      *   **Requirement:** The theory must block the transitivity of "better than" in this specific instance without rendering the agent irrational. It must explain why a trivial improvement does not tip the scale.
      *   **Status:** **[Non-Negotiable]** This is the logical proof of the phenomenon. Any theory that resolves this by saying "B+ *must* be better" denies the phenomenology of incommensurability.

  3.  **The Revisability Case (The Cheap Switch)**
      *   **Case:** An agent chooses A over B. Later, the agent can switch back to B at negligible cost.
      *   **Requirement:** The theory must explain whether switching is permissible. If permissible, it must explain why the first choice wasn't wasted. If impermissible, it must explain what changed to make A strictly better than B post-choice without violating the Small Improvement requirement (i.e., was the act of choosing a "trivial improvement"?).
      *   **Status:** **[Non-Negotiable]** A guidance theory must account for the stability of action. If every choice is instantly reversible without loss, agency dissolves into oscillation.

  4.  **The Unresolved Choice (The Friday Constraint)**
      *   **Case:** Deliberation yields no "winner," but the choice must be made now.
      *   **Requirement:** The theory must provide a rational pathway from "no best option" to "chosen option" without requiring a new reason to appear ex nihilo.
      *   **Status:** **[Non-Negotiable]** This is the core of your "guidance rather than metaphysics" constraint. Metaphysical theories can wait for the truth; practical theories must act.

  #### B. Distinctions the Theory Must Not Collapse
  5.  **Incommensurable Values vs. Incomparable Options**
      *   **Case:** Values (e.g., Justice and Mercy) lack a common metric, but Options (Act A and Act B) must still be relate-able to allow choice.
      *   **Requirement:** The theory must distinguish between the *structure of value* (no common currency) and the *comparability of options* (can still be related via parity or commitment).
      *   **Status:** **[Camp Commitment]** Strict incomparabilists (e.g., early Raz interpretations) might collapse these. However, for *guidance*, this is effectively **[Non-Negotiable]**. If options are truly incomparable (no relation holds), rational choice is impossible.

  6.  **Incommensurability vs. Epistemic Ignorance**
      *   **Case:** The agent feels stuck. Is it because the values don't align (ontological) or because she hasn't thought hard enough (epistemic)?
      *   **Requirement:** The theory must provide criteria to distinguish a hard choice from a hard calculation.
      *   **Status:** **[Non-Negotiable]** If the theory treats all hard choices as ignorance, it violates the "Friday" constraint by mandating infinite deliberation.

  #### C. Results the Theory Cannot Contradict
  7.  **Rationality Without a Best Option**
      *   **Case:** An agent chooses A, knowing B was not worse, and A was not better.
      *   **Requirement:** The theory must validate this choice as rational without resorting to "satisficing" (which implies a threshold was met) or "maximizing" (which implies A was best).
      *   **Status:** **[Non-Negotiable]** This is the central problem of hard choices. If rationality requires a "best," hard choices are impossible.

  8.  **The Survival of Regret and Residue**
      *   **Case:** After choosing A rationally, the agent feels pain over the loss of B.
      *   **Requirement:** The theory must accommodate this pain as rational/fitting, not as a cognitive error or a failure of nerve.
      *   **Status:** **[Camp Commitment]** Utilitarian/Stoic camps deny legitimate residue. However, for a phenomenological account of guidance, this is **[Non-Negotiable]**. A theory that eliminates residue eliminates the "hardness" of the choice.

  ---

  ### II. The Impossible Pairs (Tensions)
  *These are the pairs of requirements that create reflective disequilibrium. Standard theories usually satisfy one by violating the other.*

  #### 1. The Small Improvement Requirement vs. The Revisability Requirement
  *   **The Conflict:** The **Small Improvement Requirement** dictates that trivial additions to an option do not make it better than its par-opposite. The **Revisability Requirement** (for guidance) suggests that once a choice is made, the agent should not switch back cheaply (to maintain integrity/stability).
  *   **Why they clash:** If I choose A over B (on a par), and later I can switch to B cheaply, *not* switching implies A has become strictly better than B. What made it better? The fact that I chose it? If "being chosen" adds value, does that violate Small Improvement? Is "being chosen" a trivial improvement?
  *   **Theoretical Cost:**
      *   *Ruth Chang's Commitment View:* Solves Revisability (commitment makes A better) but risks violating Small Improvement (commitment looks like a trivial add-on that tips the scale).
      *   *Existentialist View:* Solves Revisability (will creates value) but risks making the initial choice arbitrary (violating Rationality Without Best).

  #### 2. Rationality Without a Best Option vs. The Survival of Regret
  *   **The Conflict:** If **Rationality Without a Best Option** holds, I have lost nothing rational by choosing A; B was not better. If **Regret/Residue** is legitimate, it implies a genuine loss of value occurred.
  *   **Why they clash:** If the choice was fully rational and there was no better option, regret implies I am mourning a loss that I had no reason to avoid. If the loss is real enough to warrant regret, why wasn't avoiding that loss a reason to choose B?
  *   **Theoretical Cost:**
      *   *Maximization:* Solves Rationality (you picked the best) but eliminates Residue (no loss occurred).
      *   *Tragic Dilemma Views:* Solve Residue (real loss) but threaten Rationality (you necessarily did wrong).

  #### 3. The Friday Constraint (Unresolved Choice) vs. Distinction: Incommensurability vs. Ignorance
  *   **The Conflict:** To act by Friday (**Unresolved Choice**), the agent must treat the lack of a reason as a final state. To maintain the **Distinction from Ignorance**, the agent must be sure the lack of reason isn't just a failure of inquiry.
  *   **Why they clash:** Guidance requires closing deliberation. Distinguishing ontological incommensurability from epistemic ignorance often requires *more* deliberation. Acting "as if" incommensurable risks acting on ignorance.
  *   **Theoretical Cost:**
      *   *Satisficing:* Closes deliberation (meets Friday) but collapses the distinction (treats "good enough" as a proxy for "best," masking ignorance).
      *   *Will-Based Views:* Closes deliberation but risks arbitrariness (cannot prove it wasn't ignorance).

  ---

  ### III. The Killer Requirement
  *The single requirement that does the most to rule out standard positions.*

  **Requirement 7: Rationality Without a Best Option.**

  **Why it rules out the standard positions:**
  1.  **It destroys Standard Economic Rationality:** Expected Utility Theory and standard decision matrices rely on the axiom of ordering. If there is no "best" (maximal) element in the choice set, standard rational choice theory declares the agent irrational or indifferent. This requirement forces you to abandon the maximization model entirely.
  2.  **It destroys Classical Utilitarianism:** If values are incommensurable, there is no common currency (utility) to calculate a "best" outcome. This requirement forces the theory to accept that rational action can occur outside the calculus of consequences.
  3.  **It destroys Strict Comparativism:** It forces the rejection of the Trichotomy Thesis (that for any A and B, one must be better, worse, or equal).

  **Why it fits your purpose:**
  This is the only requirement that forces the theory to move from *mapping value* to *empowering agency*. A metaphysical theory can say "There is no best option, so no rational choice exists." A guidance theory *must* say "There is no best option, so you must create the reason." This requirement is the wedge that opens the space for your paper to discuss will, commitment, or practical identity as the source of normativity, rather than value itself.

  ### IV. Strategic Advice for the Paper
  Use the **Small Improvement vs. Revisability** tension as the engine of your critique.
  *   Show how metaphysical accounts (Raz) get Small Improvement right but fail Revisability (they leave the agent stuck).
  *   Show how voluntarist accounts (Sartre/Chang) get Revisability right but strain Small Improvement (they make commitment look like a magic trick that alters value).
  *   Position your preferred account as the one that best manages this specific trade-off while keeping **Rationality Without a Best Option** intact.
