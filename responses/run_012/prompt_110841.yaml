answer: |-
  A sunk cost is a reason for action only if the past investment constitutes part of the value achieved, provides evidence of future viability, or was deliberately incurred to bind your future self. In all other cases, ignoring the sunk cost is the only rational choice.

  The "constitutive" clause is forced by Case 2 (Marathon): here, the endurance already spent is partly the point of finishing, so the past effort creates present value. The "binding" clause is forced by Case 4 (Talk): the ticket was purchased specifically as a Ulysses contract to overcome weakness of will. The "evidence" clause addresses Case 7 (Proof): persistence is rational only if the weeks spent signal that a solution is near, not merely because time was lost. Cases 1 (Rental), 3 (Startup), and 6 (Novel) fail all three tests: the deposit is incidental, the venture lacks evidential support, and reading pages does not constitute the value of a novel (enjoyment does).

  This principle predicts: (1) Finishing a bad meal because you paid is irrational (consumption is not constitutive). (2) Continuing a rescue mission after significant risk is rational if success validates the danger undertaken (constitutive of heroism).

  Regarding your seven verdicts, this principle accommodates all five of your definite judgments (1, 2, 3, 4, 6). You need not give any up. Case 1 and 4 are distinguished by intent: the rental deposit was incidental, while the ticket was a deliberate binding device. Case 2 and 6 are distinguished by value: marathon miles constitute the achievement, whereas novel pages are merely instrumental to enjoyment. Cases 5 and 7 remain indeterminate only because you have not yet decided if heritage or persistence is constitutive or evidential in those contexts. If the farm's history constitutes your family's identity, keeping it is rational; if the proof's difficulty signals solvability, continuing is rational. The principle does not contradict your intuitions; it merely clarifies the conditions under which they hold.
