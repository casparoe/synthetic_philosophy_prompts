prompt: |-
  Alright, bit of an odd request. I'm a software engineer, no philosophy background beyond a few podcasts, and I've fallen down a rabbit hole on chaos, determinism and predictability. My mate reckons chaos killed determinism dead, which feels wrong to me — chaos seems to be about us not being able to predict stuff, not about whether stuff is determined. But the more I read the murkier it gets, and I don't want the standard butterfly-effect spiel.

  Say I've got about two or three years of one person's effort to throw at this. Could be me quitting my job, could be a small pot of money I'm thinking of handing to a grad student. Which open questions in this area are definately most worth that effort, and why? I want a defended order, not a survey. Tell me what makes a question upstream of the others, what's tractable for one smart person rather than a whole physics department, and what would move something up or down the list.

  To make it concrete, here are the things I keep tripping over and can't tell if they're deep or just word games: whether "deterministic but unpredictable" is a real distinction or a fudge; the shadowing idea — that even when a simulation drifts off the true trajectory it might still be shadowed by some nearby true trajectory, so maybe the sim is telling us something real after all; whether explanation has to involve prediction, or whether you can understand a chaotic system without being able to forecast it; computational irreducibility, the claim that some systems can only be understood by just running them with no shortcut, and what that does to the very idea of a theory of such a system; and whether there's a real difference between the world being indeterministic and us simply being unable to tell.

  Don't just rank those five — tell me if I'm missing the actual crux and rank whatever the real list should be. Flag which ones are overrated and wouldn't change much downstream. And be blunt.

  British English please, since I'm writing this up for a UK blog.
