  7.  **Address Question 5: Hard Case (Posthumous Collaboration):**
      *   *Scenario:* AI trained on Artist X, curated as collaboration.
      *   *Kant's View:* Art requires a living will. A dead artist has no will. An AI has no will.
      *   *Reconstruction:* It is a *forgery* in the ontological sense (not necessarily legal), or a *simulacrum*. It mimics the *form* of the artist's genius but lacks the *mental disposition* that generated it. It is a product of *craft* (the curator's/programmer's), presented deceptively as *genius*.
      *   *Condition for Fine Art:* The curator would need to be the genius, using the AI as a brush, but claiming it's the dead artist falsifies the "origin of the rule."

