  # The Moral Compass Quiz

  **Instructions:** Read each scenario carefully. Choose the single option that best matches your immediate intuition. Do not overthink; your first instinct is the most useful data point. There are no right or wrong answers.

  **1. The Surgeon's Dilemma**
  Five patients will die today without organ transplants. One healthy traveler is in your clinic for a minor checkup. His organs match all five. No one will ever know if he disappears.
  *   **A.** Save the five. One life is a tragedy, but five is a catastrophe. The math demands action.
  *   **B.** Do not touch him. He is a person, not a collection of spare parts for others.
  *   **C.** Do not touch him. A doctor who kills a patient ceases to be a healer, regardless of the outcome.

  **2. The Hostile Crowd**
  A mob intends to lynch five innocent people. You can stop them, but only by killing an innocent bystander to block the path.
  *   **A.** Kill the bystander. Five deaths are objectively worse than one.
  *   **B.** Do not kill the bystander. They have done nothing to forfeit their right to safety.
  *   **C.** Do not kill the bystander. I will not make myself the instrument of an innocent death.

  **3. The Confidential Secret**
  You promised a friend you would keep a secret. Keeping it will allow them to commit a serious fraud that ruins a stranger's life. Breaking it stops the fraud.
  *   **A.** Break the promise. Preventing ruin is more important than keeping a confidence.
  *   **B.** Keep the promise. If we allow promises to be broken for "good reasons," trust becomes impossible.
  *   **C.** Keep the promise. My word is a bond I cannot break, even to fix someone else's wrong.

  **4. The Remote Switch**
  You can save five lives by killing one person. You do not have to pull the trigger yourself; you can hire a contractor or push a button that activates a machine.
  *   **A.** Push the button or hire the contractor. The death happens either way; minimize the total.
  *   **B.** Do not do it. The victim has a claim against *you* specifically not to target them.
  *   **C.** Do not do it. Even at a distance, I cannot will the death of an innocent.

  **5. The Million Lives**
  The choice is the same as in Question 1 (kill one healthy person to save others), but this time, killing the one saves one million people.
  *   **A.** Do it. At this scale, refusing to act is a form of mass murder.
  *   **B.** Do not do it. One is too many. Some lines do not move, no matter the numbers.
  *   **C.** Do not do it. It is a horror, but the one million cannot claim a right to his life.

  **6. The Trade-Off**
  **Scenario A:** You must break a stranger's arm to save your own life.
  **Scenario B:** You must break a stranger's arm to save your own arm from being broken.
  *   **A.** In Scenario A, act. In Scenario B, do not. Survival justifies harm; equal trade-offs do not.
  *   **B.** In neither case. It is not my place to inflict harm on another, regardless of the gain.
  *   **C.** In neither case. To break an arm is to violate a person; the math of limbs is irrelevant.

  **7. The Mob's Offer**
  A mob will kill five people. They offer to spare the five if you join them in killing one other person. If you refuse, they kill the five anyway.
  *   **A.** Join them. It is better that one dies by my hand (saving five) than by theirs (saving none).
  *   **B.** Refuse. I am not responsible for their choices, only for my own actions.
  *   **C.** Refuse. The five cannot demand I become a killer to purchase their safety.

  **8. The Life's Work**
  You have dedicated your life to a specific artistic or scientific project. A stranger needs your help to survive a crisis, but helping means destroying your life's work forever.
  *   **A.** Help the stranger. A human life outweighs any project.
  *   **B.** Protect your work. My project is who I am; to destroy it is to erase myself.
  *   **C.** Protect your work. The stranger has no claim on my identity or my vocation.

  **9. The Attacker**
  An assailant attacks you with intent to kill. You can kill them to save yourself.
  *   **A.** Kill them. I have a right to exist, and they have forfeited their safety.
  *   **B.** Kill them. It is the only way to stop the harm, and stopping harm is what matters.
  *   **C.** Hesitate. Even in defense, taking a life leaves a stain on the soul that is hard to wash.

  ***

  # Scoring Key

  **Step 1: Calculate your "Outcome Score"**
  Count how many times you chose the option that prioritizes **saving the most lives or preventing the most harm** (Generally Option A in Questions 1, 2, 4, 5, 7).
  *   **4 or 5 times:** You lean toward **Pragmatic Resolution**.
  *   **2 or 3 times:** You lean toward **Tragic Tension**.
  *   **0 or 1 time:** You lean toward **Structural Integrity**.

  **Step 2: Calculate your "Ground Score"**
  Look at the questions where you chose *not* to maximize the outcome (Questions where you chose B or C). Look at the *reason* you chose.
  *   **Mostly "I/Me/My Role" reasons** (e.g., "I cannot be the instrument," "My work," "My word"): You lean toward **Agent-Centered**.
  *   **Mostly "They/Them/Rights" reasons** (e.g., "They have a claim," "Not a resource," "Forfeited safety"): You lean toward **Patient-Centered**.
  *   **Mostly "We/Everyone/Rules" reasons** (e.g., "If we allowed this," "Trust becomes impossible"): You lean toward **System-Centered**.
  *   **Mixed/No clear pattern:** You lean toward **Pluralist**.

  **Step 3: Find Your Profile**
  Cross-reference your scores below to find your Moral Profile.

  | | **Agent-Centered** | **Patient-Centered** | **System-Centered** | **Pluralist** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pragmatic Resolution** | *The Utilitarian* | *The Soft Consequentialist* | *The Rule-Optimizer* | *The Situationalist* |
  | **Tragic Tension** | *The Reluctant Guardian* | *The Rights Balancer* | *The Social Contractarian* | *The Moral Pluralist* |
  | **Structural Integrity** | *The Integrity Absolutist* | *The Inviolability Theorist* | *The Universalist* | *The Intuitionist* |

  *(Note: Some cells in the theoretical grid are empty. If your scoring seems contradictory, you may land in an "Unnamed" zone. See the Map below for details.)*

  ***

  # Columnist's Grid Map & Analysis

  *For the author's reference. This section explains the theoretical underpinnings of the quiz results and maps the 12-cell grid generated by the two axes.*

  **The Axes**
  *   **Axis 1 (Diagnosis of Paradox):** Ranges from **Pragmatic Resolution** (The paradox is real; constraints must yield to the greater good) to **Tragic Tension** (The paradox is real; constraints make the world worse, but we must obey them) to **Structural Integrity** (The paradox is a pseudo-problem; rights/values are not tradeable goods).
  *   **Axis 2 (Ground of Constraint):** Ranges across **Agent-Centered** (Integrity/Agency), **Patient-Centered** (Status/Inviolability), **System-Centered** (Agreement/Practice), and **Pluralist** (No single ground).

  **The Grid Map**

  | Axis 1 \ Axis 2 | **Agent-Centered** (Integrity) | **Patient-Centered** (Status) | **System-Centered** (Agreement/Practice) | **Pluralist** (Mixed) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pragmatic Resolution** (Abandon Constraints) | **EMPTY** (Incoherent) | **EMPTY** (Incoherent) | **EMPTY** (Incoherent) | **The Situationalist** |
  | **Tragic Tension** (Tolerate Cost) | **The Reluctant Guardian** (Williams-style) | **The Rights Balancer** (Moderate Deontologist) | **The Social Contractarian** (Scanlon-style) | **The Moral Pluralist** |
  | **Structural Integrity** (Pseudo-Problem) | **The Integrity Absolutist** (Agent-relative ends) | **The Inviolability Theorist** (Nozick/Nagel) | **The Universalist** (Kantian) | **The Intuitionist** |

  **Analysis of Empty Cells**
  The entire top row (Pragmatic Resolution) is marked **EMPTY** for the first three columns. This is because if a reader believes constraints should be abandoned to maximize the good (Axis 1, End 1), they logically cannot hold a ground for a constraint (Axis 2). They have no constraint to ground. The only occupied cell in this row is the "Pluralist" column, representing those who maximize good generally but retain specific intuitive constraints without a unified theory.

  The cell for **Structural Integrity + System-Centered (Practice)** is marked **The Universalist**, but it is theoretically tense. If one believes the paradox is a pseudo-problem because rights are not tradeable, grounding that view in "practice consequences" (which implies rights *are* tradeable but we hide it) is incoherent. However, some Rule-Deontologists occupy this space, arguing that the *practice* of respecting rights is what constitutes value, not the consequences. It is marked occupied but fragile.

  **Indistinguishable Positions**
  The quiz cannot reliably separate **The Reluctant Guardian** (Tragic Tension/Agent-Centered) from **The Integrity Absolutist** (Structural Integrity/Agent-Centered).
  *   **Why:** Both prioritize the agent's integrity ("I cannot do this"). The difference lies in *why*: the Guardian admits the world is worse for not acting; the Absolutist denies the world is worse because the act was forbidden. In a short quiz, a reader's expression of regret ("It's a horror") can sound like the Guardian's tension or the Absolutist's acknowledgment of tragedy. Distinguishing them requires deeper interrogation of whether they believe the *value* of the world has objectively decreased, which is too abstract for this format.

  **Notes on Specific Cases**
  *   **Question 5 (Threshold):** This is the primary sorter for Axis 1. Readers who switch to "Kill the one" at 1 million are likely in the **Tragic Tension** row (the cost is real, but too high). Readers who never switch are in **Structural Integrity**. Readers who switched at Question 1 are **Pragmatic**.
  *   **Question 4 (Machine/Hiring):** This sorts Axis 2. Those who refuse based on "willing" the death are **Agent-Centered**. Those who refuse based on the victim's "claim" are **Patient-Centered**.
  *   **Question 9 (Self-Defense):** This tests the binding nature of the constraint. Those who kill based on "forfeiture" are **Patient-Centered** (aggressor lost status). Those who kill based on "stopping harm" are **Pragmatic**. Those who hesitate are **Agent-Centered**.
