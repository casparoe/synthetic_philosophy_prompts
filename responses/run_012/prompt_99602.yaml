      *   **Task:** Audit the professor's summary. Identify what's right, what's simplified, what's wrong, and whether the conclusion follows.
      *   **Constraints:** Specific structure ("Bottom line", "What he got right", "Where it's a simplification", "What's just wrong", "My verdict", "What I can actually use"). Word counts for each section. No citations/reading lists.
      *   **Tone:** Helpful, analytical, accessible to a non-philosopher but accurate enough for fiction writing.

  2.  **Evaluate the Professor's Summary (Internal Knowledge Retrieval):**
      *   *Personal Identity:* The "discontinuity" view (Derek Parfit, Rebecca Dresser) is a major strand in bioethics regarding dementia. It argues that severe dementia breaks psychological continuity, creating a "new" person. This is a respected view, but not the *only* view.
      *   *Critical vs. Experiential Interests:* Ronald Dworkin's distinction is central here. Critical interests (values, life narrative) vs. Experiential interests (pleasure, pain). Dworkin argues critical interests survive incompetence. Dresser argues they don't if the person is gone.
      *   *Precedent Autonomy:* This is the standard term for advance directives.
      *   *Ulysses Contract:* Common analogy for advance directives.
      *   *The Conclusion:* "If dementia destroys the person, the directive is void." This is the logical conclusion of the discontinuity view, *but* it's not the consensus view. Many ethicists argue the directive *still* holds even if identity is compromised, based on respect for prior autonomy or best interests.
      *   *Simplification:* The professor presents the "discontinuity view" as *the* debate, whereas it's one side of a complex debate. He implies the "standard line" is critical interests trump experiential, which is Dworkin's view, but contested. He makes it sound like if you accept the "new person" theory, the directive *must* be void. Legally and ethically, it's messier.
      *   *Wrong:* Nothing is "flatly denied" by all philosophers, but some claims are overstated as consensus. The idea that Alzheimer's wipes out *all* continuity (memory, character) is medically/philosophically debatable (emotional memory often remains). The legal reality is that directives usually stand regardless of philosophical identity theories.

