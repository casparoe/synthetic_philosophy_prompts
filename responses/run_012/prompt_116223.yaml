answer: |-
  **WORKSHOP Q&A PREPARATION SHEET**
  **Paper:** *The Ledger Assumption and the Normativity of Money Pumps*
  **Venue:** Diachronic Rationality Workshop
  **Date:** Next Month
  **Prepared For:** The Author

  **Note from the Editor:**
  I have drafted these responses to fit a two-minute window (approx. 250 words spoken at a measured pace). I have adhered to British spelling and usage throughout (*defence, modelling, rationalise, centre*). Do not deviate from the script on the 'Soft Spot' admissions; honesty there buys you credibility for the harder lines.

  ***

  ### 1. The 'Dominated Strategy' Objection (The Economists)
  **Damage Rating:** Critical
  **The Question:** "If your agent accepts a sequence of trades that leaves them poorer with no compensating gain, they have chosen a dominated strategy. In economics, choosing a dominated strategy *is* the definition of irrationality. Are you not simply stipulating a new definition of rationality to save cyclic preferences?"

  **The Reply:**
  "I am not stipulating a new definition, but distinguishing between *pragmatic loss* and *structural incoherence*. The money pump demonstrates that cyclic preferences are costly in a specific market environment where trades are sequential and reversible. I grant the agent loses money. However, calling this 'irrational' presupposes the Ledger Assumption: that the agent values the sequence *only* as the sum of the local trades.

  If the agent values the *trajectory*—perhaps they value the act of returning to their original endowment as a form of completion, or they disvalue the very act of being 'pumped' as a distinct negative—then the sequence is not dominated *for them*. The loss of cash is the price paid for satisfying a higher-order preference over paths rather than outcomes. To call this irrational is to beg the question by assuming the Ledger Assumption is the only valid metric of value. We should say the agent is expensive, not incoherent."

  **Where the Reply Goes Soft:**
  It risks sounding like special pleading. If *any* cost can be rationalised by positing a 'higher-order preference', the theory becomes unfalsifiable. You must insist that the preference is over *sequences*, not just a post-hoc excuse for loss.

  ***

  ### 2. The 'Positive Norm' Objection (The Dreaded Question)
  **Damage Rating:** Critical
  **The Question:** "You have told us what doesn't make the agent irrational (the Ledger Assumption). But if the Ledger Assumption is false, what *does* govern diachronic choice? If coherence isn't the norm, what is? Are you leaving us with no normative force at all?"

  **The Reply:**
  "This is the crux. I am not arguing for normativity without constraints, but for a shift in the locus of constraint. The norm is not 'avoid arbitrage at all costs', but 'maintain fidelity to your planned trajectory'. Rationality, on my view, is about the integrity of the agent across time, not merely the balance sheet at the end of it.

  If an agent plans to resist the pump but fails, *that* is irrational (akrasia). If they plan to resist and succeed, they are rational, even if they incur transaction costs to do so. The normative bite comes from the requirement to act in accordance with one's diachronic plan, not from the requirement to maximise asset retention in a hostile market. We replace the norm of 'no-arbitrage' with the norm of 'plan-consistency'."

  **Where the Reply Goes Soft:**
  'Plan-consistency' can look circular. If the plan is to accept the trades, they are consistent. You need to be prepared to argue that the plan must be formed under full information about the cycle.

  ***

  ### 3. The 'Time-Slice' Objection (The Metaphysicians)
  **Damage Rating:** High
  **The Question:** "You speak of the 'agent' persisting across the sequence. But if I am a time-slice theorist, the 'Ledger' is never held by one entity. The agent at $t_1$ isn't the one paying at $t_3$. Why should $t_1$ care about the Ledger Assumption?"

  **The Reply:**
  "If you reject the persistence of the agent entirely, the money pump argument collapses for reasons unrelated to my thesis—it requires a single victim to be a pump. However, my argument works even on a weaker view of persistence. We do not need a metaphysical soul; we need a functional planning system.

  The 'Ledger' is a modelling tool used by the decision-theorist, not necessarily a mental account held by the agent. My claim is that the *theorist* cannot use the sum of local utilities to judge the rationality of the system unless the system itself aggregates value that way. Whether the agent is a perduring worm or a series of stages, if the system does not aggregate value linearly, the pump fails to prove irrationality. It only proves the system is not a linear aggregator."

  **Where the Reply Goes Soft:**
  If they press that 'systems' cannot be irrational, only agents can, you may have to concede that your view requires a minimal commitment to whole-agent realism.

  ***

  ### 4. The 'Resolute Choice' Objection (The Kantian)
  **Damage Rating:** Medium
  **The Question:** "You suggest the agent can simply refuse the trades to avoid the pump. Is this not just resolute choice? And isn't resolute choice merely binding your future self arbitrarily? That sounds like weakness of will dressed up as principle."

  **The Reply:**
  "I reject the characterisation of resolute choice as arbitrary binding. To refuse the trade is not to bind the future self against its will, but to express a preference that was present all along: a preference for non-exploitability. The Kantian worry is that the agent is acting on a maxim they cannot will.

  But consider: if the maxim is 'I will not participate in markets that treat my preferences as fungible commodities', this is a perfectly universalisable principle. It is not weakness of will to refuse a game one does not wish to play. The 'weakness' lies in the theorist's inability to model preferences that are sensitive to context. The agent is not overcoming a desire; they are satisfying a constraint on how their desires are satisfied."

  **Where the Reply Goes Soft:**
  The Kantian may argue that avoiding a money pump is a prudential, not moral, maxim. Do not get dragged into moral philosophy; keep it to practical rationality.

  ***

  ### 5. The 'Incomplete Preferences' Objection (The Specialist)
  **Damage Rating:** Low
  **The Question:** "Often, cycles arise because preferences are incomplete, not because $A \succ B \succ C \succ A$. If the agent is merely undecided, the pump doesn't get started. Isn't your Ledger Assumption solving a problem that incompleteness already solves?"

  **The Reply:**
  "Incompleteness is one way to avoid the pump, but it is not the only way. My argument is designed to cover cases where the preferences *are* complete and cyclic. There are agents who genuinely prefer $A$ to $B$, $B$ to $C$, and $C$ to $A$, perhaps due to multi-attribute trade-offs.

  For these agents, incompleteness is not an option; they have made up their minds. The Ledger Assumption is what turns those genuine cyclic judgments into a 'mistake'. If we drop the Assumption, we can accommodate genuine cyclic completeness without condemning the agent to irrationality. Incompleteness saves the coherence; my proposal saves the agent."

  **Where the Reply Goes Soft:**
  You must ensure you don't concede that most cycles *are* due to incompleteness. Stand firm that genuine cycles exist.

  ***

  ### Strategy for Concessions

  **Concede Immediately:**
  *   **To the Economists:** Concede that the agent *loses money*. Do not try to argue they come out ahead materially. They will smell a rat. Your point is about the *normative status* of the loss, not the arithmetic. Say: "I grant the loss of utility in the numeraire; I deny the loss of rationality."
  *   **To the Time-Slice Theorists:** Concede that your view requires a 'functional' persistence, even if not metaphysical. It saves time arguing about souls.

  **Do Not Concede:**
  *   **The Definition of Rationality:** Do not let them define rationality solely as 'avoiding dominated strategies'. Insist it includes 'fidelity to plans'.
  *   **The Ledger Assumption:** Do not let them claim it is 'obvious' or 'implicit'. It is a substantive metaphysical claim about value aggregation.

  ### The One You Are Dreading
  **Question:** "If the Ledger Assumption is false, why does it feel so intuitive? Are you not just exploiting a gap in our modelling language to protect a counter-intuitive result?"

  **Why it hurts:** It attacks the *motivation* of your paper rather than the logic. It suggests you are playing word games.
  **Preparation:** Acknowledge the intuition. "It feels intuitive because we live in a market society that *enforces* the Ledger Assumption. We are trained to sum costs. My paper is a critique of that training, not a description of pre-theoretic intuition."

  ***

  **Final Note:** Keep your water close. If the Kantian begins to speak, take a slow sip. It grants you thinking time and signals patience. Good luck.
