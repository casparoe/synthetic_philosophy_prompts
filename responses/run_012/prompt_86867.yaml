answer: |-
  Based on the seven rulings provided, your colleague is not operating on the "All-Affected Principle" (your instinct) nor the "All-Citizens Principle." She is running a stricter, administrative-law variant of the **"All-Subjected Principle,"** tempered by a requirement for a **Concrete Stake.**

  Here is the breakdown of her jurisprudence, the prediction for Marrowfield, and the test case that would reveal the limits of her logic.

  ### 1. The Rules Fitting Her Record

  From her seven rulings, we can distill three operating principles:

  *   **Rule A (The Subjection Test):** Eligibility requires being subject to the Authority's coercive regulatory power.
      *   *Evidence:* Ruling 1 (undocumented residents are subject to local law), Ruling 5 (business owners are bound by Authority rules), Ruling 7 (non-compliers are still subject to the rules).
      *   *Constraint:* Ruling 2 shows that mere citizenship (national subjection) is not enough; the subjection must be to the *local* Authority.
  *   **Rule B (The Stake Test):** Eligibility requires a tangible, material tie to the area (residency, livelihood, or long-term presence).
      *   *Evidence:* Ruling 1 (10 years residency), Ruling 3 & 4 (presence/capacity), Ruling 5 (livelihood drawn from firms *inside* the area).
      *   *Constraint:* Ruling 2 excludes those who own nothing and live nowhere in the area.
  *   **Rule C (The Affectedness Limit):** Being impacted by the *consequences* of a decision is insufficient without Subjection or Stake.
      *   *Evidence:* Ruling 2 is the key here. Citizens outside the area are "affected" by national policy and local precedent, yet she ruled them ineligible. This explicitly rejects the "All-Affected" principle in its pure form.

  ### 2. Predictions for Marrowfield

  *   **Under Rule A (Subjection):** **Ineligible.** Marrowfield residents are subject to *environmental standards* via the compact, but the prompt specifies they are "not [bound] to the decision now before the assembly." The Assembly decides the *fate* (clean or poison); Marrowfield must live with the result, but the Assembly does not legally command them. She distinguishes between being regulated by the Authority and being governed by the Assembly.
  *   **Under Rule B (Stake):** **Ineligible.** They are not residents, own no property inside the boundary, and draw no livelihood from inside the area. Drinking water is a consequence, not a "stake" in her administrative sense (compare to R5's "livelihood").
  *   **Under Rule C (Affectedness):** **Ineligible.** As established in Ruling 2, being affected by the outcome (as outside citizens are) does not grant eligibility.

  ### 3. The Bet

  **I bet she rules Marrowfield Ineligible.**

  **Reasons:**
  1.  **Jurisdictional Integrity:** She is a boundary judge. Her career was spent defining where one authority ends and another begins. Admitting Marrowfield blurs the boundary between the Authority's jurisdiction and the downstream town's sovereignty.
  2.  **The "Decision" Distinction:** The critical phrase is "not [bound] to the decision." In administrative law, standing often requires being "aggrieved" by a specific action or regulation. Marrowfield is aggrieved by the *physics* of the river, not the *law* of the Assembly. She privileges legal subjection over hydrogeological reality.
  3.  **Consistency with Ruling 2:** To let Marrowfield in would contradict Ruling 2. If outside citizens (who are affected by the nation's health) are out, downstream residents (affected by the river's health) must also be out, unless they cross the threshold of Subjection or Stake. The compact binds them to *standards*, not *governance*. She will view this as a regulatory compliance issue, not a franchise issue.

  ### 4. Nearest Precedent

  **Ruling 2 (Citizens outside the area).**

  This is the controlling negative precedent. In Ruling 2, the individuals had a formal political tie (citizenship) but no local tie. In Marrowfield, the individuals have a formal regulatory tie (the compact) but no local tie. She will view the compact as analogous to citizenship: a background status that does not confer specific voting rights on specific local decisions.

  *Counter-Precedent:* Ruling 5 (Business Owners) is the one you might cite to argue for them. However, the business owners drew their *livelihood* from inside the area and were bound by the Authority's *rules* generally. Marrowfield has neither the livelihood tie nor the binding decision tie.

  ### 5. The Category to Force the Issue

  If you wish to test the true limit of her principle—to force her to choose between "Subjection" and "Stake"—you should propose the following category:

  **"The Upstream Regulated."**

  *   **Description:** Residents of a town *upstream* and outside the boundary who are legally bound by the Assembly's new discharge rules (e.g., they are prohibited from dumping waste that would enter the aquifer) but whose own water supply is not affected by the aquifer's fate (the water flows away from them).
  *   **Why this forces the issue:**
      *   They pass **Rule A (Subjection):** They are legally bound by the Assembly's specific decision (unlike Marrowfield).
      *   They fail **Rule B (Stake):** They have no residency, property, or livelihood inside the area, and the water quality decision does not affect their health (unlike Marrowfield).
      *   **The Dilemma:** If she admits them, she confirms that **Subjection alone** is sufficient (the All-Subjected Principle). If she excludes them, she confirms that **Subjection + Affectedness/Stake** is required.
      *   This splits her previous rulings: Ruling 5 had both Subjection and Livelihood. This category offers Subjection *without* Livelihood or Affectedness. It would reveal whether she values the *burden of compliance* (which they bear) or the *benefit of the outcome* (which they do not receive).

  ### Summary for the Steering Committee

  Your instinct is moral (those who drink should decide); hers is juridical (those who are ruled should decide). She views the Assembly not as a town hall for the watershed, but as a legislative body for a jurisdiction. Unless Marrowfield can be shown to be *governed* by the Assembly's specific vote, rather than merely *impacted* by its consequences, she will keep the boundary where the map draws it.
