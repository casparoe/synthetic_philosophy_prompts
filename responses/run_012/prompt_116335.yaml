answer: |-
  Here is the specification sheet for a theory of supererogation. I have divided the desiderata into **Non-Negotiable (NN)** conditions (without which the concept dissolves) and **Camp Preferences (CP)** (where legitimate theoretical disagreement exists).

  ### I. The Core Spec (Non-Negotiable)

  **1. The Optionality Constraint (NN)**
  *   **Requirement:** The act must not be morally obligatory. Omitting the act must not render the agent blameworthy or morally deficient.
  *   **Case:** *The Stranger Kidney.* If donating a kidney to a stranger is supererogatory, you cannot be blamed for keeping both your kidneys. If a theory says you *must* donate, it has collapsed supererogation into duty.

  **2. The Value Constraint (NN)**
  *   **Requirement:** The act must be morally good or beneficial. It cannot be morally neutral.
  *   **Case:** *The Tiny Favor.* Picking up a pen for someone is optional, but if it costs you nothing and helps them, is it supererogatory? A theory must explain why some optional good acts count (heroic sacrifice) while others (tiny favors) might just be "nice" but not strictly supererogatory. (Most theories require a threshold of *significant* moral value).

  **3. The Non-Collapsing Distinction (NN)**
  *   **Requirement:** The theory must maintain a tripartite distinction: **Obligatory** (must do), **Supererogatory** (may omit, good to do), and **Merely Permitted** (may omit, neutral value).
  *   **Case:** *Vanity.* If someone saves a life solely for fame, the act is still good (Value Constraint), but the agent isn't praiseworthy. The theory must distinguish the *status of the act* from the *praise of the agent*.

  ### II. The Tricky Cases (Application of the Spec)

  Here is how your specific trip-ups map onto the desiderata.

  **4. The Special Obligation Boundary (NN)**
  *   **Requirement:** The theory must distinguish general beneficence from role-based duty.
  *   **Case:** *Parent Sacrificing for Child.* This looks heroic, but intuitively it is **required**. A theory fails if it classifies a parent feeding their child as supererogatory.
  *   **Fix:** The theory must accommodate *special obligations* (duties arising from relationships) that trump general beneficence.

  **5. The All-Things-Considered Constraint (NN)**
  *   **Requirement:** The theory must handle conflicting duties. An act can be supererogatory in one respect but wrong in another.
  *   **Case:** *Hero Neglecting Family.* If a firefighter saves a busload of kids (supererogatory regarding the kids) but abandons their own child to do so (wrong regarding the child), the theory must allow for **moral residue**. The act is not simply "good"; it is morally complex.
  *   **Fix:** Supererogatory status is usually *prima facie*, not necessarily *all-things-considered*.

  **6. The Cost/Sacrifice Threshold (CP)**
  *   **Requirement:** Does the act require significant cost to the agent?
  *   **Case:** *The Tiny Favor.* Giving a stranger a dollar is good and optional. Is it supererogatory?
  *   **Camp A:** Yes, any optional good act is supererogatory (inflates the category).
  *   **Camp B:** No, supererogation requires significant sacrifice or risk (preserves the "heroic" intuition). *Most theories prefer Camp B.*

  **7. The Motivation Condition (CP)**
  *   **Requirement:** Does the motive determine supererogatory status?
  *   **Case:** *Vanity vs. Love.*
  *   **Act-View (Standard):** Supererogation is a property of the **act**. Saving a life for vanity is still a supererogatory *act*, even if the *agent* deserves less praise.
  *   **Agent-View:** Supererogation is a property of the **action-token/motive**. If done from vanity, it loses its supererogatory status.
  *   **Consensus:** The Act-View is dominant because it keeps the deontic status (what you ought to do) separate from aretaic evaluation (how good you are).

  ### III. The Mirror Image (Suberogation)

  **8. The Suberogation Symmetry (CP)**
  *   **Requirement:** Must the theory allow for acts that are permitted but morally lousy (suberogatory)?
  *   **Case:** Eating a spicy meal you know will make you sick and burden your spouse, even though you promised nothing. It's not wrong, but it's stupid/bad.
  *   **Status:** **Camp Preference.** Urmson (who revived the concept) did not require this. However, a robust theory of the "moral landscape" usually wants symmetry. If you can go above the call, you should be able to go below the call without breaking it.

  ### IV. The Incompatibility & The Culprit

  You asked which subset of desiderata cannot be satisfied at once. You are correct that there is a tension, but the culprit is specific.

  **The Incompatibility:**
  1.  **Maximizing Principle:** An agent is morally obligated to perform the act that produces the *most* overall good (or is the *best* available act).
  2.  **Supererogation Existence:** There are acts that produce the most overall good (or are the best) but are *not* obligatory.

  **The Culprit:**
  The **Maximizing Principle** (specifically: *Optimality entails Obligation*) is the single requirement that does the excluding work.
  *   If you hold that "You ought to do the morally best thing available," **supererogation is logically impossible.** The "best" act becomes the "required" act.
  *   To have supererogation, you **must** reject the idea that morality always demands the optimal outcome.

  **How Theories Escape the Culprit:**
  *   **Satisficing Consequentialism:** Duty is to do "good enough," not "the best." The best is supererogatory.
  *   **Agent-Centered Prerogatives (Scheffler):** Agents are permitted to give extra weight to their own interests, so the "optimal" act isn't always the "required" one.
  *   **Deontology (Rossian):** Duties are plural and conflicting. Beneficence is one duty, but self-interest or special obligations are others. The "best" act isn't defined by a single metric.

  ### V. Scorecard: How Going Views Fare

  | Theory | Handles Optionality? | Handles Value? | Handles Special Obligations? | Rejects Maximizing? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Act Utilitarianism** | **FAIL** | Pass | **FAIL** (Collapses parent/child into general good) | **NO** (The Culprit) | Eliminates supererogation entirely. |
  | **Kantianism** | **Struggle** | Pass | Pass | **NO** (Duty is rational law) | Struggles to fit "saintly" acts into "wide duties." Often collapses supererogation into imperfect duty. |
  | **Common Sense (Ross)** | Pass | Pass | **Pass** (Prima facie duties) | **YES** (Pluralist) | **Best Fit.** Accommodates the data but lacks a unified foundational explanation for *why* the room exists. |
  | **Satisficing Conseq.** | Pass | Pass | Struggle | **YES** (Modified) | Saves supererogation by lowering the bar for duty. Criticized for arbitrariness (what is "good enough"?). |
  | **Agent-Centered Prerogative** | Pass | Pass | Pass | **YES** (Modified) | **Strong Contender.** Allows agents to not maximize without being immoral, creating space for the "extra." |

  ### Summary for your Reading
  To count as a theory of supererogation, a view **must** carve out logical space where an act is **optimally good** yet **non-obligatory**.
  *   **Non-Negotiable:** It cannot blame you for omitting the act; it must praise the act as good; it must distinguish duty from role-obligation (parent/child).
  *   **The Dealbreaker:** If the theory claims "Morality requires the Best Outcome," it is **not** a theory of supererogation. It is a theory of duty that吞 (swallows) supererogation.
  *   **Act vs. Agent:** Standard spec treats it as a property of the **Act** (objective), distinct from the praiseworthiness of the Agent (subjective).
  *   **Suberogation:** Nice to have, but not required for the core definition.

  When reading further, check immediately: **How does this author block the Maximizing Principle?** That is the engine room of the theory.
