  # THE HIGHER-ORDER EVIDENCE SORTER

  **Starting Assumption:** You accept that facts about your own reasoning (peer disagreement, pills, calibration) are part of your total evidence and bear on whether your first-order belief is rational.

  ### THE TREE

  **NODE 1: The Akrasia Constraint**
  Is it possible for a fully rational agent to believe *P* while simultaneously judging that believing *P* is irrational?
  *   **NO (Levels Locked)** → Go to Node 2.
  *   **YES (Levels Open)** → Go to Node 4.

  **NODE 2: The Defeat Question (For Locked Levels)**
  When higher-order evidence (HOE) conflicts with first-order evidence (FOE), must the first-order belief yield?
  *   **YES (HOE Defeats)** → Go to Node 3.
  *   **NO (FOE Stands)** → Go to Node 5.

  **NODE 3: The Recursive/Diachronic Scope (For HOE Defeats)**
  Does the rational pressure to revise diminish if you learn you are bad at assessing HOE, or if the disagreeing "peer" is your own future self?
  *   **YES (Self-Mitigating)** → Go to Node 5.
  *   **NO (Robust)** → Go to Node 5.

  **NODE 4: The Doxastic Command (For Open Levels)**
  Even if akrasia is permitted, does the HOE still *compel* you to abandon the first-order belief *P*?
  *   **YES (Compelled Revision)** → Go to Node 5. *(Note: Behaviorally converges with Node 2-YES)*
  *   **NO (Steadfast Akrasia)** → Go to Node 5.

  **NODE 5: The Uniqueness Thesis (All Paths)**
  Given the total evidence (FOE + HOE), is there exactly one rational level of confidence?
  *   **YES (Unique)** → **LEAF**.
  *   **NO (Permissive)** → **LEAF**.

  ---

  ### THE LEAVES (POSITIONS)

  **1. The Right Reasons Uniquist** (Node 2-NO, Node 5-YES)
  *   **Commitment:** A belief resting on sound first-order reasons cannot be defeated by evidence about how one came by it.
  *   **Vulnerability:** Struggles to explain why learning you took a "bias pill" doesn't undermine your confidence in your reasoning.
  *   **Handles Recursive/Diachronic:** Dismisses them; if FOE is sound, self-doubt is irrelevant.

  **2. The Right Reasons Permissivist** (Node 2-NO, Node 5-NO)
  *   **Commitment:** FOE can outweigh HOE, and multiple confidence levels are consistent with this weighting.
  *   **Vulnerability:** Risks making rationality too easy; allows agents to ignore clear signs of their own unreliability.
  *   **Handles Recursive/Diachronic:** Treats future-self disagreement as just another piece of FOE to be weighed.

  **3. The Robust Conciliationist** (Node 2-YES, Node 3-NO, Node 5-YES)
  *   **Commitment:** A peer's disagreement of itself compels movement toward the middle, whatever the first-order evidence says.
  *   **Vulnerability:** May force suspension of judgment in cases where the peer is clearly wrong but you cannot prove it.
  *   **Handles Recursive/Diachronic:** Maintains pressure even if you suspect you are bad at assessing the disagreement; future self counts as a peer.

  **4. The Robust Conciliationist Permissivist** (Node 2-YES, Node 3-NO, Node 5-NO)
  *   **Commitment:** HOE compels revision, but the exact degree of revision is not uniquely determined.
  *   **Vulnerability:** Tension between "compels movement" and "no unique destination"; risks arbitrariness.
  *   **Handles Recursive/Diachronic:** Same as Robust Conciliationist, but allows a range of conciliatory responses.

  **5. The Self-Mitigating Defeatist** (Node 2-YES, Node 3-YES, Node 5-YES)
  *   **Commitment:** HOE defeats FOE, unless the HOE itself is undermined by doubts about your capacity to assess it.
  *   **Vulnerability:** **Collapses into Right Reasons** if mitigation is too strong; hard to specify the threshold.
  *   **Handles Recursive/Diachronic:** Explicitly handles the "bad at assessing HOE" case by neutralizing the HOE; future-self disagreement may not count.

  **6. The Self-Mitigating Permissivist** (Node 2-YES, Node 3-YES, Node 5-NO)
  *   **Commitment:** Defeat is possible but context-sensitive, and the response is not unique.
  *   **Vulnerability:** Highly complex; risks making rationality opaque to the agent.
  *   **Handles Recursive/Diachronic:** Allows agent to discount HOE in recursive cases without ignoring it entirely.

  **7. The Akratic Steadfast Uniquist** (Node 4-NO, Node 5-YES)
  *   **Commitment:** It can be rational to hold a belief while judging that holding it is not rational.
  *   **Vulnerability:** Posits a fractured rationality; hard to motivate why one should believe what one judges irrational.
  *   **Handles Recursive/Diachronic:** Allows holding *P* despite judging your assessment of *P* is flawed; diachronic disagreement creates akrasia.

  **8. The Akratic Steadfast Permissivist** (Node 4-NO, Node 5-NO)
  *   **Commitment:** Rationality is permissive here, so no unique revision is required; akrasia is allowed.
  *   **Vulnerability:** **Indistinguishable from Leaf 2** in practice; both allow retaining belief despite HOE.
  *   **Handles Recursive/Diachronic:** Permits retaining belief even when future self disagrees, labeling the tension "rational."

  ---

  ### DIAGNOSTIC NOTES

  **Empty Cells:**
  *   **"Open Levels + Compelled Revision" (Node 4-YES):** This cell is theoretically unstable. If you are compelled to revise, you abandon *P*. If you abandon *P*, you no longer believe *P* while judging it irrational. This path behaviorally collapses into **Locked + HOE Defeats** (Leaves 3–6). It is empty because the *state* of akrasia vanishes upon compliance.

  **Indistinguishable Leaves:**
  *   **Leaf 2 (Right Reasons Permissivist) vs. Leaf 8 (Akratic Permissivist):** Both permit retaining the first-order belief despite HOE. The distinction is purely internal (whether you *judge* the belief irrational). If the agent's judgment tracks their permission, these leaves make the same behavioral prediction.

  **Meta-Analysis for the Instructor**

  **The Pivotal Branch:**
  **Node 1 (The Akrasia Constraint).** This branch does the most work. If a student flips from "Locked" to "Open," they move from the entire Defeat/Right-Reasons debate (Leaves 1–6) to the Akratic cluster (Leaves 7–8). It separates those who view rationality as a unified hierarchy from those who view it as a collection of potentially conflicting norms.

  **The Least Distinct Leaf:**
  **Leaf 5 (Self-Mitigating Defeatist).** This position is least confident as distinct from **Leaf 1 (Right Reasons)**. If the "mitigation" condition is triggered whenever HOE conflicts with strong FOE, the view simply becomes Right Reasons in disguise. I would expect to encounter students here who are actually Right Reasons theorists trying to accommodate the "pill case" without admitting defeat.

  **Conditions for Redrawing:**
  1.  **Collapse of Uniqueness:** If it turns out that "Permissivism" is merely "Uniqueness + Ignorance," Node 5 fails to carve a real joint. I would remove Node 5 and attach a "Permissivist" tag to Leaves 1, 3, and 5.
  2.  **Incoherence of Akrasia:** If the seminar concludes that "rational akrasia" is a contradiction in terms (e.g., via a transparency principle), Node 1 collapses. The tree would then start at Node 2, and Leaves 7–8 would be marked "Incoherent."
  3.  **Diachronic Disanalogy:** If the class agrees that "future self" is *never* evidence in the same way a "peer" is, Node 3 becomes a false dichotomy. I would split Node 3 into two questions: one for Recursive HOE, one for Diachronic HOE.
