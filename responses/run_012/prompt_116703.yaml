  **JOINT STATEMENT ON THE MORAL SIGNIFICANCE OF DOING VERSUS ALLOWING**

  **Participants:** [Your Name] (The Realist) and [Mate's Name] (The Sceptic)
  **Date:** [Current Date]

  ### 1. Common Ground

  We agree on the following claims, which form the basis of our collaboration:

  *   **Uncontroversial Cases:** We agree that in many practical scenarios, the distinction is morally negligible because other factors dominate. For example, neither of us believes a passer-by is morally obliged to sell their kidney to save a stranger (costly omission), nor do we believe one may shoot a stranger for fun (costly act). In these 'boring' cases, consequences and costs swamp the act/omit structure.
  *   **Psychological Reality:** We agree that human beings *feel* a difference between acting and allowing. We are not debating whether the intuition exists, but whether it tracks a genuine moral truth.
  *   **The Explanandum:** What stands in need of explanation is the persistent intuition in **low-cost, high-stakes scenarios**. Specifically: why does flipping a switch to kill one person feel worse than failing to flip a switch to save one person, when the outcome and effort are identical?

  ### 2. The Disagreement

  We articulate our opposing positions as follows:

  *   **The Realist Position:** The distinction between doing and allowing tracks a genuine moral difference in responsibility. Even holding consequences, costs, and intentions constant, an act of commission generates a different (and typically stronger) moral obligation or culpability than an act of omission. The line is not merely a heuristic; it is a fundamental feature of moral reasoning.
  *   **The Sceptic Position:** The distinction is a moral fiction. Any perceived difference in culpability between doing and allowing is fully explained by secondary factors, such as causal reliability, established expectations, or the cost of intervention. Once these factors are controlled for, the act/omit line itself carries no independent moral weight.

  ### 3. Verbal Clarifications

  We recognise that part of our past conflict has been verbal rather than substantive. Specifically:

  *   **The Word 'Cause':** We often argued over whether an omission 'causes' an outcome. We agree to stop fighting over this definition. We will distinguish between **causal contribution** (physical necessity) and **moral culpability**. Whether we say "starving causes death" is a linguistic choice; the substantive question is whether the *responsibility* for that death differs from shooting.
  *   **Resolution:** We will not treat disagreement over the label 'cause' as evidence for either position. We will focus solely on judgements of wrongness and blame.

  ### 4. Cruxes and Pre-registered Predictions

  We have identified two specific areas where our positions yield different predictions. We agree to treat these as test cases.

  **Crux 1: The Planned Omission**
  *   **The Issue:** Does an omission that is integral to a deliberate plan count morally as an act, or does it remain an omission?
  *   **The Case:** *The Strategic Lifeguard.* A lifeguard wants a specific swimmer to die.
      *   *Scenario A:* The lifeguard pushes the swimmer under (Act).
      *   *Scenario B:* The lifeguard sees the swimmer drowning and deliberately chooses not to throw the lifebelt, *because* he wants the swimmer to die (Planned Omission).
      *   *Scenario C:* The lifeguard sees the swimmer drowning and chooses not to throw the lifebelt because he is distracted by his phone (Unplanned Omission).
  *   **Realist Prediction:** Scenario B is morally closer to Scenario A than to Scenario C. A planned omission bridges the gap towards 'doing' because the agent is actively guiding events towards the outcome via their will, even if physically idle.
  *   **Sceptic Prediction:** Scenario B is morally identical to Scenario C regarding the act/omit distinction. Any increase in blame in Scenario B is due to *malice*, not the structure of the action. The line between doing and allowing remains sharp regardless of the plan.

  **Crux 2: System Design and Reliance**
  *   **The Issue:** Does the distinction survive when a system is designed to 'let happen' by default?
  *   **The Case:** *The Software Safety Feature.* A company releases a car with autonomous braking.
      *   *Scenario A (Never On):* The company never enables the feature in the first place to save costs. People die who could have been saved.
      *   *Scenario B (Switched Off):* The company enables the feature, users rely on it, and then the company disables it via a software update to save costs. People die who could have been saved.
  *   **Realist Prediction:** Scenario B is significantly worse than Scenario A. Switching off a live system is an act of interference; never switching on is an allowance of nature. The moral line holds even within system design.
  *   **Sceptic Prediction:** Scenario B is only worse because of *reliance* and *expectation*, not because it is an 'act'. If we control for reliance (e.g., users are warned the feature is experimental in both cases), the moral difference disappears. The 'switching off' is just an omission of continued support.

  ### 5. Commitment

  We sign this statement to confirm that these are the terms of our engagement. We agree to update our views if the predictions above fail to match our considered judgements on the cases provided.

  **Signed:**

  _________________________ (The Realist)

  _________________________ (The Sceptic)
