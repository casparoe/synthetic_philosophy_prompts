  I've been arguing with a mate for about two years now about whether there's a genuine moral difference between doing something and letting it happen — he thinks the whole doing/allowing line is a fiction we use to feel better about ourselves, I think it's tracking something real but I keep getting out-argued on the specifics. We've agreed to stop shouting and write an adversarial collaboration instead. Can you draft the joint statement we could both put our names to? I want: the claims we'd both sign (including about which cases are boring and uncontroversial either way, and what actually stands in need of explanation); then our disagreement, with each side's position worded so that side would accept the wording; then the cruxes. I reckon one crux is whether an omission that's part of your plan counts differently from one that isn't, and another is whether the line survives when you build a system that does the "letting" for you — e.g. never switching a feature on versus switching it off once it's live and people are relying on it. For each crux, give a case or argument we'd both agree bears on it, and write down what each of us predicts about it in advance. And if part of our fight is just verbal — say, a disagreement about whether "causing" covers omissions — tell me which bit and why. Keep it tight, no reading lists or references please (I can't check them anyway), and write it in British English.
