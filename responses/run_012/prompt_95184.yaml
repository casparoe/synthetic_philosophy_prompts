answer: |-
  # Question-Period Prep Sheet: Crisis Standards of Care

  **Strategy Overview:**
  Your position is counter-intuitive to clinical training and economic efficiency. Do not apologize for the conclusion, but do acknowledge the moral residue. Your goal is not to convince the room that a lottery *feels* better, but that it is the only procedure that respects the *separateness of persons* at the moment of crisis.

  **What to Concede Upfront:**
  *   **Concede:** Numbers matter *ex ante* (planning, staffing, funding). You agree that failing to build enough capacity is a moral failure.
  *   **Concede:** If prognosis differs significantly (e.g., one has a 90% chance of survival, the five have 10%), the lottery is off. Your argument applies only when clinical outcomes are roughly equivalent.
  *   **Hold:** At the moment of allocation (Level 1), an individual's right to be saved is not diluted by the presence of others. The "math of bodies" is category error.

  **The Weakest Point:**
  The boundary between Level 1 (Bedside) and Level 2 (Institutional). You argue counting is valid for budgets but invalid for bedsides. Critics will argue this is arbitrary. If saving five lives is worth $5M in equipment, why isn't it worth one life in triage? You must defend the idea that *institutions* maximize utility, but *agents* (doctors) owe fidelity to the patient in front of them.

  **The Question You Hope Nobody Asks:**
  *"If you were the patient left to die while the five were saved, would you accept this justification? And if not, by what right do you impose it on them?"* (This attacks the "justification to each claimant" premise directly).

  ---

  ## Objection 1: The Clinician's Duty (Likelihood: High | Damage: High)
  **Who:** Lead Intensivist (7 in room)
  **The Question:** "I trained to save as many lives as possible. If I have the resources to save five, and I choose to save one based on a coin flip, haven't I just committed negligence? You're asking me to violate my fundamental duty to minimize mortality."

  **Your Reply:**
  "I understand why it feels like negligence. But triage isn't about minimizing mortality in the abstract; it's about adjudicating claims. When five people claim a resource that can only help one, those five claims are in conflict. If I choose the five, I am treating the one as a means to an end—sacrificing their claim for the aggregate.
  My argument is that at the bedside, I don't represent the population; I represent the trust between medicine and *this* patient. If I tell the one, 'You died because there were more of them,' I am saying their life is worth less because they were outnumbered. That is not a medical judgment; it's a mathematical erasure. A lottery acknowledges that all six had an equal claim, and bad luck, not lower worth, decided the outcome."

  **Honest Note:** *This is soft. Clinicians view "doing the most good" as the definition of ethics. You are asking them to prioritize fairness over outcome. Expect pushback that 'fairness' doesn't comfort the grieving families of the four extra dead.*

  ## Objection 2: The Inconsistency Trap (Likelihood: Medium | Damage: Critical)
  **Who:** Clinical Ethicist (2 in room)
  **The Question:** "You concede we count lives to fund ICU beds (Level 2), but forbid counting them to fill the beds (Level 1). What is the moral magic that happens at the hospital door? If saving five is worth the capital expenditure, why does the arithmetic vanish when the beds are full?"

  **Your Reply:**
  "It's not that the arithmetic vanishes; it's that the *agent* changes. At Level 2, the hospital is a planner allocating risk across a population. It is legitimate to say, 'We fund this wing to save the most lives overall.'
  But at Level 1, the physician is not a planner; they are a fiduciary. Once the resource exists, it is no longer about population risk; it is about specific, competing rights. To carry the Level 2 logic into Level 1 is to treat the patient at the bedside as a statistic from the planning phase. We count for budgets so we don't have to count for bodies. If we count for both, the patient never escapes the calculus."

  **Honest Note:** *This is your weakest junction. You are relying on a distinction between 'planning' and 'acting' that some philosophers reject. If they press on why the fiduciary duty overrides the utilitarian imperative, you may have to concede that this is a deontological commitment, not a consequentialist one.*

  ## Objection 3: The Efficiency Argument (Likelihood: High | Damage: Medium)
  **Who:** Health Economist (1 in room)
  **The Question:** "This is a refusal to face arithmetic. In every other domain of public policy, we accept trade-offs to maximize utility. Why is healthcare sacred? If you reject QALYs and headcounts, you are choosing more death over less death. That is an expensive moral luxury."

  **Your Reply:**
  "It is expensive. But public policy deals in aggregates; medicine deals in individuals. When the state builds a road, it doesn't know who will die in an accident. When I triage, I know exactly who will die.
  To treat the patient as a unit of utility is to deny their status as a person with a unique life to live. You call it a 'refusal to face arithmetic.' I call it a refusal to let arithmetic be the only language of value. We accept trade-offs in policy to prevent the crisis. But once the crisis is here, the trade-off becomes a direct sacrifice of one by another. That requires a different moral grammar."

  **Honest Note:** *The economist will not be satisfied. They view 'moral grammar' as inefficiency. Do not try to win them over on efficiency. Win the room by showing that efficiency has a human cost the economist isn't paying.*

  ## Objection 4: Legal Liability (Likelihood: Medium | Damage: High)
  **Who:** Hospital Counsel (1 in room)
  **The Question:** "Practically, how does this survive review? 'Standard of care' usually implies acting as a reasonable physician would. If every other hospital saves the five, and we lottery the one, are we not exposing the institution to wrongful death suits based on deviation from protocol?"

  **Your Reply:**
  "Current protocols often rely on 'save the most lives' as a shield. But if my argument is correct, that shield is morally hollow. Legally, you defend against negligence by showing due process and non-discrimination. A lottery is the ultimate non-discriminatory process.
  It is harder to defend than 'we saved the most,' I admit. But the alternative is defending a policy that says, 'We killed this person because they were in the minority.' I would rather defend the fairness of the procedure than the morality of the sacrifice. We may need legislative indemnity for crisis standards regardless of the choice, but a lottery is more defensible as equal protection."

  **Honest Note:** *Counsel will likely tell you this is naive. Courts often defer to utilitarian triage in disasters. Be prepared to acknowledge that legal defensibility and moral rightness might diverge here.*

  ## Objection 5: The Meaning of Sacrifice (Likelihood: Low | Damage: Emotional)
  **Who:** Family Representative (1 in room)
  **The Question:** "I've sat with families who lost loved ones. When someone dies so others can live, there is a terrible meaning in that. It's a sacrifice. If you use a lottery, their death is random. It's pointless. Isn't it more respectful to let their death mean something?"

  **Your Reply:**
  "That is a profound point. But meaning cannot be imposed by the triage officer. To say, 'Your death means something because it saved five,' is to co-opt their death for our narrative.
  A lottery admits the tragedy without assigning a value to the life lost. It says, 'You were not less worthy of life; the situation was impossible.' That is a different kind of meaning. It preserves the dignity of the deceased as someone who deserved to live, not as a resource that was spent. We cannot make the death meaningful without making the person instrumental."

  **Honest Note:** *This is emotionally resonant but logically vulnerable. Some families *do* find comfort in utilitarian outcomes. Acknowledge this. Do not claim to know how all families feel.*

  ## Objection 6: The Slippery Slope (Likelihood: Medium | Damage: Medium)
  **Who:** Senior Clinician (1 in room)
  **The Question:** "If numbers don't count, what does? If I have one ventilator and two patients, and one is 20 and one is 80, do we lottery? If you start bracketing out clinical factors to protect the 'individual claim,' where does it stop?"

  **Your Reply:**
  "I am not arguing we bracket clinical factors. Prognosis matters. If the 20-year-old has a 90% chance and the 80-year-old has 10%, the claim is stronger for the 20-year-old based on medical efficacy, not numbers.
  My argument is strictly about the *number of other claimants*. If both have equal prognosis, the 20-year-old doesn't have a stronger claim because there are five other 20-year-olds in the hall. We use medical criteria to assess the strength of the claim. We use a lottery to break ties. We do not use headcounts to override the claim."

  **Honest Note:** *Be careful here. If you allow prognosis (QALYs, life-years), the economist will argue you've already accepted aggregation. Keep the distinction sharp: Prognosis = likelihood of benefit. Headcount = value of the person.*

  ---

  ## Final Advice for the Q&A

  1.  **Watch the Ethicists:** They are the only ones who know the literature (Contractualism vs. Utilitarianism). If they use terms like "aggregation" or "separateness of persons," engage them on that ground. They are your biggest intellectual threat.
  2.  **Don't Fight the Clinicians on Outcomes:** You will lose an argument about "more dead people." Pivot immediately to "how we decide who dies."
  3.  **The "Joint" Defense:** If pressed on the Level 1/Level 2 inconsistency, use the **Fiduciary Analogy**: A financial advisor maximizes a portfolio (Level 2), but cannot steal from Client A to help Client B, even if Client B has more money (Level 1). The doctor's duty is to the patient, not the portfolio.
  4.  **Tone:** Somber. You are advocating for a procedure that results in more deaths. Do not sound enthusiastic about the lottery. Sound like someone who has accepted a heavy burden.

  **If the Dreaded Question comes ("What if it were you?"):**
  Do not hedge. "If I were the one, I would feel betrayed. But my personal feeling doesn't change the rightness of the principle. We design lifeboats for the ship, not for the captain." (This is risky, but honesty is your only currency here).
