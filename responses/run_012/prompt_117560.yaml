what the upgrade requires; (4) your credence that the positional picture together with the long-acquaintance trade is a genuine discovery procedure rather than a convention in disguise, with one line; and (5) your combined credence for the target proposition and how you combined the four terms, if you replaced one of mine say so and use yours, followed by the term the number is most sensitive to, which term the 0.95-versus-0.10 disagreement most likely lives in, and the one piece of evidence or argument that would move the whole number most.
