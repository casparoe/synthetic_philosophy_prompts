  The bookie checks his odds and grins. "Your partition sums to $1 - \epsilon$," he says. "I'm going to Dutch book you."

  He sets up the pump: sells you a bet on the union, buys bets on the disjoint parts.

  "There," says the bookie. "You lose money in every possible world. Your credences are incoherent."

  "True," says the Bayesian. "I lose exactly $\epsilon$."

  "Aha!" says the bookie. "Irrational!"

  "Sure," says the Bayesian, handing him an infinitesimal chip. "But the theorem guarantees a *finite* sure loss. This won't even cover the transaction fees. So technically, you're right about my credences, but you're still paying for the next round."

  Moral: You can prove I'm incoherent, but you can't prove I'm broke.
