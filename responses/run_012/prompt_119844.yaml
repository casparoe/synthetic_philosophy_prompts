  # DECISION TREE: DIAGNOSING FITCH'S PARADOX

  **ROOT:** Consider a truth that is never known. What prevents it from being known?
  ├── **1.** Its nature is independent of any possible evidence or cognitive state.
  │   └── **LEAF A:** The principle is false because some truths are independent of any possible knower.
  │       *Consequence:* We must accept truths that are forever inaccessible to any mind.
  ├── **2.** Its complexity or logical structure exceeds finite capacities, though it is not mind-independent in principle.
  │   └── **LEAF B:** The principle is false, but only because of structural limits on finite knowers.
  │       *Consequence:* Truth outstrips capacity, making verificationism locally false without abandoning anti-realism.
  └── **3.** Nothing prevents it; if it is true, it is in principle knowable. The problem lies in how we reason about 'knowable'.
      └── **NODE 1:** To which propositions does the claim 'every truth is knowable' apply?
          ├── **1.** Only propositions where claiming knowability does not generate paradox.
          │   └── **NODE 2:** What marks the boundary of knowable propositions?
          │       ├── **1.** Propositions containing epistemic terms (like 'known').
          │       │   └── **LEAF C:** The principle stands with its range restricted so that propositions about what is or is not known are excluded.
          │       │       *Consequence:* We must treat truths about knowledge as fundamentally different from ordinary truths.
          │       └── **2.** Propositions whose truth and knowledge are provably incompatible.
          │           └── **LEAF D:** The principle stands with its range restricted to propositions whose being both true and known is not provably contradictory.
          │               *Consequence:* We must exclude truths precisely when knowing them would be contradictory, risking ad hocery.
          └── **2.** All propositions without exception.
              └── **NODE 3:** Does knowing a conjunction require knowing each conjunct?
                  ├── **1.** No, one can know a conjunction without knowing each part (or vice versa).
                  │   └── **LEAF E:** The principle stands and the derivation is valid, but knowledge is not closed under conjunction.
                  │       *Consequence:* We must accept that one can know a conjunction without knowing its parts.
                  └── **2.** Yes, knowledge distributes over conjunction.
                      └── **NODE 4:** Must the possibility of knowledge be evaluated in a single fixed epistemic situation?
                          ├── **1.** No, the epistemic situation shifts when evaluating 'knowable'.
                          │   └── **LEAF G:** The principle stands but 'knowable' is not a normal possibility operator, quantifying instead over possible situations of knowledge, so that the derivation fails by holding the epistemic situation fixed across a conjunction.
                          │       *Consequence:* We must treat 'knowable' as shifting the context of evaluation, complicating logical composition.
                          └── **2.** Yes, the situation remains fixed across the derivation.
                              └── **NODE 5:** Does proving a proposition leads to contradiction establish its falsehood?
                                  ├── **1.** No, it only establishes that we cannot assert it (Intuitionistic).
                                  │   └── **LEAF F:** The principle stands, the derivation is valid as far as it goes, and closure stands, but the final move needs classical negation, so that abandoning double-negation elimination leaves the anti-realist with only the weaker result that no truth can be known to be unknown.
                                  │       *Consequence:* We must abandon the claim that 'p is unknown' is false, settling for 'p is not known to be unknown'.
                                  └── **2.** Yes, contradiction implies falsehood (Classical).
                                      └── **NODE 6:** Given the previous commitments, do you accept the conclusion that every truth is known?
                                          └── **LEAF H:** The conclusion is not absurd — on an idealised or deflationary reading of 'known', every truth's being known is tolerable, and the principle survives with its interest diminished.
                                              *Consequence:* We must accept that every truth is known, diluting 'known' to mean 'ideally verifiable'.

  ***

  ### ANALYSIS OF THE TREE

  **Indistinguishable Leaves:**
  The tree cannot effectively separate **Leaf C** (Epistemic Restriction) and **Leaf D** (Contradiction Restriction). While Node 2 forces a choice of criterion, the extension of the restriction is identical: the Fitch conjunction is both epistemic and contradictory. This failure looks like **one view under two descriptions**, as the motivation for excluding epistemic propositions is usually that they generate contradictions.

  **Unoccupied Combinations:**
  The combination of answering **Yes** to Node 3 (Closure), **Yes** to Node 4 (Fixed Situation), **Yes** to Node 5 (Classical Logic), and **No** to Node 6 (Accept Conclusion) is left unoccupied. This diagnosis is **incoherent**: accepting all premises and logical rules of the derivation while rejecting the conclusion violates Modus Ponens. Students selecting this path have not identified a flaw but asserted a contradiction.

  **Most Sorting Work:**
  The **Root Question** does the most sorting work. It immediately separates metaphysical realists (Leaf A) from structural anti-realists (Leaf B) and logical reformers (Leaves C–H). This distinction determines whether the student attacks the premise of knowability itself or the logic used to derive omniscience, preventing the seminar from collapsing into a single debate about logical technicalities.
