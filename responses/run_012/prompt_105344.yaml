          *   Follow-up: Does this actually argue for *less* spraying in some cases?
      *   *Topic 6: Land Sparing vs. Sharing.*
          *   Draft: How much land should we farm?
          *   Refinement: Intensive farming (less land, more spray) vs. Extensive (more land, more wild insects). Which creates more net suffering?
          *   Follow-up: Does this lead to factory farming of crops?
      *   *Topic 7: Epistemology.*
          *   Draft: How do we know?
          *   Refinement: What evidence would lower the probability of sentience?
          *   Follow-up: Are we just projecting?
      *   *Topic 8: Practical Action.*
          *   Draft: What should farmers do?
          *   Refinement: Monday morning. Replace EIL with MIL? How?
          *   Follow-up: Who calculates the suffering units?
      *   *Topic 9 (Bonus): The "Mercy Killing" Paradox.*
          *   Focus: If spraying is mercy, why stop at the Moral Injury Level? Why not spray preventatively?
          *   Follow-up: Does this collapse into utilitarianism that ignores rights?
      *   *Topic 10 (Bonus): The Moral Status of the Grower.*
          *   Focus: The human cost. If moral injury is high, food prices rise.
          *   Follow-up: Is human hunger less important than insect suffering?

  4.  **Review and Refine against Constraints:**
      *   *Check:* 9-10 questions? Yes.
