      *   *Check:* Specific topics covered? (Neuro, Net-Negative, Pest Category, Gene Drive, Non-target, Land Use, Epistemology, Action). Yes.
      *   *Check:* Tone? Professional, "in the weeds," leveraging host expertise.
      *   *Check:* No reading lists/citations? Yes.
      *   *Check:* No warm-ups? Yes.

  5.  **Polishing the Wording:**
      *   Ensure the entomological terminology is accurate (EIL, action threshold, parasitoids, sublethal, gene drive).
      *   Ensure the philosophical pressure points are clear (non-identity problem, aggregation, uncertainty).
      *   Make sure the follow-ups anticipate the "standard philosopher move" (e.g., appealing to uncertainty or precautionary principle) and push back.

      *(Self-Correction during drafting)*: For Question 2 (Net-Negative), I need to make sure I don't confuse "no field" with "no insects." The point is the *particular* insects in the field wouldn't exist without the crop. This is the Non-Identity Problem. I need to phrase it so she can't just say "wild insects suffer more."
