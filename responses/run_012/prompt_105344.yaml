      *   **Constraints:** No warm-ups, no reading lists, no "do insects matter" basics. Needs to be "in the weeds." Specific topics required (neurobiology, net-negative comparison, pest category arbitrariness, gene drive/mosquitoes, non-target effects, land use/sparing vs. sharing, epistemology/falsifiability, practical action). Needs 1-2 bonus questions on inconsistencies.
      *   **Tone:** Rigorous, skeptical but fair, leveraging the host's entomological expertise without bluffing.

  2.  **Deconstruct the Guest's Argument & Identify Tensions:**
      *   *Tension 1:* Sentience vs. Mechanism. She claims insects suffer, but the host knows insect neurobiology is largely reflexive.
      *   *Tension 2:* Net-Negative Lives vs. Existence. If we don't farm, these insects don't exist. Is a short, miserable life better than non-existence? (Non-Identity Problem).
      *   *Tension 3:* Selective Moral Concern. Why protect pests if they suffer, but release parasitoids (who cause immense suffering) as biocontrol?
      *   *Tension 4:* Industry Alignment. Her view accidentally justifies heavy spraying (mercy killing). Does this undermine the "moral seriousness" she claims?
      *   *Tension 5:* Implementation. How do you calculate a "Moral Injury Level" practically?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Neurobiology of Suffering.*
