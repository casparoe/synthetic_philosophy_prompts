      *   **Specific Questions to Address:**
          *   Does Kant require *answering*, or just not lying (silence, evasion)?
          *   Is this the standard Kantian line, or is Kant out on a limb?
          *   Is the host's universalizability argument actually Kant's argument in *this* essay?
          *   Does the practical conclusion (rat out the friend) follow from the accurate parts or the shaky parts?
      *   **Constraints:** No citations or reading lists. Keep it conversational but rigorous.

  2.  **Deconstruct the Podcast Host's Summary (Mental Outline):**
