      *   *Refining the "Modern Kantians" point:* This is the biggest error in the podcast. I need to emphasize that contemporary Kantianism is much more flexible.
      *   *Refining the "Universalizability" point:* The host is conflating the *Groundwork* (1785) with the *Doctrine of Right* era essay (1797). The 1797 argument is about *imputation* of consequences, not just universalizability.
