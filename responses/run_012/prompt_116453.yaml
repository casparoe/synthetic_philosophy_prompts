prompt: |-
  Hey, I'm a retired geologist who's been mainlining philosophy podcasts on my morning walks, and I've got a question about one of them. The host did an episode on Kant and the murderer at the door, and I want to know how much of his summary I should trust. Here's the gist of what he said, as best I can reconstruct it.

  The setup is a short essay Kant wrote in 1797, replying to Benjamin Constant. Constant had said the duty to tell the truth only binds you toward people who have a right to the truth, and nobody has a right to a truth that would harm them, so you're allowed to lie to the murderer about where your friend is. Kant fires back that this is wrong: truthfulness is an unconditional duty, and you can't carve out exceptions for hard cases. So if the murderer asks you where your friend is hiding, Kant says you've got to tell him. And here's the part the host really loved: Kant says if you lie and your friend, spooked by the noise, bolts out the back door and gets killed, you're on the hook for his death, because your lie caused it. If you'd just told the truth, the murderer might've searched the wrong room and the friend might've gotten away. The host said this is deontology at its most unhinged, and that it's basically been the official Kantian position ever since, modern Kantians all bite the bullet and refuse to lie even to a murderer. He said the reasoning is just the categorical imperative again: if everyone lied to murderers, nobody could trust anyone's word, so lying can't be universalized.

  I'm inclined to agree with the host that this is pretty nuts, but I've learned the hard way that pop-philosophy podcasts flatten things alot, and I don't want to walk around repeating a caricature. So: go through the summary sentence by sentence and tell me what a Kant scholar would accept, what they'd wince at, and what's just wrong. In particular, I'm confused about a few things. Does Kant really say you have to answer the murderer's question at all, or is the duty just not to say something false, could you keep your mouth shut, or lock the door, or yell something that isn't a declaration? And is the host right that this is the standard Kantian line, or is Kant out on a limb here even by his own followers' lights? Also, is the host's universalizability story actually Kant's argument in this essay, or is he importing it from somewhere else? And does the host's practical conclusion, that a good Kantian has to rat out their friend, actually follow from the parts of the summary that are accurate, or does it only follow if you accept the parts that are shaky?

  I don't need citations or a reading list, just tell me where the summary is solid, where it's a simplification, and where it goes off the rails. Thanks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

