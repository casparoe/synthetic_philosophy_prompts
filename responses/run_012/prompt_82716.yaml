      1.  **(2) vs. (7) + (3):** The "Progress Problem." If the engine is neutral (7) and non-rational (3), how do you justify calling the outcome "progress" (2) rather than just "change"? You need (1) to do the work, but (3) severs the link between the engine and (1).
