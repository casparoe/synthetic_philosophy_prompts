      *   (3) Causal Mechanism: Arguments exist early; change happens via honor/shame shifts + power/enforcement capacity.
      *   (4) Epistemic Amnesia: The generation that drops the practice can't argue the case; it becomes "unthinkable"; they claim it was always obvious.
      *   (5) Genetic Fallacy Defense: Provenance (honor/interest) $\neq$ Warrant (truth/justification).
      *   (6) Blame: Defenders to the end are *blameworthy*, not just mistaken/mispositioned.
      *   (7) Direction Neutrality: The mechanism (honor/power) can produce good or bad outcomes (abolition or revival of oppression).

  3.  **Identify Tensions:**

