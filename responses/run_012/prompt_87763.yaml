answer: |-
  This is an excellent worry to have. It means you have stumbled upon one of the most important developments in 20th-century economics: **Ronald Coase's critique of the theory of the firm.**

  In his 1937 paper *"The Nature of the Firm,"* Coase asked the exact question you are asking: If central planning is inefficient because it lacks prices, why do firms exist? Firms are centrally planned islands. They suppress the price mechanism internally and use authority/commands instead.

  If your argument proves that socialism is impossible because it lacks internal markets, it logically proves that General Motors is impossible. Since GM exists, one of your premises must be nuanced.

  Here is the diagnosis of where your argument ties itself in knots, how to fix it, and why you can still keep conclusion (6).

  ### 1. The Weak Link: Premise (3)

  Your premise (3) is currently too absolute:
  > *(3) Prices that reflect genuine opportunity costs only come out of real exchange, where independent owners who carry the consequences of their own choices bid against one another.*

  If you hold this strictly, you must conclude that the internal allocation of resources within Apple or Toyota is "irrational." That is obviously false. Firms allocate capital internally quite effectively.

  **The Fix:** Premise (3) is true for an *economy*, but not for a *sub-unit* of an economy.
  Inside a firm, "prices" (transfer prices) do not emerge from independent bidding. They are accounting tools. However, they can still reflect opportunity costs **derivatively**.

  Why? Because the firm is embedded in a market. The firm buys inputs at market prices and sells outputs at market prices. The internal allocation is disciplined by the **external profit-and-loss test**. If the internal planning is bad, the firm loses money against its competitors and goes bankrupt.

  ### 2. The Structural Difference: Boundary Conditions

  You asked if the difference is scale or structure. It is **structure**, specifically **boundary conditions**.

  *   **The Firm:** A planned island in a market ocean.
      *   It can calculate costs because the *inputs* (steel, labor, electricity) have market prices.
      *   It can calculate value because the *output* (cars) has a market price.
      *   The "rationality" of the internal planning is constantly checked against the external market reality. If the internal transfer price of an engine is too high, the division might look profitable on paper, but the company loses sales to Ford. The market disciplines the plan.
  *   **Lange's Socialism:** A planned ocean with no islands.
      *   There is no external market for capital goods.
      *   There is no external benchmark to check if the Central Planning Board's (CPB) prices are "right."
      *   There is no bankruptcy. If the CPB sets the price of steel too low, there is no competing steel producer to undercut them and reveal the error.

  ### 3. The Missing Element: The Residual Claimant

  Your premise (3) mentions "independent owners who carry the consequences." This is the key to saving the argument.

  *   **In a Firm:** The CEO and Division Managers are agents, but the **Shareholders** are the residual claimants. They bear the risk. If internal allocation fails, *their* equity value drops. This creates a hard budget constraint. The "boss" at the top has a strong incentive to monitor the internal planners because it is *their* money.
  *   **In Lange's Model:** Who is the residual claimant? "Society." But "society" cannot fire the Central Planning Board. The managers are bureaucrats. If they make a mistake in cost minimization, there is no owner losing personal wealth to sound the alarm. The budget constraint is soft.

  ### 4. Rebuilding the Argument

  You can keep conclusion (6), but you need to sharpen the distinction between *internal planning within a market* and *total planning without a market*.

  Here is a revised version of your syllogism that survives the "Firm Objection":

  (1) Allocating resources rationally requires knowing their opportunity costs.
  (2) Opportunity costs are revealed through the discovery procedure of market exchange, culminating in a profit/loss test.
  (3) **Internal planning (like a firm) can only allocate rationally if it is anchored by external market prices and disciplined by a residual claimant who bears the loss.** *(Modified Premise)*
  (4) Under Lange's model, the CPB sets all capital prices; there is no external market for capital goods to anchor these prices, and no private residual claimant to bear the loss of errors. *(Modified Premise)*
  (5) Therefore, Lange's prices are unanchored accounting fictions without a discovery mechanism or disciplinary constraint.
  (6) So Lange's socialism can't allocate rationally, and the calculation problem stands.

  ### 5. Why This Saves Your Seminar Argument

  This revision allows you to concede the point about firms (which makes you look intellectually honest) while delivering a stronger blow to Lange.

  **The "Anchor" Argument:**
  You can tell the seminar: *"Critics often point to firms as counter-examples. But a firm uses prices. It uses market prices for labor, raw materials, and final goods to validate its internal transfer prices. Lange wants to abolish the market that provides the anchor. A compass works inside a ship, but only because the magnetic field exists outside the ship. Lange wants to sail a ship made entirely of compasses with no magnetic field."*

  **The "Discovery" Argument (Hayekian addition):**
  Even if the CPB tries to simulate the market (Lange's "trial and error"), they lack the **incentive to discover**.
  *   **Firm:** An entrepreneur spots a misallocation internally and fixes it to capture profit.
  *   **Lange:** A bureaucrat spots a misallocation. Why fix it? It's extra work, and if they fail, they aren't fired. If they succeed, they don't get the surplus.
  *   **Difference:** The firm utilizes dispersed knowledge driven by *incentive*. The CPB utilizes dispersed knowledge driven by *duty*. Hayek argued the former works and the latter doesn't.

  ### Summary of Advice

  1.  **Don't drop (6).** The Calculation Debate is about the *systemic* ability to calculate, not the *local* ability to manage.
  2.  **Modify (3).** Acknowledge that planning works *within* a market context (firms) but fails as a *total* system (socialism).
  3.  **Emphasize the "Outside".** The firm has an outside (the market) that disciplines it. Socialism claims to *be* the outside, leaving no vantage point for correction.
  4.  **Emphasize the "Owner".** Firms have owners who lose money if planning fails. Socialism has "the people," who cannot practically enforce discipline on the planners.

  Your worry was valid, but it actually gives you a chance to show a deeper understanding of the debate. By addressing the "Firm Objection" head-on, you move from a standard undergraduate recitation of Mises to a graduate-level understanding of Coase and Williamson. Keep the argument, just add the nuance about **boundary conditions**.
