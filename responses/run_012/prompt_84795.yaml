  4.  **Synthesize the Argument (Drafting the Response):**

      *   *Introduction:* Acknowledge the user's sharp reading. The film is often treated as a postmodern celebration of ambiguity, but it dodges the hard ethical questions of the aesthetics unit.
      *   *Point 1: The Corpus and the Art-Historical Record.*
