prompt: |-
  I'm a 3rd-year PhD student in decision theory (econ dept, but I hang out with the phil people), and I'm TAing a master's-level course on choice under uncertainty. The prof asked me to draft one of the questions for the in-class final, and I want it to be about the Allais paradox and the independence axiom, but not the usual state the paradox and say people are risk-averse thing. I need a question that actually forces them to get their hands dirty with the axiom. Something like: give them the classic Allais choice pairs (A = 1M for sure vs B = 89% chance of 1M, 10% chance of 5M, 1% chance of 0; and C = 11% chance of 1M, 89% chance of 0 vs D = 10% chance of 5M, 90% chance of 0), but then ask them to (i) say exactly which axiom the common pattern violates and why, (ii) show why it's not a violation of the sure-thing principle or of transitivity/continuity, and (iii) explain what a defender of expected utility could say without just denying the data. I also want a part where they have to seperate the common consequence version from the common ratio version, because half the class last year thought they were the same thing. I want them to state the independence axiom in the mixture form (if A is weakly preferred to B, then the same mixture of each with C preserves the preference), not just say that adding a common consequence shouldn't matter. Maybe include a small formal bit where they have to show that if someone has the Allais preference, there's no utility function that represents it in the expected utility way, and say where the proof breaks if you drop independence. The question should be doable in about 50 minutes, worth 25 marks.

  Can you write the question itself, a model answer of roughly 700-800 words, and a marking scheme? For the marking scheme, I want five must-hit points with the marks for each, and for each point a one-line note on the mistake that typically costs students the mark. Also, please don't make it depend on them having read any particular paper or knowing any citations -- they can't bring notes and there's no internet. And end with a one-sentence summary of what the question is really testing, on its own line starting with Summary: . Thanks!
