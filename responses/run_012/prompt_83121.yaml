answer: |-
  **Exam Question: The Allais Paradox and Expected Utility**

  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  Consider the following four lotteries over monetary outcomes $\{0, 1M, 5M\}$:
  *   $L_1$: 100% chance of $1M$.
  *   $L_2$: 89% chance of $1M$, 10% chance of $5M$, 1% chance of $0$.
  *   $L_3$: 11% chance of $1M$, 89% chance of $0$.
  *   $L_4$: 10% chance of $5M$, 90% chance of $0$.

  A typical agent exhibits the "Allais Preference": $L_1 \succ L_2$ and $L_4 \succ L_3$.

  (a) State the **Independence Axiom** formally using the mixture space notation (i.e., involving $\alpha \in (0,1)$ and a third lottery $L''$). (5 marks)
  (b) Using the utility function $u(\cdot)$, derive the inequalities implied by the Allais Preference. Show algebraically that no expected utility function can represent these preferences. Identify exactly which step requires the Independence Axiom. (5 marks)
  (c) Explain why this preference pattern does **not** violate Transitivity or Continuity. Briefly distinguish the vNM Independence Axiom from Savage's Sure-Thing Principle. (5 marks)
  (d) The example above is the "Common Consequence" effect. Define the "Common Ratio" effect and explain the structural difference between the two. (5 marks)
  (e) A defender of Expected Utility (EU) theory accepts the data but rejects the conclusion that EU is false. What is the normative argument they might advance? (5 marks)

  ***

  **Model Answer**

  (a) The Independence Axiom states that for any lotteries $L, L', L''$ and any $\alpha \in (0,1)$:
  $$L \succeq L' \iff \alpha L + (1-\alpha)L'' \succeq \alpha L' + (1-\alpha)L''$$
  This asserts that preference ordering between two lotteries remains invariant when both are mixed with a common third lottery in the same proportions.

  (b) Under Expected Utility, $L \succeq L'$ iff $E[u(L)] \geq E[u(L')]$. The Allais Preference implies:
  1.  $u(1M) > 0.89u(1M) + 0.10u(5M) + 0.01u(0)$
  2.  $0.10u(5M) + 0.90u(0) > 0.11u(1M) + 0.89u(0)$

  Rearranging (1): $0.11u(1M) > 0.10u(5M) + 0.01u(0)$.
  Rearranging (2): $0.10u(5M) + 0.01u(0) > 0.11u(1M)$ (subtracting $0.89u(0)$ from both sides).
  Combining these yields $0.11u(1M) > 0.11u(1M)$, a contradiction ($0 > 0$). Thus, no EU function exists. The step allowing us to subtract the common term $0.89u(1M)$ in the first inequality and $0.89u(0)$ in the second relies on Independence. Specifically, $L_1$ and $L_2$ share an 89% chance of $1M$. Independence allows us to cancel this common consequence to compare the remaining 11% components, which correspond to $L_3$ and $L_4$.

  (c) Transitivity requires if $A \succ B$ and $B \succ C$ then $A \succ C$. The Allais pattern involves two separate choice pairs, not a cycle ($L_1 \succ L_2$ and $L_4 \succ L_3$), so Transitivity holds. Continuity requires that if $A \succ B \succ C$, there exists a probability mixture of $A$ and $C$ indifferent to $B$. The Allais preferences can satisfy this locally; the violation is specifically about linearity in probabilities, not the existence of mid-points. Regarding Savage: The vNM Independence Axiom applies to objective probabilities in mixture space. Savage's Sure-Thing Principle applies to subjective states of the world; it requires that if acts agree on a subset of states, preference depends only on where they differ. While logically analogous, they operate in different frameworks (objective risk vs. subjective uncertainty).

  (d) The Common Consequence effect (above) involves adding a shared outcome with fixed probability to two lotteries (e.g., adding 89% chance of $1M$ to $L_3/L_4$ to create $L_1/L_2$). The Common Ratio effect involves scaling down probabilities of all non-zero outcomes by a common factor (e.g., comparing $p$ vs $q$ then comparing $p/2$ vs $q/2$). Structurally, Common Consequence shifts probability mass to a specific shared outcome, while Common Ratio compresses the probability simplex toward the origin (zero outcome), changing the relative odds while maintaining the ratio between non-zero outcomes.

  (e) The EU defender advances a normative, not descriptive, claim. They argue that while humans psychologically violate Independence, rational agents *ought* to satisfy it to avoid dynamic inconsistency or money pumps. If an agent violates Independence, their preferences can be exploited such that they pay to switch from $L_2$ to $L_1$ and then back again in a different frame. Therefore, EU remains the correct theory of rational choice, implying the data reveals a performance error or framing bias rather than a flaw in the normative theory itself.

  ***

  **Marking Scheme**

  1.  **Formal Independence Axiom (5 marks)**
      *   *Requirement:* Correctly states $L \succeq L' \iff \alpha L + (1-\alpha)L'' \succeq \alpha L' + (1-\alpha)L''$.
      *   *Typical Mistake:* Describing it verbally as "common consequences don't matter" without providing the formal mixture notation.

  2.  **Algebraic Contradiction (5 marks)**
      *   *Requirement:* Sets up the two utility inequalities and shows they sum to a logical contradiction (e.g., $X > Y$ and $Y > X$).
      *   *Typical Mistake:* Showing the probabilities don't match but failing to derive the $0 > 0$ contradiction using utility values.

  3.  **Axiom Distinction (5 marks)**
      *   *Requirement:* Notes Transitivity requires cycles (absent here) and distinguishes vNM Independence (objective mixtures) from Savage Sure-Thing (subjective states).
      *   *Typical Mistake:* Claiming Allais violates Transitivity or treating Sure-Thing and Independence as identical definitions.

  4.  **Consequence vs. Ratio (5 marks)**
      *   *Requirement:* Identifies Consequence as adding/shared outcome mass and Ratio as scaling probabilities/odds.
      *   *Typical Mistake:* Describing both as "changing probabilities" without distinguishing shifting mass vs. scaling odds.

  5.  **Normative Defense (5 marks)**
      *   *Requirement:* Argues EU is a normative standard for rationality (avoiding money pumps) rather than a descriptive model of behavior.
      *   *Typical Mistake:* Arguing the data is wrong/experimental error, or suggesting we should just change the utility function.

  Summary: This question tests the student's ability to formally derive the impossibility of Expected Utility under Allais preferences while distinguishing between descriptive violations and normative rationality requirements.
