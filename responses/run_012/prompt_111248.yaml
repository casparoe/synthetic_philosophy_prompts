          2.  **P1 vs. P4 (The Mechanism/Transparency Clash).** FDT relies on modeling; P4 distrusts reliance on modeling.
          3.  **P2 vs. P1 (The Robustness/Correlation Tension).** SPI is stricter than FDT cooperation under uncertainty.
          4.  **P5 vs. Pareto Principles (Symmetry vs. Efficiency).** Asymmetric deals might be needed for PIs.
