prompt: |-
  ok so here's the decision-theory package I've been running with, and I'd like a consistency check before I commit it to a paper. (1) In a one-shot anonymous prisoner's dilemma between two agents that share a decision theory, I think both should cooperate — I'm fully on board with the superrational / functional-decision-theory line. (2) When I hand a game off to a delegate, or write a standing policy into my own behavior, I want the thing it does to be a *safe* Pareto improvement: it should Pareto-improve on the default for every possible specification of the players' payoffs, not just the one I think is most likely, so it doesn't hang on my guess about what the other side actually wants. (3) That said, when I'm fairly confident I've got the other player's payoffs right, I think I should be willing to take a risky Pareto improvement that only counts as an improvement under my best guess. (4) I also think commitments ought to be transparent — an agent shouldn't do something that only helps because the other party happens to model it in some particular way. (5) And two symmetric agents sharing a decision theory should converge on the same action; no arbitrary asymmetry between them.

  Go through these and tell me which pairs are genuinely in tension and how bad, which ones only look like they clash, and for each real tension what the cheapest revision would be and what it would cost me. Rank by severity rather than listing them all as equally bad. And tell me if there's a single change that cleans up the most at once.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Decision-Theory Package:**

      *   **Principle 1 (Superrationality/FDT):** In a one-shot anonymous PD between agents sharing a decision theory, both should cooperate. (Logic: Logical correlation of decisions implies cooperation maximizes expected utility).
      *   **Principle 2 (Safe Pareto Improvement - SPI):** When delegating or setting policy, choose actions that are Pareto improvements *for all possible payoff specifications*, not just the likely ones. (Logic: Robustness against uncertainty about the other's preferences).
      *   **Principle 3 (Risky Pareto Improvement):** When confident about the other's payoffs, accept Pareto improvements that rely on that specific guess. (Logic: Exploiting knowledge to gain more value).
      *   **Principle 4 (Transparency/No Exploitation of Modeling):** Commitments shouldn't rely on the other party modeling you in a specific (potentially wrong) way. Actions should help regardless of specific modeling assumptions. (Logic: Robustness/Truthfulness).
      *   **Principle 5 (Symmetry):** Symmetric agents sharing a decision theory must converge on the same action. (Logic: Consistency/Non-arbitrariness).

  2.  **Initial Scan for Obvious Conflicts:**

      *   *Principle 1 vs. Principle 2:* Principle 1 says "Cooperate in PD." Principle 2 says "Only do things that are Safe Pareto Improvements." In a standard PD, Cooperation is *not* a Pareto improvement over Defection for the individual agent *if the other defects*. However, Principle 1 assumes shared decision theory (logical correlation). If decisions are correlated, (C,C) is Pareto superior to (D,D). But Principle 2 talks about "every possible specification of players' payoffs." If the payoff structure changes (e.g., to a game where cooperation isn't mutually beneficial), does the logic hold?
      *   *Principle 2 vs. Principle 3:* This is the most obvious tension. Principle 2 demands *safety* across *all* payoff specs. Principle 3 explicitly allows *risk* based on a *specific* payoff guess. These are directly contradictory in their conditions for action.
      *   *Principle 1 vs. Principle 5:* These seem aligned. Superrationality usually implies symmetry.
      *   *Principle 4 (Transparency) vs. Principle 1 (FDT):* FDT often relies on the other agent *predicting* your output. If the other agent doesn't model you correctly, FDT might fail to induce cooperation. Principle 4 says commitments shouldn't help *only* because the other models you in a particular way. This sounds like a tension between FDT (which relies on logical subjunctive dependence) and a robustness constraint that sounds more like CDT or a specific subset of FDT.
      *   *Principle 2 (SPI) vs. Principle 1 (FDT in PD):* SPI is usually discussed in the context of bargaining or modifying games. In a fixed PD, "Cooperate" is not a dominant strategy. If I commit to "Cooperate if you share my theory," is that a Safe Pareto Improvement over the default (Defect)? Only if the correlation holds. If the correlation fails, I get suckered. Principle 2 says "for *every* possible specification." If the specification includes the *correlation strength*, then FDT cooperation might violate SPI.

  3.  **Detailed Analysis of Tensions:**

      *   **Tension A: Principle 2 (Safe PI) vs. Principle 3 (Risky PI).**
          *   *Severity:* High. These are mutually exclusive decision rules for the same situation. You can't simultaneously require an action to be safe across *all* payoff specs and also allow actions that are only improvements under a *specific* guess.
          *   *Resolution:* You need a switching condition. "Use Safe PI when uncertainty is high; use Risky PI when confidence is high." But Principle 2 says "I want the thing it does to be a safe PI... so it doesn't hang on my guess." Principle 3 says "I think I should be willing to take a risky PI."
          *   *Cost:* You lose the absolute robustness of Principle 2 or the upside potential of Principle 3. You need a meta-rule for when to switch.

      *   **Tension B: Principle 1 (FDT/Cooperate) vs. Principle 2 (Safe PI).**
          *   *Severity:* Medium-High.
          *   *Why:* In a standard PD, Defection is the dominant strategy. Cooperation is only better if the other cooperates. Principle 1 assumes logical correlation ensures the other cooperates. Principle 2 requires the action to be a Pareto improvement *for every possible specification of payoffs*. Does "specification of payoffs" include the *correlation matrix*?
          *   If "specification of payoffs" implies the game matrix *and* the correlation between agents: Then (C,C) is better than (D,D). But is it better than the default? The default in a one-shot PD is usually (D,D). So (C,C) is a PI.
          *   However, SPI (as defined by Oesterheld et al.) usually involves *modifying the game* or *delegating*. If I simply "Cooperate" in a fixed PD, am I implementing an SPI?
          *   The tension arises if the "possible specifications" include worlds where the other agent *does not* share the decision theory (even if I think they do). Principle 1 says "between two agents that share a decision theory." Principle 2 says "every possible specification." If I am uncertain whether they share the theory, Principle 2 forbids Cooperation (because if they don't, I get suckered), while Principle 1 mandates it (conditional on them sharing it).
          *   *Refinement:* Principle 1 is conditional ("...between two agents that share..."). Principle 2 is about delegation/policy under uncertainty. The conflict is: Do I treat "They share my theory" as a fact (P1) or a uncertainty to be robustified against (P2)?
          *   *Severity:* Moderate. It's mostly a scope issue. P1 applies when the condition is met. P2 applies when delegating under uncertainty.

      *   **Tension C: Principle 4 (Transparency) vs. Principle 1 (FDT).**
          *   *Severity:* Medium.
          *   *Why:* FDT works because the other agent's prediction of you is logically linked to your action. If the other agent *doesn't* model you (or models you as a CDT agent), FDT cooperation might lead to (C,D). Principle 4 says "an agent shouldn't do something that only helps because the other party happens to model it in some particular way."
          *   If I Cooperate because I'm an FDT agent, and that only works because you model me as an FDT agent, does this violate P4? P4 seems to demand that the action be beneficial *regardless* of the modeling. That sounds like Dominance. If I must Cooperate regardless of how you model me, I must Cooperate even if you Defect. That's not rational in a PD.
          *   *Interpretation:* P4 likely means "Don't bluff." Don't make a commitment that only pays off if they believe it, but you would break if they called it. But FDT isn't bluffing; it's actual logical correlation.
          *   *Conflict:* If P4 implies "Action must be optimal even if the other agent doesn't model me correctly," then FDT cooperation violates P4. If P4 means "Don't rely on false beliefs," FDT is okay.
          *   *Severity:* Depends on interpretation of P4. If P4 is "Robustness to opponent's epistemology," it kills FDT.

      *   **Tension D: Principle 2 (Safe PI) vs. Principle 5 (Symmetry).**
          *   *Severity:* Low/Medium.
          *   *Why:* SPIs often require negotiation or asymmetric concessions to find a safe point. If we must be symmetric (P5), we might be restricted to a subset of SPIs.
          *   *Example:* In a bargaining game, a Safe PI might involve me yielding on Issue A and you on Issue B. If we must do the *same* action (P5), we might not find a Safe PI.
          *   *Resolution:* P5 says "same action," not "same payoff." But in symmetric games, same action usually implies symmetric outcomes.
          *   *Severity:* Context-dependent.

  4.  **Ranking and Synthesis:**

      *   **#1 Severity: P2 vs. P3 (Safety vs. Risk).** This is a direct logical contradiction in decision criteria. One says "Never risk it," the other says "Risk it if confident."
      *   **#2 Severity: P1 vs. P4 (FDT vs. Transparency/Robustness).** If P4 is interpreted strictly (action must be good regardless of opponent modeling), it invalidates the mechanism that makes P1 work (logical correlation via modeling).
      *   **#3 Severity: P2 vs. P1 (SPI vs. FDT Cooperation).** SPI is a stronger condition than FDT cooperation. FDT says "Cooperate if correlated." SPI says "Only commit if it's safe across all payoff specs." If there's *any* doubt about correlation, SPI forbids what FDT mandates.
      *   **#4 Severity: P5 vs. P2/P3 (Symmetry vs. Optimization).** Symmetry constraints can block Pareto improvements if the Pareto frontier requires asymmetry.

  5.  **Finding the "Single Change":**

      *   The core conflict is between **Robustness** (P2, P4) and **Optimality/Correlation** (P1, P3).
      *   P2 and P3 are the biggest clash. P2 is extremely demanding ("every possible specification"). This is basically "Maximin" over payoff structures. P3 is "Maximize Expected Utility" given a prior.
      *   To fix P2 vs P3: Adopt a **threshold rule**. Use Safe PI when uncertainty > threshold, Risky PI when uncertainty < threshold.
      *   To fix P1 vs P4: Clarify P4. It should target *deceptive* commitments, not *logical* dependencies.
      *   To fix P1 vs P2: Recognize P2 applies to *delegation/game modification*, P1 applies to *direct play*.
      *   *Best Single Change:* **Refine Principle 2.** Principle 2 is the most restrictive. It demands safety across *all* possible payoff specifications. This is often impossible or leads to paralysis (status quo bias). If you relax P2 to "Safe across all *plausible* specifications" or "Safe across all specifications consistent with common knowledge," it aligns better with P3 (which uses best guesses) and P1 (which assumes shared theory is a fact).
      *   *Alternative Single Change:* **Merge P2 and P3 into a unified "Uncertainty-Weighted Pareto" principle.** This cleans up the biggest contradiction.

