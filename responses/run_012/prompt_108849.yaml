  I run a small haulage firm, so I'm definately not an academic, but I've been working my way through Adam Smith for a couple of years now — mainly the Wealth of Nations — and the bit nobody ever talks about, the colonies and empire stuff, is the bit I keep coming back to. As far as I can tell he thinks the whole colonial setup was a racket: a narrow set of merchants and planters got a legally protected trade, the public paid to conquer and garrison the place, and the country as a whole ended up worse off than if the trade had simply been left open to anyone, with the cost of running the empire swallowing whatever the monopoly actually brought in. He also seems to think the colonists themselves were being treated unjustly, and that if Britain wasn't willing to give them real representation in Parliament then it should just let them go their own way. I've got a feeling I'm mangling the details somewhere, so tell me where.

  Here's what I want. Take Smith's position on empire and colonies and restate it, as faithfully as you can manage, in the vocabulary I actually think in — the words I pick up from business pages and policy podcasts: monopoly rents, regulatory capture, rent-seeking, deadweight loss, opportunity cost, sunk cost, principal-agent problems, cartels, the gap between what's good for a particular firm and what's good for the industry as a whole. Don't just do the easy bits, put the entire case through that mill, including the parts that look like they won't fit. Then give me the residue report: what survives the translation with nothing lost, what only comes through if you fudge it, and what has no counterpart in my vocabulary at all. I'm most curious about the moral half of his argument — the colonists being wronged, the merchants having got their hands on the legislature and using it for themselves — because I suspect that 'regulatory capture' might already cover all of it and the rest is just period rhetoric, but I'd like to be told either way, and whether whatever's left over is a hole in how I think about this kind of thing or a sign that Smith was being vaguer than he looks.

  Write it in British English please, and finish with one line in exactly this form: \answer{...} where the dots are a short phrase naming the single biggest thing in Smith's case that doesn't survive the translation.
