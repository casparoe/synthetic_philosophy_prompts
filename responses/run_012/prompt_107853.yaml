  2.  **Analyze the Six Commitments:**
      *   (1) **EU Maximization (Normative):** Rationality *just is* EU maximization. Preferences not representable by EU are irrational. (Strong claim: EU is necessary and sufficient for rationality).
      *   (2) **Principle of Indifference (POI) / Evidentialism:** Credences match evidence. No evidence $\rightarrow$ equal credence. Specifically applied to Ellsberg Urn 2 (50/50 credence for Red/Black).
      *   (3) **Ellsberg Preferences:** Prefer Urn 1 (Known 50/50) over Urn 2 (Unknown mixture) for Red. Prefer Urn 1 over Urn 2 for Black. Willing to pay to switch Urn 2 ticket to Urn 1 ticket. (This implies $P(R_1) > P(R_2)$ and $P(B_1) > P(B_2)$ behaviorally, or non-additive weights).
      *   (4) **Defensibility of (3):** These preferences are *rational* (not a mistake). They respond to a real difference (ambiguity vs. risk).
      *   (5) **Not Ambiguity Averse *per se* / Risk Sensitivity:** Willing to bet on Urn 2 at good odds (3:1). Prefers 60% known risk to 50% known risk. Indifferent between Urn 1 and Urn 3 (Compound risk resolving to 50/50). Prefers Urn 1 & 3 to Urn 2. (This clarifies that the aversion is specific to the *unknown distribution* of Urn 2, not variance or compound risk generally).
      *   (6) **Dynamic Consistency:** Plans made now should hold later if no new info. Resolution of uncertainty in stages shouldn't change willingness to act (Consequentialism/Separability).

  3.  **Initial Consistency Check (The "Gut Check"):**
      *   (1) says Rationality = EU.
      *   (3) describes Ellsberg preferences.
      *   Standard Decision Theory (Savage/Anscombe-Aumann) says Ellsberg preferences violate EU (specifically the Sure Thing Principle / Additivity of Probability).
      *   (2) says Credences in Urn 2 are 0.5/0.5.
