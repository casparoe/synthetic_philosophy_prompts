answer: |-
  **Question 1** (25 Marks)
  **Suggested Time:** 45 Minutes

  Benatar's Asymmetry is typically formulated via four claims regarding existence (X) and non-existence (~X):
  1. The presence of pain is bad.
  2. The presence of pleasure is good.
  3. The absence of pain is good, even if that good is enjoyed by no one.
  4. The absence of pleasure is not bad, unless there is somebody who is deprived of it.

  From this, Benatar concludes that coming into existence is always a harm. A common objection (the "Subject Critique") argues that claim (3) covertly posits a subject for whom the absence of pain is good, while claim (4) denies a subject for whom the absence of pleasure is bad, thereby rigging the comparison by shifting the implicit subject between clauses.

  Write an essay that:
  (a) Precisely states how the Subject Critique attempts to dissolve the Asymmetry.
  (b) Evaluates whether Benatar can defend the Asymmetry by appealing to impersonal value rather than person-affecting value.
  (c) Applies this distinction to the difference between a life worth *starting* versus a life worth *continuing*, specifically regarding a life that is net positive but only mildly so.
  (d) Concludes by determining whether the Asymmetry, even if accepted as axiologically sound, necessarily generates a deontic duty not to procreate.

  ***

  **Model Answer**

  The Subject Critique argues that Benatar's Asymmetry is inconsistent because it equivocations on the necessary conditions for value. In claim (3), the absence of pain is deemed "good" despite there being no subject to experience that good. In claim (4), the absence of pleasure is deemed "not bad" precisely because there is no subject to be deprived. The critic argues this is gerrymandering: if we require a subject for pleasure to matter, we should require a subject for pain to matter. If the absence of pain is good without a subject, the absence of pleasure should be bad without a subject. By switching criteria, Benatar ensures non-existence always wins.

  Benatar's defense rests on distinguishing between personal goods and impersonal goods. He can concede that value usually requires a subject (person-affecting view) but argue that the absence of pain is a unique case of impersonal value. It is not good *for* anyone, but it is simply good that suffering is avoided. Conversely, the absence of pleasure is not bad because there is no one to suffer the loss. This avoids the gerrymandering charge by maintaining a consistent metaphysical stance: badness requires a sufferer; goodness (in the specific case of avoided harm) does not require a beneficiary. The asymmetry survives if one accepts that preventing harm has independent weight that providing benefit lacks.

  However, accepting this axiology creates a divergence between lives worth starting and lives worth continuing. Consider a life that is net positive but mildly so (e.g., modest pleasure, minimal pain). For an existing person, the asymmetry does not apply; both pain and pleasure count toward the value of continuing existence. Since the life is net positive, it is worth continuing. Yet, for a potential person, the Asymmetry applies. The modest pleasure they would gain counts for nothing (absence of pleasure is not bad), but the minimal pain they would suffer counts heavily (absence of pain is good). Thus, the Asymmetry implies a life can be worth continuing once started, but not worth starting initially. This creates a moral landscape where existence is a trap: once here, you matter; before here, your potential happiness is irrelevant against your potential pain.

  This leads to the final distinction between axiology and deontology. Even if we accept the axiological claim that non-existence is better than existence (because the good of avoided pain outweighs the good of gained pleasure), it does not automatically follow that there is a duty not to procreate. Axiology concerns what is good; deontology concerns what is obligatory. To move from "non-existence is better" to "you must not procreate" requires a separate premise: that agents are obligated to bring about the state of affairs that is axiologically superior.

  One might argue that if coming into existence is always a harm, procreation is akin to inflicting harm. But if the "harm" is merely the forfeiture of an impersonal good (the absence of pain) rather than a setback to interests (since there are no pre-existing interests), the duty is weaker. Therefore, the Asymmetry alone establishes only that non-existence is preferable in value. It does not establish a duty unless coupled with a demanding principle of beneficence that requires maximizing impersonal goods over personal liberties. Without that extra premise, the Asymmetry remains a theory of value, not a prohibition on action. Students who conflate the claim that existence is less valuable with the claim that procreation is forbidden fail to notice this logical gap.

  ***

  **Marking Scheme** (Total 25 Marks)

  1.  **Articulation of the Subject Critique (5 Marks)**
      *   *Must hit:* Clearly explains that the critique alleges an inconsistency in requiring a subject for pleasure/deprivation but not for pain/avoidance.
      *   *Typical Blow:* Student merely restates the Asymmetry without explaining *why* the shifting subject is a problem.

  2.  **Impersonal vs. Person-Affecting Defense (5 Marks)**
      *   *Must hit:* Identifies that Benatar's rescue move is claiming avoided pain is an impersonal good, not a good *for* a subject.
      *   *Typical Blow:* Student argues Benatar denies the critique without explaining the metaphysical mechanism (impersonal value).

  3.  **Starting vs. Continuing Distinction (5 Marks)**
      *   *Must hit:* Notes that the Asymmetry applies only to coming into existence, not continuing it, allowing a life to be worth continuing but not starting.
      *   *Typical Blow:* Student assumes if a life isn't worth starting, it isn't worth living (collapsing the distinction).

  4.  **Axiology vs. Deontology Separation (5 Marks)**
      *   *Must hit:* Explicitly distinguishes between value claims (what is better) and duty claims (what must be done).
      *   *Typical Blow:* Student assumes "better state of affairs" automatically equals "moral obligation to create that state."

  5.  **The Extra Premise Requirement (5 Marks)**
      *   *Must hit:* Identifies that a separate principle (e.g., demanding beneficence) is needed to bridge the gap from value to duty.
      *   *Typical Blow:* Student concludes the Asymmetry proves anti-natalism without acknowledging the missing normative bridge.

  **Note on Grading:**
  A B+ answer will correctly explain the Asymmetry and the Subject Critique but will slide seamlessly from "non-existence is better" to "procreation is wrong." An A answer will pause at that gap, recognizing that value does not entail obligation without a further normative premise, and will clearly separate the status of the potential person from the existing person.
