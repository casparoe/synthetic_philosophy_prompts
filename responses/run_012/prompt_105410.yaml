answer: |-
  You're right to press on the circularity charge, because it's the most serious methodological worry we face. If we assume a model of tradition that says communities always invent stories to serve their theology, then any story serving theology is suspect, and any story contradicting it is historical—but that just begs the question of whether the community *actually* behaved that way. However, the criteria aren't meant to be deductive proofs that operate in a vacuum; they are probabilistic filters based on general observations of how human groups remember founders. We know from sociology and oral history that movements tend to smooth over awkward details, align their founder's words with their later practices, and suppress memories that undermine their authority. When we apply the criterion of embarrassment, we aren't presupposing a specific theological outcome; we're applying a general rule about human behavior: people don't typically invent costly signals unless they are constrained by a prior reality they cannot erase.

  Take the baptism of Jesus by John. You ask why a later community couldn't manufacture that awkwardness to win an argument with Baptist followers. They could, in principle, but we have to ask what the more likely scenario is given the costs. If the early church wanted to subordinate John, the easiest path is to omit the baptism entirely or depict John explicitly acknowledging Jesus' superiority during the act. Instead, we have a narrative where Jesus submits to a ritual of repentance—a ritual he supposedly didn't need—without any immediate textual neutralization in the earliest layers. The criterion bites here not because invention is impossible, but because invention is inefficient. Why create a liability when you could simply silence the rival tradition? The presence of the liability suggests the evangelists were handling a memory too entrenched to remove, even if it was theologically inconvenient. That doesn't guarantee historicity, but it shifts the probability significantly in favor of it.

  As for the charge that our reconstruction is simply the story we needed in advance, I'd argue the opposite: the criteria are designed specifically to frustrate our preconceptions. If I start with a theological commitment to Jesus' divinity, the criterion of dissimilarity should force me to acknowledge sayings or actions that don't fit that mold—things that look too human, too Jewish, or too ambiguous. The model of tradition isn't assumed; it's tested against the texture of the material. When we see jagged edges, inconsistencies, and details that serve no obvious kerygmatic purpose, that's the data resisting our smoothing mechanisms. We aren't building a Jesus who fits our model; we are stripping away the layers that fit too perfectly until we reach the core that refuses to conform. The question isn't whether we can be certain—we can't—but whether disciplined inference gets us closer to the historical figure than sheer skepticism or uncritical acceptance. And on that count, the toolkit remains our best leverage.
