      *   If Continue: 0.5(10) + 0.5(5) [Exit at 3] = 7.5.
      *   Wait, the paradox is usually that Ex-Ante says Continue/Exit, but Ex-Interim says Exit immediately.
      *   Standard Payoffs: Exit 1 (0), Exit 2 (4), Exit 3 (1).
      *   Plan: Continue, Exit. Value = 4.
      *   At Intersection: Probabilities shift.
      *   Let's stick to the User's requested payoff structure idea but simplify numbers.
      *   Exit 1: 0. Exit 2: 10. Exit 3: 2.
      *   This makes the temptation to Exit early high if you think you might be at 2.

  14. **Commitment Device:**
