  2. In the second round, inspectors must negotiate a single explicit formula among themselves which the rule-follower is then instructed to adopt, demonstrating that normative force arises from communal stipulation rather than private mental states. This shift forces the group to realize that their confidence in the first round relied on an unexamined assumption of shared understanding rather than logical necessity.
  3. Assign +1 point for correct predictions and -1 for incorrect ones, totaling scores individually in round one and collectively in round two. Allocate 20 minutes for each round of querying and betting, followed by a 20-minute debriefing session.
  4. Expect students to suspect trickery immediately or to choose test cases too similar to the training set, which you must handle by enforcing strict input diversity rules and assuring them the game is philosophical not deceptive. If the group fails to converge on a rule in round two, intervene by suggesting they write down the rule explicitly to reveal ambiguities in their natural language descriptions.
  5. Conclude by mapping the finite sample underdetermination to the paradox, explicitly stating that the activity cannot reproduce the lack of a metaphysical fact of the matter about what was meant, which you must supply via lecture. Emphasize that while the game shows agreement fixes correctness, it cannot show that there is no inner fact that *could* have fixed it, requiring you to articulate the skeptical hypothesis separately.
