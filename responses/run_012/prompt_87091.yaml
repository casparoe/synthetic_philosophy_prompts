      *   **Specific Focus:** The proposition "p, but nobody knows that p."
      *   **Pedagogical Strategy:** Students have already covered Moore's Paradox. The seminar culminates in an exercise where students generate examples of unknowable truths in three categories: Remote Past, Other Minds, Distant Future.
      *   **Task:** Help frame the explanation of why "p, but nobody knows that p" is unknowable, and how to bridge that to the three specific categories so students understand *which* truths are unknowable.

  2.  **Deconstruct the Philosophical Content:**
      *   *Fitch's Argument:* Usually presented as a *reductio* against Verificationism (if all truths are knowable, then all truths are known).
