  7.  **Final Polish:** Check against the "no library" constraint. Ensure the distinction between *mask*, *fink*, and *mimic* is clear in the context of the answer (even if not explicitly labeled as a vocabulary lesson). Ensure the tone is conversational but rigorous. (The user is smart, just new to this specific philosophical niche).

      *   *Key Insight to convey:* The philosophical puzzle arises from trying to define dispositions *solely* by counterfactual conditionals ("If X, then Y"). The solution is to anchor them in *categorical bases* (microstructure). The scientist already knows this; the philosopher is just realizing they need it.

