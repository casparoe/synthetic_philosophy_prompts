answer: |-
  # Population Axiology Classification Tree

  **1. Comparability of Different Psychologies**
  *Case: Two populations contain beings with psychologies so different that it is unclear whether their welfare levels are comparable.*
  *   **No:** We cannot rank these populations; some comparisons are on a par or incomparable. → **Leaf: Incomparability View**
  *   **Yes:** We can rank them. → *Go to 2.*

  **2. Scope of Moral Concern**
  *Case: Choosing between outcomes whose members are entirely different people, or where an added life leaves existing people slightly worse off.*
  *   **Narrow:** We count only effects on people who would exist in *both* outcomes. → **Leaf: Narrow Person-Affecting View**
  *   **Wide:** We count effects on people who exist in *only one* outcome. → *Go to 3.*

  **3. Value of Existence**
  *Case: An added life is worth living to the person living it but benefits no one else.*
  *   **Neutral:** Bringing a life into existence is never itself a benefit (though it may be a harm). → **Leaf: Asymmetry View**
  *   **Beneficial:** Existence can be a benefit contributing to overall value. → *Go to 4.*

  **4. Intrinsic Value of Number/Variety**
  *Question: Is the sheer number of lives, or the variety of lives, a good in its own right **over and above** the welfare contained in them?*
  *   **Yes:** Value = Welfare + Intrinsic Number Bonus. → **Leaf: Unoccupied** *(Unattractive: Risks double-counting welfare and number; no standard named view adopts this purely.)*
  *   **No:** Value is determined solely by the welfare properties of the lives. → *Go to 5.*

  **5. Mere Addition**
  *Case: One outcome contains everyone in the other plus a further group with positive but low welfare (affecting no one else).*
  *   **Resistant:** The new outcome is *not strictly better* (it may be equal or incomparable). → **Leaf: Wider Person-Affecting View**
  *   **Accepting:** The new outcome is strictly better. → *Go to 6.*

  **6. Context Dependence of Value**
  *Question: Is the value contributed by a life fixed solely by that life's welfare, or does it depend on the rest of the population (relative standing, thresholds, or size)?*
  *   **Fixed:** A life's value contribution is independent of population context. → *Go to 7.*
  *   **Dependent:** A life's value contribution changes based on population context. → *Go to 8.*

  **7. The Repugnant Conclusion (Fixed Value Path)**
  *Case: A small, very well-off population vs. an astronomically larger population whose lives are only barely worth living.*
  *   **Reject:** The small population is better. → **Leaf: Unoccupied** *(Incoherent: If value per life is fixed and positive, enough lives must outweigh a few.)*
  *   **Accept:** The large population is better. → **Leaf: Totalism**

  **8. Scaling and Distribution (Context Dependent Path)**
  *Case: Choosing between a population and an exact replica of it (double the size, same welfare distribution).*
  *   **Neutral:** The replica is equally good (value depends on average welfare). → **Leaf: Average View**
  *   **Positive:** The replica is better (value depends on sum/modified sum). → *Go to 9.*

  **9. Mechanism of Context Dependence**
  *Question: When adding lives to a large population, does the value depend on crossing a **fixed welfare threshold**, or on the **size of the population** itself?*
  *   **Threshold:** Lives count only (or primarily) if above a positive welfare level. → **Leaf: Critical-Level View**
  *   **Size:** The weight given to adding lives falls as the population grows. → **Leaf: Variable-Value View**

  ***

  ### Note on Structure and Indistinguishability

  **Substantive Assumptions:**
  1.  **Welfarism:** Node 4 assumes the "Intrinsic Number" view is distinct from standard welfarist axiologies. By routing "Yes" to *Unoccupied*, the tree assumes the required leaves are fundamentally welfare-based.
  2.  **Transitivity:** Node 5 assumes the *Wider Person-Affecting View* resolves the Mere Addition paradox by denying strict betterness rather than accepting intransitivity.
  3.  **Fixed Value Implies Totalism:** Node 7 assumes that if value per life is context-independent and positive, one *must* accept the Repugnant Conclusion. This encodes the logical link between fixed additivity and totalism.

  **Indistinguishable Leaves (Critical-Level vs. Variable-Value):**
  Given the specific cases provided in the nodes above (Repugnant Conclusion, Mere Addition, Scaling), **Critical-Level** and **Variable-Value** views often yield identical rankings. Node 9 attempts to separate them by asking about the *mechanism* (threshold vs. size), but a reader might find these mechanisms produce the same verdicts on the provided cases.
  *   **Further Case Needed:** To genuinely distinguish them, one needs a **"Sadistic Conclusion"** case: a choice between adding a large number of lives with *very low positive* welfare vs. adding a smaller number of lives with *negative* welfare. Critical-Level views may prefer the negative welfare lives (to avoid adding lives below the critical level), whereas Variable-Value views typically will not. Without this case, these leaves are functionally indistinguishable in this tree.
