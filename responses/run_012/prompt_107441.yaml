  Hey, I could use your help untangling something about acausal threats and surrogate goals. You're a decision theorist who's spent alot of time in the acausal / functional-decision-theory weeds, so please think carefully and maybe start by brainstorming the key distinctions before you give me a straight answer.

  Here's my confusion. My understanding is that a surrogate goal is basically a decoy goal that an AI adopts so that blackmailers will threaten that instead of the AI's real goal. But if it's just a decoy—something the AI doesn't actually care about—then when some acausal threatener credibly threatens to simulate and torture the AI unless it does X, the AI should just shrug and ignore the threat, because the threat is aimed at a goal it doesn't really have. That seems like the whole point: the surrogate makes you immune to threats. But I've also seen people say surrogate goals can make an agent more responsive to threats, or that they're supposed to absorb threats, which sounds like the opposite. So which is it? Is a surrogate goal just a fake target you can safely ignore, or is there something else going on? I feel like I'm definately missing a distinction between pretending to have a goal and actually having a goal here.

  Could you explain what a surrogate goal is actually supposed to do in an acausal-threat scenario, and whether my just-ignore-it instinct is right or wrong? Thanks!
