      *   *The "Values" Problem:* The user noted Seldon sets the metric. I need to emphasize that this validates the seminar's worry #3. Futarchy claims to separate values/beliefs, but Asimov shows that if you fix the belief mechanism (Psychohistory), you *must* fix the values externally, which is authoritarian.
