answer: |-
  **Project Title:** The Rigged Pattern: Agency, Compression, and the Cost of Prediction

  **The Core Question**
  Is the "reality" of an intentional pattern a fact about the system's internal complexity, or is it solely a measure of the observer's predictive leverage?

  **The Problem**
  Daniel Dennett's "Real Patterns" argument suggests that beliefs and desires are real if treating a system as an agent (the Intentional Stance) offers better predictive compression than the Physical or Design stances. As a novelist, I manufacture this compression. I engineer characters so that their beliefs and desires are the *most efficient* way to predict their actions. If I can rig the system to make the Intentional Stance pay off, does that prove the pattern is real? Or does it prove that "reality" is just a measure of how well I've hidden the strings?

  Current philosophy tends to bifurcate: either agency is a biological brute fact (Realism), or it's just a useful tool for the observer (Instrumentalism). Both fail to account for the *gradient* of agency found in artifacts I create. I need to know if the "work" required to maintain the stance distinguishes a person from a character.

  **The Method: Comparative Case Study**
  I will apply the Intentional Stance to six distinct systems, measuring two variables: **Predictive Accuracy** (how often the belief/desire model predicts the outcome) and **Explanatory Cost** (how much cognitive work is required to maintain the model).

  1.  **The Thermostat:** (Baseline). Physical stance is cheaper. Intentional stance is possible but inefficient.
  2.  **The Chess Engine:** (Deterministic). Design stance is perfect. Intentional stance is a useful shorthand for humans.
  3.  **The LLM:** (Probabilistic). Intentional stance feels natural but breaks down under scrutiny (hallucination).
  4.  **The Improv Scene:** (Constrained). Rules exist, but outcomes are emergent between agents.
  5.  **The Real Person:** (Opaque). High cost to model, high reward, frequent prediction errors.
  6.  **The Novel Character:** (Rigged). High accuracy, low cost (for the author), zero opacity.

  **The Procedure (Month-by-Month)**

  *   **Months 1–3: Calibration & Drafting.**
      *   Write a 50-page novella draft featuring a single protagonist.
      *   Keep a "Prediction Log" for the protagonist: Before writing each scene, record what the character *should* do based on their established beliefs/desires.
      *   Simultaneously, log interactions with one specific real person (with consent) and one LLM session, recording predictions vs. outcomes.
  *   **Months 4–6: The Stress Test.**
      *   Introduce a "perturbation" to all systems.
      *   *Novel:* Force the character into a situation contrary to their design. Measure how much rewriting is required to make them coherent again.
      *   *Improv:* Participate in a workshop; measure the lag time before a partner's action becomes intelligible as intentional.
      *   *LLM/Chess:* Push the systems to the edge of their training/parameters.
      *   *Real Person:* Note instances where their behavior forces you to abandon your model of them entirely.
  *   **Months 7–9: Analysis of Compression.**
      *   Calculate the "Compression Ratio" for each case: (Length of Physical/Design description) ÷ (Length of Intentional description).
      *   Crucially, factor in the *cost of error*. When the Intentional Stance fails, how much work is required to fix it? (e.g., In a novel, I change the text. In life, I change my mind about the person).
  *   **Months 10–12: Synthesis.**
      *   Draft the philosophical argument.
      *   Determine if the "reality" of the pattern correlates with the *resistance* the system offers to the stance.

  **Why the Obvious Answers Fail**
  *   **The Realist Answer:** "People are real, characters aren't." This ignores that we often understand people better than we understand ourselves, and that brain-damaged patients may offer less predictive purchase than a well-written character. It relies on a metaphysical boundary this project aims to test.
  *   **The Instrumentalist Answer:** "It's all just tools." This collapses the distinction between a thermostat and a spouse. If utility is the only metric, a well-rigged novel character is *more* real than a moody teenager. This contradicts our lived experience of *surprise*.

  **What a Result Looks Like**
  A determinate answer will take the form of a threshold condition.
  *   *Hypothesis:* A pattern counts as "ontologically robust" (real agency) only when the system resists the Intentional Stance enough to generate *unscripted* prediction errors that force the observer to update their model.
  *   *Positive Result:* I demonstrate that "reality" is not about predictive success (which can be rigged), but about the *cost of model revision*. A character is "less real" because when they break the pattern, I edit them. A person is "more real" because when they break the pattern, I must edit *me*.
  *   *Negative Result:* If the cost of revision turns out to be identical across cases (e.g., I change my mind about a person as easily as I delete a paragraph), then Dennett is right: reality is purely stance-relative, and the "feeling" of human depth is an illusion.

  **Failure Conditions**
  This project fails if:
  1.  **Metric Collapse:** I cannot quantify "Explanatory Cost" in a way that distinguishes the cases. If "work" is too subjective to compare between writing a scene and talking to a spouse, the method is useless.
  2.  **Circularity:** I define "resistance" in a way that presupposes the conclusion (e.g., defining resistance as "biological opacity").
  3.  **Vague Agnosticism:** The final output concludes "It's complicated." The fellowship requires a thesis, not a meditation. If I cannot isolate the variable that separates the Rigged Pattern from the Emergent Pattern, the inquiry has not advanced.

  **Deliverable**
  A 15,000-word philosophical essay accompanied by the annotated novella draft, serving as the data set for the argument. The essay will argue that the "Real" in Real Patterns refers not to the pattern's predictive power, but to the *friction* encountered when applying it.
