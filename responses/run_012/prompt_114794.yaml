      *   *The Test:* Apply the Intentional Stance to all. Measure "Compression Ratio" (how much simpler is the belief/desire explanation vs. the physical/design explanation?) and "Prediction Error" (how often does it fail?).

  4.  **Drafting the Proposal Sections:**

      *   **Title:** Needs to sound academic but creative. "The Rigged Stance." "Fictional Agency." Let's go with "The Compression of Agency."
