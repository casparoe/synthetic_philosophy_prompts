prompt: |-
  I'm a novelist and I've got a fellowship application due -- one of those writer-in-residence setups where they let you do actual research for a year -- and I want to use it for a short philosophy proposal about something thats been bugging me for ages. Dennett's picture of the three stances: you can predict a system through its physics, through its design, or by treating it as an agent with beliefs and desires, and a pattern counts as real when the intentional description compresses the behaviour better than the alternatives and actually lets you predict it. Fine. But I make my living off that stance working. I build characters whose behaviour the reader can forecast, and the whole book is engineered so the intentional stance pays off -- a success that's rigged like that doesn't feel like it should count as evidence, and I can't tell whether that's a genuine problem for the criterion or whether I'm just muddled about what "real" is doing there. Turn this into a proposal built around one question with a determinate answer, something like: is the reality of a pattern a fact about the system, or a fact about the stance and the payoff it buys? Then give me the method -- which cases to line up against each other (a character in a novel, an improv scene with no script anywhere, an actual person, a thermostat, a chess engine, one of these chatbots), what I'd actually do with them month by month, why the obvious answers on both sides don't settle it, what a result would even look like, and what would count as the project failing. I'd rather have a small honest project than a big vague one. Dont worry about citations, I'll fill those in myself.
