          *   Q3: The Analysis (Applying the stances).
          *   Q4: Synthesis & Drafting.
      *   **Why Obvious Answers Fail:**
          *   *Realist:* "People are real, rocks aren't." (Ignores that LLMs pass the test too).
          *   *Instrumentalist:* "It's all just tools." (Ignores the felt difference between a person and a character).
      *   **Success/Failure:**
          *   *Success:* A metric or threshold where the "work" shifts from system to observer.
          *   *Failure:* Ambiguity remains total; no distinction found between rigged and emergent patterns.

