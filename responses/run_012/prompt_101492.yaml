answer: |-
  Here is the specification you requested. I must begin with a caveat that functions as a thesis statement: **There is no neutral specification.** The "separateness of persons" is not a procedural bug in utilitarianism that a sufficiently clever aggregation rule can fix; it is a substantive moral claim that competes with the utilitarian first principle. To demand that a theory "respect" separateness is already to demand that it cease being purely aggregative.

  However, for the purpose of your reading group, I have drafted the specification as though it were a set of technical constraints. I have marked which requirements are genuinely non-negotiable (logical preconditions for the distinction to exist at all) and which are substantive moral commitments disguised as constraints. This distinction is where the real argument lies.

  ### The Specification of Adequacy

  To answer the complaint that a moral theory treats society as a single super-person, an account of interpersonal aggregation must satisfy the following five requirements.

  #### 1. The Compensation Constraint
  *   **The Case:** Person A is killed to harvest organs that save Persons B, C, and D. The total welfare increases.
  *   **The Requirement:** A loss incurred by one person cannot be morally canceled by a gain bestowed upon a *different* person. Compensation must be recipient-specific. If A loses, A must be the one who gains the offsetting benefit.
  *   **Why a Requirement:** Without this, the boundary between persons is morally porous. If B's gain cancels A's loss, A and B are functionally containers in a single pool of value, which is the definition of the super-person the objection rejects.
  *   **What It Rules Out:** Classical and average utilitarianism; prioritarianism; any view that allows "social compensation."
  *   **Status:** **Non-negotiable** for the objection, but **Partisan** overall. (Utilitarians deny this is a requirement; they argue morality *is* about the pool of value).

  #### 2. The Intrapersonal/Interpersonal Disanalogy Constraint
  *   **The Case:** I endure a headache now to avoid a migraine later (rational). The state imposes a headache on A to avoid a migraine for B (allegedly irrational/immoral).
  *   **The Requirement:** The theory must provide a principled reason why aggregation is permissible within a single life but restricted across lives. It cannot simply assert the difference; it must ground it in the structure of agency or identity.
  *   **Why a Requirement:** The utilitarian argument relies on extending the rationality of prudence (intralife trade-offs) to justice (interlife trade-offs). To answer the complaint, one must break this analogy.
  *   **What It Rules Out:** Theories that treat personal identity as a fiction (e.g., Humean bundle theories applied to ethics) or that treat the "social good" as identical in structure to "individual good."
  *   **Status:** **Non-negotiable.** If a theory cannot distinguish these, it has not answered the objection; it has denied the premise.

  #### 3. The Threshold of Aggregation Constraint
  *   **The Case:** A million people suffer minor headaches. One person faces death. Can the million headaches aggregate to outweigh the one death?
  *   **The Requirement:** There must be a limit to how many trivial claims can aggregate to override a vital claim. At some point, the magnitude of the loss to the one creates a barrier that numbers cannot breach.
  *   **Why a Requirement:** If trivial gains can always aggregate to outweigh vital losses, the distinctness of the person facing the vital loss is erased; they become a slave to the accumulation of minor preferences elsewhere.
  *   **What It Rules Out:** Pure summative consequentialism; unrestricted prioritarianism.
  *   **Status:** **Partisan.** (Many moderates accept aggregation; only those who posit "lexical priorities" or "rights as side-constraints" demand this).

  #### 4. The Doing/Allowing Distinction (The Agency Constraint)
  *   **The Case:** Diverting a trolley to kill one to save five (doing) vs. letting five die to save one (allowing).
  *   **The Requirement:** The theory must distinguish between harming someone (violating their claim not to be used) and merely failing to benefit them (failing to honor a claim to aid). Aggregation applies differently to these two categories.
  *   **Why a Requirement:** The separateness of persons is most vividly violated when a person is *used* as a means. Merely affecting someone's outcome is different from appropriating their status for the greater good.
  *   **What It Rules Out:** Pure consequentialism (which treats acts and omissions as morally equivalent given identical outcomes).
  *   **Status:** **Partisan.** (Consequentialists argue the distinction is morally irrelevant; the objection assumes it is fundamental).

  #### 5. The Outweighed/Overridden Distinction
  *   **The Case:** A promise is broken to save a life.
  *   **The Requirement:** The theory must distinguish between a claim that ceases to have weight (outweighed) and a claim that retains its weight but is permissibly violated due to a competing constraint (overridden). When a person is sacrificed, their complaint must remain valid even if the act was necessary.
  *   **Why a Requirement:** If the claim is merely outweighed, the person had no standing to object. If it is overridden, the person is owed recognition (e.g., regret, restitution) because their separateness was infringed.
  *   **What It Rules Out:** Monistic theories that view all moral reasons as commensurable on a single scale.
  *   **Status:** **Non-negotiable** for the objection, **Partisan** overall.

  ---

  ### The Incompatibility and The Engine

  **The Incompatible Pair:**
  I suspect **Requirement 1 (Compensation)** and **Requirement 3 (Threshold of Aggregation)** cannot be jointly satisfied in a way that yields clear action guidance.
  If you enforce strict recipient-specific compensation (Req 1), you effectively ban almost all interpersonal trade-offs, leading to a paralyzing deontology where you cannot impose a tax on the rich to feed the poor (since the rich are not compensated). If you allow aggregation to solve this (Req 3), you inevitably slide back into treating persons as containers of value, violating Req 1. You can have a theory that respects separateness, or one that solves collective action problems, but the specification demands both.

  **The Requirement That Does the Most Work:**
  **Requirement 1 (The Compensation Constraint).**
  This is the engine of the entire objection. If gains to B can offset losses to A, the separateness of persons is already collapsed. Every other requirement flows from this. If you concede Req 1, the utilitarian wins. If you hold Req 1, the utilitarian is disqualified. It is the single point of failure for aggregative theories.

  ---

  ### Assessment of Leading Families

  **Classical and Average Utilitarianism**
  *   **Verdict:** Fail.
  *   **Failure Point:** **Requirement 1 (Compensation).**
  *   **Reason:** Utilitarianism is defined by the claim that B's gain *does* cancel A's loss. It explicitly rejects the Compensation Constraint as a superstition of "rights." It treats the disanalogy between intrapersonal and interpersonal trade-offs (Req 2) as a mistake. It does not dodge the complaint; it denies the complaint's validity.

  **Prioritarianism**
  *   **Verdict:** Fail.
  *   **Failure Point:** **Requirement 1 (Compensation).**
  *   **Reason:** While prioritarianism weights benefits to the worse off more heavily, it still aggregates. It allows a loss to A to be justified by gains to B and C, provided the weights are right. It softens the blow but does not respect the boundary. It treats separateness as a matter of degree (weighting) rather than kind (constraint).

  **Rawlsian / Contractualist Approaches**
  *   **Verdict:** Pass (with caveats).
  *   **Failure Point:** **Requirement 3 (Threshold of Aggregation) — *allegedly*.**
  *   **Reason:** These theories respect the Compensation Constraint by grounding justice in mutual acceptability. However, they often struggle to explain why we should save the many rather than the one in "numbers cases" (e.g., Scanlon's contractualism). They satisfy the separateness objection so well they risk failing to account for the intuitive pull of aggregation (Req 3). They respect persons but may fail to respect the urgency of the greater good.

  **Separateness-Built-In Proposals (e.g., Non-Aggregative Views)**
  *   **Verdict:** Pass.
  *   **Failure Point:** **Action Guidance.**
  *   **Reason:** These views (often deontological) satisfy all five requirements by refusing to aggregate. However, they often collapse into incoherence when faced with catastrophic outcomes (e.g., "Do not kill one even if the world explodes"). They respect the specification but fail to function as a complete moral theory.

  ---

  ### Final Verdict: The Impossibility of Neutrality

  I must now honor the condition in your prompt: **I do not believe this specification is neutral.**

  The list above is not a set of meta-ethical constraints that any rational agent must accept before doing moral philosophy. It is a restatement of the deontological/contractualist position. To ask a utilitarian to accept **Requirement 1 (Compensation)** is to ask them to surrender their theory before the argument begins. The utilitarian argues that morality *just is* the maximization of the good, and that the "separateness of persons" is a sociological fact with no moral weight in itself.

  Therefore, you cannot use this specification to judge which theory is "correct." You can only use it to sort theories into those that accept the premise of the objection (Rawlsians, Deontologists) and those that reject it (Utilitarians).

  The "Separateness of Persons" is not a flaw in utilitarianism; it is a rival first principle. If your reading group treats this specification as neutral ground, you will misunderstand the debate. The debate is not about whether utilitarianism meets these requirements; the debate is about whether these requirements are true.

  **Recommendation:** Do not present this list as a checklist for adequacy. Present it as **The Anti-Aggregative Manifesto.** Ask the utilitarians in your group why they reject Requirement 1. That rejection is not a failure of their theory; it is the core of their theory. The objection cannot be turned into a neutral specification because the objection *is* the substantive position.
