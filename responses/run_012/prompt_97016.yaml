answer: |-
  ### The Regress of Referential Integrity

  Imagine you are modeling a state of affairs, say, "Alice orders Book B." In your schema, you have a table `Users` (with `user_id`) and a table `Books` (with `book_id`). To represent the order, you introduce a relation. In a property graph, this is an edge; in a relational model, it is often a foreign key constraint or, if the relation has attributes, a reified associative table `Orders` with columns `user_id` and `book_id`.

  Bradley's problem arises when you ask what makes this row in `Orders` a *unified fact* rather than just another tuple in a heap of data.

  1.  **The Relation as a Row:** If the relation "orders" is reified as a row in the `Orders` table, it is ontologically identical to the rows in `Users` and `Books`. It is just more data. You now have three items: the User row, the Book row, and the Order row.
  2.  **The Need for a Tie:** Merely storing `user_id: 1` and `book_id: 5` in the `Orders` table does not, by itself, link the specific User row to the specific Book row. Those integers are just values. To make them function as pointers, you require a **Foreign Key Constraint**. The constraint is the "tie" that binds the value in `Orders` to the primary key in `Users`.
  3.  **The Regress:** But what is the status of this Constraint?
      *   If the Constraint is an active agent (the DBMS engine), it stands outside the data. But Bradley asks how the *content* itself is unified, not how an external process manipulates it.
      *   If the Constraint is treated as data (e.g., a row in `information_schema.table_constraints`), then it is just another item alongside the tables it governs. You now have the Data Tables and the Schema Table.
      *   What links the Schema Table to the Data Tables? You need a **Meta-Constraint** (a rule of interpretation) that says "rows in `table_constraints` define validity for rows in `Users`."
      *   If that Meta-Constraint is also stored as data (in a higher-order catalog), you require a Meta-Meta-Constraint to link it to the Schema Table.
  4.  **The Result:** You never arrive at a single, unified "database state" that is true or false. You arrive at an infinite stack of catalogs and constraints. Without a final, non-relational "glue" that binds the schema to the data without itself being data, the database is just a collection of disjointed files. The Join Operation, which produces the unified proposition ("Alice orders Book B"), relies on this glue. If the glue is just another table join, the query optimizer enters an infinite loop of resolving metadata before it can resolve data.

  In this vocabulary, Bradley's worry is that **Referential Integrity cannot be fully reified.** If you treat the link (the FK) as just another column value, you lose the *linkage*. If you treat the linkage as a constraint, and then treat the constraint as data, you lose the *authority* of the constraint. The database threatens to dissolve into a flat file of bytes where `user_id` has no necessary connection to the `Users` table, and the "truth" of the join is never established, only deferred to the next layer of metadata.

  ***

  ### Residue Report

  Here is the mapping of the philosophical problem onto your engineering domain.

  #### 1. Clean Mappings
  *   **Reification as Objectification:** Bradley's fear that treating a relation as a "term" destroys its relating function maps perfectly to the decision to model a relationship as an associative entity (join table). Once the relationship is a table, it requires its own keys, effectively turning a verb into a noun that requires its own verb.
  *   **The Metadata Regress:** The philosophical regress (relation needs a super-relation) maps cleanly to the schema hierarchy (Data → Schema → Catalog → Meta-Catalog). In both cases, treating the *rule of connection* as an *object of connection* generates an infinite tower.
  *   **The Heap vs. The Structure:** Bradley's distinction between a "mere list" and a "unified proposition" maps to the distinction between a set of disconnected tables (a data lake dump) and a normalized schema with enforced integrity. Without the enforcement, the rows are just a heap.

  #### 2. Distorted Mappings
  *   **Truth vs. Consistency:** In Bradley's logic, a proposition must be capable of being *true or false*. In your domain, a row simply *exists* or it *violates a constraint*. The database operates under the **Closed World Assumption (CWA)**: if it's in the table, it's "true." Bradley is concerned with how a representation hooks onto *reality*. Your schema only hooks onto *memory*. The regress in DBs is about consistency; the regress in philosophy is about ontology.
  *   **The Nature of the "Tie":** In a database, the "tie" is often a physical pointer or a B-Tree index lookup. This is a causal/mechanical link. Bradley is looking for a *logical* link. Translating logical unity into physical referential integrity distorts the problem by solving it with hardware causality rather than logical necessity.

  #### 3. No Counterpart
  *   **Judgment/Assertion:** A database does not *assert*. It stores. A proposition is an act of judgment ("It is the case that..."). A row is not a judgment; it is a record. There is no equivalent in your vocabulary for the *act* of predication that turns data into a claim.
  *   **The Absolute:** Bradley's solution to the regress is "The Absolute"—a holistic reality where distinctions dissolve. There is no database equivalent. A "Single Source of Truth" is not the Absolute; it is just a master table. The Absolute implies that the separation between `Users` and `Orders` is ultimately illusory. Your entire trade is predicated on the reality of that separation (normalization).

  ***

  ### Analysis of Your Instinct

  > *"Unity is just what a primary key plus a foreign key buys you, and that the regress is the familiar fact that you can always add another join table."*

  **Verdict:** This is a **pragmatic evasion**, not a philosophical solution.

  **Why it works in Engineering:**
  In data engineering, you stop the regress by **fiat** and **physics**.
  1.  **Fiat:** The DBMS is the "unmoved mover." It is the external agent that enforces the FK constraint. You do not ask the DBMS to validate its own binary code against a meta-schema. You trust the hardware.
  2.  **Physics:** At the bottom of the stack, the "link" is not a logical relation; it is a memory address or a disk offset. The pointer `0x4F3A` *is* the location of the row. The regress stops because physical causality is not a proposition.

  **What it leaves out (The Evasion):**
  Your instinct evades the problem by shifting the burden of unity from the *data* to the *system*.

  1.  **The Internal vs. External Problem:** Bradley asks how the constituents of a fact hold together *from the inside*. If you say "The FK constraint holds them together," Bradley asks "What holds the constraint to the data?" If you say "The DBMS engine," you have admitted that the unity is not in the proposition (the rows), but in the *interpreter* (the engine). The database schema, viewed as a static artifact, does not possess unity on its own; it possesses potential unity that is actualized only by the running process.
  2.  **The Loss of Truth Conditions:** By treating PK+FK as unity, you define unity as *referential integrity*. But referential integrity is not truth. You can have a perfectly normalized database where `Users.id = 1` is linked to `Orders.user_id = 1`, but the *fact* that Alice ordered the Book is false (perhaps it was Bob, and the data entry was wrong). The PK/FK ensures the *syntax* of the fact is valid, but it does not explain how the syntax hooks onto the world. Bradley's regress is about how thought hooks onto reality; your solution explains how tables hook onto other tables.
  3.  **The Reification Trap:** Your instinct says "add another join table." This is exactly what Bradley warns against. If the link between A and B requires a table L, and the link between L and A requires a table M, you are admitting that no finite number of tables produces unity. You are managing the regress, not solving it. You are saying, "We will stop adding tables when performance degrades," which is an economic limit, not a logical solution.

  **Summary:**
  In your trade, you solve Bradley's Regress by **operationalizing** it. You turn a metaphysical problem into an latency/consistency trade-off. You accept that the "unity" of the data is an emergent property of the system's execution, not an inherent property of the schema. This is a brilliant engineering move, but it leaves the philosophical question untouched: it explains how the database *runs*, but not how the data *means*.
