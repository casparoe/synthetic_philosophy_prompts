      *   *The Regress in SQL:* If `Order_Items` links `Orders` and `Products`. The link is the row in `Order_Items`. But that row is just data. What makes it *link*? The FK constraint. But the FK constraint is defined in the DDL. Is the DDL data? If so, what links the DDL to the Data? The DBMS binary. What links the binary to the hardware?
