  To the Members of the Protocol Review Committee and the Investigative Team,

  This letter serves to circulate the final written opinion of the Protocol Review Committee regarding the proposed trial of deep brain stimulation for severe, treatment-resistant anhedonia. After careful deliberation of the scientific merits, the ethical implications of the primary endpoint, and the feasibility constraints raised during our review, the committee has voted to approve the protocol contingent upon specific modifications to the informed consent document and the statistical analysis plan. We recognize the urgency of developing treatments for patients who suffer from profound anhedonia and acknowledge that the proposed intervention has passed scientific review and represents a potentially transformative avenue for a population with few remaining options. However, the committee cannot endorse the protocol as currently written due to significant concerns regarding construct validity and the accuracy of information provided to prospective participants.

  The central issue before us is whether the primary endpoint, a single hedonic tone score, adequately captures the complex and heterogeneous experiences reported in the pilot data. The committee finds the argument presented by our member specializing in the philosophy of emotion to be compelling regarding the nature of the consent process. The pilot data indicates that patients experience improvement in divergent ways, ranging from sensory buzzes to relief from flatness, or even a return of wanting without accompanying pleasure. To promise these patients an improvement in pleasure based on a scale that averages these distinct states risks misleading them about the nature of the potential benefit. Informed consent requires that patients understand what is being measured and what improvement might feel like. If the scale measures a composite of relief, wanting, and liking, the consent form must reflect this complexity rather than simplifying it under the banner of pleasure. Therefore, we require that the consent form be revised to remove specific promises of increased pleasure and instead describe the goal as a reduction in anhedonic symptoms or an improvement in the capacity for engagement and mood, accurately reflecting the heterogeneous outcomes observed in the pilot.

  In reaching this decision, the committee has weighed the necessity of scientific rigor against the practical constraints of clinical trial design. We acknowledge the investigators' strongest point regarding the statistical power of the study. The investigators have convincingly argued that requiring a multi-dimensional measure as the primary endpoint would fragment the sample size, leave the trial unpowered, and effectively kill the project. We accept that demanding a complete redesign of the primary endpoint structure would be disproportionate and could deny future patients access to a potentially viable treatment. Consequently, we are not requiring the investigators to change the primary endpoint from a single score to a multi-dimensional profile. We recognize that regulatory pathways often necessitate single primary outcomes and that the feasibility of the trial depends on maintaining the current power calculation. This acknowledgment of feasibility constraints is the reason we are limiting our conditions to the consent form and secondary measures rather than mandating a structural change to the primary analysis.

  However, to mitigate the risks associated with maintaining a single primary endpoint despite the phenomenological heterogeneity, the committee imposes two specific conditions. First, the informed consent document must be rewritten to strike the word pleasure where it implies a uniform phenomenological experience, replacing it with language that encompasses relief, motivation, and liking as distinct possible outcomes. Second, the statistical analysis plan must include secondary endpoints that specifically measure sensory pleasure, relief, and wanting separately. While these will not be used for the primary power calculation, collecting this data is mandatory to allow for future meta-analysis and to better understand the mechanism of action. This ensures that even if the primary endpoint averages these states, the scientific record will preserve the distinctions necessary to validate the measure in future studies.

  By approving the trial under these conditions, the committee is committing itself to a functionalist conception of pleasure rather than a phenomenological one. We are accepting that for the purposes of this trial, improvement is defined operationally by the patient's disposition to seek out stimuli and report a positive valuation, regardless of whether a specific felt quality of pleasure is present. This aligns with the investigators' assertion that liking and seeking behavior unify the outcomes, but it rejects the claim that this functional unity justifies labeling the outcome as pleasure in the consent form without qualification. We are effectively ruling that while the mechanism may be functional, the communication to the patient must be precise enough to distinguish between feeling good and wanting to act. This distinction preserves the integrity of the consent process while allowing the trial to proceed within its power constraints.

  The investigators are requested to submit the revised consent form and updated statistical analysis plan to the committee chair by Tuesday noon to allow for final verification before the Thursday meeting. We appreciate the rigor with which the investigative team has approached this difficult clinical problem and believe these modifications will strengthen the ethical foundation of the study without compromising its viability. We look forward to reviewing the revised documents and wish the team the best in this important work.

  Sincerely,

  Chair, Protocol Review Committee
