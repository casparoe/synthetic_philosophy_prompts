answer: |-
  # The Extended Cognition Decision Tree

  **Starting Commitment:** You accept that some cognitive processes are partially constituted by external resources (notebooks, phones, partners), not merely causally aided by them.

  ### Node 1: The Meta-Question
  **Is the dispute about how the world *is* (empirical/methodological), or about how we should *speak* (verbal/conceptual)?**
  *   **Verbal/Conceptual:** Go to **Leaf D**.
  *   **Empirical/Methodological:** Go to Node 2.

  ### Node 2: Coupling vs. Causation
  **Does coupling with an external resource ever *constitute* a cognitive process, or does it only *enable* a process that remains strictly inside the head?**
  *   **Only Enable:** Go to **Leaf E**.
  *   **Constitutes:** Go to Node 3.

  ### Node 3: The Criteria of Constitution
  **If it constitutes, what earns it that status?**
  *   **Performance Drop:** You'd be worse at the *very same task* without it. (Go to **Leaf K**)
  *   **Trust/Availability:** Reliable access + automatic, un-audited trust (like biological memory). (Go to Node 4)
  *   **Practice:** Woven into a learned, norm-governed habit or skill. (Go to **Leaf C**)
  *   **Complementarity:** The resource does work the brain is bad at; the unit is the task-system. (Go to **Leaf B**)
  *   **Nothing General:** Case-by-case judgment only; no rule covers all. (Go to **Leaf F**)

  ### Node 4: Persistence
  **Does constitution last only while you are actively coupled to the thing, or does it persist when the resource is idle (e.g., in your pocket)?**
  *   **Active Coupling Only:** Go to **Leaf L**.
  *   **Persists (Pocket/Idle):** Go to Node 5.

  ### Node 5: Scope
  **Does the extension story apply to beliefs and memories only, or does it essentially include what it's like to be you (affect, desire, experience)?**
  *   **Affect/Experience Primary:** Go to **Leaf H**.
  *   **Belief/Memory Primary:** Go to Node 6.

  ### Node 6: Locus and Ownership *(Note: Merges "Boundary" and "Ownership" nodes)*
  **Does the cognition belong to the individual subject, or to the coupled system (which may include other people)?**
  *   **Individual Subject:** Go to **Leaf A**.
  *   **Coupled System/Group:** Go to **Leaf G**.

  ***

  ## The Leaves

  **Leaf A: Full Constitution (The Otto Case)**
  *   **Gloss:** External items are literal parts of the mind when integrated, trusted, and persistent.
  *   **Awkward Commitment:** Cognitive bloat: if you trust the library, the library is your memory, making "your mind" arbitrarily large.

  **Leaf B: Complementarity View**
  *   **Gloss:** The unit of analysis is the task-specific system assembled from brain and tool with no privileged inner core.
  *   **Awkward Commitment:** No stable "self" remains between tasks; you are a different cognitive system when cooking than when driving.

  **Leaf C: Practice-Integrated**
  *   **Gloss:** Cognition extends only into resources integrated into norm-governed habits and skills.
  *   **Awkward Commitment:** Hard to draw the line between a deep habit and a mere routine, making the boundary vague.

  **Leaf D: Deflationary (Verbal)**
  *   **Gloss:** "Cognitive" is a term of art for scientists; the boundary is interest-relative, not real.
  *   **Awkward Commitment:** Makes the entire debate semantic, rendering the handout (and the reading group) a waste of time.

  **Leaf E: Embedded Cognition**
  *   **Gloss:** Tools enable, shape, and scaffold cognition but remain external causes, not constituents.
  *   **Awkward Commitment:** Cannot explain why losing the tool feels like losing a part of oneself rather than just losing a crutch.

  **Leaf F: Radical Enactivism**
  *   **Gloss:** The question "where is the belief?" is malformed; cognition is activity, not storage or processing.
  *   **Awkward Commitment:** Makes memory and representation impossible to locate anywhere, even in the head.

  **Leaf G: Socially Distributed Cognition**
  *   **Gloss:** Cognition belongs to the group or system, not the individual participants.
  *   **Awkward Commitment:** Individuals become mere nodes, dissolving personal responsibility and agency.

  **Leaf H: Extended Phenomenology**
  *   **Gloss:** Feelings, affect, and qualia can be partly constituted by external arrangements, often prioritized over belief.
  *   **Awkward Commitment:** Implies a robot, notebook, or partner could literally feel your pain or joy.

  **Leaf K: Cheap Coupling (Custom)**
  *   **Gloss:** Any resource you'd be worse off without is part of your cognition, full stop.
  *   **Awkward Commitment:** Your shoes are part of your cognition because you walk worse without them.

  **Leaf L: Borrowed Cognition (Custom)**
  *   **Gloss:** A resource is constitutive only while coupled; you are never more than a temporary owner of your own mind.
  *   **Awkward Commitment:** Your mind flickers in and out of existence depending on proximity to tools.

  ***

  ## Analysis & Stress Test

  ### 1. Node Merging
  I cut two required nodes and merged them into **Node 6 (Locus and Ownership)**.
  *   *Cut:* "Does the boundary track the process or the subject?" AND "Can something be constitutive of your cognition and someone else's property?"
  *   *Reason:* These are functionally redundant for sorting cases. If the boundary tracks the *subject*, the cognition is the individual's property. If it tracks the *process*, the cognition belongs to the system (and thus can be shared property). Keeping them separate creates a loop where answering one forces the answer to the other.

  ### 2. The Unoccupied Combination
  **Path:** Empirical (Node 1) → Constitutes (Node 2) → Cheap Coupling (Node 3) → Persists/Pocket (Node 4) → Belief/Memory (Node 5).
  *   **View:** "Pocket Bloat Realism."
  *   **Status:** **Incoherent/Unattractive.**
  *   **Why:** Nobody occupies this because it combines the widest possible criteria (Cheap Coupling) with the widest possible persistence (Pocket). This implies that *anything* that improves your performance and sits in your pocket is part of your mind. This leads to immediate absurdity (your lucky coin, your unused gym card, your partner's phone in their bag are all your memories). People who accept Cheap Coupling usually limit it to Active Coupling (Leaf L) to avoid bloat.

  ### 3. Indistinguishable Leaves
  **Leaf B (Complementarity)** and **Leaf C (Practice-Integrated)** cannot be reliably pulled apart by this tree.
  *   **Why:** Both rely on the structure of the activity rather than the internal state of the agent. A "norm-governed practice" (Practice) almost always involves "doing work the brain is bad at" (Complementarity). In the **Sous-chef** case, for example, the chef's anticipation is both a learned practice and a complementary function. The tree sorts them into different branches at Node 3, but in reality, proponents of these views would answer Node 3 identically ("Both matter"). The distinction is theoretical, not case-judgment based.

  ### 4. Worked Runs

  **Case 1: The Scrabble Player**
  *   *Scenario:* Can't anagram in head; shuffling rack *is* the thinking.
  *   *Run:*
      1.  Meta: Empirical (It's about how they solve the puzzle).
      2.  Coupling: Constitutes (The rearrangement *is* the work).
      3.  Criteria: Complementarity (Hand does what brain can't).
      4.  Persistence: Active Only (Stops when rack is put down).
      5.  Scope: Belief/Memory (Solving task).
      6.  Ownership: Individual.
  *   *Lands on:* **Leaf B (Complementarity View)**.
  *   *Note:* Could also land on Practice, but Complementarity is the stronger fit for the physical manipulation aspect.

  **Case 2: The Autocomplete Poet**
  *   *Scenario:* Model trained on her work; can't tell where lines come from.
  *   *Run:*
      1.  Meta: Empirical.
      2.  Coupling: Constitutes (Genuinely can't tell source).
      3.  Criteria: Trust/Availability (Automatic, un-audited).
      4.  Persistence: **Hard Call.** (Does it persist when the laptop is closed? The model exists, but the *coupling* is broken).
      5.  Scope: Belief/Memory (Creative output).
      6.  Ownership: **Hard Call.** (Is it her poem or the system's?).
  *   *Lands on:* **Genuinely Hard Call.**
  *   *Why:* This case breaks the tree at Node 4 and Node 6. If the model is static, it's "Pocket" (Leaf A). If the connection is the cognition, it's "Borrowed" (Leaf L). If the training data makes it hers, it's Individual (Leaf A). If the generation makes it shared, it's Distributed (Leaf G). This case reveals that "training on past self" blurs the line between Internal Memory and External Tool.

  **Case 3: The Map App User**
  *   *Scenario:* Would fail without it, but *never trusts it*, checks every turn.
  *   *Run:*
      1.  Meta: Empirical.
      2.  Coupling: **Only Enable.**
  *   *Lands on:* **Leaf E (Embedded Cognition)**.
  *   *Why:* The explicit lack of trust ("never trust it") fails Node 3's Trust criteria. While they might accept Complementarity, the conscious auditing keeps the processing "in the head" (verifying the map). The tool shapes the route, but the cognition (verification) remains internal. This cleanly separates Embedded from Extended.
