answer: |-
  This is a sophisticated request that requires disentangling historiographical frameworks from the narrative events themselves. The period from June 1793 (expulsion of the Girondins) to July 1794 (Thermidor) is the crucible of the Terror, and how one explains the sequence of purges defines one's entire theory of the Revolution.

  Here is an analysis of the purge sequence through the three competing lenses, followed by a dissection of the "revolutions devour their children" thesis.

  ---

  ### Part I: Historiographical Readings of the Purge Sequence (1793–1794)

  #### 1. The Class-Struggle Reading
  *Associated with: Albert Soboul, Georges Lefebvre, traditional Marxist historiography.*

  **The Classes and Fractions:**
  To make this reading work, the factions must map onto socio-economic interests.
  *   **Girondins:** Represent the commercial bourgeoisie (port cities like Bordeaux/Nantes). They favor free markets, property rights, and a decentralized republic.
  *   **Hébertists (Cordeliers):** Represent the *sans-culottes* and petty bourgeoisie (artisans, shopkeepers). They demand the *Maximum* (price controls), punitive measures against hoarders, and de-Christianization.
  *   **Dantonists (Indulgents):** Represent the "new rich" of the Revolution and the professional bourgeoisie (lawyers, speculators). They favor ending the Terror, relaxing economic controls, and peace negotiations.
  *   **Robespierrists (Incorruptibles):** Represent the "patriotic" petty bourgeoisie and intellectuals. They attempt to balance the needs of the war economy (pleasing the *sans-culottes*) with the sanctity of property (pleasing the bourgeoisie).

  **What They Are Fighting Over:**
  At each stage, the conflict is ostensibly about the distribution of resources and the control of the state apparatus during total war.
  *   **Fall of Girondins:** The commercial bourgeoisie refuses to accept the economic controls necessary to feed Paris and the armies. The Mountain, backed by the *sans-culottes*, purges them to secure the war economy.
  *   **Fall of Hébertists:** The Hébertists push for deeper economic radicalism and a levée en masse that threatens the stability of the state and property holders. Robespierre cuts them off to prevent anarchy and maintain bourgeois alliance.
  *   **Fall of Dantonists:** The Dantonists argue the emergency has passed and demand an end to controls. Robespierre executes them because the war situation (Spring 1794) still requires total mobilization; "Indulgence" is treason.
  *   **Fall of Robespierre:** The bourgeoisie, no longer needing the *sans-culottes* to win the war (after Fleurus), turns on the arbiter who constrained their profit-seeking.

  **Explanatory Power vs. Leaning on Detail:**
  *   **What it explains:** It provides a structural logic for the *economic decrees* that accompany the purges. It explains why the Terror intensifies when the war goes badly and relaxes when victory is secure. It accounts for why the *sans-culottes* supported Robespierre against the Girondins but remained passive when he was overthrown (their economic interests had been compromised by the Law of the Maximum's enforcement issues).
  *   **Where it fails/smuggles:** It struggles with the **Hébertist purge**. If Robespierre represents the petty bourgeoisie and the Hébertists represent the *sans-culottes*, why did Robespierre guillotine his natural allies? The class reading must smuggle in "political error" or "false consciousness" to explain this. It also blurs on personnel: Danton and Robespierre were both lawyers from similar backgrounds. To make the class theory work, one must assert that their *constituencies* differed, not their personal class status, which risks circularity (we know they represented different classes because they fought; they fought because they represented different classes).

  #### 2. The Ideological / Political-Culture Reading
  *Associated with: François Furet, Keith Baker, linguistic turn historiography.*

  **The Motor:**
  The engine is not class interest but the logic of revolutionary discourse. The Revolution creates a new legitimacy based on "The People" and "Virtue." Since no one can fully embody the General Will, anyone who opposes the current leadership is by definition an enemy of the People.

  **What They Are Fighting Over:**
  They are fighting over the monopoly on virtue and the definition of conspiracy.
  *   **Girondins:** Cast as "Federalists" and traitors to the unity of the Republic.
  *   **Hébertists:** Cast as "Ultra-revolutionaries" whose excessive zeal masks a conspiracy to destabilize the government (fake patriots).
  *   **Dantonists:** Cast as "Indulgents" whose desire for mercy masks corruption and royalist sympathy.
  *   **Robespierre:** Cast as the tyrant who believes he *is* Virtue incarnate.

  **Explanatory Power vs. Leaning on Detail:**
  *   **What it explains:** It explains the **rhetorical structure** of the trials. In every case, the accused are not just policy opponents; they are moral monsters. It explains why compromise was impossible. In a class war, you can negotiate a settlement; in a war between Virtue and Conspiracy, you can only exterminate. It accounts for the escalation: as the Revolution fails to achieve utopia, the "conspiracy" must be getting deeper, requiring more purges (culminating in the Law of 22 Prairial).
  *   **Where it fails/smuggles:** It risks becoming tautological. "Why did they kill? Because the ideology demanded it." "How do we know the ideology demanded it? Because they killed." It often treats discourse as detached from material reality. It struggles to explain why the purges stopped at Thermidor. Did the "logic of equality" suddenly vanish? No. The ideological reading often has to smuggle in **contingency** (fear for their lives) to explain why the Convention finally said "stop." It downplays the very real famine and invasion that made the "conspiracy" theories feel plausible to the actors.

  #### 3. The Contingency Reading
  *Associated with: Alfred Cobban, William Doyle, political narrative historians.*

  **The Motor:**
  There is no deep logic. The purges are the result of factional maneuvering, personal grudges, institutional competition (Committee of Public Safety vs. Committee of General Security), and the specific psychology of key deputies.

  **What They Are Fighting Over:**
  Power, survival, and specific policy disagreements amplified by mistrust.
  *   **Girondins:** Purged because they lost control of the Paris sections and the Mountain seized the opportunity.
  *   **Hébertists:** Purged because they planned an insurrection (March 1794) that threatened the CPS's control.
  *   **Dantonists:** Purged because Danton's arrogance alienated Robespierre and his calls for peace threatened the CPS's strategy.
  *   **Robespierre:** Purged because he threatened to name specific deputies in his final speech, triggering a preemptive strike by members of the Committees.

  **Explanatory Power vs. Leaning on Detail:**
  *   **What it explains:** It explains the **timing and specific triggers**. For example, the Hébertists weren't killed because of "class logic" but because they botched an uprising. Robespierre wasn't killed because of "bourgeois reaction" but because he refused to name names on 8 Thermidor, causing panic. It highlights the role of the **Committee of General Security**, which felt threatened by Robespierre's police bureau and actively conspired against him.
  *   **Where it fails/smuggles:** It lacks structural depth. It makes history seem like noise. It cannot explain why these *specific* factions formed or why the violence took the *specific form* of the Terror rather than a simple military coup. It smuggles in **psychology** as a deus ex machina (e.g., "Robespierre was paranoid"). It treats the Revolution as a series of accidents, ignoring that the accidents all trended in the same direction (radicalization) for a year.

  ---

  ### Part II: Reckoning with "Revolutions Devour Their Children"

  The phrase is often used as a conversation-stopper, but it bundles four distinct claims. We must test the 1793–94 sequence against each.

  #### 1. As a Causal Law of Revolutionary Dynamics
  *Claim:* Radicalization inevitably creates a centrifugal force where the center purges the right, then the left, then consumes itself.
  *   **Evidence:** The sequence (Girondins $\rightarrow$ Hébertists $\rightarrow$ Dantonists $\rightarrow$ Robespierre) fits the pattern perfectly. It suggests a mechanism where the definition of "enemy" narrows as the revolutionaries seek purity.
  *   **Verdict:** **Partially Supported.** The pattern holds for the Year II. However, the "law" implies inevitability. Thermidor stopped the eating. The Convention survived, the Republic survived (for a time), and the Terror ended. If the law were absolute, the violence would have continued until everyone was dead. The fact that it stopped suggests it is a *phase* of revolutionary crisis, not an eternal law.

  #### 2. As a Selection Effect on Leadership
  *Claim:* Revolutions select for individuals willing to use extreme violence; eventually, there is no one left but those most willing to turn violence on colleagues.
  *   **Evidence:** By 1794, the moderate voices (Brissot, Vergniaud) were gone. The survivors were men who had voted for the King's death and supported the Terror. Robespierre fell not to moderates, but to men like Tallien and Fouché, who were deeply implicated in the Terror and feared for their own necks.
  *   **Verdict:** **Strongly Supported.** The pool of eligible leaders was narrowed by the initial violence. The "children" devoured were the ones who either hesitated (Danton) or radicalized too fast (Hébert). The survivors (Thermidorians) were those who mastered the art of survival over ideology. This is less a "law of nature" and more a sociological outcome of purging institutions.

  #### 3. As a Retrospective Rhetorical Trope
  *Claim:* The phrase is a story imposed by the victors (Thermidorians) to legitimize their coup by painting the previous regime as inherently monstrous and self-destructive.
  *   **Evidence:** The phrase captures the Thermidorian narrative perfectly. By framing Robespierre as a tyrant who killed his friends, the Thermidorians absolved themselves of complicity. They framed the Terror as Robespierre's personal pathology rather than a systemic outcome of the war and emergency governance.
  *   **Verdict:** **Highly Supported.** Much of the "devouring" narrative comes from memoirs written after the fact. Robespierre did not *intend* to be devoured; he believed he was saving the Revolution. The "devouring" is a moral judgment cast by the survivors to distinguish themselves from the dead. It bundles complex political failures into a neat moral fable.

  #### 4. As a Normative Claim about Moral Price
  *Claim:* Revolutionary politics inherently corrupts moral boundaries, making the killing of allies the price of utopian ambition.
  *   **Evidence:** The use of the guillotine shifted from a tool against external enemies to a tool for internal policy disputes. The moral language of "Virtue" was used to justify murder.
  *   **Verdict:** **Subjective but Plausible.** The evidence shows that the means (Terror) corrupted the ends (Republic). However, this is a philosophical judgment, not a historical fact. One could argue the price was paid to save France from invasion, not that it was an inherent moral tax on all revolution.

  #### Falsifiability and Final Verdict

  **Is it Falsifiable?**
  *   As a **Causal Law**: Yes. If a revolution occurred with high internal cohesion and no elite purges, the law would be falsified. (One might argue the American Revolution fits this, though it had its own loyalist purges).
  *   As a **Rhetorical Trope**: No. It is a literary device, not a hypothesis.
  *   As a **Selection Effect**: Yes. If revolutionary leadership remained stable through radical phases, the effect would be disproven.

  **Does the Episode Confirm or Undercut the Thesis?**
  On balance, the episode **confirms the pattern but undercuts the inevitability.**

  The sequence from June 1793 to July 1794 is the strongest evidence *for* the idea that revolutionary coalitions fracture under the pressure of total war and ideological purity. The mechanism is clear: the definition of "patriot" becomes so narrow that it excludes the architects of the Revolution themselves.

  However, the thesis is undercut by the **Thermidorian Reaction**. The "devouring" stopped. The "children" (the Convention) survived the "parent" (Robespierre/Jacobinism). This suggests that "devouring" is not a law of nature, but a specific outcome of the **interaction between war emergency and unchecked executive power**. When the emergency (war) receded and the executive (CPS) was checked, the devouring ceased.

  **Conclusion for your Argument:**
  Tell your friend that the "devouring" thesis is useful as a **Selection Effect** and a **Rhetorical Trope**, but dangerous as a **Causal Law**.
  *   If you use the **Class Reading**, you explain *why* the factions had irreconcilable economic interests.
  *   If you use the **Ideological Reading**, you explain *why* those interests were fought to the death rather than negotiated.
  *   If you use the **Contingency Reading**, you explain *why* Robespierre fell on 9 Thermidor specifically.

  To settle the argument properly: The purges were not inevitable (Contingency), but once the logic of Virtue/Conspiracy was adopted (Ideology) within a context of scarce resources and war (Class/Material), the probability of elite liquidation became extremely high. The "devouring" was not a law, but a highly probable trap that the Revolution walked into, and only escaped by killing the walker.
