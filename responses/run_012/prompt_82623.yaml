      *   **Goal:** Demonstrate that behavior alone doesn't settle sentience/consciousness.
      *   **Core Scenario:** Two systems with identical input-output behavior (one is a lookup table, one is a recurrent/broadcasting system).
      *   **Theoretical Constraints:**
          *   *Global Workspace Theory (GWT):* Recurrent = Conscious (Moral Patient), Lookup = Unconscious.
          *   *Higher-Order Theory (HOT):* Both = Unconscious (needs specific self-representation which neither has in the base case).
          *   *Plain Functionalism/Behaviorism:* Both = Conscious (same function/behavior).
      *   **Setting:** Realistic-ish (lab or hospital), no magic, no perfect predictors.
      *   **Requirements:** Walk through reasoning for each view, identify the specific feature doing the work, explain what happens if that feature is removed, and provide a counter-argument for the lookup table sentience view.

  2.  **Deconstruct the Theories & Constraints:**
