      *   *Challenge:* The prompt asks for GWT to distinguish them. GWT relies on *broadcasting* to multiple specialized subsystems. A lookup table just maps Input -> Output. It doesn't internally share info. So, the recurrent system needs explicit "broadcasting" architecture.
      *   *Challenge:* The prompt asks for Functionalism to equate them. Functionalism cares about the causal role. If I/O is identical, a strict behaviorist/functionalist might say they are the same. However, *computational* functionalism might care about the internal steps. I need to frame "Plain Functionalism" here as *Input-Output Functionalism* (Behaviorism) or a very coarse-grained functionalism to ensure it counts the lookup table. Let's stick to the prompt's definition: "if it computes the same damage-avoidance function, it counts."
      *   *Setting:* A hospital pain-management AI or a triage bot fits well. Let's go with a "Patient Care Assistant" (PCA) bot that reacts to stimuli (pain indicators, questions, threats).

