  5.  **Developing the Argument Walkthrough:**
      *   *GWT:* Focus on *information sharing*. Tabula isolates data. Recurrex shares it.
      *   *HOT:* Focus on *self-representation*. Neither bot has a concept of "self."
      *   *Functionalism:* Focus on *causal role*. If it walks and talks like a duck...

  6.  **Addressing the "Feature Doing the Work":**
      *   For GWT: Internal architecture (broadcasting vs. retrieval).
