      *   *Constraint Check:* No magic. How do we get identical behavior without a lookup table being infinite?
          *   *Solution:* Limit the scope. It's a *test* scenario. The test battery is finite. Within the context of the thought experiment, we stipulate that for *all tested and testable scenarios within the hospital environment*, they match. We don't need infinite capacity, just functional equivalence in the relevant domain.

  4.  **Refining the Theories to match the Verdicts:**
      *   *GWT:* Recurrex has a "global workspace" where sensory data (pain) is broadcast to memory, planning, and speech. Tabula just retrieves a string. *Verdict:* Recurrex is conscious.
      *   *HOT:* Neither has a higher-order state. Recurrex broadcasts pain, but doesn't have a module that thinks "I am experiencing pain." It just experiences pain (first-order). *Verdict:* Neither is conscious. (This is tricky. Usually GWT implies consciousness. I need to make sure the GWT version is "First-Order GWT" or simply emphasize that HOT has stricter criteria. I will frame HOT as requiring a *conceptual* self-ascription which neither bot possesses).
