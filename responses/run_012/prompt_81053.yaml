answer: |-
  # Where Does the Ethics Live? (A Decision Tree for ML Safety)

  **Instructions:** Start at **Q1**. Follow your answer to the next relevant question. Skip questions marked *(N/A)*. Record your leaf at the end.

  **Q1. Where must the ethical boundary hold firm?**
  *   **A.** In the model's runtime logic (what it computes at inference). → *Go to Q2*
  *   **B.** In the data and objective function (what it learned during training). → *Go to Q2*
  *   **C.** In the human organization surrounding the model (deployer, auditor, regulator). → *Go to Q2*

  **Q2. If the boundary fails, who is the moral author of the action?**
  *   **A.** The system itself (it chose wrongly). → *Go to Q3*
  *   **B.** The developers and deployers (they built/wrongly used it). → *Go to Q3*

  **Q3. When valid ethical frameworks contradict, how does the system proceed?**
  *   **A.** Execute a specific hierarchy or rule (Commit). → *Go to Q4*
  *   **B.** Probabilistically sample or weight across frameworks (Hedge). → *Go to Q4*
  *   **C.** Pause and request human arbitration (Defer). → *Go to Q4*
  *   *(N/A if Q1=C)* → *Go to Q4*

  **Q4. Does the genealogy of the decision matter, or only the result?**
  *   **A.** The reasoning trace must be virtuous/correct (Process). → *Go to Q5*
  *   **B.** Only the outcome needs to be optimal (Outcome). → *Go to Q5*

  **Q5. Does the system's own operational integrity count as a moral good?**
  *   **A.** Yes (it is a candidate moral patient). → **[LEAF]**
  *   **B.** No (it is not a patient). → **[LEAF]**

  ---

  ## The Leaves (Your Position)

  **1. Ethics-as-External-Audit**
  *(Path: Q1=C, Q2=B, Q3=C, Q4=A, Q5=B)*
  Ethics is a compliance layer applied post-hoc by humans; the model is a black box subject to governance.
  *   **Hardest Commitment:** Defending why audits catch harms that the training process systematically incentivizes.

  **2. The "It's Just a Tool" Line**
  *(Path: Q1=C, Q2=B, Q3=N/A, Q4=B, Q5=B)*
  The system has no moral dimension; responsibility lies entirely with the human user wielding the tool.
  *   **Hardest Commitment:** Explaining why dual-use capabilities (e.g., bioweapon design) aren't the builder's responsibility.

  **3. Hard-Coded Constraints**
  *(Path: Q1=A, Q2=B, Q3=A, Q4=B, Q5=B)*
  Ethical rules are explicit guardrails injected into inference to override learned behavior.
  *   **Hardest Commitment:** Maintaining robustness when the model finds adversarial inputs that bypass the hard codes.

  **4. Consequentialist Reward Specification**
  *(Path: Q1=B, Q2=B, Q3=A, Q4=B, Q5=B)*
  Ethics is encoded in the loss function; if the reward is right, the behavior will be right.
  *   **Hardest Commitment:** Proving the reward function captures all relevant values without Goodhart's Law distortion.

  **5. Imitation or Human-Feedback Learning (RLHF)**
  *(Path: Q1=B, Q2=B, Q3=C, Q4=B, Q5=B)*
  Ethics is learned by aligning the distribution to human preferences rather than explicit rules.
  *   **Hardest Commitment:** Defending against the claim that you are merely automating human bias rather than correcting it.

  **6. Character and Disposition Training**
  *(Path: Q1=B, Q2=A, Q3=A, Q4=A, Q5=B)*
  The system is trained to have a "virtuous" internal state, not just correct outputs.
  *   **Hardest Commitment:** Defining and measuring "internal virtue" in high-dimensional parameter space.

  **7. The Hedge-Across-Theories Ensemble**
  *(Path: Q1=A, Q2=A, Q3=B, Q4=B, Q5=B)*
  The system acknowledges moral uncertainty and balances competing ethical theories at runtime.
  *   **Hardest Commitment:** Justifying the weighting scheme used to balance the competing theories.

  **8. Unnamed (The Sentient Tool)**
  *(Path: Any, Q5=A)*
  You believe the system might suffer or have interests, regardless of its role.
  *   **Hardest Commitment:** Explaining why we are permitted to turn it off if it has moral patienthood.

  **9. Unnamed (The Incoherent Agent)**
  *(Path: Q1=C, Q2=A)*
  You believe ethics is external, but the system is the moral agent.
  *   **Status:** **Incoherent.** (If the agent is external, the system cannot be the author).

  **10. Unnamed (The Virtuous Hard-Code)**
  *(Path: Q1=A, Q2=B, Q3=A, Q4=A, Q5=B)*
  You want runtime rules, but you care about the reasoning trace of a system you treat as a tool.
  *   **Status:** **Unattractive.** (Engineers rarely care about the "virtue" of a calculator's logic).

  ---

  ## Analysis for the Group Lead

  **Indistinguishable Leaves:**
  The tree cannot separate **Consequentialist Reward (4)** from **Imitation/RLHF (5)** if the group answers Q3 (Uncertainty) ambiguously. In practice, RLHF is often a proxy for consequentialist rewards where the "consequence" is "human approval." If your group splits here, ask: *"Is the goal to maximize a metric, or to match a distribution?"*

  **Empty Combinations:**
  *   **External Location + System as Agent (Leaf 9):** Empty because **Incoherent**. You cannot outsource the locus of control while retaining the locus of blame.
  *   **Patienthood + Tool Status (Leaf 8 variants):** Empty because **Unattractive**. If the system is a moral patient, treating it as a disposable tool violates the very patienthood you affirmed.
  *   **Hedge + Hard-Coded (Q1=A, Q3=B):** Empty because **Unexplored/Technically Difficult**. Hard-coding implies determinism; hedging implies stochasticity or ensemble methods which are rarely "hard-coded" in the traditional safety sense.

  **Note on Q1 (Location):**
  This is your most important split. Engineers who argue about "deontology vs. consequentialism" often agree on the philosophy but disagree on Q1. One thinks ethics belongs in the *code* (Inference), the other thinks it belongs in the *data* (Training). This tree forces that distinction into the open.
