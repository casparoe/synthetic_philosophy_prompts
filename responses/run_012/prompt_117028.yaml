      *(Refining the "Anscombe vs. Filler" label)*: I will use tags like `[ANS COMBE]` and `[OPERATIONAL FILL]` to make it distinct.

      *(Refining the "Misreading Anscombe" section)*: Anscombe was notoriously difficult. She rejected the "psychological state" view of intention in favor of the "description of action" view. I need to make sure I capture that. She would say if the plan *relies* on the outcome, it is intended, regardless of how sad the commander is about it.

