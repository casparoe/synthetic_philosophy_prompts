answer: |-
  Here is the procedure, the application, and the critique. I have kept the tone direct. You do not have time for hedging, and neither do I.

  ### The Anscombe Audit (Decision Procedure)

  **Instructions:** Open the strike file. Read the "Commander's Intent" and "Expected Effects" sections first. Answer the following five questions in order. If you answer **NO** to any question in Section A, the file stops. If you reach Section B, the call moves to the Commander, but your note must flag the specific risk.

  **Section A: The Structure of Intention (Hard Stops)**

  1.  **Is the civilian harm necessary for the military advantage *as described in the plan*?**
      *   *Test:* If the civilians were magically removed from the equation (no deaths, no suffering), would the specific chain of events leading to victory still function exactly as plotted?
      *   *Sufficient Answer:* "Yes, the objective is achieved without their harm."
      *   *Terminating Answer:* "No, the pressure/coercion relies on their suffering/death."
      *   *Tag:* **[ANS COMBE]**. This is the core of *War and Murder*. If the harm is the engine of the success, it is intended.

  2.  **Is the harm cited as a benefit in the briefing materials?**
      *   *Test:* Scan the slide deck and transcript. Do planners use words like "degrade," "paralyze," "pressure," or "deter" regarding the *civilian* system or population?
      *   *Sufficient Answer:* "Civilian impact is mentioned only as a risk to be mitigated."
      *   *Terminating Answer:* "Civilian impact is listed under 'Desired Effects' or spoken of as contributing to the mission."
      *   *Tag:* **[ANS COMBE]**. Anscombe argues intention is found in the *description of the action*, not the interior feelings of the agent. If the plan welcomes the effect, it intends it.

  3.  **Are we choosing this target *because* it is vulnerable to collateral damage?**
      *   *Test:* Is there an alternative target with equal military value but lower civilian risk that was rejected? Why?
      *   *Sufficient Answer:* "This target offers unique military value unavailable elsewhere."
      *   *Terminating Answer:* "This target was chosen because the collateral damage amplifies the psychological effect."
      *   *Tag:* **[OPERATIONAL FILL]**. Anscombe doesn't explicitly list target selection criteria, but this operationalizes her warning against "choosing to kill."

  **Section B: The Handoff (Values & Uncertainty)**

  4.  **Is the "Unknown" factor regarding civilian harm greater than 10%?**
      *   *Test:* Does intel have a solid count on presence? Are we guessing about secondary effects (like the substation case)?
      *   *Action:* If **YES**, mark file: **"EPISTEMIC GAP."** Do not stop the file, but require the Commander to sign that they are accepting *unknown* civilian deaths, not *calculated* ones.
      *   *Tag:* **[OPERATIONAL FILL]**. Anscombe assumes we know what we are doing; modern warfare often relies on guesswork. This forces accountability for the guess.

  5.  **Does the Proportionality Calculation rely on the "Intended" harm?**
      *   *Test:* If you strip out the civilian suffering from the "Advantage" side of the scale, does the math still hold?
      *   *Action:* If **NO**, mark file: **"PROPORTIONALITY INFLATED."** Hand to Commander.
      *   *Tag:* **[ANS COMBE]**. You cannot weigh the good of the mission against the bad of the civilians if the bad is part of how the good is achieved. That is murder, not calculation.

  ***

  ### Application to Cases

  Here is how the Audit runs on your three scenarios. I have not hedged the outcomes.

  **Case 1: Regional Electrical Substation (Dialysis/ICU Risk)**
  *   **Q1 (Necessity):** *No.* The plan states victory comes from "pressure on the government." The pressure is generated by the humanitarian crisis (deaths of patients). If the patients didn't die, the "pressure" mechanism fails.
  *   **Q2 (Benefit):** *Yes.* "Blacking out the capital pressures the government." The pressure is the benefit; the deaths are the source of the pressure.
  *   **Q5 (Proportionality):** *Inflated.* The military advantage (negotiation) is causally dependent on the civilian harm.
  *   **Verdict:** **STOP.**
  *   **Anscombe Diagnosis:** This is the Truman case. The deaths are not side effects; they are the mechanism of coercion. To say "we only intend the blackout" is a lie if the blackout is only valuable because it kills people.
  *   **Note to Commander:** "The theory of victory relies on civilian mortality. Under DDE, this constitutes intended killing of innocents as a means. Cannot be authorized as a 'side effect.'"

  **Case 2: Bridge with Bus (Strike regardless of bus)**
  *   **Q1 (Necessity):** *Yes.* The bridge falls whether the bus is there or not. The military advantage (cutting supply) is achieved without the deaths.
  *   **Q2 (Benefit):** *No.* The bus deaths are not listed as a desired effect.
  *   **Q3 (Vulnerability):** *No.* The target is the bridge structure, not the traffic.
  *   **Q4 (Unknown):** *Low.* Visual confirmation of the bus exists.
  *   **Verdict:** **PASS TO COMMANDER (with flag).**
  *   **Anscombe Diagnosis:** This is a classic Double Effect case. The act (destroying a military bridge) is good/neutral. The death is foreseen but not intended as a means or end.
  *   **Note to Commander:** "Civilians are foreseen collateral, not intended means. Structure of intention is lawful. Proportionality check rests with you."

  **Case 3: Dual-Use Telecom Hub (Civilian Paralysis Approved)**
  *   **Q1 (Necessity):** *Ambiguous/No.* Military value is genuine, *but*...
  *   **Q2 (Benefit):** *Yes.* Planners bring up civilian paralysis "approvingly." It is treated as a bonus feature of the strike.
  *   **Q3 (Vulnerability):** *Yes.* The dual-use nature is being exploited to maximize civilian disruption.
  *   **Verdict:** **STOP.**
  *   **Anscombe Diagnosis:** Anscombe warns specifically against this. When you "welcome" the civilian harm as part of the success profile, you have integrated it into your intention. You cannot claim it is merely foreseen if you are happy it is happening.
  *   **Note to Commander:** "Planners have integrated civilian harm into the success criteria. This converts foreseen risk into intended outcome. File requires rework to remove civilian paralysis from 'Desired Effects.'"

  ***

  ### Where This Misfires (The Risk Assessment)

  You asked where the procedure breaks. It breaks on **Question 4 (Epistemic Gap)** and **Question 1 (Necessity)** when faced with **Momentum.**

  **The Misfire:**
  The most dangerous moment is when the answer to Q1 is "We don't know if the deaths are necessary for the pressure, but it *might* help." In a 48-hour cycle, "might help" slides into "military necessity." The procedure asks for a binary Yes/No on causality. In complex systems (power grids, telecom), causality is fuzzy.
  *   **The Slide:** The intel officer says, "We can't prove the deaths cause the negotiation, but we can't rule it out." The procedure demands a "No" to stop the file. But the momentum of the operation treats uncertainty as permission.
  *   **The Fix:** You need a "Presumption of Intent" clause. If the planners *cannot articulate* how the victory happens without the civilian harm, you must presume the harm is intended. If they can't explain the victory path without the suffering, the suffering is doing the work.

  **What Would Change My Mind:**
  I would abandon this operationalization if you could demonstrate that **modern military intention is purely psychological.**
  *   *The Argument:* If "intention" is solely a mental state inside the Commander's head, and not a structural feature of the plan, then my Q2 (checking the briefing slides) is invalid. A Commander could sincerely feel sad about the deaths while relying on them structurally.
  *   *The Evidence:* If you show me a case where a Commander was exonerated because they *felt* bad about the civilian deaths, even though the plan relied on those deaths to succeed. Anscombe rejects this psychological view (she focuses on the action's description), but current JAG practice often accepts the "sincere regret" defense. If your legal team tells you "sincerity trumps structure," this procedure is useless to you.

  ***

  ### On Your Reading of Anscombe

  You asked me to say plainly if you are misreading her. **You are being too generous to your colleagues.**

  You wrote: *"I've started accepting 'that's a side effect, not a means' whenever the officer saying it seems sincere."*

  Anscombe would tell you that **sincerity is irrelevant.**
  In *War and Murder*, she attacks the idea that we can look inside a man's soul to find his intention. Intention is public. It is found in the **plan**.
  *   If the plan says "A causes B causes C," and C involves dead civilians, and the goal is C, then the civilians are intended.
  *   It does not matter if the officer cries while signing the order.
  *   It does not matter if they say "I wish they didn't have to die."
  *   If the death is part of the *story of how we win*, it is intended.

  You are worried you've gone soft. You have. You are treating "intention" as a feeling (psychology) rather than a logical relation between act and end (philosophy of action).

  **Does the distinction do this much work?**
  Yes, but only if you stop asking "What did you feel?" and start asking "What does the plan do?"
  Anscombe would argue that in Case 1 (Substation) and Case 3 (Telecom), the distinction *collapses*. You cannot separate the military advantage from the civilian harm. When the distinction collapses, the act is murder. She would not let you write a note saying "foreseen but disproportionate." She would require you to write "intended killing of innocents."

  **Final Advice:**
  Your note needs to be usable by people who skip the second paragraph.
  **First Sentence:** "This strike relies on civilian harm to achieve its objective."
  **Second Sentence:** "That makes the harm intended, not collateral."
  **Third Sentence:** "I cannot certify this as lawful under Double Effect."

  If they skip the rest, they have seen the three sentences that matter. If they stop the strike, you did your job. If they strike anyway, you have your record for the inquiry that will come later. Anscombe was willing to be unpopular for this. You should be too.
