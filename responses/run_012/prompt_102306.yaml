answer: |-
  This is a remarkably crisp transcript of a debate that philosophers and game theorists have been having for about fifty years. Your flatmates are inadvertently reenacting the conflict between **Causal Decision Theory (CDT)** (Rob) and a mix of **Evidential (EDT)** and **Functional Decision Theory (FDT)** (Nadia).

  Neither is "wrong" in a way that disproves the other, because they are arguing from different axioms about what rationality *is*. However, they do score points off each other on specific moves.

  Here is the move-by-move breakdown, followed by what both of them are missing.

  ### Move-by-Move Analysis

  **Nadia (1): The Evidential Claim**
  *   **Argument:** My choice is evidence that similar agents will make the same choice. Therefore, my expected utility includes their correlated contributions.
  *   **Verdict:** **Nadia is theoretically consistent, but empirically bold.**
  *   **Why:** She is stating the core tenet of Evidential Decision Theory. If the world is deterministic enough that people like her reason like her, her choice *is* statistically correlated with theirs. However, she asserts the correlation exists without proving it. She assumes the "reference class" (people like her) is well-defined.

  **Rob (2): The Causal Objection**
  *   **Argument:** Correlation is not causation. I cannot causally influence their choice. Therefore, my money is wasted.
  *   **Verdict:** **Rob is right on causality, but begs the question.**
  *   **Why:** Rob is correct that Nadia has no *causal* lever over the other contributors. In standard economics, this is the winning argument. However, he assumes that *causal* influence is the only thing that matters for rationality. He dismisses the possibility that the decision algorithm itself is the shared variable.

  **Nadia (3): The Definition of Rationality**
  *   **Argument:** Rationality is about maximizing expected utility given your evidence, not about having causal control.
  *   **Verdict:** **Draw (Philosophical Stalemate).**
  *   **Why:** This is the crux of the debate. Nadia is defining rationality as "getting the best outcome" (which might require acausal coordination). Rob defines it as "exercising agency." Nadia is right that we often care about outcomes more than leverage, but Rob is right that acting on evidence without control can lead to delusion (e.g., dancing for rain).

  **Rob (4): The "Moon Landing" Counterexample**
  *   **Argument:** If evidence is enough, a conspiracy theorist can claim their belief coordinates with others to make it true. Your theory allows magical thinking.
  *   **Verdict:** **Rob wins this point.**
  *   **Why:** This is a devastating objection to naive Evidential Decision Theory. If I can boost the expected utility of an outcome simply by believing it correlates with others, I can rationalize anything. Nadia's framework in Move 1 is vulnerable to "spurious correlations." Rob correctly identifies that she needs a constraint on *which* correlations count.

  **Nadia (5): The Algorithmic Distinction**
  *   **Argument:** Beliefs aren't choices. The correlation only counts if others are running the same *decision procedure* on the same *problem*.
  *   **Verdict:** **Nadia recovers ground.**
  *   **Why:** Nadia effectively upgrades from Evidential Decision Theory to **Functional Decision Theory (FDT)**. She distinguishes between *statistical similarity* (Rob's moon landing guy) and *logical similarity* (agents running the same source code). This blocks Rob's counterexample because the conspiracy theorist cannot *choose* to believe; Nadia is choosing an output of an algorithm.

  **Rob (6): The Empirical Burden**
  *   **Argument:** Is it actually true that strangers are running your algorithm? That's an empirical claim, not a logical truth. You're assuming the correlation to prove the correlation.
  *   **Verdict:** **Rob wins this point.**
  *   **Why:** Rob puts the burden of proof where it belongs. Nadia is treating logical correlation as a metaphysical guarantee. In reality, "running the same decision procedure" is a spectrum. How similar must a stranger be? If Nadia is wrong about the similarity, she loses her money and gets no public good. Rob is correctly pointing out that she is gambling on a psychological hypothesis.

  **Nadia (7): The Fixed Point Defense**
  *   **Argument:** Symmetry creates a stable equilibrium. If the logic holds, the outcome is stable regardless of causal impact.
  *   **Verdict:** **Nadia is theoretically sound, but practically evasive.**
  *   **Why:** She is describing a Nash Equilibrium or a logical fixed point. If everyone reasons this way, everyone cooperates, and everyone is better off. However, she ignores Rob's empirical point: *Are* everyone reasoning this way? She asserts the logic is sound (it is), but ignores the implementation risk (which Rob highlighted).

  ---

  ### What Both of Them Are Missing

  While they are sparring over decision theory, they are both ignoring three critical practical factors that determine who actually loses money here.

  **1. The Threshold Problem (The "Pivot" Probability)**
  They are arguing as if the public good is continuous (every pound helps a little). But Nadia said it "only does any good if loads of other people do it too." This implies a **threshold**.
  *   **The Miss:** In threshold scenarios, the only time your money matters causally is if you are the *pivot* (the exact person who tips the scale).
  *   **Rob's Error:** He assumes the probability of being the pivot is zero. It's low, but not zero.
  *   **Nadia's Error:** She assumes her contribution counts even if the threshold isn't met, relying entirely on the acausal correlation. If the threshold fails, her money is gone regardless of how many "logical clones" donated.

  **2. The "Reference Class" Problem**
  Nadia relies on there being "lots of other people in almost exactly her position."
  *   **The Miss:** How does she define "exactly her position"? If she defines it narrowly (people who have read the same philosophy papers), there might be only 50 of them, and her £2,000 won't move the needle. If she defines it broadly (people who care about the cause), they aren't running her decision algorithm.
  *   **Rob's Point Reinforced:** She is likely overestimating the density of her "logical clones." This is a common cognitive bias (the False Consensus Effect).

  **3. The Cost of Being Wrong (Asymmetry of Risk)**
  *   **The Miss:** They treat the payoff as symmetrical. It isn't.
  *   **If Rob is right:** Nadia loses £2,000. The public good fails.
  *   **If Nadia is right:** The public good succeeds (presumably).
  *   **The Real Question:** Is the expected value of the public good high enough to justify a £2,000 gamble on a philosophical hypothesis? Nadia is treating a metaphysical debate as a bet with her savings. Rob is treating a potential coordination breakthrough as a superstition.

  ### Summary Verdict

  *   **On Theory:** **Nadia** has the more sophisticated model. She successfully navigated from EDT to FDT to avoid Rob's "Moon Landing" trap. If the universe is deterministic and populated by similar agents, she is right.
  *   **On Practice:** **Rob** has the safer heuristic. He correctly identifies that Nadia is making an unproven empirical assumption about the minds of strangers. In the real world, assuming correlation without causal leverage is often how people get scammed.

  **Who should you tell to shut up?**
  Tell Nadia that she needs to calculate the probability of her "logical clones" actually existing in sufficient numbers before betting rent money on it. Tell Rob that if everyone followed his advice, no public goods would ever be funded, and he would be worse off in the long run.

  They are both half-right. Nadia is playing the game on "Hard Mode" (requiring deep philosophical alignment), and Rob is playing on "Easy Mode" (requiring only causal physics). In a world of strangers, Rob usually survives longer. In a world of allies, Nadia wins bigger.
