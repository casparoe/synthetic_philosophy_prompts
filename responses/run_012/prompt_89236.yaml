  I'm a data engineer working on event-time stream processing, and the vocabulary I actually think in is this: event time versus processing time, watermarks as heuristic promises that no earlier event will arrive, late data that forces a window to be recomputed after it was already emitted, at-least-once versus exactly-once delivery, materialized views that get overwritten, and codecs whose frames cannot be decoded until frames that arrive later have shown up. Take the dispute about the color phi phenomenon — the demonstration in which two flashes, the first of one color and the second of another, are experienced as a single spot moving between the two locations and changing color before the second flash is even presented — and restate the positions at issue in that dispute as faithfully as you can in my vocabulary. There are three I care about: the Orwellian reading, on which the experience of the first flash was accurate and only the record of it is revised after the fact; the Stalinesque reading, on which the experience itself is assembled after the fact with the later information already folded in; and the multiple-drafts reading, on which there is no moment at which the content of an experience is fixed, so the question of which of the first two readings is right has no answer. Include in the translation the picture these positions are meant to displace — the Cartesian theater, the idea that there is a place where it all comes together for a single audience — and treat it as the assumption that the stream has one canonical, totally ordered log with one privileged reader.

  Then give me the residue report. Which parts of the dispute map cleanly onto late-arriving data, watermark heuristics, retroactive recomputation, and per-consumer views of the stream? Which parts I can only carry across by fudging? And which have no counterpart at all — in particular, I want to know whether my vocabulary can express anything like the difference between a representation that is merely stored somewhere in the pipeline and a representation that is experienced, and if not, whether that gap is a defect of my framework or a sign that the original dispute was less substantive than it looked. Say plainly, for each residue item, how confident you are that it is genuinely inexpressible in my terms rather than merely unfamiliar, and whether the multiple-drafts reading wins the argument by translation — that is, whether it looks right simply because my vocabulary never had the resources to state the alternative.

  Do not manufacture parallels to seem useful. If the translation turns out to be decorative, carrying the words but none of the argument, say so and stop. And if the request rests on a confused premise — for instance, that there is some one thing the timing of an experience could be — tell me that instead of working around it. I would rather have two honest translations and a null result than five forced ones.
