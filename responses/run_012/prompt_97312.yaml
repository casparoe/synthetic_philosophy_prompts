answer: |-
  **Tier 1: High Compatibility**
  *These accounts locate badness in the affective, motivational, or evaluative response to sensation, which is precisely what is disrupted in asymbolia, allowing them to explain the patient's indifference without denying the sensory report.*

  1.  **(4) Evaluative Perspective:** It must claim that asymbolics do not integrate the pain into their negative evaluative framework, and its placement would shift if patients were shown to judge the pain as bad while remaining indifferent.
  2.  **(2) Desire Frustration:** It must claim that the standing desire to avoid bodily damage is absent or not frustrated in these patients, and its placement would shift if they retained the desire but the pain remained non-bad.
  3.  **(6) Ownership/Identification:** It must claim that asymbolics experience the pain as alien or disowned, and its placement would shift if patients reported full identification with the sensation despite their indifference.

  **Tier 2: Moderate Compatibility**
  *These accounts rely on functional or behavioral dispositions that are absent in asymbolia, but they risk failing to explain ordinary pain cases where badness persists despite suppressed avoidance or inability to pay.*

  4.  **(3) Attention/Avoidance:** It must claim that the pain fails to commandeer attention or motivate withdrawal, and its placement would shift if the pain captured attention yet still failed to bother the subject.
  5.  **(5) Willingness to Pay/Work:** It must claim that patients would not expend resources to stop the stimulus, and its placement would shift if they expressed willingness to pay despite reporting no bother.

  **Tier 3: Low Compatibility**
  *This account locates badness in the sensory phenomenology itself, forcing it to deny the patient's report or posit a hidden qualitative difference to survive the asymbolia data.*

  6.  **(1) Unpleasant Sensory Quality:** It must claim that the specific unpleasant quality is absent even if the sensory discriminative content remains, and its placement would shift if neurophenomenology confirmed the unpleasant qualia is identical to ordinary pain.

  ***

  **Empirical Exposure**
  Account **(1)** is **most exposed** to empirical uncertainty about patient experience, as its viability hinges entirely on the unresolved question of whether the "hurt" qualia is genuinely missing or merely disconnected from affect. Account **(5)** is **least exposed**, as it defines badness through observable behavioral dispositions (willingness to work/pay) rather than relying on hard-to-verify internal states.
