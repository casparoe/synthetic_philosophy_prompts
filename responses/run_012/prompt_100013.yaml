answer: |-
  The current asylum system assumes that refuge is owed primarily when a state betrays a citizen through discriminatory targeting, whereas your friend's proposal shifts the ethical basis to a universal right to safety whenever state protection fails.

  The existing framework rests on a theory of "political betrayal" rather than pure humanitarian need. By requiring a nexus to race, religion, nationality, political opinion, or particular social group, the system presumes that suffering alone is insufficient to trigger international obligations; the suffering must be linked to a failure of the political order to treat the individual as an equal citizen. This implies that the moral wrong of persecution is not just the violence itself, but the exclusionary intent behind it. The state is viewed as the primary protector, and international intervention is reserved for when that state becomes an agent of discrimination or selectively abandons its duty to specific segments of the population. This is why generalized violence, like a civil war or a hurricane, usually doesn't qualify; in those scenarios, the state is seen as failing everyone equally, so the bond of citizenship isn't broken in a way that demands surrogate protection from another nation.

  However, the theory is underdetermined on why exactly those five grounds matter. One interpretation is that the system is fundamentally anti-discrimination law, protecting immutable characteristics and fundamental choices. Another is that it is political law, designed to protect those who threaten or oppose the regime (political opinion) or are excluded from it (social group). The law doesn't decide between these; it accommodates both. Similarly, the requirement that the state be "unwilling or unable" to protect is underdetermined regarding moral blame. It doesn't matter if the state is malicious (unwilling) or just weak (unable); the result is the same. This suggests the core commitment is functional—the absence of protection—while the nexus grounds are the variable filter used to limit scope.

  Regarding what is strictly required versus contingent, the only strictly required commitment is the distinction between a refugee and an economic migrant. The system must have a limiting principle, or else any person facing hardship could claim asylum, which would collapse the concept of national borders entirely. The specific five grounds are contingent historical artifacts from the post-WWII era, chosen to address the crises of that time rather than derived from first philosophical principles. The requirement for state complicity is also theoretically contingent; one could imagine a system based solely on harm, but the current model requires it to maintain the fiction that asylum is surrogate state protection rather than global welfare.

  Your friend's reform proposal swaps the "political betrayal" theory for a "human security" theory. By removing the grounds list and focusing on the state's failure to provide basic protection from serious harm, the system would no longer ask why you were targeted, only that you were targeted and unprotected. Adding a category for structural harm acknowledges that some states are organized in ways that inherently endanger certain people without specific discriminatory intent, such as patriarchal systems enabling domestic violence. This is genuinely a different theory because it decouples desert from identity politics. Under the current model, the woman fleeing domestic violence must prove she belongs to a "particular social group" to show she was singled out; under the reform, she would qualify simply because the state failed to protect her from serious harm regardless of the reason. This shifts the obligation from correcting discriminatory state behavior to fulfilling a baseline human right to security, transforming asylum from a political remedy into a humanitarian safety net.
