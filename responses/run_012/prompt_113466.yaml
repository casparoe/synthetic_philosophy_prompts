answer: |-
  The family is established in meta-ethics as **Objections from Alienation**. It covers critiques where a theory's required motive undermines the value of the act or the agent's relation to it, even if the act itself is correct.

  **Taxonomy of Descriptions**
  Though often used interchangeably, these four terms mark distinct nodes in the family tree:
  1.  **Schizophrenia (Stocker):** The structural claim. Modern ethical theories create a psychic split between *justifying* reasons (utility, duty) and *motivating* reasons (love, friendship). The agent is divided against themselves.
  2.  **Alienation:** The phenomenological result of that split. The agent feels disconnected from the human values they are purportedly serving because their motive is external to those values (e.g., serving "the good" rather than the friend).
  3.  **One Thought Too Many (Williams):** A specific relational instance. In intimate contexts, explicit deliberation about duty or utility displaces the immediate, non-calculative concern constitutive of the relationship.
  4.  **Integrity (Williams):** The identity cost. When impartial theories require agents to view their own ground projects as dispensable inputs, the agent loses their sense of self. Here, the offending thought is "my projects matter only impartially."

  *Distinction:* Schizophrenia is the mechanism; Alienation is the experience; One Thought Too Many is the relational symptom; Integrity is the identity consequence.

  **Neighboring Objections**
  This family must be distinguished from two neighbors often collapsed into it:
  1.  **Overdemandingness:** This objects to the *cost* of the act (sacrificing everything), not the *motive*. You can be overdemanded without motivational defect (e.g., sacrificing life for love). Alienation objects even when the cost is low, provided the *thought* is wrong.
  2.  **Self-effacingness:** This objects to the theory's *guidance* (the theory says "don't consult me"), not the *motive's quality*. A self-effacing theory might avoid alienation by telling agents to ignore it; this family complains when agents *do* consult the theory and are thereby corrupted.

  **Edges and Instances**
  The objection applies only if the theory *requires* the thought for the act to be right, and the thought *motivates* the act. Mere permission or idle presence is insufficient; the thought must be the engine of the action. The shape survives outside morality, applying to etiquette, friendship, and aesthetics wherever motive constitutes value.

  *Placement of Instances:*
  1.  **The Friendship Steward:** This falls under **One Thought Too Many**. The calculative thought ("investing in deficit") is the defect. The act is right, but the deliberation treats the friend as a portfolio, undermining the intimacy required for the value to exist.
  2.  **The Promise Keeper:** This falls under **Schizophrenia/Alienation**. The institutional justification splits the agent from the personal obligation. The promise is kept, but as a "policy" rather than a commitment, creating a divide between the agent's reason (institutional stability) and the value of the act (fidelity).

  In both cases, the theory is not rejected for its verdicts, but for the psychological cost of arriving at them.
