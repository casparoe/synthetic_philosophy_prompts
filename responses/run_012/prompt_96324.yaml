  To the Technical Advisory Committee,

  **Re: Recommendations for the Five-Year Welfare Standard Revision**

  As we prepare to vote on the revised welfare standard, we must establish a consistent threshold for action. The scientific note confirms substantial evidence of nociception in finfish and decapods, though the inference to suffering remains contested. We cannot wait for philosophical consensus on sentience, yet we must avoid performative regulation that displaces harm rather than reducing it.

  I propose we adopt a criterion of **Proportionate Precaution**. A welfare requirement is warranted when three conditions are met: first, there is a non-negligible probability of sentience based on phylogenetic and behavioural evidence; second, a mitigation method exists that is technically feasible; and third, implementation does not create a 'leakage' effect where producers exit the scheme, leaving animals under lower-welfare conditions elsewhere. This distinguishes our current scope from farmed insects; while the sentience evidence may overlap, our mandate governs specific taxa, and the feasibility of mitigation differs across production systems. We must weigh the probability of suffering against the certainty of economic exclusion.

  Based on this, my recommendations are as follows.

  **Clause 1: Crustacean Slaughter**
  **Recommendation: Adopt with conditions.**
  We should require rendering insensible before processing, ending ice-slurry killing as a default. However, given the global scope of our standard and the UK Animal Welfare (Sentience) Act's specific jurisdiction, we must accommodate regional disparities.
  *Condition:* Implementation shall be phased over 24 months. Species without a validated stunning protocol at the time of adoption are granted a derogation, subject to review every 12 months. Suppliers must demonstrate progress toward validation to retain certification.
  *Change of mind:* I would vote to **Reject** this clause if evidence emerges showing that electrical stunning causes immediate mortality without insensibility, or if ice-slurry chilling is proven to induce instantaneous insensibility without distress.
  *Where I may be wrong:* I may be overestimating the speed at which smallholder suppliers can access stunning technology. If adoption costs are higher than projected, the leakage risk increases.

  **Clause 2: Eyestalk Ablation**
  **Recommendation: Adopt with conditions.**
  Ablation is a significant welfare concern, but prohibiting it without a viable alternative risks collapsing the certified shrimp supply chain. A hard ban now would likely drive smallholders to uncertified buyers, worsening overall welfare.
  *Condition:* Adopt a 60-month phase-out schedule, contingent on the validation of at least one non-invasive maturation technique at commercial scale. The scheme must mandate a collective R&D fund, contributed to by certified buyers, to accelerate alternative development. If no alternative is validated by month 48, the clause reverts to 'Defer'.
  *Change of mind:* I would vote to **Defer** immediately if an economic impact assessment confirms that more than 30% of certified smallholder volume would be lost within the first 24 months, as this violates the 'no leakage' criterion of Proportionate Precaution.
  *Where I may be wrong:* I am assuming that financial incentives alone will drive the necessary R&D. It is possible that the biological constraints are harder to overcome than anticipated, rendering the phase-out timeline unrealistic.

  **Clause 3: Fish at Harvest**
  **Recommendation: Adopt.**
  The evidence for fish sentience is stronger than for crustaceans, and stunning methods are well-established for most major species. The requirement for trained personnel is a minimal burden with significant welfare upside.
  *Condition:* The derogation for species without validated methods must be narrow. Suppliers must submit a welfare risk assessment for any species slaughtered without stunning, reviewed annually.
  *Change of mind:* I would vote to **Adopt with conditions** (rather than straight Adopt) if industry data shows that trained personnel are unavailable in key regions, leading to botched stunning attempts that cause more suffering than current methods.
  *Where I may be wrong:* I may be underestimating the cultural resistance to certain stunning methods in regions where traditional slaughter holds religious or heritage significance. While our terms require respect for tradition, this clause may conflict with specific customary practices I have not fully accounted for.

  **Counter-Arguments and Uncertainty**
  The strongest case against these recommendations, particularly Clauses 1 and 2, is the leakage argument presented by producer representatives. If our standard becomes too costly or technically demanding, suppliers will sell to buyers with no welfare requirements. In this scenario, the animals suffer the burden of regulation without the benefit of protection. This is the 'worst-case regret' Adviser 2 warned against. I have attempted to mitigate this through phase-ins and derogations, but the risk remains.

  Furthermore, Adviser 3's point on probability is salient. By acting on contested evidence of suffering, we impose costs based on uncertainty. However, under Proportionate Precaution, the cost of inaction (potential widespread suffering) outweighs the cost of action (economic adjustment), provided leakage is managed.

  I am most likely to be wrong on the technical readiness for crustacean stunning. If the validated methods prove impractical in tropical smallholder contexts, Clause 1 becomes a barrier to entry rather than a welfare improvement. We must monitor this closely.

  These recommendations balance ethical ambition with practical reality. They signal our commitment to welfare science without ignoring the economic ecosystems in which these animals are raised.

  Yours sincerely,

  [Name]
  Independent Member, Technical Advisory Committee
