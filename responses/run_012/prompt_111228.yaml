prompt: |-
  I'm a novelist, about two-thirds through a book, and my two leads are philosophers of mind at a small institute whose funder made the grant conditional on them running an actual adversarial collaboration. He's a panpsychist — experience goes all the way down, whatever physics says is fundamental has an inside — and she's a physicalist who thinks suffering requires a certain kind of functional organisation, so fundamental physics is morally inert no matter what it turns out to be. The thing they co-sign is going to be printed in my book as an appendix and I can't have real philosophers laughing at me.

  So: put yourself in the role of someone who's refereed in both these literatures for twenty years, think hard before you write anything, and brainstorm the cruxes first in a scratchpad before drafting. What I need is the document itself — a numbered section of claims both of them could actually sign (about what physics does and doesn't tell us, about what moral considerability requires, about what their fight is *not* about), then a table of the genuine disagreements, each row giving the question, each side's position in wording that side would accept, the crux underneath it, whatever both agree would bear on that crux (a thought experiment, an argument, an empirical result), and each side's prediction written down in advance. At least one crux should be whether micro-experience could add up to anybody who suffers, one whether 'there's something it is like' is the same claim as 'there's someone who can be worse off', and one whether any of this could ever change what we do. If part of their dispute is just verbal, say which part and why, and flag any row where you think one side's position isn't one a serious person could hold. Don't bother with citations or reading lists, they both know the advesarial literature cold — I just need the prose.
