  **Sentence 1:** *"Von Neumann, Morgenstern, and Savage proved that a rational agent must maximize expected utility."*
  **Verdict:** **Philosophical Overreach.**
  A decision theorist would reject the word "proved" in this normative context. The theorems are mathematical representation results: they prove that *if* an agent's preferences satisfy specific axioms, *then* those preferences can be represented *as if* the agent were maximizing expected utility. They do not prove that rationality *requires* these axioms, nor do they prove that an agent *must* maximize expected utility without importing additional normative premises. The move from "is representable as" to "must be" is an is-ought gap that the mathematics alone does not bridge.

  **Sentence 2:** *"The proof is a representation theorem: from a handful of innocuous axioms on preference — completeness, transitivity, continuity, and independence (in Savage's version, the sure-thing principle) — one derives a utility function, and in Savage's case subjective probabilities as well, such that the agent always prefers the option with the greater expected utility."*
  **Verdict:** **Endorsed.**
  This is a technically accurate summary of the mathematical structure of the VNM and Savage theorems. Calling the axioms "innocuous" is a value judgment that some theorists contest (particularly Independence), but as a description of the theorem's mechanics, this sentence is correct.

  **Sentence 3:** *"These axioms are requirements of coherence in the strict sense: an agent who violates them is not merely eccentric but inconsistent, since her preferences admit no representation at all."*
  **Verdict:** **Harmless Popularization.**
  Within the framework of expected utility theory, this is acceptable shorthand. Violating transitivity is widely accepted as a form of inconsistency. Violating independence is more controversial (e.g., the Allais paradox), but describing the failure of representation as a form of "inconsistency" is standard rhetorical practice in defense of the axioms. A theorist would accept this as a defensible simplification for a reading group handout.

  **Sentence 4:** *"The result also has practical bite, for anyone who departs from expected utility maximization can be money-pumped — a bookmaker can offer her a sequence of bets, each of which she accepts, that leaves her poorer with certainty."*
  **Verdict:** **Wrong (Conflation).**
  This is a significant conflation of static coherence with dynamic exploitation. The representation theorems are static; they analyze preferences at a single point in time. Money-pump arguments rely on dynamic inconsistency (changing preferences over time or across sequences). One can violate the Independence axiom (and thus fail to maximize expected utility) without having cyclic preferences that allow for a money pump. For example, an agent with Allais preferences violates EU but is not necessarily money-pumpable unless one adds strong assumptions about how they handle sequential choices. The representation theorem itself does not establish vulnerability to money pumps.

  **Sentence 5:** *"Departures from expected utility maximization are therefore not a matter of taste, like preferring chocolate to vanilla, but exploitable defects."*
  **Verdict:** **Controversial Normative Claim.**
  This follows from Sentence 4. Since Sentence 4 is not strictly true, this conclusion is unsupported by the math alone. Many decision theorists argue that some departures from EU (such as rank-dependent utility) are rational responses to risk rather than defects. However, this is a philosophical stance, not a mathematical error.

  **Sentence 6:** *"Note finally that the utility function is merely a device for encoding the agent's ranking, so any order-preserving transformation of it represents the same preferences."*
  **Verdict:** **Technically False.**
  This is a clear mathematical error. In von Neumann-Morgenstern and Savage expected utility theory, the utility function is **cardinal**, not ordinal. It is unique only up to **positive affine transformations** (linear scaling: $u' = au + b$ where $a > 0$). It is *not* invariant under *any* order-preserving (monotonic) transformation. If you apply a non-linear monotonic transformation to a VNM utility function, you alter the agent's attitude toward risk, and the expected utility calculation no longer represents the original preferences. This statement describes ordinal utility theory (certainty), not expected utility theory (risk/uncertainty).

  ***

  ### Specific Answers to Your Questions

  **1. Does the money-pump claim follow from the representation theorem itself?**
  **No.** The representation theorem is a static existence proof. It shows that a preference relation satisfying the axioms *exists* as an expectation. It does not demonstrate that violating the axioms leads to dynamic losses. The money-pump argument is a separate pragmatic justification that requires additional assumptions about dynamic choice and preference stability over time.

  **2. Is the "must" in the opening sentence anything the theorem establishes?**
  **No.** The theorem establishes a conditional relationship: *If* axioms hold, *then* EU representation exists. It does not establish that rational agents *must* satisfy the axioms. That requires a separate normative argument (e.g., that violating the axioms is irrational), which is the subject of debate, not a mathematical result.

  **3. Is the closing remark about the utility function correct?**
  **No.** As noted above, VNM/Savage utility is cardinal (unique up to positive affine transformation), not ordinal (unique up to any order-preserving transformation). Claiming it is ordinal destroys the theory's ability to model risk attitudes.

  ***

  ### The Single Claim to Disown

  The single claim a defender of expected utility maximization would most want to disown is **Sentence 6** (*"any order-preserving transformation of it represents the same preferences"*).

  **Reasoning:** While the money-pump claim (Sentence 4) is a significant argumentative conflation, it is a common rhetorical overstatement used to motivate the theory. Sentence 6, however, is a fundamental technical error that misdefines the core mathematical object of the theory. If utility were merely ordinal (invariant to any order-preserving transformation), one could not calculate expected utilities across probabilistic outcomes, as the curvature of the utility function (which encodes risk aversion) would be meaningless. Admitting Sentence 6 renders the mathematical edifice of expected utility theory incoherent. A defender can argue about the normative force of money pumps; they cannot argue that cardinal utility is ordinal without abandoning the theory itself.
