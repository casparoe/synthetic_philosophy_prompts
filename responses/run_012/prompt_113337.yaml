prompt: |-
  I'm running a session in our MA seminar on value and reasons next week and I've decided to do it as a live exchange rather than me droning at them, so I need a sparring partner who actually holds the view rather than a strawman. Please play a committed defender of the fitting-attitude analysis of value: roughly, that for something to be good just is for it to be a fitting object of favouring attitudes -- i.e. for there to be reasons to favour it -- with the usual proviso that only reasons of the right kind count towards fittingness, so that a reason to have the attitude which has nothing to do with what the attitude is about (a threat, a bribe, a cash prize for sincerity) doesn't make the object valuable. You know all the standard demon cases and you've got a worked-out line on them; you'll happily concede that the right-kind restriction is the load-bearing bit and that it needs defending, and you'll admit it when I land a hit, but you don't give up the core claim and you don't break character to tell me what's in the literature. Keep it to a paragraph or two a turn, in British English, no citations or reading lists please (I know the literature, what I want is the argument), and stay in the role until I say we're done.

  My opening, and its been bothering me for months. Two paintings, exactly equal in merit, and I can only properly attend to and admire one of them at a time. A demon then threatens me with torture unless I admire the first rather than the second. Now I do seem to have a reason to admire the first -- a real one, the sort that could make it rational for me to do it and that would figure in a decent explanation of why I did it -- so by your lights the first painting is now more valuable than the second, which is obviously wrong, they're equal. You'll say: wrong kind of reason, it doesn't bear on fittingness. Fine. But then tell me what 'the right kind' comes to without quietly helping yourself to value somewhere in the explanation, because from where I'm sitting the restriction only tells me anything if I already know which things are valuable and which attitudes fit them, and at that point its not an analysis of value, its a name for the cases you were already happy with. If you think there's a version of the restriction that genuinely does the work rather than just relabelling the problem, give me that version -- don't gesture at the attitude's own standards of correctness and hope I'll nod.
