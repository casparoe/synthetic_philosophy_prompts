prompt: |-
  I'm a postdoc in a stats department and I've been roped into giving the Friday seminar slot in two weeks, which is normally where we argue about priors over coffee, except this time someone decided we should have "a philosophy session" and somehow that someone is me. Forty-five minutes, whiteboard, no slides. The room is stats PhD students plus two econometricians who've never taken a philosophy course in their lives, and their default reaction to anything that smells like a word game is open contempt, so I need this to feel like its about something rather than about how philosophers define words. I want to do the lottery paradox and the preface paradox together, because I'm fairly sure they're one thing wearing two hats, and that's the payoff I want people to walk out with, or at least the thing I want them to argue with me about afterwards.

  Don't explain either paradox to me, I can state them both: for each of a thousand tickets it's near-certain that that ticket loses, so I seem entitled to believe it of each one, and yet I can't believe it of all of them at once since I know one of them wins; and an author believes each of the many things she asserts in a long book and also believes, with good reason, that she got at least one of them wrong. What I want from you is a teaching plan for the forty-five minutes. What has to be in place before the first of these can land as a genuine puzzle instead of a trick with words -- my hunch is that the audience has to have swallowed the idea that rational belief is closed under conjunction without ever noticing that they've swallowed it, and I'm not sure how to make them notice. Which of the two should come first, and why? What single example carries the whole session, and what does that example have to have, and what does it have to lack, to do the work? And tell me whether my pet idea for a unifying example is clever or a trap: an author writes a thousand very short chapters, one per ticket, each of which does nothing but assert that that ticket loses, and then writes a preface admitting she must be wrong somewhere. I like it because both paradoxes show up in one object, but I worry it hands them the resolution for free, or that it's to cute to think with.

  The thing I most need the plan to handle is that my colleagues' reflex will be "just use credences, then there's no paradox" -- I definately don't want to wave that off, so tell me where in the sequence that objection should come up, what the plan should say it does buy and doesn't buy, and whether treating the chapters as independent near-certain claims, so the conjunction comes out with probability around .99^1000, is a help here or a distraction. Beyond that: the misconceptions I should expect and exactly where in the sequence each one should be headed off (my guesses are "she's just being modest," "rational belief has to be consistent, so she's being irrational," "raise the threshold," "it's a bookkeeping artifact, nobody actually believes the conjunction," and "make everything probability 1 and you're fine"), one question to ask at the end that would actually show me whether they've got it rather than whether they can nod along, and what I should openly refuse to get into at this level and say so out loud. Write it as plain prose, please -- no headings, no bullet points, no bold, no tables, just paragraphs the way you'd write an email; I'll be reading it on my phone on the train and lists make me lose the thread.
