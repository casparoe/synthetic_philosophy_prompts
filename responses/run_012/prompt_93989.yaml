prompt: |-
  I chair the science curriculum review for a mid-sized school district. Each adoption cycle brings a stack of proposed units, and more of them now arrive dressed as science — data tables, references, the word "study" — from fields our committee cannot agree on. We have to vote on every unit within a single meeting, most members have no background in philosophy of science, and whatever we approve stays in classrooms for years. I need a decision procedure, not an essay: the questions to put to a unit in order, what counts as a sufficient answer to each, the point at which the procedure can stop with a clean "this is not science," and the point at which it must hand the call back to the committee because the remaining question is about values rather than facts.

  Ground it in the best accounts of how to draw the science/non-science line — falsifiability and its refinements — but make it survive the standard objections rather than ignore them. Any hypothesis can be rescued by adjusting a background assumption or adding an ad hoc rider, so "is it falsifiable?" alone will admit almost anything; some respectable science (statistical claims, existence claims, historical reconstructions) is not falsifiable in the naive sense; and a hypothesis gains nothing from predicting a result that any arbitrary addition to it would predict just as well. The procedure should also distinguish a line of work that keeps generating new testable successes from one that only patches holes, and it should be explicit about where it is applying a test of falsifiability versus a test of truth.

  Run it on three units: (1) a young-earth unit that argues from geology and scripture and makes specific, checkable claims; (2) a unit teaching that students have fixed "learning styles" that teachers should match, supported by the usual studies; (3) a cosmology unit on an unobservable multiverse, drawn from mainstream physics, with no direct evidence. Tell me where the procedure returns an answer the committee will not like. Close with what the procedure cannot do — the steps that are judgment in method's clothing, and the cases where I should simply tell the committee it is voting on values.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a science curriculum review committee for a mid-sized school district.
      *   **Problem:** Too many proposed units, some pseudoscience disguised as science, committee lacks philosophy of science background, high stakes (approval lasts years), need to vote in a single meeting.
      *   **Task:** Create a *decision procedure* (algorithm/checklist), not an essay.
      *   **Requirements:**
          *   Grounded in demarcation criteria (falsifiability + refinements).
          *   Address standard objections (Duhem-Quine thesis, ad hoc hypotheses, statistical/historical science).
          *   Distinguish progressive vs. degenerative research programs (Lakatos).
          *   Distinguish falsifiability tests from truth tests.
          *   Identify the point where it becomes a values judgment.
          *   Apply to three specific test cases (Young-Earth, Learning Styles, Multiverse).
          *   Highlight uncomfortable answers.
          *   Conclude with limitations (judgment in method's clothing, values voting).

  2.  **Theoretical Framework Selection:**
      *   *Popper (Falsifiability):* Necessary but insufficient (too naive).
      *   *Duhem-Quine (Holism):* Acknowledge that hypotheses aren't tested in isolation. Need to check if auxiliary assumptions are independently justified.
      *   *Lakatos (Research Programmes):* Crucial for distinguishing "patching holes" vs. "new successes." Progressive vs. Degenerative.
      *   *Kuhn (Paradigms):* Less useful for demarcation, more for sociological context. Skip for brevity.
      *   *Thagard (Consilience/Simplicity):* Useful for weighing explanatory power.
      *   *Betz (Decision Theory):* Keep it practical for a committee vote.

      *Decision:* The core engine will be a modified Lakatosian framework wrapped in Popperian falsifiability, with specific guards against Duhem-Quine maneuvering.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a step-by-step flow.
      *   *Step 1: Empirical Content (Popper).* Does it make claims about the observable world?
      *   *Step 2: Riskiness (Popper/Betz).* Could the evidence *possibly* contradict it?
      *   *Step 3: Auxiliary Assumptions (Duhem-Quine).* If it fails a test, does it blame independent factors or invent new ones?
      *   *Step 4: Progressiveness (Lakatos).* Is it predicting *novel* facts or just accommodating old ones?
      *   *Step 5: Consilience (Thagard/Whewell).* Does it fit with established science without constant friction?
      *   *Stop Conditions:*
          *   "Not Science": Fails Step 1 or 2 irreparably.
          *   "Values Call": Passes 1-4 but conflicts with community values or resource allocation (e.g., teaching controversial but scientifically valid topics).

  4.  **Refining the Criteria (Addressing Objections):**
      *   *Objection:* "Anything can be saved by ad hoc hypotheses."
      *   *Fix:* Step 3 must require auxiliary assumptions to be *independently testable*.
      *   *Objection:* "Historical/Statistical science isn't strictly falsifiable."
      *   *Fix:* Step 2 must allow for probabilistic falsification or "inference to the best explanation" where the explanation predicts *traces* in the present.
      *   *Objection:* "Truth vs. Method."
      *   *Fix:* Explicitly state the procedure tests *scientific status*, not *truth*. A false theory can be scientific (e.g., Newtonian physics).

  5.  **Running the Test Cases:**
      *   *Case 1: Young-Earth Creationism (YEC).*
          *   Claims: Specific geology, scripture.
          *   Test: Falsifiable? Yes (radiometric dating).
          *   Auxiliaries: When falsified, do they invent "God made it look old"? That's ad hoc and untestable.
          *   Program: Degenerative (constantly patching).
          *   Verdict: Not Science.
      *   *Case 2: Learning Styles.*
          *   Claims: Matching style improves outcome.
          *   Test: Falsifiable? Yes (RCTs).
          *   Evidence: Repeatedly falsified.
          *   Program: Degenerative (ignoring null results, redefining styles).
          *   Verdict: Not Science (Pseudoscience/Zombie Science). *Crucial distinction:* It *looks* like science but fails the progressiveness test.
      *   *Case 3: Multiverse.*
          *   Claims: Unobservable other universes.
          *   Test: Falsifiable? Directly? No. Indirectly? Yes (predictions about *our* universe's constants based on selection effects).
          *   Auxiliaries: Based on string theory/inflation (independently motivated?).
          *   Program: Progressive? Theoretically yes, empirically stalled.
          *   Verdict: Borderline/Science (Theoretical). *Uncomfortable:* It passes while YEC fails, even though both deal with unobservables. Why? Because Multiverse derives from math/models that *do* make testable predictions elsewhere; YEC derives from text.

  6.  **Identifying the "Values" Line:**
      *   Where does the procedure stop? When the unit is scientifically valid but politically/ethically contentious.
      *   Example: Evolution (scientifically solid, some communities object). Climate Change (scientifically solid, politically charged).
      *   The procedure identifies *scientific merit*. It cannot identify *appropriateness for 5th graders* or *community alignment*.

  7.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Administrative, precise, authoritative, pragmatic.
      *   *Structure:*
          1.  The Procedure (The "Demarcation Protocol").
          2.  Application to Cases.
          3.  The "Uncomfortable Answers."
          4.  Limitations (The Values Boundary).

      *(Self-Correction during drafting)*: Make sure I don't just say "Is it falsifiable?" I need to specify *how* to handle the Duhem-Quine problem. I will add a specific check on "Independent Justification of Auxiliaries."
      *(Self-Correction on Learning Styles)*: Be careful. Learning styles are often cited in ed-school literature. The procedure needs to catch that the *specific claim* (meshing hypothesis) is falsified, even if the *field* (education) is valid.
      *(Self-Correction on Multiverse)*: This is the hardest one. String theory/Multiverse is often criticized as non-science by philosophers (e.g., Ellis, Silk). I need to acknowledge this tension. The procedure should flag it as "Theoretical Science" requiring caveats, not "Not Science."

  8.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points defined? Yes.
      *   Grounded in philosophy (Popper, Lakatos, Duhem)? Yes.
      *   Run on 3 units? Yes.
      *   Uncomfortable answers highlighted? Yes.
      *   Limitations section? Yes.

  9.  **Final Polish:** Ensure the distinction between "False but Scientific" and "Not Scientific" is clear. (Newtonian physics is false but scientific; Astrology is not scientific). This is key for the committee.

  *(Drafting the response based on these thoughts...)*
answer: |-
  # The Demarcation Protocol for Curriculum Review

  **Purpose:** To determine whether a proposed unit constitutes *science instruction* rather than *instruction about science-adjacent claims*.
  **Scope:** Applies to content claims only. Does not assess pedagogical fit, age-appropriateness, or community values.
  **Theoretical Basis:** Modified Falsificationism (Popper), Research Programme Progressiveness (Lakatos), Independent Testability of Auxiliaries (Duhem-Quine).

  ---

  ## Part I: The Decision Procedure

  Ask the following five questions in order. If a unit fails a question, follow the **Stop/Pass** instruction. Do not proceed to the next question unless the previous one is satisfied.

  ### Q1: The Empirical Content Test
  **Question:** Does the unit make at least one specific claim about the physical world that is, in principle, observable or measurable?
  *   **Sufficient Answer:** Yes. The claim refers to material objects, forces, energies, or biological processes existing in space-time.
  *   **Insufficient Answer:** The claim refers exclusively to supernatural agents, metaphysical necessities, moral obligations, or purely internal mental states without behavioral correlates.
  *   **Stop Condition:** If **Insufficient**, vote **NOT SCIENCE**. (This excludes pure theology, ethics, or metaphysics).
  *   **Note:** This tests *falsifiability in principle*, not current technological feasibility.

  ### Q2: The Riskiness Test (Refined Falsifiability)
  **Question:** Is there a conceivable observation, consistent with the laws of logic and physics, that would count as evidence *against* the unit's core claim?
  *   **Sufficient Answer:** Yes. The proponents can describe what data would force them to abandon or significantly alter the core claim.
  *   **Insufficient Answer:** No. All possible observations are interpreted as consistent with the claim (e.g., "failure proves lack of faith," "absence of evidence is evidence of rarity").
  *   **Addressing the Duhem-Quine Objection:** If the proponent says, "We can save the theory by adjusting background assumptions," proceed to Q3. Do not accept "We can adjust assumptions" as a pass for Q2.
  *   **Stop Condition:** If **Insufficient**, vote **NOT SCIENCE**.

  ### Q3: The Independent Auxiliary Test
  **Question:** When the core claim conflicts with data, are the "background assumptions" used to save it *independently testable*?
  *   **Sufficient Answer:** Yes. The auxiliary assumption (e.g., "the instrument was calibrated incorrectly," "the sample was contaminated") can be tested without relying on the truth of the core claim itself.
  *   **Insufficient Answer:** No. The only evidence for the auxiliary assumption is that it saves the core claim (Ad Hoc rescue).
  *   **Stop Condition:** If **Insufficient** repeatedly, vote **NOT SCIENCE**. (This filters out conspiracy theories and dogma that immunize themselves from refutation).

  ### Q4: The Progressiveness Test (Lakatos)
  **Question:** Has this line of inquiry predicted *novel* facts or successfully integrated *new* domains of evidence in the last 20 years, or does it primarily reinterpret old data to fit the theory?
  *   **Sufficient Answer:** It generates new, risky predictions that are subsequently confirmed, or it explains anomalies that rival theories cannot.
  *   **Insufficient Answer:** It is "degenerative." It spends more energy explaining away counter-evidence than discovering new evidence. It relies on "reinterpretation" of established data without new predictive power.
  *   **Distinction:** This distinguishes *False Science* (e.g., Phlogiston, which was scientific but wrong) from *Pseudoscience* (which mimics science but does not progress).
  *   **Stop Condition:** If **Insufficient**, vote **NOT SCIENCE** (Label: Degenerative/Pseudoscience).

  ### Q5: The Consilience Test
  **Question:** Does the unit's framework cohere with established, high-confidence scientific knowledge (physics, chemistry, biology) without requiring constant, localized exceptions?
  *   **Sufficient Answer:** Yes. It fits within the causal network of established science.
  *   **Insufficient Answer:** No. It requires suspending established laws (e.g., thermodynamics, gravity) only for this specific phenomenon.
  *   **Handoff Condition:** If **Sufficient**, the unit is **SCIENCE**.
      *   *Committee Action:* If the unit is scientifically valid but controversial (e.g., evolution, climate change), the decision moves to **Values Voting**. The procedure cannot adjudicate community comfort or political alignment.

  ---

  ## Part II: Application to Proposed Units

  Here is the output of the Protocol on your three specific cases.

  ### Unit 1: Young-Earth Geology (Scripture + Geology)
  *   **Q1 (Empirical):** **Pass.** Makes claims about rock strata, fossil ordering, and radiometric decay rates.
  *   **Q2 (Riskiness):** **Pass.** Claims specific ages (6,000 years). Radiometric dating showing billions of years *would* contradict it.
  *   **Q3 (Independent Auxiliary):** **FAIL.** When faced with radiometric dating, the unit posits "God created the earth with the appearance of age" or "The Flood altered decay rates."
      *   *Analysis:* These auxiliaries are not independently testable. You cannot test "appearance of age" without already assuming the Young-Earth conclusion. You cannot test "Flood-altered decay" without violating established nuclear physics (see Q5).
  *   **Verdict:** **NOT SCIENCE.**
  *   **Reason:** It fails the Independent Auxiliary Test. It is a theological claim dressed in geological data.

  ### Unit 2: Learning Styles (VARK/Matching Hypothesis)
  *   **Q1 (Empirical):** **Pass.** Claims that matching instruction to style improves test scores.
  *   **Q2 (Riskiness):** **Pass.** Randomized Controlled Trials (RCTs) can show no effect.
  *   **Q3 (Independent Auxiliary):** **PASS (Technically).** Proponents blame "poor measurement of styles" or "wrong age group." These are testable.
  *   **Q4 (Progressiveness):** **FAIL.**
      *   *Analysis:* This is the critical failure. The core hypothesis (the "meshing hypothesis") has been subjected to multiple rigorous reviews (e.g., Pashler et al., 2008; Rogowsky et al., 2015) and consistently falsified. The field does not generate novel successful predictions; it survives by redefining "styles" or claiming the implementation was imperfect. It is a **Degenerative Research Programme**.
  *   **Verdict:** **NOT SCIENCE** (Label: Debunked/Pseudoscience).
  *   **Reason:** It fails the Progressiveness Test. It is a "zombie concept"—falsified but refusing to die.

  ### Unit 3: Cosmological Multiverse (String Theory/Inflation)
  *   **Q1 (Empirical):** **Borderline Pass.** The other universes are unobservable, but the *mechanism* generating them (inflation/string fields) leaves traces in *our* universe (CMB patterns, gravitational waves).
  *   **Q2 (Riskiness):** **Pass.** If the Cosmic Microwave Background (CMB) does not match inflationary predictions, the theory is in trouble.
  *   **Q3 (Independent Auxiliary):** **Pass.** The math relies on quantum field theory and general relativity, which are independently tested.
  *   **Q4 (Progressiveness):** **Pass.** It resolves theoretical anomalies (e.g., the fine-tuning problem, the horizon problem) that standard cosmology struggles with. It is theoretically progressive, even if empirically stalled.
  *   **Q5 (Consilience):** **Pass.** It derives from mainstream physics, not exceptions to it.
  *   **Verdict:** **SCIENCE** (Label: Theoretical/Speculative).
  *   **Reason:** It passes all methodological checks.

  ---

  ## Part III: The Uncomfortable Answers

  The committee will likely object to the verdicts on **Unit 2** and **Unit 3**. You must be prepared for this.

  **1. The Learning Styles Verdict (Unit 2)**
  *   **The Discomfort:** Teachers *like* learning styles. It feels intuitive. Many education schools still teach it. Ruling it "Not Science" invalidates a large chunk of professional development the district has already paid for.
  *   **The Hard Truth:** The Protocol classifies this as pseudoscience not because the *idea* is impossible, but because the *evidence* is consistently negative and the proponents refuse to abandon the core claim. Teaching it as fact is teaching a falsehood.
  *   **Your Script:** "We are not voting on whether this is a nice idea. We are voting on whether it is science. The data says the effect does not exist. Teaching it as science violates the Progressiveness Test."

  **2. The Multiverse Verdict (Unit 3)**
  *   **The Discomfort:** Unit 1 (Young-Earth) was rejected for making claims about unobservables (the past/creation), yet Unit 3 (Multiverse) is accepted despite making claims about unobservables (other universes). Parents will ask: "Why is one invisible world science and the other religion?"
  *   **The Hard Truth:** The distinction is not *observability*; it is *derivation*. Multiverse theory is a mathematical consequence of models that *do* make testable predictions (inflation). Young-Earth theory is a textual consequence of scripture that *contradicts* testable predictions (radiometry).
  *   **Your Script:** "Multiverse theory is accepted because it is the output of equations that successfully predict things we *can* see (CMB radiation). Young-Earth geology is rejected because it requires us to ignore equations that successfully predict things we *can* see (nuclear decay). One extends known physics; the other requires suspending it."

  ---

  ## Part IV: Limitations and The Values Handoff

  This Procedure is a tool for **Demarcation**, not **Adoption**. It has three specific blind spots where you must tell the committee they are voting on values, not facts.

  **1. The "Truth vs. Status" Gap**
  *   **Limitation:** The Protocol identifies *Science*, not *Truth*. Newtonian Physics passes the Protocol. It is also strictly false (superseded by Relativity).
  *   **Committee Action:** If a unit is "Science" but known to be an approximation (e.g., teaching Bohr models of the atom), the committee must vote on *pedagogical utility*, not scientific status. The Protocol cannot solve this.

  **2. The "Consilience" Boundary**
  *   **Limitation:** Q5 asks if the unit fits established science. But established science changes.
  *   **Committee Action:** If a unit proposes a legitimate paradigm shift (e.g., plate tectonics in the 1950s), it might fail Q5 initially. The committee needs a mechanism to allow "High-Risk Science" (less than 5% of curriculum) that passes Q1-Q4 but challenges Q5. This is a judgment call on risk tolerance, not a procedural output.

  **3. The Values Handoff (The Most Critical Step)**
  *   **Limitation:** A unit can pass all 5 questions and still be inappropriate for the district.
  *   **Example:** A unit on the biological heritability of IQ, or the evolutionary psychology of gender roles. These may pass the Demarcation Protocol (they are testable, progressive, consilient).
  *   **Committee Action:** Once the Protocol returns **SCIENCE**, the Procedure **STOPS**.
  *   **Your Instruction:** "At this point, the question is no longer 'Is this science?' The question is 'Do we want this taught?' That is a values vote. Do not use scientific criteria to hide a values decision. If you reject a unit that passes the Protocol, own it as a community values decision, not a scientific one."

  **Summary for the Chair:**
  Use the Protocol to filter out the noise (YEC, Learning Styles). Use the Values Handoff to manage the political risk (Multiverse, Sensitive Topics). Do not allow the committee to conflate "I don't like this" with "This isn't science." The Procedure forces that distinction into the open.
