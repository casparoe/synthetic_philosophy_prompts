answer: |-
  In a competitive suburban school district, parents begin emailing the principal directly to resolve minor classroom issues—seat changes, missed homework, peer squabbles—marking every subject line as "URGENT." Initially, only a few anxious parents do this to ensure their child isn't overlooked, but as the principal's response time slows due to volume, other parents realize that only "URGENT" flags get same-day replies. To protect their own children's interests, reasonable parents who previously waited for weekly newsletters now adopt the tactic, marking trivial requests as critical emergencies. Within a semester, the principal's inbox is 90% false alarms, forcing them to ignore the "URGENT" flag entirely and implement a 48-hour blanket delay on all correspondence, leaving actual safety concerns buried and unaddressed while every parent feels compelled to scream louder just to be heard at a whisper.

  ***

  **Analysis**

  **Trap Type:** This is a **Signaling Arms Race**, a specific variant of the Multipolar Trap. It is not a standard Tragedy of the Commons because the resource being degraded—the *informational value* of the word "Urgent"—is non-rivalrous; my using the label doesn't physically prevent you from using it, but it dilutes its meaning for everyone. It is not a one-shot Prisoner's Dilemma because it involves many actors iterating over time, where the "defection" is inflating a signal rather than stealing a finite resource.

  **Rationality:** For every parent, the move is individually rational. The cost of clicking "High Importance" is zero, while the potential benefit (their child receiving faster attention) is high. Once a critical mass of parents inflates the signal, the only way to ensure your child isn't deprioritized is to match them. Honesty becomes a competitive disadvantage.

  **Altruism:** Making everyone nicer would **not** fix this. If 90% of parents agree to be honest but 10% defect to gain an advantage for their children, the signal still collapses. The 10% reap the benefits of the noise while the altruistic 90% suffer the costs of being ignored. The trap requires coordination or enforcement, not just good intentions.

  **Structural Feature:** The heavy lifting is done by **Costless Signaling**. The trap exists because marking an email "Urgent" carries no penalty, verification, or friction.

  **Counterfactual:** If you remove costless signaling (e.g., marking "Urgent" requires a phone call to the office or a form signed by a teacher), the situation becomes a **Screening Problem**. True emergencies justify the extra effort; trivial requests do not. The signal regains its value, the principal can prioritize effectively, and the race evaporates.

  **Steelman Critic:** A critic arguing this race was avoidable would need to show that the parent community possessed enough social cohesion to enforce a norm *before* the signal collapsed. To be right, they would have to demonstrate that early "defectors" could have been socially sanctioned (shamed or reported) at low cost to the sanctioners, creating a credible threat that outweighed the benefit of cheating.

  Verdict: Signaling Arms Race
