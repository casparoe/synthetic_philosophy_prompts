answer: |-
  You have stumbled onto one of the central debates in environmental history and historical sociology, often framed as the tension between **determinism** (nature dictates history) and **possibilism** (nature sets limits, humans make choices).

  Your intuition is remarkably consistent. You are rejecting "vulgar materialism" (climate explains everything) without retreating into "human exceptionalism" (only ideas and people matter).

  Here is a principle that systematizes your verdicts, an explanation of why the Black Death case survives it, a ruling on "actor talk," and an application to Versailles.

  ### 1. The Principle: Constraint vs. Configuration

  Your working hypothesis was: *Non-human things cause what happens **to** a population, but not what a population **does**.*

  That is close, but the Black Death/Serfdom case breaks it, because ending serfdom is something a population *does* (an institutional change). A more precise formulation that saves all your verdicts is:

  **Non-human causes determine the *Material Constraints*; Human causes determine the *Social Configuration*.**

  *   **Material Constraints:** Caloric intake, biological viability, habitability, labor supply. These are the "rules of the game" imposed by physics and biology. You cannot vote against a virus, and you cannot negotiate with a drought.
  *   **Social Configuration:** Laws, borders, migration destinations, political ideologies, economic systems. These are the "moves in the game."

  **Why this fits your verdicts:**
  *   **Tambora:** It dictated the *Constraint* (no crops grow). It did not dictate the *Configuration* (families move to Ohio vs. starve vs. riot).
  *   **Smallpox:** It dictated the *Constraint* (bodies die). It did not dictate the *Configuration* (Spanish political administration). "Germs conquered" fails because it conflates the biological massacre (Constraint) with the political project of empire (Configuration).
  *   **French Revolution:** The weather created a *Constraint* (hunger). But since the constraint applied to all of Europe, the *Configuration* (Revolution) must be explained by French-specific politics (taxation, estates, monarchy).
  *   **Maya:** Drought dictated the *Constraint* (water scarcity). A city emptying is a direct biological response to that constraint. "The Collapse" implies a total civilizational failure, which involves how they *configured* their political response to the drought (warfare, ritual failure, centralization).

  ### 2. Does the Black Death Verdict Survive?

  **Yes, but it is your boundary case.**

  You accept that the Plague ended serfdom in the West but strengthened it in the East. This is actually the strongest evidence for the **Constraint vs. Configuration** principle.

  *   **The Constraint:** The Plague removed 30–50% of the labor force. This made the *pre-existing* feudal contract mathematically impossible to maintain at the same profit margins. The Plague broke the *equilibrium*.
  *   **The Configuration:**
      *   **West:** Peasants had legal customs and mobility options they used to leverage the shortage into freedom.
      *   **East:** Lords had stronger military control and weaker royal courts, allowing them to use the shortage to bind peasants tighter (the "second serfdom").

  **The Verdict:** You can say the Plague *caused the crisis of serfdom*, but you cannot say it *caused the end of serfdom.* It forced a renegotiation. The *outcome* of that negotiation was human.

  If you keep your verdict ("Plague ended serfdom"), you must implicitly mean "The Plague made the old system untenable." As long as you acknowledge that the *direction* of the change (freedom vs. bondage) was political, the Plague remains a valid cause of the *instability*, just not the *solution.*

  ### 3. What to do with "Actor Talk"

  You asked: *Is calling a volcano or a virus a historical actor just shorthand for a causal claim, or does it say something the causal claim doesn't?*

  It says something dangerous.

  *   **Causal Claim:** "The virus killed 40% of the population." (Neutral, mechanical).
  *   **Actor Talk:** "The virus conquered the Americas." (Implies agency, strategy, and unity).

  **The Problem with Actor Talk:**
  1.  **It hides human exploitation.** "Germs conquered" sounds like the germs did the work. In reality, human conquistadors *leveraged* the demographic collapse to seize power. The germs created the vacuum; humans rushed to fill it. Actor talk lets the humans off the hook.
  2.  **It implies intent.** Actors have goals. Viruses have replication rates. Attributing "conquest" to a virus suggests a teleology (a directed outcome) that doesn't exist.
  3.  **It obscures variation.** As you noted, the "Germs conquered" narrative ignores that some places resisted, some had different immunity profiles, and some used the chaos to throw off empires.

  **Recommendation:** Use **"Non-human Agent"** or **"Force."** Avoid **"Actor."** An Actor sits at the negotiating table. A Force changes the room temperature so the negotiation becomes harder. You want to credit the Force with changing the temperature, not with writing the treaty.

  ### 4. Application: The 1918 Flu and Versailles

  Let's apply **Constraint vs. Configuration** to the 1918 Influenza Pandemic and the Treaty of Versailles.

  **The Context:**
  The Paris Peace Conference (1919) occurred during the third and often deadliest wave of the 1918 Flu. Key figures, including Woodrow Wilson, Georges Clemenceau, and Lloyd George, were either ill or exhausted by the pandemic. The global death toll was reshaping societies.

  **The Causal Claim (Constraint):**
  *   **Physical Depletion:** Negotiators were sick, tired, and grieving. Wilson famously fell ill at Versailles in April 1919, exhibiting confusion and fatigue.
  *   **Urgency:** The pandemic created a desperate desire to finish the work and go home. Delegations were depleted by sickness; staff were dying.
  *   **Social Instability:** The flu exacerbated labor strikes and social unrest globally, putting pressure on leaders to stabilize the situation quickly.

  **The Configuration (Human Choice):**
  *   **Reparations:** The decision to cripple Germany economically was a political choice driven by French security concerns and British electoral promises, not the virus.
  *   **Borders:** The redrawing of the Middle East and Eastern Europe was geopolitical strategy.
  *   **League of Nations:** Wilson's idealism vs. the reality of enforcement was a philosophical and political battle.

  **The Verdict:**
  *   **Did the Flu cause the Treaty?** No. The War caused the Treaty.
  *   **Did the Flu cause the *Terms*?** No. Those were political.
  *   **Did the Flu cause the *Quality/Process* of the Treaty?** **Yes.**

  **Application of the Principle:**
  The Flu acted as a **Material Constraint** on the cognitive and physical capacity of the negotiators. It shortened the timeline and degraded the decision-making environment.
  *   *Shorthand:* "The Flu made the treaty worse."
  *   *Precise:* "The Flu degraded the *conditions* under which the treaty was written, increasing the likelihood of haste and error, but the *content* of the errors was human."

  If you say "The Flu ruined the peace," you are in the "climate-explains-everything" camp. If you say "The Flu had nothing to do with Versailles," you are ignoring the biological reality of the room.

  **Correct View:** The Flu ensured that the humans negotiating the peace were operating at a deficit. It made a *bad* configuration more likely, but it did not *write* the configuration.

  ### Summary of Your System

  To stop contradicting yourself, stick to this checklist when evaluating a non-human cause:

  1.  **Does it directly alter biological or physical viability?** (e.g., crops die, people die, land floods).
      *   *If Yes:* The non-human cause is primary. (Tambora/Crops, Smallpox/Death).
  2.  **Does it require a human interpretation or institutional response?** (e.g., migration, revolution, treaty terms, legal status).
      *   *If Yes:* The non-human cause is a *stressor* or *catalyst*, but the human system is the *cause of the specific outcome*. (Tambora/Ohio, Flu/Versailles, Weather/Revolution).
  3.  **Did the same cause produce different outcomes in different places?** (e.g., Plague/West vs. East).
      *   *If Yes:* This proves the human system is the variable. The non-human cause is the *shock*, not the *solution*.

  Your intuition is sound. You are essentially a **Historical Materialist who refuses to ignore Politics.** You recognize that history happens on a physical stage, but you refuse to believe the scenery writes the script. Keep that tension; it's where the good history lives.
