answer: |-
  You are right to be suspicious. The phrase "the monarch reigns but does not rule" is a Bagehotian shibboleth, not a technical legal term. It functions as a conversation-stopper precisely because it is ambiguous enough to be plausible to everyone in the room while meaning something different to each of them. In constitutional theory, ambiguity is often a feature, not a bug, but in a seminar analyzing specific crises, it obscures the mechanism of failure.

  Here is the menu of readings, ordered from the trivial (tautological) to the surprising (empirically dubious), with the requested analysis.

  ### 1. The Semantic Stipulation
  *   **The Claim:** "Rule" is defined as "initiating partisan policy or administering government," while "Reign" is defined as "formalizing state acts." Under this definition, the sentence is true by stipulation.
  *   **Type of Claim:** Conceptual/Definition.
  *   **Plausibility:**
      *   **UK:** Plausible. The Monarch opens Parliament but does not write the speech.
      *   **Scandinavia:** Plausible. In Sweden, the King has no government functions at all; he merely represents the state.
      *   **Japan:** Plausible. The Constitution explicitly limits the Emperor to "acts in matters of state" (Art. 4) and denies him "powers related to government."
  *   **Supports "No Choice"?** **No.** This defines the *role*, not the *constraint*. It explains what they do, not whether they could do otherwise. It cannot support the claim that the Monarch "had no choice" in a crisis, only that if they made a choice, it wasn't "ruling."
  *   **Status:** Trivial. It tells us nothing about power dynamics.

  ### 2. The Legal Prohibition
  *   **The Claim:** Statutes or the written constitution explicitly forbid the Monarch from acting without a ministerial counter-signature or advice.
  *   **Type of Claim:** Legal Rule (Black-letter law).
  *   **Plausibility:**
      *   **UK:** **Weak.** Most constraints are conventional, not statutory. The Monarch *could* legally refuse assent, though it would cause a crisis.
      *   **Scandinavia:** **Strong.** Sweden's 1974 Instrument of Government removed the King from government formation entirely. Norway and Denmark have tighter statutory constraints than the UK.
      *   **Japan:** **Strong.** Article 4 of the 1947 Constitution is a hard legal bar on government powers.
  *   **Supports "No Choice"?** **Yes, but only in Japan/Scandinavia.** In the UK and Australia, this reading is legally false regarding reserve powers. Relying on this in a UK/Aus seminar is an error of law.
  *   **Status:** Plausible in civil law monarchies, inaccurate in Westminster systems.

  ### 3. The Conventional Bind
  *   **The Claim:** The Monarch *could* legally act alone, but constitutional convention binds them to accept ministerial advice except in extreme "reserve power" scenarios (e.g., hung parliaments, unlawful advice).
  *   **Type of Claim:** Constitutional Convention (Political norm with normative force).
  *   **Plausibility:**
      *   **UK:** **High.** This is the standard Westminster model.
      *   **Scandinavia:** **Low.** In Sweden, there are no reserve powers left to exercise.
      *   **Japan:** **None.** The Cabinet bears sole responsibility; there is no recognized reserve power for the Emperor.
      *   **Australia (GG):** **High/Contested.** The GG holds reserve powers (as 1975 proved), but convention dictates they are used only as a last resort.
  *   **Supports "No Choice"?** **Conditionally.** It supports "no choice" *unless* the crisis meets the threshold for reserve powers. In 2019 (UK), the argument was that prorogation advice was standard, so convention bound the Queen. In 1975 (Aus), the argument was that the crisis *did* meet the threshold, so the GG *was* allowed to choose. Using this reading to say "there's nothing to argue about" in 1975 is contradictory, because the whole argument was about whether the threshold was met.
  *   **Status:** The actual working mechanism in the UK/Aus, but inherently debatable (hence the seminar).

  ### 4. The Prudential Abstention
  *   **The Claim:** The Monarch has both legal power and conventional discretion, but chooses not to use it to preserve political neutrality and institutional stability.
  *   **Type of Claim:** Empirical/Political Prediction (Self-restraint).
  *   **Plausibility:**
      *   **UK:** **High.** The "weekly audience" allows for influence, but public action is avoided.
      *   **Scandinavia:** **High.** Kings stay silent to protect the monarchy's popularity.
      *   **Japan:** **High.** The Imperial Household Agency strictly manages visibility to avoid political contamination.
      *   **Australia (GG):** **Mixed.** 1975 disproves the "never uses it" version of this claim.
  *   **Supports "No Choice"?** **No.** This explicitly admits there *was* a choice, but argues it was wise not to take it. This undermines the "nothing to argue about" defense, as it admits the Monarch/GG is a political actor making a calculation.
  *   **Status:** Empirically true, but weakens the "no choice" defense.

  ### 5. The Substantive Nullity
  *   **The Claim:** The Monarch has no independent will, no access to information, and no influence over ministers. They are a stamp.
  *   **Type of Claim:** Empirical/Sociological.
  *   **Plausibility:**
      *   **UK:** **False.** The right to be consulted, to encourage, and to warn (Bagehot) is real.
      *   **Scandinavia:** **Closer to True.** Access is more strictly managed.
      *   **Japan:** **Closer to True.** The Emperor is constitutionally a "symbol"; political access is severely restricted.
      *   **Australia (GG):** **False.** The GG is often a former politician with deep networks.
  *   **Supports "No Choice"?** **Yes.** If they lack the capacity to choose, there is no agency to blame.
  *   **Status:** Empirically false in the UK/Aus contexts. Using this reading is a fiction.

  ### Is the Slogan the Right Shape?
  No. "Reign" and "Rule" are not technical terms. They are metaphors that conflate **authority** (legal power to act) with **agency** (discretion to decide).
  *   In the **2019 UK case**, the slogan was used to imply the Queen lacked *agency* (Reading 5) or was *legally bound* (Reading 2), when the reality was a *conventional bind* (Reading 3) regarding advice that was later found unlawful. The slogan hid the fact that the *advice itself* was the problem, not the Monarch's acceptance of it.
  *   In the **1975 Aus case**, the slogan was used inconsistently. If the GG "does not rule," he should not have dismissed the PM. If the student argued the GG was "standing in for the Crown" to imply the dismissal was mechanical, they were treating a reserve power (discretionary) as a ministerial act (bound). The slogan obscures the difference between *executing government policy* (ruling) and *guarding the constitution* (reigning/reserve powers).

  ### Does it Transfer to a Governor-General?
  Poorly. The Monarch "reigns" by right of birth/legitimacy; the GG "holds office" by commission.
  *   **Legitimacy:** A Monarch can claim neutrality based on dynastic distance. A GG is a political appointee. When a GG exercises reserve powers (1975), it looks more like "ruling" because they lack the hereditary cover of "reigning."
  *   **Mechanism:** The slogan implies the head of state is passive. In Australia, the GG is the *active* holder of executive power (vested by the Constitution), whereas the Queen is the *source*. Applying "does not rule" to the GG denies the existence of the reserve powers that define the Australian presidency-by-proxy.

  ### Seminar Diagnosis
  Your seminar colleagues were likely relying on **Reading 3 (The Conventional Bind)** but presenting it as **Reading 2 (The Legal Prohibition)** or **Reading 5 (Substantive Nullity)** to make the conclusion sound inevitable rather than normative.
  *   In **2019**, they treated convention as law to shut down the question of whether the Queen *should* have warned the PM.
  *   In **1975**, they treated the GG's reserve power as "machinery" (Reading 1/2) to normalize a highly discretionary political act.

  The slogan is doing rhetorical work (depoliticizing the head of state) rather than analytical work.

  Verdict: None of them do; the slogan is rhetoric that collapses under the specific constitutional mechanics of both crises.
