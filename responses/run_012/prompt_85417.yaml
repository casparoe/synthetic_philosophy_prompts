  # JOINT STATEMENT ON THE STRUCTURE OF PASCAL'S MUGGING

  **Preamble**
  This document records the results of a two-year collaboration regarding the problem known as Pascal's Mugging. The undersigned agree that the scenario constitutes a genuine paradox for standard decision theory and that existing dismissals are insufficient. We disagree on the locus of the error. The following text isolates our common ground, specifies the disagreement in two distinct formulations, and records our divergent predictions regarding specific test cases and proposed solutions.

  ### 1. Shared Claims

  Both parties accept the following claims as the baseline for further inquiry:

  1.  **The Structure of the Case:** The mugging scenario involves an agent presented with a choice: incur a small, certain cost (e.g., handing over a wallet) to avert a catastrophe of enormous magnitude (e.g., $10^{18}$ person-years of suffering) purportedly occurring with a vanishingly small probability (e.g., $1$ in $10^{12}$). The expected utility of paying exceeds the expected utility of refusing, provided the utility function is unbounded and the probability is non-zero.
  2.  **Inadequacy of Truncation:** An adequate response cannot simply stipulate that probabilities below a certain threshold are to be treated as zero. Such a rule would forbid rational precautions against low-probability, high-impact risks (e.g., asteroid deflection, pandemic preparedness, or existential risk mitigation) where the cost of prevention is low relative to the stakes.
  3.  **Inadequacy of Intuition Alone:** An adequate response cannot rely solely on the intuition that paying is "absurd." The theory must explain *why* the intuition tracks a normative error rather than a cognitive bias.
  4.  **Dead Ends:**
      *   Denying the coherence of large numbers (e.g., claiming $10^{18}$ person-years is meaningless) is rejected.
      *   Denying the coherence of small probabilities (e.g., claiming $10^{-12}$ is indistinguishable from 0) is rejected, per Claim 2.
      *   Asserting that the utility function *must* be bounded without deriving this constraint from more primitive axioms is rejected as question-begging.

  ### 2. Statement of Disagreement

  We cannot produce a single unified statement of the defect that satisfies both parties. Instead, we offer two formulations. Each is written to be acceptable to the party holding that view, without misrepresenting the other.

  **Formulation A (The Decision-Theoretic View)**
  The defect lies in the rule of aggregation. Unrestricted expected-utility maximization is a defective rule of choice when applied to tails of the probability distribution where the magnitude of the outcome outstrips the reliability of the estimation. Even if an agent assigns a coherent, non-zero credence to the mugger's claim, it is rational to reject the bet. The repair requires a structural constraint on decision-making that limits how much weight vanishingly small probabilities can carry, independent of the agent's degree of belief. The error is in the *maximization*, not the *measurement*.

  **Formulation B (The Epistemic View)**
  The defect lies in the inputs to the calculation. The mugger's offer exploits a fantasy of complete belief; there is no determinate probability to maximize over in the mugging scenario. The agent cannot justifiably assign a specific non-zero probability to a claim lacking a mechanism, track record, or causal model. The repair requires a constraint on credence formation, ensuring that probabilities are only assigned where the evidence supports a well-defined distribution. The error is in the *belief*, not the *maximization*.

  *Note on Consensus:* We record that we cannot agree on a single sentence summarizing the defect. Formulation A assumes the probability is assignable but the action forbidden; Formulation B assumes the action is forbidden because the probability is unassignable. To merge these would obscure the causal direction of the normative constraint.

  ### 3. Cruxes and Predictions

  We identify four specific areas where our views generate divergent predictions. For each, we specify the case and the expected verdict.

  **Crux 1: The Location of the Defect (Rule vs. Input)**
  *Test Case:* We compare two offers with identical expected value per dollar.
  *   **Case U (Unsubstantiated):** A stranger with no track record and no describable mechanism claims that for $1, they will refrain from causing $10^{18}$ person-years of pain, which will otherwise occur with probability $1$ in $10^{12}$.
  *   **Case V (Verified):** A publicly documented device (radioactive source and detector, distribution independently checked) will, with probability $1$ in $10^{12}$, avert $10^{18}$ person-years of pain. One attempt costs $1.

  *Question:* Does any constraint that licenses V and forbids U earn its keep, and is it a constraint on choice or on credence?

  *   **Prediction (Decision-Theoretic View):** A constraint on *choice* can license V and forbid U. The structural risk profile of U differs from V even if the numerical probability is identical. A rational decision rule may admit risks grounded in physical mechanisms (V) while rejecting risks grounded in testimonial assertion without mechanism (U), even if the agent's credence in U is high. The defect is that the rule treats U and V identically; the repair distinguishes them at the level of action.
  *   **Prediction (Epistemic View):** A constraint on *credence* licenses V and forbids U. In Case V, the probability is well-defined by physical law. In Case U, the probability is undefined or indeterminate because the hypothesis lacks a causal model. Once credences are properly formed (V = $10^{-12}$, U = undefined), standard expected-utility maximization handles the rest without modification. The defect is that the agent treats U as having a determinate probability.

  **Crux 2: Escalation and Competition**
  *Test Case:*
  *   **Escalation:** The stranger in Case U returns, offering to avert $10^{200}$ person-years of pain with probability $1$ in $10^{100}$ for the same $1.
  *   **Many Muggers:** A crowd of strangers each press a competing claim of similar magnitude; the agent cannot satisfy them all.

  *   **Prediction (Decision-Theoretic View):** As the stakes escalate, the decision rule must increasingly discount the probability, regardless of the agent's stated credence. In the Many Muggers case, a structural constraint on choice (e.g., a budget constraint or a rule against aggregating incomparable tail risks) is required to prevent paralysis or arbitrary selection. The rule must prevent the agent from being dominated by tail risks.
  *   **Prediction (Epistemic View):** As the stakes escalate, the credence naturally collapses. A claim of $10^{200}$ person-years is increasingly incompatible with the agent's background model of reality, driving the justified credence toward zero faster than the utility grows. In the Many Muggers case, the claims are mutually defeating; the rational credence in any single mugger's claim drops to near-zero because the probability that *exactly one* is telling the truth is vanishingly small. No new decision rule is needed; the inputs self-correct.

  **Crux 3: The Target of Repair (Utility vs. Probability vs. Rule)**
  *Test Case:* Whether the correct target is the value side (unbounded utility) rather than the rule or the credence.

  *   **Prediction (Decision-Theoretic View):** The Epistemic View will eventually collapse into a constraint on utility. If one restricts credences to avoid the mugging, one effectively bounds the impact of extreme outcomes, which is functionally equivalent to bounding utility. We predict that a pure epistemic fix is unstable and will require a decision-theoretic justification for why certain values cannot be weighed.
  *   **Prediction (Epistemic View):** The Decision-Theoretic View implicitly assumes unbounded utility is coherent and then tries to restrict it. We predict that any decision rule that restricts tail risks without restricting credences will be arbitrary. The real solution is recognizing that utility cannot be meaningfully assigned to outcomes that are epistemically inaccessible. The defect is not in the utility function, but in assigning value to epistemically void outcomes.

  **Crux 4: Constraint on Belief**
  *Test Case:* Whether a repair to choice must also constrain belief, and not only action.

  *   **Prediction (Decision-Theoretic View):** No. An agent can rationally believe the mugger is likely telling the truth (high credence) but still refuse to pay (restricted choice). Belief and action can come apart in tail-risk scenarios.
  *   **Prediction (Epistemic View):** Yes. If the agent refuses to pay, it is because they do not truly hold the high credence. A repair to choice that does not constrain belief implies a form of akrasia (acting against one's judgment). Rational action requires rational belief; if the action is "don't pay," the belief must be "the probability is negligible."

  ### 4. The Verification Proposal

  During collaboration, a third proposal was floated, owned by neither side:
  *Proposal:* Before an action may be selected on expected-value grounds, the agent must be able to specify a procedure that would in principle confirm or disconfirm the outcome-claim, and the credence must be derivable from a distribution the agent would endorse as well-defined.

  *   **Verdict on U and V:** Under this proposal, Case V passes (mechanism is verifiable) and Case U fails (claim is not falsifiable/verifiable in principle).

  *   **Reaction (Decision-Theoretic View):** This is a **fudge**. It disguises a decision-theoretic constraint as an epistemic one. By demanding a verification procedure, it effectively bans certain types of risks from the decision matrix. We predict this proposal will yield the correct verdicts on U and V, but it fails to explain *why* verification is required for choice. It smuggles in a structural constraint on admissibility under the guise of defining probability.
  *   **Reaction (Epistemic View):** This is **our view in disguise**. It formalizes the requirement for well-defined credences. "Well-defined distribution" is synonymous with "determinate probability." We predict this proposal clarifies the mugging problem by showing that U lacks the necessary epistemic infrastructure to enter a calculation, while V possesses it. It is not a constraint on choice, but a clarification of the conditions for belief.

  *Consensus Note:* We cannot agree on whether this proposal is a "fudge" or a "clarification." This disagreement mirrors the core dispute: whether the verification condition is a prerequisite for belief (Epistemic) or a prerequisite for admissibility in decision-making (Decision-Theoretic).

  ### 5. Closing: Verbal Dispute and Conditions for Revision

  **On Verbal Dispute**
  We acknowledge that part of the dispute may be verbal, centering on the definition of **rationality**.
  *   If "rationality" is defined as internal consistency between credence and action, the Decision-Theoretic View appears to advocate for irrationality (believing X but not acting on X).
  *   If "rationality" is defined as survival or robustness against exploitation, the Epistemic View appears to rely on lucky breaks in credence formation rather than robust rules.
  However, we do not believe the dispute is *merely* verbal. It entails different prescriptions for AI alignment and institutional risk management: one suggests building agents with restricted utility functions or decision rules; the other suggests building agents with stricter epistemic hygiene.

  **Conditions for Revision**
  *   **To Move the Decision-Theoretic View:** We would require a case where the probability is demonstrably well-defined (e.g., a quantum event with published statistics), the utility is demonstrably unbounded, and yet standard expected-utility maximization yields a verdict that is intuitively and practically catastrophic. If the Epistemic View can show that "well-defined" never applies in mugging cases, we would concede.
  *   **To Move the Epistemic View:** We would require a case where an agent holds a justified, well-defined credence in a catastrophic claim, yet paying to avert it is clearly irrational for reasons unrelated to belief (e.g., resource allocation constraints that are not epistemic). If the Decision-Theoretic View can show that credences can be perfect while the decision rule remains defective, we would concede.

  Until such evidence is produced, we maintain our respective positions as recorded above.
