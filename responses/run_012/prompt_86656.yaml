answer: |-
  This is a classic LessWrong/philosophy intersection problem. The debate often stalls because people use "idealization" to do three different jobs at once: metaphysical grounding, epistemic access, and action-guidance.

  Below is a decision tree designed to disentangle those jobs. I've前置 (prefaced) it with the two concrete cases you requested, as the questions in the tree reference them directly.

  ### The Two Sorting Cases

  Before you start the tree, hold these two scenarios in mind. Your intuitions here determine your path.

  **Case 1: The Reasoning Pill (Input vs. Output)**
  You are offered a pill that gives you perfect information and flawless logic for 24 hours. Afterward, you revert to normal.
  *   **Input View:** The pill makes you "Ideal." Whatever you decide while on the pill is the moral truth, even if no one else agrees.
  *   **Output View:** The pill is just a test. The moral truth is only what you *and everyone else* would decide if you all took the pill. If you disagree with another pill-taker, at least one of you is still wrong.

  **Case 2: The Persistent Disagreement (Convergence)**
  Two agents take the Reasoning Pill. They have all the same facts and use flawless logic. They still disagree on the verdict (e.g., one says "Maximize Happiness," the other says "Respect Autonomy").
  *   **Convergence:** This situation is impossible. Idealization guarantees agreement.
  *   **Divergence:** This situation is possible. Morality might be relative to the agent, or dependent on actual historical agreement.

  ***

  ### The Indirect Normativity Decision Tree

  **ROOT:** Do you believe there is a **fact of the matter** about what an idealized version of you would endorse?
  *(If No: You are likely a **Deflationist/Fictionalist**. You think "idealization" is a useful metaphor with no truth-conditions. Stop here.)*
  *(If Yes: Continue to Q1.)*

  **Q1: Metaphysical Direction (Discovery vs. Creation)**
  When the idealized you endorses X, is X good *because* they endorsed it, or did they endorse it *because* X is good?
  *   **Because X is good (Discovery):** Idealization is a heuristic for finding independent truths. → **Go to Leaf A.**
  *   **Because they endorsed it (Creation):** Idealization constitutes the truth. → **Go to Q2.**

  **Q2: The Definition of "Ideal" (Input vs. Output)**
  Refer to **Case 1 (The Reasoning Pill)**. Is the verdict binding because the agent possesses the *properties* (info + logic), or only if there is *convergence* among such agents?
  *   **Properties (Input):** If I am perfectly informed/rational, my verdict is authoritative for me. → **Go to Q3.**
  *   **Convergence (Output):** My verdict only counts if it matches what others would also conclude. → **Go to Q4.**

  **Q3: The Convergence Test**
  Refer to **Case 2 (Persistent Disagreement)**. If two perfectly informed/rational agents disagree, is there a further fact about who is right?
  *   **Yes (Impossible Disagreement):** True idealization guarantees convergence. One of them wasn't actually ideal. → **Go to Q5.**
  *   **No (Possible Disagreement):** Rational agents can diverge. Authority is indexical to the agent. → **Leaf B (Indexical/Relativist).**

  **Q4: The Actualist Check**
  If convergence is required (from Q2), does it require convergence among *hypothetical* ideal agents, or *actual* historical agents as they improve?
  *   **Hypothetical:** What we *would* agree on. → **Go to Q5.**
  *   **Actual:** What we *do* agree on as we get smarter. → **Leaf C (Actualist/Discourse Ethics).**

  **Q5: The Epistemic Constraint (Ought Implies Know?)**
  Suppose the Ideal Verdict is X, but your current non-ideal brain cannot compute or verify X. Are you obligated to do X anyway?
  *   **Yes (Ought does not imply Know):** You are bound by the truth even if you can't access it. → **Go to Q6.**
  *   **No (Ought implies Know):** You cannot be obligated to do what you cannot identify. You need a proxy. → **Leaf D (Indirect Normativity/CEV).**

  **Q6: The Scope of Authority**
  Is the Ideal Verdict authoritative because it is *your* idealized self, or because it is *any* idealized self?
  *   **My Idealized Self:** The authority comes from *my* endorsement. → **Leaf E (Kantian Constructivism).**
  *   **Any Idealized Self:** The authority comes from the standpoint of an impartial observer. → **Leaf F (Ideal Observer Theory).**

  ***

  ### The Leaves (Positions)

  **Leaf A: Plain Moral Realism**
  *   **Commitment:** Moral facts exist independently. Idealization is just the best tool we have to find them, like a telescope for stars.
  *   **Implication:** If the idealized agent is wrong (metaphysically possible on this view), the moral fact still holds.
  *   **Label:** Procedure-Independent Realism.

  **Leaf B: Indexical/Relativist Constructivism**
  *   **Commitment:** Idealization creates truth, but rational agents can diverge (Case 2).
  *   **Implication:** "Right for me" is what my idealized self says; "Right for you" is what yours says. No universal adjudication.
  *   **Label:** Agent-Relative Constructivism.

  **Leaf C: Actualist Convergence**
  *   **Commitment:** Morality is defined by actual agreement among improving agents, not hypothetical perfection.
  *   **Implication:** Moral progress depends on historical luck. If we all converge on a mistake, it becomes true.
  *   **Label:** Discourse Ethics / Historical Actualism.

  **Leaf D: Indirect Normativity (CEV Family)**
  *   **Commitment:** There is an ideal verdict, but we cannot access it directly (Q5=No). We must optimize for a *process* that tracks it.
  *   **Implication:** We act on proxies (e.g., "maximize coherence") because we can't compute the target. This is the standard LW/AI-safety position.
  *   **Label:** Coherent Extrapolated Volition / Proxy View.

  **Leaf E: Kantian Constructivism**
  *   **Commitment:** The ideal verdict is binding because it is the law you give yourself (Q6=My Self). Convergence is guaranteed by the nature of rationality.
  *   **Implication:** Morality is autonomous. Heteronomous rules (even from God) don't bind unless ratified by your ideal self.
  *   **Label:** Autonomy-Based Constructivism.

  **Leaf F: Ideal Observer Theory**
  *   **Commitment:** The ideal verdict is binding because it comes from an impartial, omniscient standpoint (Q6=Any Self).
  *   **Implication:** Morality is about what a benevolent, informed spectator would approve.
  *   **Label:** Spectator Constructivism.

  **Leaf G: Non-Ideal Theory**
  *   *(Note: This path is available if you answer "No" to the Root, or branch off at Q5 saying "We should ignore the Ideal Verdict entirely for policy.")*
  *   **Commitment:** The idealization setup is irrelevant for current decision-making.
  *   **Implication:** Focus on feasibility, power dynamics, and second-best solutions.
  *   **Label:** Political Realism / Non-Ideal Theory.

  ***

  ### Structural Analysis & Flags

  **1. Indistinguishable Leaves**
  *   **Leaf E (Kantian) vs. Leaf F (Ideal Observer):** The tree struggles to separate these cleanly. Both believe in guaranteed convergence (Q3=Yes) and that idealization constitutes truth (Q1=Creation). The distinction rests on *whose* idealization counts (agent-relative vs. impartial spectator). In practice, many philosophers slide between these. If you find yourself saying "It's what I'd choose, but obviously any rational being would choose the same," you are straddling E and F.
  *   **Leaf A (Realism) vs. Leaf F (Ideal Observer):** Some Realists argue God (or the Ideal Observer) necessarily tracks the Good. If you think the Observer *cannot* be wrong, your practical advice looks identical to the Constructivist who says the Observer *makes* it right. This is the "Euthyphro" blur.

  **2. Unoccupied/Unattractive Combos**
  *   **The "Realist Proxy" (Q1=Discovery + Q5=No):** This combo says: "There are independent moral facts, but I can't know them, so I'll just optimize for a proxy."
      *   *Status:* **Unattractive.** If you're a Realist, you usually think we can have *some* access to the truth (moral intuition, reason). Admitting total epistemic blackout while maintaining metaphysical realism is skeptical and unstable. Most people here slide into Deflationism or Indirect Normativity (which treats the 'truth' as constructed).
  *   **The "Universal Relativist" (Q3=No + Obligation is Universal):** This combo says: "Ideal agents can disagree, but you are still obligated to follow *my* ideal verdict."
      *   *Status:* **Incoherent.** If idealization doesn't guarantee convergence, claiming universal authority for your specific verdict is just dogmatism. This usually collapses into Leaf B (Indexical) or Leaf C (Actualist/Power).

  **3. The "Non-Ideal" Gap**
  *   The tree assumes you care about the ideal verdict. A significant chunk of political philosophers (e.g., Amartya Sen, realists) would reject the Root. They argue asking "What would ideal agents do?" is the wrong question for non-ideal circumstances. I have marked this as Leaf G, but note that it requires rejecting the premise of the entire debate.

  ***

  ### Confidence & Weakest Link

  **Confidence Level:** **75%**.
  This tree successfully sorts the major rationalist/meta-ethical clusters I see in the LessWrong archives. It cleanly separates the Realists from the Constructivists and isolates the specific "Indirect Normativity" move (the Epistemic Constraint) that defines the CEV crowd.

  **Weakest Link:** **Q2 (Input vs. Output).**
  I am least sure about the phrasing of Q2. In the literature, "Ideal Observer" theories often claim to be Input-based (properties of the observer), but they implicitly rely on Output (the observer is defined as one who *would* approve).
  *   *Why a philosopher might object:* A sophisticated Ideal Observer theorist might argue that "Perfect Information + Perfect Logic" *logically entails* "Convergence." They would say my Q3 is redundant because if Q2 is Input, Q3 *must* be Yes.
  *   *Defense:* I kept them separate because in the LW/rationalist community, people frequently argue that "Perfect Rationality" is under-specified (e.g., utility functions can differ). Separating Input from Convergence forces them to admit whether they think rationality *constrains* ends or just means. If they say "Rationality constrains ends," they are Kantians. If they say "No, utility functions are arbitrary," they are Humean Instrumentalists (which leads to Leaf B or Deflationism).

  **Final Advice for the Post:**
  When you post this, anticipate the "Humean" objection at Q3. Many LWers believe reason is the slave of the passions. They will say two ideal agents *can* disagree because they have different terminal values. If they say that, force them to Leaf B (Indexical) and ask if they are comfortable calling that "morality" or just "preference." That is usually where the real argument begins.
