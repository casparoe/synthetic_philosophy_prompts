answer: |-
  # Final Examination: Cooperative Game Theory and Bargaining

  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Instructions:** Answer all parts of the single question below. Calculators are not permitted. You must show all working for computational parts. For theoretical parts, definitions must be precise.

  **Reference: Standard Axioms**
  For the purposes of this question, a *bargaining solution* is a function $f$ assigning a feasible point $f(S, d)$ to every bargaining problem $(S, d)$. The following axioms may be relevant:
  1.  **Pareto Efficiency (PAR):** $f(S, d)$ is not weakly dominated by any other point in $S$.
  2.  **Symmetry (SYM):** If $S$ is symmetric about the line $u_1 = u_2$ and $d_1 = d_2$, then $f_1(S, d) = f_2(S, d)$.
  3.  **Invariance (INV):** The solution is invariant to independent positive affine transformations of utility.
  4.  **Independence of Irrelevant Alternatives (IIA):** If $S \subseteq T$ and $f(T, d) \in S$, then $f(S, d) = f(T, d)$.
  5.  **Individual Monotonicity (MON):** If $S \subseteq T$, $d$ is unchanged, and the ideal point for player $i$ is the same in $S$ and $T$ (i.e., $\max_{u \in S} u_i = \max_{u \in T} u_i$), then $f_i(S, d) \le f_i(T, d)$.

  ***

  **Question 1**

  Consider two bargaining problems with disagreement point $d = (0, 0)$.
  **Problem 1:** The feasible set $S_1$ is the comprehensive hull of the convex hull of $(0, 0), (12, 0), (10, 4),$ and $(0, 9)$.
  **Problem 2:** The feasible set $S_2$ is the comprehensive hull of the union of the rectangle with corners $(0, 0), (6, 0), (6, 12), (0, 12)$ and the triangle with corners $(0, 0), (10, 0), (0, 10)$.

  **(a)** Compute the Nash bargaining solution and the Kalai–Smorodinsky solution for **Problem 1**. For each solution, state the exact fraction of their respective ideal payoffs that each party receives. **(7 marks)**

  **(b)** The Nash and Kalai–Smorodinsky solutions satisfy different subsets of the axioms listed above. Identify the specific axiom satisfied by Kalai–Smorodinsky that Nash violates, and the specific axiom satisfied by Nash that Kalai–Smorodinsky violates. State both axioms fully. Explain why no solution can satisfy both simultaneously (given PAR, SYM, INV). To support your explanation, describe a concrete scenario where expanding the feasible set (while keeping one player's ideal payoff constant) causes the Nash solution to reduce that player's payoff. **(8 marks)**

  **(c)** Apply the Kalai–Smorodinsky construction to **Problem 2**. Calculate the coordinates of the point indicated by the construction. Determine whether this point is feasible. Discuss what this breakdown reveals about the hidden assumptions of the Kalai–Smorodinsky solution and how a defender of the solution should respond to non-convex problems. **(10 marks)**

  ***

  # Model Answer

  **(a) Computation for Problem 1**
  The ideal point for $S_1$ is $a = (12, 9)$. The Pareto frontier consists of two segments:
  1.  From $(12, 0)$ to $(10, 4)$: $u_2 = -2(u_1 - 12) = -2u_1 + 24$ for $u_1 \in [10, 12]$.
  2.  From $(10, 4)$ to $(0, 9)$: $u_2 = -0.5(u_1 - 10) + 4 = -0.5u_1 + 9$ for $u_1 \in [0, 10]$.

  **Kalai–Smorodinsky (KS):** The solution lies on the line segment connecting $d=(0,0)$ to $a=(12,9)$, given by $u_2 = \frac{9}{12}u_1 = 0.75u_1$.
  Intersecting with Segment 1: $0.75u_1 = -2u_1 + 24 \Rightarrow 2.75u_1 = 24 \Rightarrow u_1 \approx 8.73$. This is outside $[10, 12]$.
  Intersecting with Segment 2: $0.75u_1 = -0.5u_1 + 9 \Rightarrow 1.25u_1 = 9 \Rightarrow u_1 = 7.2$.
  Then $u_2 = 0.75(7.2) = 5.4$. The point $(7.2, 5.4)$ is on the frontier.
  Fractions of ideal: Player 1: $7.2/12 = 0.6$. Player 2: $5.4/9 = 0.6$.

  **Nash Solution:** Maximize $u_1 u_2$ on the frontier.
  On Segment 1: Max $u_1(-2u_1 + 24)$. FOC $-4u_1 + 24 = 0 \Rightarrow u_1 = 6$. Not in $[10, 12]$. Max is at corner $(10, 4)$, product 40.
  On Segment 2: Max $u_1(-0.5u_1 + 9)$. FOC $-u_1 + 9 = 0 \Rightarrow u_1 = 9$. In $[0, 10]$.
  Point is $(9, 4.5)$, product 40.5. Since $40.5 > 40$, Nash is $(9, 4.5)$.
  Fractions of ideal: Player 1: $9/12 = 0.75$. Player 2: $4.5/9 = 0.5$.

  **(b) Axiomatic Conflict**
  Kalai–Smorodinsky satisfies **Individual Monotonicity (MON)** but violates **Independence of Irrelevant Alternatives (IIA)**. Nash satisfies **IIA** but violates **MON**.
  **MON:** If $S \subseteq T$ and player $i$'s ideal payoff is unchanged, $i$'s solution payoff must not decrease.
  **IIA:** If $S \subseteq T$ and the solution to $T$ lies in $S$, the solution to $S$ must be the same.
  **Conflict:** IIA requires the solution to depend only on the local geometry at the solution point. MON requires the solution to depend on the global extent of the set (the ideal point).
  **Counterexample:** Consider a set $S$ where Nash is at $x$. Expand $S$ to $T$ by adding options that increase Player 2's ideal payoff but leave Player 1's ideal payoff unchanged. Under MON, Player 1's payoff should not drop. However, under Nash (via IIA), if the new options are "irrelevant" (not chosen), the solution stays at $x$. But typically, expanding the set rotates the frontier. If we expand $T$ such that the new frontier is steeper at the original Nash point, the new Nash product maximum may shift to favor Player 2, reducing Player 1's payoff despite Player 1's ideal point remaining constant. Thus, Nash violates MON.

  **(c) Problem 2 and Non-Convexity**
  **Ideal Point:** Max $u_1 = 10$ (from triangle), Max $u_2 = 12$ (from rectangle). $a = (10, 12)$.
  **KS Line:** $u_2 = \frac{12}{10}u_1 = 1.2u_1$.
  **Pareto Frontier of $S_2$:**
  For $u_1 \in [0, 6]$, the rectangle dominates, so $u_2 = 12$. Segment: $(0, 12)$ to $(6, 12)$.
  For $u_1 \in [6, 10]$, only the triangle exists, so $u_2 = 10 - u_1$. Segment: $(6, 12)$ is not on the triangle line ($6+12 \ne 10$). The frontier connects $(6,12)$ to $(10,0)$ via the triangle boundary? No.
  The set is the union. The frontier is $(0,12) \to (6,12)$. At $u_1=6$, rectangle ends. Triangle boundary is $u_1+u_2=10$. At $u_1=6$, $u_2=4$. So there is a drop? No, comprehensive hull fills the gap. The Pareto frontier connects $(6,12)$ to $(10,0)$ linearly only if convex. Here, for $u_1 > 6$, the max feasible $u_2$ is $10-u_1$.
  So Frontier is $(0,12) \to (6,12)$ then $(6,4) \to (10,0)$? No, $(6,12)$ dominates $(6,4)$.
  Actually, for $u_1 > 6$, the rectangle provides no points. The triangle provides $u_2 \le 10 - u_1$.
  So the frontier is $(0,12) \to (6,12)$ and then from $(6,12)$ we must go to $(10,0)$. But points between $u_1=6$ and $u_1=10$ on the line connecting $(6,12)$ and $(10,0)$ are *not* in $S_2$ (e.g., midpoint $(8,6)$ has sum 14, not in triangle; $u_1>6$, not in rectangle).
  The actual Pareto frontier is $(0,12) \to (6,12)$ and then $(6,4) \to (10,0)$ is dominated. The frontier is simply the boundary of the union.
  For $u_1 \in [6, 10]$, max $u_2 = 10 - u_1$.
  So Frontier segments:
  1. $u_2 = 12, u_1 \in [0, 6]$.
  2. $u_2 = 10 - u_1, u_1 \in [6, 10]$.

  **KS Construction:** Intersect $u_2 = 1.2u_1$ with Frontier.
  Segment 1: $12 = 1.2u_1 \Rightarrow u_1 = 10$. Not in $[0, 6]$.
  Segment 2: $1.2u_1 = 10 - u_1 \Rightarrow 2.2u_1 = 10 \Rightarrow u_1 = 100/22 \approx 4.54$. Not in $[6, 10]$.
  Alternatively, if one blindly connects the ideal point to the origin and intersects the *convex hull* of the frontier, one gets a point on the line between $(6,12)$ and $(10,0)$.
  Equation of line through $(6,12)$ and $(10,0)$: $u_2 = -3(u_1 - 10)$.
  Intersection: $1.2u_1 = -3u_1 + 30 \Rightarrow 4.2u_1 = 30 \Rightarrow u_1 = 50/7 \approx 7.14$.
  $u_2 = 60/7 \approx 8.57$.
  **Feasibility:** Is $(50/7, 60/7)$ in $S_2$? $u_1 > 6$, so must satisfy $u_1 + u_2 \le 10$. Sum $= 110/7 \approx 15.7 > 10$. **The point is infeasible.**

  **Implication:** The KS construction presupposes **convexity** of the feasible set. It assumes the line segment from $d$ to $a$ intersects the Pareto frontier at a feasible point. In non-convex sets, this line may pass through "holes" in the set.
  **Defender's Response:** A defender must argue that KS is defined only for convex problems. For non-convex problems, one must either (1) convexify the set (allow lotteries) before applying KS, or (2) accept that KS is inapplicable and use a solution concept designed for non-convexity (e.g., maximizing a different function). Applying KS mechanically to non-convex sets yields meaningless results.

