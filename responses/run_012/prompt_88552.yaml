  # Marking Scheme

  **Part (a): Computation (7 Marks)**
  *   **1 mark:** Correct identification of Ideal Point $a=(12, 9)$.
      *   *Mistake:* Taking max coordinates from vertices without checking comprehensive hull (e.g., missing 9).
  *   **2 marks:** Correct KS coordinates $(7.2, 5.4)$ with valid intersection logic (rejecting Segment 1).
      *   *Mistake:* Intersecting with the wrong line segment or arithmetic error in fractions.
  *   **1 mark:** Correct KS fractions ($0.6$ for both).
      *   *Mistake:* Calculating fractions relative to the wrong ideal point.
  *   **2 marks:** Correct Nash coordinates $(9, 4.5)$ with valid optimization (checking corners vs FOC).
      *   *Mistake:* Assuming Nash is always at the "middle" of the frontier or ignoring the kink.
  *   **1 mark:** Correct Nash fractions ($0.75, 0.5$).
      *   *Mistake:* Swapping player fractions.

  **Part (b): Axioms (8 Marks)**
  *   **2 marks:** Correctly identifying MON (for KS) and IIA (for Nash).
      *   *Mistake:* Confusing SYM or INV as the distinguishing axioms.
  *   **2 marks:** Stating both axioms fully and correctly (as per Reference).
      *   *Mistake:* Vague definitions (e.g., "Monotonicity means getting more") without set inclusion conditions.
  *   **2 marks:** Explaining the incompatibility (Local vs Global dependence).
      *   *Mistake:* Stating they conflict without explaining the mechanism (ideal point vs local tangent).
  *   **2 marks:** Concrete counterexample description (Set expansion reduces payoff under Nash).
      *   *Mistake:* Describing a set expansion that changes the ideal point of the hurt player (violating MON precondition).

  **Part (c): Non-Convexity (10 Marks)**
  *   **2 marks:** Correct Ideal Point for $S_2$ ($10, 12$).
      *   *Mistake:* Assuming ideal point is $(6, 12)$ or $(10, 10)$.
  *   **2 marks:** Correct KS Line equation ($u_2 = 1.2 u_1$).
      *   *Mistake:* Slope calculation error.
  *   **3 marks:** Identifying the KS intersection point is infeasible (showing sum > 10 or outside set).
      *   *Mistake:* Assuming the intersection is feasible because the math yields a number.
  *   **3 marks:** Discussion: Explicitly naming Convexity as the hidden assumption and proposing convexification or restriction of domain as the defense.
      *   *Mistake:* Blaming the "comprehensive hull" or suggesting the solution is simply the closest feasible point without theoretical justification.
