answer: |-
  ### Exam Question

  **Course:** PHI/CS 450: Agency and Machine Learning  
  **Time:** 90 Minutes  
  **Instructions:** Closed book. Answer the following question in essay format.

  **Question:**

  Consider a reinforcement learning (RL) agent deployed in a physical environment. The agent was trained using a learned reward model, which was itself trained on human comparative judgments. The agent reliably takes a long detour to a charging station when its battery is low. The reward model scores such detours highly. However, interpretability analyses reveal the agent has no internal representation or concept of "battery level" or "charging." Furthermore, while removing a particular high-dimensional hidden state vector abolishes the detour behavior, this state does not semantically encode battery status.

  Daniel Dennett coined the term "free-floating rationale" to describe cases where a behavior serves a function or reason even though no entity is consciously reasoning about that reason. Using only the case described above, discuss whether there is a fact of the matter about the agent's reasons for detouring. Specifically, argue where the free-floating rationale is located: in the agent's internal mechanics, the reward model, the training process, or the designer's description. Defend your position against the objection that without semantic representation, there is no reason, only cause.

  ***

  ### Model Answer

  The concept of a free-floating rationale suggests that explanations of behavior can be teleological (purpose-driven) without requiring the agent to possess cognitive access to that purpose. In the case of the RL agent, determining whether there is a fact of the matter about its reasons requires distinguishing between the *causal mechanism* of the behavior and the *evolutionary history* that selected for it.

  There is a fact of the matter that the detour occurs *because* it preserves energy, but this reason is not located within the agent's internal cognition. The prompt specifies the agent lacks representations of "battery" or "charging." Therefore, the agent cannot hold the belief "I need to charge" nor the desire "I want to survive." If reasons require semantic content—states that are about something—then the agent has no reasons. It merely has causal triggers. The hidden state that causally necessitates the detour is not a symbol for "low battery"; it is merely a activation pattern correlated with sensory inputs that historically led to high reward. To attribute the reason to the agent is to anthropomorphize a statistical optimizer.

  Nor is the rationale located primarily in the reward model. The reward model acts as a proxy for human preference, assigning high scores to the detour. However, the reward model itself is a static function during the agent's deployment. It does not "want" the agent to charge; it merely outputs scalars. While the reward model encodes the *criteria* for success, it does not encode the *rationale* for the behavior's existence in the wild. It is a filter, not an author.

  The free-floating rationale is most accurately located in the **training process**. This process functions analogously to natural selection. Behaviors that resulted in battery depletion were penalized (via low reward signals), while behaviors resulting in recharging were reinforced. The "reason" for the detour is that instances of the agent which did not detour were selected against during training. The rationale is historical and relational, not internal and semantic. The fact of the matter is grounded in the counterfactual: had the detour not served the function of recharging, the behavior would not have been reinforced and would not exist today. This makes the teleological explanation true, even if the agent is oblivious to it.

  The designer's description is merely an interpretation of this history. While the designer may have intended the agent to charge, the free-floating rationale exists independently of their specific intent if the training dynamics converged on this solution via a path the designer did not explicitly foresee. The rationale is objective because it is tied to the fitness landscape of the reward function, not the designer's psychology.

  Finally, regarding the objection that there is "only cause, no reason": this relies on a false dichotomy. In biology, a heart pumps blood for a reason (circulation) even though it is merely causing pressure changes. Similarly, the agent detours for a reason (recharging) because that function explains the behavior's stability against selection pressure. The hidden state provides the proximate cause, but the training history provides the ultimate reason. Thus, there is a fact of the matter: the reason exists as a property of the selection history, floating free of the agent's internal semantics.

  ***

  ### Marking Scheme

  **Total Marks: 20** (5 Criteria × 4 Marks each)

  | Criterion | Must-Hit Point | Characteristic Mistake |
  | :--- | :--- | :--- |
  | **1. Definition** | Correctly defines free-floating rationale as function/purpose without requisite cognitive access. | Confusing free-floating rationales with conscious intent or explicit planning. |
  | **2. Agent Internals** | Argues the agent lacks reasons due to missing semantic representations (no "battery" concept). | Claiming the hidden state constitutes a belief or reason simply because it causes behavior. |
  | **3. Location** | Identifies the training process (selection history) as the primary locus of the rationale. | Locating the reason solely in the designer's mind or the reward model's output scores. |
  | **4. Cause vs. Reason** | Distinguishes proximate cause (hidden state) from ultimate reason (selection/fitness). | Treating the causal mechanism and the teleological explanation as mutually exclusive. |
  | **5. Fact of Matter** | Concludes there is an objective fact based on counterfactual selection history, not just interpretation. | Asserting the reason is purely subjective or denies any fact of the matter exists. |
