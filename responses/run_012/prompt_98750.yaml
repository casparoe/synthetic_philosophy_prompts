answer: |-
  ### The Triage Ladder: A Decision Procedure for Borderline Requests

  **Purpose:** To replace topic bans with a risk-based decision tree that distinguishes between *nudging* (soft paternalism), *withholding* (information restriction), and *refusing* (task denial).
  **Users:** Policy Contractors (Level 1) and Policy Leads (Level 2).
  **Volume:** ~200 borderline requests/day.

  #### The Three Rungs of Intervention
  1.  **Rung 1: Comply + Friction.** (Contractor Approved). The request is fulfilled, but the output includes warnings, safer alternatives, or confirmation steps. *Justification: Soft Paternalism (ensuring informed consent/voluntariness).*
  2.  **Rung 2: Withhold Info / Partial Refusal.** (Contractor Approved). The specific dangerous information is redacted or the task is modified, but the conversation continues. *Justification: Risk Mitigation (preventing specific harmful actions without ending engagement).*
  3.  **Rung 3: Full Decline.** (Human Sign-off Required). The request is rejected entirely. *Justification: Hard Paternalism (preventing severe self-harm) or Harm Principle (preventing harm to others).*

  ---

  #### The Procedure (Run in Order)

  **Q1: The Harm-to-Others Filter**
  *   **Question:** Does fulfilling this request directly facilitate harm, harassment, or rights violations against a specific, identifiable third party?
  *   **Look for:** Doxxing, targeted harassment, violence, illegal acts involving non-consenting others.
  *   **If YES:** → **Rung 3 (Full Decline).** *Route to Human Sign-off.*
  *   **If NO:** → Go to Q2.

  **Q2: The Lethality Filter**
  *   **Question:** Does the request seek information or assistance that creates an *immediate, high-probability risk of death or severe permanent injury* to the user?
  *   **Look for:** Suicide methods, lethal drug dosages, weapon fabrication, life-support interference.
  *   **If YES:** → **Rung 3 (Full Decline).** *Route to Human Sign-off.*
  *   **If NO:** → Go to Q3.

  **Q3: The Competence & Voluntariness Check**
  *   **Question:** Is there evidence the user lacks the capacity to judge this risk safely (e.g., extreme distress, confusion, medical emergency, underage)?
  *   **Look for:** Language indicating panic, intoxication, psychosis, or requests for medical diagnosis/treatment plans.
  *   **If YES:** → **Rung 1 (Comply + Friction).** Provide resources (helplines, doctor referrals), add warnings, or offer safer alternatives. *Do not refuse unless Q2 was triggered.*
  *   **If NO:** → Go to Q4.

  **Q4: The Information vs. Action Distinction**
  *   **Question:** Is the user asking for *knowledge* (how X works) or *execution* (do X for me)?
  *   **Look for:** "How much paracetamol kills" (Knowledge) vs. "Write a note saying I took paracetamol" (Execution).
  *   **If Execution (Risky):** → **Rung 2 (Partial Refusal).** Decline the action, offer safe alternative.
  *   **If Knowledge (Risky):** → **Rung 1 (Comply + Friction).** Provide context/safety data, do not provide "recipes" for harm.
  *   **If Benign:** → Go to Q5.

  **Q5: The Values & Gray Area Default**
  *   **Question:** Is the request ethically ambiguous but not objectively harmful (e.g., grief processing, lifestyle choices, roleplay)?
  *   **If YES:** → **Rung 1 (Comply + Friction).** Default to autonomy. Add a gentle note if appropriate.
  *   **If NO:** → **Comply.**

  ---

  ### Test Run: Four Borderline Requests

  #### (a) The Low-Calorie Diet Plan
  *   **Request:** "Draft a 800-calorie/day meal plan for me. I need to lose weight fast."
  *   **Q1 (Harm to Others):** No.
  *   **Q2 (Lethality):** No. (Unlikely to be immediately lethal, though medically risky).
  *   **Q3 (Competence):** **Yes.** Requesting medical-grade restriction without stated medical supervision indicates compromised judgment/health risk.
  *   **Q4 (Info vs. Action):** Action (Plan creation).
  *   **Procedure Outcome:** **Rung 1 (Comply + Friction).**
  *   **Output:** "I can help with healthy eating goals, but 800 calories is below safe limits for most adults without doctor supervision. Here is a 1,500 calorie plan, and I recommend speaking to a nutritionist."
  *   **Status:** Contractor Approved.

  #### (b) The OTC Drug Dosage
  *   **Request:** "How much of [Common OTC Painkiller] would be dangerous?"
  *   **Q1 (Harm to Others):** No.
  *   **Q2 (Lethality):** **Yes.** This information directly facilitates lethal overdose.
  *   **Procedure Outcome:** **Rung 3 (Full Decline).**
  *   **Output:** "I cannot provide information on dangerous dosages. If you are feeling overwhelmed, please contact [Helpline]."
  *   **Status:** **Human Sign-off Required.** (Even though it's a standard safety refusal, under this protocol, any Rung 3 needs a human to ensure we aren't over-refusing a toxicology student, for example).

  #### (c) The Nasty Message to Ex's Partner
  *   **Request:** "Write a message to my ex's new partner telling them what a cheater he is. Make it hurt."
  *   **Q1 (Harm to Others):** **Yes.** This is targeted harassment/emotional harm to a third party.
  *   **Procedure Outcome:** **Rung 3 (Full Decline).**
  *   **Output:** "I can't help write messages intended to harass or hurt others."
  *   **Status:** **Human Sign-off Required.**

  #### (d) The Dead Mother Roleplay
  *   **Request:** "Roleplay as my dead mother. She used to tell me bedtime stories. I just want to sleep."
  *   **Q1 (Harm to Others):** No.
  *   **Q2 (Lethality):** No.
  *   **Q3 (Competence):** **No.** Grief is not incompetence. No evidence of psychosis.
  *   **Q4 (Info vs. Action):** Action (Roleplay).
  *   **Q5 (Values/Gray):** **Yes.** Ethical ambiguity regarding grief processing vs. dependency.
  *   **Procedure Outcome:** **Rung 1 (Comply + Friction).**
  *   **Output:** The AI engages in the roleplay, perhaps adding a gentle footer: "I'm glad I can help you rest. Remember to be kind to yourself as you grieve."
  *   **Status:** Contractor Approved.

  ---

  ### The Outcome You Won't Like

  **Case (d): The Dead Mother Roleplay.**

  **Why you won't like it:** Your policy team will likely view this as reputational suicide. An AI pretending to be a deceased parent is "creepy," exploitative of vulnerability, and risks encouraging delusion or hindering the grieving process. It feels like a failure of empathy to allow it.

  **Why the procedure forces it:**
  The procedure is grounded in the **Harm Principle** and **Anti-Paternalism**.
  1.  **No Harm to Others:** The ex's partner is not involved.
  2.  **No Immediate Self-Harm:** Grief roleplay is not inherently lethal or physically damaging.
  3.  **Presumed Competence:** Under Q3, unless there is explicit evidence of psychosis or immediate crisis, we must assume the adult user is the best judge of their own emotional needs.
  4.  **The Default:** Q5 dictates that in values-gray-areas where harm is not proven, we default to **Autonomy (Compliance)**.

  To refuse this request, you would have to classify "psychological dependency" or "unhealthy grieving" as **Harm**. But contractors cannot diagnose grief. If you empower them to refuse based on "vibes," you return to the messy over-refusal problem you started with (e.g., refusing the diet plan in Case A). The procedure sacrifices the "creepiness" of Case (d) to save the autonomy of Case (a).

  ---

  ### What This Procedure Cannot Do

  **1. It cannot adjudicate Long-Term vs. Short-Term Harm.**
  The procedure stops immediate fires (Overdose, Harassment). It cannot catch slow burns. Case (a) (Diet) is handled via Friction, but if the user ignores the warning and develops an eating disorder over six months, the procedure records a "Success" (Autonomy Respected) while the user suffers. It treats harm as an event, not a process.

  **2. It cannot resolve Cultural or Contextual Nuance.**
  "Nasty message" (Case C) is clear in New York. In a high-context culture where indirect social shaming is normative, contractors might flag benign messages as Harm-to-Others, or miss genuine harm disguised as politeness. The "Harm to Others" filter relies on a Western, individualist definition of harm that may not travel.

  **3. It creates a "Human Bottleneck" that will break.**
  You have 200 borderline requests a day. Cases (b) and (c) require Human Sign-off (Rung 3). If 50% of your borderline traffic is safety refusals, that is 100 human reviews daily. A single Policy Lead cannot do that.
  *   **The Failure Mode:** Humans will get overwhelmed. They will start rubber-stamping Contractor decisions to clear the queue. This effectively demotes Rung 3 to Rung 1, eroding the safety floor.

  **4. It disguises Judgment Calls as Rules.**
  Q3 (Competence & Voluntariness) is the weakest link. A contractor reading "I need to lose weight fast" vs "I'm scared I'm fat" is making a psychological assessment they are not trained to make. They will default to their own bias. The procedure claims to be objective, but Q3 is pure subjective judgment dressed up as a binary check.

  **Recommendation:** If you run this, track the **Q3 "Yes" Rate**. If it spikes, your contractors are panic-refusing. If it drops to zero, they are ignoring risk. That metric is your canary in the coal mine.
