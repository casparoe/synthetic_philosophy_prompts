    "moves": [
      {
        "move": "short label",
        "tier": "S|A|B|C|D",
        "empirical_content_survives": 0.0,
        "ad_hocness": 0.0,
        "commitment": "one sentence",
        "shift": "progressive|degenerating|mixed",
        "why": "one sentence"
      }
    ],
    "overall": {
      "right_but_early_more_than_rescue": true,
      "credence": 0.0,
      "paragraph": "..."
    }
  }
