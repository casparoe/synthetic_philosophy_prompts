answer: |-
  This is a fantastic question. You have identified one of the most famous puzzles in democratic theory, often called the **Boundary Problem**. It asks: Before you can vote on a decision, you have to decide who gets to vote. But who decides that?

  If you look closely at the 2014 Scottish referendum and the 2016 Brexit referendum, you are right to see a contradiction. The rules changed not because the philosophy changed, but because the political incentives changed.

  Here is an analysis of the philosophical commitments, the consistency of the practices, and how alternative principles would reshape the outcome.

  ### 1. The Philosophical Commitments of the Two Cases

  To understand what these practices presuppose, we have to look at three competing theories of the *demos* (the people):

  1.  **The Residence Principle (All-Subjected):** You vote where you live because you are subject to the laws of that territory.
  2.  **The Citizenship Principle (Pre-political Membership):** You vote because you belong to the nation-state, regardless of where you live.
  3.  **The Stakeholder Principle:** You vote if you have a long-term future in the community.

  **The 2014 Scottish Independence Referendum**
  *   **The Rules:** 16–17-year-olds could vote; EU citizens resident in Scotland could vote; Scots living in the rest of the UK could not.
  *   **Implicit Philosophy:** This leans heavily on the **Residence Principle**. The logic was: "If Scotland becomes a country, the people living here are the ones who will be subject to its new laws."
  *   **Why 16-year-olds?** This suggests a **Stakeholder Principle**. Young people have the longest future stake in the new nation.
  *   **Why not Scots in England?** They are not resident. They will not be subject to Scottish law if Scotland becomes independent.

  **The 2016 UK EU Referendum**
  *   **The Rules:** Voting age 18; EU citizens resident in the UK could *not* vote; UK citizens living abroad (under 15 years) *could* vote.
  *   **Implicit Philosophy:** This leans heavily on the **Citizenship Principle**. The logic was: "This is a decision about the United Kingdom's sovereign status, so only UK nationals decide."
  *   **Why not EU citizens?** Even though they lived and worked in the UK, they were not members of the British *nation*.
  *   **Why UK expats?** They retain citizenship. The 15-year limit suggests a fading **Stakeholder Principle**; if you leave too long, you lose your stake.

  ### 2. Consistency vs. Underdetermination

  You asked if these commitments are consistent. The short answer is **no**.

  In 2014, residence mattered more than citizenship (EU citizens in, Scots out). In 2016, citizenship mattered more than residence (EU citizens out, expats in).

  Is the practice philosophically underdetermined? **Yes.**
  There is no single constitutional rule in the UK that dictates who must vote in a referendum. In the UK system, Parliament is sovereign. This means the *demos* is not fixed by moral right or constitutional law; it is fixed by **political negotiation**.

  *   **2014:** The Scottish National Party (SNP) wanted a broader *demos* (younger people and immigrants tended to support independence). The UK government agreed to these terms to make the vote look legitimate.
  *   **2016:** The Conservative government wanted a narrower *demos* (younger people and immigrants tended to support remaining in the EU). They reverted to standard UK general election rules.

  **Reconstructing the Implicit Theory**
  If we try to find a theory that explains both, it isn't a moral theory. It is a theory of **Convenient Sovereignty**.
  *   **Strict Requirement:** The central legislature (Westminster) or the devolved legislature (Holyrood), by agreement, has the absolute legal authority to define the *demos* for any specific vote. There is no higher court that can strike this down as "unfair."
  *   **Merely Fits:** Any claim to fairness, consistency, or democratic principle. The rules "fit" the political goals of the party setting the election.

  ### 3. What Would Change Under Alternative Principles?

  If we stopped using "Convenient Sovereignty" and adopted a strict philosophical principle, the voter rolls would look very different.

  **Scenario A: The All-Affected Interests (AAI) Principle**
  *   *The Rule:* Anyone whose significant interests are impacted by the decision must have a vote.
  *   **2014 Scotland:**
      *   *Change:* Scots living in England would likely get to vote. An independent Scotland changes the economy, defense, and family ties for Scots in England.
      *   *Change:* EU citizens would definitely vote (trade and travel affect them).
  *   **2016 Brexit:**
      *   *Change:* EU citizens living in the UK would *have* to vote. Brexit drastically affected their right to reside and work. Excluding them would be undemocratic under AAI.
      *   *Change:* 16–17-year-olds would vote. They will live with the consequences the longest.
      *   *Change:* Citizens of Ireland or France might argue they are affected by UK trade barriers and should vote (though this gets messy quickly).

  **Scenario B: The All-Subjected to Law (ASL) Principle**
  *   *The Rule:* Anyone who is legally bound by the resulting government's laws must vote.
  *   **2014 Scotland:**
      *   *Result:* Similar to the actual vote. Residents (including EU citizens) are subject to Scottish law. Scots in England are subject to English law, so they are excluded. This actually matches the 2014 rules well.
  *   **2016 Brexit:**
      *   *Change:* This gets complicated. EU law applied to residents. So, EU citizens in the UK were subject to the laws being voted on (whether to keep or leave EU law). They should have voted.
      *   *Change:* UK expats are not subject to UK law while abroad (they don't pay UK income tax, etc.). Under a strict ASL principle, they should *not* have voted.

  ### 4. Meta-Cognition: Verdict and Failure Points

  You asked me to tell you what would change my verdict and where my reasoning might fail. This is crucial for honest philosophy.

  **What would change my verdict?**
  My verdict is that the UK practice is inconsistent and driven by political expediency rather than principle. I would change this view if:
  1.  **Legal Constraint Evidence:** If you could show me a specific clause in the *Edinburgh Agreement* (2014) or the *EU Referendum Act* (2015) that legally *forced* these distinctions for constitutional reasons rather than political ones. (However, most legal scholars agree Westminster had the discretion to choose differently).
  2.  **Coherent "Union" Theory:** If there were a published government white paper arguing that "Constitutional Referendums require Citizenship" while "Devolution Referendums require Residence," and this was applied consistently elsewhere. Since the UK has no written constitution, this is unlikely.

  **Where is my reasoning most likely to fail?**
  1.  **Attributing Malice to Muddle:** I am assuming the inconsistency is cynical. It is possible that different committees simply used different "standard templates" without thinking about the philosophical clash. It might be bureaucratic inertia rather than political manipulation.
  2.  **The "Affected" Problem:** In the AAI section, I suggest Scots in England should vote in 2014. But under AAI, *everyone* is affected by everything. If Scotland leaves, oil prices change, affecting people in Japan. Where do we draw the line? My reasoning glosses over the difficulty of defining "significant interest."
  3.  **US Bias:** I am writing in American English and analyzing a UK problem. In the US, we are used to a written Constitution that fixes voting rights more rigidly. I might be underestimating the UK's "unwritten constitution" flexibility, where inconsistency is a feature, not a bug.

  ### Summary for Your Understanding
  The boundary problem shows that democracy cannot fully justify its own borders. The UK examples prove that the *demos* is often a political tool, not a moral right.
  *   **2014** prioritized **Residence** (who lives here?).
  *   **2016** prioritized **Citizenship** (who belongs to us?).
  *   **Consistency:** None.
  *   **If you want fairness:** You must choose a principle (AAI or ASL) and accept that it will require changing who voted in the past.

  If you are writing an essay on this, your strongest argument is that without a fixed constitutional rule for the *demos*, democracy remains vulnerable to the people in power rigging the electorate to win the vote.
