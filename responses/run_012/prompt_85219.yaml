prompt: |-
  I'm a high school student trying to understand the boundary problem: who belongs to the demos that gets to decide? A pair of real practices puzzles me. In the 2014 Scottish independence referendum, 16- and 17-year-olds could vote, and EU citizens who lived in Scotland could vote, but Scots who had moved to England could not. In the 2016 UK-wide referendum on EU membership, the voting age was 18, most EU citizens who lived in the UK could not vote, but UK citizens who had lived abroad for less than 15 years could. What philosophical commitments about the demos does this pair of practices presuppose? Does it presuppose that the demos is fixed by residence and subjection to the decision in some cases, and by national membership and affected interests in others? Are those commitments consistent, or is the practice philosophically underdetermined? Reconstruct the implicit theory, separate what the rules strictly require from what they merely fit, and say what would have to change if we instead adopted an all-affected-interest principle or an all-subjected-to-law principle. Please write in American English, and tell me what would change your verdict and where your reasoning is most likely to fail.
