      6.  **Point 4: The Hard Case.** (Substantive failure: Exclusion vs. Contextualization).
      7.  **Conclusion & Alternative:** The Forensic Investigator/Translator hybrid. What it licenses (Inference to best explanation, probabilistic knowledge).

      *Wait, need to be careful on the "Criminal Standard".* History rarely meets "Beyond Reasonable Doubt." It usually operates on "Preponderance of Evidence" or "Clear and Convincing." The seminar's insistence on Criminal Standard is a major substantive failure.

