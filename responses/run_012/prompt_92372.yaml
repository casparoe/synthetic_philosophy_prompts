prompt: |-
  ok so i've been chewing on this for weeks and i want an actual number out of you, not a vibe. here's the claim, stated as precisely as i can get it: there is a single phenomenal property that every pleasant experience has and that no unpleasant or neutral experience has — some one thing that does the work of making a pleasure a pleasure. i'll call it the common-core claim. what's your credence that its true?

  the reason i care: if it's true, hedonism is a substantive thesis — well-being really is pleasure, and "pleasure" picks out something determinate. if it's false, hedonism either goes trivial (well-being is whatever feels good, and feeling good is just... whatever it is we happen to call feeling good) or it has to be propped up by some non-phenomenal story about what makes an experience count.

  don't hand me 'it depends what you mean by pleasure.' give me the decomposition, with a number for each term and one line of justification, then the combination. i'd want at least these, but add whatever else you think belongs:

  1) how much you weight the mixed cases — bittersweet things, a sad song thats somehow pleasurable, schadenfreude — where an experience seems pleasant and unpleasant at once. if those are genuine, does that push you toward two independent axes (a positive system and a negative system that can both be firing) rather than one bipolar pleasantness dial? and how much does that count against a single shared property?
  2) whether the right account of pleasure is sensory (a distinctive feeling) or attitudinal (taking pleasure in something) — and if it's attitudinal, whether it even needs a shared phenomenal property to come out true.
  3) whether you'd count a shared neural or functional mechanism, if someone found one, as evidence for the phenomenal claim or as a change of subject.
  4) how much of your number is hostage to whether pleasure is a natural kind at all, versus a cluster concept we should maybe just stop trying to pin down.

  then your final number, then the term you're least confident in and the single piece of evidence or argument that would move it most. last thing: is there a version of hedonism that survives even if the common-core claim is false — and if so, does it still deserve the name, or is it hedonism in name only?
