answer: |-
  **Credence that the Common-Core Claim is true: 0.35 (35%)**

  Here is the decomposition of that credence. I have treated the final number as a weighted average of the probability that the Common-Core Claim (CCC) holds *along each specific dimension*, weighted by how decisive that dimension is for the overall truth of the claim.

  | Term | Weight | Prob. CCC Holds | Contribution | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Mixed Cases (Bivariate vs. Bipolar)** | 0.15 | 0.60 | 0.09 | Simultaneous pleasure/pain suggests independent positive systems, but not necessarily a *unitary phenomenal* property. |
  | **2. Sensory vs. Attitudinal** | 0.35 | 0.25 | 0.09 | Attitudinal accounts (taking pleasure in) explain heterogeneity better; sensory accounts (a specific feel) fail introspection. |
  | **3. Neural/Functional Mechanism** | 0.10 | 0.50 | 0.05 | A unified reward system (e.g., opioids) could exist without implying a unified *phenomenal* quality (multiple realizability). |
  | **4. Natural Kind vs. Cluster** | 0.25 | 0.40 | 0.10 | "Pleasure" likely functions as a Wittgensteinian family-resemblance concept rather than a rigid natural kind. |
  | **5. Introspective Homogeneity (Added)** | 0.15 | 0.20 | 0.03 | Direct phenomenological inspection reveals no single "tingle" common to eating, sex, and solving math problems. |
  | **TOTAL** | **1.00** | | **0.36** → **0.35** | *Rounded down to reflect the conjunctive nature of the claim (all must hold).* |

  ### Least Confident Term
  **Term 4: Natural Kind vs. Cluster.**
  I am least confident here because the boundaries of phenomenal concepts are notoriously difficult to map; it is possible we lack the vocabulary to describe a subtle commonality that exists but is unnamed.

  ### Evidence That Would Move It Most
  **Psychophysical Invariance:** If researchers demonstrated a single, scalable psychophysical law (like Stevens' Power Law) that maps *all* pleasant stimuli across *all* modalities (auditory, gustatory, cognitive) onto one invariant subjective magnitude scale with zero residual variance, my credence would jump from 0.35 to >0.80. This would prove a shared quantitative core exists.

  ### Survival of Hedonism
  **Yes, a version survives.**
  If the CCC is false, **Attitudinal Hedonism** (e.g., Chris Heathwood's account) remains viable. It defines well-being not by a common *feeling*, but by the subject's pro-attitude (desire, endorsement) toward their experiences.
  **Does it deserve the name?** Yes. It retains the core hedonist commitment that well-being is determined entirely by subjective mental states rather than objective goods (virtue, knowledge), even if those mental states are heterogeneous. It is hedonism about *subjectivity*, not hedonism about *sensation*.
