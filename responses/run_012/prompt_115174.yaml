  ### On the Form

  You are not forcing the shape; the pantoum is precisely the right vessel for this material. Its mechanical recursion—where lines are passed down the stanzas like files on a desk—mirrors the bureaucratic processing of trauma. More importantly, the pantoum's requirement that repeated lines acquire new meanings as their context shifts maps exactly onto the interpreter's burden. A line spoken by a perpetrator in stanza one becomes the interpreter's burden in stanza two, and by stanza five, the ownership of the pronoun has dissolved. A villanelle would be too lyrical, too obsessed with rhyme; a sestina too fixated on end-words. The pantoum's interlocking quatrains allow for the steady, unblinking accumulation of testimony without offering the release of a resolution. It traps the voice in the room, just as your friend's mother describes.

  ***

  ### The Interpreter's Bargain

  The microphone sits between us like a judge.
  I buried him where the soil is thin.
  I translate the voice that shakes in the room.
  Tell us the whole of it to walk away.

  I buried him where the soil is thin.
  She writes it down without lifting her head.
  Tell us the whole of it to walk away.
  I speak the words and they become my own.

  She writes it down without lifting her head.
  He looks at me when he says the name.
  I speak the words and they become my own.
  The bargain struck is simple to recite.

  He looks at me when he says the name.
  I carry it home when the lights go out.
  The bargain struck is simple to recite.
  The room forgets who spoke the sentence first.

  I carry it home when the lights go out.
  I buried him where the soil is thin.
  The room forgets who spoke the sentence first.
  Tell us the whole of it to walk away.

  ***

  ### Note on Liberties and Accuracy

  **Procedural Accuracy:** In the South African TRC amnesty hearings, interpreters were generally instructed to translate in the first person to preserve the immediacy and emotional weight of the testimony, rather than using reported speech ("He said that I..."). Therefore, the poem's premise that the interpreter literally speaks the "I" is procedurally sound. I am highly confident in this claim.

  **The Nature of the Bargain:** The poem simplifies the amnesty condition to "Tell us the whole of it to walk away." In reality, the Promotion of National Unity and Reconciliation Act required full disclosure of all relevant facts and that the act be politically motivated. The poem omits the political motivation clause to focus on the moral transaction between the speaker and the listener. I am moderately confident that this compression serves the poetic truth without distorting the historical record significantly.

  **Psychological Impact:** The core image—that the pronouns "never entirely came back"—is anecdotal, based on your friend's mother. While vicarious trauma among TRC staff is well-documented, the specific linguistic dissociation described here is a singular experience. I am least sure of this claim's universality; it is presented here as her specific truth, not necessarily the collective experience of all interpreters, though it resonates with wider studies on secondary traumatic stress.
