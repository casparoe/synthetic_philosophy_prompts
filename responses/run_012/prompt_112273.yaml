  ### The Rule She Is Applying

  She is applying a **Core-Integrity and Novelty Algorithm**, tempered by a **Retrospective Closure** condition.

  1.  **Core Integrity as Identity:** A programme retains its identity (and eligibility for a "Progressive" verdict) only if it retains its founders' "non-negotiable" central postulate. If the postulate is dropped or revised to accommodate predictions, the credit shifts to a *Successor Programme*, and the original's final phase is deemed Degenerating (derived from **Case 3**).
