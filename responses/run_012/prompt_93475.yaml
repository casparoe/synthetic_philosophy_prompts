answer: |-
  ### The Translation

  You are experiencing déjà vu because the **Boundary Problem** in democratic theory is structurally isomorphic to the **Reference Class Problem** in probability, specifically when coupled with **Self-Locating Uncertainty**.

  In your native vocabulary, the *demos* is the **reference class** $C$ from which a decision-making sample is drawn. The "boundary" is the support of the distribution defining $C$. The question "Who belongs in the demos?" translates to "By what rule do we define the support of $C$ such that inferences drawn from $C$ to the particular case are valid?"

  Here is the position-by-position translation, pushing the statistical analogy as far as it holds without forcing it.

  #### 1. The Circularity (The Democratic Paradox)
  *   **Political Form:** To define the demos democratically, you need a prior demos to vote on the definition.
  *   **Statistical Form:** To select the optimal reference class for a prediction, you need a loss function. To define the loss function, you need to know which errors matter. Which errors matter depends on which variables you care about. Which variables you care about depends on the reference class you have already selected.
  *   **Translation:** This is a **fixed-point problem in model selection**. You cannot optimize the model without a prior over models, but the prior over models is itself a modeling choice. In Bayesian terms, it is the problem of hyperparameter selection without a meta-distribution.

  #### 2. All Affected Interests (AAI)
  *   **Political Form:** Include everyone whose interests are causally impacted by the decision.
  *   **Statistical Form:** Define the reference class $C$ as the set of all observer-moments $x$ such that $P(\text{Outcome} | \text{Action}, x) \neq P(\text{Outcome} | \text{Action})$.
  *   **The Push:** This corresponds to including all **causally downstream nodes** in the graphical model.
  *   **The Failure:** In a connected causal graph, the support of $C$ becomes effectively infinite (the "butterfly effect"). The variance of the estimator blows up. If you condition on "everyone affected," you condition on almost everything, rendering the reference class uninformative (maximum entropy). It is the statistical equivalent of overfitting to noise because you refused to prune the graph.
  *   **The AI Case:** If an AI system has a utility function that can be optimized or harmed by the decision, it is a downstream node. Statistically, it must be included in the expectation calculation. If it has no utility function, it is part of the environment (noise), not an observer.

  #### 3. All Subject to Coercion (ASC)
  *   **Political Form:** Include everyone subject to the binding authority of the decision.
  *   **Statistical Form:** Define the reference class $C$ as the set of all observer-moments $x$ that are **conditioned on** the output of the decision mechanism.
  *   **The Push:** This is **selection bias** treated as a feature. You define the class by the intervention itself. $C = \{x \mid x \text{ is constrained by } \text{Policy}\}$.
  *   **The Failure:** This creates a closed loop where the sample determines the population. It is analogous to training a classifier only on data points that the classifier itself previously flagged. It minimizes variance (the class is well-defined) but introduces massive bias (systematic exclusion of externalities).
  *   **The AI Case:** If the AI is regulated, it is in the class. If it is a tool used to enforce regulation, it is part of the mechanism, not the sample. The ambiguity lies in whether the AI is a *constrained variable* or a *constraint function*.

  #### 4. The Asymmetry: Fixed vs. Self-Constituting
  You identified a crucial asymmetry: *A reference class is discovered; a demos is constituted.*

  *   **Statistical View:** The reference class is a property of the world (or the modeler's ignorance). The observer is a random draw from a distribution they did not choose. You cannot update the prior $P(C)$ simply by wishing to be in a different class. Self-locating belief (SSA/SIA) is about *finding* your index in a fixed set.
  *   **Political View:** The *demos* is an agent that can rewrite its own sampling distribution. The members are not just draws; they are the *parameters* of the distribution.
  *   **Translation:** In statistics, this is the difference between **Inference** (estimating $\theta$ given data $D$) and **Control** (choosing action $A$ to change $D$). The boundary problem arises because democratic theory tries to solve a Control problem using Inference tools. It asks "Where is the boundary?" (Inference) when the actual operation is "Draw the boundary" (Control).

  ---

  ### Residue Report

  This section details what survives the translation, what distorts, and what evaporates.

  #### 1. Clean Carry-Over (The Epistemic Core)
  *   **The Arbitrariness of Cuts:** The statistical intuition that any cutoff on a continuous variable (e.g., "degree of affectedness") is arbitrary maps perfectly to the political complaint that borders are morally arbitrary.
  *   **The Overfitting/Underfitting Trade-off:** AAI leads to high variance (too many noisy inputs); ASC leads to high bias (systematic exclusion). Political theorists are implicitly optimizing for a bias-variance tradeoff without admitting they are doing so.
  *   **The AI Ambiguity:** Your déjà vu is accurate. The question "Is AI in the demos?" is identical to "Is AI an observer node?" In both Self-Indication Assumption (SIA) debates and democratic theory, the core friction is distinguishing **agents** (sources of observation/votes) from **substrate** (environment/compute).

  #### 2. Distorted Carry-Over (The Normative Stretch)
  *   **Legitimacy $\neq$ Validity:** In statistics, a reference class is "good" if it yields accurate predictions. In politics, a demos is "legitimate" if it yields binding obligations. You can have a statistically valid reference class that is politically tyrannical (e.g., "All people who like ice cream" might predict voting behavior well, but cannot levy taxes).
      *   *Flag:* **Normative Force.** Probability deals in *is* (likelihood); Democracy deals in *ought* (authority). The translation turns "right to rule" into "predictive accuracy," which loses the coercive element.
  *   **Consent $\neq$ Conditioning:** Being "subject to coercion" is not the same as being "conditioned on." In probability, conditioning is passive. In politics, subjection is a violation of autonomy unless authorized. The statistical model cannot capture the *wrongness* of exclusion, only the *error* of exclusion.

  #### 3. Untranslatable Residue (The Blind Spot)
  *   **Constitutive Power:** The ability of the *demos* to redefine itself has no statistical counterpart. A probability distribution cannot vote to change its own support. This requires a **second-order agency** that standard probability theory does not model.
  *   **The "Who" Question:** In statistics, "Who are you?" is a query about an index $i$ in a set $\{1...N\}$. In politics, "Who are you?" is a claim to standing. The residue here is **Identity**. In stats, identity is a label; in politics, identity is a source of rights.
  *   **Conflict Resolution:** The boundary problem exists because people *disagree* about the boundary. In statistics, if two modelers pick different reference classes, they just get different predictions. In politics, if two groups pick different demoi, they go to war (or one coerces the other). The statistical framework assumes a single objective function; the political framework assumes competing objective functions.

  ---

  ### Honest Assessment: What the Residue Indicts

  You asked whether the boundary problem is "a real problem about knowledge dressed up as a problem about authority."

  **The residue suggests the opposite.**

  The probabilistic framework handles the *knowledge* problem (the reference class problem) quite well: it admits that class selection is pragmatic, context-dependent, and ultimately grounded in the loss function of the observer. If the boundary problem were purely epistemic, the political theorists would simply admit that the *demos* is a modeling choice optimized for stability or welfare, and move on.

  They do not move on. They treat the boundary as a matter of **right**.

  The fact that the translation fails on **Constitutive Power** and **Normative Force** indicts the **Probabilistic Vocabulary**, not the Political Theory. Your native framework is blind to **Agency**. It treats observers as passive locators of truth. Democratic theory treats citizens as active authors of law.

  *   **If the problem were epistemic:** We would solve it by finding the reference class that minimizes prediction error regarding "social welfare."
  *   **Because the problem is political:** We cannot solve it by finding the "correct" class, because there is no external truth to correspond to. The "truth" is created by the boundary drawing itself.

  **Verdict:** The boundary problem is not a problem about knowledge dressed up as authority. It is a problem about **conflicting agency** dressed up as a classification problem. Political theorists use the language of boundaries (knowledge) because they lack a formal calculus for conflicting authorship (authority).

  Your déjà vu regarding AI is the smoking gun. In rationalist circles, the question "Is the AI an observer?" is epistemic (does it have qualia? does it update beliefs?). In the reading group, the question "Is the AI in the demos?" is political (does it have standing? can it be coerced?). The structural similarity exists because both are trying to solve the **Demarcation Problem** (where does the mind/agent end and the environment begin?). But the *stakes* differ. In probability, getting it wrong means bad predictions. In democracy, getting it wrong means tyranny.

  The residue indicates that your statistical vocabulary is insufficient to capture the **recursive self-authorship** of a political body. You can model the *constraints* of a demos statistically, but you cannot model the *constitution* of a demos without introducing a primitive for "Will" or "Authority" that has no counterpart in measure theory.

  ### Mapping Table

  | Political Concept | Statistical Counterpart | Status of Mapping |
  | :--- | :--- | :--- |
  | **The Demos** | Reference Class / Support of Distribution | **Clean** (Structurally identical) |
  | **Boundary Problem** | Reference Class Selection Problem | **Clean** (Same logical circularity) |
  | **All Affected Interests** | Causal Downstream Nodes (Infinite Support) | **Clean** (Leads to high variance/normalization failure) |
  | **All Subject to Coercion** | Conditioned Variables (Selection Bias) | **Clean** (Leads to high bias/closed loop) |
  | **Legitimacy** | Predictive Validity / Model Fitness | **Distorted** (Loses normative "ought") |
  | **Coercion** | Conditioning / Intervention | **Distorted** (Loses violation of autonomy) |
  | **Self-Constitution** | Endogenous Distribution Update | **Failed** (No statistical equivalent for self-rewriting priors) |
  | **Standing / Rights** | Weight in Expectation Calculation | **Failed** (Weights are pragmatic, rights are deontic) |
  | **AI System Status** | Observer Node vs. Latent Variable | **Clean** (The source of your déjà vu) |

  **Summary:** The logic is isomorphic; the ontology is not. You have successfully translated the *syntax* of the argument, but the *semantics* of authority remain in the residue.
