prompt: |-
  I have a maths background and have been reading rationalist blogs and forums for the better part of fifteen years, which means the reference class problem is more or less native to me: you want to reason about some particular case, you have to say what population it is a random draw from, and every answer is either so broad that it tells you nothing or so narrow that there are no statistics left and the choice starts to look reverse-engineered from the conclusion you wanted. I recently let myself be recruited into a reading group on democratic theory, where the recurring topic is what people there call the boundary problem: any account of democracy has to say who the demos is, but the demos apparently cannot be identified democratically without presupposing itself, and the two most popular ways out -- include everyone whose interests are affected by the decision, or include only those actually subject to its coercive authority -- each look either arbitrary or absurd at the edges. The standard hard cases came up (children, the severely cognitively disabled, non-citizen residents, people in other countries downstream of a climate policy, future generations), and someone raised AI systems, at which point I said out loud that I felt like I had read this exact argument before in a completely different key and everyone looked at me. I would like to find out whether that reaction was insight or pattern-matching. My fluency is lopsided: I know the probability and self-locating-belief material cold, and I know the political theory only from this reading group and a few essays.

  What I want from you is a translation, not a verdict on which position is right. Restate the boundary problem and the main positions on it in the vocabulary I actually think in -- reference classes, the support of a distribution, self-locating uncertainty, the distinction between the class you were in fact drawn from and the class you would need statistics for, priors over which member you are, and the pragmatic maxims people use for picking a reference class when the principled answer is unavailable. Go position by position and push each one as far as it will honestly go, but do not quietly smuggle the statistical vocabulary's assumptions in and then present the result as a translation: if legitimacy, standing, or coercion has no counterpart on the probability side, I want it left untranslated and flagged rather than paraphrased into expected utility and declared a success. Then give me the residue report. Which claims carry over cleanly, which survive only in a distorted form, and which cannot be expressed at all? I am especially interested in one asymmetry I think I see: an observer is a member of a reference class that nobody in the class chose and that no member can revise, whereas the demos is supposed to be a body that constitutes its own membership and can in principle redraw itself. Tell me whether that is a real structural difference or just a difference in who is doing the talking.

  Finish with your honest assessment of which side the residue indicts. Is there something the political debate is trading on that the probabilistic framework is simply blind to, in which case the translation's failure is a defect of my vocabulary and not of theirs -- or does the fact that the residue cannot be carried over suggest that the thing being carried was never as well-defined as the political theorists assume, and that the boundary problem is a real problem about knowledge dressed up as a problem about authority? A short table of the mapping would help me keep the pieces straight, but the residue report is the part I care about, so do not let the table eat the analysis.
