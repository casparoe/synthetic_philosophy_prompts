      **SUBJECT:** Recommendation on Kellerman Works Exhibit Script

      **Decision Required:**
      We are not merely choosing words; we are choosing how this city weighs evidence when the evidence is rigged. Below is my recommendation for Thursday's vote.

      **The Core Question: Record vs. Memory**
      The standard archival assumption is that the written record holds primacy over oral memory. My position is that this assumption fails when the record's provenance is compromised by the actors responsible for the violence. The coroner's inquest was conducted by company counsel; the newspaper was company-owned. The missing pages are not an accident; they are evidence. To privilege these documents over community memory is not neutrality; it is accepting the company's curation of history.

      However, the cautionary voice on this board—represented by our City Attorney and the Foundation—is not without merit. Their strongest argument is stewardship: public funds cannot assert disputed liabilities as settled fact, especially when state claims are pending. We risk legal exposure and the appearance of bias if we present allegory as adjudication. We must respect this constraint without surrendering our historical integrity.

      **Recommendations for Vote**

      **1. The Main Panel Text**
      Adopt a narrative that states the agreed facts first, then juxtaposes the conflicting accounts with source attribution.
      *Draft:* "On April 1907, six men died at the Kellerman gate. State militia fired into a crowd of strikers. The company record claims the crowd attacked first; the community remembers an unprovoked massacre. Historians note the company controlled the investigation."
      *Reasoning:* This satisfies the legal need for attribution while validating the community's experience.

      **2. The Word "Massacre"**
      Use the word, but contextualize it.
      *Recommendation:* The exhibit shall use the phrase "The Kellerman Massacre" as a proper noun reflecting community naming, accompanied by a plaque note: "So named by the descendants and labor community."
      *Reasoning:* This acknowledges the memory without the City legally defining the event as a massacre in a vacuum. It respects the Foundation's request not to "prejudge" by clarifying that this is a historical moniker, not a legal verdict.

      **3. The Two-Ledger Rule**
      Adopt the rule as proposed, with one clarification.
      *Recommendation:* We will maintain a Record Ledger (documented sources) and a Memory Ledger (oral history, community tradition). Items cannot move from Memory to Record without documentation. However, items in the Memory Ledger cannot be removed solely for lack of documentation *unless* they are proven false.
      *Reasoning:* This protects the descendants' truth from being erased by a silenced archive. It treats memory as data, not decoration.

      **4. The Strikebreaker Detail**
      Include it.
      *Recommendation:* The script must note that two of the deceased had recently crossed the picket line.
      *Reasoning:* The descendants' split is painful, but sanitizing history serves no one. Complex martyrs are still martyrs. Acknowledging this strengthens the Memory Ledger by proving we are not building a myth, but telling a hard truth.

      **5. The Foundation**
      Proceed despite their objection.
      *Recommendation:* Inform the Foundation that while we value their endowment, the City cannot contract away its historical judgment. We will acknowledge their support but cannot alter findings to suit their comfort.
      *Reasoning:* Public history serves the public. If the Foundation withdraws, we seek other funding. Integrity is non-negotiable.

