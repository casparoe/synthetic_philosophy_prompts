answer: |-
  This is a sharp observation, and you are right to feel that the standard econ terminology doesn't quite capture it. In welfare economics, we are taught that interpersonal comparisons of utility (ICU) are either impossible (Robbins) or require explicit ethical axioms (Sen, Harsanyi). What you are describing is the *practice* of making those comparisons without the *accountability* of those axioms.

  You are asking for the name of the move where an ethical premise is converted into a technical parameter to shield it from scrutiny. Since you asked me to brainstorm candidates before committing, let's walk through the three closest existing concepts from the philosophy of economics, sociology of quantification, and measurement theory. I will explain why each is close, and why none of them quite nails the specific "ethical insulation" mechanism you've identified.

  ### Candidate 1: Commensuration
  **Literature:** Sociology of valuation (Espeland & Stevens), Economic Sociology.
  **The Idea:** Commensuration is the process of transforming different qualities into a common metric so they can be compared (e.g., turning "education quality" and "safety" into a single school ranking score).
  **Why it's close:** It perfectly describes the *act* of making the comparison. It acknowledges that turning distinct values into numbers is a social process, not a natural discovery.
  **Where it falls short:** Commensuration describes the *transformation*, but it doesn't necessarily imply the *hiding*. One can commensurate openly and politically (e.g., a legislature voting on weights). Your observation is specifically about the *insulation*—the claim that the metric is "just technical." Commensuration theory often focuses on the consequences of comparison (power dynamics), not specifically on the epistemological camouflage of the weights.

  ### Candidate 2: Black Boxing
  **Literature:** Science and Technology Studies (Latour, Callon).
  **The Idea:** A "black box" is a system where the internal workings are rendered invisible; only inputs and outputs matter. Complex controversies are settled by turning the process into a tool that users don't need to understand.
  **Why it's close:** This captures the *insulation* mechanism perfectly. The vulnerability score or the QALY metric is a black box. The ethical fight happened (or didn't) inside the box; the policy user just sees the number.
  **Where it falls short:** Black boxing is a general theory of how technology and science work, not specific to *welfare* or *ethics*. A car engine is black-boxed, but that's not an ethical evasion. This term doesn't capture the specific stakes of *interpersonal comparison* or the specific move of disguising a *normative* choice as an *epistemic* one.

  ### Candidate 3: Conventions of Equivalence
  **Literature:** History of Statistics/Political Economy (Alain Desrosières, "The Politics of Large Numbers").
  **The Idea:** Statistical categories (like "unemployment" or "GDP") rely on "conventions"—agreements to treat different things as equivalent for the sake of measurement. These conventions look like natural facts but are actually political compromises that have hardened over time.
  **Why it's close:** This is the strongest historical fit. Desrosières explicitly argues that statistical tools allow the state to act at a distance by making political choices look like technical facts. Your example of the "weights set years ago by nobody" is a classic convention of equivalence.
  **Where it falls short:** It is largely historical and macro-sociological. It explains how a GDP comes to exist, but it doesn't give you a tidy term for the *micro-move* a modeler makes when they select a benchmark to avoid an ethical argument in a committee meeting today.

  ### The Verdict and The Coined Term

  There is no single canonical term in *welfare economics* for this, because the discipline often prefers not to acknowledge the move exists (it violates the Robbinsian prohibition on cardinal utility without admitting it). However, in the **Philosophy of Measurement** and **Science and Technology Studies (STS)**, this is recognized as a specific subtype of value-ladenness.

  If I have to coin a term that captures the specific boundaries you are interested in, I would call this **Normative Encapsulation**.

  **Definition:** Normative Encapsulation occurs when a substantive ethical judgment (specifically regarding trade-offs between agents or goods) is embedded within the operational definition of a measurement instrument, and the instrument is subsequently defended using only epistemic or technical criteria (reliability, data availability, standardization).

  The "Encapsulation" does two things:
  1.  **Containment:** It traps the ethical choice inside the methodology so it cannot be easily extracted for debate.
  2.  **Protection:** It shields the choice from ethical critique by surrounding it with technical language (variance, significance, availability).

  ### Pushing on the Edges

  You asked to test the boundaries of this pattern. Here is how **Normative Encapsulation** behaves under the stress tests you proposed.

  **1. Is the pattern still present when weights are explicit and openly debated?**
  *   **Verdict:** No, or at least significantly diminished.
  *   **Reasoning:** If the housing committee says, "We value a disabled child 1.5x more than an able-bodied adult, and we chose this because we prioritize vulnerability over efficiency," they have *dis-encapsulated* the norm. The comparison is still there, but it is owned.
  *   **The Edge Case:** However, if they debate the weights *only* on technical grounds (e.g., "If we weight disability higher, the variance in the score increases," or "This weight aligns with the UNHCR benchmark"), the encapsulation remains. The *source* of the justification matters more than the visibility of the number. If the justification is technical, the norm is encapsulated.

  **2. Does it survive if a single decision-maker sets the weights and publicly owns them as her own ethical judgment?**
  *   **Verdict:** No. This collapses the phenomenon into simple **Authority**.
  *   **Reasoning:** Normative Encapsulation relies on the *impersonality* of the instrument. The power of the QALY or the vulnerability score is that "the model says so," not "the Director says so." If a dictator sets the weights and says, "This is my value judgment," the technical insulation is gone. The move you are identifying depends on the *erasure of the agent* who made the choice. It requires the instrument to appear agent-less.

  **3. Is it the same phenomenon when the unit is a physical quantity rather than a money-like one?**
  *   **Verdict:** Yes, absolutely.
  *   **Reasoning:** This is a crucial insight. You might think physical units (tons of CO2, number of lives saved) are neutral. They are not. Choosing to measure climate policy in "tons of carbon" rather than "percentage of population displaced" is an act of Normative Encapsulation. It decides whose suffering counts in the metric.
  *   **Example:** In health, measuring "lives saved" vs. "life-years saved" privileges the young over the old. Both are physical counts. The choice of *which* physical count to optimize is where the ethical comparison is encapsulated. The "technical" defense is usually "data availability" (we have better data on mortality than morbidity), which is exactly the pattern you noticed in your seminar.

  **4. How does it relate to the standard worry that comparisons between people are arbitrary?**
  *   **Verdict:** It is a **response** to that worry, not a version of it.
  *   **Reasoning:** The standard worry (from Robbins/Lionel Robbins) is: "We cannot scientifically compare utility between people, so we shouldn't try."
  *   **The Move:** Normative Encapsulation answers: "We *must* compare to make policy, so we will do it scientifically by assuming the comparison is already solved by the metric."
  *   It bypasses the arbitrariness worry by refusing to acknowledge the choice. It treats the arbitrariness as a *technical error term* rather than an *ethical gap*. It doesn't solve the incommensurability problem; it hides it inside the operating system.

  ### Where this lives for your research

  Since you are in a policy school with an econ background, you will find this discussion most vigorously happening in three places that sit just outside your core curriculum:

  1.  **The Philosophy of Measurement:** Look for work discussing the "value-ladenness of measurement." The key distinction here is between *epistemic values* (accuracy, precision) and *non-epistemic values* (equity, justice). Normative Encapsulation happens when non-epistemic values are disguised as epistemic requirements (e.g., "We must use this metric because it is more *precise*," ignoring that it measures the *wrong thing*).
  2.  **Governance by Numbers / Algorithmic Regulation:** This literature (Supiot, Desrosières) focuses on how legal and political norms are converted into numerical standards. They argue that this conversion isn't neutral; it changes the nature of the norm.
  3.  **Critical Welfare Economics:** There is a niche within welfare economics (often influenced by Sen or feminist economics) that critiques "Objective List" approaches or Cost-Benefit Analysis for hiding distributional weights. They often refer to this as the **"Distributional Assumption"** problem, but they rarely have a name for the *act of hiding it*.

  ### Summary for your Reading Group

  If you want to intervene in that philosophy reading group, you can frame it like this:

  "The standard critique is that interpersonal comparisons are impossible. My observation is that they are inevitable, but they are being **operationally encapsulated**. We aren't failing to compare; we are comparing via **conventions of equivalence** that are insulated by **technical necessity**. The philosophical problem isn't the impossibility of comparison; it's the **unaccountability of the operationalization**."

  This moves the debate from "Can we measure?" (which leads to skepticism) to "Who decides how we measure, and how are those decisions justified?" (which leads to political philosophy and measurement theory). That is likely where the room will find the most traction.
