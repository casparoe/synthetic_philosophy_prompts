prompt: |-
  Im putting together a proposal for a small summer research grant (roughly two months, ending in a 8-10k word paper) and I have a half-baked idea I'd like you to turn into something submittable. The area is the old fight over whether numbers count when you can't save everyone -- Taurek's thing where you can save your friend or save five strangers and he says there's no duty to go for the five. Here's my hunch. Almost every version of this debate runs on one-shot cases: you're at the pond, you choose, done, the numbers either count or they don't. But actual life is full of repeats -- you face the same kind of choice again next month, and the month after. If someone consistently favors the one over the many, then across a run of independent situations they end up responsible for a lot fewer lives saved, and I think there's something fishy about whether Taurek's view can just wave that away as illicit "aggregation across cases." What I actually want to know is whether the repetition changes anything or whether it's a trick: does the non-aggregator get pushed into being some kind of collective or rule-following reasoner once you string the cases together, and if so does that hand the numbers a foothold they didn't have in the single case? And does it matter whether the cases are genuinely independent, or whether it's the same people each time, or whether I don't even know how many times I'll face the choice -- an indefinite horizon, so I can't just say it evens out in the long run.

  Turn this into a proposal: state the question so it has a determinate answer, explain why the standard individualist and the standard aggregator positions don't already settle it, lay out how I'd actually work on it (month by month, I've got two months), say what a real result would look like versus what would just be me rehashing the debate in different words, and be honest about what would make this too thin for a grant. No bibliography, I'll add the citations myself.
