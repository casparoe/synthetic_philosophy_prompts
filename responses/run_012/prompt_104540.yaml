answer: |-
  # Q&A Prep Sheet: Moral Foundations & Political Disagreement

  **Strategy Note:** You are in a room of believers (MFT users) with a few specialized attackers. Your goal is not to destroy MFT, but to carve out space for your *interpretation* of it without triggering a defensive mob. Your normative claim is your shield; your descriptive claim is your sword. Do not let them conflate the two.

  ### 1. The Psychometrician (The Kill Shot)
  **The Objection:** "You're arguing about item wording, but you haven't tested for measurement invariance. If the factor structure doesn't hold scalar invariance across liberals and conservatives, you can't compare means at all. Are you saying the MFQ lacks invariance, or are you just asserting content bias without a model?"
  *   **Concede:** "I am not running a new invariance model in this paper. I'm granting the existing factor structure for the sake of argument."
  *   **2-Minute Reply:** "My point isn't that the factors don't load; it's that they load on *different semantic content* for each group. Even if invariance holds mathematically, if 'Fairness' items operationalize 'Equality' and 'Loyalty' items operationalize 'Boundary,' we aren't measuring commensurable values. I'm arguing for content validity over construct validity here. The math works, but the map doesn't match the territory."
  *   **Soft Spot:** If they produce a paper showing strict scalar invariance *and* argue that implies commensurability, your descriptive claim loses its technical footing.
  *   **Status:** **CRITICAL.** If this reply fails, the descriptive half collapses.

  ### 2. The MFT Insider (The "No New Data" Attack)
  **The Objection:** "You're re-interpreting ten years of validated data without collecting a single new response. The MFQ predicts behavior and voting better than any alternative. Why should we trust your armchair reading of the items over the predictive validity of the scale?"
  *   **Concede:** "Predictive validity is the MFQ's strong suit, and I'm not offering a new dataset."
  *   **2-Minute Reply:** "Predictive validity doesn't guarantee construct validity. A barometer predicts rain, but it doesn't tell you *why* it rains. I'm arguing the MFQ predicts political behavior partly because it tracks *linguistic salience* in political discourse, not necessarily deep moral weighting. My contribution is diagnostic, not predictive. I'm explaining the mechanism of the gap, not denying the gap exists."
  *   **Soft Spot:** It can look like you're moving the goalposts from "science" to "philosophy" to avoid empirical falsification.

  ### 3. The Dyadic Morality Proponent (The Reductionist)
  **The Objection:** "Gray and colleagues have shown that all five foundations funnel through a single template of harm and victimhood. Authority and Sanctity are just perceived harm in disguise. If it's all harm, your distinction about question wording is moot."
  *   **Concede:** "Harm is a dominant currency in moral judgment, and dyadic theory captures a lot of variance."
  *   **2-Minute Reply:** "Even if the *engine* is harm, the *steering* is different. A liberal sees harm in inequality; a conservative sees harm in boundary violation. My point is that the MFQ forces these into separate buckets that look like distinct values, when they might be distinct *narratives* about harm. That distinction matters for political negotiation, even if the deep psychology is dyadic."
  *   **Soft Spot:** If they argue dyadic morality explains 100% of the variance, your five-foundation critique becomes epiphenomenal.

  ### 4. The Intuitionist (The Normative Block)
  **The Objection:** "You say this shifts the burden in reflective equilibrium. But reflective equilibrium already accounts for biased data. We screen for reliability and bias before weighing intuitions. You haven't changed the method, you've just added a step we already do."
  *   **Concede:** "Reflective equilibrium is the right framework, and screening is standard practice."
  *   **2-Minute Reply:** "Standard practice treats 'liberal intuition' as the control group and 'conservative intuition' as the deviation. By showing the measurement tool itself privileges liberal semantic framing (Equality vs. Boundary), I'm arguing the *input data* is systematically skewed before screening begins. It's not just bias; it's a structural asymmetry in whose intuitions count as 'moral' versus 'conventional' at the intake stage."
  *   **Soft Spot:** If they view this as merely a sociological point about academia rather than a philosophical point about justification, the normative half loses weight.

  ### 5. The Fieldworker (The WEIRD Critic)
  **The Objection:** "I'm back from the field. The five foundations don't carve nature at the joints outside the US. If the framework doesn't travel, why are we debating the wording of the American English questionnaire?"
  *   **Concede:** "MFT is undeniably WEIRD-centric, and cross-cultural generalizability is limited."
  *   **2-Minute Reply:** "Precisely why this matters. The MFQ is being used to diagnose *American* political polarization. Even if it fails in Fiji, it's the dominant tool in DC. My critique is internal to the context where the tool is actually deployed. We need to fix the lens we're using here before we worry about exporting it."
  *   **Soft Spot:** Limits the scope of your paper to "American Political Psychology," which may feel too narrow for a moral psychology workshop.

  ### 6. The Developmentalist (The Moral/Conventional Distinction)
  **The Objection:** "Turiel showed decades ago that kids distinguish moral violations from conventional ones. Authority and Sanctity often fail the moral criteria (generalizability, seriousness). You're treating conventional norms as moral foundations."
  *   **Concede:** "The moral/conventional distinction is robust in developmental literature."
  *   **2-Minute Reply:** "In adult political discourse, that distinction collapses. Conservatives *experience* authority violations as moral harms. My descriptive claim is about phenomenology and survey response, not developmental ontology. If the survey asks about 'respect for authority' and they rate it high, that's data about their moral experience, even if a developmentalist would code it as conventional."
  *   **Soft Spot:** Risks conflating "felt morality" with "justified morality," which blurs your own normative line.

  ### 7. The Expressivist Metaethicist (The Meta-Ethical Nitpick)
  **The Objection:** "You talk about who is 'right' in the normative half. But if moral claims are expressions of attitude, not truth-apt statements, there is no 'right' to be had. You're presupposing cognitivism."
  *   **Concede:** "Metaethics is contested, and I'm not defending cognitivism here."
  *   **2-Minute Reply:** "I'm making a claim about *epistemic burden*, not moral truth. Even for an expressivist, some attitudes are more coherent, stable, and widely shared than others. Shifting the burden of proof changes which attitudes get scrutinized. That's a procedural claim, compatible with expressivism."
  *   **Soft Spot:** If they press that "burden of proof" implies a truth-apt framework, you could get bogged down in metaethics.

  ### 8. The "Hope Nobody Asks" (The Self-Defeat Trap)
  **The Question:** "If the MFQ is too biased to trust for your descriptive claim, why is it the primary evidence you're using to make that claim? Aren't you using the tool to prove the tool is broken?"
  *   **Concede:** "It is a tension, and I rely on the MFQ because it's the standard."
  *   **2-Minute Reply:** "I'm not saying the data is noise; I'm saying the *interpretation* is skewed. I'm using the MFQ data exactly as it exists to show how the wording drives the result. It's an immanent critique. I'm standing on the ground to show the ground is uneven."
  *   **Soft Spot:** This is the hardest balance. If you lean too hard on the bias, you undermine your evidence. If you lean too hard on the evidence, you undermine the bias claim.

  ***

  ### The Single Reply That Must Land
  **Objection #1 (The Psychometrician).**
  You must successfully distinguish **Content Validity** from **Construct Validity**. If the room decides that "Measurement Invariance = Commensurability," your argument that the questions are asking different things (Equality vs. Boundary) becomes irrelevant. You need them to accept that a mathematically valid scale can still be semantically asymmetric. If you lose this, the descriptive half is dead, and the normative half has no hook.

  ### The Question You're Hoping Nobody Asks
  **"If you succeed in shifting the burden of proof, does that mean we ought to accommodate conservative demands on sanctity and authority in legislation?"**
  *   **Why it's dangerous:** It forces your normative claim to cash out in policy. If you say "Yes," you alienate the liberals in the room. If you say "No," you undermine the claim that the burden shift matters.
  *   **Preparation:** Keep the answer strictly epistemic. "It means their objections must be *answered*, not necessarily *accommodated*. It changes the quality of the debate, not necessarily the legislative outcome."
