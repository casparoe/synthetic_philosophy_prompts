      *Wait, I need to make sure I don't miss the "Platitude" option.*
      Is there a platitude reading? "People should like living in cities." Too vague. "Cities belong to people." Too vague.
      Maybe: "The city should serve its inhabitants." Almost everyone agrees, but it's too vague to decide zoning. That's a good "Rhetorical/Platitude" row. It explains why everyone uses the phrase but means different things.

      *Revised Plan:*
