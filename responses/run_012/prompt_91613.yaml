  The organizer is most likely intending the **Existing Resident Priority** reading, possibly bolstered by the **Procedural Veto** claim; this combination allows them to frame the tower as both a moral violation against neighbors and a democratic failure, sidestepping the legal reality the counsel pointed out. However, the phrase itself is most likely functioning as the **General Welfare Platitude** in the hearing room; it serves as a "floating signifier" that allows the organizer, counsel, and council member to appear to debate the same principle while actually arguing past one another about exclusion, property law, and affordability respectively.
