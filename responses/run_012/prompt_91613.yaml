  | **Procedural Veto** | Zoning decisions lack democratic legitimacy unless directly consented to by those immediately adjacent to the change. | Political-Legitimacy | Affected Residents | Decision-making power | Substantive | Yes, as a hyper-local democratic theory, but incompatible with representative governance. | Organizer | This renders the approval process "illegitimate"; it fails if the city is treated as a single polity rather than a collection of villages. |
