prompt: |-
  I'm a TA for a grad seminar on effective altruism and global priorities research and I'm writing the take-home final. I want one long-answer question on cause prioritisation that a student cant get through just by reciting importance, tractability and neglectedness back at me. One of them argued in section this week that we should ditch neglectedness and use the elasticity of marginal returns instead -- how fast the value of an extra dollar tails off as you pour more into a cause -- and claimed its strictly more rigorous. I want the question to force them to say whether that's a genuine replacement or the same idea in better clothes, and to confront the thing that bugs me: the three criteria aren't in the same units, so is the framework a decision rule, a checklist, or just a way of generating estimates? Grad students in philosophy and econ, 90 minutes, 25 marks. Give me the question, a model answer of about 700 words, and a marking scheme that names the moves an A answer has to make and the specific mistakes that should cost marks (e.g. treating neglectedness as a good in itself).
