answer: |-
  ### Exam Question: Global Priorities Research (Final)

  **Question 1 (25 Marks)**
  **Time Allocation:** 90 Minutes

  In a recent seminar discussion, a colleague proposed discarding the 'Neglectedness' criterion of the Importance-Tractability-Neglectedness (ITN) framework. They argued that 'Neglectedness' is merely an imprecise proxy for the **elasticity of marginal returns** (how quickly value diminishes as investment increases) and that rigorous prioritization should model elasticity directly.

  Write an essay addressing the following two prompts:

  1.  **Substitution vs. Refinement:** Is elasticity a genuine theoretical replacement for neglectedness, or is it the same underlying concept dressed in more rigorous terminology? In your answer, distinguish between *average* and *marginal* value.
  2.  **Framework Ontology:** The three ITN criteria are measured in incommensurable units (e.g., welfare magnitude, probability of success, funding levels). Does this render the framework a strict decision rule, a checklist, or a heuristic for decomposing expected marginal value? Defend your classification.

  ***

  ### Model Answer

  The proposal to replace 'Neglectedness' with 'elasticity of marginal returns' identifies a crucial tension between the operational heuristics of Effective Altruism (EA) and the underlying economic theory of altruistic allocation. To evaluate this, one must distinguish between the *mechanism* of value decay and the *observable proxies* used to estimate it.

  Regarding the first prompt, elasticity is not a replacement for neglectedness; rather, neglectedness is a coarse proxy for elasticity. The theoretical goal of cause prioritization is to maximize expected *marginal* value, not *average* value. A cause may be vast (Important) and solvable (Tractable) on average, yet offer zero marginal value if it is already saturated. The 'Neglectedness' criterion attempts to capture where a cause sits on its marginal returns curve. In standard economic models of philanthropy, we assume diminishing marginal returns: the first dollar solves the most pressing problems, the millionth dollar solves less pressing ones. The elasticity of marginal returns measures the rate of this decay.

  Therefore, the student is correct that elasticity is the more rigorous concept. However, calling it a "replacement" misunderstands the epistemic position of prioritizers. We rarely know the true elasticity of a cause area (e.g., AI safety or global health) because we lack the data to map the full production function of social good. 'Neglectedness'—usually measured by current funding or labor levels—serves as an observable input to estimate that elasticity. If a field is highly neglected, we infer we are on the steep part of the curve (high marginal returns). If we ditched neglectedness without a superior method to estimate elasticity, we would lose our primary signal. Thus, elasticity is the *theoretical reality*, while neglectedness is the *operational clothing*. It is the same idea, but one is a parameter in a model, and the other is a variable we can actually measure.

  This leads to the second prompt regarding the framework's ontology. The fact that ITN criteria utilize incommensurable units (e.g., "number of lives" $\times$ "percentage reduction in risk" $\times$ "funding gap") suggests the framework cannot function as a strict decision rule or algorithm. A strict decision rule requires cardinal measurability and a defined aggregation function (e.g., $V = I \times T \times N$). In practice, prioritizers do not multiply these numbers to generate a precise utility score. The uncertainty ranges on each variable are too vast for the product to be meaningful.

  Consequently, the ITN framework is best classified as a **heuristic for decomposing expected marginal value**. Its purpose is not to calculate value directly, but to prevent specific cognitive errors. 'Importance' counters scope neglect; 'Tractability' counters wishful thinking; 'Neglectedness' counters the diminishing returns trap. By forcing analysts to estimate these components separately, the framework structures uncertainty rather than resolving it. It is a checklist of necessary conditions for high marginal value, not a sufficient formula for calculating it.

  However, treating it as a checklist carries risks. If analysts treat Neglectedness as an intrinsic good rather than a proxy for marginal returns, they may prioritize obscure causes with low elasticity simply because they are underfunded. This is a category error. The framework is a tool for approximating the derivative of the value function ($\frac{dV}{d\$}$), not the integral.

  In conclusion, the student's proposal highlights the economic foundation of EA but underestimates the epistemic constraints of global priorities research. Elasticity is the target, but neglectedness is the arrow. We should not discard the arrow until we have a better way to hit the target. Furthermore, recognizing ITN as a decomposition heuristic rather than a multiplicative formula resolves the issue of incommensurable units. The framework does not solve the aggregation problem; it structures the estimation of the variables that feed into a broader expected value calculation. Rigor requires acknowledging that ITN is a map, not the territory.

  ***

  ### Marking Scheme (25 Marks Total)

  **Part 1: Neglectedness vs. Elasticity (10 Marks)**
  *   **A-Grade Move (4 marks):** Explicitly identifies that Neglectedness is a *proxy* for the slope of the marginal returns curve, while Elasticity is the *parameter* describing that slope. Argues they are theoretically identical but epistemically distinct.
  *   **A-Grade Move (3 marks):** Clearly distinguishes between *average* value (total scale) and *marginal* value (value of the next dollar). Explains that ITN aims to estimate marginal value.
  *   **Standard Answer (2 marks):** States elasticity is more rigorous but fails to explain the proxy relationship.
  *   **Penalty (-3 marks):** Treats Neglectedness as an intrinsic moral good (e.g., "it is fair to help the neglected") rather than an instrumental indicator of returns.
  *   **Penalty (-2 marks):** Claims Elasticity is a totally different concept that ignores scale.

  **Part 2: Framework Ontology & Units (10 Marks)**
  *   **A-Grade Move (4 marks):** Correctly classifies ITN as a **heuristic** or **decomposition tool** rather than a strict decision rule/algorithm. Justifies this via the incommensurability of units and high uncertainty.
  *   **A-Grade Move (3 marks):** Explains that the "multiplicative" view ($I \times T \times N$) is a simplification for ordering, not a literal calculation of utility units.
  *   **Standard Answer (2 marks):** Identifies the unit problem but offers no clear classification of what the framework *is*.
  *   **Penalty (-4 marks):** Insists ITN is a strict decision rule/formula that *should* yield cardinal values despite the unit mismatch.
  *   **Penalty (-2 marks):** Dismisses the framework entirely as "meaningless" due to unit issues, ignoring its function as a check against bias.

  **Synthesis and Clarity (5 Marks)**
  *   **A-Grade Move (3 marks):** Synthesizes Part 1 and 2 (e.g., linking the proxy nature of Neglectedness to the heuristic nature of the framework).
  *   **Writing Quality (2 marks):** Precise terminology, logical flow, appropriate academic tone.
  *   **Penalty (-1 to -5 marks):** Significant ambiguity, failure to address both prompts, or exceeding word count significantly (if enforced).

  **Specific "Fail" Conditions:**
  *   Failing to mention **marginal returns** results in a maximum of 10/25.
  *   Defending Neglectedness as "fairness" without linking to efficiency results in a maximum of 15/25.
