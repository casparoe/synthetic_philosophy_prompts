      *   *The "Game Form" Resolution:* If rights are defined as "freedom to choose" rather than "guaranteed outcome," the paradox dissolves. (Nozick's critique).
      *   *The "Preference Restriction" Resolution:* If we restrict domain to "self-regarding," the paradox vanishes *in Sen's framework*. But is that a solution or a dodge? It implies Liberalism *requires* us to not care about others' private acts. That's a substantive moral claim, not just a technical fix.

  6.  **Synthesize the "Moral" for the User:**
      *   The user's intuition is correct: The standard examples rely on interdependent preferences.
