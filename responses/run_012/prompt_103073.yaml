          6.  Final takeaway for dinner parties.

      *   *Refining the "Self-Regarding" point:* I need to be careful. In Sen's original setup, if preferences are strictly self-regarding *and* rights are assigned over disjoint pairs, Pareto comparisons across those pairs won't exist. So the cycle breaks. So yes, the paradox *depends* on interdependent preferences.
      *   *But:* Is it plausible to demand self-regarding preferences? If I love my neighbor, my utility depends on them. Excluding that is a huge constraint on Welfarism.
      *   *The "Game Form" argument:* This is the strongest counter. Sen defines rights over *outcomes*. If I have a right to read, it means if I choose to read, the outcome is "I read". But if you have a right to ban, and you choose to ban, the outcome is "no one reads". If we both exercise rights, we conflict. Rights as "protected choices" (game forms) avoid this. Sen later acknowledged this distinction.

      *   *Comparison to Arrow:* Arrow = Consistency of aggregation rule. Sen = Consistency of values (Liberty + Pareto). Arrow is about *procedure*. Sen is about *principles*.

