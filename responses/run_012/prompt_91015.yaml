  | Reading | The claim, precisely | Verdict | Gets my neighbor there? | What would settle it? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Internal State Claim** | **Type:** Prediction about psychology.<br>**Claim:** Laws cannot force individuals to internally *believe* an action is wrong, only to stop doing it. | **Platitude.**<br>Obviously true; a law cannot change a heartbeat or a private thought, only punish external actions. | **No.**<br>The bylaw targets the *shop's* behavior (handing out bags), not the shopper's soul. He would need to add: *"The goal of this law is to change beliefs, not behavior."* | Look at the text of the bylaw. If it penalizes handing out bags, it is legislating behavior, not belief. |
  | **2. The Behavioral Efficacy Claim** | **Type:** Prediction about outcomes.<br>**Claim:** Laws cannot successfully change established habits or behaviors if people feel a moral or practical need to do otherwise. | **False / Defensible.**<br>False as a universal rule (seatbelt laws worked); defensible if specific to this context (people will just smuggle bags). | **Yes.**<br>If the law won't reduce plastic use, it is a waste of time. | Data from similar towns. Did plastic waste actually go down after bans elsewhere, or did people just buy thicker "reusable" bags once? |
  | **3. The Jurisdictional Claim** | **Type:** Claim about authority.<br>**Claim:** A town council lacks the legitimate authority to decide what counts as "virtuous" or "ethical" consumption. | **Defensible.**<br>Many argue local gov should handle infrastructure (roads, water), not ethical engineering. | **Yes (Out of bounds).**<br>It concludes the council is overstepping, regardless of whether the ban would work. | The town's charter or enabling legislation. Does the council have the mandate to regulate environmental health, or only "safety"? |
  | **4. The Harm Principle Claim** | **Type:** Claim about the purpose of law.<br>**Claim:** Law should only prevent direct harm to others, not enforce "green" virtue where harm is diffuse or debatable. | **Defensible / Controversial.**<br>Classic liberal view (J.S. Mill), but hinges on whether plastic waste counts as "harm" like pollution or noise. | **Yes (Out of bounds).**<br>If plastic bags aren't "harm" in the same way as assault or theft, the law is illegitimate. | A consensus on whether microplastics/waste constitutes a public harm equivalent to noise or physical danger. |
  | **5. The Norm Crowding Claim** | **Type:** Prediction about social psychology.<br>**Claim:** **[FLAG: Price vs. Shame]** Putting a price/fine on a behavior replaces moral motivation with market calculation, making people *less* likely to care ethically. | **Defensible.**<br>Sociological theory (crowding out effect): fines make it a "fee for service" rather than a moral wrong. | **Yes (Weaker form).**<br>It suggests the bylaw might be counter-productive. He'd need to add: *"We want people to stop because it's wrong, not because it costs 5 cents."* | Behavioral studies on whether fines reduce intrinsic motivation in environmental contexts compared to education campaigns. |
  | **6. The Expressive Claim** | **Type:** Claim about political messaging.<br>**Claim:** Law should not be used primarily to "send a message" or signal disapproval; it should solve concrete problems. | **Radical / False.**<br>All law sends messages (speed limits signal safety is valued). Rejecting this denies a core function of legislation. | **Yes.**<br>Directly counters the "send a message" argument. If messaging isn't a valid goal, the bylaw is pointless. | A philosophical agreement on the purpose of local government: Is it a service provider or a community leader? |

