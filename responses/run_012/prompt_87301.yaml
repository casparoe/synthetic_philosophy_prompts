prompt: |-
  A ship in a storm jettisons cargo to save the vessel, or diverts to a port of refuge at great expense. Maritime law does not leave the unlucky cargo owner to bear that loss alone: the ship, the surviving cargo, and the freight all contribute pro rata according to the value each of them saved, so that what one interest gave up for the common safety is made good by all who benefited from it. The doctrine is ancient and is still written into modern bills of lading. Treat it as a lifeboat problem and ask what it presupposes about justice among parties thrown together in a common peril. Does it presuppose a pre-existing community of fate whose interests are pooled in emergencies, a duty of reciprocity owed to whoever bears the sacrifice, or merely an efficient risk-sharing arrangement that rational shippers would have contracted into in advance? The practice discriminates among these answers: contribution is owed only if the sacrifice succeeds. If the ship goes down anyway, the jettisoned cargo recovers nothing, though its sacrifice was just as real and just as voluntary. Tell me what that success condition reveals about the doctrine's actual grounding, whether the doctrine is coherent once we read it that way, which elements of the practice are strictly presupposed and which merely fit comfortably with it, and where the practice is philosophically underdetermined, in the sense that rival theories would license it equally well. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** General Average in maritime law (jettisoning cargo/diverting to save the vessel, costs shared pro rata by saved interests).
      *   **Core Question:** What does this doctrine presuppose about justice among parties in common peril? (Community of fate? Duty of reciprocity? Efficient risk-sharing?)
      *   **Key Constraint/Clue:** Contribution is owed *only if the sacrifice succeeds* (if the ship sinks, no contribution is paid).
      *   **Tasks:**
          1.  Determine what the "success condition" reveals about the doctrine's grounding.
          2.  Assess coherence based on that grounding.
          3.  Identify strictly presupposed elements vs. those that merely fit comfortably.
          4.  Identify where the practice is philosophically underdetermined (rival theories license it equally well).
      *   **Formatting Constraints:**
          1.  Lead with the bottom line in the first sentence.
          2.  Give the reasoning immediately after.
          3.  No preamble.
          4.  No restating of the question.

  2.  **Deconstruct the "Success Condition":**
      *   *Fact:* If the ship sinks, the sacrificed cargo gets nothing from the others (because there are no "others" or "saved interests" to contribute).
      *   *Implication:* This rules out a pure "duty of reciprocity" or "compensation for sacrifice" based solely on the act itself. If it were about compensating the victim for their loss regardless of outcome, the estate of the sacrificed cargo should have a claim against the estates of the lost cargo/ship (though practically impossible, legally the principle would hold). But the law says: no salvation, no contribution.
      *   *Implication:* This rules out a pure "community of fate" where losses are pooled regardless of outcome. If it were a true pool, everyone shares the loss even if everyone dies (metaphorically), but here the obligation arises *from* the benefit received.
      *   *Implication:* This strongly supports the "efficient risk-sharing/benefit principle" interpretation. The liability is grounded in *unjust enrichment* or *benefit conferred*, not in the sacrifice itself. You pay because you were saved, not because someone else suffered.

  3.  **Evaluate Theories against the Success Condition:**
      *   *Community of Fate:* Weak. A community of fate suggests shared burden regardless of outcome. The success condition makes the burden contingent on survival.
      *   *Duty of Reciprocity:* Weak. Reciprocity implies "I sacrifice for you, you owe me." If you die, you still owed me based on the promise/relationship. But here, if the common adventure fails, the debt vanishes.
      *   *Efficient Risk-Sharing/Contractualism:* Strong. Rational actors would agree to share costs *only if* the venture succeeds because if it fails, there are no assets to share anyway. It aligns with the principle of "benefit."
      *   *Unjust Enrichment/Restitution:* Strongest. The core legal principle is that those who benefited from the sacrifice must contribute. No benefit = no contribution.

  4.  **Assess Coherence:**
      *   Is it coherent? Yes, if viewed as a rule of *benefit-based contribution* rather than *loss-based compensation*. It treats the maritime adventure as a joint enterprise where liability is contingent on the preservation of the fund.
      *   Potential incoherence: It feels harsh on the sacrificed cargo owner if the ship sinks anyway. They lost everything *and* get no contribution. But legally, since everyone lost everything, there's no fund to contribute from. So it's practically coherent, even if morally stark.

  5.  **Identify Presupposed vs. Comfortable Fit:**
      *   *Strictly Presupposed:* The existence of a "common maritime adventure" and the causal link between sacrifice and preservation. The requirement that there must be *saved value* to contribute.
      *   *Comfortable Fit:* The pro rata calculation based on value. This fits benefit theory but could also fit community theory. The specific mechanism of adjustment is less philosophically determined than the liability trigger.

  6.  **Identify Underdetermination:**
      *   Where do rival theories license it equally well?
      *   *Contract vs. Restitution:* Is it an implied contract (hypothetical agreement) or a quasi-contract (unjust enrichment)? Both explain the success condition (no benefit/no assets = no pay).
      *   *Utilitarianism vs. Rights-based:* Utilitarians say it maximizes overall welfare by encouraging necessary sacrifices. Rights-based theorists might say it respects property rights by ensuring no one is taxed without benefit. Both arrive at the same rule.
      *   *The "Community" aspect:* While the success condition weakens the "community of fate" theory, a modified version (community exists *only* upon successful preservation) could still fit. So the *idea* of community isn't fully ruled out, just the unconditional version.

  7.  **Drafting the Response (incorporating constraints):**
      *   *First Sentence (Bottom Line):* The success condition reveals that General Average is grounded not in compensatory justice for sacrifice nor in an unconditional community of fate, but in the principle of unjust enrichment contingent upon benefit.
      *   *Reasoning:*
          *   Explain why sacrifice/reciprocity fails (if ship sinks, sacrifice was real but no debt exists).
          *   Explain why benefit/unjust enrichment works (liability arises from being saved, not from another's loss).
          *   Coherence: It is coherent as a rule of distribution among survivors, treating the voyage as a joint fund where claims attach only to preserved value.
          *   Presupposed: The causal link between sacrifice and survival; the existence of a residual fund.
          *   Comfortable Fit: The pro rata valuation method (could be different, but fits the benefit model).
          *   Underdetermination: Contractualism (hypothetical agreement) vs. Restitution (unjust enrichment) vs. Utilitarianism (incentivizing safety). All justify the success condition.

  8.  **Refining the First Sentence:**
      *   Needs to be punchy and cover the main conclusion about the grounding.
      *   "The success condition reveals that the doctrine is grounded in benefit-based restitution rather than compensatory justice or unconditional solidarity."

  9.  **Refining the Reasoning:**
      *   Ensure I address coherence, presuppositions, and underdetermination explicitly.
      *   Check constraints: No preamble, no restating question.

  10. **Final Polish:**
      *   *Sentence 1:* The success condition reveals that General Average is grounded fundamentally in benefit-based restitution rather than compensatory justice for sacrifice or an unconditional community of fate.
      *   *Body:* Because liability vanishes when the ship sinks despite the reality of the sacrifice, the obligation cannot stem from the act of giving up property itself, nor from a mutual insurance pact that pays out upon loss. Instead, the duty to contribute arises solely from the receipt of a benefit—the preservation of property that would otherwise have been lost—making the doctrine coherent as a mechanism of unjust enrichment where the "common adventure" functions as a joint fund that must survive to bear claims. This grounding strictly presupposes a causal link between the sacrifice and the preservation of the residual value, without which no enrichment occurs, while the pro rata calculation of contributions merely fits comfortably as a pragmatic method for quantifying that benefit rather than being philosophically necessary. The practice remains philosophically underdetermined regarding its normative source, because contractarianism (rational ex-ante agreement), utilitarianism (maximizing total saved value), and restitutionary justice (preventing unjust enrichment) all equally license the success condition, differing only in their explanation of why the benefit triggers the duty rather than whether it should.

  11. **Review against constraints:**
      *   Lead with bottom line? Yes.
      *   Reasoning follows? Yes.
      *   No preamble? Yes.
      *   No restating question? Yes.

  12. **Final Check:** Does it address "which elements are strictly presupposed and which merely fit comfortably"? Yes (causal link vs pro rata). Does it address "where the practice is philosophically underdetermined"? Yes (contract vs utilitarian vs restitution). Does it address coherence? Yes.

      *Self-Correction on "Community of Fate":* I should be careful not to dismiss community entirely, but the prompt asks what the *success condition* reveals. It reveals the community is conditional on survival. I will stick to the benefit/restitution angle as primary because that's what the success condition points to most sharply.

      *Refining the "Underdetermination" part:* Make sure to clarify that rival theories justify the *same rule* even if their foundations differ.

      *Final Polish of Sentence 1:* "The success condition reveals that the doctrine is grounded in benefit-based restitution rather than compensatory justice for sacrifice or an unconditional community of fate." -> Good.

      *Final Polish of Body:* Ensure flow.

