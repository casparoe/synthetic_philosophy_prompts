      *   **Topic:** Essay on the trend of treating germs, climate, and volcanoes as historical actors (non-human causes).
      *   **Core Concept:** "Causal Casting" (promoting a non-human cause from background condition to narrative character).
      *   **Distinction:** Causal Weight (how much a factor actually matters) vs. Narrative Casting (how a factor is portrayed in the story).
      *   **Tasks:** Describe implications for:
          *   (a) Environmental Determinism.
