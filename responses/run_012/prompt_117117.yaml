          *   (c) Non-human Agency.
      *   **Constraints:** No literature review, no citations. Focus on conceptual consequences. Explain what follows for historians *if the distinction holds* vs. *if it collapses*.
      *   **Tone:** Intellectual, clear, suitable for a general-interest magazine essay (sophisticated but accessible).

  2.  **Deconstruct the Core Concept ("Causal Casting"):**
      *   *Causal Weight:* Objective influence. Did the volcano cause the crop failure? Yes. Did the crop failure contribute to the revolution? Yes.
      *   *Narrative Casting:* Storytelling choice. Is the volcano a setting (background) or a villain/protagonist (character)?
      *   *The Tension:* High causal weight doesn't *necessitate* protagonist casting. A factor can be crucial but still function as a condition rather than an agent.

  3.  **Drafting Section (a): Environmental Determinism:**
      *   *Concept:* Determinism suggests environment *dictates* outcomes, removing human choice.
      *   *If Distinction Holds:* We can acknowledge high causal weight (climate matters) without falling into determinism (climate decides). We treat climate as a *constraint* or *stage*, not a *director*. It limits the menu, humans order the meal.
      *   *If Distinction Collapses:* If causal weight = narrative casting, then acknowledging climate's importance makes you a determinist. To avoid determinism, you must downplay climate's importance (scientifically inaccurate). Or, you accept determinism and erase human nuance.
      *   *Implication for Historians:* Holding the distinction allows for "possibilism" or "probabilism." Collapsing it forces a binary: either humans do everything or nature does everything.

  4.  **Drafting Section (b): Attribution of Responsibility:**
      *   *Concept:* Who gets the blame or credit?
      *   *If Distinction Holds:* We can explain *why* something happened (germs killed the army) without absolving humans of *responsibility* (generals ignored sanitation). The germ is a character in the tragedy, but the general is the tragic hero/villain.
      *   *If Distinction Collapses:* If the germ is a full "actor," it shares moral responsibility. This leads to absurdity (you can't put a virus on trial). Or, conversely, if nature is just a backdrop, humans are blamed for things beyond their control (blaming farmers for drought).
      *   *Implication for Historians:* Holding the distinction preserves moral clarity. Collapsing it muddies the waters of accountability.

  5.  **Drafting Section (c): Non-human Agency:**
      *   *Concept:* Do non-humans have intentionality/will?
      *   *If Distinction Holds:* "Agency" is a metaphor for impact, not ontology. We can say the volcano "acted" without implying it "chose." It's a narrative device, not a metaphysical claim.
      *   *If Distinction Collapses:* If high impact = agency, then everything with impact has agency. This dilutes "agency" to meaninglessness (the "flat ontology" problem). Or, we deny agency to non-humans so strictly we ignore their disruptive power.
      *   *Implication for Historians:* Holding the distinction allows for rich description without metaphysical confusion. Collapsing it leads to either animism (everything has will) or mechanistic reductionism (nothing matters but physics).

  6.  **Synthesizing the "What Follows for Historians" (The "So What?"):**
