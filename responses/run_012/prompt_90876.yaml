prompt: |-
  Next week's podcast guest argues that money-pump arguments tell us nothing about diachronic rationality. Her line: a pump only shows that an agent with cyclical or shifting preferences can be made to lose money, and the same trick works on anyone who discounts the future, revises her beliefs on new evidence, or actively wants her own tastes to change -- so the argument form overgeneralises. Her distinctive move is that pump-proofing is an engineering problem rather than a rational one: an agent who can bind herself, or who makes one up-front choice over the whole trade sequence, can't be pumped, so at most the pump shows you need a commitment device, not that you're incoherent.

  Draft eight to ten interview questions that dont let her just restate that. I want at least one each on (a) the gap between being exploitable and being irrational; (b) the resolute-choice reply -- why can't she just say the agent sticks to her plan?; (c) whether the pump needs a naive agent, and what happens when she sees the whole sequence coming; (d) whether her defence also rescues the diachronic Dutch book against conditionalisation, and if not, why not; and (e) what evidence would count against her. For the load-bearing questions, add the follow-up keyed to the answer she's most likely to give. No background questions, and don't ask her to define terms for the audience. Open with the one question you think she has the least good answer to, then the rest, no preamble.
