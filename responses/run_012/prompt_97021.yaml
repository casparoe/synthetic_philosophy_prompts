answer: |-
  **Exam Paper: Practical Rationality (Year 3 Optional)**
  **Time Allowed:** 45 Minutes
  **Word Limit:** None (but conciseness is rewarded)

  **Question 1**
  Buridan's Ass starves between two indistinguishable bales of hay. Consider two variants: (i) the bales are objectively identical in every respect; (ii) one bale is objectively larger, but the ass cannot know this and has no evidence for it. In both cases, the ass starves.

  Does this distinction show that the paradox turns on the symmetry of *reasons available to the agent* rather than the symmetry of the *world*? Discuss whether a second-order tie-breaking rule (analogous to a hospital trust using a lottery for equally urgent patients) allows for rational choice without a first-order preference, or whether this merely relabels the problem. Finally, assess whether the paradox presupposes determinism, and explain why appealing to a 'preference for life' or 'flipping a coin' fails to resolve the normative impasse.

  ***

  ### Model Answer

  The distinction between the two variants clarifies that Buridan's paradox is a problem of normative access, not metaphysical symmetry. In variant (i), the world and the reasons are symmetric. In variant (ii), the world is asymmetric, but the *reasons* remain symmetric from the agent's perspective. Since practical rationality governs action based on what the agent has reason to do, not on hidden facts, the normative situation is identical in both cases. If rationality requires a sufficient reason to choose A over B, the ass is paralysed in both scenarios. This demonstrates that the puzzle concerns the symmetry of *justificatory reasons* available to the agent, rather than the objective symmetry of the world. The ass starves not because the bales are identical, but because the *case* for them is identical.

  Regarding the hospital lottery, we must distinguish institutional procedure from individual rationality. A hospital trust adopts a policy: 'if urgency is equal, lottery.' This is a second-order rule. It is rational for the trust because the rule itself was chosen for good reasons (fairness, efficiency) *ex ante*. However, for the donkey in the moment, adopting a tie-breaking rule requires a reason to adopt *that specific rule*. If the ass is truly indifferent between Left and Right, it is equally indifferent between 'Pick Left' and 'Flip a Coin'. Without a prior reason to randomise, the second-order rule lacks a foundation. It risks merely relabelling the problem: saying 'I choose by rule' does not explain why *this* rule was activated rather than remaining inert. Unless we accept procedural rationality as sufficient to break deadlocks without substantive reasons, the lottery does not solve the paralysis; it simply pushes the need for a sufficient reason back one step.

  This leads to the question of determinism. The paradox arguably presupposes a deterministic framework regarding the will, specifically the Principle of Sufficient Reason (PSR): that every choice must be determined by a preponderance of reasons. If one holds a libertarian view of free will, where the agent possesses a 'power of contrary choice' independent of determining reasons, the paradox dissolves. The agent can choose A over B simply because they will it, even if reasons are balanced. Therefore, the starving ass is indeed a determinist's ass. A libertarian need not fear starvation; they can act without a tipping reason. The paradox only bites if one believes that reason must causally determine action.

  Finally, we must dismiss two common but inadequate solutions. First, 'the ass prefers not starving to starving.' This is a category error. The choice is not between Eating and Starving, but between Bale A and Bale B. Both bales satisfy the preference for life equally. Preferring life explains why the ass opens its mouth, but not why it turns its head Left rather than Right. The impasse is at the level of selection, not motivation.

  Second, 'it should just flip a coin.' As noted with the lottery, this assumes the agent can initiate a randomiser without a reason. To flip a coin is to perform an action. If reasons are perfectly balanced, there is no reason to initiate the coin flip rather than stand still. Randomisation is itself an action requiring justification. If the PSR holds, one needs a reason to randomise; if reasons are balanced, one has no reason to randomise. Thus, the coin flip presupposes the very freedom from deterministic reasons that the paradox challenges.

  In conclusion, the paradox reveals a tension between the requirement for sufficient reasons and the necessity of choice. It turns on accessible reasons, not worldly facts. Second-order rules fail without prior justification, and the puzzle only holds if we reject libertarian agency.

  ***

  ### Marking Scheme (Out of 20)

  **A Grade (17–20 marks)**
  *   **Variants:** Clearly distinguishes objective symmetry from symmetry of *accessible reasons*. Identifies that rationality tracks the agent's perspective, making variants (i) and (ii) normatively equivalent.
  *   **Lottery/Second-Order:** Critically engages with the hospital analogy. Notes that institutional rules have *ex ante* justification, whereas the donkey lacks a reason to adopt a tie-breaking rule *in media res*. Identifies the risk of "relabeling."
  *   **Determinism:** Explicitly links the paradox to the Principle of Sufficient Reason (PSR). Explains that libertarian free will dissolves the problem.
  *   **Cheap Moves:** Correctly refutes "preference for life" (wrong level of choice) and "coin flip" (requires reason to initiate randomisation).
  *   **Style:** Concise, precise British English, logical flow.

  **B Grade (14–16 marks)**
  *   **Variants:** Identifies the difference but may waver on whether hidden facts change the normative status.
  *   **Lottery:** Accepts the lottery analogy too readily without questioning the justification for the rule itself.
  *   **Determinism:** Mentions determinism but does not clearly link it to the PSR or libertarian agency.
  *   **Cheap Moves:** Refutes one move well, but the other weakly (e.g., accepts coin flip as a valid solution).
  *   **Style:** Clear but less rigorous argumentation.

  **C Grade (11–13 marks)**
  *   **Variants:** Treats the two variants as essentially the same without explaining *why* (reasons vs. world).
  *   **Lottery:** Describes the lottery example but fails to apply it critically to the donkey.
  *   **Determinism:** Vague reference to "fate" or "causation" without philosophical precision.
  *   **Cheap Moves:** Accepts one of the cheap moves as a valid solution.
  *   **Style:** Understandable but lacks philosophical depth.

  **D Grade (8–10 marks)**
  *   **Content:** Retells the story of the donkey. Fails to distinguish the variants.
  *   **Analysis:** Claims the lottery solves the problem completely. Ignores the determinism constraint.
  *   **Mistakes:** Argues that "preferring life" solves the choice between bales.
  *   **Style:** Disorganised or significantly over/under length.

  **Fail (0–7 marks)**
  *   Fundamental misunderstanding of practical rationality.
  *   Does not address the specific prompts (variants, lottery, determinism).
  *   Incoherent or irrelevant.

  **Specific Penalties:**
  *   **-3 marks:** For arguing that variant (ii) allows the donkey to choose rationally because one bale *is* bigger (ignores epistemic access).
  *   **-3 marks:** For accepting "flip a coin" as a sufficient solution without addressing the reason required to flip.
  *   **-2 marks:** For failing to mention the link between the paradox and determinism/PSR.
  *   **-2 marks:** For American spelling/grammar in a British context (e.g., "rationalization", "favor").
