      *   *Tension 1 (The Curse vs. Utility):* Dennett sees the narrative self as functional/evolutionary (earn its keep). Leonard's narrative is pathological. It traps him in a loop of vengeance. Is the theory wrong, or is Leonard just a broken case study?
