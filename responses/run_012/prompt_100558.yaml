      *   **Dennett's Center of Narrative Gravity:** The self isn't a homunculus or a specific brain spot. It's an abstraction, like a center of gravity in physics. It exists because the organism tells a story about itself to others and itself. It's a "fiction" but a useful/real one (real as a center of gravity). It doesn't require a *rememberer* of the story, just the *spinning* of the story.

  3.  **Brainstorming Connections & Tensions:**

