  2.  **Deconstruct the Logic:**
      *   *Soundness:* $\square P \to P$. (If I prove P, then P is true).
      *   *Consistency:* $\neg \square \bot$. (I cannot prove a contradiction).
      *   *Löb's Theorem:* If $\square P \to P$ is provable, then $P$ is provable. Specifically, if a system proves "If I prove Consistency, then Consistency", it proves Consistency. But by Gödel II, it can't prove Consistency (if consistent). Therefore, it can't prove "If I prove Consistency, then Consistency" for the specific case of Consistency.
      *   *The Trap:* To trust your proofs, you need to know they are sound. To know they are sound, you need to trust your proofs. A system cannot validate its own validity without begging the question or becoming inconsistent.
      *   *The Solution (implied):* You need a stronger system (meta-system) to prove the object system's consistency, leading to an infinite tower, or you just assume it (axiomatically), which makes the system stronger but unproven.

