          *   Requirement: They must rhyme with each other, scan well, be worth hearing 5 times, and capture the logical nuance (the circular dependency).
      *   **Content:** Needs to reflect the logical impossibility (proving soundness requires soundness, proving consistency leads to inconsistency if done within the system). The ending should feel uneasy, suggesting the axioms must be adopted, not derived.
