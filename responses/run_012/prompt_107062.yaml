      *   **Topic:** Rational self-trust of a reasoner (logical system), specifically touching on Gödel's incompleteness theorems, Löb's theorem, and the impossibility of a system proving its own soundness/consistency within itself.
      *   **Form:** Villanelle (19 lines, 5 tercets + 1 quatrain, 2 refrains, specific rhyme scheme ABA ABA ABA ABA ABA ABAA).
      *   **Refrains:** Two halves of the self-trust claim.
          *   Refrain 1 (A1): Roughly "whatever I have proved is so" (Soundness).
