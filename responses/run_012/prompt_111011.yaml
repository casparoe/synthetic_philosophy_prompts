answer: |-
  Here is your Q&A Prep Sheet, formatted for 4x6 index cards. I have sorted them by **damage potential** (threat to your thesis or reputation).

  ### CARD 1: GENERAL STRATEGY (Read this first)

  **THE ONE THING TO HOLD:**
  Aquinas is not giving a **rule** ("Never kill tyrants" or "Always kill tyrants"); he is describing a **virtue** (Prudence). The core is: *The Common Good is the metric, not the ruler's life.*

  **CONCEDE UP FRONT (Don't fight these):**
  1.  **To Father ___:** I am not claiming to summarize Aquinas's *entire* corpus. I am focusing on the *Summa* logic.
  2.  **To LD Debater:** You are right that this is hard to calculate. That is why Aquinas calls it "Prudence," not math. It's a judgment call, not a formula.
  3.  **To Debate Guys:** I am not giving a verdict on the American Revolution. I am analyzing a 13th-century framework.

  **THE "RIGHT" OBJECTION:**
  **The LD Debater.** He is right that the "comparative harm" test is unfalsifiable. **Do not deny this.** Admit it: *"That's exactly why Aquinas puts this under Prudence. If it were easy to measure, it would be science, not ethics."*

  ---

  ### CARD 2: FATHER ___ (Highest Intellectual Damage)
  **The Threat:** He knows the text better than you. He will bring up *Usurper vs. Legitimate King* or the *Sentences*.

  **His Question:** "Aquinas distinguishes between a usurper (no title) and a legitimate king who rules badly. Doesn't that change the permission? And aren't you ignoring his earlier view in the *Sentences*?"

  **Your Reply (1 Min):**
  "Father, you're right that the *Sentences* commentary is more permissive, and I'm bracketing that out to focus on the mature *Summa*. On the Usurper vs. King distinction: Aquinas does treat them differently, but my point is that even with a legitimate king, the *limit* on resistance is the same: the Common Good. Whether the tyrant is a usurper or a bad king, the test for removal isn't 'is he sinful?' it's 'will removing him wreck the community?' The status of the ruler matters, but the *consequence* matters more."

  **The Soft Spot:**
  If he presses on the *Sentences* specifically.
  **Pivot:** "I'm not equipped to trace the development of his thought across decades tonight, which is why I stuck to the *Summa* structure. I'd love to read your thesis on that development, though."

  ---

  ### CARD 3: CLASSMATE ___ (Highest Moral/Reputational Damage)
  **The Threat:** Making you sound like an apologist for dictators. "Wait it out" is what oppressors say.

  **Her Question:** "My family didn't 'wait it out.' People told us 'it could get worse' while people disappeared. Isn't this logic just telling victims to suffer so the powerful stay safe?"

  **Your Reply (1 Min):**
  "I hear you, and I'm not saying victims should just suffer. Aquinas isn't arguing for passive obedience. He's arguing against *reckless* resistance that gets more people killed. When you say 'it could get worse,' that's often a stalling tactic. But Aquinas is asking: 'If we revolt, do we actually win freedom, or do we just get a warlord?' He's not protecting the tyrant; he's protecting the *neighbor* from the chaos of a failed revolt. The goal is liberation, but it has to be *effective* liberation."

  **The Soft Spot:**
  If she asks: "Who decides if it's effective? The people suffering?"
  **Pivot:** "That is the hardest question. Aquinas says 'public authority,' but when the public authority *is* the tyrant, he admits there's no easy human remedy. He actually says in that case, one must pray to God. It's an admission of human limits, not a command to suffer."

  ---

  ### CARD 4: MS. ___ (The Ideological Undercut)
  **The Threat:** Claiming "Common Good" is just a mask for Church/Elite power.

  **Her Question:** "Who actually decides what the 'Common Good' is? Historically, wasn't that just whatever the Church or the Nobles wanted it to be?"

  **Your Reply (1 Min):**
  "Historically, yes, it was often abused by the powerful. I'm not defending the history of medieval politics. I'm defending the *logic* of the argument. Aquinas defines the Common Good as the conditions for people to live virtuously together. If a ruler destroys that, he defeats his own purpose. The risk of abuse is real, but the standard itself—'does this help the community flourish?'—is the only check on power he allows. It's not perfect, but it's better than 'might makes right.'"

  **The Soft Spot:**
  If she pushes: "So it's a check that never worked?"
  **Pivot:** "It worked to limit *theory*, even if practice failed. It stopped people from saying 'obey no matter what.' It introduced a condition."

  ---

  ### CARD 5: LD DEBATER (The Methodological Attack)
  **The Threat:** Calling your thesis "Utilitarianism in a costume."

  **His Question:** "This 'comparative harm' test is just Act Utilitarianism. You're saying 'kill if the math works.' But Aquinas gives no way to do the math. So the test is unfalsifiable."

  **Your Reply (1 Min):**
  "I'll concede the structure looks utilitarian, but the *end* is different. Utilitarianism maximizes happiness; Aquinas maximizes *virtue and order*. And you're right about the math—it is unfalsifiable. That's my point. It's not a calculation; it's a judgment call. That's why he puts it under Prudence. If you could calculate it perfectly, you wouldn't need virtue. The 'unfalsifiability' is a feature, not a bug—it forces you to be careful."

  **The Soft Spot:**
  If he says: "Then it's subjective."
  **Pivot:** "It's inter-subjective. It relies on the judgment of the community leaders, not one guy's whim. But yes, it's not a scientific formula."

  ---

  ### CARD 6: DEBATE GUYS (The Over-Enthusiasts)
  **The Threat:** Trying to make you say "Yes, Revolution is always good."

  **Their Question:** "So if the harm is bad enough, you can overthrow? Does that mean the American Revolution was justified? Can we overthrow anyone who raises taxes?"

  **Your Reply (1 Min):**
  "Whoa, slow down. Aquinas sets a really high bar. It's not 'am I annoyed?' it's 'is the community being destroyed?' I'm not here to judge 1776. I'm saying Aquinas doesn't give a green light for any grievance. He says most revolts end up making things worse. So, no, taxes aren't tyranny. But yes, if a ruler is destroying the very possibility of society, resistance is not 'sedition.' It's a last resort, not a first option."

  **The Soft Spot:**
  If they ask: "Where is the line?"
  **Pivot:** "That's the Prudence question again. There is no line in the sand. That's why it's dangerous."

  ---

  ### CARD 7: THE QUESTION I HOPE NOBODY ASKS

  **The Question:** "If the people can't judge the tyrant, and the tyrant won't judge himself, and God is the only remedy... isn't Aquinas just admitting political philosophy fails here?"

  **Why it hurts:** It exposes that Aquinas has no *institutional* solution for tyranny, only a moral one.

  **The "Safe" Answer:**
  "In a way, yes. He's admitting that without a higher earthly authority, there is no legal remedy for the highest authority. He's describing a tragedy of politics, not solving it. That's why he emphasizes preventing tyranny (choosing a good king) over curing it."

  **Backup Plan:** If they press this, smile and say: "That might be a topic for next semester's Ethics Night. I think I've used up my 15 minutes of wisdom for the year."
