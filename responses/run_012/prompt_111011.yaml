      *   *Father ___:* He'll ask about Usurper vs. Legitimate King. *Response:* Acknowledge the distinction. Aquinas treats them differently. My point is about the *consequence* calculation in both, but especially the legitimate one. *Concession:* I am focusing on *Summa* II-II Q42, not the whole corpus. *Soft spot:* If he presses on the *Sentences* vs. *Summa* development. *Advice:* Don't fight the text development, admit complexity.
