prompt: |-
  ok so i need help prepping for something and i think you're the kind of thing that's good at this. im a senior and next thursday im presenting at our school's philosophy club ethics night (like 15 min talk, then questions, parents come, its a whole production). my topic is Aquinas on tyrannicide and i have defintely bitten off more than i can chew.

  my thesis, roughly: everybody reads Aquinas as either "yes you can assassinate tyrants" or "no you cant, obey the king." i think both readings miss what hes doing. in the Summa, when he asks about sedition, he says theres no sedition in disturbing a tyrannical government — but then he immediately adds, unless the disturbance does more harm to the people than the tyrant was already doing. so whatever permission is there collapses into a comparison: does getting rid of him actually make the common good better or worse. and then in On Kingship hes way more cautious — he basically says if you cant get rid of the tyrant without risking something worse, you should put up with him, and he points out that the people who overthrow a tyrant often just end up with a new one, sometimes the guy who led the revolt. so the prudence kind of eats the principle. what you end up with isnt a permission to kill tyrants, its a really demanding test, and i want to argue its more radical than conservatives think (it does NOT say just obey, and it makes the ruler's end goal, not his personal virtue, the thing that matters) and more conservative than revolutionaries think (it is absolutely not a green light).

  also honestly im confused about the early text. i think in his commentary on the Sentences hes way more ok with it — theres something in there about a guy who frees his country by killing a tyrant being praised — but i might be misreading it, and i should NOT quote it from memory, please dont quote Aquinas at me either, i cant check it and i dont want to say something in front of father ___ that turns out to be made up. i might just say the texts pull in different directions and move on.

  whos in the room:

  - our chaplain, father ___, who did his theology degree on Aquinas and genuinely loves him. hes not hostile to me, hes hostile to bad readings of Aquinas. hell come at me with prudence and charity and the whole architecture of the virtues, and hell say im treating one article of the Summa like a proof text. hell also probably bring up the difference between a usurper and a legit king who just rules badly, which i know is a thing but i dont really know what to do with it.
  - my AP euro teacher, ms ___, who is not religious and pretty much thinks medieval political theology is the church justifying whatever keeps the church safe. shell ask who gets to decide what the common good is, and whether the common good is just a nice word for whatever the powerful want.
  - two guys from debate club who read like three libertarian things and now think every tax is tyranny. they will hear "you can resist a tyrant" and immediately want me to say the american revolution was justified and that the people can overthrow anyone anytime. i need to disappoint them without being a jerk.
  - one classmate, ___, whose family left a dictatorship when she was little. she doesnt talk about it much but shes said before that "just wait, it could be worse" is what the regime's supporters always said. i think shes going to be the hardest one and i really dont want to say something dumb to her.
  - the kid who does LD debate and is a rule utilitarian. hell say my whole comparative-harm thing is just act utilitarianism wearing a costume, and that Aquinas gives you no way to actually estimate the harms, so the test is unfalsifiable.

  can you make me a Q&A prep sheet? i want the objections in the order theyll actually come from THIS room, phrased the way that person would phrase it (so father ___ sounds like father ___, the debate guys sound like debate guys), sorted by how much damage they do to me, not just by order. for each one give me a reply i can actually say out loud in about a minute, and then tell me where the reply is soft — like where if they push once more i dont have anything. also tell me what i should just concede up front because its true and fighting it makes me look worse, and the one thing i should hold no matter what. and at the end, the question im hoping nobody asks. oh and also: which objection is just right and i should admit it? because i have a feeling one of them is. put it in a form i can put on index cards, i have like a 4x6 stack and a sharpie.
