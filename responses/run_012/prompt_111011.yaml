      *   *Debate Guys:* "American Revolution?" *Response:* Aquinas doesn't give a blanket right. It's case-by-case. I'm not judging 1776, I'm judging the *criteria*. *Soft spot:* If they push "So you're saying we shouldn't have revolted?" *Deflection:* I'm analyzing a 13th-century text, not writing a verdict on Washington.

