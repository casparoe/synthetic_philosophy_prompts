      Claire: "The only just solution is to defund the Catholic gym."
      David: "That punishes the Catholics for the council's mistake."
      Claire: "It restores the boundary."
      David: "Boundaries look like walls to those outside."
      ...move to the neutrality argument...
      Claire: "Secular space is the only neutral space."
      David: "Is it? Or is it a Protestant/Catholic norm dressed up as nothing?"
      ...move to the individual vs group argument...
      David: "We need to support communities."
      Claire: "Communities crush individuals."
      ...ending...

      *Review against constraints:*
      - No headscarf ban? Check.
      - Both smart/fair? Check.
