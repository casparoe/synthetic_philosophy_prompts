          *   American side needs to address: Protecting group leaders more than individual members.
      *   **Constraints:**
          *   No strawmen (both smart, fair).
          *   No headscarf ban (cliché).
          *   No winner/agreement at the end (open ending, sharper question).
          *   Format: Continuous prose with dialogue, no headings, no bullet points, no bold, no tables.
          *   Length: Around 900 words.

  2.  **Character Conception:**
