prompt: |-
  A seminar handout I was given summarizes W. E. B. Du Bois's views on art and propaganda roughly as follows. Du Bois argued that art is always propaganda, so the only question for a Black artist is which side to serve. Because he thought beauty is a bourgeois distraction, he told Black writers and painters to abandon aesthetic experimentation and produce direct political messages that would shame white America and uplift the race. He thus rejected the Harlem Renaissance's slogan of art for art's sake as a form of cowardice, and he held that a work's formal qualities matter only insofar as they make the political message more effective. In the end, he treated the artist as a soldier whose medium is merely a weapon. I suspect this is partly unfair, but I don't know enough about Du Bois to say where. Please audit the summary for accuracy. Separate what a careful reader of Du Bois would accept, what is a simplification, what is a misrepresentation, what Du Bois would object to, and which conclusions drawn in the summary survive correction. Respond with exactly five numbered items, each a sentence or two, with no introduction or conclusion.
