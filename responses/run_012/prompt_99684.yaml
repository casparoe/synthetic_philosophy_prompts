prompt: |-
  I'm a poli-sci grad student and my supervisor has volunteered me to run a two-hour session on "what counts as corruption" for a group of incoming foreign-service officers — they're sharp but have no background in anthropology or political theory, and they walk in mostly assuming corruption just is bribery and that it's obviously bad. I don't want you to explain corruption to me; I want a plan for explaining it, because the two times I've tried this the relativism discussion blew up in my face and I loose the room every time. So: what has to come first, and why does the order matter? My own instinct is that before anything else you have to prise "is this corrupt?" apart from "is this wrong?", and then prise the descriptive question apart from the normative one — but tell me if something else has to come before even that, and what breaks if I get the order wrong. Then the carrying example. I was going to build the whole session on one case, and I keep oscillating between a customs officer who's handed money to move a shipment along and a family that gives a substantial gift to a registrar who's about to certify their papers. Which of those actually carries the concept, and what does the right example have to have and lack? The point I'm after is that gift and bribe aren't the same kind of thing differing only in amount — that a gift constitutes a relationship while a bribe closes a transaction — and I need the example to make that land as a claim about social forms rather than as me being soft on "other cultures."

  The misconceptions I expect, roughly in the order they'll surface: that corruption just is money changing hands; that gift and bribe differ by size; that this is a developing-country problem; that cultural relativism settles whether it's wrong; and that anti-corruption norms are themselves culturally neutral. Where in the sequence do I diffuse each, and what's the one question I can put to the room at the end that tells me they've actually got the distinction rather than just learned to be tactful about it? I also want to know what to openly refuse to get into — I'm tempted to rule out the "so is Western anti-corruption discourse itself a form of corruption?" spiral, but I'm not sure that's principled or just cowardice, and I'd rather say out loud that I'm skipping something than have it derail me.

  Please write it as continuous prose, no headings, no bullet points, no bold — I'll be reading it on the train and I want it to sound like a person talking.
