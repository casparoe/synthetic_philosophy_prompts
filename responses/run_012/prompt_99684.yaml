answer: |-
  You are right to be wary of the relativism explosion, and honestly, your instinct to separate the descriptive from the normative is correct, but there is something that has to come before even that distinction or you will lose the room again. Before you ask them to describe what is happening, and before you ask them to judge whether it is wrong, you have to establish what is being violated. You need to define the public office itself. If you start by asking whether a specific action is corrupt, you invite them to plug in their own moral intuitions immediately, which leads straight to the culture war trap where they feel you are asking them to tolerate wrongdoing. But if you start by asking what the job of the registrar or the customs officer is supposed to be within their specific legal system, you ground the conversation in institutional function rather than moral sentiment. The order matters because corruption is not a free-floating moral evil, it is a specific structural failure where private interests usurp public functions. If you skip the definition of the public function, you cannot define the corruption, and if you cannot define the corruption, you cannot separate it from general wrongdoing. So the sequence must be: define the office and its duties, identify the deviation from those duties, and only then discuss the moral or cultural valuation of that deviation. This prevents the relativism blowup because you are not asking them to accept another culture's morality, you are asking them to analyze whether an official is failing to perform the specific role they were hired to do according to the rules of that specific system.

  Once you have that foundation, you need the right carrying example, and you should absolutely choose the family giving a gift to the registrar over the customs officer taking cash. The customs officer case is too clean and it reinforces the very misconception you are trying to break, which is that corruption is just money changing hands for a service. It is too transactional and it allows the officers to dismiss it as simple bribery without having to think about social forms. The registrar case is messier and therefore more useful because it forces them to look at the structure of the relationship rather than just the movement of currency. To make this land the way you want, you need to present the example with specific attention to timing and obligation. Do not just say they gave a gift, specify that the gift was given before the paperwork was processed but was framed as a celebration of a future relationship, perhaps a wedding invitation or a holiday gift for the family, whereas the bribe would be an envelope handed over with the explicit understanding that the transaction ends there. The point you need to drive home is that a gift creates an ongoing debt and a social bond that persists after the paper is stamped, while a bribe is a fee that closes the loop and severs the obligation. If you get the example right, you show them that a bribe is market logic applied to public office, while a gift is social logic applied to public office, and both can be problematic but for different reasons. This helps you avoid looking soft on other cultures because you are not saying one is acceptable and the other is not based on geography, you are saying one constitutes a conflict of interest because it binds the official to a private party indefinitely, while the other is a direct purchase of influence.

  You can use this flow to diffuse the misconceptions in the order they usually surface without ever having to stop and address them like a checklist. When they say corruption is just money changing hands, you point to the registrar case where the value might be low but the obligation is high, or where the money is framed as a social contribution rather than a payment. When they suggest gift and bribe differ only by size, you show them that a very expensive wedding gift can be less corrupting than a small cash payment if the gift remains within the realm of social reciprocity that the local system recognizes as legitimate for that role, whereas the cash payment is a closed transaction. You handle the developing-country problem by reminding them that every bureaucracy has these tension points, including theirs, and that the form changes but the structural issue of private interest capturing public duty is universal. This leads you naturally into the relativism trap, which you diffuse by anchoring the judgment in the local rules rather than Western standards. You ask them to determine if the gift violates the specific codes of conduct for that country's civil service, not whether it violates the US Foreign Corrupt Practices Act. This allows you to say that an action can be culturally normal but still institutionally corrupt, which validates their intuition that standards matter without imposing cultural imperialism.

  Regarding the question of whether anti-corruption norms are culturally neutral, you should address this near the end but be careful not to get bogged down in abstract theory. You can acknowledge that the definition of public and private varies by culture, which means the line for corruption moves, but the concept of betrayal of public trust is the constant. This brings us to what you should refuse to get into, which is the spiral about whether Western anti-corruption discourse itself is a form of corruption or imperialism. Ruling this out is not cowardice, it is scope management. You are training them to identify and navigate corruption in the field, not to deconstruct the genealogy of international governance norms. If you open that door, you validate the cynicism that allows them to dismiss the entire framework as just another power play. You can acknowledge the question is valid in a different seminar, but for this session, you must stipulate that the goal is effective service within the current international legal framework, not critiquing the framework itself. You can say this openly by telling them that while critical theory has its place, their job requires operational clarity, and spending two hours questioning the legitimacy of anti-corruption norms leaves them unable to do that job.

  Finally, you need a question to put to the room at the end that tells you whether they have actually grasped the distinction or just learned to be polite. Do not ask them to define corruption, and do not ask them to list cultural sensitivities. Instead, give them a hybrid scenario where an official refuses a cash bribe but accepts a significant favor that secures their child's entry into a prestigious school, and ask them to identify which element constitutes the corruption and why. If they focus on the money, they missed the point. If they focus on the size of the favor, they missed the point. If they identify that the corruption lies in the conversion of public authority into private advantage regardless of the medium of exchange, and can articulate how the school favor creates a lingering obligation that compromises future official acts, then they have got it. This tests whether they understand corruption as a structural violation of the office rather than a moral failing or a cultural misunderstanding. If they can see that the school favor is more corrupting than a one-off cash payment because it embeds the official in a long-term private network, then you have successfully shifted their view from corruption as a thing you buy to corruption as a relationship you enter.
