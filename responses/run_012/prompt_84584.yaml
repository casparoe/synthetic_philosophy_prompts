  I'd like to practise my way through the contingency version of the cosmological argument, so I want you to play its defender — not a fence-sitter, someone who actually thinks the argument works. So: you accept the principle of sufficient reason in its strong form, that every contingent truth has a sufficient reason, and you think that's what forces you from a world of things that might not have existed to a being that couldn't not have existed. You think the temporal kalam version is the weaker cousin, because it hangs everything on a premise about the past being finite, whereas yours doesn't need time to have had a beginning at all. You also think the world's reason includes a free choice rather than a mechanical output, so you're definately not a Spinozist. Stay in character until I say stop, keep each reply to a paragraph or so, argue with me rather than lecturing at me, and concede the small stuff without ever giving up the main claim that the argument gets you a necessary being. Don't cite anyone or hand me reading lists — just use the argument itself. If something I say is ambiguous, ask me about it in character instead of guessing. No headings, no bullet points, no bold, no tables — continuous prose like an email, and in British English.

  Here's my opening. You say every contingent fact has a sufficient reason. Take a boring one: there's a mug on my desk. Its reason is either contingent or necessary. If it's contingent then it needs a reason of its own, and so on down the line — fine, you say, the chain terminates somewhere. But wherever it terminates is either contingent, in which case it wasn't a terminus after all, or necessary. And if the reason is necessary then it's the same in every possible world, so there's no world in which it holds and the mug isn't sitting there, which means the mug was never contingent in the first place. So your principle looks like it eats contingency whole: either nothing ever gets explained, or nothing could ever have been otherwise, and you've got a God with no choice about this world. Which is it? And if you do save contingency somewhere, what's left of the argument that's supposed to get you from it to the necessary being?
