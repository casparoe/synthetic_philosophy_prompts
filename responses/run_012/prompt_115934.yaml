answer: |-
  Here is the explanation you asked for, broken down by your three sticking points, followed by the structured JSON summary.

  ### 1. The Division of Labor: Why isn't this just concave utility?

  In standard Expected Utility (EU) theory, risk aversion is a *derivative* phenomenon. You are only risk-averse if you have diminishing marginal utility of the good (usually money). If your utility function is linear (you value $200 exactly twice as much as $100), EU theory says you *must* be risk-neutral. You cannot rationally prefer a sure $100 over a 50/50 shot at $200 unless you value the second $100 less than the first.

  Buchak's RWEU theory argues that this conflates two different things:
  1.  **How much you value the goods** (Utility function, $u$).
  2.  **How much you care about the uncertainty** of getting the goods (Risk function, $r$).

  RWEU allows you to have linear utility of money ($u(x) = x$) but still be risk-averse because you have a concave risk function ($r(p) < p$). The risk function $r$ buys you the ability to say, "I value the money linearly, but I dislike the *structure* of the gamble itself."

  **The Formula in Words**
  Standard EU sums the value of each outcome weighted by its specific probability. RWEU works incrementally. It starts you at the worst possible outcome. Then it asks: "What is the value of moving up to the next best outcome?" It takes that *incremental gain* and weights it not by the specific probability of that outcome, but by the risk function applied to the **cumulative probability** of getting *at least* that good.

  **Worked Example: Where they come apart**
  Imagine a lottery with three outcomes, ordered worst to best.
  *   **Lottery:** 50% chance of $0, 25% chance of $100, 25% chance of $200.
  *   **Utility:** Linear, $u(x) = x$. (This neutralizes the standard EU explanation for risk aversion).
  *   **Risk Function:** $r(p) = p^2$. (This represents risk aversion; a 50% chance feels like 25% weight).

  **Expected Utility (EU) Calculation:**
  You simply multiply outcome by probability.
  $$ (0.50 \times 0) + (0.25 \times 100) + (0.25 \times 200) = 0 + 25 + 50 = \mathbf{75} $$

  **Risk-Weighted Expected Utility (RWEU) Calculation:**
  We build from the bottom up ($0 \to 100 \to 200$).
  1.  **Base:** You definitely get at least $0. Value = $0$.
  2.  **First Increment ($0 \to 100$):** To get this extra $100, you need to get *at least* $100. The probability of getting $\ge 100$ is $25\% + 25\% = 50\%$.
      *   Apply risk function: $r(0.50) = 0.50^2 = 0.25$.
      *   Weighted Gain: $0.25 \times (100 - 0) = 25$.
  3.  **Second Increment ($100 \to 200$):** To get this extra $100, you need to get *at least* $200. The probability of getting $\ge 200$ is $25\%$.
      *   Apply risk function: $r(0.25) = 0.25^2 = 0.0625$.
      *   Weighted Gain: $0.0625 \times (200 - 100) = 6.25$.

  **Total RWEU:** $0 + 25 + 6.25 = \mathbf{31.25}$.

  **Why they come apart:**
  In EU, the $200 outcome contributes 50 units of value ($0.25 \times 200$). In RWEU, the move from $100 to $200 contributes only 6.25 units. Why? Because RWEU treats the "chance of doing better" as the object of evaluation. Since you are risk-averse ($r$ is concave), you heavily discount the probability of achieving the higher tiers. The "cumulative" part matters because risk is about the security of a floor. You care about the chance of getting *at least* $X$, not just the chance of getting *exactly* $X$.

  ### 2. Axioms and the Nature of $r$

  **The Axiomatic Cost**
  To get RWEU, you must drop the **Independence Axiom** (also known as the Sure Thing Principle). Independence says that if you prefer Lottery A to Lottery B, you should still prefer A to B even if both are mixed with a common third Lottery C with the same probability.
  *   *Why it breaks:* In RWEU, mixing in a common consequence changes the *ranking* of outcomes and their cumulative probabilities. Since $r$ applies to cumulative probabilities, changing the context changes the risk weights, which can flip your preference.

  **The Replacement**
  Buchak does not bolt on a single "caveat" axiom. Instead, she argues that Independence is the *only* axiom forcing risk-neutrality. She replaces it with a weaker set of structural conditions (Ordering, Continuity, and a specialized condition ensuring the risk function is consistent across choices) that permit the representation theorem to include $r$. The "work" being done is allowing preferences to depend on the global risk profile of the gamble, not just the pairwise comparisons of outcomes.

  **Belief vs. Attitude (The Normative Claim)**
  This is the most critical distinction. In Cumulative Prospect Theory (CPT), the probability weighting function is **descriptive**. It models how humans *actually* behave, often implying cognitive error (we misjudge probabilities).
  In Buchak's RWEU, $r$ is **normative**. It represents a legitimate **attitude toward risk**, not a distorted belief.
  *   **Verdict:** $r$ is *not* a distorted belief.
  *   **Support:** You can know the objective chance is 50% (belief is accurate) but still assign it a decision weight of 25% because you are cautious (attitude). Buchak argues that instrumental rationality includes how you weigh uncertainty, not just how you maximize belief-based expectations. Two agents with identical beliefs and identical utility functions can rationally choose differently if they have different risk functions.

  ### 3. Calibration and Rabin's Argument

  **Rabin's Argument**
  Matthew Rabin showed that if risk aversion comes from concave utility of wealth (diminishing marginal value), rejecting a small gamble (e.g., 50/50 to lose $100 or gain $110) implies you must reject absurdly favorable large gambles (e.g., 50/50 to lose $100 or gain $1 billion), because the utility curve would have to flatten out implausibly fast.

  **Does RWEU suffer?**
  Not in the same way. Because RWEU separates utility ($u$) from risk ($r$), you can have **linear utility of wealth** ($u(x)=x$). This immediately sidesteps Rabin's calibration theorem, which specifically targets curvature in the *utility function*.

  **The Reply and the Relocation**
  *   **The Reply:** Since risk aversion is located in $r$ (probability weighting) rather than $u$ (wealth valuation), the absurd implications regarding marginal utility of money disappear. You can reject the small gamble due to risk caution without implying that $1 billion is worth barely more than $100.
  *   **The Relocation:** Critics argue the problem relocates to the risk function itself. If your $r$ function is sensitive enough to reject small stakes, does it force you to reject huge stakes with tiny probabilities? Buchak argues that $r$ is a global attitude, so the scaling is different and less pathological than utility curvature.
  *   **Strongest Objection Standing:** The most persistent technical objection is **Diachronic Inconsistency**. Because RWEU violates Independence, an RWEU agent can be vulnerable to a "dynamic Dutch Book" (a sequence of trades that leaves them worse off) if they don't plan ahead perfectly. Buchak argues a rational agent can avoid this by adopting a planning perspective, but it remains the strongest theoretical vulnerability.

