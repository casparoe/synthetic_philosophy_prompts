answer: |-
  Your friend has run together several distinct philosophical claims under the umbrella term "convention." This is a common move in casual debate because it allows a speaker to borrow the plausibility of a trivial claim (words aren't natural kinds) to support a radical one (meaning is purely a matter of power). To untangle this, we need to separate the metaphysical status of language from the sociological mechanism of its maintenance.

  Here is a menu of five candidate readings of your friend's premise that "language is just a convention."

  ### 1. The Metaphysical Negation Reading
  *   **Precise Thesis:** To say language is conventional is merely to say it is not natural. There is no intrinsic, physical link between a sound (like "dog") and the object it signifies. The link is contingent; it could have been otherwise.
  *   **Vivid Example:** The word "water" refers to H₂O not because of the chemical structure of the sound waves, but because English speakers happen to use it that way. In French, the same substance is "eau."
  *   **Verdict:** **Platitude.** This is the baseline definition of linguistic arbitrariness found in introductory linguistics. It is uncontroversial that words are not naturally magnetized to their referents.
  *   **Licenses Friend's Moves?** **No.**
      *   *On Wrongness:* This does not prove that usage dictates meaning. Even if the link is arbitrary, once established, it creates facts. If I arbitrarily decide to call a cat a "dog," I am still mistaken about the current convention, even if the convention itself is arbitrary in origin.
      *   *On Fiat:* This does not prove we can change meaning by decision. That a bridge was built by humans (not nature) doesn't mean we can walk through it by deciding to ignore gravity.
  *   **Distinctions Addressed:** This uses 'arbitrary' in the sense of **non-natural**. It does not imply 'arbitrary' means **revisable at will**. It treats convention as a historical fact about origins, not a current mechanism of control.

  ### 2. The Descriptive Regularity Reading
  *   **Precise Thesis:** A convention is nothing more than a statistical regularity in behavior. The meaning of a word is simply the aggregate of how speakers actually use it in practice. If 51% of people use "literally" to mean "figuratively," then that is what it means.
  *   **Vivid Example:** If everyone starts stopping at a red light and going at green, the meaning of the signal has flipped, regardless of what the traffic manual says.
  *   **Verdict:** **Substantive but Vulnerable.** This is a descriptivist stance. It is defensible in sociology but problematic for logic. It ignores the normative force of language (the fact that we can *misuse* words, not just use them rarely).
  *   **Licenses Friend's Moves?** **Partially.**
      *   *On Wrongness:* It supports the claim that you can't be wrong if you are in the majority. However, it fails to account for the individual speaker who is *trying* to speak English but failing. It reduces meaning to a headcount.
      *   *On Fiat:* It makes fiat very difficult. You cannot change a statistical aggregate by decision; you can only change it by changing everyone's behavior, which is not a matter of fiat but of causal influence.
  *   **Distinctions Addressed:** This relies on **convergent behavior** alone. It ignores **mutual expectation**. It treats convention as merely statistical, not knowledge-based.

  ### 3. The Lewisian Coordination Equilibrium Reading
  *   **Precise Thesis:** A convention is a regularity in behavior sustained by a system of mutual expectations and common knowledge, solving a coordination problem. I use word W to mean M because I expect you to understand M when I use W, and you do so because you expect me to expect it. There must be a live alternative (we could have coordinated on a different word).
  *   **Vivid Example:** Driving on the right side of the road. I do it because I expect you to do it. If I suddenly decide to drive on the left "by fiat," I crash, not because I broke a law, but because I failed to coordinate with your expectations.
  *   **Verdict:** **Substantive and Defensible.** This is the standard game-theoretic account. It explains why conventions are stable without needing a central authority.
  *   **Licenses Friend's Moves?** **No.**
      *   *On Wrongness:* It allows for error. If I use a word in a way that violates the mutual expectations required for coordination, I have failed to communicate. I am "mistaken" relative to the equilibrium.
      *   *On Fiat:* It explicitly **undercuts** the fiat claim. Conventions are sticky. Because they rely on *nested expectations* (I know that you know that I know...), a simple decision to change is insufficient. Everyone has to know that everyone else has decided to change, which is pragmatically nearly impossible for a whole language.
  *   **Distinctions Addressed:** This distinguishes **convergent behavior** from **mutual expectation**. It requires **common knowledge**, not just statistics. It denies **private convention** (you cannot coordinate with yourself).

  ### 4. The Normative Constraint Reading
  *   **Precise Thesis:** Conventions are constitutive rules of a social practice, backed by sanctions (social or practical). To speak a language is to submit to a norm. Meaning is not just what people *do*, but what they *ought* to do to count as speaking that language.
  *   **Vivid Example:** Chess. You cannot decide by fiat that your bishop moves like a knight. If you do, you are not playing chess badly; you are not playing chess. The dictionary is like the rulebook; it describes the constraints that make the practice possible.
  *   **Verdict:** **Substantive.** This aligns with Wittgensteinian rule-following and Searle's institutional facts. It treats language as a normative institution.
  *   **Licenses Friend's Moves?** **No.**
      *   *On Wrongness:* It directly contradicts the friend. On this view, you *can* be mistaken. If you violate the norm, you fail to participate in the practice.
      *   *On Fiat:* It rejects fiat. You cannot change the rules of chess by deciding to; you need a new institution. Similarly, you cannot change language by decision without creating a new dialect or code.
  *   **Distinctions Addressed:** This uses 'convention' to mean a **socially enforced norm**. It highlights that meaning is not just coordination but **constitutive** of the activity.

  ### 5. The Political Construct Reading
  *   **Precise Thesis:** Conventions are crystallized power dynamics. What counts as "correct" usage is determined by dominant social groups who enforce their preferences as standards. Disputes about meaning are disguised struggles for status and authority.
  *   **Vivid Example:** Defining "marriage" or "gender." The struggle over these definitions isn't about coordination; it's about which group has the power to institutionalize their worldview.
  *   **Verdict:** **Controversial/Critical.** This is a sociological or critical theory claim. It is plausible for politically charged terms but less so for functional vocabulary (e.g., "wrench" or " Tuesday").
  *   **Licenses Friend's Moves?** **Yes, but with caveats.**
      *   *On Wrongness:* It supports the claim that "wrongness" is just exclusion by power.
      *   *On Fiat:* It suggests change is possible through power shifts, not rational agreement. However, it admits that *you* (the individual) cannot change it by fiat; only a coalition with sufficient power can.
  *   **Distinctions Addressed:** This addresses the **power** element your friend introduced. It treats 'arbitrary' as **unjustified** (serving interests rather than truth).

  ***

  ### The Evolutionary and Game-Theoretic Critique of Fiat

  Your friend's claim that we can change language by "collective fiat" like changing the side of the road relies on a misunderstanding of how conventions emerge and persist. The evolutionary and game-theoretic picture actually works against him here.

  In game theory, a convention is a Nash Equilibrium: no individual has an incentive to deviate unilaterally. This explains why conventions are stable. However, evolutionary game theory adds the dimension of time and path dependence. Conventions are not chosen; they **drift** into existence through repeated interaction. Once a population settles on an equilibrium (e.g., "green means go"), the cost of switching becomes prohibitively high, even if the alternative ("green means stop") was originally just as good.

  This bears on your friend's "fiat" claim in two ways:

  1.  **Arbitrariness does not imply Revisability:** A convention is 'arbitrary' in the sense that *ex ante* (before the fact), another solution was possible. But *ex post* (after the fact), the current solution is locked in by the network of expectations. The side of the road is arbitrary, but you cannot change it by decision on a Tuesday; it requires a massive, synchronized coordination event (like Samoa switching from right to left driving in 2009), which is rare, expensive, and dangerous. Language is vastly more complex than driving; a "collective fiat" to change meaning is functionally impossible because there is no mechanism to synchronize the common knowledge required.
  2.  **The Coordination Trap:** Your friend argues that because there is no pre-existing fact for meaning to coordinate onto (unlike the physical road), it is easier to change. The opposite is true. Because meaning coordinates on *mental states* and *inferences*, the web of dependencies is deeper. If we change the meaning of "promise," we disrupt the logic of contracts, trust, and future planning. The "road" analogy breaks because the road is external to us; language is internal to our reasoning. You can move the road; you cannot easily move the mind.

  Therefore, the evolutionary picture suggests that while conventions *do* evolve, they do so through **drift and pressure**, not **legislation**. Your friend's claim that disputes are "just power" ignores that power is often impotent against the inertia of a coordination equilibrium. You can force people to say words, but you cannot force the mutual expectations required for those words to carry the new meaning.

  ***

  ### Diagnosis and Next Steps

  **Which reading did he most likely have in mind?**
  He most likely had in mind a confused hybrid of **Reading 1 (Metaphysical Negation)** and **Reading 5 (Political Construct)**. He starts with the plausible idea that words aren't natural (Reading 1) to disarm the idea of objective meaning, then pivots to the idea that authority is just power (Reading 5) to win the argument about who gets to decide. He is using the trivial truth of the first to smuggle in the controversial claim of the second.

  **Which reading does he *need* for his argument to go through?**
  To license the claim that we can change meaning by fiat and that no one can be "wrong," he needs **Reading 2 (Descriptive Regularity)** combined with the **Fiat assumption**. He needs meaning to be *only* what people do (so authority can't be right over the crowd) and he needs behavior to be controllable by decision (fiat). As shown above, both of these are weak links. Reading 2 ignores norms, and the Fiat assumption ignores coordination costs.

  **What further question should you ask him?**
  To force him to reveal which reading he is actually holding, ask him this:

  > "If convention is just what people do, and we can change it by decision, imagine I decide right now to use the word 'cat' to mean 'dog.' If I say 'I have a cat' while pointing at a dog, am I speaking falsely, or have I successfully changed the convention for myself?"

  *   If he says **you are speaking falsely**, he admits conventions are not private and you can be wrong (abandoning the Fiat/Private claim).
  *   If he says **you have changed the convention**, he is committed to the idea that a single speaker can dictate meaning (which makes communication impossible).
  *   If he says **we all have to decide together**, ask him **how** we synchronize that decision without using the language we are trying to change. This exposes the impossibility of the "fiat" claim.
