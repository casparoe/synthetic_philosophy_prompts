      *   *Nature of Money:* Money is a "ticket" or "counter." It's not valuable in itself (anti-bullionist). It represents a claim on labor/industry. Value comes from circulation, not hoarding.
      *   *Wealth:* Wealth = Industry/Employment/Population. Not gold/silver stocks. A nation is rich if its people work and consume, not if its vaults are full.
      *   *Luxury/Speculation:* Deeply suspicious. Luxury corrupts virtue. Speculation (like South Sea Bubble) diverts energy from real industry to gambling.
      *   *Authority/Sovereignty:* Money needs public authority to be credible. *Passive Obedience* suggests strong deference to established authority for social order, but utility matters. The sovereign (or state) should manage money for the public good.
      *   *Irish Context:* Ireland was colonially restricted (couldn't mint own coin, trade restricted by England). He wanted Irish economic independence via a national bank. This makes him pro-active state intervention in money.
      *   *Theology/Providence:* Order is good. Chaos is bad. Economic activity should serve moral and social ends (providential order). Usury/interest is tricky but generally acceptable if it fuels industry.
      *   *Credit:* Pro-credit. He wanted a bank to issue notes against land security (land bank idea). This is fiat-like but asset-backed (by land/industry, not metal).

  3.  **Mapping to Modern Topics (Phase 2):**

      *   *1. Bitcoin:*
          *   *Berkeley's lens:* No sovereign issuer = dangerous. Speculative holding = hoarding (bad). Mining = waste of industry?
