      *   *4. Hard-Money Bullionism:*
          *   *Berkeley's lens:* He hated this. Called gold/silver "counter" too. Thought relying on specie limited growth.
          *   *Verdict:* Strongly Negative.
          *   *Seams:* None really, this is his core economic thesis.

      *   *5. Stablecoins:*
          *   *Berkeley's lens:* Pegged to sovereign currency = derives authority from state. But private issuance?
          *   *Verdict:* Mixed/Skeptical. Likes the stability, dislikes private profit from public utility.
          *   *Seams:* The mechanism of the peg (reserves) is opaque to him.

      *   *6. MMT (Modern Monetary Theory):*
          *   *Berkeley's lens:* Sovereign can't run out of own currency = aligns with his ticket theory. But MMT ignores inflation constraints he worried about (price of provisions).
