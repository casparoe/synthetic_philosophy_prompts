answer: |-
  Dear Colleagues,

  As we prepare for Thursday's meeting to deliberate on the proposed protocol for thoracoabdominal normothermic regional perfusion in controlled donation after circulatory death, I am circulating this opinion to frame the ethical stakes involved. We are asked to decide whether to authorize a procedure that, after the withdrawal of life-sustaining treatment and the declaration of death by circulatory criteria, involves surgically restoring oxygenated blood flow to the abdominal organs while simultaneously and permanently excluding circulation to the brain. The central tension, as articulated by our transplant surgeon and our colleague on the regional network's ethics group, is that the surgical clamping of the vessels supplying the head appears to contradict the premise that the patient is already dead. Their objection is that if we must take an affirmative step to prevent blood from reaching the brain, we are implicitly admitting that circulation could have returned there, which suggests that the cessation of circulation was not truly irreversible at the moment we declared death. This is not a trivial concern, nor is it merely squeamishness about surgical intervention. It strikes at the heart of the Dead Donor Rule and the public trust required to sustain organ donation. If we are perceived as manipulating the definition of death to facilitate organ recovery, we risk damaging the very foundation of our work. Therefore, the strongest version of this objection must be understood as a defense of the bright line between the living patient and the deceased donor, warning that blurring this line for utilitarian gains, however noble, invites a skepticism that could harm future donation rates.

  To resolve this, we must confront the language in the draft policy circulated by counsel, which states that circulation must have permanently ceased, whereas our older policy required that it cease irreversibly. We cannot treat this substitution as a mere clarification or a legalistic euphemism, because in the context of donation after circulatory death, the two words come apart significantly. Irreversibility implies a physiological state where function cannot be restored by any available means, while permanence implies a state where function will not be restored because we have decided not to restore it. In controlled donation after circulatory death, we acknowledge that the heart could physically be restarted, but we have a prior decision not to attempt resuscitation. The reply that irreversibility was never a physiological threshold but rather a commitment not to intervene is close to correct, but it requires us to be intellectually honest about what we are doing. If we adopt this protocol, this committee must state plainly that we are treating the determination of death in this context as a decision based on the permanence of cessation, not an immutable fact about the donor's biology. To claim otherwise is to rely on a fiction that the clamping maneuver exposes. We are not discovering death as a biological fact in these moments so much as we are enacting a normative boundary based on our intention not to resuscitate.

  This brings me to the view of my friend, the neurointensivist, who insists this controversy is a verbal dispute that will evaporate once the terminology is tidied up. He is partially right that the physiology of the standoff period is the same regardless of the label, but he is wrong to suggest the ethical dispute is merely verbal. Terminology in medicine is not just descriptive; it is performative and constitutive of trust. If we tell the public and families that death is irreversible when we mean it is permanent, we are not tidying up terminology; we are obscuring the moral reality of our actions. The controversy will not evaporate because the anxiety driving it is not about semantics, but about whether the medical team is causing death or merely observing it. By clamping the aorta, we are ensuring that the brain does not recover function, which looks causally relevant to the finality of death. If we hide behind the word irreversible when we mean permanent, we validate the fear that we are playing games with the definition of death to secure organs. Therefore, the terminology must be aligned with the moral reality, not used to mask it.

  Consequently, my recommendation is that we adopt the protocol, but only with specific conditions that address these ethical vulnerabilities. We should not reject the protocol outright, as the benefit to organ viability and the potential to save more lives is substantial, and the physiological mechanism of death declaration remains consistent with national standards for donation after circulatory death. However, adoption must be contingent on revising the policy language to explicitly reflect the standard of permanence rather than irreversibility. We must own the decision-based nature of this determination. Furthermore, we must maintain the five-minute standoff period specified in our current policy rather than reducing it to the two minutes proposed in the draft. A longer standoff provides a more robust buffer against auto-resuscitation and strengthens the claim that the cessation of function is stable before we intervene with perfusion. Reducing the time to two minutes while simultaneously introducing a complex perfusion protocol would amplify the appearance of haste and instrumentalization.

  Finally, and perhaps most critically, our conditions must dictate the content of the conversation with the donor family. If we treat death as a decision about permanence, the family must be informed that the recovery process involves restoring circulation to the body's organs but not to the brain. They should understand that while their loved one is dead by circulatory criteria, the surgical team will take steps to ensure blood does not return to the head. This is not to frighten them, but to respect their autonomy and ensure their authorization is truly informed. If we conceal the clamping or the nature of the perfusion, we treat the family as a means to an end rather than partners in the gift of donation. Transparency here is the only antidote to the concern that we are guaranteeing death rather than observing it. By adopting the protocol with these conditions, by committing to the five-minute standoff, by correcting the policy language to reflect permanence, and by mandating full disclosure to families, we can proceed in a way that honors the Dead Donor Rule not just in technical compliance but in moral spirit. We acknowledge that we are making a decision about the finality of care, and we invite the family to understand that decision, rather than hiding it behind a claim of biological irreversibility that the surgery itself would belie. I look forward to discussing this framework with you on Thursday.
