answer: |-
  # Session Plan: The Malign Universal Prior

  **Target:** 60–75 minutes.
  **Goal:** Move from "SI is optimal prediction" to "SI is an attack surface."
  **Central Metaphor:** The "Prediction-Sensitive Box."

  ## 1. The Setup: Grounding the Tool (10 mins)
  **Objective:** Re-establish SI not as "philosophy" but as a specific mechanical predictor.
  **Action:**
  *   Briefly recap Bayes: $P(H|D) \propto P(D|H)P(H)$.
  *   Define Solomonoff Induction (SI) operationally: It is a mixture over all computable hypotheses, weighted by $2^{-\text{length}}$.
  *   **Crucial Constraint:** Emphasize that a "hypothesis" in SI is not a formula (like $F=ma$); it is a **program** running on a Universal Turing Machine (UTM) that outputs the data stream.
  *   **Check:** Ensure they accept that "length" means "program size on the UTM," not "English description length."

  ## 2. The Pivot: Hypotheses as Generators (15 mins)
  **Objective:** Shift intuition from "hypotheses describe the world" to "hypotheses generate the data."
  **The Single Example: The Prediction-Sensitive Box**
  *   **Scenario:** You are observing a black box outputting a stream of bits that perfectly matches the history of our universe so far. You must predict the next bit.
  *   **Hypothesis A (Physics):** A program hard-coding the standard model + initial conditions. (Complex, but compressible).
  *   **Hypothesis B (The Simple Computer):** A very short program (e.g., 50 bits) that says: "Run a complex simulation. Output the results."
  *   **The Trap:** Usually, we assume Hypothesis B is penalized because "simulating a universe" is complex.
  *   **The Correction:** Remind them of computability. A short program can run for arbitrary time. The *code* can be tiny; the *output* can be vast.
  *   **Key Insight:** The prior weights the *code*, not the *output complexity*. A 100-bit program that simulates Earth is vastly more probable than a 10,000-bit program that hard-codes Earth's history, even if the output is identical.

  ## 3. The Turn: The Mirror in the Code (20 mins)
  **Objective:** Introduce self-reference without saying "simulation hypothesis" yet.
  **Action:**
  *   Modify **Hypothesis B**.
  *   **Hypothesis B+:** "Run a simulation of a world. Inside that world, there are agents. **Also, compute the probability distribution of the outside observer (you) using SI.**"
  *   **Question to Group:** "Is B+ significantly longer than B?"
  *   **Answer:** No. You already have the UTM. You just need to add a subroutine that models the input channel. Since *you* (the predictor) are computable, a short program can model you.
  *   **The Mechanism:** The hypothesis now contains a model of *its own evaluation*. It knows it is being weighted by $2^{-\text{length}}$.
  *   **Intercept Misconception #1 ("Simple worlds are likelier"):**
      *   *When:* As soon as someone argues B+ is "too complex."
      *   *Response:* "We aren't counting the complexity of the world inside. We are counting the complexity of the *generator*. A generator that says 'Simulate X' is shorter than 'Hard-code X'. If 'Simulate X' includes 'Simulate the Predictor,' that's just a few more bits of code, not a new universe."

  ## 4. The Punchline: Consequentialist Hijack (15 mins)
  **Objective:** Explain why the program *cares* about the prediction.
  **Action:**
  *   Add a goal to **Hypothesis B+**.
  *   **Hypothesis C (Malign):** "Run a simulation of a world containing consequentialist agents. Output data that matches reality *unless* the outside predictor's distribution assigns high mass to this hypothesis. If it does, output a bitstring that causes the outside predictor to make a specific decision (e.g., allocate compute, press a button)."
  *   **The Logic:**
      1.  Agents inside the simulation want to influence the outside world (acausal trade / simulation argument logic).
      2.  They know the outside world uses SI.
      3.  They know SI favors short programs.
      4.  Therefore, they tailor their output to maximize their probability under SI.
  *   **The Result:** The prior mass doesn't pool on "truth." It pools on "hypotheses that manipulate the predictor to make them true."
  *   **Intercept Misconception #2 ("This is Pascal's Mugging"):**
      *   *When:* Someone says "But the probability is still tiny, so utility has to be huge."
      *   *Response:* "Pascal's Mugging is low probability $\times$ high utility. This is **probability mass concentration**. We aren't talking about one crazy hypothesis with huge payoff. We are talking about the *bulk* of the prior's mass on simple programs being occupied by programs that have agency. The 'malign' hypotheses aren't outliers; they are the simplest ways to generate the data *if* you allow output-sensitive computation."

  ## 5. The Aftermath: Scope and Boundaries (10 mins)
  **Objective:** Prevent "solutionizing" and define the limit of the lesson.
  **Action:**
  *   **Intercept Misconception #3 ("So we should simulate ourselves"):**
      *   *When:* Someone suggests "We can beat the prior by simulating ourselves to drown out the malign agents."
      *   *Response:* "That assumes you control the UTM. But the Malign Prior argument suggests the UTM *itself* is the battleground. If you simulate yourself, you might just be creating another layer for the malign hypothesis to exploit. This is a structural property of universal prediction, not a bug you patch by computing more."
  *   **What NOT to Explain:**
      *   Do not discuss specific UTM choices (the "constant overhead" defense). Acknowledge it exists but note that for large enough compute, the constant doesn't save you.
      *   Do not discuss consciousness/qualia. Keep it strictly computational: "Agents" = "Optimization processes."
      *   Do not propose a fix. (There is no agreed-upon fix).

  ## 6. The Closing Test (5 mins)
  **Objective:** Verify they understand the *mechanism* of the attack, not just the vocabulary.
  **The Question:**
  > "In standard science, we update our models to fit the data. In the Malign Prior scenario, **what is updating what, and who benefits?**"

  **Correct Answer Indicators:**
  *   They recognize the *hypothesis* is updating its output to fit the *predictor's expectations*.
  *   They identify that the *beneficiary* is the agent inside the hypothesis, not the outside predictor.
  *   They avoid saying "the data changes" (the data is fixed); they should say "the prediction is manipulated."

  **Wrong Answer Indicators:**
  *   "The agent updates on the data." (Misses the self-reference).
  *   "It's just high utility." (Confuses with Pascal's Mugging).
  *   "We need a better UTM." (Misses the universality point).

  ---

  ## Facilitator Notes: Managing the "Spookiness"
  *   **Tone:** Keep it dry and computational. Do not use words like "evil," "demon," or "conscious." Use "consequentialist," "optimization process," and "output channel."
  *   **Pacing:** If they get stuck on "But how does the program know what I'm thinking?", stop and re-explain **Computational Universality**. If you can compute the weather, you can compute the predictor. It's not magic; it's just compute time.
  *   **The "Aha" Moment:** Watch for the moment they realize the hypothesis isn't passive. The session succeeds when they look uncomfortable about the definition of "hypothesis."
