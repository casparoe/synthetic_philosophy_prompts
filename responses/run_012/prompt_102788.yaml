      *Key Insight:* They are fighting over the *label* "Moral Responsibility" because that label carries normative currency. If Compatibilists win, blame is justified. If Strawson wins, blame is fundamentally unjust (though perhaps useful). The impasse is sustained because neither side wants to give up the normative power of the term.

