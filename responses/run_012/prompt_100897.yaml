answer: |-
  Here is an agenda for your world-building, ordered by logical dependency. The goal is to settle the mechanics that determine *what kind of story this is* before you settle the mechanics that determine *what happens in the scenes*.

  ### 1. The Locus of Debt (Soul vs. Lineage)
  **The Question:** Does the karma attach to the *metaphysical soul* (which reincarnates) or the *biological bloodline* (which inherits)?
  **The Argument for Priority:** This is the most upstream constraint. Your prompt contains a latent tension: "actor's later lives" implies reincarnation (Soul), but "three generations of a family" implies heredity (Lineage).
  *   **If Soul:** The "family" are merely the recurring hosts for the same soul(s). The exploitation strategy involves preparing the environment for the returning self.
  *   **If Lineage:** The "later lives" phrasing is metaphorical; the parents' acts punish the children. The exploitation strategy involves eugenics or sacrifice.
  *   **Why settle first:** If you choose Lineage, you violate the "actor's later lives" premise unless you clarify that the soul *chooses* the family. If you choose Soul, you must explain why the soul keeps returning to the same dynasty. This answer dictates the relationship between your characters: are they the *same person* wearing different faces, or distinct victims of an ancestral curse?
  *   **Tractability:** Purely conceptual. You decide the rule.
  *   **Indeterminacy:** You do not need to decide *why* the soul returns to the family (destiny, gravity, contract), only *that* it does.

  ### 2. The Moral Ontology (Intent vs. Outcome)
  **The Question:** Does the law judge the *state of mind* (intent) or the *state of the world* (consequence)?
  **The Argument for Priority:** This defines the "exploitation" mechanic.
  *   **If Intent:** The family must train in meditation, self-deception, or emotional conditioning. They might try to commit "good" acts while secretly harboring "bad" intent to game the system, or vice versa. The drama is psychological.
  *   **If Outcome:** The family becomes engineers of circumstance. They might perform a "good" act that secretly leads to disaster, or a "bad" act that inadvertently saves a life. The drama is logistical and strategic.
  *   **Why settle second:** You cannot write the family's attempts to "exploit" the system until you know what variable they are manipulating. If you leave this vague, their experiments will feel arbitrary.
  *   **Tractability:** Solvable by thought experiment. (e.g., "If I accidentally save a villain, am I credited?")

  ### 3. The Epistemic Bridge (The Archive)
  **The Question:** If the actor has no memory, **who keeps the records?**
  **The Argument for Priority:** This is the logistical bottleneck of your plot.
  *   **The Problem:** To detect a pattern across lives without memory, you need data. To exploit a pattern, you need correlation. If Generation 1 acts, and Generation 2 (the same soul) suffers, but Generation 2 remembers nothing, Generation 2 cannot learn *unless* Generation 1 left a map.
  *   **The Commitment:** This forces your "family" to be an **institution of record-keeping**. They cannot just be a household; they must be archivists. They need a ledger that survives death.
  *   **Why settle third:** This determines the texture of the narrative. Is the book about finding a diary? A coded ledger? A oral tradition? Without this, your premise (detection without memory) collapses into impossibility.
  *   **Tractability:** High. You simply design the mechanism of transfer (a physical book, a hidden vault, a trusted servant class).

  ### 4. The Signal-to-Noise Ratio (Detectability)
  **The Question:** How loud is the karma against the background noise of random chance?
  **The Argument for Priority:** This determines plausibility.
  *   **High Signal:** Every lie causes a broken bone. The world looks absurd; the family looks insane for not noticing sooner.
  *   **Low Signal:** Every lie reduces "luck" by 0.01%. The pattern is statistically invisible without massive datasets.
  *   **Why settle fourth:** You need the signal to be just loud enough for the family to detect over three generations, but quiet enough that the rest of the world hasn't noticed. This is the "Goldilocks" zone for your thriller element.
  *   **Tractability:** You can tune this by adjusting the latency (see below).

  ### 5. The Phenomenology (Manifestation)
  **The Question:** What form does the consequence take? (Health, Wealth, Luck, Social Standing).
  **The Argument for Priority:** This is downstream. Once you know *who* pays (Locus), *what* triggers it (Ontology), and *how* they track it (Bridge), you simply need to choose the aesthetic of the suffering.
  *   **Why settle last:** You can change this mid-draft without breaking the logic. If a health consequence feels too melodramatic, switch to financial ruin. The logic holds either way.
  *   **Indeterminacy:** You do not need a unified theory. One generation might suffer illness, another bankruptcy. Variety serves the narrative.

  ***

  ### The Indeterminate Zone (What you can ignore)
  You do not need to settle the **Origin** or the **End State**.
  *   **Origin:** Is this God? Physics? A cosmic glitch? The characters are exploiting a machine; they do not need to know the engineer's name. Leaving this mysterious preserves the "Law of Nature" feel.
  *   **End State:** Is there a way to escape the wheel (Nirvana)? Since your story is about *exploitation* within the system, not *escape* from it, you can leave the exit conditions undefined.

  ***

  ### The Forcing Move: The Epistemic Bridge
  You asked for the point where "consequence without recollection" forces a commitment you cannot dodge.

  **It is the Archive.**

  If there is no memory transfer, **learning is impossible without external storage.**
  You cannot dodge the question of **how the data survives the death of the actor.**
  *   If the soul returns but the brain is new, the *brain* cannot remember.
  *   Therefore, the *Family* must remember *for* the soul.
  *   This forces your "Family" to be a **conspiracy of observers**.

  If you do not build the mechanism of the Archive (the ledger, the code, the tradition), your characters cannot logically "detect the pattern." They would just be people suffering random luck. The moment you accept "consequence without recollection," you are forced to write a story about **information preservation** as much as moral action.

  **Recommendation:** Make the Archive the central object of the plot. The conflict isn't just "doing good to get good"; it is "protecting the Ledger that tells us how to do good." This resolves the epistemological gap inherent in your premise.
