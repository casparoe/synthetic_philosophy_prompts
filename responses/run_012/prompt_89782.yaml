answer: |-
  **Question 1**

  In this course, we have defined a **skyhook** as a posited capacity or entity that does explanatory work but is not itself the product of any lower-level process—it lifts without having been lifted. A **crane** is a device assembled out of materials already available at the lower level; it lifts, but is itself lifted into place by prior processes. **Greedy reductionism** is the attempt to explain a higher-level regularity directly in terms of the lowest-level facts while leaving the intervening levels unaccounted for.

  Read the following stimulus:

  > A lab studies how people come to follow arbitrary conventions, such as which side of a sidewalk to walk on. In its preprint, the lab argues that conformity is 'reduced' to reward learning: people conform because the brain treats social approval as a prediction-error signal, and the lab reports that individual differences in that signal track how quickly subjects adopt a group's convention. The preprint also posits a 'conformity drive' — a disposition to align with whatever the local majority does — and treats that drive as a primitive the theory does not decompose. A commentator calls the whole thing a textbook case of greedy reductionism.

  Write an essay responding to the following three tasks:
  1.  State a **crane/skyhook test** and a **greedy-reductionism test** as short procedures that someone hostile to the proposal could still apply. For each, specify what evidence would flip the verdict.
  2.  Apply both tests to the stimulus. Say whether the commentator's charge lands and on which part of the preprint, distinguishing what the tests condemn from what they vindicate.
  3.  Say what the lab would have to do to convert the 'conformity drive' into a crane, and take a side on whether the whole framework survives if the levels picture is only a convention of exposition.

  ***

  **Model Answer**

  The commentator's charge is partially correct but imprecise: the reward learning mechanism functions as a crane, while the conformity drive is a skyhook, making the explanation greedily reductive only regarding the drive's origin. To evaluate such claims procedurally, one must apply specific tests rather than relying on intuition. The crane/skyhook test asks: "Is the posited entity itself explained by lower-level mechanisms?" A verdict flips from skyhook to crane if evidence shows the entity's development or assembly from subordinate parts. The greedy-reductionism test asks: "Are intervening organizational levels skipped between the phenomenon and the base facts?" A verdict flips from greedy to acceptable if evidence demonstrates functional accounts at the intermediate levels.

  Applying these tests to the stimulus reveals a split verdict. The lab's account of reward learning passes the crane test. They show how social approval functions as a prediction-error signal, linking the high-level behavior (conformity) to neural mechanisms (lower-level facts) via a plausible process. This is not a skyhook because the signal processing is decomposed. However, the 'conformity drive' fails the crane test. By treating the drive as a primitive that is not decomposed, the lab posits a capacity that lifts explanatory weight without being lifted itself. It is a skyhook. Consequently, the commentator's charge of greedy reductionism lands specifically on the drive, not the reward learning. The lab jumps from social convention directly to a primitive drive and neural signals, leaving the psychological or developmental level where the drive arises unaccounted for. The reward learning component is vindicated as a legitimate reduction, but the drive remains an unexplained explainer.

  To convert the 'conformity drive' into a crane, the lab must provide an account of its origin using lower-level materials. This could involve an evolutionary explanation showing how the drive emerges from selection pressures on social cooperation, or a developmental account showing how it is assembled from simpler learning heuristics in childhood. Either strategy would demonstrate that the drive is lifted by prior processes, satisfying the crane test. Without this, the drive remains a magical residue in the machine.

  Finally, regarding the levels picture: if levels are merely conventions of exposition, the framework survives but loses ontological bite. If levels are just descriptive tools, then calling something a skyhook is only a complaint about explanatory style, not about reality. I take the side that the framework survives this shift. Even if levels are conventional, the demand for cranes remains valid as a requirement for mechanistic transparency. A skyhook is still problematic because it halts inquiry, regardless of whether the levels are real or expository. The lab's failure to decompose the drive stops further research into its causes. Therefore, even if the levels are conventional, the distinction between explaining a capacity and merely positing it remains crucial for scientific progress. The framework retains its normative force as a heuristic for good explanation, even if the hierarchy is not metaphysically strict. The lab must still build the crane, or admit they have stopped explaining.

  ***

  **Marking Scheme**

  1.  **Procedural Definition of Tests (4 marks):** Award full marks if the student defines both the crane/skyhook test (focus on origin/decomposition) and the greedy-reductionism test (focus on skipped levels) as actionable procedures with conditions for flipping the verdict.
      *   *Typical Mistake:* Defining the terms statically rather than as procedural tests with flip conditions.
  2.  **Application to Stimulus (4 marks):** Award full marks if the student correctly identifies the reward learning as a crane (vindicated) and the conformity drive as a skyhook (condemned).
      *   *Typical Mistake:* Condemning the entire preprint as skyhook/greedy without distinguishing the two components.
  3.  **Evaluation of Commentator (4 marks):** Award full marks if the student nuances the commentator's charge, noting it lands on the drive/skip but not the reward mechanism.
      *   *Typical Mistake:* Accepting the commentator's charge as wholly correct or wholly incorrect without differentiation.
  4.  **Conversion Strategy (4 marks):** Award full marks if the student specifies a developmental or evolutionary account to decompose the drive into lower-level processes.
      *   *Typical Mistake:* Suggesting more data collection on the drive without explaining its origin or assembly.
  5.  **Levels Convention Stance (4 marks):** Award full marks if the student takes a clear side on the levels question and justifies why the crane/skyhook distinction retains (or loses) value under that view.
      *   *Typical Mistake:* Refusing to take a side or claiming the distinction becomes meaningless without ontological levels.
