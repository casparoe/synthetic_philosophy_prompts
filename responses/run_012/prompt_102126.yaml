answer: |-
  This is a profound frustration, and it is one that sits right at the boundary where your training as a biologist clashes with the subject matter of philosophy. As a biologist, you look for a *mechanism*: a physical process by which A causes B. As a philosopher (or a reader of philosophy), you are being asked to consider a *normative claim*: a statement about how things *ought* to be, regardless of how they *are*.

  Your intuition is correct: if karma is posited as a causal mechanism (like gravity, but for morals), the cases of the Embezzler and the Caregiver falsify it. The universe clearly does not enforce a moral ledger through physical events. If karma is to survive, it must be "bookkeeping" only—a claim about *worthiness*, not a prediction of *outcome*.

  However, even as bookkeeping, your cases reveal a conflict in how we calculate worthiness. You are grappling with what philosophers call the **Problem of Moral Luck**. Let's dissect your tentative principle, see where it breaks, and try to construct one that saves the most important intuitions.

  ### 1. Critiquing Your Tentative Principle
  **Your Principle:** *Desert tracks the gap between what you did and what you could have done (unrealized power).*

  This is a strong starting point. It aligns with the **Control Principle**: you are only responsible for what is within your control.
  *   **The Burglar:** Fits perfectly. He had no power to save the lives (it was accidental), so he gets no credit.
  *   **The Bystander:** Fits perfectly. He had the power to swim and didn't. The gap is wide; blame is high.
  *   **The Embezzler:** Fits partially. He had the power to stop and didn't. He *deserves* blame, even if he didn't *get* punishment. This preserves karma as bookkeeping (he is guilty) even if it fails as mechanism (he wasn't caught).
  *   **The Child:** Fits. Their "power" (cognitive capacity) is undeveloped, so the gap between what they did and what a rational agent would do is not fully attributable to them.

  **Where it breaks:**
  *   **The Torturer:** You say he "couldn't have known to" do otherwise. If his lack of knowledge was truly involuntary (indoctrination from birth), then under your principle, the "gap" is zero. He did what he thought was right given his constraints. Yet, your gut says he *still* deserves something bad.
  *   **The Caregiver:** She did what she could (nursing), but the outcome was ruin. Your principle focuses on *action*, but your gut reaction focuses on the *outcome* (dying at 50). You feel she deserves *better*, which implies desert should track welfare, not just agency.

  ### 2. A More Robust Principle: Reasons-Responsiveness
  To reconcile the Torturer and the Bystander, we need to refine "what you could have done." It isn't just about physical power; it's about **responsiveness to reasons**.

  **The Principle:** *Moral desert tracks the quality of your will, measured by how well your choices align with the moral reasons you were capable of recognizing.*

  This distinguishes between **Subjective Blame** (what you knew) and **Objective Wrongness** (what was actually true).

  *   **The Burglar:** His will was bad (intent to rob). The outcome (saving lives) was disconnected from his will. **Verdict:** Negative desert (blame), no positive credit.
  *   **The Bystander:** He recognized the reason ("child drowning") and had the capacity to act, but his will was indifferent. **Verdict:** High negative desert.
  *   **The Torturer:** This is the crux. If he was truly incapable of recognizing the moral reason (torture is wrong) due to indoctrination, his *subjective* blame is low. However, his will is still objectively misaligned with human welfare.
      *   *Philosophical pivot:* Does he deserve *suffering* (retribution) or *restraint* (quarantine)? Your gut says suffering. A reasons-responsiveness view suggests he is **dangerous**, not necessarily **evil**. He is like a virus: harmful, but not "guilty" in the same way a host who refuses a vaccine is.
  *   **The Child:** Lacks the capacity to recognize the reason (insect sentience). **Verdict:** Minimal desert.
  *   **The Embezzler/Caregiver:** Here, we must separate *Desert* from *Fate*. The Embezzler has high negative desert (he recognized the reason "stealing is wrong" and ignored it). The Caregiver has high positive desert. The fact that the universe didn't pay out is a failure of the *cosmos*, not the *moral accounting*.

  ### 3. Which Verdict Must You Sacrifice?
  You asked which of your gut reactions you would have to give up to make this coherent.

  **You must sacrifice the intuition that the Serene Torturer deserves *suffering*.**

  Here is why: If you hold that the Bystander is worse than the Torturer (which your prompt suggests), you are prioritizing **Knowledge** over **Action**. The Bystander *knows* the good and rejects it. The Torturer *pursues* what he thinks is good, but is mistaken.
  If you claim the Torturer deserves punishment despite his ignorance, you are claiming that **Objective Wrongness** trumps **Subjective Capacity**. But if you claim that, you cannot consistently say the Child is barely blameworthy. The child is also objectively wrong (causing pain) but subjectively ignorant.

  To be consistent, you must treat the Torturer like the Child: **diminished responsibility.**
  *   **Why this one?** Because holding someone fully responsible for what they *could not know* violates the biological reality of how brains learn. It requires a supernatural mechanism (innate moral knowledge) that contradicts your background.
  *   **The Cost:** It feels unsatisfying. We *want* the torturer to suffer. But that desire is vengeful, not just. If you accept the "Reasons-Responsiveness" principle, the Torturer deserves to be *stopped*, perhaps confined, but not *tormented*. Torment requires a choice to be evil; he made a choice to be "holy," albeit based on false data.

  ### 4. Prediction for the New Case
  **The Case:** A woman spends her life campaigning against a disease and, through no fault of her own (e.g., a mutation in the virus, or flawed data that was indistinguishable from truth at the time), ends up making it worse.

  **Applying the Principle of Reasons-Responsiveness:**
  1.  **Intent:** Alleviate suffering (Positive Will).
  2.  **Capacity:** She used the best available knowledge and effort (High Responsiveness to Reasons).
  3.  **Outcome:** Increased suffering (Negative Resultant Luck).

  **The Prediction:**
  She has **zero negative moral desert**.
  She does not deserve blame, guilt, or punishment. She may deserve *pity* or *tragic recognition*, but morally, her ledger remains positive. To blame her would be to punish her for "Resultant Luck," which your verdict on the Burglar (no credit for accidental saving) already rules out. If he gets no credit for accidental good, she gets no blame for accidental bad.

  ### 5. The Biologist's Takeaway
  You mentioned you keep wanting a mechanism. In biology, we distinguish between **proximate causes** (how the machine works) and **ultimate causes** (why the machine evolved).

  *   **Karma as Mechanism (Proximate):** There is no evidence for this. The Embezzler and Caregiver prove the universe is morally indifferent.
  *   **Karma as Evolutionary Heuristic (Ultimate):** The *belief* in karma might have a mechanism. Societies that believe in moral ledger-keeping may cooperate better. Your "gut" feeling is likely an evolved social instinct demanding fairness to maintain group cohesion.

  **The Synthesis:**
  Your gut is running on a social algorithm designed for small tribes where everyone sees everything. In a tribe, the Embezzler *would* get caught. The Bystander *would* be shamed. The Torturer *would* be known as indoctrinated.
  Philosophy asks you to run that algorithm on a global, anonymous scale where the feedback loops are broken.

  **Final Advice:**
  Keep the bookkeeping, drop the mechanism.
  1.  **Desert is real:** People *are* blameworthy or praiseworthy based on their choices and knowledge (The Embezzler is guilty, the Caregiver is virtuous).
  2.  **Payment is not:** The universe does not settle the tab (The Embezzler dies admired, the Caregiver dies young).
  3.  **Consistency:** Judge the Torturer by what he could know, not by what he did. If he couldn't know, he is a tragedy, not a villain.

  This preserves your scientific integrity (no magic causality) while respecting your moral intuition (people are responsible for their choices). It leaves you with a world that is morally structured but physically indifferent—a harder pill to swallow, but perhaps the only one that doesn't contradict the evidence.
