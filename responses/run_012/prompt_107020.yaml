  A sophisticated hyperbolic discounter walks into a pawnshop with a voucher redeemable for $100 tomorrow. At 9 AM, discounting lightly, he pays the broker $5 for a "Time-Lock" device to prevent himself from selling early. At 5 PM, his discount rate spikes; he pays the broker $10 to unlock it and sells the voucher for $85.

  He leaves with $70, having lost $30 to fees. The broker pockets the cash and smiles: "A weak-willed man just sells his future once. You paid me to bind yourself, then paid me to unbind yourself. The lock wasn't a safeguard; it was just the handle for the next turn of the pump. You weren't irrational; you were synchronically rational at every step of your diachronic exploitation."
