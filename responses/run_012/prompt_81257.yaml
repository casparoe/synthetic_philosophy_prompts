prompt: |-
  ok so background: I'm a junior in high school and I'm the student rep on my school's handbook committee — it's me, the principal, two teachers, and a parent. We meet every other week and there's usually one or two proposed policy changes on the agenda (dress code, phone rules, hall passes, whether teachers can search bags, whether a club can put up posters). The principal basically gets whatever he wants unless I say something specific about why a rule is a problem, I get about three minutes to talk, and whatever I say goes in the minutes.

  In civics we did the negative vs positive liberty thing, and my teacher also mentioned a third version where you're unfree not because anybody is blocking you but because you're under somebody's arbitrary power even if they never actually use it — her example was a person with a master who never orders them around. That stuck with me because of the locker searches at my school: the rule says the principal can search any locker, any time, for any reason, and in practice he's basically never done it. Me and my friend keep going back and forth about whether that's a freedom problem, and whether the phone ban we voted on last year is one (I hate it, but everyone voted for it and it applies to everybody the same).

  So what I want is a procedure I can run on any proposal in the meeting: the questions in order, what counts as a good enough answer to each one, which question is the one that stops a rule dead, where the procedure has to stop and just say this is a values call and a human decides, and which steps are really me smuggling in what I already think with a philosophy sticker on it. It needs to fit on one page, be worded so a teacher who's never heard of any of these distinctions can follow it, and it has to tell me what to do when the three tests disagree with each other, cause im pretty sure they will. Also, none of it can depend on me knowing who came up with any of this.

  Then run it on three proposals: (1) the locker search rule; (2) the phone ban that students voted for and that applies to everyone equally; (3) a proposal to ban political buttons and stickers in school, which I'm definately going to fight. Be honest when the procedure says I'm wrong about one of these, I'd rather know now than in the meeting. And tell me where the whole thing breaks down — rules that are really about safety, or cases where the school isn't stopping me from doing anything but I still don't feel free.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, student rep on handbook committee.
      *   **Context:** Committee meets bi-weekly. Principal dominates unless student gives specific reasons. User has ~3 mins to speak. Minutes record input.
      *   **Philosophical Background:** Learned about Negative Liberty (freedom from interference), Positive Liberty (freedom to self-govern), and a third concept (freedom from arbitrary power/domination, likely Republican Liberty/Neo-Roman theory).
      *   **Task:** Create a one-page procedure/checklist to evaluate policy proposals during meetings.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "good enough" answers.
          *   Identify the "killer question" (stops a rule dead).
          *   Identify where it becomes a "values call" (human decision).
          *   Identify where the user might be biasing the process ("smuggling in philosophy").
          *   No jargon/names of philosophers (must be accessible to teachers).
          *   Handle conflicts between tests.
          *   Apply the procedure to three specific cases: Locker Searches, Student-Voted Phone Ban, Political Buttons Ban.
          *   Be honest about where the user might be wrong.
          *   Identify where the procedure breaks down (safety vs. freedom, psychological freedom).

  2.  **Deconstruct the Philosophical Concepts (for internal use):**
      *   *Negative Liberty:* Is someone stopping me? (Interference).
      *   *Positive Liberty:* Am I in control of my own life? (Self-mastery).
      *   *Republican Liberty (The "Third Version"):* Am I subject to arbitrary power? (Domination, even if unused).
      *   *The User's Insight:* The locker search rule fits the "Third Version" perfectly (arbitrary power, rarely used). The phone ban fits Negative Liberty (interference) but has democratic legitimacy (students voted).

  3.  **Drafting the Procedure (The "One-Pager"):**
      *   *Goal:* Make it practical, neutral-sounding, and actionable within 3 minutes.
      *   *Structure:* A flowchart or numbered list. Let's go with numbered steps for clarity.
      *   *Language:* Plain English. No "Berlin," "Pettit," "Negative/Positive."
      *   *Step 1: The Interference Test (Negative).* Does this stop a specific action?
      *   *Step 2: The Arbitrariness Test (Republican).* Can authority use this power without clear rules/reasons?
      *   *Step 3: The Ownership Test (Positive/Democratic).* Did the people affected agree to this?
      *   *Decision Logic:* Need a way to weigh them.
          *   Arbitrariness is usually the strongest objection in a school setting (due process).
          *   Interference is the most obvious.
          *   Ownership can justify interference.
      *   *The "Killer Question":* Usually the Arbitrariness one. If a rule gives unchecked power, it's dangerous regardless of intent.
      *   *The "Values Call":* When safety conflicts with freedom.
      *   *Bias Check:* Acknowledge that prioritizing "Arbitrariness" is a philosophical choice.

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Time:* 3 minutes means ~300-400 words spoken, or a quick handout. The procedure needs to be a mental checklist or a small card.
      *   *Audience:* Teachers/Principal. Needs to sound responsible, not rebellious.
      *   *Conflict:* What if Test 1 says "Bad" but Test 3 says "Good"? (e.g., Phone ban). Need a tie-breaker.
      *   *Revision:* Let's structure it as "The Three-Point Safety & Freedom Check."

  5.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Locker Searches (Any time, any reason, rarely used).*
          *   Interference: Low (rarely happens).
          *   Arbitrariness: High (Any time, any reason = unchecked power).
          *   Ownership: Low (Top-down).
          *   *Verdict:* Fails the Arbitrariness test. Strong objection.
          *   *User's intuition:* Correct. This is the "master/slave" dynamic.

      *   *Case 2: Phone Ban (Student voted, applies to all).*
          *   Interference: High (Can't use phones).
          *   Arbitrariness: Low (Clear rule, applies to all).
          *   Ownership: High (Students voted).
          *   *Verdict:* Passes Ownership, Fails Interference.
          *   *Conflict:* Does voting make it okay? The procedure needs to say "Ownership can justify Interference."
          *   *Honesty Check:* User hates it, but procedure might say it's legitimate.

      *   *Case 3: Political Buttons Ban.*
          *   Interference: High (Can't express views).
          *   Arbitrariness: Medium/High (What counts as political?).
          *   Ownership: Unknown (Likely admin proposed).
          *   *Verdict:* Fails Interference + Arbitrariness. Strong objection.
          *   *Legal Note:* Tinker v. Des Moines (substantial disruption). I shouldn't cite case law per instructions ("no names"), but the logic holds.

  6.  **Addressing the "Breakdown" and "Bias":**
      *   *Bias:* Prioritizing "Arbitrariness" is a specific philosophical stance (Republicanism). A utilitarian might say "If it keeps kids safe, who cares if it's arbitrary?"
      *   *Breakdown:* Safety emergencies. Sometimes arbitrary power *is* needed for immediate safety (e.g., bomb threat). The procedure needs a "Safety Override."
      *   *Psychological Freedom:* The user mentioned "don't feel free." The procedure can't measure feelings, only structures.

  7.  **Finalizing the Output Structure:**
      *   **Part 1: The One-Page Procedure.** (Clean, bold, actionable).
      *   **Part 2: The Stress Test (Running the 3 proposals).**
      *   **Part 3: The Meta-Analysis.** (Where you're biased, where it breaks, safety vs. liberty).

  8.  **Drafting Content - Iteration & Polishing:**
      *   *Tone:* Respectful but firm. "Student Rep" persona.
      *   *Constraint Check:* "None of it can depend on me knowing who came up with any of this." -> Ensure no philosopher names are dropped in the procedure itself.
      *   *Constraint Check:* "Tell me what to do when the three tests disagree." -> Need a weighting system.
      *   *Refining the "Killer Question":* The Arbitrariness question is the most robust for a student rep because it appeals to fairness and due process, which admins care about.
      *   *Refining the "Values Call":* This happens when Safety > Freedom. The procedure must acknowledge that schools have a duty of care.

      *(Self-Correction during drafting)*: I need to make sure I don't give the user legal advice. I must frame this as *policy evaluation*, not *legal compliance*.
      *(Self-Correction on Phone Ban)*: The user hates the phone ban. If the procedure says "It's fine because you voted," the user might feel betrayed. I need to explain *why* the procedure says that, and how they can still argue against it (e.g., was the vote informed? is the rule too broad?).
      *(Self-Correction on Locker Search)*: This is the strongest case. I need to make sure the user knows *why* this is the winning argument.

  9.  **Final Review against constraints:**
      *   One page procedure? (Will format it to look like one).
      *   No jargon? (Check).
      *   Order of questions? (Check).
      *   Good enough answers? (Check).
      *   Killer question identified? (Check).
      *   Values call identified? (Check).
      *   Bias identified? (Check).
      *   Run on 3 proposals? (Check).
      *   Honesty about user being wrong? (Check).
      *   Breakdown analysis? (Check).

  10. **Final Polish:** Ensure the distinction between "Interference," "Arbitrariness," and "Consent" is clear without using the philosophical labels. Use terms like "Direct Block," "Unchecked Power," and "Group Agreement."

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is the procedure, followed by the stress test on your three proposals, and finally the honest breakdown of where this logic holds and where it fails.

  ### Part 1: The Policy Evaluation Checklist (One-Page Version)

  **Instructions:** When a new rule is proposed, ask these three questions in order. Write the answers in the minutes. If the answer to any question is "No," the rule needs revision before approval.

  **1. The Direct Block Test**
  *   **Question:** Does this rule stop a student from doing something specific they could otherwise do?
  *   **Good Answer:** "Yes, but it stops a behavior that harms learning or safety (e.g., cheating, fighting)."
  *   **Bad Answer:** "Yes, it stops behavior that is merely annoying or unpopular."
  *   **Note:** If the answer is "Yes," the rule *interferes*. This is not automatically fatal, but it requires justification.

  **2. The Unchecked Power Test (The Killer Question)**
  *   **Question:** Does this rule give an administrator the power to enforce it based on their personal mood or judgment, without clear evidence or a specific reason?
  *   **Good Answer:** "No. The rule lists specific triggers (e.g., 'reasonable suspicion,' 'during exam hours') and applies to everyone equally."
  *   **Bad Answer:** "Yes. The administrator can decide when to use it, on whom, and for what reason."
  *   **Stop Rule:** If the answer is **Bad**, the rule fails immediately. Unchecked power creates fear even if never used. This requires a "Due Process" fix (clear limits) before moving to Question 3.

  **3. The Group Agreement Test**
  *   **Question:** Did the people affected by this rule have a real say in creating it?
  *   **Good Answer:** "Yes. It was voted on by the student body, or the Student Council drafted it."
  *   **Bad Answer:** "No. It was decided by administration for the students."
  *   **Note:** A "Yes" here can justify a "Yes" in Question 1. (We can block ourselves if we agree to it). A "No" here makes Question 1 much harder to justify.

  **Decision Matrix (When Tests Disagree)**
  *   **If Test 2 fails:** Reject the rule. (Safety does not require arbitrary power).
  *   **If Test 1 fails but Test 3 passes:** The rule is allowed, but should be reviewed in 6 months to see if it's working.
  *   **If Test 1 fails and Test 3 fails:** Reject the rule.
  *   **The Values Call:** If the rule is about immediate physical safety (fire, violence), Test 2 can be paused. Safety overrides freedom in emergencies, but the rule must expire when the emergency ends.

  **Bias Warning (For the Rep)**
  *   Prioritizing Test 2 assumes that *how* a rule is enforced matters more than *what* the rule does. This is a choice. Some people care more about results (Test 1) than power structures (Test 2).

  ***

  ### Part 2: Running the Proposals

  Here is how the checklist handles your three scenarios. I will be blunt about where your intuition matches the logic and where it doesn't.

  #### 1. The Locker Search Rule (Any time, any reason, rarely used)
  *   **Direct Block:** Technically "No" (it doesn't stop you from using the locker), but it creates a threat.
  *   **Unchecked Power:** **FAIL.** "Any time, any reason" is the definition of unchecked power. It does not require evidence or suspicion.
  *   **Group Agreement:** **FAIL.** Admin imposed this.
  *   **Verdict:** **Reject/Revise.**
  *   **Honesty Check:** You are **right** about this one. This is the strongest argument you have. Even if the principal never searches a locker, the *ability* to do so without reason puts students in a position of dependence.
  *   **Argument for Meeting:** "This rule fails the Unchecked Power Test. Even if you never use it, the fact that you *could* search without reason makes students feel like guests rather than community members. We need a 'reasonable suspicion' clause added."

  #### 2. The Phone Ban (Student voted, applies to everyone)
  *   **Direct Block:** **FAIL.** It stops you from using your property.
  *   **Unchecked Power:** **PASS.** It applies to everyone equally. Teachers enforce it the same way.
  *   **Group Agreement:** **PASS.** Students voted for it.
  *   **Verdict:** **Allow.**
  *   **Honesty Check:** You might be **wrong** to fight this *on freedom grounds*. The procedure says this rule is legitimate because the "Group Agreement" overrides the "Direct Block." You surrendered some freedom to solve a collective problem (distraction).
  *   **How to argue anyway:** You can't argue it's "unfree." You must argue the *agreement* was flawed. "Did students understand the consequences? Is the ban too broad (e.g., stops emergency contact)? We need a review clause."

  #### 3. Political Buttons/Stickers Ban
  *   **Direct Block:** **FAIL.** Stops expression.
  *   **Unchecked Power:** **FAIL.** "Political" is vague. Who decides what is political? Is a "Support Our Troops" sticker political? Is a Pride flag political? This gives admins arbitrary power to decide what counts.
  *   **Group Agreement:** **FAIL.** Admin proposed this.
  *   **Verdict:** **Reject.**
  *   **Honesty Check:** You are **right**. This fails two tests. It blocks action and gives admins arbitrary power to define "political."
  *   **Argument for Meeting:** "This fails the Direct Block test (speech) and the Unchecked Power test (who defines 'political'?). It creates a risk of biased enforcement. We should allow all non-disruptive expression."

  ***

  ### Part 3: Where The Procedure Breaks Down

  You asked for honesty about where this system fails and where you are smuggling in your own views.

  **1. The "Safety Override" Problem**
  The checklist says safety overrides the "Unchecked Power" test in emergencies. But schools often claim *normal* discipline is a "safety" issue.
  *   *Breakdown:* If the principal says, "We need arbitrary locker searches to prevent drug overdoses," the checklist struggles. Technically, safety is a value call.
  *   *Reality:* You cannot win on pure logic here. You have to argue effectiveness. "Arbitrary searches don't stop drugs; targeted searches do."

  **2. The "Feeling Unfree" vs. "Being Unfree"**
  You mentioned feeling unfree even when not stopped. The checklist measures *structures* (rules), not *feelings*.
  *   *Breakdown:* A rule can pass all three tests but still feel oppressive. For example, a strict uniform policy voted on by students (Passes 1, 2, and 3) might still feel like it crushes individuality.
  *   *Reality:* The checklist protects your *rights*, not your *vibes*. If you want to argue about feelings, you have to step outside the procedure and speak personally.

  **3. Your Bias (The "Smuggling")**
  You prioritized the **Unchecked Power Test** as the "Killer Question."
  *   *Why this is bias:* A strict utilitarian (someone who cares only about outcomes) would say, "Who cares if the power is arbitrary? If no one gets hurt, the rule is fine."
  *   *Why you did it:* You intuitively understand that living under arbitrary power is damaging to your development as a citizen, even if the power isn't used. This is a sophisticated view, but it is a *value judgment*, not a fact.
  *   *Risk:* If the principal says, "I don't care about power structures, I care about results," your checklist loses leverage. You have to persuade them that arbitrary power *produces bad results* (distrust, resentment).

  **4. The Phone Ban Dilemma**
  This is the hardest one for you. The checklist validates the phone ban because students voted for it.
  *   *The Hard Truth:* If you argue the phone ban is a "violation of freedom," the checklist shows you are inconsistent. You accepted the vote then.
  *   *The Fix:* Don't argue freedom. Argue **effectiveness**. "The ban isn't achieving the goal students voted for; it's creating hidden usage. We need to update the rule."

  ### Summary for Your 3 Minutes
  1.  **Locker Searches:** Hit the **Unchecked Power** angle. It's your strongest philosophical and practical point.
  2.  **Phone Ban:** Don't call it unfree. Call it **ineffective** or in need of **review**.
  3.  **Political Buttons:** Hit both **Direct Block** (speech) and **Unchecked Power** (vague definitions).

  Print the checklist. Put it in your notebook. When a proposal comes up, run it silently. If it fails Test 2, speak up immediately. That is your red line.
