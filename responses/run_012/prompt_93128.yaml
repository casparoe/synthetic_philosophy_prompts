  *Key nuance:* The user is right to worry about the medical example. The "cost of testing" is a practical confounder, but the deeper issue is that medical examples often obscure the *payoff structure*. In medicine, "Treating a healthy person" is bad, but sometimes people assume "Doing nothing" is 0 and "Treating" is always positive if you *might* be sick. We need clear negative payoffs for wrong actions. Investment makes this crystal clear.

  *Proof:* Keep it geometric. $V(p) = \max_a \sum u(a, s) p(s)$. This is max of linear functions $\to$ convex. Information is a mean-preserving spread on $p$. Expectation of convex function increases with spread.

