  It is a pleasure to correspond with a colleague who has traded the pipette for the text, though I suspect you find the arguments in the texts just as contentious as the ones in the lab. Ruth sounds like a formidable interlocutor. Philosophers often spend decades trying to articulate intuitions that seasoned biologists like her carry in their bones. Her "nose" is likely a highly tuned sensitivity to the normative dimension of biology—the difference between what a thing *does* and what it is *supposed to do*.

  Based on the record you provided, I can tell you which theories are clashing in your reading group, what Ruth's verdict on the bittercress will likely be, and how to finally pin her down.

  ### The Rival Stories (For Pieter)

  The fight in your group is the central debate in the philosophy of biology from the last forty years. The two main camps are:

  1.  **Selected Effects Theory (SE)** — also known as the **Etiological Theory**.
      *   **The Rule:** A trait has a function if and only if it was naturally *selected for* that effect in the evolutionary past. Function is historical.
      *   **Key Proponents:** Ruth Millikan, Karen Neander.
      *   **The Vibe:** "You have to earn your function through ancestry."
  2.  **Causal Role Theory (CR)** — also known as the **Systemic Theory**.
      *   **The Rule:** A trait has a function if it makes a causal contribution to the capacity of the containing system. Function is current utility.
      *   **Key Proponent:** Robert Cummins.
      *   **The Vibe:** "If it helps the machine work, it has a function."

  There is a newer contender, the **Organizational Account**, which argues functions exist in any self-maintaining system (autopoiesis), but for the purpose of Ruth's specific verdicts, the fight is primarily between **SE** and **CR**.

  ### Analyzing Ruth's Record

  Ruth's past verdicts align almost perfectly with **Selected Effects Theory (SE)**, with a strict biological constraint.

  *   **The Healthy Heart:** Both SE and CR agree here. Pumping blood is the selected effect *and* the causal contribution. The thumping noise is a side effect (a "spandrel," to use Gould's term), not selected for.
  *   **The Malformed Baby Heart:** This is the clincher. A Causal Role theorist struggles here. The heart *never* pumped blood; it contributed nothing to the system. Yet Ruth says its function was still to pump blood. Why? Because it belongs to a *type* (heart) that has a history of selection for pumping. It is a broken instance of a functional kind. This is classic **SE**.
  *   **The River:** Causal Role theory typically allows functions for rivers, engines, and artifacts (a carburetor has a function). Ruth explicitly denies this ("only living things have functions"). This suggests she ties function strictly to *biological selection*, not just systemic utility.

  ### The Prediction: The Bittercress Hairs

  **Verdict:** Ruth will say the hairs **do not have a function.**

  **Reasoning:** Under Selected Effects Theory, a trait requires a history of selection to acquire a function. Your bittercress is a "hopeful monster"—a one-off mutation. It has not been selected yet; it has not passed through a winter; it has no lineage. While the hairs *contribute* to survival (which satisfies Causal Role), they lack the *etiology* (history) required by Selected Effects.

  Ruth will likely tell you that the hairs have a **use** (just like the river), or that they are an **adaptation in the making**, but strictly speaking, they cannot have a *function* until they are established in the population through selection. If the plant dies without reproducing, the hairs were never functional; they were just a physiological accident that happened to help.

  **Which rule to bet on?** Bet on **Selected Effects**. It is the only theory that cleanly explains why the broken heart still has a function (history of the type) while the river does not (no history of selection).

  ### The Tie-Breaker Case

  You mentioned that the cases so far are ones where "rival stories happen to agree." The bittercress is a strong test, but if you want a case that forces Ruth to choose between *which history matters* versus *current utility*, you should present her with a case of **Exaptation**.

  **The Case of the Kiwi's Wing (or the Panda's Thumb):**
  Ask Ruth about the wings of a Kiwi bird.
  *   **History:** Wings were selected for flight in the Kiwi's ancestors.
  *   **Current State:** Kiwis are flightless. The wings are tiny and useless for flight. They might help with balance or camouflage now.
  *   **The Question:** "Does the Kiwi's wing have the function of flight?"

  **Why this settles it:**
  *   **Selected Effects (Ruth's likely view):** Yes. The function is determined by what the trait was *selected for* in the lineage. Even if it doesn't fly, its function is flight (it is a vestigial flight organ). Any current benefit (balance) is merely a *use*, not the function.
  *   **Causal Role / Organizational:** No. The wing contributes nothing to flight. Its function is whatever it currently does for the system (balance), or it has no function at all.

  If Ruth says, "It's a wing, so its function is flight, even if it can't fly," she is a hardline **Etiologist (Selected Effects)**. If she says, "No, its function is balance now," she is allowing current contribution to overwrite history, which would contradict her verdict on the broken heart.

  ### Summary for the Group

  *   **Ruth's Theory:** Selected Effects Theory (Etiological Account).
  *   **Bittercress Verdict:** No function (no selection history).
  *   **Names for Pieter:** Millikan and Neander (for Ruth's side); Cummins (for the opposition).
  *   **Next Case:** The Kiwi Wing (Vestigial traits).

  Ruth's "nose" is essentially a detector for evolutionary history. She is resisting the idea that "what helps" is the same as "what is for." In her view, nature doesn't care what works today; it only cares what worked yesterday.
