prompt: |-
  I'm in a phil of physics course and for the creative bit of the assessment I want to write a short story that actually dramatizes the substantivalism vs relationism fight (Newton's bucket, the whole thing about whether rotation is real when there's nothing to rotate relative to) rather than having characters just recite the positions at each other. Premise I've got: a grad student is the last experimenter left, and she has a machine that erases matter shell by shell — first the stars and galaxies, then the local cluster, then eventually the walls of her own lab. After each deletion she runs the same two checks, a bucket of water she spins *with* the bucket (does the surface still climb the walls when the water is at rest relative to the bucket?) and a gyroscope, to see whether the local signs of rotation survive as there's less and less stuff for the rotation to be relative to. If the effects fade as the shells go, that's the relationist/Mach-style hope that inertia comes from distant matter; if they don't, absolute space just got a promotion. The wrinkle she keeps hitting is that once a shell is gone there's no signal left to tell her when its influence should have stopped, so she's stuck trusting her memory of what used to be out there. Can you write it for me? Give it as exactly five scenes, each just a sentence or two, no intro or wrap-up, and let the experiments do the arguing instead of anyone explaining the views out loud — I want the reader to feel why this is hard, not get a lecture.
