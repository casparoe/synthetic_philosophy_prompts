answer: |-
  The water climbed the concave walls of the spinning bucket while the gyroscope held its steady hum against the backdrop of a billion visible stars.

  She erased the outer galaxies into white void, but the water's curve remained sharp and the gyro refused to drift.

  She deleted the solar system, yet the water pressed against the porcelain with the same violent conviction.

  The lab walls evaporated last, leaving her floating in pure silence with the bucket still spinning against a background that no longer existed.

  She waited for the curve to flatten as the last mass vanished, but without light to signal the deletion, she couldn't know if the inertia remained or if she was simply remembering the curve from when there was something to see.
