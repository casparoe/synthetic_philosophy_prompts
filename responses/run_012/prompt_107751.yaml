answer: |-
  This is a strong spine. It's viable for a grad seminar. You're effectively pushing back on a realist interpretation of Dennett's "Center of Narrative Gravity" by using his own analogy against him. That's a classic move in this context.

  Here is the breakdown on the three specific trouble spots you identified, plus a note on the "thin/thick" rebuttal.

  ### (a) Underdetermination vs. Self-Deception
  You are right to worry this proves too much. If *any* story fits, you lose the ability to criticize delusions.
  *   **The Fix:** You need to distinguish between **factual constraints** and **evaluative underdetermination**.
      *   No narrative can fit the evidence if it denies brute facts (e.g., "I never speak" when you have a podcast). Self-deception usually involves denying brute facts or ignoring high-probability causal links.
      *   Your underdetermination claim applies to *moral/characterological* interpretation of ambiguous actions. The "coward" vs. "prudent" vs. "unlucky" triad works because the *external behavior* is identical, but the *motivational structure* attributed differs.
      *   **Reframing Self-Deception:** On your view, self-deception isn't believing a *false* story (since there is no single true story); it is stubbornly adhering to a *maladaptive* story when a more *functional* story is equally compatible with the evidence. This shifts the norm from **truth** to **utility/coherence**.
      *   **Risk:** If you don't make this distinction, a critic will say, "So a sociopath's narrative is just as 'true' as their victim's?" You need to say: "Both fit the behavioral data, but one fails the test of social coordination/ethical viability."

  ### (b) The Therapist Conclusion
  Does it follow? Yes, but it risks sounding like "anything goes."
  *   **The Gap:** You move from "the self is a choice" to "therapy is co-authoring." The missing link is **authority**. If it's just a choice, why do we pay therapists? Why not just pick a story on Tuesday?
  *   **The Fix:** Lean into the **phenomenology of discovery**. Even if the self is *ontologically* a construction, it must be *experienced* as a discovery to function.
      *   A therapist isn't just handing you a fiction; they are guiding you to a narrative that *feels* like an excavation because it resolves cognitive dissonance.
      *   **Overshoot Check:** Don't say "that's all a self ever was" in a way that implies the self is *nothing but* a story. Say "the *unity* of the self is nothing but the unity of the story." That preserves the reality of the mental states while denying the reality of the "owner" of those states.
      *   **Normativity:** You need a criterion for why we swap stories. If it's not truth, is it happiness? Agency? Social integration? Pick one. If you don't, the therapist is just a propagandist.

  ### (c) The Center of Gravity Disanalogy
  Your worry is correct: "Abstract things are vague" is weak. The stronger point is about **supervenience**.
  *   **Cleaner Formulation:**
      *   **CoG:** The location of the CoG **uniquely supervenes** on the mass distribution. Given the mass, the CoG is fixed. It is observer-independent.
      *   **Self:** The location of the "Narrative Center" **does not uniquely supervene** on the behavioral distribution. Given the behavior, the Self is *plural*. It is observer-relative (or interest-relative).
  *   **Why this matters:** In physics, the CoG is a fiction that simplifies calculation. In psychology, the Self is a fiction that simplifies *agency*.
  *   **The Kicker:** The CoG analogy is usually used to show the self isn't a "little man in the head" (homunculus). You are using it to show the self isn't even a *unique point*. That is a sharper critique.
  *   **Phrasing:** "The CoG is a deterministic abstraction; the Narrative Center is an indeterministic one."

  ### One Major Vulnerability: The "Thin/Thick" Rebuttal
  You anticipate the objection: "One story predicts behavior better."
  Your reply: "Predictions are thin; stories are thick."
  *   **The Counter-Counter:** Narratives are *prophetic*. If I adopt the "I am unlucky" narrative, I will behave differently in the future than if I adopt the "I am cowardly" narrative. The "coward" might take bravery training; the "unlucky" might avoid social situations.
  *   **The Leak:** The narrative you choose *changes the mass distribution*. In physics, the mass doesn't care where you calculate the CoG to be. In humans, where you calculate the Self *changes the mass*.
  *   **How to patch:** Acknowledge this. It actually strengthens your "co-authoring" point. The therapist isn't just describing the system; they are intervening in it. The underdetermination exists *at the moment of interpretation*, but the interpretation then collapses the probability wave of future actions. This makes the "choice" even more high-stakes.

  ### Verdict
  **Keep it.** The spine holds.
  *   **Do:** Explicitly name Dennett. Acknowledge that he might agree with you, but argue that the *analogy* he chose smuggles in uniqueness that his *theory* denies.
  *   **Do:** Tighten the definition of "evidence" to avoid the self-deception trap (distinguish brute facts from motivational interpretations).
  *   **Do:** Use the "self-fulfilling" nature of narrative to bolster the therapist conclusion, not weaken it.

  **Scrap condition:** Only scrap if you can't find a normative standard for *which* story to choose. If you end up saying "all stories are equal," the essay collapses into relativism. If you say "stories are tools, and some tools work better," you have a paper.
