answer: |-
  This is a tight 30 minutes, especially with debate kids who love to nitpick definitions. Your instinct to use a concrete example is correct, but your specific example needs one tweak to work properly.

  Here is the battle plan.

  ### 1. The Example: Tweak the Consequent
  Your proposed example is the classic "Kennedy Assassination" structure (Warren Commission), which is good. But to make the truth-values diverge clearly, you need to control the background story.

  **The Setup:** Tell them: *"The fire definitely happened. The investigator proved the heater caused it. Also, assume that if the heater hadn't malfunctioned, no fire would have occurred at all."*

  **The Sentences:**
  1.  **Indicative:** "If the heater **didn't** start the fire, something else **did**."
  2.  **Counterfactual:** "If the heater **hadn't** started the fire, something else **would have**."

  **Why this works:**
  *   **Sentence 1 (Indicative):** We accept the fire exists in the actual world. If we assume the heater didn't do it (for the sake of the sentence), logic dictates *something* must have, because the fire is a fact. **Intuition: True.**
  *   **Sentence 2 (Counterfactual):** We are imagining a world where the heater didn't malfunction. Based on our setup ("no fire would have occurred"), this means no fire happens. So, "something else would have" is false. **Intuition: False.**

  **What the carrying example must have:**
  *   **Must:** A fixed fact in the actual world (The Fire Happened) that is *dependent* on the antecedent in the counterfactual scenario.
  *   **Must Not:** Ambiguity about whether the event (the fire) occurs in the counterfactual scenario. You have to stipulate the background facts.

  ---

  ### 2. The Sequence (30 Minutes)

  #### Phase 1: The Intuition Pump (0:00–0:05)
  *   **Do:** Write the two sentences on the board. Do **not** use the words "Indicative" or "Counterfactual" yet.
  *   **Ask:** "We know the heater caused the fire. Given that, is Sentence 1 true? Is Sentence 2 true? Are they saying the same thing?"
  *   **Goal:** Get them to feel the difference. Sentence 1 feels like a logical deduction from the fact of the fire. Sentence 2 feels like a claim about causality/history.
  *   **Expected Pushback:** Some will say "Both are true because the antecedent is false." (This is the Debate Club trap).
  *   **Your Move:** "Hold that thought. That's a specific theory of logic. Let's see if it holds up."

  #### Phase 2: The Debate Club Pre-emption (0:05–0:10)
  *   **The Worry:** They will claim `If P then Q` is equivalent to `Not-P or Q` (Material Conditional). If P is false, the whole thing is vacuously true.
  *   **When to hit it:** **Now.** Before you give them the labels. If you wait, they will filter everything through truth tables.
  *   **What to say:** "Some of you are thinking in terms of truth tables. In classical logic, if the 'If' part is false, the statement is automatically true. But if that were the case, Sentence 1 and Sentence 2 would have the exact same truth value. Your intuition just told you they don't. That means natural language conditionals aren't just truth tables. They depend on *connection*, not just truth values."
  *   **Cut:** Do **not** draw a truth table. Do **not** derive the material conditional. Just name it as the "Logic Class Model" and explain why it fails to capture the difference they just felt.

  #### Phase 3: The Diagnostic Test (0:10–0:20)
  *   **The Core Idea:** How do we verify these? This is the real distinction.
  *   **Indicative Test:** "To check Sentence 1, do we change history?" **No.** We look at the *actual* world. We know there was a fire. We just don't know the cause yet (in the context of the sentence). We reason from the facts we have.
  *   **Counterfactual Test:** "To check Sentence 2, do we change history?" **Yes.** We have to 'undo' the heater malfunction. When we undo that, do we keep the fire? (No, per our setup). So the sentence fails.
  *   **Key Phrase:** "Indicatives reason from **actual facts**. Counterfactuals reason from **minimal changes**."
  *   **Cut:** Do **not** say "Possible Worlds." Say "Scenarios" or "Versions of history." If you say "Possible Worlds," the smart kids will ask about accessibility relations and you will lose 10 minutes.

  #### Phase 4: Labels & The False Antecedent Trap (0:20–0:25)
  *   **Now** give them the labels: **Indicative** vs. **Counterfactual**.
  *   **Address Worry (b):** The False Antecedent Indicative.
  *   **The Trap:** Students think Counterfactual = False Antecedent and Indicative = Unknown/True Antecedent.
  *   **The Fix:** Point to Sentence 1 again. "We know the heater *did* start the fire. The antecedent ('If the heater didn't') is false. But this is still an **Indicative**."
  *   **Rule:** "It's not about whether the antecedent *is* false. It's about whether you are *pretending* it's false to rewrite history (Counterfactual) or just reasoning from uncertainty/logic within the actual world (Indicative)."
  *   **Address Worry (e):** Terminology. "You might hear 'Subjunctive.' That's grammar (had/would). 'Counterfactual' is what the sentence *does*. We are focusing on what it does."

  #### Phase 5: The Assessment (0:25–0:30)
  *   **The Question:** Do not ask "What is the difference?" Ask them to apply the **Verification Test**.
  *   **Scenario:** "Sarah took the test and failed. We know she didn't study."
  *   **Task:** "Write one Indicative conditional about this that is **True**. Write one Counterfactual conditional about this that is **False**."
  *   **Correct Answer Example:**
      *   *Indicative (True):* "If Sarah didn't fail, she passed." (Reasoning from the fact that she took the test).
      *   *Counterfactual (False):* "If Sarah hadn't failed, she would have studied." (Rewriting history: If she didn't fail, maybe the test was easy, not that she studied).
      *   *Actually, simpler:*
      *   *Indicative:* "If Sarah didn't study, she failed." (True, based on actual outcome).
      *   *Counterfactual:* "If Sarah had studied, she would have failed." (False, based on causal expectation).
  *   **Why this works:** It forces them to distinguish between reasoning from facts (Indicative) vs. reasoning about causal changes (Counterfactual).

  ---

  ### 3. What to Cut (Say this out loud)
  To stay within 30 minutes, you must explicitly tell the group what you are ignoring. This builds trust.

  *   **"I am cutting Possible Worlds Semantics."**
      *   *Say:* "Philosophers use a theory called 'Possible Worlds' to explain this formally. I'm not teaching that today because it requires a whole other vocabulary. We're sticking to 'Actual Facts vs. Rewritten History'."
  *   **"I am cutting Truth Tables."**
      *   *Say:* "Debate team might want to use truth tables. We aren't doing that. Truth tables treat 'If' like a math operator. We are treating 'If' like a tool for reasoning."
  *   **"I am cutting Subjunctive Mood."**
      *   *Say:* "Grammar nerds might call this Subjunctive mood. We don't care about the verb conjugation. We care about whether we are rewriting history."

  ### 4. Handling the "Debate Kids"
  They will try to "win" by finding edge cases.
  *   **If they say:** "But 'would' is the marker."
      *   **You say:** "Usually, yes. But I can say 'If he leaves tomorrow, he would arrive Tuesday.' That's not counterfactual. It's about the *stance* toward reality, not the helping verb."
  *   **If they say:** "Counterfactuals aren't true or false, they're just imagination."
      *   **You say:** "That's a valid philosophical position (Anti-Realism). But for today, we are treating them as claims that can be right or wrong based on causal laws. If I say 'If I dropped this pen, it would fall,' and it floats, I was wrong."

  ### 5. Summary Checklist for You
  1.  **Stipulate the facts** of the Gym Fire clearly (Fire happened, Heater caused it, No Heater = No Fire).
  2.  **Kill the Material Conditional** early (Minute 5).
  3.  **Focus on Verification:** Actual Facts vs. Minimal Change.
  4.  **Break the "False Antecedent" rule** with Sentence 1.
  5.  **Final Question:** Make them construct one True Indicative and one False Counterfactual.

  This plan respects their intelligence but keeps the lane narrow enough to finish in 30 minutes. Good luck.
