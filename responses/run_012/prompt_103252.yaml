prompt: |-
  ok so I'm a junior and I run the philosophy club at my school and next wednesday its my turn to run the session, like 30 min, the group is 8-10 kids mostly sophomores and juniors and a couple of them are on the debate team and think they already know everything about logic. the topic I got stuck with is indicative vs counterfactual conditionals.

  I don't want you to just explain the difference to me, I get it well enough. I need a plan for how to teach it. whats the order the ideas have to come in and why (what actually depends on what), which example carries the whole thing, the misconceptions they're gonna walk in with or develop as we go, and the exact point in the sequence where I should head each one off, plus one question I can ask at the end to see if it actually landed.

  the example I was gonna build it on: our gym burned down last year and the investigator said it was the old heater. so I want to contrast

  'If the old heater didn't start the gym fire, something else did.' (everyone's fine with this)

  'If the old heater hadn't started the gym fire, something else would have.' (everyone should hate this)

  Is that the right example to hang the whole thing on, or is there something better? and what does the carrying example have to have (and not have) for the contrast to actually do its job?

  stuff I'm worried about: (a) they think 'would' is the marker of a counterfactual, so I say 'if the heater would have started it' or whatever; (b) they think counterfactual = the antecedent is false and indicative = the antecedent might be true, but I want to hit them with an indicative one whose antecedent is false ('if the heater didn't do it, then somebody set the fire on purpose,' said when we're 100% sure it was the heater) — where does that go, before or after I hand them the labels? (c) half of debate club is gonna say 'if...then' just means 'not-P or Q' so both sentences come out automatically true — where do I have to pre-empt that, and do I even bring in a truth table at all or does that just make it worse? (d) somebody will say counterfactuals aren't true or false, they're just imagining. also do I touch possible worlds at all (I sort of get the 'closest world' thing but I feel like if I say it wrong its worse than not saying it) — tell me what to cut, and say out loud that I'm cutting it.

  also I keep confusing myself on whether the real distinction is 'indicative vs subjunctive' or 'indicative vs counterfactual,' since 'if the heater didn't do it' isn't subjunctive but can still be false — does that matter for how I teach it, or is that a rabbit hole for this crowd?

  and at the end, one question I can ask that isn't just 'do you get it' but would actually show they can tell which kind a sentence is and why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Junior in high school, runs philosophy club.
      *   **Audience:** 8-10 kids (mostly sophomores/juniors), some debate team (think they know logic).
      *   **Time:** 30 minutes (tight!).
      *   **Topic:** Indicative vs. Counterfactual Conditionals.
      *   **Goal:** A teaching plan (sequence, dependencies, examples, misconceptions, timing of interventions, cutting content, final assessment question).
      *   **User's Proposed Example:** Gym fire (Heater).
          *   Indicative: "If the old heater didn't start the gym fire, something else did."
          *   Counterfactual: "If the old heater hadn't started the gym fire, something else would have."
      *   **User's Worries:**
          *   (a) "Would" as the sole marker.
          *   (b) Truth of antecedent (False Antecedent Indicatives).
          *   (c) Material Conditional/Debate Club ("Not-P or Q").
          *   (d) Truth values vs. Imagination & Possible Worlds.
          *   (e) Terminology confusion (Indicative/Subjunctive vs. Indicative/Counterfactual).
      *   **Constraint:** Don't just explain the difference; provide a pedagogical plan.

  2.  **Evaluate the Proposed Example (Gym Fire):**
      *   *Pros:* Concrete, relevant to school, causal intuition is strong.
      *   *Cons:* The counterfactual ("something else *would* have") is actually controversial in philosophy (determinism vs. indeterminism). If the heater was the *only* spark source, maybe nothing else would have happened. If there were other spark sources, maybe something else would have. This might get bogged down in physics/causality rather than logic/semantics.
      *   *Verdict:* It's *okay*, but needs tweaking to ensure the intuition pump works. The contrast needs to be about *how we evaluate* the claim, not just the physics. The "Debate Club" objection (Material Conditional) is the biggest risk here. If $P$ is false (Heater didn't start it), then $P \to Q$ is vacuously true in classical logic. But intuitively, the counterfactual feels false or at least distinct from the indicative.
      *   *Better Example?* Kennedy assassination is the classic (If Oswald didn't shoot, someone else did vs. If Oswald hadn't shot, someone else would have). But it's distant. A "Missed Bus" or "Failed Test" scenario is often more relatable. However, the Gym Fire is fine *if* managed correctly. Let's stick with the user's example but refine the specific sentences to maximize the intuitive clash.
      *   *Refinement:* Make sure the causal background is clear. "The investigator proved it was the heater."

  3.  **Address the Specific Worries:**

      *   **(a) "Would" as marker:** Need to show tense/mood matters, not just auxiliary verbs.
      *   **(b) False Antecedent Indicatives:** This is the "Adams' Thesis" / Gibbard's proof territory. Crucial to introduce *after* the intuition is set but *before* labeling.
      *   **(c) Debate Club (Material Conditional):** This is the biggest threat to a 30-min session. If they reduce it to truth tables, the distinction vanishes. Need to address this early but not get bogged down in formal logic. Frame it as "Logic vs. Meaning."
      *   **(d) Truth Values & Possible Worlds:** Cut Possible Worlds. It's too technical for 30 mins with HSers. Stick to "How do we check if this is true?" (Evidence vs. Imagination).
      *   **(e) Terminology:** Stick to "Indicative vs. Counterfactual." Subjunctive is grammatical mood, Counterfactual is semantic function. Don't confuse them.

  4.  **Drafting the Sequence (The "Order of Ideas"):**

      *   *Phase 1: The Hook (Intuition).* Don't give labels yet. Give the two sentences. Ask: "Are these saying the same thing?"
      *   *Phase 2: The Debate Club Trap.* They will say "It's just logic." Address the Material Conditional objection immediately. Show why truth tables fail here.
      *   *Phase 3: The Diagnostic Test.* How do we verify them? (Looking at evidence vs. Rewriting history).
      *   *Phase 4: The Labels & The False Antecedent.* Now introduce terms. Hit the "False Antecedent Indicative" here to break the "Counterfactual = False Antecedent" rule.
      *   *Phase 5: Wrap & Assess.*

  5.  **Refining the Example:**
      *   The Gym Fire is good.
      *   Sentence A (Indicative): "If the heater didn't start the fire, it was arson." (Assume we know it was the heater).
      *   Sentence B (Counterfactual): "If the heater hadn't started the fire, the sprinklers would have triggered." (Wait, need something that feels *different*).
      *   Let's use the classic Kennedy structure but localized.
      *   A: "If the heater didn't cause the fire, the wiring did." (We know heater caused it).
      *   B: "If the heater hadn't caused the fire, the wiring would have."
      *   *Why B is tricky:* Maybe the wiring was fine. So B might be false, while A is true (because "If P then Q" where P is false is vacuously true in material logic, but in natural language, A feels true because of the exclusion of causes, while B feels false because the wiring was safe).
      *   *Actually, let's keep the user's example but sharpen the intuition.*
      *   User's: "If the heater didn't start... something else did" vs "If the heater hadn't started... something else would have."
      *   *Problem:* If the fire *happened*, and it wasn't the heater, *something* must have caused it. So both feel true.
      *   *Fix:* Make the consequent specific.
      *   Ind: "If the heater didn't start the fire, the principal is relieved." (Fact: Principal is relieved because we know it was an accident/heater).
      *   Counter: "If the heater hadn't started the fire, the principal would be relieved." (Fact: If the heater didn't do it, maybe arson did, so principal *wouldn't* be relieved).
      *   *Wait, simpler:* Stick to the cause.
      *   Ind: "If the heater didn't do it, we are looking for a criminal." (True, because if not heater, then arson).
      *   Counter: "If the heater hadn't done it, we would be looking for a criminal." (False, because if the heater hadn't done it, maybe there would be no fire at all).
      *   *Decision:* The User's example is *okay* but risky on the "something else" clause. I will advise them to tweak the consequent to ensure the truth values diverge intuitively.
      *   *Better:* "If Oswald didn't shoot Kennedy, someone else did" vs "If Oswald hadn't shot Kennedy, someone else would have." (The classic).
      *   *School version:* "If Sarah didn't cheat on the test, she's a genius" vs "If Sarah hadn't cheated on the test, she would have failed." (Assume she did cheat).
      *   *Let's stick to the Gym Fire but refine the Consequent.*
      *   Ind: "If the heater didn't cause the fire, the insurance won't pay." (Because arson isn't covered).
      *   Counter: "If the heater hadn't caused the fire, the insurance wouldn't pay." (If the heater hadn't caused it, maybe no fire happens -> Insurance pays nothing? Or maybe arson -> No pay).
      *   *Okay, I need to tell the user exactly how to tune the example.* The key is that Indicatives rely on *actual world knowledge* (including the fact that the fire happened), while Counterfactuals require *rewinding history* (maybe no fire happens).
      *   *Revised Example:*
          *   Fact: The heater caused the fire.
          *   Ind: "If the heater didn't cause the fire, the fire was caused by something else." (True, fire exists).
          *   Counter: "If the heater hadn't caused the fire, there would still be a fire." (False, maybe no fire occurs).
      *   *This creates the divergence.*

  6.  **Addressing the "Debate Club" (Material Conditional):**
      *   Do not use truth tables. It kills the vibe.
      *   Address it as "The Logic Class Objection."
      *   Explain that Material Conditionals care only about truth values, but Conditionals care about *connection*.
      *   Cut: Formal semantics, possible worlds terminology. Keep it conceptual ("closest world" -> "most similar scenario").

  7.  **Addressing Terminology:**
      *   Indicative vs. Counterfactual is the functional distinction.
      *   Subjunctive is the grammar.
      *   Tell them: "We are talking about how we *use* them, not just grammar."
      *   Cut the Subjunctive rabbit hole.

  8.  **Final Assessment Question:**
      *   Needs to test the *evaluation method*, not just label spotting.
      *   Scenario: A broken window.
      *   Ask them to construct one of each where one is true and one is false.

  9.  **Structuring the Plan:**
      *   **Time Budget:** 30 mins is very short.
      *   **0-5:** Hook (The Two Sentences).
      *   **5-10:** The Debate Club Intervention (Material Conditional).
      *   **10-20:** The Diagnostic (How to verify).
      *   **20-25:** Labels & False Antecedent Indicative.
      *   **25-30:** Final Question.

  10. **Refining the "Cut" List:**
      *   Cut: Possible Worlds semantics (Stalnaker/Lewis).
      *   Cut: Subjunctive mood grammar deep dive.
      *   Cut: Truth Tables.
      *   Cut: Gibbard's Proof (too complex).

  11. **Self-Correction/Review:**
      *   *Wait, one major issue:* If I tell them "Counterfactuals imagine a different past," the Debate kids will say "That's not logic, that's psychology."
      *   *Counter:* Frame it as "Truth Conditions." What makes the sentence *true*?
      *   *Indicative:* Consistent with what we know about the actual world.
      *   *Counterfactual:* Consistent with the closest world where the antecedent is true. (Simplify this to "minimal change").
      *   *User's Worry (b):* False Antecedent Indicative. This is the "Gibbard Case." "If the heater didn't do it, someone else did." We know heater did it. Antecedent false. Sentence feels true.
      *   *Placement:* Introduce this *after* they think Counterfactuals = False Antecedent. Break that rule.

  12. **Final Polish:** Ensure the tone is supportive but firm on the pedagogy. The user is a peer (junior), so don't talk down, but provide structure.

  *(Self-Correction on the Example)*: The user's example ("something else did" vs "something else would have") is actually the famous Kennedy example (Warren Commission). It works *if* the causal background is set up right.
  *   Fact: Fire happened. Heater caused it.
  *   Ind: If heater didn't cause it, something else did. (True, because fire exists).
  *   Counter: If heater hadn't caused it, something else would have. (False/Debatable, because maybe no fire happens).
  *   *Instruction:* Tell the user to explicitly state: "Assume if the heater hadn't malfunctioned, the fire never happens." This forces the divergence.

  13. **Final Check on Debate Club:** They will try to win. Give the user a "Shut Up" move (politely). "That's Material Implication. We are talking about Natural Language Conditionals."

  14. **Final Question:** Needs to be a "Apply the test" question. "Here is a scenario. Write one indicative that is true and one counterfactual that is false."

