prompt: |-
  ok so I'm a third-year phil student, currently in a seminar on modality and essence, and I need a hand from someone who actually works on this stuff rather than someone who's just read the same three papers I have. Answer as a philosopher who works on modality and essence, and walk me through it step by step. We did the necessity-of-origin material (Kripke, the table and the different block of wood, etc.) and I'm fine with the basic intuition. The problem is a friend in my study group wrote up an arguement that we've both now sharpened to the point where neither of us can see where it slips, and if it doesn't slip then the whole position eats itself. Before you answer, please brainstorm the two or three places a chain like this usually goes wrong (an equivocation, a scope slide, a relation that doesn't transmit the way it's assumed to, etc.), then commit to the one you actually think is doing the damage. Don't just hand me a menu of positions — tell me which numbered step you'd give up, why that step looked innocent, and what I'm buying if I give it up. If the honest answer is "you have to give up (1)," fine, but price it for me.

  Here's the argument.

  (1) Necessity of origin. For anything that comes into being, the particular material it actually came from is essential to it. This table could not have been made from a different block of wood; if it had been, that would have been a different table. Same for me: the sperm and egg I actually developed from are essential to me — a person who developed from a different sperm isn't me, however similar he turns out.

  (2) And the reason for that isn't something special about gametes or blocks of wood. The reason is that what makes an individual the individual it is, is where it came from. Its origin is its causal source, and that's what carries its identity across possible worlds. That's the whole engine of the view.

  (3) But the gametes aren't a source in any deep sense. They're just where we happen to stop looking. The sperm that made me was produced by my father's body; his body was produced by his parents; and so on. Every link in that chain is exactly as much a causal source of me as the sperm and egg are. If being a causal source is what earns something a place in my essence, they all qualify equally.

  (4) So by the reasoning in (2), my origin isn't the gametes. My origin is the whole causal history that produced me.

  (5) Whatever my origin is, it's essential to me. (That's just (1) restated with a variable in it.)

  (6) So the whole causal history that produced me is essential to me. In no possible world where I exist did my mother have toast instead of cereal the morning I was conceived. In no possible world where I exist did my grandfather miss his boat.

  (7) That's crazy, and it's crazy before anyone mentions determinism or free will — I'm not worried about whether I could have chosen otherwise, I'm worried that the view is now saying that what some stranger ate for breakfast in 1955 is part of what I am. And it can't be rescued by saying those things are "part of the causal history" but not "part of my origin," because (3) is exactly the claim that there's no principled line there.

  (8) So either necessity of origin is false — the other-sperm kid would have been me after all — or (6) is true.

  I'd like to keep (1); the intuition there still seems right to me and I don't think I'm just being sentimental about it. But (6) seems worse than giving up almost anything else. Also, a friend told me the fix is "origin just means the gametes, full stop," which feels to me like asserting the conclusion rather than arguing for it — but maybe that's unfair, tell me if it is. And please don't just tell me to go counterpart-theoretic unless you really think that's the only exit; if it is, say so and tell me what I'm paying. I'd also definately like to know whether the repair you recommend is a seperate patch or whether it changes what "essential" is doing in (1) as well.

  So: which step goes, why did it look fine, and what's the smallest coherent repair?
