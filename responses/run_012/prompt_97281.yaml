      *   *Decision:* **"The Blindfolded Architects."** You are building a house together. You claim you want a big kitchen; they claim they want a big garage. You build both. But maybe they actually wanted a pool, and now you're stuck with a house neither truly maximizes, or they lied to get you to fund the garage they own separately.
      *   *Wait, keep it simple:* **"The Used Car Negotiation"** is classic for asymmetric info. But for *joint gain*, maybe **"The Joint Venture with Hidden Ledgers."**
