answer: |-
  1. In this metaphor, the federalist institutions act as the rider, treaty reforms are the pedalling, momentum is speed, political consensus is balance, the geopolitical landscape is the road, and dissolution is the fall.

  2. The mapping does genuine work regarding momentum, as the Union often relies on forward progress to overcome legislative gridlock and maintain political interest among member states. Without active management, the complex balance of competing national interests can indeed tip into deadlock, resembling a loss of balance.

  3. However, the analogy breaks because a bicycle implies a single rider with a chosen destination, whereas the Union lacks a unified purpose and members cannot simply dismount without severe consequence. Furthermore, a bicycle is stable at any constant speed, yet the EU is often unstable precisely when moving too fast, not only when stationary.

  4. This image smuggles in the assumption that the journey is predetermined and consensual, ignoring complaints that the Union suffers a democratic deficit because citizens never agreed to this specific route. It suggests sovereignty is merely the act of pedalling rather than the right to choose whether to ride at all.

  5. The conclusion that stasis means collapse does not survive the audit, especially since one rider has now got off and the bicycle has not fallen over. A convoy of lorries travelling at different speeds would serve better, as stopping one vehicle does not necessarily crash the entire procession.
