answer: |-
  The practice of granting amnesty in exchange for truth (exemplified by the South African Truth and Reconciliation Commission) represents a deliberate deviation from the logic of ordinary criminal law. To understand it, we must reconstruct the normative architecture that makes this exchange intelligible, distinct from both blanket impunity and standard prosecution.

  ### 1. The Implicit Theory of Purpose
  The practice presupposes a **theory of transitional justice** where the primary good is not the satisfaction of individual desert, but the **restoration of the civic bond**.

  In ordinary criminal law, the state punishes to vindicate the norm and satisfy the debt owed to society by the offender. In the amnesty-for-truth model, the state presupposes that the society is in a **constitutive crisis**. The "crime" is not merely a violation of the law, but a fracture in the shared reality of the polity (e.g., state-sponsored disappearances, systematic denial). Therefore, the purpose of the practice is **epistemic and political repair**. It presupposes that a stable democracy requires a shared historical record more urgently than it requires the incarceration of every perpetrator. The theory is that without the truth, the new regime rests on a foundation of lies; without amnesty, the new regime may collapse under the weight of retribution.

  ### 2. Acknowledgment as a Distinct Good
  Does the practice presuppose that public acknowledgment is a good distinct from punishment? **Yes.**

  Ordinary criminal law assumes that a conviction *is* the acknowledgment. The verdict declares the truth. However, in contexts of systemic abuse, the state itself was often the author of the lie. A conviction punishes the individual but may leave the systemic narrative intact (e.g., prosecuting a "rogue officer" while the state denies policy).

  The amnesty-for-truth practice presupposes that victims are owed **narrative restitution**.
  *   **Punishment** addresses the *will* of the offender (inflicting pain to balance the moral scales).
  *   **Acknowledgment** addresses the *status* of the victim (restoring their dignity as a truth-teller whose experience is validated by the sovereign).

  The practice assumes that for political crimes, the harm is not just physical but **ontological**—the victim was treated as non-existent. Therefore, the remedy must be ontological: the state must publicly affirm the victim's existence and suffering. A prison sentence for the murderer does not necessarily locate the remains of the disappeared or confirm the motive of the state. Truth supplies a good (historical certainty and dignity) that punishment cannot.

  ### 3. Alienation of State Authority
  Does the practice presuppose that a legitimate state may alienate its authority to punish? **Yes, but conditionally.**

  It presupposes a **sovereign exception**. The state claims the authority to waive punishment because it claims the authority to define the *conditions of its own survival*.
  *   **Why only this class of wrong?** Ordinary murder is a private wrong against the social contract. Political violence is often a *collapse* of the social contract where the state was a combatant. Prosecuting every combatant in a civil conflict is often practically impossible and politically suicidal. The state alienates its punitive authority here because the "debt" is too large to collect without bankrupting the polity.
  *   **Why only in this currency?** Truth is the only currency the state cannot seize by force. It can seize bodies (imprisonment), but it cannot seize memory or confession without cooperation. Because the goal is the historical record, the state must trade the only thing the perpetrator holds that the state needs: information.

  This presupposes that the state's legitimacy is forward-looking (based on future stability and reconciliation) rather than purely backward-looking (based on enforcing past moral laws).

  ### 4. Strict Requirements vs. Mere Fit
  To isolate the logic, we must distinguish what the practice *needs* to function from what is merely incidental.

  *   **Strictly Required:**
      1.  **Full Disclosure:** The amnesty must be contingent on the specific details of the act. Without this, it becomes blanket impunity.
      2.  **Publicity:** The account must be public. Private truth serves the investigator, but public truth serves the *polity*.
      3.  **Political Motivation:** The act must be politically motivated. This distinguishes the practice from ordinary crime; it treats the perpetrator as a political actor, not a common criminal.

  *   **Merely Fits (Contingent):**
      1.  **Total Amnesty:** The practice could theoretically offer *sentence reduction* rather than total erasure of liability (though this reduces the incentive). Total amnesty is a bargaining chip, not a moral necessity.
      2.  **Individual Hearings:** The truth could be collected collectively; the individual hearing fits a legalistic culture but isn't strictly required for historical record.
      3.  **Victim Presence:** While restorative, the process could technically function with written submissions. The face-to-face element is a value-add for healing, not a logical requirement for truth-extraction.

  ### 5. Underdetermination: Where Retributive and Restorative Theories Overlap
  The practice is underdetermined enough that both Retributive and Restorative theories can license it, though for different reasons. This overlap occurs in the **function of public condemnation.**

  *   **The Restorative License:** Restorative justice focuses on repairing harm. Truth-telling allows victims to heal, communities to understand, and relationships to be re-established. Amnesty removes the obstacle (fear of prison) to this repair.
  *   **The Retributive License:** Strict retributivism demands punishment proportional to desert. However, a *moderate* retributivist can license this practice if they accept two premises:
      1.  **Necessity:** If the alternative is civil war (where no justice is possible), securing partial justice (truth + condemnation) is preferable to no justice.
      2.  **Shaming as Punishment:** Retributivism requires the offender to "pay." Public confession can be construed as a form of **symbolic punishment**. The perpetrator is forced to admit guilt before the community, suffering loss of reputation, status, and moral standing.

  **The Zone of Overlap:** Both theories agree that **impunity (silence + freedom)** is unacceptable. Both agree that **accountability** is necessary. The practice is underdetermined regarding *what constitutes accountability*.
  *   For the Restorative, accountability = taking responsibility to heal.
  *   For the Retributive, accountability = suffering condemnation for the act.
  *   The public hearing satisfies both: it forces responsibility (Restorative) and inflicts social condemnation (Retributive). Thus, both can license the *mechanism* of the hearing, even if they disagree on the *amnesty*.

  ### 6. What Would Change if the Presupposed View Were Replaced?
  If we alter the underlying theoretical presuppositions, the practice must change fundamentally.

  *   **If replaced by Strict Retributivism:**
      *   **Change:** Amnesty is abolished.
      *   **Result:** The state must prosecute regardless of the cost to stability. Plea bargains might allow for reduced sentences in exchange for truth, but liability cannot be erased. The "currency" shifts from *Truth for Freedom* to *Truth for Leniency*.
      *   **Consequence:** Many perpetrators would remain silent; the historical record would remain incomplete; political instability might rise.

  *   **If replaced by Strict Utilitarianism (without the value of Truth):**
      *   **Change:** Truth is no longer a condition.
      *   **Result:** Blanket amnesty is granted if it secures peace. Or, perpetrators are bought off with money rather than immunity.
      *   **Consequence:** Peace might be secured, but the victims receive no acknowledgment. The "epistemic repair" fails; the history remains unwritten.

  *   **If replaced by Ordinary Criminal Law Logic:**
      *   **Change:** The distinction between "political" and "ordinary" crime is erased.
      *   **Result:** State agents are tried as common murderers.
      *   **Consequence:** This ignores the systemic nature of the wrong. It individualizes structural evil. It presupposes the state is a neutral arbiter rather than a participant in the transition.

  ### Summary
  The amnesty-for-truth practice presupposes that **political reconciliation is a public good that can, in exceptional circumstances, outweigh the individual right to retribution.** It treats truth not as evidence for prosecution, but as the *remedy itself*. It relies on the idea that the state can waive punishment because the crime was against the state's own legitimacy, and only the state can restore that legitimacy by trading penalty for narrative. While Restorative justice embraces this naturally, Retributive justice can only license it by reinterpreting public shaming as a form of penalty and accepting the constraint of feasibility. If either of these delicate balances shifts, the practice collapses into either prosecution or impunity.
