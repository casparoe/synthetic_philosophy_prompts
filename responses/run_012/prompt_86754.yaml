answer: |-
  Good evening. Thank you for being here. And thank you for letting me stand up here, even though my husband is currently sitting in the third row, sharpening his jokes for later. He's promised to keep the roast gentle, provided I keep this talk under six minutes. So, I'll be brief.

  This year's campaign theme is "A Life Without Pain." It's a beautiful phrase. It's clean. It's something we can put on a brochure. But standing here tonight, looking at the people who make this clinic work, and the people who make it necessary, I've been struggling with what that phrase actually means.

  Because we have two very special guests here tonight who represent the two extremes of human pain perception.

  There is a gentleman we treat who suffered a stroke. It changed the way his brain processes discomfort. He feels pain perfectly well. If I press a pin to his hand, he says, "That hurts." He can tell you it's burning, sharp, an eight out of ten. But it doesn't bother him. He'll describe the worst agony of his life with a little smile, like he's telling you about a cloudy Tuesday. The sensation is there, but the suffering is gone.

  Then there is a nine-year-old girl we care for. She was born without the ability to feel pain at all. No sensation. Ever. She has a burn scar on her arm from holding a hot pan too long. She has broken bones she didn't notice until she couldn't walk. For her, the alarm system is silent.

  So, look at the paradox. The man has the pain, but not the misery. The girl has no pain, but she lives in constant danger.

  If I stand up here and promise you "A Life Without Pain," I'm lying to the girl. Her life is without pain, and it is fragile. And if I imply that the goal is simply to stop feeling anything, I'm ignoring the man, who shows us that the feeling isn't the enemy—the suffering is.

  So, what am I asking you to fund? What are we selling tonight?

  We are not selling numbness. We are not selling a magic switch to turn off the nervous system. If we did that, we'd be putting our patients in the same danger as that little girl.

  We are funding the middle ground.

  Most of the patients in this room aren't at either extreme. You are in the messy, exhausting middle. You feel the pain, and yes, it bothers you. It stops you from sleeping, from working, from holding your grandchildren. The alarm is ringing, and it won't shut off, and it is screaming that you are in danger even when you are safe on your own couch.

  That is not a failure of toughness. I need to be clear about that. There is a myth that if you could just meditate enough, or think positively enough, or be "strong enough," the pain would lose its grip. That is not true. When pain becomes chronic, it is a disease of the system itself. The wiring is damaged. The signal is stuck.

  What this clinic does—what your donations pay for—is not just trying to silence the alarm. It's helping you rebuild the house so the alarm doesn't ruin your life.

  Sometimes that means medication. Sometimes it means physical therapy. Sometimes it means a psychologist who helps you separate the sensation from the fear. But it never means telling you that your suffering isn't real. It is real. It is physical. And it is valid.

  We are funding the space between "I hurt" and "I can't go on."

  For the donors here tonight: When you give, you aren't buying a cure that might not exist. You are buying dignity. You are buying the ability for a father to play with his son without collapsing afterward. You are buying the chance for a mother to sleep through the night. You are funding the team that stands in the gap between sensation and suffering.

  To our guests of honor: You teach us what pain is, and what it isn't. You remind us that pain is a signal, not a sentence.

  And to everyone else: We can't promise a life without pain. Biology doesn't work that way. But we can promise a life where pain doesn't get to drive the car. We can promise that you won't have to walk this road alone.

  That is worth funding. That is worth fighting for.

  Thank you.
